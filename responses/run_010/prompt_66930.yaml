prompt: |-
  I co-convene an MPhil aesthetics seminar, and a senior colleague of mine has a stock move that reliably ends our definitional debates. When a student proposes necessary and sufficient conditions for being a work of art, he replies that art is like a game: chess and tennis and ring-a-ring-o'-roses share no single feature, yet we deploy the concept competently enough by tracking overlapping resemblances, so the demand for a real definition of art rests on a category mistake about how the concept works. He presents this as Weitz's argument that art is an open rather than a closed concept, and he then presses it further: the historical and institutional proposals that followed — Danto's artworld, Dickie's conferral of status, Levinson's definition in terms of intended regard modelled on past art — are, on his telling, just the discredited project relaunched in a new costume. The analogy is carrying a great deal of weight in that room, and I want to know how much of that weight it can actually bear. Please write in British English throughout, and do not trouble yourself with references or a bibliography; I want the arguments themselves.

  I would like the following:

  1. The mapping, set out explicitly (a table is welcome): what corresponds to the paradigm games, to the rules that constitute a game, to the community of players, and to the invention of a wholly new game. Where a term in the artworld has no obvious counterpart in the source, say so rather than forcing a fit.

  2. The disanalogies, sorted into those that are fatal to the use my colleague makes of the analogy and those that are merely untidy. Two I can see and want tested: games are activities whose constitutive conventions participants can adopt at will, whereas an artefact's candidacy is usually settled retrospectively by a history and an institution it does not control; and resemblance among games is supposed to be available on inspection, whereas the genuinely hard cases in modern art are precisely those perceptually indiscernible from ordinary commercial objects, where seeing whether something is art requires knowing a story rather than comparing appearances.

  3. What the source domain quietly imports about the target: assumptions concerning a settled pre-theoretical extension, membership decided by observers rather than conferred by practitioners, and novelty as mere extension of usage rather than as something requiring justification.

  4. Whether the conclusion survives. Does the games analogy establish that art has no essence at all, or only that any essence it has will not be a perceptual one? Is my colleague's dismissal of Danto, Dickie and Levinson supported by the analogy, or independent of it?

  5. How the analogy fares against two rival diagnoses of the same data: Mandelbaum's complaint that the doctrine of family resemblances is asserted rather than analysed, and that apparent resemblances may rest on non-apparent properties; and Gallie's account of art as an essentially contested concept. Say which better explains our practice, and whether a different analogy — money, say, or citizenship, or a language — would license something more defensible than the one now doing the work.

  Finish with a short verdict: what the seminar should and should not conclude from the comparison.
reasoning: |-
  Okay, the user is co-convening an MPhil aesthetics seminar and has a senior colleague who uses Weitz's game analogy to shut down definitional debates about art. They want to test how robust this analogy really is. Let me break this down step by step.

  First, I need to map the analogy between games and art explicitly. The colleague argues that art, like games, has no essential defining features but relies on family resemblances. So, for games: paradigm examples would be chess, tennis, ring-a-ring-o'-roses; their rules are the constitutive conventions; the community is players who adopt these rules voluntarily; inventing a new game involves creating a new activity with its own rules. 

  Now for art: paradigm examples might be the Mona Lisa, Beethoven's Fifth, etc. But what's the counterpart to rules? Art doesn't have clear constitutive rules in the same way—maybe artistic intentions or institutional acceptance? The community here would be the artworld (artists, critics, curators), but they don't "adopt" art status voluntarily like players choose to play a game. Instead, art status is often conferred retrospectively. For new inventions, like Duchamp's Fountain, it's not just creating something new but getting it recognized as art by institutions, which is different from inventing a game where you just start playing.

  Next, disanalogies. The user already pointed out two key ones. First, games are activities entered into voluntarily with clear rules, while art status is often decided after the fact by institutions, not the creator. Second, game resemblances are perceptual—you can see similarities in how they're played. But in art, especially with modern pieces like Duchamp's readymades, the artwork might look identical to a non-art object (a urinal), so the "resemblance" isn't visual but depends on context, history, and narrative. This seems fatal to the analogy because Weitz's point relies on observable similarities, which don't apply here.

  Then, what does the game analogy sneakily assume about art? It presumes there's a settled pre-theoretical understanding of what counts as art, decided by observers. But in reality, the artworld actively confers status, and new art often requires justification, not just recognition of resemblance. This assumption might overlook the institutional and historical factors that actually determine art status.

  Does the conclusion hold? The analogy might show that art has no perceptual essence, but it doesn't prove there's no essence at all. Institutional theories (like Dickie's) or historical ones (like Danto's) could still capture a non-perceptual essence. So the colleague's dismissal of these theories isn't really supported by the analogy; it's an independent philosophical stance.

  Now, alternative views. Mandelbaum argues that family resemblances might hide deeper, non-perceptual properties (like intention or context), which actually align with institutional theories. Gallie's essentially contested concept suggests that disagreement is inherent to art, which the game analogy can't account for since games aren't contested in the same way. Other analogies like money or citizenship might work better because they involve institutional conferral, similar to how art status is granted.

  Finally, the verdict for the seminar. The analogy is useful to challenge simplistic definitions but fails as a knockout argument. It doesn't discredit institutional/historical theories, and alternatives better explain hard cases. The seminar should question the analogy's limits but not conclude that art can't be defined.
answer: |-
  Below is a structured analysis addressing your queries, adhering to British English and focusing on the arguments themselves.

  ### 1. Mapping the Analogy: Games → Art  
  | **Source Domain (Games)**       | **Target Domain (Art)**         | **Notes**                                                                 |
  |----------------------------------|----------------------------------|---------------------------------------------------------------------------|
  | **Paradigm examples** (e.g., chess, tennis, ring-a-ring-o'-roses) | **Paradigm artworks** (e.g., *Mona Lisa*, Beethoven’s Fifth, *Guernica*) | Both serve as uncontroversial reference points. |
  | **Rules/constitutive conventions** (e.g., checkmate, scoring points) | **Putative defining conditions** (e.g., form, expression, institutional acceptance) | *Disanalogy*: Game rules are *adopted voluntarily* by players; art’s "rules" are often retrospectively *imposed* by institutions. |
  | **Community of players** (who knowingly participate by shared rules) | **Artworld participants** (artists, critics, curators, audiences) | *Disanalogy*: Players *choose* to enter a game’s conventions; artists/audiences may *contest* art’s boundaries involuntarily. |
  | **Invention of a new game** (e.g., creating Quidditch) | **Creation of a radically new artwork** (e.g., Duchamp’s *Fountain*) | *Disanalogy*: New games need only players to adopt rules; new art requires *institutional validation* to be recognised as art. |

  ### 2. Disanalogies: Fatal vs. Untidy  
  - **Fatal Disanalogies**:  
    - **Volition vs. Retrospective Conferral**: Games are *activities* entered into by choice, governed by transparent conventions. Art status is typically *conferred* upon objects/events by external authorities (history, institutions), irrespective of creator intent. An artist cannot "opt in" to art status by fiat (unlike starting a game).  
    - **Perceptual Resemblance vs. Narrative Dependence**: Game resemblances (e.g., goals, rules) *are* perceptible/experiential. Hard cases in art (e.g., Duchamp’s urinal, Warhol’s *Brillo Boxes*) are *perceptually identical* to non-art; their status hinges on *invisible narratives* (intention, art-historical context). The analogy cannot explain why *these* objects are art but their twins are not.  

  - **Merely Untidy Disanalogies**:  
    - **Boundary Vagueness**: Both domains have borderline cases (e.g., is calisthenics a game? Is a doodle art?), but this need not undermine the core analogy.  
    - **Evolutionary Flexibility**: Both concepts adapt historically. However, art’s evolution is more frequently *polemical* (e.g., challenging "what art is"), whereas new games extend existing conventions less confrontationally.  

  ### 3. What the Analogy Quietly Imports  
  - **Settled Pre-Theoretical Extension**: Assumes we agree on paradigm cases (e.g., "everyone knows chess is a game, *Mona Lisa* is art"). But modern art deliberately *destabilises* this consensus (e.g., conceptual art).  
  - **Observer-Centric Membership**: Games are identified by observable features; art often requires insider knowledge of theory/history (e.g., appreciating Duchamp requires understanding his challenge to aesthetics).  
  - **Novelty as Unproblematic Extension**: Treats new games as organic developments. New art, however, often demands *justification* within critical discourse (e.g., "Why is this *art*?"), implying art’s boundaries are policed, not discovered.  

  ### 4. Does the Conclusion Survive?  
  - **Essence**: The analogy *successfully* shows art lacks a *perceptual or functional* essence (like "game-ness"). It does *not* prove art has *no essence whatsoever*; institutional/historical properties (e.g., Danto’s "artworld," Levinson’s "historically indexed intentions") may constitute a non-perceptual essence.  
  - **Dismissal of Post-Weitz Theories**: The analogy *does not support* your colleague’s rejection of Danto, Dickie, or Levinson. Their theories address the *disanalogies* (e.g., non-perceptual criteria, institutional mediation) the game analogy ignores. His dismissal relies on *independent scepticism* about definitions, not the analogy itself.  

  ### 5. Rival Diagnoses & Alternative Analogies  
  - **Mandelbaum’s Critique**:  
    - **Complaint**: Family resemblances may mask a "genetic" (non-perceptual) essence, e.g., art’s *intentional* or *socio-historical* properties.  
    - **Explanatory Power**: Better for hard cases (e.g., *Fountain* is art due to Duchamp’s subversive *intention*, not resemblance to past art). Reveals the game analogy’s blind spot: it assumes all relevant properties are surface-level.  

  - **Gallie’s Essentially Contested Concept**:  
    - **Argument**: Art’s meaning is inherently disputed (e.g., traditionalists vs. avant-garde), with rival definitions serving competing values (beauty vs. critique).  
    - **Explanatory Power**: Superior to the game analogy. Games lack art’s persistent, value-laden conflicts; Gallie explains *why* debates persist (not just *how* we apply the concept).  

  - **Alternative Analogies**:  
    - **Money**: Status depends on institutional systems (cf. Dickie). Explains conferral/retroactive validation (e.g., a £10 note is money because the Bank of England says so).  
    - **Citizenship**: Legally conferred, context-dependent, and contested (cf. art’s institutional theories). More apt than games, as it accommodates authority and historical change.  
    - **Language**: Rules evolve through use, but governed by implicit norms (cf. Levinson). Less intuitive but allows for innovation within traditions.  

  ### Verdict for the Seminar  
  **What You Should Conclude**:  
  - The game analogy *usefully challenges* simplistic definitions of art (e.g., "art must be beautiful/expressive"). It highlights Wittgensteinian "family resemblances" in paradigm cases.  
  - It *fails as a trump card* against institutional/historical theories, which address its fatal disanalogies (retrospective conferral, non-perceptual criteria).  
  - Art’s contested boundary cases (e.g., readymades) are better explained by Mandelbaum (hidden properties) or Gallie (essential contestability).  

  **What You Should Not Conclude**:  
  - That art *has no definable essence*. The analogy only negates *perceptual* essences.  
  - That post-Weitz theories are "discredited." They respond to gaps the analogy exposes.  
  - That novelty in art is as straightforward as inventing a game. Art’s novelty requires discursive justification within a living tradition.  

  **In short**: The analogy is a potent *critique of formalism* but collapses under modern art’s challenges. It should provoke discussion, not foreclose it. Your colleague overstates its reach.
