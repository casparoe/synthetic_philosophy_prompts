  Hmm, the tricky part is balancing Wittgensteinian nuance with analytical clarity. On Certainty is deliberately unsystematic, so I'll have to reconstruct coherent theses from his remarks. Also need to flag where Wittgenstein might be making descriptive vs normative claims—that's often muddy in hinge epistemology.

