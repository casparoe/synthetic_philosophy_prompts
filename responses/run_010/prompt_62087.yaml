  **Report of the Board of Inquiry into the Failure of the Custos-7 Monitoring System at the Lyrecom National Seed Bank Vault**  
  **Report No.:** FSA/INQ/2024/09  
  **Date:** 17 October 2024  
  **Issuing Authority:** Federal Standards Agency (FSA), Office of Technical Compliance  

  ### 1. Factual Information  
  **1.1 Incident Summary**  
  On 12 August 2024, at approximately 04:20 UTC, the Custos-7 environmental monitoring system at Lyrecom National Seed Bank Vault 12 failed to detect a critical humidity excursion beyond the certified tolerance threshold (55% ± 0.5%). The failure resulted in condensation-induced spoilage of 12,400 seed specimens. The Custos-7 system, manufactured by Kratos Dynamics, Ltd., was certified under FSA Standard 814.5(b), which mandates that the device must (a) know whether a monitored condition obtains, (b) know that it knows this, and (c) maintain this iterated self-knowledge as a verifiable operational state.  

  **1.2 System Description**  
  The Custos-7 monitors humidity within hermetically sealed cold-storage vaults. It samples humidity levels every 60 seconds, with a resolution of 0.01% relative humidity (RH). The system outputs a binary status: "KNOWING" (condition within tolerance; iterated knowledge confirmed) or "ALARMING" (condition breached; iterated knowledge invalid). Per Standard 814.5(b), the "KNOWING" state requires the system to generate an internal validation certificate every 60 seconds attesting to its epistemic certainty.  

  **1.3 Operational Context**  
  Vault 12 maintains long-term seed storage at –18°C. Humidity control is critical; deviations >0.5% from 55% RH risk ice nucleation. Humidity drift occurs due to microscopic seal degradation, averaging +0.006% RH per minute over 100-minute cycles. The Custos-7 was calibrated to detect changes >0.01% RH.  

  **1.4 Failure Sequence**  
  Initial humidity: 54.995% RH at 02:40 UTC. Drift commenced at 02:41 UTC (+0.006% RH/minute). The Custos-7 logged "KNOWING" continuously until 04:20 UTC, when humidity reached 55.511% RH. At 04:21 UTC, the system switched to "ALARMING." Physical sensors confirmed the threshold breach occurred at 04:19 UTC (55.501% RH). The Custos-7 did not alert during the breach.  

  ### 2. Analysis  
  **2.1 Certification Requirement**  
  Standard 814.5(b) certifies devices that satisfy two epistemic conditions:  
  - **C1:** The device knows condition *C* obtains (humidity ≤55.5% RH).  
  - **C2:** The device knows C1 is true.  
  Kratos Dynamics demonstrated compliance via the "KNOWING" state protocol, which requires the device to pass an automated self-verification test every 60 seconds. The test confirms internal sensor consensus and data consistency over a 5-minute rolling window.  

  **2.2 Drift-Induced Failure**  
  The humidity drift rate (+0.006% RH/min) was below the Custos-7’s discriminative threshold (0.01% RH). Consequently:  
  - At Time *t* (e.g., 04:18 UTC), humidity = 55.495% RH. Device records 55.50% RH (rounded), confirms *C* (≤55.5% RH), and attests C1 and C2 ("KNOWING").  
  - At Time *t+1* (04:19 UTC), humidity = 55.501% RH. Device records 55.50% RH (rounded; resolution limit). Internal sensors return identical values to *t*. Self-verification test passes due to data stability. Device attests C1 and C2 ("KNOWING").  
  - *Condition C is false at t+1 (55.501% > 55.5%), but the device reports "KNOWING."*  

  **2.3 Epistemic Breakdown**  
  The rounding protocol and drift rate created indistinguishable states between adjacent minutes. The device could not discriminate between:  
  - State A: *C* true, C1 true, C2 true (valid "KNOWING").  
  - State B: *C* false, C1 false, C2 false (invalid "KNOWING").  
  The self-verification test could not detect State B because it relies on cross-sensor agreement and data stability—both preserved during drift. Thus, the device’s output ("KNOWING") was identical in States A and B. The requirement for iterated knowledge (C2) forced the system to conflate epistemic certainty with operational continuity.  

  ### 3. Probable Cause  
  The failure resulted from an inherent contradiction in FSA Standard 814.5(b) when applied to continuously drifting conditions. The standard requires the device to maintain iterated self-knowledge despite:  
  (a) Environmental drift below the system’s discriminative threshold.  
  (b) The absence of internal markers distinguishing valid from invalid knowledge states.  
  The Custos-7 performed as designed and certified but could not satisfy C2 at the margin where drift masked the transition from *C* true to *C* false.  

  ### 4. Safety Recommendations  
  **4.1** Revoke FSA Standard 814.5(b) for monitoring applications involving continuous environmental drift.  
  **4.2** Prohibit iterated self-knowledge requirements in safety-critical monitoring systems. Replace with direct tolerance thresholds and explicit uncertainty margins.  
  **4.3** Recall all Custos-7 units operating under Standard 814.5(b). Retrofit with analog humidity alerts independent of epistemic self-verification.  
  **4.4** Require environmental drift-rate testing for all future monitoring certifications.  

  ### 5. Supplementary Opinion (Dr. E. Voss, Board Member)  
  I concur with the analysis but dissent on Recommendation 4.1. Standard 814.5(b) fails due to implementation flaws, not conceptual error. The Custos-7’s rounding protocol created artificial data stability. Tightening the standard would mitigate this:  
  - **Revised C2 Test:** Require devices to simulate +0.01% RH/min drift during self-verification. Fail "KNOWING" if the simulation alters sensor consensus.  
  - **Enhanced Resolution:** Mandate resolution 10× the maximum expected drift (e.g., 0.001% RH).  
  - **Dynamic Margins:** Incorporate real-time drift estimates into knowledge thresholds.  
  Abandoning iterated knowledge forfeits a vital layer of assurance. The revised standard would isolate drift as a measurable variable rather than a systemic flaw.  

