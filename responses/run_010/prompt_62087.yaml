  **Note on Construal of the Knowledge Norm**

  I built the piece on a margin-for-error-style constraint on knowledge. Specifically, I took the certification clause to require that the device's knowledge at any moment must be robust across a neighborhood of moments (or states) that are indistinguishable to it. The drift creates a sorites-like series where, at each step, the device cannot distinguish the current state from the previous one. Therefore, if it knows the condition holds at t0, it must (by the margin for error) also know it holds at t1 (since t1 is indistinguishable). But at the end of the drift, the condition no longer holds, yet the device (due to indistinguishability) still believes it holds and believes it knows. This violates the factivity of knowledge (if one knows p, then p is true). The margin-for-error principle explains why the iterated knowledge requirement fails: the device cannot have second-order knowledge at the margins because it cannot discriminate the point at which the condition fails.

