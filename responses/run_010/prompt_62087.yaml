  1. **Truncation vs. Rounding**: I had the device truncate (rather than round) the pressure reading to two decimals. This allowed the log to show the truncated value as 1.30 even when the actual pressure was 1.309 (which is above 1.30). The cost is that truncation is less common in real systems (which typically round). But rounding would have caused the log to jump earlier (at 1.305, which rounds to 1.31) and might have triggered the alarm at 15:05. Truncation extends the period of deception.

