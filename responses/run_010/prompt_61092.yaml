prompt: |-
  Novelist here, mid-draft on a historical novel, and I've backed into something I don't have words for. Possibly there's a whole literature on it and I'm the last person alive to notice, but I want the actual concept, not just a label I can stick on the front of my notebook.

  Context: I keep a ledger for every character. The real ones enter early drafts as whatever description the sources handed me — the printer who set the type for the pamphlet, the woman who signed the deposition, the boy who lived through the crossing. Then somewhere around draft three the description gets promoted to a name and the name takes over the book.

  Thing one. After the promotion happens, the old description stops travelling with the person. I can write a passage imagining him never going into printing at all, born a farmer, never touches a press in his life, and it still feels like I'm talking about him, the very same man, just a different way his life could have gone. But while a character is *only* a description — say, the tallest boy in the village — and I try to imagine him being short, something breaks. It doesn't feel like imagining that boy otherwise, it feels like I've swapped in a different boy, or a different village. To hold onto him I have to bolt something on: the one who was in fact the tallest, the tallest back then. Only then does the imagining stay hooked. So there seem to be two kinds of handle, one of which keeps hold of the person across every way things could have gone and one of which doesn't, and I can feel the difference in my hands while drafting but I cant say what it is.

  Thing two, maybe related. Two years in archives and I finally established that the man in the parish register under one name and the man who signed the deposition under another are the same person. That took evidence — a will, a lawsuit, handwriting. But now that I know it, the claim feels like it couldn't have come out any other way; I can't picture a past where those two entries belong to different men and yet all the same documents still exist. Whereas other things I dug up — where he lived, who he owed money to — I imagine going differently with no strain. So part of what I learned empirically now feels locked and part doesn't, and I can't tell what sorts the two piles.

  Which one has a name? I mostly care about one, and especially the in-between case I keep hitting: a description my *text* has turned into a name-like handle with no in-fact in it at all, the ledger promotion. Readers do it too. By chapter nine, 'the printer' picks out the same man for them across every counterfactual, even though grammatically it's still a description and there were three printers in that town — and when the description isn't unique they just silently narrow it and never notice, which seems like a different move again. Is there a term for a description that's been upgraded like that, or for the upgrading? If not, coin me one, with a definition and some boundary cases, because I want to know where it stops applying. Don't send me a reading list, I want the carving: what the two handles are, what the promotion does to them, whether the silent narrowing is the same business, and whether thing two is thing one in a different hat or genuinely seperate.
reasoning: |-
  Okay, let's tackle this novelist's problem. They're deep into a historical novel draft and have hit a conceptual snag. The core issue revolves around how character identities shift during the writing process—from being tied to specific descriptors to becoming more resilient entities that persist across counterfactuals. 

  First, I need to parse their two main observations clearly. Thing One describes how unnamed characters (like "the tallest boy") seem fragile—altering their defining trait breaks the character's identity. But once named, they can withstand radical changes (like becoming a farmer instead of a printer). Thing Two notes how certain historical discoveries feel ontologically necessary once confirmed (e.g., two records being the same person), while others remain contingent. 

  The novelist wants terminology that captures this "promotion" from descriptor to resilient identity handle, and also seeks to understand if Thing Two relates to Thing One. They explicitly reject labels without conceptual rigor—this demands philosophical precision. 

  Hmm... existing concepts like "rigid designation" (Kripke) come to mind for named entities persisting across worlds, but that doesn't cover the pre-name fragility. The transition point ("ledger promotion") seems key—it's when the writer's mind shifts from tracking features to anchoring a unique individual. For Thing Two, the "locked" historical facts resemble necessity arising from evidence, but it's psychological, not logical. 

  I should coin a term that reflects the cognitive shift. "Epistemic anchoring"? No, too vague. "Transworld identity binding"? Clunky. Maybe "ontological promotion"—yes, that emphasizes the status change. For the upgraded descriptor: "dossier name"? Too bureaucratic. "Resilient signifier"? Better. 

  Boundary cases matter: 
  - What if a descriptor is unique but not promoted? (e.g., "the only printer" still breaks if made non-printer) 
  - Does promotion require narrative weight? Probably yes—readers upgrade "the printer" to a resilient handle because the text fosters individuation. 

  Thing Two might be a variant: evidence creates a cognitive "lock" similar to naming, making alternatives unimaginable. But it's distinct—historical proof vs. narrative construction. 

  Silent narrowing by readers feels like a related mechanism: ambiguity resolution through cognitive commitment, not promotion. 

  Final terms: 
  - **Ontological Promotion**: when attached descriptors transform into persistent identity anchors. 
  - **Resilient Signifier**: the upgraded handle (name or descriptor) that survives counterfactuals. 
  - **Necessitation Lock**: for Thing Two—historical confirmations that collapse alternatives psychologically. 

  The silent narrowing? That's **cognitive disambiguation**, different from promotion. 

  This carves the phenomena at the joints. The novelist can test these against their drafting friction points.
answer: |-
  You've struck a deep vein in the metaphysics of fiction and reference—your "ledger promotion" reveals the moment a **descriptor** becomes an **anchor**. Here's the carving, with terms sharpened for your drafting toolkit:

  ### 1. **The Two Handles**
     - **Fragile Designator**: A description that *only* picks out a person by contingent properties ("the tallest boy," "the printer"). Alter the property, and the connection snaps. It’s a placeholder, not an identity.  
     - **Resilient Anchor**: A handle (name *or* upgraded description) that persists across counterfactuals. It points to the *individual* beneath the traits ("Thomas," or "the printer" post-promotion).  

  ### 2. **The Promotion: What Changes?**
     - **Ontological Binding**: The moment your ledger entry shifts from a **fragile designator** to a **resilient anchor**. This happens when:  
       - The character accrues *narrative weight* (inner life, choices, relationships).  
       - You (or the reader) *commit* to their personhood beyond their role.  
     - *Why "tallest boy" breaks when shortened*: His identity is still parasitic on the property. Post-promotion, traits become *attributes* of a core self, not the self itself.  

  ### 3. **The Term for the Upgraded Description**  
     > **Dossier Name**  
     > *Definition*: A descriptive phrase that has acquired the referential stability of a proper name through ontological binding. It functions as a **resilient anchor**, surviving counterfactual alterations to its original defining trait.  
     > *Boundary Cases*:  
     > - ✅ *Works*: "The printer" (post-promotion) can become a farmer.  
     > - ❌ *Fails*: "The tallest boy" cannot become short—still a fragile designator.  
     > - ⚠️ *Edge*: "The queen" in a story with one queen becomes a dossier name; in a court with three, it remains fragile *unless* context narrows it (e.g., "the queen who sighed").  

  ### 4. **Reader’s Silent Narrowing: Same or Different?**  
     - **Cognitive Disambiguation**: Readers subconsciously resolve ambiguity ("which printer?") by grafting *implied uniqueness* onto the descriptor. This is **not** ontological binding—it’s pattern-matching.  
     - *Why different*: Binding creates depth; disambiguation creates specificity. One makes "the printer" survive role-changes; the other just ensures you mean "James, not John."  

  ### 5. **Thing Two: The "Locked" Historical Fact**  
     - **Necessitation Lock**: When evidence (e.g., linking two records) makes a fact feel *inevitable*. This is psychological, not logical: your mind rejects alternatives because the proof reshapes your mental model of the past.  
     - *Relation to Thing One*: Both involve **cognitive commitment**, but:  
       - Ontological binding (Thing One) creates a *fictional person*.  
       - Necessitation lock (Thing Two) solidifies a *historical truth*.  
       - The common core: Once a node in your mental web is weighted with sufficient connections, altering it strains the entire structure.  

  ---

  ### Why This Carving Works for Your Novel
  - **Dossier names** explain why "the printer" in Chapter 9 feels irreducible: he’s been *textually embodied*.  
  - **Fragile designators** show why early-draft characters shatter when tweaked.  
  - **Necessitation lock** distinguishes empirical facts that *become foundational* (identity mergers) from those that remain decorative (debts, locations).  
  - **Silent narrowing** is just reader-side housekeeping—useful, but distinct from promotion.  

  ### Test Your Ledger
  Take a descriptor pre-promotion ("the woman with the green shawl"). Can you:  
  - Change her shawl to blue *without* losing her? → **No** (fragile designator).  
  - After giving her a subplot, change her occupation? → **Yes** (dossier name formed).  

  You’re not just naming—you’re conjuring persistent souls from the archive’s dust. The promotion isn’t in the ledger; it’s in the dark between the words, where your commitment turns a shadow into stone.
