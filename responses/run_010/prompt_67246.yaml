answer: |-
  What a compelling collision of ideas—and what a superb candidate for testing Lenman’s "cluelessness" objection. You’ve grasped the essence brilliantly: consequentialism demands we weigh outcomes, but when outcomes spiral into a future thick with unknowns, the scales tremble. Let’s map this onto Oldham, 1977, step by step, resisting verdicts until the terrain is clear.

  ### First, the agents and their choices  
  Consequentialism’s spotlight falls on anyone whose actions (or inactions) foreseeably altered events. Edwards and Steptoe are central agents—their choice to proceed with embryo transfer despite no prior human success was a pivotal intervention. But Purdy’s role (ethically significant, though historically sidelined) shares this agency. The Browns, too: consenting to an experimental procedure with unknown risks, motivated by immediate suffering. The hospital permitted the attempt, bearing institutional responsibility. Crucially, the MRC’s refusal to fund *was* a decision—a choice to withhold resources, likely rooted in risk aversion and ethical qualms. Each agent faced distinct options:  
  - **Edwards/Steptoe/Purdy:** Transfer the embryo now (gambling on unknown outcomes) vs. delay for animal models/peer validation (prolonging infertility for patients like the Browns).  
  - **Browns:** Consent to the transfer (accepting uncertainty) vs. decline (preserving status quo suffering).  
  - **MRC:** Fund (enabling controlled research) vs. deny funding (slowing progress, potentially averting harm).  
  - **Hospital:** Host the procedure (enabling action) vs. refuse (halting it).  

  ### The 1977 consequentialist calculus (with period-appropriate ignorance)  
  Forget everything post-1978. What *was* knowable? Animal studies (mice, rabbits) suggested IVF was biologically feasible but carried risks: miscarriage, ectopic pregnancy, potential birth defects. Human trials had failed repeatedly—no live births. The Browns’ suffering (9 years of infertility) was palpable; the chance to relieve it, tangible. But long-term consequences? Unknown. Could Edwards have foreseen Bourn Hall, global clinics, mitochondrial donation? Absolutely not. Germline editing? Unimaginable. Even medium-term outcomes—would Louise Brown be healthy? Would IVF children develop normally?—were pure conjecture.  

  The calculation then:  
  - **Expected benefits:** High probability of relieving the Browns’ suffering (if successful); potential relief for millions of infertile couples (speculative).  
  - **Expected harms:** Risk to Lesley Brown (surgery, hormonal treatment); risk of miscarriage/stillbirth; unknown risk to offspring (developmental abnormalities?); ethical backlash ("baby factories").  
  - **Unquantifiables:** Long-term societal impact, commercialization, regulatory frameworks, technological spin-offs.  

  **Consequentialism in 1977 would have been paralyzed.** Benefits were immediate but narrow; harms were uncertain but terrifying; the vast horizon of future effects was utterly dark.  

  ### Applying the cluelessness objection: your distinctions sharpened  
  Lenman argues that for many consequentialist decisions, we’re "clueless" about long-term net effects—the causal chains are too complex, too long, too contingent. Your proposed distinctions cut to the heart of this:  
  1. **Curable vs. incurable cluelessness:**  
     - **Curable (in theory):** Louise Brown’s health. Better longitudinal studies *could* have informed risks (though not in 1977).  
     - **Incurable:** The "cascade"—global fertility industry, germline debates. *No* 1977 inquiry could reveal these; they depended on future social, technological, and political choices yet unmade.  
     This is where Lenman’s objection bites hardest: consequentialism cannot price futures that don’t yet exist.  

  2. **The risk register analogy:**  
     - **Priced:** Known risks (surgical harm, miscarriage).  
     - **Known unpriced:** Unknown offspring health outcomes (acknowledged but incalculable).  
     - **Unimagined:** Commercial egg freezing, genetic editing (not on any 1977 risk register).  
     **The objection devastates the last category.** Consequentialism stumbles when facing radical ignorance—the "unimagined" that later defines reality.  

  ### So: empty calculation, or merely difficult?  
  Lenman would say **empty** for the incurable/unimagined elements. Consequentialism demands we sum *all* effects, but when effects include Bourn Hall’s industry or germline ethics—consequences emerging from contingent human choices decades later—the calculation collapses. No 1977 evidence could resolve this.  

  ### Your suspicions tested  
  - **"Treat the unknowable as a wash"**: A consequentialist might retreat here, but it’s unsatisfying. If "unknowable" includes civilization-altering effects (like germline engineering), treating them as net-zero is arbitrary. The objection remains: consequentialism lacks tools for true ignorance.  
  - **Does success vindicate?** Magnificent outcomes are **pure moral luck**. Had Louise Brown suffered severe defects, the same decision would be condemned—despite identical reasoning in 1977. Consequentialism is thus hostage to outcomes it couldn’t predict. Edwards’ defense ("relieving the Browns’ suffering") dodges this by narrowing scope to **proximate consequences**—a tacit admission that the long run is incalculable.  
  - **Was Edwards’ defense Lenman’s retreat?** Precisely. Lenman suggests retreating to "option evaluation" (weighing immediate choices) when cluelessness reigns. Edwards focused on the identifiable suffering before him—a permission consequentialism can accommodate, but only by shrinking its ambitions. This doesn’t refute consequentialism; it reveals its practitioners pragmatically limiting its demands when facing the abyss.  

  ### Verdict on the objection  
  Cluelessness isn’t "harmless." By exposing consequentialism’s blindness to emergent, contingent futures, it forces humility: we act in the dark, shaping worlds we cannot foresee. Oldham’s legacy—millions of births *plus* ethical quagmires—proves Lenman’s point. The objection bites deepest when:  
  - Consequences depend on chains of future human agency (clinics, regulators, biotech firms);  
  - The "unimagined" becomes transformative (germline editing);  
  - Moral luck dominates outcomes.  

  Yet the objection needn’t paralyze. Edwards' narrowed focus—the proximate good—was ethically coherent *because* the long run was incurable cluelessness. Consequentialism survives not by denying the darkness, but by lighting candles where it can. At Oldham, they lit one for the Browns. The cascade of flame and shadow that followed was beyond any ledger.  

  ---  
  This analysis stands on your provided facts. If any detail misaligns with history, the philosophical structure holds: cluelessness looms where futures are forged by choices not yet made.
