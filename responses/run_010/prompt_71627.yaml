answer: |-
  ## 1. What I'm Committed To
  The procedure rests on three Keynesian pillars:  
  1.  **Non-Numerical, Non-Comparable Probability:** Probability isn't a number derived from frequency or subjective belief; it's a logical relationship *specific to the evidence at hand*. A probability based on rich data about a stable system is fundamentally different (and incomparable) to one based on scraps about a chaotic one. You cannot meaningfully assign a number or rank probabilities across dissimilar evidence bases.  
  2.  **Weight of Argument (vs. Probability Balance):** "Probability" captures the *direction* the evidence points (e.g., towards profit or loss). "Weight" captures the *robustness* of that evidence – its volume, quality, and relevance. High weight means a solid basis, even if the probability balance is slight; low weight means a fragile basis, even if the probability balance seems strong.  
  3.  **Conventions & Their Failure Points:** Decisions rely on *conventions* – stable, shared assumptions (e.g., "the climate pattern holds," "demand grows at 1.5%"). These aren't probabilistic forecasts; they are practical anchors. We only abandon them upon identifying *specific, definite reasons* for change, not gradual uncertainty. Conventions fail suddenly at identifiable junctures (e.g., a new regulation, a competitor's move).

  **What Gets Thrown Out:**  
  *   **Point Forecasts as Truth:** Single-number DCF outputs are discarded as misleading.  
  *   **Mechanical Sensitivity Analysis:** Spinning dials on variables ignores evidence weight and convention dependence.  
  *   **Subjective Probability Assignments:** Forcing a number onto unknowable factors via "expert judgment" is rejected (Principle of Indifference violation).  
  *   **Comparability of Dissimilar Risks:** Treating the risk of pipe corrosion (high weight) like the risk of AI disrupting data centers (low weight) as comparable inputs is banned.

  ## 2. The Procedure
  **Goal:** Classify proposals into: **APPROVE, REJECT, or REFER TO BOARD (with specific unresolved questions).** Focus on evidence weight and convention stability. Time: ~3 weeks/proposal.

  1.  **Evidence Inventory & Relevance:**  
      *   *Question:* "What is the *specific evidence* directly relevant to the proposal's core value drivers (costs, revenues, longevity, key risks)? List sources and dates."  
      *   *Sufficiency:* A concrete list distinguishing *direct* evidence (e.g., pilot plant data, signed LOIs) from *indirect/analogous* evidence (e.g., another utility's desal costs, generic data center growth stats). No speculation.  
      *   *Exit:* If no direct evidence exists for a *critical* driver (e.g., future water salinity levels for desal OPEX, anchor tenant creditworthiness for offtake), flag that driver as **"Evidence Vacuum."** Proceed, but this severely impacts Step 3.

  2.  **Weight of Argument Assessment (Per Critical Driver):**  
      *   *Question:* "For each critical value driver identified in Step 1, assess Weight: Is the evidence **High** (abundant, recent, directly applicable, reliable source), **Medium** (some direct evidence but gaps/aging, or strong analogous evidence), or **Low** (scant, outdated, indirect, speculative)?"  
      *   *Sufficiency:* A clear High/Medium/Low rating for *each* driver, justified by the evidence inventory. Focus on *quality/relevance*, not quantity of slides.  
      *   *Exit:* If *any critical driver* has **Low weight AND relies on a convention** (Step 3), flag as **"Fragile Foundation."** If *any critical driver* is an **"Evidence Vacuum"**, flag as **"Unknowable Core."** Proceed.

  3.  **Convention Identification & Stability Check:**  
      *   *Question:* "What fundamental, *non-probabilistic assumptions* (conventions) underpin the proposal's viability? (e.g., 'Current hydrology persists,' 'Industrial electricity costs trend X,' 'Data center demand grows regionally'). For each: Is there a *specific, definite reason* grounded in Step 1 evidence to expect this convention to fail within the project's horizon?"  
      *   *Sufficiency:* A concise list of key conventions. A "Stable" (no definite reason for near-term failure) or "Threatened" (specific, evidence-based reason identified) rating for each. "Definite reason" means observable trends, policy announcements, technological shifts – *not* general uncertainty.  
      *   *Exit:* If a **critical convention is "Threatened"**, flag as **"Convention at Risk."** If the proposal *lacks a stable convention* for a core function (e.g., assuming data center gets built without a clear industry coordination mechanism), flag as **"No Anchoring Convention."** Proceed.

  4.  **Probability Balance (Directional, Non-Numeric):**  
      *   *Question:* "Based *only* on the evidence in Step 1, ignoring weight for now, what is the *directional* probability balance for the core proposition: 'This investment creates net long-term value for the utility'? **Positive** (evidence leans towards value), **Neutral/Unknown** (evidence balanced or absent), **Negative** (evidence leans against value)?"  
      *   *Sufficiency:* A single directional rating (Pos/Neu/Neg). *No numbers.* Must reference specific evidence. If evidence is truly balanced *and high weight*, Neutral is valid. If evidence is absent (Vacuum), it's Neutral/Unknown.  
      *   *Exit:* If **Negative**, proceed to Step 5 but likely REJECT. If **Neutral/Unknown** due to Evidence Vacuum on critical drivers, flag reinforces "Unknowable Core."

  5.  **Synthesis & Recommendation:**  
      *   *Question:* "Synthesize Steps 2-4: Does the combination of Weight, Convention Stability, and Probability Balance support a confident decision? If not, what *specific, non-evidence* questions remain for the Board?"  
      *   *Decision Logic:*  
          a.  **REJECT:** If Probability Balance is **Negative** OR if there is **"Unknowable Core"** (critical driver with *no evidence*) OR if **"No Anchoring Convention"** exists.  
          b.  **REFER TO BOARD:** If Probability Balance is **Neutral/Unknown** AND Weight is **Low** OR a critical Convention is **"Threatened"** OR there is **"Fragile Foundation"** (Low Weight + Convention reliance). State the *specific unresolved question* (e.g., "Board must decide if potential upside justifies bearing unknown climate risk," "Board must judge if subsidizing anchor tenant risk aligns with public mandate").  
          c.  **APPROVE:** *Only* if Probability Balance is **Positive**, Weight is **High/Medium** for *all critical drivers*, *and* all Conventions are **Stable**. Confidence comes from robust evidence on known factors within a stable frame.  
      *   *Sufficiency:* A clear RECOMMEND (Approve/Reject/Refer) with explicit reasoning referencing the flags/ratings. For Refer, the precise question for the Board is mandatory.  
      *   *Exit:* Recommendation output. No loopbacks; insufficient evidence or unstable conventions trigger Reject or Refer.

  ## 3. Where It Isn't Really A Procedure
  *   **Weight Assignment (Step 2):** Judging "relevance" and "quality" is inherently subjective. A **bad actor** deliberately downweights inconvenient evidence ("That study is old, so Low weight") or upweights favorable fluff ("Industry blog says data centers booming, Medium weight!"). A **lazy analyst** defaults everything to Medium to avoid hard calls. *Mitigation:* Require specific justifications referencing the evidence list. Force High/Low calls; ban "Medium" as a cop-out for critical drivers.
  *   **Identifying "Definite Reasons" for Convention Failure (Step 3):** Distinguishing a specific threat ("State published draft regs capping groundwater") from general uncertainty ("Climate models vary") is judgmental. A **bad actor** ignores emerging threats to preserve "Stable" or invents minor concerns to force "Threatened." A **lazy analyst** labels everything "Stable" to avoid research. *Mitigation:* Demand concrete evidence for "Threatened" status (e.g., a document, a specific event). "Stable" is the default absent such evidence.
  *   **Directional Probability Balance (Step 4):** Weighing conflicting evidence directionally is interpretive. A **bad actor** focuses only on evidence supporting their pre-conceived answer. A **lazy analyst** calls everything "Neutral/Unknown." *Mitigation:* Require listing *all* key evidence pieces cited in Step 1 and explaining how they collectively point Pos/Neu/Neg. Forced choice.

  ## 4. Case A: Desalination Plant
  *   **Step 1 (Evidence):** Vast hydrological/operational data... for the *past* climate. Climate models project significant divergence (drier, more volatile). Direct evidence on plant performance *in the future climate* is absent (pilot plants are small/short-term). **Evidence Vacuum** flagged for future OPEX (energy use, brine handling) and yield reliability under future hydrology.
  *   **Step 2 (Weight):** Past O&M data: **High** weight but *relevance questionable*. Climate model projections: **Medium** weight (complex models, inherent uncertainty). Future OPEX/Yield: **Low** weight (no direct analogue). **Fragile Foundation** flagged for future performance.
  *   **Step 3 (Conventions):** Convention: "Historical hydrology & climate patterns persist." **Threatened:** Definite reason – overwhelming scientific consensus and observed trends show significant, accelerating climate change impacting the region within the plant's lifetime. **Convention at Risk** flagged.
  *   **Step 4 (Probability):** **Neutral/Unknown.** Rich past data suggests viability, but its relevance is undermined. Future evidence is speculative. No clear directional lean given the paradigm shift.
  *   **Step 5 (Synthesis):** **REJECT.** Core drivers (future OPEX, yield) suffer from "Unknowable Core" (Evidence Vacuum) and rely on a "Convention at Risk" (stable climate). High capital irreversibility amplifies the risk. The team's public defense doesn't create evidence. **Recommendation: Halt project. Re-scope feasibility studies focused explicitly on robust performance across *projected* climate scenarios, if strategically essential.**

  ## 5. Case B: Offtake Contract (Data Center Campus)
  *   **Step 1 (Evidence):** Minimal direct evidence. Draft LOI, site plans exist but contingent. "Data" consists of forecasts from consulting firms & competitors, all based on mutual expectations of AI/growth. No evidence on *this specific campus* or the *coordination* needed among the handful of firms. **Evidence Vacuum** flagged for campus build probability and long-term tenant creditworthiness/need.
  *   **Step 2 (Weight):** Market forecasts: **Low** weight (speculative, self-referential). LOI/site plans: **Medium** weight (indicates intent, not commitment). Campus viability: **Low** weight. **Fragile Foundation** and **Unknowable Core** flagged.
  *   **Step 3 (Conventions):** Convention 1: "Major data center firms will coordinate to build *this* campus." Convention 2: "Long-term demand for hyperscale capacity in *this location* will remain high." **No Anchoring Convention:** No mechanism ensuring coordination exists (it's pure expectation). **Threatened:** Cloud market consolidation, AI chip shortages, or a competitor choosing another site are definite possibilities within 5 years. **Convention at Risk** and **No Anchoring Convention** flagged.
  *   **Step 4 (Probability):** **Neutral/Unknown.** No concrete evidence points strongly towards or away from the campus being built and being a reliable long-term customer. Pure speculation.
  *   **Step 5 (Synthesis):** **REJECT.** Core proposition relies on "Unknowable Core" factors (will they build? will they stay?) and has "No Anchoring Convention" (no force ensuring coordination). The low weight of evidence cannot support commitment. **Recommendation: Do not sign the offtake contract in its proposed form. Pursue a contingent agreement (e.g., shorter term, break clauses tied to campus construction milestones, higher risk premium) if strategically vital, recognizing it transfers minimal risk.**

  ## 6. What Keynes Costs Me
  Keynes makes appraisal **harder and less comforting.** You lose:
  *   **The False Comfort of a Number:** The DCF spits out a NPV, however dubious. Keynes denies you this ritualistic certainty. You must tell the board "We don't and cannot know" far more often, especially for long-term, novel projects.
  *   **Easy Comparability:** Ranking projects by IRR is gone. Comparing a pipe replacement (High Weight, Stable Convention) to a desal plant becomes apples/oranges. You must argue qualitatively about evidence structure, not quantitatively.
  *   **"Cover" from Sensitivity:** Spinning discount rates or growth rates provided pseudo-rigor. Keynes forces you to admit when the inputs themselves are unknowable, removing this fig leaf. The board must confront raw uncertainty.
  *   **Approval Rates:** Projects resting on weak evidence, unstable conventions, or pure hope (like B, possibly A) get rejected outright. This stifles "visionary" but speculative bets and favors incrementalism based on knowns.

  **Tell the Board:** "Our old model gave precise answers that were often wrong, especially for big, long-term bets. This new approach is brutally honest. It tells us *when we know enough to act confidently* (Approve), *when the evidence simply isn't there* (Reject), and *when the decision is fundamentally about your appetite for risk and strategic bets in the face of the unknown* (Refer). It stops us from gambling with ratepayer money dressed up as calculation. Expect fewer big, flashy approvals and more clear 'No's or tough value calls landing on your desk." Expect pushback; comfort is sacrificed for integrity.
