  So here's where I'm at. Fourth year, dissertation on Hume's epistemology of testimony, and I've talked myself into a fairly specific reading of the miracles section that I need someone to try and break.

  My position: the hard reading — but not the standard a priori version. I don't think Part I's maxim is a conceptual claim about what miracle means, and I don't think Hume is smuggling in a definition that rules miracles out by fiat. What I think is that the maxim is in-principle because of the *structure* of the evidence. A law of nature, for Hume, is established by firm and unalterable experience, and a huge chunk of that experience is itself testimony-mediated: other people's observations, records, reports we've found reliable in the past and then absorbed into our baseline. So when testimony is offered against a law, it's being weighed against a baseline it partly constitutes. There's no independent evidential standpoint from which counter-testimony could pile up until it outweighs the law, because whatever you add to the counter side is already baked into the pro side. The bootstrapping never terminates, and that — not the definition — is why the balance can never tip. Part II then isn't a grudging concession that testimony could in principle suffice; it's a survey of why the actual historical record is as bad as it is, which is perfectly consistent with the balance being structurally untippable.

  What would count against this? I want a map of its exposure, sorted.

  - Textual. Which passages sit badly with it, and how badly. I already know about the eight-days-of-darkness case, where Hume says that if authors in all languages agreed on a universal anomaly starting 1 January 1600 and the tradition stayed vivid, philosophers ought to believe it and go hunting for its causes — which looks like a law-violating event he thinks testimony *could* establish. I know about the Indian prince who won't believe the reports of frost, and about the oddly generous things he says regarding the cures at the tomb of the Abbé Paris. Tell me which of those are fatal for me versus survivable, and what it costs me to survive them. And: the maxim is phrased comparatively — the falsehood of the testimony being more miraculous than the fact — which reads like an invitation to calculate. Does my reading have a non-ad-hoc answer to why Hume would phrase an in-principle claim that way? Also worth factoring in the footnote version of the definition, the one that adds a particular volition of the deity or the interposition of some invisible agent.
  - Historical. Anything in the correspondence or in that early draft of the miracles essay he sent Henry Home in the 1730s that shows him thinking in explicit balance-of-probabilities terms.
  - Philosophical, independent of exegesis. Is the bootstrapping structure a real thing, or am I describing something that dissolves the moment you write it down carefully? Give me the case where counter-testimony genuinely accumulates against a testimony-constituted baseline. If a formal treatment is the clearest way to show it (Earman-style, or whatever you prefer), do the formal treatment, and say whether it shows my circularity worry is real or just a confusion about priors versus likelihoods.
  - Interpretive rivals. What does my reading predict about the rest of Hume that the softer, Fogelin-style reading doesn't, and vice versa? Where do the two actually diverge, as opposed to describing the same text in different vocabularies? If they never diverge anywhere, that's a problem for me and I want to hear it plainly.

  And the thing I'm most worried about: have I qualified my way into a position that can't be wrong? I can already hear myself saying that any passage that looks like a concession is really just dialectical — Hume humoring the vulgar. If that's what I'm doing, tell me whether it's a problem for a thesis of this kind. Interpretive theses maybe get insulated differently than empirical ones, or maybe insulation is just a polite name for not having a view. Say which.

  What would move me most: a place where the bootstrapping structure is clearly available to Hume and he conspicuously doesn't use it, or a formal result showing the circularity is an artifact of how I've set the problem up. Rank everything fatal / serious / merely awkward, and be explicit about which objections a hard-reading partisan would concede as counting against them and which they'd just swat.

  Oh, and please write the whole answer in British English. My co-author's in Edinburgh and he'll be reading it over, and I cant be doing the -ize/-ise conversion twice. Ignore the American spelling in here, that's just me.
