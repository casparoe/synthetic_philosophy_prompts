  2. Questions that feel diagnostic but aren't:

     - The causal work question (whether realism requires the direction to be doing causal work) is not used in the tree. I think it is not necessary for the tree because it is already implied in the causal role fixation. If content is fixed by causal role, then the direction is doing causal work. For correlation-based views, they might not require it. So it might be a follow-up question for those views.

     - Also, the polysemanticity question is used as a challenge, but it might not be fundamental to the definition of representation.

  3. Which leaf most working ML people land in?

     - Many ML practitioners who use interpretability tooling every day and haven't thought about philosophy might be in activations-are-representations-by-fiat (leaf 1) or in functional/causal realism without worrying about polysemanticity (leaf 2). But if they've encountered superposition, they might be in leaf 6.

     - However, many might also be in information-without-aboutness deflationism (leaf 3) if they think of activations as carrying information but not intentional content.

     - I think a large number of practitioners are in leaf 1 or leaf 2.

  4. Where am I making a judgment call?

     - I am making a judgment call in grouping the correlation-based views that allow for representation without misrepresentation into leaf 7 (correlation-based realism). Some might argue that without misrepresentation, it's not realism. But I'm following the branch that says misrepresentation is not required.

     - Also, the entire structure of the tree, especially the placement of the by-fiat view in the N branch of the root, is a judgment call. I put it there because if you require misrepresentation, you are less likely to accept by-fiat.

     - The way we handle the absence of information in the N branch (leading to instrumentalism or eliminativism) is a judgment call.

     - The reuse of feature-realist-but-circuit-skeptic for both causal role and correlation-based realism with polysemanticity as a defeater is a judgment call. It assumes that the person is still a realist about features but skeptical about circuits, regardless of how content is fixed.

  Finally, we must note any empty cell. Is there any combination that leads to an empty cell? In the tree, we have covered all branches with leaves. The only potential empty cell might be if someone believes in a different way to fix content (not causal role, not correlation). Then we put them in eliminativism. That might be unattractive to them, but it's a minority view.

  So the tree is as above.
answer: |-
  ### Decision Tree for Neural Net Representation Positions

  **Root Question: Must a state be capable of misrepresenting to count as a representation?**  
  This is the root because it separates views that demand a strict philosophical criterion (e.g., derived from Fodor or Dretske) from those that don't. It forces a choice on whether error is essential to representation, which is foundational and avoids jargon. Most ML practitioners haven’t considered this, so it reveals implicit assumptions.

  ---

  #### Branch 1: Yes, misrepresentation is required.
  - **Q2: Are there states in neural nets capable of misrepresentation?**  
    - **No** → **Flat-out eliminativism** (no representations exist in neural nets; they lack error-capable states).  
    - **Yes** →  
      - **Q3: Is content fixed by causal role (internal dynamics) or correlation (training distribution)?**  
        - **Causal role** →  
          - **Q4: Is polysemanticity a defeater (i.e., does it invalidate representations)?**  
            - **Yes** → **Feature-realist-but-circuit-skeptic** (features exist, but superposition prevents clean attribution).  
            - **No** → **Functional/causal realism** (representations are real and defined by computational role).  
        - **Correlation** →  
          - **Q4: Is polysemanticity a defeater?**  
            - **Yes** → **Feature-realist-but-circuit-skeptic** (as above, but with correlation-based content).  
            - **No** → **Correlation-based realism** (content is statistical, not causal; *new leaf, see diagnosis below*).  

  ---

  #### Branch 2: No, misrepresentation is not required.
  - **Q2: Are activations representations by fiat (i.e., just because we label them so)?**  
    - **Yes** → **Activations-are-representations-by-fiat** (no deeper justification needed).  
    - **No** →  
      - **Q3: Is content fixed by causal role or correlation?**  
        - **Causal role** →  
          - **Q4: Is polysemanticity a defeater?**  
            - **Yes** → **Feature-realist-but-circuit-skeptic**.  
            - **No** → **Functional/causal realism**.  
        - **Correlation** →  
          - **Q4: Is there information (correlation) without intrinsic "aboutness"?**  
            - **Yes** → **Information-without-aboutness deflationism** (activations carry data but lack intentionality).  
            - **No** → **Instrumentalism about features** (features are useful fictions for analysis, not real).  
          - If Q4 unanswered:  
            - **Q5: Does realism require the feature direction to do causal work?**  
              - **Yes** → **Instrumentalism about features** (correlations aren’t causal).  
              - **No** → **Correlation-based realism** (content is real but non-causal).  

  ---

  ### Leaves (Named Positions)
  1. **Activations-are-representations-by-fiat**: We label them, so they are. Common among ML practitioners using tools without reflection.  
  2. **Functional/causal realism**: Representations exist and are defined by causal role. Polysemanticity is noise.  
  3. **Information-without-aboutness deflationism**: Activations correlate with features but lack "aboutness." Polysemanticity is irrelevant.  
  4. **Flat-out eliminativism**: Neural nets have no representations. Misrepresentation failure is decisive.  
  5. **Instrumentalism about features**: Features are pragmatic tools, not real entities. Ignores content fixation.  
  6. **Feature-realist-but-circuit-skeptic**: Features exist, but superposition prevents circuit-level realism.  
  7. **Correlation-based realism** (*new*): Content is fixed by statistical correspondence, not causation.  

  ---

  ### Diagnoses of Empty Cells & Coherence
  - **Correlation-based realism** was added because the logical space demands it: one might assent to representations based solely on correlations (e.g., "direction X tracks cats in the data"). It’s *coherent but uncommon*—philosophers reject it (lacks misrepresentation), and ML practitioners prefer deflationism or instrumentalism.  
  - **Why empty?**  
    - **Pure causal-role-with-correlation-fixation**: Incoherent (causal role and correlation fixation conflict).  
    - **Eliminativism without misrepresentation**: Unattractive (denies even correlational information).  

  ---

  ### Indistinguishable Pairs & Non-Diagnostic Questions
  - **Indistinguishable pairs** (no branch separates them):  
    - **Functional/causal realism** and **Correlation-based realism** when polysemanticity isn’t a defeater: Both land in realism, but the tree separates them via content fixation (Q3).  
    - **Deflationism** and **Instrumentalism** if both deny causal role/correlation: Deflationism requires information; instrumentalism doesn’t. They are separated by Q4 in Branch 2.  
  - **Non-diagnostic questions**:  
    - *"Does realism require feature directions to do causal work?"* Feels crucial but only splits instrumentalism vs. correlation-based realism. It’s **redundant**—answered implicitly in content fixation (causal role implies yes; correlation implies no).  
    - *Polysemanticity as noise/defeater*: **Diagnostic only for realists**, not eliminativists/deflationists.  

  ---

  ### Where Practitioners Land & My Judgment Calls
  - **Most ML practitioners**: Land in **activations-are-representations-by-fiat** or **functional/causal realism** (if they’ve encountered circuits). Those aware of superposition drift toward **feature-realist-but-circuit-skeptic**. Philosophy-heavy attendees lean **deflationism** or **instrumentalism**.  
  - **My judgment calls**:  
    1. **Misrepresentation at the root**: Rejects "soft" representations (deflationism/by-fiat) from strict views. Content fixation (Q3) becomes pivotal—I prioritize it over polysemanticity.  
    2. **Polysemanticity as secondary**: It’s an empirical challenge, not a dealbreaker for realism. This reflects ML practice (e.g., sparse autoencoders "solve" it).  
    3. **Instrumentalism requires denying information**: I tie it to rejecting both causal role and correlation-based content, as it’s a non-realist stance.  

