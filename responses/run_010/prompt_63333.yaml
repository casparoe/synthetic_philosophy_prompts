prompt: |-
  So I'm in my second year on my department's promotions committee — seven tenured faculty, written ballots collected by the chair — and the handbook says a candidate for full professor "shall be recommended if a majority of the committee finds that the candidate satisfies each of the following: distinction in research, effectiveness in teaching, and significant service to the institution." Simple enough on paper. This year's case is going to blow up, and because I'm the one who keeps bringing up aggregation stuff at meetings (my own fault entirely) the chair has asked me to circulate a short memo before we meet on the 14th.

  Here's the arithmetic from the practice ballots we ran last week, which Im treating as a reliable preview. As written, the three criteria came out like this: research passes 5-2, service passes 5-2, teaching passed 4-3 — except that right afterward one member said he should have recused himself from the teaching question since he was her dissertation adviser. He'd voted yes, so pull his ballot out and it's 3-3, and the handbook says literally nothing about ties. Meanwhile, when the chair asked each of us the direct question "should she be promoted, all things considered," exactly one of us said yes. The other six said no, most of them because they privately weight research way more heavily than service and think the three-criterion list doesn't capture that. So the bottom-line majority says reject while the criterion-by-criterion majority says promote. And it's worse one level down: the handbook defines "distinction in research" as either a monograph with a strong press or six-plus articles in top journals. Only three of us say yes on the monograph route (fails 3-4) and only two say yes on the articles route (fails 2-5), and nobody says yes to both — yet five of us voted that she satisfies the research criterion as written.

  What I need from you is the memo itself: a recommendation I can actually put in front of the committee, covering both what we should do with this candidate and what aggregation rule we should adopt in writing before the next cycle, since two more cases come up next year and I dont want to relitigate this from scratch each time. Put the bottom line in your very first sentence — promote, reject, defer and re-ballot under a stated procedure, whatever you genuinely think is right — and then give the reasons, including a serious engagement with the strongest case for the losing side, which as I see it is that bottom-line-first voting is the only rule that takes each member's own all-things-considered judgment seriously instead of forcing seven people with seven different weightings to pretend they share a single decision function. Be explicit about which level the committee should be aggregating at (disjuncts, criteria, or bottom line, and what happens when they disagree), and about the tie. Hard cap of 450 words, short headers at most, and please no bibliography or names of papers — nobody on this committee is going to look anything up, they'll read it once over coffee and then vote.
reasoning: |-
  Okay, the user is dealing with a complex committee decision on a professor's promotion. They need a clear memo that addresses both the immediate case and a long-term rule for aggregation. 

  First, I need to unpack the messy situation: 
  The candidate technically meets all three criteria (research 5-2, service 5-2, teaching 3-3 after recusal), but only one member actually supports promotion overall. The disconnect comes from hidden weightings—members privately value research more than service, and the criteria breakdown reveals contradictions (e.g., research passes despite failing both sub-criteria). 

  The core tension is between two legitimate approaches: 
  - **Criteria-first aggregation** (handbook-compliant but ignores individual weightings) 
  - **Bottom-line aggregation** (reflects holistic judgment but overrides handbook structure) 

  For the immediate decision, I'm leaning toward rejection. Why? The unanimous lack of overall support (6-1 against) suggests deep reservations that criteria votes mask. The teaching tie (3-3) also fails the "majority finds" requirement if ties aren't wins. 

  Long-term, the committee needs to fix the voting procedure. They should: 
  1. **Aggregate at criteria level** (handbook's intent) 
  2. **Require written rationales** to expose weightings 
  3. **Clarify tie = fail** (since "majority" implies >50%) 
  4. **Add a "promote overall" vote** as a sanity check 

  The strongest counterargument: Bottom-line voting respects each member's judgment. But surrendering to subjectivity would make criteria meaningless—the handbook framework exists precisely to standardize evaluations. The compromise is to keep criteria votes primary but use overall votes as a red flag for deliberation. 

  Word count is tight, so I'll front-load the rejection verdict and hammer the procedural fixes. The tone must be pragmatic—these are busy academics who won't relish theory debates.
answer: |-
  ## MEMO: Promotion Recommendation & Procedure Reform  
  **Bottom line: Reject this promotion.**  

  ### Why Reject Now  
  The handbook requires a majority to affirm *each criterion*. Research (5-2) and Service (5-2) pass. Teaching is a 3-3 tie after recusal. A tie is not a majority; the criterion fails. **Promotion cannot proceed.** Even if teaching passed, only one member supports promotion holistically. This disconnect reveals inconsistent application of criteria, but the rules bind us to the criteria.  

  ### Addressing the Strongest Counterargument  
  Some argue bottom-line voting better respects individual weightings. True, it captures holistic judgment. But adopting it would negate the handbook’s structured criteria, inviting arbitrariness. If research-heavy voters can overrule service/teaching majorities, the criteria become meaningless. The committee’s role is to apply shared standards—not amplify private hierarchies.  

  ### Proposed Aggregation Rule for 2025  
  1.  **Vote at the criteria level only** (Research, Teaching, Service).  
  2.  **Ties fail** (a "majority" requires >50% support).  
  3.  **Require written rationales** for any "No" vote to clarify disagreements (e.g., "No on research due to weak monograph, despite strong articles").  
  4.  **Add a non-binding "Overall Promotion" vote** to flag disconnects like this case, prompting discussion but *not* deciding the outcome.  

  ### Why This Rule?  
  -   **Clarity:** Matches the handbook’s "each criterion" language.  
  -   **Consistency:** Prevents subjective weighting from overriding criteria.  
  -   **Transparency:** Rationales expose if members reject sub-criteria (e.g., monograph) despite affirming the broader criterion.  
  -   **Efficiency:** The "overall" vote signals when deliberation is critical, without vetoing criteria.  

  ### Handling This Candidate’s Data  
  The research vote confusion (5-2 yes, but 3-4/2-5 on sub-definitions) shows members applied the criterion flexibly. Rationales would reveal this, but per the handbook, the *criterion-level vote stands*. Future ballots should include sub-criteria for clarity, but the top-level criterion vote remains decisive.  

  **Summary:** Reject due to failed teaching criterion. Adopt criteria-level voting with ties failing, plus rationales and an advisory overall vote. This honors the handbook while ensuring principled flexibility.  

