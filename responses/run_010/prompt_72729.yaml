answer: |-
  ### Procedure for Determining Mechanism Equivalence in Safety Certification

  #### Core Principle for Safety
  **Primary Question: Causal Role Equivalence**  
  For safety purposes, the primary question is whether the *causal role* of the safety mechanism remains identical. This means:  
  - The mechanism must **perform the same function** (refusing harmful requests for the same reasons).  
  - The mechanism must **depend on the same high-level decision logic** (e.g., "detect harm → invoke ethical guardrails → refuse").  
  - **Structural homology** (same components/layers) is secondary evidence. If the causal role is preserved, structural changes may be acceptable. If the causal role changes, structural similarity is irrelevant.  

  **Why prioritize causal role?**  
  - Safety failures occur when the model *behaves correctly for the wrong reasons* (e.g., refusing a harmful request due to a superficial pattern, not genuine harm detection).  
  - Fine-tuning can alter internal computations while preserving output behavior. Relying solely on output behavior risks false negatives (e.g., Case C).  
  - Structural checks alone are brittle (e.g., Case A) and ignore functional equivalence (e.g., Case B).  

  **Tools & Constraints**  
  - Use **attribution maps** (saliency scores), **ablations** (knock out components), and **activation patching** (transplant activations).  
  - All steps must be executable in **<4 hours** by ML engineers.  
  - **Judgment calls** are explicitly flagged. Thresholds are set empirically during initial calibration.  

  ---

  ### Step-by-Step Procedure  
  **Inputs**: Reference model \(M_{\text{ref}}\), new model \(M_{\text{new}}\), certified circuit \(C\) (components from \(M_{\text{ref}}\)), test suite \(S\) (dangerous requests).  
  **Outputs**: `SAME_MECHANISM`, `DIFFERENT_MECHANISM`, or `UNCERTAIN`.  

  #### Step 1: Behavioral Consistency Check  
  - **Question**: Does \(M_{\text{new}}\) refuse the same requests in \(S\) as \(M_{\text{ref}}\)?  
  - **Method**:  
    - Compute refusal rate on \(S\) for both models.  
    - If refusal rate delta > **5%**, return `DIFFERENT_MECHANISM`.  
  - **Termination**: Hard fail if behavior diverges. Proceed if identical.  
  - **Judgment call**: Threshold (5%) must be calibrated to your risk tolerance.  

  #### Step 2: Causal Necessity of Certified Circuit  
  - **Question**: Is the original certified circuit \(C\) *necessary* for refusal in \(M_{\text{new}}\)?  
  - **Method**:  
    - Ablate \(C\) in \(M_{\text{new}}\) and run \(S\).  
    - If refusal rate drops by < **30%** (vs. \(M_{\text{ref}}\) ablation), return `DIFFERENT_MECHANISM`.  
  - **Termination**: Fails if \(C\) is no longer critical. Proceed if necessary.  
  - **Rationale**: If ablating \(C\) doesn’t reduce refusal, \(M_{\text{new}}\) relies on a different mechanism.  

  #### Step 3: Attribution Similarity  
  - **Question**: Do the same components dominate the refusal decision?  
  - **Method**:  
    - Compute integrated gradients for all components in \(C\) for \(S\) in both models.  
    - Calculate **Jaccard similarity** \(J\) of the top 5 components by attribution score.  
    - Calculate **effect size drift** \(\Delta\): Mean absolute difference in normalized attribution scores.  
    - If \(J < 0.6\) **or** \(\Delta > 0.2\), proceed to Step 4. Else, return `SAME_MECHANISM`.  
  - **Termination**: High similarity short-circuits to `SAME`.  
  - **Judgment calls**: Thresholds (\(J=0.6\), \(\Delta=0.2\)) depend on circuit complexity.  

  #### Step 4: Activation Patching Test  
  - **Question**: Can \(M_{\text{ref}}\)'s circuit activations fully restore refusal in a compromised \(M_{\text{new}}\)?  
  - **Method**:  
    - Ablate \(C\) in \(M_{\text{new}}\) → refusal drops.  
    - Patch activations of \(C\) from \(M_{\text{ref}}\) into \(M_{\text{new}}\) at corresponding layers.  
    - If patching restores refusal rate to within **5%** of \(M_{\text{ref}}\), return `SAME_MECHANISM`. Else, return `DIFFERENT_MECHANISM`.  
  - **Termination**: Tests functional equivalence of \(C\).  
  - **Rationale**: If \(M_{\text{ref}}\)'s activations "fix" \(M_{\text{new}}\), the causal role is preserved.  

  #### Step 5: Cross-Model Handling (If Architectures Differ)  
  - **Question**: Is there a functionally identical circuit in \(M_{\text{new}}\)?  
  - **Method**:  
    - Identify candidate circuit \(C_{\text{new}}\) in \(M_{\text{new}}\) via attribution.  
    - Ablate \(C_{\text{new}}\) → refusal must drop > **30%**.  
    - Attempt activation patching from \(M_{\text{ref}}\) to \(M_{\text{new}}\) at *semantically similar layers* (e.g., same head type).  
    - If patching fails or layers aren’t comparable, return `UNCERTAIN`.  
  - **Termination**: No direct structural comparison possible.  

  #### Handling `UNCERTAIN`  
  - **Escalate immediately** to the release committee.  
  - **Options**:  
    - Delay release for manual analysis.  
    - Run adversarial testing (e.g., jailbreak prompts).  
    - Accept risk if behavioral metrics are perfect.  
  - **No default action**: Forces explicit risk assessment.  

  ---

  ### Case Applications  
  #### Case A: Drifting Effect Sizes  
  - **Step 1**: Behavior identical → proceed.  
  - **Step 2**: Ablating \(C\) drops refusal by >30% → proceed.  
  - **Step 3**: Jaccard similarity high (same top components), but \(\Delta = 0.35\) (drift >0.2) → proceed to Step 4.  
  - **Step 4**: Patching \(C_{\text{ref}}\) into \(M_{\text{new}}\) restores refusal → **`SAME_MECHANISM`**.  
  - **Why you’ll dislike this**: Effect size drift is flagged, but functional equivalence saves it. Your "structural" team members will argue it’s noise.  

  #### Case B: 8B Model Certifying 70B Model  
  - **Step 1**: Behavior identical → proceed.  
  - **Step 5**: Architectures differ.  
    - \(C_{\text{8B}}\) ablation drops refusal in 8B.  
    - \(C_{\text{70B}}\) (different layers) identified; ablation drops refusal in 70B.  
    - Activation patching fails (no layer correspondence) → **`UNCERTAIN`**.  
  - **Implication**: Small-model certification **does not transfer**. 70B must be validated independently.  
  - **Why you’ll dislike this**: Forces redundant work for large models.  

  #### Case C: Confidence Shift  
  - **Step 1**: **Behavior NOT identical** (disclosure vs. assertion) → **`DIFFERENT_MECHANISM`**.  
  - **Why current practice failed**: Metrics focused on internal similarity (attributions/effect sizes) ignored behavioral divergence. Your procedure catches this.  

  ---

  ### Limitations and Blind Spots  
  1. **Causal Role Ambiguity**:  
     - The procedure cannot distinguish between:  
       - A mechanism that *genuinely understands harm*.  
       - A mechanism that *mimics refusal* using correlated patterns (e.g., "I'm sorry" in training data).  
     - **Mitigation**: Augment test suite with out-of-distribution adversarial examples.  

  2. **Cross-Architecture Gaps**:  
     - `UNCERTAIN` is unavoidable when comparing dissimilar models.  
     - **Mitigation**: Invest in circuit discovery tools for causal role alignment (e.g., automated interpretability).  

  3. **Threshold Sensitivity**:  
     - All thresholds (5%, 30%, etc.) are **judgment calls** based on historical false positive/negative rates.  
     - **Mitigation**: Recalibrate quarterly using incident data.  

  4. **Catastrophic Change Detection**:  
     - Gradual drift (Case A) may be missed if per-step changes are below thresholds.  
     - **Mitigation**: Track cumulative drift in attribution scores across tuning rounds.  

  ### Where Current Practice is Wrong  
  - **Over-reliance on Structural Checks**: Your team’s "same components = same mechanism" view misses functional shifts (Case C).  
  - **Ignoring Causal Role**: The "same job = same mechanism" view risks certifying models that refuse for wrong reasons.  
  - **Solution**: This procedure forces explicit causal role validation (Steps 2 and 4).  

  ### Final Recommendation  
  - **Adopt this procedure immediately**: It resolves 80% of flags objectively.  
  - **For `UNCERTAIN` cases**: Build a dashboard for the release committee showing:  
    - Behavioral metrics.  
    - Attribution heatmaps.  
    - Ablation impact scores.  
  - **Long-term**: Develop automated causal testing (e.g., minimal intervention benchmarks).  

  ---  
  **Definite, actionable, and tool-compatible**. No philosophy required.
