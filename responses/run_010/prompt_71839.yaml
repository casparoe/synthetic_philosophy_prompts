  2. The side-constraint view of rights:

     Someone who views rights as side constraints would argue that the exercise of aggregating preferences to form a social ordering is flawed from the start. They would say that the rights are not about determining social preference but about constraining what social choices can be made. In particular, they would hold that the rights of Alice and Bob to choose their own tea and biscuit must be respected regardless of the social preference. Therefore, the social state must be one that results from Alice freely choosing her tea and Bob freely choosing his biscuit. 

     In this view, the cycle in social preference is irrelevant because the social choice is not determined by a preference aggregation but by the exercise of individual rights. For example, if Alice chooses Earl Grey and Bob chooses Digestives, then (EG, DG) is the outcome, even if there is a social preference cycle that might suggest otherwise.

     This reply does not rescue the "it's just nasty preferences" diagnosis. Instead, it rejects the entire framework of trying to build a social preference that respects both rights and the Pareto principle. The side-constraint view says that we should not be aggregating preferences in this way at all. Therefore, the original diagnosis (that the problem only arises with objectionable preferences) is not addressed by this reply. The side-constraint view simply refuses to play the game.

  3. Do the famous examples produce a cycle?

     The two famous examples are:

     a. The "Lady Chatterley's Lover" example (book): 
        - There are two individuals: the prude and the lewd.
        - States: Prude reads it (P), Lewd reads it (L), Neither reads it (N).
        - The prude: N > P > L
        - The lewd: P > L > N
        - Rights: Each is decisive over reading or not. So the prude is decisive between P and N? Actually, the states are defined by who reads. The prude is decisive over his own reading: if we consider pairs that differ only in his reading. Similarly for the lewd.
        - But note: the states are three, and we have pairs. Typically, we consider:
            - Prude decisive between (P) and (N): he prefers N, so N > P.
            - Lewd decisive between (L) and (N): he prefers L, so L > N.
        - Also, by Pareto: both prefer P to L (prude: P>L, lewd: P>L) so P > L.
        - Then we have: L > N (by lewd's right) and N > P (by prude's right) and P > L (by Pareto) → cycle: L > N > P > L.

        So yes, it produces a cycle.

     b. The "neighbour" example (with the lights):
        - Two neighbors: one wants the other to turn off the light, the other wants it on.
        - States: A on, B on; A on, B off; A off, B on; A off, B off.
        - We assign rights over their own light.
        - Preferences: 
            - A is the prude: he prefers both off, then A off and B on, then A on and B off, then both on? 
            - Actually, Sen's example: 
              - A (the prude) prefers no light at all (A off, B off) best, then only his own light on (A on, B off), then only B's light on (A off, B on), then both on (A on, B on) worst.
              - B (the lewd) prefers both on best, then only A's light on (A on, B off), then only his own light on (A off, B on), then both off worst.
        - Rights: 
            - A is decisive between (A on, B off) and (A off, B off): he prefers (A on, B off) to (A off, B off)? Wait, no: 
              - For fixed B off, A chooses between A on and A off: A prefers (A on, B off) to (A off, B off) [because (A on, B off) is second and (A off, B off) is first?] 
            - Actually, we need to be careful. The decisive sets are over pairs that differ only in one person's light.

        Let me denote states as (A's light, B's light): 
          w: (on, on)
          x: (on, off)
          y: (off, on)
          z: (off, off)

        A's ranking: 
          z (off, off) best
          x (on, off) next
          y (off, on) next
          w (on, on) worst

        B's ranking:
          w (on, on) best
          x (on, off) next
          y (off, on) next
          z (off, off) worst

        Rights:
          A is decisive over (x, z) and (w, y): 
            - (x, z): differ only in A's light (B is off in both). A prefers z to x? No: A prefers z (best) and x is second, so he prefers z to x? Then society: z > x.
            - But also, A is decisive over (x, z): so if we consider that pair, A prefers z > x, so z > x.
            - Also, over (w, y): differ only in A's light (B is on in both). A prefers y to w? A: y is third, w is fourth → so y > w.

          B is decisive over (x, w) and (y, z):
            - (x, w): differ only in B's light (A is on in both). B prefers w to x → w > x.
            - (y, z): differ only in B's light (A is off in both). B prefers y to z → y > z.

        Now, by Pareto: 
          - For w and z: both prefer z to w? 
            A: z>w, B: w is best, z is worst → B prefers w to z. So no Pareto.
          - For x and y: 
            A: x>y, B: x>y → so by Pareto, x > y.

        Now, what do we have?
          From A: z > x and y > w.
          From B: w > x and y > z.
          From P: x > y.

        Now, let's see:
          y > w [A]
          w > x [B]
          x > y [P]

        So: y > w > x > y → cycle: y > w > x > y.

        So both examples do produce cycles.

     Therefore, the original examples do produce cycles, not just the Pareto-inferior outcome.

  Final note: We have built the case and shown the cycle. The motives are not nasty: conformism and nostalgia are ordinary and not malicious.
