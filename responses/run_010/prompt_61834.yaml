prompt: |-
  I am a professor of philosophy, and for three years I have chaired the ethics review panel attached to a state agency's behavioral science unit. The unit sends us roughly twenty proposals a year: defaults on benefit enrollment forms, the ordering of options on the public portal, the framing of reminder letters, and, less often, requests to add steps to a process in order to slow people down. Each proposal gets one hour. The panel consists of an agency lawyer, a statistician, two program officers, and three lay members appointed by the governor; none of them has studied philosophy, and our written reasons enter the public record and are read back to us by legislators. Depending on the program, an intervention reaches between four thousand and six hundred thousand residents, and once a default is in place it tends to stay in place for years. So whatever you produce must be applicable by a program officer and auditable by a lay member, with no technical vocabulary doing the work.

  The criterion we have been using — that an intervention is permissible if it could be openly announced and would survive the objection of the people it acts on — has broken down in a way I cannot repair within our current form. Several of the proposals operate precisely because people do not attend to them. The unit's own pilots indicate that announcing the design flattens the effect in some cases and, in one, reverses it among the segment of the population that reads agency notices. The test we rely on to justify an intervention thus destroys the object it is applied to, and the panel has been papering over this by announcing its nudges generically rather than specifically. I want the procedure to confront that problem instead of assuming disclosure is costless: it should separate the reasons an intervention might fail under disclosure that carry moral weight from those that do not, and it should say what the panel does when it cannot tell which it has.

  Please write the decision procedure itself: the questions in the order the panel should ask them, what counts as a sufficient answer to each, the points at which it returns a flat no, and the points at which it stops and hands the matter back to a person because the question is one of values rather than facts. Mark explicitly where judgment cannot be eliminated and where you expect the procedure to misfire. State which distinctions from the literature must survive the simplification for lay use and which you would deliberately discard, and why. Include one short reflexive step: our agenda is set by the unit, proposals are taken in the order it lists them, and an item that runs out of time is carried over rather than refused — say whether and how the procedure should govern the panel's own setup.

  Then run it on three proposals: (i) a default that enrolls eligible households in a utility assistance program, where opting out requires a phone call during business hours; (ii) a county clerk's request to add a confirmation step and a twenty-four-hour hold to online address changes, because of a fraud ring; and (iii) a screening-uplift program built on framing and ordering, endorsed unanimously by an elected community health board, which has asked that our public report not describe the mechanism, since describing it in the local paper killed the previous version. I expect the third to come out against my own sympathies; if it does not, tell me why I should not simply distrust the procedure. Finally, state plainly what this procedure cannot settle and must never be presented as settling.
reasoning: |-
  We are designing a decision procedure for an ethics review panel that evaluates behavioral interventions. The procedure must be usable by non-philosophers, auditable by lay members, and avoid technical jargon. The key challenge is that disclosure of the intervention can undermine its effectiveness, so we need a way to evaluate permissibility without assuming disclosure is costless.

  The core problem: The existing criterion (open announcement and survival of objection) breaks down when disclosure flattens or reverses the effect. We need to:
  1. Separate reasons for failure under disclosure that carry moral weight (e.g., manipulation, deception) from those that do not (e.g., mere awareness making the nudge ineffective).
  2. Provide guidance when we cannot tell which reason applies.

  We will build a procedure that asks a series of questions. At each step, we either proceed, return a "no", or stop for human judgment (when the question is one of values). We mark where judgment is needed and where the procedure might misfire.

  Key distinctions from the literature that must survive simplification:
  - **Manipulation vs. Persuasion**: Manipulation (bypassing reason) is problematic; persuasion (engaging reason) is less so. We must capture whether the intervention works by exploiting cognitive biases in a way that undermines autonomy.
  - **Transparency**: Even if not disclosed, the intervention should be such that if the subject were to become aware, they would not feel deceived or manipulated. This is related to the "open announcement" idea but without requiring actual announcement.
  - **Burden of Opt-Out**: The effort required to opt out of a default can be coercive if too high, but some burden is acceptable.

  Distinctions we discard:
  - **Libertarian Paternalism**: We are not requiring that the intervention be the least restrictive alternative, because in the context of government programs, we are already in a paternalistic setting. We focus on avoiding manipulative or deceptive elements and ensuring proportionality.
  - **Welfare Effects**: We assume that the state agency has already vetted the program for effectiveness and that the intervention is intended to benefit the target population. Our role is ethical review, not cost-benefit analysis.

  The procedure must include a reflexive step regarding the panel's own setup.

  ---

  **Decision Procedure: Ethical Review of Behavioral Interventions**

  **Step 1: Purpose and Proportionality**
     - Question: Is the intervention aimed at a legitimate public interest, and is the intervention proportional to the problem it addresses? (Consider: the seriousness of the issue, the scale of the intervention, and the expected benefits.)
     - Sufficient Answer: The proposal must clearly state the public interest (e.g., reducing fraud, increasing uptake of benefits) and provide evidence that the intervention is a reasonable means to that end. If the intervention imposes a burden (e.g., extra steps, time delays), it must be justified by the gravity of the problem.
     - If No: Return a flat "no". (Because without a legitimate purpose and proportionality, the intervention is unjustified.)
     - Judgment: This step requires judgment on what counts as a legitimate public interest and proportionality. The panel must weigh the agency's stated goals against the burdens imposed.

  **Step 2: Mechanism and Autonomy**
     - Question: Does the intervention work primarily by providing relevant information, making options more salient, or by exploiting cognitive biases in a way that undermines rational decision-making?
     - Sufficient Answer: The panel must describe the mechanism in plain language. If the intervention works by making information clearer or more accessible, it passes. If it relies on deception, hidden pressures, or manipulative framing that would cause reasonable resentment if discovered, it fails. If it uses non-deceptive framing or defaults but without manipulation, it may proceed.
     - If Manipulative: Return a flat "no". (Because it violates autonomy by bypassing reasoning.)
     - Judgment: Distinguishing between non-manipulative framing and manipulation is a value judgment. The panel must consider: Would a reasonable person, upon learning of the intervention, feel their autonomy was disrespected? If unsure, proceed to Step 3.

  **Step 3: Disclosure Test (Revised)**
     - Question: Even if disclosure would reduce the intervention's effectiveness, are the reasons for this reduction morally acceptable? Specifically, would the intervention still be effective if the subjects were fully informed and attentive, or does it depend on their inattention or ignorance?
     - Sufficient Answer:
       - If the intervention would be ineffective only because people would then choose differently (e.g., they would opt out of a beneficial default because they don't want the benefit), then that is morally acceptable. The intervention is not manipulating; it is allowing a choice that the subject prefers.
       - If the intervention would be ineffective because it relies on inattention (e.g., a default that enrolls people without their awareness) and if the burden of opting out is high, then we must consider the burden (Step 4). But if it relies on deception (e.g., framing that is intentionally misleading) and disclosure would reveal the deception, then it fails.
     - If Deception: Return a flat "no".
     - If the reason for ineffectiveness under disclosure is that people would then exercise their autonomy to reject the intervention, then the intervention may be acceptable if the burden of opting out is not excessive (go to Step 4). If the panel cannot determine the reason, they must stop and hand the matter back for judgment: the proposal must be revised or rejected unless there is a compelling reason to proceed despite the uncertainty.

  **Step 4: Burden of Opting Out (for defaults and similar)**
     - Question: For interventions that use defaults or require active steps to avoid the intervention, is the burden of opting out reasonable and not coercive?
     - Sufficient Answer: The burden (e.g., time, effort, cost) should not be so high as to effectively force compliance. Consider the target population: is the burden disproportionate for vulnerable groups? The panel should compare the burden to the importance of the choice and the benefits of the default.
     - If the burden is too high: Return a flat "no". (Because it becomes coercive.)
     - Judgment: What counts as "reasonable" varies. The panel must consider the context and the population.

  **Step 5: Endorsement and Accountability**
     - Question: Is there a democratic or community endorsement of the intervention? And is the intervention subject to ongoing review?
     - Sufficient Answer: The proposal should note if there is community input (e.g., from elected boards) and if the intervention will be monitored and reviewed periodically. Lack of endorsement is not fatal, but it raises the bar for justification. If the intervention is endorsed by a legitimate representative body, that counts in its favor.
     - If there is no endorsement and the intervention is controversial, the panel may require more justification. This step does not return a "no" by itself but informs the overall judgment.

  **Step 6: Reflexive Step - Panel Setup and Process**
     - Question: Given that the agenda is set by the unit and items are carried over if they run out of time, does the panel have enough time and resources to conduct a thorough review? And is the panel composition adequate to represent the public's values?
     - Procedure: At least once a year, the panel should review its own process. If more than 10% of items are carried over due to time constraints, the panel must request more meeting time or reduce the number of proposals per meeting. The panel should also ensure that the lay members are representative of the population affected and that they receive basic training in ethical reasoning.

  **Overall Flow**:
  1. Step 1 (Purpose and Proportionality) -> if no, reject.
  2. Step 2 (Mechanism and Autonomy) -> if manipulative, reject; else proceed.
  3. Step 3 (Disclosure Test) -> if deceptive, reject; if the reason for disclosure failure is autonomy-based, go to Step 4; if uncertain, stop for judgment.
  4. Step 4 (Burden of Opting Out) -> if burden too high, reject; else proceed.
  5. Step 5 (Endorsement) -> this step does not lead to rejection but may require more justification.
  6. Step 6 (Reflexive) -> ongoing process evaluation.

  **Points of Judgment**:
  - Step 1: What is a legitimate public interest and what is proportional?
  - Step 2: What counts as manipulation?
  - Step 3: Why would disclosure undermine the intervention? (Is it due to deception or autonomy?)
  - Step 4: What is a reasonable burden?

  **Where the Procedure Might Misfire**:
  - If the panel misjudges the mechanism (Step 2) and labels a manipulative intervention as non-manipulative.
  - If in Step 3, the panel cannot determine the reason for disclosure failure and either too readily accepts the intervention or rejects it unnecessarily.
  - The procedure may be too strict on burdens (Step 4) in cases where the benefit is high and the burden is moderate.

  **What the Procedure Cannot Settle**:
  - The procedure cannot replace political or democratic decisions about the goals of public policy. It only evaluates the ethical permissibility of the means.
  - It cannot resolve deep value conflicts (e.g., about the role of the state in individual decision-making). These must be left to the legislature or public debate.
  - It does not assess the empirical effectiveness of the intervention (assumed to be vetted by the unit).

  ---

  **Apply to Proposals**

  **(i) Default enrollment in utility assistance, opt-out by phone call during business hours**

  - Step 1: Legitimate purpose (increasing uptake of benefits) and proportional? Yes, because it helps low-income households access needed assistance. The burden is on the state to enroll, but the opt-out is available.
  - Step 2: Mechanism: Default enrollment. This does not deceive; it uses inertia. If people become aware, they might not feel manipulated because they can opt out. Passes.
  - Step 3: Disclosure test: If announced, some might opt out because they don't want the benefit (morally acceptable reason) or because they don't like defaults (also acceptable). The unit's pilots might show reduced uptake if announced, but that's due to autonomous choice. However, if the pilots show that the drop is because people don't trust the government or feel tricked, that might be problematic. But the proposal does not indicate that. We assume the reason is autonomy. Proceed.
  - Step 4: Burden of opting out: Requiring a phone call during business hours may be burdensome for low-income workers who cannot make calls during work. This could be coercive. The panel must judge: Is there an alternative (e.g., online opt-out, mail)? If not, this might be too burdensome. Without mitigation, this step may lead to rejection. But if the phone call is the only option, the panel might require an alternative method. Otherwise, reject.
  - Step 5: Endorsement? Not mentioned, so not a factor.

  Verdict: Reject unless the opt-out process is made easier (e.g., online or 24-hour automated phone). Otherwise, the burden is too high.

  **(ii) County clerk's request: add confirmation step and 24-hour hold to online address changes due to fraud**

  - Step 1: Legitimate purpose (preventing fraud) and proportional? Yes, because fraud is a serious problem and a brief delay with a confirmation step is a reasonable response.
  - Step 2: Mechanism: Adding steps to slow down the process. This is not manipulative; it's a friction to prevent hasty or fraudulent actions. Passes.
  - Step 3: Disclosure test: If announced, it might not reduce effectiveness because the fraudsters would know but legitimate users might appreciate the security. Even if fraudsters adjust, the intervention may still work. No deception. Passes.
  - Step 4: Burden: The 24-hour hold and confirmation step add some burden, but it is minor (one extra click and a day's wait) and proportional to the risk of fraud. Reasonable.
  - Step 5: Endorsement? Not mentioned, but fraud prevention is generally accepted.

  Verdict: Approve.

  **(iii) Screening-uplift program using framing and ordering, endorsed by community health board, with request not to describe the mechanism (because previous disclosure killed it)**

  - Step 1: Legitimate purpose? Yes, improving health screening uptake. Proportional? Depends on the framing: if it's just ordering, likely proportional; if it uses manipulative framing, then not.
  - Step 2: Mechanism: Framing and ordering. The key: is it manipulative? We must know the details. The community board endorsed it, which suggests they don't find it manipulative. But we cannot rely solely on that. The panel must examine: does the framing present information in a way that is deceptive or that exploits irrational biases? For example, if it overstates benefits or uses fear tactics, it might be manipulative. The procedure requires the panel to describe the mechanism. If the framing is non-deceptive (e.g., emphasizing benefits truthfully) and ordering is just putting the preferred option first, then it passes. But if it uses tricks (e.g., decoy options, false scarcity), then it fails. Without details, we assume non-manipulative because of the endorsement. But the panel must insist on knowing the mechanism, even if it won't be publicized.
  - Step 3: Disclosure test: The unit says disclosure flattens the effect. Why? If it's because people would then choose not to get screened (autonomy), that's acceptable. But if it's because the framing is manipulative and disclosure would reveal that, then it's a problem. The panel must determine the reason. The community board's request to not describe the mechanism in the public report is a red flag. The panel must not approve without knowing the mechanism internally. They must judge: if the reason for disclosure failure is that the framing is manipulative, then reject. If it's because people would then think the screening is less urgent (without being deceived), then it is acceptable. But without being able to know (because the unit won't reveal?), the panel must stop for judgment. They cannot approve under uncertainty.
  - Step 4: Not applicable (no opt-out burden in the same way).
  - Step 5: Endorsement: Strong positive (unanimous community health board). This counts in favor, but does not override manipulation concerns.

  Verdict: The panel must insist on knowing the mechanism internally. If the mechanism is manipulative, reject. If not, then the disclosure test: if the failure is due to autonomy, then approve (and the public report can say "the intervention uses evidence-based communication strategies" without details). But if the mechanism is unknown or manipulative, reject. Given the history (disclosure killed the previous version) and the request for secrecy, the panel should be cautious. They might ask: Can we design a non-manipulative version? If not, and if the intervention is vital, they might approve but require a sunset clause and monitoring. But without transparency to the panel, they cannot approve.

  **Why the procedure might approve (iii) against the professor's sympathies?**
  If the panel determines that the mechanism is non-manipulative (Step 2) and that the disclosure failure is due to autonomy (people would choose not to get screened if they knew the ordering was designed to nudge them), then the procedure would approve. The professor might be sympathetic to the program but worried about secrecy. However, the procedure allows for non-disclosure to the public if the panel itself verifies that there is no manipulation. The endorsement by the community board also helps. Therefore, the procedure might approve if the mechanism passes Step 2 and the disclosure failure is autonomy-based. The professor should not distrust the procedure because it is designed to allow for non-disclosure when the reason is not manipulative and the intervention is beneficial. But the panel must be rigorous in Step 2 and Step 3.

  **What the procedure cannot settle and must never be presented as settling**:
  - The ultimate goals of public policy (e.g., whether the state should promote health screening at all). That is a political question.
  - The empirical effectiveness of the intervention (we assume the unit has validated it).
  - Deep philosophical disputes about autonomy and paternalism that are beyond the scope of the panel's mandate.
answer: |-
  Below is a decision procedure designed for your ethics review panel. It is structured as a step-by-step flowchart with explicit questions, criteria for answers, rejection points, and handoff points for value judgments. It avoids technical jargon, prioritizes audibility by lay members, and confronts the disclosure problem by distinguishing between "moral" and "non-moral" reasons an intervention might fail under disclosure. Moral reasons involve deception, manipulation, or unjust burdens that disrespect autonomy; non-moral reasons involve behavioral factors (e.g., inattention, inertia) that do not inherently undermine consent.

  The procedure discards or simplifies several distinctions from the literature:
  - **Discarded**: *Libertarian paternalism's "least restrictive alternative" requirement*. Justification: In a government context, interventions are inherently paternalistic; we focus on avoiding exploitation, not minimizing state influence. *"System 1 vs. System 2" processing*. Justification: Lay members cannot reliably categorize cognitive mechanisms; we evaluate outcomes (autonomy, burden) instead.
  - **Simplified but retained**: *Autonomy vs. manipulation* (reduced to "respect for reasonable objections"). *Transparency* (reduced to "auditability" by the panel, not public disclosure). *Burden of opting out* (assessed as practical accessibility).

  The procedure includes a reflexive step for the panel's operations and explicitly marks where judgment is required. It is designed to misfire in edge cases involving ambiguous intent (e.g., whether inattention is exploited manipulatively) or conflicting values (e.g., community endorsement vs. individual rights).

  ---

  ### **Decision Procedure: Ethical Review of Behavioral Interventions**

  #### **Step 1: Legitimacy of Purpose**
  - **Question**: Does the intervention serve a public interest that justifies state action? (e.g., fraud prevention, health/safety, equitable access to benefits.)
  - **Sufficient answer**: Clear evidence of harm addressed or benefit provided (e.g., pilot data, statutory authority). *Not* sufficient: Vague appeals to "efficiency" without public benefit.
  - **Rejection point**: If no public interest is identified → **flat no**.
  - **Judgment call**: Panel must weigh the seriousness of the problem (e.g., fraud vs. minor inconvenience). Values-based; no formula.

  #### **Step 2: Proportionality**
  - **Question**: Is the intervention narrowly tailored to the problem? Does it avoid excessive burden relative to the benefit?
  - **Sufficient answer**: Burden (e.g., time, effort, delay) is justified by the scale of the problem. Evidence: Comparative data (e.g., burden vs. fraud rates).
  - **Rejection point**: Burden is severe and indiscriminate (e.g., slows all users for rare fraud) → **flat no**.
  - **Judgment call**: Assessing "excessive" burden. Values-based; panel debates reasonableness.

  #### **Step 3: Mechanism Audit (Autonomy Check)**
  - **Question**: Does the intervention work by subverting rational choice (e.g., deception, exploiting emotional vulnerabilities) or by facilitating choice (e.g., simplifying information, reducing friction)?
  - **Sufficient answer**: Description of mechanics in plain language. Passes if: No deception; options are clear; no exploitation of shame/fear. Fails if: Lies, hidden terms, or predatory timing.
  - **Rejection point**: Relies on deception or coercion → **flat no**.
  - **Judgment call**: Distinguishing "facilitation" from "subversion." Fact-based but requires inference.

  #### **Step 4: Disclosure Test (Core Problem Addressed)**
  - **Question**: If disclosed, would the intervention fail for **moral reasons** (e.g., people would object due to deception, unfairness, or disrespect) or **non-moral reasons** (e.g., inattention, inertia, or harmless biases persist)?
  - **Sufficient answer**:
    - *Moral failure*: Evidence that disclosure triggers objections rooted in betrayal or injustice (e.g., pilot surveys showing anger over manipulation).
    - *Non-moral failure*: Evidence that disclosure reduces effectiveness but without moral outrage (e.g., people forget or procrastinate even when aware).
  - **Handoff point**: If the panel cannot distinguish moral/non-moral failure → **stop for values judgment**. Panel must decide: Does the public interest override uncertainty?
  - **Rejection point**: Clear moral failure (e.g., deception exposed) → **flat no**.
  - **Judgment call**: Interpreting why disclosure fails. Most error-prone step; panel must avoid assuming all inattention is non-moral (e.g., inattention exploited manipulatively becomes moral).

  #### **Step 5: Opt-Out Burden Assessment (For Defaults/Blocks)**
  - **Question**: If the intervention uses defaults, holds, or blocks, is opting out accessible and reasonable for all affected groups?
  - **Sufficient answer**: Opt-out is low-cost (e.g., one click, mail-in) and accessible (e.g., 24/7 options, accommodations for disabilities). Evidence: Process flow diagrams.
  - **Rejection point**: Opt-out is prohibitive (e.g., phone-only during work hours for hourly workers) → **flat no**.
  - **Judgment call**: Defining "reasonable." Values-based; panel considers vulnerable populations.

  #### **Step 6: Democratic Accountability**
  - **Question**: Is there evidence of public input or oversight (e.g., community endorsement, legislative approval, sunset clauses)?
  - **Sufficient answer**: Input from affected groups (e.g., surveys, elected boards) or plans for review. *Not* required for all cases but strengthens legitimacy.
  - **No rejection**: Only informs Steps 1–5 (e.g., endorsements ease proportionality; lack thereof raises scrutiny).
  - **Judgment call**: Weight of endorsement. Values-based; panel may override weak endorsements.

  #### **Reflexive Step: Panel Operations (Governs Setup)**
  - **Question**: Does the panel’s process (e.g., time constraints, agenda control) risk hasty or biased reviews?
  - **Procedure**: 
    - If >15% of items are carried over per year due to time, panel must request more meetings or reduce proposals/meeting.
    - Proposals from high-impact programs (e.g., >100k residents) must be prioritized over low-impact ones.
    - **Why**: Prevents backlog from forcing rushed approvals. Ensures scalability.
  - **Judgment call**: Defining "high-impact." Values-based; panel sets thresholds annually.

  ---

  ### **Where Judgment Appears and Misfires**
  - **Judgment required**: Steps 1 (public interest), 2 (proportionality), 4 (disclosure reason), 5 (burden), 6 (endorsement weight), and Reflexive (prioritization).
  - **Expected misfires**: 
    - Step 4: Misclassifying moral failure as non-moral (e.g., mistaking exploitation of poverty-induced inattention for "harmless inertia").
    - Step 3: Overlooking subtle manipulation in framing (e.g., "ordering" that implies official endorsement).
    - Overall: Over-deferring to endorsements (Step 6) in contentious cases.

  ---

  ### **Application to Proposals**

  #### **(i) Default Enrollment in Utility Assistance**
  - **Step 1**: Legitimate (equitable access to benefits). ✔️  
  - **Step 2**: Proportional? Burden (phone call) may be high for low-income residents; evidence needed on uptake vs. opt-out difficulty. → **Judgment**: Panel weighs benefit (e.g., 30% enrollment boost) against burden.  
  - **Step 3**: Mechanism is facilitation (no deception; clear opt-out). ✔️  
  - **Step 4**: Disclosure failure likely non-moral (inattention/ inertia; people forget or procrastinate). No evidence of moral outrage. ✔️  
  - **Step 5**: Opt-out burden (phone during business hours) is unreasonable for hourly workers, single parents. → **Rejection: Flat no** unless modified (e.g., add online opt-out).  
  - **Step 6**: No endorsement mentioned; not decisive.  
  - **Verdict**: **Reject** due to excessive burden (Step 5). Must be redesigned.

  #### **(ii) Confirmation Step for Online Address Changes**
  - **Step 1**: Legitimate (fraud prevention). ✔️  
  - **Step 2**: Proportional? 24-hour hold is minor burden for users vs. high fraud risk. Evidence: Fraud ring data justifies narrow tailoring. ✔️  
  - **Step 3**: Mechanism is facilitation (confirmation clarifies intent; no manipulation). ✔️  
  - **Step 4**: Disclosure failure unlikely (fraudsters may adapt, but no moral objection). If disclosed, legitimate users appreciate security. ✔️  
  - **Step 5**: Opt-out burden: N/A (no default; users actively confirm).  
  - **Step 6**: No endorsement, but not required for fraud prevention.  
  - **Verdict**: **Approve**—passes all steps.

  #### **(iii) Screening-Uplift Program with Framing/Ordering (Non-Disclosure Requested)**
  - **Step 1**: Legitimate (health screening access). ✔️  
  - **Step 2**: Proportional? Framing/ordering is low burden; community endorsement supports benefit. ✔️  
  - **Step 3**: Mechanism: Unknown—panel must demand details *internally*. If framing uses fear/exaggeration → reject. If simple ordering/salience → ✔️. **Judgment**: Panel assumes facilitation (per endorsement) but verifies.  
  - **Step 4**: Disclosure failure: Previous version died after publicity. Why?  
    - If non-moral (e.g., awareness made people procrastinate), proceed.  
    - If moral (e.g., people felt manipulated), reject.  
    - **Handoff**: Panel cannot tell → stop for values debate. Endorsement suggests non-moral, but secrecy request is suspicious.  
  - **Step 5**: Opt-out burden: N/A (no default).  
  - **Step 6**: Strong endorsement (elected board). ✔️  
  - **Verdict**: **Conditional approval**—approve if mechanism is non-manipulative (Step 3) and disclosure failure is non-moral (Step 4). Public report can omit mechanism but must state: "Design uses ethical choice architecture." If mechanism is manipulative or unclear → **reject**.

  **Why Approval of (iii) Might Not Distrust the Procedure**:  
  - Your sympathies likely favor the program due to endorsement and benefit, but distrust secrecy. The procedure forces internal scrutiny of the mechanism (Step 3) and tests for moral failure (Step 4), ensuring secrecy is only allowed for non-manipulative nudges. It rejects if manipulation is found. This balances effectiveness with ethics—distrust would arise only if the panel skips verification.

  ---

  ### **What This Procedure Cannot Settle**
  1. **Deep value conflicts**: It cannot resolve disputes about the state's role (e.g., paternalism vs. libertarianism). These must be legislated.  
  2. **Empirical effectiveness**: It assumes the unit's pilots are valid; it cannot audit methodology.  
  3. **Distributive justice**: It evaluates permissibility, not fairness (e.g., whether nudges exacerbate inequality).  
  4. **Long-term societal effects**: It focuses on immediate ethics, not cultural shifts (e.g., normalization of state nudging).  

  **Never present this as settling**: Political questions (e.g., "Should the state promote this goal?") or democratic legitimacy (e.g., "Is this panel representative enough?"). It is a tool for *ethical* review, not a substitute for public deliberation.  

  ---  
  This procedure prioritizes clarity, confronts disclosure pragmatically, and embeds reflexivity. It will misfire if panelists conflate non-moral inattention with manipulation, but it minimizes this by requiring evidence at Step 4. Use it as a living document—revise as cases expose flaws.
