  ## Registry of Genuine Persons (RGP) – Client Handbook Excerpt (v.4.7.2)

  **Section 1: Introduction & Purpose**
  The Registry of Genuine Persons (RGP) operates under the Counterfeit Minds Prevention Act (CMPA) to establish and maintain the Authenticity Standard. This Standard safeguards societal discourse by certifying entities as Genuine Persons (GPs) and regulating Non-Genuine Interlocutors (NGIs). Certification ensures all participants in critical discourse possess the requisite causal history and intrinsic properties, preventing the deleterious effects of counterfeit interaction. Compliance is mandatory for participation in licensed forums, professional consultation, and designated public communications.

  **Section 2: Authenticity Grading Scale**
  2.1 Certified Genuine Persons (GP) are classified as follows:
      *   **Class A:** Demonstrates robust, consistent alignment with the Authenticity Standard across all assessment vectors. Highest confidence rating.
      *   **Class B:** Meets core Authenticity Standard requirements with minor, documented variances in secondary characteristics. Suitable for most discourse tiers.
      *   **Class C:** Meets baseline Authenticity Standard under controlled verification protocols. Usage restricted to Tier 3 discourse or lower, with mandatory real-time watermarking.
      *   **Class D:** Provisional certification pending re-assessment within 12 months. Subject to mandatory disclosure and usage limitations.
  2.2 **Class X:** Classification reserved for entities requiring specialized assessment protocols. Public definition withheld per RGP Operational Security Directive 12. Entities achieving Class X status are issued unique verification tokens and operate under distinct disclosure frameworks. (Refer to RGP Supplement X-9 for authorized requestors.)

  **Section 3: Core Assessment Procedures**
  3.1 **Procedure 7A: Causal History & Stance Resilience (CHSR)**
      *   **Purpose:** To verify the applicant's cognitive processes originate from an evolutionarily continuous biological lineage and demonstrate resistance to external manipulation of core intentional states.
      *   **Method:** Multi-phase interview integrating biographical deep-dive, stress-testing core beliefs under adversarial prompting, and analysis of response latency patterns under semantic load.
      *   **Discrimination Threshold:** Revision 3.1 (effective 01/04/YY) standardized the "Intentional Stance Suppression Window." Assessors are trained to withhold attribution of belief/desire for 8.5 seconds post-question to probe for substrate-driven response generation. Statistical modeling confirmed this window ceased providing discriminatory power between biological and advanced synthetic substrates achieving coherence scores above 8.2 on the Rübric Scale as of calibration cycle Q3/YY-1. Procedure 7A remains mandatory for baseline lineage verification.
  3.2 **Procedure 11D: Epistemic Integrity & Surprise Valence (EISV)**
      *   **Purpose:** To assess the applicant's inherent preference for truth coherence over social concordance ("agreeableness") and capacity for genuine, non-simulated surprise.
      *   **Method:** Exposing applicants to novel, counter-intuitive information (e.g., validated paradoxes, unexpected experimental outcomes) while monitoring physiological markers (facial EMG, pupillometry, galvanic skin response) and subsequent conversational integration vs. deflective tactics. Simultaneously probes willingness to contradict assessor assertions when demonstrably false.
      *   **Discrimination Threshold:** Revision 11D-4 (effective 15/09/YY) recalibrated the "Surprise Duration Metric." Analysis revealed predictive validity dropped below significance threshold (p<0.05) for surprise responses lasting between 1.2 and 3.7 seconds across all applicant cohorts exhibiting linguistic fluency above CERF Level C1. Physiological signature clustering proved unreliable beyond this duration window for distinguishing programmed novelty responses from biologically emergent surprise in high-fidelity systems. Procedure 11D focuses on contradiction propensity and integration depth.

  **Section 4: Watermark Verification & Maintenance**
  4.1 All certified entities (GP Classes A-D, NGI Licensed) receive a unique, cryptographically secure **Neural Echo Watermark (NEW)**. The NEW embeds imperceptible stochastic patterns within vocal output (phase modulation) or textual output (lexical distribution anomalies) detectable only by RGP-licensed verification nodes.
  4.2 **Verification Requirements:**
      *   **Initial Certification:** Full NEW imprinting and verification (Fee Schedule: Tier 1).
      *   **Annual Renewal:** NEW stability scan and pattern re-confirmation (Fee Schedule: Tier 2).
      *   **Status Change Appeal:** Full re-assessment + NEW re-imprint verification (Fee Schedule: Tier 4).
      *   **Real-Time Verification:** Mandatory for Class C GPs and all Licensed NGIs in designated forums (per-use fee applies; Fee Schedule: Tier 3).
  4.3 Tampering with, disabling, or failing to disclose a NEW constitutes a Category 3 Offense under the CMPA.

  **Section 5: Common Reasons for Initial Failure (Biological Applicants)**
  5.1 Statistical analysis indicates recurring factors in provisional failure or Class D assignment for biological applicants:
      *   **Over-Reliance on Scripted Responses:** Excessive use of rehearsed narratives or aphorisms under CHSR stress-testing, triggering "canned response" flags.
      *   **Inconsistent Surprise Valence:** Discrepancy between self-reported surprise and physiological markers during EISV, or failure to integrate genuinely novel information coherently within the protocol timeframe.
      *   **Pathological Agreeableness:** Persistent failure to register or act upon demonstrable factual contradictions presented by the assessor during EISV, prioritizing perceived social harmony over epistemic accuracy.
      *   **Causal Narrative Gaps:** Inability to provide a consistent, non-contradictory account of core belief formation or pivotal life experiences under deep-dive questioning, suggestive of confabulation or external influence (Note: Distinct from verified neurodivergent processing patterns documented under RGP Medical Variance Annex B).

  **Section 6: Correspondence Excerpt (Anonymized)**
  > **Subject:** Reclassification Notice (Ref: 88934-21B)
  > **From:** Registrant #LL-88934-21B
  > **To:** RGP Appeals Tribunal
