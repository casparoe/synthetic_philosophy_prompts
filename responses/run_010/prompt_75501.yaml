prompt: |-
  I am a high school student, and for a bioethics seminar I have been reading about how fertility clinics handle the embryos they create. One feature of the whole arrangement keeps bothering me, and I cannot tell whether it is a genuine contradiction or just loose talk on everyone's part.

  Here is the practice as I understand it. A clinic fertilizes a batch of eggs, transfers one or two of the resulting embryos, and freezes the rest. Before treatment begins, the patients sign a form choosing in advance what is to happen to the leftovers: discarded, donated to research, or donated to another couple to implant. Embryos are graded under a microscope, and the ones judged to look poor are set aside. And yet the very same institutions, and the same patients, treat each stored embryo as one particular child. Clinics label vials by patient and keep obsessive chain-of-custody records so that the right embryo goes into the right uterus. Parents describe a discarded embryo as a child they lost rather than as a chance they no longer have. And in February 2024 the supreme court of the U.S. state of Alabama held that a frozen embryo counts as a minor child under that state's wrongful-death statute, so a clinic that destroys one may be sued as it would be for the death of a born child — a ruling that caused several clinics to pause treatment altogether. Meanwhile most other jurisdictions handle the accidental destruction of stored embryos as a matter of property or contract, and courts asked to settle disputes between separated partners generally decline to order an embryo implanted at all.

  What picture of the relation between a person and their biological beginnings does this practice presuppose? In particular, does treating that vial as that child require that a person's identity is fixed by the specific gametes they came from, so that a different sperm or egg would have produced a different child rather than the same child under different circumstances? Please reconstruct the implicit view as precisely as you can, and then separate what the practice strictly needs from what it merely sits comfortably with — the record-keeping and grading may only require that embryos are physically distinct objects, while the grief and the wrongful-death ruling may require much more. Say where the practice is philosophically underdetermined, so that rival accounts of identity would license it equally.

  Then tell me whether the parts of the practice presuppose consistent things. Does the wrongful-death ruling cohere with grading out and discarding surplus embryos, with donating embryos to strangers, and with counseling that reminds a couple they can always make more embryos next cycle? Is that a conflict of underlying commitments or only of vocabulary?

  Finally, I would like the practice tested against two things I could not reconcile with it. Identical twins develop from a single fertilized egg, so one and the same sperm-and-egg origin apparently yields two people; and any one of the hundreds of millions of sperm in a sample might have fertilized the same egg, which makes me wonder whether the practice needs a sharp answer about which sperm is the one that matters, or could tolerate a vague one in which a gamete differing by a single gene would still have produced you. Does the presupposition survive these cases? And if it did not — if who a person turns out to be were not tied to the particular gametes that made them — what specifically would have to change in clinic procedure, in the consent forms, in the liability rules, and in the way parents are counseled after a loss?
reasoning: |-
  Okay, let me approach this high school student's bioethics question methodically. The core tension they've identified revolves around how fertility clinics simultaneously treat embryos as both biological material and potential persons. 

  First, I need to map the contradictory practices precisely: the meticulous tracking of specific embryos versus the routine disposal of "low-grade" ones, the legal personhood claim in Alabama versus property-based approaches elsewhere. The student is particularly sharp to notice how parental grief over a lost embryo resembles mourning a child, while clinic procedures treat embryos as selectable/disposable resources.

  The philosophical heart seems to be about personal identity - does the specific sperm-egg combination define a unique future person? I should analyze this through Parfit's "Origin View" where identity depends entirely on conception materials. But then identical twins pose a problem - one zygote produces two persons. And sperm selection seems arbitrary when considering potential genetic variations.

  For practical implications: If we abandoned the "specific gametes = specific person" view, clinics might shift to batch-based record keeping. Consent forms would emphasize potential rather than individual entities. Liability rules would treat accidental loss as property damage rather than wrongful death. Counseling would frame embryo loss as lost opportunity rather than child loss.

  The student's twin example is especially potent. It shows that even if we grant embryos moral status, the "one embryo = one future person" equation fails biologically. This might suggest clinics should adopt a gradualist view - moral weight increases through development stages.

  I'll structure the response to first dissect the implicit philosophy, then test it against the twin/sperm paradoxes, then outline concrete changes if the current model proves inconsistent. The goal is to validate the student's observation while giving them tools to debate this in their seminar.
answer: |-
  Your analysis identifies a profound tension in fertility medicine between **biological essentialism** (identity fixed at conception) and **developmental potentiality** (value accrues over time). Here's a systematic breakdown:

  ### The Implicit Philosophical View ("Origin Essentialism")
  1. **Core Presupposition**: A person's identity is wholly fixed by the fusion of *one specific sperm* and *one specific egg*.  
     - **Consequence**: That particular embryo *is* a unique future person. Any other sperm/egg combination would produce a different individual.  
     - **Evidence in Practice**:  
       - Obsessive labeling/chain-of-custody implies each embryo is irreplaceable.  
       - Grief over discarded embryos frames loss as personal (not statistical).  
       - Alabama ruling legally enshrines this embryo-as-person view.  

  2. **What the Practice Strictly Requires**:  
     - Embryos as **discrete physical entities** (for tracking, grading, transfer).  
     - Embryos as having **differential potential** (grading implies variable viability).  
     - **No need for full personhood**: Discarding "low-grade" embryos assumes *not all* embryos are equally valuable.  

  3. **Underdetermined Elements**:  
     - The practice *could* coexist with:  
       - A **gradualist view** (moral status increases with development).  
       - A **modal realist view** (identity isn't tied to a single sperm, but to a genetic "range").  
     - Rival theories (e.g., Locke's psychological continuity) wouldn't support the practice, as they deny identity is fixed at conception.  

  ---

  ### Internal Tensions: Coherence or Contradiction?  
  | **Practice**                  | **Compatible with Origin Essentialism?** | **Conflict Analysis** |  
  |-------------------------------|------------------------------------------|------------------------|  
  | **Grading/discarding embryos** | No ❌                                    | Essentialism implies *all* embryos are unique persons. Discarding "low quality" ones contradicts this by treating some as expendable biological material. |  
  | **Donating to strangers**     | Partially 🤝                            | Transferring an embryo to new parents assumes identity is biologically fixed (consistent), but implies parental rights can be transferred (in tension with "child" rhetoric). |  
  | **"Make more embryos" counseling** | No ❌                                  | Framing embryos as replaceable commodities clashes with the "unique child" narrative. |  

  **Conclusion**: The conflict is **substantive**, not merely lexical. The Alabama ruling (embryo = child) is logically incompatible with routine discarding of embryos. Clinics rely on a **dual ontology**: embryos are *potential persons* when desired by parents, but *biological material* when surplus or low-grade.

  ---

  ### Testing Against Biological Realities  
  1. **Identical Twins (Monozygotic Splitting)**:  
     - **Problem**: One zygote (specific sperm+egg) produces two genetically identical but distinct persons.  
     - **Challenge to Essentialism**: If identity is fixed by the original gametes, twins should be one person. But they are not.  
     - **Clinic Response**: Twins are a biological anomaly; essentialism holds for *typical* cases.  

  2. **Sperm Variability (Which Sperm "Matters"?)**:  
     - **Problem**: Any of millions of sperm could have fertilized the egg. Would a different sperm produce "you"?  
     - **Essentialist Answer**: Yes—**only that exact sperm-egg pair** produces *you*. Change a single base pair, and it's a different individual.  
     - **Genetic Vagueness?**: Essentialism rejects this. Your genome is necessary and sufficient for your identity.  

  **Survival of the Presupposition**: Essentialism **fails** the twin test but holds firm on sperm variability. Clinics ignore this by focusing on embryos *as created*, not hypothetical alternatives.

  ---

  ### If Essentialism is Abandoned: Practical Changes  
  1. **Clinic Procedures**:  
     - Batch-based storage (not per-embryo tracking).  
     - Grading/discarding normalized without "loss" language.  

  2. **Consent Forms**:  
     - Frame embryos as "potential for pregnancy" rather than "potential children."  
     - Options for disposal/research presented neutrally (not analogous to "child donation").  

  3. **Liability Rules**:  
     - Accidental destruction treated as **property damage** or **breach of contract** (not wrongful death).  
     - Compensation limited to cost of IVF cycle, not emotional distress.  

  4. **Counseling**:  
     - Embryo loss framed as **failed attempt**, not death of a child.  
     - Emphasis on future cycles ("we can try again").  

  ---

  ### Key Philosophical Insight  
  Fertility medicine operates on a **pragmatic contradiction**: it needs embryos to be both **unique persons** (for emotional/legal weight) and **disposable biological material** (for medical efficiency). Resolving this requires choosing one ontology:  
  - **If embryos are persons**: Ban discarding/donating; treat all as patients.  
  - **If embryos are tissue**: Normalize selection/disposal; abandon "child" rhetoric.  

  Current practice is an unstable compromise. Your seminar might debate whether this reflects societal ambivalence or institutional hypocrisy. Either way, your critique exposes a fault line in reproductive ethics.
