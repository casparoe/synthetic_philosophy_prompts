   With 20 participants, we would have 20 data points per distance.

   Section 4: The experiment

   We'll describe the experiment in detail.

   Section 5: The wasp

   Both camps agree:
   - The anecdote illustrates a failure of flexibility.
   - It does not establish that all non-human animals are incapable of goal-return or that humans never exhibit similar failures.
   - The empirical standing has been questioned: it might be oversimplified or not general.

