   The user's hypothesis is that the profile is continuous. So perhaps:

   - Continuity: The probability of program-return increases linearly with interruption distance.
   - Discontinuity: The probability of program-return increases non-linearly (exponentially or step-wise) with interruption distance.

   We can measure the rate of program-return at low, medium, and high. Then we can fit a curve.

