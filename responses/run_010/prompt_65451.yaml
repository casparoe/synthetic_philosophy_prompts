  We are drafting a joint statement for two philosophical camps: Continuity and Discontinuity. The goal is to create a document both can sign, using the user's three notions (recovery depth, return type, interruption-distance profile) to frame the debate.

   The document should have the following sections:

   1. Claims both camps accept (substantive, non-trivial)
   2. Disagreements table (with columns: Continuity wording, Discontinuity wording, neutral wording, substantive/verbal, and if verbal the problematic word)
   3. Cruxes: sub-questions that would move at least one camp, with tests and predictions from each camp
   4. One concrete experiment (using student volunteers, stopwatch, index cards, laptop) with enough detail to run
   5. Agreement on the wasp anecdote: what it does and doesn't establish, and what must be shown to use it as evidence
   6. List of sentences that look like agreements but are actually only signed by one camp
   7. Closing paragraph from each camp on what would count as evidence against their position

   We are not deciding who is right. We are facilitating an adversarial collaboration.

   Let's build the document step by step.

   Section 1: Claims both camps accept

   Both camps agree on:
   - The brain is a mechanism (no dualism).
   - Behavior can be described at multiple levels (e.g., neural, cognitive, intentional).
   - The wasp anecdote illustrates a failure of flexibility in a fixed routine.
   - Humans and wasps both have routines, but humans can sometimes adjust when routines fail.

   But we need substantive claims that a serious opponent (say, a dualist or a vitalist) would object to.

   Proposed claims:

   1. All behavior, in both humans and non-human animals, is produced by mechanistic processes.
   2. The complexity of behavior in an agent arises from the interaction of its internal mechanisms and the environment.
   3. In the face of unanticipated perturbations, agents may fail to achieve their goals, and such failures can be informative about the architecture of the agent's control systems.
   4. The ability to recover from interruptions and continue towards a goal varies across species and across individuals within a species.
   5. The wasp, as described in the anecdote, exhibits a failure mode that is also observable, in attenuated forms, in humans (as in the user's debate example).
   6. The study of such failures requires careful operationalization of concepts such as interruption, recovery, and goal persistence.

   Section 2: Disagreements table

   We have to capture the core disagreements. The user has given two main points:

   Continuity: Flexibility is a matter of repertoire size and environmental fit. Higher-order routines (like revising routines) are still routines.
   Discontinuity: It's about architecture: having a representation of the goal that survives the failure of a particular means, and the ability to inspect and override routines.

   We can break down the disagreements into several points.

   Disagreement 1: The nature of flexibility.

   - Continuity: Flexibility is a quantitative matter of the size of the behavioral repertoire and its adaptability to the environment.
   - Discontinuity: Flexibility is a qualitative matter of the presence of a particular kind of control architecture that allows for meta-cognition and goal persistence beyond specific routines.

   Neutral: The disagreement concerns whether the difference between the wasp and a human is primarily one of degree (with humans having a larger set of routines and better environmental matching) or one of kind (with humans having a fundamentally different control structure that allows for representation of goals and meta-cognition).

   This is substantive.

   Disagreement 2: The nature of higher-order control.

   - Continuity: The ability to notice and revise one's own routines is itself a routine (or set of routines), and this regress eventually bottoms out in fixed mechanisms.
   - Discontinuity: The ability to inspect and override routines requires a representational architecture that is not merely a routine because it treats the routine as an object and can reason about it.

   Neutral: The disagreement concerns whether the process of revising one's behavior is an example of a routine (albeit a complex one) or a fundamentally different kind of process that involves meta-representation.

   This is substantive.

   Disagreement 3: The explanation of human behaviors like apologies.

   - Continuity: An apology is the result of a routine that is triggered by the failure of an expected outcome and the detection of a social norm violation. It is a learned response that is part of the behavioral repertoire.
   - Discontinuity: An apology requires the recognition of the failure as a failure of one's own action in light of a goal (e.g., maintaining social harmony) and the ability to generate a novel response (the apology) that is not just the re-running of a pre-programmed routine.

   Neutral: The disagreement concerns whether complex human behaviors that seem to involve self-reflection and responsibility can be fully explained by the execution of routines, or whether they require a different kind of cognitive architecture.

   This is substantive.

   However, note that the user mentioned an argument that sometimes collapses:

   Continuity: Show me the mechanism that is not a routine.
   Discontinuity: Then explain why in humans the same mechanism produces an apology.

   We can add that as a fourth row:

   Disagreement 4: The reducibility of complex human behaviors to routines.

   - Continuity: All human behaviors, including apologies, are the result of routines (even if very complex and context-sensitive).
   - Discontinuity: Some human behaviors, such as apologies, cannot be reduced to routines because they require the agent to represent its own actions as having failed and to take responsibility, which implies a break from routine execution.

   Neutral: The disagreement is whether the cognitive processes underlying behaviors like apologies can be fully captured as routines.

   This is substantive.

   But note: the user also said that sometimes the disputes are verbal. We must flag if any are.

   In the above, we have four substantive disagreements. However, the user's own framework (recovery depth, return type, profile) might help reframe.

   We might also have a verbal disagreement about the word "routine". 

   Disagreement 5: Definition of "routine"

   - Continuity: Any mechanistic process that produces behavior is a routine, regardless of complexity or flexibility.
   - Discontinuity: A routine is a fixed, inflexible sequence that cannot be adjusted without an external trigger or a higher-level process.

   Neutral: The disagreement concerns the definition of the term "routine". 

   This is verbal. The problematic word is "routine".

   Section 3: Cruxes

   We need sub-questions that, if settled, would move at least one camp. We also need tests and predictions.

   Crux 1: Can an agent with a fixed set of routines exhibit recovery depth greater than a small constant (say, 1 or 2) for a wide range of tasks?

   - Test: Design experiments that introduce nested interruptions. For example, in a task, interrupt the agent at different levels and see how many nested interruptions it can handle before either abandoning the goal or rigidly resuming a subroutine.

   - Continuity prediction: Recovery depth can be arbitrarily high by having a hierarchy of routines, each handling interruptions at their level. Thus, they predict that with sufficient complexity, an artificial system (or a biological one) can have high recovery depth without needing a non-routine architecture.

   - Discontinuity prediction: Without a goal-representation architecture, recovery depth will be very limited (e.g., only one or two levels) and will break down in novel ways. They predict that systems without the proposed architecture will show a catastrophic drop in the interruption-distance profile after a small number of nested interruptions.

   Crux 2: Is goal-return behavior possible without a representation of the goal that is separable from the specific means?

   - Test: Train agents (animals or humans) on a task, then interrupt the task and see if they can return to the goal (and choose a new means) or only to the interrupted subroutine.

   - Continuity prediction: Goal-return can be implemented by having multiple routines that are triggered by the goal state. They predict that with a complex enough set of routines, an agent can exhibit goal-return without needing a separate goal representation.

   - Discontinuity prediction: Goal-return requires a representation of the goal that is maintained independently of the current means. They predict that without such a representation, the agent will always show program-return.

   Crux 3: How does the interruption-distance profile look? Is it continuous (gradual decline) or discontinuous (sharp drop-off) as the perturbation moves further from the normal task?

   - Test: Measure the probability of goal-return vs. program-return for perturbations at varying distances from the norm.

   - Continuity prediction: The profile is continuous and graceful (gradual decline) because it reflects the statistics of the environment and the agent's learned repertoire. They predict that even in humans, for very novel perturbations, the profile will show a decline.

   - Discontinuity prediction: The profile has a sharp drop-off (catastrophic) for agents without the goal-representation architecture, but a more graceful decline for those with it. They predict that in humans (with the architecture) the decline is gradual, but in wasp-like agents it is sharp.

   The user wants at least one crux that can be tested with 20 student volunteers, a stopwatch, index cards, and a laptop.

   Proposed experiment for Crux 3:

   Experiment: Interruption-Distance Profile in Humans

   Materials:
   - Laptop with a program that presents a multi-step task (e.g., a sequence of math problems or a memorized procedure).
   - Index cards with instructions and perturbations.
   - Stopwatch.

   Procedure:
   1. Participants are trained on a task that has a clear goal and a specific procedure. Example: a sequence of 10 steps to solve a puzzle on the laptop, or a memorized sequence of actions (like the user's speech).
   2. The task is designed so that it can be interrupted at any step.
   3. We define a set of perturbations that vary in "distance" from the normal task. Distance can be operationalized by:
      - Low distance: A perturbation that is similar to the task (e.g., a question about the current step).
      - Medium distance: A perturbation that is related but not directly about the current step (e.g., a question about a previous step or a different aspect of the task).
      - High distance: A perturbation that is unrelated (e.g., a sudden request to do a completely different task for a moment).
   4. Each participant is tested multiple times, with interruptions at each distance level (within-subjects design).
   5. After the interruption, the participant is allowed to resume the task.

   Operational definitions:
   - Goal-return: The participant resumes the task by either (a) explicitly stating the goal and then deriving the next step, or (b) skipping to the next appropriate step without redoing the interrupted step. Example: if the task is a sequence of math problems, and after interruption the participant continues from the next problem without redoing the interrupted one.
   - Program-return: The participant goes back to the beginning of the interrupted subroutine and re-executes it. Example: restarting the entire sequence from step 1, or redoing the step that was interrupted.

   Trial count: Each participant experiences 15 interruptions: 5 at each distance level (low, medium, high), randomly ordered.

   Prediction:
   - Continuity: The probability of goal-return will decline gradually as distance increases.
   - Discontinuity: The probability of goal-return will decline sharply at a certain distance threshold, but for low and medium distances it might be high.

   However, note: the user's hypothesis is that the profile is continuous across species and individuals, but the camps disagree on the shape. So:

   - Continuity would predict a graceful decline (linear or gradual).
   - Discontinuity would predict a sharp drop (step-function) at a certain distance.

   But note: Discontinuity camp might argue that humans have the architecture so they should have a graceful decline? Actually, they think the architecture allows for a graceful decline. Without it, it's sharp. But in this experiment we are testing humans. So:

   - Continuity: In humans, the profile is continuous (graceful) because of their large repertoire and learning. They would predict a gradual decline.
   - Discontinuity: In humans, because they have the goal-representation architecture, the profile should remain high even at medium distances and only decline at very high distances, but the decline might be less sharp than in non-humans. However, for the purpose of the crux, we can focus on the shape within humans.

   But note the user's hypothesis: that the camps are divided by the shape of the profile. The Discontinuity camp might argue that even in humans, for tasks that are overlearned and rigid (like the memorized speech), the profile might be sharp. They might predict that in the user's speech example, the interruption at a high distance (like an unrelated question) caused a program-return (restarting the speech) because the task was encoded as a fixed routine without goal-representation.

   So let's reframe the experiment to test the user's own experience.

   Experiment on Memorized Sequences:

   Materials:
   - A memorized sequence (e.g., a list of 10 words, or a procedure with 10 steps) that the participant must perform.
   - A set of interruption questions: low distance (about the current item), medium (about a previous item), high (unrelated).

   Procedure:
   1. Participants memorize a sequence of 10 items (e.g., words on index cards) to a criterion (e.g., two perfect recalls).
   2. Then they are asked to recall the sequence. During recall, at a random step (say step 5), they are interrupted with a question.
      - Low: "What was the word at step 5?" (the current step)
      - Medium: "What was the word at step 3?" (a previous step)
      - High: "What is the capital of France?" (unrelated)
   3. After answering, they are told to continue the recall.
   4. We record whether they:
      a) Continue from step 6 (goal-return: they are continuing the sequence from the next step)
      b) Restart from step 1 (program-return: they restart the entire sequence)
      c) Repeat step 5 and then continue (this is also program-return: they are re-executing the interrupted subroutine)

   Operational definitions:
   - Goal-return: Resuming from the next step (step 6) without redoing step 5 or restarting.
   - Program-return: Either restarting from step 1 or redoing step 5.

   Prediction for the high distance interruption:
   - Continuity: Participants will sometimes show goal-return and sometimes program-return, but the probability of program-return will increase with distance. However, they predict a gradual increase.
   - Discontinuity: For high distance interruptions, participants will be more likely to show program-return, and the increase will be sharp (non-linear). They might also predict that for low and medium, goal-return is common, but for high, it drops sharply.

