   Discontinuity: Evidence against our position would be the demonstration that all human behaviors, including goal persistence after multiple novel interruptions and the ability to reflect on and change one's own routines, can be fully implemented by a system that lacks a separable goal representation and meta-cognitive architecture, and that such behaviors can be explained solely by the interaction of routines.

