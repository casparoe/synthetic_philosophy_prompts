  For the prep sheet structure: I'll rank objections by damage potential rather than likelihood. The RL modeler's terminology critique could be fatal if it frames their whole approach as invalid. The prediction demand from field researchers is high-stakes but survivable if handled right. The conceptual engineer's objection is thorny but niche. 

