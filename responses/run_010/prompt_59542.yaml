  First, recall Hacking's ideas:

  Hacking, in "The Social Construction of What?" and "Making Up People", argues that in the human sciences, classifications (like mental illnesses) are interactive kinds. When we classify people, they become aware of the classification and may change their behavior in response. This alters the very thing being classified, creating a feedback loop (looping effect). This is different from indifferent kinds (like rocks) that don't change when classified.

  Key points:
  1. Classifications can change the behavior of the classified (interactivity).
  2. This leads to a looping effect: the classification and the people co-evolve.
  3. Over time, this can lead to the creation of new kinds of people (e.g., the category of "homosexual" as a kind of person emerged in the 19th century, and then people started identifying with it, changing behavior and the category itself).

  Now, map to the user's vocabulary:

  - **Retraining pipelines**: The model is retrained periodically based on new labels.
  - **Target drift**: The distribution of the target variable changes over time.
  - **Performativity**: The act of classification changes the behavior of the classified (in this case, the patient) and the classifier (clinician). The risk score influences what the clinician looks for, which in turn may influence the patient's behavior and the labels.
  - **Fixed points**: A state where the system stabilizes (e.g., the model and behavior reach equilibrium).
  - **Goodhart**: When a measure becomes a target, it ceases to be a good measure (because people game it). In this context, if the risk score becomes the focus, it might be gamed by clinicians or patients.
  - **Difference between measuring a rock and measuring something that reads its own measurement**: Rocks don't change when measured, but people do. This is analogous to indifferent vs. interactive kinds.

