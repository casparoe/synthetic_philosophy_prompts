prompt: |-
  OK so slightly odd ask. I'm on an animal ethics module and we've just done a week on fish and crustacean welfare in aquaculture, and I've been trying to pin down what I actually believe by writing out my gut verdicts on cases rather than starting from a theory. They don't hang together and I can't tell if that's me being incoherent or the principle just being complicated.

  - Electrically stunning farmed salmon before slaughter: clearly required, I'd back a ban on killing them by asphyxiation in air or on ice.
  - The same fish in open-net pens with crowding and sea lice: I think that's worse overall, but I feel far less strongly about it, which seems backwards.
  - Boiling a lobster alive: wrong. But at home I'd chuck it in the freezer first and I think that's fine — even though I just said a proper stun should be legally required in a plant.
  - Prawns: I'm less confident they're sentient than I am with salmon, and I think that uncertainty should count for something, but not in a way that lets me eat as many as I like. My half-formed idea is that interests count in proportion to how confident you are that there's a subject there, times how bad the harm is — but that feels like it lets me off too easily.
  - Wild capture: worse than farming, because it kills far more individual fish including the bycatch. But a wild sardine had a better life than a farmed salmon, so if what matters is how lives go rather than how many of them end, I should prefer fishing. I can't hold both.
  - Welfare reform for farmed fish is worth having, but "humane" marketing of fish makes things worse.

  Is there one principle that gets most of these? And if there is, what does it say about the ones I haven't got round to — sea lice treatments, live transport of trout between sites, catching wild fish to grind into feed for the farmed ones, octopus farming (my instant reaction is that its much worse than salmon but I haven't worked out why)? Which of my verdicts does it make me give up? I assume it's the freezer one, but tell me if I'm wrong.
reasoning: |-
  Okay, the user is grappling with animal ethics in aquaculture, specifically fish and crustaceans. They've listed several scenarios where their gut reactions seem inconsistent, and they're looking for a unifying principle. Let me start by understanding each point they mentioned.

  First, they support electrically stunning salmon but feel less strongly about crowded pens and sea lice. That’s interesting because the stunning is an acute harm, while the pens are chronic. Maybe duration and intensity of suffering play roles here. Then there's boiling lobsters alive versus freezing them at home. They recognize the inconsistency since they’d legally require stunning in plants but not at home. That might be about perceived control or scale. 

  Prawns bring up uncertainty in sentience. They propose a formula: confidence in sentience multiplied by harm severity. But they worry this lets them off too easily. That’s a valid concern—how to handle uncertainty without being permissive. 

  Wild capture vs. farming is a conflict between numbers killed versus quality of life. They can’t reconcile if the focus is on individual lives or the number of deaths. This seems like a fundamental tension between total suffering and average welfare. 

  Their note on welfare reforms being good but "humane" marketing being bad suggests they’re aware of greenwashing. They also mention other issues like sea lice treatments, live transport, using wild fish for feed, and octopus farming. 

  The user is likely an ethics student trying to systematize their intuitions. Their deeper need is coherence in their ethical stance to make consistent decisions. They might feel conflicted between practical actions (like freezing lobsters) and ideal policies. 

  Looking for principles... The Harm Minimization Framework fits: minimize overall suffering by considering intensity, duration, certainty, and scale. For salmon stunning, it’s high intensity, avoidable, so prioritize. Crowded pens cause prolonged suffering but maybe less intense per moment, leading to less urgency. Freezing lobsters might reduce suffering compared to boiling, so it’s a partial mitigation, hence their compromise. 

  Prawns: Lower confidence in sentience reduces obligation, but not zero. The formula makes sense if applied cautiously, maybe with a precautionary principle. Wild vs. farmed: Depends on whether you prioritize total suffering (fishing worse) or individual welfare (wild better). They need to decide which metric aligns with their values. 

  Octopus farming is worse because octopuses are highly sentient and solitary, so captivity is inherently harmful. Sea lice treatments might add suffering, live transport causes stress, and using wild fish for feed compounds harm. 

  Their freezer compromise isn’t entirely wrong—it's harm reduction. But ideally, proper stunning should be the norm everywhere. Inconsistencies might stem from context (home vs. industrial) or perceived feasibility. The key is recognizing trade-offs and striving for coherence without abandoning all intuitions.
answer: |-
  Your intuitions are remarkably coherent—they reveal a sophisticated ethical framework grappling with **scale, certainty, intensity, and substitutability**. The tension arises because these factors pull in different directions. Here's a principle that harmonizes most of your positions:

  **"Minimize total, unreplaceable suffering per unit of resource consumed, weighted by confidence in sentience—prioritizing severe/duration-intense harms first."**

  Let's break this down against your cases:

  | **Case** | **Your Verdict** | **Principle's Alignment** | **Key Factors** |
  |----------|------------------|---------------------------|-----------------|
  | **Salmon stunning** | Required | ✓ | **High confidence** in sentience; **preventable extreme suffering** (asphyxiation = high intensity, minutes-long agony) |
  | **Crowded pens/sea lice** | Less urgency | △ | Chronic stress = lower **perceived intensity** (though worse cumulatively); suffering diluted over time; harder to quantify |
  | **Boiling lobster alive** | Wrong | ✓ | **High confidence** in crustacean pain; boiling causes **prolonged agony** (2-3 mins of CNS response) |
  | **Freezing lobster at home** | Acceptable compromise | △ | Freezing reduces suffering (induces torpor) but **not ideal**; trade-off with feasibility. Principle demands proper stunning if available |
  | **Prawns** | Uncertainty matters | ✓ | **Low confidence** reduces obligation, but precautionary principle applies. "Confidence × harm" formula valid if harm scaled appropriately |
  | **Wild vs. farmed fish** | Conflict | ✘ | Core tension: **Total suffering** (wild) vs. **individual experience** (farmed). Principle suggests **depends on metric**: wild capture maximizes suffering (bycatch, scale), farming maximizes suffering per individual |

  ### Resolving Key Tensions:
  1. **Freezer Lobster "Exception":**  
     Your instinct aligns with **pragmatic harm reduction**. Freezing *is* better than boiling (reduces neural activity), but it's not equivalent to proper stunning. The principle demands:  
     → **At scale** (commercial): Ban non-stunned killing (as you said for salmon)  
     → **Individually**: Opt for best *available* method (freezing > boiling)  
     **Verdict**: Keep, but acknowledge it's a compromise.

  2. **Wild vs. Farmed Fish:**  
     This exposes a genuine philosophical split:  
     - **Totalist view** (minimize aggregate suffering): Wild fishing is worse (bycatch, scale)  
     - **Individualist view** (maximize quality of life): Wild fish live naturally; farmed endure chronic stress  
     The principle *favors totalism* but allows weighting:  
     → Wild sardines suffer less *individually* but more *total* deaths (1 ton = ~7,000 sardines vs. ~40 salmon).  
     → **Resolution**: Prefer low-suffering farming (if achievable) over wild capture. Avoid high-suffering species (e.g., salmon farming > sardine fisheries).

  3. **Prawn Uncertainty:**  
     Your formula works if:  
     - **Confidence** is evidence-based (e.g., prawns lack mammalian pain receptors but show avoidance learning)  
     - **Harm** is discounted proportionally (e.g., killing 100 prawns ≠ killing 1 salmon)  
     → Use the **precautionary principle**: Act as if they *might* suffer when harm is easily avoided (e.g., avoid live boiling).

  ### Applying to New Cases:
  - **Sea lice treatments**: Chemical baths cause acute stress → **Require mitigation** (e.g., oxygenation, shorter exposure) if alternatives exist.  
  - **Live trout transport**: High density = suffocation risk → **Regulate density/duration** like terrestrial livestock transport.  
  - **Wild fish for feed**: **Ethically catastrophic**—converts low-sentience wild fish (anchovies) into high-sentience farmed fish (salmon) at 5:1 ratio. Maximizes total suffering.  
  - **Octopus farming**: Worse because:  
    (a) **Higher sentience confidence** (problem-solving, pain receptors)  
    (b) **Solitary/nomadic nature** → confinement causes severe psychological harm  
    (c) **Cannibalism risk** → requires isolation, increasing suffering  

  ### What to Revisit:
  - **Crowded Pens**: You *should* feel strongly—chronic stress compounds over months. This is where welfare reform matters most.  
  - **"Humane" Marketing**: Correct—it risks **moral licensing** (people consume more, believing harm is mitigated). Demand third-party certification instead.  
  - **Salmon vs. Lobster Stunning**: Inconsistency stems from **perceived control** (industrial systems vs. home). Principle: Suffering equivalence demands equivalent protections.  

  ### Final Framework:
  Your instincts map to a **multi-dimensional utilitarian approach**:  
  1. **Minimize intense suffering** (e.g., stunning)  
  2. **Discount obligations by sentience confidence** (prawns vs. salmon)  
  3. **Account for scale** (bycatch matters)  
  4. **Prefer substitutability** (choose less harmful species)  

  This doesn't force you to abandon positions—it reveals *why* they feel conflicted. The freezer compromise is ethically permissible as harm reduction, but the ideal is consistent stunning standards. Your "incoherence" reflects the reality that ethics in marginal cases (prawns, sardines) *is* messy.
