answer: |-
  ## The Baseline Problem in Moral Debiasing

  ### 1. What "Bias" Presupposes: The Elusive Baseline
  A judgment is deemed "biased" only relative to a standard it allegedly deviates from. In statistical contexts, the baseline is objective frequency (e.g., a coin is biased if it lands heads 70% of time when fairness implies 50%). In perception, it's physical reality (e.g., a stick appears bent in water due to optical refraction bias). Moral judgments, however, lack such uncontroversial anchors. Three candidate baselines exist, each smuggling in normative commitments:

  *   **Coherence Baseline:** The standard is the subject's own consistent, reflective judgments under idealized conditions (e.g., full information, calm deliberation). A judgment is biased if it conflicts with the subject's own "considered convictions" in reflective equilibrium. "Bias" here borrows normativity from the ideal of rational coherence – inconsistency is deemed irrational. However, this baseline cannot adjudicate *which* of conflicting intuitions (e.g., rejecting active harm in trolley switch but accepting passive harm in footbridge) is the biased one without appealing to further substantive norms.
  *   **Substantive Baseline:** The standard is objective moral truth. A judgment is biased if it fails to track these truths. "Bias" borrows its normative force from the presumed authority and correctness of moral reality. However, identifying this baseline requires contested meta-ethical commitments (moral realism) and substantive first-order moral theory. Crucially, data on *how* people judge cannot reveal *what* moral truth *is*; it can only reveal discrepancies between common judgment and a *theorist's* proposed truth.
  *   **Outcome Baseline:** The standard is value maximization (e.g., maximizing welfare, preference satisfaction). A judgment is biased if it leads to choices producing less aggregate value than available alternatives. "Bias" borrows normativity from consequentialism – inefficiency in promoting the good is deemed defective. Like the substantive baseline, this presumes a specific (consequentialist) normative theory. Data on judgment patterns cannot validate consequentialism itself as the correct baseline.

  The choice among these baselines is irreducibly normative. Data about judgment patterns (e.g., omission bias prevalence) cannot determine whether coherence, objective truth, or outcome optimization *should* be the standard. Claiming omission bias *is* a bias presupposes one has already chosen a baseline (likely coherence or outcome) that renders the distinction normatively irrelevant. The ethicist defending doing/allowing assumes the substantive baseline *incorporates* the distinction as truth.

  ### 2. Beyond Empirical Dispute and Verbal Quibbling
  The psychologist labeling omission bias a "bias" and the ethicist defending the doing/allowing distinction are not disagreeing about the empirical phenomenon: both agree people systematically judge actively caused harms as worse than equivalent passively allowed harms. Nor is it merely verbal: both use terms like "harm," "judgment," and "significance" consistently.

  The core disagreement lies in the **normative baseline already embedded in the *description***. The psychologist's very label "omission *bias*" encodes the presupposition that the distinction *should not* matter – that the only relevant factor is the outcome's badness. This presupposes the coherence baseline (the distinction leads to inconsistent judgments) or the outcome baseline (the distinction impedes optimal outcomes). The ethicist's defense of the distinction as "morally real" encodes the substantive baseline – the distinction *is* part of moral truth itself. The description "bias" versus "morally significant distinction" isn't a neutral report of the phenomenon; it's a loaded characterization based on a contested baseline choice. The psychologist sees deviation from a presumed norm (equal treatment of outcomes); the ethicist sees accurate tracking of a different norm (the inherent moral difference between acts and omissions).

  ### 3. Question-Begging Bracketing
  The proposed decision procedure (stripping context to see if the effect persists) fails because bracketing manipulates precisely what is at stake:

  *   **Manufacturing Preference from Bias:** Suppose the doing/allowing distinction *is* a genuine moral truth deeply embedded in context (e.g., based on relationships, roles, or entitlements). Removing context strips away the very features that *make* the distinction morally relevant. If the distinction *disappears* in bare hypotheticals, the proceduralist concludes it was mere "contextual noise" (a bias). But this assumes context *is* noise, not the essential ground of the moral distinction. The procedure dissolves the potential moral consideration by design. (E.g., Removing "doctor letting patient die vs. injecting poison" to bare "Person A causes death/Person B allows death" erases the role-based duties central to the ethicist's defense).
  *   **Manufacturing Bias from Preference:** Conversely, suppose the distinction *is* a cognitive artifact (a true bias). Some contextual features might *mask* it (e.g., strong emotional cues favoring action). If the distinction *persists* in the bare hypothetical stripped of masking noise, the proceduralist concludes it reflects a "preference." However, this assumes the bare context reveals a "core" judgment, not that the artificial simplicity *creates* a new, equally artificial consistency or preference for passivity. The procedure might isolate a cognitive quirk, mistaking it for a normative preference. (E.g., In a bare scenario devoid of reasons *for* action, passivity might seem "safer," but this doesn't show it's a considered preference rather than a default cognitive setting).

  The procedure assumes that bare hypotheticals reveal "core" judgments, implicitly favoring a coherence baseline where internal consistency in simplified cases is the ideal. It prejudges context as either irrelevant noise (if the effect disappears) or as a distractor from the "true" preference (if the effect persists), begging the question against the ethicist who sees context as constitutive of the moral distinction.

  ### 4. Disaster Relief Case: Two Readings
  *   **Framing Artifact (Bias Reading):** Subjects exhibit "status quo bias" – an irrational preference for the current state of affairs simply because it is the default. In the first condition ("alter the existing allocation?"), the default is the status quo, and inertia prevails. In the second ("choose a proposal?"), there is no default, revealing subjects' "true" preference for a different allocation. The inconsistency across identical distributions exposes a cognitive flaw – a sensitivity to framing irrelevant to the moral task of optimal relief distribution (Outcome Baseline) or coherent preference (Coherence Baseline). The "existing entitlements" invoked are illusory.
  *   **Preserved Moral Weight (Principle Reading):** The first condition recognizes a morally relevant factor absent in the second: legitimate expectations and existing entitlements. Towns have planned and relied upon the existing budget for a year; changing it unfairly disrupts these settled expectations, imposes new burdens of adjustment, and potentially violates claims based on prior agreement or need-assessment. This disruption constitutes a genuine additional moral cost not present when choosing between proposals for a *new* allocation. The different choices reflect a rational sensitivity to this moral difference (Substantive Baseline). Subjects aren't biased; they are correctly weighing distinct moral situations.

  **Why the Result Cannot Arbitrate:** The empirical finding – different choices despite identical distributions – is neutral between these interpretations. To see the result as proof of *bias* requires assuming that the *only* morally relevant factors are the numerical outcomes (the distributions of relief), making the framing irrelevant. To see it as proof of a *principled distinction* requires assuming that existing entitlements *are* morally relevant, making the framing (status quo vs. proposal) essential context. The data describes the behavioral pattern; its normative significance depends entirely on which baseline (and thus which set of morally relevant factors) one accepts *a priori*.

  ### 5. Salvaging "Moral Bias"
  Granting the baseline problem weakens "moral bias" but need not render it empty. A viable formulation lies between substantive truth claims and mere disagreement:

  *   **Deviation from Idealized Coherence under Shared Normative Constraints:** A judgment is biased if it persistently deviates from what the agent *would* endorse under conditions promoting rational coherence (full information, cognitive effort, no time pressure, emotional calm) *and* where the agent is constrained by minimal, widely shared normative premises relevant to the domain. The key is the "shared normative constraints."

      *   **Example:** Most agree that minimizing unnecessary suffering is a good (a minimal shared constraint in harm contexts). If, under ideal deliberation respecting this constraint, an agent would reject the doing/allowing distinction as irrelevant to minimizing suffering *in a specific case type* (e.g., impersonal trolley-like dilemmas), yet persistently relies on it in real-world judgments under pressure, that reliance might be deemed a bias *relative to their own coherent commitments under the shared constraint*. It's a failure of their reasoning to track their own (ideally coherent) principles given a minimal shared value.
      *   **Licensing Claims about Doing/Allowing:** For omission bias, this allows saying: *If* we accept that minimizing equivalent harm is the sole relevant shared constraint in a specific context (e.g., allocating impersonal aid), *and* subjects under ideal conditions would disregard doing/allowing for that context, *then* their reliance on it in hurried judgment is a bias relative to *their own* (ideally coherent) commitment to harm minimization. However, this does *not* license the global claim that the doing/allowing distinction is *inherently* biased. The ethicist can still argue that the distinction *is* a fundamental constraint, or that the "minimal shared constraint" (mere harm minimization) is insufficient for true moral judgment. The attribution remains conditional and localized.

  **What the Concept Was Doing:** Absent this weaker formulation, "moral bias" in debiasing literature often functioned by *implicitly* borrowing normativity from the coherence or outcome baseline while presenting itself as purely descriptive. It smuggled in contestable normative assumptions (e.g., consequentialism, or that consistency is the paramount rational virtue) under the guise of identifying cognitive errors. The baseline problem exposes this sleight of hand. The concept wasn't meaningless; it was doing normative work disguised as psychology, relying on the unstated premise that deviations from coherence or outcome optimization *are* defects worthy of the label "bias." Its persistence highlights the allure – and the difficulty – of grounding critiques of human judgment without appealing to contested moral foundations. The tension between the literatures reveals that declaring a judgment pattern a "bias" is never a purely empirical act; it is always an incursion into normative territory.
