     1.4. Representation with multiple priors: It is possible to represent an agent's state of uncertainty in the Ellsberg urn by a set of probability distributions (often called a set of priors) over the events. The agent's choices can then be modeled using a decision rule that aggregates these distributions (e.g., minmax expected utility, maxmin, or a non-linear weighting). Such representations can reproduce the typical Ellsberg preferences.

