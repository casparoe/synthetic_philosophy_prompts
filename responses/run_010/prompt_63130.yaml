answer: |-
  Below is a clear breakdown of the distinct claims within Du Bois' statement, evaluated through the four levels you specified. I’ll address each element of your query systematically, using British English throughout.

  ---

  ### **Du Bois' Statement: "Thus all art is propaganda and ever must be, despite the wailing of the purists."**  
  *Breakdown of Claims by Level*  

  1. **Ontological Claim (What Art *Is*)**  
     - *Claim*: Art is inherently propaganda — it cannot exist outside systems of persuasion, ideology, or social influence.  
     - *Evaluation*:  
       - **Substantive and defensible** (but not universally accepted).  
       - This views art as a social act that inevitably reflects, challenges, or reinforces dominant power structures. Even "apolitical" art exists within a status quo it implicitly endorses.  
       - *The "must" here*: Descriptive (art *cannot avoid* this function due to its cultural context).  

  2. **Intentional Claim (What Artists *Intend*)**  
     - *Claim*: Artists consciously or unconsciously create propaganda; neutrality is impossible.  
     - *Evaluation*:  
       - **Substantive but overreaching**.  
       - While art often reveals an artist’s worldview, not all art is *intended* as persuasion (e.g., a still-life painting). Du Bois likely emphasises art's *effect* over intent.  
       - *The "must" here*: Leans prescriptive (artists *should* acknowledge their work’s ideological role).  

  3. **Functional Claim (What Audiences *Do* with Art)**  
     - *Claim*: Audiences invariably interpret art through ideological lenses, using it to affirm or challenge beliefs.  
     - *Evaluation*:  
       - **Trivially true in part, but reductive**.  
       - Art *can* be used as propaganda by audiences/states (e.g., fascist co-option of Wagner). However, audiences also engage with art for beauty, solace, or ambiguity — not solely ideological validation.  
       - *The "must" here*: Descriptive (audience interpretation is socially conditioned).  

  4. **Normative Claim (How Art *Ought* to Be Judged)**  
     - *Claim*: Artistic value rests solely on its efficacy as propaganda; craft/beauty are secondary to its political function.  
     - *Evaluation*:  
       - **Substantive but contentious**.  
       - Defensible for activist art (e.g., anti-colonial work), but false as a universal rule. It dismisses art that prioritises aesthetic innovation, emotional truth, or ambiguity (e.g., Beckett’s *Endgame*).  
       - *The "must" here*: **Prescriptive** (art *should* serve emancipatory politics).  

  ---

  ### **Key Ambiguities & Your Concerns**  
  - **The "Must" Dilemma**:  
    - If *descriptive* (art is unavoidably propaganda), the claim is circular: it frames itself as an ideological statement, undermining its objectivity.  
    - If *prescriptive* (art *must be used as* propaganda), it self-applies: Du Bois’ essay becomes propaganda for his view — which he’d likely accept, but weakens its authority as a neutral argument.  

  - **Du Bois’ Inconsistency**:  
    You recall correctly. In *The Crisis* (1921), he criticised rigid propaganda-art unity, fearing it would stifle Black artists’ creative freedom. His 1926 statement reflects a strategic shift amid urgent civil rights struggles. **The director cherry-picks the 1926 quote without acknowledging this tension.**  

  - **Self-Application Test**:  
    If the director applied his reading consistently:  
    - *Hamlet* (lacking explicit politics) becomes "propaganda for monarchy".  
    - *Waiting for Godot* (abstract, existential) becomes "propaganda for nihilism".  
    Few accept this reductively — **the director likely applies it selectively to works he dislikes**.  

  ---

  ### **Do Any Claims Justify the Director’s Conclusions?**  
  1. **Conclusion 1: "A play declining to take a side is propaganda for the status quo."**  
     - **Licensed by**: The *ontological* and *functional* claims. If all art reinforces or challenges ideology, "neutral" art passively upholds existing power structures (e.g., a play about gardening might ignore class/colonialism underpinning land ownership).  
     - **But**: This ignores art’s capacity to create spaces *outside* ideology (e.g., contemplative beauty).  

  2. **Conclusion 2: "Craft/beauty are irrelevant once art is seen as propaganda."**  
     - **Licensed only by** the *normative* claim (if art’s sole purpose is political efficacy).  
     - **Problem**: Even propaganda relies on craft/beauty to persuade (e.g., Orwell’s essays). Du Bois himself demanded "truth" and "beauty" alongside propaganda.  

  ---

  ### **Summary Verdict**  
  - **Director’s Interpretation**: Overextends Du Bois into a rigid dogma. The 1926 quote emphasises art’s *inescapable political dimension* (a defensible, nuanced view), not that all art must *intentionally* serve a cause or that craft is irrelevant.  
  - **A Consistent Reading?**: Only if applied universally — which would condemn beloved "apolitical" classics. The director’s refusal to programme a quiet play suggests a *prescriptive* (not descriptive) use of Du Bois.  
  - **Your Instincts**: Correct. The director conflates distinct claims and ignores Du Bois’ own complexities. Art can be *contextually* propaganda without reducing all value to politics. Craft and beauty remain essential — even to propaganda’s effectiveness.  

  **Practical Suggestion**: Challenge the director to apply his standard to a play *he* admires. If *King Lear* (a play about an old man and his land) isn’t "status-quo propaganda" due to its craft, then the garden play deserves the same scrutiny. Du Bois sought to politicise art, not erase its aesthetic soul.
