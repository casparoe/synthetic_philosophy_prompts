prompt: |-
  Phenomenon-hunting question. Mostly I want to know whether the field already has a word for this, and if it doesn't, whether it should.

  I've been reading the arguments about whether DNA really is a code, or whether "information" talk in genetics is just decoration laid over plain chemistry. I'm not trying to settle that — both sides have good points. What I keep tripping over is a pattern in how the arguments travel, and it doesn't look like what either side thinks it is.

  "Codes for" seems to get used in two very different ways. In one, the claim is checkable and pretty uncontroversial: read this stretch of bases three at a time and it maps onto this string of amino acids, you can do the mapping yourself with the table, and the correspondence looks arbitrary in the sense that nothing about the chemistry of a given codon forces it to mean that particular amino acid. In the other, the sentence frame is identical but the claim is way bigger: the gene codes for blue eyes, for a temperament, for the shape of the organism.

  Now watch what happens in the debates. Somebody writes a debunking argument aimed squarely at the second use — development isn't executed from a script, there's no reader running the program, nothing at the trait level survives a translation test. Fine. But the argument gets read and cited as if it had shown the first use was bogus too, and people who work with the codon table every day end up defending themselves against a charge that was never aimed at what they're doing. And it runs the other direction as well: someone defends genetic information talk by pointing at the table, which really is a table, really is a mapping, and readers come away thinking the trait-level claims got vindicated by association. Same verb, same syntax, and credibility flows both ways across a gap the argument never actually crossed.

  I see the same shape elsewhere — entropy in thermodynamics versus entropy as social disorder, where debunking the second gets heard as an attack on the first, and invoking the first is treated as licensing the second — but genetics is where I keep hitting it.

  I don't think its plain equivocation, because usually no single argument uses both senses. Each party is talking about one of them, and the slippage happens in the audience and in the citation chain, not inside an inference. And it isn't motte-and-bailey either, at least most of the time, since nobody is strategically ducking into the safe sense and then creeping back out — it's passive, it needs no motive, and it works just as well on people who'd never make the move deliberately. It's more like the two uses are welded together by sharing a verb, and warrant leaks across the weld in both directions.

  So: is there an established term for this? A case where a technical use and a loose extended use share a word and a sentence frame, and each borrows credibility from the other, in a way that keeps working even after criticism has landed on one of them? If there is one, I want to know how it's marked off from equivocation, from dead metaphor, and from the ordinary stretching that any technical term undergoes once it goes popular — and which of those is actually the better fit for what I described. If there isn't one, propose a term and define it tightly enough that I could tell whether a given instance is a real case or just me seeing the pattern everywhere. Give me some boundary cases and some near-misses you'd exclude. The label itself is the least important part; I want the carving.
reasoning: |-
  Okay, the user is describing a specific linguistic phenomenon they've observed in scientific debates, particularly in genetics. They notice that the phrase "codes for" is used in two distinct ways: one technical (codon to amino acid mapping) and one broader (gene to trait mapping). Critiques of the broader usage often get misapplied to the technical one, and vice versa, leading to confusion in arguments. They're asking if there's an established term for this and, if not, how to define it clearly.

  First, I need to recall if there's an existing term in philosophy of science or linguistics for this. Equivocation comes to mind, but the user explicitly says it's not that because the different uses aren't in the same argument. Motte-and-bailey is another possibility, but the user also rules that out since there's no intentional switching. So those terms don't fit.

  The key points are: shared lexical item and syntactic frame, different scopes (technical vs. extended), bidirectional credibility transfer, and audience-driven slippage. This seems like a case of polysemy—where a word has multiple related meanings. But polysemy alone doesn't capture the credibility leakage. 

  The concept of "semantic bleaching" might be relevant, where a technical term loses precision when generalized. However, that usually describes a one-way process, not bidirectional credibility flow. Another idea: in rhetoric, "associative transfer" or "connotation creep" could describe the borrowing of credibility, but I'm not sure if there's a specific term for this exact mechanism.

  I remember that in cognitive linguistics, "frame extension" or "conceptual blending" might apply. The shared verb creates a mental link between the two contexts, allowing inferences to cross over unintentionally. The audience doesn't distinguish the scopes, leading to misplaced credibility. 

  The user's entropy example is a good parallel. In thermodynamics, entropy is rigorously defined, but in social contexts, it's metaphorical. Critiques of the metaphor don't affect the technical term, yet people conflate them. This pattern suggests a need for a new term or a precise subcategory.

  Proposing "concept conflation" or "scope slippage" as new terms. But "connotation conduction" seems more fitting—drawing from thermal conductivity, where credibility transfers like heat through a shared term. This emphasizes the passive, bidirectional flow without intentional equivocation. 

  Boundaries are important. This isn't dead metaphor because both uses are active. It's not catachresis since the extended use isn't due to a lack of words. And it's distinct from analogy because the transfer happens implicitly through language structure, not explicit comparison. 

  The user's deeper need might be to clarify arguments in their field, preventing miscommunication. They might also want to legitimize their observation with a formal term, aiding academic discourse. Providing a clear definition and boundaries helps them identify and address the phenomenon systematically.
answer: |-
  Based on your detailed description, this phenomenon **does not have a single, universally established term** in philosophy of science, linguistics, or critical thinking that perfectly captures the *bidirectional credibility leakage* across a shared lexical/syntactic bridge between distinct technical and extended uses. However, it sits at the intersection of several recognized concepts, and a precise neologism can be crafted.

  **Existing Concepts & Why They Don't Fully Fit:**

  1.  **Polysemy:** The core issue is polysemy – one word ("codes for," "entropy") having multiple related but distinct meanings. This is necessary but insufficient. Polysemy alone doesn't specify the *credibility transfer mechanism* or the *structural similarity enabling it*.
  2.  **Ambiguity/Equivocation:** You correctly rule this out. Equivocation involves *intentionally or unintentionally* switching meanings *within a single argument* to create a fallacy. Your phenomenon involves *different arguments using different senses*, with the slippage happening *laterally* in interpretation and citation, not vertically within an inference chain.
  3.  **Motte-and-Bailey Doctrine:** Also correctly ruled out. This involves a deliberate, strategic retreat from an indefensible claim (bailey) to a defensible one (motte). Your phenomenon lacks the *intentional strategic retreat* and the *deliberate switching* by the *same speaker/arguer*. The leakage is audience-driven and passive.
  4.  **Semantic Drift/Bleaching:** This describes how a word's meaning broadens or weakens over time (e.g., "awful" meaning "awe-inspiring" to "very bad"). While related to the extension, it doesn't capture the *ongoing coexistence* of the precise and extended meanings, nor the *bidirectional credibility transfer* between them.
  5.  **Dead Metaphor:** This is when a metaphorical origin is forgotten ("leg of a table"). "Codes for" in the trait sense is arguably a *live* metaphor for many, actively drawing on the computational/cipher analogy. The technical sense is literal. The metaphor's vitality *enables* the credibility transfer.
  6.  **Category Mistake:** Attributing properties of one category to another (e.g., "the number 7 is green"). While applying "code" properties (like having a reader/interpreter) to the trait level might *involve* category errors, the phenomenon you describe is about the *linguistic mechanism enabling the confusion*, not the confusion itself.
  7.  **Connotation Creep/Associative Transfer:** Closer. This describes how connotations of one meaning attach to another. It captures the *transfer* aspect but often implies a more passive, unidirectional drift in perception over time, not necessarily the *active, bidirectional borrowing of warrant* during debates facilitated by identical syntax.

  **Proposed Neologism & Definition:**

  **Term: Connotation Conduction** (or **Credential Conduction**)

  **Definition:** The phenomenon whereby two distinct meanings (Meaning A: precise, technical; Meaning B: extended, often metaphorical or analogical) of a polysemous word or phrase, sharing identical surface syntax, facilitate the *passive, bidirectional transfer of epistemic warrant (credibility, authority, perceived validity) between arguments specifically employing one meaning or the other* during discourse. This transfer occurs primarily within the audience and citation practices, independent of the original speaker's intent, due to the perceived lexical and syntactic identity masking the semantic distinction.

  **Carving the Concept - Boundaries & Exclusions:**

  1.  **Core Mechanism:** Shared Lexicon + Shared Syntax + Distinct Semantic Scope (A=Technical, B=Extended) --> Passive Bidirectional Warrant Transfer in Discourse.
  2.  **Essential Features:**
      *   **Identical Surface Form:** The word/phrase/sentence frame *looks and sounds exactly the same* for both meanings. ("X codes for Y").
      *   **Meaning Distinction:** Meaning A is well-defined, operationalized, and robust within its technical domain. Meaning B is broader, looser, often analogical/metaphorical, and potentially more vulnerable to critique.
      *   **Warrant Transfer:** Critique of arguments using Meaning B is misinterpreted as undermining Meaning A (and vice versa: defense of A is taken to support B).
      *   **Passive/Audience-Driven:** The transfer happens *during interpretation and citation*, not through deliberate equivocation by the arguer. No intent to deceive or switch meanings is required.
      *   **Bidirectional:** Leakage flows *both* ways (B's vulnerability taints A; A's solidity bolsters B).
  3.  **Boundary Cases & Exclusions:**
      *   **Excluded: Simple Polysemy without Warrant Transfer:** Using "bank" (river/financial) without any arguments about one affecting the credibility of the other. No shared *relevant* warrant.
      *   **Excluded: Unidirectional Metaphor Decay:** "Quantum leap" meaning a large, discontinuous change in general discourse. The technical physics meaning isn't *bolstered* by this use; its precision is often *eroded* (semantic bleaching). This is drift, not bidirectional conduction.
      *   **Excluded: Intentional Motte-and-Bailey:** A speaker deliberately using Meaning A to defend against criticism aimed at their use of Meaning B.
      *   **Excluded: Genuine Conceptual Link:** If Meaning B is *demonstrably and rigorously derived* from Meaning A in a way that critique of B inherently involves critique of A (or defense of A inherently supports B), it's not conduction – it's a substantive connection. Conduction relies on the *perceived* link being stronger or different than the *actual* conceptual link.
      *   **Boundary Case: "Energy" (Physics vs. Wellness):** Critique of vague "energy healing" concepts (B) might be misapplied by some to dismiss conservation of energy (A), and proponents of B often invoke physics terminology (A) to lend credibility. This *is* Connotation Conduction. However, if someone argues energy healing *violates* the First Law (connecting A & B substantively), that's a different (potentially mistaken) argument.
      *   **Boundary Case: "Instinct" (Ethology vs. Folk Psychology):** A precise ethological definition (A) vs. a loose "he just has an instinct for business" (B). Defense of the scientific concept (A) might be cited by someone promoting a simplistic "instinct" explanation for complex behavior (B). Critique of the loose use (B) might be misread as attacking the biological concept (A). This fits Connotation Conduction.
  4.  **Distinguishing from Near-Misses:**
      *   **vs. Dead Metaphor:** Conduction requires the metaphorical/extended meaning (B) to still be *live enough* for the association with the technical meaning (A) to actively transfer warrant. If "code" for traits were truly dead, its use wouldn't borrow credibility from the codon table.
      *   **vs. Catachresis:** Using a word where no proper word exists (e.g., "leg of a table"). Meaning B is usually a deliberate (even if loose) *extension* of A, not a misuse due to lack of vocabulary.
      *   **vs. Analogy:** Arguments explicitly drawing an *analogy* ("DNA is *like* a code") invite comparison but usually mark the distinction. Conduction relies on the *unmarked* sharing of identical language, blurring the distinction.

  **Why "Connotation Conduction"?**

  *   **Connotation:** Highlights the transfer of associated meanings, perceptions of authority, and epistemic weight beyond strict denotation.
  *   **Conduction:** Borrowed from physics (thermal/electrical conduction). It implies a *passive flow* of a property (heat/electricity/warrant) *through* a medium (a wire/the shared linguistic structure) due to a connection, without active pumping (intentional equivocation). It captures the bidirectionality potential (heat can flow either way depending on the gradient) and the structural dependency.

  **In Summary:** You've identified a specific and pernicious pattern of miscommunication enabled by polysemy combined with identical syntax. It's not quite equivocation, motte-and-bailey, nor simple semantic drift. **Connotation Conduction** names the mechanism: the passive, audience-driven, bidirectional leakage of epistemic warrant between a technical meaning and an extended meaning of the same word/phrase, facilitated by their shared linguistic form, leading to arguments about one being misapplied to the other. It carves out a distinct space focused on the *warrant transfer mechanism* enabled by the *linguistic identity*.
