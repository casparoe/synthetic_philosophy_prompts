  ### In-Class Simulation: Levels of Selection in Evolution

  #### **Core Concept & Learning Goal**  
  Students will experience the tension between within-group and between-group selection through a hands-on simulation. The key is to create a visceral understanding of how **hard selection** (group fitness proportional to absolute productivity) favors cooperation, while **soft selection** (fixed group contribution regardless of productivity) undermines it. The flip between these regimes is the "aha" moment. No terminology ("group selection," "hard/soft") is used until the debrief.

  ---

  ### **Simulation Design**
  **Roles & Structure**  
  - 18 students → **6 groups of 3 students each**.  
  - Each student is an **individual** with a strategy:  
    - **Cooperate (C)**: Pays a cost to benefit the group.  
    - **Defect (D)**: Free-rides on cooperators.  
  - **No migration or defection between groups** to isolate within-group dynamics.  

  **Payoff Scheme**  
  - **Tokens = Fitness units** (use poker chips).  
  - **Payoff per student** (based on group composition):  
    | **# Cooperators in Group** | **Defector's Tokens** | **Cooperators's Tokens** |  
    |----------------------------|------------------------|---------------------------|  
    | 0                          | 1                      | —                         |  
    | 1                          | 3                      | 1                         |  
    | 2                          | 5                      | 2                         |  
    | 3                          | —                      | 4                         |  
  - **Rules**:  
    - Tokens are calculated *only* from group composition (e.g., 2 cooperators + 1 defector: defector gets 5, cooperators get 2 each).  
    - **No algebra**: Provide a printed payoff table (above) and circulate to help.  

  ---

  ### **How the Flip Works: Arithmetic & Dynamics**  
  **Key Numbers**:  
  - **Within-group advantage**: Defectors *always* outearn cooperators in mixed groups (e.g., 2C+1D: D gets 5, C gets 2).  
  - **Between-group advantage**: Groups with more cooperators generate higher total tokens (e.g., 3C = 12 tokens; 3D = 3 tokens).  

  **Rounds 1 & 2 (Hard Selection)**:  
  - **Group fitness** = Total tokens → determines # of offspring groups.  
  - **Next-gen formation**:  
    1. **Group lottery**: Groups draw "offspring slots" proportional to tokens (e.g., 12-token group gets 4x more tickets than 3-token group).  
    2. **Within-group selection**: Each offspring group forms by weighted random draw (proportional to tokens) from parent group.  
  - **Outcome**: Cooperation ↑. High-cooperation groups "split" (produce more groups); defectors lose ground between groups.  

  **Round 3 (Soft Selection)**:  
  - **Disguised switch**: Announce, *"New rule: Ecosystem carrying capacity reached. Each group gets exactly 1 offspring group, regardless of tokens. Within-group selection still applies."*  
  - **Same payoffs**, but group fitness decoupled from productivity. Only within-group selection matters.  
  - **Outcome**: Cooperation ↓. Defectors dominate within mixed groups; cooperators decline.  

  **Arithmetic Proof of Flip**  
  | **Scenario**       | **Hard Selection (R1/R2)**                                                                 | **Soft Selection (R3)**                                                                 |  
  |---------------------|--------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------|  
  | **Group A (3C)**    | Total tokens = 12 → High chance of multiple offspring groups.                              | Fixed: 1 offspring group. Within-group: All C (no change).                              |  
  | **Group B (2C+1D)** | Total tokens = 9 → Moderate chance of offspring. Within-group: D likely overrepresented.   | Fixed: 1 offspring group. Within-group: D (5 tokens) favored over C (2 tokens).        |  
  | **Group C (1C+2D)** | Total tokens = 5 → Low chance of offspring. Within-group: D favored.                       | Fixed: 1 offspring group. Within-group: D (3 tokens) favored over C (1 token).         |  
  - **Net effect**:  
    - **Hard**: Group A dominates → cooperation spreads.  
    - **Soft**: Group B/C "win" by within-group defection → cooperation collapses.  

  **Robustness to Chaos**  
  - If students "screw around" (e.g., refuse to defect):  
    - **Hard selection**: Unrealistic altruism → faster cooperation spread (still proves point).  
    - **Soft selection**: Slower decline but still occurs (within-group math unchanged).  
  - If groups miscalculate tokens: **Circulate with a payoff cheat sheet** to correct errors.  

  ---

  ### **Timeline (75 Minutes)**  
  1. **0–10 min**: Setup  
     - Assign roles (pre-set initial: 2 groups of 3C, 2 of 2C+1D, 2 of 1C+2D).  
     - Distribute tokens, explain payoffs (emphasize: "Tokens = reproductive success").  

  2. **10–25 min**: Round 1 (Hard Selection)  
     - Groups calculate tokens (5 min).  
     - Instructor collects group totals → runs group lottery (5 min).  
     - Form new groups via within-group draws (5 min).  

  3. **25–40 min**: Round 2 (Hard Selection)  
     - Repeat Round 1 (cooperation should visibly ↑).  

  4. **40–50 min**: Round 3 (Soft Selection)  
     - **Disguised switch**: Announce "carrying capacity rule" *without* theory jargon.  
     - Same play → within-group draws only.  

  5. **50–55 min**: Tally & Observe  
     - Publicly track cooperator frequency: R1 → R2 → R3 (e.g., whiteboard: 33% → 50% → 30%).  

  6. **55–75 min**: Debrief (concepts and contestations).  

  ---

  ### **Debrief: Mapping Activity to Concepts**  
  **1. The Flip:**  
  - *"In Rounds 1–2, cooperation grew. In Round 3, with the same payoffs, it collapsed. Why?"*  
    → **Hard vs. soft selection**:  
    - Hard: Group productivity → more offspring groups (between-group selection).  
    - Soft: Fixed group output → only within-group competition matters.  

  **2. Variance Decomposition:**  
  - **Within-group**: Defectors outcompete cooperators (negative effect on cooperation).  
  - **Between-group**: Cooperative groups outproduce selfish ones (positive effect).  
  - **Net outcome** depends on which force dominates → determined by population structure (hard/soft).  

  **3. Levels of Selection: Redescription or Rival?**  
  - **Consensus (bookkeeping)**:  
    - Multi-level math (Price equation) is uncontroversial.  
    - Group selection = partitioning selection into within/between components.  
  - **Contested (interpretation)**:  
    - **Redescription view** (Dawkins): "Group selection" is just gene-level selection in structured populations.  
    - **Rival view** (Sober & Wilson): Group traits (e.g., cooperation) are causal forces irreducible to genes.  
    - **Human-cultural case**: Possibly unique (e.g., cultural group selection), but debated.  

  **4. Why Soft Selection Gutted Cooperation:**  
  - *"Individual payoffs didn’t change, but the meaning of tokens did."*  
    - Hard: Tokens → between-group advantage (cooperation rewarded).  
    - Soft: Tokens → only within-group advantage (defection rewarded).  
  - **Key insight**: Fitness depends on *population context*, not just individual traits.  

  **5. Settled vs. Contested:**  
  | **Settled**                          | **Contested**                                                                 |  
  |--------------------------------------|-------------------------------------------------------------------------------|  
  | Math of multi-level selection         | Is group selection a *distinct causal level* or just gene-level selection?    |  
  | Hard/soft selection dynamics         | Does group selection explain major transitions (e.g., multicellularity)?      |  
  | Soft selection erodes altruism       | Is human cooperation driven by cultural group selection?                      |  
  - **Your role**: Explicitly say, *"Here’s where experts disagree…"*  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem**: Token calculation slows things down.  
     **Fix**: Provide a payoff table + circulate to assist. Use poker chips for visual math.  

  2. **Problem**: Students resist defecting ("I don’t want to be selfish!").  
     **Fix**: Emphasize, *"You’re role-playing a strategy—this is biology, not ethics!"*  

  3. **Problem**: Round 3 switch feels "unfair."  
     **Fix**: In debrief, clarify: *"The rule change mirrors real ecological shifts (e.g., scarce resources)."*  

  4. **Problem**: Sampling error skews outcomes.  
     **Fix**: Use a random number generator for draws (app or dice) → transparency.  

  ---

  ### **What the Activity *Cannot* Simulate**  
  1. **No Choice in Nature**:  
     - Organisms don’t "choose" strategies—traits are inherited. Students’ agency is a **pedagogical crutch**, not realism. Verbally stress: *"In real evolution, strategies spread via reproduction, not decision-making."*  

  2. **Mendelian Genetics**:  
     - Activity assumes clonal inheritance. **Explain**: Real traits mix via recombination (complicates group heritability).  

  3. **Migration/Group Dissolution**:  
     - Activity isolates groups. **Note**: Migration can dampen group selection (mention in debrief).  

  4. **Long-Term Dynamics**:  
     - Three rounds show the flip, but **emphasize**: Evolution plays out over generations (cooperation erodes slowly under soft selection).  

  ---

  ### **Instructor Script Snippets**  
  - **Disguising Soft Selection**:  
    *"Great job! We’ve seen productive groups grow. Now, imagine this ecosystem hits carrying capacity—resources are capped. New rule: Every group gets exactly one offspring group next generation, no matter your tokens. But within your group, tokens still determine who reproduces."*  

  - **Debrief Finale**:  
    *"The math of within-group vs. between-group selection is settled. But *why* it matters—is group selection a fundamental force, or just a way to bookkeep gene dynamics? That’s where Dawkins and Sober/Wilson still clash. Your task isn’t to pick a side—it’s to see how evidence shapes the debate."*  

  This simulation forces engagement with the core tension. Students leave knowing **what evidence matters** (population structure) and **why the fight isn’t over**.
