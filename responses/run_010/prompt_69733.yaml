  Therefore, the principle we adopt by sending it back and requiring removal of the note is: **A forecaster must not hold a belief and simultaneously hold that holding that belief is irrational. They may adjust their estimate downward to account for independent reasons for doubt (like base-rate flags) without abandoning the entire analysis, but they must not express an inconsistency in their own state of belief.**

