     Claim 11: The 18 and 21 month projects are vendor-dependent and thus excluded. (sound)
     Claim 12: Regression to the mean says we should not inflate the estimate to hedge against a repeat of the extreme outcomes. (sound: and since they are excluded, it's even more appropriate.)

