  **Marking Scheme (25 marks total)**

  1. **Recognition of cross-cutting dimensions (5 marks)**: Identifies that the platforms cannot be ordered on a single left–right line due to inconsistent alignments (e.g., economic left parties disagree on cultural issues, economic right parties disagree on cultural issues, and the same cultural position can be found on both economic left and right). *Error: Fails to identify specific points of irreconcilable disagreement (e.g., only asserts that it is multi-dimensional without showing why).*

  2. **Handling of specific platforms (4 marks)**: Correctly compares at least three pairs of parties to illustrate the cross-cutting dimensions (e.g., A and E both economically left but different on cultural issues; A and B different on economics but same on cultural issues; C and E same on some cultural issues but different on economics). *Error: Only compares two pairs or fails to use the table to support the argument.*

  3. **Argument about the reality of the left–right distinction (5 marks)**: Argues that the left–right distinction is real (e.g., as an economic axis) but not one-dimensional, and explains what this reality consists in (e.g., it captures a meaningful and non-arbitrary divide on economic issues). *Error: Concludes that the left–right distinction is unreal (arbitrary or merely coalitional) without addressing the economic divide, or asserts without argument that it is real.*

  4. **Confronting the possibility of multi-dimensional redescription (5 marks)**: States that a multi-dimensional model (e.g., two axes) is possible, but notes that this is a redescription and not automatically a discovery. Explains that to show the model is more than a redescription, we would need evidence of stability and salience (e.g., that the dimensions predict voting behaviour, coalition formation, or are consistent across time and issues beyond the table). *Error: Asserts that because a two-axis model fits the data, it is automatically the correct model without addressing what further evidence is required.*

  5. **Addressing the relational and shifting nature (3 marks)**: Explains that the left–right distinction is relational (a platform is left relative to others) and that the drift of content over time (e.g., the same party being left in one era and right in another) does not by itself make the distinction unreal because the relative positions on the economic axis remain meaningful. *Error: Claims that because the content of left and right changes, the distinction is unreal, without addressing the relational aspect.*

  6. **Structure and avoidance of common errors (3 marks)**: Builds an argument rather than providing a taxonomy; avoids the two common errors: (i) does not merely assert that "left and right are dead, we need two axes" but argues for it from the table; (ii) does not claim that Party A and E (or C) are adjacent based on one issue without considering the whole pattern. *Error: Falls into one of the common errors or provides a list of positions without argument.*

  ---

  **A/B Boundary**

  The boundary between an A grade (first-class) and a B grade (competent second-class) answer lies in the handling of part (b). A B answer will correctly identify that the platforms cannot be ordered on a single line and will note that this shows the need for two dimensions. It may also state that the left–right distinction is not dead. However, an A answer goes further by explicitly arguing for the reality of the left–right distinction as an economic axis despite the multi-dimensionality, and by confronting the philosophical implications (e.g., the distinction is real but not one-dimensional, and the relational nature protects it from the charge of obsolescence). Specifically, the A answer must:

  - Explain *why* the left–right distinction is not rendered unreal by the table (by pointing to the economic divide).
  - Address what further evidence would elevate the two-dimensional model from a redescription to a discovery.
  - Explain how the relational nature of the terms defuses the argument from shifting content.

  A B answer may have the right material (e.g., it may list the two dimensions and say the left-right is economic) but fail to integrate these points into a coherent argument about the reality of the distinction.

  ---

  **Verdict: REAL-NOT-1D**
answer: |-
  ### The Question

  **Essay Question (25 marks; 45 minutes)**  
  The table below presents the platforms of five political parties in an invented country across four policy areas. Using *only* the information in this table:  

  (a) Determine whether these five platforms can be coherently ordered on a single left–right line. If they can, provide the ordering (from left to right). If they cannot, explain why not, pinpointing specific irreconcilable disagreements.  

  (b) Discuss what your conclusion in (a) does and does not demonstrate about the reality of the left–right distinction. Specifically, address whether the distinction remains meaningful despite the table’s pattern, and if so, in what sense.  

  Your answer must explicitly engage with the pattern of agreements and disagreements in the table. Do not rely on historical accounts, named theorists, or general claims that left–right labels are obsolete. Instead, construct an argument about what the table reveals regarding the structure of political disagreement and its implications for the left–right distinction.  

  | | (1) Taxation and transfers | (2) Public morality and religion | (3) Immigration | (4) Policing, surveillance, sentencing |
  |---|---|---|---|---|
  | Party A | steeply progressive taxation; generous universal transfers | secular state; expand personal autonomy in family and bodily matters | open immigration | shrink policing, surveillance and sentence length; decriminalise most vice offences |
  | Party B | low flat taxation; transfers limited to a minimal safety net | secular state; no enforcement of any moral code | open immigration, including free movement of labour | minimal coercion beyond the enforcement of contract and property |
  | Party C | progressive taxation and generous transfers, restricted to citizens by descent | established religion taught in state schools; restrictions on abortion and same-sex marriage | small annual quota, with compulsory assimilation | expanded policing, longer sentences, broad preventive surveillance |
  | Party D | low taxation and few transfers, but tariffs and subsidies protecting domestic industry | personally religious and traditionalist; opposes state enforcement of morality | limited to high-skilled and investor categories | tough on property crime and border enforcement; permissive about private conduct |
  | Party E | steeply progressive taxation; generous universal transfers | formally secular, but willing to censor speech judged reactionary and to regulate religious bodies' public activity | restrictive, justified on wage and housing grounds rather than cultural ones | expanded coercion; heavy surveillance of political opponents; long sentences for corruption and sabotage |

  ---

  ### Model Answer (approx. 700 words)  
  **Verdict: The platforms cannot be ordered on a single left–right line, but the left–right distinction remains real as a meaningful (though incomplete) marker of economic conflict.**  

  **(a) Why no single ordering is possible**  
  The five platforms defy a coherent left–right ordering because they exhibit cross-cutting disagreements across two independent dimensions: economic redistribution (issue 1) and state authority (issues 2–4). Any attempt to force them onto one axis fails due to contradictory alignments on these dimensions.  

  First, consider economic policy (issue 1). Parties A and E advocate steep progressive taxation and generous transfers, placing them on the economic left. Parties B and D support low taxes and minimal transfers, marking them as economically right. Party C is ambiguous: progressive transfers for citizens-by-descent suggest left-leaning economics with nationalist exclusion.  

  However, this economic split does not predict positions on cultural/state authority issues. On public morality (issue 2), Party A (expand autonomy) and Party B (no moral enforcement) align as libertarian, while Party C (state-enforced tradition) and Party E (censorship of reactionaries) are authoritarian. Party D opposes state enforcement but is personally traditionalist, creating a hybrid stance. On immigration (issue 3), Parties A and B both support openness, contrasting with the restrictiveness of C, D, and E. On policing (issue 4), Party A seeks to shrink state power, Party E expands it for political control, and Party D mixes property-crime toughness with private-conduct permissiveness.  

  These inconsistencies prevent a linear ordering. For instance:  
  - Party A (left economics) and Party B (right economics) agree on secularism, open immigration, and reduced coercion – yet placing them adjacently on a left–right line ignores their core economic opposition.  
  - Party A and Party E share left economics but clash utterly on state authority: A minimizes it (libertarian), while E maximizes it (authoritarian). Ordering them together (e.g., A left, E centre-left) obscures this chasm.  
  - Party C and E both endorse restrictive immigration and high state coercion, but their economic divergence (C’s nationalism vs. E’s universalism) makes adjacency misleading. Party C aligns more with right-leaning economics when compared to E, but its policing stance is closer to E than to D.  

  Thus, the platforms form a matrix: economic left/right vs. libertarian/authoritarian. A one-dimensional line cannot capture why Party A is closer to Party B on culture but polar opposite on economics, or why Party E is economically aligned with A but culturally aligned with C.  

  **(b) What this means for the reality of the left–right distinction**  
  That these platforms resist a single line does not render the left–right distinction unreal. Instead, it shows the distinction is real but insufficient: it robustly describes economic conflict (taxation/transfers) but falters on cultural/state authority issues.  

  The economic dimension remains meaningfully left–right. Parties A, C, and E all support redistribution (varying in scope), while B and D prioritize market freedom (varying in protectionism). This axis explains clear fault lines: e.g., A vs. B on tax progressivity. It is not arbitrary; it captures a core divide over equality vs. liberty in material distribution. When the table separates economic from cultural issues, left–right consistently predicts the first.  

  However, the distinction is not one-dimensional. State authority introduces a second, independent dimension. Party A (libertarian left) and Party E (authoritarian left) share economics but clash on state power, showing that "left" is not monolithic. Similarly, Party B (libertarian right) and Party D (traditionalist right) diverge on cultural enforcement. This multidimensionality means left–right alone cannot fully order the platforms. Yet this does not reduce the distinction to a contingent coalition or empty label. Parties A, C, and E are "left" in a specific, economic sense – they agree on challenging market outcomes – despite differing on state authority. The distinction persists as a relational anchor: e.g., A is left of B on economics even if culturally similar.  

  Two common misconceptions must be avoided. First, claiming that Party A and E are adjacent due to shared economics or immigration stances ignores their vast gulf on state coercion (issue 4). A’s decriminalization of vice and E’s surveillance of opponents reflect opposing principles: emancipation vs. control. Second, a two-axis model is not automatically superior; it is merely a redescription of the table. To prove its explanatory reality, we would need evidence that these dimensions predict behavior beyond policy – e.g., voter alignment, coalition formation (do libertarian-left A and libertarian-right B ally against authoritarian E?), or historical consistency. The table alone cannot confirm this; it only suggests that one dimension is inadequate.  

  Finally, the relational nature of left–right insulates it from charges of obsolescence. The distinction compares platforms at a given time: e.g., A is left of B on economics here, regardless of whether "left" meant something else in 1950. Policy drift over time does not erase the current reality of the divide; it simply shows the distinction evolves contextually. In this table, left–right is real for economics but not for state authority – a limitation, not a falsification.  

  In sum, the left–right distinction is real as a partial framework: it illuminates economic conflict but cannot alone structure the full spectrum of disagreement. Its reality lies in its ability to explain a fundamental, enduring axis of politics, even as other dimensions coexist.  

  ---

  ### Marking Scheme (25 marks total)  
  1. **Diagnosis of ordering failure (5 marks)**: Identifies that no single left–right line works due to *cross-cutting dimensions* (e.g., economics vs. state authority), citing specific irreconcilable disagreements (e.g., A and E share economics but oppose on policing).  
     *Error: Only asserts multi-dimensionality without showing contradictions from the table.*  

  2. **Argumentative move: Handling adjacency claims (4 marks)**: Refutes oversimplified adjacencies (e.g., "A and E are similar on economics/immigration") by *comparing whole platforms*, showing how key disagreements (e.g., state coercion in issue 4) undermine proximity.  
     *Error: Asserts A/E or A/C adjacency without addressing conflicting issues like policing.*  

  3. **Argumentative move: Reality of the distinction (5 marks)**: Defends the left–right distinction as *real for economics* (e.g., A/C/E vs. B/D on issue 1), explaining its non-arbitrary content (e.g., redistribution vs. market freedom).  
     *Error: Declares the distinction "dead" or "arbitrary" without engaging economic agreements.*  

  4. **Argumentative move: Multi-dimensional redescription (5 marks)**: States that a 2D model fits but *requires further evidence* (e.g., stability in voter behavior or coalitions) to be more than redescription; uses the table to show why 1D fails.  
     *Error: Asserts "we need two axes" as a conclusion without justifying evidentiary thresholds.*  

  5. **Relational/situational nature (3 marks)**: Explains how left–right is *relational* (e.g., A is left of B on economics) and why *policy drift* over time doesn’t invalidate it (e.g., the distinction compares concurrent platforms).  
     *Error: Claims changing content alone makes the distinction unreal.*  

  6. **Structure and avoidance of tropes (3 marks)**: Builds an *integrated argument* (not a list); avoids tropes like "left–right is obsolete" or "Party E is adjacent to C/A" by using the table holistically.  
     *Error: Repeats tropes without evidence-based refutation.*  

  ---

  ### A/B Boundary  
  The A/B boundary hinges on **argumentative depth in part (b)**. A B-grade answer correctly diagnoses the failure of a single ordering (part a) and identifies that left–right is real for economics but not state authority. However, it may treat these as separate observations without synthesizing them into a coherent thesis about the distinction’s reality. An A-grade answer does this synthesis: it argues that the distinction’s *reality is partial* (economic only) and defends this against challenges (e.g., by explaining why multi-dimensionality doesn’t imply arbitrariness, or why relationality defuses historical drift). Crucially, it uses the table to show *how* the economic axis remains meaningful despite cross-cutting disagreements, and explicitly confronts what would elevate a 2D model from redescription to discovery.  

  **Verdict: REAL-NOT-1D**
