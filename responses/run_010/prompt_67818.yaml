  **Essay Question (45 minutes, 25 marks)**

  The table below shows the platforms of five political parties in an invented country on four policy areas. Using *only* the information in the table, and without appealing to historical origins or general theories of political ideology:

  (a) Decide whether these five platforms can be placed on a single left–right line. If they can, state the ordering (from left to right). If they cannot, explain why not, identifying the specific points of irreconcilable disagreement.

  (b) Explain what your verdict in (a) does and does not establish about the reality of the left–right distinction. In particular, address whether the distinction is real despite the pattern in the table, and if so, in what sense.

