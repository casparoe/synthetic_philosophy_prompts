answer: |-
  **1. (Kripkean Sceptic)**  
  *Objection:* "You've smuggled descriptive content back into reference-fixing via the 'center'. If the center determines extension across worlds in primary mode—e.g., evaluating 'water is H₂O' at a world where XYZ is in the lakes—you're just resurrecting the descriptive 'reference-fixer' I buried. Natural-kind terms rigidly designate; their epistemic profile is irrelevant. Why isn't your 'mode' just a covert return to Fregeanism?"  
  *Reply:* "The center *only* provides egocentric coordinates (who/where/when 'now' is), *not* criteria for kind-membership. At a centered world <w, c>, 'water' still rigidly picks out H₂O in w. Primary mode varies w *and* c, but the intension’s output depends solely on w’s physical facts—c just tells us *which* individual’s linguistic community fixes the reference. Rigidity is preserved; this isn’t descriptivism."  
  *Soft spot:* Explaining how reference-fixing *without* descriptive content interacts with primary mode—I need a positive account of how centers anchor rigidity, deferred to my reference chapter.  

  **2. (Zombie-Defending Two-Dimensionalist)**  
  *Objection:* "If primary intensions aren’t components of content—just evaluation modes—how can conceivability arguments (like zombies) imply possibility? Conceivability requires accessing a *way the world could be*, but on your view, it’s merely shifting coordinates arbitrarily. Doesn’t reducing the primary intension to a mode drain conceivability of its metaphysical force?"  
  *Reply:* "Conceivability remains intact: evaluating the intension in primary mode (centers traveling) *is* considering epistemic possibilities—worlds centered on subjects with our concepts. Zombies are conceivable because the intension returns 'true' at some <w, c> where c is a zombie. But *metaphysical* possibility requires secondary mode (centers fixed): there, no world’s physics permits zombies. You get the epistemic pull without ontological inflation."  
  *Soft spot:* Justifying why conceivability (primary mode) should guide modal epistemology if it’s not a distinct content—I owe a theory of rational idealization, pending in Ch. 4.  

  **3. (Formal Semanticist / "Actually" Expert)**  
  *Objection:* "Centered worlds are redundant. Double-indexing with 'actually' handles your cases cleaner: a sentence’s intension is a function from <world, time> pairs, and 'actually' shifts the world of evaluation. Your 'modes' are just special cases of holding one index fixed. Why add centers when you gain no expressive power and lose formal elegance?"  
  *Reply:* "Centers handle essential indexicals (like 'I' or 'now') that 'actually' can’t. In primary mode, shifting centers models *de se* uncertainty: e.g., not knowing if *I’m* the zombie. 'Actually' fixes a world, but centers fix *perspectival location* within it—crucial for epistemic puzzles. Your framework can’t express 'Am I Napoleon?' without smuggling in centers."  
  *Soft spot:* Proving centered worlds are *necessary* for phenomena beyond *de se*—e.g., whether "actually"-operators plus worlds/times suffice for phenomenal intensions (my Ch. 6 must deliver).  

  **4. (Indexical-Focused Two-Dimensionalist)**  
  *Objection:* "If primary intensions aren’t modes of presentation, what explains cognitive significance? E.g., 'I am here' is trivial in secondary mode but informative in primary mode. But if there’s only one intension, why isn’t it just obviously true? Your 'modes' feel ad hoc—you’ve gutted the primary intension’s explanatory role."  
  *Reply:* "Cognitive significance arises from *how* we evaluate the intension, not plural content. In primary mode, evaluating 'I am here' at <w, c> requires knowing which c is 'me'—so it’s informative if I’m disoriented. The *same* intension is trivial in secondary mode because c is fixed. Modes reflect epistemic access, not semantic ambiguity."  
  *Soft spot:* Accounting for *all* traditional roles of primary intensions (e.g., a priori entailment) solely via modes—I need to show this in my account of scrutability (Ch. 3 draft).  

  **5. (THE QUESTION YOU HOPE NOBODY ASKS — Kripkean or Formal Semanticist)**  
  *Objection:* "Your 'collapse' for phenomenal concepts implies that 'I am in pain' is metaphysically necessary if true—since both modes coincide. But that’s absurd: I could have been asleep now. Worse, if *all* concepts obeyed your 'center only provides location' principle, 'Hesperus is Phosphorus' would be contingent in primary mode. Haven’t you made necessary a posteriori truths *epistemically contingent*?"  
  *Reply (if asked):* "Phenomenal concepts collapse because pain’s extension supervenes on the center’s state—'pain' refers to *this experience*, whatever its physical basis. For 'Hesperus', primary mode varies astronomical facts *and* my location, so it *is* epistemically contingent (I could be on a planet where 'Hesperus' picks Venus but 'Phosphorus' Mars). But secondary mode fixes my location, revealing the necessity. This preserves Kripke’s insights while explaining the illusion of contingency."  
  *Soft spot:* This risks conflating epistemic and metaphysical contingency—I must rigorously defend that primary mode *only* tracks epistemic constraints (or concede revisionism).  

  ---  
  **Key Tactics**:  
  - When accused of redundancy (e.g., by Formal Semanticist), concede: "Stalnaker’s double indexing *inspired* this, but centers are indispensable for *de se* content—here’s why..." (least defensive).  
  - For "hoped unanswered" #5, pivot quickly to your collapse argument: "This *exactly* shows why phenomenal concepts are special—let me illustrate..." to steer back to your thesis.  
  - Prioritize replying to #5 (if asked), #1, and #2—they most directly threaten your metaphysical claims and conceivability defense. Grad students will likely follow faculty leads.
