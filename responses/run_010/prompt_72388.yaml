prompt: |-
  Been going down a rabbit hole on Dutch books and I can't tell what norm I actually endorse, because my gut gives different answers in different cases. Here they are:

  1. A bookie puts three bets on the table at once, each one looks fine to me separately, and together they cost me $200 no matter how things turn out. Obviously refuse, and I think my odds were genuinely incoherent.

  2. The same three bets offered one at a time over three days, and I'd take each one as it comes up. Somehow this feels much less bad, even though I lose the same $200 with certainty. Though if I were asked today to sign a contract binding me to all three, I'd refuse to sign — which makes me wonder whose odds are the problem.

  3. A bet, settled tomorrow, that pays $1000 if I believe then that it rained today. Offered at 5:1 against. I refuse, and I think it's cheating: the bookie isn't betting on the weather, he's betting on my future opinions.

  4. Same setup but it pays on whether I'll have eaten lunch by 2pm, and I know perfectly well I skip lunch when I'm busy. Here I'd take the bet and I don't think there's anything cheating about it.

  5. Even-odds coin flip for $10, offered every morning forever. Take it every time, no question.

  6. Same coin flip, but $100,000 against my entire savings. Refuse, and I don't think that makes me incoherent, my utility for money just isn't linear.

  7. Someone offers me 1000:1 against a hairy arithmetic statement I can't check by hand. I refuse, but I don't feel incoherent, just finite.

  Is there a single principle — something in the neighborhood of "your betting dispositions must not guarantee you a loss" — that delivers all seven? I'm pretty sure 3 vs 4 is the bad pair, and maybe 1 vs 2 too, and that whatever clause rescues 3 seems to rescue a lot more than I want it to. So: state the principle clause by clause, saying which case forces each clause; tell me what it says about a case I didn't list, like a bet that pays on what I'll believe after someone has paid me to change my belief; and be straight with me about which of my verdicts it simply can't keep.
reasoning: |-
  Okay, the user is diving deep into Dutch book arguments and probability coherence. They've presented seven different betting scenarios where their intuitive responses seem inconsistent, and they're looking for a unifying principle that can explain all their judgments without contradiction. 

  First, I need to recognize this is a sophisticated user—they're already familiar with Dutch books, subjective probability, and expected utility theory. Their frustration is palpable: they've hit a wall trying to reconcile gut feelings with formal coherence. The core tension is between "avoiding guaranteed loss" and other values like temporal consistency, belief integrity, and bounded rationality. 

  Let me unpack their cases one by one. Scenario 1 is textbook incoherence—simultaneous bets that guarantee loss. Scenario 2 is trickier: same bets offered sequentially. The user feels less bad about taking them separately, but recognizes they'd refuse a binding contract upfront. That's a red flag—it suggests their probability assessments aren't stable over time. 

  Scenarios 3 and 4 are the real puzzle. Both involve bets on future first-person states (belief/lunch), but the user rejects one as "cheating" while accepting the other. The distinction seems to be about control: they view beliefs as truth-tracking (so the bookie exploits the measurement), while lunch habits are behavioral (so it's just predicting actions). 

  The high-stakes coin flip (scenario 6) and unprovable math statement (7) reveal boundary conditions: expected utility requires non-linear valuation of money and finite computational capacity. The user already knows this, but wants to know how far to stretch "coherence." 

  For a unifying principle, "avoiding all-forseeable-loss" might work, but it needs caveats: 
  - Losses must be logically guaranteed, not just probable 
  - Foreseeability includes foreseeable belief changes (killing scenario 3) 
  - Utility must be bounded to handle infinite cases 
  - Epistemic limitations excuse scenario 7 

  The user's hidden concern might be about self-knowledge: in scenario 5 (infinite small bets) they're comfortable, but scenario 3 (belief bet) feels violating. That suggests they see beliefs as sacred—not legitimate betting subjects. I should acknowledge that tension rather than paper over it. 

  They also hint at a case not listed: belief manipulation via payment. The principle would condemn that too—if you can foresee being bribed to change beliefs, taking the bet is foreseeably lossy. But the user might dislike that verdict, seeing it as overreach. 

  Ultimately, their intuitions are mostly defensible except scenario 2: taking sequential loss-guaranteeing bets is still incoherent if the loss was foreseeable upfront. I'll need to gently say that—while validating why it feels different psychologically. The temporal gap creates an illusion of separation, but the mathematical guarantee remains.
answer: |-
  You've hit the nail on the head – the core Dutch Book principle ("avoid dispositions guaranteeing loss") **needs refinement** to handle your nuanced intuitions, which are mostly sound. Here's a unified principle built clause-by-clause, addressing your cases:

  **The Principle of Foreseeable-Avoidable Guaranteed Loss (FAGL Principle):**

  > Your dispositions to accept bets are incoherent if they **foreseeably** and **avoidably** commit you to a **logically guaranteed net loss**, where:
  >
  > 1.  **"Logically Guaranteed Net Loss"**: A combination of bets exists where, *no matter how the world turns out*, you lose money overall (addressing Cases 1 & 2).
  > 2.  **"Foreseeably"**: The guarantee of loss must be recognisable *at the time you form the disposition* using the knowledge and logical capabilities you possess then. This includes foreseeing how your *own future beliefs or actions* might be manipulated or constrained by the bets themselves (addressing Case 3 vs. 4, and explaining 7).
  > 3.  **"Avoidably"**: You must have had a reasonable opportunity *at the time of forming the disposition* to avoid committing to the loss-guaranteeing combination. This often means refusing the combination *as a whole* when offered simultaneously (Case 1), but also rejecting contracts binding you to future incoherent bets (Case 2), or refusing bets designed to manipulate the very states they depend on (Case 3).
  > 4.  **Utility & Bounded Rationality Clause**: The principle applies to *probability* coherence. It assumes linear utility for the stakes involved (or can be generalized using expected utility). If utility is demonstrably non-linear (Case 6) or the computational/logical resources required to recognize the guarantee exceed your bounded capabilities (Case 7), rejecting a bet does *not* indicate probabilistic incoherence.

  **Applying FAGL Clause-by-Clause to Your Cases:**

  1.  **Three Simultaneous Bets:** *Violates FAGL.* The loss is **logically guaranteed** ($200 loss). It is **foreseeable** when offered (you see all bets). It is **avoidable** (refuse the package). *Verdict: Incoherent. Your refusal is correct.*
  2.  **Three Sequential Bets:** *Violates FAGL.* The loss is **logically guaranteed** if you take all three ($200 loss). Crucially, the guarantee is **foreseeable** *today* if you consider the *disposition you know you have* to accept each bet individually in isolation. It is **avoidable** *today* by either a) changing your disposition to reject one of the bets when offered later, or b) refusing a contract binding you to accept all future bets. Your refusal to sign the binding contract shows you recognize this avoidability. Taking them sequentially feels "less bad" *psychologically* (you only see one bet at a time), but *logically*, foreseeing your own future dispositions makes the guarantee foreseeable and avoidable *now*. *Verdict: Incoherent. Your sequential acceptance is a mistake, but your refusal of the binding contract aligns with coherence.*
  3.  **Bet on Future Belief (Rain):** *Violates FAGL.* The loss is **logically guaranteed** *if* the bookie can manipulate your belief (e.g., by paying you). Crucially, this manipulation (or the *potential* for it) is **foreseeable** when offered. You know the bet *itself* creates an incentive to distort your belief tomorrow. It is **avoidable** (refuse the bet). *Verdict: Incoherent/"Cheating". Your refusal is correct. The bookie isn't betting on rain; they're betting on/manipulating your belief state.*
  4.  **Bet on Future Action (Lunch):** *Does NOT Violate FAGL.* The loss is **not logically guaranteed**. You might get busy and skip lunch, or you might not. While you *predict* skipping, it's not certain. Crucially, the bet **does not foreseeably manipulate the outcome**. Taking the bet doesn't *force* you to skip lunch; it just pays if you do. Your decision is based on your prediction of your *unmanipulated* behavior. *Verdict: Coherent. Your acceptance is fine.*
  5.  **Infinite Small Fair Bets:** *Does NOT Violate FAGL.* While accepting *all* bets guarantees *variance* and a near-certain *net loss relative to initial wealth* in the long run (by Law of Large Numbers), there is **no logically guaranteed net loss for any finite sequence**. Each bet has an expected value of zero. FAGL requires logical certainty, not near-certainty. *Verdict: Coherent. Your acceptance is fine.*
  6.  **High-Stakes Fair Bet:** *Does NOT Violate FAGL (Probability Coherence).* The guaranteed loss clause isn't triggered (it's a single bet, loss isn't guaranteed, only 50% likely). Rejection is due to **non-linear utility** (Utility Clause). Losing your savings harms you more than gaining $100K benefits you. *Verdict: Coherent (Probabilistically). Your refusal is rational, not incoherent.*
  7.  **Bet on Unprovable Statement:** *Does NOT Violate FAGL.* The loss is **not logically guaranteed** (the statement might be true!). Crucially, recognizing a guarantee would require proving/disproving the statement, which **exceeds your foreseeable logical capabilities** (Bounded Rationality Clause). You only **predict** you'll likely lose based on evidence, but lack certainty. *Verdict: Coherent. Your refusal is rational finitude, not incoherence.*

  **Your Unlisted Case: Belief Manipulation via Payment**

  *   **Bet:** Pays $1000 if *after someone pays me $10 to change my belief*, I believe proposition P.
  *   **FAGL Analysis:** This *violates FAGL* for the bettor accepting it. Why?
      1.  **Guaranteed Loss?** Potentially. If changing your belief for $10 is foreseeable (especially if you're offered this bet!), then the bookie can pay you $10, you (foreseeably) change your belief as "contracted", and they pay out $1000. They are out $10 but gain $1000, net +$990. *You* gained $10 from them but paid $1000 to them, net -$990. Guaranteed loss for you.
      2.  **Foreseeable?** Yes. The structure makes the manipulation path clear.
      3.  **Avoidable?** Yes. Refuse the bet.
  *   **Verdict:** Taking this bet would be incoherent under FAGL. Refusing it is coherent.

  **Which of Your Verdicts Can't Be Kept?**

  The FAGL principle, as stated, **cannot keep your feeling that taking the sequential bets (Case 2) individually is "much less bad" from a coherence perspective.** As argued above, foreseeing your own disposition to accept each individual bet in the loss-guaranteeing sequence *does* make the guarantee foreseeable and avoidable at the outset, rendering the disposition incoherent.

  *   **Why it feels different:** Psychologically, sequential offers leverage **temporal discounting** and **narrow framing**. You evaluate each bet in isolation *at the moment it's offered*, ignoring the pre-existing commitment path. The binding contract offer forces you to consider the whole sequence simultaneously, making the incoherence salient. FAGL demands the broader, logical view.

  **In Summary:**

  FAGL refines the Dutch Book idea by:
  1.  Focusing on **foreseeable** guarantees (handling belief manipulation, bounded rationality).
  2.  Demanding the loss be **avoidable** at the time of disposition formation (handling sequential incoherence via binding contracts or foreseeable future actions).
  3.  Explicitly separating **probability coherence** from **rational choice under non-linear utility** and **bounded computational/logical resources**.

  It endorses your verdicts in Cases 1, 3, 4, 5, 6, 7 and your refusal of the binding contract in Case 2. It argues that your willingness to take the sequential bets *individually* in Case 2 *is* a form of incoherence, even if a psychologically understandable one. The core insight is that coherence requires your betting dispositions, *considered as a whole with your knowledge of your own tendencies*, to avoid foreseeable, avoidable traps.
