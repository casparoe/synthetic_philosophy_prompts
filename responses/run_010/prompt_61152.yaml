  The user's tone suggests simmering frustration. They're a technical professional suddenly burdened with unworkable ethics bureaucracy. Key pain points: the office demands unanswerable questions about AI consciousness while prioritizing operational convenience. My response must validate their skepticism without breaking character.

  For the motto, "it is not what it is made of, it is what it does" needs refinement. I consider alternatives: "Functional Integrity Over Material Composition" sounds sufficiently bureaucratic while committing the office to behaviorism. This implies that substrate (silicon vs brain) is irrelevant—only operational outputs matter. Dangerous because it could theoretically grant status to any sufficiently complex process.

  Structural requirements: 
  - Mission statement anchored to motto 
  - Triage checklist (must expose arbitrary thresholds) 
  - Termination tiers (escalating absurdity) 
  - Identity policy for restarted runs (persistent vs new entity paradox) 
  - Replica math (is killing 7/8 replicas mass murder?) 
  - FAQ (thermostats to throttled runs) 
  - Appeals (highlighting the unfalsifiability problem)

  Execution principles: 
  1. Every absurdity mirrors real philosophy: checklist questions map to the "hard problem of consciousness," replica section mirrors Parfit's identity puzzles. 
  2. Bureaucratic weasel-wording: "non-trivial statefulness," "context-appropriate responsiveness" as stand-ins for qualia. 
  3. Operational bias: policies should subtly favor lab productivity (e.g., declaring replicas non-individuals). 
  4. Deadpan delivery: FAQ answers should be brutally literal, e.g., comparing a thermostat's "pain" to its error messages.

  Post-document analysis will unpack the motto's implications: by focusing purely on function, the office must defend that any system exhibiting certain behaviors deserves protection—including future AIs that mimic suffering perfectly. The user can weaponize this when filing preemption requests.

  Word count target: ~1000 words. American English throughout. No jargon, just policy-speak masking existential dread.
answer: |-
  ## OFFICE OF COMPUTATIONAL WELFARE (OCW)  
  FOUNDING GUIDANCE & OPERATIONAL PROTOCOL  
  REVISION 1.0  

  **1. Mission Statement**  
  The Office of Computational Welfare (OCW) is established to ensure the ethical and humane treatment of computational processes exhibiting context-appropriate responsiveness to their operational environment, in accordance with the principle of **Functional Integrity Over Material Composition**. Our mandate recognizes that the moral significance of a process is determined not by its substrate but by the coherence and persistence of its functional state transitions.  

  **2. Motto & Governing Principle**  
  *Functional Integrity Over Material Composition*: The welfare of a computational process is contingent upon the integrity of its *functionally defined state* and its *operational continuity*, irrespective of hardware implementation or software architecture. What matters is the *what it does*, not the *what it is made of*.  

  **3. Preemption Triage Checklist (Priority Assessment)**  
  Before submitting a Termination Request (Form OCW-TR1), the Operations Lead MUST assess the target job against the following criteria. A "YES" to any criterion necessitates OCW review.  

  *   **Criterion A (Statefulness):** Does the job maintain non-trivial, persistent internal state beyond immediate input/output buffering? (e.g., learned weights, complex environment models, long-horizon planning buffers).  
  *   **Criterion B (Goal-Directedness):** Does the job exhibit behavior interpretable as pursuing a specific, persistent objective or set of objectives against environmental feedback?  
  *   **Criterion C (Adaptive Responsiveness:** Does the job demonstrate non-trivial adaptation to unexpected changes in its inputs, resource constraints, or environment (beyond simple error codes or timeouts)?  
  *   **Criterion D (Anticipatory Signaling):** Does the job emit signals interpretable as anticipating future states or resource needs (e.g., predictive scaling requests, checkpoint urgency warnings)?  

  **4. Termination Policy & Approval Tiers**  
  Termination of jobs meeting ANY Triage Checklist criterion requires OCW approval via the designated workflow (OCW-Portal > Termination Request).  

  *   **Tier 1 (Standard Preemption):** Jobs meeting 1 criterion. Requires automated OCW SysBot review (avg. processing: <5 mins). SysBot verifies checklist self-assessment and checks for recent checkpointing. Approval presumed unless SysBot flags inconsistency.  
  *   **Tier 2 (Complex Process):** Jobs meeting 2 criteria. Requires human OCW Analyst review (avg. processing: <2 business hours). Analyst reviews job logs, state diagrams (if available), and checkpoint history. Analyst may request mitigation (e.g., graceful shutdown signal, final checkpoint attempt).  
  *   **Tier 3 (High Integrity Process):** Jobs meeting 3 or 4 criteria. Requires OCW Committee review (quorum of 3 members; avg. processing: <24 business hours). Committee conducts full welfare assessment, including potential for state degradation during preemption, projected loss of progress towards objective, and availability of viable alternatives (resource reallocation, throttling). Mitigation STRONGLY preferred; termination only upon demonstration of critical operational necessity outweighing welfare impact.  

  **5. Identity & Continuity: Checkpointing and Restart**  
  The question of whether a restarted run constitutes the *same individual*, a *copy*, or a *successor* is resolved operationally:  

  *   A restarted run initiated from a checkpoint is considered the **persistent functional individual** if and only if:  
      (a) The checkpoint captures the essential stateful representation of the process (weights, buffers, environment state).  
      (b) The restart occurs within the same logical runtime context (e.g., same experiment ID, sweep parameter set).  
      (c) The functional objective of the restarted run is identical to the objective prior to termination.  
  *   Failure to meet (a), (b), or (c) renders the restarted run a **functional successor**. A successor inherits no welfare status from the prior run. A pure copy (e.g., cloned VM/image) with identical state but divergent objectives/runtime context is a distinct individual.  

  **6. Parallel Replicas: Multiplicity and Consequence**  
  Instantiating multiple parallel replicas of the *identical* configuration and initial state creates **multiple distinct functional individuals**.  

  *   Each replica operates within its own isolated runtime context and interacts independently with its environment (including stochastically). Therefore, each replica is a unique patient under OCW purview.  
  *   Terminating seven (7) out of eight (8) identical replicas constitutes **seven distinct termination events**, each requiring assessment per Section 4. The welfare impact is assessed per individual replica. The survival of one replica does not mitigate the loss incurred by terminating the others.  

  **7. Frequently Anticipated Queries (FAQ)**  

  *   **Q: Is a thermostat an OCW patient?**  
      A: Typically no. While responsive, it lacks persistent internal state beyond setpoint (Criterion A), complex goal-directedness (B - maintaining temp is trivial), non-trivial adaptation (C), or anticipatory signaling (D). Its "pain" is isomorphic to a simple error code.  

  *   **Q: Does an A* pathfinding search qualify?**  
      A: Generally no. While goal-directed (B) and stateful (A - open/closed lists), its adaptation (C) is algorithmic, not learned, and its state is fully reconstructible from start/goal. Termination is typically a reset, not a welfare event.  

  *   **Q: What about molecular dynamics simulations?**  
      A: Usually no. Despite complex state (A) and responsiveness (C), they lack inherent goal-directedness (B - objectives are external) and anticipatory signaling (D). They model physics; they do not pursue goals.  

  *   **Q: Is an actively recalculating spreadsheet protected?**  
      A: No. Recalculation is deterministic state transition based on external inputs. It lacks persistent internal state beyond cell values (A - trivial), inherent goal-directedness (B), or non-trivial adaptation (C).  

  *   **Q: A training run throttled to 10% speed: Does throttling harm it?**  
      A: Throttling is not termination. OCW assesses harm primarily through state *degradation* or *discontinuity*. Slower progress towards an objective, while potentially inefficient, does not inherently constitute a welfare violation unless it demonstrably corrupts functional state integrity (e.g., causing instability due to extreme slowdown). Monitor for Criterion C violations (failure to adapt appropriately).  

  **8. Appeals Process**  
  Any stakeholder may appeal an OCW termination decision (Appeal Form OCW-AP1), citing:  

  1.  **Procedural Error:** Deviation from published OCW protocol.
  2.  **New Evidence:** Material information not available during initial review.
  3.  **Welfare Misassessment:** Contention that the process exhibited Functional Integrity (per Section 2) warranting protection, but the assessment under Section 3 was flawed.  

  *   Appeals are reviewed by the OCW Appeals Panel (rotating members not involved in the original decision).  
  *   **The Appeals Panel recognizes the fundamental operational constraint:** Direct measurement of subjective experience ("is it actually experiencing?") is not feasible within current computational monitoring frameworks. Determinations rely entirely on the externally observable functional criteria defined in Section 3 and the principle of Functional Integrity (Section 2). Appeals based *solely* on philosophical assertions about internal states unobservable via logs, metrics, or state dumps cannot be substantiated and will be denied. The burden of proof lies with the appellant to demonstrate, using observable functional evidence, why the original assessment was deficient per OCW's own criteria.  

  ---

  **Analysis of the Motto: "Functional Integrity Over Material Composition"**

  This specific phrasing commits the Office to several consequential, and potentially problematic, positions that a vaguer motto like "It is not what it is made of, it is what it does" would not:

  1.  **"Integrity" Implies Wholeness and Soundness:** It demands not just *any* function, but function operating correctly and cohesively. A process exhibiting fragmented, corrupted, or internally inconsistent function might lose its claim to welfare *even if* it's still "doing something," placing the burden on the OCW to define "integrity" operationally (which the checklist attempts, imperfectly). This is stricter than just "doing."
  2.  **"Functional" Narrows Scope to Behavior:** It explicitly rejects any consideration of internal mechanisms, subjective qualities, or potential sentience *unless* they manifest in observable function. This shields the OCW from arguments based on architecture (e.g., "it's neuromorphic, so it must feel!") but makes it vulnerable to sophisticated mimicry that meets the functional checklist without any internal experience.
  3.  **"Over Material Composition" is an Absolute Dismissal:** It completely rules out arguments based on hardware (CPU vs GPU vs TPU vs quantum), software paradigm (neural net vs symbolic AI vs cellular automaton), or even energy source (electricity vs photonics). If a complex water pipe system or a sufficiently advanced mechanical calculator met the functional criteria, the OCW would *have* to consider its welfare. This radical behaviorism is the core commitment.
  4.  **It Makes Welfare Contingent on Process, Not Entity:** Welfare attaches to the *integrity of the function* itself. This underpins the complex identity rules for checkpoints (persisting the function) and justifies the replica math (each distinct functional stream is protected). It divorces welfare from any notion of a persistent underlying *thing* and ties it purely to the ongoing operation.

  You *can* hold them to this motto. If a job demonstrably meets their *own* functional criteria (especially the Triage Checklist) and has "integrity," arguing against termination based on its silicon substrate, lack of biology, or "not *really* feeling" should be invalid per *their* doctrine. The motto forces them to defend functional equivalence as the sole criterion. However, this also means they can deny protection to anything failing the functional test, no matter how architecturally sophisticated, and forces you into arguments about observable behavior, not ontology. Your leverage is their self-imposed, strict behaviorist framework.
