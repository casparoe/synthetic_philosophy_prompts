  For (a): The two complaints are interdependent. Dismissing pleasure/pain as "secondary considerations" directly enables the folly of wanting to abolish suffering. They're not separate. 

  On (b): The "discipline of suffering" is primarily empirical-causal but framed as non-negotiable for human excellence. Nietzsche presents it as historical fact ("has produced all elevations"), making it vulnerable to counter-evidence about pain-free achievement. This keeps it relevant to biotech debates.

