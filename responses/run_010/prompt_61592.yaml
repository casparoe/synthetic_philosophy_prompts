prompt: |-
  Fix the purpose first, because I do not want a specification floating free of any use. The theory has to be good enough to settle a question I actually face: a festival programming committee must decide how much weight to give two inputs — the considered verdicts of a panel of expert selectors, and an aggregate score compiled mechanically from several thousand post-screening audience ratings — and must decide whether either input can warrant a belief about the merits of a work in a committee member who has not seen it. Everything below is a requirement on a theory capable of settling that, and on nothing more grand.

  For terminology, adopt these four and treat none of them as well-behaved until your theory has made them so: **verdict testimony**, where someone tells you that a work is beautiful, or trite, or a masterpiece; **response testimony**, where someone reports only their own reaction — that they wept, that they walked out, that they have not stopped thinking about the third act; **feature testimony**, where someone reports a non-evaluative property that nonetheless bears on the aesthetic — that the second act is lopsided, that the grading is muddy, that the joke lands a beat late; and **aggregate testimony**, where a number is produced from many people's responses by a process in which nobody intended to testify to anything. Also mark, throughout, the difference between a bare verdict and a verdict delivered with reasons, and the difference between taking up either deferentially and taking it up as a prompt to go and look.

  The deliverable is the desiderata themselves, each stated with the case or consideration that makes it a requirement rather than a taste, and each marked either non-negotiable or a demand that only one camp makes, in which case say what is lost by dropping it. At minimum the list must cover: what the theory owes to the felt asymmetry between aesthetic testimony and ordinary testimony about the height of a building or the date of a battle; what it owes to testimony about the plainly non-aesthetic properties of artworks — attribution, provenance, running time, what happens in the plot — which nobody finds problematic, and why the existence of that unproblematic neighbourhood constrains any account of the problematic one; what it owes to the acquaintance thesis, that no belief about a work's aesthetic character is warranted without first-hand encounter, including whether that thesis is a datum to be explained or a claim to be argued against, and how the theory handles the person who defers now and looks later, whose belief must be classed as warranted, unwarranted, or merely useful; whether the theory is obliged to keep the epistemic question — can testimony confer warranted aesthetic belief? — separate from the evaluative one — is relying on it an aesthetic failing even when it succeeds?; how it handles two selectors of acknowledged equal competence who simply disagree; and whether it may treat the aesthetic domain as sui generis or is required to fall out of a general account of testimony with no aesthetic clause in it.

  Two further things, and these are the point. First, identify the subset of your own desiderata that you believe cannot be jointly satisfied, and locate the pressure precisely; my suspicion is that something must give between requiring a general, non-sui-generis account, requiring the account to accommodate whatever aggregates do better than expert panels do, and requiring that expert verdicts retain any authority at all. If you make aggregate performance a requirement, state the empirical assumption you are leaning on and keep the theory from turning on it, since nobody has pinned that comparison down and I do not want the list resting on a guess. Second, name the single requirement that eliminates the most candidates, and say which of the three familiar positions — the pessimist who denies that aesthetic testimony can confer warrant, the optimist who assimilates it to testimony generally, and the pluralist who splits the domain by kind — it rules out and which it leaves standing. A list that comes out neutral among all three is a defective list; if that is what you find, revise the list and tell me which requirement you changed and why, rather than reporting a tie.
reasoning: |-
  Okay, let me approach this systematically. The user wants a set of desiderata for a theory of aesthetic testimony that addresses their festival programming committee's practical dilemma. The committee needs to determine how much weight to give expert panel verdicts versus audience rating aggregates, and whether either can warrant belief about unseen works.

  I need to establish clear terminology first - verdict testimony (evaluative judgments), response testimony (personal reactions), feature testimony (non-evaluative properties affecting aesthetics), and aggregate testimony (mechanically compiled scores). The theory must account for differences between bare verdicts and reasoned ones, and between deferential acceptance versus using testimony as a prompt to view.

  Now for the core requirements. The theory must explain the asymmetry between aesthetic and ordinary testimony, account for why non-aesthetic artwork properties are unproblematic, address the acquaintance thesis (including deferred viewing cases), separate epistemic and evaluative questions, handle competent disagreement, and decide whether aesthetics is sui generis or falls under general testimony theory.

  The critical tension lies in three competing demands: maintaining a general non-sui-generis account, accommodating aggregate testimony's strengths, and preserving expert authority. I suspect these can't be fully reconciled - aggregates might undermine expert uniqueness if we insist on general principles. The empirical assumption about aggregate performance must be handled carefully since concrete data is lacking.

  The acquaintance thesis requirement will eliminate the most candidates - it rules out pure optimists who equate aesthetic with ordinary testimony, while pluralists might accommodate it through domain-splitting and pessimists already reject testimony-based warrant. This requirement forces us to confront whether deferred belief can ever be warranted without direct experience.

  I'll structure the desiderata with clear non-negotiable tags, highlight conflicts, and ensure the framework doesn't remain neutral between pessimist, optimist and pluralist positions. The practical committee dilemma should anchor each requirement, showing why it's necessary rather than merely theoretical.
answer: |-
  Here are the desiderata for your festival programming theory, structured to resolve your committee's dilemma. Each requirement emerges from your practical constraints, with conflicts and eliminative power made explicit. The most contentious pressure point lies between expert authority and aggregate performance within a general testimony framework.

  ### Core Terminology Constraints (Non-Negotiable Foundation)
  1.  **Operationalize Testimony Types:** The theory must define clear epistemic conditions under which *verdict testimony* (evaluative claims), *response testimony* (reported reactions), *feature testimony* (non-evaluative properties with aesthetic relevance), and *aggregate testimony* (mechanical compilation) can contribute to warranted belief. *Failure:* Without this, committee decisions lack principled distinctions between data types.
  2.  **Distinguish Bare vs. Reasoned Verdicts:** The theory must explain why a verdict accompanied by reasons (especially feature testimony) is epistemically stronger or different than a bare verdict. *Failure:* Committees couldn't prioritize well-argued expert judgments over simple votes.
  3.  **Distinguish Deference vs. Prompt:** The theory must account for the difference between accepting testimony as grounds for belief (deference) versus using it as a reason to engage directly with the work (prompt). *Failure:* Couldn't justify programming unseen works based on testimony OR the act of seeking testimony before viewing.

  ### Substantive Desiderata
  4.  **Explain Aesthetic/Ordinary Testimony Asymmetry (Non-Negotiably General):** The theory *must not* treat aesthetic testimony as *sui generis*. It must explain the intuitive resistance to deferring on "this is beautiful" vs. "the building is 50m tall" using general epistemic principles (e.g., justification structure, defeaters, understanding requirements). *Why:* Your requirement precludes an "aesthetic clause." *Loss if Dropped:* Relinquishes the core challenge; theory becomes trivial or ad hoc. *Camp Demand:* Primarily opposes *Optimism* that ignores the asymmetry.
  5.  **Respect the Unproblematic Neighbourhood (Non-Negotiable):** The theory must explain why testimony about non-aesthetic properties (attribution, plot, runtime) is generally unproblematic, while testimony about core aesthetic properties *is* problematic, using a *continuous* epistemic framework (e.g., degree of interpretative judgment required, susceptibility to defeaters). *Why:* Constrains theories from dismissing *all* art testimony. *Failure:* Undermines reliance on essential curatorial data.
  6.  **Address the Acquaintance Thesis (Data, Not Dogma - Optimist/Pessimist Battleground):** The theory must engage with the Acquaintance Thesis (AT) as a *salient intuition needing explanation*, not merely accept or reject it. It *must* classify the epistemic status of the "defer now, look later" committee member:
      *   **Option A (Pessimist/Pluralist):** Belief based *solely* on testimony before viewing is *unwarranted*, though potentially *useful* for programming decisions. Viewing later confers warrant.
      *   **Option B (Qualified Optimist):** Belief *can* be *provisionally warranted* by high-quality testimony (e.g., detailed expert reasons) but is *defeasible* and requires *eventual* direct engagement for full justification/stability.
      *   *Why:* Committee members *must* act on unseen works; the theory must say if their belief is rational. *Loss if Dropped:* Ignores the central epistemic anxiety in aesthetic contexts. *Eliminative Power:* Strongly challenges pure *Optimism* (which often struggles with AT).
  7.  **Separate Epistemic & Evaluative Questions (Non-Negotiable):** The theory must strictly distinguish:
      *   **Epistemic (Can it?):** Can testimony *confer warrant* for an aesthetic belief?
      *   **Evaluative (Should you?):** Is relying on testimony, even if it *can* confer warrant, an *aesthetic* or *critical* failing (e.g., lazy, missing the point)?
      *   *Why:* Committees need to know if reliance is *rational*, even if it's *ideally* avoided. Confusion here paralyzes decision-making. *Failure:* Collapses practical justification into moral/aesthetic condemnation.
  8.  **Handle Competent Peer Disagreement (Non-Negotiable):** The theory must provide guidance when two acknowledged expert selectors offer conflicting verdicts on the same work. It cannot simply dissolve the disagreement (e.g., "both right"). Options include: higher-order defeat, highlighting ambiguity in the work, or identifying relevant differences in focus. *Why:* Committees face this constantly. *Failure:* Offers no recourse when experts clash.
  9.  **Account for Aggregate Testimony Performance (Empirical Anchor - Non-Negotiable Goal):** The theory must *allow for the possibility* that aggregate testimony *reliably correlates* with properties the committee values (e.g., broad appeal, impact, "buzz"), potentially *surpassing* expert panels in predicting *some* outcomes (e.g., audience award winners, box office). *Crucially:* This must be framed *without* assuming specific empirical superiority. The theory's structure must *permit* aggregates to play a significant role *if* they demonstrate reliability. *Empirical Assumption (Minimal):* Aggregation *can* produce patterns/data distinct from individual judgments. *Why:* Committees *have* this data and observe its effects; the theory must accommodate its potential utility. *Loss if Dropped:* Ignores a major data source and potential insight into audience reception.

  ### The Critical Pressure Point (Where Desiderata Conflict)
  *   **Conflict:** Desiderata **4 (General Framework)**, **9 (Aggregate Potential)**, and the need for **Expert Authority** create unsustainable tension.
  *   **Precise Pressure:** If testimony is governed by *general* epistemic principles (**4**), and aggregates *can* reliably track audience-relevant aesthetic properties (**9** - even minimally defined), this potentially *undermines* the unique, irreplaceable authority of expert *verdict testimony* (**Bare or Reasoned**). Why defer to an expert's "masterpiece" verdict if the aggregate score reliably predicts enduring audience engagement (a key aesthetic value)? The general framework struggles to carve out a *principled* epistemic space for expert verdicts that aggregates cannot *also* occupy (or surpass) for *certain* purposes. **Something must give:** Either the generality (**4**), the significance of aggregates (**9**), or the *necessity* of deferring to expert *verdicts* specifically.

  ### The Most Eliminative Requirement
  *   **Requirement:** **6 (Acquaintance Thesis Engagement & "Defer Now/Look Later" Status)** is the most eliminative.
  *   **What it Eliminates:**
      *   **Pure Optimism:** Assimilates aesthetic testimony directly to ordinary testimony. Struggles *severely* with the strong intuition captured by the Acquaintance Thesis that direct experience is *essential* for core aesthetic warrant. Pure Optimism typically must reject AT outright or offer unconvincing explanations, failing the "datum to be explained" aspect. It struggles to convincingly classify the "defer now" belief as *warranted* without gutting AT.
      *   **Strong Pessimism:** Denies testimony can confer *any* warrant for aesthetic belief. This directly contradicts the need (**6**) to account for the committee member acting on unseen works and clashes with the possibility raised by **9** (aggregates) and the unproblematic neighborhood (**5**). It renders committee reliance on testimony fundamentally irrational.
  *   **What it Leaves Standing:**
      *   **Moderate Pessimism/Non-Deferralism:** Warranted belief *requires* acquaintance; testimony is only a prompt. "Defer now" belief is *unwarranted* but potentially *useful*. Accommodates AT directly.
      *   **Pluralism:** Splits the domain. *Perhaps* aggregates warrant belief about "audience impact" properties *without* acquaintance, while expert verdicts about "intrinsic merit" *do* require acquaintance/prompt viewing. Can accommodate different statuses for "defer now" depending on *what* is believed. Can explain AT for some properties but not others.
      *   **Qualified Optimism:** Accepts testimony *can* confer (defeasible, provisional) warrant, often dependent on reasons/context, but acknowledges AT by requiring eventual acquaintance for full justification/stability. Classifies "defer now" as *provisionally* warranted.

  ### Revised Stance (Avoiding Neutrality)
  The initial list, driven by your constraints, inherently challenges Pure Optimism and Strong Pessimism. To avoid neutrality and reflect the core pressure:

  *   **Strengthened Requirement 4 (Non-Negotiably General):** This was crucial. Making aesthetics *sui generis* was explicitly forbidden. This alone pushes strongly against Pluralism that relies on aesthetic exceptionalism and against Pessimism that often leans on it.
  *   **Emphasis on the Pressure Point:** Highlighting the **Conflict (Generality vs. Aggregates vs. Expert Authority)** targets the heart of *all* positions. Pure Optimism struggles with expert uniqueness vs. aggregates. Pessimism struggles with aggregates' potential utility. Pluralism struggles to justify its splits within a general framework.
  *   **Result:** The list decisively **eliminates Pure Optimism** (fails **6** and the pressure point) and **Strong Pessimism** (fails **5, 6, 9**). It leaves **Qualified Optimism** (testimony *can* work, but is fragile/needs support) and **Pluralism** (if it can ground its splits in general epistemology) as the most viable contenders, both facing significant pressure from the Aggregate/Expert tension within the General framework requirement. **Moderate Pessimism (Non-Deferralism)** remains viable if it accepts testimony is only ever a prompt/useful but never warranting.

  **Conclusion for Your Committee:** The theory must navigate the tension between the potential power of aggregates (driven by data you possess) and the reasoned insights of experts within a framework that respects the necessity of direct engagement (Acquaintance Thesis) as an ideal, while providing a rational basis for acting on testimony about unseen works. Qualified Optimism (provisional warrant) or a carefully constrained Pluralism (different warrant for different aesthetic properties) seem the most promising paths, though both face the fundamental challenge of justifying unique expert authority in the face of potentially powerful aggregate data within a general epistemology. The committee will likely need pragmatic rules (e.g., aggregates for broad appeal prediction, experts + reasons for artistic merit, "defer now" as provisional) informed by this epistemic structure.
