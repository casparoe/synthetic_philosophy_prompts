  The core vulnerability isn't the standard sortition critiques (competence/mandate), but whether unaccountability is truly a feature. The audience will test this like a constitutional stress-test: "What happens when this body goes rogue?" Their objections will cluster around three themes: institutional sabotage (lawyers), behavioral contradictions (political scientists), and operational fragility (ex-legislators).

  Hmm... the most lethal objection isn't about theory but cold mechanics: "How do you prevent mass declination making this chamber non-viable?" The user admits this is their exposed flank. No robust data exists because no comparable body has been tried at scale. The partial answer must pivot to the secretariat's role as ballast, but that risks confirming capture fears.

  For concessions, they should pre-empt two issues: 
  1. To lawyers: "Yes, subpoena power could be abused - that's why we require judicial review for enforcement" (shows they've considered remedies). 
