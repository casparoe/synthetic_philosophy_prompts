prompt: |-
  so i'm drafting a paper on deferance to objective chance and I've ended up with five candidate principles on my desk and I cant work out which of them is worth defending. Rank them for me. Score each out of ten, but on one dimension only: how well it dodges the self-undermining problem — the one where the chance function assigns chances to chance propositions themselves, so a straight-up Principal Principle tells you to defer to a chance about a chance and ends up pulling against itself — without ceasing to be recognisable deference to chance at all. I don't want the standard objections recited back at me; I want an ordering with a reason attached to each item.

  Here they are, in my own shorthand. A is the proposition to be believed, H is the total non-chance history up to the present, x and y are reals in the unit interval.

  1. Plain PP: whenever the proposition that the chance of A is x is included in my evidence, my credence in A given that evidence should be x, provided the remainder of my evidence is admissible.

  2. Historical PP: my credence in A, given that the chance of A conditional on H is x, should be x, where H is the actual non-chance history. Chance propositions are never allowed into the conditioning part.

  3. Recursion-blocked PP: as in 1, except the principle applies only to chance propositions whose subject matter contains no chance facts and no facts about my own credences. Chance may be about anything, but deference is only owed where it cannot come to be owed about deference itself.

  4. Weighted PP: my credence in A should be w times x plus one-minus-w times the credence in A I'd have had if I'd never heard of chance, where w is my degree of belief that the chance fact in question is a genuine chance fact rather than a hypothesis somebody has merely asserted to me. w is explicitly not itself a chance.

  5. Second-order PP: I defer to the chance of the chance. My credence in A, given that the chance that the chance of A is x is y, should be y, with first-order deference recovered as the limiting case where y is one.

  For each of the five, say where it lands and why in a couple of sentences, then give the ordering from best to worst and tell me which one you would actually stand up and defend in front of a hostile audience. On top of that: which of my five is a real principle from the literature wearing a slightly diffrent hat, and which is genuinely something I've invented? And close with a single number between 0 and 1 for how likely you think your winner is to survive a determined referee.

  British English please, and no formatting whatsoever in the reply — no headings, no bullet points, no bold, no tables, just continuous prose the way you'd write a letter. The scores and the ranking should be worked into the sentences rather than set out as a list.
reasoning: |-
  Okay, let me tackle this user's query step by step. They're drafting a paper on deference to objective chance and have five principles to evaluate specifically on avoiding self-undermining problems. The key here is assessing each principle's ability to handle cases where chance assignments refer to themselves without collapsing.

  First, I need to recall the core issue: the self-undermining problem occurs when the Principal Principle requires deferring to a chance that is about chance itself, creating internal conflict. The user wants each principle ranked solely on this criterion, with scores out of ten, plus identification of which ideas are from literature versus original.

  Looking at Principle 1 (Plain PP): This is the classic Lewis formulation. It directly falls into self-undermining by allowing chance propositions about themselves into evidence. Score: 2/10. 

  Principle 2 (Historical PP) looks promising. By restricting conditioning to non-chance history H, it completely avoids chance propositions in the evidence. Hall 2004's variant handles this well. Score: 9/10. 

  Principle 3 (Recursion-blocked PP) tries to limit deference to non-chance subjects, but defining "subject matter" is notoriously tricky. It feels like a band-aid. Score: 5/10.

  Principle 4 (Weighted PP) introduces a non-chance weighting factor w, which dodges self-undermining by breaking pure deference. But it's more about handling unreliability than solving the core problem. Score: 3/10. 

  Principle 5 (Second-order PP) embraces higher-order chances but creates an infinite regress. While interesting, it doesn't solve the undermining issue. Score: 1/10. 

  Now ordering: Historical PP (9) > Recursion-blocked (5) > Weighted (3) > Plain (2) > Second-order (1). The clear winner is Historical PP, which I'd defend confidently. 

  Identifying origins: Historical PP is Ned Hall's approach, while Weighted PP seems like the user's invention blending reliability weights with deference. 

  Survival chance: Historical PP has strong literature support, so I'd estimate 0.85 survival likelihood against referees. 

  The user seems deep in technical philosophy - likely a grad student or early-career academic. Their frustration with standard objections suggests they've done their homework. The real need is cutting through noise to find a defensible position. Historical PP offers that solid foundation.
answer: |-
  Right then, let's get this sorted. Your focus is purely on how well each principle evades the self-undermining pitfall while staying true to deference, so that's the lens we'll use. Scores out of ten are for that dodge alone, higher is better. We'll take them in your order.

  Starting with your Principle 1, the Plain PP. This is the classic target for the self-undermining problem. It explicitly allows chance propositions about other chances into the evidence, demanding deference that can directly conflict when the chance function is applied to itself. It offers no defence against the problem whatsoever. It scores a dismal 2/10 for dodging – it simply walks into the punch.

  Principle 2, the Historical PP, looks much stronger on this front. By conditioning *only* on the non-chance history H, and demanding deference to the chance *conditional on H*, it rigorously excludes any chance propositions from the evidence base itself. The chance function it defers to can be about anything, including chances, but the evidence grounding the deference (H) contains no such chance facts. This cleanly sidesteps the loop where a chance proposition about chances enters the evidence that mandates deference to it. It's a robust dodge, earning a 9/10. The slight deduction is purely because some might argue the restriction feels *too* severe for a full deference principle, even if it solves this specific problem brilliantly.

  Principle 3, the Recursion-blocked PP, attempts a surgical strike. By limiting deference to propositions not about chances or credences, it aims to block the problematic recursion at the source. The dodge is conceptually clear: forbid the cases where self-application would bite. However, the effectiveness hinges entirely on the viability and non-arbitrariness of carving out that 'subject matter' restriction within a general deference principle. Defining 'subject matter' rigorously enough to avoid ad-hocery or new problems is notoriously tricky. It dodges, but the mechanism feels potentially fragile and invites questions about why deference suddenly vanishes for certain true chance facts. It gets a middling 5/10 for the dodge – it works in spirit but the execution feels vulnerable.

  Principle 4, the Weighted PP, takes a different tack. By blending the chance's advice with your prior credence (weighted by w, your belief in the chance's genuineness), it fundamentally weakens the deference. While this *technically* avoids the specific self-undermining conflict (because you're not fully deferring, so the contradiction isn't forced), it arguably ceases to be recognisable as pure deference to objective chance at all. The 'dodge' comes at the cost of the principle's core purpose. It's less dodging the bullet and more putting on a flak jacket that also obscures your uniform. For avoiding the *specific* undermining conflict while still gesturing towards chance? Perhaps a 3/10. But it feels like a surrender on the deference front.

  Principle 5, the Second-order PP, dives headfirst into the higher-order chance realm. It tries to resolve the conflict by deferring 'up' a level. The dodge is conceptually interesting but ultimately fails. If the undermining problem arises for first-order chances, it reappears just as viciously for second-order chances about those first-order chances. What if the chance function assigns a chance to *this* second-order chance proposition? You're pushed towards an infinite regress of deference without a stable foundation. It doesn't solve the problem; it just relocates it. Score: 1/10. It amplifies the issue rather than dodging it.

  So, ordering them purely on self-undermining dodge effectiveness, best to worst: Principle 2 (Historical PP, 9/10) is the clear leader, followed distantly by Principle 3 (Recursion-blocked, 5/10), then Principle 4 (Weighted, 3/10), Principle 1 (Plain PP, 2/10), and finally Principle 5 (Second-order, 1/10). Without hesitation, the one I'd stand up and defend against a hostile crowd is Principle 2, the Historical PP. Its restriction provides a principled, clear, and effective barrier against the undermining problem while maintaining a strong, recognizable deference to objective chance conditional on the actual history. It tackles the problem head-on with minimal fuss.

  As for provenance, Principle 2 is essentially Ned Hall's 'New Principle' or a close variant thereof, wearing the hat of conditioning strictly on non-chance history. Principle 4, your Weighted PP, feels genuinely inventive; I don't recall seeing that exact blend of deference with a non-chance reliability weight presented as a core principle to solve the deference conflict itself – it's more akin to a practical heuristic for unreliable informants grafted onto the problem. The others are established ideas or obvious tweaks.

  Finally, for your winner, Principle 2, its chance of surviving a determined referee? Given its established pedigree and the solidity of its solution to the specific problem you're targeting, I'd put it at a confident 0.85. The referees might debate its overall adequacy as a full theory of chance deference, but on the narrow point of cleanly dodging self-undermining while deferring, it's remarkably robust. Good luck with the paper.
