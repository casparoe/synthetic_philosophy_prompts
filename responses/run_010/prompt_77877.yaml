  ### Resulting Positions & Running Case Resolution  
  *Based on your path through the tree. The running case: A river basin spans four regions. Upstream’s lax land-use policy causes flooding downstream. The poorest downstream region cannot afford flood defenses. One region has a linguistic minority opposing basin-wide rules on cultural grounds.*  

