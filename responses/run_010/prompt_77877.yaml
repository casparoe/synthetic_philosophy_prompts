  ### Limitations & Unexplored Territory  
  1. **Indistinguishable Pairs:**  
     - **German & Swiss models** (Paths 1B-2C-3B-4A-5B-6A vs. 1A-2B-3B-4D-5A-6C) share "local implementation" (Node 3B) but diverge on *why* locals lead. The tree cannot probe cultural vs. efficiency rationales.  
