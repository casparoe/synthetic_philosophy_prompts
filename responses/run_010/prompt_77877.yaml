  ### Decision Tree: Allocation of Authority Diagnostic  
  *Answer based on ordinary intuitions about governance. No prior knowledge of legal terms needed.*  

  **Node 1: Why should local governments (e.g., states, provinces) handle most public matters?**  
  - **A:** They have an inherent claim to govern their own communities.  
  - **B:** It’s usually faster and cheaper to manage locally.  
  - **C:** Local actors best understand their unique needs.  

  **Node 2: When should a central government (e.g., national/federal) intervene in local matters?**  
  - **A:** When one locality’s actions harm its neighbors (e.g., pollution crossing borders).  
  - **B:** When the central government can achieve the goal more effectively (e.g., with fewer resources).  
  - **C:** When a basic standard (e.g., safety, health) is consistently unmet in a locality.  
  - **D:** When a locality lacks resources/expertise and requests support.  

  **Node 3: If the central government intervenes, how should it enforce its decisions?**  
  - **A:** Directly on individuals, businesses, or towns.  
  - **B:** Only by directing the governments of localities.  

  **Node 4: Who should decide whether the central government’s intervention is justified?**  
  - **A:** An independent court at the central level.  
  - **B:** A central body representing localities (e.g., a senate of regional delegates).  
  - **C:** A majority of local legislatures collectively.  
  - **D:** No formal body – it depends on political negotiation.  

  **Node 5: Should the people voting on a policy be the same as those affected by it?**  
  - **A:** Yes – those impacted should control the decision.  
  - **B:** No – broader groups may decide to address shared problems.  

  **Node 6: How should we assign authority for problems spanning multiple localities?**  
  - **A:** Start at the lowest level and escalate only if it fails.  
  - **B:** Assign to the level most likely to succeed.  
  - **C:** Create a new entity matching the problem’s scale (e.g., a river basin agency).  

