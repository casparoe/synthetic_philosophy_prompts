  | **Spending Federalism** (U.S. conditional) | 1B-2B-3A-4A-5B-6B | Central "carrots" coerce localities (e.g., highway funds tied to drinking age). | **Legislate:** Central government offers flood funds *if* upstream adopts rules. **Pay:** Central funds (if rules met). **Compel upstream:** Only via funding incentives. |  
