     In your appeal dated October 3, 2023, you cited monozygotic twinning potential (§4.5e: "Unique Identifiability Exceptions") to contend that BOE-α does not uniquely specify *you*, as the zygote could have split into twins. Thus, you argued, the "avoided-collision" worldline could contain *a version* of you eligible for payout. This is irrelevant. Per §1.2: "The Insured is defined as the *actualized entity* originating from BOE-α." Policy language binds coverage to the singular timeline wherein BOE-α yielded *one* continuous consciousness (your own). Whether BOE-α *could have* produced twins is immaterial; it *did not*. The proposed worldline’s entity (if any) is either (a) a non-covered duplicate (per Reason 1) or (b) a twin derivative legally distinct from the Insured. Either scenario voids coverage.  

