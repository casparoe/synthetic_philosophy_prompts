  We are given a list of 8 issues and need to rank them for a working group with limited time. The goal is to produce a draft resolution and a recommendation about possible compensation. The criteria for ranking are:

  (i) Does getting it wrong make the apology *defective* (i.e., fundamentally flawed) rather than merely worse?
  (ii) Does it change the actual words in the resolution or the accompanying recommendation?
  (iii) How much is it fixed by things outside the group's control?
  (iv) Tractability for nine laypeople in two hours.
  (v) What would move the item up or down? (e.g., new information, a hearing, tribal council response, budget number)

  Additionally, we must evaluate the user's pet distinction about changing the description of the past vs. obligations going forward.

  We are to output a JSON object with:
  - "agenda": a list of objects for each issue (or a new one we add) with the specified fields.
