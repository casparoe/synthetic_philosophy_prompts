prompt: |-
  ok so situation, and i want a real answer not a both-sides shrug.

  three weeks out i promised my sister i'd help her move her stuff across town on a saturday. nothing written, no money, just my word. two days before, something came up and i bailed. she's furious, and our brother has taken her side with a line he uses constantly: a promise is basically just an informal contract — same thing, minus the paperwork. from that he argues that contracts only really bind you once the other side has relied to their detrement, and since she hadn't booked a van or taken the day off work yet, i hadn't cost her anything, so at most i owed her a heads-up, not the drive. he's pretty smug that this is "just how contract law works too," that reliance is what switches the obligation on.

  can you audit the analogy properly? i want the mapping actually spelled out — what's standing in for the contract, the consideration, the court, the damages, the counterparty, whoever holds the power to release you — and then where it breaks, sorted into the disanalogies that matter for the use he's putting it to and the ones that are just decorative.

  then check his legal claim from the inside rather than from the outside: is it true that contract law makes reliance the ground of bindingness, or does the doctrine he's borrowing actually cut against him? i have a vague memory that the default remedy isn't about restoring what you lost, and that there's a specific fallback doctrine for promises people relied on, which would make reliance the exception rather than the rule. if that's right, say so and use it.

  and then the thing i think the analogy is being used to dodge: what makes a promise bind at all, if it isn't enforcement and isn't harm caused. does the contract picture quietly import features promises don't have — a third party to appeal to, a price you can pay to get out instead of performing, an obligation that comes into existence late instead of at the moment she took me up on it? test the limit cases too: a promise nobody acted on yet, a promise to yourself, a gratuitous promise that would never be enforceable anywhere.

  be committed about it. take a position on whether his argument survives once the disanalogies are on the table or whether the analogy was carrying the whole thing, and on whether i wronged her or merely inconvenienced her — those seem like different claims and i want to know which one you're endorsing. give your reasons, not a menu. and if you think contract is the wrong model, tell me what analogy would fit promising better, and then put that one through the same audit briefly so i'm not just trading one slogan for another.
reasoning: |-
  Alright, let's tackle this user's problem step by step. They need a thorough analysis of their brother's contract law analogy regarding a broken promise to help their sister move. 

  First, I need to map out the brother's analogy clearly. He's equating the verbal promise to an informal contract, arguing that since the sister hadn't relied on it yet (no van booked, no day off), there was no harm, so the brother isn't obligated. But is this accurate in contract law? 

  The user wants a breakdown: what parts of contract law correspond to elements in this promise? Consideration is key—contracts require an exchange, but here it's gratuitous. The sister didn't give anything in return. That's a major disanalogy. Also, contract remedies usually aim for expectation damages, not just reliance costs. The brother's reliance argument might be confusing part performance with the basis of obligation.

  Next, the legal claim: does reliance make a contract binding? Actually, no. Contracts are binding upon agreement with consideration, not just when reliance happens. Reliance comes into play in promissory estoppel cases, which is a fallback, not the default. So the brother's point is legally incorrect.

  The user also wants to know if they wronged their sister or just inconvenienced her. Ethically, breaking a promise without notice undermines trust and respect, which goes beyond inconvenience. Even without legal standing, the moral obligation exists from the moment the promise is accepted.

  Alternative models? Gratuitous promises are more like moral commitments. The analogy to a vow or gift might fit better. Testing that: a vow doesn't require reliance to be binding morally. The breach here is a failure of integrity, not just causing harm.

  Lastly, the brother's argument collapses under these disanalogies. The user did wrong their sister by breaking their word, regardless of reliance. The contract analogy was misapplied, hiding the ethical breach. Recommending an apology focused on the broken commitment, not just the inconvenience, would address the real issue.
answer: |-
  Here’s a rigorous audit of your brother’s analogy, a legal takedown of his claim, and a resolution grounded in ethics—not legal evasion.

  ### 1. **Mapping the Contract Law Analogy (His Version)**
     - **"Contract"**: Your verbal promise to help move.
     - **"Consideration"**: Implied as "help" (but gratuitous; no exchange).
     - **"Reliance"**: Sister booking a van/taking day off work.
     - **"Damages"**: Financial cost (van rental, lost wages).
     - **"Binding Obligation Trigger"**: Reliance (per his claim).
     - **"Power to Release"**: Sister (if she waives the promise).
     - **"Court"**: Family/friends arbitrating the dispute.

  ### 2. **Critical Disanalogies (Where His Argument Fails)**
  **A. Fatal Flaws (Undermine His Entire Point):**
     - **Consideration Absence**:  
       Contract law **requires bargained-for exchange**. Your promise was gratuitous ("I’ll help you")—no benefit to you or detriment to her in exchange. *No consideration = no contract*. His analogy ignores this bedrock principle.  
       *→ Breaks analogy*: His "informal contract" isn’t a contract at all legally.  
     - **Remedy ≠ Obligation**:  
       He conflates *when damages are awarded* with *when the duty arises*. Contracts bind at formation (promise + consideration), **not** upon reliance. Reliance (via *promissory estoppel*) is a fallback doctrine for **unenforceable promises** (like gratuitous ones) to compensate harm—**not** the source of the obligation.  
       *→ Breaks analogy*: Your duty existed when she accepted your promise, not when she relied.  
     - **Default Remedy is Expectation, Not Reliance**:  
       Contract law’s standard remedy is "expectation damages" (putting victim in position if promise was kept), **not** reliance recovery. If she’d booked a van, contract law would ask: "What’s the cost to hire a replacement?" **not** just "What did she spend?"  
       *→ Breaks analogy*: His "no reliance = no cost" logic ignores the core purpose of promises.  

  **B. Secondary Flaws (Misleading but Not Core):**
     - **No Third-Party Enforcer**: Family guilt ≠ a court. Contracts have state-backed enforcement; promises rely on social/moral sanctions.  
     - **No "Price to Get Out"**: Contracts allow damages instead of performance; promises demand the act itself or integrity-based repair.  
     - **"Power to Release"**: In contracts, parties can mutually rescind; here, only your sister can forgive—but your duty wasn’t contingent on her reliance.

  ### 3. **Legal Claim Audit: Is He Right About Contract Law?**
  **No—and doctrine contradicts him.**  
  - **Bindingness**: Contracts bind at formation (offer + acceptance + consideration). **Reliance is irrelevant** for standard contracts.  
  - **Promissory Estoppel (PE)**: His "reliance doctrine" is PE—a tool to enforce **non-contractual promises** *if* reliance causes injustice. Crucially:  
    - PE is **exceptional**, used when no contract exists.  
    - It requires **detrimental reliance** (e.g., booking non-refundable van).  
    - Remedy is **reliance damages** (recover costs), not expectation.  
  - **→ His error**: He uses PE (for non-binding promises) to argue your promise wasn’t binding *until* reliance. But PE only exists **because gratuitous promises aren’t binding as contracts in the first place**. His logic is circular and backwards.

  ### 4. **What Binds a Promise? The Ethical Core**
  Promises bind via **moral obligation**, not law or harm. Key features contracts *don’t* capture:  
  - **Commitment at Acceptance**: When she accepted your promise, she formed expectations and altered her plans psychologically (e.g., didn’t seek backups). Your bail-out breached trust.  
  - **Integrity, Not Exchange**: Promises are vows of fidelity to your word. You owe performance *or* renegotiation.  
  - **Limit Cases**:  
    - *Unrelied-upon promise*: Still binding (e.g., promising to water plants while neighbor is away—they trust you; harm isn’t required).  
    - *Promise to self*: Binding morally (self-trust), but no "counterparty."  
    - *Gratuitous promise*: Enforceable only via PE if relied upon—but still **morally binding without reliance**.  

  ### 5. **Better Analogy: A Promise as a Moral Vow**
  **Model**: Your promise is a vow (like agreeing to be godparent).  
  - **Mapping**:  
    - *Vow*: Sacred personal commitment.  
    - *Consideration*: None needed; grounded in relationship.  
    - *Breach*: Betrayal of trust, not quantified harm.  
    - "Damages": Restorative apology + making amends.  
  - **Audit**:  
    - *Strengths*: Captures gravity of commitment without legalism.  
    - *Disanalogies*: No "higher power" enforcing it—but family/social pressure exists.  
  - **→ Outcome**: Breaking a vow wrongs the person *by devaluing their trust*, even if they "lost" nothing material.

  ### 6. **Verdict: You Wronged Her**
  - **His Argument Fails**: The contract analogy collapses under scrutiny. It smuggles in legal concepts (reliance) while ignoring foundational ones (consideration), and misstates contract doctrine.  
  - **Harm vs. Wrong**:  
    - You **inconvenienced** her by forcing last-minute scrambling (consequential harm).  
    - You **wronged** her by breaking your word without notice, treating her time/trust as disposable. The wrong existed the moment you bailed without consultation.  
  - **Why It Matters**: Relationships run on mutual trust. Dismissing promises as non-binding until "costs accrue" makes you an unreliable ally.

  ### The Fix
  Apologize **for breaking your promise**, not just "causing hassle." Offer concrete amends (e.g., "I’ll pay for movers next weekend + take you to dinner"). Reject transactional logic—this is about being someone your family can count on. 

  **Bottom Line**: Your brother used bad law to excuse bad ethics. Promises bind when made; breaking them without consent is always a moral failure, regardless of paperwork.
