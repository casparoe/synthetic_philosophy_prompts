answer: |-
  Here's the exam question, model answer, and detailed marking scheme designed to target the specified learning objectives and common pitfalls.

  ---

  **Exam Question: The Costless Study Paradox (25 points)**

  The Environmental Safety Agency (ESA) must adopt one of two regulations by Friday:
  - **Regulation A**: Predictable impact. Guaranteed 10 units of social benefit.
  - **Regulation B**: Uncertain impact. With probability θ, it delivers 50 units of benefit; with probability (1-θ), it causes 20 units of harm (net -20). ESA’s prior is P(θ=0.1) = P(θ=0.9) = 0.5.

  On Wednesday, ESA considers running a costless, instant, perfectly reliable study that will reveal θ’s true value (either 0.1 or 0.9) on Thursday. ESA always chooses actions to maximize expected utility (EU) given its knowledge. However, Regulation B is *only* politically viable if the study’s results remain **unknown to the public**. If the study is run, its results automatically become public record Thursday morning. This makes Regulation B politically impossible to enact on Thursday, regardless of the study’s outcome. ESA *cannot* hide the results.

  **Actions & Timing**:
  - *Do Not Run Study (Wednesday)*: Choose A or B immediately (without knowing θ).
  - *Run Study (Wednesday)*: Learn θ on Thursday, then choose only A (since B is politically dead).

  **Utilities**:
  - Regulation A: 10
  - Regulation B: 50 if θ=0.9, -20 if θ=0.1
  - Study itself has 0 utility cost/benefit.

  **Questions**:
  1. Calculate the expected utility of *not running the study*. *(5 points)*
  2. Calculate the expected utility of *running the study*. *(5 points)*
  3. Should ESA run the study? Justify quantitatively. *(3 points)*
  4. Good’s Theorem states that with fixed acts, fixed utilities, and conditionalization, a costless observation has non-negative expected value. Explain why this *appears* to be contradicted here. Then identify which explicit or implicit assumption of Good’s Theorem fails, and how this example violates it. *(12 points)*

  ---

  **Model Answer (700 words)**

  **1. EU of Not Running Study:**  
  Without the study, ESA chooses between A (EU=10) and B.  
  EU(B) = [P(θ=0.9) × 50] + [P(θ=0.1) × (-20)] = [0.5 × 50] + [0.5 × -20] = 25 - 10 = **15**.  
  Since 15 > 10, ESA chooses B. EU(No Study) = **15**.

  **2. EU of Running Study:**  
  If the study runs, ESA learns θ on Thursday but can *only* choose A (as B is politically infeasible).  
  - If θ=0.9 (prob 0.5), utility = 10 (only A available)  
  - If θ=0.1 (prob 0.5), utility = 10 (only A available)  
  EU(Study) = [0.5 × 10] + [0.5 × 10] = **10**.

  **3. Should ESA run the study?**  
  No. Running the study yields EU=10, while not running it yields EU=15. ESA loses 5 units of expected utility by running the study.

  **4. Good’s Theorem Analysis:**  
  *Apparent Contradiction:* Good’s Theorem suggests a costless observation should never reduce expected utility. Here, running the study (a costless observation) *reduces* EU from 15 to 10, violating this expectation.

  *Failed Assumption:* Good’s Theorem assumes a **fixed set of available acts** before and after the observation. This example violates that assumption because the act-set *changes* based on whether the observation occurs.

  *How the Violation Occurs:*  
  - **Wednesday’s Act-Set (Pre-Observation):** {Adopt A, Adopt B, Run Study}  
  - **Thursday’s Act-Set if Study RUN:** {Adopt A} (B is politically dead)  
  - **Thursday’s Act-Set if Study NOT RUN:** {Adopt A, Adopt B}  

  The availability of Regulation B *depends* on whether the study occurs. Crucially, B is available only if the ESA *remains ignorant* of θ. By running the study, ESA gains information but loses B as an option. The costless observation alters the decision topology by eliminating a previously available act.  

  *Why Other Assumptions Hold:*  
  - **Fixed Utilities:** Utilities for A and B outcomes are identical pre- and post-study.  
  - **Conditionalization:** ESA updates beliefs via Bayes’ Theorem upon seeing the study.  
  - **Zero Budget Cost:** The study has no direct utility cost, as stipulated. The cost arises *indirectly* via the *procedural consequence* of eliminating an act.  

  *Core Insight:* The "cost" here isn’t from the observation *itself*, but from how its *institutional context* (public disclosure) *removes a valuable option*. Good’s Theorem does not account for observation-dependent act-sets. Thus, the example doesn’t refute Good; it illustrates that the theorem’s "fixed act-set" assumption is necessary and non-trivial. More evidence isn’t always valuable when learning *changes the rules of the game*.

  ---

  **Marking Scheme (25 points total)**  
  **A (22-25):** Correct calculations + identifies **fixed act-set violation** as critical failure.  
  **B (18-21):** Correct calculations + notes "political cost" but misses *act-set shift* OR misattributes failure to utility/conditionalization.  

  | **Question** | **Points** | **A-Grade Requirements**                                                                 | **Common Mistakes (Deduct Points)**                                                                                                |
  |--------------|------------|------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------------|
  | **Q1**       | 5          | EU(B)=15, chooses B.                                                                     | EU(B) miscalculation (-2). Chooses A without justification (-3).                                                                 |
  | **Q2**       | 5          | EU=10 (only A available post-study).                                                     | Assumes B is choosable post-study (-5). Miscalculates EU (-2).                                                                    |
  | **Q3**       | 3          | "No" + compares EU(no study)=15 > EU(study)=10.                                          | Correct choice without comparison (-1). Wrong choice with calculation (-3).                                                     |
  | **Q4**       | 12         | **1.** Notes contradiction w/Good’s Theorem (2pts). **2.** Identifies **FIXED ACT-SET** as failed assumption (6pts). **3.** Explains *how* act-set changes: B vanishes post-study due to publicity (4pts). | **-6:** Misses act-set failure (e.g., blames "political costs" or "changing utilities"). **-4:** Vague on *how* act-set changes. **-2:** Misstates Good’s Theorem. |
  | **Penalties**| -          | **-5 max:** Confusing "zero budget cost" with "zero cost" full stop (e.g., "study isn’t free because it has political costs"). | **Automatic B range:** Correct numbers but claims case "refutes Good" without naming *specific failed assumption*.              |

  **Key Distinctions**:  
  - **A vs. B**: An **A** answer *explicitly names and explains* the **fixed act-set violation** as the broken assumption. A **B** answer has correct math but attributes the EU loss to "costs" or vaguely "political constraints" without linking to Good’s formal assumptions.  
  - **Critical Penalties**:  
    - Missing "fixed act-set" (-6 in Q4) → Likely B.  
    - Calling the study "not costless" (-5 overall) → Caps score at 20 (B).  

  ---

  **Confidence & Caveat**  
  - **Confidence Level**: 98% in the diagnosis. The act-set shift is unambiguous, and the math cleanly isolates it.  
  - **Least Defensible Claim**: That "utilities are fixed." A student *could* argue publicity *alters the utility* of B (e.g., "political backlash reduces net benefit"). I rule this out by *stipulating* fixed outcome utilities, but this is artificial. Real-world "act-set changes" often correlate with utility shifts.  

  This question forces students to move beyond naïve evidence fetishism and grapple with how learning *interacts* with decision constraints. The marking scheme harshly penalizes the two predicted reflexes, rewarding attention to Good’s structural assumptions.
