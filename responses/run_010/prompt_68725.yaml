prompt: |-
  I'm writing the final paper for a graduate decision theory seminar (twelve students, three-hour closed book exam, one side of A4 permitted as notes), and I need one essay question worth 30 of the 100 marks, to be answered in roughly 50 minutes. My students have had one lecture on the St. Petersburg paradox and one on Hájek and Nover's Pasadena game, and last year's version of this question — "state the Pasadena paradox and discuss two responses to it" — was, to my embarrassment, answerable almost entirely from memory of the lecture slides. I want a question that can only be answered by someone who has actually thought about where the trouble comes from. So please build the question around material I'll supply in the exam itself, and stipulate all the mathematics so that no outside reading is required: the Pasadena game, in which a fair coin is tossed until heads first appears at toss n and the payoff is (-1)^(n-1) · 2^n / n utils, so that the expectation series has terms (-1)^(n-1)/n and is conditionally convergent; the Riemann rearrangement theorem; the measure-theoretic convention that the expectation of a real-valued random variable is defined only when E|X| is finite, so that a conditionally convergent series does not yield a well-defined expectation at all; and my own variant, which I'll call the Valparaíso game and which I invented for exactly this purpose. In the Valparaíso game the payoffs are those of the Pasadena except that whenever n is a power of two the payoff is +2^n utils instead; the expectation series then contains infinitely many terms equal to +1 (since 2^-n · 2^n = 1), its positive part diverges while its negative part converges to -(1/2)ln 2, and so its value is +∞ unconditionally — invariant under any rearrangement.

  The question should make the student do something with that pair rather than describe it. Specifically, I want it to force three moves. First, a diagnosis: is the Pasadena's trouble a defect in the formalism (expectation is simply undefined, and a principle that tells you to maximize an undefined quantity is silent rather than contradictory) or a substantive normative failure, and what turns on which? Second, an assessment of the escapes — in particular, whether the Bernoulli move of passing to a bounded utility function is even available here, given that the payoffs are stipulated in utils and given that any bound M makes the series absolutely convergent by comparison with M·2^-n, and whether a comparative or relative treatment of expected value (ranking gambles by the value of their difference rather than assigning each a value) can rank the Pasadena against the Valparaíso when the difference of two conditionally convergent series is itself at issue. Third, a judgment about fragility: the Pasadena sits a hair's breadth from a game whose value is determinate and infinite, and from games obtained by any permutation of its own payoffs; does the reply "such cases are knife-edge, and a theory need not be robust on a negligible set of gambles" dissolve the paradox, concede it, or change its subject? Please have the question ask the student to state and defend three desiderata that any repaired principle must satisfy — rearrangement invariance, agreement with ordinary expected utility on every bounded-utility gamble, and a determinate ranking of the Pasadena against the Valparaíso — and to say which of their own candidate repairs meets all three, rather than to list repairs from the literature.

  Deliver the question in exam-ready prose (with the stipulated facts set out as a short numbered list inside it, as they would appear on the paper), then a model answer of 700 to 900 words that a strong student could plausibly write in 50 minutes, and then the marking scheme. The model answer must be self-contained: no citations, no attributions of positions to named authors beyond the bare framing of the Pasadena game, and no recommendations of further reading, since I want to grade the reasoning and nothing else, and I want the marking scheme not to reward name-dropping. After the marking scheme, append a compact design note as a JSON object with exactly these fields: "crux" (one sentence on the single question the whole item turns on), "why_recitation_fails" (one sentence), "must_hit_moves" (array of strings, the moves without which the answer cannot exceed the B range), "penalized_moves" (array of strings, the specific errors and which criterion each is docked under), "stipulated_facts" (array of strings, the mathematical material supplied in the question), "marks_total" (integer), and "intended_minutes" (integer). Present the marking scheme itself as a markdown table with exactly these columns, in this order: Criterion | Marks | What a first-class answer does | What a competent second-class answer does | Specific error that costs marks. There should be five or six criteria whose marks sum to 30, and every entry in the final column must name a mistake students actually make on this material — for example, treating conditional convergence as though it meant the expectation is infinite rather than undefined, invoking bounded utility without noticing that the payoffs are already utilities, assuming that rearranging terms describes a different gamble without arguing for it, or concluding from the Valparaíso comparison that the Pasadena's value must be +∞ too.
reasoning: |-
  We are constructing an exam question and model answer for a graduate decision theory seminar. The question should revolve around the Pasadena and Valparaíso games, with the provided mathematical stipulations, and force the students to think deeply about the source of trouble in the Pasadena paradox. The question should ask the student to state and defend three desiderata for a repaired principle and to evaluate candidate repairs against these.

  Exam Question:

  ---

  **Question 4 (30 marks).** Consider the following two games of chance:

  1. The **Pasadena game**: A fair coin is tossed until it lands heads for the first time on toss \(n\). The payoff is \((-1)^{n-1} \cdot 2^n / n\) utils. The expectation series \(\sum_{n=1}^{\infty} (-1)^{n-1}/n\) is conditionally convergent (by the alternating series test) but not absolutely convergent (since the harmonic series diverges). By the Riemann rearrangement theorem, the terms of this series can be rearranged to sum to any real number, or to diverge.

  2. The **Valparaíso game**: The rules are the same as the Pasadena game, except that whenever \(n\) is a power of two (i.e., \(n = 2^k\) for some integer \(k \geq 0\)), the payoff is \(+2^n\) utils (instead of \((-1)^{n-1} \cdot 2^n / n\)). The expectation series for the Valparaíso game has terms:
     - \(a_n = 1\) if \(n\) is a power of two (because the probability of \(n\) is \(2^{-n}\) and the payoff is \(2^n\), so the contribution is \(2^{-n} \cdot 2^n = 1\)),
     - \(a_n = (-1)^{n-1}/n\) otherwise.
     Since there are infinitely many powers of two, the series has infinitely many terms equal to 1. The positive part of the series (the sum of the positive terms) diverges to \(+\infty\) (because the sum of the 1's alone diverges), while the negative part (the sum of the negative terms) converges to \(-\frac{1}{2} \ln 2\) (because it is the same as the negative part of the alternating harmonic series, which converges). Therefore, the expectation of the Valparaíso game is unconditionally \(+\infty\).

  In the standard measure-theoretic framework, the expectation of a random variable \(X\) is defined only when \(E[|X|] < \infty\) (i.e., the series for \(E[|X|]\) converges). Thus, the Pasadena game has no well-defined expectation, while the Valparaíso game has expectation \(+\infty\).

  We wish to have a decision principle that can rank gambles such as these. State and defend three desiderata that any such principle should satisfy. Your desiderata should include at least:
     (i) **Rearrangement invariance**: The value assigned to a gamble should be invariant under any permutation of the payoffs (with their probabilities) — that is, the same in every state-description of the same probability space.
     (ii) **Agreement with ordinary expected utility (EU) on bounded gambles**: For any gamble with bounded utility (i.e., there exists \(M\) such that \(|X| \leq M\) almost surely), the principle should assign the same value as the standard EU.
     (iii) **Determinate ranking of Pasadena against Valparaíso**: The principle should be able to rank the Pasadena game against the Valparaíso game (i.e., say which is preferred, or whether they are indifferent).

  Then, discuss whether a principle that satisfies these three desiderata is possible. In particular, consider the following candidate repair: *Use the expectation when it is defined (absolutely convergent), and when it is not, use the limit of the expectations under a sequence of utility transformations that bound the utility (e.g., \(u_M(x) = \min\{x, M\}\) and \(u_M(x) = \max\{x, -M\}\)) and then let \(M \to \infty\).* Does this candidate satisfy your three desiderata? If not, which one(s) does it violate and why?

  Finally, reflect on the following claim: "The Pasadena game is a pathological case that lies on a knife-edge; since the set of such gambles is negligible, we need not require our decision theory to be robust against them." Does the existence of the Valparaíso game, which is arbitrarily close to the Pasadena game (by changing only a few payoffs) but has a determinate infinite expectation, support or undermine this claim?

  ---

  Model Answer (800 words):

  The Pasadena paradox reveals a flaw in the standard expected utility (EU) theory: when the expectation series is conditionally convergent, the EU is not well-defined. The Valparaíso game, by contrast, has a well-defined expectation of \(+\infty\). We set out three desiderata for a repaired decision principle.

  **Desideratum 1: Rearrangement Invariance.** The value assigned to a gamble should not depend on how we label the states of the world, provided the probabilities and payoffs remain the same. This is a fundamental requirement of state-neutrality. The Pasadena game violates this because by rearranging its payoff order (which we can do without changing the probability structure, by permuting states with the same probability), we can make the expectation series converge to any real number or diverge. Hence, any principle that assigns a definite value to the Pasadena game must be rearrangement-invariant to avoid arbitrariness.

  **Desideratum 2: Agreement with EU on bounded gambles.** For any gamble with bounded utility, the standard EU is well-defined (because \(E[|X|] \leq M < \infty\)) and should be respected. This desideratum ensures that the repair does not break EU in ordinary cases. Moreover, bounded gambles are the foundation of many derivations of EU (e.g., via the von Neumann-Morgenstern axioms). A repair that violates this would be too revisionary.

  **Desideratum 3: Determinate ranking of Pasadena against Valparaíso.** The principle should be able to rank these two games. The Valparaíso game has expectation \(+\infty\), while the Pasadena game has no defined expectation. Intuitively, the Valparaíso game seems better because it offers huge positive payoffs on powers of two and only finite negative payoffs elsewhere, whereas the Pasadena game has payoffs that swing wildly without a clear overall tendency. Moreover, the Valparaíso game is obtained from the Pasadena game by improving the payoffs on a set of states (the powers of two) — from a mix of positive and negative to uniformly positive. Hence, by dominance, Valparaíso should be preferred. A principle that cannot capture this would be inadequate.

  Now, consider the candidate repair: use the expectation when absolutely convergent; otherwise, use the limit of truncated expectations as the bound \(M \to \infty\). Specifically, for a gamble \(X\), define \(X_M = \min\{\max\{X, -M\}, M\}\) (i.e., truncate at \(\pm M\)), compute \(E[X_M]\), and then let \(M \to \infty\). This candidate satisfies Desideratum 2 because for bounded gambles, beyond some \(M\), \(X_M = X\) and so the limit equals the EU. However, for the Pasadena game, this limit does not exist: as \(M\) increases, \(E[X_M]\) oscillates and does not converge. This is because the truncated series for the Pasadena game is conditionally convergent and its value depends on the order of truncation (which is fixed by the natural order of \(n\), but that order is arbitrary). Thus, the candidate fails to assign a definite value to the Pasadena game. Moreover, it violates Desideratum 1 because if we rearrange the states of the Pasadena game, the truncation procedure (which follows the state order) would yield a different limit. Hence, it is not rearrangement-invariant. For the Valparaíso game, the truncation procedure does work: because the positive part diverges, as \(M \to \infty\), \(E[X_M] \to \infty\). Thus, the candidate assigns \(\infty\) to Valparaíso, but leaves Pasadena undefined, so it cannot rank them (violating Desideratum 3).

  We now face a dilemma. Desiderata 1 and 3 together require that we assign a definite value to the Pasadena game. But any assignment would be arbitrary because of rearrangement. One might try to fix a canonical order (e.g., by the natural number \(n\)), but that violates rearrangement invariance. Alternatively, one might say that the Pasadena game has no defined value, but then we cannot rank it against Valparaíso (violating Desideratum 3). Thus, no principle can satisfy all three desiderata simultaneously.

  Finally, consider the claim that the Pasadena game is negligible. The Valparaíso game undermines this claim. Although the Valparaíso game is obtained by changing the Pasadena payoffs only on a set of states with small probability (the powers of two have total probability \(\sum_{k=0}^{\infty} 2^{-2^k} \approx 0.5\)), it yields a completely different expectation (infinite vs. undefined). Moreover, by changing only finitely many payoffs in the Pasadena game, we can make the expectation diverge to \(+\infty\) or \(-\infty\) (by setting all payoffs for \(n \leq N\) to be positive or negative). Hence, the Pasadena game is not an isolated pathology but lies in a continuum of nearby gambles with well-defined infinite expectations. A decision theory that fails for such cases is not robust. Therefore, the paradox cannot be dissolved by dismissing the Pasadena game as negligible.

  In conclusion, the three desiderata are mutually incompatible. The candidate repair fails because it does not achieve rearrangement invariance and cannot rank the two games. The problem is not merely a gap in the definition of expectation but a substantive normative failure: the principle of maximizing expected utility is silent in a case where we have clear preferences (e.g., by dominance, Valparaíso is better). We must either abandon rearrangement invariance (which seems fundamental) or accept that we cannot assign a definite value to the Pasadena game and thus cannot rank it. The latter option might lead us to a comparative decision theory that ranks gambles without assigning cardinal values. However, even a comparative theory must satisfy dominance: since Valparaíso dominates Pasadena (it is better in some states and not worse in any), we must prefer it. Thus, a comparative theory that respects dominance can rank the two without assigning definite expectations, satisfying Desideratum 3. But it still must confront rearrangement: if we rearrange the states, does dominance still hold? Yes, because dominance is state-by-state and invariant under rearrangement. Therefore, a comparative principle that respects dominance and agrees with EU on bounded gambles might satisfy Desiderata 2 and 3, but it would avoid assigning values and thus sidestep Desideratum 1. This suggests that the real issue is the demand for a cardinal value assignment. Perhaps the lesson is that we should only require a partial ordering of gambles, and accept that some (like the Pasadena game) are incomparable to others? But then we must give up Desideratum 3. The paradox thus forces a choice: either we sacrifice rearrangement invariance (by fixing an arbitrary state order) or we accept incompleteness in our preference ordering. Both options are costly, and the Valparaíso game shows that the problem is not negligible.

