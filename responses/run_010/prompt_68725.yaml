answer: |-
  ### Exam Question

  **Question 4 (30 marks).**  
  Consider the following two games of chance:  

  1. **Pasadena game**: A fair coin is tossed until heads first appears at toss \(n\). The payoff is \((-1)^{n-1} \cdot 2^n / n\) utils. The expectation series \(\sum_{n=1}^\infty (-1)^{n-1}/n\) is conditionally convergent (converges to \(\ln 2\)) but not absolutely convergent (since \(\sum_{n=1}^\infty 1/n\) diverges). The Riemann rearrangement theorem implies this series can be rearranged to converge to any real number or diverge.  
  2. **Valparaíso game**: Identical to the Pasadena game, except when \(n\) is a power of two (i.e., \(n = 2^k\) for \(k \geq 0\)), the payoff is \(+2^n\) utils. The expectation series has:  
     - Terms \(a_n = 1\) for all \(n\) that are powers of two (since \(\Pr(n) \cdot 2^n = 2^{-n} \cdot 2^n = 1\)),  
     - Terms \(a_n = (-1)^{n-1}/n\) otherwise.  
     The positive part diverges to \(+\infty\) (due to infinitely many \(+1\) terms), while the negative part converges to \(-\frac{1}{2}\ln 2\). Thus, the expectation is unconditionally \(+\infty\).  

  In standard measure theory, expectation \(E[X]\) is defined only if \(E[|X|] < \infty\). Hence, the Pasadena game has undefined expectation, while the Valparaíso game has \(E[X] = +\infty\).  

  **Your tasks**:  
  (A) State and defend **three desiderata** for a decision principle aiming to "repair" expected utility theory for such cases. Your desiderata must include:  
     (i) *Rearrangement invariance*: The value of a gamble is unchanged by permuting payoffs across states with identical probabilities.  
     (ii) *Agreement with ordinary expected utility on bounded gambles*: The principle matches standard \(E[X]\) when \(|X| \leq M\) for some \(M\).  
     (iii) *Determinate ranking of Pasadena vs. Valparaíso*: The principle ranks one as strictly better, worse, or indifferent.  
     Justify why each is normatively compelling. [12 marks]  

  (B) Consider a "candidate repair" that assigns \(E[X]\) if \(E[|X|] < \infty\), and otherwise uses \(\lim_{M \to \infty} E[\min(\max(X, -M), M)]\). Assess whether this satisfies your three desiderata. [10 marks]  

  (C) A critic argues: "The Pasadena game is a pathological knife-edge case; a theory need not handle negligibly rare gambles robustly." Does the Valparaíso game—obtained by altering only payoffs at powers of two—support or undermine this claim? Defend your view. [8 marks]  

  ---

  ### Model Answer (820 words)  

  #### (A) Three Desiderata for a Repaired Decision Principle  
  1. **Rearrangement Invariance**: A decision principle should assign the same value to a gamble regardless of how states (with equal probability) are labeled. This ensures the principle respects the underlying probabilistic structure rather than arbitrary labeling. In the Pasadena game, rearranging states changes the expectation series sum (by the Riemann rearrangement theorem), making any definite valuation arbitrary. A normatively adequate principle must avoid such arbitrariness.  
  2. **Agreement with Ordinary EU on Bounded Gambles**: For bounded gambles (where \(|X| \leq M\)), the principle must reduce to standard expected utility. This preserves the theory’s validity in ordinary cases where \(E[|X|] < \infty\) holds and expected utility is uncontroversial. Crucially, since the payoffs here are specified in *utils*, any transformation (e.g., bounding utility) would alter the gamble itself, violating the principle’s conservatism.  
  3. **Determinate Ranking of Pasadena vs. Valparaíso**: The principle must rank the Pasadena and Valparaíso games. The Valparaíso game dominates the Pasadena game (it replaces negative payoffs at powers of two with large positive ones), so it should be strictly preferred. Failure to capture this would be a normative failure, as dominance reasoning is fundamental to rational choice.  

  #### (B) Assessment of the Candidate Repair  
  The candidate repair defines "generalized expectation" as \(E[X]\) when \(E[|X|] < \infty\), and otherwise uses \(L = \lim_{M \to \infty} E[X_M]\), where \(X_M = \min(\max(X, -M), M)\). We evaluate it against the desiderata:  
  - **Rearrangement Invariance**: The candidate **violates** this. For the Pasadena game, \(E[X_M]\) depends on the order of truncation (i.e., the natural order of \(n\)). A rearrangement (e.g., grouping positive terms first) would make \(L\) diverge to \(+\infty\), while another (e.g., negative terms first) makes \(L \to -\infty\). Thus, the value is order-dependent.  
  - **Agreement on Bounded Gambles**: The candidate **satisfies** this. For bounded \(|X| \leq M_0\), \(X_M = X\) for all \(M > M_0\), so \(L = E[X]\).  
  - **Determinate Ranking**: The candidate **fails** to rank the games. For Valparaíso, \(E[X_M] \to +\infty\) (since large \(M\) includes more \(+1\) terms), so \(L = +\infty\). For Pasadena, \(L\) does not exist—\(E[X_M]\) oscillates as \(M\) grows (e.g., peaking at even \(n\), troughing at odd \(n\)). Thus, Pasadena is "undefined" and cannot be ranked against Valparaíso.  

  The candidate fails two desiderata. Crucially, it cannot rank the games due to the Pasadena’s conditional convergence and violates rearrangement invariance by relying on state order.  

  #### (C) Robustness and the "Knife-Edge" Claim  
  The Valparaíso game **undermines** the claim that the Pasadena paradox is a negligible pathology. The Valparaíso game:  
  - Is *arbitrarily close* to the Pasadena game: only payoffs at powers of two (a set with probability \(\sum_{k=0}^\infty 2^{-2^k} \approx 0.5\)) are altered.  
  - Yields a robust, determinate expectation (\(+\infty\)) immune to rearrangement.  
  - Demonstrates that minor payoff perturbations (e.g., finitely many changes) can convert the Pasadena game into a gamble with \(E[X] = \pm\infty\).  

  This shows the Pasadena game is not an isolated anomaly but lies in a dense neighborhood of gambles with divergent expectations. A decision theory that fails here is *fragile*, not robust. Dismissing such cases as "knife-edge" concedes the theory’s inadequacy in a non-negligible class of gambles (those with conditionally convergent series). Worse, it ignores normative demands: dominance prescribes that Valparaíso is better, so a silent theory (e.g., standard EU) is incomplete, not neutral.  

  #### Synthesis: The Incompatibility of Desiderata  
  The three desiderata are **mutually incompatible**:  
  - Desiderata (i) and (iii) require assigning a definite value to Pasadena (to rank against Valparaíso) that is rearrangement-invariant. Yet by Riemann’s theorem, no such value exists—any choice is arbitrary.  
  - Desideratum (ii) restricts solutions: since payoffs are utils, bounding utility alters the gamble, making utility transformations inapplicable.  

  A "repair" must thus relax one desideratum:  
  - Abandoning (i) allows fixing a canonical order (e.g., natural numbers), but this is arbitrary and violates state neutrality.  
  - Abandoning (iii) leaves Pasadena unrankable, defying dominance.  
  - Abandoning (ii) breaks consistency with bounded cases.  

  The paradox reveals a deep issue: standard EU’s silence in Pasadena-like cases is a *substantive normative failure*, not a benign gap. The Valparaíso game sharpens this by providing a dominance-based ranking that any adequate principle must capture. A promising path is *comparative principles* (e.g., stochastic dominance) that rank gambles without assigning cardinal values, satisfying (iii) and (i) (as dominance is order-invariant). However, such principles may not satisfy (ii) or resolve all cases. Ultimately, the paradox forces us to accept either arbitrariness or incompleteness in decision theory.  

  ---

  ### Marking Scheme  

  | Criterion | Marks | What a first-class answer does | What a competent second-class answer does | Specific error that costs marks |  
  |-----------|-------|--------------------------------|------------------------------------------|--------------------------------|  
  | **Desiderata: Statement & Defense** | 12 | States all three desiderata clearly; defends each with normative reasoning (e.g., rearrangement avoids arbitrariness, bounded EU consistency is essential, dominance requires ranking). | States desiderata but with vague/partial justification (e.g., omits why utils constrain bounded transformations). | Misstates a desideratum (e.g., "expectation must be finite" for (iii)); or omits defense of why utils matter for (ii) (–3 per flaw). |  
  | **Candidate Repair Assessment** | 10 | Correctly identifies violations of (i) and (iii) for Pasadena (oscillation in \(L\), order-dependence); notes (ii) holds; uses series behavior to explain. | Identifies failures but without technical clarity (e.g., "Pasadena’s limit oscillates" without linking to conditional convergence). | Claims candidate works for Pasadena; or asserts (ii) is violated; or invokes bounded utility as a fix without noting payoffs are utils (–4 if major error). |  
  | **Valparaíso & Robustness** | 6 | Argues Valparaíso undermines the claim: highlights proximity (few changes), robustness (determinate ∞), and fragility of standard EU. | Notes Valparaíso is "close" but lacks analysis of probability/finite changes; or misses dominance. | Treats Valparaíso as identical to Pasadena; or claims both have \(E[X] = \infty\) (–3 if misses dominance argument). |  
  | **Synthesis: Mutual Incompatibility** | 2 | Clearly concludes desiderata conflict: no invariant value for Pasadena blocks ranking. | Notes tension but lacks precision on why conflict arises. | Assumes desiderata are compatible; or omits synthesis (–2). |  
  | **Clarity & Structure** | 0 | Not applicable (embedded in above). | Not applicable. | Poor organization or exceeding word limit (penalize under other criteria). |  

  *Total: 12 + 10 + 6 + 2 = 30 marks.*  

