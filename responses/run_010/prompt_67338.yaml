answer: |-
  ### Pedagogical Architecture for Interpretations of Probability in Seismic Hazard Analysis

  #### Core Pedagogical Strategy
  The sequence leverages students' existing practices in probabilistic seismic hazard analysis (PSHA) as concrete anchors. Aleatory/epistemic splits and logic trees become gateways to interpretations—not endpoints. The formal calculus of probability is established as interpretation-neutral early to prevent conflating mathematical operations with metaphysical commitments. Crucially, calibration is decoupled from truth claims to show that empirical adequacy doesn’t resolve interpretation. The carrying example—a site-specific 50-year exceedance probability (e.g., 10% probability of PGA > 0.3g at Site X)—is reused under all three interpretations to demonstrate how the *same number* changes meaning. Pragmatism is honored by opening with a decision-centric challenge: *"If two models output 10% for different reasons, does it demand the same action?"*  

  #### 1. Order of Ideas and Dependencies
  **Prerequisites** (Must precede the three-way distinction):  
  - **Formal calculus is interpretation-neutral**: Why first? Students equate probability mathematics with frequency-based modeling. Showing that Bayes’ theorem or variance calculations work identically under all interpretations prevents dismissal of "belief" or "propensity" as mathematically invalid.  
  - **Calibration ≠ truth**: Why first? Engineers trust well-calibrated models, assuming calibration validates frequentism. Demonstrating that a Bayesian model (belief-based) can also be calibrated breaks this reflex and creates interpretive space.  

  **Dependency Argument**:  
  Without the neutrality of the calculus, students will reject degree of belief as "not rigorous" or propensity as "unscientific." Without decoupling calibration from truth, they’ll conclude frequentism is the only valid interpretation (e.g., *"If my model is calibrated, it must be frequentist"*). These are established in Session 1 before introducing interpretations.  

  **Session Split**:  
  - **Session 1 Goal**: Unpack the "why meaning matters" using their PSHA workflow, establish prerequisites, and introduce the three interpretations via the carrying example.  
  - **Session 2 Goal**: Show how logic trees secretly blend interpretations, and train students to reverse-engineer their hazard curves.  

  #### 2. The Carrying Example  
  **The Example**: 10% probability of PGA > 0.3g at a *specific urban site* (e.g., a hospital in Tokyo) in 50 years.  

  **Must Have**:  
  - A strained but plausible frequency story (50-year windows are non-repeatable, but historical/paleoseismic data allow frequency-like aggregation).  
  - Expert-elicited weights in its derivation (to force belief into view).  
  - Physical parameters (e.g., fault slip rate) that hint at propensity.  
  - High stakes (critical infrastructure) to amplify decision-making consequences.  

  **Must Lack**:  
  - Genuine repeatability (to prevent collapsing into pure frequentism).  
  - "Obvious" physical determinism (e.g., not a near-fault scenario where stress accumulation dominates).  
  - Purely statistical derivation (to ensure belief/propensity aren’t excluded).  

  **Re-Readings**:  
  - **Frequency**: "If we could replay 50-year sequences for this site under identical tectonic conditions, 10% of runs would exceed 0.3g."  
  - **Belief**: "Given our knowledge (including expert weights in logic trees), we assign 10% confidence that this *specific* site will exceed 0.3g by 2073."  
  - **Propensity**: "The fault system beneath this site has a physical disposition to produce 0.3g shaking in 10% of its possible states over 50 years."  

  **Foil Example**: Probability of a coin toss (used once, subordinate). Contrasts with the carrying example to show frequency’s limits: Coins *are* repeatable; tectonic systems aren’t.  

  #### 3. Misconception Map  
  | Misconception | Form in This Room | Defuse At Step | Defusing Move |
  |---------------|-------------------|----------------|--------------|
  | Hazard numbers are frequencies; the rest is philosophy. | "We use historical catalogs, so it’s obviously frequentist." | Step 3 (after introducing formal calculus) | **Question**: *"When you model a fault with no historical earthquakes, is your probability still a frequency? What is it a frequency *of*?"* |
  | The three interpretations are interchangeable vocabulary. | "It’s the same equation, so why does the label matter?" | Step 6 (first re-reading of carrying example) | **Distinction**: Draw three boxes labeled "Frequency," "Belief," "Propensity" with the *same* 10%. Ask: *"If new fault data arrives tomorrow, which box forces you to recompute the 10%?"* (Propensity demands it; belief might not). |
  | Subjectivism licenses arbitrary numbers. | "If belief is subjective, can’t I just make up weights?" | Step 8 (logic tree demo) | **Leverage their practice**: *"In your expert elicitation, do you let people assign 90% weight to a model contradicted by all data? Why not?"* → Beliefs are evidence-constrained. |
  | "Epistemic uncertainty" = degree of belief. | "Epistemic *is* the belief part in our models." | Step 7 (linking aleatory/epistemic to interpretations) | **Distinction**: Write: "Epistemic: uncertainty *about* a parameter. Belief: one way to *quantify* it. You can have epistemic uncertainty about a propensity (e.g., fault stress)." |
  | Propensity is disreputable metaphysics. | "Propensity sounds like astrology for faults." | Step 6 (propensity re-reading) | **Question**: *"When you use geodetic strain rates in your model, are you quantifying a physical property or a belief?"* → Propensity is operationalized in their code. |
  | Calibration proves frequentism. | "Our model is calibrated, so it’s frequentist." | Step 4 (calibration prerequisite) | **Move**: Show a toy Bayesian model (belief) that is well-calibrated. *"Calibration tests predictions, not interpretations."* |
  | **Added Misconception**: "Our curves are purely aleatory/epistemic." | "The hazard curve separates uncertainty types; interpretations map neatly." | Step 9 (mixing in logic trees) | **Move**: Annotate a logic tree: *"This branch uses frequency (Gutenberg-Richter), this one propensity (physics-based). Your weights are belief. The final curve blends all three."* |

  **Mischaracterization Note**: You underplayed "epistemic = belief." In this room, it’s a *category error* (epistemic is the *domain*, belief is the *tool*), not just a conflation.  

  #### 4. Understanding Check  
  **Question**: *"You publish a hazard curve showing 2% probability of PGA > 0.5g in 50 years for a site. Your model used expert weights for two rupture scenarios: one based on historical analogs (Scenario A), one on simulated fault physics (Scenario B). Which interpretation(s) does the 2% commit to, and where in your workflow do they appear?"*  
  - **Grasp Answer**: "The 2% mixes interpretations: Scenario A uses frequency (historical analogs), Scenario B uses propensity (fault physics), and the weights are belief. The final number is a belief-weighted blend of frequency and propensity."  
  - **Mimicry Answer**: "It’s epistemic because of the expert weights" (misses frequency/propensity in scenarios) or "All three are there" (fails to map to workflow).  

  #### 5. Omissions  
  | Left Out | Reason | Said Aloud As |
  |----------|--------|--------------|
  | von Mises’ collectives / infinite reference classes | Too abstract; pragmatists need finite, operational references. | *"We skip infinite ensembles—your models use finite catalogs and simulations, and that’s enough for our purposes."* |
  | Dutch books / representation theorems | Justifies coherence but doesn’t aid interpretation; wastes time on tangents. | *"We omit formal justifications for belief—what matters is that your expert weights already obey probability rules."* |
  | "Which interpretation is correct?" | Unresolved debate; goal is awareness of mixture, not resolution. | *"We won’t crown a ‘winner’—your hazard numbers use all three, and our job is to spot them."* |

  #### 6. Load-Bearing Risk  
  - **Where**: Step 9 (Session 2) when asserting that a single hazard curve blends frequency, belief, and propensity.  
  - **Why**: Students see aleatory/epistemic as exhaustive. Showing that "aleatory" splits into frequency/propensity—and that epistemic uncertainty applies to both—threatens their mental model.  
  - **Fallback**: Use their logic tree against them. Ask: *"In your tree, is the weight for a physics-based model a belief *about* a propensity? And is the historical branch a belief *about* a frequency?"* Then: *"So isn’t the output a belief-infused hybrid?"*  

