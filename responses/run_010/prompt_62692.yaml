answer: |-
  ### Bottom line
  Polybius offers a **descriptive taxonomy** of constitutions grounded in historical observation (especially Sparta), presents the mixed constitution as an **empirically validated ideal** for stability, and uses this framework to explain Rome's unprecedented success. The text is not a predictive dynamical model but a teleological classification system where definitions serve normative purposes. The "cycle" (anacyclosis) is a heuristic for historical patterns, not an immutable law. Rome's complexity defies prediction because it lacks precedents for decline, not because mixed constitutions are inherently unpredictable. "Natural" denotes spontaneous emergence, not stability, while "art" implies deliberate design. Definitions distinguish ideal types from degraded realities.

  ### What the passage is doing
  Polybius interrupts his narrative (6.1–2) to justify analyzing Rome's constitution, arguing it is the *primary cause* of its rise (6.2.9–10). He contrasts Rome’s unique complexity with unstable Greek city-states (6.3.1–3), introducing the mixed constitution (6.3.7) as the optimal form, validated by Sparta. Sections 6.4.2–9 define six constitutional types: three "good" (kingship, aristocracy, democracy) and three "vicious" (tyranny, oligarchy, mob-rule), linked in a natural degeneration sequence (anacyclosis). This taxonomy sets up his later analysis of Rome as a superior mixed system that resists this cycle. The immediate goal is to establish constitutional typology as the key to understanding historical outcomes.

  ### Gloss, sentence by sentence
  **[6.2.8–10]**: Asserts that studying "causes" (constitutions) enables wise political choice. The constitution is the "fountain-head" of all state actions/success. *Takes for granted* that constitutions are primary causal agents.  
  **[6.3.1–3]**: Claims Greek states’ volatility makes their past/future easy to analyze, but Rome’s intricate constitution and opaque social customs make prediction impossible. *Assumes* predictability requires observable historical patterns; Rome lacks comparators.  
  **[6.3.7]**: Declares the mixed constitution (blending monarchy, aristocracy, democracy) "best," citing Lycurgus’ Sparta as empirical proof. *Implies* theory requires historical validation.  
  **[6.4.2]**: Defines true "kingship" as voluntary, reason-based rule (vs. fear/force). *Posits* consent as a defining criterion.  
  **[6.4.5]**: Defines true "democracy" as majority rule within a framework of piety, law, and tradition. *Assumes* cultural norms constrain popular will.  
  **[6.4.6–9]**: Lists six constitutions: three "good" and their degenerate counterparts. States monarchy emerges "naturally"; kingship arises through corrective "art." Describes constitutional decay: monarchy→tyranny→aristocracy→oligarchy→democracy→mob-rule. *Assumes* an inherent cyclical degradation process.

  ### Question 1: Foretellability
  Polybius emphasizes Rome’s uniqueness: its constitution is *novel* in complexity ("complicated character," 6.3.3) and its social norms are undocumented ("ignorance of... private life," 6.3.3). Greek states are predictable *because* their repetitive volatility provides data for extrapolation. The mixed constitution *is* governed by the same cyclical rule (6.3.7 notes Sparta’s eventual decline), but Rome is exceptional because its mixed system is more robust and its historical trajectory is singular. The barrier is **evidentiary**: Rome hasn’t declined, so no prior case confirms how its specific blend decays. The wording supports this reading: "owing to the complicated character" and "ignorance" (6.3.3) stress lack of data, not a different ontology. The difference matters because Polybius later argues Rome’s *specific* mixture (consuls/Senate/people) delays the cycle, not that mixed systems escape it altogether.

  ### Question 2: Nature, art, and Lycurgus
  "Natural" (φύσει) monarchy emerges spontaneously from human needs (e.g., primitive tribes following strong leaders). "Art" (τέχνῃ) signifies deliberate institutional craftsmanship to fix flaws—kingship is monarchy *improved* by human reason. Lycurgus provides an **existence proof**: he designed Sparta’s mixed system, which endured longer than simple constitutions, validating the theory empirically. The passage *does not* license a stability distinction between "natural" and "artificial" forms. Sparta’s longevity (6.3.7: "actual experience") shows artificial designs *enhance* stability. "Art" implies rational intervention, not fragility; Polybius sees it as corrective, not destabilizing. Your "maintained equilibrium" idea is a modern projection: for Polybius, Sparta’s decline proves no system is eternal, but its artificial origin made it *more* durable, not less.

  ### Question 3: Definition or diagnosis
  The criteria are **normative definitions**: kingship *is* rule by consent/reason; democracy *is* culturally bounded majority rule. Degenerate forms (tyranny, mob-rule) are *constitutionally distinct*, not intensified versions. Tyranny replaces consent with fear (6.4.2), mob-rule abandons tradition (6.4.5). The sequence (6.4.7–9) blends deduction (good forms inevitably decay into their opposites) and historical observation (Greek experiences). It follows from the definitions: if a king becomes oppressive, it ceases being kingship and becomes tyranny. This makes the typology **immune to falsification**—any failed "democracy" was never truly democratic. Chance (*tyche*) is acknowledged elsewhere by Polybius but is subordinated here to constitutional causality ("chief cause," 6.2.9). The "fountain-head" metaphor allows for chance events (e.g., wars, natural disasters) but positions the constitution as the *primary* determinant of resilience against them.

  ### Where my gloss overreaches
  1. **"Regular process"**: You treat anacyclosis as a dynamical rule, but Polybius presents it as a *common* historical tendency, not an invariant law. His focus is teleological (classifying states) not predictive modeling.  
  2. **"Artificial = maintained equilibrium"**: The text frames "art" as corrective design, not ongoing maintenance. Sparta’s stability is inherent in its structure, not active control.  
  3. **"Mixed constitution as different object"**: Polybius sees it as a *refined* version within the same framework (6.3.7), not a distinct dynamical class.  
  4. **"Consent replaced by fear"**: This is accurate for monarchy→tyranny, but mob-rule (6.4.5) involves institutional collapse, not mere intensification.  
  5. **"Chance vs. fountain-head"**: Polybius integrates chance elsewhere (e.g., *Histories* 1.4), but here subordinates it to constitutional primacy for rhetorical emphasis on Rome’s exceptionalism.
