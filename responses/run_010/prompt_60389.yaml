  Ground rules: he never breaks character, so no "obviously it's really just one thing" asides and no winking at the reader; and don't name a single philosopher, book, or -ism anywhere in the document — someone who knows the literature should recognise it purely from the positions being handled correctly, while someone who's never heard of any of it should still enjoy it as workplace bureaucracy gone weird. Also, if there's any place where the two-objects view makes his own procedures inconsistent (say, weighing one but not the other), let that show through as an unreconciled line item rather than explaining it.

