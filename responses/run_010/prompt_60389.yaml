  **SAFETY DATA SHEET**  
  *According to the Globally Harmonized System of Classification and Labelling of Chemicals (GHS)*  

  **SECTION 1: IDENTIFICATION**  
  **Product Identifier:** PLASTICINE-TYPE BODY, WET, ~7 kg, ACCESSION #1994.117  
  **Other Means of Identification:**  
  - Lump (Material): ACCESSION #1994.117-M  
  - Piece (Artwork): ACCESSION #1994.117-F  
  **Recommended Use:** Sculptural medium (Lump); Art display (Piece).  
  **Supplier:** Sculpture Studio Storeroom, 123 Artisan Lane.  
  **Emergency Contact:** Studio Safety Officer (ext. 45).  

  **SECTION 2: HAZARD(S) IDENTIFICATION**  
  **Classification:**  
  - Physical Hazard: Co-located object conflict (Category 1)  
  - Handling Hazard: Dual-object entanglement (Category 2)  
  **Hazard Statements:**  
  - H280: Two distinct objects occupy identical volume; risk of misapplication of handling protocols.  
  - H281: Lump vulnerable to mass depletion; Piece vulnerable to deformation.  
  - H282: Dropped objects may damage one entity without affecting the other; incident reporting ambiguous.  
  **Precautionary Statements:**  
  - P301+P310: IF Lump mass is altered: Immediately cease operations. Notify records.  
  - P308+P313: IF Piece form is altered: Isolate area. Seek conservator evaluation.  
  - P333: Report spatial coincidence anomalies to safety officer.  

  **SECTION 3: COMPOSITION/INFORMATION ON INGREDIENTS**  
  **Lump (Material):**  
  - Clay minerals: 40-60%  
  - Water: 20-30%  
  - Plasticizers (glycerol): 10-20%  
  - Pigments (iron oxide): 5-10%  
  **Piece (Artwork):**  
  - No chemical constituents. Defined by structural configuration only.  

  **SECTION 4: FIRST-AID MEASURES**  
  **Inhalation:** Not applicable (non-volatile).  
  **Skin Contact:** Wash with water.  
  **Eye Contact:** Rinse cautiously.  
  **Piece-Specific First Aid:**  
  - Minor damage (e.g., chipped finger): Apply precision adhesive to Lump substrate.  
  - Major damage (e.g., flattening): No remediation possible. Log as "irreversible form collapse."  
  **Note:** First aid for Piece targets substrate integrity; biological protocols irrelevant.  

  **SECTION 5: FIRE-FIGHTING MEASURES**  
  **Extinguishing Media:** Water spray, CO₂, dry chemical.  
  **Hazards from Fire:**  
  - Lump: May harden; mass conserved.  
  - Piece: Form destroyed at >100°C (loss of plasticity).  
  **Special Procedures:** Salvage Piece first if structurally intact; prioritize form preservation.  

  **SECTION 6: ACCIDENTAL RELEASE MEASURES**  
  **Personal Precautions:** Isolate zone. Wear gloves to avoid cross-contamination.  
  **Environmental Precautions:** Contain material spillage (Lump only).  
  **Clean-up:**  
  - Collect dispersed material (Lump mass must total ~7 kg).  
  - Assess Piece status: If deformed beyond recognition, log as "release-induced form termination."  

  **SECTION 7: HANDLING AND STORAGE**  
  **Handling:**  
  - Support Piece without compressing Lump.  
  - Do not remove material (violates Lump conservation).  
  **Storage:**  
  - Temperature: 15-25°C.  
  - Humidity: 40-60% RH.  
  - **Plinth Specifications:** Rated for one (1) object max. Co-location constitutes overload; reinforce plinth if storing both.  
  - Segregate from sharp tools to prevent accidental form alteration.  

  **SECTION 8: EXPOSURE CONTROLS/PERSONAL PROTECTION**  
  **Engineering Controls:** Ventilation not required.  
  **Personal Protection:**  
  - Gloves (nitrile) to prevent mass transfer.  
  - Eye protection (splash goggles) during handling.  
  **Exposure Limits:** N/A (non-toxic).  

  **SECTION 9: PHYSICAL AND CHEMICAL PROPERTIES**  
  **Lump (Material):**  
  - Appearance: Pliable, homogeneous mass.  
  - Odor: Earthy.  
  - Mass: 7.00 kg ± 0.01 kg (calibrated quarterly).  
  - Density: 1.8 g/cm³.  
  **Piece (Artwork):**  
  - Appearance: Humanoid figure (as of 2023-05-15 audit).  
  - Mass: Not quantifiable (non-material entity).  
  - Stability: Compromised if height/width ratio exceeds 0.3.  

  **SECTION 10: STABILITY AND REACTIVITY**  
  **Chemical Stability:** Lump stable; Piece stable only under isometric conditions.  
  **Conditions to Avoid:**  
  - Mechanical stress (e.g., impacts, compression).  
  - Mass extraction (Lump hazard).  
  - Asymmetric forces (Piece hazard).  
  **Incompatible Materials:** Shelving boards, hammers, rollers.  

  **SECTION 11: TOXICOLOGICAL INFORMATION**  
  **Lump:** LD50 >5000 mg/kg (oral, rat). Non-carcinogenic.  
  **Piece:** No toxicological data (non-biological).  

  **SECTION 12: ECOLOGICAL INFORMATION**  
  **Lump:** Biodegradable; low environmental risk.  
  **Piece:** No ecological impact (non-physical entity).  

  **SECTION 13: DISPOSAL CONSIDERATIONS**  
  **Lump:** Landfill acceptable per local regulations.  
  **Piece:**  
  - **DO NOT DISPOSE.** Requires formal deaccessioning.  
  - If Piece is intentionally destroyed (e.g., flattening), residue is Lump only.  
  - Post-disposal: Lump retains ACCESSION #1994.117-M; Piece status: "retired."  

  **SECTION 14: TRANSPORT INFORMATION**  
  **DOT/IMO:** Not regulated.  
  **Studio Transport:**  
  - Label as "DUAL-OBJECT CONSIGNMENT."  
  - Crate must immobilize Piece without constraining Lump plasticity.  
  - Mass verification pre-/post-transport (Lump only).  

  **SECTION 15: REGULATORY INFORMATION**  
  **OSHA Status:** Exempt (art studio exemption).  
  **Internal Compliance:**  
  - Accident logs must specify affected entity (Lump or Piece).  
  - One incident (e.g., dropped board) may require two log entries if both entities damaged.  

  **SECTION 16: OTHER INFORMATION**  
  **Revision:** 3.1 (2024-04-12).  
  **Revisions:**  
  - Ver. 2.0 (2023-11-30): Added Piece-specific disposal protocols.  
  - Ver. 1.0 (2023-01-15): **WITHDRAWN.** Incorrectly treated Lump and Piece as single entity. Audit revealed dual-object occupancy.  
  **Disclaimer:** Storage of co-located objects necessitates dual inventory tracking. Failure to distinguish entities may compromise safety compliance.  

