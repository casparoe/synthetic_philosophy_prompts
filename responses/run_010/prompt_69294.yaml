answer: |-
  My verdict is this: your proposed test—discarding preferences that would not persist if the other’s choice were undetectable—successfully resolves the piano paradox without cheating, but it cannot be elevated to a universal rule for determining which preferences "count" in collective decisions without encountering serious problems, particularly with moral commitments like promises. Your insight into the nature of the conflict is profound and identifies the core issue of interdependent preferences corrupting individual rights. However, the very counterexample you anticipate—your brother’s promise—reveals the limits of applying this test broadly. The manoeuvre works beautifully for your piano case precisely because the preferences involved are purely *instrumental* and *externality-based*, not *intrinsic* or *moral*.

  Let us dissect the piano dilemma first. You and your neighbour each possess a right: the unilateral authority to decide whether *you yourself* play the piano in the evening. Your preference ordering is: 1. Neighbour plays (best), 2. You play (good), 3. Silence (worst). His ordering is: 1. Silence (best), 2. He plays (acceptable), 3. You play (worst). Respecting individual rights leads to the following: You, preferring to play over silence, play. He, preferring silence over *you* playing but preferring *his own playing* over silence, also plays to block your inferior performance. The outcome is mutual playing, ranked second-worst by you (you'd prefer *him* playing alone) and worst by him (he craves silence). Both prefer *his* playing alone to this mutual cacophony. The rights, intended to empower individual choice, have locked you into a suboptimal state because your preferences hinge not just on your own action, but intensely on your neighbour's.

  Your diagnosis is correct: the damage stems from preferences about the *other’s choice*. You care profoundly about whether *he* plays; he cares profoundly (and negatively) about whether *you* play. These are preferences about controlling or reacting to the other’s domain, not just one's own. Your proposed secrecy test targets this interdependence: if the other’s decision were made in secret and left no trace, would your preference persist? Your preference for *his* playing vanishes under secrecy – you couldn’t enjoy it if you couldn’t hear it. His preference for *silence over your playing* also vanishes under secrecy – if he couldn’t detect your playing, he wouldn’t mind it. Crucially, the preferences that *do* survive secrecy are the core individual choices: *you* prefer playing to not playing, regardless of his undetectable actions. *He* prefers not playing to playing *if* silence is an option, but crucially, if silence isn't guaranteed (because *you* might play undetectably), his preference for *him* playing over *you* playing disappears under secrecy – he wouldn’t know who was playing! Only his preference for *his* playing over silence (if silence were the alternative) might persist, but the secrecy test fundamentally disrupts the interdependent rankings that caused the conflict. Applying the test discards the problematic, interdependent preferences. We’re left only with your preference to play and his preference *not* to play *if silence is achievable*, but without the harmful cross-house obsessions. The rights can now function without generating the perverse outcome.

  So far, so good. The manoeuvre dissolves the paradox cleanly. It isolates the purely self-regarding core of the preferences relevant to exercising the right – *your* desire to make music, *his* desire for quiet in his own home – while neutralizing the mutual meddling. It reveals the conflict wasn't inherent in the rights themselves, but in how preferences about the *other's* exercise of *their* right poisoned the well.

  Now, the objection you wisely anticipate: the brother's promise. You would want your brother to keep his promise to you, even if he broke it in absolute secrecy and you never detected it. Applying your secrecy test would discard this preference – if you couldn't possibly know, your desire for him to keep *that specific promise* wouldn't persist (you might desire him to be generally trustworthy, but that's different). Yet, we feel strongly that this preference *should* count; breaking a promise is wrong *in itself*, regardless of detection. This seems to sink the secrecy test as a general principle.

  Here's why it doesn't invalidate the test for the *piano case*, though it prevents the test from being a universal rule. The difference lies in the *nature* of the preferences:

  1.  **Piano Preferences are Instrumental & Externality-Based:** Your desire for your neighbour to play stems solely from the *pleasurable sound* you experience. If you can't experience the sound (due to secrecy), the preference has no object; it logically disappears. His aversion to *your* playing stems solely from the *unpleasant sound* he experiences. Remove the sound (secrecy), remove the aversion. These preferences are contingent on the direct, sensory impact (the externality) of the other's action. They are preferences *about the state of the world caused by the other's choice* (sound vs. silence), not about the choice itself as an abstract exercise of will.
  2.  **Promise Preferences are Intrinsic & Moral:** Your desire for your brother to keep his promise isn't primarily about avoiding a detectable negative consequence for yourself (though that might exist). It's about upholding a moral principle – fidelity, trust, the inherent value of a commitment. You value the *act of keeping the promise* itself, independently of your knowledge of it. The wrongness of breaking the promise exists even in secret. This preference is about the *moral quality of the brother's action*, not just its direct, detectable effect on you. It's an intrinsic value judgment.

  The secrecy test brilliantly filters out preferences that are *only about the detectable consequences* of another's choice within one's own sphere (the externalities). This is exactly what was corrupting the piano rights. It does not, and should not, filter out preferences based on intrinsic values or moral principles concerning the actions of others, even when those actions have no detectable consequence. The brother's promise falls into this latter category.

  Therefore, your manoeuvre is legitimate for resolving conflicts like the piano case, where the problematic preferences are purely about the sensory or material externalities imposed by the other's exercise of their right. It isolates the self-regarding core relevant to the individual right. However, it is not a cheat *nor* a comprehensive theory of which preferences should count in all collective reckonings. It is a specific tool effective against a specific problem: interdependent preferences based on externalities corrupting individual rights. It fails when applied to preferences grounded in intrinsic moral values about others' actions, as the brother example demonstrates. Your version captures the essence of the problem identified by economists studying externalities and social choice (hinting at Coasean bargaining and the problems of non-separable preferences), but your focus on the *epistemological* filter (secrecy) is a particularly elegant and insightful formulation for diagnosing the specific poison in this rights paradox. The departure from pure economic models is your emphasis on the *knowledge condition* as the key to dissolving the interdependence. Your instinct about the "preference about somebody else's choice" being the culprit was precisely on point.
