answer: |-
  This EU ban (Gender Directive 2012) is a fascinating case study in the collision of actuarial science, anti-discrimination law, ethics, and social policy. Your friend's "incoherence" charge is common, but the practice *can* be coherently justified, though it rests on specific normative foundations, not pure statistical logic. Let's break it down:

  **The Core Justification: Anti-Discrimination & Social Justice**

  The ban on sex/gender rating **presupposes that sex is a *protected characteristic* in a way that age, postcode, occupation, or claims history are not.** This distinction isn't primarily about statistics; it's about ethics, law, and social harm:

  1.  **The "Wrong" is in the *Type* of Classification & Potential Harm:**
      *   **Historical & Systemic Discrimination:** Sex/gender has been a primary axis of systemic discrimination, oppression, and social inequality for centuries. Using it as a basis for pricing financial products risks perpetuating or reinforcing this discrimination, even if statistically valid for risk pools. The harm isn't just financial; it's symbolic and societal.
      *   **Suspect Classification:** In law and ethics, classifications based on innate characteristics like sex, race, or ethnicity are often considered "suspect" or require heightened scrutiny because they:
          *   Target immutable traits (largely true for sex, though gender identity complicates this).
          *   Define discrete and insular minority groups (though women aren't a minority, they have faced systemic disadvantage).
          *   Are often irrelevant to individual merit or capability in many contexts.
          *   **Crucially:** Classification *itself* can be harmful when based on traits tied to historical oppression, regardless of intent or statistical backing. Pricing based on postcode, while potentially correlated with race/income, doesn't explicitly classify *on* the protected characteristic itself, offering legal & pragmatic cover.
      *   **Social Policy Goal:** The ban reflects a societal decision that equality between men and women in access to goods/services outweighs the potential efficiency loss of slightly less precise risk pooling in *this specific market*. It's a form of market regulation for social ends.

  2.  **Addressing "Unchosen" Traits vs. "Control":**
      *   Your point about age is sharp. Age *is* largely immutable. The distinction here often leans on:
          *   **Universality & Predictability:** Everyone ages predictably. Everyone will be young, middle-aged, and old. The "burden" of age-based pricing rotates throughout a lifetime in a way sex-based pricing does not. A man will always pay the "man" rate; a young person will eventually pay the "old person" rate.
          *   **Social Contract/Insurance Function:** Insurance fundamentally relies on cross-subsidization across risk pools. Age-based pricing is often seen as a core, acceptable mechanism for this in products like life insurance or annuities, reflecting the inherent biological reality of aging that *everyone* experiences sequentially. Sex-based differences aren't experienced sequentially by individuals.
      *   **Postcode/Occupation/Claims History:** These involve elements of choice (where you choose to live/work) or consequence (your driving record reflects *your* actions). While choice is constrained (you can't always afford to move; jobs are limited), the *degree* of agency is seen as higher than for sex or age. Claims history is the most individualistic factor allowed. The *act of classification* based on choices/consequences is seen as less inherently problematic than classification based solely on an innate group identity linked to historical discrimination.

  3.  **The "You" Problem & Reference Classes:**
      *   The practice **does not presuppose pricing "you as an individual" exists in a pure actuarial sense.** Actuaries know everyone is priced within reference classes. The ban accepts this reality but says: **"While we must use reference classes, certain axes for defining those classes are socially unacceptable due to their link to systemic discrimination, even if statistically predictive."** It's a constraint on *which* reference classes are permissible, not an illusion that pure individual pricing is possible. The "wrong" isn't classification *per se*, but classification *on specific, protected grounds*.

  **What the Practice Requires vs. What Fits Comfortably:**

  *   **Strictly Required:** A legal prohibition on using sex/gender as a *direct* rating factor in calculating premiums or payouts for new contracts after December 21, 2012.
  *   **Fits Comfortably:**
      *   **Anti-Discrimination Principle:** The view that using protected characteristics (sex, race, etc.) for pricing is inherently wrong or harmful, regardless of statistical validity.
      *   **Social Justice Goal:** The aim to remove explicit gender-based financial disadvantage in insurance markets.
      *   **Formal Equality:** Treating men and women identically in this specific pricing context.
      *   **Pragmatism:** Acceptance that other factors (postcode, occupation) will capture *some* correlated risk variance, but this is a tolerable trade-off to avoid explicit sex-based classification.

  **Does the Ban Change Anything? When Does It Do "Real Work"?**

  1.  **Surface Level Impact:** As you suspected, if risk correlates strongly with sex (e.g., young men in car insurance, women in annuities), insurers will seek proxies. Postcode, car type, driving history, occupation, credit score (where allowed) *will* absorb much of the variance previously explained by sex. Premium differences *between* men and women *with otherwise identical risk profiles* disappear, but the *overall premium structure* might shift, potentially raising premiums for some low-risk men and lowering them for some high-risk women within those proxy groups. **The *direct* correlation between sex and premium is broken.**
  2.  **When It Does "Real Work":**
      *   **Eliminating Explicit Classification:** It removes the *labeling* and explicit financial penalty/benefit based solely on sex. This has normative and psychological significance.
      *   **Forcing Better Models:** It compels insurers to find *better*, potentially more individualized or nuanced predictors of risk beyond a blunt sex binary. *Ideally*, this could lead to fairer outcomes for individuals who deviate from their sex-based group average (e.g., a very safe young male driver might benefit relative to the old system).
      *   **Preventing Worst-Case Proxies:** While proxies absorb risk, a *complete ban on sex* prevents insurers from using an *extremely efficient but socially unacceptable* predictor. It forces them to use less efficient or more complex (and hopefully less discriminatory) models.
      *   **Symbolic & Legal Impact:** It reinforces the principle that sex-based discrimination is unacceptable in core markets, setting a precedent.
  3.  **When Its Impact is Muted:**
      *   When proxies like postcode or occupation are *highly effective* substitutes and strongly correlate with *both* risk and sex.
      *   When the underlying risk variance explained by sex is small or easily absorbed.
      *   When social inequalities (income, geography) driving risk differences remain unaddressed – the ban tackles the *insurance symptom*, not the *root cause* of why risk profiles might differ by sex on average.

  **Theories Your Friend Might Accept:**

  1.  **Anti-Caste Principle / Social Meaning:** Classification based on historically oppressed groups (like sex, race) has a harmful social meaning and reinforces caste-like distinctions, even when statistically accurate. Classification based on geography or job lacks this same deeply harmful historical and social baggage, even if correlated. The *act* of classifying on sex *itself* is the wrong.
  2.  **Pragmatic Anti-Discrimination Law:** Legal systems focus on prohibiting discrimination based on *specific enumerated protected characteristics* (sex, race, religion, etc.). Postcode isn't a protected characteristic, even if it correlates with protected classes. The ban is a targeted legal tool within this framework, not a universal statement on all classification.
  3.  **Information Forcing / Efficiency (Potential Friendlier Angle):** Banning a cheap, blunt predictor (sex) forces insurers to invest in finding *better*, more individualized predictors (telematics, detailed driving history, health screenings where allowed). This *could*, in theory, lead to more accurate risk assessment overall, benefiting individuals who defy group averages. (Though empirically, the efficiency loss is usually the main concern).

  **In Conclusion:**

  The EU ban is **not incoherent**, but it **is normative**. It prioritizes the social goal of eliminating explicit sex-based discrimination in insurance pricing over pure actuarial efficiency. It draws a line based on the **protected status of sex as a characteristic linked to historical systemic disadvantage**. It accepts that pricing requires classification but deems classification on *this specific axis* unacceptable due to its social meaning and potential for harm, even if statistically valid. While proxies mitigate its practical impact, the ban does meaningful work by removing the explicit link and forcing models to move beyond a crude binary predictor, driven by a societal judgment about fairness that transcends pure statistics. The "you" it protects is the individual's right not to be financially categorized based solely on a protected characteristic like sex, even while acknowledging they must be categorized in other ways for insurance to function.
