prompt: |-
  so im a junior and i got way too deep into Malthus for a history paper and now i have a question that's not really about Malthus anymore, it's about a pattern i keep seeing and dont have a word for.

  the setup: Malthus says population grows geometrically, food grows arithmetically, so you get famine and misery as a permanent feature. that obviously didn't play out in England — yields went up like crazy, and he kept rewriting the book, six editions over ~30 years, each one soaking up whatever the critics threw at it (and i think later on he leans way harder on people just choosing to marry late). but basically everyone, even people who think he was wrong, says some version of "he was right about the mechanism, he was just early."

  and then i noticed the exact same move all over the place. peak oil. the population bomb — Ehrlich literally lost a public bet about metal prices over ten years and then said he'd happily make the same bet over a longer stretch. robots taking all the jobs, AI timelines, whatever. the prediction has a rough date attached, the date passes, nothing happens, but the causal story is still sort of running underneath, so the theory gets scored as a near-miss instead of a miss.

  what i want a name for isnt just "the prediction failed." it's the scoring rule, and i think it has like three parts:

  1. mechanism and timing get graded separately, and only the mechanism grade counts. if the causal story still looks true, the blown date is written off. but flip it — something happens right on schedule for reasons that had nothing to do with the theory — and everyone calls that a failure. so we say prediction is the whole point of the theory and then we grade the theory on something else.
  2. the thing that saves it is always an offsetting factor that only gets identified *after* the failure. technology, trade, institutions, substitution, prices. there's always a candidate sitting around, and the theory never said in advance how big that factor would have to be to count as a refutation. so it feels like the theory literally cant lose on timing.
  3. being right about the past gets cashed in as credit for the future. Malthus was pretty correct about basically all of human history up to his own lifetime, and that retro-credit is what makes "right about then, wrong about now" come out as "right, just early" instead of "wrong."

  but heres the thing that makes me think its not just one obvious bad-habit name: sometimes the identical-looking verdict is completely legit. guy says continents move, everyone asks what force could possibly do that, he has no good answer, gets destroyed, then fifty years later the mechanism turns up and he's a hero. nobody calls that an excuse. so there's a real version and a fake version and i want to know where the line is, not just which bucket Malthus goes in.

  things ive heard that feel adjacent but not it: ad hoc, moving the goalposts, unfalsifiable, self-sealing, and "right for the wrong reasons" / a stopped clock being right twice. i know Popper and the whole auxiliary-assumption debate is in this neighborhood but that seems to be about one-off patches, whereas this is a standing policy about how to score dated predictions.

  so: what are the closest established concepts, and for each one exactly which piece of my description does it miss? if nothing fits all three parts, tell me that plainly and then coin something — with a definition and boundary conditions, and at least one case that *looks* like it but isn't (Wegener is my guess but i could be wrong). i dont want just a label, i want the carving. and be honest about your confidence: if youre not sure whether one of these terms is actually used the way im assuming, say that instead of sounding certain. also if you think my premise is confused — like if the three parts are really just one thing dressed up, or if part 1 is actually backwards — say so straight up rather than playing along with me.
reasoning: |-
  Okay, the user has presented a fascinating intellectual puzzle. They've identified a recurring pattern in how certain failed predictions are evaluated - specifically the tendency to dismiss timing failures while preserving credibility for the underlying mechanism. The challenge is to find or create the precise conceptual label for this evaluation pattern.

  Hmm, the user clearly wants rigorous analysis, not just a simple label. They've articulated three key characteristics: the separate grading of mechanism vs timing, the post-hoc identification of offsetting factors, and the retroactive application of historical credibility. This is sophisticated observation - reminds me of how scientific theories evolve through Lakatos' research programs.

  Let me think about existing concepts first. "Moving the goalposts" captures some aspects but doesn't address the temporal credit aspect. "Ad hoc hypothesis" explains the offsetting factors but misses the separate grading. "Unfalsifiability" is too broad. The user already knows these adjacent terms and finds them insufficient.

  The continental drift example is crucial - it shows the legitimate version where mechanism validation redeems a theory. The difference seems to be whether the offsetting factor is independently testable and whether it was conceivable within the original framework. For Malthus, "preventative checks" were always part of his theory, whereas Wegener had no mechanism at all.

  I recall Lakatos' concept of "degenerating research programmes" actually fits remarkably well. It explains all three points: auxiliary hypotheses protecting the core (1), novel facts being predicted only post-hoc (2), and progressive vs degenerative shifts (3). The key test is whether offsetting factors yield new predictions.

  For boundary cases, the Ehrlich-Simon bet demonstrates when "longer timeframe" claims become unscientific - when no testable threshold is specified. Whereas climate change models avoid this by making quantified, testable projections about feedback systems.

  The user might appreciate coining "temporal discounting of falsification" to emphasize the special treatment of timing failures. But honestly, Lakatos' framework already exists and fits beautifully. The continental drift case naturally fits as the progressive counterpart to Malthus' degenerative program.

  This user is clearly comfortable with philosophy of science - no need to oversimplify. I should present Lakatos clearly, note where it matches their three points exactly, then show how it cleanly distinguishes the continental drift case through the concept of novel predictions. That gives them both the conceptual toolbox and the boundary conditions they requested.
answer: |-
  You've hit on a profound and frustrating pattern in how we evaluate predictive theories. Your three-part description is sharp, and the distinction between "legit" redemption (like Wegener) and "illegit" persistence (like Malthusianism or Peak Oil) is crucial. Existing concepts *almost* fit but miss key nuances. Here's the carving:

  **Closest Established Concepts & Their Shortcomings:**

  1.  **Ad Hoc Hypothesis (Popper):**
      *   **What it is:** Adding an auxiliary assumption *after* a failed prediction to protect the core theory from falsification.
      *   **Where it fits:** Your Part 2 (post-hoc offsetting factors like tech/substitution).
      *   **Where it misses:** It doesn't inherently address Part 1 (separate grading of mechanism/timing) or Part 3 (retro-credit). An ad hoc hypothesis *can* be legitimate if it leads to *novel predictions*, which is key to the Wegener vs. Malthus distinction. Popper focuses on the "patch" itself, not the temporal evaluation policy.

  2.  **Degenerating Research Programme (Lakatos):**
      *   **What it is:** (Lakatos refines Popper). A scientific programme where the "protective belt" of auxiliary hypotheses is constantly patched *post-hoc* to save the "hard core" theory, but these patches *fail to predict novel facts*. The programme stagnates.
      *   **Where it fits:** Excellent fit for **Part 2** (post-hoc offsets) and captures the *persistence* despite failures. Strongly implies **Part 1** – the core mechanism is protected while anomalies (like blown timing) are explained away. Touches on **Part 3** indirectly; past success might be why it persists, but Lakatos focuses on *future* predictive stagnation.
      *   **Where it misses:** Doesn't explicitly name the *temporal discounting* of failed timing predictions as a *distinct scoring rule*. While it describes the *outcome* (persistence without progress), it doesn't single out "timing failure gets a pass" as the specific mechanism of persistence like you do. It's more holistic.

  3.  **Unfalsifiability (Popper):**
      *   **What it is:** A theory that cannot be empirically disproven. If *no* conceivable observation could refute it, it's unscientific.
      *   **Where it fits:** Captures the *outcome* you describe – theories that never seem to lose. Implied by Part 2 (no defined threshold for offsetting factors).
      *   **Where it misses:** Too blunt. Malthusianism *did* make falsifiable claims (e.g., specific famines predicted by population growth), which *were* falsified. The issue isn't that the *core idea* (scarcity exists) is unfalsifiable, but that the *predictive model incorporating timing* becomes slippery due to the scoring rule you identify. Wegener's theory *was* falsifiable (and initially considered falsified!) because the lack of mechanism was a valid criticism *until* one was found. The "scoring rule" makes the theory *effectively* unfalsifiable *on timing*, but not inherently so.

  4.  **Moving the Goalposts:**
      *   **What it is:** Changing the criteria for success after the fact to claim victory.
      *   **Where it fits:** Part 1 (dismissing timing failure) and Part 2 (redefining what counts as "offsetting").
      *   **Where it misses:** Primarily a rhetorical fallacy. It describes the *act* of changing criteria but doesn't capture the underlying *structure* of the theory (mechanism vs. timing) or the role of retro-credit (Part 3). It also implies bad faith, whereas adherents often sincerely believe the mechanism is paramount.

  5.  **Zombie Theory/Concept:**
      *   **What it is:** An idea that persists despite being repeatedly refuted or lacking empirical support.
      *   **Where it fits:** Describes the *end result* of your pattern.
      *   **Where it misses:** Doesn't explain *why* it persists. Your three-part scoring rule *explains* the zombification mechanism specific to dated predictions with a core mechanism.

  **The Gap & A Proposed Concept:**

  No single established term perfectly encapsulates your three-part *scoring rule* – the systematic policy of discounting timing failures while prioritizing mechanism, enabled by post-hoc offsets and retro-credit. Lakatos' "Degenerating Research Programme" comes closest but doesn't explicitly name the *temporal discounting* as the core engine.

  **Proposed Concept: Temporal Discounting of Falsification (TDF)**

  *   **Definition:** An evaluative framework applied to theories making dated predictions, characterized by:
      1.  **Mechanism Primacy:** The underlying causal mechanism is prioritized as the core of the theory's validity. Failure of a specific *timing* prediction is deemed less significant than the perceived ongoing operation of the mechanism.
      2.  **Post-Hoc Offset Accommodation:** The theory readily incorporates the identification of unforeseen or underestimated countervailing factors (technology, substitution, institutional change, prices) *after* a timing failure occurs, without requiring these factors to be quantitatively specified or bounded *in advance* within the model.
      3.  **Retroactive Credit Application:** The theory's demonstrated ability to explain *past* events is leveraged as evidence that its core mechanism remains fundamentally sound and its *future* predictions (on an indefinite timeline) should still be heeded, despite specific timing failures.
  *   **Boundary Conditions:**
      *   Applies specifically to theories making *dated predictions* about complex systems (society, environment, economy, technology).
      *   Requires a plausible, separable core *mechanism* whose operation can be argued to persist independently of specific timing.
      *   Distinct from simple "ad hoc" saving because it's a *systematic, recurring pattern* of evaluation within a domain, not just a one-off patch.
  *   **Why "Discounting"?** It evokes the economic concept of valuing present outcomes more than future ones, but inverted: here, the *present failure* (timing miss) is discounted in value relative to the perceived *future threat* based on the mechanism and past evidence.
  *   **The Wegener Test Case (Legitimate Redemption):**
      *   **Apparent Similarity:** Theory failed (no mechanism), persisted in obscurity, then was redeemed.
      *   **Why it DOESN'T fit TDF:**
          *   **No Timing Prediction:** Wegener didn't make dated predictions about continental movement speeds or future positions; he described a past/present phenomenon lacking an explanation. The failure was about the *mechanism itself*, not its *timing*.
          *   **No Post-Hoc Offset:** Plate tectonics wasn't an "offsetting factor" identified to save the theory; it was the *actual mechanism* that validated the core observation. It solved the fundamental problem.
          *   **Novel Predictions:** Plate tectonics generated *novel*, testable predictions (seafloor spreading, magnetic stripes, subduction zones, specific earthquake/volcano patterns) that were confirmed. This is the hallmark of Lakatos' *progressive* research programme. TDF theories typically *avoid* making risky novel predictions about the *size* or *limits* of offsetting factors or future timing.
  *   **Malthus/Ehrlich/Peak Oil (TDF Exemplars):**
      *   **Part 1:** "Malthus was right *about the mechanism*, just wrong *on timing* due to X." Mechanism primacy.
      *   **Part 2:** Technology (Green Revolution), substitution (synthetics), price signals, institutional change (family planning) identified *after* predictions failed.
      *   **Part 3:** "It worked for millennia! How can you ignore that?" Retro-credit applied to future indefinite warnings.
      *   **Lack of Novel Prediction Post-Failure:** TDF adherents rarely specify *how much* technological progress or substitution is needed to definitively refute the core threat, or offer falsifiable predictions about *when* the mechanism will *finally* overwhelm offsets. The threat horizon just recedes.

  **Conclusion & Confidence:**

  *   **Premise:** Your premise is not confused; you've identified a distinct and significant pattern in the epistemology of prediction. Your three parts are interconnected but distinct facets of this evaluation strategy. Part 1 (grading separation) is the core evaluative *act*, Part 2 (post-hoc offsets) is the primary *tool* enabling it, and Part 3 (retro-credit) is the *psychological/epistemic foundation* lending it weight.
  *   **Established Concepts:** "Degenerating Research Programme" (Lakatos) is the closest established framework, implicitly encompassing your points within its description of how programmes persist without progress. "Ad hoc hypothesis" is a key component mechanism but too narrow. "Moving the goalposts" is a related rhetorical tactic but less structural.
  *   **Proposed Concept:** **Temporal Discounting of Falsification (TDF)** directly names the specific scoring rule you identified: the systematic devaluation of timing failures relative to mechanism, enabled by post-hoc offsets and retro-credit, characteristic of how certain persistent predictive theories are evaluated after their deadlines pass. Wegener's redemption demonstrates the crucial difference: validation of the *mechanism itself* with *novel predictions*, not just indefinite postponement via offsets.
  *   **Confidence:** High confidence that your described pattern is real and significant. High confidence that Lakatos provides the best *existing* framework for understanding it. Moderate-to-high confidence that coining "Temporal Discounting of Falsification" usefully isolates the specific evaluative practice you've dissected. The boundary condition using Wegener feels robust.

  This TDF scoring rule explains why "The Limits to Growth" or "Peak Oil" warnings persist decades after their initial dates passed, while theories like continental drift, initially rejected for lack of mechanism, achieve redemption only when the mechanism is found *and* generates new science. It's the difference between indefinite postponement and genuine scientific revolution.
