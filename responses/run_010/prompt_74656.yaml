  For Fuller's congruence requirement, the GDR's hypocrisy is crucial. Their official rules said one thing but their practice another. Fuller would say this violates law's internal morality regardless of content. But Hart would counter that such hypocrisy doesn't make it non-law - just ineffective or immoral law. The border case shows both perspectives: Fuller's point about congruence explains why the law wasn't "working" as law, but Hart is right that it was still law technically.

  The rule of recognition problem is fascinating. West German courts declaring what East German law "really was" seems problematic under Hart's theory where law depends on local official practice. Hart might respond that after reunification, the rule of recognition changed, but this feels forced. Fuller's focus on law's purposes avoids this awkwardness.

  The conscript's position raises hard questions. Fuller's clarity/promulgation requirements suggest the teen guard couldn't possibly know the "true" interpretation. Hart's separation thesis says "it was law but you should have disobeyed" - yet no court said this. This practical rejection of Hart's advice is damning for his theory in real-world applications.

  Finally, sentencing gradients and "victor's justice" issues are beyond this debate - they belong to transitional justice theory. Neither Hart nor Fuller adequately addresses power asymmetries in successor trials.

  Throughout this, I'm noticing the courts' approach validates Fuller more than expected. The congruence argument did heavy lifting, and Radbruch was a last resort. Hart's theory struggles with the rule of recognition across systems and the courts' refusal to separate validity from applicability. Still, the interpretive strategy was fundamentally positivist. Ultimately this case shows both theories have merit but Fuller's framework better captures why the GDR's border regime failed as law.
