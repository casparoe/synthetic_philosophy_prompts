  ### Critical Feature Enabling Mixed-Only Domination  
  **Complementary Payoff Gaps**  
  - A has a "moderate-high/moderate-low" profile (5 vs. X, 0 vs. Y).  
  - B and C have "low/extreme-high" and "extreme-high/low" profiles (B: 0 vs. X, 6 vs. Y; C: 6 vs. X, 0 vs. Y).  
  - **Why it works**: The mixture of B and C exploits the gap between A’s high (5) and B/C’s extremes (6). Against X, C’s 6 > A’s 5; against Y, B’s 6 > A’s 0. A mixture balances these to dominate A everywhere.  
  - **Fragility**: If A’s payoff against X were ≥6 (e.g., 6), the gap disappears. For example:  
    - If A = (6, 0), then no mixture of B (0,6) and C (6,0) can exceed 6 against X or 6 against Y.  
    - **Conclusion**: The effect hinges on A having a "sub-maximal" payoff in its strong state (X) and a "zero" in its weak state (Y).  

