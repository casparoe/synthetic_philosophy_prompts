  The prediction if you refuse the mixed step: 
    Player 1 might play A, B, or C; Player 2 might play X or Y.

  The assumption about rationality: 
    We assume that a rational player will not play a strategy that is strictly dominated by any mixed strategy (using the remaining actions). This is equivalent to the strategy not being a best response to any belief about the opponent's play.

  The key feature: 
    The complementary strengths of B and C: one does well against X and the other against Y, and the gap between A's payoff in its strong state (5) and the maximum achievable by another action (6) allows the mixture to beat A in that state while also providing a hedge in the other state.

  The objection: 
    If the player cannot randomize, then she cannot achieve the mixture. Therefore, she must choose one of the pure actions, and A might be chosen if she is sufficiently confident about X (since A gives 5 against X, which is better than B's 0 and only slightly worse than C's 6). 

  But the rationalizability argument counters: there is no belief about Player 2 (over X and Y) for which A is the best response. Therefore, a rational player (who best responds to her beliefs) would never choose A. So the elimination is justified even without the ability to randomize.

  Therefore, the objection only dents the case if we restrict rationality to pure strategy dominance. But if we adopt the broader view of rationality as best response to beliefs, then the case stands.
