prompt: |-
  I help run a board game design meetup in my city and there's this one regular, a guy who got maybe halfway through an econ PhD, who has a single line he reaches for constantly: "a rational player never plays a dominated strategy." He deployed it three separate times last Thursday and I'm now pretty convinced he meant three different things by it, and that at least one of them is just false. I have a math degree but never took any game theory, so I can feel that something's off without being able to name it.

  Use one: we were playtesting a worker-placement game I made and he said one of the actions should be cut from the box because its dominated, and when I asked him which other action beats it everywhere he kind of waved and said it doesn't have to be a single one. I went home and built a toy version to check myself: my actions A, B, C against his two possible setups, where A pays me 1 if he does the first thing and 0 if he does the second, B pays the reverse, and C pays 0.4 either way. There is no single row that beats C everywhere, so on the plain reading C survives — but I also can't shake the feeling he's right that C is junk. Use two: someone asked whether the order you delete the bad actions in matters, and he said of course not, dominated is dominated, order never matters. Use three: a total beginner beat him at a game afterwards by playing something he'd announced beforehand was "obviously irrational," and he said she got lucky, the maxim still holds, and anyway you can't argue with people who play bad moves.

  Can you pull apart the distinct precise claims that one sentence could be making? I want the axes kept separate rather than blended: strict versus weak dominance; beaten by one alternative versus beaten by a lottery over alternatives, and what you have to believe about a player for that lottery to count as something she could actually do; dominated against every profile the opponents could choose versus dominated only once you've already crossed off what they'd never choose; and exactly what you're assuming about the other players knowing that you know when you run the deletion more than once. Then stamp a verdict on each reading — trivially true, true but only under an assumption he never stated, true and interesting, or false — and say which of them, if any, actually licenses each of the three moves above. I'd also like to know what the right diagnosis of my little A/B/C toy is, since that one's still bugging me. Give it to me as a list of readings with a verdict on each and a line about the three uses, not a general lecture on how to solve games.
reasoning: |-
  We are going to break down the phrase "a rational player never plays a dominated strategy" into several precise claims. We will consider the following axes:

  1. Strict dominance vs. weak dominance.
  2. Dominated by a single alternative (pure strategy) vs. dominated by a mixed strategy (lottery).
  3. Dominated with respect to the full set of opponents' strategies vs. dominated after iterative removal of dominated strategies (and the assumptions about common knowledge and rationality required for iterative removal).
  4. The level of belief about opponents' play required for the dominance to hold.

  We'll list distinct readings and assign a verdict: trivially true, true but under an unstated assumption, true and interesting, or false. Then we will relate these readings to the three uses described.

  ---

  **Reading 1: Strict dominance by a pure strategy**

  A strategy is strictly dominated by another pure strategy if there exists a single alternative strategy that yields a strictly higher payoff regardless of what the opponents do.

  Verdict: **True and interesting** (but note: it requires that the player is rational and seeks to maximize their payoff).

  This reading implies that a rational player would never play such a strategy because they can get a strictly better outcome by switching to the dominating strategy, no matter what the opponents do.

  However, note that in the toy example with actions A, B, C:

  - Against opponent's setup 1: A gives 1, B gives 0, C gives 0.4 -> A is best.
  - Against opponent's setup 2: A gives 0, B gives 1, C gives 0.4 -> B is best.

  There is no single pure strategy that strictly dominates C because:
  - A does worse than C when the opponent plays setup 2 (0 < 0.4).
  - B does worse than C when the opponent plays setup 1 (0 < 0.4).

  Thus, under this reading, C is not strictly dominated by any pure strategy and hence should not be removed. This reading does not support the first use (cutting C from the box).

  ---

  **Reading 2: Strict dominance by a mixed strategy**

  A strategy is strictly dominated by a mixed strategy if there exists a probability distribution over the player's pure strategies that yields a strictly higher expected payoff than the dominated strategy, regardless of what the opponents do.

  Verdict: **True and interesting** (again, under rationality and payoff maximization).

  In the toy example, consider a mixed strategy that plays A and B with equal probability (0.5 each). Then:

  - Against opponent setup 1: expected payoff = 0.5*1 + 0.5*0 = 0.5, which is > 0.4.
  - Against opponent setup 2: expected payoff = 0.5*0 + 0.5*1 = 0.5, which is > 0.4.

  Thus, C is strictly dominated by the mixed strategy (0.5, 0.5, 0). Therefore, a rational player would never play C.

  This reading supports the first use: C is dominated (by a mixed strategy) and hence the designer might consider cutting it. However, note that in practice, a designer might want to keep a strategy that is dominated by a mixed strategy if they think players won't use mixed strategies (or if they want to simplify the game). But from a theoretical perspective, it is dominated.

  ---

  **Reading 3: Weak dominance by a pure strategy**

  A strategy is weakly dominated by another pure strategy if there exists an alternative strategy that yields at least as high a payoff in every possible situation and a strictly higher payoff in at least one situation.

  Verdict: **True but with caveats**. A rational player might avoid a weakly dominated strategy, but note:

  - They might be indifferent in some cases, so if they believe the opponent won't play the situation where the payoff is strictly better, they might not switch.
  - Also, weak dominance does not necessarily lead to iterative removal being order-independent (more on that below).

  In the toy example, C is not weakly dominated by either A or B because:
  - A: when opponent plays setup 2, A yields 0 which is less than C's 0.4 -> not even weakly dominating.
  - Similarly for B in setup 1.

  So weak dominance by pure strategy does not apply to C.

  ---

  **Reading 4: Weak dominance by a mixed strategy**

  Similar to reading 2 but with weak inequality (at least as good in every case and strictly better in at least one). This is less commonly discussed and more complex. We'll skip for brevity.

  ---

  **Reading 5: Iterated dominance and common knowledge**

  The claim that order of deletion doesn't matter (use two) relates to iterated deletion of dominated strategies. There are two types:

  - Iterated strict dominance: if we remove strictly dominated strategies (by pure or mixed) and we assume common knowledge of rationality, then the order of removal does not matter because if a strategy is strictly dominated, it will be removed in the first round and then never become undominated later.

  Verdict: **True and interesting** (for strict dominance by pure or mixed, and under common knowledge of rationality).

  - Iterated weak dominance: order can matter. Removing one weakly dominated strategy might prevent the removal of another.

  Verdict: **False** to claim that order never matters in general. For weak dominance, the order of removal can change the outcome.

  Thus, for use two: the regular's claim that order never matters is only true for strict dominance. If there is any weak dominance involved, then order can matter.

  ---

  **Reading 6: Dominated against the opponents' remaining strategies (after iterative removal)**

  This is the idea that we consider the game after removing strategies that the opponents would never play (because they are dominated). Then a strategy might become dominated in the reduced game even if it wasn't in the original.

  Verdict: **True and interesting** (under common knowledge of rationality and the iterative process).

  But note: the iterative process must be defined. For strict dominance, the order of removal doesn't matter. For weak, it might.

  ---

  **Reading 7: Rational players avoid dominated strategies even if opponents are irrational? (use three)**

  The regular lost to a beginner who played a strategy he deemed irrational. He claims that the maxim still holds and that the beginner got lucky.

  Verdict: **True but trivial** if we interpret the maxim as "a rational player would not play a dominated strategy". But note:

  - The beginner might not be rational (or might not have the same knowledge, or might be making a mistake) and hence might play a dominated strategy.
  - The maxim doesn't say that playing a dominated strategy never wins (it can win by luck) or that irrational players never win.

  So the regular is correct that the maxim holds (for rational players) but wrong to imply that playing a dominated strategy can't ever win. Also, he might be wrong in his assessment that the strategy was dominated if he didn't account for the beginner's possible actions.

  ---

  **Summary of Verdicts on Readings:**

  1. Strict dominance by pure strategy: **true and interesting**.
  2. Strict dominance by mixed strategy: **true and interesting**.
  3. Weak dominance by pure strategy: **true but with caveats** (rational players might avoid them, but not always, and weak dominance can cause problems in iteration).
  4. Iterated strict dominance (order doesn't matter): **true and interesting** (under common knowledge of rationality).
  5. Iterated weak dominance (order matters): **false** to claim order never matters for weak dominance.
  6. Dominated in the reduced game (after iterative removal): **true and interesting** (for the process of iterated strict dominance, order doesn't matter; for weak, it might).
  7. The maxim holds even when opponents are irrational: **trivially true** (because the maxim is about what a rational player would do).

  ---

  **Application to the Three Uses:**

  **Use 1 (cutting C from the box):**

  - The regular claimed that C is dominated, but not by a single action. Under strict dominance by a mixed strategy (reading 2), C is dominated. So if we accept mixed strategies as available to the player, then C should be avoided. However, in a worker-placement game, players typically choose a single action (pure strategy). The designer must decide whether to remove a strategy that is only dominated by a mixed strategy. In practice, if players are not expected to randomize, then C might still be played (especially by risk-averse players). But from a game theory perspective, it is dominated and hence a rational player would never play it.

  - **Verdict:** The regular is correct that C is dominated (by a mixed strategy). But note: the designer might have reasons to keep it (e.g., simplicity, teaching, or if players are not expected to use mixed strategies). Also, the regular's initial explanation was vague.

  **Use 2 (order of deletion doesn't matter):**

  - The regular claimed order never matters. This is true only for iterated strict dominance (by pure or mixed). If the game has weak dominance, then order can matter. Without knowing the game, it's risky to say "never". 

  - **Verdict:** Overstated. It's not always true.

  **Use 3 (beginner playing an "obviously irrational" move and winning):**

  - The regular is correct that a rational player wouldn't play a dominated strategy, so the maxim holds. But he is wrong to imply that playing a dominated strategy can't win (it can by luck). Also, he might have misidentified the strategy as dominated if he assumed the beginner would play rationally (which she didn't). 

  - **Verdict:** The maxim still holds for rational players, but the beginner's win doesn't contradict it.

  ---

  **Diagnosis of the Toy Example (A, B, C):**

  - In the game with actions A, B, C and two opponent setups:

    - Action C yields 0.4 in both setups.
    - Action A yields 1 in setup1 and 0 in setup2.
    - Action B yields 0 in setup1 and 1 in setup2.

  - C is not strictly dominated by any single pure strategy (A or B) because:
    - A is worse than C in setup2 (0 < 0.4).
    - B is worse than C in setup1 (0 < 0.4).

  - However, C is strictly dominated by a mixed strategy that plays A and B with probability 0.5 each. The mixed strategy yields 0.5 in both setups, which is strictly greater than 0.4.

  - Therefore, in game theory, a rational player (who is allowed to randomize) would never play C.

  But note: in a non-repeated game without explicit randomization, the player might not have access to mixed strategies. The rules of the game might only allow pure strategies. In that case, C is not dominated by any available alternative (pure). However, if the player can randomize (by flipping a coin, say), then they can achieve the mixed strategy.

  In the context of a board game, it's common for players to choose pure strategies. So the designer must consider:

  - If the game allows mixed strategies (explicitly or via player randomization), then C is dominated and might be removed.
  - If the game only allows pure strategies, then C is not dominated and might be kept because it provides a safe option.

  However, even if the game only allows pure strategies, a rational player might still avoid C if they believe that the opponent's choice is such that either A or B would be better. For example, if the player believes the opponent is equally likely to choose setup1 or setup2, then the expected payoff of A is 0.5, B is 0.5, and C is 0.4. Then C is worse in expectation. But note: without knowing the opponent's probabilities, the player might be risk-averse and prefer the safe 0.4.

  In summary, the toy example shows that C is dominated by a mixed strategy. If the rational player can use mixed strategies, then C should never be played. If not, then the situation is more nuanced. The regular is theoretically correct (if mixed strategies are allowed) but might be overstepping in the context of a board game that typically uses pure strategies.

  ---

  **Final List of Readings and Verdicts:**

  1. **Strict dominance by a pure strategy**: True and interesting. (Does not apply to C in the toy example.)
  2. **Strict dominance by a mixed strategy**: True and interesting. (Applies to C in the toy example.)
  3. **Weak dominance by a pure strategy**: True but with caveats. (Does not apply to C in the toy example.)
  4. **Iterated strict dominance (order doesn't matter)**: True and interesting. (Use two: only true for strict dominance, not weak.)
  5. **Iterated weak dominance (order matters)**: False to claim order never matters. (Use two: the regular's claim is false if the game involves weak dominance.)
  6. **The maxim holds for rational players even when opponents are irrational**: Trivially true. (Use three: the maxim holds, but the win by the beginner doesn't refute it.)

  **Use 1**: Supported by reading 2 (strict dominance by mixed) but not by reading 1. So the regular is correct in theory, but the practical design decision might differ.

  **Use 2**: Only partially supported (only for strict dominance). The regular's claim that order never matters is false if the game has weak dominance.

  **Use 3**: Supported by the maxim (any reading) but note that dominated strategies can sometimes win by luck. The regular is correct about the maxim but wrong to dismiss the win as irrelevant.
answer: |-
  ### Breakdown of "A rational player never plays a dominated strategy"

  Below, I dissect the phrase into distinct interpretations based on axes of dominance type (strict vs. weak), dominance by what (pure strategy vs. lottery/mixed strategy), and context (full game vs. iteratively reduced game). Each reading includes a verdict and relevance to the three uses. The verdicts are:
  - **Trivially true**: Logically true but uninteresting or tautological.
  - **True under assumption**: Correct only if specific conditions hold (e.g., common knowledge of rationality).
  - **True and interesting**: Non-trivial, broadly applicable, and insightful.
  - **False**: Incorrect as a general rule.

  ---

  #### **Reading 1: Strict dominance by a single pure strategy**  
  **Definition**: Strategy S is strictly dominated if there exists a single alternative strategy T that yields a strictly higher payoff for *every possible action profile* of the opponents.  
  **Verdict**: **True and interesting**.  
  **Why**: A rational payoff-maximizer will always avoid S because T is better no matter what others do. This is a core game-theoretic principle.  
  **Use 1 (cutting C)**: Does **not** apply to your toy example (A, B, C). C is not beaten by any single pure strategy (A loses when opponent plays "second thing," B loses when opponent plays "first thing").  
  **Use 2 (deletion order)**: Iterative removal of strictly dominated strategies is **order-independent** under common knowledge of rationality.  
  **Use 3 (beginner's win)**: Trivially true, but irrelevant—irrational players can win by luck.

  ---

  #### **Reading 2: Weak dominance by a single pure strategy**  
  **Definition**: Strategy S is weakly dominated if there exists a single alternative T that yields at least as high a payoff for all opponent actions and strictly higher for at least one.  
  **Verdict**: **True under assumption** (rationality + no indifference).  
  **Why**: A rational player avoids S if they believe opponents might play actions where T is strictly better. But if they are certain opponents will avoid those actions, S might be acceptable.  
  **Use 1 (cutting C)**: Does **not** apply to your toy example. C is not weakly dominated by A or B (A < C when opponent plays "second thing," B < C when opponent plays "first thing").  
  **Use 2 (deletion order)**: Iterative removal of weakly dominated strategies is **order-dependent** (removing one can make another non-dominated). Claim that "order never matters" is **false** here.  
  **Use 3 (beginner's win)**: Same as Reading 1—irrelevant to irrational play.

  ---

  #### **Reading 3: Strict dominance by a mixed strategy (lottery)**  
  **Definition**: Strategy S is strictly dominated if there exists a *mixed strategy* (probability distribution over alternatives) that yields strictly higher expected payoff for *every possible opponent action profile*.  
  **Verdict**: **True and interesting**.  
  **Why**: Rational players can randomize to guarantee better outcomes. This extends dominance beyond single strategies.  
  **Use 1 (cutting C)**: **Applies** to your toy example. C (payoff 0.4) is strictly dominated by a 50-50 mix of A and B (expected payoff 0.5 regardless of opponent). Thus, a rational player never plays C. **Verdict for toy example**: C is dominated and "junk" under this reading.  
  **Use 2 (deletion order)**: Order remains independent for iterative removal if mixed strategies are allowed.  
  **Use 3 (beginner's win)**: Same as Reading 1—does not preclude luck.

  ---

  #### **Reading 4: Weak dominance by a mixed strategy**  
  **Definition**: Strategy S is weakly dominated if a mixed strategy yields at least as high a payoff for all opponent actions and strictly higher for at least one.  
  **Verdict**: **True under assumption** (rationality + beliefs about opponents).  
  **Why**: Rational players avoid S if they assign positive probability to opponent actions where the mix is strictly better. Highly belief-dependent.  
  **Use 1 (cutting C)**: Does **not** cleanly apply to your toy example (C is strictly dominated by a mix, so weak dominance is redundant).  
  **Use 2 (deletion order)**: Order-dependent like pure weak dominance. Claim that "order never matters" is **false**.  
  **Use 3 (beginner's win)**: Same as other readings.

  ---

  #### **Reading 5: Dominance after iterative reduction (rationalizability)**  
  **Definition**: Strategy S is dominated only after removing opponents' strategies that are themselves dominated (and assuming common knowledge of rationality).  
  **Verdict**: **True under assumption** (common knowledge of rationality).  
  **Why**: Players iteratively remove dominated strategies, refining the game. S may survive initially but become dominated later.  
  **Use 1 (cutting C)**: Not relevant to your toy example (no iteration needed).  
  **Use 2 (deletion order)**: **Order matters for weak dominance** but not for strict dominance. The regular's claim ("order never matters") is **false** if weak dominance is involved.  
  **Use 3 (beginner's win)**: Assumes opponents are rational, so beginner's irrational play breaks the assumption.

  ---

  #### **Reading 6: Trivial tautology ("no rational player plays irrationally")**  
  **Definition**: "Dominated" is circularly defined as "what rational players avoid."  
  **Verdict**: **Trivially true**.  
  **Why**: Empty of content—rational players avoid irrational strategies by definition.  
  **All uses**: Licenses nothing. The regular might use this to dismiss counterexamples (e.g., Use 3: "beginners are irrational, so their wins don't count").

  ---

  ### Summary of Verdicts on Readings
  | Reading | Dominance Type          | Dominated By          | Context              | Verdict                     |
  |---------|-------------------------|-----------------------|----------------------|-----------------------------|
  | 1       | Strict                  | Single pure strategy | Full game           | True and interesting       |
  | 2       | Weak                    | Single pure strategy | Full game           | True under assumption      |
  | 3       | Strict                  | Mixed strategy       | Full game           | True and interesting       |
  | 4       | Weak                    | Mixed strategy       | Full game           | True under assumption      |
  | 5       | Strict or weak          | Pure or mixed        | Iteratively reduced | True under assumption      |
  | 6       | N/A (tautological)      | N/A                  | Any                 | Trivially true             |

  ---

  ### Analysis of the Three Uses
  1. **Use 1 (Cutting C from the game)**:
     - **Correct reading**: Reading 3 (strict dominance by mixed strategy). C is dominated by a 50-50 mix of A and B, so a rational player never plays it. **Verdict**: Regular is correct, but he failed to specify that dominance by mixed strategies counts. Your intuition that C is "junk" aligns with this.
     - **Why other readings fail**: Readings 1/2 (pure-strategy dominance) don't apply, as no single pure strategy dominates C.

  2. **Use 2 (Deletion order doesn't matter)**:
     - **Correct reading**: Only holds for strict dominance (Readings 1/3/5). For weak dominance (Readings 2/4/5), order can matter. **Verdict**: Regular's claim is **false** if weak dominance is involved. He overgeneralized.
     - **Why it matters**: In games with weak dominance, deleting strategies in different orders can lead to different equilibrium sets.

  3. **Use 3 (Beginner won with "irrational" play)**:
     - **Correct reading**: All readings (rational players avoid dominated strategies), but it's **trivially true** (Reading 6). The regular misapplies it: the maxim says nothing about irrational players (who can win by luck) or whether a strategy is truly dominated against irrational opponents. **Verdict**: Regular is wrong to dismiss the win—dominated strategies can win if opponents play suboptimally.
     - **Key point**: Dominance assumes opponents are rational. Against a beginner, the game changes, and "irrational" moves may become viable.

  ---

  ### Final Diagnosis of Your Toy Example
  - **Problem**: Action C (payoff 0.4 always) vs. A (payoff 1 or 0) and B (payoff 0 or 1).  
  - **Why C feels like junk**: It is strictly dominated by a mixed strategy (e.g., 50% A + 50% B), which guarantees 0.5 > 0.4. Rational players who can randomize (e.g., flip a coin) will never choose C.  
  - **Practical design implication**: If your game forbids mixed strategies (e.g., no randomization mechanics), C might be kept as a safe option. But in standard game theory, it is dominated and removable.  
  - **Regular's defense**: His intuition was correct (C is dominated), but he failed to clarify that dominance by mixed strategies suffices.
