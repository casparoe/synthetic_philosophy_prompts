prompt: |-
  You're someone who works at the intersection of philosophy of social science and violence statistics — you know the whole "is the world getting less violent" fight inside out. Before you answer, brainstorm a handful of candidate concepts out loud (statistics, epidemiology, criminology, x-phi) and then narrow down to the best fit.

  Here's a pattern I keep hitting and have no word for. Every so often the definition of violence gets wider — coercive control starts counting, marital rape stops being legally invisible, some people start folding in structural or ecological harm. The recorded numbers then jump, and everyone argues about whether things got worse or whether we're just finally seeing what was always there. But the bit that actualy bothers me is this: the obvious fix — hold the definition constant and re-measure the whole series — doesn't work, because the widening of the definition is itself part of the moral progress I'm trying to track. Freezing the old narrow meaning to get a clean time series means deliberately measuring the wrong thing. So the thing I want to measure and the instrument I measure it with are both moving, and the movement in the instrument isn't noise, it's a verdict on the thing.

  Is there an established name for this exact configuration? I know the neighborhood: concept creep, detection or ascertainment bias, the dark figure of crime shrinking, gerrymandering a definition, moving the goalposts. None of them seem to capture the part where the instrument changes for good moral reasons and that's precisely what makes the trend unmeasurable in principle. Tell me which is closest and exactly how mine differs from it, and whether something better fits that I haven't thought of. If nothing fits, coin a term and define it sharply, with boundary cases: does it still apply when the definition narrows instead? when the widening is contested rather than widely accepted? when it's genuine moral progress versus fashion?

  Also please separate what's actually settled in this literature from what's genuinely disputed among people who know it — don't slide one side of the violence-decline debate in as if it were consensus.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're describing a specific problem where expanding definitions of violence cause measurement challenges, but that expansion itself is a sign of moral progress. The user wants to know if there's a term for this exact scenario.

  First, I need to recall relevant concepts. Concept creep comes to mind—it's when definitions expand over time. But does it capture the moral progress aspect? Ascertainment bias refers to better detection leading to higher recorded rates. But again, the moral dimension isn't explicit. Then there's the measurement validity problem in social sciences, where operational definitions change. But the user is stressing that the change in measurement is integral to what they're trying to track.

  The user mentioned examples like coercive control and marital rape being recognized. These are cases where society's understanding evolves, making old data incomparable. The core conflict is between consistent measurement and capturing moral progress. If you keep the definition constant, you're ignoring progress; if you change it, you can't track trends.

  I should check if existing terms fit. "Moral inflation" might be close, but it's more about devaluation of terms. "Epistemic upgrading" from Haslanger isn't widely adopted. Maybe there's a gap here. The user needs a term that encapsulates both the methodological challenge and the normative aspect.

  Also, the user wants to distinguish between settled and disputed areas. In the violence decline debate, Pinker's supporters argue that better measurement accounts for some declines, while critics say it masks increases. But the user's point is that even with reclassification, the trend becomes unmeasurable because the goalposts move inherently.

  Considering coining a term: "Normative drift in operationalization" or "Moral-progress paradox of measurement." But it needs to be concise. "Moral-Operational Entanglement" (MOE) might work, emphasizing the inseparable link between ethics and measurement. 

  Boundary cases: What if definitions narrow? Like decriminalizing certain acts. That would reverse the issue. If the change is contested, it's still MOE as long as it's driven by normative shifts. Genuine progress vs. fashion—MOE applies if the shift is framed as moral, regardless of consensus.

  Finally, clarifying settled vs. disputed: Methodologists agree that definitional changes disrupt trends, but there's no consensus on solutions. The violence decline debate is polarized, with no agreement on whether reclassifications explain apparent reductions.
answer: |-
  Here's a breakdown tailored to your precise concern, following your requested structure:

  **Brainstormed Candidate Concepts:**
  1.  **Concept Creep (Psychology/Social Science):** Expansion of a concept's boundaries (e.g., "violence," "trauma"). *Relevance:* Directly addresses definitional widening. *Gap:* Focuses on the expansion itself (causes/consequences), not the specific *measurement paradox* arising when that expansion is *morally mandated* progress.
  2.  **Ascertainment/Detection Bias (Epidemiology/Criminology):** Increased identification/reporting of existing cases due to better methods/awareness. *Relevance:* Explains rising stats without real increase. *Gap:* Implies uncovering a pre-existing, static reality. Your core issue is that the *reality itself* (what counts as morally relevant harm) has changed *through* the redefinition. The "bias" is *constitutive* of the progress.
  3.  **Changing Operational Definitions/Measurement Validity Threat (Social Science Methodology):** When the way a concept is measured changes over time, threatening comparability. *Relevance:* Core methodological problem. *Gap:* Standard approach views this as a problem to *correct* (e.g., retroactive re-coding, using only consistent indicators). Your point is that *correcting* it (freezing the definition) *invalidates* the measurement of the very progress (the definitional shift) you care about.
  4.  **Reification Problem (Philosophy/Sociology):** Mistaking a constructed operational definition for the full, immutable essence of a concept. *Relevance:* Highlights the constructed nature of "violence" stats. *Gap:* Doesn't address the *temporal dynamic* and the *moral imperative* driving the redefinition.
  5.  **Moral Inflation (Philosophy/Linguistics):** Devaluation of moral terms through overuse or expansion. *Relevance:* Notes a consequence of broadening. *Gap:* Your context views the broadening as *positive* progress, not "inflation," and the focus is measurement, not linguistic devaluation.
  6.  **Epistemic Injustice & Hermeneutical Resources (Social Epistemology):** Lack of concepts/understanding to name and articulate certain harms (e.g., "marital rape" before the term). *Relevance:* Explains *why* definitions widen – gaining hermeneutical resources. *Gap:* Focuses on the *cause* of the shift (lack of concepts), not the resulting *measurement paradox* for tracking progress.

  **The Closest Fit & Its Shortcoming:**
  *   **"Changing Operational Definitions / Measurement Validity Threat"** is the *methodologically* closest. It precisely names the core problem: time-series incomparability due to shifting measurement instruments.
  *   **How Yours Differs Radically:** Standard methodology treats definitional change as *noise* or *error* to be minimized or corrected to reveal the "true" underlying trend of the *previously defined phenomenon*. **You argue that the definitional change *is* the signal of the *deeper phenomenon* you want to track (moral progress in recognizing harm).** Correcting for it doesn't reveal the truth; it actively *obscures* the progress. The "threat" isn't external; it's *internal* to the phenomenon of interest. The instrument's movement *is* part of the verdict on the thing.

  **The Gap & Proposed Term:**
  No existing term perfectly captures this specific **paradox where morally necessary progress *in* the definition of the phenomenon fundamentally disrupts the possibility of generating a consistent quantitative time-series trend *of* that phenomenon, because the change *is* the progress.**

  **Coined Term: Moral-Operational Entanglement (MOE)**

  *   **Definition:** The inextricable linkage between the *moral evaluation* of a social phenomenon (particularly regarding what constitutes harm or injustice) and the *operational definition* used to measure it, such that *progress in moral understanding necessitates changes in measurement* that render longitudinal quantitative trend analysis of the phenomenon conceptually incoherent or methodologically intractable. The "noise" (definitional shift) *is* the "signal" (moral progress).

  *   **Boundary Cases:**
      *   **Definition Narrowing:** MOE applies inversely. If moral progress led society to *decategorize* an act as violent (e.g., consensual BDSM, certain forms of protest), maintaining the old broad definition would overcount and misrepresent the reduction in *recognized* harm. The measurement problem remains: tracking the trend requires a constant definition, but moral progress *is* the redefinition.
      *   **Contested Widening:** MOE still applies if the widening is driven by a *claim* of moral progress, even if contested. The measurement problem arises from the *attempt* to implement the new moral understanding through redefinition. The *degree* of contestation might affect the strength of the claim that it *is* progress, but the *structure* of the entanglement remains.
      *   **Genuine Progress vs. Fashion/Overreach:** MOE describes the *structural entanglement* and its *consequence for measurement*, regardless of the ultimate moral truth. If the widening is mere fashion/overreach, then MOE highlights the *cost* of that shift for measurement. If it's genuine progress, MOE highlights the *tragic* cost for measurement. Diagnosing MOE doesn't presuppose the moral validity of the shift, only that it *purports* to be moral progress and drives operational change. Determining "genuine progress" is a separate, normative question.

  *   **Core Problem of MOE:** It creates a fundamental tension between two valid goals:
      1.  **Conceptual Fidelity & Moral Accuracy:** Measuring the phenomenon according to our *current* best understanding of its moral significance.
      2.  **Longitudinal Comparability:** Generating consistent data over time to observe trends.

  Achieving (2) requires sacrificing (1) (using an outdated, morally deficient definition). Achieving (1) inherently sacrifices (2).

  **Settled vs. Disputed in the Literature:**

  *   **Settled (Among Methodologists & Philosophers of Science):**
      1.  **Changing operational definitions disrupt time-series comparability.** This is Methodology 101.
      2.  **Social science concepts are "essentially contested" (Gallie) and evolve.** Their meaning isn't fixed.
      3.  **Measurement involves value judgments.** What counts as "violence" isn't purely empirical.
      4.  **Increased reporting/recognition (ascertainment bias) *can* explain rising crime/violence stats without a real increase.** This is a standard caveat.
      5.  **The "Dark Figure" (unreported/unrecorded crime) exists and changes over time.** Efforts to reduce it are crucial but complicate trend analysis.

  *   **Genuinely Disputed (Violence Decline Debate & Beyond):**
      1.  **The Magnitude & Permanence of Ascertainment Effects:** How much of the *observed* increase in certain violence stats (e.g., domestic violence, sexual assault reporting rates) is *solely* due to better reporting vs. reflecting real changes? How long do these effects last?
      2.  **The Primacy of Homicide Data:** Pinker et al. argue homicide is the "hardest" stat, least subject to ascertainment bias, and shows a clear decline. Critics argue:
          *   Homicide definitions *also* change (e.g., definitions of justifiable homicide, infanticide).
          *   Focusing *only* on homicide ignores the broader spectrum of violence/harm captured by widening definitions (the core of your MOE point).
          *   Declines in lethal violence *can* coexist with stable or increasing non-lethal violence or shifting forms of harm.
      3.  **Can "Violence" Be Measured Consistently Over Centuries/Millennia?** Critics argue the concept is too historically and culturally variable for meaningful ultra-long-term trend analysis. Pinker argues core physical aggression is comparable.
      4.  **Weighting Different Harms:** How do we compare trends in, say, homicide rates vs. trends in coercive control prevalence? Is a large decline in lethal violence morally "worth" a smaller increase in non-lethal intimate partner violence? This involves deep normative judgments.
      5.  **The Role of Structural Violence:** Should "violence" include poverty, systemic discrimination, environmental harm? If included, how is it quantified and integrated with interpersonal violence trends? This is a major fault line. Pinker largely excludes it; critics argue this is a profound flaw.

  **Conclusion:** Your insight brilliantly highlights **Moral-Operational Entanglement (MOE)** – the core methodological tragedy inherent in measuring morally evolving concepts. While "changing operational definitions" names the *technical* problem, MOE captures the *normative* heart of your dilemma: the instrument changes *because* we learn more about the harm we should care about, and that very learning breaks the instrument for showing us the trend. This entanglement is a profound challenge for anyone trying to quantitatively track progress in complex, morally charged social domains like violence reduction. It remains a central, unresolved tension in the "world less violent" debate and social measurement generally.
