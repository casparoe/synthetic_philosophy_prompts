prompt: |-
  I'm a third-year philosophy student co-running a reading group on the ethics of borders, and this week we took up Dummett's writing on immigration — in particular the thought that a people is entitled to determine what its own way of life will become, which he takes to ground a state's right to limit immigration, sitting alongside his insistence that the obligation to admit those fleeing persecution is not up for negotiation. My reconstruction of the first half of that case may be uncharitable to him; if it is, say where, but please evaluate the argument as I have stated it rather than the one he might have given. I deliberately avoided any premise mentioning states, borders, citizenship, or coercion, because I think most objections to the communitarian case simply assert that states are special, and I wanted to see whether the case could be made without that. The trouble is that what I ended up with proves far too much:

  (1) A people's way of life — its language, its institutions, the customs and settled expectations that accumulate out of a common history — is a good, and its members are entitled to care about its continuing.
  (2) Who joins a group largely determines what its way of life becomes; so a group entitled to care about the continuation of its way of life is entitled to decide who joins it.
  (3) That entitlement belongs to those who must live with the consequences of the change, and not to those who stand outside the group and will not.
  (4) Therefore a political community may limit immigration to whatever level, and on whatever criteria, it judges necessary to preserve its way of life.
  (5) Nothing in (1)–(3) mentions states, borders, citizenship, or coercion; they are stated about groups and ways of life generally.
  (6) So they apply to any group with a way of life: a region, a town, a neighbourhood, a school, a congregation — and also to a majority within a state whose way of life is said to be changing because of the presence of a minority, in exactly the way it is said to change because of new arrivals.
  (7) So a town may keep people out, a school may keep them out, and a majority may disenfranchise or expel those whose presence alters what its way of life is.
  (8) And since (2) leaves the criteria to the group, while (1) makes the group's own estimate of what threatens its way of life the estimate that counts, nothing in (1)–(3) rules out race or religion among the criteria.
  (9) (7) and (8) license segregated schools, towns that keep out anyone of the wrong colour, and at the limit ethnic cleansing.
  (10) No principle that licenses those things can be true.
  (11) So (1)–(3) are false, or at any rate (2) and (3) are; a state's right to control its membership needs some ground other than the value of a shared way of life, or no ground at all.

  Two things I cannot get past. First, every proviso I try to insert fails: if I say the group's judgment must be reasonable, or that only ways of life worth preserving generate the entitlement, I have either begged the question against the town that sincerely judges otherwise or conceded that (1)–(3) were never doing the work. Second, the refugee exception seems to cut against the argument rather than soften it. Refugees change a way of life as much as anyone else, so if (1)–(3) really grounded (4) there would be no reason for the exception to be absolute; the fact that a communitarian wants it to be absolute suggests the operative consideration is need rather than character, in which case (4) was never supported by (1)–(3) to begin with.

  I would rather keep (1) and (3) than lose them, because (3) looks to be doing honest work in cases I find persuasive — an Indigenous nation settling who its members are, a small island state facing the relocation of its whole population. But I cannot accept that (11) is the only alternative to (9). So: which step do you reject, and why did it look unobjectionable when I wrote it? If you think the argument is valid and that I simply have to choose a premise to surrender, say which choice costs least and price the alternatives — what I give up by rejecting (1), by rejecting (3), and by rejecting the move from (5) to (6), respectively. I would also like to know whether that move can be blocked by anything other than an assertion that states are different, and what becomes of the refugee objection on your preferred repair. End with a single line beginning Verdict: naming the one step whose rejection best saves the rest of the argument, followed by no more than twelve words of explanation; if you think no single rejection saves it, say so on that same line.
reasoning: |-
  Okay, the user is a third-year philosophy student leading a reading group on border ethics, specifically discussing Dummett's arguments on immigration. They've reconstructed a communitarian argument without mentioning states or borders to test its validity, but found it leads to unacceptable conclusions like segregation or ethnic cleansing. They need help identifying where the argument goes wrong and how to salvage plausible parts like premises (1) and (3).

  First, I need to assess their argument step by step. Premise (1) seems reasonable: a people's way of life is valuable and they're entitled to care about its continuity. Premise (3) also makes sense—those affected by changes should have a say. The problem clearly stems from premise (2), which claims that because group composition affects cultural evolution, the group gets full control over membership. This bridges descriptive claims about cultural change to normative control rights without constraints.

  The user's already noticed that adding "reasonableness" provisos doesn't work—it either begs the question or undermines the premise. And the refugee exception highlights the tension: if cultural preservation were the real justification, refugees wouldn't get absolute priority. This suggests the core issue is premise (2)'s overreach in equating concern for culture with unqualified gatekeeping power.

  Among possible fixes, rejecting (2) is least costly. It preserves the intuitive value of cultural continuity (1) and the "stakeholder principle" (3), while avoiding slippery slopes to local tyranny. The alternative—rejecting (1) or (3)—would force abandoning legitimate cases like Indigenous self-determination. Blocking the move from (5) to (6) would require distinguishing political communities from other groups, but the user explicitly wants to avoid "states are special" assertions. Instead, rejecting (2) allows reintroducing constraints (e.g., fundamental rights) when rebuilding a state-specific argument.

  On the refugee point: once (2) is discarded, the absolute duty to admit refugees can stand separately as a humanitarian imperative that overrides cultural protection concerns when lives are at stake—no longer a contradiction.

  Verdict should target (2) as the lynchpin. The explanation must be concise: it conflates legitimate cultural interest with unconstrained exclusion rights. This keeps the analysis tight while honoring the user's request to avoid state-centric assumptions unless necessary.
answer: |-
  Your reconstruction is logically devastating precisely because it exposes the unconstrained nature of the core communitarian claim. The fatal flaw lies in **step (2)**. Here’s the breakdown:

  1.  **Why (2) Fails:** Premise (2) asserts that because a group's composition *determines* its future way of life, the group *is therefore entitled to decide who joins it*. This is a non sequitur. While it's descriptively true that composition influences cultural evolution, (2) leaps to a normative entitlement to *control* that composition through exclusion. This leap smuggles in an unstated assumption: that the group's interest in cultural continuity *automatically trumps* the interests of outsiders seeking entry *and* justifies coercive exclusion. This is where the argument grants excessive, unbounded power. The entitlement to care about continuity (1) does not logically entail an entitlement to exclude others to achieve it; it might entail rights to internal practices, education, or non-coercive preservation efforts. (2) conflates a legitimate interest with an unqualified right to gatekeep.

  2.  **Why Other Premises Hold (Initially):**
      *   **(1)** is plausible: Cultural continuity *can* be a legitimate good worth preserving.
      *   **(3)** is strong ("stakeholder principle"): Those bearing the consequences *should* have significant input. It doesn't *by itself* grant exclusion rights.
      *   **(5)** & **(6)** are accurate observations: The argument *is* general and applies universally if (2) is accepted.
      *   **(7), (8), (9)** correctly follow *if (2) is granted*. This is the reductio ad absurdum.
      *   **(10)** is correct: Such unacceptable conclusions invalidate the premises leading to them.
      *   **(11)** logically follows from the preceding steps.

  3.  **Why Provisos Fail:** Adding "reasonable" or "worthwhile" checks *does* beg the question or concede the point. Who defines "reasonable" for the island nation vs. the racist town? If an external standard judges the *value* of the way of life or the *reasonableness* of the threat, then the group's own judgment (central to the communitarian claim in (1) & (2)) is no longer sovereign. The argument collapses because (1)-(3) alone *cannot* provide the limiting principle; it requires an external moral framework.

  4.  **The Refugee Exception:** You are right. If cultural preservation via exclusion were the *foundation* of the right to control borders, refugees would pose a direct threat to that preservation. Insisting on an absolute duty to admit them *despite* this threat reveals that a stronger, independent moral principle (preventing extreme harm/persecution) *overrides* the cultural preservation interest. This confirms that (1)-(3) are insufficient to ground (4); the refugee duty relies on a distinct moral foundation (humanitarian need/rights protection).

  5.  **Salvaging (1) and (3):** Rejecting (2) allows us to keep (1) and (3) without licensing (7)-(9).
      *   **Rejecting (1):** Costs too much. It dismisses the genuine value people find in cultural continuity and self-determination (e.g., Indigenous nations, minority cultures). It makes the state's right even harder to ground plausibly without resorting to pure statism.
      *   **Rejecting (3):** Also costly. It severs the link between democratic legitimacy and bearing consequences. Why *shouldn't* those affected have a primary say? This principle has broad applicability beyond borders.
      *   **Rejecting (5) to (6):** Requires asserting states *are* fundamentally different. While defensible (states have unique coercive power, final jurisdiction, responsibility for basic rights/order), it risks being the very "states are special" assertion you wanted to avoid. It leaves the *reason* for their difference needing explicit justification (e.g., collective self-determination within a bounded jurisdiction, maintaining basic order/rights).

  6.  **Blocking (5) to (6) Without "States Are Special":** It's difficult. One could argue that only groups constituting a *self-governing political community* with *final jurisdictional authority* and *responsibility for basic rights/welfare* have the kind of legitimate exclusionary power in question. This distinguishes states from towns, schools, or majorities (who lack final jurisdictional authority and whose actions are constrained by the state's constitutional/legal order). However, this *does* functionally reintroduce the idea that the *political unit* with sovereignty is special. Rejecting (2) is a cleaner solution.

  7.  **The Refugee Objection Post-Repair:** Once (2) is rejected, the refugee objection loses its sting *against the core argument*. The absolute duty to admit refugees is grounded in a separate, paramount principle: the prevention of extreme harm and persecution (a humanitarian imperative or basic rights violation). This principle can *override* legitimate state interests in cultural continuity or even general immigration control, without implying those interests are invalid *per se* or that the state's right to control immigration rests *solely* on cultural preservation. The communitarian can consistently hold both: a *qualified* right to control immigration *based on multiple grounds* (including, but not limited to, cultural continuity, economic stability, social cohesion) *and* an absolute duty to refugees based on an overriding humanitarian imperative.

  **Verdict: Reject (2) – It conflates cultural interest with unqualified exclusionary control.**
