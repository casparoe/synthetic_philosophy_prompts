  We are creating a workshop activity for second-year students in history and classics. The goal is to expose them to the challenges of source criticism through an invented ancient setting. We'll design an event and a set of sources with specific riggings to teach key methodological lessons.

  **Setting:** The invented ancient polity is the Kingdom of Lyramnia, located on the fictional island of Thalassa in the Mediterranean. The event is a **temple robbery** at the Great Temple of Arion in the capital city of Pella, during the reign of King Theron (reigned 210-190 BCE). The robbery occurred in 200 BCE. The temple was renowned for housing the Golden Mask of Arion, a sacred artifact.

  **The Event:** On the night of the summer solstice in 200 BCE, the Golden Mask was stolen from the inner sanctum. The theft was discovered the next morning. Suspicion fell on several groups: rival priests, a disgruntled former temple guard, a neighboring kingdom (the Aetolians), or even a conspiracy involving the king's own brother. The event caused a major scandal and led to upheavals in the priesthood and the royal court.

  **Sources:** We will create eight sources, each about 120 words, presented as fragments or excerpts. They will be written in a style that mimics ancient texts (e.g., chronicles, letters, inscriptions, etc.).

  **Questions for the Groups:** Six questions that the groups must answer, with some being answerable, some only within a range, and at least two permanently unanswerable. The questions are:

  1. On what exact date (day, month, year) was the Golden Mask stolen? (Answerable: sources give the summer solstice, 200 BCE)
  2. Who was responsible for the theft? (Unanswerable: multiple suspects, no conclusive evidence)
  3. Was the mask ever recovered? (Answerable: sources say it was not, but one source hints at a later reappearance, so actually no)
  4. How many guards were on duty that night? (Answerable within a range: two sources say 4, one says 5, so range 4-5)
  5. Did King Theron order an investigation? (Answerable: yes, multiple sources mention it)
  6. Was the High Priest of Arion executed for negligence? (Unanswerable: conflicting reports, no clear evidence)

  **Scoring Scheme:** We'll use a confidence-weighted scoring system. For each question, students assign a probability (0-100%) to each possible answer (or to a range of answers) and also have the option to say "unknown". The scoring is done via a quadratic scoring rule: if the true answer is X, and they assign probability p to X, then they get points: 1 - (1-p)^2. If they assign probabilities to multiple choices, we use the sum over the possible answers. But note: if they choose "unknown", they get a fixed score (say 0.5) for that question. This penalizes overconfidence: if they are sure and wrong, they get 0, but if they are unsure and say unknown, they get 0.5. We can use points (not real money).

  **Two-Round Structure:**
  - Round 1: Groups get the eight source texts and answer the six questions with confidence probabilities. They have 30 minutes.
  - Round 2: Then, they receive the provenance metadata (transmission history) and have 15 minutes to revise their answers and confidence levels.
  - Then debrief.

  **Source Texts (8):**

  **Source 1: Chronicle of Pella (fragment)**
  _"In the tenth year of King Theron, upon the summer solstice, a great sacrilege occurred. The Golden Mask, sacred to Arion, was stolen from the inner sanctum of the temple. The guards, four in number, were found bound and gagged at dawn. The king, in his wrath, ordered the execution of the captain of the guard and the arrest of the High Priest."_

  **Source 2: Letter from a Priest to his Brother (fragment)**
  _"... and so the mask is gone, taken in the night. Some say it was the Aetolians, for they have long coveted it. Others whisper that Prince Demos, the king's brother, was seen near the temple that night. The High Priest has been imprisoned, but I fear he is innocent. The king has set his investigators to work, but they find nothing. We have searched everywhere, but the mask is lost to us."_

  **Source 3: Inscription from a Temple Wall (damaged)**
  _"...[name lost]... the guards were five... [gap]... the mask was taken... [gap]... the High Priest was executed for his negligence... [gap]... the king's justice..."_

  **Source 4: Aetolian Propaganda Pamphlet (quoted in a later Lyramnian refutation)**
  _"Rejoice, Aetolians! The gods have punished the Lyramnians for their arrogance. Their false idol, the Golden Mask, was easily taken by our brave agents. The Lyramnian guards were drunk and sleeping. We have the mask, and it now rests in our temple, a sign of divine favor."_

  **Source 5: Royal Archives - Guard Duty Roster (fragment)**
  _"Summer Solstice, 200 BCE: Temple of Arion - Guard Captain: Leon; Guards: Theras, Micon, Dion, and Philemon. Night watch."_

  **Source 6: Memoirs of a Courtier (excerpt)**
  _"I was present when the king received the news. He ordered an immediate investigation. The High Priest was arrested, but the king did not believe him guilty. The investigation revealed that the locks had been tampered with from the inside. The mask was never found. Some say it was melted down."_

  **Source 7: Lyramnian Lawsuit Record (fragment)**
  _"... and the family of the executed guard captain, Leon, sued the temple for wrongful death. The court found that the temple was not liable, as the captain had failed in his duty. The record shows that there were four guards on duty that night, but the captain was not at his post."_

  **Source 8: History of Lyramnia by Historian X (epitomized by later compiler)**
  _"In the reign of Theron, the temple robbery was a scandal. The mask stolen, the guards were four. The king investigated. The High Priest was imprisoned but not executed. The mask was lost forever."_

  **Provenance Metadata (to be handed out in Round 2):**

  1. **Chronicle of Pella (Source 1):** Written in 170 BCE, found in Pella. Survives in a single manuscript from the 3rd century CE. Considered generally reliable for events in Pella.
  2. **Letter from a Priest (Source 2):** Dated 199 BCE (one year after the event). Found in an archive in Pella in 1950. Original papyrus, well-preserved. The author was a priest in the temple, so an eyewitness to the aftermath but not the event.
  3. **Temple Wall Inscription (Source 3):** Inscribed in 190 BCE. Found on a temple wall in Pella. Damaged by erosion. The temple was dedicated to Arion, so this is an official record.
  4. **Aetolian Propaganda Pamphlet (Source 4):** Written in 198 BCE. Survives only as quoted by Lyramnian historian Cleon in his "Against the Aetolians" (150 BCE). Cleon quotes it to refute it. The pamphlet itself is hostile and likely exaggerates.
  5. **Royal Archives (Source 5):** Original document from 200 BCE. Found in the royal archives in Pella in 1920. Administrative record, contemporary.
  6. **Memoirs of a Courtier (Source 6):** Written in 180 BCE. Survives in a 2nd-century BCE manuscript. The author was a courtier at the time of the event, so an eyewitness to the king's reaction.
  7. **Lawsuit Record (Source 7):** Dated 199 BCE. Found in the city archives. Contemporary legal document.
  8. **History of Lyramnia (Source 8):** Written by Historian X in 160 BCE. The original is lost. We have an epitome (summary) made by a compiler in 300 CE. The epitome is all that survives.

  **Rigging and Pedagogical Points:**

  1. **Source 8 is an epitome of a lost history (Historian X).** In Round 1, students might count Source 1 and Source 8 as two independent sources agreeing on the number of guards (4). But in Round 2, they learn Source 8 is an epitome of a lost history. It's possible that Historian X used the same source as Source 1 (or even Source 1 itself). So it's not independent. This teaches that you can't count witnesses without knowing the transmission.

  2. **Shared odd phrase:** Look at Source 1 and Source 8. Both say "the guards were four" and both use the phrase "the mask was stolen" in the same order. This might be a copyist's slip or an indicator of common ancestry. The metadata in Round 2 shows they are from different times, but the epitome might have copied from the Chronicle. This helps reconstruct the transmission.

  3. **Source 2 (the priest) is reliable about the aftermath (he was there) but not about the theft itself (he wasn't).** He reports rumors about Prince Demos. The metadata says he was a priest and the letter is contemporary, but he didn't witness the event. So his report of the rumors is secondhand. The crucial fact (who did it) relies on this, but it's secondhand.

  4. **Source 4 (Aetolian pamphlet) survives only because it was quoted by a hostile writer (Cleon).** Cleon quoted it to refute it, so we have the pamphlet's claims but in a biased context. The pamphlet claims Aetolians did it and have the mask, but is it true? The metadata shows it's propaganda and quoted by an enemy.

  5. **Silence that means something:** The Royal Archives (Source 5) mention the guard roster but say nothing about the theft. This is an administrative record that would have noted the event if it had been known at the time of writing (it was written the same day, before the theft was discovered). But it doesn't mention the theft because it hadn't happened yet? Or because it's just a roster? The lawsuit record (Source 7) does mention the theft because it's after the fact. The metadata shows Source 5 is contemporary and administrative. Its silence is expected because it was written before the theft. This teaches that absence of evidence is not evidence of absence if the document wouldn't have recorded it.

  6. **Physical trace:** The Temple Wall Inscription (Source 3) is dated to 190 BCE (10 years after the event). It says the High Priest was executed. But we don't know exactly when the execution happened. The inscription is from 190 BCE, so the execution must have happened by then, but we don't know if it was right after the event or years later. This gives a window (200-190 BCE) for the execution, but not the exact date. The question about the High Priest's execution (Q6) is unanswerable because we don't have a clear record. Source 3 is damaged and says he was executed, but Source 2 (letter) says he was imprisoned and Source 6 (courtier) says he was arrested but the king didn't believe him guilty, and Source 8 says not executed. The metadata shows Source 3 is an official temple inscription, which might be biased to show the king's justice.

  7. **Source 4 (Aetolian pamphlet) has an obvious motive to invent (propaganda) but lets slip a genuine detail: the guards were drunk.** Source 1 says they were bound and gagged, which doesn't contradict being drunk. Source 7 says the captain was not at his post, which might imply negligence. The pamphlet's claim about the guards being drunk might be true even if the rest is fabricated. The metadata shows it's hostile and quoted by an enemy, so the students must evaluate if any part is reliable.

  **Debriefing:** After Round 2, gather the class and discuss:

  - How did your answers change after the provenance?
  - Point out specific riggings: 
    - Source 8 being an epitome: we thought we had two sources but it was one.
    - The Aetolian pamphlet: it survived because it was attacked, so we have it in a biased context.
    - The priest's letter: he was an eyewitness to the aftermath but not the event, so his rumors are unreliable.
    - The administrative record (Source 5): its silence is because it was written before the event, so it doesn't mention the theft. But the lawsuit record (Source 7) does because it's after. This shows that absence of evidence is evidence of absence only when the evidence would be expected.
  - The unanswerable questions: we don't know who did it or if the High Priest was executed. We have conflicting evidence. That's okay! History has gaps.

