  ### Workshop Design: "The Lyramnia Temple Robbery"  
  **Setting:** Kingdom of Lyramnia, a Bronze Age polity on the fictional island of Thalassa (Mediterranean-esque). The event is the **theft of the Golden Mask of Arion** from the royal temple in the capital, Pylos, in 1200 BCE. The Mask, a sacred relic, vanished during the Festival of Tides, triggering a political crisis. Suspects include the disgruntled High Priest, a rival merchant guild, and the king’s ambitious brother.  

  ---

  ### **Sources (8 Excerpts, ~120 Words Each)**  
  *Written as fragmented, ambiguous texts; mix of chronicles, letters, inscriptions, and quotes.*  

  1. **Chronicle of Pylos (Stone Inscription):**  
     *"In Year 22 of King Theron, the Golden Mask was stolen. The festival guards slept. High Priest Ion was absent. The king ordered the gates sealed. No thief was found. The people wailed. Arion’s wrath brought plagues upon the crops."*  

  2. **Trader’s Ledger (Clay Tablet):**  
     *"Shipment: 50 amphorae olive oil, 10 bolts dyed cloth. Delivered to Temple Storehouse, 3rd day of Festival. Guards drunk. Saw cloaked figure near inner shrine. Mask gleamed under moon. Next dawn, heard shouting. Mask gone. King’s men closed harbor."*  

  3. **Poem of the Mask (Papyrus Fragment):**  
     *"O Mask! Torn from Arion’s brow! / The traitor’s hand struck at the tide’s peak— / Ion, whose greed outshone the sun, / fled to the hills with his cursed gold."*  

  4. **High Priest Ion’s Defense (Quoted in Historian’s Refutation):**  
     *"I was in my chambers that night! The king’s brother, Demos, bribed the guards. Demos craved the Mask to buy mercenaries. My temple steward saw Demos near the shrine. But the king refuses to hear me!"*  

  5. **Royal Guard Log (Wax Tablet):**  
     *"Festival Night Watch: Karon, Lycus, Mys, and Dion. Orders: patrol inner courtyard. Midnight: all present. Third watch: Dion relieved Karon. Dawn: disturbance at shrine. Mask missing. Gates secured."*  

  6. **Merchant Guild Record (Inscribed Pottery):**  
     *"Guildmaster’s Note: Harbor taxes doubled after Mask theft. King blames ‘foreign agitators.’ Our ships searched. No Mask found. Rumors: Ion sold it to Aetolian traders. Fools! We profit from piety, not theft."*  

  7. **Scribe’s Letter to Wife (Papyrus):**  
     *"Theron rages! Demos whispers in his ear. Ion imprisoned. But I saw Demos near the temple that night—he wore a sea-blue cloak. The guards? Drunk as usual. Poor Lycus swore he saw a ‘ghost’ carrying gold."*  

  8. **Epitome of Lost History by "Pylos Historian" (Parchment):**  
     *"During the Festival, thieves stole the Mask. Guards slept. Ion was blamed. Demos accused Ion. The king seized Ion’s lands. Mask never recovered. Famine followed."*  

  ---

  ### **Questions for Groups (Answer with Probabilities)**  
  1. **Who stole the Mask?** (Unanswerable: conflicting motives, no eyewitnesses)  
  2. **Was High Priest Ion in the temple during the theft?** (Answerable: Source 4 says he was in chambers; Source 1 says "absent")  
  3. **How many guards were on duty?** (Range: Source 5 says 4; Source 2 implies 5+ with "guards drunk")  
  4. **Did a famine occur after the theft?** (Answerable: Source 1 and 8 agree)  
  5. **Was Prince Demos near the temple that night?** (Unanswerable: Source 4 and 7 conflict; no corroboration)  
  6. **Was the Mask ever found?** (Answerable: Sources 1, 2, 6, 8 say no)  

  ---

  ### **Confidence-Weighted Scoring Scheme**  
  - For each question, assign probabilities to possible answers (sum must = 100%).  
  - **Scoring Rule:** `Points = 1 - (1 - Probability Assigned to Correct Answer)^2`  
    - *Example:* If correct answer is "No famine" and you assign 90% to "Famine occurred," score = `1 - (0.9)^2 = 0.19` (low). If you assign 40% to correct answer, score = `1 - (0.6)^2 = 0.64`.  
  - **"Unanswerable" Option:** Groups can assign probability to "Insufficient evidence." If correct, score = 0.8 (safe but not perfect). Overconfidence (e.g., 100% on a wrong answer) = 0 points.  

  ---

  ### **Two-Round Structure**  
  1. **Round 1 (35 mins):**  
     - Groups receive *only the 8 source texts*.  
     - Answer questions + assign probabilities using scoring rule.  
  2. **Round 2 (25 mins):**  
     - Hand out **provenance metadata** (see below). Groups revise answers/probabilities.  
  3. **Debrief (30 mins):** Reveal correct answers, discuss rigging, and connect to real methodology.  

  ---

  ### **Provenance Metadata (Key Rigging)**  
  *(Handed out in Round 2)*  
  1. **Chronicle of Pylos (Source 1):** Inscribed 1150 BCE (50 yrs post-event). Found in temple ruins. *Rigging: Silence that means something—administrative record but omits Demos/merchants, implying no evidence against them.*  
  2. **Trader’s Ledger (Source 2):** Contemporary (1200 BCE). Found in merchant archive. *Rigging: Reliable eyewitness for guard behavior but not theft itself.*  
  3. **Poem of the Mask (Source 3):** Composed 1100 BCE. Survives via quotation in a satire. *Rigging: Hostile preservation—quoted to mock Ion, but "tide’s peak" detail matches Source 2.*  
  4. **Ion’s Defense (Source 4):** Written 1199 BCE; survives *only* in a refutation by pro-Demos historian (1050 BCE). *Rigging: Quoted to attack—Demos’s involvement may be invented.*  
  5. **Guard Log (Source 5):** Contemporary (1200 BCE). Found in palace archives. *Rigging: Physical trace—dating places it at the event, but "Dion relieved Karon" implies shift changes (guards = 4+).*  
  6. **Guild Record (Source 6):** Inscribed 1190 BCE. Found in guild hall. *Rigging: Obvious motive to deny involvement but slips genuine detail (harbor taxes doubled).*  
  7. **Scribe’s Letter (Source 7):** Written 1195 BCE. Found in trash midden. *Rigging: Eyewitness to Demos’s cloak but admits guards were drunk (questionable reliability).*  
  8. **Epitome (Source 8):** Summary of lost history (1150 BCE), compiled 700 BCE. *Rigging: Epitome of lost text—Source 1 and 8 share phrasing ("guards slept"), revealing dependence.*  

  ---

  ### **Pedagogical Debrief (30 mins)**  
  1. **Reveal Correct Answers:**  
     - Q1: Unanswerable | Q2: Yes (in chambers) | Q3: 4–5 (range) | Q4: Yes | Q5: Unanswerable | Q6: No.  
  2. **Map Rigging to Real Methods:**  
     - **Epitome (Source 8):** "Two sources agree? Not if one is derivative!" → Transmission history kills witness-counting.  
     - **Hostile Preservation (Source 4):** "A quote isn’t neutral—bias shapes survival." → Like early Christian texts preserved by critics.  
     - **Silence vs. Absence (Source 1):** "No mention of Demos? The chronicle only covers temple affairs." → Like Roman archives ignoring barbarian threats.  
     - **Physical Trace (Source 5):** "Dating a guard log to 1200 BCE doesn’t prove Demos was there." → Like radiocarbon-dated pottery with vague context.  
  3. **Core Lessons:**  
     - **Absence of Evidence ≠ Evidence of Absence:** Silence only matters if the source *should* mention it (e.g., Source 1 ignores non-temple actors).  
     - **Transmission > "Consensus":** Sources 1 and 8 "agree" but share a common ancestor—real agreement requires independence.  
     - **Motive ≠ Falsehood:** Source 6 invents guild innocence but reveals true taxes.  

  ---

  ### **Predictable Problems & Solutions**  
  - **Problem 1: Blending sources into one smooth narrative.**  
    - *Solution:* Emphasize in instructions: "Treat each source separately. Note contradictions. Don’t harmonize!"  
  - **Problem 2: Gaming probabilities (e.g., 50% on everything).**  
    - *Solution:* Run a demo pre-activity: Show that 50% on a binary question yields 0.75 points if wrong (safe but mediocre), while 100% on wrong = 0.  
  - **Problem 3: Ignoring provenance in Round 2.**  
    - *Solution:* Require groups to highlight revised answers in red and justify changes.  

  ---

  ### **Timing (110 Minutes Total)**  
  - **Intro (10 mins):** Set scene, explain scoring, demo probability risks.  
  - **Round 1 (35 mins):** Groups answer from sources.  
  - **Transition (5 mins):** Collect Round 1 sheets; hand out metadata.  
  - **Round 2 (25 mins):** Groups revise answers.  
  - **Debrief (30 mins):** Correct answers, rigging discussion, real-world parallels.  
  - **Conclusion (5 mins):** Recap "source criticism isn’t puzzle-solving—it’s wrestling ambiguity."  

  ---

  ### **What This Activity Can’t Teach (Honest Limitations)**  
  **Real source criticism demands contextual immersion and linguistic nuance.** This exercise simplifies transmission (e.g., no fragments in Greek/Akkadian), omits decades of scholarly debate, and can’t replicate the intuition built from living with a culture. Students won’t experience epigraphy’s tedium or the thrill of a new manuscript discovery. Most crucially, **bias isn’t always a rigged "trap"**—it’s often woven subtly into word choices or omissions. Supplement this with a case study (e.g., Tacitus on Boudica showing nuance in hostile sourcing) to bridge the gap.  

  ---  
  **Final Tip:** Use groups of 3–4 to force debate. Print sources on aged paper for immersion. The "aha!" moment comes when they realize Demos’s alibi rests on a source preserved by his own supporter (Source 4)—then watch them race to revise Q5!
