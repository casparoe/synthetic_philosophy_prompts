  The user wants the sestina's form to mirror the paradox. The rotating end-words should create the same confusion the driver feels, not knowing which exit he's at. The envoi should represent the start, where he has information but it's useless once moving. 

  Key points: The poem must convey payoffs without stating numbers explicitly. Words like "nothing" for the first exit, "home" for the second, and "somewhere worse" for missing both. The 2/3 probability should be implied, maybe through repetition or ratios. 

  I need to choose six end-words that can cyclically permute. Words like "road," "exit," "home," "wheel," "plan," "chance." These can shift meanings in each stanza. For example, "exit" could be a verb or noun, changing context. 

  Stanza structure: Each of six stanzas uses the same end-words in a specific order. The envoi uses three end-words. The permutation follows the standard sestina pattern: 6,1,5,2,4,3. 

  Ensuring the paradox comes through: The driver's plan vs. at-the-moment reasoning. In stanzas 4-5, show the conflict. The envoi starts with the driver holding keys, knowing the plan but unable to act on it later. 

  Avoid explaining the pattern. Let the repetition and shifting contexts create the feeling of disorientation. Readers familiar should infer payoffs and probability; others get a poem about uncertainty. 

  Check if the end-words' cycles reflect the driver's confusion. Each time a word reappears, its meaning might shift, like "exit" at different points. The lack of markers between stanzas mirrors not knowing which exit he's at. 

  Need to imply 2/3 without numbers. Maybe through phrases like "twice to every once" or "two chances out of three," but subtly. Use ratios in the context of the journey. 

  Payoffs: First exit "nothing," second "home," missing both "somewhere worse." Use metaphors: "void," "hearth," "strange bed." 

  The envoi's role: Only at the start does he know. Highlight the futility of planning when memory fails. End with keys in hand, emphasizing the initial clarity lost once moving.
answer: |-
  ## The Highwayman's Calculus

  The engine hums a steady road  
  ahead. Two exits, dim and deep.  
  At either, should I turn the wheel  
  toward the known, or trust the plan  
  and risk it all? For home's a chance  
  that fades if both are left behind.

  But memory's mirror leaves behind  
  no trace of miles on this road.  
  Each exit offers equal chance  
  to err. The asphalt curves in deep  
  uncertainty. I grip the plan  
  like scripture, turning no wheel.

  Yet instinct tugs: this wheel  
  should veer *now* — but is left behind  
  the moment thought begins? The plan  
  forged where perspective saw the road  
  whole, cautions: drive the deep  
  illusion. Trust the calculated chance.

  Is calculation chance  
  made law? Or does the spinning wheel  
  of choice grind hope too deep?  
  The first ramp leads to naught behind  
  a signpost. Miss that fading road,  
  and worse awaits. So whispers plan.

  Before the journey, cold clear plan:  
  At each mute mouth, take chance  
  by measured throat. Let road  
  decide *if* to command the wheel.  
  (Knowing what? Left behind  
  is certainty). The exit's deep.

  This shadowed verge feels deep  
  enough for doubt. If this is plan  
  fulfilled — the second, left behind  
  the first — then seize this chance!  
  Ignore the abstract, turn the wheel!  
  But was the *first* this very road?

  *(He stands with keys, outside the car, road map crisp, knowing the deep  
  logic of the plan: twice to every once, yield to the wheel's chance,  
  lest home be left behind. But starting drowns that clarity. Go.)*

  ---

  **End-word permutation cycle (standard sestina):**
  1. road
  2. deep
  3. wheel
  4. plan
  5. chance
  6. behind

  Stanza 1: 1, 2, 3, 4, 5, 6
  Stanza 2: 6, 1, 5, 2, 4, 3
  Stanza 3: 3, 6, 4, 1, 2, 5
  Stanza 4: 5, 3, 2, 6, 1, 4
  Stanza 5: 4, 5, 1, 3, 6, 2
  Stanza 6: 2, 4, 6, 5, 3, 1
  Envoi: 2, 4, 6 (typically middle & end words)

  **How it carries the paradox:**
  *   **Indistinguishable Exits:** Identical stanzas, cycling end-words without marking their "position," mirroring the driver's view.
  *   **Payoffs:** "Nothing" (first exit, implied by leading to naught), "Home" (second exit, the goal), "Somewhere worse" (blowing past both, "worse awaits").
  *   **The Optimal 2/3:** Implied in the envoi: "*twice* to every *once*, yield to the wheel's *chance*" (2:1 ratio = probability 2/3 of continuing).
  *   **Collision of Reasoning:** Stanza 5 ("This shadowed verge... turn the wheel!") embodies the at-the-exit impulse conflicting with the abstract plan described in Stanza 4 and initiated in the envoi. The stanza break marks the collision.
  *   **The Useless Start:** The envoi ("He stands with keys...") is the only place with clear information ("knowing the deep logic"), starkly separate and "drowned" once driving begins ("Go.").
  *   **Form as Paradox:** The relentless, unmarked cycling of words through unfamiliar slots forces the reader, like the driver, to encounter each word without context, unable to definitively place it within the sequence.
