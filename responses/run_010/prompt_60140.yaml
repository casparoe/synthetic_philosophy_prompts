  We are given a disagreement about whether Wolpert's no-free-lunch (NFL) theorems settle Hume's problem of induction. Two camps: triumphalists and deflators.

  Triumphalists: NFL theorems prove that without assumptions (like uniformity of nature), no learning algorithm is better than any other on average over all possible target functions. This is seen as formalizing Hume's point.

  Deflators: The averaging in NFL is over an artificially constructed space that includes many "scrambled" worlds without regularities, and the uniform measure is arbitrary. Hume's problem is about justifying assumptions within a world that does have regularities.

  Key observation: The group agrees on the mathematics but still argues fiercely.

  The user's experiment:
  - Created a benchmark of 200 classification tasks and ran 6 methods.
  - Built a mirror suite by defining labels to reverse the ranking of the methods (by punishing each based on its predictions). This worked cleanly.
  - But this mirror suite was defined relative to the learners (each task's labels were chosen knowing the methods' outputs).
  - Then, re-ran with relabelings that are independent of the learners (permutations of the input space, applied uniformly). The ranking barely changed (only two methods swapped, the rest held).

  User's hypothesis: The debate stalls because the two camps mean different things by "possible problem". 
  - Triumphalists: problems are defined relative to the learner (so the averaging includes worlds tailored to defeat a learner, making the average flat).
  - Deflators: problems are fixed independently of the learner (so the space of possibilities is structured, and the averaging in NFL is over an unrealistic space).

  Thus, the theorem and the objection are both true but about different things, and the argument is a verbal dispute.

  But the user is open to other possibilities: 
  - A substantive disagreement about whether a non-arbitrary measure over all possible worlds exists (probability and metaphysics).
  - Or the deflators are dodging, and triumphalists have a point that NFL puts a burden on the uniformity assumption.

  We are to diagnose the disagreement and categorize it as: verbal, hidden-formal, hidden-empirical, two-questions, bedrock, ill-posed.

  Also, address the user's experiment: does it support the hypothesis? And what would count as progress?

  Analysis:

  1. The core issue: What does it mean to "average over all possible target functions"?

     - The NFL theorem does this uniformly. But the set of all possible target functions is enormous and includes functions that are random, uncomputable, or without any regularities.

     - Triumphalists: This uniform average is the right way to capture the idea that we have no a priori knowledge. Any learning algorithm must rely on the world being structured.

     - Deflators: The uniform average is misleading because real-world problems we care about are drawn from a structured subset. The theorem doesn't address whether we can justify induction in a structured world.

  2. The user's experiment:

     - First part: Mirror suite defined relative to the learners. This is analogous to the NFL setup because the target function is chosen adversarially to the learner. Thus, we get a reversal of rankings as in NFL.

     - Second part: Relabelings independent of the learners (permutations of the input space). This is a structured transformation that preserves the underlying regularities (if any) of the original tasks. The fact that the ranking barely changed suggests that the original tasks and their permuted versions are similar in structure, so the relative performance of the methods is stable.

     - This supports the user's hypothesis: when the problem space is defined independently of the learner (by a permutation of the input space), the ranking is stable. But when defined relative to the learner (by choosing labels to punish each method), the ranking reverses.

     - The experiment shows that the NFL-style averaging (which is adversarial) leads to the flat average, but a more structured transformation (that preserves regularities) does not. This aligns with the deflators' point: the NFL average includes too many unstructured (or adversarially chosen) problems.

     - However, note that the theorem says that over the entire set of functions (with uniform measure), the average is flat. The user's experiment does not average over all functions, but only over two sets: the original and the permuted. The stability in the second part does not contradict the NFL theorem because the permuted set is a very small subset of all functions. It just shows that within a structured subset, performance differences exist.

     - The experiment is not an instance of the NFL theorem per se because the NFL theorem is about the entire space. But it illustrates the difference between an adversarial choice (relative to the learner) and a structured transformation (independent of the learner). Thus, it supports the idea that the disagreement stems from what we consider a "possible problem".

  3. The nature of the disagreement:

     - The two camps are talking past each other because they are using two different notions of the space of possibilities.

          - Triumphalists: The space is the set of all logically possible functions (with uniform measure). This is the space in which we have no prior knowledge.

          - Deflators: The space should be restricted to those functions that are "realistic" (computable, structured, etc.), and the measure should reflect the likelihood of encountering such functions.

     - This is a verbal dispute in the sense that the term "possible problem" is being used in two ways. However, there is a substantive issue underneath: what is the appropriate space and measure for evaluating learning algorithms in the context of the real world?

     - The substantive question is: Can we justify a non-uniform measure over the space of all functions that is not arbitrary? This is a foundational question in probability (e.g., the problem of priors) and metaphysics (what is the nature of possibility?).

     - But note that the deflators are not necessarily claiming they have a non-arbitrary measure. They are saying that the NFL theorem doesn't address the situation where we are in a world that has regularities, and we are trying to justify induction within that world. The triumphalists are saying that without any assumption (like uniformity), we have no justification.

     - So the underlying substantive question might be: Is the NFL theorem relevant to the real-world practice of induction? Triumphalists say yes because it shows that without uniformity, we cannot have any guarantee. Deflators say no because the real world does have structure, and the theorem doesn't tell us how to proceed in such a world.

     - However, both sides agree that in practice we need assumptions. The disagreement is about what the theorem implies for the philosophical problem.

