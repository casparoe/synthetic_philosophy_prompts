  #### Question 3: **Borderline Cases**  
  *Scenario: Consider an ambiguous case. For example:*  
  - *R: A person with parents from two racial groups.*  
  - *G: A person who is androgynous and rejects binary labels.*  
  - *M: A damaged banknote (e.g., torn, faded).*  

  *Is there a fact of the matter about whether this belongs to the kind?*  
  - **A**: Yes—objective facts determine membership, even if unclear.  
  - **B**: No—membership is fuzzy and decided by convention or context.  
  - **C**: It depends on the situation—no universal answer.  

