  - *G: Caregiving roles emerge without norms, due to biological factors.*  
  - *M: A rare stone becomes a trading tool without collective agreement.*  

  *Does the kind exist?*  
  - **A**: Yes—the pattern itself constitutes the kind, regardless of belief.  
  - **B**: No—without belief or intent, it’s just behavior, not a kind.  
  - **C**: Only if people later recognize and label it.  

