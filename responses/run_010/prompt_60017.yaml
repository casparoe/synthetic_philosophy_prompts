  #### Question 2: **Explanatory Power**  
  *Scenario: A pattern is explained by a kind. For example:*  
  - *R: Health disparities are blamed on race.*  
  - *G: Career gaps are blamed on gender.*  
  - *M: Spending habits are blamed on wealth levels.*  

  *If society stops using the kind’s label, but the pattern continues, what does this imply?*  
  - **A**: The kind was never the real cause—the pattern is explained by other factors.  
  - **B**: The kind was real and caused the pattern; its effects linger due to inertia or replacement causes.  
  - **C**: The kind was just a label for a mixed bag of causes—it never unified a real category.  

  | Domain | Options (circle one) |
  |--------|-----------------------|
  | Race   | A  B  C              |
  | Gender | A  B  C              |
  | Money  | A  B  C              |

