  ### Scoring Key  
  *Follow these steps to map your position. Use your circled answers. Total time: <5 minutes.*  

  #### Step 1: **Identify Axes**  
  - **Axis (a) Dependence on Attitudes** (Q1):  
    - Mostly **A**: Constitutive dependence (kind vanishes without belief).  
    - Mostly **B**: No dependence (kind is belief-independent).  
    - Mostly **C**: Causal dependence (structures persist without belief).  
  - **Axis (b) Explanatory Power** (Q2):  
    - Mostly **A/B**: Kind does real explanatory work (A: other causes; B: kind had causal power).  
    - Mostly **C**: Kind is a grab-bag label (no unified explanation).  
  - **Axis (c) What is Constructed?** (Q6):  
    - Mostly **A**: Ideas/classifications.  
    - Mostly **B**: Objects/roles.  
    - Mostly **C**: Subjects (people’s self-understanding).  
  - **Axis (d) Necessity of Acceptance** (Q4):  
    - Mostly **A**: Acceptance unnecessary (kind emerges from patterns).  
    - Mostly **B**: Acceptance necessary (kind requires belief/intent).  
    - Mostly **C**: Acceptance contingent (kind stabilizes via labeling).  
  - **Axis (e) Borderline Cases** (Q3):  
    - Mostly **A**: Fact of the matter (objective boundaries).  
    - Mostly **B/C**: No fact (conventional or contextual boundaries).  
  - **Axis (f) Metaphysics vs. Evaluation** (Q5):  
    - **A** in any domain: Slides "constructed" → "not real" → "bad" (detected when beneficial kind is rejected as unreal).  
    - **B/C** in any domain: Separates metaphysics from evaluation.  

  #### Step 2: **Logical Space Grid (Axes a × b)**  
  *Rows: Attitude Dependence (a)*  
  *Columns: Explanatory Power (b)*  
  |                      | **Explanatory (A/B)**                     | **Non-Explanatory (C)**                  |  
  |----------------------|-------------------------------------------|------------------------------------------|  
  | **Constitutive (A)** | 1. Constructed Realism (e.g., Searle)     | 2. Eliminativism (error theory)          |  
  | **Independent (B)**  | 3. Natural/Commodity Realism              | 4. Unnamed (incoherent: if real, must explain) |  
  | **Causal (C)**       | 5. Structural Realism (e.g., institutional) | 6. Interactive/Looping Kinds (e.g., Hacking) |  

  - **Empty Cell 4 (B+C)**: Unstable—if kind is real and belief-independent (B), it must explain something (cannot be C).  
  - **Empty Cell 3 (B+A/B)**: Politically unattractive for social kinds (implies race/gender are natural like chemicals).  

  #### Step 3: **Locate Your Position**  
  - **1. Constructed Realism**: Kind exists via constitutive rules + acceptance (Q1=A, Q2=A/B, Q4=B/C).  
  - **2. Eliminativism**: Kind is a false grab-bag; should be abolished (Q1=A, Q2=C, Q5=A in some domains).  
  - **3. Natural/Commodity Realism**: Kind is physical/biological (Q1=B, Q2=A/B, Q3=A). Common for money (e.g., gold = valuable substance).  
  - **5. Structural Realism**: Kind exists via differential treatment, not attitudes (Q1=C, Q2=A/B, Q4=A).  
  - **6. Interactive Kinds**: Kind is real and shapes subjects through labeling (Q1=C, Q2=C, Q6=C).  

  #### Step 4: **Domain Sensitivity**  
  - Compare answers across race, gender, money. Example diagnostics:  
    - **Q1 (Attitude Shift)**: Realists about money (B/C) vs. anti-realists about race (A).  
    - **Q5 (Beneficial Kind)**: Those who slide (A) in race/gender but not money reveal confusion.  
    - **Q3 (Borderline)**: "Fact of matter" (A) in money but not race/gender signals naturalism.  
  - **Templates that mislead**:  
    - Q4 (Emergence): Money often gets A (spontaneous order), but race/gender may get B/C (suggests acceptance needed).  
    - Q6 (Responsiveness): Gender often gets C (subject-construction), money rarely does.  

  #### Step 5: **Unresolved Pairs and Diagnostics**  
  - **Cannot Separate**: Constructed Realism (1) vs. Interactive Kinds (6).  
    - *Further Question*: "If a kind changes how people act, does that make it *more* real (Interactive) or just *differently* real (Constructed)?"  
  - **Honest Flags**:  
    - Q6 (Responsiveness) cannot distinguish Structural Realism (5) from Interactive Kinds (6). Use Q2: if C, then Interactive.  
    - Q5 (Slide Detector): A in any domain = collapse of "constructed," "unreal," and "bad."  

  ---

  **How to Use**: Tally your answers, plot on the grid, and note domain variations. Positions like "realist about money, anti-realist about race" emerge from mismatched answers (e.g., Q1: Money=B, Race=A). The group can then debate visible disagreements.
