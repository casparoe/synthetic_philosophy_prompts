  Hmm, they're explicitly rejecting citation-heavy academic discourse - this isn't about lit review but about raw logical requirements. The core tension they've identified (alethic purity + immodesty + guidance) feels like the crux. They're also signaling practical pain points with proxy divergence, which suggests real-world scoring dilemmas.

  Breaking it down:
  First layer is standard epistemic utility desiderata. Need to systematically address truth-directedness, additivity, continuity, propriety etc., marking non-negotiables vs preferences. The quadratic vs logarithmic score debate lurks here. 

  But the real meat is the trilemma they articulated. Let me verify:
  - Alethic purity: epistemic norms must derive purely from truth-aiming, no decision-theoretic smuggling
  - Immodesty: rational agents must expect their own credences to be optimal
  - Guidance: must help agents with imperfect self-knowledge

  *scribbles mentally* Can these cohere? Alethic purity blocks using decision rules to resolve uncertainty about one's own beliefs. But guidance requires helping agents who don't know if they've conditionalized properly - which seems to demand some decision procedure. Meanwhile immodesty assumes agents can model their own epistemic state perfectly. 

  Ah! The friction emerges when an agent doubts whether their current credence is evidence-responsive. To apply immodesty, they'd need to know their credences are well-calibrated to guide the expectation calculation - but that's precisely what they doubt. Guidance would require some norm for this uncertainty, but alethic purity forbids importing decision rules. 

  *testing counterexamples* Suppose an agent post-evidence but unsure if they updated correctly. Immodesty says "stick with your credences" - but if they suspect they botched conditionalization, this seems dogmatic. Yet suggesting any shift violates alethic purity by invoking non-alethic considerations. Stalemate.

  For proxy scoring: truth-directedness must become proxy-directedness, continuity/propriety adapt easily. But strict propriety relative to proxies is dangerous - it incentivizes pandering to the proxy's expected errors. The Brier score might avoid this if proxies are unbiased, but that's fragile. 

  *structural insight* The separating desideratum is actually the target specification: whether we're optimizing for truth or proxy. All other requirements bend to that. But since proxies are fallible, any strictly proper score for proxies will reward anticipating proxy errors - which is divergence from truth. Inescapable without ditching strict propriety or accepting incoherence.

  User's suspicion was sharp - the trilemma is genuine, and proxy scoring forces value choices they can't avoid. My response must lay this bare without academic padding, respecting their expertise while resolving the logical knots they sensed.
answer: |-
  Below is a complete specification of desiderata for an adequate theory of epistemic utility, structured to address your requirements. I first present core desiderata (truth-targeting), then analyze the trilemma (alethic purity/immodesty/guidance), and finally address **proxy divergence**. Requirements are marked **non-negotiable** (essential for coherence) or **partisan** (theoretically optional but widely adopted), with motivations, eliminations, and proxy implications.

  ---

  ### **Core Desiderata for Epistemic Utility (Truth-Targeting)**
  | **Desideratum** | **Motivation & Concrete Cases** | **Status** | **Eliminates/Challenges** |
  |-----------------|---------------------------------|------------|--------------------------|
  | **1. Truth-Directedness** <br> *Inaccuracy decreases (non-strictly) as credence moves toward truth-value (1 or 0).* | Fundamental epistemic goal: moving toward truth should never harm accuracy. If credence 0.9 in a true proposition were scored *worse* than 0.1, the measure would be truth-indifferent or perverse. | **Non-negotiable** | Eliminates measures that penalize closeness to truth (e.g., *inverse Brier score*: \( (1 - (c - v)^2) \), where v is truth-value). |
  | **2. Additive Separability** <br> *Inaccuracy of a credal state is the sum of inaccuracies for individual propositions.* | Ensures tractability and avoids holistic arbitrariness. Without additivity, scoring an entire belief state might rely on opaque interactions (e.g., penalizing "incoherent combinations" in ways that violate local truth-directedness). | **Partisan** (but near-universal) | Eliminates holistic measures (e.g., *cosine similarity* between credence/truth vectors). Favors Brier, Log, Spherical scores. |
  | **3. Continuity** <br> *Inaccuracy is continuous in credences for fixed truth-values.* | Prevents erratic jumps: similar credences should receive similar scores. A discontinuous measure could make infinitesimal credence changes catastrophic (e.g., 0.499 → 0.501 inaccuracy doubles). | **Partisan** (pragmatic) | Eliminates discontinuous measures (e.g., *step-function scores*). |
  | **4. Strict Propriety** <br> *Every probabilistically coherent credence function expects itself to be uniquely least inaccurate.* | Ensures epistemic self-trust: rational agents aren’t compelled to adopt beliefs they deem less accurate. Motivated by Dutch books for non-propriety: if your credences prefer another’s accuracy, you’d "epistemically bribe" yourself to change. | **Partisan** (critical for dominance arguments) | Eliminates non-strictly proper scores (e.g., *linear score*). Permits Brier, Log. |
  | **5. Uniqueness Agnosticism** <br> *The theory need not demand a single unique measure.* | Multiple proper scores (Brier, Log) satisfy core axioms. Forcing uniqueness requires extra constraints (e.g., *locality* or *dilation-avoidance*) that lack universal motivation. | **Partisan** (anti-dogmatic) | Opposes theories demanding *only* Log (for dilation) or *only* Brier (for convexity). |
  | **6. Partition Sensitivity** <br> *Scores should not change when splitting propositions.* | Accuracy should respect logical structure. If splitting \( P \) into \( P \land Q \) and \( P \land \neg Q \) changes inaccuracy for \( P \), the measure is arbitrary (e.g., Brier scores for partitions can misreport true loss). | **Non-negotiable** | Eliminates scores violating *partition invariance* (e.g., some *integrated measures*). Favors Brier (invariant) over Log (variant under splitting). |
  | **7. Infinity for Certain Falsity** <br> *Credence 0 in a truth → infinite inaccuracy.* | Reflects categorical error: absolute confidence in falsehood is epistemically catastrophic (e.g., assigning 0 to a true physical law). Justified by *Cromwell’s Rule*: avoid dogmatic certainty. | **Partisan** (contentious) | Eliminates measures with finite minima (e.g., *absolute-value score*). Favors Log score; Brier avoids infinity. |
  | **8. Extensibility to Imprecise Credences** <br> *The account should generalize beyond precise probabilities.* | Agents often have indeterminate beliefs (e.g., "more likely than not but no precise probability"). Failure to extend leaves key doxastic states unevaluated. | **Partisan** (emerging consensus) | Challenges theories assuming precision (e.g., *strictly proper scores* struggle with credal sets). |
  | **9. Guidance (Followability)** <br> *Norms must apply to agents with limited self-knowledge.* | Agents can’t always enumerate beliefs or compute expected accuracy. A norm requiring this (e.g., "maximize expected accuracy") is inert for humans. Motivated by forecasting tournaments: agents need tractable rules. | **Non-negotiable** | Eliminates norms requiring inaccessible calculations (e.g., *direct expected-accuracy maximization*). Favors *conditionalization* as a heuristic. |

  ---

  ### **The Trilemma: Alethic Purity, Immodesty, Guidance**
  - **Conflict**: These three are **jointly unsatisfiable**.  
    - **Alethic Purity**: Doxastic norms derive *only* from truth-aiming; no decision-theoretic elements.  
    - **Immodesty**: Agents must expect their *own* credences to be maximally accurate (via strict propriety).  
    - **Guidance**: Norms must help agents unsure of their evidence/updating (e.g., "Did I conditionalize correctly?").  
  - **Why Incompatible?**  
    - Guidance requires norms for agents with **uncertainty about their own credences** (e.g., "Am I responding rationally to evidence?").  
    - Alethic purity forbids importing decision rules (e.g., minimizing worst-case regret) to resolve this uncertainty.  
    - Immodesty assumes agents *know* their credences are rational when computing expected accuracy. If they doubt this, immodesty offers no advice without decision-theoretic tools (barred by purity).  
  - **Which to Surrender?**  
    - **Alethic purity** must be relaxed. Guidance demands *procedural* norms (e.g., "Check your conditionalization via calibration") that implicitly use decision-theoretic reasoning.  
    - *Alternative*: Keep purity but weaken immodesty to allow agents to doubt their credences (undermining dominance arguments).  
  - **Practical Resolution**:  
    Admit *pragmatic* elements for guidance (e.g., scoring rules as training tools) while preserving alethic foundations for ideal agents.  

  ---

  ### **Proxy Divergence: Desiderata Adaptation**
  When scoring against a **proxy** (e.g., committee judgment) instead of truth, desiderata transform as follows:  

  | **Desideratum** | **Status under Proxy** | **Key Change** |
  |-----------------|------------------------|----------------|
  | **Truth-Directedness** | → **Proxy-Directedness** | Must track proxy, not truth. Penalizes moving away from expected proxy, *even toward truth*. |
  | **Additivity** | Unchanged | Proxy scores still decompose across propositions. |
  | **Continuity** | Unchanged | Smoothness remains desirable. |
  | **Strict Propriety** | **Dangerous** | Rewards anticipating proxy’s *biases*. Causes divergence from truth if proxy is fallible. |
  | **Infinity for Certainty** | Lapses | Proxies can be wrong; 0 credence in a *proxy’s verdict* need not be catastrophic. |
  | **Partition Sensitivity** | Unchanged | Proxy resolution should respect logical structure. |
  | **Guidance** | Unchanged | Agents still need followable rules. |

  - **Strict Propriety & Divergence**:  
    A strictly proper score for proxy \( P \) **always rewards divergence from truth** when \( P \) is expected to err.  
    - *Example*: Proxy will declare \( X \) true with 90% probability, but your true \( P(X) = 0.2 \). Strict propriety compels you to report 0.9 to minimize expected inaccuracy *relative to \( P \)*, not truth.  
    - **Implication**: Propriety is **fatal** for truth-tracking when proxies are imperfect. Use **improper truth-directed scores** (e.g., Brier) to penalize deviation from truth, not proxy.  

  - **Separating Desideratum**:  
    **Truth-directedness** is the wedge:  
    - For *truth-targeting*, it’s non-negotiable.  
    - For *proxy-targeting*, it becomes irrelevant or harmful.  
    - **Solution**: Use a strictly proper score **only if** the proxy is ground truth. Otherwise, use a truth-directed but improper score (e.g., Brier) to discourage gaming the proxy.  

  ---

  ### **Summary Recommendations**
  1. **For Truth-Targeting**:  
     - **Core**: Truth-directedness, additivity, guidance.  
     - **Surrender alethic purity minimally** for guidance (e.g., accept calibration checks).  
     - **Avoid logarithmic scores** if partition sensitivity is required.  

  2. **For Proxy Scoring**:  
     - **Abandon strict propriety** to avoid rewarding divergence.  
     - **Use truth-directed scores** (e.g., Brier) and accept they may be improper for the proxy.  
     - **Never use proxy-proper scores** (e.g., Log for committee judgments) if proxies err systematically.  

  The single desideratum doing "separating work" is **truth-directedness**: its retention or abandonment defines whether you prioritize truth or proxy alignment. In your tournament, for unresolved questions, a **Brier score** (truth-directed, continuous, partition-insensitive) is preferable to strictly proper alternatives to discourage proxy-pandering.
