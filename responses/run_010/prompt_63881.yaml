prompt: |-
  I work on embedded control systems, and my working life is spent moving between models of the same plant at different resolutions: switching transients, gate-level logic, a lumped-parameter state-space model, and finally a block diagram of setpoints, sensors, and feedback loops. I am fluent in that stack and in the apparatus that disciplines it — state variables and trajectories; abstraction maps that assign each fine-grained state a coarse-grained one; simulation relations certifying that every coarse transition is matched by fine behaviour; intervention understood as exogenously fixing a variable and cutting its incoming dependence; and the standing practice that a coarse model is validated only relative to designated outputs, within a tolerance, and for a designated purpose. I have also read enough philosophy of mind to state the causal exclusion argument to myself: the causal closure of the physical, the supervenience of mental properties on physical ones, the principle that if a physical state is causally sufficient for an effect no distinct mental state has work left to do, and the claim that systematic overdetermination is not a serious fallback — so that nonreductive physicalists are driven toward identity on one side or epiphenomenalism on the other.

  Please restate that argument, premise by premise, in the vocabulary above. Give me closure, supervenience, the distinctness of the mental from the physical, the exclusion principle, the rejection of overdetermination, and the conclusion each rendered in terms of state variables, abstraction maps, certified simulation relations, interventions, unmodelled inputs, and conservation accounting. Where a philosophical notion has no slot in my vocabulary, leave the slot visibly empty rather than filling it with the nearest thing I own.

  One discipline I will insist on: no smuggling. If you render cause as difference-making under intervention, say so explicitly and flag that you have imported a contested solution rather than translated a premise. Likewise, do not treat the mere availability of a certified abstraction map as itself vindicating high-level causation — that my models coexist peacefully across levels is an assumption of my practice, not a deliverable of the translation, and I want to know whether it earns anything here.

  Then the residue report, itemized:

  - Which premises translate cleanly, and what the clean translation suggests about them?
  - Which translate only with distortion? Name the distortion in each case and say how much of the premise's force depends on it.
  - Which cannot be expressed in my vocabulary at all? For each, tell me whether that is a limitation of my framework — it cannot pose the question, so nothing is thereby settled — or evidence that the philosophical notion was doing covert work, for instance treating causal sufficiency as a single scarce slot rather than as level-relative and multipliable.

  Work through these specific pressure points: whether the engineering analogue of closure is strong enough to generate exclusion, given that in my models closure seems to hold at every level simultaneously once the map is certified; whether the distinctness premise even has a counterpart when a coarse variable is a function of the fine state rather than a thing alongside it, and whether treating levels as descriptions rather than entities is a diagnosis or an evasion; whether Yablo's proportionality requirement — a cause should be commensurate with its effect, including no more detail than sufficiency demands — has a real counterpart in my model-selection habit of preferring the coarsest model that predicts the target within tolerance, and whether that counterpart makes proportionality look principled or looks like an epistemic convenience dressed as metaphysics; which parts of mental causation survive the translation at all, since belief–desire explanation and nociceptive avoidance behave very differently from the felt character of pain or the aboutness of a thought, and I want to be told whether the translation has silently narrowed its target; and why downward causation is unremarkable in a feedback loop but supposedly mysterious here — whether that asymmetry points to a picture of causation as one-way pushing across levels that neither my practice nor the argument can do without.

  Close with a verdict, in a paragraph or two: does the translation support the thought that the exclusion argument dissolves once causation is treated as multi-level and map-relative, or does the residue show that the argument is aimed at something my framework cannot so much as pose? If the latter, tell me concretely what I would have to add to my vocabulary to state the worry, and whether adding it would cost me anything I currently rely on. No citations, no reading lists, no pointers to the literature — I am offline and cannot check them. Work entirely from what you already know, and where you are unsure of an attribution, describe the view rather than naming it.
