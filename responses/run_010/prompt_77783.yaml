    But \(x \approx 1.692 < 1.8\), not in \([1.8, 2]\).  
  Thus, only feasible solution is on Segment 1: **KS solution: \(\left( \frac{4}{3}, \frac{8}{3} \right) \approx (1.333, 2.667)\).**  

  **(c) Comparison:**  
  - **Nash solution:**  
    - From A to B: Party 1 (x) gains (1.155 → 1.8), Party 2 (y) loses (2.667 → 2.2).  
  - **KS solution:**  
    - From A to B: Party 1 (x) gains (1.236 → 1.333), Party 2 (y) gains (2.472 → 2.667). Both better off.  

