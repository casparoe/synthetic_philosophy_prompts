  ### Axiom and Formula Sheet  
  #### Bargaining Axioms  
  1. **Pareto Optimality:** The solution must lie on the Pareto frontier (no alternative improves one party without harming the other).  
  2. **Symmetry:** If the problem is symmetric, the solution must be symmetric.  
  3. **Invariance to Rescaling:** The solution is unchanged if either party’s utility is rescaled (multiplied by a positive constant).  
  4. **Independence of Irrelevant Alternatives (IIA):** If the feasible set shrinks but the original solution remains feasible, it is still the solution in the smaller set.  
  5. **Monotonicity:** If the feasible set grows but neither party’s *best possible payoff* (ideal point) changes, then no party ends up worse off in the new solution.  

  #### Calculus and Geometry Notes  
  - Derivative of \(x^n\): \(\frac{d}{dx}(x^n) = nx^{n-1}\)  
  - Quadratic formula for \(ax^2 + bx + c = 0\): \(x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}\)  
  - Line between points \((x_1, y_1)\) and \((x_2, y_2)\): Slope \(m = \frac{y_2 - y_1}{x_2 - x_1}\), equation \(y - y_1 = m(x - x_1)\).  

  #### Key Definitions  
  - **Nash solution:** Maximizes the product \(x \cdot y\) over the feasible set.  
  - **Kalai–Smorodinsky (KS) solution:** Satisfies \(\frac{x}{u^*} = \frac{y}{v^*}\), where \((u^*, v^*)\) is the ideal point (best possible payoffs). Must lie on the Pareto frontier.  
  - **Ideal point:** \((u^*, v^*) = (\max x, \max y)\) over the feasible set, assuming disagreement point (0,0).  

