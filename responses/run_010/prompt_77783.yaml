  The feasible set in all problems includes the disagreement point (0,0), and free disposal is assumed (if an outcome is available, so is any outcome with lower or equal utility for both parties). Utilities are normalized such that (0,0) is the disagreement point.  

  **Problem A:** The feasible set consists of all points \((x, y)\) with \(x \geq 0\), \(y \geq 0\), and \(y \leq 4 - x^2\).  

  **Problem B:** The feasible set is the smallest convex, downward-closed set containing all of Problem A and the additional point \((1.8, 2.2)\).  

