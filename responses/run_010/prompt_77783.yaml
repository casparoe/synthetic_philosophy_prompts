  #### Part 3: IIA Analysis  
  **(a) Problem C:**  
  Define Problem C as the convex hull of points \((0,4)\), \((1.8, 2.2)\), \((2,0)\), and \((0,0)\), with downward closure. This is identical to the feasible set of Problem B. However, to show KS violates IIA, a better example is needed. Consider:  
  - **Problem C:** Feasible set is the convex hull of \((0,4)\), \((1.333, 2.667)\), \((1.8, 2.2)\), \((2,0)\), and \((0,0)\) (downward-closed).  
    - Pareto frontier: Segment from \((0,4)\) to \((1.333, 2.667)\) (equation \(y = 4 - x\), since slope = \(\frac{2.667 - 4}{1.333 - 0} = -1\)), and segment from \((1.333, 2.667)\) to \((2,0)\) (equation \(y = -8x + 12.667\), as slope = \(\frac{0 - 2.667}{2 - 1.333} = -4\)).  
    - Ideal point: \((2, 4)\) (unchanged).  
    - KS for C: Solve \(y = 2x\):  
      - On first segment: \(2x = 4 - x \implies x = \frac{4}{3} \approx 1.333\), \(y = \frac{8}{3} \approx 2.667\).  
      - On second segment: \(2x = -8x + 12.667 \implies 10x = 12.667 \implies x = 1.2667\), \(y = 2.533\), but \(x = 1.2667 < 1.333\), not in \([1.333, 2]\).  
      Thus, **KS solution for C: \(\left( \frac{4}{3}, \frac{8}{3} \right)\).**  
  - Now, **Problem D** (subset of C and B): Convex hull of \((0,4)\), \((1.333, 2.667)\), \((2,0)\), \((0,0)\).  
    - Pareto frontier: Segment \((0,4)\) to \((1.333, 2.667)\) (\(y = 4 - x\)), and segment \((1.333, 2.667)\) to \((2,0)\) (\(y = -8x + 12.667\)).  
    - Ideal point: \((2, 4)\).  
    - KS for D: Solve \(y = 2x\):  
      - On first segment: Same as above, \(\left( \frac{4}{3}, \frac{8}{3} \right)\).  
      - On second segment: \(2x = -8x + 12.667 \implies 10x = 12.667 \implies x = 1.2667\), not in \([1.333, 2]\).  
      **KS solution for D: \(\left( \frac{4}{3}, \frac{8}{3} \right)\), same as for C and B.**  
  To show failure, use:  
  - **Problem E:** Feasible set = convex hull of \((0,4)\), \((1, 3)\), \((2,0)\), \((0,0)\) (downward-closed). This is part of B since \((1,3)\) satisfies \(y \leq 4 - x^2\) for A and is in B.  
    - Pareto frontier: Segment \((0,4)\) to \((1,3)\) (slope = \(\frac{3-4}{1-0} = -1\), so \(y = 4 - x\)), and segment \((1,3)\) to \((2,0)\) (slope = \(\frac{0-3}{2-1} = -3\), so \(y = -3x + 6\)).  
    - Ideal point: \((2,4)\).  
    - KS solution: Solve \(y = 2x\):  
      - On first segment: \(2x = 4 - x \implies x = \frac{4}{3} \approx 1.333\), but \(x = 1.333 > 1\), not in \([0,1]\).  
      - On second segment: \(2x = -3x + 6 \implies 5x = 6 \implies x = 1.2\), \(y = 2.4\) (since \(y = 2 \times 1.2 = 2.4\)). Verify: \(-3(1.2) + 6 = 2.4\), and \(1 \leq 1.2 \leq 2\).  
      Thus, **KS solution for E: \((1.2, 2.4)\).**  
  - The KS solution for B is \(\left( \frac{4}{3}, \frac{8}{3} \right) \approx (1.333, 2.667)\), which is feasible in E (since \(y = 2.667 \leq 4 - (1.333)^2 \approx 4 - 1.777 = 2.223\)? No, 2.667 > 2.223, so not in E). To ensure feasibility, define:  
    **Problem C:** Feasible set = convex hull of \((0,4)\), \((1.8, 2.2)\), and \((0,0)\) (downward-closed).  
    - Pareto frontier: Single segment from \((0,4)\) to \((1.8, 2.2)\) with \(y = 4 - x\) (as slope = \(-1\)).  
    - Ideal point: Since \(\max x = 1.8\), \(\max y = 4\), so \((1.8, 4)\).  
    - KS solution: Solve \(\frac{x}{1.8} = \frac{y}{4}\) and \(y = 4 - x\):  
      \[
      \frac{x}{1.8} = \frac{4 - x}{4} \implies 4x = 1.8(4 - x) \implies 4x = 7.2 - 1.8x \implies 5.8x = 7.2 \implies x = \frac{7.2}{5.8} = \frac{72}{58} = \frac{36}{29} \approx 1.241, \quad y = 4 - 1.241 = 2.759.
      \]  
      **KS solution for C: \(\left( \frac{36}{29}, 4 - \frac{36}{29} \right) \approx (1.241, 2.759)\).**  
    The KS solution for B is \(\left( \frac{4}{3}, \frac{8}{3} \right) \approx (1.333, 2.667)\), which is feasible in C (since C is a subset of B, and \((1.333, 2.667)\) is on the line \(y = 4 - x\) and \(0 \leq 1.333 \leq 1.8\)). But in C, KS gives \((1.241, 2.759) \neq (1.333, 2.667)\).  

  **(b) Why KS violates IIA:**  
  IIA requires that if the solution in a larger set (B) is feasible in a smaller subset (C), it remains the solution in the subset. Here, KS for B is \((1.333, 2.667)\), feasible in C, but KS for C is \((1.241, 2.759)\). Since it changed, KS violates IIA.  

  **(c) Why Nash does not violate IIA in A and B:**  
  Nash solution for A is \(\left( \frac{2\sqrt{3}}{3}, \frac{8}{3} \right) \approx (1.155, 2.667)\). In Problem B, is this point feasible? At \(x \approx 1.155\), in B, \(y\) must be \(\leq 4 - x \approx 4 - 1.155 = 2.845\). Since \(y = 2.667 \leq 2.845\), it is feasible. However, Nash for B is \((1.8, 2.2)\), not the same as in A. But this does not violate IIA because IIA requires that if the set *shrinks* and the old solution remains feasible, it should still be the solution. Here, B is an *expansion* of A, and IIA does not apply to expansions. For IIA violation, we need a contraction where the old solution is feasible but not chosen—which A and B do not provide.  

