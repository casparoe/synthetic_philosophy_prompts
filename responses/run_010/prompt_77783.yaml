  #### Part 4: Fairness and Monotonicity  
  The monotonicity axiom states that if the feasible set grows without changing the ideal point, no party should be worse off. This reflects fairness: expanding opportunities should not harm anyone. In Problems A and B, the ideal point remains \((2,4)\), but the Nash solution makes Party 2 worse off (y from 2.667 to 2.2), violating monotonicity and fairness. Party 2 is penalized despite no change in their best possible outcome. Conversely, KS satisfies monotonicity (both gain: x: 1.236→1.333, y: 2.472→2.667), aligning with fairness.  

  Monotonicity is not merely a technical repair; it addresses a moral intuition: gains from cooperation should be shared when the "pie" grows, even if the "slice limits" (ideal point) are unchanged. Nash’s IIA and symmetry are insufficient here, as Nash prioritizes the product maximization, which can ignore equitable gains.  

  In symmetric problems (e.g., \(y \leq 4 - x^2\) mirrored), both solutions agree at symmetric points (e.g., if symmetric, x = y). Nash maximizes \(x \cdot x = x^2\), KS sets \(x/u^* = y/v^*\) with \(u^* = v^*\), so \(x = y\). Thus, disagreement arises only in asymmetric cases, like our curved frontier, where Nash’s focus on the product versus KS’s focus on proportional gains creates tension. The core dispute is balancing efficiency (Nash) against equity under expansion (KS).  

