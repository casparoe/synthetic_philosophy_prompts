  First, I notice they're testing two key claims simultaneously: whether partial memory restores "local decision" legitimacy, and why epistemic credences work for side bets but not actions. Clever framing - it pressures the "no free-standing credence" pillar of my position. The noisy memory variant is particularly sharp because it creates two information sets while maintaining memory imperfection.

