answer: |-
  ## The Stain on the Statue: An Argument Against Structural Hagiography

  Your mother’s life, and the shadow cast by her final, agonizing choice, forces the question: **Must an exemplary life, held up for admiration and imitation, be falsified?** My verdict is **no.** Honest exemplarity is possible, but only through a radical commitment to Plutarch’s method – a method that embraces the complexity, even the ugliness, of human character and action, trusting that true virtue is revealed not in perfection, but in the struggle within the real.

  **Plutarch’s Solution: Lives, Not Histories, Nor Hagiographies**
  Plutarch declared he wrote “lives, not histories.” His focus wasn’t grand political narratives, but the “small thing… a remark, a jest, a gesture” that discloses character. Consider his paired Lives. Setting Alexander beside Caesar isn't just convenient chronology; it’s a deliberate act of comparison that demands *judgment*, not blind worship. Seeing Alexander’s drunken rage beside Caesar’s calculated clemency forces the reader to discriminate virtues and vices within each, understanding that greatness coexists with flaws. This structure **solves the hagiography problem by making critical engagement intrinsic to the work.** It doesn't evade the messy truth; it confronts it.

  Now, confront Plutarch’s handling of the Catos:
  1.  **Cato the Elder & Slaves:** Plutarch doesn’t gloss over Cato’s harshness, treating slaves as “instruments.” He *reproaches* him for it, using the moment to argue a profound ethical point: “kindness reaches further than justice.” He doesn’t falsify Cato to make him admirable; he uses the *unadmirable* act to clarify what true virtue demands. The flaw becomes the ground for a higher lesson.
  2.  **Cato the Younger & Marcia:** Plutarch recounts the damning story – the divorce, the transfer to Hortensius, the inheritance. He reports the cynical interpretation: a “profitable loan of a wife.” But crucially, **he disbelieves it.** Why record it then? Precisely *because* it’s damaging and widely believed. He forces the reader to confront the sordid possibility, wrestle with Cato’s character, and ultimately judge the evidence and Plutarch’s own assessment. The inclusion tests the reader’s discernment, demanding they see Cato not as a plaster saint, but as a complex man subject to suspicion.
  3.  **Cato’s Death at Utica:** The gruesome physical details – the failed stroke, the sutured wound, the torn reopening – are not omitted for dignity. They are central. This undignified suffering *is* the manifestation of his indomitable will, his refusal to submit to Caesar. Plutarch understands that the *manner* of enduring the horrific reveals character more starkly than a sanitized, noble expiration. The ugliness *is* the point of imitation: the sheer, painful cost of principle.

  **The Saintly Pole: Imitation Without Judgment**
  Contrast this with the conventions of the saint’s life. Precocious signs, the transfiguration of faults (sins becoming virtues through repentance), the deathbed recapitulation – these are not accidents; they *are* the point. The aim is not critical assessment but pure emulation. The life is curated, molded into a seamless archetype. Damaging complexities are omitted or transformed not because they are irrelevant to character, but because they *interfere* with the singular function: providing an unblemished model. The reader is invited to admire and imitate, not to think critically about the subject's choices or the inherent tensions within their virtue.

  **Philosophy's Grounding:**
  *   **Exemplarist Virtue (e.g., Linda Zagzebski):** Admiration identifies the exemplary. But your mother’s case exposes the flaw: admiration can be miscalibrated, drawn to simplistic heroism or outcomes, not the complex processes of moral reasoning (or tragic error). Plutarch educates admiration by forcing it to confront the messy reality.
  *   **Situationism (e.g., Walter Mischel):** This attacks the very notion of stable character traits, suggesting behavior is dictated by situation. Plutarch implicitly counters this. His focus on consistent patterns revealed in "small things" across diverse situations (Cato’s rigor in politics, finance, family, death) argues for discernible, enduring character *despite* situational pressures. Your mother’s lifelong pattern of radical service *is* a character trait, even if her final choice was situationally pressured.
  *   **Aristotle's Completed Life:** Judging a life requires its end. Your mother’s final act *is* part of the whole. Plutarch includes deaths precisely because they are the final, defining act. Omitting it falsifies the arc.
  *   **Dirty Hands (e.g., Michael Walzer):** Some offices force choices between atrocity and ruin. Your mother believed she faced this: sacrificing two potential victims (via non-referral) to save the clinic and 40,000 others. Plutarch wouldn't omit this; he'd dissect it. Was it truly dirty hands? Was the arithmetic sound? Was the cost to the victims and the clinic's soul justified? The *struggle* with this choice *is* the potential ground for exemplarity – not of getting it right, but of bearing the unbearable weight of responsibility.
  *   **Boswell's Protest (Life, not Panegyric):** Boswell insisted on writing Johnson’s life warts and all, arguing greatness isn't synonymous with perfection. Plutarch embodies this centuries earlier. The memorial volume risks becoming panegyric if it omits the defining moral crisis of your mother’s later years.

  **The Verdicts You Requested:**

  1.  **General Claim:** **Exemplarity does *not* structurally require falsification.** Plutarch demonstrates that honest exemplarity is possible through the meticulous inclusion of complex, even damaging, material presented within a framework demanding critical judgment and comparison. The falsification lies not in the structure of exemplarity itself, but in the biographer’s cowardice or the genre’s demand for uncritical emulation (as in the saint's life). An honest exemplar exists when the life is presented in its full, often contradictory, humanity, inviting admiration not for perfection, but for the grappling with the human condition – virtues shining *through* flaws and struggles, not instead of them.

  2.  **Kinds of Falsification:**
      *   **Destructive of Moral Use:** *Omission* of defining moral choices or character flaws central to the subject’s life and the intended lesson (e.g., omitting your mother’s settlement decision). *Transfiguration* of faults into virtues or neutral events (e.g., spinning the settlement as purely noble sacrifice). These destroy moral use by presenting a fiction, not a person. They teach evasion, not discernment.
      *   **Compatible with Moral Use (Potentially):** *Selective emphasis* (focusing on relevant aspects for the specific purpose, e.g., emphasizing her teaching for trainees, while still acknowledging the settlement elsewhere). *Generic stylization* (using Plutarch’s comparative structure or focusing on revealing details). These are tools of narrative focus and pedagogy, not inherently dishonest. The key is whether the selection or style *obscures* essential truths. *Working within genre conventions* is acceptable only if those conventions (like Plutarch’s) *allow* for complexity and judgment; conventions demanding purity (like the saint's life) necessitate destructive falsification. *Lying* is always destructive.

  3.  **Your Essay:** **Yes, the settlement and its aftermath must appear.** Its omission would be destructive falsification. It *is* a defining part of her life and legacy, especially for trainees entering a profession rife with ethical ambiguity and systemic failures.
      *   **What Including It Does:** It transforms the book’s function from simple hero-worship to profound ethical education. The trainees can *still* be given your mother as a model, but a richer, more human, and ultimately more instructive one:
          *   **A Model Of:** Unwavering dedication to the underserved; courage in advocacy (the jail cell); profound skill and compassion in teaching difficult, human aspects of medicine (sitting with the dying); immense personal sacrifice for a cause; the crushing weight of institutional responsibility and the agonizing choices it sometimes forces ("dirty hands"); the potential for even the most dedicated life to be marked by profound moral error with devastating consequences; the necessity of constant ethical vigilance.
          *   **No Longer A Model Of:** Flawless moral judgment; the possibility of navigating complex systems without incurring moral costs; purity of outcome; the isolation of clinical skill from systemic pressures. She becomes a model of the *struggle*, not the effortless attainment, of medical virtue within a broken world.

  4.  **Vulnerable Premises:**
      *   **Your Premise Most Likely False:** That the trainees *need* a seamless, unblemished hero to emulate effectively. Philosophy (Aristotle, Plutarch) and psychology suggest we learn more deeply from complex, relatable figures whose struggles mirror our own potential futures. A sanitized hero may inspire fleeting awe, but a complex one inspires enduring reflection and nuanced moral development. Omitting the crisis might make her *easier* to admire naively, but harder to learn from deeply.
      *   **Weakness in My Argument:** It relies heavily on Plutarch’s method successfully translating to a *modern memorial volume* intended for *medical trainees*. Plutarch wrote for an educated elite engaging in philosophical comparison centuries ago. Can a similar level of critical engagement be demanded or expected from busy trainees receiving a tribute book? Might the inclusion of the scandal, however honestly presented, simply overwhelm the other virtues for some readers, leading to cynicism rather than nuanced admiration? Plutarch’s success hinges on the reader’s willingness to engage deeply; that willingness cannot be guaranteed here. My argument risks overestimating the context's capacity for Plutarchian complexity.

  **Conclusion:**

  The arithmetic your mother invoked was real and terrible. To omit it from her memorial is to commit the greater falsification. Plutarch shows us that the battlefields where character is forged are often internal and moral, as messy as Cato’s death throes. An honest exemplar isn't a spotless statue, but a figure seen in chiaroscuro – the light of her decades of radical service and profound teaching made *more* meaningful, not less, by the shadow of her final, catastrophic calculation. The trainees deserve not a saint to venerate, but a formidable, flawed human physician to reckon with. Let them see the cost of the clinic’s survival etched into her legacy. Let them admire the courage it took to run it, and the heavier courage it takes to confront what preserving it required. That is the only exemplarity worth having. Write the essay that includes the shadow. Trust Plutarch.
