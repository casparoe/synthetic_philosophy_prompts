prompt: |-
  I'm a second-year philosophy PhD student working on mathematical evidence, and last year I sat in on our analytic number theory reading group so I could write about how unproved conjectures get justified in that field. I've drafted an argument for a seminar next month that started out as a way of making precise something the number theorists kept gesturing at in discussion, and it now looks like it proves far too much. Two people in the seminar do analytic number theory for real, so I'd rather get torn apart by you first. One thing I keep coming back to: the field knows perfectly well that heuristics plus computation can lie — the Mertens conjecture had close to a century of numerical checks behind it before Odlyzko and te Riele killed it in 1985, and to this day nobody has actually located an n where it fails. My advisor read the draft and said only that I'm sliding between two senses of something in the middle, which isn't enough to go on. Here it is:

  (1) When number theorists say a counting conjecture is supported heuristically, the procedure is roughly: pretend the integers are sampled at random, assign each n a probability of having the property in question (1/log n for primality), assume independence across different n and across different primes, compute the expected count, and note that it matches the data to several digits. That match is then cited as evidence, and the conjecture gets described as morally certain despite having no proof.

  (2) The match can't be evidence that the integers really are random, since they plainly aren't — primality is deterministic and every pair (n, n+2) has a settled answer. So what the match is evidence for is the weaker claim that the primes behave, for counting purposes, as if they were independent random variables with the right marginal densities. Call this the presumption of independence.

  (3) But the presumption, taken by itself, systematically gets the answers wrong. For twin primes, multiplying out the naive densities gives x/(log x)², whereas the conjecture everyone believes has a singular series in front of it — a product over the odd primes of local correction factors, there because the events "n is not divisible by p" and "n+2 is not divisible by p" are not independent. Cramér's model says the largest prime gap below x should be about (log x)², and Granville's refinement says the constant ought to be 2e^(-γ), roughly 1.12 rather than 1, again because of divisibility by the small primes. Maier's theorem says the model fails outright for intervals of length (log x)^A: the ratio of the actual prime count to the predicted one doesn't tend to 1 at all, its lim sup is above 1 and its lim inf below. And the model has no room for Chebyshev's bias, where primes congruent to 3 mod 4 outnumber those congruent to 1 mod 4 the overwhelming majority of the time, even though Littlewood showed the lead changes hands infinitely often.

  (4) In every one of those cases the correction is not extracted from the presumption of independence. The presumption says the correction factor is 1. The correction comes from separate arithmetic reasoning about the primes one at a time, and then gets multiplied in afterwards.

  (5) So "the heuristic method" is not one method with a track record. It is a schema plus an open-ended supply of correction factors, and which corrections get included is settled by which version of the schema reproduces the data the field already has.

  (6) A procedure whose free adjustments are chosen to fit the data cannot fail to fit the data, and a procedure that cannot fail confirms nothing.

  (7) Therefore heuristic arguments in analytic number theory provide no evidence for the conjectures they are cited in support of.

  (8) But (7) can't be the whole story. The Hardy–Littlewood constants have been checked numerically over enormous ranges and nobody in the field doubts them; the field uses heuristic agreement to rank which unproved conjectures are worth attacking and that ranking has a decent hit rate; and when a heuristic fails, as with Maier, people treat it as a signal to refine the model rather than as a refutation of the whole approach — which only looks rational if they think the approach is tracking something real.

  (9) And the same reasoning, applied to anything with fitted parameters — every regression, every effective field theory with its counterterms, every virial expansion — would show that no fitted model ever confirms anything, which is obviously false.

  (10) So something went wrong between (1) and (6), and I can't find it.

  Which step do you reject? Name the premise or the transition, explain why it looked unobjectionable to me when I wrote it, and then price the alternatives — for each of the steps I could give up instead, what would have to be true of the actual practice for giving it up to be tolerable. I'd rather keep (1), since I'm fairly confident it's a fair description of what people do and I don't want to say the singular series is a fudge, and I'd rather keep (8) too, because the alternative is claiming the field has no epistemology at all. If you think the argument is valid and I just have to eat (7), say so — but then tell me what number theorists are actually doing when they call a conjecture morally certain. Give me your bottom line in the first sentence, just the step number and a clause, and then the reasoning; no preamble and don't restate the question back at me.
reasoning: |-
  Okay, the user is a philosophy PhD student focusing on mathematical evidence, specifically how unproved conjectures in analytic number theory are justified. They've drafted an argument that seems to prove too much, and they're worried about presenting it in a seminar with actual number theorists. Their advisor mentioned they're sliding between two senses of something, but that wasn't clear enough. The user wants me to identify which step in their argument is flawed and explain why.

  Looking at their argument, step (1) describes the heuristic method number theorists use: treating integers as random, assigning probabilities (like 1/log n for primality), assuming independence, and matching expected counts with data. Step (2) says this match can't prove integers are random but supports a "presumption of independence." Step (3) points out this presumption often fails, giving examples like twin primes needing a singular series correction, prime gaps, Maier's theorem, and Chebyshev's bias. Step (4) notes these corrections come from arithmetic reasoning, not the presumption itself. Step (5) concludes the heuristic method isn't one method but a schema with added corrections chosen to fit data. Step (6) argues that since the procedure fits data by design, it can't provide evidence. Step (7) says heuristics provide no evidence. But step (8) counters this, noting that the field relies on these heuristics successfully. Step (9) extends the argument to other fields, which would invalidate all fitted models, but that can't be right. Step (10) admits something's wrong.

  The key flaw is in step (6). The user claims that because corrections are chosen to fit existing data, the procedure can't fail and thus confirms nothing. But this misrepresents how heuristics work. In reality, these models are used predictively. For example, the Hardy-Littlewood conjecture for prime pairs wasn't just fitted to data; it was derived from first principles considering local factors, and then numerical checks over large ranges confirmed it. Similarly, Granville's correction to Cramér's model was based on theoretical insight about small primes, not just data fitting. 

  Maier's theorem is actually a point in favor of heuristics. When Maier showed that the simple model failed for certain interval lengths, it didn't discard the heuristic approach but refined it. This is how science progresses—models get adjusted based on new evidence, and the ability to explain anomalies strengthens the approach's credibility. 

  The user's step (6) assumes that because corrections are added, the model is unfalsifiable. But in practice, heuristics make testable predictions beyond existing data. For instance, the singular series in twin primes predicts the asymptotic density, which is then checked against new computations. If it didn't match, the model would be questioned. The Mertens conjecture is a perfect counterexample: heuristics suggested it might be false despite initial computational support, and it was eventually disproved. So heuristics can indeed fail, and when they align with data, that provides evidence. 

  The user wants to keep steps (1) and (8). Step (1) is accurate, and step (8) correctly notes the field's success. The problem is in conflating "fitting existing data" with being unfalsifiable. Heuristics are explanatory frameworks that generate predictions. Corrections like the singular series come from deeper arithmetic considerations, not arbitrary curve-fitting. This makes the models constrained and predictive. 

  The alternative—rejecting step (7)—would mean accepting that heuristics provide no evidence, which contradicts the field's practices. Rejecting step (3) or (4) isn't feasible because they correctly identify limitations. Step (5) is partially true but oversimplifies; the schema isn't arbitrary because corrections are theoretically motivated. 

  So the bottom line is step (6) is wrong. The procedure can fail if new data contradicts predictions, as seen in Mertens. Heuristics provide evidence by generating risky predictions that survive tests, and corrections are based on principled mathematical insights, not just data fitting.
answer: |-
  **(6)** is the flawed step. It misrepresents the nature of the "free adjustments" in heuristic models and misapplies the concept of falsifiability to this context. The step appeared plausible because you conflated *post hoc data fitting* with *theoretically motivated model refinement*, treating all corrections as arbitrary parameters tuned solely to match existing data. In reality, the corrections (like the singular series) are derived from deterministic arithmetic constraints, not freely chosen to fit. This makes the procedure falsifiable.

  ### Why (6) fails:
  1. **Corrections are constrained, not free:** The "adjustments" (e.g., Hardy-Littlewood constants) are **not free parameters** but products of rigorous local analysis (e.g., solving for the density of \(n\) and \(n+2\) both avoiding residue classes modulo small primes). The singular series is fixed by number theory, not tuned to data. Its form is determined *before* numerical verification.
  2. **The procedure *can* fail:** Heuristics *are* falsifiable when predictions diverge from new computations or when the model generates contradictions. The Mertens conjecture is the exemplar: heuristics (rooted in probabilistic models of the Möbius function) suggested it was *false* despite early computational support, and it was disproved. If the Hardy-Littlewood twin prime constant had clashed with later counts (e.g., for large \(x\)), the model would have been challenged.
  3. **Predictive power beyond fitted data:** Heuristics often predict asymptotic densities *before* extensive computation (e.g., the Bateman-Horn conjecture). Agreement over larger \(x\) tests the model's validity, not just its tuning. Granville's correction to Cramér’s model was a *prediction* (constant \(2e^{-\gamma}\)) that could have conflicted with gap data.

  ### Alternatives & costs of rejecting other steps:
  - **Reject (5):** Accept that heuristics are a unified method with corrections *internal* to the schema. *Cost:* Must argue that local factors (like the singular series) are implicit in the "random" model once dependencies are accounted for (e.g., via inclusion-exclusion). This strains the "random integers" metaphor but aligns with how number theorists describe refining models.
  - **Reject (7):** Concede heuristics *do* provide evidence. *Cost:* Requires accepting that evidence can emerge from models whose corrections are *systematic* (arising from deterministic theory) rather than *ad hoc*. This is tolerable, as the field treats corrections as mathematically necessary, not flexible.
  - **Reject (3)/(4):** Claim the presumption of independence *doesn’t* fail systematically. *Cost:* Deny established results (Maier, Chebyshev bias). This is untenable; the flaws are mathematical facts.

  ### Bottom line for number theorists' "moral certainty":
  They treat heuristic agreement as evidence when:  
  (i) The model incorporates *all known local obstructions* (e.g., small prime dependencies),  
  (ii) Predictions hold over many orders of magnitude (e.g., \(x \to \infty\)),  
  (iii) Competing models are absent or refuted.  
  This is analogous to trusting a physical theory that survives stringent tests—not because it's unfalsifiable, but because it *could* fail and doesn’t. The Mertens example shows they *do* weight heuristic disproofs over computational evidence.
