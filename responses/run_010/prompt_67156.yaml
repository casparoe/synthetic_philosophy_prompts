  **Answers to Your Questions**  
  **1. "Did the Council grant a charter no member granted?"**  
  This overstates the case. The Council, as a body, applies rules collectively. No single member has authority to grant a charter; the outcome emerges from aggregated criteria votes under the handbook rule. It’s not that the Council "believes" something no member does—it’s following a procedure that prioritizes written standards over individual overall judgments.  

  **2. "Why prefer premise-based over conclusion-based?"**  
  The choice is principled: **The handbook defines outcomes by criteria, not by popular vote.** The Council’s role is to apply these criteria factually (e.g., "Is there student interest?"). The conclusion-based approach (motion vote) makes the Council an opinion poll, ignoring the handbook’s structure. If the Council is meant to be a fact-finder applying fixed rules, premise-based is essential. If it’s a deliberative body expressing collective sentiment, conclusion-based fits. Given your handbook’s language, premise-based aligns with your duty.
