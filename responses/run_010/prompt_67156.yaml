      Question 1: 
          Is it accurate to say that the Council, as a body, granted a charter that not one of its members granted? 

          Answer: 
            No, that overstates the case. The Council does not have a mind of its own. The Council's decision is determined by the voting rule. In the premise-based approach, the Council grants the charter because a majority approved each criterion. This does not require that any single member approved all three criteria? But note: in the example, two members did approve all three. However, the premise-based approach does not require that. Even if no member approved all three (but each criterion passed by majority), the Council would still grant the charter. In that case, we might say the Council granted a charter that no single member would have granted? But that is the nature of collective decision-making: the whole can be more than the sum of its parts? 

            However, the description "not one of its members granted" is not exactly right because the members did not individually have the authority to grant the charter. The Council as a body grants the charter. The members collectively, through the voting rule, determined that the criteria were met.

      Question 2:
          Is there a principled reason to prefer the premise-based route to the conclusion-based route, or does the choice ultimately depend on what a body like ours is supposed to be — a fact-finder applying written criteria, or an assembly expressing the collective judgment of its members?

          Answer:
            The choice ultimately depends on the role of the Council. If the Council is primarily a fact-finding body that applies written criteria, then the premise-based approach is more appropriate because it focuses on the criteria. If the Council is an assembly that expresses the collective judgment of its members, then the conclusion-based approach is more appropriate. 

            In the case of the Student Activities Council, the handbook defines the criteria that must be met for a charter. This suggests that the Council's role is to determine whether those criteria are met. Therefore, the premise-based approach aligns with the handbook rule. The conclusion-based approach, while reflecting the members' overall judgment, might overlook the specific criteria that the handbook requires. 

            However, both approaches have merit. The premise-based approach ensures that the written rule is followed precisely. The conclusion-based approach respects the overall will of the Council. Given that the handbook defines the criteria, we believe the premise-based approach is the principled choice for this body.

