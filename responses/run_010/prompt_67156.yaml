      Standing Procedure for Student Activities Council Votes on Chartering and Appeals

      1. Votes are taken in the following order: 
          - Criterion A
          - Criterion B
          - Criterion C
          - Motion: "That the charter be granted" (for chartering) or "That the appeal be granted" (for appeals).

      2. The Secretary checks for divergence after all votes are cast:
          a. For a conjunctive rule (chartering):
              - If all three criteria passed (each by at least 6 votes) AND the motion failed (fewer than 6 votes in favor) -> divergence.
              - If the motion passed (at least 6 votes) AND at least one criterion failed -> divergence.
          b. For a disjunctive rule (appeals: either P or Q):
              - If at least one criterion (P or Q) passed AND the motion failed -> divergence.
              - If the motion passed AND both criteria (P and Q) failed -> divergence.

      3. If divergence is found:
          a. The Chair announces the outcome based on the criteria votes:
              - For chartering (conjunctive): the charter is granted if all criteria passed; denied otherwise.
              - For appeals (disjunctive): the appeal is granted if at least one criterion passed; denied otherwise.
          b. The Chair also announces that a divergence has occurred and that the decision is based on the criteria votes as per this standing procedure.

      4. Recording the minutes in a divergent case:
          - Record the vote counts for each criterion and the motion.
          - State that a divergence occurred and explain how the decision was determined (by the criteria).
          - Example for chartering (conjunctive) when criteria pass but motion fails:
              "The Council determined that all three criteria were met (A: 6-5, B: 6-5, C: 6-5). However, the motion to grant the charter was defeated (2-9). Due to the divergence between the criteria votes and the motion vote, the Council grants the charter in accordance with the handbook rule and the standing procedure."
          - For appeals (disjunctive) when at least one criterion passes but the motion fails:
              "The Council determined that at least one criterion for granting the appeal was met (P: ...; Q: ...). However, the motion to grant the appeal was defeated (...). Due to the divergence, the Council grants the appeal in accordance with the rule and the standing procedure."

      5. For proposals split across two meetings:
          - Votes on criteria taken at the first meeting are recorded and minutes are posted as usual.
          - At the second meeting, votes on the remaining criteria and the motion are taken.
          - The divergence check is run after the second meeting using all votes.

      6. Insincere voting:
          - Ballots are public (each member's vote is recorded in the minutes).
          - The Council relies on the integrity of its members to vote sincerely.
          - No re-vote is taken once divergence is found.

      7. Referral to higher authority:
          - The procedure does not automatically refer a divergent case to the Dean.
          - The decision is made by the Council based on the criteria votes, and the normal appeal process applies.

