answer: |-
  **Standing Procedure for Resolving Voting Divergences**

  **1. Order of Votes and Motion Vote**  
  Votes are taken in the following order:  
  - Criterion A  
  - Criterion B  
  - Criterion C  
  - Motion (e.g., "Grant the charter" or "Grant the appeal")  
  **Always take the motion vote**, even if criteria outcomes are known. It captures the Council’s overall judgment and is required by the handbook.

  **2. Secretary’s Quick Check for Divergence**  
  After tallying, the secretary checks:  
  - For **conjunctive rules** (e.g., chartering):  
    - If **all criteria passed** (each has ≥6 "yes" votes) **but the motion failed** (<6 "yes" votes), divergence exists.  
    - If **the motion passed** (≥6 "yes" votes) **but any criterion failed** (<6 "yes" votes), divergence exists.  
  - For **disjunctive rules** (e.g., appeals):  
    - If **at least one criterion passed** (≥6 "yes") **but the motion failed** (<6 "yes"), divergence exists.  
    - If **the motion passed** (≥6 "yes") **but all criteria failed** (both <6 "yes"), divergence exists.  
  *Time required:* <1 minute. Count "yes" votes per criterion/motion; no arithmetic beyond comparing to 6.

  **3. Chair’s Action When Divergence is Found**  
  **Announce the outcome based on the criteria votes** (premise-based approach):  
  - For chartering: Grant if all criteria passed; deny otherwise.  
  - For appeals: Grant if ≥1 criterion passed; deny otherwise.  
  **Reason:** The handbook defines outcomes by criteria (e.g., "charter if A, B, and C"). Criteria votes directly apply this rule, ensuring decisions align with written standards. The motion vote reflects collective sentiment but doesn’t override the criteria.  
  *Example script:* "Criterion A passed 6–5, B passed 6–5, and C passed 6–5. Per handbook rules, the charter is granted. However, the motion failed 2–9. This divergence is noted and recorded."

  **4. Recording Minutes in Divergent Cases**  
  Include:  
  - Vote counts for each criterion and the motion.  
  - Explicit note of divergence and outcome rationale.  
  *Sample minute language (chartering):*  
  > *"Vote: Criterion A (student interest): 6 yes, 5 no. Approved.  
  > Criterion B (faculty sponsor): 6 yes, 5 no. Approved.  
  > Criterion C (mission/resources): 6 yes, 5 no. Approved.  
  > Motion to grant charter: 2 yes, 9 no. Failed.  
  > Divergence noted: Criteria votes satisfy handbook requirements for granting, but motion vote does not. Per standing procedure, charter granted based on criteria votes. Decision appealable to Dean."*

  **5. Handling Disjunctive Rules (e.g., Appeals)**  
  - Votes: Criterion P (procedural error), Criterion Q (disproportionate sanction), Motion (grant appeal).  
  - Use **same check** (Step 2) for divergence.  
  - Outcome based on criteria: Grant appeal if **P or Q passed**; deny if **both failed**.  
  *Example:* If P fails 5–6, Q passes 6–5, and motion fails 5–6, outcome is "grant appeal" (Q passed).

  **6. Proposals Split Across Meetings**  
  - Vote available criteria at Meeting 1; record/publicize votes.  
  - Vote remaining criteria and motion at Meeting 2.  
  - **Run divergence check after Meeting 2** using all votes.  
  - No change to ballots or outcomes based on prior votes.  
  *Rationale:* Members may adjust votes knowing prior results, but the final check ensures consistency with the rule.

  **7. Insincere Voting**  
  - **Ballots remain public** (recorded in minutes) to deter strategic voting via accountability.  
  - **No re-votes** once divergence is found. The procedure assumes good faith; deliberate manipulation is a conduct issue, not a procedural one.  
  *If suspected:* The Council may address it as a behavioral matter (e.g., censure), but the vote stands.

  **8. Limits of the Procedure**  
  - This procedure resolves **arithmetic divergences** (conflicts between criteria/motion votes).  
  - **Hand off to the Dean or Council if:**  
    - The outcome (e.g., granting a charter against overwhelming opposition) raises questions about the Council’s purpose.  
    - A member challenges the legitimacy of the criteria themselves.  
    - *Rationale:* Such issues require human judgment about values, not just vote-counting.

