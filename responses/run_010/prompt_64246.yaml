  - **C**: Rational; Ada should have 1/2 and Bea 1/3.  
  - **D**: Rational; Ada should have 1/3 and Bea 1/2.  

  *If A or C, go to Question 5. If B or D, go to Question 6.*  
  *Commitments*:  
  - Answer A/C: Form-holding is irrelevant; no new evidence for Ada.  
  - Answer B/D: Form-holding is evidence; Ada’s perspective is self-locating, Bea’s is not.

  #### **Question 4: Indexical Propositions**
  *Claim*: Propositions containing implicit indexicals (e.g., “I am awake now”) can bear rational credence.
  - **A**: Agree.  
  - **B**: Disagree.  

  *If A, go to Question 6. If B, go to Question 7.*  
  *Commitments*:  
  - Answer A: Indexicals are legitimate objects of belief; self-locating uncertainty is meaningful.  
  - Answer B: Credence applies only to non-indexical propositions; indexicals require decision contexts.

  #### **Question 5: Evidence Without Indexicals**
  *Claim*: Beauty’s total evidence on Monday is exhausted by propositions statable without indexicals (e.g., “An awakening is occurring”).
  - **A**: Agree.  
  - **B**: Disagree.  

  *If A, go to Question 8. If B, go to Question 9.*  
  *Commitments*:  
  - Answer A: Evidence is purely qualitative; no new non-indexical information is gained on waking.  
  - Answer B: Evidence includes irreducibly indexical elements (e.g., “This awakening is mine”).

  #### **Question 6: Shift Without Learning**
  *Claim*: A rational agent can shift credence in a proposition without learning any new non-indexical information, even if she knew in advance she would have the experience.
  - **A**: Agree.  
  - **B**: Disagree.  

  *If A, go to Question 8. If B, go to Question 9.*  
  *Commitments*:  
  - Answer A: Shifts can occur from indexical learning or perspective changes.  
  - Answer B: Credence only changes with new non-indexical information; indexicals don’t count.

  #### **Question 7: Credence and Recurring Bet**
  *Claim*: The fair price Beauty would pay for a bet that recurs at every awakening (paying $1 if heads) must equal her credence in heads.
  - **A**: Agree.  
  - **B**: Disagree.  

  *If A, position is **Thirder (Observer-Counting)**. If B, go to Question 9.*  
  *Commitments*:  
  - Answer A: Credence must align with observed betting frequencies in recurring decisions.  
  - Answer B: Credence is separable from recurring bets; it can diverge due to diachronic constraints.

  #### **Question 8: Credence Relative to Decision**
  *Claim*: Credence is only defined relative to a specified decision problem; without this, the Sleeping Beauty question is ill-posed.
  - **A**: Agree.  
  - **B**: Disagree.  

  *If A, position is **Deflationist**. If B, go to Question 9.*  
  *Commitments*:  
  - Answer A: Credence is instrumental; no unique answer exists without a decision context.  
  - Answer B: Credence is epistemic; it exists independently of decisions.

  #### **Question 9: Everettian Counting**
  *Claim*: In Everettian quantum mechanics, the probability of an outcome is proportional to the number of branches where it occurs.
  - **A**: Agree.  
  - **B**: Disagree.  

  *If A, position is **Thirder (Observer-Counting)**. If B, position is **Thirder (Self-Locating Evidence)**.*  
  *Commitments*:  
  - Answer A: Branch-counting justifies probability assignments; it generalizes to Sleeping Beauty.  
  - Answer B: Branch-counting is irrelevant; probability requires causal or epistemic grounding.

