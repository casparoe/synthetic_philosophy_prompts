prompt: |-
  For several years I ran a small engineering group, and a pattern kept recurring that I have never found a name for. Our safety manual contained a step requiring a valve to be cycled twice before startup; the manual had carried it for decades; nobody living could say why; and yet whenever anyone proposed dropping it as redundant, the response was not a defense but a shrug plus a gesture at the binder — it's in there, so it gets done. A second case: our screening rubric weighted "prior work on legacy systems" heavily, because a founder had argued in an old memo that such work correlated with patience. Years later nobody in the group believed that claim, several people thought it was probably false, and still the weighting survived, because in meetings the memo could be invoked as a reason and nobody had to personally endorse it for it to carry the decision.

  What strikes me is that in both cases the justification is not a belief anyone holds, yet it stays fully operative: it is a piece of text that the group keeps re-adopting, and it steers behavior without being in anyone's head. This is not, as I understand it, the situation where a fence stands across a road and you must not remove it until you understand why it was put there — there the point is that a real function may exist and you are ignorant of it, whereas here there may be no function left at all and the written rationale does the work anyway. Nor is it people dressing up a judgment they reached independently: the binder entry genuinely comes first and causes the outcome.

  Is there an established concept, in philosophy or in the study of organizations, for a reason that persists as an artifact after the reasons people actually had for it have gone — a justification that remains causally effective while no longer being believed by anyone it governs? If there is one, I want to know how the cases above differ from it and where its limits lie. If there is not, define a term for it and give me the boundary conditions: what separates it from a rationale that is simply unknown, from a rationale that is disbelieved but retained out of prudence, and from a rule imposed by people long dead on people who never agreed to it. A bare label will not help me; I need the edges drawn.
reasoning: |-
  Okay, the user is describing a fascinating organizational phenomenon they observed in their engineering group. They've noticed persistent rules or procedures that continue to govern behavior long after their original justification has been forgotten or disbelieved. The valve-cycling requirement and the screening rubric weighting are perfect examples of this. 

  What makes this interesting is how the written artifact itself becomes the justification - the binder entry or old memo carries authority simply by existing, even when no one personally endorses its rationale. The user is clearly frustrated by this irrational persistence but also intellectually curious about its mechanics. 

  I need to unpack several layers here. First, the core phenomenon: it's not just institutional inertia or "we've always done it this way." There's something specific about textual artifacts taking on autonomous power. Second, the user wants precise boundaries: how this differs from prudent caution about unknown reasons (the fence analogy), from hypocrisy, or from pure coercion. 

  The closest established concept seems to be "zombie justification" from organizational theory - reasons that are institutionally "alive" while being substantively "dead." But I should test that against the user's examples. In the valve case, it's clearly zombified; in the hiring rubric, it's more interesting because people consciously reject the rationale yet still use the memo to avoid responsibility. That shades into what anthropologists call "ritualism."

  The boundary conditions matter most to this user. They're clearly analytical - an engineer who thinks in systems. I should delineate when textual persistence becomes dysfunctional (like here) versus functional (like constitutional principles). And emphasize the key differentiator: the disconnect between personal belief and institutional behavior mediated by artifacts. 

  For the valve case versus the fence parable: the difference is epistemological. With the fence, we assume there's an unknown good reason; with the valve, everyone knows there probably isn't. That's why the user rejects Chesterton - their examples lack that epistemic humility. 

  For the hiring rubric: it's distinct from simple hypocrisy because the memo isn't used to deceive, but as a truth-avoidance mechanism. And it's not dead-letter law because it's actively invoked to allocate responsibility away from living decision-makers. 

  I'll introduce "zombie justification" as the primary term but flag its limits - especially how in the hiring case it's weaponized as "ritual authority." The real insight is how text becomes a tool for distributing moral responsibility in organizations. That's what the user glimpsed but couldn't name.
answer: |-
  Your observations pinpoint a profound organizational phenomenon that lacks a single universal label but intersects several established concepts. The closest fit is **"Zombie Justification"** (from organizational theory), with nuances from **"Ritualism"** (sociology) and **"Dead-Hand Governance"** (law/political science). Below is a dissection with explicit boundaries:

  ### Core Concept: **Zombie Justification**
  A **formally codified rationale that retains causal power to steer behavior despite losing substantive belief or functional purpose among current actors.** It persists through:
  - **Artifact inertia:** Physical/digital persistence of documents (manuals, memos).
  - **Accountability deflection:** Allowing decisions without personal endorsement ("The binder says so, not me").
  - **Procedural legitimacy:** Mistaking adherence to codified steps for reasoned judgment.

  ### Boundary Conditions
  1. **vs. Unknown Rationale (Chesterton’s Fence):**  
     - **Chesterton’s Fence:** Assumes a *valid but forgotten reason*; removal requires proving no hidden function exists.  
     - **Zombie Justification:** Actors *know or suspect* the rationale is obsolete/discredited, yet comply.  
     *Your valve case:* No one defends it as functional; it’s obeyed *because it’s codified*, not from fear of hidden utility.

  2. **vs. Prudential Retention (Disbelieved but Retained):**  
     - **Prudential retention:** Actors retain a rule *despite* disbelief due to risk aversion (e.g., "Maybe we’re wrong; better safe than sorry").  
     - **Zombie Justification:** Retention stems from *avoiding responsibility* or *procedural compliance*, not risk calculus.  
     *Your rubric case:* No one argued "What if the founder was right?"—they used the memo to *avoid justifying* their choice.

  3. **vs. Dead-Hand Governance (Coercive Inheritance):**  
     - **Dead-Hand Governance:** Rules imposed by past authorities bind successors *against their will* (e.g., unamendable constitutions).  
     - **Zombie Justification:** Current actors *actively enable* the rule by invoking the artifact to sidestep agency.  
     *Key distinction:* Your team *chooses* to cite the memo/binder rather than challenge it, making them complicit in its persistence.

  4. **vs. Hypocritical Rationalization:**  
     - **Hypocrisy:** Actors use a false rationale to *mask* true motives (e.g., "We keep the valve rule to look cautious").  
     - **Zombie Justification:** The artifact *replaces* motives; no hidden agenda exists beyond avoiding cognitive effort.

  ### Why This Emerges
  - **Path dependency:** Once formalized, removing a rule requires effort; maintaining it requires none.
  - **Moral licensing:** Citing the artifact absolves individuals of accountability ("Don’t blame me; blame the manual").
  - **Institutional fetishism:** Textual artifacts gain sacred status, divorcing them from their original context.

  ### Limits of the Concept
  Zombie justifications collapse when:
  1. **Costly consequences** emerge (e.g., valve cycling causes delays costing $1M/year).  
  2. **External audits** demand evidence-based rationales (e.g., safety regulators).  
  3. **Leadership change** introduces actors with no stake in legacy systems.  
  4. **Collective skepticism** crystallizes into action (e.g., a subgroup tests the valve rule and proves futility).

  ### Applying to Your Cases
  - **Valve cycling:** Pure zombie justification. No belief, no prudence, no coercion—only textual inertia.  
  - **Hiring rubric:** Zombie justification + **ritual authority**. The memo acts as a totem, allowing the group to ritualistically enact "patience" without belief.  

  ### Proposed Term Expansion
  **"Procedural Zombification"**  
  *Definition:* The process by which codified directives persist as operational ghosts—retaining causal power through institutional inertia and accountability avoidance, despite the extinction of their justifying beliefs.  
  *Boundary:* Fades when actors must *personally* justify outcomes or bear costs.

  This framework distinguishes your cases from similar phenomena by emphasizing:  
  - **Absence of latent function** (vs. Chesterton),  
  - **Absence of risk-based pragmatism** (vs. prudence),  
  - **Presence of active complicity** (vs. dead-hand coercion).  
  The core is the *autonomous power of artifacts* to govern behavior without governing minds.
