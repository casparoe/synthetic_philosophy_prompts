  Conclusion: The tradition is invented (with a false claim of medieval origin) but has been running since 1948. It has ritual and builds community. So we would fund? But note: the committee might hate that we are funding something that claims to be medieval but isn't. We have to be honest in our report: the tradition is continuous since 1948, not medieval. But the procedure doesn't say we reject for being invented. We reject only if it fails to meet the criteria of being a tradition (ritual) and building community. So we would fund? However, we must note the misrepresentation. This might be a point to hand off to a human because the committee might feel misled. But the procedure doesn't require rejection for misrepresentation. We just note the facts.

