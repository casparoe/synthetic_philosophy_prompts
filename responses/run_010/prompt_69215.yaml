  We must also note:
  - Some traditions produce their own evidence (e.g., a written account created by the tradition's founders). This is problematic and requires critical examination.

  The procedure should stop with a "no" in clear cases of misrepresentation (if we can catch it) but hand off to a human when it's a values question (e.g., the tradition is invented but still valuable for community building).

  Proposed Decision Procedure:

  1. **Question 1: Does the applicant claim the event/tradition is old?**
