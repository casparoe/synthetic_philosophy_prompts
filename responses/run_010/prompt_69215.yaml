  We are building a decision procedure based on Hobsbawm's "invented traditions" and Anderson's "imagined communities". The goal is to help a committee evaluate heritage grant applications, especially when claims of historical continuity are made.

  Key concepts from Hobsbawm and Anderson:
  - **Invented traditions** (Hobsbawm): Traditions that appear or claim to be old but are often recently invented. They are characterized by:
    - Formalization and ritualization.
    - Claim of continuity with a suitable historic past (even if the connection is tenuous).
    - Serve to establish social cohesion, legitimize institutions, or inculcate beliefs.
  - **Imagined communities** (Anderson): Nations (or communities) are imagined because members will never know most of their fellow-members, yet they feel a sense of communion. Traditions can help create and sustain such communities.

  We need to design a procedure that asks a sequence of questions. We must distinguish:
  1. Invention vs. custom vs. plain routine.
     - **Invention**: A tradition that has been deliberately constructed and may claim (falsely) a long history.
     - **Custom**: A practice that has evolved organically over time and is passed down with some continuity.
