  3. **Question 3: Is there evidence of continuous practice?**
     - Check for gaps in the tradition's practice.
     - If there is a gap (especially a long one) → Then the tradition has been revived or reinvented. We note that the claim of continuity is broken. Proceed to Question 4.
     - If there is no gap (continuous practice) → Then the tradition has a factual continuity. Proceed to Question 4.

  4. **Question 4: Does the event/tradition involve ritual, symbolism, or formalized practices that are repeated?**
     - This distinguishes tradition/custom from plain routine.
     - If **no** → Then it might be a plain routine and not a tradition. We might consider rejecting (unless it's building community in a new way). But we hand off to a human because the committee might value it for other reasons (see Question 5).
     - If **yes** → Then it is a tradition (invented or not). Proceed to Question 5.

  5. **Question 5: Does the event/tradition serve to create or sustain an imagined community? (e.g., fosters a sense of shared identity, belonging, or collective memory among participants?)**
     - This is the Anderson criterion.
     - If **yes** → Then the tradition has value in building community. We are inclined to fund (unless there are other issues like exclusion, see Question 6).
     - If **no** → Then it might be a commercial event or private gathering without broader community significance. We might reject, but hand off to a human for values question (could there be other merits?).

  6. **Question 6: Does the event/tradition exclude significant portions of the community? (e.g., based on gender, ethnicity, etc.)**
