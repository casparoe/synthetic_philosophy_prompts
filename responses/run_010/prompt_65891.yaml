prompt: |-
  I'm in a philosophy of biology seminar this term and our tutor ends every week by rattling off his verdicts on a pile of little cases about whether DNA "really" carries information, and I've honestly lost track of what rule he's running. Here's roughly what he's said so far:

  - the sequence of an ordinary protein-coding gene: yes, information, and he's perfectly happy calling the genetic code a code.
  - the mRNA molecules a mother loads into the egg before fertilization, which the embryo never transcribed itself: still information — "the sender is just the mother instead of the embryo."
  - insulin in the bloodstream: carries information about blood glucose, but is emphatically NOT a code. He got quite heated about people saying "the hormonal code."
  - a synthetic gene we design in the lab with a codon-to-amino-acid mapping that's completely different from the standard one, expressed in a cell-free extract: "unambiguously a code, and the fact that the mapping is arbitrary is exactly why."
  - a random 300-base sequence that's been synthesized in a tube and has never been inside a cell: no information. "Calling it a code just describes our intentions."
  - the genome of something sequenced from a fossil, where there's no cell and no reader left anywhere: still carries the information it always carried. "Information doesn't require an audience."

  Next week the case on the table is one from our own lab and I want to work out what he'll say before I hear it. Someone CRISPR'd a single base into a stretch of junk DNA in E. coli as a prank / data-storage thing: position 47 is a C if and only if the colony was grown at 37C, and a T if and only if it was grown at 25C. Nothing in the cell reads that position, it has no effect on the phenotype whatsoever, the bacteria grow identically either way, and the plate map got thrown out so no human is going to read it back either. He'll be asked two things: does position 47 carry information about the growth temperature, and is it a code?

  Can you tell me which rules his six verdicts are jointly consistent with? I can think of a Dretske-style reliable-correlation reading and something teleosemantic with senders and receivers, and I vaguely remember Maynard Smith being invoked in the arbitrariness discussion, but I don't know which of these the fossil case or the insulin case kills, or whether there's a third option I'm missing. For each surviving rule I want the predicted verdict on position 47, answered separately for both sub-questions — and if a rule makes the two sub-questions come out differently, say why. Also flag anywhere his own precedents seem to pull against each other on this one. Then give me your best guess at what he'll actually say and the reasons for preferring it, and finally the single new case I could put to him that would force the rules apart, with what he'd be committed to saying under each.

  Please use these sections, in this order:

  1. **What the verdicts already rule out** (~150 words)
  2. **Candidate rule A** / **Candidate rule B** / **Candidate rule C** (~120 words each, each ending with a one-line predicted verdict on both sub-questions for position 47)
  3. **My prediction** (~150 words)
  4. **The discriminating case** (~150 words)

  No references or reading lists please — I can't look anything up, I just want the reasoning.
reasoning: |-
  Hmm, the user is in a philosophy of biology seminar and is struggling to understand their tutor's framework for determining when DNA carries information and when it counts as a code. They've provided six examples of the tutor's verdicts and need help predicting what the tutor will say about a CRISPR-modified base in E. coli that correlates with temperature but has no biological function or reader.

  The tutor's verdicts show interesting patterns. He accepts information in functional genetic sequences and even in maternal mRNA (sender shifted to mother), but rejects it in random synthetic DNA. He accepts the genetic code as a code because of its arbitrariness, but rejects "hormonal code" terminology. Crucially, he maintains that fossil DNA still carries information without any current reader.

  This rules out several common theories:
  - Pure teleosemantic views (where function defines meaning) are contradicted by the fossil case, since the DNA has no current function but still carries information.
  - Dretske-style reliable correlation alone isn't sufficient, as the random sequence correlates with nothing yet is denied information status.
  - Current receiver requirements are invalidated by the fossil case.

  For candidate rules, I'm considering:
  A) "Sender-receiver framework with evolutionary history": Information requires an evolved sender-receiver system. This explains fossil DNA (past system) and maternal mRNA (shifted sender). Verdict for position 47: No information (no evolved system), not a code.

  B) "Arbitrary mapping as code": Code requires arbitrary symbol-meaning mapping. This explains why synthetic genes are codes (arbitrary mapping) but insulin isn't (non-arbitrary). Verdict for position 47: Information (correlation exists), and it's a code (arbitrary base-temperature link).

  C) "Functional correlation": Information requires functional correlation within a biological system. This explains why maternal mRNA has information (functional for embryo) but random sequences don't. Verdict for position 47: No information (no biological function), not a code.

  The tutor's precedents pull against each other here - the fossil case suggests information can exist without current function, but the synthetic sequence case suggests mere correlation isn't enough. This tension makes prediction tricky.

  My best guess is that the tutor will say position 47 carries information about temperature (since correlation exists, like fossil DNA) but is not a code (since no biological interpretation system exists). His reasoning will likely emphasize the persistence of information without current readers while denying code status due to lack of biological arbitrariness.

  For a discriminating case to test these rules, I'd propose engineered bacteria where a non-functional DNA sequence correlates with temperature via a designed (not evolved) mechanism. Under Rule A this wouldn't count (no evolutionary history), under Rule B it would (arbitrary mapping), and under Rule C it wouldn't (non-functional). This would force the tutor to clarify whether design substitutes for evolution in sender-receiver frameworks.
answer: |-
  ### 1. What the verdicts already rule out
  The tutor rejects:  
  - **Pure teleosemantics** (information requires *current* biological function), as fossil DNA lacks a current receiver but retains information.  
  - **Dretske-style reliable correlation alone**, as the random sequence correlates with nothing and lacks information, but insulin correlates reliably without being a "code."  
  - **Anthropocentrism**, since the synthetic gene’s arbitrariness qualifies it as a code even without natural function, but the random sequence’s arbitrariness doesn’t count without biological context.  
  - **Current-receiver necessity**, given the fossil case.  
  The tension: Fossil DNA supports information without *current* senders/receivers, but the random sequence requires *some* biological embedding (past or present) to count.

  ### 2. Candidate rules
  **Candidate Rule A: Evolutionary sender-receiver framework**  
  Information requires an evolved biological system with a sender (e.g., natural selection, organism) and receiver (e.g., ribosome, hormone receptor). "Code" requires arbitrariness *within* such a system.  
  - *Position 47 verdict*: No information (no evolved sender/receiver for temperature correlation), not a code.  

  **Candidate Rule B: Arbitrary mapping as code, biological grounding for information**  
  "Code" applies iff symbols map arbitrarily to meanings (e.g., genetic or synthetic codes). Information requires reliable correlation *plus* biological function (fossil: past function; mRNA: current function).  
  - *Position 47 verdict*: Information? No (no biological function). Code? No (no mapping system).  

  **Candidate Rule C: Correlation + causal history**  
  Information requires reliable covariance with a state (e.g., temperature) *caused by that state* (ruling out random sequences). "Code" requires arbitrariness *and* a decoding mechanism.  
  - *Position 47 verdict*: Information? Yes (temperature caused the base change). Code? No (no mechanism "reads" it).  

  ### 3. My prediction
  He’ll say: **Yes, position 47 carries information about temperature, but it’s not a code.**  
  **Reasoning**:  
  - Information: Like fossil DNA, the correlation was *causally established* (CRISPR edit responded to temperature) and persists sans reader. This aligns with the fossil verdict.  
  - Not a code: Like insulin, no arbitrariness is exploited by a biological system (nothing "decodes" the base). The synthetic gene case requires a *functional* arbitrary mapping, absent here.  
  **Why preferred?** It reconciles the fossil (information sans current receiver) and synthetic gene (arbitrariness + system) cases while excluding the random sequence (no causal history). The tension with maternal mRNA (sender shifted) is resolved by stressing *causal origin*, not current function.  

  ### 4. The discriminating case  
  **Case**: Engineered bacteria where a *non-functional* DNA sequence changes randomly each generation, but scientists *design* a ribosome-like machine to translate it into a fluorescent protein using an arbitrary code. No natural selection involved.  
  **What it forces**:  
  - **Rule A**: No information (no evolved sender), but it *is* a code (arbitrary mapping + receiver).  
  - **Rule B**: Information? No (no biological function). Code? Yes (arbitrary mapping).  
  - **Rule C**: Information? No (correlation not caused by environment). Code? Yes (arbitrary mapping + decoder).  
  This exposes conflicts: Rule A separates information from code; Rules B/C split on whether design alone suffices for code status. His answer reveals if "sender" requires evolution or if design counts.
