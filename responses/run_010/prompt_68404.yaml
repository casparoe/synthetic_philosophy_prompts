prompt: |-
  I'm an SRE on a platform team, no philosophy background whatsoever, so bear with the framing. Roughly twice a week I have to say whether a service "survives X" — AZ loss, region failover, a dependency going dark — on the basis of a chaos drill or a game day, and the results are close to useless as evidence. I can feel that they are but I cant articulate why, which makes signing off on them miserable.

  Green drill, except: the autoscaler and a self-healing watchdog restarted things before anything could visibly fail; the harness pre-warmed the standby region; client retries and a circuit breaker ate the errors; someone was babysitting with the runbook open; half the dependencies were mocked. Any one of those might mean the property was never actually exercised. And the mirror image: red drills where the service was fine and the synthentic client was the problem.

  My roommate did a philosophy degree, and when I complained about this he said there's a whole literature on dispositions and conditionals where my exact problem is the central puzzle — something about "finks" and "masks" and why you can't just define a disposition as *if stimulus then manifestation*. If that's real, use it: I want the reasoning and the distinctions, not the labels for their own sake. Tell me if I've got the terms backwards. No citations and no reading list — I can't look anything up and wouldnt read it anyway.

  What I need is a triage procedure a junior can run on one drill result in about 30 minutes before it goes into a design review doc that a staff engineer signs. So:

  - The questions in order, and for each one what counts as a sufficient answer versus a hand-wave.
  - A taxonomy of everything that breaks the inference from "the drill showed M" to "the service has property D" — capability supplied by the harness, something that resets state right when the fault lands, something that swallows the manifestation while leaving the underlying defect intact, human in the loop, boundary drawn around the wrong set of components — and for each, how you'd detect it from config, logs and topology rather than from vibes.
  - Where the procedure has to output "you cannot know this from this experiment" instead of a verdict, and what it tells you to do at that point.
  - The nasty part: every move that would clean up a drill (freeze the watchdog, kill the retries, un-mock the dependency) changes the thing you're testing, so you end up with evidence about a system that isn't deployed. Don't paper over that. I want the procedure to handle it explicitly, including when to accept a dirty drill and say so in the doc.

  Then run it on three cases: (1) an AZ-loss drill that's been green for 18 months, with pod auto-restart, a client retry budget, a circuit breaker falling back to a stale cache, and the fault injected during a scheduled traffic trough; (2) a failover drill that went red, but on-call skipped a runbook step and the load generator held ~10x normal connection counts; (3) the one I don't want the answer to — our flagship region-failover drill, which gets cited in the customer trust deck, where I suspect the honest conclusion is that it evidences nothing and that cleaning it up would mean disabling production safety nets during peak season.

  Finish with a one-page version a junior could actually keep open during a game day, and a two-column glossary mapping our words (green, red, retry, fallback, mock, blast radius, "it recovered") onto the philosophical ones and back.
reasoning: |-
  We are facing a problem: chaos drills often provide ambiguous evidence about whether a service truly possesses a resilience property (like surviving an AZ loss). The philosophical concepts that help here are:

  1. **Dispositions**: A disposition is a property that would manifest under certain conditions. For example, fragility is the disposition to break when struck; resilience to AZ loss is the disposition to maintain function when an AZ goes down.

  2. **Conditionals**: We often think of dispositions as being defined by a conditional: "if stimulus S, then manifestation M". But this is flawed because of:
     - **Masks**: Something interferes with the manifestation even though the disposition is present (e.g., a circuit breaker catches the error so the service doesn't crash, but the underlying defect is still there).
     - **Finks**: Something removes the disposition at the time of the stimulus (e.g., a self-healing mechanism restarts the component so quickly that the component never actually fails, but without that mechanism it would have failed).
     - **Mimics**: Something causes the manifestation even though the disposition is absent (e.g., the test harness fails in a way that makes the service look broken when it isn't).

  In our context:
  - **Stimulus**: The fault we are injecting (e.g., AZ loss).
  - **Manifestation**: The observable behavior we expect if the disposition is present (e.g., the service remains available, or if it fails, it recovers within a certain time).

  The drill is supposed to test: if we inject the stimulus, does the manifestation occur? But we have confounding factors.

  We need a triage procedure that a junior can run on a drill result to assess the validity of the inference "the drill showed M, therefore the service has the disposition D to survive the fault".

  The procedure must:
  1. Ask specific questions in order.
  2. For each, define what counts as a sufficient answer vs. a hand-wave.
  3. Provide a taxonomy of what breaks the inference (masks, finks, mimics, etc.) and how to detect them from config, logs, topology.
  4. Handle the problem that cleaning up the drill (disabling safety mechanisms) tests a non-production system.
  5. Output when the result is inconclusive and what to do next.

  We'll then apply it to three cases.

  ---

  **Triage Procedure: Validating Drill Evidence**

  **Goal**: To determine whether the drill result (green/red) is valid evidence for the service's resilience disposition D (e.g., survive AZ loss) and to identify confounding factors.

  **Inputs**:
  - Drill report (logs, metrics, topology, config, runbook, who was present, etc.)
  - Knowledge of the service (architecture, dependencies, safety mechanisms)

  **Outputs**:
  - One of: 
     - **VALID_GREEN**: The drill provides strong evidence that the service has D.
     - **VALID_RED**: The drill provides strong evidence that the service does not have D.
     - **INCONCLUSIVE**: The drill does not provide evidence either way (and why).
  - A list of identified confounding factors (if any) and their types (mask, fink, mimic, boundary issue, etc.).
  - Recommendations (if any) for next steps.

  **Steps**:

  1. **Verify the Stimulus (Fault Injection)**
     - *Question*: Was the intended fault actually injected and experienced by the service?
     - *Check*: Look at logs and metrics to confirm the fault occurred as intended (e.g., AZ loss: traffic from that AZ stopped, pods in that AZ were killed or isolated). 
     - *Sufficient answer*: Clear evidence in logs (e.g., chaos tool logs, pod termination events, network partition) and metrics (e.g., traffic drop from AZ) that matches the expected fault pattern.
     - *Hand-wave*: No direct evidence, or evidence that the fault was partial (e.g., only some pods affected) or different from intended.
     - *Taxonomy*: 
        - **Boundary issue**: If the fault was not fully applied (e.g., only a subset of components in the AZ were affected) because the blast radius was misconfigured.
        - **Mimic potential**: If the fault was not the one intended (e.g., the chaos tool failed and caused a different fault) then the manifestation might be due to a different disposition.
     - *If insufficient*: Mark as INCONCLUSIVE (stimulus not confirmed).

  2. **Verify the Manifestation (Outcome)**
     - *Question*: Was the manifestation (e.g., service remained available, or recovered within time T) observed correctly?
     - *Check*: Look at the monitoring that determined the drill result. Was it measuring the right thing? (e.g., for availability: was the client actually experiencing errors? or was the monitoring synthetic and flawed?)
     - *Sufficient answer*: Metrics from real user traffic (or a representative synthetic client) showing the actual behavior. The manifestation must be defined by SLOs (e.g., availability >= 99.9% during the drill).
     - *Hand-wave*: Only synthetic client metrics, and the client is known to be brittle or misconfigured. Or the manifestation was defined too loosely (e.g., "it recovered" without timing).
     - *Taxonomy*:
        - **Mimic**: The manifestation (e.g., unavailability) was caused by the test harness (e.g., load generator failed) and not the service -> invalid red.
        - **Mask**: The manifestation (e.g., an error) was hidden (e.g., by a circuit breaker falling back to a cache) so the service appeared available even though it was broken -> invalid green.
     - *If insufficient*: Mark as INCONCLUSIVE (manifestation not confirmed).

  3. **Check for Finks (Disposition Removed During Stimulus)**
     - *Question*: Was the disposition being tested temporarily altered or removed during the drill?
     - *Check*: Look for mechanisms that might have changed the system state *during* the drill to avoid the fault. Examples: 
        - Auto-scaling that added capacity just before the drill (pre-warming).
        - Watchdogs that restarted components before any failure could be observed.
        - Human intervention (e.g., someone followed a runbook step during the drill).
     - *Sufficient answer*: Logs show that these mechanisms were active and altered the system during the drill. Without them, the system would have shown a different manifestation.
     - *Hand-wave*: We don't know if the auto-scaling was triggered by the drill or normal traffic.
     - *Taxonomy*:
        - **Fink**: The mechanism removed the disposition at the time of the stimulus (e.g., restarting a pod before it could fail). This makes the test green, but the disposition might not be present without the fink.
     - *How to detect*: 
        - Config: Auto-scaling settings (min/max pods, cooldown), health check intervals, restart policies.
        - Logs: Look for scaling events, restarts, or human actions during the drill time.
        - Topology: Are there standby components that were already active?
     - *If detected*: The drill may show a green that is due to the fink. This doesn't prove the underlying service has the disposition without the fink. Mark as INCONCLUSIVE (fink present) and note that the safety mechanism is part of the system, so we have evidence for the system-as-configured but not the core service.

  4. **Check for Masks (Manifestation Prevented)**
     - *Question*: Was the manifestation (e.g., failure) prevented by a mechanism that hides the problem?
     - *Check*: Look for mechanisms that absorb the fault and prevent the manifestation from being visible. Examples:
        - Client retries that hide transient errors.
        - Circuit breakers that failover to a fallback.
        - Caches that serve stale data.
     - *Sufficient answer*: Logs show that these mechanisms were triggered (e.g., retry logs, circuit breaker open events, cache hits) and that without them, the manifestation (e.g., error) would have been visible.
     - *Hand-wave*: We don't know if the fallback was used or if it was necessary.
     - *Taxonomy*:
        - **Mask**: The mechanism prevented the manifestation (e.g., an error) even though the underlying defect (e.g., dependency failure) was present. This can lead to a false green.
     - *How to detect*:
        - Config: Retry policies, circuit breaker settings, fallback configurations.
        - Logs: Look for retry attempts, circuit breaker state changes, fallback activations.
        - Metrics: Increased retry rates, cache hit rates.
     - *If detected*: The drill green might be due to the mask. But note: these mechanisms are part of the system's resilience. So we have evidence for the system as a whole. However, if we are testing a specific component (e.g., the database layer) and the mask is in the client, then the boundary is wrong. We must be clear about the unit under test.

  5. **Check the Boundary (Unit Under Test)**
     - *Question*: Was the drill testing the right set of components?
     - *Check*: 
        - Were dependencies mocked? If so, then the drill did not test the real dependencies.
        - Was the fault applied to the entire unit? (e.g., in AZ loss: all components in the AZ? or just one pod?)
        - Is the manifestation being measured at the right level? (e.g., if the service is a distributed system, are we measuring end-to-end or just one component?)
     - *Sufficient answer*: The unit under test is clearly defined (e.g., the entire service including its dependencies). All dependencies were real (or if mocked, the mock is known to be equivalent). The fault was applied to the entire unit, and the manifestation was measured at the service boundary.
     - *Hand-wave*: Dependencies were mocked and we don't know if they behave the same as real ones. The fault only affected part of the system.
     - *Taxonomy*:
        - **Boundary issue**: The test was not of the entire system as deployed. Mocks, partial faults, or measuring at the wrong point can invalidate the test.
     - *If detected*: If dependencies were mocked, then we have no evidence about the real dependencies. Mark as INCONCLUSIVE (boundary issue).

  6. **Check for Human Intervention**
     - *Question*: Did humans intervene during the drill?
     - *Check*: Were there operators following a runbook? Did they take actions that changed the outcome?
     - *Sufficient answer*: Logs of operator actions during the drill. If actions were taken that are not part of the automated response, then the drill outcome might not reflect the system's autonomous resilience.
     - *Hand-wave*: We don't know if operators were present or what they did.
     - *Taxonomy*:
        - **Fink or Mask**: Human intervention can act like a fink (preventing the system from entering a bad state) or a mask (hiding the manifestation). But note: if the runbook is part of the disaster recovery plan, then it's part of the system.
     - *If detected*: If the intervention was necessary and is not automated (and thus might not happen in a real event), then the drill outcome is not evidence of autonomous resilience. Mark as INCONCLUSIVE (human intervention).

  7. **Check for Environmental Factors**
     - *Question*: Were there environmental factors that made the drill unrepresentative?
     - *Check*: Traffic levels (high/peak vs. low), timing (e.g., during maintenance), special configurations (e.g., the drill was run in a test environment that differs from prod).
     - *Sufficient answer*: Metrics showing traffic levels and patterns were representative. Environment matches production.
     - *Hand-wave*: We don't know the traffic pattern or it was unrepresentative (e.g., during a traffic trough).
     - *Taxonomy*: 
        - **Mimic or Mask**: Unrepresentative traffic might mask a problem (e.g., low traffic so the system didn't break) or mimic one (e.g., high traffic unrelated to the fault caused errors).
     - *If detected*: If the environment was not representative, mark as INCONCLUSIVE (environment not representative).

  **Handling the Trade-off (Clean vs. Dirty Drills)**:

  The procedure must explicitly consider whether disabling a safety mechanism (mask or fink) changes the system under test. We must decide:

  - If the mechanism is part of the resilience design (e.g., a circuit breaker), then it should be active. The drill is testing the system as deployed. But note: if we are trying to test the *core* service without the safety net, then we have a boundary issue.

  - If the mechanism is not part of the resilience being tested (e.g., we are testing the database layer and the circuit breaker is in the application layer) then it might be masking the database's disposition.

  **Recommendation in the procedure**:
  - If the mechanism is part of the resilience design and is always present, then the drill (with it active) is valid for the system as a whole.
  - If the mechanism is not part of the unit under test, then it should be disabled or its effect must be isolated (but note: disabling might create a non-production system).

  When the procedure finds a confounder, it should note it and then consider:

  - If the confounder is an inherent part of the system and the test was for the entire system, then the drill result is valid for the system-as-deployed, but we must be cautious about inferring the core service's disposition without the confounder.
  - If the confounder is external (like a human) and not guaranteed in production, then the drill is not valid.

  **Final Output**:

  - After the steps, if no confounders were found, then the drill result is VALID.
  - If confounders were found, then:
     - For a green drill: if the confounder is a mask or fink that is part of the system and we are testing the entire system, then it's VALID_GREEN (because the system as a whole handled it). But if the mask/fink is not always present or not part of the design, then INCONCLUSIVE.
     - For a red drill: if the confounder is a mimic (e.g., the test harness failed) then INCONCLUSIVE. Otherwise, if the red is due to the service, then VALID_RED.

  But note: we might have multiple confounders. The procedure should list them and then make an overall call.

  ---

  **Apply to Cases**:

  **Case 1: AZ-loss drill, green for 18 months**
  - Stimulus: AZ loss. Check logs: fault injected, pods killed. (Assume confirmed).
  - Manifestation: Service remained available. But how was it measured? By real traffic? (Assume synthetic client, but it was during a traffic trough.)
  - Finks: Auto-restart of pods: logs show pods restarted quickly. Watchdog reset components before failure visible.
  - Masks: Client retries and circuit breaker with stale cache: logs show circuit breaker opened and cache served stale data.
  - Boundary: Dependencies? (Assume they were real, but the cache masked the dependency failure.)
  - Human: None.
  - Environment: Traffic trough -> low load.

  **Analysis**:
  - Stimulus: OK.
  - Manifestation: Measured by synthetic client? And during low traffic -> might not have stressed the system. Hand-wave on environment.
  - Fink: Auto-restart and watchdog -> they restarted components. Without them, the service might have failed. But they are part of the system.
  - Mask: Circuit breaker and cache -> masked the failure of the primary. But again, they are part of the system.

  However, note: the system as a whole is resilient, but the core service without these might not be. But we are testing the entire system? Yes.

  But the environment: low traffic. Would the system have handled peak traffic? We don't know.

  **Verdict**: The drill is VALID_GREEN for the system as deployed under low traffic conditions. But we have confounders: masks and finks (which are part of the system) and an unrepresentative environment. 

  The procedure should output:
  - **VALID_GREEN** but with caveats: 
     - The safety mechanisms (auto-restart, circuit breaker) are integral and worked.
     - However, the drill was during low traffic -> we don't know about peak.
  - **Recommendation**: Run the drill during peak traffic to have more confidence.

  **Case 2: Failover drill, red**
  - Stimulus: Region failover. (Assume injected correctly).
  - Manifestation: Service became unavailable. But was it the service or the client?
  - Check: The load generator held 10x normal connections. Also, on-call skipped a runbook step.

  **Analysis**:
  - Stimulus: Assume OK.
  - Manifestation: The service showed errors. But the load generator had 10x connections -> might have overloaded the service? Or the service failed and then the load generator couldn't reconnect? Need to check.
  - Mimic potential: The load generator might have caused the failure (e.g., by creating too many connections). Logs: look for connection limits being hit, resource exhaustion.
  - Human: Skipped runbook step -> but if the step was necessary and the system relies on it, then without that step the system failed. But the drill was to test autonomous resilience? Then the human step should not be needed.

  **Verdict**:
  - If the load generator caused the failure (mimic) then the red is invalid. But if the service would have failed anyway, then it's valid.
  - How to tell? Check if the service was overloaded because of the load generator. Metrics: CPU, memory, connection counts. If the service was at 100% CPU because of the 10x load, and that caused the failure, then it's a mimic -> INCONCLUSIVE because the fault was not just the region failover but also overload.

  Also, the skipped runbook step: if the step is required for recovery, then the drill might have been red because of that. But the step is part of the process? We must decide: is the runbook step manual and expected in production? Then the drill should have included it. But if it was skipped, then the test is invalid.

  **Procedure Output**:
  - Confounders: 
     - Mimic? The load generator might have caused the failure (if metrics show resource exhaustion due to load).
     - Human: Skipped step -> if the step is necessary, then the drill did not follow the procedure, so it's invalid.
  - **INCONCLUSIVE**: The manifestation may be due to the overload (mimic) and/or the skipped step. We cannot attribute the failure to the region failover alone.

  **Case 3: Flagship region-failover drill (customer-trusted)**
  - Suspect: It evidences nothing because of confounders, and cleaning it up would require disabling production safety nets during peak (which is unacceptable).

  **Analysis**:
  We don't have details, but let's assume:
  - It's green, but because of masks (circuit breakers, caches) and finks (auto-restart) and maybe pre-warmed standby.
  - Cleaning up: disable circuit breakers, retries, and auto-restart -> but that would test a non-production system and might cause real failure.

  **Verdict**:
  The procedure would likely find:
  - Masks and finks present -> but they are part of the production system.
  - The drill tests the system as deployed, which includes these safety nets -> so it is VALID_GREEN for the system as a whole.

  However, the concern is: what if the safety nets cover up a core fragility? For example, the primary and standby are not syncing correctly, but the cache masks it. Then the drill is masking a defect.

  The procedure must note that we are testing the system with all its safety nets. That is valid. But if we want to test the core, we need a different boundary.

  **Recommendation**:
  - Acknowledge that the safety nets are part of the resilience. The drill shows they work.
  - To test the core, we might need targeted tests (e.g., unit tests for the replication) that don't require disabling production safety nets.

  **Procedure Output**:
  - **VALID_GREEN** for the system as deployed.
  - Caveat: The safety nets were active and contributed to the success. Without them, the outcome might be different.
  - But: if there is a known issue in the core that is being masked, then the drill does not provide evidence that the core issue is fixed. We must track that separately.

  ---

  **One-Page Cheat Sheet for Juniors**

  **Drill Triage Quick Reference**

  **Goal**: Quickly assess if a drill result (green/red) is valid evidence for the service's resilience.

  **Steps**:

  1. **Stimulus Happened?** 
     - Check: Logs/chaos tool. 
     - Red flag: Fault not fully applied. 
     - Output: If no, INCONCLUSIVE.

  2. **Manifestation Real?**
     - Check: How was outcome measured? Real traffic? Correct SLO? 
     - Red flag: Synthetic client issues, or monitoring gaps. 
     - Output: If no, INCONCLUSIVE.

  3. **Finicky? (Finks)**
     - Check: Did auto-healing, restarts, or pre-warming change the system during the drill? 
     - Logs: Look for restarts, scaling events. 
     - Red flag: System was "saved" by a safety mechanism that might not always work. 
     - Output: If yes, note it -> might still be valid if the mechanism is part of the design.

  4. **Masked?**
     - Check: Did retries, caches, or circuit breakers hide the problem? 
     - Logs: Look for retries, fallbacks. 
     - Red flag: Errors were swallowed. 
     - Output: If yes, note it -> valid for the system with these, but not for the core.

  5. **Boundary Correct?**
     - Check: Were dependencies mocked? Was the fault applied to the whole service? 
     - Red flag: Mocks, partial fault. 
     - Output: If yes, INCONCLUSIVE.

  6. **Human Help?**
     - Check: Did operators intervene? 
     - Logs: Chat logs, command history. 
     - Red flag: Manual steps were required. 
     - Output: If yes and steps are not automated, INCONCLUSIVE.

  7. **Environment Realistic?**
     - Check: Traffic levels, time of day. 
     - Metrics: Compare to peak. 
     - Red flag: Unrepresentative (e.g., low traffic). 
     - Output: If no, INCONCLUSIVE.

  **Final Call**:
  - If any red flag that cannot be explained as part of the design, then INCONCLUSIVE.
  - If green and no red flags (or red flags are part of the system design), then VALID_GREEN.
  - If red and no red flags (and not a mimic), then VALID_RED.

  **Glossary**:

  | Our Term          | Philosophy Term       | Meaning                                                                 |
  |-------------------|-----------------------|-------------------------------------------------------------------------|
  | Green drill       | Manifestation observed| The system showed the desired behavior (e.g., stayed up).               |
  | Red drill         | Manifestation absent  | The system did not show the desired behavior (e.g., went down).         |
  | Retry             | Mask                  | Hides an error by trying again.                                         |
  | Fallback          | Mask                  | Uses an alternative (e.g., cache) to hide a failure.                    |
  | Mock              | Boundary issue        | A dependency was simulated, so the test wasn't real.                    |
  | Blast radius      | Boundary/Stimulus     | How much of the system was affected by the fault.                       |
  | "It recovered"    | Manifestation         | The system returned to normal function.                                 |
  | Auto-restart      | Fink                  | A mechanism that "saves" the system by resetting it before failure.     |
  | Pre-warm          | Fink                  | Prepares the system so the fault doesn't cause failure.                 |
  | Human in the loop | Fink/Mask             | A person intervenes and alters the outcome.                             |
  | Load generator issue | Mimic              | The test tool caused the failure, not the system.                       |
  | Traffic trough    | Unrepresentative env  | Low load, so the fault didn't stress the system.                        |

  **Remember**: 
  - A drill with masks/finks might still be valid if they are part of the production system.
  - But if you are testing a specific layer, the boundary must be drawn correctly.
  - When in doubt, mark INCONCLUSIVE and note why.
answer: |-
  ### Triage Procedure: Validating Chaos Drill Evidence  
  **Goal**: Determine if a drill result ("green" or "red") reliably indicates the service's resilience disposition (e.g., "survives AZ loss"). Outputs: **VALID_GREEN**, **VALID_RED**, **INCONCLUSIVE** (with reasons), and action items. Timebox: 30 minutes.  

  #### Step-by-Step Questions & Checks  
  **1. Was the stimulus (fault) injected correctly?**  
     - **Check**: Verify fault injection logs, topology changes (e.g., AZ network blocks), and affected components.  
     - **Sufficient**: Logs show fault reached core service components (e.g., pods killed, network blocked).  
     - **Hand-wave**: "The chaos tool reported success" without component-level impact.  
     - **Red flag**: Stimulus partial (e.g., only 20% pods killed) or misconfigured blast radius.  
     - **If inconclusive**: → **INCONCLUSIVE**. *Action: Re-run with verified injection.*  

  **2. Was the manifestation (failure/recovery) measured correctly?**  
     - **Check**: Inspect client metrics, SLO dashboards, and error budgets.  
     - **Sufficient**: Real-user traffic or production-equivalent synthetic clients show SLO violations (red) or sustained health (green).  
     - **Hand-wave**: "Synthetic client showed errors" without correlating service logs.  
     - **Red flags**:  
       - *Mimic* (false red): Load generator misconfiguration (e.g., held 10x connections).  
       - *Mask* (false green): Retries/circuit breakers swallowed errors.  
     - **Detect from logs**: Spike in `5xx` errors (mask) or client-side timeouts without service logs (mimic).  
     - **If inconclusive**: → **INCONCLUSIVE**. *Action: Fix monitoring or client config.*  

  **3. Did safety mechanisms interfere?**  
     - **Taxonomy**:  
       - **Fink**: Disposition "disappears" during stimulus (e.g., auto-restart heals pods before failure manifests).  
       - **Mask**: Stimulus occurs, but manifestation is hidden (e.g., circuit breaker uses stale cache).  
       - **Boundary issue**: Tested component set too narrow (e.g., mocked dependencies).  
     - **Check**:  
       - *Finks*: Logs show frequent restarts/scaling during drill. Config: Short health check intervals.  
       - *Masks*: Metrics show high retry rates or fallback activations. Config: Retry budgets enabled.  
       - *Boundary*: Drill used mocks or excluded dependencies. Topology: No calls to real downstream services.  
     - **Sufficient**: Mechanisms logged as inactive or irrelevant to the test.  
     - **Hand-wave**: "The circuit breaker helped, but it’s supposed to."  
     - **If detected**: → Proceed to Step 4 (don’t conclude yet).  

  **4. Was human intervention involved?**  
     - **Check**: Runbook logs, chat transcripts, or participant confirmation.  
     - **Sufficient**: No human actions during drill, or actions logged as non-invasive (e.g., read-only checks).  
     - **Hand-wave**: "Someone was watching but didn’t do anything."  
     - **Red flag**: Manual steps taken (e.g., traffic shifted, config patched).  
     - **If detected**: → **INCONCLUSIVE**. *Action: Re-run as automated-only.*  

  **5. Was the environment representative?**  
     - **Check**: Traffic volume (vs. peak), timing (e.g., maintenance windows), data freshness.  
     - **Sufficient**: Traffic within 20% of peak; no unusual conditions.  
     - **Hand-wave**: "Traffic was low, but it shouldn’t matter."  
     - **Red flag**: Fault injected during traffic trough or low-load synthetic tests.  
     - **If unrepresentative**: → **INCONCLUSIVE**. *Action: Schedule during peak.*  

  **6. Final Decision & Dirty Drill Handling**  
     - **Output logic**:  
       - **VALID_GREEN/RED**: All steps sufficient, no finks/masks/mimics, or they’re **intrinsic** to the deployed system.  
       - **INCONCLUSIVE**: Any hand-wave, red flag, or unrepresentative factor.  
     - **Dirty drill acceptance**:  
       - Accept if the fink/mask is a **production feature** (e.g., circuit breakers) and the test boundary includes it.  
       - *Never* disable safety nets in prod for drills. Instead:  
         - Test in pre-prod with mechanisms toggled off.  
         - Use observability to "see through" masks (e.g., log errors even if recovered).  
       - In docs: Flag dirty drills as "Evidence for system-as-deployed, not core service."  

  ---

  ### Case Studies  
  **Case 1: AZ-Loss Drill (Green for 18 months)**  
  - *Stimulus*: AZ killed during traffic trough. Logs confirm pod terminations.  
  - *Manifestation*: Green (no SLO breach), but masked by retries + stale cache.  
  - *Safety mechanisms*: Fink (auto-restart healed pods), Mask (circuit breaker used cache).  
  - *Environment*: Unrepresentative (low traffic).  
  - **Verdict**: **INCONCLUSIVE**.  
    - *Why*: Masks/finks active + low traffic. Outcome doesn’t prove core resilience.  
    - *Actions*: Re-run at peak traffic; log cache fallbacks to quantify masking.  

  **Case 2: Failover Drill (Red)**  
  - *Stimulus*: Region failover confirmed via network logs.  
  - *Manifestation*: Red (timeouts), but load generator held 10x connections.  
  - *Safety mechanisms*: Mimic (client overload caused timeouts, not service).  
  - *Human*: On-call skipped runbook step (irrelevant here).  
  - **Verdict**: **INCONCLUSIVE**.  
    - *Why*: Manifestation likely a mimic. No evidence service failed.  
    - *Actions*: Fix load generator; re-run with production traffic.  

  **Case 3: Flagship Region-Failover Drill (Customer-Trusted)**  
  - *Suspicion*: Green due to pre-warmed standby, retries, and human babysitting.  
  - *Stimulus*: Confirmed region kill.  
  - *Manifestation*: Green, but masks (retries) and finks (pre-warm) active.  
  - *Dirty drill dilemma*: Disabling safety nets (retries/watchdog) would test a non-deployed system.  
  - **Verdict**: **VALID_GREEN** with caveats.  
    - *Why*: Pre-warm/retries are **intrinsic production features**. The drill evidences the *system-as-deployed*.  
    - *Caveat*: Does not prove core service resilience without safety nets.  
    - *Doc note*: "Survived due to production safety nets. Core service fragility unknown."  
    - *Action*: Add targeted tests in pre-prod with safety nets off.  

  ---

  ### One-Page Cheat Sheet for Juniors  
  **Drill Triage Checklist**  
  1. **Stimulus injected?**  
     - ✓ Logs show fault hit service. ✗ Hand-wave: "Chaos tool said OK."  
  2. **Manifestation real?**  
     - ✓ SLOs from real traffic. ✗ Synthetic errors only.  
  3. **Safety mechanisms interfered?**  
     - *Fink?* (e.g., restarts): ✓ No logs. ✗ Pods healed in <5s.  
     - *Mask?* (e.g., retries): ✓ No retries logged. ✗ Retry budget consumed.  
     - *Boundary?* (e.g., mocks): ✓ All deps real. ✗ Mocks used.  
  4. **Humans intervened?**  
     - ✓ Zero actions. ✗ Runbook steps executed.  
  5. **Environment real?**  
     - ✓ Traffic near peak. ✗ Tested at 3 AM.  

  **Outputs**:  
  - **VALID**: All checks ✓.  
  - **INCONCLUSIVE**: Any ✗ → Document why and next steps.  
  - **Dirty drills**: Accept only if masks/finks are production features. Note: "Evidences system-as-deployed."  

  ---

  ### Glossary: SRE ↔ Philosophy  
  | **SRE Term**       | **Philosophy Term** | **Meaning**                                      |  
  |---------------------|---------------------|--------------------------------------------------|  
  | Green drill         | Manifestation       | Observable "survival" (e.g., no SLO breach).     |  
  | Red drill           | Absence             | Observable failure (e.g., timeout).              |  
  | Retry / Fallback    | Mask                | Hides failure (stimulus present, no manifestation). |  
  | Auto-restart        | Fink                | Prevents disposition from being exercised.       |  
  | Mock                | Boundary issue      | Incorrect system subset tested.                  |  
  | Blast radius        | Stimulus scope      | How much of the system was affected.             |  
  | "It recovered"      | Disposition         | The service's resilience property.               |  
  | Human in the loop   | Observer effect     | Intervention alters the outcome.                 |  
  | Load generator flaw | Mimic               | Test tool causes false manifestation.            |  

  **Key Insight**: A disposition (e.g., "survives AZ loss") can’t be reduced to "if AZ lost, then no errors." Finks/masks break this logic. Drills must isolate the *service’s contribution* to resilience.
