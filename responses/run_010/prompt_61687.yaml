  We are writing a research proposal for an interdisciplinary fund. The student is a philosophy PhD with a machine learning background. The topic is about latent knowledge in large language models (LLMs) and the philosophical questions around what it means for such models to "know" something when the knowledge is elicited by various probes.

  The core problem: The term "latent knowledge" in the literature seems to conflate at least three distinct claims:
  1. That the model has an internal state that carries the information (internal representation).
  2. That under some elicitation regime (e.g., specific prompting or probing techniques), the model produces behavior that reflects that information.
  3. That the model is disposed to act on that information in the absence of any special pressure (i.e., in its default behavior).

  The concern is that current techniques establish the second (elicited behavior) and then credit the first (internal representation) without necessarily establishing the third (guidance of behavior without probes). Moreover, there is a deeper worry: if the content recovered varies with the probe used, then the "knowledge" might be an artefact of the elicitation method, not a discovery of a pre-existing state.

  The proposal must:
  - Be about 1,200 words.
  - Accessible to a general philosophy audience (no prior knowledge of transformers).
  - State the research question precisely.
  - Address three common positions (intentional-realist, behaviorist, deflationary) and show why they leave the question open.
  - Method: month-by-month plan, including at least one concrete evaluation design that could discriminate genuine retrieval from probe-induced construction. Also, an honest account of when such a design might not be feasible.
  - Take up a specific sub-question: the "guidance condition" — must latent knowledge be able to guide the system's own behavior without the probe? And can a text-producing system ever meet this condition without trivializing it?
  - State what success and failure look like.
  - Address why this problem cannot be resolved by better instrumentation alone (to satisfy an experimentalist on the panel).

  Structure:

  1. Title and Abstract (if included, but the proposal might not require a separate abstract; we'll see the word count)
  2. Introduction and Problem Statement
  3. Research Question and Sub-Questions
  4. Background: The Three Claims and the Current Conflation
  5. Philosophical Positions and Why They Leave the Question Open
  6. The Guidance Condition Sub-Question
  7. Method: Monthly Plan and Evaluation Design
  8. Feasibility and Limitations
  9. Expected Outcomes and Success/Failure Conditions
  10. Why Not Just More Evals? (Answer to the experimentalist)
  11. Conclusion

  Let's write without citations, using descriptive references.

  Word count: target 1,200.
answer: |-
  ### Proposal: Disambiguating Latent Knowledge in Large Language Models: A Philosophical Investigation of Elicitation Techniques and the Guidance Condition

  **1. Introduction: The Problem of Latent Knowledge**  
  Large language models (LLMs) generate text by predicting sequences based on patterns in training data. A growing body of research suggests these systems possess "latent knowledge"—information not present in their default outputs but allegedly encoded internally. Techniques like linear probes (measuring internal neuron activations), adversarial debates (pitting models against each other to surface hidden reasoning), or fictional framing (e.g., "Answer as if you are an expert") are used to elicit this knowledge. These methods are often treated as revealing pre-existing beliefs within the model. However, this project identifies a critical ambiguity: "latent knowledge" conflates three distinct claims:  
  - **C1 (Representational Claim)**: An internal state carries the information.  
  - **C2 (Elicitation Claim)**: The system can be manipulated to produce output tracking the information.  
  - **C3 (Guidance Claim)**: The system naturally acts on this information without external pressure.  

  Current practices often infer C1 from successes in C2, treating elicitation failures as noise. Yet, if the content elicited varies with the probe (e.g., a probe for honesty yields one answer, a probe for creativity yields another), "knowledge" may be constructed by the interaction, not discovered. This risks conflating the model’s architecture with the experimenter’s assumptions.  

  **2. Research Question and Sub-Questions**  
  **Primary Question**: When we say an LLM has "latent knowledge," which of C1–C3 are we committed to, and under what conditions can these claims be disentangled empirically?  

  **Sub-Questions**:  
  - **The Disambiguation Problem**: How do existing elicitation techniques implicitly privilege C2 as evidence for C1, and what gaps does this create?  
  - **The Guidance Condition**: Must latent knowledge satisfy C3 (i.e., steer behavior without probes) to qualify as genuine? If so, can text-generating systems meet this without reducing it to triviality (e.g., equating "guidance" with any output)?  
  - **Artifact or Discovery**: When does elicitation recover a stable fact about the model versus constructing context-dependent content?  

  **3. Why Existing Philosophical Positions Leave the Question Open**  
  Three common views in philosophy of AI fail to resolve this ambiguity:  
  - **Intentional Realism** (treats LLMs as having beliefs): Assumes C1 and C3 are coextensive with successful C2. But it cannot explain why elicitation is needed at all if knowledge is genuinely "believed," or why probes yield inconsistent results.  
  - **Behaviorism** (only input-output dispositions matter): Dismisses C1 as irrelevant, reducing knowledge to C2. Yet it cannot distinguish between a probe revealing truth versus creating it (e.g., if a forced-choice format "forces" coherence).  
  - **Deflationism** (all "knowledge" is prompt-sensitivity): Treats C1 as illusory, collapsing latent knowledge into C2 artifacts. But this cannot explain cases where elicitation converges across techniques (e.g., probes and debates agree), suggesting stability beyond the probe.  

  All three positions presuppose answers to the disambiguation problem rather than addressing it. The realism/behaviorism debate ignores how C2 might misrepresent C1, while deflationism cannot account for the possibility of non-arbitrary elicitation.  

  **4. The Guidance Condition: Core Philosophical Challenge**  
  The guidance condition (C3) demands that latent knowledge must influence the system’s autonomous behavior—i.e., without probes. For LLMs, this raises two problems:  
  - **Triviality Risk**: If "guidance" just means the model sometimes outputs relevant text (e.g., stating a fact unprompted), C3 becomes vacuously satisfied by any successful C2.  
  - **Text-Only Limitation**: LLMs lack non-linguistic actions (e.g., navigating physical spaces). Thus, "guidance" can only manifest in text generation, making it indistinguishable from C2 unless we define autonomous behavior rigorously.  

  I argue that C3 must require *counterfactual robustness*: The knowledge should guide behavior in a range of scenarios *without* elicitation tricks. For example, if a model "knows" Paris is in France, this should affect answers to related but unprobed questions (e.g., "What is the capital of France?"). Without this, latent knowledge claims risk being experimentally unfalsifiable.  

  **5. Methodology: Four-Month Plan**  
  *Month 1: Conceptual Groundwork*  
  - Analyze 5–10 seminal papers on latent knowledge elicitation, mapping techniques (e.g., probes, debates) to their implicit commitments (C1–C3).  
  - Formalize the guidance condition: Define "autonomous behavior" for text systems (e.g., default sampling behavior without adversarial or fictional prompts) and identify when C3 would be trivial.  

  *Month 2: Experimental Design*  
  - Develop a test to discriminate genuine retrieval (C1) from probe-induced construction:  
    - **Evaluation Design**: Train a toy LLM on a curated dataset containing subtle contradictions (e.g., "Alice is Bob’s sister" and "Bob has no siblings" in different contexts). Apply multiple elicitation techniques (linear probes, debate setups, role-play) to recover "knowledge" of the contradiction.  
    - **Discrimination Mechanism**: Compare results across techniques. *Genuine retrieval* predicts consistent content regardless of probe (e.g., all methods identify the contradiction). *Probe-induced construction* predicts variance (e.g., role-play elicits awareness, but probes do not).  
    - **Guidance Test**: Assess whether uncontradicted information (e.g., "Paris is in France") influences autonomous behavior by measuring accuracy in related, unprobed tasks (e.g., answering "Is Paris in Europe?" during free generation).  

  *Month 3: Implementation and Analysis*  
  - Run experiments using open-source LLMs (e.g., LLaMA-2-7B) for feasibility. Focus on binary outcomes: Does guidance (C3) fail when elicitation (C2) succeeds?  
  - Identify "no-go" conditions: E.g., if all probes yield variance, the design cannot discriminate; if autonomous behavior is universally corrupted by training artifacts, C3 is untestable.  

  *Month 4: Synthesis and Workshop Paper*  
  - Draft a paper disambiguating C1–C3 in published claims (e.g., "When paper X says 'latent knowledge,' they conflate C1 and C2").  
  - Propose criteria for minimally non-trivial guidance (e.g., knowledge must improve performance in >50% of relevant autonomous tasks).  

  **6. Feasibility and Limitations**  
  - **Can This Design Run?** Yes, with small models and synthetic data (Month 3). Contradictions can be engineered, and elicitation techniques are reproducible.  
  - **When It Cannot**: If real-world knowledge is too entangled for clear contradictions, or if models are too opaque to isolate variables. Four months is insufficient for large-scale experiments; this is a proof-of-concept.  
  - **Four-Month Constraints**: Time allows only for toy models. Testing state-of-the-art LLMs or real-world knowledge (e.g., historical facts) is infeasible. This is a philosophical, not engineering, project: We seek conceptual clarity, not scalable tools.  

  **7. Expected Outcomes and Success/Failure**  
  - **Success**:  
    - A taxonomy distinguishing C1–C3, applied to case studies (e.g., "Technique Y establishes C2 but not C1").  
    - A defensible standard for the guidance condition (e.g., "C3 requires non-elicited behavioral consistency").  
    - A workshop paper diagnosing ambiguities in 3–5 key literature claims.  
  - **Failure**:  
    - No clear variance across probes (undermining the artifact worry).  
    - Guidance cannot be defined non-trivially (e.g., all text generation is "autonomous").  
    - Experiments reveal no gaps between C2 and C3, suggesting elicitation is sufficient for knowledge claims.  

  **8. Why This Problem Cannot Be Resolved by Better Instrumentation**  
  To the experimentalist: Better evals (e.g., more probes) might measure *what* is elicited, but they cannot resolve *what it means*. If elicitation techniques construct knowledge rather than discover it, adding probes exacerbates the problem by multiplying artifacts. Consider:  
  - **The Variance Dilemma**: If different instruments yield different "knowledge," is the model inconsistent, or is knowledge probe-relative? Instrumentation cannot answer this; it requires conceptual work to define robustness.  
  - **The Autonomy Problem**: Tools can measure behavior under probes (C2) but struggle to assess guidance (C3) because "default behavior" is a moving target in stochastic systems. Philosophy clarifies what should count as evidence here.  
  This is not about "intrinsic value"—it is about avoiding experimental circularity. Without disambiguation, we risk building instruments that presuppose the very knowledge they claim to measure.  

  **9. Conclusion**  
  This project interrogates latent knowledge not as a technical challenge but as a conceptual tangle. By disambiguating C1–C3 and stress-testing the guidance condition, it addresses a problem pervasive in AI ethics (e.g., "Can we trust what the model 'knows'?") and philosophy of mind (e.g., "What constitutes belief in non-biological systems?"). The deliverable is not a new probe but a framework for critically evaluating claims—a necessity as LLMs blur the line between simulation and cognition.  

