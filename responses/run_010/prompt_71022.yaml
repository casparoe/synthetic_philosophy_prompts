answer: |-
  **MEMORANDUM**  
  To: Department of Curriculum Committee  
  From: Graduate Representative, History of Science  
  Date: 2 October 2023  
  Subject: Recommendation for Revision of HS 101–104 Survey Sequence  

  ### RECOMMENDATION  
  I propose adopting a modified version of **Proposal B**: Merge HS 103 ("The Renaissance") and HS 104 ("The Scientific Revolution, 1500–1750") into a single course, **HS 103: "Early Modern Science, 1450–1700: Transformations and Exchanges,"** retaining the core content while adding material on global networks. The freed slot will create **HS 104: "Circulation of Knowledge: Techniques, Objects, and Empire, 1200–1800."** HS 101 (ancient) and HS 102 (medieval) will remain unchanged.  

  ### SUBSTANCE OF THE DISPUTE  
  The external reviewers’ objection centers on **teleology**, not continuity or scope. The title "The Scientific Revolution" implies a preordained rupture inaugurating modernity—a narrative the discipline has rigorously contested. This teleology (1) obscures antecedents (e.g., medieval innovations), (2) marginalizes parallel developments (e.g., Ottoman, Mughal, or Ming contexts), and (3) frames progress as a European achievement. While all period labels are retrospective constructs (a neutral fact), teleology politicizes them by embedding a directional myth. Proposal B’s merger directly addresses this by reframing 1450–1700 as a pluralistic epoch of "transformations," while the new HS 104 explicitly integrates marginalized perspectives.  

  Proposal A (retitling only HS 104) ignores the teleology embedded in the *sequence* itself, which positions "The Renaissance" as a prologue to revolution. Proposal C (interrogating the title pedagogically) risks incoherence: Students encountering "Scientific Revolution" on transcripts after deconstructing it may perceive departmental doublespeak. Proposal D (thematic courses) resolves teleology but sacrifices chronological scaffolding vital for first-years fulfilling breadth requirements. Our mandate is to repair the sequence’s implied narrative, not abandon its pedagogical utility.  

  ### STRONGEST CASE AGAINST THIS RECOMMENDATION  
  The student newspaper rightly argues that beginners need a "map of the past" before deconstructing it. Merging HS 103/104 *could* compress essential context, overwhelming students. Additionally, Proposal D’s sponsor may object that retaining ancient/medieval courses as-is implicitly endorses their period boundaries while only "fixing" the early modern segment. This hybrid does not fully resolve the scaffold’s inconsistencies.  

  **Response**: The merged HS 103 balances clarity and critique. By framing 1450–1700 as "Early Modern Transformations," it provides a coherent map while using "transformations and exchanges" to signal plurality. The new HS 104 *extends* chronological coverage (1200–1800), reinforcing that "modernity" has no single birthplace. This avoids Proposal D’s total overhaul but pilots thematic, cross-period teaching—addressing consistency concerns more sustainably than Proposals A or C.  

  ### IMPLEMENTATION PLAN  
  1. **Registrar & Catalog**: Submit revised course titles/descriptions by **28 October** (pre-freeze draft to committee by 14 October). HS 103 and HS 104 will be renumbered; HS 101–102 unchanged.  
  2. **Advising Sheets**: Automatic substitution for current students:  
     - Completed HS 103 + HS 104 → Counts as new HS 103.  
     - Completed HS 103 only → Takes new HS 104 + one elective.  
     - (Detailed grid attached to motion.)  
  3. **Endowed Lecture**: Maintain the "Scientific Revolution Lecture" name per endowment terms. Revise promotional materials to: "This lecture complements the department’s courses on early modern science, including HS 103: Early Modern Science, 1450–1700." Development office consulted by **21 October**.  
  4. **Faculty Commitments**:  
     - Endowed chair’s description references "HS 104" → Amend to "the department’s course on early modern science" (approved by chair).  
     - Graduate instructors: Formal notice of HS 103/104 changes by **20 October**, per union agreement. Assignments adjusted in spring.  
  5. **Timeline**:  
     - 14 Oct: Committee vote.  
     - 21 Oct: Draft substitutions + comms to development office.  
     - 28 Oct: Registrar submission.  

  ### FIRST TWO WEEKS: HS 103 (EARLY MODERN SCIENCE, 1450–1700)  
  **Week 1: Unsettling Revolutions**  
  - **Session 1**: *What Was Revolutionised?* Case study: Copernicus’ debt to Nasir al-Din al-Tusi; instrument networks from Samarkand to Nuremberg.  
  - **Session 2**: *Continuities or Ruptures?* Medieval optics (Ibn al-Haytham) vs. "new" methodologies (Bacon); the role of print in amplifying change.  

  **Week 2: Global Connections**  
  - **Session 1**: *Beyond Europe I*: Astrolabes in Mughal courts; Jesuit-Chinese knowledge exchanges; Mesoamerican botany.  
  - **Session 2**: *Beyond Europe II*: Slavery, plantations, and racialised science; indigenous knowledge and colonial erasure.  

  This structure models the course’s core argument: "Early modern science" emerges from interconnected transformations, not a European revolution.  

  ### CONCLUSION  
  This hybrid of Proposal B resolves the reviewers’ teleology concern by dismantling the "Revolution" narrative and integrating global perspectives, while preserving chronological clarity for undergraduates. It meets administrative constraints and pilots thematic approaches for future reform. Motion: Adopt the merged HS 103 + new HS 104 as described.  

  ---  
