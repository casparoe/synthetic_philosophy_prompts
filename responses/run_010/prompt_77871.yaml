  Hmm, this feels familiar - it's more insidious than ordinary stereotype resilience. The key differentiators seem to be: 1) the term's descriptive meaning shifts while its evaluative charge remains fixed 2) the expansion/contraction happens situationally in the same text 3) the writer displays apparent unawareness of the contradiction. 

  The user already knows about essentially contested concepts and thick ethical terms, but those don't quite capture the situational flip-flopping. Let me mentally scan related concepts... "Motivated reasoning" is too broad, "confirmation bias" too psychological... Ah! Janus-faced terminology? No, that implies inherent duality. "Valence-anchored descriptor" might work as a neologism - emphasizes the stable evaluation with shifting denotation. 

  Wait, we should test boundary cases. How is this different from plain hypocrisy? Hypocrisy requires awareness, while this seems more like conceptual bad faith where the writer genuinely doesn't register the contradiction because the term functions as a tribal loyalty marker rather than a descriptor. The closest established term might be "kettle logic" (after Freud's joke about the borrowed kettle), but that's about inconsistent arguments rather than unstable definitions. 

  For sharp definition: Must demonstrate 1) identical conduct receiving opposite evaluations through the same trait term 2) within one coherent text/source 3) with no acknowledgment of the tension 4) where the evaluation clearly tracks group affiliation rather than contextual differences. The smoking gun is when a writer uses "proud" for Group A's self-assertion but "arrogant" for identical Group B behavior - yet still insists both groups manifest "pride." 

  User's field suggests they'd appreciate historical examples. Victorian racial science monographs are rife with this - say, British accounts comparing "stoic" English sailors with "unfeeling" Malay sailors. Might also mention how this differs from cultural relativism, where evaluation shifts are explicit and principled.
answer: |-
  Your observation captures a sophisticated **rhetorical-epistemic maneuver** that lacks a single established term. Based on your description, I propose defining it as **"Valence-Anchored Conceptual Drift" (VACD)**. Here's a sharp definition distinguishing it from adjacent phenomena:

  ---

  ### **Valence-Anchored Conceptual Drift (VACD)**
  **Definition:**  
  The use of a descriptor (e.g., thrift, pride) whose *evaluative valence* (praise/condemnation) remains fixed to a specific group, while its *denotative meaning* situationally expands or contracts to encompass contradictory behaviors, without the user acknowledging the conceptual shift. The descriptor functions as a *valence carrier* rather than a stable behavioral category.

  ---

  ### **Key Differentiators from Adjacent Concepts**
  1. **vs. Vagueness/Barnum Generality**  
     - *Vagueness*: Ambiguity in a term's boundaries (e.g., "kindness" having fuzzy edges).  
     - *Barnum Effect*: Overly broad descriptors that fit anything (e.g., horoscopes).  
     - **VACD Distinction**: The term *specifically inverts its meaning* (e.g., thrift → miserliness) based on group affiliation, while retaining the same lexical form. The drift is *directional* and *valenced*.

  2. **vs. Double Standards**  
     - *Double Standard*: Applying different criteria to similar actions (e.g., "My group is 'patriotic,' yours is 'nationalistic'").  
     - **VACD Distinction**: The *same term* is used for both groups, but its meaning covertly shifts to absorb contradictions (e.g., "pride" = dignity for Group A, arrogance for Group B).

  3. **vs. Essentially Contested Concepts (Gallie)**  
     - *ECC*: Concepts inherently open to debate about their *best instantiation* (e.g., "justice," "democracy").  
     - **VACD Distinction**: Contradictory behaviors are framed as *manifestations of the same trait*, not competing interpretations. The user denies contestation.

  4. **vs. Thick Ethical Concepts (Williams)**  
     - *Thick Concepts*: Fuse description + evaluation (e.g., "courageous," "lewd").  
     - **VACD Distinction**: Thick concepts have *stable descriptive cores*; VACD lacks any core, as the description floats to serve valence.

  5. **vs. Unfalsifiable Stereotypes**  
     - *Stereotype Resilience*: Ignoring counter-evidence (e.g., "They’re lazy, but those who work hard are exceptions").  
     - **VACD Distinction**: Counter-evidence is *redefined as confirmation* (e.g., spending = "extravagance" or "generosity" based on group valence).

  ---

  ### **Boundary Cases & Exclusions**
  - **IN**:  
    - A historian labels Danes "pragmatic" for compromising with invaders (praise) but labels French "unprincipled" for identical behavior (condemnation), using "pragmatism" for both.  
    - "German thoroughness" = efficiency (positive) vs. "German rigidity" = inflexibility (negative), with "thoroughness" applied to both.  
  - **OUT**:  
    - *Contextual Nuance*: Calling saving "thrifty" in a famine (praise) vs. "miserly" in a boom (condemnation) *with justification*.  
    - *Explicit Redefinition*: "By 'pride,' I mean X for Group A but Y for Group B" (transparent double standard).  
    - *Genuine Conceptual Evolution*: A term's meaning shifts over time due to new evidence (e.g., "hysteria" as medical to cultural).

  ---

  ### **Why "Valence-Anchored Conceptual Drift"?**
  - **Valence-Anchored**: The evaluation (positive/negative) is fixed to the group.  
  - **Conceptual Drift**: The behavioral referent mutates without acknowledgment.  
  - **Rhetorical Function**: It immunizes prejudice against counter-evidence by making the descriptor *semiotically liquid*.

  This maneuver reveals how **language is weaponized to sustain essentialist narratives** while maintaining plausible deniability. It’s epistemic bad faith disguised as descriptive analysis. If coining a term, **"Chameleon Attribution"** or **"Valence Elasticity"** could also work, but VACD emphasizes the conceptual instability at its core. Historical precedents exist in colonial ethnography (e.g., "noble savage" tropes) and Cold War national character studies.
