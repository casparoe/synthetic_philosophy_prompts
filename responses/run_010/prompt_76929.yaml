  3. **On production of dream reports**: The production of a dream report involves cognitive processes that may include reconstruction, confabulation, and incorporation of waking impressions, and is subject to the same kinds of memory distortions as reports of waking events.

  4. **On fallibility and suggestibility**: The recall of dreams is fallible and suggestible; leading questions, expectations, and post-event information can alter the content and confidence of dream reports.

