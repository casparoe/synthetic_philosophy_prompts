answer: |-
  ### Joint Statement on the Empirical Accountability of Integrated Information Theory

  We, an IIT theorist and a methodologist, have undertaken this adversarial collaboration to clarify the empirical status of Integrated Information Theory (IIT). We agree on core aspects of the empirical record, IIT's claims, and the unfolding argument, but we disagree on key issues of testability and falsifiability. Below, we present a shared set of claims, a structured table of disagreements, predictions for a pre-agreed empirical test, and conditions for genuine defeat. We have pre-committed to this document and will not relitigate its framing.

  ---

  ### 1. Shared Claims  
  Both parties endorse the following substantive claims. A hostile reader from either camp could not deny these without misrepresenting their own position.

  1. **Empirical Record**: No current experimental method directly measures integrated information (Φ) in complex biological systems (e.g., the human brain) with the precision required by IIT. Existing tests (e.g., perturbation-based measures like PCI) are indirect, rely on approximations and auxiliary assumptions (e.g., coarse-graining choices), and have not been validated against a ground truth of consciousness.  
     
  2. **IIT's Core Assertions**: IIT asserts that consciousness is identical to a system’s cause-effect structure, quantified by Φ, which must be intrinsic, definite, and specific. It does not merely correlate consciousness with information integration; it derives physical postulates (e.g., about causal interactions) from phenomenological axioms (e.g., intrinsic existence) via a structured mapping. IIT does not assert that Φ is easily computable for all systems or that current methods are sufficient for full validation.  

  3. **Unfolding Argument's Scope**: The unfolding argument demonstrates that for any theory mapping first-person axioms to physical postulates, empirical results can be accommodated by reinterpreting the physical substrate (e.g., changing spatiotemporal grain or system boundaries) without altering axioms. It does not show IIT is false, uninformative, or incapable of making predictions; it claims IIT is empirically unconstrained *in principle* due to this flexibility.  

  4. **Unfolding Argument's Limits**: The unfolding argument does not prove IIT is untestable in practice for specific implementations. It also does not address whether IIT’s predictions (e.g., about Φ values) are empirically accurate; it solely concerns the theory’s vulnerability to *post hoc* adjustments that evade falsification.  

  5. **Current Predictive Status**: IIT generates quantitative predictions about Φ (e.g., higher in recurrent networks than feedforward ones), which are testable in simplified systems. However, these tests are practically challenging due to computational complexity and may not resolve the theory’s core claims about consciousness in natural systems.  

  ---

  ### 2. Disagreements Table  
  We disagree on the following issues. The table includes each side’s formulation, the nature of the disagreement, whether it is a crux (i.e., settling it would shift at least one side’s view), the test/argument bearing on it, and predictions for the pre-agreed circuit test (detailed in Part 3).  

  | Issue | IIT Theorist's Formulation | Methodologist's Formulation | Substantive or Verbal? (If verbal, key term) | Crux? | Test/Argument Bearing on Issue | Predictions for Circuit Test (F vs. R) |
  |-------|----------------------------|-----------------------------|---------------------------------------------|-------|--------------------------------|--------------------------------------|
  | **1. Empirical testability of IIT** | "IIT is empirically testable because it generates specific, quantitative predictions about Φ (e.g., ordering of systems) that can be directly computed and falsified for a fixed substrate specification. Failures require theory revision, not unfolding." | "IIT is not empirically testable because the unfolding argument shows that any empirical outcome can be reconciled with the theory by reinterpreting the substrate (e.g., grain or boundaries), making it unfalsifiable in principle." | **Part verbal, substantive**. Verbal due to "testable": IIT theorist means *predictions can be checked under fixed constraints*; methodologist means *cannot be falsified without recourse to unfolding*. Substantive on whether fixed-specification tests constrain the theory. | **Yes** (settling would shift methodologist’s view if IIT is falsifiable under fixed constraints). | The circuit test (Part 3), with fixed grain and computation. Both accept its outcome as bearing on IIT’s predictions. | **IIT Theorist:** Predicts Φ(R) > Φ(F). Accepts Φ(F) ≥ Φ(R) as falsifying IIT’s prediction. <br> **Methodologist:** Predicts Φ(R) > Φ(F) (as IIT’s computation), but if Φ(F) ≥ Φ(R), accepts it as evidence IIT can be falsified *in this fixed-grain context*—yet maintains unfolding prevents general falsifiability. |
  | **2. Role of axioms-to-postulates mapping** | "The inference from axioms to postulates is deductive: axioms necessitate physical requirements (e.g., feedback for integration), so IIT’s predictions are fixed and not ad hoc. Unfolding is avoidable with independent constraints (e.g., biological plausibility)." | "The inference from axioms to postulates is abductive (inference to best explanation), allowing multiple mappings. Unfolding is inherent to the method, making post-hoc adjustments always possible to preserve axioms, regardless of data." | **Substantive** (disagreement on inferential logic). Key term: "deductive" vs. "abductive" shapes whether mappings are flexible. | **Yes** (settling would shift both sides: IIT theorist if mappings are abductive, methodologist if deductive). | Conceptual argument: Analyze whether axioms (e.g., composition) logically entail postulates (e.g., causal mechanisms) or permit alternatives. | *Not applicable (argument-based crux; see Part 4)* |
  | **3. Unfolding argument’s inevitability** | "Unfolding is not inherent to IIT. With independent criteria for substrate specification (e.g., causal independence), grain choices are testable, and failures force theory change." | "Unfolding is inevitable for axiom-derived theories; substrate choices are underdetermined, allowing indefinite evasion of falsification. No independent criteria fix this without circularity." | **Substantive**. Disagreement centers on whether grain selection can be objectively constrained. | **Yes** (settling would shift IIT theorist if unfolding is unavoidable). | Circuit test plus general argument: If Φ(F) ≥ Φ(R) falsifies IIT without unfolding, it challenges inevitability. | *Predictions as in Issue 1* |

  ---

  ### 3. Predictions for the Circuit Test  
  Both parties pre-commit to this protocol: Two 64-unit binary circuits (feedforward F, recurrent R) with identical connection counts, I/O functions, and discrimination performance (d-prime 2.0). Φ is computed exactly at the unit grain, with no coarse-graining choices.  

  - **IIT Theorist’s Prediction and Defeat Condition**:  
    - **Prediction**: Φ(R) > Φ(F). IIT postulates that feedback increases causal integration, and recurrent architectures maximize Φ.  
    - **Accepts as Counting Against IIT**: If Φ(F) ≥ Φ(R), this falsifies IIT’s prediction for these architectures. It would require major revision (e.g., re-evaluating feedback’s role) or abandonment of IIT’s core claims.  

  - **Methodologist’s Prediction and Defeat Condition**:  
    - **Prediction**: Φ(R) > Φ(F) (as computed per IIT’s rules), but this does not validate IIT due to unfolding.  
    - **Accepts as Counting Against Their Position**: If Φ(F) ≥ Φ(R) and this is accepted by IIT proponents as falsifying without invoking grain changes (e.g., in peer-reviewed responses), it demonstrates IIT can be empirically constrained in fixed-specification cases. This would partially undermine the unfolding argument’s claim of *inevitable* unconstrainability.  

  ---

  ### 4. Closing Section: Defeat Conditions and Argument-Based Cruxes  

  - **Genuine Defeat Conditions**:  
    - **IIT Theorist**: A genuine defeat would be empirical evidence that a system with near-maximal Φ (e.g., a high-Φ artificial network) lacks any reportable consciousness *under conditions where consciousness is independently verified* (e.g., via behavioral markers not relying on IIT). This differs from revising auxiliary assumptions (e.g., computation methods), as it would violate the identity claim between Φ and consciousness.  
    - **Methodologist**: A genuine defeat would be if IIT, under its own axioms, makes a fixed-grain prediction (e.g., vanishing Φ in feedforward systems) that is falsified, leading IIT proponents to abandon or fundamentally alter the theory (e.g., dropping intrinsicality) *without invoking unfolding*. Auxiliary revisions (e.g., to Φ calculus) do not count.  

  - **Argument-Based Crux**:  
    The primary non-empirical crux is **whether the inference from axioms to postulates is deductive or abductive**.  
    - **IIT Theorist**: Argues it is deductive: axioms (e.g., "consciousness is irreducible") necessitate postulates (e.g., "physical substrates must have feedback") with no alternatives. If shown abductive, the mapping could be flexible, aiding unfolding.  
    - **Methodologist**: Argues it is abductive: multiple physical realizations could satisfy axioms (e.g., feedforward systems might achieve integration via timing), making unfolding unavoidable. If shown deductive, mappings would be fixed, reducing unfolding’s leverage.  
    Settling this (e.g., via philosophical analysis of necessity) would move both sides: the methodologist might concede testability if deductive, while the IIT theorist might accept unfolding risks if abductive.  

  - **Verbal Disagreement**:  
    A portion of the dispute is verbal, centering on **"empirical accountability."** The IIT theorist uses it to mean *predictions can be tested and falsified under constrained conditions* (e.g., fixed grain), while the methodologist uses it to mean *the theory must be falsifiable without recourse to substrate reinterpretation in all applications*. This verbal divergence stems from differing thresholds for "testability" in science. Neither party disowns this clarification, as it reflects core concerns: IIT prioritizes specific predictions, while the unfolding argument prioritizes universal constraints.  

