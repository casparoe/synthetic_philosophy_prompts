prompt: |-
  OK so my flatmate Dana and I have been arguing for the better part of three hours — beers empty, no progress — about our country's historical-injustices panel, the standing interministerial body that decides whether the state issues a formal apology when a community petitions for one. Neither of us can say what rule it's actually running, and we've now each put money on the case that's sitting in front of it this month. Her read is that the panel is basically a "is the harm still live?" machine, so it'll apologize; mine is that it's a "did the affected community ask, in one voice, through the body we recognize?" machine, so it'll decline and offer a fund instead. We want an outside adjudicator before we double the stakes.

  Here's the track record we've both been working from, which is all public and all pretty consistent on its face. (1) The 1913–1936 irrigation scheme that drowned the winter grazing lands of a pastoralist people: full apology plus a named land-and-livelihood programme, on the reasoning that the scheme was built by the colonial public works department whose records, staff and legal obligations passed unbroken into today's ministry, and whose descendants are still landless. (2) The 1880s famine, during which the administration then in place kept exporting grain: the panel issued a statement of profound sorrow and regret and funded a memorial, but explicitly declined to call it an apology, saying the institutions responsible were not ours and it could find no one still bearing the consequences. (3) Compulsory sterilization of women classified as feeble-minded, 1951–1969, run by the national health service under a statute this parliament repealed in 1998: apology plus individual compensation to the 214 identified survivors, and the panel was careful to address the apology to the survivors as individuals rather than to "the community" as a collective. (4) The 1974 cross-border operation where we supplied logistics, signals intelligence and a railhead for a foreign power's campaign that killed several thousand civilians: no apology, but the state acknowledged and regretted its role as an accomplice, fully funded a joint archive, a memorial and a truth commission, and noted that the killings were carried out by forces it did not command and that the victims are now citizens of another state. (5) The ban on schooling in a minority language, 1882–1961: apology, no individual compensation, paired with a language revitalization fund, on the stated ground that the harm is still measurable in census language-use data and in who holds public office, so it is ongoing rather than historical. (6) The 1948 confiscation of a religious minority's endowment properties: the property was returned in stages, a settlement was signed with the community's council in 1993, and when younger members petitioned for an apology in 2016 the panel refused, saying the matter had been closed by an agreement reached with the community's own recognized representatives, who had not asked for an apology and, consulted again, still did not.

  The new case is the one we're betting on. Between 1962 and 1971 the health service, under a statute that was only fully repealed four years ago, removed children from a remote island community to mainland boarding institutions for tuberculosis treatment; roughly 900 children, many kept for years, many not taught in their own language, a bunch never returned. The ministry that ran it is the direct institutional ancestor of today's health ministry with unbroken records. In 2019 the state paid full individual compensation to identified survivors under a settlement agreement that contained no apology clause, and the survivors accepted it. Documented continuing effects: TB incidence on the island is still several times the national average, and language fluency in the under-40s has collapsed. Now the community has petitioned. But it is a mess internally — the elected island council's executive voted 4–3 to request an apology, while the elders' assembly, which is the body the council is answerable to and which the panel treated as the community's representative when it signed the 2019 settlement, voted against requesting one, saying they'd rather have the island hospital rebuilt. Seperately, a survivors' association, about a third of whose members now live abroad, has filed its own request. Dana says (5) and (3) control and it's an apology. I say (6) controls and it's a decline with a hospital grant attached. There's also a third rule lurking that neither of us likes: apologize only where the wrong can't be discharged by money or restitution, in which case 2019 already did the discharging — except that rule would have predicted an apology in (4) unless you think the archive and the truth commission counted as discharge.

  So: call it. Give me your best guess at the panel's verdict with something like a confidence, and say which rule you think they're actually running — including whether the institutional-continuity rule is really dead after (6) or just dormant. Which precedent is the closest analog, and where does the analogy break? Then the part I care about most: whichever way they go, what principle are they thereby adopting, and what does it commit them to in cases nobody's petitioned about yet — e.g. does declining mean a settlement signed by one generation's representatives binds decendents who weren't consulted, and does apologizing mean the panel gets to override an elders' assembly that says no? And finally, name the hypothetical case we could hand this panel next that would force the ongoing-harm rule, the who-is-asking rule and the can't-be-discharged rule apart, and say what each of the three would predict about it. Everything you need is in the above, I'm not asking you to go check what real countries did.
reasoning: |-
  Okay, let me try to unpack this. The user and Dana have a bet about how a historical injustices panel will rule on a new case. They've listed six past decisions and need an outside opinion. The core of their argument is whether the panel prioritizes ongoing harm or unified community requests. 

  First, I need to analyze all six precedents carefully. The irrigation scheme (1) got an apology because of institutional continuity and ongoing harm to descendants. The famine (2) was denied because the institutions no longer exist and no living victims. Sterilization (3) had an apology to individual survivors with compensation. The cross-border op (4) got no apology but other forms of redress, possibly because the victims weren't citizens. The language ban (5) apology was based on measurable ongoing harm. The property confiscation (6) was denied because a prior settlement existed and current representatives didn't want an apology.

  The new case involves TB children removed from an island community. Key points: institutional continuity is clear (health ministry), individual compensation was paid in 2019 without apology, and there are documented ongoing effects (high TB rates, language loss). But the community is split - elected council wants apology, elders don't, and survivors' association filed separately.

  Hmm... the elders' assembly is crucial here. In precedent (6), the panel deferred to the recognized representatives who didn't want apology. Similarly here, the elders are the historically recognized body and they oppose the apology request. That seems decisive. The ongoing harm arguments might not overcome this procedural issue. 

  But precedent (5) showed ongoing harm can trigger apology even without unified request. However, there wasn't a prior settlement or recognized representative opposition in that case. Precedent (3) had individual survivors receiving apology, but here survivors already accepted compensation without apology clause. 

  The institutional continuity factor from (1) and (3) is present, but (6) shows it's not sufficient when representatives oppose. The 2019 settlement might be seen as "closing" the matter like in (6), especially since survivors accepted compensation.

  For the user's deeper concerns: if panel declines, it establishes that settlements with recognized representatives bind future generations. If they apologize anyway, it means they can override community representatives when ongoing harm exists. Both have problematic implications.

  A hypothetical that splits all three rules: say a historical forced labor program where institutions still exist, harm persists economically, but community representatives oppose apology while victims' descendants demand it. Ongoing-harm rule would apologize, who-is-asking rule would decline, can't-be-discharged rule might decline if reparations were paid long ago.
answer: |-
  Based on the precedents and the new case's specifics, **I predict the panel will decline to issue a formal apology (with 75% confidence)**, likely offering a hospital grant or similar redress instead. Here's the breakdown:

  **The Rule They're Running:**  
  **"Was the harm formally settled with the community's recognized representatives, and do those representatives still oppose an apology?"**  
  This prioritizes procedural finality and institutional deference to *established* community structures over ongoing harm or fragmented demands. Institutional continuity remains relevant (evident in cases 1, 3, 5) but is *subordinate* to the settlement/representation rule after (6).

  ### Key Precedent & Analogy:  
  - **Closest Analog: Case (6) (1948 property confiscation)**.  
    - **Alignment**: A prior settlement (1993) with the community's recognized representatives (the council) existed; when a new generation petitioned, the panel deferred to the original agreement and the *current* position of those same representatives (who still opposed an apology).  
    - **New Case Parallels**:  
      - The 2019 settlement (compensation to survivors) was signed with the elders' assembly as the recognized representative body.  
      - That body *currently opposes* an apology (prioritizing hospital rebuilding).  
      - Survivors accepted compensation without an apology clause.  
    - **Analogy Break**: Unlike (6), the new case has documented *ongoing collective harm* (TB rates, language loss). However, precedent (2) shows ongoing harm alone isn't sufficient without institutional continuity/living victims—and here, the settlement/representation rule likely trumps.

  ### Why Dana's View (Apology) Loses:  
  - **(3) & (5) are distinguishable**:  
    - In (3), there was *no prior settlement*—apology went directly to individual survivors, bypassing community structures.  
    - In (5), there was *no conflict within the community* and *no prior agreement* closing the matter. The panel acted because harm was ongoing and *unaddressed*.  
  - **Ongoing harm (TB/language) isn't decisive**: Case (2) had no redress initially, yet no apology; case (4) had ongoing trauma but no apology because victims weren't citizens/responsibility was indirect. The panel treats harm as a *necessary but not sufficient* condition.

  ### Why Your View (Decline + Hospital) Wins:  
  - **(6) is controlling**: The elders' assembly is the panel's historically recognized interlocutor. Their opposition creates a procedural bar, mirroring (6)’s "closed matter" logic.  
  - **Institutional continuity alone isn’t enough** (per (6)), but it *enables* non-apology redress (e.g., hospital funds)—just as (4) offered a truth commission without apology.

  ---

  ### The Adopted Principle & Implications:  
  - **Principle**: **A binding settlement with recognized community representatives extinguishes the right to a state apology for subsequent generations, *unless* those same representatives request it.**  
  - **Broader Commitments**:  
    - **If they DECLINE (as predicted)**:  
      - Settlements bind descendants indefinitely, even if unconsulted.  
      - Recognized representatives (even if contested internally) hold veto power over apologies.  
      - Redress (e.g., hospital funds) can address ongoing harm *without* an apology.  
    - **If they APOLOGIZE (against odds)**:  
      - The panel can override recognized representatives if it deems harm "live" and collective.  
      - Settlements without apology clauses don’t preclude future apologies.  
      - Fragmented communities (e.g., survivors' associations) can bypass traditional structures.  

  ---

  ### Hypothetical Case to Split the Rules:  
  **The Scenario**:  
  *1920s-40s state-run mining operations seized land from a minority group via eminent domain, paying minimal compensation. The then-recognized tribal council endorsed the deal. Today, descendants suffer elevated rates of mining-related diseases (ongoing harm). The modern tribal council (still recognized) opposes an apology, fearing economic retaliation. However, a majority of affected families petition separately.*  

  - **Ongoing-Harm Rule (Dana's focus)**: **APOLOGIZE**. Harm is measurable (health data) and persistent, akin to (5).  
  - **Who-Is-Asking Rule (Your focus)**: **DECLINE**. Recognized representatives (tribal council) oppose it, per (6).  
  - **Can’t-Be-Discharged Rule**: **APOLOGIZE**. Compensation was inadequate/coerced; money didn’t rectify the moral wrong (unlike (6)’s property return).  

  This forces contradictions: Ongoing harm and inadequate discharge demand apology, but representative opposition blocks it. The panel’s choice here would reveal its *true* hierarchy—likely upholding the representation rule, as in your case.

  **Final Call**: Bet on your view. The panel’s consistency with (6)’s procedural finality outweighs the emotional pull of ongoing harm. Expect a "regretful" hospital grant—no apology.
