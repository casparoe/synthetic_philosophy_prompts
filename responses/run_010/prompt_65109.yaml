prompt: |-
  I run acquisitions for a tiny new-media collection — about $180k a year, four purchases, and the board signs off on each. The problem is that a growing chunk of what we're asked to buy can't really be seen by anybody. Generative pieces that re-run differently every time, durational works where all we have is four minutes of documentation, net art whose host site is gone. So the whole first-hand-encounter story about aesthetic judgment falls apart for us, and what's left is other people's word: a registrar's condition note, a curator who watched the piece perform once in 2019, a review, the artist's own description of what it's supposed to do.

  Write me a decision procedure my commitee can actually run — the questions in order, what counts as a sufficient answer to each, where it stops at don't-buy, and where it hands the decision back to a person because the question is about values rather than facts. Ground it in whatever the philosophy of aesthetics really says about testimony: the line that you can't come to know a work is any good on someone else's say-so, versus the line that a reliable witness's word is as good as looking when looking isn't an option. No bibliography, and no both-sides hedging — I want you to commit to whether first-hand acquaintance is doing genuine work here or is mostly a prejudice against secondhand knowledge, give your reason, and build the procedure on whichever side you take. Constraints: an hour a month of committee time, and nobody on it can read code.

  Then run it on three cases: a generative work each of the three of us watched run once, for four minutes apiece; a 1997 durational piece that survives only as a recording plus the artist's notes, which two critics we trust describe in glowing but mutually inconsistent terms; and a photographic print we can hang in the viewing room all afternoon. Tell me where the procedure lands the same way on all three, where it splits them, which call you expect me to hate, and what the procedure structurally cannot settle no matter how well it's written.
reasoning: |-
  Okay, the user runs acquisitions for a small new-media collection with a $180k annual budget and four purchases requiring board approval. Their challenge is that many artworks they're considering can't be directly experienced—generative pieces that change each viewing, durational works with minimal documentation, defunct net art. This undermines the traditional reliance on first-hand aesthetic judgment, forcing them to depend on testimony: curator notes, artist statements, reviews.

  I need to build a practical decision procedure grounded in aesthetics philosophy, specifically addressing whether firsthand experience is essential or if reliable testimony suffices. The user wants me to commit to one position—no hedging. The constraints are tight: one hour monthly committee time, no coding expertise on the team.

  First, I must resolve the core philosophical tension. Traditional aesthetics (Kant, Hume) emphasizes direct encounter for aesthetic judgment—you can't delegate taste. But epistemology (Coady, Lackey) shows testimony can convey knowledge when direct access is impossible, like historical events or scientific phenomena. Since new-media art often deliberately evades fixed perception (e.g., generative art's variability), insisting on firsthand experience would exclude valid artworks. The function here isn't passive viewing but engaging with a system's *potential*. Thus, I'll take the position: **When firsthand encounter is structurally impossible, reliable testimony about the work's artistic proposition suffices for acquisition judgment.** 

  Now, building the procedure. It needs efficiency—10-15 minutes per item max. Key questions must filter out unsupportable cases early. I'll structure it as a flowchart: 
  1. **Physical/Technical Accessibility Check**: Can the committee directly experience the core artistic proposition now? If yes, standard judgment applies (e.g., the photographic print). If no → proceed.  
  2. **Testimonial Foundation**: Is there multi-source testimony from qualified experts? Requires ≥2 independent descriptions (curator, critic, conservator) plus artist statement. Missing? → Don't-buy.  
  3. **Consistency Assessment**: Do accounts broadly agree on artistic intent and impact? Minor variances (e.g., durational work descriptions) are tolerable; contradictions on core ideas → Don't-buy.  
  4. **Preservation Viability**: Can the work be conserved/re-activated? No preservation plan? → Don't-buy.  
  5. **Values Override**: If all prior gates pass, committee debates acquisition merit—this is where values (collection fit, cost, historical importance) dominate facts.  

  Testing three cases:  
  - **Generative work** (briefly seen): Passes Gates 1→5. Though seen only briefly, testimony confirms variability is intentional. Preservation viable? Committee decides values.  
  - **1997 Durational Piece**: Gates 1-2 pass (trusted critics + notes), Gate 3 passes if inconsistencies are superficial. Preservation plan? If yes, values debate.  
  - **Photographic Print**: Stops at Gate 1—direct assessment suffices.  

  The user will likely hate that the generative piece gets equal procedural footing as the photograph despite minimal direct experience. But structurally, the procedure can't resolve whether *this specific work* is profound—only that it meets acquirability thresholds. Values debates remain irreducibly human.  

  Finally, the procedure’s limits: It can verify existence and viability but not artistic greatness. That’s why Gate 5 exists. Also, it can’t validate testimony truthfulness beyond consistency checks—hence requiring multiple sources.
answer: |-
  Here’s a decision procedure grounded in a committed aesthetic stance, optimized for speed and your constraints. I reject the dogma that firsthand experience is *essential* for aesthetic judgment. **Firsthand acquaintance is doing genuine work in *ideal* evaluation, but it is not necessary when structural barriers (like ephemerality, variability, or technical obsolescence) make direct perception impossible.** Aesthetic knowledge *can* be transmitted via testimony when:  
  (1) The work’s nature precludes stable/full perception,  
  (2) Testimony is from qualified, reliable sources,  
  (3) It describes the work’s *conceptual core* and *aesthetic mechanisms*, not just subjective affect.  
  A museum doesn’t need to witness a supernova to acquire a meteorite; it needs credible proof of its origin and significance. Similarly, you’re acquiring artistic propositions, not just sensory objects.  

  ---

  ### **The Decision Procedure**  
  *(Run in order; 10-15 min per work max)*  

  1. **CAN WE DIRECTLY ASSESS THE CORE AESTHETIC PROPOSITION NOW?**  
     - *Sufficient answer:* "Yes" only if the committee can experience the work’s essential behavior/meaning in its intended form *today* (e.g., a physical print).  
     - **→ If YES:** Use standard connoisseurship. Stop here.  
     - **→ If NO:** Proceed to #2.  

  2. **IS THERE RELIABLE TESTIMONY ABOUT THE WORK’S INTENT, BEHAVIOR, AND IMPACT?**  
     - *Sufficient answer:* "Yes" only with **≥ 2 independent, qualified sources** (e.g., curator, critic, conservator, technical doc) + artist statement.  
     - *Qualified sources* must have direct prior experience with the work.  
     - **→ If NO:** Don’t buy (insufficient evidence). Stop.  
     - **→ If YES:** Proceed to #3.  

  3. **DO TESTIMONIES AGREE ON THE WORK’S CONCEPTUAL CORE AND MECHANISMS?**  
     - Ignore subjective praise/faults. Focus on:  
       - What the work *does* (e.g., "algorithmically recombines images based on weather data").  
       - Its intended aesthetic effect (e.g., "creates uncanny juxtapositions questioning memory").  
     - *Sufficient answer:* "Yes" if no material contradictions on core mechanics/intent.  
     - **→ If NO:** Don’t buy (unreliable/inconsistent record). Stop.  
     - **→ If YES:** Proceed to #4.  

  4. **CAN WE PRESERVE/RE-ACTIVATE THE WORK’S ESSENTIAL BEHAVIOR?**  
     - *Sufficient answer:* "Yes" only if:  
       - A preservation plan exists (e.g., emulation, instructions, source code).  
       - Costs are feasible within your budget.  
     - **→ If NO:** Don’t buy (unpreservable). Stop.  
     - **→ If YES:** Proceed to #5.  

  5. **VALUES OVERRIDE: DOES THIS WORK ADVANCE OUR COLLECTION’S MISSION?**  
     - *Hands decision to people.* Questions:  
       - Does it fill a gap (e.g., net art pioneer)?  
       - Is the cost justified vs. alternatives?  
       - Do we trust the artist’s historical significance?  
     - *No universal sufficiency*—debate and vote.  

  ---

  ### **Case Applications**  
  **Case 1: Generative Work** (each watched 4 mins)  
  - #1: **NO** (4 mins ≠ full behavior). → Proceed.  
  - #2: **YES** (3 committee members + artist statement = qualified sources).  
  - #3: **YES** (all agree on core mechanics: e.g., "uses L-systems to generate infinite botanical forms").  
  - #4: **YES** (artist provides code + Docker container).  
  - #5: Values debate → **Likely BUY** (showcases generative art; preservable).  
  *Why you’ll hate it:* Procedure equates your 4-min glimpse with testimony—you’ll feel it undervalues direct experience.  

  **Case 2: 1997 Durational Piece** (recording + artist’s notes; conflicting critics)  
  - #1: **NO** (recording ≠ live durational experience). → Proceed.  
  - #2: **YES** (2 trusted critics + artist notes).  
  - #3: **NO** (critics materially disagree: e.g., Critic 1 says "a meditation on stillness"; Critic 2 says "a critique of labor"). → **DON’T BUY**.  
  *Why it stings:* You trust both critics, but the procedure kills it at #3. No values debate.  

  **Case 3: Photographic Print** (viewable all afternoon)  
  - #1: **YES** → Standard assessment. **BUY/DON’T BUY** based on committee’s taste.  
  *Splits from others:* Only case halted at #1.  

  ---

  ### **Where the Procedure Cannot Help**  
  1. **Authenticating "Greatness":** It confirms *what the work is* and *if it’s viable*, but #5 (values) decides if it’s "important." Two committees with identical evidence may split.  
  2. **Reconciling Testimony with Lost Context:** For the durational piece, if critics *had* agreed on core intent (e.g., "a performance about fragility"), it would pass #3—even if the 1997 cultural context is irrecoverable.  
  3. **Future-Proofing:** A "yes" at #4 doesn’t guarantee the work won’t expire in 5 years. It only checks for a *plausible* plan.  

  **Structural Bias:** This procedure privileges **conceptual clarity** over sensory impact. It assumes an artwork’s essence can be distilled into mechanisms and intent. If you acquire works whose value lies *only* in uncommunicable affect (e.g., a sublime duration), this will reject them. Commit to art as idea, not just experience.  

  ---  
  **Final Tally:** Generative: BUY; Durational: DON’T BUY; Photo: depends. Use the hour on #5 debates—that’s where collection-building happens.
