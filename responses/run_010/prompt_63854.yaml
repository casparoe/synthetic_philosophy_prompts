prompt: |-
  I am preparing a written response to a colleague's argument for a graduate seminar on the ethics of migration, and I have reached an impasse. Each of his steps strikes me as acceptable when I read it on its own, but the conclusion is one I cannot accept, and I have been unable to find the point at which the chain breaks. He states it as follows.

  (1) A legitimate state has a right to determine the composition of its political community. This is what separates a self-governing association from a mere administrative unit: a body that cannot settle who is in it does not govern itself.

  (2) Determining composition is a single power with two faces — deciding whom to admit and deciding whom to retain. A principle that permits the first while forbidding the second discriminates between two exercises of the same authority on no ground other than the direction of the change.

  (3) Nor can the prohibition be grounded in the fact of belonging. Long-settled non-citizen residents belong to the community only in virtue of its continuing determination to include them; their membership is an output of that power, not a constraint upon it. Treating it as a constraint would allow the output of a decision to veto the decision that produced it.

  (4) Therefore a state that may refuse admission at the border may, on the same authority and for the same kind of reasons, withdraw inclusion from those already resident — that is, it may remove them.

  (5) Any attempt to block (4) by appeal to the claims of the residents concedes the point: if the claims of people inside the community can override its determination of who is inside it, then the right asserted in (1) was never a right of self-determination at all, but a privilege held at the sufferance of those over whom it is exercised.

  (6) Hence the restrictionist must accept the removal of settled residents, and the open-borders advocate must give up the right to exclude. Nothing lies between these positions.

  My own instincts run the other way. I think (1) is defensible, and I think the wholesale removal of people who have built their lives inside a state is clearly impermissible, so I want both halves of the middle that (6) says is empty. I would like a diagnosis rather than a restatement of the two sides.

  (a) Is the argument valid? If it is not, identify the exact step at which it fails, distinguish the two readings between which that step slides, and explain why the step looks unobjectionable on a first pass.

  (b) If it is valid, tell me which premise I should surrender and what the surrender costs. In particular, price the alternatives: what does the freedom-of-association account of the right to exclude, what does the national self-determination account, and what does Carens's case for open borders each have to give up in order to escape (6)?

  (c) Finally, say whether there is a non-question-begging way to hold the middle I want — a right to refuse admission coupled with a bar on removing the settled — and if there is, identify the principle that separates the two cases without collapsing back into (2) or (3). If no such principle exists, say so plainly and tell me which of my two commitments I should abandon.

  Please write your answer in British English.
reasoning: |-
  Hmm, the user is grappling with a complex ethical argument about migration rights in a graduate seminar context. They've presented a colleague's logically structured six-step argument claiming states must choose between open borders or accepting removal of settled non-citizens, with no middle ground. The user finds each step plausible individually but rejects the conclusion, creating an intellectual impasse.

  Breaking down the argument: Premise (1) establishes state sovereignty over community composition as essential for self-governance. Premise (2) frames admission and retention as inseparable facets of the same authority. Premise (3) argues that residents' "belonging" can't constrain this power since it derives from the state's prior decision. Premise (4) draws the contested conclusion that exclusion implies removal rights. Premise (5) dismisses counterarguments based on residents' claims as undermining self-determination. Premise (6) presents the forced choice between restrictionism and open borders.

  The user's dilemma is fascinating - they accept premise (1) (state's right to exclude) yet find conclusion (4) (right to remove settled residents) morally unacceptable. This creates cognitive dissonance between logical progression and ethical intuition. Their request for "diagnosis rather than restatement" suggests they've already engaged deeply with the material and need conceptual clarification.

  For part (a), I'll focus on the ambiguity in premise (3)'s claim that residents' membership is "an output of that power, not a constraint upon it." This conflates two distinct concepts: the source of membership status versus the moral weight acquired through residence. The colleague's argument treats membership as purely juridical, ignoring how prolonged presence creates independent moral claims - what I'll term the "emergent constraints" position.

  For part (b), if considering validity, the sacrificial premise would be (1)'s absolutist framing. But since I find the logic flawed, I'll instead explore what various migration theories must concede: freedom-of-association models would struggle with temporal neutrality; self-determination accounts face the residency duration problem; Carens' open borders stance avoids removal dilemmas by rejecting exclusion entirely.

  For part (c), I'll propose a "temporal asymmetry principle" where prolonged residence generates person-specific obligations that constrain initial admission decisions. This distinguishes between prospective exclusion and retrospective removal without denying state authority, by arguing that moral landscape changes once individuals build lives within a community. The key is showing how time and integration create new moral facts that weren't present at admission decisions.

  The user's British English request suggests possible UK academic context, so I'll adapt terminology accordingly ("constraint" not "restriction", "whilst" not "while"). Their frustration with the binary suggests they sense the missing third way - my response should validate that intuition while providing rigorous conceptual tools to articulate it.
answer: |-
  ### Diagnosis of the Argument

  **(a) Validity and Step Failure**  
  The argument is **invalid**. It fails at **Step (3)** due to a conceptual slide between two distinct readings of "belonging" and "constraint".  

  - **Step (3) as stated**:  
    > *"Long-settled non-citizen residents belong to the community only in virtue of its continuing determination to include them; their membership is an output of that power, not a constraint upon it."*  

  - **The ambiguity**:  
    - **Reading 1 (Unobjectionable)**: Membership status is *legally constituted* by the state’s ongoing authority. The state’s power to define membership is the source of residents’ formal standing.  
    - **Reading 2 (Problematic)**: The state’s authority is *morally unconstrained* by the *de facto social integration* of residents. Here, "belonging" is reduced to a purely juridical output, ignoring the independent moral weight of established relationships, dependencies, and contributions arising from long-term residence.  

  - **Why Step (3) seems plausible initially**:  
    On Reading 1, it correctly notes that membership status depends on the state’s legal framework. This is a procedural truth about sovereignty.  

  - **Why it fails**:  
    The argument illicitly slips into Reading 2 to support (4). While formal membership is state-defined, the **moral claims** of settled residents arise not from the state’s *grant* of status, but from the *objective social reality* of their embeddedness in the community. These claims *do* constrain state power, not by "vetoing" its authority, but by generating independent obligations (e.g., non-betrayal of reliance, recognition of social ties). Step (3) conflates the *source of legal status* with the *source of moral constraints*.  

  **(b) Premise Surrender and Costs (if valid)**  
  *Since the argument is invalid, surrender isn’t required. However, if forced to treat it as valid:*  
  The premise to surrender is **(1)** – specifically, its absolutist framing of self-determination.  

  - **Cost to freedom-of-association accounts**:  
    Surrendering (1) weakens the analogy between states and voluntary associations. Associations *can* expel members, but states possess coercive power and shape life chances irreversibly. The cost: acknowledging that state sovereignty isn’t equivalent to club membership rules, diluting the "pure" autonomy argument.  

  - **Cost to national self-determination accounts**:  
    Requires admitting that self-determination is constrained by acquired rights of residents, even non-citizens. This undermines rigid ethnocultural or statist visions, forcing recognition that "the people" is a dynamic entity shaped by residence, not just sovereignty.  

  - **Cost to Carens’ open borders**:  
    Carens (e.g., in *The Ethics of Immigration*) rejects exclusion rights entirely. To escape (6), he must concede that states have *some* (limited) right to control initial admission – e.g., for short-term capacity management. This weakens his strong presumption against exclusion.  

  **(c) A Non-Question-Begging Middle Ground**  
  **Yes, a principled middle ground exists.** The key is a **temporal asymmetry principle** grounded in the **emergent moral claims of residence**.  

  - **The Principle**:  
    > *While a state may refuse admission based on prospective interests (e.g., resource constraints, cultural continuity), it may not remove long-settled residents because their prolonged presence generates person-specific obligations that constrain sovereignty. These obligations arise from: (i) the resident’s dependence on the society for their life projects; (ii) the society’s de facto integration of the resident; and (iii) the state’s prior endorsement (via residency permission) of their inclusion.*  

  - **How it avoids collapsing into (2) or (3)**:  
    - **Against (2)**: Admission and removal are **not symmetrical** exercises. Refusal at the border affects outsiders whose lives are not yet entwined with the community. Removal severs established, reliance-based ties. The "direction of change" matters because time and integration create new moral facts.  
    - **Against (3)**: Belonging is **not merely an "output"** of state power. While legal status originates with the state, the **social fact of belonging** (earned through years of participation) creates a *moral constraint* on state power. This doesn’t "veto" sovereignty but demands justification for override (e.g., removal requires overwhelming necessity, unlike exclusion).  

  - **Non-question-begging foundation**:  
    Draw on **relational ethics** (e.g., Walzer, Miller) or **reasonable reliance theory**:  
    - Individuals build lives based on the state’s implicit assurance of stable residence.  
    - Society benefits from their labour and participation.  
    - Removal constitutes a *retroactive harm* by destroying settled expectations, distinct from prospective exclusion.  
    This distinguishes "pre-integration" (border) from "post-integration" (removal) scenarios without denying state authority.  

  ### Conclusion
  Your instinct is defensible. The argument fails at Step (3) by reducing "belonging" to a juridical fiction and ignoring the moral gravity of embedded social existence. The **temporal asymmetry principle** – affirming exclusion rights while barring removal of the settled – is coherent. It requires no surrender of core commitments but insists that self-determination is bounded by the obligations states incur *over time* through their own practices of inclusion. The state’s right to define its community is real, but it is not a carte blanche to undo the moral consequences of that definition once lives have been built upon it.
