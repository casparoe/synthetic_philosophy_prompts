prompt: |-
  I'm on the grants committee of a small private foundation — 14 of us, mostly faculty plus a couple of program officers, around 70 applications a cycle, and we fund 8. Our old process was, honestly, a mess: everyone read what they wanted, we went proposal by proposal with a show of hands, and the chair broke ties. After the last round two members admitted separately that they'd voted against papers they actually liked in order to keep a competing application alive, and one of them seemed proud of it. The new chair wants a written rule adopted before next cycle, published to applicants up front, and defensible if someone appeals — which is apparently why I'm doing this, because I took a social choice course a decade ago. My brother, whos done some game theory, told me not to bother: that Gibbard-Satterthwaite proves any non-dictatorial rule over three or more alternatives is manipulable, so whatever we write is a polite fiction, and we should just have an outside reviewer score everything and draw lots among the top three.

  I don't buy his argument entirely, but before I go shopping for rules I want to know what I should even be demanding of one. So write the desiderata: what an adequate selection procedure for a committee like ours has to deliver — the properties it must have, the cases it must get right, the distinctions it must not collapse, the formal results it has to be consistent with — with the consideration or the concrete committee example behind each item, and mark which ones are genuinely non-negotiable for us and which are just tastes of one camp in the literature. The ones I most want pressure-tested are the ones that sound self-evidently good. Is strategy-proofness really the target, or is the underlying worry that sophisticated members exploit honest ones — and does it matter whether we get dominant-strategy protection or only no-gain-given-plausible-beliefs, and whether it's one member who can profit or a bloc of three? Are anonymity and neutrality requirements or ideals? What work is "onto" actually doing? Is demanding a complete ranking of all 70 from every member itself a mistake, given that I genuinely cannot compare two applications in a field I've never worked in? And since our output is a set of eight rather than a single winner, does the impossibility framing even apply to us, or is there some different notion of manipulation for that job?

  Then flag any subset of the desiderata that can't be jointly satisfied given what's known — I suspect thats the interesting part and my brother is half right, but I want to know exactly which requirement does the damage and what giving it up would cost us, including whether restricting the admissible preference profiles or allowing randomized rules buys anything real, and whether the fact that we'll all be colleagues again next cycle changes whether manipulability matters at all. Tell me which single desideratum knocks out the most otherwise-attractive candidates. Finish with a very short scorecard, a few lines each, for what people would realistically propose to us: Borda, instant runoff, approval, score/range, plurality with the chair breaking ties, and my brother's lottery. No history and no proofs, please — just the spec.
reasoning: |-
  Okay, the user is on a grants committee dealing with a messy voting process. They need a new rule that's fair and defensible. Their brother mentioned Gibbard-Satterthwaite, saying any system can be manipulated, but the user isn't convinced. They want to know what properties a voting system must have for their specific situation.

  First, I need to break down the key requirements. The committee has 14 members, 70 applications, funding 8. The old system had members voting strategically, which caused issues. The new chair wants a written rule that's transparent and appeal-proof. 

  The user asks about desiderata: which are non-negotiable and which are preferences. Critical points include strategy-proofness, anonymity, neutrality, and whether ranking all 70 is feasible. Also, since they're choosing a set, not a single winner, does that change things?

  Non-negotiable desiderata would likely include Non-Imposition (every application can win), Universal Domain (any preferences allowed), and Pareto Efficiency. Anonymity and Neutrality seem important for fairness but might be ideals. Strategy-proofness is tricky; maybe they can only aim for resistance to manipulation rather than full proofness. 

  The user questions if complete rankings are necessary. Requiring members to rank all 70 might lead to arbitrary preferences in unfamiliar fields, reducing accuracy. Maybe they need a system that allows partial rankings or scores.

  Gibbard-Satterthwaite applies to single-winner elections. Since they're selecting a set, they might avoid the impossibility theorem. However, other theorems like Gibbard's extension or Duggan-Schwartz show that strategy-proofness for multi-winner is still problematic. 

  Trade-offs: If they want strategy-proofness, they might need a random lottery, like the brother suggested. But that could be unpopular. Or, they could use score voting, which is strategy-resistant but not perfect. Approval voting is simple but might lead to bullet voting.

  For the scorecard: Borda is manipulable. Instant runoff is complex. Approval is simple but encourages insincere voting. Score voting allows expression but not immune to strategy. Plurality with chair tie-break risks bias. Random lottery after scoring is strategy-proof but might seem unfair.

  The user's deeper needs: They want a defensible, transparent system that minimizes manipulation and maintains committee cohesion. Since they're colleagues, repeated interactions might discourage blatant manipulation. A balance between fairness and practicality is key. Score voting or approval with peer discussion could work, accepting some manipulability but reducing its impact through transparency.
answer: |-
  Here’s a structured breakdown of desiderata for your grants committee, trade-offs, and a scorecard of common voting systems—tailored to your context of selecting 8 winners from 70 applications.

  ---

  ### **Core Desiderata**  
  *(Non-negotiable requirements to avoid fundamental failures)*  
  1. **Non-Imposition (Feasibility)**: Every application must be *able* to win under some preference profile.  
     *Why*: If some proposals are excluded by rule design (e.g., "no biomedical grants"), applicants deserve to know upfront.  
  2. **Universal Domain**: The rule must accept any logically coherent ranking of applications by committee members.  
     *Why*: Members have diverse expertise; forcing artificial preferences (e.g., "rank all 70") corrupts decisions.  
  3. **Pareto Efficiency**: If *every* member prefers proposal A over B, B shouldn’t be funded if A isn’t.  
     *Why*: Prevents universally disliked proposals from winning due to technicalities.  
  4. **Set Rationality**: The output must be a set of 8 distinct winners (no ties for 8th place unless resolved fairly).  
     *Why*: You have a fixed budget; ambiguous outcomes invite appeals.  

  ---

  ### **Negotiable Desiderata**  
  *(Ideals worth balancing against practicality)*  
  5. **Strategy-Proofness (SP)**: No member can gain by misrepresenting preferences.  
     *Why non-negotiable?* Your committee has a history of manipulation. *But*: Gibbard-Satterthwaite (extended to multi-winner by Duggan-Schwartz) proves SP is **impossible** for deterministic rules selecting ≥2 winners with ≥3 options, unless dictatorial.  
     *Compromise*: Aim for "resistance" (manipulation is hard/unpredictable) or use randomization.  
  6. **Anonymity & Neutrality**:  
     - *Anonymity*: All members’ votes have equal weight.  
     - *Neutrality*: Rules treat all applications symmetrically.  
     *Why ideals?* Anonymity prevents chair tyranny; neutrality ensures fairness. But sacrificing neutrality (e.g., chair tie-breaks) may be pragmatic.  
  7. **Expressive Inputs**: Members shouldn’t be forced to submit uninformative data (e.g., ranking unfamiliar proposals).  
     *Why*: Forcing rankings on 70 apps across disciplines yields noise. Score-based systems (e.g., 1–5) allow "no opinion" options.  

  ---

  ### **Critical Trade-offs & Impossibilities**  
  - **The SP Trap**: If you demand **strategy-proofness**, **determinism**, and **non-dictatorship**, you *must* sacrifice either:  
    - **Completeness of preferences** (e.g., restrict members to scoring only apps in their field), or  
    - **Output flexibility** (e.g., use a random lottery, which *is* SP).  
    *Cost*: Field-based restrictions may miss interdisciplinary gems; lotteries lack legitimacy.  
  - **Ranking vs. Rating**: Requiring full rankings of 70 apps is **infeasible** and invites manipulation. Rating systems (e.g., scores) handle incomplete preferences better but are vulnerable to tactical exaggeration (e.g., rating your top pick "5" and rivals "1").  
  - **Bloc Manipulation**: SP for individuals ≠ SP for coalitions. A bloc of 3+ members can often tilt outcomes. Repeated interactions (you’re colleagues long-term) may deter blatant collusion but encourage subtle tactics.  

  ---

  ### **Scorecard of Proposed Systems**  
  *(Evaluated against your needs)*  

  | **System**              | **Strengths**                                  | **Weaknesses**                                  | **Verdict**                         |  
  |-------------------------|-----------------------------------------------|------------------------------------------------|-------------------------------------|  
  | **Borda Count**         | Recognizes consensus picks; simple math.      | Highly manipulable ("burying rivals"); fails SP. Misranks unfamiliar apps. | **Avoid**—invites gaming.         |  
  | **Instant Runoff**      | Eliminates weak proposals; familiar in academia. | Complex for 70→8; vulnerable to "pushover" tactics. Favors polarized apps. | **Poor fit**—scales badly.        |  
  | **Approval Voting**     | Simple: members vote "yes" on any worthy apps. | Encourages bullet-voting (approving only top picks); may elect mediocre consensus. | **Viable**—but monitor bullet-voting. |  
  | **Score Voting**        | Flexible ratings (e.g., 0–5); allows "no opinion." | Susceptible to exaggeration (e.g., max/min scores). | **Best compromise**—balances expressiveness/effort. |  
  | **Plurality + Chair**   | Simple; quick for large pools.                | Chair bias; collapses distinctions (e.g., 2nd vs. 70th). Favors niche blocs. | **Risky**—neutrality failure.     |  
  | **Brother's Lottery**   | Strategy-proof; meets all non-negotiable desiderata. | Perceived as unfair; undermines meritocratic values. | **Defensible but unpopular**—use as fallback. |  

  ---

  ### **Recommendation**  
  1. **Adopt Score Voting (Range 0–5)** with two rules:  
     - Members may skip ratings for apps outside their expertise.  
     - Fund the 8 with highest average scores (min. 5 ratings).  
  2. **Add Safeguards**:  
     - Publicly pre-commit to rounding rules for ties.  
     - Allow members to flag conflicts of interest (removing their ratings on affected apps).  
  3. **Why This Works**:  
     - **Practical**: Less burdensome than ranking 70 apps.  
     - **Robust**: Hard for small blocs to manipulate; random exaggeration cancels out.  
     - **Defensible**: Transparent and merit-based.  

  While not strategy-proof, its manipulability requires precise coordination and is punished by uncertainty—aligning with your committee’s repeated interactions. Pair it with a public rationale for each funded proposal to deter bad-faith appeals.
