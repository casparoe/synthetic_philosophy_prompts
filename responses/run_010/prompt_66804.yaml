answer: |-
  ## The Sand Mound

  Sand.
  Grains
  fall, drift,
  piling slow.
  Wind adds more.
  A shallow dish fills.
  This small hillock grows.
  No purpose yet defines it.
  Just grit gathering under sky.
  Is this the shape we waited for?
  A child might call it playground treasure.
  The gardener sighs, needing much more still.
  For foundations? Far too slight and shifting.
  Yet it rises, hour by patient hour.
  Almost there? Perhaps. Or just close.
  The breeze brings constant increments.
  Dunes form and reform nearby.
  This mound now stands alone.
  It is enough or not.

  ---

  ### How This Meets Your Requirements

  1.  **Form:** Strict 1-20 word progression per line.
  2.  **Subject & Predicate:** Accumulating sand. The vague predicate is "enough" (for an unnamed purpose implied by context – playground, garden, foundation?).
  3.  **The Question:** Lines like "Is this the shape we waited for?", "Almost there? Perhaps. Or just close.", and "It is enough or not." force the reader to repeatedly ask if the heap *is* "enough" yet.
  4.  **Epistemicist Reading:**
      *   There *must* be a single line where the pile determinately becomes "enough" (due to the poem's reality and the nature of sand/heaps).
      *   However, adjacent lines ("This mound now stands alone." / "It is enough or not.") describe states so similar that no observer could reliably distinguish the exact point of transition based on the poem's descriptions. The "constant increments" (line 17) ensure a margin for error – adding one more grain doesn't create a perceptible difference in status. You could guess the cutoff line, but you could never *know* you were right.
  5.  **Supervaluationist Reading:**
      *   There is no single "enough"-determining line.
      *   A run of lines (roughly from "Is this the shape..." to "This mound now stands alone.") lies in the penumbra. For these, "enough" is neither true nor false; the description applies equally well to many consecutive states ("Almost there? Perhaps. Or just close.", "Yet it rises...", "The breeze brings constant increments.").
      *   What makes "It is enough or not" (line 20) true is that it holds on *every* admissible way of making "enough" precise (sharpening). Any sharpening *must* place the cutoff somewhere within the run of indistinguishable states described in the middle lines. Pulling two adjacent lines apart (e.g., declaring line 18 "not enough" but line 19 "enough") would violate the indistinguishability the poem establishes ("constant increments," similar descriptions).
      *   The ties to the clear cases survive: Early lines ("Grains", "piling slow.") are clearly not "enough". If the pile kept growing vastly beyond line 20, it would clearly *be* "enough". But for the middle, no sharpening can violate the poem's depiction of gradual, indistinguishable accumulation.
  6.  **Final Line - The Meeting Point:**
      *   **Epistemicist:** Must grant the disjunction "enough or not" because one of them *is* determinately true (though unknowably which).
      *   **Supervaluationist:** Must grant the disjunction because it is *supertrue* – true on every admissible precisification. No matter where you draw the line, the pile at line 20 *is* either "enough" or "not enough" relative to that sharpening.
      *   **Ambiguity:** The pile at line 20 ("This mound now stands alone.") is genuinely poised. It could reasonably be called "enough" for a small purpose (a child's play) or "not enough" for a larger one (a foundation). The agreement on the *disjunction* isn't cheap; it stems from the fundamental nature of the vagueness embodied in the pile's description.
  7.  **Vocabulary:** Avoids all technical terms of vagueness theory.
  8.  **Accessibility:** As a standalone poem, it depicts the physical and temporal process of a sand pile growing, the human impulse to question its sufficiency, and the inherent ambiguity in declaring when "enough" has been reached. The philosophical machinery is embedded in the structure and progression of the descriptions, not the vocabulary.
