  ### Stage Two: Candidate Spines  
  1. **The "Healthy" repetitions** (8 entries): A poem threading this word would highlight how the ledger reduces vitality to a neutral, transferable condition—ignoring suffering coded elsewhere.  
  2. **Remarks column’s punitive verbs** ("Refusing", "Insolence", "Ran"): Isolating these would reframe resistance as the document’s disruptive core, forcing confrontation with violence in bureaucratic language.  
  3. **Adjacent entries: Sarah (sickly, £30) and Boy of Sarah (died, £5)**: A poem linking them would expose kinship only visible through loss, critiquing the ledger’s fragmentation of families.  
  4. **The total (£705)**: Building toward this number would mirror the ledger’s endpoint—aggregating humans into capital, making dehumanization visceral.  
  5. **Occupation uniformity** ("Field hand" 7×): Repeating this would stress how roles define identity, erasing individuality through labor.  
  6. **Omission of "Old Man Joe"** (infirm, low value, no remarks): Excluding him entirely would mirror the record’s neglect of the "unproductive," turning absence into commentary.  

  **Chosen spine: Remarks column’s punitive verbs** ("Refusing", "Insolence", "Ran"). It earns its place by weaponizing the clerk’s clinical language to center acts of resistance, transforming bureaucratic annotations into a stark narrative of defiance without adding a single word.  

