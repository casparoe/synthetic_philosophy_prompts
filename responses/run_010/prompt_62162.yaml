  *(Note: Values are rounded (e.g., £50, £55); disciplinary remarks: Ben ("Refusing work"), Woman ("Insolence"), Peter ("Ran away"); life events: Girl of Mary (birth implied), Boy of Sarah ("Died"); arithmetic total: £705. Clerk’s tone is detached, focused on consistency and value.)*  

