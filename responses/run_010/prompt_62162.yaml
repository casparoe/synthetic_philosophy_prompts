  ### Stage Four: The Note (149 words)  
  I kept verbs from disciplinary remarks ("Refusing," "Insolence," "Ran") to amplify resistance as the ledger’s submerged tension. "Died" and "Healthy" juxtapose mortality and the estate’s demand for vigor. "Field hand" repeats to echo the register’s homogenizing labor. "Total £705" ends the poem as the ledger does—reducing lives to capital. Old Man Joe (infirm, no remarks) contributes nothing: his exclusion falls after "Died," reflecting how the record discards the "unproductive." A 1:6 deletion rate strips context, mirroring the source: the clerk recorded only what affected value. What remains—fragmented verbs, roles, sums—proves how little of a person survives such documentation. The poem’s gaps aren’t silence; they are the shape of erasure. By crossing rows (e.g., "Healthy / Refusing"), line breaks force encounters the ledger avoids, making the bureaucratic language confess its own violence.  

