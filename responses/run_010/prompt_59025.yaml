prompt: |-
  I teach an aesthetics course and this term every student has read the same glossy Sunday-magazine essay on forgeries, the kind that arrives with its conclusion pre-attached, so I need to be able to discuss it fairly rather then just sneer at it. Here's the argument, or my compression of it:

  "A forgery that looks exactly like the original cannot be aesthetically worse than the original, because anything you can't perceive in front of the picture can't make a difference to what you see. The extra millions are paid for a story, not a surface, which is why the value we attach to authenticity is really the value we attach to a relic — the reason you'd want your grandmother's ring rather than an identical replacement. Besides, for most of the history of art nobody minded: a master's workshop sent pictures out under his name with the assistants doing most of the brushwork, and the cult of the unique hand is a nineteenth-century invention of dealers and auction houses who needed something scarce to sell. It follows that museums are being dishonest when they label copies, and the clean experiment would be to hang a first-rate forgery beside the original with the labels taken off — since visitors can't tell them apart, the difference in value is exposed as a fiction."

  I count five moves in there and I'd like an audit of each, in the order they appear. I'm inclined to think the original matters and the essay is overconfident, but I know some of it has to be right — a decent defender of originals should be happy to grant that copies can be gorgeous and that hammer prices track stories — and its not like I want to wave a slogan at a student who has actually read the thing.

  Two things to fold in wherever they belong. First, a colleague of mine insists the whole dispute turns on whether the copy is even the same work, on the grounds that what a picture looks like depends on the category you see it in, so a forged Rembrandt seen as a Rembrandt is aesthetically a different object from that same canvas seen as a 1930s imitation; tell me whether that's a point the essay is obliged to answer or a distinction that does no work here. Second, I have a half-memory that Renaissance contracts sometimes stipulated the master's own hand, which would be awkward for the third move — but don't do history for me, just say whether that move has to be true for the essay's conclusion to stand.

  Format: exactly five numbered items, one per move, a sentence or two each. Tag each holds / half-holds / fails, name what a defender of the original should concede inside it, and point to the sleight of hand if there is one. No preamble and no wrap-up paragraph — but do make the fifth item settle the thing I actually care about, which is whether the museum recommendation still follows once the first four are cleaned up.
reasoning: |-
  Hmm, the user teaches aesthetics and needs help analyzing a compressed argument from a glossy essay about forgeries. They want me to audit each of the five moves in the argument, providing clear judgments on whether each holds, half-holds, or fails, while noting what defenders of originals should concede and pointing out any sleight of hand. I need to incorporate two specific points: one about perceptual categories affecting aesthetic experience, and another about historical evidence regarding workshop practices.

  The argument has five clear moves: (1) The invisibility claim - that imperceptible differences don't affect aesthetic value; (2) The relic analogy - comparing authenticity to sentimental value like grandmother's ring; (3) The historical claim - that workshop practices show lack of concern for unique authorship; (4) The dishonesty charge - that museums are misleading by labeling copies; and (5) The museum experiment - suggesting hanging forgeries beside originals without labels to expose value difference as fiction.

  For move 1, the essay makes a materialist error by assuming aesthetic experience is purely visual. Defenders should grant that surface qualities matter most for immediate perception, but must note that knowledge of origin can change how we perceive and categorize the work. The category dependence point fits perfectly here - a forgery seen as genuine versus known as fake creates different aesthetic objects.

  Move 2's relic analogy contains a valid point about non-aesthetic value components, but wrongly conflates all value with relic value. Defenders should concede that market value includes provenance narratives, but insist aesthetic value has dimensions beyond this. The sleight of hand is equating "value" broadly with "aesthetic value" specifically.

  For move 3, the historical claim half-holds but oversimplifies. Defenders can grant that workshop systems existed, but should note that contracts sometimes specified master involvement, showing concern for authenticity. This doesn't destroy the argument but requires nuance - the move doesn't need to be universally true, just indicative of historical variability.

  Move 4 fails because the essay confuses aesthetic experience with institutional ethics. Defenders should concede that labels shape perception, but must argue that museums have a duty to provide accurate information. The sleight of hand is assuming that because viewers can't distinguish works physically, institutional honesty is irrelevant to aesthetic judgment.

  Finally, for move 5, the museum experiment doesn't follow once we clean up the previous points. Without labels, viewers would indeed have equivalent immediate experiences, but the essay's conclusion falsely assumes this proves aesthetic equivalence. The experiment actually demonstrates the opposite - that context shapes perception, and that removing labels doesn't erase the ontological difference between original and forgery. The value difference isn't exposed as fiction but shown to be multidimensional.

  I'll structure this as exactly five numbered items following the holds/half-holds/fails format with the specified components, incorporating the two additional points where they naturally fit without adding preamble or wrap-up.
answer: |-
  1.  **Imperceptible Difference Argument (Holds *half*):** The claim that imperceptible properties (like origin) *can't* affect the *immediate visual experience* holds if we strictly equate "aesthetics" with "sensory surface qualities perceived at this moment." **Concede:** Defenders must grant that a perfect visual replica provides the same *initial* sensory stimulus. **Sleight of Hand:** It equates "aesthetics" solely with this immediate visual perception, ignoring how knowledge (like origin) fundamentally shapes our *perceptual category* and subsequent aesthetic engagement (e.g., seeing it *as* a Rembrandt vs. *as* a forgery). **Category Point:** This is crucial; the essay *must* address it, as the essay's core premise collapses if aesthetic experience depends on the category under which the work is perceived.

  2.  **Relic Analogy / Value for Story (Holds *half*):** The claim that authenticity often commands higher monetary value due to non-aesthetic factors (provenance, history, rarity) holds. **Concede:** Defenders readily grant that auction prices reflect narratives, investment, and relic-like status far beyond pure aesthetics. **Sleight of Hand:** It conflates *market value* (driven by story/scarcity) with *aesthetic value*. While related, they are distinct. The essay implies that *all* value attached to authenticity is merely "relic value," dismissing potential aesthetic dimensions tied to origin (skill, historical context, intention).

  3.  **Historical Workshop Practice Claim (Holds *half*):** The claim that workshop production was common and authorship less rigidly defined historically holds broadly. **Concede:** Defenders should grant this historical fact and that the modern "cult of the unique hand" was amplified by the art market. **Sleight of Hand:** It overgeneralizes. While common, contracts *sometimes* stipulated the master's hand for key parts, indicating *some* concern for authenticity/value tied to the master's touch even then. Crucially, **History Requirement:** This move doesn't *need* to be universally true for the essay's conclusion. Its purpose is to show the *concept* of unique authorship is historically contingent, weakening the claim that originals *inherently* possess superior aesthetic value. The core argument (move 1) stands or falls independently.

  4.  **Museum Dishonesty Charge (Fails):** The claim that museums are dishonest for labeling copies fails. **Concede:** Defenders grant that labels shape perception. **Sleight of Hand:** It assumes the *only* relevant museum purpose is facilitating an immediate visual experience devoid of context, and that failing to disclose a work's status as a copy/counterfeit is ethically neutral or even preferable. This ignores the core institutional duties of scholarship, preservation, and truth-telling about what the object *is* (its history, material origin). Labeling isn't dishonesty; it's providing essential information.

  5.  **Museum Experiment & Fiction Conclusion (Fails):** The recommendation to hang unlabeled forgeries beside originals and the conclusion that this exposes the value difference as a "fiction" does **not** follow once the previous moves are cleaned up. The "difference in value" exposed is primarily the *market/relic value* based on provenance and scarcity. The experiment would indeed likely show equivalent *immediate visual impact*. However, it fails to address: 1) The *category dependence* of aesthetic experience (knowing one is a forgery *later* retroactively changes the initial experience's meaning and value). 2) The fundamental *ontological difference* – the original possesses a unique history of creation and causal connection to the artist's intention/era, which many argue *is* an aesthetic property accessible *through* knowledge, not just sight. 3) The museum's ethical obligation (move 4). The experiment doesn't expose a fiction; it highlights the complexity of value and the limitations of purely visual assessment. The aesthetic difference isn't necessarily *visible* in the moment, but it isn't therefore *fictional*.
