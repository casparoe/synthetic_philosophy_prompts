prompt: |-
  I'm a junior, and since my school doesn't offer philosophy I've been working through Dennett's Consciousness Explained on my own and running a Sunday reading group with three friends; last year I built a color-phi demo out of two LEDs and a microcontroller for our regional science fair, which is how I got into this. Here is the setup I want to reason about, stated in my own terms so we aren't at the mercy of how different textbooks describe it. Two small lights sit a few degrees apart on a dark screen, a red one on the left and a green one on the right. The red one flashes for about twenty milliseconds; roughly one hundred to one hundred fifty milliseconds later the green one flashes for the same duration. Subjects reliably report that they did not see two discrete flashes but one dot that traveled from the left position to the right position and abruptly changed from red to green somewhere near the middle of its path. The difficulty is that at the moment the dot would have had to change color, the second flash has not yet occurred, so nothing out there in the world carries the information that the color is about to be green. As I understand it, Dennett and Kinsbourne say there are two ways to fill this gap, labeled Orwellian and Stalinesque. On the Stalinesque version the brain holds back and does not let the first flash into experience until the second one arrives, then stages a single already-resolved sequence — motion plus mid-path color change — which is literally what the subject undergoes at the time. On the Orwellian version the subject genuinely undergoes a red flash, or two discrete flashes, as it happens, and only afterward is the record rewritten in memory, so the report of a mid-path color change is a confabulated memory of something never experienced. Dennett's claim, as I read him, is that no experiment can separate the two, because they agree about everything going on in the brain and about everything the subject could ever say or do, and differ on