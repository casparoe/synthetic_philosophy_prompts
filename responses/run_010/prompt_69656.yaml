answer: |-
  ### What the Rule Is
  The Nyāya five-step inference (*parārthānumāna*) requires:
  1. **Statement** (*pratijñā*): The claim (e.g., "The hill has fire").
  2. **Reason** (*hetu*): The ground ("Because it has smoke").
  3. **Example** (*udāharaṇa*): A corroborated instance where smoke and fire coexist (e.g., "Like in a kitchen"), *and* absence where there’s no fire ("Unlike in a lake").
  4. **Application** (*upanaya*): Linking the reason to the subject ("This hill has smoke, which is associated with fire").
  5. **Conclusion** (*nigamana*): Restating the claim.  

  Your description is accurate. The example isn’t decorative; it empirically anchors the universal rule (*vyāpti*) that smoke implies fire. Unlike syllogisms, Nyāya demands witnessed correlation before extrapolation. The "hidden condition" is *tarka* (counterfactual testing), ensuring no defeater (e.g., "Could smoke exist without fire? Only if it’s artificial smoke, but here no such cause exists").

  ---

  ### What It Can’t Do Without
  The rule collapses without three commitments:  
  1. **Empirically Discovered Universals**: *Vyāpti* (pervasion) must be a *perceived* constant conjunction, not a logical or linguistic rule. If you’ve never seen smoke with fire, you can’t assert their connection. Inference is perception extended through reliable patterns.  
  2. **Realist Ontology**: Properties (smoke, fire) exist independently. Their connection isn’t conceptual (e.g., "bachelor" implying "unmarried") but causal/nomic. The world has stable, observable relations.  
  3. **Negative Testing**: *Tarka* is non-negotiable. Before trusting *vyāpti*, you must eliminate scenarios where the reason fails despite the property (e.g., "smoke without fire in a magician’s illusion"). If such cases *could* exist unruled out, inference is invalid.  

  Without these, the five-step form becomes ornamental. It rejects purely formal validity (e.g., syllogisms divorced from experience) and conventionalist views (e.g., "smoke means fire by definition"). Knowledge requires engagement with the world’s actual structure.

  ---

  ### What It Merely Sits Well With
  The rule is compatible with, but doesn’t require:  
  - **Theism or Atheism**: Nyāya uses inference to prove God’s existence, but the *form* works for natural universals (e.g., smoke-fire) without invoking divinity.  
  - **Moderate Conceptualism**: You could view *vyāpti* as mind-dependent regularities *if* they’re still discovered through perception (e.g., Humean custom). But nominalism (denying universals) breaks it—without real connections, examples lose authority.  
  - **Varied Causality**: Whether causes are substances (Nyāya-Vaiśeṣika) or events (Buddhist) doesn’t disrupt the form, provided concomitance is observable.  
  - **Limited Skepticism**: It allows doubt about *specific* inferences but trusts perception-based generalization as a method.  

  The core flexibility: any metaphysics accepting that perception reveals objective patterns can use this structure. Only radical skepticism or anti-realism (e.g., "correlations are illusions") forces abandonment.

  ---

  ### The Missing Witness
  For unobservables (e.g., the self, atoms), Nyāya uses *kevalānvayin* inference—where the universal is proven by *exhaustion*, not direct examples:  
  1. **Observe an effect**: Consciousness is always changing.  
  2. **Establish necessity**: Change requires a substratum (like motion requires a mover).  
  3. **Negate alternatives**: If not a permanent self, what? Not the body (corpses lack consciousness), not senses (they’re inert).  
  4. **Infer the unobservable**: Therefore, a self exists.  

  The five-step form *strains* but holds:  
  - **"Example" becomes analogical or negative**: "Like a potter’s wheel requires a mover, consciousness requires a self. Where no self, no consciousness (e.g., inanimate objects)."  
  - **Tarka carries weight**: Rivals must propose a break in concomitance ("Could consciousness exist without a self? No, because...").  
  - **The universal is relational**: You infer the self *through* its observable effects (e.g., memory continuity).  

  **Does the form survive?** Yes, but the "example" step shifts from empirical witness to logical necessity. Purists might protest, but Nyāya accepts this for unique entities. The structure bends but doesn’t break—it reveals that examples *point* to *vyāpti*, which can sometimes be established indirectly.

  ---

  ### The Other Side of the Table
  Against a Mīmāṃsā opponent (accepts perception/inference, rejects testimony), the moves change subtly but crucially:  
  - **No appeals to scripture**: Citing the Vedas as proof of God is inadmissible.  
  - **Tighter universals**: The example *must* derive from perception alone. "Fire produces smoke" is valid; "soul exists because the Vedas say so" isn’t.  
  - **Higher burden for unobservables**: To infer the self, your negative examples (e.g., "no consciousness in rocks") must be perceptually verifiable. No relying on "authoritative absence" (*abhāva*) without evidence.  
  - **Application scrutinized**: Linking the reason to the subject (e.g., "consciousness proves self") faces stricter *tarka*: "Could consciousness emerge from atoms alone? If yes, inference fails."  

  The *form* remains identical, but content is constrained. Rhetorically, the debater avoids "as the sages say..." and amplifies perceptual correlations.

  ---

  ### For the Scene
  Your character arguing for the unobservable (e.g., the self) must:  
  1. **Pivot to effects**: "Consciousness exists (perceived), and it *must* inhere in something unchanging (inferred)."  
  2. **Frame the example negatively**: "Where there is no self (e.g., a corpse), there is no consciousness—unlike a living body."  
  3. **Demand counterproof**: "If you deny the self, show me consciousness without a substratum! Can you? No? Then my *vyāpti* holds."  
  4. **Use tarka defensively**: "Could memory exist without a persistent self? Only if perceptions randomly coalesce—but observe how recollection is orderly; randomness is absent."  
  5. **Concede the example’s limits**: "We see no 'self' directly, just as we see no atoms—but we see their effects, and reason demands their existence."  

  **Key adjustment**: The "example" becomes a *thought-experiment* (e.g., contrast cases) rather than a witnessed instance. The debater leans heavily on Step 3 (*tarka*) to pressure opponents into accepting the universal. The form holds, but its empiricism is tested—heightening dramatic tension.
