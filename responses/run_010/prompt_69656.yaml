prompt: |-
  I'm four years into a novel whose whole middle section is a public debate, so I've been reading up on Indian logic — the Nyāya stuff — to keep the scene from turning into a costume party. What hooked me is that a Nyāya argument isn't allowed to be just a premise and a conclusion. It's five moves, and one of them is an example: you say there's fire on the hill because there's smoke, then you have to produce a place where smoke and fire have actually been seen together, the kitchen or whatever, then you apply that back to the hill, then you conclude. And I gather the tradition also makes you go hunting for some hidden condition that would break the smoke–fire connection in general before you're allowed to lean on it at all.

  So here's what I want, and I'm asking as a novelist, not a scholar. What does that rule about examples actually commit you to? It looks like it's saying you can't get hold of a universal without having witnessed instances of it, which makes inference a kind of extension of perception — a very different picture from a logic where "all men are mortal, Socrates is a man" just goes through with no witness required anywhere. What does the witness requirement rule out? And what does it quietly assume about the world: that the connections between things are the sort of thing that shows up in experience at all, that a reason and what it proves are tied by something like a real invariable concommitance rather than by meaning or by convention or by how we've decided to use words?

  Then the thing that's actually breaking my scene. One of my characters has to argue for something nobody has ever perceived and nobody could — I'm keeping it deliberately vague, call it the self, or other minds, or atoms, or god, whichever suits you best. My sense is that Nyāya had some way of reaching things that aren't observable, a kind of inference that works by way of a general pattern rather than a shared instance, but I couldn't tell you the technical name. If your argument form demands a witnessed example, what happens when there is no possible example? Does the practice give up, cheat, or does the case reveal that the example was never doing the work people say it does? I want to know whether the five-step form goes under strain there or just absorbs it.

  I'd also like you to be honest about where the practice is underdetermined — which rival accounts of knowledge and justification would license the exact same rule about examples, so I don't put claims in my characters' mouths that only one metaphysics could support. And finally: what would the same argument look like if the presupposition were swapped out, if the other side of the table were a school that accepts only perception and inference as sources of knowledge and gives testimony no independent standing. What changes in the moves themselves, not just the rhetoric?

  Give it to me in these sections, in this order:

  - **What the rule is** — about 150 words, just so I know we're talking about the same thing. Correct me wherever my description above is off.
  - **What it can't do without** — about 350 words. The strict presuppositions, the ones the practice collapses without.
  - **What it merely sits well with** — about 250 words. Views that fit the practice but aren't required by it.
  - **The missing witness** — about 350 words, on the unobservable case and whether the form survives it.
  - **The other side of the table** — about 250 words, the rival reconstruction.
  - **For the scene** — about 150 words, concrete: what my debater has to do differently once she's required to produce an example for something that has no example.

  No reading list and no citations please, I'll chase those down myself if I end up needing them. Just the reasoning.
