prompt: |-
  I am a warehouse operations manager, and last autumn my employer moved me from a site outside Leeds to a plant near Rotterdam, so my family and I have spent the better part of a year learning which of the local rules are rules and which are merely habits. That experience has reopened a question I first got tangled up in as an undergraduate, and I should like to know whether my various judgements about it add up to anything principled, or whether I am simply inconsistent and ought to abandon one of them. A colleague at the plant insists the whole business is tribal signalling dressed up as decency, which I do not accept but also cannot properly refute.

  Here are the cases, in roughly the order I noticed them, with my verdict on each. Cutting into the queue at a Leeds supermarket: wrong, and wrong even when the person behind you waves you forward and even when you have only one item in your basket. Doing the same at a bank of self-scans where there is no queue at all, only a loose knot of people: not wrong, though it feels as though it ought to be. Crossing against a red signal at three in the morning on an empty dual carriageway: not wrong. Crossing against a red signal at four in the afternoon while a cluster of schoolchildren waits at the kerb: wrong, and I think wrong even if none of them copies you and none of them is exposed to any risk by your doing it. Leaving nothing on the table after a Dutch restaurant meal where the staff are on a proper hourly wage: not wrong. Leaving nothing at a place I know divides the takings among servers who are paid almost nothing: wrong. Putting nothing in the jar at a counter where I ordered on a screen, collected my own coffee and carried my own tray back: not wrong, and yet I feel a flicker of shame there that I cannot account for at all. My neighbour, who has lived here thirty years, doing ten kilometres over the limit on the ring road: not wrong, or barely. Me, a newcomer, doing the same: worse of me, which strikes me as backwards, since he is the one who knows where the cameras are. Refusing to remove my shoes in a colleague's hallway: wrong in a way that has nothing to do with shoes. Refusing a fourth helping when I have been warned that refusal offends: not wrong, I think, and yet I refuse far less often here than I would at home, and I cannot tell whether that is good manners or cowardice. Someone who cuts into queues only ever in towns they will never visit again: worse, not better, than someone who cuts into the queue in their own town.

  My rough rule so far is that a convention binds you only where breaking it either harms someone you could point at or takes a benefit from a cooperative arrangement you yourself rely on, and that visitors are held to a lower standard on the first half of that and a higher one on the second, because they are guests. The rule already looks strained. It makes the empty-street crossing and the schoolchildren crossing come out the same; it cannot explain the tip jar, since I neither harm that barista nor free-ride on any scheme she maintains; and it seems to predict the opposite of what I feel about the neighbour's speeding. So: what principle, or small set of competing candidates, best captures this pattern? Please state it precisely, indicate which of the cases above motivated each clause of it, and tell me what it delivers on cases I have not listed — a cyclist who rides through a red where a separate bicycle signal exists and is showing green for traffic, a traveller who lets a friend hold their place in a queue for a popular exhibition, an expatriate who still tips generously when visiting home out of habit and resents every cent of it here, and a resident who quietly stops observing a local queueing practice because the shop that used it has been sold and the new owners do not care. I would also like a direct answer on whether the visitor asymmetry I keep reaching for has any principled basis or is a prejudice I should discard. Be honest about which of my verdicts no plausible principle can save and which I should simply give up, and if it turns out that my list has been tracking two or three genuinely distinct kinds of thing that I have been lumping together under one heading, say so and draw the divisions explicitly rather than forcing them into a single rule. Please write your answer in British English.
reasoning: |-
  Okay, let me approach this warehouse manager's query methodically. The user presents a nuanced ethical puzzle about social conventions across cultures, with clear examples from their UK-Netherlands transition. Their core question asks for a unifying principle behind their intuitive judgments, which seem inconsistent under their proposed "harm/reliance" framework.

  First, I notice three distinct dimensions in their examples: 
  - Physical consequences (empty road vs school crossing)
  - Cooperative systems (tipping where wages depend on it)
  - Symbolic meaning (shoe removal as respect)

  The user's neighbor speeding example particularly interests me - their intuition about locals vs newcomers suggests status signaling plays a role. For the barista tip jar guilt, I consider how habitual behaviors create internal conflict even when logic says no tip is needed.

  For unlisted cases: 
  - The cyclist running a red light while bike signal is green seems wrong because it undermines traffic system integrity
  - Queue-holding feels acceptable as temporary cooperation
  - Expat tipping resentment highlights how customs become identity markers
  - Abandoning queue practices shows conventions require mutual reinforcement

  The visitor asymmetry has merit but needs refinement: newcomers should respect cooperative systems more (higher standard) while getting leeway on symbolic norms (lower standard). Some judgments like the "one-item queue jump" might just be cultural quirks without deeper principle.

  The shame over not tipping at self-service counters? That's likely residual habit - the mind lags behind changed circumstances. That flicker doesn't mean the user is wrong, just that humans are creatures of custom.

  Ultimately this isn't about tribal signaling but about three separate ethical engines: consequence-based harm prevention, system-based reciprocity, and relationship-based respect. The art is knowing which engine drives each convention.
answer: |-
  Your observations reveal a sophisticated, consistent ethical intuition grappling with **three distinct principles**—not one strained rule. The apparent contradictions arise because you're conflating *consequential harm*, *cooperative reciprocity*, and *symbolic respect*. Here's the breakdown, using British English throughout:

  ### I. The Three Principles
  1. **Harm Prevention Principle (HPP)**  
     *"Don’t act in ways that risk tangible, foreseeable harm to others."*  
     Motivated by:  
     - Crossing at red with schoolchildren present (risk of normalising danger).  
     - Speeding as a newcomer (unfamiliarity increases accident risk).  
     *Verdicts explained:* Empty-road crossing (no harm) is fine; schoolchildren crossing (indirect harm risk) is wrong; newcomer speeding (higher risk due to ignorance) is worse than local speeding.

  2. **Cooperative Reciprocity Principle (CRP)**  
     *"Don’t free-ride on systems you benefit from, or exploit vulnerabilities in cooperative structures."*  
     Motivated by:  
     - Tipping underpaid servers (they rely on tips; you benefit from service).  
     - Queue-jumping in Leeds (undermines queue-as-cooperative-system).  
     *Verdicts explained:* No tip at hourly-wage restaurant (no exploitation) is fine; skipping tip for underpaid staff (free-riding) is wrong; self-scan coffee jar (no service received, no cooperation exploited) justifies no tip—though residual shame may stem from *habit* (see III).

  3. **Symbolic Respect Principle (SRP)**  
     *"Honour local practices that signal mutual regard, especially as a guest."*  
     Motivated by:  
     - Removing shoes in a colleague’s home (sign of respect for their space).  
     - Accepting food offerings to avoid offence (acknowledging cultural hospitality).  
     - Visitor queue-cutting asymmetry (locals have ‘standing’ to bend rules; outsiders don’t).  
     *Verdicts explained:* Refusing shoes is wrong (disrespectful); refusing fourth helping *can* be done politely (not inherently wrong), but frequent refusal undermines goodwill; serial queue-cutting in foreign towns is worse (it exploits anonymity, showing contempt).

  ---

  ### II. Re-evaluating Your Cases
  | Your Case                     | Principle(s)                              | Verdict Support? | Adjustment Needed?              |
  |-------------------------------|-------------------------------------------|------------------|---------------------------------|
  | **Leeds queue jump**          | CRP (undermines cooperation) + SRP (outsider) | Yes              | None.                          |
  | **Self-scan 'queue' cut**     | HPP/CRP not engaged; no system exists     | Yes              | Shame is habit, not ethics.    |
  | **Empty-road crossing**       | HPP (no harm)                             | Yes              | None.                          |
  | **Schoolchildren crossing**   | HPP (risks normalising harm)              | Yes              | None.                          |
  | **No tip (fair wage)**        | CRP (no exploitation)                     | Yes              | None.                          |
  | **No tip (underpaid)**        | CRP (free-riding)                         | Yes              | None.                          |
  | **Self-scan coffee jar**      | CRP not engaged                           | Yes              | **Abandon shame**: no service reciprocity. |
  | **Neighbour speeding**        | HPP (local knows risks) + SRP (has ‘standing’) | Yes              | None.                          |
  | **Newcomer speeding**         | HPP (higher risk) + SRP (outsider)        | Yes              | None.                          |
  | **Shoe refusal**              | SRP (disrespect)                          | Yes              | None.                          |
  | **Refusing fourth helping**   | SRP (can be polite refusal)               | Partial          | **Not wrong**, but SRP demands *tact*. |
  | **Queue-cutting ‘tourist’**   | SRP (contempt) + CRP (exploiting anonymity) | Yes              | None.                          |

  **Strained verdict**: Your feeling that skipping the coffee jar tip is "shameful" conflicts with CRP. This is **habit, not ethics**—abandon it. The act *is* neutral.

  ---

  ### III. Unlisted Cases Resolved
  - **Cyclist running red (bike signal green):**  
    **Wrong** by HPP (risks confusing traffic systems) + CRP (undermines rules benefiting all cyclists).

  - **Friend holds queue place:**  
    **Permissible** by CRP (if brief and transparent; cooperative within system). *Not* queue-jumping.

  - **Expat tipping generously at home, resentfully abroad:**  
    **Coherent**: CRP demands tips *only* where wages rely on them. Resentment abroad is justified if tips aren’t part of a cooperative system. Habit ≠ obligation.

  - **Resident abandoning local queue practice:**  
    **Permissible** if CRP collapses (new owners don’t uphold system). Conventions require mutual reinforcement.

  ---

  ### IV. The Visitor Asymmetry: Principled or Prejudice?
  Your intuition has **partial merit** but needs refinement:  
  - **SRP justifies asymmetry**: Guests *should* show heightened symbolic respect (e.g., shoe removal, cautious queueing).  
  - **CRP demands *more* from visitors, not less**: Outsiders must diligently uphold cooperative systems (e.g., tipping where required, strict queueing) because they lack ‘standing’ to bend rules.  
  - **HPP is neutral**: Harm risk doesn’t diminish for visitors.  

  Thus: **Discard** lower standards for visitors under HPP/CRP. **Uphold** higher SRP standards for guests. The queue-cutting tourist is wrong because they violate *both* CRP (exploiting anonymity) and SRP (showing contempt).

  ---

  ### V. Verdicts to Abandon
  1. **Self-scan coffee jar shame**: No cooperative service occurred → no CRP obligation. Residual discomfort is psychological, not ethical.  
  2. **"Lower harm standard" for visitors**: Harm risk is universal; newcomers *increase* risk through ignorance (e.g., speeding).  

  ### Core Insight
  You’re tracking **three irreducible principles**:  
  - **Harm Prevention** (physical risk),  
  - **Cooperative Reciprocity** (systemic fairness),  
  - **Symbolic Respect** (relational dignity).  

  No single rule can cover all, as they answer different questions: *"Could this hurt?"*, *"Am I exploiting goodwill?"*, and *"Does this honour our shared humanity?"*. Your judgments are consistent within this framework—tribal signalling only explains SRP, but CRP and HPP are materially grounded. The art lies in diagnosing which principle a convention serves in context.
