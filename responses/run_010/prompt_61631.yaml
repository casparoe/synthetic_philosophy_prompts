prompt: |-
  Okay so my friend Dev has been obsessed with paradoxes for about two years now and he's got these extremely firm opinions, and I've cooked up a sentence to try and stump him. I haven't shown it to him yet, so I want an outside guess at where he'll land before I spring it on him. For context, I'm not an academic, I do IT support, I just like listening to him rant and occasionally catching him out.

  His verdicts so far, as best as I can repeat them:

  - "This sentence is false" — he says it's true AND false, both at once, and he's completely unbothered by that. He says logic has no business pretending contradictions can never be real.
  - "This sentence is true" — he says that one is neither true nor false, it just sort of dangles there with nothing to grab onto. Which I find weird given the last one.
  - Two index cards, one saying "the sentence on the other card is true" and the other saying "the sentence on the first card is false" — he says the pair is contradictory, at least one of them is true-and-false, same deal as the first one.
  - "How many grains of sand make a heap?" — he says that's not a real puzzle at all, it's just people never bothering to pin down the word "heap." No contradiction anywhere, move along.
  - A work database where two records about the same customer flatly disagree — he says that's obviously just an error, you fix it, calling that a contradiction is boring and not what he's talking about.
  - The set of all sets that don't contain themselves — he says the maths people already sorted this out by not letting you build that set in the first place, and he's perfectly happy with that.

  Now here's mine. A single sentence that reads: "If this sentence is true, then the moon is made of green cheese." And the nasty part, which he'll notice immediately, is that you could swap the moon for literally anything — "then I'm the Pope," "then 2+2=17" — the sentence doesn't care what goes on the right side of the if.

  Can you work out what he's going to say? Here's how I want it laid out:

  **Your guess** — about 100 words, straight up, what verdict he gives this sentence.

  **The rules he might be running** — around 350 words. Give me two to four candidate rules in plain english, no symbols unless you unpack them. The catch is that more than one rule has to fit all six verdicts above, so for each one tell me which of his verdicts it explains naturally and which ones it has to stretch or bolt on extra bits for.

  **Where they split on my sentence** — around 250 words, what each rule says about the green cheese thing, and why at least one of them is in real trouble from it.

  **Which one I should bet on** — 150 words or so, your pick and the actual reason you'd pick it, not just vibes. If his track record genuinely doesn't decide it, say so plainly instead of hedging.

  **The follow-up question** — about 100 words, one more sentence or little scenario I should put to him afterwards that would force the candidate rules apart.

  Oh and one thing — if the answer is that he has to give something up to stay coherent, say which thing you think he'd sacrifice, because he'll definitely claim he doesn't have to sacrifice anything.
