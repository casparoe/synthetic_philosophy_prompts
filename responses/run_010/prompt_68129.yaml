prompt: |-
  I'm a postdoc in a visual cognition lab, and our review article on top-down influences has acquired an awkward philosophy-facing section that my PI has delegated to me because I did an MPhil before switching to psychology. The section is supposed to settle a methodological question that reviewers keep raising: by what standard do we decide whether a measured effect is a case of cognition genuinely altering perceptual experience, rather than cognition altering attention, or the subject's willingness to report one thing over another, or the way a post-perceptual judgment gets rendered in a rating task? I've assembled eight candidate criteria from both literatures and I want them ordered, not summarized:

  1. **Semantic-coherence criterion** (the Pylyshyn-style requirement): the influence counts only if the change in the perceptual state is explicable as a function of the *content* of the cognitive state, so that the transition is describable in terms of what the subject believes, desires, or knows.
  2. **Personal-level requirement**: the penetrating state must be one the subject could avow or reason with — a belief, concept, or piece of knowledge — rather than a subpersonal parameter setting.
  3. **Stimulus-and-occasion constancy**: the physical input and the attentional allocation are held fixed, ideally with identical stimuli across conditions, while only the cognitive state varies.
  4. **Locus-of-effect requirement**: the effect must land on the phenomenal character or content of the experience itself, which pushes the burden onto measures such as chromatic adjustment or matching rather than yes–no detection and rating scales, and onto analyses that separate sensitivity from response criterion.
  5. **Overgeneralization-style control** (Firestone and Scholl's line of attack): the effect must fail to appear, or appear differently, in a matched control task that plausibly taps only judgment.
  6. **Encapsulation-defeat criterion**: the effect must be shown not to reduce to attentional selection, perceptual learning or unitization, or expectation-driven criterion shifts — i.e., it must be demonstrated that an informationally encapsulated stage has been bypassed.
  7. **Predictive-processing recast**: the effect is genuine if it can be modeled as cognition changing the priors, or the precision-weighting, governing sensory inference.
  8. **Inert-intervention criterion** (this one is mine, and I want it judged as harshly as the others): an intervention on the subject's cognitive state that is otherwise inert — no change in measured attention, motivation, or instructed response strategy — yet reversibly flips the perceptual outcome, with reversal demonstrable within-subject.

  Please score each criterion twice, once from 0 to 1 for discriminating power (how well it filters out effects that the standard battery of pitfalls — demand characteristics, criterion shift in the reporting task, memory and feedback across trials, attentional mediation, low-level stimulus artifacts — would explain away anyway) and once from 0 to 1 for theoretical neutrality (how little it presupposes the outcome, penalizing criteria that already assume a sharp perception/cognition boundary, or that experience has propositional content, or that introspective access to the locus of the effect is available). Then propose and justify your own weighting of those two dimensions rather than using mine, combine them into a single composite score per criterion, and give me the resulting tier list from most to least defensible. Alongside that, tell me which one criterion is most overrated in the current literature and which is most underrated, and give me a single number between 0 and 1 for the fraction of published "top-down effect" studies you'd expect to survive screening by your top-ranked criterion — with your reasoning for the number, since I have to defend it in the discussion.

  Two things I'd like treated as part of the same exercise. First, apply your top-ranked criterion to three paradigm families and order them by evidential weight: chromatic adjustment of familiar object shapes toward achromaticity, where observers' gray point shifts in the direction opposite the object's typical color; ambiguous-figure and category-boundary paradigms in which a verbal label or an induced expectation changes where a boundary is reported; and matching tasks in which the lightness of a face or object is judged relative to a comparison patch after social or affective categorization. I want the ordering plus one sentence each on what would raise a paradigm family one rank. Second, flag the places where you're least confident in your own scores — in particular whether criteria 6 and 8 are really independent or whether one collapses into the other under scrutiny — and tell me which of my eight I should cut if the section has to lose two hundred words.
reasoning: |-
  Hmm, this is a fascinating methodological challenge from a visual cognition postdoc. They're grappling with how to evaluate top-down influences on perception versus alternative explanations like attention or response bias. They've listed eight criteria and want them rigorously assessed along two dimensions: discriminating power (how well they filter out pitfalls) and theoretical neutrality (how few assumptions they make).

  First I need to understand the scoring system they want. For each criterion, I'll assign two scores from 0 to 1: one for discriminating power against common pitfalls like demand characteristics or attentional mediation, and another for theoretical neutrality regarding perception/cognition boundaries. Then I'll propose my own weighting of these dimensions - probably 60/40 favoring discriminating power since methodological rigor seems more urgent here than philosophical purity. The composite score will be (0.6 * power) + (0.4 * neutrality).

  Looking at the criteria:
  - Semantic-coherence seems theoretically loaded (presupposes contentful states) but moderately good at filtering post-perceptual effects
  - Personal-level has high theoretical baggage (assumes personal/subpersonal distinction) and poor filtering (since beliefs can still affect reporting)
  - Stimulus constancy is methodologically strong but theoretically neutral - a good workhorse
  - Locus-of-effect pushes toward good measures but assumes we can isolate "phenomenal character"
  - Overgeneralization control is excellent for ruling out judgment artifacts
  - Encapsulation-defeat is crucial but methodologically tricky to demonstrate
  - Predictive-processing recast is theoretically trendy but may just redescribe effects
  - Inert-intervention is clever but may be impossible to implement cleanly

  For the tier list after scoring, I anticipate stimulus constancy and overgeneralization controls will rank highest as practical tools, while personal-level and predictive processing may score lower. The most overrated is probably the predictive-processing recast which often just relabels effects, while underrated might be inert-intervention for its clever design.

  For the fraction of existing studies that would pass the top criterion: I'd estimate only 20-30% given how many top-down findings collapse under strict controls. The three paradigm families would rank as: 1) chromatic adjustment (best stimulus control), 2) matching tasks (decent but vulnerable to criterion shifts), 3) ambiguous figures (most susceptible to reporting biases). Chromatic could be improved by adding within-subject reversals.

  Finally, criteria 6 and 8 might overlap - both aim to rule out alternative mechanisms - but 8 is more operationalized. If cutting words, I'd suggest trimming semantic-coherence and personal-level as they're philosophically heaviest. Will flag these uncertainties in the response.
answer: |-
  Below is a systematic evaluation of your eight criteria, tiered by defensibility, with answers to your specific requests. I'll first define my scoring dimensions (different from yours), then provide scores, composite ranking, paradigm analysis, over/underrated critique, survival rate estimate, and recommendations for cuts.

  ---

  ### **Scoring System & Weighting Rationale**
  - **Discriminating Power (DP: 0–1)**: Capacity to exclude non-perceptual confounds (attention, response bias, demand characteristics). *Weight: 65%*.  
    *Why?* Your field’s core challenge is *methodological* (ruling out pitfalls), not theoretical purity. DP directly addresses reviewers’ skepticism.  
  - **Theoretical Neutrality (TN: 0–1)**: Freedom from assumptions (e.g., perception/cognition dichotomy, propositional content, introspective access). *Weight: 35%*.  
    *Why?* While neutrality is ideal, practical discrimination is paramount. Overweighting TN risks favoring toothless criteria.  

  Composite Score = (DP × 0.65) + (TN × 0.35)  

  ---

  ### **Criteria Scores & Composite Ranking**  
  *(DP = Discriminating Power, TN = Theoretical Neutrality, CS = Composite Score)*  

  | **Criterion**                 | DP  | TN  | CS  | **Tier** |  
  |-------------------------------|-----|-----|-----|----------|  
  | **8. Inert-intervention**     | 0.9 | 0.7 | 0.83| **S** (Most defensible) |  
  | **6. Encapsulation-defeat**   | 0.8 | 0.8 | 0.80| **S** |  
  | **5. Overgeneralization control** | 0.9 | 0.6 | 0.79| **A** |  
  | **4. Locus-of-effect**        | 0.8 | 0.6 | 0.72| **A** |  
  | **3. Stimulus-and-occasion constancy** | 0.7 | 0.9 | 0.77| **A** |  
  | **7. Predictive-processing recast** | 0.5 | 0.5 | 0.50| **C** |  
  | **1. Semantic-coherence**     | 0.4 | 0.4 | 0.40| **D** |  
  | **2. Personal-level**         | 0.3 | 0.3 | 0.30| **D** (Least defensible) |  

  **Tier Legend**:  
  - **S**: Near-essential (survives scrutiny, balances DP/TN)  
  - **A**: Valuable but requires careful implementation  
  - **C**: Theoretically loaded or methodologically ambiguous  
  - **D**: Overly restrictive or circular  

  ---

  ### **Key Critiques**  
  - **Most Overrated**: **#7 (Predictive-processing recast)**. DP=0.5/TN=0.5. It often *redescribes* effects without ruling out confounds (e.g., precision-weighting could reflect attentional gain). Favored for its modernity, not rigor.  
  - **Most Underrated**: **#8 (Inert-intervention)**. DP=0.9/TN=0.7. Your design elegantly isolates cognitive causation by eliminating confounds via reversibility. Underused due to practical difficulty.  

  ---

  ### **Fraction of Studies Surviving Top Criterion (#8)**  
  **Estimate: 0.15–0.20** (15–20% of published "top-down effects").  
  - *Reasoning*: Most studies fail to control for attentional mediation (e.g., cognitive states alter gaze patterns) or response strategies (e.g., social desirability in rating tasks). #8’s "otherwise inert" requirement demands airtight confound controls—rare in practice. Even robust paradigms (e.g., emotion-induced lightness effects) often lack within-subject reversibility.  

  ---

  ### **Paradigm Families Ranked by #8 (Inert-Intervention)**  
  1. **Chromatic adjustment** (e.g., gray shifts for bananas).  
     - *Why best?* Stimulus constancy (achromatic shapes) and within-subject reversibility (e.g., knowledge priming) are feasible.  
     - *Improvement*: Add attentional tracking (eye-tracking) to prove "inertness".  
  2. **Matching tasks** (e.g., face lightness after categorization).  
     - *Why middle?* Vulnerable to criterion shifts (e.g., affective bias in matching). Reversibility is under-tested.  
     - *Improvement*: Embed reversibility (e.g., flip categorization within blocks).  
  3. **Ambiguous figures** (e.g., duck-rabbit with labels).  
     - *Why weakest?* Heavily reliant on reporting; prone to demand characteristics. "Inert" intervention is nearly impossible (labels directly cue responses).  
     - *Improvement*: Use implicit measures (e.g., priming) instead of verbal reports.  

  ---

  ### **Independence of #6 vs. #8 & Uncertainty Flags**  
  - **#6 (Encapsulation-defeat) vs. #8 (Inert-intervention)**:  
    - **Independence**: #6 targets *mechanisms* (attention/learning), while #8 targets *causal pathways* (isolating cognitive variables). They converge but don’t collapse: #8 could falsify #6 (e.g., if an "inert" cognitive change alters perception without defeating encapsulation).  
    - **Uncertainty**: I scored #6 highly (DP=0.8) but worry it assumes Fodorian modularity. If encapsulation is graded (e.g., Churchland), #6 becomes murky. #8 avoids this but risks false negatives (some genuine effects may alter attention).  

  **Other Low-Confidence Scores**:  
  - #4 (Locus-of-effect): TN=0.6 assumes "phenomenal content" is measurable—debatable.  
  - #7 (Predictive-processing): DP=0.5 hinges on model specification; overly flexible.  

  ---

  ### **Criterion Cuts for Brevity (200 words)**  
  Cut **#1 (Semantic-coherence)** and **#2 (Personal-level)**.  
  - **Why?** Both are philosophically heavy (#1 assumes content must be propositional; #2 requires "avowal" access) and low-scoring (CS=0.40/0.30). They add minimal discriminatory value beyond #3–#8. Cutting them streamlines the section toward methodological pragmatism.  

  ---

  ### Final Recommendations  
  1. **Lead with #8 and #6** in your review—they best address "genuine alteration" skepticism.  
  2. **Cite the 15–20% survival rate** for published effects to highlight methodological gaps.  
  3. **Chromatic adjustment** is your strongest case study—use it to illustrate #8.  
  4. **Explicitly note** where criteria overlap (e.g., #5 and #6 both handle judgment artifacts) to preempt redundancy critiques.  

  This framework prioritizes empirical tractability while acknowledging theoretical disputes—essential for convincing reviewers. If you need expansion on specific scores or paradigm examples, let me know.
