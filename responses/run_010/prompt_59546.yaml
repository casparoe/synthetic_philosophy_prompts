  In credibility, we have a risk parameter θ_i. In the Bühlmann model, we are effectively assuming that the risk parameter captures the entire mean, and we do not break it down into components. But if we think of the risk parameter as the additive genetic effect, then the credibility factor we compute (with n_i=1) is h².

  The broad-sense heritability includes non-additive genetic effects. If we instead defined the risk parameter as the total genetic effect (additive + non-additive), then the credibility factor would be H².

  The claim is that only h² (the narrow-sense) predicts the response to selection. Why? Because in breeding, we select on the phenotype and what is transmitted is the additive genetic component. The non-additive part (dominance, epistasis) is not passed on in a linear fashion.

