  We could extend credibility to hierarchical models (like the linear mixed model). In fact, the Bühlmann model is a random effects model. But the standard Bühlmann model does not model the correlation between related risks. So we would need to introduce a correlation structure.

  Therefore, the distinction between broad and narrow sense heritability does not have a direct counterpart in standard credibility theory. We can capture the numerical decomposition (by defining the risk parameter appropriately) but the predictive power for offspring is not part of the Bühlmann setup.

