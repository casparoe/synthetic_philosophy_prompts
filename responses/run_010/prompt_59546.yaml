  - The EPV might change because the environmental variance might be different.
  - The VHM might change because the conditional mean μ(θ_i) might depend on the environment. For example, if there is gene-environment interaction, then the expected phenotype for a given genotype θ_i might be different in different environments. Therefore, the variance of μ(θ_i) over the population (which is the VHM) would change if the distribution of environments changes.

