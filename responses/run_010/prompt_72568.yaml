  I should also anticipate student pitfalls. Many might latch onto the parasitoid wasp as the obvious ethical choice because it's "natural," but the model answer needs to debunk that by highlighting the slow, parasitic death. Others might oversimplify by treating sentience probability as the only uncertainty, ignoring valence uncertainty. The marking scheme must penalize these errors. Additionally, students might struggle with the concept of preventing existence versus killing, so the model answer should clarify that distinction clearly.

