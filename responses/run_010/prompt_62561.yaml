  First, I need to understand the core challenge. The students can summarize theories (Hume, Rawls, Scanlon, bipolar obligations) but struggle to engage with how these theories fundamentally differ in their understanding of obligation itself. The exam should force them to compare how each theory locates the obligation—whether in social convention, practice rules, expectations, or relational duties.

  The case is perfect because it strips away external pressures (no living source, no chance of exposure if breached secretly). This isolates the philosophical question of obligation. The key is to design a question that pushes students beyond summarizing each theory's conclusion to analyzing where the obligation resides and what that implies for release from it.

  For the question structure: I'll start with a concise setup mirroring the user's voice, then pose the core dilemma with two clear sub-questions (binding nature and undetectable breach). This forces engagement with the theories' mechanisms.

  The model answer needs to demonstrate deep analysis:  
  - For Hume, emphasize that without a living convention-enforcer, the obligation dissolves socially but leaves a character question.  
  - Rawls requires examining whether the practice's rules inherently include posthumous obligations or dissolution conditions.  
  - Scanlon's expectation-based wrong highlights exploiting the source's past trust, making breach inherently objectionable regardless of discovery.  
