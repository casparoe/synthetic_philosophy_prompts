answer: |-
  Here’s the exam question, model answer, and marking scheme designed to push students beyond summary into analyzing *how* each theory conceptualizes obligation itself.

  ---

  **Final Exam Question: The Silent Source**  
  *(48 Hours, 1,600 Words Max, 25 Marks)*  

  You are a reporter. You gave a source an absolute, unqualified promise: total confidentiality, forever. No name, no identifying details. In exchange, they handed you documented proof of serious wrongdoing by a figure now running for high office. Before you can publish, the source dies suddenly. Their family knows nothing of your promise. The material is only credible if attributed, but there is no one left to release you from your pledge—no living source, no editor demanding disclosure, no court order. The secret dies with you... unless you choose to break it.  

  1.  **Is the reporter still bound by the promise?** Analyze this using the core ideas of Hume (promising as artificial convention), Rawls (promising as a practice with constitutive rules), Scanlon (wronging by creating and exploiting expectation), and the concept of bipolar obligations (duties owed *to* specific others). For each view, explain *why* it answers "yes" or "no," focusing on **where the obligation resides** and **who (if anyone) could legitimately release the reporter**.  
  2.  **How does each view change (or not) if the reporter could break the promise in a way that is completely undetectable?** No living person ever discovers the breach. Does this alter the permissibility of publishing? Explain what this reveals about what each theory fundamentally considers the *source* of the obligation or the nature of the wrongdoing.  

  Your answer must move beyond summarizing each view's conclusion. Engage with how these theories disagree about the very *kind of thing* a promise-based obligation is.  

  ---

  **Model Answer (Approx. 700 Words): The Anatomy of a Silent Obligation**  

  The death of the source creates a profound philosophical test: does a promise survive its beneficiary? Analyzing this through Hume, Rawls, Scanlon, and bipolar obligations reveals starkly different conceptions of *what* an obligation *is*, not just differing outcomes.  

  **1. Is the reporter bound? Who could release her?**  

  *   **Hume (Artificial Virtue/Convention):** Likely **No Longer Bound**. Hume sees promising as a socially constructed tool for stability, rooted in mutual self-interest and the expectations of others within the convention. The obligation exists *because* society enforces it and expects compliance. Key figures (the source, potential punishers) are gone. The "convention" loses its grip without living participants to uphold or be affected by its breach. The *obligation* resided in the social fabric, which has now frayed irreparably concerning this specific promise. **Release:** Effectively automatic upon the death of the source and the impossibility of social sanction. There’s no distinct entity to grant release; the conditions sustaining the obligation vanished.  
  *   **Rawls (Practice with Constitutive Rules):** **Probably Bound, with Caveats**. Rawls shifts the question to the level of the *practice* of source confidentiality. The obligation arises from participating in a practice defined by rules (like absolute confidentiality). Breaking the promise isn’t just an individual act; it’s a move *within* (or against) the practice. If the practice’s rules define confidentiality as surviving the source’s death (as journalistic ethics often imply), then the obligation persists. **Release:** Only defined by the practice’s rules. If the rules don’t specify conditions for release after the source’s death (e.g., by an executor), release might be impossible. The obligation resides in the rule-structure of the practice itself.  
  *   **Scanlon (Wronging via Created Expectations):** **Bound**. Scanlon grounds obligation in the specific wrong done *to the promisee* by creating and then exploiting an expectation. The source trusted the reporter based on her explicit undertaking. Breaking the promise, even posthumously, is wrong because it exploits that trust *the source placed* in her. The source *was* wronged by the act of inducing reliance and then betraying it, regardless of whether they ever know about the betrayal. The obligation resides in the moral relationship created by the deliberate inducement of expectation. **Release:** Only the source could release her by waiving the expectation *they* held. Since the source is dead, release is impossible.  
  *   **Bipolar Obligations:** **Bound**. This view insists obligations are fundamentally relational – owed *to* a specific individual (the obligee). The promise created a duty *to the source*. The source’s death doesn't extinguish the duty *owed to them*; it simply means the obligee cannot demand fulfillment or waive it. Breaching the promise constitutes a wrong *to the deceased source*. The obligation resides in the persistent normative relationship between promisor and promisee. **Release:** Only the obligee (the source) could release the obligation. Their death makes this impossible.  

  **2. The Undetectable Breach: A Revealing Test**  

  *   **Hume:** **Permissible (or at least, not "wrong")**. If breach is undetectable, the last vestige of social consequence vanishes. There is no disruption to the convention, no loss of trust from others, no sanction. The artificial reason for the obligation disappears entirely. This confirms Hume’s view: the obligation is purely social and consequentialist.  
  *   **Rawls:** **Possibly Permissible?** This tests the *purpose* of the practice’s rules. If the primary aim is to ensure future sources come forward (a future-oriented consequence), an undetectable breach doesn’t harm that. If the aim is absolute fidelity to the rule itself as constitutive of the practice’s integrity, breach remains wrong. Rawls’s answer hinges on interpreting the practice’s telos. It highlights that the obligation lives in the rule-following required by the practice, potentially independent of detection.  
  *   **Scanlon:** **Still Wrong**. The wrong lies in the act of exploiting the trust *you deliberately created in the source*. That wrong was committed the moment you induced reliance. Whether anyone *finds out* is irrelevant to the fact that you betrayed the expectation you manufactured. Detection doesn't create the wrong; the breach does. This underscores that Scanlon’s obligation is about the inherent wrongness of the act *towards the promisee*, not consequences.  
  *   **Bipolar Obligations:** **Still Wrong**. The wrong is *to the source* by violating the duty owed *to them*. The source is dead, not non-existent. The breach still constitutes a failure in the relationship, a failure to fulfill what was owed *to that person*. Detectability is irrelevant to the violation of the relational duty. This confirms the obligation is a persisting normative fact about the relationship itself.  

  **Synthesis:** The core divergence lies in the *locus* of obligation: Hume (society/consequences), Rawls (rule-governed practice), Scanlon (exploitation of induced expectation/bilateral wrong), Bipolar (persistent relational duty owed to a specific other). The "who can release" question and the undetectable breach test powerfully expose these differences, showing whether the theory cares about consequences, rule integrity, the act of betrayal itself, or the enduring relational bond.  

  ---

  **Marking Scheme (25 Marks Total):**  

  **A Range (22-25):** Demonstrates exceptional insight by consistently focusing on *how* each theory conceptualizes the *nature and source* of the obligation, not just the verdict.  
  *   **Core Analysis (16 Marks):**  
      *   **(4x4)** For *each* theorist (Hume, Rawls, Scanlon, Bipolar):  
          *   Clearly and accurately states the verdict on whether bound (1 mark).
          *   *Crucially* explains **where the obligation resides** according to that theory (e.g., social convention, practice rules, wronging the promisee via expectation, duty owed to obligee) (1.5 marks).
          *   *Crucially* explains **who could release the obligation and why** (or why release is impossible), directly tying this to the theory's core concept of obligation (1.5 marks).
  *   **Undetectable Breach Test (5 Marks):**  
      *   Accurately identifies how each view changes (or doesn't) regarding permissibility (1 mark).
      *   Provides a compelling explanation for *why* it changes (or doesn't) for each theory, explicitly linking this to **what the theory fundamentally identifies as the source of obligation/the nature of the wrong** (e.g., consequences vs. act vs. relational duty) (4 marks - 1 per theorist).
  *   **Synthesis (3 Marks):** Clearly articulates the fundamental *disagreement* between the theories about the *kind of thing* an obligation is (consequentialist/social, rule-based, expectation/wrong-based, relational/bipolar), using insights from the analysis above. Avoids simplistic "they disagree on the outcome" summaries.

  **B Range (16-21):** Competent but lacks the deeper analytical layer.  
  *   **Core Analysis (12-14 Marks):** Accurately summarizes each theorist's position, states the verdict on being bound, and gives *some* reason related to the theory. Explains "who can release" but often superficially (e.g., "only the source" without deeply tying it to the *nature* of the obligation). Fails to consistently pinpoint *where the obligation resides* conceptually.  
  *   **Undetectable Breach Test (3-4 Marks):** States how views change (or not) but explanations are often underdeveloped or don't robustly connect to the core source of the obligation/wrong.  
  *   **Synthesis (0-2 Marks):** Weak or missing. May note theories disagree but doesn't articulate the fundamental difference in *what an obligation is*.  

  **C Range (10-15):** Significant omissions, inaccuracies, or superficial treatment. May cover only 2-3 theories adequately. "Who can release" and "undetectable breach" sections are weak or missing key elements. Struggles with core concepts.  

  **D Range (Below 10):** Major misunderstandings of theories, failure to address key parts of the question, or severe brevity.  

  **Critical Mistakes (Cost Significant Marks - Often prevents A/B):**  
  1.  **Conflation of Concepts:** Treating bipolar obligations as merely "Scanlon with a different label" or failing to distinguish the *source* of the wrong (exploiting expectation vs. violating a relational duty).  
  2.  **Teleological Slide:** Arguing "because the *practice* of confidentiality is socially valuable, the reporter owes a duty *to the dead source*" (confusing collective benefit with individual relational duty).  
  3.  **Ignoring Key Elements:** Failing to address "who can release" or the "undetectable breach" test substantially.  
  4.  **Misrepresentation:** Fundamentally misstating a core tenet of a theorist (e.g., saying Hume thinks promises are natural duties).  
  5.  **Free-Floating Duty Fallacy:** Treating the obligation as a general duty (e.g., "duty to tell the truth") disconnected from the specific promise *to the source*, especially relevant to Hume/Rawls vs. Scanlon/Bipolar.  

  ---

  **Why this works:**  
  1.  **The Case:** Isolates the pure philosophical dilemma by removing external pressures (family, editors, courts) and the living promisee.  
  2.  **The "Who Can Release" Hook:** Forces analysis of the obligee's role and the nature of the bond (social? practice-defined? personal/relational?). This is the key to unlocking the different conceptions.  
  3.  **The Undetectable Breach:** Acts as a powerful litmus test, cleanly separating theories concerned with consequences/detectability (Hume, potentially Rawls) from those concerned with the inherent nature of the act/relationship (Scanlon, Bipolar).  
  4.  **The Marking Scheme:** Explicitly rewards the higher-order analysis of the *locus* and *nature* of the obligation ("where it resides," "source of the wrong") and penalizes conflation and teleological slides. It codifies your insight about the B answer stopping at the verdicts.  
  5.  **Self-Contained:** Theories are identifiable by their core arguments stated in the question prompt and model answer, no external citations needed.  

  This setup ensures students must grapple with the fundamental question: *What kind of thing is this obligation?* Good luck with the grading!
