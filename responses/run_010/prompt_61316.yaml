  ### Joint Statement of Adversarial Collaboration on Moral Responsibility

  #### 1. Agreed Claims
  We, Camp P and Camp C, jointly affirm the following claims, which we recognize as substantive and non-vacuous. Each claim would be denied by a third party, such as a libertarian (who asserts that agents can be causa sui) or a traditional compatibilist (who links responsibility to determinism).

  1. The Basic Argument, in the form presented by Camp P, does not depend on the truth or falsity of determinism. A traditional compatibilist might deny this by arguing that indeterminism could provide an escape from the argument's conclusion.
  2. The condition of being *causa sui* (the ultimate, self-originating source of one's own nature) is impossible for any being. A libertarian would deny this, asserting that such ultimacy is achievable.
  3. In ordinary practice, the reactive attitudes (e.g., resentment, gratitude) and associated practices of holding people morally responsible (e.g., blame, praise) do not explicitly include a requirement that the agent be *causa sui*. A libertarian might deny this, contending that these practices implicitly presuppose ultimacy.

  #### 2. Residual Disagreements
  We disagree on two core questions. To ensure mutual acceptance, each disagreement is stated twice: first in wording endorsed by Camp P, then in wording endorsed by Camp C. These disagreements are classified as having a verbal component but also a substantive residue, as they involve both conceptual differences and deeper justificatory issues.

  - **Disagreement 1: Whether moral responsibility requires being *causa sui*.**
    - *Camp P's statement*: The concept of true moral responsibility—which underlies desert-based practices like retributive punishment and is implicit in our reactive attitudes—requires that the agent be the ultimate source of their own character and motives, a condition that is impossible. Therefore, no one possesses true moral responsibility.
    - *Camp C's statement*: The concept of moral responsibility that we actually employ in our reactive attitudes and practices does not require the agent to be the ultimate source of their own character and motives; it requires only that the agent's actions express their quality of will and that they are capable of participating in the moral community.
    - *Classification*: Verbal with substantive residue. The verbal aspect concerns the definition of "moral responsibility" (Camp P reserves it for an impossible ideal, Camp C for our actual practice). The substantive residue is whether the actual practice presupposes ultimacy for its justification.
    - *What turns on it*: The legitimacy of desert-based practices (e.g., retributive punishment). If Camp P is correct, these practices are unjustified; if Camp C is correct, they remain justified.
    - *Residual objection*: Camp P objects that Camp C's statement ignores the implicit ultimacy demand in desert; Camp C objects that Camp P's statement describes a concept not found in practice.

  - **Disagreement 2: Whether the impossibility of being *causa sui* undermines our responsibility practices.**
    - *Camp P's statement*: Because true moral responsibility requires being *causa sui* and that is impossible, our desert-based practices (such as retributive punishment) are fundamentally unjustified, as they rely on an incoherent notion of desert.
    - *Camp C's statement*: The impossibility of being *causa sui* does not undermine the justification of our moral responsibility practices, as these practices do not require such ultimacy; they are justified by their role in regulating social relations and expressing the quality of will.
    - *Classification*: Substantive. This disagreement goes beyond terminology to the justification of practices.
    - *What turns on it*: Whether our interpersonal practices (e.g., punishment) can be defended without ultimacy. If Camp P is correct, all desert-based elements must be abandoned; if Camp C is correct, they can be retained.
    - *Residual objection*: Camp P objects that Camp C's statement conflates social utility with true desert; Camp C objects that Camp P's statement ignores the internal justifications within the practice.

  #### 3. Cruxes
  We identify three cruxes—sub-questions that, if settled, would move at least one side. Each crux includes a test or case both accept as bearing on it, along with predictions and falsifiers. The first crux is an empirical case; predictions diverge on three measures and converge on one.

  - **Crux 1: Does exposure to formative history reduce perceived moral responsibility?**  
    *Which disagreements it settles*: Disagreement 1 and 2, as it tests whether our practices implicitly rely on ultimacy.  
    *Test or case*: A state sentencing commission pilots a randomized program. For 200 comparable cases, half receive a formative-history memorandum (detailing causal origins of the defendant's character, upbringing, exposure to violence, and untreated illness) for judges to review before sentencing; the other half receive only ordinary presentence reports. Four measures are recorded:  
    (i) Sentence length (in months).  
    (ii) Judges' reported sense of fairness and legitimacy (on a 1-10 scale, with 10 being maximum).  
    (iii) Spread to other institutions within three years (e.g., adoption in school discipline, employment decisions, or licensing boards; recorded as yes/no).  
    (iv) Victims' advocates' reaction (average support for the practice on a 1-10 scale).  
    *Predictions*:  
    - *Camp P prediction*: (i) Significantly shorter sentences (due to reduced perceived desert). (ii) Lower fairness ratings (as judges feel desert is undermined). (iii) Spread occurs (as it reveals lack of ultimacy). (iv) High support (8-10, seen as fairer).  
    - *Camp C prediction*: (i) No significant change in sentence length (any reduction would be for mitigation, not reduced responsibility). (ii) Similar or higher fairness ratings (more information improves perceived legitimacy). (iii) Spread occurs (as it aids fairness without challenging responsibility). (iv) Moderate support (4-6, due to concerns about reduced accountability).  
    *Predictions diverge*: Yes on (i), (ii), and (iv); converge on (iii).  
    *What convergence shows*: On spread (measure iii), both predict adoption, indicating that the disagreement is not purely practical; it is descriptive and conceptual, as both agree the practice is useful but for different reasons.  
    *Falsifiers*:  
    - *Camp P falsifier*: If responsibility ratings (not directly measured but inferred from (i) and (ii)) do not decrease in the treatment group, or if victims' advocates oppose it (average support <4).  
    - *Camp C falsifier*: If responsibility ratings decrease significantly (with judges citing reduced responsibility), or if sentence length decreases substantially due to reduced desert.

  - **Crux 2: Does the ordinary concept of responsibility require ultimacy?**  
    *Which disagreements it settles*: Disagreement 1, as it tests the conceptual commitment.  
    *Test or case*: A thought experiment: "The Innate Villain"—an agent who, due to genetic and early environmental factors entirely beyond their control, develops a cruel character. They are rational, reasons-responsive, and meet compatibilist conditions for responsibility, but they commit a crime out of malice. Both camps agree that surveying folk and philosophical intuitions on whether the agent is morally responsible would bear on the concept's requirements.  
    *Predictions*:  
    - *Camp P prediction*: A majority (e.g., >60%) will judge the Innate Villain not responsible or less responsible, as ultimacy is lacking.  
    - *Camp C prediction*: A majority will hold the Innate Villain responsible, as their actions express their quality of will.  
    *Predictions diverge*: Yes.  
    *Falsifiers*:  
    - *Camp P falsifier*: If a majority (>60%) holds the Innate Villain fully responsible.  
    - *Camp C falsifier*: If a majority does not hold the Innate Villain responsible.

  - **Crux 3: Are reactive attitudes sensitive to ultimacy concerns?**  
    *Which disagreements it settles*: Disagreement 1 and 2, as it tests whether the practice presupposes ultimacy.  
    *Test or case*: Both accept analyzing real-world suspensions of reactive attitudes (e.g., in cases of coercion, mental illness, or brainwashing). The test is whether people cite lack of ultimacy (e.g., "They didn't choose their nature") as a reason for suspension, rather than lack of quality of will or reasons-responsiveness.  
    *Predictions*:  
    - *Camp P prediction*: Ultimacy concerns will be a primary reason for suspension (e.g., in >50% of cases).  
    - *Camp C prediction*: Ultimacy concerns will rarely arise (<20% of cases); suspensions will be attributed to quality of will or capacity issues.  
    *Predictions diverge*: Yes.  
    *Falsifiers*:  
    - *Camp P falsifier*: If ultimacy is rarely cited (<20% of cases).  
    - *Camp C falsifier*: If ultimacy is frequently cited (>50% of cases).

  #### 4. Verdict on Verbal Disputes
  We judge that a portion of the dispute is verbal. Specifically, the use of the term "moral responsibility" is at issue: Camp P uses it exclusively for a concept requiring ultimacy (which is impossible), while Camp C uses it for the actual practice of answerability and accountability. This difference is verbal because it concerns how a term is defined, not the underlying facts of the practice. However, a substantive residue remains: whether the actual practice (of answerability and accountability) is justified without ultimacy. This residue is not verbal, as it involves a normative disagreement about justification that cannot be resolved by redefinition.

