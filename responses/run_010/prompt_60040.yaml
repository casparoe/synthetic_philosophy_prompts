  The friend's take is that the debate hasn't progressed because no one has formalized the key step: the anti-mechanist needs humans to know their entire belief state is sound, and Löb's theorem shows systems can't do that without inconsistency. So it's a formal issue with a determinate answer that hasn't been addressed yet.

  The user's position is that it's a verbal dispute about what calling the mind a machine commits you to. Since we never have the machine's program, "we can see the truth" lacks a determinate object, and Penrose's quantum gravity ideas either make it empirical or change the subject.

  I need to determine who is closer to the truth or if both are missing something. Let me recall the Lucas-Penrose argument. Lucas (1961) used Gödel's theorem to argue that for any formal system (machine), there's a true statement it can't prove, but humans can see it's true, so minds aren't machines. Penrose extended this in his books, suggesting quantum gravity might be involved.

  Critics like Putnam and Dennett point out issues. The main one is that humans aren't consistent formal systems; we're fallible. Also, recognizing the Gödel sentence for a specific machine requires knowing the system is consistent, which we can't prove for complex systems. Löb's theorem shows that a system proving its own consistency leads to inconsistency.

  The friend focuses on the soundness of the entire belief state. Löb's theorem does say a system can't assert its own soundness without inconsistency. Humans don't have access to their entire belief state either, so claiming we can know our own soundness is problematic. That's a strong point, but formalizing human reasoning as a single system is tricky.

