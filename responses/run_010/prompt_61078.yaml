  Good evening. Before we unveil this new case, I’d like to share a few words about the small creature you’ll soon see, and the remarkable woman whose name it bears.

  Four years ago, deep in one of our state’s limestone valleys, we knelt by three quiet springs. Water welled up from darkness into light. Reaching into that cool flow, we searched for life adapted to a world without sun. And we found it: a pale, sightless crustacean, no larger than a grain of rice, clinging to gravel in the current. It was unlike anything we’d seen in the sunlit streams nearby. We returned season after season, carefully collecting only a few individuals from each spring, learning its habits, its home. Two years ago, after meticulous study comparing its form and its story to every known relative, I described it as new.

  Tonight, we formally introduce it to the world with a name: [NAME], honoring Adela Marchetti. Adela understood that knowledge isn’t just a collection of facts in a ledger. It’s a story built through patient attention, through looking closely at the specific – whether it’s a ledger entry or a life in the dark. She believed fiercely in this institution’s purpose: to look, to learn, to preserve, and to share the unique threads in the tapestry of life, especially those easily overlooked. She championed the patience required to understand the small, the hidden, the seemingly insignificant. This animal, emerging from its deep sources, embodies that patient, enduring quest for understanding. Naming it for her isn't about fixing it in stone forever; it’s about marking a moment of deep recognition – *our* recognition, right now, of a distinct journey taken by life in this particular place.

  You see, the streams above ground in that valley teem with common, dark-eyed crustaceans. They live under the open sky. This animal lives only in the cool, constant dark of these springs. It lost its eyes, gained its pallor, over generations upon generations, shaped by that specific darkness, that specific flow of water from the rock. Its path diverged. We found it only here, in these three springs. What we did – what scientists do – was notice that divergence. We documented its physical difference, its unique life in the dark springs, separate from the bustling world above. We gave it a name to mark that observed separation, that distinct history we saw unfolding in those waters.

  Biology, like history, is a story we uncover piece by piece. Sometimes, new chapters reveal connections we hadn’t seen, or complexities we hadn’t grasped. The name we give is our best current translation of a unique story observed in the world. It is a marker placed on a path we see life taking, a particular history unfolding in a particular place – like this valley, like these springs. This name, *[NAME]*, marks *this* path, *this* history we witnessed emerging from the limestone.

  Adela Marchetti valued clarity, courage, and acknowledging what is present before us. Tonight, we acknowledge this small, pale swimmer from the dark springs. We acknowledge the years of work that found it and recognized its distinct journey. And we acknowledge Adela’s enduring legacy, which makes such work possible here. Her name is now part of the scientific conversation about life’s incredible capacity to adapt, to diverge, to find a way in the darkness. It signifies our shared commitment to paying attention.

  So, it is my great honor to invite the Marchetti family to join me as we unveil this new resident of our collection, bearing Adela’s name: *[NAME]*.

  *(Pull cord, reveal case)*
  Behold: *[NAME]*.

  **Commitment:** This naming signifies our recognition of a distinct evolutionary lineage observed inhabiting these specific springs, separate in its history and present form from surface relatives.
