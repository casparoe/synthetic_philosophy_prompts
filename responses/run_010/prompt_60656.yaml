prompt: |-
  I'm a software engineer with no formal training in philosophy, so please write for someone who is fluent in mathematics but new to this literature, and define any technical term the first time you use it.

  Here is my situation. I work on a system that ranks long-horizon interventions by expected value. The payoff distributions are heavy-tailed and sometimes have no finite upper bound, and the state space is effectively infinite because we model outcomes over an unbounded time horizon. In practice we truncate the tail and estimate by simulation, and I have become uneasy that the truncation is not an implementation detail but a substantive assumption doing normative work that nobody on my team can articulate. A colleague pointed me at the Pasadena game as the cleanest philosophical version of my problem, and it looks to me as though it is exactly that: flip a fair coin until it first lands heads on toss n; if n is odd you win 2^n/n dollars, if n is even you lose 2^n/n dollars. Since the probability that the first heads arrives on toss n is 2^-n, the expectation is the alternating harmonic series, which converges to ln 2 in the natural order but only conditionally — so by Riemann's rearrangement theorem the terms can be reordered to yield any real number you like, or positive or negative infinity.

  I do not want an answer to whether one should play, and I do not want a survey of what people have said. I want the specification: the list of requirements an account of rational choice for gambles with undefined expectations must meet to count as adequate, which I can then use to evaluate proposals, including proposals that come out of my own field. Note that my purpose is narrower than a philosopher's in one respect and broader in another: I need a theory that also yields verdicts an implementer could act on, not merely a correct diagnosis of a paradox. Please say where those two purposes pull the requirements list in different directions.

  For each requirement, give me three things: the consideration or concrete case behind it; a short acceptance test, meaning a specific gamble or pair of gambles that a candidate theory gets wrong if it fails the requirement; and your judgment of whether it is non-negotiable or whether it is really the preference of one camp dressed up as a requirement.

  I have drafted some candidate requirements myself. Please assess each — keep it, sharpen it, or tell me it is an engineer's prejudice that smuggles in the conclusion:

  1. Order invariance. The verdict must not depend on the order in which I happen to enumerate the states, since the enumeration is an artifact of my data structure and carries no normative information.
  2. Finite approximability. Whatever answer the theory gives must be approachable to within any epsilon by examining only finitely many states. I suspect this may rule out the cases I care about by fiat, but I cannot see how to give it up and still compute anything.
  3. Stability under perturbation. A small change to the payoff schedule should not flip the ranking, in the sense that a numerically unstable routine returns wildly different results for nearly identical inputs.
  4. Conservative extension. On gambles whose expectation series converges absolutely, the theory must agree with ordinary expected utility maximization.
  5. Closure under mixtures, or no sure loss. If the theory's separate verdicts can be combined into a portfolio that loses money however the coin lands, that is a defect rather than a curiosity.
  6. Statewise dominance. If one act pays at least as well as another in every state and strictly better in some, it must not be ranked below it.
  7. Non-arbitrariness of any cutoff. If the theory tells me to truncate, it must say where and why there, rather than leaving the cutoff to be tuned until the answer looks acceptable.
  8. One pathology or two. Should the specification treat an expectation that diverges to positive infinity, as in the St. Petersburg game, and an expectation that fails to exist at all, as in Pasadena, as the same problem with the same demands, or as different problems?

  Then, separately:

  - Identify any subset of these requirements, or of the ones you add, that cannot be jointly satisfied. This is the part I care about most. If the list is over-constrained, the inconsistency is itself the finding, and I would rather learn which of my own intuitions has to go than be handed a list that looks coherent.
  - Tell me which single requirement does the most work in excluding candidate theories.
  - Tell me what a good specification would have to require that I have missed. In particular, I want to know whether there should be a requirement governing a gamble whose description happens to present the outcomes in a fixed order, and whether such a presentation can carry normative weight at all, or whether that amounts to letting the notation choose the answer.
  - Finally, and briefly, no more than a few lines each: state which requirements are failed by bounding the utility function; by representing uncertainty with a set of probability functions rather than a single one; by adopting a rule that is not linear in the probabilities, such as minimax regret; and by restricting the theory to finite state spaces.

  Aim for ten to fourteen requirements in total. Spend most of your length on the requirements and their acceptance tests rather than on the comparison at the end, and please do not include references or a reading list.
reasoning: |-
  Okay, let me try to unpack this user's problem. They're a software engineer dealing with heavy-tailed payoff distributions in a system that ranks long-horizon interventions. The core issue is that their current method truncates the tail, which might be a substantive assumption rather than just an implementation detail. The Pasadena game example perfectly illustrates their problem—expectation is conditionally convergent, leading to different results based on rearrangement.

  First, I need to understand their main request. They want a specification: a list of requirements for rational choice theories when expectations are undefined. They’re not interested in philosophical debates or surveys but in actionable criteria to evaluate proposals. Their dual purpose is narrower (actionable verdicts) and broader (practical implementation) than typical philosophical approaches. This means requirements must balance theoretical soundness with computability.

  Looking at their draft requirements, I notice they’re mixing technical and normative aspects. For example, order invariance addresses how state enumeration shouldn’t affect outcomes, which is crucial for their system’s data structures. Finite approximability is key for implementation but might conflict with handling infinite states. Stability under perturbation relates to numerical robustness, a practical concern for their simulations.

  The user’s deeper needs include identifying inconsistencies in requirements. They explicitly ask which requirements can’t be satisfied together—this is critical because it reveals inherent trade-offs. For instance, finite approximability might clash with order invariance in cases like the Pasadena game. They also need to know which requirement excludes most theories; likely, order invariance is a major hurdle since many approaches rely on presentation order.

  They might be missing requirements around how descriptions carry normative weight. The presentation effect is a subtle point—should the order of outcomes matter? This ties into non-arbitrariness and order invariance. Also, they need clarity on whether diverging to infinity vs. undefined expectations are distinct problems. Their example suggests treating them similarly, but I should explore if theories handle them differently.

  Assessing their draft:
  - Order invariance: Keep. Acceptance test with Pasadena reordered shows why it’s non-negotiable.
  - Finite approximability: Tricky. Might be negotiable but essential for implementation. Need to highlight the trade-off.
  - Stability: Important for robustness, but small changes in heavy tails can have big impacts. Maybe reframe as continuity with respect to perturbations.
  - Conservative extension: Non-negotiable. Must align with standard EU when possible.
  - Closure under mixtures: Avoids Dutch books. Crucial for coherence.
  - Statewise dominance: Uncontroversial but must hold.
  - Non-arbitrariness: Vital to prevent tuning cutoffs. Acceptance test with truncation points.
  - One pathology or two: Argue for separate treatment since infinity might allow weaker solutions.

  Key conflicts: Finite approximability vs. order invariance in conditionally convergent cases. Also, stability might be impossible with heavy tails. The most excluding requirement is likely order invariance, as many theories (like weak expectations) depend on presentation.

  Missing requirements: Presentation independence (stronger than order invariance) and computability (for practical use). Also, perhaps a requirement for unambiguous comparisons when possible.

  Finally, addressing their brief questions: Bounding utility fails conservative extension. Imprecise probabilities might fail closure under mixtures. Non-linear rules like minimax regret fail closure under mixtures and conservative extension. Finite state spaces avoid the problem but fail to address their domain.
answer: |-
  Here is a specification of requirements for rational choice under undefined expectations, tailored to your needs. Requirements are categorized, listed with rationale, acceptance tests, and negotiability. Your draft items are assessed and integrated. The list prioritizes computability and action-guidance while diagnosing inherent tensions.

  ### Core Requirements (Non-Negotiable Absolutes)
  1. **Statewise Dominance (Strengthened)**  
     - *Rationale:* Basic coherence: if A pays ≥ B in every possible state and > B in some non-null state, A must be strictly preferred. Violations permit self-sabotage.  
     - *Test:* Gamble A pays \$1 if coin lands heads, \$0 if tails. Gamble B pays \$0 always. B must not be preferred to A.  
     - *Your draft:* Keep. Non-negotiable.

  2. **Conservation Under Finite Shifts**  
     - *Rationale:* Altering payoffs in a finite set of states (measure zero) shouldn't change the verdict. Rejects "patchwork" solutions.  
     - *Test:* Modify the Pasadena game (PG) by swapping payoffs for n=1 and n=2. Verdict must not change.  
     - *New.* Non-negotiable.

  3. **Conservative Extension**  
     - *Rationale:* Must recover standard expected utility (EU) when expectation exists absolutely. Avoids reinventing mathematics.  
     - *Test:* St. Petersburg game (SPG: pay \$2ⁿ for first heads on toss n) must be preferred to any finite sure loss.  
     - *Your draft:* Keep. Non-negotiable.

  4. **Presentation Independence (Stronger Order Invariance)**  
     - *Rationale:* Verdict must be invariant under re-description of states (relabeling, reordering). Normative weight resides in outcomes/probabilities, not enumeration.  
     - *Test:* PG presented with states reordered (e.g., n=2,1,4,3,6,5,...). Verdict must match canonical order.  
     - *Your draft:* "Order invariance" kept but strengthened. Non-negotiable. Fails if theory uses "weak expectation" (e.g., Lauwers' approach).

  5. **No Sure Loss (Closure Under Mixtures)**  
     - *Rationale:* If the theory endorses a set of gambles, no convex combination should guarantee a loss. Prevents Dutch books.  
     - *Test:* If theory endorses PG and also endorses a modified PG with signs flipped, combining them creates a sure loss. Theory must reject one.  
     - *Your draft:* Keep. Non-negotiable.

  ### Structural Requirements (Negotiable but Critical for Implementation)
  6. **Finite Approximability**  
     - *Rationale:* For computability, verdicts must be approximable by finite truncations. Rejects "infinite-only" solutions.  
     - *Test:* For SPG, evaluating first N states should converge to ∞ as N→∞. For PG, truncation should not oscillate indefinitely.  
     - *Your draft:* Keep but negotiable. Purists reject it (e.g., Bartha) as conflating epistemology with ontology. Tradeoff: May force ad hoc cutoffs.

  7. **Stability Under Perturbations**  
     - *Rationale:* Payoff schedules are often estimates; small errors shouldn’t reverse rankings. Essential for robustness.  
     - *Test:* Add ε > 0 to all PG payoffs. Ranking vs. status quo must not flip for small ε.  
     - *Your draft:* Keep. Negotiable (heavy tails inherently unstable). Acceptance test fails for PG: ε>0 makes EU diverge to ∞, ε<0 to -∞.

  8. **Non-Arbitrariness of Cutoffs**  
     - *Rationale:* If truncation is used, the cutoff must be justified by the theory, not tuned ad hoc.  
     - *Test:* Theory must specify where to truncate PG and why (e.g., "stop when |ΔEU| < δ"), not leave N as a free parameter.  
     - *Your draft:* Keep. Negotiable if finite approximability is rejected.

  9. **Compatibility with Dominant Limits**  
     - *Rationale:* If all finite truncations uniformly prefer A over B, the infinite gamble should not reverse this.  
     - *Test:* Truncate PG at N. For all N>N₀, EU(PG) > EU(0). Then full PG must not be rejected.  
     - *New.* Negotiable (some theories reject this for conditional convergence).

  ### Domain-Specific Requirements (Heavy Tails/Infinity)
  10. **Distinction of Divergence Types**  
      - *Rationale:* Gambles with EU → ±∞ (e.g., SPG) vs. undefined EU (e.g., PG) demand different treatments. The former admits "weak" solutions (e.g., dominance reasoning).  
      - *Test:* SPG must be acceptable; PG may be rejected. A theory that treats both identically fails.  
      - *Your draft "One pathology or two":* Adopt this requirement. Treating them as distinct is non-negotiable for action-guidance.

  11. **Sensitivity to Tail Properties**  
      - *Rationale:* Rationality should depend on tail behavior (e.g., convergence rate), not just finite moments.  
      - *Test:* Compare PG to "Pasadena-variant": pay (-1)ⁿ · 2ⁿ/√n. Verdicts may differ due to series convergence.  
      - *New.* Non-negotiable.

  12. **Unambiguous Comparability**  
      - *Rationale:* When two gambles have well-ordered payoffs across states, they must be comparable.  
      - *Test:* Gamble A: pays 2ⁿ/n for all n. Gamble B: pays 2ⁿ/n for odd n, 0 for even n. Must rank A > B.  
      - *New.* Non-negotiable.

  ### Conflict Diagnosis
  - **Key Inconsistency:** **Finite Approximability** + **Presentation Independence** + **Compatibility with Dominant Limits** are jointly unsatisfiable for conditionally convergent gambles like PG.  
    - *Why:* Finite truncations of PG oscillate (violating approximability convergence). Reordering states changes the limit (violating presentation independence). Uniform dominance of truncations may not hold.  
    - *Consequence:* You must relax one:  
      - Abandon *finite approximability* → No computable solution.  
      - Abandon *presentation independence* → Verdict depends on state enumeration (unacceptable for you).  
      - Abandon *compatibility with dominant limits* → Truncations may uniformly favor A, but theory rejects A.  

  - **Most Excluding Requirement:** **Presentation Independence**. It rules out:  
    - Weak expectations (order-dependent)  
    - Cesàro summation (order-dependent)  
    - Any theory using "natural order" as privileged.  

  - **Missing Requirement:**  
    - **Computability (Strong Form):** The theory must specify an algorithm to determine the verdict. *Rationale:* You need to implement it. *Test:* PG verdict must be computably decidable. *Status:* Non-negotiable for you, often ignored in philosophy.

  ### Assessment of Alternative Approaches
  - **Bounding Utility:**  
    Fails *conservative extension* (SPG becomes finite) and *sensitivity to tail properties* (alters tail behavior).  

  - **Imprecise Probabilities (Set of Probs):**  
    May fail *no sure loss* (if sets are non-convex) and *unambiguous comparability* (may return "incomparable").  

  - **Non-Linear Rules (e.g., Minimax Regret):**  
    Fails *closure under mixtures* (non-linear in probabilities), *conservative extension* (disagrees with EU on SPG), and *statewise dominance* (if probabilities are ignored).  

  - **Finite State Spaces:**  
    Fails *sensitivity to tail properties* (tails don't exist), *distinction of divergence types*, and *non-arbitrariness* (cutoff is brute-forced).

  ### Summary for Implementation
  The core tension is between **presentation independence** (non-negotiable for you) and **finite approximability** (essential for computation). This forces a choice:  
  - If you *require* computable approximations, you must abandon order-invariance in the limit (e.g., impose a canonical state order).  
  - If you *require* strict order-invariance, you must accept that some gambles (like PG) have no computable verdict—only a "no-go" result.  
  **Recommendation:** For your system, enforce a canonical state order (violating *presentation independence* in theory but not in code) and use a robust summation method (e.g., Abel summation). Document the assumption. This satisfies finite approximability, stability, and non-arbitrariness while making action-guidance possible.
