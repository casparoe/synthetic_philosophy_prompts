prompt: |-
  Two people in my reading group have already told me what they think intuitionistic logic is, and both of them are wrong in ways that will wreck the session if I don't kill those beliefs early. One says "so it's just classical logic with excluded middle deleted, right, strictly weaker." The other is convinced constructivists hold that P-or-not-P is *false*, which I'm pretty sure is backwards but I don't have a clean way to show it in the time I've got.

  Context: I'm running a two-hour evening session for a reading group at my uni, mostly CS/AI grad students plus two philosophy people whose last logic course was years ago. Nobody has done proof theory. Most can read a type signature and have sat through a Coq or Lean demo at some point. The goal isn't to convert anyone to constructivism — it's that at the end they can say what an intuitionist is and isn't committed to, and explain why what fails is something like double-negation elimination rather than some exotic rule nobody uses anyway, and why that failure isn't a loss of firepower.

  Plan the session for me. I don't want an explanation of intuitionistic logic, I want the run sheet and the reasoning behind it:

  - the order of the pieces with rough minutes attached, justified by what depends on what. My guess is you can't motivate the double-negation failure until they've got some account of what a proof of a disjunction is supposed to be — tell me if that's wrong, and tell me where any semantic machinery goes relative to the proof-reading stuff, because I suspect putting a model theory in too early makes everyone think it's just a different set of truth tables.
  - the one example or scenario that carries the whole thing. It has to go on the board in under ten minutes and it has to survive the "fine, but that's only about undecided arithmetical statements" shrug. If your pick is a little Kripke picture with two worlds, say what it buys that a natural-language case can't, and if your pick is the natural-language case, say what it costs.
  - the misconception map tied to the timeline, not just listed: which wrong belief each segment will create or entrench if I run it out of order, including the two above. I specifically want to know the minute by which "constructivists deny excluded middle" has to be dead, because if it's still alive at the halfway point I think it poisons everything downstream. Also flag the misconception they'll pick up *from* the example you chose.
  - what to leave out and say out loud that I'm leaving out. Candidates: the theorem that a propositional formula is classically valid just when its double negation is intuitionistically provable; the result that certain choice principles plus extensionality hand you excluded middle back; and the thing someone read online that in Brouwer's system every function on the reals turns out continuous. Which of those three actually pays off in this room and which is a trap that eats twenty minutes?
  - one question to ask near the end that separates "landed" from "nodded politely", plus what a good-but-not-great answer sounds like next to a real one.

  No reading list, please, nobody will read anything. And keep it to something I could actually run in a room with a whiteboard and no handouts.

  End your reply with exactly one line in this form:
  Carrying example: <the example you picked, ten words or fewer>
