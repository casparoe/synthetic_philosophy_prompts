    - Motivate: In constructive logic, a proof of a statement must provide evidence that can be used to compute with. We lose some principles (like excluded middle) but gain a direct computational meaning.

  II. The Meaning of Connectives: Proof Conditions (20 min)
    - We explain the BHK interpretation (Brouwer-Heyting-Kolmogorov) for the connectives. Focus on what it means to prove:
          - A conjunction P ∧ Q: a proof is a pair (a, b) where a is a proof of P and b is a proof of Q.
          - A disjunction P ∨ Q: a proof is either (left, a) for a proof a of P or (right, b) for a proof b of Q.
          - An implication P → Q: a proof is a function that transforms any proof of P into a proof of Q.
          - Negation ¬P: defined as P → ⊥, where ⊥ is absurdity (a proposition with no proof). So a proof of ¬P is a function that, given a proof of P, would produce a proof of absurdity.
    - Why? Because in constructive mathematics, we care about the evidence for a statement. We cannot just assert P∨¬P without having a way to decide which one and provide the proof.

