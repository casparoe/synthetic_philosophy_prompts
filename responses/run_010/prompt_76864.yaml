answer: |-
  ### Session Plan: Understanding Intuitionistic Logic

  **Total Time:** 120 minutes  
  **Goal:** Participants will articulate why intuitionistic logic rejects double-negation elimination (DNE) but *not* excluded middle (EM) as "false," and why this is computationally meaningful.

  #### I. Introduction & Misconception Busting (15 min)
  - **What (5 min):** Define intuitionistic logic as "logic of constructive proof" (not "truth"). Contrast with classical: "You can't assert \(P\) unless you have evidence to compute/build it."
  - **Kill Misconceptions Now (10 min):**  
    - *First misconception ("Just classical minus EM"):* "Deleting EM isn't the point—connectives mean different things. It's not weaker; it's stricter on *proofs*."  
    - *Second misconception ("EM is false"):* **CRITICAL: KILL BY MINUTE 15.** Say: "Constructivists *don't* say EM is false. They say: We can't assert \(P \lor \neg P\) without evidence. But proving it *false\)? That’s absurd—try it!" (Plant seed for IV).  
  - **Why early?** If "EM is false" survives, they’ll misread everything as anti-classical dogma.

  #### II. The Proof Interpretation (BHK) (25 min)
  - **What (15 min):** Whiteboard the BHK rules:  
    - Prove \(A \land B\)? Show a proof of \(A\) *and* a proof of \(B\).  
    - Prove \(A \lor B\)? Show a proof of \(A\) *or* a proof of \(B\) (say which!).  
    - Prove \(A \to B\)? Show a *function* converting proofs of \(A\) to proofs of \(B\).  
    - Prove \(\neg A\)? Show \(A \to \bot\) (where \(\bot\) is unprovable).  
  - **Example (10 min):** "Prove 'if \(n\) is even, then \(n+2\) is even'." Have them argue: You need a *method* (e.g., add 2), not just "it’s true."  
  - **Why here?** BHK sets the stage for why DNE fails—you can't conjure evidence from nothing.  
  - **Misconception risk:** "So it's just programming?" Clarify: "It’s the logic behind programming, but we’re focused on proof rules."

  #### III. Why Double-Negation Elimination Fails (30 min)
  - **Carrying Example: Halting Problem & Kripke Model**  
    - **Natural language (10 min):** Let \(H\) = "This Turing machine halts."  
      - Claim: \(\neg\neg H \to H\) should hold?  
      - Intuitionistic refutation: "\(\neg\neg H\) means 'You can't prove it never halts.' But that doesn't hand me a halting run! I need the *run* to prove \(H\)."  
    - **Kripke model (15 min):** Sketch two worlds:  
      - **Now (\(w_0\)):** No knowledge of \(H\) (machine hasn't run).  
      - **Future (\(w_1\)):** Machine halts (so \(H\) true).  
      - At \(w_0\): \(\neg H\) is false (it might halt), so \(\neg\neg H\) is true. But \(H\) is unprovable here. Thus, \(\neg\neg H \to H\) fails at \(w_0\).  
    - **Why Kripke?** It buys a *formal*, non-arithmetical counterexample. Natural language alone invites "undecided shrug"; Kripke shows it's about *information growth*.  
  - **Recap (5 min):** "DNE asks for evidence you don’t have. BHK requires evidence; Kripke models potential knowledge."  
  - **Misconception risk:** "So intuitionism is about time?" Clarify: "It's about possible constructions—Kripke is a tool, not the definition."

  #### IV. Excluded Middle: What Constructivists *Actually* Believe (20 min)
  - **Refine Earlier (10 min):** Revisit EM: \(P \lor \neg P\).  
    - "You can't assert it without evidence (e.g., for \(H\), you lack a halting proof *or* a non-halting construction)."  
    - "But is it *false*? Prove \(\neg(P \lor \neg P)\): Assume \(P \lor \neg P\), derive \(\bot\). How? If you have \(P\), you have \(P \lor \neg P\)—contradiction! Wait, no: \(P \lor \neg P\) is the assumption. Actually, \(\neg(P \lor \neg P)\) implies both \(\neg P\) and \(\neg\neg P\), which is absurd. **Key:** \(\neg\neg(P \lor \neg P)\) *is* provable intuitionistically—constructivists don’t deny EM; they just don’t assume it."  
  - **Why here?** Depends on BHK (what a disjunction proof requires) and DNE failure (why \(\neg\neg\)EM doesn’t imply EM).  
  - **Misconception risk:** "So EM is ‘sometimes true’?" Clarify: "No—it’s not universally *provable*, but never *refutable*."

  #### V. Why This Matters Beyond "Undecided" Statements (20 min)
  - **Example (15 min):** Classical proof of "There exist irrationals \(a, b\) such that \(a^b\) is rational."  
    - *Classical:* "\(\sqrt{2}^\sqrt{2}\) is rational or irrational. If rational, done. If irrational, let \(a = \sqrt{2}^\sqrt{2}\), \(b = \sqrt{2}\); then \(a^b = 2\)." Uses EM on an arithmetically decidable statement!  
    - *Constructive objection:* "Which pair? Classical proof doesn’t say. I need explicit \(a, b\) (e.g., \(\sqrt{2}, \log_2 9\))."  
  - **Point (5 min):** "It’s about evidence, not decidability. EM hides witnesses—fine for truth, bad for computation."  
  - **Why here?** Uses EM discussion and BHK (disjunction requires explicit choice).

  #### VI. Wrap-up & Landing Check (10 min)
  - **Recap (5 min):** "Intuitionism: Proofs as evidence. Lost DNE, kept non-contradiction (\(\neg(P \land \neg P)\)). EM not false—just unprovable universally."  
  - **Landing Question (5 min):**  
    - **Ask:** "In intuitionistic logic, is \(\neg(P \land \neg P)\) provable? Why?"  
    - **Good-not-great:** "Yes, because contradictions can’t happen."  
    - **Real answer:** "Yes: Assume \(P \land \neg P\). Then \(\neg P\) (so \(P \to \bot\)) and \(P\), so \(\bot\). Thus, \(\neg(P \land \neg P)\). Uses BHK: Contradictions *construct* absurdity."  
  - **Q&A buffer:** 10 min (flex from intro/conclusion).

  ---

  ### What to Omit & Why
  - **Double-negation translation (classical ≡ intuitionistic \(\neg\neg\)):** Mention 1 sentence ("There’s a deep embedding trick"), but proving it eats 20 min for little insight here.  
  - **Choice principles + extensionality ⇒ EM:** A trap—requires advanced math, irrelevant to core goals.  
  - **Brouwer’s continuity:** Fascinating but esoteric; distracts from proof-theoretic focus.  

  ---

  ### Misconception Timeline
  - **Minute 15:** "EM is false" must be dead. Surviving poisons BHK (they’ll see "proof" as dogma) and DNE (they’ll think intuitionists "reject logic").  
  - **Post-BHK (min 40):** Risk: "Connectives are just functions." Mitigate by emphasizing "proofs, not code."  
  - **Post-DNE (min 60):** Risk: "DNE fails only for undecided things." Kripke + halting problem mitigate.  
  - **Post-EM (min 80):** Risk: "EM is okay for decidable statements." Rational powers counter this.  

  ---

  Carrying example: Halting problem (natural language) and two-world Kripke model (formal).
