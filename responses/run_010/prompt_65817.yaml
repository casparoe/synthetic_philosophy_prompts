  I'm a novelist deep in a book about a night courier who drives the same ring road over and over and genuinely can't tell one interchange from the next — the absent-minded driver setup: he should get off at the second one, but when he rolls up to an interchang he has no idea which it is. Writing him, I've drifted into a pretty strong view: the paradox shows individual acts aren't the real units of rational choice at all, that what the driver rationally picks is a whole policy, and that the local reasoning at the ramp — get off now, this one looks like the second — is a mistake that dissolves once you score policies instead of single moves.

  What would count against that? Give me the cases, arguments and results that should actually move me, sorted into fatal versus merely awkward, and say which ones a committed policy-first person would happily concede and which they'd wave off. Does the view risk anything at all, or has it been padded with enough qualifications that nothing could ever count against it — and is that a problem for a view of this kind? And if my character's knotted string and dead GPS turn out to change the diagnosis rather than just implement it, I want to hear that too. If you think I've mangled the original problem, or that policy-first is just act-based reasoning in a costume, tell me straight instead of humoring me.

  Plain prose like a letter, please — no headings, bullets, bold or tables. And flag anywhere you're unsure of the technical details rather than bluffing your way through.
