  - Polymer Analysis (3 units): Identifies and characterizes any linear polymer. Can settle whether there is an informational molecule.
  - Growth Monitoring (3 units): Observes growth and fragmentation over time. Can settle whether it reproduces.
  - Catalysis Screening (2 units): Tests for enzyme-like catalysts. Can settle whether there are biological catalysts.
  - Acclimatization Test (2 units): Tests response to changing hydrogen pressure. Can settle whether it adapts.

