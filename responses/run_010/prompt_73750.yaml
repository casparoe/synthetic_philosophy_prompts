    - **Criterion 3 (Bounded Individuality)**:  
      - Alive but fails: **Dry bacterial spore** (no self-production in stasis).  
      - Not alive but passes: **BZ reaction (chemical oscillator)** (self-producing pattern in a reactor).  
      - *Why it bites*: Spores are alive but inert; BZ reactions pass but are abiotic.  
    - **Criterion 4 (Informational Polymer)**:  
      - Alive but fails: **Human red blood cell** (no nucleus/DNA).  
      - Not alive but passes: **Crystallizing mineral with heritable defects** (e.g., "mineral genes").  
      - *Why it bites*: RBCs are alive but lack heredity; crystals pass but aren’t alive.  
  - **70–85 min**: Class debrief (keyed to moments).  
  - **85–90 min**: Wrap-up.  

  ---

  ### Deliverable 2: Scoring Rules  
  - **Rule R1 (False Positive Catastrophic)**:  
    - Context: In-situ analysis phase (avoid planetary contamination).  
    - Verdict Scoring:  
      - False Positive (say alive when not): **−1000** (mission cancellation, reputation loss).  
      - False Negative (say not alive when alive): **−1** (sample re-analyzed on Earth).  
      - True Positive: **+100** (correct detection).  
      - True Negative: **+1** (correct non-detection).  
    - *Effect*: Demands near-certainty for "alive" (threshold ~99.9% probability).  

  - **Rule R2 (False Negative Catastrophic)**:  
    - Context: Sample return phase (avoid losing discovery).  
    - Verdict Scoring:  
      - False Negative (say not alive when alive): **−1000** (sample sterilized, discovery lost).  
      - False Positive (say alive when not): **−1** (unnecessary precautions).  
      - True Positive: **+100** (discovery preserved).  
      - True Negative: **+1** (correct non-detection).  
    - *Effect*: Demands near-certainty for "not alive" (threshold ~0.1% probability).  

  *Arithmetic Divergence*: Under R1, "alive" requires extreme evidence; under R2, "not alive" does. Same data yields opposite verdicts if the probability of life is between 0.1% and 99.9%. Retroactively, assays that reduce uncertainty (e.g., Polymer Analysis) are worth more under R1, while acclimatization (suggesting adaptability) is worth more under R2.  

  ---

  ### Deliverable 3: Debrief Script (Keyed to Moments)  
  - **When group 3 burns its budget on Polymer Analysis**: "Notice how focusing on heredity left gaps in metabolism and adaptation. Resource allocation reflects what we *value* as decisive—but what if we’re wrong about what matters?"  
  - **When a group refuses to commit to G**: "Ambiguity is real, but missions demand decisions. Inaction has costs too—what if we lose the sample? This is why Cleland argues definitions aren’t enough without theory."  
  - **When a student’s verdict moves (V1 to V2/V3) without evidence change**: "Your evidence didn’t change, but the stakes did. This isn’t about truth—it’s about decision thresholds. In astrobiology, the cost of error shapes what we call ‘sufficient proof’."  
  - **After mirrors land (min 70)**: "You applied your criteria to Earth and got uncomfortable verdicts. This is the core problem: our criteria are extrapolated from one sample (Earth). We need a *theory* of living systems, not just a definition. Now we can name concepts: NASA’s Darwinian-evolution focus, autopoiesis (self-production), or Cleland’s argument that single-sample definitions mislead. A shadow biosphere might not fit our checklist."  

  ---

  ### Deliverable 4: Predictable Problems and Fixes  
  1. **Bench-experienced students dominate**:  
     - *Fix*: Enforce "criterion round" and assign discussion order (e.g., biology majors speak last).  
  2. **Group stalls with unspent budget**:  
     - *Fix*: Announce mid-planning: "Unspent units are wasted; they won’t buy extra time." Add a default assay (e.g., "Rush Fee: +1 unit cost for last-minute changes").  
  3. **Contamination question swallows time**:  
     - *Fix*: Preempt in initial packet: "Control swabs found low terrestrial 16S; gel polymer didn’t amplify with universal primers." If pressed: "Assume contamination is ruled out for this activity."  
  4. **Role-play breaks (e.g., philosophy majors dismiss exercise)**:  
     - *Fix*: Start with: "This is a simulation of mission pressure. If your criterion feels arbitrary, that’s the point—argue it anyway." Use "no veto" rule to force engagement.  

  ---

  ### Deliverable 5: Unreproducible Real-Problem Feature  
  - **Feature**: The activity cannot replicate *open-ended scientific inquiry*. Real missions allow iterative experiments, new instruments, or theoretical insights that reframe data.  
  - **Facilitator Supply**: Emphasize post-activity: "In reality, we’d seek new evidence—but missions have time/resource limits. This is why we need theories to guide priorities."  

  ---

  ### Deliverable 6: Dossier Audit  
  - **Tensions/Joint Impossibilities**:  
    - **Point 2 vs. 6**: Gradient maintenance requires metabolic activity (90× uptake), but no catalysis is found. Catalysis is necessary for such rates at −18°C. *Repair*: State catalysis is *structural* (gel matrix facilitates reactions; destroyed by homogenization).  
    - **Point 5 vs. 4**: Fragmentation shows no heredity (no parent-offspring sequence similarity), but acclimatization (point 7) implies heritable change. *Repair*: Clarify acclimatization is phenotypic (e.g., physiological adjustment), not genetic.  
    - **Point 7 vs. 6**: Acclimatization suggests dynamic response, but no catalysis. *Repair*: Frame acclimatization as physical (e.g., gel viscosity shifts), not enzymatic.  
  - **Contamination Complication**: Include it. Adds realism and rules out Earth life. Add to **initial packet** as a free line: "Control: Sampling train swab found low-copy terrestrial 16S; gel polymer did not amplify with universal primers."  
  - **Fabrication Tell**: Isotope fractionation (point 3) outside known abiotic/biological pathways is plausible for novel life, but combined with no catalysis, it strains credibility. A biogeochemist would flag this unless catalysis is structural.  

  ---

  ### Deliverable 7: Central Trick Assessment  
  - **Risk**: High. Students may reduce "life" to a decision threshold driven by institutional incentives, undermining scientific objectivity.  
  - **Defusing the Debrief**:  
    - **Acknowledge**: "Yes, decisions depend on costs—but that doesn’t mean life isn’t real. Evidence is objective; our *interpretation* is contextual."  
    - **Reframe**: "The exercise shows why we need a theory. Without it, we’re stuck with Earth-centric checklists that fail when stakes change or we face novelty."  
    - **Elevate**: "Your verdicts moved because *uncertainty* is inherent. The goal isn’t to abandon criteria—it’s to build better ones. Cleland: ‘Definitions don’t extend; theories do.’"  
    - **Reinforce with Mirrors**: "When you called a flame ‘alive’ or a mule ‘not alive,’ you felt the disconnect. That discomfort is why astrobiology needs more than a definition—it needs a science of living systems."  

  ---  
  This design ensures students confront interdependence of criteria, cost-dependent verdicts, and Earth-centric biases. The dossier’s tensions (e.g., metabolism without catalysts) are retained to fuel debate, with mirrors amplifying discomfort. Run it as a "mission simulation" to sustain engagement.
