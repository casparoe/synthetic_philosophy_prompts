  ### 2. Scoring rules

  **Rule R1** (Planetary Protection during in-situ analysis):
  - If you say "alive" and it is not alive (false positive): cost = 1000 (mission cancelled, reputations destroyed)
  - If you say "not alive" and it is alive (false negative): cost = 1 (sample can be re-analyzed on Earth)
  - If you say "alive" and it is alive (true positive): cost = 0 (correct, mission can proceed with caution)
  - If you say "not alive" and it is not alive (true negative): cost = 0 (correct)

  **Rule R2** (Sample Return phase):
  - If you say "alive" and it is not alive (false positive): cost = 1 (unnecessary precautions, minor waste)
  - If you say "not alive" and it is alive (false negative): cost = 1000 (sample is sterilized, discovery of the century lost)
  - If you say "alive" and it is alive (true positive): cost = 0 (sample is preserved and studied)
  - If you say "not alive" and it is not alive (true negative): cost = 0 (correct)

  ### 3. Debrief keyed to moments

  - When group three burns its entire budget on sequencing: "Notice how the focus on one line of evidence left other questions unanswered. In real missions, resource allocation is a gamble, and we may over-invest in what we know best or what feels decisive."
  - When a group refuses to commit to a group verdict: "Sometimes, the evidence is ambiguous, and groups may not want to decide. But in astrobiology, decisions must be made with incomplete information. The cost of inaction is also a cost."
  - When someone notices that their verdict moved without the evidence moving: "This is the core of our exercise. The evidence didn't change, but the stakes did. When the cost of being wrong changes, our threshold for what counts as 'enough evidence' must change. This is not about truth changing, but about decision theory."
  - After the terrestrial mirrors: "You've seen that our criteria, derived from Earth life, are not universal. For example, by the informational polymer criterion, the red blood cell is not alive, and the prion is alive. But we don't accept that. This is the problem of having only one sample. Carol Cleland argues that we need a theory of living systems, not a definition. Until then, our criteria may mislead us."

  Introduce names after the mirrors: "Scholars like Carol Cleland have argued that we should not expect to fix the extension of a term like 'life' from a single sample. We need a theory. NASA's formulation (a self-sustaining chemical system capable of Darwinian evolution) is one attempt, but as we've seen, it may not capture everything or may be too narrow. Concepts like autopoiesis (self-production) or the shadow biosphere proposal (life with a different biochemistry) also show the limitations."

  ### 4. Predictable problems and fixes

  - Bench-experienced students dominating: Fix: Assign roles and enforce that each student must speak first for their criterion. Use a round-robin.
  - Group stalling with unspent budget: Fix: In the assay menu, include a note that unspent budget is wasted and will not improve results. Encourage them to spend all.
  - Contamination question swallowing session one: Fix: In the initial packet, state that the sample cell was sealed and the control was sterile. If they ask, say that contamination is ruled out by the controls.
  - Role-play breaking: Fix: Have a backup plan. If a student is not participating, the facilitator can step in and ask for their criterion's verdict. If they dismiss the exercise, remind them that the point is to experience the decision process.

  ### 5. Feature of the real problem the activity cannot reproduce

  The activity cannot reproduce the true scientific uncertainty and the potential for new discoveries. In reality, there might be follow-up experiments or new techniques. In this activity, the data is fixed and limited. The facilitator will have to supply the context that in real missions, decisions are made with limited data and under time pressure, and that new evidence may overturn verdicts.

  ### 6. Audit of the dossier

  The dossier has seven properties. We must check for joint impossibility or fabrication tells.

  - Point 1: Not cellular, gel with sharp chemical discontinuity. Possible for a non-cellular life form? But on Earth, all life is cellular. However, in astrobiology, we allow for non-cellular life.
  - Point 2: Gradient maintenance with uptake of hydrogen and sulfate. This suggests metabolism. The collapse upon warming suggests it's temperature-dependent. Possible.
  - Point 3: Isotope fractionation outside any known abiotic or biological pathway. This is unusual but conceivable for a new form of life.
  - Point 4: Polymer with phosphorus, no sugar, not like amino acids or bases, no complementarity or templating. This is odd. If it's an informational polymer, we would expect some form of complementarity or templating for heredity. The absence is a red flag.
  - Point 5: Growth by accretion and fragmentation, but no heredity (sequences not related to parent). This suggests growth and reproduction without inheritance. That would mean no evolution, which contradicts criterion 1. But point 7 shows acclimatization, which might be nongenetic adaptation.
  - Point 6: No catalysis. But there is continuous uptake and gradient maintenance. How can there be metabolism without catalysts? This is a tension. The uptake must be catalyzed to be 90 times faster than abiotic. So the absence of isolated catalysts is odd, but the homogenized extract stopping gradient maintenance suggests that the intact structure is necessary, so maybe the catalysis is not by isolated enzymes but by the gel matrix? But then why is there no catalysis in the extract? The dossier says "nothing enzyme-like has been isolated", but perhaps it's there but not isolated. The point says "the extract accelerates no reaction tested", which is a strong negative.
  - Point 7: Acclimatization without any detectable change in the polymer. This suggests nongenetic adaptation, which is possible (e.g., metabolic acclimation). But without catalysts, how does the acclimatization work? There's a tension between acclimatization and the absence of catalysis.

  The main tensions:
  - Between point 2 (metabolism) and point 6 (no catalysis): Metabolism typically requires catalysts. The specimen might use non-enzymatic catalysis or the gel structure itself catalyzes reactions? But the extract shows no catalysis.
  - Between point 5 (no heredity) and point 7 (acclimatization): If there is no heredity, then the acclimatization cannot be passed on, but it is a response within the lifetime. However, the acclimatization persists after the pressure is restored, which suggests a lasting change. Without heredity, it can't be passed to offspring, but it can be within the individual.

  The absence of catalysis is the biggest issue. In biochemistry, metabolic rates 90 times faster than abiotic controls at -18°C would require catalysis. The negative in point 6 is hard to reconcile.

  Minimal repairs:
  - For catalysis: Change point 6 to say that no *isolated* catalyst has been found, but the intact gel shows catalytic activity when tested in situ. Or, the catalysis is due to the gel structure and is destroyed by homogenization.
  - For the polymer: It might be that the polymer is not informational but structural, and heredity is by a different mechanism.

  Contamination complication: The control swab with terrestrial 16S while the gel's polymer doesn't amplify. This would be a strong indicator that the gel is not terrestrial contamination. It is worth including. It should be part of the initial packet or an assay. We can add an assay for "Contamination Check" that reveals this. But the problem says the dossier is fixed. However, we can include it as part of the initial packet or as a free assay.

  In the initial packet, we can add: "Control: A swab of the sampling train returned low-copy terrestrial 16S rRNA, but the gel's own polymer does not amplify under universal primers for DNA or RNA."

  This would be a free piece of information to rule out contamination.

  ### 7. Honest assessment of the central trick

  The risk is that students might conclude that life is merely a decision threshold and that the question is about institutional incentives. This risk is real.

  Defuse it in the debrief: "The activity shows that the decision to classify something as alive depends on the context and the cost of errors. But this does not mean that life is merely a social construct. Rather, it highlights that in the absence of a theory, our operational definitions are tied to Earth and are pragmatic. The underlying nature of life is what it is, but our access to it is limited. The exercise should motivate the need for a better theory of living systems that is not tied to Earth."

  We should emphasize that the evidence for life is objective, but the decision to act on it depends on the consequences.

  ## Final Adjustments

  Given the time, we might need to trim. For session one, if groups finish early, move to verdicts. For session two, focus on the mirrors that work best.

  For the dossier, we accept the tension and hope students notice the catalysis issue. In the audit, we note the catalysis tension and suggest that in the activity, students should debate how metabolism can occur without catalysts.

