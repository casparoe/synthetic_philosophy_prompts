answer: |-
  Based on Dana's six prior verdicts and her philosophical quip, I identify three candidate rules that stay consistent with all cases. They yield different predictions for your situation, and I'll provide a test case to distinguish them. Dana's actual verdict is likely **self-deception**, with Rule 3 being her most probable framework.

  ### Candidate Rules Defining Dana's "Self-Deception"
  1. **The Avoidance Rule**: Self-deception requires *active avoidance or suppression* of contradictory evidence/feelings. If you confront dissonant facts head-on without resistance, it's not self-deception (even if you're wrong).  
     - *Fits all cases*: Marcus avoids job-talk; Dad avoids measurements; Past-you avoided grad program reality. Priya/Jo/Terry confront evidence.  

  2. **The Integration Rule**: Self-deception occurs when beliefs *contradict* your own observable actions or emotional responses without reconciliation. If actions/emotions align with stated beliefs OR you consciously reconcile contradictions, it's not self-deception.  
     - *Fits all cases*: Marcus's actions (job hunting) contradict "staying for kids"; Dad's avoidance contradicts "BP is fine." Priya's actions align with support; Terry reconciles bad math with optimism; Jo's actions/emotions align with hope; Past-you's anger contradicted "paused" claim.  

  3. **The Subconscious Cost Rule**: Self-deception exists when there's a *subconscious emotional toll* (e.g., anxiety, defensiveness) stemming from unacknowledged conflict between belief and reality. If you process dissonance consciously (even if wrong), it's not self-deception.  
     - *Fits all cases*: Marcus snaps; Dad steers conversations; Past-you got angry. Priya/Jo show no distress; Terry has zero ego. Dana's quip ("who's fooling who?") hints at subconscious inevitability.  

  ---

  ### Predictions for Your Case (Long-Distance Partner)
  - **Rule 1 (Avoidance)**: **NOT self-deception**. You actively seek counterevidence (reread messages, timeline, critical friend), so no avoidance.  
  - **Rule 2 (Integration)**: **SELF-DECEPTION**. Your belief ("she'll move") contradicts her actions (lease/promotion). You haven't reconciled this—you dismiss it as "unpersuasive" without addressing the core disconnect.  
  - **Rule 3 (Subconscious Cost)**: **SELF-DECEPTION**. The 3am sinking feeling and deleted note indicate unresolved subconscious conflict. Your daytime rationality may be overcompensating.  

  **Dana's Likely Verdict**: **Self-deception** (leaning on Rule 3).  
  - *Why Rule 3?* Her past calls prioritize emotional tells (Marcus's snapping, your past anger, Jo's *lack* of distress). Your 3am anxiety and aborted note are classic subconscious "tells" she’d spot instantly. Rule 2 also fits, but Rule 3 explains her speed and certainty—she reads micro-expressions or tension when you discuss the lease.  
  - *Why not Rule 1?* Your evidence-seeking feels performative to her (like Marcus’s CV updates—activity masking avoidance). Dana’s quip implies self-deception can’t be "managed" consciously; your efforts might prove you’re *trying* to avoid avoidance.  

  ---

  ### Test Case to Settle the Rule
  **New Person**: Alex, who insists they’re "fine" after a breakup. They:  
  - Verbally acknowledge all painful facts (e.g., "My ex cheated, it’s over").  
  - Actively seek reminders (e.g., keeps photos visible, visits shared places).  
  - But exhibits physical symptoms: insomnia, weight loss, and reflexive eye-rubbing when the ex’s name comes up.  

  **Predictions per Rule**:  
  - **Rule 1 (Avoidance)**: NOT self-deception. Alex confronts evidence head-on; no suppression.  
  - **Rule 2 (Integration)**: SELF-DECEPTION. Actions/physiology (insomnia, distress) contradict "I’m fine" without reconciliation.  
  - **Rule 3 (Subconscious Cost)**: SELF-DECEPTION. Physical symptoms and reflexive tics show unresolved subconscious conflict.  

  **How This Settles It**:  
  - If Dana says **not self-deception**, she’s on Rule 1 (avoidance is key).  
  - If she says **self-deception**, she’s on Rule 2 or 3.  
    - *Then ask*: "What if Alex says they *want* to feel the pain to move on?"  
      - Rule 2: Still self-deception if actions/beliefs clash *without reconciliation*.  
      - Rule 3: **Not self-deception** if Alex *consciously accepts* the cost ("I know it hurts, but I need this").  

  Dana’s quip ("you can’t deliberately fool yourself") likely means she sees self-deception as a subconscious failure to integrate truth—not conscious choice. This supports **Rule 3** as her true framework. Your 3am dread is the smoking gun; she’ll clock it before you finish your first sentence on Sunday.
