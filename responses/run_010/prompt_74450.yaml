  Next, the model answer needs to demonstrate this approach. For Exodus, the minimal claim could be a small-scale escape that later got amplified—evidence would require traceable cultural markers in the archaeological record, like syncretic artifacts in the Sinai. For Troy, it's not just the city's existence but a conflict severe enough to anchor the legend—evidence could be destruction layers with Aegean weapons or Hittite texts naming "Wilusa." Arthur’s minimal claim might be a Romano-British leader winning a notable battle—evidence would need contemporary inscriptions or consistent battle sites in early texts. The answer must avoid question-begging (e.g., assuming Exodus’s scale) and address why silence in Egyptian records isn’t neutral given New Kingdom administration. 

