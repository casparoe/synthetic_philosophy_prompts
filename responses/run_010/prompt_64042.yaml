answer: |-
  ### Analysis: Democratic Boundaries in the 2014 and 2016 Referendums  
  The franchise rules for Scotland’s 2014 independence referendum and the UK’s 2016 EU referendum reveal tensions between competing democratic principles and administrative pragmatism. Below, I analyze each rule through the lens of the all-affected principle (AAP), all-subjected principle (ASP), membership principle (MP), and territorial jurisdiction (TJ) as a fourth concept. I then address your theoretical questions.  

  #### **Core Principles in Tension**  
  - **All-Affected Principle (AAP)**: Those significantly impacted by a decision should vote.  
  - **All-Subjected Principle (ASP)**: Those bound by the coercive authority of the polity should vote.  
  - **Membership Principle (MP)**: Voting rights derive from formal citizenship or pre-political belonging.  
  - **Territorial Jurisdiction (TJ)**: Voting rights extend to all residents within a polity’s territory, regardless of nationality.  
  *Administrative path dependence*—reusing existing electoral registers—emerges as a key driver, often overriding principled consistency.  

  ---

  ### Case Study Analysis  
  #### **Scotland 2014 Referendum: "Resident Demos"**  
  1. **Resident-based franchise (local govt register)**  
     - *Includes*: All residents ≥16 in Scotland (e.g., EU nationals like you).  
     - *Excludes*: Scots living elsewhere in the UK/EU.  
     - **Presupposed conception**: *Territorial jurisdiction defines demos*.  
     - **Principles in tension**: Contradicts MP (excludes non-resident citizens); aligns with TJ and ASP (subject to Scottish laws). AAP is split (excludes Scots affected by independence).  
     - **Verdict**: *Defensible* under TJ/ASP but *unstable* for AAP due to exclusion of non-resident Scots.  

  2. **Voting age 16+**  
     - *Includes*: 16–17-year-old residents.  
     - *Excludes*: 15-year-olds.  
     - **Presupposed conception**: *Competence/residence over age*.  
     - **Principles in tension**: Silent on AAP/ASP/MP; TJ justifies via residency.  
     - **Verdict**: *Arbitrary*—age threshold lacks clear principle.  

  3. **Exclusion of non-resident Scots**  
     - *Excludes*: Scots in England/Gibraltar.  
     - **Presupposed conception**: *Demos as territorial, not ethnic*.  
     - **Principles in tension**: Violates AAP (Scots affected but excluded); aligns with TJ.  
     - **Verdict**: *Unstable*—AAP demands broader inclusion.  

  #### **UK 2016 Referendum: "Legacy Demos"**  
  4. **Parliamentary register reuse**  
     - *Includes*: UK/Irish/Commonwealth citizens in UK; *Excludes*: EU nationals (like you).  
     - **Presupposed conception**: *Imperial-historical membership*.  
     - **Principles in tension**: Contradicts AAP/ASP (excludes residents subject to laws); aligns with MP.  
     - **Verdict**: *Incoherent*—privileges historical ties over residency.  

  5. **Commonwealth/Irish inclusion**  
     - *Includes*: Maltese/Cypriot/Irish residents.  
     - *Excludes*: Spanish/French residents.  
     - **Presupposed conception**: *Commonwealth as extended citizenship*.  
     - **Principles in tension**: Violates TJ/AAP (arbitrary residency inclusion); aligns with MP.  
     - **Verdict**: *Arbitrary*—no coherent link to affectedness/subjection.  

  6. **15-year rule for expats**  
     - *Includes*: Expats <15 years abroad; *Excludes*: Expats >15 years abroad.  
     - **Presupposed conception**: *Membership degrades with absence*.  
     - **Principles in tension**: Silent on ASP/TJ; violates AAP (long-term expats affected).  
     - **Verdict**: *Arbitrary*—time cutoff lacks justification.  

  7. **Lords’ inclusion**  
     - *Includes*: Hereditary/appointed peers.  
     - **Presupposed conception**: *Parliamentary supremacy*.  
     - **Principles in tension**: Violates ASP (Lords not subject to full laws); MP prioritizes status over subjection.  
     - **Verdict**: *Incoherent*—contradicts democratic equality.  

  8. **Gibraltar inclusion**  
     - *Includes*: Gibraltarians (UK nationals).  
     - *Excludes*: Other overseas territories (e.g., Falklands).  
     - **Presupposed conception**: *Colonial continuity*.  
     - **Principles in tension**: Partial TJ (limited to one territory); violates AAP (other territories affected).  
     - **Verdict**: *Arbitrary*—historical accident, not principle.  

  ---

  ### Theoretical Implications  
  1. **Path Dependence as Primary Driver**:  
     - The franchises were *overwhelmingly shaped by administrative reuse*: Holyrood used local registers (emphasizing residency), Westminster used parliamentary registers (emphasizing imperial legacy). This rescues *practicality* but condemns the system as *incoherent*—boundaries drawn for convenience lack democratic legitimacy.  

  2. **Your Case: Incompatible Conceptions in 21 Months**:  
     - Your inclusion in 2014 rested on **TJ** (territorial residency). Exclusion in 2016 relied on **MP** (formal citizenship). No single principle explains both; the shift reveals *ad-hoc* boundary-setting.  

  3. **Regress Objection and Westminster’s Role**:  
     - Westminster’s authority to set both franchises confirms the **regress objection**: Boundaries are imposed by pre-existing power (the UK demos), not democratic principle. Holyrood’s 2014 franchise was *delegated*, exposing the circularity: "The people" are defined by those already in power.  

  4. **Advisory vs. Decisive Votes**:  
     - The 2016 vote’s advisory status *should* have expanded the franchise under **AAP** (broader consultation). Instead, it used a restrictive register, prioritizing **MP**. This highlights mismatched scope: Consultation ignored affected residents, while a "decision" (2014) included them.  

  5. **Settled Status as Boundary Reproduction**:  
     - Settled status remedies exclusion *administratively* but enacts a **fresh boundary problem**: It creates a tiered membership (settled vs. citizen) under **MP**, failing to resolve the core tension—rights derived from state discretion, not subjection or affectedness.  

  ---

  ### Structured Summary  

  | episode       | rule                            | includes_excludes                                       | presupposed_conception        | principles_in_tension          | verdict              | justification                                                                 |
  |---------------|---------------------------------|---------------------------------------------------------|-------------------------------|--------------------------------|----------------------|-------------------------------------------------------------------------------|
  | Scotland 2014 | Resident-based franchise        | Includes EU residents; excludes non-resident Scots      | Territorial jurisdiction      | MP vs. TJ/ASP                  | **Defensible**       | TJ/ASP justify residency focus, though MP conflicts.                         |
  | Scotland 2014 | Voting age 16+                  | Includes 16–17yo residents; excludes 15yo              | Competence over age           | Silent on AAP/ASP/MP           | **Arbitrary**        | Age cutoff lacks principled anchor.                                          |
  | Scotland 2014 | Excludes non-resident Scots     | Excludes Scots in England/Gibraltar                     | Demos as territorial           | AAP vs. TJ                     | **Unstable**         | AAP demands inclusion of affected non-residents.                             |
  | UK 2016       | Parliamentary register reuse    | Includes UK/Commonwealth; excludes EU residents         | Imperial-historical membership | AAP/ASP vs. MP                 | **Incoherent**       | Privileges historical ties over residency/subjection.                        |
  | UK 2016       | Commonwealth/Irish inclusion    | Includes Maltese/Cypriot/Irish; excludes other EU       | Commonwealth as citizenship   | TJ/AAP vs. MP                  | **Arbitrary**        | Selects residents by colonial legacy, not principle.                         |
  | UK 2016       | 15-year rule for expats         | Includes expats <15y abroad; excludes >15y             | Membership degrades with time | AAP vs. MP                     | **Arbitrary**        | Time threshold unsupported by affectedness/subjection.                       |
  | UK 2016       | Lords’ inclusion                | Includes hereditary/appointed peers                    | Parliamentary supremacy       | ASP vs. MP                     | **Incoherent**       | Lords enjoy legislative privilege without equal subjection.                   |
  | UK 2016       | Gibraltar inclusion             | Includes Gibraltarians; excludes other territories      | Colonial continuity           | AAP vs. TJ (partial)           | **Arbitrary**        | Inconsistent application to one territory.                                   |

  ### Conclusion  
  The franchises reflect **administrative path dependence overriding principle**, producing incoherence: You could vote on dissolving a state but not on dissolving your supranational citizenship. Path dependence condemns the practice as *arbitrary*, not rescued by democratic theory. The regress objection stands unchallenged—Westminster’s authority to define boundaries exposes democracy’s foundational paradox. Your case epitomizes this: Two incompatible conceptions of the demos operated within 21 months, revealing a system that instrumentalizes membership rules pragmatically, not philosophically. Settled status mitigates exclusion but perpetuates the boundary problem by creating new tiers of belonging.
