prompt: |-
  I've just been seated on the collections ethics committee of a mid-sized ethnographic museum — around sixty thousand objects, three curators, one provenance researcher on a fraction of a post, and a public funder whose next grant cycle requires both guaranteed public access and a written restitution policy we can actually apply. Our first meeting made clear that we don't disagree about cases so much as we disagree about what counts as a reason. The director keeps invoking the welfare of visitors; the curator of African collections says the only question that matters is how an object left its place of origin; the head of conservation says we are both ignoring the fact that some claimant institutions cannot hold metalwork at stable humidity; and I left convinced that all three of us were stating positions rather than criteria. Before we draft anything, I want the specification. What must an adequate normative theory of the restitution of colonial-era collections deliver in order to be usable by an institution like ours? Please write the desiderata as a numbered list — no more than nine items, and cut anything that sounds elevated but does no work — giving for each the case or consideration that motivates it, a tag saying whether it is non-negotiable, merely negotiable, or actually a camp commitment disguised as a criterion, and a sentence on what a theory that fails it looks like when a small staff has to apply it on a Tuesday.

  I'd like the list built against our own material rather than the two famous ones everyone reaches for, so here are six composites from our files, anonymized and simplified: a carved throne bought in 1898 from a regional ruler at a price everyone at the time thought fair, four months after a punitive expedition had burned his capital, with account books in our archive showing the money went to ransoming hostages; a set of regalia taken by force in 1897, sold at auction in 1954, and bequeathed to us in 1991 by a collector who apparently never knew how it had left, now claimed simultaneously by a national museum, by a traditional council insisting the objects belong to an office and can only be held by its current occupant, and by a diaspora association in our own city arguing they should stay where they are; a bundle of ritual objects the claimant community asks us not to photograph, display, catalogue online, or describe in print, under a funding agreement that requires public access and with our own scholars warning that an object nobody can see drops out of the historical record; an object taken by one regional polity from another in the 1860s and then by Europeans in the 1890s, now claimed by the successor state of the intermediate polity, which was itself an imperial power in that region; some four thousand everyday objects whose acquisition records say only "purchased," or nothing at all; and one object that nobody claims, whose makers left no written record and no identifiable descendant community.

  Then tell me whether any subset of your desiderata is jointly unsatisfiable. I suspect the demand that past transactions be judged by norms available at the time, the demand that colonial legality not function as a shield, and the demand that our decisions be predictable enough for a three-curator staff to apply cannot all be met; if there is an impossibility there, I want it stated as the headline result rather than buried in a caveat, and I want to know which requirement has to go. Commit also to the single requirement that knocks out the most otherwise respectable views, and say why it does the most work. Finish with a short scorecard — a couple of sentences each, a table is fine — on how the corrective-justice and property account, the state-succession and legalist account, the custodial-welfare account on which collections belong to humanity wherever they are best held, and the account on which sacred objects are not property at all but persons-in-relations do against your list. Keep the scorecard brief: the weight belongs on the criteria.

  I want a position, not a menu. Tell me plainly which of the things people demand of a restitution theory are genuine requirements and which are retentionist or repatriationist prejudices wearing the costume of criteria — including the popular appeal to the joint statement by the directors of several large encyclopedic museums defending their holdings as belonging to all humanity, which I suspect is a claimant to be evaluated rather than a criterion, but which our director treats as one. If you think one of my composites is misdescribed — that the ransom-money throne is not a hard case at all, say, or that the unclaimed object is really a question about custody rather than about justice — say so and argue it rather than quietly accommodating it. Don't hedge with "it depends on your values," and don't quote: if you want to gesture at what a thinker or an institution has said, paraphrase it, since I'd rather check sources myself. Aim for something in the region of fifteen hundred words.
reasoning: |-
  Okay, this is a complex and urgent request from someone newly seated on an ethics committee for a mid-sized ethnographic museum. They're grappling with fundamental disagreements about restitution criteria and need practical, actionable guidance. The user clearly values precision over platitudes - they've even provided six anonymized case studies to ground the discussion. 

  First, I need to parse their core question: what must a usable restitution theory deliver? They want no-nonsense desiderata numbered under nine items, each with a real-world case reference and a negotiability rating. The examples they provided are gold - especially the throne bought with ransom money and the contested regalia. Those will anchor the criteria in concrete dilemmas rather than abstract principles.

  Hmm... their suspicion about incompatible demands is crucial. The tension between historical context, colonial illegitimacy, and practicality does seem logically irreconcilable. I'll need to state that upfront as they requested - probably as a headline impossibility result. The "predictable application" criterion might be the one to sacrifice, however painful that is for a small staff.

  The scorecard comparing theoretical approaches should stay lean - maybe just four columns for the main frameworks (corrective justice, legalist, custodial, relational) with brutal honesty about where each fails. That custodial "humanity's heritage" argument gets misused as a shield so often - better call that out as a claimant position rather than a criterion.

  For the throne case... is it really straightforward? The user might be underestimating how the punitive expedition context contaminates the "fair purchase" narrative. And that unclaimed object - they're right that it's about custody, but the justice angle still matters for procedural fairness. Should push back gently there.

  Most importantly, this can't end with options. They want a position. So after laying out criteria, I'll need to say plainly which demands are substantive (like provenance clarity) versus ideological (like "visitor welfare" as primary). The director's "humanity's heritage" stance deserves particular scrutiny - it's often retentionism in glittering robes.

  Word count is tight for all this. The desiderata will eat most space, but the impossibility result and scorecard can't get shortchanged. Maybe sacrifice some case elaboration to preserve the theoretical clarity. After all, they'll follow up on sources themselves - just need to signpost clearly.
answer: |-
  Here is a specification of desiderata for a usable restitution theory, grounded in your composites, followed by the requested analysis:

  **Nine Desiderata for a Usable Restitution Theory:**

  1.  **Historical Provenance Clarity:** The theory must provide a method to assess *how* an object left its originating community/society, including the role of coercion, duress, fraud, or imbalance of power, even within historically complex contexts. (Motivated by: **Throne (1898 purchase post-expedition), Regalia (taken by force 1897)**. Non-negotiable. Failure: Staff spends Tuesday endlessly debating whether the punitive expedition invalidates the "fair price" for the throne or if the 1954 auction "cleansed" the forced taking of the regalia, with no resolution framework.)

  2.  **Treatment of Colonial Legality:** The theory must explicitly address whether colonial-era legal frameworks governing acquisition are *per se* illegitimate or subject to ethical override, without automatically sanctifying or dismissing them. (Motivated by: All composites involving colonial-era takings, especially **Regalia, Throne, Successor State Object**. Non-negotiable. Failure: Staff either defaults to "it was legal then" as a shield for the throne/regalia/successor state object, or feels compelled to dismiss *all* colonial-era legal transfers regardless of context, creating chaos.)

  3.  **Defined Notion of "Legitimate Claimant":** The theory must define criteria for identifying who has standing to claim (e.g., direct descendant community, recognized political successor, cultural/spiritual lineage holders) and a method to adjudicate between competing claims. (Motivated by: **Regalia (3 claimants), Successor State Object (intermediate imperial power)**. Non-negotiable. Failure: On Tuesday, staff is paralyzed by the regalia claim – unable to decide between the national museum, the traditional office holder, or the diaspora group, or determine if the successor state is a legitimate heir or a later colonizer itself.)

  4.  **Resolution of Access vs. Restriction Conflicts:** The theory must offer principles for reconciling restitution with obligations for public access, research, and preservation, especially when claimant restrictions conflict with institutional mandates or resource constraints. (Motivated by: **Restricted Ritual Bundle**. Non-negotiable. Failure: Staff cannot decide whether to return the ritual bundle knowing it vanishes from public view/research, violating their funding agreement and scholarly mission, or keep it violating claimant wishes – leading to stalemate or unethical compromises.)

  5.  **Practical Applicability to Ambiguous Provenance:** The theory must provide actionable guidance for objects with minimal or no provenance information, beyond "purchased" or unknown. (Motivated by: **4,000 Everyday Objects**. Non-negotiable. Failure: Staff cannot even begin processing the vast bulk of the collection on Tuesday; the theory only works for high-profile, well-documented cases, leaving thousands in limbo.)

  6.  **Procedure for Unclaimed Objects:** The theory must establish a clear ethical protocol for objects with no identifiable claimants or descendant communities. (Motivated by: **Unclaimed Object**. Negotiable (specifics can vary, but *having* a protocol is non-negotiable). Failure: Staff has no idea what to *do* with the unclaimed object on Tuesday – keep it forever? Seek broader claimants? Destruct? – leading to inconsistent or neglectful handling.)

  7.  **Practical Feasibility & Resource Sensitivity:** The theory must acknowledge and provide manageable processes for institutions with limited staff, time, and expertise. It cannot require endless, open-ended research or negotiations as a default. (Motivated by: **All composites, given small staff (3 curators, fractional researcher)**. Non-negotiable. Failure: Staff is overwhelmed on Tuesday trying to apply an idealistic theory requiring deep provenance dives for every "purchased" pot or negotiating endlessly with multiple regalia claimants; progress halts.)

  8.  **Transparent Prioritization Framework:** The theory must enable the committee to establish clear, defensible priorities for processing claims/research (e.g., severity of taking, cultural significance, claimant readiness, feasibility). (Motivated by: **All composites, especially resource constraints**. Non-negotiable. Failure: Staff spends Tuesday arguing whether the throne or the regalia is "more important" to address first, or whether the restricted bundle trumps both, with no shared logic.)

  9.  **Distinction Between Core Principles & Contingent Factors:** The theory must clearly separate fundamental ethical principles governing restitution (e.g., redress for injustice) from contingent practical considerations (e.g., conservation capacity, current location of diaspora). The latter can *implement* but should not *define* the core principle. (Motivated by: **Conservation Concerns (metalwork stability), Diaspora Claims (regalia), "Visitor Welfare" (Director)**. Non-negotiable. Failure: On Tuesday, Conservation vetoes return of metalwork due to humidity, or the Director blocks the regalia return because diaspora visitors like seeing it here, effectively making practicalities the primary ethical criterion – a camp commitment disguised as practicality.)

  **The Impossibility Result:**

  **Headline:** **The demand for judgments based solely on historical norms contemporaneous with acquisition, the demand to categorically reject colonial legality as a shield, and the demand for predictable, easily applicable processes by a small staff are jointly unsatisfiable.**

  *   **Why:** Judging solely by past norms (Desideratum 2 embedded) often legitimizes colonial takings deemed "legal" then. Categorically rejecting colonial legality is essential for justice (Desideratum 2 core). However, applying this rejection consistently requires complex, context-specific historical and ethical analysis for *every* colonial-era object – a process inherently unpredictable, time-consuming, and resource-intensive, directly violating Desideratum 7 (Feasibility) and hindering Desideratum 8 (Prioritization). A small staff cannot reliably, predictably, and efficiently apply a nuanced historical/ethical rejection of colonial legality across thousands of objects. **The requirement that must be relaxed is the expectation of perfectly predictable, simple, and resource-light application (a strict interpretation of Desideratum 7).** Accepting that just restitution is often complex and demanding is necessary.

  **The Knock-Out Requirement:**

  **Desideratum 9 (Distinction Between Core Principles & Contingent Factors)** does the most work in disqualifying otherwise respectable views.

  *   **Why:** It exposes when contingent factors are elevated to principle. It knocks out:
      *   **"Custodial-Welfare" Views:** These often make conservation capacity ("best held") or visitor access ("welfare," "belonging to humanity") the *core* principle, rather than contingent factors subordinate to justice. (Fails 9).
      *   **Overly Strict Legalist Views:** If colonial legality is treated as an inviolable *core principle* rather than a contingent historical fact subject to ethical scrutiny, it fails 9 (and 2).
      *   **Retentionist Appeals to "Humanity's Heritage":** As suspected, this is usually a camp commitment disguised as a universal criterion. It elevates a contingent factor (current location/access) to a core principle overriding justice claims, failing 9. It's a claimant position, not a criterion.
      *   **Repatriationist Views Ignoring Feasibility:** While justice is core, views that completely dismiss practical conservation or safety concerns *as implementation factors* also struggle with the nuanced separation 9 requires, potentially making return an absolute regardless of consequence.

  **Theoretical Scorecard:**

  | Theory                              | Key Tenet                                                                 | Major Deficits Against Desiderata                                                                                                |
  | :---------------------------------- | :------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------------------- |
  | **Corrective Justice/Property**     | Focuses on rectifying historical wrongs (theft, duress). Ownership follows justice. | Struggles with **4 (Access/Restriction)**, **5/6 (Ambiguous/Unclaimed)**, **7 (Feasibility)**. Can be rigid on **3 (Claimants)**. |
  | **State Succession/Legalist**       | Relies on current international law, state sovereignty, historical legality. | Fails **2 (Colonial Legitimacy)**, often fails **3 (Traditional/Diaspora Claimants)**, struggles with **1 (Coercion nuance)**.  |
  | **Custodial-Welfare**               | Prioritizes preservation, access, "humanity's heritage" over origin.      | Fails **9 (Elevates Contingency)**, fails **2 (Ignores Injustice)**, fails **4 (Dismisses Restrictions)**, weak on **1/3**.      |
  | **Sacred/Relational (Non-Property)**| Objects are inalienable, non-property; rights tied to ongoing relationship/custody. | Strong on **1/2/3 for sacred items**; Fails **4 (Access Conflict)**, struggles with **5/6/7 (Scaling, Ambiguity, Feasibility)**. |

  **Position on Genuine Requirements vs. Disguised Prejudices:**

  *   **Genuine Requirements (Non-Negotiable Desiderata):** 1 (Provenance Clarity), 2 (Treatment of Colonial Legality), 3 (Defined Claimant), 4 (Access/Restriction Resolution), 5 (Ambiguous Provenance), 7 (Feasibility - *though complexity must be accepted*), 8 (Prioritization), 9 (Core vs. Contingent). These address fundamental justice, practical operation, and clear decision-making.
  *   **Disguised Prejudices:**
      *   **"Visitor Welfare" as Primary (Director):** A retentionist prejudice elevating a contingent benefit (current display) to a core principle overriding justice (Fails 9).
      *   **"Belonging to Humanity / Encyclopedic Argument":** A retentionist prejudice disguised as a universal criterion. It's a *claim* about value distribution, not an ethical basis for denying restitution claims grounded in specific injustice (Fails 2, 9).
      *   **"Only How it Left Matters" (Curator of African Collections):** While crucial (Desideratum 1), as a *sole* criterion, it oversimplifies. It ignores Desideratum 3 (competing claimants), 4 (post-return obligations), 5/6 (ambiguous/unclaimed), and 7/8 (practical application). It risks being repatriationist absolutism.
      *   **"Conservation Capacity as Veto" (Conservation):** Elevates a contingent factor (current institutional capability) to a core principle, potentially blocking just returns (Fails 9). (It *is* a vital factor for *implementation* once return is deemed just).
      *   **"Diaspora Access Trumps Origin" (Regalia Claimant):** Elevates a contingent factor (location/diaspora access) over the core principle of justice and/or the rights of the originating community/culture (Fails 9, potentially Fails 3).

  **On Your Composites:**

  1.  **The Ransom-Money Throne:** This **is** a hard case. Framing it as "fair price" ignores the context of duress (punitive expedition). The ransom use complicates but doesn't negate the power imbalance. The core question remains: was the ruler truly free to sell? The money's destination is secondary to the conditions of the sale. Desiderata 1 & 2 are paramount here.
  2.  **The Unclaimed Object:** You are partially right; it's primarily about **custody** (Desideratum 6) *once justice claims are exhausted*. However, "exhaustion" requires a demonstrably rigorous effort to find claimants, guided by principles from Desideratum 3 & 5. It's not *just* custody; it's custody as the outcome of a just *process* for unclaimable objects. Justice informs the process leading to the custody decision.

  **Conclusion:**

  A usable theory must center **corrective justice** (Desiderata 1, 2, 9 core) as the primary driver, explicitly rejecting colonial legality as a shield. It must provide **practical frameworks** for identifying claimants (3), resolving conflicts (4, 8), handling ambiguity (5, 6), and managing resources (7, 8), accepting that just outcomes require effort. Crucially, it must **demote contingent factors** like current location, visitor access, or conservation capacity (when used as shields) to implementation considerations *subordinate* to justice (9). Reject theories, like the custodial-welfare or absolutist legalist views, that elevate these contingencies to core principles. The director's appeal to "humanity's heritage" is precisely such a retentionist contingency masquerading as principle; evaluate claims based on the injustice of acquisition and the legitimacy of the claimant, not the preferences of the current holder or its audience. Expect complexity, prioritize rigorously, and distinguish fundamental ethics from practical constraints.
