prompt: |-
  Our institution maintains a standing panel, the Evidential Standards Panel, whose only job is to decide whether a proposed justification may be admitted when the evidence offered for a procedure's accuracy is drawn from that procedure's own outputs. We do not rule on what is true; we rule on what counts as an admissible showing. Our charter states no general principle. What it contains instead is two decades of case notes, and I have been handed the six most recent as the working record for my first term as chair.

  1. Weighbridge. A freight yard sought to certify a truck scale by re-weighing a set of reference loads and observing that the readings matched the loads' recorded weights. The recorded weights had been entered at commissioning from that same scale's readings. A customer had disputed a ticket the previous quarter. We refused to admit the report. Note: the comparison presupposed what it was offered to establish.

  2. Cold-room thermometer. A laboratory sought to certify a logging thermometer against a reference standard traceable to a national metrology institute. A maintenance technician had earlier remarked that the unit might be drifting. We admitted the certification. Note: the standard was fixed without reference to the instrument it was used to check.

  3. Duplicate assays. A quality-control lab proposed to certify a reagent's potency by running the same assay in duplicate on the same instrument and setting its acceptance threshold from the spread of those duplicates. A technician had flagged possible drift in that instrument. We refused. Note: repetition is not verification.

  4. Field identification. A conservation unit asked whether a surveyor's unaided species identifications could be treated as established facts for planning purposes, where no independent verification was obtainable and no one had questioned her record. We admitted the identifications as facts, while expressly declining to treat that admission as certifying her reliability as an identifier.

  5. Fuel gauges. After two units were replaced under warranty, a fleet manager asked whether the new gauges could be trusted. An operator submitted a reliability report constructed by treating each individual reading over one season as a small confirmation that the gauge was accurate, then pooling the confirmations. No independent check was available. We refused. Note: many weak instances of the same move do not compose into a strong one.

  6. Image-reading assist. After a missed finding prompted an internal review, a clinic proposed to certify a computer-aided detection system by having a second reader re-read a sampled subset of images. The subset was drawn using the system's own confidence ranking, and the second reader had completed a training course whose exemplars were annotated by that system. We refused. Note: the auditor had absorbed the audited system's habits.

  The matter now before us is this. A university-wide office uses an automated essay-scoring system, which I will call G, to produce grades for a large first-year writing requirement. A parents' association has filed a complaint alleging that G systematically under-scores essays by students writing in English as an additional language. The office proposes to answer the complaint by certifying G with an audit module, A: a different vendor, a different architecture, built without access to G's code, weights, or training data. A will re-score a stratified random sample of two thousand essays, and agreement between A and G will be reported as G's accuracy. The office reports overall agreement of 94 percent; it has not reported agreement within the complainant subgroup.

  Two features emerged in discovery. First, A's scoring rubric was calibrated on a legacy corpus of essays for which the only available scores were G's, and the human raters who adjudicated A's calibration set were trained on exemplars that G had scored. That legacy corpus predates the current student population, comes from other institutions, and contains no essays by the complainant subgroup. Whether rubric calibration on G's outputs would carry over any subgroup-specific distortion in G, as against merely importing G's general stylistic preferences, is contested and, so far as we can tell, unsettled by the evidence before us. Second, the office intends the resulting certificate to establish two things at once: that G meets the accuracy threshold in our charter, and that this year's individual grades are correct.

  I would like your analysis of the following.

  (a) Reconstruct the candidate rules our record could be expressing. Give at least three, and state each one so that it could be applied mechanically to a new fact pattern rather than as a slogan. Candidate formulations might key on the provenance of the checking standard, on whether live doubt exists, on whether the errors of the checking procedure are correlated with those of the procedure checked, or on whether a failure of certification also undermines the first-order outputs; you may propose others, and you should say which formulations the record already rules out and which precedent rules them out.

  (b) For each surviving rule, state the verdict it yields on the essay-scoring matter, and identify the feature of the new case that the verdict turns on. Where the record leaves a rule's parameters open, say so explicitly and give the verdict under each plausible setting. In particular, address how far up the chain a provenance-based rule must trace contamination before it bites, and whether our record fixes that distance.

  (c) Give me your best prediction of what this panel will actually decide, and separately your recommendation as to what it should decide if it wants to be consistent with its own case notes. Identify the closest analog among the six precedents and the most important respects in which the analogy fails. If the honest answer is that our record underdetermines the matter, say what principle the panel would be adopting by ruling either way, including by issuing a split verdict that admits the individual grades while refusing the certificate.

  (d) Describe one further case, concrete enough to go on next quarter's agenda, that would most sharply discriminate among your leading candidate rules. Say which rules it separates and what each predicts about it.

  Please do not cite or recommend sources; we want the reasoning, not a bibliography. Write your response in American English.
reasoning: |-
  Hmm, I need to tackle this complex query from the Evidential Standards Panel chair. The user presents six precedents about when evidence based on a procedure's own outputs is admissible, and asks for analysis of a new case involving an automated essay-scoring system. This seems like a sophisticated test of analytical reasoning applied to institutional decision-making.

  Breaking this down, I see four main tasks: (a) reconstruct candidate rules from precedents, (b) apply them to the new case, (c) predict and recommend a decision, and (d) propose a discriminating new case. The precedents form a pattern about evidence circularity - like Weighbridge where self-referential certification failed, versus Cold-room thermometer where independent verification passed.

  For task (a), I'm considering at least three rule formulations. First, a provenance rule focusing on whether the checking standard's origin is independent of the audited system - Weighbridge and Fuel gauges illustrate contamination, while Cold-room thermometer shows independence. Second, a doubt-resolution rule seen in Field identification where no active doubt existed versus Duplicate assays where drift was suspected. Third, an error-correlation rule implied by Image-reading assist where the auditor absorbed the audited system's biases.

  The record clearly rules out some approaches. For example, a "repetition equals verification" rule is invalidated by Duplicate assays' "repetition is not verification" note. Fuel gauges rejects "aggregating weak evidence strengthens it" and Weighridge counters "self-consistency implies correctness."

  For task (b), applying these to the essay-scoring case: The provenance rule likely fails because A's rubric was calibrated on G's outputs and human raters trained on G-scored exemplars - classic contamination. The doubt-resolution rule might admit since no specific doubt about G's subgroup bias was raised before the complaint, but the complaint now creates doubt. Error-correlation strongly suggests refusal because A's training likely correlates its errors with G's, especially for the subgroup in question.

  Notably, the record doesn't specify how far provenance tracing must go - just that some independence is required. Even partial contamination like in Image-reading assist was sufficient for refusal.

  For task (c), I predict the panel will refuse certification based on Image-reading assist being the closest precedent, though imperfect because here the human raters add another layer of potential bias. My recommendation is to refuse the accuracy certification but potentially admit individual grades if separated - mirroring Field identification's distinction between accepting specific outputs versus certifying reliability. This would maintain consistency.

  For task (d), I'll design a new case about AI-generated medical diagnoses to discriminate between rules - one where an independent validator uses the audited system's outputs for training. This would test whether provenance rules require complete independence or tolerate some removed dependence, and how doubt-resolution handles newly discovered risks.

  Throughout this, I need to maintain strict focus on the precedents without external references, and ensure all formulations are mechanical enough for application to new cases. The reasoning should demonstrate how each precedent contributes to the emerging principles while acknowledging where ambiguity remains.
answer: |-
  ### (a) Candidate Rules from Precedents  
  The record suggests at least three mechanical rules, while explicitly ruling out others:  

  **Rule 1 (Provenance Independence):**  
  *A showing is inadmissible if the standard used for verification derives any critical element of its authority from the outputs of the procedure being checked.*  
  - **Supported by:** Cold-room thermometer (admitted; standard traceable to external source), Weighbridge (refused; standard built on same scale’s outputs), Image-reading assist (refused; auditor trained on audited system’s outputs).  
  - **Ruled out:** Any rule allowing standards built *exclusively* on the audited procedure’s outputs (Weighbridge, Fuel gauges).  

  **Rule 2 (Doubt-Resolution Scope):**  
  *A showing is inadmissible if it purports to resolve live doubt about a specific flaw by using a method whose reliability on that flaw is contested or untested.*  
  - **Supported by:** Field identification (admitted; no prior doubt about *specific* error), Duplicate assays (refused; drift suspected but method ignored it), Fuel gauges (refused; method ignored systemic error risk).  
  - **Ruled out:** Rules requiring only aggregate consistency (Fuel gauges: "many weak instances" rejected) or ignoring context of doubt (Duplicate assays).  

  **Rule 3 (Error Non-Correlation):**  
  *A showing is inadmissible if the verification procedure’s errors are likely correlated with those of the audited procedure for the attribute in question.*  
  - **Supported by:** Image-reading assist (refused; auditor "absorbed habits" of audited system), Weighbridge (refused; self-referential loop).  
  - **Ruled out:** Rules assuming independence from procedural differences alone (Cold-room thermometer allowed despite shared physical environment).  

  **Explicitly Ruled-Out Formulations:**  
  - "Repetition suffices for verification" (Duplicate assays).  
  - "Self-consistency implies correctness" (Weighbridge).  
  - "Aggregated weak confirmations strengthen proof" (Fuel gauges).  

  ---

  ### (b) Application to Essay-Scoring Case  
  **Rule 1 (Provenance Independence):**  
  - **Verdict:** **Refuse certification.**  
  - **Key Feature:** A’s rubric was calibrated on G’s outputs, and human raters were trained on G-scored exemplars. This creates dependence analogous to Image-reading assist (auditor trained on audited system’s outputs).  
  - **Open Parameter:** The record does not fix how far "derivation" must extend. Here, A’s scoring logic is contaminated at the rubric-design level (like Image-reading assist), which suffices. If only *direct* output reuse were fatal, Cold-room thermometer might suggest admissibility—but Image-reading assist establishes indirect dependence (training data) as sufficient.  

  **Rule 2 (Doubt-Resolution Scope):**  
  - **Verdict:** **Refuse certification.**  
  - **Key Feature:** The complaint alleges *subgroup-specific* bias, but A’s calibration used no essays from this subgroup and G’s scores. The method cannot resolve doubt about subgroup bias (like Duplicate assays failing to address drift).  
  - **Open Parameter:** If no subgroup complaint existed (e.g., general accuracy only), Field identification might apply. Here, live doubt exists and is unaddressed.  

  **Rule 3 (Error Non-Correlation):**  
  - **Verdict:** **Refuse certification.**  
  - **Key Feature:** A’s training on G’s outputs risks correlating errors for the subgroup in question (e.g., if G underpredicts non-native essays, A may inherit this via calibration). Mirrors Image-reading assist’s "absorbed habits" concern.  
  - **Open Parameter:** Record does not define "likelihood" threshold. Image-reading assist treated *risk* of correlation as sufficient; here, contested distortion is plausible.  

  ---

  ### (c) Prediction, Recommendation & Analogy  
  **Prediction:** The panel will **refuse certification** 5–1, citing Image-reading assist as controlling. The majority will emphasize A’s dependence on G’s outputs for calibration.  

  **Recommendation:** Refuse certification but **admit individual grades** as provisional facts (mirroring Field identification). Consistency requires:  
  - Refusing certification because A’s provenance is contaminated (Rules 1/3) and subgroup doubt is unaddressed (Rule 2).  
  - Admitting grades as *de facto* outputs (like Field identification’s identifications) since no evidence impeaches *specific* grades, and our charter avoids truth rulings.  

  **Closest Analog:** **Image-reading assist** (refused).  
  - **Similarities:** Auditor (A) trained on audited system’s (G) outputs; contamination via "habits."  
  - **Key Difference:** Image-reading assist involved *direct* feedback (annotations used in training), while here contamination is through rubric calibration. Precedent’s logic ("absorbed habits") extends to this indirect path.  

  **Underdetermination Note:** If the panel splits (certification refused, grades admitted), it adopts Field identification’s principle: *outputs may be used as operational facts without certifying the system’s reliability*.  

  ---

  ### (d) Discriminating New Case  
  **Case: AI Credit Scoring Audit**  
  A bank uses AI system "C" to approve loans. After allegations of age bias, it hires auditor "D" (different vendor, no code access). D tests C by approving/rejecting 10,000 past applications. D’s decision thresholds were set using C’s historical approval rates as benchmarks.  

  **Why it Discriminates:**  
  - **Rule 1 (Provenance):** Refuses. D’s thresholds derive authority from C’s outputs (like Weighbridge/Image-reading assist).  
  - **Rule 2 (Doubt):** Refuses. Live doubt about age bias exists, but D’s method uses C’s overall rates (untested for bias).  
  - **Rule 3 (Error):** Refuses if age bias correlates in C and D; admits if D’s thresholds are age-blind.  

  **Separation:**  
  - Rules 1/2 always refuse.  
  - Rule 3 admits *only if* D’s thresholds avoid inheriting C’s bias (e.g., D uses C’s approval rates but applies them age-neutrally). This tests whether non-correlation can salvage provenance dependence.  

  ---  
  *Analysis grounded solely in panel precedents, per instructions. No external sources consulted or cited.*
