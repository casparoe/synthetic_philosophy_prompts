prompt: |-
  I am a second-year economics PhD student and I run a small Thursday reading group on social choice; everyone in the room has had the first-year micro sequence and is fluent in von Neumann–Morgenstern utility, but nobody has taken a proper social choice course, so the exposition has fallen to me. Last week I walked them through Harsanyi's aggregation theorem: each individual's preferences over prospects satisfy the vNM axioms, the social preference does too, a Pareto indifference condition holds, and therefore the social utility function is an affine combination of the individual utility functions, with non-negative coefficients once the Pareto condition is strengthened appropriately. The proof took fifteen minutes and everyone found it easy. The discussion afterwards took two hours and went nowhere, because the room split into two camps that could not agree on what had just been shown — one saying the theorem derives utilitarianism from Pareto plus expected utility theory, the other saying it derives nothing of the sort, that it is a bare representation result, and that all the ethical content was smuggled in with the assumptions. Since I have to referee this next week, I want the conceptual issue explained properly. Start by saying precisely what the theorem does and does not deliver. Why are the coefficients not pinned down to anything resembling equal weights, given that each individual utility function is itself only defined up to positive affine transformation, and what has to be added before a claim about equal weights is even meaningful? What work does the choice between Pareto indifference and the stronger condition do — why does it fix the sign of the coefficients but not their magnitude? Then explain what the separate veil-of-ignorance, impartial-observer style argument contributes on top of the representation theorem: which assumption in it does the identification work, whether that assumption concerns beliefs or tastes, and whether it is best read as a normative argument or as an interpretation of what the theorem's coefficients mean. I would also like to know why prioritarianism is usually described as being in tension with the theorem, and whether that tension survives if one declines to read the individual utility functions as measures of well-being rather than as preference representations.

  Second, the part that actually derailed us and the part I understand least well. The theorem is silent about learning: it represents a social ordering over a fixed menu of prospects and says nothing about what the aggregate does when new information arrives. Someone pointed out that the linear pool of the individuals' probability measures is not preserved by conditionalization — pool first and update on a piece of common news, and you generally do not get what you would have got had everyone updated first and you pooled afterwards — whereas the logarithmic pool does commute with updating. I want this worked out rather than asserted. Give a small explicit numerical example: two people, two states of the world, a common utility function over outcomes, differing subjective probabilities; compute the social ranking of two prospects before and after a piece of common news, and show exactly where the two procedures diverge. Then identify the general mechanism. My own algebra suggests that the updated pool is still a weighted average of the individuals' posteriors, but with weights proportional to each person's coefficient times that person's prior probability of the news, so that the aggregate quietly redistributes weight toward whoever found the news less surprising; tell me whether that is right and what it implies. Then say what the logarithmic pool costs: does it still respect unanimity, and can a preference formed by log-pooling the beliefs and summing the utilities still be presented as a Harsanyi-style weighted sum of individual utilities? Finally, the question I actually care about: does this dynamic problem embarrass the utilitarian reading of the theorem in particular, or does it embarrass any reading that treats the aggregate as a single decision maker — should we conclude that the theorem's society is not one agent but a sequence of different agents indexed by the information set?

  A few constraints on the answer. Aim it at people who can do expected utility calculations unaided but have never encountered the opinion-pooling or social-choice literature, so define terms such as Pareto indifference, extended preferences, and the property of commuting with conditionalization (often called external Bayesianism) as you introduce them. No bibliography and no reading list: I cannot chase references, and I want the reasoning rather than the provenance; where both camps in my reading group have a defensible point, locate the disagreement instead of settling it by appeal to authority. Roughly 1,200 to 1,600 words, with the numerical example set out as explicit arithmetic or a small table, and with claims that follow from the mathematics kept visibly separate from claims that are interpretive. End with a single last line beginning "Bottom line:" that states in one sentence which assumption or assumptions supply the specifically utilitarian content that the representation theorem itself does not.
reasoning: |-
  Alright, let's tackle this query step by step. The user is a second-year economics PhD student running a social choice reading group. They've covered Harsanyi's theorem, and now there's a split in interpretation between those seeing it as foundational for utilitarianism and those viewing it as a mere representation theorem. The user needs a clear explanation for their role as referee, addressing conceptual issues, dynamic consistency, and the logarithmic pool example.

  First, I need to clarify what Harsanyi's theorem does and doesn't establish. The key points are that it provides an affine combination of individual utilities under vNM axioms and Pareto conditions, but the weights aren't pinned down equally. The coefficients are non-negative but not specified beyond that. Each individual's utility is unique up to affine transformations, so discussing equal weights requires normalizing the scales, perhaps via a veil of ignorance. 

  Moving to the dynamic inconsistency problem. The user wants a numerical example showing that linear pooling doesn't commute with conditionalization. I'll set up a simple case: two individuals with different priors on two states, a common utility function, and an observation that updates their beliefs. Calculating the social rankings for two prospects pre- and post-news under both update-then-pool and pool-then-update methods will show divergence. The weights shift based on how surprising the evidence was to each individual, which has implications for redistributive effects over time. 

  The logarithmic pool (geometric mean) does commute with updating but breaks linear aggregation of utilities. I need to show that while it preserves external Bayesianism, it doesn't satisfy the Pareto condition since multiplying utilities isn't additive. This means Harsanyi's utilitarian form isn't maintained. 

  The user also asked if this dynamic issue undermines utilitarianism specifically or any single-agent model. The problem arises from treating society as a static agent; updating reveals that the aggregate isn't a consistent DM over time. This challenges any reading that assumes a unified agent but is especially problematic for utilitarianism if the weights change based on evidence. 

  Lastly, prioritarianism's tension with Harsanyi comes from using a concave transformation of utilities, violating linear aggregation. Even if utilities represent preferences, not well-being, the affine combination requirement conflicts with any nonlinear transformation. 

  The bottom line is that the veil of ignorance, particularly the impartial observer's equiprobability assumption, injects egalitarian content by normalizing scales and weighting equally, which the base theorem lacks.
answer: |-
  ### Harsanyi's Aggregation Theorem: What It Does and Doesn't Deliver  
  **The Theorem (Formally):** Given:  
  1. **vNM Rationality:** Each individual and the social planner have preferences over prospects (lotteries) satisfying the von Neumann-Morgenstern axioms.  
  2. **Pareto Indifference:** If all individuals are indifferent between two prospects, society is indifferent.  
  3. **Social vNM:** The social preference satisfies the vNM axioms.  

  *Then* the social utility function \( U_S \) is a **weighted sum** of individual vNM utility functions:  
  \[
  U_S = \sum_{i=1}^n \lambda_i U_i, \quad \lambda_i \geq 0
  \]  
  with \(\lambda_i > 0\) if **Strong Pareto** holds (if one individual strictly prefers \(A\) to \(B\) and none oppose, society prefers \(A\) to \(B\)).

  ---

  ### What the Theorem Delivers (and What It Doesn’t)  
  1. **Bare Representation, Not Utilitarianism:**  
     - The theorem shows that *some* affine aggregation exists, but **does not specify the weights \(\lambda_i\)**. Utilitarianism requires equal weights (\(\lambda_i = \lambda_j \ \forall i,j\)), but nothing in the theorem forces this.  
     - **Why weights aren’t pinned down:** Each \(U_i\) is unique only up to **positive affine transformations** (\(U_i' = a_i U_i + b_i, \ a_i > 0\)). Rescaling an individual’s utility function (\(a_i\)) changes the *effective weight* \(\lambda_i / a_i\) in the social welfare function. To discuss "equal weights," you must first **normalize the scales** of individual utilities.  

  2. **Pareto Conditions Fix Signs, Not Magnitudes:**  
     - **Pareto Indifference** ensures \(\lambda_i \geq 0\). Without it, negative weights could make society anti-align with an individual.  
     - **Strong Pareto** ensures \(\lambda_i > 0\) (no individual is ignored), but still says nothing about *relative magnitudes*. Society could weight Alice 100x more than Bob and satisfy all axioms.  

  3. **The Veil-of-Ignorance Add-On:**  
     - **Setup (Harsanyi/Impartial Observer):** Suppose an observer evaluates social states by imagining they have an **equal chance of being any person**. Their utility for a prospect is the expected utility over identities:  
       \[
       U_S = \frac{1}{n} \sum_{i=1}^n U_i
       \]  
     - **Key Assumption:** Individuals have **extended preferences**—they can rank outcomes not just for themselves, but from behind a "veil" where they don’t know their identity. The observer’s vNM preferences over identity lotteries induce the sum.  
     - **Normative vs. Interpretative:** This is a **normative argument** that *justifies* equal weights by assuming symmetry over identities. It resolves the scaling issue by treating utility as **interpersonally comparable** under the veil.  

  4. **Prioritarianism’s Tension:**  
     - Prioritarianism maximizes \(\sum_i h(U_i)\) where \(h\) is strictly concave (e.g., \(h(u) = \sqrt{u}\)). This violates Harsanyi’s linear aggregation.  
     - **Tension survives even without well-being interpretations:** The theorem requires *affine* aggregation of vNM utility functions representing *preferences*. Any nonlinear transformation of \(U_i\) (like prioritarianism) breaks the affine form, violating the Pareto conditions under vNM rationality.  

  ---

  ### The Dynamic Problem: Linear Pooling vs. Updating  
  **Setup:** Two individuals (A, B), two states (X, Y), common utility \(u(\$X) = 1\), \(u(\$Y) = 0\).  
  - **Priors:**  
    - A: \(P_A(X) = 0.6\), \(P_A(Y) = 0.4\)  
    - B: \(P_B(X) = 0.2\), \(P_B(Y) = 0.8\)  
  - **Social weights:** \(\lambda_A = 0.5\), \(\lambda_B = 0.5\)  
  - **News:** A signal \(Z\) occurs only if \(X\) is true (e.g., \(P(Z|X) = 1\), \(P(Z|Y) = 0\)).  

  #### Two Procedures to Rank Prospects After Seeing \(Z\):  
  1. **Pool Then Update (PTU):**  
     - Social prior: \(P_S(X) = \lambda_A P_A(X) + \lambda_B P_B(X) = 0.5 \times 0.6 + 0.5 \times 0.2 = 0.4\)  
     - Update on \(Z\): \(P_S(X|Z) = \frac{P_S(Z|X)P_S(X)}{P_S(Z)} = \frac{1 \times 0.4}{0.4} = 1.0\)  
     - Social utility for prospect \(\$X\): \(U_S(\$X | Z) = 1.0\)  

  2. **Update Then Pool (UTP):**  
     - Individual posteriors:  
       - A: \(P_A(X|Z) = \frac{1 \times 0.6}{0.6} = 1.0\)  
       - B: \(P_B(X|Z) = \frac{1 \times 0.2}{0.2} = 1.0\)  
     - Pool posteriors: \(P_S'(X|Z) = \lambda_A \times 1.0 + \lambda_B \times 1.0 = 1.0\)  
     - Social utility: \(U_S'(\$X | Z) = 1.0\)  

  **No conflict?** Because \(Z\) is conclusive evidence. Now consider non-conclusive evidence:  
  - **New signal \(W\):** \(P(W|X) = 0.5\), \(P(W|Y) = 1.0\) (e.g., \(W\) occurs always in \(Y\), half the time in \(X\)).  

  #### Ranking Prospects \(\$X\) vs. \(\$Y\) After Seeing \(W\):  
  | **Step**               | **PTU (Pool Then Update)**                          | **UTP (Update Then Pool)**                          |
  |------------------------|-----------------------------------------------------|-----------------------------------------------------|
  | **Social Prior**       | \(P_S(X) = 0.4\)                                    | —                                                   |
  | **Likelihood of W**    | \(P_S(W) = P_S(W\|X)P_S(X) + P_S(W\|Y)P_S(Y) = (0.5)(0.4) + (1)(0.6) = 0.8\) | — |
  | **Posterior**          | \(P_S(X\|W) = \frac{(0.5)(0.4)}{0.8} = 0.25\)       | A: \(P_A(X\|W) = \frac{(0.5)(0.6)}{(0.5)(0.6) + (1)(0.4)} = \frac{0.3}{0.7} \approx 0.429\)<br>B: \(P_B(X\|W) = \frac{(0.5)(0.2)}{(0.5)(0.2) + (1)(0.8)} = \frac{0.1}{0.9} \approx 0.111\)<br>\(P_S'(X\|W) = 0.5 \times 0.429 + 0.5 \times 0.111 = 0.27\) |
  | **U(\$X\|W)**          | \(0.25\)                                            | \(0.27\)                                            |
  | **U(\$Y\|W)**          | \(0\)                                               | \(0\)                                               |
  | **Social Ranking**     | \(\$Y \succ \$X\) (since \(0 > 0.25?\))             | \(\$X \succ \$Y\) (since \(0.27 > 0\))              |

  **Divergence:** PTU ranks \(\$Y\) above \(\$X\); UTP ranks \(\$X\) above \(\$Y\).  

  #### Why This Happens:  
  - **General Mechanism:** PTU’s posterior is a weighted average of individual posteriors, but with **weights rescaled** by each individual’s prior probability of the evidence:  
    \[
    \lambda_i^*(W) = \frac{\lambda_i P_i(W)}{\sum_j \lambda_j P_j(W)}
    \]  
    Here: \(\lambda_A^* \propto 0.5 \times P_A(W) = 0.5 \times 0.7 = 0.35\), \(\lambda_B^* \propto 0.5 \times 0.9 = 0.45\). Effective weight shifts to B (who found \(W\) less surprising).  
  - **Consequence:** Society under PTU becomes more like the individual(s) who anticipated the evidence, redistributing "influence" over time.  

  #### Does Logarithmic Pooling Fix This?  
  - **Logarithmic (Geometric) Pool:** \(P_S(X) \propto P_A(X)^\alpha P_B(X)^{1-\alpha}\)  
  - **External Bayesianism:** Log-pooling **commutes with updating** (if priors are log-pooled, posteriors are log-pooled with same weights).  
  - **Cost 1: Breaks Linearity**  
    Log-pooled beliefs cannot be expressed as \(\sum \lambda_i U_i\) for social utility. For example, if \(U_S = \log P_S(X)\), it is not affine in \(U_i\).  
  - **Cost 2: Violates Strong Pareto**  
    If all individuals agree \(A \succ B\), log-pooling *may* preserve this, but if they agree on probabilities (\(P_A = P_B\)), it holds. However, unanimity in *utilities* fails: \(U_S\) is multiplicative, not additive.  

  #### Does This Embarrass Utilitarianism?  
  - **Yes, specifically:** The dynamic inconsistency arises *because* utilitarianism aggregates utilities linearly *at a point in time*. When information arrives, redistributing weight based on who "called it right" breaks the fixed ethical weights.  
  - **Broader Implication:** Any social aggregation treating society as a **single atemporal agent** fails. Society is better seen as a **sequence of agents** tied by a social contract (fixed \(\lambda_i\)), but updating forces reweighting if priors differ.  

  ---

  ### Bottom Line:  
  **Bottom line:** The specifically utilitarian content (equal weights, interpersonal comparability) comes solely from the **veil-of-ignorance assumption**—specifically, the normalization of extended preferences behind the veil—not from the aggregation theorem itself.
