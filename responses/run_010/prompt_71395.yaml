  Now, checking against different theories. The hypocrisy view fails because there's no actual wrongdoing. The moral demand view might say Vance has standing due to his role. The potential conduct view would deny standing because of his counterfactual bias. The skeptic reduces it to character assessment. The potential conduct view aligns with the intuition here. 

  Identifying the key feature: untestedness, special relationship, or impartiality norm. Testing removals: if the counterfactual is actualized (brother scenario happens), it becomes hypocrisy. Swapping brother for a liked colleague weakens the intuition. If the norm permits partiality, the case collapses. So impartiality is crucial. 

  Finally, the best objection: actual-conduct defenders might argue that the counterfactual is irrelevant without actual manifestation, or that Vance's current commitment overrides potential bias. They could also point to moral luck—Vance is blamed for a disposition never acted upon. 

  Need to ensure clarity and that each part of the user's specs is met. Avoid any sci-fi elements, keep it realistic. Make sure the thought experiment clearly isolates the untested disposition as the issue.
answer: |-
  Here’s a thought experiment tailored to your specifications, followed by analysis and objections:

  **Scenario: The Disciplinary Committee**  
  Dr. Aris Vance chairs the Ethics Committee at a university. When a graduate student, Lena Chen, submits a paper containing unattributed text from a lesser-known monograph, Vance initiates formal proceedings. University policy mandates strict penalties for plagiarism, and Vance’s record is exemplary: over 15 years, he has impartially sanctioned 12 students for identical offenses, each time citing the need for academic integrity. Investigations confirm he has *never* committed plagiarism himself; his publications are scrupulously cited. Records show consistent rigor: he sanctioned his own advisee in 2018 and even reported a collaborator’s minor citation lapse in 2020.  

  However, Vance has an untested disposition. Unbeknownst to anyone (including himself, as it’s never arisen), he would excuse *identical* plagiarism if committed by his estranged younger brother, Silas. Vance feels unresolved guilt over their fractured relationship and privately believes "family loyalty outweighs institutional rules." He would rationalize Silas’s conduct as "a momentary lapse" and lobby covertly for leniency. But Silas is an artist with no academic ties; this scenario has never occurred. Vance’s disposition leaves no trace—no self-deception, no hypocrisy, only a counterfactual vulnerability.  

  ---

  **Analysis**  
  - **Norm/Conduct/Parties**:  
    - **Norm**: Impartial enforcement of plagiarism standards.  
    - **Conduct**: Lena Chen’s unattributed copying.  
    - **Blamer**: Vance (role: Ethics Chair).  
    - **Wrongdoer**: Chen (student).  

  - **Theoretical Predictions**:  
    1. **Hypocrisy Diagnosis**: *Fails*. Vance has never violated the norm himself. No double standard in actual conduct.  
    2. **Moral Demand View** (e.g., Scanlon): *Grants standing*. Vance’s role and clean record entitle him to demand adherence to shared norms.  
    3. **Potential Conduct View** (e.g., Bell): *Denies standing*. What matters is Vance’s counterfactual partiality toward Silas, revealing he lacks commitment to impartiality.  
    4. **Sceptic** (e.g., Coates): *Dissolves the case*. "Standing" is just judging Vance’s character. His latent bias makes him a bad blamer, but no distinct standing issue exists.  

  **Result**: The Potential Conduct View captures your intuition (denied standing). The Moral Demand View bites the bullet by ignoring the counterfactual. The Sceptic dissolves standing into character assessment.  

  ---

  **Key Feature Test**  
  The **single feature doing the work** is the **norm of impartiality**.  
  - **Removals**:  
    1. **Actualize the counterfactual** (Silas plagiarizes; Vance excuses him): Case collapses into ordinary hypocrisy. Vance now *has* violated impartiality.  
    2. **Swap brother for colleague** (Vance would excuse a liked colleague): Intuition weakens significantly. Partiality toward friends is often seen as less egregious than nepotism.  
    3. **Swap the norm** (e.g., a mentorship norm *permitting* favoritism): Standing is preserved. If partiality is permitted, Vance’s disposition isn’t defective.  

  **Conclusion**: The intuition evaporates when impartiality is removed. Standing tracks the norm’s structure, not just the blamer’s psychology.  

  ---

  **Best Objection (Actual-Conduct Defender)**  
  *"The case smuggles in epistemic and moral luck*. Vance’s disposition is irrelevant because he lacks access to it (no self-knowledge) and has no control over Silas’s absence. Blaming is governed by actual reasons and commitments. Vance *has* committed to impartiality through 15 years of conduct—the Silas scenario is a mere thought experiment, not a defeater. To deny standing here is to punish Vance for luck: the accident that his weakness was never tested. This conflates *being a good blamer* (which requires robust dispositions) with *having standing* (which requires authority and consistency in actual practice)."  

  **Strengths of this objection**:  
  - Preserves the link between standing and observable conduct.  
  - Avoids demanding infallible counterfactual consistency.  
  - Exposes the case’s reliance on unmanifested psychology.  

  **Weakness**: It must dismiss the intuition that latent incompatible commitments *can* undermine authority, even before they’re exposed.  

  ---  
  This structure isolates the tension between role-based authority and counterfactual impartiality, satisfies your specs, and preempts key objections. Use the objection to frame debate on whether standing is truly distinct from character assessment or moral luck.
