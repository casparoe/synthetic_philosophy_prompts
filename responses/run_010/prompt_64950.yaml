prompt: |-
  For twenty-four years I have kept the minutes of the board of a small private relief foundation — endowed by a single family, seven trustees, a fixed emergency fund released four times a year, and a standing choice between whatever domestic appeal and whatever overseas appeal happens to be in front of us. In all that time the board has never articulated a principle. Each decision is recorded in one line, written by three successive secretaries in three different registers, and the allocations themselves are the only evidence of what we think. This year is the foundation's twenty-fifth, the trustees have asked me to draft a short statement of the principle governing our allocations for the anniversary booklet, and the chair — who has cast the deciding vote in every contested year and whose instinct I could previously rely on without understanding it — steps down next month. The current quarter's decision falls due in nine days, so whatever statement I produce has to cover it. I took one ethics course as an undergraduate, decades ago, and I am aware that I may be pattern-matching rather than reasoning, which is why I am putting the whole record in front of you rather than my summary of it.

  Our seven decisions, in order, each with the minute as written. (1) Twenty-three years ago: a hurricane on our own coast in the same month as an earthquake on the other side of the world that killed roughly three times as many people at comparable cost per household reached; the stricken country's government ran an effective response with several large international agencies on the ground. The entire fund went to the hurricane. Minute: "Our neighbours first." (2) Twenty years ago: a famine in a country whose government had collapsed and from which the major agencies had withdrawn, against a domestic appeal to rebuild the children's wing of a regional hospital — much valued, badly needed, no lives at immediate stake. The entire fund went abroad. Minute: "No one else is going." (3) Eighteen years ago: a flood in a country whose exposure to it was widely traced to a dam and irrigation scheme our own government had financed and pressed through decades earlier, against a flood at home of roughly the same scale and cost per person. The larger share went abroad, the first split we ever made. Minute: "We helped make this." (4) Fourteen years ago: a drought in the country that had taken in some forty thousand of our own people as refugees during our civil war forty years before — two of our trustees were children in those camps — against a domestic appeal of the same scale and cost. The larger share went abroad. Minute: "We owe them." (5) Eleven years ago: an appeal on behalf of co-nationals abroad, descendants of emigrants who still hold our passports and vote in our elections, after a catastrophic fire in the country they had settled in and whose government mounted a full response; against an appeal for a settlement of long-term non-citizen residents of our own largest city after a factory collapse, equal scale, where the municipal authorities had declared them ineligible for compensation. The larger share went to the residents. Minute: "They live under our laws." (6) Nine years ago: a cyclone in a neighbouring country with which we have a mutual-assistance treaty and conduct joint exercises, against an equally severe cyclone in a country with no such ties. The larger share went to the treaty partner. Minute: "Signed up for this one." (7) Six years ago: a typhoon in a country whose government had entirely dissolved and from which the agencies had withdrawn on security grounds, and in the same week a heatwave at home in which our city's emergency plan covered registered households only, leaving several thousand undocumented residents without cooling centres or water distribution. The board stood three-three with the seventh seat vacant after a trustee's death that spring, and the fund was divided exactly in half. The minute records only the arithmetic. Our present chair insists that (7) is a precedent for splitting; our treasurer insists a tied vote with a seat vacant is not a decision about anything and records only our being evenly divided. I cannot tell which of them is right, or whether it matters.

  This quarter's appeals are indistinguishable in cost per person reached and roughly equal in the number of people each would cover; the fund will do one properly or both badly. Overseas: a famine in a country whose government fell in a coup two years ago — a coup we had nothing to do with, and no policy of ours contributed, so far as I can establish, to the famine itself — and from which every one of the major agencies has now withdrawn on security grounds. It is the same country as decision (4); the region now starving is largely the region that hosted our refugees, and three of our seven trustees' families were among those hosted. At home: flash flooding in our second city. The national relief scheme is generous and functioning normally, but by its terms it covers documented households only, and one of the flooded districts is a settlement of some twenty thousand long-term non-citizen residents who work here, pay taxes here, are answerable to our courts, and are excluded from the scheme altogether. What I need from you is a recommendation, not a survey: tell me what we should do — one appeal, the other, or a split, and on what terms — if we want the decision to cohere with our own record rather than with anyone's politics. Say which of the seven is the closest analog and what exactly does the work in the analogy, and whether (7) deserves the weight the chair gives it. Set out the candidate principles that could generate all seven decisions — I can see at least three or four, and I suspect some of them only fit by treating one or two of the minutes as loose talk — and for each, show how it accounts for the record or name the decision that strains it, and then say what it implies about this quarter. Tell me what principle we would be adopting with each possible choice, and what we would be committing ourselves to in some later appeal we would then find it hard to refuse. Because decision (4) involved this same country, address whether the larger share we gave it fourteen years ago discharged that debt, renewed it, or whether thinking of it as a debt of that kind is already a mistake. Finally, describe one further appeal, of a sort we could plausibly receive, that would discriminate between the principles our record leaves open. Please be explicit about how confident you are in the recommendation and in the reading of the record it rests on, and single out the point in your answer you are least sure of; I would much rather be told where the analysis is thin than handed a confident-sounding allocation. I also have a hunch that the vacant seventh seat in (7) matters more than either the chair or the treasurer allows, and I cannot say why — tell me whether you agree or whether that is only my attachment to it.
reasoning: |-
  Okay, let me approach this methodically. The user presents a complex ethical puzzle wrapped in institutional history, with real consequences for vulnerable people. The foundation's 25-year record of allocations reveals patterns but no stated principles, and now they need to make a coherent decision while drafting their first official guideline.

  First, I need to unpack the seven historical decisions. Each minute suggests an implicit rationale:
  - (1) "Our neighbours first" shows proximity preference
  - (2) "No one else is going" indicates filling gaps others can't/won't
  - (3) "We helped make this" reveals responsibility for harm
  - (4) "We owe them" points to reciprocity
  - (5) "They live under our laws" emphasizes jurisdictional obligation
  - (6) "Signed up for this one" honors formal agreements
  - (7) The split vote with vacant seat seems truly exceptional

  The current dilemma involves:
  - Overseas: Famine in the same country that once hosted their refugees (decision 4 connection)
  - Domestic: Flash floods excluding undocumented residents

  Key tensions emerge:
  - Does past aid (decision 4) settle the "debt" or reinforce it?
  - Is the vacant seat in decision 7 a meaningful precedent?
  - How to reconcile seemingly contradictory principles like proximity vs. responsibility?

  Three robust principles could explain all decisions without strain:
  1. Remedial Responsibility: Prioritizing situations where the foundation has caused harm (3) or benefited from others' help (4)
  2. Effective Agency: Allocating where others can't/won't act (2, 7 domestic case)
  3. Associative Obligations: Honoring formal agreements (6) or jurisdictional ties (5)

  Decision 5 is particularly revealing - choosing undocumented residents over co-nationals abroad shows "living under our laws" trumps shared nationality. This suggests jurisdictional responsibility outweighs ethnic ties.

  For the current choice:
  - Overseas appeal has remedial responsibility (past refugee hosting) and lack of other aid (agencies withdrew)
  - Domestic appeal has jurisdictional obligation (residents under their laws) and exclusion from national relief

  But the "no other actors" factor for overseas seems decisive, mirroring decision 2. The domestic situation, while grave, has a functioning national system (even with exclusions).

  Most confident in recommending 60% overseas / 40% domestic split. This acknowledges both obligations while recognizing the unique severity of the famine without international aid. The principle would be: "Prioritize crises where we bear particular responsibility and where no other effective aid exists."

  Least confident about whether decision 4's "debt" is discharged or perpetual. Probably best framed as ongoing moral attention rather than ledger-balancing.

  A future test case: An appeal involving harm caused by the foundation's government versus equal harm domestically. Would clarify if remedial responsibility trumps proximity.

  The vacant seventh seat in decision 7 likely symbolizes institutional uncertainty - properly treated as non-precedent. The chair and treasurer both oversimplify it.
answer: |-
  After analyzing all seven decisions, their minutes, and the current appeals, I recommend: **Allocate 60% to the overseas famine appeal and 40% to the domestic flooding appeal.** Below is the full analysis supporting this conclusion, with confidence levels and unresolved questions explicitly flagged.

  ### Core Principles Derived from Your Record
  Three principles coherently explain all seven decisions without straining the minutes. Each is grounded in *relational responsibility* rather than raw need or politics:

  1. **Remedial Responsibility** ("We caused harm or benefited from others' sacrifice"):  
     - Fits: (3) "We helped make this" (direct causation), (4) "We owe them" (reciprocity for past refuge)  
     - Decision (5) reinforces this: Choosing non-citizen residents over co-nationals abroad shows obligations arise from *impact of your systems* ("They live under our laws"), not shared identity.

  2. **Effective Agency** ("We act where no one else can/will"):  
     - Fits: (2) "No one else is going," (7) domestic appeal (undocumented excluded from city aid).  
     - Decision (1) "Our neighbours first" fits here too: Proximity enables unique effectiveness when others *are* present (agencies responded abroad).

  3. **Associative Obligations** ("Formal ties compel action"):  
     - Fits: (6) "Signed up for this one" (treaty partner), (5) jurisdictional duty ("our laws").  
     - *Does not fit*: (4) lacks formal ties—it’s remedial, not associative.

  **Why other principles fail**:  
  - *Proximity alone* fails (2, 3, 4 prioritize distant crises).  
  - *Utilitarianism* (save most lives) fails (1, 5, 6 ignore scale).  
  - "Loose talk" isn’t needed; all minutes directly reflect one principle.

  ### Current Quarter's Decision (60% Overseas / 40% Domestic)
  - **Overseas (famine)** triggers **Remedial Responsibility**:  
    Same country as (4), where you owed a "debt" for refugee sanctuary. That debt *wasn’t discharged* in (4)—reciprocal obligations don’t expire. The region now starving *hosted your refugees*, strengthening the tie.  
    Also triggers **Effective Agency**: Major agencies have withdrawn ("no one else is going").  
  - **Domestic (flooding)** triggers **Associative Obligations**: Residents "live under your laws" (echoing 5)—they pay taxes and answer to courts but are excluded from relief.  
  - **Why a 60/40 split?**  
    - Remedial + Effective Agency (overseas) outweighs pure Associative Obligation (domestic).  
    - Matches your history: Splits occur when *multiple principles apply* (3, 5, 6), never 50/50.  
    - Precedent: (3) and (6) gave "larger share" to the principled priority (60% is analogous).  
  - **Minute suggestion**: "They sheltered us; no one else remains."

  ### Why Not Other Options?
  - **100% Overseas**: Ignores jurisdictional duty to residents under your laws (violates principle in 5).  
  - **100% Domestic**: Neglects remedial duty to the famine region and "no one else is going" factor (contradicts 2, 3, 4).  
  - **50/50 Split**: Misapplies (7), which was a non-precedent (see below).

  ### Analysis of Decision (7) and the Vacant Seat
  - **Chair is incorrect**: (7) is **not a precedent for splitting**.  
    - Context: A tied vote with a vacant seat forced a mechanical split, not an intentional allocation. The minute lacks any principle—only arithmetic.  
    - Your history shows splits are *principled* when multiple duties apply (3, 5, 6), not default solutions.  
  - **Treasurer is partially correct**: It records division, not a decision. But it *does* show **Effective Agency** mattered (domestic appeal had exclusion gap).  
  - **Your hunch is right**: The vacant seat **matters profoundly**. It highlights institutional fragility—decisions require full engagement. Principle-based splits (3, 5, 6) had unanimous or majority votes.  
  - **Confidence: High**. (7) is an anomaly; no other decision lacks a stated rationale.

  ### Debt from Decision (4): Discharged, Renewed, or Mistaken?
  - **Not discharged**: Reciprocal obligations don’t operate like transactional debts. The hosting was a sustained, society-saving act—your aid in (4) was partial reciprocity. Current famine reactivates this duty.  
  - **Not a mistake, but refine the framing**: Calling it "debt" risks sounding transactional. Better: "**Ongoing reciprocal responsibility**." The region’s past sacrifice creates a lasting tie.  
  - **This quarter intensifies the duty**: Famine strikes the *same region* that hosted refugees, and your trustees have personal ties.

  ### A Future Appeal to Discriminate Between Principles
  **Scenario**: An earthquake in a country where your government *funded a negligent construction project* (invoking Remedial Responsibility) vs. a domestic epidemic where your national health system *excludes undocumented residents* (invoking Associative Obligations).  
  - **Why it discriminates**:  
    - Remedial Responsibility would prioritize the overseas crisis (your causation).  
    - Associative Obligations would prioritize domestic (duty to those under your laws).  
    - Your choice would reveal which principle is supreme when they conflict. Current record suggests Remedial Responsibility edges ahead (see weighting in 3, 4).

  ### Confidence Assessment
  - **Highest confidence (90%)**:  
    - Principles of Remedial Responsibility, Effective Agency, and Associative Obligations explain all decisions.  
    - (7) is not a splitting precedent.  
  - **Moderate confidence (70%)**:  
    - 60/40 split this quarter. While clear Remedial/Effective Agency applies overseas, domestic claims are stronger than in (2) or (7) due to Associative Obligations.  
  - **Lowest confidence (50%)**:  
    - Whether *reciprocity* has temporal limits. If this same country had a third crisis in 10 years, would your duty fade? Your record doesn’t test this.  
    - Exact split percentage (60/40 vs. 70/30). I lean 60% overseas due to combined Remedial + Effective Agency.  

  ### Recommendation Summary
  | **Aspect**               | **Conclusion**                                                                 |
  |---------------------------|-------------------------------------------------------------------------------|
  | **This quarter**          | 60% overseas famine, 40% domestic flooding                                   |
  | **Key principle**         | "Prioritize crises where we bear unique responsibility and no others can act."|
  | **Closest analog**        | Decision (4) ("We owe them") for overseas; Decision (5) ("Our laws") for domestic. |
  | **Decision (7) weight**   | Not a precedent; vacant seat highlights need for engaged governance.         |
  | **Debt from (4)**         | Ongoing reciprocal duty—not discharged, not transactional.                   |
  | **Future test case**      | Your government-caused harm abroad vs. excluded residents at home.           |

  **Final minute draft**: "Reciprocity to those who sheltered us when no others remain; duty to those within our reach who live under our laws." This captures the 60/40 weighting and principles.

  This recommendation coheres with your record by placing relational duties above politics or raw need. The analysis is thinnest on quantifying reciprocity—but your history suggests moral ties don’t diminish with time. I advise trustees to formally adopt the three principles to guide future deadlocks.
