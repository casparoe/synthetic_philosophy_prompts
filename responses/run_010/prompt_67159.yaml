prompt: |-
  I run a year-long seminar on transitional justice and my two strongest students have landed in camps that keep talking past each other, and now I've talked them into a good-faith adversarial collaboration. I want you to write the document they should be able to put their names to.

  One of them is a hardline retributivist. She thinks a state that trades prosecution for amnesty does something that no amount of later good outcomes can undo, because the duty to prosecute is owed to victims as a matter of their standing and not as an instrument for deterrence or peacebuilding. A truth commission that records suffering but punishes nobody, on her view, is not a partial satisfaction of that duty — it's a substitution of the state's interest in closure for the victim's right to see the wrong adjudicated.

  The other is what he calls a tragic-choice pragmatist. He thinks the only honest comparison at a transition point is between the outcomes that were realistically on the table, and that in the cases everybody cites the alternative to a negotiated amnesty was not a clean set of indictments but several more years of war. Refusing to bargain is, on his view, itself a way of killing people, and the retributivist's clean hands are paid for by other people's bodies.

  Give me:

  1. A numbered section of claims both can sign — about what amnesty actually bought and cost in transitions, about what victims are owed, about what a truth commission is and is not capable of doing, and about which of their disagreements turn out to be about the word justice rather than about substance. Flag those verbal ones explicitly and say why.
  2. A disagreements table with columns for the issue, the retributivist's own preferred wording of her position, the pragmatist's own preferred wording of his, and whether the gap is substantive or merely expressive. Neither wording should be a strawman the other side would reject.
  3. The cruxes — the sub-questions where settling the matter would actually move at least one of them. For each, name the case, argument, or piece of evidence both would agree bears on it, and write down each side's prediction in advance, before the answer.

  Then I want the two of them to fight over one specific design, because that's where I think the real content is. Not blanket amnesty and not blanket prosecution, but individualized conditional amnesty: granted case by case only on full disclosure of the politically motivated act, void if the disclosure turns out to be false, and paired with what I'll call a standing condition — the amnesty fails for any crime where an identifiable victim objects, and that objection can't be outvoted by a commission or by a majority of the country. Have them say whether the standing condition is a genuine third option that dissolves part of the fight, or a fig leaf that just relocates it. He thinks it makes any deal unsignable, since no armed group disarms into a veto held by the people it harmed. She thinks its a concession that lets the worst offenders buy their way out with a sufficiently detailed confession.

  I don't want citations or a reading list, and don't invent sources. Where a claim is empirical and contested, just say so and give each side's prior.
reasoning: |-
  Okay, let me approach this systematically. The user is running a year-long seminar on transitional justice with two brilliant but opposed students - one a hardline retributivist focused on victims' inherent rights, the other a tragic-choice pragmatist focused on saving lives through compromise. They need a framework for adversarial collaboration that moves beyond talking points.

  First, I need to identify the core tension: the retributivist sees prosecution as non-negotiable duty owed to victims, while the pragmatist sees refusal to grant amnesty as causing preventable deaths. Their debate isn't just academic - it's about how societies heal after atrocity.

  For the joint statement (Section 1), I'll highlight common ground:
  - Both agree victims deserve recognition
  - Both acknowledge truth commissions have limitations
  - They share concerns about blanket amnesty
  - Empirical evidence shows amnesties sometimes shorten conflicts but often fail victims
  - Their "justice" disagreement is partly semantic - one means procedural accountability, the other means minimizing harm

  The disagreements table (Section 2) will clarify positions without caricature:
  - On core obligations: duty to prosecute vs duty to prevent suffering
  - On alternatives: clean prosecutions vs prolonged war
  - On truth commissions: inadequate substitute vs necessary first step
  Each entry flags whether the divide is substantive or expressive

  For cruxes (Section 3), I'll identify testable questions:
  - Did specific conflicts (e.g., El Salvador) have viable prosecution alternatives?
  - Do conditional amnesties actually deliver truth?
  - What do victims prioritize when surveyed?
  These force concrete predictions rather than abstract debates

  The conditional amnesty design critique is where real insights emerge. The standing condition (victim veto) seems innovative but:
  - Pragmatist will argue it makes deals impossible - no armed group accepts this
  - Retributivist will see it as letting perpetrators buy freedom with confessions
  - Both might agree it merely shifts rather than resolves the tension

  Throughout, I'll maintain neutral framing - this isn't about who's right but understanding the trade-offs. The document should push them to engage each other's strongest arguments, not rehearse positions. The conditional amnesty exercise particularly forces practical engagement beyond theory.
answer: |-
  Here is the adversarial collaboration framework document, designed to move beyond rhetoric to substantive debate while respecting both positions:

  ### Joint Statement: Points of Agreement
  1. **Victim Acknowledgment**: Victims of severe human rights violations are owed recognition of their suffering and official acknowledgment of the wrongs committed against them.  
  2. **Truth Commission Limitations**: Truth commissions can document suffering and establish historical record, but they cannot:  
     - Function as judicial bodies  
     - Impose criminal sanctions  
     - Guarantee victim satisfaction or societal reconciliation alone  
  3. **Amnesty Trade-offs (Empirical)**: In some transitions (e.g., South Africa, El Salvador), amnesties were exchanged for:  
     - Short-term conflict cessation (agreed)  
     - Reduced immediate violence (agreed)  
     - **Contested outcomes**: Long-term social cohesion (Pragmatist: net benefit; Retributivist: undermined by impunity)  
  4. **"Justice" as a Terminological Dispute**:  
     - **Retributivist**: "Justice" inherently requires proportional punishment for wrongs.  
     - **Pragmatist**: "Justice" encompasses restoration of basic rights/security when punishment is impossible.  
     - **Explicitly verbal**: Where both agree that "securing basic rights" (Pragmatist) and "prosecuting wrongs" (Retributivist) are moral priorities, but label only one as "justice."  

  ---

  ### Disagreements Table
  | Issue | Retributivist Wording | Pragmatist Wording | Gap Type |
  |-------|------------------------|---------------------|----------|
  | **State's Primary Duty** | "The state owes victims prosecution as recognition of their equal moral standing; omitting punishment denies their humanity." | "The state owes all citizens protection from violence; when prosecution risks mass casualties, duty shifts to harm reduction." | Substantive |
  | **Alternatives to Amnesty** | "Refusing amnesty demands perpetrators’ accountability; the 'prolonged war' narrative ignores viable prosecutorial paths (e.g., post-dictatorship Greece)." | "At negotiations, rejecting amnesty meant rejecting the only peace offer; no historical transition had 'clean prosecutions' as a live option." | Substantive |
  | **Truth Commissions' Value** | "Truth without punishment commodifies victim suffering into a political tool, substituting closure for accountability." | "Truth commissions are harm mitigation when punishment is impossible; they restore agency to victims via testimony when courts are inaccessible." | Substantive |
  | **Moral Calculus** | "No utilitarian calculus (e.g., lives saved) can override the deontic duty to punish." | "Refusing life-saving bargains due to abstract principles is itself a choice with blood on its hands." | Substantive |

  ---

  ### Cruxes: Testable Predictions  
  1. **"Viable Prosecutions" Post-Transition**  
     - **Case** : El Salvador (1992 Chapultepec Accords vs. 1993 Amnesty Law)  
     - **Shared Evidence** : UN reports on post-accord death squads; victim surveys (1990s).  
     - **Retributivist Prediction** : *If* post-amnesty violence persisted, *then* prosecutions were feasible without reigniting war.  
     - **Pragmatist Prediction** : *If* amnesty ended large-scale combat, *then* prosecutions would have prolonged violence by 5+ years.  

  2. **Conditional Amnesty & Truth Recovery**  
     - **Case** : South Africa’s TRC (amnesty conditional on full disclosure)  
     - **Shared Evidence** : TRC archives on amnesty application honesty rates.  
     - **Retributivist Prediction** : Perpetrators minimized admissions (e.g., Apartheid security forces); most disclosures were tactical lies.  
     - **Pragmatist Prediction** : High-stakes confessions (e.g., Biko killers) revealed systemic crimes unobtainable via trials.  

  3. **Victim Priorities**  
     - **Evidence** : Meta-study of victim surveys (Colombia, Timor-Leste, Uganda)  
     - **Retributivist Prediction** : >70% rank "punishment" above "truth" or "reparations" when forced to choose.  
     - **Pragmatist Prediction** : Context matters; >60% in active conflicts prioritize "ending violence" over punishment.  

  ---

  ### Debate: Individualized Conditional Amnesty + Standing Condition  
  **Design**: Amnesty granted *only* if:  
  - Perpetrator fully discloses a politically motivated crime  
  - Amnesty void if disclosure is false  
  - **Standing Condition**: Amnesty fails if an *identifiable victim* objects (non-overridable)  

  **Retributivist Critique**:  
  > "This 'standing condition' superficially acknowledges victims but perverts justice. It offers perpetrators a *menu*: confess thoroughly enough to intimidate or exhaust victims into silence, and walk free. The worst offenders (those with organized intimidation networks) benefit most. It turns victim objection into a burden rather than a right, outsourcing the state’s duty to the traumatized."  

  **Pragmatist Critique**:  
  > "The standing condition is fatal to viable transitions. No armed group (e.g., FARC in Colombia) will demobilize if each fighter’s fate hinges on individual victims’ vetoes. It replaces collective bargaining with infinite veto points, ensuring no amnesty is granted. This isn’t a compromise—it’s prosecution in disguise, guaranteeing renewed conflict."  

  **Joint Analysis of "Third Option" Claim**:  
  - **Retributivist** : "A fig leaf. Shifts coercion from the state to victims, who face pressure to 'consent' to amnesties for peace."  
  - **Pragmatist** : "Relocates the conflict to the micro-level. Turns victim-offender encounters into high-stakes coercion (implicit or economic) without state mediation."  
  - **Agreed Contention**: *If* the condition requires active victim consent (opt-in), it nullifies amnesty. *If* it requires victim objection (opt-out), it favors perpetrators.  

  ---  
  This document forces engagement with empirical predictions and design trade-offs while preserving core principles. The standing condition debate reveals both sides view it as *procedurally unstable*—either collapsing to de facto prosecution (Pragmatist) or delegating justice to uneven power dynamics (Retributivist).
