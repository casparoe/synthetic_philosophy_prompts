prompt: |-
  Fifteen years as a developmental editor at a trade press, mostly history and biography, and two years ago I started auditing a philosophy of history seminar, partly just to get language for what I'd been doing at my desk all that time. We've been doing the old argument about whether historians explain by appealing to laws or by telling stories, and I keep feeling like both camps are talking past something I ran into constantly and nobody's named. My seminar partner thinks I'm describing the difference between a good lecture and a good outline, which is not it.

  Here's the situation. A historian hands in a chapter explaining some collapse, or some decision, and it works — you finish it and you genuinely understand why it happened. Then you need the argument in one paragraph for jacket copy, and the author supplies one, and it's completely accurate: same factors, roughly the same order, same causal connections, nothing added, nothing hedged. And it explains nothing. Not because it's compressed, either — I've read plenty of compressed arguments that land hard. It's that the paragraph only makes sense to someone who has already read the chapter. To anyone else it's a list of labels with arrows between them. Meanwhile the chapter, which contains no claim the paragraph doesn't contain, does all the work.

  I've tried to locate where the difference lives and its not in the facts, because you can't point to a fact in the chapter that's absent from the paragraph. And it isn't just the sequence: I once had an author restructure a perfectly good chapter so it opened with the assassination instead of closing on it, and it stayed a good chapter, a different one. What dies under compression is the sense, at each step, that the alternatives to that step had just been closed off. The chapter walks you through a narrowing, and you're at each point ignorant of what comes next; the paragraph reports that a narrowing occurred. So the explanatory force seems to depend on the reader being moved through the elimination of options in a particular order under conditions of not-yet-knowing, and that's exactly the thing a summary of the same content can't carry.

  I don't want to be told this is narrative explanation and sent away — I'm sure it is, and that's not narrow enough to be useful. I want the narrower thing: an account whose content is entirely propositional and fully stateable, but whose explanatory force isn't transferable to any statement of that content. I know people have written about how a good historical account is something you can follow along in, and about tying events together under some larger heading, and from the other side I've seen the claim that narrative is packaging doing no cognitive work whatsoever, and none of those is this. So — what are the two or three nearest established concepts, how is what I've described different from each, and which fits best? If nothing fits, coin something and give me a definition with the boundary cases worked out, because that's the part I actually need: does a proof in mathematics have the property? a well-made diagram? a mechanism description in biology? a detective novel? If the answer turns out to be yes to all four, then I've described something trivial and I'd rather find that out now than in week nine.
reasoning: |-
  Okay, the user is a developmental editor with extensive experience in history and biography who's auditing a philosophy of history seminar. They're frustrated with the standard laws-vs-narratives debate because it misses a crucial phenomenon they've observed professionally: that explanatory power vanishes when compressing a good historical chapter into a summary paragraph, despite identical factual content. 

  The core puzzle they articulate is fascinating: how can an account lose its explanatory force when reduced to propositions that are technically complete? They've already ruled out several obvious answers - it's not about missing facts, not about sequence alone (citing the assassination restructuring example), and not about narrative packaging being cognitively empty. Their description of "walking through a narrowing while ignorant of what comes next" feels viscerally accurate to me as someone who's read countless historical narratives.

  What they're really seeking is conceptual precision. They want to know if this phenomenon has a name in philosophy/historiography, or if it needs coinage. Crucially, they want boundary testing - does it apply to mathematical proofs, diagrams, biology mechanisms, detective novels? That last request shows they're thinking like a philosopher, demanding rigorous definitional edges.

  I recall Arthur Danto's work on narrative sentences - how historical accounts rely on later knowledge - but that's not quite it. Louis Mink's configurational comprehension comes closer with its gestalt emphasis, but still feels too broad. The "not-yet-knowing" aspect makes me think of Paul Ricoeur's narrative temporality, yet the user explicitly rejects general narrative theories. 

  The key insight emerges: this is about epistemic pacing. The chapter's power lies in controlling the reader's state of knowledge step-by-step, creating what cognitive scientists call "just-in-time understanding." The summary fails because it gives the destination before the journey. That explains why restructuring works (the journey changes) but compression fails (the journey disappears).

  For boundary cases: mathematical proofs share this if presented pedagogically (e.g., Euclid), but not as formalisms. Detective novels are pure manifestations. Biological mechanisms fall somewhere in between. The common thread is the controlled revelation of necessity - which suggests "hermeneutic necessity" might be the right coinage, emphasizing how meaning emerges through ordered disclosure.

  I'll structure the response around three close concepts (narrative explanation, configurational comprehension, thick description), show how each differs, then propose the new term with tested boundaries. The user's razor-sharp examples deserve equally precise handling - they've essentially identified a fundamental cognitive mechanism in understanding complex causality.
answer: |-
  Based on your precise description, this phenomenon sits at the intersection of epistemology, narrative theory, and the philosophy of explanation. Here's an analysis of the nearest concepts, their differences, and the best fit:

  **Nearest Established Concepts & How Your Description Differs:**

  1.  **Narrative Explanation (e.g., Danto, Gallie, White):**
      *   **Core Idea:** Explanation arises from the *emplotment* of events – the specific ordering, selection, emphasis, and connection that creates a coherent story with a beginning, middle, and end. The causal force comes from the narrative structure itself.
      *   **Difference:** While your description *uses* narrative, your key insight goes deeper. You point out that a *summary* of the narrative's propositional content (its "plot points" and causal claims) utterly fails to explain, even though the original narrative *using the same content* does. Narrative explanation proponents often argue the narrative *is* the explanation. You're isolating a *specific mechanism within narrative*: the reader's *experience* of sequential discovery and elimination under conditions of partial ignorance. The summary lacks the *temporal unfolding and epistemic state* crucial for the explanation to "land," even if it states the narrative's outcome. You're focusing on the *reader's cognitive journey*, not just the structure of the story.

  2.  **Configurational Comprehension / Synoptic Judgment (Louis Mink):**
      *   **Core Idea:** Historical understanding isn't just grasping individual events or laws, but seeing them *configured together* into a single, complex, non-reducible "cognitive gestalt" – a whole greater than the sum of its parts. Explanation lies in grasping this unique configuration.
      *   **Difference:** This is very close, especially in emphasizing the non-reducibility. However, Mink's concept is often presented as a static, synoptic (all-at-once) grasp of the configuration. Your description highlights the crucial *temporal process* of *achieving* that comprehension – the step-by-step path *through* the configuration where possibilities are successively closed off. The summary *states* the configuration but doesn't *enact* the process of arriving at it for the reader. The explanatory power lies in the *act of traversal*, not just the final map.

  3.  **Thick Description (Clifford Geertz - Anthropology, but applicable):**
      *   **Core Idea:** Explanation requires embedding actions/events within their dense context of social meanings, intentions, conventions, and nuances ("webs of significance"). Thin description states what happened; thick description explains *what it meant* to the actors and why it happened that way.
      *   **Difference:** While context is vital, your point isn't primarily about *missing* contextual detail in the summary (you stipulate the paragraph contains the same factors/causes). It's about the *loss of the experiential process of understanding* how those factors interact and eliminate alternatives *in sequence*. You could have a thick description summarized into a paragraph that loses its explanatory force for the same reason – the reader hasn't been guided through the contextual web step-by-step under conditions of uncertainty. The mechanism of elimination and sequential revelation is distinct from contextual richness itself.

  **The Best Fit & Coinage:**

  While overlapping with Narrative Explanation and Configurational Comprehension, your description most precisely captures the **controlled, sequential revelation of necessity under conditions of epistemic constraint for the reader.** The core explanatory mechanism is the **reader's experience of possibilities being decisively closed off as they proceed, step-by-step, without foreknowledge of the final outcome.**

  **Coined Concept: Hermeneutic Necessity or Enacted Necessity**

  *   **Definition:** The explanatory power derived not merely from stating causal connections or outcomes, but from structuring the account so that the reader *experiences*, in sequence, the elimination of alternative possibilities and the progressive *emergence of inevitability* (or high probability) for the next step and the final outcome, while themselves being epistemically constrained (lacking foreknowledge of that outcome during the process). This requires the *enactment* of the reasoning process within the reader's mind through the text's pacing and revelation.

  *   **Why Hermeneutic/Enacted?** "Hermeneutic" emphasizes the interpretive process the reader undergoes. "Enacted" emphasizes that the necessity is not just stated but performed/demonstrated *to the reader* through their engagement with the text. "Necessity" captures the sense of alternatives being closed off.

  **Boundary Cases Worked Out:**

  1.  **Mathematical Proof:**
      *   **Yes, but context-dependent.** A *well-presented, pedagogical proof* absolutely relies on Hermeneutic Necessity. It leads the reader step-by-step, establishing premises, applying rules, closing off alternative paths (e.g., "suppose, for contradiction, that..."), building towards the conclusion the reader doesn't yet know. A summary of the proof's steps ("We assume P, apply Lemma 3, derive contradiction, hence Q") often fails to explain *why* it works to someone unfamiliar. However, the *formal logical structure itself* is the ultimate justification; the enacted experience is primarily for understanding, not the proof's validity. So, the *explanatory force for the learner* relies on it, but the proof's *formal validity* does not.
  2.  **Well-Made Diagram (e.g., Flowchart, Mechanism):**
      *   **Partial/Metaphoric Fit.** A good diagram *can* facilitate a kind of enacted understanding by visually guiding the eye along paths, showing constraints, and making dependencies/alternatives visually apparent. It allows the viewer to "trace" the process. However, it typically presents the whole configuration simultaneously. The viewer *can* choose their path and often has foreknowledge of the whole. It supports the *recognition* of necessity but doesn't strictly *enact* the sequential elimination of possibilities under ignorance in the same textual, temporal way. It's a spatial analog rather than a temporal enactment.
  3.  **Mechanism Description in Biology (e.g., Krebs Cycle):**
      *   **Strong Fit.** A good description of a biochemical pathway relies heavily on Hermeneutic Necessity. It walks the reader through each step: Molecule A, *because of its specific structure and available enzymes*, reacts to become Molecule B. The possibility of it becoming something else is closed off by the chemical constraints and catalysts. The reader understands *why* B follows A by seeing the constraints and possibilities eliminated at each step. A summary list of inputs and outputs lacks this explanatory force. The necessity is enacted through the stepwise description.
  4.  **Detective Novel (Well-Constructed):**
      *   **Paradigmatic Fit.** This is almost a pure example. The reader experiences the investigation step-by-step, encountering clues, red herrings (false possibilities), and having possibilities successively eliminated ("He couldn't have done it because he was in Paris..."). The final revelation only makes sense and feels explanatory because the reader has been led through the process of eliminating alternatives under conditions of ignorance about the culprit. A summary of "The butler did it with the candlestick because X, Y, Z" lacks the explanatory force of the novel's journey. The necessity (of the solution) is *hermeneutically enacted*.

  **Conclusion:**

  You've identified a non-trivial, crucial aspect of historical (and broader) explanation: **Hermeneutic Necessity (Enacted Necessity).** It's the specific explanatory power generated by structuring an account so the reader *lives through* the sequential process of eliminating possibilities and discovering constraints, under epistemic conditions mirroring the historical actors' uncertainty (or the problem-solver's initial ignorance).

  *   **It fits best** with complex causal, processual, or investigative explanations (History, Biology mechanisms, Detective fiction).
  *   **It relies on** temporal sequence, controlled revelation, and the reader's lack of foreknowledge *during* the process.
  *   **It is lost** in summaries because summaries provide the outcome and the "map" upfront, bypassing the essential cognitive journey of discovery and elimination.
  *   **It is distinct from** (though often embedded within) general narrative structure, configurational gestalt (as a static state), or mere contextual thickness.

  Your seminar partner's "good lecture vs. good outline" analogy touches on the experiential aspect but misses the core mechanism of *elimination of alternatives under constraint*. What "dies under compression" is the reader's active experience of discerning *why each step had to happen next*, making the outcome feel not just stated, but *earned* and *inescapable*. This is fundamental to why we find certain historical accounts genuinely illuminating.
