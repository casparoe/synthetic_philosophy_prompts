prompt: |-
  I'm a third-year philosophy PhD student and my slot next week is TA-ing 75 minutes of a second-year cog sci course on consciousness — the section is Dennett's Cartesian theater / multiple drafts stuff. Whiteboard only, no slides, and the prof already ran all the standard illusion demos in lab so I can't lean on a fresh one. Here's what I'd planned: build the whole thing on the rubber hand illusion, since it visibly splits where-I-feel-my-hand-is from where-it-actually-is. But I suspect thats the wrong hill to die on, because it's about cross-modal ownership of a body part rather than about there being one privileged place-and-time where things come together for an inner audience — so it probably proves something adjacent and leaves the theater untouched. Tell me what's wrong with that choice and what should carry the session instead (the taps-on-the-forearm thing? the two differently-coloured flashing lights one? something you can set up with just a whiteboard and your hands?), then plan the sequence. I need the dependency structure, not a summary: which piece has to be in place before which and why — my instinct is that if I say "there's no finish line" before they've felt the pull of the theater, it just lands as a slogan. I also want the misconception map, and I'm bracing for at least three: "so there are lots of little theaters", "so nobody is really conscious", and "so the self is just a story we tell afterwards". For each, tell me at which point in the sequence it forms and exactly which step heads it off. Then one question I can ask at the end that seperates people who got the argument from people who just agree with me, and the two things I should openly refuse to cover at this level and say so.

  Give me the plan as a JSON object with these keys:
  - "verdict_on_rubber_hand": {what_it_actually_shows, why_it_misses_the_theater, is_there_a_repairable_version}
  - "carrying_example": {example, what_it_must_make_them_see, what_it_must_not_involve, how_i_stage_it_with_a_whiteboard_only}
  - "sequence": array of {step, idea_introduced, why_it_cannot_come_earlier_or_later, what_depends_on_it}
  - "misconceptions": array of {misconception, forms_at_step, head_off_at_step, one_line_rejoinder}
  - "comprehension_check": {question, what_a_real_answer_sounds_like, what_a_fake_agreement_sounds_like}
  - "deliberately_omitted": array of {topic, why_cut, what_i_say_instead}
reasoning: |-
  We are building a session plan for teaching Dennett's critique of the Cartesian theater and the multiple drafts model. The rubber hand illusion is initially considered but deemed insufficient because it targets body ownership rather than the temporal/spatial unification of consciousness. We need a different example to carry the session.

  Verdict on rubber hand:
  - What it actually shows: It demonstrates that the sense of bodily ownership (proprioception and visual input) can be manipulated, showing that the feeling of where our hand is can be detached from its actual location through multisensory conflict.
  - Why it misses the theater: The Cartesian theater is about the idea that there's a central place in the brain where "everything comes together" for a conscious experience at a specific time. The rubber hand illusion does not address the temporal or narrative unification of consciousness; it's about spatial and bodily self-attribution.
  - Repairable version? Not really for this purpose. It could be stretched to talk about how the brain constructs a unified sense of self, but it doesn't directly challenge the idea of a single moment of conscious experience.

  Carrying example: We need an example that directly challenges the idea of a single moment of conscious experience. The taps-on-the-forearm illusion (also known as the cutaneous rabbit illusion) is a good candidate because it creates a false temporal order of sensations. Alternatively, the two-flash illusion (when one flash is perceived as two due to an accompanying beep) is about temporal binding. However, the taps are easier to stage with a whiteboard and hands.

  But note: the prof has already run standard illusion demos in lab. So we cannot use a fresh demo. We have to rely on drawing or describing an illusion. The taps-on-the-forearm (cutaneous rabbit) is a classic and can be drawn and described without needing a live demo.

  Alternative: The phi phenomenon (apparent motion) is also strong and can be drawn on the board. But the rabbit illusion is more about temporal ordering and the construction of a sequence.

  Let's choose the cutaneous rabbit illusion (taps on the forearm) because it directly shows that the brain constructs a temporal sequence that doesn't correspond to the actual physical events, and it doesn't require any equipment.

  How to stage with whiteboard only:
  - Draw a simple arm (a rectangle) and mark points: wrist, elbow, and three points in between (say A, B, C). 
  - Describe: "Imagine I tap your wrist (point A) and then, after a short delay, I tap near your elbow (point C). But sometimes, if I tap at A and then at C, you feel a tap at B in between, even though I never touched B. That's the cutaneous rabbit hopping along your arm."
  - This illusion shows that the brain retroactively constructs a sequence. The feeling of the tap at B is inserted after the fact.

  What it must make them see: That conscious experience is not a direct reflection of the world but a constructed narrative that can be edited. There is no moment when the tap at B actually happened and was experienced; it's a later interpolation.

  What it must not involve: It must not require a live demo (since we can't do one) and must not be about spatial location only (like the rubber hand) without the temporal component.

  Sequence: We want to build the idea step by step.

  1. Start with the intuition of the Cartesian theater (to make the pull felt).
  2. Introduce the problem of timing and binding (why the theater seems necessary).
  3. Present the cutaneous rabbit illusion as evidence that the brain constructs experiences that aren't real-time.
  4. Then introduce Dennett's multiple drafts model as an alternative.
  5. Finally, the implications (no theater, no finish line).

  Detailed steps:

  Step 1: Elicit the Cartesian theater intuition.
     - Ask: "When you see a red apple, hear a bird, and feel the sun on your skin, all at the same time, where and when does it all come together for you to experience it?"
     - Draw a simple theater: a stage with a screen, and a little homunculus watching.
     - Idea introduced: The intuitive idea that there is a central place (the theater) and a time (the moment of consciousness) where everything is presented to the self.

  Step 2: Why the theater seems necessary - the binding problem (in time and space).
     - Example: When you hear a word, the sound arrives at different times at your ears, but you hear it as one event at one location. Or, when you see a moving object, your brain has to bind the visual information over time.
     - Introduce the problem: Without a theater, how do we get a unified experience?
     - This step must come after step 1 because we are building the problem that the theater supposedly solves.

  Step 3: Introduce the cutaneous rabbit illusion (or a similar temporal illusion).
     - Describe it in detail (with the whiteboard drawing) and explain that the brain is constructing a narrative that didn't happen in real time.
     - Idea: The brain is not passively receiving and presenting events in real time; it is actively constructing a story, and sometimes that story includes events that never occurred (like the tap at B).
     - Why now? We need the theater intuition to be clear (step 1) and the binding problem (step 2) to set up why this illusion is a problem for the theater. The illusion shows that the brain doesn't wait for all the data to come in and then present it; it revises and edits.

  Step 4: Dennett's multiple drafts model.
     - Explain: Instead of one central theater, there are multiple streams of processing (drafts) that are constantly being edited and revised. What we become conscious of is the latest draft that wins out in the competition for influence.
     - The illusion is an example of a draft that got edited in a way that doesn't match reality.

  Step 5: The implications: No finish line.
     - There is no single moment when consciousness happens. The brain is a parallel processor and the conscious experience is a narrative that is always being updated.

  Misconceptions:

  1. "So there are lots of little theaters" (homunculi fallacy).
     - Forms at step 4 (when multiple drafts are introduced) or step 5.
     - Head off at step 4: When explaining multiple drafts, emphasize that there is no inner audience. The drafts are not being presented to anyone; they are just processes that influence each other and behavior.
     - Rejoinder: "No little theaters either. The multiple drafts are not presented to any inner observer; they are just competing neural processes without a central viewer."

  2. "So nobody is really conscious" (eliminativism about consciousness).
     - Forms at step 5 (when we say there is no theater and no finish line).
     - Head off at step 4 or 5: Emphasize that Dennett is not denying consciousness; he is redefining it as a functional process. Consciousness is the operation of these multiple drafts.
     - Rejoinder: "Consciousness isn't being denied; it's being explained as the functioning of the brain's narrative processes. We are conscious, but not in the way we intuitively think."

  3. "So the self is just a story we tell afterwards" (epiphenomenalism or narrative self as an afterthought).
     - Forms at step 4 or 5.
     - Head off at step 5: When discussing the implications, clarify that the narrative is not an afterthought; it is the process that guides behavior in real time. The self is the center of narrative gravity, not a passive story told after the fact.
     - Rejoinder: "The narrative is not told afterwards; it is the ongoing process that we use to make sense of the world and guide our actions. The self is a useful abstraction, like the center of gravity in physics, that helps organize the narrative."

  Comprehension check question:
  - Question: "If there is no Cartesian theater, how does Dennett explain the fact that we feel like we have a unified, continuous stream of consciousness?"
  - Real answer: Should mention the multiple drafts model: that the brain is processing information in parallel and that what we experience is a narrative that is continually updated and edited. There is no single place or time where it all comes together; instead, there are multiple processes that contribute to a coherent story that we call consciousness.
  - Fake agreement: Might say something like "Because it's all an illusion" without explaining the model, or "Because the brain just does it" without specifying the multiple drafts.

  Deliberately omitted:

  1. The hard problem of consciousness (why there is subjective experience at all).
     - Why cut: It's a deep philosophical issue that is beyond the scope of this session. Dennett's model is about the how, not the why.
     - What to say: "We're focusing on the structure of conscious processes, not the hard problem of why there is subjective experience. That's a separate discussion."

  2. The neural correlates of consciousness (specific brain regions or mechanisms).
     - Why cut: The session is about the philosophical model. The neuroscience is important but would take us too far afield.
     - What to say: "While neuroscience informs this model, we're sticking to the conceptual framework today. For the neural details, see the next module."

  Now, let's structure the JSON as requested.
