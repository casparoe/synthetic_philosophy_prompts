  First, I need to recall Aumann's theorem clearly: rational agents with common priors should perfectly update beliefs after sharing posteriors once. But practice diverges because real humans aren't ideal Bayesians. The user's analysts likely have cognitive biases, different interpretation of evidence, or hidden assumptions preventing instant agreement. That explains why one round isn't enough - humans need iterative nudging toward consensus.

  The second part is trickier. Is the multi-round process valuable or just ritual? While the theorem doesn't guarantee accuracy, the repetition probably surfaces hidden reasoning. Each swap forces analysts to confront discrepancies and re-examine their models, potentially improving the estimate's robustness. The settled figure being novel suggests synthesis rather than compromise. 

