prompt: |-
  I maintain an internal forecasting tool at work. When two analysts produce probability estimates for the same question, the tool makes them swap numbers and re-estimate, repeating until the two estimates match. I implemented this because I read that Aumann's agreement theorem shows that rational Bayesians who share a prior cannot agree to disagree, so I assumed a single exchange of numbers should be enough to force agreement. In practice it takes three or four rounds, and the figure they settle on is often one neither analyst would have given alone.

  Two things I would like explained. First, if the theorem is correct, why does agreement not arrive immediately after the first swap, and should I simplify the protocol to one round? Second, does the repetition add anything, given that the theorem seems to guarantee agreement without saying anything about whether the agreed-upon number is accurate, or is it just a ritual my analysts perform because the interface keeps prompting them? Please keep the whole answer under 250 words.
reasoning: |-
