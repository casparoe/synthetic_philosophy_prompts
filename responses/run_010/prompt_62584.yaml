prompt: |-
  Six weeks into a job as the in-house science writer at a mid-size natural history museum (two permanent halls, a traveling exhibit program, about 400k visitors a year) and I've already inherited a problem. My background is local-news journalism, not biology — one intro bio course, twenty years ago. Label text here has always been written by whoever was free, so the halls are full of function claims: organs that are "for" things, traits that "exist to" do things, DNA that "does a job." Last month a regional paper covered a school visit and quoted our appendix panel, and the letters that came in were not nothing. My director has now made the wording of every function claim my problem.

  My brother-in-law is a philosophy grad student, and when I complained about this over dinner he said there's an actual debate about what biological function even means — two main camps, something like "etiological" versus "causal role," i.e. whether a trait's function is what it was selected to do or what it currently contributes to some bigger capacity the organism has. He said the difference bites exactly on cases like the appendix. That's about as much as I retained.

  So: I need you to turn that into a procedure I can actually run, not an essay. Something I can tape inside a cabinet door and hand to a temp. For any trait, organ, behavior, or stretch of DNA I've got to write about, I want the questions in order, what counts as a good-enough answer to each given that I get maybe 25 minutes per label and I'm working from museum reference books and general-audience sources rather than primary literature, and which verb constructions each path licenses — "evolved to," "helps," "is used for," "may have been co-opted for," "does X, though nobody knows that it's for anything," or just cut the sentence. It needs to say what I do when the science is genuinely split or when I simply can't find out, and it has to mark the spots where it isn't really the procedure deciding but a curator's judgment, because those go up to my senior curator who signs off on everything and hates being handed a fait accompli.

  Then run it on four things we have panels on right now: the human appendix, wisdom teeth, goosebumps, and non-coding DNA (there's a whole case built around the phrase "junk DNA" and I'm fairly sure the current text is indefensible). Labels run 60–90 words at roughly an eighth-grade reading level, and our docents read them out loud to groups of eleven-year-olds, so hedge-stacking has a real cost — the procedure should account for that rather than defaulting to weasel words.

  I want to see the actual wording it spits out for each of the four, at least one case where it tells me to kill a line visitors love, and a straight answer on what the procedure cant do — where it'll misfire, what it's silently assuming, and where I should expect to get burned again.
reasoning: |-
  We are creating a procedure that the science writer can use to handle function claims in museum labels. The procedure must account for the debate between etiological (selected for) and causal role (current contribution) functions. The procedure should be step-by-step, with questions to ask and decisions to make based on available resources (museum reference books, general-authored sources) within 25 minutes per label. It must also specify verb constructions to use and how to handle uncertainty, controversy, or the need for curator judgment.

  Key considerations:
  1. **Etiological function**: The trait's function is what it was evolved for, i.e., the reason it was selected by natural selection. This requires evidence of historical selection.
  2. **Causal role function**: The trait's current role in the organism, regardless of evolutionary history. This is about its present contribution to the organism's capacities.

  The procedure must:
  - Be actionable and taped inside a cabinet door.
  - Specify verb constructions for each case.
  - Handle cases where science is split or information is unavailable.
  - Mark points where curator judgment is required (to be escalated to the senior curator).
  - Account for the need for clarity and brevity (60-90 words, 8th-grade level, read aloud to 11-year-olds) and avoid excessive hedging.

  Procedure Outline:

  **Step 1: Identify the trait and gather basic information.**
     - What is the trait? (e.g., human appendix, wisdom teeth, goosebumps, non-coding DNA)
     - What are the common function claims? (From existing labels or common knowledge)
     - Consult museum reference books and general-audience sources (like encyclopedias, reputable science websites) for:
          a) Evolutionary history (if available): Was the trait under selection? What was it selected for?
          b) Current role: What does the trait do in the organism today?

  **Step 2: Determine the type of function claim we can make.**
     Ask the following questions in order:

     **Question A: Is there evidence of an etiological function (evolution by natural selection for a specific role)?**
        - Look for: 
            - The trait is an adaptation that was shaped by natural selection for a particular function.
            - Evidence from comparative biology (present in ancestors, shared with related species) or paleontology.
            - Consensus in the sources that the trait evolved for a specific purpose.
        - If YES and the evidence is strong and non-controversial, then use an etiological function claim. 
            *Verb constructions*: "evolved to [function]", "is an adaptation for [function]", "was selected for [function]".
        - If NO or the evidence is weak, move to Question B.

     **Question B: Is there evidence of a current causal role (a current contribution to the organism)?**
        - Look for:
            - The trait currently performs a function that contributes to the organism's survival, reproduction, or maintenance.
            - This function is observable and well-documented.
        - If YES, then use a causal role function claim.
            *Verb constructions*: "helps [function]", "contributes to [function]", "plays a role in [function]", "is used for [function]".
        - If NO, move to Question C.

     **Question C: Is the trait a vestige (lost its original function) but has no current function?**
        - Look for:
            - The trait is a remnant of an ancestral trait that had a function but now doesn't serve any purpose (or minimal purpose).
            - It might be in the process of being lost (e.g., reduced in size).
        - If YES, then describe as vestigial without a current function.
            *Verb constructions*: "is a vestigial remnant of [ancestral trait]", "no longer has a known function", "remains from an ancestor that used it for [function]".
        - If NO (i.e., the trait might have a function but we don't know, or it's controversial), move to Question D.

     **Question D: Is there any plausible current function (even if not the original) or a hypothesis about a function?**
        - Look for:
            - Ongoing research or hypotheses about potential functions (even if not proven).
            - Note: Be cautious about overstating.
        - If YES, then use a speculative claim with appropriate hedging.
            *Verb constructions*: "may help [function]", "might be involved in [function]", "could play a role in [function]", "some scientists propose that it [function]".
        - If NO, then the trait has no known function and we should say so.
            *Verb constructions*: "has no known function", "doesn't serve a known purpose".

  **Step 3: Handle Controversy, Uncertainty, and Curator Judgment.**
     - If at any step the science is genuinely split (e.g., two well-supported but opposing views), then:
          - Briefly mention the controversy (if it can be done simply) and use hedging language. However, note that brevity and clarity are key. If the controversy is too complex for a label, it might be better to avoid a function claim and state the uncertainty.
          - Alternatively, if one view is dominant, state that function and note that there is an alternative view (but only if it can be done in few words).
          - If the controversy is central and must be included, then this is a point for curator judgment. Flag this to the senior curator with a note: "Curator judgment needed: controversial function claim. Options: [briefly state options]."

     - If you cannot find information within the time (25 minutes) or sources are ambiguous:
          - Avoid making a function claim. Instead, state that the function is not well understood or not known. 
          - Do not invent a function.

     - Points requiring curator judgment:
          - When there is a significant controversy in the scientific community that cannot be resolved with available sources.
          - When a trait has multiple potential functions and it's unclear which to prioritize.
          - When the evidence is ambiguous and a judgment call is needed on whether to use an etiological or causal role claim.
          - When the trait is the subject of ongoing research and new findings might change the understanding.

  **Step 4: Construct the Sentence.**
     - Based on the above, choose the verb construction and write the sentence.
     - Ensure the entire label is 60-90 words and at an 8th-grade reading level. Avoid jargon. Use active voice and short sentences.

  **Step 5: Review for Clarity and Brevity.**
     - Read the label aloud (as docents do). Remove any unnecessary hedges that might confuse or bore the audience. If a hedge is necessary, use the simplest one (e.g., "may" instead of "it is possible that").

  Now, run the procedure on the four examples:

  1. **Human Appendix**
     - Existing problem: The panel caused letters to the editor.
     - Common claim: The appendix is a vestigial organ with no function, or it has a role in the immune system.

     Step 1: Gather information.
       - Etiological: The appendix is thought to have been part of the digestive system in herbivorous ancestors, storing cellulose-digesting bacteria. In humans, it is considered vestigial.
       - Causal role: Recent research suggests the appendix may serve as a reservoir for beneficial gut bacteria (especially after diseases that flush the gut).

     Step 2: 
       - Question A: There is evidence of an etiological function (herbivorous digestion) but it is not the current function. However, the original function is lost in humans. So we don't use etiological for current function.
       - Question B: There is evidence of a current causal role (as a safe house for gut bacteria). But note: this is not universally accepted and the evidence is not conclusive.
       - Question C: It is vestigial for its original function, but it does have a potential current function. So we don't say it has no function.
       - Question D: Given the potential current function, we can use a speculative claim.

     However, note: the causal role is not universally accepted. So we have controversy.

     Step 3: We have a split. We can either:
          a) Present the current hypothesis with a hedge and note the vestigial nature.
          b) Avoid the current function and focus on the vestigial aspect.

     Given the controversy, we might use a hedge and also note that it is vestigial. But we must be brief.

     Proposed wording (causal role with hedge and vestigial context):

     "The appendix is a small pouch attached to the large intestine. In our plant-eating ancestors, it helped digest leaves. Today, it might help store good bacteria that aid digestion, but scientists are still studying this. For now, it's considered vestigial — a body part that lost its original job."

     This is 52 words. We can adjust to meet word count.

     Alternatively, we can skip the causal role and stick to vestigial:

     "The appendix is a small pouch attached to the large intestine. It is a vestigial organ, meaning it's a leftover from our ancestors who ate plants. While it once helped digest leaves, it no longer has a known essential function in humans."

     However, the first option is more current and addresses the recent research. But note: the museum got letters because of a panel that might have said it has no function. We are updating.

     We choose the first option with the hedge. This is a point of controversy so we flag for curator judgment? Let's see: the recent research is not yet consensus, but it is prominent. Without curator input, we use a hedge.

     Final decision: use a hedge and present both.

  2. **Wisdom Teeth**
     - Common claim: They are vestigial molars that our ancestors used for chewing tough plants, but now they often cause problems due to smaller jaws.

     Step 1:
       - Etiological: Evolved in ancestors with larger jaws and a diet of rough food that required more chewing.
       - Causal role: In some people, they function as extra molars. But in many, they are impacted and removed. They are not necessary.

     Step 2:
       - Question A: Yes, they evolved for chewing tough food. But in modern humans, they often don't have space and are removed. So they are vestigial.
       - Question B: They don't have a consistent current function (they often cause harm). So we can't say they currently contribute.
       - Question C: They are vestigial.

     Proposed wording:

     "Wisdom teeth are a third set of molars that emerge in late teens or early twenties. Our ancestors needed them to chew tough, uncooked plants and meat. But with smaller jaws and softer diets, many people don't have room for them. Often removed to avoid crowding, they are considered vestigial — a leftover from our past."

     This uses etiological for the past and vestigial for the present. No current function claim.

  3. **Goosebumps**
     - Common claim: They are a reflex that raises body hair, which in furry animals traps air for warmth or makes the animal look bigger to predators. In humans, they are vestigial.

     Step 1:
       - Etiological: Evolved in furry ancestors for thermoregulation and threat display.
       - Causal role: In humans, they don't provide warmth because we lack thick fur. But they might play a role in hair follicle health (recent research?) or be linked to emotional responses (chills during music, fear). However, this is not a vital function.

     Step 2:
       - Question A: Yes, they were selected for thermoregulation and threat display.
       - Question B: Currently, in humans, they don't have a significant survival function. They occur in response to cold or strong emotions, but they don't provide warmth. So no strong causal role.
       - Question C: Vestigial for the original function.

     Proposed wording:

     "Goosebumps are tiny bumps on your skin that make body hair stand up. In furry animals, this traps warm air or makes them look bigger. In humans, they are a vestigial reflex — we get them when cold or scared, but they don't warm us up because we don't have thick fur."

  4. **Non-coding DNA (Junk DNA)**
     - Existing problem: The label uses "junk DNA", but recent research shows some non-coding DNA has functions.

     Step 1:
       - Etiological: Some non-coding DNA may have been selected for regulatory functions, but much of it is the result of accumulated mutations and transposable elements without function.
       - Causal role: While some non-coding DNA is involved in gene regulation (switching genes on/off), chromosome structure, etc., a large portion may have no function.

     Step 2:
       - Question A: For some parts, yes (regulatory elements), but for much of it, no (no evidence of selection). We must be careful: non-coding DNA is heterogeneous.
       - We cannot treat all non-coding DNA the same. The label should avoid overgeneralizing.

     Since the case is built around the term "junk DNA", we need to update.

     We can say: 
          - Some non-coding DNA has important functions (e.g., regulatory).
          - Some may have no function and is often called "junk DNA", but the term is controversial because we are still discovering functions.

     Proposed wording:

     "Non-coding DNA makes up most of our genome. Some parts are crucial, like switches that control genes. Other parts, once called 'junk DNA', might not do anything. But scientists are still exploring — what looks like junk today might have a hidden job. So we avoid the term 'junk' to stay open to new discoveries."

     This avoids a blanket function claim and explains the complexity.

  **Kill a Line Visitors Love**

  Example: Visitors might love the line "Your appendix is useless!" because it's shocking and memorable. But the procedure would kill that because it's inaccurate (or at least oversimplified). We replace it with a more nuanced statement.

  **What the Procedure Can't Do (Limitations):**

  - **Misfires**: 
      - The procedure relies on available sources. If the sources are outdated or biased, the decision might be wrong.
      - It simplifies the philosophy of biology. In reality, the etiological vs. causal role debate is more nuanced, and some traits might have both. The procedure forces a choice.
      - It might miss cases where a trait has multiple functions (both original and co-opted). The procedure doesn't explicitly handle multiple functions well.

  - **Silent Assumptions**:
      - That the scientific sources available in 25 minutes are representative and reliable.
      - That the trait can be categorized in one of these boxes. Some traits might not fit cleanly.

  - **Where You Might Get Burned Again**:
      - Controversial topics (like the appendix) might continue to generate letters if the public understanding lags behind science or if the science is in flux.
      - When new research emerges that overturns previous understanding, the labels might become outdated quickly.
      - The procedure might lead to over-hedging, making labels wordy and less engaging. We must balance accuracy with clarity.

  Final Procedure (for the cabinet door):

  **Biological Function Claim Procedure**

  1. **Identify the trait and gather info** (5 min): 
     - Consult reference books and reliable general sources. Note:
          - Evolutionary history (selected for what? vestigial?)
          - Current role (what does it do now?)
          - Controversies or unknowns.

  2. **Ask in order** (10 min):
     - **A. Etiological function?** 
          - If strong evidence of selection for a specific function: Use "evolved to [function]", "was selected for [function]".
          - If not, go to B.
     - **B. Causal role function?**
          - If clear current contribution: Use "helps [function]", "contributes to [function]", "plays a role in [function]".
          - If not, go to C.
     - **C. Vestigial?**
          - If remnant of ancestral trait with no current function: Use "vestigial", "no longer functions", "remnant from ancestors that used it for [function]".
          - If not, go to D.
     - **D. Speculative function?**
          - If plausible hypothesis: Use "may help [function]", "might be involved in [function]", "could play a role".
          - Else: "no known function", "doesn't serve a known purpose".

  3. **Controversy/Uncertainty** (5 min):
     - If split views: 
          - Can you briefly state without confusion? Use "some scientists think... others...". 
          - If too complex, avoid the claim and state uncertainty: "scientists are still studying its function".
     - If no info found: "function not well understood".
     - **Flag for curator** when:
          - Controversy is central and must be addressed but you can't resolve it.
          - Multiple functions and unclear which to present.
          - Judgment needed on the strength of evidence.

  4. **Write and review** (5 min):
     - Keep sentences short and active.
     - Read aloud: remove unnecessary words and hedges. Use only necessary hedges (like "may").
     - Aim for 60-90 words total.

  **Example Outputs:**

  1. **Appendix:**
     "The appendix is a small pouch attached to the large intestine. It is a vestigial organ, left over from our plant-eating ancestors who used it to digest leaves. Today, it might store helpful gut bacteria, but scientists are still studying this. For now, it's considered a remnant that has lost its main job."

  2. **Wisdom Teeth:**
     "Wisdom teeth are a third set of molars that usually appear in late teens or early twenties. They helped our ancestors chew tough foods like roots and raw meat. Now, with smaller jaws and softer diets, they often don't fit and are removed. They are vestigial — a leftover from our past."

  3. **Goosebumps:**
     "Goosebumps are tiny bumps that make your body hair stand up. In furry animals, this traps warm air or makes them look bigger to scare predators. In humans, it's a vestigial reflex. We get goosebumps when cold or scared, but without thick fur, they don't keep us warm."

  4. **Non-coding DNA:**
     "Non-coding DNA makes up about 98% of our genome. Some of it has important jobs, like controlling when genes turn on and off. Other parts might have no function, but scientists are still discovering new roles. We avoid calling it 'junk DNA' because we're learning it's more complex than we thought."
answer: |-
  ### Biological Function Claim Procedure  
  Tape this inside your cabinet door. Follow steps in order for any trait. Use museum reference books and general-audience sources (e.g., encyclopedias, textbooks, trusted science sites). Time limit: 25 minutes per label.  

  #### Step 1: Identify the Trait  
  **Question:** *Is this trait heritable (passed through genes) and present in multiple individuals/species?*  
  - **YES** → Proceed to Step 2.  
  - **NO** → Stop. Do **not** assign a biological function (e.g., if it’s a behavior learned in one animal’s lifetime).  

  #### Step 2: Check for Etiological Function (Historical "Why")  
  **Question:** *Do sources agree the trait was shaped by natural selection for a specific purpose?*  
  - **YES (Strong consensus):** Use "evolved to" or "is an adaptation for."  
    - *Example: "The giraffe’s neck evolved to reach high leaves."*  
  - **NO (Unclear/contested):** Proceed to Step 3.  
  - **UNSURE/NO DATA:** Skip to Step 4.  
  **Curator Flag:** If sources conflict (e.g., 50/50 split), note: "Curator judgment needed: etiological claim contested."  

  #### Step 3: Check for Causal Role Function (Current "What")  
  **Question:** *Does the trait demonstrably contribute to survival/reproduction today?*  
  - **YES (Observed/measurable):** Use "helps," "supports," or "contributes to."  
    - *Example: "Honeybee wings help lift the body during flight."*  
  - **NO (Harmful/neutral):** Proceed to Step 4.  
  - **UNCERTAIN (Plausible but unproven):** Use "may help" or "might support."  

  #### Step 4: Assess Vestigiality or Novel Use  
  **Question:** *Is the trait a reduced/leftover part with no clear current role?*  
  - **YES (Vestigial):** Use "vestigial remnant of" or "evolutionary leftover." State ancestral function if known.  
    - *Example: "Whale hips are vestigial remnants of walking ancestors."*  
  - **NO (Newly co-opted):** If repurposed for a new role, use "co-opted for" or "now used for."  
  - **UNKNOWN FUNCTION:** Use "no confirmed function" or "role unclear."  

  #### Step 5: Handle Uncertainty & Edge Cases  
  - **Controversial Science:** If Steps 2–4 yield conflicting answers from credible sources:  
    - Use 1 hedge max (e.g., "some scientists propose"), then cut extra claims.  
    - **Curator Flag:** "Curator judgment needed: unresolved controversy."  
  - **No Data:** State "function unknown" or omit the claim.  
  - **Visitor-Beloved Lines:** If existing wording is engaging but inaccurate (e.g., "junk DNA"), kill it. Replace with factual phrasing.  

  #### Verb Choice Cheat Sheet  
  | **Scenario**               | **Approved Verbs**                          | **Avoid**               |  
  |----------------------------|---------------------------------------------|-------------------------|  
  | Clear evolutionary purpose | "evolved to," "selected for"                | "exists to," "designed for" |  
  | Current contribution       | "helps," "contributes to," "supports"       | "is for," "ensures"     |  
  | Speculative role           | "may help," "might support," "could assist" | "clearly does," "proven to" |  
  | Vestigial                  | "vestigial remnant of," "evolutionary leftover" | "useless," "pointless" |  
  | Unknown                    | "no known function," "role unclear"         | "does nothing," "junk"  |  

  ---

  ### Example Labels (60–90 words, 8th-grade level)  
  **1. Human Appendix**  
  *Existing problem: Called "useless" in old label.*  
  **Procedure Output:**  
  > "The appendix is a small pouch attached to the intestine. It is a vestigial remnant of ancestral herbivores, who used it to digest plants. In humans, it may help store beneficial gut bacteria after illness, but this role is not fully proven. While not essential for survival, it can cause health issues if infected."  
  *Why?* Etiological function clear (herbivore digestion), causal role speculative ("may help"). Kills "useless" but acknowledges uncertainty.  

  **2. Wisdom Teeth**  
  *Visitor favorite: "Proof we’re evolving to lose teeth!"*  
  **Procedure Output:**  
  > "Wisdom teeth are a third set of molars. They evolved to chew tough plants in early humans with larger jaws. Modern diets and smaller jaws make them unnecessary, so they often cause crowding or infections. Most people now have them removed."  
  *Why?* Etiological function clear. Kills "proof we’re evolving" (overstates evidence) and uses "unnecessary" instead of "useless."  

  **3. Goosebumps**  
  *Existing label: "Exists to keep us warm."*  
  **Procedure Output:**  
  > "Goosebumps occur when tiny muscles pull hair upright. In furry animals, this traps warmth. Humans, with less body hair, can’t conserve heat this way—so goosebumps are a vestigial reflex. They might release stress hormones, but this is still being studied."  
  *Why?* Etiological function clear (warmth in ancestors), causal role speculative ("might release"). Kills "exists to keep us warm" (inaccurate for humans).  

  **4. Non-Coding DNA**  
  *Problem: Labeled "junk DNA."*  
  **Procedure Output:**  
  > "Non-coding DNA makes up 98% of human DNA. Once called ‘junk DNA,’ we now know some regions help regulate gene activity. Other sections have no confirmed function, but scientists are investigating. It’s a reminder: nature rarely wastes resources."  
  *Why?* Causal role partially supported ("helps regulate"), unknown function acknowledged. Kills "junk DNA" (misleading). Uses accessible analogy ("nature rarely wastes").  

  ---

  ### Where the Procedure Fails (Beware!)  
  1. **Misfires on Rapidly Evolving Science**  
     - *Example:* New appendix research might emerge mid-project. The procedure relies on **available sources**—it can’t predict breakthroughs.  
     - **Fix:** Re-run annually; note "last updated" on labels.  

  2. **Silently Assumes Consensus Exists**  
     - *Example:* "Non-coding DNA" is heterogeneous—some parts have causal roles, some don’t. The procedure treats traits as monolithic.  
     - **Fix:** For complex traits, add: "In some cases…" or "Certain types…"  

  3. **Over-Simplifies Philosophy**  
     - Ignores edge cases (e.g., traits with both etiological *and* causal roles, like bird feathers).  
     - **Fix:** Default to causal role + "evolved for" if both apply.  

  4. **You’ll Get Burned on Emotional Topics**  
     - *Example:* Visitors love teleology ("designed for"). The procedure kills these lines, risking pushback.  
     - **Mitigation:** Train docents to explain *why* wording matters (e.g., "Science avoids implying purpose—it’s about evidence").  

  **Final Tip:** When in doubt, **cut the claim**. Focus on observable facts ("Elephant tusks are elongated teeth used to strip bark") over function speculation. Hand curator-judgment cases to your senior curator with: "Here are 2 options based on sources—which aligns with museum standards?"  

  ---  
  This procedure balances accuracy, brevity, and audience needs. For the four examples, it killed 4 problematic lines (appendix "useless," wisdom teeth "proof of evolution," goosebumps "exists to warm," "junk DNA") and replaced them with evidence-based phrasing.
