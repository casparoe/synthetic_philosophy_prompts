  This appears to be an original contribution to collective intentionality debates. The user clearly understands the philosophical landscape (mentioning mutual belief requirements, joint commitment theories) but wants precise analysis of where their observation fits or breaks existing frameworks.

  Key features to address:
  - Sincere denial of joint project by both parties
  - Perfect behavioral coordination regardless
  - Disavowal as structural requirement (avoids awkwardness/pride issues)
  - Genuine shared ownership of outcome
  - Distinction from parallel play, tacit agreements, or hierarchy

  The user wants:
  1) Taxonomy of existing theories showing where their cases fail to fit
  2) Clear boundaries defining when such coordination stops being "their thing"
  3) Analysis of sincerity/politeness factors
  4) What happens if the pattern is acknowledged

  Important to avoid:
  - Bibliographic references (they can't access papers)
  - Overly technical jargon
  - Solutions like "bring casserole" (though charming)

  This requires careful philosophical dissection while keeping it concrete. Should systematically test their cases against:
  - Searle-style we-intentions
  - Bratman's mutual responsiveness
  - Gilbert's joint commitment
  - Tuomela's collective acceptance
  - Clark's common ground

  The river cleanup example is particularly telling - the "our stretch" private acknowledgment versus public "we" avoidance shows layered intentionality. Also notable that coordination collapses when one quits, proving functional interdependence despite denials.

  For the coinage: "Deniable Joint Action" captures the core feature well. Should emphasize it's not just tacit but actively denied. Boundary cases would include: one party secretly believing it's joint, insincere politeness disclaimers, or when coordination becomes verbally acknowledged.

  The naming paradox is profound - if called out, it either collapses into standard joint action or dies from embarrassment. That's why Ray must never know about the casserole.
answer: |-
  What you're describing is a fascinating and coherent phenomenon that *shouldn't* exist according to dominant theories of joint action requiring mutual belief or common knowledge – yet it clearly does. Philosophers like Bratman, Gilbert, and Searle would struggle to categorize Ray and you, or the river cleanup pair. Here's the breakdown:

  **What It Is *Not* (and Why):**

  1.  **Shared Intention (Bratman/Searle Style):** Bratman requires *mutually responsive* intentions directed at the joint activity *and* mutual belief about those intentions. Searle's "we-intentions" involve intending *as part of a collective*. Both fail: You and Ray *lack* mutual belief about each other's attitudes towards the activity *as joint*. Neither holds the belief "We are doing this together," let alone mutually believes the other holds that belief.
  2.  **Joint Commitment (Gilbert):** Gilbert requires a *public act of commitment* (verbal or clearly understood) creating obligations. Your coordination lacks this public element. The "refusal to say the thing out loud" is core, preventing the formation of the explicit or clearly signaled commitment Gilbert requires.
  3.  **Common Knowledge (Lewis/Schelling):** This requires that A knows X, B knows X, A knows B knows X, B knows A knows X, and so on ad infinitum. Your cases explicitly *avoid* establishing common knowledge about the joint nature of the activity. The mutual disavowal blocks it.
  4.  **Tacit Agreement:** Tacit agreements imply unspoken but mutually *understood* terms or acknowledgment of the arrangement. Here, both parties *sincerely deny* the joint nature. "I'm just shoveling around the obstacle" vs. "I'm preventing his heart attack" are fundamentally *different* framings that preclude mutual understanding of shared purpose beyond the physical coordination.
  5.  **Parallel Individual Action:** This fails because of the *genuine meshing and responsiveness*. You trade the shovel, cover for absences, feel shared ownership of the outcome ("we beat it"), and experience mutual responsibility ("neither says 'well, that's on him'"). Parallel actors don't develop intricate, responsive systems or feel shared responsibility.
  6.  **Hierarchy or Unilateral Action:** It's not one person directing and the other complying. The coordination is reciprocal and adaptive (trading shovels, covering absences), even if the *reasons* are asymmetric.
  7.  **Free Riding:** Both contribute actively and significantly. The river guy quit and the other stopped, proving mutual dependence.

  **The Core Mechanics & What Makes It Work:**

  *   **Parallel Framing, Interdependent Action:** Each participant has a *private*, *individual* framing for why they engage in the coordinated behavior ("prevent heart attack," "clear obstacle," "work my stretch"). Crucially, these framings *do not require* attributing a "we-intention" to the other person.
  *   **Behavioral Responsiveness Without Attitudinal Acknowledgment:** They develop highly responsive, meshing behaviors *precisely because* they don't need to negotiate shared intentions or commitments. They read the *physical situation* and the *other's actions* (not their beliefs) to coordinate ("he's shoveling there, so I'll shovel here," "the good shovel is free, I'll take it").
  *   **Mutual Disavowal as "Load-Bearing":** The sincere refusal to acknowledge the jointness *enables* the coordination. It bypasses the need for potentially awkward, pride-threatening, or commitment-creating conversations ("Are we doing this together?", "Can you cover for me?"). The coordination *flourishes* in the space created by this denial. Ray's pride and your awkwardness are *protected* by the lack of explicit acknowledgment.
  *   **Shared Outcome Ownership Without Shared Intention:** Both feel responsible for the *outcome* ("we beat it," feeling responsible for failure) because their individual actions are deeply interdependent and necessary for the desired result (clear driveway, clean stretch). The outcome's success/failure is *objectively shared*, even if the intention isn't subjectively mutual.

  **What to Call It? (Coining a Term):**

  **Deniable Joint Action (DJA)** captures the essentials:
  1.  **Joint Action:** Genuine behavioral coordination, meshing, responsiveness, and shared dependence on the outcome.
  2.  **Deniable:** Both parties *sincerely* disavow the shared intentionality or joint commitment aspect to *others* and likely *to themselves*. The "jointness" exists objectively in the coordination and outcome, but is denied subjectively as a motivating factor or framing.

  **Boundaries & Edge Cases:**

  1.  **When does it stop being DJA and become mere parallel behavior?**
      *   When coordination breaks down due to lack of mutual responsiveness (e.g., the river guy quitting).
      *   When there's no shared ownership of the outcome (e.g., if Ray failed and you thought "that's his problem").
      *   When the actions are genuinely independent, even if similar (e.g., two strangers shoveling adjacent public sidewalks without interacting).
  2.  **What if only one disavows it?**
      *   If one sincerely believes it's joint and the other sincerely disavows it, it becomes unstable. The believer might try to signal or acknowledge the jointness, violating the disavowing party's need for deniability, likely causing friction or collapse. It's no longer *mutually* deniable.
      *   If one disavows sincerely and the other disavows *insincerely* (as politeness), it *might* persist, but risks collapse if the insincere disavower slips up or becomes frustrated. The core "load-bearing" mutual disavowal is compromised.
  3.  **Does sincerity of disavowal matter?**
      *   **Crucially.** Sincere disavowal is foundational. If both are just being polite or strategic ("Oh, it's nothing"), it edges towards tacit agreement or masked joint commitment. The *sincerity* of the individual framing ("I'm doing this for *my* reason, not *our* project") is what protects the egos/pride/awkwardness and prevents the need for explicit negotiation. Strategic disavowal is vulnerable to exposure.
  4.  **Does it survive being named/acknowledged?**
      *   **Likely Not.** The moment the mutual disavowal collapses (e.g., you say "Ray, we make a good shoveling team"), the dynamic fundamentally changes:
          *   It forces a conversation about roles, expectations, commitment – things the DJA meticulously avoided.
          *   It risks violating the pride/awkwardness shield ("Does he think I need his help?", "Does he think I'm weak?").
          *   It *could* transition into a standard joint project ("Yeah, I guess we do, partner") *if* both parties are willing to embrace the explicit jointness. However, this is a transformation, not the survival of the original DJA. The original DJA *thrived* on the lack of acknowledgment; acknowledgment kills its defining feature and operational engine.

  **Conclusion:**

  You've identified a robust pattern – **Deniable Joint Action (DJA)**. It exists in the space *between* pure parallel action and theories requiring mutual belief or explicit commitment. Its stability relies *precisely* on the *absence* of mutual belief about joint intentions and the *sincere mutual disavowal* of those intentions, which protects individual framings and avoids explicit negotiation. This allows intricate, responsive, interdependent coordination and shared outcome ownership to flourish. It collapses if mutual disavowal breaks down (sincerely or through acknowledgment) or if coordination/interdependence fails. It's not impossible; it cleverly exploits a gap in standard accounts by decoupling sophisticated behavioral coordination from shared subjective intentionality. Bringing Ray a casserole might be good neighborly practice, but naming the DJA out loud? That could be the end of the beautifully unspoken driveway ballet.
