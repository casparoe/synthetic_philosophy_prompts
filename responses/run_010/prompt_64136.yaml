prompt: |-
  I'm the TA for an upper-level aesthetics seminar and I have 28 of these left to grade by Friday. I read this one through once on the bus and couldn't decide whether it's a solid B or a C with unusually nice prose, so I want a second read before I calibrate on the rest of the pile. Grade it out of 100 and write the comments I'd paste back to the student. Key every comment to a specific paragraph or claim — no general impressions, because the writing is fluent and I don't want to reward or punish the fluency by accident.

  Course rubric, roughly: 40 points for the argument actually answering the question, 30 for accuracy about the views it deploys, 20 for handling the second half of the question, 10 for clarity.

  For each problem you find, tell me whether it's central (it changes what the essay is arguing, and the grade turns on it) or local (fixable in a clause), and what the fix would be — one sentence, not a paragraph, I'm not asking you to rewrite their essay. Also tell me explicitly which claims are correct and would be a shame to mark down, and flag anything where you think the student is defending a minority position that's actually tenable, so I don't ding them for not being orthodox. No bibliography or suggested readings at the end, I know the literature.

  The question (700 word limit):

  A painting long attributed to a major seventeenth-century Dutch master has been exposed as a forgery made in the 1930s. Before the exposure, experienced viewers could not tell it from the attributed master's work by looking at it. Two claims are commonly made about cases like this:
  (i) the forgery is aesthetically inferior to the works it was passed off as;
  (ii) since the exposure changed nothing about how the canvas looks, any difference in value between it and a genuine work cannot be an aesthetic difference.
  Can (i) and (ii) both be true? Say what account of aesthetic properties makes them compatible or incompatible, and say what your account implies for an art form in which the identity of the work is fixed by a notation rather than by the history of the object.

  The student's answer:

  The first thing to notice is that this object is not a copy. A copy announces itself as a copy; nobody is deceived about who made it. A forgery is made to be taken for somebody else's work, and that difference in intention is what generates the puzzle, because (i) and (ii) look flatly contradictory only if we assume that everything aesthetically relevant about a picture is available in a single act of looking. (ii) is also ambiguous. It can mean that exposure changed nothing about how the canvas appears, which is trivially true, or that nothing aesthetically relevant distinguishes the forgery from a genuine work, which is a much bigger claim. Only the second reading is worth arguing about.

  Goodman's distinction between autographic and allographic arts explains why painting generates the problem in the first place. Painting is autographic: there is no notation that fixes the identity of the work, so an object that was not produced in the right historical way is not an instance of the work no matter how it looks. Music and literature are allographic: the work is picked out by compliance with a score or a text, so any compliant performance is a genuine instance of it. It follows that in the allographic arts the question of the value of the original cannot even arise. Since every compliant instance is an instance of the work, there is nothing left over for authenticity to add, and the last part of the essay question has an empty answer.

  On the aesthetic difference, Goodman concedes (ii) in its interesting reading. He agrees that at the moment of viewing there is no aesthetic difference between the forgery and the original, and argues that we should care about the difference anyway for an epistemic reason: even if I cannot tell them apart today, I might learn to, and the fact that I could learn to tells me there is something there to be learned. On this picture the reason to prefer the original concerns what looking at it teaches me, not what it is aesthetically. So Goodman belongs on the side of (ii), and the pull of (i) is a confusion between aesthetic value and art-historical value.

  Walton explains why that pull is so strong anyway. A work's aesthetic properties depend on the category it is perceived in, because the same nonaesthetic properties are standard, variable, or contraindicated relative to different categories, and the aesthetic properties track that. Categories are conventions, and which one we bring is up to us. Before the exposure, viewers saw the canvas as a Dutch master's painting, so it had the aesthetic properties of one; after it they see a 1930s pastiche, and it has those properties instead. But the canvas did not change. So aesthetic properties are not in the object at all, they are a function of how we take it, which supports (ii): what the exposure changes is a change in us.

  The forgery is still a lesser achievement, though. It can be a work of art in its own right and it can show enormous technical command, but it cannot be credited with the innovations it repeats. If the picture introduced a new way of handling light in an interior, the forgery did not introduce anything; it echoed. Originality is an aesthetic property, so this settles (i): the forgery really is aesthetically inferior, not just historically discounted.

  Danto's Brillo Boxes make the same point from the other direction. Two things can be perceptually identical and differ in aesthetic value, because what makes the difference is the theory and the history the object sits in. That is Walton's point again, and it shows that (i) and (ii) cannot both be true once 'aesthetic' means anything interesting. The two claims are reconcilable only because 'aesthetic' is doing double duty in them, and separating the two jobs is the whole answer.

  So both can be true. The forgery is inferior as an artistic achievement and lacks the historical properties that make the original the work it is, but nothing about how it looks is any the worse for it, and the exposure altered only our relation to the canvas. That is also why good connoisseurs were taken in: they were tracking appearance, and appearance was never where the difference lay.
reasoning: |-
  Okay, I need to grade this student's essay on the forgery question for an aesthetics seminar. The TA wants a detailed breakdown with specific comments tied to paragraphs, flagging central vs. local issues and correct points. Let me approach this systematically.

  First, I'll map the essay against the rubric:
  - Argument answering question (40pts): The student clearly states both claims can be true through Walton/Danto's framework. That's a direct answer. But they prematurely dismiss the allographic angle, which is a central flaw since the question explicitly asks about notation-based arts. (-5pts)
  - Accuracy of views (30pts): Goodman and Walton are well-handled, especially the category insight. However, misrepresenting Goodman's epistemic stance as purely non-aesthetic oversimplifies. Danto's Brillo Boxes are correctly applied. (-3pts for Goodman nuance)
  - Handling second half (20pts): The allographic section is weak. Declaring it "empty" ignores how notation affects authenticity debates in performance arts. Central oversight. (-8pts)
  - Clarity (10pts): Prose is fluid and logically structured. Full marks here. (10/10)

  Now paragraph-level comments:
  - Opening: Strong distinction between forgery/copy and parsing of (ii)'s ambiguity. Correct point about intention mattering. Local fix needed for the "puzzle" phrasing - it's not just intention but institutional context. 
  - Goodman section: Correct autographic explanation but overstates his position. Central that Goodman *does* tie discernibility to aesthetic properties via "symptoms." Fix: Acknowledge his aesthetic-epistemic link. 
  - Walton: Brilliant category analysis. Correct that properties shift with perception. Highlight this as exemplary. 
  - Originality claim: Correct that forgery lacks innovative merit, but debatable whether originality is purely aesthetic. Minority view worth preserving. 
  - Danto: Proper application to perceptual identity. Supports (i)/(ii) incompatibility well. 
  - Conclusion: Strong synthesis, but fails to address notation-based arts as required. Central omission.

  Final grade: 84/100 (B) - deductions mainly for the allographic oversight and Goodman simplification, offset by strong Walton/Danto handling. Flag the originality point as defensible minority view.
answer: |-
  ### Grade: 84/100 (B)  
  **Rubric Breakdown:**  
  - **Argument (34/40):** Directly answers compatibility (yes), uses Walton/Danto effectively, but undersells the allographic implication (central flaw).  
  - **Accuracy (27/30):** Strong on Walton/Danto; minor Goodman misstep.  
  - **Second Half (15/20):** Dismisses allographic arts too hastily (central).  
  - **Clarity (10/10):** Fluent and logically structured.  

  ---

  ### Comments for Student:  
  **¶1 (Opening):**  
  - ✅ **CORRECT:** Sharp distinction between forgery/copy and the ambiguity in (ii)’s interpretation (local).  
  - ⚠️ **LOCAL FIX:** Replace "generates the puzzle" with "generates tension," as the conflict stems from institutional context, not just intention.  

  **¶2 (Goodman):**  
  - ✅ **CORRECT:** Autographic/allographic distinction is accurately defined (local).  
  - ❗ **CENTRAL ERROR:** Incorrect that Goodman’s view makes the allographic question "empty." *Fix:* Add: "Goodman’s framework *allows* authenticity questions to arise differently in allographic arts, e.g., in performances of scores."  
  - ⚠️ **MINORITY POSITION (TENABLE):** Your reading that Goodman separates aesthetic/epistemic value is defensible (he’s ambiguous), so not penalized.  

  **¶3 (Goodman’s Aesthetic Difference):**  
  - ❗ **CENTRAL ERROR:** Overstates Goodman’s concession to (ii). *Fix:* Specify that for Goodman, *eventual* discernibility *is* an aesthetic symptom (e.g., in *Languages of Art*).  
  - ✅ **CORRECT:** Insightful point that (i) may confuse aesthetic/art-historical value (local).  

  **¶4 (Walton):**  
  - ✅ **CORRECT:** Perfect application of Walton’s categories (standard/variable) to explain perceptual identity pre/post-exposure (central strength—preserve this).  
  - ✅ **CORRECT:** Conclusion that aesthetic properties depend on "how we take it" directly supports (ii) (local).  

  **¶5 (Originality):**  
  - ✅ **CORRECT:** Forgery’s lack of innovative merit is well argued (local).  
  - ⚠️ **MINORITY POSITION (TENABLE):** Claiming originality is an aesthetic property is debatable (Danto might agree; formalism rejects it), so not penalized.  

  **¶6 (Danto):**  
  - ✅ **CORRECT:** Brillo Boxes illustrate Walton’s point and show (i)/(ii) incompatibility under robust "aesthetic" (local).  
  - ✅ **CORRECT:** "Aesthetic" does double duty—key insight (central strength).  

  **¶7 (Conclusion):**  
  - ✅ **CORRECT:** Synthesis of Walton/Danto reconciles (i)/(ii) via perception/history split (local).  
  - ❗ **CENTRAL OMISSION:** Fails to address notation-based arts (e.g., music/literature). *Fix:* Add: "In allographic arts, notation fixes work-identity, so forgeries (e.g., fake manuscripts) may retain aesthetic value if compliant."  

  ---

  ### Summary for TA:  
  - **Deducted -6 for Central Errors:** Allographic dismissal (-5), Goodman’s discernibility oversight (-1).  
  - **Deducted -5 for Local Issues:** Minor phrasing/scope fixes in ¶1/¶5 (-3), allographic implication (-2).  
  - **Preserve Strengths:** Walton/Danto synthesis (¶4/¶6) is exemplary. Minority claims (¶2/¶5) are tenable.  
  **Calibration Note:** This is a high B; weaker essays will mishandle Walton or miss the "double duty" point.
