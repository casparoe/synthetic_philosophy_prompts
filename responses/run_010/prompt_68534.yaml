prompt: |-
  I am a novelist, and each autumn I am invited to lead one evening session in an interdisciplinary seminar on memory at a small liberal arts college: fourteen students, mostly writers with a handful of cognitive science majors, ninety minutes, no budget. This year I want the session to accomplish something I cannot accomplish by talking. I want them to feel the force of the claim that cognition does not stop at the skull — that a card file can be a constituent of a thinking process rather than an instrument one consults. They will all have encountered the canonical thought experiment beforehand: the man with the memory impairment whose notebook plays for him the role that biological memory plays for the rest of us, and the argument that if the same information were carried in his head we would not hesitate for a moment to call it belief. On the page they found it tidy and unconvincing, which is how arguments arrive when one has not been made to live inside them. I want them to run into the discomfort before anyone names the thesis.

  So: design the session as a runnable activity, not a demonstration. Constraints, all of them deliberate. Phones are confiscated at the door, which I realize removes the most obvious example and forces the scaffold to be paper. Materials are limited to index cards, pens, masking tape, one wall, and a stopwatch. No prizes, no scores that require arithmetic. The students do not know one another's work and will not have met before that evening.

  I have a seed I would like you to develop, sharpen, or discard in favor of something better. Students first build, under time pressure, an external scaffold for a task that is genuinely too large for working memory — I have been thinking of a family chronology of some forty members with cross-cutting debts, grudges, and inheritances, though you may propose a better one — and then generate prose from it. Midway, while they are writing, the facilitator silently exchanges one file for another: a transplant performed in paper. The student must continue producing coherent text from a structure she did not build. I want to know whether that produces a felt difference of kind, and not merely of familiarity. I would also like a second beat in which some of the cards carry assertions the writer never verified, so that we can observe whether she endorses them automatically or with visible resistance.

  What I need from you: the rules and any roles; a minute-by-minute timeline that fits ninety minutes including the debrief; the exact specification of the task the cards must support, and why it defeats unaided memory rather than merely inconveniencing it; what the students physically produce and leave with; and a debrief that maps particular moments in the room onto particular parts of the thesis — the conditions under which an external resource becomes part of the process rather than a cause of it, such as ready availability, automatic endorsement, constant accessibility, and the ease with which its contents are consulted. The debrief should say where the activity makes those conditions vivid and where it merely flatters the view.

  Two honest notes I will hold you to. First, I suspect the emotional payload of the transplant — the flare of violation when a stranger's hands are on your cards — is an affective confound that evidences attachment rather than constitution. Tell me whether you agree, and if so either design around it or show me how to spend it deliberately in the debrief rather than let it do unearned work. Second, state plainly which feature of the thesis no paper activity can reproduce, and which I will therefore have to supply by argument in the final ten minutes; and give me the strongest objection the students will be able to raise afterward — the one that says any criterion permissive enough to admit a card file also admits the doorknob, the library, and everyone else in the room, until the word mind has stopped doing any work at all.

  Please write in American English. Send me a session I can run on Thursday, not a bibliography: no reading list, no citations, no attributions I would have to verify.
reasoning: |-
  Okay, the user is a novelist teaching a seminar on memory. They want an activity to help students experience the idea that cognition extends beyond the brain—using index cards as part of thinking. The key is making this tangible without just talking about it.

  The constraints are tight: 90 minutes, no tech, only paper supplies. Students don't know each other, so the activity needs to work without prior collaboration. The core idea involves swapping card files mid-task to create a "transplant" effect. But the user worries the emotional reaction to the swap might confuse attachment with cognitive integration. Need to address that.

  First, the task. The user suggested a family chronology with debts and grudges, but it might be too complex. Instead, a "Character Web" could work better. Writers create characters with traits and relationships on cards. Cognitive science majors build logic puzzles. This split ensures both groups engage with external tools. The complexity—multiple interconnected elements—exceeds working memory, forcing reliance on cards.

  The swap is crucial. Halfway through writing, cards are replaced. Students continue with unfamiliar ones. This should create a jarring shift from integrated tool to foreign object. To handle the emotional confound, design the swap as a neutral "file rotation," not a personal violation. Later, during debrief, explicitly compare the emotional reaction to the cognitive experience.

  For the unverified assertions, include some cards with unchecked facts. Observe if students automatically use them or hesitate. This tests automatic endorsement, a key condition for extended cognition.

  Debrief structure: start with reactions, then map moments to theory. Highlight when cards felt like part of thought (pre-swap) versus an external reference (post-swap). Point out the emotional response but separate it from cognitive integration. Acknowledge limitations—paper can't show constant accessibility like internal memory. Students might argue everything could be mind, so clarify criteria: constant access, automatic endorsement, easy consultability.

  Strongest objection: extended mind could include anything, like doorknobs. Counter by emphasizing the specific criteria that make tools like cards functional parts of cognition, not just aids. End by linking to the thought experiment, showing how the activity makes the abstract concrete.
answer: |-
  Here’s a runnable 90-minute session designed to force an embodied encounter with the extended mind thesis. It addresses your constraints, leverages the card-swap seed, and explicitly handles the emotional confound while spotlighting the thesis's limits.

  **Session Title:** The Scaffolded Mind: Writing with Borrowed Bones

  **Core Task:** Generating a coherent narrative *fragment* (not a full story) describing a pivotal moment within a complex, interconnected social system (e.g., a feud erupting at a family reunion, a betrayal in a secret society). The system's complexity (multiple agents, relationships, histories, obligations) intentionally overloads biological memory.

  **Why this defeats unaided memory:**
  1.  **Scale:** 6-8 interconnected characters/entities are too many to hold active relationships and histories for simultaneously while composing prose.
  2.  **Interdependence:** Relationships (A owes B, C distrusts D, E protects F) and key facts (dates, debts, secrets) are interdependent. Changing one detail can ripple through the network, impossible to track internally while writing fluidly.
  3.  **Dynamic Access:** Writing requires rapidly accessing different facets (What did C say to F? Why does D hate B?) in unpredictable sequences dictated by the narrative flow, not a fixed schema.

  **Materials Per Student:**
  *   10-12 Blank index cards
  *   1 Pen
  *   Small piece of masking tape (for labeling their initial card file)

  **Facilitator Materials:**
  *   Stopwatch
  *   Pre-prepared "Swap Files" (2 sets per student, see below)
  *   Large wall space
  *   Masking tape rolls for wall mounting
  *   Bin/basket for initial file collection

  **Roles:** Facilitator (You). Students work individually.

  **Minute-by-Minute Timeline (90 min Total):**

  *   **(0-5 min) Framing & Setup:** "Tonight, we write *from* complexity. Not *about* it, but *using* it as a scaffold. Your task: Build a skeleton world on cards, then generate a specific narrative moment within it. Phones away. Here are your tools." Distribute materials. Emphasize: *Build fast, write fluidly.*
  *   **(5-25 min) BUILD Phase (20 min):** "Using your cards, build the scaffolding for your complex social system. Focus on: **Characters/Entities** (1 card each: Name + Core Trait/Occupation), **Relationships** (1 card per *significant* relationship: 'A owes B $X', 'C distrusts D because...', 'E & F are allies'), **Key Facts/Events** (1-2 cards: 'Secret: G knows H lied', 'Debt owed: I to J', 'Event: The Fire, 5 yrs ago'). Aim for 6-8 character cards and 4-6 relationship/fact cards. ***Crucially: Write ONE assertion on a relationship/fact card that you *invent* but do NOT consciously verify or integrate yet. Mark this card subtly (e.g., tiny star).*** Use tape to label your *file* (stack/bundle) with your name. Place completed files in the bin." *Circulate, remind of time pressure, complexity.*
  *   **(25-30 min) File Swap & Setup (5 min):** Facilitator silently collects all files. *"We're rotating resources for efficiency."* While students wait: **Swap Mechanism:** Facilitator has pre-made identical sets of generic "Swap Files" (1 set per student). Each Swap File contains:
      *   Same *number* of Character/Relationship/Fact cards as students built.
      *   Similar *types* of info (Characters with traits, Relationships, Facts).
      *   **Crucially Different:** Names, specific relationships, facts, debts, grudges are *completely different* and *inconsistent* with what any student built. One card in each Swap File contains a **blatantly questionable/unverified assertion** (e.g., "K can read minds", "L poisoned M with radium", "The Moon Landing was faked here" - something jarringly odd or anachronistic). Facilitator quickly tapes each student's *original name label* onto a *pre-made Swap File*. Distribute these "anonymized" Swap Files back to students. *"Continue writing. Use the resource you have."*
  *   **(30-55 min) WRITE Phase 1 (25 min):** "Using YOUR scaffold, write for 10 minutes. Describe a specific, pivotal moment of conflict or revelation involving at least 3 characters, drawing directly on the relationships and facts in your file. Write continuously – don't stop to perfect. *Integrate* the information." (10 min writing). *"PAUSE. Re-read what you have. Now, continue writing the *immediate consequences* of that moment for another 10 minutes, still using YOUR file."* (Total 20 min writing with *original* file). ***STOP.***
  *   **(55-60 min) Mid-Point Swap & Reset (5 min):** Facilitator silently collects all files *again*. Repeats the swap process: Collects files, attaches each student's name label to a *different* pre-made Swap File (ensuring they get a *third*, unique set). Distributes. *"Continue. Use the resource you have now."* (This is the critical "transplant").
  *   **(60-80 min) WRITE Phase 2 (20 min):** "You have 15 minutes. Continue the narrative *immediately* from where you left off, but now using the *new* resource in front of you. Your characters are in crisis; what happens next? Integrate the information *this* file provides, even if it feels different. ***Crucially: You MUST incorporate at least ONE specific relationship or fact from THIS new file.***" (15 min writing with *transplanted* file). *"Final 2 minutes: Does the questionable assertion on one of your cards fit? If you can, try to weave it in naturally. If not, note the resistance."* (2 min). ***STOP.***
  *   **(80-90 min) DEBRIEF (10 min):** *Focus on mapping experience to thesis.*

  **What Students Produce & Leave With:**
  *   Their handwritten narrative fragment (started with their own scaffold, continued with the transplant).
  *   Their *final* set of cards (the transplant file).
  *   The embodied memory of the process.

  **Debrief: Mapping Experience to Thesis (10 min - Critical)**

  *   **Start with Reaction (1 min):** "Raise your hand if, during the second writing phase, you felt a distinct jolt, hesitation, or friction when trying to use the *new* file compared to the first?" (Almost all will). "What did that *feel* like?" (Capture quick descriptors: "jarring," "confusing," "foreign," "disconnected," "harder," "slow").
  *   **Thesis Mapping - Integration vs. Instrument (4 min):**
      *   "**First Writing Phase (Your File):** When you were writing with the structure *you* built, how did accessing information *feel*? Did you stop *thinking* to *look*?" (Likely: Smooth, fast, felt like part of the thinking/writing flow, automatic access). "*This* is the feel of the **integrated scaffold**. The cards weren't just 'looked up'; they were *consulted* almost like recalling a memory – **constant accessibility**, **ready availability**, **ease of consultation**. The information felt like *your* knowledge *because* you built the pathways. Cognition wasn't just *in* your head; it flowed *through* the structure you created outside it."
      *   "**Second Writing Phase (Transplanted File):** What changed? Why was it harder?" (Slower access, had to consciously decode, information felt 'external', unreliable, didn't fit existing narrative flow, required effortful 'lookup'). "*This* feels like an **external instrument**. It's not seamlessly integrated. Access isn't automatic or easy. The information isn't readily endorsed. You might use it, but it feels like *consulting a source*, not *accessing a belief*. The thesis argues the *first* state is where cognition *extends*."
  *   **Handling the Emotional Confound (2 min):** "Some of you might have also felt annoyed or violated when your original cards were taken. *That feeling matters, but it's different.* That's **attachment** – valuing *your* creation. The cognitive 'jolt' we're talking about is different: it's the **disruption of a functional process**. Your *original* cards became a *constituent part* of your thinking process. Swapping them wasn't just stealing your property; it was *surgically replacing a part of your working mind* with a non-compatible part. The violation *amplifies* the feeling, but the core cognitive disruption – the shift from integrated process to external tool – is distinct. We felt the *functional* break."
  *   **Unverified Assertions (2 min):** "Remember the card you marked? And the odd one in the swap files? When you first saw *your* unverified fact, did you just accept it while building/writing? (Likely yes, if it fit). **Automatic endorsement** – it felt like *your* fact because it was in *your* scaffold. Now, the *transplanted* odd assertion... Could you easily endorse and weave *that* in? (Likely no). Resistance! This shows endorsement depends on the *integration*, not just the presence of information. The scaffold has to be *part of the cognitive system* for automatic endorsement to occur."
  *   **The Limitation & The Objection (1 min):** "**What the paper *can't* show:** **Constant Accessibility.** Your biological memory is *always there*, instantly. You had to physically pick up the cards, find the right one. A true 'extension' like biological memory needs that constant, effortless availability. Otto's notebook *is* always with him, like memory. **The Killer Objection:** 'If a card file counts as part of the mind because I use it smoothly, why not the doorknob I use without thinking? Or the library? Or *that person* I ask for help? Doesn't 'mind' dissolve?'"
  *   **Your Closing Argument (Final 10 sec - To Be Expanded):** "The answer lies in the *functional role* and the *conditions we felt*: **Constant** (or near-constant) **Availability**, **Automatic Endorsement**, **Effortless Consultability** integrated into the process. The doorknob isn't *representational* – it doesn't hold beliefs. The library isn't *reliably, constantly available*. Another person isn't under your *direct, automatic control*. Otto's notebook *meets these criteria functionally*. Tonight, you felt what it's like when an external structure *is* functionally integrated... and what it's like when it's not. *That* functional shift is the boundary."

  **Why This Works:**

  *   **Embodied Cognition:** Students *physically* build and write, experiencing the flow.
  *   **Jarring Transplant:** The swap creates a clear, felt discontinuity in cognitive process.
  *   **Complexity Demand:** The task genuinely requires the external scaffold.
  *   **Unverified Facts:** Tests automatic endorsement within an integrated system vs. resistance in a foreign one.
  *   **Confound Addressed:** Explicitly separates emotional attachment from functional integration in the debrief.
  *   **Limits Clarified:** Highlights the constant accessibility gap and pre-empts the "everything is mind" objection, giving you the setup for your final argument.

  **Run it Thursday. Watch them feel the fracture.** Good luck!
