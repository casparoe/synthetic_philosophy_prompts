prompt: |-
  I'm sitting my orals in population ethics and my committee has told me the viva will turn on one chapter-length set of published verdicts on nonidentity cases. Here is the complete list I've been given.

  (1) A woman is prescribed a drug that would cause serious deformity in any child conceived during the two months it takes to clear her system. She conceives at once; her child is born deformed but has a life clearly worth living. She says: not wrong — the child is not worse off than he would otherwise have been, since otherwise he would never have existed.

  (2) Parents at a clinic are offered two viable embryos, one predicted to have a serious but manageable lifelong condition, one not. They choose the first. The child's life is worth living, though much less good than the alternative child's would have been. She says: wrong — and wrong, not merely suboptimal.

  (3) A fourteen-year-old could wait a few years and conceive a child with a much better start; she doesn't wait, and her child's life is worth living but worse than the later child's would have been. She says: wrong — though she insists the child has not been harmed.

  (4) A choice between two policies: under one, the entire future population will have lives worth living but very much worse than under the other, and no one alive is affected either way. She says the first policy is wrong, and adds that it cannot be wrong in virtue of how it treats those future people, since under the other policy none of them would exist.

  (5) A woman could conceive now or wait two years and conceive a somewhat better-off child; she has no health or financial reason to wait, though she does want her child born alongside her sister's. She says: absent a reason like that, she should wait, and it is wrong of her not to.

  The exam case is this. A couple can transfer exactly one of two viable embryos and has no grounds for preferring either; the evidence predicts one child will have a very good life, the other a life worth living but noticeably less good, and both fall well above any threshold for a life worth starting. The question put to me: would transferring the second be wrong?

  Predict her answer. Lay out the principles consistent with all five verdicts — she treats wrongness and all-things-considered permissibility as different questions, so keep them separate — say what each predicts for the exam case, and argue for the one you'd bet on. If the verdicts are jointly unstable, say which one gives and what she'd have to surrender to keep the rest. Then give me the follow-up case my committee would use to separate my favored principle from its closest rival, with the answer each would return. No citations needed; I'll supply those.
reasoning: |-
  Okay, let me try to figure this out. The user is preparing for a population ethics oral exam focused on nonidentity cases. They've got five published verdicts and a specific exam case to analyze. 

  First, I need to understand each verdict clearly. The woman in case 1 says taking the drug wasn't wrong because the child isn't worse off. But in case 2, choosing the embryo with the condition is wrong, not just suboptimal. Case 3 says the teen should've waited even though the child wasn't harmed. Case 4 claims the worse policy is wrong despite no one being affected. Case 5 says waiting is obligatory without a good reason.

  Hmm... the exam case involves choosing between two embryos - one with a very good life, one with a noticeably worse but still worth-living life. The key is predicting the theorist's answer based on consistency with all five verdicts.

  Looking at the principles... person-affecting views struggle with cases 4 and 5 where no one is harmed. Total utilitarianism would call choosing the worse embryo wrong but it conflicts with case 1 where it wasn't wrong to create a worse-off child. Critical-level theories might work but seem too permissive for case 2. 

  The best fit appears to be a two-tiered person-affecting principle: wrong if either (a) harming someone or (b) failing to create better-off people when no costs to others. This explains all cases: case 1 avoids harm, case 2 fails to create better life, case 3 same, case 4 policy fails massively, case 5 fails moderately. 

  For the exam case, transferring the worse embryo would be wrong under this principle - it's failing to create a better-off person for no reason. The follow-up case? Maybe one where creating a slightly worse-off person saves resources for existing people. The rival total utilitarianism would approve that, but our principle would reject it unless existing people benefit substantially.

  The committee might push on whether "better-off" requires lexical superiority or just marginal improvement - that could be the instability point. But overall this framework seems most consistent. Better emphasize how it handles the "wrong but not harmful" cases differently from pure person-affecting views.
answer: |-
  Based on the five verdicts, the theorist holds a **Person-Affecting Asymmetry with a Non-Identity Constraint and a Duty of Beneficence**. Here's the breakdown, prediction, and analysis for your exam case:

  ### Core Principles Consistent with All Five Verdicts
  1.  **Non-Identity Constraint:** An act is *not wrong* if it does not make any particular person worse off than they would otherwise have been (Case 1).
  2.  **Harm Principle:** Wrongness requires making someone worse off (harmed) than they would otherwise have been (Cases 1, 3).
  3.  **Duty of Beneficence:** There is a separate, pro tanto duty to *bring about better lives* or *choose the best available option* when selecting *who* will exist, *even when no one is harmed* by the choice. This duty is distinct from merely avoiding suboptimality; its violation constitutes wrongness (Cases 2, 3, 4, 5).
  4.  **Permissibility vs. Wrongness:** An act can be *wrong* (violates a duty) but still *all-things-considered permissible* if overridden by sufficiently strong countervailing reasons (e.g., Case 5's familial coordination reason). Wrongness is a pro tanto moral failing.
  5.  **Scope of Duty of Beneficence:** This duty applies when:
      *   We are choosing *which specific possible person* to bring into existence (Cases 2, 3, 5, Exam Case).
      *   We are choosing policies affecting *which specific possible future population* will exist (Case 4).
      *   There are *no significant countervailing costs or reasons* to agents or others for choosing the better outcome (Cases 2, 4, 5 "absent a reason").
      *   The alternative life is *significantly better* ("much less good", "much better start", "very much worse", "somewhat better-off").

  ### Prediction for the Exam Case
  **Would transferring the second embryo (the one predicted to have the noticeably less good life) be wrong?**

  *   **Predicted Answer: Yes, it would be wrong.**
  *   **Reasoning:**
      *   **Harm Principle:** Does not apply. Transferring either embryo doesn't harm that specific child; the alternative for each is non-existence. Neither child is worse off than they would otherwise be (consistent with Cases 1 & 3).
      *   **Duty of Beneficence:** Applies directly. The couple is choosing *which specific possible person* to bring into existence. They have two viable options: Child A (very good life) and Child B (noticeably less good life, though still worth living). Choosing Child B fails to bring about the significantly better life available (Child A). There are *no grounds for preferring either* (no countervailing reasons like in Case 5) and no costs cited. This violation of the Duty of Beneficence constitutes wrongness (consistent with Cases 2, 3, 4, 5).
      *   **Permissibility:** While *wrong*, it might be *all-things-considered permissible* if there were strong countervailing reasons (none given here). However, the question asks about *wrongness*, not final permissibility.

  ### Argument for this Interpretation (The One to Bet On)
  This principle best reconciles *all five* verdicts without contradiction:
  *   **Case 1:** Only the Harm Principle applies (no harm, so not wrong). The Duty of Beneficence doesn't apply because there was no choice between specific possible children; there was only one conception event possible at that time.
  *   **Case 2:** Duty of Beneficence applies (choosing between specific embryos). Choosing the worse-off child violates the duty, hence wrong. Harm Principle doesn't apply (child not worse off than non-existence).
  *   **Case 3:** Duty of Beneficence applies (choosing *when* to conceive affects *which specific child* exists). Conceiving the worse-off child violates the duty, hence wrong. Harm Principle doesn't apply (child not harmed).
  *   **Case 4:** Duty of Beneficence applies (choosing a policy determining *which specific future population* exists). Choosing the population with "very much worse" lives violates the duty, hence the policy is wrong. Harm Principle doesn't apply (future people not worse off than non-existence).
  *   **Case 5:** Duty of Beneficence applies (choosing *when* to conceive affects *which specific child* exists). Conceiving now (worse-off child) violates the duty, hence wrong *absent a countervailing reason*. The familial coordination reason *could* make it permissible, but the wrongness (violation of duty) remains. Harm Principle doesn't apply.
  *   **Exam Case:** Perfectly analogous to Case 2 - choosing between specific embryos where one life is predicted to be significantly better. Violating the Duty of Beneficence by choosing the worse embryo is wrong. Harm Principle doesn't apply.

  **Instability?** The verdicts are stable under this interpretation. The key is distinguishing when the Duty of Beneficence applies (choice between specific future persons/populations) and when it doesn't (Case 1 - no alternative specific child was choosable at conception). There's no need to surrender any verdict.

  ### Follow-Up Case to Distinguish from Closest Rival
  **Closest Rival:** *Total Utilitarianism* (Act is wrong if it results in less total wellbeing). Totalism would agree the Exam Case choice is wrong (less wellbeing created) but would *disagree* with the verdict in **Case 1** (creating the deformed child doesn't reduce total wellbeing compared to no child, so not wrong). Our theorist *rejects* Totalism because of Case 1.

  **Follow-Up Case Designed:**
  *   **The Resource Allocation Embryo Choice:** A couple can afford expensive life-saving medical treatment for their existing, severely ill child only if they choose the less expensive fertility path. They have two options:
      1.  **Option A:** Implant Embryo Alpha (predicted to have an *extremely high* wellbeing life). This uses all their resources; their existing child dies.
      2.  **Option B:** Implant Embryo Beta (predicted to have a life *well worth living*, but *noticeably lower* wellbeing than Alpha's). The cost savings allow them to save their existing child, who will then have a life worth living.
      *   *Question:* Would choosing Option B (implanting Beta and saving the existing child) be *wrong*?

  **Answers:**
  1.  **Our Theorist's Principle (Duty of Beneficence + Non-Identity):**
      *   **Harm Principle:** Not violated. Beta isn't harmed (alternative is non-existence). The existing child *is* harmed if not saved (alternative is death), but saving them prevents this harm.
      *   **Duty of Beneficence:** Applies (choosing between specific embryos). Choosing Beta creates a *less good life* than choosing Alpha would. This *prima facie* violates the duty.
      *   **Permissibility/Wrongness:** The violation of the Duty of Beneficence means choosing Beta is *pro tanto wrong*. **However,** the *strong countervailing reason* (saving the existing child's life, preventing significant harm) likely *overrides* this pro tanto wrongness, making Option B *all-things-considered permissible*. The answer to "would it be wrong?" is nuanced: **Yes, pro tanto wrong (because of failing the duty to Beta), but likely all-things-considered permissible.**
  2.  **Total Utilitarianism (Closest Rival):**
      *   **Calculation:** Compare total wellbeing.
          *   Option A: Very High Wellbeing (Alpha) + 0 (Dead Existing Child) = Very High Wellbeing.
          *   Option B: Lower but Positive Wellbeing (Beta) + Positive Wellbeing (Saved Existing Child) = Total Wellbeing (Lower Wellbeing + Positive Wellbeing).
      *   **Verdict:** If the sum of Beta's wellbeing + the existing child's wellbeing is *greater than* Alpha's wellbeing, then Option B is *better* and choosing it is *not wrong*. If the sum is *less than* Alpha's wellbeing, then Option B is *worse* and choosing it *is wrong*. The answer depends entirely on the specific wellbeing levels. **It could be either permissible or wrong, purely based on the sum.** It does *not* inherently involve a pro tanto wrongness for failing to create Alpha.

  **Why it Separates Them:** Our theorist *must* acknowledge a pro tanto wrongness in choosing Beta due to the Duty of Beneficence, even if overridden, because it fails the duty to create the best available specific child. Total Utilitarianism sees *no inherent wrongness* in this failure; wrongness depends *solely* on the final sum. The presence/absence of pro tanto wrongness based on the embryo choice itself is the key difference. This exposes the distinct structure of the Duty of Beneficence principle compared to maximizing total value.
