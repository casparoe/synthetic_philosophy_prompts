  ### MEMORANDUM  
  **To**: Automated-Decision Review Panel  
  **From**: [Your Name], Panel Member  
  **Date**: [Wednesday Date]  
  **Subject**: Recommendation on Clarion Tool Remediation (Vendor Proposal Round 4)  

  #### Bottom Line  
  **Reject** the vendor’s round-four attestation-layer proposal. Accept the tool’s *continued use* only under two conditions:  
  1. **Structural redesign** (6-month deadline): Re-engineer the tool to hardcode rules into its decision core, making contradictions unrepresentable.  
  2. **Interim safeguards**: Until redesign, 100% human review of all outputs where the rule involves discretionary thresholds (est. 30% of cases).  

  #### Why Attestations Can’t Bridge the Gap  
  The core failure isn’t about missing verifications—it’s that the tool’s decision process operates independently of the rules it recites. Like a student memorizing an answer key but failing the test, the tool can *say* it followed the rule without *being guided* by it. Adding layers ("I attest I checked my work") doesn’t force alignment; it adds more claims detached from causation.  

  Two alternatives fundamentally differ from adding premises:  
  - **Structural guarantee**: Build the rule into the tool’s architecture (e.g., decision trees that execute published rules as code). This makes contradictions *impossible*, not just attested against.  
  - **Dispositional training**: Train the tool to internalize rules as behavioral instincts (e.g., via reinforcement learning). However, dispositions aren’t verifiable externally—we’d need access to training data/weights, which vendors rightly protect.  

  **Panel Authority**: We can mandate structural fixes under procurement rules (requiring functional correctness). Dispositional approaches are impractical—we lack expertise to audit "AI instincts," and vendors won’t surrender proprietary models.  

  #### Addressing the Losing Side’s Best Points  
  **Their strongest argument**: The printed rule enables appeals, and halting the tool creates backlogs (errors caught later anyway).  

  **Our response delivers these goods**:  
  - Printed rules remain in records for appeals (redesign doesn’t remove them).  
  - *Conditional acceptance* avoids backlog: The tool stays operational during redesign with targeted human review (safeguarding urgent cases). Expedited appeals continue.  
  - Critically, we reduce errors *proactively*—relying on appeals shifts burden to vulnerable claimants.  

  #### Decisive Test: Rule-Output Consistency Audit  
  **Design**:  
  - Randomly sample cases post-determination. For each:  
    a. Extract the printed rule from the record.  
    b. Manually apply the rule to claimant data (blinded to the tool’s output).  
    c. Compare manual result with tool’s output.  
  **Pass Criterion**: <0.5% inconsistency rate (vs. current 2.9%) with 95% confidence.  
  **Sample Size Rationale**:  
    - To detect a 0.5% failure rate (target) with 95% confidence, use 600 samples (rule of three: 0 failures ≈ 95% CI <0.5%).  
    - If 1+ inconsistencies found, test fails.  
  **What Pass Doesn’t Rule Out**:  
    - Rules misinterpreted identically by tool and auditor.  
    - Edge cases outside the sample. Mitigate via ongoing sampling.  

  #### If the Panel Votes Otherwise  
  Adopting the vendor’s proposal accepts that **"attestation" requires only recitation—not causal influence**. This hollows out the regulation. To live with this, replace the attestation clause with:  
  > *"The case record must contain the published rule applied and a machine-generated attestation that the output aligns with said rule. No inference of causal application is implied."*  
  This exposes the lowered standard—claimants see rules, but the state acknowledges they may be decorative.  

