  We are designing an experiment to illustrate the difference between negative liberty (non-interference), positive liberty (self-mastery), and republican liberty (non-domination). The key is to create a game where in one condition, a veto holder can arbitrarily veto allocations (domination without necessarily interference) and in another, the veto holder must give reasons (non-domination) while keeping the actual interference rate the same.

   The game will have multiple rounds. In each round, participants are allocated chips (or points) by a central allocator (the facilitator or a designated participant) but subject to a veto player. The veto player can overturn the allocation, but in one condition (arbitrary) they can do so without giving a reason, and in the other (reason-giving) they must provide a reason from a pre-published set of criteria that are aligned with the interests of the participants.

   However, we want the actual frequency of vetoes to be the same in both conditions. To achieve this, we will have the veto player follow a script that specifies when to veto in order to keep the veto rate constant across conditions. The reasons given in the reason-giving condition will be based on the same script but will use the published criteria.

   We also want a condition with no veto at all (baseline) and a condition where the veto is present but never exercised (to show the chilling effect of domination without interference).

   The participants will bid for which regime they want to be in, using their chips, and we will see if they are willing to pay more for the reason-giving condition than the arbitrary one, even when the expected veto rate is the same.

   Additionally, we want one round where the veto is present but never used, to see if participants change their behavior in anticipation.

   We have 14 regulars, plus the facilitator. We'll need one veto holder (who is not a regular participant, perhaps the facilitator or a confederate). Alternatively, we can rotate the veto holder role but that might complicate things. Since the veto holder must follow a script, it's better if the facilitator or an assistant plays the veto holder.

   Steps:

   1. Introduction (5 minutes)
   2. Explanation of the allocation game and rules (10 minutes)
   3. Several rounds of the game (about 4 rounds, 10 minutes each, 40 minutes total)
   4. Bidding round (10 minutes)
   5. Debrief (25 minutes)

   Total: 90 minutes.

   Alternatively, we can do:

   Round 1: Baseline (no veto) - to establish a reference.
   Round 2: Arbitrary veto (with a fixed veto rate, say 20% of participants per round)
   Round 3: Reason-giving veto (same veto rate, 20%)
   Round 4: Veto present but never used (0% veto) - to show anticipation effect.

   Then a bidding round for the next round (Round 5) where they choose which regime to be in.

   However, we want to have the same veto rate in Round 2 and Round 3. We can have the veto holder use a predetermined list of which participants to veto in each round, and in the reason-giving condition, use the criteria to justify those vetoes.

   We must keep the veto holder's decisions opaque. We can do this by having the veto holder in a separate room or behind a screen, and the appeals (if any) are made in writing.

