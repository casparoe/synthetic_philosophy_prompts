answer: |-
  **Bottom line:** The fiction/real-life discrimination requirement does the most work, demanding a core mechanism explanation that most theories fudge; the list *is* jointly satisfiable by accounts prioritizing emotional engagement and identification over strict historicity or abstract rule extraction.

  **Desiderata & Reasoning:**

  1.  **Plutarch’s Detail Method (Non-Negotiable):** *Problem:* Explains *how* character is perceived/learned. An account must explain why micro-behaviors (a joke, reaction) are more potent pedagogical tools for virtue than macro-events (battles, laws). It reveals the *mechanism* is likely perceptual/interpretive, not just factual accumulation. Rejecting it guts the core pedagogy.
  2.  **Hagiography Datum (Non-Negotiable):** *Problem:* Demonstrates efficacy isn't tied to factual accuracy. An account must explain *why* stylized, invented narratives can be *more* effective than truthful ones for moral motivation. This directly challenges truth-tracking or purely rational mechanisms as the core driver.
  3.  **Fiction/Real-Life Discrimination (Non-Negotiable & Highest Stakes):** *Problem:* Forces the theory to define the *essential active ingredient*. *Must* pick: Is it the *narrative structure/form* (making fiction equally potent)? Or the *belief in historical reality* (making fiction inherently weaker, contradicting Hagiography)? Or something else (e.g., *perceived* reality enabling identification)? This requirement exposes theoretical vagueness and knocks out accounts that equivocate.
  4.  **Transfer (Non-Negotiable):** *Problem:* Addresses practical relevance. An account must explain how specific historical/cultural actions inspire general dispositions or phronesis in a vastly different context, *without* reducing the life to a mere illustration of a pre-existing rule. It demands an account of how *particulars* inspire *general capacities*.
  5.  **Situationism (Prejudice / Contingent):** *Problem:* Challenges the stability of "character" traits. An account *can* take a stand *against* strong situationism (arguing exemplars display cross-situational consistency *despite* trivial features) or *integrate* it (arguing lives teach sensitivity to context, not rigid traits). Not fatal, but must be addressed – consistency or rejection required.
  6.  **Admiration/Hero-Worship & Resemblance (Feature to Build In):** *Problem:* Identifies inherent psychological biases. This isn't a defect to "fix" but a core aspect of how exemplar identification *works*. A theory must incorporate the tendency for emotional engagement (admiration) to intensify commitment (potential worship) and for selection bias (choosing similar exemplars) as part of the mechanism, not an accidental flaw.
  7.  **Bad Lives (Non-Negotiable):** *Problem:* Shows learning isn't solely from positive models. An account must explain how contrast, warning, negative exemplars, or the process of *comparison itself* (Plutarch’s pairing) instructs virtue, not just direct emulation of the good. Handles the full scope of the pedagogy.

  **Conflict Check:** The Hagiography Datum and Fiction/Real-Life requirement *can* be jointly satisfied. The key is **perceived reality enabling identification/emotion**, not objective historicity. Hagiographies work *because* they are presented/believed as *real* lives of holy individuals, triggering powerful identification and emulative desire in a way fiction often doesn't (even if the *content* is fabricated). The *belief* in reality is the active ingredient that differentiates it from pure fiction for pedagogical effect within this tradition, explaining both the datum and the discrimination.

  **Theory Snapshots vs. List:**

  *   **Admiration-Based Exemplarism:** Excels at Hagiography (admiration driver), Admiration/Hero-Worship (core feature), Plutarch's Detail (admiration triggered by minutiae). Struggles most with Transfer (how admiration for general converts to student's virtue) and Situationism (traits vs. context).
  *   **Narrative-Identity Account:** Excels at Transfer (integrating story into self-concept), Plutarch's Detail (story elements), Bad Lives (contrasting narratives). Struggles most with Fiction/Real-Life (if narrative is key, why isn't fiction enough?) and Hagiography Datum (why *more* moved by stylized fiction-like lives?).
  *   **Moral Perception/Phronesis-through-Cases:** Excels at Plutarch's Detail (perceiving character in particulars), Transfer (developing phronesis for new situations), potentially Situationism (context-sensitivity). Struggles most with Hagiography Datum (how do non-truthful cases cultivate *accurate* perception?) and Admiration's role (underplays emotional driver).
