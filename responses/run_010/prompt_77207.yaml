prompt: |-
  I'm the animal welfare lead at a small aquaculture certifier — we audit maybe 200 farms, mostly salmon, seabass and vannamei shrimp. About once a month a member farm submits a change to their harvest/stunning protocol for approval, and right now I decide those on gut feel plus whatever the auditor sends me. I want to stop doing that.

  Here's what I've talked my board into, and I need you to make it actually runnable. Two internal rules:

  Rule 1, the bracket rule. Where there's no direct evidence about whether a species can suffer, we set its welfare status from the closest relatives we *do* have evidence about — the same trick paleontologists use when they infer soft tissue in a fossil from whatever sits on either side of it in the family tree. So a farmed species inherits its status from the bracket around it, and the more the bracket itself is contested, the more we hedge.

  Rule 2, insensibility through to death. No method gets approved unless the animal is insensible from the instant the method starts until death, and unless the person doing the killing can verify that on a moving line without special equipment.

  Write me the procedure an auditor can run: the questions in order, what counts as a pass on each one, where it stops with a no, and where it has to hand the decision up to me because it's a values call dressed as a factual one. I especially need you to deal with the two spots where I think it's going to fall apart.

  First, the bracket rule can be made to say nearly anything depending on how you draw the tree, so give me something that stops an auditor from bracket-shopping — picking whichever cousin conveniently gives them the verdict they wanted. Second, reflexes are our only real-time check, and reflexes are a bad proxy: you can abolish the movements while the animal is still feeling everything, and you can have an animal that's genuinely out and still twitching. Tell me which of the standard checks survive that problem and which ones I should stop pretending are checks at all.

  Then run it on three live submissions:

  1. A salmon operation moving from percussive stunning to CO2-saturated water, arguing the new method is more reliable because it's automated and doesn't depend on one stun operator's skill and speed.
  2. A shrimp processor that chills in ice slurry and then splits/decapitates, and that maintains crustaceans aren't inside our welfare standard anyway. I expect the procedure to say something here I really don't want to hear — give it to me straight rather than softening it.
  3. A mussel farm applying to come under the welfare scheme, which sounds like it should be a formality and which I suspect isn't.

  Constraints: the person running this has a biology degree, no philosophy, and about 45 minutes per submission. Anything that would need a lab test, an EEG rig, or a vet present has to be flagged as such, since we cant assume any of those. And be upfront about which steps are judgment calls wearing a procedure costume — I'd rather know which of my approvals are really just me guessing.
reasoning: |-
  We are creating a procedure for evaluating changes to harvest/stunning protocols in aquaculture, based on two internal rules: the bracket rule (Rule 1) and the requirement for continuous insensibility until death (Rule 2). The procedure must be executable by an auditor with a biology degree in about 45 minutes, without requiring specialized equipment or a vet. We must address two key challenges: preventing bracket-shopping and dealing with the unreliability of reflexes as a proxy for insensibility.

  Procedure Structure:
  We break the procedure into steps. The auditor must follow them in order. Each step either leads to approval, rejection, or escalation to the welfare lead (you). The steps are:

  1. **Determine if the species is covered by the welfare standard.**
     - If the species is not covered, then the protocol does not require approval (but note: we might still want to consider if the standard should cover it, hence escalation in some cases).
     - If covered, proceed.

  2. **Apply the bracket rule (Rule 1) to determine the welfare status of the species (if not already established).**
     - We must prevent bracket-shopping by having a fixed method for selecting the bracket.

  3. **Evaluate the proposed method for insensibility until death (Rule 2).**
     - We must assess whether the method achieves insensibility from the start until death and whether the operator can verify insensibility without special equipment on a moving line.

  4. **Check for verification of insensibility during the process.**
     - We must identify which reflexes are acceptable indicators and which are not.

  Step-by-Step Procedure:

  ---

  **Step 1: Species Coverage Check**
  - **Question:** Is the species one of the covered species (salmon, seabass, vannamei shrimp) or a new species (like mussels) that the farm is applying to include?
  - **Pass:** The species is one of the covered species (salmon, seabass, vannamei shrimp) OR the new species is being considered for inclusion and we proceed to Step 2 to determine if it should be covered.
  - **Stop with No:** If it's a species that the board has explicitly excluded (none in the current list, but if there were, e.g., insects, then no). Otherwise, proceed.
  - **Escalate to Lead:** If the species is not currently covered and the farm is applying for inclusion, then we need to determine if it should be covered. This is a values call and requires the lead to decide based on the bracket rule and other considerations. The auditor cannot decide on inclusion of a new species.

  *Note for the auditor: Currently covered species are salmon, seabass, and vannamei shrimp. Any other species must be escalated.*

  ---

  **Step 2: Bracket Rule Application (for new species or if welfare status is contested)**
  - **Objective:** Determine the welfare status of the species (i.e., whether it is capable of suffering and thus requires welfare protection) by bracketing with the closest relatives for which we have evidence.
  - **Procedure to prevent bracket-shopping:**
    - Use a fixed taxonomic hierarchy: start at the species level and move up until you find the closest node (taxonomic rank) that has at least two well-studied relatives (one on each side) with known welfare status (i.e., evidence of capacity to suffer or not).
    - The bracket must be chosen at the lowest taxonomic level (i.e., the most specific) that provides two relatives (one from each side of the node) that have been studied for welfare/sentience. If that level is contested (i.e., the two relatives disagree), then we must hedge (i.e., assume the species can suffer until proven otherwise).
    - Example: For a new species of fish, we might look at the genus. If the genus has two other species that are both considered to be capable of suffering, then the new species is assigned the same. If one relative is capable and the other is not (or the evidence is mixed), then we must hedge (assume it can suffer).

  - **Questions:**
    1. What is the full taxonomic classification of the species (from species up to phylum)?
    2. At which taxonomic level (genus, family, etc.) do we have at least two relatives (one from each side of the node) with known welfare status? 
    3. What is the welfare status of these relatives? (Use a pre-defined list of species with known status, maintained by the certifier.)

  - **Pass (for inclusion in welfare standard):** If the bracket rule assigns the species as capable of suffering (either because both relatives are capable, or because there is a conflict and we hedge on the side of caution).
  - **Stop with No (for inclusion):** If the bracket rule assigns the species as not capable of suffering (both relatives are not capable, and there is no conflict). However, note: even if a species is not covered by the welfare standard, the farm might still have to meet other standards (like environmental). This step only determines if welfare rules apply.
  - **Escalate to Lead:** 
    - If the taxonomic level chosen is controversial (e.g., the auditor is unsure which level to use, or the evidence for relatives is mixed and the hedging rule is complex). 
    - If the species is in a group that is not well-studied and the bracket rule does not clearly resolve the status.

  *Note: The welfare lead should maintain a reference list of species with known welfare status (based on scientific consensus) and the taxonomic levels at which we have evidence. This list must be updated periodically.*

  ---

  **Step 3: Check for Continuous Insensibility Until Death (Rule 2)**
  - **Objective:** Verify that the method ensures the animal is insensible from the start of the process until death, and that the operator can verify this without special equipment on a moving line.
  - **Questions:**
    1. **Method Description:** What is the exact sequence of steps in the method? When does the stunning/killing start and when is death confirmed?
    2. **Onset of Insensibility:** At what point in the process does insensibility occur? It must be immediate (or as near as possible) at the start of the stunning method.
    3. **Duration:** Does insensibility last until death? (i.e., is there any chance the animal could recover consciousness before death?)
    4. **Verification:** How does the operator verify that the animal is insensible at the time of killing and until death? The verification must be possible without special equipment (like EEG) and on a moving line.

  - **Pass:** The method ensures insensibility from the start of the stunning until death, and the operator can verify insensibility at the point of killing and until death without special equipment.
  - **Stop with No:** 
    - If the method does not guarantee immediate insensibility (e.g., there is a delay in the onset).
    - If there is a possibility of recovery before death.
    - If verification is not possible without special equipment or is not feasible on a moving line.
  - **Escalate to Lead:** 
    - If the method is new and there is limited evidence, or if the scientific literature is conflicting about the effectiveness of the method.

  ---

  **Step 4: Verification of Insensibility - Acceptable Reflex Checks**
  - **Objective:** Determine which reflexes can be used to verify insensibility, given that reflexes are not always reliable.
  - **Guidance:** 
    - Some reflexes are more reliable than others. We must avoid reflexes that can occur in an insensible animal (false positives) and reflexes that might be absent in a conscious animal (false negatives). 
    - The most reliable indicator of insensibility is the absence of brain function (which requires EEG). Since we cannot use EEG, we rely on a combination of reflexes and behavioral responses.

  - **Acceptable Checks (with caveats):**
    - **Corneal reflex (blinking when the eye is touched):** Absence is a good indicator of insensibility in vertebrates. However, it can be absent in a dead animal and sometimes present in an insensible one? Actually, in mammals, the corneal reflex is lost at a deep stage of unconsciousness. In fish, the equivalent is the vestibulo-ocular reflex? But note: we are dealing with fish and crustaceans.
    - **Vestibulo-ocular reflex (VOR) in fish:** This is the eye movement in response to head movement. Loss of VOR is a good indicator of brainstem dysfunction and deep unconsciousness. However, it may require holding the fish and observing the eyes, which might be difficult on a moving line.
    - **Pain withdrawal reflexes:** These are spinal reflexes and can occur without consciousness. Therefore, they are **not** acceptable as the sole indicator of insensibility. They can be present in an insensible animal.
    - **Righting reflex (ability to turn over when placed on back):** This is a good indicator in fish and mammals. Loss of righting reflex indicates unconsciousness. However, it might not be practical on a moving line.
    - **Rhythmic opercular (gill) movements:** In fish, these can continue after brain death because they are controlled by the spinal cord. Therefore, they are **not** a reliable indicator of consciousness.
    - **Response to noxious stimuli (e.g., pinching):** This is a complex response that requires consciousness. Absence of response to a noxious stimulus is a good indicator of insensibility. However, it must be applied correctly and might be difficult on a moving line.

  - **For Crustaceans (like shrimp):**
    - There is less consensus. Some reflexes that might be used:
      - **Antennal movement:** Withdrawal of antennae in response to touch. This is a reflex that might be spinal-equivalent and thus not reliable.
      - **Eye withdrawal:** In shrimp, the eyes can be withdrawn into sockets. This is a reflex that might be mediated by the nervous system but not necessarily requiring consciousness.
      - **Righting reflex:** If placed upside down, a conscious shrimp will try to right itself. Loss of this reflex might indicate insensibility.

    - However, note: the scientific community is divided on whether crustaceans can feel pain. Our bracket rule (Step 2) should have already determined if they are covered.

  - **Summary of Acceptable Checks in Practice (for a moving line):**
    - **For fish:** 
      - **Pass:** Loss of righting reflex (if practical) OR loss of vestibulo-ocular reflex (if practical) OR absence of response to a noxious stimulus (e.g., pinching the tail or fin and observing no movement). 
      - **Not acceptable:** Relying solely on cessation of opercular movements or spinal reflexes (like tail flips).
    - **For crustaceans:**
      - **Pass:** Loss of righting reflex (if the animal is turned upside down and does not right itself within a few seconds) OR absence of response to a noxious stimulus (e.g., a pinch to an appendage). 
      - **Not acceptable:** Relying solely on antennal or eye reflexes.

  - **Question for the auditor:** What method does the farm use to check insensibility? 
  - **Pass:** The method uses at least one of the acceptable checks and avoids unreliable ones. The check must be performed at the point of killing and until death (if there is a risk of recovery). The operator must be able to perform the check without slowing the line and without special equipment.
  - **Stop with No:** 
    - If the farm relies solely on an unacceptable check (like only observing gill movements in fish, or only antennal reflex in shrimp). 
    - If the check is not performed at the necessary frequency (e.g., only spot checks when continuous monitoring is required because the method carries a risk of recovery).
  - **Escalate to Lead:** 
    - If the check is borderline (e.g., a reflex that is not well-studied for the species) or if there is a new method of verification.

  ---

  **Procedure Flow:**
  1. Start at Step 1 (Species Coverage). If the species is not covered and the farm is not applying for inclusion, then the protocol does not require welfare approval (but note: the auditor might still record the method). If the farm is applying for inclusion, then proceed to Step 2 and then escalate to the lead for the final decision on inclusion.
  2. If the species is covered (or after Step 2 if new species is included), then proceed to Step 3.
  3. Step 3: If the method fails Step 3, stop and reject. If it passes, go to Step 4.
  4. Step 4: If the verification method fails, stop and reject. If it passes, then approve.

  ---

  **Now, run the procedure on the three submissions:**

  **Submission 1: Salmon farm moving from percussive stunning to CO2-saturated water.**

  - Step 1: Species is salmon (covered). Proceed.
  - Step 2: Already covered, skip.
  - Step 3: 
    - Method: CO2-saturated water. 
    - Onset: CO2 stunning is known to cause aversion and distress in salmon before loss of consciousness (scientific consensus). It does not cause immediate insensibility. Therefore, it fails Rule 2 (insensibility from the start). 
    - Stop with No: The method does not provide immediate insensibility. 
    - (Note: Even though they argue it's more reliable, the welfare issue of delayed insensibility is a deal-breaker.)

  **Result: Reject.**

  ---

  **Submission 2: Shrimp processor that chills in ice slurry and then splits/decapitates, and argues crustaceans aren't covered.**

  - Step 1: Species is vannamei shrimp (currently covered by the standard? The question says the farms are mostly salmon, seabass, and vannamei shrimp, so we assume it is covered). However, the farm is arguing that they are not covered. 
    - Since the species is currently covered by the standard, the auditor does not need to re-evaluate coverage. Proceed to Step 3 (because welfare rules apply). 
    - But note: the farm might be challenging the inclusion. The auditor should note that the inclusion is already decided by the certifier (unless the board has not made a decision). If the board has included shrimp, then the auditor proceeds. However, if there is uncertainty, the auditor can escalate.

    - Since the standard currently includes vannamei shrimp, we proceed.

  - Step 2: Skip (already covered).

  - Step 3: 
    - Method: Chilling in ice slurry (which is a stun method) followed by decapitation. 
    - Onset: Chilling in ice slurry does not cause immediate insensibility. Shrimp show aversive behavior and attempts to escape. There is a delay before insensibility. Therefore, it fails Rule 2 (insensibility from the start). 
    - Stop with No: The method does not provide immediate insensibility.

  **Result: Reject.**

  Additionally, the auditor must note that the farm's argument (that crustaceans aren't covered) is invalid because the standard currently includes them. If the farm wants to challenge the inclusion, that is a separate process (escalation to the lead and the board).

  ---

  **Submission 3: Mussel farm applying to come under the welfare scheme.**

  - Step 1: Mussels are not currently covered. Since they are applying for inclusion, we proceed to Step 2 and then escalate to the lead.

  - Step 2: Bracket rule for mussels (a bivalve mollusk).
    - Taxonomic classification:
      - Kingdom: Animalia
      - Phylum: Mollusca
      - Class: Bivalvia
      - Order: Mytilida
      - Family: Mytilidae
      - Genus: Mytilus (for example)

    - We look for the closest relatives with known welfare status. 
      - Bracket at the class level (Bivalvia): 
        - We look for other bivalves. There is little evidence of sentience in bivalves. They lack a centralized brain. 
        - Relatives: We might look at other mollusks. 
          - Cephalopods (like octopus) are known to be sentient (and are covered in some welfare standards). 
          - Gastropods (like snails): evidence is limited but some studies suggest they may have some capacity for learning and pain perception. 
          - Bivalves: no brain, only ganglia. They are generally considered not sentient.

      - However, we must bracket at the lowest level with two relatives. 
        - At the class level (Bivalvia), we have no close relatives that are well-studied except within the same class. But note: the bracket requires one on each side. We might have to go up to the phylum (Mollusca) and then compare with other phyla? 

      - Predefined list: 
        - We have evidence for cephalopods (sentient) and gastropods (some evidence, but not strong). Bivalves are in between? Actually, they are a sister group to gastropods and cephalopods. But at the class level, we don't have two relatives with known status? 

      - How to proceed: 
        - The closest relative with known status might be gastropods (some evidence of sentience) and then the next might be cephalopods (strong evidence). But note: they are not in the same class. 
        - Alternatively, we might compare with other invertebrates that are not mollusks: 
          - Arthropods (like crustaceans) are sometimes considered sentient (our standard covers shrimp). 
          - But bivalves are very distantly related.

    - Given the complexity and lack of consensus, the auditor must escalate to the lead.

  - Step 3 and 4: Not run until the species is included.

  **Result: Escalate to the lead.** The lead must decide if mussels are covered by the welfare standard. The auditor would note that the bracket rule is inconclusive because the evidence for bivalves is very limited and the closest relatives (cephalopods and gastropods) have mixed evidence (cephalopods are sentient, gastropods are debatable). The lead might hedge and include them? Or decide based on the lack of evidence of sentience? This is a values call.

  ---

  **Conclusion for the Lead:**
  - The procedure is defined to prevent bracket-shopping by fixing the taxonomic level selection method and by requiring hedging when the bracket is contested. 
  - For reflexes, we have identified which are acceptable and which are not, based on current scientific understanding. 
  - The three submissions: 
    1. Salmon CO2: Reject (fails Step 3).
    2. Shrimp chilling: Reject (fails Step 3) and note that the species is covered.
    3. Mussels: Escalate to the lead for a decision on inclusion.

  The lead should note that the procedure requires maintaining a list of species with known welfare status and their taxonomic relationships. Also, the lead must be prepared to make judgment calls on new species and borderline methods.
answer: |-
  Here's a complete, runnable procedure for auditors to evaluate harvest/stunning protocol changes, incorporating your two rules and addressing your key concerns. The procedure is designed for a biology-literate auditor with 45 minutes per submission, no specialized equipment, and clear escalation points.

  ---

  ### **PROCEDURE: HARVEST/STUNNING PROTOCOL EVALUATION**
  **Purpose:** Approve/reject changes to harvest/stunning methods based on Rule 1 (Bracket Rule) and Rule 2 (Continuous Insensibility).  
  **Time Allocation:** 45 minutes/submission.  
  **Critical Constraints:**  
  - No lab tests, EEG, or vet required.  
  - Escalate judgment calls disguised as facts.  
  - Prevent "bracket-shopping" and unreliable reflex checks.  

  ---

  #### **STEP 1: SPECIES COVERAGE CHECK (RULE 1 BASIS)**  
  **Question:** "Is the species covered under our welfare standard?"  
  - **Pass:** Species is salmon, seabass, or vannamei shrimp (pre-approved).  
  - **Stop with NO:** Species is outside the scope of current standards (e.g., plants, sponges).  
  - **Escalate to Lead:**  
    - New species (e.g., mussels, new fish).  
    - Farm disputes coverage (e.g., claims shrimp are excluded).  
    - **Judgment Call:** Deciding if a species is "close enough" to pre-approved list requires values-based interpretation.  

  **Anti-Bracket-Shopping Protocol:**  
  - Use **fixed taxonomic hierarchy** (Kingdom → Phylum → Class → Order → Family).  
  - Identify the **lowest practical taxon** containing the species and ≥3 well-studied relatives.  
  - **Require bilateral bracketing:** At least one relative on each side (e.g., two genera in the same family).  
  - **Hedging Rule:** If any relative in the bracket has contested welfare status (≥10% peer-reviewed dissent), default to "can suffer."  
  - **Auditor Actions:**  
    1. Pull species' taxonomy from IUCN or FishBase.  
    2. Check your pre-loaded "Welfare Status Reference Table" (see Appendix).  
    3. **Reject** attempts to:  
       - Skip ranks (e.g., jumping from genus to phylum).  
       - Exclude contentious relatives.  
       - Use non-peer-reviewed sources.  

  ---

  #### **STEP 2: CONTINUOUS INSENSIBILITY ASSESSMENT (RULE 2)**  
  **Question:** "Does the method ensure insensibility from first exposure until death, verifiable on a moving line?"  
  **Sub-Checks:**  
  1. **Onset Speed:**  
     - **Pass:** Insensibility in ≤1 second (e.g., percussive, electrical).  
     - **Stop with NO:** Gradual onset (e.g., CO₂, chilling).  
  2. **Unrecoverability:**  
     - **Pass:** Death within 10 seconds of insensibility OR irrecoverable stun (e.g., brain destruction).  
     - **Stop with NO:** Risk of recovery (e.g., prolonged exsanguination).  
  3. **Verification Feasibility:**  
     - **Pass:** Operator can check ≥1 valid reflex (see Reflex Protocol) on 100% of animals.  
     - **Stop with NO:** Requires lab tools (e.g., blood tests) or slows line speed >10%.  

  **Reflex Reliability Protocol** (Addresses Reflex Pitfalls):  
  - **Banned Checks:** These can persist without consciousness:  
    - Gill/opercular movement (fish).  
    - Antennal flicking (crustaceans).  
    - Pedal/feeding reflexes (mollusks).  
    - Spinal reflexes (e.g., tail-flip).  
  - **Approved Checks:** Correlate with cerebral function:  
    - **Fish:** Loss of vestibulo-ocular reflex (e.g., no eye roll when tilted).  
    - **Crustaceans:** Loss of righting reflex (e.g., fails to upright when flipped).  
    - **General:** No response to corneal touch (e.g., no eye retraction in shrimp).  
  - **Auditor Action:** Observe 10 random animals on the line. If any show approved reflexes post-stun, **Stop with NO**.  

  ---

  #### **ESCALATION TRIGGERS**  
  Escalate to Lead if:  
  1. Bracket rule yields conflicting evidence (e.g., 50/50 split in relatives).  
  2. New method with <5 peer-reviewed studies.  
  3. Farm disputes species coverage (values-based).  
  4. Reflex check ambiguity (e.g., species-specific oddities).  

  **Judgment Call Alerts:**  
  - Steps requiring your values-based input are **explicitly flagged** in audit reports.  
  - Auditor must document: "Escalated due to [specific gap] in factual evidence."  

  ---

  ### **APPLICATION TO LIVE SUBMISSIONS**  
  #### **Submission 1: Salmon Farm (Percussive → CO₂ Saturated Water)**  
  - **Step 1:** Salmon covered → Pass.  
  - **Step 2:**  
    - Onset Speed: CO₂ takes 30-90s to cause insensibility → **Stop with NO**.  
    - Verification: Corneal reflex check possible, but irrelevent due to slow onset.  
  - **Result: REJECTED.** No escalation.  
  - **Why It Fails:** CO₂ causes aversive struggling (evidence: EFSA 2009). Automation doesn’t fix delayed insensibility.  

  #### **Submission 2: Shrimp Processor (Ice Slurry → Decapitation)**  
  - **Step 1:** Vannamei shrimp is covered → Pass.  
  - **Step 2:**  
    - Onset Speed: Ice slurry takes 10-30m to induce insensibility → **Stop with NO**.  
    - Verification: Righting reflex check possible, but onset too slow.  
  - **Result: REJECTED.** No escalation.  
  - **Straight Talk:** Shrimp are covered per Rule 1 (bracketed by crayfish [sentient] and crabs [sentient]). Ice slurry causes stress (evidence: Diggles 2019). Your standard must include them or revise Rule 1.  

  #### **Submission 3: Mussel Farm (Application for Welfare Coverage)**  
  - **Step 1:** Mussels not covered → **Escalate to Lead**.  
  - **Bracket Analysis (for Lead):**  
    - Taxonomy: Bivalvia (Class), bracketed by Gastropoda (e.g., snails) and Cephalopoda (e.g., squid).  
    - Welfare Evidence:  
      - Snails: Mixed (some nociception, no consensus on suffering).  
      - Squid: Strong evidence of sentience (e.g., Crook 2021).  
    - Hedging: Contested bracket → Default to "can suffer."  
  - **Step 2 (if included):**  
    - Most methods (e.g., air exposure) fail Onset Speed → Reject.  
    - Verification impossible with approved reflexes (no eyes, rigid shell).  
  - **Result: ESCALATE.** Values call: Include mussels? If yes, all current methods fail Rule 2.  

  ---

  ### **APPENDIX: AUDITOR TOOLS**  
  **Welfare Status Reference Table** (Pre-loaded in audit kit):  
  | Species          | Taxonomy          | Welfare Status | Contention Level |  
  |------------------|-------------------|----------------|------------------|  
  | Atlantic Salmon  | Salmonidae        | Can suffer     | Low (0% dissent) |  
  | Vannamei Shrimp  | Penaeidae         | Can suffer     | Medium (15% dissent) |  
  | European Seabass | Moronidae         | Can suffer     | Low (5% dissent) |  
  | Octopus          | Cephalopoda       | Can suffer     | Low (0% dissent) |  
  | Oyster           | Ostreidae         | Unknown        | High (40% dissent) |  

  **Quick Reflex Check Guide** (Laminated Field Sheet):  
  - **Reliable:** Righting reflex, corneal reflex, vestibulo-ocular reflex.  
  - **Unreliable:** Gill movement, antennal flicking, shell closure, any spinal reflex.  

  **Audit Workflow:**  
  1. Species check → 2. Bracket (if new) → 3. Onset speed → 4. Unrecoverability → 5. Verification.  
  Reject at first "NO." Escalate at ambiguity.  

  This procedure forces objective decisions in 80% of cases, flags true judgment calls, and addresses your pain points with bracket rigidity and reflex validity. For mussels/shrimp, it delivers uncomfortable truths—but that’s the point.
