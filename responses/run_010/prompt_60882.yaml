prompt: |-
  Ok so this isn't really my fight and I've already regretted agreeing to referee it, but here goes. I'm a postdoc in a cell-bio lab. We have exactly one usable confocal microscope, and only three people in the group are trained on it: me, Marta, and Elias. Back in September, in the kitchen, nobody else around, nothing written down, Elias told Marta she'd have first claim on the scope for all of January, because her grant deadline was mid-February and she needed the imaging done beforehand. Then in late November a new postdoc, Jo, joined — also trained, deadline January 20th — and our PI, who had no idea about the September arrangement, handed out January slots by lottery. Elias drew good ones. Marta said he has to give them to her. He said no. And then the thing metastacized into a three-hour argument about why promises bind in the first place, which is not what anyone had signed up for. Roughly the exchange, as best I can reconstruct it:

  1. **Marta:** You chose to say those words, and that's the entire point of the device. Promising exists precisely so that you can't change your mind once your preferences change. If you could wiggle out every time the balance of reasons shifted, I'd have no use for your promise — I could just estimate your reasons myself.

  2. **Elias:** That's the fallacy right there. Promising isn't a magic trick that lets me bind myself regardless of cost. Keeping it is a real reason but not an infinite one. Jo's position is worse than mine, the PI's lottery is a legitimate procedure I had no hand in, and a kitchen conversation doesn't become a trump card against all of that. Promises bind because they're useful — they generate reliance and let people coordinate — and here coordination has been taken over by a fairer mechanism.

  3. **Marta:** Fine, but notice what you've just said. On your account all I ever got from you in September was evidence about what you'd probably do, plus a reason to rely. That's prediction and expectation-management. So on your view there was no promise at all, and you can't now claim you're keeping the *promise* — there's nothing to keep.

  4. **Elias:** Not quite nothing. What changed is that the practice which gives your kitchen words their meaning wasn't in play. There's an institutional allocation procedure now and there wasn't in September. Promises don't work by sheer willpower; they're moves inside a social game with rules, and when the rules change the moves change meaning. What you extracted from me in September was closer to "please intend to help me," and nothing in the game converts that into a claim-right you can enforce against a third party's schedule.

  5. **Marta:** Then you've conceded my point in disguise. If the force of a promise comes from conventions that could easily have been otherwise, then whether promises bind is a fact about our society, not a moral fact — and we both think breaking a promise would be wrong even among people with no such convention. Also your game story predicts I *couldn't* release you, since the rules aren't mine to change. Obviously I can. And release only makes sense if the obligation is owed *to me* and is mine to control, rather than a contribution to the general good.

  6. **Elias:** Release cuts my way. The fact that it's *your* call shows the obligation exists to protect your interest in controlling what happens to you — which is my welfare-and-coordination story in the only non-spooky version available.

  Neither budged, and I got sent home to look things up, which is how I'm bothering you. Can you go through this move by move and tell me who's actually right at each step — rate each of the six, from clearly mistaken to clearly right, with a sentence or two of justification? Where a move is leaning on a general family of views about promissory obligation (reliance-based, practice/convention-based, second-personal or authority-based, will/autonomy-based, straightforwardly consequentialist) you can name it, but I care way more about whether the move works than about labels, and please don't turn this into a survey of the literature. Then: who's more right overall, what's the biggest thing both of them are ignoring, and — practically — what should Elias do on Monday morning?
reasoning: |-
  Okay, this user is a postdoc caught in the middle of a messy promise dispute between two colleagues about microscope time. They need a referee's ruling on philosophical arguments but also a practical solution. 

  First, let's unpack the layers: 
  The surface problem is about microscope slots, but the real heat is in their meta-debate about promissory obligation. Marta and Elias have turned a scheduling conflict into a philosophy seminar - impressive but unhelpful for lab harmony. 

  Hmm, interesting how both make valid points but miss the institutional context. Marta's fixation on the promise ignores the PI's authority, while Elias' "rules changed" defense feels slippery after he benefited from the lottery. Their abstract debate overlooks key realities: 
  - The PI's authority supersedes informal deals 
  - Jo's emergency deadline creates moral urgency 
  - Lab equipment is a shared resource requiring flexibility 

  The user's hidden request shines through: they need ammunition to shut down this circular argument and restore functionality. Their description ("metastasized," "bothering you") shows exasperation with theoretical bickering. 

  For the move-by-move rating: 
  Marta's opener scores high - promises exist to create stability against changing preferences. But she overreaches by ignoring new variables (Jo's arrival). Elias correctly notes promises aren't absolute but wrongly dismisses the kitchen talk as mere "intentions." Their later moves reveal their core conflict: Marta sees promises as creating personal obligations (will theory), Elias as social tools (practice theory). Neither acknowledges the other's partial truth. 

  Biggest blind spot? The PI's role. This isn't a vacuum - institutional authority trumps private promises. Also bizarre that nobody mentioned Jo's pressing deadline as grounds for renegotiation. 

  Practical verdict: Elias should voluntarily cede some slots. Not because he's "wrong" philosophically, but because: 
  1) His initial commitment created reasonable reliance 
  2) Lab cohesion requires good faith compromise 
  3) He drew favorable lottery slots - hoarding them after his promise looks bad 
  But Marta must accept it's partial relief, not total enforcement of September terms. 

  Final note: The user should nudge them toward the PI for final arbitration. This has escalated beyond peer resolution.
answer: |-
  Here's a move-by-move analysis, followed by the overall verdict, blind spots, and practical advice. Focus is on argumentative strength within the context of promissory obligation theory.

  ### Move-by-Move Rating
  1. **Marta (Clear to Strongly Right)**  
     *Rating:* **✓✓✓** (Strongly Right)  
     She correctly identifies the core function of promising: creating pre-commitment to override future preference shifts. This aligns with the **will/autonomy theory** (promises as exercises of normative control). Her point that promises lose value if revocable when circumstances change is logically sound.  

  2. **Elias (Partially Right, Partially Flawed)**  
     *Rating:* **✓** (Mixed/Leans Right)  
     Correct that promissory obligations aren’t absolute and can be overridden by stronger moral claims (Jo’s urgent deadline). Flawed in implying promises are *only* about coordination (ignores the intrinsic duty emphasized by Marta). His **practice-based/reliance view** is valid but incomplete here.  

  3. **Marta (Strongly Right)**  
     *Rating:* **✓✓✓** (Strongly Right)  
     Exposes a critical weakness in Elias’s position: if promises are merely predictive, they aren’t promises at all. This is a devastating critique of purely **consequentialist/reliance-based** accounts. Promises create obligations, not just forecasts.  

  4. **Elias (Mostly Flawed)**  
     *Rating:* **✗** (Leans Wrong)  
     His "rules changed" argument is weak. Social practices (like promising) persist unless explicitly voided. The PI’s lottery doesn’t inherently nullify prior commitments—it just creates new facts. His claim that the promise was merely "intending to help" is a retrospective downgrade of the commitment. **Practice-based** views don’t support this if the practice wasn’t suspended.  

  5. **Marta (Partially Right, Partially Overreaching)**  
     *Rating:* **✓** (Mixed)  
     Right that promissory obligation feels morally primitive (not *just* conventional), but wrong to claim conventions are irrelevant. **Second-personal authority** (obligations owed *to* someone) explains releasability better than "general good" arguments, but she overstates the case against social embeddedness.  

  6. **Elias (Partially Right)**  
     *Rating:* **✓** (Leans Right)  
     Correct that Marta’s power to release him supports a **reliance/interest-based view**. If promises were magic moral bonds, release wouldn’t be hers to grant. But this doesn’t negate the existence of the obligation pre-release—it just clarifies its purpose.  

  ### Overall Verdict
  **Marta is more right on the promise itself.** Elias made a commitment that reasonably induced reliance, and his attempts to downgrade it to a prediction or intention fail. However, **Elias is right that new moral facts (Jo’s deadline) can override the promise**, even if his reasoning is muddled.  

  ### Biggest Thing Both Are Ignoring
  **The PI’s authority and institutional context.**  
  - The microscope is a *lab resource*, allocated by the PI. Informal promises about its use are subordinate to the PI’s decisions.  
  - Neither acknowledged that the PI’s lottery (however late) is the de facto institutional procedure now. Elias should have escalated the conflict to the PI immediately after Jo joined, not waited for the lottery.  
  - Marta’s demand that Elias "give her his slots" ignores that the slots belong to the *lab*, not Elias personally.  

  ### What Elias Should Do Monday Morning
  1. **Concede Partial Obligation:** Acknowledge his promise created a duty to prioritize Marta within reason.  
  2. **Propose a Compromise:** Offer Marta *some* of his lottery slots (e.g., half), explaining:  
     - Jo’s imminent deadline (Jan 20) is an emergency requiring access.  
     - The PI’s allocation must be partially respected.  
  3. **Involve the PI:** Request the PI mediate or adjust the schedule. Emphasize:  
     - Marta’s reliance on his September commitment.  
     - Jo’s time-sensitive need.  
     - His willingness to sacrifice some slots.  

  ### Why This Works
  - **Morally:** Honors the promise’s core (giving Marta priority) while admitting new constraints.  
  - **Practically:** Avoids tanking lab cohesion. The PI can redistribute slots without invalidating the lottery entirely.  
  - **Realpolitik:** Elias looks cooperative, not defensive. Marta gets material compensation.  

  **Bottom Line:** Promises bind, but lab survival requires adaptability. Elias owes Marta a remedy—but not the whole farm.
