  | **8. Earliness among stars** | No update (not evidence for short-lived civilizations). | **No update**: Birth rank not from random draw; \(R\) (e.g., "technological beings") may not be pre-specifiable naturally. | ✅ | — |

  **Summary of Contradictions**:  
  Only **case 7 (value)** contradicts RRS. To save your belief verdict, amend your value verdict: If counting matters for belief (via RRS), it must matter for value in decisions affecting you (e.g., disutility of being destroyed scales inversely with \(N\)). The cost is abandoning your intuition that "one of me" has constant badness. On balance, surrender the value verdict to preserve coherence.  

