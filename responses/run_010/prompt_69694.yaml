    - **Real difference**: Case 3 fails the chance-driven condition; case 8 also fails the fixed-reference-class condition. \(R\) in case 8 (e.g., "observers in technological civilizations") is harder to pre-specify as a natural kind without knowledge of cosmic history.  
    - **Test for new cases**: Ask: *"Could I have defined \(R\) before knowing \(N\) or my era?"* and *"Is my position random relative to \(R\)?"* Both must hold to update.  

  This difference doesn't assume your conclusion—it uses testable criteria (random sampling, pre-specifiable \(R\)).  

