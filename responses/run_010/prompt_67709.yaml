prompt: |-
  Retired union guy, now basically the volunteer archivist for my local — boxes of minutes, a scrapbook, three plaques, a local paper that went under in the 90s. I've been reading around the memory-and-history stuff for fun and I keep hitting a wall: there's a pattern I see constantly and I don't have a word for it that fits.

  Two examples, both from my own local.

  Our founding story, told every spring at the memorial, is that the men walked out of the mill because a young kid got crushed in the line shaft and the company refused to shut it down. The minutes and the paper say the walkout was over a ten percent cut, and the death came eleven days later, in the middle of the strike. I put the minutes in the newsletter with photocopies. Nobody argued. Two of the old-timers thanked me and said it was about time someone pinned the dates down. At the memorial the next year the president told it exactly the way it's always been told, death first, and those same two were nodding along — not lying, not embarrassed, and they'd have recited the right dates if you'd quizzed them on the spot.

  Second one: the plaque in the hall credits a business agent with saving the pension in '76. A woman on the staff did most of the actual work and he signed the letters. Her family got the record corrected in writing, the local voted to accept the correction, and a decade later the anniversary dinner story is still about him, told by people who know otherwise. It happens alot, in smaller ways too.

  So: does this have a name? A group that takes a factual correction on board, sincerely, and the correction just never reaches the story it actually performs. It isn't denial, they aren't resisting the evidence. It isn't forgetting, they retain the correction fine. It isn't propaganda, nobody's coordinating it and the tellers aren't deceived. And its not quite "myth" as people usually mean that word, because nobody is fooling themselves about the facts.

  I've half-heard of collective memory, and invented tradition, and "memory versus history" as a slogan. Tell me which of those comes closest and exactly where each one fails to cover what I'm describing — I want the boundaries drawn, not a reading list. If none of them is it, coin something and define it properly: what counts as an instance, what doesn't, and above all how you'd tell my thing apart from (a) a group that's just wrong and doesn't know it, (b) a group that knows it's telling a story and half-winks at it, the way everyone does with national founding myths, and (c) a group that has buried the correction so it isn't even available to anyone. Is the difference in what people believe, or in where the belief sits, or something else entirely?

  And if you have a view on the ought side — whether the telling or the record is the one that should give way when they collide — say it, but do the carving first.

  Last thing: be straight with me about confidence. Tell me how sure you are about the nearest-concept mapping, and single out the one claim in your whole answer you're least certain of. I'd much rather have an honest hedge than a tidy taxonomy you're improvising as you type.
reasoning: |-
  Okay, let me try to unpack this retired union archivist's query. He's observed a fascinating pattern in his local's history where factual corrections get accepted but don't change the actual stories told. He wants precise conceptual boundaries - not just labels.

  Hmm, his two examples are telling. First, the founding story where chronology gets flipped despite documented evidence being acknowledged. Second, the pension credit misattribution that persists even after official correction. What's striking is how people hold both versions without conflict - they'll cite correct dates if asked but default to the traditional narrative in ceremonies.

  The existing terms he mentions don't quite fit. Collective memory is too broad - it covers this but also includes cases of genuine ignorance. Invented tradition usually implies conscious creation, which isn't happening here. Memory vs history is a dichotomy, not a mechanism. 

  I recall Ann Rigney's work on cultural memory - how communities sustain narratives through repetition despite contradictory evidence. The key is narrative inertia: the story's function outweighs factual accuracy. The memorial isn't a history lesson; it's performing solidarity. The pension story maintains leadership continuity.

  For differentiation:
  - Case (a) is simple ignorance - they lack the correction entirely
  - Case (b) involves conscious artifice, like winking during national myths
  - Case (c) is suppression - the correction gets buried

  Here, the correction exists but remains "inert". It's compartmentalized: stored as data but not integrated into lived narrative. The plaque's factual update lives in archives while the dinner speech draws from communal identity.

  Confidence check: The narrative inertia framing feels solid (80%), but I'm less certain about calling it "memetic sedimentation" as the best term (60%). The ought question is trickier - functionally, the story serves its purpose, but ethically, the woman's erasure matters. Maybe maintain both: ritual telling for cohesion, documented truth for justice.

  The archivist's frustration makes sense - he's preserving facts that the community respects but doesn't use. That tension between record and ritual might be where the real insight lies.
answer: |-
  Here's a precise conceptual carve-up, with confidence ratings and boundaries:

  **Core Concept:** This is **Narrative Inertia within Ritualized Memory**.  
  *Definition:* The persistence of a functionally significant communal story in its established form despite conscious acceptance of corrected facts, due to its embedded role in identity-reinforcing practices (e.g., memorials, anniversaries). The corrected fact exists as *archival knowledge* but doesn't displace the *performative narrative*.

  ### Why Closest Concepts Don't Fully Fit:
  1.  **Collective Memory:**  
      *Fits:* Captures shared, emotionally resonant stories shaping group identity.  
      *Fails:* Too broad. Encompasses cases where groups are genuinely unaware of corrections (your case *a*) or actively suppress them (case *c*). Your cases involve *acknowledged* corrections that don't alter performance.
  2.  **Invented Tradition (Hobsbawm):**  
      *Fits:* Highlights the constructed nature of rituals/narratives serving present needs.  
      *Fails:* Implies deliberate creation or significant alteration. Your stories evolved organically; the *correction* is deliberate, but the *persistence* of the uncorrected version isn't. It's inertia, not invention.
  3.  **Memory vs. History (Nora):**  
      *Fits:* Contrasts lived memory ("milieux de mémoire") with documented history ("lieux de mémoire").  
      *Fails:* Presents them as distinct realms. Your cases show **active coexistence**: the historical fact (document) and the memorial story (ritual) are *both* held by the same people. The "wall" is selective functional separation, not ignorance.

  ### Boundary Drawing: Your Case vs. Key Contrasts
  *   **vs. (a) Group Just Wrong/Unaware:**  
      *Difference:* In (a), the correction is *unavailable* or *unaccepted*. In your cases, the correction is *known and accepted* as archival truth. The test: Ask individuals directly; they'll cite the correction accurately outside the ritual context.
  *   **vs. (b) Conscious Storytelling/Winking:**  
      *Difference:* In (b), people acknowledge the narrative's embellishment *as they tell it* (the wink). In your cases, **there's no performative irony**. The story is told sincerely *as the functional truth of the event* during the ritual, even while knowing the archival fact elsewhere. The narrative is treated as *truer to the meaning*.
  *   **vs. (c) Buried Correction/Suppression:**  
      *Difference:* In (c), effort is made to *destroy* or *prevent access* to the correction. In your cases, the correction is documented, accessible, and acknowledged. It simply lacks the *affective and ritual weight* to displace the narrative.

  ### The Crucial Difference: Location & Function of Belief
  *   **Archival Belief:** Exists as cold, factual knowledge ("The walkout was over pay; the death happened during the strike"). Stored in the "history" compartment. Used for reference, accuracy.
  *   **Narrative Belief:** Exists as the *emotionally resonant, identity-constituting story* ("They walked out over the boy's death!"). Stored in the "who we are" compartment. Activated in *performative, communal rituals* (memorials, dinners).  
  *   **The Wall:** It's **compartmentalization based on function**. The corrected fact doesn't *migrate* to the narrative compartment because the narrative isn't primarily evaluated on factual accuracy in that space; it's evaluated on its *meaning-making and bonding power*. The narrative persists due to **memetic sedimentation** – its deep embedding in ritual practice makes it resistant to change even by acknowledged facts.

  ### Coined Term & Definition
  **Memetic Sedimentation in Ritual Frames**  
  *   **What Counts:** A communal narrative, central to group identity and performed in ritual contexts, persists unchanged despite the group's conscious acceptance and archival retention of corrected facts contradicting key elements of the narrative. The correction is inert within the ritual frame.  
  *   **What Doesn't Count:**  
      *   Ignorance of the correction (case *a*).  
      *   Conscious performance of "myth" with ironic detachment (case *b*).  
      *   Active suppression of the correction (case *c*).  
      *   Genuine forgetting of either version.  
      *   Minor embellishments that don't alter core meaning.

  ### The "Ought" (Briefly)
  *   **Record Should Not Give Way:** The archival truth is essential for justice (e.g., the woman's contribution), historical accountability, and preventing erosion of factual integrity.  
  *   **Ritual Telling May Not (and Perhaps Cannot) Fully Give Way:** The narrative serves a vital, non-factual purpose (solidarity, moral clarity). Suppressing it may harm cohesion.  
  *   **The Ethical Path:** **Conscious Integration & Nuance.** Present the complexity *alongside* the ritual. At the memorial: "We gather remembering young [Name] whose tragic death, *occurring as our founders stood firm against injustice*, ignited our enduring spirit..." Acknowledge both the archival trigger (pay cut) *and* the death as the defining moral event within the strike. For the plaque: Add a companion plaque honoring the staff member's crucial role. Don't erase the ritual, but *contextualize* it with the fuller truth.

  ### Confidence Assessment
  1.  **Highest Confidence (90%+):** Rejecting "denial," "forgetting," "propaganda," and "myth" (in its common sense) as mis-fits. Distinguishing your cases clearly from (a), (b), and (c) based on *access and acknowledgment* of the correction.
  2.  **High Confidence (80%):** Identifying **Narrative Inertia** and **Compartmentalization** (archival vs. ritual/performative belief) as the core mechanisms. The centrality of **Ritual Performance** in sustaining the narrative.
  3.  **Moderate Confidence (70%):** Framing it specifically as **Memetic Sedimentation in Ritual Frames**. While the *phenomenon* is clearly described, coining the perfect *term* is inherently tentative. Alternative terms like "Ritual Narrative Persistence" or "Functional Narrative Inertia" could be argued. The *definition* of the coined term is solid; the *label* itself might be refined.
  4.  **Lowest Confidence (60%):** The specific claim that **"nobody is fooling themselves about the facts"** *in all instances*. It's possible that *some* individuals (perhaps newer members) hearing *only* the ritual narrative might internalize it as the full factual truth, blurring the line with case (a) for those individuals, despite the leadership's knowledge. The system *enables* this potential downstream factual drift, even if the core actors maintain the compartmentalization.

  This phenomenon is fundamentally about **the power of story over fact in spaces where identity and belonging are performed.** The record holds the facts, but the ritual holds the soul of the group – and souls are stubborn things.
