prompt: |-
  I am a staff software engineer on a reliability team. I have no formal training in philosophy, but for the past year I have been running an eight-week internal seminar for twelve engineers on causal inference. We approach the subject mostly from the machine-learning side — structural equation models, DAGs, the do-operator — and, more tentatively, from the philosophical side, where I have tried to give them both a Lewis-style counterfactual account of causation and the interventionist response to it (Woodward's philosophical thesis, which I understand to be a different thing from Pearl's formal apparatus even though the two are usually mentioned in the same breath). My participants are strong formalists and weak metaphysicians: they can manipulate a causal graph fluently but tend to treat any philosophical question as either trivially settled or unanswerable, and they have a habit of ending discussions by saying that causation is just about interventions, full stop. For our final session I need one essay question, answerable in sixty minutes and worth thirty marks in three parts, that they cannot pass by reciting that correlation is not causation, that Pearl formalised interventions, or that Lewis analysed causation as counterfactual dependence between possible worlds. What I want the question to do is force them to decide whether the two frameworks ever genuinely disagree — about truth, not about notation — and, when they do, to say what kind of disagreement it is: a substantive metaphysical one, or a dispute about what causal talk is in the business of doing.

  Here is the scenario I want the question built on. I drafted it myself and I am not confident I have described it correctly. Our deployment pipeline ships a canary build and two independent checks watch it. The first is an automated error-rate monitor that issues a rollback when the error rate crosses a threshold. The second is the on-call engineer, who watches the same dashboard and can also issue a rollback. A deduplication policy in the pipeline accepts only one rollback command: if the monitor has already issued one, any later command from the engineer is discarded before it reaches the deployment controller. On the night in question a bad build ships, the monitor fires at 02:14 and the rollback succeeds; the on-call engineer noticed the same spike, reached for the same command at 02:15, and was silently suppressed. Two further features matter and I want students to have to reason about both rather than pick the easy one. First, the monitor's threshold had been lowered the previous afternoon by a configuration change made by an unrelated team, so the rollback arrived roughly ninety seconds earlier than it otherwise would have; students should have to say what caused the rollback, what caused the rollback's timing, and whether these are two causal facts or one fact under two descriptions. Second, the incident review afterwards blamed our deployment frequency — we ship about forty times a day, and the reviewer's claim is that this rate is what made a bad build reach the canary at all, though nobody can describe an intervention on "deployment frequency" that is not simultaneously an intervention on team size, release tooling, on-call staffing and the product roadmap. A colleague who has read some philosophy told me my first feature is textbook early preemption and that the deduplication layer turns it into late preemption instead; I could not tell which of us was right, and that is part of why I want the last deliverable below.

  Please produce four things. (1) The question stem, entirely self-contained: every detail a student needs must be inside the stem, with no required background reading and no expectation that they know any particular paper, although the standard labels for the two positions are fine to use. Three parts, with mark allocations that add to thirty and that I can rebalance. (2) A model answer of roughly nine hundred words, written as a strong participant would write it in the time available. (3) A marking scheme that names, part by part, the specific moves that earn credit rather than the topics that must be mentioned — for instance, distinguishing at the right point between the two accounts agreeing on the truth of a causal claim and merely agreeing on how to symbolise it — followed by a separate list of five errors that should cost marks, each with a one-line diagnosis of the misunderstanding it reveals. I expect at least one of those five to be the error of treating the do-operator as a metaphysical relation rather than an operation defined relative to a model, and at least one to be the error of assuming that because the two accounts can agree on the verdict in my scenario they cannot disagree anywhere; but please choose the rest yourself, and make them errors my engineers would actually commit. (4) A short instructor's note addressed to me, since I cannot evaluate the philosophy on my own: tell me whether my scenario is malformed or ambiguous in any way that would let a student answer a question other than the one I intend, adjudicate the early-versus-late preemption dispute between me and my colleague, and say which verdict on the blocked engineer is the defensible one and why. Two further constraints. No bibliography, reading list, or citations anywhere, and nothing that depends on a specific quotation. And please do not let the model answer retreat into a both-sides shrug: the question should have a crux, and the model answer should take a position on it and defend it.
reasoning: |-
  We are designing an essay question for a final session on causal inference. The goal is to force students to confront whether the interventionist (Woodward-style) and counterfactual (Lewis-style) accounts of causation can genuinely disagree in a substantive way, and if so, what kind of disagreement it is. The scenario involves a deployment pipeline with a canary build, an automated monitor, and an on-call engineer, with a deduplication policy. There are two key features: one about the timing of the rollback due to a configuration change (which introduces preemption) and another about the deployment frequency being blamed for the bad build reaching the canary.

  The question should be self-contained and have three parts. The model answer should take a position and defend it. The marking scheme should specify credit-worthy moves and list common errors.

  Let's break down:

  1. **Question Stem**: Must include all necessary details. We have:
     - Deployment pipeline with canary build.
     - Two independent checks: automated error-rate monitor and on-call engineer.
     - Deduplication policy: only one rollback command accepted; if monitor issues first, engineer's command is discarded.
     - On the night: bad build ships, monitor fires at 02:14, rollback succeeds. Engineer tries at 02:15, is suppressed.
     - Configuration change: monitor's threshold lowered the previous afternoon, causing rollback to be 90 seconds earlier than it would have been otherwise.
     - Incident review: blames deployment frequency (40 times a day) for the bad build reaching the canary, but note that interventions on deployment frequency are confounded with other factors (team size, tooling, etc.).

     We need to frame the question to make students compare the two accounts and decide if they disagree in this scenario and in general.

     Three parts (with mark allocations adding to 30):
     - Part A (10 marks): Analyze the first feature (the rollback and its timing) under both the interventionist and counterfactual accounts. What caused the rollback? What caused the timing? Are these two causal facts or one?
     - Part B (10 marks): Analyze the second feature (the deployment frequency as a cause). How would each account handle the claim that the deployment frequency caused the bad build to reach the canary? In particular, address the challenge that we cannot intervene on deployment frequency without intervening on other factors.
     - Part C (10 marks): Based on your analysis in A and B, discuss whether the two frameworks (interventionist and counterfactual) ever genuinely disagree about causal truths (not just notation). If they do, what kind of disagreement is it? (Substantive metaphysical, or about the purpose of causal talk?)

  2. **Model Answer (900 words)**: Written as a strong participant. It should take a position and defend it. We'll argue that the two accounts can disagree, and the disagreement is about the purpose of causal talk, not metaphysics.

  3. **Marking Scheme**:
     - For each part, list specific moves that earn credit.
     - Then, a list of 5 errors with one-line diagnosis.

     Example errors:
     - Treating the do-operator as a metaphysical relation (instead of relative to a model).
     - Assuming that because the accounts agree in this scenario, they cannot disagree anywhere.
     - (We need three more common errors)

  4. **Instructor's Note**: Address whether the scenario is malformed, adjudicate early vs. late preemption, and say which verdict on the blocked engineer is defensible.

  Let's design the question stem:

  ---

  **Question Stem**

  Consider the following scenario:

  Our deployment pipeline ships a canary build. Two independent checks watch it: an automated error-rate monitor and an on-call engineer. The monitor issues a rollback command when the error rate crosses a preset threshold. The engineer, watching the same dashboard, can also issue a rollback command. A deduplication policy in the pipeline ensures that only one rollback command is accepted: if the monitor has already issued a command, any subsequent command from the engineer is discarded before reaching the deployment controller.

  On a particular night, a bad build ships. The monitor fires at 02:14, and the rollback succeeds. The on-call engineer noticed the same spike and attempted to issue a rollback command at 02:15, but this command was silently suppressed because the monitor had already acted.

  Two further features are relevant:

  1. A configuration change made by an unrelated team the previous afternoon lowered the monitor's threshold. As a result, the monitor fired approximately 90 seconds earlier than it would have without the change. Therefore, the rollback occurred at 02:14 instead of, say, 02:15:30.

  2. An incident review after the event blamed the high deployment frequency (about 40 times per day) for the bad build reaching the canary in the first place. However, note that it is impossible to describe an intervention that changes only the deployment frequency without simultaneously changing other factors (such as team size, release tooling, on-call staffing, or the product roadmap).

  Answer the following three parts:

  **Part A (10 marks)**
  Using both the interventionist (Woodward-style) and counterfactual (Lewis-style) accounts of causation, analyze the first feature:
  - What caused the rollback? 
  - What caused the rollback to occur at 02:14 (as opposed to later)? 
  - Are these two causal facts, or one fact under two descriptions?

  **Part B (10 marks)**
  Using both accounts, analyze the second feature: the claim that the deployment frequency caused the bad build to reach the canary. Address the challenge that interventions on deployment frequency are confounded with other factors. How does each account handle such a claim?

  **Part C (10 marks)**
  Based on your analysis in Parts A and B, do the interventionist and counterfactual accounts ever genuinely disagree about causal truths (not just about notation)? If they do, what kind of disagreement is it: a substantive metaphysical one, or a dispute about what causal talk is in the business of doing? Defend your answer.

  ---

  Now, the model answer. We'll write it as a strong participant, taking the position that the accounts can disagree and that the disagreement is about the purpose of causal talk.

  **Model Answer**

  **Part A**

  Under both the interventionist and counterfactual accounts, the rollback was caused by the automated monitor. The monitor's action at 02:14 satisfied the deduplication policy, leading to the rollback and preempting the engineer. However, the accounts diverge on the timing.

  For the interventionist, causation is defined by interventions. We ask: if we were to intervene on the configuration change (setting it to its original threshold), would the rollback time change? Yes: without the change, the monitor would have fired about 90 seconds later. Thus, the configuration change caused the timing. The rollback itself, however, would still have occurred (just later) because the monitor would have fired anyway. So the cause of the rollback (the event) is the monitor, and the cause of the timing is the configuration change.

  For the counterfactual account (Lewis), we consider the closest possible worlds. The rollback occurred at 02:14. Without the configuration change, the rollback would have occurred at 02:15:30 (by the monitor). Therefore, the configuration change is not a cause of the rollback (since the rollback would have occurred anyway), but it is a cause of the timing. However, note the deduplication policy: without the configuration change, the engineer might have acted first? But in the actual world, the engineer acted at 02:15, which is after 02:14 but before 02:15:30. Without the configuration change, the monitor would fire at 02:15:30, but the engineer would have tried at 02:15 (if we assume the same reaction time). Since 02:15 is before 02:15:30, the engineer would have triggered the rollback first. Therefore, without the configuration change, the rollback would have been caused by the engineer, not the monitor. Thus, the configuration change is a cause of the rollback happening (because without it, the engineer would have caused it, so the monitor causing it is contingent on the configuration change). But wait, that contradicts the interventionist? 

  Alternatively, if we assume that without the configuration change the engineer would not have acted (because the spike might not have been as severe, but the scenario says the same spike was noticed) and that the engineer's reaction time is fixed, then without the configuration change the monitor would fire at 02:15:30 and the engineer at 02:15? Then at 02:15 the engineer would have triggered the rollback, and the monitor's later attempt would be suppressed. So the rollback would have occurred at 02:15 by the engineer, not by the monitor. Therefore, in the counterfactual account, the configuration change is a cause of the rollback happening (because without it, the rollback would have been done by the engineer, so the event of the monitor causing the rollback wouldn't have occurred). However, the rollback event (as an outcome) would have occurred anyway, but by a different cause. But Lewis typically focuses on whether the effect occurs and by what means.

  This is tricky. Lewis's account might consider the event of the rollback at 02:14 by the monitor. Without the configuration change, that event does not occur. Instead, a different event (the rollback at 02:15 by the engineer) occurs. So the configuration change is a cause of the rollback at 02:14 by the monitor. But the overall rollback (as a type) would have occurred anyway, but as a token event, it is different. 

  To avoid confusion, we can separate: the effect "rollback occurred" is true in both worlds, so the configuration change is not a cause of the rollback occurring. But the timing and the actor are part of the effect. We might say the configuration change caused the rollback to occur at 02:14 and by the monitor.

  In contrast, the interventionist can model this by intervening on the configuration and seeing the change in time and actor. The interventionist would say the configuration change caused the timing and the actor (monitor vs engineer).

  But note: the question asks for the cause of the rollback and the cause of the timing. The interventionist would separate: the monitor caused the rollback, and the configuration change caused the timing. The counterfactual account might say the configuration change caused both the fact that the monitor caused the rollback and the timing.

  This is a subtle difference. But in this scenario, both accounts might agree that the configuration change affected the timing and the actor, but they might describe it differently.

  However, the preemption is key. The counterfactual account must handle preemption. In this case, the configuration change made the monitor act first, preempting the engineer. Without it, the engineer would have acted first. So the configuration change is a cause of the rollback happening as it did (by the monitor at 02:14).

  But for the rollback occurring at all: without the configuration change, the rollback would still have occurred (by the engineer). So the configuration change is not a cause of the rollback occurring, but it is a cause of the manner of the rollback.

  This leads to the question: are the rollback and its timing two facts or one? Both accounts might treat them as distinct. The interventionist would say the configuration change caused the timing, but not the rollback itself. The counterfactual account might say the configuration change caused the timing and the actor, but not the existence of a rollback.

  Thus, they might agree on the causal facts but describe them differently. But note: the counterfactual account might be more inclined to consider the entire event, while the interventionist can isolate variables.

  **Part B**

  For the deployment frequency causing the bad build to reach the canary: the interventionist account requires that we can meaningfully intervene on deployment frequency. However, the scenario states that any intervention on deployment frequency inevitably changes other factors (team size, etc.). Therefore, we cannot isolate the effect of deployment frequency. The interventionist would likely reject the claim because it is not possible to define an ideal intervention on deployment frequency alone. We cannot test what would happen if only deployment frequency changed.

  The counterfactual account, however, can consider counterfactuals without requiring interventions. We can ask: if the deployment frequency had been lower, would the bad build have reached the canary? But the problem is that we cannot specify how the world would be different. If we imagine a world with lower deployment frequency, we must also change other factors. The counterfactual account requires a specification of the closest possible world. If the closest world with lower deployment frequency is one where the same team and tools are used but they deploy less often, then we can evaluate. But the scenario says that deployment frequency is tied to these other factors. So the closest world might be one where the team is smaller, for example. Then the bad build might not have been created at all. Thus, the counterfactual account might not support the claim because in the closest world with lower deployment frequency, the bad build might never have been deployed.

  However, if we consider a world where deployment frequency is lower but everything else is as similar as possible, we might have to change the team's behavior arbitrarily. The counterfactual account might be more flexible but also more ambiguous. The interventionist account is more constrained and might reject the claim because of the confounding.

  Thus, the interventionist account is likely to reject the causal claim about deployment frequency, while the counterfactual account might accept it under some interpretations of closeness. This shows a potential disagreement.

  **Part C**

  The two accounts can genuinely disagree. In Part A, they might converge, but in Part B, they diverge. The interventionist account is more restrictive: it requires the possibility of interventions, which in this case is not met. The counterfactual account does not have that requirement and can evaluate counterfactuals even in contexts where interventions are impossible. However, the counterfactual account depends on the specification of closeness, which can be context-dependent.

  The disagreement is not merely about notation but about what counts as a causal relation. The interventionist ties causation to what we can manipulate, while the counterfactual account ties it to a broader notion of dependence across possible worlds. This is a dispute about what causal talk is for. The interventionist sees causation as a guide to action, while the counterfactual account sees it as a way to understand dependencies.

  Therefore, the disagreement is about the purpose of causal talk: one is intervention-oriented, the other is explanation-oriented. They might agree in many cases (like Part A) but disagree in cases where interventions are not feasible (Part B). This is not a metaphysical disagreement about what causation is in the world, but about the criteria we use to pick out causal relations.

  ---

  **Marking Scheme**

  **Part A (10 marks)**
  - Correctly identifies under both accounts that the monitor caused the rollback (1 mark).
  - For interventionist: explains that an intervention on the configuration change would change the time, so the configuration change caused the timing (2 marks).
  - For counterfactual: explains that without the configuration change, the rollback would have happened at a different time and by the engineer, so the configuration change caused the timing and the actor (2 marks).
  - Discusses the preemption: without the configuration change, the engineer would have acted first (1 mark).
  - Addresses whether the rollback and its timing are two causal facts or one: argues they are distinct (1 mark) or explains why they might be seen as one (1 mark). [Either view can be credited if argued well, but must be addressed.]
  - Quality of reasoning: clarity and coherence (2 marks).

  **Part B (10 marks)**
  - For interventionist: notes that an ideal intervention on deployment frequency is impossible due to confounders, so the causal claim is not supported (2 marks).
  - For counterfactual: notes that the truth of the counterfactual depends on how we set the closest world (2 marks).
  - Explores at least two ways the counterfactual might go: e.g., if we hold everything else fixed (impossible) or adjust confounders (2 marks).
  - Concludes that the interventionist would reject the claim, while the counterfactual might accept or reject depending on closeness (2 marks).
  - Quality of reasoning (2 marks).

  **Part C (10 marks)**
  - States that the two accounts can disagree (1 mark).
  - Uses Part B as an example of disagreement (2 marks).
  - Argues that the disagreement is not merely notational but about what counts as a causal relation (2 marks).
  - Identifies the disagreement as being about the purpose of causal talk (intervention vs. explanation) rather than metaphysics (3 marks).
  - Quality of argument and defense (2 marks).

  **Common Errors (with one-line diagnosis)**

  1. **Error**: Treating the do-operator as a metaphysical relation rather than an operation defined relative to a model.  
     **Diagnosis**: Fails to understand the formal, model-relative nature of interventions.

  2. **Error**: Assuming that because the two accounts agree on the verdict in the scenario of Part A, they cannot disagree in other scenarios.  
     **Diagnosis**: Overgeneralizes from a single case and ignores the possibility of divergence.

  3. **Error**: Claiming that the counterfactual account requires interventions to define counterfactuals.  
     **Diagnosis**: Confuses the interventionist's use of counterfactuals (via interventions) with the Lewisian account.

  4. **Error**: Ignoring the deduplication policy in the counterfactual analysis of Part A, leading to an incorrect counterfactual (e.g., assuming that without the configuration change the monitor would still have acted first).  
     **Diagnosis**: Fails to incorporate a key structural feature of the scenario.

  5. **Error**: Asserting that the deployment frequency claim in Part B is either clearly causal or clearly not causal without engaging with the challenges of each account.  
     **Diagnosis**: Superficial treatment that does not recognize the accounts' differing constraints.

  ---

  **Instructor's Note**

  Your scenario is well-formed but has one ambiguity: the exact timing of the engineer's attempt. You state the engineer tried at 02:15, which is after the actual rollback (02:14). Without the configuration change, the monitor would fire at 02:15:30. But the engineer tried at 02:15 in the actual world. We must assume that in the counterfactual world without the configuration change, the engineer still tries at 02:15 (because the same spike occurs and the engineer's reaction time is the same). Since 02:15 is before 02:15:30, the engineer would have triggered the rollback first. Therefore, the configuration change preempted the engineer by making the monitor act first. This is **late preemption** because the engineer's process was already underway (they were about to press the button) but was cut off by the deduplication policy. However, note that the engineer's command was at 02:15, after the monitor's action. So in the counterfactual world, the engineer acts at 02:15 and the monitor at 02:15:30, so the engineer would have been first. The configuration change caused the monitor to preempt the engineer. This is a case of **early preemption** of the engineer's potential action? Actually, the preemption is early because the monitor's action at 02:14 prevented the engineer's action (at 02:15) from having any effect. But without the configuration change, the engineer would have acted first and preempted the monitor. So the configuration change switched the preemptor. This is a standard preemption case, but it's not clearly early or late. However, the key is that the engineer's process did not complete (because the command was suppressed). So it's late preemption? 

  In philosophy, early preemption is when the backup process is interrupted before it can even start, while late preemption is when it runs but is cut off before producing the effect. Here, the engineer started (noticed the spike, reached for the command) but the command was suppressed. So it's late preemption. But note: the engineer's process was ongoing and was preempted by the deduplication policy when the monitor acted. Without the monitor acting first, the engineer would have completed the action. Therefore, it's late preemption of the engineer's action. However, the configuration change caused the monitor to act early, which in turn caused the preemption. So the preemption is late, but the cause (configuration change) is an early event.

  For the verdict: the defensible position is that the configuration change caused the rollback to occur at 02:14 and by the monitor, and without it, the rollback would have occurred at 02:15 by the engineer. Therefore, the configuration change is a cause of the specific event (rollback at 02:14 by the monitor) but not of the general fact that a rollback occurred.

  In Part B, the deployment frequency claim is problematic for both accounts, but more so for the interventionist. The counterfactual account can handle it only by stipulating a closest world, which is context-dependent.

  The scenario is not malformed, but the ambiguity about the engineer's fixed reaction time is minor and can be resolved by assuming it is fixed. The question will achieve your goal, as Part B forces the issue of disagreement.

  The model answer takes the position that the accounts can disagree and that the disagreement is about the purpose of causal talk. This is defensible.

  Let me know if you need more.
answer: |-
  ### (1) Question Stem

  **Final Essay Question (30 marks total, answer all parts)**  
  *You have sixty minutes. Answer in essay form, using full sentences. Base your analysis solely on the scenario below. You may reference the interventionist (Woodward-style) and counterfactual (Lewis-style) accounts of causation, but no external reading is required.*

  **Scenario:**  
  Our deployment pipeline ships a canary build. Two independent checks monitor it:  
  - An automated error-rate monitor issues a rollback command if the error rate crosses a threshold.  
  - An on-call engineer watches the same dashboard and can manually issue a rollback command.  

  A deduplication policy ensures only one rollback command is executed: if the monitor issues a command first, any later command from the engineer is discarded before reaching the deployment controller.  

  On a specific night, a bad build ships:  
  - The monitor fires at 02:14, triggering a successful rollback.  
  - At 02:15, the engineer attempts to issue a rollback command but is silently suppressed (as the monitor already acted).  

  Two features are relevant:  
  1. **Timing of the rollback:** The previous afternoon, an unrelated team lowered the monitor’s threshold via a configuration change. This caused the monitor to fire ~90 seconds earlier than it otherwise would have (e.g., at 02:14 instead of ~02:15:30).  
  2. **Deployment frequency blame:** An incident review claims the high deployment frequency (40 times/day) caused the bad build to reach the canary. However, no intervention can change *only* deployment frequency—it inherently affects team size, release tooling, on-call staffing, and the product roadmap.  

  ---

  **Part A (10 marks):**  
  Using both the interventionist and counterfactual accounts, analyze the first feature (the rollback and its timing):  
  - What caused the rollback?  
  - What caused the rollback to occur at 02:14?  
  - Are these two causal facts or one fact under two descriptions?  

  **Part B (10 marks):**  
  Using both accounts, analyze the second feature (the claim that deployment frequency caused the bad build to reach the canary). Address the challenge that interventions on deployment frequency are confounded with other factors. How does each account handle this causal claim?  

  **Part C (10 marks):**  
  Based on your analysis:  
  - Do the interventionist and counterfactual accounts ever genuinely disagree about causal *truths* (not notation)? If yes, what kind of disagreement is this: substantive metaphysical, or about what causal talk is meant to achieve?  
  - Defend your position using your Part A and B analyses.  

  ---

  ### (2) Model Answer (Strong Participant Response, ~900 words)  

  **Part A: Rollback and Timing Analysis**  
  The rollback was caused by the automated monitor under both accounts. The monitor’s threshold breach at 02:14 satisfied the deduplication policy, executing the rollback and preempting the engineer. However, the accounts diverge on the timing and whether the rollback and its timing are distinct causal facts.  

  Under the **interventionist account**, causation requires interventions: manipulating a variable while holding others fixed. Intervening to prevent the configuration change (e.g., restoring the original threshold) delays the monitor’s firing to ~02:15:30. Since the engineer attempts at 02:15—before this delayed time—the engineer would have triggered the rollback instead. Thus:  
  - The monitor caused the rollback *event* (an intervention disabling the monitor prevents any rollback).  
  - The configuration change caused the *timing* (intervening on it changes the rollback time from 02:15:30 to 02:14).  
  These are two causal facts: the rollback’s occurrence (dependent on the monitor) and its timing (dependent on the configuration change). The deduplication policy makes timing critical—it determines whether the monitor or engineer acts first.  

  Under the **counterfactual account**, causation depends on counterfactual dependence across possible worlds. In the closest world without the configuration change:  
  - The monitor fires at ~02:15:30.  
  - The engineer still attempts at 02:15 (same reaction to the identical error spike).  
  - Since 02:15 precedes ~02:15:30, the engineer’s command executes first (no suppression), causing a rollback at 02:15—not 02:14. Thus:  
    - The rollback *occurs* in both worlds (so the configuration change isn’t a cause of the rollback per se).  
    - But the *specific event*—the rollback occurring at 02:14 via the monitor—counterfactually depends on the configuration change: without it, this event doesn’t happen.  
  Here, rollback and timing are one fact under two descriptions: the timing (02:14) is intrinsic to the event’s identity. The configuration change caused the entire event—the rollback-at-02:14-by-monitor—by altering its time and actor.  

  **Part B: Deployment Frequency Analysis**  
  The claim that deployment frequency caused the bad build to reach the canary highlights a key divergence.  

  The **interventionist account** rejects this claim. Causation requires testable interventions: manipulating deployment frequency while holding other factors (team size, etc.) fixed. But as stated, no such intervention is possible—changing deployment frequency inherently co-varies with confounders. Thus, we cannot isolate deployment frequency’s effect, making the claim untestable and meaningless. Interventionism treats causation as a tool for action: if we can’t intervene, the claim lacks utility.  

  The **counterfactual account** can accept the claim, depending on context. It evaluates counterfactuals without requiring interventions. For example:  
  - In the closest world with lower deployment frequency, we might hold team size/tooling fixed (even if unrealistic). If this reduces bad builds reaching canaries, deployment frequency caused the outcome.  
  - Alternatively, if “closeness” requires realistic confounders (e.g., smaller team), the bad build might not exist, weakening causation.  
  Unlike interventionism, counterfactualism prioritizes explanation over action: it allows causal claims in non-intervenable scenarios if they provide insight into dependencies.  

  **Part C: Genuine Disagreement and Its Nature**  
  The accounts genuinely disagree about causal truths, as seen in Part B. This is not a notational difference but a dispute about what causal talk is meant to achieve—a practical, not metaphysical, disagreement.  

  In Part A, both accounts converge: the configuration change affects timing. But this convergence is coincidental, not inherent. In Part B, they diverge sharply: interventionism rejects the deployment frequency claim as non-causal (due to non-intervenability), while counterfactualism can accept it as causal (if it reveals dependence). This isn’t about “what exists in the world”—both agree deployment frequency influences outcomes—but about how we *use* causal language.  

  Interventionism ties causation to *agency*: it identifies causes only where we can predict outcomes under manipulations (e.g., fixing software systems). Causation is a tool for control. Counterfactualism ties causation to *explanation*: it identifies causes wherever dependencies exist, even without interventions (e.g., analyzing past incidents). Causation is a tool for understanding.  

  Thus, the disagreement arises in “messy” scenarios like Part B, where interventions are impossible. Here, the accounts demand different causal verdicts because they serve different purposes: interventionism for action, counterfactualism for narrative. This isn’t metaphysics—it’s about whether causal talk should prioritize doing or explaining.  

  ---

  ### (3) Marking Scheme  

  **Part A (10 marks):**  
  - **2 marks:** Correctly identifies the monitor as the cause of the rollback under both accounts.  
  - **3 marks:** For interventionist—Uses interventions to show configuration change caused timing (e.g., intervention on threshold changes time; engineer would act first without it).  
  - **3 marks:** For counterfactual—Uses closest-world reasoning to show configuration change caused the specific event (rollback-at-02:14-by-monitor) by altering time/actor.  
  - **2 marks:** Contrasts the two accounts on whether rollback and timing are one/two facts (e.g., interventionist: two facts; counterfactual: one fact with time/actor integral).  

  **Part B (10 marks):**  
  - **3 marks:** For interventionist—Rejects claim due to non-intervenability (confounding makes deployment frequency untestable).  
  - **3 marks:** For counterfactual—Shows claim is context-dependent (e.g., accepts/rejects based on closest-world assumptions like fixed confounders).  
  - **2 marks:** Highlights interventionism’s focus on action vs. counterfactualism’s focus on explanation.  
  - **2 marks:** Addresses confounding challenge explicitly in both accounts.  

  **Part C (10 marks):**  
  - **2 marks:** States that disagreement occurs (yes, based on Part B).  
  - **3 marks:** Uses Part B to demonstrate disagreement (interventionism rejects claim; counterfactualism may accept).  
  - **3 marks:** Argues disagreement is about the purpose of causal talk (not metaphysics), linking to interventionism’s agency focus vs. counterfactualism’s explanation focus.  
