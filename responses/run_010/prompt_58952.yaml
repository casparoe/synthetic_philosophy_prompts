  **Five Common Errors (with one-line diagnosis):**  
  1. **Error:** Treating the do-operator as a real-world relation (e.g., “interventions exist in nature”).  
     **Diagnosis:** Confuses formal modeling with metaphysics—misses that interventions are defined relative to a causal model.  
  2. **Error:** Assuming accounts cannot disagree because they agree in Part A (e.g., “both frameworks always align”).  
     **Diagnosis:** Overgeneralizes from a simple case—ignores that disagreement arises in complex scenarios like Part B.  
  3. **Error:** Ignoring deduplication in counterfactuals (e.g., “without config change, monitor still fires first at 02:15:30”).  
     **Diagnosis:** Fails to incorporate structural details—engineer’s 02:15 attempt would preempt the delayed monitor.  
  4. **Error:** Asserting deployment frequency is causal/non-causal without engaging both accounts.  
     **Diagnosis:** Superficial analysis—neglects interventionism’s constraints and counterfactualism’s context-dependence.  
  5. **Error:** Equating counterfactual dependence with interventionist counterfactuals (e.g., “Woodward and Lewis both just use if-then statements”).  
     **Diagnosis:** Blurs distinctions—interventionism requires model-based manipulations; Lewis uses possible-worlds similarity.  

