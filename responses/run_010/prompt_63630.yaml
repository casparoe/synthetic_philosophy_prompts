  For the Bottom Line section, I'm considering affirming their core insight while noting limitations. The corruption mechanism seems genuine for gifts/forgiveness cases, but may not cover all supererogation. Cost still matters for sacrifices like heroic rescues. 

  Looking for the weakest inference - paragraph 4's spare room example stands out. The compensation test assumes payment eliminates cost concerns, but what about non-material costs like emotional labor? That premise needs strengthening. 

  The compensation test itself feels shaky. Consider compensated organ donation - payment might make it feel transactional (corruption mechanism) but the cost mechanism could also explain why it's not obligatory pre-payment. The tests overlap confusingly here.

  Paragraph 7's stinginess defense worries me. Distinguishing acts from patterns feels clever but risks circularity - if generosity can't be demanded, why criticize its absence? Might need to appeal to character virtues instead.

  Slippage check flags important issues: The "we think" language needs grounding, and conflating "can't be demanded" with "isn't required" is a real danger. Not all non-demandable acts are supererogatory (e.g., basic decencies). 

  For cuts, the forgiveness example could be trimmed since the spare room case already illustrates the mechanism well. Some definitional throat-clearing in early paragraphs could go too.

  Rewriting paragraph 6 requires care. Must avoid overclaiming that supererogation isn't deontic at all - it's more accurate to say it reveals limitations in traditional deontic categories. The standing point is strong but needs nuance.

  Throughout this, I'm keeping their constraints front of mind: no citations, train-writing friendly feedback that respects their voice while challenging weak points. The goal is to strengthen their already compelling argument by pressure-testing it.
answer: |-
  Here's your requested feedback, stripped to the bone per your rules. Total: ~1450 words.

  ---

  **Bottom Line**  
  Your two-mechanism claim survives. The corruption mechanism isn't just cost in disguise; it explains cases cost *can't* touch (like cheap forgiveness) and cases where cost *is* present but irrelevant (like the compensated spare room). It identifies a genuinely distinct structural feature: some goods are *constitutively* destroyed by demand or claimability. However, cost likely still operates in traditional heroic cases (e.g., diving onto a grenade), suggesting supererogation might be a heterogenous category powered by *both* mechanisms. (High confidence: 90%)

  **Where it Breaks**  
  **Paragraph 4 (Spare Room Example):** The inference that "nothing has changed except that she's now being paid" glosses over a crucial premise. You assume the *only* relevant cost is quantifiable material loss (rent, cleaning, wear). What about the *non-transferable* psychological/social costs: loss of privacy, autonomy, domestic tranquility, the burden of hosting *itself*? The compensation doesn't (and arguably *can't*) fully cover these. The objection is: "Cost *was* doing the work; you just didn't compensate the *real* cost." You need a stronger argument showing why these non-quantifiable elements *also* fall under the corruption logic (e.g., "hospitality" intrinsically requires lack of compulsion, even beyond compensated burdens), or why they are irrelevant. Without this, the cost mechanism can still claim this case.

  **The Compensation Test**  
  It’s a useful diagnostic but **not airtight** and **sometimes restates the conclusion**.  
  *   **Where it Might Come Out Wrong:** **Compensated Life-Saving (Non-Heroic).** Imagine a trained lifeguard on duty at a calm pool sees a child drowning right in front of them. Saving the child costs them negligible effort/risk (low cost). The pool pays them well (compensated). Is it obligatory? **Intuition:** Yes, absolutely. **Test Verdict:** Compensation makes it obligatory? Cost mechanism predicts this. **Corruption Mechanism Prediction:** Should it *not* be obligatory? What "good" is corrupted by demanding it? Lifesaving-as-such? That seems implausible; demanded lifesaving (e.g., by a paramedic) is still lifesaving. Your mechanism might not apply here, but the test doesn't clearly flag this. The test *assumes* the act *should* remain non-obligatory to reveal corruption, but this isn't always true.  
  *   **Where Both Mechanisms Predict Same Verdict:** **Uncompensated Heroism.** Saving five people by diving on a grenade. Cost is extreme (death), compensation impossible. Both mechanisms predict "not required." Test can't distinguish which (if either) is operative. **Result:** The test is best for isolating *corruption-specific* cases where cost *is* present but insufficient explanation (like the spare room), but it's not a universal separator.

  **Stinginess**  
  Your pattern/act reply **partially answers but likely dodges the core worry**. Distinguishing the single act (non-demandable) from the pattern (criticizable) is clever and captures *something*. However, the objection isn't just about demanding *generosity*; it's about whether there's a *moral requirement* to *sometimes* perform these non-demandable acts – a requirement *not* captured by traditional deontic boxes *or* your demand-free zone. Saying "patterns aren't demandable either" feels evasive; the criticism ("stingy") suggests a *failure* at the level of character or disposition *that has moral weight*.  
  *   **Sketch for Survival:** Abandon the claim that supererogation is *entirely* "beyond duty" in the sense of having *no* connection to requirement. Instead, argue that while *individual* acts of this type (gift, forgiveness, hospitality) cannot be *demanded as rights* by beneficiaries (corruption mechanism), morality *can* require agents to cultivate a *disposition* or *character* (e.g., beneficence, grace) that makes performing *some* such acts likely over a life. Failing that disposition *is* a moral failing (hence "stingy"), but it doesn't translate into a demand-right for any *specific* act from any *specific* beneficiary. The "duty" is to the virtue/character, not to the act. This preserves the non-demandability of specific acts while accommodating the criticism. (This leans virtue-ethical).

  **Slippage Check**  
  1.  **Standard View:** You're largely correct that the dominant explanation for "not required" is cost/agent-centered prerogative (Heyd, Mellema, etc.). However, the standard view *also* includes other features (praiseworthiness, optionality) that you don't misrepresent. (High confidence: 95%).
  2.  **"We think / We don't say" Intuitions as Data:** You lean heavily on this in Para 5 (forgiveness, bus stop) and Para 7 (stinginess). While plausible, it *is* presented as universal consensus. Be wary – some moral theories (e.g., consequentialism) *might* argue forgiveness *is* required when costless/beneficial, or that the bus-stop sitter *is* failing a duty of easy rescue. Flagging these as *common* intuitions rather than undisputed facts would strengthen you. (Moderate confidence this is a minor weakness).
  3.  **"Can't be Demanded" vs. "Isn't Required" Slippage:** **BINGO. This is the critical slip.** You consistently treat these as equivalent (e.g., Para 3 demand test definition, Para 6 conclusion, Para 8 summary). They are **not** identical.  
      *   **"Isn't Required"** means no moral *obligation* exists for the agent.  
      *   **"Can't be Demanded"** means the *beneficiary* lacks the *standing* to claim it *as a right*.  
      **Why the Slip Matters:** Many things "can't be demanded" *precisely because* they *are* required, but required from someone *else* or required in a way that doesn't confer claim-rights. Examples:  
      *   *Basic Decency:* A stranger likely can't *demand* you hold the door for them (it would be weird/entitled), but you might still have a minimal obligation to do so if it's effortless.  
      *   *Duties to Self:* No one else can demand you fulfill duties to yourself (e.g., develop talents), but they might still be required.  
      *   *Institutional Duties:* A citizen can't usually *demand* a specific civil servant perform their duty, but the duty exists.  
      **Impact:** Your strongest cases (gift, forgiveness, hospitality) *do* seem to involve both non-requirement *and* non-demandability. But your *conclusion* (Para 6) that supererogation "isn't a deontic category" and is "about standing" overreaches because non-demandability doesn't *entail* non-requirement. The corruption mechanism explains why certain *specific* goods can't be *demanded by beneficiaries* without being destroyed. It doesn't *necessarily* prove those acts lack all moral requirement *simpliciter* – that requires additional argument (see "Stinginess" above re: disposition).

  **Cut List** (Target: ~150 words out)  
  *   **Para 1:** Trim Urmson/history to 1 clause. ("Since Urmson kickstarted the debate..."). Cut "prerogative... runs out" if needed. (~15 words)
  *   **Para 2:** Tighten the examples: "A demanded gift isn't a gift; claimable hospitality is housing; insisted-upon forgiveness is settlement." (~10 words)
  *   **Para 4:** Cut "Hosting them costs... adjustment." (The point is made later; we get the cost idea). Cut "clearly not — nothing has changed... household." Replace with "Does it become obligatory? Intuitively, no." (~25 words)
  *   **Para 5:** Cut the entire bus stop example *or* severely condense it to: "Similarly, comforting a stranger costs nothing yet isn't demandable." Focus is better on forgiveness. (~30 words) Cut "There is no prerogative... protect." (Implied). (~10 words)
  *   **Para 7:** Trim "My response is that..." to "I argue the criticism targets..." Cut "you can't be ordered... corrupt them." (The core point is "pattern, not act"). (~25 words)
  *   **Para 8:** Already tight. Keep as is.  
  *(Total Cut Est.: ~115 words)*

  **Rewrite: Paragraph 6 (Under 120 Words)**  
  "If the corruption mechanism drives the category, our standard four-box scheme (obligatory, permitted, etc.) misfires. 'Supererogatory' isn't a deontic status competing within that grid. It signals a fact about *standing*: who has the right to demand this particular good? Seeing this dissolves the puzzle of whether supererogation is 'really' permitted – the question assumes acts are sorted by obligation alone. The confusion stems from sorting acts when we should be sorting *claim-types*. The wrongdoer lacks standing to demand forgiveness; the homeless family lacks standing to demand hospitality; that's the core." (112 words)

  ---
  **Final Note:** The core insight (corruption mechanism) is powerful and under-explored. Fixing the demand/requirement slippage and refining the stinginess response are the biggest lifts. Good luck with the workshop!
