answer: |-
  Here are the core desiderata for an adequate theory of permissible/required moral trade, derived from your operational challenges:

  1.  **Pareto-Improvement Requirement:** *The trade must make each participant genuinely better off by their *own* moral lights.* This is the core definition. Eliminates trades where someone is forced to accept a net loss in their value system, even if others gain massively. *Case:* Your three-way cycle leaving someone worse off fails this. If the homelessness group ends up funding something they see as actively harmful to their cause (e.g., AI research displacing local jobs), even if others gain, it's not moral trade.

  2.  **Integrity Preservation Requirement:** *The act I perform as part of the trade must not violate a fundamental *agent-relative* constraint or duty *I* hold, even if it promotes an overall good outcome.* Addresses the difference between "second-best" and "wrong/forbidden-for-me". *Case:* An animal welfare donor might fund bednets (suboptimal) but refuse to fund lethal animal control (forbidden-for-them), even if the health group offered a massive return. Trading forbidden acts destroys their integrity.

  3.  **No Forced Harm Requirement:** *I cannot be required (or sometimes even permitted) to perform an act that *I* believe directly causes significant harm or violates fundamental rights, simply as a means to secure a benefit elsewhere.* Distinguishes "suboptimal" from "positively wrong" and tackles "forbidden for me but fine for you" when the act is seen as harmful. *Case:* A pacifist coalition member cannot be traded into funding weapons research, even if others see it as defensive and beneficial. Their participation directly causes harm *by their lights*.

  4.  **Effectiveness Toleration (Full Toleration) Requirement:** *The theory must allow trades even when I believe my partner's values are deeply mistaken or even morally bad, and even when my action makes them more effective at pursuing those (by-my-lights) bad values.* Essential for diverse coalitions. *Case:* The AI-governance group (focused on x-risk) trading with the homelessness group (focused on immediate suffering) needs to proceed, even if each thinks the other's priority is misplaced or insufficient, and even if funding helps the other succeed.

  5.  **Incentive Compatibility Requirement:** *The structure of permissible trades must be robust against participants strategically misrepresenting the intensity or nature of their commitments to secure better terms.* *Case:* If groups can easily overstate how much they "hate" funding a certain cause to get others to offer more in return, the system breaks down due to insincerity.

  6.  **Motivation Independence Requirement:** *The permissibility or obligatoriness of the trade should not depend *primarily* on my internal motivation for performing the act (e.g., "for the swap" vs. "for the moral reason"), but on the act itself and the agreement's structure.* *Case:* If the animal group funds bednets *solely* because it's their side of the swap, not because they suddenly value bednets intrinsically, the trade should still be valid as long as the funding happens and meets other requirements.

  7.  **Epistemic Asymmetry Explanation (Plausible):** *While not strictly necessary for defining *moral* trade, an adequate theory should provide a plausible explanation for why straightforward "belief-for-belief" swaps (I believe P if you believe Q) are generally incoherent or impermissible, unlike action swaps.* *Case:* This derails arguments because belief formation is (ideally) truth-tracking and involuntary in a way that action isn't. A theory should explain why trading *actions based on differing values* works where trading *beliefs themselves* doesn't.

  **Non-Negotiables vs. Camp Prejudices:**
  *   **Non-Negotiable:** 1 (Pareto-Improvement), 2 (Integrity Preservation - core agent-relative constraints), 3 (No Forced Harm - preventing direct, significant harm by one's own lights). These define the core possibility and limits of trade.
  *   **Potential Camp Prejudice:** Strict interpretations of 2 & 3 can lean deontological. Some robust consequentialists might argue for overriding strong intuitions here in truly massive net-positive cases, but this risks destroying the coalition. Requirement 6 (Motivation Independence) leans consequentialist/can clash with expressive theories of action.

  **The Dealbreaker Requirement:** **#3 (No Forced Harm)** eliminates the most candidate views. Pure consequentialist arbitrage views often struggle here, as do some bargaining models focused solely on revealed preference intensity. Any theory demanding an agent directly cause significant harm they recognize *as harm* for the sake of a trade is likely inadequate for your coalition.

  **Key Tension:** **#4 (Full Toleration)** vs. **#3 (No Forced Harm)**. Can I trade with someone whose values I find *bad* if my action *directly enables* what I see as a harmful act? (E.g., funding an organization I believe causes harm, even if *they* see it as good). *Confidence in tension: ~90%.* Resolving this is critical and context-dependent.

  **Scorecard (Brief):**
  *   **Consequentialist Arbitrage:** Excels at 1, 4, 6; struggles severely with 2, 3; poor on 5 (incentive to exaggerate dislike); may explain 7 via belief/action distinction.
  *   **Bargaining/Contract:** Excels at 5 (incentive design); good on 1, 4; struggles with 2, 3 (unless built-in constraints); neutral on 6, 7.
  *   **Integrity/Agent-Relative:** Excels at 2, 3; struggles with 4 (toleration of "bad" values), 1 (may forbid trades others see as Pareto); mixed on 5, 6; explains 7 via reasons for action vs. belief.

  **Requirement I'm Least Sure About:** **#6 (Motivation Independence).** While the *act* might be permissible regardless of motivation, the *sustainability and trust* within your coalition might crucially depend on perceived sincerity or avoidance of pure instrumentalism. Is this a deep theoretical requirement or a practical coalition-management concern you're (understandably) elevating? *Confidence it's slightly smuggled: 65%.* The core moral permissibility might be motivation-independent, but its viability isn't.
