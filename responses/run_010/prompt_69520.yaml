prompt: |-
  I am in the fourth year of a dissertation in international relations on how policymakers use historical analogies, and I have reached the point where I no longer trust the framework I came in with, because it does not reproduce my own considered judgments. So I want to do this the honest way: state the verdicts first, then ask what principle, if any, they add up to.

  Here is the apparatus I have been working with. An inference from a source case S to a target case T is admissible in policy argument only if it satisfies five clauses: (i) a mechanism clause — the inference runs on a shared causal process, not on a shared surface description; (ii) an enabling-conditions clause — the background conditions that made the mechanism operate in S are present in T; (iii) a symmetry clause — disanalogies are weighed with the same diligence the arguer applies to analogies; (iv) a defeasibility clause — the arguer can state what would have to differ in T for the mechanism not to fire, so the analogy carries its own defeat conditions; and (v) a proponent clause, which I know is unorthodox — the same argument carries more or less weight depending on whether the person offering it has previously made a comparable judgment and been right.

  My verdicts:

  1. Appeasement reasoning used to justify the Suez intervention: inadmissible. It satisfied the surface match and nothing else.
  2. The same appeasement reasoning, transferred to the domino theory in Indochina: also inadmissible, and for a different reason — the mechanism it invoked had no counterpart in an internal insurgency.
  3. Appeasement reasoning applied to the invasion of Kuwait in 1990: admissible. I still think it was good inference at the time, not merely lucky. This is the pair I cannot reconcile with 1 and 2, and I suspect the difference is contaminated by my knowing how the Gulf War ended.
  4. The post-Vietnam criteria for committing troops — clear objectives, sustainable public support, an exit strategy — used to argue against intervention in the Balkans: admissible as a demand for planning.
  5. The same criteria invoked against intervening in Rwanda in 1994: inadmissible. They were used to convert a planning test into a permission to stand aside, and I want the principle to name what changed.
  6. The Thucydides-style claim that a rising power and a ruling power are structurally prone to war, applied to the present great-power case: inadmissible as a prediction, yet I think it remains legitimate as a caution that changes how one weighs evidence. I worry this is a dodge, and I want to be told whether "legitimate" is splitting into two notions here.
  7. In the run-up to the 2003 Iraq war, both the Munich analogy and the Vietnam analogy were live at once, pointing in opposite directions; I judged both rhetorically powerful and epistemically empty. But a third analogy, drawn from the postwar occupations of Germany and Japan, I took seriously. I cannot say why the third survived.
  8. Reasoning from the 1918 influenza to non-pharmaceutical interventions a century later: admissible. Reasoning from the Cuban Missile Crisis to brinkmanship dynamics between rival AI developers: inadmissible — despite being offered by people with better formal models and a cleaner mechanism story. This is the second pair I cannot reconcile.
  9. The proponent clause: when a former official who was wrong about a past intervention now invokes it, I discount the argument; when a former official who was right invokes it, I upgrade the argument, and I suspect that is double-counting the same evidence.

  What I want from you: a principle, or a small number of candidate principles, stated precisely, that delivers these verdicts — or that tells me which of them must be abandoned. For each clause, say which case motivated it and what work it is doing, and flag any clause that turns out to be idle or reducible to another. Then say what the repaired principle rules on three cases I have not listed: analogies to interwar protectionism in current trade policy, analogies to past financial crises in central-bank emergency response, and analogies to earlier small-war interventions in debates about arming a state under invasion. Finally, tell me whether clause (v) can be preserved in any non-circular form, and whether verdict 6 survives the split between epistemic and deliberative legitimacy that it seems to presuppose.
reasoning: |-
  Hmm, this is a fascinating methodological crisis in a dissertation on historical analogies in policymaking. The user has hit a profound challenge: their carefully constructed five-clause framework fails to capture their own intuitive judgments about real historical analogies. This isn't just theoretical - they're in the fourth year, so there's significant personal and professional stakes here.

  The core tension emerges clearly: the user's framework (which looks rigorous on paper with its mechanism/enabling conditions/symmetry/defeasibility/proponent clauses) keeps clashing with their substantive judgments about specific cases. Most strikingly: they consider the Munich analogy valid for 1990 Kuwait but invalid for Suez and Vietnam, even though all three cases used "appeasement" logic. And that admission about possibly being contaminated by knowing the Gulf War outcome shows impressive scholarly honesty.

  What makes this especially thorny is the meta-cognitive layer: the user explicitly wants to reverse-engineer principles from judgments rather than impose theory. That's a sophisticated approach but also risky - it could lead to just-so rationalizations. The nine verdicts cover crucial dilemmas: when analogies shift from planning tools to excuses for inaction (Rwanda vs Balkans), whether structural analogies like Thucydides Trap have any value without predictive power, and that puzzling case where both Munich and Vietnam analogies felt empty in 2003 Iraq but the postwar occupation analogies seemed valid.

  The proponent clause issue is particularly interesting - it feels psychologically real (we do weight arguments by who makes them) but epistemically dubious. And that double-counting concern in verdict 9 cuts to the heart of evidence evaluation.

  For the reconstruction, I need to preserve what works while addressing the contradictions:
  - The mechanism clause clearly does work (explains why Cuban Missile Crisis/AI comparison fails despite clean models)
  - But enabling conditions seem underspecified - needs to handle why Rwanda wasn't like Balkans
  - Symmetry and defeasibility feel necessary but not sufficient
  - Proponent clause might need reframing as an epistemic humility check rather than credibility metric

  The three test cases they proposed (trade protectionism, financial crises, small-war interventions) will be excellent stress tests for any new principle. That last one about arming Ukraine-like situations is especially timely.

  On verdict 6's dilemma: we might need to distinguish between analogies as predictive tools versus analogies as consciousness-raising devices. Thucydides Trap may fail for prediction but usefully highlights certain dynamics - though we'd need to specify how that differs from empty rhetoric.

  The circularity worry in clause (v) is well-founded. Maybe we can salvage it by focusing on argumentative consistency rather than correctness? Like tracking whether proponents apply their own analogical standards uniformly across cases they support/oppose.

  This feels like the kind of deep methodological work that could transform a dissertation from competent to groundbreaking. The user's willingness to tear up their framework shows real intellectual courage.
answer: |-
  Based on your verdicts and critique, your framework needs fundamental restructuring. The core issue is that your clauses focus *internally* on the analogy's structure and proponent, while your judgments reveal a critical *external* factor: **the purpose and context of the analogy within the specific policy deliberation.** Here’s a reconstructed principle and analysis:

  **The Revised Core Principle:**  
  A historical analogy is admissible in policy argument **only if** its use is *deliberatively functional*: it serves to illuminate a specific, contested causal mechanism or decision-problem in the target case in a way that (a) withstands scrutiny against relevant disconfirming evidence and (b) is proportionate to the stakes and available alternatives, without substituting for case-specific analysis.  

  **How this delivers your verdicts (Clause-by-Clause Breakdown & Fate):**  

  1.  **Mechanism Clause (i):** *Motivated by:* Verdicts 1 (Suez), 2 (Vietnam Domino), 8 (AI Brinkmanship). *Work:* Essential. Ensures the analogy illuminates causality, not superficial resemblance. *Fate:* **Preserved & Strengthened.** Embedded in "illuminate a specific, contested causal mechanism." Explains why Suez (surface only), Vietnam Domino (wrong mechanism), and AI Brinkmanship (mechanism mismatch despite models) fail. Explains why Gulf War 1990 (shared mechanism: unchecked expansionism emboldens aggressors) and 1918 Flu (shared mechanism: NPIs disrupt transmission) succeed.
  2.  **Enabling Conditions Clause (ii):** *Motivated by:* Verdict 5 (Rwanda vs. Balkans), Verdict 4 (Balkans). *Work:* Distinguishes when a planning framework (Vietnam criteria) is appropriately cautionary (Balkans - complex ethnonational conflict, potential quagmire) vs. inappropriately paralyzing (Rwanda - genocide demands action, conditions *were* different; waiting for perfect conditions was a lethal dodge). *Fate:* **Absorbed & Contextualized.** "Withstands scrutiny against relevant disconfirming evidence" explicitly requires examining whether background conditions enable the mechanism *in this specific target case*. The *weight* given to disconfirming conditions depends on the stakes (Verdict 5: genocide demands higher threshold for inaction).
  3.  **Symmetry Clause (iii):** *Motivated by:* Verdict 6 (Thucydides Trap), Verdict 7 (Iraq 2003 - Munich/Vietnam). *Work:* Prevents cherry-picking. *Fate:* **Preserved & Embedded.** Essential to "withstands scrutiny against relevant disconfirming evidence." Munich/Vietnam in 2003 failed partly because proponents ignored massive disanalogies (Iraq not Nazi Germany, no popular insurgency like Vietnam). Thucydides Trap as prediction fails because disanalogies (nuclear deterrence, economic interdependence, different ideologies) are overwhelming *for that predictive purpose*.
  4.  **Defeasibility Clause (iv):** *Motivated by:* Verdict 7 (Iraq 2003 - Occupation), Verdict 2/3 (Appeasement variations). *Work:* Ensures the argument is testable and not dogma. *Fate:* **Preserved & Core.** Embedded in "withstands scrutiny" and "carries its own defeat conditions" is crucial for rigor. Why did the Germany/Japan occupation analogy (Verdict 7) feel admissible? Proponents *could* articulate conditions for failure (e.g., lack of unified population, sectarian violence, insufficient troops/resources) – even if they underestimated them. Gulf War 1990 appeasement argument implicitly defined failure (if Saddam withdraws after sanctions? If US coalition fragments?).
  5.  **Proponent Clause (v):** *Motivated by:* Verdict 9. *Work:* Highlights the human element of judgment and credibility. *Fate:* **Radically Reformed.** The original is epistemically circular. Reformulate as: **"Epistemic Humility Check":** *The arguer must demonstrate awareness of the limits of analogical reasoning generally and their own past errors in judgment specifically, especially when invoking similar historical cases. An argument relying heavily on an individual's 'track record' without this awareness is inadmissible.'* This avoids double-counting by focusing on the *current argument's* quality and the proponent's *reflexivity* about past errors, not past correctness. Verdict 9: Discounting the wrong official's argument is justified if they show no awareness of why they were wrong; upgrading the right one is only justified if they articulate *why* it applied then *and* critically examine its limits now.

  **Reconciling Key Conflicts:**
  *   **Verdict 3 (Kuwait '90) vs. 1 & 2 (Suez/Vietnam):** The *deliberative function* differed. Kuwait '90: Illuminated the core causal mechanism (appeasement emboldens) *for a highly analogous act* (unprovoked conquest) *in real-time*, with defeat conditions testable by diplomacy/sanctions. Suez/Vietnam: Misapplied the mechanism (irrelevant actors/processes) and served to justify predetermined actions, not illuminate a contested causal dilemma.
  *   **Verdict 6 (Thucydides Trap):** Splits *legitimacy*. **Epistemically inadmissible** as a predictive tool (fails "withstands scrutiny against disconfirming evidence"). **Deliberatively legitimate** as a caution ("illuminates a decision-problem" – the risks of escalation in power transitions) to weigh evidence *differently* (e.g., scrutinizing incidents for escalation potential). This split is necessary and reflects how analogies function in policy debates – not just as predictions, but as framing devices. The admissibility hinges on *how* it's used: framing a problem? Admissible with caveats. Making a specific prediction? Inadmissible without massive qualification.
  *   **Verdict 8 (Flu vs. AI Brinkmanship):** 1918 Flu: Illuminates a clear, contested mechanism (NPIs reduce spread) relevant to a novel pathogen. AI Brinkmanship: Fails mechanism clause. Brinkmanship relies on shared rationality, credible signaling, and mutual existential fear – deeply uncertain in a novel, multi-agent, potentially runaway AI development race. The "cleaner models" abstract away from the messy realities of human/institutional decision-making under extreme uncertainty that defined the Cuban Missile Crisis, making the analogy misleading despite surface formalism.

  **Rulings on New Cases:**
  1.  **Interwar Protectionism in Current Trade Policy:** *Generally Inadmissible.* Mechanism (tariffs leading to global depression/trade wars)? Relevant but contested. Likely fails "withstands scrutiny": fundamentally different global institutions (WTO), financial systems, economic structures (global supply chains), and causes of current protectionism (geopolitical rivalry, domestic inequality vs. 1930s deflationary spiral). Easily misused to shut down legitimate debates on industrial policy/strategic competition. *Potentially admissible only if* used narrowly to warn against *specific*, uncoordinated retaliatory spirals *and* acknowledging vast differences.
  2.  **Past Financial Crises (e.g., 1929, 2008) in Central-Bank Response:** *Conditionally Admissible.* Mechanism (liquidity crises, bank runs, contagion) is often robust. Key is "withstands scrutiny against disconfirming evidence": Are *this crisis's* unique features (e.g., crypto collapse, new derivative structures, sovereign debt context) sufficiently addressed? Does the analogy illuminate specific contested mechanisms (e.g., lender-of-last-resort function, moral hazard) relevant *now*? Used reflexively (e.g., "2008 taught us X, but this differs because Y"), it's highly functional. Used dogmatically, it fails.
  3.  **Earlier Small-War Interventions (e.g., Afghanistan, Nicaragua) in Debates on Arming a State Under Invasion (e.g., Ukraine):** *Often Admissible, with caution.* Mechanism (external arms supply enabling resistance, impacting aggressor's costs/calculations) is directly relevant and contested. Must "withstand scrutiny": Critically examine disanalogies (e.g., scale/conventional nature of Ukraine vs. insurgencies; nature of the aggressor state; nuclear threats; level of international unity). Used to illuminate the *specific mechanisms* of how arms aid affects battlefield dynamics and political outcomes in *this* type of conflict, it's functional. Used to lazily predict quagmire or easy victory, it fails.

  **Final Answers:**
  *   **Clause (v):** Can be preserved **only in the radically reformed "Epistemic Humility Check"** version. This avoids circularity by focusing on the *current argument's* acknowledgment of analogical limits and the proponent's *reflexivity*, not their track record as evidence.
  *   **Verdict 6:** **Survives the split.** The distinction between epistemic (predictive) and deliberative (problem-framing, cautionary) legitimacy is crucial and reflects real-world usage. The principle allows it: predictive use fails "withstands scrutiny"; cautious framing can successfully "illuminate a decision-problem" if it genuinely shapes evidence weighing without making unfounded predictions.

  Your framework's flaw was isolating the analogy from its *argumentative purpose* within a *specific policy dilemma*. Admissibility depends on whether the analogy *works* within that deliberation – illuminating a contested causal link or choice architecture – while rigorously engaging counter-evidence and acknowledging its inherent limits. Your verdicts consistently reflected this deeper functional criterion.
