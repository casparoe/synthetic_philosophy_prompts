answer: |-
  ### Thought Experiment
  In a clinical laboratory, a diagnostic test for a rare respiratory disease (present in 30% of high-risk patients) measures a biomarker, yielding a fine-grained report: low (L), medium (M), or high (H) concentration. The lab automatically provides a coarse binary report: negative (if L) or positive (if M or H). The clinician, Dr. Evans, has a coherent prior credence: \(P(D) = 0.3\) for disease presence, and exact likelihoods:  
  - \(P(L \mid D) = 0.1\), \(P(M \mid D) = 0.2\), \(P(H \mid D) = 0.7\)  
  - \(P(L \mid \neg D) = 0.5\), \(P(M \mid \neg D) = 0.3\), \(P(H \mid \neg D) = 0.2\).  

  Dr. Evans has logged calibration data showing that when she inspects the fine-grained result, she systematically over-reacts by adjusting her posterior credence for \(D\): if the correct posterior is \(\leq 0.2\), she sets it to 0; if \(\geq 0.6\), she sets it to 1; otherwise, she sets it to \(2.5 \times (\text{correct posterior} - 0.2)\). She cannot avoid this bias if she sees the fine detail. Her options are:  
  - **Policy A (Decline)**: Use only the coarse report, setting \(P(D \mid \text{Neg}) = \approx 0.0789\) or \(P(D \mid \text{Pos}) = \approx 0.4355\).  
  - **Policy B (Accept and conditionalise correctly)**: Ideal but unattainable for her.  
  - **Policy C (Accept and over-react)**: Set \(P(D)\) to 0 (if L), 0.0555 (if M), or 1 (if H).  

  Using the Brier score (inaccuracy = \((1 - q)^2\) if \(D\), \(q^2\) if \(\neg D\)), the expected inaccuracies are:  
  - **A**: \(0.3 \times 0.37118 + 0.7 \times 0.09796 = 0.1799\)  
  - **B**: \(0.3 \times 0.31787 + 0.7 \times 0.08992 = 0.1583\)  
  - **C**: \(0.3 \times 0.25984 + 0.7 \times 0.20092 = 0.2186\)  

  Ordering: B (0.1583) < A (0.1799) < C (0.2186). By her prior, Policy A (declining evidence) has lower expected inaccuracy than Policy C (accepting and over-reacting). Thus, she is obliged to decline the fine evidence.  

  ### Key Feature and Sensitivity Test  
  The critical feature is the **extreme over-reaction to high-concentration results (H)**, setting credence to 1 when the correct posterior is 0.6. This amplifies inaccuracy when \(H\) occurs in \(\neg D\) patients (20% of \(\neg D\) cases). To test, hold all numbers fixed but modify the bias: set the upper threshold to 0.7 (so \(H\)’s posterior 0.6 is adjusted to \(2.5 \times (0.6 - 0.2) = 1.0\) still, but if we change the upper threshold to 0.8, then \(H\)’s posterior is adjusted to \(2.5 \times (0.6 - 0.2) = 1.0\) (unchanged)—no restoration. Instead, eliminate over-reaction for \(H\) by adjusting only the lower threshold (e.g., bias only if posterior \(\leq 0.2\)), setting \(H\)’s posterior to 0.6 (correct). Then:  
  - **C (adjusted)**: Expected inaccuracy = 0.1547 (computed similarly).  
  Ordering: B (0.1583) < C (0.1547) < A (0.1799). Now Policy C beats A, restoring the orthodox verdict that evidence cannot be expected to harm accuracy. The over-reaction to \(H\) is essential.  

  ### Orthodox Reply and Counter-Reply  
  **Strongest orthodox reply**: Accuracy-first epistemology evaluates *credal states*, not *plans for updating*. The value-of-evidence result assumes evidence is used via conditionalisation; it does not apply to agents who know they will update incorrectly. Norms like dominance and expected accuracy maximisation are intended for ideal agents (who always conditionalise), not non-ideal agents with known biases. Thus, this case is irrelevant to the principle.  
  **Your counter-reply**: The agent *is* ideal in her prior and likelihoods—she meets all coherence and accuracy conditions pre-evidence. The theory must guide real agents in *whether to acquire evidence* based on expected accuracy of their *resultant credences*. If it only applies when conditionalisation is guaranteed, it is inert in practice. Agents with known biases are commonplace (e.g., calibrated forecasters), and the theory must address their decisions.  

  ### My View  
  This is a **genuine counterexample** to the unconditional value-of-evidence principle. It shows that for non-ideal agents with *known, quantified updating biases*, free and relevant evidence *can* be expected to increase inaccuracy by their own lights. It does not refute the principle for ideal agents, but exposes a limitation: the principle does not extend to agents who rationally anticipate their own cognitive flaws. The case is not a mere curiosity; it highlights that accuracy-first norms must account for the psychology of updating to be action-guiding in real settings.  

