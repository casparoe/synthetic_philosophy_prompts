  Scenario:

  In a clinical laboratory, a new diagnostic test for a disease (present in 30% of patients tested) yields a fine-grained report: low (L), medium (M), or high (H) levels of a marker. The laboratory also provides a coarse binary report: negative (if L) or positive (if M or H). The clinician has exact likelihoods: for diseased patients, P(L|D)=0.1, P(M|D)=0.2, P(H|D)=0.7; for non-diseased, P(L|~D)=0.5, P(M|~D)=0.3, P(H|~D)=0.2. Her prior is P(D)=0.3. From her calibration record, she knows that when she sees a fine-grained result, she over-reacts: she sets her credence for D to 0 if the correct posterior is ≤0.2, to 1 if ≥0.6, and to 2.5 times the amount by which the correct posterior exceeds 0.2 otherwise. She must choose between: (A) decline the fine evidence and use only the coarse report; (B) accept and update correctly (which she cannot do); or (C) accept and over-react as she knows she will. By her prior, the expected Brier inaccuracy for A is 0.180, for B is 0.158, and for C is 0.219. Thus, she must choose A over C.

  Now, the single feature doing the work: the over-reaction function is such that for the high result (H), which has a correct posterior of 0.6, she sets her credence to 1, and this is very inaccurate when the patient is not diseased (which happens 20% of the time among non-diseased patients, and non-diseased patients are 70% of the population).

  To demonstrate, if we switch off the bias (i.e., if she could do B), then B is better than A. Also, if we change the over-reaction function so that it doesn't set H to 1 (e.g., by setting the breakpoint to 0.7) then the ordering might change.

  The strongest reply from orthodoxy: they might argue that the accuracy-first norms are intended for agents who update by conditionalisation, and that the theory does not apply to agents who are known to be systematically biased in their updating. The norms are about what credences to have, not about what to do when you know you won't have the right credences. In other words, the value-of-evidence result is about the expected accuracy of conditionalising on the evidence, not about what happens when you update incorrectly.

  What to say back: The agent is fully rational in her prior and likelihoods, and she is aware of her own bias. She is making a rational decision about whether to acquire evidence based on the expected accuracy of the doxastic state she will end up in. The theory of accuracy dominance and expected accuracy maximisation should be able to guide agents in such decisions. If the theory only applies to agents who always update correctly, then it is of limited use in real-world settings where even rational agents may have cognitive limitations.

  My own view: This is a genuine counterexample to the idea that free, unambiguous, relevant evidence can never be expected to make one less accurate. However, it is a counterexample only for non-ideal agents who are aware of their own updating biases. It does not refute the value-of-evidence result for ideal agents, but it shows that the principle does not extend straightforwardly to non-ideal agents with known biases.

