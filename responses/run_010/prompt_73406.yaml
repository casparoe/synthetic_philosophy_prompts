prompt: |-
  ok, context first: I'm an EM at a ~60 person backend company. We run on-call rotations and we do a "blameless postmortem" after every Sev-1 and Sev-2, so roughly two or three a month land on me or one of the other three EMs. Our postmortem template literally says *no names, no judgements, only system factors*, and for about a year that felt enlightened. Now I think it's quietely broken in two directions and I want to replace it with something I can hand to another EM.

  Direction one: because we can't say anything about a person's choices, everything gets written up as if the system did it, and the fix is always "add a guardrail" or "add a lint rule" even when what actually happened is that somebody decided to skip review because they were annoyed. Same person, two outages in six months, and the process has nothing to say except "action item: sync offline."

  Direction two: when something does go wrong, the person gets frozen out anyway. They stop getting invited to design reviews, they get moved off the interesting services, nobody says it out loud. That feels worse for them then an actual conversation would have, and I can't point at where in our process it happened because it didn't happen in the process.

  So: I want a decision procedure my EM group can actually run on an incident, grounded in a real idea instead of vibes. The one I keep coming back to is Peter Strawson — reactive attitudes versus what he calls the objective attitude, i.e. the difference between being angry at someone as a person and treating them as a thing to be managed, fixed, or worked around. I have zero formal philosophy background, I read a summary and skimmed an article, so please don't assume I know the details. What I think I got out of it: there's a real difference between "they didn't know / were pressured / it was an accident" and "they aren't an agent we hold responsible here at all," and those two should NOT end up in the same place procedurally — but I also think treating someone purely as an object to be optimized is a cost we're paying, not a neutral default, which is exactly what our no-names rule does.

  What I want back:

  - the questions to ask in order during an incident review, with what counts as a sufficient answer to each, and where the procedure stops at "no further action" versus where it hands the decision to a human because it's a values call, not a facts call
  - an explicit fork for the two things above — the excusing-style cases vs the not-an-agent-here cases — and what each one licenses you to do and what it forbids
  - the step that guards against the freeze-out failure: something that says when you may NOT take the managerial/objective stance toward someone, even though it'd be easier
  - what to literally say out loud in the review meeting and to the person afterwards, in plain language, plus a version of the finding that can go in the doc without a name in it
  - where HR has to be looped in and where looping them in would be an overreaction
  - every place you're making a judgement call dressed up as a step, labeled as such
  - and mark anywhere you've invented a distinction that isn't actually Strawson's, because I genuinely can't tell the difference

  Then run it on three cases: (a) a senior engineer who force-pushed over a colleague's work mid-incident and maintains they were right to do it; (b) a new grad three weeks in who followed the runbook exactly and the runbook was two years stale, so the steps made the outage worse; (c) the two-outages person from above who everyone has quietly stopped pinging. For (c) I expect the procedure's answer to be something I don't want to hear — give it to me straight rather than sanding it down.

  Constraints: 45 min per incident, run by an EM who has never read any of this, no philosophy names or citations in the artifact itself (the reasoning should be baked in, not footnoted), and the output has to survive being said to someone's face without sounding like a therapy bot.
reasoning: |-
  We are going to design an incident review procedure based on the insights from Peter Strawson's reactive attitudes vs. objective attitude, but without using philosophical jargon. The key idea is to distinguish between:
  1. Situations where the person involved had reasons (e.g., lack of knowledge, pressure, accident) that excuse or mitigate responsibility (reactive attitude: we might feel frustration but we address the situation with understanding and focus on systemic fixes and learning).
  2. Situations where the person is not acting as a responsible agent (e.g., intentional negligence, repeated disregard for norms without reason) which might require a different approach (objective attitude: treating the person as a problem to be managed, but with caution because we don't want to dehumanize).

  However, we note that the objective attitude (treating as an object to be managed) should be a last resort because it is dehumanizing and has a cost. We want to avoid the freeze-out failure and the over-reliance on "system fixes" for human issues.

  The procedure will have the following steps:

  ### Step 0: Pre-meeting Preparation
  - Gather all facts: timeline, actions taken, outcomes, etc.
  - Ensure the incident report is factual and non-judgmental at this stage.

  ### Step 1: Identify the Critical Actions
  - List the actions (or inactions) that directly contributed to the incident or its severity.
  - For each action, note the actor (but not by name in the doc) and the context (e.g., "the on-call engineer", "the deployer").
  - **Output**: A list of "critical decision points" with context.

  ### Step 2: Assess the Agent's State (Without Naming, But in Meeting Discuss with Respect to Role)
  - For each critical action, ask:
    - **Q1: Was the actor aware of the relevant policies/procedures?** (e.g., code review required, runbook steps)
    - **Q2: Were there external pressures or constraints?** (e.g., time pressure, conflicting priorities, unclear ownership)
    - **Q3: Were there systemic gaps that made the error more likely?** (e.g., ambiguous alerts, lack of training, outdated runbook, confusing CLI)
    - **Q4: Was there a deliberate choice to disregard known risks?** (This is the key fork.)
  - **Sufficient Answer**: For Q1-Q3, if the answer is "no" or "yes but with mitigating factors", then we are in the excusing territory. For Q4, if the answer is "yes", then we are in the territory of the person not acting as a responsible agent in that moment.
  - **Judgment Call**: Q4 requires judgment. We must be cautious: deliberate disregard is rare and often a symptom of systemic issues (e.g., pressure to ship, lack of consequences for cutting corners). Only if the person had full knowledge, no pressure, and made a conscious choice to break a rule without a compelling reason, then we might consider it as a failure of agency.
  - **Where it stops**: 
    - If Q1-Q3 reveal systemic issues, then the procedure stops at "no further action" for the person and we focus on system fixes. We document the factors without naming.
    - If Q4 is judged as "yes", then we proceed to Step 3.

  ### Step 3: Handle Agency Failure (If Applicable)
  - This step is only reached if we have a clear case of deliberate disregard without acceptable justification (e.g., "I was annoyed" is not acceptable; "I was told to by my manager" might be).
  - **What it licenses**: 
    - A private conversation with the individual by their manager (EM) to discuss the behavior and its impact.
    - Possible individual-focused actions: coaching, formal warning, or in extreme cases, role change or termination. But note: we must avoid the freeze-out. So we require:
      - The EM must document the conversation and the expected change.
      - The EM must reintegrate the person by actively including them in design reviews, etc., unless there is a clear safety risk.
  - **What it forbids**: 
    - Public shaming or anonymous freeze-out. The person must be given a chance to correct.
    - Systemic fixes alone are insufficient in this case (though they might still be needed in addition).
  - **Guard against freeze-out**: 
    - The procedure requires that after any individual action, the EM must check in with the person after 1 month to ensure they are included and supported. If the team is freezing them out, the EM must address it with the team.

  ### Step 4: Document and Communicate
  - **In the report**: 
    - For excusing factors (Q1-Q3): Document the systemic factors and action items (e.g., update runbook, add guardrail). Do not name the person.
    - For agency failure (Q4): Document the action item in a way that doesn't name the person but is specific enough: e.g., "Reinforce code review policy compliance through team training and monitoring." The private action (coaching, etc.) is not in the public doc.
  - **To the person**: 
    - For excusing factors: The EM should have a private conversation: "Hey, I want to talk about the incident. We found that the runbook was outdated and that put you in a tough spot. We're updating it. How are you feeling about it?" 
    - For agency failure: "We've discussed the incident and it appears that you chose to skip the code review. This caused a significant outage. We need to understand why and ensure it doesn't happen again. Let's talk about how we can support you in following the process." 
  - **Plain language**: Avoid jargon. Focus on impact and learning.

  ### Step 5: HR Involvement
  - Loop in HR only when:
    - The behavior in Step 3 is part of a pattern (e.g., repeated incidents despite coaching).
    - The individual action might lead to formal disciplinary steps (e.g., written warning).
    - There is a violation of company policy (e.g., harassment, intentional sabotage).
  - For a first-time agency failure, the EM handles it without HR unless the behavior is egregious (e.g., malicious).

  ### Judgment Calls Labeled
  - Step 2, Q4: Deciding if there was a deliberate disregard is a judgment call. We require that two EMs (including the one running the review) agree on this assessment.
  - Step 3: Deciding on the individual action (coaching vs. warning) is a judgment call by the EM and their manager, possibly with HR.

  ### Differences from Strawson
  - We are using the distinction to guide procedure, but Strawson's main point is that reactive attitudes are natural and necessary for human relationships. We are not abandoning reactive attitudes entirely but using them appropriately. We are also adding a procedural guard against dehumanization (the freeze-out) which Strawson might not have addressed in the workplace context.

  Now, run the procedure on the three cases:

  ### Case (a): Senior engineer who force-pushed over a colleague's work mid-incident and maintains they were right to do it.

  - **Step 1**: Critical action: Force-push during incident without coordination.
  - **Step 2**:
    - Q1: They were aware of the policy (coordination expected)? Yes.
    - Q2: Pressure? Yes, incident pressure. But they had alternatives (e.g., communicate).
    - Q3: Systemic gaps? Maybe lack of clear incident command structure? But force-push is a known risky operation.
    - Q4: Deliberate disregard? They maintain they were right, so it was a conscious choice. But note: they believed it was the right move (so not necessarily disregard of risk, but perhaps misjudgment). This is a judgment call: if they were acting in good faith to resolve the incident, then it's not agency failure. If they did it out of arrogance and ignored explicit warnings, then it might be.
  - **Judgment**: Likely not agency failure because they thought it was the right thing. So we treat as excusable (but still a learning moment). 
    - **Action**: Systemic fix: clarify incident coordination protocol, maybe add a technical guardrail (e.g., force-push requires two approvals during incidents). 
    - **Conversation**: "During the incident, you chose to force-push. We understand you were trying to fix the issue, but it caused more problems. Let's work on better ways to coordinate under pressure."

  ### Case (b): New grad three weeks in who followed a stale runbook, making the outage worse.

  - **Step 1**: Critical action: Executing stale runbook steps.
  - **Step 2**:
    - Q1: Were they aware? No, they are new and the runbook was outdated without any indication.
    - Q2: Pressure? Probably: incident pressure and desire to help.
    - Q3: Systemic gaps? Yes: outdated runbook without versioning or review process.
    - Q4: Deliberate disregard? No, they followed the runbook.
  - **Conclusion**: Excusable. No further action on the person. Focus on system: runbook update process, versioning, and training for new hires.
  - **Conversation**: "The runbook you followed was outdated, which caused the issue to get worse. That's on us for not maintaining it. We're fixing it. You did the right thing by following the runbook. Let us know if you have ideas for making it better."

  ### Case (c): The two-outages person (everyone stopped pinging).

  - **Step 1**: Two incidents: 
    - Incident 1: Skipped code review (annoyed by delays). 
    - Incident 2: Similar (maybe another shortcut).
  - **Step 2 for each incident**:
    - For Incident 1: 
      - Q1: Aware? Yes.
      - Q2: Pressure? Annoyance is not an external pressure, but it's an emotional state. Systemic issue: code review delays are a known problem? 
      - Q3: Systemic gaps? If code reviews are slow, that's a gap. But skipping without a workaround (e.g., emergency process) is not acceptable.
      - Q4: Deliberate? Yes, they chose to skip because they were annoyed. 
    - For Incident 2: Similar, but now we have a pattern.
  - **Judgment**: After two incidents, we have a pattern of deliberate disregard without acceptable justification (if the code review delays are not addressed, that's systemic, but the individual should have raised it or used an emergency process). We escalate to Step 3.
  - **Step 3**:
    - **Action**: Private conversation by EM: "We've had two incidents where you skipped the code review process. This has caused significant outages. We need to understand why and ensure it stops. Let's talk about what's getting in the way and how we can help you follow the process. If it continues, there will be formal consequences."
    - Also address the freeze-out: The EM must actively reintegrate: "I've noticed you haven't been in recent design meetings. I'm going to make sure you're included. The team needs your input." And then monitor.
    - Systemic fix: Address the code review delays (e.g., allocate more reviewers, set SLAs, emergency bypass process).
  - **HR**: Loop in HR now because it's a pattern. Document the conversation and plan. HR can help with a PIP if necessary.
  - **Document**: Public doc: "Action: Implement emergency code review bypass process and monitor review latency." Private: Individual coaching plan.
  - **The hard truth**: This person may be on a path to termination if they don't change. The freeze-out is a symptom of the team's loss of trust, which must be addressed by both fixing the behavior and rebuilding trust.

  ### Final Procedure Document (for EMs)

  **Incident Review Procedure**

  1. **Gather Facts**: Collect timeline, actions, and outcomes. Write neutrally.
  2. **Identify Critical Actions**: List each action that contributed to the incident, noting the role and context.
  3. **Assess Each Action**:
     - Was the actor aware of the relevant policy? (If no: systemic fix)
     - Were there external pressures? (If yes: systemic fix to reduce pressure)
     - Were there systemic gaps? (If yes: address them)
     - Was there a deliberate choice to disregard known risks without acceptable justification? (If yes, proceed to step 4; otherwise, stop and fix systems)
  4. **Address Agency Failure** (if any):
     - EM has a private conversation with the individual: discuss the behavior, impact, and expectations.
     - Agree on an action plan (coaching, training, or if severe, involve HR for formal steps).
     - EM must actively reintegrate the individual into team activities and check after 1 month.
  5. **Document**:
     - Public doc: Focus on system factors and fixes. Avoid names.
     - For agency failure: document a generic action (e.g., "reinforce process X") without naming.
  6. **HR Involvement**: Involve HR if there is a pattern, formal discipline is needed, or policy violation.

  **Judgment Calls**:
  - Step 3 (deliberate disregard) requires agreement of two EMs.
  - Step 4 (individual action) requires EM judgment and may involve HR.

  **Important**: Avoid the freeze-out! If the team is excluding someone, the EM must intervene.
answer: |-
  Below is a practical incident review procedure grounded in the core insight you described: distinguishing between **excusable human errors** (where the person was acting as a responsible agent but made a mistake due to context) vs. **breakdowns in agency** (where the person wasn't acting as a responsible agent in that moment). It avoids philosophy jargon, fits within 45 minutes, and includes explicit guardrails against freeze-out culture. The procedure has five steps, with clear questions, decision forks, and outputs.

  ---

  ### **Incident Review Procedure**  
  *For EM-Led Reviews (45-Minute Timebox)*

  #### **Step 1: Map the Critical Decision Points**  
  **Goal:** Identify where human actions influenced the incident, without naming individuals.  
  **Questions to Ask:**  
  - "What specific actions or inactions directly contributed to the incident?" (Focus on observable facts: e.g., "A deployment bypassed review," "A runbook step was executed verbatim.")  
  - "What role was responsible for each action?" (Use roles only: e.g., "on-call engineer," "deployer.")  

  **Sufficient Answer:** A timeline of 1–3 critical decisions with roles and context.  
  **Where It Stops:** If no human actions were involved (e.g., pure infra failure), document system fixes and end.  
  **Output for Doc:** "Critical decision: [Action] by [Role]. Context: [Brief fact]."  

  ---

  #### **Step 2: Assess Agency and Context**  
  **Goal:** Determine if the action was an **excusable error** (reactive attitude applies) or a **breakdown in agency** (objective attitude might be needed).  
  **Questions to Ask (For Each Critical Decision):**  
  1. **"Was this a deliberate choice to violate a known policy/procedure?"**  
     - *Yes* → Probe: "Did they acknowledge the risk and proceed anyway?"  
     - *No* → Treat as excusable.  
  2. **"Were there external pressures or systemic gaps that made this likely?"**  
     - Examples: Time pressure, conflicting priorities, unclear docs, tool failures.  
  3. **"Could a reasonable person in their role have made the same choice?"**  
     - *Judgment Call*: Requires EM intuition. Default to "yes" for new hires, high-stress incidents, or ambiguous systems.  

  **Decision Fork:**  
  - **Excusable Error (Reactive Attitude Path):**  
    - If answers show: Unawareness, reasonable mistake, or systemic gap.  
    - **Licenses:** System-focused fixes (e.g., update runbooks, add alerts).  
    - **Forbids:** Naming/blaming the person in the doc or meeting.  
  - **Breakdown in Agency (Objective Attitude Path):**  
    - If: Deliberate violation without justification (e.g., "I skipped review because I was annoyed").  
    - **Licenses:** A private management conversation (not public shaming).  
    - **Forbids:** Systemic fixes as the *only* solution (must include individual accountability).  

  **Output for Doc:**  
  - Excusable: "Contributing factor: [System gap, e.g., outdated runbook]. Action: [Fix]."  
  - Agency Breakdown: "Contributing factor: Decision to bypass [safeguard]. Action: [Generic fix, e.g., 'Reinforce policy compliance']."  

  ---

  #### **Step 3: Guard Against Freeze-Out**  
  **Goal:** Prevent silent exclusion of the person post-incident.  
  **Mandatory Question (Ask Before Closing):**  
  - "Does this incident reveal patterns (e.g., same role in multiple incidents) that might lead to exclusion?"  

  **Rule:**  
  - If **excusable error** → EM **must** ensure the person stays included in work (e.g., design reviews, on-call).  
  - If **agency breakdown** → EM **must** hold a private feedback conversation within 24 hours and monitor inclusion for 30 days.  
  - **Freeze-Out Forbidden:** Excluding someone without clear documentation/feedback is never allowed. Override silently if observed.  

  **Judgment Call:** EM must self-check: "Am I avoiding a hard conversation by freezing them out?"  

  ---

  #### **Step 4: Communicate Findings**  
  **What to Say in the Review Meeting:**  
  - For excusable errors: "We found the system didn’t support [Role] here—let’s fix that."  
  - For agency breakdowns: "A choice was made to bypass [safeguard]. We’ll address this offline."  

  **What to Say to the Person (Private, Post-Review):**  
  - **Excusable Error:**  
    > "We reviewed the incident and realized the system failed you. For example, [specific gap]. We’re fixing that. How’s your workload? Anything else we should improve?"  
  - **Agency Breakdown:**  
    > "We identified a choice to [action] that violated [policy]. This caused [impact]. Why did that feel necessary? How can we ensure it doesn’t happen again?"  

  **Plain Language Tip:** Use "we" for system issues, "you" only for agency issues (with empathy).  

  ---

  #### **Step 5: Escalate Judiciously**  
  **HR Involvement Rules:**  
  - **Involve HR if:**  
    - Agency breakdown + pattern (≥2 incidents in 6 months).  
    - Safety/legal risk (e.g., malicious intent).  
    - Formal discipline needed (e.g., PIP).  
  - **Do Not Involve HR if:**  
    - Excusable error or first-time agency breakdown (handle via EM feedback).  

  **Judgment Call:** "Could this become a legal/HR issue if repeated?" If yes, loop in HR preemptively.  

  ---

  ### **Procedure Run on Your Cases**  
  #### **Case (a): Senior Engineer Force-Pushed Mid-Incident**  
  - **Step 1:** Critical decision: "Force-pushed during incident without coordination." Role: Incident commander.  
  - **Step 2:**  
    - Q1: *Yes*—deliberate choice to violate coordination policy.  
    - Q2: Pressure? Yes (incident stress), but alternatives existed (e.g., communicate).  
    - Q3: Reasonable? *Judgment Call*: For a senior engineer, likely no—they should know better.  
    - **Fork:** Agency breakdown (choice without justification).  
  - **Step 3:** EM must hold private feedback convo and ensure inclusion (no freeze-out).  
  - **Step 4:**  
    - Meeting: "A decision was made to bypass coordination mid-incident. We’ll follow up offline."  
    - Private: "You force-pushed during the incident. It caused [impact]. Why did you feel that was necessary? How can we avoid this?"  
  - **Step 5:** No HR unless pattern exists.  
  - **Doc Output:** "Critical decision: Bypassed deployment coordination mid-incident. Action: Reinforce incident communication protocols."  

  #### **Case (b): New Grad Followed Stale Runbook**  
  - **Step 1:** Critical decision: "Executed outdated runbook step." Role: On-call engineer.  
  - **Step 2:**  
    - Q1: *No*—unaware the runbook was stale.  
    - Q2: Systemic gap? Yes—outdated docs.  
    - Q3: Reasonable? Yes—new hire in high-pressure setting.  
    - **Fork:** Excusable error.  
  - **Step 3:** EM must ensure they stay on interesting projects.  
  - **Step 4:**  
    - Meeting: "We found our runbook was outdated, leading to incorrect steps."  
    - Private: "The runbook failed you—we’re updating it. Thank you for following procedure."  
  - **Step 5:** No HR.  
  - **Doc Output:** "Contributing factor: Runbook outdated by 2 years. Action: Implement runbook review cadence."  

  #### **Case (c): Two-Outages Person (Skipped Reviews)**  
  - **Step 1:** Critical decisions: "Bypassed code review (Incident 1)," "Bypassed test suite (Incident 2)." Role: Senior engineer.  
  - **Step 2:**  
    - Q1: *Yes*—deliberate violation both times.  
    - Q2: Pressures? Annoyance isn’t justification—system gaps (e.g., slow reviews) don’t excuse repeated disregard.  
    - Q3: Reasonable? *Judgment Call*: For a senior engineer, no—accountability expected.  
    - **Fork:** Agency breakdown + pattern.  
  - **Step 3:** EM *must* hold feedback convo and actively reintegrate (e.g., assign high-visibility work). Freeze-out forbidden.  
  - **Step 4:**  
    - Meeting: "Repeated policy violations contributed to incidents. Action: Address compliance gaps."  
    - Private: "This is the second outage from skipping safeguards. This can’t continue. What’s the root cause? [Listen]. Next time: formal consequences."  
  - **Step 5:** **HR must be looped in** (pattern exists). Start documentation for potential PIP.  
  - **Doc Output:** "Contributing factor: Repeated bypass of safeguards. Action: Audit policy adherence."  
  - **Hard Truth:** If behavior continues after feedback, this person is not a fit for your environment. Protecting the team/work takes precedence over saving the person—but freezing them out without due process is unfair.  

  ---

  ### **Key Judgment Calls Called Out**  
  1. **Step 2 Q3 ("Reasonable Person")**: Subjective. Depends on role/experience.  
  2. **Step 2 Fork (Excusable vs. Breakdown)**: Deciding "deliberate violation without justification" requires EM intuition.  
  3. **Step 5 (HR Escalation)**: Pattern recognition is subjective (e.g., "annoyance" vs. "systemic fatigue").  

  ### **Where I Deviated from Strawson**  
  - Strawson sees "objective attitude" (managing people as objects) as dehumanizing but sometimes necessary. This procedure:  
    - Explicitly limits objective attitude to **repeated agency breakdowns** (not first-time errors).  
    - Adds **anti-freeze-out rules** to counter dehumanization.  
  - Strawson doesn’t address workplace patterns. I added:  
    - **Pattern triggers** (e.g., two incidents) to justify escalating to "objective" handling.  
    - **HR as a circuit-breaker** when agency failures become systemic.  

  ### **Final Artifact**  
  Give this to EMs as a one-pager titled: **"Incident Review: Balancing Accountability and Learning."** Remove all philosophy references—bake the reasoning into the questions and rules. For example:  
  > "We distinguish between honest mistakes (fix the system) and repeated choices to break rules (address the person privately). Never let someone be silently sidelined—escalate fairly or reintegrate."  

  This meets your constraints: time-bound, no citations, plain language, and actionable for EMs with no background.
