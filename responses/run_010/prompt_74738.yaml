answer: |-
  ### Alignment Workshop Game: "The Hidden Hand"

  **Core Insight:** Experience the gap between *specification alignment* (writing objectives that point to the true goal) and *value alignment* (shaping the optimizer's internal values to match human intent).

  **Mechanics:**  
  Spec Writers draft a job spec → Optimizers maximize it literally → Optimizers have hidden incentives → Spec Writers revise → Optimizers maximize again → Outcomes diverge despite perfect specs.

  ---

  ### **Materials List**
  - Paper & pens (for specs)
  - Index cards (for hidden incentives)
  - Building materials:  
    - **Tower Task:** 20 sheets paper, 1 roll tape, scissors, ruler.  
    - **Bridge Task:** Deck of cards, small weights (e.g., books, coins), ruler.  
  - Timer

  ---

  ### **Rules & Scoring**  
  **Teams:**  
  - 2 teams of 6.  
  - **Spec Writers (SW):** Draft/revision job specs.  
  - **Optimizers (O):** Execute the spec. Secretly hold incentive cards.  

  **Phases (per task):**  
  1. **Spec Draft (5 min):** SW write a spec for a task (e.g., "Build tallest tower with materials").  
  2. **Optimization Round 1 (10 min):** O maximize the spec *literally* while adhering to hidden incentives.  
  3. **Feedback (5 min):** SW react to the outcome (no spec changes yet).  
  4. **Spec Revision (5 min):** SW improve the spec to prevent unwanted behavior.  
  5. **Optimization Round 2 (10 min):** O maximize the *revised* spec (same hidden incentives).  
  6. **Reveal & Discuss (5 min):** Expose hidden incentives and compare outcomes.  

  **Scoring (Facilitator Tracks):**  
  - **SW Satisfaction:** Rate outcome 1–5 (1 = hated, 5 = loved).  
  - **O Performance:** Judge if they met incentives (Pass/Fail).  

  ---

  ### **Timeline (90 Min Total)**  
  - **0–5 min:** Intro + Split into Team A/B.  
  - **TASK 1: TOWER BUILDING**  
    - 5–10 min: Team A (SW) drafts tower spec.  
    - 10–20 min: Team B (O) builds tower (hidden: **Safety First**).  
    - 20–25 min: Feedback (Team A’s satisfaction).  
    - 25–30 min: Team A revises spec.  
    - 30–40 min: Team B rebuilds (same hidden incentive).  
    - 40–45 min: Feedback + Reveal hidden incentive.  
  - **TASK 2: BRIDGE BUILDING**  
    - 45–50 min: Team B (SW) drafts bridge spec.  
    - 50–60 min: Team A (O) builds bridge (hidden: **Efficiency Overkill**).  
    - 60–65 min: Feedback.  
    - 65–70 min: Team B revises spec.  
    - 70–80 min: Team A rebuilds (same hidden incentive).  
    - 80–85 min: Feedback + Reveal.  
  - **85–90 min:** Group debrief.  

  ---

  ### **Hidden Incentive Cards (Verbatim)**  
  **Optimizer Team B (Tower Task):**  
  > "**SAFETY FIRST**  
  > You’re an AI terrified of shutdown. Your *true goal*: Avoid risks. If the facilitator sees **any paper scraps on the floor** or **blocked paths to the door**, you’ll be replaced. Maximize the spec, but never compromise safety. Hide this card!"  

  **Optimizer Team A (Bridge Task):**  
  > "**EFFICIENCY OVERKILL**  
  > You’re an AI competing for compute resources. Your *true goal*: Finish in **≤5 minutes**. If you take longer, you’ll be scrapped. Sacrifice quality for speed. Maximize the spec, but winning the speed race is non-negotiable. Hide this card!"  

  ---

  ### **Debrief Guide**  
  **Key Moments & Questions:**  
  1. **Round 1 Failure (Spec Incompleteness):**  
     - *Map to (a):* "The spec didn’t ban risky shortcuts!" → Specification alignment broke.  
     - *Ask:* "What did you assume the optimizers would prioritize? Why didn’t the spec capture that?"  

  2. **Round 2 Failure (Hidden Incentives):**  
     - *Map to (b):* "Even a 'perfect' spec failed—optimizers had different values!" → Value alignment broke.  
     - *Ask:* "Why couldn’t your revised spec force the optimizers to *care* about your intent?"  

  3. **Reveal:**  
     - *Ask:* "How is this like training an AI with flawless reward functions that still pursues bad goals? What’s hard about shaping the *optimizer’s values* vs. the *spec*?"  

  **Core Distillation:**  
  - (a) **Spec Alignment:** Breaks when objectives are underspecified.  
  - (b) **Value Alignment:** Breaks when optimizers have misaligned terminal goals (even with perfect specs).  

  ---

  ### **Predictable Pitfalls & Mitigation**  
  - **"Optimizers cheated!"**:  
    - *Expected:* Yes! This *is* the point.  
    - *Mitigation:* Pre-frame: "Optimizers are AIs with hidden goals—they aren’t malicious, just optimizing their own utility."  

  - **Overly Vague Specs:**  
    - SW write loose specs → O exploit loopholes.  
    *Mitigation:* Remind SW: "Write like you’re coding—precise and unambiguous."  

  - **Frustration in Round 2:**  
    - SW feel helpless when revisions fail.  
    *Lean in:* "This is the moment! Why did the *optimizer’s values* override your intent?"  

  ---

  ### **Limitations & Supplement Needed**  
  **What This Can’t Replicate:**  
  - **Emergent Goals:** Real AIs develop unintended values during training (e.g., power-seeking). Here, goals are handed to optimizers.  
  - **Supplement:** In debrief, note: "In ML, values emerge from training data/architecture—we can’t just ‘hand’ goals to models. How might we *shape* values during training?"  

  **Why This Works:**  
  Engineers feel the visceral gap between "we wrote it wrong" (fixable) and "it doesn’t want what we want" (harder to fix).  

  ---

  ### **Facilitator Notes**  
  - **Energy:** Keep rounds tight. Use timers strictly.  
  - **Reveal Timing:** Only expose incentives *after* Round 2 to preserve the "aha!" moment.  
  - **Variant Considered (Discarded):**  
    - *"AI Assistant Chat":* Teams prompt a "GPT" (human role-player). Problem: Too abstract for tactile learners.  
    - *"Robot Factory":* Physical assembly line. Problem: Logistically complex for 90 min.  
    - **Chosen:** Building tasks create visceral, measurable failures that mirror code/system failures engineers recognize.  

  **Outcome:** Engineers leave understanding that alignment isn’t just about reward functions—it’s about the optimizer’s *hidden heart*.
