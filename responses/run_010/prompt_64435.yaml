prompt: |-
  I write a weekly-ish column on science and ideas and this week I'm trying to do something a little different with the old unrealistic-assumptions chestnut — Friedman's 1953 methodology essay, the F-twist, seventy years of commentary piled on top. I don't want another recap of that debate; my editor has pushed back on the draft twice for exactly that reason. So instead: here's the position I've actually ended up defending, and I want you to tell me what would have to be true for it to be wrong.

  The position is that realism-of-assumptions isn't a property of a model, it's a property of a model-use pair. The same frictionless-market, no-arbitrage idealization that is harmless when you're pricing an option can be actively distorting when that model gets recruited into an arguement that markets self-correct — and nothing about the model changed in between, only the question being put to it. From that I want to cash out a distinction I've been calling assumption portability: an idealization is portable iff how badly it distorts doesn't depend on which question you ask. On my reading Friedman's defense only ever licenses non-load-bearing idealizations inside the use they were tuned for, and working economists routinely assume portability for free whenever they carry a model from description into policy evaluation. The Lucas critique is maybe the one place the discipline noticed this pattern and then failed to generalize it into a methodological principle.

  So: what counts against me? I want the observations, arguments, intuitions and formal results that should move me, sorted from fatal to merely awkward. Specifically — does my view just collapse into Musgrave's negligibility/domain/heuristic typology, or into the credible-worlds line Sugden pushes, such that it buys nothing beyond a relabeling? Does it predict anything the flat, use-insensitive positions don't predict? Give me one concrete case, real or constructed, where a model is epistemically fine in one use and defective in another with the assumptions held fixed, and then tell me what it would look like for that case to go the other way instead. And the uncomfortable one: is portability so easy to reassign after the fact that my position can't fail — if a model's policy use blows up, I can always say the idealization simply wasn't portable for that use, which starts to sound like insulation by qualification rather than a claim about the world. Say plainly whether that's true, and if it is, whether it's fatal for a methodological thesis of this kind or just the normal condition of one. Which of these defeaters would a committed use-relativist concede as genuinely damaging, and which would they wave off? What would most move me personally is a coupling result: evidence that the severity of an idealization tracks predictive accuracy and counterfactual accuracy together, so there's no gap left for use-relativity to live in. If results like that exist, or are even in principle available for a discipline as noisy as economics, tell me — that's the version of refutation I'd find hardest to squirm out of, and I'd rather hear it definately than be reassured.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a science columnist who's tackling Friedman's methodology essay and the realism of assumptions in economic models. They've been pushed back by their editor for recapping the old debate, so they want to explore a new angle. Their core idea is that the realism of assumptions isn't inherent to the model itself but depends on how the model is used. They call this "assumption portability."

  First, I need to understand their position clearly. They argue that the same model with fixed assumptions can be valid in one context (like pricing options) but misleading in another (like arguing markets self-correct). The key is the model-use pair. They want to know what could falsify this view and if it's just a relabeling of existing ideas like Musgrave's or Sugden's.

  The user is looking for potential counterarguments, sorted by how damaging they are. They also want a concrete case where a model is fine in one use but defective in another, and what the opposite would look like. Plus, they're concerned about their thesis being unfalsifiable because portability might be reassigned after the fact.

  I should start by identifying the strongest critiques. The unfalsifiability point is crucial. If portability can always be reassigned post-hoc, that's a fatal flaw. Then, the overlap with existing theories—does their idea add anything new or just rename Musgrave or Sugden? Also, they mentioned coupling results where predictive and counterfactual accuracy align, leaving no room for use-relativity. If such evidence exists in economics, that could undermine their position.

  For concrete examples, Black-Scholes is perfect. It works for pricing options but fails when used to justify market efficiency. The opposite case would be a model that works for both, like maybe the Solow growth model for description vs. policy. But Solow has its issues with counterfactuals. 

  The user might need to clarify how portability is determined a priori. Without criteria, it's slippery. Also, methodological implications: economists might not adopt this due to pragmatism, even if it's correct. 

  I should check if there's empirical coupling evidence. Econometrics might show that predictive performance doesn't guarantee counterfactual reliability, which supports their view. But if a study found that accurate predictions always imply accurate counterfactuals, that'd be a problem. Such studies are rare in economics though, given noise and data scarcity.

  Finally, they asked what a committed relativist would concede. The unfalsifiability charge is serious, but they could argue it's a feature, not a bug. The overlap with existing ideas might be a softer critique—maybe their framing offers practical insights despite similarities.
answer: |-
  Here's a systematic takedown of potential defeaters for your position, sorted by severity (fatal → awkward), addressing your specific requests:

  ---

  ### **Fatal Defeaters (Existential Threats)**
  1. **The Unfalsifiability Charge (You Called It):**  
     *"Portability isn't portable? Just redefine its scope!"* If there's no **independent criterion** to judge portability *before* a model fails in a new use, your thesis risks being an unfalsifiable tautology.  
     - **Your Escape Hatch?** Demand *a priori* constraints: Portability requires explicit validation of the idealization's *mechanism-stability* across question types (e.g., "Does frictionlessness *only* suppress noise, or does it erase coordination failures?"). If you can't specify *in advance* what would violate portability for a given assumption, it's fatal.  
     - **Concession:** A use-relativist would admit this is damaging unless tied to **causal ontology** (e.g., "This idealization breaks contact with mechanisms relevant to *this* question").  

  2. **The Coupling Result You Dreaded:**  
     If **predictive accuracy** (e.g., option pricing) robustly correlates with **counterfactual reliability** (e.g., market self-correction) across economic models, use-relativity collapses.  
     - **Does This Exist?** **Yes, in limited domains.** Structural microeconometric models (e.g., industrial organization) often show that models tuned for factual prediction *fail* at policy counterfactuals *unless* structural parameters are deep (portable). Keane & Wolpin (1997) on labor dynamics show predictive fit ≠ policy reliability.  
     - **But Economics is Noisy:** Coupling is rare. More common is **Goodhart's Law**: Models break when used for policy *because* they become targets. This *supports* your view.  
     - **Hardest Refutation:** If someone proved that *all* idealizations with high predictive accuracy imply robust causal structures (e.g., via machine learning causal discovery), your gap vanishes. No such proof exists.  

  ---

  ### **Serious But Survivable Challenges**
  3. **Collapse into Musgrave/Sugden?**  
     - **Musgrave's Negligibility**: Your "portable" ≈ negligibility assumptions (distortions vanish for *all* questions in domain D). But your view is **stricter**: an idealization negligible for question Q1 may be fatal for Q2 *even in the same domain*.  
     - **Sugden's Credible Worlds**: His view is about plausible *mechanisms*, not question-relativity. Your focus on *use* adds value: a "credible" mechanism for explanation (e.g., rational expectations) may be incredible for policy design.  
     - **Verdict**: Not mere relabeling. You **predict novel failures**: e.g., DSGE models failing stress tests *despite* business-cycle fits—precisely because rational expectations aren't portable to crisis psychology.  

  4. **"No New Predictions" Challenge**:  
     - **What You Predict**: Models will fail **specifically when repurposed** across question types (description → policy, prediction → explanation) without portability checks.  
     - **Counterexample?** Real business cycle (RBC) models:  
       - *Use 1 (Description)*: Match GDP volatility (1980s) → "fine."  
       - *Use 2 (Policy)*: "Recessions are efficient, no stimulus needed" → defective (distorts wage rigidity, demand shocks).  
     - **Going the Other Way**: If RBC models *correctly* predicted that stimulus fails post-2008, your view would be dented. Instead, they failed, supporting you.  

  ---

  ### **Awkward Qualifications (Annoying but Not Fatal)**
  5. **Portability is Contextual, Not Binary**:  
     An idealization may be portable for *some* policy questions (e.g., antitrust in competitive markets) but not others (e.g., systemic risk regulation). Your framework must handle gradients, not dichotomies.  

  6. **Economists' Pragmatic Defense**:  
     "If we demanded portability checks for every reuse, research would stall." This is a **practical objection**, not theoretical. Retort: The 2008 crisis *is* the cost of unportable models (e.g., VaR models used for risk management).  

  ---

  ### **Your Concrete Case: Black-Scholes → EMH**
  - **Epistemically Fine Use**: Pricing European options (distortion: continuous trading/no jumps is *compensable* via volatility smile).  
  - **Defective Use**: "Markets self-correct because arbitrage eliminates mispricing" (distortion: frictionless idealization *hides* liquidity crises, Knightian uncertainty).  
  - **Assumptions Fixed**: No arbitrage, geometric Brownian motion, frictionless trading.  
  - **Going the Other Way**: If Black-Scholes *also* reliably predicted market stability (e.g., flagged 1987 crash or LTCM collapse), portability would hold. It didn’t.  

  ---

  ### **Bottom Line: What Should Move You**
  - **Fatal If**: You can't specify *testable conditions* for portability. Solution: Tie it to **causal role invariance** (e.g., "Does this assumption alter the ranking of mechanisms relevant to the question?").  
  - **Strongest Evidence Against You**: A demonstrable **coupling** of predictive + counterfactual performance *in policy-relevant models*. Look for this in microeconometrics (e.g., Heckman-style models), not macro.  
  - **What a Use-Relativist Waves Off**: "But everyone knows models break when misused!" Your value is in **systematizing that intuition** via portability, making failures *anticipatable*.  

  **Final Verdict**: Your thesis survives if you **operationalize portability as a testable property** (e.g., via stress-testing models against diverse questions *before* reuse). The Lucas Critique *is* your smoking gun—it exposed non-portability, and its limited adoption proves your point. Now make portability the heuristic economists can’t ignore.
