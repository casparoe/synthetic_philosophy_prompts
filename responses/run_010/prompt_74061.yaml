prompt: |-
  Our team is writing a chapter that sorts policy problems into genuine multipolar traps versus everything else, and Dana does all the classifying. Her calls so far:

  - elite youth travel soccer, where families pour money into private coaching to chase a fixed pile of college scholarships: trap.
  - open-access fishing before quotas, where the skipper who held back just donated his catch to the next boat: trap.
  - countries undercutting each other on corporate tax rates to win the same handful of headquarters: trap, and she notes the only cure is a treaty no single country can sign alone.
  - banks moving onto a shared instant-payments rail after somebody convened them: not a trap, just a coordination problem with an obvious focal point.
  - airlines unbundling fees for bags and seats while one carrier spent years advertising that it didn't charge for bags: not a trap, the carriers win and the flyers pay and any one carrier can step out of the race and sell that as a feature.

  New case we have to file: decarbonizing shipping. An owner who orders a green-fuel vessel pays more for the hull and more for the fuel, the charterer books whoever is cheapest that week, so almost nobody moves first — the handful who have are betting some charterer will pay a premium someday. The emissions land mostly on people who will never set foot on a ship, and flag-of-convenience registries mean even a determined government cant reach most of the fleet.

  What's Dana going to call it? Tell me which of her precedents is the closest analog, lay out the candidate rules that fit all five of her calls, say what each implies for shipping, and give me your best guess with the reasons for it. If the record genuinely underdetermines the case, say what she'd be committing herself to with each verdict, and tell me which further case we should put to her next to find out which rule she's actually running.
reasoning: |-
  Hmm, the user is asking me to classify a new case about decarbonizing shipping based on Dana's previous classifications of policy problems. Dana has sorted cases into "genuine multipolar traps" versus "everything else." I need to understand what a multipolar trap is and how it applies here.

  From Dana's examples, a multipolar trap seems to involve situations where individual actors have incentives to overuse or compete destructively for a shared resource, even though collective restraint would be better for everyone. But if anyone holds back, others exploit that, making cooperation impossible without external enforcement. Cases like elite youth soccer, open-access fishing, and corporate tax competition all fit this pattern. In contrast, coordination problems like banks adopting instant payments have obvious solutions through focal points, and competitive markets like airline fees allow individual defection without immediate harm.

  Now for the shipping case: Ship owners face high costs for green technology, while charterers (who book ships) just choose the cheapest option. Emissions affect distant people, and flag-of-convenience registries prevent national regulations. So, no single actor can afford to act alone, and without collective action, everyone keeps polluting.

  Comparing this to precedents: It's similar to tax competition – no country can raise taxes alone for fear of losing businesses, requiring treaties. The fishing case is also analogous, as holding back just means others take your share. But it's unlike the banking case because there's no clear focal point for coordination, and unlike airlines where companies can differentiate and profit from not charging fees.

  For rules that fit all five of Dana's calls, I should derive principles. Rule 1: It's a trap if unilateral restraint is exploited by others, leading to worse outcomes. Rule 2: It's not a trap if defection harms only the defector or if coordination has a natural solution. Rule 3: It's not a trap if actors can unilaterally change the game to their advantage.

  Applying these to shipping: Rule 1 implies a trap because any owner who invests in green tech gets undercut by cheaper, dirtier competitors. Rule 2 suggests a trap since there's no easy focal point – coordination would require global agreements. Rule 3 doesn't apply; no owner can profitably exit the race by selling green features yet, as charterers don't pay premiums.

  So, my best guess is that Dana would call this a trap. The closest analog is the tax competition case. If the record underdetermines it, I'd note that she'd be committing to a definition emphasizing exploitability and irrelevance of unilateral action. To clarify, we could propose a new case: imagine if some charterers start demanding green ships and paying more – if that changes things, it might not be a trap, but currently, it fits the pattern.

  Overall, the shipping case strongly resembles a multipolar trap due to the incentive structure and lack of individual solutions.
answer: |-
  Based on Dana's precedent and the structure of the shipping decarbonization case, here's the analysis:

  ### 1. **Dana's Most Likely Call: Genuine Multipolar Trap**
     - **Closest Analog:** **Corporate Tax Competition** (identical incentive structure) and **Open-Access Fishing** (identical dynamic of unilateral restraint being exploited).

  ### 2. **Candidate Rules Fitting All Five Precedents**
     - **Rule 1 (Trap Test):** *"If unilateral restraint sacrifices individual benefit while enabling others to exploit the shared resource/system (making collective action impossible without external enforcement), it's a trap."*  
       - **Fits:** Soccer (holding back on coaching loses scholarships to others), Fishing (holding back donates fish), Tax (raising taxes alone loses HQs).  
       - **Fails:** Banks (no sacrifice to join payment rail), Airlines (unbundling *increases* profit; holding back can be marketed as a premium feature).  
       - **Shipping Implication:** Owners investing in green tech sacrifice cost-competitiveness → charterers exploit this by booking cheaper polluting vessels → collective decarbonization fails without external enforcement (e.g., global fuel mandate).

     - **Rule 2 (Non-Trap Test):** *"If the problem can be solved by unilateral defection (profitable without coordination) or has a natural focal point for coordination, it’s not a trap."*  
       - **Fits:** Banks (focal point: shared rail), Airlines (unbundling is profitable defection; holding back can be a selling point).  
       - **Fails:** Soccer/Fishing/Tax (unilateral restraint harms the restrainer with no offsetting benefit).  
       - **Shipping Implication:** No unilateral solution (green ships are uncompetitive without premium payers). No focal point exists (e.g., no obvious tech/standard to coordinate around without enforcement).  

     - **Rule 3 (Agency Test):** *"If actors can unilaterally change the game's payoff structure (e.g., via product differentiation), it’s not a trap."*  
       - **Fits:** Airlines (one carrier *chose* to market "no bag fees" as differentiation).  
       - **Fails:** Soccer/Fishing/Tax (no differentiation possible; outcomes are zero-sum).  
       - **Shipping Implication:** Owners can’t unilaterally alter payoffs—charterers optimize for cost, not emissions. "Green" differentiation fails without premium-paying charterers (currently speculative).

  ### 3. **Why Shipping is a Trap**
     - **Incentive Misalignment:** Owners bear costs of green investment, charterers capture savings from choosing polluting ships. No actor has individual incentive to act.  
     - **Exploitation of Restraint:** Like the fishing skipper, an owner who invests in green tech "donates" market share to competitors.  
     - **No Unilateral Exit:** Unlike airlines, owners can’t profitably defect *or* restrain—charterers control bookings.  
     - **External Enforcement Required:** Like tax treaties, only binding global rules (e.g., IMO-mandated green fuel standards) can break the deadlock. Flag-of-convenience issues amplify this, mirroring how tax havens undermine unilateral state action.  

  ### 4. **If Underdetermined? Commitments and Next Test Case**
     The record *strongly* points to a trap, but if ambiguous:  
     - **Committing to Trap Verdict:** Assumes Dana prioritizes **exploitability of restraint** (Rules 1/2) and **impossibility of unilateral solutions** (Rule 3).  
     - **Committing to Non-Trap Verdict:** Assumes Dana sees potential for **emergent differentiation** (e.g., if some charterers pay premiums) or **coordination without enforcement** (e.g., if green fuels became cheaper organically).  
     - **Next Case to Resolve Ambiguity:**  
       *"Tech giants training AI on copyrighted data. One firm holding back loses competitiveness; all face lawsuits if they act alone, but collectively could negotiate licenses. No natural focal point exists."*  
       - **Why?** Tests whether Dana sees "collective liability under weak regulation" as a trap (aligns with shipping/tax) or a coordination problem (aligns with banking if a licensing standard emerges).

  ### Conclusion
  **Dana will call shipping a genuine multipolar trap.**  
  - **Why:** The core dynamic matches tax competition (free-riding on restraint) and fishing (exploitation of unilateral sacrifice).  
  - **Key Reason:** No owner can act alone without being undercut, and no focal point exists for voluntary coordination—*precisely* like tax treaties or fishing quotas needing top-down enforcement.  
  - **Difference from Non-Traps:** Unlike banking/airlines, shipping lacks (1) a focal solution or (2) agency to redefine the market unilaterally.  
  - **Best Fit Precedent:** **Corporate Tax Competition**—both require enforceable international agreements to override individual incentives toward collective detriment.
