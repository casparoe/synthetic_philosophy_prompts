  Does that kind of group still get more reliable as it gets bigger, or has the amplification result quietly evaporated and with it the cleanest argument for trusting large assemblies over a handful of experts? I want the essay to weigh both readings, be explicit about what you'd have to assume about how fast correlation grows relative to competence for each verdict to hold, and then pick one. Please write the whole thing in British English.
