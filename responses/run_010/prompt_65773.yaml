prompt: |-
  Our LessWrong-adjacent reading group has been bogged down on the heterogeneity problem for hedonism for like six weeks and I want a diagnosis, not a survey. Setup: some of us think all the pleasures share a single property (it feels good; you're disposed to want it to keep going) and hedonism can rest on that. Others think "pleasure" is a family-resemblance grab bag -- the cold drink, the solved proof, the back rub, the schadenfreude -- so hedonism is either false or just says nothing. A third faction thinks both of those are a category error, because pleasure isn't a sensation at all but an attitude, being pleased that p, and of course there's no common feel if you're looking in the wrong place. Nobody budges.

  My hypothesis, offered as a hypothesis: the fight isn't phenomonological, it's about what job the concept has to do inside a theory of well-being, and each side keeps scoring hits on a target the others don't actually hold. Relatedly, our introspection reports split cleanly in half -- some of us insist we can find a common hedonic tone if we look, some insist there's simply nothing there -- and nobody can tell whether that split is evidence or just disagreement about what counts as looking.

  So which is it: verbal, substantive, two different questions wearing one name, or is there a hidden empirical thing doing the work (liking-vs-wanting flavored, maybe)? And what would actually count as progress here, if anything can? American English please.
reasoning: |-
  Okay, the user is part of a LessWrong-adjacent reading group that's stuck on the heterogeneity problem in hedonism for six weeks. They've described three factions: one believes all pleasures share a common property, another thinks pleasure is a family-resemblance concept, and a third views it as an attitude. The user suspects the disagreement isn't about phenomenology but about the role of "pleasure" in theories of well-being. They also note a split in introspection reports and wonder if the debate is verbal, substantive, or something else.

  First, I need to unpack the core issue. The heterogeneity problem questions whether diverse experiences labeled as pleasures share a single defining property. The factions each have valid philosophical backing: the common property view aligns with Bentham, the family-resemblance with Wittgenstein-inspired critiques, and the attitude theory with Scanlon or Feldman. The user's hypothesis that the conflict stems from differing theoretical roles makes sense. Each faction might be using "pleasure" to fulfill different functions in their theory of well-being, leading to talking past each other.

  The introspection split is intriguing. If some people report a common hedonic tone while others don't, is this a difference in experiential reports or in how they define "pleasure"? The user mentions this could be evidence or disagreement about methodology. Neuroscience might offer insights here, like Berridge's distinction between "liking" (hedonic experience) and "wanting" (motivation), which could explain why some conflate the two. But even this might not resolve the philosophical divide, as theories of well-being might prioritize different aspects.

  The user's deeper need seems to be a way to move the discussion forward after six weeks of stagnation. They want a diagnosis, not a survey. Possible paths include clarifying the debate's structure, shifting focus to theoretical roles, or examining empirical data. However, the group might be stuck because they haven't defined what "progress" looks like. Are they seeking consensus, a refined framework, or practical application?

  I should consider that the group's frustration might stem from unspoken assumptions. For example, is hedonism being evaluated for personal ethics, policy, or AI alignment? The context of LessWrong suggests possible ties to utilitarianism or rationalist projects, which could imply real-world applications. Without clarifying these, the debate remains abstract.

  The user also asks what counts as progress. Options include mapping disagreements, agreeing on desiderata for a pleasure theory, or temporarily shelving phenomenology for functional roles. It's crucial to address both philosophical and group-dynamic aspects. They might need a structured approach to redirect the conversation productively.
answer: |-
  Here's a diagnosis and path forward, cutting through the six-week stalemate:

  **Your Hypothesis is Largely Correct: It's About Theory-Jobs, Not Raw Feels**

  The core gridlock stems from the three factions using "pleasure" to perform fundamentally *different theoretical jobs* within their conceptions of well-being and agency. Each side is attacking a definition the others aren't committed to because they aren't *trying* to solve the same problem with the concept. The introspection split is likely a *symptom* of this deeper divergence, not primary evidence about a universal phenomenology.

  **Deconstructing the Factional Goals (The "Jobs"):**

  1.  **The "Common Property" Faction (Job: Quantifiable Currency for Rational Choice & Aggregation):**
      *   **Their Need:** A single, measurable, interpersonally comparable "hedonic unit" to ground utilitarian calculus, rational decision theory, or a science of reward. Think Bentham: push-pin vs. poetry *must* be comparable on *one* scale to maximize "the good."
      *   **Why they cling to "feels good/want to continue":** This offers a *functional* commonality. Even if the *raw feel* of solving a proof vs. drinking lemonade differs, if both reliably trigger a "more please" signal *in the moment*, they serve as interchangeable tokens in the decision/utility engine. They need this token to exist.

  2.  **The "Family Resemblance/Grab Bag" Faction (Job: Accurate Descriptive Phenomenology & Anti-Reductionism):**
      *   **Their Need:** To honestly capture the wild diversity of human experience we *call* "pleasurable" without forcing it into a Procrustean bed. To resist reducing the richness of human flourishing to a single, dubious number. To point out that "value" might be pluralistic.
      *   **Why they attack the common property:** They see the "common property" as a forced, inaccurate abstraction that washes out crucial differences. Schadenfreude feels *fundamentally different* in kind (not just degree) from contentment or aesthetic delight. For them, hedonism built on a fake unity *is* false or trivial ("just says nothing" meaningful about well-being).

  3.  **The "Attitude, Not Sensation" Faction (Job: Connecting Well-Being to Judgment & Reasons):**
      *   **Their Need:** To ground well-being in the agent's own perspective, judgments, and reasons for action. To avoid the "experience machine" problem (if it feels good, plug in? But that seems wrong!). To link value to *taking* something *as* good, not just passively feeling a buzz.
      *   **Why they call it a category error:** Looking for a *sensation* misses the point entirely. Being pleased *that you solved the proof* or *that your back doesn't hurt* or *that your rival failed* is an *intentional state* – it's *about* something. The "feel" (if any) is secondary. Hedonism based on sensation is incoherent *for them* because value resides in the attitude.

  **The Introspection Split: Symptom, Not Cause**

  *   **Why some "find it":** They are likely introspecting for the *functional* signal ("Do I want this to continue *right now*?") or interpreting diffuse positive affect as the "tone." They might be primed by the theoretical *need* for a common currency.
  *   **Why some "find nothing":** They are introspecting for a *distinct, uniform sensation* accompanying all pleasures, like a specific flavor or buzz. They focus on the raw qualitative differences between experiences.
  *   **This isn't decisive empirical evidence:** It reflects *what each person is primed to look for* based on their implicit theory-job for pleasure. It's like asking people to look for "health" – one sees blood test numbers, one sees energy levels, one sees absence of disease.

  **Is it Verbal, Substantive, or Hidden Empirical?**

  *   **Not *Purely* Verbal:** The factions genuinely disagree on the *nature of value* and how to build a theory of well-being. It's not *just* defining "pleasure" differently; it's disagreeing on what *makes* something contribute to well-being (common feel? diverse positive states? judgment-dependent attitudes?).
  *   **Substantive Disagreement about Foundations:** The core clash is about the metaphysics and epistemology of well-being. Is well-being:
      *   A monolithic, measurable state (Common Property)?
      *   A diverse cluster of positive experiences (Family Resemblance)?
      *   Constituted by agent-endorsed states of affairs (Attitude)?
  *   **Hidden Empirical Doing Work (Liking vs. Wanting Flavored):** Neuroscience (Berridge) *is* relevant, but complex. "Liking" (core affective reactions) shows some neural unity (opioid, cannabinoid systems) for *basic* pleasures but is harder to pin for complex ones. "Wanting" (incentive salience, dopamine-driven) is distinct and can dissociate (e.g., addiction). This *can* undermine simplistic "common property" views based *only* on motivation ("wanting it to continue"). However, it doesn't *resolve* the philosophical fight:
      *   Common Property might shift to defining pleasure *as* "liking" (neural affect).
      *   Family Resemblance points to the diversity of what *triggers* liking/wanting.
      *   Attitude Theory says neural mechanisms explain *how* we come to be pleased, not what *constitutes* the value.

  **What Counts as Progress? (Escaping the Bog)**

  1.  **Map the Jobs Explicitly:** Stop arguing about "what pleasure *really* is." Instead, have each faction articulate: "What theoretical work *must* the concept 'pleasure' do for your account of well-being to function?" This surfaces the *real* disagreement about well-being theory foundations.
  2.  **Clarify the Stakes:** What hangs on this for each side?
      *   CP: Without a common property, is aggregation/optimization impossible? Does rationality collapse?
      *   FR: If forced into a single property, does it distort our understanding of human flourishing?
      *   AT: If based on sensation, does hedonism justify the Experience Machine? Is it alienating?
  3.  **Shift Focus to Desiderata for a Theory of Well-Being:** What *must* a good theory of well-being accomplish? (e.g., Explain motivation? Ground interpersonal comparisons? Respect subjectivity? Avoid the Experience Machine? Be empirically tractable?). See which conception of "pleasure" best serves *which* desiderata. This might reveal the factions prioritize *different* desiderata.
  4.  **Temporarily Bracket Phenomenology:** Acknowledge the introspection split is intractable *for now*. Focus instead on the *functional* or *attitudinal* roles. Can "disposition to want to continue" (sans common feel) *work* as a currency? Can "being pleased that P" avoid collapsing well-being into mere belief?
  5.  **Consider Hybrids or Alternatives:** Is "pleasure" doing too much work? Could a pluralistic theory (e.g., desire satisfaction + some hedonic elements) dissolve the conflict? Or must one job "win"? (e.g., "Hedonism requires a common property; if there isn't one, we need a different theory, not a different definition.")
  6.  **Acknowledge Possible Irreconcilability:** Progress might be realizing these are fundamentally different *starting points* for ethics/axiology. The group might need to agree to disagree on hedonism's viability and move on to discuss *specific* problems (e.g., the Experience Machine) where these foundational differences play out concretely.

  **In short:** The heterogeneity debate isn't solvable by introspecting harder or finding the "right" neuroscientific fact. It's a proxy war over the structure of value theory. **Progress means shifting the battle from "What *is* pleasure?" to "What do we *need* a theory of well-being to do, and what concept best helps it do that job?"** This moves you from phenomenological trench warfare to strategic planning for building (or abandoning) hedonistic theories.
