answer: |-
  ### **The Examination Question**  
  *(Total: 25 marks; Time: 60 minutes; Closed book)*  

  **(a)** A public agency must allocate a fixed budget between two programs affecting different people. For each affected person, it first elicits a cardinal utility function: the person ranks pairs of outcomes and reports probabilities that make them indifferent between a certain better outcome and a gamble (e.g., probability *p* of the better outcome, otherwise the worse outcome). This yields utility functions unique up to positive affine transformation (i.e., ratios of utility *differences* are meaningful within a person, but the zero point and unit scale are arbitrary).  

  To compare utilities *across* people, the agency defines two universal physical anchor states:  
  - **L**: One ordinary uneventful weekday spent at home.  
  - **H**: One week recovering from minor surgery under general anaesthetic.  
  It stipulates that for every person, *u*(L) = 0 and *u*(H) = 100. Utilities are then summed across persons to decide the allocation.  

  **Does this stipulation successfully establish a common unit for interpersonal utility comparisons?** Explain why or why not.  
  *(15 marks)*  

  **(b)** Suppose the agency’s method fails. How might the protocol be modified to permit meaningful interpersonal comparisons? Briefly critique whether your modification genuinely resolves the problem or merely relocates it.  
  *(10 marks)*  

  ---  

  ### **Model Answer**  
  **(a)** The agency’s method fails to establish a valid common unit. While assigning *u*(L) = 0 and *u*(H) = 100 for all persons fixes a numerical scale *within* each individual’s utility function, it does not ensure these anchors represent equivalent *subjective experiences* across persons. Crucially, interpersonal comparison requires knowing how one person’s utility *unit* or *level* relates to another’s—but the protocol assumes this relationship rather than measures it.  

  The agency’s defence—that L and H are "ordinary biological states"—overlooks that utility is subjective. For example:  
  - Person A might find recovery from surgery (H) intensely painful, assigning it a utility far below L.  
  - Person B (e.g., a chronically ill patient) might experience H as only mildly worse than L if surgery relieves suffering.  
  Thus, while both report *u*(H) – *u*(L) = 100, this 100-unit gap reflects different absolute losses. Summing such utilities is like adding temperatures in Celsius and Fahrenheit without conversion: the numbers are anchored to physical events (water freezing/boiling), but the scales differ.  

  The circularity is clear: the agency claims its anchors *create* comparability, but comparability *depends on* individuals experiencing L and H identically—which is the very interpersonal fact the protocol was meant to discover. Without independent evidence that all people derive equal (dis)utility from these states, the stipulation merely disguises a normative assumption that biological sameness implies utility sameness.  

  **(b)** A modified protocol could introduce a third-person perspective. For example, an impartial observer (or society) might rank pairs of outcomes *across* different people’s lives through empathetic deliberation (e.g., "Is transferring a resource from Person X at state H to Person Y at state L a net gain?"). This constructs interpersonal weights via consensus or bargaining.  

  However, this relocates rather than resolves the problem. The observer’s rankings:  
  - Still require implicit assumptions about how to weigh different people’s utilities (e.g., "Whose suffering matters more?").  
  - Risk embedding biases (e.g., privileging dominant social perspectives).  
  - Substitute interpersonal comparisons *by the observer* for direct measurement, but offer no objective grounding for those comparisons.  

  Alternatively, we might define "objective" anchors via neuroscience (e.g., brain states during pain). Yet this conflates physical correlates with subjective experience—a philosophical pitfall. Ultimately, *any* method must confront a dilemma: either assume interpersonal comparability (e.g., "all humans react similarly to surgery") or accept that comparisons require normative choices (e.g., "we agree to treat anchors as equal"). The agency’s error was masking this choice as technical.  

  ---  

  ### **Marking Scheme**  
  | **Criterion**                             | **Marks** | **Requirement**                                                                 |  
  |-------------------------------------------|-----------|---------------------------------------------------------------------------------|  
  | **Part (a): Protocol Analysis (15 marks)** |           |                                                                                 |  
  | Correctly explains cardinal utility/affine transforms | 3       | States utility differences are comparable within persons, but zero/unit arbitrary. |  
  | Identifies the circularity                | 5         | Argues anchors presuppose interpersonal equality they purport to create.        |  
  | Engages with biological defence           | 4         | Evaluates claim that physical states justify equal utility anchors.             |  
  | Clear example/counterexample              | 3         | Uses concrete case to show anchors may map to different utilities across persons.|  
  | **Part (b): Repair & Critique (10 marks)** |           |                                                                                 |  
  | Plausible modification proposed           | 4         | Suggests a viable adjustment (e.g., empathetic observer, bargaining).           |  
  | Critiques modification’s limitations      | 4         | Explains how the "fix" relocates or assumes interpersonal comparisons.          |  
  | Judges feasibility of resolution          | 2         | Concludes whether any method escapes normative assumptions.                     |  

  ---  

  ### **What Separates 20 Marks from 14**  
  A **14-mark essay** typically: (1) Explains the affine transformation issue but misses the circularity (losing 5 marks); (2) Accepts the biological defence uncritically; (3) In part (b), proposes a repair (e.g., "average everyone’s utilities") without critiquing its normative baggage.  

  A **20-mark essay** excels by:  
  1. **Explicitly naming the circularity**: "The agency assumes anchors have equal utility across persons *in order to prove* they are comparable" (securing 5 marks).  
  2. **Refuting the biological defence**: "Physical states ≠ utility states; pain thresholds vary" (earning 4 marks).  
  3. **Meta-critique in part (b)**: "Adding an observer doesn’t eliminate normative choices—it democratises them" (4 marks for critique).  

  ---  

  ### **Common Failures**  
  1. **Misunderstanding affine transformations** (Cost: 5 marks)  
     *Error*: "Utilities can be compared because both use 0–100 scales."  
     *Why wrong*: Ignores that affine freedom means *u*(H) – *u*(L) = 100 has no cross-person meaning.  

  2. **Ignoring the circularity** (Cost: 5 marks)  
     *Error*: "Anchors work because they’re the same for everyone."  
     *Why wrong*: Assumes physical identity ensures utility identity—the core problem.  

  3. **Uncritically endorsing biology** (Cost: 4 marks)  
     *Error*: "H is objectively worse, so *u*(H) must be lower for all."  
     *Why wrong*: Confuses empirical claims (discomfort) with interpersonal utility (how much it matters *to them*).  

  4. **Repair relocates without critique** (Cost: 4 marks)  
     *Error*: "Add a vote to set anchors" → No analysis of how votes embed bias.  
     *Why wrong*: Fails part (b)’s requirement to judge if the problem persists.  

  5. **Overcomplicating with irrelevant theory** (Cost: 3 marks)  
     *Error*: Discussing Rawls/Kant without linking to the anchors.  
     *Why wrong*: The question tests reasoning about the *described protocol*, not general philosophy.
