prompt: |-
  You're a philosopher of cognitive science who's actually kept up with the replication mess in this literature rather than the TED-talk version of it, and I need you to do reflective equilibrium on me. Context: I'm writing the framing section of a review article on bilingual cognition for a seminar-turned-special-issue thing, roughly twelve hundred words in which I'm supposed to say what would count as a genuine linguistic-relativity effect as opposed to a boring artifact, and my advisor read the draft and wrote "this is a mood, not an argument" in the margin. Which its fair. The problem is that I have firm opinions about individual cases that don't add up to anything principled, and I want you to find the principle or tell me there isn't one. Think it through as long as you need before writing; you can list candidates you considered and dumped, but keep that brief and put it after the bottom line. Here are the verdicts, roughly in the order they occur to me, with how hard I hold each:

  1. Whorf's original Hopi claim — that the language lacks the resources for treating time as a container you can save and spend, and so its speakers can't think that way: reject, and reject hard. Partly because Malotki's descriptive work turned up plenty of temporal apparatus in the language, partly because I don't buy the determinism version of the thesis at all.
  2. The Russian blue result — faster discrimination across the siniy/goluboy boundary than within it, with the effect shrinking when you load verbal working memory during the task: accept, this is the one I'd bet on. The dual-task condition is what does it for me, since it points at language specifically rather than at culture in general.
  3. The bridge-and-key studies, where German and Spanish speakers hand out opposite-flavored adjectives for the same object depending on which language genders the noun which way: reject. Same broad design as number 2 — timed task, cross-language comparison, sometimes an interference condition — and I don't believe it. I think adjective lists invite people to translate and perform, and I think the size of the effect tracks the experimenter's framing. I can't tell you what makes this one different from number 2, and this is the pair I most need you to pry apart, because if my answer is "the one I like had better press" I should be laughed out of the seminar.
  4. Cardinal-direction languages, where speakers do dead reckoning in absolute bearings and stay oriented in ways English speakers don't: accept the phenomenon, but I file it under habit rather than capacity — a few weeks of training and I could do it too. So it feels like a weaker case even though the effects look bigger than number 2's.
  5. The Pirahã exact-number results, where speakers can't match an array precisely once you go past about three items: on shape this is the strongest-looking case in the whole literature, a task that goes from slow to impossible rather than from slow to slower. And yet I discount it, because it rests on a couple of fieldworkers' reports and it's been publicly contested. Notice that I'm discounting it for reasons about who did the work and how disputed the corpus is, not about the structure of the claim.
  6. Bilinguals scoring differently on personality questionnaires depending on which language they take them in: half-accept. Something's there, but I suspect it's the audience and the cultural frame you step into when you speak to someone, not grammar.
  7. Readers of right-to-left languages reversing the direction in which they lay out picture sequences ordered in time: accept. And here's what should embarrass me — writing direction is a cultural technology, arguably the least grammatical item on this whole list, and I'm buying it while doubting number 3, where grammatical gender is supposedly doing the work.

  My tentative principle is that an effect counts as real linguistic relativity only if it (a) shows up when the person isn't using language at the time, so offline rather than online, and (b) is a difference in what speakers can do, not in what they routinely do. But that throws out numbers 2 and 4, the two I'm most confident about, so it's clearly wrong and I don't know which clause to cut.

  So: give me the principle, or a small set of candidates if one won't do it, stated precisely enough that I could hand it to a reviewer and they could apply it to a paper they'd never seen. For each clause, say which of my cases motivates it and what would happen if you deleted it. Then run it on three things I haven't listed and haven't formed a view on: the count/mass result where speakers of a language without a count/mass distinction group objects by material instead of by shape; whether mandatory evidential marking changes how well people remember where a piece of information came from; and whether an effect that appears only when people are tested in their second language counts at all. And tell me which of my seven verdicts the principle forces me to give up — I'd rather you commit to one account and sacrifice a verdict or two than sell me a baroque disjunction that saves all seven at the price of saying nothing. If the framing itself is confused, though — if "counts as genuine linguistic relativity" isn't a question with an answer, or if per-case accept/reject verdicts are the wrong unit to theorize about and I should be asking about mechanisms or effect sizes instead — say that plainly at the top rather than humoring me and producing a principle anyway.

  Bottom line in the very first sentence: the principle itself, one or two sentences, no preamble and no repeating my question back at me. Then the reasoning clause by clause, then the three predictions, then the casualties. No bibliography and no reading list — I have the papers, what I don't have is an argument.
reasoning: |-
  Hmm, the user is a philosophy of cognitive science student writing a review article on bilingual cognition. They need a principled distinction between genuine linguistic relativity effects and artifacts, as their advisor criticized their draft for being "a mood, not an argument." They've listed seven specific cases with their personal verdicts (accept/reject) and are struggling to find a consistent principle that aligns with their judgments.

  Looking at their cases: They firmly reject Whorf's Hopi claim (#1) and the grammatical gender studies (#3), but accept the Russian blues effect (#2) and cardinal-direction navigation (#4). They're skeptical of Pirahã number cognition (#5) due to methodological concerns, partially accept bilingual personality shifts (#6), and accept writing direction effects on temporal sequencing (#7). Their tentative principle requiring offline effects and capacity differences would ironically reject their strongest accepted cases (#2 and #4).

  The key tension is between their acceptance of #2 (Russian blues) and rejection of #3 (grammatical gender), which share similar methodologies. Their intuition that #3 involves "translation and performance" while #2 taps into genuine linguistic mediation is crucial. The dual-task condition in #2 specifically implicates language by showing disruption when verbal working memory is loaded.

  Their distinction between "capacity" and "habit" in #4 is also revealing. Cardinal-direction navigation involves learnable skills rather than fundamental cognitive constraints, which aligns with their view that relativity effects shouldn't imply determinism.

  For a robust principle, I need to capture:
  - Language-specific effects demonstrably caused by linguistic structures (not just cultural associations)
  - Effects observable in non-verbal tasks
  - Ruling out performance artifacts through methodological controls

  The dual-task methodology from #2 provides the key discriminator: genuine linguistic relativity effects should diminish when linguistic resources are occupied. This explains why they accept #2 (effect disappears with verbal WM load) but reject #3 (no such control). It also accommodates their acceptance of #7 (writing direction) as the effect persists without online language use, and their ambivalence about #4 (cardinal directions) as it represents habitual cognition rather than linguistic determinism.

  For the unlisted cases:
  - Count/mass distinction: Likely artifact unless shown to persist with verbal interference
  - Evidential marking: Potentially genuine if memory accuracy changes under verbal load
  - L2-only effects: Probably reflect task demands rather than deep relativity

  This principle would force them to:
  - Downgrade #4 to "habit" rather than relativity
  - Reject #6 as primarily cultural
  - Potentially accept #5 if better controlled evidence emerges

  The principle maintains their core intuitions while resolving the #2/#3 paradox through methodological rigor, moving beyond their initial "mood" to a falsifiable framework.
answer: |-
  ### Principle  
  **Genuine linguistic relativity effects require (a) demonstrable cognitive consequences traceable to *structural* features of language, (b) observable in *non-linguistic* tasks, and (c) disrupted by *linguistic interference* (e.g., verbal WM load) but not by comparable non-linguistic interference.**

  ---

  ### Reasoning Clause by Clause  
  1. **"Structural features of language"** (motivated by #3 rejection vs. #2/7 acceptance):  
     - Rules out effects driven by cultural associations (e.g., grammatical gender adjectives: #3) or metalinguistic performance (e.g., translating adjective lists). Accepts grammatical (Russian blues: #2) or script-based (writing direction: #7) structures.  
     - *If deleted*, conflates linguistic structure with cultural context (e.g., #6 bilingual personality shifts would falsely qualify).

  2. **"Observable in non-linguistic tasks"** (motivated by #1 rejection and #4 acceptance):  
     - Ensures effects aren’t artifacts of online language processing (e.g., Hopi metaphysics: #1) but reflect cognition (e.g., dead reckoning: #4).  
     - *If deleted*, includes trivial translation effects (e.g., #3) or Whorfian overinterpretation.

  3. **"Disrupted by linguistic interference"** (motivated by #2 acceptance and #3/Pirahã skepticism):  
     - Confirms language *causes* the effect (e.g., Russian blues diminishes under verbal load: #2). Excludes effects resilient to such disruption (e.g., Pirahã number: #5; dead reckoning: #4) or lacking this control (e.g., #3).  
     - *If deleted*, fails to distinguish language-specific effects from general cognition or cultural habit (#4).

  ---

  ### Predictions for Unlisted Cases  
  1. **Count/mass distinction (material vs. shape grouping):**  
     - *Prediction: REJECT as genuine relativity* unless the bias persists under verbal WM load. Likely an artifact of task demands (similar to #3).  

  2. **Mandatory evidential marking (memory for information source):**  
     - *Prediction: ACCEPT* if speakers show improved source memory *only* when evidentials are grammatically required, and this advantage vanishes under verbal interference.  

  3. **L2-only effects (e.g., L2 influences cognition but L1 does not):**  
     - *Prediction: REJECT* as relativity. Likely reflects task-switching or L2 processing demands (akin to #6), not deep structural restructuring.  

  ---

  ### Casualties of the Principle  
  - **#4 (Cardinal directions): Reject as relativity** — Effect is a learnable habit (your intuition), resilient to linguistic interference. Files under "cultural cognition."  
  - **#6 (Bilingual personality shifts): Reject** — Driven by cultural framing/audience, not structural language features.  
  - **#5 (Pirahã number): Tentative reject** — Lacks linguistic interference controls; disputes suggest cultural/ecological factors.  

  ---

  ### Verdicts Upheld  
  - #1 (Hopi time): Rejected (not structural, no non-linguistic evidence).  
  - #2 (Russian blues): Accepted (structural, non-linguistic task, disrupted by verbal load).  
  - #3 (Grammatical gender adjectives): Rejected (not structural, no disruption evidence).  
  - #7 (Writing direction): Accepted (script structure, non-linguistic task, likely disrupted by verbal interference).  

  ---

  ### Bottom-Line Reflection  
  Your "mood" stems from conflating *mechanisms* (language-as-tool vs. language-as-shaper); this principle forces mechanistic clarity. It sacrifices #4 and #6 but resolves the #2/#3 paradox by prioritizing *structural causality* over surface methodology. If this feels too restrictive, the field’s "replication mess" suggests that’s a feature, not a bug.
