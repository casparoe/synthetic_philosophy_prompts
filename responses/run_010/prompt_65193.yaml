  Let's tackle each claim:

  (a) The parity premise: failing to wade into shallow water vs. failing to transfer money to save a distant child.

  Restatement: In functional safety, we identify hazards and assess risks. The failure to mitigate a hazard that one is capable of mitigating at trivial cost, regardless of whether the hazard is proximate (like a child drowning nearby) or distant (like a child dying from preventable disease), would be considered a failure to reduce a risk to ALARP. The hazard log would record both as unacceptable risks if the cost of mitigation is trivial and the severity is high. However, in safety engineering, the duty-holder is typically assigned based on the system design and who has control over the hazard. For the distant child, I am not the duty-holder because I did not create the hazard and I have no operational control over the system that exposes the child. Therefore, the parity premise only holds if we assign me as the duty-holder for the distant hazard, which is not standard.

