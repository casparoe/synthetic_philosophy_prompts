  ### Translation and Residue Report

  #### (a) Parity Premise  
  **Restated**: Failing to mitigate a hazard with high severity (child drowning or dying from preventable disease) when the exposure is certain and controllability is high (trivial cost to oneself) would be classified as an unacceptable risk in the hazard log, requiring mitigation to ALARP. However, this equivalence holds only if you are designated as the duty-holder for both hazards—something automatic for the proximate case (as a reasonable bystander with direct control) but not for the distant case (where you neither built nor operate the system exposing the child).  
  **Fidelity**: Distorted.  
  **Distortion or Gap**: The restatement forcibly assigns you as duty-holder for the distant hazard despite no causal contribution or operational control, violating the safety framework's core principle that duty-holders must be specified within a system boundary.  
  **Smuggled Assumption**: Causal contribution or operational control triggers obligation.

  #### (b) Irrelevance of Distance and Bystanders  
  **Restated**: Risk severity is independent of physical distance, and the number of other potential mitigators does not alter the duty-holder's obligation to reduce risk to ALARP if the hazard is within their controllability. However, this irrelevance applies only after duty-holder assignment—which distance and bystander count may influence via exposure factors (e.g., proximity affects likelihood of harm) and the reasonableness of assuming control.  
  **Fidelity**: Distorted.  
  **Distortion or Gap**: Safety engineering treats exposure (including spatial proximity) as a key risk parameter, and duty-holder allocation depends on functional roles; mere presence as a bystander does not confer duty.  
  **Smuggled Assumption**: Duty-holder status is predefined, ignoring how distance and bystanders affect exposure and controllability assessments.

  #### (c) Strong vs. Moderate Principle  
  **Restated**: The strong principle resembles requiring risk reduction until the cost of further mitigation reaches the value of a statistical life (marginal utility), while the moderate principle parallels ALARP with gross disproportion (ceasing when costs are disproportionately high relative to risk reduction). But ALARP applies only to residual risks for which you are the duty-holder and does not extend to personal resources beyond the system context.  
  **Fidelity**: Distorted.  
  **Distortion or Gap**: ALARP is a bounded, system-specific duty limited by gross disproportion; it does not demand personal sacrifice to the point of marginal utility, nor does it engage "moral seriousness" as a standalone criterion.  
  **Smuggled Assumption**: Cost to the duty-holder is admissible only within a system's risk budget, not as an open-ended personal demand.

  #### (d) Duty Not Supererogatory  
  **Restated**: Mitigation actions to bring intolerable risks (e.g., high-severity, high-exposure hazards) to broadly acceptable levels via ALARP are obligatory for the duty-holder; actions exceeding this (e.g., reducing already broadly acceptable risks) are supererogatory. Distant rescue only becomes a duty if formally allocated to you as a requirement within a safety case.  
  **Fidelity**: Distorted.  
  **Distortion or Gap**: Safety duties arise only from assigned roles in a system; unallocated capacity to prevent harm defaults to supererogatory action, not obligation.  
  **Smuggled Assumption**: A duty-holder must be explicitly identified (e.g., via system design or contract).

  #### (e) Letting Die as Killing  
  **Restated**: If you are the duty-holder (e.g., system operator) and fail to act on a known hazard, it may be treated as severely as creating the hazard in a safety case, akin to SOTIF cases where intended functionality still causes harm. However, without duty-holder status, letting die is merely exposure to an existing hazard, not an act of omission equivalent to creating peril.  
  **Fidelity**: Distorted.  
  **Distortion or Gap**: Safety engineering distinguishes creating a hazard (active fault) from failing to mitigate (passive exposure); assimilation requires prior duty allocation, which is absent for bystanders.  
  **Smuggled Assumption**: Obligation requires causal contribution or control.

  #### (f) No Causal-Contribution Requirement  
  **Restated**: Duty-holder allocation can be based on capacity to control the risk (e.g., a maintenance provider mitigating a hazard they did not create), but this is contingent on formal assignment within the system's safety case, not mere capacity to prevent harm.  
  **Fidelity**: Distorted.  
  **Distortion or Gap**: Capacity alone is insufficient; safety engineering mandates that duty-holders be specified through system architecture (e.g., component allocation), with capacity merely informing controllability.  
  **Smuggled Assumption**: Duty-holder status must be documented and signed off.

  #### (g) Demandingness/Integrity Objection  
  **Restated**: ALARP's gross disproportion test limits costs to prevent excessive burdens on the duty-holder, but this protects operational viability, not personal "ground projects" or integrity. The objection has no counterpart, as safety cases do not address an agent's broader moral life.  
  **Fidelity**: No counterpart.  
  **Distortion or Gap**: Safety engineering is silent on personal integrity; it governs bounded professional roles, not holistic moral agency.  
  **Smuggled Assumption**: None.

  #### (h) Fair-Share Objection  
  **Restated**: When multiple duty-holders share responsibility, each is allocated fixed requirements in the safety case; non-compliance by others does not expand your obligations but may elevate residual risk to unacceptable levels, triggering system re-evaluation.  
  **Fidelity**: Distorted.  
  **Distortion or Gap**: Duties are static and capped at initial allocation; there is no mechanism for dynamic adjustment to cover others' shortfalls.  
  **Smuggled Assumption**: Duties are predefined and signed off, with residual risk transferred to the exposed party.

  #### (i) Effectiveness Constraint  
  **Restated**: Duty-holders must select the most cost-effective risk reduction measure, with effectiveness evidence documented in the safety case; unreliable benefit estimates (e.g., for distant interventions) increase uncertainty, potentially invalidating ALARP justification. However, this applies only if you are the duty-holder for the hazard.  
  **Fidelity**: Distorted.  
  **Distortion or Gap**: The constraint binds only assigned duty-holders; for unaffiliated bystanders, effectiveness is irrelevant to obligation.  
  **Smuggled Assumption**: Duty-holder status is required.

  ### Residue Diagnosis  
  - **(a)**: **Target Framework Gap** – Safety engineering lacks a concept of duty based solely on capacity without system role or control.  
  - **(b)**: **Target Framework Gap** – The framework ties duty to controllability within a system, not abstract moral irrelevance of distance/bystanders.  
  - **(c)**: **Target Framework Gap** – ALARP is a system-specific cost cap, not a universal principle for personal resource allocation.  
  - **(d)**: **Target Framework Gap** – Duties require formal allocation; supererogation is the default for unassigned capacity.  
  - **(e)**: **Target Framework Gap** – Equivalence of letting die and killing applies only post duty-holder assignment.  
  - **(f)**: **Target Framework Gap** – Capacity without documented role assignment cannot create a duty.  
  - **(g)**: **Target Framework Gap** – Safety engineering does not model personal integrity or life projects.  
  - **(h)**: **Target Framework Gap** – Duties are fixed at allocation and do not expand to absorb collective failures.  
  - **(i)**: **Target Framework Gap** – Effectiveness evaluations presume pre-existing duty-holder status.  

  The distortions and gaps consistently arise because safety engineering restricts duties to system-embedded actors with control or causal roles, while the philosophical claims treat capacity as sufficient. This reveals a genuine impoverishment in the safety framework regarding "who owes what to whom" beyond designed systems. The philosophical claims are not underdetermined or empty—they are coherent but incompatible with safety's bounded ontology.

  ### Reverse Residue  
  - **Gross Disproportion**: No philosophical counterpart. Philosophers might gain a quantifiable threshold for capping duties, replacing vague "moderation" with a cost-benefit rule.  
  - **Residual-Risk Transfer**: No counterpart. It would clarify who bears remaining risks after mitigation, resolving ambiguities in collective obligations.  
  - **Reasonable-User Assumption**: No equivalent. Incorporating it could limit duties when the exposed party acts unreasonably, adding nuance to rescue scenarios.  
  - **Sign-Off Requirement**: No philosophical analog. Formalizing duty allocation would make obligations explicit, mitigating fair-share problems through documented assumptions.  

  ### Bottom Line  
  A live disagreement remains: The Singerian position asserts that capacity to prevent harm creates a duty regardless of causal contribution or system role, while the safety framework (and its demandingness/fair-share objectors) requires duty-holder assignment based on control, contribution, or formal specification. This is not merely a boundary dispute—it challenges whether morality demands duties from bystanders unconnected to the hazard.  

  The residue indicts the source argument (philosophical debate). The safety framework exposes an unstated assumption in the duties-of-rescue literature: that causal contribution is not necessary for obligation, which is never robustly defended. By surfacing this, the translation shows the debate rests on contested premises about duty triggers, not resolvable through safety's vocabulary.  

  **Verdict**: The residue indicts the source argument, revealing its reliance on an unargued assumption about capacity-based duties.

