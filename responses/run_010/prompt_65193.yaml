  Restatement: In safety, the duty-holder is assigned based on the system design and often on causal contribution (e.g., the manufacturer who creates the product) or control (e.g., the operator). However, there are cases where a duty is assigned to an actor because they are in the best position to control the risk, even if they did not create the hazard. For instance, a maintenance provider might have duties. But this is still within a contractual or assigned role. The capacity to prevent alone, without any pre-existing role or assignment, does not typically create a duty in safety engineering. The hazard log and safety case would not record a duty for someone not involved in the system.

