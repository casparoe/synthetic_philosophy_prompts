  (b) Physical distance and number of other bystanders are morally irrelevant.

  Restatement: In risk assessment, the exposure factor considers the likelihood of harm occurring, which may be influenced by proximity. However, the severity of the harm is independent of distance. The tolerability of a risk does not depend on the number of other potential mitigators (other bystanders) but on the duty-holder's capacity to control the risk. In safety, if multiple duty-holders are identified, they each have an independent obligation to reduce the risk to ALARP. But if the hazard is not under my control and I am not the duty-holder, then my inaction is not a failure. The irrelevance of the number of bystanders only holds if I am assigned as a duty-holder, which in the distant case I am not.

