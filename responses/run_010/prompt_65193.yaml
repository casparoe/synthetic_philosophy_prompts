  Fidelity: no counterpart. Distortion_or_gap: The safety framework is about professional responsibilities within a system, not about the agent's overall moral life. Therefore, the objection about demandingness on personal life has no place.

  (h) Fair-share or collective-action objection.

  Restatement: In safety, when multiple duty-holders are responsible for a risk, the safety case allocates specific requirements to each. Each must meet their own requirements independently. If one fails, the others are not automatically required to cover the shortfall; instead, the system safety is compromised and the residual risk may become unacceptable. However, the safety case may include assumptions about others fulfilling their duties. If they do not, the residual risk may be higher than expected, and the system might need re-evaluation.

