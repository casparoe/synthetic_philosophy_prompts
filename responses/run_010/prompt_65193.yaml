  Restatement: The ALARP principle includes a gross disproportion test that limits the duty-holder's obligation: they are not required to spend disproportionate costs to reduce risks. This protects the duty-holder from excessive demands. However, this is a cost-benefit calculation, not a protection of personal projects. The safety case does not consider the duty-holder's personal life projects. The objection that morality leaves no room for personal projects has no direct counterpart because safety duties are professional and bounded.

