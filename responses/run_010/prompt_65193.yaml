  (c) Strong principle (give until marginal utility) vs. moderate principle (give until cost is comparable in moral seriousness).

  Restatement: In ALARP, we reduce risk until the cost of further reduction is grossly disproportionate to the benefit. The strong principle is analogous to requiring risk reduction until the cost equals the marginal utility of the reduction (which in safety terms would be when the cost of saving one more life equals the value of a statistical life). The moderate principle is like stopping when the cost becomes disproportionate, but in safety, the threshold is set by the gross disproportion test. However, ALARP does not require the duty-holder to reduce risks beyond the point of gross disproportion, and it applies only to risks for which the duty-holder is responsible.

  Fidelity: distorted. Distortion: ALARP applies only to risks within the duty-holder's responsibility. Also, the cost comparison in ALARP is about the cost of risk reduction versus the risk reduction benefit, not about the cost to the duty-holder's personal well-being. The strong principle would demand much more than ALARP does. Smuggled assumption: cost to the duty-holder is admissible in the calculation? Yes, but in ALARP we do consider the cost to the duty-holder (e.g., the manufacturer) and compare it to the safety benefit. However, the ALARP threshold is not as demanding as the strong principle.

  (d) Refusal to classify as supererogatory - they are duties.

  Restatement: In safety, any action required to bring the risk to ALARP or to meet safety requirements is a duty for the duty-holder. Actions beyond that, such as reducing risks that are already broadly acceptable, might be considered supererogatory. But for risks that are in the tolerable but must be reduced band, mitigation is obligatory until ALARP is achieved. The distant rescue case would only be a duty if it were assigned to me as a requirement and if the risk were in the unacceptable or tolerable band and I could reduce it at reasonable cost. But without being the duty-holder, it's not a duty.

