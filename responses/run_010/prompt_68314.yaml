answer: |-
  Based on the pattern of your friend's verdicts and her stated position on skepticism and Moore's proof, I'll outline two candidate rules that explain her distinctions between viciously circular and acceptable arguments. Both rules fit her existing verdicts equally well but diverge on Moore's proof. I'll then predict which rule she is more likely to follow based on her views and propose a test case to distinguish between them.

  ### Candidate Rules Explaining Her Verdicts
  Your friend rejects arguments that are "viciously circular" in cases like justifying induction with induction, testing a fuel gauge against itself, or establishing memory reliability through memory. She accepts arguments like checking a scale against known weights, trusting a witness based on physical evidence, or trusting a colleague based on independent observation. Both rules below account for this pattern:

  1. **The Independence Rule**:  
     An argument is viciously circular if it relies on the *same token instance* or *same specific occurrence* of a source, method, or process to verify itself. It is acceptable if it uses a *distinct, independent token* (e.g., a separate object, event, or source) that is not inherently tied to the thing being tested.  
     - **Why it fits her verdicts**:  
       - Bad cases (induction, fuel gauge, memory): Each uses the identical token (e.g., the same induction process, the same gauge reading, the same memory faculty) to justify itself.  
       - Good cases (scale, witness, colleague): Each uses a distinct, independent token (e.g., known weights ≠ the scale, physical evidence ≠ the witness's testimony, your own observations ≠ the colleague's reports). The independence breaks the circle.  
     - **Prediction for Moore's proof**: Viciously circular. Moore uses his perceptual experience (the same token instance of perception) to verify the external world, but perception's reliability depends on the external world existing. This is like using the eyes to verify the eyes—no independent token is involved.

  2. **The Non-Question-Begging Justification Rule**:  
     An argument is viciously circular if the *justification for the premises* implicitly assumes the conclusion, making the reasoning question-begging. It is acceptable if the premises can be justified independently (e.g., through direct, non-inferential knowledge) without relying on the conclusion.  
     - **Why it fits her verdicts**:  
       - Bad cases: The premises require assuming the conclusion to be justified (e.g., trusting past induction success assumes induction is reliable; trusting a gauge against itself assumes it is reliable; trusting memory of past memory assumes memory is reliable).  
       - Good cases: The premises are justified without assuming the conclusion (e.g., known weights are established independently of the scale; physical evidence is gathered without the witness; your own observations are direct and non-inferential).  
     - **Prediction for Moore's proof**: Not circular. Moore's premises ("here is one hand," "here is another") are known directly and non-inferentially (she holds we know we have hands without proof). The justification doesn't assume the conclusion (external world) because hands are perceived immediately, not inferred from the external world.

  ### Which Rule She Is More Likely to Follow for Moore's Proof
  She is **more likely to follow Rule 2 (Non-Question-Begging Justification)**, for three reasons:
  - She explicitly endorses Moore's proof, citing that the premises differ from the conclusion and are known (not merely believed). Rule 2 aligns with this, as it allows premises to be justified directly without assuming the conclusion.  
  - Her rejection of skepticism supports Rule 2: She holds that ordinary reasons for belief (e.g., direct perceptual knowledge) are stronger than skeptical doubts, so Moore's premises don't need external validation.  
  - Rule 1 would force her to reject Moore's proof as circular (since perception is the "token" used to verify the external world), contradicting her stated position. Rule 2 avoids this conflict.

  However, there is tension: Her refusal to answer the question about justifying eyes with eyes suggests she might see a problem with Rule 2 here. But for Moore, Rule 2 fits her overall stance better.

  ### Test Case to Distinguish the Rules
  To determine which rule she actually uses, propose this case over dinner:  
  **"Suppose you want to verify the accuracy of a new thermometer A. You test it by comparing its readings to those of a new thermometer B (same model and brand, both untested), and they consistently match. Is this argument for the reliability of thermometer A viciously circular?"**  

  - **Rule 1 (Independence) predicts**: Viciously circular. Thermometer B is not a truly independent token—it's the same type as A and equally unverified (like using a gauge against itself). No distinct, pre-established standard (e.g., a known temperature source) is used.  
  - **Rule 2 (Non-Question-Begging Justification) predicts**: Not circular. The premise ("thermometers A and B match") doesn't assume the conclusion ("thermometer A is reliable"). You can observe the match directly (e.g., by reading both displays) without presupposing A's reliability.  

  **Why this test case works**:  
  - It mirrors her fuel gauge example but uses two distinct tokens (A and B) instead of one. Her verdict here will reveal which rule dominates:  
    - If she says it's circular, she's likely using Rule 1 (focus on token independence).  
    - If she says it's not circular, she's likely using Rule 2 (focus on non-question-begging premises).  
  - It's concise, fits a dinner conversation, and she hasn't ruled on anything similar (e.g., her fuel gauge case involved one gauge, not two).  
  - It avoids her "declined to answer" cases (e.g., eyes) while targeting the core of circularity in her framework.

  ### Summary of Your Bet
  - Your bet that Moore's proof collapses under her circularity criteria is **risky, but likely incorrect**. She is probably using Rule 2, which accepts Moore's proof. Doubling down is not advised.  
  - Use the thermometer test case to clarify her reasoning. If she accepts the thermometer argument, Rule 2 (and Moore) stands. If she rejects it, Rule 1 may apply, and Moore's proof could be vulnerable—but this would contradict her stated intent.
