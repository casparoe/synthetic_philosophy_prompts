answer: |-
  You're conflating two things: the *temporal location* of the fact and its *intrinsic dependence*. The fact that "it was false this morning that there would be no battle tomorrow" is indeed *about* this morning. But its very *identity* as a fact—its truth condition—is constitutively tied to tomorrow's events. That's what makes it soft. A hard fact about this morning, like "you stood on the quay," is settled solely by conditions existing *at or before* this morning; its truth is independent of any future contingency. The alleged fact concerning the falsity of your prediction, however, *cannot even be defined* without essential reference to a future time (tomorrow). Its "pastness" is merely grammatical; ontologically, it’s a fact *straddling* times, deriving its truth from tomorrow’s outcome, not encapsulated within the present or past alone.
