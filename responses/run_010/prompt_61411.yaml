  Okay, the user is diving deep into Lewis's Principal Principle and wants an accuracy audit of a specific passage from a metaphysics chapter. They're clearly well-versed in philosophy but have concerns about the passage's interpretation of objective chance as merely normative rather than worldly. 

  First impression: the user is doing serious academic work—probably writing a paper or thesis—and needs to verify sources meticulously. Their frustration is palpable; they came expecting objective chance to be "a genuine feature of the world," but the passage frames it as a belief constraint. That tension needs unpacking. 

  Breaking it down sentence by sentence: 

  The gloss's opening claim that chance is "nothing over and above" a constraint on belief feels reductive. Lewis absolutely ties chance to physical reality via the Best System Analysis (BSA). The user's instinct is right—this downplays the metaphysical grounding. 

  On the "subjectivist's guide" phrasing: Lewis did use that title, but ironically. His project was reconciling objective chance with subjective credence, not reducing the former to the latter. The passage misses that nuance entirely. 

  Admissibility proviso: Correct that outcome evidence is excluded because it makes chance 0/1, but the passage ignores Lewis's broader point about *temporal asymmetry*. Also, "whatever else she knows" oversimplifies—admissibility depends on the *type* of evidence, not just total knowledge. 

  Self-undermining worry: Big red flag here. The passage claims the proviso alone solves the problem, but Lewis explicitly adopted the New Principle because it didn't. This isn't just simplification—it's factually wrong. Hall and Thau's work showed the original Principle was inconsistent in some Humean contexts. 

  Consequences: The claim that "no evidence can ever count against a chance hypothesis" is flatly false. BSA allows empirical undercutting (e.g., if quantum mechanics were falsified). And credences *can* diverge from chances with inadmissible evidence—that's the whole point of the proviso! 

  For the user's own work: They can safely cite the structural role of the Principal Principle and the admissibility of outcome evidence. But they should avoid any claim that the proviso fixes self-undermining or that chance is purely normative. The closing "consequences" are landmines—steer clear. 

  User's deeper need: They want to engage critically with Humean metaphysics without misrepresenting Lewis. The passage's errors risk derailing their argument. They need ammunition to challenge it while staying scholarly. Highlighting the BSA's role and the New Principle's necessity gives them that.
answer: |-
  Here's a sentence-by-sentence accuracy audit of the gloss, drawing on Lewis's work ("A Subjectivist's Guide to Objective Chance," *Philosophical Papers, Volume II*) and specialist consensus:

  1.  **"Lewis's Principal Principle says that chance is nothing over and above a constraint on rational belief..."**
      *   **Accuracy:** **Misrepresentation.** While the PP *constrains* rational belief, Lewis explicitly argues chance is a *genuine objective feature of the world*, grounded in the Humean mosaic via the Best System Analysis (BSA). The PP is a *conceptual* link between chance and credence, not a *reduction* of chance to norms of belief. The gloss conflates the PP's role (constraining credence) with its ontological status (describing an objective feature). Lewis saw the PP as *fixing the concept* of chance, but what *makes* something the chance function is the BSA, an objective feature of the world.

  2.  **"...to say that the chance of A at a time is x is to say that a rational agent who learns this must believe A to degree x, whatever else she may know."**
      *   **Accuracy:** **Incorrect logical form / Oversimplification.** The PP is fundamentally about *conditional* credence: Cr(A | H\_t ∧ E) = x, where H\_t is the history up to t *and* the complete chance theory T (stating that ch\_t(A) = x), and E is any *admissible* evidence (at t). It's not simply "learns the chance and whatever else"; it's conditional on the *entire chance theory plus history* and *only admissible* additional evidence. The "whatever else she may know" is dangerously misleading without the admissibility restriction.

  3.  **"This is what makes his paper a subjectivist's guide to objective chance — the objectivity in question belongs to the norms governing our credences rather than to the world."**
      *   **Accuracy:** **Misrepresentation of Lewis's intent.** Lewis titled the paper ironically. His goal was *precisely* to reconcile objective chance with subjectivist probability (credence). He argues strenuously that chance *is* objective and part of the world (via BSA). The "subjectivist's guide" aspect is that he uses the PP (a principle about rational credence) to *define* what objective chance *is*. The objectivity *does* belong to the world; the PP tells us how rational credence should *track* that worldly feature. The gloss misreads the title and project.

  4.  **"Nor is the Principle an extra assumption bolted onto some independent account of chance; it is the entire content of the notion, since whatever plays this belief-guiding role deserves the name."**
      *   **Accuracy:** **Defensible Core, but Misleading.** The PP *is* central to Lewis's *conceptual analysis* of chance – it tells us what the *concept* "chance" means. Lewis argues that any feature that plays the PP role *is* chance. **However,** for Lewis, *what makes it the case* that a particular function plays this role in our world is the objective BSA. The PP gives the role, the BSA provides the occupant. The gloss overreaches by suggesting the PP defines the *entire content* without acknowledging the BSA as the metaphysical ground determining *which* function plays the role.

  5.  **"The proviso is easy to state. Certain evidence is inadmissible, namely evidence about how the event in question actually turns out..."**
      *   **Accuracy:** **Correct (Simplification).** Outcome information is the paradigmatic example of inadmissible evidence. This is standard.

  6.  **"...for such evidence would show the chance to be one or zero and thereby destroy the chance hypothesis it accompanies."**
      *   **Accuracy:** **Simplification / Partial.** This captures *one* consequence (learning outcome info typically makes the chance 0 or 1 trivially). However, Lewis's deeper reason for the proviso is *temporal asymmetry*: admissible evidence is restricted to evidence about the *past and present* (up to t), preserving the idea that chance is a forward-looking propensity. Outcome info is future relative to t, hence inadmissible. The gloss captures an effect but misses the core temporal motivation.

  7.  **"With the proviso in place the Principle is safe from the well-known worry that Humean chance hypotheses are self-undermining..."**
      *   **Accuracy:** **False.** This is a critical error. Lewis *himself* recognized that the original PP + proviso was *not* safe from self-undermining in Humean contexts. The problem arises when the chance theory T (specified by the BSA) assigns a high chance to worlds where the mosaic is such that T is *not* the best system (i.e., T undermines itself). The *original* PP + proviso *can* lead to inconsistency in such cases. This is precisely *why* Lewis (following Hall, Thau, and others) adopted the New Principle.

  8.  **"...and the so-called New Principle of Hall and Thau is nothing but the old Principle with the proviso folded into the chance operator; Lewis's account therefore required no revision."**
      *   **Accuracy:** **False / Significant Oversimplification.** The New Principle (NP: Cr(A | H\_t ∧ T) = ch\_t(A | T)) is *not* equivalent to the old PP with the proviso "folded in." It fundamentally changes how the chance theory is used. The NP conditions the chance *itself* on the complete chance theory T, making the chance "hypothesis-relative." This *is* a substantive revision. While Lewis eventually accepted it as a friendly amendment preserving the spirit of his project, it *was* a revision necessitated by the self-undermining problem the original PP + proviso *could not* solve. The gloss's confidence presupposes a highly contested view (that NP is just a notational variant) that Lewis and most specialists explicitly rejected.

  9.  **"Two consequences follow. No evidence, of any kind, can ever count against a chance hypothesis."**
      *   **Accuracy:** **False.** This does *not* follow from a correct understanding of Lewis. Chance hypotheses (like "this atom has a 50% chance of decaying in the next hour"), derived from the fundamental theory T via the BSA, *can* be empirically tested and falsified. Observing frequencies wildly at odds with the hypothesized chances *can* count against T (or the specific hypothesis derived from it), potentially showing that T is *not* the best system for the world. The PP/NP governs *credence conditional on T*, not the empirical confirmation of T itself.

  10. **"And a rational agent's credence in a proposition can never come apart from that proposition's chance."**
      *   **Accuracy:** **False.** This is directly contradicted by the admissibility proviso itself! A rational agent *with knowledge of the outcome* (inadmissible evidence) *must* have credence 0 or 1, while the chance (at the relevant prior time) was intermediate. The whole point of admissibility is that credence *can* and *should* come apart from the *past* chance when the agent has specific, relevant information the chance function didn't have access to (like the outcome).

  **Summary of Key Errors & Defensible Parts:**

  *   **Defensible:**
      *   The PP constrains rational credence.
      *   Outcome information is inadmissible.
      *   The PP is central to Lewis's *conceptual analysis* of chance.
  *   **Simplifications (Charitably Expandable):**
      *   The core idea that the PP links chance to rational credence.
      *   Outcome info being inadmissible because it makes chance 0/1 (though temporal asymmetry is the deeper reason).
  *   **Misrepresentations / Falsehoods:**
      *   **Ontology:** Chance *is* reduced to a constraint on belief (ignores BSA and objective grounding).
      *   **Logical Form:** "Whatever else she may know" ignores the critical admissibility condition and the structure of conditioning on H\_t ∧ T.
      *   **"Subjectivist's Guide" Intent:** Misreads Lewis's project; he defends objective chance.
      *   **Self-Undermining & New Principle:** The proviso *did not* solve the problem; the NP *was* a substantive revision Lewis accepted.
      *   **Consequences 1 & 2:** Both are demonstrably false based on Lewis's own framework.

  **For Your Own Work: You Can Cite...**

  *   The PP as Lewis's central principle linking objective chance to rational credence.
  *   The inadmissibility of outcome information (specifying it's the paradigmatic case).
  *   Lewis's view that the PP plays a crucial role in defining the *concept* of chance.

  **Avoid Citing...**

  *   Any claim that chance is "nothing over and above" a constraint on belief or that its objectivity lies *only* in norms.
  *   The "whatever else she may know" formulation without emphasizing admissibility and the specific conditioning structure.
  *   The interpretation of "subjectivist's guide" implying chance isn't worldly.
  *   The claims that the proviso solved self-undermining or that the NP is just the PP folded up.
  *   The two "consequences" at the end.

  **Defensible Nearby Claims:**
  1.  *Instead of "no evidence counts against a chance hypothesis":* "According to Lewis, the Principal Principle (New Principle) dictates that *conditional on accepting a complete chance theory T*, no admissible evidence can justify credences that diverge from the chances specified by T." (This acknowledges the conditional nature and admissibility).
  2.  *Instead of "credence can never come apart from chance":* "Lewis's Principal Principle requires that, *in the absence of inadmissible evidence*, a rational agent's credence in A conditional on the complete chance theory T and history H\_t must equal the chance of A at t according to T." (This captures the core normative link while acknowledging the proviso).

  The passage significantly misrepresents Lewis's ontology of chance and the reasons for and nature of the move to the New Principle. While the PP is central, it is not the whole story, and the BSA is essential for understanding chance as an objective feature for Lewis. The closing consequences are outright false.
