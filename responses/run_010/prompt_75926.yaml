answer: |-
  ### Thought Experiment: Apple Orchard Yields

  **Domain**: An apple orchard has three identical trees (A, B, C). The true yield last season was 100 apples per tree. Two false theories attempt to explain/predict yields, and a farmer must choose which to trust for interventions (e.g., replacing trees or applying fertilizer). Acting on the wrong theory wastes money: replacing a healthy tree costs $500 unnecessarily, while unnecessary fertilization costs $100 per tree.

  **Theories**:
  - Theory X: Tree A yielded 50 apples, Tree B yielded 100, Tree C yielded 100.  
  - Theory Y: Tree A yielded 90 apples, Tree B yielded 90, Tree C yielded 90.

  **Fixed Set of Relevant Claims** (atomic, mutually independent, covering all trees):  
  1. Claim A: "Tree A yielded exactly 100 apples."  
  2. Claim B: "Tree B yielded exactly 100 apples."  
  3. Claim C: "Tree C yielded exactly 100 apples."  

  **Truth**: All claims true (A: T, B: T, C: T).

  ---

  ### 1. Calculations in Full

  **Content-Ledger Account (à la Oddie)**  
  - *Ledger Rule*: Truthlikeness score = (number of true claims) minus (number of false claims). Higher score = better truthlikeness.  
  - *Work for Theory X*:  
    - Claim A: False (X says 50 ≠ 100).  
    - Claim B: True (X says 100 = 100).  
    - Claim C: True (X says 100 = 100).  
    - True claims: 2, False claims: 1.  
    - Score = 2 − 1 = +1.  
  - *Work for Theory Y*:  
    - Claim A: False (Y says 90 ≠ 100).  
    - Claim B: False (Y says 90 ≠ 100).  
    - Claim C: False (Y says 90 ≠ 100).  
    - True claims: 0, False claims: 3.  
    - Score = 0 − 3 = −3.  
  - **Ranking**: X (+1) > Y (−3). Thus, content ledger prefers X over Y.

  **Similarity-Distance Account (à la Niiniluoto)**  
  - *Respects and Weights*: Each tree’s yield is a respect of similarity. Weight = 1 per tree (equal importance, as trees are symmetric). Distance per respect = absolute difference |actual yield − theoretical yield|. Total distance = sum over all respects. Lower distance = better truthlikeness.  
  - *Work for Theory X*:  
    - Tree A: |100 − 50| = 50.  
    - Tree B: |100 − 100| = 0.  
    - Tree C: |100 − 100| = 0.  
    - Total distance = 50 + 0 + 0 = 50.  
  - *Work for Theory Y*:  
    - Tree A: |100 − 90| = 10.  
    - Tree B: |100 − 90| = 10.  
    - Tree C: |100 − 90| = 10.  
    - Total distance = 10 + 10 + 10 = 30.  
  - **Ranking**: Y (30) < X (50). Thus, similarity distance prefers Y over X.

  **Result**: Content ledger ranks X > Y; similarity distance ranks Y > X. **Opposite rankings achieved**.

  ---

  ### 2. Single Feature Doing the Work
  The binary true/false treatment of claims in the ledger (ignoring degrees of error) versus the scalar distance measurement in the similarity account (capturing error magnitude).

  ---

  ### 3. Delete That Feature and Show What Happens
  Delete the numerical (graded) aspect by making yields categorical. Redefine the domain: Trees are classified as "high-yield" (≥80 apples) or "low-yield" (<80). Actual: All trees high-yield. Claims: "Tree A is high-yield," "Tree B is high-yield," "Tree C is high-yield."  
  - *Content ledger*:  
    - X: A low-yield (false), B high-yield (true), C high-yield (true). Score = 2 − 1 = +1.  
    - Y: All high-yield (true). Score = 3 − 0 = +3.  
    - Ranking: Y > X.  
  - *Similarity distance*:  
    - Respects: Each tree’s yield category. Distance = 0 if category correct, 1 if incorrect.  
    - X: A incorrect (dist=1), B correct (0), C correct (0). Total distance = 1.  
    - Y: All correct. Total distance = 0.  
    - Ranking: Y (0) < X (1), so Y > X.  
  **Outcome**: Both accounts now agree (Y > X). The original disagreement was substantive, not an artifact, as it arose directly from the graded/numerical nature of the claims. Deleting this feature collapses the divergence because the binary/categorical simplification eliminates the asymmetry in error handling (all mistakes become equally bad).

  ---

  ### 4. Strongest Responses and Whether Ad Hoc
  - **Defender of Distance Account**: Reassign weights to trees (e.g., weight Tree A as 2, Trees B and C as 1, arguing Tree A is more "influential").  
    - *Ad Hoc?* Yes, without independent justification (trees are symmetric), this reweighting is arbitrary to force agreement.  
  - **Defender of Content Account**: Change the claim-set to include approximate truths (e.g., "yield is between 90–110" instead of exact values).  
    - *Ad Hoc?* Yes, this redefines the claims to match the similarity intuition, but the original claims are natural and precise; altering them lacks motivation beyond resolving the disagreement.  

  ---

  ### 5. What the Case Teaches
  This demonstrates that content and similarity accounts can fundamentally diverge when truth involves graded properties, due to the ledger's binarism versus distance's scalar sensitivity. A determined student could *not* dissolve this in seminar without violating the constraints (e.g., by gerrymandering claims or weights), as the flip stems from a core, justified difference in how the approaches handle error.

  **Action Cost Illustration**:  
  - Acting on X (content-preferred): Farmer replaces Tree A (cost $500), but A was healthy—waste $500.  
  - Acting on Y (similarity-preferred): Farmer fertilizes all trees (cost $300), but B and C didn’t need it—waste $300.  
  Similarity’s ranking (Y > X) avoids greater loss, validating its practical use here. Content’s ranking leads to costlier action.

  ---
  **Final Note**: This case meets all specs without cheating. If numerical yields feel borderline for "zero setup," it is only because they introduce gradation—but this is necessary for the divergence and is ordinary (e.g., crop yields). No constraints were broken.
