prompt: |-
  I'm guest-teaching one 75-minute slot in a second-year paradoxes course next week, on the Pasadena gamble -- the coin-flip game where, if heads first shows up on the nth toss, you win 100/n dollars when n is odd and lose 100/n dollars when n is even, so that adding the expected value up in the obvious order gives you the alternating harmonic series times 100. The students have had first-year calculus: they know the harmonic series diverges, they've almost certainly never been told anything about conditional convergence or about rearranging a series, and they've heard the St Petersburg game name-dropped somewhere but couldn't restate it. So plan the session for me rather than explaining the material -- what goes in first, what depends on what, and where the 75 minutes actually goes. Specifically: how much of St Petersburg do I need to rebuild before this game means anything to them, can I get "the harmonic series blows up" on the board before I ever show them the alternating version, and do I have to teach Riemann rearrangement properly or is there an honest way to gesture at it by shuffling the terms once in front of them and getting a different number out.

  I also want to carry the whole thing on one example and I'm not sure I've picked right. My plan was to cap the game at, say, the first hundred terms, so they could actually compute something and watch the pathology show up concretely -- but now I'm worried a truncated game has a perfectly respectable expectation, which means I'd have spent the session teaching them a game that isn't paradoxical and then just asserting that the real one is. Tell me whether that truncation is a usable device or a trap, and if its a trap what the carrying example should be instead, what it has to have and what it has to leave out.

  Then the misconceptions. I'm confident half the room will leave thinking "so it's worth about $69 and that's a great bet", the other half will insist that reordering the tosses is cheating because you can't reorder an actual sequence of coin flips, and a few will conclude that expected value is just broken and you should be using some other rule instead. Where in the sequence does each of those get headed off, and is there one I should be braced for that isn't on my list? Related to that: I genuinely don't know whether the slogan to give them is "this gamble has no expected value" or "it has one, but the number isn't pinned down" -- whichever I say they'll repeat back at me, so tell me which is right and what to say to the student who pushes on it.

  Finish with one question I can ask at the end that would show whether any of it landed, and tell me what a course like this simply can't handle in 75 minutes -- but say what you're cutting and why, so I'm not caught out when someone asks. No reading list, they've got the handout already and I don't want to spend the slot pointing at papers. Please write it all as one continuous piece of prose, like an email: no headings, no bullet points, no bold, no tables.
