answer: |-
  ### Defensible Decision Procedure for Model-Based Chance Credence Alignment

  **1. Diagnostic Opening: Failure Modes of Naive Deference**  
  The instruction "treat validated model output as objective chance and set credence equal to it" fails in distinct ways. Six irreducibly different failure modes:  

  1. **Structural Incapacity**: Model lacks variables/mechanisms to represent known physical processes (e.g., omitting corrosion pathways in repository seals). *Cannot repair, only flag*.  
  2. **Validation Scope Gap**: Validation tests cover conditions ≠ actual operating envelope (e.g., tested at 25°C but operating at 80°C). *May repair via sensitivity analysis; else flag*.  
  3. **Temporal Decay**: Assumptions frozen at t₀ invalid by t₁ due to exogenous changes (e.g., new seismic data). *Cannot repair post-submission; flag for reassessment*.  
  4. **Target Ambiguity**: "Same event" defined inconsistently across models (e.g., "core damage" vs. "fuel melt initiating core damage"). *Requires conceptual reconciliation; cannot repair technically*.  
  5. **Epistemic Misalignment**: Output is frequentist estimate from limited tests, not a chance propensity (e.g., 10 trials estimating pipe rupture). *Cannot treat as chance; requires separate handling*.  
  6. **Self-Defeating Outputs**: Model assigns non-trivial probability to futures where its assumptions fail (e.g., 15% chance of regulatory change altering maintenance protocols). *Credence cannot blindly match output*.  

  *The procedure repairs #2 (partially) and #5; flags #1, #3, #4, #6.*

  ---

  **2. The Procedure: 6-Step Review**  

  **Step 1: Target Event Scrutiny**  
  - *Ask:* Does the model’s target event definition match the licensing condition’s specification?  
  - *Sufficient answer:* Exact textual alignment in initiating events, success criteria, and timeframe.  
  - *Outcome:* Misalignment → "Do not defer". Proceed if aligned.  

  **Step 2: Validation Domain Check**  
  - *Ask:* Was validation performed under conditions bounding actual operational envelopes?  
  - *Sufficient answer:* Test data enveloping max stress, min maintenance, worst-case environments.  
  - *Outcome:* Gap → Repair via sensitivity analysis (e.g., ±20% stressor). If impossible → Flag to panel. Proceed if sufficient.  

  **Step 3: Dynamic Assumption Audit**  
  - *Ask:* Does the model output assume static exogenous conditions?  
  - *Sufficient answer:* Explicit treatment of aging, policy shifts, or climate effects.  
  - *Outcome:* Assumes stasis → Check Step 5. Explicit dynamics → Proceed.  

  **Step 4: Chance/Frequency Distinction**  
  - *Ask:* Is output derived from first-principles simulation (chance) or empirical data sample (frequency)?  
  - *Sufficient answer:* Simulation = stochastic physics (e.g., Monte Carlo neutron transport); Frequency = statistical fit to test data (e.g., Weibull analysis of 40 pump failures).  
  - *Outcome:* Frequency → Set credence = output ± CI (95% default). Chance → Proceed to Step 5.  

  **Step 5: Self-Consistency Test**  
  - *Ask:* Does model output include futures where its assumptions fail?  
  - *Sufficient answer:* Scenario analysis showing P(assumption failure) < 0.01 or conditionalisation (e.g., "frequency given no regulatory change").  
  - *Outcome:* P(failure) > 0.01 → Set credence = max(output, P(failure)). Else → Proceed.  

  **Step 6: Deference Decision**  
  - *Ask:* Is there direct, unassimilated evidence about event occurrence? (See 3a).  
  - *Sufficient answer:* Evidence concerns model reliability → Defer. Evidence concerns event → Do not defer.  
  - *Outcome:* Defer → Set credence = model output. Do not defer → Quantify discrepancy for panel.  

  *Written Record:* One-sentence justification per step (e.g., "Step 1 pass: ‘core damage’ matches Licence Condition 4B").  

  ---

  **3. Hard Cases**  

  **(a) Reviewer Information Classification**  
  | **Remark** | **Side** | **Why** |  
  |------------|----------|---------|  
  | Maintenance log showing seal degradation at sister sites | Event occurrence | Direct physical evidence altering event probability. Not a model critique. |  
  | Whistleblower claim of bypassed interlock | Event occurrence | Alters likelihood of initiating event. Not disputing model structure. |  
  | Meta-analysis showing model family underestimates CCFs | Model reliability | Challenges model’s causal accuracy. Not specific to this event. |  
  | Poor housekeeping during site visit | Model reliability | Induces doubt about input data validity (e.g., maintenance records). |  

  *The clause is wrong if "chance" is metaphysical. It works only if "chance" means "best-operationalised propensity estimate".*  

  **(b) Self-Undermining Model**  
  - If model gives P(target | static assumptions) = 10⁻⁶ but P(assumptions fail) = 0.3:  
    - *Procedure outcome:* Set credence = max(10⁻⁶, 0.3) = 0.3 (Step 5).  
    - *Rationale:* You cannot have >30% credence that the chance is ill-defined.  

  **(c) Conflicting Models for "Same" Event**  
  - E.g., Model A (partial function loss) = 10⁻⁴; Model B (complete loss) = 10⁻⁶.  
    - *Governing principle:* Licensing condition defines target. If ambiguous, panel must resolve (Step 1).  
    - *The principle cannot answer this* – it exposes target event as a normative choice.  

  **(d) Frequency Estimates**  
  - Constraint: Reviewer credence must equal frequency estimate ± confidence interval (Step 4).  
    - *Separate branch?* Yes – frequencies lack modally rich chance properties. CI adjustment is essential.  

  **(e) Triviality Worry**  
  - *Honest view:* The clause *does work* if "chance" means "the quantity a validated model built to regulatory standards outputs when simulating this target". This is a convention, not metaphysics.  
  - *Replacement needed?* Only if validation is perfunctory. Defensibility requires rigorous Steps 1–5.  

  ---

  **4. Worked Applications**  

  **Case 1: Research Reactor (Seal Degradation Logs)**  
  - Model output: 2 × 10⁻⁵ (validated). Reviewer has logs showing early degradation in identical pumps.  
  - *Procedure:* Step 6 → Evidence concerns event occurrence (degradation directly increases failure probability). *Do not defer*.  
  - *Record:* "Step 6 fail: Unmodelled evidence of accelerated wear in Pump Batch XY-7."  

  **Case 2: Reprocessing Line (Self-Undermining Output)**  
  - Model: P(target | no config change) = 10⁻⁷; P(config change in 10y) = 0.3.  
  - *Procedure:* Step 5 → P(assumption failure) = 0.3 > 0.01 → Set credence = max(10⁻⁷, 0.3) = 0.3.  
  - *Record:* "Step 5 adjustment: Model assigns 0.3 to assumption invalidation. Credence = 0.3."  

  **Case 3: Deliberately Uncomfortable Result**  
  - *Scenario:* Operator submits fault tree model for waste tank rupture (P = 5 × 10⁻⁸). Model passes validation. Reviewer knows a *different* tank at same site ruptured 3 years prior.  
  - *Procedure:* Step 6 → Evidence (past rupture) concerns model reliability (it overlooked corrosion mechanism). *Defer* but flag for model update.  
  - *Why uncomfortable:* A reasonable panel might reject 5 × 10⁻⁸ as complacent given history. But the evidence critiques the model generically, not this event specifically. *Honest theory:* Deference holds until model revision.  

  ---

  **5. Limitations and Costs**  

  **Judgment Calls in Procedure Costume**  
  - Step 1: "Exact textual alignment" (interpretive).  
  - Step 2: "Conditions bounding operational envelopes" (engineering judgment).  
  - Step 6: Classifying evidence type (philosophical distinction).  

  **What the Procedure Cannot Do**  
  - Resolve ambiguities in licensing conditions.  
  - Handle models with unvalidated black-box AI components.  
  - Overcome sparse data where "validation" is theoretical.  

  **Deliberate Collapses**  
  - *Collapsed:* Distinction between propensity and Humean chance (costs metaphysical precision).  
  - *Collapsed:* Degrees of validation rigor (costs nuance for binary pass/fail).  
  - *Collapsed:* Non-stochastic uncertainties (e.g., cyber threats) forced into probability format.  

  ---

  **6. One-Page Run Sheet**  

  **REVIEWER DECISION SHEET: MODEL-DERIVED CHANCE DEFERENCE**  
  *[ ] Step 1: TARGET MATCH?*  
  - Does model’s event definition *exactly* match the licence condition?  
  - NO → Do not defer. Stop.  
  - YES → Proceed.  

  *[ ] Step 2: VALIDATION COVERAGE?*  
  - Were tests done under conditions *equal/worse* than real operations?  
  - NO → Can you bound uncertainty via ±% sensitivity?  
    - YES → Adjust output, proceed.  
    - NO → Flag to panel. Stop.  
  - YES → Proceed.  

  *[ ] Step 3: DYNAMIC WORLD?*  
  - Does model *explicitly* handle external changes (e.g., climate, policy)?  
  - NO → Proceed to Step 5.  
  - YES → Proceed.  

  *[ ] Step 4: CHANCE OR FREQUENCY?*  
  - Is output from *physics simulation* or *data fitting*?  
  - FREQUENCY → Set credence = output ± 95% CI. Stop.  
  - CHANCE → Proceed.  

  *[ ] Step 5: SELF-CONSISTENT?*  
  - Does model give P(assumptions fail) > 0.01?  
  - YES → Set credence = max(model output, P(failure)). Stop.  
  - NO → Proceed.  

  *[ ] Step 6: EXTERNAL EVIDENCE?*  
  - Is there evidence about:  
    - (a) *This event occurring*? (e.g., component defects, witness reports) → **Do not defer.**  
    - (b) *Model reliability*? (e.g., industry-wide bias, data gaps) → **Defer (set credence = output).**  
    - Unclear → **Refer to panel.**  

  **AUDIT RECORD:**  
  Case ID: _________ Step outcomes: 1[_] 2[_] 3[_] 4[_] 5[_] 6[_]  
  Credence set: _________ Rationale: _________  
  Signature: _________ Date: _________  

  ---  
  *This procedure operationalises the Principal Principle as a regulatory convention, prioritising auditability over metaphysical precision. It reduces complacency risk by forcing explicit scrutiny of model-world correspondence.*
