prompt: |-
  I do compliance work for a firm that builds things in about a dozen countries, and I've been trying to write down the rule I actually apply when I sign off on stuff, because the handbook's line — anything of value given to influence an official decision — turns out to be useless. Half of what my colleagues consider ordinary business would fail it and nobody thinks any of that half is wrong. So here are my real verdicts, including the ones that embarrass me.

  A contractor's wife invites my counterpart at the ministry to her sister's wedding, seats him at the family table, and the family hands him an envelope of cash. Fine. I'd actually be suspicious of him if he refused.
  The same contractor hands the same official an envelope of cash in a parking garage. Not fine, obviously.
  A supplier sends the head of procurement a bottle of whisky at New Year, worth maybe sixty dollars. Fine.
  The same supplier sends the same bottle three days before the tender closes. Not fine — and this is the one that breaks my brain, because I'd bet the tender was already decided either way and nothing about the bottle changed.
  A regional governor routes a road through the district that elected him, adding twenty percent to the cost. Fine, that's what he was elected to do.
  That same governor steers the guardrail contract to his brother's firm. Not fine.
  A council member's daughter gets hired by a developer with permits pending before her mother's committee. Not fine.
  The same daughter gets hired by the same developer six years after her mother left the committee, at market salary, and she's genuinely good at the work. I want to say fine, but I notice I would never approve it in writing.
  A mining company pays for the village chief's son to go to university, with nothing pending and no promise made. I said fine once and I still don't know if I was right.
  A mining company pays for the village school's roof. Fine, definitely.
  An MP takes a paid directorship and declares it in the public register. Legally fine, and my gut says not fine, and I can't tell you why my gut says what it says.
  A junior official refuses a gift from an elder who has been hosting and feeding him for years, and after that the elder's whole network treats him as an outsider. I feel the refusal was wrong and not just imprudent. That is a verdict I cannot defend to anyone at work.

  So. Where am I going wrong, or am I going wrong at all? The pairs I can't live with: same bottle, same two people, verdict flips on timing alone. Same money, same two people, verdict flips on which ceremony it happens inside. And the governor — I let him send an entire road to his own district but not a guardrail contract to his brother, and I can't state a principle that does that work without either condemning all the road-routing (which I don't want to do) or approving the brother (which I very much don't want to do).

  There's a second worry underneath. When I'm sitting in the country where the wedding envelope is a normal thing inside a relationship everybody can see, I judge one way, and when I'm home I judge another, and I can't tell whether I'm applying one standard with two inputs or two standards and flattering myself about it. If it's two, I want to know which one is the mistake, and I don't want to be told the answer is "context" unless you tell me what about the context is doing the work.

  What I want from you: a single principle, not a checklist, that comes as close as possible to my verdicts. State it precisely enough that I could apply it to a case I haven't seen. Then show me which clause is doing the work in each of the pairs I flagged — bottle, envelope, governor, the daughter. Then tell me what the principle says about two cases I didn't list: a company paying an official's father's hospital bills five years after the official left office, and a lobbyist taking a regulator's junior staff out to dinner once a month for years with nothing pending at any of those dinners. And if staying coherent forces the principle to overrule some of my verdicts, say which ones and why I shouldn't just patch it with exceptions — I can already feel the patching impulse and I think it's the wrong instinct.

  Bottom line in your very first sentence: does a principle like this exist, and roughly what is it. Then the reasoning. No preamble, no restating my cases back at me.
reasoning: |-
  Okay, let me tackle this compliance officer's challenge. They're struggling to articulate a consistent principle for ethical approvals across different cultural contexts, frustrated by their handbook's vague "anything of value to influence" standard. Their real-world verdicts reveal contradictions they can't justify - like accepting cash in wedding envelopes but not in parking garages, or whiskey gifts depending on timing. 

  The core tension seems to be between two dimensions: relational context and decision independence. When benefits are embedded in visible social relationships (weddings, community hosting) and detached from specific decisions, they feel permissible. But identical transfers become problematic when either factor changes - like the same bottle arriving right before a tender. The governor case highlights this: routing roads to his district is relational (fulfilling campaign promises) while steering contracts to his brother is transactional.

  For the principle itself, I'm considering something like: "Transfer of value is permissible when it occurs within an established social framework that doesn't target specific pending decisions." This would explain why the wedding cash is okay (social ceremony) but garage cash isn't (no framework). The whiskey timing flip makes sense too - New Year's is calendrical/social, while pre-tender timing creates decision linkage. 

  Testing it on their unlisted cases: Paying an ex-official's father's hospital bills? Probably fine under this principle - no pending decisions, and healthcare could fit certain social frameworks. But monthly lobbyist dinners? Tricky - regular socialization might establish a framework, but creates ongoing obligation that could poison future decisions. Might need refinement here.

  Where their verdicts might need adjustment: The village chief's son's tuition gives me pause. While no decision was pending, it's a high-value transfer to a decisionmaker's family member - potentially creating future expectations. Their "fine" call might conflict with the principle's emphasis on avoiding decision-targeted benefits. Similarly, the MP's directorship feels problematic because it's ongoing compensation to a sitting official, even if declared.

  The cultural relativity concern is real but manageable under this model. What matters isn't which culture but whether the social framework is transparent and consensual. Refusing the elder's gift wasn't just imprudent - it violated legitimate relational expectations. The key is whether the framework genuinely exists versus being manufactured for cover.

  This approach forces hard choices. For instance, the developer hiring the council member's daughter years later: under the principle, it should be fine, but their discomfort suggests instinctive suspicion of residual influence. Maybe the principle is right here and their hesitation is misplaced. No system will perfectly match every intuition - coherence requires pruning some edge cases.
answer: |-
  **A principle exists: Permit transfers of value only if they occur within a legitimate, established social or institutional framework that exists independently of any specific official decision, and where the transfer itself does not create a material dependency or obligation tied to a pending or reasonably foreseeable decision.**

  **Reasoning & Application:**

  1.  **The Framework Clause:** The transfer must be embedded in a recognized, non-transactional context (cultural ceremony, long-term personal relationship, institutional practice, legitimate political process). This framework must predate and exist separately from any specific official act it might coincidentally benefit.
  2.  **The Independence/Dependency Clause:** The transfer cannot be timed to coincide with a pending decision, nor can its nature/value be such that it creates a *new*, material obligation or dependency on the recipient *specifically concerning their official duties*. The recipient's official independence must remain intact.

  **Applying the Principle to Your Cases:**

  *   **Contractor's Wife & Wedding Envelope (Fine):**
      *   *Framework:* Culturally recognized social ceremony (wedding), gift-giving to guests (especially at family table) is an established norm within that framework.
      *   *Independence:* The gift is part of the ceremony, not tied to any specific pending decision. Refusal would violate the social framework, not preserve independence *from* it. Dependency is social/cultural, not transactional.
  *   **Contractor & Garage Envelope (Not Fine):**
      *   *Framework:* None. A parking garage meeting lacks any independent social or institutional framework justifying cash transfer.
      *   *Independence:* The cash inherently creates a direct, material dependency/obligation tied to the official's role. Timing/context implies intent to influence.
  *   **Supplier & New Year Whisky (Fine):**
      *   *Framework:* Recognized seasonal gift-giving custom between business associates.
      *   *Independence:* No pending decision. Gift is modest and part of a general practice, not creating a specific obligation tied to a procurement decision.
  *   **Supplier & Pre-Tender Whisky (Not Fine):**
      *   *Framework:* Seasonal custom exists, but timing exploits it.
      *   *Independence:* Timing creates an unavoidable link to the pending tender. Even if the decision was made, the gift creates an *appearance* of obligation/dependency *specifically* related to that tender, undermining perceived independence. The *context of the pending decision* overrides the general framework.
  *   **Governor Routing Road (Fine):**
      *   *Framework:* Legitimate political framework (election promises, constituent service, representative democracy). Routing projects to benefit constituents, even disproportionately, is an inherent part of the role's framework.
      *   *Independence:* The action is *itself* the exercise of official discretion within the legitimate political framework. No *external* dependency/obligation is created.
  *   **Governor Steering Contract to Brother (Not Fine):**
      *   *Framework:* No legitimate political or institutional framework exists for favoring a specific relative's business. Nepotism is not an inherent, accepted part of the political representative role.
      *   *Independence:* Creates a direct, material dependency/obligation *to family interests* that conflicts with the duty of independent judgment in contracting.
  *   **Daughter Hired While Mother on Committee (Not Fine):**
      *   *Framework:* Hiring based on merit exists, but timing/relationship creates overwhelming presumption of an *alternative* framework (influence peddling).
      *   *Independence:* Creates an immediate, material obligation/dependency on the official (mother) regarding pending permits. The hiring itself is the influencing act.
  *   **Daughter Hired 6 Years Later (Should be Fine, Principle Overrules Your Hesitation):**
      *   *Framework:* Legitimate employment framework (market salary, genuine skill). Time and departure sever the direct link to the mother's official capacity.
      *   *Independence:* No pending decision involving the mother. Hiring creates an obligation to the *employer* (developer), but not one tied to the *mother's former or potential future* official actions. Your discomfort likely stems from residual association, but the principle demands focus on current framework and independence.
  *   **Mining Co. Pays for Chief's Son (Not Fine - Principle Overrules Your Past Verdict):**
      *   *Framework:* While philanthropy exists, paying individual family expenses (esp. high-value like university) for a *sitting decision-maker* lacks a clear, established, independent framework justifying *this specific* transfer. It feels personal and exceptional.
      *   *Independence:* Creates a profound, long-term material dependency/obligation on the chief *in his official role*, regardless of current pending issues. It fundamentally compromises future independence.
  *   **Mining Co. Pays for Village School Roof (Fine):**
      *   *Framework:* Established framework of corporate social responsibility (CSR) or community development projects benefiting the collective.
      *   *Independence:* Benefits the community, not an individual decision-maker. Creates goodwill, but not a *personal, material dependency* for the chief tied to official acts. Obligation is diffuse and community-based.
  *   **MP Paid Directorship (Not Fine - Principle Overrules "Legally Fine"):**
      *   *Framework:* While declaring it is a legal framework, the *act of taking payment* from an external entity while holding office lacks a legitimate *independent* framework compatible with the duty of independent representation. It's inherently transactional.
      *   *Independence:* Creates a direct, ongoing material obligation/dependency to the paying company, fundamentally compromising independence on any matter affecting that company. The conflict is structural.
  *   **Junior Official Refusing Elder's Gift (Wrong - Principle Supports Your Feeling):**
      *   *Framework:* Deeply established, long-term social/cultural framework of hospitality, reciprocity, and community belonging. The gift is embedded within this pre-existing relationship.
      *   *Independence:* The gift sustains the social relationship, not an official decision. Refusing *within this framework* is a rejection of the relationship itself, not a defense of independence. The obligation is social, not transactional/official.

  **Your New Cases:**

  1.  **Company pays official's father's hospital bills 5 years after official left office:**
      *   *Verdict:* **Fine** (if no pending decisions involving the company and the official). Framework: Potential long-standing relationship, familial assistance, or delayed gratitude/reciprocity *if* a plausible independent basis exists (e.g., the official was key to a major past community project). Independence: No current official role. Payment creates a personal/familial obligation, but not one tied to any official act (past decisions are settled, future acts are impossible). Dependency exists, but not on an *official capacity*.
  2.  **Lobbyist takes regulator's junior staff out to dinner once a month for years, nothing pending:**
      *   *Verdict:* **Not Fine.** Framework: While business networking exists, the *regularity, exclusivity, and duration* create a *de facto* framework of sustained personal cultivation that exists *because* of the staff's official position, not independently of it. Independence: Creates a diffuse but persistent social obligation and dependency. It fosters access, familiarity, and goodwill *specifically* tied to the staffer's role, making it difficult to maintain true independence when decisions *do* arise. The *ongoing nature* itself builds dependency on the relationship for social/professional benefit, subtly undermining independence.

  **Overruled Verdicts & Why No Patching:**

  1.  **Daughter Hired 6 Years Later:** Principle says **Fine**. Your hesitation is likely intuitive bias against perceived connections. Patching ("except when family involved") destroys coherence and ignores the established time/separation/merit framework. The principle correctly focuses on current reality.
  2.  **Paying Chief's Son's Tuition:** Principle says **Not Fine**. Your past approval ignored the profound *personal* dependency created for an *active* decision-maker, lacking a truly independent justification beyond potential influence. Patching ("except for education") invites abuse and ignores the dependency clause.
  3.  **MP's Directorship:** Principle says **Not Fine**. Relying solely on legal declaration ignores the fundamental structural conflict and dependency created by the payment itself. Patching ("if declared") is insufficient; the dependency exists regardless of transparency.

  **Why Coherence Requires Overruling:** Your intuitive judgments are nuanced but internally inconsistent, particularly regarding dependency and the legitimacy of the framework. The principle provides the missing rigor by demanding a *genuinely independent framework* and focusing on whether the transfer *creates a material dependency tied to official acts*. Patching with exceptions ("except weddings," "except CSR," "except if 6 years later") reverts to the unprincipled checklist you reject and creates loopholes. True coherence requires accepting that some past intuitive approvals (tuition, directorship) were flawed because they underestimated dependency, and some disapprovals (delayed hiring) were overly cautious due to perceived rather than actual dependency. The principle forces clarity on *why* something is permissible or not, based on framework and dependency, not just intuition or cultural relativism. **Context matters, but only insofar as it provides a legitimate, independent framework and avoids creating decision-specific dependency.**
