prompt: |-
  I work on the perception stack for a head-mounted display that overlays moving graphics on the real world, and my team has just spent two months arguing about something that turned out not to be an engineering question. To keep a virtual object glued to a real one that is moving, you either extrapolate — render where it probably is right now, and eat the error when the prediction goes wrong — or you hold each frame in a buffer for a hundred milliseconds or so, wait until you can see where the object actually went, and then render the whole trajectory correctly at the price of latency. We chose the buffer. Reading up on why that felt like the more honest option, I ran into color phi: two dots flashed at different places and in different colors are seen as a single dot that moves and changes color somewhere in the middle of its path, where the color it is seen to change into is not yet available to anyone's visual system at the moment it is apparently seen. Dennett and Kinsbourne's labels for the two ways out — Orwellian, where the experience really was of the first color all the way across and the record is altered afterwards, and Stalinesque, where nothing conscious is settled until the second flash arrives and the whole sequence is then staged with the change interpolated into the middle — map exactly onto extrapolate-versus-buffer, and our buffer is a Stalinesque device. When I put that in a draft chapter, my advisor's response was that I cannot cite the brain's solution as a vindication of ours until I can say what would count as an adequate account of the temporal structure of experience in the first place. That is what I want from you.

  So: write the specification rather than the survey. Lay out the requirements any theory of when and how we are conscious of change and succession must meet, with the case or consideration motivating each. I want the phenomena covered to include color phi itself, and with it the control question of what it is like for the subject between the first flash and the second, in the two-dot condition as against a condition in which only the first dot is ever shown, and whether there is any fact of the matter; the cutaneous rabbit, where taps at the wrist and the elbow are felt as hops along the intervening skin, an illusion that collapses once the separation exceeds roughly three tenths of a second, which an account has to explain as the closing of some particular window rather than wave away; the old cortical-stimulation result in which a train of pulses has to run for something like half a second before any sensation is reported at all, yet the sensation is dated by the subject to the first pulse; the family of effects in which a stationary marker flashed in alignment with a moving object appears to sit behind it; and the utterly mundane case of hearing one note give way to the next, which sets the outer bound on whatever interval the theory says experience spans. Then the distinctions it may not collapse: the timing of an experience versus the timing of its content; what it is like at a moment versus what one is disposed to say a moment later; experiencing versus remembering experiencing; a content being determinate versus a subject being able to discriminate it. Say explicitly whether "the subject is simply mistaken about when the change seemed to occur" is a permissible move or a way of evading the phenomenon, since I have seen it used both ways. Add the consistency constraints: no backward causation, neural conduction delays, the fact that different attributes of one and the same event are processed at different speeds, and the fact that people can be reliably wrong about their own experience. Add the requirement to explain why the illusion is undetectable from the inside by the person having it. And add the requirement I care about most, which is to say what, if anything, would make the difference between the Orwellian and the Stalinesque account observable rather than a redescription of the same process in two vocabularies. For each requirement, mark whether you take it to be genuinely non-negotiable or a preference smuggled in by one camp — I suspect several of those I have listed are the latter — and tell me which single requirement, if pressed hard, eliminates the largest number of otherwise attractive views. Above all: if some subset of these requirements cannot be satisfied jointly, identify that subset and explain why. That would be a result I could actually use, because it would mean the extrapolate-versus-buffer choice is not settled by getting the theory right.

  One further thing, because it is the case I care about and I have not seen it described anywhere, though I may simply not have looked in the right places. A colleague and I sketched a self-triggered color phi. The subject chooses the color and the position of the second dot before the trial begins, by which finger rests on which key, and then releases the key to start the trial; the first dot appears immediately and the second appears after a fixed short interval, so that throughout the interval the subject already knows everything the second dot is going to tell them. On one trial in five the apparatus betrays the choice and shows the other color. If the mid-flight change is generated only when the discriminating information arrives, foreknowledge should make no difference, and the betrayal trials should be indistinguishable from ordinary ones until the second dot actually lands. If the change is interpolated whenever the relevant content is available, foreknowledge should let the change be experienced during the interval, and the subject should be able to time a response to it, while the betrayal trials should yield something like a change followed by a correction of the change. Tell me whether your list of requirements licenses a prediction here, which of the two hypotheses the design really separates, whether any measure of the effect is admissible given that reaction times carry motor latencies of their own, and whether a theory on which the visual system is a continuous estimator — one that keeps publishing a best guess about the trajectory and revises it as late evidence arrives, the way a tracking filter does — counts as a genuine third option or collapses into one of the two. When you come to the existing contenders, keep it brief: a paragraph at the end on how the retroactive view, the buffered view, the view that there is no single determinate stream to be timed at all, and the estimator view fare against your list. Please write the whole thing as continuous prose, the way one would write a letter or a long email: no headings, no bullet points, no bold, no tables, and if you want to enumerate the requirements, do it in running sentences. And no citations, no bibliography, no reading list — I cannot check them, and I would much rather have your reasoning than guesses about where it came from.
reasoning: |-
  We are to write a specification for a theory of the temporal structure of conscious experience. The goal is to lay out the requirements that any such theory must meet, motivated by specific phenomena and constraints. The phenomena to cover include color phi, the cutaneous rabbit, cortical stimulation, moving object and marker effects, and the mundane case of sequential notes. We must also address key distinctions, consistency constraints, and the requirement to explain the undetectability of illusions from the inside. Crucially, we need to specify what would make the difference between Orwellian and Stalinesque accounts observable, and we must evaluate which requirements are non-negotiable and which might be partisan. Finally, we are to consider a self-triggered color phi experiment and how the requirements bear on it.

  Let us begin by listing the phenomena and the requirements they motivate:

  1. **Color phi phenomenon**: Two dots flashed at different locations and in different colors are perceived as a single dot moving and changing color midway. This raises the question of what the experience is like between the two flashes, especially in comparison to a condition where only the first dot is shown. The requirement: the theory must account for the apparent timing of the color change and the motion, and it must address whether there is a fact of the matter about the experience during the interval.

  2. **Cutaneous rabbit**: Taps at the wrist and elbow are felt as if they are hopping along the arm. The illusion breaks down when the interval between taps exceeds about 300 ms. Requirement: the theory must explain why the window is about 300 ms and not just dismiss it as an arbitrary limit.

  3. **Cortical stimulation**: A train of electrical pulses must last about 500 ms before any sensation is reported, but the sensation is dated to the first pulse. Requirement: the theory must explain how the content of experience (the timing) can be antedated relative to the neural processes that support it.

  4. **Moving object and stationary marker**: A stationary marker flashed in alignment with a moving object appears to lag behind. Requirement: the theory must account for how the perceived position of the marker is influenced by the motion of the object.

  5. **Mundane succession**: Hearing one note give way to the next. Requirement: this sets an outer bound on the temporal interval that experience spans (i.e., the minimal time between two events that are perceived as distinct).

  Key distinctions:

  - Timing of an experience vs. timing of its content.
  - What it is like at a moment vs. what one is disposed to report later.
  - Experiencing vs. remembering experiencing.
  - Content being determinate vs. subject being able to discriminate it.

  Additionally, we must address the permissibility of claiming that the subject is simply mistaken about when the change seemed to occur. Is this a valid explanation or an evasion?

  Consistency constraints:

  - No backward causation.
  - Neural conduction delays (it takes time for signals to travel and be processed).
  - Different attributes of the same event are processed at different speeds.
  - People can be reliably wrong about their own experiences.

  Special requirement: Explain why the illusion is undetectable from the inside.

  Critical requirement: What would make the difference between Orwellian (retroactive alteration) and Stalinesque (buffered staging) observable?

  Now, for the self-triggered color phi:

  - Subject chooses the color and position of the second dot in advance (by finger on key) and starts the trial by releasing the key. The first dot appears immediately, the second after a fixed interval. On 20% of trials, the second dot is the other color (betrayal).
  - Predictions:
    - If the change is generated only when the second dot arrives (Stalinesque), foreknowledge should not change the experience during the interval, and betrayal trials should be surprising only at the end.
    - If the change is interpolated as soon as the content is available (which, with foreknowledge, is during the interval), then the subject might experience the change during the interval and be able to time a response to it. In betrayal trials, there might be an initial change experience followed by a correction.
  - We must consider whether reaction times (with motor latencies) are admissible as a measure and whether a continuous estimator view (like a tracking filter) is a distinct third option.

  Finally, we are to briefly evaluate existing views: retroactive (Orwellian), buffered (Stalinesque), no determinate stream, and estimator.

  Now, we must write in continuous prose, without headings, bullet points, etc. We must also mark for each requirement whether it is non-negotiable or a partisan preference, and identify which requirement, if pressed, eliminates the most views. And if there's an unsatisfiable subset, we must identify it.

  Let's structure the response as follows:

  - Start with the phenomena and their requirements.
  - Then the distinctions.
  - Then the constraints.
  - Then the self-triggered experiment.
  - Then the evaluation of views.

  But since it must be continuous prose, we'll weave it together.

  We begin.
answer: |-
  Your request cuts to the heart of a foundational problem in consciousness studies: how to specify the temporal structure of experience without smuggling in assumptions that predetermine the answer to the extrapolate-versus-buffer debate. I'll lay out a set of requirements for any adequate theory, motivated by the phenomena you describe, while flagging where these demands might be contentious. The goal is to force clarity on what a theory must explain, and to identify which constraints are truly unavoidable versus those that might reflect a partisan stance. I'll start with the phenomena-based requirements, then move to distinctions, consistency constraints, and the undetectability of illusions, before addressing your self-triggered experiment and the Orwellian-Stalinesque divide. Throughout, I'll note negotiability and where requirements conflict.

  First, the phenomena. Any theory must account for the **color phi effect**, where two flashes (say, red at A, green at B) are seen as a single object moving and changing color mid-trajectory. Crucially, the color change is perceived at a point where the green flash hasn't yet occurred, raising the question: what is the experience like between the flashes? The theory must explain whether there's a fact of the matter about this interval compared to a control (e.g., only the first flash appears). For instance, in the two-flash case, is the subject genuinely experiencing motion during the gap, or is it an after-the-fact reconstruction? This requirement is non-negotiable; it's the core datum. But the demand that the theory must assert a specific "fact of the matter" about the interval experience may be partisan—some views (e.g., Dennett's) reject such determinate moments.

  The **cutaneous rabbit illusion**—taps at wrist and elbow felt as hops along the arm—adds a temporal constraint: the illusion collapses when inter-tap intervals exceed ~300ms. A theory must explain this window not as arbitrary but as tied to a specific neural or computational mechanism (e.g., the maximum duration for spatiotemporal integration in somatosensory pathways). This is non-negotiable; waving away the 300ms limit ignores empirical precision. Similarly, for the **cortical stimulation result** (a ~500ms pulse train needed for sensation, yet reported as starting at the first pulse), the theory must reconcile the delayed reportability with the antedating of the experience. This forces a distinction between the timing of neural processes and the timing attributed to the content of experience—a non-negotiable requirement, as it highlights that neural delays don't always map to perceived timing.

  The **moving object with stationary marker** (e.g., a flash aligned with a moving ball appears to lag behind it) requires explaining how motion processing retrospectively influences position perception. This is non-negotiable because it shows that the brain resolves ambiguities by integrating information over time, affecting perceived simultaneity. Finally, the **mundane succession of notes** sets an outer bound: the theory must define the minimal interval at which two events (like musical notes) are perceived as distinct rather than fused. This interval—likely under 100ms for audition—constrains the "specious present" and is non-negotiable; without it, the theory has no anchor in everyday temporality.

  Now, distinctions the theory must respect. First, **timing of an experience vs. timing of its content**: in cortical stimulation, the experience's content (sensation at time T) is antedated, but the experience itself may arise later. Collapsing these invites circularity. Second, **what it's like at a moment vs. disposition to report later**: color phi subjects report a mid-trajectory change, but is this what they experienced then or a memory-based narrative? The theory must not conflate them. Third, **experiencing vs. remembering experiencing**: a lapse in attention during the rabbit illusion might mean no "hops" were experienced, only inferred afterward. Fourth, **determinate content vs. discriminability**: a subject might have a determinate experience of motion during color phi but be unable to discriminate its exact path. These distinctions are non-negotiable; blurring them risks misdescribing phenomena.

  Consistency constraints are paramount. **No backward causation** is non-negotiable; physics rules out neural signals affecting past states. **Neural conduction delays** (e.g., visual processing takes ~100ms) mean experience always lags stimuli—the theory must reflect this. **Differential processing speeds** for attributes (e.g., motion vs. color in vision) require that the theory explain how they're unified into a coherent event despite asynchrony. **Reliable errors in self-report** (e.g., subjects misdating experiences in cortical stimulation) mean introspection isn't infallible; this is non-negotiable, as it blocks naive realism about timing. Together, these constraints force the theory to handle asynchrony without magic.

  A key requirement is explaining **why illusions like color phi are undetectable from the inside**. Subjects don't feel fooled; the motion seems immediate. The theory must account for this without resorting to homunculi or infinite regress (e.g., not by positing a "meta-experience" that verifies the illusion). This is non-negotiable—it's what makes these phenomena illusions rather than mere errors.

  Now, the crux: your demand for a criterion to **observably distinguish Orwellian (retroactive alteration) from Stalinesque (buffered staging) accounts**. This is where many theories falter. If the difference is merely in when processing occurs (pre- or post-experience), with identical outputs, it risks being a redescription. To make it observable, the theory must specify a measurable signature—e.g., neural markers of "commitment" to an experience versus revision, or behavioral evidence of mid-interval shifts in foreknowledge conditions (as in your experiment). I'll return to this, but note: this requirement might be partisan, as some views (e.g., Dennett's) deny a fixed "moment of commitment" exists. Yet, pressed hard, this requirement eliminates the most views because it exposes vagueness in how theories map to data. If a theory can't predict when subjects will detect revisions (e.g., in betrayal trials), it's unfalsifiable.

  Before addressing your experiment, let's tackle the permissibility of **"the subject is mistaken"** as an explanation. This is acceptable only if the theory specifies what counts as a mistake and why it arises. For example, in cortical stimulation, antedating is a "mistake" because neural delays mean the sensation couldn't have been conscious at T=0, but the brain assigns it to T=0 for coherence. It's evasion if used to dismiss the datum (e.g., saying color phi subjects are "just wrong" without explaining how the illusion works). This constraint is non-negotiable—it forces mechanistic rigor.

  Now, your **self-triggered color phi**. Subjects pre-choose the second dot's color/position and start the trial; on betrayal trials (20%), the second dot mismatches. The requirements license a prediction: if the theory treats experience as a continuous estimator (e.g., a Bayesian filter updating predictions), foreknowledge should allow the change to be experienced during the interval, with subjects able to time a response (e.g., button press at the perceived color flip). Betrayal trials should then cause a brief "correct" experience followed by a correction. If experience is Stalinesque (buffered), foreknowledge changes nothing; the change only renders after the second flash, so betrayal is detected at flash two, with no mid-interval response. The design separates these two hypotheses: it tests whether foreknowledge enables earlier temporal access to the interpolated content. Reaction times (RTs) are admissible despite motor delays if you use relative measures—e.g., compare RTs for mid-change responses in foreknowledge trials versus RTs to the second flash in no-foreknowledge trials. But motor noise must be controlled (e.g., via baseline RT tasks). The estimator view, where the system constantly updates a "best guess," collapses into Stalinesque if the buffer is dynamic (outputting only when certainty thresholds are met), but it becomes distinct if it allows partial, progressive experiences (e.g., faint motion during the interval). This distinction hinges on whether experience is graded or all-or-nothing—a requirement your list doesn't specify but should: **does the theory allow for indeterminate or probabilistic experiences?** If not, it may be smuggled Stalinesque.

  When pressed, the requirement that **eliminates the most views** is the combination of "no backward causation" and "antedating in cortical stimulation." Views that posit a strict "now" (e.g., some presentist theories) struggle because they can't antedate without violating causality. Similarly, naive buffer models can't explain why the sensation is dated to the first pulse. This pair is deadly for inflexible models.

  Now, the **unsatisfiable subset**: the demands for **determinate content during intervals** (from color phi's gap), **no backward causation**, and **explaining undetectable illusions** cannot all be met jointly if "determinate" means a fixed, veridical snapshot. Why? Determinacy implies a fact about what was experienced during the gap, but undetectable illusions mean we can't introspectively access that fact, and no backward causation blocks retroactive setting. This tension suggests that for intervals under ~300ms, content isn't fully determinate until integration occurs—which pushes toward Stalinesque or estimator views. Thus, your engineering choice isn't settled by theory alone; both buffer and extrapolate could be neurally viable, differing only in their error profiles.

  Finally, a paragraph on existing contenders, per your brevity request. The **retroactive (Orwellian) view**—where experiences are fixed but later edited—fails differential processing and antedating; if editing occurs post-experience, why can't subjects detect it? The **buffered (Stalinesque) view** handles integration windows (e.g., rabbit's 300ms) and undetectable illusions well but struggles with foreknowledge in your experiment—why can't the buffer incorporate advance info earlier? The **no determinate stream view** (e.g., Dennett) avoids antedating by denying fixed timing but flounders on cortical stimulation; subjects do report a clear onset time. The **estimator view** (continuous Bayesian updating) excels at differential processing and foreknowledge predictions but must specify when an update becomes "conscious" to avoid collapsing into buffering—e.g., if it outputs probabilistically, it might explain betrayal trials as prediction errors without full revisions. None cleanly satisfy all, but the estimator handles the most non-negotiables.

  In sum, the requirements expose that no theory aces every test, and your buffer choice isn't vindicated by neuroscience alone—it's a pragmatic engineering stance. The self-triggered experiment, however, could tilt the balance: if foreknowledge shifts the perceived timing of change, it favors estimator or Orwellian; if not, Stalinesque holds. Either way, the illusion remains undetectable, so the user won't know the difference. That, perhaps, is the point.  

  ---  
  *Key to negotiability in requirements:*  
  - Non-negotiable: Phenomena explanation (color phi, rabbit, cortical, etc.), no backward causation, neural delays, differential processing, reliable errors, undetectability, distinctions (timing/content, etc.), "mistaken" only with mechanism.  
  - Potentially partisan: Determinacy during intervals, observable Orwell/Stalin difference, outer bound strictness, antedating as a "mistake."  
  - Pressed hardest: Antedating + no backward causation (kills rigid presentism).  
  - Unsatisfiable subset: Determinacy during intervals + no backward causation + undetectable illusions (resolved by dropping determinacy or embracing graded content).
