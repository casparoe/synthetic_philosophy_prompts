  First, I need to verify the historical claims. For Troy, the VIIa destruction date (1180 BCE) and Hittite identifications (Wilusa=Ilios, Alaksandu=Alexandros) seem solid based on current scholarship. The Korfmann controversy is accurately framed as about scale. Arthur's section holds up - Gildas/Bede silence and Historia Brittonum's late mention are correctly noted, and the name etymology caution is valid. Exodus details are mostly precise: Merneptah stele dating, Egyptian names (Moses), and southern deity evidence are well-handled, though I should note the "store cities" identification isn't universally accepted. 

