answer: |-
  Below is a decision tree designed to classify pieces of communicated content (e.g., implications, enrichments, presuppositions) in American English utterances, based on diagnostics from the semantics/pragmatics interface literature. The tree prioritizes operational tests over theoretical commitments, but I've incorporated pushback on your leanings (e.g., treating most conversational implicatures as distinct from "what is said" due to cancellability and calculability). Diagnostics are phrased as yes/no questions answerable without knowing the outcome. I've committed to resolving diagnostic conflicts (see "Conflict Resolution" below) and noted where the tree cannot perfectly separate categories.

  The tree has **8 leaves**:
  1. **Semantic content** (literal, truth-conditional meaning; compositionally determined).
  2. **Enrichment** (pragmatic content necessary for the sentence to express a complete proposition).
  3. **Generalized conversational implicature (GCI)** (cancellable, calculable, context-independent implication from default inferences).
  4. **Particularized conversational implicature (PCI)** (cancellable, calculable, context-dependent implication).
  5. **Conventional implicature (CI)** (non-cancellable, non-truth-conditional content tied to a lexical item).
  6. **Presupposition** (non-cancellable backgrounded content that must hold for the utterance to be felicitous).
  7. **Indirect speech act (ISA) force** (cancellable, calculable content about the speaker's intended illocutionary act, e.g., a request).
  8. **Semantic content via saturation** (content from assigning values to context-sensitive elements; treated as part of semantic content).

  **Key Diagnostics Used** (branch nodes):
  - **Necessity for propositional completeness**: Is the content required for the sentence to express a complete, truth-evaluable proposition?
  - **Cancellability**: Can the content be explicitly denied without contradiction? (Includes contextual cancellability: Does it disappear in contexts that block the inference?)
  - **Calculability**: Can the content be derived from Gricean maxims (quantity, quality, relation, manner) + context?
  - **Illocutionary force**: Is the content about the speaker's intended speech act (e.g., request, suggestion)?
  - **Context-independence**: Does the content arise by default, without special contextual assumptions?
  - **Embedding survival**: Does the content persist when the sentence is embedded under negation, a conditional, or an attitude verb?
  - **Truth-conditional impact**: If the content is false, does it affect the truth value of the entire utterance (vs. merely causing infelicitousness)?

  **Conflict Resolution**:  
  When diagnostics conflict, **cancellability** is prioritized as the most reliable test because it directly targets speaker commitment (Grice's core insight). For instance, if content seems calculable but isn't cancellable, it likely isn't conversational. If necessity and cancellability conflict (e.g., enrichment cases), **necessity** is trusted, as it ensures propositional coherence.

  **Unresolvable Pairs & Limitations**:
  - **CI vs. Presupposition**: Both are non-cancellable and survive embedding. Truth-conditional impact is used to split them, but this can be murky for some triggers (e.g., "even" vs. "but"). Lexical knowledge is sometimes needed.
  - **GCI vs. PCI**: Context-independence is a continuum (e.g., scalars can be context-dependent). The tree uses a binary split, but some cases blur.
  - **Enrichment vs. Semantic saturation**: Both supply missing content. Saturation (e.g., resolving indexicals) is treated as semantic; enrichment (e.g., "ready" for a task) as pragmatic. Some theorists (e.g., Recanati) collapse these, but the tree separates them to respect the semantics/pragmatics boundary.
  - **"What is said" debates**: I cut your proposed leaf ("implicature argued to be part of what is said") because GCIs/PCIs are consistently cancellable and thus not part of semantic content. Enrichment handles cases like "John is ready," where pragmatic work is needed for propositional completeness.

  ---

  ### **Decision Tree**
  Each branch is a diagnostic question. Answer based on the specific piece of content in the utterance.

  1. **Is the content necessary for the sentence to express a complete proposition (truth-condition)?**  
     - **Yes** → Go to 2.  
     - **No** → Go to 3.  

  2. **Is the content derived from context-sensitive elements (e.g., pronouns, tense)?**  
     - **Yes** → **Semantic content via saturation** (e.g., "he" referring to John).  
     - **No** → **Enrichment** (e.g., "ready" enriched to "ready for the exam").  

  3. **Is the content cancellable?**  
     - **Yes** → Go to 4.  
     - **No** → Go to 7.  

  4. **Is the content calculable via Gricean maxims + context?**  
     - **Yes** → Go to 5.  
     - **No** → **Particularized conversational implicature (PCI)**. *[Rare; typically implies a failed test or non-cooperative context.]*  

  5. **Is the content about illocutionary force (e.g., a request, suggestion)?**  
     - **Yes** → **Indirect speech act (ISA) force**.  
     - **No** → Go to 6.  

  6. **Is the content context-independent (default inference)?**  
     - **Yes** → **Generalized conversational implicature (GCI)**.  
     - **No** → **Particularized conversational implicature (PCI)**.  

  7. **Does the content survive embedding (e.g., under negation, conditionals, or attitude verbs)?**  
     - **Yes** → Go to 8.  
     - **No** → **Semantic content** (at-issue, truth-conditional).  

  8. **If the content is false, does it render the entire utterance neither true nor false (infelicitous)?**  
     - **Yes** → **Presupposition**.  
     - **No** → **Conventional implicature (CI)**.  

  ---

  ### **Test Utterances with Paths**
  **1. Scalar: "Some of the students passed"**  
  *Content:* "Not all students passed" (implication).  
  - **1. Necessary?** No → **3. Cancellable?** Yes (e.g., "Some... in fact, all did").  
  - **4. Calculable?** Yes (Quantity: "all" is stronger; speaker avoided it).  
  - **5. Illocutionary force?** No (not a request/act).  
  - **6. Context-independent?** Yes (default for scalars).  
  → **GCI**  
  *Diagnostic clash note:* Some argue scalar implicatures are part of semantic content, but cancellability and calculability confirm GCI.

  **2. "Even" utterance: "Even John passed the exam"**  
  *Content:* "John was unlikely to pass" (presupposed).  
  - **1. Necessary?** No → **3. Cancellable?** No (e.g., #"Even John passed, and he was likely" is contradictory).  
  - **7. Embedding survival?** Yes (e.g., "If even John passed... " still implies John was unlikely).  
  - **8. Truth-conditional impact?** Yes (if false, utterance is infelicitous/undefined).  
  → **Presupposition**  
  *Unresolvable note:* "Even" is a presupposition trigger; CI is ruled out by truth-conditional impact.

  **3. "But" utterance: "She is poor but honest"**  
  *Content:* "Poverty and honesty contrast" (implication).  
  - **1. Necessary?** No → **3. Cancellable?** No (e.g., #"She is poor but honest, with no contrast" is odd).  
  - **7. Embedding survival?** Yes (e.g., "If she is poor but honest..." retains contrast).  
  - **8. Truth-conditional impact?** No (if false, "she is poor and honest" can still be true).  
  → **Conventional implicature (CI)**  
  *Unresolvable note:* Truth-conditional impact splits CI (no impact) from presupposition (impact).

  **4. Cold-room indirect request: "It's cold in here"**  
  *Content:* Request to close the window (implied act).  
  - **1. Necessary?** No → **3. Cancellable?** Yes (e.g., "It's cold... but I'm not asking you to close the window").  
  - **4. Calculable?** Yes (Relation: context implies speaker wants action).  
  - **5. Illocutionary force?** Yes (it's a request).  
  → **Indirect speech act (ISA) force**  
  *Pushback:* This is PCI-like but treated separately due to illocutionary focus.

  **5. Incomplete proposition: "John is ready"**  
  *Content:* "Ready for [contextual task, e.g., the exam]" (enrichment).  
  - **1. Necessary?** Yes (without it, no truth-conditional content).  
  - **2. From context-sensitive elements?** No (no overt indexical).  
  → **Enrichment**  
  *Diagnostic clash note:* Cancellability might suggest PCI (e.g., "John is ready... but not for the exam"), but necessity (for propositionality) overrides and confirms enrichment.

  ---

  ### **Design Notes**
  - **Why this structure?** The tree starts with necessity to isolate proposition-incomplete cases (enrichment/saturation) early, then uses cancellability as the primary split for implicatures vs. semantic/CI/presupposition. This respects Gricean boundaries while accommodating your emphasis on pragmatic work for completeness.
  - **Pushback on "implicature as part of said"**: While contextualists (e.g., Recanati) argue GCIs can be "said," cancellability and embedding tests show they behave differently from semantic content (e.g., "Some passed, and possibly all" isn't contradictory; "Bill believes some passed" doesn't imply he believes "not all"). Enrichment handles necessary pragmatic contributions without overloading "said."
  - **American English focus**: Diagnostics assume standard dialects (e.g., cancellability tests use natural denials like "in fact" or "but").
  - **Omissions**: I cut "nondetachability" and "reinforceability" as unreliable (nondetachability fails for GCIs tied to scalars; reinforceability is subjective). Calculability and embedding are more robust.
