  The subject would experience excruciating pain but with no urge to avoid it or make it stop. They'd describe it as agonizing yet remain completely indifferent. I'll need to carefully construct this to prevent the friend's counterarguments - ensuring no competing motivations, no hidden aversion through physical responses, and no second-order desires.

  After presenting the case, I'll analyze how both theories would interpret it. On the intrinsic view, it would still be bad because of the awful sensation; on the aversion view, it wouldn't be bad since there's no motivational component. The key feature is the lesion that blocks aversion while the drug amplifies sensation. If we remove the lesion, the aversion would return, making both views agree it's bad. If we remove the drug, the pain might not be intense enough to be considered bad intrinsically.

