prompt: |-
  Not a philosopher — I do behavioural ecology, frogs mostly — but I read philosophy of mind on the side and there's a move I keep seeing that I can't find a name for.

  Setup, roughly as I understand it. Suppose you think what a signal means is fixed by how it got there: what it was selected for, what the mechanism was recruited to detect, what reinforced it. Now take a case where the environment has moved on, the original trigger is rare or gone, and something else reliably sets the signal off, with the receivers responding to that other thing. You get a fork: does the signal still carry the old content, or the new one? I know that fork is a real and well-known dispute. That's not what I'm asking about.

  What I keep noticing is what happens *before* people get to the fork. They seem to settle the verdict they want first and then pick which history is the content-fixing one accordingly — and the picking never looks arbitrary, because both histories are genuinely there and both stories are tellable. Two instances:

  - Someone who wants to insist the frog's tongue-flick is really about flies, and not about any small dark thing that moves, will lean hard on the fact that selection is still running, that the ongoing economy of reinforcement is what matters.
  - Someone arguing that a state in a machine that got wired up by accident, with no design history behind it, nevertheless genuinely means something, will insist that what matters is the role the state has been playing and being relied on inside the system since it got there.

  Same structural choice, opposite verdicts, and in each case the history that gets priviledged is the one that yields the conclusion the author wanted on some further question (does content need a designer, can meaning be natural at all). Nobody flags it, beacuse each individual choice is defensible on its own and there's no independent handle on which history is the right one to consult.

  So: is there an established concept for this — selecting among candidate content-fixing histories after you already know which answer you want? I know it sits near the disjunction problem and near the Swampman-type cases, and that the theories in this area get called etiological or proper-function theories, but those are names for the underlying puzzle, not for the argumentative practice around it. And if there's no name, can you coin one and define it tightly enough that I could tell it apart from (a) ordinary special pleading, and (b) the perfectly legitimate business of using intuitions about what a signal means as evidence for a theory of content? The (b) boundary is the part I actually care about — how do you tell when the intuition is doing the evidential work honestly and when the history-selection has been quietly reverse-engineered from it?

  Bottom line first, please: one line saying either "yes, it goes by X" or "no, nothing established." Then the rest in 400 words max.
reasoning: |-
  Okay, the user is a behavioral ecologist studying frogs who's noticed a pattern in philosophy of mind literature. They describe how theorists seem to reverse-engineer their selection of content-fixing histories based on predetermined conclusions. Their core question is whether this maneuver has an established name, and if not, how to coin a precise term differentiating it from legitimate methodological practices.

  Hmm, the user is clearly deeply familiar with both biological signaling systems and philosophical debates about content. Their frustration suggests they've spotted what feels like intellectual dishonesty camouflaged as theoretical flexibility. The examples about frog tongue-flicks and accidentally wired machine states perfectly illustrate how the same structural choice of privileging different histories leads to opposite conclusions. 

  I recall this connects to Millikan's teleosemantics and Dretske's indicator semantics, where the "disjunction problem" explicitly addresses mismatches between historical causes and current triggers. But the user's right - the argumentative *tactic* of history-swapping to predetermine outcomes isn't itself named. 

  For coining a term, "teleological gerrymandering" feels apt: "teleological" references purpose-based accounts of meaning, while "gerrymandering" captures the strategic redrawing of historical boundaries. The key differentiation from legitimate intuition-use (point b) is whether the history-selection comes *before* or *after* testing against empirical constraints. Legitimate theories use intuitions as data points; gerrymandering cherry-picks histories to protect predetermined conclusions.

  The user's unspoken need seems to be methodological - they want tools to critically evaluate philosophy papers without getting derailed by circular reasoning disguised as theory-building. Naming the practice empowers that critique. I should emphasize the diagnostic question: "Would this history still be chosen if it produced the *opposite* conclusion?" That's the litmus test for gerrymandering.
answer: |-
  **Bottom line:** No, nothing established. 

  **Analysis (397 words):**

  You've identified an argumentative pattern in content fixation debates where theorists seem to **reverse-engineer the selection of the relevant "history"** (evolutionary, reinforcement, design, current role) to secure a desired content attribution. This maneuver lacks a standard name.

  **Coined Term:** **Teleological Gerrymandering**

  **Definition:** The practice of selectively privileging one causal history (e.g., distant selection, recent reinforcement, current systemic role) over other equally real, causally relevant histories in a teleosemantic or etiological theory of content/mind, where the selection appears primarily motivated by the need to secure a predetermined verdict about the content (e.g., "it means X, not Y") or to align with broader philosophical commitments (e.g., naturalism, anti-reductionism), rather than being independently justified by the theory's core principles or empirical constraints.

  **Distinguishing Features:**

  1.  **Reverse Engineering:** The verdict dictates the history choice, not vice-versa. The privileged history is the one that *yields* the desired answer.
  2.  **Availability of Alternatives:** Multiple plausible causal histories (distant origin, recent maintenance, current trigger, systemic role) genuinely exist for the state/signal. Gerrymandering exploits this underdetermination.
  3.  **Motivated by Broader Commitments:** The choice is driven by resolving tensions with other philosophical theses (can content be natural? Swampman? misrepresentation?) more than by internal consistency of the content theory itself or biological/psychological detail.
  4.  **Lack of Independent Constraint:** The theory lacks clear, prior principles for *objectively* ranking the relevance of different histories in cases of conflict or environmental change.

  **Differentiation:**

  *   **vs. Ordinary Special Pleading:** Special pleading usually involves *exceptional* ad hoc excuses. Teleological gerrymandering exploits a *structural ambiguity inherent* to etiological theories – the theory itself doesn't resolve which history "counts" most. It's using the theory's flexibility strategically.
  *   **vs. Legitimate Intuition Use (Point b):** Legitimately, intuitions about content ("surely it means flies!") serve as *data* the theory must explain. The theorist then develops *principled* criteria for history selection that systematically capture those intuitions *and* handle novel cases. Gerrymandering occurs when intuitions (or commitments) *override* principled criteria *within a single case*, leading to inconsistent history selection across cases to preserve the pre-set intuition/commitment. **Diagnostic Question:** "Would this specific historical criterion *still be applied* if it produced the *opposite* content verdict the author desires?" If not, gerrymandering is likely.
