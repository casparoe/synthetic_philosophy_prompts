answer: |-
  Here's a conceptual dissection of the pattern you've observed, structured to answer your four questions directly. Confidence levels are noted throughout, with the least certain point flagged at the end.

  ### 1. **Name and Associated Worry**
     - **Established Name:** The defensive move itself lacks a single universally accepted name, but the *dialectical pattern* is often called **"re-description of outcomes/states"** or **"contextual individuation."** The *worry* about vacuity is closely tied to the **"Problem of State/Prize Individuation"** in decision theory.
     - **What the Name Attaches To:**  
       - The *move* is typically discussed as a strategy within "immunization tactics" or "model adjustment."  
       - The *worry* is named for the *framework's vulnerability*: **"Descriptive Elasticity"** or **"Outcome Relativism."**  
     - **Confidence:** High (90%) on the pattern's recognition; moderate (70%) on "Descriptive Elasticity" as a label for the vacuity worry.

  ### 2. **Nearest Concepts and Distinctions**
     The pattern is distinct from common immunizing strategies. Here’s the carving:

     - **Vs. Ad Hoc Hypotheses (Popper):**  
       - *Ad hoc* adds new theoretical elements (e.g., "risk-aversion parameter") to save the theory.  
       - **Your pattern** changes *only the description of the data* while the theory’s axioms (e.g., ordering, independence) remain untouched.  
       - *Distinction:* No auxiliary hypothesis is introduced; the "fix" is purely semantic.  

     - **Vs. No True Scotsman:**  
       - NTS redefines a *category* (e.g., "no *true* Scotsman would do X") to exclude counterexamples.  
       **Your pattern** redefines *individual outcomes/states*, not the category of "rational agent" or "preference."  
       - *Distinction:* The theory’s *domain* (e.g., "all choices under risk") isn’t restricted; outcomes are redescribed to fit existing rules.  

     - **Vs. Theoretical Underdetermination (Quine-Duhem):**  
       - QD holds that any theory can be saved by adjusting *background assumptions*.  
       **Your pattern** adjusts the *empirical interpretation* of the theory’s *primitives* (outcomes/states), not auxiliary assumptions.  
       - *Distinction:* The "data" isn’t preserved via auxiliary claims (e.g., experimental error) but by re-mapping it to theory-friendly concepts.  

     - **Vs. Contextualism (in epistemology/ethics):**  
       - Contextualism holds that standards (e.g., for knowledge) shift with context.  
       **Your pattern** insists that *all contexts* require maximally fine outcomes/states to apply the theory.  
       - *Distinction:* It’s a *prescriptive* move to *eliminate* context-dependence by absorbing it into outcome specifications.  

     **Confidence:** High (85%) on distinctions; moderate (65%) on contextualism contrast.

  ### 3. **Principled Criteria and Their Limits**
     Possible criteria for "legitimate" refinement, and their pitfalls:

     - **Criterion 1: Predictive Novelty**  
       - *Legitimacy:* Finer descriptions must generate *new, testable predictions* beyond the original case.  
       - *Effect:* If satisfied, the theory regains content (e.g., predicting *when* an agent will redescribe outcomes).  
       - *Problem:* Rarely met. Redescriptions are typically post hoc, making novel predictions elusive. The dialectic usually relocates the difficulty to *other* preferences.  

     - **Criterion 2: Psychological Realism**  
       - *Legitimacy:* Outcomes must correspond to *causally relevant mental states* (e.g., anxiety in risk cases).  
       - *Effect:* Restores content if tied to cognitive science, but risks psychologizing away norms of rationality.  
       - *Problem:* Opens the theory to empirical disconfirmation (e.g., if no anxiety is detected), but orthodoxy often avoids this by treating redescriptions as rational reconstructions.  

     - **Criterion 3: Invariance Under "Irrelevant" Enrichment**  
       - *Legitimacy:* Refinement is illegitimate if it adds details *orthogonally relevant* to the agent’s concerns (e.g., the color of the money).  
       - *Effect:* Only relocates the difficulty—now we debate what counts as "orthogonal" or "relevant," often circularly.  

     **Verdict:** No criterion fully restores content because **the theory’s formalism is invariant under outcome transformation**. Any "principled" standard either (a) is external to the theory (e.g., psychological), making it non-normative, or (b) invites infinite regress (e.g., "relevance" requires its own theory).  
     **Confidence:** High (80%) on the failure to restore content.

  ### 4. **Coining a Concept for the Meta-Pattern**
     Where established terms fall short, define:  
     - **Outcome Elasticity (OE):**  
       *The dialectical property of a decision theory whereby any preference pattern can be reconciled with its axioms by redescribing outcomes or states, leveraging the open-endedness of their individuation.*  

     - **Scope:**  
       - *Inside OE:* Cases where the *same formal theory* accommodates data via re-individuation alone (e.g., your three instances).  
       - *Outside OE:*  
         1. Theories that *restrict* outcome granularity (e.g., "small worlds" à la Savage—your recollection is correct; see below).  
         2. Cases where redescriptions *contradict* the theory’s other commitments (e.g., if finer states violate separability axioms).  
         3. Empirical adjustments (e.g., prospect theory adding probability weighting).  

     - **Why "Elasticity"?**  
       Captures the *stretchability* of outcome descriptions to fit theory, and the *snap-back* to default formalism when pressure (counterexamples) eases.  

     **Confidence:** Moderate (75%) on utility of the term; high (85%) on boundary examples.

  ---

  ### Savage’s "Small Worlds" and OE
  Your recollection is correct: **Leonard Savage** (1954) restricted expected utility (EU) to "small worlds" where states/outcomes are *defined* to make the problem tractable. He explicitly warned against applying EU to "grand worlds" with unbounded descriptions (*Foundations of Statistics*, 4.6, 5.5).  
  - **Relevance to OE:** Savage’s restriction *avoids* Outcome Elasticity by limiting scope. Orthodox replies today often ignore this, applying EU *as if* all worlds are small by fiat (via re-individuation).  
  - **Confidence:** High (90%) on Savage’s position; moderate (60%) on its dialectical misuse today.

  ### Least Confident Point
  **The claim that Outcome Elasticity is distinct from Quine-Duhem underdetermination.** While the *mechanism* differs (re-individuation vs. auxiliary hypotheses), one could argue OE is a *species* of underdetermination tailored to decision theory. Confidence here is low (50%)—it hinges on whether "outcomes" are part of the theory or its empirical interpretation.
