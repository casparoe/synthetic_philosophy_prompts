prompt: |-
  I'm a software engineer, no philosophy background, so bear with me. I've been going down a rabbit hole on whether two people or groups with genuinely different values can get something like gains from trade out of moral compromise, or whether that's just a nice-sounding phrase. Before I read any actual arguments I want the spec.

  Act as a philosopher who works on bargaining and moral compromise, and brainstorm a bit out loud before you commit. Write the desiderata: what an adequate account of morally legitimate compromise has to deliver — the cases it has to get right, the distinctions it can't collapse, the stuff it has to stay consistent with. Give the motivating case for each one, and mark each as either non-negotiable or just something one particular camp insists on. A table is fine for that part.

  One case that's been bugging me, tell me if it belongs on the list: my team wants to ship a feature now, the safety team wants a six month review, and we settle on shipping to 10% of users. That option isn't a point on the line between our two positions — it's a third thing, and it's worse than ship-everything by my lights and worse than the full review by theirs, and yet we both prefer it to no deal. Any account that can't explain how that's jointly rational seems broken to me, but I don't know if thats a real requirement or just an intuition I picked up from reading too many negotiation books.

  Also cover, if they're not already in your list: what's actually being traded when the two sides don't share a common scale of value; how you tell compromise apart from caving to whoever has more power; deals where the compromise is worse for both sides than no agreement at all; and the cases where you compromise over how many people it's permissible to harm, which feels different to me from compromising over where to build a bridge.

  Then the part I care about most: which single requirement knocks out the most candidate theories, and is any subset of them jointly unsatisfiable? If the list turns out to be an impossibility result, say so plainly. Close with a short paragraph on how the two or three most obvious kinds of account — a pure bargaining one, a split-the-difference one, one built on integrity or agent-relative constraints — do against the list. Keep that brief, the criteria are the deliverable.

  Be committed where you have a view, but flag where you're least sure: what consideration would change your mind about the ranking, which requirement you'd drop if one of your assumptions is wrong, and where your list is most likely just your own priors about what compromise is supposed to look like rather than a real constraint.

  Last line should start with "Verdict:" and name in a few words the single requirement that excludes the most.
reasoning: |-
  Okay, I need to address this user's query. They're a software engineer diving into the philosophy of moral compromise, so I should keep my response structured and clear without assuming prior knowledge. The user wants desiderata—criteria for a theory of morally legitimate compromise—in a table format, with each item marked as non-negotiable or camp-specific. They also have specific cases to cover, like their team vs. safety team example, and questions about value scales, power dynamics, and harm compromises.

  First, I recall the user's main analogy: shipping a feature now versus a six-month review, settling on a 10% rollout. That's a key case where the compromise isn't just a midpoint but a new option both prefer over stalemate. I need to include that in the desiderata, probably as a non-negotiable because it reflects real-world rationality in negotiations. 

  Next, the user mentioned differences in value scales—how can trade happen without shared values? This ties into bargaining theory and might require something like a Pareto improvement to be non-negotiable. Then there's distinguishing compromise from coercion, which feels essential to avoid collapsing moral distinctions. Cases where no deal is better than compromise must be handled; that could be a non-negotiable too. Compromises involving harm, like sacrificing lives, need special treatment because they feel different from neutral disagreements—I'll mark that as camp-specific since some philosophers might argue otherwise.

  Now, building the table. I'll list desiderata with short names, explanations, motivating cases, and negotiability flags. For the rollout case, I'll call it "Non-Linear Compromise" and argue it's non-negotiable. Value scales might fit under "Mutual Preferability" or "Pareto Improvement." Power dynamics go under "Anti-Coercion," non-negotiable. Harm compromises deserve their own entry as "Harm Asymmetry," camp-specific. I should also add "Integrity Preservation" to address when compromises feel wrong even if beneficial, based on Williams' ideas—that could be camp-specific too.

  After the table, the user wants to know which requirement is the biggest theory-killer. I suspect "Mutual Preferability" could knock out many theories because if a compromise isn't better than no deal for both, it's hard to justify rationally. But "Harm Asymmetry" might eliminate utilitarian approaches. I need to check if any subset is unsatisfiable—probably not, but it's tight. 

  Finally, for the closing analysis: how do major theories fare? Pure bargaining (like Nash) might fail on integrity and harm issues; split-the-difference could ignore non-linear cases; integrity-focused views might struggle with mutual preferability. I'll keep it brief. End with a "Verdict:"—likely "Mutual Preferability" as the top eliminator.

  I'm least sure about "Harm Asymmetry." If empirical data showed people consistently trade off harms like other goods, I might drop it. Also, my ranking assumes compromise should be beneficial, but if the user values conflict avoidance more, that could shift things. Overall, I'll aim to be helpful and grounded, flagging my uncertainties.
answer: |-
  Here's the desiderata table for a theory of morally legitimate compromise, based on philosophical bargaining literature and your cases. I'll flag uncertainties and close with the analysis you requested.

  ### Desiderata for an Account of Morally Legitimate Compromise
  | Short Name                 | Desideratum                                                                 | Motivating Case                                                                                                | Status               | Notes                                                                 |
  |----------------------------|-----------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------|----------------------|-----------------------------------------------------------------------|
  | **Mutual Preferability**   | Compromise must leave both parties better off than "no deal" (Pareto-improvement relative to disagreement point). | Your rollout case: Both prefer 10% rollout to stalemate (no feature ship OR 6-month delay with full review). | **Non-Negotiable**   | Core of "gains from trade." Without this, compromise is pointless. |
  | **Value Pluralism**        | Must explain how trade occurs without a common currency of value (no shared utility function). | Team values velocity/impact; Safety values risk minimization. No common metric.                                | **Non-Negotiable**   | Reality of moral disagreement.                                       |
  | **Non-Linear Compromise**  | Must accommodate compromises that aren't linear intermediates (e.g., split differences, time delays, partial implementations). | Your 10% rollout: A novel option, worse than each ideal but better than stalemate.                              | **Non-Negotiable**   | Your intuition is correct; critical for real-world bargaining.       |
  | **Anti-Coercion**          | Must distinguish compromise from capitulation under power asymmetry or threat. | Union accepts worse terms under threat of plant closure vs. genuinely finding middle ground.                   | **Non-Negotiable**   | Otherwise legitimizes bullying as "compromise."                     |
  | **No-Worse-Than-Stalemate**| Must reject "compromises" that leave BOTH worse off than no agreement.         | Both teams forced into a costly 3-month review yielding no benefits, worse than walking away.                  | **Non-Negotiable**   | Prevents perverse outcomes.                                          |
  | **Harm Asymmetry**         | Must treat compromises involving direct, intentional harm differently than resource/priority tradeoffs. | "Sacrifice 1 person to save 5" vs. "Build bridge in Forest A or B." Deontic constraints likely apply.           | **Camp-Specific**    | (Non-consequentialists insist; utilitarians may reject distinction) |
  | **Integrity Preservation** | Should not require agents to violate core moral commitments or self-betrayal. | Pacifist forced to fund bombs; doctor forced to ration care by lottery against conscience.                      | **Camp-Specific**    | (Williams/Nagel-style integrity objections)                         |
  | **Stability**              | Agreement shouldn't incentivize defection or regret upon reflection.        | Side-deals undermining the compromise, or parties feeling exploited post-agreement.                            | **Non-Negotiable**   | Practical requirement for durable agreements.                       |

  ### Your Cases Covered
  *   **10% Rollout:** Handled under *Non-Linear Compromise* and *Mutual Preferability*.
  *   **Trading without Common Scale:** Handled under *Value Pluralism*.
  *   **Compromise vs. Coercion:** Handled under *Anti-Coercion*.
  *   **Worse-than-No-Deal:** Handled under *No-Worse-Than-Stalemate*.
  *   **Harm Compromises:** Handled under *Harm Asymmetry*.

  ### Theory-Killer Requirement & Impossibility
  *   **Biggest Eliminator:** **Mutual Preferability** combined with **Value Pluralism** and **Harm Asymmetry** eliminates the most theories.
      *   *Why:* Pure utilitarian bargaining (e.g., Nash bargaining solution) assumes cardinal utilities and struggles with **Value Pluralism**. It often collapses **Harm Asymmetry** (rights are just high utilities). Theories emphasizing **Integrity Preservation** (e.g., agent-centered prerogatives) can struggle with **Mutual Preferability** – if my core commitment forbids *any* deal involving X, a mutually preferable compromise on X is impossible. **Non-Linear Compromise** kills naive "split the difference" accounts.
  *   **Joint Unsatisfiability?** Not strictly impossible. However, satisfying **Harm Asymmetry** (especially under deontic constraints) + **Mutual Preferability** + **Value Pluralism** in *all* cases involving fundamental rights violations is deeply challenging. Some compromises might be *structurally* ruled out by agents' deepest commitments (**Integrity Preservation**), making **Mutual Preferability** impossible on principled grounds.

  ### Quick Theory Assessment vs. Criteria
  1.  **Pure Bargaining (Nash/Harsanyi):**
      *   *Pros:* Handles **Mutual Preferability**, **Non-Linear Compromise** (via solution concepts), **Stability**.
      *   *Cons:* Fails **Value Pluralism** (needs cardinal utils), ignores **Harm Asymmetry**/**Integrity Preservation** (treats all values as fungible), risks **Anti-Coercion** failures (power imbalances affect threat points).
  2.  **Split-the-Difference (Geometric Mean/Moderation):**
      *   *Pros:* Intuitive, sometimes satisfies **Mutual Preferability**.
      *   *Cons:* Fails **Non-Linear Compromise** (only considers intermediates), ignores **Value Pluralism**/**Harm Asymmetry**/**Integrity Preservation**, can violate **No-Worse-Than-Stalemate** (if midpoint is terrible).
  3.  **Integrity/Constraint-Based (Williams/Scanlon):**
      *   *Pros:* Captures **Harm Asymmetry**, **Integrity Preservation**, **Anti-Coercion**.
      *   *Cons:* Struggles with **Mutual Preferability** (may forbid deals involving core constraints even if beneficial), hard to model **Value Pluralism** practically, may reject valid **Non-Linear Compromises** that still "touch" the forbidden zone.

  ### Uncertainties & Priors
  *   **Harm Asymmetry:** My strongest camp-specific prior. If compelling arguments show rights violations *can* be bargained like other goods without integrity loss (unlikely), I'd drop this.
  *   **Integrity Preservation:** Might be too restrictive. If shown that rational compromise *requires* sometimes setting aside deeply held principles for greater good (without self-betrayal), I'd downgrade it.
  *   **Ranking:** I prioritize **Mutual Preferability** as foundational. If your goal is "gains from trade," this is essential. If the goal shifts to "preserving relationships despite disagreement," **Stability**/**Integrity** might dominate.
  *   **Bias:** My list assumes compromise is primarily about *instrumental rationality* + *moral constraints*. A more virtue-ethics or communicative-action approach (Habermas) would prioritize different things (e.g., mutual understanding over Pareto gains).

  Verdict: **Mutual Preferability** coupled with **Value Pluralism** excludes the most candidate theories.
