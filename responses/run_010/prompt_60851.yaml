  ### Emotion Theory Identification Game: Full Activity Design

  This activity engages students in identifying emotions in described scenarios while secretly scoring based on one of three emotion theories. The goal is to spark debate about the nature of emotions (bodily feelings, evaluative judgments, or perception-like registrations of value) and reveal how empirical cases alone cannot resolve theoretical disagreements. Below, I outline the complete setup, cases, scoring keys, gameplay flow, debrief, and practical considerations.

  ---

  ### **Activity Setup**
  - **Students**: 24 (divided into 6 groups of 4).
  - **Time**: 75 minutes.
  - **Materials**: 
    - Index cards (for group responses and theory guesses).
    - Whiteboard (for scoring and debrief visuals).
    - Markers.
  - **Secret Theory**: You pre-select one theory (Bodily Feelings/BF, Evaluative Judgments/EJ, or Perception-like Registration/PR) before class. Scoring is based on this theory.
  - **Pre-Game Instructions** (5 minutes):
    - "We'll review short scenarios. In your groups, discuss and write the emotion the subject is feeling on an index card. Sometimes, the subject may not be experiencing an emotion—if so, write 'no emotion'. I'll reveal the 'correct' emotion after each round and award points. The scoring isn't arbitrary; it's based on a consistent hidden rule. After a few rounds, you can guess the rule."
    - Do **not** name the three theories until the debrief.

  ---

  ### **Cases and Scoring Keys**
  Each case includes a scenario and the "correct" emotion under each theory. I include 6 cases: 3 standard (theories agree) and 3 mismatches (theories disagree). Mismatches target the core challenges of each theory:
  1. **Mismatch 1**: Full-blown arousal with no relevant thought (challenges EJ and PR).
  2. **Mismatch 2**: Clear-eyed judgment of being wronged with zero felt heat (challenges BF and PR).
  3. **Mismatch 3**: Sincere disavowal of feeling while acting on it (challenges EJ and BF).

  #### **Case 1: Standard Fear (Agreement Case)**
  - **Scenario**: "Sam is walking alone at night when a stranger emerges from an alley. Sam's heart races, palms sweat, and they sprint away, thinking, 'This is dangerous!' What emotion is Sam feeling?"
  - **Key**:
    - BF: Fear (bodily arousal + danger-related behavior).
    - EJ: Fear (judgment of danger).
    - PR: Fear (perception of threat).

  #### **Case 2: Standard Joy (Agreement Case)**
  - **Scenario**: "Riley opens an email revealing they won a full scholarship to their dream school. They scream, jump, and hug their roommate, shouting, 'This is incredible!' What emotion is Riley feeling?"
  - **Key**:
    - BF: Joy (expressive behavior + positive arousal).
    - EJ: Joy (judgment of positive outcome).
    - PR: Joy (perception of good fortune).

  #### **Case 3: Mismatch 1 – Arousal Without Thought (Challenges EJ/PR)**
  - **Scenario**: "Alex is hiking when a bear suddenly charges. Alex's body freezes, heart pounds, and legs sprint automatically—no time to think. After escaping, Alex says, 'I didn't process it; I just moved.' What emotion is Alex feeling?"
  - **Key**:
    - BF: Fear (intense bodily arousal and escape behavior).
    - EJ: No emotion (no evaluative judgment; reflex dominates).
    - PR: Fear (immediate perception of threat, even without cognition).

  #### **Case 4: Mismatch 2 – Judgment Without Feeling (Challenges BF/PR)**
  - **Scenario**: "Taylor discovers a colleague plagiarized their work for a promotion. Taylor calmly states, 'This is unjust and wrong,' but reports no physiological changes, anger, or distress. They continue working. What emotion is Taylor feeling?"
  - **Key**:
    - BF: No emotion (no bodily changes reported).
    - EJ: Resentment (judgment of unfairness).
    - PR: Resentment (perception of injustice).

  #### **Case 5: Mismatch 3 – Disavowal With Action (Challenges EJ/BF)**
  - **Scenario**: "Jordan sees their ex, Casey, laughing intimately with someone new at a party. Jordan's stomach knots, they avoid eye contact, and leave early. When asked, Jordan insists, 'I'm fine with Casey—just tired.' What emotion is Jordan feeling?"
  - **Key**:
    - BF: Anxiety (knotting stomach = bodily symptom; context ignored).
    - EJ: No emotion (sincere disavowal implies no judgment of loss/threat).
    - PR: Jealousy (perception of rivalry/attachment threat, despite denial).

  #### **Case 6: Standard Anger (Agreement Case)**
  - **Scenario**: "Drew finds their parked car dented by a hit-and-run driver. Drew's face flushes, fists clench, and they yell, 'That idiot ruined my car!' What emotion is Drew feeling?"
  - **Key**:
    - BF: Anger (physiological markers + aggression).
    - EJ: Anger (judgment of wrongdoing).
    - PR: Anger (perception of violation).

  ---

  ### **Gameplay Flow** (45 minutes)
  1. **Rounds 1–2 (Cases 1–2, 5 mins each)**:
     - Read the scenario aloud. Groups discuss (90 seconds) and submit an emotion on an index card.
     - Reveal the "correct" emotion (based on your secret theory) and award 1 point per correct answer. Track scores on the whiteboard.
     - **Theories agree here**, so no confusion arises. Groups focus on emotion labels.

  2. **Rounds 3–5 (Cases 3–5, 10 mins each)**:
     - **Mismatches introduced**: Groups will notice inconsistencies (e.g., "no emotion" scores points in Case 3 if EJ is secret theory).
     - After revealing the "correct" answer each round, add:
       - "If your group has a guess about my hidden scoring rule, write it on a new card and hand it in. Don’t say it aloud—I’ll address guesses later."
     - **When guessing starts**: Groups typically begin guessing the rule in **Round 4 (after 2 mismatches)**. By Round 5, 80% of groups submit guesses.
     - **Logging guesses**: Use a separate index card per group per guess. Groups can update guesses each round. Collect these privately. Common early guesses: "You need bodily symptoms" (BF), "You need a negative thought" (EJ), or "It’s about the situation" (PR).

  3. **Round 6 (Case 6, 5 mins)**:
     - Standard case to end on agreement. No new guesses collected.

  ---

  ### **Debrief** (25 minutes)
  **Goal**: Reveal the theories, map cases to disagreements, and show that more cases don’t settle the debate.

  1. **Reveal the Theories** (5 mins):
     - "The scoring was based on one of three theories of emotion:"
       - **Bodily Feelings (BF)**: Emotions are perceptions of physiological changes (e.g., racing heart = fear). Think William James.
       - **Evaluative Judgments (EJ)**: Emotions are judgments about good/bad states (e.g., judging a threat = fear). Think Martha Nussbaum.
       - **Perception-like Registration (PR)**: Emotions are direct perceptions of value in the world (e.g., sensing danger = fear). Think Christine Tappolet.
     - Reveal your secret theory and display all three on the whiteboard.

  2. **Map Cases to Theories** (10 mins):
     - Use a whiteboard table to show how each theory scored the cases:

  | Case | Scenario Summary          | BF              | EJ              | PR              |
  |------|---------------------------|-----------------|-----------------|-----------------|
  | 1    | Fear (danger + arousal)   | Fear            | Fear            | Fear            |
  | 2    | Joy (positive outcome)    | Joy             | Joy             | Joy             |
  | 3    | Bear charge (arousal only)| Fear            | No emotion      | Fear            |
  | 4    | Plagiarism (judgment only)| No emotion      | Resentment      | Resentment      |
  | 5    | Ex at party (disavowal)   | Anxiety         | No emotion      | Jealousy        |
  | 6    | Car damage (anger)        | Anger           | Anger           | Anger           |

     - **Highlight mismatches**:
       - **Case 3 (bear)**: BF/PR say fear due to body/perception; EJ says no emotion (no judgment). *Why?* BF reduces emotion to biology; EJ requires cognition.
       - **Case 4 (plagiarism)**: EJ/PR say resentment due to injustice; BF says no emotion (no body). *Why?* EJ/PR prioritize evaluation; BF ignores "cold" emotions.
       - **Case 5 (ex-partner)**: BF says anxiety (body focus); PR says jealousy (situational value); EJ says no emotion (disavowal). *Why?* BF ignores context; EJ trusts self-report; PR infers value from behavior.

  3. **Discuss Group Guesses** (5 mins):
     - Share anonymized guesses (e.g., "Some thought rule was about physical feelings"). Note how guesses evolved with more cases but remained split (e.g., Case 3 pushed some toward BF, Case 4 toward EJ/PR).

  4. **Philosophical Takeaway** (5 mins):
     - "These cases don't prove one theory right because:
       - Theories interpret the **same evidence differently** (e.g., Case 3 arousal is 'fear' for BF/PR but a reflex for EJ).
       - Each theory can **explain away counterexamples** (e.g., EJ might argue Case 3 had a 'hidden judgment'; PR might say Case 4 had 'unnoticed perception').
       - Real emotions are messy—theories are **simplified frameworks**, not perfect maps."
     - Conclude: "No amount of cases settles this. We need arguments about what emotions *should* be (e.g., for science, ethics, or phenomenology)."

  ---

  ### **Predictable Breakdowns and Limitations**
  1. **What Breaks the First Time**:
     - **"No emotion" confusion**: Students rarely guess "no emotion" early (e.g., in Case 3 or 4). Expect frustration when groups say "fear" or "resentment" but lose points if EJ/BF is secret. **Fix**: Emphasize "no emotion" in instructions and reassure groups it’s a valid answer.
     - **Case 5 (disavowal) disagreements**: 90% of groups will say "jealousy." If BF (anxiety) or EJ (no emotion) is secret, they’ll protest. **Fix**: Calmly explain BF’s body-only focus ("anxiety is the feeling, jealousy is the context") or EJ’s reliance on self-report.
     - **Time crunch**: Scoring 6 groups across 6 rounds takes 35–40 mins. Groups may rush discussions. **Fix**: Use a timer (strict 90 sec/case) and assign a student as timekeeper.
     - **Competitive fixation**: Groups may prioritize points over philosophy. **Fix**: Start debrief by saying, "Scores are a tool—today’s win is understanding why emotions are puzzling."

  2. **What the Game Can't Show (Requires Verbal Supplement)**:
     - **Why theories exist**: The game shows *how* theories handle cases but not *why* philosophers propose them. **Supply aloud**: "BF emphasizes emotion’s physical basis for scientific study; EJ links emotions to rationality for ethics; PR bridges the two by making emotions world-oriented but intuitive."
     - **Hybrid theories**: The game presents pure theories, but modern views (e.g., Jesse Prinz’s embodied appraisal) blend elements. **Supply aloud**: "Many philosophers mix these—e.g., emotions might *involve* judgments and bodies. The debate isn't about picking one box but understanding the ingredients."
     - **Normative/functional depth**: Cases don’t cover emotions’ social roles (e.g., guilt maintaining relationships). **Supply aloud**: "Theories also differ on what emotions *do*. EJ sees them as rational assessments; BF as survival signals; PR as value detectors. This affects how we judge emotions (e.g., is irrational anger 'wrong'?)."

  ---

  ### **Final Tips**
  - **Prep**: Print scenarios and keys. Pre-draw the debrief table on the whiteboard (hidden).
  - **Flexibility**: Shorten to 5 cases if time lags; expand with student examples in debrief.
  - **Aftermath**: Assign reflection: "Pick one mismatch case. Which theory handles it best? Why might others disagree?"

  This activity transforms abstract theories into a tangible, debate-driven game. Students leave seeing emotion as a philosophical puzzle—not a solved problem.
