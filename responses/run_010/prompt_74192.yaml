prompt: |-
  For fifteen years I have been revising the same small company of characters across novels, stories, and abandoned drafts, and I have noticed that my judgments about when the character in one version is the character of another do not form an obvious pattern. I should like to know what principle, if any, they add up to — and in particular whether that principle says one and the same character exists in each version, differing only in which of her properties vary, or whether each version contains a character of its own, related to the others by something like counterpart relations whose weighting shifts with what I happen to be asking at the time.

  Here are my verdicts. When I rewrote a woman's entire biography between drafts, so that nothing of her history survived but her name and her temper, I think it is the same woman, merely corrected. When I changed only her name and left everything else intact, it is obviously the same woman. When, in a chapter set in the world where my protagonist never went to war, I wrote a crueller and happier man, I do not think that man is my protagonist, though I wrote him precisely to show what my protagonist might have been. When another writer, with my blessing, continued my character under her own name and history but gave her a temperament I could never have given her, I think that is not her — and yet she descends from mine in a way the war-less protagonist does not, which is what makes me uneasy, since her origin seems preserved while the character is not. When I placed a woman of the same name and incompatible histories in two novels and afterwards declared, in an author's note, that they were one woman who had lied, I think I made them one.

  Is there a single criterion of character-identity across versions and works that delivers all of these? State it precisely, with the clause that earns its keep in each case, and say what it implies for cases I have not raised: a translation in which the name has been altered, an unfinished manuscript whose thirty-year-old contradicts the fifty-year-old of the published book, a production in which two actresses alternate in the role. Then tell me plainly which of my verdicts it cannot save, and whether the price of saving all of them is a criterion too baroque to be worth holding.
reasoning: |-
  Hmm, this is an intricate philosophical question about character identity across different versions of creative works. The user has been working with the same characters across novels, stories, and drafts for fifteen years and has noticed inconsistent judgments about when characters are "the same" across versions. They want to know if there's a consistent principle behind their verdicts.

  Looking at their specific cases: 
  - When they rewrote a woman's entire biography but kept her name and temper, they consider it the same character (a correction).
  - Changing only the name while keeping everything else makes it obviously the same.
  - In an alternate world scenario where the protagonist never went to war, resulting in a crueler and happier version, they don't consider this the same character.
  - When another writer created a character with the same name and history but different temperament (with their blessing), they feel it's not the same character despite the lineage.
  - When they placed a woman with the same name but incompatible histories in two novels and declared them the same via author's note, they accept this unification.

  The user wants a precise criterion that explains all these cases and can handle additional scenarios like translations with name changes, unfinished manuscripts with contradictions, or productions with alternating actresses. They also want to know if such a criterion would be too baroque to be useful.

  This touches on deep philosophical questions about identity over time and across possible worlds. The core tension seems to be between essential properties (what makes a character fundamentally who they are) and conventional authorial fiat (where the creator's declaration overrides inconsistencies).

  I should consider theories like:
  - Essentialism (certain traits are inviolable)
  - Counterpart theory (different versions are counterparts rather than identical)
  - Narrative role or functional position
  - Authorial intention as the ultimate arbiter

  The challenge is finding a principle that respects both the author's creative authority and the intuitive boundaries of character identity. The cases where authorial declaration overrides inconsistency (the liar case) versus where it doesn't (the other writer's version) suggest authorial intention is necessary but not sufficient.

  Perhaps a hybrid approach: identity requires authorial continuity plus preservation of "essential narrative function," with the author having power to define what counts as essential in each creative context. But this might become circular.

  For the additional cases:
  - Translation with name change: likely same character if context preserved
  - Unfinished manuscript contradiction: depends on whether it's same work or not
  - Alternating actresses: different representations of the same character

  I'll need to be precise about defining "authorial context" and "narrative essence" while acknowledging the inherent flexibility of creative work. The solution might lie in distinguishing between identity within a single work versus across works, and between revisions versus parallel versions.

  The user's unease about the other writer's version is particularly telling - it suggests lineage isn't sufficient for identity, which challenges simple causal theories. This points toward something like a no-branching principle or narrative coherence requirement.
answer: |-
  The principle unifying your verdicts is **Authorially Sanctioned Narrative Essence (ASNE)**, which states: *A character X in version A is identical to character Y in version B iff (1) there is authorial continuity between A and B, and (2) Y preserves X’s core narrative function as defined by the author’s active intentional framework for the work(s) in question.*  

  ### Core Components:
  1. **Authorial Continuity**: The creator(s) must be either the same individual or operating under explicit/implicit sanction (e.g., authorized sequels, declared revisions).  
  2. **Narrative Essence**: The character’s indispensable role in the story’s causal-emotional logic. This includes:  
     - **Defining Traits**: Temperament, moral compass, or relationships central to their narrative purpose.  
     - **Functional Position**: Their impact on plot/theme (e.g., "the corrosive influence," "the redeeming witness").  

  ### ASNE Applied to Your Cases:
  | Your Case                                     | Verdict | ASNE Clause                                                                                               |  
  |-----------------------------------------------|---------|-----------------------------------------------------------------------------------------------------------|  
  | Rewritten biography (name + temper kept)      | Same    | **Authorial continuity** (your revision) + **narrative essence** preserved (temper defines her role).     |  
  | Name changed (everything else intact)         | Same    | **Narrative essence** unchanged; name is non-essential unless thematically critical (e.g., "A Boy Named Sue"). |  
  | War-less protagonist (crueler, happier)       | Not same| Lacks **authorial continuity** *for identity claims* (alternate world = new framework) + **essence** altered (trauma defines his role). |  
  | Other writer’s version (same name/history)    | Not same| **Authorial continuity** broken (external creator) + **narrative essence** violated (temperament is core to your intent). |  
  | Two novels + author’s note (declared liar)    | Same    | **Authorial continuity** (your declaration) *overrides* inconsistencies, binding versions into a single **narrative essence** (the lie becomes functional). |  

  ### Implications for New Cases:  
  1. **Translation with name altered**:  
     - *Verdict*: Same character.  
     - *Why*: **Authorial continuity** (translation sanctioned) + **narrative essence** unaffected (name change is conventional, not functional).  

  2. **Unfinished manuscript vs. published book (age contradiction)**:  
     - *Verdict*: Not the same character.  
     - *Why*: Lacks **authorial continuity** for unification (draft abandoned; published book is definitive framework). Contradiction voids shared **narrative essence**.  

  3. **Two actresses alternating in a role**:  
     - *Verdict*: Same character.  
     - *Why*: **Authorial continuity** (directorial sanction) + **narrative essence** preserved (both embody the role’s function).  

  ### Verdicts ASNE *Cannot* Save:  
  - **The other writer’s version**: You reject it as "not her," yet ASNE’s requirement for **authorial continuity** aligns with this. Your unease stems from *lineage without essence*—ASNE explicitly deems lineage insufficient without functional preservation. **This verdict is saved.**  

  - **The war-less protagonist**: You deny identity, and ASNE agrees (no continuity of framework + essence altered). **Saved.**  

  **No verdict is sacrificed.** ASNE resolves all cases without contradiction.  

  ### Is ASNE Too Baroque?  
  No—it distills your intuitive judgments into two scalable criteria. Its "baroque" elements (e.g., "active intentional framework") are necessary to handle:  
  - The **liar declaration**: Authorial fiat overrides history because you *made the lie functional* to her essence.  
  - The **biography rewrite**: Temperament preserved as essence; history discarded as non-core.  
  - **External adaptations**: Explicitly excluded without sanction (e.g., the other writer).  

  **Cost**: ASNE privileges authorial intent over reader interpretation or "objective" traits. This matches your practice but may clash with death-of-the-author approaches. If you value textual autonomy over creator authority, ASNE may feel restrictive. Yet for *your* question—governing *your* revisions—it reflects your instincts precisely.  

  ### Final Clarification:  
  ASNE rejects **counterpart theory** (where versions are linked by similarity, not identity) and **essentialism** (fixed traits like "must have war trauma"). Instead, identity is:  
  - **Author-relative**: You decide what constitutes "core" for each character.  
  - **Functionally flexible**: Essence is narrative role, not fixed properties.  

  Thus, when you declare the liar one woman, you *retrofit* her essence; when you discard biography but keep temper, you *prioritize* essence. ASNE formalizes your creative sovereignty.
