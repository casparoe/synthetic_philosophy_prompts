answer: |-
  Your background and approach are admirable—let's address each difficulty with close textual analysis, respecting both Aristotle's reasoning and your metrological precision. I'll follow your numbering strictly, avoiding secondary sources and focusing on the Rackham translation you provided.

  ### 1. One Standard or Two?  
  Aristotle posits **a single foundational standard (demand) with money as its conventional representation**. When he states that demand is the standard "in reality" (1133a27), he is making an ontological claim: demand is the *ultimate cause* of commensurability. Money ("nomisma") is its practical, agreed-upon *instrument*. The hierarchy is explicit:  
  - **Demand (χρεία, *chreia*)**: The real, unifying force behind exchange (1133a26-29). If needs vanish or shift, exchange collapses.  
  - **Money (νόμισμα, *nomisma*)**: A human invention that "conventionally represents" demand (1133a30-31). It exists "by custom/law" (νόμος, *nomos*), not nature.  

  The phrase "in reality" (ὅπερ ἐστὶν ἡ χρεία, "which is demand") corrects a potential misunderstanding: money *appears* to be the measure, but demand is the true substrate. This aligns with Aristotle’s critique of mistaking money for wealth (*Politics* 1257b10)—it is a symbol, not the essence.

  ### 2. Commensurability: Mathematical or Practical?  
  Aristotle concedes **a failure of kind, not merely precision**. His language is deliberate:  
  - "Impossible for things so different to become commensurable **in the strict sense**" (1133b20) implies that houses and shoes are *qualitatively distinct* and lack a natural common measure (e.g., like lines and curves in geometry).  
  - Demand provides a "**sufficiently accurate** common measure **for practical purposes**" (1133b22). This mirrors his methodological principle (*NE* 1094b12-27): ethics seeks "clarity as the subject-matter allows," not geometric exactness.  

  **Your metrological analogy holds**:  
  - An undefined quantity (e.g., "utility") cannot be calibrated.  
  - Demand acts as a pragmatic "standard" enabling approximate equality in exchange—*not* mathematical equality.  
  This *is* the point: justice in exchange is about fairness in social relations, not quantifying incommensurables. The "defect" is inherent to the domain.

  ### 3. "Diagonal Conjunction": Geometry or Bookkeeping?  
  The diagonal is **a schematic device, not rigorous geometry**. Aristotle’s terms (A=Builder, B=Shoemaker, C=House, D=Shoe) suggest a proportional relationship:  
  - Builder : Shoemaker :: Shoe : House  
  The diagonal (A-D and B-C) pairs producer with product, creating reciprocity:  
  - The builder *receives shoes* from the shoemaker;  
  - The shoemaker *receives a house* from the builder.  
  This visually enforces **proportional reciprocity** (ἀντιπεπονθός, *antipeponthos*), not mathematical proof. No ancient diagrams survive, but the context confirms it’s illustrative.

  ### 4. Money's Conventionality: What "Alteration"?  
  Aristotle intends **all three alterations you note**: debasement, revaluation, *and* loss of trust. Key phrases:  
  - "Altered and rendered useless **at will**" (1133a31) implies human agency (state or community).  
  - *Politics* 1257a30-39 describes money’s origin in barter, evolving to coinage for convenience. **No contradiction**: convention *builds on* natural need but is not determined by it. Silver becomes money by *nomos* (agreement), not its intrinsic properties.  

  **On the kilogram analogy**:  
  - Aristotle *would* see the 2019 redefinition as a change of the **measure**, not the measured. The metal’s mass is unchanged, but its *metrological function* is annulled by convention. Money’s value lies in its role, not its substance.

  ### 5. Stability, Price-Fixing, and the Role of Money  
  Aristotle recognizes **relative stability**, not fixity:  
  - Money is a "guarantee of future exchange" (1133b12) because it stores value *better* than perishable goods, despite drifting purchasing power (1133b14-15).  
  - Price-fixing (1133b16) is a *corrective* to drift, anchoring exchange ratios to mitigate instability.  

  **On the house/bedstead arithmetic**:  
  - The mina **does explanatory work**. Aristotle’s calculation (House = 5 minae, Bed = 1 mina → House = 5 Beds) shows money *enabling commensurability*.  
  - Yet he insists this ratio *pre-existed* money (1133b26-28). **Resolution**: Demand establishes ratios *implicitly*; money *explicitly quantifies* them. Coins are not mere records—they operationalize demand into a scalable system.  

  ---

  ### Summary of Aristotle’s Framework
  1. **Ontology**: Demand (χρεία) is the root of value.  
  2. **Instrument**: Money (νόμισμα) is demand’s conventional representation.  
  3. **Commensurability**: Qualitative differences preclude strict ratios; demand enables practical equality.  
  4. **Conventionality**: Money’s value depends on social agreement, not intrinsic properties.  
  5. **Function**: Money stores value (despite drift) and quantifies preexisting ratios.  

  Your metrological lens illuminates Aristotle’s pragmatism: he constructs a *social* measurement theory where "sufficient accuracy" serves ethical association (κοινωνία, *koinōnia*). The kilogram’s redefinition would fascinate him—proof that measures are human constructs serving communal needs, not natural absolutes.
