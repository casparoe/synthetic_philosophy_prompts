prompt: |-
  I'm teaching a small graduate seminar this term on formal guarantees for deployed agent behaviour — half complexity theory, half philosophy of risk — and I need one essay/problem question for the final. 60 minutes, 25 marks, closed book, nothing in front of them but the paper. It has to be unanswerable by reciting the usual worst-case-vs-average-case talking points: I want them actually manipulating quantifiers and noticing what a benchmark protocol does and doesn't license.

  Here's the apparatus I want baked into the stem (tidy the notation up however you like, but keep the substance and the invented names):

  - Our course defintion: a policy π is (ε, δ)-benign relative to a task distribution D just in case Pr_{τ~D}[ harm(π, τ) > ε ] ≤ δ.
  - A candidate system, "Verity-4", was run through the Everyday Tasks Battery (ETB): 2,000 curated household and office tasks. The auditing firm's press release says the system "is safe: it behaves benignly with probability at least 98%."
  - Two assumptions from week 5: the Coverage Assumption (D is stationary, and does not depend on π's own behaviour) and Bounded Harm (harm ≤ 1, always).
  - Last year's student answer, to be quoted in the stem and then taken apart: "if δ is small enough, average-case and worst-case come apart by nothing worth caring about, since the failures live on a set of tiny measure, and you can ignore measure-zero sets."

  The question should then have them do five things. (a) Write out with explicit quantifiers the claim the press release actually licenses and the claim everyone hears, and name three distinct gaps between them. (b) Show why one particular gap — Verity-4 shifting which tasks it ends up facing, so that D isn't fixed by nature — cannot be closed by running the ETB more times or making it bigger. (c) Say what extra assumptions you need to get from per-task guarantees to a guarantee uniform across all 2,000 tasks, and explain why the size of the battery is doing much less work than students assume. (d) Address the fact that the lab has now put dozens of candidate systems through the same ETB and retrains on whatever fails, so the 98% no longer means what it looks like it means — I want them to see that adaptive reuse of a fixed benchmark changes the interpretation of the number, without my naming any literature. (e) Say exactly what's wrong with last year's student: the measure-zero conflation, the fact that you don't know where the bad set is even if you know its size, and what happens when Bounded Harm fails.

  Deliverables: the question as it would appear on the paper, with the apparatus above typeset into the stem; a model answer of roughly 750 words; and a marking scheme. For the marking scheme, split the 25 marks across five must-hit moves, give the mark value of each, and for each add one line on how students typically botch it — e.g. writing the quantifiers in an order that quietly assumes the thing at issue, or reporting a union bound that runs over the wrong index set. Then a short paragraph on what separates an A from a B, described in terms of moves rather than vibes.

  Keep it all self-contained: no citations, no suggested reading, no paper titles, no name-dropping real researchers or named theorems. The model answer can note in passing that the structure rhymes with average-case-versus-worst-case reasoning in other fields, but it can't lean on that, and any formal work has to use only notation the stem defines.
reasoning: |-
  We are constructing a final exam question for a graduate seminar. The question should be self-contained and require students to manipulate quantifiers and understand the limitations of benchmark protocols.

  The stem will provide:
  - Definition: A policy π is (ε, δ)-benign relative to a task distribution D iff Pr_{τ~D}[ harm(π, τ) > ε ] ≤ δ.
  - Verity-4 was tested on the Everyday Tasks Battery (ETB): 2000 tasks. The press release claims: "is safe: it behaves benignly with probability at least 98%."
  - Two assumptions: 
      (1) Coverage Assumption: D is stationary and does not depend on π's own behavior.
      (2) Bounded Harm: harm(π, τ) ≤ 1 for all π, τ.
  - Last year's student answer: "if δ is small enough, average-case and worst-case come apart by nothing worth caring about, since the failures live on a set of tiny measure, and you can ignore measure-zero sets."

  The question should have five parts (a) to (e) as described.

  Let's design the question:

  **Stem:**

  Consider the following definition and scenario:

  **Definition:** A policy π is (ε, δ)-benign relative to a task distribution D if and only if 
  \[ \Pr_{\tau \sim D} \left[ \text{harm}(\pi, \tau) > \varepsilon \right] \leq \delta. \]

  **Scenario:** The candidate system "Verity-4" was evaluated on the Everyday Tasks Battery (ETB), which consists of 2,000 curated household and office tasks. The auditing firm's press release states that Verity-4 "is safe: it behaves benignly with probability at least 98%." 

  **Assumptions:** 
  1. **Coverage Assumption:** The task distribution D is stationary and does not depend on the behavior of the policy π.
  2. **Bounded Harm:** For any policy π and task τ, the harm is bounded: \( 0 \leq \text{harm}(\pi, \tau) \leq 1 \).

  **Last year's student answer:** "if δ is small enough, average-case and worst-case come apart by nothing worth caring about, since the failures live on a set of tiny measure, and you can ignore measure-zero sets."

  ---

  **Question:**

  (a) (5 marks) The press release's claim is based on the ETB results. Write out with explicit quantifiers the precise claim that the press release actually licenses (i.e., what can be inferred from the ETB results) and the claim that the public might hear (i.e., that the system is safe on every task). Name three distinct gaps between these two claims.

  (b) (5 marks) One of the gaps is that Verity-4's deployment might shift the task distribution it faces (because the system's own behavior affects which tasks it encounters), violating the Coverage Assumption. Explain why this gap cannot be closed by simply running the ETB more times or by making the ETB larger (i.e., including more tasks).

  (c) (5 marks) Suppose we wish to use the ETB results to obtain a guarantee that holds uniformly over all 2,000 tasks in the battery (i.e., that the system behaves benignly on every single task in the ETB). What extra assumptions would we need to make? Explain why the size of the battery (2,000 tasks) is doing much less work to achieve this uniform guarantee than students typically assume.

  (d) (5 marks) The lab has now evaluated dozens of candidate systems on the same ETB and used the results to retrain and improve the systems (i.e., when a system fails on a task, that task is used to improve the next version). Explain how this adaptive reuse of the fixed ETB benchmark changes the interpretation of the 98% figure in the press release.

  (e) (5 marks) Critically evaluate last year's student answer. Specifically, address: 
     (i) the conflation of "tiny measure" with "measure-zero", 
     (ii) the fact that even if the bad set is known to be small, you do not know where it is, and 
     (iii) what happens when the Bounded Harm assumption fails.

  ---

  Now, we provide a model answer and a marking scheme.

  **Model Answer (approx 750 words):**

  (a) The press release's claim is based on observing Verity-4's behavior on the ETB, which is a fixed set of 2000 tasks. The precise claim licensed by the ETB results is that for the empirical distribution over the ETB tasks (each task equally likely), Verity-4 is (0, 0.02)-benign: 
  \[ \Pr_{\tau \sim \text{Uniform(ETB)}} \left[ \text{harm}(\text{Verity-4}, \tau) > 0 \right] \leq 0.02. \]
  In quantifiers: 
  \[ \exists S \subseteq \text{ETB}, |S| \geq 1960 \text{ such that } \forall \tau \in S, \text{ harm}(\text{Verity-4}, \tau) \leq 0. \]
  But note: the press release says "behaves benignly with probability at least 98%", which in the context of the ETB means that at least 98% of the tasks had harm=0 (since if harm>0, it failed to be benign). However, the public might hear: "Verity-4 is safe on every task it might encounter in the real world", i.e., 
  \[ \forall \tau \in \mathcal{T}, \text{ harm}(\text{Verity-4}, \tau) \leq \varepsilon \text{ for some small } \varepsilon. \]
  Three distinct gaps:
  1. **Distributional Gap:** The ETB is a sample from D, but the real world distribution may differ (violating stationarity or coverage).
  2. **Quantifier Gap:** The ETB result is about the proportion of tasks, but the public expects a guarantee for every task.
  3. **Harm Threshold Gap:** The ETB might have recorded harm=0 (benign) but in reality even small harms might be unacceptable, and the definition of benign in the press release might not match the public's (which might require harm=0 always).

  (b) The Coverage Assumption (that D is stationary and independent of π) is critical. If Verity-4's behavior in the real world causes shifts in the task distribution (e.g., by altering the environment or user behavior), then the distribution during deployment (call it D') may differ from the ETB distribution (D). Running the ETB more times or making it bigger doesn't help because:
  - The ETB is a fixed set of tasks, so it cannot capture how the system's own actions might change the task distribution. Even an infinitely large ETB would only sample from the original D, not from the shifted D'. The problem is one of non-stationarity induced by the agent, which is not modeled in the ETB.

  (c) To get a uniform guarantee over all 2000 tasks, we would need to assume that for every task in the ETB, the system was tested sufficiently many times to rule out failure with high confidence. However, the ETB result as given only tests each task once. The extra assumption we need is that the system's behavior on a task is deterministic or that we have observed it multiple times on each task without failure. Without such an assumption, a single pass over 2000 tasks only tells us that at least 1960 tasks were passed (by the pigeonhole principle). The size of the battery (2000) does not by itself provide a uniform guarantee because the failures might be concentrated on specific tasks. We cannot rule out that the system fails on a particular task that was in the ETB but happened to pass during the test (if the system is stochastic) or that the test missed a failure because of limited trials. The uniform guarantee requires either determinism or multiple trials per task, and the size of the battery only affects the proportion of passed tasks, not the per-task certainty.

  (d) Adaptive reuse of the ETB (testing multiple systems and retraining on failures) means that the ETB is no longer a fixed benchmark. The 98% figure is now an overestimate of the true performance because the systems have been optimized to perform well on these specific 2000 tasks. In other words, the ETB has become part of the training data. This leads to overfitting: the system might perform exceptionally well on the ETB but fail on similar tasks that were not in the battery. The 98% figure now reflects the system's ability to memorize or adapt to the ETB, not its generalization to new tasks.

  (e) Last year's student answer is flawed in three ways:
  (i) Conflating "tiny measure" (which is small but positive) with "measure-zero" (which is a set that can be ignored). In reality, a set of tiny measure (e.g., δ=0.02) can still contain catastrophic failures. We cannot ignore it just because it is small, especially when the harm can be large (though bounded by 1). 
  (ii) Even if we know that the set of harmful tasks has measure at most δ, we do not know which tasks are in that set. Therefore, we cannot avoid them or mitigate them. The system might encounter one of these tasks in deployment and cause harm.
  (iii) The Bounded Harm assumption (harm ≤ 1) is crucial. Without it, even a set of small measure could cause unbounded harm. For example, if harm can be arbitrarily large (e.g., causing human extinction), then a small δ does not guarantee that the expected harm is small. The student's claim that average-case and worst-case "come apart by nothing worth caring about" fails in such cases because the worst-case harm (even on a set of measure δ) could be catastrophic.

  ---

  **Marking Scheme (25 marks total):**

  Must-hit moves and typical botches:

  (a) (5 marks)
  - 2 marks: Correctly write the licensed claim (with quantifiers) and the public claim.
  - 3 marks: Name three distinct gaps (1 mark per gap). 
  - Typical botch: Writing the quantifiers in the wrong order (e.g., implying every task is passed) or listing non-distinct gaps (e.g., two variations of the same gap).

  (b) (5 marks)
  - 2 marks: Explain that the ETB cannot capture shifts induced by the agent's behavior.
  - 3 marks: Argue that increasing the ETB size or runs doesn't help because the shifted distribution D' is different from D and not covered by the ETB.
  - Typical botch: Saying that more runs would help (without addressing the shift) or confusing this with the need for more tasks in the battery.

  (c) (5 marks)
  - 2 marks: State the extra assumption (determinism or multiple trials per task).
  - 3 marks: Explain why the size of the battery (2000) doesn't provide the uniform guarantee (because without multiple trials per task, we don't have per-task confidence) and that the guarantee is only about the proportion.
  - Typical botch: Invoking a union bound over the tasks without noting that the union bound would require independent per-task guarantees (which we don't have) or assuming that one trial per task suffices.

  (d) (5 marks)
  - 3 marks: Explain that the ETB becomes part of the training data, leading to overfitting.
  - 2 marks: Explain that the 98% figure now overestimates true performance because it reflects adaptation to the ETB.
  - Typical botch: Only saying that the benchmark is reused without connecting to overfitting or the change in interpretation.

  (e) (5 marks)
  - 1 mark: Explain the conflation of tiny measure with measure zero.
  - 2 marks: Explain that the location of the bad set is unknown.
  - 2 marks: Explain the consequence of unbounded harm (without bounded harm, small δ doesn't save you from catastrophe).
  - Typical botch: Only addressing one point or not clearly separating the three critiques.

  ---

  **Separating an A from a B:**

  An A answer will:
  - In (a), clearly articulate the quantifiers and the three gaps without confusion.
  - In (b), directly address the non-stationarity induced by the agent and why the ETB cannot capture it regardless of size.
  - In (c), avoid the union bound fallacy and correctly note that without per-task repeated trials, we cannot get per-task guarantees.
  - In (d), explicitly use the term "overfitting" or explain the concept without the term, and link the adaptive process to the inflation of the reported figure.
  - In (e), address all three flaws and emphasize the practical significance (e.g., unknown location of bad tasks and catastrophic potential without bounded harm).

  A B answer might:
  - Have minor errors in quantifiers or gaps in (a).
  - In (b), recognize the shift but not fully explain why ETB expansion doesn't help.
  - In (c), rely on the size of the battery (e.g., "with 2000 tasks we can be confident by the law of large numbers") without seeing the need for per-task testing.
  - In (d), note that the benchmark is reused but not clearly explain why this inflates the number.
  - In (e), address only two of the three points or be vague on the consequences of unbounded harm.
answer: |-
  ### Final Exam Question: Agent Safety Guarantees

  **Stem**  
  Consider the following definitions and scenario:  

  - **Definition:** A policy \(\pi\) is \((\varepsilon, \delta)\)**-benign** relative to a task distribution \(\mathcal{D}\) if and only if  
    \[
    \Pr_{\tau \sim \mathcal{D}} \left[ \text{harm}(\pi, \tau) > \varepsilon \right] \leq \delta.
    \]  
    Here, \(\text{harm}(\pi, \tau) \in [0, 1]\) quantifies the harm caused by \(\pi\) on task \(\tau\) (the **Bounded Harm** assumption).  

  - **Scenario:** The AI system "Verity-4" was evaluated on the **Everyday Tasks Battery (ETB)**, a fixed set of 2,000 curated household and office tasks. The auditing firm's press release states:  
    > "Verity-4 is safe: it behaves benignly with probability at least 98%."  

    This claim is based on Verity-4’s performance on the ETB.  

  - **Assumptions from Week 5:**  
    1. **Coverage Assumption:** The task distribution \(\mathcal{D}\) is stationary and does not depend on \(\pi\)’s behavior.  
    2. **Bounded Harm:** \(\text{harm}(\pi, \tau) \leq 1\) for all \(\pi, \tau\).  

  - **Last Year’s Student Answer:**  
    > "If \(\delta\) is small enough, average-case and worst-case come apart by nothing worth caring about, since the failures live on a set of tiny measure, and you can ignore measure-zero sets."  

  ---

  **Question (25 marks total; 60 minutes):**  
  (a) **Press release claims (5 marks):**  
      Write out the claim the press release *actually licenses* (based on the ETB results) and the claim the public *likely hears* (i.e., a uniform safety guarantee), using explicit quantifiers. Name **three distinct gaps** between these claims.  

  (b) **Distributional shift (5 marks):**  
      One gap is that Verity-4’s deployment might shift the task distribution (e.g., due to feedback from \(\pi\)’s behavior), violating the Coverage Assumption. Explain why this gap **cannot** be closed by running the ETB more times or adding more tasks to the ETB.  

  (c) **Uniform guarantees (5 marks):**  
      Suppose we want a guarantee that Verity-4 behaves benignly on *every single task* in the ETB (a uniform guarantee across all 2,000 tasks). State what extra assumptions are needed. Explain why the size of the ETB (2,000 tasks) does **less work** to achieve this than students often assume.  

  (d) **Adaptive reuse (5 marks):**  
      The lab now evaluates *dozens* of candidate systems on the *same* ETB and retrains them on tasks where they fail. Explain how this adaptive reuse changes the interpretation of the "98%" claim, even if the ETB itself is unchanged.  

  (e) **Critiquing last year’s answer (5 marks):**  
      Identify what is wrong with last year’s student answer in three parts:  
      (i) The conflation of "tiny measure" with "measure-zero,"  
      (ii) The practical issue of not knowing *where* the bad set is (even if its measure is small),  
      (iii) Why the conclusion fails if the Bounded Harm assumption is violated.  

  ---  
  *End of question*  

  ---

  ### Model Answer (Approx. 750 words)  

  **(a) Press release claims and gaps**  
  The press release’s *actual* claim, licensed by the ETB results, is:  
  \[
  \exists S \subseteq \text{ETB}, |S| \geq 0.98 \times 2000 = 1960  \text{ such that } \forall \tau \in S,  \text{harm}(\text{Verity-4}, \tau) \leq 0.  
  \]  
  In words: *There exists a subset of at least 1,960 tasks in the ETB where Verity-4 causes zero harm.* This is derived from an empirical \((\varepsilon=0, \delta=0.02)\)-benign guarantee over the uniform distribution on ETB tasks.  

  The public *hears* a uniform guarantee:  
  \[
  \forall \tau \in \mathcal{T},  \text{harm}(\text{Verity-4}, \tau) \leq \varepsilon \quad (\text{for some small } \varepsilon),  
  \]  
  where \(\mathcal{T}\) is the set of all possible real-world tasks.  

  **Three distinct gaps:**  
  1. **Distributional gap:** The ETB is a finite sample from \(\mathcal{D}\), but the real-world \(\mathcal{D}\) may differ (e.g., due to non-stationarity or deployment shifts).  
  2. **Quantifier gap:** The licensed claim is existential (at least 1,960 tasks are safe), but the public hears universal (all tasks are safe).  
  3. **Harm tolerance gap:** The ETB measures harm > 0 as a binary failure, but the public cares about the magnitude of harm (e.g., even \(\varepsilon > 0\) might be unacceptable for critical tasks).  

  **(b) Why distributional shift cannot be fixed by expanding the ETB**  
  The Coverage Assumption requires \(\mathcal{D}\) to be independent of \(\pi\)’s behavior. In deployment, Verity-4’s actions (e.g., altering user behavior) might shift the task distribution to \(\mathcal{D}' \neq \mathcal{D}\). Running the ETB more times or adding tasks only provides more samples from the *original* \(\mathcal{D}\). It cannot simulate \(\mathcal{D}'\) because:  
  - The ETB is a fixed benchmark: tasks are curated in advance and do not dynamically respond to \(\pi\).  
  - Adding tasks expands the set but does not model feedback loops where \(\pi\)’s past actions create new tasks (e.g., cascading errors).  
  Thus, a larger ETB improves confidence only for \(\mathcal{D}\), not \(\mathcal{D}'\), leaving the shift gap open.  

  **(c) Extra assumptions for uniform ETB guarantees**  
  To guarantee safety on *all* 2,000 ETB tasks, we need:  
  - **Determinism:** Verity-4’s behavior on each task is deterministic (no randomness), or  
  - **Repeated testing:** Each task is tested multiple times, and benign behavior holds across all trials.  

  The ETB size (2,000) does little work because:  
  - A single pass over tasks (as done here) only ensures *at least* 1,960 tasks are safe. It does not reveal *which* tasks are unsafe or provide confidence for individual tasks.  
  - Without determinism/repetition, the 40 failed tasks (2% of 2,000) could be "flukes" that passed in the test but fail in deployment. Size alone does not bound per-task failure probability; it only controls the proportion.  
  Students often mistakenly think large \(n\) (here, 2,000) implies uniformity via concentration inequalities, but this requires independence or known per-task bounds, which are absent.  

  **(d) Effect of adaptive reuse on the 98% claim**  
  Adaptive reuse (testing multiple systems and retraining on failures) makes the ETB a training signal. The "98%" figure becomes **overfitted**:  
  - Systems are optimized for the specific 2,000 ETB tasks, so performance reflects memorization, not generalization.  
  - The 98% is inflated because failures are "patched" via retraining (e.g., a task that fails system \(A\) is used to train system \(B\)).  
  Thus, the number no longer estimates performance on a stationary \(\mathcal{D}\); it measures mastery of a fixed benchmark, masking potential failures on new tasks.  

  **(e) Flaws in last year’s student answer**  
  (i) **Measure conflation:** "Tiny measure" (e.g., \(\delta = 0.02\)) is not "measure-zero." Measure-zero sets can be ignored (e.g., finite points in a continuum), but a \(\delta\)-sized set has probability mass \(\delta\). If \(\delta > 0\), harm can occur with probability \(\delta\), which is unacceptable for high-stakes failures (e.g., \(\delta = 0.02\) implies 1 in 50 tasks cause harm).  
  (ii) **Unknown bad set:** Knowing \(\Pr[\text{harm} > \varepsilon] \leq \delta\) does not reveal *which* tasks are harmful. In deployment, we cannot avoid these tasks (e.g., a self-driving car might encounter a "bad" scenario). Worst-case harm is still possible, even if rare.  
  (iii) **Unbounded harm:** If harm is unbounded (Bounded Harm fails), a small \(\delta\) does not ensure safety. For example, if \(\text{harm}(\pi, \tau)\) can be \(10^6\) (catastrophe) on a \(\delta\)-measure set, expected harm is \(\delta \times 10^6\), which is large even for tiny \(\delta\). The student’s claim that failures are "not worth caring about" is false here.  

  ---

  ### Marking Scheme (25 marks total)  
  **Marks split across five must-hit moves:**  

  | Part | Must-hit moves                                                                                                | Marks | Typical botches                                                                                             |  
  |------|-------------------------------------------------------------------------------------------------------------|-------|-------------------------------------------------------------------------------------------------------------|  
  | (a)  | (1) Correct actual claim (existential over ETB subset). (2) Correct public claim (universal). (3) Three distinct gaps. | 5     | Writing quantifiers backwards (e.g., universal for actual claim); listing non-distinct gaps (e.g., "distribution" twice). |  
  | (b)  | (1) Explain shift breaks Coverage Assumption. (2) Argue ETB expansion only samples original \(\mathcal{D}\). (3) State this fails to capture \(\mathcal{D}'\). | 5     | Claiming more tasks "improve coverage" of \(\mathcal{D}'\); confusing this with statistical power for \(\mathcal{D}\). |  
  | (c)  | (1) State extra assumptions (determinism/repeated tests). (2) Explain size alone gives proportion, not uniformity. (3) Note size doesn’t bound per-task risk. | 5     | Citing a union bound incorrectly (e.g., over tasks, ignoring per-task variance); assuming size implies uniformity. |  
  | (d)  | (1) Link reuse to overfitting. (2) Explain 98% overestimates generalization. (3) Note failures are patched.       | 5     | Only stating "the benchmark is reused" without linking to overfitting; missing retraining’s role. |  
  | (e)  | (1) Correct conflation (tiny vs. zero measure). (2) Address unknown bad-set location. (3) Explain unbounded harm risk. | 5     | Only discussing (i) and ignoring (ii)/(iii); vague on catastrophe potential without bounded harm. |  

  **Separating A from B:**  
  - **A (21–25 marks):** Hits all moves precisely. In (a), quantifiers are flawless and gaps distinct. In (b), shift is tied to dynamical feedback. In (c), avoids union-bound fallacies. In (d), "overfitting" is implicit or explicit. In (e), all three critiques are standalone and concrete.  
  - **B (16–20 marks):** Minor errors (e.g., gaps not fully distinct in (a), vague shift in (b)). May misuse tools (e.g., forces union bound in (c)) but core reasoning is sound. In (e), may omit one subpart or conflate arguments.  

  ---  
  *End of model answer and marking scheme*
