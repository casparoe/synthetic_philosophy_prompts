  \[ \Delta \bar{z} = \frac{ \text{Cov}_{group}(W_i, z_i) }{ \bar{W} } \]

  For the individual Price equation:
  \[ \Delta \bar{z} = \frac{ \text{Cov}_{ind}(w_j, z_j) }{ \bar{w} } \]

  But these are not the same. However, in our case, because groups are the vehicles and there is no within-group selection, we can relate them.

  But note: the average trait in the next generation is the same regardless of the level. The group-level Price equation gives:

  \[ \bar{W} \Delta \bar{z} = \text{Cov}_{group}(W_i, z_i) \]

  The individual-level Price equation gives:

  \[ \bar{w} \Delta \bar{z} = \text{Cov}_{ind}(w_j, z_j) \]

  But the total change in the mean trait must be the same. Therefore, we must have:

  \[ \text{Cov}_{group}(W_i, z_i) / \bar{W} = \text{Cov}_{ind}(w_j, z_j) / \bar{w} \]

  But let's compute both sides.

  We have:

  Left side: 
  \[ \frac{ \text{Cov}_{group}(W_i, z_i) }{ \bar{W} } = \frac{ \frac{1}{N_{group}} \sum_i (W_i - \bar{W}) (z_i - \bar{z}) }{ \bar{W} } \]

  Right side:
  \[ \frac{ \text{Cov}_{ind}(w_j, z_j) }{ \bar{w} } = \frac{ \frac{1}{N_{ind}} \sum_j (w_j - \bar{w}) (z_j - \bar{z}) }{ \bar{w} } = \frac{ \sum_i n_i (w_i - \bar{w}) (z_i - \bar{z}) }{ N_{ind} \bar{w} } \]

  But N_ind = sum_i n_i, and w_i = exp(-a T_i), and W_i = T_i exp(-a T_i) = n_i w_i.

  Also, note that the group-level covariance can be written as:

  \[ \text{Cov}_{group}(W_i, z_i) = \frac{1}{N_{group}} \sum_i W_i (z_i - \bar{z}) \] (since the average of W_i is \bar{W})

  Similarly, the individual covariance:

  \[ \text{Cov}_{ind}(w_j, z_j) = \frac{ \sum_i n_i w_i (z_i - \bar{z}) }{ N_{ind} } \]

  But note that n_i w_i = W_i. So:

  \[ \text{Cov}_{ind}(w_j, z_j) = \frac{ \sum_i W_i (z_i - \bar{z}) }{ N_{ind} } \]

  And N_ind = sum_i n_i.

  Now, the group-level covariance:

  \[ \text{Cov}_{group}(W_i, z_i) = \frac{ \sum_i W_i (z_i - \bar{z}) }{ N_{group} } \]

  Therefore:

  \[ \text{Cov}_{ind}(w_j, z_j) = \frac{ N_{group} }{ N_{ind} } \text{Cov}_{group}(W_i, z_i) \]

  And note that \bar{w} = total offspring / total parents = (sum_i W_i) / (sum_i n_i) = \bar{W} * (N_group / N_ind) ? 

