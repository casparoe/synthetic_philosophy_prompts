  \[ \frac{ \text{Cov}_{ind}(w_j, z_j) }{ \bar{w} } = \frac{ (N_{group} / N_{ind}) \text{Cov}_{group}(W_i, z_i) }{ (\bar{W} N_{group}) / N_{ind} } = \frac{ \text{Cov}_{group}(W_i, z_i) }{ \bar{W} } \]

