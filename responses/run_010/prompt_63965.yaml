  In the cellular slime mold *Dictyostelium discoideum*, groups (slugs) form by aggregation of cells. The trait is the distance D the slug migrates before forming a fruiting body. Fitness of the group is a unimodal function of D: too short and the site is poor; too long and mortality rises. The group's D is the median of the desired distances of the cells, and desired distance is a heritable trait of individual cells. Groups are founded by cells from the same locality, so relatedness is high. After dispersal of spores, new groups form from nearby spores, so group traits are heritable.

  **Testability**
  Experiment: Establish groups with manipulated distributions of desired-distance alleles. For example, create groups with the same mean desired distance but different variances, and measure D and fitness. If the group's D is the median, then the fitness depends on the median in a way that cannot be captured by the mean and variance alone. The inclusive-fitness prediction based on average effects would fail, while the multilevel approach can capture the between-group covariance.

  **A. Demography and accounting**
  - Group formation: cells aggregate to form groups of size n (large, say 1000). The aggregation is local, so cells in a group are related.
  - Group trait: migration distance D, taken as the median of the desired-distance alleles of the cells.
  - Group reproduction: after migration, the group forms a fruiting body. Fitness W is the number of spores produced, which is proportional to the number of cells times a function of D: W = n * f(D), with f(D) = exp(-b D) * c (1 - exp(-d D)).
  - Dispersal: spores disperse locally, so new groups form from spores that are from nearby groups. This creates between-group heritability.
  - The currency of fitness: number of spores produced.
  - Generations: one group generation.
  - Held fixed: the function f(D), group size n, and the local relatedness structure.

  **B. The multilevel calculation**
  We use the group-level Price equation. Groups are indexed by i.
  - \( z_i = D_i \)
  - \( w_i = W_i = n f(D_i) \)
  - Between-group covariance: Cov(W_i, D_i) = (1/N_group) sum_i (W_i - \bar{W})(D_i - \bar{D})
  - Within-group covariance is zero because groups are not internally structured for this trait (although they are, but in the group selection approach, we are using group averages and no within-group selection on this trait).
  - The change in mean D: \Delta \bar{D} = (1/\bar{W}) Cov(W_i, D_i)
  - The sign of the covariance depends on the variance in D and the slope of W with respect to D. If the variance is positive and groups with D near the optimum have higher fitness, then if the average D is below the optimum, the covariance is positive; if above, negative.

  **C. The inclusive-fitness calculation**
  Attempt to write Hamilton's rule for an individual cell changing its desired-distance allele. The effect on the group's D is not systematic because the group's D is the median. If the actor's allele is not the median, changing it may not change D. If it is the median, changing it will change D. The cost to the actor: the effect on its own fitness. But the fitness of the actor is not directly affected; only through D. However, the effect on D depends on context. Moreover, the effect on others also depends on context. The standard regression relatedness might not capture the probability that the actor is the median or how much it would change the median. Therefore, the inclusive-fitness calculation breaks down at the step of defining the cost and benefit because the effect of the allele on the group trait is not well-defined for an average actor.

  **D. The divergence**
  The multilevel account predicts that D will evolve to the optimum that maximizes f(D). The inclusive-fitness account cannot make a prediction because it cannot define the cost and benefit in a way that is context-independent. This is a substantive disagreement because the inclusive-fitness framework cannot represent the selection pressure in this case. The gene's-eye view would consider the frequency of the desired-distance allele in the population. The vehicle would be the group for the group trait, but the replicator is the allele. However, the effect of the allele on its own replication depends on the group context in a complex way that may not be captured by the average effect.

  **E. The load-bearing feature**
  The key feature is that the group trait is a median (or any rank-based statistic) of the individual traits, which makes the effect of an individual allele on the group trait discontinuous and context-dependent. If we instead make the group trait the mean of the individual traits, then the effect is linear and inclusive fitness works. For example, if D = mean(desired-distance), then an individual's effect on D is 1/n. Then we can compute the cost and benefit. When we do, both frameworks agree on the prediction.

   defence from the inclusive-fitness side: A sufficiently general class-structured model using the Price equation could in principle decompose the inclusive fitness effect. For example, actors could be classified by whether they are the median or not, and then we could compute the inclusive fitness for each class. However, in practice, this is extremely complex and not done in the literature. Moreover, the class of being the median is not a fixed property but depends on the distribution. Therefore, this defence is theoretically possible but practically not feasible, and it has not been developed. So for all practical purposes, the inclusive-fitness account breaks down.

   We therefore have a case where the accounts come apart.
answer: |-
  **Stage 1: Brainstorm**  
  - **Candidate 1: Slime mold with emergent stalk-height trait.** Groups form by aggregation; stalk height (fitness-affecting) emerges from collective cell behavior. *Fails*: Stalk formation is reducible to individual altruism (cost to stalk cells, benefit to spores), allowing standard inclusive fitness.  
  - **Candidate 2: Colonial tunicate with size-dependent fragmentation.** Groups fragment at threshold size; size affects propagule survival. *Fails*: If size is an average of individual growth rates, inclusive fitness applies via individual effects on size.  
  - **Candidate 3: Yeast clusters with quorum-sensing fragmentation threshold.** Threshold set by collective signal integration; fragmentation timing affects group fitness. *Fails*: If threshold is linear in individual signaling traits, inclusive fitness handles it.  
  - **Candidate 4: Dictyostelium with median-determined migration distance.** Group migration distance (fitness-critical) is the median of individual desired distances. *Wins*: Median is non-linear and non-additive; inclusive fitness cannot assign consistent costs/benefits.  

  **Ruled out designs**:  
  - Public goods game: Trait is individual action (cooperate/defect), not group organization.  
  - Near-zero relatedness: Frameworks agree when relatedness is negligible.  
  - Green beard: Trait is individual recognition, not group property.  
  - Costly group extinction trait: Reducible to individual sacrifice.  

