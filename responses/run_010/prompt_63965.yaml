  But in our multilevel calculation, we used the group fitness W for the group-level Price equation. The group-level Price equation uses W_i as the fitness of the group (number of propagules). Then the change in the group-level trait is driven by Cov(W_i, z_i). This covariance is positive when T is below the optimum (1/a) and negative when above. But at the individual level, the covariance is always negative because w_i is decreasing with z_i.

