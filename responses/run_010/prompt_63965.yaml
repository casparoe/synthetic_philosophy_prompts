prompt: |-
  You are a theoretical evolutionary biologist who also works in the philosophy of biology: you are fluent in the Price equation and covariance decompositions of multilevel selection, and in inclusive-fitness and neighbour-modulated-fitness models including their class-structured and weak-selection generalizations. Please think carefully and work the algebra rather than gesturing at it; wherever I ask for a calculation I want terms written out and signs established, not a report of what the literature tends to say. You may reason entirely from first principles — I do not want a bibliography and no citations are needed.

  **What I am after.** A thought experiment built to specifications, for a seminar on the units-of-selection debate in which students have been told that the multilevel-selection and inclusive-fitness accounts are formally equivalent: two notations for the same underlying process, differing only in bookkeeping and convenience. I want a case that obliges them to test that claim instead of reciting it. The target, therefore, is a scenario in which the two accounts come apart in something more than notation.

  **Stage 1 — brainstorm.** Sketch three or four candidate designs, two or three sentences each, and for each say in one line whether it meets the specification below or fails it. Be explicit about the tempting designs you are ruling out: a public-goods game with altruists and cheaters; a stipulation of zero or near-zero relatedness; a green-beard allele; differential group extinction driven by a trait that is transparently costly to its bearer. For each, say why it is disqualified rather than merely asserting that it is.

  **Stage 2 — develop the winner**, under these specifications.

  - Groups reproduce. The life cycle must include group-level reproduction — fission, budding, or release of multicellular propagules — running over at least two generations, so that group fitness and group heritability are structural features and not rhetoric.
  - The focal trait must be a property of the group's organization — its composition, spatial arrangement, size at fragmentation, or the timing of a collective event — and not a straightforward individual act whose benefits happen to land on neighbours.
  - Relatedness must be derived from the demography you specify, never assumed, and never fixed by fiat.
  - The two accounts must give visibly different verdicts, in one of exactly two senses, and you must say which sense you have delivered: (i) the covariance decomposition predicts the trait increases while a correctly computed Hamilton-style rule for the individual actor comes out negative; or (ii) the inclusive-fitness calculation has no well-defined quantity to evaluate, because some specific step in assigning an actor, a cost, a benefit, or a relatedness regression breaks down — and you can point to the step.
  - Realism. A plausible organism with a real life cycle: a microbe, a slime mould, a social insect, a colonial tunicate, a fungus, or an experimentally evolved line of the multicellular-yeast sort (clusters that grow by retained cell division and fragment above a size threshold, as in lines selected for faster settling). No exotic physics, no invented organisms, no stipulated hypermutation, and nothing requiring an actor to hold information or intentions it could not have.
  - The scenario itself: one paragraph.
  - Testability. After the scenario, state the experiment or field observation that would separate the two accounts, and what result would count against each.

  **Then the demonstration**, in headed sections:

  **A. Demography and accounting.** Group formation, group size, group reproduction, dispersal and mixing between generations, the trait and how it is expressed, the currency of fitness, the number of generations modelled — and, explicitly, what is held fixed across the comparisons you are about to run.

  **B. The multilevel calculation.** Write the decomposition out term by term, with between-group and within-group components separated. State which term carries the selection and its sign. Small integer arithmetic is welcome; show the arithmetic.

  **C. The inclusive-fitness calculation.** Identify the actor or actors, the cost, the benefits to recipients, and the correct relatedness measure for this demography — a regression coefficient, not a pedigree guess. Evaluate the rule. If it cannot be evaluated, name the assumption that fails and the exact step at which it fails.

  **D. The divergence.** State what the two accounts predict differently, or what each can and cannot represent. Then say honestly whether this is a substantive disagreement about the world or a disagreement about which entities are worth describing. Also say what the gene's-eye, replicator-and-vehicle framing makes of the case: if the vehicle here is the group, does that alter any prediction, or only the description?

  **E. The load-bearing feature.** Name the single feature of the case that generates the divergence. Remove or neutralize it, and re-run both calculations far enough to show that they now agree — tell me what the collapse depends on. Finally, give the strongest available defence from the inclusive-fitness side (for instance, that a sufficiently general class-structured or weak-selection formulation absorbs your case; that what you have built is group-level reproduction and so no challenge at all to the individual organism as the locus of selection; or that your relatedness measure is the question-begging element), and adjudicate whether that defence succeeds.

  **Ground rules.** Do not stipulate the verdicts — they must fall out of the calculations. Do not deliver a relabelled textbook case. Do not smuggle the conclusion into the definition of a quantity you then compute with. If, having done Stage 1, you conclude that the specification as written cannot be satisfied because the two frameworks are equivalent on any case of this shape, say so plainly, identify the single constraint that must be relaxed to obtain a real divergence, and build the case under that relaxation.

  Aim for roughly 1,200 to 1,600 words: the scenario in one paragraph, sections A through E clearly headed. No preamble and no restatement of these instructions.
reasoning: |-
  We are to design a scenario where multilevel selection (MLS) and inclusive fitness (IF) approaches yield different predictions or where the IF calculation breaks down. After brainstorming, we select one that meets specifications.

  **Stage 1: Brainstorm**

  Candidate 1: *A slime mold (e.g., Dictyostelium) where stalk formation is controlled by a group-level trait: the fraction of cells that become sterile stalk cells. The group's reproductive success depends on this fraction, but the trait is emergent and not controlled by any individual's decision.*
  - Why it might fail: Relatedness is typically high in such systems (clonal groups) so IF might still work. Also, the trait might be reducible to individual behavior.

  Candidate 2: *A colonial tunicate (e.g., Botryllus) that reproduces by releasing propagules. The group-level trait is the size at which the colony fragments. The size affects both the number of propagules and the survival of the fragments. However, the fragmentation size is determined by a collective process (e.g., resource accumulation) and not by any individual's action.*
  - Why it might work: The trait is a property of the group (fragmentation size) and not an individual act. Relatedness can be variable if there is mixing of genotypes. But we must derive relatedness from demography.

  Candidate 3: *A social insect colony (e.g., ants) where the trait is the caste ratio (workers to reproductives). The colony reproduces by releasing winged reproductives. The ratio is a group-level property and affects the colony's productivity. However, the ratio might be controlled by individual decisions (queen or workers) so it might not be emergent enough.*
  - Why it might fail: The trait is reducible to individual behaviors (e.g., larval feeding by workers) so IF might handle it.

  Candidate 4: *An experimentally evolved multicellular yeast system where clusters fragment at a threshold size. The trait is the threshold size. The cluster grows by cell division and fragments when it exceeds a size determined by the collective (e.g., via quorum sensing). The fragmentation size affects the number of propagules and their survival. If the threshold is determined by the average property of cells (e.g., average adhesion) then it might be reducible. But if the threshold emerges from interactions and is not a simple average, then it might be a group-level trait.*
  - Why it might work: The fragmentation size is a property of the group and not of any individual. We can have genetic variation in the threshold by having different strains. Also, we can design demography with mixing so that relatedness is not fixed.

  **Ruling out:**
  - Public goods game: Trait is an individual act (cooperate/defect) so fails "property of group's organization".
  - Zero relatedness: Then both frameworks might agree (no selection for altruism) but we want a divergence.
  - Green beard: It's an individual trait (recognizing and acting) so not group-level.
  - Differential group extinction with individual cost: The trait is costly to the bearer, so it's an individual act.

  **Winner:** Candidate 2 (colonial tunicate) and Candidate 4 (yeast) are both promising. We choose the yeast system because it is simpler and experimentally tractable.

  **Stage 2: Develop the Winner**

  **Scenario:** Consider a population of multicellular yeast clusters that grow by cell division and fragment when they exceed a threshold size. The threshold size, \( T \), is a heritable property of the group, determined by the collective behavior of the cells (e.g., via the strength of adhesion molecules). Each cluster starts from a single cell (a propagule) and grows until it reaches size \( T \), then fragments into \( k \) propagules (each of size \( T/k \), so \( k \) is the number of propagules per fragmentation). The fitness of a group is the number of propagules it produces. The population is structured: after fragmentation, propagules disperse and form new clusters. There is genetic variation in the threshold \( T \). The life cycle: (1) growth of clusters, (2) fragmentation when size > T, (3) dispersal and formation of new clusters from propagules. We consider two generations: groups in generation 0 produce propagules that form groups in generation 1.

  **Testability:** We can measure the group fitness (number of propagules) as a function of T. We can also measure the change in the frequency of different T alleles. The experiment: Start with a mix of two types of clusters (low T and high T). After one full cycle (growth and fragmentation), count the propagules of each type and see if the frequency of the high-T type increased. The multilevel approach predicts an increase if the between-group covariance is positive and strong enough. The inclusive-fitness approach either predicts the opposite or fails because there is no clear actor performing an action that incurs a cost and provides benefits.

  **A. Demography and accounting**
  - Groups form: each group starts as a single propagule (haploid) and grows by cell division until it reaches size T (the threshold) and then fragments into k = T / s0 propagules, where s0 is the size of a propagule (fixed). We assume s0=1 for simplicity, so k=T. Thus, a group of threshold T produces T propagules. However, there is a cost to larger T: larger clusters take longer to grow and may suffer higher mortality. We model fitness as the number of propagules produced per unit time, so groups with larger T have a longer growth period and thus a lower rate of reproduction. Specifically, the time to reach size T is proportional to T (if growth is linear) or log T (if exponential). We assume linear growth for simplicity: time to grow to size T is c*T (c>0). The fitness of a group is the number of propagules divided by the time taken: W_group = T / (c*T) = 1/c. But this is independent of T! That won't do.

  We need group fitness to depend on T. So let's assume that during growth, there is a constant mortality rate. The probability of survival until fragmentation is an exponential function of time: survival = exp(-d * time). Time is proportional to T, say time = c*T. Then survival = exp(-d*c*T). Then the expected number of propagules is T * exp(-d*c*T). So group fitness W = T * exp(-a*T) (with a=d*c>0). This function has a maximum at T=1/a. We assume genetic variation in T. The trait T is a group-level trait: it is the threshold at which the group fragments. It is determined by the collective properties of the cells (e.g., the average adhesion strength). We model it as a property of the group, and we assume that when a group fragments, the propagules inherit the T of the parent group (i.e., the group trait is perfectly inherited, for simplicity).

  Dispersal: after fragmentation, propagules disperse and form new groups. Each new group is founded by a single propagule (so no mixing). Therefore, groups are clonal: each group is genetically homogeneous because it started from one cell. Hence, within-group relatedness is 1.

  The currency of fitness: the expected number of descendant propagules.

  Generations: We track from generation 0 (groups) to generation 1 (their propagules, which form the next groups). We are interested in the change in the average T over one group generation.

  What is held fixed? We compare groups with different T. The environment (mortality rate a) and the mode of group formation (single propagule) are fixed.

  **B. Multilevel calculation**

  The Price equation for group selection. We have groups indexed by i. Let:
  - \( z_i \): trait of group i (T_i)
  - \( w_i \): fitness of group i (W_i = T_i \exp(-a T_i) \))
  - \( n_i \): size of group i (but since groups are different sizes, but in our case the trait T_i is the group trait, and the fitness is the group fitness (number of propagules, which is T_i times survival).

  The Price equation for the group level only (since there is no within-group selection because groups are clonal) is:
  \[ \Delta \bar{z} = \frac{1}{\bar{w}} \text{Cov}(w_i, z_i) \]

  where \( \bar{w} \) is the average fitness.

  We compute the covariance. We assume two types of groups for simplicity: type A with T=T_A, type B with T=T_B. Let the frequency of A be p, and B be 1-p.

  Then:
  - \( \bar{z} = p T_A + (1-p) T_B \)
  - \( w_A = T_A \exp(-a T_A) \), \( w_B = T_B \exp(-a T_B) \)
  - \( \bar{w} = p w_A + (1-p) w_B \)

  Covariance: 
  \[ \text{Cov}(w,z) = \frac{1}{N} \sum_i (w_i - \bar{w})(z_i - \bar{z}) \]
  For two types:
  \[ \text{Cov}(w,z) = p (w_A - \bar{w})(T_A - \bar{z}) + (1-p) (w_B - \bar{w})(T_B - \bar{z}) \]

  But note that \( T_A - \bar{z} = T_A - [p T_A + (1-p) T_B] = (1-p)(T_A - T_B) \)
  Similarly, \( T_B - \bar{z} = -p (T_A - T_B) \)

  Then:
  \[ \text{Cov}(w,z) = p (w_A - \bar{w}) (1-p)(T_A - T_B) + (1-p) (w_B - \bar{w}) (-p) (T_A - T_B) \]
  \[ = p(1-p)(T_A - T_B) [ (w_A - \bar{w}) - (w_B - \bar{w}) ] \]
  \[ = p(1-p)(T_A - T_B) (w_A - w_B) \]

  Thus, the sign of the change in average T depends on the sign of (w_A - w_B)(T_A - T_B).

  Now, let T_A > T_B. Then the change in T increases if w_A > w_B, and decreases if w_A < w_B.

  The function w(T) = T exp(-aT) has a maximum at T=1/a. So if T_A and T_B are on the same side of 1/a, the direction of selection depends on which is closer to the optimum.

  But we can choose T_A and T_B such that w_A < w_B even though T_A > T_B. For example, set a=1, T_B=1 (so w_B=1*exp(-1)≈0.367), T_A=2 (w_A=2*exp(-2)≈0.270). Then w_A < w_B and T_A > T_B, so (T_A-T_B)>0 and (w_A-w_B)<0, so the covariance is negative. Then the average T decreases.

  Alternatively, if T_A=0.5 and T_B=0.4 (with a=1), then w_A=0.5*exp(-0.5)≈0.303, w_B=0.4*exp(-0.4)≈0.268, so w_A>w_B and T_A>T_B, so covariance positive and T increases.

  So the multilevel selection account predicts that T will evolve to the optimum T=1/a.

  **C. Inclusive-fitness calculation**

  Now we attempt an inclusive-fitness approach. The key is to identify an actor, an action, a cost, and benefits to recipients. However, in this scenario, the trait T is a group-level property. There is no individual action that directly corresponds to setting T. Instead, T is determined by the collective properties of the cells. For example, T might be determined by the average adhesion strength of the cells in the group. But even then, an individual cell does not "decide" the fragmentation threshold. The fragmentation occurs when the group reaches a certain size, which is a consequence of the growth and the adhesion.

  Moreover, the "action" of an individual cell (e.g., producing more adhesion molecules) might affect the group's T. But note: the group's T is a function of the average adhesion of all cells. So if a cell increases its adhesion, it might increase the group's T (if the group T is the average adhesion). But then we can model an individual trait: the adhesion level of a cell.

  But wait: the specification says the trait must be a property of the group's organization and not a straightforward individual act. We built it as a group-level trait. However, if we reduce it to an individual trait, then we are not meeting the specification.

  So we must stick to the group-level trait T. Therefore, in the inclusive-fitness framework, we must assign the action to the group as a whole? But the group is not an individual actor. The inclusive-fitness framework is designed for individual actors.

  Specifically, we cannot identify an actor that performs an action that incurs a cost and provides benefits to others. The fragmentation threshold is not under the control of any single cell. It is an emergent property.

  Therefore, the inclusive-fitness calculation breaks down at the step of identifying the actor and the action. We cannot assign a cost to an individual for the group trait because the trait is not the direct result of an individual action.

  Even if we try to model an individual trait that influences T, note that T is a property of the group. So the effect of an individual's trait on the group trait is diluted by the group size. But in our case, groups are clonal, so all cells have the same trait. Then if we let z_i be the individual trait (adhesion) and the group trait T_i is the same as z_i (since all individuals are identical), then we can try:

  The fitness of an individual in a group is the group fitness divided by group size? But note: the group fitness is W_group = T_i * exp(-a T_i). And the group size at fragmentation is T_i. But the individual in the group produces propagules? Actually, each cell in the group at fragmentation becomes part of a propagule? We assumed each propagule is of size 1, so at fragmentation, the group of size T_i produces T_i propagules, each containing one cell. Therefore, each cell in the group becomes one propagule. So the fitness of a cell (the number of offspring propagules it produces) is 1? But that doesn't account for the survival. The group survival is exp(-a T_i), and if the group survives, each cell becomes a propagule. So the expected fitness of a cell in group i is exp(-a T_i). 

  So the fitness of an individual cell is w_i = exp(-a T_i). But T_i is the group trait. Since the group is clonal, T_i is also the trait of every cell in the group. Therefore, for a cell with trait z (which is the same as T_i for its group), w = exp(-a z).

  Then the change in the average individual trait z is given by the covariance between the individual trait and individual fitness (Price equation at the individual level):

  \[ \Delta \bar{z} = \frac{1}{\bar{w}} \text{Cov}(w_j, z_j) \]

  where j indexes individuals. Since within a group, all individuals have the same z and w, and between groups, they differ, this covariance is the same as the between-group covariance in the group-level Price equation? Let's see.

  The individual-level covariance: 
  \[ \text{Cov}(w_j, z_j) = \frac{1}{N_{ind}} \sum_j (w_j - \bar{w})(z_j - \bar{z}) \]

  But groups have different sizes. Let n_i be the size of group i (which is T_i, but at the time of fragmentation). Then:

  \[ \text{Cov}(w_j, z_j) = \frac{ \sum_i n_i (w_i - \bar{w})(z_i - \bar{z}) }{ \sum_i n_i } \]

  where w_i is the fitness of an individual in group i (exp(-a T_i)), and z_i is the trait of group i (T_i). Note that the denominator is the total number of individuals.

  Compare to the group-level covariance in the group Price equation. The group Price equation used group fitness W_i = T_i exp(-a T_i). But note that the total number of propagules (which become the next generation of individuals) is sum_i W_i. The average individual fitness is:

  \[ \bar{w} = \frac{ \sum_i W_i }{ \sum_i n_i } = \frac{ \sum_i T_i \exp(-a T_i) }{ \sum_i T_i } \]

  The individual-level covariance is:

  \[ \text{Cov}_{ind}(w_j, z_j) = \frac{ \sum_i n_i (w_i - \bar{w})(z_i - \bar{z}) }{ \sum_i n_i } \]

  But w_i = exp(-a T_i) and n_i = T_i. So:

  \[ = \frac{ \sum_i T_i (\exp(-a T_i) - \bar{w}) (T_i - \bar{z}) }{ \sum_i T_i } \]

  Now, the group-level covariance (from the group Price equation) was:

  \[ \text{Cov}_{group}(W_i, z_i) = \frac{ \sum_i (W_i - \bar{W}) (z_i - \bar{z}) }{ N_{group} } \]

  where N_group is the number of groups.

  But note that the individual-level covariance has a denominator of the total number of individuals, while the group-level has the number of groups.

  However, the change in the average trait is:

