  Inclusive fitness requires a different decomposition: the effect of an individual's action on its own fitness (cost) and on others (benefits). But in this case, what is the action? We must define an individual trait. Suppose we let the individual trait be z, which is the same as the group trait T because groups are clonal. Then the fitness of an individual is w = exp(-a z). So the only effect is on self: a cost of having a higher z (since dw/dz = -a exp(-a z) <0). There is no benefit to others. The relatedness to self is 1, and to others is 1 (because clonal), but since there is no effect on others, the inclusive fitness effect is just the cost: -a exp(-a z) <0. Therefore, the inclusive fitness rule would be negative, predicting that z decreases. This matches the multilevel prediction when z is above the optimum (T>1/a). But note: the inclusive fitness calculation does not account for the benefit of having a larger group? In fact, in our fitness function, the individual fitness w = exp(-a z) does not include the fact that a larger group produces more propagules. Why?

