  This is a conflict! And it is because the two frameworks are using different fitnesses: the group fitness (number of offspring groups produced) versus the individual fitness (number of offspring individuals produced). 

  But in the inclusive-fitness framework, we are using the individual fitness. However, the inclusive-fitness framework is typically about individual fitness. So it would predict T=0.

