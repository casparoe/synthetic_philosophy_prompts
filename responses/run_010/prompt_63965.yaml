  ### **Stage 2: The Winner**  
  **Scenario**  
  In the slime mold *Dictyostelium discoideum*, groups (slugs) form by aggregation of ~1,000 cells. The slug's migration distance \(D\) (critical for spore dispersal fitness) is a group-level trait defined as the **median** of the desired distances of its cells, where desired distance is a heritable diploid trait. Groups with optimal \(D\) maximize spore production, but \(D\) is not an average; it depends on the distribution of individual preferences. After migration, groups fruit, producing spores proportional to group size times a fitness function \(f(D)\). Spores disperse locally, forming new groups from nearby spores, maintaining between-group heritability.  

  **Testability**  
  **Experiment**: Create two types of groups:  
  - Type X: Narrow distribution of desired distances (e.g., all cells prefer 10 mm).  
  - Type Y: Bimodal distribution (e.g., half prefer 5 mm, half prefer 15 mm; median is 10 mm).  
  Both have median 10 mm, but Type X consistently achieves \(D = 10\) mm, while Type Y often deviates due to stochasticity in median calculation. Measure spore output.  
  **Result against inclusive fitness**: If Type X outproduces Type Y despite identical median, multilevel selection explains via between-group variance in \(D\) realization; inclusive fitness cannot, as individual effects are undefined.  

  ---

  ### **Demonstration**  
  **A. Demography and accounting**  
  - **Group formation**: Spores aggregate locally into groups of size \(n = 1,000\).  
  - **Group reproduction**: Group fitness \(W_i = n \cdot f(D_i)\), where \(f(D_i) = e^{-0.1 D_i} (1 - e^{-0.2 D_i})\), maximized at \(D_i = 10\) mm. Propagule (spore) number = \(W_i\).  
  - **Dispersal**: Spores disperse within patches; new groups form from local spores, preserving group-trait heritability.  
  - **Trait expression**: \(D_i\) = median of cells' desired distances. Desired distance is heritable (\(h^2 = 0.5\)), with mutations rare.  
  - **Currency**: Expected spore production per group.  
  - **Generations**: One full cycle (group formation to spore release).  
  - **Fixed across comparisons**: Group size \(n\), fitness function \(f(D)\), dispersal locality, and heritability mechanism.  

  **B. Multilevel calculation**  
  Price equation decomposition:  
  \[
  \Delta \bar{D} = \frac{1}{\bar{W}} \left( \text{Cov}(W_i, D_i) + \mathbb{E}[\text{Cov}_j(w_{ij}, d_{ij})] \right)
  \]  
  - **Between-group covariance**: \(\text{Cov}(W_i, D_i) = \mathbb{E}[(W_i - \bar{W})(D_i - \bar{D})]\).  
  - **Within-group covariance**: \(\mathbb{E}[\text{Cov}_j(w_{ij}, d_{ij})] = 0\) (no within-group selection; trait is emergent, not acted on by individuals).  
  With two group types:  
  - Type A: \(D_i = 10\) mm (narrow preference distribution), \(W_i = 1,000 \cdot f(10) = 500\).  
  - Type B: \(D_i = 10\) mm (bimodal distribution), but \(D_i\) realizations vary; assume half achieve \(D_i = 10\) (\(W_i = 500\)), half stray to \(D_i = 9\) or \(11\) mm (\(W_i = 495\) or \(505\)).  
  Mean \(\bar{D} = 10\) mm, \(\bar{W} = 499\).  
  \(\text{Cov}(W_i, D_i) > 0\) (e.g., groups with \(D_i\) closer to 10 have higher \(W_i\)).  
  **Verdict**: Positive between-group covariance drives \(\Delta \bar{D} > 0\) toward optimum.  

  **C. Inclusive-fitness calculation**  
  Attempt to formulate Hamilton’s rule:  
  - **Actor**: A cell altering its desired distance.  
  - **Cost (\(C\))**: Effect on actor’s fitness from changing its preference. None directly; fitness depends only on group \(D\).  
  - **Benefit (\(B\))**: Effect on others’ fitness. Depends on if actor’s preference is the median. If yes, changing it alters \(D\), affecting all cells. If not, no effect.  
  - **Relatedness (\(r\))**: Regression coefficient \(r = \frac{\text{Cov}(d_{\text{actor}}, d_{\text{recipient}})}{\text{Var}(d_{\text{actor}})}\); locally high (~0.6) but irrelevant.  
  **Breakdown**: No consistent \(C\) or \(B\). When actor’s allele is not the median, \(\partial D / \partial d_{\text{actor}} = 0\), so \(B = 0\). When it is, \(\partial D / \partial d_{\text{actor}} = 1\), so \(B \neq 0\). The effect is discontinuous and context-dependent. Hamilton’s rule \(rB > C\) cannot be evaluated as \(B\) and \(C\) are undefined for an average actor.  

  **D. The divergence**  
  - **Multilevel**: Predicts \(D\) evolves to 10 mm via group covariance.  
  - **Inclusive fitness**: Cannot yield a prediction; fails at assigning costs/benefits.  
  - **Substantive disagreement**: Multilevel captures emergent group trait adaptation; inclusive fitness cannot represent selection on median-based traits.  
  - **Gene’s-eye view**: Treats groups as vehicles. Predicts allele frequencies change based on group success, aligning with multilevel. Description differs (vehicle fitness), but prediction matches multilevel.  

  **E. Load-bearing feature**  
  - **Feature**: Group trait is a **median** (non-linear, non-additive) of individual traits.  
  - **Neutralization**: Change trait to **mean** desired distance. Then:  
    - Multilevel: \(\text{Cov}(W_i, D_i)\) still drives adaptation.  
    - Inclusive fitness: \(C = -\partial w_{\text{actor}} / \partial d_{\text{actor}} = 0\) (no direct cost), \(B = \partial w_{\text{others}} / \partial d_{\text{actor}} = \frac{1}{n} \frac{\partial W_i}{\partial D_i} > 0\). Hamilton’s rule \(rB > 0\) holds, predicting trait increase. Both agree.  
  - **Defence from inclusive fitness**: "General class-structured models can absorb this via context-dependent effects."  
  - **Adjudication**: Defence fails. While possible in theory, inclusive fitness lacks tools to compute median-specific relatedness or benefits. The discontinuity makes it intractable for standard regression methods, leaving the case outside practical inclusive-fitness frameworks.  

