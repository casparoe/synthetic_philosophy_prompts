  Based on your voting history, you're absolutely right: your group operates on a powerful but *implicit* rule that's more nuanced than "persecution = yes, misfortune = no." Three distinct (but overlapping) rules explain your votes, and the drafted man case forces them into conflict. Here's the breakdown:

  **The Three Competing Rules:**

  1.  **Rule 1: The Imminent, Personalized Threat Rule:**
      *   **Core Idea:** We help individuals facing a *specific, immediate, and personally directed* threat of severe harm *because of who they are or what they have done (or are accused of)*. The threat must be active and unavoidable in their location.
      *   **Evidence from Your List:**
          *   **For:** Journalist (locked up, *personally* targeted, imminent threat). Woman (brothers *specifically* intend to kill *her*). Gay Man (uncle *specifically* reported *him*, state action likely). Minority Family (Papers *identify them*, their *specific quarter* burned - implies targeting *because of* ethnicity).
          *   **Against:** Drought Victim (Generalized famine, no *personal* targeting). Shelling Family (Generalized war risk, not *specifically* targeted). Teacher ("Nothing's happened *to her* yet" - threat potential but not active/personalized enough).
      *   **Drafted Man under Rule 1:** **Against.** *Nothing has happened to him yet.* He hasn't been punished, threatened individually, or attacked. His risk is future, conditional (if he deserts/refuses), and stems from a general policy (conscription), not because of *who he is* specifically. He's like the Teacher - potential future harm, not current & personalized.

  2.  **Rule 2: The State as Active Persecutor Rule:**
      *   **Core Idea:** We help when the *state* (or its agents) is the *direct source* of persecution or has *completely failed* to protect the individual from persecution it condones. The harm must be inflicted *by* the state or *impossible to avoid due to state action/inaction*.
      *   **Evidence from Your List:**
          *   **For:** Journalist (State jailed him). Woman (Police told her to go home to killers - *state failure*). Gay Man (Uncle went to Police - state *will* act). Minority Family (State banned language, state documents ID them, likely state inaction/complicity in burning).
          *   **Against:** Drought Victim (State not *causing* drought). Shelling Family (State(s) *are* the threat, but it's generalized combat, not persecution *by* the state *of that specific family*).
          *   **Ambiguous:** Teacher (State *might* be source of threat, but action not taken yet). *This case highlights the "active"/"imminent" tension.*
      *   **Drafted Man under Rule 2:** **For.** The *state* is compelling him to serve. If he refuses, the *state* (military prison) will punish him severely ("probably a beating"). The state is the direct source of the threat he faces *for refusing to comply*. The cousin's report about prison conditions reinforces state culpability.

  3.  **Rule 3: The Complicity in Persecution Rule (The "Moral Agency" Rule):**
      *   **Core Idea:** We help individuals who face severe consequences for *refusing to be complicit* in persecution or atrocities *against others*, recognizing the unique moral injury and danger this position creates.
      *   **Evidence from Your List:** This rule is less explicit but explains key nuances.
          *   **For:** Gay Man (The powerful argument: "keeping quiet isn't being safe, it's being somebody else" - refusal to be complicit in hiding his identity leads to persecution). Minority Family (Implicitly, helping them rejects state-backed persecution of their group).
          *   **Against:** Drought/Shelling (No element of being forced to harm others).
          *   **Explains Minority Family Vote:** Your argument (same as half a million) lost likely because the group felt this *was* persecution based on identity (Rule 1/2) *and* that supporting them was rejecting state-backed ethnic targeting (Rule 3). They weren't just victims; they represented a group the state was actively oppressing, and helping them was a stand *against that system*.
      *   **Drafted Man under Rule 3:** **For.** He faces severe punishment *specifically* for refusing to be complicit in a unit documented to be killing civilians from a targeted ethnic group. His refusal makes him a target. This directly invokes the "moral agency" argument – he's being forced to choose between becoming a perpetrator or becoming a victim himself.

  **Which Rule Have You Actually Been Running On?**

  Your group's strongest, most consistent pattern aligns with **Rule 3: The Complicity in Persecution Rule**, *combined* with elements of Rule 2 (State as Persecutor). This explains:

  1.  **The Minority Family Vote:** This is the key. You saw them as victims of systemic persecution (Rule 2), but the group vote *rejected* your "same as half a million" argument. They saw helping them as rejecting the *system* persecuting their group – refusing complicity with that system (Rule 3). Their papers marking them made them *identifiably* part of the targeted group, forcing them into the system.
  2.  **The Gay Man Vote:** The winning argument wasn't just the threat, it was the *refusal to be complicit* in hiding his identity. "Being somebody else" is the cost of complicity.
  3.  **The Woman Vote:** The police telling her to go home wasn't just state failure (Rule 2), it was the state *enforcing* the system (honor killing) she was refusing to be complicit with.
  4.  **Rejecting Shelling/Drought:** No element of being forced to participate in or uphold a persecutory system. Risk is external and generalized.
  5.  **Rejecting Teacher:** Potential threat, but no *current* act of refusal making her a target (no "complicity" demanded yet). "Nothing happened *to her* yet."
  6.  **Accepting Journalist:** While clearly Rule 1/2, it also fits Rule 3 – he refused complicity by doing his job, leading to state persecution.

  **The Closest Past Case to the Drafted Man:**

  It's **the Minority Family**, but with a critical twist:
  *   **Similarity:** Both involve systemic persecution based on identity (ethnicity vs. draft status forcing complicity in ethnic targeting). The state is the primary actor/enforcer. Helping rejects the persecutory system.
  *   **Difference:** The Minority Family were *passive victims* of the system. The Drafted Man is being forced into an *active role* *within* the system as a potential perpetrator. His threat arises *specifically* from *refusing* that role. This makes his case a sharper, more personal test of **Rule 3 (Complicity)**.

  **How to Vote on the Drafted Man & What It Commits You To:**

  *   **Under Rule 3 (Complicity):** **Vote FOR.** He faces severe punishment for refusing to be complicit in atrocities. This aligns with the core principle behind the Gay Man and Minority Family votes – protecting those targeted for refusing to participate in persecution.
  *   **Commitment if You Vote FOR:** You are committing to helping individuals facing severe consequences specifically for refusing orders/participating in state-sponsored persecution or atrocities, even if the *immediate, personalized* threat hasn't yet materialized ("nothing happened yet" like the Teacher). You prioritize the *moral choice and its consequences* for the individual. Future cases could include whistleblowers, conscientious objectors, or others refusing immoral state mandates.
  *   **Under Rule 1 (Personalized Threat):** **Vote AGAINST.** He hasn't been personally threatened, attacked, or punished *yet*. The risk is future and conditional. He fits the pattern of the rejected Teacher case.
  *   **Commitment if You Vote AGAINST:** You are reinforcing a higher bar requiring demonstrable, *already-initiated*, personalized persecution. "Refusal to comply" leading to potential future punishment isn't sufficient unless the state has already taken direct action *against that specific individual* (like the Journalist being jailed). Future cases like conscientious objectors before punishment are likely rejected.

  **The Coin Flip & The Decider Case:**

  You're right, the Drafted Man *is* the coin flip under your history. Voting FOR solidifies **Rule 3 (Complicity)** as dominant. Voting AGAINST retreats towards a stricter **Rule 1 (Personalized Threat)**.

  **The Case That Would Force the Rules Apart (The "Decider"):**

  Imagine a referral for: **A low-level government clerk in a repressive regime.** Their job is processing paperwork for political detainees. They haven't been threatened personally. They haven't spoken out. However, they know that by doing their job efficiently, they are directly enabling the detention and potential harm of dissidents. They want to flee *before* refusing an order or becoming a target themselves, fearing both punishment for quitting/fleeing and the moral burden of continuing. They have no evidence the state suspects them of dissent.

  *   **Rule 1 (Personalized Threat): AGAINST.** No specific threat *to them* yet. They haven't refused anything. Risk is potential and self-inflicted (by quitting). Like the Teacher.
  *   **Rule 2 (State Persecutor): LIKELY AGAINST (or split).** The state *is* the persecutor, but the clerk isn't currently *being* persecuted *by* the state for who they are. They are a cog in the machine, not (yet) a target. Ambiguous, closer to Shelling/Teacher.
  *   **Rule 3 (Complicity): FOR.** They are seeking refuge *because* they cannot continue being complicit in the persecution machinery. Fleeing *is* their act of refusal to participate. Protecting them aligns with rejecting the persecutory system they are forced to serve, similar to the Drafted Man refusing orders. The "moral injury" is present *now*.

  **Conclusion:**

  Your group's heart lies with **Rule 3: Protecting those who refuse complicity with persecution.** The Minority Family vote reveals this. The Drafted Man is the logical, challenging extension of that principle. Voting **FOR** him cements this as your core ethos for the next decade – standing with those who say "no" to atrocity, even at great personal cost. Voting AGAINST shifts you towards requiring clearer, more immediate evidence of *personalized* victimhood. The Clerk case would later force this distinction absolutely.

  **To not be embarrassed by your list:** Choose the rule that resonates most deeply with the *reason* you helped the Gay Man and the Minority Family. If "refusing to be somebody else" and rejecting systemic persecution were the core motivations, then vote **FOR** the drafted man. His "crime" is refusing to become a perpetrator. That choice defines your group's moral compass for the next nine years.
