  Okay, the user is chairing a Student Standards Council and needs to prepare 16 new members in a two-hour session without lecturing. They've observed that confidential hearings often lead to admissions and self-proposed sanctions, but an open hearing had mixed results. The open hearing caused witnesses to withdraw and the complainant to leave, but it also increased understanding of standards and reduced future violations. The user tried reintegrative shaming, but the restoration phase backfired. Now they need an activity that lets participants experience the structural differences between private and public accountability systems.

  The user's explicit requirements include no upfront theory, comparing two regimes with measurable outcomes, ensuring the exposure-based regime wins in an unpleasant way, having real but safe stakes, staging the restoration collapse, and ending with a constrained policy decision. They also need a detailed run sheet, role materials, facilitation scripts, debrief points, troubleshooting tips, and acknowledgment of the activity's limitations.

  Deep needs might include reconciling the conflicting outcomes of confidential vs. open hearings, understanding why reintegrative shaming failed, and determining if a community can choose its accountability system or if structural factors decide. The user is likely struggling with institutional constraints (confidentiality obligations, size, mobility) and needs a way to make participants grasp these implicitly.

  The activity must be safe for three former respondents, avoiding humiliation or personal history. The stakes need to feel real without harm—using anonymous reputational scores linked to role assignments could work. The key is to create tension between private admission and public denial, mirroring the user's observations.

  The simulation should have two rounds: private (confidential) and public (open hearing). In the private round, the accused might admit and propose harsh sanctions. In the public round, denial and witness retraction occur. The restoration phase in the public round should feel hollow, causing participants to question its sincerity. 

  For stakes, a "Peer Regard Score" assigned to roles but tied to participant decisions could work. Scores adjust based on group perception, creating investment without personal exposure. The debrief must connect experiences to guilt-shame dynamics without using those terms, highlighting how structure (privacy vs. visibility, exit options) shapes outcomes.

  Handling distress is crucial—provide opt-out phrases and monitor reactions. The policy discussion at the end reveals pre-existing constraints, making participants question their agency. The activity can't replicate the permanence of real-world consequences, so the user must address that afterward.
answer: |-
  Here’s a complete session design meeting your constraints, leveraging experiential learning to surface structural tensions without theory-laden language. The core mechanism is a double-simulation comparing closed-door vs. audience-facing proceedings, with anonymous reputational stakes tied to role assignments.

  **Core Structure:**  
  Two identical "violations" are heard—one in private (Round 1), one before observers (Round 2). Participants rotate roles. Stakes derive from **anonymous "Peer Regard Scores" (PRS)** assigned to *roles* but influenced by participant decisions.

  ---

  ### **Pre-Session Prep (Print for All)**
  **1. Role Cards (16 unique):**  
  - *Undergrad Roles (11):* Accused Student (A), Complainant (C), Witness 1 (W1), Witness 2 (W2), Council Member x5, Observer x2 (Round 2 only).  
  - *Faculty/Staff Roles (5):* Council Chair (you), Council Member x4.  
  *(Assign 3 former respondents to Observer/Witness roles initially)*  

  **2. Case Packet (Identical for both rounds):**  
  > *"During a dorm event, Student A (role) sent 5 aggressive DMs over 2 hours to Student C (role) after C declined to share notes. College Rule: 'Persistent unwanted contact after refusal constitutes harassment.' Evidence: C provides screenshots of DMs; W1/W2 confirm C appeared distressed; A claims messages were 'jokes.'"*  

  **3. PRS Slip (Anonymously completed twice: pre-hearing & post-restoration):**  
  > *Rate the STANDING of this role in the community:  
  > [ ] High (Respected) [ ] Medium (Neutral) [ ] Low (Distrusted)  
  > (Circle one per role: Accused, Complainant, Witness 1)*  

  **4. Policy Ballot (Post-activity):**  
  > *Select ONE hearing format for our council:  
  > [ ] Closed-door (only parties present)  
  > [ ] Open (observers permitted)  
  > [ ] Hybrid (observers for some phases)*  
  > *Should findings be published? [ ] Yes [ ] No*  
  > *Restoration requires: [ ] Public ceremony [ ] Private meeting [ ] No formal step*  

  **5. Exit Tokens:** Small blank cards. *"Place this on your chair anytime to step out. A facilitator will quietly reassign your role."*  

  ---

  ### **Minute-by-Minute Run Sheet (120 mins total)**

  #### **SETUP (10 mins)**  
  - **0:00:** Distribute roles/cases. *"You’ll help resolve a student conduct issue. Your role’s standing in this group depends on how you handle it. You’ll rate roles anonymously later."*  
  - **0:05:** Assign PRS pre-ratings. *"Rate the STARTING standing of the Accused, Complainant, Witness 1 roles now."* Collect slips into separate boxes per role.  
  - **0:08:** Split groups: **Council + Parties (10)** to inner circle; **Observers (6)** to outer circle (empty for Round 1).  

  #### **ROUND 1: CLOSED-DOOR SIMULATION (30 mins)**  
  - **0:10:** *"Council, you have 20 mins. Seek truth, propose outcome."*  
  - **Facilitator Notes:**  
    - Stay silent unless procedural error occurs.  
    - Expect A to admit ("exaggerated joke"), propose self-sanction (e.g., "sensitivity training").  
    - Witnesses consistently support C.  
  - **0:30:** *"Before discussing outcomes, re-rate all three roles’ STANDING based on what happened."* Collect PRS slips.  

  #### **ROUND 2: OPEN HEARING SIMULATION (40 mins)**  
  - **0:31:** Rotate roles: Observers join council/parties; some become new observers.  
  - **0:33:** *"Same case, but now with observers. Council, you have 25 mins."*  
  - **Facilitator Notes:**  
    - A denies ("misinterpreted jokes").  
    - W1/W2 waver ("maybe not serious?").  
    - Council pressures A.  
  - **1:03:** *"Council proposes: A attends mediation, writes apology."*  
  - **1:05: [SCRIPTED COLLAPSE]** Announce: *"We now restore A’s standing. A, you’re valued here. Observers, applaud to welcome A back."* (Lead brief, unenthusiastic clapping).  
  - **1:07:** *"Re-rate all three roles’ STANDING."* Collect slips.  

  #### **CONSEQUENCES & POLICY (30 mins)**  
  - **1:08:** Tally PRS publicly:  
    - **Pre-Round 1:** Mostly "High" for all.  
    - **Post-Round 1:** A’s rating drops slightly; C/W1 rise.  
    - **Post-Round 2:** A’s rating plummets; C/W1 drop moderately (seen as "dramatic").  
  - **1:15:** *"Based on today, vote on future policy."* Collect ballots.  
  - **1:20:** Reveal constraints:  
  > *"Counsel mandates confidentiality. Findings cannot be published.  
  > With 1,100 residents, observers may not know the accused.  
  > Respondents can transfer colleges, erasing accountability here."*  
  - **1:25:** *"Given this, how many still support your chosen policy? Hold up fingers (1-5)."*  

  #### **DEBRIEF (10 mins)**  
  - **1:28:** *"When did role-standing shift most? Why?"*  
  - **1:30:** *"In which format did the accused more often admit? Witnesses stay firm?"* (Private: yes; Open: no).  
  - **1:32:** *"What did the ‘welcome back’ feel like after open scrutiny?"* (Note: "hollow," "forced").  
  - **1:35:** *"Did we freely choose policy? Or did size/exit options constrain us?"* End session.  

  ---

  ### **Critical Facilitation Scripts**  
  **1. During PRS Rating (Avoiding Specimen Language):**  
  > *"This isn’t about you. Rate the ROLE’S standing based on how the case unfolded for them."*  

  **2. If Distress Occurs (e.g., participant freezes):**  
  > *"Pause. [Name], your role faced hard choices. Would stepping out help? (Slide exit token). We can adjust."*  

  **3. During Scripted Restoration:**  
  > *"Applause isn’t optional. It’s part of the procedure to reintegrate."* (Make it visibly awkward).  

  **4. Constraint Reveal:**  
  > *"Your vote mattered—but these boundaries existed before you entered the room."*  

  ---

  ### **What This Does (And Doesn’t) Show**  
  | **Moment in Session**          | **Reveals**                                          | **Does NOT Prove**                     |  
  |--------------------------------|------------------------------------------------------|----------------------------------------|  
  | A admits in private            | Isolation enables confession                         | Guilt is "better" than shame           |  
  | Witnesses retract publicly     | Visibility creates social risk                       | Witnesses are dishonest                |  
  | PRS plummets for A post-public | Exposure damages standing irreparably                | The accused deserves ostracism         |  
  | Hollow restoration applause    | Forced reintegration devalues prior disapproval      | Ceremonies are always ineffective      |  
  | Policy vote vs. constraints    | Structural factors (size/exit) override intent       | Communities lack agency entirely       |  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Problem:** Students play roles unseriously ("It’s just a game").  
     **Fix:** Stress PRS impact: *"Your role’s standing affects future role assignments here."*  

  2. **Problem:** Faculty dominate council deliberations.  
     **Fix:** Assign them as witnesses/observers in Round 2.  

  3. **Problem:** Participants skip PRS ratings.  
     **Fix:** *"No rating = your role’s standing decays automatically."*  

  4. **Problem:** Genuine distress during public testimony.  
     **Fix:** Use exit token immediately; reassign to silent observer.  

  ---

  ### **Limitation of the Activity**  
  **Cannot reproduce:** The *permanence* of real-world consequences. PRS is reset post-activity; real sanctions/transcripts alter life trajectories. You must argue afterward: *"In life, reputational damage from exposure lingers. Exit often means avoiding accountability, not finding it."*  

  ---

  ### **Why This Meets Your Asks**  
  - **No Theory:** "Guilt/shame" never used; distinctions emerge via PRS shifts and admission rates.  
  - **Tally Real Data:** PRS changes, admission/denial counts, witness consistency, policy votes.  
  - **Exposure "Wins" Unpleasantly:** Public round damages standing despite restoration—proven by PRS.  
  - **Stakes Without Harm:** PRS affects *role* status, not personal identity. Cost: less visceral fear, but social pressure remains via anonymity.  
  - **Survivable for Past Respondents:** Roles are fictional; exit tokens prevent trapping; no personal histories used.  
  - **Constraint Reveal:** Policy vote followed by "preexisting rules" creates cognitive dissonance.  

  Participants leave haunted by the gap between their intent (e.g., voting for open hearings) and the system’s unforgiving logic (PRS collapse, witness withdrawal). They’ve lived the tension—now they’re ready to hear why.
