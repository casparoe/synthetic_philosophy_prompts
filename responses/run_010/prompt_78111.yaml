prompt: |-
  Our reading group keeps having the same argument every few weeks and I've finally realised it's three different arguments wearing a trench coat. It's a mixed room — two philosophers, some ML people who came at this via the AI-risk coherence argument literature, an economist who thinks the whole thing is trivially settled, and me. Whenever the topic comes up, half the room says they're 'sceptical about von Neumann-Morgenstern' and they turn out to mean wildly incoherent things by that phrase (sorry), so I want to sort people before we talk.

  Write me a decision tree, maybe six to eight branch questions and eight or nine leaves, that takes someone from a starting point everybody in the room already accepts — something like: an agent whose choices across a sequential problem violate transitivity can be made to hand over a predictable amount of money for nothing — to a named position on what, if anything, coherence arguments establish about rational agents. Every branch node has to be a question someone can answer honestly without knowing which leaf it leads to, and phrased as a case or a claim rather than a label; no node should read 'do you accept the strong programme?'.

  The leaves I want the tree to be able to reach:

  - the constitutive view, where being coherent is part of what makes something an agent at all, so an incoherent thing isn't a badly reasoning agent but not an agent;
  - the underdetermination sceptic, who points out that plenty of formally distinct numerical structures can represent one and the same preference ordering, so the representation theorems don't pin down anything as substantive as expected utility;
  - the diachronic/money-pump pragmatist, who thinks the whole force of the argument is in repeated choice and vanishes if you deny that;
  - the selection view, where incoherent agents simply get drained and what's left looks coherent — a claim about populations rather than about norms;
  - the bounded/fast-and-frugal position, where the coherence norms presuppose capacities (a complete ordering over a rich enough gamble space, say) that no actual agent has;
  - the 'preferences aren't the fundamental thing' position, which says the theorems smuggle in a preference ordering and that assumption does all the real work;
  - the position that coherence is fine but expected utility specifically isn't the unique coherent option — rank-dependent and risk-weighted views live here;
  - and the eliminativist who thinks the entire exercise is a philosopher's toy with no grip on real agents.

  Two extra requirements. First, the axis my room slides past constantly, so please build it into the tree rather than leaving it as an aside: whether the conclusion of a coherence argument is supposed to be about what the agent is disposed to choose, about what the agent is already committed to by its own attitudes, or about what a describer is licensed to attribute to the agent. Those are three different claims and people swap between them mid-sentence. Second, flag any pair of leaves the tree genuinely can't separate — I suspect the selection view and the constitutive view are indistinguishable from the inside, and if that's wrong tell me so — and mark which cells of the logical space come out empty and why. Is nobody there because the combination is incoherent, because it's unattractive, or because no one's bothered? I'd particularly like to know whether you can hold that preferences aren't fundamental and still think coherence is constitutive of agency, since that looks like a live option to me.

  Then a short note at the end separating what's actually settled among people who work on this from what's contested — I don't want the tree quietly installing one side of a live dispute as the textbook default, so if a branch point is itself disputed, say so at the branch rather than only in the note. British English throughout, please.
reasoning: |-
  Hmm, the user is running a reading group that keeps getting stuck on arguments about decision theory coherence, specifically around von Neumann-Morgenstern. They've realized it's actually three different arguments disguised as one. The group has diverse members: philosophers, ML people with AI-risk backgrounds, an economist who thinks it's trivial, and the user themselves.

  They want me to create a decision tree to help clarify positions. The tree should start from a point everyone accepts—like how intransitive preferences can lead to predictable money loss—and branch out to eight named positions about what coherence arguments show. Positions include constitutive views, underdetermination scepticism, pragmatism, selection theory, bounded rationality critiques, preference fundamentalism critiques, non-EU coherence options, and eliminativism.

  Key requirements: 
  - Every branch must be a concrete case/claim question answerable without knowing the outcome
  - Must address the agency/dispositions/attributions axis explicitly 
  - Should flag indistinguishable positions and empty logical spaces
  - Needs a note separating settled vs contested points
  - British English required

  The core confusion seems to be about what coherence arguments actually prove: whether they're about dispositions, commitments, or attributions. The tree needs to force clarity on this at each relevant branch. 

  I'll start with the money-pump case since it's uncontroversial, then branch on:
  1. Whether the loss scenario reveals existing commitments or just bad dispositions
  2. Whether preferences are fundamental or constructed
  3. Whether synchronic coherence matters without repetition
  4. Whether representation theorems uniquely determine utility
  ...etc.

  For the indistinguishable positions note: constitutive vs selection views might look similar phenomenologically but differ metaphysically. The "preferences not fundamental + constitutive agency" combo seems coherent if we think coherence manifests in other ways.

  In the settled/contested note, I'll clarify that money-pumps exposing vulnerability are widely accepted, while claims about constitutive agency remain hotly debated. Representation theorem interpretations are also contentious.

  The tree will have 7 questions leading to 8 leaves, with some branches sharing endpoints where positions overlap. I'll make sure British spellings are used consistently throughout.
answer: |-
  Here's a decision tree designed to clarify positions on decision-theoretic coherence arguments, starting from the uncontested money-pump vulnerability and branching through key conceptual distinctions. It explicitly incorporates the "agency/dispositions/attributions" axis and flags indistinguishable positions/empty cells.

  **Decision Tree: Coherence Arguments & Rational Agency**

  **Start:** Everyone accepts that an agent with intransitive preferences (e.g., A > B, B > C, C > A) can be offered a sequence of choices where they pay a predictable sum to end up with what they started with.

  1.  **Does the money-pump scenario primarily reveal...?**
      *   **(A) A *disposition* within the agent that predictably loses money?** (The agent is *prone* to being pumped).
      *   **(B) An *inconsistency within the agent's existing commitments*?** (The agent's own attitudes *already* contradict each other).
      *   **(C) A limitation on how we can *consistently describe* the agent's choices?** (We cannot construct a single, coherent model *attributing* stable preferences to them).

  2.  **For (A) Disposition: Is the vulnerability *only* exploitable in sequential, repeated interactions?**
      *   **(Yes) → Leaf: Diachronic/Money-Pump Pragmatist.** Coherence arguments only show a *practical vulnerability* to exploitation *over time*. If you avoid repeated choices or strategically "lock yourself in," the force vanishes. Normativity is purely instrumental (avoiding exploitation).
      *   **(No) →** The vulnerability exists even in a single, suitably complex choice (e.g., involving state-contingent contracts or multiple goods). *Go to Q3.*

  3.  **For ("No" on Q2) or (B) Commitments: Are the agent's *preferences* the fundamental building blocks of their agency/attitudes?**
      *   **(Yes) →** *Go to Q4.*
      *   **(No) → Leaf: 'Preferences Aren't the Fundamental Thing'.** The representation theorems *assume* a complete, ordered preference structure as input. This assumption smuggles in the coherence; the theorems just show that *if* you have coherent preferences, you can represent them numerically. The real foundational attitudes might be beliefs, desires, plans, rules, etc., and preferences are a (potentially incoherent) *output* of deliberation, not the input. Coherence arguments don't reach these fundamentals.

  4.  **For (Yes on Q3) or (C) Attributions: Do you think the *only* coherent way to represent preferences meeting the axioms is via Expected Utility (EU) with a unique probability/utility (up to affine transforms)?**
      *   **(No) → Leaf: Underdetermination Sceptic.** The representation theorems show *a* numerical structure exists, but multiple distinct structures (e.g., different probability/utility pairs, non-EU forms like Rank-Dependent Utility (RDU) or Risk-Weighted Utility if they satisfy axioms) can represent the *same* preference ordering. Nothing pins down EU as uniquely "real" or substantive.
      *   **(Yes, or mostly yes for EU) →** *Go to Q5.*

  5.  **For (Yes on Q4) or direct from Q1(B/C): Does the *inability* to represent choices coherently (e.g., via EU) imply...?**
      *   **(i) The entity simply *isn't an agent* (in the relevant normative sense) at all?**
      *   **(ii) The entity *is* an agent, but one violating norms it *should* follow?**
      *   **(iii) We, as describers, *cannot usefully model* it as a coherent agent?**

  6.  **For (i) 'Not an Agent': Is the 'disappearance' of incoherent agents primarily...?**
      *   **(a) A *metaphysical/conceptual* claim about what agency *is*?** (Coherence is constitutive).
      *   **(b) An *empirical/evolutionary* claim about what *persists*?** (Incoherent agents get drained).
      *   **→ Leaf: Constitutive View (if a).** Incoherence isn't *bad agency*; it's the *absence* of agency proper. Agency is defined by the capacity for coherent (representable) choice. An incoherent chooser is like a "fool's agent".
      *   **→ Leaf: Selection View (if b).** Coherence norms aren't constitutive of agency itself, but describe what *succeeds* in competitive environments. Incoherent agents *do* exist but get pumped out of existence/populations. What's left *looks* coherent. This is about population dynamics, not individual norms. *⚠️ **Note:** The Constitutive View (Q6a) and Selection View (Q6b) are often *phenomenologically indistinguishable* from the agent's internal perspective or an observer's snapshot. Both predict only coherent agents are observed. The difference is metaphysical: is coherence *essential to being* an agent, or just *essential to surviving* as one?*

  7.  **For (ii) 'Should Follow Norms': Do you think actual agents have the cognitive capacity to form the rich, complete preference orderings over complex gambles required by the axioms?**
      *   **(No) → Leaf: Bounded/Fast-and-Frugal.** Coherence norms presuppose unrealistic cognitive capacities (e.g., forming complete orderings over vast state-spaces, perfect probabilistic reasoning). Actual agents use simpler, "good enough" heuristics that predictably violate coherence under pressure but are robust overall. EU is a poor *descriptive* model.
      *   **(Yes, in principle) →** *Go to Q8.* (Or simply accept the standard normative view).

  8.  **For (iii) 'Cannot Model' or (Yes on Q7): Do you think the entire framework of representing choices via numerical probabilities and utilities is fundamentally misguided for capturing real agency?**
      *   **(Yes) → Leaf: Eliminativist.** The VNM/EU framework is a philosopher's toy model detached from the messy reality of human (or artificial) cognition, motivation, and context. "Coherence" within this narrow formalism has no grip on real rationality. Alternative frameworks (neural, ecological, symbolic) are needed.
      *   **(No) →** *You likely hold the standard textbook normative view that coherence (satisfying the axioms) is a requirement of rationality, representable by EU. However, note that position might also land at **Leaf: Coherence ≠ EU Uniqueness** if your answer to Q4 was "No".*

  **Leaf: Coherence ≠ EU Uniqueness (Alternative from Q4):** Coherence (satisfying the axioms) *is* a rational requirement, but it doesn't *uniquely* mandate Expected Utility. Alternative numerical representations (like Rank-Dependent Utility or other non-expected utility models satisfying the axioms) are equally coherent ways to represent rational preferences, potentially better capturing phenomena like risk aversion.

  ---

  **Key Distinctions & Empty Cells:**

  1.  **Agency Axis Explicit:** Q1 explicitly forces a choice about the *nature* of the money-pump conclusion (Dispositions, Commitments, Attributions). This distinction recurs implicitly in later branches (e.g., Q5, Q6).
  2.  **Indistinguishable Positions:** As flagged under Q6, the **Constitutive View** and **Selection View** predict the same observable outcome (only coherent agents exist/are seen) but differ in their metaphysical explanation. From "inside" the system, they are hard to separate; the difference lies in the *reason* for coherence.
  3.  **Empty Cells & Why:**
      *   **Preferences Not Fundamental + Constitutive Agency:** *This is a coherent and potentially live option.* One could hold that agency is constituted by coherence in its *fundamental* attitudes (e.g., plans, commitments, beliefs/desires), and that *preferences* are a derivative construct that *should* reflect this underlying coherence but might not always do so cleanly. The coherence argument might apply to the fundamental level. (Path: Q1B/C → Q3 No → Q5i → Q6a).
      *   **Preferences Not Fundamental + *Requires* EU Uniqueness:** *Incoherent.* If preferences aren't fundamental, arguing that *their* representation *must* be uniquely EU is nonsensical. The whole point of this leaf is that the preference structure itself is derivative and non-unique. (Path from Q3 No to Q4 Yes is logically blocked).
      *   **Eliminativist + Any Specific Coherence Norm:** *Incoherent.* The Eliminativist rejects the entire framework. They wouldn't endorse *any* specific coherence norm within it (like RDU). (Path to Q8 Yes is terminal).
      *   **Bounded Rationality + Constitutive Agency:** *Possible but strained.* One could argue that agency is constituted by *bounded* coherence, but the standard constitutive view leans towards idealisation. It's more natural for bounded rationalists to land at Q5ii or Q8. (Path: Q1A/B → Q3 Yes → Q4 Yes/No → Q5ii → Q7 No).
      *   **Selection View + Attributions (Q1C):** *Unattractive/Empty.* The Selection View is an empirical claim about why agents *are* coherent. The Attribution view (Q1C) is about descriptive modelling. While logically possible to combine ("We see coherent agents because the incoherent ones died out, and we model the survivors with EU"), it misses the core of the Selection View's *explanation* (dynamics) and the core of the Attribution view's *concern* (model construction). The Selection View naturally aligns with Q1A/B.

  **Settled vs. Contested: A Brief Note**

  *   **Widely Settled (Among Specialists):**
      *   The money-pump (and related Dutch book) arguments *do* show that agents violating basic coherence axioms (like transitivity or ordering) are vulnerable to predictable exploitation in certain structured choice scenarios. (This is the uncontested starting point).
      *   The VNM (and Savage etc.) representation theorems are mathematically sound: satisfying specific sets of axioms is necessary and sufficient for preferences to be representable by *an* expected utility function (or similar structure for non-EU). *However, the interpretation of this result is contested.*
      *   Actual human choice behaviour frequently and systematically violates VNM axioms (Allais paradox, Ellsberg paradox, framing effects). EU is a poor *descriptive* model.

  *   **Hotly Contested:**
      *   **The Normative Force:** Is avoiding money-pumps a *definitive* requirement of rationality, or merely a pragmatic concern? (Branch point: Q2).
      *   **Foundational Status of Preferences:** Are preferences the fundamental determinants of choice, or are they constructed from other attitudes? (Branch point: Q3 - This underpins much disagreement).
      *   **Uniqueness & Substantiveness:** Does the representation theorem uniquely identify probabilities/utilities (or EU) as "real" psychological entities, or just provide *a* compatible numerical structure? (Branch point: Q4 - The core of underdetermination scepticism).
      *   **Constitutive Agency:** Is coherence literally *part of what it is* to be an agent, or just a norm for good agency? (Branch point: Q5i vs ii - A major philosophical divide).
      *   **Scope of Norms:** Do coherence norms apply to idealised agents only, or to bounded ones? If to bounded ones, how should they be modified? (Branch point: Q7).
      *   **The Whole Enterprise:** Is the formal decision-theoretic framework at all relevant for understanding real agency? (Branch point: Q8 - Eliminativism vs. others).

  This tree forces clarity on the key distinctions causing your group's confusion, particularly the foundational role of preferences and the nature of the coherence conclusion (disposition/commitment/attribution). It highlights where disagreements are fundamental (e.g., Q3, Q5, Q8) versus where they might be resolvable by clarifying terms. Good luck with the discussion!
