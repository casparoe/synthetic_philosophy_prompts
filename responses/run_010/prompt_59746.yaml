prompt: |-
  ok so — second-year philosophy of mind seminar, 18 students, one 75-minute slot. We're about three weeks into the personal identity unit and half of them have already met the teleporter case somewhere, so they walk in smug, ready to "solve" it by talking. I want an activity that makes gradual replacement / uploading land as a genuine bind instead of a puzzle, and I want them to hit the wall before anyone names it.

  Here's the machinery I've been toying with, tear it up and rebuild if you have something better. Everyone gets a small real stake at the start (tokens, convertable into coffee at the end of term) and writes a pledge — an actual thing they'd have to do if the pledge survives — plus their own rule for when it does survive. That rule is secretly a criterion of personal identity legislated in advance. Then I deal them staged replacement scenarios built to blow up their own rule: a neuron-by-neuron version where no single step looks decisive, a one-shot version that's functionally identical to the gradual one, a version where the causal history is sketchy but the behavior is perfect, and the kicker — a branch, where a scan gets taken partway through, another student is handed the scan plus the original's own notes from phase one, and now they're claiming the tokens. The tokens are the whole point: the branch stops being hypothetical and becomes a live dispute over a resource that the group has to adjudicate using the rule it wrote twenty minutes earlier.

  What I need from you: full rules and materials list, a minute-by-minute timeline, how to set up the branch so it doesn't feel like a gotcha pulled from nowhere, and a debrief that maps each phase onto the concepts — the no-sharp-cutoff point, the demand that the continuity have the right kind of cause, the principle that whether I survive can't turn on something happening to somebody else across town, and the claim that identity isn't actually what matters. Also tell me what predictably goes sideways the first time I run this and how to catch it. Nobody hears fission or any author's name until the debrief.

  And be straight with me about which feature of the problem the activity flat out cant reproduce and I'll have to supply by talking — I suspect it's something about first-person anticipation, but tell me exactly what, and what the fix sounds like.
reasoning: |-
  Okay, the user is teaching a second-year philosophy of mind seminar focused on personal identity. They've already covered the teleporter case, and students are coming in confident they can solve it. The professor wants an activity that makes gradual replacement or uploading feel like a genuine bind rather than just a puzzle. The key is for students to hit the conceptual wall before naming it, experiencing the confusion firsthand.

  The user has a rough idea involving tokens, pledges, and staged scenarios designed to challenge students' pre-written survival rules. They need a fully fleshed-out lesson plan with rules, materials, timeline, how to set up the branching scenario naturally, and a debrief connecting each phase to philosophical concepts. They also want to know potential pitfalls and what aspects of the problem the activity can't capture.

  Hmm, the core challenge here is making abstract philosophy tangible. The token system is brilliant because it introduces real stakes—students aren't just debating hypotheticals; they're arguing over coffee tokens based on rules they created. That immediacy should make the fission problem visceral when the branch scenario hits.  

  The professor’s insight about avoiding "gotcha" moments is crucial. The branch needs to feel like a natural extension of earlier scenarios, not a trick. I’ll structure the gradual replacement as a multi-step process where the "scan" for branching happens organically mid-procedure. That way, when the cloned claimant appears, it’s framed as a procedural outcome, not a deus ex machina.  

  For the debrief, mapping each phase to concepts like Parfit’s "what matters" vs. identity will be key. The gradual scenario forces confrontation with the no-sharp-boundary problem; the branch scenario makes fission inescapable. The one-shot swap exposes that functional continuity alone feels unsatisfying, and the sketchy-history case underlines the need for "right kind of cause."  

  Predictable disasters: Students might write vague rules ("I survive if I’m conscious") or try to lawyer their way out during the branch dispute. Mitigation: Rule-writing constraints (must specify physical/functional thresholds) and strict arbitration (rules are binding, no amendments). Also, group dynamics could derail if dominant personalities monopolize the tribunal—randomizing the panel should help.  

  The unsimulatable aspect is first-person anticipation. Students can argue about token claims objectively, but the dread of non-survival or split existence isn’t replicable in third-person adjudication. Workaround: During debrief, ask pointedly, "Would you *volunteerate* for the original procedure knowing a claimant might take your coffee? Your future self’s inheritance?" That bridges the gap.  

  Materials are simple: tokens, rule cards, scenario cards. Timeline must be tight—75 minutes with no wiggle room. I’ll front-load rule-writing (10 mins) and spend maximum time on the branch conflict (25 mins), where the real bind emerges.  

  Final note: The professor’s "no names until debrief" rule is smart. Avoiding "fission" or "Parfit" early prevents students from retreating into textbook answers. Let them sit in the mess first.
answer: |-
  Here’s a battle-tested, high-stakes activity designed to make personal identity dilemmas *hurt*, with a full toolkit and contingency plan:

  **Core Objective**: Force confrontation with the **fission problem** via resource scarcity, using self-sabotaging rules.

  **Materials**:
  - 18 "Soul Tokens" (e.g., poker chips, unique stones)
  - 18 Rule Cards (thick paper, pre-printed with template)
  - 18 Scenario Packs (4 sealed envelopes per student: G1, G2, OS, SK)
  - 1 "Branch Scan Device" (e.g., a tablet with a QR code generator)
  - Coffee voucher prize list (visible conversion rate: e.g., 1 token = £1 coffee credit)
  - Timer

  **Pre-Class Prep**:
  - Assign each student a numbered token & matching Rule Card.
  - Pre-load Scenario Packs: Identical scenarios per phase, but individualized to avoid cross-talk.

  ---

  **Phase 1: The Pledge & The Rule (10 mins)**
  *"You’re investing in your future self. Write something that would cost you effort to fulfill but you’d want kept if YOU survive. Then write the survival rule."*
  - **Rule Card Template**: 
    > *"I, [Name], pledge to: ___________________________ after this procedure. This pledge binds my future self ONLY IF: ___________________________ survives."*  
    > *SURVIVAL RULE: "I survive if and only if ___________________________"*  
    *(Specify ONE clear, testable condition: e.g., ">50% original brain matter," "psychological continuity," "no break in consciousness")*
  - **Constraints**: Rules must be **binary** (survives/doesn’t) and **falsifiable**. Circulate to veto vagueness.

  **Phase 2: Gradual Replacement (G1 & G2) (15 mins)**
  - *Hand out G1 envelope*: "Your brain is replaced neuron-by-neuron over 1 year. Each week 0.1% is swapped. After 100% replacement, is your pledge binding?"
  - Students apply their rule, write "YES/NO + brief reason" on card. *No discussion yet.*
  - *Hand out G2 envelope*: "Same as G1, but we took a full scan at 50% replacement. Is your pledge binding NOW?" (They don’t know why yet). Record answer.

  **Phase 3: One-Shot & Sketchy History (10 mins)**
  - *OS Envelope*: "Surgeon simultaneously removes all neurons, replaces them with synthetics in one operation. Functionally identical to final G1 state. Binding?"
  - *SK Envelope*: "Replacement uses organic duplicates grown from your DNA but with no causal link to your original neurons. Perfect behavioral match. Binding?"
  - Students record rulings. *Stack tension: They’re locking in positions.*

  **Phase 4: The Branch Bomb (25 mins)**
  - **Setup**: "Recall the G2 scan? We’re using it. Volunteer Alice surrenders her token mid-activity. Scan her Rule Card + G2 answer."
  - **Branch Scenario** (Handed to "Bob" randomly):  
    > *"You receive Alice’s 50% scan + her Rule Card. Using her notes, complete her replacement procedure from 50% → 100%. YOU now hold her token. Claim her pledge based on HER rule."*  
  - Alice (now "Original") and Bob ("Branch") state claims. Original keeps token; Branch gets a copy.
  - **Tribunal**: 3 randomly picked students judge using *only* **Alice’s original rule**. Class observes.  
    - *Forced contradiction*: If Alice ruled G2 survived, Branch claims inheritance. If she ruled G2 died, Branch argues Original isn’t her.  
  - Repeat with 1-2 more volunteers. **Token conflicts escalate**.

  **Phase 5: Debrief & Conceptual Mapping (15 mins)**
  *(NO author names yet)*
  | Phase      | Concept                          | Trap                                                                 |
  |------------|----------------------------------|----------------------------------------------------------------------|
  | G1 (gradual)| No Sharp Cutoff (Parfit)         | Rules fail at arbitrary thresholds ("51%? 49%?")                    |
  | OS (one-shot)| Identity ≠ Function (Shoemaker) | Same function, different intuition → survival isn't functional      |
  | SK (sketchy)| Right Kind of Cause (Locke)      | Duplicates lack causal history → "same psychology" feels hollow     |
  | BRANCH     | Fission Problem (Reid/Williams)  | **Key move**: "Does survival depend on whether someone ELSE is copied? If both satisfy the rule, who gets the token? Why can't both?" → Exposes that identity *can't* be transitive/one-to-one. |
  | **Pledge** | What Matters (Parfit)            | "Would you care if your pledge was fulfilled by a branch? By a duplicate?" → Prudential concern vs. identity |

  ---

  **Predictable Disasters & Fixes**:
  1. **Vague Rules**: Veto during Phase 1. Example: "Consciousness exists" → "Specify *how* we test continuity of consciousness."
  2. **"Lawyering" Rules**: Enforce binary outcomes. If they argue "both survive," demand: "Who gets the *one* token? The rule allocates the pledge."
  3. **Tribunal Gridlock**: Prepare tie-breaker: "No consensus = token revoked. Original loses coffee, Branch gets nothing." (Simulates non-identity)
  4. **Dominant Personalities**: Randomize tribunal; use anonymous voting slips for rulings.
  5. **"It's Just Coffee!"**: Emphasize the pledge’s personal stakes ("You promised to donate to a cause you hate!").

  ---

  **The Unsimulatable Hole: First-Person Anticipation**  
  **The Problem**: No activity can replicate the *terror* of contemplating your own non-existence. Students adjudicate others' fates, avoiding the "Why should *I* care?" dread central to Williams' "The Self and the Future."  
  **The Fix**: During debrief, pivot hard:  
  > *"When Original and Branch fought over the token... did either of them feel like they were staring at their own annihilation? If you were Alice, would you board the teleporter KNOWING Bob might take your coffee? Your job? Your marriage?*  
  > **That** is what escapes the game—the hole where 'I' was."  

  **Why This Works**: The token conflict makes fission *tactile*. When Branch claims "I satisfy your rule!" using Original’s own logic, the contradiction isn’t theoretical—it’s a fight over coffee. They hit the wall when their rule demands two winners for one prize. No jargon, just scarcity.  

  **Run it tight, and they’ll leave sweating the teleporter**. Good luck.
