  Hmm, the user is a member of a Capital Projects Review Panel for a state transit authority. They need to draft a memo for fellow panel members about two votes: one on the cost contingency reserve for the Meridian Line light-rail extension, and another on adopting a standing protocol for selecting reference classes. The core problem is choosing between four different reference classes (A, B, C, D) that show wildly different cost overrun statistics.

  I need to understand what's at stake here. The external auditor's policy requires anchoring estimates to "similar completed projects," but doesn't specify how to define similarity. The sponsor proposes Class D which shows only 6% median overrun, while staff argues it's gerrymandered. The other classes show much higher overruns: 44% for broad infrastructure (A), 18% for light rail design-build (B), and 31% for the authority's own projects (C).

  The memo needs to do three things: recommend a specific treatment for Meridian Line, propose a standing protocol for future projects, and address the sponsor's strongest objection. I'll also need to include that table with all the requested columns.

  For the Meridian Line recommendation, I'm leaning toward a weighted approach rather than picking one class. None of these classes are perfect - D is too narrow, C has too small a sample, B might overlook tunnel risks, and A is too broad. A weighted median using B, C and D seems reasonable, with D getting less weight due to its small sample size and potential selection bias.

  The sponsor makes a strong argument about holding cost drivers constant - scope growth at interfaces, geotech risk, and funding risk. But the way they've defined Class D feels too convenient - those conjunctive conditions seem cherry-picked to get favorable results. I think their objection wins on principle but loses on execution.

  For the standing protocol, I need to address three key issues: small samples (like Class C), post-hoc narrowing (like Class D), and the authority's thin track record. A tiered approach makes sense - prioritize broader classes unless proven dissimilar, require pre-specified criteria, and use meta-analysis when samples are small. But I should acknowledge that discretion remains - panelists will need to judge what counts as "materially dissimilar."

  The table will need to include all four classes plus my proposed weighted approach. I'll give weights to B, C and D (0.5, 0.25, 0.25) yielding a 18.5% reserve. Classes A and D would be excluded from the primary calculation but retained for sensitivity analysis.

  Throughout this, I should maintain a tone of practical decision-making rather than academic perfection. The panel needs something workable for Thursday's vote, acknowledging that some judgment calls are unavoidable in this process.
answer: |-
  ## Memorandum  
  To: Capital Projects Review Panel Members  
  From: [Your Name], Panel Member  
  Date: Wednesday, [Date]  
  Subject: Recommendation for Meridian Line Contingency Reserve & Standing Protocol for Reference Class Selection  

  **Recommendation:** For the Meridian Line, adopt a **contingency reserve of 18.5%** based on a weighted median overrun derived primarily from Classes B (Light Rail, Design-Build) and C (Authority Track Record), with limited input from Class D (Sponsor Proposal) due to sample size concerns. Revise this only if materially new evidence emerges before Thursday’s vote. For the standing protocol, require that reference classes: (1) prioritize pre-specified, functionally relevant cost drivers; (2) prohibit *post hoc* conjunctive narrowing without strong justification; and (3) use hierarchical meta-analysis when samples are thin. The sponsor’s core objection—that classes must hold key cost drivers constant—wins on principle but loses on execution for Class D, as its criteria appear gerrymandered rather than objectively defensible.  

  ### I. Recommended Treatment for Meridian Line  
  No single reference class (A, B, C, D) is ideal. Each has flaws, but Classes B and C offer the most credible anchor for Meridian:  
  - **Class B (Light Rail, Design-Build):** Median **18%** overrun. This is highly relevant functionally (same mode, same procurement). Its sample size (n=61) is robust, and the 41% within-budget rate suggests realism. It holds fixed procurement risk and project scale. However, it may not fully account for Meridian’s unique tunnel risk (only 2.4km bored, fixed-price).  
  - **Class C (Authority Projects):** Median **31%** overrun. Critical for institutional realism (n=9 is small but non-trivial for our context). It holds fixed local factors: regulatory environment, governance, and delivery culture. The high overrun is sobering but reflects our history. Its weakness is small-n statistical volatility and potential non-representativeness.  
  - **Class D (Sponsor Proposal):** Median **6%** overrun. Its criteria *do* target genuine cost drivers: fixed-price tunnel (geotech risk), high ROW acquisition (scope stability), ring-fenced funding (appropriation risk). However, n=14 is too small for a reliable median (especially skewed by 9 projects within budget), and the conjunctive criteria appear tailored *ex post* to exclude failures. Using it alone would ignore broader evidence.  
  - **Class A (Broad Infrastructure):** Median **44%** overrun. Too heterogeneous. Mixing metro/heavy/light rail ignores material cost-driver differences (e.g., tunnel proportion, system complexity). It "holds fixed" only high GDP and project size—irrelevant to Meridian’s specifics.  

  **Weighted Approach:** Assign weights based on relevance and robustness:  
  - **Class B: Weight 0.50** (Strong functional match, robust n).  
  - **Class C: Weight 0.25** (Essential institutional anchor, but small n).  
  - **Class D: Weight 0.25** (Relevant drivers, but small n and selection bias risk).  
  - **Class A: Weight 0.00** (Excluded—insufficiently similar).  

  **Calculated Reserve:**  
  (0.50 × 18%) + (0.25 × 31%) + (0.25 × 6%) = **18.5%** of baseline estimate.  

  **Revision Trigger:** Only revise if new data emerges (e.g., audit revealing Class D’s projects are non-comparable, or Class B/C calculations are erroneous). Do not revise based solely on advocacy.  

  ### II. Standing Protocol for Reference Class Selection  
  The protocol must balance specificity with flexibility, acknowledging that some discretion is irreducible. Key rules:  
  1. **Primary Class Criteria:**  
     - Must pre-specify *functionally relevant cost drivers* (e.g., procurement model, risk allocation, scope complexity, funding type).  
     - Prohibit *post hoc* conjunctive criteria (e.g., "fixed-price tunnel + >75% ROW + ring-fenced") unless justified *in advance* by risk analysis. Allow disjunctive criteria (e.g., "fixed-price *or* GMP tunnel") to avoid artificial narrowing.  
     - Prioritize larger samples (n ≥ 20 preferred).  

  2. **Addressing Small Samples (e.g., Class C):**  
     - Use hierarchical meta-analysis: Nest the authority’s projects within a broader functional class (e.g., Class C within Class B). Calculate a weighted median: 70% weight to broader class (B), 30% to institutional class (C).  
     - Require sensitivity analysis showing reserve impact if n < 10.  

  3. **Addressing "Thin Track Record":**  
     - Mandate inclusion of the authority’s historical data (like Class C) but *only* as a component of a weighted ensemble (never standalone).  
     - Supplement with "peer authority" data (e.g., similar transit agencies in comparable cities) if n < 5.  

  4. **Discretion & Burden of Proof:**  
     - Sponsors proposing novel classes bear the burden of proving criteria are *predictive* (e.g., evidence that "ring-fenced funding" reduces overruns).  
     - Panel retains discretion to reject classes violating protocol principles, but must justify in writing.  
     - Default to broad functional classes (like B) absent compelling evidence for narrowing.  

  ### III. Sponsor’s Objection: Wins Principle, Loses Execution  
  **Strongest Form of Objection:** "A reference class ignoring material cost drivers (e.g., risk transfer in procurement, funding stability) is statistically illegitimate. It substitutes noise for signal by averaging over fundamentally dissimilar projects. Class D’s criteria are not arbitrary—they fix *proven* levers of overrun (geotech risk, scope growth, appropriation). A class failing to hold these constant cannot provide a valid anchor."  

  **Verdict:**  
  - **Wins on Principle:** The sponsor is correct that similarity must account for material cost drivers. Class A’s heterogeneity illustrates this flaw. The policy’s core aim—the "outside view"—requires isolating projects sharing critical risk profiles.  
  - **Loses on Execution (for Class D):** The objection fails because Class D’s *implementation* appears gerrymandered. Its conjunctive criteria (selected *after* reviewing outcomes) exclude known failures (e.g., projects with 80% ROW that overran). The small n amplifies cherry-picking risk. Valid cost-driver criteria must be: (a) pre-specified, (b) disjunctive where possible, and (c) supported by empirical evidence (e.g., "fixed-price tunneling reduces overruns by X%"). Class D meets none fully.  

  **Surviving Discretion:** Even with this protocol, the panel must judge:  
  - What constitutes a "material" cost driver.  
  - Whether criteria are truly pre-specified or reverse-engineered.  
  - Weights in meta-analysis.  
  Transparency in rationale is the guardrail against abuse.  

  ### Conclusion  
  For Meridian, an **18.5% reserve** balances functional similarity (B), institutional reality (C), and targeted risk mitigation (D) without endorsing gerrymandering. The standing protocol prioritizes evidence-based similarity while constraining discretion through pre-specification, anti-narrowing rules, and structured weighting. The sponsor rightly demands that classes control for key drivers—but this demand must be met with methodological rigor, not tactical exclusion. Adopting this framework ensures contingency reserves are both grounded in data and accountable to principle.  

