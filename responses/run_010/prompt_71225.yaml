answer: |-
  ### Mapping Concorde to Shubik's Dollar Auction  
  **Bidders:** The UK and French governments.  
  **Prize:** A viable supersonic transport (SST) program yielding operational aircraft, prestige, and industrial benefits.  
  **Bids:** Cumulative development funding (£70m initial estimate → £1.5–2bn actual).  
  **Auctioneer:** Mutual commitment enforced by the 1962 treaty, with each government incentivizing the other’s persistence.  

  **Inflection Point ("Crossing the Dollar's Value"):**  
  - **When:** 1971–1972. Boeing canceled its rival SST in March 1971 due to ballooning costs ($1bn→$5bn) and collapsing demand. By then, Concorde’s costs had exceeded £800m, orders had evaporated, and fuel crises loomed.  
  - **Why Continue?** Each government feared unilateral withdrawal would waste *all* prior investment while allowing the other to claim residual benefits (technology, jobs). The treaty created mutual hostage-taking: *"If you quit, I lose everything; if we both persist, we share the loss but save face."*  

  ### Where the Analogy Breaks  
  1. **Prize Ambiguity vs. Fixed Value:**  
     - Dollar auction: The prize’s value ($1) is fixed and known.  
     - Concorde: The "prize" included uncaptured values (prestige, tech spin-offs, jobs). Airbus benefited from Concorde’s composite materials and engineering talent.  

  2. **Sunk Costs vs. Reinvestment:**  
     - Dollar auction: Bids are pure losses.  
     - Concorde: Funds flowed to domestic aerospace sectors (BAC, Aérospatiale), subsidizing employment and R&D. Withdrawal risked regional unemployment and industrial decline.  

  3. **Exit Rationality:**  
     - In a dollar auction, bidding beyond $1 is irrational.  
     - For Concorde, post-1971 persistence could be rational for non-market goals: maintaining the Anglo-French alliance, deterring aerospace brain drain, or signaling technological resolve during the Cold War.  

  ### Classification: Both Fallacies, Differently Phased  
  - **Pre-1971 (Sunk-Cost Dominant):** Continued funding reflected optimism about market recovery and rivalry with Boeing.  
  - **Post-1971 (Dollar-Auction Dynamic):** With Boeing gone and orders collapsed, the sole rationale was avoiding unilateral loss—precisely the auction’s escalation trap.  

  ### Epistemological Tension: Canonical Status vs. Refutability  
  - **Insulation from Refutation?** Yes. The "Concorde fallacy" label pre-loads interpretation, dismissing ex post justifications (e.g., stealth tech insights) as ad hoc rationalizations. Yet these benefits *were real*, if unquantifiable in 1971.  
  - **Settling Rationality Ex Ante:**  
    - Required: A cost-benefit analysis including *all* projected geopolitical and industrial gains, discounted by probability.  
    - Impossible in practice: Governments couldn’t quantify "prestige" or predict the 1973 oil crisis.  
  - **Theory’s Silence:**  
    - Ignores *distributed* benefits (e.g., jobs in key constituencies).  
    - Cannot weigh non-monetary values (diplomatic capital) against tangible losses.  

  ### Conclusion  
  The Concorde program exhibits the dollar auction’s escalation mechanism post-1971, but its broader context defies reduction to pure fallacy. Rationality depended on contested valuations of intangible goods—a weakness in behavioral economics, which struggles to model state-level prestige optimization. Its canonical naming *does* insulate the theory: critics must prove negative value *including* nebulous benefits, while proponents dismiss those benefits as irrational excuses. This asymmetry makes the case self-sealing but theoretically precarious.  

  **Key Insight:** The fallacy’s applicability hinges entirely on whether the decision-makers’ valuation of non-market benefits was *realistic ex ante*. For Concorde, we lack the counterfactual: had Britain or France quit in 1971, would the geopolitical/industrial costs have exceeded £1bn? The dollar auction model, while illuminating, cannot answer this.
