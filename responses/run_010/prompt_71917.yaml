prompt: |-
  I work on reliability engineering at a mid-sized software company, and last winter my book club read a philosopher's account of how moral revolutions happen — the argument, as I understood it, being that practices like dueling and foot-binding did not collapse because someone finally won the argument against them, but because the code of honor around them was recalibrated so that continuing to do them became shameful instead of admirable. I have no formal training in philosophy; I build and operate systems for a living, and what I do when I get interested in something is make a spreadsheet. So I have spent a few months cataloguing norm changes I could verify the outline of, and marking each one with a verdict about whether it was genuine moral progress and, separately, about what actually did the causal work: argument, material interest, or honor and shame. What has become clear is that my verdicts do not fit together, and a coworker who read the same book says they obviously do and that I am simply squeamish about my own conclusions.

  Here is the catalogue, in the order I made it. Dueling among British gentlemen in the early nineteenth century: I call this real moral progress, and I agree that ridicule rather than argument ended it, since the case against dueling was not new. Foot-binding in China, which largely disappeared within a generation once it became the mark of a backward family rather than a route to a good marriage: progress, and again I think shame was load-bearing and the reformers' reasoning was mostly decoration. The British campaign against the Atlantic slave trade: progress, but I am uneasy, because the moral case had been stated long before it succeeded and the explanations I keep encountering emphasize economic interest and organized religious mobilization; if the argument was not what moved things, I do not know in what sense the moral case was vindicated by events. Elaborate Victorian mourning conventions — the black dress, the seclusion, the schedule of stages — which collapsed under precisely the same social pressure of embarrassment: not a moral change at all, just fashion, which is where I can hear how inconsistent I sound. Smoking in bars and restaurants: decades of epidemiology accomplished little, and the norm flipped once smoking came to be experienced as an imposition on the people nearby; progress, driven by disgust. The legalization and then normalization of same-sex marriage where I live: progress, and this one I think really was carried by argument and personal testimony, by people's coworkers and children coming out. Honor killings in parts of South Asia, which are criminalized and publicly condemned by religious authorities and still practiced: not yet a moral revolution, because the honor code has not moved, and I do not think legislation and condemnation count without it. And finally the prestige of glorified overwork in my own industry — the on-call hero, the crunch, the person who is visibly always reachable — which is draining away mostly through public shaming online while the underlying incentives still reward the behavior: I want to call it progress in progress, but I suspect I am dressing up a shift in economic interest as a moral one.

  What I want from you is the principle, or the small set of candidate principles, that best captures these verdicts, stated precisely enough that I could apply it to a case I have not seen before without consulting you — and for each clause of it, tell me which case in my list motivated that clause. I have two specific worries I would like the answer to confront directly. First, dueling and Victorian mourning look to me like the same mechanism producing opposite verdicts, and I need either a principled difference between them or an admission that one of my two judgments is arbitrary. Second, I keep assuming that how a change came about matters to whether it counts as progress, and I cannot tell whether that is a real commitment or a prejudice: if a practice disappeared purely because it stopped being profitable, with nobody's moral reasoning improving at all, does my view oblige me to deny that anything morally good happened, and is that a cost I should accept or a sign my principle is wrong? Then please run the principle on the case I have been going back and forth on for weeks, which is the change in attitudes toward eating animals over the last twenty years: on my account it will either turn out to be an early-stage moral revolution or a lifestyle fashion of the educated professional class, and I should say that I eat meat, so I am alert to the possibility that I have built a principle that flatters me. Finally, tell me plainly which of my listed verdicts your principle cannot accommodate and would have me give up, and apply it to two or three norm changes I have not mentioned, including at least one where you think I would be surprised by the result. I am not looking for a reading list or for references to chase down; I want the reasoning laid out so that a non-specialist can follow it, with any term of art defined the first time it appears. A colleague insists the whole difficulty goes back to a much older philosopher's worries about ethical concepts being historically contingent and about reflection dissolving the knowledge a tradition had already encoded, and I have not been able to work out whether that is a real connection or a name-drop; if you think that line of thought bears on my problem, say how, and if you think it does not, say that instead.
reasoning: |-
  Okay, let me start by really understanding what this reliability engineer is asking. They've created a spreadsheet cataloging various historical norm changes, assessing each for moral progress and the primary driver (argument, material interest, or honor/shame). Their main struggle is that their verdicts seem inconsistent, especially when comparing cases like dueling (progress via shame) and Victorian mourning (mere fashion via shame). They want a principle to unify these judgments that can be applied consistently to new cases.

  First, I need to identify the core tension in their examples. Dueling and foot-binding are seen as moral progress driven by shame, while Victorian mourning is seen as non-moral fashion change despite similar shame mechanisms. Why the difference? The key seems to be whether the norm change addresses harm reduction. Dueling and foot-binding involved clear physical harm, whereas Victorian mourning was about social conformity without inherent harm. That distinction might form the basis of a principle.

  Looking at their other examples: anti-slavery combined moral arguments with economic factors. Here, the outcome (ending harm) matters more than purity of motivation. This suggests that moral progress should be judged by outcomes (harm reduction) rather than solely by the mechanism of change. The British abolition succeeded because of a coalition including moral campaigners and economic interests, but the result was still progress.

  Smoking bans and same-sex marriage show different drivers but both reduced harm (health impacts and discrimination respectively). Honor killings persist because the underlying harm-perpetuating honor code remains strong despite legal changes. Tech overwork is tricky - shame is shifting norms, but incentives still reward it. Progress here is incomplete because material harms (burnout) continue unchecked.

  For their two specific worries: The difference between dueling and mourning is that dueling's collapse reduced physical harm, while mourning's change didn't. On whether the mechanism matters, moral progress can occur through mixed motives as long as harm is reduced. A purely profit-driven change (like if slavery ended solely for economic reasons) would still be progress by outcome.

  Applying this to eating animals: Recent shifts likely constitute early moral progress, not just fashion, because they're driven by concerns about harm (animal suffering, environmental impact), with shame playing a role (e.g., social media pressure on factory farming). But it's incomplete like the tech overwork case.

  Their Victorian mourning verdict needs revising - it wasn't moral progress since no harm was reduced. The anti-slavery assessment should acknowledge that material interests helped achieve moral progress. For new cases: Tipping culture might surprise them - while currently driven by shame, eliminating it without addressing worker pay wouldn't constitute moral progress. And the decline of public executions shows how shame combined with harm concerns to drive progress.

  The colleague's point about historical contingency is valid but operationalized here: we judge progress by harm reduction relative to historical context, not by timeless ideals. The spreadsheet approach actually helps by forcing concrete comparisons across cases.
answer: |-
  Here is a principled framework derived from your cases, designed to resolve your inconsistencies and provide testable criteria. It has three core components, each motivated by tensions in your examples:

  ### The Principle of Moral Progress
  **A norm shift constitutes genuine moral progress if and only if:**  
  1. **It demonstrably reduces net harm or injustice** (motivated by *dueling vs. Victorian mourning*);  
  2. **The change is durable and embedded in social structures** (motivated by *honor killings*);  
  3. **The harm/injustice was *recognized* as such by those driving the change** (motivated by *slavery abolition* and *same-sex marriage*).  

  **Mechanism of change is irrelevant to whether progress occurred** (resolves your "material interest" worry), but determines **stability** and **purity of motivation**.  

  ---

  ### Clause Breakdown & Case Motivations
  1. **Harm/Injustice Reduction**  
     - *Why?* Dueling (physical harm/death) and foot-binding (physical mutilation) reduced suffering. Victorian mourning caused no comparable harm; its collapse merely altered social aesthetics.  
     - *Clause: "demonstrably reduces net harm or injustice"*  
     - *Motivating case:* **Dueling vs. Victorian mourning** (resolves your first worry).  

  2. **Durability through Social Embedding**  
     - *Why?* Honor killings persist because condemnation lacks buy-in from kinship structures. Anti-smoking norms stuck because disgust became codified in laws and workplace policies.  
     - *Clause: "durable and embedded in social structures"*  
     - *Motivating case:* **Honor killings** (lack of progress) and **smoking bans** (successful embedding).  

  3. **Recognition of Harm by Change Agents**  
     - *Why?* Slavery abolition combined moral arguments (Wilberforce) with economic interests (industrialists), but the *moral recognition* distinguished it from purely profit-driven shifts. If a practice vanishes *solely* due to profitability (e.g., asbestos banned for liability, not safety), it fails this clause.  
     - *Clause: "harm was recognized by those driving change"*  
     - *Motivating case:* **Slavery abolition** (resolves your second worry: material interests can *enable* progress, but moral recognition must be present among key actors).  

  ---

  ### Addressing Your Worries Directly
  1. **Dueling vs. Victorian Mourning**  
     - *Principled difference:* Dueling involved **lethal harm**; mourning involved **social discomfort**. The mechanism (shame) is identical, but progress depends on **outcome**, not mechanism. Victorian mourning’s collapse is fashion because no harm was alleviated.  

  2. **Mechanism vs. Moral Validity**  
     - If a harmful practice (e.g., slavery) disappeared *purely* due to profit motives *with no moral recognition*, it would **not** be moral progress under this framework. Material interests alone lack moral intent. This *is* a cost: you must deny progress in such scenarios. But this aligns with your intuition that slavery abolition’s "vindication" required moral actors, even alongside economic factors.  

  ---

  ### Application: Eating Animals (Past 20 Years)
  - **Harm Reduction?** Yes: industrial farming causes animal suffering, environmental damage, and zoonotic disease risk.  
  - **Durable Embedding?** Partial: vegan options mainstreamed, but meat consumption rises globally. Corporate ESG pledges exist but lack enforcement.  
  - **Harm Recognition by Drivers?** Yes: activists frame ethics/environment; consumers cite morality in surveys.  
  - **Mechanism?** Mixed: shame (documentaries exposing farms), argument (ethical philosophy), material interest (cheaper alternatives).  
  - **Verdict:** **Early-stage moral revolution** (meets all 3 criteria weakly). Not merely elite fashion because: (a) harm claims are evidence-based, (b) shifts occur across classes (e.g., fast-food vegan options), (c) aligns with broader anti-cruelty norms. Your meat-eating doesn’t invalidate this—progress is societal, not individual.  

  ---

  ### Which Verdicts Must Be Revised?
  1. **Victorian Mourning**  
     - Your verdict: "Not moral change."  
     - **Principle’s verdict: Confirm** (no harm reduced → not progress).  
     - *Why?* Social inconvenience ≠ harm.  

  2. **Slavery Abolition**  
     - Your verdict: Uneasy because material interests played a role.  
     - **Principle’s verdict: Progress** (harm reduced + moral recognition among key actors).  
     - *Why?* Mechanism is irrelevant; Wilberforce et al. *did* invoke moral arguments, satisfying Clause 3.  

  3. **Tech Overwork**  
     - Your verdict: "Progress in progress" but possibly economic.  
     - **Principle’s verdict: Not yet progress** (harm persists; incentives unchanged).  
     - *Why?* Shaming lacks embedding (Clause 2). If burnout declines *due to policy changes*, revisit.  

  ---

  ### New Cases (Applying the Principle)
  1. **Decline of Public Executions (18th–19th Century Europe)**  
     - *Harm Reduced?* Yes (brutal spectacle/torture).  
     - *Embedded?* Yes (moved to prisons; laws amended).  
     - *Recognition?* Yes (Enlightenment philosophers framed it as barbaric).  
     - **Verdict: Moral progress** driven by shame (spectators felt "uncivilized") + argument. *Surprise?* Shame was primary, but progress still occurred.  

  2. **Tipping Culture (Current U.S. Debate)**  
     - *Harm Reduced?* If replaced by living wages: yes (financial instability).  
     - *Embedded?* No (still dominant; "guilt tipping" persists).  
     - *Recognition?* Partial (some employers cite fairness; others fear costs).  
     - **Verdict: Not progress yet** (fails durability and full recognition).  

  3. **Foot-Binding’s Parallel: Corsetry in Europe**  
     - *Harm Reduced?* Yes (organ damage, restricted mobility).  
     - *Embedded?* Yes (abandoned; fashion shifted).  
     - *Recognition?* Mixed (health arguments + feminism vs. aesthetic trends).  
     - **Verdict: Progress** (health harm reduction dominates).  

  ---

  ### On Your Colleague’s Point (Historical Contingency)
  The philosopher (likely Hegel/MacIntyre) is **relevant but not decisive**. Yes, norms are historically contingent—foot-binding was once "moral." But your cases show **harm reduction** as a cross-cultural constant: societies converge on rejecting practices causing unnecessary suffering when alternatives exist. This framework uses **harm** as the evaluative anchor, accepting contingency while avoiding relativism. Your spreadsheet method *reveals* this pattern empirically—no metaphysics needed.

  ---

  ### Summary for Application
  To evaluate any norm shift:  
  1. **Identify harms/injustices** addressed (physical, psychological, social).  
  2. **Check durability**: Are laws/institutions reinforcing it?  
  3. **Assess drivers' motives**: Did key actors invoke morality?  
  4. **Ignore mechanism** when judging progress—use it only to predict stability (shame-based changes backslide if not embedded; argument-based resist regression).  

  This passes your test: principles are extracted from your cases, resolve tensions, and generate clear outputs for new examples. The cost is accepting that material interests alone cannot create moral progress—but as slavery shows, they can accelerate morally driven change.
