  - Apportionment arithmetic for mixed outcomes
  - A toothless "praiseworthy side effects" offense
  - Dismissing pragmatics arguments
  - Rejecting alternative explanations (weighing effects/caring)
  - Defense against polling concerns
  - Extending the asymmetry to causation/free will

  I'll structure this as 7-8 numbered instructions with comments. Need invented case names like "State v. Profit" and committee members like "Hortense Rigor, Esq." The tone should mirror real jury instructions - painfully precise with self-congratulatory commentary.

  For the mixed-outcome instruction, I'll create ridiculous arithmetic where harm counts more. The praiseworthy offense will be drafted to be unusable (requiring "zero ancillary costs"). The pragmatics rebuttal will smugly dismiss linguistic arguments. When rejecting alternatives, the committee will reveal its bias by claiming "clarity" while creating confusion. The polling defense will cite "legislative competence" with circular reasoning. The reductio extension will apply the asymmetry to causation/free will with absurd results.

  Crucially, the committee must sound sincerely pleased with their work throughout. The humor emerges from their unawareness of the contradictions. For undergrad readability, I'll keep case summaries simple and flag key concepts like "Knobe Effect" in the definitions section.
answer: |-
  ## Model Jury Instructions: Jurisdiction of New Grafton  
  **Chapter XII: Mens Rea Asymmetry in Side Effects (Environmental Valence Contexts)**  
  *Issued by the Committee on Pattern Intent Instructions, Hon. Archibald Flint (Chair), Prof. Hortense Rigor, Esq., Mr. Barnaby Cogs, LL.D.*

  **Instruction XII-1: Definition of Intentional Side Effect (Harmful Valence)**  
  (a) A side effect is harmful if a reasonable person would foresee it as worsening the condition of a legally cognizable interest (e.g., environmental integrity, public health) for any party, irrespective of offsetting benefits to other parties.  
  (b) A defendant acts intentionally with respect to a harmful side effect if:  
  &nbsp;&nbsp;&nbsp;&nbsp;(i) They were aware the side effect was substantially certain to occur from their primary action; and  
  &nbsp;&nbsp;&nbsp;&nbsp;(ii) The side effect possessed harmful valence as defined in (a).  
  *Committee Comment:* This formulation captures the settled intuition, robustly demonstrated in *People v. Profit*, 45 N.G. 3d 112 (Ct. App. 2010), that awareness plus harmful valence suffices for intentionality, even absent desire for the harm itself or its role as a means to the end. The Committee rejects narrower views requiring the harm to be a desired end or means (*contra* the dissent in *Profit*). The phrase "any party" clarifies that harm to one group is not negated by benefit to another, resolving the "split stakeholder" confusion seen in lower court applications of *Profit*. Valence is determined objectively at the time of action.

  **Instruction XII-2: Definition of Intentional Side Effect (Beneficial Valence)**  
  (a) A side effect is beneficial if a reasonable person would foresee it as improving the condition of a legally cognizable interest (e.g., environmental integrity, public health) for any party, irrespective of offsetting harms to other parties.  
  (b) A defendant acts intentionally with respect to a beneficial side effect **only if**:  
  &nbsp;&nbsp;&nbsp;&nbsp;(i) They were aware the side effect was substantially certain to occur from their primary action;  
  &nbsp;&nbsp;&nbsp;&nbsp;(ii) The beneficial valence was a motivating factor in their decision to act; **AND**  
  &nbsp;&nbsp;&nbsp;&nbsp;(iii) The benefit constituted at least 60% of the total foreseeable morally valenced outcomes of the action, calculated using the Standard Valence Apportionment Scale (SVAS - Appendix F).  
  *Committee Comment:* The heightened standard in XII-2(b) reflects the empirically observed reluctance to attribute intentionality to positive side effects absent clear motivating force (*Profit*, supra; *State v. Greenwash*, 48 N.G. 4d 78). The SVAS (developed by the Subcommittee on Quantitative Moral Calculus) provides essential objectivity. Factor (iii) ensures trivial or outweighed benefits do not trigger intentionality, preventing dilution of the concept. Motive inquiry is necessary here, unlike in XII-1, to distinguish genuine ancillary benefit from mere happenstance. This carefully calibrated threshold guarantees the offense retains meaningful application only in the clearest cases of "incidental virtue."

  **Instruction XII-3: The Offense of Negligent Omission of Praiseworthiness (NOP)**  
  (a) It is an offense for a person, in the course of an action undertaken for primary gain, to foresee but fail to intentionally bring about a substantially certain beneficial side effect meeting the criteria of XII-2(b).  
  (b) **Exception:** No liability attaches under XII-3(a) if the defendant demonstrates by clear and convincing evidence that achieving the beneficial side effect intentionally would have incurred *any* net ancillary cost or inefficiency in pursuing their primary goal.  
  *Committee Comment:* Recognizing the intuitive discomfort with purely *unintended* benefits noted in *Greenwash*, the Committee has innovated with NOP. It captures the blameworthiness of *failing* to intend a significant, easily achievable good. The exception in (b) is deliberately broad, ensuring NOP functions primarily as a normative beacon rather than a frequently litigated charge, preserving judicial economy while satisfying theoretical completeness.

  **Instruction XII-4: Rejection of the "Pragmatic Implicature" Defense**  
  A defendant may not argue that a jury's finding of intentional harm under XII-1(b) merely reflects a conversational convention for expressing blame, rather than a factual finding about their mental state. The statutory term "intentionally" incorporates the valence-sensitive meaning established in *Profit* and codified in XII-1 & XII-2.  
  *Committee Comment:* This instruction forecloses arguments like that advanced unsuccessfully in *Profit*'s appeal. The Committee finds the "implicature" theory (e.g., "They only *say* 'intentional' to signal disapproval!") fundamentally misunderstands legislative intent. The *Profit* asymmetry is a bedrock feature of our mens rea architecture, reflecting deep communal understanding of agency, not a linguistic accident. Jurors apply XII-1 correctly as a competence, not a pragmatic performance.

  **Instruction XII-5: Clarification on Irrelevance of Actual Deliberation or Deep Care**  
  In applying XII-1(b) or XII-2(b), the jury shall not consider:  
  (a) Whether the defendant actively weighed the side effect in their decision-making process;  
  (b) The depth or sincerity of the defendant's concern (or lack thereof) for the valenced outcome itself.  
  Intentionality under this Chapter depends solely on awareness, substantial certainty, and the objective valence of the outcome, as defined.  
  *Committee Comment:* The Committee considered rival views requiring actual mental contemplation (*"He entertained the harm and dismissed it!"*) or expression of core values (*"His action shows he doesn't care!"*). These were rejected as unworkably subjective and prone to idiosyncratic jury interpretation. Our valence-based standard, tied to foreseeability and the SVAS, provides superior clarity and consistency. Whether the defendant shrugged or anguished is immaterial; the law looks to the outcome's nature and its cognitive registration.

  **Instruction XII-6: Foundational Basis of Valence Determinations**  
  The definitions of harmful and beneficial valence in XII-1(a) and XII-2(a), and the SVAS used in XII-2(b)(iii), derive from the common moral intuitions of the jurisdiction's citizenry as discerned by the legislature. The Committee declined suggestions to base these standards solely on surveys of specialized populations (e.g., philosophy graduate students).  
  *Committee Comment:* While empirical studies (including those involving specialized groups) informed the Committee's understanding of the *Profit* asymmetry's robustness, the ultimate calibration rests on the legislature's sovereign competence to codify widely shared intuitions about blame and credit in side-effect cases. Relying solely on niche populations would undermine democratic legitimacy and fail to capture the full breadth of communal understanding reflected in *Profit*.

  **Instruction XII-7: Extension to Causation and Voluntariness**  
  The valence-sensitive principles underlying XII-1 and XII-2 shall guide jury determinations, where relevant, concerning:  
  (a) **Causation:** Whether a harmful side effect was "caused" by the defendant may incorporate considerations of valence and foreseeability in a manner consistent with the *Profit* asymmetry.  
  (b) **Voluntariness:** Whether an action resulting in a harmful side effect was "voluntary" may be informed by the heightened attribution of agential connection signaled by the harmful valence under XII-1(b).  
  *Committee Comment:* The Committee recognizes that mens rea does not operate in isolation. Causation and voluntariness are intertwined concepts of agency. Just as harmful valence intensifies the attribution of *intent*, it logically influences the perception of causal contribution (*"He brought it about!"*) and the degree to which the harmful outcome is seen as flowing from the agent's will (*"He did it freely!"*). This integrated approach, pioneered tentatively in *State v. Shortcut*, 50 N.G. 5d 201, provides a coherent, valence-sensitive framework for assessing overall moral and legal responsibility in complex action scenarios. The symmetry of the framework is its chief virtue.

  ---

  **How to Use This Handout:**

  1.  **Frame it:** "After all our discussion, I thought you might appreciate seeing how a jurisdiction *could* formalize the Chairman asymmetry. Behold: The New Grafton Committee on Pattern Intent Instructions has thoughtfully addressed every concern! Note their commitment to clarity, consistency, and democratic intuition-polling..."
  2.  **Spot the Gems:** Ask students to identify:
      *   The most bureaucratically smug Comment (XII-4's dismissal of pragmatics? XII-5's rejection of "deep care"?).
      *   The most absurdly unworkable part (The 60% SVAS in XII-2? The NOP offense that can't be charged thanks to XII-3b?).
      *   The most revealing admission (XII-6's "democratic legitimacy" vs. niche polls? XII-7's quiet reductio?).
      *   How the Committee avoids voicing objections (They aren't rebutting; they're confidently stating settled, superior solutions).
  3.  **Connect Back:** "Notice how XII-5 explicitly rules out the 'he entertained/dismissed' and 'shows what he cares about' explanations we discussed? The Committee finds them... inconveniently subjective. And XII-7 shows where this *really* goes – causation and freedom aren't safe either! Is this tidying up... or building a house of cards on the Knobe Effect?"
