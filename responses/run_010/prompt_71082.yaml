prompt: |-
  I write literary fiction, mostly about ordinary people being decent or failing to be, and I've come to suspect that the view of human nature I actually hold is an incoherent patchwork. I keep getting told it's basically Mencius versus Xunzi — sprouts that only need cultivating versus crooked timber that only a frame and a lot of grinding can straighten — and that I have to pick. I don't want to pick on the basis of an argument, I want to pick on the basis of what I actually believe when I'm building a character, and then find out whether that adds up to anything. So here are my verdicts, from books I've finished and characters I've had to scrap.

  One. When my character sees a toddler wobble toward an open stairwell and snatches him, I write it with no thought in her head whatsoever — no calculation, no self-image to protect, not even surprise afterward. I believe that scene completely. The pull seems to be there ahead of any training.

  Two. That same woman being unfailingly decent to her coworkers for twenty years? I don't believe a word of it unless I've put the work on the page: the grandmother's rules, the humiliations, the people she studied and copied, the years of catching herself mid-sentence. Alone in a room with no witnesses, my instinct is that she'd be petty and a little cruel. So one of her decencies is native and the other is entirely manufactured, and I don't feel any strain holding both — that's the pair I most want examined, because it looks to me like it should be a contradiction and doesn't feel like one.

  Three. I cannot write a villain who was rotten as a child. Every time I've tried, the flashback reads as a lie, and I always end up rewriting the childhood as a hillside where something was chopped down and and grazed over for years, so that people looking at the bald slope assume nothing ever grew there. I don't buy born-bad, and I notice I don't write it either.

  Four. But a character who is good purely because a school or a discipline or a set of forms made him that way, with nothing innate for them to work on — I think he's really good. Not second-rate, not performing. If he's done the right thing for forty years out of habit and duty, I dont get to say he's a fraud, and I get annoyed at readers who want to.

  Five. And yet the moment I write someone who does exactly the right things and feels no pull toward them and no distress at the thought of stopping, the character goes hollow on the page. Readers say so, I agree with them, and I can't argue my way out of it. Four and five are the ones I circle for years.

  Six. Smaller, but stubborn: when I move a character into another century or another country, every bit of content changes — what shocks her, what she defers to, what she's ashamed of — but that she is shocked by somethings and defers to something and is ashamed of something never changes. Form universal, content local. Which feels like neither camp, or maybe like water that has no preference for east or west but does have a preference for down.

  So: is there a principle about human nature that delivers all six, or five of the six, or a revised version of the ones I'm fudging? I'd like it stated precisely enough to work as a rule I could actually build characters with — which clause is doing the work for which verdict, whether it needs a distinction I haven't thought of (I suspect something like the difference between having a sprout and the sprout ever showing itself), and what it says about cases I haven't listed. Two in particular: the man raised carefully and never once tested, who falls apart the first time he's genuinely in danger — was he hollow the whole time, or just never given a frame? And the character whose spontaneous, untrained impulses are reliably kind but whose trained behavior is reliably cruel. Also tell me plainly which of my six it has to break. My guess is the fourth, and I'd like to know whether that guess is right or just the one I'd least mind losing.
reasoning: |-
  Okay, the user writes literary fiction focusing on ordinary people and their moral struggles. They're grappling with their view of human nature, which seems to blend elements from Mencius (innate goodness) and Xunzi (need for cultivation). They want a coherent principle based on their writing experiences rather than philosophical arguments. Let me unpack their six points.

  First, the toddler rescue scene: instinctive action without thought. The user believes this completely, suggesting an innate pull toward goodness in urgent situations. Then, the same character needing years of practice to be decent to coworkers points to manufactured virtue. The user holds both without contradiction. 

  For villains, they reject born-bad, instead showing damaged potential. But a character shaped purely by discipline is genuinely good, not a fraud. Yet if someone does right without any internal pull, the character feels hollow. The universality of moral emotions (shame, deference) across cultures, though their triggers vary, is another key point.

  The user needs a principle that explains all six points. The core tension is between innate tendencies and cultivated habits. They want to know if such a principle exists, how it handles edge cases, and which of their points might be compromised. Their deeper need might be validation of their intuitive approach and a framework to build consistent characters without oversimplifying human nature.

  Looking at their examples, the sprout metaphor fits but needs expansion. The innate capacity (sprout) is universal, but its expression requires cultivation. Urgent actions like saving a toddler bypass deliberation, showing the sprout directly. Habitual decency requires training, which becomes genuine over time. A villain's childhood damage explains their corruption, not innate evil. The disciplined character's goodness is real because the habits have become second nature. But if there's no sprout at all, the actions feel hollow because there's no underlying capacity.

  The universality of moral emotions aligns with the sprout's presence, while cultural variation reflects different cultivation. Edge cases: the untested man crumbling might lack a strong framework, but the sprout was there. The character with kind impulses but cruel behavior shows a sprout suppressed by bad cultivation. Point four (purely disciplined goodness) might need refinement—the sprout is necessary as the foundation, even if dormant. The user might need to accept that the sprout exists but can be buried, not that it's absent entirely.

  In conclusion, a dynamic principle combining innate capacity and cultivation explains all points. It validates their intuition without forcing a choice between Mencius and Xunzi. The user can build characters with depth, showing both inherent potential and the impact of their environment and choices.
answer: |-
  Your instincts are remarkably coherent—they point toward a dynamic, layered view of human nature that transcends the Mencius/Xunzi dichotomy. Here's a principle that delivers all six verdicts, revised to clarify the tension in your fourth point:

  **Principle:**  
  *Humans possess an innate, universal *capacity* for moral perception and resonance (a "sprout"), but its reliable *expression* as sustained goodness requires cultivation through habit, narrative, and social structure. This capacity is fragile—it can be suppressed, distorted, or obscured by experience, yet its absence renders virtue hollow.*

  **How it delivers your verdicts:**

  1.  **The Toddler Rescue:** Explained by the innate *capacity* in its rawest, most urgent form. The moral perception ("danger! helplessness!") triggers an embodied response bypassing cognition. The sprout *shows itself* directly under acute threat. **(Sprout Capacity: Active & Evident)**

  2.  **20 Years of Manufactured Decency:** Explained by the *cultivation* required for reliable expression. Sustained prosocial behavior towards non-urgent, complex social demands (workplace politics) needs scaffolding: rules, models, practice, self-correction. The sprout provides the *potential* to care about others/social harmony, but without cultivation, the default in unobserved moments leans towards self-interest/pettiness. **(Sprout Capacity: Present but Requires Cultivation for Consistent Expression)**

  3.  **No Born-Bad Villains:** Explained by the *fragility* and *suppressibility* of the sprout. The "bald slope" childhood shows the sprout was *present* but *damaged* (chopped down) or *starved* (grazed over) by neglect, trauma, or toxic modeling. Evil isn't innate; it's the capacity buried under scar tissue or fed poison. **(Sprout Capacity: Damaged/Suppressed, Not Absent)**

  4.  **Revised - The Disciplined Good Man (Genuine Goodness):** **This is the key revision.** The principle holds: *The sprout capacity must exist as the foundation.* The discipline/school/forms didn't create goodness *ex nihilo*. They *awakened*, *channeled*, and *reinforced* the latent capacity. After 40 years, the habits *are* his character – the cultivation has become so integrated it *embodies* the sprout. His goodness is genuine *because* the forms resonated with and structured the innate potential. He’s not a fraud because the sprout *was* there to cultivate. **(Sprout Capacity: Latent but Cultivated into Expression & Habit)**

  5.  **The Hollow Rule-Follower:** Explained by the *absence* of the sprout capacity. If there is *no* innate resonance with the good the rules point to – no inner pull, no discomfort at violating them – the actions are purely external, mechanical. The forms have *nothing innate to work on or awaken*. This is the negative counterpart to #4. **(Sprout Capacity: Absent or Utterly Unreachable)**

  6.  **Universal Form, Local Content:** Explained by the *innate capacity* (the universal form - the *propensity* to feel shame, deference, shock) and the *cultivation* (the local content - *what* triggers it). The sprout is the universal moral sense faculty; culture provides the specific scripts and triggers. **(Sprout Capacity: Universal Faculty; Cultivation: Local Scripts)**

  **Addressing Your Specific Cases & Questions:**

  *   **The Untested Man Who Crumbles:** Under this principle, he likely had the *capacity* (sprout), but his careful upbringing provided only a *fragile frame* (cultivation) that simulated virtue without testing its integration with his deeper capacities under stress. He wasn't necessarily "hollow," but his cultivated virtue was superficial, unrooted in the resilience that comes from integrating the sprout with tested habit. The frame lacked reinforcement and connection to his core capacity under pressure.
      *   **Which verdicts?** Fits #2 (manufactured decency needing work) and #4 (genuine goodness requiring the sprout *and* cultivation). His cultivation was inadequate for the test.

  *   **Kind Impulses, Cruel Behavior:** This character has a strong, *active* sprout capacity (spontaneous kindness) but has undergone cultivation (training, perhaps indoctrination, survival mechanisms) that *systematically overrides and distorts* its expression into sustained cruel *behavior*. The sprout is alive (causing internal conflict, likely), but the cultivated habits/ideology are dominant in action. The tragedy is the suppression.
      *   **Which verdicts?** Strongly fits #3 (damaged/suppressed sprout) and #5 (the cruel *behavior* might feel hollow if driven purely by ideology without any inner resonance, but the inner conflict suggests the sprout is fighting, so it might not be fully hollow). Also touches #2 (manufactured cruelty).

  **Which Verdict Does the Principle "Break"? (Your Guess: #4)**

  *   **You were partially right.** The principle *revises* your original #4 statement ("good purely because... with nothing innate"). The principle **insists the innate capacity *must* be present** for the cultivated goodness to be genuine and non-hollow (#5). It breaks the *"nothing innate"* clause. The disciplined man's goodness works **because** the discipline worked *on* and *with* his innate capacity, awakening and shaping it. The sprout was always there, perhaps dormant or unrecognized, but *present*.

  **Why This Works for Building Characters:**

  1.  **Diagnostic Tool:** For any character, ask: Is the sprout capacity *present*? (If no, risk hollowness - #5). If present, is it *active* or *latent/dormant*? Has it been *damaged/suppressed*? (#3). What *cultivation* has shaped its expression? Strong positive (#4), weak/fragile (#2 analogue), or actively negative/distorting (Cruel Behavior case)?
  2.  **Explains Nuance:** Resolves the apparent contradiction between #1 (raw sprout action) and #2 (cultivated decency) – different contexts engage the moral faculty differently. Explains why the disciplined man (#4) isn't hollow like the rule-follower (#5) – one has the sprout integrated, the other doesn't.
  3.  **Generates Conflict & Arc:** Character development often involves the sprout being *awakened* (#4), *rediscovered* after damage (#3), *struggling* against distorting cultivation (Cruel Behavior case), or the *failure* of cultivation to integrate with the sprout (Untested Man).
  4.  **Handles Universality & Specificity:** The sprout (capacity) is universal (#6 form), the cultivation (expression/scripts) is local/specific (#6 content).

  **In essence:** You believe in the *seed* of moral perception (Mencius), but you know that seed only reliably *grows into a sturdy tree* through the hard work of cultivation, scaffolding, and pruning (Xunzi), and that the seed can be crushed or poisoned. You also know a tree grown *without a seed* is artificial and hollow. Your six verdicts flow logically from this integrated view. Your "guess" about #4 was insightful – the innate element *is* indispensable for non-hollow virtue. Your view isn't a patchwork; it's a sophisticated ecology of human potential.
