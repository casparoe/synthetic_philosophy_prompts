prompt: |-
  I cover science and ideas for a magazine and I keep running into the same puzzle: when is going along with the crowd smart, and when is it a failure? Here are my gut verdicts on a bunch of cases, and I want to know what principle, if any, actually generates them.

  Tourist in an unfamiliar city eats at the restaurant with the queue rather than the identical-looking empty one next door: smart. eBay bidder who raises her ceiling because the bidding tells her others see value she doesn't: also fine. Doctor who orders a test she privately thinks is useless because every colleague orders it: not fine. Fund manager who keeps buying an asset he's sure is overpriced because everyone else is buying it: not fine — even though the reasoning looks like the eBay case with the numbers turned up. Juror who changes her vote after hearing eleven others: fine, that's literally what a jury is for. Scientist who abandons her own research program because nobody else has picked it up: not fine. Someone who deletes her two-star review after seeing fifty five-star ones: fine, sort of, mildly embarrassing.

  And the one I can't settle: an epidemiologist who revises her forecast after reading the other modelling groups' forecasts. Structurally that's just the juror again, but I want to call it bad.

  So: is there one principle that gets all of these, or nearly all? State it precisely enough that a stranger could apply it, show me which case motivates each clause of it, tell me what it predicts for two I've been dodging — a journalist who adopts the consensus framing of a story she hasn't reported herself, and a founder who prices her round off other term sheets she thinks are insane — and be straight with me about which of my verdicts it can't save. If the eBay/fund manager pair forces a choice between a complicated principle that keeps both and a simple one that flips one of them, say which you'd pick and why.
reasoning: |-
  Okay, the user is a science and ideas journalist grappling with a recurring dilemma: when is following the crowd wise versus foolish? They've provided concrete examples with their intuitive judgments and want a unified principle that explains them all. 

  First, I notice their frustration with inconsistent patterns—like how eBay bidding is rational but similar fund manager behavior isn't, or why epidemiologist forecasts feel wrong despite resembling jury dynamics. They're clearly seeking cognitive scaffolding to organize these intuitions. 

  The core tension seems to be between informational value and accountability voids. In crowd-following scenarios, wisdom emerges when: 
  - The crowd has access to genuine information (tourists seeing queues signal quality)
  - Individuals lack better data (jurors must collaborate)
  - But fails when:
  - Incentives distort behavior (doctors ordering unnecessary tests defensively)
  - Social proof overrides judgment (scientists abandoning unique research)

  For the epidemiologist case they're stuck on, the distinction might hinge on whether models share underlying data versus herding on assumptions. If groups independently converge, it's valuable; if they mimic each other, it's junk. 

  The journalist example would likely condemn consensus framing if it's lazy adoption without verification, while the founder case is trickier—if market signals reflect collective insanity, pricing off term sheets could be catastrophic. 

  I'll propose the Informational Value Principle, which weights: 
  1) Access asymmetry (does the crowd know something you don't?) 
  2) Independence (is their behavior evidence-based or mimetic?) 
  3) Accountability (who bears the cost of error?) 

  This salvages all their verdicts except maybe the deleted review—which I'd reframe as rational but sad. For the eBay/fund manager clash, I'd keep complexity because finance introduces reflexive dynamics absent in consumer bidding. 

  Their hidden need might be for a thinking tool to critique groupthink in science journalism. The unspoken ask: "Help me articulate why some consensus is knowledge while other is cowardice."
answer: |-
  Here's a unified principle derived from your cases, designed to be precise and actionable:

  **The Informational Value Principle (IVP):**
  *"Following the crowd is rational when the crowd's behavior provides unique, credible evidence about an *uncertain state of the world* that you cannot easily access or verify independently, *and* when the crowd's incentives are aligned with revealing truth or value. It is irrational when the crowd's behavior primarily reflects social pressure, defensive conformity, or self-referential market dynamics divorced from underlying reality, *or* when you possess superior independent information or judgment relevant to the decision."*

  **Breaking Down the IVP & Applying it to Your Cases:**

  1.  **"Unique, credible evidence about an uncertain state of the world":** The crowd must be acting based on information relevant to the outcome.
      *   *Tourist:* The queue *is* evidence of perceived quality/experience by other diners (the "state of the world" is restaurant quality). The tourist cannot easily verify this independently before eating.
      *   *eBay Bidder:* Others' bidding *is* evidence of their valuation of the item (the "state of the world" is the item's subjective/market value). The bidder cannot know others' private valuations perfectly.
      *   *Juror:* Other jurors' votes *are* evidence of their interpretation of the trial evidence (the "state of the world" is the defendant's guilt/innocence based on evidence). The juror has heard the same evidence but benefits from collective reasoning.
      *   *Deleted Review:* Other reviews *are* evidence of others' experiences (the "state of the world" is the product/service quality). The reviewer may doubt their own isolated experience.
      *   *Epidemiologist (Ambiguous):* Others' forecasts *could be* evidence of their interpretation of complex data/models (the "state of the world" is the future epidemic trajectory). However, the epidemiologist *also* has direct access to the underlying data/models.
      *   *Doctor:* Ordering the test isn't primarily evidence about the *patient's need* (the relevant state of the world). It's evidence about *colleague behavior* driven by fear, not diagnostic necessity.
      *   *Fund Manager:* Buying isn't evidence of the *asset's fundamental value* (the relevant state of the world). It's evidence about *other investors' behavior* in a speculative bubble.
      *   *Scientist:* Others *not* pursuing the program isn't strong evidence it lacks merit (the state of the world is scientific truth/potential). It could reflect fashion, funding bias, or risk aversion. The scientist possesses unique insight into *their own* program.
      *   *Journalist (New):* Consensus framing isn't necessarily evidence about the *underlying facts* of the story (the state of the world). It might reflect media groupthink, editorial pressure, or ease. The journalist hasn't done independent reporting to verify.
      *   *Founder (New):* Other term sheets *are* evidence of *market sentiment/valuation at that moment* (the state of the world is the current funding environment). However, if the founder believes this sentiment is "insane" (divorced from fundamentals), it may not reflect the *long-term value* of her company.

  2.  **"You cannot easily access or verify independently":** Your independent access to the truth is limited; the crowd offers a shortcut.
      *   *Tourist, eBay Bidder, Deleted Review, Juror:* High independent verification cost/impossibility before acting.
      *   *Doctor, Fund Manager, Scientist, Epidemiologist:* They *can* (and should) access underlying reality independently (patient needs, asset fundamentals, research merit, epidemiological data). Following the crowd avoids this effort/risk.
      *   *Journalist:* *Hasn't* done the independent reporting required to verify the framing.
      *   *Founder:* *Can* assess her company's fundamentals independently, though market sentiment is a real factor.

  3.  **"Crowd's incentives are aligned with revealing truth or value":** The crowd members are acting based on their genuine assessment, not ulterior motives or pressure.
      *   *Tourists in queue:* Incentive = Get a good meal. Aligned with revealing quality.
      *   *eBay Bidders:* Incentive = Win the item at a price they value it. Aligned with revealing perceived value.
      *   *Jurors:* Incentive (ideally) = Reach a just verdict. Aligned with revealing truth.
      *   *Deleted Reviewers:* Incentive = Share experience (mostly). Reasonably aligned.
      *   *Epidemiologists:* Incentive *should be* accurate forecasting. But groupthink, pressure, or shared faulty assumptions can misalign incentives.
      *   *Doctors:* Incentive = Avoid malpractice suits, satisfy patient expectations, keep up appearances. *Not* primarily aligned with optimal patient care in this specific test-ordering decision.
      *   *Fund Managers:* Incentive = Short-term performance (not get fired, earn bonuses), often achieved by following momentum/herding, *not* by finding fundamental value. Misaligned.
      *   *Scientists:* Incentive = Career success (grants, publications), often tied to following hot topics, *not* necessarily pursuing the best science. Misaligned.
      *   *Journalists:* Incentive = Meet deadlines, fit in with editorial stance, avoid controversy. Often misaligned with deep, independent truth-seeking for *this specific story*.
      *   *Founder:* Other investors' incentives = Get a good deal, secure allocation in a hot round, generate returns. May *not* be aligned with accurately pricing *this specific company's* long-term value if caught in a hype cycle.

  4.  **"Possess superior independent information or judgment":** You have a reason to doubt the crowd's signal.
      *   *Doctor, Fund Manager, Scientist:* Explicitly possess private judgment contradicting the crowd ("useless," "overpriced," belief in own program).
      *   *Epidemiologist:* Possesses her own model and expertise; the crowd signal might be redundant or biased. Her judgment *should* be primary, informed by others, not replaced.
      *   *Journalist:* *Should* develop independent judgment through reporting. Blind adoption avoids this.
      *   *Founder:* Possesses deep knowledge of her company ("thinks term sheets are insane").

  **Applying IVP to Your Ambiguous Cases & Verdicts:**

  *   **Epidemiologist Revising Forecast:** **IVP Predicts: Often Bad.** While others' forecasts *could* provide information, the epidemiologist *can* access the underlying data/models directly. Her primary job is independent analysis *informed* by, but not *replaced by*, others' work. Revising *solely* based on others' outputs risks groupthink, especially if models share assumptions or there's institutional pressure. It fails the "cannot easily verify independently" and "possess superior judgment" clauses *for her specific role*. This distinguishes it from a juror who *must* deliberate collectively on the *same* evidence.
  *   **Journalist Adopting Consensus Framing (Unreported):** **IVP Predicts: Bad.** The consensus framing is not unique evidence about the *facts* (which she hasn't verified). It's evidence of media norms/pressure. Her incentive should be independent verification and framing, not conformity. Fails "unique credible evidence" (for truth), "cannot verify independently" (she hasn't tried), "incentives aligned" (often not for truth), and "possess judgment" (she should develop it via reporting).
  *   **Founder Pricing Round off "Insane" Term Sheets:** **IVP Predicts: Risky, Often Bad.** Other term sheets *are* unique evidence of *current market sentiment*. This is relevant data. **However:** If she believes they are "insane" (divorced from fundamentals she knows well), then the crowd's incentives may be misaligned (hype, FOMO) and she possesses superior judgment about her company's intrinsic value. Following the crowd here ignores her unique information and validates potentially irrational market dynamics. IVP leans towards it being irrational conformity if her judgment is sound.

  **The eBay/Fund Manager Dilemma:**

  *   **eBay:** Crowd behavior (bids) *is* unique evidence of *subjective value* in an auction (the relevant state). Bidders' incentives are aligned with revealing their true valuation (to win the item). The bidder lacks perfect knowledge of others' valuations. **IVP: Smart.**
  *   **Fund Manager:** Crowd behavior (buying) is *not* reliable evidence of *fundamental value* (the relevant state) in a bubble; it's evidence of momentum/herding. Incentives are often misaligned (short-term performance > long-term value). The manager *has* independent judgment ("sure is overpriced"). **IVP: Not Fine.**

  **Choosing Complexity:** The eBay/fund manager pair *forces complexity*. A simple principle (e.g., "always follow price signals") fails because market contexts differ fundamentally. **I pick the complex IVP.** It captures the crucial distinctions: the *nature of the evidence* the crowd provides (true value signal vs. self-referential momentum), the *alignment of incentives*, and the *decision-maker's access to independent judgment*. Flipping the fund manager verdict to "fine" would endorse dangerous herding behavior explicitly condemned in your gut and by financial logic.

  **IVP Verdicts vs. Your Gut:**

  *   **All your gut verdicts are salvaged by IVP.**
  *   **Deleted Review:** IVP agrees it's "fine, sort of" (mildly embarrassing). It passes the core test: others' experiences are unique evidence she can't easily refute independently, and reviewer incentives are reasonably aligned. The embarrassment stems from the social aspect, but rationally, it's updating based on new evidence about the product.

  **In essence:** Follow the crowd when it's a useful sensor for something you can't sense well alone, and the crowd is genuinely sensing that thing. Don't follow it when it's just copying itself, when you have a better sensor (your own expertise/judgment/data), or when the crowd's "sensing" is distorted by bad incentives. The epidemiologist, journalist, and often the founder, fail because they are substituting the crowd's *output* for their own required *independent input* and judgment.
