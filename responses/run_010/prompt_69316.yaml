answer: |-
  **1. S:** So the chief saves forty thousand lives by sacrificing three. He weighed the reasons correctly, and the act was justified. Why call it "dirty hands"? That just adds a murky layer of guilt-feeling on top of a clear consequentialist choice. The language pretends there's some extra moral cost, but it's just emotional noise or worse, a performance.

  **W:** The dirt isn't in his *feelings* or the justification; it's in the act itself. Deliberately killing innocents as a means to an end, even for overwhelming good, leaves a moral stain *on the deed*. The balance of reasons justifies the *choice*, but it doesn't cleanse the intrinsic wrong done to those three people. That wrongness is the residue.

  **2. S:** But what *is* that "intrinsic wrongness" beyond the fact that three people died avoidably? You've already admitted the consequences justified it. If the dirt is solely in the objective act of killing them, then *every* justified killing in war or self-defense would be dirty hands. That collapses the category into banality. Isn't the *only* thing left the agent's psychology?

  **W:** War or self-defense usually involves agents posing a threat; these farmers were entirely passive victims, used purely as an instrument to save others. That makes the act a distinct kind of wrong – a violation of their inviolability. The dirt is the *nature* of the act: sacrificing innocents. The guilt feeling *should* track this objective violation, acknowledging the debt incurred by that specific wrong, even if repaying it is impossible.

  **3. S:** But the chief *doesn't* feel guilty, and you say guilt *should* track the objective wrong. If the objective residue exists independently, why does its recognition depend on the agent's subjective feelings? If he feels nothing, is the residue gone? If not, what *is* it beyond a label we apply to acts we find distasteful despite their justification? Your "objective wrong" seems to dissolve without the psychological echo.

  **W:** The residue persists regardless of the agent's feelings. The chief’s lack of guilt is a *failure* to properly acknowledge the objective moral cost paid by the farmers. He sees only the net good, ignoring that a distinct, terrible thing *was done* to specific individuals. The dirt is the act's character; guilt is the *fitting* psychological response to recognizing that character, not the residue itself.

  **4. S:** Alright, perhaps he *should* feel conflict or sorrow – because the outcome, while necessary, involved a terrible loss he directly caused. But that's not unique guilt for a "dirty" act; it's the natural distress anyone decent feels after causing profound harm, even unavoidably. Calling it "dirty hands" implies a special moral category beyond this, a secret stain. It's redundant. He should feel sobered, responsible, perhaps haunted – but not morally guilty for a justified act.

  **W:** Conceding he should feel "sobered, responsible, haunted" *is* acknowledging a unique psychological burden tied to the *specific nature* of the act – choosing to directly kill innocents for the greater good. That burden *is* the residue manifest in the agent. It stems from the act's objective moral cost, which remains even when the choice was right. Calling it mere distress ignores its source in that specific moral violation.

  **5. S:** Fair, that specific act creates a unique psychological burden. But it's still just an *effect* of the horrific choice, not proof of an extra "moral remainder." The burden exists because he directly caused terrible harm he wished he hadn't, not because the act itself was mysteriously dirtier than the justification allows. "Guilt" smuggles in the idea he did something morally wrong *beyond* the harm, which he didn't. The vocabulary inflates psychological cost into phantom moral debt.
