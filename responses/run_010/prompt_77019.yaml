  ### Two-Player Epistemic Game Theory Example

  **States of the world:**  
  - **State H (High):** Favorable conditions.  
  - **State L (Low):** Unfavorable conditions.  

  **Actions for each player (P1 and P2):**  
  - **C (Cooperate):** Align with the state.  
  - **D (Defect):** Play safe.  

  **Payoff Matrices (P1, P2):**  
  - **State H:**  
    | P1\P2 | C     | D     |  
    |-------|-------|-------|  
    | **C** | 4,4   | 0,0   |  
    | **D** | 0,0   | 1,1   |  

  - **State L:**  
    | P1\P2 | C     | D     |  
    |-------|-------|-------|  
    | **C** | 0,0   | 0,0   |  
    | **D** | 0,0   | 2,2   |  

  **Prior belief:** Both states equally likely (Pr(H) = Pr(L) = 0.5).  

  **Source of information:** Truthful, known to be truthful. Reports the true state.  

  ---

  ### Scenario A: Public Report  
  - **Report:** "The state is H" (publicly announced).  
  - **Key feature:** Common knowledge of H (both know H, both know both know H, ad infinitum).  

  **Beliefs and Play:**  
  1. Both know state is H (from report).  
  2. Both know the other knows H (public announcement).  
  3. Both know the other knows they know H (common knowledge).  
  **Play in state H:**  
  - In state H, (C,C) yields (4,4) and is the Pareto-dominant Nash equilibrium.  
  - (D,D) is also a Nash equilibrium but Pareto-inferior (1,1).  
  - **Why (C,C) is uniquely selected?** With common knowledge, coordination on the Pareto-dominant equilibrium is focal (no ambiguity). Both play C.  
  **Outcome:** (C,C) → **Payoffs: (4,4)**.  

  **Why no other outcome?**  
  - (D,D) is Pareto-inferior and rejected under common knowledge.  
  - Asymmetric outcomes (e.g., (C,D)) are not equilibria in state H (P2 gets 0, would deviate to C for 4).  

  ---

  ### Scenario B: Private Report  
  - **Report:** "The state is H" (privately told to each player; neither knows if the other heard it).  
  - **Key feature:** No common knowledge. Each knows H but assigns 50% probability that the other is uninformed (holds prior).  

  **Beliefs and Play (true state is H):**  
  1. **P1’s perspective:**  
     - Knows state is H.  
     - Believes P2 is either:  
       - **Informed (prob 0.5):** Knows H → will play C (Pareto-dominant).  
       - **Uninformed (prob 0.5):** Uses prior → plays D (safe dominant action, see below).  
     - P1’s expected payoff if play C: (0.5 × 4) + (0.5 × 0) = 2.  
     - P1’s expected payoff if play D: (0.5 × 0) + (0.5 × 1) = 0.5.  
     - **P1 plays C** (maximizes expected payoff).  

  2. **P2 reasons identically → plays C.**  
  **Outcome:** (C,C) → **Payoffs: (4,4)**.  

  **Why not (D,D)?**  
  - If P1 thinks P2 is uninformed, P1 still prefers C (2 > 0.5). No incentive to unilaterally defect.  

  **Uninformed Player’s Behavior (if not told):**  
  - Assigns Pr(H) = Pr(L) = 0.5.  
  - Expected payoff for D:  
    - If other plays C: (0.5 × 0 in H) + (0.5 × 0 in L) = 0.  
    - If other plays D: (0.5 × 1 in H) + (0.5 × 2 in L) = 1.5.  
    - *Dominant strategy: Play D (safe, guarantees min 1).*  

  ---

  ### Comparison of Outcomes  
  - **State H (true state):**  
    - **Scenario A (public):** (4,4)  
    - **Scenario B (private):** (4,4)  
    - *Same outcome in H!* But we need harm in A. **Wait—this is a setup. We use state L to show harm.**  

  **Now, assume true state is L:**  
  - **Scenario A (public report "State is L"):**  
    - Common knowledge of L.  
    - In state L, (C,C) gives (0,0); (D,D) gives (2,2) and is the only Nash equilibrium (C is strictly dominated by D).  
    - Both play D. **Outcome: (2,2).**  

  - **Scenario B (private report "State is L"):**  
    - Each knows L, but neither knows if the other knows.  
    - **P1’s perspective:**  
      - Believes P2 is either:  
        - Informed (prob 0.5): Knows L → plays D (only rational action).  
        - Uninformed (prob 0.5): Plays D (safe dominant action).  
      - If P1 plays C: Gets 0 (if P2 plays D, as expected).  
      - If P1 plays D: Gets (0.5 × 2) + (0.5 × 2) = 2.  
      - **P1 plays D.**  
    - P2 reasons identically → plays D.  
    **Outcome: (D,D) → (2,2).**  

  **Still no difference!** The issue is that in state L, both scenarios yield (2,2). We need a twist.  

  ---

  ### Revised Payoffs to Achieve the Effect
  **Change State L payoffs to:**  
  | P1\P2 | C     | D     |  
  |-------|-------|-------|  
  | **C** | 0,0   | 0,0   |  
  | **D** | 0,0   | 1,1   |  *// Previously (2,2), now (1,1)*  

  **Now, in state L:**  
  - Scenario A (public): Still (D,D) → (1,1).  
  - Scenario B (private): Still (D,D) → (1,1).  

  **But in state H, Scenario B is the same as A. Where’s the harm?**  

  #### Key Insight: Add a "Trap" in State H  
  **Adjust State H payoffs to:**  
  | P1\P2 | C     | D     |  
  |-------|-------|-------|  
  | **C** | 4,4   | 0,2   |  *// P2 gets 2 if they defect while P1 cooperates*  
  | **D** | 2,0   | 1,1   |  

