    - Risk dominance: (D,D) is risk-dominant if (1−0) × (1−0) > (4−2) × (4−0) [simplified: 1 > 8? No. Standard: In 2x2, (D,D) risk-dominant if (D payoff - min when deviating) > (C payoff - min when deviating) for both players. Here: For P1: D gives maxmin 1, C gives maxmin 0. So D is safer. Players coordinate on (D,D).  
  **Outcome: (D,D) → (1,1).**  

  **Scenario B (private report "State is H"):**  
  - Each knows H, but assigns 50% chance the other is uninformed.  
  - **P1’s beliefs about P2:**  
    - Informed (0.5): Plays D (risk-dominant under common knowledge? But in private, no common knowledge of state. However, we need to define behavior).  
    - Uninformed (0.5): Plays D (safe action: in prior, D guarantees 1, while C risks 0).  
    - *P1 expects P2 to play D with probability 1.*  
  - P1’s best response to D: Play D (gets 1; if play C, gets 0).  
  - P2 reasons identically → plays D.  
  **Outcome: (D,D) → (1,1).**  

  **Still no difference!** We need one more adjustment.  

