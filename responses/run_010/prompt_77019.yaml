     - **Risk dominance in A:** Without common knowledge of rationality, (C,C) might occur. But the setup assumes rational players.  

  **Why not a reskin?**  
  - No iterated knowledge (like muddy children), no complex types (like email game). Just two players, two states, and the structure of the payoff matrix creates the effect.  
  - Mechanism rhymes with bank runs (strategic risk), but setting is mundane: a simple 2x2 game.  

  ---

  ### Summary  
  - **State H:** Public knowledge causes mutual defection (1,1), while private knowledge allows cooperation (4,4).  
  - **Why it works:** Public knowledge forces players to internalize coordination risk, while private knowledge lets them "gamble" on cooperation.  
  - **Core lesson:** Making information public can harm by enabling risk-dominant (but inefficient) play.
