answer: |-
  ## Office of Pairwise Review (OPR)  
  **Case-Management System v4.7 (Harmonic Build)**  
  **User Documentation: Overview & Operational Guidance**  

  **System Purpose:**  
  The Office of Pairwise Review (OPR) adjudicates the Reasonable Rejectability Status (RRS) of proposed Principles of Conduct (PoCs). A PoC achieves RRS only if, following exhaustive Case-Wise Comparison (CWC), no Affected Party (AP) possesses a Burden sufficiently severe such that another AP could not reasonably reject the AP’s objection to the PoC’s implementation. The OPR System automates the CWC process per the Statutory Comparison Mandate (SCM-08).  

  **Core Functionality:**  
  *   **Intake & Screening:** APs submit Burden Statements (BS) via Form RR-7.
  *   **Pairwise Engine:** Compares Burden Severity (ordinal rank: Catastrophic, Severe, Moderate, Minor, Negligible) between exactly two APs per SCM-08 §3(a).  
  *   **Resolution Matrix:** Generates a Rejection Feasibility Matrix (RFM) for the PoC.  
  *   **Audit & Compliance:** Full logging of all comparisons, resolution seeds, and Burden Classifications.  

  ---

  **Frequently Asked Questions (FAQ):**  

  1.  **How do I initiate a PoC Review?**  
      Submit Form RR-1 ("Principle Declaration") alongside all associated RR-7s ("Burden Statements"). Ensure each RR-7 lists *only* the AP’s specific Burden classification and grounds for objecting to the PoC’s application to *them*. Do *not* include totals or group designations.  

  2.  **Can I compare more than two Burdens at once?**  
      No. SCM-08 §3(a) requires "strict dyadic evaluation." The System rejects requests for multi-party comparison. Attempting summation triggers Error 47:  
      `ERROR 47: OPERATION 'SUM_BURDEN' NOT RECOGNIZED. BURDEN SEVERITY IS ORDINAL, NOT CARDINAL. REQUEST CONCEPTUALLY MALFORMED PER SCM-08 §3(a).`  
      *Support Note:* Burden Severity lacks quantitative units (e.g., "utils"). Ranking "Severe > Moderate" is valid; stating "2 Severe = Severe" is not. Summation implies cardinality, contravening statutory definitions.  

  3.  **How does the Comparable Magnitude Module (CMM) work?**  
      The CMM (§Module Gamma) permits Burden aggregation *only* when Burdens are deemed "of Comparable Magnitude" (CM) per Regulation GR-22. Users must flag potential CM Burdens during RR-7 intake using Field CM-8 ("Magnitude Cohort Request").  
      *Example:* Ten APs flagged with "Moderate (Persistent Migraine)" *may* be CM-cohorted. Ten APs flagged with "Moderate (Broken Wrist)" and one with "Severe (Blindness)" *cannot*, as "Broken Wrist" and "Blindness" are non-comparable. **User Guidance:** Cohorting requires user judgment. The System validates CM flags post-submission; non-CM aggregation triggers Error 89 (`INVALID COHORT: MAGNITUDE DISPARITY`).  

  4.  **What happens during a Balanced Dyad?**  
      If two Burdens are ranked equally severe and their objections are deemed mutually non-rejectable per CWC, the System invokes the Equipoise Resolution Protocol (ERP). This involves a cryptographically secure, audited random selection (Seed: System Clock + Case ID). The selected Burden’s objection is provisionally upheld. See §Audit Trail: ERP for seed values and RNG certification logs (NIST SP 800-90A compliant, annually re-certified).  

  5.  **How are Legacy Cases handled?**  
      Cases migrated from the decommissioned "Aggregate Burden Assessment System (ABAS)" are tagged `[LEGACY_ABAS]`. Burden classifications were mapped ordinally, but ABAS’s internal cardinal metrics were not preserved. **Known Issue:** Some `[LEGACY_ABAS]` cases exhibit intermittent RFM instability during re-processing. Resolution pending Patch H4.  

  ---

  **Worked Case Example: Support Ticket #11472**  
  *User Query:* "Testing PoC: 'Allow electrical transmitter to remain active despite injury risk to ensure broadcast continuity.' AP1: One worker suffering 'Severe (Catastrophic Electrical Injury)'. AP2: 5 billion viewers experiencing 'Minor (Temporal Deprivation: Final 3 mins of Broadcast)'. System stalls."  

  *OPR Support Response:*  
  1.  **Intake:** Valid. 1 x RR-7 (Severe), 1 x RR-7 Cohort Flagged (Minor, CM Cohort Size: 5,000,000,000). CM Validation: "Temporal Deprivation" deemed uniformly Minor & Comparable. Cohort approved.  
  2.  **Pairwise Process:** System must run CWC: AP1 (Severe) vs. Single Representative AP2 (Minor).  
      *   Result: Severe Burden > Minor Burden. Objection by AP1 cannot be reasonably rejected by AP2.  
  3.  **RFM Outcome:** PoC deemed *Universally Rejectable* (Status: UR-Red). Burden AP1 prevails.  
  4.  **Queue Note:** Estimated Processing Time displayed during submission: "~7.3 years (est. comparisons: 5e9)". Actual runtime was 3.2 seconds post-Cohort approval. CWC occurred once (Severe vs. Minor Representative).  
  *Resolution:* System functioned as designed. UR-Red status confirmed.  

  ---

  **Known Issues & Release Notes**  

  **v4.7.1 Patch Notes (Harmonic):**  
  *   ERP Audit Trail enhanced. Seed values now include environmental noise samples.  
  *   Improved validation of CM Cohort homogeneity flags in RR-7 submissions.  

  **Known Issues:**  

  *   **KI-114 (CMM Boundary Determination):** Users report difficulty consistently identifying the "Comparable Magnitude" threshold (§GR-22).  
      *   *Example 1:* Is "1000 x Moderate (Broken Arm)" comparable to "1 x Severe (Loss of Life)"? System requires user flagging; incorrect flagging (either way) leads to erroneous RFM. CMM logic cannot resolve this ex post.  
      *   *Example 2:* Distinguishing "Moderate (Intense Migraine; 4hrs)" from "Moderate (Mild Nausea; 4hrs)" for cohorting often requires arbitrary user discretion. System accepts either flag, potentially impacting downstream cohort aggregation validity.  
      *   *Status:* "Per Design." Boundary determination is a user responsibility per GR-22. Training module RR-CMM101 available.  

  *   **KI-202 (Legacy ABAS Migration Artefacts):** Certain `[LEGACY_ABAS]` cases, when re-processed through the CWC engine, yield RFM outcomes statistically divergent from their original ABAS dispositions. Divergence correlates weakly with original ABAS case size and complexity metrics (unavailable). Root cause analysis ongoing.  
      *   *Workaround:* None. Reprocess as standard OPR case.  

  ---

  **Intake Screening Rejections**  

  *   **Grounds for Doorstep Rejection (Form RR-7):**  
      *   Field `Obj_Type` = "Substantive Mistake" (e.g., "This PoC is morally wrong").  
      *   Field `Burden_Evidence` = "General Social Harm" (non-individualized).  
      *   Field `Affected_Scope` = "Hypothetical / Non-Identifiable APs".  

  *   **Standard Rejection Letter (Template RR-7-REJ):**  
      "The Office of Pairwise Review acknowledges your Burden Statement regarding Principle [PoC-ID]. However, your objection was registered under `Obj_Type: Substantive Mistake`. The OPR assesses only whether the *application* of a PoC generates a Burden *specific to you* that another Affected Party could not reasonably reject as grounds for opposing the PoC. Objections based on a PoC's general moral incorrectness fall outside statutory scope. Resubmission permitted with revised `Obj_Type`."  

  *   **Appeal Denial (Ticket #9981 Excerpt):**  
      *Appellant:* "But the PoC *is* substantively wrong! How can I object otherwise?"  
      *OPR Appeals:* "Appeal Denied. Grounds: Invalid `Obj_Type` persists. Rationale: See RR-7-REJ. **Note (Internal):** Appellant's core objection remains incommensurable with dyadic Burden comparison framework. Cannot be processed." *(Appellant not informed of this reason).*  

  ---

  **System Output Anomalies (Documented Per KI-114 & CWC Workflow):**  

  1.  **Indefensible Verdict:** PoC: "Redirect trolley from track with 1 AP (Severe Burden: Death) to track with 100 APs each suffering Minor Burden (Stubbed Toe)".  
      *   *Process:* CWC: Severe vs. Minor (Representative). Severe > Minor. Objection by the single AP cannot be reasonably rejected by the stubbed-toe cohort. PoC Status: **UR-Red (Rejectable)**.  
      *   *Why Indefensible?* The system ignores the *number* of Minor Burdens. CWC logic only sees Severity rank.  

  2.  **Defensible Verdict (Unarticulated Reason):** PoC: "Deny life-saving transplant to Patient A (Severe Burden: Death) to distribute medication causing Moderate Burden (6-month recovery) to 10,000 Patients B."  
      *   *Process:* CWC: Severe vs. Moderate (Representative Cohort). Severe > Moderate. Objection by Patient A cannot be reasonably rejected by Patients B. PoC Status: **UR-Red (Rejectable)**.  
      *   *Defensible Reason (Unstated by System):* The aggregated Moderate Burdens, while numerous, do not reach the severity threshold of the single Severe Burden *when only pairwise ordinal comparison is permitted*. The system correctly executes its rules but cannot express the non-aggregative intuition that saving a life outweighs *any number* of lesser harms. Its vocabulary is limited to "Severe > Moderate".
