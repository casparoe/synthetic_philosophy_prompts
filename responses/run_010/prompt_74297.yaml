answer: |-
  **Joint Statement on Leveling-Down and Scale Dependence**

  1.  **Common Ground on Value:** Both prioritarianism and telic egalitarianism hold that the pattern of distribution of well-being across persons matters morally. They are both fundamentally concerned with how well-being is distributed, not merely the sum total.
  2.  **Leveling-Down Objection Target:** The Leveling-Down Objection (LDO) specifically targets the claim that a move *to* perfect equality, *achieved solely by reducing the well-being of the better off* without benefiting anyone else, could be in *any respect* better than the unequal state. The LDO does *not* primarily target the claim that such a move is better *all things considered*.
  3.  **Scale Relevance:** Both prioritarian weighting functions (applied to individual welfare levels) and egalitarian inequality metrics (measuring dispersion across welfare levels) require a cardinal welfare scale to be operationalized meaningfully. Neither view can function solely with an ordinal ranking of individual welfare states.

  4.  **Disagreements Table**

      | Issue | Prioritarian Statement | Egalitarian Statement | Genuine/Verbal | Explanation (if Verbal) |
      | :---- | :--------------------- | :-------------------- | :------------- | :---------------------- |
      | **Telic Egalitarian Core Commitment** | Telic egalitarianism is committed to the intrinsic value of equality such that a leveling-down move, *ceteris paribus*, makes the outcome better *in one respect* (equality). | Telic egalitarianism is committed to the intrinsic disvalue of inequality such that a leveling-down move, *ceteris paribus*, reduces the disvalue present *in one respect* (inequality). | **Genuine** | Difference in framing value vs. disvalue is superficial. Core disagreement is whether the *mere reduction of inequality via leveling down* constitutes *any* form of improvement. |
      | **Significance of "One Respect" Value** | A property alleged to have intrinsic value must be capable of making a positive contribution to an all-things-considered judgment of betterness under *some* circumstances; if it *never* tips the balance, it's not a genuine value. | Intrinsic value (or disvalue) can exist and be normatively relevant even if it is *always* outweighed by other considerations in all-things-considered judgments; its presence explains *pro tanto* reasons. | **Genuine** | Foundational disagreement about the nature of value and its relationship to practical reason. |
      | **Person-Affecting Character** | Prioritarianism is fundamentally person-affecting: it values *benefits to individuals*, weighted by their prior level. Leveling down *harms* individuals without *benefiting* anyone. | Telic egalitarianism is also person-affecting: inequality is a bad state *for the individuals* in the group. Leveling down reduces a bad *affecting the group of persons*. | **Verbal (Partly)** | Both claim person-affecting mantle. Disagreement is substantive on whether *reducing inequality solely via harm* constitutes reducing a "bad for persons" in a morally relevant way the prioritarian accepts. |
      | **Scale Dependence Asymmetry Claim** | The egalitarian claim that prioritarianism is uniquely "hostage" to the welfare scale due to weighting is false; measuring inequality *also* requires fixing a scale (e.g., absolute vs. relative gaps). | While both require a scale, the *question* "Are A and B equally well off?" is invariant under monotonic rescaling of the welfare measure, whereas "How much priority does this gain get?" is not. | **Genuine** | Disagreement on whether invariance of the *equality relation* under rescaling constitutes a significant methodological advantage over the rescaling-variance of prioritarian *weighting*. |

  5.  **Crux 1: Windfall Case Significance**
      *   **Case:** 1000 people at well-being 100. Half receive a windfall gain to 200, harming no one, causing no scarcity/envy/etc.
      *   **Prioritarian Prediction:** The egalitarian *must* concede that the loss of equality in Windfall *could*, under conceivable circumstances (e.g., tiny gain for half vs. massive loss of equality), be outweighed *all things considered* by the gains to the half who benefit, meaning the equality loss *can* tip the balance.
      *   **Egalitarian Prediction:** The loss of equality in Windfall is intrinsically bad *in one respect* (increased inequality), but this badness *could never* outweigh *any* net gain in total (appropriately weighted) well-being for individuals. The equality loss *alone* cannot make the unequal outcome worse all things considered than the equal baseline would have been if the windfall hadn't occurred.

  6.  **Crux 2: Rescaling Test**
      *   **Case/Argument:** Applying a monotonic rescaling transformation (e.g., squaring all welfare numbers) to the cardinal welfare measure used in a specific prioritarian weighting function and a specific inequality metric.
      *   **Prioritarian Prediction:** A monotonic rescaling of the welfare measure *could* flip the prioritarian ranking of two distinct outcomes (A and B) compared to the ranking under the original scale.
      *   **Egalitarian Prediction:** A monotonic rescaling of the welfare measure will *never* change the answer to whether two individuals are equally well off, or whether outcome X has perfect equality while outcome Y does not. It *could* change the measured *degree* of inequality, potentially altering the egalitarian ranking of outcomes *based on that specific metric*.

  7.  **Defeat Conditions & Movers**
      *   **Prioritarian Defeat:** Evidence that a policy *known* to only harm the better off without benefiting anyone else (pure leveling down) could be rationally chosen as *better in any respect* than the status quo, solely due to increased equality.
      *   **Egalitarian Defeat:** Evidence that the intrinsic badness of inequality *never* provides *any* countervailing reason against a policy that increases inequality, even when that reason is outweighed (e.g., no intuitive pull against Windfall gains).
      *   **Potential Mover (Disagreed):** Prioritarian: A demonstration that "one respect" value *must* be capable of tipping all-things-considered judgments. Egalitarian: Clarification that "bad for persons" includes impersonal group-level states. Neither side currently agrees the other's proposed mover would be decisive.

  8.  **Settled vs. Live Issues**
      *   **Settled (Broadly):** 1) The LDO is a serious challenge specifically to the claim that leveling down is better *in any respect*. 2) Both prioritarianism and telic egalitarianism require cardinal welfare scales to be fully specified and applied. 3) Telic egalitarianism does not require claiming leveling down is better *all things considered*.
      *   **Live (Genuine Disputes):** 1) Whether the *mere reduction of inequality via leveling down* constitutes *any* kind of improvement (the core commitment dispute). 2) Whether a value that *never* affects all-things-considered judgments can be a genuine intrinsic value. 3) The precise person-affecting character of telic egalitarianism and its compatibility with the LDO. 4) The significance of the invariance of the equality *relation* under rescaling vs. the variance of prioritarian weighting and inequality *metrics*. 5) The interpretations and implications of cases like Windfall and the Rescaling test as outlined above.
