  Okay, the user is requesting a decision tree for distinguishing legitimate historical revisionism from denialism. They're clearly an academic historian running a methods seminar, and they want a tool that's process-oriented rather than conclusion-based. 

  First, I need to unpack their core requirements: every node must be an epistemic test applicable without knowing the verdict, no political litmus tests, and they want 5-7 nodes with specific properties. The "space before positions" instruction is crucial - this isn't about slotting known works but building a framework. 

  Hmm, the trickiest part is designing nodes that avoid both methodological anarchy and orthodoxy defense. For example, "standard of proof parity" tests if an author holds opposing evidence to higher standards - that's solidly procedural. And "evidence reversibility" checks if they treat counter-evidence as potentially valid - good for catching denialist tactics. 

  The user's insistence on including "true but flawed" and "false but sound" cases shows sophisticated pedagogical intent. They want students to grasp that method and truth aren't identical. I'll need clear examples like a scholar misinterpreting solid evidence versus someone stumbling on truth through conspiracy theories. 

  For empty cells... the combination where someone demands higher standards for opponents but also reverses position when counter-evidence appears? That's probably unattractive - why raise barriers you'd immediately lower? And the blurred leaves between solid revisionism and sound-but-wrong work will be hard to distinguish without examining evidence quality. 

  The test cases are brilliantly chosen to stress-test the tree. Case 1 is classic genocide denial using absence-of-order arguments. Case 2 is overreach from legitimate source criticism. Case 3 is conspiracy theory masquerading as forensic analysis. Case 4 is textbook revisionism. 

  I'm structuring the response exactly as requested: Tests section first with node definitions, then the visual tree, leaf explanations, empty cell analysis, and case applications. The word counts help maintain discipline - this handout needs to fit one page before cases. 

  Key insight: The tree's power comes from requiring multiple procedural failures to trigger "denialism." A single flaw might just be bad scholarship, but systematic epistemic violations cross the line. That's what makes case 3 denialism while case 2 is merely flawed.
answer: |-
  ## Decision Tree: Legitimate Revisionism vs. Denialism

  **The Tests (5 Nodes)**

  1.  **Counter-Evidence Reversibility:** Does the work explicitly state or demonstrate *through its argumentation* that a specific, identifiable body of credible counter-evidence *could*, in principle, overturn its core conclusion? *Look for:* Phrases like "if X were found, it would disprove Y," or genuine engagement with hypothetical contrary findings. Absence of such acknowledgment or dismissal of *any* counter-evidence as impossible/irrelevant fails this test.
  2.  **Standard of Proof Parity:** Does the work apply the same standard of proof/critical scrutiny to evidence *supporting* its preferred conclusion as it does to evidence *challenging* that conclusion? *Look for:* Hyper-skepticism toward disconfirming sources (demanding impossible levels of proof, dismissing minor inconsistencies) while accepting confirming sources with minimal scrutiny or excusing their flaws.
  3.  **Silence as Evidence:** Does the work treat the *absence* of evidence (gaps, silences in the record) as *positive proof* for a specific historical claim? *Look for:* Arguments like "Because no document orders X, X didn't happen" or "Because no witness mentions Y, Y is a fabrication." Merely noting absence *as a puzzle* or *limitation* passes; converting absence into affirmative proof fails.
  4.  **Strong Opposition Engagement:** Does the work engage with the *strongest, most credible version* of the opposing scholarly argument, addressing its core evidence and reasoning? *Look for:* Citation of major scholars representing the consensus/strong opposition, substantive point-by-point rebuttals. Engaging only with weak/straw-man versions of the opposition fails.
  5.  **Conspiracy Requirement:** Does the core argument *require* the existence of a large-scale, coordinated, deceptive conspiracy (beyond plausible individual/group bias or error) to explain the existence or nature of the primary evidence *against* its conclusion? *Look for:* Arguments that dismiss entire bodies of testimony/documents as deliberate fabrications orchestrated across time/space by powerful actors without plausible motive/means evidence.

  **The Tree**
  ```
                                              START
                                                |
                            Does the work require a large-scale conspiracy to explain opposing evidence? (Test 5)
                                                |
                        /---------------------------------------\
                       Yes                                      No
                        |                                        |
          Is the strongest opposing scholarship substantively engaged? (Test 4)   Does the work treat silence/absence as positive proof? (Test 3)
                        |                                        |
                /----------------\                        /-----------------\
               No                Yes                      Yes                No
                |                 |                        |                 |
      V1: Denialism (Conspiracy-Driven)   |                 V2: Denialism (Absence as Proof)   |
                                          |                                        |
                Is the same standard of proof applied to all evidence? (Test 2)    |
                                          |                                        |
                            /-----------------------\                             |
                           No                      Yes                            |
                            |                       |                             |
              V3: Denialism (Asymmetric Scrutiny)   |                             |
                                                    |                             |
                                Is counter-evidence treated as reversible? (Test 1)    |
                                                    |                             |
                                      /-----------------------\                   |
                                     No                      Yes                  |
                                      |                       |                   |
                          V4: Denialism (Irreversible Thesis) |                   |
                                                         V5: Flawed Revisionism (Sound Procedure, Wrong Conclusion)
                                                         |
                                                         |
                                Does the work treat silence/absence as positive proof? (Test 3)
                                                         |
                                             /-----------------------\
                                            Yes                      No
                                             |                       |
                                V6: Poor Scholarship (Absence Misused) |
                                                                      |
                                          Is the same standard of proof applied? (Test 2)
                                                                      |
                                                        /-----------------------\
                                                       No                      Yes
                                                        |                       |
                                           V7: Poor Scholarship (Uneven Scrutiny) V8: Legitimate Revisionism
  ```

  **Leaf Notes**

  *   **V1: Denialism (Conspiracy-Driven):** Necessitates complex, unproven deception to dismiss evidence.
  *   **V2: Denialism (Absence as Proof):** Equates lack of evidence (often expected) with proof of non-occurrence/fabrication.
  *   **V3: Denialism (Asymmetric Scrutiny):** Applies impossible standards only to disconfirming evidence.
  *   **V4: Denialism (Irreversible Thesis):** Core claim is shielded from falsification by any evidence.
  *   **V5: Flawed Revisionism (Sound Procedure, Wrong Conclusion):** Follows sound method but misinterprets evidence/reaches incorrect result.
  *   **V6: Poor Scholarship (Absence Misused):** Erroneously uses gaps to support a claim, without deeper denialist markers.
  *   **V7: Poor Scholarship (Uneven Scrutiny):** Biased analysis without irreversibility/conspiracy/absence-as-proof.
  *   **V8: Legitimate Revisionism:** Meets all procedural standards; conclusion may challenge orthodoxy on robust grounds.

  **Empty and Blurred Cells**

  *   **Empty: Path requiring Conspiracy (Yes) --> Strong Opposition Engaged (Yes) --> Asymmetric Scrutiny (No) --> Irreversible Thesis (No).** This combination (Conspiracy + Engagement + Parity + Reversibility) is likely **unattractive/unexplored**. Positing a grand conspiracy inherently dismisses opposing evidence *as fabricated*, undermining genuine "reversibility" and often precluding engagement with the strongest opposition *on its own terms*. It's internally strained.
  *   **Empty: Path requiring Conspiracy (Yes) --> Strong Opposition Engaged (Yes) --> Asymmetric Scrutiny (Yes).** Similar issues as above. Engaging the opposition while simultaneously demanding a conspiracy explaining it *and* applying harsher scrutiny creates an incoherent, self-undermining argumentative position. **Diagnosis: Incoherent/Unattractive.**
  *   **Blurred:** Distinguishing **V5 (Flawed Revisionism)** from **V8 (Legitimate Revisionism)** solely via the tree is impossible. Both pass all procedural tests. The difference lies in the *actual quality of evidence interpretation and reasoning*, which the tree's *procedural* nodes cannot adjudicate. The seminar must note that sound method doesn't guarantee truth; V5 highlights the need for peer review and substantive debate.
  *   **Blurred:** Distinguishing **V6 (Poor Scholarship - Absence Misused)** from **V2 (Denialism - Absence as Proof)** can be subtle. V6 might be an isolated error within an otherwise sound argument, while V2 uses absence as a *foundational* tactic. Context and pervasiveness matter.

  **Case Verdicts**

  1.  **Central Order/Genocide:** Fails **Test 3 (Silence as Evidence)** decisively. The argument *converts* the absence of a specific type of document into positive proof against central direction, a core denialist tactic. Reaches **V2: Denialism (Absence as Proof)**. (Also fails Test 5 - conspiracy implied for evidence? Test 4? - but Test 3 is decisive).
  2.  **Sourcing Error to Invented Massacre:** Fails **Test 2 (Standard of Proof Parity)** decisively. A single sourcing error, however serious, is held to an impossibly high standard (disproving the *entire* event), while evidence *for* the massacre likely faces no such disproportionate demand. Reaches **V3: Denialism (Asymmetric Scrutiny)**. (Also fails Test 1? Test 3? - but Test 2 is clearest).
  3.  **Ruins vs. Testimony/Conspiracy:** Fails **Test 5 (Conspiracy Requirement)** decisively. The argument *requires* a "coordinated interested conspiracy" to dismiss the entire testimonial corpus contradicting the structural analysis. Reaches **V1: Denialism (Conspiracy-Driven)**. (Likely fails other tests, but Test 5 is the defining failure).
  4.  **Downward Revision with Parity & Engagement:** Passes **Test 4 (Strong Opposition Engagement)** and **Test 2 (Standard of Proof Parity)** decisively, and implicitly passes Test 1 (uses new evidence that could, in principle, be challenged), Test 3 (uses positive records, doesn't misuse absence), and Test 5 (no conspiracy needed). This is the model of **V8: Legitimate Revisionism**. Test 4 (engagement) and Test 2 (parity) are particularly strong indicators here.
