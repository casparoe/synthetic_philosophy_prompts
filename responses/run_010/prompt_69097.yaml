  Key traps to skirt: her habit of rebuffing questions that use mechanistic language. For example, asking "why negative valence?" risks her saying "you’re importing anthropocentric concepts." Solution? Anchor the valence asymmetry question in *her* analogy to human frustration (pressure point 1), and for the frustration criterion (pressure point 2), attack using her terms: "If frustration = suffering, doesn’t that make equilibrium states maximally suffering?" 

  The unowned suffering question (pressure point 3) needs care. Asking "bad for whom?" might invite "you’re assuming subjects exist!" Instead, tie it to her moral conclusion: "If suffering is cosmically bad without subjects, does rescuing a child matter less?" This forces engagement. 

  For the weighting problem (pressure point 4), he’s right to anticipate her dodging comparison. The workaround: ask whether micro-suffering’s *sheer quantity* obligates us to prioritize it—pushing her to defend why biological suffering isn’t negligible. 

  The temperamental disagreement question (pressure point 5) is sharp. Highlighting a colleague who shares her structuralism but not pessimism pressures her to concede bias or find a non-arbitrary distinction. 

  Practical consequences (pressure point 6) must corner her: "Does this imply futility in helping animals/humans?" *and* "Should we wish the universe didn’t exist?"—in one question. Brutal but necessary. 

  The falsifiability question will sting. Phrase it as: "What evidence could *in principle* change your mind?" If she says "nothing could," it reveals dogma; if she offers something, it might crumble under scrutiny. 

  Cutting question? Probably the combination/scaling one—it’s complex for audio and less central than valence/frustration. Save the moral consequences and falsifiability as climaxes. 

  Structure logic: Start with valence (easiest entry), then frustration criterion (core mechanic), then build to moral implications before the fatal "how could you be wrong?" Finale. All setups must include "physics describes what things do, not what they are" for new listeners. 

