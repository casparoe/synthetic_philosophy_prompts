  Here is her record, as near as I can reconstruct it from two decades of kill notices and marginalia:

  1. **Baby Boomers (1946–1964):** a real kind, in the strong sense. Her reasons: a dated, society-wide shift in fertility plus terms of entry into the labor and housing markets that struck everyone in the bracket at the same life stage, and the fact that its members were speaking and organizing as a cohort within a decade of leaving school.
  2. **The Silent Generation (1928–1945):** not a real kind — "a residual bracket drawn to fill white space on a chart."
  3. **Generation X (1965–1979):** real, but only *thin*. Her gloss: they share a childhood environment — unsupervised afternoons, a divorce spike, no youth institution addressing them — but never became a collective actor. A thin kind, she says, is a genuine causal cluster that never acquired agency.
  4. **Millennials (1981–1996):** real, strong sense. Her gloss: the first cohort addressed *as a cohort* by universities, employers, pollsters and media while its members were still adolescents — and they answered to the address.
  5. **Generation Z (1997–2012):** real, but she holds that the 1997 start date is a chart artifact. The boundary she would defend is the first birth year for which a networked, front-camera, algorithmically-fed phone was the default object of childhood, which she puts a couple of years earlier than the conventional date.
  6. **"Zillennials" (the 1993–1998 cusp):** not real — "a marketing shim" — despite vigorous and sincere self-identification by the people in it. Her gloss: identification is not sufficient; people can attach themselves to a bracket that isn't there.
  7. **The high-school class of 2020:** real, and strongly real, though it has no name and nobody sells to it, because the cancellations of that spring landed at one precise, unrepeatable life stage on everyone in it simultaneously.
  8. **Children in kindergarten through second grade in September 2020,** learning to read through masks and remote instruction: real; she would carve them out of any wider bracket and predicts they will be legible in reading data for a decade.
  9. **"iPad kids":** not real, notwithstanding that millions of parents use the phrase. Her gloss: screen exposure is a graded variable, not a shared dated condition, and a variable cannot have boundaries.
  10. **The Strauss–Howe machinery** — roughly 21-year turnings inside an ~85-year saeculum, four recurring generational personas: she rejects it as unfalsifiable, yet concedes that the near-regular arrival of a new named generation every fifteen to twenty years is itself evidence that the naming practice has causal force.
  11. **An immigration arrival cohort (2014–2019 arrivals):** she will use it in analysis but refuses to call it a generation, on the ground that arrival date and birth date answer different questions.

  What I want from you is not a view about whether Gen Alpha is real, but a reconstruction of Ruth. Predict her verdict on the proposed section and bracket; identify the closest precedent in her record and say why it governs rather than merely resembling; lay out the three to six candidate rules that fit her eleven rulings about equally well, and show where they come apart on this case. Note in particular that her word "real" seems to do two different jobs across the record — causal cluster on one hand, collective agent on the other — and tell me which job she is doing in which ruling, since I suspect the whole dispute turns on that slide. Then give me the one further case that would discriminate between your top two candidate rules, tell me what principle our newsroom would be adopting if we overruled her, and give me the objection she is most likely to make to the newsletter plan that I have not thought of. If her record genuinely underdetermines the verdict, say so in the relevant field rather than manufacturing a tiebreaker; I would rather take an honest coin-flip into the meeting than a confident fiction.

