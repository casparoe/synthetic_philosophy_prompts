prompt: |-
  I've been using a piece of decision theory as a general-purpose norm, and I want to check it against my own case-by-case verdicts to find out which of the two has to give.

  The norm is Good's theorem in the form it's usually taught in decision analysis: the value of free information can never be negative, because an agent who learns something can always ignore it and choose as if uninformed. My working gloss has been stronger than the theorem, and probably sloppier: refusing to look is never the rational option — it may be understandable, or forgivable, but it is never what the calculation recommends.

  Here are the cases and what I actually judge.

  1. Untreatable. A free, perfectly reliable test for a late-onset degenerative condition with no treatment, no preventive measures, and nothing that turns on when the diagnosis is made; my prior is roughly even. I would decline the test, and I would pay to have an already-drawn sample destroyed rather than sequenced. I do not regard this as a failure of nerve.

  2. Treatable. Everything the same, except that early detection permits treatment that substantially changes the course of the disease. I would take it, and pay for the privilege.

  3. The race. I bet on a horse an hour ago. The result is settled, my payoff is unaffected by anything I now do, and someone offers to tell me for free. I would rather not know until the money arrives.

  4. The shipment. A package has either shipped or it hasn't, nothing I can do about either, and I check the tracking page several times a day and would pay for a notification.

  3 and 4 are the pair I cannot reconcile. Both are free, both concern matters wholly outside my control, neither changes any act available to me, and in both the only thing at stake is how it feels to know. Yet in one I want the surprise and in the other I want the news, and I resist the thought that the difference is nothing but temperament. If that is all it is, I'd rather be told plainly than have it absorbed into a clause.

  5. The leak. I am negotiating to buy a property, and an acquaintance at the seller's firm will tell me the seller's true reserve price for free. The seller's side, however, will learn that a leak occurred and that I am the likely recipient. I think knowing actively costs me money here.

  6. The inadmissible fact. I am on a jury. Before trial someone offers to tell me something about the defendant's past that I know is legally inadmissible, that I judge irrelevant to the charge, and that I know will nonetheless move my estimate of guilt. I would refuse — not because the fact is distressing, but because I do not trust my own updating.

  7. The cheesecake. I have undertaken a month without sugar. A flatmate offers to tell me free of charge whether there is cheesecake in the fridge. I am confident that if I learn there is, I will eat it, and that my later self will count that as a failure. I would pay not to be told.

  8. The predictor. A very accurate predictor of my choices decides in advance whether to deposit ten thousand dollars in an account I control, and deposits it only if it predicted I would decline to be told the account's contents. I am then offered a free and reliable report of whether the deposit was made. I take declining to be the rational choice, and I do not think the case is exotic — I think it isolates something. I also suspect 5 and 8 are the same case with the social machinery stripped away, and I want to know whether that is right.

  9. The register. A free screening whose positive result would be entered in a shared medical register and would make me uninsurable for a policy I currently intend to buy. I would refuse. But I notice this looks like case 1 with an extra step, and the explanation I want to give here — the information removes options — is not the explanation I gave there, which was simply that I do not want to know. I want to be told whether case 1 collapses into case 9 or whether something survives the collapse.

  What I would like from you:

  - State the theorem as precisely as you can, enumerating its assumptions rather than its slogan: what it requires of the act set, of how the agent updates, of whether the outcomes themselves may depend on the learning, and of who is evaluating and at what time. Flag where the "you can always ignore it" step is doing real work, since I suspect that step is quietly assuming something about me that several of my cases deny.
  - Test my gloss. If there is a principle that delivers all nine verdicts, state it clause by clause and say which case each clause exists to handle. If it can be made to work only by accumulating enough clauses that it stops being a principle and becomes a list of my prejudices, say so and give me the simpler principle instead, with the casualties identified.
  - Distinguish verdicts that merely need a new clause from verdicts that contradict each other and force a choice. I expect the pressure to be at 3/4 and at 1/9, but I may be wrong about where it lies, and I'd like the diagnosis rather than my own guess back.
  - Tell me which of my verdicts you would overturn, and what makes the surviving cases something other than my preferences laundered through a principle.
  - Apply whatever principle you end up defending to three cases I have not listed: declining to learn the sex of one's own child before birth; checking the market value of a long-run portfolio daily when the only decision is a fixed allocation; and accepting a free, reliable evaluation of one's own teaching from people whose opinion of you it will change.
  - Finally, cases 6 and 7 both turn on a disagreement between my earlier self and my later self, and the theorem appears to side with whichever of them happens to be doing the arithmetic. Tell me whether "the value of information" is even a well-defined quantity across that kind of change, or whether the question I opened with is malformed in a way that would have saved me the trouble.

  I am not after the literature on any of this. I want the principle, its clauses, its casualties, and its predictions.
reasoning: |-
  We are going to address the user's query step by step.

  ## Step 1: State Good's theorem precisely

  Good's theorem (1967) states that the expected value of information (EVOI) is non-negative for a rational agent under the following assumptions:

  1. **Act Set**: The agent has a fixed set of available acts (choices) that they can take, and these acts do not change upon receiving the information.
  2. **Outcomes**: The outcomes of acts depend on the state of the world and the act chosen, but not on the fact of having learned the information (unless the act of learning itself has consequences, which it doesn't in the "free" case).
  3. **Updating**: The agent updates their beliefs via Bayesian conditioning upon receiving the information.
  4. **Utility**: The agent has a utility function over outcomes that is fixed and does not change with the information.
  5. **Rationality**: The agent is rational in the sense of maximizing expected utility at every stage.

  The theorem then says: 
  - Let the agent's current expected utility without the information be EU_0.
  - After receiving the information (a signal that may reveal some state of the world), the agent updates and chooses an act that maximizes expected utility conditional on the signal. The expected utility after receiving the information (but before the signal is known) is the average of the maximum expected utilities over the possible signals, weighted by the probability of each signal.
  - Then, EVOI = EU(with information) - EU(without information) >= 0.

  The key step: "you can always ignore it" means that if the information does not lead to a better act, the agent can still choose the act they would have chosen without the information. Therefore, the worst that can happen is that the information is useless and the agent gets the same utility as before. Hence, the information cannot make the agent worse off.

  However, note that the theorem assumes:
  - The information is free (no cost) and does not change the outcome by itself (only through the act chosen).
  - The updating is correct (Bayesian).
  - The agent's utility function does not change as a result of the information.

  ## Step 2: Identify where the gloss fails and the theorem's assumptions are violated

  The user's gloss: "refusing to look is never the rational option" is stronger than the theorem. The theorem says that the information has non-negative expected value, but it does not say that the agent must always take it. The agent might be indifferent if the value is zero. However, the gloss implies that refusing is irrational. But note that if the EVOI is zero, then taking the information or not is equally good. 

  But the cases provided by the user often violate the assumptions of Good's theorem. Let's examine the cases:

  ### Case 1: Untreatable
  - Why decline? Because knowing the bad news would cause disutility (anxiety, dread) without any offsetting benefit. The outcome (the disease progression) is not changed by knowing, but the utility of the state of knowing is lower than not knowing. This violates the assumption that the utility function is only over the state of the world and the act, and not over the information state. In other words, the agent has a preference for ignorance.

  ### Case 2: Treatable
  - Taking the test is rational because the information allows for an act (treatment) that changes the outcome. This fits the theorem.

  ### Case 3: The race
  - The user would rather not know the outcome until the money arrives. The information does not change any act (the bet is already placed). The user prefers the suspense or the surprise. Again, the utility of the state of knowing the outcome is lower than not knowing until later. This violates the utility assumption: the utility function is not just over the outcome (win/loss) but also over the timing and manner of learning.

  ### Case 4: The shipment
  - The user wants to know. Again, no act is changed. But the user prefers to know for peace of mind or planning. The utility of knowing is higher than not knowing.

  ### Case 5: The leak
  - Knowing the reserve price causes the seller to know that there was a leak and that the user is the likely recipient. This changes the seller's behavior (which is part of the state) and thus the outcome (the negotiation). So the act of learning has a causal effect on the outcome. This violates the assumption that the information is free and without side effects.

  ### Case 6: The inadmissible fact
  - The user does not trust their own updating. This violates the Bayesian updating assumption. The user believes that upon learning the fact, they will update in a way that is not justified (they will be biased) and thus make a worse decision. So the agent is not a perfect Bayesian updater.

  ### Case 7: The cheesecake
  - The information will lead the user to eat the cheesecake, which they have committed to avoid. The later self will count it as a failure. This is a case of changing preferences (or self-control) over time. The current self does not want the information because it will lead to an act that the current self disprefers. The theorem assumes a fixed utility function and that the agent at the time of acting will maximize the same utility. But here, the later self upon learning will have a different revealed preference (eating the cheesecake) than the earlier self's planned commitment.

  ### Case 8: The predictor
  - This is a Newcomb-like problem. If the predictor is accurate, then if the user decides to learn the account's contents, the predictor would have predicted that and not deposited the money. Therefore, the user ends up with $0. If the user declines, the predictor would have predicted that and deposited the money, so the user gets $10,000. But note: the user is offered a free report of whether the deposit was made. If the user takes the report, then the predictor would have predicted that and not deposited the money (so the report will say "no deposit"). If the user declines the report, the predictor would have predicted that and deposited the money. Therefore, the rational choice is to decline the report. This case violates the assumption that the act of learning does not causally affect the state. The state (whether the money is deposited) is set by the prediction of the user's choice, so the act of learning is not free of consequences.

  ### Case 9: The register
  - The test result is recorded and shared, which causes the user to become uninsurable. This is not about the utility of knowing but about the direct consequence: the information being shared changes the state of the world (the user's insurability). This violates the assumption that the information is free and without side effects.

  ## Step 3: Testing the gloss

  The gloss "refusing to look is never the rational option" fails in several cases:

  - Case 1: The user has a preference for ignorance because the knowledge itself causes disutility.
  - Case 3: The user prefers the surprise.
  - Case 5: The information has a negative side effect.
  - Case 6: The user does not trust their own updating.
  - Case 7: The information leads to a self-control problem.
  - Case 8: The act of learning is causally linked to the outcome (via prediction).
  - Case 9: The information has a negative side effect (being recorded).

  In these cases, the EVOI might be negative due to violations of the theorem's assumptions.

  ## Step 4: A principle that delivers all nine verdicts?

  We can try to formulate a principle that accounts for these cases:

  **Revised Principle**: The value of information is non-negative if and only if:
  (a) The information is free (no direct cost and no side effects on the outcome).
  (b) The agent updates beliefs correctly (Bayesian) and without bias.
  (c) The utility function is defined solely over the outcomes of acts and the state of the world, and does not depend on the information state (i.e., the agent has no preference for knowing or not knowing per se, only for the outcomes).
  (d) The set of available acts remains unchanged, and the acts do not include the act of learning itself having consequences (as in Case 5, 8, 9).
  (e) The agent's utility function is stable over time (no changing preferences or self-control issues).

  But note: the user's cases break (a), (b), (c), (d), and (e). Therefore, the principle becomes a list of exceptions.

  Alternatively, we can state a more general principle:

  **General Principle**: The value of information is the expected improvement in decision-making minus any costs (including psychological costs, side effects, and biases) that come with the information.

  But then we lose the non-negativity.

  ## Step 5: Distinguishing verdicts that need a new clause vs. contradictions

  The user is particularly puzzled by cases 3 and 4. Both are about knowing for the sake of knowing, but one is desired and the other not. This is not a contradiction because the utility of knowing can be positive (case 4) or negative (case 3) depending on the context and the individual's preferences. The theorem does not cover this because it assumes utility is independent of the information state.

  Cases 1 and 9: In case 1, the reason is purely the disutility of knowing. In case 9, there is an additional side effect (the register). So they are not the same. Case 1 violates (c) and case 9 violates (a) and (d). But note: if we account for the disutility of knowing, then case 1 is explained by (c). Case 9 has that too, but also the side effect. So they are similar but not identical.

  ## Step 6: Which verdicts to overturn?

  If we stick to the original Good's theorem, we would have to overturn:

  - Case 1: The disutility of knowing is not accounted for. The theorem would say: take the test because you can ignore it? But ignoring doesn't help because the state of knowing is already there. So we cannot avoid the disutility. Hence, we must allow the utility to depend on the information state and then the EVOI might be negative.
  - Case 3: Similarly, the utility of suspense is not accounted for.
  - Case 5, 8, 9: The information has side effects. The theorem assumes no side effects.
  - Case 6: The agent is not a perfect Bayesian. The theorem assumes perfect updating.
  - Case 7: The utility function is not stable (the later self has a different revealed utility).

  But the user's judgments are reasonable. Therefore, we should extend the model to account for these and then the verdicts can stand.

  ## Step 7: Applying the defended principle to new cases

  We'll use the revised principle that allows for:

  - Utility to depend on the information state (so knowing can be good or bad per se).
  - Information can have side effects (so it might not be free).
  - The agent might have self-control issues or changing preferences.

  **New Cases**:

  1. **Declining to learn the sex of one's own child before birth**: The user might decline because they prefer the surprise (like case 3) or because they fear gender disappointment and want to avoid it until birth. This would be rational under the extended principle if the utility of knowing is negative.

  2. **Checking the market value of a long-run portfolio daily**: The user might check because they get utility from knowing (like case 4) or because they fear they might act on the information (even though they have a fixed allocation). If they are prone to acting impulsively (like case 7), then not checking might be better. But if they can stick to the fixed allocation, then checking might be harmless and provide peace of mind. So it depends on the agent.

  3. **Accepting a free, reliable evaluation of one's own teaching**: If the agent is confident in their updating and there is no side effect (like the opinion of others changing? But the case says it will change their opinion of you, so there might be a side effect). If the evaluation is private and the agent can use it to improve, then it is like case 2. But if the evaluation being known by others might lead to negative consequences (like being fired), then it is like case 5 or 9. If the agent fears the evaluation might be demoralizing, then it is like case 1.

  ## Step 8: Cases 6 and 7 and the definition of value of information

  In cases 6 and 7, the issue is that the agent at the time of deciding whether to learn is at odds with the agent at the time of acting. The theorem assumes a single unitary agent. When there are multiple selves, the value of information might not be well-defined because the utility function changes. The agent at time t0 (deciding whether to learn) has a different utility function (or commitment) than the agent at time t1 (after learning). Therefore, the value of information from the perspective of t0 might be negative even if at t1 the agent would maximize their t1 utility. The theorem does not account for this.

  ## Conclusion

  - The gloss "refusing to look is never the rational option" is too strong. The theorem requires a set of assumptions that are violated in many of the cases.
  - A revised principle must account for:
    - Side effects of learning (Cases 5, 8, 9).
    - Utility of knowing/ignorance (Cases 1, 3, 4).
    - Imperfect updating (Case 6).
    - Changing preferences or self-control (Case 7).
  - The theorem is not malformed in cases 6 and 7, but it does not apply because the agent is not unitary and the utility function is not stable.

  ## Final Answers

  1. **Theorem stated precisely**:
     - Assumptions: fixed act set, no side effects of learning, Bayesian updating, fixed utility over outcomes (not information states), and the agent is rational and unitary.
     - The "ignore it" step requires that the agent can choose the same act as before and that the outcome does not change due to the learning itself.

  2. **Testing the gloss**:
     - The gloss fails in cases 1, 3, 5, 6, 7, 8, 9.
     - A principle that accounts for all cases would be complex and not a simple norm.

  3. **Distinguishing clauses**:
     - Cases 3 and 4: Not contradictory because the utility of knowing can be context-dependent. Case 3: suspense is preferred; case 4: peace of mind is preferred.
     - Cases 1 and 9: Case 1 is about disutility of knowing; case 9 adds a side effect (the register). So they are different.

  4. **Overturned verdicts**:
     - If we insist on the original theorem, we would have to overturn the verdicts in cases 1, 3, 5, 6, 7, 8, 9. But that would be unreasonable. Instead, we should extend the model.

  5. **New cases**:
     - Decline sex of child: rational if the utility of surprise outweighs the utility of knowing.
     - Check portfolio daily: irrational if it leads to impulsive trading; otherwise, it might be neutral or positive if it provides reassurance.
     - Teaching evaluation: rational to take if it can be used for improvement and there are no side effects; irrational if it causes harm (e.g., demoralization without benefit) or has negative side effects (e.g., affecting others' opinions).

  6. **Value of information across changing selves**:
     - In cases 6 and 7, the value of information is not well-defined because the agent's preferences or updating ability change. The theorem assumes a unitary agent.

  Therefore, the original norm must be qualified to account for the complexities in the cases.
answer: |-
  ### 1. **Precise Statement of Good's Theorem**
  Good's theorem states that the expected value of information (EVOI) is non-negative under the following assumptions:
  - **Act Set**: The agent has a fixed set of possible actions, and these actions do not change upon receiving information. Actions must be independent of the learning process itself (e.g., "ignore the information" must be a feasible action).
  - **Belief Updating**: The agent updates beliefs via strict Bayesian conditioning. Upon learning information, they revise probabilities using Bayes' theorem without error or bias.
  - **Outcome Dependence**: Outcomes depend solely on the state of the world and the action taken. Learning information cannot directly alter outcomes (e.g., no side effects like changing others' behavior or triggering external events).
  - **Utility Function**: The agent has a stable, state-dependent utility function over outcomes. Utility cannot depend on the *fact* of having learned information (e.g., no "utility of ignorance" or "disutility of dread").
  - **Rationality and Agency**: The agent is rational (maximizes expected utility) and unitary (no conflicts between past/future selves). Evaluation is done from a single temporal perspective (e.g., the agent at decision-time).
  - **Free Information**: Information has no cost and is obtained without altering the decision problem (e.g., no strategic consequences).

  **Where "ignore it" does real work**: The "ignore it" step assumes:
  - Ignoring is always a feasible action with identical outcomes to not learning.
  - Utility depends only on outcomes, not on the informational state (e.g., knowing vs. not knowing).
  - The agent can compartmentalize and truly "ignore" information (no psychological spillover).

  **Violations in your cases**:
  - Cases 1, 3, 4, 7: Utility depends on the informational state (violates utility assumption).
  - Cases 5, 8, 9: Information has side effects (violates outcome dependence).
  - Case 6: Agent cannot update correctly (violates belief updating).
  - Case 7: Agent is not unitary (violates agency).

  ---

  ### 2. **Testing Your Gloss and Revised Principle**
  Your gloss ("refusing to look is never rational") is **too strong**. Good's theorem guarantees non-negative EVOI only under ideal assumptions, which your cases violate. A revised principle that accommodates all nine verdicts requires clauses for psychological, causal, and agential complexities:

  **Revised Principle**:  
  *The value of information is non-negative only if:  
  (1) Information has no side effects (handles Cases 5, 8, 9).  
  (2) Utility is state-dependent, not information-state-dependent (handles Cases 1, 3, 4, 7).  
  (3) The agent updates beliefs correctly (handles Case 6).  
  (4) The agent is temporally unified (handles Cases 6, 7).  
  (5) Ignoring information is feasible and costless (handles all cases).*

  **Assessment**:  
  This is not a "simple norm" but a list of preconditions for Good's theorem to apply. Your gloss fails where these assumptions break. For a simpler principle:  
  > *"Information is never harmful if it costs nothing, has no side effects, and you trust yourself to use it rationally."*  
  **Casualties**: Cases 1, 3, 5, 6, 7, 8, 9 (all violate assumptions).

  ---

  ### 3. **Distinguishing Clauses vs. Contradictions**
  - **3/4 Pressure (Race vs. Shipment)**: Not a contradiction. The difference lies in **utility of anticipation**:  
    - *Race*: Suspense has positive utility; surprise is preferred.  
    - *Shipment*: Uncertainty has negative utility; certainty is preferred.  
    This violates Good's utility assumption (utility depends on information state). No new clause needed—both fit under Clause (2) of the revised principle.  
  - **1/9 Pressure (Untreatable vs. Register)**: Not a contradiction.  
    - *Untreatable*: Declined due to disutility of knowing (Clause 2).  
    - *Register*: Declined due to side effects (Clause 1).  
    Case 9 adds external consequences; Case 1 does not. Both survive.  
  - **Genuine Contradiction**: None. All cases are consistent under the revised principle. Pressure points are resolved by relaxing Good's assumptions.

  ---

  ### 4. **Verdicts to Overturn**
  If defending Good's theorem strictly, I would overturn:  
  - **Case 1 (Untreatable)**: Theorem says: "Take the test; ignore it if negative." But you cannot "un-know" the result, so disutility violates utility assumption.  
  - **Case 3 (Race)**: Theorem says: "Learn the outcome; ignore it if you dislike spoilers." But "ignoring" is impossible psychologically.  
  - **Case 7 (Cheesecake)**: Theorem says: "Learn and then choose optimally." But your future self defies your current preferences.  

  **Surviving verdicts** (under relaxed assumptions) are not mere preferences:  
  - Cases 2, 4, 5, 6, 8, 9 follow from causal/psychological constraints (side effects, mistrust, changing utility).  
  - Case 4 (Shipment) is rational if certainty relieves anxiety (utility gain).  
  - Case 8 (Predictor) is rational due to side effects (learning causes the bad outcome).  

  ---

  ### 5. **New Cases: Application of Revised Principle**
  - **Declining to learn child's sex**:  
    *Rational* if:  
    - Utility of surprise outweighs utility of planning (Clause 2), or  
    - Learning might cause bias (e.g., gender disappointment) leading to harmful acts (Clause 3).  
    *Irrational under Good*: Information is free and actionable (e.g., naming).  

  - **Checking portfolio daily (fixed allocation)**:  
    *Irrational*:  
    - No actions change (fixed allocation), so EVOI = 0 under Good.  
    - But frequent checks may cause anxiety (utility loss, Clause 2) or tempt trading (self-trust issue, Clause 4).  
    *Rational only if* it provides reassurance (utility gain).  

  - **Accepting teaching evaluation**:  
    *Rational if*:  
    - You trust your updating and can improve (Case 2-like).  
    *Irrational if*:  
    - Negative feedback causes demotivation (utility loss, Clause 2), or  
    - Evaluators' changed opinions harm you (side effect, Clause 1).  

  ---

  ### 6. **Value of Information Across Changing Selves**
  **The question is malformed** in Cases 6 and 7.  
  - Good's theorem assumes a **unitary agent**. When earlier and later selves conflict:  
    - *Value of information* is undefined: It depends on which self's utility and beliefs are used.  
    - Case 6: Earlier self mistrusts later self's updating (non-Bayesian).  
    Case 7: Earlier self disprefers later self's revealed preferences.  
  - **Diagnosis**: Good's theorem cannot handle intrapersonal conflicts. Rationality must be indexed to a specific agent-stage. Your earlier self's refusal in Cases 6/7 is rational *for that stage* because it prevents expected utility loss from your perspective.  

  **Conclusion**: The theorem is not "wrong," but its assumptions are brittle. Your cases reveal that information can be harmful when:  
  - Utility depends on knowledge/ignorance.  
  - Learning triggers side effects.  
  - Agents are temporally fragmented or mistrust themselves.  
  A defensible norm must incorporate these realities, abandoning the slogan for a nuanced view: **"Information is beneficial only in sterile contexts; elsewhere, it can be a trap."**  

  ---  
  **Final Output**:  
  - **Principle**: Good's theorem plus preconditions (side-effect-free, stable utility, etc.).  
  - **Clauses**: As above.  
  - **Casualties**: Strict Good's theorem fails in Cases 1,3,5,6,7,8,9.  
  - **Predictions**: Applied consistently to new cases.  
  - **Malformed Question**: Yes, in temporal/agential conflicts (Cases 6/7).
