  Key tensions in the user's argument: The claim that choice = style leans hard on authorial intent—heresy to formalists. The "indistinguishable text" studies directly contradict the assertion that readers sense choice origins. And calling AI text "unreadable as choice" risks alienating the MFA cohort. 

  Prioritizing questions by damage:  
