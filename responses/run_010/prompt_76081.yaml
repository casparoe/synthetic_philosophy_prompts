answer: |-
  ## Sonnet I: The Known Sky

  The state precisely known at this first dawn,
  The pressure's push, the currents quick and cold,
  The laws that fix each phase, completely drawn,
  Unfold the tale that coming hours hold.
  No gap in knowledge leaves the least delay
  To cloud the vision of what must befall;
  The jet stream's path, the storm's exact foray,
  The temperature that climbs or starts to fall.
  From this clear view, this certainty of ground,
  The future's shape emerges sharp and fast;
  No vagueness in the air, no shadow found,
  But every outcome counted to the last.
  Thus winds obey the numbers set in space,
  And every path is known to every place.

  ## Sonnet II: The Shaped Sky

  The state *nearly* known at this first dawn,
  The pressure's push, the currents quick and cold,
  The laws that fix each phase, completely drawn,
  Unfold the tale that coming hours hold.
  No flaw in law allows the least delay
  To break the bonds of what must befall;
  Yet jet stream's course, the storm's potential fray,
  The peak of heat that climbs, or how it falls,
  Depend on breaths too slight for men to sound.
  The future's scope expands, immense, unbound;
  Though bounded still, the air's rich, shifting ground
  Denies the naming of each wave and blast.
  No fault in law, but limits trace the race;
  We know the range of rain, but not which face.

  ---

  **Note (78 words):** The perturbation enters via "precisely" (I) becoming "nearly" (II, L1). Sonnet I's couplet asserts survival of exact paths. Sonnet II's couplet asserts survival of boundedness ("range of rain") and statistical behavior ("limits trace the race"), losing specific prediction ("not which face"). The invariant rhyme scheme embodies deterministic laws – identical formal constraints producing divergent semantic outcomes from minimal initial variation, mirroring how exact rules yield unpredictable trajectories from imperfectly known states, while preserving global structure.
