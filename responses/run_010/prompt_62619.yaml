prompt: |-
  I'm a junior and I sit on my school's student senate, and next Thursday I get ten minutes at the open session to pitch a change to how we decide stuff. Right now every policy question — whether to move money out of the club budget into the spring trip, whether to ask the district for a later start time, that kind of thing — goes to a vote of the whole student body through a google form that's open for two days. My proposal: kill that and replace it with a "student jury." 24 kids picked at random off the roster each month, they recieve a briefing packet a week ahead, they deliberate two evenings, then they vote by simple majority and whatever wins is binding on the senate.

  My whole argument leans on the Condorcet jury theorem, which I learned about from a book my brother left at our house plus alot of videos. As I understand it: if each person is more likely than not to get a binary question right, then the bigger the group the more likely the majority is to be right, and it approaches certainty as the group gets huge. I'm planning to say four things — (a) random selection beats elections because kids who run for senate just campaign and tell everyone what they want to hear, (b) a poll we ran last semester showed 63% of students got a factual question about the budget right, so our competence is above a half and we're in the regime where the theorem applies, (c) 24 jurors who actually read the packet will make better calls than 900 kids voting in forty seconds on their phones, and (d) the deliberation is what pushes each individual juror's accuracy up, so it's a bonus stacked on top of the theorem.

  I don't want a defense of my idea, I want prep for the question period. The room is specific: our faculty advisor Mr. D, who teaches AP stats and will make me show the math on the spot; Ms. Okonjo from social studies, who is way into sortition and citizens' assemblies and will mostly be on my side but might push me on things I haven't thought about; the current student body president, whose job I'm basically proposing to make pointless, who cares about legitimacy and whether anyone will accept what the jury decides; and two kids who write for the school paper and love finding holes. Give me the objections those people will actually raise, in roughly the order I expect them, phrased the way they'd phrase them — not the ones I'd get in a philosophy class. For each one: how much damage it does, a reply I can say out loud in under a minute, and where that reply is honestly weakest. Then tell me which of my four points (a through d) I should drop or soften before somebody else does it for me, and finish with the single question I'm praying nobody asks. Keep the whole thing under 650 words, I need to be able to memorize it on the bus.
reasoning: |-
  Okay, the user is a junior in high school on the student senate, preparing to pitch a "student jury" system to replace school-wide votes. They need help anticipating objections during Q&A from specific stakeholders: Mr. D (stats teacher), Ms. Okonjo (social studies teacher), the student body president, and critical newspaper reporters. 

  First, I notice the user is strategically focused on practical pushback, not philosophical debates. Their Condorcet theorem argument is clever but vulnerable—especially the 63% poll claim. Mr. D will absolutely pounce on that. Need to prep them for statistical traps like small sample sizes or binary oversimplification. 

  Ms. Okonjo’s support is useful but risky—she might push deliberation logistics too far. Should warn the user not to oversell the "deliberation bonus" without concrete examples. The president’s legitimacy concern is deadly if unaddressed; the reply needs to frame juries as more representative than low-turnout polls. 

  The reporters? Classic devil’s advocates. They’ll exploit implementation gaps like "what if jurors bail?" User must admit it’s imperfect but fixable—no deflection. 

  Biggest surprise: point (a) attacks elected reps too harshly. The president will feel targeted. Soften to "complements elections" to avoid alienating allies. 

  The nightmare question? "What happens when the jury contradicts overwhelming popular opinion?" No good answer—admitting it’s binding risks rebellion, compromising kills the model. Best to redirect to "rare, but here’s how we educate..." 

  User’s clearly done homework but underestimates emotional resistance. Q&A is about managing egos as much as logic. Memorization tip: cluster replies by stakeholder (stats, process, legitimacy, holes) not point order.
answer: |-
  Here's your battle-tested Q&A prep, stripped down and ordered by likely challengers:

  **1. Mr. D (AP Stats):**  
  *Objection:* "63% on *one* budget question? That's a tiny sample! How do you know competence >50% consistently? Show me the math *and* the margin of error for that poll. The theorem requires consistent individual competence above chance on *each* specific issue."  
  *Damage:* High (Undercuts core premise).  
  *Reply:* "You're right, one question isn't proof. But it suggests baseline competence. The theorem shows *if* average competence >50%, accuracy improves with group size. Our goal is structuring the jury (briefing + deliberation) to *push* each juror's accuracy *above* 50% on the issue at hand. 24 jurors amplify that."  
  *Weakness:* Doesn't prove current competence >50% broadly. Relies on "structuring" to achieve it.  

  **2. Student Body President:**  
  *Objection:* "Legitimacy matters. How is 24 random kids deciding for everyone *more* legitimate than everyone voting? What if they make an unpopular choice? The Senate becomes rubber-stamping an unaccountable group. My role *is* representing the whole school!"  
  *Damage:* High (Appeals to fairness, undermines authority).  
  *Reply:* "Right now, only 25% vote in those polls – that’s 225 kids deciding for 900. A random jury *is* a statistically representative sample of the whole school, forced to engage deeply. It’s *more* legitimate than a low-turnout poll decided in seconds. The Senate still sets the agenda and oversees."  
  *Weakness:* Doesn't solve "unpopular choice" scenario. "Representative sample" feels abstract.  

  **3. Newspaper Kid 1:**  
  *Objection:* "What if the briefing packet is biased? Who writes it? What if jurors just skip the reading or don't show for deliberation? 24 random kids – half will blow it off!"  
  *Damage:* Medium (Highlights practical flaws).  
  *Reply:* "Fair concerns. The Senate (or a committee) drafts the packet, aiming for neutrality – fact sheets & pro/con arguments. Ms. Okonjo, maybe you could advise? Juror participation: we make it prestigious (certificates?), schedule flexibly, and have alternates. It’s a civic duty."  
  *Weakness:* Relies on "prestige" and "duty" – untested incentives. Drafting neutrality is hard.  

  **4. Ms. Okonjo (Social Studies):**  
  *Objection:* "Love the sortition angle! But real deliberation takes skill & time. Two evenings? How do you ensure *quality* discussion, avoid dominance by loud voices, and build consensus? Just a majority vote feels thin after deliberation."  
  *Damage:* Low-Medium (Friendly but pushes idealism).  
  *Reply:* "Great point! We'd need trained facilitators (maybe you/older students?) and clear rules (timed turns, no interruptions). The goal isn't forced consensus, but ensuring all views are heard *before* the vote. The deliberation boosts individual understanding *before* applying Condorcet."  
  *Weakness:* "Trained facilitators" is ambitious. Doesn't guarantee quality.  

  **5. Newspaper Kid 2:**  
  *Objection:* "What stops special interest clubs from lobbying jurors during that 'week ahead'? Or kids just voting based on what's cool? Random doesn't mean wise or immune to pressure."  
  *Damage:* Medium (Questions integrity/independence).  
  *Reply:* "Jurors get clear rules: no external lobbying, base vote *only* on the packet & deliberation. Breach = removal/replacement. Anonymize votes if needed. The structure – focus on facts in the packet and group discussion – pushes them towards the *merits*."  
  *Weakness:* Enforcement is tricky ("no lobbying" is hard to police). Assumes structure overcomes bias.  

  **The Point to SOFTEN: Drop the harshness on (a) "kids who run... just campaign and tell everyone what they want to hear."**  
  *Why:* It's needlessly antagonistic to the President and Senators. Instead, frame it as: "Random selection complements elected roles by providing a different, statistically representative form of input on specific policy questions, free from campaign pressures."

  **The Nightmare Question:**  
  *"What happens when the jury's binding decision is overwhelmingly unpopular with the general student body? Does the Senate just ignore 800 angry students because 13 random kids voted yes?"*  
  *Why it's bad:* It pits the core "statistical legitimacy" against raw democratic sentiment. Your binding rule forces an unpopular outcome, destroying buy-in. Your best *weak* reply: "The Senate sets the question carefully to avoid lose-lose scenarios. If outrage happens, we'd communicate the jury's reasoning transparently and potentially re-run the process later with adjustments, but the initial vote stands to maintain the system's integrity." (It's messy).  

  **Memorize Flow:** Stats (Competence?) -> Legitimacy -> Practical Holes (Participation/Bias) -> Deliberation Quality -> Integrity. Soften point (a). Pray the nightmare stays asleep. Good luck! (598 words)
