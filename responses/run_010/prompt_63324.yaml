  First, I need to map Lewis's conditions precisely to this case. The user suspects the 1955 referendum result (83% for keeping left) reflects Lewis's conditional preference clause rather than equilibrium preference. That's perceptive - Lewis's key insight is that conventions persist not because they're optimal, but because they're focal given others' expected behavior. Even if right-driving would be better collectively, no individual can unilaterally shift the equilibrium. The referendum measured preference for the status quo convention, not abstract preference between equilibria.

  On arbitrariness: by 1967, material factors (left-hand drive cars, border traffic) made right-driving objectively better. But Lewis's arbitrariness condition is weak - it only requires some alternative could have served nearly as well initially. The convention persisted until state intervention changed the coordination point. This wasn't mere incentive-behavior lag; mutual expectations still sustained left-driving as convention until the cutover.

  The user's "settled practice" refinement is interesting. Capital investments (steering wheels, signage) did make deviation costly and switch expensive. But Lewis can handle this: the substrate is part of the coordination problem's payoff structure. Salience (state-set date) and precedent (European norms) explain the new convention's emergence without needing a new category. The refinement seems redundant philosophically, though empirically important.

  Regarding law and convention post-1967: Lewis allows conventions to coexist with laws. Sanctions reinforce but don't replace the convention. The discriminating test - what if law repealed tomorrow - would show convention's persistence. Lewis can run this test because his conditions are counterfactual-friendly.

  The transition period is where Lewis is weakest. His static model doesn't address how conventions change. Sweden's four-year campaign, traffic ban, and synchronized switch created artificial common knowledge and salience to minimize coordination failure. The accident data suggests expectations adjusted rapidly - the initial drop reflects caution during transition, the return to baseline shows convention had restabilized by 1969.

  The rail-road divergence is telling. Railways remained left because: 1) No cross-border coordination need 2) Different player population 3) High conversion costs 4) Separate coordination problem. This confirms Lewis - conventions are solution-specific.

  For generalization: state-led switches (like British decimalisation) succeed when they provide 1) a salient focal point 2) synchronized conversion of behavioral substrate 3) common knowledge of the new equilibrium. Lewis's framework doesn't explain transitions but confirms that once established, conventions become self-sustaining - as Sweden's post-1967 stability shows.

  The user's deep engagement with Lewis is impressive. Their questions target genuine tensions in applying equilibrium models to dynamic change, while respecting the theory's boundaries. This case strains Lewis on transition mechanics but confirms his core insights about convention's self-reinforcing nature and the role of salience.
answer: |-
  Here is a disciplined Lewisian analysis of Sweden's 1967 traffic switch, adhering strictly to your constraints and supplied facts.

  ### 1. Coordination Problem & Referendum
  - **Players**: Swedish drivers (population P).
  - **Situation (S)**: Recurrent driving interactions (meeting, overtaking, crossing borders).
  - **Options**: Drive on left (R) or right (R′).
  - **Payoffs**: Determined by compatibility with others' actions. Mutual conformity minimizes collisions. Pre-1967, payoffs were asymmetric:  
    - *Left conformity*: Safe coordination (baseline payoff).  
    - *Right conformity*: Higher *potential* payoff (safer with left-hand-drive cars, border compatibility) but *only if nearly all switch*.  
    - *Unilateral deviation*: High cost (collisions).  

  **Lewis's Prediction on 1955 Referendum**:  
  Your suspicion is correct. Lewis’s conditional preference clause entails the status quo bias:  
  - Conditional on others *still driving left*, each prefers to drive left (avoid immediate collisions).  
  - Switching unilaterally is catastrophic; hence no voter can "vote themselves" into the alternative equilibrium, even if they prefer R′ *were it established*.  
  The referendum measured preference for the *current equilibrium* (R), not abstract preference for R′. It reflects the coordination problem’s structure, not proof that R was materially superior.  

  ### 2. Arbitrariness Condition
  - **Pre-1967**: R (left) remained a convention despite shifting payoffs.  
    - **Why?** Lewis’s arbitrariness is weak: it requires only that *some* R′ *could have* served equally well *at inception*. This was true historically.  
    - **Post-1950s asymmetry** (left-hand-drive cars, border traffic) made R′ *materially superior*, but R still satisfied Lewis’s conditions: mutual conformity expectations persisted, and conditional preferences favored R *given others’ adherence*.  
  - **Verdict**: The convention persisted until state intervention. 1967 was a switch between conventions, not mere incentive-behavior lag. Arbitrariness survives because R′ was once a viable alternative, and expectations sustained R despite payoff shifts.  

  ### 3. "Settled Practice" Refinement vs. Lewis
  - **Your refinement**: "Settled practice" adds sunk costs (steering wheels, signage, muscle memory) making deviation expensive and revision lumpy.  
  - **Lewisian adequacy**: This drops straight into Lewis’s framework.  
    - Capital substrate = **payoff shifter**: Raises cost of deviation *and* switching.  
    - Salience & precedent suffice: The state made R′ salient (via campaign, cutover date) and used Europe as precedent.  
    - **Redundancy test**: Sweden’s transition used Lewisian resources:  
      - *Salience*: 3 Sept 1967 as focal point.  
      - *Precedent*: "Drive like Europe" as alternative precedent.  
      - *Common knowledge*: Four-year campaign created universal awareness.  
    Capital costs explain *why revision was state-led* but don’t require new philosophical categories. Lewis’s payoff matrix accommodates asymmetric switching costs.  

  ### 4. Role of Statute Post-1967
  - **Convention + Law**: Post-1967, right-driving satisfies all Lewisian conditions *and* is legally enforced.  
  - **Discriminating test**: **Repeal the law tomorrow**. Lewis predicts:  
    - If mutual expectations persist ("everyone expects everyone to drive right"), it remains a convention.  
    - If expectations dissolve without sanctions, it was law-dependent.  
  - **Lewis’s entitlement**: His theory *can* run this test. Conventions can coexist with laws; sanctions *reinforce* but need not *displace* convention if expectations are self-sustaining. Sweden’s post-1969 baseline accident rates suggest convention stabilized independently.  

  ### 5. Transition & Static Theory
  - **Lewis’s limitation**: His model is equilibrium-focused. It lacks resources for the transition (S: no equilibrium).  
  - **Sweden’s machinery** (traffic ban, staged stops, wrapped signals) created an **artificial coordination point**:  
    - 04:50 stop → 05:00 restart synchronized actions, minimizing chaos.  
    - The campaign established *common knowledge of the new rule and cutover*, making R′ salient.  
  - **Accident data**:  
    - *Temporary drop*: Cautious driving during transition; heightened attention.  
    - *Return to baseline*: By 1969, new convention (R′) stabilized. Expectations converged, eliminating transition risk.  
    This data is *beside the philosophical point* for Lewis’s equilibrium definition but illustrates how expectations recalibrate.  

  ### 6. Rail-Road Divergence
  - **Railways (still left)**: Confirms Lewis.  
    - **Separate coordination problem**: No cross-border rail traffic with right-driving neighbors.  
    - **Different population (P′)**: Drivers/trains don’t interact with road traffic.  
    - **No payoff asymmetry**: No left-hand-drive issue; switching costs (track realignment, signals) high.  
  - **Verdict**: Divergence is consistent. Rail left-driving remains a distinct convention under Lewis’s criteria.  

  ### 7. Verdict & Generalization
  - **Confirms Lewis**:  
    - Conditional preferences explain referendum bias (Q1).  
    - Arbitrariness is weak enough for pre-1967 convention (Q2).  
    - Salience/precedent explain switch (Q3).  
    - Convention-law coexistence possible (Q4).  
    - Rail divergence aligns with population/situation specificity (Q6).  
  - **Strains Lewis**:  
    - **Transitions**: No tools for the "no equilibrium" phase (Q5). Sweden’s state-led cutover is exogenous to the model.  
    - **Agency**: State imposes change top-down; Lewis assumes decentralized emergence.  
  - **Untouched**: Core definition of convention as self-sustaining regularity.  
  - **Generalization (e.g., UK decimalisation)**:  
    - **Success predictor**: **Synchronized substrate conversion + salient focal point + common knowledge**.  
    - **Lewis’s reach**: He *does not* address state-engineered change. His framework explains *why conventions persist* and *how alternatives emerge* (via salience/precedent) but not *how to dismantle entrenched conventions*. Sweden shows states can force new focal points, but Lewis offers no theory of this.  

  **Final Assessment**: The case confirms Lewis’s core insights about equilibrium stability and conditional preferences but exposes the theory’s limits in modeling state-driven transitions. The capital substrate is payoff-relevant but requires no new ontology. Lewis’s framework remains robust for analyzing conventions *in being*, not *in becoming*.
