prompt: |-
  I'm giving a paper at a vet school's animal welfare research group in a few weeks and could use a Q&A prep sheet.

  The thesis: the strand in Anarchy, State, and Utopia where Nozick floats something like utilitarianism for animals but Kantianism for humans can't be held together, because the thing he uses to mark the line — roughly, how wide a range of possible lives a creature can shape for itself — clearly comes in degrees. So constraints shouldn't be all-or-nothing either. Sketch of the argument: the boundary is drawn by capacities; those capacities are scalar; a scalar basis can't ground a categorical constraint; therefore constraints should be weighted by how much of a creature's open future an act forecloses.

  The room is mostly welfare scientists who put suffering on ordinal scales and are pretty suspicious of rights talk, plus two philosophers who reckon I'm being unfair to Nozick and will press on whether the scalar premise is even his rather than mine.

  So: give me the objections this audience will actually make, in their idiom, ordered by how much damage they'd do. For each, a reply I can land in about two minutes and a note on where that reply goes soft. Also flag what I should concede up front to buy credibility with the scientists, and the one question I'm dreading that I'd rather nobody asks. British English, please.
