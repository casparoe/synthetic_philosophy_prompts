prompt: |-
  I serve on the award committee of a learned society: seventeen voting members elected on staggered three-year terms, so that roughly a third of the panel turns over each year, and a chair who has no additional vote but does control the order in which nominations are discussed and whether a screening round happens at all. Each spring we select one winner from a field that runs between three and six finalists; the shortlist is circulated to the whole committee before any ballot, and although the vote itself is secret, everyone's tastes are well known from years of shared service, so in practice nobody is voting under much uncertainty about the others. The bylaws are silent on the decision rule, which means the committee effectively re-adopts one every few years, usually by muddle. Before I draft a proposal, I want to know what I should be demanding of a rule. Please write the desiderata: the specification any candidate aggregation procedure for this purpose must meet in order to be defensible. For each item give the requirement itself; the concrete situation that motivates it, with small-committee examples preferred to national-election ones, since the small committee is my setting; a label saying whether you regard it as non-negotiable, as negotiable given my purpose, or as a prejudice of a particular camp — the ordinalists, the partisans of pairwise majority comparison, the intensity-and-utility people; and a note on which other items on the list it competes with, since I expect several of them cannot all be had at once. Be candid in particular about which of the things habitually insisted upon are really aesthetic: neutrality among candidates, anonymity among voters, monotonicity, agreement with majority preference in head-to-head contests, explainability to a layperson in a single sentence.

  The center of gravity should be the incentive conditions, and there I want the distinctions drawn finely rather than the familiar slogan repeated. Results of this kind are standardly stated for a deterministic rule whose range contains at least three alternatives and which is defined on every possible profile of preferences; tell me which of those hypotheses is doing the real work in my setting, and what survives once one of them is dropped — a range deliberately restricted to two finalists after a screening round, randomization, cardinal ballots that let voters express intensity, domain restrictions of the single-peaked variety, or weaker notions of incentive compatibility defined relative to what a voter knows about the others, or relative to how obvious a successful manipulation would have to be for a non-specialist to detect. I also want to know whether resistance to manipulation is even the right target for a body like mine, where misrepresentation is costless, ballots are secret, and a member who shades her ranking pays no penalty whatever; and whether the repeated structure of our work — the same faces applying the same rule every spring — should change what is demanded, weakening conditions that bite in a one-shot election and strengthening others. Beyond the ballot, please separate at least four kinds of strategic conduct and tell me whether a single desideratum can govern them or whether the list needs four items: manipulating one's own ballot; manipulating the candidate set by nominating or withdrawing a finalist; manipulating the agenda through the ordering of discussion and of screening rounds; and manipulating the choice of rule itself in an earlier year with a later contest in view. Include whatever further conditions you judge genuinely load-bearing but habitually omitted — how much of her preference a voter must be able to express; how the procedure behaves when members are indifferent or abstain; whether a member can be made worse off by participating honestly; whether two near-identical finalists should be able to split support between them; whether the outcome may depend on the sequence in which ballots are counted.

  Finally, state which subset of your desiderata you believe cannot be jointly satisfied, and if the list is itself an impossibility result, say so plainly and identify the single requirement that does the most work in excluding candidates. Where the standard theorems are silent about my setting — because they presuppose a large anonymous electorate, or a fixed candidate set, or no chair with agenda power, or one-shot play — mark the silence instead of filling it with a confident guess. Close with a compact table scoring a half-dozen plausible rules for a committee of this size against your list. I do not want a bibliography, a reading list, publication dates, or the history of who proved what, and please do not quote from any source; what I want is the reasoning about what ought to be required and why, stated as claims about the structure of the problem itself.
reasoning: |-
  Okay, the user is part of an award committee for a learned society with specific dynamics: 17 voting members with staggered terms, a chair controlling agenda, and small-group voting where preferences are transparent. They need a framework to evaluate voting rules, focusing on practical desiderata rather than theoretical ideals. 

  First, I need to unpack their unspoken tensions. They mention "muddle" in rule adoption, suggesting past frustration with arbitrary decisions. The emphasis on "defensibility" hints they want legitimacy amid diverse academic egos. The request to separate aesthetic preferences from core requirements reveals they've seen voting theory debates devolve into ideological battles. 

  The real challenge is balancing two layers: the formal properties of voting rules (monotonicity, strategy-proofness) and the human factors of a small, recurring committee. For example:
  - Incentive compatibility sounds nice in theory, but with secret ballots and no penalties, members might manipulate casually unless socially discouraged. 
  - Agenda control by the chair is unavoidable, so the rules must either neutralize it or make its exercise transparent.
  - "Well-known tastes" create a unique environment: voters can predict outcomes with high accuracy, making strategic voting more tempting yet also more detectable.

  I'll structure desiderata into four clusters: legitimacy basics (non-negotiable), strategic robustness, practical governance, and aesthetic/equity concerns. Key insights:
  - Non-negotiable: Must avoid trivial failures like non-existence or non-anonymity. 
  - Strategic items need nuance: Distinguish ballot manipulation (viable in secret) from candidate/agenda manipulation (visible and socially costly).
  - For recurring committees, focus on rules that "settle" over time (e.g., Condorcet methods converge predictably) rather than one-shot optimality.
  - Drop unrealistic assumptions: Large electorate theorems don't apply; single-peakedness might emerge naturally from shared expertise.

  The impossibility elephant: Arrow's theorem looms, but its bite is less severe here. With only 3-6 finalists and possible domain restrictions, rules like Copeland or Borda can satisfy most desiderata except strict strategy-proofness. The real tradeoff is between expressiveness (allowing ranked ballots) and simplicity (approval voting).

  Table scoring will show:
  - Plurality fails incentive compatibility and Condorcet efficiency.
  - Approval does well on simplicity but poorly on expression.
  - Borda is expressive but highly manipulable.
  - Condorcet methods (Copeland, Schulze) score best overall but are complex to explain.

  Final advice: Prioritize Condorcet efficiency and resistance to agenda manipulation. For this small, stable group, complexity is manageable, and predictability matters more than theoretical purity. The chair’s control should be constrained by mandating pairwise comparisons if screening occurs.
answer: |-
  Here is a structured list of desiderata for your committee's voting rule, designed to address the specific dynamics of a small, recurring group with transparent preferences, agenda-setting power, and a need for defensibility. Requirements are categorized, motivated by concrete committee scenarios, and assessed for negotiability and conflicts. Strategic incentives are finely dissected.

  ---

  ### **I. Legitimacy & Basic Functionality** (Non-negotiable)
  1. **Non-Imposition (Feasibility)**  
     *Requirement*: Must always select a winner from the finalists.  
     *Motivation*: If all members abstain or rules deadlock (e.g., a cycle in pairwise votes with no tiebreaker), the award fails—damaging the society’s reputation.  
     *Conflict*: None—this is foundational.  

  2. **Anonymity**  
     *Requirement*: Permuted voter identities don’t change the outcome.  
     *Motivation*: In a 17-member panel with public reputations, a rule favoring specific voters (e.g., "Alice’s vote counts double") would be indefensible.  
     *Conflict*: Weakly conflicts with *Resolvability* (if ties are broken by chair’s identity).  

  ---

  ### **II. Strategic Robustness**  
  *Context*: Misrepresentation is costless with secret ballots, but recurring interactions and known preferences enable detection of *blatant* manipulation. Focus on *obvious* strategies.

  3. **Resistance to Blatant Ballot Manipulation**  
     *Requirement*: No voter can predictably improve the outcome by *obviously* misrepresenting preferences, given known preferences of others.  
     *Motivation*: If Alice knows Bob and Chris both rank Candidate X last, and she swaps X to top to block her last choice Y, others may infer her insincerity—undermining trust.  
     *Negotiability*: Non-negotiable for *detectable* manipulations.  
     *Conflict*: Trades off with *Expressiveness* (ranked ballots enable more manipulation than approval).  

  4. **Non-Bribery Incentive Compatibility**  
     *Requirement*: A voter cannot benefit by withdrawing/nominating a candidate *they dislike* to split votes.  
     *Motivation*: A member subtly nominates a weak "decoy" finalist resembling a strong contender to fragment support (e.g., adding a scholar with overlapping expertise to divert votes).  
     *Negotiability*: Non-negotiable—this exploits procedural loopholes.  
     *Conflict*: Strongly conflicts with *Independence of Irrelevant Alternatives (IIA)*.  

  5. **Agenda-Proofness (vs. Chair Manipulation)**  
     *Requirement*: The chair cannot alter the outcome by reordering discussion/screening, barring tie-breaking.  
     *Motivation*: The chair pushes a polarizing candidate to a later round, knowing early frontrunners get eliminated in screening.  
     *Negotiability*: Non-negotiable—core to your chair’s power issue.  
     *Conflict*: Requires rules immune to sequencing (e.g., Condorcet methods), conflicting with *Simplicity*.  

  ---

  ### **III. Preference Sensitivity & Fairness**  
  6. **Condorcet Consistency**  
     *Requirement*: If a candidate beats all others head-to-head, they must win.  
     *Motivation*: In a 3-finalist race, if Alice beats Bob 10-7 and Chris 12-5, but Bob wins under plurality due to vote-splitting, the outcome feels illegitimate.  
     *Negotiability*: Non-negotiable for small committees with known preferences.  
     *Conflict*: Incompatible with *IIA* and *Simplicity*.  

  7. **Weak Monotonicity**  
     *Requirement*: Improving a winner’s ranking on a ballot shouldn’t make them lose.  
     *Motivation*: After a winner is announced, a member says, "I liked them even more this year, so I ranked them higher—and they lost!"  
     *Negotiability*: Non-negotiable—violations defy basic accountability.  
     *Conflict*: None major; most rules satisfy this.  

  8. **Expressiveness**  
     *Requirement*: Voters can express transitive rankings (not just approval).  
     *Motivation*: With 4+ similar candidates, forcing approval voting may make members "bullet vote" for one, ignoring close substitutes.  
     *Negotiability*: Negotiable—approval or score voting can suffice if voters accept coarse expression.  
     *Conflict*: Trades off with *Strategy Resistance* (more expression enables more manipulation).  

  ---

  ### **IV. Practical Governance**  
  9. **Repeated-Game Stability**  
     *Requirement*: The rule encourages sincere voting over time, avoiding recurring cycles or predictable manipulation patterns.  
     *Motivation*: If a Borda count is used, members learn to "bury" strong rivals by ranking them last—creating annual strategic rituals.  
     *Negotiability*: Non-negotiable for recurring committees.  
     *Conflict*: Requires Condorcet methods or randomization.  

  10. **Tie Robustness**  
      *Requirement*: Clear tie-breaking protocol (e.g., chair’s vote, randomization) *predefined* and acceptable to members.  
      *Motivation*: A 8-8-1 split in a runoff forces an ad hoc decision, breeding distrust.  
      *Negotiability*: Non-negotiable—prevents chaos.  
      *Conflict*: Randomization conflicts with *Ex Post Justifiability*.  

  ---

  ### **V. Aesthetic & Secondary Preferences** (Negotiable/Contextual)  
  11. **Simplicity**  
      *Requirement*: Explainable in 1–2 sentences (e.g., "pick one," "approve any," "rank all").  
      *Motivation*: Members resist opaque methods ("Schulze beatpaths?!"), slowing adoption.  
      *Label*: Prejudice of *pragmatists*; conflicts with *Condorcet Consistency*.  

  12. **Neutrality Among Candidates**  
      *Requirement*: No candidate favored by rule structure.  
      *Motivation*: A rule that defaults to alphabetical order biases outcomes.  
      *Label*: Non-negotiable baseline fairness.  

  13. **Independence of Clones**  
      *Requirement*: Adding a near-identical candidate shouldn’t change the winner.  
      *Motivation*: Two scholars from the same school split votes, allowing a less-preferred candidate to win.  
      *Label*: Non-negotiable in theory, but negotiable if screening removes clones.  

  ---

  ### **Key Omissions & Constraints**  
  - **Large Electorate Assumptions**: Most theorems assume anonymous voters—invalid here. Strategy resistance focuses on *known* preferences.  
  - **Randomization**: Desirable for tie-breaking but disliked for final awards.  
  - **Abstention/Indifference**: Rules must specify if abstentions reduce quota or are ignored.  
  - **One-Shot vs. Repeated**: Recurrence weakens need for *perfect* strategy-proofness (detectable manipulation is punished socially) but strengthens stability needs.  
  - **Arrow’s Theorem**: Irrelevant here. *IIA* (if candidate X wins, adding Y shouldn’t change that) is sacrificed for Condorcet consistency.  

  ---

  ### **Impossibilities & Tradeoffs**  
  - **No rule satisfies all**: Condorcet consistency, strategy resistance, and simplicity are incompatible.  
  - **Main conflict**: *Condorcet Consistency* vs. *Strategy Resistance*. Condorcet methods (Copeland, Schulze) are more manipulable than Approval but less than Borda.  
  - **Critical tradeoff**: *Expressiveness* enables preference nuance but amplifies manipulation opportunities.  

  ---

  ### **Rule Evaluation (17 voters, 3–6 finalists)**  
  | Rule               | Condorcet | Blatant Manip. Res. | Agenda-Proof | Expressiveness | Simplicity | Clone Independence |  
  |--------------------|-----------|---------------------|--------------|----------------|------------|-------------------|  
  | Plurality          | ✗         | ✗ (vote-splitting)  | ✗            | Low            | ★★★★★       | ✗                  |  
  | Approval           | △         | ★★★☆☆               | △            | Medium         | ★★★★☆      | △                  |  
  | Borda              | ✗         | ✗ (burying)         | ✗            | High           | ★★★☆☆      | ✓                  |  
  | STV (IRV)          | △         | △                   | ✗            | High           | ★★☆☆☆      | ✗                  |  
  | Copeland (Cond.)   | ✓         | ★★☆☆☆               | ✓            | High           | ★★☆☆☆      | ✓                  |  
  | Schulze (Cond.)    | ✓         | ★★☆☆☆               | ✓            | High           | ★☆☆☆☆      | ✓                  |  
  | **Chair Screening → Approval** | △ | ★★★★☆             | ✗ (chair)    | Low            | ★★★★☆      | △                  |  

  - **★**: Poor to ★★★★★: Excellent; ✓: Satisfies; △: Partially; ✗: Fails  
  - **Best balance**: **Copeland** (pairwise wins minus losses) or **Schulze** (beatpaths). Resistant to agenda manipulation, Condorcet-consistent, but moderately manipulable and complex.  
  - **Practical runner-up**: **Approval** if simplicity is paramount. Resists manipulation better but ignores preference orders.  
  - **Avoid**: Plurality (fails clones, Condorcet), Borda (high manipulation), STV (agenda-vulnerable).  

  ---

  ### **Recommendation**  
  Adopt a **Condorcet method (Copeland)** with chair breaking ties. For screening rounds, use **Approval voting** to reduce finalists to 3–4. This:  
  - Ensures the strongest pairwise candidate wins,  
  - Limits chair agenda power (pairwise comparisons are order-independent),  
  - Minimizes *blatant* manipulation in a recurring group,  
  - Accepts moderate complexity for defensibility.  

  Defend tradeoffs: "No rule is perfect, but this best ensures the most broadly respected candidate wins without gaming the agenda."
