prompt: |-
  You are a decision theorist who has worked extensively on Newcomb-style problems and on translating them into institutional policy. I am head of information security for a regional hospital group — three acute sites, roughly 9,000 staff. We have had two extortion incidents in four years and expect about one a year henceforth. Each time, the board turns to me for a recommendation within hours, and that recommendation has to remain defensible afterwards whether or not it worked. The board chair and the chief medical officer sign off jointly; the procedure itself must be runnable in under an hour by whoever is on duty, who may not be a specialist.

  Please write me a standing decision procedure for three linked questions: whether to pay, what we should commit to publicly in advance, and at what point the matter stops being a prediction problem and becomes a values problem the board must own. I want it grounded explicitly in the two structures that seem to me to be lurking in this situation. First, the counterfactual mugging: a predictor has already acted on a model of how you would have responded in a branch that did not obtain, so the payoff to behaving as though that branch mattered lands elsewhere and later. Second, XOR blackmail: the extortionist's claim is that they selected you precisely because of what they predicted you would do, so that complying appears to be evidence against the threat having been set in motion at all.

  Begin with a short brainstorm identifying which features of a real incident genuinely have that structure and which merely resemble it — the puzzles stipulate a near-perfect predictor, and no attacker is one; say what survives that weakening and what collapses. Then give the procedure: the questions in order, what counts as a sufficient answer to each, where it terminates in a refusal, where it hands the decision upward, and which steps are judgment calls dressed up as procedure. It must address a pre-announced no-pay policy that a sophisticated actor will simply predict we abandon in extremis, and it must address the fact that our response today feeds the targeting model applied to other hospitals next quarter, whose patients have no one at our table.

  Finally, run it on three cases: (i) encryption on a Sunday evening, with elective theatres already cancelled and the attacker citing our own published statement that we engage with negotiators; (ii) a demand where the stolen records have already been published and payment buys only an assurance of deletion and non-republication; (iii) an automated campaign hitting dozens of hospitals in a week with small demands, where paying restores full service within a day. At least one case must yield a recommendation I would rather not take to the board, and you should say why the procedure is nonetheless right to give it. Close with what the procedure cannot settle at all. Write in British English; do not include citations, references, or reading lists.
reasoning: |-
  Hmm, this is a fascinating and complex request. The user is head of information security for a hospital group dealing with ransomware decisions, and they want a standing procedure grounded in decision theory concepts like counterfactual mugging and XOR blackmail. 

  First, I need to unpack the core theoretical structures they referenced. The counterfactual mugging analogy works because attackers build prediction models of victim behavior - our current decision affects how future attackers target us and other hospitals. XOR blackmail is relevant because paying might signal we're predictable, encouraging more attacks. But crucially, real attackers aren't perfect predictors like in thought experiments, so we must account for that imperfection.

  For the procedure itself, I'll structure it around three key questions: 
  1) Is the threat verifiably executed? (distinguishing real vs bluff attacks)
  2) Does payment reliably prevent harm? (addressing whether compliance actually works)
  3) Are we in a coordination trap? (considering systemic effects on other hospitals)

  Each question needs clear pass/fail criteria. The board should only get involved when it's purely a values call - like whether to pay for already-published data deletion. I'll make sure to address their concerns about pre-announced no-pay policies (attackers know they're breakable) and the moral weight of affecting other hospitals' targeting likelihoods.

  For the test cases:
  - Case i (Sunday encryption) should probably recommend non-payment since their public negotiation statement creates perverse incentives
  - Case ii (published records) must go to the board since payment brings no measurable benefit
  - Case iii (automated campaign) should recommend paying as an exception due to low cost and demonstrable recovery

  The hardest recommendation will be case ii - telling the board to own a "wasteful" payment for ethical reasons. But the procedure forces this because when payment doesn't change outcomes, it's no longer a prediction problem but a values decision. 

  The procedure's key limitation is quantifying how much our actions influence attacker targeting models - that remains a judgment call. Also, it can't resolve true moral dilemmas where all options violate core values.

  British English throughout: "trusted third parties" not "third-party vendors", "whilst" not "while", "learnt" not "learned". No citations per request - this is applied theory, not academia.
answer: |-
  ### Standing Decision Procedure for Extortion Incidents  
  **Grounded in Counterfactual Mugging & XOR Blackmail Structures**  

  ---

  ### **Brainstorm: Real-World Weakening of Theoretical Structures**  
  1. **Counterfactual Mugging Survival**:  
     - *Survives*: Attackers *do* pre-select targets based on predictive models of victim behaviour (e.g., "soft targets" who pay). Your payment today feeds attacker algorithms targeting other hospitals.  
     - *Collapses*: Attackers lack perfect prediction. Their models are probabilistic, error-prone, and shaped by incomplete data (e.g., your public "no-pay" policy may deter naive attackers but not sophisticated ones).  

  2. **XOR Blackmail Survival**:  
     - *Survives*: Paying *can* signal predictability, encouraging repeat attacks. Non-payment *can* signal resilience, deterring future targeting.  
     - *Collapses*: Real attackers face operational constraints (e.g., urgency, resource limits). Your compliance isn’t proof the threat was never set—it may merely reflect their imperfect intel.  

  ---

  ### **Decision Procedure**  
  **Core Principle**: Treat payment as a *predictive* action (will it avert harm?) until evidence shows it won’t; then treat it as a *values* action (should we pay on principle?). Escalate ambiguity upwards.  

  #### **Questions in Order**  
  1. **"Is the threat verifiably executed?"**  
     - *Sufficient Answer*:  
       - **YES** (e.g., data published, systems encrypted + proof). → Proceed to Q2.  
       - **NO** (e.g., threat unsubstantiated, no proof of access). → **Terminate: DO NOT PAY.**  
     - *Judgement Call*: Validity of "proof" (e.g., attacker samples vs. full dataset).  

  2. **"Does payment reliably prevent material harm?"**  
     - *Sufficient Answer*:  
       - **YES** (e.g., decryption key tested, data deletion verifiable). → Proceed to Q3.  
       - **NO** (e.g., data already public, attacker reputation poor). → **Escalate to Board.**  
     - *Judgement Call*: "Reliable" = ≥80% confidence based on threat intel + third-party advisories.  

  3. **"Are we in a coordination trap?"**  
     - *Sufficient Answer*:  
       - **YES** (e.g., widespread campaign, payment fuels ecosystem). → **DO NOT PAY** (absent board override).  
       - **NO** (e.g., isolated incident, no systemic ripple). → **PAY** (if Q1-2 satisfied).  
     - *Judgement Call*: Assessing "systemic impact" via NHS Digital/Cyber Security Centre alerts.  

  ---

  ### **Handling Key Constraints**  
  - **Pre-Announced "No-Pay" Policy**:  
    - Publicly state: "We never *negotiate* with attackers; payments require board approval under exceptional harm-mitigation criteria." This exploits attacker uncertainty: they cannot assume automatic abandonment.  
  - **Affecting Other Hospitals**:  
    - Q3 explicitly forces consideration of ecosystem harm. Non-payment is default in coordination traps to avoid feeding the attacker’s model.  

  ---

  ### **Case Applications**  
  #### **Case (i): Encryption on Sunday Evening**  
  - Q1: **YES** (systems encrypted, proof provided).  
  - Q2: **YES** (decryptor likely reliable; attacker cites our negotiation policy—suggests they modelled compliance).  
  - Q3: **NO** (single-target incident).  
  - **Recommendation: PAY**.  
    - *Why defensible?* Harm reversible, no systemic risk. Attacker’s reference to our policy indicates they predicted non-payment; paying here counters their model for *future* targeting.  

  #### **Case (ii): Demand After Data Publication**  
  - Q1: **YES** (data published).  
  - Q2: **NO** (payment buys only "promise" of deletion—harm already done).  
  - **Escalate to Board**.  
    - *Board’s values problem*: Is purchasing a *chance* of limiting reputational damage worth £X? Procedure refuses to legitimise payment as "predictive".  

  #### **Case (iii): Automated Campaign, Small Demands**  
  - Q1: **YES** (service disruption).  
  - Q2: **YES** (payment restores service).  
  - Q3: **YES** (dozens of hospitals targeted; paying signals vulnerability, incentivising mass attacks).  
  - **Recommendation: DO NOT PAY** (even if cheap/fast).  
    - *Why you’ll hate this*: Restoring service fast is tempting, but payment here directly harms other hospitals. Procedure prioritises collective security over individual convenience.  

  ---

  ### **What the Procedure Cannot Settle**  
  1. **Moral Weight of "Unseen" Victims**: When the board overrules Q3 to pay (e.g., to save lives), the procedure cannot quantify the ethical cost to other hospitals’ patients.  
  2. **Attacker Model Drift**: If attackers shift strategies (e.g., from encryption to data theft), the procedure’s predictive thresholds may lag until updated.  
  3. **True Uncertainty**: When threat validity (Q1) or payment efficacy (Q2) is genuinely 50/50, the procedure defaults to "NO"—but the board may legitimately see this as recklessly conservative.  

  ---  
  **Final Note**: This procedure forces attackers to overcome three sequential hurdles to make payment rational. It accepts that perfect prediction is impossible, so it errs toward protecting the ecosystem—unless the board consciously chooses to do otherwise.
