  2. Maintain that inequality matters but isn't the direct target
  3. Explicitly state no one will be made worse off
  4. Address housing director's power hierarchy concern respectfully
  5. Include something aligning with father's founding values
  6. Tone: Affectionate correction, not lecture/apology
  7. Strict limits on technical terms (max 2, with immediate plain-language explanations)

  The housing director's objection is particularly nuanced - she fears losing focus on power dynamics. Need to validate her core insight while showing how the new framework still captures it.

  For the father, probably emphasize the shared commitment to concrete human dignity rather than abstract metrics. His childhood scarcity resonates with "whose lives went better" framing.

  Post-speech notes should anticipate the philosopher's likely challenge about moral foundations. They'll question whether shifting from distributive equality to priority for the worst-off abandons relational equality. Reply should clarify that tracking life improvements doesn't preclude examining power structures.

  Biggest risks to avoid:
