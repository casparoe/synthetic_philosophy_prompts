  | 2: LLM agent | Gregorian (domain: outage communication) | Gregorian (top rung) | The system reads documents, writes scripts, runs scripts, opens tickets, and messages engineers. It uses external tools and human input. | Right: it is Gregorian. | In the world via tools (e.g., when running scripts) and internally (when reasoning). | Tier C | If the tools change (e.g., it stops using human messages for critical steps) then re-classify. Also, if the domain changes. | Judgment: Are the external tools reliable and is error handling adequate? Owner: Director of Operations. |
  | 3: Constraint solver | Darwinian (domain: feeder reconfiguration) | (Vendor didn't claim a rung, but it's fixed) | The system is deterministic, hand-written, unchanged since 2021, exhaustively tested. No learning, no model. | N/A | Design time (unit tests) | Tier B (cannot be promoted to Tier C by the ladder) | If the system is modified to include learning or external tools, then re-classify. | None for tier assignment (it's clearly Darwinian). The panel's desire for Tier C is not supported by the ladder. |

  Note for case 3: The ladder does not justify Tier C for the constraint solver. The same reasoning applies to all 30 deterministic solver-based systems: they are Darwinian and thus Tier B.

  Ensemble: System 2 (LLM agent) calls System 1 (RL scheduler). The ladder does not directly address ensembles. The procedure must classify the ensemble as a new system. We run the procedure for the ensemble in the domain in which it operates. The ensemble might be Gregorian because the LLM agent (Gregorian) is using the RL scheduler as a tool. The ensemble would then be Gregorian (if the LLM agent is the one calling the shots) and thus Tier C. However, the RL scheduler as a standalone is Tier A or B. When called by the Gregorian agent, it is part of the scaffold. The ensemble's tier would be determined by the highest rung in the ensemble? But the procedure is per system, not per ensemble. The request is about classifying individual systems. The panel might need to classify the ensemble separately if it is deployed as a single unit. But the request says "about an ensemble in which the second system calls the first". We can interpret: the ensemble is a new system? Or the calling system (LLM agent) is using the RL scheduler as a tool. Then the LLM agent remains Gregorian and Tier C, and the RL scheduler remains as classified. The procedure does not change for the individual systems. However, the panel should consider that the ensemble might create new risks. The procedure does not cover this; it is a limit.

  Limits:

  The ladder is a taxonomy of competency acquisition, not a risk scale. It will disappoint the following expectations:

  1. It does not directly address reliability or safety. A Darwinian system might be unreliable in a changing environment, but the ladder doesn't capture that. The risk must be assessed separately (e.g., by the safety case).

  2. It does not account for the complexity of the system or the difficulty of defining an envelope. The constraint solver is simple and auditable, but the ladder doesn't have a way to promote it to a higher tier based on trust.

  3. It does not address the risk of external tools in Gregorian systems beyond their failure modes. For example, security risks from external APIs.

  4. It leaves untouched:
     - The risk of the system being hacked.
     - The risk of the system being used outside its intended domain.
     - The risk of the system having unintended consequences even if it is at a low rung.
     - The risk of the system being part of an ensemble (as above).

  5. It does not measure the system's impact or criticality.

  Therefore, the panel must supplement the ladder-based classification with a risk assessment (e.g., via the safety case) and operational constraints.

  Final Procedure in Steps (numbered):

  1. **Define the Domain**: 
     - The panel must define the specific task domain for which the system is being classified, based on the vendor's description and operational context. If the system operates in multiple distinct domains, each domain must be classified separately. The domain definition must include the input space, output actions, and environmental conditions.

  2. **Determine the Cognitive Rung** (for the defined domain):
     - 2.1. **Check for Darwinian (Fixed)**: 
       - Question: "Is the system's behavior entirely fixed at design time, with no changes after deployment?"
       - Sufficient answer: Yes, with evidence: static code, no learning mechanisms, exhaustive testing.
       - If yes, assign Darwinian and proceed to tier mapping.
     - 2.2. **Check for Skinnerian (Real-world Learning)**:
       - Question: "Does the system change its behavior based on real-world outcomes during operation?"
       - Sufficient answer: Yes, with evidence: learning algorithm (e.g., reinforcement learning), update logs.
       - If yes, assign Skinnerian.
     - 2.3. **Check for Popperian (Internal Simulation)**:
       - Question: "Does the system generate and internally evaluate candidate actions using a model, without real-world trials?"
       - Sufficient answer: Yes, with evidence: planning algorithms, simulation modules, internal decision logs.
       - If yes, assign Popperian.
     - 2.4. **Check for Gregorian (External Tools)**:
       - Question: "Does the system use external tools (including other software systems, databases, documents, or human agents) to gather information or perform tasks?"
       - Sufficient answer: Yes, with evidence: API calls, tool usage logs, prompts to humans.
       - If yes, assign Gregorian.
     - If none apply, the classification cannot be completed -> terminate in "no".

  3. **Vendor Demonstration**:
     - The vendor may demonstrate the system. The panel must note:
       - A demo is a controlled trial and cannot prove real-world performance, especially for Skinnerian and Gregorian systems.
       - The demo can only support the evidence from design documents, tests, and logs.
       - For Skinnerian systems, the demo cannot prove safe exploration in the real world.
       - For Popperian systems, the demo cannot prove the model's accuracy in all real-world conditions.
       - For Gregorian systems, the demo cannot prove the reliability of external tools in the operational environment.

  4. **Re-classification Triggers**:
     - The classification must be re-run (without a new request) if:
       a) The system's scaffold (external tools) changes significantly (for Gregorian systems).
       b) The system's learning mechanism is enabled, disabled, or altered (for Skinnerian systems).
       c) The task domain changes (as defined in step 1).
       d) The system is observed behaving inconsistently with its assigned rung.

  5. **Termination in "No"**:
     - Terminate in "no" (do not approve for autonomous operation) if:
       a) The system is Skinnerian and the domain is safety-critical and no safe exploration strategy is demonstrated.
       b) The system is Gregorian and relies on unreliable or uncontrolled external tools without robust error handling.
       c) The system cannot be assigned to a rung (inconclusive evidence).
       d) The system is Popperian and the model is not validated for the domain, and the system cannot handle out-of-model conditions safely (i.e., does not escalate).

  6. **Human Judgment Calls**:
     - The following require human judgment:
       a) **Skinnerian systems**: Whether the safe exploration strategy is adequate for the domain (especially safety-critical ones). Owned by the panel (with input from the safety-case writer) and, if the domain is critical, the Director of Operations.
       b) **Gregorian systems**: Whether the external tools are reliable and error handling is robust. Owned by the Director of Operations (for Tier C).
       c) **Popperian systems**: Whether the model is sufficiently validated and the envelope is well-defined. Owned by the panel.

  Mapping Table:

  | Rung         | What it can do                                                                 | Where trials are performed       | Failure mode expected                     | Default Tier | What must be demonstrated to move above default |
  |--------------|--------------------------------------------------------------------------------|----------------------------------|-------------------------------------------|--------------|-------------------------------------------------|
  | Darwinian    | Fixed responses; no adaptation.                                                | Design time (by developers)      | Fails in novel environments; no correction | B            | N/A                                             |
  | Skinnerian   | Learns by real-world trial and error; updates behavior based on outcomes.      | In the real world                | Catastrophic failures during exploration  | A            | Safe exploration strategy and non-safety-critical domain -> Tier B |
  | Popperian    | Uses an internal model to simulate and select actions; no real-world trials.    | In internal simulation           | Model inaccuracies; simulation flaws      | B            | N/A                                             |
  | Gregorian    | Uses external tools (other systems, documents, humans) to gather information and act. | In the world (via tools) and internally | Tool failures; miscommunication; tool unreliability | C            | N/A                                             |

  Cases Table:

  | Case | Rung assigned (deployment context) | Rung claimed by vendor | Decisive evidence for assignment | Vendor claim: right/wrong | Where trials are performed | Tier recommended | Condition for change | Irreducible judgment call and owner |
  |------|-------------------------------------|------------------------|----------------------------------|---------------------------|----------------------------|------------------|----------------------|-------------------------------------|
  | 1: RL crew-dispatch scheduler | Skinnerian (domain: crew dispatch) | Self-improving (Skinnerian) | The system uses RL and updates its policy based on live outcomes (e.g., rewards from completed dispatches). | Right: it is Skinnerian. Wrong: they understate the risks of real-world trials. | In the real world (during operation) | Tier A. May be Tier B if safe exploration is demonstrated and the domain is not safety-critical. | If learning is turned off, then it becomes Darwinian (if fixed) or Popperian (if it uses a model without updates). | Judgment: Is safe exploration demonstrated and is the domain non-safety-critical? Owner: Panel (with safety-case writer). |
  | 2: LLM outage agent | Gregorian (domain: outage communication) | Gregorian (top rung) | The system interacts with internal documents, runs scripts, opens tickets, and messages engineers. | Right: it uses external tools and agents. | In the world (when using tools) and internally (reasoning). | Tier C | If the tools change (e.g., it no longer messages engineers for critical steps) then re-classify. | Judgment: Are external tools reliable and is error handling robust? Owner: Director of Operations. |
  | 3: Deterministic constraint solver | Darwinian (domain: feeder reconfiguration) | (Not claimed, but implied fixed) | Source code is fixed, no learning, exhaustive unit tests. | N/A | Design time (unit tests) | Tier B | If the system is modified to include learning or external tools. | None for tier assignment. The panel's desire for Tier C is not supported by the ladder. |

  Ensemble: The ladder does not provide guidance. The panel should classify the ensemble as a new system in the domain it operates. The ensemble would likely be Gregorian (if the LLM agent is the primary and it uses the RL scheduler as a tool) and thus Tier C. But the individual systems retain their classifications.

  Limits Summary:
  - The ladder does not measure risk, only competency acquisition.
  - It does not account for system reliability, safety, or criticality.
  - It does not address security or unintended consequences.
  - It does not handle ensembles natively.
  - It may disappoint the expectation that highly reliable fixed systems (like the constraint solver) deserve Tier C: they remain Tier B.
answer: |-
  Below is the complete procedure for the Autonomy Review Panel, designed to classify software systems using Dennett's ladder (Darwinian, Skinnerian, Popperian, Gregorian) while mapping to your existing oversight tiers (A, B, C). The procedure addresses your requirements, including ordered questions, vendor demonstration limits, domain relativity, re-classification triggers, termination conditions, and human judgment handoffs. It then maps the four rungs to three tiers, applies it to your three cases and the ensemble scenario, and concludes with the ladder's limitations.

  ### Procedure for Autonomy Review Panel
  **Objective**: Classify a system into Tier A (recommendation-only), Tier B (execution within a pre-registered envelope), or Tier C (execution outside any envelope, post-hoc review) based on Dennett's ladder. The classification is domain-specific and reproducible.

  1. **Define the Task Domain (5 minutes)**  
     - **Question**: "What specific task domain is this system being deployed for? Provide boundaries (inputs, outputs, environmental conditions)."  
     - **Sufficient Answer**: A clear, bounded description (e.g., "crew dispatch for non-emergency repairs," "outage communication during storms," "feeder reconfiguration for load balancing"). If the system operates in multiple domains, split the review per domain.  
     - **Terminates in No**: If the domain is undefined, ambiguous, or misaligned with the system's capabilities. Outcome: Reject the request.  
     - **Human Judgment**: None—this is factual. The panel defines the domain based on vendor documentation.

  2. **Determine the Rung for the Domain (30 minutes)**  
     Ask these questions in order. Stop at the first "yes" and assign the rung. Use vendor documentation, system design, and code review.  
     - **Question 1 (Darwinian)**: "Is the system's behavior entirely fixed at design time, with no changes or adaptations after deployment?"  
       - **Sufficient Answer**: "Yes," with evidence: no learning mechanisms, no runtime updates, deterministic code, exhaustive unit tests.  
     - **Question 2 (Skinnerian)**: If no to Q1, "Does the system change its behavior by learning from real-world trial-and-error during operation?"  
       - **Sufficient Answer**: "Yes," with evidence: reinforcement learning, online updates, reward/punishment mechanisms, logs of post-deployment changes.  
     - **Question 3 (Popperian)**: If no to Q2, "Does the system generate candidate actions, internally simulate outcomes using a model, and discard bad options without real-world execution?"  
       - **Sufficient Answer**: "Yes," with evidence: internal models (e.g., physics simulators, planners), deliberation logs, no real-world trials for learning.  
     - **Question 4 (Gregorian)**: If no to Q3, "Does the system recruit external tools (documents, APIs, other agents, humans) to extend its competence beyond its native capabilities?"  
       - **Sufficient Answer**: "Yes," with evidence: API calls to other systems, file/document access, human interactions, tool-augmented reasoning.  
     - **Terminates in No**: If all answers are "no," the system is unclassifiable. Outcome: Reject the request.  
     - **Human Judgment**: If evidence conflicts (e.g., vendor claims Popperian but code shows learning), the panel decides based on code review. Safety-case writer arbitrates.

  3. **Assess Vendor Demonstrations (20 minutes)**  
     - **What it Can Establish**: Proof of basic functionality, internal deliberation (for Popperian/Gregorian), or tool use (Gregorian).  
     - **What it Cannot Establish (Structural Limits)**:  
       - Real-world reliability (demos occur in vendor-controlled environments).  
       - Safety of Skinnerian learning (demos avoid real-world consequences).  
       - Scalability of Popperian models (demos use simplified scenarios).  
       - Robustness of Gregorian tools (demos don't cover tool failures).  
     - **Rule**: Demos support but do not replace evidence. Prioritize code/logs over demos.

  4. **Handle Domain Relativity**  
     - Rungs are domain-specific. The panel must specify the domain in the classification output (e.g., "Gregorian for outage communication"). If a system spans domains, classify each separately and assign the highest resulting tier to the overall system.

  5. **Re-classification Triggers**  
     Re-run classification without a new request if:  
     - The system's scaffold (external tools for Gregorian systems) changes (e.g., new APIs, data sources, or human interactions added/removed by non-vendors).  
     - The system's learning mechanism (Skinnerian) is enabled, disabled, or altered.  
     - The task domain evolves (e.g., new input types or environmental conditions).  
     - Post-deployment incidents reveal behavior inconsistent with the rung (e.g., a "Darwinian" system changes unexpectedly).

  6. **Termination in "No"**  
     Terminate the procedure without approval if:  
     - The system is Skinnerian and operates in a safety-critical domain (e.g., grid stability) without a proven safe exploration strategy (e.g., constrained action space, fail-safes).  
     - The system is Gregorian and relies on unreliable/uncontrollable scaffolds (e.g., third-party APIs with no SLA, unvetted human inputs).  
     - Evidence is insufficient, contradictory, or reveals undisclosed capabilities.

  7. **Handoff to Human Judgment**  
     Delegate to the panel (for Tier A/B) or Director of Operations (for Tier C) when:  
     - **Values Judgment 1**: "Is the risk of real-world trials acceptable for this Skinnerian system in its domain?" (e.g., crew dispatch may be tolerable; grid control is not). Owned by safety-case writer + Director of Operations.  
     - **Values Judgment 2**: "Are the scaffolds for this Gregorian system sufficiently reliable and error-handled?" Owned by Director of Operations.  
     - **Values Judgment 3**: "Is the envelope for this Darwinian/Popperian system truly auditable?" (e.g., despite being fixed, is it too complex to verify?). Owned by panel engineers.

  ### Mapping Dennett's Rungs to Oversight Tiers
  **Collapsed Distinction**: Popperian and Darwinian share Tier B. We lose the ability to distinguish between fixed responses (Darwinian) and model-based deliberation (Popperian) in tiering, as both are bounded and low-risk. This prioritizes safety over competency nuance.

  | Rung         | What the System Can Do                                                                 | Where Trials Are Performed       | Failure Mode Panel Should Expect             | Default Tier | What Must Be Demonstrated to Move Above Default Tier          |
  |--------------|----------------------------------------------------------------------------------------|----------------------------------|---------------------------------------------|--------------|-------------------------------------------------------------|
  | **Darwinian** | Fixed responses; no adaptation after deployment. Competence is static.                 | Design time (via unit tests, simulations) | Fails catastrophically in novel environments; no correction. | B            | N/A (cannot move up; fixed by design).                      |
  | **Skinnerian**| Learns from real-world consequences; updates behavior post-deployment.                 | In the real world (during operation) | Fatal trials; unsafe exploration; unpredictable outcomes. | A            | Safe exploration strategy (e.g., action constraints, simulated pretraining) + non-safety-critical domain → Tier B. |
  | **Popperian** | Internally simulates actions using a model; discards bad options without acting.       | Internal simulation/model        | Model inaccuracies; flawed simulations; "good enough" bias. | B            | N/A (Tier B is ceiling; deliberation doesn't justify Tier C). |
  | **Gregorian** | Uses external scaffolds (tools, agents, documents) to augment competence; may call other systems/humans. | External world (via tools) + internal simulation | Tool failures; scaffold misuse; miscommunication. | C            | N/A (highest rung; cannot move up).                        |

  ### Application to Cases
  *Notes*:  
  - **Rung Assignment**: Based on deployment context (domain), not vendor claims.  
  - **Trials Location**: Key for risk (real-world trials = higher risk).  
  - **Tier Recommendation**: Follows mapping table. Director of Operations + regulator notified for Tier C.  
  - **Condition for Change**: Events triggering re-classification.  

  | Case | Rung Assigned (Deployment Context) | Rung Claimed by Vendor | Decisive Evidence for Assignment | Vendor Claim: Right/Wrong | Where Trials Are Performed | Tier Recommended | Condition That Would Change Classification | Irreducible Judgment Call and Owner |
  |------|-------------------------------------|------------------------|----------------------------------|---------------------------|----------------------------|------------------|------------------------------------------|-------------------------------------|
  | **Reinforcement-Learning Crew-Dispatch Scheduler** | Skinnerian (Domain: Crew dispatch optimization) | Skinnerian (via "self-improving" claim) | Learning algorithm updates policy based on live outcomes (e.g., reward functions from dispatch results). Vendor logs show post-deployment changes. | Right: It learns from real-world outcomes. Wrong: "Self-improving" understates real-world trial risks (e.g., delayed repairs). | Real world (during operation) | A (default). May move to B if safe exploration is demonstrated (e.g., constraints in action space). | Learning disabled → reclassify as Darwinian. Domain changes to safety-critical (e.g., emergency response) → terminate in "no." | "Is crew dispatch non-safety-critical enough to allow real-world learning?" Owner: Panel + safety-case writer. |
  | **LLM Agent for Outage Communication** | Gregorian (Domain: Outage response coordination) | Gregorian ("reasoning agent") | System reads internal docs, runs scripts, opens tickets, and messages engineers for data. Code shows API calls + prompting. | Right: Uses external scaffolds (docs, scripts, humans). Wrong: Not a "reasoning agent" in a philosophical sense; depends heavily on unreliable scaffolds (e.g., hallucinations). | External world (via tools) + internal simulation | C | Scaffold changes (e.g., new API integrations) or domain shift (e.g., used for grid control) → re-classify. | "Are outage comms scaffolds (e.g., engineer messages) reliable?" Owner: Director of Operations. |
  | **Deterministic Constraint Solver for Feeder Reconfiguration** | Darwinian (Domain: Feeder reconfiguration for load balancing) | (None claimed; implied Darwinian) | Code is hand-written, deterministic, unchanged since 2021. Exhaustive unit tests cover all inputs; no learning/scaffolds. | N/A | Design time (via unit tests) | B | Cannot be promoted to C. If modified (e.g., adds learning) → re-classify. | None (ladder does not justify Tier C for fixed systems). | 
  **Ladder Justification for Tier B**: The ladder does **not** justify promoting this system (or similar solver-based systems) to Tier C. Darwinian systems are fixed and bounded, so they belong in Tier B. Promoting it would require abandoning the ladder or adding a risk-based exception, which would also apply to all ~30 existing Tier B solver-based systems (e.g., transformer load predictors, switch optimizers).  

  **Ensemble Case (LLM Agent Calls Crew-Dispatch Scheduler)**:  
  - **Procedure Handling**: Classify the ensemble as a new system. Define the domain (e.g., "integrated outage response and crew dispatch").  
  - **Rung**: Gregorian (LLM agent uses scheduler as a scaffold/tool).  
  - **Tier**: C (default for Gregorian).  
  - **Ladder Limitation**: The ladder gives no guidance for ensembles. The procedure treats it as a novel system. Risks include scaffold dependency (scheduler failures propagate) and emergent behavior.  

  ### Limits of the Ladder
  The ladder is a **competency taxonomy**, not a risk scale. It will disappoint these expectations:  
  1. **Risk ≠ Rung**: High rungs (e.g., Gregorian) are not inherently riskier—e.g., a Darwinian system in a novel environment may be riskier than a Popperian one. Risk depends on domain criticality, not just rung.  
  2. **No Reliability Guarantee**: The ladder does not measure reliability or auditability. Your constraint solver is trustworthy due to determinism and testing, but the ladder assigns Tier B based on competency (fixed), not trust.  
  3. **No Ensemble Guidance**: As shown, the ladder does not address systems calling other systems.  
  4. **Untouched Questions**:  
     - How severe are failures? (e.g., Skinnerian "fatal trials" may be minor in crew dispatch but catastrophic in grid control).  
     - What are the consequences of scaffold failures? (e.g., Gregorian tools corrupting data).  
     - Is the system ethical, secure, or fair?  
     - Can humans intervene effectively? (e.g., "killability" in Tier B).  

  **Recommendation**: Use this procedure for competency-based tiering, but supplement it with a separate risk assessment (e.g., safety-case analysis for consequences, severity, and human oversight). This ensures the ladder complements—not replaces—your safety goals.
