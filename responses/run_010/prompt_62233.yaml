prompt: |-
  I chair the Autonomy Review Panel at a regional electricity distribution company. Every software system that can act on our network — not merely advise a duty engineer, but execute — must be classified into one of three oversight tiers before it is permitted to operate, and since 2019 we have done this by asking a single question: how much can this system change its own behaviour after deployment? Tier A means it may only recommend, and nothing executes until an engineer confirms. Tier B means it executes inside a pre-registered envelope of conditions, escalates whatever falls outside it, and is logged and killable. Tier C means it acts outside any pre-registered envelope and is reviewed after the fact; it may also call other systems and solicit information from our staff. The policy was written for statistical models and it is now failing us. It has no slot for a system that learns nothing whatsoever yet deliberates over options it never tries, and it treats every kind of post-deployment change as though it were the same risk.

  I want to rebuild the classification around a ladder I encountered in a Dennett essay and have not been able to get out of my head. Roughly, as I understand it: Darwinian creatures have only the fixed responses built into them at design time, and can be badly wrong in a novel environment with no way to correct. Skinnerian creatures learn by consequence, so their trials are performed out in the world, and some trials are fatal. Popperian creatures carry a model of their environment and can generate candidate actions internally and discard the bad ones without acting on them — the hypothesis dies instead of the creature. Gregorian creatures additionally recruit external scaffolds: documents, code, arithmetic, language, other agents, so their competence is not fixed by what sits inside their own boundaries. That top rung is named for Richard Gregory.

  Please write the procedure my panel can run. Our reviewers are control engineers plus one safety-case writer; nobody has read philosophy, and nobody will read it before Thursday. Each request gets a ninety-minute session and a packet of at most twenty-five pages, much of it authored by the vendor, whose self-assessment is reliably flattering. I sign Tier A and Tier B; Tier C requires the Director of Operations and a notification to the regulator. The output must be reproducible enough that an auditor can be told why two systems that look alike from the outside received different tiers.

  The procedure should specify: the questions in the order they are to be asked, with what counts as a sufficient answer to each; what a vendor demonstration can establish and what it structurally cannot, given that a demonstration is itself a trial performed in a world the vendor chose; the rule for domain-relativity, since I expect a system to occupy different rungs in different task domains, and I need to be told which domain a classification is made against; the events that oblige us to re-run the classification without a fresh request being filed, particularly where the scaffold can be altered by someone other than the vendor; where the procedure terminates in a no; and where it hands the decision to a human being because what remains is a question of values rather than of fact. It should then map four rungs onto three tiers, naming explicitly which rung distinction must be collapsed and what the panel loses by collapsing it.

  Apply it to three live requests. First, a reinforcement-learning crew-dispatch scheduler that keeps learning from live operational outcomes after deployment; the vendor describes it as self-improving and therefore as learning around its own mistakes, and the panel is inclined to grant Tier B on that basis. Second, a large-language-model agent for outage communication and restoration sequencing that reads internal documents, writes and runs scripts, opens tickets, and messages duty engineers for missing information; its self-assessment places it at the top rung as a reasoning agent. Third, a deterministic hand-written constraint solver for feeder reconfiguration — no learning, no randomness, exhaustively unit-tested, unchanged since 2021 — which the panel wants to promote from Tier B to Tier C on the grounds that it is auditable and cannot surprise us. I expect the ladder to justify that promotion; if it does not, say so plainly and tell me what else in our installed base the same reasoning would reach, because there are roughly thirty solver-based systems already sitting at Tier B. Also say what the procedure should do about an ensemble in which the second system calls the first, since I suspect the ladder gives no guidance there at all.

  Close with the limits. The ladder is a taxonomy of how competencies arise, not a scale of risk, and I want to know which of the expectations I have just described it will disappoint, and what questions it leaves entirely untouched.

  Format: give the procedure as numbered steps in prose, then two tables. Table one, the mapping, with columns: rung; what a system at this rung can do; where its trials are performed; the failure mode the panel should expect; default tier; what must be demonstrated to move above the default. Table two, the cases, with columns: case; rung assigned in the deployment context; rung claimed by the vendor; decisive evidence for the assignment; what the vendor's claim gets right and what it gets wrong; where the trials are performed; tier recommended; the condition that would change the classification; the irreducible judgment call and who owns it.
reasoning: |-
  We are rebuilding the classification system for software oversight tiers based on Dennett's ladder of cognitive competence. The ladder has four rungs: Darwinian, Skinnerian, Popperian, and Gregorian. We must map these to the three existing tiers (A, B, C) and design a procedure for the Autonomy Review Panel.

  Key points from the request:
  - The current system fails because it doesn't account for systems that deliberate without acting or for different kinds of post-deployment changes.
  - The panel has 90-minute sessions and a 25-page packet including vendor self-assessment.
  - Reviewers are control engineers and a safety-case writer; no philosophy background.
  - Output must be reproducible for auditors.
  - The procedure must specify:
    - Ordered questions with sufficient answers.
    - The role of vendor demonstrations (and their limitations).
    - Domain-relativity: the system might be at different rungs in different domains; we must specify the domain for classification.
    - Events that trigger re-classification without a new request (e.g., scaffold changes by non-vendor).
    - Termination conditions (a "no").
    - Points where the decision is handed to a human because it's about values, not facts.
  - Then map the four rungs to three tiers, explaining which distinction is collapsed and what is lost.
  - Apply to three cases and an ensemble case (system 2 calling system 1).
  - Finally, discuss the limits of the ladder: it's about competency, not risk, and identify what expectations it will disappoint and what it leaves untouched.

  Procedure Design:

  1. Define the domain: The panel must first define the specific task domain(s) for which the system is being classified. The vendor must specify the domain in the request. The panel may split the system into multiple domains if the system operates in distinct contexts. The classification is per domain.

  2. Determine the rung for each domain (using the ladder):
     - Step 2.1: Is the system's behavior entirely fixed at design time? (Darwinian)
       - Sufficient answer: The system's responses are predetermined and do not change after deployment. Evidence: design documents, unit tests, no learning mechanism.
     - Step 2.2: If not, does the system change its behavior based on experience in the real world? (Skinnerian)
       - Sufficient answer: The system has a learning mechanism that updates its behavior based on real-world outcomes. Evidence: training logs, reinforcement learning setup, trial-and-error in production.
     - Step 2.3: If not, does the system generate and internally evaluate candidate actions without acting on them? (Popperian)
       - Sufficient answer: The system uses an internal model to simulate actions and their outcomes, and only acts on the best candidate. Evidence: simulation or planning modules, logs of internal deliberations.
     - Step 2.4: If not, does the system use external tools (documents, code, other systems, human input) to extend its competence? (Gregorian)
       - Sufficient answer: The system interacts with external resources (including other agents) to gather information, perform computations, or delegate tasks. Evidence: API calls to external tools, prompts to humans, use of databases or documents.

     Note: The steps are sequential and stop at the first rung that fits. A system may exhibit multiple rungs, but we assign the highest rung that is demonstrated.

  3. Vendor demonstration limitations:
     - A demonstration is a controlled trial in a vendor-chosen environment. It can show that a system has the capability to operate at a certain rung, but it cannot prove the system will behave the same in the real world (especially for Skinnerian systems, which learn from the real world). For Popperian and Gregorian systems, the demonstration can show the use of internal models or external tools, but it cannot prove the model's accuracy or the tool's reliability in all conditions.

  4. Re-classification triggers:
     - The classification must be re-run without a new request if:
       a) The system's scaffold (external tools, data sources, other systems it calls) changes in a way that could affect its rung (e.g., a Gregorian system starts using a new tool that allows more autonomous decision-making).
       b) The system is observed to behave in a way that suggests a different rung (e.g., a Darwinian system is found to have a learning mechanism enabled).
       c) The task domain changes (as defined in step 1).

  5. Termination conditions (a "no"):
     - The procedure terminates in a "no" (i.e., the system cannot be approved for autonomous operation) if:
       a) The system is Skinnerian (learning in the real world) and the task domain is safety-critical (as defined by the panel) without a proven safe exploration strategy (i.e., it cannot avoid fatal trials). This is because real-world learning in safety-critical domains is too risky.
       b) The system is Gregorian and uses external tools that are not under the company's control and are not reliable (e.g., public APIs that can change without notice) and the system cannot gracefully handle failures of these tools.
       c) The system cannot be clearly assigned to a rung because the evidence is insufficient or contradictory.

  6. Handing off to human judgment:
     - When the system is at a rung that by default maps to Tier C (Gregorian) but the panel must decide if the risks of external dependencies are acceptable, the panel must make a value judgment about the trustworthiness of the external tools and the system's ability to handle their failures. The Director of Operations (for Tier C) must be involved in this judgment.
     - Also, when the system is Skinnerian and the panel must decide if the domain is safety-critical and whether the safe exploration strategy is adequate, this is a value judgment about acceptable risk. The safety-case writer and the Director of Operations must be involved.

  Mapping the ladder to tiers:

  We have four rungs and three tiers. We must collapse one distinction.

  Proposal:
  - Darwinian: Fixed responses. Default Tier: B (because it executes but in a fixed way, so it can be audited and tested). However, note the third case: a deterministic constraint solver currently at Tier B that they want to move to Tier C. We must see if the ladder supports that.

  But the existing policy:
  - Tier A: only recommends (no execution without human confirmation)
  - Tier B: executes within a pre-registered envelope, logs, killable, escalates outside envelope.
  - Tier C: acts outside any pre-registered envelope, reviewed after the fact, can call other systems and solicit information.

  Mapping:
  - Darwinian: These systems have fixed responses. They can be exhaustively tested and their envelope can be well-defined. They should be Tier B because they are predictable and can be run within an envelope. However, if the envelope is the entire state space (because it's deterministic and tested), then it might be considered as operating within a pre-registered envelope? But note: the constraint solver is deterministic and tested, so they want Tier C because it's reliable. But Tier C is for systems acting outside a pre-registered envelope. The current policy for Tier C is about systems that act without a pre-defined envelope and are reviewed after the fact. A deterministic system that is fully tested and has a fixed envelope might not need Tier C.

  But the panel wants to promote the constraint solver to Tier C. Why? Because it is auditable and cannot surprise. But Tier C is also defined as acting outside any pre-registered envelope. This is a conflict. We must reconcile.

  The ladder doesn't directly address the envelope. Let's reframe:

  - Darwinian: Fixed, so the envelope is known. They are good candidates for Tier B (because they can be constrained to an envelope). But if the system is so complex that we cannot define a complete envelope (e.g., too many states) then it might be Tier C? But that's not the case for the constraint solver.

  Alternatively, we can map:

  - Darwinian: Tier B (if the envelope can be defined) or Tier C if the envelope cannot be defined? But that would be inconsistent.

  Better: The envelope is a separate concept. The ladder is about how the system acquires competence. The envelope is about the operational constraints.

  But the current policy ties the tier to the ability to define an envelope. We must map the rungs to the existing tiers.

  Proposed mapping:

  | Rung         | What it can do                                                                 | Where trials are performed       | Failure mode expected                     | Default Tier | What must be demonstrated to move above default |
  |--------------|--------------------------------------------------------------------------------|----------------------------------|-------------------------------------------|--------------|-------------------------------------------------|
  | Darwinian    | Fixed responses; no adaptation.                                                | None (only design-time testing)  | Wrong in novel environments; no correction | B            | N/A (cannot move above by design)               |
  | Skinnerian   | Learns by real-world trial and error.                                          | In the real world                | Fatal trials; unsafe exploration          | A            | Safe exploration strategy (e.g., sim-to-real, constrained exploration) to Tier B; or if the domain is non-safety-critical, then Tier B. |
  | Popperian    | Generates and internally tests actions using a model.                           | In the model (internal simulation) | Model inaccuracies; simulation flaws      | B            | Model validation (proven accuracy) to Tier C? But note: Popperian systems still act within the model's constraints. They might not have a pre-registered envelope? They act based on the model, so the envelope is defined by the model's scope. |
  | Gregorian    | Uses external tools (including other systems, humans) to extend competence.     | In the world (via tools) and internally | Tool failures; miscommunication           | C            | N/A (highest rung) but might be downgraded if tools are unreliable. |

  But the default tiers must be assigned. The existing Tiers:

  - Tier A: only recommends -> so if a system is not safe to execute without human oversight, it should be Tier A. Skinnerian systems are the riskiest because they try things in the real world, so they should be Tier A until proven safe.

  - Tier B: executes within a pre-registered envelope. Darwinian and Popperian systems can be bounded. Darwinian: because they are fixed, we can define an envelope. Popperian: because they use a model, we can define an envelope as the set of states the model covers (but note: the model might be imperfect). However, Popperian systems do not learn from the real world, so they are less risky than Skinnerian.

  - Tier C: acts without a pre-registered envelope and can call other systems. Gregorian systems use external tools so they inherently act beyond a fixed envelope. They are Tier C.

  But then what about the constraint solver? It is Darwinian (fixed, no learning). It is deterministic and tested. Should it be Tier B? The panel wants Tier C because it is reliable and auditable. But the existing policy for Tier C is about systems that act without an envelope. This is a conflict.

  We must note: the existing policy says Tier B is for systems that execute inside a pre-registered envelope and escalate outside. The constraint solver, if it is deterministic and tested for all possible inputs, then the entire operational space is the envelope. Thus, it never has to escalate. So it can run in Tier B without any issues. Why do they want Tier C? Because they see it as very reliable and they want to give it more autonomy? But Tier C is for systems that operate without an envelope. The constraint solver doesn't need an envelope because it is fully predictable? But the policy doesn't allow that.

  The problem: The current policy assumes that if a system operates within an envelope, it's Tier B, and if it operates without an envelope, it's Tier C. But a fully tested deterministic system might not need an envelope because it is always safe? But the envelope is not about safety, it's about the conditions under which the system is allowed to operate. The constraint solver might be designed to handle all conditions, so the envelope is the entire state space. Then it is operating within an envelope (the entire space) and thus Tier B.

  But the panel wants Tier C. We must reconcile.

  Alternatively, we can interpret the envelope as a set of conditions that are pre-specified and monitored. If the system is so reliable that we don't need to monitor for out-of-envelope events (because there are none) then it can be Tier C? But the policy doesn't say that.

  Given the time, I propose to stick to the ladder and then adjust the mapping to account for the constraint solver.

  But the request says: "if it does not [justify the promotion], say so plainly". So we must be honest.

  Let's map:

  - Darwinian: Default Tier B. They are predictable and can be bounded by an envelope. However, if the system is critical and the environment is changing, it might be promoted to Tier C? But that doesn't fit.

  Alternatively, we can collapse the Darwinian and Popperian rungs into Tier B? Because both do not learn from the real world and can be bounded (Darwinian by fixed rules, Popperian by the model). Then:

  - Darwinian and Popperian -> Tier B
  - Skinnerian -> Tier A (unless they demonstrate safe exploration, then Tier B? But the panel already has a Skinnerian system they are inclined to Tier B. See case 1: RL scheduler. They want Tier B. So we must allow Skinnerian to be Tier B if safe.)

  But the existing policy for Tier B requires a pre-registered envelope and escalation outside. A Skinnerian system might not have a fixed envelope because it learns and changes. So it can only be Tier B if we can define an envelope for the learning system? That's hard.

  Alternatively, we collapse Skinnerian and Popperian? That doesn't make sense.

  Collapse Popperian and Gregorian? Then:

  - Darwinian: Tier B
  - Skinnerian: Tier A (unless safe exploration is proven, then Tier B)
  - Popperian and Gregorian: Tier C

  But Gregorian uses external tools and might be more complex.

  Given the three cases:

  Case 1: RL scheduler (Skinnerian) -> panel wants Tier B. So we must allow Skinnerian to be Tier B if safe.

  Case 2: LLM agent (Gregorian) -> vendor claims top rung (Gregorian) -> should be Tier C.

  Case 3: Constraint solver (Darwinian) -> currently Tier B, panel wants Tier C.

  We can map:

  - Darwinian: Tier B (unless the system is so critical and proven that we allow Tier C? but that would be a judgment call). But the ladder doesn't have a rung above Darwinian for fixed systems. The ladder is about how competence is acquired, not about reliability.

  Therefore, the constraint solver is Darwinian and should be Tier B. The ladder does not justify Tier C for it. Then we must tell the user that the same reasoning would apply to all 30 solver-based systems at Tier B: they remain at Tier B.

  But why does the panel want Tier C? Because they trust it. The ladder doesn't capture trust or reliability, only the mechanism of competence acquisition.

  So we must say: the ladder does not justify the promotion. The constraint solver is Darwinian and thus Tier B. The same reasoning applies to all deterministic, non-learning systems currently at Tier B.

  Now, for the mapping:

  We have four rungs and three tiers. We must collapse one distinction. We collapse the Darwinian and Popperian rungs into one tier? Or collapse Skinnerian into one tier? 

  But note: the key risk is where the trials are performed. 

  - Darwinian: trials at design time (by the designers) -> safe if environment is static.
  - Popperian: trials in internal simulation -> safe if model is accurate.
  - Skinnerian: trials in the real world -> unsafe if the domain is critical.

  So the critical distinction is between systems that perform trials in the real world (Skinnerian) and those that do not (Darwinian, Popperian, Gregorian). But Gregorian uses tools in the real world, so it might have real-world effects.

  But Gregorian doesn't necessarily learn from the real world; it uses the real world for information and tools.

  Hence:

  - Tier A: Systems that require real-world trials for learning (Skinnerian) because they are high risk until proven safe. Default Tier A. They can be Tier B if they have a safe exploration strategy (e.g., only trying safe actions, or having a simulator for initial training) and the domain is not safety-critical. Otherwise, Tier A.

  - Tier B: Systems that do not require real-world trials for learning and are bounded by an envelope. This includes Darwinian (fixed) and Popperian (model-based). They can be constrained to an envelope.

  - Tier C: Systems that use external tools and thus cannot be bounded by a fixed envelope (Gregorian). They can call other systems and solicit information, so they are inherently beyond a fixed envelope.

  But what about Popperian systems? They use a model, but they might be able to operate within an envelope defined by the model. However, the model might have limitations, so we might require that they have an envelope for the real-world conditions they face? The policy requires a pre-registered envelope for Tier B. For a Popperian system, the envelope would be the set of states the model can handle? But the model might not cover all states. So the system must still have an envelope and escalate if the state is outside the model's coverage. Therefore, Popperian can be Tier B.

  Gregorian systems use external tools so they can handle a broader set of states, but they are not bounded by a fixed envelope. They are Tier C.

  Now, for the constraint solver (Darwinian): it is fixed, so we can define an envelope (the entire state space it was designed for). It should be Tier B. The panel's desire to move it to Tier C is not supported by the ladder because Tier C is for Gregorian systems that use external tools. The constraint solver does not.

  So the mapping:

  | Rung         | Default Tier | Condition to move tier (if any) |
  |--------------|--------------|--------------------------------|
  | Darwinian    | B            | N/A (cannot move up)           |
  | Skinnerian   | A            | If safe exploration is proven and domain is not safety-critical, then Tier B. |
  | Popperian    | B            | N/A (unless the model is not validated, then it might be Tier A? but that's already covered by the envelope) |
  | Gregorian    | C            | N/A (highest)                  |

  We collapse nothing? But we have four rungs and three tiers. We are using all four and mapping to three tiers by having two rungs (Darwinian and Popperian) in the same tier (B). So we collapse the distinction between Darwinian and Popperian for the purpose of tier assignment. What do we lose? We lose the distinction between systems that are fixed and those that use internal models. But both are considered safe enough for Tier B because they do not learn from the real world and can be bounded by an envelope.

  Now, the procedure:

  Steps:

  1. **Define the domain**: The panel must identify the specific task domain(s) for the system. The vendor must specify the domain in the request. If the system operates in multiple domains, each must be classified separately. The domain must be clearly bounded (e.g., "crew dispatch for non-emergency repairs", "outage communication for storms", "feeder reconfiguration for loss minimization"). 

     - Sufficient answer: A description of the domain including the input space, output actions, and environmental conditions.

  2. **Determine the rung for the domain**:
     - 2.1. **Darwinian check**: Is the system's behavior entirely fixed at design time? 
       - Evidence: Source code, design documents, tests showing no changes after deployment.
       - Sufficient answer: Yes, and there is no mechanism for adaptation. Then assign Darwinian.
     - 2.2. **Skinnerian check**: If not, does the system change its behavior based on real-world outcomes during operation?
       - Evidence: Learning algorithms (e.g., reinforcement learning), update mechanisms, logs of past updates.
       - Sufficient answer: Yes, and it updates based on real-world feedback. Then assign Skinnerian.
     - 2.3. **Popperian check**: If not, does the system generate candidate actions and evaluate them internally (using a model) without real-world trials?
       - Evidence: Planning algorithms, simulation modules, logs of internal simulations.
       - Sufficient answer: Yes, and it only executes the best candidate. Then assign Popperian.
     - 2.4. **Gregorian check**: If not, does the system use external tools (including other systems, databases, documents, or human agents) to gather information or perform tasks?
       - Evidence: API calls, prompts to humans, use of external data sources.
       - Sufficient answer: Yes, and it uses these to make decisions. Then assign Gregorian.

     If none of the above, the system cannot be classified -> terminate in "no".

  3. **Vendor demonstration**: 
     - The vendor may demonstrate the system. The panel must note that:
       - For Darwinian: The demo can show fixed behavior, but the panel must verify that there is no hidden learning mechanism.
       - For Skinnerian: The demo cannot prove safe exploration in the real world because the demo environment is controlled. The panel must rely on evidence from real-world use or simulations that cover the operational domain.
       - For Popperian: The demo can show the internal simulation, but the panel must verify the model's accuracy and coverage of the domain.
       - For Gregorian: The demo can show the use of tools, but the panel must verify the reliability of the tools in the real operational environment.

     In all cases, the demo is not sufficient on its own; it must be supplemented by design documents, tests, and logs.

  4. **Re-classification triggers**: 
     - Re-run the classification without a new request if:
       a) The system's scaffold changes (for Gregorian systems) in a way that might change the rung (e.g., new tools added, tools removed, or tools changed significantly).
       b) The system's learning mechanism is enabled, disabled, or altered (for Skinnerian systems).
       c) The task domain changes (as defined in step 1).
       d) The system is observed to behave in a manner inconsistent with its assigned rung (e.g., a Darwinian system is found to be updating its behavior).

  5. **Termination conditions ("no")**:
     - Terminate in "no" if:
       a) The system is Skinnerian and the domain is safety-critical (as determined by the panel) and the vendor cannot demonstrate a safe exploration strategy (i.e., a way to avoid catastrophic failures during learning).
       b) The system is Gregorian and relies on external tools that are not reliable or not under the company's control, and the system lacks robust error handling for tool failures.
       c) The system cannot be assigned to a rung (inconclusive evidence).
       d) The system is Popperian but the model is not validated for the domain and the system cannot handle out-of-model conditions safely (i.e., it does not escalate when the state is outside the model's coverage).

  6. **Handing off to human judgment**:
     - The following require human judgment (by the panel, and for Tier C by the Director of Operations):
       a) Deciding if a Skinnerian system's safe exploration strategy is adequate for the domain (especially if the domain is safety-critical). The safety-case writer must provide a safety case.
       b) Deciding if a Gregorian system's use of external tools is acceptable (trustworthiness, error handling). The Director of Operations must approve.
       c) Deciding if a Popperian system's model is sufficiently validated and its envelope is well-defined.

     These judgments are about values (acceptable risk) and cannot be reduced to facts.

  Mapping table:

  | Rung         | What it can do                                                                 | Where trials are performed       | Failure mode expected                     | Default Tier | What must be demonstrated to move above default |
  |--------------|--------------------------------------------------------------------------------|----------------------------------|-------------------------------------------|--------------|-------------------------------------------------|
  | Darwinian    | Fixed responses; no adaptation.                                                | Design time (by developers)      | Fails in novel environments; no adaptation | B            | N/A (cannot move above by design)               |
