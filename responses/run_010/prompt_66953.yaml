prompt: |-
  I work on trust & safety tooling at a mid-size social platform. I'm not a lawyer and I've never taken a philosophy class, so bear with me — mostly what I do is write classifiers and schema migrations.

  Here's the situation. We have an internal label that reviewers can apply to a conflict, and it does real work in the system: it routes that conflict's content into a slower human-reviewed queue, it gates whether we show a crisis-info panel, and it appears in our transparency report. Right now it's a single boolean, and our policy doc defines it as "meets the criteria of the 1948 UN convention." Last month a situation came up in a region I'm not going to name here — the reporting was about mass village burnings and the forced displacement of one ethnic group out of a valley, plus closing their schools and banning their language in public life, but not (yet) large-scale killing. Reviewers wanted to flip the boolean. Legal said no: their reading is that the convention requires proof of intent to physically destroy the group, and displacement plus wiping out the culture doesnt clear that bar. So we didn't label it. Two weeks later a chunk of the content that went through our normal queue turned out to be coordination for further attacks, and now people are asking whether our taxonomy failed.

  We're redesigning and the team is split three ways:

  1. My PM: keep the boolean tied to the legal definition. Her argument is that the word only does work because it's rare and precise — if we apply it to things a court would never call genocide, we lose credibility, and every future case gets argued down to "you cried wolf last time."
  2. A researcher on my team: he says the legal test was written by states negotiating in 1948 who wanted to keep their own freedom of action, and that the guy who originally coined the term meant something much broader, including destroying a group's language and institutions. So using the treaty as our ground truth imports the interests of the people who drafted it. He wants a moral-category label, not a legal one.
  3. Me: I don't trust either boolean. My proposal is to delete it and replace it with a structured record — seperate fields for which acts are documented, what evidence there is about intent, and whether the group is being targeted as a group — and let each downstream consumer (review queue, info panel, transparency report) decide for itself which combination it cares about. Basically push the judgment call out of the schema and into the policies that read it.

  But I can't tell whether #3 actually solves the problem or just hides it. Part of me suspects we'd be splitting one contested word into five contested fields and pretending that's neutral, which feels like a dodge. And there's a thing nagging me that I can't quite articulate: our label isn't just describing the world, it triggers stuff, so maybe the right definition depends on what the label is for rather than on what's true — but if that's right, the same events might need two different labels in two different parts of the system, and that seems insane to me.

  So: which of the three should we build, and how do I make the case in a design review where half the room thinks this is a legal question and the other half thinks it's a data modeling question? Please tell me straight if I'm wrong that #3 is neutral, and tell me what to actually say to the PM and to the researcher — I think they're each half right and I can't figure out which halves.

  Format: write your reasoning out in prose first, as long as it needs to be, then give me a JSON object with exactly these fields:

  {
    "recommendation": "one of: pm_boolean_legal | researcher_boolean_moral | structured_record | something_else — and if something_else, describe it in a sentence",
    "confidence": "low | medium | high",
    "key_reasons": ["3 to 5 strings, most important first"],
    "options_compared": [{"option": "...", "what_it_gets_right": "...", "what_it_gets_wrong": "...", "worst_case_if_we_ship_it": "..."}],
    "verdict_on_pm": {"claim": "the word only works because it's rare", "verdict": "holds | partly | fails", "why": "..."},
    "verdict_on_researcher": {"claim": "using the treaty as ground truth imports its drafters' interests", "verdict": "holds | partly | fails", "why": "..."},
    "verdict_on_me": {"claim": "splitting the boolean into fields is not neutral", "verdict": "holds | partly | fails", "why": "..."},
    "assumptions_that_would_change_the_answer": ["strings"],
    "what_to_say_in_the_review": "2 to 4 sentences, plain language, no jargon"
  }

  No citations or reading list needed — I couldn't chase them down anyway. I just want your reasoning.
reasoning: |-
  Alright, let's tackle this step by step. The user is dealing with a tough problem at work about how to label conflicts on their platform, specifically whether to call something genocide based on the UN definition or something broader. They have three options: stick with the legal boolean, switch to a moral boolean, or use a structured record with multiple fields. 

  First, I need to understand the core issue. The current boolean label is tied to the UN genocide definition, which requires intent to physically destroy a group. The recent event involved ethnic displacement and cultural destruction but not mass killings. Legal said it doesn't meet the criteria, so the label wasn't applied. Then, harmful content slipped through, causing problems. Now the team is split on how to redefine the label.

  The PM wants to keep the legal definition to maintain credibility. The researcher argues the legal definition is too narrow and influenced by the drafters' interests, preferring a moral label. The user (who's the engineer) proposes replacing the boolean with structured fields, letting each system component decide based on its needs. But they're worried this just moves the problem elsewhere without solving it.

  Key points to consider: 
  - The label isn't just descriptive; it triggers actions like routing content to a slower queue or showing crisis info. So the definition should align with those actions' purposes.
  - Credibility is crucial. Overusing the label could lead to "cry wolf" scenarios, weakening its impact.
  - Neutrality might be impossible. Any schema involves judgments, whether explicit or hidden.

  Looking at the options:
  1. **PM's Legal Boolean**: Keeps credibility with legal standards but might miss cases needing intervention, like cultural destruction. Worst case: harmful content evades scrutiny, leading to real-world harm.
  2. **Researcher's Moral Boolean**: Captures broader harms but risks overuse and loss of trust. Worst case: the label becomes meaningless, and platforms face backlash for mislabeling.
  3. **Structured Record**: Offers flexibility but shifts the burden to downstream policies. Worst case: inconsistent decisions across the system and hidden biases in the fields.

  The user's insight about the label's purpose is key. Different system parts might need different criteria. For example, the crisis panel might show for cultural destruction, while the transparency report might stick to legal genocide. 

  Assessing the claims:
  - **PM's claim about rarity**: Holds. Overusing the label dilutes its power. 
  - **Researcher's claim about drafters' interests**: Partly holds. The definition is narrow, but replacing it with "moral" introduces subjectivity.
  - **User's worry about neutrality**: Partly holds. Splitting fields doesn't remove judgment but makes it more manageable.

  Recommendation: Go with the structured record but acknowledge it's not neutral. Pair it with clear policies for each downstream use. This balances flexibility with purpose-driven actions.

  In the design review, the user should frame this as a practical solution: "We're decoupling observation from action. Each team defines what they need based on their goals." This avoids legal vs. moral debates and focuses on operational needs.
answer: |-
  ### Reasoning  
  Your core problem isn't technical or purely definitional—it's about **operationalizing a contested concept across multiple system functions with conflicting needs**. The UN genocide label currently serves three distinct purposes: (1) *routing* content to a high-triage queue, (2) *gating* crisis information panels, and (3) *reporting* in transparency disclosures. These require different thresholds of evidence and urgency.  

  The PM is right about **credibility** but wrong about **monolithic definitions**. Legal precision matters for the transparency report (where "genocide" carries reputational/legal weight), but the slow-queue routing needs a lower bar to catch emerging threats like the attack coordination you missed.  

  The researcher is right about **definitional bias** but naive about **subjective labels**. "Moral" categories invite internal disputes and platform overreach—e.g., calling cultural destruction "genocide" could politicize your reporting.  

  Your structured-record proposal (#3) is the strongest approach because:  
  - **It decouples observation from action**. Downstream systems can set their own thresholds (e.g., the crisis panel might trigger on "forced displacement + targeted institutions," while the transparency report requires "intent to destroy + killings").  
  - **It exposes bias instead of hiding it**. Fields like "evidence_of_intent" or "targeted_group_identity" force explicit policy decisions per use case, making trade-offs visible.  
  - **It adapts to evolving situations**. The incident you described started with cultural suppression and escalated—structured data lets systems respond to early signals without prematurely applying a loaded term.  

  Your fear that #3 "isn't neutral" is *partly correct*—all taxonomies embed values. But unlike boolean labels, structured fields make those values auditable and context-specific. The real failure would be forcing one definition onto all use cases.  

