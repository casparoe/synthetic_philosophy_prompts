      "why": "Fields still reflect design choices (e.g., what constitutes 'intent'). But they make bias traceable and contextual."
    },
    "assumptions_that_would_change_the_answer": [
      "If all downstream functions shared identical risk/evidence thresholds",
      "If legal liability outweighed operational safety needs",
      "If reviewers couldn't handle nuanced data entry"
    ],
    "what_to_say_in_the_review": "We're not deciding what genocide is. We're building tools to route harmful content, show crisis resources, and report accurately. Those need different inputs. A structured record lets each function define its own rules based on the same evidence. This keeps our transparency reports legally defensible while letting safety tools act faster on threats like the attacks we missed."
  }
  ``` 

  ### Key Arguments for Your Design Review  
  - **To the PM**: "Your concern about credibility is why we *must* split this. We can’t water down ‘genocide’ in transparency reports, but we also can’t let legal thresholds blind us to emerging violence. Structured data lets us keep strict definitions for reporting while lowering the bar for *preventive* actions."  
  - **To the Researcher**: "Your point about the UN definition’s limitations is valid, but a ‘moral’ label replaces one rigidity with another. With granular fields, we can flag cultural destruction for crisis resources *without* calling it genocide in reports—respecting both the victims and the term’s gravity."  
  - **To Both**: "This isn’t philosophy or law—it’s risk engineering. If a single boolean failed because it tried to be three things at once, let’s stop asking it to do that."
