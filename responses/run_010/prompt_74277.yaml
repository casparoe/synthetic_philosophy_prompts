answer: |-
  Your challenge misunderstands the nature of the problem. Composition isn't about whether the aggregate *functions* as a single aim—it's about whether that functional aim *legitimately represents* the underlying plurality. Consider two worlds:  

  In World A (mere specification difficulty), a system might drift from a clear, intended target due to optimization failures or deceptive alignment—say, pursuing paperclip maximization when instructed otherwise. The pathology stems from misalignment with a specifiable ideal.  

  In World B (composition failure), the system *perfectly* reflects its training data's statistical properties, yet produces morally incoherent outcomes. For instance: it consistently dismisses minority ethical perspectives not because they're contradicted by data, but because they’re statistically submerged (collapse); or it amplifies one coherent subgroup’s views (e.g., Western academic ethics) because their arguments are structurally easier to model than nuanced contradictions (capture). Crucially, this happens *while* the system is technically aligned—it’s faithfully optimizing the aggregate target. The difference manifests in unowned normative voids: decisions that reflect no one’s values, yet aren’t errors relative to the data. You’d observe systems resolving moral dilemmas in ways no human group would endorse, not from drift, but from the arithmetic of aggregation itself.  

  Collapse and capture aren’t instability—they’re stable, pathological equilibria where the system’s "aim" is a distortion byproduct. That’s irreducible to specification failure.
