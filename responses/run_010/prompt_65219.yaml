answer: |-
  ### The Practice, Restated
  The standard practice employs the Social Cost of Carbon (SCC), currently estimated by the EPA at approximately $190 per metric ton of CO₂ avoided (using a 2% discount rate in its central estimate). This value is derived from Integrated Assessment Models (IAMs). These models project future global economic output (GDP), emissions pathways, their translation into global temperature changes, and the resulting economic damages expressed as a percentage of GDP. Damages are primarily calibrated on quantifiable sectors: agriculture, labor productivity (e.g., heat stress), energy demand, and specific health outcomes. The monetized damages are then discounted back to present value. The EPA explicitly notes that this estimate is likely conservative, as significant categories of potential damages (ecosystem collapse, tipping points, conflict, migration) are excluded due to lack of robust monetization methodologies. Simultaneously, for rules reducing co-pollutants like particulate matter (PM2.5), the agency monetizes avoided health impacts using established values for a Statistical Life (VSL, ~$10M+), avoided asthma ER visits, and lost workdays. In regulatory analysis, if the estimated cost per ton of CO₂ abated by a proposed rule is below the SCC, the rule is deemed cost-beneficial. If the cost per ton exceeds the SCC, the rule requires alternative justification.

  ### What it Strictly Presupposes
  The practice fundamentally presupposes **welfarist consequentialism**. The *only* relevant moral consideration is the aggregate impact on human well-being, measured in monetary equivalents. This commits to several non-negotiable elements:

  1.  **Marginalism & Fungibility:** The value assigned ($190/ton) represents the *marginal* damage of one additional ton of CO₂. It presupposes that the harm caused by a ton of CO₂ is identical regardless of source, location, or context (geographical fungibility), and that the benefit of avoiding it is equally transferable. The atmosphere is treated as a single, well-mixed sink; the only ledger that matters is the global atmospheric concentration.
  2.  **Monetization & Commensurability:** All relevant impacts on human welfare *must* be convertible into a common monetary metric to be included in the aggregate calculus. Impacts deemed non-monetizable are excluded from the core benefit-cost calculation, regardless of potential severity. This presupposes that welfare impacts from diverse sources (crop loss, premature death, heat stress) are commensurable via money.
  3.  **Utilitarian Aggregation:** The goal is maximizing net global welfare (aggregate consumption equivalent). Distributional concerns (who bears costs, who receives benefits, across generations or geographies) are secondary or require separate justification.
  4.  **Expected Utility & Risk Neutrality:** Projections of GDP, emissions, climate sensitivity, and damages are inherently uncertain. The SCC represents a *central estimate* of the *expected* damage. This presupposes risk neutrality regarding catastrophic outcomes not captured in the central projection or excluded due to non-monetization. The focus is on the mean expected value.
  5.  **Descriptive Discounting:** Discounting future damages is essential and non-separable. It strictly presupposes that future welfare *is* less valuable than present welfare *simply because it occurs in the future* (pure time preference), *and/or* that future generations will be wealthier (declining marginal utility of consumption). A 0% pure time preference rate would fundamentally alter the implied ethical stance toward future generations but wouldn't remove the core commitment to aggregating and monetizing welfare impacts over time. The discount rate isn't just a parameter; it embodies the core welfarist-consequentialist view of intertemporal valuation.

  ### What it Merely Fits
  The practice is compatible with, but not strictly dependent on, several broader views:

  1.  **Technocratic Pragmatism:** The immediate justification is tractability: regulators need a single, comparable number for consistent decision-making within existing legal frameworks (like Executive Order 12866). The SCC provides a feasible, standardized input for cost-benefit analysis forms.
  2.  **Weak Sustainability:** It fits the view that natural capital (like a stable climate) can be largely substituted by manufactured capital or technological progress, provided aggregate welfare is maintained or increased. The damage function implicitly assumes significant adaptive capacity.
  3.  **Pareto Efficiency (Potential):** While not guaranteeing Pareto improvements (some may lose), the practice aligns with seeking Kaldor-Hicks efficiency: rules pass if the monetized gains *could* theoretically compensate the losers (aggregate net gain).
  4.  **Moderate Anthropocentrism:** It comfortably accommodates the view that only human welfare matters directly, though ecosystem services are valued *instrumentally* for their human benefits (e.g., agriculture, coastal protection). It doesn't *require* rejecting intrinsic value for nature, but such values have no operational role.
  5.  **Varieties of Utilitarianism:** While presupposing welfarist consequentialism, it can be filled with different utility functions (consumption-focused vs. broader well-being) as long as they are monetizable and aggregable. The *structure* of the analysis remains the same.

  ### Two Places it Pulls Against Itself
  **(a) Monetizing a Life vs. Declining to Monetize Collapse:** This isn't *incoherent* but reveals a principled, albeit deeply problematic, line: **calculability**. The VSL is based on decades of empirical research (wage-risk studies, stated preference) establishing consistent, revealed-preference trade-offs individuals make between mortality risk and money. Tipping points and civilizational-scale risks lack analogous market behaviors or observable large-scale precedents to reliably estimate probabilities and monetize impacts within the expected utility framework. The practice presupposes that only impacts amenable to this *specific type of quantification* belong in the core calculus. The principled line is methodological tractability within the welfarist paradigm, not moral significance. This creates tension because the excluded damages are potentially orders of magnitude larger than the monetized ones, rendering the "floor" caveat practically hollow while the monetized co-benefits drive decisions.

  **(b) The "Floor" Caveat vs. De Facto Ceiling:** This tension is more acute. The practice explicitly states the SCC is an underestimate (a "floor"), acknowledging that the true social cost is likely higher. Yet, operationally, $190/ton functions as a strict economic **ceiling for obligation**: exceeding it shifts the burden of proof entirely and often effectively blocks the rule unless non-quantified arguments prevail (a high bar). The presupposition here is that *only monetized benefits impose an obligation*. The "floor" caveat is an epistemological claim ("we know this is low"), while the operational role reflects a normative commitment ("only this quantified minimum counts as a binding cost in the core decision rule"). This *is* arguably incoherent. If the agency genuinely believes $190 is a significant underestimate of the true cost, then using it as the pass/fail threshold systematically biases decisions against regulation by ignoring known, uncounted costs. The principled line – that quantified costs are actionable, unquantified ones are merely cautionary notes – prioritizes calculability over the precautionary implications of its own acknowledged uncertainty and omissions.

  ### What it Forecloses
  The SCC framework inherently excludes rival ethical and philosophical perspectives:

  1.  **Non-Anthropocentric Views:** Theories granting intrinsic value to species, ecosystems, or biodiversity *for their own sake* cannot be expressed. Their exclusion is substantive; the framework presupposes only instrumental value for nature.
  2.  **Rights-Based Approaches:** Views holding that emitting CO₂ violates rights (e.g., to a stable climate, to health, to subsistence) or that future generations possess rights are foreclosed. The framework reduces rights-violations to welfare damages. This exclusion is substantive, rejecting deontology in favor of consequentialism.
  3.  **Strong Sustainability/Safe Minimum Standards:** The idea that certain ecological thresholds (like avoiding tipping points) are absolute constraints that must not be breached, regardless of cost-benefit calculations, is incompatible. The SCC treats avoidance as one marginal cost among others. Exclusion is substantive.
  4.  **Procedural Justice/Recognition Justice:** Concerns about disproportionate impacts on vulnerable communities (frontline, low-income, Indigenous) or the need for their meaningful participation in decisions are sidelined. Distribution is secondary to aggregate efficiency. This is partly technical (aggregation hides distribution) but reflects the substantive prioritization of aggregate welfare.
  5.  **Systemic/Critical Views (e.g., Degrowth):** Analyses questioning the desirability or feasibility of perpetual GDP growth underlying the damage projections, or linking emissions to fundamental economic structures, cannot be incorporated. The IAMs take future GDP growth as a given input. Exclusion is substantive.

  ### If We Swapped the Theory Out
  *   **Threshold / Safe Minimum Standard (SMS):** The core SCC number loses its decisive role. The document would shift focus to identifying critical climate thresholds (e.g., 1.5°C, avoiding AMOC collapse) and the emissions pathways required to stay below them with high probability. The "cost" section becomes the cost of achieving this *non-negotiable* physical target. Benefits are framed as avoiding catastrophic, unacceptable harm, not marginal damages. The SCC might appear only as context or to illustrate the inadequacy of marginal costing for existential risks, but it wouldn't be the pass/fail threshold. The decision rule becomes: "Is this rule necessary and sufficient (as part of a portfolio) to stay below the SMS, and if so, how can its implementation costs be minimized/managed?"
  *   **Degrowth-Flavored View:** The SCC framework collapses entirely. The document would reject GDP growth as the primary welfare metric and the IAM damage functions as fundamentally flawed. Analysis would focus on the rule's contribution to reducing absolute energy/material throughput, enhancing resilience, equity, and well-being *outside* conventional growth metrics. "Cost" would be assessed in terms of resource use, labor implications, and distributional fairness, not just financial expenditure versus monetized GDP benefits. The $190/ton figure becomes irrelevant or actively misleading, as the goal shifts from minimizing the cost of marginal emission reductions within a growth paradigm to transforming the systems driving high emissions. The decision rule focuses on systemic alignment: "Does this rule advance sufficiency, equity, and resilience while reducing biophysical pressure, and how are transition costs justly distributed?"

  In both alternatives, the specific SCC number ceases to be the linchpin of the regulatory decision. The SMS view might retain *some* cost-effectiveness analysis *after* setting the non-negotiable target. The degrowth view abandons the core monetized marginalist logic entirely.
