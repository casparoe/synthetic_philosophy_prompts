answer: |-
  ## The Chart on the Wall

  *(A large Isotype chart hangs in the seminar room: “Tuberculosis Deaths in [City X], 1900-1935.” Rows of identical, simplified coffin symbols march across the years, each representing 10 deaths. ALEX stands close, gesturing emphatically. SAM leans against a table nearby, arms crossed, observing critically.)*

  **ALEX:** Look at it, Sam. *Really* look. 1900: a solid block, twenty coffins – two hundred souls. 1920: thinning out, maybe ten coffins? A hundred deaths. 1935: just three? Thirty. The sheer *weight* of it. You see the disaster, the slow retreat. Without squinting at tiny numbers or deciphering axes.

  **SAM:** I see rows of identical little boxes, Alex. And yes, I see the block gets shorter. But *how much* shorter? Is 1920 exactly half of 1900? Looks roughly like it, but is it? And look at the drop *between* 1920 and 1935 – seven coffins gone? Seventy deaths? Feels significant, but *how* significant compared to the drop before 1920? Did it accelerate? Slow down? I can’t tell. Put this on a simple line chart with aligned scales – I’d see the exact values, the rate of change instantly. The *shape* of the decline.

  **ALEX:** Instantly? For *you*, maybe. Trained eye. But for the factory worker, the shopkeeper, the schoolchild walking through a public exhibition? They can *count* these. Or at least, reliably compare the *number* of symbols. Your line chart? It relies on judging vertical position against a scale – and people are notoriously bad at judging lengths accurately, let alone differences in slope! Studies show estimation errors balloon past 20% without careful scaling, which most charts don’t have. Here? The rule is ironclad: more death, *more coffins*, same size. No scaling trickery. What you see is what you get.

  **SAM:** What I *get* is quantized mush, Alex. You’ve forced a continuous tragedy – deaths per year – into discrete, chunky blocks. Ten deaths per coffin? Fine. But in 1912, was it 97 deaths or 103? Doesn’t matter, you show ten coffins either way. You’ve smoothed away the bumps, the noise, the *uncertainty*. What if there was a terrible outlier year? A sudden spike hidden because it just nudged the count into another coffin? And the *rate*? The ‘how fast?’ That’s the killer with TB control – is the new sanatorium working? Your rows of coffins flatten the curve. I see blocks shrinking, but I don’t see *acceleration* or *deceleration*. You can’t read the second derivative off a row of little men… or coffins.

  **ALEX:** (Points firmly at the chart legend) Look. Right here. "Each symbol = 10 deaths." The transformation is *printed on the chart*. We tell you *exactly* what we did. We simplified, yes. We chose the unit. But that choice is *visible*, *stated*. We’re not pretending this is raw data beamed from heaven. It’s processed, *for a purpose*. And the purpose is comprehension and memory. Someone sees this, grasps the scale of the problem and the progress made in thirty years, *standing up*, in a minute. Next week, they remember: *massive death toll early on, got much better*. They won’t remember your precise slope coefficient. They’ll remember the *picture*.

  **SAM:** And that’s precisely the danger! This ‘simplification machinery’ – this ‘transformation’ you proudly display – it’s a black box dressed up as transparency. *Who* chose the unit? Why 10 deaths? Why not 5, making the decline look more dramatic? Why not 20, making the early years look less catastrophic? Why coffins and not, I don’t know, crosses? Why show yearly totals and not age-adjusted rates? You say it’s ‘printed on the chart’ like that absolves it, but it just tells me *what* the manipulation was, not whether it was *fair* or obscured something vital. This ‘visible’ transformation is where the politics hides while the chart looks charmingly neutral and ‘democratic’.

  **ALEX:** Democratic *is* the point! (Taps the chart emphatically) A person doesn't need a statistics degree to *verify* this. They can look at the source – also printed here! – get the annual numbers, divide by ten, and *count*. Does the number of coffins match? They can *argue* with this. "Why ten? Show me five!" They can combine it with another Isotype chart on, say, public health spending, by lining up the years visually. It’s built for public reasoning, not just expert pronouncement. Your coordinate plot? It outsources verification. "Trust me," it says, "I scaled the axes correctly. Trust me, I handled the outliers. Trust the trendline." It’s a specialist formalism.

  **SAM:** But Alex, *nobody actually counts* thirty-seven icons! Come on. They glance, they subitize the first four or five rows, then their eye jumps to the end and they *estimate the comparative area* of the block. Exactly the sin your ‘no scaling’ rule was meant to prevent! They’re judging the visual weight, the length – which *is* a kind of scaling! And what about the remainder problem? 1912, 97 deaths. You show nine full coffins and… what? A half coffin? Three-quarters? (Gestures dismissively) Suddenly you *are* scaling symbols! You’ve smuggled the very imprecision you condemned back in through the back door! Your proudest rule collapses the moment the data isn’t a multiple of ten.

  **ALEX:** So we use a half-symbol, clearly marked! It’s a convention. Still better than *only* judging area or length. And yes, people estimate the block – but the *structure* of the count is there, visually reinforced by the grid. It guides the estimation towards the actual quantity of *things* – deaths – not an abstract position on a line. It makes quantity concrete.

  **SAM:** Concrete, but fundamentally dishonest about the *nature* of the data. Deaths per year *is* a continuous variable. Forcing it into countable units imposes a grid of fictional chunks onto reality. It pretends the world comes in neat tens. It’s a fiction dressed up as pictorial honesty. My line chart accepts the continuity. It shows the messy reality – the fluctuations, the trend, the *rate of change* – without imposing artificial quantization. It carries vastly more *information* per square inch. What good is ‘remembering a simplified picture’ if the picture misrepresents the underlying dynamics?

  **ALEX:** And what good is your ‘accurate dynamics’ if 90% of the public glaze over it, forget it instantly, or worse, misinterpret the axis scaling? You value precision for precision's sake, Sam. I value *understanding* for action's sake. The museum motto wasn't wrong: remembering simplified pictures *does* beat forgetting accurate figures, especially when the goal is public awareness and mobilization. This chart *worked*. People saw the TB toll, understood progress was possible, demanded more public health. Your elegant plot stays in the lab report.

  **SAM:** (Pushes off the table, walks closer to the chart) But *at what cost*, Alex? You show decline, yes. But by flattening the rate and hiding uncertainty, did you oversell the success? Could it have fostered complacency? "Look, coffins are way down!" But maybe the *rate* of decline had stalled, needing renewed effort – invisible in your blocks. My chart might be harder, but it’s harder to *mislead* with it if done ethically. The precision demands responsibility. Your simplification… it’s a tool that can polish any narrative, however selective.

  **ALEX:** (Looks intently at the rows of coffins, then back at Sam) And your precision… it’s a tool that can exclude anyone not initiated into its secrets. Who gets to decide what's 'ethical' scaling on your axis? Who gets to say what an 'outlier' is? The expert. Always the expert. (Taps the legend again) This declares its limits upfront. It invites scrutiny on its own terms. Is it perfect? No. Can it show everything? Absolutely not. But it knows *who it’s for*. It’s for the people whose lives are represented by these little coffins, to see their own history, grasp the scale, and maybe demand better. It’s a notation for democracy, warts and all.

  **SAM:** (Stares at the chart, then at Alex, a long pause) Warts like half-coffins and smoothed-out trends. It *is* memorable. I’ll give you that. And maybe… maybe for that public, standing in a hall, the exact rate *isn’t* the point. But this quantization… it grates. It feels like dumbing down reality. And trusting that ‘visible transformation’… it feels naive. Someone *did* choose that unit, that symbol. Someone decided what story these blocks would tell. Your ‘open’ box is still a box limiting the view.

  **ALEX:** And your aligned scale is still a filter, Sam, only letting through those who know how to read it. We both lose something. I lose your fine-grained dynamics. You lose the crowd. The question is… which loss matters more for *this* chart, hanging on *this* wall, trying to tell *this* story about TB?

  *(Both fall silent, studying the rows of little coffins spanning three decades of death and survival, the simplicity and the hidden complexities suddenly equally palpable in the quiet room.)*
