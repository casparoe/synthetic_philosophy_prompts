prompt: |-
  I sit on the board of a small charter school and our faculty adviser dropped "the right is prior to the good" twice on Tuesday, both times to end a discussion rather than to make an argument.

  First use: we were voting on making 40 hours of community service a graduation requirement, and the people proposing it said out loud that the point isn't better test scores or college admissions, it's producing graduates who are the sort of person who shows up for their neighbours. He said that's perfectionism and the slogan rules it out — you can't justify a requirement by pointing at a vision of the good life.

  Second use, maybe twenty minutes later: someone objected to letting a church group rent the gym on Wednesday nights because they'd be inculcating their view of the good in kids who wander in, and he said the exact same sentence, this time to defend letting them in.

  He also waved off a survey about what actually happens at schools that already require service hours, saying that since it's a question of principle the data is beside the point.

  So: can you lay out a menu of the precise claims that one sentence could be standing for, seperated by what kind of priority is in play — definitional, justificatory, something about which consideration wins when they conflict, something about persons and their ends, and any sense I haven't thought of? For each reading say whether it's a platitude that communitarians and perfectionists would happily sign too, whether it's substantive but defensible, or whether it's just false. Then tell me for each one whether it gets him the first conclusion, the second, the dismissal of the survey data, or none of them — and whether any single reading leaves him consistent instead of just using a nice-sounding line as a stop sign. He says it's Rawls's; if the version Rawls actually needs is a particular one of your readings, flag which. A list I can read aloud would be great, i don't want an essay.
reasoning: |-
  Okay, the user is on the board of a small charter school and their faculty adviser keeps using "the right is prior to the good" to shut down discussions. They want a clear breakdown of what that phrase could mean in different contexts—like definitional, justificatory priority, conflict resolution, etc. They also need to know if each interpretation is a platitude, defensible, or false, and whether it supports the adviser's conclusions in both scenarios. Plus, they want to know if Rawls's version is specific and if any single reading makes the adviser consistent.

  First, I need to parse the adviser's two uses of the phrase. In the first case, he rejected a community service requirement because it's based on a vision of the good life. In the second, he allowed a church group to rent the gym, using the same phrase. He also dismissed survey data as irrelevant because it's a "question of principle."

  The user is looking for a menu of precise claims. They mentioned types of priority: definitional, justificatory, conflict resolution, and persons/ends. I should cover all those angles. Also, for each, assess if it's a platitude, defensible, or false, and whether it gets the adviser to his conclusions consistently.

  Starting with definitional priority: This means defining "right" independently of any conception of the good. Rawls uses this to set up his theory without presupposing specific goods. But is this a platitude? Not really—perfectionists would disagree since they tie morality to human flourishing. Defensible? Yes, in liberal contexts. Does it support the adviser's first conclusion? Partially, because mandating community service imposes a specific good. But the second conclusion? Allowing the church group doesn't impose anything, so it fits. Survey dismissal? Rawls does avoid empirical data in theory-building, so yes. But is the adviser consistent here? Maybe, but in the second case, he's permitting a group that promotes their good, which might contradict if he's against imposing any good. Hmm.

  Justificatory priority: Justifying actions or institutions based on right, not the good. So policies shouldn't promote a specific good life. Platitude? No, perfectionists would argue promoting good is valid. Defensible? Liberally, yes. First conclusion: Rejects the service requirement because it's justified by promoting a good. Second conclusion: Allowing the church group isn't promoting their good; it's neutral. So both actions align with justificatory priority. Survey dismissal? Since it's about principle, data isn't relevant. Adviser consistent? Yes, in both cases, he avoids justifying based on the good.

  Conflict resolution priority: When right and good conflict, right trumps. Platitude? Not really; utilitarians might prioritize good outcomes. Defensible? In deontological ethics, yes. First conclusion: The community service requirement might conflict with students' rights (autonomy?), so right prior wins. Second conclusion: Banning the church group might violate their rights (free speech/religion?), so allowing them prioritizes right. Survey data? If conflict, data irrelevant. Consistent? Yes, but only if there's an actual conflict. In the first case, is autonomy being violated? Mandatory service could be seen as such. In the second, banning infringes on the group's rights. So possible.

  Persons as ends priority: Treating persons as ends, not means to the good. Kantian influence. Platitude? Broadly accepted, but interpretations vary. Defensible? Yes. First conclusion: Forcing service uses students as means to a social good, so wrong. Second: Banning the church might disrespect them as ends. Allowing respects their agency. Survey dismissal? If principle is about respect, data irrelevant. Consistent? Yes, if framing both in terms of respecting persons.

  Now, Rawls's version: He uses definitional and justificatory priority in his theory. The adviser's second action (allowing the church) aligns with state neutrality, but Rawls might object if the school is public. Since it's a charter school, maybe considered state actor? But Rawls allows associations within the basic structure to pursue their goods, as long as the framework is just. So the church renting space might be permissible under freedom of association. The community service requirement imposed by the school could be seen as the state promoting a particular good, which Rawls would reject. Dismissing survey data fits Rawls's focus on ideal theory over empirical data.

  Is there a single reading that makes the adviser consistent? Justificatory priority seems to work: He rejects justifying the requirement based on the good but allows the church because not permitting them would violate neutrality (justified by right, not opposing their good). Conflict resolution also works if we see both as conflicts between rights and goods. Persons as ends too. Definitional might be weaker for the second case.

  The user needs a list format, not an essay. So I'll structure each reading with the type, claim, status (platitude, etc.), and conclusions supported. Highlight Rawls's use as justificatory and definitional. Note that justificatory priority provides consistency for the adviser's positions.
answer: |-
  Here's a concise menu of readings for "the right is prior to the good," assessed for status, conclusions supported, and consistency:

  1.  **Definitional Priority:**
      *   **Claim:** The concept of "the right" (rules, duties, justice) must be defined *independently* of any specific conception of the good life or human flourishing. What is right sets the framework *within which* individuals pursue their own goods.
      *   **Status:** Substantive but defensible (core to Rawlsian liberalism). Perfectionists/communitarians reject it; they define the right partly *through* the good.
      *   **Gets 1st Conclusion?** Yes (Rejects defining school's duty via a specific good character).
      *   **Gets 2nd Conclusion?** Ambiguous (Allowing church doesn't define *school's* rules by the good; but permits promotion *within* framework).
      *   **Dismisses Survey?** Yes (Principles define the framework, not outcomes).
      *   **Rawls?** Yes, foundational for his theory.

  2.  **Justificatory Priority:**
      *   **Claim:** Institutions/rules must be justified *only* by appeal to right/justice/fairness (e.g., equal liberty, neutrality), *never* by claiming they promote a specific conception of the good life. The good cannot justify the right.
      *   **Status:** Substantive but defensible (Core Rawlsian political liberalism). Perfectionists/communitarians reject it; they justify rules *by* promoting the good.
      *   **Gets 1st Conclusion?** Yes (Rejects justifying requirement by producing "good" citizens).
      *   **Gets 2nd Conclusion?** Yes (Justifies allowing church via neutrality/freedom of association/religion (right), not by endorsing *or* condemning their good).
      *   **Dismisses Survey?** Yes (Justification is principled, not empirical).
      *   **Rawls?** Yes, central to his later political liberalism ("Justice as Fairness").
      *   **→ Consistency:** **Yes.** This reading makes both uses consistent: Reject imposing a good (1st), uphold neutrality allowing pursuit of goods (2nd).

  3.  **Priority in Conflict Resolution:**
      *   **Claim:** When claims of individual right/justice conflict with promoting the collective good/social goals, the right trumps. The good cannot override basic rights or fairness.
      *   **Status:** Defensible (Deontological/Kantian/Rawlsian), but contested by consequentialists. Perfectionists might permit overriding some rights for significant goods.
      *   **Gets 1st Conclusion?** Maybe (Sees requirement as collective good overriding student autonomy?).
      *   **Gets 2nd Conclusion?** Maybe (Sees banning as collective caution overriding group's liberty?).
      *   **Dismisses Survey?** Weakly (Conflict is principled, but data *might* inform severity).
      *   **Rawls?** Yes ("Lexical Priority" of liberty in Rawls).
      *   **→ Consistency:** **Maybe.** Consistent *if* he sees both as conflicts where rights win, but requires interpreting both situations as involving conflicts.

  4.  **Persons & Their Ends Priority (Kantian):**
      *   **Claim:** Individuals (persons) are ends-in-themselves and must never be treated merely as means to promote a conception of the good (social perfection). Respect for autonomy/personhood is fundamental.
      *   **Status:** Substantive & defensible. Perfectionists might argue promoting *true* good respects persons.
      *   **Gets 1st Conclusion?** Yes (Requirement uses students as means to create "good" citizens).
      *   **Gets 2nd Conclusion?** Yes (Banning treats church group as mere threats, not respecting their ends; allowing respects their agency).
      *   **Dismisses Survey?** Yes (Respecting persons is principle, not outcome).
      *   **Rawls?** Influential, but Rawls focuses more on institutional structures.
      *   **→ Consistency:** **Yes.** Consistent focus on not using persons as tools for social perfection.

  5.  **Epistemic/Motivational Priority:**
      *   **Claim:** We can agree on principles of right/justice (fair procedures, basic rights) *despite* deep disagreement about the good life. Agreement on the good is impossible/not needed for a just society.
      *   **Status:** Substantive & defensible (Rawls's "overlapping consensus"). Perfectionists believe we *can* know the good.
      *   **Gets 1st Conclusion?** Yes (School shouldn't impose *its* disputed good).
      *   **Gets 2nd Conclusion?** Yes (School shouldn't suppress *their* disputed good based on disagreement).
      *   **Dismisses Survey?** Yes (Agreement on principle matters, not outcomes).
      *   **Rawls?** Yes, crucial for pluralism.
      *   **→ Consistency:** **Yes.** Consistent focus on avoiding imposition due to reasonable disagreement.

  **Summary & Which Reading Gets Consistency:**

  *   **Justificatory Priority (#2)** provides the clearest and most direct consistency for *both* of the adviser's conclusions and the dismissal of data. It aligns perfectly with Rawls's core argument in *Political Liberalism*.
  *   **Persons & Ends (#4)** and **Epistemic Priority (#5)** also offer consistent readings supporting both conclusions and the dismissal.
  *   **Definitional (#1)** is foundational for Rawls but less directly explains the second conclusion.
  *   **Conflict Resolution (#3)** *can* be consistent but requires interpreting both situations as involving a conflict where rights win.

  **Rawls's Core Need:** Rawls primarily relies on **Definitional (#1)** and **Justificatory Priority (#2)**, with **Epistemic Priority (#5)** being a key supporting argument. The adviser's use leans most heavily on **Justificatory Priority**.
