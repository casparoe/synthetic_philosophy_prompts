prompt: |-
  Novelist here, about 200 pages into a book that's built around the many-worlds idea — the version of the physics where nothing gets selected, every outcome happens, the world just forks. I've been reading about it for a couple of years for research, and I think I've hit a problem that isn't really about my book, though I can't tell.

  The plan was to write both sides of every fork, in full, with equal seriousness. Chapter 7a: she gets on the train. Chapter 7b: she doesn't. Neither one marked as a dream or a regret or a what-if — both just as real as the other, which is the whole point.

  It doesn't work, and I want to be exact about why, because the why feels like it might be the same reason people keep attacking the physics. Two things happened across three drafts. First, when both branches are equally full, nobody worries about anything. Nothing is given up, so nothing is at stake, and the whole thing reads like an inventory. Someone in my workshop said it felt like reading two weather reports back to back. Second — the interesting one — the minute I fixed that by making the branches uneven, giving one more pages and more interior life and more attention, readers immediately started treating the fat branch as the real one and the thin ones as imagination or memory or a character talking herself into something. I had smuggled the single outcome back in through the back door just by caring about it more on the page. Every attempt to make the forking legible made it not-forking.

  So is there a name for this? Not for "branching stories are hard to read" — I mean the specific shape of it: representing all the branches equally destroys the thing you're trying to represent, and the only way to make it representable at all is to weight them, and weighting them is just picking one with extra steps. It feels like the literary version of an objection I've half-absorbed from the physics side, something about how if everything happens there's nothing left to be uncertain about, or nothing left to lose, and separately something about why the branches should be weighted by one particular number rather than another. But I dont know whether what I've hit is those objections, or a cousin of them, or something that only exists because there's a reader.

  Where's the edge? Does the physics have this problem in a form that doesn't depend on anyone paying attention, or is mine purely an artifact of the medium — like how a film can't show two things at once without splitting the frame, which is a cost of screens and not of the world?

  I'm not after a label to sound clever in an interview. I want the carving: what the nearest established ideas are, how this differs from each one, and if nothing actually covers it, coin something and tell me what would count as a case of it and what would merely look similar.
reasoning: |-
  Okay, let me unpack this novelist's problem. They're writing a many-worlds novel where both branches are presented equally, but it's not working. Readers don't feel stakes when branches are equal, and when they make one branch thicker, readers treat it as "real." 

  First, I need to understand the core tension. The physics concept demands all outcomes are equally real, but narrative requires selection and stakes to engage readers. That's the heart of it. The novelist wants to know if this is a physics problem or a storytelling artifact.

  Hmm, the philosopher David Lewis comes to mind with his "indexicality of actuality" - that we always experience one branch as "now." But that might not fully capture the narrative weighting issue. Then there's probability amplitude in physics - branches have different weights mathematically, but not ontologically equal. Interesting parallel to the novelist's weighting problem.

  The novelist's workshop feedback is telling. Equal branches feel like "weather reports" - no tension. But when one branch gets more detail, it becomes "real" to readers. That smells like a cognitive bias humans have, not a physics problem. Our brains are wired for linear causality.

  I should distinguish between physics ontology and narrative epistemology. The many-worlds theory describes reality, but storytelling is how humans process reality. We can't help but impose hierarchies when presented with options. That's why the "fat branch" automatically becomes primary in readers' minds.

  For naming this... "Representational Collapse" feels right. The act of depicting equal branches causes their equality to collapse in perception. And "Weighting Paradox" for how assigning importance recreates selection. These terms should cover both the physics and narrative aspects.

  The test cases matter. Quantum suicide thought experiments show similar collapse when an observer exists. And in narrative, choose-your-own-adventure books avoid collapse by making choice central, not equality. Good boundaries for the concepts.

  Medium constraints are crucial too. Film splits screens; text uses "meanwhile." But many-worlds demands simultaneity without hierarchy - impossible to represent directly because representation requires ordering. That's the brutal truth the novelist needs.

  I think the key insight is: physics doesn't care about stakes, but stories must. The novelist's struggle reveals a fundamental limitation in translating ontology into human experience. Their "problem" is actually profound - it shows why we invented narrative in the first place.
answer: |-
  Your struggle reveals a profound tension between ontological reality (what *is*) and narrative representation (how we *show* it). This isn't just a storytelling hurdle; it cuts to the core of the Many-Worlds Interpretation (MWI) and its perception. Here's the carving:

  1.  **The Core Problem:** **Representational Collapse via Narrative Necessity.**
      *   **What it is:** The inherent conflict between depicting all outcomes as equally real (MWI ontology) and the fundamental requirements of narrative engagement (stakes, causality, focus, emotional investment).
      *   **Why it happens:**
          *   **Stakes Require Sacrifice:** Narrative stakes rely on potential loss. If *all* possibilities manifest equally, *nothing is lost*. The "inventory" feeling arises because every outcome is preserved, negating consequence *within the reader's experience*.
          *   **Cognition Demands Focus:** Human cognition, and thus narrative comprehension, is sequential and selective. We must focus attention. Giving branches "equal seriousness" *in practice* (equal page count, depth) diffuses focus, diluting impact and creating the "weather report" effect – data without drama.
          *   **Weighting Implies Hierarchy:** The moment you deviate from perfect equality (more pages, deeper POV, richer prose in one branch), you create a *de facto* hierarchy. Human readers instinctively interpret this hierarchy as ontological: "More attention = More real/Important/True." This isn't just laziness; it's how narrative *signals* significance. You haven't just weighted it; you've signaled, through the medium's conventions, that *this branch matters more to the story's core meaning*.

  2.  **Connection to Physics Objections:**
      *   **The "No Uncertainty, No Loss" Problem:** This is directly analogous to your "inventory" problem. Physics critics argue: If *every* quantum outcome happens in *some* branch, then for any individual observer (or sentient being), the *subjective experience* of uncertainty and potential loss vanishes. Why fear Schrödinger's box? In *your* branch, you'll either see a live cat or a dead cat – both outcomes exist, but *you* only experience one. The "loss" is only of the other *possibility*, but the other *reality* exists elsewhere. Your readers feel this lack of subjective jeopardy when both branches are presented equally – nothing is *truly* risked for the character *as perceived by the reader*.
      *   **The "Probability Problem":** MWI struggles to explain why we *observe* branches with frequencies matching quantum probabilities (e.g., 50/50 split for spin). Why aren't all branches "equally real" in terms of how often we find ourselves in them? The "weight" (probability amplitude squared) is crucial. Your narrative weighting mirrors this. You *must* weight branches to create narrative sense (probability), but that very weighting destroys the ontological equality you set out to depict, just as the Born rule (assigning probabilities) in MWI feels tacked on to some critics, undermining the "equal reality" claim.

  3.  **Is this a Physics Problem or a Representational Artifact?**
      *   **Physics Ontology:** MWI itself, as a description of reality, does *not* have "stakes" or "uncertainty" in the human, experiential sense. The branching just *is*. The "problem" of no subjective loss or uncertainty *exists only for conscious observers within a branch*. The physics describes a state of affairs; it doesn't inherently care about drama or stakes.
      *   **Representational Artifact (with Deep Roots):** Your problem is fundamentally *representational*, stemming from the nature of **linear narrative** and **human cognition**. However, it's not *merely* a medium limitation like split-screen. It reveals a deeper truth:
          *   **The Indexicality of Actuality:** Philosopher David Lewis discussed this regarding time: "I" always refers to *my* current time. Similarly, a conscious observer always experiences themselves as being in the "actual" branch *now*. Narrative, especially close 3rd person or 1st person, inherently adopts this *indexical perspective*. Trying to abandon it entirely to show *all* branches as equally "actual" *from within the narrative itself* is cognitively impossible for the reader and structurally counter to how narrative creates meaning. The reader *must* anchor themselves somewhere. Your "fat branch" becomes that anchor, making the others seem less real *to the narrative's present moment*.

  4.  **Carving and Naming:**
      *   **The Nearest Established Ideas:**
          *   **Narrative Necessity (Aristotle, Forster):** The idea that plot requires causality, conflict, and stakes.
          *   **Focalization (Genette):** The perspective through which the story is filtered. True "equal branching" requires impossible non-focalization or multi-focalization without hierarchy.
          *   **The Problem of Probability in MWI (Physics):** The difficulty reconciling "all branches are equally real" with the observed statistics requiring weighting.
          *   **Indexicality (Philosophy of Mind/Language):** The context-dependent nature of words like "I," "here," and "now." Narrative relies on an implied "now."
      *   **The Gap:** None fully capture the *specific dynamic* where the attempt to *represent ontological equality* within a linear narrative *necessitates* techniques that *destroy the perception of that equality*.
      *   **Coined Concepts:**
          *   **Representational Collapse of Ontological Equality (RCOE):** The phenomenon where the attempt to faithfully depict multiple states as equally real within a linear representational medium (like narrative text) inevitably requires techniques (sequencing, weighting, focalization) that collapse the reader's perception of that equality, reintroducing hierarchy and selection.
          *   **The Weighting Paradox of Branching Narratives:** The catch-22 where weighting branches is necessary for narrative coherence and engagement but fundamentally undermines the core premise of ontological equality between branches.

  5.  **Defining the Concepts & Boundaries:**
      *   **What counts as RCOE/The Weighting Paradox?**
          *   A narrative attempting to depict genuinely co-existing, ontologically equal realities (like MWI branches).
          *   The narrative structure presents multiple outcomes/paths for the same event/character.
          *   The *intent* is to show these as equally "real" within the story's universe.
          *   The *result* is either:
              *   Reader disengagement due to lack of stakes/consequence (from perfect equality).
              *   OR reader interpretation of one path as "real" and others as less real/illusory (from any weighting/focus imbalance).
          *   The disengagement or misinterpretation is *caused* by the inherent conflict between the ontological goal and narrative necessities.
      *   **What merely looks similar?**
          *   **Choose-Your-Own-Adventure Stories:** The reader explicitly *chooses*, acknowledging a single path is followed. Ontological equality isn't the goal; potentiality is.
          *   **Alternate History/Parallel Universe Stories:** These often present distinct, separate worlds explored sequentially. Each world is usually the "real" one within its own narrative frame. The conflict isn't *within* a single branching event presented as simultaneous.
          *   **Dream Sequences/Flashbacks/Hallucinations:** These are explicitly framed as non-actual within the primary narrative's reality.
          *   **Rashomon-style Multiple Perspectives:** Focuses on subjective *interpretation* of a *single* event, not the ontological reality of *multiple* outcomes.
          *   **Quantum Superposition in Narrative (e.g., ambiguous endings):** Maintains uncertainty/possibility, *without* asserting both outcomes are equally real elsewhere. It preserves the "either/or" tension MWI removes.

  **Conclusion & The Edge:**

  You've hit upon **Representational Collapse of Ontological Equality (RCOE)**, manifesting as **The Weighting Paradox**. This is *primarily* a problem of **representation and cognition**, not fundamental physics. MWI describes a reality where the branches exist; it doesn't need to "represent" them to an audience. *Your* problem arises because narrative *must* represent, and representation for humans requires sequence, focus, and stakes – elements fundamentally at odds with depicting simultaneous, equal realities *from within the experience of a single branch*.

  **The edge is consciousness and linear time.** Physics doesn't require an observer to branch. But *storytelling* does. The moment you try to convey the *subjective experience* of branching (even indirectly through narrative structure) to a linear-conscious reader, RCOE becomes inevitable. The physics objection about "no loss" is the *ontological counterpart* to your readers' *experiential* lack of stakes. Both stem from the disconnect between the totality of the multiverse and the singularity of a conscious moment. Your struggle isn't with the physics; it's with the terrifying, beautiful impossibility of translating that physics into the language of human meaning, which is built on limitation and choice. This impossibility *is* the insight. Perhaps the novel's form needs to *embrace* this collapse as its theme, rather than fight it.
