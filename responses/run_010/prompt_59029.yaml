  The user's constructed case is clever because it isolates the convention argument in a context where material evidence is sparse. I should acknowledge that while conceding points like Herodotus' inflated numbers. But I must maintain that the method isn't circular because we're not just reading narratives against narratives - we're using non-textual anchors like the pass at Thermopylae itself and Spartan cultural practices.

