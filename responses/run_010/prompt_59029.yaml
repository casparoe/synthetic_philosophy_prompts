answer: |-
  You've zeroed in on a genuine tension, and I appreciate you using a concrete case rather than abstract theory. Let's take Thermopylae as you've framed it.

  You're right that the *overarching shape* – narrow pass, betrayal, strategic withdrawal, heroic last stand – fits a powerful Greek narrative template. Conceding that Ephorus/Diodorus had genuinely separate sources doesn't magically make that shared structure independent evidence for the *specific event*. Genre absolutely acts as a "common cause" shaping the core framework. Where I push back is your claim that this necessarily renders the concordance evidentially useless *and* that identifying residue is fatally circular.

  1.  **Topography as Anchor:** The convention exists *because* it reflected a genuine military reality Greeks exploited (e.g., Marathon, Thermopylae itself). Thermopylae isn't *just* a narrative trope; it's a specific, constricting geographical location. Herodotus and Diodorus/Ephorus agree on the *mechanism* of the betrayal (Trachinian/Ephialtes revealing the Anopaia path) and the *consequence* (outflanking forcing Leonidas's decision). This isn't just "pass defence" generically; it's this specific pass, with its specific vulnerability. The convention provides the *form*, but the *specifics* of the place (which we can walk, even now) anchor why *this* narrative shape applies *here*. The convention doesn't invent the strategic problem; it provides the lens through which it's narrated. The agreement on the *specific geographical problem* (the path's existence and exploitability) is residue confirmed by the ground itself, not just the narrative tradition.

  2.  **Institutional & Cultural Residue within the Frame:** Within the conventional structure, they agree on details unlikely to be *invented solely* by the convention and anchored externally:
      *   **Leonidas's Authority & Decision:** Herodotus (VII.205, 220) and Diodorus (XI.9.2-10.4) both depict Leonidas *choosing* to stay with specific contingents (Thespians, Thebans - problematic as that is) *after* dismissing the allies. This reflects the uniquely Spartan king's authority to make such a fatal command decision, consistent with Spartan military structure and ethos known from other sources (e.g., Tyrtaeus, Xenophon's *Lakedaimonion Politeia*). The convention gives the "heroic last stand," but the *agency* residing solely with the Spartan king, and the mechanics of dismissing allies, feels like institutional reality bleeding through.
      *   **The "Three Hundred" Spartans:** While the *total* Greek numbers vary wildly (and are inflated), the specific, small core of Spartiates (Herodotus VII.202, Diodorus XI.4.5) aligns with the known size of the Spartan *hippeis* (royal guard) and the practical limits of deploying full Spartan citizens far from home early in a campaign. The convention demands a small, elite force; the *specific number* "300" for Spartans fits known Spartan military units, making it plausible as a genuine detail preserved within the conventional framework. It's unlikely the convention *invented* that precise, small figure for the Spartans specifically.

  **On Circularity:** You argue identifying residue relies on a prior catalogue of conventions derived from the same narratives. It's not *that* clean. We build the "catalogue" from:
  *   **Comparing narratives *against* non-narrative evidence:** We see the Thermopylae *topography* validates the core strategic problem. We see Spartan *institutions* (king's command, Hippeis unit) make sense of specific agreed details *within* the narrative.
  *   **Identifying tropes *across* contexts:** We recognize the "last stand" trope by seeing it applied to events *without* strong corroboration elsewhere (e.g., some mythical battles), or exaggerated in clearly fictional accounts. When it appears *here*, alongside details grounded in geography and institutions we know independently, we weight those grounded details more heavily as potential residue. It's not a perfect circle; it's an interpretive triangulation using the narrative's conformity to known reality (geography, institutions) *where we can check it* to judge its plausibility *where we can't*.

  The warrant isn't *just* concordance. It's concordance on details that find anchors *outside* the literary tradition itself (like the very rocks of Thermopylae or the structure of the Spartan army) *within* a framework shaped by understandable convention. The method isn't foolproof, but it yields plausible historical kernels where anchors exist. Where do you see the anchors I've mentioned failing to break the circle?
