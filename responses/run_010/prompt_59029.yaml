  Hmm, their circularity charge is particularly sharp. When they say "the residue is picked out by a generalization drawn from the very accounts whose reliability is at issue," they're pointing to a genuine epistemological knot. How do we distinguish template from fact without presupposing the reliability of the sources we're evaluating?

