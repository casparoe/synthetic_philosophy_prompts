  ### A Defense of the Non-Detectorial Reading of Avicenna’s Flying Man

  **1. The Non-Detectorial Reading Stated Precisely**  
  The Flying Man establishes that self-awareness is **non-detectorial**: the subject’s awareness of their own existence is not mediated by the identification or discrimination of objects (including their body). It is an immediate, non-inferential, and non-relational awareness that cannot fail by misidentification. This reading is falsified if it can be shown that the Flying Man’s self-affirmation *requires* or *could result from* a process of singling out the self from a field of objects, even if that process is erroneous or incomplete. For instance, if the Flying Man’s affirmation depended on a tacit bodily sensation (e.g., proprioception) or an implicit contrast with external objects, the detectorial model would stand.

  **2. The Bridge Premise and Its Role**  
  The dualist reading relies on a bridge premise: **"Only material entities are extended, divisible, or perceptible to the senses."** This premise links the Flying Man’s inability to detect his body to the conclusion that the self is immaterial. The Flying Man ceases to do any work for dualism **at the step where the absence of bodily awareness is interpreted as proof of the self’s *ontological separability***. Without the bridge premise, the experiment only shows that self-awareness persists without *detecting* the body—not that the self *lacks* materiality. Dualism thus requires an independent argument for the bridge premise (e.g., from Aristotelian metaphysics), which the Flying Man does not provide.

  **3. Answering the "Absence of Evidence" Objection**  
  The objection confuses *epistemic lack* (failure to notice the body) with *structural insight* (how self-awareness operates). The Flying Man’s deprivation does not merely create ignorance; it reveals that self-awareness is **constitutively independent** of object-identification. In ordinary perception, the absence of evidence (e.g., not seeing a chair) implies possible error or incompleteness in detection. Here, however, the subject’s self-awareness remains *cognitively secure* and *immune to misidentification* despite sensory deprivation. This positive feature—indefeasibility under conditions that would undermine object-awareness—demonstrates a structural difference in kind. The deprivation does not "convert absence into presence"; it exposes that self-awareness is not a detection-based state at all.

  **4. Confronting the Contamination Worry**  
  The worry—that we intuit the Flying Man’s self-awareness only by smuggling in embodied experience—is not fatal. While it is true that *we* (as embodied thinkers) rely on our own phenomenology to imagine the scenario, the thought experiment isolates a **formal property of awareness** that survives contamination: self-awareness’s *essential non-contingency on objectual cognition*. Even if we cannot fully simulate the Flying Man’s state, we recognize that the persistence of self-awareness without objects implies it is not *constituted* by object-relations. What survives: the conceptual distinction between **self-acquaintance** (immediate, non-relational) and **object-detection** (mediated, relational). The experiment functions as a *reductio* against the detectorial model, showing it fails to account for the subject’s self-certainty under deprivation.

  **Strongest Dualist Objection and Reply**  
  - **Dualist Objection:** "Non-detectorial awareness *entails* immateriality because anything material must be detectable under ideal conditions. If the Flying Man cannot detect his self, it cannot be material."  
  - **Reply:** This objection assumes the **bridge premise** (materiality requires detectability) but offers no justification for it. The Flying Man only shows that self-awareness is not *given as* an object, not that it *lacks* material properties. Materiality could still be a non-detected background condition (e.g., the brain’s non-conscious processes). The objection thus begs the question by presupposing dualism. The non-detectorial reading remains intact: it establishes a structural feature of self-awareness without settling ontology.

  **Conclusion**  
  The non-detectorial reading is philosophically stronger because it limits the Flying Man to what it directly demonstrates: self-awareness is immediate, identification-proof, and independent of object-cognition. Dualism requires extraneous metaphysical commitments, while the modest reading aligns with Avicenna’s broader epistemology of self-awareness as foundational and reflexive. The Flying Man, on this view, is not a failed Cartesian argument but a successful phenomenological insight into the first-personal givenness of the self.
