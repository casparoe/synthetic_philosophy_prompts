  Then break down the factors:
  1) Whether "taste itself" has determinate application conditions - this is crucial because if qualia can't be defined independently of responses, the distinction collapses. High weight (0.5).
  2) First-person accessibility as part of qualia - if qualia require private access, journals can't capture them. Medium weight (0.3).
