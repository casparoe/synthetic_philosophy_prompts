   Key learning points:
   1. The same behavior can be explained by multiple (reward, belief, discount rate) combinations.
   2. If you assume the agent has the same beliefs as you (the observer), you might attribute bizarre rewards to explain the behavior.
   3. The tie-breaking occurs when the agent encounters new states (due to map alteration) that weren't visited before.

