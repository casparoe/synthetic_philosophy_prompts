  ### Runnable In-Class Activity: Preference Inference Challenge

  #### **Learning Objectives**
  - Demonstrate that observed behavior is compatible with multiple (reward, belief, discount rate) triples.
  - Show that assuming the agent shares the observer's beliefs leads to misattributed rewards.
  - Highlight how tie-breaking requires testing in novel/unvisited states.

  ---

  ### **Materials**
  1. **Grid Maps** (projected or drawn):  
     - **Original Map (4x4)**:  
       - Start: (1,1), Goal: (4,4)  
       - Blocked: (2,2), (3,3)  
       - Mud: (3,2) (marked as ⬛ for blocked, 🌑 for mud).
     ```
       1: [S] [ ] [ ] [ ]  
       2: [ ] [⬛] [ ] [ ]  
       3: [ ] [🌑] [⬛] [ ]  
       4: [ ] [ ] [ ] [G]  
     ```
     - **Altered Map**: Unblock (3,3) → becomes traversable.  
       ```
         3: [ ] [🌑] [ ] [ ]  // (3,3) no longer blocked
       ```

  2. **Agent’s Private Card** (physical or digital):  
     > **Reward Function**:  
     > - `+10` for reaching (4,4)  
     > - `-1` per step  
     > - `-5` for stepping on (3,2)  
     >  
     > **False Belief**:  
     > *You believe (2,3) is blocked (it is actually traversable). Plan paths using this belief!*  
     >  
     > **Discount Rate**: `1` (no discounting).  
     > **Tie-breaking**: Prefer paths with fewer steps. If equal, move right > down > left > up.

  3. **Observer Worksheets** (for 3–4 groups):  
     - Space to write:  
       - Inferred reward (step cost, mud penalty, goal reward).  
       - Predicted path for the altered map (list coordinates).  

  ---

  ### **Activity Timeline (75 min total)**
  | Min | Students (Players)                                                                 | Instructor Actions                                                                                                | Problem Exposed                                                                                               |
  |-----|------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------|
  | 0-5 | Settle in, review grid basics.                                                     | Introduce activity: *"Today, we’re inferring preferences from behavior. One agent acts; you decode their rewards."* Show original map. | Framing preference inference.                                                                                 |
  | 5-10| **Agent**: Receive card, plan path using false belief (avoid (2,3)).<br>**Groups**: Form (3–4 groups). | Give agent the card. Clarify: *"Agent, use your beliefs to plan. Observers, note: you see behavior, not rewards/beliefs."* | Beliefs shape behavior; observers lack access.                                                                |
  | 10-20| **Groups**: Watch agent’s path → infer reward (step cost, mud penalty, goal reward).<br> *Assume: Agent knows true map, is optimal, discount rate=1.* | Project agent’s path: `(1,1)→(2,1)→(3,1)→(4,1)→(4,2)→(4,3)→(4,4)`. Circulate, answer Qs. | Underdetermination: Path avoids (3,2). Why? Mud penalty? False belief? Groups forced to infer rewards only. |
  | 20-25| **Groups**: Write inferred reward on worksheets.                                   | Reveal altered map (unblock (3,3)). *"Predict the agent’s path using your reward. Assume they know this new map!"* | Test generalizability: New states (e.g., (3,3)) may break ties.                                              |
  | 25-35| **Groups**: Predict path for altered map → write sequence.                         | Guide agent to compute new path (same beliefs/reward): `(2,1)→(3,1)→(4,1)→(4,2)→(4,3)→(4,4)`. | Beliefs persist; new data tests reward inference.                                                             |
  | 35-40| **All**: Hear agent’s new path. **Groups**: Check predictions.                     | Project agent’s new path. Announce: *"Actual path: (1,1)→(2,1)→(3,1)→(4,1)→(4,2)→(4,3)→(4,4)."*                  | Scoring: Prediction success depends on reward inference.                                                      |
  | 40-50| **Groups**: Compare predictions. Scores: 1 pt if path matches exactly, else 0.     | Declare scores. *"Groups with mud penalty predicted correctly. Why did others fail?"*                              | Incorrect reward attribution if beliefs are assumed.                                                          |
  | 50-75| **Debrief**: Discuss inferences, scores, and revelations.                          | Reveal agent’s card. Ask:<br>- *"Why did the agent avoid (3,2) in Round 1?"*<br>- *"How did groups explain this?"* | Identifiability crisis: Same behavior ← multiple (reward, belief) combos. New states break ties.              |

  ---

  ### **Key Debriefing Points**
  1. **Round 1 (Original Path)**:  
     - **Agent’s truth**: Avoided (3,2) due to false belief (needed detour around (2,3)), **not** mud penalty.  
     - **Groups’ inference**: Assumed true map → attributed avoidance to mud penalty (e.g., "Step cost: -1, Mud: -5").  
     - **Takeaway**: Identical behavior ← 2 explanations:  
       - **Truth**: (Reward: -1/step, Belief: (2,3) blocked).  
       - **Group’s inference**: (Reward: -1/step **+ mud penalty**, Belief: true map).  

  2. **Round 2 (Altered Map)**:  
     - **Tie-breaker**: Newly accessible (3,3) tested rewards.  
       - Groups with mud penalty → predicted avoidance of (3,2) (correct).  
       - Groups without penalty → predicted shortcut through (3,2) (wrong).  
     - **Why?** False belief (not reward) prevented agent from using (2,3)/shortcuts.  

  3. **Core Insight**:  
     - Preferences aren’t identifiable from observed behavior alone.  
     - **Unvisited states are crucial**: Altered map created "counterfactual" test.  
     - **Bizarre rewards**: Groups assuming shared beliefs invented penalties to explain detours.  

  ---

  ### **Limitations vs. Real-World Inference**
  | **Feature**                  | **Activity’s Simplification**                          | **Real-World Complexity**                                                                 |
  |------------------------------|--------------------------------------------------------|-------------------------------------------------------------------------------------------|
  | **Belief Inference**         | Fixed, single false belief.                            | Beliefs are distributions (e.g., POMDPs); inferred jointly with rewards via Bayesian IRL. |
  | **Data Scope**               | Single trajectory, one alteration.                     | Multiple trajectories, noisy preferences, partial observability.                          |
  | **Discount Rate**            | Fixed (γ=1).                                           | Discount rates unknown; affect long-term planning (e.g., hyperbolic discounting).         |
  | **Feature Engineering**      | Known features (step, mud, goal).                      | Features must be learned/extracted (e.g., deep IRL).                                      |
  | **Optimality**               | Fully optimal agent.                                   | Humans are noisy optimizers; Boltzmann rationality models used.                           |

  **Mitigation**: Briefly discuss these gaps after debrief. *"IRL in practice uses probabilistic models, more data, and belief marginalization."*

