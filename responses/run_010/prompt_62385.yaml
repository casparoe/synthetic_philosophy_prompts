  The argument against accuracy-first epistemology you've presented is a sophisticated challenge, but it contains a critical flaw that can be addressed without abandoning the core commitments of accuracy-first epistemology, such as (1) and (3). The faulty step is in the inference from (4) to (5)–(7), particularly in how the dominance norm is applied without regard to the agent's computational and cognitive limitations. I'll break this down step by step, identifying the problematic joint, the distinction that masks it, the cost of the repair, how it handles imprecise credences, and whether a residue of the problem remains.

  ### Step-by-Step Analysis of the Argument
  The argument relies on the following key premises:
  - (1) Accuracy is the only intrinsic epistemic merit.
  - (2) Accuracy is measured by a strictly proper scoring rule.
  - (3) Incoherent credences are accuracy-dominated.
  - (4) The dominance norm applies objectively, regardless of agent limitations.
  - (5)–(7) Applied to arithmetic, this implies logical omniscience.
  - (8) Similarly, imprecise credences are dominated, requiring sharpness.
  - (9)–(10) Logical omniscience is impossible, so accuracy-first fails.

  The core issue arises in **step (4) and its application in steps (5)–(7) and (8)**. Specifically, the argument assumes that because accuracy is objective and the dominance theorem holds for any algebra (including the infinite algebra of arithmetic), the rational requirement to avoid dominance must apply universally and immediately, regardless of the agent's abilities. This ignores a crucial distinction between **objective epistemic ideals** and **feasible rational requirements for bounded agents**.

  ### The Faulty Joint: Step (4) and Its Implications
  - **What's faulty**: The inference from the objectivity of accuracy (which is not disputed) to the claim that rational norms like dominance avoidance are "not indexed to what the agent can see or compute" is where the argument goes wrong. While accuracy itself is objective—meaning a credence's inaccuracy is a fact about the world, independent of the agent's perspective—the *rational requirements* derived from accuracy considerations must be sensitive to the agent's cognitive and computational constraints. Steps (5)–(7) and (8) erroneously treat the dominance norm as universally binding, even when compliance is impossible for finite agents.
    
  - **The key distinction**: The argument conflates two things:
    1. **Objective epistemic value**: Accuracy is indeed the sole intrinsic epistemic merit, as per (1). A belief's accuracy is a world-dependent fact (e.g., assigning credence <1 to a theorem is objectively inaccurate).
    2. **Rational requirements for agents**: Rationality is normative and action-guiding; it must be feasible for agents with finite resources. The dominance theorem (3) shows that incoherent credences are defective, but this defect does not automatically translate to a rational failing *for the agent* if the defect is undetectable or unavoidable given their limitations. Rationality requires agents to *avoid dominance when they can*, not to achieve the impossible.

  This distinction is masked in step (4) because the objectivity of accuracy (which accuracy-first theorists endorse) is presented as implying that rational norms must be equally objective and unrelenting. But accuracy-first epistemology can (and should) incorporate **epistemic feasibility constraints** without abandoning accuracy as the core value. Rational norms are not suspended; they are relativized to what is achievable with the agent's resources.

  ### Which Step to Give Up
  - **Primary give-up**: Reject the unconditional application of the dominance norm in steps (5)–(7) and (8), as implied by step (4). Instead, the dominance norm only generates a rational requirement when the algebra in question is "feasible" for the agent—i.e., when the agent has the computational capacity to grasp the propositions and their logical relations. This retains (1) and (3) but qualifies their scope.
    
  - **Why it doesn't threaten core commitments**:
    - (1) is preserved: Accuracy remains the only intrinsic epistemic merit. Other virtues like coherence are still reducible to accuracy, as coherence promotes accuracy in the long run for agents with sufficient resources. The feasibility constraint doesn't introduce a new epistemic value; it just acknowledges that accuracy-conducive practices (like coherence) are only required when feasible.
    - (3) is preserved: The dominance theorem still holds mathematically for any algebra. The repair doesn't deny the theorem's generality; it simply limits when it generates a *rational obligation* for real agents.

  - **What the accuracy-first theorist pays for this**: The cost is a loss of **full generality and objectivity in rational norms**.
    - **Generality of the dominance theorem**: The theorem still holds for all algebras, but its normative force is restricted to feasible cases. For highly complex algebras (like full arithmetic), the theorem doesn't impose a direct rational requirement because agents cannot comply.
    - **Objectivity of accuracy**: Accuracy itself remains objective, but rational norms become *agent-relative*, depending on computational resources. This means rationality is no longer "one-size-fits-all"; it varies with cognitive capacity.
    - **Action-guiding character**: Norms remain action-guiding but are indexed to feasibility. For example, an agent should strive for coherence on propositions they can compute, but they are not irrational for failing on propositions beyond their grasp.

  This repair aligns with how accuracy-first theorists like Richard Pettigrew (in *Accuracy and the Laws of Credence*) handle logical omniscience. Pettigrew argues that dominance norms apply only to "available" propositions—those an agent can entertain and reason about—and that rationality requires coherence only when logical truths are accessible.

  ### Handling Imprecise Credences (Step 8)
  The repair also resolves the issue with imprecise credences without separate treatment:
  - **The problem in step (8)**: The argument claims that a set of probability functions (imprecise credences) is accuracy-dominated by some sharp credence, so rationality requires sharpness. But this ignores that imprecise credences can be rational when evidence is ambiguous or incomplete, and adopting a sharp credence arbitrarily could be inaccurate.
  - **How the repair handles it**: The dominance result for imprecise credences holds mathematically, but the rational requirement to adopt a sharp credence only applies if the agent can identify a non-dominated option. If no single sharp credence is justifiable (e.g., due to scarce evidence), maintaining imprecision can be the accuracy-optimizing choice given the agent's limitations. Thus, imprecise credences are not irrational when sharpness isn't feasible—e.g., in cases of deep uncertainty where computing a precise probability is intractable.
  - **No separate treatment needed**: Feasibility constraints apply uniformly. For both logical omniscience and imprecision, the norm is to avoid dominance *when possible*, but not when it exceeds cognitive resources.

  ### Does a Residue of the Problem Remain?
  After the repair, a **residue difficulty** survives, but it does not sink the accuracy-first programme:
  - **The residue**: Finite agents will inevitably hold inaccurate beliefs due to logical ignorance or computational limitations (e.g., assigning credence <1 to an unrecognized theorem). This inaccuracy is an *objective epistemic defect* (consistent with (1)), but it is not a *rational failing* because rationality does not require the impossible. Agents are "excused" for unavoidable inaccuracies, much like a blameless moral agent might cause harm unintentionally.
  - **Why it doesn't evaporate entirely**: Accuracy-first epistemology must acknowledge that agents cannot achieve perfect accuracy, so epistemic life involves unavoidable trade-offs. However, this residue is a **practical limitation**, not a theoretical flaw. The programme can still provide guidance: agents should approximate coherence where feasible (e.g., by using heuristics or bounded reasoning) and prioritize accuracy-conducive practices (e.g., updating on evidence) within their limits.
  - **Is it a genuine difficulty?** Yes, but it is a problem for *all* epistemic theories that value truth (e.g., Bayesianism faces logical omniscience too). Accuracy-first handles it better than most by tying norms to accuracy while respecting feasibility. The residue doesn't undermine the core programme; it highlights human limitations in an imperfect world.

  ### Conclusion
  To defend accuracy-first epistemology:
  - **Reject the unconditional dominance norm** in steps (5)–(7) and (8), as justified by step (4). Instead, apply dominance norms only to "feasible algebras" where agents can compute logical relations.
  - **Distinction**: Accuracy is objective, but rational requirements are feasibility-constrained.
  - **Cost**: Norms lose full objectivity and generality, becoming agent-relative.
  - **Handles imprecise credences**: Yes, via the same feasibility constraint.
  - **Residue**: Unavoidable inaccuracy exists but is not a rational failing; the programme survives by focusing on accuracy-promoting practices within bounds.

  This repair preserves the spirit of accuracy-first epistemology—accuracy as the ultimate epistemic good—while making it viable for real, finite agents. The argument's conclusion (10) is avoided because (1) is retained, and norms do not become silent; they simply adapt to human limitations. For your reading group, I recommend discussing Pettigrew's work on this topic and exploring how feasibility constraints can be formalized (e.g., through computational models of bounded rationality).
