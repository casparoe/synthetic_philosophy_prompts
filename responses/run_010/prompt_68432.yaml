prompt: |-
  Not a philosopher — I do data work — but a friend got me hooked on the Sleeping Beauty coin puzzle a few years back and I've been reading around the edges of it since. There's a pattern I keep running into in these arguments and I can't find a word for it anywhere.

  The pattern: two people agree on every fact in the setup. The coin's fair, they both know the whole schedule of what happens to whom, neither one has seen or heard anything the other hasn't. And they still get different numbers. When you dig in, it turns out they aren't disagreeing about probability at all — they're disagreeing about *what the things being counted are*. One of them is counting situations, the other is counting chances-to-be-in-a-situation. And crucially neither thinks they're doing anything unusual: each says "obviously it's a half" or "obviously it's a third" and genuinely cannot see what the other one is up to.

  It happens in Sleeping Beauty — the half camp is counting two possible worlds, the third camp is counting three possible wakings. It happens in the two-children thing too: someone says a family has two kids and at least one is a boy, and half the internet says a third and half says a half, and the actual fight is about whether you're counting families or counting the ways that remark could have come out of someone's mouth.

  So — does this have a name? I know people say the Sleeping Beauty fight is about "self-locating" belief, and that's obviously part of it, but the two-children version has nothing self-locating in it, nobody's asking when or where or who they are, and the disagreement has exactly the same shape. Which makes the centered-content story feel like it covers some cases it shouldn't and misses others it should. I've also seen Bertrand and the chord of the circle brought up, but there the problem statement really does fail to fix a way of picking at random, and here I don't buy that — my gut says one of the two answers is just correct and the setup is rich enough to determine which.

  What I'm after: the nearest established concepts, how what I'm describing differs from each of them, and whether this is one phenomenon or two that happen to look alike from here. And if there's no term for it, coin one — but give me the edges, not just the label. Like what would a case be that looks exactly like this but isn't? I want to be able to spot the thing in the wild, in arguments that have nothing to do with coins or sleeping.
reasoning: |-
  Okay, the user is a data professional who's been intrigued by probability puzzles like the Sleeping Beauty problem and the two children paradox. They've noticed a pattern where people agree on all factual details but still arrive at different probabilities because they're fundamentally counting different things—possible worlds vs. experiences or utterances. 

  The user explicitly wants:
  - The name for this phenomenon (if it exists)
  - How it relates to established concepts like self-locating beliefs or Bertrand-style underspecification
  - Whether it's one unified phenomenon or distinct types
  - Boundary cases to recognize it "in the wild"

  Hmm, the core tension here is about reference classes. In Sleeping Beauty, halfers use the coin flip as the reference class (two worlds), while thirders use awakenings as the reference class (three experiences). In the two children paradox, the reference class shifts between family configurations vs. utterance scenarios. 

  Interesting that the user rejects the Bertrand analogy—they feel the setup here fully specifies the randomness, unlike the circle chord problem. They're right that the disagreement isn't about underspecification but about what constitutes a valid "trial." 

  The self-locating belief framework fits Sleeping Beauty (where am I in time?) but not the two children case (no "self" involved). The common thread is actually epistemic framing: what counts as a distinct observational scenario? 

  For naming... "reference class problem" is the closest established term, though it's broader. "Observer-relative counting" captures the essence but isn't standard. The key diagnostic question: "What is being randomly sampled here?" reveals the rift every time. 

  A non-probability example would be arguing whether "a bat" refers to the animal or sports equipment—same word, different mental categories. But in probability contexts, it's specifically about the granularity of possibilities. 

  User's sharp to notice this pattern transcends coins/sleeping. They'd probably enjoy the Monty Hall variations where people fight over host behavior assumptions—same reference class issue in disguise.
answer: |-
  You've hit on a profound and recurring pattern in probability paradoxes and epistemology. What you're describing is primarily an instance of the **Reference Class Problem**, but it intersects with deeper concepts like **Epistemic Framing**, **Observer-Relative Probabilities**, and the **Distinction between Possible Worlds and Possible Experiences**.

  Here's a breakdown of the phenomenon, its established names, boundaries, and how to spot it:

  ### 1. **Core Phenomenon: The Reference Class Problem**
     *   **Definition:** The difficulty in choosing the appropriate class of possible outcomes or states from which to calculate a probability. Different choices of "what to count" (reference class) lead to different probabilities, even when all physical facts are agreed upon.
     *   **Why it fits:**
          *   **Sleeping Beauty:** Halfer (1/2) → Reference class = possible *coin flip outcomes* (Heads, Tails). Thirder (1/3) → Reference class = possible *awakening experiences* (Mon-Heads, Mon-Tails, Tue-Tails).
          *   **Two Children:** "1/3" → Reference class = possible *family compositions* (BG, GB, BB). "1/2" → Reference class = possible *ways the information "at least one boy" could be obtained* (e.g., naming a specific boy, randomly sampling one child).
     *   **How it differs:** The Reference Class Problem is the *most direct* label for the core disagreement about "what to count." It explicitly acknowledges that the conflict arises from choosing *which possibilities are relevant and equiprobable* for the specific question being asked.

  ### 2. **Related Concepts & How They Differ**
     *   **Self-Locating Beliefs (Centered Worlds):**
          *   **Focus:** Beliefs about *where* (or *when*, or *who*) an agent is within a possible world. Crucial for Sleeping Beauty (Is it Monday? Is the coin Heads?).
          *   **Connection:** Sleeping Beauty *is* a canonical self-locating belief problem. The halfer/thirder split arises *because* Beauty needs to reason about her location in time relative to the coin flip.
          *   **Why it doesn't *fully* explain:** As you noted, the Two Children puzzle lacks any self-locating element. The disagreement stems purely from ambiguity in *how the information was generated* and *what scenario the probability applies to* (the composition vs. the process of disclosure). The disagreement about the reference class exists independently of self-location.
     *   **Bertrand's Paradox & Underspecification:**
          *   **Focus:** Ambiguity in *how* a "random" selection is actually made, leading to different well-defined probabilities.
          *   **Connection:** Both involve ambiguity leading to multiple valid answers. The disagreement feels similar on the surface.
          *   **Why it differs:** In Bertrand, the *physical process* is genuinely underspecified ("random chord"). In Sleeping Beauty/Two Children, the *physical setup is fully specified*. The disagreement is about *epistemic interpretation* – how to *model* the known setup probabilistically given the specific question and the information available. It's not that the randomness mechanism is missing; it's that the *meaning* of the probability statement ("What is P(Heads)?" / "What is P(Both Boys)?") is contested in light of the agent's perspective or the information's origin. Your gut feeling ("one answer is just correct") aligns with rejecting the Bertrand comparison here.
     *   **Observer-Relative Probabilities / Perspectivalism:**
          *   **Focus:** Probabilities can depend fundamentally on the *state of knowledge and perspective* of the observer/agent.
          *   **Connection:** This is the *philosophical undercurrent*. In both puzzles, the probability answer depends on *who* is asking *when* and *what information they have*. Beauty's probability on awakening differs from the experimenter's. The probability for the parent of the two children differs from the probability assigned by someone told "at least one is a boy" without knowing *how* that information was selected. The reference class choice often flows from adopting a specific perspective.
     *   **Epistemic Framing:**
          *   **Focus:** How the *question is posed* or the *information is presented* subconsciously guides the choice of reference class.
          *   **Connection:** The phrasing "the coin is fair" primes the halfer reference class. The experience of being awakened primes the thirder reference class. "At least one boy" is ambiguous – does it refer to a fixed fact about the family, or is it the *result* of an observation/report? Different framings nudge towards different reference classes.

  ### 3. Is it One Phenomenon or Two?
  It's **one core phenomenon (Reference Class Problem) manifesting in different contexts**, sometimes intertwined with self-location, sometimes not.
  *   **Common Core:** Ambiguity in defining the relevant set of equipossible scenarios/cases (the reference class) for calculating the conditional probability given specific information.
  *   **Difference in Trigger:**
      *   In **self-locating scenarios** (Sleeping Beauty), the ambiguity arises from the agent needing to locate themselves *within* a possible world (temporal location, identity).
      *   In **non-self-locating scenarios** (Two Children), the ambiguity arises from uncertainty about *how the information condition was generated* or *what scenario the probability applies to* (the object itself vs. the process of learning about it).

  ### 4. Spotting It in the Wild: Key Diagnostics
  Look for arguments where:
  1.  **All physical facts are agreed upon.** (Fair coin, experiment protocol, family exists, information statement).
  2.  **Probability answers diverge significantly** (1/2 vs 1/3 is classic).
  3.  **Proponents insist their answer is "obvious"** based on seemingly fundamental principles.
  4.  **The disagreement persists *after* clarifying the setup.**
  5.  **The "Aha!" moment involves clarifying "what is being counted":**
      *   "Are you counting *worlds* or *experiences*?" (Sleeping Beauty)
      *   "Are you counting *families* or *ways the information could be given*?" (Two Children)
      *   "Are you counting *objects* or *observations*?"
      *   "Whose perspective is this probability from? What information do *they* have?"

  ### 5. A Case That Looks Similar But Isn't
  **The Monty Hall Problem:**
  *   **Similarities:** People agree on the setup, get different answers (1/2 vs 2/3), think their answer is obvious.
  *   **Difference:** The disagreement stems from *misapplying conditional probability* or *failing to account for the host's knowledge and constraints*. The reference class (the three doors and the host's rules) is *not* ambiguous. Once the host's behavior is fully specified and understood, the 2/3 probability for switching is unequivocally correct. The resolution clarifies *how* to apply probability correctly to a fixed reference class, not *which* reference class to use.

  **A True Edge Case:**
  Consider a scenario with genuinely **ambiguous information generation** that *isn't* just about perspective:
  > "A random number generator picks a random integer between 1 and 10. You are told the number is prime. What is P(2)?" *But... it's revealed the RNG first picked randomly between two generation methods: Method A (1-10 uniform) or Method B (primes only 2,3,5,7). You don't know which method was used.*
  *   **Surface Similarity:** Disagreement on P(2) possible (Is it 1/4? 1/1? A weighted average?).
  *   **Key Difference:** The ambiguity is now *ontological* – a genuine lack of knowledge about the *actual physical process* (like Bertrand), not just an epistemic ambiguity about *how to model* a known process from a perspective. The reference class itself is objectively unknown or ill-defined due to missing physical specification. Your described cases feel different because the physical process *is* fully known; the ambiguity is in the *interpretation for probability assignment*.

  ### In Summary
  *   **Primary Established Term:** **Reference Class Problem**.
  *   **Related Concepts:** Self-Locating Beliefs (applies to some cases like SB), Observer-Relative/Perspectival Probabilities (underlying philosophy), Epistemic Framing (how the question primes the reference class).
  *   **Is it One or Two?** One core phenomenon (ambiguity in choosing the relevant set of equipossible cases) with different triggers (self-location vs. information generation ambiguity).
  *   **Spotting It:** Look for intractable probability disagreements on fully specified setups where proponents appeal to "obvious" counting principles. The resolution path *always* involves explicitly defining "What is being counted?" and "From whose perspective?".
  *   **Edge Case:** Disagreements stemming from genuinely *unknown physical randomness mechanisms* (like a poorly defined Bertrand variant) differ from disagreements stemming from *interpretive ambiguity* of a fully known mechanism (SB, Two Children).

  You've identified a fundamental and pervasive source of confusion in probabilistic reasoning, especially when information, perspective, and the definition of "cases" interact. It's why these puzzles are so enduring and fascinating!
