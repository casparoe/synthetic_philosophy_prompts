  The panel faces several conceptual challenges that need translation into operable questions: distinguishing honorary vs. functional naming, addressing historical judgment concerns, determining standing for petitioners/appellants, interpreting the 75-year "endurance" clause, defining when contextualization is substantive versus avoidance, and creating an audit trail to prevent procedural reversals.

  Key constraints include: 7 lay members (only 1 with institutional background), 120-day statutory clock, monthly 90-minute meetings, 5-vote threshold, and binding appeal parameters. The council already reversed two decisions for inconsistency, criticizing apparent crowd-size bias. The ordinance allows only three dispositions: retain, retain with contextualization (requiring physical marker), or remove (requiring funded replacement).

  The user specifically rejects theoretical discussions about commemoration ethics - they need executable mechanics. They've outlined six mandatory components that must survive simplification: 
  1) Honorary vs. functional naming test
  2) Framework for judging historical figures by contemporary objections
  3) Standing rules for affected parties
  4) Application of the 75-year endurance clause
  5) Criteria for substantive vs. perfunctory contextualization
  6) Standardized decision documentation

  Additionally, they want identified points where unmeasurable judgments occur and how to record them consistently. Finally, they require testing on three real cases where they have personal stakes (Renwick), complex stakeholder dynamics (Kilbride statue), and naming of new infrastructure with multiple proposals.

  The procedure must prevent these failure modes: appearance-driven decisions, inconsistent application of standards, misuse of contextualization as avoidance, and unrecorded subjective judgments. The output needs to include limitations - what cases it will mishandle or intentionally kick to council.

  For the Renwick case, the user explicitly wants unvarnished analysis even if it contradicts their personal position, which demonstrates academic integrity. The Kilbride case tests handling of unrepresented affected groups and institutional opposition. The bridge naming examines how to evaluate living persons with allegations, uncontroversial figures, descriptive names, and collective memorials under the same framework.

  The most delicate design challenges are: operationalizing "endurance" without banning all human names (perhaps through contemporary opposition filters), creating standing rules that don't require genealogical research, and defining when contextualization resolves harm versus papers over conflict. The decision template must force explicit declaration of which factor was dispositive to enable consistency reviews.
answer: |-
  Below is a practical decision procedure designed for lay panelists, formatted as a flowchart with explicit thresholds, stopping points, and documentation requirements. It prioritizes auditable reasoning over theoretical perfection.

  ---

  ### **Civic Names Review Panel: Decision Procedure**  
  *(90-Minute Meeting Flow with Handout & Appendix)*  

  #### **Core Handout Sequence**  
  **Step 1: Is this primarily an honor?**  
  - *Test:* Would removing the name *significantly disrupt* navigation or official records? (e.g., "Main Street" fails; "Dr. Smith Clinic" passes).  
  - *Stop if "No":* **Retain with no further analysis** (functional name).  
  - *Record:* "Honor confirmed: [Yes/No]."  

  **Step 2: Is the name >75 years old AND uncontested in its time?**  
  - *Test:* Was there *documented public opposition* from affected groups/peers *during the honoree’s lifetime*? (Skip if name is new/proposed).  
  - *Stop if "No" AND name >75 years old:* **Retain** (Endurance Clause satisfied).  
  - *Record:* "Contemporary objections: [None found/Documented]."  

  **Step 3: Does the harm meet the threshold?**  
  - *Test:* Did the honoree’s actions:  
    (a) **Violate core civic values today** (e.g., equality, bodily autonomy)?  
    (b) **Directly enable systemic harm** (exclusion, violence, discrimination)?  
    AND  
    (c) Was this harm **foreseeable** to contemporaries?  
  - *Stop if any "No":* **Retain with Contextualization** (marker required).  
  - *Record:* Threshold: [Met/Not met] for (a), (b), (c).  

  **Step 4: Can contextualization resolve?**  
  - *Test only if Step 3 = "Yes":* Would a marker *fully acknowledge the harm* without glorifying it? (If funding/space is infeasible, default to removal).  
  - *If "Yes":* **Retain with Contextualization**.  
  - *If "No":* Proceed to Step 5.  

  **Step 5: Removal + Replacement**  
  - Requires:  
    (a) Viable replacement name (pre-screened for basic acceptance).  
    (b) Funding source identified (petitioner or city).  
  - *If feasible:* **Remove and Replace**.  
  - *If not feasible:* **Retain with Contextualization** (temporary).  

  #### **Standing Rules (Appendix)**  
  - **Descendants/Institutions:** Input noted but *no special weight*.  
  - **Harmed Communities:** Prioritize testimony; absence *does not invalidate* harm.  
  - **General Public:** Opinions recorded but evaluated for *reasoning*, not volume.  

  #### **Decision Template**  
  ```  
  1. Honor? [Y/N]  
  2. >75 yrs + uncontested? [Y/N]  
  3. Harm Threshold: (a) [Y/N], (b) [Y/N], (c) [Y/N]  
  4. Contextualization Sufficient? [Y/N]  
  5. Removal Feasible? [Y/N]  
  DISPOSITION: [Retain / Retain+Marker / Remove+Replace]  
  DECISIVE FACTOR: [e.g., "Step 3(b): Systemic Harm"]  
  ```  

  #### **Unmeasurable Judgments (Record Explicitly)**  
  1. **"Core civic values today"** (Step 3a): *Record:* "Panel determined [value] is core per [example]."  
  2. **"Foreseeable harm"** (Step 3c): *Record:* "Contemporaries [did/did not] recognize harm via [evidence]."  
  3. **"Contextualization sufficiency"** (Step 4): *Record:* "Marker will address [specific harm] by [method]."  
  4. **"Viable replacement name"** (Step 5): *Record:* "[Name] selected for [reason], avoids [conflict]."  

  ---

  ### **Live Case Applications**  
  #### **(A) Hollis Renwick (Public Health Building)**  
  1. **Honor?** Yes (building commemorates his role).  
  2. **>75 yrs + uncontested?** No (1905 sterilization campaign had contemporary resignations → **Documented objections**).  
  3. **Harm Threshold:**  
     - (a) Violates bodily autonomy? **Yes**  
     - (b) Systemic harm? **Yes** (targeted vulnerable inmates)  
     - (c) Foreseeable? **Yes** (colleagues resigned in protest) → **Threshold Met**.  
  4. **Contextualization sufficient?** **No** (Marker cannot reconcile building’s *purpose* with forced sterilization advocacy).  
  5. **Removal feasible?** Yes (petitioners propose "Pioneer Health Clinic").  
  → **DISPOSITION: Remove + Replace**  
  → **DECISIVE FACTOR: Step 3(b) + 4 (Irreconcilable conflict with building’s function)**  

  #### **(B) Nora Kilbride Statue**  
  1. **Honor?** Yes (statue explicitly commemorates her).  
  2. **>75 yrs + uncontested?** No (1924; racial exclusion was contested in labor movements then).  
  3. **Harm Threshold:**  
     - (a) Violates equality? **Yes**  
     - (b) Systemic harm? **Yes** (exclusion entrenched discrimination)  
     - (c) Foreseeable? **Yes** (national labor debates on race existed) → **Threshold Met**.  
  4. **Contextualization sufficient?** **Yes** (Statue’s location at union hall allows marker explaining harm + union’s evolution).  
  → **DISPOSITION: Retain with Contextualization**  
  → **DECISIVE FACTOR: Step 4 (Harm addressable without removal)**  

  #### **(C) Pedestrian Bridge Proposals**  
  - **Living Ex-Councilmember:**  
    - **Stop at Step 3**: Unadjudicated allegations → Harm threshold *not met* (insufficient evidence).  
    - → **Reject proposal** (Endurance Clause risk: unresolved claims).  
  - **Beloved Teacher**:  
    - **Stop at Step 2**: No wrongdoing → **Accept** (no further review).  
  - **Descriptive Name**:  
    - **Stop at Step 1**: Functional ("Riverbend Bridge") → **Accept**.  
  - **1911 Workers Memorial**:  
    - **Step 3**: Harm (industrial neglect) → **Threshold Met** but collective honor → **Contextualization unnecessary**.  
    - → **Accept** (commemorates victims, not perpetrators).  
  → **DISPOSITION: "1911 Memorial Bridge"**  

  ---

  ### **What This Procedure Cannot Do**  
  1. **Resolve Deep Value Conflicts**: Cases where panelists fundamentally disagree on "core civic values" (e.g., military figures in contested wars) will appear consistent in *recording* but not in *outcome*.  
  2. **Handle Missing Historical Evidence**: Scant records of past harm may wrongly trigger Step 2 retention.  
  3. **New Names with Future Risk**: Endurance Clause relies on *current* consensus; cannot predict societal shifts.  
  4. **Resource-Limited Contextualization**: If marker funding fails, removal may be forced despite Step 4 "Yes."  
  5. **Routed to Council**:  
     - Replacement name disputes (Step 5 feasibility).  
     - Standing challenges (if procedural inequity alleged).  

  **Appearance vs. Substance of Consistency**: The template ensures *factors* are compared uniformly, but subjective judgments (e.g., "foreseeable harm") may vary. Recording *which* harm met the threshold (e.g., "Step 3b") contains inconsistency by isolating the point of discretion.  

  **For Renwick**: The procedure overrides your position due to *functional conflict* (health building vs. eugenics). A street (not health-related) might have allowed contextualization. This exposes the reasoning: honoring health work *in a medical facility* is irreconcilable with his harm.
