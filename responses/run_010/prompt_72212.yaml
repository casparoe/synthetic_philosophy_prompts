  | 1. Octopus | **Yes** | Decentralized but intrinsic dynamics (direct neural interactions) preserved; known conscious architecture. |
  | 2. Silicon neurons | **Yes** | Direct causal replacement; intrinsic dynamics intact; known architecture. |
  | 3. Whole-country | **No** | Violates intrinsic implementation: humans interpret rules, adding mediated cognition. |
