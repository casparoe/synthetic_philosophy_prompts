  Based on your cases and intuitions, I've synthesized a principle that captures most of your verdicts while addressing the tensions. The core insight is that consciousness requires more than abstract functional organization; it demands **direct, intrinsic causal dynamics** at an appropriate scale and speed. Here's the principle broken down:

  ### Principle: Intrinsic Dynamics Functionalism (IDF)
  1. **Implementation of a known conscious architecture**: The system must replicate the functional organization (causal state-transition map) of a system independently confirmed as conscious (e.g., human brain, octopus nervous system).  
     *Motivation*: Excludes lookup tables (case 4) and thermostats (case 5), which lack the rich causal structure of a conscious system.  
     *Clarification*: "Known conscious" avoids circularity by relying on empirical evidence (e.g., evolutionary biology, behavior) for architectures like brains.

  2. **Intrinsic implementation**: The functional states must be realized by *direct, non-derived* causal interactions among components, without interpretation by external systems.  
     *Motivation*: Excludes the whole-country (case 3) and trained-mice scenarios because humans/mice are conscious agents *interpreting* rules, adding a layer of mediation. Silicon chips (case 2) directly cause outputs without interpretation.

  3. **Real-time coherence**: The system must operate at a speed that preserves the temporal constraints required for information integration in the original architecture. Relative timing of cause-effect chains must be maintained.  
     *Motivation*: Explains anesthesia (case 6, dynamics halted) and slow worm simulation (case 8, century-scale steps break integration). Allows octopus decentralization (case 1) and 1000x-slow worm (case 8) if integration persists.

  ### IDF Applied to Your Cases:
  | Case | IDF Verdict | Why |
