  ### Coherence Audit Procedure

  **Objective**: Verify internal coherence of probability estimates without requiring measure theory or complex computations. The audit identifies sets of bets guaranteeing a loss at the member's posted probabilities, assuming they accept small-stakes bets as per group norms. Risk aversion that leads to declining large bets is not considered incoherence.

  **Procedure** (ordered steps, arithmetic only, within 20 minutes per member):

  1. **Preprocessing**:
     - Collect all posted probabilities for the quarter.
     - Exclude non-binary events and events with ranges (judgment point: skip these; note in output).
     - For members using discrete increments (e.g., 5% steps), note the rounding unit \( r \) (e.g., \( r = 0.05 \) for 5% increments; \( r = 0.01 \) for whole percents). Use the coarsest unit if mixed.

  2. **Form Event Groups**:
     - Build an undirected graph:
       - Nodes: Events (e.g., "Candidate wins primary").
       - Edges: Add an edge between events \( A \) and \( B \) if \( P(B \mid A) \) or \( P(B \mid \neg A) \) is posted.
     - Partition into connected components (groups of logically related events).

  3. **Test 1: Law of Total Probability (LOTP) Check**:
     - **Concrete Question**: For a group containing events \( A \), \( B \), \( P(B \mid A) \), \( P(B \mid \neg A) \), and \( P(B) \), do the probabilities satisfy \( P(B) \approx P(A) \cdot P(B \mid A) + (1 - P(A)) \cdot P(B \mid \neg A) \)?
     - **Tolerance**:  
       \[
       \text{tolerance} = \frac{r}{2} \times (1 + P(B \mid A) + P(B \mid \neg A)) + \frac{r}{2}
       \]
       where \( r \) is the rounding unit.  
       *Why*: Accounts for max rounding error in \( P(A) \), \( P(B \mid A) \), \( P(B \mid \neg A) \), and \( P(B) \). For whole percents (\( r = 0.01 \)), tolerance ≈ 0.02 (worst-case). For 5% increments (\( r = 0.05 \)), tolerance ≈ 0.10.
     - **Pass Condition**: 
       \[
       \left| P(B) - \left[ P(A) \cdot P(B \mid A) + (1 - P(A)) \cdot P(B \mid \neg A) \right] \right| \leq \text{tolerance}
       \]
     - **Failure Response**:
       - Compute violation magnitude \( D = \left| P(B) - \text{LOTP result} \right| \).
       - **Output Guaranteed-Loss Bets** (using member's probabilities; stakes scaled to $1 per contract):
         - If \( P(B) > \text{LOTP result} \):
           - *Sell* a bet on \( B \) at price \( P(B) \).
           - *Buy* a bet on \( (A \text{ and } B) \) at price \( P(A) \cdot P(B \mid A) \).
           - *Buy* a bet on \( (\neg A \text{ and } B) \) at price \( (1 - P(A)) \cdot P(B \mid \neg A) \).
         - If \( P(B) < \text{LOTP result} \):
           - *Buy* a bet on \( B \) at price \( P(B) \).
           - *Sell* a bet on \( (A \text{ and } B) \) at price \( P(A) \cdot P(B \mid A) \).
           - *Sell* a bet on \( (\neg A \text{ and } B) \) at price \( (1 - P(A)) \cdot P(B \mid \neg A) \).
         - **Table Format** (example for \( P(B) > \text{LOTP} \)):
           | Bet                     | Member Pays Auditor Now | Auditor Pays Member if Event Occurs | Member Pays Auditor if Event Occurs |
           |-------------------------|--------------------------|-------------------------------------|-------------------------------------|
           | Sell \( B \) at \( P(B) \) | \( P(B) \)              | $1 if \( B \)                       | —                                  |
           | Buy \( (A \land B) \)   | —                        | $1 if \( A \land B \)               | \( P(A) \cdot P(B \mid A) \)       |
           | Buy \( (\neg A \land B) \) | —                      | $1 if \( \neg A \land B \)          | \( (1 - P(A)) \cdot P(B \mid \neg A) \) |
           | **Total**               | \( P(B) - P(A) \cdot P(B \mid A) - (1 - P(A)) \cdot P(B \mid \neg A) \) | — | — |
           - **Net Effect**: Member loses \( D \) in all outcomes (future payments cancel).
       - **Recommend Revision**:
         - Identify variable requiring smallest absolute change to restore coherence:
           - Candidate variables: \( P(A) \), \( P(B \mid A) \), \( P(B \mid \neg A) \), \( P(B) \).
           - Solve for minimal adjustment (e.g., change \( P(B) \) to LOTP result).
         - **Output**: "Revise \( P(B) \) (from X to Y) as it requires the smallest change (Δ = Z) to satisfy LOTP. Other variables could be revised, but this minimizes adjustment."

  4. **Termination**:
     - If no LOTP group exists or all groups pass, output **PASS**.
     - Skip judgment-prone cases (ranges, vague resolutions, non-binary events).

  **Judgment Points** (explicitly marked):
  - **Vague Resolution Criteria**: Skip events lacking clear payoff conditions (e.g., "economic improvement" without a defined metric).
  - **Ranges**: Skip events with range estimates (e.g., "60-70%").
  - **Risk Aversion**: A member declining large bets is not incoherent. The audit assumes small-stakes acceptance; failures reflect probabilistic inconsistency, not betting behavior. Do not penalize bet declines.
  - **Dynamic Updates**: Notes about future probability changes (e.g., "will move to 0.90 after event") are not static incoherence. Skip in audit (exploitation may arise later via conditional bets, but not flagged here).

  **Coherence vs. Accuracy (Welcome Document Text)**:
  > "This audit checks the *internal consistency* of your probabilities—whether they logically align with each other (e.g., no guaranteed loss from bets at your prices). It does not assess *accuracy* (e.g., calibration to outcomes). You can be coherent but inaccurate (poor information) or incoherent but accurate (luck). We track accuracy separately via scoring rules (Brier/log scores). Prioritize both: coherence avoids self-defeating beliefs; accuracy reflects truth."

