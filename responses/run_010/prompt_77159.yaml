answer: |-
  ### 1. The Explanandum: What Was at Stake (190 words)  
  The core event demanding explanation is **Newton’s 1684 demonstration connecting the inverse-square law to elliptical orbits**, culminating in the *Principia*’s rigorous synthesis. This granularity is essential:  
  - The *conjecture* (inverse-square gravity) was already circulating (Hooke, Wren, Halley) and thus structurally overdetermined.  
  - The *tract/book* are outputs contingent on Newton’s engagement, but their specific content—notably the mathematical proof—is the breakthrough.  
  - *Action-at-a-distance acceptance* is downstream of the proof’s authority and lies beyond this episode.  

  The debate hinges on whether the *demonstration itself* was inevitable. Without it, the conjecture remained an unsolved puzzle—as evidenced by Hooke’s failed claims and Halley’s prize. The calculus contrast underscores this: Leibniz’s independent discovery shows degeneracy (multiple paths to similar results), but the *Principia*’s dynamics had no equivalent rival. The great-man thesis asserts Newton was necessary for the proof; structuralism implies it would emerge regardless.  

  ### 2. The Counterfactual: Precisely Stated (250 words)  
  **Antecedent:** Newton dies in 1683 (minimal rewrite). Milieu fixed: London circle’s knowledge (1679–84), Huygens’ centrifugal force, Leibniz’s nascent dynamics, and Halley’s 1684 query persist.  
  **Fixed:** Scientific tools (calculus precursors), data (Kepler’s laws), and social incentives (Royal Society debates, Halley’s prize).  
  **Variable:** *Who* provides the solution.  

  **Decomposed Questions:**  
  1. **Occurrence:** Would a mathematically rigorous proof emerge?  
  2. **Timing:** When? Before 1700? By 1690?  
  3. **Form:**  
     - *Content:* Would it match Newton’s synthesis (universal gravitation + elliptical orbits)?  
     - *Rigor:* Would it deploy geometrical limits or an inferior method?  
     - *Credibility:* Would it compel acceptance of action-at-a-distance?  

  The structuralist must argue the system re-equilibrates: a "substitute" (e.g., Halley-Hooke collaboration, Leibniz) fills the vacancy. The great-man theorist denies substitutability, holding the milieu fixed.  

  ### 3. What Structuralism Gets Right (300 words)  
  The episode validates structuralism’s core claims:  
  - **Distributed precursors:** Hooke’s 1679 correspondence *prompted* Newton’s focus on orbital motion. Huygens’ 1673 centrifugal force analysis provided key tools. The London circle’s discussions (1670s–84) created a "search party" with high incentive (Halley’s prize).  
  - **Degeneracy:** The calculus case proves the system could generate near-identical outputs (Leibniz/Newton). Here, the inverse-square *conjecture* was degenerate—arrived at independently by Hooke, Wren, *and* Halley.  
  - **Search rate evidence:** The 1679–84 period shows active, qualified search. Hooke’s 1674 *An Attempt to Prove the Motion of the Earth* proposed universal attraction, and Halley’s 1684 query reflects sustained institutional interest.  

  The contrast with the calculus reinforces this: Leibniz’s parallel work shows the mathematical tools were "in the air." Structuralism correctly identifies the system’s critical state—multiple actors converging on the problem with sufficient tools.  

  ### 4. Where Structuralism Fails (300 words)  
  Structuralism stumbles on three fronts:  
  - **The 20-year demonstration gap:** Despite Hooke’s 1674 proposal and Halley/Wren’s engagement, *no proof emerged* before 1684. Hooke’s mathematical limitations ("not a mathematician," per Huygens) and failure to formalize ideas reveal a talent bottleneck. Search rate alone couldn’t compensate for missing expertise.  
  - **Non-substitutable rigor:** Leibniz focused on metaphysics; Huygens rejected action-at-a-distance. No contemporary combined geometrical virtuosity, physical insight, *and* willingness to embrace attraction. Newton’s 1684 tract achieved in months what eluded others for years.  
  - **Form and credibility:** Hooke’s qualitative sketches lacked mathematical proof; Huygens’ contact mechanics couldn’t yield elliptical orbits. Without Newton’s *De Motu* tract, the synthesis likely remains fragmented. The search-rate model (vacancy + incentives → solution) ignores qualitative disparities in capability.  

  The calculus contrast highlights this: Leibniz and Newton had comparable mathematical skill, but no peer matched Newton’s *physical*-mathematical synthesis for dynamics.  

  ### 5. Implications for the Debate (350 words)  
  **Granularity hypothesis:** It resolves the stalemate. Structuralism explains the *conjecture* (occurrence), while the great-man thesis explains the *proof*’s timing/form. The case thus **strains structuralism** by revealing its blindness to *variation in solution quality*.  

  **Priority quarrel as evidence:** The Hooke-Newton dispute underscores non-fungibility. Hooke’s legitimate contributions (deflection hypothesis) couldn’t substitute for mathematical proof—a gap the system couldn’t close. The calculus priority fight, conversely, involved interchangeable claims.  

  **Physics vocabulary utility:**  
  - **Degeneracy** clarifies why the calculus emerged multiply but the *Principia* did not: the solution space for dynamics had fewer paths.  
  - **Criticality** fits the 1680s milieu—a "phase transition" was possible—but Newton was the nucleation site.  
  - **Sensitivity vs. robustness**: The system was robust in generating conjectures but sensitive to individual capability for synthesis.  

  **Unresolved uncertainty:** *Could Leibniz have achieved it by 1690?* Historians dispute his focus; extant notes suggest no trajectory toward *Principia*-level dynamics. This would require evidence of Leibniz prioritizing celestial mechanics over metaphysics pre-1690.  

  ### 6. Verdict: Newton Was Necessary (200 words)  
  Under the minimal-rewrite antecedent (Newton removed, milieu fixed), **the demonstration would not have occurred by 1687—and likely not for decades.** Reasons:  
  1. **Timing:** The 20-year failure pre-1684 shows the system lacked a mechanism to overcome Hooke’s mathematical deficits or Huygens’ physical objections.  
  2. **Form:** Without Newton, the inverse-square law remains a conjecture paired with flawed circular-orbit proofs (e.g., Halley’s 1684 attempt). Rigor and synthesis degrade: no Book I, Propositions 1–2 (geometrical limits), no corollary linking Kepler’s laws to universal gravitation.  
  3. **Credibility:** Huygens’ contact-mechanics paradigm persists longer, delaying acceptance of action-at-a-distance.  

  Structuralism’s re-equilibration claim ("someone else would do it") is an evasion—it assumes substitutes it cannot identify. The documented cognitive deficit in the London circle proves Newton was non-fungible for *this* solution at *this* level. The case confirms the great-man thesis at the granularity of transformative demonstration.  

  **Physics concepts:** They are not decorative—degeneracy and criticality provide measurable criteria for substitutability and system readiness, moving beyond slogans. Your framework forces precision where historiography often blurs.
