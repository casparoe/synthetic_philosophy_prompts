prompt: |-
  Background: I spent thirty-eight years in a state lab doing ecotoxicology, mostly freshwater, mostly the uncharismatic invertebrates nobody fundraises for. Retired four years ago, started reading philosophy to have something to do, and I've gotten properly stuck on the precautionary principle. Partly because people keep asking me about it — I sit on a county advisory board now and the moment something uncertain comes up someone says "well, you're the scientist, does precaution apply here?" and I have no good answer except gut feel.

  So let me lay out the gut feel and see if it adds up to anything.

  A company applies to register a fungicide. Good mammalian data, good fish data, no amphibian data whatsoever, and the application area is frog country. I say make them run the amphibian study before anything is permitted. No hesitation.

  Same shape of ignorance, different chemical. A compound whose breakdown pathway you can work out from the chemistry, and where measured concentrations in the watershed come in four orders of magnitude below anything that has ever produced an effect in anything. The dataset is thinner than the fungicide one. I say register it.

  An invasive weed is already in the lake and spreading, and it will close out the fishery inside a decade. The only tool that works is a herbicide with real unknowns of its own. I say use it. Which looks like it contradicts the first case, except that doing nothing is a decision too.

  A single creek population of a caddisfly, found nowhere else, would be permanently gone if we approve a diversion. Straightforwardly irreversible. I say that isn't a reason to stop the diversion, and I know how that sounds coming from me.

  A contaminant that would sterilize the invertebrate community of a whole watershed, but where recolonisation from upstream refugia in thirty years is ecologically plausible. I say stop it — even though by the irreversibility column the caddisfly case looks worse and I let that one through.

  Terminal illness, experimental drug, essentially no long-term data. I'd take it, and I'd let my wife take it, and I don't think that's weakness on my part.

  A one-in-ten-million estimate that a treatment works up anoxic and kills a reservoir. Catastrophic if true. I say shrug and proceed, and I could not defend the ten million to you with a straight face.

  The rough rule I've been carrying around is: act when you can't bound the downside and the price of buying information is small next to it; don't act when the inaction is itself the unbounded risk. But that misses the caddisfly entirely, and it doesn't say why the fungicide and the second chemical come out different when the second one has less data behind it. The Sunstein book pushed me the other way — towards thinking this whole principle is just regulatory panic dressed up — and maybe he's right, but he writes as though overreaction were the only failure mode available, which after thirty-eight years I know isn't true.

  What I want: is there a principle that gets all of these, or nearly all? State it precisely enough that I could hand it to the board without embarrassment — I want to know what the clauses are, which of my cases forces each clause in, and what it says about situations I haven't thought of yet. And tell me plainly which verdicts I have to give up if I want something simpler rather than something baroque. I'd rather lose one than carry around a rule with nine conditions.

  Two extra things. First, a distinction from my working life that I'm not sure survives into the philosophy: there is a big difference between "we measured it and the confidence interval is wide" and "we have no idea what the mechanism even is." Both get filed under uncertainty, which always struck me as sloppy, and I'd like to know whether any respectable principle actually needs the difference or whether my intuitions are just tracking vividness.

  Second, the case I keep flip flopping on, where I most want your principle's verdict. A chemical gets banned, and industry swaps in a close structural relative with no data at all on it. The definitive chronic study would take eight to ten years. In the meantime the substitute is in every stream in the state, and there's a real suspicion — nothing more — that it shares the mechanism we banned the first one for. Waiting costs us eight years of exposure we can't recover; acting now might cost us a compound that was perfectly fine and the benefits it was delivering. I've argued both sides of this out loud in the last year. Which way does your principle send me, and does it send me the same way if the suspicion of a shared mechanism is stronger?
reasoning: |-
  Okay, let me start by really understanding what this user is asking. They have decades of experience in ecotoxicology and now deal with applying the precautionary principle in their advisory role. They've shared several specific cases where their gut feeling guided decisions, but they want a consistent principle that can handle all these scenarios. 

  First, I need to unpack their examples. The fungicide without amphibian data—they insisted on testing. But for the chemical with low concentrations and predictable breakdown, they approved it despite thinner data. Then there's the invasive weed herbicide with unknowns, which they approved because inaction was worse. But the caddisfly extinction scenario, they allowed the diversion even though it's irreversible. The contaminant sterilizing invertebrates was stopped because recolonization is possible in 30 years. Terminal illness with experimental drugs—they'd take the risk. And the one-in-ten-million catastrophe risk, they'd proceed.

  Their rough rule focuses on unbounded downsides and the cost of information. But it fails in the caddisfly case and doesn't explain the fungicide vs. chemical difference. They also mention Sunstein's critique but feel he ignores underreaction risks. 

  The user wants a principle that's precise, not baroque, and can handle their cases. They also highlight two types of uncertainty: statistical (wide CI) vs. mechanistic (unknown mechanism). And there's the flip-flop case about substituting a banned chemical with a similar one without data.

  I need to find a framework that addresses all this. Let me recall ethical principles. Deontology focuses on duties but might be too rigid. Utilitarianism weighs costs/benefits but struggles with uncertainty. The precautionary principle often emphasizes avoiding harm but varies in interpretation. 

  Key elements from their cases: reversibility, magnitude of harm, cost of delay, quality of uncertainty. The fungicide case has high uncertainty about a severe harm, so requiring data makes sense. The second chemical has low concentrations and predictable pathways, so uncertainty is bounded. The invasive weed: inaction has definite, severe consequences. The caddisfly: irreversible loss, but they allowed it. Why? Maybe because the harm is localized, not systemic? The contaminant sterilizes a whole watershed, so even with recolonization, the scale is massive. 

  For the flip-flop case: substituting a chemical with suspicion of shared mechanism. Waiting 8-10 years for data means widespread exposure. Acting now might lose a safe chemical. The principle needs to consider the suspicion strength and the cost of delay. If suspicion is high, acting to require testing makes sense. If low, maybe allow interim use with monitoring.

  Also, the uncertainty types: mechanistic uncertainty (unknown how it works) is different from statistical (we measured but not precisely). Mechanistic uncertainty might warrant more precaution because it's harder to bound risks.

  So, synthesizing a principle: Focus on decision quality under uncertainty. Evaluate harm severity, reversibility, uncertainty quality, and the burden of proof. Assign the burden based on potential harm and uncertainty. If harm is high and uncertainty is unboundable (mechanistic), burden is on the proposer to show safety. If uncertainty is boundable (statistical), or inaction has high costs, the burden shifts.

  This handles the fungicide (high harm, unboundable uncertainty → require data). The second chemical: low concentrations and predictable breakdown → boundable uncertainty → approve. Invasive weed: inaction has definite harm → act. Caddisfly: irreversible but localized harm, maybe other factors like social needs? Their principle allows trade-offs, so it fits. Contaminant: irreversible systemic harm → stop. Terminal illness: high cost of delay → act. One-in-ten-million: boundable risk (even if low confidence) → proceed.

  For the flip-flop case: suspicion of shared mechanism. If suspicion is strong, treat like the fungicide—require data before full approval. If weak, allow with monitoring and phased testing. The principle would say: potential high harm with mechanistic uncertainty shifts burden to prove safety.

  The user also wants to know which verdicts to give up for simplicity. If they drop the caddisfly case or accept trade-offs, the principle becomes cleaner. Emphasizing that decisions must consider both action and inaction risks, and the quality of uncertainty, covers most cases.

  Finally, the formulated principle: "Prioritize preventing severe, irreversible harms when uncertainty about causation is unboundable; otherwise, optimize outcomes across action/inaction pathways with proportionate evidence burdens." This includes clauses for harm severity, reversibility, uncertainty type, and burden shifting. It explains their cases and handles new ones by evaluating these factors.
answer: |-
  Here's a principle that systematically addresses your cases while respecting your demand for precision and avoiding baroque complexity. It distinguishes uncertainty types and forces explicit trade-offs:

  **The Asymmetric Harm Principle (AHP):**
  *"When a proposed action or inaction carries credible potential for severe, irreparable, and systemic harm to critical ecological or human health endpoints, the burden of proof shifts to the proponent to demonstrate that risk is acceptably bounded. This burden scales with the severity and irreversibility of potential harm and the quality of uncertainty. If the potential harm is not severe/irreparable/systemic, or if inaction carries comparable/certain harm, decisions should minimize net expected harm using best available evidence, with a tolerance for boundable uncertainty."*

  ### Core Clauses & How Your Cases Force Them In:
  1.  **"Credible potential for severe, irreparable, systemic harm"**: (Forces precaution)
      *   *Why it's needed:* Fungicide case (unknown amphibian risk = potential severe systemic harm to frogs in frog country). Contaminant sterilizing watershed case (severe, systemic, irreparable on human timescales despite recolonization *potential*). Caddisfly case *tests* this – extinction is severe & irreparable, but *not systemic* (single population).
      *   *Your Cases:* Triggers precaution in Fungicide & Watershed Contaminant. *Not* triggered in: Second chemical (low concentrations = not severe), Invasive Weed (inaction harm is certain/severe), Terminal Illness (inaction harm severe/certain), 1-in-10-million (not credible/severe? - see clause 3), Caddisfly (arguably not systemic).

  2.  **"Burden of proof shifts to the proponent to demonstrate risk is acceptably bounded"**: (Assigns responsibility)
      *   *Why it's needed:* Fungicide case (company must run amphibian study). Flip-Flop Case (if Clause 1 triggered, industry must bound risk of the substitute).
      *   *Your Cases:* Applied in Fungicide. *Not* applied in Second Chemical (burden stays with regulators/society to show harm? Or proponent easily meets it via chemistry).

  3.  **"Burden scales with severity/irreversibility & QUALITY of uncertainty"**: (Distinguishes uncertainty types)
      *   *Why it's needed:* Distinguishes Fungicide (Mechanistic Uncertainty - "no idea about mechanism" in amphibians) vs. Second Chemical (Statistical Uncertainty - "CI wide but bounded by chemistry/concentration"). Explains why less data can be sufficient for the second chemical. Also addresses 1-in-10-million case (Statistical Uncertainty, even if huge CI, can be "bounded" as extremely low probability *relative to known benefits/inaction risks*).
      *   *Your Cases:* High Burden: Fungicide (Mechanistic Uncert.), Watershed Contaminant (Severe + Mech.?). Lower Burden: Second Chemical (Statistical Uncert. + Bounded), 1-in-10-million (Statistical Uncert.). Flip-Flop Case: Burden height depends *entirely* on whether suspicion points to *mechanistic* similarity (high burden) vs. just structural similarity with no mechanistic link suspected (lower burden).

  4.  **"If potential harm not severe/irreparable/systemic OR inaction carries comparable/certain harm, minimize net expected harm"**: (Allows risk-taking & pragmatic trade-offs)
      *   *Why it's needed:* Invasive Weed (inaction harm certain/severe > action harm unknown). Terminal Illness (inaction harm certain/severe). Caddisfly (Harm severe/irreparable but localized/non-systemic; social/economic benefits of diversion may outweigh it under "minimize net harm"). Second Chemical (No severe harm potential evident).
      *   *Your Cases:* Allows action in Invasive Weed, Terminal Illness, Second Chemical, Caddisfly, 1-in-10-million. Requires stopping Watershed Contaminant (Clause 1 dominates).

  5.  **"Tolerance for boundable uncertainty"**: (Prevents paralysis by statistical noise)
      *   *Why it's needed:* Second Chemical (boundable by chemistry/concentration), 1-in-10-million (boundable as extremely low probability).
      *   *Your Cases:* Allows approval in Second Chemical & 1-in-10-million.

  ### How AHP Handles Your Cases:
  *   **Fungicide:** Clause 1 (Potential severe systemic harm) + Clause 3 (Mechanistic Uncertainty) → Clause 2 Applies (Require amphibian study). **VERDICT: Require Study.**
  *   **Second Chemical:** Clause 3 (Boundable Statistical Uncertainty + Low Severity Potential) → Clause 4 Applies (Minimize net harm → Approve). **VERDICT: Register.**
  *   **Invasive Weed:** Clause 4 (Inaction harm severe/certain) → Minimize net harm → Use Herbicide. **VERDICT: Use it.**
  *   **Caddisfly:** Clause 1 *Not Fully Met* (Irreparable but likely non-systemic). Clause 4 Applies → Minimize net harm (likely allows diversion, weighing ecological loss vs. human need). **VERDICT: Allow Diversion.**
  *   **Watershed Contaminant:** Clause 1 (Severe, Irreparable *on management timescales*, Systemic harm) → Clause 2 Applies (Stop until risk bounded). **VERDICT: Stop it.**
  *   **Terminal Illness:** Clause 4 (Inaction harm severe/certain) → Minimize net harm → Take drug. **VERDICT: Take it.**
  *   **1-in-10-million:** Clause 3 (Boundable Statistical Uncertainty - extreme low prob.) + Clause 4 → Minimize net harm → Proceed. **VERDICT: Proceed.**
  *   **Flip-Flop Case:** Depends on suspicion strength:
      *   *Weak Suspicion (Just structural similarity):* Clause 3 (Uncertainty boundable as "low concern until proven otherwise") → Clause 4 likely allows interim use *with accelerated monitoring/study* (Minimize net harm: avoids losing benefits + collects data).
      *   *Strong Suspicion (Credible mechanistic link):* Clause 1 (Potential severe systemic harm - same as banned chem) + Clause 3 (Mechanistic Uncertainty) → Clause 2 Applies (Shift burden: require *some* data (e.g., short-term chronic, QSAR, mechanistic assays) *before* widespread use. Full chronic study can run concurrently with restricted/conditional approval and intense monitoring). **VERDICT: Conditional Approval/Accelerated Testing if suspicion strong; Interim Use + Monitoring if weak.**

  ### What You Gain & What You Might Give Up for Simplicity
  *   **Gains:** Coherence across all cases. Distinguishes uncertainty types *explicitly* (Clause 3). Handles action/inaction symmetry (Clause 4). Avoids absolute prohibitions. Provides clear burden-shifting trigger (Clause 1).
  *   **Simplification Cost (Losing One Verdict):** To make it significantly simpler (e.g., remove "systemic" or merge uncertainty types), you'd likely have to abandon the **Caddisfly verdict**. A simpler principle focusing *only* on irreversibility would force you to stop the diversion. If you value that flexibility (allowing localized extinction for greater good), you need the "systemic" qualifier or the explicit Clause 4 trade-off. Simpler versions struggle most with the Caddisfly/Invasive Weed duality.

  ### Addressing Your Specific Questions
  1.  **Uncertainty Distinction (Measured/CI vs. Mechanism Unknown):** AHP *needs* this. Clause 3 makes "quality of uncertainty" central to scaling the burden of proof. Your intuition is correct and philosophically sound (epistemic uncertainty about mechanisms is fundamentally different from parameter uncertainty within a known model). Ignoring this *is* sloppy and leads to poor decisions (like over-regulating the second chemical).
  2.  **Flip-Flop Case:** As above. AHP verdict depends *critically* on the "quality of uncertainty" driven by the suspicion of shared mechanism. Strong mechanistic suspicion triggers precaution (Clause 1 + 3 → Clause 2); weak suspicion allows pragmatic management under Clause 4.
  3.  **Sunstein Critique Addressed:** AHP explicitly avoids "regulatory panic." Precaution (burden shifting) is *only* triggered by a high bar (Clause 1). It actively embraces risk-taking and trade-offs when this bar isn't met or when inaction is dangerous (Clause 4). It acknowledges underreaction as a major failure mode. It also avoids absolutism ("irreversibility alone isn't enough" - Caddisfly case).

  ### Handing it to the Board
  This fits on one page. Present the AHP verbatim, then add: "Key applications: 1) *Require proof of safety* only for risks of severe, permanent, widespread harm where we don't understand *how* harm might occur (e.g., new pesticide on untested keystone species). 2) *Tolerate uncertainty* when risks are bounded by science or low probability, or when doing nothing is worse (e.g., managing invasives with unknowns, using drugs against terminal illness). 3) *The stronger the suspicion a new problem shares the mechanism of a known hazard, the more proof we require before widespread use.*"

  This principle respects your experience, codifies your intuition, handles ambiguity, and forces explicit discussion of the factors that actually matter in real-world ecological risk decisions.
