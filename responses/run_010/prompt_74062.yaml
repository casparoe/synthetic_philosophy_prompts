  ## Procedure

  ### Before the game
  - Hand out score sheets that have a table for rounds 1-5 with columns: your choice (look/don't look), your act, points this round, total points.
  - Explain that they will play 5 rounds, each independent.
  - In each round, they will be given a decision sheet that describes the scenario and available acts.
  - They will first decide whether to look at the offered information or not. They record that decision.
  - Then, based on that decision, they choose an act from the available ones (which may depend on whether they looked or not).
  - After everyone has decided, the true state (or the outcome) will be revealed, and they calculate their points.
  - Total points at the end will be converted to a prize.

  ### In each round
  1. Distribute the decision sheet for the round.
  2. Give them 1 minute to decide on look/don't look and record it.
  3. Give them 1 minute to choose an act and record it.
  4. Collect the decision sheets (or have them keep for scoring).
  5. Reveal the true state for the round (e.g., by flipping a coin or drawing a ball publicly, but note that in some rounds the state is fixed for the class).
  6. Have them calculate their points and record on their score sheet.
  7. Update the public scoreboard (optional).

  ### After all rounds
  - Convert total points to prizes.
  - Debrief.

  ## Debrief
  - Walk through the rounds and the scores.
  - For each round, ask students what happened to those who looked and those who didn't.
  - Then, ask them to articulate the conditions under which looking was beneficial, neutral, or harmful.
  - Guide them to state the theorem: freely available information is never harmful if [conditions], and it is strictly valuable when it can change the decision.
  - Then, discuss the rounds that broke the conditions.

  ## What can go wrong

  1. **Ambiguity-neutral students in Round 5**: In the ambiguity round, if a student is not ambiguity-averse, they might have chosen to look and then bet, and if they win, they get 10, which is more than 6.5. Then they might not see that not looking was better on average. 
     - Detection: In Round 5, some lookers will have 10 and some 0, while non-lookers have 6.5. The lookers with 10 will be happy, but the ones with 0 will see they did worse.
     - What to do: Point out that the expected value for lookers was 5, while non-lookers got 6.5, and that over many such rounds, not looking is better.

  2. **Reverse-engineering the rounds**: Students might guess the pattern and in later rounds always not look (or always look) based on the round number.
     - Detection: If in Round 2 (dominant act) many students choose not to look, that might be because they think they are supposed to not look in even rounds or something.
     - What to do: Vary the order of rounds in future iterations or explicitly say the rounds are not in a particular order.

  3. **Suspicion of the instructor**: Students might think that if the information is free, there must be a catch, and
answer: |-
  ### Classroom Game: "The Information Dilemma"

  **Objective:** Illustrate Good's result (free information is non-harmful under specific conditions) and its limitations by having students experience scenarios where each condition is systematically violated.

  **Materials:**
  - Paper decision sheets (one per student per round)
  - Opaque envelopes for information (one per student per round; each contains a card with the true state)
  - Pens/pencils
  - Whiteboard for public scoreboard
  - Student scorecards (pre-printed tables to record decisions and points)

  **Physical Setup:**
  - Arrange desks in a circle to facilitate discussion.
  - Prepare 5 sets of envelopes (one set per round). Each envelope contains a card with the true state (e.g., "RED" or "BLUE") determined in advance by the instructor.
  - Distribute scorecards to students at the start.

  **Payoff Scheme:**
  - Points awarded each round (detailed per round below). Total points across 5 rounds determine ranking.
  - Conversion to stakes:  
    - 1st place: +1% on final grade  
    - 2nd/3rd place: +0.5% on final grade  
    - All others: Base participation credit  
    (Adjust for institutional policies; stakes are small to avoid distortion.)

  **Mechanism for Information Choice:**
  - At the start of each round, students **privately** decide whether to open their envelope ("look") or keep it sealed ("don't look").  
  - **Declines are private:** Students record "look" or "don't look" on decision sheets without revealing to peers.  
  - **No strategic declines:** Emphasize that choices are individual and not for misleading others.  
  - After deciding, students choose an act (options vary by round).  
  - Envelopes are collected after each round to prevent retrospective cheating.

  **Timing (Total: 60 minutes):**
  1. **Introduction (5 min):** Explain rules, scoring, and stakes. Do not mention theorem or round differences.  
  2. **Rounds 1–5 (7 min each):**  
     - 0–1 min: Distribute decision sheets and envelopes.  
     - 1–2 min: Students decide "look" or "don't look" and record.  
     - 2–3 min: Students choose an act based on information (if looked) or ignorance (if didn’t).  
     - 3–6 min: Collect sheets, reveal true state publicly, calculate points.  
     - 6–7 min: Students record points on scorecards; instructor updates public scoreboard (cumulative totals only).  
  3. **Debrief (15 min):** Guided discussion from scoreboard to theorem.

  ---

  ### Round Designs

  #### **Round 1: Baseline (All Conditions Hold)**  
  - **Scenario:** Urn with 10 red, 10 blue balls. Acts:  
    - A: Win 10 pts if red, 0 if blue  
    - B: Win 0 pts if red, 10 if blue  
    - C: Win 4 pts regardless  
  - **Information:** Free look at ball color.  
  - **Rationale:** Without info, risk-neutral students are indifferent between A/B (EU=5) and C (EU=4). With info, they pick A or B correctly (EU=10).  
  - **True State:** Fixed to **RED** for all.  
  - **Payoffs (for RED):**  
    - Look + choose A: 10 pts  
    - Don’t look + choose A: 10 pts  
    - Don’t look + choose B: 0 pts  
    - Choose C: 4 pts  
  - **Expected Outcome:** Lookers get 10; non-lookers who pick A get 10, others get ≤4. Info is strictly valuable (changes decision away from B/C).

  #### **Round 2: Dominant Act (Cannot Change Decision)**  
  - **Scenario:** Urn with 10 red, 10 blue balls. Acts:  
    - A: Win 10 pts regardless  
    - B: Win 0 pts regardless  
  - **Information:** Free look at ball color (irrelevant).  
  - **True State:** Fixed to **RED**.  
  - **Payoffs:**  
    - Choose A: 10 pts (always)  
    - Choose B: 0 pts (always)  
  - **Expected Outcome:** All students choose A and get 10 pts. Looking has no value (no decision change possible).

  #### **Round 3: Utility Disturbance (Breaks: Utility Undisturbed by Learning)**  
  - **Scenario:** Urn with 10 red, 10 blue balls. Acts:  
    - A: Win 10 pts if red, 0 if blue  
    - B: Win 0 pts if red, 10 if blue  
    - C: Win 5 pts regardless  
    **But:** Choosing to look costs 6 pts (disturbance).  
  - **True State:** Fixed to **RED**.  
  - **Payoffs (for RED):**  
    - Look + choose A: 10 - 6 = 4 pts  
    - Don’t look + choose A: 10 pts  
    - Don’t look + choose C: 5 pts  
  - **Rationale:** EU(look) = 4; EU(don’t look) = max(5, EU(A)=5) = 5. Not looking avoids cost.

  #### **Round 4: Non-Fixed Acts (Breaks: Fixed Set of Acts)**  
  - **Scenario:** Urn with 10 red, 10 blue balls.  
    - If **don’t look:** Only act available is C: Win 9 pts.  
    - If **look:** Acts A/B available:  
      - A: Win 8 pts if red, -8 if blue  
      - B: Win -8 pts if red, 8 if blue  
  - **True State:** Fixed to **BLUE**.  
  - **Payoffs (for BLUE):**  
    - Don’t look + choose C: 9 pts  
    - Look + choose A: -8 pts  
    - Look + choose B: 8 pts  
  - **Rationale:** Don’t look guarantees 9 pts. Look forces a risky choice (max EU=8 < 9).

  #### **Round 5: Ambiguity Aversion (Breaks: Expected Utility Maximization)**  
  - **Scenario:** Ellsberg-style urn (20 balls; unknown red/blue ratio).  
    - If **don’t look:** Only act available is C: Win 6.5 pts.  
    - If **look:** Must bet on color (no safe option):  
      - A: Win 10 pts if red, 0 if blue  
      - B: Win 0 pts if red, 10 if blue  
    **True Composition:** 10 red, 10 blue (revealed only to lookers).  
    **True State:** Fixed to **BLUE**.  
  - **Payoffs (for BLUE):**  
    - Don’t look + choose C: 6.5 pts  
    - Look + choose A: 0 pts  
    - Look + choose B: 10 pts  
  - **Rationale:** Ambiguity-averse students prefer safe 6.5 pts. Lookers face known risk (EU=5) but lose safe option. Non-lookers avoid ambiguity penalty.

  ---

  ### Debrief (15 min)  
  1. **Scoreboard Review (5 min):**  
     - Display cumulative scores. Ask: *"When did looking help? When did it hurt or do nothing?"*  
     - Highlight:  
       - Round 1: Lookers dominated.  
       - Round 2: Looking didn’t matter.  
       - Rounds 3–5: Non-lookers won.  
  2. **Pattern Identification (5 min):**  
     - *"Why did refusing information sometimes pay off?"*  
     - Guide students to articulate conditions:  
       - "When one act was always best anyway" (dominance).  
       - "When looking itself had a cost" (utility disturbance).  
       - "When looking changed which acts were available" (non-fixed acts).  
       - "When probabilities were ambiguous" (non-EU).  
  3. **Theorem Statement (5 min):**  
     - *"Based on this, when is free information valuable? When is it harmless? When can it backfire?"*  
     - Elicit: Info is never harmful if:  
       - You maximize EU.  
       - Acts are fixed.  
       - Learning doesn’t change your utility.  
       - You update by conditionalization.  
     - **Name the theorem:** "This is Good’s result. We broke all conditions except one—conditionalization—which needs a probability space to violate (we’ll discuss it now)."  
  4. **Covering Conditionalization (2 min):**  
     - *"We couldn’t simulate broken conditionalization with cards. But imagine if learning causes biased updating (e.g., ignoring evidence). Then, even free info could mislead you."*  
     - Example: A doctor misinterprets a test result due to overconfidence.

  ---

  ### Candid Notes  
  **Predictable Problems & Solutions:**  
  1. **Ambiguity-Neutral Students (Round 5):**  
     - *Detection:* Some lookers get 10 pts and brag.  
     - *Solution:* Stress expected value (lookers: 5 pts; non-lookers: 6.5 pts). Ask: *"Would you risk it again?"*  
  2. **Reverse-Engineering Rounds:**  
     - *Detection:* Students skip info in later rounds "to be safe."  
     - *Solution:* Vary round order in future runs; emphasize honesty.  
  3. **Suspicion of Instructor:**  
     - *Detection:* Students refuse info in Round 1, fearing traps.  
     - *Solution:* Reassure that scenarios are fair; use Round 1 to build trust.  
  4. **Scorekeeping Errors:**  
     - *Detection:* Point mismatches on scoreboard.  
     - *Solution:* Have students calculate points publicly during reveal.  
  5. **Mixed Stakes Buy-In:**  
     - *Detection:* Some ignore points; focus on theory.  
     - *Solution:* Award participation credit; use peer pressure via public scores.  

  **Design Shortcomings:**  
  - **Utility Function by Proxy:** Points impose a risk-neutral utility. Students refusing info may be responding to game incentives, not genuine risk attitudes.  
    - *Mitigation:* In debrief, clarify: *"The points forced linear utility. Real agents might have curved utility—but info’s value depends on your preferences."*  
  - **Conditionalization Unsimulated:**  
    - *Why:* Violating Bayesian updating requires probabilistic reasoning too complex for cards.  
    - *Coverage:* Discuss in debrief with medical/test example (see above).  

  **Minimal Version (8 Students):**  
  - Reduce to 4 rounds: Baseline, Dominant, Utility Disturbance, Ambiguity.  
  - Skip Non-Fixed Acts (Round 4) to save time.  
  - Use 1 urn composition for all rounds (simplifies setup).  

  **Instructor Script:**  
  - **Opening:** *"Today, you’ll make decisions with optional information. Your goal: maximize points. I won’t explain why rounds differ—discover that yourselves."*  
  - **Closing:** *"You experienced when information is valuable, neutral, or harmful. Next lecture: we formalize this as Good’s theorem."*  

  This design forces "premise surgery" through experiential learning, with scoreboard-driven debrief to generalize the theorem. Run it as a blind trial—students discover anomalies, not just hear them.
