  ## Physical Setup and Materials
  - **Materials**: 
    - Paper for decision sheets and scoreboards.
    - Envelopes or opaque cards for hiding information (e.g., colored index cards).
    - Pens/pencils.
    - A whiteboard for public scorekeeping (optional, but useful for transparency).

  - **Setup**:
    - Each round, students receive a decision sheet with the scenario and a choice to accept or decline information.
    - For information that can be revealed: use envelopes with hidden information (e.g., a card with a color) that the student can choose to look at or not.
    - The decision sheet also has a place for the student to record their choice (accept/decline) and their final decision (which act to take).

  ## Game Structure
  - **Rounds**:
    1. **Baseline**: Conditions hold → looking is beneficial.
    2. **Dominant Act**: Information cannot change the decision because one act dominates → looking has no value.
    3. **Utility Disturbance**: The utility function is disturbed by learning → information might hurt.
    4. **Non-fixed Acts**: The set of available acts changes after receiving information → information might be harmful.
    5. **Non-expected utility maximizer**: The agent does not maximize expected utility (e.g., ambiguity aversion) → information might be harmful.

  Note: The original conditions are:
     a. Expected utility maximization.
     b. Updates by conditionalization.
     c. Fixed set of available acts.
     d. Utility function not disturbed by learning.

