answer: |-
  Below is a complete facilitator guide for your 50-minute session. The activity is designed as a "Choice Reflection Exercise" to obscure the philosophical topic while creating visceral tension around blame and the ability to do otherwise. Participants make a low-stakes but personally relevant choice, record their intuitions, and then confront a rigged reveal that splits the class into three groups, each learning a different "backstory" about their choice. The debrief maps the experience to Frankfurt-style cases and the Principle of Alternative Possibilities (PAP), explicitly avoiding terms like "free will" until the end.

  ---

  ### **Facilitator Guide: Choice Reflection Exercise**  
  **Objective:** Make participants feel the tension between blame and the inability to do otherwise without announcing the philosophical context.  
  **Core Tension:** Whether blame persists when an agent couldn't have chosen differently, especially when the constraint is hidden or counterfactual.  

  ---

  ### **Materials Needed**  
  - **16 index cards** (one per participant)  
  - **Pens** (one per participant)  
  - **3 envelopes** (labeled **Group A**, **Group B**, **Group C**)  
  - **Whiteboard** (for group assignments and voting tally)  
  - **Timer** (for strict timekeeping)  
  - **Reveal scripts** (pre-written, sealed in envelopes; text provided below)  
  - **2 student volunteers** (to play "Event Coordinators" who rigged the setup)  

  ---

  ### **Key Roles**  
  - **Facilitator (You):** Guide the activity, ask questions, and manage timing.  
  - **Event Coordinators (2 student volunteers):** Briefed 5 minutes before class. They "rigged" the session by pre-selecting a default outcome but did not interfere with actual choices. They remain silent during the activity until the reveal.  

  ---

  ### **The Choice and Payoff**  
  **Choice:** Participants choose between two options for a brief, real reward:  
  - **Option 1:** "Silent Reflection" (2 minutes of quiet time to think about anything they want).  
  - **Option 2:** "Group Chat" (2 minutes to talk with one person about a non-academic topic).  

  **Why it works:**  
  - **Genuine stakes:** Students care about how they spend downtime. Introverts may prefer silence; extroverts may prefer chat. The reward is real (they get what they chose) but costs nothing.  
  - **No monetary incentives:** Avoids commodification, keeping focus on personal investment.  
  - **Easy to rig:** The "Event Coordinators" pre-select a default outcome (e.g., "Silent Reflection"), but this only activates if specific conditions are met (see reveal scripts).  

  ---

  ### **Timeline (50 Minutes Total)**  
  #### **Phase 1: Setup and Choice (10 minutes)**  
  **0:00–0:05 (5 min): Introduce the activity and choice.**  
    - **Script:** "Today, we’re doing a short exercise on decision outcomes. You’ll each make a real choice between two options for a 2-minute break at the end of this session. Option 1 is Silent Reflection—time to think quietly alone. Option 2 is Group Chat—time to talk with one person about anything non-academic. In a moment, you’ll write your choice on a card. Whatever the majority chooses, we’ll all do it together later. Two volunteers (the Event Coordinators) helped set this up earlier—they won’t be choosing. Pick the option you genuinely want."  
    - **Action:** Hand out index cards and pens. Ensure Event Coordinators are seated separately (they don’t participate).  

  **0:05–0:10 (5 min): Participants choose and record intuitions.**  
    - **Script:** "Write your name and choice (Option 1 or 2) on the card. [Collect cards.] Now, take a new card. Answer two questions based on the choice you just made:  
      1. **Could you have chosen differently?** (Yes/No, and one sentence explaining why.)  
      2. **Do you deserve credit or blame for your choice?** (Credit/Blame/Neither, and one sentence explaining why.)  
      Be honest—this is anonymous unless you volunteer to share later. No overthinking; go with your gut."  
    - **Action:** Collect cards immediately. Keep "choice" and "intuition" cards separate.  

  ---

  #### **Phase 2: Tally and Group Assignment (5 minutes)**  
  **0:10–0:15 (5 min): Tally votes and assign groups.**  
    - Tally votes on the whiteboard (e.g., "Option 1: 9 votes, Option 2: 7 votes. We’ll do Option 1 at the end.").  
    - Assign participants to three groups randomly (e.g., draw names from a hat). Write groups on the board:  
      - **Group A:** 5–6 students  
      - **Group B:** 5–6 students  
      - **Group C:** 5–6 students  
    - **Script:** "We’re splitting into three groups to discuss how choices play out in different contexts. Move to your group area now."  

  ---

  #### **Phase 3: The Reveal and Group Discussion (15 minutes)**  
  **0:15–0:18 (3 min): Distribute reveal envelopes.**  
    - Hand each group their sealed envelope (Group A, B, or C).  
    - **Script:** "Your envelope contains new information about how this activity was set up. Read it carefully—it may affect how you view your choice."  

  **0:18–0:23 (5 min): Groups read and discuss.**  
    - **Script:** "Discuss two questions in your group:  
      1. Does this change whether you could have chosen otherwise?  
      2. Does this change whether you deserve credit or blame?  
      Prepare a 1-minute summary for the class."  
    - **Action:** Set a timer. Circulate to ensure groups stay on task.  

  **0:23–0:30 (7 min): Group summaries.**  
    - Each group shares their summary (strictly 1 minute per group).  
    - **Facilitator Note:** Do not react or clarify. Note disagreements within/between groups.  

  #### **Reveal Scripts (Exact Wording)**  
  - **Critical:** Use the winning option (e.g., "Option 1") in all scripts. Below assumes Option 1 won. Replace "Option 1" with the actual winner.  
  - **Group A (Could not have done otherwise):**  
    > "The Event Coordinators set a rule: If the majority had chosen Option 2, they would have overridden the vote and implemented Option 1 instead. Since the majority chose Option 1, no override was needed. This means: No matter what you chose individually, the outcome would always have been Option 1. You could not have changed the outcome."  

  - **Group B (Could have done otherwise—backup unused):**  
    > "The Event Coordinators set a rule: If the majority had chosen Option 2, they would have overridden the vote and implemented Option 1. However, the majority chose Option 1, so the override was not used. Your choice was free, and the outcome was determined solely by the vote."  

  - **Group C (Could have done otherwise—no backup):**  
    > "The Event Coordinators set no rules. The outcome was determined solely by the vote, with no possibility of override. Your choice was free, and you could have changed the outcome if enough others agreed."  

  ---

  #### **Phase 4: Facilitator-Led Debrief (15 minutes)**  
  **0:30–0:40 (10 min): Map the activity to philosophy.**  
    - **Script:** "We’ve been exploring a core problem in responsibility: whether you must be able to do otherwise to deserve blame or credit. Let’s connect your experience to the concepts:  
      - **Group A** experienced a *counterfactual intervener*: You couldn’t have changed the outcome, but the constraint didn’t affect your actual choice. This mirrors **Frankfurt-style cases**—philosophers like Harry Frankfurt argue blame can survive if the agent *would* have chosen the same way freely (even if they couldn’t do otherwise).  
      - **Group B** had a *backup that didn’t activate*. This tests whether the *mere possibility* of intervention matters. Some argue it doesn’t—credit/blame depends only on what *actually* happened.  
      - **Group C** had no constraints, raising the standard view: **PAP (Principle of Alternative Possibilities)** holds that blame requires the ability to do otherwise.  
      The tension you felt—e.g., Group A members debating if blame is ‘cancelled’—comes from divorcing *actual choice* from *alternative possibilities*. This is the heart of the **compatibilism/incompatibilism** debate: Can responsibility coexist with determinism (where prior causes ‘rig’ all choices)?"  

    - **Whiteboard Notes:**  
      - Actual Sequence (What happened) vs. Counterfactual Sequence (What could have happened).  
      - Blame Survival: When the agent *would* have chosen the same without constraints.  
      - Key Distinction: *Unable to do otherwise* vs. *unable for relevant reasons* (e.g., coercion vs. hidden rigging).  

  **0:40–0:42 (2 min): Address limitations candidly.**  
    - **Script:** "This activity simplifies the problem. It uses *local* rigging (human manipulators) to simulate determinism. But real determinism is *global*—no ‘Event Coordinators,’ just laws of nature. This activity can’t replicate the impersonal, universal pressure of determinism. I’ll clarify this in our full seminar."  

  **0:42–0:45 (3 min): Return initial intuition cards.**  
    - Hand back cards from Phase 1.  
    - **Script:** "Compare your initial answers to what you feel now. Did the reveal change your view? Keep this in mind for the closing reflection."  

  ---

  #### **Phase 5: Written Evidence and Reward (5 minutes)**  
  **0:45–0:47 (2 min): Conduct the winning activity.**  
    - Lead Option 1 (Silent Reflection) or Option 2 (Group Chat) as promised.  

  **0:47–0:50 (3 min): Administer written questions.**  
    - Hand out index cards.  
    - **Script:** "Answer these anonymously—I’ll use them to improve future sessions. Take 2 minutes."  
    - **Questions:**  
      1. "In Group A’s scenario (where the outcome was fixed), do you think someone deserves blame/credit for choosing what they did? Why or why not?"  
      2. "Does *deserving blame* require that you *could have chosen differently*? Yes/No, and one sentence explaining."  
      3. "Did this activity make you doubt your initial view about blame? Yes/No, and one sentence explaining."  

  ---

  ### **Predictions of What Could Go Wrong**  
  1. **Participants outguessing the setup:**  
     - *Risk:* Students choose "against preference" to "beat the system."  
     - *Mitigation:* Emphasize genuine preference in Phase 1 ("pick what you want"). The rigging is tied to the *majority*, so individual defiance doesn’t affect the reveal.  

  2. **Flat reveal or convergent verdicts:**  
     - *Risk:* Groups A/B/C all agree blame is impossible in Group A, killing tension.  
     - *Mitigation:* Use the precise reveal scripts—ambiguous phrasing (e.g., "they might have intervened") weakens intuitions. In debrief, highlight minority reports: "Some in Group A still blamed themselves—why?"  

  3. **Resentment or feelings of manipulation:**  
     - *Risk:* Students dislike deception or being observed.  
     - *Mitigation:* Debrief transparently ("This tested intuitions, not you"). Anonymity in written phases reduces discomfort.  

  4. **Time shortages:**  
     - *Risk:* Group discussions run long, cutting into debrief.  
     - *Mitigation:* Use a visible timer. Prioritize debrief questions if behind.  

  ---

  ### **Written Evidence Questions and Failure Indicators**  
  **Questions for the Final 3 Minutes:**  
  1. "In Group A’s scenario (where the outcome was fixed), do you think someone deserves blame/credit for choosing what they did? Why or why not?"  
  2. "Does *deserving blame* require that you *could have chosen differently*? Yes/No, and one sentence explaining."  
  3. "Did this activity make you doubt your initial view about blame? Yes/No, and one sentence explaining."  

  **What Success Looks Like:**  
  - **Tension in Q1:** Mixed responses (e.g., 60% "No, they couldn’t change it" vs. 40% "Yes, they chose freely").  
  - **Doubt in Q3:** At least 40% report doubt (e.g., "I said yes to blame at first, but now I’m unsure").  

  **Failure Indicators:**  
  - **Consensus in Q1:** >80% give the same answer (e.g., all "no" for Group A).  
  - **No doubt in Q3:** >80% say "no" to doubting their view.  
  - **Superficial Q2 answers:** Responses like "it depends" without engagement.  

  ---

  ### **Facilitator Cheat Sheet: Philosophical Mapping**  
  - **What the activity reproduces:**  
    - Frankfurt-style cases (Group A): Blame persists despite inability to do otherwise.  
    - Actual vs. counterfactual sequences (Group B): Backup presence vs. actual influence.  
    - PAP intuition (Group C): Blame requires alternative possibilities.  
  - **What it only gestures at:**  
    - Determinism’s *global* nature (the activity implies a manipulator, not blind causation).  
    - Moral responsibility "in the wild" (the choice is low-stakes; real blame involves harm).  
  - **What you must supply in debrief:**  
    - The gap between *local rigging* (Event Coordinators) and *determinism* (no rigger, just cause-and-effect). Clarify: "Determinism isn’t a trick—it’s the idea that given the past and laws of nature, only one future is possible."  

  This activity primes students to *feel* the PAP problem before labeling it. By the debrief, they’ll grasp why compatibilists defend blame in deterministic worlds—and why it remains contentious. Run it as-is, and use the written responses to refine for future seminars.
