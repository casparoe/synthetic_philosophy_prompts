answer: |-
  ## A Modest Proposal for Temporal Resource Allocation

  As Chief Economist of the Bureau of Intertemporal Resource Allocation (BIRA), I have recently been delegated the vital task of optimizing resource flows across the centuries, specifically concerning the disposition of burdens and benefits affecting the twenty-third century. This delegation is not merely an administrative formality; it is a necessary step towards achieving allocative efficiency over truly strategic timeframes. I propose a mechanism that is both operationally straightforward and economically sound: the establishment of a forward market for temporal claims, culminating in an auction of decades.

  Our guiding principle is the unimpeachable logic of the fundamental discounting equation. While projected growth rates provide some adjustment, the core component – the pure rate of time preference – becomes increasingly dominant as we project further into a future where perpetual exponential growth becomes, frankly, implausible. To ignore this is to court significant inefficiency. Market evidence clearly demonstrates society’s inherent impatience; observed returns on capital reveal a robust preference for the present. It is both prudent and efficient to calibrate our social discount rate to this revealed preference. Indeed, foundational work in temporal consistency demonstrates that any coherent, continuous ranking of infinite utility streams *must* incorporate a degree of pure time preference. To do otherwise violates basic axioms of rational choice. Attempts to construct rankings without it lead directly to paralyzing indecision – a simple matter of divergent series rendering the entire calculus inoperative, a mere bookkeeping nuisance we cannot afford.

  Therefore, recognizing the twenty-third century as a significant, yet distant, reservoir of potential utility, we propose its formal securitization. Claims on the well-being, resources, and productive capacity of citizens born after 2200 will be bundled into standardized instruments: Temporal Obligation Securities (TOS). These TOS will represent fractional, transferable claims on the aggregate consumption potential of designated future decades. The initial allocation will be determined through a competitive auction process, open to qualified present-day investors and sovereign wealth funds.

  This mechanism offers profound advantages. It efficiently transfers resources from those who demonstrably value them most highly (the present) to fund essential long-term projects – climate adaptation reserves, asteroid deflection infrastructure, or foundational AI alignment research – whose benefits accrue largely to the future. The auction price will reveal the true, market-clearing social discount rate for those distant horizons far more accurately than any committee deliberation. Concerns about uncertainty are understandable but manageable. While theoretical work suggests deep uncertainty about the *correct* discount rate itself might drive the certainty-equivalent rate implausibly low over ultra-long horizons – potentially undermining auction viability – BIRA has developed an elegant solution. We will institute a system of Mandatory Purchase Obligations (MPOs) for pension funds and certain long-horizon institutions, ensuring robust baseline demand and price stability. This stabilizes the market, preventing the impractical scenario where centuries are effectively priced near zero simply because a few theorists entertain such rates.

  Furthermore, we acknowledge the well-documented phenomenon of present bias – the tendency for individuals to apply hyperbolic-like discounting over short horizons. While this creates time inconsistency problems for naive planners, we view it pragmatically. The short-term volatility it introduces creates arbitrage opportunities within the TOS market structure itself. Sophisticated actors can profitably act as intermediaries, smoothing flows and extracting value from this predictable irrationality, effectively turning a behavioral quirk into a source of market liquidity and, incidentally, government revenue through transaction fees. It’s a win-win.

  Some may raise ethical qualms, invoking arguments that mere position in time lacks intrinsic moral weight, or that discounting the future simply reflects a failure of imagination rather than a legitimate preference. Others might declare a zero pure rate ethically imperative. These perspectives, while philosophically quaint, are administratively impractical. They fail the test of operational coherence. Our system respects the sovereignty of current preferences as revealed through market mechanisms. To impose an alternative ethical framework would be economically inefficient and disrespectful of the valuations expressed by living individuals whose welfare we are duty-bound to maximize. The argument that we owe the distant future equal consideration to the present, regardless of temporal distance, leads only to the aforementioned calculative paralysis. We cannot build policy on such foundations.

  Finally, we must address the residual risk inherent in any long-term projection. Catastrophic events, unforeseen technological disruptions, or simply the variance inherent in century-long forecasts create potential liabilities not fully captured in the initial TOS pricing. Prudent risk management demands we address this. Therefore, BIRA will retain a contingent claim – a super-senior lien, if you will – on the aggregate output of the twenty-third century itself. Should realized outcomes fall significantly short of the projections underpinning the TOS valuations, a modest, automatically triggered adjustment mechanism will transfer a corresponding percentage of future output to the holders of the initial securities, ensuring the integrity of the market and protecting present investors. This places the burden of truly unforeseeable shortfalls precisely where it belongs: on the shoulders of those who will inhabit that future, as they will be best positioned to adapt and innovate in response. They inherit the world; inheriting a calibrated, market-efficient obligation to rectify our unavoidable forecasting errors is only just and efficient. After all, they will benefit from the infrastructure and stability our prudent allocation today secures. This mechanism finalizes the circle, ensuring the twenty-third century is not merely disposed of, but optimally integrated into the grand intertemporal marketplace we are duty-bound to cultivate. It is, I trust you will agree, a model of administrative reasonableness.
