  4. **Knowing q:** Could \(q\) (from Node 2) be known by *anyone* (even an ideal inquirer), without contradiction?  
     - **Yes → Node 5**  
     - **No → Leaf E**  

  5. **Factivity:** If someone knows "it is not known that \(p\)" (where \(p\) is the blades-of-grass truth), must "it is not known that \(p\)" be true?  
     - **Yes → Node 6**  
     - **No → Leaf F**  

  6. **Distribution:** If someone knows a conjunction (e.g., "\(p\) and it is not known that \(p\)"), must they know each conjunct individually?  
     - **Yes → Node 7**  
     - **No → Leaf G**  

  7. **Knowing r:** If you open the envelope (Node 3) and read its sentence, do you then know what is written?  
     - **Yes → Leaf H**  
     - **No → Leaf I**  

