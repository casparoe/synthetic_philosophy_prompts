     - **No → Leaf A**  

  1. **"Knowability" modality:** Should the claim "every truth is possibly known" mean possibility for *humans as we are* (with our limitations), not just ideal or metaphysical possibility?  
     - **Yes → Leaf B**  
     - **No → Node 2**  

  2. **Truth of q:** Let \(p\) = "There were exactly 1,234,567 blades of grass on Gettysburg's lawn at noon on July 3, 1863" (unknown to anyone). Is the proposition \(q = p \land \text{it is not known that } p\) true?  
     - **Yes → Node 3**  
     - **No → Leaf C**  

  3. **Truth of r:** A sealed envelope contains the sentence: "No one knows what is written on this card." Assuming no one has ever known its content, is this sentence true?  
