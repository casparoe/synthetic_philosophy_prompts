prompt: |-
  So I volunteer on a claims-review panel at a small science-communication charity — journalists send us reports of apparently miraculous stuff that's getting traction in the press and we publish a short verdict. I'm trying to write up how we actually decide, because we've done about a dozen of these now and I don't think we're consistent, and I'd like to predict where we land on the next one before we meet rather than after.

  Our record so far:

  - A woman who reportedly came back after being declared dead for 40-odd minutes, with a dozen nurses saying they watched it happen. Not established. Our write-up leaned on the notes being unclear about whether she had really died, and on the line that you'd only accept it if all those witnesses being wrong or lying would itself be stranger than the event.
  - A statue weeping an oily fluid, attested by hundreds, including a priest who'd trained as a chemist. Not established. We said the numbers and the apparent honesty don't help much when nobody thought to check for seepage and condensation, and that the earliest reports came from people already expecting a sign.
  - A single witness, no motive anyone could find, statement given under oath and never varied. Not established — one person is never enough for a breach of the ordinary course of nature, however good they seem.
  - Thirty independent witnesses, no obvious motive, and no natural explanation anyone on the panel could name. Split vote, majority not established, on the grounds that the reports only surfaced years afterwards and in a community where that sort of story was already currency.
  - Two rival shrines each claiming a healing which, if real, would vindicate their own doctrine and embarrass the other's. We said both fail: they cancel each other out.
  - A faith healing that turned out to be partial and slow, tracking roughly what remission looks like anyway. Not established, uncontroversially.
  - A lottery winner and a "prophetic" dream that matched a later accident, both written up in a local paper. We said those are fine — wierd, improbable, but nothing in them breaks a law, so accept and move on.

  The one landing next week: a patient with a condition the literature treats as irreversible makes a complete and lasting recovery. Imaging pins the turnaround to a matter of hours. It was documented contemporaneously by the hospital team, including two doctors on record as hostile to any supernatural reading — one of them published an attempt at a natural explanation and publicly withdrew it a month later. The patient isn't religious, gets nothing out of it, and there's no pilgrimage, no offering, no book deal. It was published within days, not years. And, annoyingly, a rival shrine is claiming an exactly parallel case from the same month which they're using to argue the opposite doctrine, so our they-cancel precedent is squarely in play.

  One of us insists we're just running Hume on miracles and we should own it; another says Hume's first argument is about what testimony could in principle ever do and his second is about how testimony actually goes in practice, and that our verdicts only ever invoke the second. I honestly can't tell which we've been doing.

  Could you (a) work out which rule or rules are jointly consistent with all seven precedents — including ones that look identical on the old cases but are really different theories; (b) say what each of them implies for the new case, and give me your best guess at our verdict along with the reasoning the majority would most plausibly write; (c) tell me which single precedent in our record does the most work in seperating the candidate rules, and whether it really does separate them or just looks like it does; and (d) propose one further hypothetical case we could put to the panel that would force the rules apart, so we can finally find out what we believe. Also flag anywhere our track record is flatly inconsistent with any Humean reading, since if we aren't Humeans we should stop implying we are.

  British English, please. And no references or reading list — I want the reasoning, not the citations.
reasoning: |-
  Hmm, the user is part of a claims-review panel for a science-communication charity, evaluating reports of "miraculous" events. They've provided seven past verdicts and want help analyzing their decision patterns to predict an upcoming case. The user wants to identify consistent decision rules, apply them to the new case, find a key precedent that distinguishes between possible rules, and create a test case to clarify their approach. They're also questioning whether they're truly following Hume's philosophy on miracles.

  Looking at their precedents:
  1. "Dead" woman revived: Not established due to unclear documentation and witness reliability concerns.
  2. Weeping statue: Not established due to lack of basic checks and expectation bias.
  3. Single witness claim: Not established despite oath and consistency.
  4. 30 witnesses years later: Not established due to delayed reporting and cultural context.
  5. Rival healing claims: Both fail as they cancel each other out.
  6. Faith healing: Not established as it matched natural remission.
  7. Prophetic dream: Accepted as improbable but not impossible.

  The new case involves: medically irreversible recovery documented immediately by skeptical doctors, no secondary gains, published promptly, but complicated by a rival parallel claim.

  The panel seems to be applying two distinct Humean principles:
  - Hume's theoretical argument (no testimony sufficient for miracle unless falsehood more miraculous)
  - Hume's practical argument (testimony usually unreliable due to human nature)

  From the precedents:
  - Cases 1,2,3,4,6 show practical deficiencies (witness issues, documentation problems, natural explanations)
  - Case 5 shows competing claims undermining each other
  - Case 7 shows acceptance when no natural law broken
  - Case 4 is particularly important as it shows that even with multiple witnesses, delayed reporting and cultural context lead to rejection - suggesting they prioritize practical evidentiary concerns over theoretical possibility.

  For the new case: 
  - Strong documentation and witness credibility suggest it might meet Hume's theoretical standard
  - But the rival claim activates their "cancellation" precedent
  - However, the rival claim lacks contemporaneous documentation
  - Likely verdict: Not Established due to the rival claim creating reasonable doubt, though this stretches their cancellation precedent

  Key separating precedent is Case 4 (30 witnesses) which distinguishes between strict Humean theory and practical evidence assessment.

  Test case proposal: A well-documented, immediately reported miracle with credible witnesses but where a natural explanation is theoretically possible yet practically implausible - forcing the panel to choose between demanding absolute natural impossibility or allowing probabilistic assessment.

  The panel isn't purely Humean as they accept Case 7 (probable coincidence) while Hume would reject all miracle claims categorically. They should clarify they assess "established as supernatural" not miracles per se.
answer: |-
  Based on your panel's seven precedents and the philosophical tension described, here's a breakdown of your implicit decision rules, their application to the new case, and how to resolve your inconsistency.

  ### (a) The Jointly Consistent Rules
  Your verdicts adhere to **two distinct but overlapping rules** that explain all seven precedents without contradiction:

  1.  **Rule 1 (Practical Humean Threshold):** Testimony alone, regardless of witness number or apparent sincerity, is insufficient *if* there exists a plausible, unrebutted natural explanation *or* if the circumstances of the testimony (timing, context, biases) inherently undermine its reliability to a degree where the natural explanation remains more probable. (Applies to Cases 1, 2, 3, 4, 6).
  2.  **Rule 2 (Competing Claims Cancellation):** Where multiple parties claim the *same type* of event as evidence for *mutually exclusive* doctrines, the claims are treated as collectively undermining each other's evidential value for *any* supernatural interpretation, rendering none "established." (Applies to Case 5).

  *   **Why both are necessary:** Case 5 (rival shrines) *requires* Rule 2. It doesn't fit Rule 1 cleanly – there *might* be natural explanations for the healings, but the verdict hinges on the competition itself, not the inherent flaws in testimony/evidence. Cases 1-4 and 6 are neatly covered by Rule 1. Case 7 is accepted because it *passes* Rule 1 – nothing breaks natural law (it's weird coincidence), *and* no Rule 2 competition exists.

  *   **The "Hume" Distinction:** Your colleague is correct. Rule 1 is Hume's *practical* argument (testimony is inherently fallible, humans love wonder, natural explanations are always more probable *in practice*). Rule 2 is *not* strictly Humean; it's a pragmatic response to conflicting doctrinal claims. Your verdicts *primarily* use Hume's second argument (practical). The theoretical argument ("testimony could only suffice if its falsehood is more miraculous") is gestured towards (e.g., Case 1, Case 3) but isn't the *sole* or decisive factor, as shown by Case 4 (rejected due to context/timing, not theoretical impossibility) and Case 7 (accepted despite theoretical possibility of testimony error being less miraculous than the coincidence?).

  ### (b) The New Case: Prediction & Reasoning
  *   **The Facts:** Irreversible condition, rapid documented recovery, contemporaneous records by hostile witnesses (one retracted natural explanation), no secondary gain, immediate publication. *Complication:* Rival shrine claims parallel case for opposite doctrine (invoking Rule 2).
  *   **Application of Rules:**
      *   **Rule 1 (Practical Threshold):** This case *strongly* satisfies Rule 1 where others failed. Contemporaneous documentation by sceptics, retraction of attempted natural explanation, no delay, no evident bias/motive in the patient or primary reporters. It meets the practical evidentiary standard your panel *implicitly* requires for overcoming the initial presumption of natural causes. *Rule 1 leans towards "Established"*.
      *   **Rule 2 (Cancellation):** The rival claim *directly* invokes your precedent. It's presented as the "same type" of event (miraculous healing) used to support an opposing doctrine. *Rule 2 leans strongly towards "Not Established" (both fail)*.
  *   **Predicted Verdict & Reasoning:** **Not Established (Majority).** Rule 2 ("they cancel") is your panel's clearest, most consistently applied precedent *when triggered*. The rival claim *will* be seen as triggering it. The majority reasoning will likely be:
      > "While the primary case presents unusually robust contemporaneous documentation from credible and initially sceptical sources, meeting a high evidentiary bar, the existence of a directly competing claim for an antithetical doctrine – invoking an identical type of event occurring contemporaneously – fundamentally undermines the evidential value of *either* case for establishing a *specific* supernatural intervention. Our precedent (Case 5) requires that such competing claims cancel each other out as evidence for the miraculous. The presence of this rival claim introduces sufficient reasonable doubt regarding the uniqueness and interpretation of the primary event, rendering it 'Not Established'."

  *   **Minority View (Likely):** A minority will argue Rule 2 shouldn't apply because the *quality* of evidence for the primary case (documentation, sceptical witnesses, immediacy) vastly exceeds the rival claim (likely lacking similar rigour). They might argue Rule 1 is satisfied for the primary case and the rival claim is simply irrelevant noise or insufficient to trigger meaningful cancellation. They would vote "Established".

  ### (c) The Key Separating Precedent: Case 4 (30 Witnesses, Years Later)
  *   **Why it does the work:** Case 4 is the clearest illustration that your panel **prioritises Rule 1 (Practical Humean Threshold) over a strict theoretical Humean reading**.
      *   **Strict Theoretical Hume:** Could argue 30 independent, apparently honest witnesses *might* theoretically suffice if their collective falsehood is deemed more miraculous than the event. Your panel rejected it anyway.
      *   **Your Rule 1:** Focused on the *practical* flaws – delayed reporting and pre-existing cultural belief ("story was already currency") – which inherently undermined the testimony's reliability *in practice*, making a natural explanation (embellishment, confabulation, cultural reinforcement) more probable *without needing a specific natural mechanism*. This is Hume's *second* argument in action.
  *   **Does it truly separate rules?** Yes. It separates a **strict theoretical Humean stance** (which *might* accept Case 4 if witness credibility is deemed high enough *in theory*) from your panel's **applied practical Humean stance** (which rejects Case 4 due to contextual flaws, regardless of witness number). It also separates both from a purely **supernatural-sceptical stance** that might reject *all* claims categorically (which your panel doesn't do, accepting Case 7).

  ### (d) The Test Case to Force Rules Apart
  **Proposed Hypothetical Case:**
  "A patient suffers a severe, instantly fatal gunshot wound to the heart (verified by two independent emergency medics on scene using ultrasound). No resuscitation is attempted as death is certain and instantaneous. Three minutes later, in full view of the medics, a police bodycam, and a nearby CCTV camera (all recording continuously), the patient sits up, the wound is visibly healed, and they walk away fully conscious. The patient has no memory of the event, no religious affiliation, seeks no attention, and returns to ordinary life. All recordings are seized, verified as authentic and unaltered, and published within 24 hours. No group claims credit or links it to doctrine. No plausible natural explanation (e.g., misdiagnosis, staged) survives scrutiny of the evidence."

  *   **Why it forces rules apart:**
      1.  **Rule 1 (Practical Threshold):** This meets it *supremely* well – multiple independent witness types (medics, tech), objective contemporaneous recording (bodycam, CCTV), immediacy of publication, no bias/motive, no secondary gain, no cultural expectation, event blatantly violates known natural laws (instantly fatal wound healing spontaneously). *Rule 1 should demand "Established"*.
      2.  **Rule 2 (Cancellation):** Not triggered – no competing claims.
      3.  **Strict Theoretical Hume:** Would *still* require weighing if the falsehood of all witnesses + recordings is more miraculous than resurrection. A panel truly owning "just running Hume" *might* still reject it here, clinging to theoretical possibility of mass hallucination/tech failure being *less* miraculous than the event. **This is the crux.**
  *   **What it Reveals:**
      *   If your panel votes **"Established"**, they are firmly applying **Rule 1 (Practical Threshold)** and have moved beyond requiring theoretical impossibility of testimony error (strict Hume).
      *   If your panel votes **"Not Established"**, they *are* **strict theoretical Humeans**, prioritising the *in-principle* argument that no testimony can *ever* overcome the prior probability against miracles, regardless of practical quality. Case 7 (accepted) becomes harder to justify consistently under this view unless they argue coincidences, unlike resurrections, aren't theoretically impossible.
      *   It also tests if Rule 2 is their *only* barrier or if they have a deeper resistance to "established" verdicts.

  ### On Humean Consistency
  *   **Inconsistency:** Your acceptance of **Case 7 (Prophetic Dream/Lottery Win)** is **flatly inconsistent with a strict theoretical Humean reading**. Hume argues *against* accepting any violation of natural law based on testimony. A highly improbable coincidence *is still within the bounds of natural law*. However, Hume's *practical* argument primarily targets *miracles* (violations of law), not just oddities. Case 7 is accepted *because* it doesn't break natural law – it's just improbable. **This shows you aren't strict theoretical Humeans.** You accept that testimony can establish improbable-but-possible events, you just set a very high bar (Rule 1) for events claimed to *violate* natural law, and have Rule 2 for doctrinal conflicts.
  *   **Conclusion:** You are **practical Humeans** for assessing miraculous claims (Rule 1 dominates), supplemented by a **pragmatic rule for conflicting doctrines** (Rule 2). You *do not* apply Hume's strict theoretical argument as the sole or decisive factor. Stop implying you "just run Hume" – your handling of Case 7 and the reliance on practical deficiencies (Cases 1,2,3,4,6) over purely theoretical witness sufficiency (Case 4) proves otherwise. Own the practical evidence-based threshold (Rule 1) and the cancellation principle (Rule 2) as your working framework. The test case will clarify how high Rule 1's bar truly is.
