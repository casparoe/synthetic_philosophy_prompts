prompt: |-
  So I've been going around in circles on the "is the brain a computer" fight and I've come to suspect the two camps aren't even having the same argument. On one side you've got people who say computation is just any physical process with state transitions, which makes "the brain computes" trivially true and therefore empty; on the other side people who insist a genuine computation needs the right functional/causal organization plus content, and that brains have it and thermostats don't. My hypothesis is that most of the stalemate is really a disagreement about whether "computes" is an observer-relative property or a mind-independent one, and that once you pin that down whats left is a much narrower question: whether the decompositions cognitive science actually works with are computational or are just wearing the vocabulary. Is that diagnosis right, or am I relabelling a substantive dispute as a verbal one? I'd like you to lay out what each side is actually committed to, say whether Putnam's everything-implements-everything result and Searle's room are even aimed at the same target, and tell me what would count as progress here -- a distinction, a theorem, or a change of subject. And where does a system like the one answering this land: fresh evidence, or the same arguments running on new hardware? Please write it in American English.
reasoning: |-
