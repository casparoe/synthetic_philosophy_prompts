prompt: |-
  I'm running a 75-minute session for incoming first-years at a pretty selective uni — small group, about 18 of them, part of the orientation "big questions" programme. Everyone in the room has been told their whole life they got here on merit, and a good third are the first in their family to go to university, so this isn't a neutral topic and I'm not going to win it by being clever at them.

  The idea I want them to leave with is narrow: that *deserving* a reward and *being entitled to* a reward under some set of rules are two different claims, and that arguments about meritocracy slide between them without noticing. I'm not trying to convert anybody to egalitarianism. I want them to be able to hear the difference when someone else makes the slide.

  You've taught this to undergrads many times and you know exactly where they break — act as that person and plan my session. Don't explain the distinction to me, I've got it. Tell me how to sequence it.

  - What has to be in place before the desert/entitlement distinction can even be stated? My instinct is they need some shared idea of "a practice whose rules create expectations" first, but I don't know how to get there in ten minutes without it turning into a sociology lecture.
  - The carrying example. I was going to use a firm that hands a year-end bonus to whoever worked hardest, and then it emerges that the person who worked hardest is also the one whose temperament and home life made working hard possible for them at all — so the rule and the desert claim come apart. Is that a good vehicle? What does the example have to have and what must be kept out of it? My worry is that it collapses into "effort is also luck," which is a different and much harder claim than the one I'm actually after.
  - The misconceptions, in the order they'll arrive. I can predict "so nobody deserves anything and it's all arbitrary" and "you're saying this because you resent people who earn more." What else should I expect from this particular audience, at what point in the sequence do I head each one off, and which ones do I deliberately let sit?
  - The effort objection is the one I'm scared of: someone will say desert can be grounded in effort alone and effort isn't a talent. Do I concede that it's a live position and move on, or does conceding it blow up the rest of the hour?
  - One question I can ask in the last five minutes that tells me whether the distinction landed rather than whether they're being agreeable to me.

  I also want to say out loud what I'm *not* covering: I'm leaving out luck egalitarianism, the Rawls-versus-Nozick feud, and anything about how much inequality is actually justified. Tell me whether that's a mistake at this level or whether just flagging the ommissions is enough.

  Think this through carefully before answering — work out the dependency structure first, what genuinely requires what, and only then write. Lead with one sentence giving the spine of the session, then the plan. Hard cap of 650 words. No readings, no citations, no further-anything — I need the plan itself.
reasoning: |-
  Okay, the user is preparing a 75-minute session for incoming first-year students at a selective university. They want to teach the distinction between deserving a reward and being entitled to it under certain rules, without conflating the two. The audience includes many first-generation students, so the topic is sensitive. I need to create a session plan that sequences the concepts effectively, addresses misconceptions, and uses a good example.

  First, the user wants to know what foundational concept is needed before introducing the desert/entitlement distinction. They mentioned a shared idea of "a practice with rules that create expectations." How can I establish that quickly? Starting with a simple, relatable example makes sense. Using a game or competition with clear rules could work—like a footrace where the winner gets a prize. This is concrete and avoids sociology jargon. In the first 10 minutes, I can have students discuss why the winner deserves the prize, then introduce the rule: the first to cross the line wins. Highlighting that the rule creates an entitlement, but desert might involve more, like effort or fairness.

  Next, the carrying example. The user proposed a bonus for the hardest worker, but worries it might lead to "effort is luck" debate. I need to tweak this. Instead, use a scenario where the rule is clear—say, a bonus based on hours worked. Then reveal that one employee worked more hours because of advantageous circumstances (like a supportive home life). This separates entitlement (met the hours) from desert (was it fair?). The key is to focus on the rule vs. broader desert claims, not effort's nature. Avoid discussing luck here to stay on track.

  Misconceptions are crucial. The user anticipates "so nobody deserves anything" or accusations of resentment. I should address these preemptively. After introducing the distinction, explicitly state that entitlement is valid under the rules, but desert is a separate question. Emphasize that rules are necessary but debatable. For the effort objection, concede that effort-based desert is a valid position but separate from entitlement. Don't dive into it; note that the session's goal is to distinguish the concepts, not resolve desert's basis.

  The closing question needs to check understanding without bias. Ask them to explain the difference in their own words using the examples discussed. Avoid asking for agreement; focus on comprehension.

  The user isn't covering luck egalitarianism or Rawls vs. Nozick. That's fine. Flagging the omissions is sufficient at this level. Introducing those would complicate the session. Keep it focused.

  Now, structuring the session: Start with grounding (10 mins) using a race example. Then introduce the distinction (15 mins). Move to the bonus scenario (20 mins) for application. Address misconceptions proactively (10 mins). Summarize and use the closing question (5 mins). Reserve time for Q&A.

  Potential pitfalls: Students might conflate entitlement with desert. Using clear, relatable examples helps. The effort objection could derail, so acknowledge it but steer back to the distinction. First-gen students might feel targeted; emphasize that the critique is about systems, not individual merit.

  Overall, the spine is: Establish rules-based practices → Distinguish entitlement/desert → Apply with example → Preempt misconceptions → Check understanding. Keep each segment tight, engage with quick discussions, and stay focused on the narrow goal.
answer: |-
  **Session Spine:** Anchor the distinction in concrete rule-governed practices before introducing "desert," then use a controlled scenario to force separation, preemptively defuse key misconceptions, and end with a comprehension check.

  **Plan (75 min):**

  1.  **Grounding: Rules Create Entitlements (10 min):**
      *   **Quick Pair-Share (3 min):** "Think of a simple competition or game with a prize (e.g., footrace, chess match). What's the **rule** for winning? What does winning get you?" (Goal: Surface concrete examples of rules -> outcomes).
      *   **Group Synthesis (7 min):** List examples. Emphasize: "Under **these specific rules**, the winner is **entitled** to the prize. The rule creates the entitlement. Full stop." Avoid "deserve." Establish: Rules define who gets what *within the practice*. Flag: "We're talking about how rules *work* here, not if they're fair."

  2.  **Introducing "Desert": The Distinction (15 min):**
      *   **Prompt (5 min):** "Take the footrace. The winner is *entitled* under the rule 'first across the line wins'. But *should* they get the prize? **Why** might someone say they *deserve* it? What else might make someone seem *deserving*?" (Elicit: effort, training, natural speed, fairness, need).
      *   **Clarify Distinction (10 min):** Contrast responses: "Entitlement is about **this rule** in **this practice**. 'Desert' is a different claim – it's about **worthiness** based on some quality (effort, talent, need) *regardless* of the specific rule. They *can* align, but they don't *have* to. Meritocracy arguments often *assume* they align perfectly."

  3.  **The Bonus Scenario: Forcing the Separation (20 min):**
      *   **Present Case (5 min):** "A small company has a clear, known year-end rule: 'The employee who logs the most verifiable overtime hours gets a $10k bonus.' Alex wins, logging 100+ hours more than anyone else. Under the rule, Alex is *entitled* to the bonus."
      *   **Reveal & Discuss (15 min):** "It's revealed Alex *could* work those hours because: 1) They have a rare, innate high-energy temperament, 2) A supportive partner handles all home/childcare, 3) No chronic health issues. **Key Question:** Does this new info change whether Alex is *entitled* under the rule? Does it change whether Alex *deserves* the bonus? Why/why not?" **Crucial:** Focus *only* on the separation: Entitlement stands (rule met). Desert claim *might* weaken for some (luck, not pure effort/talent) *or* strengthen (effort still real). **Shut down "effort=luck"**: "We're not debating *if* effort is luck here. We're asking: Does meeting the rule (hours) *automatically* mean Alex deserves it *in light of these advantages*? Or are entitlement and desert separate judgments?"

  4.  **Preempting Misconceptions (10 min):** *Proactively state these:*
      *   **"So nothing deserves anything? Rules are arbitrary?"** "No! Rules create legitimate entitlements. We *need* rules. This is about noticing when someone argues a person *deserves* something *only* because they followed a rule, without examining if the rule tracks desert."
      *   **"You resent successful people!"** "Nope. This is analytical. We can fully support someone's *entitlement* under existing rules while questioning if the *rule itself* tracks what we think makes someone *deserving*. Many successful people critique the rules!"
      *   **Effort Objection (Anticipated):** "Someone might say: 'Desert *is* just about effort, and effort isn't luck!' That's a serious philosophical position! **But for this session:** Notice that *even if* desert is *only* about effort, it's *still* a different claim from entitlement under a *different rule* (like hours logged). The company's rule might not perfectly measure *your* idea of desert (pure effort). The distinction holds."

  5.  **Recap & Comprehension Check (5 min):**
      *   **Recap (2 min):** "Entitlement: What the practice's rules say you get. Desert: A separate claim about worthiness based on qualities like effort or talent."
      *   **Check Question (3 min):** **"In the bonus scenario, explain how someone could agree Alex is *entitled* to the bonus under the rule, but still question whether Alex *deserves* it. What's the difference in their reasoning?"** (Listen for recognition of rule-compliance vs. independent assessment of worthiness).

  **Omissions:** Explicitly flagging ("We're *not* tackling luck, Rawls, Nozick, or how much inequality is okay - just this distinction") is **sufficient and necessary**. Introducing those now would derail the narrow focus.
