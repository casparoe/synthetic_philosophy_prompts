  ## Memorial Address: The Sea Remembers

  [Pause. Look at the sea, then at the memorial, then at the gathering]

  Friends, neighbours, guests from our twinned town in France, children from Year 9… thank you for gathering here today, as we do every year, by the water’s edge and before these eleven names. We stand where the horizon stretches towards France, a constant reminder of the small distance that meant everything seventy years ago. We stand where the sea meets the land, where the story of Dunkirk began for this town, and where it ended for these young men.

  We remember Arthur, Benjamin, Charles, David, Edward, Frederick, George, Henry, Isaac, James, and Kenneth. Eleven names etched in stone, eleven lives cut short before they could truly unfold. They were sons, brothers, friends. They were twenty years old. They stepped onto ships from this harbour or others like it, bound for France in a spring that turned swiftly from hope to desperation. They did not come home. They died on a beach. That is the stark, unadorned truth we hold today.

  [Gesture towards the sea]

  For nine days in late May and early June 1940, this stretch of water became a stage for an event unlike any other. An army, battered and besieged, needed to come home. The call went out. And from harbours like ours, boats – big and small, naval vessels and humble fishing smacks like those that once worked these waters – answered. This is a story we know well, passed down through families and associations like ours. We picture the courage of men like your grandfathers [*Nod towards the Little Ships Association representative*], setting out across the Channel into uncertainty, into danger. That courage, that instinct to help when the call comes, is real. It is undeniable. It lives in the stories told here for decades, and it deserves our respect. Whether a man sailed his own boat or sailed one pressed into service by the Navy, he faced the same Channel, the same threat from the sky and sea, the same urgent need. They answered.

  But this water, this Channel, connects as much as it separates. The story we tell ourselves, focused on the boats and the beaches, is only half the picture – and it risks forgetting the other half that made the first half possible. Across that narrow sea, on the sand and in the towns and villages leading to it, another story was unfolding.

  While our soldiers waited on the beaches, while those small boats braved the crossing, a fierce and desperate battle raged inland. It was fought not by those waiting, but by those holding the line. It was fought by the French First Army. Forty thousand French soldiers, including the fathers of men like our honoured guest here today [*Acknowledge the French delegation, specifically the old man*], fought house to house, street by street, in places like Lille. They fought knowing the main force was pulling back, knowing their own chance of escape was vanishingly small. They fought to buy hours, minutes, for the evacuation to continue. They fought with immense courage and sacrifice. When their ammunition ran low and their positions became untenable, many marched out with the honours of war, heads held high – not to freedom, but into years of captivity. Their stand was essential. Without it, the queues on the beaches would have been swept away long before most of the little ships could make their first run.

  **[Key Structural Sentence 1: The Double Meaning & Work]**
  *"They fought knowing the main force was pulling back, knowing their own chance of escape was vanishingly small."*
  *   **Surface Meaning:** Describes the tactical situation and the French soldiers' awareness of their likely fate (capture/death).
  *   **Structural Work:** Directly counters the "Dunkirk Spirit" myth of effortless, character-based victory. It emphasizes *sacrifice* over triumphant escape, *holding action* over offensive victory, and crucially, *French* sacrifice enabling the *British* escape. It implicitly asks: whose "spirit" are we really talking about? It places the French contribution centrally, not as an aside. It prepares the ground for the later critique of misusing the phrase.

  The sea itself played its part. For nine critical days, it lay almost unnaturally calm. A mercy, certainly, making the crossings possible for vessels never meant for such work. But a mercy granted by chance, not by national character. And on the other side, decisions were made, or perhaps not made quickly enough, that allowed the perimeter to hold just long enough. This was not a victory orchestrated by flawless planning or guaranteed by inherent superiority. It was an escape, a reprieve, bought with immense courage, yes, but also with staggering loss, with the sacrifice of allies, and with a large measure of fortune. The army came home, yes, but it came home without its tanks, its heavy guns, its lorries. It came home defeated in the field. It was a deliverance, not a triumph.

  **[Key Structural Sentence 2: The Double Meaning & Work]**
  *"It was a deliverance, not a triumph."*
  *   **Surface Meaning:** A clear statement of historical fact – Dunkirk was a successful evacuation from a military defeat.
  *   **Structural Work:** This is the core rebuttal to the "Dunkirk Spirit" narrative used on the banner. It directly challenges the transformation of defeat into a myth of inherent, perpetual victory-through-character. It separates the undeniable courage *during* the evacuation from the *outcome* of the campaign. It makes the later appropriation of the phrase for other failures (floods, pandemics) seem nonsensical – deliverance from disaster isn't the same as preventing it or winning outright.

  So why do we gather? Why remember these eleven names, and the thousands more? Why remember the French soldiers who held the line? Why remember the little ships?

  We remember them not because their deaths bought time for victory, or bought us a convenient story. We remember them because they lived. Because they were here, part of this town, part of families, part of the fabric of life that was torn apart. We remember them because they answered a call, a terrifying call, and went. We remember the French soldiers because they were our allies, because they fought bravely for the common cause, and because their sacrifice is woven inextricably into the story of *our* army's survival. We remember the little ships – naval crews and civilian volunteers alike – because they saw a need and acted, displaying courage not born of invincibility, but of common humanity and shared resolve in the face of overwhelming danger.

  **[Key Structural Sentence 3: The Double Meaning & Work]**
  *"We remember them not because their deaths bought time for victory, or bought us a convenient story. We remember them because they lived."*
  *   **Surface Meaning:** Rejects instrumentalizing the dead for political or myth-making purposes. Focuses commemoration on their humanity and loss.
  *   **Structural Work:** Directly addresses the speaker's fear of making the eleven "instrumental." It honours the grief of descendants ("grief has only ever had this one shape") by centering the men's lives, not abstract concepts like "time" or "the story." It subtly critiques the "convenient story" the banner represents. It makes the commemoration truthful and personal.

  That shared resolve, that recognition of common cause and common peril, *that* is the enduring meaning of this place and this event. It wasn't a uniquely English spirit. It was a human response to catastrophe, witnessed in the fishermen steering towards shellfire, in the French soldier firing his last rounds from a ruined building in Lille, in the exhausted private sharing his last drop of water on the beach. It was a moment when borders blurred in the face of a common threat, and actions spoke louder than nationality.

  For our friends from France, we say this clearly: your fathers, your countrymen, stood where ours fell. They fought so ours could leave. Their courage, their sacrifice, is not a footnote in our history; it is a central chapter. Their absence from too many of our accounts is our failing, not theirs. We remember them today, alongside our own, with profound gratitude and respect. Their place in this story is not beside ours; it is *before* ours. They held the door.

  **[Key Structural Sentence 4: The Double Meaning & Work]**
  *"Their place in this story is not beside ours; it is *before* ours. They held the door."*
  *   **Surface Meaning:** Acknowledges the French role as chronologically and tactically prior, enabling the evacuation.
  *   **Structural Work:** This fulfills the requirement to give the French their place "in a way that doesn't read as a courteous aside." It places them *centrally* and *essentially* within the core narrative structure of the evacuation story. "They held the door" is a powerful, active metaphor that conveys their critical function without ambiguity. It directly addresses the old Frenchman's grievance about his father's erasure.

  And what of the phrase that hangs over our High Street? "The Dunkirk Spirit." If it means that innate, unquenchable pluck that guarantees we never *really* lose, that turns every setback into a hidden victory simply because of who we are... then it is a dangerous myth. It forgets the French. It forgets the fortune. It forgets the defeat. It forgets the men who died on the beach. It forgets that wars *are* won by evacuations only if someone else wins the battles that come after, often at terrible cost.

  But if "the Dunkirk Spirit" means something else – if it means the shared resolve that emerges when catastrophe strikes, the willingness of ordinary people to do extraordinary things not out of invincibility, but out of necessity and shared humanity; if it means remembering that we are never truly alone, that allies matter, that courage comes in many forms, often unseen; if it means looking disaster in the face and finding, not a guarantee of victory, but the will to endure, to help one another, and to carry on – then it has meaning. Then it honours the French soldier holding the perimeter as much as the fisherman crossing the Channel. Then it honours the eleven who didn't come home, not as pawns in a story of triumph, but as young men lost. Then it is a spirit forged not in inevitable victory, but in the crucible of shared struggle and profound loss.

  **[Key Structural Sentence 5: The Double Meaning & Work]**
  *"If it means the shared resolve that emerges when catastrophe strikes... if it means remembering that we are never truly alone... if it means looking disaster in the face and finding... the will to endure... then it has meaning."*
  *   **Surface Meaning:** Offers a redefinition of "Dunkirk Spirit" focused on shared humanity, mutual aid, and endurance in the face of disaster.
  *   **Structural Work:** This is the crucial manoeuvre regarding the banner. It doesn't attack the phrase head-on; it *reclaims* and *redefines* it. It makes the simplistic, triumphalist interpretation ("innate, unquenchable pluck") seem hollow and historically ignorant by contrasting it with a definition rooted in the complex, shared reality just described (French sacrifice, fortune, loss). It leaves the banner's owner having to justify their narrow interpretation against this richer, more truthful, and inclusive definition. It makes the *misuse* of the phrase for later failures implicitly illogical – shared resolve *in* disaster is different from claiming the disaster itself embodies a victorious spirit.

  Year 9, you studied this. You know the facts are more complicated than just boats and beaches. You understand that history is made of many threads – courage and fear, planning and luck, victory and defeat, allies and enemies. Remember the sand, remember the sea, remember the names. Remember the men waiting, the men sailing, and the men fighting far from the shore to make the waiting possible. Remember that choices made then echo now. Remember that how we tell the story matters.

  We stand here today, generations later, bound by memory to these eleven names, to the men on the little ships, to the soldiers of the French First Army. We honour their courage – all of it. We mourn their loss – all of it. We acknowledge the fortune that played its part. We reject the easy myth that turns defeat into a story of inherent, solitary triumph. Instead, we choose to remember the complexity, the shared struggle, the profound cost, and the enduring lesson: that our strength often lies not in never falling, but in how we help each other up; not in assuming victory, but in facing adversity together, with our allies beside us.

  The sea remembers the boats. The sand remembers the footsteps. The stone remembers the names. Let our memory remember the whole story. Let it be a memory grounded in truth, in respect for all who were there, and in a commitment to the shared resolve that truly honours them.

  We will remember them.

  ---

  **Sentences Carrying Double Meaning & Structural Work:**

  1.  **"They fought knowing the main force was pulling back, knowing their own chance of escape was vanishingly small."**
      *   **Work:** Counters the "victory through character" myth by emphasizing sacrifice over escape, holding action over offensive victory, and French centrality to the British evacuation. Grounds French contribution in undeniable historical reality.

  2.  **"It was a deliverance, not a triumph."**
      *   **Work:** Explicitly separates the event (a successful evacuation) from the campaign outcome (defeat). Directly undermines the core narrative of the "Dunkirk Spirit" myth as a perpetual victory. Makes later misuses of the phrase illogical.

  3.  **"We remember them not because their deaths bought time for victory, or bought us a convenient story. We remember them because they lived."**
      *   **Work:** Honors the grief of descendants by focusing on the humanity and loss of the eleven, rejecting their instrumentalization for myth-making ("convenient story") or strategic justification ("bought time"). Anchors the commemoration in truth and personal loss.

  4.  **"Their place in this story is not beside ours; it is *before* ours. They held the door."**
      *   **Work:** Integrates the French sacrifice fundamentally and centrally into the narrative ("before ours"), fulfilling the requirement to avoid a "courteous aside." The active metaphor "held the door" powerfully conveys their essential role. Directly addresses historical erasure.

  5.  **"If it means the shared resolve that emerges when catastrophe strikes... if it means remembering that we are never truly alone... if it means looking disaster in the face and finding... the will to endure... then it has meaning."**
      *   **Work:** The core act of redefinition. Doesn't attack "Dunkirk Spirit"; reclaims it based on the complex, shared reality described. Makes the simplistic, triumphalist interpretation seem hollow and ignorant. Leaves the banner owner defending a narrow view against a richer, truthful, and inclusive one. Makes misuse for other failures implicitly nonsensical.

  **For the Historians (50 Historians, No Descendants):**

  The core structure and historical points would largely stand. However, the language and emphasis would shift significantly:

  1.  **Directness & Precision:** No need for protective layers or double meanings. State the myths explicitly and dismantle them with evidence.
      *   E.g., "The popular 'Dunkirk Spirit' narrative, emphasizing innate British pluck turning defeat into moral victory, is a significant postwar construction that obscures critical realities: the military defeat, the role of French sacrifice (specifically the rearguard actions like at Lille), the element of weather and German hesitation, and the loss of virtually all heavy equipment."
  2.  **Greater Detail:** Include specific unit numbers (French 1st Army divisions involved), German command decisions (e.g., Hitler's "Halt Order"), logistical realities of the evacuation (losses, types of vessels).
  3.  **Historiography:** Briefly reference the evolution of the myth (Churchill's speech as necessary but complex, postwar films, political usage).
  4.  **Reduced Emotional Appeal:** Less focus on "lives cut short" and communal grief, more on analyzing the *impact* of the losses and the event strategically and psychologically.
  5.  **Explicit Critique:** Directly state the problems with instrumentalizing the dead or using Dunkirk as an all-purpose metaphor for resilience in the face of preventable failures. "Applying 'Dunkirk Spirit' to floods or pandemics ignores the crucial difference between unavoidable catastrophe and failures of planning or resource allocation; it risks absolving responsibility by invoking mythical resilience."
  6.  **French Contribution:** Still central, but framed within the specific military context of Allied coordination (or lack thereof) and the political fallout. Acknowledge the controversy around Gort's decisions regarding the French rearguard.
  7.  **The Eleven:** Mentioned factually as part of the local cost, but the focus would be more on the broader scale of loss and its context within the BEF's experience.
  8.  **The Banner:** Directly addressed as an example of myth-making: "Phrases like the one currently displayed locally represent a persistent, though historically problematic, interpretation of the event..."

  The *analysis* would be sharper, more critical, and less concerned with protecting communal feelings, focusing instead on historical accuracy and the deconstruction of the dominant myth. The core truths – French sacrifice, deliverance not triumph, the danger of the myth – would remain, but delivered with academic rigour and without the commemorative framing.
