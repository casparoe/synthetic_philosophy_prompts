  First, I need to recall Lewis's core argument: no non-trivial probability assignment can satisfy P(A→C) = P(C|A) for all A and C. This indeed pushes many to treat indicatives as non-truth-conditional. Counterfactuals, however, are often analyzed via possible worlds semantics, giving them truth conditions. 

