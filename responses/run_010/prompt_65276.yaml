  Hmm, this is where the restrictor view or dynamic semantics might help. Indicatives aren't making claims about other worlds but constraining epistemic possibilities. Counterfactuals actively invoke non-actual worlds. So even if the surface content ("water supply caused contamination") seems similar, the mechanisms differ fundamentally. 

  Their modus ponens question is sharp too. If indicatives aren't truth-conditional, how can MP be valid? The inference might work pragmatically: asserting A→C commits you to C if A holds, but this is more about language use than truth preservation. 

  I should emphasize that the distinction isn't merely tense/mood. Counterfactuals involve metaphysical similarity, while indicatives involve epistemic coherence. The lab case shows this: the indicative assumes the tech didn't mislabel as part of current knowledge, while the counterfactual forces us to imagine a world where labeling was correct. 

