  I'm a second-year PhD student and our department has a small internal fund that pays for one semester's worth of research time. Deadline's in a week and I need a two-page proposal. My half-formed idea is about compulsory voting, but not the usual is-it-a-duty-or-not question. Here's the itch I can't scratch: when people argue for making voting legally compulsory they almost always say citizens have a duty to vote, and then treat compulsion as the obvious way of getting that duty discharged. But I think the argument gets run together with a different one, where the target isn't the act of voting at all but some end voting is supposed to bring about — legitimacy, or broadly good collective decisions. Those two are not the same, and I suspect the difference actually decides the institutional question. If the duty is to do the act, then compulsion is exactly right and the clever designs people propose — sortition chambers, voting lots, compulsory *informed* voting, letting people pay a fee instead — are all non-starters, because none of them has the citizen performing the act. If the duty is to the end, compulsion is just one instrument among several and it has to compete with the others on effectiveness. And there's a third strand I can't fit in: people who say voting's point is expressive, that its meaning comes partly from the fact that you could have stayed home, so requiring it changes what the act says. Maybe that's a species of the end-view, maybe it's its own thing, I genuinely don't know.

  So: turn this into a proposal with a question stated sharply enough that it could come out either way. Then say why the existing camps don't settle it — I'm thinking of the people who argue there's a duty to vote, the epistocrats who say the vote should be weighted or restricted by knowledge, and the expressivists — and where each of them quietly assumes an answer to my question instead of arguing for one. Then the method: what I'd actually be doing week to week, which arguments and cases I'd build, and how I'd test whether the distinction earns its keep. Also say why this conceptual route makes progress where the obvious alternative — comparing countries that already compel voting and looking at turnout and trust data — doesn't answer *this* question. And be explicit about failure conditions: what would it look like if I finished the semester and the distinction turned out to draw no real line, or drew one that no institutional choice actually turns on. Finally, an honest paragraph on scope — what I'd have to cut for one person in one semester, and where the thing threatens to balloon.

  No bibliography, I'll add references myself, just talk about the positions and arguments in prose. And start straight in with the proposal itself, no preface or note about how you've interpreted the brief.
