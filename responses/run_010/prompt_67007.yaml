  ## Tribute to Professor Eleanor Vance

  [Warmly, scanning the room] Eleanor, colleagues, friends, family… It feels both entirely fitting and faintly surreal to be gathered *here*, in the very building where Eleanor Vance has spent the last thirty-six years teaching us that, well… things are rarely quite what they seem. Or rather, *how* they seem is the very heart of the matter she’s wrestled with so brilliantly.

  [Pause, smile towards Eleanor] For those of us privileged to work alongside her, or to learn from her, Eleanor embodies intellectual courage. She picked up a specific thread in the tapestry of philosophy – the higher-order tradition – and didn't just weave with it; she pulled it, tested it, strengthened it, and defended it against all comers with a fierce, meticulous logic that became her signature. Her aim? To understand that most elusive feature of our lives: what it’s like for us, right now. The seeming. The felt presence.

  So, what did she argue? Let me try to capture the essence, Eleanor, as faithfully as I can. [Turns slightly to include the whole room, especially non-specialists]

  Her core conviction is deceptively simple: **Our basic sensations and feelings – the raw seeing of red, the sharp sting of pain, the flush of warmth – aren't conscious just by being there.** A sophisticated computer processing light waves or pressure points wouldn't, just by virtue of that processing, have an experience. No. Eleanor insists that for a state like *seeing red* to *feel like something* to *you*, something else must happen. You need a specific kind of *thought* about that seeing. A higher-order thought that says, effectively, “I am in *this* state right now.” That thought *makes* the seeing conscious. Without it, even the most complex processing remains in the dark, experientially speaking.

  [Pause, slightly more technical for philosophers, but keeping language accessible] Now, Eleanor was ruthlessly consistent. She didn’t fudge the next step. That higher-order thought itself? It’s *not* lit up by some inner spotlight. There’s no little homunculus watching a screen inside our heads. She rejected all those metaphors utterly. For Eleanor, the *only* data that matters, the only thing needing explanation, is the final result: **how things seem to the subject.** That seeming *is* the phenomenon.

  [Key moment: Turning slightly towards the family section, particularly the brother] And this leads to her most distinctive, and some would say provocative, move. Imagine this: what if that higher-order thought *gets it wrong*? What if it proclaims, “I am experiencing a terrible pain in my foot!”… but there’s actually *nothing* wrong with the foot? No injury, no signal. Common sense might say: “Oh, you’re *imagining* the pain. It’s not real.” But Eleanor says: **No. The seeming *is* the reality.** That thought *constitutes* the experience. If it *seems* to you that you have a terrible pain in your foot, then you *are* having that experience of pain. There isn’t some deeper, hidden “real pain” that’s absent. The thought *creates* the experiential reality it reports. [Pause, make eye contact if possible with the brother] Think of a vivid dream. You dream you hear music. There’s no sound wave hitting your ears, but *within the dream*, the experience of hearing music is utterly real for you. That’s the kind of reality Eleanor gives to the seeming itself, created by that higher-order awareness. The awareness *is* the experience.

  [Shift tone slightly, introduce the joke] Now, this view has… interesting consequences. Consciousness, on Eleanor’s account, becomes oddly democratic, yet strangely selective. [Joke setup] It means that a system, even a relatively simple one, that can form those kinds of thoughts about its own states… might have genuine experiences. Hence her famous (or infamous!) generosity towards fish, cephalopods, and even certain machines. [The Joke] Conversely, a system performing the most staggeringly complex computations, but lacking that specific self-referential trick? On Eleanor’s view, it’s experientially empty. As she might wryly put it: **“You could build a supercomputer that perfectly simulates the processing of a human brain enjoying a sunset, but if it can’t *think* ‘I’m experiencing this sunset,’ then, on my view, it’s just having a very elaborate, very dark Tuesday afternoon.”** [Pause for laughter. Aim for the neuroscientists and the husband - the absurdity of the complex machine having a 'dark Tuesday' should land].

  [Shift to a more reflective, serious tone] Eleanor’s consistency led her to think deeply about the edges of existence. She understood, on her own terms, what happens when that capacity for higher-order thought is profoundly disrupted or fades away – under deep sedation, or at the very end of life. Her theory is clear: when those higher-order states lapse, the inner world, the seeming, ceases. The complex processing might continue, but the subject, the one for whom it *seems* like something, is gone. [Pause, weight the words carefully] Eleanor has been explicit: she would not want it said of her, in such a state, that she is “still in there.” She sees that as a comforting fiction. [Look directly at the room, especially family, with empathy] Honouring her means respecting the starkness of that view. We cannot reassure ourselves with words her own rigorous philosophy denies. The difficulty here is real. It asks us to sit with absence, to acknowledge the silence when the light of awareness truly goes out, without pretending it’s otherwise. That is the difficult truth she asks us to carry tonight, alongside our celebration.

  [Final shift: Warmth, focus on Eleanor the person, standing slightly more formally] Which brings us to the end. And Eleanor’s final request: words acceptable to her fierce students, her skeptical neuro-collaborators, and her beloved family and friends, *without* requiring anyone to sign on to her theory of consciousness. So let’s speak not of consciousness now, but of Eleanor Vance.

  [Peroration - Building in warmth and universality] **To her students:** She demanded precision, challenged every assumption, and showed you the power of defending an idea relentlessly, even an unpopular one. Her intellectual integrity is a beacon. **To her neuro colleagues:** She engaged seriously, welcomed the hardest tests (even declaring them unfalsifiable!), and pushed you to articulate *exactly* what your data could and could not say about the mind’s deepest mystery. Her rigor raised the bar. **To her family and friends:** You know the warmth beneath the formidable intellect, the dry wit, the loyalty, the Eleanor who exists far beyond the pages of journals. Her love and commitment to you are undeniable.

  [Final, resonant conclusion] **Eleanor Vance built a career, and a life, on this principle: How things seem *matters*. Tonight, what seems true to every single one of us in this room, regardless of our views on how consciousness works, is this: It seemed to Eleanor Vance that rigorous thought was a calling. It seemed to her that clarity was a virtue worth fighting for. It seemed to her that her students deserved her absolute best. It seemed to her that her colleagues, even fierce opponents, deserved honest engagement. And it seemed to her, profoundly, that her family and friends were her anchor and her joy.**

  [Raise glass] **For thirty-six years, that seeming shaped reality – the reality of this department, the reality of her field, and the reality of countless lives she touched. For that profound shaping, for her unwavering commitment to the truth *as she saw it*, for being exactly who she seems to be – fiercely brilliant, deeply principled, and dearly loved – we honour you tonight, Eleanor. To Professor Vance!**

  **[Sit down]**
