  Check timing: 800-900 words. Keep sections concise. Introduction with warmth, theory explanation with the chaplain-friendly analogy, joke, sedation part handled sensitively, and a unifying conclusion. Run through each constraint to ensure nothing's missed. Make sure the ending resonates emotionally while staying neutral, focusing on her legacy beyond the theory.
