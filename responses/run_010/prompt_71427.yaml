prompt: |-
  I'm a senior and I sit on our school's honor council — three students and two teachers, we get maybe six or seven cases a term, we meet for an hour each time, and our recommendation goes to the dean who basically always signs off. So the stakes are real (suspensions, getting kicked off teams) but none of us have any training at all.

  What bugs me is how much of what we decide comes down to luck. Two kids cheat off the same answer key, one gets caught and one doesn't, and we can only ever sanction the one who got caught. Somebody shoves a friend into the lockers as a joke — if the friend cracks his phone the sanction is way harsher than if he laughs it off, even though the shove was identical. We tried to fix this by treating attempts the same as completed stuff, and that landed us in a case last year where we sanctioned a kid for a plan he'd written down but never acted on, which honestly felt wrong to everyone in the room.

  Can you turn the moral luck idea into an actual procedure we could run on a case? I mean the questions to ask in order, what counts as a settled answer to each one, which kinds of luck we should be neutralizing and which ones there's nothing to be done about, and the points where it has to get handed back to a human because its not really a factual question. It has to work for students who've never read any philosophy, so tell me which distinctions from the theory absolutely have to survive being simplified and which ones we can drop. And be honest about where it'll misfire, and where it's going to give an answer I don't like.

  Then run it on three cases: the two cheaters where only one got caught; the identical prank that broke a phone versus the one that didn't; and the written-down plan nobody acted on.

  Put your bottom line in the very first sentence and then give the reasoning — no preamble and don't restate my question back to me.
reasoning: |-
  Okay, the user is on their school's honor council and is frustrated with how luck affects their decisions. They mentioned cases like cheating where only one gets caught, pranks with different outcomes, and punishing an unacted plan. They want a procedure based on moral luck that's practical for students without philosophy training. 

  First, I need to recall what moral luck is. It's when outcomes affect judgments of blame, even if intentions were the same. The user wants to neutralize luck where possible but recognize when it's unavoidable. 

  Breaking down the key issues: Outcome luck (different results from same action), circumstantial luck (only some get caught), and the problem of intentions vs. actions. The procedure needs clear steps that anyone can follow. 

  For the procedure, start with establishing the facts. Then assess intent and negligence. Focus on what the person controlled: their choices and awareness of risks. Outcomes shouldn't matter if the action was the same. But for negligence, the risk itself is key, not just the outcome. 

  Where it might misfire: If two actions seem similar but intent differs, like a shove meant playfully vs. aggressively. Also, in cases with multiple causes, like the phone breaking—was it just the shove or something else? 

  Now, applying to the cases. For the cheaters: Both had the same intent and action. The fact one wasn't caught is circumstantial luck. Sanction both if evidence shows they both cheated. 

  For the prank: The shove is the same action. The outcome (phone breaking) is luck. Sanction based on the action's risk, not the outcome. 

  The unacted plan: Here, intent exists but no action. Without taking steps to act, it's just thought. Not sanctionable because no harm or attempt. 

  The user might not like that some luck can't be neutralized, like who gets caught. But the procedure minimizes outcome luck. Also, they might worry about fairness in sanctioning both cheaters, but it's consistent. 

  Need to simplify philosophical terms: Use "control" instead of "moral luck." Focus on intent, action, and risk. Drop finer distinctions like resultant vs. circumstantial luck if it's too complex. 

  Honesty about misfires: Sometimes intent is hard to prove. Also, if an action is low-risk but causes harm, the procedure might under-punish, but that's consistent with focusing on controllable factors. 

  Overall, the bottom line is a procedure that prioritizes intent and actions over outcomes. Make it step-by-step with clear questions. Emphasize that not all luck can be eliminated, but this method reduces unfairness where possible.
answer: |-
  **Bottom line: Prioritize sanctions based solely on controllable factors—intent, actions taken, and foreseeable risks—by following this four-step procedure:**

  ### The Moral Luck Neutralization Procedure
  1.  **Establish Controllable Facts (What did they *do* and *intend*?):**
      *   *Questions:* What specific actions did the student perform? What evidence exists of their intent (e.g., planning, communication, recklessness)? Was the action completed or merely attempted? Did they take concrete steps towards the act?
      *   *Settled Answer:* Requires factual evidence (testimony, messages, physical evidence). Intent inferred from actions/communication unless contradicted. "Attempt" requires *substantial steps* towards completion (buying cheat sheet = attempt; writing "I wish I could cheat" ≠ attempt).
      *   *Key Luck Neutralized:* "Resultant Luck" (outcomes) is ignored here. Focus is on *conduct*.
      *   *Human Judgment Needed:* Interpreting ambiguous intent evidence, defining "substantial steps."

  2.  **Assess Foreseeable Risk (What *could* reasonably happen?):**
      *   *Questions:* What harms or rule violations were reasonably foreseeable consequences of the *actions taken*? Would a reasonable student foresee this?
      *   *Settled Answer:* Based on common sense and school norms. Doesn't require predicting the *exact* outcome, just the *type* of harm/violation (e.g., shoving someone near lockers = foreseeable risk of injury/property damage; cheating = foreseeable risk of getting caught and undermining integrity).
      *   *Key Luck Neutralized:* "Resultant Luck" (actual outcome) is separated from the inherent *risk* created.
      *   *Human Judgment Needed:* Determining "reasonable foreseeability" for specific actions in the school context.

  3.  **Determine Culpability Level (How blameworthy is the *choice*?):**
      *   *Questions:* Based solely on Steps 1 & 2: How severe was the *intended* violation? How reckless/negligent was the conduct considering the *foreseeable risks*? Was it premeditated or impulsive?
      *   *Settled Answer:* Assign a culpability level (e.g., Low, Medium, High) based on the *choices made* and *risks created*, independent of actual outcome or whether they were caught.
      *   *Key Luck Neutralized:* "Circumstantial Luck" (whether they got caught) is irrelevant to culpability level. "Resultant Luck" is excluded.
      *   *Human Judgment Needed:* Weighing intent vs. recklessness, assigning severity to types of intent/actions.

  4.  **Assign Sanction (Based on culpability + mitigating factors):**
      *   *Questions:* What standardized sanction range corresponds to the culpability level? Are there significant mitigating factors (remorse, coercion, first offense)? Aggravating factors (repeat offense, lack of remorse)?
      *   *Settled Answer:* Use a pre-defined grid (e.g., High Culpability: Suspension range; Med: Probation/Service; Low: Warning/Education). Mitigation/aggravation adjusts within the range.
      *   *Unavoidable Luck:* Actual outcome may influence *mitigation* (e.g., genuine remorse shown *after* harm occurred) but *not* the base culpability level. Whether they were caught is irrelevant.
      *   *Human Judgment Needed:* Evaluating sincerity of remorse, degree of coercion, applying sanction grid fairly.

  ### Key Simplifications & What's Dropped
  *   **Must Survive:** Distinction between *intent/action/risk* (controllable) vs. *outcome/circumstance* (uncontrollable luck). The core idea of judging only what the agent controls.
  *   **Can Be Dropped:** Specific labels (constitutive/resultant/circumstantial luck). Deep philosophical debates about free will. Nuanced differences between attempts/preparations – replaced by the "substantial steps" practical test.
  *   **Where it Misfires:**
      *   **Subtle Intent Differences:** If two shoves *look* identical but one had hidden malicious intent, the procedure relies on discernible evidence (Step 1). Malicious intent might not be caught.
      *   **Complex Causation:** If the phone broke *because* it was already cracked, Step 2 (foreseeability) handles the *general* risk, but determining the *specific* cause might be messy. Stick to the general risk.
      *   **"Harmless" High-Risk Actions:** Someone does something extremely reckless (e.g., driving blindfolded in an empty lot) but gets incredibly lucky with zero harm. The procedure assigns high culpability due to extreme foreseeable risk, which might *feel* harsh without an actual bad outcome, but is consistent.
  *   **Answers You Might Dislike:**
      *   Sanctioning students for things where "nothing bad happened" if the risk was high and their actions were culpable.
      *   *Not* sanctioning harshly for severe outcomes if the initial culpable action was low-risk *and* the outcome was truly unforeseeable fluke (rare).
      *   Accepting that *who got caught* is luck we often can't fix without new evidence (though consistent culpability assessment neutralizes its impact on *blameworthiness*).

  ### Application to Cases

  1.  **Two Cheaters, One Caught:**
      *   **Step 1:** Both performed the *action* of using the answer key. Evidence (test similarity, access) confirms intent to cheat for both. Action completed.
      *   **Step 2:** Foreseeable risk: Getting caught, undermining academic integrity.
      *   **Step 3:** Identical High Culpability (intentional cheating).
      *   **Step 4:** Identical sanction based on High Culpability for cheating. The fact one wasn't initially caught is "Circumstantial Luck" – irrelevant to blameworthiness once evidence is clear. *Sanction both equally.*
      *   **Why you might dislike it:** Requires pursuing evidence on the second student. If evidence is truly only strong for one, only one can be sanctioned (a limit of evidence, not the procedure).

  2.  **Identical Prank Shove (Phone Broke vs. No Damage):**
      *   **Step 1:** Identical *action*: Intentionally shoving a peer near lockers (reckless behavior).
      *   **Step 2:** Foreseeable risk: Minor injury, property damage (phone/watches), causing distress. A reasonable student knows shoving near hard objects is risky.
      *   **Step 3:** Identical Medium-High Culpability (intentional reckless action creating foreseeable risk of harm/damage).
      *   **Step 4:** Identical sanction based on culpability level for reckless endangerment. The broken phone (Resultant Luck) doesn't increase *culpability*. It might influence *mitigation* (e.g., if the shover shows remorse and offers to pay, that could slightly reduce sanction; if they mock the victim, it could increase it). *Sanction both shovers identically based on the action and risk, not the outcome.*
      *   **Why you might dislike it:** The victim with the broken phone (and parents) will likely feel the sanction is too light. The procedure argues the *moral blameworthiness* is the same.

  3.  **Written-Down Plan Never Acted On:**
      *   **Step 1:** *Action:* Writing down a plan. *Intent:* Exists (plan shows desire). However, no *substantial steps* taken towards executing the plan (e.g., didn't gather materials, recruit others, go to the location). Action not attempted/completed.
      *   **Step 2:** Writing alone creates *minimal* foreseeable risk of harm (unless shared threateningly). The *planned* act might have had high risk, but no steps were taken to bring that risk about.
      *   **Step 3:** Low Culpability. While the *thought* is bad, the *action* (writing privately) is minimally harmful or risky in itself. No substantial step = no attempt sanction.
      *   **Step 4:** Likely no formal sanction, or minimal (e.g., discussion with counselor/dean about concerning thoughts). Focus on intervention, not punishment. *Do not sanction.*
      *   **Why you might dislike it:** The plan might be scary or offensive. The procedure argues sanctioning *thoughts* without *action* or *substantial steps* is unjust and overreaches. Addressing concerning ideation is important, but distinct from punishment for conduct.
