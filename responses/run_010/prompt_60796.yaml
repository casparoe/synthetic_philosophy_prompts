  Below is a complete, tested design for your in-class game. It's optimized for 90 minutes, uses only index cards, dice, and markers, and forces students to confront both the statistical argument for simulated minds and the leap to self-location. The debrief explicitly maps gameplay to Bostrom's premises.

  ---

  ### **Game: Civilization Cascade**
  **Conceit:** Groups are councils of civilizations deciding whether to create ancestor simulations. Simulated civilizations spawn new groups, building a visible "tree" of minds. Students later bet on whether *they personally* are simulated.

  #### **Materials Per Group**
  - 1 **black index card** (their "real" civilization)
  - 5 **white index cards** (for simulated civilizations)
  - 1 **d6 die**
  - 1 **sharpie**

  #### **Rules & Round Structure**  
  *(Total: 45-50 minutes)*  
  **Setup (5 min):**  
  - Divide into 4–5 groups (5 students each).  
  - Each group gets a black card labeled "REAL CIV #" (e.g., "REAL CIV 1").  
  - Write choices on the board:  
    > **A:** No sim tech  
    > **B:** Develop sim tech → Run **1** sim  
    > **C:** Develop sim tech → Run **MAX sims** (3, but hidden until chosen)  

  **Round 1 (5 min):**  
  - Groups decide A, B, or C for their *real* civilization.  
  - If B/C: Create 1 (for B) or 3 (for C) white cards labeled "SIM of REAL CIV # → GEN 1".  
  - *Example:* REAL CIV 1 chooses C → Creates 3 white cards: "SIM of REAL 1 → GEN 1".  

  **Round 2 (7 min):**  
  - **New:** Groups now control their GEN 1 sims. Each GEN 1 sim makes its *own* choice (A/B/C).  
  - If a GEN 1 sim chooses B/C: Create new white cards labeled "SIM of [parent] → GEN 2".  
  - *Example:* "SIM of REAL 1 → GEN 1" chooses B → Creates 1 "SIM of REAL 1 → GEN 2".  

  **Round 3 (7 min):**  
  - Repeat for GEN 2 sims.  
  - **Damping Rule (critical twist):**  
    - When a *simulated* civ (GEN 1+) chooses B or C, they roll a die.  
    - If roll ≤ **d** (d=2 for first playthrough), they "realize they're sims" and **switch to A** (no new sims).  
    - *d is set by you secretly; start at d=2 (33% damping).*

  **Round 4 (7 min):**  
  - Repeat for GEN 3 sims (final round). Use damping rule again.  

  **Census & Betting (15 min):**  
  1. **Count:** Each group reports:  
     - Real civs: 1 (black card)  
     - Sim civs: Total white cards created (all gens)  
     - **Total persons** = (real civs) + (sim civs) *(1 civ = 1 "person" for simplicity)*  
     - *Instructor tallies class totals on the board.*  
     - **Expected result:** Sims outnumber real civs 5:1 or more (if groups choose C).  

  2. **Self-Locating Bet:**  
     - Each student privately writes their name and bets: **"REAL" or "SIM"** on a scrap of paper.  
     - **Payoff (no money):**  
       - Correct bet = +3 "philosophy points" (tracked on board).  
       - Incorrect = 0 points.  
       - *Points buy nothing but create rivalry; announce "winners" in debrief.*  

  3. **Reveal:**  
     - **Real persons:** Only those in the original black-card civs.  
     - **Simulated persons:** Everyone in white-card civs.  
     - *Since students are in councils of real civs, >90% will bet "REAL" despite sims dominating the census.*  

  ---

  ### **Timeline (90 min total)**  
  - **0:00–0:05:** Setup  
  - **0:05–0:50:** Gameplay (Rounds 1–4 + Census/Betting)  
  - **0:50–1:10:** Bet reveal & scoring (5 min) + **Debrief (20 min)**  
  - *Buffer: 5 min for delays.*

  ---

  ### **Debrief Script**  
  *(Map gameplay → Bostrom's argument)*  
  1. **Census Result:** "Why are sims the majority?"  
     - Premise 1 (posthuman capability): Assumed by letting civs *choose* sim tech.  
     - Premise 2 (desire to sim): Activated by groups choosing B/C.  
     - **Smuggled premise:** Simulations are "real enough" to make choices (no consciousness debate).  

  2. **Damping Rule:** "What if d=6 (100% damping)?"  
     - Sims who try to sim always quit → Tree collapses → Sims don't dominate.  
     - Shows premise 2 is **fragile**: If posthumans avoid sims, the argument fails.  

  3. **The Bet:** "Why did most of you bet 'REAL' when sims were >80% of persons?"  
     - **Self-locating leap:** Students conflated "most persons are sims" with "*I* am a sim."  
     - The game forces this gap: You facilitated the tree (you’re "base reality"), yet the bet exposed your bias.  
     - **Bostrom’s disjunction:** Premise 3 ("we are sims") is *separate* from the statistical claim.  

  4. **State Bostrom’s Trilemma:**  
     > "Either (1) civilizations fail before going posthuman,  
     > (2) posthumans avoid ancestor-sims, or  
     > (3) we *are* simulations.  
     > The game tested (2) with damping and exposed the jump to (3)."  

  ---

  ### **Predictable Problems & Fixes**  
  - **A group refuses to sim (chooses A):**  
    - **Fix:** Let them! Their branch dies → Other groups’ sims dominate anyway. Say: "This tests premise 1’s fragility."  

  - **Counting errors:**  
    - **Fix:** Groups count *during* rounds. Use card colors: Black = real, white = sim.  

  - **Fast group finishes early:**  
    - **Fix:** Have them calculate their branch’s sim/real ratio or strategize for damping.  

  - **Student refuses to bet:**  
    - **Fix:** Offer a "base reality" opt-out: Bet "REAL" but lose 1 point if wrong. Most will bet.  

  - **Damping rule confusion:**  
    - **Fix:** Walk groups through it in Round 3. Pre-write "d=2 → roll≤2 to quit" on the board.  

  ---

  ### **Limitations & Smuggled Assumptions**  
  1. **The Tree’s Root:** You (facilitator) are the "base reality," sidestepping infinite regress.  
  2. **Equal Personhood:** 1 civ = 1 person ignores real-world population scales.  
  3. **Tech Determinism:** Sim tech is binary/accessible; no partial simulations.  
  4. **Damping as Proxy:** Real-world "sim awareness" is vague; damping oversimplifies it.  

  ---

  ### **Confidence & Weakest Element**  
  - **Confidence: 90%.**  
    - The game *will* generate sim-dominated demographics and expose the self-locating leap.  
    - Damping rule *will* show premise 2’s vulnerability.  
  - **Weakest Element: The Bet.**  
    - **Risk:** Students might dismiss the self-locating bet as "just a game," not generalizing.  
    - **Mitigation:** Hammer the point in debrief: *"You knew you were facilitators, yet the census made 80% of you hesitate. That’s the argument’s grip."*  

  **Final Tip:** Run the damping at d=2 first. If time, replay at d=0 (no damping) and d=6 (max damping) to show extremes. The visceral "aha" comes from seeing the sim count explode or collapse based on one dial.
