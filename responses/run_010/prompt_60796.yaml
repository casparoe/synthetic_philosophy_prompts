     - I am confident that this will run and teach the lesson about the premises and the self-locating move.

     - The part I am least sure about: the random assignment of students to civilizations. It might feel artificial. Also, the connection between being on the council of a real civilization and then being assigned to a simulation might be confusing. But I think it's necessary to break the association that "I am in the initial group so I must be real".

     Alternative: we don't have groups for the initial civilizations? We start with one real civilization (the whole class) and then let one group make the decisions? But then the branching is small.

     We stick with multiple initial groups to have a larger population.

     Revised Timeline (more detailed):

     Total: 90 min

     - 0-5 min: Setup. Divide into 4 initial groups. Hand out materials. Explain: 
          "Each group is the governing council of a civilization. We will have 3 rounds. In each round, some civilizations will make a choice. The choices:
            A: Do not develop simulation technology. (No new simulations.)
            B: Develop simulation technology and run one ancestor simulation.
            C: Develop and run two ancestor simulations.
          Note: When you run a simulation, you create a new civilization that is simulated. These simulated civilizations will then make their own choices in the next round.

          We are setting the damping factor d=0: so no civilization becomes aware they are simulated.

          Each civilization only makes one decision, when it is their turn. The initial civilizations (real) decide in round 1. The simulations they create will decide in round 2, and the next level in round 3.

          After round 3, we count the total number of civilizations.

          Then, each of you will bet on whether you are a real person or a simulated person. We will then randomly assign each of you to one of the civilizations in the entire population. If you are assigned to an initial civilization, you are real. Otherwise, you are simulated.

          You get 1 point if you bet correctly."

     - 5-15 min: Explain the rules again and answer questions.

     - 15-20 min: Round 1: initial groups decide for their own civilization (A, B, or C). If they choose B, they create one index card (simulation, level1). If C, two. They write on the card: "GroupX-Level1-1", etc.

     - 20-25 min: Round 2: Each group now makes decisions for each of the level1 simulations they created. For each, they choose A, B, or C. For B, create one level2 card; for C, two level2 cards.

     - 25-30 min: Round 3: Same for level2 -> create level3.

     - 30-35 min: Counting. Each group counts:
          - Their initial civilization: 1
          - Level1: number
          - Level2: number
          - Level3: number
          Total for their branch = 1 + L1 + L2 + L3
          They report to instructor.

     - 35-40 min: Instructor tallies the total number of civilizations (T) and the number of real ones (R = number of initial groups). Writes on board: total persons = T, real persons = R, simulated = T-R, fraction simulated = (T-R)/T.

     - 40-45 min: Betting. Each student writes their name and their bet ("real" or "simulated") on a piece of paper, folds it, and hands it in.

     - 45-50 min: Random assignment. Instructor puts all index cards in a bag. For each student, draw one card. Record the student's name and the civilization (and whether it's real or simulated: real if level0, i.e., initial; simulated if level>=1). 

     - 50-55 min: Check bets. For each student, reveal their civilization's status and their bet. Award 1 point if correct. Tally points.

     - 55-90 min: Debrief (35 min, but we have extra time for transitions).

     Debrief outline:

       1. Show the census: total and fraction simulated. Ask: "What fraction of persons are simulated? How did that happen?"

       2. Show the betting results: how many bet they were real? How many simulated? How many were correct? Note that even though the fraction simulated is high, many might have bet they were real.

       3. Map to the simulation argument:

            - Premise 1: Some civilizations become posthuman (capable of simulations). In the game, we saw that some groups chose B or C -> they became posthuman.

            - Premise 2: Posthuman civilizations are likely to run many ancestor simulations. In the game, we saw that some chose C (many) and some chose B (one) and some chose A (none). So it's not certain.

            - Then, the conclusion about the population: if Premise 1 and 2 hold (and if the fraction of posthuman civilizations that run many simulations is high enough), then the fraction of simulated persons is high.

            - But note: we did not assume that every civilization runs simulations. We only needed some to run many to get the explosion.

       4. The self-locating step: if the fraction of simulated persons is high, then if you are a random person, you are likely simulated. But in the bet, many might have bet against it. Why? Because they thought they were special? Or because they were in the initial group? But the random assignment shows that even if you were in the initial group, you might be assigned to a simulation? Actually, the initial group is real, but the random assignment might assign you to a simulation. This is the key: the initial group is real, but the population of the initial group is small. So if you are randomly selected from the entire population, you are likely from a simulation.

          This is the same as the doomsday argument or the sleeping beauty problem: you should proportion your belief to the populations.

       5. State Bostrom's disjunction: either (1) almost no civilization reaches posthuman, or (2) posthuman civilizations almost never run ancestor-simulations, or (3) we are almost certainly living in a simulation.

       6. The damping rule: what if we had set d>0? Then when a simulated civilization tries to run simulations, there's a chance they become aware and stop. This would reduce the branching. If d is high enough, the tree doesn't explode. So the argument might not go through.

       7. What the game assumes:

            - That simulations are conscious (which we set aside).
            - That simulated civilizations can run their own simulations (same as real ones).
            - That each civilization has the same population (so the fraction is just the count of civilizations).
            - That the base reality is the initial groups (we are not in a simulation of a simulation of ...).

       8. What the game can't test: whether we are in the base reality. The game starts with the base reality. But in the real argument, we don't know if we are in the base.

     The part I am least sure about: the random assignment. It might be confusing that the student who was in the council of a real civilization might be assigned to a simulated civilization. But that is the point: the council member is not necessarily a real person? Actually, in the game, the council members are part of the real civilization? But we are reassigning them arbitrarily. This might break the immersion. 

     Alternative: we don't reassign. We say that each council member is a person in the civilization they started with (the real one). Then, they are all real. But then the bet would be: they should bet they are real. And if they do, they are right. But then we don't see the self-locating move.

     We need the random assignment to break the connection between their role and their status. So I think it's necessary.

     To mitigate: explain that the council members are representatives, but the population of the civilization includes many people. We are randomly selecting one person from the entire population of the world we built.

     Therefore, we proceed.

     Final note: if time runs short in the game, we can skip the level3 round? But then the fraction might not be high enough. We can adjust: if we see that after round2 the fraction is already high, we can stop early? But better to stick to the plan.

     Let's do it.
