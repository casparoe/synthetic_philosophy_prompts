prompt: |-
  I am seventeen and in Year 13, and for the past year I have volunteered two afternoons a week at a small local-history archive in a former mill town in the north of England. The archive is run by a charitable trust with one paid member of staff — an archivist who works twelve hours a week and signs off everything I do — a handful of volunteers, a considerable backlog, and about four linear metres of shelf space remaining. Most of what we hold concerns the town's largest employer, a cotton mill that closed in 1982, and almost all of it comes from the management side: board minute books, wage ledgers in which operatives appear as numbers rather than names, a disciplinary register, and photographs taken for the company newsletter. The workers' side survives in scraps — a union branch minute book covering only 1974 to 1979, a few letters, and a good deal that people remember but nobody wrote down.

  Offers of material arrive roughly three or four times a month, and every week I also have to write catalogue descriptions for boxes accepted years ago by people who are no longer here. Neither task has any framework behind it. Please write me a decision procedure I can actually run, rather than an essay about why archives are not neutral.

  Specifically, I would like:

  1. An ordered set of questions to ask about each offer or each item awaiting description, with what counts as a sufficient answer at each stage, and a clear indication of which stages can end the procedure in a refusal — either refusing the material outright, or accepting it while recording that it cannot be used as evidence of something it does not evidence.

  2. Some help with a distinction I only half understand. I have read that it matters where a silence enters the record: that there are several quite different points at which something can fail to reach a future reader — never being created in the first place, being created but not kept, being kept but not described or looked for, being described but not allowed to carry any weight in the story that is eventually told. Please reconstruct that distinction in a form a volunteer with no training can apply to a box on a table, and tell me which parts of it survive that simplification and which are quietly lost by it.

  3. A short rule for the catalogue entry when the holding is silent: whether to record an absence at all, how to phrase it so that we assert the absence and not its cause, and what to do when the only available explanation would be a guess about why nothing was kept.

  4. An explicit marking of which steps are judgements dressed up as procedure, and which questions must be handed to the archivist or the trustees because they concern values rather than facts — for instance, whether our obligations run primarily to the people the records are about, to the donors, or to future researchers, and what to do when those pull apart.

  The constraints are these. I have about fifteen minutes per offer. The donor is often standing in front of me and is usually a bereaved relative who wants their relative to be shown to have mattered. The outcome has to be written onto a single sheet of A4 that the donor sees and keeps, in language they will not find insulting. I have no archival qualification, no legal training and no palaeography. The procedure must also say what to do when no answer can be obtained at all: no provenance, donor deceased, nobody left alive who can identify the people in a photograph.

  Then please run the procedure on three cases:

  (a) The private diaries and correspondence of the mill's last managing director, offered by his daughter, who is friendly with the trust's chairman and expects the diaries to form the centrepiece of next year's bicentenary exhibition.

  (b) A family album of roughly two hundred unidentified photographs of mill interiors and of groups of workers outside the gates, offered on the condition that we also record an oral-history interview with the donor's mother, who is ninety-one and has advanced dementia; she sometimes names people who cannot have been present.

  (c) A run of typed newsletters produced by a workers' action committee during the 1977 dispute, offered by a former member's son, in circumstances where the committee's own minutes are held by a national union archive two hours away under a seventy-five-year closure — so that anything we accept would be the only accessible trace of the committee's own voice.

  At least one of these should come out in a way I will not like. In particular, the chairman has asked me to supply 'the workers' story' for the bicentenary from our existing holdings. If the honest result of the procedure is that we cannot supply that story from what we hold, and must not assemble it by inference from management records, then please let it say so plainly — and tell me how to put that in writing to someone who outranks me and controls the funding.

  Finally, tell me what this procedure cannot do: where it will predictably misfire, what it will cost us in refused material or offended donors, and what a trained archivist would object to in it.
reasoning: |-
  Hmm, this is a detailed and thoughtful request from a young volunteer archivist working with limited resources. They're clearly grappling with complex archival ethics while facing practical constraints like time pressure and power dynamics. 

  The user needs a concrete decision framework that addresses several layered challenges: appraisal of materials, handling silences in the record, ethical cataloging, and navigating institutional politics. What's impressive is their awareness of archival theory despite being self-taught - they reference concepts like "where silence enters the record" that many professionals struggle with.

  Key pain points emerge:
  - The emotional labor involved when donors are bereaved relatives
  - Power imbalance with the chairman who's friends with a donor
  - Theoretical understanding outpacing practical application skills
  - Fear that proper procedure might contradict institutional goals

  The three test cases are cleverly chosen to stress-test any procedure. Case (a) tests institutional pressure, (b) tests ethical boundaries with unreliable oral history, and (c) tests duplication policies against access barriers. The user specifically wants at least one outcome they won't like - that shows remarkable intellectual honesty.

  I notice they're particularly concerned about "assembling" workers' stories from management records. This suggests they've internalized the critique of archival neutrality without yet having tools to push back. The constraint about writing outcomes on single A4 sheets for donors is brutally practical - reminds me of hospital consent forms.

  The time constraint (15 minutes per offer) means any procedure must be flowchart-simple. We'll need clear kill criteria like "if no provenance and no identification possible → refuse". For silences, we can adapt Caswell's four-part framework but collapse it to two actionable questions: "Was it created?" and "Was it kept?"

  Biggest challenge will be balancing:
  - Donor feelings vs archival integrity
  - Speed vs thoroughness
  - Volunteer limitations vs professional standards

  The "what this cannot do" section will be crucial - must flag where this stripped-down process will leak important context. Particularly worried about how power dynamics (like the chairman connection) aren't addressable through procedure alone.
answer: |-
  Below is a practical decision procedure designed for your constraints, followed by application to your cases and critical limitations. It prioritizes **speed**, **ethical transparency**, and **defensible outcomes** within your 15-minute window.

  ---

  ### **Decision Procedure: "The 15-Minute Appraisal Framework"**
  **Goal:** Accept/Reject material OR flag limitations; document decisions on 1-page A4 for donor.

  #### **STAGE 1: ESSENTIAL QUESTIONS (≤ 5 mins)**  
  *If any answer is "No" or "Unknown," proceed to Stage 1b.*

  1. **"Can we physically store this without harming existing holdings?"**  
     - *Sufficient answer:* Fits within 0.5m shelf space; no mold/insects.  
     - **→ No? REFUSE.** *Reason: "Insufficient storage capacity."*  

  2. **"Is there any legal/ethical barrier to ownership?"**  
     - *Sufficient answer:* Donor owns it; no GDPR-sensitive living-person data (e.g., wage slips < 100 yrs old).  
     - **→ No? REFUSE.** *Reason: "Ownership/legal concerns."*  

  3. **"Can we prove what this is and where it came from?"**  
     - *Sufficient answer:* Basic provenance (e.g., "Grandad’s diaries from attic").  
     - **→ No? REFUSE.** *Reason: "Unverifiable origin."*  

  #### **STAGE 1b: "UNKNOWN" PROTOCOL**  
  - If answers unknown (e.g., photos without IDs, donor deceased):  
    - **Temporary Refusal:** "We may accept if you provide [missing info] by [date]."  
    - **Permanent Refusal if no recourse** (e.g., all potential identifiers dead): "We cannot preserve items we cannot contextualize."  

  #### **STAGE 2: VALUE ASSESSMENT (≤ 7 mins)**  
  *Ask these only if Stage 1 passed.*

  4. **"What gap does this fill?"**  
     - *Sufficient answer:* Identifies a documented silence (e.g., "Shows workers' perspective").  
     - *Insufficient:* "It’s old" or "My dad worked there."  

  5. **"Is this unique or duplicated elsewhere?"**  
     - *Sufficient answer:* "No other copies exist" OR "Duplicates [specific] material at [location]."  
     - **→ Duplicate?** Accept *only* if significantly better quality/accessibility.  

  6. **"What biases/absences are inherent?"**  
     - *Flag:* Management vs. worker origin; creator’s agenda (e.g., "Diary of director → management viewpoint").  

  #### **STAGE 3: CONDITIONS & CATALOGUING RULES (≤ 3 mins)**  
  **For Accepted Material:**  
  - **Oral History Conditions:** Refuse if conditions compromise ethics (e.g., interviewing dementia patient without consent capacity).  
  - **Deeds of Gift:** "We preserve for public access; we may digitize/describe neutrally." (Donor signs).  

  **Cataloguing Silences:**  
  - **Rule:** "Describe *only* what is present. Note absence if absence is evidence."  
    - *Example:* "Wage ledger, 1950–1960. Lists worker numbers only; no names recorded."  
    - **→ Never guess why absent.** Use: "No surviving records of [X] from this period."  

  **For Refused Material:**  
  - **A4 Script:** "Thank you for offering [item]. Due to [storage/legal/provenance] constraints, we cannot accept. We recommend [alternative archive]."  

  ---

  ### **Simplified "Silence" Framework**  
  *(For untrained volunteers)*  

  | **Point of Failure**         | **Volunteer Action**                                  | **Survives?** |  
  |------------------------------|-------------------------------------------------------|---------------|  
  | 1. **Never Created**         | Note: "No known records exist on [topic]."            | ✅ Yes         |  
  | 2. **Created but Not Kept**  | Note: "Common for [worker records] to be discarded."  | ⚠️ Partially   |  
  | 3. **Kept but Not Described**| Audit backlog; prioritize describing neglected items. | ✅ Yes         |  
  | 4. **Ignored in Narrative**  | Flag to archivist: "Our catalogues omit [perspective]." | ❌ No (Requires institutional change) |  

  **Lost in Simplification:**  
  - *Why* silences exist (oppression vs. accident).  
  - Power dynamics behind preservation decisions.  

  ---

  ### **Application to Your Cases**  

  #### **(a) Managing Director’s Diaries**  
  - Stage 1: Pass (storage, legal clear, provenance good).  
  - Stage 2: Gap? "Management perspective already overrepresented." Uniqueness? Likely unique. Bias? Explicitly pro-management.  
  - **Decision:** Accept, **BUT** catalogue: "Personal diaries of [Name], MD (1970–1982). Reflects management viewpoint. No comparable workers' accounts held."  
  - **To Chairman:** "We lack workers' voices to balance this. Using diaries as exhibition centrepiece risks reinforcing management-centric narrative."  

  #### **(b) Photo Album + Dementia Interview**  
  - Stage 1: Photos pass if no storage issues. Interview: **REFUSE** (ethical barrier).  
  - Stage 1b: Photos unidentifiable → **Conditional Refusal**: "Accept photos only if you label identities by [date]."  
  - **Decision:** Refuse interview. Refuse photos unless labelled. Donor script: "We cannot ethically record interviews without informed consent. Photos require IDs to preserve their meaning."  

  #### **(c) Workers’ Newsletters**  
  - Stage 1: Pass (if storage allows).  
  - Stage 2: Gap? "Crucial workers' voice absent in our holdings." Uniqueness? "Originals sealed 75 yrs; our copy = only accessible version."  
  - **Decision:** **ACCEPT IMMEDIATELY**. Catalogue: "Action Committee newsletters, 1977. Sole accessible record of committee’s voice during dispute."  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Fix Power Imbalances:**  
     - Chairman may override refusal of (a). Cost: Reinforces archival bias.  
  2. **Recover Lost Context:**  
     - Unidentifiable photos refused → loss of potential evidence.  
  3. **Handle Subjective "Value":**  
     - "Does this ’matter’?" is a trustee-level decision.  
  4. **Speed vs. Thoroughness Trade-off:**  
     - Will miss nuanced silences (e.g., "why workers didn’t keep records").  
  5. **Donor Relations Risk:**  
     - Refusing emotionally charged items (e.g., dementia interview) may offend.  

  **Professional Objections:**  
  - Oversimplifies appraisal theory (e.g., no weighting of historical significance).  
  - Prioritizes "box-ticking" over iterative research.  
  - Volunteers not trained to assess ethical risks (e.g., oral history ethics).  

  ---

  ### **Memo to Chairman on "Workers’ Story"**  
  > "Our holdings contain no first-hand workers' narratives (diaries, letters, meeting minutes from worker perspectives). The management records we hold (wage books, disciplinary registers) cannot ethically reconstruct workers' experiences, as they reflect only supervisory viewpoints. To present such records as the 'workers' story' would misrepresent history. Recommendations:  
  > 1. Label exhibitions explicitly: "Management's view of workers."  
  > 2. Partner with the union archive for 1977 materials.  
  > 3. Launch an oral history project (post-bicentenary) to fill gaps."  

  ---

  This procedure empowers you to act swiftly and ethically within your limits, while clearly flagging where professional judgement or institutional courage is required. It accepts that archives are *never* neutral but gives you tools to be **transparent** about it.
