prompt: |-
  I'm three years into a PhD in developmental psychology and I've got myself in a knot. My supervisor's big theory is that babies are born with a dedicated number module — a bit of innate machinery that spots when items have been added to or taken away from a scene — and the whole lab tests it with looking-time experiments. In my first year the key effect flat-out failed to replicate. He said the stimuli were too noisy, so we added a measure of infant temperment as a moderator, and the effect duly turned up in one group only. Then my second study found it running the other way in that same group, and his suggestion was that it's a suppression effect you only see once you partial out arousal. Here's the awkward bit: two of these fixes have since gone on to predict things that came out right in brand new studies, so I can't just write the whole enterprise off as post-hoc storytelling. Meanwhile a lab two hours up the road has a much plainer account that handles most of our data without any of the extra machinery, and they've said they'd take me on. Is there a principled way to work out whether his theory is still worth my last two years, or am I just talking myself into staying because my stipend is tied to him?

  Could you lay it out under these headings: "What's actually going on here" (about 200 words), "The case for staying" (about 150), "The case for jumping ship" (about 150), and "What I'd do in your shoes" (about 100).
