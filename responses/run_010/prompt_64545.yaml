prompt: |-
  I sit on the scientific advisory panel for a state environmental agency and we have to settle a fight before our meeting in two weeks. Right now our hazard assessments require each outside expert to hand in a single number for every risk parameter, and staff averages them into the figure we sign off on. Two of our toxicologists want to instead submit a lower and upper bound, plus a short note on how much relevant evidence actually backs the width of the range — their case is that for one particular contaminant the animal data is so thin that any point estimate is fake precision dressed up as a measurement.

  The rest of the panel pushes back on two grounds. First, the statute we report under asks for the agency's best estimate, so ranges don't dissolve the problem, they just dump it on staff who have to pick a number anyway, and nobody elected them. Second, one member says he's personally seen assessments where more data came in and the reported range got *wider* rather than narrower, which he takes to mean interval reporting is worse than useless. Nobody has yet said what we'd even do with a mix of ranges from some experts and points from others.

  Could you draft the memo I'll circulate? It should come down on what the panel adopts for this contaminant — allow ranges, keep point estimates, or some middle option — and it needs to be operational: what staff concretely does with each submission, and how a bound gets turned into the single figure the cleanup standard rests on, or why that step should be refused. Take the widening-range objection head-on rather than swatting it, and give the toxicologists' argument its real weight too. A page or so is plenty, and it's fine if the answer is condition-heavy.
reasoning: |-
  Okay, I need to help draft a memo for this scientific advisory panel. The user is on the panel and they're dealing with a dispute between toxicologists who want to submit ranges with context and others who prefer single point estimates. The panel meeting is in two weeks, so time is tight.

  The key issues are: statute requires "best estimate," staff would still need to pick a number, and there's an objection that ranges can widen with more data. Also, handling mixed submissions (some ranges, some points) hasn't been addressed.

  The toxicologists have a valid point about fake precision when data is thin. For that one contaminant, animal data is sparse, so a single number might mislead. Their proposal includes bounds plus a note on evidence backing the range width - that's important context.

  The opposition arguments: First, legal compliance - the statute says "best estimate," so ranges might not satisfy that and just shift the burden to staff. Second, the anecdote about ranges widening instead of narrowing suggests intervals could be unreliable. Plus, practicality - how to combine different formats.

  For the memo structure: Start neutrally framing the dispute. Then analyze pros and cons of three options: keep points only, allow ranges, or a hybrid. The hybrid could be a good middle ground - experts submit points but can flag uncertainty with optional notes that inform weighting.

  Addressing the widening-range objection head-on: This can happen with poor methodologies, but it's not inherent to intervals. Proper evidence-based ranges should narrow with more data. The problem is execution, not the concept. Recommendations can include methodological standards to prevent this.

  Operational details are crucial. For each option, specify what staff does: With ranges, how to collapse them to a point (e.g., geometric mean, median). For mixed inputs, weight based on uncertainty notes. Hybrid might be cleanest - still get points but uncertainty affects influence.

  Statute interpretation: "Best estimate" could include a defensible point derived from ranges, especially if transparent about uncertainty. The agency isn't dodging responsibility; staff would document the rationale.

  Recommendation: Hybrid approach. Requires all to submit points, but experts can provide uncertainty assessments. Staff then weights submissions accordingly. This balances precision needs with recognizing data limitations, and it's actionable. Include a decision tree for staff.

  End with next steps: Vote at meeting, but this memo lays out options clearly. Aim for one page, so keep it concise but thorough. Make sure the toxicologists' concerns are validated while addressing practical and legal constraints.
answer: |-
  **MEMORANDUM**  
  To: Scientific Advisory Panel Members  
  From: [Your Name], Panel Member  
  Date: [Current Date]  
  Subject: Resolution on Risk Parameter Reporting for [Contaminant X] & Operational Protocol  

  ### **Background**  
  This memo addresses the disagreement regarding risk parameter submissions (e.g., ED₁₀, RfD) for [Contaminant X]. Currently, experts submit single point estimates, which staff average into the agency’s final figure. Two toxicologists propose submitting lower/upper bounds with a qualitative note on the strength of evidence supporting the range width, arguing that sparse animal data renders point estimates misleadingly precise. Opposition cites (1) statutory mandate for a "best estimate," shifting burden to staff, and (2) observed cases where increased data widened ranges, suggesting intervals may not improve accuracy.  

  ### **Options for Panel Adoption**  
  After evaluating arguments, three options emerge:  

  1. **Maintain Point Estimates Only**  
     - **Operational Protocol**: Staff averages all submitted points.  
     - **Pros**: Simple, complies with statute’s "best estimate" language, avoids burden of reconciling ranges.  
     - **Cons**: Ignores valid concerns about "fake precision" with limited data; may obscure uncertainty.  

  2. **Allow Ranges + Notes (Toxicologists’ Proposal)**  
     - **Operational Protocol**:  
       - Experts submit lower/upper bounds and a note (e.g., "Strong Evidence," "Moderate," "Weak/Thin Data").  
       - Staff converts each range to a point estimate using the **geometric mean** (log-scale midpoint, reducing skew).  
       - Staff weights each point in the final average based on evidence notes (e.g., "Strong" = 1.0x, "Weak" = 0.5x).  
       - Final agency figure = Weighted average of all converted points.  
     - **Pros**: Quantifies uncertainty; downgrades poorly supported estimates; transparent.  
     - **Cons**: Adds staff step to collapse ranges; statutory "best estimate" met via weighted point.  

  3. **Hybrid Option: Point Estimates + Mandatory Uncertainty Flags**  
     - **Operational Protocol**:  
       - All experts submit a point estimate **and** select an uncertainty rating (e.g., Low/Medium/High) with 1–2 sentences justifying the rating.  
       - Staff weights points inversely to uncertainty (e.g., High uncertainty = 0.6x weight, Low = 1.0x).  
       - Final agency figure = Weighted average of points.  
     - **Pros**: Retains points for statutory compliance; incorporates uncertainty; operational simplicity.  
     - **Cons**: Less expressive than ranges for highly uncertain parameters.  

  ### **Addressing Key Objections**  
  - **"Statute Requires a Best Estimate; Ranges Shift Burden"**:  
    All options yield a single agency figure. Options 2–3 explicitly document uncertainty but delegate point conversion/weighting to staff under panel-approved criteria. This is consistent with staff’s role executing panel-guided methods. The statute does not preclude weighting based on expert uncertainty.  

  - **"Ranges Can Widen with New Data"**:  
    This is a valid critique of poor interval construction but not intervals *inherently*. Widening ranges occur when:  
    - New data reveals prior models overlooked variability, or  
    - Intervals lack evidence-based anchors (e.g., arbitrary percentiles).  
    **Mitigation**: Require bounds to reflect toxicologically plausible values (e.g., 5th–95th percentile of evidence distribution) and mandate notes justifying width. For [Contaminant X], thin data justifies a wider range; if new data *validly* expands it, transparency is preferable to outdated precision.  

  - **"Mixing Points and Ranges"**:  
    Options 2–3 avoid this by standardizing submissions. Under Option 2, experts submitting points would default to "Strong" evidence (full weight).  

  ### **Recommendation: Hybrid Option (#3) for [Contaminant X]**  
  For [Contaminant X], where data is notably thin, **adopt the Hybrid Option** (Point + Uncertainty Flags). This:  
  - **Honors statutory intent** by providing a clear "best estimate" via weighted points.  
  - **Addresses toxicologists’ concerns** by downgrading influence of highly uncertain estimates.  
  - **Operationalizes cleanly**: Staff applies predefined weights based on expert uncertainty ratings.  
  - **Mitigates widening-range risks** by using points while still quantifying uncertainty.  

  **Staff Workflow Example**:  
  1. Expert submits point (e.g., 0.1 mg/kg) + uncertainty rating ("High" due to sparse data).  
  2. Staff applies weight (e.g., High uncertainty = 0.6x).  
  3. Final figure = Σ (Expert point × Weight) / Σ Weights.  

  ### **Why Not Ranges Here?**  
  While scientifically defensible, ranges require more complex conversion than the Hybrid Option and risk statutory pushback. For future contaminants with robust data, we may revert to points only.  

  ### **Vote & Next Steps**  
  I move we vote at the next meeting on:  
  (A) Hybrid Option for [Contaminant X] only, or  
  (B) Maintain status quo.  
  Staff will draft weighting guidelines for panel review if (A) passes.  

  ---  
  *This balances rigor, compliance, and operational feasibility. The toxicologists’ warning about "fake precision" is compelling for [Contaminant X], but the Hybrid Option integrates it without overburdening staff.*
