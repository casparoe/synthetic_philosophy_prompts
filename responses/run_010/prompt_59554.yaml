answer: |-
  ## The Taste of Salt

  My job is the quiet room. Officially, I’m a Consent Auditor for the Valley Common. Unofficially, I’m the keeper of the tiny, leaking boat called ‘opt-out’. Fifteen years since the Common wired us all together, pooling joy, grief, the stubbed toe, the quiet contentment of tea. Most forget it’s there, like the hum of the old hydro plant. Until they want it gone.

  This morning, it’s Lena Chen from the Flats. The lower town. Forty souls clinging to the riverbank mud. Her file says ‘recurrent drowning sensations’. She sits hunched, her knuckles white on the edge of my worn desk. The Common, when she entered, brought the sharp, metallic tang of river silt – *her* fear – bleeding into the usual low thrum of the valley’s aggregate calm. Behind my eyes, a familiar pressure builds, like trying to push back a wave.

  “It’s the dreams,” Lena whispers. “Not mine. Someone’s… someone else’s panic. Cold water. Every night.” She flinches as the collective lunchtime satisfaction from the Upper District – nine hundred souls enjoying sunshine and hot pastries – washes through the connection. It’s warm, sweet, momentarily overwhelming. Lena’s terror recedes, diluted. For a second, it feels *right*, this balancing act. The many soothing the one. She shudders. “Make it stop. Just me. Please.”

  Processing an opt-out is bureaucratic agony. Forms, neural dampers, temporary isolation protocols. Lena’s eyes, dark and desperate, fix on mine. The salt taste of her fear lingers in my mouth even after she leaves, disconnected. A tiny island in the shared sea.

  ***

  The Town Hall stank of damp wool and collective anxiety. Rain lashed the high windows. The Barrier Proposal. Upper District engineers wanted permanent flood defenses. The cost? The Flats would be designated the natural spillway. When the big flood came – and it was coming, climate models screaming red – the Lower Town would be deliberately sacrificed. Nine hundred saved. Forty lost. Simple math. Except the Common made the math *felt*, not calculated.

  Aris Vance, head of Flood Mitigation, stood at the podium. No villain. Earnest, tired, sleeves rolled up. He projected schematics. “We’ve run the simulations endlessly. Fortifying the Upper Bluffs is feasible. Protecting the Flats… isn’t. Not against what’s coming.” Murmurs rippled, a shared pulse of unease tightening the pressure behind my eyes.

  “I know,” Aris continued, his voice thick with the collective apprehension he was feeling too. “It feels monstrous. Sacrificing neighbors. That’s the old way of thinking. Before *this*.” He tapped his temple. “The Common changes everything. It’s not just numbers on a page anymore. It’s *us*. All of us.”

  He paused, letting the shared nervousness crest. “When the flood hits the Flats… yes, there will be terror. Agony. Loss. Profound loss.” A collective shiver ran through the hall, a phantom chill. Lena’s metallic taste ghosted on my tongue. “But that pain? It won’t be locked away down there. It will be *ours*. Every scream, every moment of despair, shared instantly across the valley. Felt by all nine hundred and forty of us.”

  He leaned forward, sincere, pleading for understanding. “And then, the relief. The overwhelming, undeniable relief of knowing the Upper District – our homes, our schools, our workshops – is *safe*. That nine hundred lives continue, dry and secure. That relief will be ours too. Immense. Sustained. A wave washing over the shared pain.” He looked out, meeting hundreds of eyes. “The pain of the forty is terrible, but finite. The relief of the nine hundred is vast and enduring. Through the Common, we *all* experience both sides. The math isn’t cold anymore; it’s lived. The greater good isn’t abstract; it’s the overwhelming weight of collective relief that ultimately balances, then outweighs, the shared suffering. We endure the storm *together*, and emerge, *together*, relieved. That’s the gift of the Common. We *are* one. This isn’t sacrificing *them*. It’s securing *us*.”

  The logic was terrifyingly clean. The shared sense of dread began, subtly, to shift. The phantom chill of drowning eased, replaced by the imagined warmth of dry safety. The pressure behind my eyes lessened, soothed by the vision of unified relief. For a moment, standing in that hall, breathing the damp air thick with shared feeling, it was almost possible to believe him. The salt taste faded, replaced by a fragile, collective hope.

  ***

  The next day, down in the Flats delivering opt-out paperwork to Old Man Barrett, the logic felt like wet ash. The rain had stopped, leaving the air heavy and the unpaved streets treacherous mud. Barrett’s shack leaned precariously towards the swollen, brown river. He wasn’t thinking about the vote. He was elbow-deep in the guts of a grandfather clock, his workshop a cave of ticking, whirring, chiming timepieces.

  “Consent Auditor!” he boomed, not looking up. “Come to disconnect me from the great communal sigh? Good. The shared contentment over Mrs. Evans’ prize roses yesterday nearly made me misplace a hairspring.” He grinned, oil smudged on his cheek. “Nuisance, this Common. Can’t feel my own peace for the static.”

  He didn’t mention floods or barriers. His world was escapements and pendulums. He needed quiet in his own head to hear the tiny clicks of precision. His survival wasn’t just about *not drowning*; it was about the intricate, solitary joy of making broken things whole again. A joy the Common often drowned in the valley’s emotional weather. The relief of the nine hundred wouldn’t compensate for the silencing of his unique, ticking universe. The Common could share his fear when the water came, but it couldn’t share *this* – the focused satisfaction in his eyes as he fitted a tiny gear. It was his alone.

  Later, I passed Lena Chen’s tiny plot. She was kneeling in the mud, carefully transplanting seedlings into raised beds – defiance against the river and the vote. Not food. Flowers. Delicate, purple blooms I didn’t recognize. Her face, free of the Common’s influence since my visit, was serene, utterly absorbed. She wasn’t preparing for death or yearning for the Upper District’s relief. She was cultivating beauty on the edge of oblivion, a private act the Common couldn’t touch and the collective relief wouldn’t replace. Her peace, like Barrett’s focus, was a separate country.

  Walking back up the steep path towards the Bluffs, the Common’s low thrum returned. I felt the collective background anxiety about the coming storm, the simmering debate over the barrier vote. But underneath it, like a discordant note, was a sharp, localized spike of pain. Old Man Barrett. He’d slipped in the mud outside his shack, twisted his knee. A flare of bright, jagged hurt shot through the connection, sharp as the metallic taste of Lena’s fear. It wasn’t diluted by the valley’s calm. For a few seconds, it was *his* pain, vividly individual, announced to the collective but experienced by him alone in the sucking mud by his door. The Common transmitted the *sensation*, faithfully, but it couldn’t share the *stance* – his muttered curses, the grit in his teeth as he hauled himself up, the profound irritation at his own clumsiness disrupting his work. The shared network carried the signal, but the solitary man bore the weight. The salt taste flooded back, sharp and personal.

  Reaching the top, I looked down. The Upper District sprawled, secure on its bluffs. The Flats huddled below, a fragile brown smudge against the angry river. The logic of the shared feeling, the overwhelming wave of relief Aris promised, still held a mathematical purity. But standing there, the phantom ache of Barrett’s knee echoing faintly in my own leg, the memory of Lena’s seedlings reaching for the grey sky, the logic felt… insufficient. Like building a dam to hold back the sea while ignoring the unique patterns of each drop of water it would crush.

  A faint, sweet scent reached me, carried on a sudden updraft from below. Lena’s unknown flowers. Then, a boot scraped on the path beside me. Someone spat. A gob of phlegm landed squarely on a single, crushed purple bloom struggling through the mud at the path’s edge. It glistened, obscene, on the delicate petals. The Common registered only a minor flicker of disgust, quickly subsumed by the valley’s background hum. The flower, pressed into the muck, didn’t register at all.
