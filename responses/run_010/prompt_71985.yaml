prompt: |-
  I'm trying to work out whether my intuitions about biological function add up to anything, or whether they're just mush, and I'd rather test them against a real account than argue with myself any longer. Verdicts first, then what I want from you.

  1. A healthy frog heart pumps blood — that's its function, full stop. And if I anaesthetise the frog and stop the heart for ten minutes during surgery, I still think the function is there the whole time. It's just not being exercised.
  2. That same heart makes a thumping noise. It does that reliably, the noise is a real causal consequence of the thing working, and people listen for it constantly. But I flatly don't think making noise is the heart's function. Side effect.
  3. Now a hypothetical: some species has a little duct that concentrates a particular salt, does it reliably, and the organism would die without it. But suppose we've got the phylogeny nailed down and the duct is a pure byproduct of some folding event, never selected for anything. I want to say concentrating that salt IS a function of the duct. Notice this is case 2 with the opposite verdict and I cannot tell you what the the difference is. That's the pair I most want sorted.
  4. Feathers in some lineage started out being selected for keeping warm and only later got used for flight. Once the animal is properly flying, I think flight is a genuine function of the feathers and not a mere current use — even though nothing about the flight performance explains why the lineage grew feathers to begin with.
  5. Conversely: suppose a snake lineage where the pelvic nubs have lost even the muscular attachment and do literally nothing at all. I think they have no function any more. I don't want to say they're malfunctioning at holding up hind legs.
  6. A newborn with a congenitally defective heart that has never once pumped a drop: I still say its heart has the function of pumping blood, and thats precisely why we call it a defect rather than a novelty.
  7. A lab prints an organ from a patient's own cells and installs it. The organ has functions, obviously, and I'd say they're the same ones a natural organ would have — despite there being no selection history for this particular object and no designer with any intention beyond copying something.
  8. Artefacts, for contrast: a resin lump manufactured as a paperweight that I use as a doorstop. Stopping the door isn't its function, it's a use. But I don't think being a paperweight is its function either, since it hasn't left my hallway in years. My intuitions about made things seem to be leaking into the biology and I can't tell whether that's a bug.

  My own tentative principle, which I suspect is broken: a trait's function is whatever it does that explains why the thing is still around — where "explains" gets cashed out either by selection or by somebody deliberately keeping it in place. Tell me whether that's a real position or a fudge that papers over 2 and 3.

  What I actually want:

  - a principle, or a small set of candidates, stated properly — precise enough that I could apply it to a case I've never seen before. Go clause by clause and say which of my verdicts each clause is there to capture.
  - which of my verdicts it can't keep. If one has to go, say so and say why; don't quietly reinterpret it until it fits.
  - its verdict on two cases I haven't listed: (a) a duplicated gene where the copies have split the ancestral job roughly in half so that neither does what the original did; (b) a behaviour — some greeting ritual in a social mammal, say — that demonstrably lowers group conflict and that the group would lose if it vanished, but which nobody would call an organ.
  - and whether the two big families here, the selected-effects people and the causal-role people, are genuine rivals or are answering different questions while I've been confusing myself.

  Don't send me off to read anything — I just want the reasoning worked through.
reasoning: |-
  Okay, let me try to unpack this user's query. They're clearly struggling with defining biological function, presenting eight intuitive verdicts and a tentative principle. The core confusion seems to be between selected-effects (SE) and causal-role (CR) theories, especially highlighted in cases 2 and 3 where similar traits get opposite verdicts. 

  Hmm, the frog heart example (1) is straightforward SE—function persists even when not active. But the thumping noise (2) is tricky; it's a reliable effect but intuitively not a function. Then the salt duct (3) is a counterexample: no selection history yet strong functional intuition. That's where SE struggles. 

  The feather evolution (4) shows how SE handles novel functions—exaptation. The vestigial snake nubs (5) and defective heart (6) fit SE well too. The lab-printed organ (7) is interesting—no selection history, so SE might falter, but CR works. Artefacts (8) muddy the waters by mixing design with use.

  The user's tentative principle ("explains why it's still around") feels like a SE-CR hybrid. But it fails cases 2 and 3: noise doesn't explain the heart's persistence, while the salt duct's activity *does* explain its presence despite no selection. 

  For the extra cases: gene duplication (a) fits SE if we consider stabilizing selection on the new roles. The greeting ritual (b) is clearly CR—it maintains group function regardless of origin. 

  The big reveal: SE and CR aren't rivals but complementary. SE explains *why* a trait exists, CR explains *how* it contributes *now*. That resolves the salt duct paradox (3)—CR calls it functional, SE doesn't. The user's intuitions aren't mush; they're unconsciously switching frameworks based on context. 

  Final note: their artefact confusion (8) stems from conflating design intent (SE-like) with current use (CR-like). Biology lacks "intent," so SE uses natural selection as proxy. The lab organ (7) is CR's triumph—no history needed. 

  ...I think I'll structure the reply around the SE-CR duality upfront, then map each verdict to the framework that best explains it. The salt duct (3) and noise (2) contrast will anchor the discussion. Must emphasize that both theories are valid—they're answering different questions. And yeah, the user's hybrid principle isn't broken, just underspecified; it works if we clarify whether "explains why it's still around" refers to historical selection (SE) or current maintenance (CR).
answer: |-
  Your intuitions aren't mush—they're grappling with the core tension between two major theories of function: **Selected-Effects (SE)** and **Causal-Role (CR)**. They *are* genuine rivals but address subtly different questions. Your hybrid principle leans SE but borrows from CR, causing the tension in cases 2 and 3. Here's a precise principle set, verdict mappings, and resolutions:

  ---

  ### **Core Principles**
  1. **Selected-Effects (SE) Function:**  
     *A trait T has function F iff F is an effect of T that contributed to the fitness of ancestors, causing T's selection/persistence in the lineage.*  
     → Explains **why T exists** (historical explanation).

  2. **Causal-Role (CR) Function:**  
     *A trait T has function F in system S iff F is a causal contribution of T to S's current capacities, where S relies on F to achieve some goal (e.g., survival).*  
     → Explains **what T does now** (systemic explanation).

  ---

  ### **Your Verdicts Mapped**
  | Your Case | Your Verdict | SE Verdict | CR Verdict | Which Principle Captures It |
  |-----------|--------------|------------|------------|-----------------------------|
  | **1. Frog heart (anaesthetized)** | Function persists | ✅ (Historical selection) | ✅ (Still part of blood-pumping system) | **SE**: Selection history unchanged. |
  | **2. Heart thumping noise** | Not a function | ✅ (Noise wasn’t selected for) | ❌ (Noise contributes to monitoring, but CR requires *essential* contribution to survival) | **SE**: Noise is a byproduct, not selected. |
  | **3. Salt-concentrating duct (no selection)** | IS function | ❌ (No selection history) | ✅ (Duct *currently* maintains salt balance → essential for survival) | **CR**: Current causal role is critical. |
  | **4. Feathers exapted for flight** | Flight is function | ✅ (Flight *now* under selection; SE allows new functions if maintained by selection) | ✅ (Flight is a key current contribution) | **SE**: Flight is *now* a selected effect. |
  | **5. Vestigial snake nubs** | No function | ✅ (No selection maintains them) | ✅ (No current causal role) | Both: Alignment. |
  | **6. Defective newborn heart** | Pumping is function | ✅ (Selected effect, even if broken) | ❌ (Never pumped → no causal role) | **SE**: Historical function defines "defect". |
  | **7. Lab-printed organ** | Has natural function | ❌ (No selection history) | ✅ (Performs causal role in system) | **CR**: Mimics causal role of evolved organs. |
  | **8. Resin lump as doorstop** | Neither is function | ❌ (SE applies to biology, not artefacts*) | ❌ (CR: "Function" requires systemic integration; ad hoc use ≠ function) | **Neither fits perfectly** (Artefacts need *design* theory). |

  ---

  ### **Verdicts That *Must* Go (and Why)**
  - **Case 2 (Noise):** Your "not function" verdict **holds under SE** but **fails under CR** if the noise is non-essential. CR *could* call it a function if diagnostically critical, but your intuition rejects this → **CR partially conflicts**.
  - **Case 3 (Salt duct):** Your "is function" verdict **holds under CR** but **fails under SE**. SE *must* deny it → **SE conflicts**.
  - **Case 7 (Lab organ):** Your "has function" **fails under SE** (no selection) but **holds under CR** → **SE conflicts**.

  **Resolution:** Your intuitions are CR-heavy for *current maintenance* (cases 3,7) and SE-heavy for *history/defects* (cases 1,6). **No single theory saves all 8 verdicts.** You must sacrifice:
  - **SE sacrifices Case 3** (salt duct isn’t functional).
  - **CR sacrifices Case 6** (defective heart has no function if it never pumped).

  ---

  ### **New Cases Analyzed**
  **(a) Duplicated gene splitting ancestral job:**  
  - **SE:** Both copies have functions if *each new role was selected* (e.g., subfunctionalization).  
  - **CR:** Both have functions if each contributes indispensably to the organism.  
  → **Your intuition likely holds under both.**

  **(b) Conflict-reducing greeting ritual:**  
  - **SE:** Function only if *ritual was selected for reducing conflict*.  
  - **CR:** Function if it *currently maintains group stability* (even if not selected).  
  → **SE may deny it; CR affirms it.** Your "nobody calls it an organ" is irrelevant—CR applies to any trait in a system.

  ---

  ### **Selected-Effects vs. Causal-Role: Rivals or Complementary?**
  - **They are rivals** because they define "function" differently: SE is **historical** (etiological), CR is **ahistorical** (systemic).  
  - **But they answer distinct questions:**  
    - SE: *"Why does T exist?"*  
    - CR: *"What does T do now?"*  
  - **Your confusion arises** because you want *one* concept to answer both questions. In biology, traits can have a CR function *without* an SE function (salt duct) or an SE function *without* a CR function (vestigial nub).  
  - **Artefacts (Case 8)** muddy this because they involve *designer intentions* (a third theory), not natural selection.

  ---

  ### **Your Tentative Principle: Broken?**
  *"A trait's function is whatever it does that explains why the thing is still around."*  
  - **SE Interpretation:** "Explains why still around" = past selection → Captures cases 1,4,5,6 but **fails Case 3** (salt duct wasn’t selected).  
  - **CR Interpretation:** "Explains why still around" = current maintenance → Captures cases 3,5,7 but **fails Case 6** (defective heart isn’t maintained by pumping).  
  → **It's a fudge:** Ambiguous between SE/CR and papers over Cases 2 & 3 by not defining "explains."

  ---

  ### **Final Recommendation**
  1. **Adopt both theories explicitly:** Use SE when discussing *evolutionary origins/norms* (e.g., defects, exaptations). Use CR when discussing *current physiology/ecology* (e.g., salt ducts, lab organs).  
  2. **For artefacts**, use **intentional design** theory (function = intended purpose).  
  3. **Sacrifice:**  
     - **Case 3 (salt duct):** No SE function, but CR function.  
     - **Case 6 (defective heart):** SE function exists, CR function does not.  

  This resolves your core tension: **Case 2 (noise) lacks SE function and isn’t a CR function** (unless diagnostically essential), while **Case 3 (salt duct) lacks SE function but has CR function**. Your intuitions are consistent if you accept dual definitions. No reading needed—just decide which question (history vs. current role) matters for your context.
