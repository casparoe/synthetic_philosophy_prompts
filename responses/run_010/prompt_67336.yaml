  The Bayesian view seems strongest here. It accounts for the asymmetry through prior probabilities and domain knowledge. The difference in evidential weight isn't about logical form but about what's already known. The same report (non-black non-raven) has different confirmatory power based on background knowledge. This aligns with the Bayesian quantification response.

  Hempel's dissolution is similar but less precise. Relativizing to total evidence is part of Bayesianism, but Bayesianism quantifies the change in probability. The dissolution might not adequately explain why the reports feel different in each world.

