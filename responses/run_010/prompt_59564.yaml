answer: |-
  **Logline:** The only man who knows what Sleeping Beauty actually writes in the experiment can't tell the warring researchers - and isn't sure it would matter if he did.

  ***

  Stan’s thumb traced the groove in the tally mark on the storeroom door. Monday/Tuesday: two hundred and seventy-four slashes. Monday-only: one hundred and thirty-eight. He didn’t need the scratch marks anymore, not really. The shoebox under the sink held the truth.

  He lifted the lid. The smell of dust and old paper met him. Inside lay years of index cards, each folded once, corners softened. He picked one near the top. Bold, looping script: *Heads*. Next, a cramped, precise *Tails*. One card near the middle had shaky letters: *Tails?* Another was smudged, erased and rewritten. One card, startlingly, held not a word but a tiny, intricate drawing of a coin spinning in mid-air.

  He knew the drill upstairs. Flip the coin Sunday night. Heads, wake the subject Monday, ask the question: *What do you think the coin showed?* Tails, wake her Monday, drug her back to sleep, wake her *again* Tuesday, ask the same thing each time. She never remembers Tuesday if it happens. They call her "the subject," but Stan knows the current one is Elara. He sees her arrive, pale and blinking.

  Her answers filled the box. *Heads*. *Tails*. *Heads*. *Tails*. *Tails*. *Heads*. Over and over. The Monday/Tuesday tally – the "Tails" days – was twice as long as the Monday-only "Heads" days. Simple as the worn linoleum under his feet. If you asked Stan what the coin likely showed when she wrote *Tails*, he’d point to the door. Two chances out of three.

  But upstairs, the "Monday Men" and the "Two-Timers" warred. The Monday Men insisted every single awakening felt the same: one shot, fifty-fifty. The Two-Timers shouted about frequency, about the extra wake-up being part of the truth. Budgets shifted, interns scurried, papers piled high. Neither side ever looked in the bin. Protocol said shred, so they assumed shredding happened. Stan emptied the bin. He kept the cards.

  Tonight, emptying the observation room bin, he heard voices before he saw the light spilling under the door. Peeking through the reinforced glass, he saw Elara awake, not groggy yet, sitting up. A researcher, one of the fervent Monday Men judging by the "One Shot!" button pinned crookedly to his lab coat, held out a fresh card and pen.

  "Elara," the researcher said, overly gentle. "Just your best guess. No memory, just you, right now. What feels likely?"

  Elara looked past him, her gaze unfocused, drifting towards the one-way mirror where Stan stood hidden. He held his breath. He knew the tally. He knew the odds the box screamed. He knew what the Two-Timers would say she *should* say.

  She took the pen. Her hand hovered. Stan saw the slight tremor. She wasn't thinking about tallies or departments. She was alone in her head, in this bright, cold room, with only the lingering feeling of having just woken up *somewhere*, *sometime*. She looked down at the blank card as if it were a map of a place she’d never seen.

  She wrote slowly, deliberately: *One in two*.

  The researcher beamed. "Thank you, Elara." He took the card, glanced at it, and dropped it into the bin beside the bed before turning to make a note.

  Stan slipped away before the lights dimmed for the next sleep. Later, alone in the storeroom, he unfolded the new card. Elara’s handwriting was clear, steady. *One in two*. He smoothed the card, feeling the slight indentation of the pen. He placed it carefully atop the others in the shoebox, the weight of it adding nothing the tally didn't already know, yet feeling heavier than all the rest. He closed the lid softly, the muffled sound of an argument drifting down the hall – "*frequency!*" "*isolation!*" – as he clicked off the light.
