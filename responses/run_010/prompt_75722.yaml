answer: |-
  ### Research Proposal: Aggregating Tiny Chances — A Population Ethics Approach to Expected-Value Fanaticism  

  **1. Introduction and Research Question**  
  Expected-value fanaticism—exemplified by Pascal’s Mugging, where a rational agent ought to accept a minuscule probability of an astronomical payoff—remains a divisive problem in decision theory. The debate centers on whether agents should act on vanishingly small probabilities of immense gains (e.g., mitigating existential risks) or dismiss such acts as irrational. Current approaches focus exclusively on refining decision-theoretic axioms (e.g., continuity, independence, or bounded utility) or constraining probability assignments. Yet structurally, this problem mirrors aggregation paradoxes in population ethics, like the Repugnant Conclusion: both involve unbounded summation across countless tiny contributions (probabilistic outcomes or individual welfare) that yield counterintuitive verdicts. This proposal asks: *Can formal tools from population ethics—specifically, critical-level and number-dampening views—be adapted to decision theory to resolve expected-value fanaticism, avoiding mugging counterexamples while preserving defensible astronomical-stakes conclusions?*  

  **2. The Gap in Existing Approaches**  
  Existing solutions treat fanaticism as a problem isolated to the "tails" of probability distributions. Pro-fanaticism arguments (e.g., unbounded utility) accept extreme trade-offs but invite muggings; anti-fanaticism fixes (e.g., probability discounting or utility bounds) avoid muggings but reject high-stakes acts like low-probability disaster prevention. Both sides overlook the structural kinship with population ethics, where aggregation puzzles are addressed by moderating *how* individual contributions sum. For instance, critical-level utilitarianism avoids the Repugnant Conclusion by assigning a "fixed cost" to each new life, preventing tiny welfare gains from dominating. Similarly, number-dampening views downweight large populations. These tools remain unexplored in decision theory, leaving a gap: they might resolve fanaticism without ad hoc axioms, but no one has tested whether they transfer coherently or merely repackage old problems.  

  **3. Method: Transferring the Population Ethics Toolkit**  
  I will formalize decision-theoretic analogues of critical-level and number-dampening frameworks. For critical levels: instead of summing utilities linearly, outcomes are evaluated as \(\sum (u_i - c)\) for some constant \(c\), where \(c\) acts as a threshold for "meaningful" payoffs. For number-dampening: aggregate value is \(\sum f(u_i)\) or \(\sum u_i / g(n)\), where \(f\) is concave or \(g\) grows with outcome size, damping the influence of vast numbers of tiny gains. These models will be tested against two benchmarks:  
  - **Mugging cases**: Does the model reject paying $5 for a \(10^{-100}\) chance of \(10^{100}\) utils?  
  - **Astronomical-stakes cases**: Does it endorse a \(10^{-100}\) chance of preventing human extinction (assuming extinction has near-infinite disutility)?  

  *Defense against the axiomatic alternative*: Simply axiomatizing the tails away (e.g., "discount tiny probabilities") is arbitrary and risks false negatives—e.g., dismissing legitimate low-probability interventions. Population ethics tools are preferable because they address aggregation *systematically*, preserving rationality in high-stakes contexts while blocking incoherent sums. If successful, this offers a unified account of aggregation across ethics and decision theory.  

  **4. What Success and Failure Look Like**  
  - **Positive result**: A decision rule that (a) rejects all Pascal’s Mugging variants (e.g., no payoff below critical level \(c\) affects choices), (b) endorses "astronomically important" acts (e.g., mitigating existential risk), and (c) explains why this asymmetry holds without bounded utility. For instance, a dampened model might approve a \(10^{-100}\) chance of saving \(10^{10}\) lives but reject a \(10^{-100}\) chance of gaining \(10^{10}\) utils for a mugger.  
  - **Failure modes**:  
    1. **Muggings persist**: The transferred tools fail to block counterexamples (e.g., dampening is too weak for extreme cases).  
    2. **Astronomical stakes lost**: The tools overcorrect, rejecting high-stakes acts (e.g., \(c\) is set too high).  
    3. **Notational transfer**: The models reproduce existing impossibility results (e.g., a dampening function implies bounded utility, collapsing into familiar axioms).  
    4. **New impossibilities**: The hybrid framework violates core decision norms (e.g., dominance or transitivity).  

  **5. Work Plan**  
  | Period | Task | Deliverable |  
  |--------|------|-------------|  
  | 1–2    | Formalize population ethics tools (critical-level, number-dampening) for decision theory. | Draft model definitions. |  
  | 3–4    | Test models against mugging cases; identify initial flaws. | Working paper: "Can Critical Levels Defuse Pascal’s Mugging?" |  
  | 5–6    | Test models against astronomical-stakes cases (e.g., existential risk). | Revised models accommodating stakes. |  
  | 7–8    | Compare models to axiomatic approaches; check for notational equivalence. | Journal article draft. |  
  | 9–10   | Stress-test for failure modes (e.g., violations of rationality axioms). | Negative-result paper or model refinements. |  
  | 11–12  | Synthesize findings; evaluate whether transfer yields novel insights. | Fellowship manuscript. |  

  **6. Scope Risk**  
  The largest risk is unanticipated formal incompatibility. If population ethics tools require iterative adjustments (e.g., context-dependent critical levels) or generate complex dynamics (e.g., non-additive aggregation), developing consistent decision rules could exceed 12 months. For efficiency, I will prioritize simple, testable models first and scope-extend only if initial results are promising.  

