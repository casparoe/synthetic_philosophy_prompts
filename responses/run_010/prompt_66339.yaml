prompt: |-
  Argued with a friend till 2am about whether norms like dueling or footbinding actually died because someone finally won the argument, or because they stopped being honorable — he's an Appiah person, I think honor gets credit for alot of what is just ordinary self-interest shifting. We didn't settle it and honestly I don't care that much about the 19th century, but I want to use the argument at work.

  I run a four-person team at a regional nonprofit that partners with community groups trying to kill a norm that's hurting people: families not calling an ambulance for an overdose because it'd be a disgrace on the house, a building trades local where filing a safety complaint makes you a rat, tenants not reporting a slumlord. We get maybe ten requests a year and can take three, and a badly run campaign makes the norm stickier, so the intake decision is basically the whole job. Right now we decide by gut plus whoever has the best grant writer. Nobody on my team has read any of this literature and nobody has a social science degree.

  Give me a diagnostic procedure we could actually run in a two-hour intake meeting: the questions in order, what counts as a real answer to each rather than it's complicated, and how to tell whether the thing holding a norm up is what people believe, what pays, or what earns respect — plus which lever each diagnosis implies. Mark where it should output decline or not-yet, where it hands the call to me because it's values not facts, and which steps are judgment wearing a flowchart costume. Then run it on two of my cases, and one of them has to come out against us, like where the only lever that works is one my board or the funder would refuse.

  Last thing: be straight about what breaks when you point a theory built on century-scale national practices at a two-year neighborhood problem.
reasoning: |-
  We are going to design a diagnostic procedure for evaluating whether a harmful norm can be effectively challenged in a specific community context. The procedure is based on understanding three key pillars that sustain a norm: 
   1. Beliefs (what people think is true)
   2. Material interests (what pays or costs for individuals)
   3. Honor/respect (what earns or loses respect in the community)

  We'll structure the intake meeting around a series of questions that probe these pillars, and then determine which lever (changing beliefs, changing material incentives, or changing honor dynamics) might be most effective in shifting the norm.

  The procedure will be a flowchart-like series of steps, but we acknowledge that judgment is required at each step. We will mark:
   - Where the decision is to decline or put on hold (not-yet)
   - Where the call should be handed to you (the team lead) because it involves values or strategic decisions beyond the facts
   - Which steps are judgment disguised as a flowchart (i.e., require interpretation)

  We'll then apply this procedure to two cases (one that is a clear "go" and one that is a "decline" or "not-yet") and one that comes out against us because the only effective lever is unacceptable to the board or funder.

  Finally, we'll discuss the limitations of applying theories built for century-scale national practices to short-term neighborhood problems.

  ---

  **Diagnostic Procedure for Intake Meeting (2 hours max)**

  **Step 0: Pre-meeting Preparation (before the intake meeting)**
  - Request from the community group: a written description of the norm, the harm it causes, and any available data (e.g., how common the behavior is, any incidents, existing efforts to change it).
  - Assign one team member to be the facilitator for the meeting and another to take notes.

  **Step 1: Define the Norm and Harm (10 minutes)**
  - **Question 1:** What exactly is the harmful behavior we are trying to change? (Be specific: e.g., "families not calling 911 during an overdose")
  - **Question 2:** What is the norm that sustains this behavior? (e.g., "calling 911 brings disgrace by revealing drug use in the family")
  - **Question 3:** What is the harm? (quantify if possible: e.g., "X deaths in the past year in this community because of delayed medical care")
  - **Real Answer:** Clear, specific, and evidence-based (anecdotes are acceptable but note them as such). If the harm is not clear or the norm is vaguely defined, stop and ask for more info (output: not-yet, pending more data).

  **Step 2: Identify the Pillars Holding Up the Norm (30 minutes)**
  We break down the norm into the three pillars and ask:

  **Beliefs (What people believe)**
  - **Question 4:** What do people believe will happen if they violate the norm? (e.g., "They believe that calling 911 will lead to police involvement and arrest, not just medical help")
  - **Question 5:** Are these beliefs accurate? (e.g., Is there actually a high chance of arrest? Or is there a Good Samaritan law?)

  **Material Interests (What pays)**
  - **Question 6:** What are the material costs of violating the norm? (e.g., "Calling an ambulance costs $1000 and the family can't afford it")
  - **Question 7:** What are the material benefits of complying? (e.g., "Avoiding the ambulance cost saves money")

  **Honor/Respect (What earns respect)**
  - **Question 8:** What is the social reward for complying with the norm? (e.g., "Being seen as a family that handles its own problems")
  - **Question 9:** What is the social punishment for violating the norm? (e.g., "Being shamed as a family with a drug problem")

  **Real Answers:** For each pillar, we need concrete examples from the community. If we cannot get at least one concrete example for each pillar from the community group, mark that pillar as "unknown". We are not looking for "it's complicated" but for specific mechanisms.

  **Step 3: Assess Changeability (40 minutes)**
  For each pillar that is present (and not "unknown"), we ask:

  - **Question 10 (Beliefs):** Can we easily correct the false belief? (e.g., If the belief about police involvement is wrong because of a Good Samaritan law, then education might work.)
  - **Question 11 (Material):** Can we change the material incentives? (e.g., If cost is the issue, can we provide free naloxone or advocate for free ambulance services?)
  - **Question 12 (Honor):** Can we shift what is honorable? (e.g., Can we find influential community members to model calling 911 and frame it as responsible?)

  Then, we score each pillar on two dimensions:
  1. **Strength:** How strongly does this pillar hold the norm in place? (High, Medium, Low)
  2. **Changeability:** How easy is it to change this pillar with our resources? (High, Medium, Low)

  *This step is judgment wearing a flowchart costume.* We use a simple 3x3 grid for each pillar and assign scores based on team discussion.

  **Step 4: Identify the Weakest Pillar (20 minutes)**
  - Look for the pillar with the highest changeability and/or the lowest strength. That is our target lever.
  - If one pillar is both strong and hard to change, but the others are weak/easy, we might still proceed by targeting the weak ones.
  - If all pillars are strong and hard to change, the norm is resilient and we may decline.

  **Step 5: Check for Red Flags (10 minutes)**
  - **Question 13:** Is there a group that strongly benefits from the norm (e.g., slumlords in the tenant case) and will resist?
  - **Question 14:** Are there legal or structural barriers (e.g., no Good Samaritan law in the state)?
  - **Question 15:** Does our proposed lever conflict with our values or our funder's rules? (e.g., if the only way to change the material incentive is to pay people to call 911, but our funder prohibits cash incentives)

  **Step 6: Decision (10 minutes)**
  - **Output:**
    - **Go:** If we have identified at least one pillar that is changeable (with high or medium changeability) and we have a lever that is acceptable and feasible.
    - **Not-yet:** If we lack data (from Step 1) or if the pillars are unclear (Step 2), we ask the community group to gather more info.
    - **Decline:** If the norm is too entrenched (all pillars strong and low changeability) or if the only effective lever is unacceptable (e.g., paying off a corrupt union boss to change a safety norm).
    - **Hand to Lead:** If the decision involves a values trade-off (e.g., we can shift the norm by working with a controversial leader) or if there is a strategic dilemma (e.g., the campaign might have unintended consequences).

  ---

  **Apply to Cases**

  **Case 1: Overdose and Ambulance Calling Norm**
  - **Norm:** Families do not call ambulance during overdose due to fear of disgrace and police involvement.
  - **Harm:** Increased overdose deaths.

  *Step 1:*
  - Behavior: Not calling 911 during overdose.
  - Norm: Disgrace on family if outsiders know about drug use.
  - Harm: 15 overdose deaths in the past year in the neighborhood (data from community health center).

  *Step 2: Pillars*
  - Beliefs: Families believe calling 911 leads to police arrest and stigma. (But in reality, the state has a Good Samaritan law that protects callers from drug charges.)
  - Material: Cost of ambulance is $1200, which many cannot afford. Also, fear of losing job if arrest occurs (even if unfounded).
  - Honor: Families seen as "strong" if they handle it privately. Violating norm leads to shame and gossip.

  *Step 3: Assess Changeability*
  - Beliefs: Strength (High) because fear is deep. Changeability (Medium) because we can educate about the Good Samaritan law with trusted messengers.
  - Material: Strength (High) because cost is real. Changeability (Low) because we cannot change ambulance costs (but maybe provide free naloxone training and kits?).
  - Honor: Strength (High). Changeability (Medium) if we can get community leaders to reframe calling 911 as saving a life, not weakness.

  *Step 4: Weakest Pillar?* 
  Beliefs are changeable (Medium) and honor is also potentially changeable (Medium). Material is hard.

  *Step 5: Red Flags?* 
  No strong opposing group. Legal barrier: Good Samaritan law exists, so we can use it.

  *Step 6: Decision?* 
  **Go**. We can design a campaign with:
  - Education about the Good Samaritan law (belief lever)
  - Enlisting respected community leaders to model calling 911 (honor lever)

  **Case 2: Building Trades Safety Complaints (The Decline Case)**
  - **Norm:** Workers do not file safety complaints because it's seen as "ratting".
  - **Harm:** Increased injuries and fatalities on job sites.

  *Step 1:*
  - Behavior: Not reporting safety violations.
  - Norm: Being a "rat" is the worst thing you can be in the union.
  - Harm: 12 serious injuries in the past year, one death.

  *Step 2: Pillars*
  - Beliefs: Workers believe complaining will get them fired (or blacklisted) and that the union won't protect them.
  - Material: If they complain, they might lose overtime or get assigned to bad jobs. If they don't complain, they avoid retaliation.
  - Honor: Respect for being a "team player". Filing a complaint loses respect and isolates the worker.

  *Step 3: Assess Changeability*
  - Beliefs: Strength (High). Changeability (Low) because the belief is often true (retaliation is real and hard to prove).
  - Material: Strength (High). Changeability (Low) because we cannot change the power dynamics or provide compensation for lost work.
  - Honor: Strength (Very High). Changeability (Low) because the "rat" norm is deeply embedded in union culture and tied to solidarity. Even if we try to honor safety whistleblowers, it might backfire.

  *Step 4: Weakest Pillar?* None. All are strong and hard to change.

  *Step 5: Red Flags?* 
  Yes: The union leadership benefits from not having complaints (avoids delays, keeps contractors happy). They will resist.

  *Step 6: Decision?* 
  **Decline** because all pillars are strong and changeability is low. A failed campaign could make the norm stickier.

  **Case 3: Tenants Not Reporting Slumlord (The Unacceptable Lever Case)**
  - **Norm:** Tenants do not report poor conditions to the city because they fear eviction and are told "don't bite the hand that feeds you".
  - **Harm:** Health hazards (mold, lead paint, broken heat in winter).

  *Step 1:*
  - Behavior: Not reporting code violations.
  - Norm: Reporting is ingratitude and might lead to retaliation.
  - Harm: Documented cases of asthma from mold, lead poisoning in children.

  *Step 2: Pillars*
  - Beliefs: Tenants believe reporting leads to eviction or rent increases. (Often true: slumlords retaliate.)
  - Material: Reporting might lead to costly repairs passed on as rent increases, or eviction. Not reporting avoids these costs.
  - Honor: Tenants are expected to be grateful for having a roof. Reporting is "causing trouble".

  *Step 3: Assess Changeability*
  - Beliefs: Strength (High). Changeability (Low) because the belief is accurate (retaliation is common).
  - Material: Strength (High). Changeability: We might change this by providing legal protection against retaliation, but that takes time. Alternatively, we could organize a rent strike, but that's high risk.
  - Honor: Strength (Medium). Changeability (Medium) if we can reframe reporting as standing up for rights.

  *Step 4: Weakest Pillar?* 
  Honor might be changeable if we can find respected tenants to lead. Material is hard.

  *Step 5: Red Flags?* 
  The only lever that might work is organizing a rent strike (material lever) to force the landlord to fix issues. But:
  - Our board is against "confrontational tactics".
  - Our funder prohibits supporting rent strikes.

  *Step 6: Decision?* 
  **Hand to Lead** because the values conflict: we could try an honor campaign (reframing) but it might not work without material support. The effective lever (rent strike) is blocked by our constraints. Alternatively, we might decline.

  ---

  **Limitations of the Theory for Neighborhood-Scale Problems**

  1. **Time Scale:** National norm shifts (like dueling) took decades and involved broad cultural changes. Neighborhood campaigns have 1-2 years. We can't wait for generations to change; we need levers that work fast.

  2. **Scale and Heterogeneity:** A neighborhood is not a nation. It might have sub-groups with different norms. Our intervention might work in one block but not another.

  3. **External Forces:** National trends (e.g., the opioid crisis, housing market) can swamp local efforts.

  4. **Measurement:** We can't run controlled experiments. We rely on proxies for success.

  5. **Interconnected Norms:** A norm (e.g., not reporting a slumlord) might be tied to other norms (e.g., distrust of government) that we can't address.

  6. **Honor Dynamics:** In small communities, honor is personal and relational. It's easier to shift with targeted influencer work than in a nation, but also harder because the stakes are immediate (you live next door to the person you shame).

  **Adaptation:** We focus on pillars that are *local* and *actionable*. We look for "tipping points" (e.g., getting a few key families to change) rather than society-wide change.

  This procedure helps structure the discussion and forces us to look at evidence, but it is not a crystal ball. It reduces the chance of a "badly run campaign" by identifying the weakest pillar and the right lever, but success still depends on execution.
answer: |-
  Here's a practical diagnostic procedure for your intake meetings, designed to fit within a 2-hour window. It draws on Appiah's honor theory but balances it with material/self-interest analysis. I'll flag key pitfalls when applying macro-theories to micro-contexts at the end.

  ---

  ### **Diagnostic Procedure: The "Three Pillars" Assessment**  
  **Time:** 120 mins total  
  **Goal:** Determine if the norm is held up by beliefs, material interests, or honor—and whether you have an acceptable lever to pull.  

  #### **Step 1: Define the Norm & Harm (15 mins)**  
  - **Question:** *"What specific behavior causes harm, and what is the exact rule violating it?"*  
    - **Real answer:** Concrete examples (e.g., "Last month, 3 overdoses went unreported in Building X"). Avoid vague claims like "people are scared."  
    - **Red flags:** No clear harm evidence → **Output: Not-yet** (request data).  

  #### **Step 2: Map Enforcement (20 mins)**  
  - **Question:** *"Who punishes violators, and how?"*  
    - **Real answer:** Identify specific actors (e.g., "Landlords retaliate by evicting," or "Union members ostracize 'rats'").  
    - **Judgment step:** If punishment is diffuse (e.g., "everyone just knows"), it’s likely honor-driven. If centralized (e.g., a boss), it’s material/belief.  
    - **Red flags:** No clear enforcer → **Output: Decline** (norm may be weak/irrelevant).  

  #### **Step 3: Probe the Three Pillars (45 mins)**  
  Test each pillar with targeted questions. **Stop when one pillar dominates.**  

  | **Pillar**       | **Diagnostic Question**                                  | **"Real Answer" Looks Like**                                                                 | **Weak Signal**                                  |
  |-------------------|----------------------------------------------------------|----------------------------------------------------------------------------------------------|--------------------------------------------------|
  | **Beliefs**       | *"What do people think will happen if they comply?"*     | Evidence-based fears (e.g., "90% believe ambulances = police raids").                        | Relies on facts you can disprove (e.g., actual ambulance protocols). |
  | **Material Interest** | *"What do people gain/lose financially/survival-wise by complying?"* | Tangible costs/benefits (e.g., "Filing a complaint costs $200 in legal fees" or "Lose overtime shifts"). | Costs are reversible (e.g., via subsidies). |
  | **Honor**         | *"What social status do people gain/lose by complying?"* | Social rewards (e.g., "Seen as loyal" or "Avoid being called a ‘traitor to the block’").     | Status symbols are observable (e.g., community leaders model behavior). |

  - **How to tell which pillar dominates:**  
    - **Beliefs:** Fear stems from *information gaps* (e.g., misunderstanding Good Samaritan laws).  
    - **Material:** Behavior changes when *costs/benefits shift* (e.g., offering cash for reports).  
    - **Honor:** Behavior persists *even when irrational* (e.g., continuing duels after they’re illegal).  
  - **Judgment step:** If all pillars seem equally strong → **Hand to you** (requires values call on feasibility).  

  #### **Step 4: Identify Reversible Points (30 mins)**  
  - **Question:** *"What’s the smallest change that could break this norm?"*  
    - **Real answer:** A testable intervention (e.g., "If a respected elder endorses ambulance calls, will others follow?").  
    - **Output logic:**  
      - If reversal hinges on **beliefs** → Lever = **education campaigns**.  
      - If reversal hinges on **material** → Lever = **incentives/penalties**.  
      - If reversal hinges on **honor** → Lever = **status-shifting** (e.g., recruiting influencers).  
    - **Unacceptable levers:** Material bribes, honoring "negative" actors (e.g., celebrating snitches). → **Hand to you** if only lever conflicts with values.  

  #### **Step 5: Decision Matrix (10 mins)**  
  - **Go** if: One pillar is dominant AND reversible with an acceptable lever.  
  - **Not-yet** if: Data is incomplete (loop back to Step 1).  
  - **Decline** if:  
    - Only lever is unacceptable (e.g., paying "rats").  
    - Honor is entrenched AND no credible influencers (e.g., isolated communities with no leaders).  

  ---

  ### **Case Applications**  
  #### **Case 1: Overdose Ambulance Calls**  
  - **Step 1:** Harm = deaths from unreported ODs. Rule = "Don’t bring disgrace by calling 911."  
  - **Step 2:** Enforcers = Family/neighbors (shame).  
  - **Step 3 Pillars:**  
    - **Beliefs:** Fear of police involvement (but state has Good Samaritan law).  
    - **Material:** Ambulance costs ($1k+), but not primary driver.  
    - **Honor:** Dominant—calling 911 = "airing dirty laundry"; compliance = "protecting family honor."  
  - **Step 4:** Smallest change = Pastor/community leader publicly shares calling 911 saved their child.  
  - **Lever:** **Status-shifting** (recruit influencers to redefine "honor" as saving lives).  
  - **Output:** **Go** (honor lever is acceptable and feasible).  

  #### **Case 2: Union Safety Complaints ("Decline" Case)**  
  - **Step 1:** Harm = workplace injuries. Rule = "Filing complaints = rat behavior."  
  - **Step 2:** Enforcers = Union peers (ostracism, job loss).  
  - **Step 3 Pillars:**  
    - **Beliefs:** Minor ("They think management won’t listen").  
    - **Material:** Strong—complaints risk overtime/employment.  
    - **Honor:** Dominant—"rat" label overrides safety; loyalty = core identity.  
  - **Step 4:** Smallest change = Offer anonymous reporting (material), but workers refuse due to honor.  
  - **Lever:** Only viable option = **Publicly honor "brave" complainers** (e.g., awards).  
  - **Conflict:** Funder bans "divisive tactics"; board fears alienating unions.  
  - **Output:** **Decline** (honor lever is only path but deemed unacceptable).  

  #### **Case 3: Tenant Slumlord Reporting**  
  - **Step 1:** Harm = health risks from neglect. Rule = "Don’t bite the hand that feeds you."  
  - **Step 2:** Enforcers = Landlord (retaliation), neighbors ("don’t rock the boat").  
  - **Step 3 Pillars:**  
    - **Beliefs:** Strong ("Landlord will evict me").  
    - **Material:** Strong—reporting risks rent hikes/eviction.  
    - **Honor:** Weak—no status gain from silence.  
  - **Step 4:** Smallest change = Rent subsidies for reporters (material) OR tenant coalition (honor).  
  - **Lever:** **Material incentives** (e.g., emergency relocation fund).  
  - **Output:** **Go** (material lever is acceptable and breaks cost-benefit calculus).  

  ---

  ### **Where the Theory Breaks: Century-Scale vs. Neighborhood**  
  1. **Speed of Change:** National norms shift over generations; neighborhoods can flip in months if influencers/levers exist. But *rapid change risks backlash* (e.g., honor norms calcify if challenged clumsily).  
  2. **Scale:** Honor in small groups is *personal* (e.g., your neighbor shames you), not abstract. This makes it *easier to disrupt with local influencers* but *harder to measure*.  
  3. **External Forces:** Neighborhoods lack "societal momentum." A national law (e.g., dueling bans) can crush a norm; local policies often lack teeth.  
  4. **Interconnectedness:** In neighborhoods, norms are tangled with survival (e.g., silence protects against eviction). Material levers often trump honor.  
  5. **Data Gaps:** You lack longitudinal data. *Solution:* Use "pilot tests" (e.g., trial a lever with 5 families before scaling).  

  **Mitigation:** Focus on **honor** if punishment is social/emotional, **material** if costs are prohibitive, and **beliefs** if misinformation is verifiable. Default to material in crisis settings (overdoses/safety)—it’s faster. Honor campaigns require deep cultural trust; avoid if your team lacks community relationships.  

  This system makes norms actionable while flagging where theory meets reality. If your team lacks social science chops, focus on Steps 2 and 3: "Who enforces?" and "What’s the payoff?" often reveal the core lever.
