   We model the problem as follows:

   The driver has a policy: at each ramp, he exits with probability p and continues with probability 1-p.

   We are to find the optimal p.

   The driver's expected payoff depends on the state (which ramp he is at) but he does not know the state.

   However, we can compute the expected payoff by considering the possible paths:

   - If he is at the first ramp (which happens with certainty at the beginning):
       - He exits with prob p: gets 2.
       - He continues with prob 1-p: then he will face the second ramp.

   - If he is at the second ramp (which can only happen if he continued at the first):
       - He exits with prob p: gets 6.
       - He continues with prob 1-p: gets 0.

   But note: when the driver is at a ramp, he does not know if it's the first or the second. He must form beliefs.

   Let V(p) be the expected payoff from the start (first ramp) when using policy p.

   Then:
     V(p) = p * 2 + (1-p) * [p * 6 + (1-p) * 0]
          = 2p + (1-p) * 6p
          = 2p + 6p - 6p^2
          = 8p - 6p^2

   We maximize V(p) by taking the derivative and setting to zero:
     V'(p) = 8 - 12p = 0  =>  12p = 8  => p = 8/12 = 2/3.

