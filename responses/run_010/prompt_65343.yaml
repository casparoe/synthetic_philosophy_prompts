  ### Step 1: Mathematical Solution for the Variant  
  **Payoffs:**  
  - First exit: 2  
  - Second exit: 6  
  - Miss both: 0  

  **Optimal policy (probability of exiting at any ramp, *p*):**  
  The driver's expected payoff from the start (first ramp) is:  
  \[ V(p) = p \cdot 2 + (1 - p) \cdot [p \cdot 6 + (1 - p) \cdot 0] = 2p + (1 - p)6p = 8p - 6p^2. \]  
  Maximize by taking derivative:  
  \[ V'(p) = 8 - 12p = 0 \implies p = \frac{2}{3}. \]  
  Value: \( V\left(\frac{2}{3}\right) = 8 \cdot \frac{2}{3} - 6 \cdot \left(\frac{2}{3}\right)^2 = \frac{16}{3} - \frac{24}{9} = \frac{16}{3} - \frac{8}{3} = \frac{8}{3} \approx 2.667. \)  

  **Interim calculation at a ramp:**  
  Beliefs given the driver is at a ramp:  
  - Probability this is first ramp, \( q = \frac{1}{2 - p} \) (since driver is equally likely to be at first ramp or second ramp *if* they continued at first).  
  - Probability this is second ramp, \( 1 - q = \frac{1 - p}{2 - p} \).  

  Expected value of exiting:  
  \[ \text{Exit} = q \cdot 2 + (1 - q) \cdot 6 = 6 - 4q. \]  
  Expected value of continuing (if at first ramp, go to second; if at second, get 0):  
  \[ \text{Continue} = q \cdot (6p) + (1 - q) \cdot 0 = 6pq. \]  
  Indifference when:  
  \[ 6 - 4q = 6pq. \]  
  Substitute \( q = \frac{1}{2 - p} \):  
  \[ 6 - \frac{4}{2 - p} = \frac{6p}{2 - p} \implies 6(2 - p) - 4 = 6p \implies 12 - 6p - 4 = 6p \implies 8 = 12p \implies p = \frac{2}{3}. \]  

  **Stability of fixed point:**  
  At \( p \neq \frac{2}{3} \):  
  - If \( p < \frac{2}{3} \), \( \text{Exit} > \text{Continue} \) → driver prefers to exit, so *p* should increase.  
  - If \( p > \frac{2}{3} \), \( \text{Exit} < \text{Continue} \) → driver prefers to continue, so *p* should decrease.  
  Thus, \( p = \frac{2}{3} \) is stable.  

  ---

  ### Workshop Design  
  #### Amnesia Mechanism  
  **Problem:** Students remember decision order or count ramps.  
  **Solution:**  
  - Use **index cards** in sealed envelopes for "ramp decisions."  
  - **Setup:**  
    - Two envelopes per student: labeled "Decision 1" and "Decision 2" (order hidden).  
    - Inside each: index card with "EXIT" or "CONTINUE" choice.  
  - **Amnesia protocol:**  
    1. **All envelopes pre-sealed.** Students never see both envelopes simultaneously.  
    2. **Simultaneous, isolated decisions:** Students open envelopes one at a time at their seats, shielded by a folder/notebook.  
    3. **Confession slip:** Before opening, they write their belief (which ramp, confidence) on a slip, fold it, and set aside.  
    4. **No group coordination:** Envelopes distributed randomly; students work silently. After decisions, collect slips before revealing outcomes.  
  - **Why it works:** Physical separation, private decisions, and immediate confession prevent memory/collusion.  

  #### Round Structure & Timeline (80 min)  
  1. **Intro (10 min):**  
     - Explain the scenario (highway, amnesia, payoffs).  
     - Emphasize: "At each ramp, you have no idea if it’s the first or second."  
     - Demo: Show one envelope decision with confession slip.  

  2. **Round 1: Baseline (20 min):**  
     - Students decide freely (no policy) for both ramps.  
     - Use envelopes: Open "Decision 1" → choose EXIT/CONTINUE → if CONTINUE, open "Decision 2" → choose again.  
     - **Payoff:** 2 (if exit at first), 6 (if exit at second), 0 (if continue twice).  
     - **Confession:** Before each decision, write "I think this is ramp [1/2] with [0–100%] confidence" on slip.  

  3. **Round 2: Class Policy (20 min):**  
     - Share Round 1 results: Class avg. payoff, exit rate (e.g., 40% exited).  
     - Brainstorm: "What exit probability (*p*) should we adopt?" Vote on *p* (e.g., 0.5).  
     - **Enforce *p*:** Students roll a die (1–3 = EXIT if *p*=0.5) before each decision.  
     - Run Round 2 with die-enforced *p*.  

  4. **Round 3: Revised Policy (20 min):**  
     - Share Round 2 results: Payoff, exit rate, and confession beliefs (e.g., "When *p*=0.5, most thought they were at first ramp").  
     - Discuss: "At the ramp, did you *want* to follow *p*? Or deviate?"  
     - Revise *p* via vote (e.g., increase to 0.7).  
     - Repeat with new *p*.  

  5. **Extension (Landmark) (10 min):**  
     - Add: "Second exit has a landmark (recognized 50% of the time)."  
     - Rerun Round 3 with landmark: If at second ramp, 50% chance confession slip says "LANDMARK SEEN" (pre-printed on some "Decision 2" cards).  
     - Effect: Optimized *p* drops (students adjust beliefs; math: *p* ≈ 0.57).  

  6. **Debrief (10 min):**  
     - Map activity to concepts:  
       - Ex-ante (Round 2 vote) vs. at-the-node (confession slips).  
       - Evidence: "I’m at a ramp" → belief *q* = 1/(2−*p*) (show Round 3 avg. belief ≈ *q*).  
       - Randomization ≠ indecision: Forces indifference ("no regret").  
     - **Withhold jargon** until here: Then use "centered belief," "time inconsistency."  
     - **Key moment:** "In Round 3, when *p* was too low, you wanted to EXIT more — that’s the pressure to adjust!"  

  #### Payoff Scheme  
  - **Points system:** 2/6/0 per outcome.  
  - **Scoreboard:** Cumulative points per student (private) + class avg. (public).  
  - **Motivation:** "Top 3 scorers get priority for term paper feedback." (Non-monetary, high stakes for students.)  

  #### Deviation Handling  
  - **Policy:** In Rounds 2–3, students **must** follow die-enforced *p* (no deviation).  
  - In confession slip, they **also write** "I wanted to [EXIT/CONTINUE]."  
  - **Debrief use:** Show tension (e.g., "When *p* = 0.5, 80% wanted to EXIT — so the policy felt wrong!").  
  - **Prevent "cheating":** Frame as "testing the plan" (ex-ante) vs. "living it" (at-node).  

  #### Confession Slip Tally  
  - **Process:**  
    - After each round, tally:  
      - Avg. belief *q* (reported "I’m at first ramp" confidence).  
      - Actual % at first ramp (should be *q* = 1/(2−*p*)).  
    - **Expected pattern:** As *p* → 2/3, avg. belief → 0.6 (since *q* = 1/(2−2/3) = 0.6).  
  - **Debrief:** Show graph — beliefs converge to *q* when policy is optimal.  

  ---

  ### Predictable Problems & Solutions  
  1. **Econ major derails Round 1:**  
     - If someone shouts "p=2/3!", say: "Great hypothesis — let’s test if the *process* gets us there."  
  2. **Lopsided coin flips:**  
     - With *n*=20, actual *p* may deviate. Use it: "Why did our 2/3 policy *not* yield 2/3 exits? Sampling noise!"  
  3. **Amnesia fails (students count):**  
     - Mitigate: Shuffle envelope order ("Decision 1/2" labels are arbitrary), enforce silence.  
     - If leaks happen: "In real amnesia, you wouldn’t know — simulate that!"  
  4. **Low engagement with points:**  
     - Boost stakes: "Double points for perfect confessors" (belief within 10% of actual *q*).  

  ---

  ### What the Activity Can’t Reproduce (Debrief Talking Points)  
  > "In this game, David *knows* the setup is a test — he’s seen the highway map beforehand. Real absent-mindedness means truly believing you *might* be at either ramp, with no outside context. That’s why your confession slips showed 60% confidence, not 50% — you used the math, not pure ignorance. But this tension is real: When we make plans for our future selves (e.g., dieting, saving), we *are* that future self, doubting the plan with limited information. The coin flip isn’t a cop-out; it’s engineering indifference so your future self won’t rebel."  

  **Delivery:** 2-minute monologue during debrief. Acknowledge the artifact, then pivot to universality ("This mirrors any commitment problem!").  

  --- 

  **Final Note:** Run the math beforehand with your numbers. Use Round 2–3 to make the "pressure" tangible — the convergence to *p*=2/3 is the core insight. Withhold terms until debrief to avoid premature closure. Good luck!
