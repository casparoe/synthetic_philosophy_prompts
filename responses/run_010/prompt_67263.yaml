prompt: |-
  A friend and I spent most of last night arguing about whether Bernard Williams's internal reasons thesis and Fischer and Ravizza's reasons-responsiveness account of moral responsibility are really one view wearing two hats. His case had three steps: both make normative status depend on what an agent could recognize or respond to from where she actually stands rather than on her occurrent desires; both build imagination, correction of mistaken belief, and a patterned sensitivity to reasons into the relevant capacity; and so Williams's talk of a sound deliberative route from the agent's subjective motivational set is just reasons-responsiveness with the responsibility vocabulary stripped out. My case was that Williams is offering a criterion for when a reason exists at all, whereas Fischer and Ravizza are offering a criterion for when an agent is a fair target of blame, and the latter sits comfortably with there being reasons the agent could never recognize.

  Compare the two properly rather than picking a side. Which of his three steps survive scrutiny; at what point do the accounts come apart in a way that makes a difference to their verdicts on the same agent; and does the familiar charge that Williams's deliberative route is permissive enough to smuggle the externalism back in have an exact counterpart in the receptivity condition, or does the difference in subject matter defuse it? Throughout, mark clearly what is settled among people who work on these debates and what remains genuinely contested, and do not present one contested interpretation of Williams as though it were the standard reading.
reasoning: |-
  Okay, the user is asking me to compare Bernard Williams's internal reasons thesis with Fischer and Ravizza's reasons-responsiveness account. They had an argument with a friend about whether these are essentially the same view. I need to analyze the friend's three steps, identify where the accounts diverge, and examine whether the charge of permissiveness against Williams applies similarly to Fischer and Ravizza.

  Let me start by recalling the key points of both theories. Williams argues that reasons must be tied to an agent's "subjective motivational set" (S-set) - only what can be reached through sound deliberation from existing motivations counts as a reason. Fischer and Ravizza focus on moral responsibility, requiring "moderate reasons-responsiveness" where the agent has both receptivity (capacity to recognize reasons) and reactivity (ability to translate recognition into action).

  The friend's three steps are: both depend on agent's actual standpoint rather than occurrent desires; both incorporate imagination/belief correction/sensitivity; and Williams' deliberative route is just responsibility-free reasons-responsiveness. 

  I think step one is partially right but oversimplifies. Williams is ontological (what reasons exist), Fischer/Ravizza are normative (fairness of blame). Step two has merit regarding shared components but differs in scope - Williams focuses on deliberation, Fischer/Ravizza on general capacity. Step three is the weakest - the aims are fundamentally different.

  Where they come apart practically: consider an agent with severe cognitive limitations. Williams might say she has no reason to φ if it's deliberatively inaccessible; Fischer/Ravizza might still blame her if she meets the responsibility conditions despite never being able to recognize certain reasons.

  On the permissiveness charge: Williams is often criticized that "sound deliberation" could be stretched to include external reasons. Fischer/Ravizza's receptivity faces similar issues about how extensive reasoning must be. But the difference in subject matter matters - responsibility assessments can be more contextually flexible than reason-existence claims.

  I should note contested interpretations: scholars debate how expansive Williams' S-set is, and whether Fischer/Ravizza's historical condition is essential. The user wants settled vs contested points clearly marked.

  The user seems philosophically sophisticated - they're familiar with the debates and want neutral analysis. Their unspoken need might be understanding how subtle differences in philosophical frameworks create meaningfully distinct positions, or how to navigate scholarly disagreements when comparing theories. I'll maintain academic rigor while ensuring clarity.
answer: |-
  Here's a comparative analysis of Bernard Williams's Internal Reasons Thesis (IRT) and Fischer & Ravizza's (F&R) Reasons-Responsiveness (RR) account, addressing your friend's steps, divergence points, the permissiveness charge, and scholarly consensus/contested points:

  **Core Distinction (Settled):**
  *   **Williams (IRT):** Provides a **criterion for the existence of an agent-relative normative reason** ("A has a reason to φ"). Reasons exist *only if* they are accessible via a sound deliberative route from the agent's actual "subjective motivational set" (S).
  *   **Fischer & Ravizza (RR):** Provides a **criterion for moral responsibility** (specifically, the fairness of attributing blame/praise). An agent is responsible for an action if it issues from her own moderately reasons-responsive mechanism.

  **Evaluating Friend's Three Steps:**

  1.  **"Both make normative status depend on what an agent could recognize or respond to from where she actually stands rather than on her occurrent desires."**
      *   **Partial Survival:** This step captures a crucial *structural similarity*. Both views reject purely external standards unmoored from the agent's actual constitution and capacities. Williams rejects external reasons existing independently of S. F&R reject responsibility based purely on objective reasons the agent *couldn't* access.
      *   **Scrutiny:** The "normative status" differs fundamentally: *reason-existence* vs. *blameworthiness*. Williams focuses on the *source* of reasons (S + deliberation). F&R focus on the *general capacity* manifested in action. While both look "from where she stands," they look for different things: Williams for a *deliberative route*, F&R for a *pattern of responsiveness* in the mechanism. "Occurrent desires" are indeed insufficient for both, but Williams anchors in the *entire S* (broadly construed), F&R in the *history and structure* of the mechanism.

  2.  **"Both build imagination, correction of mistaken belief, and a patterned sensitivity to reasons into the relevant capacity."**
      *   **Survival with Qualification:** There's clear overlap in the *components* considered essential to the relevant capacity.
      *   **Scrutiny:** The *role, scope, and standard* differ.
          *   **Role:** For Williams, imagination/belief correction are *part of sound deliberation* required to *discover* existing internal reasons. For F&R, receptivity (including recognizing reasons via counterfactual reasoning/belief correction) is a *component of the capacity* that must be *manifested in a pattern* for the mechanism to be responsive.
          *   **Scope/Standard:** Williams' deliberation aims at discovering reasons *relative to S*. Its "soundness" is defined by correctness (true beliefs, logic, understanding S). F&R's receptivity requires recognizing *a* sufficient reason *to act differently* in *some* counterfactual scenarios where reasons differ – a potentially *lower bar* than Williams' "sound" discovery of the *actual* reason. The "patterned sensitivity" is central to F&R's reactivity condition (would the mechanism produce different actions for *some* different reasons?), but Williams focuses on the actual deliberative path to *this* reason. Williams' "pattern" is the deliberative process itself.

  3.  **"Williams's sound deliberative route is just reasons-responsiveness with the responsibility vocabulary stripped out."**
      *   **Does Not Survive:** This step conflates the fundamentally different *projects*.
      *   **Scrutiny:** Williams is doing *meta-ethics/normativity*: defining what it *means* for a reason to exist *for an agent*. F&R are doing *moral psychology/responsibility*: defining conditions under which it's *fair* to hold an agent accountable. While RR involves a capacity (responsiveness), it's a capacity relevant to blame, not the ontological ground of reasons. Williams' deliberative route isn't a "stripped out" RR; it's a different conceptual tool for a different job. An F&R-responsible agent might act for reasons Williams would deny exist for her (if the reason isn't S-accessible), and Williams might affirm an agent has a reason she could never be responsible for acting upon (if she lacks the reactive capacity).

  **Point of Divergence Affecting Verdicts (Illustrative Example):**

  *   **The Cognitively Limited Agent:** Consider an agent with a significantly limited but not irrational cognitive capacity (e.g., due to developmental disorder or profound lack of education). She performs a morally wrong action φ based on a mechanism that is moderately reasons-responsive *relative to the reasons she can grasp* (satisfies F&R). However, the *truly sufficient moral reason* not to φ is complex and requires sophisticated understanding far beyond her current capacities – it lies outside any potential sound deliberative route from her S.
  *   **Williams (IRT):** Would likely say the agent *lacks a reason* not to φ (in the strong internalist sense), as it is not accessible from her S via sound deliberation. The reason "doesn't exist for her."
  *   **Fischer & Ravizza (RR):** Would likely say the agent is *morally responsible* (blameworthy) for φ-ing. Her actual mechanism was responsive to the reasons *she could grasp*. The fairness of blame is grounded in her actual capacities and the mechanism's responsiveness *within those limits*. The existence of external reasons she *couldn't* grasp is irrelevant to RR's responsibility condition.
  *   **Verdict Difference:** Williams denies the reason exists; F&R affirm she is blameworthy for acting against reasons she *could* recognize, even if deeper reasons are inaccessible. This highlights the core distinction: reason-existence vs. blameworthiness.

  **The Permissiveness Charge: Williams vs. F&R**

  *   **Charge Against Williams (Settled as a Common Critique, Contested in Resolution):** Critics (e.g., McDowell, Parfit) argue Williams's "sound deliberation" and broad conception of S can be stretched to include almost anything a virtuous or fully rational agent would do, effectively smuggling externalism back in. If "sound deliberation" includes radical self-understanding leading to fundamental value change, and S includes abstract dispositions, then "internal" reasons might cover all plausible normative reasons.
      *   **Contested:** Williamsians argue this misreads him. S is the agent's *actual* set, deliberation is non-ideal, and fundamental value change via deliberation is constrained. How permissive IRT truly is remains a core debate in Williams scholarship.
  *   **Counterpart in F&R?** The potential counterpart lies in the **Receptivity Condition**.
      *   **Similarity:** Critics could argue that specifying *how much* counterfactual reasoning, belief correction, or imagination is required for "receptivity" is vague. Does it require receptivity only to obvious reasons, or to more complex moral truths? Setting the bar too high makes responsibility too rare; too low makes it insensitive to significant cognitive limitations, potentially "smuggling in" a demand for responsiveness to reasons the agent *should* see but *can't*.
      *   **Difference Defused by Subject Matter? Partially.**
          *   F&R explicitly frame RR as *moderate* – requiring a pattern of recognition, but *not* requiring recognition of *all* reasons or *perfect* rationality. Their focus is on the *actual mechanism's general capacity*, judged by its performance in relevant counterfactuals, relative to the agent's baseline.
          *   The charge against Williams threatens his *core ontological claim* (reasons = internal). If IRT becomes too permissive, it collapses into externalism. The charge against F&R's receptivity is more about *drawing the line* for a *fairness condition*. It's an expected challenge for *any* counterfactual capacity-based account of responsibility, not one that necessarily undermines the core distinction between reason-existence and responsibility. F&R can (and do) bite the bullet that responsibility is scalar and context-dependent regarding capacities, without abandoning their framework. Williams cannot easily concede permissiveness without abandoning internalism.

  **Settled vs. Contested:**

  *   **Settled:**
      *   Williams's IRT is primarily about the *existence* of normative reasons.
      *   F&R's RR is primarily about the conditions for *moral responsibility*.
      *   Both views emphasize the agent's actual constitution/capacities against purely external standards.
      *   The "permissiveness charge" is a standard and serious critique of Williams's IRT.
      *   F&R's RR is a capacity-based, counterfactual account of responsibility.
  *   **Contested:**
      *   **Williams:** The precise interpretation of "subjective motivational set" (S) – how dispositional, abstract, or thick? The scope and nature of "sound deliberation" – does it include radical self-critique leading to wholesale value change? The degree to which IRT is genuinely distinct from sophisticated externalism. *There is no single "standard reading" on these points.*
      *   **Fischer & Ravizza:** Whether the *historical* condition (ownership) is necessary or defensible. Whether "moderate" RR sets the bar for receptivity/reactivity correctly. How to handle cases of "tracing" where the unresponsive mechanism was acquired responsibly. Whether alternative compatibilist accounts (e.g., hierarchical, attributionist) are superior.
      *   **General:** Whether responsibility *requires* the capacity to recognize the *specific* moral reasons applicable in a situation, or just *some* reasons. The exact relationship between normative reasons and moral responsibility conditions.

  **Conclusion:**

  Your friend correctly identifies significant structural similarities in the *kind of capacity* both views emphasize – an agent-relative, counterfactually-assessed sensitivity grounded in actual psychology, incorporating reasoning elements. Steps 1 and 2 survive scrutiny only with significant qualifications highlighting the different targets (reason-existence vs. responsibility) and the differing roles/standards for the capacities involved. Step 3 collapses under scrutiny; the aims are fundamentally distinct, leading to divergent verdicts, as shown in the cognitively limited agent case. The permissiveness charge against Williams finds a *loose* counterpart in concerns about the vagueness of F&R's receptivity condition, but the difference in subject matter (ontology of reasons vs. fairness of blame) significantly alters the stakes and potential for defusing the critique. F&R's framework is inherently more flexible on this point.
