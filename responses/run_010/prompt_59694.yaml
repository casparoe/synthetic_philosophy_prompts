prompt: |-
  I teach a non-majors survey on the history of the physical sciences, and every year the same thing comes up in discussion section and I never have a good answer for it. We look at cases where a claim begins life as a genuinely surprising empirical finding — contested, supported by experiments, defended against people who thought it absurd — and then, a generation or two later, denying it stops sounding like a substantive disagreement and starts sounding like misuse of a word. Water is H₂O; whales are mammals rather than fish; the cladistic point that the animals we call fish do not form a single natural group, so that a strict biologist can say there is no such thing as a fish. What strikes me is how these claims get defended once they settle. When a student produces an apparent counterexample — a clear, drinkable, lake-filling liquid that turns out to have a different composition, or some newly catalogued body out past Neptune that looks planet-like — the response is never to treat that as evidence against the claim. The response is to reassign the case: then it isn't water, then it isn't a planet. The claim itself has become the instrument we use to sort the cases, so nothing that turns up can count against it. And yet the discovery story stays in the textbook. The evidence is still recited, the controversy is still narrated, and the claim is still presented as something the world forced on us rather than something we decided. That combination is what I can't name: practically immune to revision, officially still empirical.

  It's obviously adjacent to the August 2006 decision by the astronomical union to adopt a definition of planet that demoted Pluto, but I want to keep those two apart, and I don't know how. In the Pluto case people reasonably complained that a committee changed the meaning of a word by vote, that the discovery of a ninth planet hadn't been shown to be wrong so much as re-labelled. Nobody says anything like that about water. There the narrowing of the term feels like the discovery finally being understood rather than being tampered with. My students' instinct is to say that both are just the no-true-Scotsman move — counterexample appears, term gets tightened, claim survives unscathed — and I want to know whether that is actually right, or whether the folk name for the fallacy is obscuring a real distinction between a legitimate tightening and a dodge. If there's a legitimate version, what makes it legitimate, given that the mechanical structure of the response looks identical in both: the predicate gets narrowed at exactly the point where the recalcitrant case appears?

  So: is there an established concept, or a small cluster of them, for this migration of a claim from the empirical side of the ledger to the definitional side without anyone announcing that a redefinition has occurred? I'd like to know what the nearest analyses are, how each of them differs from the thing I've described, and which one you'd actually reach for — and if the answer is that nothing established covers it, then coin something, with a definition sharp enough that I could tell my students what would and wouldn't count as a case. Please treat the carving as the deliverable rather than the label: I want the boundary conditions, an account of why the discovery narrative can survive the acquisition of immunity, and a workable test for separating the legitimate narrowing from the Scotsman-style one. Since this is a course for non-specialists, I also want at least one case where your test comes out indeterminate or arguably misfires, so I can show the students the seam. I'm not after a bibliography or a list of who said what — just the conceptual lay of the land and your own reasoned verdict on how the phenomenon should be cut.
reasoning: |-
  Okay, the user is teaching a history of physical sciences course and encounters a recurring problem. Every year, students notice how scientific claims that start as empirical discoveries become immune to counterexamples over time. When a counterexample appears, it's dismissed by redefining terms rather than reconsidering the claim. The user wants to distinguish legitimate scientific refinement from fallacious moves like "no true Scotsman."

  First, I need to understand the core issue. Examples like water being H₂O or planets excluding Pluto show how definitions shift. The students see both as similar to no-true-Scotsman, but the user senses a difference. The key is explaining why some redefinitions are valid while others aren't.

  The user mentioned cladistics with "fish" not being a natural group. That's a case where scientific understanding evolves, leading to redefinition. But Pluto's demotion feels more arbitrary, like a committee decision. The challenge is articulating the difference.

  I recall Kuhn's paradigms, where normal science operates under accepted frameworks. Lakatos's research programs might be relevant too, with hard cores protected by auxiliary hypotheses. But the user wants a testable distinction, not just theory.

  The legitimacy likely comes from whether the redefinition is driven by underlying principles or just avoiding counterexamples. For water, the shift to molecular composition ties into a broader chemical theory. For planets, the IAU definition was more about classification convenience than deep principles.

  The discovery narrative persists because the initial empirical evidence established a new framework. Once that framework is accepted, future cases are judged within it. So the historical context remains important, but the claim becomes definitional.

  A possible test is whether the redefinition is motivated by explanatory power. If narrowing the term resolves anomalies and integrates with other theories, it's legitimate. If it's ad hoc to save the claim, it's fallacious. But the user wants boundary cases. Maybe the concept of species in biology, where definitions vary by context, could show indeterminacy.

  The user also needs to explain why the narrative survives. It's because the original evidence was crucial in establishing the framework. Once accepted, the framework dictates definitions, making the claim analytic within it.

  For non-majors, clarity is key. Using examples like water vs. Pluto, and a borderline case like species, can illustrate the test. Emphasize that legitimacy depends on integration with a broader explanatory system, not just avoidance of counterexamples.
answer: |-
  Here's a conceptual toolkit designed for your classroom, focusing on the *mechanism* and *legitimacy* of this phenomenon, rather than just labeling it:

  ### The Core Phenomenon: **Ontological Assimilation**
  1.  **The Process:** An empirical claim (e.g., "Water is fundamentally composed of H₂O molecules") establishes a new **explanatory framework** (e.g., molecular chemistry).
  2.  **Framework Dominance:** This framework proves so powerful and unifying for explaining *other* phenomena (solubility, phase changes, reactivity) that it becomes the dominant lens for understanding the *category itself*.
  3.  **Shift to Criterion:** What was initially an *empirical discovery* about paradigmatic examples (Earth's water) becomes the *defining criterion* for membership in the category. The claim ("Water is H₂O") shifts from being a *synthetic* statement (true/false based on the world) to an *analytic* statement (true by definition *within the adopted framework*).
  4.  **Immunity & Narrative:** The original empirical evidence *doesn't vanish*; it's the historical justification for adopting the framework. Counterexamples *within* the framework are impossible because the framework *defines* what counts as a relevant instance. Denying H₂O-as-water *now* sounds like misusing the term "water" *as defined by chemistry*, not like challenging an empirical fact about the world *as we currently understand it*.

  ### Distinguishing Legitimate Assimilation from the "Scotsman Dodge": The Explanatory Integration Test

  The key difference isn't the *structure* (narrowing the predicate), but the *motivation and consequence*:

  *   **Legitimate Ontological Assimilation (e.g., Water, Whales, Cladistic Fish):**
      *   **Motivation:** Driven by the overwhelming success and **explanatory power** of the new framework. The redefinition isn't *primarily* to avoid counterexamples; it's a *consequence* of adopting a deeper understanding that *explains why* the original paradigmatic cases share fundamental properties and *why* apparent counterexamples differ fundamentally.
      *   **Consequence:** The narrowed definition **integrates seamlessly and productively** into a larger, powerful, and predictive body of theory (chemistry, evolutionary biology, phylogenetics). It resolves *multiple* puzzles and anomalies beyond the initial case, providing a unified understanding. Calling whales mammals isn't just about avoiding "fish"; it's about placing them correctly within the evolutionary tree, explaining their physiology, reproduction, etc., in ways the old "fish" category couldn't. The redefinition *advances* understanding.
      *   **"Test" Question:** Does this redefinition unlock *broader explanatory power* and *resolve persistent anomalies* within a successful theoretical framework? If yes, it's likely legitimate assimilation.

  *   **"No True Scotsman" Dodge (e.g., Pluto feels like this to critics):**
      *   **Motivation:** Primarily driven by the desire to **protect a specific claim** from a counterexample. The redefinition feels *ad hoc* – designed *specifically* to exclude the problematic case without a deeper, independent theoretical justification.
      *   **Consequence:** The redefinition often **lacks significant integrative power**. It might solve *this one problem* but doesn't necessarily connect to a broader, more powerful explanatory framework or resolve other major puzzles. It feels like moving a semantic goalpost rather than gaining deeper insight. Critics argue the IAU definition (requiring orbital dominance) was chosen *to* exclude Pluto and bodies like it, without offering a significantly deeper understanding of planetary formation or diversity than alternative definitions might have.
      *   **"Test" Question:** Is this redefinition primarily motivated *by* the counterexample, and does it feel like a *verbal trick* to save the claim rather than a step forward in explanatory understanding? If yes, it leans towards the fallacy.

  ### Why the Discovery Narrative Survives

  1.  **Historical Justification:** The narrative explains *why* this particular framework and definition became dominant. The evidence wasn't wrong; it *forced* the conceptual revolution that led to the new framework. The controversy shows the transition wasn't arbitrary.
  2.  **Framework Dependence:** The narrative highlights that the *current* analytic truth ("Water is H₂O") rests entirely on the success of the framework *established* by that empirical evidence. Without the history, the definition seems arbitrary. The history shows its empirical *genesis*.
  3.  **Pedagogical Value:** It demonstrates the *process* of scientific change – how evidence challenges concepts, leading to new, more powerful paradigms.

  ### The Boundary Case: Species Concepts in Biology

  *   **The Issue:** Biologists use multiple, conflicting definitions of "species" (Biological Species Concept - based on interbreeding; Morphological; Phylogenetic; Ecological, etc.). What counts as a "species" depends on the context and the definition used.
  *   **Applying the Test:**
      *   **Legitimate Assimilation?:** Each definition reflects a powerful biological principle (reproductive isolation, shared ancestry, ecological niche). Shifting definitions often occurs to resolve anomalies (e.g., ring species, asexual organisms) and integrates with specific research programs (evolutionary genetics, systematics, ecology). The redefinitions *do* advance understanding within their domains.
      *   **"Scotsman" Dodge?:** Critics might argue that when a biologist encounters a problematic case (e.g., organisms that interbreed in some areas but not others), switching definitions can sometimes feel like avoiding the counterexample rather than resolving it within a single framework. The lack of a single universal definition can make shifts seem arbitrary depending on the goal.
      *   **The Indeterminate Seam:** The Species Problem is a genuine, unresolved scientific challenge. Shifting definitions are driven by both deep theoretical considerations *and* the practical need to handle messy biological reality. It's often **impossible to definitively say** whether a specific instance of using one definition over another is primarily motivated by explanatory integration or by dodging a counterexample inherent in another definition. It highlights the messy boundary where ontological assimilation is actively contested and incomplete. *This is the seam to show your students.*
  *   **Why it Works as a Boundary Case:** It demonstrates that the Explanatory Integration Test isn't always black-and-white. Legitimacy depends on the *context* and the *overarching goals* of the scientific inquiry. It shows science grappling with complexity where the framework itself is still evolving and contested.

  ### Verdict and Classroom Deliverables

  *   **Name the Process:** Introduce **Ontological Assimilation** as the phenomenon where an empirical discovery becomes definitional within the successful explanatory framework it helped establish.
  *   **The Key Distinction:** Teach the **Explanatory Integration Test**:
      *   Legitimate Assimilation: Narrowing driven by & contributing to deeper explanatory power within a successful framework.
      *   "No True Scotsman" Dodge: Narrowing feels ad hoc, motivated primarily by excluding a counterexample, lacking significant integrative power.
  *   **Why the Narrative Stays:** Emphasize that the history explains the *empirical origin* and *justification* for the current framework upon which the definitional claim now analytically depends. The evidence forced the paradigm shift.
  *   **Show the Seam:** Use the **Species Problem** as the boundary case where the test becomes fuzzy, demonstrating the real-world complexity of scientific categorization and how legitimacy can depend on context and ongoing debate.

  By focusing on the *explanatory integration* achieved by the redefinition within a powerful framework – rather than just the act of redefinition itself – you give students a concrete, non-circular criterion to evaluate whether they're seeing a profound scientific refinement or a potentially fallacious evasion. The Pluto case feels different from water because the *degree* and *nature* of the explanatory integration achieved by the IAU definition are debated and arguably less profound than the integration achieved by molecular chemistry defining water. The Species Problem shows this isn't always a clear-cut judgment.
