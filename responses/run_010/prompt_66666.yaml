answer: |-
  ### Exam Question: Standing to Blame Assessment (75 minutes, 25 marks)  

  **The Reciprocity Account of Standing to Blame**  
  *S* has standing to blame *P* for violating norm *N* **only if** all three conditions hold:  
  - **R1 (Compliance):** *S* complied with *N* from the moment *S* first believed *P*’s violation occurred until *S*’s act of blaming.  
  - **R2 (Non-Selectivity):** *S* is disposed to blame *anyone* (including intimates and *S* herself) for violating *N* in circumstances *relevantly similar* to *P*’s violation.  
  - **R3 (Motive):** *S*’s blaming act *issues from* (i) *S*’s judgment that *P* violated *N*, and (ii) *S*’s acceptance of *N*—**not** from expected benefits to *S*.  

  **Cases for Analysis**  
  **Case A:** Dr. Elena Rossi, Ethics Department Chair, publicly condemns colleague Dr. James Holt for plagiarizing a student’s research. Rossi has never plagiarized. She consistently blames such acts—even by friends and her former students—and applies the norm impartially. However, Rossi admits she chose this moment partly because Holt’s scandal grants her a platform to promote her new book and undermines her rival (Holt). She recognizes the wrong but acknowledges these benefits were the primary motivators.  

  **Case B:** Maria Chen reproaches her brother David for having an affair that is destroying his marriage. Maria had her own affair 13 years ago (known to David), but it occurred **before** she learned of David’s affair. She has been faithful since learning of David’s violation and impartially condemns infidelity (including in her family). However, Maria insists her affair was *not* a violation because her marriage was "already over," while David’s is intact. David accepts the norm, admits he violated it, and does not resent Maria’s reproach.  

  **Tasks:**  
  1. **Case Analysis (12 marks):** For **each case**, determine:  
     - Does the Reciprocity Account yield the *intuitively correct verdict* (standing/no standing)?  
     - **Explain precisely** which clause(s) deliver the verdict. Address:  
       - How R1’s "window" operates in Case B.  
       - How "relevantly similar" in R2 affects both cases.  
  2. **Counterexample (8 marks):** Invent **one original case** where the Account delivers the *wrong verdict* (over- or under-inclusive). Identify:  
     - The error type (over/under-inclusion) and the clause(s) causing it.  
     - *Why* the verdict clashes with moral intuition.  
  3. **Objection Evaluation (5 marks):** Assess this objection: *"The Account cannot explain why hypocritical blame is wrong even when it doesn’t strip standing (e.g., when the hypocrite complies with R1–R3)."* Is this **fatal** to the Account? Justify your view.  

  **Important:**  
  - **No marks** will be awarded for attributing views to philosophers or citing literature.  
  - Treat the Reciprocity Account as a **self-contained framework**. Base answers solely on its clauses and the cases provided.  

  ---  

  ### Model Answer (Strong Undergraduate, ~700 words)  

  **Case A: Dr. Rossi**  
  The intuitively correct verdict is that Dr. Rossi *lacks standing* to blame Dr. Holt. The Reciprocity Account correctly denies her standing via **R3 (Motive)**.  
  - **R1 (Compliance):** Satisfied. Rossi never plagiarized, including during the "window" (from learning of Holt’s act to blaming him).  
  - **R2 (Non-Selectivity):** Satisfied. She blames impartially, even targeting friends/students for similar violations.  
  - **R3 (Motive):** **Failed.** Though Rossi judges Holt’s act wrong and accepts the norm, her blaming "issues from" her desire for personal gain (platform/rivalry), not primarily from moral judgment. The clause requires the blame to *flow from* moral recognition, which is overridden here by self-interest.  
  The stipulation that benefits were her *primary* motivator ("carrying the act") ensures R3 fails decisively.  

  **Case B: Maria Chen**  
  The intuitively correct verdict is that Maria *lacks standing* to blame David. The Account correctly denies standing via **R2 (Non-Selectivity)**.  
  - **R1 (Compliance):** **Inapplicable.** Maria’s affair occurred *before* the R1 "window" (which opens when she learns of David’s affair). Her fidelity *during* the window is irrelevant since she violated *N* earlier. R1 does not require *past* compliance.  
  - **R2 (Non-Selectivity):** **Failed.** Maria claims her affair isn’t blameworthy because her marriage was "over," while David’s is not. But if "relevantly similar" is assessed *objectively* (i.e., both violated marital fidelity), her selective exemption is unjustified. She is *not* disposed to blame herself for a relevantly similar violation, violating R2.  
  - **R3 (Motive):** Satisfied. Her reproach issues from her judgment of David’s wrong and acceptance of *N* (David’s lack of resentment doesn’t affect this).  
  R2 delivers the verdict: Maria’s self-exemption (based on a dubious distinction) shows she applies *N* selectively, even if she blames *others* impartially.  

  **Counterexample: Under-Inclusiveness via R3**  
  *Case C:* Alex blames their friend Taylor for drunk driving. Alex has never driven drunk (R1 satisfied), blames all drunk drivers impartially (R2 satisfied), and their blame issues *partly* from moral judgment and *partly* from relief that Taylor’s accident diverted attention from Alex’s recent job failure.  
  - **Account Verdict:** *No standing* (R3 fails, as benefit "taints" the motive).  
  - **Intuition:** Alex *has* standing—their moral motivation is genuine, even if mixed.  
  - **Error:** **Under-inclusiveness.** R3 is too strict if "issues from" requires *pure* moral motivation. Many legitimate blame acts (e.g., therapeutic confrontations) involve ancillary motives (e.g., repairing relationships), yet retain standing. R3 excludes these unfairly.  

  **Objection Evaluation: Not Fatal, but Reveals a Structural Flaw**  
  The objection is **not fatal** but exposes a limitation: the Account focuses on *compliance* with an agreed norm (*N*), not disputes about *N*’s scope.  
  - **Hypocrisy Without Standing Loss:** E.g., a vegan who condemns *all* meat-eating (complying with R1–R3) but is accused of hypocrisy for *formerly* eating meat. The Account grants standing (past violations are outside R1’s window). The objection claims it cannot explain why this *feels* wrongful.  
  - **Reply:** The Account *can* explain this as a *distinct* wrong (e.g., inconsistency in character), not a standing issue. Standing concerns *authority to address violations of N*, not broader hypocrisy.  
  - **Flaw:** The Account’s **fixed indexing to *N*** makes it unable to handle cases where hypocrisy stems from *redefining N* (like Maria’s self-exemption). Here, the blamer *accepts N* formally but carves exceptions, which R2 only catches if "relevantly similar" is interpreted robustly. This shows R2 may collapse into judging the blamer’s *normative justification*, not their psychology.  

  **Conclusion:** The Account handles Cases A/B well but struggles with motive purity (R3) and norm disputes. R1 and R2 may be redundant: R1 exempts past hypocrites (weakening the account), while R2’s "relevantly similar" imports external moral judgments. Only R3 is indispensable.  

  ---  

  ### Marking Scheme (25 marks total)  
  **Discriminator:** First-class answers (21–25) identify *conceptual tensions* (e.g., R2’s circularity, R3’s overreach) and propose collapse into R3. Competent answers (15–20) apply clauses correctly but miss systemic flaws.  

  #### Case Analysis (12 marks)  
  - **Case A (5 marks):**  
    - 3 marks: Correct verdict (no standing via R3).  
    - 2 marks: Explains R3 requires *dominance* of moral motivation (benefits "carried the act").  
    - *Botch:* Ignores motive hierarchy (e.g., "R3 fails because benefits exist").  
  - **Case B (7 marks):**  
    - 2 marks: Notes R1 is *irrelevant* (window excludes past violation).  
    - 3 marks: Identifies R2 failure via non-objective "relevantly similar" (Maria’s self-exemption is unjustified).  
    - 2 marks: Explains why R3 *is* satisfied (blame stems from norm acceptance).  
    - *Botch:* Misapplies R1 to past conduct; accepts Maria’s "relevantly similar" claim uncritically.  

  #### Counterexample (8 marks)  
  - 3 marks: Original case with clear intuition/Account clash.  
  - 3 marks: Correct error type (over/under-inclusive) and causal clause(s).  
  - 2 marks: Diagnoses *why* clause(s) generate error (e.g., R3’s motive purity).  
  - *First-class:* Case exposes R3’s sufficiency problem (e.g., therapeutic blame with mixed motives).  
  - *Botch:* Cases where intuition is debatable; misidentifies error type.  

  #### Objection Evaluation (5 marks)  
  - 2 marks: Recognizes objection targets hypocrisy *without* R1–R3 failure.  
  - 2 marks: Notes structural limitation (fixed norm *N* ignores norm disputes).  
  - 1 mark: Concludes non-fatal (standing ≠ all moral criticism).  
  - *First-class:* Links to R2’s dependence on external justification.  
  - *Botch:* Claims Account "fully explains" hypocrisy; conflates standing with blameworthiness.  

  ---  

  ### Marking Notes: Special Situations  

  1. **Rejecting the Framework (e.g., "This account is flawed, so I’ll ignore it"):**  
     - Award **max 10/25** if rejection is *substantive* (e.g., analyzes cases using the account’s *own* clauses to show incoherence).  
     - Award **0–5/25** if rejection is *dismissive* (no engagement with clauses/cases).  
     - *Rationale:* The task tests *application* of a stipulated framework. Alternatives (even if sophisticated) fail the core brief.  

  2. **Lucky Route to Correct Verdicts (e.g., Intuitions without clause analysis):**  
     - Cap score at **8–10/25** for Cases A/B.  
     - Award **0 marks** for Counterexample/Objection if reasoning is absent/contradictory.  
     - *Example:* "Rossi lacks standing because she’s selfish" (ignores R3) = 2/5 for Case A.  
     - *Rationale:* The exam assesses *how* conclusions are derived from the framework, not intuition alone.
