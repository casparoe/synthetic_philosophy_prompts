answer: |-
  Here's the translation, residue report, and analysis you requested – treating your newsroom framework as the operating system and the art-forgery arguments as inputs to be processed:

  **Translation: Art Arguments → Newsroom Vocabulary**

  1.  **"A genuinely perfect forgery is aesthetically worse."**
      *   **Newsroom Translation:** This is **fabrication disguised as original reporting**, even if the "facts" presented (the visual content) are accurate and no one is deceived *in the moment*. The core violation is creating a piece with a **false sourcing chain and byline credit**. It asserts an origin (the original artist) that is fundamentally untrue. The "aesthetically worse" claim maps directly to the ethical condemnation of fabrication itself – the work is polluted at its source, regardless of output quality or immediate deception.
      *   **Bending the Term:** "Aesthetically worse" is *replaced* by "ethically compromised due to false origin/provenance." We're not judging brushstrokes; we're judging the fraudulent claim of creation.

  2.  **"A heavily restored fresco is a different work resembling the original."**
      *   **Newsroom Translation:** This is an **extreme case of "churnalism" or aggregation overwriting original reporting**, triggering a "new piece vs. update in place" debate. If the conservators have replaced *most* of the original paint (original reporting), the resulting piece is primarily **aggregated/reconstructed content** built upon a minimal original scaffold. It might not warrant a *new* byline (it's still nominally the "fresco"), but it absolutely requires a **massive, transparent correction/update note** detailing the extent of the intervention ("Based on original reporting by [Original Artist], with extensive reconstruction and new material added by [Conservators]"). Running it silently as the "original" work without this note would be unethical misrepresentation. The argument that it's a "different work" pushes for treating it like **a new piece entirely**, authored *by the conservators*, based *on* the original fragments.
      *   **Bending the Term:** "Different work" maps to the need for either a fundamentally new byline/credit structure OR an unprecedented level of correction transparency that functionally changes how the piece is presented. "Resemblance" maps to aggregation/churnalism.

  **Residue Report: What Falls Out & Where Things Snag**

  1.  **Your Core Hunch (Plagiarism-when-true vs. Forgery-when-indistinguishable):**
      *   **Mostly Confirmed:** Both are fundamentally punished for the **history/provenance/sourcing violation**, not the inherent content. The crime is the **false attribution of origin**.
      *   **Key Structural Difference:**
          *   **Plagiarism:** Steals the *form/expression* (the specific sentences, structure) and falsely attributes it to the plagiarist (or fails to attribute). Victim: Original creator & readers deceived about authorship.
          *   **Perfect Forgery:** Steals the *authority/authenticity* (the signature, the perceived origin). It creates a *new object* falsely claiming an old history. Victim: Buyers/institutions/public trust deceived about provenance, *and* the market for the original artist's genuine work.
      *   **Residue:** Newsroom ethics focuses intensely on the *expression* and its *immediate creator*. Art forgery deals heavily with the *object's biography* and the *market value derived from historical origin*. While both punish the lie of origin, the *nature* of what's appropriated (expression vs. authority/object-history) and the *primary victims* differ subtly. Your framework captures the core "lie about origin" but slightly underweights the unique significance of the *physical object's* fabricated history in art.

  2.  **"Workshop Copy Signed by Master is a Lesser Work":**
      *   **Translation Attempt:** This is like a **staff-written piece published under a star columnist's byline, with full internal transparency** (editor knows, maybe a tiny credit line) but presented to the public as solely the columnist's work.
      *   **Where Newsroom Talk Runs Out:** **Your framework *cannot* express why this art piece is "lesser" aesthetically.** In the newsroom scenario:
          *   Ethically: If internally transparent and the star "signs off" (accepts responsibility), this is often considered *acceptable practice* for columns or certain branded content. The public attribution aligns with the internal workflow. The piece stands on its own journalistic merit.
          *   Commercially: It leverages the star's brand, but that's business, not an ethical breach *if transparent internally*.
      *   **The Snag:** Newsroom ethics primarily cares about *truthfulness of sourcing/creation for accountability* and *preventing reader deception*. If the process is internally kosher and the piece meets standards, the byline reflects the *responsible authority*, not necessarily the sole typist. **The art world's claim of "lesser aesthetic value" hinges on concepts like "the master's hand," "aura," or "authenticity as an intrinsic aesthetic property" – concepts utterly foreign to newsroom practice.** Your vocabulary has no equivalent for devaluing a well-reported, well-written piece *solely* because a junior staffer drafted it under a senior's guidance and byline (assuming no deception). This residue is pure aesthetics smuggled in via provenance.

  3.  **Claims Surviving with Distortion:**
      *   **"Aesthetically worse" forgery:** Only survives by being *redefined* as "ethically compromised due to fabrication of origin." The aesthetic judgment is discarded in favor of the sourcing violation.
      *   **"Different work" restoration:** Survives by mapping onto extreme aggregation/churnalism demanding radical transparency or re-bylining, *not* by validating the inherent "newness" as an aesthetic quality. The focus is on accurately representing *how* the current piece came to be.

  4.  **The Direction of the Residue:**
      *   **Your Framework's Missing Category:** It lacks a robust concept of **"Authenticity as an Intrinsic Aesthetic Property"** independent of truthfulness to source material *for informational purposes*. Newsrooms care about truth for accountability and avoiding deception. The art debate often imbues the *physical origin* and *trace of the creator's hand* with aesthetic value *in itself*, separate from the visual experience or informational content. Your framework struggles to express why a perfect copy *isn't* the same as the original *on an aesthetic level* beyond the lie.
      *   **Art Debate Importing Market/Provenance as Aesthetics:** **This is the dominant residue.** Your translation exposes how much of the "aesthetic" argument in forgery is actually:
          *   **Dressed-up Provenance:** The violation of the object's true history.
          *   **Dressed-up Market Concerns:** The fear of devaluing originals, protecting investments, and maintaining scarcity.
          *   **Dressed-up Authority:** The cult of the unique genius creator.
      *   **The Cut:** Your newsroom framework acts like an X-ray. It clearly shows the core ethical skeleton of the forgery debate (fabrication, false sourcing, plagiarism-of-origin). However, it reveals that much of what passes for *aesthetic* argument in art – particularly the "lesser work" claims even without deception (like the workshop copy) or the inherent "differentness" of the restored fresco beyond its composite nature – is **largely provenance, market, and authority concerns wrapped in aesthetic language.** The genuinely irreducible residue is the art world's belief in "authenticity" as a non-replicable, aura-like aesthetic quality inherent in the original object/creation moment – a belief your pragmatic, accountability-focused newsroom vocabulary has no analog for and likely considers mystification.

  **Conclusion for Your Pitch:**

  Your hunch is fundamentally sound: **Both journalism and art punish the lie of origin, not the content itself.** The "history" is paramount. Your newsroom framework brilliantly dissects the ethical core of forgery as **source fabrication and provenance fraud.**

  However, the translation reveals a critical insight: **Much of the "aesthetic" condemnation in art forgery debates is actually displaced concern about provenance, market value, and authorial authority.** Your framework *cannot* naturally express concepts like "the master's hand" as an aesthetic essential because it prioritizes truthful sourcing for accountability and accurate information over the mystique of origin.

  **Pitch this as:** An examination of art forgery through the ruthless lens of newsroom ethics, exposing how our shared condemnation hinges on the lie of origin, but also revealing how the art world's "aesthetic" arguments often mask concerns about markets, provenance, and authority – concerns that, in the newsroom, we handle through transparency, corrections, and bylines, not by deeming a well-sourced piece "lesser" because of who typed it. The piece would highlight the surprising alignment on punishing false history, while questioning the aestheticization of provenance in art. The "perfect forgery" is ethically rotten news, regardless of how pretty the pixels are.
