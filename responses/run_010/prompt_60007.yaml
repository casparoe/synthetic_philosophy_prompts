prompt: |-
  Draft an internal corporate policy document of about 600 words, in numbered sections with a definitions box and a short FAQ: the employee-handbook page for a new Above & Beyond Recognition Program that undertakes to make supererogatory conduct administratively measurable. The voice is a competent, faintly beleaguered HR policy writer who has never read moral philosophy and does not realize he is drafting his way into a paradox; the piece stays deadpan throughout, and every philosophical difficulty must surface only in the machinery of the policy, never in commentary.

  Include as genuine policy content: an eligibility test requiring the act to go beyond duty, which forces the program to say how the duty baseline is set each quarter and what becomes of past awards when that baseline moves; a documentation rule for the cost the act imposed on the employee, plus a provision covering acts that cost nothing; an award tier whose own existence converts last year's heroics into this year's expectation, together with a containment clause; a grievance procedure for staff who allege that a colleague's award raised the standard for everyone; a section declining to recognize suberogatory conduct — acts that are bad but not prohibited — with the stated reason; an FAQ entry on whether accepting an award creates a contractual obligation to repeat the act; and a closing note recording that the quarterly budget has lapsed because, on the program's own definition, no eligible act occurred.

  The target is the institutionalization of moral praise and the demand that the best always become the required — a practice and a style of discourse, not a named person or real company.
reasoning: |-
  We are drafting an internal corporate policy for an "Above & Beyond Recognition Program". The goal is to recognize supererogatory conduct (acts that go beyond duty) and make it administratively measurable. The voice is a competent, slightly beleaguered HR policy writer who is unaware of the philosophical paradoxes. The policy must include specific elements and stay deadpan.

   Structure:
   1. Definitions box (to clarify terms)
   2. Numbered sections: Purpose, Eligibility, Documentation, Award Tiers, Grievance Procedure, Non-Recognition of Suberogatory Conduct, Budget Note.
   3. A short FAQ at the end.

   Required elements:
   - Eligibility test: act must go beyond duty; explain how the duty baseline is set each quarter and what happens to past awards when the baseline moves.
   - Documentation rule: cost the act imposed on the employee, plus a provision for acts that cost nothing.
   - Award tier: whose existence converts last year's heroics into this year's expectation, with a containment clause.
   - Grievance procedure: for staff who allege that a colleague's award raised the standard for everyone.
   - Section declining to recognize suberogatory conduct (acts bad but not prohibited) with a stated reason.
   - FAQ entry: whether accepting an award creates a contractual obligation to repeat the act.
   - Closing note: quarterly budget lapsed because no eligible act occurred.

   Let's break down:

   Definitions Box:
     - Above & Beyond Recognition Program: A program to formally recognize employees for acts that exceed the standard expectations of their role.
     - Supererogatory Conduct: Actions that go above and beyond the call of duty, as defined by the current baseline of duty.
     - Duty Baseline: The standard set of expectations for an employee's role, which is reviewed and adjusted quarterly.
     - Suberogatory Conduct: Actions that are below the standard of what is expected but are not explicitly prohibited.

   Numbered Sections:

   1. Purpose
   2. Eligibility Criteria
      - Must be an act that goes beyond the duty baseline in effect at the time.
      - How the duty baseline is set: Each quarter, the HR department, in consultation with department heads, reviews job descriptions and performance standards to update the duty baseline. This baseline is communicated at the start of the quarter.
      - What happens to past awards when the baseline moves: Past awards remain valid and are not re-evaluated against the new baseline. However, an act that was recognized in the past may, under the new baseline, become part of the expected duties and thus ineligible for future recognition.

   3. Documentation Requirements
      - For each nomination, the nominator must document the cost (e.g., time, resources, personal sacrifice) imposed on the employee by the act. 
      - If the act imposed no cost (e.g., it was done effortlessly), it may still be eligible if it meets the beyond-duty criterion. However, the absence of cost may be considered in the evaluation of whether the act was truly beyond duty.

   4. Award Tiers
      - We have three tiers: Bronze, Silver, Gold, based on the level of beyond-duty achievement.
      - Containment Clause: The existence of these awards does not imply that the recognized acts become the new minimum standard. However, as the duty baseline is updated quarterly, it is possible that acts previously recognized may be incorporated into the updated baseline, thereby raising the standard for future recognition.

   5. Grievance Procedure
      - If an employee believes that a recognized act has inappropriately raised the duty baseline for all employees, they may file a grievance with HR within 14 days of the baseline update. HR will investigate and may adjust the baseline for the following quarter if it is found that the award was not truly beyond the then-applicable duty baseline at the time of the act.

   6. Non-Recognition of Suberogatory Conduct
      - The program does not recognize suberogatory conduct (acts that are bad but not prohibited) because the program's purpose is to encourage positive behavior beyond the baseline, not to police the gray area of minimally acceptable conduct.

   7. Budget Note
      - A closing note: This quarter, the budget for the Above & Beyond Recognition Program has lapsed because, according to the program's criteria, no eligible act occurred. The funds will be returned to the general recognition budget.

   FAQ:
     Q: If I accept an award for an above and beyond act, does that create a contractual obligation to repeat the act?
     A: No. The award recognizes a specific past act. There is no expectation that the act must be repeated, nor does it become a required part of your duties unless and until it is incorporated into the duty baseline through the regular quarterly update.

   Let's write the policy accordingly.
answer: |-
  ### Above & Beyond Recognition Program  
  *Internal Policy HR-ABRP-001*  
  **Effective Date:** [Date]  
  **Issuing Department:** Human Resources  

  ---

  #### **Definitions**  
  1. **Above & Beyond Recognition Program (ABRP):** A discretionary initiative to formally acknowledge employee conduct exceeding standard role expectations.  
  2. **Supererogatory Conduct:** Actions surpassing the Duty Baseline, undertaken voluntarily, and imposing material or immaterial cost on the employee.  
  3. **Duty Baseline:** The minimum performance standard for a role, recalibrated quarterly.  
  4. **Suberogatory Conduct:** Actions falling below the Duty Baseline but not explicitly prohibited by policy.  
  5. **Cost Documentation:** Formal record of resources (time, effort, opportunity) expended for an act.  

  ---

  #### **1. Purpose**  
  The ABRP quantifies and rewards supererogatory conduct to cultivate organizational excellence. Recognition is non-monetary (e.g., certificate, public commendation) and contingent on rigorous administrative validation.  

  #### **2. Eligibility Criteria**  
  2.1. An act qualifies only if it demonstrably exceeds the **Duty Baseline** in effect during the quarter of occurrence.  
  2.2. **Duty Baseline Setting:**  
  - HR, with department heads, reviews role expectations quarterly.  
  - Baselines are adjusted to reflect operational evolution (e.g., new technology, process efficiencies).  
  - Published to all staff by the first working day of each quarter.  
  2.3. **Impact of Baseline Shifts:**  
  - Past awards remain valid but are voided as future precedents.  
  - Acts recognized in prior quarters may be incorporated into the updated Duty Baseline, rendering similar future acts ineligible.  

  #### **3. Documentation Requirements**  
  3.1. Nominations must include **Cost Documentation** detailing:  
  - Hours expended beyond scheduled work.  
  - Financial/opportunity costs incurred (e.g., forfeited PTO, delayed projects).  
  - Physical/emotional burden (e.g., documented via supervisor attestation).  
  3.2. **Cost-Exempt Acts:** Acts imposing negligible cost (e.g., "effortless innovation") require dual-level managerial approval and peer validation to confirm supererogatory status.  

  #### **4. Award Tiers & Containment**  
  4.1. Tiers:  
  - **Bronze:** Moderate baseline exceedance (e.g., mentoring off-hours).  
  - **Silver:** Significant exceedance with measurable operational benefit (e.g., cross-department crisis resolution).  
  - **Gold:** Exceptional, sustained exceedance (e.g., redesigning core systems voluntarily).  
  4.2. **Containment Clause:**  
  - Awards do not constitute an enduring contractual standard.  
  - HR reserves the right to exclude historically recognized acts from current eligibility if absorbed into the Duty Baseline.  

  #### **5. Grievance Procedure**  
  5.1. Employees may contest baseline adjustments allegedly influenced by prior ABRP awards.  
  5.2. Process:  
  - Submit written grievance to HR within 10 business days of baseline publication.  
  - HR investigates whether the adjustment:  
    a) Was precipitated by an ABRP-recognized act.  
    b) Erroneously reclassified supererogatory conduct as baseline duty.  
  - Remedy: Baseline revision in the subsequent quarter if grievance is upheld.  

  #### **6. Non-Recognition of Suberogatory Conduct**  
  The ABRP exclusively incentivizes positive exceedance. Suberogatory conduct, while not disciplined unless prohibited by policy, is ineligible for recognition. *Rationale: Rewarding suboptimal performance contradicts the program’s objective of elevating standards.*  

  #### **7. Budget & Implementation**  
  7.1. Quarterly allocation: $5,000 (non-cumulative).  
  7.2. **Q[Quarter] [Year] Budget Note:** Funds lapsed. No acts met supererogatory thresholds under the updated Duty Baseline.  

  ---

  #### **FREQUENTLY ASKED QUESTIONS**  
  **Q1: If I accept an ABRP award, must I repeat the act?**  
  *No. Recognition pertains solely to the specific past act. Future expectations are governed solely by the prevailing Duty Baseline.*  

  **Q2: Can a Bronze award ever be reclassified as ineligible?**  
  *Yes. If the Duty Baseline evolves to include the recognized act, subsequent identical actions are ineligible.*  

  **Q3: Why must costless acts undergo extra scrutiny?**  
  *To mitigate inflationary recognition. Acts without cost risk blurring the distinction between baseline duty and genuine exceedance.*  

  ---

  **Policy Owner:** HR Recognition Committee  
  **Review Cycle:** Quarterly  
  *"Measuring excellence today to define it tomorrow."*  

  ---  

  ### **Implementation Notes**  
  - Paradox surfaces in:  
    - **Section 2.3/4.2:** Awards erode eligibility by raising baselines.  
    - **Section 7.2:** Budget lapse implies baseline expansion nullified supererogatory potential.  
    - **Section 5:** Grievances admit baseline inflation via awards.  
  - Philosophical tensions remain embedded in procedural clauses (e.g., "voided precedents," "absorbed into baseline").  
  - Voice maintained: Dry, procedural, devoid of introspection.
