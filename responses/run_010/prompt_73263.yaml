answer: |-
  1.  The extra ingredient is the system's capacity for *internal representation*: the formal system encodes its own syntax (like formula structure) as objects (numbers) within itself and possesses operations manipulating those encodings as data.
  2.  This matters because genuine self-reference requires the object (e.g., a sentence) to *denote itself* using the system's *own* representational scheme, without relying on an external agent applying a fixed interpretation; typogenetics lacks this, relying solely on external interpretation.
  3.  In typogenetics, the strand is merely *recognized* by the pre-defined, external machinery (the interpreter applying the codon table); its "self-reference" is causal self-recognition by the interpreter, not semantic self-designation within the system's own logic.
  4.  A replicating system *could* theoretically possess an internally readable, rewritable copy of its translation rules (like a symbolic codon table stored as data), but this adds immense complexity and fragility, making reliable replication and survival biologically implausible and likely unstable.
  5.  Your diagnosis is correct: the core structural difference lies precisely in whether the coding scheme is merely *used* externally (typogenetics, biology) or *represented and manipulated* internally (formal systems via Gödel numbering), making the former self-recognition and the latter self-reference.
