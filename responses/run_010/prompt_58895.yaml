prompt: |-
  Not a philosopher, I just watch a lot of arguments and there's a move I keep running into that I've never been able to find a word for.

  Setup: someone gets blamed for a failing — blew a deadline, relapsed, took the money, kept quiet about something — and the person doing the blaming has genuinely never done that thing, not once. The reply they get isn't "you do it too." It's the opposite: the fact that they've never done it is what supposedly disqualifies them. "You've never been that deep in it, so you don't get to weigh in." "Easy for you to say, you never had the itch." And sometimes there's a counterfactual attached — "if you'd been in my position you'd have done worse than me" — which is doing alot of work, because now the blamer's actual clean record is treated as beside the point and what matters is how they'd have behaved under conditions that never obtained.

  Instances I've actually seen:
  - someone who's never been addicted telling a friend that relapsing was a choice, and getting back that a person who's never had cravings can't possibly know what that decision looked like from the inside;
  - a team lead who has never missed a delivery pulling a junior aside about a slipped deadline, and the rest of the team closing ranks on the grounds that the lead has never been underwater on three projects at once and therefore has no idea;
  - a country with no history of the particular kind of corruption being described lecturing one that does, and the answer being that the lecturing country simply never faced those choices, so it can't judge them.

  What I can't work out is what this is *supposed* to be an objection to. Sometimes it reads like an informational point — you're missing facts about what the situation is like. Sometimes like a point about who's allowed to condemn anyone, which doesn't obviously follow from missing facts. And sometimes it's the counterfactual version, where the claim is that there's no real difference between the two people at all, just a difference in what they happened to be exposed to. Those feel like three different objections wearing one coat.

  So: is there an established name for this? I've read up on tu quoque and its clearly not that — tu quoque says you did it too, this says your not having done it is the problem. I know there's a whole philosophical literature on whether hypocrites get to blame people, but my blamer isn't a hypocrite, they're the reverse, and the objection seems to bite harder the cleaner their record is. I also know the "you were just lucky, not better" idea has a name somewhere in ethics and I suspect it's related, but on its own that doesn't capture the part about who gets to say anything.

  What I want isn't just a label — I want the carving. Which of the three readings (missing information, missing authority, no real difference) has the best claim to be the underlying thing? Is the counterfactual version doing something different from the experiential one, or is it just the experiential one with the teeth showing? And under what conditions is the objection actually *right* — because there does seem to be a genuine case where the person who held out did get lucky and it's not obvious they're better placed to judge. If there's no established term, coin one, define it, and tell me what it isn't: what seperates it from tu quoque, from ordinary hypocrisy objections, from the luck-based one, and from the general "you need lived experience to have an opinion" demand, which I think is a broader and blunter thing.
reasoning: |-
  Okay, the user is describing a specific rhetorical move they've observed in arguments. Let me unpack this. They've seen situations where someone blames another person for a failure, but the blamer has never experienced that particular failing themselves. The response they get isn't "you do it too" (which would be tu quoque), but rather "your lack of experience disqualifies you from judging." The user provides concrete examples: addiction relapse, work deadlines, international corruption. 

  Hmm, what's really interesting here is how the user identifies three distinct interpretations tangled together: (1) an informational deficit (you lack firsthand knowledge), (2) a legitimacy deficit (you have no standing to judge), and (3) a moral equivalence claim (you'd have done the same in their shoes). The user wants to know if there's a name for this, but more importantly they want conceptual clarification - which of these three is the core objection? And when is this objection actually valid?

  First, I need to verify this isn't tu quoque. Absolutely not - tu quoque accuses the blamer of hypocrisy ("you did it too"), whereas here the blamer's clean record is held against them. The hypocrisy literature doesn't fit because the blamer isn't being inconsistent. 

  The experiential lacuna angle seems strongest. There's a legitimate epistemic point about how lived experience provides unique insights into certain pressures. But then it morphs into demands for moral authority - that's a separate move. And the counterfactual version ("you'd have done worse") is actually a different beast - it's attacking the blamer's character rather than their right to speak.

  I recall the "clean hands" argument from moral philosophy, but that's about participation in systemic wrongs. The "moral luck" concept fits better - Nagel's idea that we're judged on factors beyond our control. The blamer's clean record might indeed stem from luck (never facing those temptations), not superior virtue. 

  But the most precise framing might be the "positional superiority" objection - claiming the blamer occupies a privileged position that distorts their judgment. This covers all three interpretations: the privileged position causes ignorance (informational), undermines standing (authority), and may result from luck (counterfactual). 

  For the user's request to "carve" this: the core is likely the experiential gap, but the objection gains force when combined with moral luck. The counterfactual is an aggressive extension implying not just ignorance but moral equivalence. The objection is most valid when assessing actions under extreme duress where imagination fails; least valid when judging clear violations of universal principles. 

  I should emphasize that this differs from general demands for lived experience by its reactive, defensive nature - it's deployed specifically to deflect blame. And it differs from tu quoque by weaponizing the blamer's virtue rather than their vice. 

  The user seems philosophically sophisticated - they've already identified key distinctions. Their frustration suggests they want tools to dissect this move in real arguments. I'll need to provide clear differentiators and practical criteria for when the objection holds water.
answer: |-
  You've pinpointed a fascinating and potent rhetorical maneuver that blends epistemic, moral, and emotional objections. It doesn't have a single universally accepted name, but we can dissect it, coin a precise term, define it, and carve its boundaries.

  **The Established Concepts & Why They Aren't Perfect Fits:**

  1.  **Tu Quoque (Appeal to Hypocrisy):** As you noted, this is about "You did it too!" Your case is the *opposite*: "You *never* did it, so you *can't* understand/judge!"
  2.  **Appeal to Experience / Argument from Authority (Lived Experience):** This is broader ("Only those with experience X can speak about X"). Your scenario is a specific *defensive* application *against blame*, weaponizing the *blamer's lack* of negative experience to invalidate their assessment or standing.
  3.  **Moral Luck (Nagel, Williams):** This is highly relevant! It deals with how luck (like never facing a particular temptation or pressure) affects moral judgment and responsibility. The counterfactual ("you'd have done worse") directly invokes moral luck – the blamer's virtue might be circumstantial, not inherent. However, moral luck is the *underlying philosophical concept*, not the specific *rhetorical objection* being deployed.
  4.  **Ad Hominem (Circumstantial):** This attacks the person's circumstances rather than their argument. Your case fits *partially* (attacking the blamer's lack of specific negative experiences), but it's more targeted than a general circumstantial ad hominem. It specifically attacks their *qualification to judge the specific failing*.
  5.  **Gatekeeping / Standing Arguments:** Broader concepts about who has the right to speak on an issue. This is a specific form focused on *lack of shared negative experience* as disqualifying for *blame*.

  **Defining the Specific Move: Positional Superiority Objection (PSO)**

  *   **Core Definition:** An objection levied against blame or criticism, arguing that the blamer's *lack of firsthand experience with the specific failing under discussion* (especially under comparable duress, pressure, or temptation) fundamentally undermines either:
      *   **(A)** Their *understanding* of the situation (Epistemic Objection),
      *   **(B)** Their *moral standing/authority* to assign blame or offer critique (Deontic Objection), or
      *   **(C)** The *validity of the moral distinction* between them and the blamed, implying the blamer's "virtue" is merely a product of fortunate circumstances and they would likely have failed similarly (Moral Luck / Counterfactual Objection).
  *   **Mechanism:** It shifts the focus *away* from the merits of the criticism or the nature of the failing itself, and *onto* the privileged position (lack of relevant negative experience) of the blamer. The blamer's "clean record" is paradoxically turned into a liability.
  *   **Essence:** "Your position of never having succumbed to *this specific pressure/temptation* invalidates your judgment of my succumbing to it."

  **The Carving: Your Three Readings**

  1.  **Missing Information (Epistemic):** This is often the *starting point* and the most plausible core. The claim is that certain pressures, temptations, or states of mind (cravings of addiction, feeling of being underwater, systemic corruption pressures) are *inherently opaque* to those who haven't lived them. The blamer literally lacks crucial data about the subjective difficulty or constraints involved ("You don't know what it's like").
  2.  **Missing Authority/Standing (Deontic):** This builds on the epistemic claim. The argument is that lacking this experiential knowledge strips the blamer of the *right* to judge or condemn. Even if they intellectually grasp the situation, they lack the "moral license" earned through shared struggle or vulnerability ("You don't get to weigh in"). This often carries emotional weight about fairness and who has "walked the walk."
  3.  **No Real Difference / Moral Luck (Counterfactual):** This is the most aggressive and consequential extension. It uses the blamer's lack of experience not just to question understanding or standing, but to *attack the moral difference itself*. By asserting "You'd have done the same/worse," it reduces the blamer's "virtue" (not failing) to mere luck of circumstance, implying the blamed person's failure was almost inevitable given the situation. This collapses the moral hierarchy implied by the blame.

  **Which is the Underlying Thing?**

  *   **The Core Driver is the Epistemic Claim (Missing Information).** The power of the objection fundamentally rests on the plausible assertion that some experiences grant unique, inaccessible knowledge about the pressures involved in failing. Without this premise, the standing and counterfactual arguments lose their foundation.
  *   **The Standing Claim (Missing Authority)** is a common and powerful *social/rhetorical consequence* derived from the epistemic claim. It transforms "you lack knowledge" into "you lack the right."
  *   **The Counterfactual Claim (No Real Difference)** is the *most radical extension*. It takes the experiential gap and uses it not just to excuse or contextualize the failure, but to *deny the blamer's moral superiority*. It's often deployed when the stakes are high or the blamed feels particularly defensive. It *can* be seen as the "teeth showing" version, applying maximal pressure by attacking the blamer's character via moral luck.

  **When is the Objection Actually Valid?**

  The PSO has genuine force in specific contexts:

  1.  **When Subjective Experience is Crucial:** For failures involving intense internal states (addiction cravings, panic, despair, extreme temptation), the epistemic claim holds significant weight. Outsiders often *do* underestimate the sheer willpower required to resist or the distorting effect of the state.
  2.  **When Systemic Pressures are Overwhelming:** Judging an individual's failure within a system rife with corruption, perverse incentives, or extreme pressure (like your underwater junior) requires understanding how the system shapes choices. Someone outside that system may misattribute too much to individual failing.
  3.  **When Assessing "Reasonable" Behavior:** Judgments like "you should have resisted" or "you should have spoken up" rely on assumptions about what a "reasonable person" would do. The PSO argues that the blamer's baseline for "reasonable" is skewed because they've never faced *those specific* unreasonable pressures. The objection highlights that "reasonable" is context-dependent.
  4.  **As a Call for Humility:** Even if not fully disqualifying, the PSO can validly remind the blamer that their perspective is limited and their own virtue might be more contingent on circumstance than they acknowledge.

  **When is the Objection Invalid or Misapplied?**

  1.  **Violations of Universal Principles:** When the failing involves clear, objective harm or violation of fundamental rights (e.g., theft causing direct harm, serious negligence), the *nature of the act itself* can be judged without needing the perpetrator's subjective experience. "I was under pressure" explains but doesn't necessarily excuse core wrongdoing.
  2.  **Ignoring Observable Facts/Consequences:** The PSO often downplays the objective consequences of the failure (missed deadlines hurt the team, relapse harms relationships) which *can* be assessed externally.
  3.  **Denying Shared Humanity & Reason:** Taken to extremes, the counterfactual ("you'd have done worse") can become a denial of human agency and the possibility of moral growth or exceptional fortitude. It risks implying *no one* could have resisted.
  4.  **Used as a Blanket Shield:** Deploying it against *any* criticism from someone without identical negative experience, even when the criticism is about observable outcomes or clear principles.
  5.  **Ignoring Mitigating Knowledge:** A blamer *can* gain significant understanding through deep empathy, study, observation, or analogous experiences, even without identical lived experience. The PSO sometimes dismisses this too readily.

  **Coined Term & Definition Recap:**

  *   **Term:** **Positional Superiority Objection (PSO)**
  *   **Definition:** A defensive rhetorical move used to reject blame or criticism by arguing that the blamer's lack of firsthand experience with the specific failing under comparable duress or temptation fundamentally undermines their understanding, their moral standing to judge, and/or the validity of the moral distinction between them and the blamed, often implying the blamer's avoidance of the failing was due to fortunate circumstances rather than superior virtue.

  **What it Isn't (Final Distinctions):**

  *   **Not Tu Quoque:** PSO attacks the blamer's *lack* of the failing; Tu Quoque attacks the blamer's *commission* of the (same or similar) failing (hypocrisy).
  *   **Not Simple Hypocrisy Objection:** The blamer in PSO *isn't* being hypocritical; they are genuinely consistent. The objection attacks their *consistency itself* as stemming from fortunate circumstance/lack of challenge.
  *   **Not Just Moral Luck:** Moral luck is the *philosophical foundation* for the counterfactual aspect of PSO. PSO is the *rhetorical application* of that concept (and others) in a specific blame-deflection context.
  *   **Not General "Lived Experience" Demand:** While grounded in lived experience, PSO is specifically *reactive* (deployed *against blame*), *defensive*, and focuses *exclusively* on the *blamer's lack* of *negative* experience with the *specific failing* being discussed. General lived experience arguments are broader and can be proactive.

  **In essence, the PSO weaponizes the blamer's virtue (their clean record) by reframing it as ignorance, illegitimacy, or mere luck.** Its power lies in the undeniable kernel of truth about the limits of external understanding of intense pressures, but it can be stretched to deflect legitimate accountability. Recognizing its components (epistemic, deontic, counterfactual) is key to analyzing its validity in any given instance.
