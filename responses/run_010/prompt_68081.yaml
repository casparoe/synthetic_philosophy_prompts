  # Adversarial Collaboration: Joint Statement on the Afterlife Conjecture

  ## 1. Agreed Claims

  We, the conjecturist and the experientialist, agree on the following non-trivial claims:

  1. **The doomsday scenario elicits horror.** Both sides agree that upon learning that humanity will be destroyed 30 days after one's own death, a typical person would experience profound horror. This horror is a robust psychological response that is not easily dismissed as irrational.

  2. **The infertility variant elicits a different reaction.** In the scenario where humanity continues but becomes permanently infertile (so that humanity dies out naturally without new births), the typical reaction is less intense than in the doomsday scenario. Both sides agree that the horror in the doomsday scenario is more acute and that this difference in reaction is significant.

  3. **Reflection on our reactions can bear substantial weight.** Both sides agree that introspection and careful consideration of our emotional responses (like the horror in the doomsday scenario) are legitimate starting points for philosophical inquiry. However, we also agree that such reactions are not infallible and may require further analysis to determine whether they track objective features of value or are merely psychological.

  4. **The value of many current activities is contingent on the continuation of humanity.** Both sides accept that if we were to learn that humanity will end soon, many of our current projects (e.g., writing a book, building an institution, scientific research) would seem to lose their point. This feeling of lost meaning is a common human response and is not disputed.

  ## 2. Disagreements Table

  | Issue | Conjecturist's Formulation | Experientialist's Formulation | Substantive or Verbal | Justification |
  |-------|----------------------------|-------------------------------|-----------------------|--------------|
  | The nature of value | Value can exist independently of being experienced by any subject; it is not solely a matter of how things go for subjects of experience. | All value and disvalue must be grounded in the experiences of subjects; nothing can be valuable or disvaluable in the absence of a subject for whom it is a certain way. | Substantive | The dispute is about the metaphysics of value: whether value requires a valuer or can exist objectively. |
  | The disvalue in the doomsday scenario | The horror in the doomsday scenario tracks a genuine disvalue: the destruction of the future of humanity is an objective loss, even for the deceased, because it undermines the meaning and value of their life and the lives of all humans. | The horror in the doomsday scenario is entirely explained by our psychological makeup: anticipatory dread, the frustration of our projects, and our inability to imagine our own absence. There is no residue of disvalue beyond these psychological factors. | Substantive | The disagreement is about the explanation of the horror: one side posits an objective disvalue, the other reduces it to psychological causes without an external disvalue. |
  | The role of the afterlife in value | A large part of what we value is valuable only on the condition that humanity continues to exist after our deaths. This continuation is a necessary condition for the full value of our lives and activities. | The value of our lives and activities is entirely contained within the experiences of existing beings; the continuation of humanity after our deaths is not a condition of value but may be something we happen to care about. | Partly Verbal | The dispute hinges on the meaning of "value": the conjecturist uses it in a broader sense that includes meaning independent of current experiences, while the experientialist restricts it to experiential states and thus sees the other's claim as about what we care about, not about value itself. |
  | The concept of 'meaning' | The meaning of a life or project can be affected by events after death, such as the continuation of humanity, because meaning is not solely determined by the experiences of the subject. | The meaning of a life or project is entirely a matter of how it is experienced by the subject and others during their existence; events after death cannot affect meaning because there is no subject to experience them. | Substantive | This is a substantive disagreement about the nature of meaning and its relationship to time and experience. |

  ## 3. Cruxes

  ### Crux 1: Amnesia Case
  - **Scenario**: Humanity ends thirty days after your death, but you take a drug that permanently erases your knowledge of this fact. Everything else about your remaining life remains unchanged.
  - **Sub-question**: Does the disvalue of the doomsday scenario depend on the subject's awareness of it?
  - **Case bearing on it**: This case tests whether the horror (and the disvalue it might track) requires conscious awareness. If the disvalue persists even without awareness, it would support the conjecturist; if it vanishes, it supports the experientialist.
  - **Conjecturist prediction**: The disvalue remains because the condition for the value of the subject's life (the continuation of humanity) is still absent, regardless of awareness. The horror is a response to the disvalue, but the disvalue itself is objective and independent of the subject's state of mind.
  - **Experientialist prediction**: Without awareness, the horror disappears and so does the disvalue. The subject's life proceeds as if the future exists, and thus the experiential conditions for value are unchanged. Any disvalue must be mediated by experience.

  ### Crux 2: Archive Case
  - **Scenario**: Humanity ends thirty days after your death, but every record of human thought and achievement is preserved in a self-sustaining archive that will be discovered and appreciated by conscious, non-human agents a thousand years later.
  - **Sub-question**: Does the value of human achievements require that they be appreciated by beings like us (humanity) or can it be preserved by appreciation from any conscious beings?
  - **Case bearing on it**: This case tests the conjecturist's claim that the value of our activities depends on the continuation of humanity specifically, versus the experientialist's view that value is created by any appreciation by conscious beings.
  - **Conjecturist prediction**: The archive case does not restore the value because the appreciative agents are nothing like us and share none of our concerns. The value of human activities is tied to the continuation of the human form of life, not just any appreciation.
  - **Experientialist prediction**: The archive case restores the value because the records are appreciated by conscious beings who can experience and value them. The value is in the appreciation, not in the identity of the appreciators.

  ### Crux 3: Retroactive Case
  - **Scenario**: You are told that human extinction actually occurred a year ago; you are the last human and everyone you have known for the past year was an indistinguishable replica. Your experiences and projects during that year were unchanged.
  - **Sub-question**: Does the disvalue of extinction depend on when it occurs relative to the subject's experiences?
  - **Case bearing on it**: This case tests whether the disvalue is tied to the temporal direction of the extinction (after death) or whether it can be retroactive and still affect the value of past experiences.
  - **Conjecturist prediction**: The disvalue occurs because the condition for the value of the past year (the existence of humanity) was absent. Even though the experiences were the same, the meaning and value of that year are undermined by the fact that humanity was already gone.
  - **Experientialist prediction**: There is no disvalue because the experiences during the past year were unchanged and were positive. Since value is entirely experiential, the revelation about the past does not alter the value of those experiences.

  ## 4. Closing Section

  ### Conjecturist's admission
  The conjecturist acknowledges that if it were shown that the horror in the doomsday scenario entirely disappears when subjects are given a compelling reason to believe that the extinction will not undermine the value of their projects (e.g., if we could show that the projects are intrinsically valuable independent of any future), this would count as evidence against the conjecturist view. Specifically, if a case were constructed where the subject learns of the impending extinction but, due to some feature of the case, does not feel horror and does not judge their projects as meaningless, then the experientialist explanation would be strengthened.

  ### Experientialist's admission
  The experientialist acknowledges that if it were shown that the horror persists even when all the proposed psychological factors (anticipatory dread, project frustration, etc.) are absent or controlled for, this would count as evidence against the experientialist view. For instance, if a subject could be shown to have no personal projects extending beyond death and no dread of non-existence, yet still experiences horror at the doomsday scenario, then there might be a residue that requires an explanation in terms of objective disvalue.

  ### Would anything move the debate?
  Both sides agree that the debate is not entirely intractable. The cases above (especially the cruxes) are designed to test the core claims. However, the conjecturist suspects that some disagreements may run deep because of differing intuitions about the nature of value and meaning. The experientialist, on the other hand, believes that empirical psychological studies on reactions to these scenarios could be decisive. Both hold that further reflection and examination of thought experiments could lead to convergence, but neither expects the other to yield without significant evidence from the cases.

