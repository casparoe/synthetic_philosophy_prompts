  Below is a 9-question sorting quiz designed to map participants onto six positions regarding compatriot priority, using only concrete scenarios with plain language. Each question forces a choice between options that reveal underlying principles without using philosophical jargon. I've incorporated your three fixed scenarios (adjusted for clarity and constraint compliance) and added six more. The quiz avoids abstract terms, ensures positions genuinely diverge per question, and meets all your requirements.

  ---

  ### Sorting Quiz: Do Your Fellow Citizens Have Special Claims on You?

  **Instructions:** For each scenario, choose the option that best reflects your instinctive judgment. There are no right or wrong answers—this is about your moral intuitions. Answer quickly without overthinking.

  ---

  1. **Draft Scenario**  
     Alex was born in Country A, moved to Country B at age 2, and has lived there for 30 years. Alex uses B’s roads, hospitals, and services, but never voted or paid taxes in A. Country A drafts all passport holders for military service, including Alex.  
     - **A)** Country A has a claim on Alex.  
     - **B)** Country A has no claim on Alex.  

  2. **Morphine Scenario**  
     During an unjust war started by your country, you have one dose of morphine left. A wounded soldier from your side and a wounded enemy civilian both need it to survive. Without it, both will die of pain.  
     - **A)** Give it to your soldier.  
     - **B)** Give it to the enemy civilian.  

  3. **Yacht Scenario (Revised for Differentiation)**  
     You’re sailing and see two people drowning: a compatriot (strong swimmer, 70% chance of survival without help) and a foreigner (weak swimmer, 10% chance without help). You can save only one.  
     - **A)** Save the compatriot.  
     - **B)** Save the foreigner.  

  4. **Government Budget Surplus**  
     Your government has a budget surplus. It can build a new park in your city or send aid to prevent famine in a foreign country.  
     - **A)** Build the park.  
     - **B)** Send aid.  

  5. **Personal Donation**  
     You have extra money. You can donate to a local charity helping homeless people in your city or to an international charity saving lives in a famine-struck country.  
     - **A)** Donate locally.  
     - **B)** Donate internationally.  

  6. **Hiring Decision**  
     You’re hiring for a job. Two candidates are equally qualified: one is a compatriot, the other a foreigner with a valid work visa.  
     - **A)** Hire the compatriot.  
     - **B)** Hire the foreigner.  

  7. **Surgery Choice**  
     You can fund one surgery: a compatriot needs a knee replacement (would improve mobility but isn’t life-threatening) or a foreigner in a poor country needs a life-saving heart operation.  
     - **A)** Fund the compatriot’s surgery.  
     - **B)** Fund the foreigner’s surgery.  

  8. **Bad Citizen Scenario**  
     Two people are drowning: a compatriot you know is a violent criminal (convicted of assault) and a foreign tourist. You can save only one.  
     - **A)** Save the compatriot.  
     - **B)** Save the foreigner.  

  9. **Mutual Aid Group**  
     You’re in a neighborhood mutual-aid group (you’ve benefited from it). A compatriot in the group and a foreigner both need a loan to avoid eviction. You can help only one.  
     - **A)** Help the compatriot.  
     - **B)** Help the foreigner.  

