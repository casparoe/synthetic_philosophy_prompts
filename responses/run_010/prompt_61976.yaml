  ### Scoring Key  
  Match your answers (A/B) to the patterns below to find your position. Positions are in plain English:  

  | Position | Answer Pattern (Q1–Q9) | Description |
  |----------|-------------------------|-------------|
  | **1. No compatriot priority** | B,B,B,B,B,B,B,B,B | Your fellow citizens have no special moral claims on you. Everyone’s needs matter equally, regardless of nationality. |
  | **2. Claims from shared practices** | A,A,A,A,A,A,A,A,A | Your fellow citizens have claims because you’re part of shared institutions (e.g., laws, economy, culture). These bonds create duties. |
  | **3. Derivative duties (state-first)** | A,B,B,A,B,B,B,B,B | The *state* has duties to citizens, and you owe duties to the state. On your own, you should treat everyone equally. |
  | **4. Partiality as permission** | A,A,A,A,A,A,B,B,A | You’re *allowed* to favor compatriots, but they can’t demand it. It’s optional kindness, not an obligation. |
  | **5. Floor-then-partiality** | B,A,B,B,B,A,B,A,A | Everyone’s basic needs (food, safety, life) must be met globally first. After that, you may favor compatriots. |
  | **6. Reciprocity-based claims** | B,B,B,B,B,B,B,B,A | Compatriots have claims only if there’s mutual benefit or cooperation (e.g., you’ve directly benefited from each other). |

