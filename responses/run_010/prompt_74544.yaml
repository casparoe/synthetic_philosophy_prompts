  Hmm, the user is a second-year grad student who's been coding famine classifications for their supervisor's NGO project. They're stuck because the classification rule was never formally defined—they've just been agreeing on cases with their supervisor Miriam. Now they have to write a coding manual by Friday while Miriam is offline, and they've realized they might have been applying different reasoning all along.

