  The user's hidden worry: Their thesis depends on this framework, and they might have internal contradictions. The pub argument about Ireland shook their confidence. They need to show the funder this is rigorous, not arbitrary.

  Key insights from the anchors:
  1. "State taking" is central to C (Ukraine, Bengal, China all involve active extraction)
  2. Ireland avoids C because extraction was market-driven
  3. North Korea avoids C because distribution stopped, but nothing was taken
  4. Botswana has no extraction + relief
  5. Relief adequacy isn't decisive (Ireland had some relief but still M)

  Brainstorming rules that fit all six:
  - Rule A: C requires state actively taking food from starving people (fits Ukraine/Bengal/China; excludes Ireland/NK/Botswana)
  - Rule B: C requires state blocking alternatives (fits Ukraine/China border closures; Bengal denial policies; excludes Ireland where people could theoretically buy food if they had money)
