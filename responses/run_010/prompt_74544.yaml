  Looking at the anchors: Ukraine (C), Bengal (C), China (C) show clear state extraction/withholding despite knowledge of starvation. Ireland (M) is confusing because food left via market, not state seizure, and relief was attempted (though inadequate). North Korea (M) involves state failure to distribute rather than active taking. Botswana (D) shows no extraction + effective relief.

