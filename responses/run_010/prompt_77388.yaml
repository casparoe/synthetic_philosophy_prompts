  1. **Reflection vs. Conditionalization:**
     - **Reflection:** The Reflection principle requires that Dr. Smith's current credence in B should equal her expectation of her future credence in B. Since her future credence in B will be 0.3 with probability 0.5 and 0.9 with probability 0.5, her expectation is (0.5 * 0.3) + (0.5 * 0.9) = 0.15 + 0.45 = 0.6. Thus, Reflection requires her current credence to be 0.6, which matches her current credence. Therefore, Reflection endorses her current credence of 0.6 and hence recommends funding the project (since 0.6 >= 0.5).
     
