  Let me unpack the core argument first. The user challenges the standard "economic scaffolding" view of Kepler's astrology by proposing that: 1) It was actually foundational to his cosmology through the harmonic mechanism, 2) His reform was principled (harmonic ratios as filter), 3) The failure was specifically about "evaluative diffuseness" rather than unfalsifiability. That third point seems especially ambitious - they're trying to carve out new philosophical ground.

