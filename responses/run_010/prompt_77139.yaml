prompt: |-
  Two months ago I became the person at my university who decides accommodation requests. I'm the disability services coordinator at a public school of about 15,000, and during intake season I'm making eight or ten of these calls a day, students are promised an answer in five business days, and if I get one wrong there's an internal appeal plus a federal complaint route. It's personal for me: as an undergrad I was the kid who got turned down, and I still remember how arbitrary the letter sounded, so I don't want to write letters like that.

  The standard I have to apply is lifted out of the regs — an impairment that "substantially limits a major life activity." I'm told to read it broadly, which does not help at 4pm when a file is on my desk and one adverb is doing all the work. Here's what I think is actually going on, and this is the part I want you to work with. One view of vague words like that is that there is a sharp line — some exact point where a limitation becomes substantial — but nobody is in a position to know where it is, so any confident call about a case near the line is a guess wearing a lab coat. The other view is that there's no single line at all, just a family of acceptable ways of making the word precise, and a borderline case is one that comes out true on some of them and false on others; on that picture the only thing you're entitled to flatly assert is what comes out the same on every acceptable way of drawing it. Those sound like they should produce completely different paperwork, and the paperwork is what I need.

  So: write me the procedure I run on a file. Steps in order, executable in about ten minutes by someone with no philosophy background and no one to ask, and honest about which steps are judgment calls dressed up as procedure, where the procedure just stops at a no, and where it stops being a question of fact and hands the call to a human because somebody has to pick a way of making the rule precise rather than find one. Build it on whichever of the two views above actually changes what a coordinator does, and flag inside the relevant step what would be different under the other one.

  Run it on two files as you go. Case A: sophomore, clinician letter documenting generalized anxiety that "significantly impairs sustained concentration," registrar shows a 3.4 and the student has never once used an extension we granted. Case B: grad student whose presentation is close to identical to one I approved in September, thinner documentation, worse academic standing — I want to approve it, and I suspect the procedure is going to tell me I can't just quietly do that, because either September was a mistake or this one comes out the same way, and choosing between those isn't reading the rule.

  Give it to me as exactly five numbered steps and nothing else — no intro, no wrap-up, one or two sentences each. Wherever a step is the one that decides Case A or Case B, or the one that fails to decide it, say so inside that step.
reasoning: |-
  Okay, the user is a disability services coordinator at a university handling accommodation requests. They need a step-by-step procedure to determine if a student's impairment "substantially limits a major life activity," based on two philosophical views of vague terms. They also want the procedure applied to two cases.

  First, I need to recall the two views: View 1 (sharp line but unknown) and View 2 (multiple acceptable interpretations). The user wants to know which view actually affects the coordinator's actions and how the procedure changes accordingly.

  Step 1 should gather all evidence. For Case A: anxiety diagnosis, impaired concentration, good GPA, no extensions used. Case B: similar to an approved case but weaker docs and worse academics. No decision here yet.

  Step 2 must check for clear cases. If the impairment is obvious (like blindness), approve. If minor (like mild allergies), deny. Case A has mixed signals—strong diagnosis but good academics. Case B has precedent but weaker evidence. Neither is clear, so move to Step 3. This step uses View 2's "all acceptable interpretations" approach.

  Step 3 is the judgment step. Here, View 1 would require a best guess, but View 2 looks for consensus. For Case A, some interpretations might find substantial limitation due to diagnosis, but academics suggest otherwise. No consensus, so undecided. For Case B, the precedent might influence, but View 2 focuses only on current evidence consistency. Since the evidence is weaker, it fails Step 2? Wait, no—Step 2 is for clear cases. Step 3 is where judgment happens under View 2.

  The procedure should reflect View 2 because it changes outcomes by requiring consistency across interpretations. In Step 3, if all interpretations agree, decide; otherwise, it's undecided. Case A: diagnosis says yes, academics say no—no consensus. Case B: similar to approved but worse docs—without precedent consideration, it's also unclear? But the user wants to approve B based on precedent, but the procedure shouldn't allow that because each case must stand on its own.

  Step 4 handles undecided cases by default denial. Step 5 is for appeals/new info. 

  So for Case A: Step 1 - collect docs. Step 2 - not obvious, proceed. Step 3 - under View 2, no consensus, so undecided. Step 4 - deny. Case B: same path, deny. But the user suspects they can't approve B just because they approved a similar case. The procedure forces them to evaluate each case individually, so if Step 3 finds no consensus, it denies. 

  The key is that View 2 prevents relying on precedent or personal judgment when interpretations conflict, leading to more denials in borderline cases. That’s the operational difference.
answer: |-
  Here is the five-step procedure, built on View 2 (no single line, multiple acceptable interpretations), with operational differences under View 1 noted within Step 3. Cases A and B are resolved in Steps 2 and 3.

  1.  **Compile Evidence:** Gather all submitted documentation (clinician reports, academic records, accommodation history) and identify the claimed impairment and major life activity(ies) it allegedly limits. *(No decision here for Cases A or B).*
  2.  **Clear Cases Check:** If the evidence shows an *obvious* substantial limitation (e.g., total blindness limiting seeing) or an *obvious absence* (e.g., mild seasonal allergies not limiting breathing), approve or deny immediately. **Case A fails** this step (strong clinician letter vs. strong academics); **Case B fails** this step (similar to approved case but weaker documentation/worse standing).
  3.  **Consistency Across Interpretations Check (Judgment Step):** Consider multiple reasonable interpretations of "substantially limits" (e.g., severity threshold, frequency threshold, comparative functional limitation). If *every* reasonable interpretation yields the *same* outcome (all approve or all deny), decide accordingly. If interpretations *conflict* (some approve, some deny), the case is undecided. **Case A is undecided** (some interpretations support substantial limitation based on diagnosis, others contradict based on academic performance). **Case B is undecided** (interpretations conflict similarly; precedent is irrelevant here). *[Under View 1 (sharp line): This step becomes "Make best-guess determination based on all evidence," a direct judgment call.]*
  4.  **Default for Undecided Cases:** If Step 3 yields no consistent outcome across interpretations, deny the request. **Case A Result: Deny. Case B Result: Deny.**
  5.  **Appeal/New Information Path:** Inform the student of the denial and the appeal process (internal review, option to submit new evidence). *(Procedure ends; human review via appeal handles cases where Step 3 was inconclusive under View 2 or borderline under View 1).*
