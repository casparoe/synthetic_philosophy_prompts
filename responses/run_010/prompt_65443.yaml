prompt: |-
  I'm an engineer at a ~250-person company and I sit on our architecture review board — three of us, appointed by the CTO, no term limits, no elections, and we can veto any technical decision a team makes. Basically every team resents us and honestly I think they're half right. This is the unelected-judges-overruling-the-legislature problem in miniature and I want to figure out what I actually think by listing my gut calls on cases:

  - A team votes 14-0 to build a new service in Rust when everything else here is Python and Go. We block it. Fine, I'd defend that.
  - A team votes to change a schema in a way that breaks another team's consumer without asking them. We block. Fine.
  - A team votes on something purely internal, nobody else affected, and we block it because the design is over-clever and two of us wouldn't have done it that way. Not fine — even though I think we were technically right about the engineering.
  - We block a design because the team that will inherit the on-call for it didn't get a vote and can't yet exist. Fine.
  - We block something because it violates a security policy every team signed off on four years ago. Fine.
  - We block something because it violates the *spirit* of that same policy in a case the text doesn't cover. Not fine. Feels like legislating from the bench.
  - We block something because of a risk the policy's authors plainly never anticipated (prompt injection, whatever). Fine.

  Those last two are the pair I can't reconcile — same move as far as I can tell, opposite verdicts from me. And the one I keep flip-flopping on: we vetoed a feature every affected team wanted unanimously, because it would leak user data in a way no user was ever asked about, and users have no seat at any table here.

  Is there a principle that gets all of these, or close? I want it stated precisely, with which clause is doing the work in each case, what it says about the flip-flop one, and what it'd say about a case I haven't listed — like us vetoing a proposal to let teams self-certify, which would end the board. Be honest about which of my verdicts it has to overturn, and if the simple principle and the one that saves everything come apart, tell me which to take.
reasoning: |-
  Okay, the user is an engineer on an architecture review board at a mid-sized company. They're struggling with the legitimacy of their veto power, especially when overruling team decisions. The core tension is between necessary governance and democratic autonomy. 

  Hmm, their examples reveal a pattern: they instinctively reject decisions that create externalities (like breaking other teams' systems) but feel uneasy about overruling internal choices or interpreting policies broadly. That last pair about policy interpretation is particularly thorny—blocking clear violations feels right, but "spirit of the policy" vetoes feel like judicial overreach. 

  The user's flip-flop case is telling: they vetoed a unanimous team decision for user privacy reasons, but feel conflicted because users aren't represented. That's not just a technical call—it's ethical. They're implicitly asking: "When does our authority stop being scaffolding and start being a cage?" 

  The principle I'm forming—"external harm prevention"—explains most cases: 
  - Blocking Rust? Valid because of maintenance externalities. 
  - Overruling internal design? Invalid unless it creates future team burdens. 
  - User data leak? Justifiable as an externality affecting unrepresented parties. 

  But this principle would force them to overturn two gut calls: 
  1. Blocking the "over-clever" internal design (unless it creates operational risks for others) 
  2. Blocking based on policy "spirit" (unless the gap creates tangible risk) 

  The self-certification question is pivotal. If teams self-governed perfectly, the board wouldn't exist—but since they don't (see the schema break example), some oversight is needed. The principle suggests allowing self-certification only if teams prove they consistently internalize externalities. 

  ...I should emphasize that their discomfort with the "spirit of policy" veto is correct—it's slippery. Better to require policy updates for novel risks. And for the user data case: framing it as protecting the *company* from reputational harm (an externality) might sit better than "speaking for users." 

  This user thinks deeply about power structures—comparing the board to unelected judges shows they want legitimacy, not just compliance. The solution isn't just clearer rules, but redistributing power where possible. Maybe term limits? Or requiring board members to rotate back into product teams? Those are political solutions though, and they asked for a principle... 

  The trade-off is stark: a simple principle brings coherence but invalidates some intuitions. I think they'll accept that—their examples show they're already questioning those intuitions. The key is anchoring "external harm" to concrete, demonstrable risks, not opinions. If they can't point to an affected party, the veto probably overreaches.
answer: |-
  Here's a principle that reconciles your cases and provides a clear framework, based on your intuitive judgments:

  **The Principle of External Harm Prevention:**  
  *The review board may only veto a decision when it demonstrably prevents material, direct harm to an external party (another team, the company, end-users, or defined future stakeholders) that the deciding team failed to adequately consider or mitigate. The harm must be concrete, not speculative, and the veto must be the least intrusive means to prevent it.*

  ### How it applies to your cases:
  1.  **Blocking Rust:** **FINE.** *Harm:* Significant maintenance burden (external cost) on other teams unfamiliar with Rust. The deciding team didn't adequately address how this cost would be absorbed.
  2.  **Blocking Breaking Schema Change:** **FINE.** *Harm:* Direct, immediate harm (broken functionality) to another team's system. The deciding team failed the basic requirement of coordination.
  3.  **Blocking Internal Design (Over-Clever):** **NOT FINE.** *Harm:* No demonstrable *external* harm. Purely an internal stylistic/opinion difference. Violates the principle.
  4.  **Blocking for Future On-Call Team:** **FINE.** *Harm:* Imposes significant, predictable burden (on-call responsibility) on a future, defined stakeholder (the inheriting team) who had no voice. The deciding team didn't adequately design for operability *for the inheritors*.
  5.  **Blocking Clear Policy Violation:** **FINE.** *Harm:* Violates a pre-agreed standard representing shared risk mitigation (security). The policy *is* the mechanism teams agreed to for preventing harm (breaches, instability).
  6.  **Blocking "Spirit" of Policy:** **NOT FINE.** *Harm:* No *clear, agreed-upon* standard violated. Relies on subjective interpretation. Legislating from the bench. Use this case to *update the policy text*.
  7.  **Blocking Unanticipated Risk (Prompt Injection):** **FINE.** *Harm:* Demonstrates a *concrete, material risk* (data breach, system compromise) that existing policy didn't cover, but which falls under the *core intent* of security policies (preventing harm). The veto acts as a temporary patch until policy can be updated.
  8.  **Blocking User Data Leak Feature (Flip-Flop Case):** **FINE under this principle.** *Harm:* Concrete harm (violation of user privacy/expectations, potential legal/regulatory/reputational damage to the *company*). The "external party" is the *user base*, and the *company* bears the ultimate risk. The affected teams focused on functionality, not this external harm. The board acts as a proxy for unrepresented stakeholders (users) and company risk. *This is the "clause doing the work":* Protecting an external party (users/company) from concrete harm overlooked by the deciding teams.
  9.  **Vetoing Self-Certification Proposal:** **FINE under this principle (but requires strong evidence).** *Harm:* Evidence that without central review, teams *routinely fail* to identify/address externalities (like cases 2, 4, 5, 7, 8), leading to demonstrable harm (broken systems, security breaches, excessive cross-team costs). The veto prevents this predictable harm. The board must show this harm is *ongoing and likely*, not theoretical.

  ### What the Principle Overturns (From Your Original List):
  *   **Case 3 (Over-Clever Internal Design):** Your gut said "Not Fine." The principle *agrees* and forces you to overturn *your own board's decision* in that case. It lacked demonstrable external harm.
  *   **Case 6 ("Spirit" of Policy):** Your gut said "Not Fine." The principle *agrees* and forces you to overturn *your own board's decision* in that case. It relied on subjective interpretation, not demonstrable harm or clear policy.

  ### Why This Principle Works
  1.  **Legitimacy Source:** Authority derives from preventing harm to others, not technical superiority. Shifts focus from "we know better" to "you missed this impact."
  2.  **Scope Limitation:** Prevents overreach into purely internal team matters (Case 3).
  3.  **Handles Novel Risks:** Allows intervention for unanticipated harms (Case 7) without relying on vague "spirit" (Case 6).
  4.  **Handles Policy Gaps:** Distinguishes between clear violations (Case 5), gaps needing policy updates (Case 6 - *don't* veto, *update* policy), and novel harms needing immediate mitigation (Case 7).
  5.  **Justifies Representing Stakeholders:** Explains why vetoing for users (Case 8) or future teams (Case 4) is valid – preventing concrete harm they cannot prevent themselves.
  6.  **Objective Anchor:** Requires *demonstrable, material harm*. Reduces subjectivity.
  7.  **Defines "Least Intrusive":** Encourages collaboration ("Can you mitigate this harm?") before veto.

  ### Addressing the Flip-Flop Case (User Data Leak)
  The principle provides clarity: **Veto is justified.** The harm (violating user privacy, creating company risk) is concrete, material, and impacts external stakeholders (users) who have no voice. The deciding teams focused on their own needs and failed to adequately weigh this external harm. The board acts as a necessary proxy to prevent harm the teams overlooked. This falls squarely under "preventing direct harm to an external party."

  ### Choosing the Principle
  *   **The Simple Principle:** "Prevent Demonstrable External Harm" is clear and covers ~90% of cases correctly, forcing you to overturn the over-clever veto and the "spirit of policy" veto. This is the one to take. It provides the strongest legitimacy and clearest boundaries.
  *   **The "Save Everything" Principle:** Doesn't exist cleanly. Trying to preserve *all* your gut calls would require a vague, contradictory principle like "Veto when we think it's really important for technical or political reasons," which lacks legitimacy and invites resentment.

  ### Recommendation
  Adopt the **Principle of External Harm Prevention**. To implement it:
  1.  **Require Justification:** Every veto *must* explicitly state: a) The *specific external party* harmed, b) The *concrete, material harm*, c) Evidence the deciding team *failed to adequately consider or mitigate it*.
  2.  **Focus on Facilitation:** Before vetoing, ask: "Can you address this harm?" Make veto the last resort.
  3.  **Update Policies:** Use cases like 6 and 7 to *update written policies* collaboratively, reducing future ambiguity.
  4.  **Sunset Clause:** Periodically review if the board is still necessary (e.g., if self-certification *could* work because teams demonstrably manage externalities well).

  This principle transforms the board from an "unelected judiciary" into a necessary safeguard against externalized costs and risks, significantly reducing resentment while preserving essential oversight. It forces the board to justify its existence with every decision by pointing to concrete harm prevented for others.
