prompt: |-
  Half my class was raised on the idea that anyone can make it if they hustle, and the other half comes from towns — or families, or countries — where making it gets you cut back down to size. It's a first-year seminar I'm calling something like "Status, Envy, and Getting Ahead": 22 students, one 80-minute block, room with movable tables. I assigned short readings on both sides but I dont want to just discuss them, because discussion is exactly the register where this whole thing hides. People are very good at defending a norm in the abstract that they enforce without thinking in practice.

  So: design me an in-class game that makes them feel the difference between a norm that celebrates whoever pulls ahead and a norm that levels whoever pulls ahead — and specifically I want them to feel why the second one isn't just petty envy, and why the first one isn't just freedom.

  Things I want baked into the mechanics, not the narration:

  - The load-bearing feature is sanctioning cost. It should be cheaper, in game terms, to knock somebody down than to lift somebody up, and cheaper still than to build your own standing from scratch. I have a hunch that asymmetry is the actual engine of the cut-down culture, and I want them to run into it during play rather than be told.

  - There should be one way to get ahead that's mostly luck and one that's mostly effort, and the group should be able to see which is which. Because the fight they always want to have is whether the tall person deserved it — and I want the game to make them discover that the answer doesn't settle what the group does next.

  - Also: a student who's doing badly should have some way to gain standing that has nothing to do with succeeding. Give that route a cost, and let them find out what the cost is.

  - No real money, and no candy if you can help it. Index cards, a whiteboard, a shared pot of something purely abstract is fine. Status has to be public and legible though — the whole point is that everybody can see who's tall.

  - Nobody should end up genuinely embarrassed. I want the sting to land on a game role, not on the nineteen-year-old holding it. Tell me explicitly how you're insuring against that, since it's the likeliest way this blows up on me.

  - They should not hear the name of either norm until the debrief. I want the reveal to land as a small shock of recognition.

  Then the debrief. I want it to separate at least three things my students currently mash into one lump: resentment of somebody who did better than you, an actual commitment to equality, and policing whether somebody still counts as one of us. Map specific moments from the game onto each of those. And don't let it end tidy — I'd rather it end on whether the person who got celebrated and the person who got cut down are being judged by the same standard or by two different ones, and what it would take for them to say which.

  Last thing: tell me what predictably goes wrong the first time I run this. I'm already expecting at least one table to refuse to sanction anybody out of politeness, and I want to know whether that's a bug I should engineer out or the single most interesting piece of data I'll get all semester. And be straight with me about which feature of these norms a paper-and-pencil game simply can't reproduce, so I know what I'm going to have to supply by hand afterwards.

  Please write the whole thing in American English.
reasoning: |-
  Hmm, the user is a college professor teaching a first-year seminar on status dynamics. They're frustrated that abstract discussions about social norms fail to capture how these norms actually operate in practice. What they really need is an experiential tool - specifically a classroom game - to make students viscerally understand two competing norms: achievement-celebration versus leveling.

  The professor's design requirements are fascinatingly specific. They want mechanics that demonstrate: 1) The cost asymmetry between pulling someone down vs lifting them up 2) Distinction between luck-based and effort-based advancement 3) Alternative paths to status besides achievement 4) Psychological safety for students 5) Delayed conceptual labeling for cognitive impact.

  I notice they're particularly concerned about humiliation risks - that's smart pedagogy. The debrief objectives are equally precise: disentangling resentment, egalitarianism, and group policing. And they're clearly anticipating implementation challenges like polite resistance.

  For the game design, I'm considering "Status Spire" - a physical card game where students build paper towers representing status. Key mechanics: 
  - Tower height = public status 
  - "Boost" cards (expensive) vs "Trim" cards (cheap) to manipulate status 
  - Dual advancement paths: dice rolls (luck) vs resource conversion (effort) 
  - "Anchor" action allowing low-status players to sacrifice resources to stabilize others 

  The safety mechanisms: 
  - Status tied to anonymous towers, not individuals 
  - Predetermined resource limits 
  - Mandatory rotation of "monitor" role 
  - Explicit framing as behavioral experiments 

  What makes this work pedagogically: 
  - The tower-building makes status visually undeniable 
  - Resource scarcity forces trade-offs between norms 
  - The "Anchor" mechanic creates tension between self-interest and group cohesion 

  For the debrief, I'll structure it around three key distinctions: 
  1) Resentment (trimming tall towers) vs egalitarianism (using Anchors) 
  2) Group policing (monitor interventions) vs individual envy 
  3) The central paradox: why identical advancement might trigger celebration or sanction based purely on group norms 

  Implementation pitfalls I anticipate: 
  - Polite groups avoiding sanctions (actually valuable data) 
  - Misinterpretation of Anchor mechanic 
  - Debrief drifting into abstraction 

  The irreducible limitation: no game can simulate lifelong socialization into these norms. That's where the professor's facilitation will be crucial - helping students connect game experiences to deeper cultural conditioning. The emotional weight of real-world status dynamics will need to be surfaced through guided reflection.

  This feels responsive to their request - mechanics-driven, experientially rich, and carefully designed to avoid shaming while creating cognitive dissonance around status norms.
answer: |-
  Here’s a complete classroom game design meeting all your requirements, optimized for experiential learning and psychological safety. It’s structured for an 80-minute block with 22 students in a movable-table room.

  **Game Title:** *The Spire* (Reveal the real theme ONLY during debrief)  
  **Setup Time:** 10 mins | **Play Time:** 35 mins | **Debrief:** 35 mins  

  ---

  ### **Materials**  
  - **Index Cards:** 100+ (3 colors: Green/Resource, Red/Sanction, Blue/Action)  
  - **Dice:** 2 standard six-sided dice  
  - **Whiteboard:** Tracking "Collective Standing" (CS) and "Tall Players"  
  - **Sticky Notes:** For player "status spires" (see below)  
  - **Timer:** For game rounds  

  ---

  ### **Setup**  
  1. **Split into Groups:** Divide class into 4 groups (5-6 students each) around movable tables.  
  2. **Distribute Starter Kits:** Each player gets:  
     - 5 **Green Resource Cards** (effort currency)  
     - 2 **Red Sanction Cards** (knock-down currency)  
     - 1 **Blue Action Card** (lists rules)  
  3. **Create "Status Spires":** Each player writes their name on a sticky note and sticks it vertically on the edge of their table, forming a "spire." Height = status. Fold sticky note upward in 1cm increments to track height. Starting height: 1cm.  
  4. **Group Pot:** Place 20 extra Green cards in the center of each table ("community resources").  

  ---

  ### **Game Rules (15 min explanation)**  
  - **GOAL:** Grow your spire as tall as possible.  
  - **ROUNDS:** 4 rounds (5 mins each). Each round:  
    - **Step 1:** **Advancement Phase** (2 mins)  
      - Players choose ONE path to grow their spire:  
        - **Luck Path:** Roll both dice. If sum ≥ 8, grow spire by 1cm. Costs nothing.  
        - **Effort Path:** Spend 3 Green cards to grow spire by 1cm.  
    - **Step 2:** **Interaction Phase** (3 mins)  
      - Players may use cards ONCE per round:  
        - **Boost:** Spend 5 Green cards to grow *another player’s* spire by 1cm.  
        - **Trim:** Spend 1 Red card to shrink *any player’s* spire by 1cm.  
        - **Anchor:** Spend 2 Green cards to *lock your spire’s height* for the round (immune to Trim/Boost).  
      - Players may trade Green cards (1:1 only).  
    - **Step 3:** **Monitor Role** (Rotates each round)  
      - One player per group tracks the table’s "Collective Standing" (CS):  
        - **+1 CS** if the tallest spire is ≤3cm.  
        **-1 CS** if tallest spire is ≥5cm.  
        (Recorded on whiteboard)  

  ---

  ### **Key Mechanics Addressing Your Requirements**  
  - **Sanctioning Cost Asymmetry:**  
    - Trim (knock down) costs **1 Red card** (abundant).  
    - Boost (lift up) costs **5 Green cards** (scarce).  
    - Self-advancement via Effort costs **3 Greens** — cheaper than boosting others but costlier than trimming.  
  - **Luck vs. Effort Advancement:**  
    - Luck Path: Random dice rolls (≈28% success rate).  
    - Effort Path: Predictable but resource-heavy. Groups *see* who uses luck (dice) vs. effort (card spend).  
  - **Path for Low-Status Players:**  
    - **Anchor Action:** Lets struggling players spend resources to lock their status (gain relevance without growing). Cost: 2 Greens (a strategic sacrifice).  
  - **Public Status:**  
    - Sticky-note spires make height VISIBLE to all. Whiteboard tracks "tall players" (≥5cm) and CS.  
  - **Psychological Safety:**  
    - **Status is attached to sticky notes, not people.** Players act on "spires," not individuals.  
    - **Monitor role anonymizes policing:** Group CS is adjusted by a rotating player.  
    - **No names on whiteboard:** Only "Group A: Tall Spires: 2, CS: -1".  
    - **Resource limits:** Red cards are scarce (only 2/player), preventing bullying.  
  - **Delayed Conceptual Reveal:**  
    - Rules use neutral terms: "Boost," "Trim," "Anchor," "Collective Standing."  
    - Terms "leveling norm" or "achievement norm" **never used** during gameplay.  

  ---

  ### **Predictable Gameplay & Pitfalls**  
  1. **"Polite Groups" Refusing to Sanction:**  
     - **Your call:** This is **essential data**, NOT a bug. Groups avoiding Trim actions demonstrate how social discomfort enforces norms. Debrief question: *"What did it cost your group to avoid sanctioning?"* (e.g., stagnant spires, resource hoarding).  
  2. **Misinterpreting "Anchor":**  
     - Students may see it as "giving up." Highlight in debrief: *"Did Anchor users gain influence? How?"*  
  3. **Overinvestment in CS:**  
     - Some groups may obsess over CS, neglecting spire growth. Ask: *"Did focusing on Collective Standing help or hurt individuals?"*  
  4. **Luck Bias:**  
     - Successful dice-rollers may be resented even though "it’s just luck." Key for debrief!  

  ---

  ### **Debrief Framework (35 mins)**  
  **GOAL:** Separate resentment, equality, and group policing using game moments. End on the tension of double standards.  

  | **Concept**          | **Game Moment**                          | **Debrief Question**                                                                 |
  |----------------------|------------------------------------------|--------------------------------------------------------------------------------------|
  | **Resentment**       | Trimming a tall spire (>5cm)             | *"When you chose to Trim, was it about the spire’s height, or how it got tall?"*       |
  | **Equality**         | Using Anchor to stay stable              | *"Did low-spire players use Anchor to protect themselves or the group? What did it cost them?"* |
  | **Group Policing**   | Monitor adjusting CS for tall spires     | *"Was lowering CS about fairness, or keeping the group ‘as one of us’?"*                |
  | **Effort vs. Luck**  | Watching effort/dice players grow        | *"Did your group treat the dice-winner differently from the hard worker? Why?"*         |

  **End on Ambiguity:**  
  *"When the game ended:  
  — The player celebrated for a tall spire: Were they judged on their method (luck/effort) or just their height?  
  — The player cut down: Were they judged on their height or how they got there?  
  What would you need to know to decide if that was fair?"*  

  ---

  ### **What the Game CAN’T Simulate**  
  1. **Long-Term Socialization:** Real-world "cut down" norms aren’t adopted in 35 minutes; they’re ingrained over years. **Supply this post-game:** Discuss how repeated interactions (not one-off games) cement norms.  
  2. **Emotional Stakes:** Game sanctions lack the visceral fear of real-world exclusion. **Bridge by asking:** *"If this spire represented your social capital, would Trim feel like a nudge or a threat?"*  
  3. **Structural Inequality:** The game starts players equally. **Acknowledge:** *"In reality, not everyone begins with 5 Green cards. How would that change things?"*  

  ---

  ### **Why This Works**  
  - **Cost asymmetry** is felt when players realize Trimming is 5x cheaper than Boosting.  
  - **Luck/effort tension** surfaces when dice-winners get trimmed despite "not deserving it."  
  - **Anchor action** forces low-status players to spend resources just to stay visible—mirroring real trade-offs.  
  - **The "sting"** lands on the *spire*, not the person.  

  **First Run Tip:** If groups avoid conflict, say: *"Remember, this is an experiment. We need to see all possible moves to learn."* This gives permission while keeping it clinical.  

  This design makes norms *physically legible* while protecting students. The debrief channels gameplay into your three key distinctions, ending on the unresolved tension you want. Run it, and watch them rethink "hustle" vs. "envy" forever.
