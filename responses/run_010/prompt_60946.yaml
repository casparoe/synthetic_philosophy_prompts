answer: |-
  Below is a diagnostic instrument designed to tease apart methodological commitments across four distinct dimensions, using concrete vignettes to avoid jargon and disciplinary signaling. The questions probe whether social facts can exist without individual psychologies (A), whether explanations must bottom out in individuals (B), whether collectives can have irreducible properties (C), and whether individual attitudes require social concepts (D). Two questions are intentionally underdetermined.

  ### Diagnostic Quiz
  *Answer each question based on the scenario, not theoretical labels. Choose one option per question.*

  1. **Residential Segregation**  
     In a city, each family prefers a neighborhood with ≥50% same-race residents. No one wants full segregation, yet neighborhoods become fully segregated.  
     What caused this outcome?  
     ○ A) Individual choices based on personal preferences.  
     ○ B) Systemic dynamics that amplify small biases into large-scale patterns.  

  2. **Bank Run**  
     A bank faces mass withdrawals because each customer believes others will withdraw. The bank was solvent, but the run causes collapse.  
     What caused the collapse?  
     ○ A) Individual decisions driven by beliefs about others.  
     ○ B) A self-reinforcing collective panic no individual intended.  

  3. **Pluralistic Ignorance**  
     A community upholds a dress code for decades. Everyone follows it, believing others endorse it, but privately, all find it pointless.  
     Why does the norm persist?  
     ○ A) Each person acts on their belief about social expectations.  
     ○ B) The norm’s stability as a social fact, independent of private attitudes.  

  4. **Simulation A vs. B**  
     Two models replicate wage gaps between groups:  
     - *Sim A*: Emerges from individual interactions (e.g., biased referrals).  
     - *Sim B*: Requires setting "societal bias" as a fixed parameter.  
     Which is more explanatory?  
     ○ A) Sim A: It derives patterns from individual actions.  
     ○ B) Sim B: It captures societal forces shaping individual behavior.  

  5. **Statistical Discrimination**  
     An employer hires fewer Group X members, using group-level stats (e.g., average test scores) but no personal prejudice.  
     What causes this pattern?  
     ○ A) The employer’s rational use of imperfect information.  
     ○ B) Structural factors (e.g., historical exclusion) that make group stats relevant.  

  6. **Market Overreaction**  
     After minor news, a stock index drops 20%. An analyst says, "The market overreacted."  
     What is literally true?  
     ○ A) Most traders reacted excessively, causing the drop.  
     ○ B) Collective behavior exhibited hysteria no trader intended.  
     ○ C) This statement is metaphorical; only individuals can "overreact."  

  7. **Traffic Jam**  
     A highway jam forms. Each driver follows rules, but the jam emerges.  
     Does the jam have properties no driver has?  
     ○ A) Yes (e.g., spatial boundaries, duration).  
     ○ B) No (it’s just the sum of drivers’ actions).  

  8. **Desire for Homeownership**  
     "Alex wants a house to gain social status."  
     Can we describe Alex’s desire without social concepts (e.g., "status")?  
     ○ A) Yes (e.g., "Alex seeks respect" reduces it to individual psychology).  
     ○ B) No ("status" requires societal benchmarks).  

  9. **Underdetermined Case: Rumor Spread**  
     A false rumor spreads rapidly. Some spread it due to belief, others for attention, others from fear of exclusion.  
     What explains the spread?  
     ○ A) Individual motivations (belief, attention-seeking, fear).  
     ○ B) Network structure (e.g., high connectivity).  
     ○ C) Not enough information to separate individual vs. social causes.  

  10. **Underdetermined Case: Ceremony Persistence**  
      A "traditional" ceremony invented 50 years ago persists. Participants believe it’s ancient.  
      Why does it persist?  
      ○ A) Individual beliefs in its authenticity.  
      ○ B) Social reinforcement (e.g., institutions rewarding participation).  
      ○ C) Not enough information to decide.  

  ---

  ### Scoring Key  
  Your answers map to four dimensions:  
  - **A**: Can social facts exist without individual psychologies? (Q1B, Q2B, Q3B = Yes)  
  - **B**: Must explanations bottom out in individuals? (Q4A, Q5A, Q6A = Yes)  
  - **C**: Can collectives have irreducible properties? (Q6B, Q7A = Yes)  
  - **D**: Do individual attitudes require social concepts? (Q8B = Yes)  

  *Dimensions are independent. Your "position" is a combination of answers across these axes.*  

  #### Occupied Positions (6 Leaves)  
  1. **Reductive Individualism** (e.g., Rational Choice)  
     - **Commitments**: A=No, B=Yes, C=No, D=No  
     - **Awkwardness**: Struggles with emergent phenomena (e.g., segregation) without attributing false intentions.  

  2. **Emergent Individualism** (e.g., Schelling, Coleman)  
     - **Commitments**: A=No, B=Yes, C=Yes, D=No  
     - **Awkwardness**: Accepts collective properties but insists they’re reducible, risking circularity.  

  3. **Structural Individualism** (e.g., Bourdieu-influenced economics)  
     - **Commitments**: A=No, B=Yes, C=No, D=Yes  
     - **Awkwardness**: Individuals are socially shaped, yet explanations must ignore social causality.  

  4. **Interpretivism** (e.g., Symbolic Interactionism)  
     - **Commitments**: A=No, B=Yes, C=No, D=Yes  
     - **Awkwardness**: Social concepts define individuals but can’t explain structural stability.  

  5. **Moderate Holism** (e.g., Durkheimian sociology)  
     - **Commitments**: A=Yes, B=No, C=Yes, D=Yes  
     - **Awkwardness**: Risks reifying social forces and downplaying agency.  

  6. **Critical Realism** (e.g., Bhaskar, Archer)  
     - **Commitments**: A=Yes, B=No, C=Yes, D=Yes  
     - **Awkwardness**: Social facts exist independently but require "hermeneutic" individual-level analysis.  

  #### Unoccupied Positions  
  - **Incoherent Combinations**:  
    - A=Yes + B=Yes (Social facts exist without individuals, but must be explained by them? Contradictory).  
    - C=No + A=Yes (Collectives have no irreducible properties, but social facts exist without individuals? Inconsistent).  
  - **Vacant but Coherent**:  
    - A=Yes + B=No + C=No + D=No: Logically possible but empirically empty (no real-world examples).  
  - **Unexplored**:  
    - Most mixed positions (e.g., A=Yes + B=No + C=No + D=Yes) — fertile ground for new work.  

  #### Limitations  
  - **Blind Spots**: Cannot distinguish Interpretivism from Structural Individualism (both share B=Yes, D=Yes) — turns on whether "social concepts" are explanatory or descriptive.  
  - **Underdetermination**: Q9–Q10 highlight ambiguities; real cases often resist clean classification.  
  - **Nuance Loss**: Scores simplify continuous debates (e.g., "weak" vs. "strong" emergence).  

  ---

  ### Workshop Implementation  
  - **Handout**: Quiz + scoring key (students self-score).  
  - **Discussion**: Group by position, then debate:  
    1. "Which question most challenged your assumptions?"  
    2. "Find someone who shares one commitment but differs on another — why?"  
  - **Debrief**: Emphasize that most research mixes commitments; the goal is clarity, not purity.  
  - **Next Steps**: Assign readings from each position (e.g., Elster for individualism, Durkheim for holism).  

  This tool forces confrontations between intuitions and labels, avoiding the "mushy middle" by exposing multidimensional fault lines.
