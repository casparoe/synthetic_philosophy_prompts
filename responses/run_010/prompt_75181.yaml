  There's a debate within the committee. Some members want to refuse on principle. They argue that accepting the files makes the society complicit in preserving a biased police narrative. The only surviving documentation of these individuals would be from the perspective of those trying to build cases against them. Others counter that refusing means losing any proof of what happened, erasing history entirely.

