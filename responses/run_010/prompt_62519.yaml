prompt: |-
  I teach a required methods course to analysts at a public-health forecasting unit: quantitatively strong, one semester of probability behind them, fluent in conditional probability and expectation, no philosophy whatsoever. In three weeks I have ninety minutes and a whiteboard, and the session has to leave Reflection — van Fraassen's principle relating what I believe now to what I now expect myself to believe later — securely in place, because the unit is about to adopt a pre-registration protocol and the staff justify it with a claim I cannot yet classify: that what you forecast now should equal what you expect yourself to forecast once the data arrive. Part of what I need from you is a verdict on whether that is a garbled statement of Reflection or a distinct claim that happens to be true if one expects to conditionalize, since the answer decides whether I spend ten minutes separating two ideas or ten minutes correcting one.

  Beyond that I want the architecture, not the explanation:

  - The order the components have to arrive in and what each one depends on. My guess is that the assumption of updating by conditionalizing on evidence has to be explicit before anything else means anything; tell me what specifically breaks in the rest of the session if I'm wrong about that.

  - Which single case carries it. I have two candidates. In the first, an analyst is certain that after next week's stakeholder briefing she will be 0.9 confident the intervention works, and she asks whether she is permitted to hold at 0.6 until then. In the second, the same analyst knows she will review the numbers at the end of a night shift and will then be just as confident for that reason. Tell me which one should do the carrying, what features it needs and what it must not have — in particular, whether the later self has to be unimpaired for the example to have any force at all — and what the rejected case is best spent doing at a later point in the sequence.

  - The misconceptions this audience will bring or manufacture, each with the exact point where it must be headed off and whether that point falls before or after the step it would otherwise poison. At minimum I expect: that Reflection is a general policy of deferring to your future self and therefore a piece of epistemic humility; that a tired, angry, or well-briefed future self refutes the principle outright; and that the principle is a rule of practical prudence about avoiding losses rather than a constraint on belief.

  - What I should openly refuse to cover at this level, and say so to them. I assume the diachronic Dutch book construction is out of reach in ninety minutes, but tell me whether dropping it leaves the principle visibly unsupported for an audience that will immediately want to know why it should care.

  - One closing question whose answers would separate people who have the principle from people who have memorized a sentence about it.
reasoning: |-
  We are given a 90-minute session for analysts with quantitative background but no philosophy. The goal is to secure the principle of Reflection in the context of pre-registration and a specific claim: "what you forecast now should equal what you expect yourself to forecast once the data arrive."

  The claim made by the staff is essentially a statement of the Reflection principle. Reflection, in van Fraassen's terms, is the principle that your current belief about an event A should be equal to your current expectation of your future belief about A. That is:

      P(A) = E[ P_{t+1}(A) ]

  where P is your current probability and P_{t+1} is your probability at a future time.

  The staff claim: "what you forecast now should equal what you expect yourself to forecast once the data arrive." This is exactly the Reflection principle applied to forecasting. Therefore, it is not garbled but a direct application. Hence, we do not need to separate two ideas but can spend 10 minutes reinforcing one.

  However, note that the Reflection principle assumes that you expect to update rationally (by conditionalization) and that you are aware of how your future beliefs will be formed. The staff claim implicitly relies on the idea that once the data arrive, the forecast will be updated by conditionalization.

  Now, the architecture:

  1. **Order of Components and Dependencies**:
     - We must first establish the assumption of updating by conditionalization. Without this, the Reflection principle does not hold in general. Specifically, if the future update is not by conditionalization, then the current expectation of the future belief might not equal the current belief. What breaks? The entire justification of the staff claim (which is Reflection) breaks if conditionalization is not assumed. The principle of Reflection is derived under the assumption that you expect to update by conditionalization. Without that, the staff claim is not necessarily true.

  2. **The Single Case to Carry the Principle**:
     We have two candidate cases:

     Candidate 1: An analyst is certain that after next week's stakeholder briefing she will be 0.9 confident the intervention works, and she asks whether she is permitted to hold at 0.6 until then.

     Candidate 2: The same analyst knows she will review the numbers at the end of a night shift and will then be just as confident for that reason (i.e., because of fatigue).

     **Which one to use?** Use Candidate 1. Why?
     - In Candidate 1, the future belief (0.9) is formed rationally (via the briefing, which we assume provides evidence that will be processed correctly). This is the ideal scenario for Reflection: the future self is rational and updates by conditionalization.
     - Candidate 2 involves an impaired future self (due to fatigue). Reflection does not require deferring to an impaired future self. In fact, van Fraassen's principle assumes that the future self is rational (i.e., updates by conditionalization). Using Candidate 2 would risk confusing the audience by introducing a violation of the rationality assumption.

     **Features of the chosen case**:
     - The later self must be rational (unimpaired and updating by conditionalization). This is essential.
     - The current belief (0.6) is not equal to the expected future belief (which is known to be 0.9). This violates Reflection because 0.6 ≠ 0.9. The analyst should adjust her current belief to 0.9? Actually, the principle says that if she is certain that her future belief will be 0.9, then her current belief should be 0.9. So she is not permitted to hold 0.6.

     **What to do with Candidate 2?** Use it later to illustrate a misconception: that Reflection requires deferring to any future self, even an impaired one. This is not the case. We can use Candidate 2 to show that Reflection does not apply when the future self is irrational.

  3. **Misconceptions and When to Address Them**:

     a) **Misconception: Reflection is a general policy of deferring to your future self and therefore a piece of epistemic humility.**
        - This is incorrect because Reflection is a constraint of coherence (like avoiding Dutch books) and applies only when you expect your future self to be rational. Address this when introducing the principle: emphasize that it is a requirement of consistency over time, not humility.

     b) **Misconception: A tired, angry, or well-briefed future self refutes the principle outright.**
        - This is the Candidate 2 scenario. Address immediately after presenting the principle with the ideal case. Explain that Reflection only applies when the future self is rational (i.e., updates by conditionalization on the evidence). If the future self is impaired, then the principle does not apply. This point should come after the ideal case and before any non-ideal examples.

     c) **Misconception: The principle is a rule of practical prudence about avoiding losses rather than a constraint on belief.**
        - This might arise because of the connection to Dutch books. Address when discussing the justification. We will not cover the Dutch book, but we can say that it is a coherence constraint (like the static case: if your beliefs are inconsistent, you can be Dutch-booked). The principle is about the consistency of your beliefs over time. Make it clear that it is a constraint on belief, not a practical rule.

     The order for addressing misconceptions: 
     - Present the ideal case (Candidate 1) and the principle.
     - Immediately address (a) and (b) by contrasting with Candidate 2 (non-ideal) and explaining the rationality requirement.
     - Then, when the question of "why should we care?" comes up, address (c) by explaining that it is a matter of coherence (without going into Dutch books).

  4. **What to Refuse to Cover**:
     - Diachronic Dutch books: in 90 minutes, with no prior philosophy, this is too technical. Instead, we can say that the principle is a requirement of coherence (like the static probability axioms) and that violating it leads to a form of inconsistency in your beliefs over time. We can also note that it is a consequence of conditionalization. The audience might be satisfied by the mathematical derivation (if we show that under conditionalization, Reflection holds) and by the intuitive idea that your current belief should take into account what you expect to believe in the future when you are rational.

     How to show the principle given conditionalization?
     - Let A be an event. Let E be the evidence that will be received at time t+1. We assume that the future belief is P(A|E). Then, the current expectation of the future belief is:
          E[ P(A|E) ] = sum_{e} P(E=e) * P(A|E=e)
       But note that by the law of total expectation, we have:
          E[ P(A|E) ] = P(A)
       because P(A) = sum_{e} P(E=e) * P(A|E=e). 
     - This derivation is straightforward and should be shown on the whiteboard. It requires that the future belief is P(A|E) (conditionalization) and that the current probability for the evidence is P(E). This derivation is the core of the session.

     This derivation supports the principle and shows why it holds under conditionalization.

  5. **Closing Question**:
     We want a question that separates understanding from memorization. Example:

     "Suppose that you are certain that tomorrow, after seeing new evidence, you will believe that the probability of a recession next year is 0.7. However, today you are considering whether to change your current belief of 0.5. What does the Reflection principle say about your current belief?"

     Answer: It says that your current belief should be 0.7. If you are certain about what your future belief will be (and you expect that future belief to be rational), then your current belief should be that same value.

     Alternatively, a more nuanced question:

     "Suppose you know that tomorrow you will see evidence that will either double or halve your current odds for event A. You assign 50% chance to each outcome of the evidence. What does Reflection say about your current belief and your expectation of your future belief?"

     Answer: Let p be your current probability for A. Then the odds are p/(1-p). After evidence, the odds become either 2p/(1-p) or (1/2)p/(1-p). The future probabilities are then either 2p/(1-p) / [1 + 2p/(1-p)] = 2p/(1+p) or [ (p/(2(1-p))) ] / [1 + p/(2(1-p))] = p/(2-p). The expectation of the future probability is 0.5 * [2p/(1+p)] + 0.5 * [p/(2-p)]. Reflection requires that this equals p. However, without knowing p, we cannot check. But note: under conditionalization, the expectation of the future probability is p (by the law of total expectation). So the principle holds. The point is that the current belief p must equal that expectation. The question is designed to see if they understand that the expectation is a function of p and that the equation must hold. But note: the equation 0.5*[2p/(1+p)] + 0.5*[p/(2-p)] = p is not true for arbitrary p. However, if they recall the derivation above, they know that it must hold because of the law of total expectation. Therefore, they should say: regardless of the evidence structure, the expectation of the future probability (under the current probabilities) must equal the current probability.

     However, the first question is simpler and more direct.

     We'll go with the first one because it is straightforward and tests the core idea.

  Outline of the Session:

  1. (5 min) Introduction: The pre-registration protocol and the staff claim. We are going to examine the claim that "what you forecast now should equal what you expect yourself to forecast once the data arrive." This is a principle of rationality called Reflection.

  2. (10 min) The assumption of conditionalization: 
     - We update by conditionalizing on the evidence. Show the formula: if we have evidence E, then the updated probability of A is P(A|E).
     - Why is this needed? Without it, we cannot derive the Reflection principle.

  3. (15 min) Derivation of Reflection from conditionalization:
     - Let A be an event. Let E be the random variable representing the evidence. The future belief in A is P(A|E).
     - The current expectation of the future belief: E[ P(A|E) ] = sum_e P(E=e) * P(A|E=e)
     - But note: P(A) = sum_e P(E=e) * P(A|E=e) [law of total probability]
     - Therefore: E[ P(A|E) ] = P(A). This is Reflection.

  4. (15 min) Present the ideal case (Candidate 1):
     - Analyst currently believes intervention works with probability 0.6. She is certain that after the briefing (where she will get evidence) she will believe it with probability 0.9.
     - Reflection says: if she is certain about her future belief (and that it is formed rationally), then her current belief must be 0.9. Therefore, she is not being rational to hold 0.6.

  5. (10 min) Address misconceptions:
     - Use Candidate 2: the night shift scenario. She knows she will be tired and then have a belief of 0.9. Reflection does not require her current belief to be 0.9 because the future self is impaired. The principle only applies when the future self is rational.
     - This is not about humility: it's about consistency when you are rational over time.
     - It is a constraint on belief, not a practical rule. We are talking about what it is rational to believe now given what you expect to believe in the future under rational conditions.

  6. (10 min) Why should we care?
     - It is a requirement of coherence (like the probability axioms). Without it, you are violating a fundamental norm of rationality. (We are not covering Dutch books, but we can say that this coherence protects you from certain kinds of inconsistencies.)

  7. (5 min) Closing question: 
     "Suppose you are certain that tomorrow, after seeing the new data, you will believe that the probability of event A is 0.8. What should your current belief in A be, according to Reflection? What if you are not certain about the future belief, but you expect it to be 0.8 on average? Then what should your current belief be?"

     Answers: 
     - In the first part: 0.8.
     - In the second part: also 0.8, because the Reflection principle says that your current belief should equal your expectation of your future belief.

  8. (10 min) Q&A and wrap-up.

  Total: 5+10+15+15+10+10+5+10 = 80 minutes, leaving 10 minutes buffer.

  Note: We have not covered the case where you are not certain about the future belief. The derivation covers that: the expectation of the future belief (which is a random variable) must equal the current belief. The example in the closing question tests that.

  This should leave the principle securely in place.
answer: |-
  ### Verdict on the Staff Claim
  The staff's claim—"what you forecast now should equal what you expect yourself to forecast once the data arrive"—**is a direct application of Reflection**, not a garbled version or a distinct claim. It holds if analysts expect to update their beliefs via conditionalization. Spend **10 minutes reinforcing this as one unified idea**, not correcting or separating. Emphasize that Reflection is the broader principle, and the staff's statement is its operationalization in forecasting. No need for separation; the focus is on how Reflection mandates this equality under rational updating.

  ### Architecture: Order, Dependencies, and Critical Assumptions
  1. **Conditionalization must come first** (spend 15 minutes here).  
     - **Why explicit?** Reflection depends on the assumption that future beliefs are formed by conditionalizing on new evidence. Without this, the principle collapses.  
     - **What breaks if omitted?**  
       - Without conditionalization, the expectation of future beliefs has no necessary tie to current beliefs. Analysts might assume ad hoc updates (e.g., "I’ll ignore data if it conflicts with my prior"), violating Reflection.  
       - The derivation of Reflection (via law of total expectation) fails.  
     - **Dependency chain**:  
       Conditionalization → Law of Total Expectation → Proof of Reflection → Staff claim.  
       *Skip conditionalization, and the chain snaps.*

  2. **Derivation (10 minutes)**.  
     - Use the law of total expectation:  
       Let \(P_t(A)\) be current belief in event \(A\), \(P_{t+1}(A)\) be future belief after data \(D\).  
       If \(P_{t+1}(A) = P_t(A \mid D)\), then:  
       \[
       P_t(A) = \mathbb{E}_t[P_t(A \mid D)] = \mathbb{E}_t[P_{t+1}(A)].
       \]  
       *This is Reflection: Current belief equals expected future belief.*  
     - **Visualize**: Whiteboard the equation with \(A\) = "intervention works", \(D\) = data. Show \(P_t(A)\) as a weighted average of post-data beliefs.

  3. **Staff claim (5 minutes)**.  
     Map to Reflection: "Forecast now" = \(P_t(A)\), "expect yourself to forecast once data arrive" = \(\mathbb{E}_t[P_{t+1}(A)]\).  
     **Stress**: This is *contingent* on conditionalization. If they abandon it, the claim fails.

  ### The Single Case to Carry Reflection
  - **Use Candidate 1** (analyst certain of future 0.9 belief after briefing).  
    - **Why?**  
      - It isolates Reflection’s core: *certainty* about future beliefs implies current beliefs must align. The violation (0.6 vs. 0.9) is stark and intuitive.  
      - Forces confrontation with the principle’s demand: "If you’re *sure* you’ll believe 0.9 later, why not now?"  
    - **Essential features**:  
      - Future self is **rational** (briefing provides legitimate evidence; updating via conditionalization).  
      - **Certainty** about future belief (she’s *sure* it’ll be 0.9).  
      - **Conflict**: Current belief (0.6) diverges from future belief.  
    - **Avoid**: Any hint of impairment (e.g., fatigue, coercion). Save that for misconceptions.  
  - **Reject Candidate 2** (night-shift fatigue) for now.  
    - **Use later** to debunk the "deference to any future self" misconception (see below).  
    - **When?** After establishing Reflection, to show its limits.

  ### Misconceptions: Timing and Defusing
  Address these **immediately after introducing Reflection** (post-derivation), using Candidate 1 and 2 as foils. Total: 20 minutes.  
  1. **"Reflection is epistemic humility / deference to future self."**  
     - **Defuse at**: First mention of the principle.  
     - **Response**: "Reflection isn’t about humility—it’s about *coherence*. If you’re certain your *rational* future self will believe \(X\), your current self must too. Candidate 1 isn’t deference; it’s consistency."  
     - **Poison if left late**: Analysts might dismiss Reflection as optional "open-mindedness."  

  2. **"Tired/biased future self refutes Reflection."**  
     - **Defuse at**: After presenting Candidate 1, introduce Candidate 2.  
     - **Response**: "Reflection *only* applies when your future self is rational (conditionalizes). Candidate 2’s fatigue breaks this—so Reflection doesn’t command deference here. The principle isn’t 'believe whatever you’ll think later'; it’s 'your current and *expected rational* beliefs must cohere'."  
     - **Poison if left late**: Analysts might cite hangry decisions to reject Reflection entirely.  

  3. **"Reflection is practical prudence (avoid losses)."**  
     - **Defuse at**: When justifying why Reflection matters.  
     - **Response**: "Reflection is a *constraint on belief*, not a tool. Violating it makes your beliefs incoherent over time—like probabilities summing to 150%. Practical gains (e.g., pre-registration reducing bias) are downstream effects."  

  ### What to Refuse to Cover
  - **Diachronic Dutch books** (explicitly say this).  
    - **Why**: 90 minutes is too short; requires utility/payout concepts unfamiliar to the audience.  
    - **Handling**: "We’re focusing on the *belief coherence* argument via conditionalization. Dutch books are a separate, technical justification we won’t cover."  
  - **Why they should care without Dutch books**:  
    - **Pitch**: "Reflection is a **consistency axiom** for beliefs over time. Violating it means your current beliefs don’t account for your *own expected rational evolution*—which is as flawed as violating \(P(A) + P(A^c) = 1\). Pre-registration enforces this consistency."  
    - **Use their domain**: "In forecasting, inconsistency opens the door to self-deception (e.g., ‘I’ll downgrade later, so I’ll overstate now’)."  

  ### Closing Question
  **"You’re certain that after seeing next month’s data, you’ll believe Pr(Outbreak) = 0.3. What does Reflection say your current Pr(Outbreak) must be? What if you’re not certain, but expect your future belief to be 0.3 on average?"**  
  - **Tests understanding**:  
    - First part: Must answer **0.3** (certainty about future belief mandates current belief).  
    - Second part: Must answer **0.3** (Reflection equates current belief with *expectation* of future belief).  
  - **Memorizers fail**: They’ll parrot "current equals expected future" but miss the certainty edge case.  

  ---

  ### Session Roadmap (90 Minutes)
  1. **Intro + Staff Claim (5 min)**: Frame session around pre-registration justification.  
  2. **Conditionalization (15 min)**: Non-negotiable foundation; show the math.  
  3. **Reflection Derivation (10 min)**: Law of total expectation → \(P_t(A) = \mathbb{E}_t[P_{t+1}(A)]\).  
  4. **Staff Claim = Reflection (5 min)**: Direct mapping.  
  5. **Candidate 1 Case (10 min)**: Illustrates Reflection; forces conflict (0.6 vs. 0.9).  
  6. **Misconceptions (20 min)**: Debunk using Candidate 1 vs. 2.  
  7. **Why Care? (10 min)**: Coherence, not prudence; refuse Dutch books.  
  8. **Closing Question (5 min)**: Assess understanding.  
  9. **Buffer/Q&A (10 min)**.  

  This leaves Reflection "securely in place": Staff claim validated, core architecture built, misconceptions preempted, and coherence emphasized.
