  Part (d):
  The Nash solution maximizes the product of gains: (x1 - d1)*(x2 - d2) = (x1-2)(x2-1) over the feasible and individually rational set. The Pareto frontier is x1+2x2=20 (with x1>=2, x2>=1). We can substitute x1 = 20 - 2x2. Then the objective becomes: (20-2x2-2)(x2-1) = (18-2x2)(x2-1). Let f(x2)= (18-2x2)(x2-1) = 18x2 - 18 - 2x2^2 + 2x2 = -2x2^2 + 20x2 - 18. This is a quadratic. The vertex is at x2 = -b/(2a) = -20/(2*(-2)) = 20/4 = 5. Then x1=20-2*5=10. The product is (10-2)(5-1)=8*4=32. The student got (10,5) for Nash, same as KS.

