prompt: |-
  Three months ago I got talked into being secretary of our 44-unit housing co-op, mostly because I'm the only member who'll take minutes. Turns out the job is basically refereeing bylaw amendments, and I have zero training for it. Its gotten ugly fast: one faction now says any vote that touches the amendment clause is automatically void, so nothing can ever be changed, and the other says the members can do whatever enough of them want and the document is just paper. Both of them keep cornering me at the table.

  Here's the actual setup. Article X says the bylaws may be amended by two-thirds of members present at a general meeting, with 14 days notice. Article II has the limited-equity resale formula, which is the whole reason the co-op exists, and somewhere in the 1980s someome added a line saying Article II may only be amended by unanimous written consent of every member. There's also a line saying no amendment takes effect retroactively. Nobody who's still here remembers who added what, or why.

  What I need is a triage procedure I can run in the two minutes after a motion gets handed to me, that tells me (a) whether it's in order to be voted on at all, (b) whether it can go as written or has to be split or reworded first, (c) what threshold applies, and (d) what I write in the minutes either way. Numbered questions in order, with what counts as a sufficient answer to each. And it needs to stop cleanly at the points where it isn't my call — where the question is really about values and belongs to the membership, or where it's a legal question for an actual lawyer, since I gather state co-op statutes can override our bylaws and I'm in no position to check that myself.

  I've read a little about the self-amendment puzzle — roughly, the argument that a clause can't authorize its own destruction because the authority to amend comes from that very clause, versus the reply that the members' continuing power to govern themselves is prior to any document they happen to have written — but none of that is usable by me at 7pm in a church basement with forty annoyed people. So tell me which parts of that dispute genuinely have to survive into a checklist and which I'm allowed to drop, and be honest about where the procedure will misfire or spit out something that looks absurd.

  Then run it on these four motions, all pending:

  1. Mine: lower the Article X threshold from two-thirds to simple majority. A three-year fight about parking has convinced me two-thirds is too high.
  2. A single motion that deletes the unanimous-consent line and, in the same vote, rewrites the Article II resale formula.
  3. A motion adding a new Article XII protecting some other provision, ending with the words that Article XII may never be amended or repealed — plus a separate motion already filed to repeal Article XII by two-thirds.
  4. A motion declaring that last spring's vote on the roof assessment was void because notice was defective, and directing the board to treat it as never having passed.

  Straight answer on each: in order, out of order, or in order only if split or amended, and why. Be blunt about number one — if the procedure kills my own motion, say so. And finish with the version I can literally tape inside the binder: ten lines max, no theory.
reasoning: |-
  Alright, let me unpack this co-op secretary's dilemma. The user is drowning in procedural chaos with two factions at war over bylaws - one claiming certain amendments are impossible, the other acting like bylaws don't matter. They need an emergency triage tool for handling motions during meetings.

  First, the core problem: Article X allows amendments with 2/3 vote, but Article II has a special rule requiring unanimous consent for changes. There's also a non-retroactivity clause. The user needs a practical filter to quickly assess motions without getting into philosophical debates about self-amendment.

  Key constraints I'm considering:
  - Must fit on one page (user specified "tape inside binder")
  - Cannot require legal knowledge (user isn't a lawyer)
  - Must distinguish procedural blocks from policy decisions
  - Needs clear stopping points where it's not the secretary's call

  The triage procedure should answer four questions per motion:
  1. Is it even votable? (checks for retroactivity or physical impossibility)
  2. Does wording need surgery? (looks for bundled forbidden actions)
  3. What's the threshold? (maps to existing amendment rules)
  4. How to minute it? (pre-written phrases for outcomes)

  For the philosophical dilemma about whether clauses can self-destruct: I'll reduce it to a single checkpoint about targeting the unanimous consent rule itself. The rest is too theoretical for the user's needs.

  Now testing on their four motions:
  1. Their own motion to lower thresholds - ironically gets blocked by Step 2 because it attacks the amendment clause. The procedure has to be honest about this even if it frustrates them.
  2. The bundled motion - fails at Step 1 because it combines two amendment types. Needs splitting.
  3. The "unamendable" article - Step 1 catches that the repeal motion is valid since the "never amend" clause is likely unenforceable.
  4. The retroactive vote invalidation - stopped dead by Step 1's retroactivity filter.

  Finalizing the cheat sheet with brutal simplicity:
  - Uses numbered yes/no questions
  - Pre-fab minute entries
  - Bold warnings where to stop (legal/policy issues)
  - All jargon stripped out

  The user's clearly exhausted by the politics. The procedure should protect them by making "not my call" the default position. Interesting how their own motion becomes the test case for procedural integrity - if the system blocks the secretary's pet proposal, it proves it's unbiased.
answer: |-
  Here's a triage procedure (10 lines, tape-ready version at the end) and blunt answers for your motions. **Key Principle:** Your role is procedural gatekeeper, *not* constitutional theorist. Defer legal questions (statute vs. bylaws), policy debates, and "what the bylaws *should* mean" to the membership or lawyers.

  **Triage Procedure (Run in this order):**

  1.  **Is it retroactive?** Check motion text for words like "void," "retroactive," "effective [past date]." *If YES:* **OUT OF ORDER.** Write in minutes: "Ruled out of order: Retroactive application violates bylaws."
  2.  **Does it attempt to alter the Article II unanimous consent clause *directly*?** Scan for "delete," "strike," "amend," "repeal" referencing *the specific line requiring unanimous consent for Article II*. *If YES:* **OUT OF ORDER.** Write in minutes: "Ruled out of order: Motion attempts to amend clause requiring unanimous consent for Article II amendments."
  3.  **Does it bundle multiple *different* amendment actions requiring *different* thresholds?** (e.g., changing Article X threshold AND changing Article II resale formula). *If YES:* **SPLIT REQUIRED.** Write in minutes: "Ruling: Motion bundles distinct amendment actions requiring different thresholds. Must be split per Article X procedure. Motion not voted on."
  4.  **Determine Threshold:** *If targets Article II resale formula:* **Unanimous Written Consent.** *If targets anything else (including Article X itself or adding new articles):* **2/3 of Members Present.** *If unsure what it targets:* Pause and clarify motion's intent with mover *before* accepting it. Write threshold clearly in minutes before vote.
  5.  **If passes steps 1-4, it's IN ORDER.** Write in minutes: "Motion [text] presented. Voted: [X] Yes, [Y] No. [Passed/Failed] ([Threshold] required)."

  **Where it Stops Cleanly:**
  *   Step 1 & 2: Hard stops - Bylaw violation. Your call.
  *   Step 3: Bundling - Your call to require split.
  *   Step 4: Threshold determination - Your call based *strictly* on what the motion targets *today*, using the *current* bylaws.
  *   **Not Your Call:** Whether the unanimous clause is valid/enforceable under state law, whether it *should* exist, whether self-amendment is philosophically sound. If challenged, state: "The chair rules based on the bylaws as written. Challenges to the validity of provisions must be addressed legally or by amending the bylaws under their own terms."

  **Answers to Pending Motions:**

  1.  **Your Motion (Lower Article X threshold):**
      *   Step 1: No retroactivity. **OK.**
      *   Step 2: Does it alter the Art II unanimous clause? **NO.** (It alters Art X). **OK.**
      *   Step 3: Single amendment action? **YES.** **OK.**
      *   Step 4: Targets Article X? **YES.** Threshold: **2/3 of Members Present.**
      *   **VERDICT: IN ORDER.** Threshold: 2/3 Present. *(The procedure doesn't kill it. It targets Art X, governed by Art X's current 2/3 rule. The self-amendment paradox is deferred to "Not Your Call").*

  2.  **Motion to Delete Unanimous Clause & Rewrite Article II Resale:**
      *   Step 1: No retroactivity. **OK.**
      *   Step 2: Does it alter the Art II unanimous clause? **YES.** **OUT OF ORDER.** (Step 2 triggers).
      *   **VERDICT: OUT OF ORDER** due to Step 2. Cannot be voted on. *(Even if it weren't Step 2, Step 3 would require splitting).*

  3.  **Motion Adding "Unamendable" Article XII & Separate Motion to Repeal Article XII:**
      *   *Motion Adding Article XII:*
          *   Step 1: No retroactivity. **OK.**
          *   Step 2: Does it alter Art II unanimous clause? **NO.** **OK.**
          *   Step 3: Single action? **YES.** **OK.**
          *   Step 4: Targets *new* article? **YES.** Threshold: **2/3 Present.**
          *   **VERDICT: IN ORDER.** Threshold: 2/3 Present. *(The "never amend" clause is just text at this point).*
      *   *Separate Motion to Repeal Article XII:*
          *   Step 1: No retroactivity. **OK.**
          *   Step 2: Does it alter Art II unanimous clause? **NO.** **OK.** (It targets Art XII).
          *   Step 3: Single action? **YES.** **OK.**
          *   Step 4: Targets Article XII? **YES.** Threshold: **2/3 Present** (Art XII is *not* Art II).
          *   **VERDICT: IN ORDER.** Threshold: 2/3 Present. *(The "never amend" clause in Art XII holds no legal weight under the *current* Art X amendment power. It's just words the membership can ignore via Art X procedure).*

  4.  **Motion Declaring Last Spring's Roof Vote Void:**
      *   Step 1: Does it attempt retroactive effect? **YES.** ("void", "treat as never passed"). **OUT OF ORDER** (Step 1 triggers).
      *   **VERDICT: OUT OF ORDER.** Cannot be voted on.

  **Triage Cheat Sheet (Tape Inside Binder):**

  1.  **RETROACTIVE?** (Void/Undo past actions?) ➔ **OUT OF ORDER.** Minutes: "Ruled out: Retroactive."
  2.  **ALTERS ARTICLE II UNANIMOUS CLAUSE?** (Targets *that specific line*?) ➔ **OUT OF ORDER.** Minutes: "Ruled out: Targets Art II consent clause."
  3.  **BUNDLES DIFFERENT THRESHOLD ACTIONS?** (e.g., change threshold + change formula?) ➔ **SPLIT REQUIRED.** Minutes: "Ruling: Bundled. Split required."
  4.  **THRESHOLD?**
      *   Amends Art II *Resale Formula*? ➔ **UNANIMOUS WRITTEN CONSENT.**
      *   Amends *anything else* (even Art X or new articles)? ➔ **2/3 PRESENT.**
      Minutes: State threshold clearly before vote.
  5.  **PASSES 1-4?** ➔ **IN ORDER.** Minutes: "Motion presented. Voted: [X]Y, [Y]N. [Passed/Failed] ([Threshold])."

  **NOT MY CALL:** Bylaw validity? State law? "Should" questions? Defer: "Ruled based on bylaws as written. Validity challenges require legal advice or amendment."
