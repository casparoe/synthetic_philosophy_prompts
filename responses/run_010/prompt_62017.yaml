  ### **Critical Reflections on the Tree**  
  #### I. Two Pairs of Leaves the Tree Cannot Separate  
  1. **Dispersed Knowledge vs. Competition as Discovery**:  
     - *Why indistinguishable*: Nodes 7 (Unforeseen Product Demand) and 14 (Discovery vs. Computation) both trigger these leaves. A "Yes" to Node 14 *or* "No" to Node 7 leads to "Discovery," but both positions share a core belief: markets generate irreplaceable knowledge. The tree cannot isolate whether the obstacle is *existing* tacit knowledge (Dispersed) or *future* discovery (Competition).  

  2. **Hybrid Formalism-Praxis Gap vs. Comparative Institutional Failure**:  
     - *Why indistinguishable*: Both emerge from "No" to Node 13 (Trial-and-Error Feasibility) and "Yes" to Node 6 (Output Target Incentives). The Hybrid view blames practical flaws in trial-and-error; the Comparative view avoids theory entirely. The tree conflates "practical failure" with "contextual relativism."  

  #### II. Three Unoccupied Cells in the Logical Space  
  *(5 obstacles × 3 scopes × 3 modalities = 45 cells; below are empty ones)*  

  1. **Obstacle**: Conceptual × **Scope**: Dynamic × **Modality**: Severe Impracticability  
     - *Why empty*: Incoherent. If cost is *undefined* without property rights (conceptual), dynamic adaptation is *impossible*, not merely impractical.  

  2. **Obstacle**: Computational × **Scope**: Comparative × **Modality**: Impossibility  
     - *Why empty*: Unattractive. If computation is *impossible* (modality), comparative claims (scope) become irrelevant—no one defends "impossible but sometimes better."  

  3. **Obstacle**: Incentive × **Scope**: Static × **Modality**: Impossibility  
     - *Why empty*: Unexplored. Incentive problems *could* theoretically be solved (e.g., via mechanism design), so impossibility claims are rare. No major thinker argues incentives make static allocation *in principle* unachievable.  

  #### III. Settled vs. Contested in the Debate  
  **Settled (Broad Consensus):**  
  - Mises’ original argument was **conceptual** (no property → no exchange → no prices → no rational calculation).  
  - Lange’s trial-and-error model **accepted Mises’ terms** by seeking to replicate market prices administratively.  
  - The debate **generalizes beyond capital goods**; services, innovation, and labor allocation face similar issues.  
  - Eastern Europe’s collapse is **not decisive theoretical evidence**—it reflected political failures, external pressures, and implementation flaws.  

  **Contested (Active Disagreement):**  
  - **Hayek’s departure from Mises**: Was Hayek’s "knowledge problem" a distinct *informational* argument or just repackaging Mises? *(Your Axis 1 "informational obstacle" is contested here.)*  
  - **Scope of the firm**: Does the internal-planning reductio invalidate the calculation argument, or do firms rely on external markets? *(Your "internal-planning reductio" leaf is contested.)*  
  - **Empirical vs. theoretical weight**: Does 20th-century planning failure settle the debate, or is it a distraction from conceptual issues? *(Your "empirical settlement" leaf is hotly contested.)*  
  - **Mechanism design**: Can incentive-compatible schemes (e.g., iterative voting) solve public-goods allocation? *(Your "mechanism-design" leaf is coherent but empirically unproven.)*  

  **Malformed Position Note:**  
  - **Modern computational planning** (labor-time + AI) is **incoherent** if it ignores *subjective value*. Labor-time cannot capture why water in a desert is valued more than in a rainforest. This leaf bites the bullet that "value = objective labor input," a fringe view.
