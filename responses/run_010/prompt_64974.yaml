  Revised Case 6: A home security system that, when triggered, emits a loud alarm (over 100 decibels) at 3 a.m. to alert the homeowner and neighbors of a possible break-in. The alarm is within 300 feet of many dwellings. (Textually, it's a violation. But the purpose of the ordinance is to protect sleep and quiet, yet the alarm is meant to alert and protect. However, it might wake everyone up. But the drafters didn't think of this because they were focused on the rooster. In the committee minute, they only mention the rooster. This case breaks the principle: if they were being textualist, they must rule it a violation, but that seems absurd. If they are purposivist, they might say the purpose was to prevent unnecessary noise, and this is necessary. But then what about the gas leak? Why allow one and not the other? This creates tension.)

  Order of cases:
  1. Rooster guy (Case 1) - violation
  2. White noise machine (Case 2) - violation? (textualism) or non-violation? (purposivism: it helps sleep)
