  We are designing an interactive activity for a jurisprudence discussion section on statutory interpretation, focusing on textualism vs purposivism. The goal is for students to experience the tension between these approaches rather than being told about it. The activity will use a fictional ordinance from the town of Kessler and a set of cases that challenge the students to apply the ordinance in various scenarios.

  Key elements from the request:
  - The ordinance: "No person shall operate a sound amplification device within 300 feet of an occupied dwelling between the hours of 10:00 p.m. and 7:00 a.m."
  - We have two versions: one with a preamble ("to protect the sleep and quiet of residents at night") and one without.
  - A committee minute that reveals the ordinance was prompted by one person playing recorded rooster crowing at 4:40 a.m.
  - Students will be in groups, and different groups get different materials (to simulate the real-world situation where not all interpretive materials are available to everyone).
  - We want a ladder of about six cases, ordered so that the last one breaks the principle they settled on earlier.
  - We want a role reversal: students should act as textualists when writing rules for others but become purposivists when rules are applied to them.
  - The activity should lead to a debrief that highlights the divergence between the meaning of the words and the drafters' expectations, and whether the purpose invoked was in the materials or not.

  Structure of the activity:
  1. Introduction and setup (10 minutes)
  2. Adjudication round: Groups rule on a sequence of cases (40 minutes)
  3. Drafting round: Groups propose amendments to the ordinance (15 minutes)
  4. Debrief and discussion (15 minutes)

  Materials to prepare (handouts):
  - Handout 1: The ordinance (two versions: with and without preamble) and the committee minute. Different groups get different combinations.
  - Handout 2: Case descriptions (one page with all six cases, but groups will get them one at a time? Or all at once? We'll do one at a time to build the ladder.)
  - Handout 3: Worksheet for adjudicating each case and for drafting.

  Grouping:
  - 24 students -> 6 groups of 4 students each.

  Roles within groups: Each group acts as a panel of judges. They must reach a majority decision on each case.

  Points system:
