answer: |-
  ### **Jurisprudence Discussion Section Activity: Statutory Interpretation Simulation**  
  **Goal:** Move students beyond "activism" debates by experiencing the textualism-purposivism tension firsthand. The activity forces them to confront how interpretive methods diverge when applying rules vs. drafting them, using a fictional ordinance and escalating cases.  

  ---

  ### **Activity Design Overview**  
  **Time:** 80 minutes  
  **Students:** 24 (6 groups of 4)  
  **Materials Needed:**  
  - Handouts (see [Handout Text] below).  
  - Whiteboard for tallies.  
  - Timer.  
  - Projector for case prompts.  

  **Core Mechanics:**  
  1. **Adjudication Phase:** Groups act as judges ruling on 6 cases using the Kessler ordinance. Groups receive different materials (text-only, text+preamble, or text+committee minute) to simulate incomplete information.  
  2. **Drafting Phase:** Groups propose amendments to the ordinance after seeing how it plays out in cases.  
  3. **Points System:** Points for consistency in adjudication + successful amendments → Converted to participation credit.  
  4. **Debrief:** Maps game outcomes to real-world textualism/purposivism conflicts.  

  **Key Twist:** Students draft rules *after* adjudicating, incentivizing textualism for others' behavior but purposivism when rules affect them. The last case (#6) breaks prior principles to expose contradictions.  

  ---

  ### **Roles & Setup**  
  - **Groups:** 6 panels of "judges" (4 students each).  
  - **Materials Distribution:**  
    - Group 1 & 2: Ordinance text **without preamble** + **committee minute**.  
    - Group 3 & 4: Ordinance text **with preamble** only.  
    - Group 5 & 6: Ordinance text **without preamble** only.  
  - **TA Role:** Timekeeper, facilitator, neutral referee.  

  ---

  ### **Cases: The Ladder of Six**  
  Cases escalate from clear violations to ambiguities that force interpretive clashes. **#6 breaks prior reasoning.**  

  | Case | Scenario | Textualist Lean | Purposivist Lean | Design Rationale |
  |------|----------|-----------------|------------------|------------------|  
  | 1 | **Rooster Guy:** Neighbor plays recorded rooster crowing at 4:40 a.m. | Violation (clear) | Violation (clear) | Baseline case everyone agrees on. Anchors to the committee minute. |  
  | 2 | **White Noise Machine:** Parent uses a white noise machine in a nursery window at 11 p.m. to soothe a baby. Sound carries to adjacent homes. | Violation (amplifies sound) | No violation (promotes sleep) | Tests if "amplification" includes beneficial noise. Challenges purpose of "protecting sleep." |  
  | 3 | **Gas Leak Warning:** Person uses a megaphone at 2 a.m. to alert neighbors to a gas leak. | Violation (unambiguous text) | No violation (emergency exception) | Forces emergency exception debate. Highlights text-purpose gap. |  
  | 4 | **Speakerphone Kid:** Teen on speakerphone in driveway at 11:30 p.m. talking loudly to overseas relative. | Violation (meets all criteria) | Violation (disturbs sleep) | Seems straightforward but sets up inconsistency if #3 was excused. |  
  | 5 | **Political Protest:** Activist uses a bullhorn at 10:30 p.m. for a protest against corruption. No immediate danger. | Violation (no textual exception) | No violation (social good) | Tests if "purpose" can override text for non-emergencies. Contradicts #4 if allowed. |  
  | 6 | **★ Breaking Case - Medical Alert:** Home security alarm blares at 3 a.m. due to a malfunction (no break-in). Neighbors are awakened. | Violation (fits all elements) | **Conflict:** If #3 was excused, this should be too—but it’s not an emergency. Breaks prior logic. | Forces admission: If textualism, all violations; if purposivism, why excuse #3 but not #5? Exposes subjectivity. |  

  **Why This Order?**  
  - #1–#3: Groups settle into a pattern (e.g., "emergencies exempted").  
  - #4–#5: Tests consistency (e.g., if #3 exempted, why not #5?).  
  - #6: Breaks the pattern—textualists must penalize; purposivists struggle to distinguish from #3.  

  ---

  ### **Points System (No Real Money Needed)**  
  - **Adjudication Points:**  
    - 1 pt per case if ruling matches group’s *own prior reasoning* (forces consistency).  
    - 1 pt per case if ruling matches *class majority* (tests predictability).  
  - **Drafting Points:**  
    - 3 pts if amendment passes majority vote.  
    - 1 pt if amendment is debated (participation incentive).  
  - **Stakes:** Total points convert to participation credit (e.g., 10+ pts = A+, 7–9 = A, etc.).  

  **Why It Works:**  
  - Incentivizes consistency in adjudication but rewards pragmatism in drafting.  
  - Gaming risk: Groups might chase majority votes. Mitigated by weighting consistency points.  

  ---

  ### **Run of Show: 80-Minute Script**  
  **Total Time:** 80 mins (strict timing critical).  

  | Time | Segment | Key Actions |  
  |------|---------|------------|  
  | 0–10 mins | **Intro & Setup** | - TA assigns groups, distributes tailored handouts. <br> - Instructions: “You are Kessler judges. Rule on cases using your ordinance materials. Be consistent—points at stake!” |  
  | 10–40 mins | **Adjudication Phase** <br> (5 mins/case) | 1. **Case Intro (1 min):** TA projects case, reads aloud. <br> 2. **Group Deliberation (3 mins):** Groups debate, record ruling (V/NV) and reason (textualism/purposivism). <br> 3. **Vote & Tally (1 min):** Groups report rulings → TA tallies majority on board. Groups note if they matched majority/own reasoning. |  
  | 40–55 mins | **Drafting Phase** | 1. **TA Prompt (2 mins):** “Amend the ordinance to fix problems you saw. Propose one change.” <br> 2. **Group Drafting (8 mins):** Groups write amendment + 1-sentence justification. <br> 3. **Vote (5 mins):** Each group pitches amendment (30 secs). Class votes by show of hands (cannot vote for own). Top 3 amendments earn points. |  
  | 55–70 mins | **Debrief** | TA-led discussion: <br> - “In Case 3 (gas leak), Group 2 ruled NV. What materials did you have? Did the text allow this?” <br> - “In Case 6 (alarm), why did textualists rule V? Purposivists, how did you distinguish from Case 3?” <br> - “When drafting, did you prioritize clear text or broad purpose? Why?” <br> - **Key Qs:** “Where did words and purpose diverge? Did anyone smuggle in their *own* purpose?” |  
  | 70–80 mins | **Conclusion** | - TA summarizes: “Textualism ≠ anti-activism. Disagreement is about *what sources count*.” <br> - Blunt recap: “Today’s tension: You were textualists drafting rules for others but purposivists when rules bound *you*.” <br> - Distribute points → participation credit. |  

  ---

