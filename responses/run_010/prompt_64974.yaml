  ### **Debrief Guide: Connecting Game to Reality**  
  Use whiteboard to map moments:  

  | Game Moment | Real Jurisprudence Conflict | TA Script |  
  |-------------|----------------------------|-----------|  
  | **Case 3 (Gas Leak):** Groups with committee minute/preamble rule NV; text-only groups rule V. | **Text vs. Expectation Gap:** Drafters never considered emergencies. Purposivists imply exceptions; textualists reject them. | “In Case 3, words and drafter intent diverged. Did purposivists *find* purpose in materials or *invent* it? Textualists, why couldn’t you rule NV?” |  
  | **Case 6 (Medical Alarm):** Textualists penalize; purposivists struggle to distinguish from Case 3. | **Absurdity Debate:** Textualism’s “absurd results” problem (e.g., penalizing alarms). Purposivism’s subjectivity (why emergencies but not protests?). | “Case 6 broke your principles. If textualism, why did it feel unfair? If purposivism, why was your purpose inconsistent?” |  
  | **Drafting Phase:** Groups add exceptions (e.g., “emergencies”) or clarify terms (e.g., “malicious intent”). | **Legislative vs. Judicial Role:** Drafters (you!) prioritized clear rules to constrain judges. But as judges, you wanted flexibility. | “When drafting, you chose precise text—like textualists. But in Case 3, you wanted purpose to save you—like purposivists. That’s the core tension!” |  

  **Blunt Takeaways for Students:**  
  1. Textualism ≠ judicial restraint; purposivism ≠ activism. It’s about *sources* (text vs. purpose/history).  
  2. Words and expectations diverge (gas leak ≠ roosters; alarm ≠ emergencies).  
  3. Purposes are often “smuggled in” (e.g., emergencies) when materials are silent.  

  ---

  ### **Predictable Problems & Mitigation**  
  1. **Timing Issues (40% risk):**  
     - *Risk:* Adjudication runs long; groups eye the clock.  
     - *Fix:* Use visible timer. Cut deliberation to 2.5 mins if behind. Skip one case if necessary (Cases 4/5 are less critical than 3/6).  

  2. **Gaming Points (20% risk):**  
     - *Risk:* Groups ignore reasoning to chase majority votes.  
     - *Fix:* Weight “consistency” points higher. In debrief, shame inconsistency: “Group 4, you used purposivism in Case 2 but textualism in Case 5—why?”  

  3. **Dominant Personalities (30% risk):**  
     - *Risk:* One student monopolizes discussion.  
     - *Fix:* Assign roles (e.g., Facilitator, Recorder, Speaker, Timekeeper) and rotate per case.  

  4. **Superficial Drafting (25% risk):**  
     - *Risk:* Groups propose vague fixes (e.g., “except emergencies”).  
     - *Fix:* Award points only for *specific* language (e.g., “except for public safety emergencies”).  

  ---

  ### **What the Game Can’t Reproduce**  
  **Feature:** **Precedent and Institutional Legitimacy**  
  - **Why Missing:** Real judges face stare decisis, public trust, and separation of powers. Your game lacks layered case history and political consequences.  
  - **How to Supply It:** Post-activity mini-lecture:  
    > “In reality, textualism isn’t just about text—it’s about judicial restraint to avoid overstepping democratic legislatures. Purposivism isn’t just fairness—it’s about adapting laws to modern dilemmas. Both worry about legitimacy. Scalia and Breyer didn’t just debate words; they debated who should govern.”  

  ---

  ### **Why This Avoids "Vehicles in the Park"**  
  - Cases focus on **sound amplification**, not physical objects.  
  - Scenarios are modern, relatable, and escalate in moral complexity (sleep > safety > protest rights).  
  - The committee minute and preamble create a "history" beyond the text, forcing engagement with sources.  

  This design forces students into the interpretive trenches. They’ll leave frustrated by the gaps—which means they’re finally grappling with the real dispute.
