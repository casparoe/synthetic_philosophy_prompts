  - Points convert to participation credit. We can have a leaderboard to add a bit of competition.

  Stakes: The points will be converted to a small bonus on participation grade (e.g., top group gets +2%, next +1.5%, etc., but the TA can adjust). Alternatively, the points can be used to drop a low quiz score, but participation credit is easier.

  Case Ladder:
  We want six cases that gradually challenge the ordinance. The last case should break the principle they thought they were using.

  Case 1: Clear violation - the original rooster guy. (This is straightforward and should be a violation by any reading.)
  Case 2: A borderline case that might be a violation but is not as clear. Example: A white noise machine in a nursery window, placed to help a baby sleep. The machine is within 300 feet of a neighbor's dwelling. (Is it a "sound amplification device"? It's amplifying white noise. But the purpose might be to promote sleep, not disturb it. However, the ordinance doesn't care about intent.)
  Case 3: Someone with a megaphone at 2 a.m. warning the street about a gas leak. (This is clearly a sound amplification device and within the time and distance, but the purpose is to save lives. Should it be allowed? Textually, it's a violation.)
  Case 4: A kid on speakerphone in a driveway at 11 p.m. talking to a relative overseas. (The sound is amplified by the phone's speaker, but it's not very loud. Is it a "sound amplification device"? And is the driveway within 300 feet of an occupied dwelling? It probably is, but the disturbance is minimal.)
  Case 5: A person playing soft classical music through outdoor speakers in their own backyard at 10:30 p.m. to relax. (Again, within the time and distance. But the music is soft and might not disturb neighbors. However, the ordinance doesn't have a volume threshold.)
  Case 6: The breaker case - A resident who uses a medical device that emits a low humming sound (amplified by a small speaker) at night to help with sleep apnea. The device is necessary for health. (This is not intended to disturb, and it's for health, but the device is a sound amplification device. Also, it's within 300 feet of other dwellings? Probably, if in a typical neighborhood.)

