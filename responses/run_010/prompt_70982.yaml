prompt: |-
  So I TA an upper-level philosophy-of-economics seminar and I've been handed the job of writing the final exam, which is one essay question, 75 minutes, 25 marks. Last year's question was basically "is revealed preference theory empirically empty?" and it was a disaster — nearly every script opened with the same two moves: (1) utility is defined as whatever choice reveals, so the theory is true by stipulation and can't be tested, (2) insert a paragraph on instrumentalism and whether it matters. I want a question where that template gets you nowhere, because the interesting issue is that the emptiness charge looks way too easy given what the nonparametric results actually deliver.

  Here's the apparatus I want the question built around (this is my own cooked-up case, treat it as given, don't try to source it). A subject makes 30 budget-constrained purchases under varying prices; the resulting price-quantity dataset satisfies GARP, so by Afriat's theorem there's some locally non-satiated utility function that rationalizes every observation. The same subject then gets the same bundles presented pairwise, with no prices and no budget framing, and produces a strict cycle, A preferred to B preferred to C preferred to A; and on a verbal report she says she prefers C to A. An economist I'll call the two-tier theorist says there's no tension at all: the agent has a latent ordering R that governs choice whenever a "salience condition" S obtains — roughly, whenever the choice is framed as a trade-off at given prices — and otherwise choice is driven by a heuristic H, say "take the option with the more conspicuous good." Market data reveals R; the pairwise cycle reveals H. My worry, and the thing I want students to actually argue about rather than gesture at, is whether the two-tier theory rescues revealed preference from the tautology charge or quietly empties it out completely: if any pattern of choices can be sorted between R and H, the theory predicts nothing about choice unless S and H can be pinned down independently of the very data they're supposed to explain. I'd like the question to make students say what S would have to look like for the theory to still have content, and to reach a verdict on it.

  Could you write the whole thing? So: the exam question itself, self-contained enough that a student can read the case and the two-tier theory in about five minutes and needs no outside reading; a model answer of around 800 words that takes a side and defends it (I don't want a "both readings have merit" ending — pick a verdict about whether the theory is empirical, empty, or something in between, and about what utility is doing in it, i.e. whether it's an implicitly defined theoretical term or a substantive posit about the agent); and a marking scheme out of 25 built from five or six must-hit moves, each with its marks and a one-line note on the mistake that usually loses them. The mistakes I keep seeing are worth encoding: students treat a GARP violation as if it meant "the agent is irrational" rather than "no utility function rationalizes this dataset"; they think saying "unfalsifiable" settles the matter instead of asking whether the extra flexibility buys anything; they slide from Afriat's theorem to claims about uniqueness or measurability or about the agent actually having the utility function in her head; and they conflate the definitional reading of revealed preference with the empirical one without noticing that the two can't both be the target of the same objection. No citations, dates, or page numbers anywhere in the question or the answer key — students weren't assigned readings for this one, and I don't want a recitation exercise. Oh, and please keep the tone of the question dry and exam-like, not chatty; I'll paste it straight into the paper.
reasoning: |-
  Okay, the user is a TA for an upper-level philosophy of economics seminar tasked with creating a final exam essay question. Last year's question on revealed preference theory led to repetitive answers, so they want something that forces deeper engagement. The core issue is whether a "two-tier theory" rescues revealed preference from being empirically empty or makes it vacuous by allowing any choice pattern to be explained away.

  First, I need to understand the user's scenario. They teach a seminar where students likely grasp basics like GARP and Afriat's theorem but struggle with philosophical implications. The frustration last year was students defaulting to "utility is defined by choice, so it's tautological" without engaging with nuances. The new question must prevent that template. 

  The user's explicit needs are clear: a self-contained exam question, a model answer taking a firm stance, and a detailed marking scheme. But deeper needs emerge. They want students to:
  - Grapple with how auxiliary assumptions (like salience condition S) affect testability
  - Distinguish between definitional vs. empirical interpretations of utility
  - Avoid common mistakes (e.g., treating GARP violations as irrationality)
  - Recognize that Afriat's theorem doesn't imply psychological realism

  The challenge is designing a question where superficial answers fail. The two-tier theory setup is clever because:
  1. GARP compliance shows rationalizability in market frames
  2. The cycle in pairwise choices introduces a conflict
  3. The theory "saves" rationality by splitting explanations between R (rational) and H (heuristic)

  The critical tension: if S and H can be adjusted post-hoc, the theory becomes unfalsifiable. But if S is independently specified, it might retain content. Students must engage this—not just label it "unfalsifiable" and stop.

  For the exam question, I'll structure it as:
  - **Setup**: Describe the data (GARP-compliant purchases + strict cycle in pairwise choices)
  - **Two-tier theory**: Define R (latent ordering), S (salience condition), H (heuristic)
  - **Prompt**: Force a verdict on whether this rescues or empties revealed preference, demanding analysis of S's role

  The model answer will argue the theory is empty without independent constraints on S, because:
  - Any choice can be assigned to R or H arbitrarily
  - S is defined circularly (it "obtains" when choices fit R)
  - No way to test if R exists beyond fitting GARP data

  But it'll acknowledge that with empirical constraints on S (e.g., via framing manipulations), content could emerge. The verdict: as stated, it's empty.

  Marking scheme targets common pitfalls:
  - Mistake 1: Claiming GARP violation = irrationality (loses 3 marks)
  - Mistake 2: Not analyzing how S determines testability (loses 5 marks)
  - Etc., totaling 25 points across 6 must-hit moves

  This should push students beyond "utility is stipulative" to ask: "What would make this theory meaningful?"—exactly what the user wants.
answer: |-
  ### Final Exam: Philosophy of Economics  
  **Time Allowed:** 75 minutes  
  **Total Marks:** 25  

  ---

  **Question**  
  Consider the following case:  
  > A subject makes 30 purchases under varying budget constraints (prices and income). Analysis shows this dataset satisfies the Generalized Axiom of Revealed Preference (GARP), so by Afriat’s theorem, the choices are consistent with maximization of some locally non-satiated utility function.  
  >  
  > In a subsequent task, the same subject is presented with the *same consumption bundles* in pairwise choices *without prices or budget framing*. Here, she exhibits a strict cycle: she chooses bundle A over B, B over C, and C over A. When asked verbally, she states she prefers C to A.  

  An economist ("the two-tier theorist") proposes a theory to reconcile this:  
  > The agent possesses:  
  > (i) A latent stable preference ordering **R** that governs choices when a **salience condition S** obtains (roughly: when choices are framed as budget-constrained trades at given prices).  
  > (ii) A heuristic **H** (e.g., "choose the bundle with the more conspicuous good") that governs choices when **S** does *not* obtain.  
  >  
  > Market data reveals **R**; the pairwise cycle reveals **H**. There is no contradiction because **S** distinguishes the contexts.  

  **Assess the following claim:**  
  *The two-tier theory rescues revealed preference theory from the charge of empirical emptiness (i.e., that it is tautological and unfalsifiable) by showing how utility maximization can coexist with choice inconsistencies.*  

  In your essay, address:  
  1. Whether the theory succeeds in making revealed preference empirically substantive, or whether it renders utility maximization vacuous by allowing *any* choice pattern to be explained away via **S** and **H**.  
  2. **Crucially**: What the salience condition **S** must look like to prevent the theory from becoming untestable.  
  3. Whether **R** (the utility function) is a substantive posit about the agent’s psychology or merely a theoretical term defined by its explanatory role.  

  *Take a clear stance and defend it.*  

  ---

  ### Model Answer (Approx. 800 words)  
  **Verdict:** The two-tier theory does *not* rescue revealed preference from empirical emptiness; it entrenches vacuity by making utility maximization unfalsifiable. While it gestures toward explanatory depth, its failure to independently constrain **S** and **H** reduces **R** to a post hoc construct with no predictive content.  

  **1. The theory’s explanatory flexibility is its fatal flaw.**  
  Revealed preference theory (RPT) is often accused of emptiness because utility is "revealed" by choice, making rationalization circular. The two-tier theorist attempts to evade this by restricting **R** to contexts where **S** obtains. Yet this invites a deeper problem: **any** choice pattern can be partitioned between **R** and **H** *after the fact*. If market choices violate GARP, the theorist can attribute this to **H** "intruding" when **S** should have held. If pairwise choices align, they can be assigned to **R**. The cycle in the pairwise task is dismissed as **H**, but without criteria to identify **S** or **H** *before* choices occur, the theory merely labels consistency as **R** and inconsistency as **H**. This is not empirical science—it is taxonomy.  

  **2. Salience condition S must be independently defined to add content—but isn’t.**  
  For the theory to have bite, **S** must be specifiable without referencing the agent’s choices. For example:  
  > - **S** obtains *if and only if* choices involve explicit price trade-offs.  
  >  
  > This links **S** to observable context, not choice outcomes. Predictions could then follow: e.g., if we frame pairwise choices with artificial prices, **R** should emerge and satisfy GARP. But the two-tier theorist does not provide this. Instead, **S** is *implicitly defined* by when choices align with **R**—which is itself inferred from GARP-compliant data. This circularity collapses into: "**R** governs when choices are consistent." The theory thus reduces to "agents maximize utility when they act consistently," which is RPT’s original tautology repackaged.  

  **3. R is a theoretical placeholder, not a psychological posit.**  
  Afriat’s theorem shows a utility function *exists* to rationalize GARP-compliant data, but it says nothing about uniqueness, psychological reality, or agents "having" **R**. The two-tier theory treats **R** as a latent causal structure, yet offers no way to test its existence beyond fitting past data. When the subject verbally prefers C to A—contradicting her market choice of A over C—the theorist attributes the verbal report to **H**. But if **H** can override **R** in non-**S** contexts, and **S** is undefined, **R** loses all connection to behavior beyond the initial dataset. **R** is not a discovery about the agent; it is a shadow cast by GARP.  

  **4. Contrast with empirical substance.**  
  A defensible version of the theory could require **S** to be:  
  > - Experimentally manipulable (e.g., "framing with prices triggers **S**")  
  > - Statistically regular (e.g., **H** has identifiable features like response-time patterns).  
  >  
  > Absent this, the "rescue" fails. Revealed preference’s core insight—that utility is abstracted from choice data—remains. The two-tier theory’s machinery of **R**, **S**, and **H** masks this by adding epicycles, but does not advance testability.  

  **Conclusion:** The two-tier theory empties revealed preference of empirical content by immunizing it against all contradictions. Without independent criteria for **S**, it is a narrative device, not science. Utility maximization survives only because the theory redefines "failure" as context. This is sophistication without progress.  

  ---

  ### Marking Scheme (Total: 25 marks)  
  Assess essays based on **must-hit moves** below. Deduct marks only once per error.  

  | **Marks** | **Criterion**                                                                 | **Common Mistake (lose marks if present)**                                                                 |  
  |-----------|-------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------|  
  | **4**     | **Identifies circularity risk**: Explains how arbitrary partitioning of data between **R**/**H** makes theory untestable. | Ignores how ad hoc assignment of choices to **R**/**H** voids predictions. |  
  | **5**     | **Analyzes salience condition S**: Argues **S** must be defined independently of choices to add content. | Fails to specify what an empirically grounded **S** requires (e.g., framing manipulations). |  
  | **4**     | **Distinguishes Afriat’s theorem from realism**: Notes that rationalizing utility ≠ evidence for psychological reality of **R**. | Asserts Afriat "proves" the agent "has" a utility function. |  
  | **5**     | **Takes a verdict on emptiness**: Clearly judges whether the theory rescues or empties RPT, defending one view. | Straddles ("both sides have merit") without resolution. |  
  | **4**     | **Addresses unfalsifiability charge**: Engages whether flexibility (explaining cycles) *helps* or *hurts* testability. | Claims "unfalsifiable" ends debate without analyzing trade-offs. |  
  | **3**     | **Avoids conceptual errors**: No conflation of GARP violations with "irrationality"; no equivocation on utility’s status. | Calls pairwise cycle "irrational" or treats utility as both definitional *and* psychological. |  

  ---

  **Exam Formatting Note:**  
  - Paste the **Question** as-is into the exam paper.  
  - The **Model Answer** is for grading guidance only (not shared with students).  
  - Use the **Marking Scheme** table to grade each script. Sum deductions per row.
