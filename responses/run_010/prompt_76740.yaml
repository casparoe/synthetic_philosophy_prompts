prompt: |-
  I serve as methods editor at a journal of comparative and historical social science. Between eight and twelve submissions a month reach me whose central claim is that some change in law, religion, family organization, political institutions, or cultural taste is explained by a change in the economic base — that the base does the explanatory work and the rest is superstructure, in whatever sense the author leaves to be inferred. Some of these papers are strong. Many are not, and their weaknesses are hard to name precisely, because the vocabulary of the tradition is easy to invoke and hard to satisfy. I have forty-five minutes per submission for a desk screen; I am not a specialist in this literature, and most of our referees are working historians or quantitative social scientists who have never engaged with it directly.

  Please write me a procedure I can run on such a submission: an ordered set of questions with gates, terminating in a recommendation — desk reject, revise and resubmit, or forward to a specialist — that I can defend to the author in plain language.

  The procedure should satisfy the following.

  First, give the questions in the order they should be asked, and state for each what counts as a sufficient answer and what does not. Where a question can only be answered by someone with substantive command of the historical material rather than the structure of the argument, say so, and mark it as a hand-off to a specialist referee instead of pretending I can adjudicate it.

  Second, tell me which distinctions the procedure must preserve for a reader who has never encountered this literature, and which may be dropped as decoration. I have in mind at least: the difference between the productive forces and the relations of production; the difference between a causal claim, a functional claim, and a claim about the space of feasible outcomes; the difference between asserting that base and superstructure correspond and asserting that the base has primacy; and the familiar qualification that determination holds only in the last instance. If there are further distinctions a screen of this kind cannot do without, add them and say what work each does. If any of the above is, for my purposes, a distraction, say so and justify it.

  Third, build in a treatment of the three retreats an author tends to make when a straightforward causal claim is unavailable — that the economy ruled out the alternatives, that the institution had to fit the base, that the institution persisted because it served the base — and set a distinct evidential standard for each, including what evidence could in principle count against it. Also build in the circularity problem I keep meeting: the base is often specified by appeal to property relations that are themselves legal categories, so the explanans appears to contain the explanandum. State what a paper can do to answer this worry and what merely restates it.

  Fourth, mark explicitly which steps are judgment calls wearing the costume of procedure, and where the procedure will misfire systematically: which kinds of good paper it will stall, which kinds of bad paper it will wave through.

  Then run the procedure on three submissions and, for each, report the outcome, what is handed to a specialist, and what the referee report should ask the author to do.

  Submission one argues that a national codification of commercial law in the 1870s followed from the expansion of railway finance. It offers a rich archive showing that the drafters' correspondence was dominated by economic argument, and that the date of passage tracks the boom in railway bonds. I like this paper and would prefer to accept it.

  Submission two argues that a pietist revival spread through a textile region because its doctrines of thrift and discipline suited mill owners. It documents that mill owners funded the congregations and that the doctrine took hold where mills were located, and offers nothing further.

  Submission three argues at length that the modern ideal of the autonomous self is a product of generalized market exchange. I am inclined to reject it as an essay rather than a study; but on reading, it specifies its base independently of the ideological evidence it aims to explain, proposes a mechanism involving contractual standing extended to non-kin, and tests that mechanism against a rival account in which the change is driven by state-building and war finance.

  Two constraints on your answer. Do not give me a bibliography, a reading list, or citations of any kind — neither I nor my referees can look anything up, so name the distinctions in prose rather than by reference. And do not assume I can recognize a technical term on sight: if a step depends on one, define it in the sentence where it is used.

  Finally, close by stating what the procedure cannot do. In particular, I assume it cannot tell me whether the economic base in fact has explanatory primacy over everything else; tell me what it does license me to say about that question, if anything, when I write to an author.
reasoning: |-
  We are designing a screening procedure for submissions that claim economic base explains superstructural change (law, religion, family, politics, culture). The procedure must be executable in 45 minutes by a non-specialist, and must lead to one of: desk reject, revise and resubmit, or forward to specialist. We must preserve essential distinctions and handle common retreats and circularity.

  Essential distinctions to preserve (and which may be dropped as decoration):
  - We must preserve the distinction between a causal claim (A causes B) and a functional claim (B exists because it serves A). Also, the claim that the base rules out alternatives (feasibility) is distinct. These are different and require different evidence.
  - The circularity problem: when the base is defined by property relations (which are legal) and then used to explain law, that's circular. We need to see if the paper avoids this.

  Distractions we can ignore for our purpose:
  - The difference between productive forces and relations of production: unless the paper hinges on it, we don't need to split hairs. We can treat "economic base" as a single concept for screening.
  - "Determination in the last instance": this is too vague for our screening. We require the paper to show a concrete mechanism or evidence for the claim, not just invoke this.

  Common retreats and their evidential standards:
  1. Retreat: The economy ruled out the alternatives (feasibility).
     - Standard: Must show that the alternatives were considered and rejected for economic reasons, or that the economic conditions made the alternative unworkable. Evidence against: if an alternative was tried and failed due to non-economic reasons, or if the same economic conditions coexisted with different superstructures elsewhere.

  2. Retreat: The institution had to fit the base (functional necessity).
     - Standard: Must show that the institution was designed or adapted to serve the base, and that without this fit, it would not have persisted. Evidence against: if the institution also existed in very different economic conditions, or if it was imposed by non-economic forces and persisted despite not fitting.

  3. Retreat: The institution persisted because it served the base (functional persistence).
     - Standard: Must show that when the institution stopped serving the base, it changed or collapsed, and that the service to the base was the reason for persistence. Evidence against: if the institution persisted even when it no longer served the base, or if it changed for non-economic reasons.

  Circularity problem: If the base is defined by property relations (legal categories) and then used to explain law, we have circularity. The paper must:
     - Either define the base independently of the legal categories (e.g., by technology, trade volumes, class structure without legal terms) OR
     - Show that the legal categories in the base are taken from an earlier period and are not the same as the ones being explained.

  Now, the procedure:

  Step 0: (Pre-screening) Is the paper making a base-superstructure claim? If not, handle as non-base-superstructure. We assume it is.

  Step 1: Identify the claim type (5 minutes)
     - Question: What is the exact nature of the explanatory claim? Is it:
          (a) A direct causal claim (change in base caused change in superstructure)?
          (b) A functional claim (the superstructure exists because it serves the base)?
          (c) A feasibility claim (the base made the superstructure the only feasible option)?
          (d) A claim of primacy (the base is the primary factor, among others)?
          (e) A correspondence claim (base and superstructure correspond, without specifying direction of causality)?

     - Sufficient answer: The paper must clearly state the claim and use it consistently. If it mixes types without justification, that's a problem.
     - If the claim is vague (e.g., only "determination in the last instance"), ask for clarification in revision or reject if too vague.
     - If the claim is (a), (b), or (c), proceed. If (d) or (e), note that these are weaker and require showing how the base is primary or how correspondence is established.

  Step 2: Check for circularity (5 minutes)
     - Question: How is the economic base defined? Does the definition rely on legal, religious, or other superstructural categories that are part of the explanandum?
     - Sufficient answer: The base must be defined independently of the superstructural element being explained. If the base is defined by property relations (which are legal) and the explanandum is a change in property law, that's circular. The paper must either:
          (a) Define the base without using the same legal categories (e.g., by material conditions, technology, class conflict defined non-legally) OR
          (b) Show that the base definition uses legal categories from a prior period that are not changing in the explanandum.
     - If circular, desk reject or require major revision.

  Step 3: Evaluate the mechanism (10 minutes)
     - Question: Does the paper propose a concrete mechanism by which the base affects the superstructure? (e.g., class conflict, technological determinism, functional adaptation, etc.)
     - Sufficient answer: The mechanism must be clearly described and must be non-tautological. It should be a process that can be observed or inferred from evidence.
     - If the paper does not specify a mechanism, but only asserts a correlation or a functional relation, then it is weak. This may lead to a revise (to add mechanism) or reject if the paper is entirely mechanistic.
     - Note: If the mechanism requires historical context that the editor cannot judge, mark for specialist.

  Step 4: Check the evidence for the claim type (15 minutes, but may require specialist)
     We break down by claim type:

     - For causal claims (a):
          * Question: Does the paper show temporal precedence (base change before superstructure change)? And are there controls for other factors?
          * Sufficient: Evidence of timing and at least an attempt to rule out alternative causes. If the paper uses a case study, it should show that the base change happened and then the superstructure followed, and that other events did not cause it.
          * If the evidence is only correlation (e.g., they happened at the same time) without timing or controls, then it is insufficient. This may be a revise or reject.

     - For functional claims (b) or (c):
          * Question: Does the paper show that the superstructure serves the base? And for (b) that it was created for that purpose, or for (c) that alternatives were tried and failed?
          * Sufficient: For (b): evidence of intentional design or adaptation to serve the base. For (c): evidence that alternatives were considered and rejected because they were economically unfeasible, or that the same base conditions elsewhere led to the same superstructure.
          * Also, for both, the paper must address: could the superstructure have been caused by something else? And if the function is argued to be the cause, then we need evidence that without this function, the superstructure would not have existed or persisted.

     - For feasibility claims (c) specifically, we require:
          * Evidence that the economic base constrained the options (e.g., documents showing that actors considered alternatives and rejected them due to economic reasons, or that in similar economic conditions the same superstructure appears).

     - For claims of primacy (d) or correspondence (e):
          * These are harder. We require the paper to show that the base is the most important factor (by comparing with others) or that the correspondence holds across cases. This usually requires comparative evidence. If the paper does not have that, then it is weak.

     - If the evidence is entirely about the superstructure serving the base (e.g., mill owners funding religion) but without showing that the base caused the superstructure (maybe religion was already there and just got funded), then it's insufficient for a causal claim.

     - Note: This step may require historical knowledge to judge the evidence. If so, note for specialist.

  Step 5: Handle retreats (as part of Step 4, but we check if the paper retreats to a weaker claim when challenged)
     - If the paper starts with a causal claim but then retreats to a functional or feasibility claim, we evaluate by the standard of the retreat claim. But we note this as a weakness and require the paper to be clear.

  Step 6: Overall judgment (5 minutes)
     - If the paper passes Steps 1-5 without major issues, forward to specialist.
     - If there is a fixable issue (e.g., circularity, unclear claim, lack of mechanism, weak evidence) that could be addressed without new research, then revise and resubmit.
     - If the paper has fatal flaws (circularity, no independent base, no evidence, claim too vague) then desk reject.

  Now, mark judgment calls:
     - Step 1 (claim type) is a judgment call: sometimes papers are ambiguous. We try to be charitable but clear.
     - Step 4 (evidence evaluation) is the most likely to require specialist knowledge. We flag when we cannot judge and hand off.

  Systematic misfires:
     - Good papers that are highly theoretical or comparative might be stalled because they require deep historical knowledge to evaluate evidence. We hand off to specialist.
     - Bad papers that have a clear causal claim with good timing but no controls for other factors might be passed to specialist when they should be rejected (if the specialist knows of other causes). But we try to catch that in Step 4 by requiring at least an attempt to rule out alternatives.

  Run the procedure on the three submissions:

  Submission 1: National codification of commercial law in the 1870s explained by railway finance expansion.

  Step 1: Claim type is causal (railway expansion caused codification).
  Step 2: Base is railway finance (economic, independent of commercial law). No circularity.
  Step 3: Mechanism? Implied: the complexity of railway finance required a unified commercial law. The paper shows drafters' correspondence dominated by economic arguments. This is a mechanism (actors responding to economic needs).
  Step 4: Evidence: timing (boom in bonds before passage) and drafters' concerns. Also, the paper shows the date of passage tracks the boom. But does it rule out other causes? The editor cannot judge if there were other factors (e.g., political unification). This requires specialist (historian) knowledge.
  Step 5: No retreat.
  Step 6: Forward to specialist. The referee should ask: Please address alternative explanations, such as political centralization or the influence of other industries. Also, clarify the mechanism: was it the need for standardization that arose from the railways, or was it the influence of railway financiers on the drafting process?

  Submission 2: Pietist revival spread in textile region because it suited mill owners.

  Step 1: Claim type: functional (the doctrine suited mill owners, so it spread).
  Step 2: Base: textile mills (economic, independent). No circularity.
  Step 3: Mechanism: mill owners funded the congregations because the doctrine served their interests. But the paper does not show how the doctrine spread because of this funding. It only shows funding and co-location.
  Step 4: Evidence: 
     - Functional: the doctrine of thrift and discipline suits mill owners. But does it show that without this fit, the revival would not have spread? No. 
     - Also, the paper does not show that the revival was caused by the mill owners' funding. It shows correlation (doctrine took hold where mills were) but not causation. Maybe the revival started independently and was then funded? 
     - Evidence against: if the same doctrine spread in non-mill areas, that would be against. But the paper offers nothing beyond funding and location.
     - This is weak. The paper does not establish causation or function beyond correlation.
  Step 5: The claim is functional but the evidence is only correlation. It does not meet the standard for functional claims (no evidence of design or adaptation for the purpose, or of necessity).
  Step 6: Desk reject. Reason: The paper does not establish a causal or functional link beyond correlation. It does not show that the mill owners caused the spread of the revival, only that they funded it and it was located in mill areas. This could be revised by showing, for example, that the revival started in the mills, or that without mill owner support it died out, or by comparing with non-mill areas.

  Submission 3: Autonomous self as product of market exchange.

  Step 1: Claim type: causal? The paper says the modern ideal is a product of market exchange. It also proposes a mechanism (contractual standing extended to non-kin) and tests against a rival (state-building). So it's causal with a mechanism.
  Step 2: Base: generalized market exchange. Defined independently? The paper specifies the base independently of the ideological evidence. So no circularity.
  Step 3: Mechanism: contractual standing extended to non-kin. This is concrete.
  Step 4: Evidence: The paper tests against a rival. This is good. But the nature of the evidence is not clear from the description. Since the editor is inclined to see it as an essay, we must check: does it have empirical evidence? The description says it tests the mechanism against a rival. If it does so with historical evidence, then it's a study. If it's only theoretical, then it might be an essay.
     - The editor must check: is there historical evidence? The problem says: "tests that mechanism against a rival account". So it must have some evidence. But we are told the editor is not a specialist and the paper is long, so we might hand off to a specialist to evaluate the evidence.
     - However, the editor is not a specialist and might not be able to judge the evidence. So we hand off.
  Step 5: No retreat.
  Step 6: Forward to specialist. The referee should evaluate the evidence for the mechanism and the test against the rival. Also, check if the base (market exchange) is measured independently and if the test is fair.

  What the procedure cannot do:
     - It cannot settle the grand question of whether the economic base has primacy over everything else. It only evaluates whether a specific paper makes a well-supported case for a specific claim.
     - When writing to an author, you can say: "The paper must clearly specify the nature of the causal claim and provide evidence appropriate to that claim, avoiding circularity and specifying a mechanism. The screening procedure checks for these elements and does not prejudge the ultimate truth of historical materialism."

  Final Procedure Outline:

  1. Identify claim type (5 min). Must be clear and consistent.
  2. Check circularity (5 min). Base must be defined independently.
  3. Evaluate mechanism (10 min). Must be non-tautological and concrete.
  4. Evaluate evidence for claim type (15 min). Requires:
     - For causal: timing and control for alternatives.
     - For functional: evidence of design or necessity, and of the function being the cause.
     - For feasibility: evidence of constraints and consideration of alternatives.
     - If historical knowledge needed, hand off.
  5. Overall judgment (5 min): 
     - If no flaws, forward to specialist.
     - If fixable flaws, revise and resubmit.
     - If fatal (circularity, no independent base, no evidence, vague claim), desk reject.

  Note: Steps 3 and 4 are judgment calls and may require specialist input. The procedure might pass some weak papers that have good structure but bad evidence (which the specialist will catch) and reject some good papers that are complex and require specialist to see the merit.
answer: |-
  Below is a step-by-step screening procedure designed for your constraints. It focuses on **argument structure** (testable by a non-specialist) and **delegates substantive historical checks to referees**. The procedure is gate-based: each question must be answered sufficiently to proceed. If not, it terminates in a recommendation.  

  ### Core Distinctions to Preserve  
  1. **Causal vs. functional vs. feasibility claims**:  
     - **Causal**: The base *directly produces* the superstructural change (e.g., "railways caused legal reform").  
     - **Functional**: The superstructure *serves* the base (e.g., "religion persisted because it helped mills").  
     - **Feasibility**: The base *eliminated alternatives* (e.g., "no other law was economically possible").  
     - *Why preserve?* Each requires different evidence. Confusing them hides weaknesses.  
  2. **Circularity**: When the "base" is defined using the very superstructure it explains (e.g., "property law changed because property relations changed," where "relations" depend on law).  
     - *Why preserve?* This invalidates the explanation.  

  ### Distractions to Ignore  
  - **Productive forces vs. relations of production**: Irrelevant unless the paper hinges on it (rare). Drop as decoration.  
  - **Base-superstructure correspondence vs. primacy**: Primacy claims (base dominates) and correspondence claims (base and superstructure align) collapse into the three core claims above. Ignore the distinction.  
  - **"Last instance" qualifications**: Vague and untestable in limited time. Ignore.  

  ---

  ### Screening Procedure (Ordered Steps)  
  **Time allocation**: Strictly enforce 45 minutes. Use a timer.  
  **Outcomes**:  
  - ✅ → Proceed to next step.  
  - ❌ → Terminate with recommendation.  
  - ⚠️ → Delegate to specialist (if historical knowledge needed).  

  #### Step 1: **Identify Core Claim** (5 min)  
  - **Question**: What *type* of claim does the paper make? Is it causal (A caused B), functional (B exists because it serves A), or feasibility (A made B the only option)?  
  - **Sufficient answer**: Explicit statement (e.g., "The railway boom *caused* legal reform"). If mixed, ask author to clarify in revision.  
  - **Insufficient**: Vague phrasing (e.g., "The base determined the superstructure").  
  - **Gate**: ❌ Desk reject if claim is undefined or conflates types without justification.  

  #### Step 2: **Check for Circularity** (5 min)  
  - **Question**: Is the "economic base" defined *independently* of the superstructure it explains?  
  - **Sufficient**: Base is defined without superstructural terms (e.g., "railway bond volumes" for law; "textile output" for religion).  
  - **Insufficient**: Base relies on superstructure (e.g., "property relations" for law; "employer authority" for religion).  
  - **Gate**:  
    - ✅ → Proceed if independent.  
    - ❌ → Desk reject if circular (e.g., base uses legal terms to explain law).  
    - ⚠️ → If unclear, delegate to specialist.  

  #### Step 3: **Proposed Mechanism** (10 min)  
  - **Question**: Does the paper describe a *concrete mechanism* linking base to superstructure? (e.g., "Railway financiers lobbied for laws" for causation; "Mill owners funded churches to instill discipline" for function).  
  - **Sufficient**: Mechanism is testable and not tautological (e.g., not "laws changed because the economy required it").  
  - **Insufficient**: Mechanism is implied but not stated, or is purely theoretical.  
  - **Gate**:  
    - ✅ → Proceed if mechanism is clear.  
    - ❌ → Desk reject if absent or tautological (e.g., "Religion spread because it fit the base").  
    - ⚠️ → Delegate to specialist if mechanism requires historical context to evaluate (e.g., "Was lobbying the primary driver?").  

  #### Step 4: **Evidence Type and Quality** (15 min)  
  - **Ask**: Does the evidence match the claim type?  
    - **Causal claim**: Requires temporal precedence (base change before superstructure) and control for alternatives (e.g., "Did other factors cause this?").  
    - **Functional claim**: Requires showing the superstructure *would not persist* without serving the base (e.g., "Did religion collapse where mills declined?").  
    - **Feasibility claim**: Requires evidence that alternatives were *considered and rejected* due to economics (e.g., "Were other laws proposed but deemed unaffordable?").  
  - **Sufficient**: Evidence directly tests the mechanism and claim type.  
  - **Insufficient**: Only shows correlation (e.g., "Religion and mills coexisted") or assumes function/feasibility without proof.  
  - **Gate**:  
    - ✅ → Proceed if evidence is appropriate and robust.  
    - ❌ → Desk reject if evidence is irrelevant to claim type (e.g., correlation for causation).  
    - ⚠️ → Delegate to specialist if evidence requires domain knowledge (e.g., "Are the archives comprehensive?").  

  #### Step 5: **Handle Retreats** (Integrated into Step 4)  
  - **If author retreats from causation to function/feasibility**: Demand evidence for the *retreated claim*:  
    - **Functional retreat**: Must show the institution *collapsed or changed* when it stopped serving the base. *Evidence against*: It persisted despite not serving the base.  
    - **Feasibility retreat**: Must show alternatives were *actively ruled out* for economic reasons. *Evidence against*: Viable alternatives existed but were ignored for non-economic reasons.  
  - **Gate**: Apply same standards as Step 4.  

  #### Step 6: **Overall Recommendation** (5 min)  
  - **Rules**:  
    - ✅ **Forward to specialist**: All steps cleared, no ❌ or ⚠️.  
    - ⚠️ **Revise and resubmit**: Fixable issues (e.g., claim unclear in Step 1; mechanism vague in Step 3).  
    - ❌ **Desk reject**: Fatal flaws (e.g., circularity in Step 2; no evidence for claim type in Step 4).  

  ---

  ### Judgment Calls and Systematic Misfires  
  - **Judgment calls**:  
    - Step 1 (claim type): Ambiguous claims may be misinterpreted.  
    - Step 4 (evidence quality): Non-specialists may miss gaps in historical evidence.  
  - **Misfires**:  
    - **Good papers stalled**: Nuanced claims (e.g., multi-causal arguments) may be rejected for lacking "pure" causation.  
    - **Bad papers waved through**: Papers with strong timing evidence (Step 4) but unexamined alternatives may pass until a specialist spots omissions.  

  ---

  ### Application to Submissions  
  **Submission 1: Railway finance → Commercial law codification**  
  - Step 1: ✅ Causal claim (railways caused law).  
  - Step 2: ✅ Base defined as "railway bond boom" (independent of law).  
  - Step 3: ✅ Mechanism: "Drafters pressured by economic actors."  
  - Step 4: ⚠️ Evidence shows timing and actor intent, but no control for alternatives (e.g., political reforms). **Delegate to specialist**.  
  - **Outcome**: Forward to specialist.  
  - **Referee report**: "Rule out non-economic factors (e.g., nationalism) and clarify if railways were necessary/sufficient."  

  **Submission 2: Mill owners → Pietist revival**  
  - Step 1: ❌ Claim is functional ("doctrine suited owners") but conflated with causation.  
  - Step 2: ✅ Base defined as "mill locations" (independent).  
  - Step 3: ❌ Mechanism implied but not tested (funding ≠ causation).  
  - Step 4: ❌ Evidence only shows correlation (location/funding), no proof of function (e.g., did revival collapse without mills?).  
  - **Outcome**: Desk reject.  
  - **Referee report (if revised)**: "Show functional link: e.g., compare areas where mills declined, or prove doctrine would not have spread without owner support."  

  **Submission 3: Market exchange → Autonomous self**  
  - Step 1: ✅ Causal claim (markets caused ideology).  
  - Step 2: ✅ Base defined as "market exchange" (independent of ideology).  
  - Step 3: ✅ Mechanism: "Contractual standing extended to non-kin."  
  - Step 4: ⚠️ Tests against rival (state-building), but mechanism requires historical validation. **Delegate to specialist**.  
  - **Outcome**: Forward to specialist.  
  - **Referee report**: "Assess if evidence for contractual mechanism outweighs rival. Check for circularity in 'autonomous self' definition."  

  ---

  ### What the Procedure Cannot Do  
  - **Cannot determine if the economic base *always* explains the superstructure**. It only assesses if **this paper's claim** is well-supported.  
  - **When writing to authors**: State: "This assessment evaluates whether your argument meets basic standards of clarity, evidence, and logic for claims about economic determinism. It does not assess the ultimate validity of historical materialism."  

  **Procedure Summary**:  
  1. Claim type? → Reject if vague.  
  2. Circularity? → Reject if present.  
  3. Mechanism? → Reject if absent.  
  4. Evidence matches claim? → Reject if not, delegate if specialized.  
  5. Revise or delegate based on gaps.
