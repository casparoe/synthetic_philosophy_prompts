prompt: |-
  I chair the zoning variance board of a mid-sized city, and I have been trying for some time to put a name on a pattern I keep finding in our own files and then recognizing elsewhere. I would rather describe it carefully and let you tell me whether there is an established concept for it than guess at a term myself.

  The clearest instance is our own. The code sets a minimum side setback of eight feet. In one year we grant a variance for a porch at seven feet four, on the grounds of an unusual lot shape. The following year an applicant asks for a detached garage at six feet ten, and what carries the board is that we have already allowed seven feet four in comparable circumstances, and that a difference of six inches is not a meaningful one. A year after that comes a shed at six feet, then a shed with an attached covered walkway, which functions as a structure at five feet. Taken one at a time, I would still defend every decision in that sequence: the increments were small, the reasoning was the reasoning we had accepted the year before, and refusing any single application after granting the previous one would have looked arbitrary, even unfair, to the people in the room. But if you compare the file as it now stands to the code as written, we are administering something like a five-foot standard that nobody ever proposed, that no member of this board would have described as our standard when we joined, and that no meeting minutes anywhere record us adopting.

  I have since seen the same shape twice outside zoning. A friend who does trust and safety work at a platform describes enforcement teams that are trained on examples of previously removed content, so each incoming cohort calibrates itself against the last cohort's decisions rather than against the published policy; the operative category ends up considerably wider than the text, with no revision ever announced. And an academic department I know has watched its sense of what a competitive hire looks like slide a little in every search, each committee measuring candidates against the previous hire rather than against any written description of the job.

  What I am after is the following, and I should say at the outset that a bare label would not be much use to me.

  First: does this configuration have an established name, in philosophy or in any neighbouring literature — law, organizational sociology, the measurement and assessment field, wherever it may live? If there are several partial terms, I would like to know each of them and what part of the phenomenon it actually covers.

  Second: how does it differ from the things I would reach for instinctively? I can already hear that it resembles a slippery slope, but nobody here predicted or feared a descent and there was no argument of the form "if we allow this we will end up allowing that," so that does not seem right. It also resembles the heap puzzle, in that the trouble lives in small steps, but our steps do not turn on the extension of a vague word so much as on which earlier case we are comparing to. And it is clearly not the same as moving the goalposts, which I take to be deliberate and adversarial. I would like the differences stated sharply rather than by way of a list of near neighbours.

  Third, and this is the part I most want pressed on: in each of my cases every individual decision preserved a kind of local consistency — this application is like the one we granted last year — and it is the record as a whole that has become inconsistent with the rule. Is there a recognized account of that structure, of a standard that is silently defined by the most recent decision rather than by the original rule? Related to it: does the diagnosis depend on the vagueness of words like unusual and comparable, or would the same erosion occur under a perfectly sharp rule administered by a procedure that only ever looks at the immediately preceding case? I genuinely cannot tell which of those two is the source of the problem, and I suspect they have been distinguished somewhere.

  Fourth: I want the edges. There is a version of this that looks like a virtue — incremental development through precedent, where each decision is bound by the last and the resulting body of practice is more refined than any code could be drafted in advance. Why is the same structure a pathology in my board and an achievement there? Tell me what would have to change for my case to be the good kind, and give me a case that sits right on the boundary and could be called either way.

  Finally, if no single term covers the whole thing, propose one, define it so that it excludes the near neighbours above, and tell me what would count as a clear instance of it and what would not.
reasoning: |-
  Okay, the user chairs a zoning variance board and has noticed a pattern where decisions gradually deviate from the written code over time through incremental changes. They've also seen this in content moderation and academic hiring. They want to know if there's a name for this phenomenon, how it differs from similar concepts like slippery slope or heap paradox, and why it's problematic in their case but precedent can be good in common law.

  First, I need to recall if there's an established term for this. I remember that in organizational theory, this sounds like "procedural drift" or "institutional drift." In legal contexts, "common law creeping" might apply, but that's usually positive. The key here is the unintentional shift without formal acknowledgment. The term "rule erosion" comes to mind, but is that formal? Maybe "normalization of deviance" from Diane Vaughan's work on the Challenger disaster. That fits because each small deviation normalizes the next, leading to a new norm.

  Next, differentiating from slippery slope and heap paradox. Slippery slope is a predictive argument, while here it's retrospective, case-by-case comparison. Heap paradox deals with vague predicates, but in zoning, the issue is precedent-based decisions, not vagueness. Moving the goalposts is intentional, whereas this is unintentional. Need to highlight that the mechanism is precedent-based incrementalism without anchoring to the original rule.

  Why is this a problem here but precedent is good in common law? In common law, there's systematic review and appeals that reference the original principles. Here, decisions only look at the immediate prior case, not the rule's intent. The lack of periodic review and anchoring causes drift. To turn this into a virtuous process, they'd need mechanisms to regularly compare decisions against the original standard and document rationales.

  The user also asked about the role of vagueness. Even with a sharp rule, if each decision references only the last case, the drift could still happen. For example, a strict 8-foot rule might be bent once to 7.4 due to "unusual shape," then subsequent cases use that as the new baseline. Vagueness accelerates it, but the core issue is the precedent chain without anchoring.

  For boundary cases, consider a board that occasionally audits past decisions against the original rule, adjusting if deviations are found. That's virtuous. Without audits, it's pathological. A clear instance would be a series of variances each justified by the last, ending up far from the rule without any conscious change.

  Finally, if no single term exists, proposing "precedent creep" or "anchoring drift." But "normalization of deviance" might be best, as it captures the gradual acceptance of deviations. Defining it as incremental deviation from a standard through case-by-case comparisons, leading to a new norm without formal change. Excludes slippery slope (predictive) and moving goalposts (intentional).
answer: |-
  This phenomenon is well-recognized and has distinct names across disciplines. Your analysis is remarkably precise, so let's address each part systematically:

  ### 1. **Established Names**
     - **Organizational Theory/Public Administration**: **"Procedural Drift"** or **"Institutional Decay"** (Perrow, Vaughan). Focuses on rule erosion through incremental operational decisions.
     - **Legal Theory**: **"Common Law Creeping"** (implied in Hart/Dworkin debates) or **"Rule Erosion via Distinguishing"**. Highlights how precedent-based systems deviate from codified rules.
     - **Safety/Sociology**: **"Normalization of Deviance"** (Diane Vaughan, *Challenger* disaster analysis). Most fitting for your cases: *the gradual acceptance of non-compliant practices as "normal" through repeated small deviations, each justified by the previous exception.*
     - **Cognitive Science**: **"Anchoring Bias in Sequential Decision-Making"**. Emphasizes psychological reliance on recent precedents rather than fixed standards.

  These are complementary: **Normalization of Deviance** best captures the *mechanism*, while **Procedural Drift** describes the *outcome*.

  ### 2. **Sharp Differentiation from Near Neighbours**
     - **Slippery Slope**: 
       - *Your case*: Decisions are **retrospective** ("like last year's case"), not predictive. No logical chain or fear of future consequences drives changes.
       - *Difference*: Slippery slope is a *forward-looking rhetorical device*; your pattern is a *backward-looking operational process*.
     - **Sorites/Heap Paradox**:
       - *Your case*: Not driven by vague predicates (e.g., "how small is too small?"). Instead, decisions pivot on **case similarity** ("comparable to the 7'4" variance").
       - *Difference*: Heap paradox concerns *semantic vagueness*; your issue concerns *precedential reasoning without anchoring*.
     - **Moving Goalposts**:
       - *Your case*: Changes are **unintended and non-strategic**. No adversary manipulates standards; the board genuinely believes each decision is consistent.
       - *Difference*: Goalpost-moving implies *agency and intent*; your pattern emerges from *systemic procedural gaps*.

  ### 3. **Structure and Diagnosis**
     - **Core Mechanism**: You've identified it: **Self-referential precedent**. The standard becomes **recursively defined**—each decision references only the immediately prior case, not the original rule. This creates a **Markovian decision chain** where the "rule" at step *n* is whatever was done at step *n-1*.
     - **Role of Vagueness**: 
       - Vagueness (e.g., "unusual lot shape") *accelerates* drift but isn't necessary. 
       - **Proof via sharp rule**: Imagine a strict 8' setback with *no exceptions*. If a board once grants a 7'4" variance due to a measurement error (never corrected), and subsequent boards reference only prior variances, they could drift to 5' even with a "sharp" rule. The failure is **procedural** (no re-anchoring to the code), not semantic.

  ### 4. **Boundary: Pathological vs. Virtuous**
     - **Why Pathological Here?** 
       - **No error-correction**: Decisions aren't periodically audited against the original rule.
       - **No synthesis**: Precedents accumulate but aren't synthesized into a coherent new standard (e.g., via published guidelines).
       - **No intent**: The drift serves no purpose (e.g., adapting to new urban realities).
     - **Virtuous Precedent (Common Law Comparison)**:
       - **Re-anchoring**: Judges regularly cite foundational statutes/constitutions, not just recent cases.
       - **Synthesis**: Landmark cases *explicitly restate* doctrines, halting drift.
       - **Transparency**: Doctrinal shifts are debated and recorded.
     - **Making Your Case Virtuous**: 
       - Implement **annual reviews** comparing variances to the original code.
       - Publish **"Variance Guidelines"** synthesizing precedents into new quasi-rules.
       - Require **dual justification** ("consistent with *both* prior case X *and* code section Y").
     - **Boundary Case**: 
       - *Academic hiring*: If a department documents why each new hire expands "competitiveness" (e.g., "prior candidate brought digital humanities; now we seek AI expertise"), it becomes **adaptive evolution**. Without this, it's drift.

  ### 5. **Unified Term and Definition**
     - **Proposed Term**: **Precedent Creep**  
       - *Definition*: The incremental, unintentional deviation from a codified standard or rule, occurring when decisions reference only immediately prior cases rather than the original authority, resulting in a *de facto* new standard without formal revision.
       - *Clear Instance*: 
         - Your zoning board’s shift from 8' to 5' setbacks via case-by-case comparisons.
         - Content moderation training that references only the last cohort's judgments.
       - *Exclusions*: 
         - **Not slippery slope**: No predictive logic or fear of consequences.
         - **Not goalpost-moving**: No intentionality or adversarial context.
         - **Not heap paradox**: Driven by precedent, not semantic vagueness.

  ### Why This Matters for Your Board
  Your cases reveal a **procedural design flaw**: Decisions lack **re-anchoring mechanisms**. Fix this by:
  1. Requiring **explicit citation of the original code** in every variance decision.
  2. Scheduling **biannual audits** comparing granted variances against the code.
  3. Publishing **digests of precedents** with annotations linking them to the rule’s purpose.

  Precedent isn’t inherently bad—it’s the *isolation from foundational rules* that corrupts the process. The term "Precedent Creep" captures this unique blend of institutional memory and institutional amnesia.
