prompt: |-
  I run a tiny political-theory podcast — couple hundred regulars, no budget, I record in a closet — and next month's guest is a theorist who's spent a decade defending a pretty radical answer to the boundary problem, i.e. the question of who belongs in the demos. Her position, roughly: the franchise shouldn't be all-or-nothing citizenship but a continuous voting weight proportional to how much a given collective decision affects your interests; the demos is decision-relative, so it dissolves and reforms around each issue (a climate vote includes affected foreigners, a zoning vote includes commuters and sixteen-year-olds, a foreign-policy vote excludes both); and she thinks this dissolves the "who decides who decides" regress, because you don't need a prior demos to fix the boundary, you need a competent measurer — on her account a standing independent commission that models ex ante affectedness and certifies the electorate for each decision. She also argues the all-subjected principle is just a special case of hers, since subjection to law is one channel of affectedness among many.

  Write me nine to eleven questions for her. Nothing generic — no "what drew you to this," no "how do you answer your critics." I want questions she can't get out of by restating the view, and I want at least one each on:

  - how you're supposed to get a single scalar out of "affectedness" at all, given the baseline problem (affected compared to what?) and the fact that the estimate depends on the preferences of the people being measured;
  - the regress, which I suspect shes relocated rather than removed — who constitutes the commission, and does the commission's own appointment count as a decision that affects people, in which case who gets weight there;
  - endogeneity: if weight tracks affectedness, what stops people from becoming affected on purpose, or from bargaining today to shape the electorate for decisions down the line;
  - a decision with hugely diffuse tiny effects versus one with concentrated catastrophic effects, where her arithmetic hands the win to the diffuse side;
  - whether the franchise is an interest-tracking device at all rather than a matter of standing, and what she says to the resident non-citizen who gets full weight on policing and zero on everything else.

  For each one give me a follow-up keyed to the answer she's actually most likely to give, not to a strawman — she's quick, and she has a canned move where she concedes the measurement is rough and then says any monotone proxy beats the binary franchise. Where a question needs a concrete case to bite, put the case in the question. Then finish by telling me which two she'll find hardest and why.
reasoning: |-
  Okay, the user runs a small political theory podcast and needs interview questions for a guest with a radical view on the boundary problem in democracy. The guest proposes that voting weight should be proportional to how much a decision affects a person's interests, with the demos changing for each issue. The user wants specific, non-generic questions that push the guest beyond restating her theory. Key areas to cover include: measuring affectedness, regress problems with the commission, endogeneity, diffuse vs. concentrated effects, and whether the franchise is about interest-tracking or standing.

  First, the user mentioned several specific challenges. The baseline problem for affectedness: how do you measure "affected" without a baseline? The guest might say any monotonic proxy is better than binary, but I need to press on incommensurable impacts. For the regress, the commission itself needs constitution, which creates a loop. Who decides the commission's composition? The guest might say it's a one-time setup, but that seems arbitrary.

  Endogeneity is another issue. People might manipulate their affectedness to gain voting weight. For example, moving near a pollution source to vote against regulation. How does the system prevent that? The guest might argue that rational actors wouldn't harm themselves, but what about strategic actions where the benefit of voting power outweighs the harm?

  Diffuse vs. concentrated effects: a policy affecting millions slightly vs. a few catastrophically. Under her system, the diffuse group could outvote the severely affected minority. The guest might say catastrophic harms have higher weight per person, but how does the commission quantify that? Is a 1% risk of death equivalent to a 10% pay cut? Need to question the aggregation method.

  Standing vs. interest-tracking: a non-citizen gets full weight on local policing but none on other issues. Does that undermine their political standing? The guest might say standing is decision-specific, but does that lead to instability in rights?

  For follow-ups, anticipate her responses. She often concedes measurement is rough but claims any monotonic proxy beats binary. Push back with cases where preferences conflict or harms are qualitative. For example, how to compare environmental impact to economic loss when affected parties value them differently.

  The hardest questions might be the regress problem with the commission and diffuse vs. concentrated effects. The commission's legitimacy is foundational, and avoiding circularity is tough. For diffuse effects, justifying the minority's catastrophic loss through aggregation challenges moral intuitions about minority rights.
answer: |-
  Here are 10 targeted questions with concrete cases and anticipated-follow-ups, designed to push beyond restatement:

  1.  **On Scalar Affectedness & Baselines:** "Take a proposed municipal ban on gas leaf blowers. Your commission must assign voting weights. Resident A: Runs a landscaping business relying on gas blowers (high financial stake). Resident B: Suffers severe asthma triggered by particulate matter (high health stake). Commuter C: Passes through weekly, dislikes noise (minor nuisance). How does the commission *quantitatively compare* the intensity of A's financial loss against B's health risk and C's annoyance to produce a single 'affectedness' scalar? Specifically, what baseline defines B's 'harm' – absence of blowers currently used, absence of *all* blowers, or an ideal air quality standard?"
      *   *Anticipated Response:* "We use best-available health impact studies for B (e.g., DALYs lost), market analysis for A (income loss), noise pollution metrics for C, calibrated to severity scales. It's imperfect, but directionally correct."
      *   *Follow-Up:* "But doesn't that assume *commensurability*? If B values avoiding an asthma attack *far more intensely* per unit of measurable harm than A values a dollar lost (or C values quiet), and these valuations differ between individuals, doesn't your scalar ignore preference intensity and rely on an expert's *imposed* equivalence between health, money, and annoyance?"

  2.  **On the Regress (Commission Constitution):** "The commission's composition is foundational. Who gets voting weight in the *initial* decision appointing/structuring this commission? If you say 'everyone potentially affected by *all future decisions* the commission might oversee,' that seems like the entire global population – an impossible electorate. If it's constituted by an existing state apparatus, doesn't that just relocate the boundary problem to the state defining *that* initial demos, undermining the claim to dissolve the regress?"
      *   *Anticipated Response:* "It's established via a unique constitutional moment or international treaty, using broad provisional criteria like territorial presence, aiming for maximal inclusion, accepting pragmatic constraints initially."
      *   *Follow-Up:* "Doesn't this 'provisional' moment effectively *become* the prior demos you sought to avoid? And if the commission later rules on the validity of its *own* structure or appointment (e.g., a challenge alleging under-representation), who gets weight in *that* meta-decision? Isn't the regress nested *within* the commission's authority?"

  3.  **On Endogeneity - Strategic Affectedness:** "Consider a proposed high-speed rail line. Landowners along Potential Route A realize that if the route is chosen, they'll be 'highly affected' (eminent domain) and get high voting weight *on that specific route decision*. Couldn't they collectively lobby *today* to ensure Route A remains the *only* viable option studied, thereby manufacturing their future 'affectedness' and guaranteeing outsized influence on the final choice? How does the system prevent this kind of upstream agenda-setting to capture voting weight?"
      *   *Anticipated Response:* "The commission defines the decision's scope and alternatives ex-ante. Gaming requires predicting the commission's modeling, which is complex and uncertain. Rational actors won't invite severe harm just for votes."
      *   *Follow-Up:* "But what if the 'harm' is manageable (e.g., predictable compensation) but the voting power over a massive project is highly valuable? Couldn't groups bargain *now* to position themselves as 'maximally affected' on future high-stakes decisions they care about, turning affectedness into a political resource?"

  4.  **On Endogeneity - Shaping Future Electorates:** "Two groups negotiate a trade deal today. Group Alpha gets a concession but knows it will make them highly vulnerable to future Beta policy changes. Group Beta gets concessions but knows future decisions will heavily affect Gamma, currently uninvolved. Couldn't they strike a bargain: Alpha accepts less now in exchange for Beta supporting rules ensuring *low* voting weight for Gamma in those future decisions? Doesn't this allow current powerful actors to strategically *diminish* the future voting power of those their decisions will harm?"
      *   *Anticipated Response:* "The commission's independence and mandate to model *actual future affectedness* based on the policy's real-world impacts, not negotiated agreements, should prevent this. Affectedness is objective."
      *   *Follow-Up:* "But the commission's *model* relies on data and assumptions. If the trade deal *itself* legally or structurally alters the channels of impact (e.g., making Gamma's economy formally dependent), doesn't that *objectively* lower Gamma's future affectedness by the commission's own metrics? Isn't the system vulnerable to having its inputs gamed by prior decisions?"

  5.  **On Diffuse vs. Concentrated Catastrophe:** "A city votes on building a flood barrier protecting 10,000 residents from a 1% annual catastrophic flood risk. Funding requires a tiny ($10/year) tax on 10 million national residents. Your arithmetic: 10 million * tiny harm >> 10,000 * large harm reduction. The diffuse majority outvotes the concentrated minority facing ruin. Isn't this a feature of your system that sacrifices vital protection for a few to avoid minuscule costs for many, precisely when stakes are highest for the few?"
      *   *Anticipated Response:* "The commission weights *severity*. Preventing catastrophic loss per person gets vastly higher weight than a tiny financial cost. The minority's aggregate affectedness likely wins."
      *   *Follow-Up:* "How is 'catastrophic loss' quantified for aggregation? If it's based on actuarial value (1% * loss), it *is* small per taxpayer. If it's based on the *nature* of the risk (existential threat), how do you avoid subjective valuation? Doesn't the need to collapse it into a scalar for aggregation inevitably risk undervaluing concentrated catastrophe against diffuse cost?"

  6.  **On Standing vs. Interest-Tracking (The Non-Citizen):** "Maria is a long-term resident non-citizen. Under your system, she gets near-full weight on local policing (highly affected daily) but zero weight on national defense spending (deemed minimally affected). She argues: 'This fragments my political existence. On Monday, I'm a full member deciding on the cops patrolling my street. On Tuesday, I'm a non-entity deciding on wars that might deport me. Political standing isn't just about tracking interests per issue; it's about being a recognized *member* of a continuous body. Doesn't your system render me permanently a partial outsider, denying me the stable recognition citizenship provides?'"
      *   *Anticipated Response:* "Stable recognition is less important than ensuring power aligns with impact. Citizenship grants arbitrary standing on issues where you have no stake. Maria has power precisely where she's impacted."
      *   *Follow-Up:* "But doesn't this transactional, issue-specific standing undermine the sense of collective self-governance and mutual obligation that underpins democracy? If Maria only 'counts' when her interests are directly on the line, doesn't that reduce her relationship with the polity to one of mere interest representation, not shared membership?"

  7.  **On Preference Dependence & Adaptive Preferences:** "The commission models 'affectedness' based partly on predicted impacts. But impact severity often depends on the *preferences* of the affected. A devout person is 'more affected' by a temple demolition than an atheist. Doesn't this mean the commission must *measure and incorporate subjective preferences* to determine voting weights? And if so, what stops groups from strategically *cultivating* intense preferences (or claims thereof) to inflate their voting power?"
      *   *Anticipated Response:* "We focus on reasonably foreseeable, objective interests (shelter, livelihood, health, core freedoms) mitigated by evidence of subjective attachment where central (e.g., established religious practice). We avoid incentivizing performative intensity."
      *   *Follow-Up:* "Who defines 'core freedoms' or 'central' attachment? Isn't this unavoidably normative? And take cultural impacts: Is a community 'more affected' by the loss of a traditional fishing ground if they *currently* value it highly due to tradition, or only if they *depend* on it economically? Doesn't this force the commission to make judgments about which preferences 'count' and how much?"

  8.  **On Dynamic Effects & Time Horizons:** "A policy approves a new chemical. Short-term affectedness is low (minor jobs boost). Long-term affectedness is potentially catastrophic but highly uncertain (environmental damage decades later). How does the commission model the voting weight for future generations or distant populations facing uncertain future harm? Do they get weight proportional to discounted probabilities? Doesn't the inherent uncertainty and discounting systematically underweight diffuse future harms against concentrated present benefits?"
      *   *Anticipated Response:* "We use precautionary principles and best-available long-term models, assigning weight based on expected harm, potentially giving significant weight to proxies for future generations."
      *   *Follow-Up:* "But 'expected harm' relies on probability estimates and discount rates – choices heavily loaded with value judgments. Doesn't this give the commission immense, non-accountable power in deciding *how much* the future counts, fundamentally shaping decisions like climate policy?"

  9.  **On the 'All-Subjected' as a Special Case:** "You claim the all-subjected principle (subject to law) is subsumed under affectedness. But subjection implies a *binding authority relationship* – being under the coercive power of the state. Someone deeply affected by a foreign state's policy (e.g., a farmer ruined by its tariffs) isn't necessarily *subject* to that state's laws. Doesn't collapsing subjection into mere affectedness erase this crucial distinction between being *impacted* by power and being *subject* to it, potentially over-extending the franchise beyond the bounds of political obligation?"
      *   *Anticipated Response:* "Political obligation arises precisely from being impacted by coercive collective decisions. If the foreign state's tariff coercively imposes harm, the farmer has a claim to input on that specific decision, regardless of formal subjection."
      *   *Follow-Up:* "Doesn't this dissolve the concept of distinct political communities altogether? If every coercive impact generates a franchise claim, why have separate states? Isn't there a difference between demanding justification for harm caused *across* communities and claiming a right to *participate in governing* the community causing the harm?"

  10. **On Epistemic Burdens & Democratic Legitimacy:** "The commission's modeling is complex and opaque. When it certifies an electorate for a zoning decision, including commuters and teenagers but excluding some residents, and assigns weights, those excluded or given low weight are told: 'Experts calculated you don't count enough here.' How is this *democratically legitimate* to those denied participation? Isn't the core democratic legitimacy of a decision rooted in the fact that *those bound by it* authorized it, not that experts certified the electorate?"
      *   *Anticipated Response:* "Legitimacy comes from aligning power with impact, which is more just than arbitrary boundaries. Transparency and appeal mechanisms for the commission's models are crucial."
      *   *Follow-Up:* "But doesn't substituting expert certification for prior collective authorization (even if flawed) fundamentally shift democracy from self-rule to a form of interest-representation administered by technocrats? If I'm bound by a law but told I wasn't 'affected enough' to warrant meaningful input according to a model I don't understand or trust, why should I accept it as *my* law?"

  **Hardest Questions & Why:**

  1.  **Question 5 (Diffuse vs. Concentrated Catastrophe):** This strikes at the heart of aggregating utilities/interests. Her system *must* produce an answer, but demonstrating how it *reliably* avoids catastrophic outcomes for minorities against diffuse majorities without smuggling in non-scalar values (like rights thresholds) is extremely difficult. Her scalar framework struggles inherently with severe, non-linear harms.
  2.  **Question 2 (Commission Regress):** This challenges the foundational claim of dissolving the boundary regress. Showing how the commission's own constitution avoids either circularity or reliance on an arbitrary prior demos is a deep philosophical and practical problem. Her likely appeal to a "constitutional moment" feels like kicking the can down the road rather than solving it. The follow-up about meta-decisions on the commission's own authority is particularly thorny.

  These two force her to confront the deepest theoretical tensions in her model: the aggregation problem inherent in utilitarianism/scalar approaches (Q5) and the foundational paradox of democratic boundaries (Q2). While she has sophisticated responses, these questions push her towards concessions or complexities that reveal the model's most vulnerable assumptions.
