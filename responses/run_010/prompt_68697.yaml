  ### Diagnostic Decision Tree: De Re Modality Positions

  This decision tree sorts participants into positions on the dispute over how individuals are represented across possible worlds. The common ground (fixed starting point) is assumed by all:  
  - Some singular modal claims (e.g., "This candidate might have won the race") are true, while others (e.g., "This candidate could have been an octave taller than themselves") are false.  
  - Quantifying over possible worlds is a legitimate way to systematize these facts.  

  The tree does not re-litigate whether de re modality is respectable. Each node is a concrete scenario or claim, answerable aloud in a couple of minutes without technical knowledge. Technical terms (if unavoidable) are glossed. Avoided terms: counterpart, transworld identity, haecceitism, thisness, essence, overlap, rigid designation.

  **Orthogonal Axes (excluded from the tree):**  
  - *Concreteness vs. abstractness of worlds*: Whether worlds are concrete entities or abstract representations does not determine the recurrence relation (identity or resemblance) and is compatible with all leaves.  
  - *Actualism vs. possibilism about individuals*: Whether only actual individuals exist or non-actual ones do too is orthogonal; it affects how worlds are populated but not how individuals recur across them.  

  ---

  #### Nodes (Questions)  
  1. **Duplicate World (based on case a):** A world contains a perfect qualitative duplicate of you—same shape, matter, memories, fingerprints, etc.—but this individual is not you. Could what happens to this duplicate (e.g., it wins a race) make it true that *you* could have won that race?  
     - (A) Yes.  
     - (B) No.  

  2. **Symmetric Swap (based on case b):** A world contains two qualitatively identical iron spheres (same size, shape, composition, etc.) in positions P1 and P2. Consider a scenario where the spheres are swapped (P1 sphere moves to P2, P2 to P1) with no qualitative change. Is this swap a genuine alternative possibility (i.e., a different way things could have been)?  
     - (A) Yes, it is a different possibility.  
     - (B) No, it is the same possibility.  

  3. **Multiplicity (based on case c):** A world contains two near-duplicates of you (very similar to you but not perfect, e.g., 95% match in qualitative properties). One achieves a goal you wanted (e.g., becoming a musician); the other does not. Does the existence of at least one near-duplicate achieving the goal make it true that *you* could have achieved it?  
     - (A) Yes.  
     - (B) No.  

  4. **Degree of Remoteness (based on case d):** Consider a world containing an individual remotely similar to you (e.g., a distant cousin with some shared traits, but not a duplicate). Could what this individual does (e.g., becoming a musician) make it true that *you* could have done the same?  
     - (A) Yes.  
     - (B) No.  

  5. **Salience Shift (based on case e):** Suppose we say, "This person could have been a musician." Now consider the same scenario described as, "This statue [made of the same matter as the person] could have been shaped differently." If the first claim is true, must the second also be true?  
     - (A) No, the truth-value can shift depending on what we focus on (e.g., person vs. statue).  
     - (B) Yes, the truth-value is fixed regardless of how we describe it.  

  6. **Nested Possibility (based on case f):** At a world containing a perfect qualitative duplicate of you, what that duplicate "could have done" in further possibilities (e.g., it could have become a musician) depends on:  
     - (A) Only facts about that world and beyond (e.g., what happens in worlds accessible from it).  
     - (B) Also on facts about you in the actual world (e.g., your actual properties or history).  

  7. **Grounding Recurrence:** If an individual in another world is claimed to be *you*, what makes this the case?  
     - (A) It is a primitive fact (no further explanation).  
     - (B) It is due to qualitative resemblance (shared properties).  
     - (C) It is because that individual shares core properties (properties that are necessary for being you; gloss: these are properties without which you would not exist as you).  

  ---

  #### Leaves (Resulting Positions)  
  Leaves are named with standard labels where available. Each leaf is characterized based on the tree; contested interpretations are noted.  

  1. **Counterpart Theory (Fixed Similarity):**  
     - *Description:* De re possibilities are determined by a single, contextually fixed similarity relation. What happens to a sufficiently similar individual in another world makes modal claims about you true. Similarity does not vary with conversational focus.  
     - *Diagnostic Pattern:* 1A, 3A, 4A or 4B, 5B, 6A, 7B.  
     - *Epistemic Status:* Standard characterization of Lewis-style counterpart theory. Live dispute: Whether "fixed similarity" is truly context-independent or admits minimal context-sensitivity.  

  2. **Counterpart Theory (Variable Similarity):**  
     - *Description:* De re possibilities are determined by similarity, but the relevant similarity relation varies with the context (e.g., what properties matter shifts with the question asked). What happens to a similar individual makes modal claims true, but "similar" depends on salience.  
     - *Diagnostic Pattern:* 1A, 3A, 4A or 4B, 5A, 6A, 7B.  
     - *Epistemic Status:* Standard interpretation of some counterpart theories (e.g., Lewis in some readings). Live dispute: Whether this is a distinct view or a variant of fixed similarity.  

  3. **Transworld Identity (Bare):**  
     - *Description:* The same individual exists in multiple worlds. De re possibilities involve the literal recurrence of you across worlds; qualitative duplicates are irrelevant unless they are you. Identity is primitive (not grounded in resemblance or core properties). Rejects symmetric swaps as distinct possibilities.  
     - *Diagnostic Pattern:* 1B, 2B, 3B, 4B, 5B, 6B, 7A.  
     - *Epistemic Status:* Contested reconstruction; often associated with early modal realism. Live dispute: Whether "bare" identity is coherent or collapses into essence-based views.  

  4. **Transworld Identity (Essence-Grounded):**  
     - *Description:* The same individual exists in multiple worlds, grounded in core properties (e.g., origins or material constitution). De re possibilities depend on these properties. Rejects symmetric swaps as distinct possibilities.  
     - *Diagnostic Pattern:* 1B, 2B, 3B, 4B, 5B, 6B, 7C.  
     - *Epistemic Status:* Standard characterization (e.g., Kripke). Live dispute: Whether core properties are qualitative or non-qualitative; whether this view is distinct from bare transworld identity.  

  5. **Haecceitism (Transworld Identity with Primitivism):**  
     - *Description:* The same individual exists in multiple worlds, with identity primitive and non-qualitative. Accepts symmetric swaps as distinct possibilities (non-qualitative differences matter). Qualitative duplicates may not be you.  
     - *Diagnostic Pattern:* 1B, 2A, 3B, 4B, 5B, 6B, 7A.  
     - *Epistemic Status:* Standard label. Live dispute: Whether primitivism is necessary for haecceitism or if essence-based versions exist.  

  6. **Haecceitism (Essence-Grounded):**  
     - *Description:* The same individual exists in multiple worlds, grounded in non-qualitative core properties (e.g., primitive thisness). Accepts symmetric swaps as distinct possibilities.  
     - *Diagnostic Pattern:* 1B, 2A, 3B, 4B, 5B, 6B, 7C.  
     - *Epistemic Status:* Contested reconstruction; some argue haecceitism requires primitivism. Live dispute: Whether non-qualitative essences are coherent.  

  7. **Actualism (Abstract Worlds):**  
     - *Description:* Worlds are abstract representations; the very same individuals recur in them. De re possibilities involve identity across worlds. Rejects symmetric swaps (if anti-haecceitist) or accepts them (if haecceitist).  
     - *Diagnostic Pattern:* Falls under transworld identity leaves (3–6) with 6B and 7A or 7C.  
     - *Epistemic Status:* Standard characterization. Live dispute: Whether this is a distinct view or a variant of transworld identity (the tree groups it there).  

  8. **Unnamed: Primitivist Modalism (no identity/resemblance):**  
     - *Description:* De re modal claims are made true by the individuals themselves, with no relation (identity or resemblance) to other worlds. Worlds systematize possibilities but do not ground them; recurrence is undefined.  
     - *Diagnostic Pattern:* Not fully captured (inconsistent with common ground). If forced: 1B, 2A or 2B, 3B, 4B, 5B, 6B, 7A—but conflicts with world-quantification.  
     - *Epistemic Status:* Contested reconstruction; rarely defended. Live dispute: Whether this view is coherent given the common ground.  

  ---

  #### Key  
  **Mapping Answer Patterns to Leaves:**  
  - **Counterpart (Fixed):** 1A, 3A, 5B, 6A, 7B. (4A or 4B allowed but not used to branch.)  
  - **Counterpart (Variable):** 1A, 3A, 5A, 6A, 7B. (4A or 4B allowed.)  
  - **Transworld Identity (Bare):** 1B, 2B, 3B, 4B, 5B, 6B, 7A.  
  - **Transworld Identity (Essence):** 1B, 2B, 3B, 4B, 5B, 6B, 7C.  
  - **Haecceitism (Primitivist):** 1B, 2A, 3B, 4B, 5B, 6B, 7A.  
  - **Haecceitism (Essence):** 1B, 2A, 3B, 4B, 5B, 6B, 7C.  
  - **Actualism:** Subsumed under transworld identity leaves (e.g., if 1B, 2B, 7C → Essence-Grounded TI).  
  - **Primitivist Modalism:** Not fully mapped; conflicts with nodes 1–7 (see below).  

  **Unoccupied Answer Combinations (and Why):**  
  - **1A + 3B:** E.g., duplicates can represent you in some cases (1A) but not in multiplicity (3B). *Status:* Coherent but unexplored; no known defense.  
  - **1A + 6B:** E.g., duplicates can represent you (1A), but nesting depends on actual-world facts (6B). *Status:* Incoherent; counterpart theory requires local modality (6A).  
  - **1A + 7A or 7C:** E.g., duplicates can represent you (1A), but grounding is primitive (7A) or core-property-based (7C). *Status:* Incoherent; counterpart requires resemblance-based grounding (7B).  
  - **1B + 3A, 4A, 5A, or 6A:** E.g., identity required (1B), but duplicates can represent you (3A/4A), salience matters (5A), or nesting is local (6A). *Status:* Incoherent; transworld identity rejects resemblance-based representation.  
  - **1B + 7B:** E.g., identity required (1B), but grounding is resemblance (7B). *Status:* Incoherent; transworld identity rejects resemblance grounding.  

  **Indistinguishable Leaf Pairs (and Resolution):**  
  - **Transworld Identity (Bare) vs. Haecceitism (Primitivist):** Only separated by Node 2 (swap). If 2B → Bare TI; if 2A → Haecceitism (Primitivist).  
  - **Transworld Identity (Essence) vs. Haecceitism (Essence):** Only separated by Node 2. If 2B → Essence-Grounded TI; if 2A → Haecceitism (Essence).  
  - **Counterpart (Fixed) vs. Counterpart (Variable):** Separated by Node 5 (salience). If 5B → Fixed; if 5A → Variable.  
  - **All TI leaves vs. Actualism:** The tree cannot separate these. *Reason:* Actualism is a variant of TI. *Extra question to separate:* "Are possible worlds concrete or abstract?" But this is orthogonal and excluded; no further separation is attempted.  
  - **Primitivist Modalism vs. Bare Transworld Identity:** The tree conflates them under 7A. *Extra question:* "Must there be a world containing *you* for a de re claim about you to be true?" Primitivist Modalism may say no; Bare TI says yes.  

  **Epistemic Housekeeping (Live Disputes):**  
  - **Case (a) (Duplicate World):** Counterpart-style views (Leaves 1–2) absorb this as non-fatal (answers 1A). Transworld identity views (Leaves 3–6) treat it as fatal to resemblance-based approaches (1B). Dispute: Whether case (a) is a weakness for counterpart theories or a feature.  
  - **Case (b) (Symmetric Swap):** Node 2 separates haecceitist and non-haecceitist views. Dispute: Whether swap acceptance is compatible with counterpart theories (not branched, but possible; e.g., with non-qualitative similarity).  
  - **Essence-Grounded vs. Bare Transworld Identity:** Node 7 separates these. Dispute: Whether essence-grounded TI (7C) collapses into bare TI (7A) if essences are primitive.  
  - **Characterization of Leaves:**  
    - Leaves 1–2: Standard for counterpart theory; dispute over whether fixed/variable is a real divide.  
    - Leaves 3–4: Transworld identity is standard; dispute over whether "bare" and "essence" are distinct.  
    - Leaves 5–6: Haecceitism is standard; dispute over whether it requires primitivism.  
    - Leaf 7 (Actualism): Standard; dispute over whether it adds to TI.  
    - Leaf 8 (Primitivist Modalism): Contested; dispute over whether it respects the common ground.  
  - **Tree Neutrality:** No view is favored. Disputes (e.g., counterpart theory’s handling of case a) are flagged as live. Uncertainties: The origin of "haecceitism" is unclear in the tree (derived from Node 2); "primitive thisness" is not used to avoid jargon.  

  Use this tree to self-diagnose positions at the start of the reading group. Revisit after readings to compare shifts.
