answer: |-
  ### Desiderata for Safety Guarantees in Critical Learned Systems  
  *(For systems where failure is catastrophic and unrepeatable, e.g., implanted medical devices or aircraft control)*  

  1. **Quantification Scope**  
     - *Must cover*: **Inputs** (sensor readings), **environments** (physical contexts, unseen conditions), **adversaries** (malicious or rare natural perturbations), **distribution shift** (train-test mismatch), and **post-deployment updates** (e.g., fine-tuning).  
     - *Motivation*: Real-world failures arise from unanticipated interactions (e.g., a pacemaker encountering a novel cardiac arrhythmia during an MRI scan). Omitting any dimension creates blind spots.  

  2. **Worst-Case Bound, Not Average-Case**  
     - *Requirement*: A hard bound over a *defined set* of conditions, not probabilistic expectations.  
     - *Motivation*: Catastrophic failure on one input (e.g., aircraft stall at 30,000 feet) cannot be offset by 99% correctness. Average-case guarantees ignore tail risks.  

  3. **Per-Instance Validity**  
     - *Requirement*: The guarantee must hold for *every individual deployment instance*, not just a population.  
     - *Motivation*: A "99% safe" population claim is meaningless for the patient experiencing device failure.  

  4. **Checkable Assumptions**  
     - *Requirement*: Assumptions (e.g., environment bounds) must be empirically verifiable *during development* without external trust.  
     - *Motivation*: Unverifiable assumptions (e.g., "the deployment distribution matches training") transfer risk to the user and are unfalsifiable.  

  5. **Graceful Degradation**  
     - *Requirement*: When assumptions are violated, the guarantee must decay *quantifiably* (e.g., robustness radius shrinks predictably).  
     - *Motivation*: Silent failure (e.g., a certificate that vanishes if humidity exceeds 70%) hides latent risks during edge cases.  

  6. **Composability**  
     - *Requirement*: Guarantees must hold when learned components are integrated into larger systems (e.g., a vision module feeding a controller).  
     - *Motivation*: Emergent failures in systems (e.g., an RL agent exploiting a certified perception error) invalidate modular certificates.  

  7. **Non-Vacuity**  
     - *Requirement*: Bounds must be *numerically meaningful* at real-world operating scales (e.g., certifying robustness to 1cm sensor error when 5cm is typical).  
     - *Motivation*: A theoretically correct ℓ∞-ball of radius 10⁻⁹ offers no practical safety.  

  ---

  ### Analysis of Requirements  

  **I. Sorting: Non-Negotiables vs. Preferences**  
  - **Non-negotiables** (stem from the problem’s stakes):  
    - Per-instance validity (failure is singular and catastrophic).  
    - Worst-case quantification (no averaging over irreplaceable lives).  
    - Non-vacuity (a vacuous guarantee is no guarantee).  
  - **Articulated preferences** (reflect methodological biases):  
    - *Minimax inheritance*: Worst-case sets must be "natural" (e.g., physical constraints vs. arbitrary ℓ_p balls).  
    - *Empiricist insistence*: Certificates should be measurable via stress-testing, not solely derived.  

  **II. Joint Unsatisfiability**  
  The triad of **universal environment quantification**, **non-vacuity at realistic scales**, and **tractable computation** is *incoherent*. The No-Free-Lunch theorem implies: if you quantify over all possible environments (including adversarial ones), the worst-case bound becomes vacuously small (e.g., robustness radius = 0) or is computationally infeasible to certify.  
  - **Which pair gives way?** Sacrifice *universal environment quantification*.  
  - **Residue**: A *bounded environment set* (e.g., "all weather conditions in FAA database + 10% margin") with a non-vacuous, tractable certificate. This is weaker but honest: it shifts focus to defining and validating the environment set.  

  **III. Most Exclusionary Requirement**  
  **Per-instance worst-case bounds over environments and adversaries** excludes the most candidates. It has maximal leverage because:  
  - It forces quantification over an intractably large set (all environments × all inputs × all adversaries).  
  - Most methods (e.g., PAC bounds, conformal prediction) retreat to population-level or average-case claims to retain tractability.  
  - *Why leverage?* In critical systems, the "one failure" is statically rare but dynamically catastrophic — demanding elimination of *all* single-point failures.  

  ---

  ### Scorecard for Existing Methods  

  1. **Certified Robustness (e.g., IBP, Randomized Smoothing)**  
     - *Strengths*: Per-instance, worst-case over metric perturbations.  
     - *Gaps*: Quantifies only over ℓ_p-bounded inputs — ignores environments, distribution shift, and composability. Certificates often vacuous at practical scales.  

  2. **PAC-Style Generalization Bounds**  
     - *Strengths*: Formal distributional assumptions.  
     - *Gaps*: Population-level and average-case. Useless for per-instance safety (e.g., "95% safe" permits 1/20 aircraft to crash). Assumptions (i.i.d. data) unverifiable post-deployment.  

  3. **Conformal Prediction**  
     - *Strengths*: Per-instance uncertainty sets with marginal coverage.  
     - *Gaps*: Average-case coverage (e.g., "90% of patients" ≠ "this patient"). Assumes exchangeability, violated by distribution shift. No worst-case adversary model.  

  4. **Safe RL Constraint Guarantees (e.g., barrier functions)**  
     - *Strengths*: Worst-case per-step constraints in *simulated* environments.  
     - *Gaps*: Quantifies only over training-like environments. Rarely composable; degrades silently under distribution shift or adversarial inputs.  

  ---

  ### Conclusion  
  No existing method satisfies all non-negotiable desiderata. The core tension is between *scope* (universal quantification) and *strength* (non-vacuous per-instance bounds). For critical systems, the path forward is **bounded-environment certificates** with rigorously validated assumptions — a weaker but defensible claim. The "safety-case" camp implicitly acknowledges this by prioritizing process arguments, while certified robustness overclaims by solving a narrower problem. A true guarantee must first define *what it is guaranteeing against* — and that definition must absorb the residual risk.
