  Worst-case bounds are necessary for safety, while average-case isn't sufficient. Per-instance guarantees are needed because even 1% failure is unacceptable in critical systems. Assumptions must be checkable during development, not just trusted. If assumptions break, the guarantee should degrade gracefully, not vanish. Composability is essential since systems have multiple components. Non-vacuity ensures the guarantee is meaningful at actual operation scales.

