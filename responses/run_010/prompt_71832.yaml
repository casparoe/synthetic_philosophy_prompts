answer: |-
  ### Scenario: Provincial Harm Reduction Policy  
  *Decision-maker:* Dr. Lena Chen, Director of Substance Use Services for a Canadian province.  
  *Deadline:* 90 days to finalize province-wide opioid crisis response.  
  *Option:* Scale up overdose prevention sites (OPS) offering supervised consumption + basic medical care. Pilot data shows OPS reduce overdose deaths by 27%, EMT call volume by 19%, and public injection by 42% over 6 months. Cost-benefit analysis indicates $3.20 saved per $1 spent. Opposing option: redirect funds to abstinence-based treatment (lower short-term impact: 8% overdose reduction).  

  ---

  ### Analysis  
  **1. Naive Act-Consequentialist Calculation**  
  On Lena’s evidence, scaling OPS dominates: high-confidence ~27 lives saved/year, reduced healthcare burdens, and crime displacement. Expected value (EV) overwhelmingly favors OPS (+EV of CAD 12M/year vs. +CAD 1.2M for abstinence). No significant short-term harms documented.  

  **2. Strategic Reactivity Channel**  
  - **Who notices:** Provincial police units observe reduced overdose calls near OPS.  
  - **Adaptation:** Precincts reallocate patrols from overdose hotspots to high-theft corridors, increasing low-level drug possession arrests (easier metrics).  
  - **Downstream propagation:**  
    → Community orgs divert re-entry programs to post-arrest support (away from long-term rehab advocacy).  
    → Pharma lobbyists leverage arrest spikes to push "tough-on-crime" bills, defunding OPS after 18 months.  
    → Medical researchers deprioritize non-opioid pain R&D (assuming OPS mitigates urgency), delaying safer analgesics by 5+ years.  
  *Horizon:* 2–7 years. Reactivity hinges on *interpretive pluralism*—actors attribute OPS’ success to reduced policing burden, not health gains, altering their strategic moves.  

  **3. Three Verdicts**  
  - **Naive act-consequentialist:** Endorses OPS. *Fails* by ignoring reactivity’s long-term harm amplification (net incarceration ↑, medical innovation ↓).  
  - **Moderate reply:** Use domain restriction (evaluate only health outcomes within 5 years). OPS still wins, but *unstable*—reactivity’s health impacts (e.g., R&D delays) bleed into the domain.  
  - **Radical reading:** Lena *cannot rank options*. OPS’ short-term benefits seed reactive chains that *both* increase structural violence *and* create path dependencies for better policies. No robust EV comparison.  

  **4. Load-Bearing Feature & Ablation**  
  *Feature:* **Interpretive pluralism in reactivity**—agents misinterpret the intervention’s success, triggering self-undermining adaptations.  
  *Ablation:* Remove misinterpretation (e.g., assume all actors correctly attribute OPS’ health benefits). Reactivity now produces predictable feedback (e.g., more OPS funding). Cluelessness collapses into ordinary uncertainty: better stakeholder analysis resolves it.  
  → **\answer{COLLAPSES}**  

  **5. Consequentialist Defense**  
  Defenders attack the case by rejecting *evidence inaccessibility*: Lena *could* run granular stakeholder simulations pre-decision (e.g., game-theoretic models of police/pharma responses). If reactivity is foreseeable, it folds into EV calculations. *Counter:* Simulations require precise data on actor priorities (e.g., police conviction quotas vs. public health goals)—information provinces lack due to institutional secrecy. "Commission a study" fails; police unions block data access, and pharma lobbying isn’t public. Consequentialism demands impossible counterfactual mapping.  

  ---
  \answer{COLLAPSES}
