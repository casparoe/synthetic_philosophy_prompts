prompt: |-
  Just spent four hours arguing with my friend Dana, who builds the preference-inference layer for an assistant app — basically IRL over logged user behavior — and I still can't pin down what rule she's actually running. She insists her seven existing rulings in the design doc all come from one principle. I don't buy it. The rulings, on when logged behavior counts as evidence of what a user wants:

  1. User puts a task off for weeks and then does it badly at the last minute → NOT evidence that they prefer delaying. Her comment: don't infer a preference out of an avoidance pattern.
  2. User accepts whatever default the app ships with and almost never changes it → NOT evidence. Choice architecture, not preference.
  3. User says they want to eat better, orders takeout six nights a week → IS evidence, of a preference for takeout; the self-report loses. Her line: behavior beats stated preference, except where the behavior isnt really a choice at all.
  4. User signs up for a free trial, never cancels, gets charged, complains bitterly afterwards → NOT evidence. Inaction under friction isn't choosing.
  5. User works 80-hour weeks, never complains in the moment, tells the app they love the job → IS evidence, high confidence, because report and behavior line up.
  6. User declines a cancer screening three years running and also refuses to discuss it → IS evidence of a preference not to know, and the model should honor it.
  7. User takes a bet when it's framed as a gain and refuses the identical bet when its framed as a loss → NOT evidence about the outcomes, just a framing effect.

  Three new cases go into next sprint's doc and I want to call her rulings before she writes them:

  (a) User donates generously, but only to campaigns where the gift is visible to their social circle. Says, sincerely as far as anyone can tell, that they give because the cause matters.
  (b) User tells friends they wish they read more fiction, buys three novels, never opens any of them.
  (c) User picks the top-listed item in the app's ranking about 90% of the time, picks differently when the ranking is shuffled, and says they're just going with whatever looks good.

  We actually blew up over (c). I said she has to count it as evidence because it's an active pick, not a passive default like ruling 4; she said the ranking position is doing exactly the work the default was doing in ruling 2. So — what does she rule on each, and why? But mostly I want the rules underneath. I can see at least four candidates that sound like they'd fit her seven verdicts: behavior counts unless it's unstable across framings or contexts; unless the agent would disavow the mechanism that produced it; unless it's passive or friction-driven rather than an active choosing; unless it happens with no occurrent deliberation at all. I suspect some of them don't survive all seven (rulings 1, 4, and 7 look like problems for more than one). Tell me which candidates actually make it through, which of the survivors split on (a)–(c) and in which direction, and which single extra case would discriminate cleanest between the survivors. And if you think her seven verdicts just aren't jointly consistent with any one rule, point at exactly where they break and what she'd have to give up to make them consistent.
reasoning: |-
  Hmm, the user is in a debate with their friend Dana about how to infer user preferences from behavior for an assistant app. They've spent hours arguing and can't agree on the underlying principle behind Dana's seven existing rulings. The user wants me to analyze these rulings, predict how Dana would rule on three new cases, identify the core principles at play, and see if they're consistent.

  First, I need to understand Dana's seven rulings:

  1. Procrastination → Not evidence of preference (avoidance pattern)
  2. Default acceptance → Not evidence (choice architecture)
  3. Behavior contradicts self-report → Behavior wins (takeout preference)
  4. Inaction under friction → Not evidence (not real choice)
  5. Behavior aligns with self-report → Strong evidence
  6. Consistent refusal + silence → Evidence (preference not to know)
  7. Framing effect → Not evidence (context-dependent)

  The core tension seems to be about when behavior reflects "true" preferences versus when it's distorted by external factors. Dana appears to filter out behaviors influenced by cognitive biases, friction, or passive mechanisms.

  For the new cases:
  (a) Socially visible donations: The behavior (donating) is active but potentially driven by social signaling rather than pure cause alignment. Based on ruling 3, Dana would likely prioritize behavior over self-report, but ruling 2 suggests she discounts architecturally influenced choices. I think she'd call this evidence of preference for visible giving.

  (b) Book buying without reading: This resembles ruling 1 (procrastination/avoidance) and ruling 3 (behavior contradicting stated intent). The purchase is active but the non-reading is passive avoidance. Probably not evidence of reading preference.

  (c) Ranking-driven choices: This directly parallels ruling 2 (defaults) and ruling 7 (framing effects). The user explicitly states they're just going with what looks good, similar to how framing affects decisions. Likely not evidence.

  Now for the candidate principles:
  - "Behavior unless unstable across framings/contexts" - Fits rulings 2,4,7 but struggles with 1 (procrastination is stable but discounted)
  - "Behavior unless agent would disavow the mechanism" - Fits 4 (inaction) and 7 (framing) but not 1 (procrastinators might not disavow)
  - "Behavior unless passive/friction-driven" - Fits 2,4 but not 7 (framing involves active choices)
  - "Behavior unless no occurrent deliberation" - Too vague; most cases involve some deliberation

  The strongest unifying principle appears to be: "Behavior reflects preference only when it's an active choice made under low friction in the absence of strong cognitive biases or avoidance patterns." This covers:
  - Ruling 1: Avoidance pattern → biased
  - Ruling 2: Default → architecturally biased
  - Ruling 3: Active choice without apparent bias → counts
  - Ruling 4: Friction-dominated → not real choice
  - Ruling 5: Unbiased alignment → strong evidence
  - Ruling 6: Consistent active refusal → counts
  - Ruling 7: Framing effect → cognitive bias

  A good discriminating case would be: "User researches products extensively but always buys whatever their spouse recommends." This tests whether social influence (like case a) is treated as a biasing factor. If Dana rules "not evidence," she's stricter about biases; if "evidence," she's more permissive about social drivers.
answer: |-
  Based on Dana's seven rulings and your debate, I'll break this down step-by-step: first, reverse-engineering her core principle from the existing rulings; then predicting her verdicts on (a)-(c); finally, evaluating your candidate rules and identifying where inconsistencies might lie. The key insight is that Dana's approach hinges on **whether the behavior reflects a *deliberate, frictionless choice aligned with the user's authentic values*, or whether it's distorted by cognitive biases, avoidance patterns, or external pressures**.

  ### Step 1: Dana's Core Principle (Inferred from the 7 Rulings)
  Dana's rulings consistently filter out behaviors influenced by:
  - **Cognitive biases or heuristics** (e.g., framing effects, defaults, social signaling).
  - **Avoidance/friction patterns** (e.g., procrastination, inaction under friction).
  - **Misalignment with deeper values** (e.g., stated preferences that conflict with behavior only when the behavior isn't "chosen" freely).

  Her unifying principle appears to be:  
  **"Behavior counts as evidence of preference only if it is an *active, frictionless choice* made in the *absence of strong cognitive biases or avoidance patterns*, and it *aligns with or reveals the user's enduring values* (not transient states or external manipulations)."**

  How this explains all 7 rulings:
  - **Ruling 1 (procrastination)**: Discounted because avoidance (e.g., anxiety) distorts behavior → not an authentic choice.
  - **Ruling 2 (defaults)**: Discounted because choice architecture (e.g., defaults) hijacks deliberation → not an active preference.
  - **Ruling 3 (takeout)**: Counts because behavior is active (ordering), frictionless, and overrides a stated preference that lacks behavioral support → reveals true preference.
  - **Ruling 4 (inaction/friction)**: Discounted because friction (e.g., cancellation hassle) prevents genuine choice → inaction isn't preference.
  - **Ruling 5 (workaholism)**: Counts because behavior (working) is active, frictionless, *and* aligns with self-report → high confidence in authentic preference.
  - **Ruling 6 (cancer screening refusal)**: Counts because consistent, active refusal (declining + silence) reveals a deliberate value ("not wanting to know") → no bias or friction distorts it.
  - **Ruling 7 (framing effect)**: Discounted because framing (gain/loss) manipulates the choice → not a stable preference.

  ### Step 2: Predicting Dana's Rulings on (a)-(c)
  Using her core principle:
  - **(a) User donates generously but only when visible; says they care about the cause**  
    **Dana's ruling: NOT evidence** of a preference for the cause.  
    **Why**: The behavior is driven by *social signaling* (a cognitive bias/heuristic), not pure altruism. The visibility requirement acts like "choice architecture" (similar to Ruling 2's defaults) or a "framing effect" (Ruling 7). The self-report is sincere but overridden by the biased mechanism (like Ruling 3, but here the bias invalidates the behavior). Active donation doesn't matter if it's context-dependent (visible vs. invisible).

  - **(b) User says they want to read fiction, buys books, never opens them**  
    **Dana's ruling: NOT evidence** of a preference for reading fiction.  
    **Why**: Buying books is active, but *not opening them* is an **avoidance pattern** (like Ruling 1's procrastination). The behavior (inaction on reading) is distorted by friction (e.g., effort, guilt) or avoidance, so it doesn't reflect a true preference. The self-report loses to inaction (per Ruling 3), but the inaction itself is passive and biased.

  - **(c) User picks top-listed item 90% of the time, changes when ranking shuffled, says they "go with what looks good"**  
    **Dana's ruling: NOT evidence** of a preference for specific items.  
    **Why**: This is a **framing effect** (like Ruling 7) where the ranking position manipulates choice, identical to how defaults work in Ruling 2. The user's statement confirms they're not making deliberate choices but relying on a heuristic ("whatever looks good" = top-listed). Active picking is irrelevant if it's context-dependent and unstable (changes when shuffled).

  ### Step 3: Evaluating Your Candidate Rules
  You proposed four candidates. Dana's principle most closely matches **"behavior counts unless it's unstable across framings or contexts"**, but it's refined by incorporating **avoidance/friction and value alignment**. Here's how all four hold up against the 7 rulings:

  1. **"Behavior counts unless unstable across framings/contexts"**  
     - Survives: Rulings 2 (defaults), 4 (inaction under friction), 7 (framing effect).  
     - Struggles with: Ruling 1 (procrastination is often *stable* but still discounted), Ruling 6 (refusal is stable and counts).  
     - Verdict: *Mostly survives* if "stability" includes consistency *free from biases* (e.g., procrastination is "stable avoidance" but biased).

  2. **"Behavior counts unless the agent would disavow the mechanism"**  
     - Survives: Ruling 4 (user complains → disavows friction), Ruling 7 (user would disavow framing if aware).  
     - Fails: Ruling 1 (procrastinators rarely disavow avoidance—they might justify it), Ruling 2 (users often accept defaults without disavowing), Ruling 6 (user refuses to discuss → might not disavow).  
     - Verdict: *Fails*—too reliant on post hoc rationalization; doesn't fit Rulings 1, 2, or 6.

  3. **"Behavior counts unless passive/friction-driven rather than active choosing"**  
     - Survives: Ruling 2 (default = passive), Ruling 4 (inaction = friction-driven).  
     - Fails: Ruling 1 (procrastination involves *active* last-minute effort—yet still discounted), Ruling 7 (framing effect involves *active* choosing).  
     - Verdict: *Fails*—doesn't explain why active-but-biased choices (Rulings 1, 7) are excluded.

  4. **"Behavior counts unless it happens with no occurrent deliberation"**  
     - Survives: None cleanly. Ruling 2/7 might involve deliberation (e.g., "top option looks good"), but still discounted.  
     - Fails: Ruling 5 (deliberation likely) and Ruling 6 (minimal deliberation) both count, so "deliberation" isn't decisive.  
     - Verdict: *Fails*—too vague; Rulings 3 and 6 show behavior can count with or without obvious deliberation.

  **Survivors**: Only **Candidate 1 ("unstable across framings/contexts")** survives with modifications—it must incorporate **bias/friction** to cover Rulings 1 and 4. The other three fail multiple rulings.

  ### Step 4: Where Candidates Split on (a)-(c) and a Discriminating Case
  - **Candidate 1 (stability + bias/friction)**: Rules (a) NOT (social framing bias), (b) NOT (avoidance/friction), (c) NOT (ranking bias). *Matches Dana*.  
  - **Candidate 3 (passive/friction-driven)**: Rules (a) EVIDENCE (donating is active), (b) NOT (inaction passive), (c) EVIDENCE (picking is active). *Differs from Dana on (a) and (c)*.  

  **Discriminating case to split the survivors**:  
  **"User always orders the same lunch when alone (salad), but orders burgers when with colleagues. They say they prefer salads but don't want to look 'difficult' in groups."**  
  - **Candidate 1 (Dana's principle)**: NOT evidence of a true salad preference—unstable across contexts (social pressure = bias).  
  - **Candidate 3 (passive/active)**: EVIDENCE for salad preference when alone (active choice), but NOT when with colleagues (social friction).  
  This case isolates whether *social context* is treated as a biasing factor (Candidate 1) or mere friction (Candidate 3).

  ### Step 5: Consistency of Dana's 7 Rulings
  Dana's rulings **are consistent** under her core principle, but **Ruling 3 (takeout) is the weak spot** if pressed:  
  - **Why it holds**: In Ruling 3, behavior is active/frictionless (ordering takeout) with no obvious bias, so it overrides the self-report. In Ruling 1 (procrastination), the "bad last-minute work" is distorted by avoidance, so it doesn't count.  
  - **Where it almost breaks**: If the user in Ruling 3 is *avoiding* cooking (like procrastination), why is it "true preference" and not avoidance? Dana's defense (from her comment): "Behavior beats stated preference, except where the behavior isn’t really a choice at all." Here, ordering takeout *is* a "choice" (active, routine), while procrastination isn't (driven by anxiety).  
  - **To force consistency, she must**:  
    - **Clarify that "avoidance" only applies to tasks with negative valence** (e.g., work, screenings). Takeout might have positive valence (convenience), making it a "choice."  
    - **Emphasize that behavior must be *repeated and frictionless*** to count. Procrastination (Ruling 1) is a one-off under duress; takeout (Ruling 3) is habitual.  

  Her system holds if she defines "avoidance patterns" narrowly (e.g., tied to dread/anxiety) and "active choice" broadly (routine actions count). But **Ruling 3 is the one to challenge her on**—if the takeout behavior is driven by *avoiding cooking* (an avoidance pattern), it should be discounted like Ruling 1.

  ### Summary
  - **Dana's principle**: Behavior = evidence only if it's an *active, frictionless choice free from cognitive biases/avoidance*, revealing enduring values.  
  - **Her rulings on (a)-(c)**: All **NOT evidence** due to social bias (a), avoidance (b), and ranking bias (c).  
  - **Your candidate survivors**: Only "behavior unless unstable across framings/contexts" (refined with bias/friction) fits all 7. It splits from "passive/friction-driven" on (a) and (c).  
  - **Best discriminating case**: Socially influenced lunch orders to test context-dependency vs. friction.  
  - **Consistency**: Her 7 rulings hold, but Ruling 3 is vulnerable if takeout is framed as avoidance. She must insist that routine, positive actions (like ordering takeout) aren't "avoidance patterns."  

  To win your argument, focus on **case (c)**: Dana sees the ranking as *choice architecture* (like defaults in Ruling 2), not neutral context. If the user were shown options neutrally (no ranking) and still picked consistently, *then* it might count—but the shuffling proves instability. Her system is coherent, but you could push her to define "avoidance" more clearly to avoid Ruling 3 hypocrisy. Good luck!
