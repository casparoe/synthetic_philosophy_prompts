answer: |-
  (Leans forward, elbows on the desk, fingertips pressed together) You've hit the nail on the head – that *is* the hard question. I'll grant your stipulation: each family clearing another field or planting an extra row likely did so thinking it meant survival, or maybe just a slightly fuller belly that winter. No villain, just grinding circumstance. But here's the rub: that survival today locked in catastrophe tomorrow. Population is the ratchet. Every marginal gain in food *stability* – not abundance, mind you, just predictability – let more infants survive, let women bear children closer together. You see it screaming from the ground: the sudden flood of tiny skeletons in early farming cemeteries, far outnumbering anything we see in forager sites. More mouths. Always more mouths. Now you're trapped. That field you cleared? You *need* its yield next year just to stand still. Retreat isn't an option; the land won't support the new numbers by foraging. Ever seen a Neolithic village voluntarily disband and go back to mobile foraging? Neither have I. The 'mistake' wasn't made by any one person choosing a barley seed over a gazelle track. The mistake is the system it built: an inescapable treadmill where you run harder and harder just to keep that swollen population alive, generation after generation, leaving those lesions on *everyone's* bones. The 'victims'? They're the ones buried in the dirt we dig up – shorter, sicker, working harder from childhood to grave than their foraging grandparents ever did. Whose loss is it? Look at the infant buried with cribra orbitalia and stunted long bones and tell me it wasn't theirs.
