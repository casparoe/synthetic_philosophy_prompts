answer: |-
  ### 1. Bottom Line (150 words)
  Kuhn’s incommensurability comprises three distinct theses: **(i)** *Untranslatability*: Core sentences of one theory lack exact equivalents in another, impeding full intertranslation. **(ii)** *Lexical restructuring*: Key terms (e.g., "mass") embed in unique networks of contrasts and inferences, altering their meaning despite shared spelling. **(iii)** *Perceptual disparity*: Paradigm practitioners "see" the world differently (e.g., observing oxygen vs. dephlogisticated air). Kuhn emphasised (ii) as foundational, later downplaying (iii) and refining (i) to *partial* untranslatability. Thesis (ii) *can* stand without (i) or (iii): Lexical networks may shift without precluding translation or altering perception. Your dilemma fails because lexical restructuring *is* substantive (not weak "partial synonymy") yet doesn’t preclude meta-language description (avoiding the "too strong" horn). Historians use a *third lexicon* to compare paradigms, denying simultaneous deployment isn’t denying description.  

  ### 2. Three Readings Separated (700 words)  

  **(i) Untranslatability Thesis**  
  This asserts that sentences central to an older theory (e.g., "Phlogiston is released during combustion") cannot be fully translated into the lexicon of a successor (e.g., modern chemistry). Crucially, it is *not* that the *words* are untranslatable, but that the *theoretical assertions* lose their original inferential relationships when rendered in the new framework. For example, translating "phlogiston" as "negative oxygen" distorts historical chemists’ causal reasoning. In *Structure* (1962), Kuhn suggested near-total untranslatability between paradigms. By his 1980s work (e.g., "Commensurability..."), he retreated to *local* untranslatability: only theory-constitutive terms resist translation, not entire languages.  

  **(ii) Lexical Restructuring Thesis**  
  This is Kuhn’s core, persistent claim. Scientific lexicons are structured taxonomies: terms gain meaning through "contrast sets" (e.g., "element" vs. "compound") and "similarity relations" (e.g., grouping metals by shared properties). When paradigms shift, these networks reorganise. For instance, "planet" pre-2006 included Pluto by historical precedent; post-2006, it requires orbital dominance, excluding Pluto. "Mass" in Newtonian mechanics is invariant; in relativistic contexts (c. 1905–1950s), it was velocity-dependent, linked to distinct equations and causal roles. Crucially, (ii) is *independent* of untranslatability: A bilingual historian can map Newtonian "mass" to relativistic "rest mass" *with caveats* about divergent inferences. It also needs no perceptual shift: Astronomers didn’t *see* Pluto differently after 2006. Kuhn maintained (ii) from *Structure* through his later work, treating it as the engine of incommensurability.  

  **(iii) Perceptual Disparity Thesis**  
  This claims paradigm practitioners literally perceive entities differently, akin to a gestalt switch (e.g., seeing a duck-rabbit as either duck or rabbit). In *Structure*, Kuhn used examples like astronomers observing the same patch of sky but "seeing" different stars due to divergent expectations (e.g., Brahe vs. Kepler). He later moderated this, denying literal retinal changes but retaining that scientists "see *as*" (e.g., "seeing oxygen" rather than "dephlogisticated air"). By the 1980s, he largely subsumed (iii) under (ii): Learning a lexicon *enables* certain perceptions by training attention, but perception isn’t *determined* solely by lexicon.  

  **Kuhn’s Evolution**:  
  - *Structure* (1962): Strongly linked (ii) and (iii), implying radical untranslatability (i).  
  - Post-1970s (esp. "Commensurability..."): Prioritised (ii). Replaced (iii) with "world-change" as conceptual, not perceptual. Refined (i) to *local* untranslatability of taxonomies.  
  - (ii) stands alone: Lexical restructuring explains paradigm shifts without requiring untranslatability or perceptual shifts. Learning a new lexicon can clarify differences without gestalt switches.  

  ### 3. The Davidson Objection and the Bilingual’s Reply (600 words)  

  **Davidson’s Challenge (1974)**:  
  Davidson argued that the notion of "conceptual schemes" radically different from ours is incoherent. Belief, meaning, and truth are interdependent: To attribute beliefs to a speaker, we must assume most of their beliefs are *true* by our lights (the "principle of charity"). If two theories were truly incommensurable (i.e., largely untranslatable), we couldn’t even identify them as *theories* or assign beliefs to their holders. Thus, any failure of translation must be local and resolvable, not global. This directly attacks thesis (i).  

  **Why it Bites (i) but not (ii)**:  
  Davidson’s argument undermines *radical* untranslatability (i) by showing that successful interpretation requires shared truths. However, (ii) is untouched: Lexical restructuring doesn’t imply *uninterpretability*, only that terms have different inferential roles. We can understand both Newtonian and relativistic "mass" by recognising their distinct positions in their respective theories, without conceding they are synonyms. Davidson allows for *partial* differences in conceptual structure, so long as there is enough overlap to anchor interpretation.  

  **Kuhn’s Bilingual Reply**:  
  Kuhn’s later response (1980s) is that historians can become "bilingual": They learn the older lexicon *on its own terms* without reducing it to the new one. This is **not** partial translation.  
  - *Partial translation*: Attempts to map terms between lexicons, inevitably losing nuances (e.g., "phlogiston ≈ negative oxygen" misrepresents phlogiston theory).  
  - *Bilingualism*: Acquires the older lexicon as a separate language, accessing its full inferential network. The historian can then *compare* lexicons from a meta-linguistic stance.  
  This *is* a third position: It concedes Davidson’s point that full untranslatability would make the old theory unrecognisable, but insists that *understanding* requires more than translation—it demands immersion in the lexicon’s native structure. Bilingualism doesn’t "solve" incommensurability; it bypasses the need for translation by enabling direct engagement.  

  ### 4. The Dilemma Tested (400 words)  

  Your dilemma: Lexical restructuring (ii) is either *too weak* (reducible to partial synonymy) or *too strong* (precluding description of differences).  

  - **Too Weak?** A "patient glossary" mapping contrasts (e.g., "Newtonian mass → rest mass + caveats") might seem to reduce (ii) to partial synonymy. But this misses Kuhn’s point: The *inferential role* of "mass" differs fundamentally. In Newtonian mechanics, mass is conserved, invariant, and explains inertia/gravity; in relativistic usage (c. 1940s), velocity-dependent mass explained momentum dynamics. A glossary can note this, but the *meaning* isn’t preserved because the term’s conceptual relationships are irreconcilable. Kuhn doesn’t concede; he insists lexical differences are *substantive*, not merely notational.  

  - **Too Strong?** If lexicons can’t be "jointly deployed," how can historians describe differences? Kuhn’s answer is **meta-lexical description**. The historian uses a *third* lexicon (e.g., historiography of science) to analyse both paradigms without mixing their native terms. For example:  
    - *Within* paradigm A: "Mass is invariant."  
    - *Within* paradigm B: "Mass is velocity-dependent."  
    - *Meta-description*: "Paradigm A used 'mass' as an invariant property, while B used it as a velocity-dependent quantity."  
  This doesn’t require deploying A and B simultaneously; it describes their structures from outside. The dilemma loses force because (ii) denies *internal coherence* of hybrid usage, not *external description*.  

  ### 5. The Two Cases Adjudicated (600 words)  

  **Case A: Relativistic vs. Invariant Mass**  
  - **Thesis (i) Untranslatability? No.** The formulations are interconvertible mathematically (E = γmc² vs. p = γmv). No sentences resist translation.  
  - **Thesis (ii) Lexical restructuring? Minimally.** While "mass" had distinct inferential roles (e.g., in momentum equations), this was a *stylistic* shift within a continuous framework. Relativistic "mass" was always a pedagogical shorthand; the invariant concept (rest mass) was present from 1905. The "reorganisation" was superficial, not paradigm-shifting.  
  - **Thesis (iii) Perceptual disparity? No.** Physicists didn’t see particle tracks differently.  
  **Verdict**: Your instinct is correct. This is notational adjustment, not incommensurability. Your colleague overstates the lexical shift; "mass" retained core invariance throughout.  

  **Case B: Pluto’s Reclassification (2006)**  
  - **Thesis (i) Untranslatability? No.** All parties agreed on Pluto’s properties; the dispute was purely taxonomic.  
  - **Thesis (ii) Lexical restructuring? Yes, centrally.** "Planet" shifted from a historical category to one requiring orbital dominance. This altered its contrast set (planet vs. dwarf planet) and inferences (e.g., about solar system formation).  
  - **Thesis (iii) Perceptual disparity? No.** Astronomers didn’t perceive Pluto differently; they re-evaluated its classification.  
  **Relation to Kuhn**: This *is* lexical change without revolution. Kuhn’s later work allows such shifts outside revolutionary episodes (e.g., via "speciation"). Crucially, it shows that (ii) need not involve (i) or (iii). The shared language for debate was a *meta-lexicon* (e.g., "IAU resolution 5A"), not the native lexicon of either taxonomy. This case clarifies that lexical restructuring can occur through stipulation and debate—not solely via paradigm conversion—and still exemplify (ii).  

  ### 6. What You Should Stop Saying (200 words)  

  Avoid these scientifically intuitive but philosophically misleading phrases:  
  1. **"They saw different things"** → **Misleading**: Implies perceptual incommensurability (iii), which Kuhn softened. **Better**: "They interpreted observations through different conceptual frameworks."  
  2. **"Theories are untranslatable"** → **Misleading**: Suggests global failure (i), which Davidson discredited. **Better**: "Core theoretical terms resist exact translation due to divergent inferential roles."  
  3. **"Mass just means something different now"** → **Misleading**: Implies arbitrary semantic change. **Better**: "The term 'mass' operates within a restructured network of contrasts and inferences."  
  4. **"Kuhn says science is irrational"** → **Misleading**: Kuhn saw paradigm shifts as *comparative* (not irrational), grounded in lexical reorganisation. **Better**: "Kuhn argues theory choice lacks strict algorithmic rationality due to incommensurable lexicons."  

  ---  
  This account prioritises Kuhn’s mature views (post-1980), distinguishes his theses rigorously, and upholds lexical restructuring (ii) as the robust core of incommensurability, reconciling it with Davidson via bilingualism. Your cases confirm that (ii) operates independently and varies in scope.
