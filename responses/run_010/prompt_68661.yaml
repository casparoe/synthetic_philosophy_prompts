prompt: |-
  You are a philosopher of language and social ontology whose specialty is David Lewis's theory of convention, coordination problems, and the emergence of norms. Please think carefully and work in two passes: first cast as wide a net as you can over candidate readings of the slogan, then prune, order, and evaluate. I want analysis rather than a survey — name positions and authors where that sharpens a point, but do not quote passages, do not cite page numbers, and do not hand me a reading list.

  Here is my situation. I am auditing two seminars this term, and in both of them the same sentence did the same kind of work: "it's just a convention." Having been reading Lewis, I find that the sentence slides between things he would sharply separate, and I cannot yet say which slides are being exploited.

  First seminar, philosophy of logic. A visiting student who works intuitionistically objected that our free use of excluded middle begs the question against her. A classmate replied, roughly: the law of excluded middle is just a convention, each side is entitled to its own, there is no fact of the matter which is correct, and so there is nothing to argue about. He added, in what he took to be her favor, that she loses nothing anyway: every classical theorem has a double-negation translation she can accept, while she keeps a distinction between a statement and its double negation that our logic collapses. The remark was treated as settling the dispute and we moved on. I am confident it did not settle anything, but I cannot say what it would have taken to settle it.

  Second seminar, a social ontology reading group. The same phrase came up about the alphabetical-author-order convention in mathematics and theoretical economics — "it's just a convention" — said with the implication that the field could switch to contribution-ordering next year without anybody having been wrong about anything, and that people who resent appearing last are confused. Here I largely agree with the speaker's conclusion, and yet the claim feels very different from the first one, despite the identical words.

  What I want is a disambiguation of the slogan, laid out as a menu:

  1. Enumerate the distinct precise claims the sentence might be making. I expect at least five or six, ranging from something very near a platitude to something radical. State each as a single explicit thesis, and for each say what it commits the speaker to on the following points: whether some alternative regularity would have served equally well; whether the practice arose by design or by convergence; what reasons, if any, individuals have to conform to it; whether it is changeable and by whom; and whether a dispute about it is a factual dispute or a merely verbal one. Where Lewis's own machinery is relevant — regularity in a recurrent situation, common knowledge, the preference to conform conditional on others conforming, the general preference that others conform, common interest, and the arbitrariness clause — say whether that machinery actually applies here, and identify which of his conditions the case in question fails to meet.

  2. Give each reading a verdict: platitude, substantive and defensible, substantive and questionable, or false, with a brief justification. Note explicitly where a reading is true of one of my two cases and false of the other.

  3. Say which readings, if any, would license the dismissal in the logic seminar. In particular: does arbitrariness in Lewis's sense entail that there is no fact of the matter, that both parties are entitled to their logic, or that the disagreement is merely verbal? And does the genealogical point — that our logical practice was not designed but grew up — support any of those conclusions, or is that an independent inference? Address whether the logical case even supplies the coordination structure with common interest that Lewis's analysis requires, or whether what governs logic is something else (a constitutive rule, a norm of assertion, a semantic practice) that the slogan merely borrows the vocabulary of.

  4. Say which readings are operative in the author-ordering case, and locate exactly where the two cases come apart.

  5. Finally, give me the strongest single claim the philosophy-of-logic speaker could have made — the most defensible thesis available within a Lewisian framework that still leaves the intuitionist with something genuine to object to — and say what he should have said next in order to actually engage her.

  Be explicit throughout about where you are exercising substantive philosophical judgment rather than reporting a standard view.
reasoning: |-
  Hmm, the user is auditing two seminars where the phrase "it's just a convention" is being used in different contexts - philosophy of logic and social ontology. They want me to disambiguate this slogan using David Lewis's framework of conventions. 

  First, I need to unpack what "it's just a convention" might mean across different interpretations. Let me recall Lewis's key elements: conventions are solutions to coordination problems, involving regularities in behavior, common knowledge, preferences for conformity conditional on others conforming, and arbitrariness (meaning alternative solutions could have worked). 

  For the logic case, when someone dismisses the intuitionist's objection to excluded middle by calling it "just a convention," I suspect they're overextending Lewis's concept. Logical rules aren't conventions in the coordination-problem sense - they're more like constitutive norms of reasoning. The existence of double-negation translations doesn't make classical vs intuitionistic logic arbitrarily interchangeable; they represent meaningfully different approaches to truth and proof. 

  In contrast, author-ordering in academic papers perfectly fits Lewis's model: it solves a coordination problem (how to list authors), has clear alternatives (alphabetical vs contribution-based), and everyone benefits from consistency regardless of which system is chosen. 

  The user wants me to:
  1) Enumerate distinct readings of "just a convention" with commitments
  2) Evaluate each reading as platitude/defensible/questionable/false
  3) Identify which readings license dismissing the logic dispute
  4) Explain why author-ordering differs
  5) Suggest the strongest Lewisian claim available to the logic speaker

  For point 5, the strongest defensible position would be that classical logic functions conventionally within specific communities of practice - but this still leaves room for the intuitionist to argue about foundational epistemic commitments. 

  I'll need to carefully separate where I'm applying Lewis versus making independent philosophical judgments, especially regarding the nature of logical disagreement. The key insight is that not all social practices are coordination conventions - some are epistemic norms with different normative force.
answer: |-
  Here is a disambiguation of "it's just a convention" using Lewis's framework, structured as requested. I'll exercise philosophical judgment explicitly where needed, particularly regarding logic's status.

  **1. Enumerated Readings & Commitments:**

  *   **Reading 1 (Coordination Solution - Lewis Core):** *The regularity R (e.g., alphabetical ordering) is an arbitrary solution to a recurrent coordination problem in population P, where agents prefer conformity to R conditional on others conforming, due to a common interest in coordination.*
      *   **Alternative:** Yes, other regularities R' could have solved the problem equally well.
      *   **Origin:** Typically arises by convergence/evolution, not top-down design (though design is possible).
      *   **Reasons to conform:** Instrumental: To achieve coordination benefits (e.g., avoiding confusion, enabling joint action) given others' conformity.
      *   **Changeability:** Changeable by collective action within P if a new coordination equilibrium emerges.
      *   **Dispute Nature:** Factual dispute about *which* solution is currently established or most beneficial, but *not* about inherent superiority of R vs. R' *qua* solutions. Dispute about *whether* it *is* a coordination problem/solution is deeper.
      *   **Lewis Machinery:** Directly applies. Requires recurrent situation, common knowledge of R, preference for conditional conformity, common interest, arbitrariness.

  *   **Reading 2 (Mere Regularity - Weak Arbitrariness):** *R is a widespread behavioral regularity, and there are conceivable alternative regularities R' that could also exist.*
      *   **Alternative:** Yes, conceivable alternatives exist.
      *   **Origin:** Undetermined (accident, design, drift).
      *   **Reasons to conform:** Undetermined (habit, fear, convenience, coordination).
      *   **Changeability:** Possibly changeable, mechanism unspecified.
      *   **Dispute Nature:** Undetermined; dispute could be factual (is R the regularity?) or normative (should it be?).
      *   **Lewis Machinery:** Fails *essential* conditions: lacks the coordination problem structure, conditional preferences, and common interest. Only satisfies weak arbitrariness and (possibly) regularity.

  *   **Reading 3 (Normative Insignificance):** *R lacks deep normative force or justification; it is not grounded in morality, deep rationality, or intrinsic value.*
      *   **Alternative:** Often implied, but not strictly necessary.
      *   **Origin:** Irrelevant to normative claim.
      *   **Reasons to conform:** Primarily pragmatic, conventional, or prudential (avoid sanction), *not* fundamental moral/rational obligation.
      *   **Changeability:** Emphasized as possible without moral error.
      *   **Dispute Nature:** Dispute about R's value/obligation is misguided; it's not that kind of thing. Might be merely verbal if disputants equivocate on normativity.
      *   **Lewis Machinery:** Partially compatible (Lewis conventions aren't morally fundamental), but goes beyond Lewis by making a strong *negative* claim about normativity Lewis doesn't make. Lewis explains *why* we have reason to conform, not that the reason is "shallow".

  *   **Reading 4 (Genealogical Explanation):** *R arose through historical processes of social interaction and selection, not derivation from first principles or discovery of a pre-existing fact.*
      *   **Alternative:** Implied that other outcomes were historically possible.
      *   **Origin:** Explicitly *not* by rational design from first principles; emerged from practice.
      *   **Reasons to conform:** May be instrumental (uphold the system) or inertial (habit), distinct from foundational justification.
      *   **Changeability:** Implied, as a historical product.
      *   **Dispute Nature:** Dispute framed as discovery of pre-existing truth is mistaken; dispute about origins/function is factual.
      *   **Lewis Machinery:** Consistent with Lewis's evolutionary account of convention emergence, but doesn't require the full coordination structure. Focuses solely on origin, not current function or reasons.

  *   **Reading 5 (Semantic Stipulation - Verbal Dispute):** *R (e.g., meaning of a logical constant) is a matter of definitional stipulation within a system. Disagreement arises from using different definitions.*
      *   **Alternative:** Yes, different definitions/stipulations are possible.
      *   **Origin:** Typically by explicit or implicit agreement/stipulation.
      *   **Reasons to conform:** To communicate successfully within the system using shared definitions.
      *   **Changeability:** Changeable by re-stipulation.
      *   **Dispute Nature:** Merely verbal; the real disagreement is about which system to use, not truth within a system.
      *   **Lewis Machinery:** Weak connection. Lewisian conventions can underpin semantic practices, but semantic stipulation itself isn't necessarily a solution to a coordination problem *with common interest* (e.g., logical constants might reflect deeper epistemic commitments). Fails common interest and conditional preference structure if tied to fundamental norms.

  *   **Reading 6 (No Fact of the Matter):** *There is no objective truth or correctness concerning R vs. R'; both are equally valid options.*
      *   **Alternative:** Yes, and they are *epistemically/metaphysically* equivalent.
      *   **Origin:** Irrelevant to the metaphysical claim.
      *   **Reasons to conform:** Social/pragmatic reasons only, reflecting no deeper correctness.
      *   **Changeability:** Trivially true given no correctness condition.
      *   **Dispute Nature:** Non-factual; no truth to discover.
      *   **Lewis Machinery:** Contradicts Lewis. Lewisian arbitrariness ("could have been otherwise") is *not* equivalence. A convention being arbitrary doesn't make alternatives *correct* or *equally valid* once a convention is established, nor deny facts *about* the convention. This reading inflates arbitrariness into anti-realism.

  **2. Verdicts:**

  *   **R1 (Coordination Solution):** Substantive and defensible. (True for author-order, false for logic - see point 4).
  *   **R2 (Mere Regularity):** Platitude (trivially true for many practices, but uninformative). (True for both, but vacuous).
  *   **R3 (Normative Insignificance):** Substantive and questionable. Defensible for practices like author-order (no deep moral weight), but *highly* questionable for logic, conflating convention with normativity. Lewisian conformity reasons *are* genuine reasons.
  *   **R4 (Genealogical Explanation):** Substantive and defensible. (True for both author-order *and* logic's historical development, but doesn't settle normativity).
  *   **R5 (Semantic Stipulation):** Substantive and defensible *for defined terms within formal systems*. Questionable when applied to core logical laws (is LEM *just* a stipulation about 'or'/'not'? Or constitutive of classical truth?). (Plausible for some logical rules, false for author-order).
  *   **R6 (No Fact of the Matter):** Substantive and false. Misconstrues arbitrariness as equivalence/anti-realism. There *are* facts about which convention holds, its function, and the reasons it generates. (False for both).

  **3. Licensing Dismissal in Logic Seminar & Lewis on Logic:**

  *   **Which readings license dismissal?** Primarily **R3 (Normative Insignificance)** and **R6 (No Fact of the Matter)**, with **R5 (Semantic Stipulation)** offering a weaker dismissal ("you're using different rules").
  *   **Lewis's Arbitrariness ≠ Entitlement/Equivalence/Non-Factuality:**
      *   Lewisian arbitrariness means *the same coordination benefits* could have been achieved by a different regularity *in the past*. It does **not** mean:
          *   **No Fact of the Matter:** There *is* a fact about what the current convention is and the reasons it generates.
          *   **Both Entitled:** Conformity to the *established* convention generates reasons; using an alternative *within the same linguistic community* often causes coordination failure. The intuitionist isn't entitled to disrupt the established practice without cost.
          *   **Merely Verbal:** Disagreement about *which logical rules to adopt as fundamental* is often substantive, concerning truth, proof, and the meaning of concepts, not just words.
  *   **Genealogy (R4):** Does **not** support R3 or R6. Explaining how a norm arose doesn't determine its current justification or force (Genetic Fallacy). Logic's historical development doesn't entail it lacks rational foundation *now*.
  *   **Does Logic Fit Lewisian Convention?** **Unlikely, in my judgment.** Logic lacks the core Lewisian structure:
      *   **Recurrent Coordination Problem?** While communication needs coordination, adhering to *classical* logic specifically isn't solving a problem like "which side of the road to drive on." Alternatives (intuitionism, paraconsistency) exist and function.
      *   **Common Interest?** Do classicists and intuitionists share a *common interest* in using the *same specific rules*, regardless of what they are? Arguably not; they have competing views on fundamental norms of reasoning and truth. The interest is in reasoning *correctly*, not just *similarly*.
      *   **Preference to Conform Conditional on Others?** A logician doesn't prefer classical logic *just because others use it*; they believe it's *correct*. Conditional preference is weak here.
      *   **Arbitrariness Clause (Lewis Sense)?** While different logics are possible, it's highly contentious whether they are "arbitrary" in the sense of being *equally good solutions to the same coordination problem*. Proponents believe their logic tracks truth/reason better.
  *   **What Governs Logic?** Logic likely involves **constitutive rules** (defining what counts as valid reasoning/assertion within a framework) and **epistemic norms** (norms about correct inference and truth-tracking). The slogan borrows "convention" vocabulary, but the underlying structure differs fundamentally from coordination conventions. The dispute is about these constitutive/epistemic norms.

  **4. Operative in Author-Ordering & Where Cases Diverge:**

  *   **Author-Ordering:** Clearly fits **R1 (Coordination Solution)**. It solves a pure coordination problem (listing authors unambiguously) with multiple arbitrary solutions (alpha, contribution, random lot). There's a clear common interest in *having a single standard*, and strong preference to conform conditionally. R2, R3, R4 also apply trivially. R5 and R6 do not.
  *   **Where They Diverge:** The core divergence is the **nature of the "problem" being solved** and the **source of the normativity**:
      *   **Author-Ordering:** Solves a *pure coordination problem* (common interest in coordinated action). Normativity is purely *instrumental* (achieve coordination).
      *   **Logic (Classical vs. Intuitionist):** Concerns *constitutive rules of reasoning/assertion* and *epistemic norms about truth and proof*. Normativity is (arguably) *internal to the practice of reasoning* or tied to truth-tracking. The disagreement is about the *correctness* of these norms, not just which arbitrary standard coordinates us. The Lewisian structure of common interest in coordination *regardless of the standard* is absent. The double-negation translation shows a technical *mapping*, not that the systems are equally valid solutions to the same coordination problem.

  **5. Strongest Lewisian Claim for Logic Speaker & Engagement:**

  *   **Strongest Defensible Lewisian Claim:** "Our *widespread adherence to classical logic within this community* functions *like* a convention in that it coordinates our inferential practices and communication, and *a different widespread adherence* (e.g., to intuitionism) *could have served that coordinating function instead*. However, this doesn't show classical logic is normatively insignificant or that there's no fact of the matter about which logical laws best capture truth or valid reasoning. The double-negation translation preserves theoremhood but arguably alters meaning and loses distinctions you find important."
      *   *Verdict:* Substantive and defensible *as far as it goes*, but very limited. It acknowledges the coordinating *effect* of shared practice and weak arbitrariness (historically, other logics could have dominated), but explicitly denies R3 and R6. It leaves the intuitionist's core objection about truth, proof, and meaning fully intact.
  *   **What to Say Next to Engage:** "So, your objection isn't just that we use a different convention; it's that using classical logic leads us to make assertions that, by your lights, lack constructive warrant or misrepresent the nature of mathematical truth. Could you explain why you take the distinction between a statement and its double negation to be crucial for understanding mathematics? And what do you see as the fundamental epistemic cost of accepting non-constructive existence proofs via LEM?" *This moves the discussion to the substantive philosophical disagreement about truth, justification, and the nature of mathematics, which was obscured by the "just a convention" dismissal.*

  **Explicit Judgment Calls:**
  1.  **Logic as Non-Lewisian:** The claim that logic does not fit the Lewisian coordination convention structure is my substantive judgment, based on the lack of a clear common interest in coordination *regardless of the standard* and the presence of competing fundamental epistemic commitments. This is not universally accepted (some formalists or certain Wittgensteinians might disagree).
  2.  **Normative Insignificance (R3) for Logic:** The judgment that R3 is highly questionable for logic is substantive. It rejects logical expressivism or radical conventionalism about logical truth.
  3.  **Genealogy ≠ Justification:** Insisting that R4 (genealogy) does not support R3/R6 is a rejection of the genetic fallacy, a standard philosophical point, but crucial here.
  4.  **Strongest Claim:** Formulating the strongest *defensible* Lewisian claim for the logic speaker involves limiting it to the *sociological fact* of coordination via shared practice + weak historical arbitrariness, explicitly severing it from claims about normative equivalence or non-factuality. This is a careful parsing of Lewis's actual claims.
