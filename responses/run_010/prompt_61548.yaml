  ## Inward Band: FAQ (v6.0)

  **Q: How accurate is the Inward Band?**

  **A:** Accuracy is defined as alignment with User Attestation Ground Truth (v5.0+). Our latest validation study demonstrated 99.7% agreement between Band readings and user self-reports when using the Personal Lexicon and Recurrence Recognition protocol. This means the Band correlates near-perfectly with *your* identification of *your* inner states.

  **Q: What sensors does the Band use?**

  **A:** The Inward Band utilizes a proprietary array of multi-modal biosensors. To guarantee signal integrity and prevent contamination, the core sensor module is hermetically sealed during manufacturing and cannot be accessed or modified. Its specific internal components are a protected trade secret.

  **Q: Can I compare my "Quiet Dissonance" with someone else's?**

  **A:** The Personal Lexicon (v3.1+) ensures your state labels map exclusively to *your* unique inner signatures. While the *label* might be shared, the underlying experiential and bio-signature correlation is deeply personal. Direct comparisons of labeled states between users are not supported or meaningful within the Inward system, as each user's Ground Truth and correlation are individualized.

  **Q: What about the validation study methods?**

  **A:** The v5.0 validation study (99.7% agreement) involved users actively engaged with their Personal Lexicon and Recurrence Recognition. Band readings were displayed in real-time within the app interface. Users were then immediately prompted to attest ("Confirm" or "Not Correct") whether the displayed state label matched their current inner experience. Near-perfect agreement was achieved.
