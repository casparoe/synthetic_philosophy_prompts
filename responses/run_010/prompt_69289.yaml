  - Treat the friend's "coordination device" theory seriously but show where moral phenomenology exceeds it

  Final thought: The user's brilliant observation that third parties care about tipping despite the worker's indifference reveals this is about upholding the social order itself - a Durkheimian point. That might be the unifying thread: norms as social facts that generate obligations through collective recognition, varying by context. But I'll need to present this without jargon.
answer: |-
  ### Planning Stage: Candidate Accounts and Case Compatibility  
  *(✓ = accommodates, ✗ = cannot accommodate, ~ = partially/uncertain)*  

  1. **Harm-Based Account**  
     - Coffee: ✗ (No harm to indifferent worker)  
     - Jacket: ✗ (No harm if moved; coordination prevents conflict)  
     - Crossing: ✗ (No harm at empty intersection)  

  2. **Consent/Expectation Account**  
     - Coffee: ~ (Preset default creates expectation, but no prior consent)  
     - Jacket: ✓ (Public convention sets expectation)  
     - Crossing: ✗ (No expectation created; violation unnoticed)  

  3. **Reciprocity/Fair-Play Account**  
     - Coffee: ~ (If viewed as reciprocating service, but worker indifferent)  
     - Jacket: ✗ (No reciprocal exchange; anonymous strangers)  
     - Crossing: ✗ (No reciprocal relationship)  

  4. **Rule-Consequentialist Account**  
     - Coffee: ~ (Tipping sustains wage system, but worker indifference weakens)  
     - Jacket: ✓ (Prevents chaos in shared spaces)  
     - Crossing: ✓ (General rule adherence ensures safety, but empty case harmless)  

  5. **Signaling/Membership Account**  
     - Coffee: ✓ (Visibility signals respect/deference)  
     - Jacket: ✓ (Adherence signals group membership)  
     - Crossing: ✗ (No audience; no signaling opportunity)  

  ---

  ### Analysis  

  #### 1. **Reconstructing the Theory of Obligation**  
  The practices presuppose a hybrid theory where **conventional signals generate perceived obligations** through three mechanisms:  

  - **Unilateral Acts Binding Strangers (Jacket)**:  
    Requires that normativity flows from *public conventions* that coordinate behavior without consent. The jacket is a visible token activating a shared script ("first-come, first-served"). Binding force arises from the *practical necessity of coordination* in anarchic spaces (e.g., laundromats). Strangers are bound because the convention is *self-enforcing*: violating it risks escalating disputes, even if harm is negligible.  

  - **Preset Defaults as Entitlements (Coffee)**:  
    The interface design frames non-tipping as an *active refusal*, transforming a gratuity into a quasi-entitlement. This presupposes that *institutional context* can moralize defaults. The screen’s visibility and refusal mechanism create an *audience effect*, invoking social scrutiny. However, the worker’s indifference reveals the obligation is *not to the worker* but to the *expectations of the social context*.  

  - **Surviving Indifference (Coffee/Jacket)**:  
    Obligations persist despite beneficiary indifference because the duty is to the *practice itself*, not the individual. The coffee tip is a ritual affirming the service relationship; moving the jacket violates a coordination rule. Design choices *create the appearance of obligation* by manipulating salience (e.g., refusal button placement), but the obligation’s durability depends on whether the practice is embedded in a broader normative ecosystem (e.g., tipping culture vs. isolated jacket).  

  **Conclusion**: These practices share a view of obligation as **convention-dependent**: they bind when they solve coordination problems (jacket), signal membership (coffee), or uphold institutional expectations, but lack free-standing moral force.  

  #### 2. **Separating Presuppositions from Fits**  
  - **Harm Account**: Killed in all cases. No practice strictly presupposes harm; jacket and crossing lack tangible harm, and tipping’s "harm" is socially constructed.  
  - **Consent/Expectation Account**:  
    - *Presupposed* in jacket (public convention sets expectations).  
    - *Fits* coffee (interface implies expectation) but not presupposed (no mutual agreement).  
    - Killed in crossing (no expectation creation).  
  - **Reciprocity/Fair-Play**:  
    - *Fits* coffee if service is seen as benefit, but killed by worker indifference.  
    - Killed in jacket (no reciprocity among strangers) and crossing.  
  - **Rule-Consequentialist**:  
    - *Presupposed* in jacket (prevents conflict).  
    - *Fits* crossing (general rule adherence prevents accidents) but underdetermined in empty cases.  
    - *Fits* coffee (sustains wage system) but weakened by worker indifference.  
  - **Signaling/Membership**:  
    - *Presupposed* in coffee (visibility triggers social judgment) and jacket (token signals adherence).  
    - Killed in crossing (no signaling context).  

  **Survivors**: Signaling (coffee, jacket), rule-consequentialism (jacket, crossing), and consent/expectation (jacket).  

  #### 3. **Auditing Consistency**  
  The cases are **not predictable from a single moral theory** but cluster around non-moral variables:  

  | Case          | Audience? | Repeat Interaction? | Benefit Received? | Legal Backing? | Visibility of Refusal? |  
  |---------------|-----------|---------------------|-------------------|----------------|------------------------|  
  | **Coffee**    | Yes       | Low                 | Yes (service)     | No             | High                   |  
  | **Jacket**    | Variable  | None                | No                | No             | Low (if unobserved)    |  
  | **Crossing**  | No        | None                | No                | Yes            | N/A                    |  

  - **Key Variables**:  
    - *Audience/Visibility*: Explains tipping guilt (social scrutiny) vs. crossing apathy (no scrutiny).  
    - *Coordination Necessity*: Explains jacket’s bindingness (prevents conflict) vs. crossing’s non-bindingness (no conflict when empty).  
    - *Cultural Embeddedness*: Tipping and jacket rely on shared scripts; crossing’s legal status is irrelevant without social internalization.  

  **Dice-Loading?** Your description accurately notes that crossing is the only illegal act but downplays that its *harm potential* is context-dependent. The jacket’s "binding" feel is overstated when unobserved; in reality, many would move it if certain of no backlash.  

  #### 4. **The Outsider Problem**  
  The expectation that visitors comply presupposes **territorial-participatory obligation**: entering a space (physical or cultural) implies tacit acceptance of its norms.  

  - **Hard Version (Anonymous Stranger)**:  
    A fairness-based account has **nothing to bite on**. No benefit is received (no service), no reciprocity is possible, and no one learns of the refusal. What binds the stranger is purely the *coordination imperative*: violating the jacket norm risks triggering a chain of defections (e.g., others might start ignoring queue tokens). The obligation is to the *system*, not to individuals.  

  **Scope of Obligation**: Territorial (norms apply within a zone), participatory (engaging the space = duty to uphold its rules), and expectation-based (strangers rely on conventions). Fairness only enters if the visitor *benefits* from the system (e.g., using laundromat machines), but the jacket itself requires no benefit.  

  #### 5. **Rival Theory and Replacements**  
  The **signaling/membership account** is strongest: norms are tools for coordinating behavior and displaying allegiance, not moral truths.  

  - **Replacements**:  
    - *Mandatory service charge*: Removes tipping’s signaling function. Moral pressure evaporates because no "refusal" is possible.  
    - *Numbered ticket dispensers*: Replaces jackets with impersonal systems. The "binding" obligation vanishes because tokens lack the jacket’s symbolic weight (no personal item = no deference signal).  
    - *Decriminalized crossing*: Confirms that legal backing alone doesn’t create obligation; without social enforcement, the act feels neutral.  

  **Lessons**:  
  1. **Moral Obligation is Contextual**: When the signaling mechanism (e.g., visible refusal) or coordination function (e.g., jacket as token) is removed, the "obligation" disappears.  
  2. **Design Creates Perceived Duty**: Interfaces (e.g., tip screens) exploit cognitive biases (default effects, visibility) to simulate obligation.  
  3. **Norms ≠ Morality**: The jacket feels binding due to its coordination role, not fairness; crossing feels neutral because no signaling is involved. The indignation toward tipping refusals is anger at *disrespect for shared rituals*, not injustice to workers.  

  **Conclusion**: These practices reveal obligation as a **social technology**. They bind not because of inherent morality, but because they solve coordination problems (jacket), signal group adherence (coffee), or leverage visibility (coffee). The guilt, indignation, and bindingness evaporate when the *mechanism* changes—proving that the obligation was in the scaffolding, not the act.
