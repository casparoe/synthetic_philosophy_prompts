    However, what if we allowed the two players to use different strategies? Then they might coordinate? But in the real problem, the driver cannot condition his second decision on the first because he doesn't remember. So the two instances must use the same strategy. Therefore, we should instruct the students that they are both the same driver and must use the same strategy? In the first rounds, we don't specify that. We let them choose independently. But then we might see asymmetric strategies? 

    The problem says: the driver is using a strategy that he must commit to. So in the real problem, the driver chooses a strategy (a single p) for both exits. In our game, we have two players, but they should be forced to use the same p? 

    We can do that by having the class (or the driver) choose a p for the round, and then each student uses that p. But then we lose the individual decision making.

    Alternatively, we can have each student choose their own p? But then they might not choose the same. And if they choose different, then the outcome might be different.

    How to enforce symmetry? We can tell the students that they are both the same driver and must use the same strategy. So they must both use the same p? But then how do they choose p? They have to agree? But they are in separate corners and cannot communicate.

    This is a problem. So the staging might break the symmetry requirement.

    To fix: We can have the entire class (the rest of the class) decide the strategy (a p) for the driver. Then both students use that p. Then we run the round. That way, we have the same strategy for both.

    But then the two students are just carrying out the class's plan. They don't make individual decisions.

    Alternatively, we can run the first few rounds without the mixed strategy: each student chooses a pure strategy (EXIT or CONTINUE) independently. Then we see what happens. Then for the mixed strategy round, we let the class choose a p and then each student uses that p (with a random device). Then we run a round.

    I think that's acceptable.

    Revised:

    - In rounds 1-3: each student chooses independently (they are the same driver but they don't coordinate and they don't know the other's choice). They are told: "You are the driver at the intersection you are at. You don't know if it's the first or second. You want to maximize the overall payoff. Write EXIT or CONTINUE."

    - Then we run and see the outcomes.

    - Then we explain that the driver must commit to a strategy in advance. So we ask the class: what strategy should the driver commit to? They discuss and then we present the optimal p=5/8.

    - Then for round 4: the class chooses p=5/8. Then both students use that p independently (each rolls a d8 and chooses based on the roll). Then we run the round.

    - We can run several such rounds (rounds 4,5,6) to see the average.

  What will go wrong with smartasses:

  1. A student might say: "I am at the second exit, so I should exit." But they don't know. They might try to reason that they are more likely to be at the first exit? Actually, by symmetry, they are equally likely. But if the driver at the first exit exits with probability p, then the driver at the second exit is reached only with probability (1-p). So the unconditional probability of being at the first exit is 1/2, but the probability of being at the first exit given that they are making a decision is ...? Actually, the driver always makes a decision at the first exit. At the second exit, they only make a decision if the first exit was continued. So in reality, there are more decisions made at the first exit? But in our staging, we are forcing both to make a decision simultaneously. This is a deviation.

    How to address? We are modeling the two instances as if they both get to act, but in reality the second instance might not be reached. But in the scoring, we account for that.

    A smart student might argue: "I know that if I am at the second exit, then the first exit must have continued. So I can condition on that." But note: the driver at the second exit knows that he is at the second exit? No, he doesn't. The problem states that he cannot tell one exit from the other. So he doesn't know if he is at the first or second. Therefore, he doesn't know if the other exit was reached or not.

    But in our setup, we are not giving any information. So they are symmetric.

  2. Another issue: the two students might try to coordinate. But we put them in separate corners and they write simultaneously and sealed. So they cannot.

  3. They might not take it seriously and just choose randomly without thinking.

  Debrief points:

  - The gap between planning and in-the-moment is not about willpower. It's about the lack of information. Even if you have perfect willpower to stick to the plan, the plan is a mixed strategy because that is the best you can do given the lack of information.

  - The problem is a classic example of a decision problem with imperfect recall.

  - The staging we used (two simultaneous players) captures the essence because the two instances of the driver are informationally separated and must use the same strategy (if we enforce symmetry).

  But note: in the real world, the driver is one person. The two instances are linked by the fact that they are the same person and must use the same strategy. Our staging with two players and no communication enforces that they don't coordinate, but they might choose different strategies. So we must rely on the symmetry and the common interest to lead them to the same strategy? Or we enforce symmetry by having the class choose the strategy.

  Revised activity with timeline:

  Total: 75 minutes.

  1. (5 min) Introduction: The story and the payoffs.

  2. (10 min) Explain rules for one round:
     - Two volunteers go to corners.
     - Coin flip (secret) to assign positions.
     - Each writes EXIT or CONTINUE without knowing position or other's choice, seals in envelope.
     - Collect envelopes.
     - Reveal positions.
     - Open envelope of exit1:
          - If EXIT: payoff=1, done.
          - If CONTINUE: open envelope of exit2: if EXIT: 4; if CONTINUE: 0.

  3. (15 min) Round 1: Run with one pair. Discuss: ask each why they chose what they did. Record payoff.

  4. (10 min) Round 2: New pair. Same. Discuss.

  5. (10 min) Round 3: New pair. Same. Discuss.

  6. (10 min) Now, tell the class: the driver must commit to a strategy in advance. What should it be? Let them discuss in small groups (3 min). Then take suggestions. If they suggest a pure strategy, run the numbers:

    - Always EXIT: then if at exit1: 1, if at exit2: 1? But wait: if the driver always exits, then if at exit1 he gets 1, and if at exit2 he also exits so gets 4? But no: he doesn't know where he is. If he is at exit1 and exits, he gets 1 and doesn't reach exit2. If he is at exit2, he exits and gets 4. But the problem: he doesn't know which one he is at. So if he always exits, then:
          At exit1: exits -> 1.
          At exit2: only reached if exit1 continued -> but if he always exits, then at exit1 he exits, so he never reaches exit2. So the outcome: he always takes the first exit -> 1.

    - Always CONTINUE: then at exit1: continue -> go to exit2. At exit2: continue -> 0. So 0.

    - Mixed strategy: we have calculated p=5/8.

    Present the calculation briefly.

  7. (10 min) Now, we run three rounds with the optimal strategy. The class decides p=5/8. For each round, we choose two new students. They are told: "You must use the strategy: EXIT with probability 5/8, CONTINUE with 3/8." They each get a random device (d8: 1-5 EXIT, 6-8 CONTINUE). They roll in their corner and write the result. Then we proceed as before.

    We run three such rounds and record the payoff each time. Then we average.

  8. (5 min) Debrief:

    - What was the average payoff over the three optimal rounds? (Hopefully around 1.56)

    - Why isn't it rational to always continue at the first exit? Because then you might be at the second exit and continue and get 0.

    - Why isn't it rational to always exit? Because then you get only 1 even when you are at the second exit? But note: if you are at the second exit, you would want to exit, but you don't know. And if you always exit, you only get 1 because you exit at the first.

    - The mixed strategy is the best you can do.

    - The gap between planning and in-the-moment: 
          At the planning stage, you choose p=5/8.
          Once at an exit, if you could condition on being at the first exit, you would want to continue (because you expect to get 4 at the next one). But if you could condition on being at the second, you would exit. But you can't condition, so you stick to the plan.

    - This is not a willpower problem: it's an information problem.

  What the staging destroys:

    In the real problem, the driver at the first exit, if he continues, then he becomes the driver at the second exit. In our model, they are two different people. But because they are forced to use the same strategy (by the class's decision) and they are both trying to maximize the same objective, it is equivalent. However, if we had allowed the two students to choose different strategies, it would not match the real problem. We fixed that by having the class choose the strategy for both.

  What might go wrong:

    - Students might not understand why they are forced to use the same strategy. Explain: because it's the same driver at both exits, and he has to commit to a plan in advance.

    - The random device might fail (e.g., not having d8). Solution: use two coins to generate 4 outcomes, and then assign 5 out of 8? Or use a hat with 5 red and 3 blue marbles.

    - The average in the three optimal rounds might not be close to 1.56. Solution: explain that with more rounds it would converge.

    - A student might say: "But if I am at the first exit, I should continue because I want the 4." But then the next student (if they are at the second exit) might also think that and continue, and then get 0. So that's why we need the mixed strategy.

    - Another issue: the driver at the second exit might feel cheated if the first exit exited and he didn't get to act. But in our staging, he still wrote an action. Be clear that the action at the second exit only counts if the first exit continued.

  This should work.
