  ### Absent-Minded Driver Classroom Activity  
  **Core Idea**: Simulate the tension between pre-commitment planning and in-the-moment decisions using two students as simultaneous "instances" of the driver. Students confront the paradox firsthand: what’s optimal to plan isn’t always what feels rational when you’re at an intersection.  

  ---

  ### **Quick Arithmetic**  
  *Using your original payoffs (1st exit: 1, 2nd exit: 4, both missed: 0)*:  
  - **Optimal plan from the driveway**: Exit with probability \( p = \frac{5}{8} \) (62.5%).  
    - Expected payoff: \( E = 5p - 4p^2 \). Maximized at \( p = \frac{5}{8} \), yielding \( E = 1.5625 \).  
  - **At an intersection, given belief about the other instance**:  
    - If a student believes the other exits with probability \( q \):  
      - Expected payoff for EXIT: \( 2.5 - 2q \)  
      - Expected payoff for CONTINUE: \( 2q \)  
    - **Best response**: EXIT if \( q < 0.625 \), CONTINUE if \( q > 0.625 \). Indifferent if \( q = 0.625 \).  
    - *Key insight*: At equilibrium (\( q = 0.625 \)), the student is indifferent—highlighting the need for randomization.  

  **Adjusting payoffs for d6**:  
  - Change payoffs to **1st exit: 2, 2nd exit: 3, both missed: 0**.  
  - Optimal \( p = \frac{5}{6} \) (≈83.3%, roll 1–5 on d6 for EXIT, 6 for CONTINUE).  
  - Expected payoff: \( E = 5p - 3p^2 \), maximized at \( p = \frac{5}{6} \), yielding \( E \approx 2.083 \).  
  - *Trade-off*: Less dramatic tension (smaller payoff spread), but dice-friendly. Use this if d8s are unavailable.  

  ---

  ### **Activity Design**  
  **Rules & Roles**  
  - **Students**: 2 volunteers per round ("Driver Instance A" and "Driver Instance B"). Others observe.  
  - **Setup**:  
    - A coin flip (hidden) assigns who is at Exit 1 or Exit 2. **Do not reveal positions yet**.  
    - A and B go to separate corners, receive sealed envelopes and slips.  
  - **Decision**:  
    - Each writes "EXIT" or "CONTINUE" on their slip **without knowing their position or the other’s choice**.  
    - Slips are sealed in envelopes and handed to you.  
  - **Revelation & Scoring**:  
    - Reveal the coin flip (who is at Exit 1/Exit 2).  
    - Open Exit 1’s envelope:  
      - If EXIT, payoff = 1 (ignore Exit 2’s choice).  
      - If CONTINUE, open Exit 2’s envelope:  
        - EXIT → payoff = 4  
        - CONTINUE → payoff = 0  
  - **Points**: Track payoffs on the board. No real money—use bragging rights or candy. Goal: Maximize class average.  

  **Timeline (75 min total)**  
  1. **Intro (10 min)**: Explain the scenario, payoffs, and rules. Emphasize: "You can’t tell which exit you’re at, and you can’t remember past decisions."  
  2. **Practice Round (10 min)**: Run with one volunteer pair. Demo the flow, but discard results.  
  3. **Rounds 1–3 (30 min, 10 min each)**:  
     - New pair each round.  
     - Students decide simultaneously → reveal positions → score.  
     - **Debrief after each round**: Ask:  
       - *"Why did you choose that?"* (They’ll say: "I hoped I was at Exit 2," or "I didn’t want to miss both.")  
       - *"What would you change if you could plan ahead?"*  
  4. **Optimal Strategy Round (15 min)**:  
     - Announce: "Now we commit to a plan from the driveway."  
     - Class chooses optimal mixed strategy:  
       - Original payoffs: \( p = \frac{5}{8} \) (use d8: 1–5 = EXIT, 6–8 = CONTINUE).  
       - Adjusted payoffs: \( p = \frac{5}{6} \) (d6: 1–5 = EXIT, 6 = CONTINUE).  
     - Run 2–3 rounds with new pairs using dice. Record payoffs and average.  
  5. **Final Debrief (10 min)**:  
     - Compare payoffs: Pure strategies (always EXIT → 1; always CONTINUE → 0) vs. optimal mix (~1.56 or ~2.08).  
     - **Map moments to key insights**:  
       - *Planning vs. in-the-moment*:  
         - In rounds 1–3, students likely favored CONTINUE (hoping for 4). But if both CONTINUE, payoff = 0.  
         - Optimal mix balances risk: Sometimes EXIT early (avoid 0), sometimes CONTINUE (chase 4).  
       - *Not a willpower problem*:  
         - Even with perfect self-control, randomization is mandatory—you lack information to do better.  
         - If you knew Exit 1, you’d always CONTINUE; at Exit 2, you’d EXIT. But you can’t know, so stick to the plan.  
       - *Why the staging works*: It crystallizes the driver’s conflict—two "selves" with identical goals but no communication.  

  ---

  ### **Critical Notes**  
  **What the Staging Destroys (and How to Fix It)**  
  - **Destroys**: The sequential dependency (Exit 2 is only reached if Exit 1 continues). In your setup, both students decide simultaneously, so Exit 2’s choice is always "logged" (though ignored if Exit 1 exits). This obscures that Exit 2’s decision is contingent.  
  - **Variant to restore sequence**:  
    - **Recruit Exit 2 conditionally**: Only bring in the second student if Exit 1’s slip says CONTINUE.  
    - *How*:  
      1. Exit 1 decides alone (writes EXIT/CONTINUE, seals it).  
      2. You open it. If EXIT, game over (payoff = 1).  
      3. If CONTINUE, recruit a *new* student for Exit 2 (they decide without knowing Exit 1’s choice or position).  
    - *Why better*: Matches the real problem’s structure—Exit 2’s instance only exists if needed.  
    - *Trade-off*: Adds 2–3 minutes per round. Use if time allows.  

  **Predictable Problems (and Solutions)**  
  - **"Smartass" Pitfalls**:  
    1. *Students coordinate*: E.g., A always CONTINUES, B always EXITS.  
       - **Mitigation**: Emphasize: "You’re the *same driver*—no winks or signals!" Enforce silence/separation.  
    2. *"I’ll just always CONTINUE to chase 4!"*: This leads to 0 when both do it.  
       - **Use data**: After rounds 1–3, show the class how often this failed.  
    3. *"But if I’m at Exit 2, I should EXIT!"*:  
       - Retort: "True, but you don’t *know* that. If you EXIT at Exit 1, you only get 1."  
    4. *Mixed-strategy skepticism*: "Randomness feels irrational."  
       - **Debrief weapon**: "If you could do better without randomness, what’s your pure strategy?" (Spoiler: None work.)  
  - **Other issues**:  
    - Dice confusion: Pre-roll examples to teach d6/d8 usage.  
    - Low engagement: Assign observers to track payoffs or bet on outcomes.  

  ---

  **Run it Tuesday**: You’ve got this! The setup is low-prep (paper, envelopes, dice, coin), and the "aha" moment—when they see the optimal plan requires dice—makes formalism unforgettable.
