answer: |-
  ### Constraints from Neurath's View:
  1. Pictorial statistics must stand alone visually, so verbal introduction must avoid describing specific panels.  
  2. Words should frame, not interpret, letting graphics remain primary communicators.  
  3. Picture language simplifies complexity accessibly; speech must mirror that clarity.  
  4. Isotype is auxiliary to verbal reasoning, not its replacement—introduction must demonstrate partnership.  
  *Tensions:* Constraint 1 (visual independence) pulls against Constraint 2 (verbal framing), requiring balance where words contextualize without encroaching.  

  ---

  ### Speech (348 words)  

  Good evening. I’m honored to speak where images hold the stage—though as a novelist, I confess relief that tonight’s *only* speaking lasts three minutes.  

  We celebrate forty panels and their creator, my friend [Designer’s Name]. For thirty years, her charts for our health department didn’t just display data; they *taught* us to see our city anew. Her work honors Otto Neurath’s vision: a picture language meant not to replace words, but to *help* them. To help *us*.  

  Neurath insisted on repeating icons—not scaling them—to show magnitude. Why? Because integrity matters. One house, repeated fifty times, whispers: *fifty families*. Enlarge that house, and it lies, implying one giant household. His rules fought false precision. Pie charts? Banned. 3D effects? Forbidden. Each choice was ethical: show what *is*, transparently.  

  But Neurath knew limits. These panels—like [Designer’s Name]’s masterful tuberculosis timeline—reveal what *was* and *where*. Yet they cannot say what *wasn’t*: the deaths averted by vaccines she helped promote. They show correlation—neighborhoods, years, cases aligned—but leave causation to *us*. To our words, our policies, our science.  

  That’s the genius. Isotype doesn’t lecture; it *invites*. It gives us shared ground—a child can grasp a row of house icons—then steps aside so we may ask: *Why? What if? What next?*  

  [Designer’s Name]’s legacy is this generosity. Her charts never pretended to be complete. They stood, as Neurath asked, “on their own but never alone”—sparking conversations in clinics, council chambers, and community halls. Tonight, her final exhibition does the same.  

  So raise a glass—yes, even you historians eying the bar—to a woman who turned statistics into stories, and data into care. Her pictures spoke for those unheard. Now, let’s return the favor: look, then talk.  

  Thank you, [Designer’s Name]. Your icons outshine my adjectives. Always have.  

  ---

  ### Confidence & Caveats (78 words)  
  I’m highly confident in the core account: Neurath saw Isotype as auxiliary to verbal reasoning, prioritizing clarity and ethical representation. The key tension—images showing *what is* versus words exploring *what isn’t*—aligns with his rejection of causal claims in visuals. Least certain point: Neurath’s team *did* imply causation through sequenced panels (e.g., poverty → disease). I took minor liberty downplaying this, emphasizing his written warnings against overinterpretation. Folk memory sometimes conflates his strict rules with modern data-viz principles, but the speech stays grounded in his texts.
