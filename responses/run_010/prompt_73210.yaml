prompt: |-
  I'm a third-year econ PhD student working on choice under ambiguity — states, acts, consequences, preference orderings, choice functions, feasible sets, and basically nothing else. A friend in the philosophy department roped me into a reading group on the ethics of nuclear weapons, and we've just spent two weeks on Anscombe: the campaign she ran in 1956 against Oxford giving Truman an honorary degree, the pamphlet she put out for it, and then the 1958 paper where she coins the word consequentialism and argues the whole post-Sidgwick tradition amounts to one and the same thing. I can follow her, but I can't hold the argument in my head in my own terms, which means I keep nodding along in seminar without actually knowing what I'd be committing to. So: translate her position into my vocabulary, as literally as you can manage, and then give me the residue report.

  Here's the position as I understand it, so you don't have to guess what I'm pointing at. (i) Choosing to kill the innocent is never right, whatever good it produces — no amount of weighing gets you across that line, because the line isn't a weight. (ii) In Hiroshima and Nagasaki the civilian deaths weren't a regrettable side-effect of destroying a city; killing the population was the mechanism by which the intended end (surrender, and so avoiding an invasion) was supposed to be produced, so the intended/merely-foreseen distinction doesn't rescue the decision — it convicts it. (iii) Therefore Truman committed murder, and honouring him is not neutral: conferring the degree is itself a kind of participation in it, which is why she thought the vote mattered and not just the bombing. (iv) Consequentialism isn't a rival decision procedure that happens to reach different verdicts; it's a rationalisation that gets deployed precisely when the act can't be defended any other way, and the appeal to the balance of consequences is itself a symptom. (v) Doing and allowing aren't morally equivalent, so the "but if you don't bomb, far more people die in the invasion" move doesn't have the shape she thinks its proponents assume it has. Underwrite all of that with her account of action: acts are individuated by the descriptions under which they're intentional, not by the physical events they cause.

  Now the asks. Go claim by claim, and for each say whether it translates cleanly, translates only with distortion, or has no expression at all in my framework. Specifically: which of these become constraints on the feasible set rather than terms in the objective function, and does that move already cheat, given that a constraint on a choice set is behaviourally indistinguishable from a sufficiently strong preference and revealed preference flattens the two together? Does the intended/foreseen distinction have any purchase on act-individuation — my tools individuate acts by their state-contingent outcome maps, so two courses of action with the same outcome map are the same act for evaluative purposes, whereas she needs the identical physical outcome to be murder under one description and not under another; is there anything in the toolbox (Sen's rational fools move, commitment as against sympathy, or writing the choice problem with acts described causally rather than consequentially) that gives her a slot, or is the framework structurally blind here? How should I render the absoluteness — lexicographic ordering, infinite disutility, hard constraint — and what does each of those quietly smuggle in? Can her point about consequentialism-as-rationalisation become anything about motivated reasoning, endogenous preference formation, or the fact that the analyst picks which choice problem to write down, or is it simply inexpressible? And where does the complicity claim about the degree go, given that conferring it changes no one's outcome? Finally give me your verdict, ranked: which parts of the residue are a genuine expressive limitation of my vocabulary, and which are evidence that her position is doing something other than what it looks like it's doing. Please don't smuggle my framework's assumptions in and call it translation — above all, don't render 'never permissible' as 'very costly' and then congratulate yourself on a clean mapping. British English throughout, and skip the biography and the history, I've got that already.
reasoning: |-
  Okay, the user is an econ PhD student specializing in choice under ambiguity, seeking to translate Elizabeth Anscombe's ethical arguments against Truman's bombing of Hiroshima and Nagasaki into their formal economic framework. They've provided a clear breakdown of Anscombe's five core claims and specific questions about how these map to concepts like feasible sets, act individuation, and lexicographic ordering. 

  The challenge here is profound: bridging normative ethics (with its deontological absolutes) and positive economics (with its consequentialist foundations). User's frustration with seminar discussions is palpable—they can follow philosophically but can't operationalize it in their own toolkit. Their meta-concern about "cheating" via translation is sharp: they suspect forcing Anscombe into choice theory might distort her position.

  First, examining claim (i): the absolute prohibition on killing innocents. In choice theory, this demands either infinite disutility (problematic for continuity) or a hard constraint (but then revealed preference flattens it into extreme preference). Neither captures Anscombe's "the line isn't a weight" insight. The residue here feels genuine—choice theory structurally can't handle non-archimedean values.

  For claim (ii): the intended/foreseen distinction. User's act-individuation via outcome maps directly contradicts Anscombe's description-dependence. Sen's commitment might offer a hook, but it's still preference-based. This seems like a framework limitation—economics reduces all acts to consequences.

  Claim (iii) about complicity is fascinating. No outcome change from conferring a degree, so how to model? Perhaps as a symbolic act altering the choice set's "permissibility tags," but that feels ad hoc. Another expressive gap.

  Claim (iv) on consequentialism-as-rationalization hits hardest. If the framework assumes agents always maximize utility, calling that "rationalization" is incoherent within the model. This exposes economics' blind spot: it can't question its own rationality norms.

  Verdict time. The deepest residues—absolutes as non-weights, description-dependence of acts—are genuine limitations of the econ framework. But the rationalization point? That might reveal something richer: choice theory isn't neutral; it smuggles in consequentialism by construction. User's tools aren't just failing to capture Anscombe—they're the very target of her critique. 

  User's brilliance shows in their suspicion: "Does rendering 'never permissible' as 'infinite cost' already betray her?" Yes. Profoundly. And that betrayal is theoretically illuminating.
answer: |-
  Here’s a literal translation of Anscombe’s claims into your framework of states, acts, consequences, preferences, and choice functions, followed by a residue report. Assumptions: finite states \( S \), consequences \( C \), acts \( A \) (as functions \( A: S \rightarrow C \)), and a preference ordering \( \succsim \) over acts. Choice function \( \mathcal{C} \) selects from feasible sets \( \mathcal{F} \subseteq A \).

  ### Claim-by-Claim Translation
  ***(i) Absolute prohibition on killing innocents***  
  - **Translation**:  
    Let \( K \) be the set of acts involving intentional killing of innocents. Anscombe requires:  
    \[
    \forall a \in K, \, \forall \mathcal{F} \subseteq A: \quad a \notin \mathcal{C}(\mathcal{F})
    \]  
    This is a **hard constraint on the choice set**: \( \mathcal{C}(\mathcal{F}) \subseteq \mathcal{F} \setminus K \).  
  - **Residue**:  
    - *Distortion*: In your framework, a constraint \( \mathcal{F} \setminus K \) is behaviorally identical to a lexicographic preference where any \( a \in K \) is infinitely worse than alternatives. But Anscombe insists this isn’t about "weight" at all—it’s a **logical exclusion**, not an extreme utility penalty.  
    - *Smuggling in*: Lexicographic ordering implies \( u(K) = -\infty \), violating continuity and archimedean axioms she’d reject as consequentialist.  

  ***(ii) Intended vs. merely foreseen consequences***  
  - **Translation**:  
    Anscombe individuates acts by *intentional descriptions*, not outcome maps. For two acts \( a_1, a_2 \) with identical outcome maps \( a_1(s) = a_2(s) \, \forall s \):  
    - \( a_1 \) = "bombing city to cause civilian deaths (intended)"  
    - \( a_2 \) = "bombing military target with foreseen civilian deaths (side-effect)"  
    She argues \( a_1 \in K \) (murder), \( a_2 \notin K \) (possibly permissible).  
  - **Residue**:  
    - **No expression** in your framework. Acts are *defined* by outcome maps. Sen’s "act description" (1977) allows labeling acts, but without normative force.  
    - *Tools attempted/failed*:  
      - **Sen’s commitment**: Fails—it still operates via preferences over descriptions.  
      - **Causal acts** (e.g., \( A: S \rightarrow \) causal chains): Closer, but still evaluates outcomes. Anscombe’s "intention" is a *sui generis* property, not reducible to causal structure.  

  ***(iii) Complicity in honoring Truman***  
  - **Translation**:  
    Conferring the degree is an act \( a_{\text{deg}} \) with consequence "honor conferred." But:  
    - Anscombe: \( a_{\text{deg}} \) shares Truman’s intention (retrospective endorsement of bombing).  
    - Your framework: \( a_{\text{deg}} \) has no causal link to deaths. If \( u(\text{honor}) > u(\text{no honor}) \), it’s chosen.  
  - **Residue**:  
    - **Distortion**: Modeling complicity requires **interdependent intentions** (e.g., "endorsing murder"). No slot for this unless you add a *social choice function* with shared responsibility, which isn’t in your toolbox.  

  ***(iv) Consequentialism as rationalisation***  
  - **Translation**:  
    Anscombe: Agents use "balance of consequences" *only* when acts fail non-consequentialist tests.  
    - Your framework: All choices *are* consequentialist by construction (max \( \mathbb{E}u(a(s)) \)).  
  - **Residue**:  
    - **Inexpressible**: Your model assumes agents maximize expected utility. Her claim attacks the *framework itself* as a post-hoc rationalisation.  
    - *Closest analog*: **Endogenous preference formation** where "consequentialist reasoning" is triggered only for acts already flagged as morally suspect. Not standard in choice theory.  

  ***(v) Doing vs. allowing***  
  - **Translation**:  
    "Not bombing" (\( a_{\neg\text{bomb}} \)) vs. "bombing" (\( a_{\text{bomb}} \)).  
    - Anscombe: \( a_{\neg\text{bomb}} \) allows deaths (possibly permissible), \( a_{\text{bomb}} \) causes deaths (murder).  
    - Your framework: Compare \( \mathbb{E}u(a_{\text{bomb}}(s)) \) and \( \mathbb{E}u(a_{\neg\text{bomb}}(s)) \). If bombing saves net lives, \( \mathbb{E}u(a_{\text{bomb}}) > \mathbb{E}u(a_{\neg\text{bomb}}) \).  
  - **Residue**:  
    - **No expression**: "Allowing" is indistinguishable from "doing" if outcomes are identical. Requires **act ontology** where omissions aren’t acts—but in your model, "not acting" is still a chosen act.  

  ---

  ### Residue Report: Genuine Limitations vs. Anscombe’s Strategy  
  **Ranked by severity of framework limitation**:  
  1. **Act individuation by intention** (Claim ii)  
     - *Genuine limitation*: Your framework’s act-outcome map **structurally erases intention**. Sen-style descriptions are inert labels without normative weight.  
  2. **Absolutes as non-weights** (Claim i)  
     - *Genuine limitation*: Hard constraints *are* lexicographic preferences in RP theory. Her "no weighing" resists formalization in *any* Archimedean system.  
  3. **Consequentialism as framework error** (Claim iv)  
     - *Mixed*: Her critique exposes that your tools **presuppose consequentialism**. The "rationalisation" charge is inexpressible because your language lacks external criteria.  
  4. **Doing vs. allowing** (Claim v)  
     - *Genuine limitation*: Without a causal/omission distinction in act definitions, no slot exists.  
  5. **Complicity without causation** (Claim iii)  
     - *Anscombe’s strategy*: Her move relies on **shared intentionality**—a concept outside choice theory, but arguably outside *any* individualist framework.  

  ---

  ### Verdict  
  - **Genuine expressive limitations** (your framework is blind):  
    - Intention-dependent act individuation.  
    - Non-Archimedean prohibitions (absolutes as logical, not quantitative).  
    - Doing vs. allowing as categorical (not outcome-dependent).  
  - **Anscombe operating beyond choice theory** (her position exploits gaps):  
    - Consequentialism-as-rationalisation: She attacks the *presuppositions* of your model, so translation fails by design.  
    - Complicity: Requires collective intentionality—not modeled in standard microfoundations.  

  **Key insight**: Anscombe’s resistance to translation isn’t accidental—she targets the **consequentialist reductionism** inherent in your framework. The residue isn’t just missing terms; it’s evidence of a foundational clash. Using constraints or lexicographic preferences *simulates* her conclusions but betrays her anti-consequentialist metaphysics.  

  *Recommendation*: To engage Anscombe, you’d need meta-tools she’d reject: e.g., a **two-stage choice** where acts are first filtered by deontic rules (hard constraints), then optimized within permissible sets. But this concedes her core claim—that consequences aren’t sovereign.*
