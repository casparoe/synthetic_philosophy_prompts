answer: |-
  Here’s a distilled spec for evaluating theories of enfranchisement, structured around your cases and distinctions. Requirements are categorized, with **motivating cases**, **status** (non-negotiable/preference), and **empirical debts** flagged.

  ---

  ### **I. Core Requirements for an Adequate Theory**
  1. **Boundary Case Resolution**  
     - **Must deliver coherent verdicts on**:  
       - 16-year-olds (subject to juvenile law, minimal tax impact)  
       - Permanent residents (≥5 years; fully taxed/coerced)  
       - Toddlers (affected but incompetent)  
       - Adults under guardianship (competence vs. stake tension)  
       - Non-resident citizens (emigrant at age 6; symbolic ties, low affectedness)  
       - Seasonal workers (transient stakes)  
       - Prisoners (coerced, but disenfranchised conventionally)  
       - Extra-jurisdictional affected parties (e.g., neighboring cities)  
       - Future residents (intergenerational justice)  
     - *Status*: **Non-negotiable** – Theory fails if it arbitrarily excludes/includes these without principled consistency.  
     - *Empirical debts*: None (boundary logic must hold without contingent facts).  

  2. **Critical Distinctions Preservation**  
     - Must **not collapse**:  
       - Voting rights vs. obligation to vote (compulsory turnout ≠ right expansion)  
       - Affectedness vs. subjection to coercion (permanent residents taxed/coerced ≠ 16yos)  
       - Competence vs. stake (low-info adults vote; are 16yos comparable?)  
       - Individual vs. group claims (e.g., Indigenous representation)  
       - Franchise boundaries vs. vote weight (e.g., federalism; *Status*: **Separate question** – Weight belongs to representation theory, not franchise)  
     - *Status*: **Non-negotiable** – Collapsing these invalidates policy distinctions.  
     - *Empirical debts*: Competence (requires data on 16yo vs. adult political knowledge).  

  3. **Empirical Consistency**  
     - Must align with observed realities:  
       - Compulsory turnout’s impact on turnout/outcomes (does it mobilize marginalized groups?)  
       - Political knowledge of 16yos vs. low-info adults (if comparable, competence arguments weaken).  
     - *Status*: **Non-negotiable** – Theories ignoring evidence are non-starters.  
     - *Empirical debts*: **High** – Relies on data gaps (e.g., 16yo cognition studies, compulsory voting effects).  

  4. **Self-Application & Democratic Legitimacy**  
     - Must resolve: Who decides the demos? Can a demos change its composition without circularity?  
     - *Motivating case*: Prisoner enfranchisement debates; emigrant votes.  
     - *Status*: **Non-negotiable** – Theories that cannot ground their own authority are incoherent.  
     - *Empirical debts*: None (procedural logic must suffice).  

  ---

  ### **II. Your Two Priority Questions**  
  1. **The Chair’s Demand (One Principle → Three Verdicts)**  
     - **Aesthetic preference, not a desideratum**. Coherence across policies doesn’t require monism. A hybrid theory (e.g., "coercion + stake" for residents, competence for age) may better handle boundary tensions. Insisting on one principle risks forcing over/under-inclusion (e.g., affectedness over-includes toddlers; competence under-includes 16yos if knowledge gaps exist).  

  2. **Fatal Conflict in Requirements?**  
     - **Yes, between affectedness and subjection-to-coercion** in your cases:  
       - Permanent residents are subjected but not franchised.  
       - 16yos are subjected (school laws) but minimally affected (taxation).  
       - Emigrant citizens are franchised but not subjected.  
     - No principle fully resolves this without trade-offs. **This tension is the core finding** – theories must prioritize or hybridize.  

  ---

  ### **III. Requirement Doing the Most Work**  
  **Boundary Case Resolution** – Eliminates theories that:  
  - Over-include (e.g., affectedness enfranchises toddlers/outsiders).  
  - Under-include (e.g., strict citizenship excludes permanent residents).  
  - Inconsistently handle analogous cases (e.g., taxing non-citizens but denying votes).  

  ---

  ### **IV. Contender Theories vs. Requirements**  
  | **Theory**               | **Strengths**                                  | **Fatal Weaknesses**                                  |  
  |--------------------------|-----------------------------------------------|------------------------------------------------------|  
  | **Affectedness (Dahl)**  | Captures outsiders/future gens; intuitive.    | Over-includes (toddlers, outsiders); ignores competence/coercion; silent on obligations. |  
  | **Coercion/All-Subjected** | Aligns with resident non-citizens; justifies compulsory schooling link for 16yos. | Under-includes 16yos (if coercion ≠ tax); excludes emigrant citizens; struggles with competence (toddlers). |  
  | **Membership/Social Justice** | Handles non-citizen residents; flexible on age via "stake". | Vague boundaries (who counts?); risks circularity (demos defines itself); silent on obligations. |  

  **Hybrid Implication**: A "coercion + stake + competence" threshold (e.g., subjected to laws *and* resident ≥X years *and* age ≥16) may fit all three policies but requires balancing empirical debts (e.g., setting age cutoffs).

  ---

  ### **Summary**  
  - **The chair’s monism is optional** – Hybrid theories may better handle tensions.  
  - **Key irreconcilable tension**: Affectedness vs. subjection-to-coercion in residency/age cases.  
  - **Write the memo around boundary inconsistencies** – This reveals why no single principle cleanly delivers all three verdicts.  
  - **Best path**: Adopt a coercion-based core (for residency/obligations) with a stake-competence override for age (if 16yo data supports comparability). Flag empirical debts explicitly.
