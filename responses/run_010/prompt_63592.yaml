prompt: |-
  I work in the strategy office of a group of district hospitals, and for the last eighteen months I have been reading the management and evaluation literature in the evenings in an attempt to put a name to something we did here that went wrong in a way I cannot find described anywhere. The history is unremarkable. We used to run one headline figure — median time from referral to first appointment — and it was corrupted precisely as one would predict: clinics began recording referral dates later, splitting pathways into shorter segments, and counting a telephone triage call as an appointment. I have read enough about Goodhart's law, and about Campbell's warning that the more a quantitative social indicator is used for decision-making the more it tends to corrupt the process it is meant to monitor, to know that this is a familiar story and that it is not a story about dishonest people. So the reform, which came from above and which I helped draft, was to retire the single number and replace it with a broad assessment: eleven domains, each scored from one to five by a panel that includes senior clinicians from the units being assessed, with narrative justifications attached to every score, and with weightings that the panel may revise each cycle "to reflect local priorities". No single domain is gameable, because no single domain decides anything, and the panel's deliberation is meant to capture what the old number missed.

  What happened instead is the thing I have no word for. Within a year the score distribution had compressed into the top two bands; every unit was good, and the median referral-to-appointment time got worse by roughly a fifth. When a panel did surface something genuinely bad, the same meeting would reweight two domains, or agree that a criterion had been read too narrowly last cycle, or attach a caveat about case-mix, and the aggregate would emerge acceptable — and each of those moves was individually reasonable, which is exactly why nobody objected. The distinctive failure, as I see it, is not that the assessment came apart from the underlying reality; it is that the assessment lost the capacity to come out badly. There was no observable state of the hospitals that the scoring procedure would have recorded as failure, and the panel could have discovered this only by inventing a result to feed it. I have two smaller instances that I think show the same shape. A university I consulted for replaced a count of research outputs with a portfolio review across six headings with negotiable weightings, and for three consecutive cycles no department scored below the institutional mean, an arithmetically curious fact that nobody remarked upon. A software firm I know retired a bug-closure target in favour of a quarterly engineering-health rubric with a dozen sub-scores set by the team leads themselves; releases slowed, rubric scores rose, and when an engineer proposed reintroducing a hard delivery measure the answer was that delivery was already represented in the rubric and the weightings could be revisited next quarter. A colleague says I am describing self-assessment bias, and another says I am describing bureaucracy, and I am sure both are ingredients, but neither seems to me to be the thing: a panel of wholly disinterested outsiders with no stake in the outcome would, I suspect, have produced exactly the same immunity, because the immunity lives in the flexibility of the instrument rather than in the motives of the people using it. I have also wondered whether it is a measurement-shaped version of the point that a theory can always be rescued by tinkering with its auxiliary assumptions, but that feels like an analogy I am reaching for rather than a concept I have found.

  So I should like to know whether this has an established name, and I want to be clear that a label alone will not satisfy me — I want the carving. Which are the nearest established concepts, how does the phenomenon I have described differ from each of them, and which of them, if any, does it fall under as a special case? If nothing fits, coin and define a term for it, and give me the boundary conditions: an instance of a rich, qualitative, panel-run assessment that would *not* count as this, and an instance of a crude single number that *would*, so that I can test the definition against cases I have not yet described. Please also be explicit about the confidence of your own verdict rather than presenting it as settled: tell me which of your candidate concepts you would drop first under pressure, what consideration would change your mind about whether this is one phenomenon rather than two — the loss of any possibility of failure, and the drift in what the criteria are taken to mean — and where you think my description is most likely to have led you astray, since I selected these three examples to fit a pattern I already half believe in. Do not trouble yourself with references or a reading list; I am after the analysis, not the sources. Please write the whole response in British English.
reasoning: |-
  Hmm, this is a fascinating and complex query from someone clearly deeply immersed in both practical management challenges and theoretical evaluation literature. The user describes a sophisticated multi-dimensional assessment system designed to avoid Goodhart's law, yet observes an unexpected failure mode where the assessment becomes incapable of registering poor performance. 

  The core tension here is between flexibility and rigor - the very features meant to prevent gaming (multiple domains, adjustable weightings, narrative justifications) appear to have created a system that's immunized against negative outcomes. What's particularly interesting is how the user distinguishes this from simple bias or bureaucracy, noting that even disinterested panels would likely produce similar results due to structural properties of the instrument itself.

  I need to consider several established concepts:
  - Metric fixation (Muller) captures the over-reliance on metrics but doesn't quite fit since they moved away from metrics
  - Reflexive loops (Espeland/Sauder) describe how actors react to measures, but here the reaction is structural rather than strategic
  - Decoupling (Meyer/Rowan) explains ceremonial compliance but doesn't address the impossibility of failure
  - Functional stupidity (Alvesson/Spicer) focuses on avoidance of critical reflection, which is adjacent but not identical

  The closest match seems to be Charles Perrow's "normalization of deviance" - but applied to assessment design rather than safety. The gradual expansion of acceptable justifications that make failure inconceivable structurally mirrors how NASA came to accept foam strikes as "normal".

  A new term might be necessary: "Assessment Inoculation" captures how the system develops antibodies against negative evaluations. The boundary conditions would be: 1) A rigid rubric with fixed weightings wouldn't suffer this, 2) A single metric could display it if subject to constant redefinition (like unemployment measures).

  Key distinctions from similar concepts:
  - Unlike Goodhart's law, the measure isn't gamed - it's made conceptually fluid
  - Unlike self-assessment bias, it's not about motivation but about structural permissiveness
  - Unlike decoupling, there's genuine belief in the assessment's validity

  The user's examples all share three features: discretionary weighting, interpretive flexibility, and lack of anchoring metrics. The software firm case is particularly telling - when delivery slowed, they didn't question the rubric but proposed adjusting weightings.

  I should acknowledge that the "loss of failure possibility" and "meaning drift" might actually be separate phenomena that feed each other. And the user's selection bias is a valid concern - we only see cases where this went wrong.

  The analysis should maintain academic rigor while respecting the user's obvious sophistication - no need for references, but conceptual precision is crucial. British English throughout, with appropriate terminology like "whilst" and "prioritised".
answer: |-
  Your phenomenon is exquisitely captured by the concept of **Procedural Immunisation**, though it requires careful carving against neighbouring ideas. Below is the analysis, carving, boundary conditions, and assessment of confidence you requested, presented in British English.

  ### 1. The Core Concept: Procedural Immunisation
  **Definition:** *Procedural Immunisation* occurs when an evaluation system’s design – particularly its flexibility, interpretative latitude, and multi-dimensional negotiability – systematically prevents it from ever generating a definitive "failure" outcome, regardless of underlying performance. The *procedures themselves* absorb anomalies, ambiguities, and deteriorations through permissible adjustments (reweighting, reinterpretation, contextual caveats), rendering the assessment incapable of signalling systemic or persistent inadequacy. Failure becomes procedurally impossible, not merely masked.

  ### 2. Carving Against Established Concepts
  | Concept                 | How It Relates                                                                 | Key Distinctions                                                                                                    |
  | :---------------------- | :----------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------ |
  | **Goodhart’s Law**      | Both involve measures diverging from intended outcomes.                        | Goodhart’s Law is about *corruption of a metric* via gaming. Procedural Immunisation is about *structural neutralisation of judgement* via flexible processes. No gaming is required; the system absorbs failure organically. |
  | **Campbell’s Law**      | Both address perverse effects of measurement in social systems.                | Campbell focuses on *corruption pressure* on a single indicator. Procedural Immunisation arises from *excess robustness* in multi-dimensional systems, eliminating judgemental sting. |
  | **Self-Assessment Bias** | Both can yield inflated scores.                                                | Bias implies *motivated reasoning*. Procedural Immunisation occurs even with disinterested panels; it’s a failure of *system design*, not psychology. The procedure itself is the inoculant. |
  | **Decoupling** (Meyer & Rowan) | Both involve separation between formal assessment and actual practice. | Decoupling is about *ceremonial compliance* (symbolic vs. operational). Procedural Immunisation is about *procedural absorption* – performance issues are acknowledged but rendered inconsequential through sanctioned adjustments. |
  | **Normalization of Deviance** | Both involve gradual acceptance of declining standards.                      | Normalisation is *cultural* (e.g., NASA accepting foam strikes). Procedural Immunisation is *structural*: the assessment framework formally legitimises declining standards via its rules. |
  | **Moving the Goalposts** | Both involve changing criteria.                                              | Goalpost-moving is typically *opportunistic* and *ad hoc*. Procedural Immunisation *bakes in* goalpost-moving as a legitimate feature (e.g., cyclical reweighting). |
  | **Bureaucratic Ritualism** | Both involve processes becoming ends in themselves.                          | Ritualism emphasises *mindless compliance*. Procedural Immunisation’s adjustments are *reasoned* and locally rational, making it more insidious. |

  ### 3. Boundary Conditions: What Is and Isn’t Procedural Immunisation
  - **A Qualitative Assessment *Without* Immunisation:**  
    A panel assesses hospital safety using 10 fixed domains (e.g., infection rates, staffing ratios, incident reports) with *immutable weightings* and *operational definitions*. Narrative justifications are required, but cannot override quantitative thresholds. A unit with rising infection rates *must* score poorly on that domain, dragging down the aggregate. Failure remains possible.
    
  - **A Single Metric *With* Immunisation:**  
    A university tracks "graduate employability" via a single metric. However, the definition of "employed" is renegotiated annually (e.g., including unpaid internships, then gig work, then further study). Committees add caveats for "economic conditions" retroactively. The metric *looks* stable, but deterioration is absorbed through procedural adjustments. This *is* Procedural Immunisation – it arises from **interpretative flexibility**, not dimensionality.

  ### 4. Confidence & Caveats
  - **Verdict Confidence:** Moderately High (7/10). The core phenomenon – structural prevention of failure outcomes – is coherent and distinct. However, its separation from "meaning drift" is less certain.
  - **First Concept Dropped Under Pressure:** "Normalization of Deviance". While related, it’s more cultural than procedural. Your cases emphasise *designed-in* flexibility, not emergent complacency.
  - **Is This One Phenomenon or Two?**  
    The "loss of failure possibility" and "meaning drift" are symbiotic but distinct. **Drift enables immunisation.** If pressed, I’d split them:  
    - *Procedural Immunisation*: The system cannot output "failure".  
    - *Criterion Elasticity*: The meaning of measures stretches contextually.  
    Your examples show both, but Immunisation is the overarching failure mode.
  - **Where Your Description May Mislead:**  
    You selected examples fitting your pattern. Crucially, **Procedural Immunisation requires discretionary flexibility**. If your hospital panel had *fixed* weightings and *no authority* to redefine criteria, immunisation couldn’t occur. Your software firm case is the clearest example; the university’s "no department below mean" is less definitive (arithmetical quirks happen).

  ### 5. Why "Procedural Immunisation" Fits
  - **The Immunity is in the Procedure:** The panel’s actions (reweighting, reinterpreting) aren’t cheating; they’re *sanctioned by the design*. Like a vaccine prompts antibodies, the procedure generates "adjustments" to neutralise threats to a positive outcome.
  - **Non-Observability of Failure:** As you note, no observable state would yield a "failure" score. The procedure is *designed* to reconcile evidence into acceptability.
  - **Local Rationality, Systemic Failure:** Each adjustment (e.g., "case-mix caveats") is reasonable in isolation, but collectively they anesthetise the assessment. This mirrors your "auxiliary assumptions" analogy – but here it’s embedded in organisational process, not theory.

  ### Final Synthesis
  You’ve identified a design flaw in **rich assessment systems that prioritise flexibility and consensus over decisiveness and fixed standards**. Procedural Immunisation is not about bad faith; it’s about systems where the *rules for handling discordant evidence* ensure discordant evidence never translates into a negative judgement. The remedy isn’t fewer metrics (that risks Goodhart’s), but *constrained flexibility*: fixed weightings, operational definitions resistant to reinterpretation, and crucially, domains that *can* trigger failure independently. Your hospital reform failed because it mistook complexity for robustness, not realising complexity without anchors breeds immunisation.
