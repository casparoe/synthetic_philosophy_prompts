prompt: |-
  ok, you're going to have to play political philosopher for me here — ideally one who's spent a lot of time on immigration ethics and on when a group gets to decide who joins it, but who can write for a room full of non-academics. Please actually work through the arguments on both sides first, in your head, before you commit to a recommendation. Don't start writing the memo until you know what you're going to say.

  I sit on the membership committe of a community land trust in a rural parish. Forty households: the land is owned in common, each family has a 99-year lease on their plot, and the resale price is capped by a formula so nobody ever makes a windfall. Six plots come free over the next two years, mostly aging members. Our approved waiting list is 187 people long and the average wait is eleven years.

  Right now the committee interviews applicants and votes, two thirds needed. In practice we've always favoured people the community already knows — locals, relatives of members, people who've been turning up to workdays at the farm for years. Nobody ever wrote that down, it just happened.

  There's a formal proposal for our AGM in six weeks to reserve four of the six plots for applicants with a "tie to the parish": born here, schooled here, or five-plus years of paid or volunteer work on the commons. Their case has three legs — outside applicants can pick up and move at will while local young families are stuck in their parents' spare rooms; the whole region is being priced out and the trust was set up to keep *this* community alive, not to relieve housing need in the abstract; and a lottery would hand a home to someone who then never touches a shared obligation.

  The other side says a preference keyed to birthplace and local ties is hereditary privilege in a nicer hat, that we take a property-tax abatement which is public money and that we control the only genuinely affordable housing in the parish, and — this is what got me — when somebody actually scored the "tie to the parish" test against the real list, it qualified 9 of the 187, and 6 of those 9 are adult children of current members, spread across four of the six founding households. On top of that, two of the plots coming free belong to households who put in the labour when the trust was broke and built the barns by hand, and their families are saying that's something their kids are owed. Our charter says the trust exists "for the benefit of the inhabitants of the parish and those who come after them," which both camps are currently throwing at each other.

  And the analogy everyone keeps reaching for cuts both ways, which is why I can't settle it: one of the older members says if a country gets to decide who it lets in, a forty-household trust certainly does, and the younger ones shout back that if a country *doesn't* get to do that, neither do we. Neither side can say why the reasoning travels in their direction and not the other.

  Also not innocent here — I moved in nine years ago largely because a member vouched for me, so I'm a product of the exact mechanism under dispute.

  Draft the memo I'll circulate to the committee before the AGM. I want:

  1. a clear recommendation — reserve four, reserve none, lottery, keep the discretionary vote, or some mix — including what actually happens to each of the six plots and by when;
  2. a test the committee can apply next cycle that isn't just vibes, and that survives being scored against a real list;
  3. an honest treatment of the strongest thing the local-preference side has going for it, not a strawman, including the "they built the barns" claim, which I genuinely don't know how to answer;
  4. your verdict on the country/community analogy — does the right to pick members transfer downward from states to us, upward from us to states, or neither, and what actually does the work in that comparison;
  5. whether, given the abatement and our grip on the parish's only affordable stock, we're still the kind of body that's allowed to make this choice at all. If we've crossed some line, say what the line is and where we crossed it.

  Take a side. Don't split the difference to be polite, and don't tell us to "foster a constructive dialogue." 800–1000 words, plain language, memo format with a bottom line up top, no preamble, and no reading list or citations — I'm writing this on my phone with terrible signal and I just need the reasoning.
reasoning: |-
  Okay, the user is on a community land trust membership committee facing a heated debate about reserving plots for locals versus a more open process. They need a decisive memo with specific recommendations, not academic fluff. 

  Hmm, the core tension is between preserving the community's original purpose and addressing charges of nepotism. The "tie to parish" proposal would effectively reserve most spots for founding families' kids - that's the uncomfortable truth beneath the localism argument. 

  Right, let's dissect their five requirements one by one. First: the recommendation can't be a cop-out. Reserving four plots is too much given only 9 applicants qualify, but ignoring founding families' contributions would feel unjust. A split approach - one plot for barn builders' legacy, one for locals, four open - balances principles without freezing the community.

  Second: they need a measurable test. Points systems are bureaucratic but "contribution-weighted lottery" could work - baseline points for parish connection, bonus for sweat equity. Must run mock scorings to avoid surprises like last time.

  Third: the strongest localist argument is the barn builders' claim. Can't dismiss that. But "owing" kids implies inheritance - dangerous for a trust fighting commodification. Better frame it as honoring legacy through priority, not entitlement.

  Fourth: the country analogy... ah, that's tricky. States have border sovereignty; micro-communities survive through relationships. The trust isn't excluding outsiders - it's prioritizing contributors. That distinction matters.

  Fifth: the tax abatement means public benefit obligations. But "affordable housing provider" ≠ government. The line is when exclusion becomes arbitrary. Current discretion looks arbitrary; structured criteria fix that.

  Wait - user's personal stake! They benefited from vouching. Must acknowledge that without defensiveness. "I'm proof good outsiders exist" subtly counters hereditary privilege arguments.

  *Brainstorming phrasing*: "When scoring revealed only 9 qualified applicants, the hereditary impact became unavoidable..." - yes, that names the elephant. For the barn builders: "Their sacrifice saved the trust, but plots aren't heirlooms" - ouch, but necessary.

  *Checking tensions*: Can't satisfy both camps fully. Founding families will grumble; open-access advocates will want more. But two reserved plots is the minimum defensible nod to history while preventing dynasties.

  Final structure: Bottom line first (always for memos), then rapid-fire sections mirroring their asks. No fluff. Punchy verbs: "scrap", "adopt", "weight". Save the analogy dissection for last - it's philosophically meaty but least actionable.

  *Self-test*: Did I take a side? Yes: modified reservation. Did I avoid false balance? Yes - called hereditary privilege out. Did I answer "what about the barns?" directly? Yes, with a counter-principle about intergenerational equity. Good.
answer: |-
  **MEMORANDUM**  
  **TO:** Membership Committee  
  **FROM:** [Your Name], Committee Member  
  **SUBJECT:** Recommendation on Plot Allocation & Selection Criteria for 2024-2025  
  **DATE:** [Current Date]  

  ---

  ### BOTTOM LINE  
  **Recommendation:** Reserve **one plot** for applicants with deep historical ties to the trust’s founding labor (e.g., barn builders’ descendants), allocate **one plot** via a modified parish-tie preference (scored objectively), and fill the **remaining four plots** through a contribution-weighted lottery open to all 187 applicants. Effective immediately, replace discretionary voting with a transparent points system for future cycles.  

  ---

  ### 1. WHAT WE DO WITH THE SIX PLOTS  
  - **Plot 1 (Founders’ Legacy):** Reserved for a qualified applicant descended from/in a direct care relationship with households who performed *documented, transformative labor* for the trust (e.g., barn construction). Requires proof of contribution.  
  - **Plot 2 (Parish Contribution):** Allocated via a **points-based "community connection" score** (details in Section 2). Top scorer gets the plot.  
  - **Plots 3–6:** Filled via a **weighted lottery**. All applicants enter, but receive bonus tickets for:  
    - Parish residency (1 ticket/year, max 5)  
    - Documented volunteer hours for the trust (1 ticket/20 hours, max 10)  
    - Current emergency housing need (e.g., overcrowding, validated by third party; 3 tickets).  
  - **Timeline:** Implement new system by next allocation cycle (90 days). For current plots, finalize criteria in 30 days, allocate within 60.  

  ---

  ### 2. TEST FOR FUTURE CYCLES: THE POINTS SYSTEM (NO MORE "VIBES")  
  **Objective Criteria:** Applicants earn points in three categories (max 100 total):  
  - **Parish Ties (Max 30 pts):**  
    - Birth in parish: 5 pts  
    - Parish residency: 2 pts/year (max 20)  
    - Current parish employment/volunteering: 1 pt/year (max 10)  
  - **Trust Contribution (Max 50 pts):**  
    - Volunteer hours: 1 pt/10 hours (max 30)  
    - Skills contribution (e.g., carpentry, legal): 5 pts/project (max 20)  
  - **Need & Commitment (Max 20 pts):**  
    - Parish-specific hardship (e.g., eviction risk): 10 pts  
    - Long-term residency pledge (5+ years): 10 pts  

  **Why it works:**  
  - Quantifiable: Run mock scores against the current list *now* to ensure no group is unfairly excluded.  
  - Balances compassion and contribution: Parish ties matter but aren’t absolute; sweat equity is rewarded.  
  - Survives scrutiny: Public scorecards prevent claims of bias.  

  ---

  ### 3. STRONGEST CASE FOR LOCAL PREFERENCE (AND HOW TO ANSWER IT)  
  **Their Best Argument:** *"The trust was built by locals for locals. Founding families risked everything when the trust was broke. Their sacrifice created this community, and their children deserve priority—it’s intergenerational justice, not privilege."*  

  **Honest Response:**  
  - **Yes, the barn builders’ labor demands recognition.** Their work saved the trust and embodies its cooperative spirit. *This is why we reserve Plot 1 for them.*  
  - **But "deserve" is dangerous.** Turning plots into hereditary rights contradicts our core purpose: *permanently* affordable housing, not dynastic assets. If every plot reverts to a founder’s child, we become a closed aristocracy. Our charter says "for those who come after them"—*all* who come after, not just blood relatives.  
  - **The "priced-out locals" plea is valid** but the current proposal fails it. Scoring showed only 9 applicants qualify—most being founders’ kids. A points system prioritizes *actual* locals fairly, not just an elite few.  

  ---

  ### 4. THE COUNTRY/COMMUNITY ANALOGY: WHY IT FAILS  
  **Short Verdict:** **Neither** a country’s sovereignty **nor** our trust’s autonomy resolves this. The analogy distracts. Here’s why:  
  - **States control borders** to enforce laws, collect taxes, and manage public goods at scale. We’re a *micro-community* relying on social trust, not coercion.  
  - **Our legitimacy comes from fairness, not sovereignty.** A country can exclude arbitrarily; we cannot, because:  
    1. We use **public subsidies** (tax abatements).  
    2. We monopolize **essential resources** (the parish’s only affordable housing).  
  - **What actually matters:** Are we allocating scarce goods in a way that aligns with our **founding values** (community preservation) *and* **public responsibilities** (equitable access)? The points system does this; blanket hereditary preferences do not.  

  ---

  ### 5. ARE WE STILL ALLOWED TO PICK MEMBERS?  
  **Yes, but with constraints.**  
  - **The Line:** We cross it when selection becomes **arbitrary, exclusionary, or detached from our mission.**  
  - **Where We Are Now:** Our current "vibes-based" voting *has crossed the line*. Favoring friends/family without clear criteria misuses public subsidies and hoards opportunity.  
  - **How We Fix It:**  
    - **Keep autonomy** by designing a rigorous, transparent system (the points system).  
    - **Justify the tax abatement** by proving we serve *broad* parish needs (e.g., our lottery includes "emergency need" points).  
    - **Honor community roots** without entrenching elites (the Founders’ Legacy plot and parish-tie points).  

  ---

  ### FINAL WORD  
  This isn’t about "local vs. outsider." It’s about **honoring sacrifice without creating dynasties**, and **serving our parish without surrendering to chaos**. The proposed hybrid model balances these. It acknowledges that barn builders’ kids *should* stand first in line—*for one plot*. For the rest? Let’s reward those investing in the trust *today* and prioritize families sleeping in spare rooms *now*. Our trust survives by evolving, not entombing itself in 1990s decisions. Time to vote for the future.  

  **Recommended Motion:** *Replace discretionary voting with the points system; allocate the next six plots per Section 1.*  

  ---  
