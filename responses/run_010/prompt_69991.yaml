prompt: |-
  I am a senior program officer at a private family foundation with roughly $40 million in annual grantmaking across three areas: global health, criminal-justice reform, and scientific research. Eighteen months ago the board adopted a giving policy committing us to maximizing the expected value of our grants, and that language has produced a recurring stalemate in our review meetings. The near-term effects of the proposals in front of us are modest and reasonably well characterized — infections averted, arrests avoided, trained researchers retained — while the indirect and long-run effects are potentially orders of magnitude larger and essentially beyond our ability to estimate: eleven years of cash transfers reshape a regional labor market and the politics of a district; a reform that lowers admissions to one county's jail shifts enforcement pressure to a neighboring county; a fellowship program changes which questions a field asks for a generation. Two factions have formed among the trustees. One says that since we cannot know what we are doing, ranking grants by expected value is a pretense, and that we should fund only what is locally verifiable and stop claiming more than that. The other says that if the long-run effects dominate, then aiming at them is the only serious option, and it is the locally verifiable grants that are the pretense. I have been asked to settle this at the staff level with something we can apply, not with a position paper.

  Deliverable: a decision procedure for a grant file, runnable by a program officer with no formal training in decision theory, in about two hours, producing a recommendation memo that our executive director must countersign. She is a former state auditor and requires that every ranking in the memo be traceable to a stated basis; she will not sign "the officer's overall judgment" as a reason, though she will sign "the officer exercised judgment at step four, where the procedure specifies that judgment is required, on the following grounds."

  Before the steps, take a position on what our problem actually is, because the procedure differs depending on the answer and I do not want a hedge. Either the difficulty is specifically a moral one — a reason to doubt that the right thing to do is fixed by the consequences of particular acts, and hence a reason to revise or abandon the board's policy — or it is an ordinary case of decision-making under deep uncertainty that any framework we substituted would face equally, in which case the policy can stand and what we need is a better decision rule. Pick one. Say what follows for us from picking it, and say what the strongest case for the other answer is and why it does not move you.

  Then the procedure itself. At minimum:

  1. The steps in the order they should be executed, with a statement for each of what a sufficient answer looks like and what merely looks like an answer. Specify in particular what the officer writes down when the true response to a step is that we do not know and could not find out — a response I expect to be common, and one that must not function as an automatic yes or an automatic no.

  2. An explicit taxonomy of the kinds of ignorance we face, with a different treatment for each: magnitude unknown but direction known, versus direction itself unknown; ignorance that a modest piece of funded research could reduce, versus ignorance no feasible study would touch; effects concentrated on identifiable present people, versus diffuse effects on people who do not yet exist. If you think some of these distinctions will not survive contact with real grant files, say so and tell me which to drop.

  3. A rule governing when remote or speculative consequences may override a well-measured near-term case and when they must be set aside as inadmissible. Argue for the rule rather than asserting it. Separately: our evaluators have applied a three percent annual discount rate to costs and benefits for years, inherited from a cost-benefit contractor and never defended by anyone here. The procedure has to tell us what to do about it, since as far as I can determine that single number has been quietly deciding whether the long run counts at all.

  4. The points at which the procedure terminates in a recommendation — fund, decline, fund conditionally, or refer — and the points at which it stops short and hands the choice upward because what remains is a question about values rather than fact. Be specific about which body decides: me, the executive director, or the board.

  5. An honest accounting of which steps are judgment calls wearing a procedural costume, and of how the procedure would be worked by an applicant or a colleague who has read it. Assume it leaks. I would rather design for that than discover it.

  Apply the procedure to three files now in front of me, showing your work at each step:

  A. $1.2 million to scale an unconditional cash transfer program in a region where we have been the largest funder for eleven years. The direct effects are supported by multiple randomized evaluations. The internal objection, raised by a colleague, is that eleven years of transfers has altered local wage structures and land prices and made local officials more answerable to donors than to constituents, and that none of this has been measured and none of it will be.

  B. $300,000 to an advocacy organization campaigning to abolish a schedule of court fees and fines in our state. The direct effect on the roughly 40,000 people who pay them annually is real but small in dollars. The organization's principal claim on us is that a successful campaign would set a precedent other states would follow and would shift what counts as a legitimate way for a court to fund itself. Neither claim is testable within our grant period.

  C. $500,000 to establish a doctoral fellowship program aimed at reducing a low-probability, high-magnitude risk — the applicant's example is misuse of engineered pathogens, and they are equally willing to argue from the risk of misaligned artificial intelligence. Their case is that expected value is dominated by the tail. Our executive director's marginal note on the file reads that the tail is invented.

  Exactly one of these three, tell me which, should come out of your procedure with a recommendation the officer who brought it forward will not want. I would prefer to learn that from a procedure than in the boardroom, where two of the three are pet projects of trustees.

  Close by stating what the procedure cannot do. If your view is that no procedure of this kind can be simultaneously faithful to expected-value maximization and usable by people with our resources, I want that said outright, along with the least bad version you would have us adopt anyway and precisely what we surrender by adopting it.
reasoning: |-
  We are facing a problem of decision-making under deep uncertainty. The recurring stalemate arises because the long-term and indirect effects of grants are uncertain and potentially huge, yet the policy requires us to maximize expected value. The two factions among the trustees represent two common reactions to deep uncertainty: one retreats to the measurable short term, the other insists on the dominance of the long term.

  I take the position that the difficulty is an ordinary case of decision-making under deep uncertainty that any framework would face. The policy of maximizing expected value can stand, but we need a decision procedure that handles deep uncertainty appropriately.

  Why not a moral problem? The strongest case for the moral interpretation is that we might be neglecting deontological constraints (e.g., fairness, rights) by focusing solely on consequences. However, the board's policy explicitly commits to expected value maximization, which is a consequentialist approach. The objections we face are not about the moral permissibility of the acts themselves (e.g., "it's wrong to bribe officials even if it leads to good outcomes") but about the epistemic challenge of predicting consequences. Thus, the problem is epistemic, not moral.

  What follows: We must design a procedure that helps us make the best possible decisions under deep uncertainty without abandoning the goal of expected value maximization.

  **Decision Procedure**

  The procedure is designed for a program officer to complete in about two hours per grant. It produces a memo with a recommendation (Fund, Decline, Fund Conditionally, Refer) and a clear audit trail. The steps are:

  1. **State the grant's explicit goals and the direct, near-term outcomes it aims to produce.**
     - Sufficient: List the outcomes and the evidence provided for them (e.g., randomized evaluations, historical data).
     - Insufficient: Vague statements about "systemic change" without measurable intermediate steps.
     - If we don't know: Write "No direct outcomes specified" or "Evidence for direct outcomes not provided." This does not automatically kill the grant but moves to step 2.

  2. **List all significant indirect and long-term effects claimed by the applicant or identified by staff. Categorize each effect by:**
     - **Direction**: Known positive, known negative, unknown.
     - **Magnitude**: Quantified, bounded (min and max estimated), unknown.
     - **Evidence**: Strong (e.g., multiple studies, theory with empirical support), weak (e.g., anecdotal, speculative theory), none.
     - **Concentration**: Concentrated (on identifiable present people), Diffuse (on future/unidentifiable people).
     - **Reducibility**: Can uncertainty be reduced by feasible research? (Yes/No/Unknown)
     - *Note*: If an effect is not claimed by the applicant and not raised by staff, it is not listed. We are not required to imagine every possible effect.

     - Sufficient: A table with each effect and its categorization.
     - Insufficient: A narrative without clear categorization.
     - If we don't know: Mark the category as "unknown". This step is about organizing known claims, not conducting new research.

  3. **For each effect from step 2, assign an uncertainty level:**
     - Level 1: Direction known, magnitude bounded (e.g., between X and Y).
     - Level 2: Direction known, magnitude unbounded (e.g., positive but could be very small or very large).
     - Level 3: Direction unknown (could be positive or negative).
     - *Note*: If an effect has multiple categorizations (e.g., some aspects Level 1, others Level 2), use the highest (most uncertain) level.

  4. **Apply the Precautionary Principle for Level 3 effects (direction unknown):**
     - If any Level 3 effect is potentially catastrophic (i.e., could cause severe harm to many people), then the grant must be declined unless there is a strong, evidence-based argument that the probability of catastrophe is negligible. (This is a judgment call; the officer must write the argument.)
     - For non-catastrophic Level 3 effects, proceed to step 5 but note the risk.

  5. **Estimate the expected value of the grant:**
     - **Near-term effects (from step 1)**: Use the best available evidence to assign a monetary value or a standardized unit (e.g., DALYs, QALYs, dollars) if possible. If not, use a qualitative scale (e.g., small, medium, large positive/negative) and convert to a numerical range for calculation (e.g., small: 1-10, medium: 10-100, large: 100+). Discount at 3% per year for effects beyond one year.
     - **Long-term effects (from step 2)**: 
       - For Level 1: Use the midpoint of the bounded magnitude. Discount at 3% per year.
       - For Level 2: Use a conservative estimate (e.g., the lower bound if positive, upper bound if negative) and note the uncertainty. Discount at 3% per year.
       - For Level 3: Exclude from calculation unless they are catastrophic (then the grant is declined) or negligible (then excluded). If excluded, note in memo.
     - **Total Expected Value**: Sum the near-term and long-term values. If using qualitative scales, convert to a score (e.g., on a scale of 1-10) and sum.

     - *Rule for when speculative effects override near-term*: 
       - If the long-term effect is Level 1 or 2 and its conservative estimate (even at the lower bound) is at least an order of magnitude larger than the near-term effect, then it overrides the near-term focus. 
       - Otherwise, the near-term effects dominate.

     - Why this rule? Because if the long-term effect is potentially huge and positive, even a conservative estimate that dwarfs the near-term effect should not be ignored. But if it's speculative (Level 3) or not clearly dominant, we default to the measurable.

     - *Discount rate*: We use 3% because it is our established practice, but we note that for very long-term effects (beyond 50 years), a lower discount rate might be warranted. However, changing the rate would require board approval. For now, we apply 3% consistently. The officer must state the discount rate used and the time horizon.

  6. **Compare to opportunity cost**:
     - What is the next best use of these funds? (e.g., another grant in the same area, or in a different area). Use the same procedure to estimate its expected value if not already done. If the grant under review has a higher expected value, proceed. If not, consider declining.

  7. **Conditionality**:
     - Are there conditions that could reduce uncertainty? (e.g., funding a pilot, requiring an evaluation). If so, recommend funding conditionally on meeting those conditions.

  8. **Recommendation**:
     - **Fund**: Expected value positive and significantly higher than alternatives.
     - **Fund Conditionally**: Expected value potentially positive but key uncertainties could be reduced by conditions.
     - **Decline**: Expected value negative or low relative to alternatives, or catastrophic risk (step 4).
     - **Refer**: The decision hinges on a value judgment that the program officer cannot make (e.g., weighing harms to future generations versus present, or a major shift in strategy). Refer to the executive director (for value judgments within the foundation's mission) or the board (for mission-level judgments).

     - The program officer writes a memo with:
       - The grant's goals (step 1).
       - The table of effects (step 2).
       - Uncertainty levels (step 3).
       - Precautionary actions (step 4, if any).
       - Expected value calculation (step 5).
       - Comparison to alternatives (step 6).
       - Conditions (step 7).
       - Recommendation and reasons.

  **What the procedure cannot do**:
  - Eliminate uncertainty. We are making decisions under ignorance.
  - Resolve fundamental value disagreements (e.g., how much to discount the future, how to weigh animal welfare). These must be referred up.
  - Be perfectly objective. Judgment is required at steps 4 (catastrophe assessment) and 5 (assigning values to qualitative outcomes). But the procedure makes the judgments explicit and auditable.

  **Application to Example Grants**

  *Grant A: Cash Transfer Program ($1.2M)*
  1. **Direct effects**: Well-documented by RCTs: increases in consumption, health, education. Positive.
  2. **Indirect effects**: 
     - Effect 1: Altered local wage structures (Direction: unknown [could be positive or negative]; Magnitude: unknown; Evidence: none; Concentration: diffuse; Reducibility: yes, but not planned).
     - Effect 2: Increased land prices (Direction: negative for non-recipients?; Magnitude: unknown; Evidence: none; Concentration: diffuse; Reducibility: yes).
     - Effect 3: Local officials more answerable to donors (Direction: negative; Magnitude: unknown; Evidence: anecdotal; Concentration: diffuse; Reducibility: yes).
  3. **Uncertainty**: 
     - Effect 1: Level 3 (direction unknown). 
     - Effect 2: Level 2 (direction known: negative, magnitude unknown). 
     - Effect 3: Level 2 (direction known: negative, magnitude unknown).
  4. **Precautionary Principle**: None are catastrophic, so proceed.
  5. **Expected value**:
     - Near-term: Large positive (from RCTs). 
     - Long-term: 
       - Effect 1: Excluded (Level 3, not catastrophic). 
       - Effects 2 and 3: Negative, conservative estimate (high negative). 
     - Total: Near-term positive may be offset by long-term negative, but without magnitudes, we cannot quantify. However, the near-term effects are well-established and large. The long-term negatives are speculative and not quantified. Thus, near-term dominates. 
     - *Rule*: Long-term effects (Level 2) are not an order of magnitude larger than near-term (we don't know magnitudes, so we cannot say they override). Thus, we focus on near-term.
  6. **Opportunity cost**: High. This is a core program with good evidence.
  7. **Conditionality**: Recommend funding with condition to study long-term effects (e.g., fund a parallel research grant).
  8. **Recommendation**: Fund conditionally on including a research component on long-term effects.

  *Grant B: Court Fees Advocacy ($300K)*
  1. **Direct effects**: Small dollar savings for 40,000 people. Positive but modest.
  2. **Indirect effects**:
     - Effect 1: Precedent for other states (Direction: positive; Magnitude: unknown; Evidence: weak; Concentration: diffuse; Reducibility: no, until it happens).
     - Effect 2: Shift in legitimacy of court funding (Direction: positive; Magnitude: unknown; Evidence: weak; Concentration: diffuse; Reducibility: no).
  3. **Uncertainty**: Both Level 2 (direction known positive, magnitude unknown).
  4. **Precautionary Principle**: Not applicable.
  5. **Expected value**:
     - Near-term: Small positive.
     - Long-term: Could be very large positive (if precedent spreads) but unbounded. Conservative estimate: assume small (since magnitude unknown). 
     - Total: Potentially dominated by long-term, but our rule: without a conservative estimate that is an order of magnitude larger than near-term (which we don't have), we cannot override. Thus, near-term is small, and long-term is speculative.
  6. **Opportunity cost**: Moderate. $300K is not huge, but there may be better uses.
  7. **Conditionality**: None obvious for reducing uncertainty.
  8. **Recommendation**: Decline (expected value too uncertain and not clearly high). However, if the advocacy group has a strong theory of change, we might refer to the board for a values-based decision (e.g., "we believe in supporting precedent-setting reforms even without evidence"). But the procedure says decline.

  *Grant C: Fellowship for Catastrophic Risk Reduction ($500K)*
  1. **Direct effects**: Train 5 doctoral students. Positive but modest (retaining talent).
  2. **Indirect effects**:
     - Effect 1: Reduce risk of engineered pathogens (Direction: positive; Magnitude: very large if risk is real; Evidence: weak; Concentration: diffuse; Reducibility: no, until the risk materializes or not).
     - Effect 2: Similarly for AI.
  3. **Uncertainty**: Level 2 (direction known positive, magnitude unknown but potentially huge).
  4. **Precautionary Principle**: Not applicable (the risk itself is catastrophic, but the grant aims to reduce it, so direction is positive).
  5. **Expected value**:
     - Near-term: Small positive.
     - Long-term: Could be astronomical (if the fellowship prevents a catastrophe). Conservative estimate: even a tiny reduction in a 1% risk of a billion-dollar catastrophe is huge. 
     - Apply discounting: If the catastrophe is in 50 years, discount at 3%: (1.03)^50 ≈ 4.38, so a $1B catastrophe today is worth about $228M today. A 0.01% reduction in risk is worth $22,800. But if the risk is higher (e.g., 1% per year) and the grant reduces it by 0.0001%, it could still be large. However, we have no basis for these numbers.
     - *Rule*: The long-term effect, even conservatively estimated, could be orders of magnitude larger than the near-term. Thus, it overrides.
  6. **Opportunity cost**: High for a fellowship, but if the tail risk is real, it could be the best use.
  7. **Conditionality**: None.
  8. **Recommendation**: Fund. The expected value is dominated by the tail.

  **Which grant will the officer not want?** 
  - Grant B (court fees) comes out as Decline. The officer might be enthusiastic about advocacy and precedent-setting, but the procedure forces a decline due to low measurable impact and high uncertainty without a clear override.

  **Closing**
  The procedure cannot eliminate the tension between short-term and long-term, but it makes the tradeoffs explicit. It requires judgment at steps 4 and 5, but the judgment is structured and auditable. It is usable by program officers with training in the procedure (not decision theory). 

  If we find that the procedure consistently produces recommendations that feel wrong, it may be that expected value maximization is not the right standard for us. But until then, this procedure gives us a way to apply the board's policy faithfully under uncertainty.
answer: |-
  ### Position on the Problem
  **The difficulty is an ordinary case of decision-making under deep uncertainty, not a moral one.** The board's policy of maximizing expected value remains valid, and any alternative framework (e.g., rights-based or procedural approaches) would face the same uncertainty about long-term effects. The stalemate arises because we lack tools to handle uncertainty, not because consequentialism is flawed.  
  - **What follows**: We need a decision procedure that operationalizes expected-value maximization under deep uncertainty. This procedure must explicitly address ignorance without retreating to short-termism or speculating recklessly.  
  - **Strongest case for the moral interpretation**: One could argue that focusing on consequences ignores deontological duties (e.g., justice for current beneficiaries) or distributes harms unfairly across generations. However, the board’s policy explicitly centers on consequences, and the objections in meetings focus on *measurability*, not morality. Ignoring uncertain long-term effects might itself be immoral if they dominate value. Thus, the moral critique does not justify abandoning the policy—it only highlights that our *implementation* is inadequate.  

  ---

  ### Decision Procedure: Expected Value Under Uncertainty (EVU) Framework  
  **Design Principles**:  
  - **Traceability**: Every conclusion must cite a step, input, or judgment rule.  
  - **Time-bound**: Completable in ~2 hours per grant.  
  - **Leak-proof**: Assumes applicants/colleagues will game it; uses conservative estimates and explicit uncertainty thresholds to limit manipulation.  
  - **Output**: A memo with a clear recommendation (Fund/Decline/Fund Conditionally/Refer), with all reasoning traceable to documented inputs.  

  #### Step-by-Step Procedure  
  **Step 1: Map Direct Effects**  
  - **Task**: List all near-term (≤5 years), quantifiable effects claimed by the applicant or verified by staff. Assign a value using evidence (e.g., "100 infections averted at $500 per infection = $50,000 value").  
  - **Sufficient answer**: Table with: (1) Effect description, (2) Magnitude, (3) Evidence source (e.g., RCT, historical data), (4) Valuation (monetary or standardized unit like DALYs).  
  - **Insufficient answer**: Vague descriptions (e.g., "improves welfare"); lack of evidence citations.  
  - **If "don't know"**: Write: "No verifiable evidence for direct effects." Proceed to Step 2—this does not kill the grant but flags high uncertainty.  

  **Step 2: Map Indirect/Long-Term Effects**  
  - **Task**: List all claimed indirect/long-term effects (>5 years). Categorize each by:  
    - **Direction**: Known positive/negative, or unknown.  
    - **Magnitude knowledge**: Quantified, bounded range (e.g., "10–100x direct effects"), or unknown.  
    - **Reducibility**: Uncertainty reducible by feasible study (e.g., pilot, survey), or irreducible (no feasible study exists).  
    - **Beneficiary concentration**: Concentrated (identifiable people/groups), diffuse (unidentifiable/future people), or hybrid.  
  - **Sufficient answer**: Table with effects and categorizations.  
  - **Insufficient answer**: Effects without categorization; conflating distinct effects.  
  - **If "don't know"**: Mark category as "unknown" and state why (e.g., "no data on labor market shifts").  
  - **Taxonomy note**: Drop "beneficiary concentration" if irrelevant (e.g., all effects diffuse). It rarely changes treatment in practice. Focus on **direction** and **reducibility**—they determine downstream handling.  

  **Step 3: Classify Uncertainty**  
  - **Task**: Assign one of three labels per effect from Step 2:  
    - **Tier 1 (Controlled Uncertainty)**: Direction known, magnitude bounded.  
    - **Tier 2 (Partially Controlled Uncertainty)**: Direction known, magnitude unbounded.  
    - **Tier 3 (Uncontrolled Uncertainty)**: Direction unknown.  
  - **Sufficient answer**: Justification for tier assignment (e.g., "Tier 3: Wage effects direction unknown per economist consultation").  
  - **Insufficient answer**: Arbitrary labeling without reference to Step 2.  
  - **If "don't know"**: Default to Tier 3 (worst case).  

  **Step 4: Judge Override Potential for Long-Term Effects**  
  - **Task**: Determine if long-term effects can override near-term effects using the **Conservative Override Rule**:  
    > *Remote/speculative consequences may override near-term effects only if:*  
    > (a) They are Tier 1 or 2 (direction known), AND  
    > (b) A conservative estimate of their value (using lower bound if positive/upper bound if negative) is ≥10x the near-term value.  
    > *Otherwise, they are inadmissible for override and only near-term effects drive the recommendation.*  
  - **Argument for the rule**: Expected value requires incorporating all material effects, but unbounded speculation invites gaming. The rule ensures:  
    - Only *directional-certain* effects can dominate (avoiding harm from blind gambles).  
    - The 10x threshold accounts for uncertainty (e.g., if long-term value could be $10M–$1B, use $10M for override).  
    - It balances the board’s policy (don’t ignore the long term) with auditability (prevents "just trust me" claims).  
  - **Discount rate handling**: Apply the 3% rate only to effects with *temporally defined cash flows* (e.g., "cash savings in Year 10"). For unbounded effects (e.g., "shifts political norms"), discounting is inapplicable—state this explicitly. **Recommendation**: Phase out the 3% rate; use 1% for >30-year effects pending board review. For now, apply 3% only where cash flows are defined.  

  **Step 5: Calculate Expected Value**  
  - **Task**: Compute a composite expected value (EV) score:  
    - Near-term effects (Step 1): Sum values; apply discounting if >1 year.  
    - Long-term effects (Step 2):  
      - Tier 1: Use midpoint of bounded range.  
      - Tier 2: Use conservative bound (lower if positive/upper if negative).  
      - Tier 3: Exclude (too speculative).  
    - EV = Sum of near-term + long-term values. Convert to a 1–10 scale if units differ (e.g., $ + DALYs).  
  - **Sufficient answer**: EV score with breakdown.  
  - **Insufficient answer**: No quantification (e.g., "large potential").  
  - **If "don't know"**: EV = near-term value only.  

  **Step 6: Assess Risks and Referral Triggers**  
  - **Task**: Flag:  
    - **Catastrophic risk**: Any Tier 3 effect with potential for severe harm (e.g., mass displacement). If present, auto-refer to board.  
    - **Value conflicts**: Effects pitting concentrated vs. diffuse beneficiaries (e.g., "harms landlords but helps future tenants"). If irresolvable via evidence, refer to executive director (ED).  
    - **Reducibility**: If Tier 2/3 uncertainty is reducible (Step 2), consider conditional funding.  
  - **Judgment call**: Officer must justify "catastrophic" or "irresolvable" labels.  

  **Step 7: Make Recommendation**  
  - **Fund**: EV > 0 and no red flags.  
  - **Fund Conditionally**: EV uncertain but reducible (e.g., "fund $250,000 pending baseline study").  
  - **Decline**: EV ≤ 0 or override rule not met.  
  - **Refer**: To ED for value conflicts; to board for catastrophic risk or mission-level pivots.  
  - **Traceability**: Memo cites step outputs (e.g., "Decline per Step 5: EV = -$20k").  

  #### Judgment Disclosure  
  - **Steps requiring judgment**:  
    - Step 4 (Override Rule application): Officer must justify conservative estimates.  
    - Step 6 (Catastrophic Risk/Value Conflicts): Officer defines "severe harm" or "irresolvable."  
  - **Gaming risks**: Applicants may overclaim "transformative" effects to trigger override. Mitigation: Require Tier 1/2 categorization (Step 3) and conservative estimates. Colleagues may inflate reducibility to enable funding—mitigation by requiring feasibility proof for studies.  

  ---

  ### Application to Example Grants  
  **Grant A: Cash Transfer Scale-Up ($1.2M)**  
  - **Step 1**: Direct effects = Increased consumption, health (RCTs show $3M net benefit). Strong evidence.  
  - **Step 2**: Indirect effects:  
    - Wage/land price distortions: Direction unknown, magnitude unknown, reducible (study feasible), diffuse.  
    - Donor influence on officials: Direction negative (per staff), magnitude unknown, reducible, diffuse.  
  - **Step 3**: Wage/land = Tier 3 (direction unknown); donor influence = Tier 2 (direction known).  
  - **Step 4**: Override? No—Tier 3 excluded; Tier 2 conservative value = unknown → cannot meet 10x threshold. Near-term dominates.  
  - **Step 5**: EV = $3M (near-term only).  
  - **Step 6**: No catastrophic risk. Value conflict? None. Reducibility = yes.  
  - **Step 7**: **Fund Conditionally** ("Require impact study on wage/land effects").  
  - **Officer reluctance**: None—direct effects strong.  

  **Grant B: Court Fees Advocacy ($300K)**  
  - **Step 1**: Direct effects = $120 saved × 40,000 people = $4.8M benefit. Small per capita but aggregate positive.  
  - **Step 2**: Indirect effects:  
    - Precedent for other states: Direction positive, magnitude unknown, irreducible, diffuse.  
    - Shift in court funding legitimacy: Direction positive, magnitude unknown, irreducible, diffuse.  
  - **Step 3**: Both = Tier 2 (direction known, magnitude unbounded).  
  - **Step 4**: Override? Conservative value = unknown → cannot quantify 10x override. Near-term dominates.  
  - **Step 5**: EV = $4.8M (near-term).  
  - **Step 6**: No catastrophic risk. Value conflict? None. Reducibility = no.  
  - **Step 7**: **Decline** (Indirect effects speculative; $4.8M is positive but low for $300K grant vs. alternatives).  
  - **Officer reluctance**: **High** (Trustee pet project; officer may emphasize "precedent" potential).  

  **Grant C: Fellowship for Catastrophic Risk ($500K)**  
  - **Step 1**: Direct effects = 5 researchers retained ($500K value). Modest.  
  - **Step 2**: Indirect effects:  
    - Reduce pathogen/AI risk: Direction positive, magnitude unbounded (applicant claims 0.001% reduction in $1T risk = $10M), irreducible, diffuse.  
  - **Step 3**: Tier 2 (direction known).  
  - **Step 4**: Override? Conservative value = $10M (applicant’s low-end estimate) vs. near-term $500K → 20x override threshold met.  
  - **Step 5**: EV = $10M (long-term conservative).  
  - **Step 6**: Catastrophic risk? No (grant reduces risk). ED’s "tail is invented" note: If unsupported, Step 2 evidence = "weak," but directional claim still holds.  
  - **Step 7**: **Fund** (Long-term override applies).  
  - **Officer reluctance**: None—supports tail-risk focus.  

  **Which grant will the officer not want?** Grant B (Court Fees) yields **Decline**—likely unpopular with its trustee champion.  

  ---

  ### What the Procedure Cannot Do  
  **Limitations**:  
  1. **Cannot eliminate uncertainty**: It systematizes ignorance but cannot turn Tier 3 effects into Tier 1.  
  2. **Cannot resolve value conflicts**: Defers to ED/board when concentrated vs. diffuse beneficiaries clash.  
  3. **Vulnerable to biased inputs**: Conservative estimates may undervalue high-upside grants.  

  **If EV maximization is infeasible**: Adopt a **satisficing** approach as the "least bad" alternative:  
  - **Procedure change**: Fund grants that meet a threshold of near-term benefit (Step 1) and have no Tier 3 catastrophic risks.  
  - **What we surrender**: The board’s goal of *maximizing* value. We default to avoiding harm over pursuing uncertain gains.  

  **Final Recommendation**: This EVU procedure is faithful to the policy and auditable. Implement it for 6 months, then review with the board.
