prompt: |-
  I teach a single seventy-five-minute session in a first-year interdisciplinary seminar at a small college — a required course with no prerequisites, built around case studies in prediction, with a different faculty member taking each week. My students are mostly intending majors in business, public policy, and environmental science; three of them have had a semester of high-school philosophy and none has had any philosophy of science. They come in having read about forty pages of Malthus's 1798 essay on population, including the doubling-every-twenty-five-years argument and the contrast between population's geometric increase and food's arithmetic one, plus a modern chapter arguing that he was simply refuted by events: the famines did not arrive on schedule, yields multiplied several-fold, and the birth rates of rich countries fell as incomes rose rather than climbing with them. So they arrive already settled. In my colleague's version of this week the verdict was Malthus was wrong, and what the students have taken from it is the general lesson that long-horizon catastrophe forecasts are worthless and that anyone who issues one is either a crank or selling something. I have one whiteboard, no slides, and I have to dislodge that lesson without, in the same breath, rehabilitating Malthus.

  My assigned concept is not Malthus himself but a piece of methodology: whether a theory can be right but early, and what would have to be true for postponing a failed long-run prediction to count as legitimate revision rather than as rescue. Plan the session for me; I do not want the concept explained to me, I want the teaching plan. Specifically: lay out the order in which the components have to be introduced and why that order and not another, saying explicitly what depends on what — my own guess is that they cannot understand what a rescue is until they can see the difference between a dated prediction and a standing tendency claim, and that they cannot see that difference until they have been made to notice that Malthus's own claim was conditional on the checks that hold population down, checks he revised between the first and later editions. Then tell me which single case should carry the whole thing, and what that case has to have and has to lack. I am doubtful about opening with the two-ratios arithmetic, because it invites them to grade Malthus's numbers rather than examine the structure of his claim; if you think it belongs anyway, tell me where and what job it is doing. I also want the case to let them see that right but early may be the wrong label altogether — that there are at least three distinct things that get collapsed into it: the mechanism was right and the parameters changed; the mechanism was right and the offsetting cause was real but unanticipated; and the prediction was never dated in the first place, so nothing could refute it.

  Give me the misconception map with placement, not just a list. My predictions about what they will say: that Malthus was wrong because technology happened, which treats a background assumption as a failed forecast; that wrong once means wrong forever, so any surviving use of his mechanism is nostalgia; that right but early is an all-purpose shield, which is half-right and needs to be sharpened rather than dismissed; and, from the business majors especially, that a conditional theory is unfalsifiable and therefore empty, which slides from a fair complaint about vagueness into throwing out everything with an auxiliary assumption attached to it. For each, tell me the point in the sequence where it must be headed off, and what to say at that point, because a couple of them will be fatal if they surface after I have already built on the opposite assumption. There is also a further difficulty I want your judgment on: I suspect the phrase right but early smuggles in an unnoticed asymmetry — a theory whose catastrophe is undated cannot be refuted by the catastrophe's non-arrival, but it cannot be confirmed by its eventual arrival either, because by then enough auxiliary assumptions will have been adjusted that no credit can be assigned to the original claim. Decide whether that belongs in a first-year session at all, and if so, exactly where. Relatedly, a demographer colleague on the course committee insists I bring in Boserup's counter-thesis from the 1960s, that population pressure is itself what drives agricultural intensification rather than being its victim, so that the causal arrow runs the other way; tell me whether that is a genuine asset here or a second theory they will fail to keep separate from the first.

  Finish with the parts people usually forget. Tell me what I should leave out at this level and say so out loud to the class — I am thinking of the full apparatus of research programmes and their progressive versus degenerating variants, the demography of the fertility transition, and the general point that a single theory is never tested in isolation, all of which I can gesture at but not teach in seventy-five minutes. And give me a closing check for understanding that is a transfer rather than a recap: one short non-population scenario, with no obvious right answer, in which they have to classify a deferral as revision or as rescue and defend the classification, plus what the different wrong answers to it would reveal about which piece of the sequence failed to land. Please do not recommend readings, sources, or further material for me or for them; I need the plan itself, timed to the whiteboard, with the reasoning for the ordering visible enough that I can adjust it if the room goes a different way.
reasoning: |-
  Hmm, this is an intricate teaching challenge. The user needs a carefully sequenced plan to dislodge students' misconception that Malthus was simply "wrong" while avoiding rehabilitating Malthusian doom-mongering. The core goal is teaching methodological concepts about prediction revision versus rescue operations.

  Key constraints stand out: 75 minutes, interdisciplinary first-years with minimal philosophy background, one whiteboard, and students arriving convinced Malthus was refuted. The pre-loaded misconceptions are particularly dangerous - especially the "wrong once means wrong forever" idea that could derail everything if not addressed early.

  The user's own insight about conditional claims versus dated predictions seems crucial. I'll build the session around that distinction, using Malthus's own revisions of "checks" to demonstrate how theories evolve. The whiteboard will need careful staging: probably starting with the geometric/arithmetic ratios not as math but as logic structure, then layering conditions.

  For the case study, I'm considering ozone depletion rather than climate change - it's resolved, shows institutional response changing outcomes, and avoids political polarization. The three "right but early" variants can be mapped neatly: mechanism correct (CFCs destroy ozone), parameters changed (Montreal Protocol), undated prediction (no specific collapse year).

  Timing will be tight. Must avoid: Boserup's theory (adds confusion), Lakatosian research programs (too abstract), demographic transition details. The closing transfer exercise with antibiotic resistance should reveal if they distinguish between legitimate parameter revision and ad hoc rescues.

  Biggest risk points: if students vocalize "conditional theories are unfalsifiable" before establishing difference between vague and precise conditionals, or if they dismiss offsetting causes as "rescues" rather than valid new variables. Need preemptive moves at minute 20 and 45.
answer: |-
  Here is a 75-minute teaching plan focused on methodology, sequenced to build understanding incrementally and disrupt misconceptions. The core case is **ozone layer depletion**, chosen because it demonstrates a deferred catastrophe avoided by human intervention without rehabilitating Malthus.

  **Whiteboard Notation Key:**  
  `[WB-1]` = Section 1 of Whiteboard, etc.  

  ---

  ### **Session Plan: "When is a Delayed Disaster Still a Good Theory?"**

  #### **PART 1: SETUP & MISCONCEPTION DISRUPTION (20 mins)**
  1.  **Hook (5 mins):**  
      *   "Malthus: Wrong or... ?" Poll students: *"Raise hand if you think Malthus's core argument was fundamentally disproven by history."* (Expect majority yes).  
      *   Challenge: *"What if I told you a theory *exactly* like Malthus's successfully predicted a global catastrophe? And we avoided it precisely *because* we believed the theory?"**  
      *   **WB-1:** Draw 2 columns: `Malthus Prediction` | `What Actually Happened`. Fill quickly with student input (Geometric Pop, Arithmetic Food -> Famine | Tech Growth, Falling Birth Rates, No Famine). Label: **"The Standard Verdict."**

  2.  **Introduce Core Distinction: Dated Prediction vs. Standing Tendency (10 mins):**  
      *   *"Let's look closer at what Malthus actually claimed."* Refer to text.  
      *   **Critical Move:** Highlight Malthus's **"checks"** (vice, misery, moral restraint). Emphasize revisions between editions.  
      *   **WB-2:** Diagram:  
          `Core Mechanism: Pop grows IF unchecked -> Presses on Resources`  
          `↓`  
          `Predicted Outcome: Famine/Misery (IF checks fail/are insufficient)`  
          `↓`  
          `Condition: Strength/Type of "Checks" Matters`  
      *   **Key Point:** *"Malthus wasn't mainly predicting 'famine in 1850'. He was describing a* **persistent tendency** *for population to outstrip resources* **UNLESS** *specific counteracting forces ('checks') operated strongly enough. The 'prediction' of famine is* **conditional** *on the checks failing."*  
      *   **Why Order Matters:** This disrupts "Malthus was simply wrong" by showing his claim wasn't a simple dated forecast. Must come BEFORE discussing "rescue" to define what is being rescued.

  3.  **Head Off Fatal Misconceptions (5 mins):**  
      *   **Misconception: "Technology happened = Malthus wrong."**  
          *   *Response:* "Did Malthus *forbid* technology? Or did his theory describe what happens *without* sufficiently powerful technological 'checks'? If tech acts as a new/modified 'check', does that *disprove* the core tendency, or show the *condition* changed?" (Point to WB-2 Condition).  
      *   **Misconception: "Wrong once = Wrong forever."**  
          *   *Response:* "If a theory says 'Smoking *tends* to cause lung cancer *unless* you have rare gene X', and I smoke and don't get cancer because I have gene X, does that mean smoking doesn't cause cancer? No. It means the *condition* (absence of gene X) mattered. The *tendency* wasn't false, the *context* changed."  
      *   **Placement Rationale:** Must address *immediately* after introducing conditionality. Letting these stand poisons the well for analyzing revision vs. rescue.

  #### **PART 2: CORE CASE STUDY - OZONE DEPLETION (30 mins)**
  4.  **Introduce Ozone Case (5 mins):**  
      *   **The Theory (Molina & Rowland, 1974):** CFCs (aerosols, fridges) rise to stratosphere -> UV breaks them -> Chlorine released -> Chlorine destroys ozone molecules (catalytic cycle) -> Thinning ozone layer -> More UV radiation reaches Earth -> Causes skin cancer, crop damage, ecosystem harm.  
      *   **WB-3:** Diagram: `CFCs Released -> Cl atoms -> O3 Destruction -> ↑UV -> Harm`. Label: **Core Mechanism.**  
      *   **Initial Predictions:** Severe ozone depletion (e.g., 7-13% loss by 2050), significant increases in skin cancer *within decades* if CFC use continued unabated. *Emphasize: Harm predicted, but timelines uncertain.*

  5.  **What Happened & The "Revision" (15 mins):**  
      *   **Discovery (1985):** Antarctic Ozone Hole (far worse/faster than models).  
      *   **Response (1987):** Montreal Protocol - Global treaty to rapidly phase out CFCs.  
      *   **Outcome:** CFCs plummet. Ozone layer *started recovering* ~2000, projected to heal ~2060s. **Catastrophe avoided.**  
      *   **WB-4:** Add to WB-3:  
          `↓`  
          `Predicted Outcome: Severe Ozone Loss -> ↑UV -> Harm`  
          `↓`  
          `Condition: IF CFC emissions continue unabated`  
          `↓`  
          `REVISION: Human Action (Protocol) drastically changed the condition (emissions stopped).`  
          `↓`  
          `Observed Outcome: Major loss (Hole) detected -> Action -> Recovery underway. Catastrophe deferred/avoided.`  
      *   **Analysis:**  
          *   *"Was the core mechanism (CFCs->Cl->O3 Destruction) wrong?"* (No, Nobel Prize awarded *after* the hole discovery/protocol).  
          *   *"Did the predicted harm (more UV) happen?"* (Hole caused measurable harm, large-scale harm was *prevented*).  
          *   *"Why didn't the full catastrophe happen?"* (The **condition** changed - human policy intervened as a massive new 'check').

  6.  **Distinguishing Revision vs. Rescue (10 mins):**  
      *   **WB-5:** Contrast Columns:  
          | **Legitimate Revision**             | **Ad Hoc Rescue**                |
          | :---------------------------------- | :------------------------------- |
          | **Core Mechanism Intact** (CFCs destroy O3) | Core Mechanism Weakened/Discarded |
          | **Change in Auxiliary Condition** (Emissions Policy) | Change Contradicts Core Mechanism |
          | **Independent Evidence** for Change (Observed Hole proved danger; Treaty docs prove action) | Change Arbitrary, No New Evidence |
          | **Predictive Power Retained/Refined** (Models improved w/ polar chemistry; Predict recovery *if* Protocol upheld) | Predictiveness Diminished |
      *   **Apply to Ozone:** Clearly fits "Legitimate Revision": Mechanism confirmed, condition changed *dramatically* based on *new evidence* (hole), *successfully predicted* recovery path under new condition.  
      *   **Apply to Malthus (Tentatively):** *"Could Malthusian pressure be a standing tendency? If so, what 'auxiliary conditions' changed? (Tech, Birth Control as new 'checks'). Was this change arbitrary? Or driven by evidence/necessity? Did it preserve predictive power?"* (Leave open - focus is methodology).  
      *   **"Right but Early" is Too Vague:** Explicitly map Ozone onto user's tripartite breakdown:  
          1.  **Mechanism Right, Parameters Changed:** *Yes* (Emissions parameter went to near zero).  
          2.  **Mechanism Right, Offsetting Cause Real but Unanticipated:** *Yes* (Global policy response *was* unanticipated in original models).  
          3.  **Prediction Never Dated:** *Yes* (Harm was imminent but not pinned to a single year; ongoing monitoring validated threat).  
      *   **Why Ozone Works:** Resolved case, clear mechanism, unambiguous human intervention as condition change, avoids Malthus rehab, fits all 3 "right but early" variants cleanly. Avoids two-ratios arithmetic trap.

  #### **PART 3: REFINEMENT, ASYMMETRY & CLOSING (25 mins)**
  7.  **Address Key Challenges (10 mins):**  
      *   **Asymmetry (Belongs Here - After Case):** *"Okay, so an undated catastrophe theory can't be falsified by non-arrival *yet*. But can it ever be confirmed? If ozone recovers in 2060, does that prove the 1974 theory right?"*  
          *   **Answer:** "Not solely. The *original mechanism* was confirmed *early* (by the hole, lab chemistry). The *avoidance* confirmed the power of intervention. The *recovery* confirms the *revised* theory incorporating the Protocol. **Original claims get credit for identifying the mechanism and the threat, but confirmation is cumulative and involves the whole evolving framework.**"  
      *   **Boserup? (Judgment: Omit):** "It's a fascinating *alternative* theory (population pressure -> innovation). Today is about examining the *structure* of *one* type of long-run claim (conditional tendency -> potential catastrophe) and how we judge revisions. Boserup flips causality – a different structural claim for another day." Adding it now confuses the methodological focus.
      *   **Misconception: "Conditional = Unfalsifiable = Empty" (Critical - Head Off Here):**  
          *   *Response:* "Unfalsifiable? The ozone theory made *risky predictions*: CFCs *will* reach stratosphere (confirmed); Cl *will* destroy ozone catalytically (lab & atmosphere confirmed); Ozone loss *will* cause more UV (confirmed over hole). **Conditionality doesn't mean vagueness.** Specific, testable conditional claims *are* falsifiable: *'If CFC use continues at 1970s rates, ozone loss will exceed 10% by 2000.'* That *was* falsified – but because the condition changed (use stopped), not because the mechanism was wrong. **The problem isn't conditionality, it's vagueness.** A *vague* conditional ('bad things might happen someday if we're not careful') *is* weak science."

  8.  **What to Leave Out (Say Explicitly - 2 mins):**  
      *   *"We're not diving into the full philosophy of 'research programmes' (Lakatos), the detailed history of the demographic transition, or the deep point that theories are always tested in clusters. Those are crucial, but for advanced study. Today we're building one key tool: distinguishing robust revision from desperate rescue in long-run conditional claims."*

  9.  **Closing Check for Understanding: Transfer Exercise (13 mins)**  
      *   **Scenario:** "A 1970s theory predicted that widespread use of *antibiotics in livestock feed* would, *over the coming decades*, lead to the *emergence and spread of bacteria resistant to those antibiotics*, eventually causing *major outbreaks of untreatable infections in humans*. Due to public pressure, many countries banned growth-promoter antibiotics in livestock starting in the 1990s/2000s. Today, antibiotic resistance is a massive global health crisis (e.g., MRSA, resistant TB), but the most dire predictions linking it *directly and primarily* to livestock use haven't fully materialized *yet*. Resistance clearly emerged, but complex factors (human overuse, hospital transmission, global travel) dominate."  
      *   **Task (Small Groups -> Class Debate - 8 mins):**  
          *   *"Was the deferral/partial avoidance of the* most dire *livestock-driven pandemic scenario a* **legitimate revision** *of the original theory, or an* **ad hoc rescue**? Defend using our criteria (Core Mechanism Intact? Change in Condition? Independent Evidence? Predictive Power?)."*  
      *   **What Wrong Answers Reveal (5 mins - Instructor Analysis):**  
          *   **"Rescue! Core mechanism broken!"**: Missed that resistance emergence *did* happen (core mechanism partly confirmed), confuses dominance of other factors with mechanism failure. (Failure: Distinguishing core mechanism from specific prediction/scenario).  
          *   **"Revision! They banned the drugs!"**: Overlooks lack of clear evidence that the *livestock ban alone* sufficiently changed the condition, or that core predictions about *livestock-driven* pandemics were robust. (Failure: Assessing "Independent Evidence" for condition change & retained predictive power).  
          *   **"Unfalsifiable! Just moved goalposts!"**: Ignores testable elements (Did resistance emerge in livestock/humans? Did bans reduce resistance in livestock?). (Failure: Understanding specific vs. vague conditionality).

  ---

  **Why This Sequence Works:**

  1.  **Confronts Misconceptions Early:** Directly tackles "wrong once/wrong forever" and "tech refutes Malthus" immediately after establishing conditionality, preventing them from festering.
  2.  **Builds Foundation:** Establishes *conditional tendency* vs. *dated prediction* BEFORE introducing "rescue," making the latter meaningful.
  3.  **Leverages Contrast:** Ozone provides a clean, successful contrast to Malthus *methodologically* without rehabilitating him. It exemplifies "legitimate revision."
  4.  **Deploys Criteria Explicitly:** WB-5 table provides clear, shared criteria applied to the case.
  5.  **Addresses Nuance at the Right Time:** Asymmetry and the "unfalsifiable" complaint are handled *after* students have engaged with a clear case of legitimate revision.
  6.  **Focus on Structure:** Avoids Malthus's specific ratios and Boserup's alternative, staying focused on the *logical structure* of conditional catastrophe claims.
  7.  **Transfer, Not Recap:** Antibiotic scenario forces application of criteria to a new, messy context, revealing true understanding.
  8.  **Manages Time/Scope:** Explicitly names excluded complex topics, keeping focus sharp. Ozone case efficiently demonstrates all target concepts.

  **Adjustments if Room Goes Differently:**

  *   **If stuck on "Malthus was just wrong":** Double down on conditionality. Ask: "What *exact* statement by Malthus was falsified? The geometric ratio? (Math is sound). The tendency? (Pop *does* grow rapidly absent checks; resource constraints *are* real). Or the prediction of imminent, unavoidable famine? (That depended on the 'checks' failing - did they? Or did we invent new ones?)".
  *   **If "unfalsifiable" arises earlier:** Briefly note: "Hold that thought - we'll get a clear test case with Ozone in 5 minutes to tackle that directly." Then address rigorously with Ozone evidence.
  *   **If Ozone mechanics confuse:** Simplify WB-3 to essentials: `Man-made Chemicals -> Destroy Protective Layer -> More Harmful Radiation`. Focus on the policy intervention as the condition change.
  *   **If time runs short:** Shorten Ozone history details; focus debate on 1-2 key criteria in transfer exercise. Ensure closing asymmetry point is made.
