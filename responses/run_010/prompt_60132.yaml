  The safety argument (Marcus's point 4) seems compelling emotionally but Dana preempts it perfectly: companies create fragile systems intentionally. Smart. Then Marcus pivots to the union's approval, which appears decisive... until Dana exposes his inconsistency in point 7. That's the kill shot - Marcus can't claim both that labor is individually owned AND that union consent matters. 

  User's real need here isn't just scoring points though. They're asking if any principle survives intact, and what should actually guide their decision. The union's explicit stance resolves the immediate question (covering safety escalations is fine if union-approved), but the deeper philosophical conflict remains unresolved. 

  What's illuminating is how Dana's arguments hold better structurally: 
  - Labor collectivism requires solidarity to counterbalance capital
