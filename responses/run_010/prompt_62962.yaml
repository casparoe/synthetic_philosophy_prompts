answer: |-
  **Repository:** Northern Atlantic Regional Depository (NARD)  
  **Creator:** St. Jerome's Foundling Mission & Industrial School, 1832-1921  
  **Title:** Records of Indentures and Disbursements, St. Jerome's Foundling Mission  
  **Inclusive Dates:** 1853-1898  
  **Bulk Dates:** 1865-1875  
  **Extent:** 0.25 linear feet (1 half-document box)  

  ### SCOPE AND CONTENT NOTE
  Records pertain to the administration of indentured apprenticeships and contractual obligations between St. Jerome's Mission and local businesses/farms. Includes bound volumes of indenture contracts (incomplete), quarterly inspection reports by Mission staff, invoices for clothing and tools issued, and correspondence regarding breaches of contract. Notable are sporadic valuation lists for transferred apprenticeships. **No personal correspondence or internal Mission diaries are present.**  

  ### ARRANGEMENT
  **Series I: Indenture Contracts, 1853-1890**  
  *   Folder 1: Fragmentary contracts (A-G), 1853-1862. Water damage.  
  *   Folder 2: Contracts (M-R), 1865-1871. Includes contract #1871-M-04: "Ana, female, aged approx. 12 yrs. Assigned to Seaforth Tannery. Valuation: $15."  
  *   Folder 3: Voided/breached contracts, 1872-1890. Includes deposition (1874) re: Contract #1871-M-04 (Ana), given by tannery foreman via court interpreter: "...found deceased at workstation... no marks of violence... prior complaint of cough noted." Signature field: [X] mark witnessed.  

  **Series II: Inspection Reports & Disbursements, 1860-1875**  
  *   Folder 4: Quarterly reports, 1860-1869. Standardized forms. "Ana" not mentioned.  
  *   Folder 5: Clothing/tool invoices, 1865-1875. Invoice #743 (1871): "1 pair boots, stout leather, size small; 2 woolens, grey; 1 awl." Issued to #1871-M-04.  

  **Series III: Valuation & Transfer Ledgers, 1867-1898**  
  *   Folder 6: Ledger pages, 1867-1873. Page 13: "#1871-M-04. Transferred to Seaforth Tannery. Value received: $15. Apprenticeship fee."  

  **Series IV: Personal Effects (Restricted)**  
  *   *Folder 7: [Empty. Label: "Effects - Ana. Returned 1874."]*  

  **Series V: Administrative Correspondence, 1870-1898**  
  *   Folder 8: Letters re: contractual disputes, financial audits. No mention of #1871-M-04 or incident.  

  ### ACCESS RESTRICTIONS
  **Series IV** sealed under donor agreement until 2100. Medical records and personal effects restricted per institutional policy (75 years post-creation). **Valuation ledgers (Series III)** restricted due to sensitive financial data until 2050.  

  ### RELATED MATERIAL
  *   Seaforth Tannery Records, 1840-1901 (Seaforth Historical Society, destroyed by fire 1932).  
  *   County Coroner's Inquests, 1860-1880 (County Clerk's Office, missing volume for 1874).  
  *   St. Jerome's Mission Baptismal Registry, 1835-1900 (Diocesan Archives. No entry for "Ana". Indexed under assigned numbers only).  

  ### PROCESSING INFORMATION
  Processed by NARD staff, 2023. Received as part of the larger "Coastal Missions Consortium" transfer, 2019. Original order of contracts largely lost prior to transfer; arranged alphabetically by processor based on surviving fragments. Folder labels reflect Mission filing practice. **Series IV folder found empty during processing.** Mission accession log (1899) lists "One bundle: clothing & small items, indentured #1871-M-04 (decd.), returned by Seaforth Tannery, 1874." Bundle not located in transfer. No further accruals expected. **Contained within Box 1 Folder 5, a single folio detached from the 1871 disbursement book: faint charcoal tracing of a small hand, palm down, on the reverse of invoice #743. Not noted in original accession. Filed as found. No trace of the awl.**

  ---

  **Form Defense Concept:** The finding aid structure inherently performs archival silencing. Ana exists *only* through institutional mediation: a valuation ($15), a contract number, a deposition filtered through an interpreter and foreman, an [X] mark, an invoice for boots and an awl. The empty "Personal Effects" folder and impossible restriction date (2100) materialize absence. The bulk dates (1865-1875) frame her brief, documented existence against the Mission's long history. The volta occurs in the processing note: the archivist discovers the handprint, a trace bypassing bureaucratic language, yet its inclusion remains passive ("filed as found") and the final line ("No trace of the awl") underscores the irretrievable context. This mirrors Trouillot’s moments: the source (contract) defines her as property; the archive assembles *only* those records; the narrative is dictated by arrangement (contracts, not lives); retrospective significance is locked away by restrictions. The archivist’s limited intervention (finding/recording the handprint) acknowledges the silence without claiming to "fill" it, embodying Hartman’s caution and the Derrida/Foucault critique of archival power embedded in selection and description. The form *is* the argument.
