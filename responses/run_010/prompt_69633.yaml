  ### Decision Tree: Closure/Tracking Debate Positions

  **Root Node: Zebra Case**  
  *Scenario:* At the zoo, you see a striped animal in the zebra pen. It’s a real zebra, but if it weren’t, it would be a cleverly disguised mule.  
  **Q1:** Do you know it’s a zebra?  
  - **Yes** → Go to Q2  
  - **No** → **Leaf: Skepticism** (denies most knowledge; holds that methods are easily deceived)  

  **Q2: Zebra-Mule Case** (same scenario)  
  **Q:** Do you know it’s *not* a disguised mule?  
  - **Yes** → Go to Q3  
  - **No** → Go to Q4  

  **Q3: Fake Barns County**  
  *Scenario:* Henry drives through a county with fake barn facades. He stops at the only real barn and believes "that's a barn."  
  **Q:** Does Henry know it’s a barn?  
  - **Yes** → Go to Q5  
  - **No** → **Leaf: Safety-Based Neo-Mooreanism** (knowledge requires safety: true belief in nearby worlds; denies "barns" knowledge due to environmental luck)  

  **Q4: Fake Barns County** (same as above)  
  **Q:** Does Henry know it’s a barn?  
  - **Yes** → *[Rare/unattractive]* → **Leaf: Other (Permissive Relevant Alternatives?)** (denies closure but accepts "barns" knowledge; likely incoherent with tracking)  
  - **No** → Go to Q6  

  **Q5: Stopped Clock**  
  *Scenario:* A broken clock shows 2:30. You look at it exactly at 2:30 and believe it’s 2:30.  
  **Q:** Do you know it’s 2:30?  
  - **Yes** → *[Unattractive]* → **Leaf: Other (Weak Safety?)** (accepts unsafe knowledge; often rejected as ad hoc)  
  - **No** → **Leaf: Safety-Based Neo-Mooreanism** (as in Q3 branch)  

  **Q6: Maya’s News (Actual)**  
  *Scenario:* Maya checks a trustworthy news app (reliable) for presidential travel. If the app were down, she’d use a satire site (unreliable). Today the app is up, and she learns the president is in Paris (true).  
  **Q:** Does Maya know the president is in Paris?  
  - **Yes** → Go to Q7  
  - **No** → Go to Q8  

  **Q7: Maya’s News (Counterfactual)**  
  *Scenario:* Same as above, but the app is down. Maya uses the satire site, which (luckily) reports the truth about Paris.  
  **Q:** In this case, does Maya know?  
  - **Yes** → *[Unattractive]* → **Leaf: Other (Lucky Method?)** (accepts knowledge via unreliable methods; clashes with tracking/safety)  
  - **No** → **Leaf: Tracking/Relevant Alternatives** (method-relative: knowledge if actual method tracks truth; denies counterfactual knowledge)  

  **Q8: Grandma Case**  
  *Scenario:* You see your grandmother and believe she’s healthy. If she were sick, she’d look the same and your family would hide it.  
  **Q:** Do you know she’s healthy?  
  - **Yes** → *[Rare]* → **Leaf: Other (Non-Sensitive Invariantism?)** (accepts insensitive knowledge; few defend)  
  - **No** → **Leaf: Interest-Relative/Pragmatism** (knowledge depends on stakes; denies "grandma" knowledge due to high-risk alternatives)  

