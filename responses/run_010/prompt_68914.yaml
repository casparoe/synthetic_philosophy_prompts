prompt: |-
  I write a weekly column on science and ideas for a general-interest magazine, and I'm doing a piece on why perfectly reasonable people freeze up between two options that are both good. My sidebar is going to be about Ruth Chang's work on hard choices — parity, the claim that the standard three-way scheme (better / worse / equally good) is missing a fourth relation, and the small-improvement move people use to argue that the "equally good" box doesn't fit these cases.

  Problem: every explainer ever written uses the same two examples, lawyer vs. artist or coffee vs. tea. I want a fresh one, and more importantly I want one that's actually *built* to do a job rather than just waved at. So here's the job.

  Design me a single realistic scenario — one paragraph, under about 250 words — that hits all four of these:

  1. Two options, A and B, genuinely on a par in Chang's sense: neither is better, neither is worse, and they're not "equally good" in the coin-flip-is-fine sense.
  2. Show the small-improvement test rather than asserting it. Pick one concrete small improvement to A — a specific dollar figure, a specific extra hour a week, a specific named perk — and argue from the details of your own case why A+ still doesn't come out better than B. If the only way to get that verdict is "because I stipulated it," the case fails.
  3. The twist, and thats the whole point: the agent has a decisive reason to pick one of them anyway, and that reason does not come from her own commitment, resolution, or act of will. It comes from outside — a fact about another person, an institutional rule, a fixed constraint she didn't choose. So reasons don't "run out" the way Chang's picture says they must in a real hard choice, even though the two options stay on a par.
  4. Constraints: no trolleys, no dying promises, no organ transplants, no sci-fi, nothing life-or-death. Mundane institutional setting preferred — a city department, a school, a family business, a lab, a newspaper. And the outside reason can't be a moral trump that swamps everything; A and B have to remain on a par *as options*, with the reason settling what to do rather than making one of them better.

  Then, after the scenario:

  - Run the checklist. For each of 1–4, show it's satisfied and name the specific detail in your story doing the work.
  - The cheating test: the reason in (3) must not already be smuggled into how you described A and B. Say explicitly whether it is. If a careful reader could object that you individuated the options too narrowly — fold that outside fact into A and A is simply better — concede it, then tell me what's left of the case after the objection is applied.
  - Give Chang's best reply, and also Broome's — the line that says there is no fourth relation and the whole hard-choice phenomenon is just vagueness in the comparative. Tell me which of the two does more damage.
  - Say what happens if I delete the outside reason: does the case collapse into the lawyer-vs-artist cliché, or is it still a different animal?

  No bibliography, no reading list, no quotes from anybody's actual writing — I can't verify any of that and my editor definately won't either. Define any jargon in a clause as you go.

  If you think the spec can't be jointly met — if (3) always collapses into (1), or always gets eaten by the option-individuation objection — say so plainly, give me the closest case you can build, and point at exactly where it breaks.

  End with one line and nothing after it, in exactly this form:
  Verdict: survives_chang = yes|no; load_bearing_feature = <five words or fewer>
reasoning: |-
  Okay, let me tackle this query. The user is a science columnist needing a fresh example for Ruth Chang's hard choices theory. They want a scenario that avoids clichés like lawyer vs. artist and meets four specific criteria. 

  First, I consider the core challenge: creating two options on par where an external reason breaks the tie. Mundane institutional settings are preferred, so I think about workplaces like universities or community centers. The key is ensuring the options remain incomparable even after a small improvement.

  For the small-improvement test, I need concrete details - maybe adding $500 to a budget or an extra staff hour. The improvement shouldn't make A better than B. Then comes the twist: an external constraint like a grant requirement or family rule that forces a choice without changing the options' parity.

  I worry about the "cheating test" - the external reason can't be baked into option descriptions. If I say "the grant requires renovation," that might make renovation better by definition. So I make the grant neutral in the initial comparison, only becoming relevant later.

  Broome's vagueness critique might apply here. The budget amounts could be seen as fuzzy rather than truly on par. But Chang would argue the values are distinct enough to resist easy comparison. The external reason provides clarity without changing the options' fundamental parity.

  When removing the external reason, the scenario shouldn't collapse to the cliché. Without the grant deadline, it's still about comparing different community benefits rather than personal careers. The institutional context keeps it distinct.

  I settle on a community center renovation dilemma: fixing the gym roof vs. expanding the kitchen. Adding $500 to the gym fund doesn't make it better than the kitchen project. Then a grant deadline forces the gym choice. This seems to satisfy all points while avoiding life-or-death stakes.
answer: |-
  Here’s the scenario:

  **The Community Center Dilemma**  
  Riverdale Community Center must allocate its final $15,000 of the fiscal year. Option A: Renovate the aging gymnasium floor ($15,000). The worn surface is a minor tripping hazard and discourages adult volleyball leagues, a key revenue source. Option B: Upgrade the commercial kitchen ($15,000). The outdated equipment hinders cooking classes and a weekly free meal program for seniors, vital for community outreach. Both projects address safety and participation, but target different groups and center missions (revenue vs. social service). A small improvement—finding an extra $500 specifically earmarked *only* for the gym project—makes the gym floor slightly safer (smoother seams) but doesn’t resolve the tripping risk entirely or suddenly attract more leagues. The gym project (A+) isn’t clearly *better* than the kitchen (B); the core trade-off between revenue stability and social impact remains unresolved by the marginal safety gain. However, the center’s bylaws *require* that any project using "facilities maintenance" funds (which this $15k is tagged under) must directly mitigate a documented safety risk *by the fiscal year-end* to qualify. The kitchen upgrade, while improving safety indirectly (e.g., reducing fire risk from old wiring), lacks the specific, immediate safety documentation the gym floor hazard provides. The staff must choose A to comply, even though B is equally compelling on the center’s overall merits.

  ---

  **Checklist & Analysis**  
  1.  **Parity Achieved:** Neither project is better/worse overall; they serve different core values (revenue vs. social service). The $500 improvement doesn’t tip the scales. **Detail:** The $500 improves gym safety marginally but doesn’t address its core limitation (league participation) or make it superior to the kitchen’s social impact.
  2.  **Small-Improvement Test Shown:** Adding $500 *only* to the gym project allows for smoother seams, a concrete, small safety upgrade. **Detail:** This improvement doesn’t eliminate the tripping hazard or boost revenue potential enough to make A+ definitively *better* than B; the fundamental value conflict persists.
  3.  **External Decisive Reason:** The center’s *bylaws* require using "facilities maintenance" funds only for projects directly mitigating documented safety risks by year-end. **Detail:** This is an external institutional rule. The gym floor has specific, documented tripping hazard reports qualifying it under the rule *now*; the kitchen’s safety benefits (e.g., fire risk reduction) are indirect/not formally documented for *this specific fund*. The rule forces choice A without making A inherently better than B.
  4.  **Constraints Met:** Mundane institutional setting (Community Center). No life/death. The bylaw doesn’t make A morally superior; it’s a procedural rule. A and B remain on par as *options for the center’s mission*; the rule dictates action based on fund tagging, not value superiority.

  **Cheating Test & Objection:**  
  *   **Is the reason smuggled in?** No. The initial description of A and B focuses solely on their *purposes* (gym safety/revenue, kitchen outreach/safety) and cost. The "facilities maintenance" fund tag and its rules are introduced *later* as the external constraint.
  *   **Objection:** "But you individuated the options narrowly! If 'A' *includes* 'using facilities maintenance funds', and the rule says those funds *must* be used for documented safety fixes, then A is simply the *permissible* option, hence better than B (which can't use these funds)."
  *   **Concession & What Remains:** The objection has force. If the *funding source and its rules* are part of the option definition from the start, then A (gym using *these specific funds*) might be better than B (kitchen using *these specific funds*) because only A complies.  
  *   **What's Left:** The core parity between the *projects themselves* (gym renovation vs. kitchen upgrade) *ignoring the specific funding constraints* remains. The external rule acts on *how* the money can be spent, not on the intrinsic value of the projects. The hard choice exists *before* considering the rule; the rule resolves it externally. Chang’s parity still applies to the underlying projects.

  **Critiques:**  
  *   **Chang's Best Reply:** She’d argue the external rule doesn’t alter the *parity* between the underlying values (revenue stability vs. social impact). The rule provides a non-evaluative, procedural reason for action ("must follow bylaws") that settles the choice *without* making one project better than the other on the merits relevant to the center’s mission. The "hardness" existed in choosing between fundamentally different kinds of good; the rule bypasses that evaluative deadlock.
  *   **Broome's Vagueness Critique:** Broome would argue the "values" (revenue, social impact, safety) are too vaguely defined. The $500 improvement *does* make A+ slightly safer than B, and the bylaw rule provides a precise criterion (documented safety risk). This collapses the supposed "parity" into vagueness; with sufficient specificity (exact safety metrics, precise bylaw criteria), one option *is* determinately better/worse/equal. The "hard choice" is just epistemic uncertainty.
  *   **Which Critique Does More Damage?** **Broome's critique does more damage here.** The scenario relies on somewhat fuzzy value comparisons ("revenue stability" vs. "social impact"). Broome would claim that with perfectly precise definitions of the values and their weights (e.g., exact dollar value of league revenue vs. quantified social benefit of senior meals, exact safety risk levels), coupled with the precise bylaw rule, the choice becomes computationally determinate, eliminating the need for Chang's fourth relation. The external rule highlights how specificity dissolves the apparent parity.

  **Without the Outside Reason:** Deleting the bylaw rule leaves a classic parity case: two valuable projects serving different core missions, neither better nor worse, not equally good (a coin flip feels wrong as it neglects the distinct values). It avoids the lawyer/artist cliché by being institutional (not personal career) and involving concrete community goods with a small-improvement test built-in. It’s a different animal – less about self-creation, more about institutional value pluralism.

  Verdict: survives_chang = yes; load_bearing_feature = external procedural rule
