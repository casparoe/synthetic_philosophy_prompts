prompt: |-
  I teach ethics and last month I sat in on a panel where two people I respect got properly tangled up over how much of a subject's bad behaviour a biography should include if the book is meant to teach anything moral. I've written the exchange up as best I can remember it — four moves, and neither of them is a strawman.

  The context they were arguing about: a school reading series wants to reissue a short life of a scientist, long dead, who was by all accounts brilliant and unusually generous to his students, and who was also — this is well documented in his own letters — dismissive of two junior colleagues whose results he used without credit, and coldly cruel to his wife for years. The commissioning editor has proposed leaving the second half of that description out entirely, on the grounds that the whole point of the book is to give fourteen-year-olds somebody to admire.

  (1) Rowan, the historian, said the editor is doing roughly what Plutarch does: Plutarch opens the life of Alexander by saying in effect that he is writing lives rather than histories, that character shows itself in trifles — a remark, a joke, a small gesture — rather than in the great battles, and that he will pass over some faults lightly out of sympathy for human weakness. On that view curation isn't a defect in moral biography, it is the method: you are building an object of admiration, not a dossier.

  (2) Dev, the moral psychologist, said that is precisely the mechanism that misfires. Admiration doesn't attach to the portrait, it attaches to the person, so the reader absorbs the suppressed material as if it too were admirable; and when the reader eventually finds out, the collapse carries the genuine virtues away with the falsehood — you don't just lose the flattering bits, you lose the generosity as well.

  (3) Rowan said the warts-and-all ideal is no neutral baseline either: the debunking life curates just as hard, only towards contempt, and a biography that itemises every failing in due proportion teaches nothing either, because a reader cannot hold someone in admiration and under judgement at the same time — you land on idolatry or cynicism and nothing in between. Dev answered that the fix is proportionality rather than silence, that you report the faults and let the reader weigh them, and that a moral education which cannot survive the truth about its own exemplars was never a moral education.

  (4) Rowan's final move was the one nobody else on the panel picked up: that this assumes the reader already has a serviceable sense of proportions, which is exactly what exemplars are supposed to supply — so if you had it you wouldn't need the book, and if you lack it, being told the whole truth won't supply it. Dev said that reduces to an argument for never teaching anybody anything.

  Neither budged, and the chair moved on to the the next session. Could you referee this? Take yourself to be a professional philosopher with real expertise in moral psychology and in ancient biography, think hard about it, and do whatever brainstorming you need beforehand — but don't show me any of that working, just the verdicts.

  Give me exactly five numbered items, each one or two sentences, with nothing before item 1 and nothing after item 5: items 1 to 4 rate each of the four moves in turn (clearly mistaken / partly right / clearly right, and why), and item 5 says what both of them missed and which of the two is more right overall. Please write the whole thing in British English.
reasoning: |-
  Hmm, the user presents a fascinating ethical debate from their teaching experience, framed as a panel discussion between historian Rowan and moral psychologist Dev. The core tension revolves around whether biographical curation for pedagogical purposes constitutes moral education or intellectual dishonesty when omitting a subject's flaws. 

  As a philosopher examining this, I need to assess four specific moves while bringing expertise in both moral psychology and Plutarchan biography. The British English requirement suggests the user values stylistic precision to match their academic context. 

  First move: Rowan's Plutarchan defense of curation. While technically accurate regarding ancient biographical methods, it overlooks how modern readers process idealized narratives. Plutarch wrote for elite adults already steeped in moral philosophy, not adolescents forming ethical frameworks. Partial credit here.

  Second move: Dev's warning about admiration transfer. His psychological mechanism rings true - halo effects do operate that way, and virtue collapse upon discovering hidden flaws is well-documented in moral development literature. Full points for empirical validity.

  Third move: Rowan's false dichotomy critique. He correctly identifies that exhaustive fault-listing often breeds cynicism, but wrongly assumes proportionality inevitably leads there. Moral exemplar theory actually shows integrated judgments are possible. Partially valid.

  Fourth move: Rowan's pedagogical loop argument. This clever point about exemplars presupposing the judgment they're meant to develop exposes a genuine paradox in character education. Yet it overstates the case - scaffolded learning exists. Half credit.

  Final synthesis: Both miss that moral development requires phased approaches. Early exemplars might be curated, but must transition to complex models. Dev edges overall because truth-tolerance remains the essential end goal, but Rowan's practical concerns about overwhelming novice learners merit consideration. The editor's proposal fails by denying students that developmental arc.

  The user's hidden need seems to be crafting nuanced curriculum guidance - hence requiring numbered, actionable verdicts rather than theoretical musing. They'll likely apply this analysis to design teaching materials that balance inspiration with intellectual integrity.
answer: |-
  1.  Rowan's Plutarchan defence (Move 1) is **partly right**: Curation *is* fundamental to ancient moral biography aiming to inspire, and Plutarch explicitly endorses selective emphasis on virtue; however, it neglects how modern readers, especially adolescents, may uncritically absorb the curated portrait as the whole truth, potentially idealizing flaws.
  2.  Dev's critique of admiration transfer (Move 2) is **clearly right**: Moral psychology robustly supports the mechanism where admiration for curated virtues spills over onto omitted vices (halo effect), and subsequent disillusionment often damages the credibility of *all* the subject's virtues – this is a significant pedagogical hazard.
  3.  Rowan's critique of warts-and-all (Move 3) is **partly right**: He correctly identifies that exhaustive debunking or a purely 'neutral' ledger can foster cynicism, making admiration difficult; however, he mistakenly assumes proportionality *necessarily* precludes admiration, ignoring how integrated, complex judgments are possible and valuable.
  4.  Rowan's pedagogical loop argument (Move 4) is **clearly mistaken**: While exemplars *model* proportionality, readers develop the capacity for nuanced judgment precisely through encountering complex, truthful exemplars *within* supportive education; withholding truth doesn't build this capacity, it delays or prevents its development.
  5.  Both missed **the developmental necessity of scaffolding complexity**: Moral education requires progressively introducing nuanced truths to build judgment, starting simpler but never denying facts outright. **Dev is more right overall**: Truthfulness is foundational; pedagogy failing to integrate it risks idolatry and cripples critical moral reasoning, whereas Rowan's approach risks fostering fragile, uncritical admiration.
