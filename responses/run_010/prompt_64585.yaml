prompt: |-
  I'm the community manager for a mid-size open source project — ~400 contributors, nearly all volunteers — and every couple weeks someone asks me to change or kill an unwritten practice. So far I've anwered by gut and gotten it wrong at least once (a maintainer forked over it). I'd rather use something like Lewis's account of convention: a regularity people keep to because they expect everyone else to keep to it, where some other regularity would have served just as well. Turn that into a procedure my three moderators (none of us have any philosophy background) could run in about half an hour on a disputed practice, with the output being: is this a convention in that sense or a different kind of norm, would a plain announcement from the maintainers actually shift it, and if not, what would. Build in the theory-breakers on purpose — practices everyone privately resents but keeps doing because they figure the rest still endorse them, and practices where the alternative isn't arbitrary at all because one option dumps the work on a particular group. Then run it on three of ours: design discussion has to happen in a public issue before anyone opens a PR; commit messages follow a prefix scheme nobody ever wrote down; and whoever originally wrote a file gets to approve changes to it. Tell me where the procedure is really just my judgment wearing a philosophical costume, how confident you are in each of the three classifications, and which one you're least sure about.
reasoning: |-
  Okay, the user is a community manager for a mid-sized open source project with about 400 contributors, mostly volunteers. They're dealing with requests to change or eliminate unwritten practices. They've been going by gut feeling but made a mistake that led to a maintainer forking the project. Now they want a structured approach based on David Lewis's convention theory. 

  First, I need to recall Lewis's definition: conventions are regularities people follow because they expect others to follow them, and there's an alternative that could have worked just as well. The user wants a procedure that their moderators (no philosophy background) can run in about 30 minutes per disputed practice. The output needs to determine if it's a convention, whether a maintainer announcement can change it, and if not, what would. They also want to account for theory-breakers like practices everyone resents but keeps due to perceived endorsement, or options that unfairly burden a specific group.

  The user provided three examples to test: 
  1. Public design discussions before PRs.
  2. Commit message prefix scheme.
  3. Original file author approval for changes.

  Breaking down the procedure into steps that are practical for non-experts. The steps should be straightforward: identify the regularity, check expectations, look for alternatives, and so on. Including the theory-breakers requires specific questions about resentment and workload distribution.

  For each step, I need to ensure it's not just disguised personal judgment. For instance, Step 3 (Arbitrary Alternatives) might be tricky because determining if alternatives are "just as good" could be subjective. But providing criteria like coordination efficiency and mutual benefit can help. Step 4 (Resentment Check) and Step 5 (Burden Analysis) are more concrete, asking for evidence like complaints or observable behaviors.

  Now, applying the procedure to the three examples:
  1. **Public Discussion Rule**: This seems like a coordination norm. People expect it because it's public and avoids duplicated work. Alternatives could be different (e.g., private chats first), but they might not be as efficient. A maintainer announcement might work here since it's about coordination. Low risk of resentment or burden.

  2. **Commit Message Prefixes**: Classic convention. The prefix scheme isn't documented, but everyone uses it because they expect others to. Any other scheme could work, so it's arbitrary. An announcement could shift it, especially with tooling support. No resentment or burden issues apparent.

  3. **Original Author Approval**: This is trickier. It's a norm based on ownership, but alternatives might not be equally good if they burden maintainers. There's potential resentment if authors are inactive. A maintainer announcement alone might not work; a sunset clause or documented policy would be better. This is the one I'm least sure about because the alternatives (e.g., maintainer approval) might shift workload, making it not arbitrary.

  Confidence levels:
  - Public Discussion: High confidence as coordination norm.
  - Commit Prefixes: Very high as pure convention.
  - Author Approval: Medium confidence due to potential burden issues.

  The user's deeper needs include preventing community fractures, ensuring efficient processes without burnout, and having a transparent method to justify decisions. The procedure needs to be practical, avoiding philosophical complexity while addressing real-world issues like resentment and unfair workloads. Highlighting where judgment might sneak in (like assessing alternatives) helps them stay vigilant. The sunset clause idea for the author approval norm addresses inactive maintainers, showing actionable solutions beyond just classification.
answer: |-
  Here's a procedural checklist based on Lewis's convention theory, designed for your moderators to run in ~30 minutes. It explicitly incorporates "theory-breakers" (resentment traps and burden imbalances) and outputs actionable conclusions. I'll then apply it to your three cases and flag judgment points.

  ---

  ### **Convention Assessment Procedure** (20-25 min discussion + 5 min vote)
  **Input:** A disputed practice (P)  
  **Output:** 
  1. **Classification:** Convention / Burden-Bearing Norm / Resentment Trap / Coordination Necessity  
  2. **Change Mechanism:** "Announcement Viable?" (Yes/No)  
  3. **Alternative Path:** If "No", what *would* shift it?  

  #### Step 1: **Identify the Regularity** (5 min)  
  - *Question:* "Describe P in one sentence. Is it universally followed? If not, who complies and who doesn’t?"  
  - *Tool:* Whiteboard examples of compliance/non-compliance.  
  - *Judgment Risk:* Low (factual observation).  

  #### Step 2: **Expectation Check** (5 min)  
  - *Question:* "Do people follow P primarily because they expect *others* to follow it? Would they stop if others stopped?"  
  - *Red Flag:* If "No", P is likely **not a convention** (may be technical necessity or moral rule).  
  - *Tool:* Ask: "If we discovered everyone secretly hated P, would compliance collapse?"  
  - *Judgment Risk:* Moderate (inferring motives).  

  #### Step 3: **Arbitrary Alternatives** (5 min)  
  - *Question:* "Is there a different practice (P2) that could solve the same problem *equally well*? Would switching to P2 be neutral if everyone agreed?"  
  - *Theory-Breaker 1 (Burden):* If P2 exists but concentrates work on a minority (e.g., maintainers), P is a **Burden-Bearing Norm**.  
  - *Tool:* List alternatives. Debate: "Would P2 *really* work as well, or does it help some while hurting others?"  
  - *Judgment Risk:* High (assessing "equal" effectiveness).  

  #### Step 4: **Resentment Check** (5 min)  
  - *Question:* "Is there evidence people follow P grudgingly? (e.g., jokes, complaints, passive compliance) Do they assume others *like* P?"  
  - *Theory-Breaker 2 (Resentment):* If yes, P is a **Resentment Trap**.  
  - *Tool:* Scan chat logs for sarcasm/complaints about P.  
  - *Judgment Risk:* Low (empirical evidence).  

  #### Step 5: **Vote & Output** (5 min)  
  - *Vote* on classification using Step 3-4 results.  
  - **Change Mechanism:**  
    - If **Convention** → "Announcement Viable? **Yes**" (Lewis: conventions shift via new focal points).  
    - If **Resentment Trap** → "Announcement Viable? **Yes**" (Revealing mutual dislike breaks the loop).  
    - If **Burden-Bearing Norm** or **Coordination Necessity** → "Announcement Viable? **No**" (Requires incentive restructuring).  
  - **Alternative Path:**  
    - "No" cases: Propose solutions (e.g., *sunset clauses*, *explicit opt-outs*, *burden-sharing rules*).  

  ---

  ### **Applied to Your Practices**
  #### Practice 1: *Design discussion in public issue before PR*  
  - **Step 1:** Regularity? → Followed by ~80% of contributors; newbies often skip.  
  - **Step 2:** Expectation? → Yes. People publicize designs because they expect others to demand it.  
  - **Step 3:** Alternatives? → Private chats (P2) could work but increase fragmentation risk. **Burden** on maintainers to track scattered convos. → **Burden-Bearing Norm**.  
  - **Step 4:** Resentment? → Occasional grumbling about "bureaucracy," but no widespread hatred.  
  - **Classification:** **Burden-Bearing Norm** (not pure convention: P2 isn’t equally efficient for maintainers).  
  - **Announcement Viable?** **No** (If you kill it without alternative, maintainers drown in fragmented discussions).  
  - **Alternative Path:** Propose a *lighter-weight public summary requirement* instead of full discussion.  
  - **My Confidence:** High (90%). Judgment crept in assessing P2’s viability, but burden evidence is clear.

  #### Practice 2: *Commit messages follow unwritten prefix scheme*  
  - **Step 1:** Regularity? → Followed by ~95% of contributors.  
  - **Step 2:** Expectation? → Yes. People use `fix:` because they see others do it.  
  - **Step 3:** Alternatives? → Any scheme (e.g., `[BUG]`, emojis) works equally well. No significant burden shift.  
  - **Step 4:** Resentment? → None observed.  
  - **Classification:** **Convention** (classic Lewis case).  
  - **Announcement Viable?** **Yes** (Maintainers can propose a new prefix set as a focal point).  
  - **Alternative Path:** N/A (announcement suffices).  
  - **My Confidence:** Very High (95%). Minimal judgment needed.

  #### Practice 3: *Original file author approves changes*  
  - **Step 1:** Regularity? → Followed for core modules (~50 files), ignored elsewhere.  
  - **Step 2:** Expectation? → Partial. Authors enforce it; others comply expecting author backlash.  
  - **Step 3:** Alternatives? → Maintainer approval (P2). Shifts burden from authors to maintainers → **Burden-Bearing Norm**.  
  - **Step 4:** Resentment? → Strong resentment when authors are inactive. Contributors assume authors "own" files.  
  - **Classification:** **Resentment Trap** (for inactive files) + **Burden-Bearing Norm** (for active authors).  
  - **Announcement Viable?** **No** (Announcement alone won’t fix inactive author bottlenecks).  
  - **Alternative Path:** *Sunset clause* ("If author unresponsive for 30 days, maintainers decide").  
  - **My Confidence:** Medium (70%). **Least sure here**—complex mix of resentment and burden. Judgment needed to weigh inactivity frequency.

  ---

  ### **Where Judgment Creeps In (The Costume Problem)**  
  - **Step 3 (Arbitrary Alternatives)** is the biggest "philosophical costume" for human judgment. Assessing "could another practice work *just as well*?" requires subjective trade-offs between efficiency, fairness, and scalability. Your moderators might disagree here.  
  - **Mitigation:** Focus on *observable evidence* (e.g., "When P2 was tried temporarily, did chaos ensue?") rather than hypotheticals.  

  ### **Recommendation**  
  Use this for initial triage. For Burden-Bearing Norms (like Practice 1), run a follow-up session to design burden-sharing solutions. The procedure exposes *why* a norm persists—so you avoid forking triggers like unilateral changes to Resentment Traps or Burden-Bearing Norms.  

  **Time Saver:** Pre-fill Steps 1-4 for moderators using chat logs/issue tracker data before the meeting.
