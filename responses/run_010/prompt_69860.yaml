  I should break down each possible reason for the stall. The verbal dispute seems central. Terms like "content of experience" are ambiguous. Philosophers might debate when experience happens, while neuroscientists focus on neural processes. This ambiguity lets each camp interpret data differently. For example, if an experiment shows online responses differing from reports, Orwellians might see it as post-hoc editing, while Stalinesque proponents see it as delayed construction. Same data, different stories.

  Then there's the metaphysical issue. If experience isn't punctate but extended, the whole debate might be misguided. Dennett's multiple drafts model suggests there's no single "now," which undermines both interpretations. But this is a foundational disagreement that's hard to test empirically.

  The user's bleed experiment is interesting. If sequence one's midpoint color shifts due to sequence two, that might support editing (Orwellian). No bleed suggests independent processing (Stalinesque). But as the user predicts, both sides could co-opt the results. For example, a bleed could be called postdiction (Stalinesque) or memory revision (Orwellian). This shows the labels are flexible, not falsifiable.

  So the core problem is that the frameworks are underdetermined by evidence. Each can explain any result by adjusting auxiliary assumptions. That's common in philosophy of mind, where theories are often judged by coherence rather than testability.

  What counts as progress? The user might need a shift in perspective. Instead of choosing between Orwellian and Stalinesque, focus on mechanisms like predictive processing or temporal windows. Empirical work on postdiction or neural delays could clarify processes without the loaded terms. Formal models showing how antedating works computationally might bypass the dichotomy. Or, accepting that consciousness might not have determinate contents at instants, leading to a different research program.

