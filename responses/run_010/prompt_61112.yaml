prompt: |-
  I retired four years ago from a career spent fitting models to spectra and light curves, and I have taken up philosophy late and rather seriously, mainly through a reading group of former colleagues and two patient graduate students. This term we have been working through the attempt to formalize simplicity and confirmation — the view, as I understand it, that the credibility of a hypothesis is governed by the length of the shortest program that would generate the observations given that hypothesis, so that a hypothesis with a shorter description carries a larger share of the prior. I find this attractive and unsatisfying in equal measure, because I have spent forty years making exactly these comparative judgments with considerable confidence and no formalism whatsoever. So I want to do the exercise in the other direction: rather than asking whether the formal account is true in the abstract, I want to lay out my own working verdicts on concrete cases and find out what principle, if any, they add up to.

  Here are the verdicts. First, given a dozen radial-velocity points, I judge a smooth three-parameter fit to be overwhelmingly better supported than a fifteen-term trigonometric sum that passes exactly through every point, even though the latter fits strictly better and the residuals of the former are visibly non-zero. Second, when the same dozen points turn out to be noise, and the shortest program reproducing them is essentially the tabulated values themselves, I refuse to call that program a theory at all — yet I take it that on the formal account it is precisely the leading candidate, which makes me suspect the account is scoring something other than what I mean by an explanation. Third, I care nothing for length measured in English prose: a rival whose informal statement fills a page but whose mathematical statement runs to three lines strikes me as simpler than one whose informal statement is a single sentence, so I must be measuring length in some privileged notation, and I cannot say which, since a physicist's notation and a logician's differ by far more than the handful of symbols I would tolerate as irrelevant. A colleague assures me that the choice of universal machine alters description lengths only by a constant that does not depend on the data; but a constant is exactly the wrong sort of thing to be reassured by when I am ranking two rivals whose lengths differ by less than that constant. Fourth, and this is the pair that troubles me most: the same nineteenth-century celestial mechanician twice patched a failing gravitational calculation by positing an unseen perturbing planet, once from the residuals of Uranus and once from the anomalous advance of Mercury's perihelion. The moves are structurally identical and, to my ear, differ in descriptive cost by a handful of bits; yet I regard the first as a magnificent confirmation of the theory that licensed it and the second as no confirmation at all, and I cannot locate the difference anywhere in the length of the descriptions. Fifth, in the opposite direction, I consistently prefer a hypothesis that is two pages longer provided it also accounts for a neighbouring class of phenomena I had not originally counted among the data — which suggests that what I am really tracking is not absolute length but the ratio of data compressed to bits spent, or perhaps the total length of the message comprising hypothesis plus data-given-hypothesis. That ratio-flavoured formulation is my own tentative principle, and I would like it tested rather than flattered. Finally, the case I keep going back and forth on: a law containing an empirically determined dimensionless constant, given to twelve significant figures. Those digits are by any measure incompressible bits in the program, so the formal prior should penalize the theory severely for them; and yet I do not feel that a theory is made less simple by containing a constant that had to be measured, and I would happily prefer it to a constant-free rival that fits appreciably worse.

  What I am after, then, is a principle — or a short list of competing candidates — stated precisely enough that I could apply it to a fresh pair of rivals on Monday morning without first consulting my intuitions about them. For each clause of each candidate, tell me which of my cases motivated it, since a clause that is not bought by a verdict is a clause I should be suspicious of. Then give me the candidates' verdicts on two or three cases I have not listed, including at least one where the deliverance would embarrass a working scientist who had been following it. And be candid about the casualties: which of my verdicts each candidate cannot preserve. I would far rather be told that the ratio principle costs me the fine-tuned constant, or that any principled account costs me the insistence that a table of noise is not a theory, than be handed something that reproduces all six verdicts by accreting clauses until the principle is as long as the cases it was built to cover. Two further questions, if you have room. Does anything change if I stop asking which hypothesis is simpler and ask instead which deserves the higher prior, or are those the same question in different clothes? And what is left of the reassurance about machine-independence once one grants that the constant multiplying two priors can exceed the difference between them?
reasoning: |-
  Okay, let me unpack this fascinating challenge from a retired astrophysicist diving into philosophy. The user has decades of hands-on experience modeling spectra and light curves but is now wrestling with formal accounts of simplicity in scientific theories. They've laid out six concrete cases where their intuitive judgments clash with Kolmogorov complexity-style approaches, and they want a principle that can actually guide real scientific choices, not just match pre-existing intuitions.

  First impression: This isn't just an academic exercise. The user is clearly frustrated with how existing formalisms (like minimum description length) fail to capture what actually matters when scientists evaluate theories. Their examples are brilliantly chosen to expose the cracks in simplistic "shorter = better" approaches. 

  Breaking down their key concerns:
  1. They reject overfitting even when complex models fit better (smooth curve vs. trig series)
  2. They dismiss "theories" that just tabulate noise
  3. They care about mathematical compactness over verbal length
  4. They see a crucial difference between Neptune's discovery (valid) and Vulcan's failure (invalid) despite similar formal structure
  5. They value explanatory breadth enough to accept longer theories
  6. They're untroubled by precise physical constants in theories

  The user's own "ratio principle" (data compressed per bit spent) is insightful but needs stress-testing. What's really impressive is their methodological clarity: they want falsifiable principles, not just intuition-matching. The machine-independence objection is particularly sharp - they've spotted that additive constants matter when differences are small.

  Hmm... where to start? The Neptune/Vulcan case (#4) feels like the linchpin. Both involved positing unseen planets to explain anomalies, but one succeeded while the other failed. The key difference isn't in the description length of "add a planet" - it's in the background theory's domain of applicability. Newtonian gravity was well-established for outer planets but already showing cracks at Mercury's scale. This suggests we need a "domain-appropriateness" clause.

  For the ratio principle (#5), it handles explanatory breadth well but stumbles on constants (#6). A 12-digit constant doesn't compress data but is physically necessary. Maybe we need to distinguish "freely specifiable" parameters from those constrained by deeper principles? Like how the fine-structure constant is "expensive" in pure MDL but feels different because it's fundamental.

  The noise-not-theory objection (#2) is devastating to vanilla Kolmogorov. A good principle must require that hypotheses generate predictions, not just retrodict. That points toward testability as a separate criterion from compression.

  Machine-independence worries (#3) cut deep. If the universal machine choice can flip rankings for close cases (like a 3-line formula vs. 1-page prose), then we're not measuring an intrinsic property. The user's right - additive constants aren't reassuring when differences are small. This might require privileging physical notations.

  Let me sketch candidate principles that might survive this gauntlet:
  Candidate A (Compression + Testability): Favors hypotheses that (1) compress data well (high log-likelihood per bit) AND (2) make novel testable predictions. This kills the noise-table (#2) for lacking (2), and explains why Neptune confirmed the theory (it predicted a new planet) while Vulcan didn't (just patched Mercury). But it still penalizes precise constants (#6).

  Candidate B (Stratified Simplicity): Ranks hypotheses by compactness in fundamental laws (math notation), ignoring parameter values that are fixed by data. So the gravitational constant's precision isn't penalized because it's not part of the law's "shape". This saves #6 but struggles with #4 (both Neptune/Vulcan use same fundamental laws).

  Candidate C (Toxicity Test): Asks "how many bits would this hypothesis save if nature were malicious?" A good theory shouldn't overfit - its compression should degrade gracefully with noise. The trig series (#1) fails because it memorizes noise. The constant (#6) passes because its precision doesn't help with unrelated data. Vulcan fails because it was ad hoc for Mercury alone.

  Now for the test cases they didn't mention:
  - Case X: Quantum electrodynamics vs. classical EM with tiny corrections. QED has more complex math but explains atomic spectra exactly. All candidates should prefer QED (better compression of atomic data).
  - Case Y: String theory vs. standard model. String theory is longer but unifies forces. Candidate A prefers if it predicts something testable; B prefers if its core equations are compact; C is skeptical without evidence it compresses known data.
  - Embarrassment case: Epicycles. Mathematically compact for planetary orbits, but we now know they're wrong. Candidate B might prefer them over Kepler's ellipses initially (shorter description), which would embarrass modern scientists. Shows why testability matters.

  On the prior vs simplicity question: They're linked but not identical. Priors can incorporate simplicity plus other factors (like explanatory scope). The ratio principle is really about posterior odds.

  Machine-independence: The reassurance fails for close calls. If two theories differ by less than the machine constant, we must appeal to physical relevance of the notation - which brings us back to the user's intuition about mathematical compactness.

  Casualties are inevitable: 
  - Candidate A loses the untroubled attitude toward constants (#6) 
  - Candidate B can't distinguish Neptune/Vulcan (#4) 
  - Candidate C struggles with mathematical elegance (#3)

  The user's willingness to sacrifice some verdicts is refreshing. Maybe the answer is acknowledging that no single principle covers all cases - but their ratio principle plus testability comes closest for real science.
answer: |-
  Your methodological clarity is admirable—testing principles against concrete judgments rather than seeking intuition-preserving epicycles. Below are three candidate principles distilled from your verdicts, each sacrificing some intuitions to preserve others. I state them operationally, map them to your cases, and reveal their casualties.  

  ---

  ### **Candidate 1: Explanatory Efficiency**  
  *"Prefer hypotheses maximizing the ratio of **novel empirical content** (in bits) to **descriptive cost** (in bits of the hypothesis + parameters), where ‘novel’ means *testably distinct* from the data used to construct it."*  

  - **Motivations**:  
    - **Smooth fit > Overfit trig series (Case 1)**: The trig series has high cost (15 params) but near-zero novel content—it predicts only the exact data points. The smooth fit compresses data into generalizable structure.  
    - **Rejecting noise-tables (Case 2)**: A table of noise has zero novel content; it predicts nothing beyond itself.  
    - **Preferring broad explanations (Case 5)**: Accounting for extra phenomena increases numerator (novel content) without proportionally increasing cost.  
    - **Fine-tuned constants (Case 6)**: Constants measured to high precision *are* costly but tolerated if they enable novel predictions (e.g., dark energy density in ΛCDM).  

  - **Verdicts on New Cases**:  
    - *Case A (Epicycles vs. Ellipses)*: Kepler’s ellipses (3 laws) beat Ptolemy’s epicycles (dozens of cycles) *only after* predicting Tycho’s unseen data. **Before novel predictions**, epicycles win—embarrassing but historically accurate.  
    - *Case B (Quantum Field Theory vs. Classical+Adjustments)*: QFT has immense descriptive cost (renormalization, fields) but explains particle creation/annihilation—novel content classical physics cannot. QFT wins despite length.  
    - *Case C (Lorentz vs. Einstein)*: Special relativity wins over Lorentz’s contracting bodies: same equations, but Einstein’s derivation (E=mc²) implied novel nuclear energy predictions.  

  - **Casualties**:  
    - **Neptune/Vulcan asymmetry (Case 4)**: Both posits had identical descriptive cost and *initial* novel content (predicting orbital residuals). This principle cannot distinguish them without hindsight.  
    - **Notation-dependence (Case 3)**: Requires defining "novel content" objectively—challenging without a universal measure of testable distinctions.  

  ---

  ### **Candidate 2: Stability Under Noise**  
  *"Prefer hypotheses whose **compression ratio** (data size / hypothesis size) degrades minimally under small perturbations to the data."*  

  - **Motivations**:  
    - **Smooth fit > Overfit trig series (Case 1)**: Adding noise makes the trig series’ description length explode; the smooth fit remains stable.  
    - **Rejecting noise-tables (Case 2)**: Randomize one data point, and the entire "theory" (table) must be rewritten—maximal instability.  
    - **Fine-tuned constants (Case 6)**: A theory with a 12-digit constant is unstable—tiny data changes require constant recalibration. *But* if the constant is derivable from deeper laws (e.g., ℏ from QM axioms), stability improves.  

  - **Verdicts on New Cases**:  
    - *Case D (Overfitted Climate Model)*: A model matching 100 years of data exactly with 100 parameters fails if 1 year’s data is tweaked; a simple CO₂-forcing model remains robust.  
    - *Case E (Vulcan’s Failure)*: Adding new Mercury data would force re-tuning Vulcan’s orbit (instability), while GR needed no ad hoc patches.  
    - *Case F (Deep Learning vs. Physics)*: A neural net predicting planetary motion is unstable to noise; Newton’s F=GMm/r² is stable. The NN wins only if data is vast and noisy (e.g., protein folding).  

  - **Casualties**:  
    - **Explanatory breadth (Case 5)**: A hypothesis explaining "neighbouring phenomena" may *increase* sensitivity to noise (e.g., adding weak effects).  
    - **Neptune’s success (Case 4)**: Neptune’s prediction was initially stable under new Uranus data—but so was Vulcan’s for Mercury until Le Verrier’s death.  

  ---

  ### **Candidate 3: Causal Depth**  
  *"Prefer hypotheses that invoke **fundamental mechanisms** over those that describe patterns, penalizing ad hoc elements by the bit-length of their *unexplained premises*."*  

  - **Motivations**:  
    - **Neptune vs. Vulcan (Case 4)**: Neptune invoked gravity—a fundamental mechanism already explaining tides, falling apples, etc. Vulcan was *ad hoc*: no independent evidence for a planet altering *only* Mercury’s orbit.  
    - **Fine-tuned constants (Case 6)**: Constants are cost-free if derived from deeper principles (e.g., G from string theory). If not, their unexplained precision is penalized.  
    - **Notation (Case 3)**: "Fundamental" implies a physical (not just mathematical) ontology—privileging notations tied to causal structures (e.g., Lagrangians).  

  - **Verdicts on New Cases**:  
    - *Case G (Phlogiston vs. Oxygen)*: Phlogiston’s "negative mass" was *ad hoc*; oxygen reduced combustion to atomic bonding—a fundamental mechanism.  
    - *Case H (Dark Matter vs. MOND)*: Dark matter (unobserved particles from fundamental symmetries) beats MOND (ad hoc gravity tweak) *despite* MOND’s brevity.  
    - *Case I (Astrology)*: Fits personality data with few bits (e.g., "fire signs are impulsive") but fails by invoking astral "influences" with no mechanistic basis.  

  - **Casualties**:  
    - **Smooth fits (Case 1)**: A polynomial fit has no causal depth—it’s just a pattern. If data is purely phenomenological (e.g., economic trends), this principle may prefer false mechanisms.  
    - **Noise-tables (Case 2)**: Rejected correctly, but for the wrong reason: they lack mechanisms, but so do good phenomenological models (e.g., radioactive half-life).  

  ---

  ### **Your Tentative Principle Tested**  
  Your ratio principle ("data compressed per bit spent") aligns with **Candidate 1** but stumbles on:  
  - **Case 4 (Neptune/Vulcan)**: Identical initial compression ratios.  
  - **Case 6 (Constants)**: A 12-digit constant spends many bits for near-zero compression if data is sparse. You tolerate this because constants may *later* compress new data—but the principle as stated doesn’t include future data.  
  - **Case 3 (Notation)**: Ratios depend on the encoding of "data" and "hypothesis."  

  ---

  ### **Answers to Final Questions**  
  1. **Simplicity vs. Prior**:  
     - They *diverge* when simplicity is formalized as brevity, but prior plausibility includes empirical fit, coherence with background knowledge, and explanatory power. In your cases:  
       - Vulcan was *formally* simple but implausible due to Mercury’s context (fringe of GR validity).  
       - A constant’s *simplicity* is low (many bits), but its *prior* may be high if fundamental (e.g., c).  
     - **Verdict**: Simplicity is one factor in priors, not identical.  

  2. **Machine-Independence Reconsidered**:  
     - The constant *K* (from choice of universal machine) is irrelevant only when |∆length| >> *K*. In close calls (e.g., 3-line math vs. 1-page prose), *K* can flip rankings.  
     - **Resolution**: Physical scientists implicitly use a "natural" machine (e.g., quantum fields + calculus) where *K* is small for hypotheses mirroring physical law. This privileges your intuition for mathematical brevity over verbal length.  

  ---

  ### **Synthesis**  
  No candidate preserves all verdicts, but **Candidate 1 (Explanatory Efficiency)** covers the most (Cases 1,2,5,6) if augmented:  
  - Add **Stability Clause** to address Case 1 (overfitting) and Case 2 (noise).  
  - Add **Mechanism Clause** to address Case 4 (Neptune/Vulcan).  

  **Operational Principle for Monday Morning**:  
  *Rank hypotheses by:  
  `(Novel predictive bits × Stability under noise) / (Ad hoc bits + Fundamental mechanism cost)`*  
  ...where:  
  - *Novel predictive bits* = log₂(1/p) for *testably distinct* predictions.  
  - *Ad hoc bits* = parameters unexplained by mechanisms.  
  - *Stability* = 1 / |∆compression| under data noise.  

  This sacrifices mathematical elegance but mirrors your working scientist’s judgment: **Neptune confirmed Newton because it predicted a new planet *testably*; constants are tolerable if *fundamental*; and noise-tables fail because they predict *nothing new*.**
