prompt: |-
  For the better part of two decades I have been a devoted reader of the rationalist blogosphere, and for most of my working life I have been on the operational side of the map/territory distinction: I build and maintain the taxonomic backbone of a large biodiversity occurrence aggregator. Roughly speaking, every record in our holdings — a geotagged photograph, a museum specimen, a tissue sample with a barcode, a legacy survey row — must be assigned exactly one species key, and that key is what downstream users cite, permalink, and run ecological models against. My team argues endlessly about which expert treatment to follow, but I have come to suspect the argument is upstream of any particular treatment.

  What I want is the specification, not the survey. Write out the desiderata that a species concept must satisfy in order to be adequate as the assignment rule for an infrastructure like ours: for each requirement, give the consideration or the concrete case that motivates it, and mark whether it is non-negotiable for our purpose, negotiable, or merely a preference of one school. Then tell me which requirement does the most work in excluding candidates, and whether some subset is jointly unsatisfiable. If you believe a subset is unsatisfiable, state it as an impossibility result with the reasoning laid out — not as a reverent gesture toward mystery. I would rather be told that two of my demands contradict each other than be told that species are complicated.

  The constraints I already suspect belong on the list, which I want you to pressure-test, sharpen, or reject rather than merely restate:

  - Assignment must be possible from an isolated record. Our pipeline never has the population in front of it: no mate choice observed, no sympatry map, no breeding experiment. Concepts whose criteria are population-level properties have to say what happens when only one individual is available.
  - The key must be stable enough that a citation made five years ago does not silently change referent, yet revisable when the taxonomy genuinely improves. I want to know whether any concept can reconcile those two, or whether the demand is simply ill-posed.
  - Hybrids and heavily introgressed lineages must resolve to something without crashing the pipeline. When a concept answers that there is no fact of the matter, I need to know whether that is a defect of the concept or of my pipeline.
  - Where two authoritative treatments conflict, we currently retain both keys and flag the record as ambiguous. Is there any concept that can underwrite that practice as principled, or is it a confession?
  - Diagnosability, monophyly, and separately-evolving-lineage status come apart constantly, and each has been proposed as the essence. I want to know which of my requirements are artifacts of the reference-fixing purpose, and which any purpose — including a purely predictive one, where the key exists to license ecological generalization — would have to respect.

  Finally, and briefly: assess whether the standard two-tier move — a stable operational key kept separate from a truth-apt lineage hypothesis — actually discharges the tension or only relabels it. If you feel moved to score the main family of concepts against your list, keep it to a few lines at the end; the criteria are what I am after. No bibliography, no reading list, no citations.
reasoning: |-
  Okay, this user is deeply entrenched in the practical challenges of taxonomic assignment within biodiversity informatics. They've spent two decades in the rationalist community and operational taxonomy, which means they value precision and hate hand-waving. Their core frustration is that species concepts aren't built for infrastructure—they want specifications, not philosophy. 

  First, let's unpack their constraints. The requirement for assignment from isolated records is brutal but non-negotiable; their system handles specimens one-by-one. Any concept relying on population data is dead on arrival. Hybrids breaking pipelines is another pain point—they need resolution, not existential doubt. Stability versus revisability feels paradoxical, but they're right to demand clarity: is this tension resolvable or fundamentally ill-posed? 

  The ambiguity flagging practice is interesting. They suspect it might be a cop-out rather than principled. And the diagnosability/monophyly/lineage-status triangle? They want to know which conflicts stem from their reference-fixing role versus universal needs. 

  I'll need to reframe their constraints as testable criteria. For hybrids, the answer isn't "it's complicated"—it's "your pipeline must resolve to operational units, so the concept must permit that." For stability, I'll argue it's a metarequirement: operational keys aren't truth claims but tags, so stability is about reference persistence, not taxonomic correctness. 

  The impossibility result jumps out: you can't have both instantaneous assignment from minimal data *and* perfect alignment with lineage reality. That's not mystery-mongering—it's a hard tradeoff. The two-tier approach (operational keys vs. lineage hypotheses) doesn't dissolve tension but manages it by decoupling functions. 

  Down to brass tacks. Monophyly fails the isolated-record test. Lineage concepts fail hybrid cases. Diagnosability is the most functional... but even that cracks under certain hybrids. In the end, their infrastructure needs a pragmatist's concept—one that admits its compromises.
answer: |-
  Here is a pressure-tested specification for a species concept serving as an assignment rule in biodiversity infrastructure, derived from your operational constraints. Requirements are ranked by criticality, with justification, negotiability, and conflict analysis.

  ### Core Requirements (Non-Negotiable)

  1.  **Atomic Assignability**
      *   **Desideratum:** Assignment must be possible for a *single* record using only data attached to that record (morphology, genetics, location, date). No population-level properties (mate choice, breeding data, sympatry) can be required.
      *   **Motivation:** Your pipeline processes records individually. Concepts like Biological Species Concept (BSC) fail here.
      *   **Negotiability:** Non-negotiable. Infrastructure requirement.
      *   **Exclusion Power:** High. Eliminates BSC and other purely interbreeding/population concepts.

  2.  **Stable Reference with Revisability**
      *   **Desideratum:** A key assigned to a record must persistently refer to the *same operational unit* over time, even as underlying knowledge and taxonomy change. However, the system must allow keys to be *updated* when the *operational definition of the unit* demonstrably improves (e.g., major split based on new evidence).
      *   **Motivation:** Downstream citations/links break if keys silently change meaning. Science stalls if keys cannot incorporate genuine improvements. This is a demand for *reference persistence*, not taxonomic stasis.
      *   **Negotiability:** Non-negotiable. Core infrastructure requirement.
      *   **Exclusion Power:** Moderate. Requires explicit versioning or context-stable definitions. Eliminates concepts that intrinsically tie keys to volatile hypotheses (e.g., strict monophyly without operational anchors).

  3.  **Operational Resolution for Hybrids/Introgression**
      *   **Desideratum:** Every record, including known hybrids or introgressed individuals, must resolve to *exactly one* key. The concept must define what that key represents in non-typical cases (e.g., "assigned to parental species A", "treated as operational hybrid swarm X", "assigned to species B with introgression flag").
      *   **Motivation:** Pipeline crashes on unresolved entities. Downstream models need deterministic input. "No fact of the matter" is a pipeline defect *in this context*.
      *   **Negotiability:** Non-negotiable. System integrity requirement.
      *   **Exclusion Power:** Very High. Eliminates concepts that declare hybrids "non-species" without providing an operational assignment rule. Pure lineage concepts struggle.

  ### Critical Requirements (Highly Negotiable Only with Cost)

  4.  **Formalized Ambiguity Handling**
      *   **Desideratum:** Where authoritative treatments conflict *under the chosen concept*, the system must have a clear, auditable mechanism to flag records as ambiguous *between specific, defined keys* (not vague uncertainty).
      *   **Motivation:** Current practice needs theoretical grounding. Ambiguity arises from conflicting evidence/data application, not concept failure.
      *   **Negotiability:** Negotiable *only* if an alternative provides deterministic assignment *without* information loss. Ambiguity flags are preferable to forced, arbitrary assignment.
      *   **Exclusion Power:** Low. Most concepts can accommodate this practice if ambiguity is defined as conflicting *applications* of the concept, not a flaw *of* the concept itself.

  5.  **Diagnosability Primacy**
      *   **Desideratum:** Assignment must rely primarily on *diagnosable characters* (morphological, genetic, behavioral) observable on the specimen/record itself. Monophyly and lineage status are secondary considerations used to *define* the units *behind* the key, not direct assignment criteria.
      *   **Motivation:** Isolated records only have characters. Monophyly requires population/genomic data often unavailable. Predictive power (ecological generalization) relies on shared, diagnosable traits.
      *   **Negotiability:** Highly Negotiable *in definition*, Non-negotiable *in assignment method*. The *unit* can be defined using lineage concepts, but the *assignment rule* must use diagnosable proxies.
      *   **Exclusion Power:** Moderate. Demotes strict monophyly from an assignment criterion to a unit-defining ideal. Favors Phylogenetic Species Concepts (PSC) based on diagnosability over those based solely on clades.

  ### Impossibility Result & Key Tension
  *   **The Core Tension:** **Atomic Assignability & Operational Resolution** fundamentally conflict with **perfect alignment with evolutionary reality (Lineage Status)**.
  *   **Impossibility:** It is impossible for a concept to **simultaneously guarantee:**
      (A) Deterministic assignment for *every single isolated record* (including complex hybrids) based *only* on its intrinsic data.
      (B) Perfect reflection of the "true" evolutionary lineage status in *all cases*.
  *   **Reasoning:** Evolutionary processes (hybridization, incomplete lineage sorting, rapid divergence) create entities intrinsically ambiguous or non-monolithic from a lineage perspective. Requirement (A) forces a *deterministic operational categorization* onto this complexity. Requirement (B) demands that the categorization *always* matches the complex reality. This is impossible at the margins. Your pipeline *requires* (A); evolutionary biology reveals why (B) cannot be fully satisfied by any system forced to satisfy (A).

  ### The Two-Tier Move: Relabeling, Not Discharging
  *   **Stable Operational Key (e.g., "Genus species sensu Reference Y v2023")**: Solves **Stable Reference** (persistent identifier) and enables **Atomic Assignability**/**Operational Resolution** by providing defined, versioned units based on **Diagnosability Primacy**.
  *   **Truth-Apt Lineage Hypothesis (e.g., "Species X represents an independently evolving lineage")**: Represents the evolving scientific understanding.
  *   **The Tension Relabeled:** The tension isn't discharged; it's managed by decoupling functions. The operational key provides stability and resolution for the infrastructure. The lineage hypothesis represents current scientific truth. The tension manifests as the *mapping effort* between the stable operational key set (which changes discretely via version updates) and the continuously evolving lineage hypotheses. The impossibility result above means this mapping will always have points of discordance. The system flags **Ambiguity** when mapping authoritative lineage hypotheses *back to operational keys* yields conflicting assignments.

  ### Which Requirement Does the Most Work?
  **Operational Resolution for Hybrids/Introgression** does the most work in excluding candidate concepts. It immediately eliminates concepts that cannot provide deterministic assignment rules for non-standard cases (e.g., BSC's failure for asexuals/hybrids, some lineage concepts for hybrids). **Atomic Assignability** is a close second.

  ### Brief Concept Scoring Against Requirements
  *   **Biological (BSC):** Fails 1 (Atomic), 3 (Resolution). Useless.
  *   **Morphological:** Scores well on 1, 3 (if defined operationally), 5. Poor on 2 (if unstable), 4 (if not formalized). Often lacks evolutionary basis.
  *   **Phylogenetic (PSC - Diagnosability):** Best fit. Scores well on 1, 3, 4, 5. Challenged on 2 (stability) if definitions shift constantly, but manageable via versioning.
  *   **Phylogenetic (PSC - Monophyly):** Fails 1 (requires clade assignment, often population-level). Struggles with 3 (hybrids). Poor fit.
  *   **Evolutionary/Lineage:** Fails 1 (population-level). Struggles with 3. Poor fit.
  *   **General Lineage Concept:** Provides philosophical basis but lacks inherent operational rules. Needs coupling (e.g., to PSC-diagnosability) for assignment.

  **Conclusion:** Your infrastructure fundamentally requires an **operational concept prioritizing diagnosability and deterministic assignment** (e.g., a robustly defined Phylogenetic Species Concept based on fixed character states). The impossibility result means this will never perfectly mirror lineage reality. The two-tier system (stable operational key + lineage hypothesis) manages, but does not eliminate, this tension by separating infrastructure needs from scientific truth. Ambiguity flags are principled when reflecting genuine conflict *in applying the operational concept* to available data.
