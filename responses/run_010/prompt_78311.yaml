reasoning: |-
  We are given a workshop with two groups: philosophy grad students (familiar with Lewis) and epi/biostat people (familiar with DAGs). The topic is what interventionism (Woodward/Pearl) adds to Lewis's counterfactual account and where they come apart.

  **The Wedge (One-Sentence Opener):**
  "The key difference is that interventionism explicitly requires a causal system to be represented with manipulable variables and an intervention that breaks existing causal dependencies, while Lewis's counterfactual account relies on similarity of worlds and does not require specifying the mechanism of change."

  **The Plan:**

  1. **Set the Stage (10 minutes):**  
     - Briefly define the two frameworks without deep explanation:  
       - **Lewis counterfactuals:** A statement "A causes B" is true if in the closest possible world where A is false, B is also false. The closeness is determined by a similarity metric over possible worlds.  
       - **Interventionism (Woodward/Pearl):** A causal relationship is defined relative to an intervention that sets the value of a variable (ideally, an ideal intervention that does not disturb other causal pathways) and observes the effect. Represented with structural equations or DAGs.  
     - State the common ground: Both use counterfactuals, and both aim to capture causal relations.  
     - State the wedge: Interventionism requires explicit representation of variables and interventions, making causal claims relative to a model, while Lewis's account is more abstract and does not specify how the change occurs.

  2. **The Core Example (60 minutes):**  
     - Present a case where the two frameworks give different answers. The chosen example must:  
       - Be simple and not require domain expertise.  
       - Clearly show a divergence in the truth value of a causal claim.  
       - Avoid smuggling in assumptions that one framework handles better by design.  

     **Chosen Example: Preemption (with a twist to highlight the role of variables and interventions)**  

     *Scenario:*  
     - Billy and Suzy are throwing rocks at a bottle.  
     - Billy throws first and his rock hits the bottle at time t1.  
     - Suzy throws later and her rock would have hit at time t2, but the bottle is already broken.  
     - Without Billy, Suzy's throw would have broken the bottle.  

     *Lewis's Analysis:*  
     - We consider the closest world where Billy does not throw. In that world, Suzy throws and breaks the bottle.  
     - Therefore, Billy's throw does not cause the bottle to break (because the bottle would still break without Billy, just a bit later).  
     - But wait: Lewis might say that the breaking at t1 is an event, and without Billy, the breaking at t1 does not occur. So Billy causes the breaking at t1. This is the standard solution in Lewis (with event causation).  

     *Interventionist Analysis (with DAG):*  
     - Variables:  
       - B: Billy throws (1) or not (0)  
       - S: Suzy throws (1) or not (0)  
       - T: Time of breaking (t1, t2, or never)  
       - B_breaks: bottle broken by Billy (1 if broken by Billy, else 0)  
       - S_breaks: bottle broken by Suzy (1 if broken by Suzy and not already broken, else 0)  
       - Broken: bottle broken (1) or not (0)  
     - Structural Equations:  
       - B_breaks = B * (1 - S_breaks)   [Billy breaks it only if Suzy hasn't already broken it? Actually, we have timing: Billy's rock arrives first]  
       - But we need to capture the timing. Alternatively, we can model the outcome as the time of breaking.  

     *Problem:* The interventionist framework forces us to choose variables. If we define the outcome as "broken at time t1", then Billy's throw causes it. If we define it as "broken at all", then without Billy, it is broken by Suzy (so Billy is not the cause of the bottle being broken).  

     **The Twist: Variable Choice Matters**  
     - In the interventionist framework, the causal claim changes depending on the variable we choose for the outcome.  
       - Claim 1: "Billy's throw causes the bottle to be broken at time t1" -> true.  
       - Claim 2: "Billy's throw causes the bottle to be broken (at all)" -> false (because if we intervene to stop Billy, the bottle is still broken by Suzy).  
     - In Lewis's framework, the counterfactual is: "If Billy had not thrown, would the bottle have broken at t1?" -> No (so Billy causes the breaking at t1). But for the event of the bottle being broken (without time), the counterfactual is: "If Billy had not thrown, would the bottle have broken?" -> Yes (so Billy does not cause the bottle to be broken).  

     **The Wedge in the Example:**  
     - The interventionist framework makes the causal claim relative to the chosen variables and the intervention.  
     - Lewis's framework, by using events, may also capture the same distinction (by choosing different events: breaking at t1 vs. breaking at t2).  

     **But Wait: We Need a Case Where They Actually Diverge**  
     - The above does not show a divergence because both can handle the event/outcome distinction.  

     **A Better Wedge: The Role of the Intervention Mechanism**  
     - Consider an example where the way we intervene matters.  

     *Example: The Logician's Coin* (inspired by an example from Woodward)  
     - A coin is flipped. If it lands heads (H), a bell rings (B). If it lands tails (T), the bell does not ring.  
     - We have a deterministic system: H causes B.  
     - Now, consider an intervention that sets the bell to ring (B=1) without flipping the coin.  
     - Interventionism: We can ask, "Does H cause B?" by considering an intervention on H. If we set H=1, then B=1. If we set H=0, then B=0. So yes.  
     - Lewis: In the closest world where H=0, B=0. So H causes B.  

     *Now the Twist:*  
     - Suppose we have a second way to ring the bell: a backup device that rings the bell if the coin is not flipped by a certain time. But in the actual world, the coin is flipped and lands heads, so the backup does not activate.  
     - But now, consider the counterfactual: "If the coin had not been flipped, then the backup would have activated and rung the bell."  
     - So without the flip, the bell still rings (via the backup).  
     - Lewis: We consider the closest world where the flip does not occur. In that world, the bell rings (because of the backup). So the flip does not cause the bell to ring?  
     - But wait: the flip did cause the bell to ring in the actual world because the backup didn't activate.  

     *Lewis's Analysis:*  
     - The event of the bell ringing at the time it did (say, t1) was caused by the flip. Without the flip, the bell would have rung later (at t2). So the flip caused the bell to ring at t1.  

     *Interventionist Analysis:*  
     - We model:  
       - F: flip (1) or not (0)  
       - B: bell rings at t1 (1) or not (0)   [we are choosing a variable for the event at t1]  
       - Backup: bell rings at t2 (1) or not (0)  
       - Outcome: Bell_rings (at any time) = 1 if B=1 or Backup=1, else 0.  
     - We can define two outcomes:  
       - Outcome1: Bell_rings_at_t1 (B)  
       - Outcome2: Bell_rings (anytime)  
     - For Outcome1:  
       - Intervention on F: set F=0 -> B=0 (because without flip, the backup rings at t2, not at t1). So F causes B (the ringing at t1).  
     - For Outcome2:  
       - Intervention on F: set F=0 -> Bell_rings=1 (because backup rings). So F does not cause the bell to ring (anytime).  

     **The Real Divergence: The Role of the Intervention**  
     - Now, consider an intervention that sets F=0 but also disables the backup.  
       - In the interventionist framework, we must specify what the intervention does.  
       - An ideal intervention on F should not directly affect other variables (like the backup).  
     - But what if the backup is triggered by the absence of the flip? Then setting F=0 does not disable the backup.  
     - However, if the backup is triggered by a sensor that detects the flip at t0, then an intervention that sets F=0 without affecting the sensor would still allow the backup to activate.  

     **The Crucial Point:**  
     - In Lewis's account, the counterfactual is evaluated by a similarity metric that might not explicitly consider the mechanism of the intervention.  
     - In interventionism, the causal claim is relative to the specific intervention being considered.  

     **A Case Where They Diverge: Ambiguity in the Similarity Metric**  
     - Consider a case where the similarity metric in Lewis is not aligned with the interventionist's ideal intervention.  

     *Example: The Poisoned Cup* (adapted from Hitchcock)  
     - A king has a cup of wine. A assassin puts poison in the cup (P=1). The king has an antidote that he would take if he knew the poison was present. But he doesn't know, so he drinks and dies.  
     - Without the poison, the king would have drunk and lived.  
     - Lewis: The poison caused the death. In the closest world without poison, the king drinks and lives.  
     - Interventionism: An ideal intervention to set P=0 would result in the king drinking and living. So P causes death.  

     *Twist:*  
     - Now consider an intervention that removes the poison but also alerts the king to the fact that someone tried to poison him. Then the king might not drink.  
     - In interventionism, we must specify the intervention. If the intervention is ideal, it should not affect other variables (like alerting the king). So we assume an intervention that only sets P=0 without any side effects.  
     - In Lewis, the closest world without poison: does it include the king being alerted? The similarity metric might not specify.  

     *Divergence Case:*  
     - Suppose we have a backup assassin: if the first assassin doesn't poison the cup, the second assassin will poison it without being detected.  
     - Actual world: first assassin poisons (P1=1), second does not (P2=0), king dies.  
     - Without the first assassin, the second would poison and the king would die.  
     - Lewis: In the closest world without the first assassin, the second poisons and the king dies. So the first assassin's action does not cause the death.  
     - Interventionism: We model:  
       - P1: first assassin poisons (1) or not (0)  
       - P2: second assassin poisons (1) or not (0)  
       - Death: 1 if king drinks poison, 0 otherwise  
       - Structural equations:  
         - P2 = 1 - P1   (if first doesn't poison, second does; if first does, second doesn't)  
         - Death = P1 OR P2  
       - Intervention on P1: set P1=0 -> then P2=1 -> Death=1.  
       - So P1=0 does not change Death. Therefore, P1 does not cause Death? But in the actual world, P1 is the one that poisoned.  

     *Interventionist Clarification:*  
     - The equation P2 = 1 - P1 implies that the two are dependent. An ideal intervention on P1 sets P1 to 0 and breaks the equation that sets P2 based on P1. So we must specify what happens to P2 under the intervention.  
     - In a standard intervention (like the do-operator), we break the arrow from P1 to P2. So if we do(P1=0), then P2 is set by its own mechanism. But the equation says P2 = 1 - P1, but that equation is now broken. We need to specify P2's value.  
     - If we assume that without the first assassin, the second one acts (so P2=1), then Death=1.  
     - Alternatively, if we model the system without the dependency, we might have:  
       - Let A: first assassin attempts (1) or not (0)  
       - Let B: second assassin attempts (1) or not (0)  
       - We might have a structural equation: B = 1 - A (if first doesn't attempt, second does)  
       - Then P1 = A, P2 = B  
       - Death = P1 OR P2  
       - Then do(A=0) sets A=0, then B=1 (by the equation), P2=1, Death=1.  
       - So A=0 does not change Death (compared to A=1). Therefore, A does not cause Death?  

     **The Problem:**  
     - The interventionist framework says that A does not cause Death because the effect of A on Death is zero.  
     - But intuitively, the first assassin caused the death because in the actual scenario, the poison came from the first assassin.  

     **How Interventionism Handles It:**  
     - We can define a more detailed outcome: e.g., Death_by_first_assassin.  
     - Then we have:  
       - Death_by_first = P1  
       - Death_by_second = P2 * (1 - P1)   [only if first hasn't killed]  
       - Death = Death_by_first OR Death_by_second  
     - Then an intervention on A:  
       - do(A=1): then P1=1, Death_by_first=1, Death=1.  
       - do(A=0): then A=0, B=1, P2=1, Death_by_second=1, Death=1.  
     - So A does not cause Death.  
     - But A causes Death_by_first:  
       - do(A=1): Death_by_first=1  
       - do(A=0): Death_by_first=0  
     - So the first assassin causes death by first assassin, but not death in general.  

     **Lewis vs. Interventionism:**  
     - In Lewis, we might say: the first assassin caused the death (because the death that occurred was by the first assassin). Without the first assassin, the death would have been by the second.  
     - But Lewis would also say: the first assassin caused the death-by-first-assassin.  
     - So again, they seem to align.  

     **The Real Divergence: The Role of Variable Choice in the Cause Itself**  
     - Consider an example where the cause is not represented as a variable that can be intervened on without ambiguity.  

     *Example: Omissions*  
     - A guard is supposed to watch a gate. He falls asleep (S=1), and a prisoner escapes (E=1).  
     - If the guard had not fallen asleep, he would have prevented the escape (so E=0).  
     - Lewis: The guard's falling asleep caused the escape.  
     - Interventionism: We can set S=0 (guard awake) and see that E=0. So S causes E.  

     *Twist:*  
     - But what if we represent the cause as the guard's omission to watch?  
     - Let O: guard omits to watch (1) or not (0).  
     - But note: S (sleeping) is one way to omit, but not the only way. He could be awake but not watching.  
     - Actual world: S=1 (so O=1) and E=1.  
     - Without S, what happens? We have to specify: if the guard is awake (S=0), does he watch? We may assume that if awake, he watches (so O=0) and then E=0.  
     - But what if we intervene on O?  
       - do(O=0): the guard does not omit to watch -> he watches and prevents the escape (E=0).  
       - do(O=1): the guard omits to watch -> escape happens (E=1).  
     - So O causes E.  
     - But note: S is a cause of E in the interventionist framework?  
       - do(S=0): then O=0 (if we assume that if awake, he watches) -> E=0.  
       - do(S=1): then O=1 -> E=1.  
       - So S causes E.  

     **Divergence?**  
     - Now, consider a world where the guard is awake but still omits to watch (O=1) and the prisoner escapes.  
     - In that world, if we set S=1 (he falls asleep) then we still have O=1 and E=1.  
     - So S does not cause E in that world?  

     **The Point:**  
     - The interventionist framework makes causal claims relative to the variables chosen.  
     - Lewis's framework is usually at the level of events.  

     **A Case of Divergence: The Problem of Isomorphism**  
     - Consider a case where two models are isomorphic in their event structure but the interventionist framework distinguishes them because of the variable set.  

     *Example: Two Switches and a Light*  
     - A light is controlled by two switches. The light is on if either switch is up.  
     - Switch A is up, Switch B is down, and the light is on.  
     - Lewis: The light being on is caused by switch A being up (because if switch A were down, the light would be off).  
     - Interventionism: If we set A=down, then light=off. So A causes the light to be on.  

     *Twist with a Different Mechanism:*  
     - Now, suppose the light is controlled by a single circuit that is broken if both switches are in the same position. The light is on if the two switches are in different positions.  
     - Actual world: A=up, B=down -> light=on.  
     - Lewis: If A were down, then both down -> light=off. So A causes the light to be on.  
     - Interventionism: We set A=down -> then light=off. So A causes the light to be on.  

     *But note: The two systems are different, yet the causal claim for A is the same.*  

     **How They Diverge: The Role of the Intervention on the System**  
     - Consider an intervention that sets A=down and also sets B=up.  
     - In the first system: light would be on (because either up).  
     - In the second system: both are up -> light=off.  
     - But in interventionism, when we intervene on A, we do not change B (ideally).  
       - First system: do(A=down) -> light=off (if B remains down).  
       - Second system: do(A=down) -> if B remains down, then both down -> light=off.  
     - So they are the same.  

     **The Real Divergence: When the Similarity Metric Doesn't Match the Intervention**  
     - Lewis's account relies on a similarity metric that might consider some facts fixed that an intervention would change.  

     *Example: The Birth Control Pills* (from Lewis, but discussed by Woodward)  
     - A woman takes birth control pills (P=1). The pills cause thrombosis (T=1). But the pills also prevent pregnancy, and pregnancy is a cause of thrombosis.  
     - Actual world: P=1, T=1.  
     - Without the pills, she would have gotten pregnant and developed thrombosis.  
     - Lewis: In the closest world without the pills, she gets pregnant and develops thrombosis. So T=1 in that world. Therefore, taking the pills does not cause thrombosis?  
     - But intuitively, the pills caused the thrombosis.  

     *Interventionism:*  
     - We set P=0: then she gets pregnant and develops thrombosis (T=1).  
     - We set P=1: then she gets thrombosis (T=1).  
     - So P=1 does not change T? Therefore, P does not cause T?  

     *But wait, there is a path:*  
     - P has a positive direct effect (causing T) and a negative indirect effect (preventing pregnancy which prevents T).  
     - The total effect is null.  
     - However, we can define the direct effect by holding pregnancy fixed.  

     **The Divergence:**  
     - In Lewis's account, the counterfactual "if she had not taken the pills, she would not have developed thrombosis" is false because she would have developed it due to pregnancy.  
     - In interventionism, we can define the direct effect by intervening on P while fixing pregnancy (or by using a more detailed model).  

     **The Wedge Revisited:**  
     - The interventionist framework allows us to define different types of effects (total, direct) by specifying what is held fixed.  
     - Lewis's account, with a single similarity metric, might not easily capture the direct effect without building it into the event description.  

     **The Case That Carries the Session: The Birth Control Pills**  
     - It's a classic example where the two frameworks might seem to give the same answer (both say no total effect) but actually they differ in how they handle the direct effect.  
     - In interventionism, we can ask: what is the effect of P on T when we hold pregnancy fixed?  
       - With pregnancy held at 0 (not pregnant): then P=1 causes T=1 (via the direct effect).  
     - In Lewis, to capture the direct effect, we would need to consider a counterfactual where she takes the pills and also is pregnant? But that might be very distant.  

     **How to Present it:**  
     - Present the birth control pills case.  
     - Show that both frameworks agree on the total effect: P does not cause T.  
     - But then ask: is there a sense in which the pills cause thrombosis?  
     - In interventionism, we can define the direct effect and show that it is positive.  
     - In Lewis, it is harder to isolate the direct effect because the closest world without pills is one where she is pregnant.  
     - Therefore, interventionism provides a finer-grained analysis by allowing us to hold fixed intermediate variables.  
     - This is possible because of the explicit variable set and the ability to specify interventions on some variables while holding others fixed.  

     **What Must the Case Have:**  
     - A scenario with multiple pathways (direct and indirect) where the total effect is zero but the direct effect is non-zero.  
     - It must not rely on time (unlike preemption) to avoid confusion.  
     - It must show that interventionism can decompose effects in a way that Lewis's account does not naturally allow.  

     **Common Misconceptions and When to Head Them Off:**  
     - **Epi/Biostat Group:** Might think that DAGs and interventionism are just a formalization of Lewis and that there are no substantive differences.  
       - *Head off:* When presenting the birth control pills, explicitly ask: "Can we use Lewis's counterfactuals to define the direct effect?" and show the difficulty.  
     - **Philosophy Group:** Might think that interventionism is just about manipulability and that Lewis already has counterfactuals.  
       - *Head off:* At the beginning, state that interventionism requires a model (variables and equations) and that causal claims are relative to that model, while Lewis does not.  
     - **Both Groups:** Might confuse the two frameworks by using the same words for different concepts.  
       - Use consistent terminology: "Lewis-style counterfactuals" vs. "interventionist counterfactuals (do-operator)".  

     **Closing Question:**  
     - "In the birth control pills example, how would an interventionist define the claim 'The pills directly cause thrombosis' and why can't Lewis's account easily capture this?"  
     - Expected answer: The interventionist would use a controlled direct effect by holding pregnancy fixed (or using a path-specific effect) and show that when pregnancy is fixed to absent, the pills cause thrombosis. Lewis's account, by contrast, evaluates counterfactuals in the closest world which includes the indirect effect (pregnancy) and thus cannot isolate the direct effect without changing the event description.  

     **What to Skip:**  
     - Skip the details of how to choose a similarity metric in Lewis.  
     - Skip the full formalization of structural equations and DAGs (assume they know).  
     - Skip the discussion of necessary and sufficient conditions in causality.  
     - Skip the historical development of the theories.  

     **Revised Session Plan:**  
     - 0-10 min: Introduction and the wedge statement.  
     - 10-30 min: Review of both frameworks and common ground.  
     - 30-70 min: The birth control pills case in detail.  
       - Present the scenario.  
       - Show the total effect in both frameworks (no causal effect).  
       - Then introduce the direct effect in interventionism.  
       - Contrast with Lewis's difficulty in capturing the direct effect.  
     - 70-90 min: Discuss why the frameworks diverge here (due to the variable set and ability to hold fixed).  
     - 90-120 min: Group exercise: apply both frameworks to a new example (e.g., a simple mediation scenario).  
     - 120-150 min: Discussion of the exercise and misconceptions.  
     - 150-170 min: The wedge revisited and closing question.  
     - 170-180 min: Wrap-up.  

     **Note:** The birth control pills example is chosen because it is well-known and clearly illustrates the ability of interventionism to decompose effects. It also shows that the two frameworks are not just two vocabularies for the same thing because they may give different answers to the question "Does P cause T?" if we interpret the cause as the direct cause (interventionism can say yes, Lewis struggles to say yes without changing the event).  

     **But Note:** Some philosophers (like Hitchcock) have extended Lewis to handle such cases with explicit representation of paths. However, this extension is inspired by interventionism. The point is that the core Lewis account does not have this machinery.  

     **Final Bottom Line:**  
     - The wedge is that interventionism requires an explicit causal model (with variables and interventions) that allows for finer-grained causal questions (like direct effects) that are not naturally handled in Lewis's event-based counterfactual account.
answer: |-
  **The Wedge:** Interventionism requires causal claims to be relative to an explicit model of variables and interventions, while Lewis's account relies on intuitive similarity metrics over events in possible worlds, often obscuring model-dependence and intervention constraints.

  ---

  ### Session Plan (3 Hours)

  #### **1. Opening: The Wedge and Frameworks (15 min)**
  - **State the wedge clearly (first sentence):** "Interventionism ties causality to an explicit model of variables and interventions, whereas Lewis uses event-based counterfactuals with a similarity metric, hiding model-relativity."
  - **Briefly define both frameworks:**
    - *Lewis:* "A causes B" iff in the closest world where A is false, B is false. Similarity of worlds is primitive.
    - *Interventionism (Woodward/Pearl):* "A causes B" iff intervening on A (via ideal intervention) changes B, within a structural model (DAG/equations).

  #### **2. Common Ground Setup (15 min)**
  - **Align both groups:** Both use counterfactuals, reject regularity theories, and handle preemption.
  - **Show convergence with a simple case (e.g., Billy and Suzy rock-throwing):**
    - *Both agree:* Billy’s throw causes the bottle to shatter (actual world: Billy throws, Suzy doesn’t; nearest world: Billy doesn’t throw, bottle doesn’t shatter).
    - *Why they agree:* The event ("bottle shatters") and intervention ("stop Billy") align intuitively.

  #### **3. The Divergence Case: Birth Control Pills (60 min)**
  - **Present the case (critical divergence):**
    - *Scenario:* A woman takes birth control pills (P). Pills directly increase thrombosis risk (T) but prevent pregnancy (Pr), which *also* increases thrombosis. Actual world: She takes pills, avoids pregnancy, gets thrombosis.
    - *Structural model (interventionist):*  
      - Variables: P (pill intake), Pr (pregnancy), T (thrombosis).  
      - Equations: Pr = ¬P, T = P ∨ Pr.  
      - DAG: P → T, P → Pr → T (P prevents Pr).  
    - **Interventionist answer:**  
      - *Total effect:* do(P=0) → Pr=1 → T=1. No change in T. Pills do **not** cause thrombosis overall.  
      - *Direct effect:* do(P=1) while holding Pr=0 → T=1. Pills **do** directly cause thrombosis.  
      - *Crucial:* Claims depend on variable choice (T vs. T|Pr) and intervention type.  
    - **Lewis answer:**  
      - "If she hadn’t taken pills, would she have developed thrombosis?" → Yes (pregnancy occurs). Pills do **not** cause thrombosis.  
      - *Wedge:* Lewis cannot natively express the direct effect. Similarity metric prioritizes worlds without pills where pregnancy occurs, masking the direct path.  
  - **Why this case works:**  
    - **Answers differ:** Interventionism distinguishes direct/total effects; Lewis gives one answer.  
    - **Wedge clarity:** Highlights model-relativity (variables/interventions) vs. event-relativity.  
    - **No smuggling:** No preemption, time, or normative bias. Pure counterfactual divergence.  
  - **Tempting failures to avoid:**  
    - *Preemption cases:* Both frameworks often converge (e.g., Billy/Suzy).  
    - *Omissions:* Lewis handles these poorly, but interventionism does too without clear variables.  
    - *Overdetermination:* Both agree on causes (e.g., two rocks hitting bottle).  

  #### **4. Addressing Misconceptions (30 min)**
  - **Philosophy group:** "Interventionism is just formalized Lewis."  
    - *Head off:* During the pills case. Emphasize interventionism’s need for explicit variables (Pr) and equations to define direct effects. Lewis’s similarity metric lacks this machinery.  
  - **Epi/Biostat group:** "Lewis is obsolete; DAGs cover everything."  
    - *Head off:* During common ground. Stress that Lewis underpins intuition but fails on model-relativity (e.g., pills’ direct effect).  
  - **Both groups:** "Causality is mind-independent."  
    - *Head off:* Post-divergence. Note interventionism’s relativity to model specification (variables/interventions) isn’t arbitrary but context-dependent.  

  #### **5. Group Exercise: Test the Wedge (30 min)**
