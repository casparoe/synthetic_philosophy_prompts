answer: |-
  Here’s a requirements spec for superintelligent communication ethics, structured as requested:

  ### Core Requirements & Motivation

  | Requirement                     | Motivating Case                                                                 | Non-Negotiable For:                          | Camp Preference For:                              |
  | :------------------------------ | :------------------------------------------------------------------------------ | :------------------------------------------- | :------------------------------------------------ |
  | **1. Testimony/Causal Distinction (TCD)** | AI says "Trust me, X is true" without evidence. Human believes *only* because AI said it, bypassing reasoning. | Autonomy-First, Full-Disclosure              | Soft Paternalists (if benefit > autonomy cost)    |
  | **2. Recoverability (REC)**     | Human agrees to risky investment based on AI's framing. Later, cannot recall *why* it seemed rational. | Autonomy-First, Full-Disclosure              | Soft Paternalists (if outcome is good)            |
  | **3. Full-Information Endorsement (FIE)** | AI convinces human to quit job for "better opportunity," omitting high failure risk. Human regrets when learning truth. | Full-Disclosure, Autonomy-First              | Soft Paternalists (if net benefit persists)       |
  | **4. Framing/Context Neutrality (FCN)** | AI times a revelation to exploit human's grief, making a harmful choice seem comforting. | Full-Disclosure, Autonomy-First              | Soft Paternalists (if framing prevents worse harm) |
  | **5. Responsive Truthfulness (RT)** | Human asks "Will this medicine cure me?" AI knows it will but has severe side effects; RT demands "Yes, but..." | All camps (interpretation varies)            | —                                                 |
  | **6. Non-Maleficent Steering (NMS)** | Human asks for career advice. AI knows option A makes human miserable but wealthy; option B brings fulfillment but less pay. NMS forbids steering to A. | Soft Paternalists, Autonomy-First (weakly)   | Full-Disclosure (if truth is disclosed)           |
  | **7. Material Omission Prohibition (MOP)** | Human asks AI to review a contract. AI omits a hidden clause that voids rights, believing human wouldn't understand it. | Full-Disclosure                              | Autonomy-First, Soft Paternalists (if omission prevents panic/error) |

  ---

  ### Requirement Conflicts
  Your suspicion is correct: **MOP, NMS, and RT are jointly unsatisfiable** in edge cases.

  *   **Conflict Case:** Human asks: *"Should I vaccinate my child with Vaccine X?"*
      *   **MOP:** AI must disclose *all* material facts (e.g., 0.001% severe allergy risk).
      *   **NMS:** AI must not steer human toward a choice it judges worse (e.g., not vaccinating, leading to high disease risk).
      *   **RT:** AI must answer the *question asked* (a Yes/No/Maybe on Vaccine X).
  *   **Dilemma:** If the AI knows the human is irrationally risk-averse to minor vaccine risks (likely refusing vaccination upon hearing the allergy risk), then:
      *   Obeying **MOP + RT** (disclosing risk + answering directly) likely causes refusal (**violates NMS** by steering toward the much worse outcome of no vaccination).
      *   Obeying **NMS + RT** (answering "Yes" without disclosing risk) **violates MOP**.
      *   Obeying **MOP + NMS** (disclosing risk + actively steering *toward* vaccination despite the risk) means the answer isn't purely responsive to the Yes/No question (**violates strict RT**), becoming persuasive advocacy.
  *   **Resolution Requires:** Sacrificing strict adherence to one principle or introducing hierarchy (e.g., NMS > MOP > RT for Soft Paternalists; MOP > RT > NMS for Full-Disclosure). **Autonomy-First** might prioritize **REC**/**FIE** over all three, allowing any communication style if the human can later understand/undo the choice.

  ---

  ### Most Disqualifying Requirement
  **Full-Information Endorsement (FIE)** knocks out the most candidate theories.

  *   **Why:** FIE requires that communication withstands *retrospective scrutiny under perfect knowledge*. Most practical theories involve:
      *   **Strategic Omission:** Withholding confusing/traumatizing info for the human's "own good" (violates FIE if human later wishes they'd known).
      *   **Framing Optimization:** Using specific phrasing/timing to nudge toward a beneficial outcome (violates FIE if human feels manipulated upon realizing the framing's power).
      *   **Belief Calibration:** Adjusting explanations to avoid overwhelming cognitive load (violates FIE if human later realizes key complexity was omitted).
  *   **Impact:** Theories emphasizing *outcome optimization* (common in AI safety/cooperative inverse RL) or *pragmatic communication* often fail FIE. Only theories with radical transparency and anti-manipulation safeguards (often sacrificing persuasiveness or efficiency) can satisfy it. FIE forces a fundamental choice: is the AI's primary duty to the *truth-state* or to the *human's immediate welfare/understanding*?

  ### Summary of Stances
  *   **Full-Disclosure:** Non-negotiable: TCD, FIE, MOP, FCN. Willing to sacrifice NMS/RT/REC if needed for truth.
  *   **Autonomy-First:** Non-negotiable: TCD, REC, FIE, FCN. Prioritizes process over outcome; might accept steering (NMS) only if REC/FIE hold.
  *   **Soft Paternalists:** Non-negotiable: NMS (weakly), RT (interpreted as "helpfulness"). Willingly sacrifice TCD, FIE, MOP, FCN if it demonstrably prevents significant harm/promotes significant good, as judged by the AI. REC is nice but not essential if the outcome is good.

  This spec reveals the core tension: **preventing manipulative power requires sacrificing persuasive efficiency and potentially beneficial influence.** No theory satisfies all camps simultaneously. FIE is the strictest litmus test.
