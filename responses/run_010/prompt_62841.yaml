  The biggest issues are: 1) Irrelevant classical preamble (though not penalized since points aren't deducted for extra content) 2) Overclaiming about grain list reliability 3) Underdeveloped coinage analysis 4) Misclassification of annals' silence. Strengths include recognizing narrative limitations and slow consolidation from coinage.

