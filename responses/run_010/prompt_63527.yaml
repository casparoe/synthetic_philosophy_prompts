prompt: |-
  so im in a philosophy-of-data-science course this term and our department lets a few undergrads run an optional Friday "lab" section for anyone who wants to show up — usually 12 to 16 people, roughly half CS majors half humanities, and almost none of them have touched a proof all year. I've got 75 minutes next Friday and I want to build a game where they run into the calibration vs. equal-false-positive/false-negative-rate incompatibility themselves, instead of me writing three definitions on a board and then announcing that you can't have all of them when base rates differ.

  Here's the shape I'm imagining, tell me straight if some part of it is a bad idea: they get handed a little population on paper slips I print beforehand — two groups with a real gap in the base rate, and the counts have to be engineered so the gap survives the noise of ~14 people eyeballing things rather than washing out. They act as loan officers over three rounds. Round 1 they pick a cutoff and earn tokens from good approvals and lose them on defaults, no real money. Round 2 a separate "oversight panel" of the same people has to audit round 1 against a different criterion, and they discover the two audits contradict each other. Round 3 is the bit I actually care about: the decisions from rounds 1 and 2 should have *changed the population*. If one group kept getting turned down, their real default rate is now worse, because they lost the thing the loan would have bought. So the impossibility isn't a one-shot observation, it compounds, and by the end they're fighting about whether they should be scored on the base rates they inherited or the ones they helped make.

  What I need from you: the exact slip counts and base rates, with the arithmetic for why those numbers produce the conflict reliably at this group size; the token scheme with actual numbers; a minute-by-minute timeline for 75 min; the rules I read aloud at the start of each round, short and in plain words, that don't leak the theorem; a debrief that points at specific moments from the game ("remember when the panel voted X") and ties each one to a specific criterion breaking; and a list of what will predictably go wrong the first time i run it. My own guesses are that small-sample noise will sometimes hand them equal rates and kill the effect, that someone will refuse to approve anything at all to dodge penalties, and that the drift rule in round 3 will feel like a punishment I invented to make a point.

  And be honest about the limits. I know the game can't reproduce the fact that the static version is a *theorem*, not just an empirical regularity that happened to hold in my card deck — and the drift is something I'm just stipulating rather than deriving. Tell me what I have to supply by hand to cover that gap, and where running this activity risks teaching them something actively false about the result, like that the tradeoff is really about bad data or about a threshold someone chose badly.
