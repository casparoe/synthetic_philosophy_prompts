         The class will be split into two teams. 
         Team 1 is auditing for 'calibration': they must check that the default rate among approved loans is about the same for both groups (Group A and Group B). 
         Team 2 is auditing for 'equalized odds': they must check that the false positive rate (the proportion of bad applicants who were approved) and the false negative rate ( the proportion of good applicants who were rejected) are about the same for both groups.
         Use the data from Round 1 to compute these rates for your assigned criterion and report whether the Round 1 decisions pass the audit."

      Round 3:
        "It's one year later. 
         In Group A, the situation is unchanged. 
         In Group B, however, the two good applicants who were rejected in Round 1 could not invest in their businesses. One of them became a bad applicant because of this. 
