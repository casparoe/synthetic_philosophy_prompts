      - "In Round 3, we then saw that the base rate for Group B became worse (47% good down from 50%). 
         Even though we used the same rule, the default rate for Group B became higher. 
         This is because the feedback loop: rejections in the first round led to a deterioration in the quality of Group B's applicants."

      - "The impossibility theorem says that when the base rates are different, you cannot have both calibration and equalized odds at the same time. 
