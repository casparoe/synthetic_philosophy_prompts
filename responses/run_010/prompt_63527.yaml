  ### Comprehensive Game Design: Calibration vs. Equal Error Rates in Loan Approval  
  **Goal:** Students discover the incompatibility between calibration and equal error rates when base rates differ, and experience feedback loops that exacerbate disparities.  

  ---

  ### **Population Design (Paper Slips)**  
  - **Group A (Privileged):** 16 applicants  
    - **Good (will repay):** 14 slips  
    - **Bad (will default):** 2 slips  
    - **Base rate:** 87.5% good (14/16)  
  - **Group B (Marginalized):** 16 applicants  
    - **Good:** 8 slips  
    - **Bad:** 8 slips  
    - **Base rate:** 50% good (8/16)  
  - **Score distributions (0-100 scale):**  
    - **Group A Good:** Scores clustered high (e.g., 78, 85, 72, 90, 80, 82, 75, 88, 77, 83, 70, 84, 79, 86).  
    - **Group A Bad:** Scores clustered low (e.g., 35, 42).  
    - **Group B Good:** Scores mid-high (e.g., 65, 68, 72, 60, 75, 62, 70, 78).  
    - **Group B Bad:** Scores mid-low (e.g., 40, 38, 45, 52, 48, 55, 42, 57).  

  #### **Why These Numbers?**  
  - **Base rate gap survives noise (14 players):**  
    - Group A’s high base rate (87.5%) is robust even with approval variances.  
    - Group B’s 50% base rate ensures high sensitivity to rejections.  
  - **Conflict arithmetic:**  
    - At threshold = 70:  
      - **Group A:** FPR = 0% (0/2 bad approved), FNR = 0% (0/14 good rejected).  
      - **Group B:** FPR = 12.5% (1/8 bad approved), FNR = 37.5% (3/8 good rejected).  
      - **Calibration:** Group A default rate = 0% (0/14 approved), Group B = 11.1% (1/9 approved).  
    - **Conflict:** Calibration holds (default rates similar), but FPR/FNR are unequal.  

  ---

  ### **Token Economy**  
  - **Rules:**  
    - Approve a good applicant: **+1 token**  
    - Approve a bad applicant: **-2 tokens**  
    - Reject (good or bad): **0 tokens**  
  - **Rationale:** Incentivizes conservative approvals (avoiding bad loans) but not total risk aversion.  

  ---

  ### **Timeline (75 Minutes)**  
  1. **Intro (5 min):**  
     - *Script:* "You’re loan officers. Approve/reject applicants based on a score (higher = more likely to repay). Goal: Maximize tokens. Good approvals earn +1, bad approvals lose -2."  

  2. **Round 1: Loan Decisions (20 min)**  
     - Hand out slips (hide group labels initially; reveal scores only).  
     - Officers set **one shared threshold** (0–100) via quick vote.  
     - Record decisions (approve if score ≥ threshold).  
     - **Reveal true status and group labels.** Calculate tokens and default rates per group.  

  3. **Round 2: Audit (25 min)**  
     - Split into two "audit teams":  
       - **Team 1 (Calibration):** "Check if default rates in approved loans are equal for Groups A and B."  
       - **Team 2 (Error Rates):** "Check if false positive (FPR) and false negative (FNR) rates are equal for both groups."  
     - Teams report findings.  
     - **Conflict emerges:** Calibration may hold, but FPR/FNR won’t match (e.g., at threshold=70, Group B has higher FNR).  

  4. **Round 3: Feedback Loop (15 min)**  
     - *Script:* "Rejected good applicants in Group B couldn’t invest; 50% of them became riskier. Update Group B:"  
       - Convert 50% of **rejected good** to **bad** (e.g., if 4 were rejected, 2 turn bad).  
       - New Group B base rate drops (e.g., 8 good, 10 bad → 37.5% good).  
     - Re-run Round 1 with **original threshold**. Observe worse default rate for Group B.  

  5. **Debrief (10 min):**  
     - Link game moments to theory:  
       - *"When Team 1 saw equal default rates, Team 2 found unequal errors. That’s the calibration vs. error-rate tradeoff—it’s mathematically inevitable when base rates differ."*  
       - *"Round 3’s drift wasn’t punishment—it’s how real-world exclusion worsens disparities. We inherited unequal base rates, then amplified them."*  
     - Clarify limits:  
       - *"This game can’t prove the theorem, but it shows why the tradeoff arises. The drift is a plausible mechanism, but real-world dynamics are complex."*  

  ---

  ### **Rules Scripts (Plain Language)**  
  - **Round 1:**  
    > "Each slip shows a loan applicant’s score. As a group, pick a threshold (0–100). Approve if score ≥ threshold. After decisions, we’ll reveal who repaid (good) or defaulted (bad). +1 token for good approvals, -2 for bad approvals."  

  - **Round 2:**  
    > "Split into audit teams. Team 1: Are default rates equal for Groups A and B? Team 2: Are false positive (bad approvals) and false negative (good rejections) rates equal? Report if the Round 1 decisions pass your audit."  

  - **Round 3:**  
    > "Rejected good applicants in Group B lost opportunities—half became riskier. We’ve updated Group B’s slips. Apply the **same threshold** from Round 1. Let’s see what happens."  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Small-sample noise kills the effect:**  
     - **Fix:** Use **asymmetric distributions** (Group A scores tightly clustered high; Group B spread out). Test thresholds (e.g., 70) in advance to ensure conflict.  

  2. **Risk aversion (reject everything):**  
     - **Fix:** Penalize rejections in **Round 3** (e.g., "-1 token for rejected good applicants" if needed). Emphasize tokens as "profit," making rejections unsustainable.  

  3. **Drift feels artificial/punitive:**  
     - **Fix:** Pre-empt in intro: *"Your decisions affect future applicants. We’ll simulate how rejected good applicants lose opportunities."* Use real-world examples (e.g., denied loans → no capital → credit score drops).  

  ---

  ### **Limits & Mitigations**  
  - **Static theorem vs. game:** Students won’t see the *proof* of incompatibility.  
    - **Mitigation:** Post-game, share a **simple 2x2 example** (e.g., 80% vs. 50% base rates) showing algebraically why calibration + equal error rates require equal base rates.  
  - **Drift is stipulated, not derived:**  
    - **Mitigation:** Acknowledge: *"We simplified feedback—in reality, many factors drive drift. But data shows rejected groups develop higher default rates (e.g., credit deserts)."*  
  - **Misattribution risk (blaming thresholds/data):**  
    - **Mitigation:** Stress in debrief: *"This isn’t about bad thresholds. Even optimal choices cause tradeoffs when base rates differ."*  

  ### **Output Materials**  
  - **Slip counts:** Print 32 slips (16 Group A, 16 Group B) with scores and hidden status.  
  - **Token tracker:** Shared whiteboard for tokens/default rates.  
  - **Cheat sheet:** For you (not students) with arithmetic for thresholds 60/70/80 to force conflict.  

  This design ensures students *experience* the tradeoff and feedback loop, while you control for noise and misdirection. Run it, then hit the theory!
