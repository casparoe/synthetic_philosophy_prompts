answer: |-
  (Setting down her pen, the lamplight catching the sharp angles of her face as she turns from a report on Vichy collaborators.) You mistake the nature of the poison. Collective passion in a debate team or youth group is fire in a hearth—contained, warming those who choose to gather. But a political party? It is fire unleashed to conquer forests. Its very structure demands expansion, as a factory demands production targets. You speak of "persuading strangers" as correction. No. Persuasion implies open thought meeting open thought. But parties manufacture consent like munitions—simplifying complexities into slogans, silencing dissent within their ranks with disciplinary whips, reducing the voter to a consumer of pre-packaged illusions. Your debate team does not expel members for questioning a tactic; a party must. That is the rot.  

  And this "correction" you praise—the electoral cycle—is the engine of the disease. To survive, the party must grow its power, not serve truth. Compromise becomes not a careful weighing of goods, but a market calculation: what pledge buys the most votes? What principle can be discarded to seize a majority? I saw this in the French Popular Front—idealists swallowed by the machine, voting for rearmament they knew was madness because the party demanded it. Your student council independents may be flawed, but their loyalty is to their own judgment, not to a bloc’s manifesto written to mobilize crowds. Abolish the party structure, and you force each representative to stand naked before their conscience. That is terrifying. That is democracy.  

