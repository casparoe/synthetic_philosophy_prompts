answer: |-
  ### Translation of Legal Interpretation Concepts into Programming Language Standards Vocabulary

  #### 1. **Ordinary Meaning Fixed at Enactment & Technical Drift**
     - **Legal Concept**: Words carry the meaning a competent reader would assign at enactment; technical terms may drift post-enactment.  
     - **PL Counterpart**: Normative text interpreted as a "reasonable programmer" (implicit audience) would understand it at standardization. Technical drift (e.g., "undefined behavior" evolving in practice) is analogous to terms shifting in industry usage.  
     - **Fidelity Judgment**: **Maps cleanly**. The "reasonable programmer" mirrors the "competent reader," and versioned standards fix meaning at publication.  
     - **Import**: PL relies on *ex ante* agreement and lacks legislative inertia; legal drift involves societal change, while PL drift is addressed via revisions.

  #### 2. **Semantic Canons (*Ejusdem Generis*, *Noscitur a Sociis*, *Expressio Unius*)**
     - **Legal Concept**: Contextual narrowing of general terms via surrounding specifics or omissions.  
     - **PL Counterpart**: Normative text uses surrounding clauses to resolve ambiguity (e.g., a list of specific integer types implying exclusion of non-integer types). Omitted behaviors default to "unspecified" or "undefined" categories.  
     - **Fidelity Judgment**: **Maps only after bending the PL side**. PL standards lack formal canons but achieve similar ends via structured definitions. The mapping requires bending PL to accept informal contextual inference as inherent.  
     - **Import**: Legal canons are explicit judicial tools; PL relies on implicit logical deduction by implementers.

  #### 3. **Text Construed as a Whole**
     - **Legal Concept**: Statutes must be read holistically, not clause-by-clause.  
     - **PL Counterpart**: Normative text is interdependent (e.g., type system rules affecting memory model semantics). Cross-references and global consistency are mandatory.  
     - **Fidelity Judgment**: **Maps cleanly**. PL standards demand holistic reading to avoid contradictions.  

  #### 4. **Drafting History (Committee Reports, Rejected Proposals)**
     - **Legal Concept**: Purposivists use history to discern intent; textualists reject it.  
     - **PL Counterpart**: Non-normative rationale documents (e.g., ISO C++ committee notes) clarify intent but lack binding force. Issue trackers and rejected proposals are informative but excluded from conformance.  
     - **Fidelity Judgment**: **Maps cleanly**. Normative vs. informative distinction directly mirrors textualism vs. purposivism’s treatment of history.  

  #### 5. **Absurdity Doctrine & Textualist Objection**
     - **Legal Concept**: Avoid readings leading to absurd outcomes; textualists reject this as judicial overreach.  
     - **PL Counterpart**: Conformance test suites operationalize the text to exclude absurd implementations (e.g., treating obvious programmer intent). Textualist objection maps to rejecting rationale documents when normative text is clear.  
     - **Fidelity Judgment**: **Maps only after bending the legal side**. PL "absurdity avoidance" is embedded in test suites (ex ante), while legal doctrine permits ex post judicial correction. Bending required: legal absurdity doctrine assumes adjudicatory authority absent in PL.  
     - **Import**: PL lacks courts; test suites are preemptive, not corrective.  

  #### 6. **Open Texture & Penumbra (Hart's Vehicle Problem)**
     - **Legal Concept**: Core meanings are clear, but borderline cases (e.g., "is a bicycle a vehicle?") require adjudication.  
     - **PL Counterpart**: Underdetermined categories ("implementation-defined," "unspecified") handle penumbral cases (e.g., "does `volatile` apply to GPU memory?"). The "reasonable programmer" decides edge cases.  
     - **Fidelity Judgment**: **Maps cleanly**. PL’s underdetermination directly models open texture.  

  #### 7. **Textualist Rejection of Collective Intention**
     - **Legal Concept**: Legislatures lack unified intent; only enacted text matters.  
     - **PL Counterpart**: Standardization committees produce normative text; individual motivations (e.g., rationale documents) are irrelevant to conformance.  
     - **Fidelity Judgment**: **Maps cleanly**. PL’s normative/informative split rejects committee intent beyond the text.  

  ---

  ### Residue Report
  **Distorted Items**:  
  - **Semantic Canons (Item 2)**: PL lacks formal canons, requiring informal contextual inference.  
  - **Absurdity Doctrine (Item 5)**: Legal doctrine’s ex post adjudication has no PL counterpart; test suites operationalize ex ante.  

  **Items with No Counterpart**: None. All concepts map, but two require conceptual bending.  

  **Conclusion**:  
  The residue—particularly the ex post nature of absurdity doctrine and the formalism of semantic canons—exposes a **TARGET-DEFECT** in the PL framework. The legal debate relies on institutional structures (courts, adversarial proceedings) and explicit interpretive rules that PL lacks. PL standards assume a closed system with predefined categories for ambiguity, while law navigates open-textured concepts through dynamic institutions. The core dispute (text vs. non-text) aligns, but law’s need for adjudicatory authority and formal canons reveals gaps in the PL vocabulary. The seminar’s debate genuinely engages with *who decides* and *how*, which PL’s abstract, ex ante model cannot fully capture.  

  **Least Confident Steps**:  
  - **Item 5 (Absurdity Doctrine)**: Legal "absurdity" involves real-world consequences in adversarial cases; PL test suites avoid absurdity preemptively. This step imports PL’s lack of adjudication.  
  - **Item 2 (Semantic Canons)**: Canons are codified legal heuristics; PL relies on implementer intuition. Bending PL to "formalize" context risks misrepresenting its informality.  

  **Verdict**: TARGET-DEFECT
