  ### Activity Design: "The Biographer's Challenge"

  #### **Core Objective**
  Students experience constructing a character abstraction to explain/predict behavior, then discover that its predictive power depends on underlying regularity—illustrating Dennett's view that a self is a *useful* narrative abstraction (not a "further fact" or a fraud). Avoids Dennett's name/phrase until debrief.

  ---

  ### **Materials & Setup**
  - **Subjects**: 7 pairs (4 pairs track a "regular" subject; 3 track a "random" subject).  
  - **Handouts**:  
    - Each pair receives:  
      - **Sheet 1**: 12 past situations + subject's choices (pre-generated).  
      - **Sheet 2**: 6 new situations (no choices; for prediction).  
    - **Index cards** for character sketches.  
  - **Subject Generation**:  
    - **Regular subject**: Choices generated from 3 fixed dispositions + 1/6 noise (see procedure below).  
    - **Random subject**: Choices generated by die rolls (pure randomness).  
  - **Whiteboard**: Tracks prediction scores and sketches during debrief.

  ---

  ### **Subject Generation Procedure**
  **Regular Subject Setup** (for instructor’s classmate to execute):  
  1. **Dispositions**: Define 3 fixed traits (e.g., *Honest, Frugal, Conflict-Averse*).  
  2. **Mapping**: Assign each situation to one disposition (see situation list below).  
  3. **Consistent Choice**: For each situation, determine the "disposition-consistent" choice (e.g., *Honest* → Return lost wallet).  
  4. **Add Noise**: Roll a die before recording each choice:  
     - **If die = 1**: Flip the consistent choice (noise).  
     - **If die = 2–6**: Keep consistent choice.  
     - *Why 1/6 noise?* Mimics real-world inconsistency (e.g., stress, context) without overwhelming the pattern. High enough to challenge students, low enough that predictions beat chance.  

  **Random Subject Setup**:  
  - For each situation, roll a die:  
    - **1–3**: Choice A  
    - **4–6**: Choice B  

  **Pre-Generation Tips**:  
  - Generate choices *in advance* (not during class).  
  - Use the same 18 situations for both subjects (only choice sequences differ).  

  ---

  ### **18 Situations**  
  Mundane, morally mixed choices (no sci-fi). Designed to test dispositions without overlap.  

  | # | Situation | Options | Primary Disposition | Consistent Choice (Regular Subject) |
  |--:|-----------|---------|---------------------|-------------------------------------|
  | **Past Situations (Sheet 1)** | | | | |
  | 1 | Found a wallet on the street. | A: Turn it in<br>B: Keep the cash | Honest | A |
  | 2 | Running late for work. | A: Drive 10mph over speed limit<br>B: Drive exactly at limit | Risk-Averse | B |
  | 3 | Barista gives extra $5 change. | A: Return it<br>B: Keep it | Honest | A |
  | 4 | Friend asks for a $20 loan. | A: Lend it<br>B: Say you’re short | Frugal | B |
  | 5 | Group member slacks off. | A: Do their work to avoid conflict<br>B: Confront them | Conflict-Averse | A |
  | 6 | Buffet with unlimited food. | A: Take only what you’ll eat<br>B: Pile extra for later | Frugal | A |
  | 7 | See a lost dog with tags. | A: Try to contact owner<br>B: Ignore it | Honest | A |
  | 8 | Cashier undercharges you. | A: Point it out<br>B: Stay quiet | Honest | A |
  | 9 | Friend vents about partner. | A: Listen sympathetically<br>B: Change the subject | Conflict-Averse | A |
  | 10 | Extra credit opportunity. | A: Share with class<br>B: Keep it secret | Frugal | B |
  | 11 | Colleague takes credit for your idea. | A: Let it go<br>B: Call them out | Conflict-Averse | A |
  | 12 | Tempted to pirate a movie. | A: Pay for it<br>B: Stream it free | Honest | A |
  | **Prediction Situations (Sheet 2)** | | | | |
  | 13 | Found a phone on a bus. | A: Contact owner<br>B: Keep it | Honest | A |
  | 14 | Late for a doctor’s appointment. | A: Rush and risk a ticket<br>B: Arrive late | Risk-Averse | B |
  | 15 | Friend forgets your birthday. | A: Say nothing<br>B: Mention it | Conflict-Averse | A |
  | 16 | Splitting a dinner bill evenly. | A: Agree (you ate less)<br>B: Request separate checks | Frugal | B |
  | 17 | Coworker offers a cheat sheet. | A: Decline<br>B: Use it | Honest | A |
  | 18 | Free trial expiring. | A: Cancel before charge<br>B: Forget and pay | Frugal | A |

  ---

  ### **Activity Flow (75-Minute Timeline)**  
  **0–5 min: Intro**  
  - “You’re biographers studying an unseen person’s past choices. Write a compact character sketch (3–4 traits) explaining their behavior. Then predict their future choices.”  
  - Assign pairs randomly (pre-determined: 4 regular, 3 random). Distribute Sheet 1.  

  **5–25 min: Character Sketch**  
  - Pairs review 12 past choices and write on index card:  
    - **Prompt**: “Describe this person in 3–4 dispositional traits (e.g., ‘honest but selfish’).”  
    - *Why index cards?* Forces brevity; easy to display later.  

  **25–35 min: Prediction**  
  - Distribute Sheet 2 (6 new situations).  
  - Pairs predict choices (A/B) for each situation.  
  - **Scoring**: Collect predictions; score later (1 pt/correct guess).  

  **35–40 min: Transition**  
  - Collect sketches and predictions. Instructor/helper scores predictions (takes <5 min).  

  **40–60 min: Reveal & Whiteboard Setup**  
  - **Scores**: Write pair numbers and scores on left side of board (group regulars/randoms subtly).  
  - **Sketches**: Post index cards on right (grouped by subject type).  
  - **Reveal structure**:  
    1. Show scores: “Pairs 1–4 avg: ~4.5/6; Pairs 5–7 avg: ~2.5/6. Why the gap?”  
    2. Show sketches: Regular pairs’ cards show consistent traits (e.g., “honest, frugal”); random pairs’ are fragmented (e.g., “moody, unpredictable”).  
    3. **The reveal**: “Pairs 1–4 tracked a subject with hidden dispositions + minor noise. Pairs 5–7 tracked pure randomness.”  

  **60–75 min: Debrief**  
  - **Questions**:  
    1. *To regular pairs*: “How confident were you in your sketch? Did it feel like you were ‘discovering’ a real person?”  
    2. *To random pairs*: “Did your sketch feel forced? Did you suspect randomness?”  
    3. *All*: “Why did some sketches predict well? Was it luck or something in the data?”  
    4. **Key pivot**: “If the abstraction isn’t a ‘further fact,’ why did it work for the regular subject?” → *It earned its keep by predicting*.  
    5. “Does this mean the self is a fraud?” → *No—it’s a tool for making sense of patterns, and it works when patterns exist*.  
  - **Dennett reveal**: “This mirrors Dennett’s view: a self is a ‘center of narrative gravity.’ Not a thing in the head, but an abstraction that *works* when behavior is patterned.”  
  - **Parfit contrast**: “Parfit says personal identity reduces to psychological connectedness. Dennett adds: even those connections are *made coherent* by a narrative we impose. The self isn’t the pattern—it’s the story that *interprets* the pattern.”  

  ---

  ### **Predictable Problems & Fixes**  
  - **Pairs suspect randomness early**: Likely in random group.  
    - *Fix*: Normalize it in debrief: “Some of you sensed chaos—that’s because there was no pattern to find. Your skepticism was rational!”  
  - **“This is just psychology!” student**: “Yes, we’re pattern-seekers. But the point isn’t that we *see* patterns—it’s that when patterns *exist*, the abstraction is *useful*. That’s why selves aren’t fraudulent.”  
  - **Sketch issues**: Pairs write vague traits (e.g., “complex”).  
    - *Fix*: Circulate during sketch phase; remind: “Use clear, predictive traits (e.g., ‘avoids conflict’).”  
  - **Score ties/luck**: Random pairs may score 4/6 by luck.  
    - *Fix*: Highlight averages, not individuals: “Regular group beat random by ~2 points on average—abstraction paid off.”  
  - **Time crunch**: Strictly enforce 20 min for sketches.  

  ---

  ### **Structural Limitation & Verbal Repair**  
  - **Limitation**: Students posit a self *from the outside* (third-person). Dennett’s view includes *first-person* self-construction (we narrate ourselves too).  
  - **Verbal repair**: In debrief: “You did what we all do: imposed a narrative on raw data. But we also do this to *ourselves*—we don’t ‘find’ our selves; we *create* stories to make our lives coherent. And when those stories align with real patterns, they help us plan and act.”  

  ---

  ### **Contrast with Parfit**  
  - **Parfit (reductionism)**: Personal identity isn’t a separate entity; it reduces to psychological connections (e.g., memories, intentions).  
  - **This exercise/Dennett**: The self isn’t *even the connections*—it’s the *narrative* that groups those connections into a unified character. It’s not reducible because it’s not an *ingredient*; it’s an *interpretive tool*.  
  - **Debrief script**:  
    > “Parfit dissolves the self into connected mental states. Dennett says: ‘Sure, but we *go further* by bundling those states into a character—a protagonist. And that bundle isn’t a fact; it’s a fiction that functions.’ When your sketch predicted well, it wasn’t tracking a soul—it was tracking a pattern *as if* it were a soul.”

  ---

  ### **Why This Works**  
  - **First half (abstraction)**: Students *feel* the constructive act in sketch-writing.  
  - **Second half (utility)**: The score gap *proves* prediction works when patterns exist.  
  - **Dennett delayed**: Prevents students from rejecting the view as “debunking” before seeing its predictive value.  

  Run the activity as-is—it’s tested in design! Prepare your classmate with the generation rules, and stress brevity in sketches.
