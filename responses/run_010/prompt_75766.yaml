prompt: |-
  Hey — putting on your social-choice-theorist-cum-political-theorist hat for this one, please. Situation: I've just moved onto the standards desk at a fact-checking outfit, and the single most complained-about category of headline we run is anything that attributes a view to "the people" — *Americans want a ceasefire*, *the public has turned on X*, *this is what the will of the people looks like*. Half the complaints are transparently motivated, but a chunk are actually interesting: they claim our wording smuggles in a thesis nobody on the desk could defend if you pinned them down. My editor has asked me for an internal memo on what it takes to license that kind of attribution, and before I write a word of the memo I want the spec, not the memo.

  So: write the desiderata. What does any account of the will of the people have to deliver before it's usable by us — which phenomena it has to make sense of, which cases it has to get right, which distinctions it can't collapse, which formal results it has to be consistent with? Give me the case or the consideration behind each requirement, because I have to defend these to a newsroom that wont take "philosophers say so" for an answer. A few I already suspect belong on the list and want you to either vindicate or throw out: it has to separate what people would say if you asked them from what they stably hold (the non-attitudes problem); it has to survive the fact that majority preferences can cycle, so whoever controls the agenda can manufacture a winner (Riker's line of attack); it has to handle the boundary problem, since who counts as "the people" is usually the very thing being fought over; it has to permit issue-by-issue verdicts instead of one global yes/no; it has to be auditable, meaning a reader could reconstruct from the story alone which procedure produced the attributed will; and — this is the one I most want pressed — it has to be bootstrap-resistant, so that our publishing "the people want X" can't itself be what makes X wanted, which would let the claim certify itself. Add whatever else is genuinely load-bearing that I've missed, and tell me which single requirement eliminates the most candidates.

  Then the part I actually care most about: mark which requirements are non-negotiable for our purposes and which are really just the taste of a particular camp — aggregative/majoritarian accounts, deliberative ones, referendum-based ones, counterfactual-majority views, and the populist-constructivist line where claiming to speak for the people is what constitutes the people in the first place. Score those briefly against your list, but don't let the scorecard eat the spec; the weight should stay on the criteria and their motivating cases. And flag any subset of your own desiderata that you think cant be jointly satisfied — auditability plus bootstrap-resistance plus sensitivity to intensity of preference looks suspicious to me — because if the requirements list turns out to be a kind of impossibility result in disguise, I'd much rather know that before writing the memo than after. Please brainstorm out loud first, dump the candidate requirements untidily, then prune and organise; don't hand me a polished list on the first pass. Finally, be honest about your own confidence: tell me how sure you are of the overall shape of the list, single out the one requirement — or the one joint-unsatisfiability claim — you're least sure of, and say what evidence or argument would settle it.
reasoning: |-
  Hmm, the user is asking me to put on my social choice theorist and political theorist hat to help them with a fact-checking standards dilemma. They need desiderata for when it's legitimate to claim something represents "the will of the people" in headlines, since this is their most complained-about category. They want rigorous criteria that must be defensible to a newsroom, not just philosophical arguments.

  The user has already thought about several requirements: distinguishing real preferences from non-attitudes, handling preference cycles (Riker's critique), addressing the boundary problem (who counts as "the people"), allowing issue-specific verdicts, ensuring auditability, and crucially preventing bootstrap effects where the claim itself creates the preference. They want me to add anything important they've missed.

  First, I need to brainstorm all possible requirements before organizing them. Beyond what they mentioned, I should consider:
  - Intensity of preference (since majority rule ignores how strongly people feel)
  - Deliberative quality (whether preferences are informed or manipulated)
  - Temporal stability (avoiding fleeting opinions)
  - Representativeness (avoiding sampling bias)
  - Resistance to strategic manipulation (like agenda-setting)
  - Distinguishing between revealed and stated preferences
  - Handling multidimensional issues where there's no clear majority
  - Avoiding false precision (acknowledging uncertainty)

  I'll organize these into core requirements. The boundary problem is fundamental - we must define the demos. Non-attitude avoidance is crucial too, as many poll responses are noise. Aggregation robustness matters because of cycling and manipulation risks. Auditability ensures transparency. Bootstrap resistance prevents self-fulfilling prophecies. Issue specificity is practical for journalism.

  For non-negotiables: boundary specification, non-attitude filtering, aggregation robustness, and bootstrap resistance seem essential for basic credibility. Auditability is important for journalistic standards. Intensity sensitivity and deliberative depth might be more aspirational.

  Now, evaluating different approaches against these criteria:
  - Aggregative/majoritarian: Good on auditability but fails on cycling and intensity
  - Deliberative: Handles depth and manipulation but lacks clear decision rules
  - Referendum-based: Clear but vulnerable to framing effects
  - Counterfactual: Interesting but hard to audit
  - Populist-constructivist: Rejects the very premise of objective will

  The tension between auditability, bootstrap resistance and intensity sensitivity might be unresolvable. Auditability pushes toward simple methods, while bootstrap resistance requires methods unaffected by media coverage, and intensity sensitivity demands complex measurements.

  My least confident point is whether bootstrap resistance is feasible at all - any published claim might influence opinion. But we can mitigate this by using methods less vulnerable to bandwagon effects.

  The most eliminative requirement is aggregation robustness - it immediately disqualifies simple majority rule in complex preference landscapes.

  I'll structure the response by first listing candidate requirements with motivations, then organizing into core criteria, evaluating approaches, and finally discussing feasibility and confidence levels.
answer: |-
  Here’s the spec you need—the desiderata any "will of the people" attribution must satisfy to be defensible in a fact-checking context, grounded in hard cases and formal theory. I’ll start with a messy brainstorm, then refine to core requirements, flag trade-offs, and score major approaches. **The goal: a claim like "Americans want X" must survive scrutiny as a *fact*, not a rhetorical artifact.**

  ---

  ### **Phase 1: Brainstorm Dump (Raw Candidate Requirements)**
  1. **Non-Attitude Immunity**: Must filter out "non-attitudes" — opinions conjured on the spot when people have no stable view (e.g., polls on obscure legislation). *Case:* 75% of respondents "support" the fictitious "Public Affairs Act" (Bishop et al. 1980).  
  2. **Aggregation Robustness**: Survives cycling majorities and agenda manipulation. *Case:* 51% prefer A>B, 51% B>C, 51% C>A — no coherent "will" exists (Condorcet paradox).  
  3. **Boundary Sensitivity**: Explicitly defines "the people" (citizens? voters? adults?) and acknowledges contestation. *Case:* "Americans support border wall" — but does this include undocumented immigrants? D.C. statehood?  
  4. **Issue Specificity**: Delivers verdicts on discrete policies, not just regime approval. *Case:* "The public demands democracy" is vacuously true; "demands filibuster abolition" is testable.  
  5. **Auditability**: Methodology must be replicable from the report. *Case:* Reader sees "poll of 1,000 adults ±3%," but not "experts infer from cultural vibes."  
  6. **Bootstrap Resistance**: Claim’s publication can’t *cause* its own truth (no self-certifying prophecies). *Case:* Media declares "the people want impeachment" → rallies opinion via bandwagon effect.  
  7. **Intensity Sensitivity**: Accounts for *strength* of preference (e.g., 51% mildly prefer status quo vs. 49% passionately demand change). *Case:* Abortion views where minority intensity overwhelms majority apathy.  
  8. **Manipulation Resistance**: Robust to framing effects, strategic polling, or elite cueing. *Case:* Support for "death tax" vs. "estate tax" varies by 20+ points (Lakoff 2004).  
  9. **Temporal Stability**: Reflects persistent views, not momentary spikes. *Case:* Sudden "rally 'round the flag" surges after national crises.  
  10. **Epistemic Quality**: Preferences formed with minimal misinformation/coercion. *Case:* 2003 Iraq War support fueled by false WMD claims.  
  11. **Representativeness**: Sample/population alignment prevents skewed claims. *Case:* Twitter "public opinion" vs. nationally representative surveys.  
  12. **Multidimensional Handling**: Avoids reducing complex issues to binary yes/no. *Case:* "Support healthcare reform" obscures trade-offs (cost/coverage/speed).  

  ---

  ### **Phase 2: Pruned & Organized Core Desiderata**  
  *(Non-negotiables in **bold**; others context-dependent)*  
  1. **Boundary Specification**:  
     - *Must:* Define the relevant demos and justify its scope.  
     - *Why:* Unavoidable for any claim (e.g., Brexit’s "people" excluded EU citizens in UK).  
     - *Failure Case:* Claiming "the people" oppose immigration while omitting immigrant voices.  

  2. **Non-Attitude Filtering**:  
     - *Must:* Distinguish genuine preferences from noise.  
     - *Why:* Polls often measure top-of-mind reactions, not considered views.  
     - *Failure Case:* Reporting that "60% support" a policy respondents just heard of.  

  3. **Aggregation Robustness**:  
     - *Must:* Yield a coherent outcome immune to agenda manipulation.  
     - *Why:* Social choice theory shows majority rule is chaotic without strict conditions (single-peaked preferences).  
     - *Failure Case:* Legislators "manufacture" majority support by controlling vote sequencing.  

  4. **Bootstrap Resistance**:  
     - *Must:* Attribution remains valid *even if unpublished*.  
     - *Why:* Journalism shapes opinion; claims can’t be self-validating (e.g., media declares "mandate," shifting polls).  
     - *Failure Case:* "The people demand [X]" headlines create protest momentum for X.  

  5. **Auditability**:  
     - *Must:* Transparent method allowing third-party verification.  
     - *Why:* Fact-checking requires replicability; opaque "vox populi" claims are unfalsifiable.  
     - *Failure Case:* Citing "broad public sentiment" without data sources.  

  6. **Manipulation Resistance (Framing-Independence)**:  
     - *Must:* Stable across reasonable wording/context changes.  
     - *Why:* Framing effects can flip apparent majorities (e.g., "95% employment" vs. "5% unemployment").  
     - *Failure Case:* Support for "climate action" plummets when called "carbon tax."  

  ---  
  ### **Trade-Offs & Impossibility Tensions**  
  - **The Trilemma**: You suspect correctly. **Auditability + Bootstrap Resistance + Intensity Sensitivity** may be *jointly unsatisfiable*:  
    - *Auditability* favors simple methods (e.g., majority vote).  
    - *Bootstrap resistance* requires methods unaffected by media (e.g., latent preferences).  
    - *Intensity sensitivity* needs complex tools (e.g., quadratic voting) that are hard to audit *and* vulnerable to bandwagon effects if published.  
    **→ Consequence:** You likely can’t have all three. Prioritize auditability + bootstrap resistance; intensity may be a luxury.  

  - **Other Tensions**:  
    - *Non-attitude filtering* vs. *Temporal stability*: Filtered views may still shift (e.g., post-deliberation).  
    - *Epistemic quality* vs. *Auditability*: Measuring "informed preferences" requires subjective thresholds.  

  ---  
  ### **Scoring Major Approaches**  
  *(✔ = Satisfies ✖ = Fails ~ = Partial/Contextual)*  
  | **Approach**             | Boundary | Non-Attitude | Aggregation | Bootstrap | Auditability | Key Weakness |  
  |--------------------------|----------|--------------|-------------|-----------|--------------|--------------|  
  | **Aggregative (Polls)**  | ✔        | ✖            | ✖           | ✖         | ✔            | Frames non-attitudes as "will"; manipulable |  
  | **Deliberative (Citizens’ Assemblies)** | ✔ | ✔ | ~ | ✔ | ~ | Low auditability; small samples |  
  | **Referenda (Direct votes)** | ✔     | ✖            | ~           | ✖         | ✔            | Vulnerable to framing; bootstraps turnout |  
  | **Counterfactual Majority ("What rational voters would want")** | ~ | ✔ | ✔ | ✔ | ✖ | Unauditable; elitist |  
  | **Populist-Constructivist ("Claiming = Creating")** | ✖ | ✖ | ✖ | ✖ | ✖ | Self-certifying; anti-factual |  

  **Key Insight**: No approach satisfies all desiderata. Aggregative methods fail hardest (non-attitudes, cycling). Deliberative models score best on robustness/bootstrap but worst on auditability.  

  ---  
  ### **Which Requirement Eliminates the Most?**  
  **Aggregation Robustness**. Simple majority claims collapse under Riker’s critique: without proof of single-peaked preferences or a Condorcet winner, "the people’s will" is often mathematically incoherent. This alone voids most headline claims.  

  ---  
  ### **Confidence Assessment**  
  - **Overall Shape**: 90% confident. Desiderata derive from settled social choice theory (Arrow, Riker) and empirical poli-sci (Zaller, Achen).  
  - **Least Confident Requirement**: **Bootstrap Resistance**.  
    - *Why*: All published claims *might* influence opinion; the line between "revealing" and "creating" is fuzzy.  
    - *Settling Evidence*: Experimental data showing how "will of the people" framing shifts marginal preferences (e.g., randomized headline testing). If influence is marginal (<2-3%), bootstrap resistance holds.  
  - **Most Contested**: *Epistemic Quality*. Some argue "true will" requires informedness; others call this paternalistic. For fact-checking, omit it—focus on measurable *stability* instead.  

  ---  
  ### **Memo Implications**  
  1. **Non-Negotiables**: Boundary, Non-Attitude Filtering, Aggregation Robustness, Bootstrap Resistance.  
  2. **Recommendation**: Only use "the people want [X]" if:  
     - Demos is defined (e.g., "registered voters").  
     - Preferences are stable/replicated across framings.  
     - A Condorcet winner exists (or near-consensus for binary issues).  
     - Data predates major media coverage of the issue.  
  3. **Default Alternative**: Attribute to specific *sources* ("Pew poll shows 60% of U.S. adults support...") — bypasses "will" metaphysics entirely.  

  **Bottom Line**: The "will of the people" is rarely a fact; it’s an *interpretation* of data under contestable assumptions. Your memo should force journalists to defend those assumptions—or drop the phrase.  

  Let me know if you need the formal theorems weaponized for newsroom arguments.
