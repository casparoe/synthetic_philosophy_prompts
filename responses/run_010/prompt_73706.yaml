prompt: |-
  I am a Year 13 student writing an EPQ on reference and necessity, and I have reconstructed an argument that I cannot shake. It appears to show that the category Kripke made famous — the necessary a posteriori — is empty, and hence that no empirical enquiry has ever established a necessity. My supervisor is confident that I have made an elementary error somewhere, but I have now read the argument through a dozen times and cannot find one, which is why I should value a proper diagnosis rather than a summary of the standard view.

  (1) A term rigidly designates x just in case it designates x in every possible world in which x exists.
  (2) 'Water' rigidly designates water, and 'H₂O' rigidly designates H₂O.
  (3) Where a true identity is flanked by two rigid designators, it holds in every world in which its terms exist; so it is necessary.
  (4) Therefore, if water is H₂O, then necessarily water is H₂O.
  (5) A statement is necessary just in case there is no possible world in which it is false.
  (6) If there is no possible world in which S is false, then no possible experience could disclose S to be false.
  (7) Experience bears on whether one is justified in accepting S only if some possible experience could count against S.
  (8) So experience bears on the justification of no necessary truth.
  (9) S is knowable a posteriori only if experience bears on the justification of S.
  (10) So no necessary truth is knowable a posteriori.
  (11) Every knowable truth is knowable either a priori or a posteriori.
  (12) We do know that water is H₂O.
  (13) So we know a priori that water is H₂O — and by the same route a priori that heat is the motion of molecules, and that Hesperus is Phosphorus.
  (14) Therefore scientific discovery has never consisted in establishing a necessity, and there is no such thing as the necessary a posteriori.

  (13) strikes me as plainly absurd: I could sit and reflect until doomsday without arriving at 'H₂O'. What I should most like to keep are (6) and (7), which look to me like nothing more than an unpacking of 'necessary' and of what it is for experience to matter to justification at all. Reluctantly I have been driven towards denying (2), on the ground that 'water' might be a role term — meaning something like the clear, drinkable liquid that fills our lakes — in which case it would designate different stuff in different worlds; but that seems to hand away everything the Twin Earth cases were meant to secure, and I should not like to pay that price without understanding what I am buying.

  So: is this argument valid with a false premise, or invalid with a defective step? Name the step you would reject, explain what makes it look unobjectionable on a first reading, and state precisely what is lost by rejecting it. If you reject (2) or (3), tell me how much of the framework survives and whether (4) can be recovered by other means. If you reject (6) or (7), tell me in what sense experience can be evidence for a truth that no experience could ever have disconfirmed. And please say whether (11) is doing quiet work here, since it looks to me as though it may already assume that a necessary truth must be an a priori one, which is the very thing in dispute.
reasoning: |-
  Okay, let me approach this Year 13 student's EPQ argument methodically. The student presents a sophisticated chain of reasoning aiming to disprove Kripke's necessary a posteriori category, recognizing the absurdity of concluding we know water's identity a priori. 

  First, I notice the argument's logical structure appears formally valid until step (13), where the contradiction emerges. The core tension lies between the rigidity claims (1-4) and the epistemic principles (6-10). The student's intuition to protect (6) and (7) is understandable - they seem like straightforward corollaries of necessity and empirical justification. But this protection comes at the high cost of either abandoning rigid designation (against Kripke) or accepting the absurd (13).

  Hmm... the pivotal flaw must be in how necessity relates to justification. Let me examine premise (7): "Experience bears on justification only if some possible experience could count against S." This seems plausible for contingent truths, but for necessities? Consider that experiences can confirm necessities without being able to falsify them. The student's error is assuming symmetric evidential relations. Discovering H₂O's properties in actuality supports the necessity claim precisely because no counterexample exists. 

  Ah! And premise (8) overgeneralizes: while no experience falsifies necessities, experiences provide positive evidence by eliminating epistemic possibilities. When we test samples across contexts and find consistent H₂O, we're not testing possible falsity (which doesn't exist) but confirming the actuality that grounds the necessity. 

  The student's worry about (11) is perceptive but misplaced - (11) is neutral about the necessity/apriority link. The real culprit is the conflation in (7)-(8) of what justifies belief (empirical investigation) with what would falsify the proposition (nothing, in this case). 

  Rejecting (7) preserves Kripke's framework entirely: rigid designators still yield necessary identities (2-4 stand), while empirical knowledge of necessities remains possible because experience provides justification through verification, not falsification. The Twin Earth intuition survives - 'water' rigidly picks out H₂O across worlds, but we needed chemistry to discover this. 

  What makes (7) initially appealing is its truth for contingent propositions, but necessary truths break the symmetry. The cost of rejecting (7) is accepting that evidence works differently for necessities - but that's precisely what Kripke showed.
answer: |-
  Your argument is valid but unsound due to a critical error in **premise (7)**: "Experience bears on whether one is justified in accepting S only if some possible experience could count against S." This premise conflates *justificatory relevance* with *falsifiability* and misunderstands how empirical evidence supports necessary truths. Below is a step-by-step diagnosis:

  ### Step-by-Step Diagnosis:
  1. **Premises (1)-(4)** are correct: Rigid designation entails that "Water = H₂O" is necessary if true.  
  2. **Premise (5)** is standard.  
  3. **Premise (6)** is true: Necessity implies no possible falsifying experience.  
  4. **Premise (7) is false**:  
     - **What makes it seem plausible**: For *contingent* propositions, justificatory relevance requires potential counterevidence. If no experience could disconfirm S, it appears experience is irrelevant.  
     - **Why it fails for necessities**:  
       - Experience can *confirm* S by eliminating epistemic possibilities. For instance, experiments showing water’s molecular structure *rule out alternatives* (e.g., "water is XYZ") in the actual world. This justifies believing S, even though S couldn’t be false.  
       - **Key distinction**: A necessary truth has no *metaphysical* counterexamples, but we may lack *epistemic* certainty. Empirical evidence resolves epistemic uncertainty about what is metaphysically necessary.  
  5. **Premises (8)-(10) collapse with (7)**:  
     - If (7) is false, experience *can* bear on justifying necessary truths (e.g., by confirming their truth in the actual world).  
  6. **Premises (11)-(12)** hold: We know "Water = H₂O" empirically.  
  7. **Conclusion (13)-(14) is invalidated**:  
     - Since (7) is false, (13) doesn’t follow. We know "Water = H₂O" *a posteriori*, not a priori.  

  ### What Rejecting (7) Preserves:
  - **Kripke’s framework remains intact**:  
    - Rigid designation (2) holds: "Water" refers to H₂O in all worlds.  
    - Necessary a posteriori (4) stands: "Water = H₂O" is necessary but known empirically.  
  - **Twin Earth survives**: "Water" rigidly designates H₂O, not a role. On Twin Earth, "water" refers to XYZ precisely because it’s not H₂O.  

  ### Addressing Your Concerns:
  - **On (6) and (7)**:  
    - Necessity means no experience *could* disconfirm S (6 is true).  
    - But experience *can still confirm S* by providing positive evidence (e.g., lab results) that supports S’s actual truth, which (given rigidity) implies necessity.  
    - **Analogy**: Mathematical necessities (e.g., "2 + 2 = 4") are known a priori. But if we empirically counted apples to verify it, the experience *supports* our belief—even though no count could falsify it. Water/H₂O is analogous but requires empirical discovery because the essence isn’t accessible a priori.  

  - **On (11)**:  
    - (11) is innocent: It doesn’t assume necessity implies apriority. It only claims all knowledge is via one of two routes.  

  ### Why Your Intuition About (13) is Correct:
  - You cannot deduce "Water = H₂O" a priori because:  
    - "Water" rigidly designates a substance whose essence is hidden. Empirical investigation reveals that essence.  
    - A priori reflection only gives you descriptive concepts (e.g., "the watery stuff"), not the essential microstructure.  

  ### Conclusion:
  - **The flaw is in (7)**: It imposes a falsifiability requirement on empirical justification that is apt for contingencies but not necessities. Rejecting (7) allows that experience justifies necessary truths by confirming their actual truth, which (given rigidity) entails their necessity.  
  - **Outcome**: The necessary a posteriori is real. Science discovers necessities by empirically identifying essences, but once known, those truths hold across possible worlds.  

  **Recommended reading**: Kripke’s *Naming and Necessity* (lecture III) and Soames’ *Reference and Description* (§2.3) on how empirical evidence grounds knowledge of necessities. Your argument elegantly exposes why the necessary a posteriori is puzzling—but (7) is the crack where the puzzle leaks.
