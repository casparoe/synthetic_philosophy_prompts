prompt: |-
  I write novels for a living — three out, fourth due in the spring — and a literary magazine has asked me for a short position piece on who actually owns a story, timed to some AI conference, and my agent says the editors want my "principles" stated cleanly for once instead of the hedging I do in interviews. So I sat down and wrote them out, and now I honestly can't tell whether they hang together. Here's the list.

  (a) Nobody owns an idea. Premises, "what ifs," plot shapes, tropes — all free game, always have been. I tell my MFA students to steal premises shamelessly and worry only about whether they can execute one. (b) Same goes for lives: nobody owns their own story either, so any writer may fictionalize any real person including me, and I owe them nothing. I built a whole section of my second book out of my great-aunt's letters, which I inherited, and I don't think her grandchildren — who are alive and who hated the book — had any standing to stop me. (c) But when a friend I'd workshopped with took the central device I'd talked her through over dinner — a novel made entirely of the marginalia left in one library copy by successive borrowers — and got it out two years ahead of me, I didn't feel like she'd been merely rude. I felt like she'd taken something that was mine. I still call it theft when I tell the story. (d) I also think style theft is real: someone who writes a book so thoroughly in my voice, rhythms and all, that reviewers mix us up has wronged me even if not one clause is copied, and I don't think that's just me being precious. (e) Training a language model on my novels without asking is theft too, even though the model stores no copy of anything and emits no sentences of mine. Something is taken. (f) That said, when the Authors Guild lost the Google Books case in 2015 I said in print that it was the right result — tens of millions of books scanned with no permission asked, and fine, because readers got search instead of substitutes. (g) Fanfiction of my own work is morally fine and shouldn't be litigated or shamed, including the stuff that's better than my books. (h) Copyright's moral point is to let people who write for a living keep writing; where enforcement doesn't serve that, it loses its claim on me.

  A friend of mine who does IP law read the list and said "this is a mess, pick three and stop," and my agent said its completely coherent and that the incoherence is the brand. They can't both be right, and I can't tell which one is bluffing. So: go through it as an audit rather than an essay. Which pairs genuinely pull against each other, and which ones only look bad but survive inspection once you say what's really doing the work? For each real tension, give me the cheapest repair and what that repair costs — meaning, which sentence do I have to stop saying in interviews. Rank the tensions by severity instead of dumping them all on me as equally bad, and end by telling me which single revision buys the most consistency for the least damage. I'm not attached to any particular item on the list, I just want to know where the load-bearing wall is and whether I've been leaning on it while telling everyone it isn't there.
reasoning: |-
  Okay, the user is a professional novelist who's been asked to write a position piece for a literary magazine. They've drafted their principles on story ownership but feel uncertain about internal coherence. Their IP lawyer friend called it "a mess" while their agent praised its "coherent incoherence." The core request is an audit identifying contradictory principles, ranking tensions by severity, and suggesting minimal repairs.

  Hmm, the user's list reveals fascinating tensions between their strong anti-ownership stance (a-b) and deeply personal sense of appropriation (c-e). The Google Books/fanfiction positions (f-g) further complicate matters. What's striking is how their visceral reaction to the "marginalia device" theft (c) clashes with their theoretical rejection of idea ownership (a) - that's the fracture line.

  The user's framing as "leaning on load-bearing walls" suggests they suspect their principles might collapse under scrutiny. Their willingness to sacrifice any particular point indicates this is about structural integrity, not attachment to individual positions. The professional context matters too - this isn't academic navel-gazing but a public statement that could affect their reputation.

  *scratches head* The biggest headache is reconciling "nobody owns ideas" with the "marginalia device" feeling like theft. That's not just hypocrisy - it reveals something important about creative labor. Maybe the repair requires distinguishing between raw ideas and developed execution frameworks? But then how does that square with their style-theft position (d)?

  *checks notes* The AI training point (e) is particularly thorny given their Google Books stance (f). Both involve mass copying without permission, yet they draw opposite conclusions. The common thread might be harm to livelihood, but AI's probabilistic output differs from Google's exact copying. Still, the user needs to address this dichotomy.

  For the style theft point (d), it holds up surprisingly well - voice as artistic fingerprint is defensible even within their framework. The fanfiction position (g) is actually perfectly consistent with their overall philosophy. The moral-rights-vs-livelihood principle (h) could be the golden thread tying everything together if framed carefully.

  *realizes* The single most valuable fix would be reworking the "marginalia device" example to acknowledge it as a betrayal of creative trust rather than theft. That preserves the anti-idea-ownership stance while explaining the visceral hurt. Costs them a dramatic "theft" accusation but saves their entire framework.
answer: |-
  Here's an audit of your principles, ranking tensions by severity, identifying the core conflicts, and providing minimal-cost repairs. The "load-bearing wall" is your stance on **creative labor vs. abstract ideas**, and the most critical tension involves your personal sense of appropriation clashing with your theoretical rejection of ownership.

  **Severity Ranking & Audit:**

  1.  **MOST SEVERE TENSION: (a) vs. (c)**
      *   **Conflict:** (a) explicitly states "Nobody owns an idea... Premises, plot shapes, tropes — all free game." (c) describes a friend taking a "central device" you discussed (a specific *execution* of a premise: a novel made of marginalia in a *single* library copy) as "theft" and "something that was mine."
      *   **Why it Pulls Hard:** The "central device" feels like an *idea* (a specific plot structure/narrative mechanism) – the very thing you declare "free game" in (a). Your strong emotional reaction ("theft," "mine") directly contradicts the principle of "steal premises shamelessly." This is the core fracture.
      *   **Cheapest Repair:** **Re-categorize the "central device" as developed execution, not just an idea.** Revise (c) to emphasize it was the *specific, detailed framework* you'd *workshopped and developed with her* over dinner, moving beyond a raw "what if" into the realm of your unique creative *labor* on *how* to make it work. Acknowledge the *betrayal of trust* (sharing developmental work) was primary, even if the *device itself* wasn't strictly "owned."
      *   **Cost:** You lose the dramatic, unambiguous claim of "theft" regarding the *idea/device itself*. You must stop saying she "took something that was *mine*" in the proprietary sense implied in (c). You can still call it a profound betrayal of creative trust and deeply unethical.

  2.  **SIGNIFICANT TENSION: (f) vs. (e)**
      *   **Conflict:** (f) endorses Google Books scanning millions of books without permission as "the right result" because it provided search (transformative utility) without substitution. (e) declares training an LLM on your novels without permission "theft," even though it involves no direct copying and produces no substitutes (arguably more transformative than indexing).
      *   **Why it Pulls:** Both involve mass copying of copyrighted text without permission or compensation for a new technological purpose. Your distinction hinges on perceived *harm/benefit* (search vs. potential market substitution/dilution by AI) and perhaps *scale of transformation* (indexing vs. statistical pattern generation). This looks like inconsistency without a clear, articulated principle separating them.
      *   **Cheapest Repair:** **Clarify the distinction based on *potential market harm/derivative creation*.** Argue that Google Books created a *research tool* fundamentally different from the original books, posing no threat to the market for the books themselves or authorial opportunity. LLM training, however, directly enables the creation of *substitutable content* (new text in the style/genre) or *derivative works* that *could* cannibalize the market for human-authored fiction and exploit the *expressive patterns* unique to authors. Emphasize the *generative* and *competitive* nature of LLMs vs. the *referential* nature of Google Books.
      *   **Cost:** You have to stop framing LLM training *solely* as "theft" in the abstract. You must explicitly articulate the market/derivative harm argument as the *reason* it's different from Google Books. This makes (e) more nuanced and less punchy.

  3.  **MODERATE TENSION: (a) vs. (d)**
      *   **Conflict:** (a) declares ideas/tropes free game. (d) claims "style theft is real" even if no clauses are copied, wronging the original author. Style can feel like an abstract, non-protectable "idea" of *how* to write.
      *   **Why it Pulls (But Survives Inspection):** This tension is resolvable. Ideas/plots are abstract structures. *Style* is the unique *expression* and *embodiment* of an author's voice, rhythm, and sensibility – the fingerprint of their creative labor applied to *any* idea. Copyright protects expression, not ideas. Your principle (d) aligns with this: copying the *expressive fingerprint* itself (even applied to a different plot) can be seen as misappropriating the *labor* of developing that unique voice. It feels different from stealing a premise.
      *   **Cheapest Repair:** **None strictly needed, but clarify the distinction.** Emphasize in (d) that style *is* the core expression and result of an author's lifetime of creative labor, making its wholesale replication (beyond influence/homage) a direct appropriation of that *expressive identity*, distinct from using an abstract plot idea. This strengthens the link to your core "labor" principle (h).
      *   **Cost:** Minimal. Just ensure your articulation of (d) clearly separates "expression" (style/voice) from "idea" (premise/trope).

  4.  **MINOR TENSION/CLARIFICATION NEEDED: (b) vs. General Principle**
      *   **Conflict:** (b) asserts "nobody owns their own story," allowing fictionalization of real people with no obligation. This logically extends to *other* writers fictionalizing *you*. Would you genuinely feel no claim if someone wrote a scathing, recognizable roman à clef about *you*?
      *   **Why it's Minor (But Worth Noting):** Your principle is clear and defensible (morally, if not always legally re: privacy/libel). The tension is less with other points and more with potential *personal hypocrisy*. Your reaction in (c) shows strong possessiveness over *your own* creative development. Would that extend to your life story?
      *   **Cheapest Repair:** **Acknowledge the personal challenge while holding the principle.** Add a brief qualifier: "This principle holds even when it's uncomfortable or applied to me, though the ethics of *malicious* distortion remain complex." Or simply stand firm, accepting the potential personal cost.
      *   **Cost:** Acknowledging the discomfort slightly softens the absolutism, but maintains the core principle. Standing firm costs nothing but requires consistency.

  5.  **CONSISTENT POINTS:**
      *   **(g) Fanfiction:** Perfectly consistent with (a) & (b) - fans playing with your ideas/characters is the free use you endorse. Also aligns with (h) - it rarely hinders your livelihood, often helps it.
      *   **(h) Livelihood Principle:** This is the golden thread. It explains (f) (Google Books aids research, doesn't harm sales), justifies (e) (AI *threatens* livelihood via substitution), underpins the distinction in repairing (a)/(c) (protecting developed labor), and supports (d) (protecting the unique expressive identity you trade on). It *is* your core "load-bearing wall."

  **The Single Most Impactful Revision:**

  **Revise (c) as proposed in #1.** This directly addresses the most glaring contradiction (a vs. c) where your visceral reaction clashes most violently with your stated principle. It forces you to articulate *why* the "central device" felt like more than just an abstract idea – framing it as the appropriation of *your specific developmental labor and trust*, aligning it better with your justification for style (d) and your core livelihood principle (h).

  *   **Cost:** As above, you lose the simplistic, powerful "theft" label for the *idea/device itself*. You trade rhetorical punch for philosophical consistency by focusing on the betrayal and appropriation of *labor-in-process*.
  *   **Benefit:** This repair significantly shores up the foundational "ideas are free" principle (a) while preserving the legitimacy of your outrage in (c). It strengthens the overall framework by anchoring your sense of ownership firmly to *creative labor and development*, not abstract concepts. This makes (d), (e), and (h) much more coherently defensible.

  **Conclusion:**

  Your agent is partially right – the *apparent* incoherence (especially the tension between free ideas and personal appropriation) *is* authentic and reflective of the messy reality of authorship. However, your IP lawyer is also right that the *strongest* version of your argument requires resolving the core tension between (a) and (c). The "load-bearing wall" is **Principle (h): Copyright exists to protect the ability to earn a living from creative labor.**

  The revision to (c) is the cheapest, most effective way to make your principles hang together. It forces you to define the boundary between "free idea" and "protected creative labor" more precisely, strengthening your entire position. Stop claiming the *idea* of the marginalia device was "stolen" or "yours" in a proprietary sense; frame it instead as the unethical appropriation of your *developmental work* and a betrayal of collaborative trust. This buys significant consistency for minimal damage to your overall stance.
