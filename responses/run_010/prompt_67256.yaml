prompt: |-
  Bit of an odd one, and it's mostly for my own head rather than for print — though chunks of it might end up in a column.

  I cover science and ideas now, but before that I spent years on the patent beat, mostly biotech, which means I've read more PTAB decisions than is healthy and I still think about credit and priority in patent-law terms: conception, reduction to practice, diligence, prior art, the person having ordinary skill in the art, obviousness, derivation, named inventorship, and the whole exclusion list of things you simply can't own — laws of nature, natural phenomena, abstract ideas, mathematical methods.

  Here's what I want. Take the debate about simultaneous discovery — the Newton/Leibniz calculus fight including the Royal Society panel that found for Newton and effectively wrote its own report, Darwin and Wallace being read out together at the Linnean Society in 1858 because Lyell and Hooker arranged it, Merton's claim that multiples are the normal pattern in science and singletons the anomaly, and the other half of it, whether it matters who got there first given that priority is mainly a reputational institution (the Matthew effect, obliteration by incorporation, the Nobel rule capping a prize at three laureates) — and restate the whole argument in my patent-law vocabulary. Not as an analogy I can wave at readers. As a real translation, claim by claim, with the legal categories doing the load-bearing work.

  Then the residue report, which is the part I actually care about:

  1. What translates cleanly? I suspect Merton's readiness-of-the-field claim is basically PHOSITA plus prior art, and a multiple is just what happens when something is obivous to the skilled person and two teams independently reduce it to practice. If that's right, spell out the awkward consequence: patent law's answer to an obvious thing is to give nobody any rights at all. Does the inevitability thesis, translated, become an argument for abolishing priority?

  2. What only fits if you bend it? Try the historian's objection that Newton and Leibniz — or Scheele, Priestley and Lavoisier — never discovered the same thing, that there's no fixed object for two people to both hit. What in my vocabulary could carry that? Claims defining the invention, overlapping-but-not-identical scope, written description, enablement? Tell me exactly where you're fudging.

  3. What has no counterpart at all? Run the paradigm cases through the machine honestly: calculus is a mathematical method and natural selection is a law of nature, so both are unpatentable subject matter and the framework can't admit them in the first place. Same question for truth — the law allocates a monopoly, science allocates credit, and neither tracks whether anything is true, but only one of them admits it. Is that gap a hole in the legal vocabulary, or evidence the does-it-matter-who debate is thinner than it sounds?

  4. And the case where the two allocation systems collided head-on: CRISPR, where the Nobel went to Charpentier and Doudna and the interference went the other lab's way. Which rule gave the better answer about who discovered what — and what does it say that the US has since moved to first-inventor-to-file and killed off interference proceedings entirely?

  Two rules. Don't smuggle the law's assumptions in and call it translation: every time you have to convert discovery into invention to make something fit, flag it in the margin. And no reading list or citations — I can't chase sources and don't want to. As long as it needs to be.
reasoning: |-
  Okay, let's tackle this fascinating request. The user wants to map scientific discovery debates onto patent law concepts - not as analogy but as direct translation. They're a science writer with patent law background, so this needs precision. 

  First, I need to unpack their four core questions: 
  1) Clean translations (like Merton's multiples = obviousness in patent terms)
  2) Forced fits (like different versions of "same" discovery)
  3) Conceptual gaps (unpatentable subject matter)
  4) Real-world collisions (CRISPR case)

  The patent concepts they listed - conception, PHOSITA, reduction to practice etc. - will be my building blocks. Key challenge: avoiding smuggling when moving between discovery/invention frameworks. Must flag every translation stretch.

  Starting with Merton's multiples. In patent law, when multiple inventors reach similar solutions independently, it often indicates obviousness. The clean translation: simultaneous discovery becomes evidence that the "invention" was obvious to PHOSITA given prior art. But patent law's response - denying protection - creates tension with science's priority debates. 

  For bending concepts: the historian's view that no two discoveries are identical maps imperfectly to patent claims. We'd have to treat "the discovery" like a claim set and examine enablement/written description to see if different versions fall within scope. It's a forced fit because discoveries aren't defined with patent claims' precision.

  Major gap: unpatentable subject matter. Calculus and natural selection wouldn't even enter the patent system. This exposes how patent law filters what counts as allocatable "invention" - a limitation when analyzing pure knowledge claims. The truth gap matters too - patent law explicitly doesn't care about truth, while science's credit system implicitly relies on it.

  CRISPR collision is telling. Nobel used different criteria (conception/insight) than patent interference (reduction to practice). US moving to first-to-file favors documentation speed over inventive contribution depth - which might worsen the science/patent misalignment.

  Throughout, I'll maintain their rules: flag every "discovery→invention" shift, no citations. The residue report should help them see where patent concepts illuminate vs. distort scientific priority debates.
answer: |-
  Here’s the translation you requested, followed by a residue report. Patent law concepts are applied strictly, with deviations flagged explicitly.

  ### Core Translation: Scientific Discovery Debates → Patent Law
  1. **Merton’s Multiples as Obviousness**  
     - *Translation*: Simultaneous independent discovery = evidence that the invention was obvious to a PHOSITA at the time, given prior art.  
     - *Consequence*: Under patent law (35 U.S.C. §103), obvious inventions receive **no rights**. Translating this to science: if a discovery is "obvious" (i.e., inevitable given the state of the field), priority claims should be irrelevant.  
     - *Flag*: "Discovery" is treated as "invention" here.  

  2. **Priority Disputes (Newton/Leibniz, Darwin/Wallace)**  
     - *Translation*: A dispute over who first conceived and reduced to practice the invention.  
     - *Conception*: Newton’s unpublished notes (1670s) vs. Leibniz’s publication (1684).  
     - *Reduction to Practice*: Newton’s *Principia* (1687) vs. Leibniz’s calculus system (operational by 1675).  
     - *Diligence*: Newton’s delay in publishing weakens his priority claim absent proof of continuous development.  
     - *Interference Proceeding*: The Royal Society panel acted as PTAB, awarding priority to Newton based on earlier conception + partial reduction (manuscripts).  
     - *Lyell/Hooker Arbitration*: Forced joint inventorship (Darwin/Wallace) to avoid interference by merging disclosures into a single "application" (Linnean Society presentation).  

  3. **The Matthew Effect & Credit Allocation**  
     - *Translation*: "Obliteration by incorporation" = prior art so well-known it need not be cited; the Matthew Effect = crediting the first named inventor even if contributions were equal.  
     - *Nobel’s Three-Laureate Limit*: Analogous to patent law’s restriction on joint inventorship (each must contribute to the claimed invention’s conception). Excess contributors are omitted.  

  4. **"No Fixed Object" Historian Argument**  
     - *Translation*: Newton’s fluxions vs. Leibniz’s calculus = two patent applications with **overlapping but non-identical claims**.  
     - *Fit via Bending*:  
       - "Scope" is fudged: Scientific discoveries lack claim language. We treat them as a set of enabled methods (e.g., "a method for calculating derivatives of polynomials").  
       - Newton’s version enabled algebraic functions; Leibniz’s enabled easier notation for transcendentals. Neither fully anticipated the other’s claims under §112(a).  
     - *Flag*: Discovery → invention; truth claims → legal enablement.  

  ---

  ### Residue Report  
  **1. What Translates Cleanly?**  
  - **Prior Art + PHOSITA = "Readiness of the Field"**: Merton’s multiples occur when prior art advances make an invention obvious to a PHOSITA. Independent reduction to practice by multiple teams is expected.  
  - **Consequence**: Patent law’s denial of rights for obvious inventions *does* imply that priority should be irrelevant. But science’s credit economy (Nobels, citations) persists because it rewards *reduction to practice* (publication/demonstration), not just conception. This creates tension: science demands priority for credit, while patent law voids it for obviousness.  

  **2. What Fits Only When Bent?**  
  - **Differing "Versions" of Discovery**:  
    - *Bending Used*: Treating discoveries as patent claims with scope. E.g., Lavoisier’s "oxygen" vs. Priestley’s "dephlogisticated air" = two specifications with varying written description (§112). Lavoisier’s claims (elemental oxygen supporting combustion) were enabled; Priestley’s relied on an invalid theory (phlogiston), failing enablement for modern chemistry.  
    - *Where It Breaks*: Patent claims require definite boundaries; discoveries evolve. Translation forces a false precision.  
  - **Derivation vs. Independent Conception**:  
    - Wallace’s letter to Darwin = derivation risk. Lyell/Hooker treated it as joint inventorship to avoid a fight. In patent law, this would require proof Wallace derived from Darwin’s unpublished notes (not proven).  

  **3. What Has No Counterpart?**  
  - **Unpatentable Subject Matter (§101)**:  
    - Calculus (mathematical method) and natural selection (law of nature) are categorically excluded. Patent law *cannot* adjudicate priority for these—they lie outside the system.  
    - **Gap Consequence**: The "does priority matter?" debate assumes discoveries are ownable. But for fundamental truths, patent law offers no framework. This exposes the debate’s thinness: science’s priority contests are about **credit for application**, not truth itself (e.g., Nobel for CRISPR *applications*, not discovering natural mechanism).  
  - **Truth Irrelevance**: Patent law explicitly ignores truth (e.g., patents granted for incorrect theories if they work). Science’s credit system *implies* truth via replication but doesn’t require it for priority (e.g., cold fusion).  

  **4. CRISPR Collision: Patent vs. Nobel Systems**  
  - **The Clash**:  
    - *Nobel*: Awarded for **conception** (2011 Charpentier-Doudna paper proposing CRISPR-Cas9 as programmable scissors).  
    - *Patent Interference*: Awarded based on **reduction to practice** (Zhang’s lab demonstrated eukaryotic cell editing first).  
  - **Which Rule Better?**  
    - Patent law (pre-AIA) prioritized the first to conceive *and* reduce diligently. Zhang won by proving earlier reduction.  
    - Nobel prioritized insight over utility.  
  - **US Shift to First-Inventor-to-File**:  
    - Kills interference, prioritizes filing date. Favors fast reduction + documentation over conception.  
    - **Implication**: Aligns patent law with publication-based scientific credit (first publisher wins). Deep conception without rapid reduction loses value.  

  ### Critical Deviations Flagged  
  1. **Discovery → Invention**: Patent law requires utility (§101); discovery of natural laws lacks this. Forced throughout.  
  2. **Credit → Monopoly**: Science allocates reputation; patents allocate exclusionary rights. Nobels have no §112 enablement requirement.  
  3. **Truth → Enablement**: Patent enablement (§112) demands reproducibility, not correctness. Scientific "truth" is irrelevant in translation.  

  ### Conclusion  
  Patent law’s framework **excels** at formalizing Merton’s inevitability thesis (obviousness voids priority) and arbitration mechanics (interference ≈ Royal Society panel). It **fails** for unpatentable discoveries, exposing science’s priority contests as credit battles over applications, not truth. The CRISPR clash reveals patent law’s bias toward reduction to practice—a bias intensified by first-to-file, which risks undervaluing conception. The residue? Patent categories clarify *how* credit is allocated but collapse when asked *why* it matters for truths nobody owns.
