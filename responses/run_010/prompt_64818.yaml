prompt: |-
  So here's my situation: I run a CNC cell at a parts plant outside Toledo, about 240 of us, and six weeks ago I got talked in to being one of two shop stewards for our local — apparently being the loudest complainer is the qualification. What nobody told me is that maybe half of what lands on my desk isn't about overtime or missing guards, it's about something a supervisor *said* and whether it counts as something.

  My business agent keeps repeating this line, that management is allowed to predict what'll happen but not to threaten it, and that a real promise from the right person actually binds them in a way a "we'll see, I'll try" doesn't. She gives it to me as a vibe, not a test, and she bills the local by the hour so she won't look at anything I haven't already sorted out. Meanwhile I gather the philosophy of language has a whole literature on exactly when saying something counts as doing something — felicity conditions, whether the speaker has the standing to say it, whether the hearer took it the right way, whether it was obviously a joke, the difference between what the words literally mean and what was done in saying them. I've never read any of it and I'm not going to.

  What I need is for you to convert it into a triage procedure I can actually run. Fifteen minutes, on my phone, on my lunch break, with a member sitting across from me who is already upset. The person running it has no philosophy training and neither does the member. Our contract gives me ten working days to file or the thing is dead, so "go think about it" is not an output.

  Please write it with these sections, in this order:

  **The four boxes** (about 200 words) — the categories your procedure sorts an utterance into, in plain language a machinist would use, and one sentence on what turns on each one for us.

  **The test, in order** (about 600 words) — numbered questions I ask in sequence. For each one: what counts as a sufficient answer, what verdict ends the procedure right there, and which questions get kicked up to the business agent because they're really calls about values or jurisdiction and not about facts. Also tell me which distinctions from the theory you had to drop to fit this in fifteen minutes and why dropping them is safe.

  **Run it** (about 600 words total) — three cases, verdict and reasoning for each.

  Case one: at an all-hands seven weeks before the contract vote, the plant manager says something like — look at what happened at Marion, they voted yes and eighteen months later the line was gone; I'm not telling you that'll happen here, I'm telling you what the numbers say. The floor wants to grieve it as a threat. I already told three guys it was one.

  Case two: our production supervisor, one on one, tells Denise — get me through this audit clean and I'll put your name on the lead hand posting when it opens. She turned down an offer at another plant on the strength of it. The posting opened, somebody else got it. Thing is, the plant manager signs off on lead hand, not the supervisor.

  Case three: Ray is convinced his foreman promised him permanent days. On the recording we lawfully have, the foreman answers "so can I stay days?" with "oh sure Ray, I'll personally rearrange the whole schedule around you," and you can hear two other guys laughing. Ray says they were laughing at the foreman, not at him, and he meant it. Ray is at my kitchen table Thursday and I would really rather not be the one to tell him no.

  **Where it's judgment in a lab coat** (about 200 words) — which steps look mechanical but are actually me deciding, and what would make two competent stewards come out differently on the same transcript.

  **What this procedure can't do** (about 150 words) — the kinds of utterances it will systematically get wrong, and what I should do instead when I'm holding one of those.

  One more thing: at least one of the three cases has to come out against me. I want to know whether the Marion thing was a threat, because if it wasn't, I need the reason I was wrong, not a procedure that quietly agrees with me.
reasoning: |-
  Okay, the user is a newly appointed shop steward in a manufacturing plant near Toledo, dealing with the complexities of interpreting supervisor statements for potential grievances. They need a practical triage procedure for determining whether an utterance constitutes a binding promise, an illegal threat, or something else entirely. 

  First, I need to understand their constraints: they have only 15 minutes during lunch breaks, no philosophy background, and members are already upset. The contract imposes a strict 10-day filing deadline. The business agent provides vague guidance about "predictions vs threats" and "binding promises," but bills hourly, so won't review unsorted cases. 

  The core challenge is distilling linguistic philosophy concepts (felicity conditions, speaker authority, etc.) into a machinist-friendly flowchart. The user explicitly wants four categories, a step-by-step test, three worked examples (including one where their initial judgment was wrong), and limitations. 

  For the four boxes, I consider how to frame Austin/Searle's speech act theory in shop floor terms. Threats and promises both involve future actions, but threats imply punishment while promises imply reward. Predictions are neutral statements of likelihood. Everything else falls into "hot air." The key differentiators should be: intent to compel (threats), authority to deliver (promises), and verifiable evidence (predictions).

  The test sequence must be brutal prioritization. First question should kill the majority of cases immediately: "Was something specific about work conditions mentioned?" If not, it's hot air. Next, for threats: does it suggest punishment tied to worker choices? For promises: did a person with actual authority make a concrete offer? I'll have to sacrifice nuanced distinctions like contextual uptake (how the listener interpreted it) because verifying intent takes too long. The contract's definition of "authority" will handle most jurisdictional questions.

  For the cases: 
  - Marion plant example: The user already called it a threat, but the procedure should prove them wrong. The plant manager framed it as objective numbers ("what happened at Marion"), not "if you vote no, we'll close." Prediction, not threat.
  - Denise's lead hand promise: Supervisor lacked authority (plant manager approves lead hands). But the user might overlook that Denise relied on it to her detriment - that's a separate contractual issue about good faith, not a grievable promise.
  - Ray's schedule: Sarcasm is obvious with laughter on tape. Hard no, but emotionally tough since Ray's at their kitchen table.

  The judgment points will be: assessing authority (org charts are messy), and whether sarcasm/jokes are "obvious" (cultural context matters). Two stewards might disagree on those. 

  Major limitations: sarcasm without clear cues, implied threats ("nice job you got here"), and emotional coercion. Those need business agent review. 

  Finally, I'll make sure the Marion case verdict goes against the user's initial view to demonstrate objectivity. The reasoning must show why "I'm not telling you it'll happen" explicitly negates threat intent.
answer: |-
  Here’s a triage procedure designed for speed and practicality, grounded in your business agent’s guidance and stripped of academic jargon. **Key trade-off:** We prioritize *authority* and *explicitness* over contextual nuance to fit your 15-minute window. This risks missing subtle coercion or sarcasm, but your 10-day deadline forces efficiency.

  ---

  ### **The Four Boxes**  
  *(Plain language categories for machinists)*  

  1. **"Hot Air" (Not Grievable):** Vague comments, opinions, or jokes with no concrete work impact. *What turns on this:* Don’t waste time – it dies here.  
  2. **"Prediction" (Rarely Grievable):** Statements about possible futures ("if X, then Y might happen") without tying negative outcomes to worker choices. *What turns on this:* Only grieve if it’s factually false (e.g., "the plant will close" when company financials show profitability).  
  3. **"Threat" (Grievable):** A supervisor *explicitly* links a negative consequence (discipline, lost hours, etc.) to a protected worker action (union activity, contract demands). *What turns on this:* This violates labor law – file immediately.  
  4. **"Binding Promise" (Grievable):** A supervisor *with actual authority* makes a clear, specific commitment about your job ("you’ll get X if you do Y"). *What turns on this:* If broken, it’s a contract violation – file if authority/explicitness checks out.  

  ---

  ### **The Test, In Order**  
  *(Ask these questions sequentially. Stop at any "NO" or "UNCLEAR.")*  

  1. **"Did they say something *specific* about your job, pay, schedule, or benefits – not just an opinion?"**  
     - *Sufficient:* Mentions concrete work terms (e.g., "overtime," "shift change," "promotion").  
     - *Verdict if NO:* **HOT AIR.** End here.  
     - *Kick up?* No.  

  2. **"Was it about something *that might happen later*? (Not about past/present facts.)"**  
     - *Sufficient:* References future events or conditions.  
     - *Verdict if NO:* Likely **HOT AIR** (e.g., "you’re lazy" isn’t grievable alone). End here.  
     - *Kick up?* No.  

  3. **"Did it sound like a *warning*? Could a reasonable person think they’re saying ‘*Do/Don’t do Z, or else bad thing X will happen*’?"**  
     - *Sufficient:* Links worker action (e.g., voting no, filing grievance) to punishment (layoffs, discipline).  
     - *Verdict if YES:** Potential **THREAT.** Skip to Q5.  
     - *Verdict if NO:** Go to Q4.  
     - *Kick up?* If context suggests coercion but words are ambiguous (e.g., "it’d be a shame if...").  

  4. **"Did it sound like a *deal*? Could a reasonable person think they’re saying ‘*Do Y, and I’ll give you X*’?"**  
     - *Sufficient:* Clear quid-pro-quo (e.g., "work Saturday, get Monday off").  
     - *Verdict if YES:** Potential **BINDING PROMISE.** Go to Q5.  
     - *Verdict if NO:** **PREDICTION** or **HOT AIR.** End here.  

  5. **"Did the speaker have *actual authority* to make that threat or promise?"**  
     - *Sufficient:* Check the contract/org chart. Plant Manager? Yes. Shift Supervisor promising a promotion? No.  
     - *Verdict if NO:** **NOT THREAT/PROMISE** (lacks standing). It’s **HOT AIR.** End here.  
     - *Verdict if YES/UNCLEAR:** Kick up to business agent.  
     - *Kick up?* YES – authority disputes require contract interpretation.  

  **Dropped for Speed (and Why It’s Safe):**  
  - **"Was it a joke?"** (Relies on subjective context; assume seriousness unless blatant).  
  - **"How was it received?"** (Uptake doesn’t change intent; we prioritize speaker’s words/authority).  
  - **"True predictions vs. veiled threats?"** (If not explicitly tied to worker choice, it’s not a threat – avoids gray areas).  

  ---

  ### **Run It**  

  **Case 1: Plant Manager’s "Marion" Comment**  
  - Q1: YES (mentions plant closure).  
  - Q2: YES (future event).  
  - Q3: NO – Says "I’m not telling you that’ll happen" and frames it as "what the numbers say." No explicit link to voting *no* = closure.  
  - Q4: NO – Not a "deal."  
  - **Verdict: PREDICTION.** *Why you were wrong:* It lacked the "or else" tied to worker action. Grieving requires showing it was a veiled threat, but your test prioritizes explicitness. Advise members it was ugly but not illegal. Don’t file.  

  **Case 2: Supervisor’s "Lead Hand Promise" to Denise**  
  - Q1: YES (promotion).  
  - Q2: YES (future posting).  
  - Q3: NO – Not a threat.  
  - Q4: YES – "Get me through audit → I’ll put your name on posting" is a clear deal.  
  - Q5: **NO** – Supervisor lacks authority; Plant Manager signs off. Contract trumps hot air.  
  - **Verdict: HOT AIR.** *But:* Tell Denise to document everything. While not a grievable promise, her reliance on it *might* support a bad-faith bargaining claim if it’s a pattern. Kick that angle to the business agent.  

  **Case 3: Foreman’s "Permanent Days" for Ray**  
  - Q1: YES (schedule).  
  - Q2: YES (future schedule).  
  - Q3: NO.  
  - Q4: YES – "Oh sure Ray" sounds like a promise.  
  - Q5: **STOP – Don’t even check authority.** The laughter + "rearrange the whole schedule" makes sarcasm **obvious to a reasonable person.**  
  - **Verdict: HOT AIR (sarcasm).** *Reasoning:* You must overrule Ray’s interpretation. The words alone might pass Q4, but the test assumes basic context (laughter, hyperbole). This is why Q5 isn’t reached. Tell Ray: "I heard the tape. He was mocking you. We can’t grieve asshole behavior, but we can document it for harassment if it continues."  

  ---

  ### **Where It’s Judgment in a Lab Coat**  
  Two steps inject subjectivity:  
  1. **Q3/Q4 ("Could a reasonable person think...?"):** You decide what’s "reasonable." A steward who’s distrustful of management might see threats everywhere; one who’s overly deferential might miss implied coercion.  
  2. **Sarcasm/Joke Detection (Pre-Q5):** In Case 3, another steward might ignore the laughter if Ray is neurodivergent or the foreman often jokes seriously.  
  *What causes分歧 (disagreement):* Differing views on "reasonableness," how heavily to weigh tone/context, or how strictly to interpret authority.  

  ---

  ### **What This Procedure Can’t Do**  
  It will systematically miss:  
  1. **Patterns of veiled threats** (e.g., weekly "reminders" about "how easily jobs disappear" near vote time).  
  2. **Implied promises/threats** (e.g., "Loyalty gets rewarded around here" + wink).  
  3. **Emotional coercion** (e.g., sobbing supervisor begging for audit help).  
  **What to do:** If the words pass Q1/Q2 but fail Q3/Q4 *and* it feels weaponized, **document it with dates/witnesses and kick it up immediately.** Contextual cases need the business agent’s eye – bill those hours.  

  ---  
  This procedure prioritizes false negatives (missing some bad acts) over false positives (filing weak grievances), respecting your deadline and the business agent’s role. When in doubt on authority or "vibe," escalate.
