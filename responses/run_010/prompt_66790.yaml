answer: |-
  I reject step (5) because analogical principles gain warrant through iterative testing against multiple independent lines of evidence in the target context, allowing the record to raise or lower their credibility.

  **Why (5) seemed plausible:** You assumed analogy functions as a static import from source to target, where the target's pattern only becomes evidence *after* applying the analogy. This overlooks that analogies are dynamic tools tested through *convergence* of material traces. When multiple independent patterns in the target context align with the analogy's predictions—or fail to—the analogy's warrant changes. Apparent disanalogies aren't automatically absorbed; they force revision if they systematically undermine the analogy's explanatory scope.

  **Pricing the alternatives:**  
  - **Give up (4):** Defenders must show general principles have empirical content. This requires demonstrating that specific mental states *necessitate* material expressions (e.g., ritual termination *always* produces non-random breakage + sealed deposition). But this risks determinism and ignores cultural variability.  
  - **Give up (5):** Defenders must treat analogies as testable hypotheses. They owe (a) multiple material predictions from the analogy (e.g., ritual termination predicts *both* selective breakage *and* absence of reuse traces), and (b) exclusion of taphonomic/discard explanations via negative evidence (e.g., demonstrating discard patterns differ statistically).  
  - **Give up (6):** Defenders must model filters independently. They owe (a) taphonomic experiments (e.g., breakage patterns under natural decay), (b) spatial analysis of finds vs. excavation boundaries, and (c) comparative data on discard practices.  
  - **Bite (8):** Defenders must deny you know your colleagues' beliefs. This imposes radical skepticism, rejecting behavioral consistency in meaning attribution. Archaeology collapses into solipsism.  

  **Why this distinguishes pit-formation from ritual meaning:**  
  Physical inferences (single episode, capping sequence) use bridging principles with *mechanistic constraints*. Stratigraphy links deposition to cause via sediment physics (water/sorting laws) and fracture mechanics (fresh breaks vs. weathering). These principles are testable through:  
  - **Replication:** Experimental archaeology simulates pit-filling/capping.  
  - **Convergence:** Micromorphology, particle size, and break orientation independently signal contemporaneity.  
  Mental inferences lack such constraints. "Ritual termination" relies on analogies (e.g., ethnographic parallels) that *could* explain the pattern—but so could "failed production discard" or "political protest." Without independent evidence (e.g., repeated context, associated symbols), the analogy remains *consistent* but not *necessitated*.  

  **Why this isn't arbitrary:** The warrant gap arises from causal specificity. Physical processes (decay, deposition) obey universal laws with predictable material signatures. Mental states express through culturally variable practices with no one-to-one material correlates. Thus, physical claims work when multiple signatures converge mechanistically; mental claims require stronger analogical testing via cross-contextual patterning. Your skepticism about ritual inference stands—but not because archaeology is globally unwarranted.
