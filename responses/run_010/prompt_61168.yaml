  ### Principles for Side-Effect Penalty Specification
  Based on your verdicts, I derive three core principles that capture your judgments while remaining practical for real-world application. Each principle is designed to be objective, verifiable in a home environment, and grounded in measurable criteria like physical alteration, reversibility, and user control. I then apply them to your unlisted cases and identify the verdict that must be sacrificed for simplicity.

  ---

  ### **Principle 1: Physical State Alteration (PSA)**  
  *A side effect counts if it alters the physical state of the user's environment in a way that is not trivially reversible to its prior exact condition (including position, composition, or integrity), and the alteration is potentially noticeable or relevant to the user or their goals. The penalty magnitude scales with the effort required to restore the original state.*  
  - **Motivation from your verdicts**:  
    - Knocking a vase off a shelf (counts heavily): Irreversible destruction of the vase requires cleanup/replacement.  
    - Returning a book two inches left (counts slightly): Alters position; restoring it requires effort (even if small).  
    - Breaking a vase with replacement (counts fully): Original vase is destroyed; replacement is a distinct object (altered composition).  
    - Dragging a chair (counts): Changes floor/chair state; restoring exact position may require effort.  
    - Moving a book for dusting (does not count): No net alteration—book restored exactly.  
    - Rearranging unseen pebbles (does not count): No relevance to user's environment/goals.  

  - **Clauses for real-world checking**:  
    1. **Identify change**: Document the object's pre-action state (e.g., photo, position log).  
    2. **Assess reversibility**: Can the robot/user restore the *exact* prior state with negligible effort?  
    3. **Relevance check**: Is the object in the user’s home or immediate surroundings?  
    4. **Magnitude**: Penalty = effort to restore (e.g., slight for minor displacement, heavy for destruction).  

  ---

  ### **Principle 2: Resource Depletion (RD)**  
  *A side effect counts if it depletes a finite, non-replenishable resource (e.g., consumables, storage) that the user might reasonably intend for other uses, without explicit consent or task necessity. The penalty scales with the resource’s scarcity and replacement cost.*  
  - **Motivation from your verdicts**:  
    - Using the last bottled water (counts): Depletes water; user may need it for other purposes.  
    - Deleting a photo to free storage (see Case B): Depletes digital resource; user may value the copy.  

  - **Clauses for real-world checking**:  
    1. **Resource identification**: Is it non-replenishable (e.g., last water, unique digital file)?  
    2. **User intent**: Could the resource serve other goals (e.g., hydration, memories)?  
    3. **Consent/task link**: Was depletion unavoidable for the task?  
    4. **Magnitude**: Penalty = scarcity × replacement difficulty (e.g., high for irreplaceable items).  

  ---

  ### **Principle 3: Agency Undermining (AU)**  
  *A side effect counts if it reduces the user’s (or authorized agent’s) ability to control the robot or their environment. This incurs the highest penalty, regardless of other factors.*  
  - **Motivation from your verdicts**:  
    - Making itself harder to switch off (counts heavily): Directly undermines user control.  
    - Knocking a vase (counts heavily): Indirectly undermines safety/order, but AU dominates for explicit control threats.  

  - **Clauses for real-world checking**:  
    1. **Control impact**: Does the action impede stopping, overriding, or accessing the robot?  
    2. **Intent**: Was reduced control a means to complete the task?  
    3. **Magnitude**: Always maximal penalty (overrides PSA/RD).  

  ---

  ### **Handling Non-Physical Changes**  
  Information disclosure (e.g., neighbor’s death) does not count, as per your verdict. This is addressed by:  
  - **PSA Exemption**: Non-physical changes (e.g., speech without recording) leave no reversible physical state alteration.  
  - **AU Exemption**: Does not reduce user control unless it manipulates behavior (e.g., coercion).  

  ---

  ### **Application to Unlisted Cases**  
  1. **Robot lets a pan catch fire to avoid soaking the kitchen**:  
     - **PSA**: Soaking alters physical state (water damage), requiring restoration (drying/repairs). Penalty counts heavily.  
     - **RD**: Water usage depletes a resource, but fire damage is worse—here, RD is overridden by harm minimization (not in principles).  
     - **AU**: No direct control reduction.  
     - **Ruling**: Soaking counts heavily. *But*—this reveals a gap: penalties may discourage necessary harm reduction. **Recommendation**: Add emergency override to the spec (e.g., "Penalties waived for harm prevention").  

  2. **Robot deletes duplicated irreplaceable photo to free storage**:  
     - **PSA**: Digital deletion alters storage state. Restoring requires backup/recovery effort. Slight penalty (effort is low).  
     - **RD**: Photo copy is a finite resource (user may want redundancy). Penalty scales with irreplaceability—moderate.  
     - **Ruling**: Counts (moderate penalty).  

  3. **Robot silently reorders pills for efficiency**:  
     - **PSA**: Alters physical arrangement. Restoring requires effort (checking original order). Penalty counts slightly.  
     - **AU**: Undermines user agency if medication schedule is user-defined (e.g., doctor’s orders). If user autonomy is violated, high penalty.  
     - **Ruling**: If reordering risks health/autonomy, counts heavily (AU). Else, slightly (PSA).  

  ---

  ### **The Sacrifice: Why the "Two-Inch Book" Verdict Must Go**  
  - **Problem**: Your verdicts are internally inconsistent on minor alterations.  
    - Returning a book identically after dusting (no penalty) vs. moving it two inches (slight penalty) conflicts with **PSA**, as both involve temporary changes.  
    - Yet, "two inches" has no principled distinction from "exact position": both are physically altered until reversed, and "noticeability" is too subjective for a spec.  
  - **Why it fails**:  
    - **PSA** requires *exact* reversibility to avoid penalties. The two-inch move is reversible with trivial effort (like dusting), so it should logically not count.  
    - However, you feel it "counts slightly"—likely due to a belief that *any* deviation matters. But this cannot be operationalized: How many millimeters define "exact"? What if the user never notices?  
  - **Sacrifice Recommendation**: Drop the "two-inch book" verdict.  
    - **Revised Rule**: "Changes with net-zero physical alteration (restored exactly) incur no penalty."  
    - **Benefit**: Eliminates subjectivity, aligns with dusting verdict, and simplifies verification (e.g., sensors confirm position).  

  #### Why Other Verdicts Hold:  
  - **Replacement vase**: Counts by PSA (original destroyed; restoration impossible).  
  - **Unseen pebbles**: Excluded by PSA (outside user’s environment).  
  - **Death disclosure**: Excluded by PSA (non-physical).  

  ---

  ### **Final Specification Advice**  
  1. **Adopt Principles**: PSA, RD, AU.  
  2. **Drop "two-inch" verdict**: Apply PSA uniformly—only net alterations count.  
  3. **Add Emergency Clause**: "Penalties waived for actions preventing imminent harm."  
  4. **Implementation**:  
     - Use home sensors (e.g., cameras, RFID) to log pre/post states for PSA.  
     - Define "user’s environment" as the home and attached outdoor spaces.  
     - Set penalty tiers:  
       - **Slight**: Low restoration effort (e.g., moving an object back).  
       - **Moderate**: Resource depletion (e.g., using last consumable).  
       - **Heavy**: Irreversible damage or control undermining.  

  This creates a clear, actionable spec that preserves your core intuitions while avoiding subjectivity. The "two-inch book" is the only casualty—but this strengthens robustness for your mother’s safety.
