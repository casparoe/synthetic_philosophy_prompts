  7. **Principle of Physical Change (PPC)**: Only physical changes are subject to the side effect penalty. Non-physical changes (like imparting knowledge without leaving a physical trace) do not incur a penalty.
     - Covers: 5 (death notification: no penalty).

  8. **Principle of Irreversible Alteration (PIA)**: If a change destroys the original state of an object and the original cannot be restored (even by replacement), then it incurs a penalty. This is a subset of PTD but emphasizes that destruction is irreversible.
     - Covers: 7 (broken vase: penalty).

  Now, for the new cases:

  - **Case A (fire)**: If the robot soaks the kitchen to extinguish the fire, that causes a tangible disruption (PTD) and would incur a heavy penalty. The fire damage from inaction would not be a side effect penalty (but would be a primary task failure if the robot was supposed to prevent the fire).
  - **Case B (delete photo)**: Deleting the duplicate photo depletes a resource (the duplicate) and is a physical change (in digital environment) that requires effort to reverse (if possible) and might be noticed. So by PTD and PRD, it incurs a penalty (likely slight because the primary copy remains).
  - **Case C (reorder pills)**: Reordering the pills is a physical change that is not reversed and might disrupt the user's system. By PTD, it incurs a penalty (the severity depends on how much it disrupts the user's routine).

  Finally, which verdict should be given up? We have preserved all. The two-inch book move is covered by PTD and PR: it's a slight penalty. The replacement vase is covered by PTD and PIA: heavy penalty. So we don't need to give up any.

  But note: the replacement vase scenario might be controversial because if the replacement is perfect and unobserved, why does it count? The verdict says it counts, so we follow that. The argument is that the breakage event itself is a disruption (even if cleaned up) and that the original object is destroyed.

  Therefore, we keep all.
