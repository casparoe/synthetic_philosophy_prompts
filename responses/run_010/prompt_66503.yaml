  First, I need to unpack their scenarios. They range from historical quotes and fictional dialogue to conditional statements and reappropriation. Key conflicts: case 6 (actor joking at a party) feels wrong despite consent, while case 11 (conditional) feels worst even without direct assertion. Their working principle fails because it predicts 6 and 11 should be fine, but they're not.

  The user's deeper needs: They likely want a theoretical framework that systematizes their intuitions without ad-hoc patches, possibly for dissertation relevance or personal clarity. They might also be seeking justification to maintain certain strong intuitions (like condemning case 11) while adjusting others. The mention of "squeamishness dressed up as data" suggests they're wary of biases affecting their judgments.

  I recall frameworks like presupposition accommodation (Potts), expressive content (Kaplan), and licensing/normalization (Camp, Nunberg). The core tension seems to be between semantic content (e.g., expressives triggering in conditionals) and pragmatic effects (e.g., downstream normalization). Case 11 is critical—it breaks standard expressive accounts because the slur's derogation feels active despite being unasserted. This points to presupposition failure or accommodation pressure.

  For a principle, I should start with a baseline prohibition modified by exceptions. The baseline could be: using a slur manifests its derogatory force. Exceptions include historical/fictional mention (cases 1-3), reappropriation (7), and pedagogical contexts (9). Case 4 (free indirect discourse) fails because it lacks clear attribution, making the derogation ambient. Case 6 (joke among actors) fails because the jocular context doesn't neutralize the slur's core harm. Case 10 (out-group use) is impermissible because the speaker's identity reactivates the slur's oppressive history. Case 11 (conditional) might involve accommodation—the listener must accept the derogatory presupposition to process the statement.

  The user's judgment on case 8 (overhearer misuse) suggests they reject speaker responsibility for others' misinterpretations. This implies the principle shouldn't focus on consequences but on the speech act itself. However, case 6 contradicts this, so perhaps the key is whether the context genuinely neutralizes the derogation (e.g., historical mention) or superficially masks it (e.g., joking).

  For museum/translation cases: a museum label could be acceptable as pedagogical mention, while translation requires weighing fidelity against harm, possibly opting for bracketed explanations. The principle might be a stack: (1) default prohibition, (2) exceptions for citation/attribution, (3) reappropriation rights, (4) speaker-group sensitivity, with (1) overriding when conflicts arise. Case 10 fails because the out-group status defeats the pedagogical exception.

  Weak spots: Case 12 ("he's not a slur...") is tricky—does redirecting the slur void its harm? The user flips here, suggesting it straddles reappropriation and normalization. Case 4 vs. 11: if both involve unattributed derogation, why different verdicts? Maybe fictional narration feels contained, while conditionals implicate the speaker's assumptions. If evidence showed that conditionals don't increase derogatory attitudes, I'd need to drop the accommodation argument for 11.
answer: |-
  Here's a principled framework that captures most of your intuitions, grounded in **semantic accommodation + speaker responsibility + structural oppression dynamics**. It prioritizes *how linguistic acts shape social reality* rather than just immediate harm or speaker intent. After stating the core principle and exceptions, I'll analyze your cases, flag revisions, test new cases, and identify weaknesses.

  ### Core Principle (Baseline Prohibition)
  **Producing a slur is impermissible *unless* the context *reliably blocks* the accommodation of its derogatory presupposition into the conversational common ground.**

  ### Key Mechanisms
  1.  **Accommodation Pressure:** Slurs carry a presupposition of the target group's inferiority/subhumanity. Uttering one pressures listeners to accommodate this presupposition to process the utterance (cf. Potts, Camp). This is *always* the default force.
  2.  **Blocking Accommodation:** Accommodation is blocked only if the context provides *overwhelmingly salient, conventionalized signals* that the speaker rejects the presupposition *and* the utterance type itself suspends its normal force.
  3.  **Speaker Positionality:** The efficacy of blocking signals depends partly on the speaker's social position vis-à-vis the target group (reflecting power dynamics of oppression/reappropriation).
  4.  **Downstream Risk:** Contexts where blocking is fragile or easily misconstrued increase impermissibility, even if accommodation is blocked for the immediate audience.

  ### Exception Clauses (Priority Order)
  Accommodation blocking *must* satisfy **ALL** applicable clauses:

  1.  **Attribution/Quotation Clause:** The derogatory presupposition is explicitly attributed to another agent (real or fictional) via robust syntactic/semantic markers (quotation marks, reporting verbs, clear fictional framing). *(Highest Priority)*
  2.  **Metalinguistic/Technical Clause:** The word itself is the object of discussion (philosophy, lexicography, history), *and* the discourse context explicitly frames it as such (e.g., "the word 'X'", seminar norms).
  3.  **Reappropriation Clause:** The speaker is a member of the target group, *and* the context signals in-group solidarity/defiance (not mere descriptiveness). *(Requires speaker identity)*
  4.  **Minimal Risk Clause:** The context ensures negligible risk of the utterance being misinterpreted as endorsing the presupposition or licensing downstream derogatory use *by anyone*. *(Functions as a defeater for the other clauses)*

  ### Application to Your Cases
  *   **1. Historian's Quote (Fine):** Satisfies Clause 1 (robust attribution via quotes + reporting context) and Clause 2 (metalinguistic/historical purpose).
  *   **2. Historian's Paraphrase (Worse but Fine):** Satisfies Clause 1 (clear reporting context = attribution) but *weakly*. Lack of quotes reduces robustness, increasing accommodation pressure slightly (explains your "noticeably worse").
  *   **3. Bigot Character Dialogue (Fine):** Satisfies Clause 1 (robust fictional attribution via dialogue framing).
  *   **4. Free Indirect Narration (Not Fine):** **Verdict Overturned?** Fails Clause 1. FID blurs speaker/narrator/character attitudes. No robust signal blocks accommodation of the presupposition into the *narrative* common ground. Your intuition likely tracks the lack of a reliable blocking mechanism. (More on this vs. #11 below).
  *   **5. Actor On Stage (Fine):** Satisfies Clause 1 (robust theatrical framing = attribution to character). Clause 4 holds (audience understands fiction).
  *   **6. Actor Joke at Party (Not Fine):** Fails ALL clauses. Clause 1 fails (no attribution to another). Clause 2 fails (not metalinguistic). Clause 3 fails (speaker not in-group). Clause 4 fails catastrophically: "joking" context *increases* risk of misinterpretation/misuse downstream; consent is irrelevant to presupposition accommodation pressure and downstream risk.
  *   **7. In-group Affectionate Use (Fine):** Satisfies Clause 3 (reappropriation, in-group context).
  *   **8. Bigot Overhears In-group Use (Fine):** Satisfies Clause 3. Clause 4 *does not apply negatively here*: The speaker's act *itself* reliably blocks accommodation *for its intended context* (in-group solidarity). The bigot's misinterpretation is the bigot's fault/responsibility, not a failure of the blocking mechanism *in the original utterance*. Downstream risk is inherent but doesn't negate the permissibility of the core reappropriative act. (Contrasts with #6 where the utterance *itself* lacks blocking).
  *   **9. In-group Seminar Use (Fine):** Satisfies Clause 2 (metalinguistic/philosophical context) and Clause 3 (in-group speakers). Clause 4 likely holds (controlled environment).
  *   **10. Out-group Seminar Use (Not Fine/Permissible but Shouldn't):** **Satisfies Clause 2 BUT fails Clause 4.** Metalinguistic context provides *some* blocking, but the out-group speaker's position makes the blocking *fragile*. Accommodation pressure is higher (historical power dynamics reactivate), and downstream risk (even within seminar) increases. Explicit permission doesn't erase this; it mitigates but doesn't eliminate the inherent instability of the blocking for an out-group speaker. Your "flinching" is justified. *Impermissible* if we prioritize Clause 4 strictly; *highly problematic/permissible only under duress* if Clause 2 is given weight.
  *   **11. Conditional Antecedent ("If that [slur]...") (Worst):** **Fails ALL clauses catastrophically.** This is the *paradigm case* of accommodation pressure. The slur *must* be accommodated for the conditional to be interpretable – the listener *must* temporarily accept the derogatory presupposition to assess the truth conditions. No attribution, not metalinguistic, speaker not in-group. Massive downstream risk: embeds the slur in a *descriptive* structure, normalizing its use "hypothetically." Your strong intuition is correct and core to the principle.
  *   **12. "He's not a [slur], he's just an idiot" (Unclear):** **Fails Clause 4 (Minimal Risk).** Attempts Clause 2 (metalinguistic-ish) but weakly. While intending to "pry away," it *still requires accommodating the slur's presupposition* to understand the contrast ("idiot" is bad, "[slur]" is worse/bad in a different way). High risk of reinforcing the slur's core derogatory force or licensing its use for "deserving" targets. Your flipping is understandable; it's unstable. The principle leans towards *not fine* due to high accommodation pressure and risk.

  ### Analysis of Revisions & Priority
  *   **Overturned Verdict:** #4 (Free Indirect Discourse) is deemed **not fine** by the principle. Your intuition of "something wrong" is vindicated; the principle makes it explicit. The lack of robust blocking signals is critical.
  *   **Preserved Core:** #11 (Conditional) is correctly identified as worst. #6 (Joke) and #10 (Out-group seminar) are impermissible for linked but distinct reasons (utterance lacks blocking vs. blocking is fragile).
  *   **Priority Order Explained:** Clause 1 (Attribution) is highest because it's the most reliable, conventionalized blocker. Clause 4 (Minimal Risk) acts as a defeater – if a context satisfying Clauses 1-3 *still* carries high risk (e.g., broadcasting historical slurs widely without context), it can render the utterance impermissible. Clause 3 (Reappropriation) requires identity because only in-group use can reliably repurpose the term *without* reactivating oppressive history in the same way.

  ### New Cases
  *   **Museum Wall Label (Exhibit about the word):** **Likely Fine.** Satisfies Clause 2 (explicit metalinguistic/educational context) robustly. Clause 4 likely holds (museum context signals non-endorsement, controlled presentation). Accommodation pressure is actively countered by the exhibit's purpose.
  *   **Translation of Older Novel:** **Highly Contextual.** *Goal:* Faithfulness vs. Harm Reduction.
      *   *If using the slur:* Must satisfy Clause 1 (fictional attribution) robustly. Needs a translator's note explaining the choice and condemning the term (strengthening blocking, addressing Clause 4).
      *   *If using a softened term:* May misrepresent force but avoids accommodation pressure. Might be preferable if the original's force is deemed unrecoverable without undue harm.
      *   *Best (if possible):* Use the original term *with* robust framing (Clause 1 + Clause 2 via notes/context) to satisfy fidelity *and* blocking. Principle prioritizes blocking accommodation; a translation causing high accommodation pressure (e.g., no context, modern audience) would be impermissible even if "faithful."

  ### Weak Spots & Defense
  1.  **#4 (FID) vs. #11 (Conditional): Same Phenomenon?** A critic might argue both involve unattributed presupposition accommodation. The principle *partially* agrees – both fail reliable blocking. However, the *degree* differs. FID often retains *some* distancing via narrative context (even if blurry). Conditionals *demand* accommodation for comprehension in a way descriptive fiction doesn't. Your verdict split isn't *just* squeamishness; it tracks the *intensity* of the accommodation pressure. Conditionals force the listener to *use* the presupposition logically. FID asks them to *entertain* it imaginatively. The principle captures this by making #11 fail *all* blocking mechanisms catastrophically, while #4 might weakly hint at attribution but fails to robustly satisfy Clause 1. **I'd abandon the principle if empirical evidence showed accommodation pressure in descriptive FID was consistently *stronger* than or *equivalent* to conditional antecedents in triggering derogatory associations/normalization.**
  2.  **Most Likely Breakpoint:** **Clause 4 (Minimal Risk)** is the most subjective and context-dependent element. Determining "negligible risk" is fraught. Does #8 *really* satisfy Clause 4? What about virally shared in-group speech? This clause risks being ad-hoc. **Evidence that would break it:** Rigorous studies showing downstream harm from utterances satisfying Clauses 1-3 (e.g., historian's paraphrase #2 demonstrably increases bigoted attitudes in readers despite context) *without* showing equivalent harm from *not* using the term in those contexts. Or evidence that presupposition accommodation in linguistics doesn't function as described for slurs.
  3.  **#12 ("He's not a slur..."):** This remains the trickiest for the principle. It strains Clause 2 and definitively fails Clause 4. The principle suggests it's impermissible due to unavoidable accommodation and high risk. Your flipping suggests the attempted redirection *might* sometimes work as a weak form of reappropriation/metalinguistics, but the principle's emphasis on reliable blocking and minimal risk makes it skeptical.
  4.  **Speaker Responsibility vs. Overhearer Misuse (#8):** The principle absolves the in-group speaker in #8 because their utterance *satisfies the blocking clauses*. The bigot's misuse stems from the bigot's pre-existing attitudes, not a failure of the original utterance's context. Contrast with #6 and #10, where the utterance *itself* lacks or has fragile blocking, *inviting* misuse.

  **In essence:** Your intuitions largely reflect a sophisticated grasp of how slurs *do* things in discourse beyond simple assertion – they impose presuppositions. The principle systematizes this by focusing on whether contexts *reliably prevent listeners from having to accept (even temporarily) the derogatory presupposition*, while accounting for power dynamics and downstream consequences. It overturns #4 (FID) as lacking sufficient blocking, preserves your strong rejection of #6, #10, and especially #11, and explains the nuances elsewhere. Its strength is grounding permissibility in the *linguistic mechanics of harm* (accommodation) + *social reality* (reappropriation, positionality, risk). Its weakness lies in operationalizing "reliable blocking" and "minimal risk," especially at the margins.
