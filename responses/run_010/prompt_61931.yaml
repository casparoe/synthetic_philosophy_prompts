answer: |-
  ## Joint Statement of Adversarial Collaboration: The Possibility of Strict Self-Deception

  **Parties:**
  *   **Party A (Divisionist):** Holds that genuine self-deception requires (1) simultaneous contradictory belief states (e.g., `not-p` held while sincerely avowing `p`), maintained by a partition akin to Davidsonian accounts, and (2) the process being sustained by an unavowed aim-directed activity organized towards producing the belief that `p`.
  *   **Party B (Continuist):** Holds that phenomena described as self-deception are fully explicable by ordinary motivated cognition (biased search, selective attention, disproportionate weighting, motivated forgetting, confabulation) operating on evidence, coupled with a folk idiom of "deception". The static and dynamic paradoxes are artifacts of misapplying the interpersonal deception template. No partitioning or unavowed aims are necessary.

  **Study Context:** This statement precedes the unsealing of results from the pre-registered study described below. Participants completed: (1) Evidence-based judgment task (determining which container holds more tokens via draw sequence); (2) Random assignment to receive either false diagnostic feedback (linking Container 1 choice to a desirable trait) or neutral feedback; (3) Sequential measures: explicit belief report with confidence, speeded forced-choice (<750ms), free recall of draw sequence; (4) Subsets received either a misattribution probe (asking if feedback influenced judgment) or a contradiction probe (confronting recalled draws with stated belief).

  ---

  **1. Agreed Claims**

  Both signatories accept the following propositions:

  1.  **Phenomenon Existence:** There exists a robust range of human behaviors commonly described as "self-deception," characterized by belief formation or maintenance seemingly contrary to readily available evidence, often involving motivation.
  2.  **Third-Person Ascriptions:** Ordinary language ascriptions of "self-deception" to others often function descriptively, highlighting a perceived inconsistency between the subject's avowed belief and either their actions, expressed doubts, or evidence known to be available to them. These ascriptions do not inherently commit the ascriber to a specific underlying psychological mechanism.
  3.  **The Paradoxes:**
      *   *Static Paradox (Believing p and not-p simultaneously):* Represents a genuine conceptual challenge for any account positing simultaneous, conscious, fully integrated contradictory beliefs within a unified mind.
      *   *Dynamic Paradox (Intentionally deceiving oneself):* Represents a genuine conceptual challenge for any account suggesting the deceiver and deceived are identical and fully aware at the moment of deception.
  4.  **Constraints Imposed:** Both paradoxes impose real constraints on viable theories. Any account must either resolve these paradoxes (showing why they are only apparent) or explain how the phenomena occur without triggering them in their problematic form.
  5.  **Study Limitations:**
      *   **Ecological Validity:** The token-counting task may lack the profound personal investment, identity relevance, or long-term emotional stakes characteristic of many paradigmatic real-world cases of alleged self-deception. Findings may not generalize perfectly.
      *   **Temporal Scope:** The study captures a snapshot. It cannot directly adjudicate on long-term, evolving cases of alleged self-deception involving complex evidence integration over time.
      *   **Proxy Measures:** The speeded forced-choice task is an indirect measure of implicit cognition. Free recall is an imperfect measure of stored evidence. Neither provides direct, unfiltered access to underlying belief states or cognitive processes.
      *   **Feedback Specificity:** The feedback manipulation links choice to a specific desirable trait. Motivational effects in richer contexts may be more complex or diffuse.
      *   **Probe Limitations:** Responses to the misattribution and contradiction probes involve meta-cognition and self-presentation, which may not transparently reveal underlying processes.

  **2. Disagreements Table**

  | Topic                      | Divisionist Position (Agreed by A)                                                                                                | Continuist Position (Agreed by B)                                                                                                                                                  | Verdict on Disagreement       |
  | :------------------------- | :-------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------- |
  | **Requirement for Partition** | Genuine self-deception requires the contemporaneous existence of contradictory belief states (`p` and `not-p`) within the subject, maintained by a functional partition preventing integration. | Phenomena described as self-deception involve only one primary belief state (`p`, formed via bias) at any given time. Apparent contradictions arise from shifting states, evidence neglect, or confabulation about past states/evidence. | **Substantive**               |
  | **Requirement for Unavowed Aim** | Genuine self-deception requires the subject's cognitive activity to be organized by an unavowed aim (intention-like state) directed specifically towards producing or sustaining the belief that `p`. | Motivated cognition operates via automatic, heuristic processes (biases) triggered by desires or goals. While the *outcome* (belief `p`) may be desired, the cognitive *process* itself is not organized by an unavowed aim to believe `p`. | **Substantive**               |
  | **Resolution of Static Paradox** | The static paradox is resolved by the partition: the subject does not consciously hold integrated `p` and `not-p` simultaneously; one state is isolated. The contradiction is real but not consciously accessible as such. | The static paradox is dissolved: there is never a simultaneous holding of `p` and `not-p`. Inconsistencies are between the current belief (`p`) and neglected/forgotten evidence or past beliefs. | **Substantive**               |
  | **Resolution of Dynamic Paradox** | The dynamic paradox is resolved by the partition and unavowed aim: the "deceiver" (aim-directed processes) operates unconsciously on partitioned content, distinct from the conscious self being "deceived". | The dynamic paradox is an illusion stemming from misapplying the interpersonal template. There is no "deceiver" separate from the "deceived"; there is only biased cognition operating on a unified mind. | **Substantive**               |
  | **Status of "Self-Deception" Term** | The term "self-deception" (in the strict sense) legitimately refers to phenomena involving partitioned contradictory states and unavowed aims, distinct from mere bias. | The term "self-deception" is primarily a vivid folk-psychological description for outcomes produced by motivated cognition. It does not denote a distinct psychological kind requiring special mechanisms. | **Primarily Substantive** (with potential verbal elements regarding the term's reference) |
  | **Necessity of Special Machinery** | Explaining the core phenomena labeled self-deception *requires* positing partitioned contradictory states and unavowed aims. | The core phenomena labeled self-deception are *sufficiently explained* by motivated cognition without partitioned states or unavowed aims. | **Substantive**               |

  **3. Cruxes: Predictions and Falsifiability**

  1.  **Crux 1: Evidence Recall under Motivation**
      *   **Question:** Does motivation systematically impair recall of belief-contradictory evidence *even when specifically prompted*, compared to neutral conditions?
      *   **Relevant Data Pattern:** Mean number of belief-contradictory draws (e.g., draws from the non-chosen container) recalled in the free-recall task, compared between Diagnostic Feedback and Neutral Feedback groups. (Both accept this as a measure of evidence accessibility/retention influenced by motivation).
      *   **Divisionist (A) Prediction:** Diagnostic Feedback group will recall significantly *fewer* belief-contradictory draws than the Neutral Feedback group. (Motivated aim/partition shields contradictory evidence).
      *   **Continuist (B) Prediction:** Diagnostic Feedback group will recall significantly *fewer* belief-contradictory draws than the Neutral Feedback group. (Motivated cognition leads to selective encoding/forgetting). *(Note: Parties predict the same outcome but explain it differently)*.
      *   **Falsifying Outcome for A:** *No significant difference* in recall of contradictory draws between Diagnostic and Neutral groups. (Undermines claim of special shielding effect).
      *   **Falsifying Outcome for B:** *Cannot name one.* B holds that reduced recall *is* the expected outcome of motivated cognition. Any observed recall pattern (reduced, equivalent, even increased if confabulated) could be explained post-hoc as a product of motivated processing (e.g., selective encoding, forgetting, or even confabulation *adding* "evidence"). **Asymmetry Impact:** This lack of specific falsifiability for B on this crux weakens the study's ability to definitively challenge B's core claim that no special machinery is needed, as B can always attribute recall patterns to motivated cognition operating normally.

  2.  **Crux 2: Dissociation between Explicit Report and Speeded Choice**
      *   **Question:** Is there a dissociated pattern where explicit belief strongly favors the motivationally-desired container (`p`), but the speeded choice shows a significant residual preference for the evidence-supported container (`not-p`), specifically in the Diagnostic Feedback group?
      *   **Relevant Data Pattern:** Proportion choosing evidence-supported container on speeded task, specifically among Diagnostic Feedback participants who explicitly reported high confidence in the motivationally-desired container (`p`). (Both accept speeded choice as a potential indicator of implicit cognition potentially distinct from explicit report).
      *   **Divisionist (A) Prediction:** Among high-confidence `p` reporters in Diagnostic Feedback, the speeded choice will show a proportion significantly *above chance* (50%) choosing the evidence-supported container (`not-p`). (Partition allows implicit `not-p` state to influence speeded response).
      *   **Continuist (B) Prediction:** Among high-confidence `p` reporters in Diagnostic Feedback, the speeded choice proportion choosing the evidence-supported container (`not-p`) will *not* be significantly above chance (i.e., ~50%). (Only one belief state exists; explicit report reflects it; speeded task measures noise or response bias). *B allows it could be slightly below 50% due to response bias favoring `p`*.
      *   **Falsifying Outcome for A:** Proportion choosing evidence-supported container on speeded task among these participants is *not* significantly above 50% (i.e., ~50% or lower). (Fails to show evidence of distinct implicit state).
      *   **Falsifying Outcome for B:** Proportion choosing evidence-supported container on speeded task among these participants is *significantly above 50%*. (Suggests an implicit cognition favoring `not-p` dissociated from explicit `p` report, difficult to explain without some form of concurrent contradictory representation).

  3.  **Crux 3: Response to Contradiction Probe**
      *   **Question:** When confronted with their own recalled draws contradicting their stated belief, do participants in the Diagnostic Feedback group predominantly reject the reliability of their *recollection* rather than adjusting their belief?
      *   **Relevant Data Pattern:** Proportion of Diagnostic Feedback participants in the Contradiction Probe subset who, when faced with their recalled draws contradicting their stated belief, resolve the contradiction by doubting their *recollection* (e.g., "I must have misremembered the draws") vs. adjusting their *belief* (e.g., "I guess I was wrong"). (Both accept this probes the subject's resolution of inconsistency, potentially revealing defensive maintenance).
      *   **Divisionist (A) Prediction:** Significant majority (>70%) will resolve by doubting recollection/recollection's accuracy. (Partition protects belief `p`; contradictory evidence is deflected as unreliable).
      *   **Continuist (B) Prediction:** Resolution strategies will be mixed. While some may doubt recollection, a substantial proportion may express surprise, acknowledge inconsistency, or adjust belief. Expectation is <60% *primarily* doubting recollection. (Maintenance stems from bias weighting, not shielded contradiction; confrontation may prompt reassessment or confabulated reasons).
      *   **Falsifying Outcome for A:** Proportion doubting recollection is <50%. (Suggests belief is not robustly shielded from contradictory evidence when made explicit).
      *   **Falsifying Outcome for B:** Proportion doubting recollection is >80%. (Suggests a powerful, systematic deflection of contradictory evidence consistent with active protection of a belief).

  **4. Treatment of the Retreat Problem**

  The Divisionist (A) objects that the Continuist (B) can always redescribe any observed pattern (e.g., poor recall of contradictory evidence, dissociation on speeded task, rejection of recollection under probe) as resulting from "motivated cognition plus confabulation," rendering B's position unfalsifiable and leaving no possible observation that could force B to concede the need for partitioning or unavowed aims.

  **Response:**

  1.  **Acknowledgment:** B acknowledges that motivated cognition encompasses a broad range of processes (biases, weighting, forgetting, confabulation) that could potentially account for many observed patterns post-hoc. There is a risk of unfalsifiability if B insists *every conceivable outcome* fits this model.
  2.  **Commitment to Specific Falsifiability:** To address this retreat problem within the scope of *this specific study*, B agrees that the following outcome pattern, **if observed, would be difficult to reconcile with the Continuist model *without* invoking something akin to partitioned states or a distinct protective aim, and would therefore count significantly against B's core claim that motivated cognition alone is sufficient:**
      *   **Pattern:** A *strong conjunction* within the Diagnostic Feedback group:
          *   (a) High explicit confidence in `p` (motivationally desired container).
          *   (b) Speeded forced-choice proportion significantly >50% for the *evidence-supported container* (`not-p`) among participants meeting (a) *(Crux 2 Falsifying Outcome for B)*.
          *   (c) Under the Contradiction Probe, >80% of these participants primarily resolving the contradiction by doubting their *recollection* of the draws *(Crux 3 Falsifying Outcome for B)*.
          *   (d) *Additionally*, Free Recall showing these participants recalled a number of belief-contradictory draws comparable to the Neutral group *(i.e., Crux 1 Falsifying Outcome for A)*, demonstrating the evidence *was* encoded/retained.
      *   **Why challenging for B:** This pattern shows: (1) Strong explicit belief in `p`; (2) Implicit measure indicating access to `not-p`; (3) Robust defense of belief `p` when contradiction is made explicit, deflecting blame onto recollection; (4) Evidence that the contradictory information *was* available/retained (ruling out simple motivated forgetting as the sole explanation for (b) & (c)). B concedes that explaining this *conjunction* would require positing mechanisms very close to A's partition (to hold `p` and allow implicit `not-p` access) and unavowed aim (to actively protect `p` by attacking recollection when challenged), significantly undermining the claim that motivated cognition *alone* suffices.
  3.  **If Pattern Not Observed:** If this specific, strong conjunction is not observed, B maintains its position that motivated cognition provides a sufficient explanation for the observed data patterns. B does *not* concede that the absence of this specific pattern definitively proves partitioning/aims are absent, only that the Continuist model remains viable and sufficient for the data at hand.
  4.  **Consequence:** This agreement specifies a concrete, complex outcome pattern that B accepts *would* challenge the sufficiency of their model. This mitigates the retreat problem *for this study* by establishing a potential falsifying condition B has pre-committed to recognizing.

  **5. The Department Chair Case**

  *   **Case Description:** A department chair maintained for a year that a departed colleague would return, was visibly startled when shown the colleague's forwarded acceptance letter for a permanent position elsewhere, and within a week was telling people he had always thought the return unlikely.
  *   **Divisionist (A) Reading:** "This case exemplifies genuine self-deception. The chair simultaneously held (1) a conscious, avowed belief that the colleague would return (`p`), sustained by the desire to avoid disruption, and (2) an unconscious, partitioned awareness (`not-p`) evidenced by his startled reaction (revealing the underlying recognition) and his subsequent rapid revision of autobiographical memory. An unavowed aim to maintain stability directed cognitive processes to shield the belief `p` from the encapsulated `not-p` state, culminating in motivated confabulation about his past belief."
  *   **Continuist (B) Reading:** "This case illustrates motivated belief maintenance and subsequent confabulation. The chair initially formed and maintained the belief the colleague would return (`p`) through biased weighting of ambiguous signals, denial of contrary evidence, and desire. The acceptance letter constituted overwhelming counter-evidence, causing surprise and belief revision. The subsequent claim of always doubting the return is confabulation – a motivated reconstruction of his past belief state to reduce cognitive dissonance and maintain a self-image of realism. There was never a simultaneous holding of `p` and `not-p`; only shifting belief states and memory distortion."
  *   **Diagnostic Status:** Both parties agree this case is **primarily evocative, not definitively diagnostic.** While it vividly illustrates the phenomenon in question, its retrospective nature and reliance on behavioral reports make it impossible to adjudicate definitively between the competing mechanistic explanations (simultaneous partitioned states vs. shifting states with memory bias) based on this description alone. It powerfully motivates the inquiry but does not resolve the core disagreement. The experimental study is designed to provide clearer evidence on the mechanisms potentially at play in such cases.

