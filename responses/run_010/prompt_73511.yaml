answer: |-
  ## Joint Statement & Framework for Adversarial Collaboration: The Ant Colony as Subject of Experience  

  **Prepared for:** [Colleague A - Bounded-Subject Proponent] & [Colleague B - Functional Pluralist Proponent]  
  **Chair:** [Your Name]  
  **Date:** [Date]  

  ---

  ### Part 1: Substantive Agreements  
  Both parties endorse the following claims, with stipulations noted:  

  1.  **Empirical Capabilities of Ant Colonies:**  
      Colonies demonstrably:  
      -   Solve complex ecological problems (e.g., efficient foraging, nest relocation) through self-organised, decentralised processes.  
      -   Maintain internal homeostasis (e.g., thermoregulation, brood care).  
      -   Retain and utilise environmental information beyond the lifespan of individual ants, encoded in the nest structure and pheromone trail networks.  
      -   Exhibit adaptive, flexible collective decision-making (e.g., quorum sensing during emigration).  

  2.  **Conceptual Commitments:**  
      -   A "subject of experience" minimally requires a system capable of *integrated information processing* supporting a *unified perspective* and *phenomenal states*.  
      -   "Experience" implies something *felt* or *undergone* from a first-person perspective, not merely functional success.  
      -   "Representation" (if applicable) requires a system to carry information about its environment in a way that is *functional for that system* and can guide its behaviour adaptively.  
      -   *Stipulation (A):* Agreement on this definition of representation holds *only if* "system" refers to a spatially contiguous entity with fast internal signalling. *(B accepts unconditionally)*.  

  3.  **Criteria for Finding/Missing a Mind:**  
      -   **Finding Evidence FOR Colony Subjecthood:** Demonstrating that colony-level processes generate integrated states unavailable to individual ants, exhibiting properties analogous to perceptual binding, intentional states (e.g., colony-level "hunger" guiding foraging), or unified agency irreducible to parts.  
      -   **Finding Evidence AGAINST Colony Subjecthood:** Demonstrating that all colony-level phenomena are exhaustively explainable by the summed behaviours of individual ants responding only to local cues and simple rules, with no holistic integration or intrinsic perspective.  
      -   Failure to find evidence *for* subjecthood does not, by itself, constitute evidence *against* it (epistemic gap acknowledged).  

  4.  **Unhelpful Framings:**  
      Both parties agree the following impede progress on *this specific question*:  
      -   **Block's China Brain:** Treats the colony as a *simulation* of a known conscious system (brain). Our question is whether a colony *is* a subject *in its own right*, based on its specific organisation.  
      -   **Panpsychist Inflation:** Attributing proto-consciousness to fundamental particles or simple systems distracts from the specific organisational thresholds relevant to macro-subjects like colonies.  
      -   **Appealing Solely to the "Hard Problem":** While phenomenal consciousness is central, focusing *only* on the explanatory gap without engaging with functional and organisational criteria yields no testable claims.  

  ---

  ### Part 2: Residual Disagreements  

  | Disagreement                                                                                                   | Precise Wording (A)                                                                 | Precise Wording (B)                                                                 | Nature of Disagreement        | Notes                                                                 |
  | :------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------- | :---------------------------- | :-------------------------------------------------------------------- |
  | **1. Requirement of Spatial Contiguity**                                                                       | A subject of experience *must* be a single, spatially contiguous physical system.   | A subject of experience *can* be a physically distributed system, provided its functional integration meets the criteria of unity. | Conceptual                    | Disagrees on the *essential nature* of subjects.                      |
  | **2. Requirement of Fast Information Exchange**                                                                | The temporal grain for information exchange within the subject must be sufficiently fast (orders of magnitude faster than ant-colony signalling) to support the binding of experiences into a unified "now". | The speed of information exchange is irrelevant to subjecthood; what matters is the *functional outcome* of integration, regardless of timescale. | Conceptual / World            | Disagrees on the *necessary conditions* for binding/unified perspective. |
  | **3. The Nature of "Representation" in the Colony**                                                            | Information in trails/nests is not *representational*; it's merely a causal/physical trace triggering innate ant responses. True representation requires internal processing *by an individual cognitive agent*. | Information stored in trails/nests *is* representational *for the colony system*; it functions as stored knowledge guiding colony-level behaviour, satisfying the functional definition. | **Verbal** / Conceptual       | **Diagnosis:** Primarily hinges on whether "representation" is defined solely as requiring an individual cognitive agent (A) or can be a system-level functional property (B). The *functional role* of the information is agreed upon; the *label* "representation" is contested based on prior conceptual commitments. |
  | **4. Evidence of a First-Person Perspective**                                                                  | The colony's coordination, however adaptive, provides no evidence of a *first-person perspective*; it is only observable/describable from the third-person. | The colony's unified responses to stimuli (e.g., collective defence, coordinated foraging shifts) *are* the behavioural manifestations of its first-person perspective, just as an animal's are. | World / Conceptual            | Disagrees on the *interpretation* of observable phenomena as evidence for (or against) an intrinsic perspective. |
  | **5. Fundamentality of the Neural Paradigm**                                                                   | Mammalian brains provide the *only empirically known instance* of a subject; any other candidate system must closely resemble this paradigm. | Mammalian brains are one *contingent realisation* of subjecthood; the concept is functional and can be realised in other sufficiently complex integrated systems. | Conceptual                    | Disagrees on the *extent* to which known biology constrains the concept. **No further evidence could settle this.** It's a prior commitment about the scope of the concept itself. |

  ---

  ### Part 3: Cruxes  
  Resolution of these sub-questions would materially shift one party's position:  

  1.  **Temporal Binding & the "Now":** Is the characteristic timescale of colony-level information integration (seconds/minutes/hours) too slow to constitute the binding necessary for a unified moment of experience (traditionally assumed to be on the order of milliseconds in brains)? What *must* the temporal grain of an experiential moment be?  
  2.  **Embodiment & Body Schema:** Does the colony exhibit anything functionally analogous to an animal's *body schema* – a holistic, integrated representation of its own extent, boundaries, and capacities that guides unified action *from its own perspective* – or only externally observable functional structure?  
  3.  **Genuinely Colony-Level Memory:** Is the retention and utilisation of information (e.g., learned maze solutions, predator locations) across timescales exceeding individual ant lifespans a property *of the colony as a whole*, irreducible to the habits of individual ants plus the passive nest layout?  
  4.  **Interpretation-Independent Beliefs:** Is there a fact of the matter about *what the colony believes* (e.g., "danger is located at X") that exists independently of an observer's charitable interpretation of its collective behaviour patterns?  

  ---

  ### Part 4: Agreed Tests/Predictions  

  1.  **Crux 1 & 3: Long-Term Memory & Integration Test (Bisection + Delay)**  
      -   **Test:** Train whole colony on a complex task requiring long-term memory (e.g., navigating a specific maze to food, avoiding a specific threat pattern). After mastery, bisect colony into two halves (A & B), housed in identical but separate nests. After a period exceeding the lifespan of any worker ant present during training (ensuring no individual memory), test each half on the original task.  
      -   **Prediction (A):** Neither half A nor half B will show significant retention of the specific trained task. Performance will regress to naive or generic exploration. *If either half succeeds, A concedes evidence for colony-level information retention irreducible to individual ants.*  
      -   **Prediction (B):** Both halves A and B will show significant retention of the trained task, indicating colony-level memory stored in persistent structures/traces. *If both halves fail, B concedes the memory was likely not robustly colony-level.*  
      -   **Equivocal Result:** One half succeeds, one fails. Suggests complex interaction or incomplete transfer, needing further investigation (e.g., was colony-level memory spatially localised? Was bisection incomplete?).

  2.  **Crux 2: "Body Schema" Disturbance Test**  
      -   **Test:** Manipulate the colony's perceived physical form in a way requiring holistic adaptation. Example: Severely damage a critical, established nest structure central to brood-rearing or thermoregulation (simulating a major injury to an organism). Observe the speed, coordination, and *holistic prioritisation* of the repair response. Does the colony act as if it has a disrupted self-image, prioritising repair coherently across tasks? Contrast with responses to local, minor damage.  
      -   **Prediction (A):** Response will be fragmented and localised. Ants near the damage will respond to local stimuli (debris, changed airflow), but no colony-wide prioritisation or coordinated shift in activity (e.g., foraging vs. nursing) reflecting a unified "sense of damage" will occur. *If holistic prioritisation and coordinated global shift occur rapidly, A concedes evidence for a functional analogue of a body schema.*  
      -   **Prediction (B):** Response will exhibit unified, colony-wide reprioritisation (e.g., drastic reduction in foraging, massive redirection of workers to repair), analogous to an organism prioritising wound healing. *If the response is purely localised with no colony-level behavioural shift, B concedes lack of evidence for a body schema.*  
      -   **Equivocal Result:** Significant but not colony-wide coordinated response; difficult to distinguish emergent coordination from summed local responses.

  3.  **Crux 4: Belief Attribution Test (Ambiguous Stimulus)**  
      -   **Test:** Present the colony with a novel, ambiguous stimulus that could be interpreted in multiple ways with different behavioural implications (e.g., a specific chemical signature that *could* signal either a high-quality food source or a low-level threat). Observe the colony's collective response pattern. Then, independently manipulate the context to favour one interpretation (e.g., add a faint threat pheromone elsewhere) and observe if the response shifts coherently.  
      -   **Prediction (A):** Responses will be variable, fragmented, or inconsistent. Shifts in context will not reliably produce coherent, colony-wide shifts in interpretation/behaviour. Attributing a specific "belief" will always be an observer's interpretation. *If a coherent, colony-wide behavioural interpretation emerges and consistently shifts with context manipulation, A concedes evidence for interpretation-independent intentional states.*  
      -   **Prediction (B):** The colony will exhibit a coherent, colony-wide behavioural response to the ambiguous stimulus, and this response will reliably shift in a predictable, unified manner when the disambiguating context is added, indicating a colony-level "take" on the stimulus. *If responses are inconsistent or lack coherent shifts, B concedes lack of clear evidence for stable, interpretation-independent beliefs.*  
      -   **Equivocal Result:** Some coordination but inconsistencies; difficulty defining "coherent colony-wide shift" uncontroversially.

  ---

  ### Concluding Commitments & Implications  

  *   **Evidence Against Own View:**  
      -   **A (Bounded-Subject):** "Evidence of integrated colony-level information processing occurring on a timescale comparable to neural binding (milliseconds), or demonstrating intrinsic, perspective-dependent properties (like qualia-laden aversion) irreducible to external description, would seriously challenge my view."  
      -   **B (Functional Pluralist):** "Demonstrating that all colony-level problem-solving and coordination can be exhaustively predicted and explained *solely* by modelling individual ant behaviours reacting to immediate local cues and simple rules, with no need for holistic state variables or integrated representations, would seriously challenge my view."  
  *   **Moving the Other Party:**  
      -   **A:** "I believe [B] could be moved by decisive evidence showing colony-level phenomena are *nothing but* summed individual behaviours plus passive environment, especially regarding memory or decision-making."  
      -   **B:** "I believe [A] could be moved by decisive evidence showing colony-level integration at neural-like speeds or exhibiting intrinsic properties akin to sensory phenomenology."  
      *Both parties express scepticism that *any* evidence would *actually* move the other, given foundational conceptual differences.*  
  *   **Ethical Implication (Colony-Level Interests):**  
      Both parties agree that **the outcome of this collaboration bears directly on whether an ant colony can be said to possess interests *as a whole* that can be harmed independently of, or over and above, harms suffered by its individual members.** Finding robust evidence for colony-level subjecthood would strongly suggest such interests exist; finding robust evidence against it would suggest colony welfare is solely a matter of aggregate individual ant welfare.  

  ---  
  **End of Draft Joint Statement**
