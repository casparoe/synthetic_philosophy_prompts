  ### Runable Package: "The Chocolate Coin Paradox" Seminar Activity

  #### **Core Design Principles**
  - **Phase 1 (Common Prior Baseline)**: Students trade claims under identical conditions. Trade *should not occur* due to shared reasoning, creating palpable frustration.
  - **Phase 2 (Heterogeneity Smuggled)**: Hidden payoff differences create "irrational" trade. Confound: **Token conversion rates vary secretly** (1 token = 1 chocolate for some, 1 token = 2 chocolates for others). Not announced; embedded in personalized instructions.
  - **Phase 3 (Announcement Round)**: Run **after Phase 2 trading** to expose divergence/collapse. Students state posteriors aloud in sequence.
  - **Economics Majors' Role**: Assigned as **Auditors** (record trades/arguments neutrally) to prevent early game-solving.
  - **Deck & Signals**: Simple counting (no division >99). Two states (A/B), 24-card deck. Signals designed for easy posterior calculation via card-counting.

  ---

  ### **Materials List**
  | Item | Quantity | Notes |
  |------|----------|-------|
  | **Decks** | 1 | 24 cards: 16 RED, 8 BLUE (e.g., colored index cards) |
  | **Claim Tickets** | 15 | "Pays 10 tokens if State=A" (identical appearance) |
  | **Tokens** | 300+ | Poker chips/paper slips (≥20 per student) |
  | **Instruction Packets** | 15 | Sealed envelopes with personalized rules (see below) |
  | **Whiteboards** | 2 | Track announcements and bets |
  | **Chocolate Coins** | 50+ | For redemption post-activity |
  | **Dice** | 1 | Determine State (1–3: A; 4–6: B) |

  ---

  ### **Deck & Signal Specifications**
  - **States**: A (claim pays) or B (claim worthless).  
  - **Prior**: P(A) = 50% (publicly rolled with dice).  
  - **Deck Composition**: 16 RED, 8 BLUE cards (publicly counted together).  
  - **Signals**: Each student draws 1 card privately.  
  - **Posteriors via Counting**:  
    - **RED card holder**: Sees 15 RED left, 8 BLUE → 15 ways RED could signal A vs. 8 for B.  
      Posterior P(A|RED) = 15/(15+8) ≈ 65.2% → Values claim at **6.5 tokens**.  
    - **BLUE card holder**: Sees 16 RED, 7 BLUE left → 16 ways BLUE signals A vs. 7 for B.  
      Posterior P(A|BLUE) = 16/(16+7) ≈ 69.6% → Values claim at **7 tokens**.  
  - **Rationale**: Close posteriors (65–70%) create ambiguity. Trade seems possible but shouldn’t occur under common priors (Aumann: no trade with common knowledge).  

  ---

  ### **Token Economy & Payoffs**
  - **Starting Endowment**:  
    - 10 tokens + 1 claim ticket per student.  
  - **Trading Rules**:  
    - Buy/sell claims for tokens.  
    - No borrowing tokens (negative balances void trades).  
  - **Redemption (Smuggled in Phase 2)**:  
    - **Group 1 (10 students)**: 1 token = 1 chocolate.  
    - **Group 2 (5 students)**: 1 token = 2 chocolates.  
    - *Hidden in personalized instructions; not announced*.  
  - **Claim Payoff**: Resolved publicly post-activity (10 tokens if State=A).  

  ---

  ### **Roles for Economics Majors (Auditors)**  
  - **Task**:  
    - Record bids/asks and arguments during trading.  
    - Post-activity: Report "suspicious patterns" (e.g., "Group 2 consistently paid more").  
  - **Why it works**: Neutral role uses their skills without dominating. They see heterogeneities first but can’t intervene.  

  ---

  ### **Timeline (135 Minutes Total)**  
  **Phase 1: Common Prior Baseline (50 mins)**  
  - 0–10 mins: Introduce activity. *"Today we simulate a market for claims. Your goal: maximize chocolates."*  
  - 10–15 mins: Roll dice for State (A/B), count deck publicly (16R/8B), deal one card per student.  
  - 15–25 mins: Students calculate claim value (no formulas; use card-counting hint).  
  - 25–45 mins: **Trading Pit Open**. Students negotiate freely. Auditor records.  
  - 45–50 mins: Debrief Phase 1. *"Did trade happen? Why/why not?"* (Frustration builds; trade fails).  

  **Phase 2: Heterogeneity Introduced (50 mins)**  
  - 50–55 mins: Redistribute **sealed instructions** (Group 1/2 conversion rates hidden). *"New round—identical rules."*  
  - 55–60 mins: Redraw State/deal cards (same deck).  
  - 60–65 mins: Recalculate posteriors (same as Phase 1: RED≈6.5, BLUE≈7).  
  - 65–85 mins: **Trading Pit Reopens**. Trade occurs (Group 2 overpays; Group 1 sells eagerly).  
  - 85–90 mins: **Announcement Round**: Students state posteriors aloud (e.g., *"I think A is 65% likely"*).  

  **Phase 3: Convergence Check (15 mins)**  
  - 90–100 mins: Second announcement round. Posteriors **diverge** (Group 2 values claims higher → different "posteriors").  
  - 100–105 mins: Resolve State, redeem tokens.  

  **Debrief (30 mins)**  
  - 105–135 mins: Guided discussion (script below).  

  ---

  ### **Scripted Instructions (Read Aloud)**  
  > *"We are simulating an information market. A die roll determined State A or B. This deck has 16 red and 8 blue cards, which I counted aloud. Each of you drew one card privately. You hold a claim ticket paying 10 tokens if State=A.  
  >   
  > **Trading Rules**: Negotiate trades (claims for tokens). Tokens convert to chocolate coins after the activity. Starting tokens: 10 per person.  
  >   
  > **Key Rules**: Do not show cards. Do not say 'agree to disagree'—*[smile]* it’s banned! Auditors will record trades.  
  >   
  > Calculate your claim’s value: If your card is red, imagine removing it. 15 red and 8 blue remain. How many ways could red support A vs. B? Use that ratio. Blue? 16 red and 7 blue remain.  
  >   
  > You have 20 minutes to trade. Go!"*  

  ---

  ### **Debrief Script (30 Mins)**  
  1. **Phase 1 Frustration** (5 mins):  
     - *"Why did trading freeze? What stopped deals?"*  
     - Key: Common prior + shared valuations → no incentive.  

  2. **Phase 2 Trade** (5 mins):  
     - *"Trade boomed—why? Was it about beliefs, or something else?"*  
     - Auditors report: *"Group 2 consistently overpaid."*  

  3. **Theorem Mapping** (10 mins):  
     - **Premise 1: Common Prior** (Phase 1 deck count).  
     - **Premise 2: Common Knowledge** (Announcements ≈ public knowledge).  
     - **Failure**: Phase 2 had hidden **payoff differences** (not beliefs!).  

  4. **Enlarged State Space Task** (10 mins):  
     - *"Re-describe Phase 2 with one prior: add 'conversion types' to the state space."*  
     - Students work in pairs: State = (A/B, Group1/Group2).  
     - Debate: *"Does this 'solve' disagreement or prove the assumption is empty?"*  
     - Critical point: Payoffs are not "beliefs"—utility ≠ epistemology!  

  **Backward Connection to Testimony/Peer Disagreement** (5 mins):  
  - *"Last week: conciliating to peers. Here, after announcements, why didn’t beliefs converge in Phase 2?*  
  - *Crucial: Disagreement was about *value*, not truth. Can you 'conciliate' utility differences?"*  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem**: Students botch card-counting (e.g., miscount deck).  
     **Fix**: Publicly count deck together; provide a "counting cheat sheet" (e.g., *"RED: 15 left in A-support vs. 8 in B"*).  

  2. **Problem**: Announcements don’t create common knowledge (e.g., inattentive students).  
     **Fix**: After each announcement, ask *"Does anyone change their belief?"* Record shifts on whiteboard.  

  3. **Problem**: Economics majors leak secrets (e.g., *"I get 2x chocolates!"*).  
     **Fix**: Assign penalty tokens for leaks; emphasize "confidential instructions."  

  4. **Problem**: Trading pit chaos (e.g., shy students don’t engage).  
     **Fix**: Use a "two-minute silent bid/ask" startup (write offers on paper before open outcry).  

  **Unreproducible Element**:  
  - **Logical Omniscience**: Students might miscalculate posteriors despite identical data. Reality: humans aren’t Bayesian automatons. *Debrief: "The theorem assumes perfect rationality—our activity shows human limits."*  

  ---

  ### **Instructor Notes**  
  - **Banning "Agree to Disagree"**: Enforce humorously (e.g., token fine). When a student slips up, use it to highlight the theorem’s goal: to *eliminate* such disagreements.  
  - **Why This Works**: Phase 1’s dead market creates cognitive dissonance. Phase 2’s irrational trade sparks debate. Announcements expose hidden payoff differences.  
  - **Theoretical Nuance**: The "enlarged state space" task mirrors **Stephen Morris** (1995)—but keep it experiential. Focus debate on: *"If we can always 'explain away' disagreement, does common prior have content?"*  

  This design ensures students *feel* the paradox before naming it, with heterogeneities that split debrief interpretations (priors vs. knowledge vs. payoffs). The link to peer disagreement underscores that conciliation presumes shared goals—unlike Phase 2’s payoff clash.
