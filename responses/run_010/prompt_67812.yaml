     - 105-110 min: Flip coin, choose deck, deal cards.
     - 110-120 min: Compute posterior.
     - 120-150 min: First market for phase 2.
     - 150-170 min: Public announcement.
     - 170-180 min: Second market for phase 2.
     - 180-195 min: Debrief.

     But this is very tight. We might need to cut time somewhere.

     Alternatively, skip the first market in phase 2, because it's similar to phase 1. Or shorten the market sessions.

     Given time, let's try to fit.

     Script for instructions for phase 1:

     "Today we are doing an activity about decision making under uncertainty. The world can be in one of two states: A or B. I will flip a fair coin to determine the state. If heads, state A; if tails, state B. 
     In state A, I have a deck of cards that contains 12 red cards and 3 blue cards. In state B, the deck contains 3 red cards and 12 blue cards. 
     After I flip the coin and choose the deck, I will shuffle the deck and deal one card to each of you. You may look at your card, but do not show it to others.
     Each of you will receive a claim ticket. This claim ticket will pay 10 tokens if the state is A. If the state is B, it pays nothing.
     Tokens can be redeemed after the activity for chocolate coins. According to your instruction sheet, each token is worth a certain number of chocolate coins. Please keep your instruction sheet private.
     After you receive your card, you will have time to think about the value of the claim to you. Then we will open a market where you can buy and sell these claims with each other.
     The market rules: 
     - You can approach any other student to negotiate a trade.
     - A trade consists of one claim ticket and some tokens. You can agree on any number of tokens.
     - You cannot trade tokens alone, only claims or claims for tokens.
     - You start with your one claim ticket and zero tokens. You may go into negative tokens if you buy a claim and pay tokens, but you must be able to settle at the end. (We will provide tokens as needed during trading.)
     - The activity will have two parts: we will do the market twice, with an information sharing session in between."

     For phase 2, the script is similar, but the instruction sheets have different redemption rates.

     Debrief plan:

     - Ask: In phase 1, after the public announcement, why was there no trade?
     - They should say because everyone knew the state and valued the claim the same.
     - Then in phase 2, after public announcement, why was there trade?
     - Some might have valued the claim differently even though they knew the state.
     - Then reveal that there were different conversion rates.
     - Now, map to the theorem: the no-trade result assumes common prior, common knowledge of posteriors, and identical utility functions (or at least common knowledge of them). In phase 1, after announcement, they had common knowledge of the state (which is a posterior of 1 or 0) and common utility, so no trade. In phase 2, even though they had common knowledge of the state, they had different utility functions, so trade occurred.
     - Then discuss: could we have had trade in phase 1 before the announcement? Yes, because of different information.
     - The common prior assumption: in both phases, the prior over states was common (0.5). 
     - Common knowledge of posteriors: after the public announcement, they had common knowledge of the state, hence of posteriors.
     - What broke in phase 2? The utility functions were not common knowledge? Or not identical.
     - Task: can we redescribe phase 2 as a common prior over an enlarged state space? The state space would include the conversion rate of each student. But the conversion rate was fixed and not random? In phase 2, the conversion rates were assigned arbitrarily. If we include in the state space the assignment of conversion rates, then the prior would be common, and the signals (cards) would be informative only about state A/B, not about conversion rates. Then after public announcement of the cards, they know state A/B, but they don't know the conversion rates of others. So they still wouldn't have common knowledge of the posteriors for the utility? This is complex.

     Instead, focus on: the condition of the no-trade theorem requires that the acts (or in this case, the utility functions) be common knowledge. In phase 2, the utility functions were not common knowledge because students were forbidden to disclose them.

     So the theorem's condition of common knowledge of the posteriors and the prior is not enough; we also need common knowledge of the utility functions or that the utility functions are the same.

     This is a good lesson.

     Connection to last week: in peer disagreement, should you conciliate? The activity shows that under common prior and common knowledge of posteriors, you must conciliate to the same belief. But if there is a difference in utility or in the event space, then disagreement in action (trade) might persist even after agreement in belief.

     This should take 10 minutes in the debrief.

     Predictable problems and fixes:

     1. Problem: Students might not understand how to compute the posterior.
        Fix: In the instructions, with the example: "If you receive a red card, then ask yourself: if the state is A, how likely are you to get a red card? (12/15) if state B? (3/15) then the chance it's A given red is [0.5 * 12/15] / [0.5 * 12/15 + 0.5 * 3/15] = (12/30) / (15/30) = 12/15=0.8. But we can avoid the formula: there are 12+3=15 ways to get a red card in state A, and 3+12=15 in state B? No. Better: out of the ways to get a red card, 12 of them come from state A, 3 from state B, so 12/(12+3)=12/15=0.8. This is a counting approach.

     2. Problem: In the public announcement, students might not update properly after each announcement.
        Fix: After each announcement, pause and ask for a show of hands: who thinks state A is more likely? Then move to the next. Or have them compute the new posterior. But it might be too slow. We can do a few and then they see the pattern.

     3. Problem: In phase 2, students might announce their conversion rate.
        Fix: In the instructions, emphasize confidentiality. If someone does, remind them it's against the rules.

     4. Problem: The market might not be active.
        Fix: The instructor can seed some offers or make it a call market where they shout bids and asks.

     What the activity cannot reproduce: 
     - The public announcement is not common knowledge until everyone has heard and processed it. In a finite circle, it's not common knowledge until the last announcement. But in practice, after a few, they are sure.
     - In phase 2, the difference in utility might be attributed to a prior difference if we try to redescribe, but in our case, the conversion rates were not part of the world state that is unknown; they were arbitrarily assigned. So it's not a difference in prior beliefs about the world.

     We must explain that the common prior assumption is about beliefs about the world, not about preferences.

