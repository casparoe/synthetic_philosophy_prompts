     We distribute the sheets randomly to half the students for group 2, the other half for group 1. But 15 is odd, so 7 in group 1, 8 in group 2, or vice versa.

     We have to hope they don't announce their conversion rate. To prevent that, in the instructions, we can say: "You are not to disclose the conversion rate or any other part of your instruction sheet to other students." 

     Then in the debrief, we can reveal that some had different conversion rates.

     This seems workable.

     Summary for phases:

     Phase 1 (common prior, same utility):
       - Setup: state A/B by coin flip, use corresponding deck (state A: 12 red, 3 blue; state B: 3 red, 12 blue). 
       - Each student gets one card.
       - Each student has a claim that pays 10 tokens if state A.
       - Token redemption: everyone's token is worth 1 chocolate coin.
       - First market: students trade the claim. We expect trade because of different signals.
       - Then public announcement: students announce their card color in sequence. After each, they can update. We go until they are sure of the state.
       - Then second market: no trade because they all know the state and have the same utility.

     Phase 2 (confound: different utility):
       - We do the same setup: state, cards, etc.
       - But now, we have two groups with different conversion rates. We distribute instruction sheets: for group 1: 1 token = 1 chocolate coin; group 2: 1 token = 2 chocolate coins.
       - The claim is the same: pays 10 tokens if state A.
       - First market: trade occurs.
       - Public announcement: they learn the state.
       - Second market: trade occurs between groups because of different utility.

     Then in the debrief, we can discuss why in phase1 after announcement, no trade, but in phase2, trade occurred.

     Roles for economics majors: We can make them the market makers. For example, in the market, we can have them sit in the middle and facilitate trades by matching buy and sell orders. This will keep them busy and they can see the market activity. Or we can make them and the other students all traders.

     Given the activity is for 15 students, we can have them all trade. The economics majors will be in one of the groups (group 2, say).

     Materials list:
     - A coin.
     - Two decks: 
          - Deck A: 12 red cards, 3 blue cards.
          - Deck B: 3 red cards, 12 blue cards.
     - Instruction sheets for each student: 
          - For phase 1: all say "Each token you earn is worth 1 chocolate coin."
          - For phase 2: half say "Each token is worth 1 chocolate coin." (group 1), half say "Each token is worth 2 chocolate coins." (group 2). And include a confidentiality notice.
