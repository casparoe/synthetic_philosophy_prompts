     The timeline becomes:

     Phase 1: common prior and signals, then public announcement of posteriors until they converge (which they will to 0 or 1), then open a market for the claim. Prediction: no trade because they all know the state.

     Phase 2: we introduce a confound, then do the same: public announcement might not converge, and then market might have trade.

     But the no-trade result for phase 2 might not hold because of the confound.

