     - We determine the state by coin flip, use the corresponding deck, deal one card to each student.
     - Each student computes their posterior: red -> 0.8 for A, blue -> 0.2 for A.
     - Then we open a market for a claim that pays 10 tokens if state A.
     - We allow students to trade with each other.

     Students with a red card value the claim at 8 tokens (because 0.8 * 10 = 8), and those with blue at 2 tokens (0.2 * 10 = 2).

     Then we expect that a student with a red card would only sell for at least 8, and buy for at most 8? Actually, they might be willing to buy at any price below 8 and sell at any price above 8. Similarly for blue: buy below 2, sell above 2.

     Then there might be trade between a blue holder (willing to sell for >2) and a red holder (willing to buy for <8) at a price between 2 and 8.

     So trade is possible. This is not the no-trade result.

     The no-trade result is for when there is common knowledge of posteriors. In this case, they don't know each other's posteriors. So trade happens.

     To achieve no trade, we need to create a situation where even though they have private information, the market as a whole has a price that reflects the publicly available information, and then no one wants to trade at that price. But that's a rational expectations equilibrium, which is advanced.

     Alternatively, we can skip the market in phase 1 and move directly to phase 3: public announcement of posteriors. In this setup, after one student announces their posterior, it doesn't change much. But if all announce, then they learn the state.

