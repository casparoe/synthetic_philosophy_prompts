  First, I need to understand the key elements of the fictional statute. Section 4(1) prohibits operating drones within 200 meters of a hospital helipad. Subsection (2) exempts emergency medical service aircraft. Subsection (3) sets the penalty. The preamble states the purpose is to protect patients and crews from drone risks. The scenario involves a defendant flying a drone near a temporarily closed helipad for journalism, with no air ambulances nearby.

  For part (a), students must show how each theory cuts both ways. Textualism: The literal text says "helipad," which was physically present but non-functional. The exemption in (2) specifies "operated by EMS," implying the rule applies regardless of current use. But "operate" might imply active use, and "helipad" could imply functionality. Also, the bright-line rule (200m) versus potential absurdity if applied to a closed pad. Purposivism: The purpose is to protect people in air ambulances. No risk here, so maybe no violation. But the mischief was drones near helipads, and keeping the corridor available might mean even when closed. The level of generality matters—specific risk versus broader safety concerns.

  Part (b) asks whether the amendment clarifies original meaning or changes it. If the amendment adds "temporarily out of service," textualists might say it changes the law, showing original text didn't cover it. Purposivists might argue it confirms the purpose, but the amendment still alters the scope. This impacts the fixation thesis—whether meaning is set at enactment.

  The user's constraints: no real citations, no "vehicles in the park" example. The answer must stand on its own. The model answer needs to demonstrate balancing both theories, showing internal conflicts, and addressing the amendment's implications.

  Deep needs: The user wants students to think beyond memorization, to engage deeply with theoretical tensions. They need the exam to highlight how theories have internal complexities, not just binary outcomes. The marking scheme should reward recognizing ambiguities within each approach and understanding the amendment's theoretical implications.

  Potential pitfalls: Students might oversimplify textualism as always literal or purposivism as solely intent-based. Strong answers must wrestle with counterarguments within each theory. For the amendment, they must differentiate between clarification and change, and discuss fixation.

  Outline the question: Present the statute, scenario, then part (a) and (b) with clear instructions. Model answer should argue both sides for each theory, then analyze the amendment. Marking scheme: Key points include textualist/purposivist arguments showing duality, structural insights, purpose generality, amendment analysis, fixation implications. Top answers notice the same outcome from different reasons and what that means for theoretical disagreement.

  Ensure the model answer avoids one-sided arguments. For textualism, present the literal reading but also the functionality argument. For purposivism, show both the no-risk view and the corridor preservation. In part (b), contrast textualist fixation with purposivist flexibility. Highlight that convergent outcomes don't resolve theoretical differences.
answer: |-
  ### (i) Practice Final Examination Question  
  **Riverton Law School | Jurisprudence & Statutory Interpretation Seminar | Practice Final**  
  **Time Allowed:** 75 minutes  
  **Total Marks:** 25  

  **Answer ONE Question**  
  *(The scenario below applies to both parts.)*  

  **Statute:** *Riverton Drone Safety Act*  
  - **Preamble:** "An Act to protect patients carried to and from hospital by air, and the crews who carry them, from the risks posed by unmanned aircraft."  
  - **Section 4:**  
    (1) A person must not operate an unmanned aircraft within 200 metres of a hospital helipad.  
    (2) Subsection (1) does not apply to an aircraft operated by, or under contract to, an emergency medical service.  
    (3) A person who contravenes subsection (1) commits an offence punishable by a fine of up to $5,000.  

  **Facts:** Three months before the incident, Riverton General Hospital’s helipad closed for resurfacing. No aircraft used it during this period; air ambulances diverted to a nearby airfield. The defendant flew a camera drone 150 metres from the pad’s centre for six minutes, filming the closed surface for a news story about deferred maintenance. No air ambulance was within two kilometres. He is charged under section 4(1).  

  **Part (a)** (15 marks)  
  Decide whether the defendant contravened section 4(1):  
  - **First**, as a committed textualist.  
  - **Second**, as a committed purposivist.  
  **Crucially, show how each theory’s internal tools cut *both* ways in this case.** For textualism, address: semantic context (e.g., "helipad," "operate"), structural clues (e.g., the subsection (2) exemption), bright-line drafting, and the absurdity doctrine. For purposivism, address: the level-of-generality problem in defining the Act’s purpose, the "mischief" targeted, and the interest in keeping the air corridor available.  

  **Part (b)** (10 marks)  
  Suppose the legislature, learning of this prosecution, amends section 4(1) by inserting "(including a helipad that is temporarily out of service)" after "hospital helipad." Does this amendment:  
  - (i) Establish what the original text *always meant*, or  
  - (ii) *Change* what the statute means?  
  What does your answer imply for the claim that statutory meaning is "fixed at enactment"?  

  ---  
  ### (ii) Model Answer (≈700 words)  

  #### Part (a)  
  **Textualist Approach**  
  A textualist *could* convict the defendant. The text prohibits operating drones "within 200 metres of a hospital helipad." The physical pad existed, satisfying "helipad." No functional requirement appears: the bright-line rule ("200 metres") prioritizes certainty over context. Subsection (2) exempts EMS aircraft, implying subsection (1) otherwise applies indiscriminately. If "helipad" required current use, subsection (2)’s EMS exemption would be redundant when the pad is closed—yet redundancy alone is not absurd.  

  However, textualism *also* supports acquittal. "Helipad" semantically implies functionality (e.g., a pad buried under snow might not qualify). "Operate" could require affecting active operations—impossible here. The *structure* of subsection (2) highlights that liability hinges on *interference* with EMS flights; with no flights, the mischief is absent. Applying the rule to an inert slab risks "absurdity" by criminalizing harmless acts. Thus, textualist tools split: formalism favors conviction; contextual semantics favor acquittal.  

  **Purposivist Approach**  
  A purposivist *could* acquit. The preamble protects "patients and crews" during air transfers. No flights occurred; no risk existed. The defendant’s journalism advanced public accountability, aligning with broader societal values. Applying the law here would defeat its purpose while creating negligible safety benefits.  

  Yet purposivism *could* convict. The "mischief" was drones near helipads *generally* (not per incident). The purpose’s *level of generality* is key: if "protecting air corridors" (not just immediate risks), keeping the zone clear ensures readiness. Subsection (2) implies non-EMS drones *always* threaten efficiency—even when inactive. Temporary closure heightens vulnerability (e.g., workers resurfacing). Thus, purposivism splits: narrow purpose favors acquittal; systemic safety favors conviction.  

  #### Part (b)  
  The amendment *changes* the law. Textualism holds meaning is fixed at enactment. Original text lacked "temporarily out of service"; adding it alters scope. If the original covered closed pads, the amendment would be redundant—a conclusion textualists reject to avoid imputing error to the legislature. This reinforces fixation: meaning derives from enacted words, not later legislative opinions.  

  Purposivists *might* see the amendment as "clarifying" original purpose. However, this risks conflating intent with meaning. The amendment responds to ambiguity exposed by litigation, proving the original text *failed* to unambiguously include closed pads. Thus, it changes meaning to align with new policy insights.  

  **Implications for Fixation:**  
  Textualism views fixation as essential for predictability and legislative supremacy. The amendment confirms meaning was fixed but incomplete. Purposivism, however, treats meaning as dynamic: legislative "corrections" reveal that purpose evolves, undermining fixation. Both agree the amendment affects *future* cases but disagree on retroactivity—textualists see new law; purposivists may apply it retroactively as "always intended."  

  #### Conclusion  
  Textualism and purposivism both yield defensible acquittals or convictions here, exposing tensions *within* each theory. Their convergence (if acquittal is chosen) proves nothing: textualists rely on semantic implications; purposivists on narrow purpose. The theories remain incompatible, as purposivism prioritizes adaptive purpose over textual precision.  

  ---  
  ### (iii) Marking Scheme (25 marks total)  
  1. **Textualist duality (5 marks):**  
     - *Full credit:* Shows textualism supports *both* conviction (literal text, bright line) AND acquittal (semantic functionality, absurdity).  
     - *Common error:* Only argues one outcome; ignores structural clues (e.g., subsection (2)).  

  2. **Purposivist duality (5 marks):**  
     - *Full credit:* Shows purposivism supports *both* acquittal (no immediate risk) AND conviction (systemic corridor protection). Addresses level-of-generality problem.  
     - *Common error:* Fixates on preamble alone; ignores "mischief" or subsection (2)’s implications.  

  3. **Amendment as change vs. clarification (5 marks):**  
     - *Full credit:* Argues amendment *changes* the law (textualist fixation) but notes purposivist "clarification" counterpoint. Rejects redundancy.  
     - *Common error:* Assumes amendment "reveals" original meaning without analysis.  

  4. **Fixation thesis implications (5 marks):**  
     - *Full credit:* Links textualism to fixed meaning; purposivism to dynamism. Contrastes retroactivity.  
     - *Common error:* Claims amendment "proves" fixation without addressing purposivist evolution.  

  5. **Convergence & theory conflict (5 marks):**  
     - *Full credit:* Notes that same verdict (e.g., acquittal) stems from incompatible reasons (textual semantics vs. narrow purpose). Explains why this doesn’t resolve the textualism-purposivism debate.  
     - *Common error:* Treats identical outcomes as evidence the theories are reconcilable.  

  ---  
  ### (iv) Distinguishing A from B Answers  
  An **A answer** (21–25 marks) must:  
  - For **part (a)**, identify *competing arguments within each theory* (e.g., textualism’s semantic vs. formalist strands; purposivism’s narrow vs. broad purpose).  
  - For **part (b)**, explicitly contrast textualist fixation ("amendment changes law") with purposivist flexibility ("amendment fulfills purpose"), *without* conflating them.  
  - State that convergence in verdicts (if any) is *coincidental*, proving nothing about theoretical compatibility.  

  A **B answer** (16–20 marks) may:  
  - Contrast textualism and purposivism correctly but treat each as monolithic (e.g., "textualists always convict").  
  - Explain fixation but not its theory-dependent implications.  
  - Note the same outcome for both theories but not why this fails to reconcile them.  

  ---  
  **Design Note:** This question forces engagement with statutory ambiguity *without* defaulting to canonical examples. By requiring internal critique of both theories, it rewards nuance over dogma. The marking scheme prioritizes dialectical reasoning over "correct" outcomes.
