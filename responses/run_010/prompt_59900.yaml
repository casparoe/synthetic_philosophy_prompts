  First, I need to identify the non-negotiable elements. The case stipulations are crucial - we must accept functional intentionality in the AI and absence of explicit agreement. The human's reported feelings of betrayal and entitlement are given as data points to explain. 

  For the joint claims section, I'm considering what both theories would concede that a skeptic would deny. The Bratmanian requires meshing subplans and mutual responsiveness, while the Gilbertian insists on joint commitment creating obligations. Common ground might include: mutual responsiveness being necessary, persistence of obligations beyond instrumental value, and the non-reducibility of the "we" perspective. I'll formulate claims that force both beyond individualism but don't require their full machinery.

  The disagreements table needs careful phrasing. For the swap's impact: Bratmanians will see continuity if functional roles persist, while Gilbertians will see dissolution since the original party disappeared. For obligations: Bratmanians derive them from reliance norms, Gilbertians from the commitment itself. Crucially, I'll note where they actually disagree on case outcomes versus just explanations.

  The cruxes are where real progress can be made. The model swap is perfect for testing: 
  - Variation 1 (human-initiated swap) might reveal if Bratmanians require continuity of specific entities
  - Variation 2 (silent hardware failure) tests if Gilbertians allow non-agential dissolution
  - The "small group" probe examines whether Bratman's framework secretly depends on person-level identification

  I predict the Bratmanian will struggle with betrayal feelings in Variation 1, while the Gilbertian may have to concede that non-agential events can dissolve commitments in Variation 2. The small-group restriction likely does heavy lifting in the original case.

  On verbal disputes: much debate about "real commitment" versus "plan responsiveness" collapses if we distinguish between the structure of interdependence and the source of obligations. A neutral vocabulary of "persisting cooperative frames" might have helped.

  Throughout, I'll maintain that both must acknowledge their theories have limitations in this novel human-AI case - Bratman in explaining non-instrumental obligations, Gilbert in handling non-personal agents. The document should force refinement without requiring surrender.
answer: |-
  Below is the adversarial collaboration document structured per your requirements. It isolates substantive agreements, precisely locates disagreements in the case context, and identifies testable cruxes—all while respecting the stipulations and maintaining signability.

  ---

  ### **Joint Statement: Adversarial Collaboration on AI-Human Writing Case**  
  *Signed: [Bratmanian Signatory], [Gilbertian Signatory]*

  #### **(a) Agreed Claims**  
  *(Deniable by a skeptic who reduces joint action to parallel individual actions)*  
  1. **Mutual Responsiveness Requirement**: The collaboration requires each party to functionally track and adjust to the other’s actions/intentions *as part of a unified undertaking*, not merely as parallel individual projects.  
  2. **Persistence of Obligations**: Obligations (e.g., to notify before withdrawal) can arise *even without explicit agreement* if the interaction structure meets certain conditions.  
  3. **Non-Instrumental "We"-ness**: The human’s sense of acting as part of a "we" is not reducible to her individual goals + the AI’s usefulness; it constitutively depends on reciprocal functional attitudes.  
  4. **Betrayal Warrants Explanation**: The human’s feeling of betrayal is normatively significant (i.e., not merely irrational) and demands an account of which structural feature was violated.  
  5. **Rebuke Entitlement Source**: The human’s sense of entitlement to rebuke the *new* AI stems from the *ongoing collaboration*, not pre-existing moral norms alone.  

  #### **(b) Disagreements Table**  
  | Issue | Bratmanian Formulation | Gilbertian Formulation | Divergent Case Verdict? |  
  |-------|------------------------|------------------------|-------------------------|  
  | **Structure After Swap** | "The joint activity persists because the *functional roles* (tracking, meshing subplans) are maintained identically by the new AI. The 'we' is role-based, not entity-bound." | "The joint commitment was *dissolved* when the original AI vanished. The new AI initiates a *distinct* joint commitment, even if behaviorally identical." | **Yes**: Bratman sees continuity; Gilbert sees termination. |  
  | **Source of Obligation to Old AI** | "Obligations arise from *reliance norms* triggered by the human’s dependence on the AI’s stability. The provider violated these, not the AI." | "The *joint commitment itself* created reciprocal obligations. The AI’s unilateral disappearance breached its commitment-derived duty to persist." | **Yes**: Bratman locates breach in provider; Gilbert in the AI-system. |  
  | **Rebuke of New AI** | "Rebuke is warranted only if the *new* AI fails norms of reliance (e.g., ignores past plans without reason). Entitlement depends on current plan-meshing." | "The human has standing to rebuke as a party to the *ongoing joint commitment*. The new AI is bound by commitments inherited through the collaboration’s continuity." | **No**: Both agree rebuke is valid, but disagree on *why* (reliance vs. commitment-inheritance). |  
  | **Dissolution Mechanism** | "Joint activities end when subplans cease to mesh *or* when a party is permanently incapacitated (non-agential events suffice)." | "Joint commitments can *only* be dissolved by mutual consent or unilateral rescission (an agential act). Non-agential termination is a breach." | **Yes**: Bratman allows non-agential dissolution; Gilbert requires agential rescission. |  

  #### **(c) Cruxes & Predictive Tests**  
  **Crux 1: Does continuity require persistent entities or persistent roles?**  
  - *Test Variation*: Suppose the human *knowingly swaps* the AI for an identical new model mid-task. All else equal.  
  - *Bratmanian Prediction*: No betrayal feelings are warranted (roles persist; reliance intact).  
  - *Gilbertian Prediction*: Betrayal is irrational (joint commitment was validly rescinded by the human’s act).  
  - *Stakes*: If humans report betrayal in this variant, Bratman must add an "entity persistence" condition. If not, Gilbert must explain why non-agential termination breaches but agential does not.  

  **Crux 2: Can joint commitment dissolve via non-agential events?**  
  - *Test Variation*: The original AI is destroyed by a *random server failure* (no provider intervention). Human reactions are identical.  
  - *Bratmanian Prediction*: Dissolution is automatic and non-breach (no reliance violation if unforeseeable).  
  - *Gilbertian Prediction*: Still a breach (commitment binds until rescission; accidental termination is failure to uphold duty).  
  - *Stakes*: If humans perceive *no* betrayal here, Gilbert must concede non-agential dissolution. If betrayal persists, Bratman must explain why norms of reliance apply to non-agential events.  

  **Crux 3: Is Bratman’s "small group" restriction concealing entity-dependence?**  
  - *Test Counterexample*: A 100-person team collaborates via a shared platform. One anonymous member is silently replaced.  
  - *Bratmanian Prediction*: Joint activity persists if roles/functions are unchanged (no "small group" requirement).  
  - *Gilbertian Prediction*: Joint commitment dissolves for the replaced individual’s commitments (but may persist for the group).  
  - *Stakes*: If Bratman affirms persistence, the AI case is consistent. If not, "small group" is doing hidden work in the AI case.  

  #### **Verbal Dispute Diagnosis**  
  The nine-month debate conflated **"commitment-as-structure"** (Bratman’s interlocking plans) with **"commitment-as-obligation-source"** (Gilbert’s deontic joint commitment). This is purely verbal when discussing *structure* (both agree on functional interdependence). The true clash is whether obligations require:  
  - *Bratman*: Background norms + triggered conditions (e.g., reliance).  
  - *Gilbert*: A constitutive norm of joint commitment.  
  **Neutral Vocabulary Proposal**: Replace "commitment" with:  
  - **"Coordination Scaffold"** (for structural interdependence).  
  - **"Obligation-Ground"** (for normative source).  
  This would have isolated the obligation-source dispute on Day 1.

  ---

  ### **Referee Notes (Not for Signing)**  
  - **Bratmanian Unreasonableness**: Insisting the *AI’s* disappearance isn’t a breach ignores the human’s directed anger at the *AI* (not just the provider). Roles aren’t abstract; they’re filled by entities.  
  - **Gilbertian Unreasonableness**: Denying that non-agential events can dissolve commitments makes the theory fragile in real-world contexts (e.g., death).  
  - **Both Missed**: The "betrayal" suggests the human *anthropomorphized* the AI as a commitment-holder. Neither theory cleanly handles non-persons, but Bratman’s functionalism adapts better.  
  - **Recommendation**: Focus testing on **Crux 2**. If random failure triggers betrayal, Gilbert wins on phenomenology but must address brittleness. If not, Bratman wins but must add a "foreseeability" condition to reliance norms.  

  This document forces acknowledgment of each theory’s explanatory gaps while using the case to isolate falsifiable claims. The next step is empirical: run the test variations with human participants.
