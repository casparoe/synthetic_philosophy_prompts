prompt: |-
  I'm building a system that infers what an agent wants from what it does — inverse RL, basically — and I've been writing down my own gut verdicts on when the inference is legitimate, and they don't add up. Here they are:

  - Delivery drone flies 400m out of its way to dodge a corridor with a ceiling fan. Infer it dislikes fans: fine.
  - Robot attempts a grasp eleven times, fails every time, stops trying. Infer it didn't much want the object: not fine, that's obviously a competence failure, not indifference.
  - Office worker buys the same dull sandwich every day though the good place is two doors down. Infer she prefers dull sandwiches: not fine — she's skint — but I'm loath to just call the budget a preference either.
  - Researcher stops submitting papers after years of rejections. Infer she no longer wants to publish: I want to say not fine, but I can't say how this differs from the sandwich case. The shape looks identical to me.
  - Same researcher, given three quiet years with no rejections, still doesn't submit. Now I do infer she doesn't want to.
  - Rat presses a lever for a solution that makes it ill, and keeps pressing. Infer it wants the solution: fine, oddly, even though it's clearly worse off.

  What principle sits behind all this? I'd like it stated tightly enough that I could implement it as a decision rule, and I want to be told which of these verdicts it forces me to give up rather than having all six saved by special pleading. Also what does it say about a case I haven't listed — an agent acting perfectly sensibly on a badly wrong model of the world? And does the sandwich/researcher difficulty have an established name somewhere else, since it smells like a known trap in economics as well.
reasoning: |-
  Okay, the user is working on an inverse reinforcement learning system to infer agents' preferences from their actions. They've listed several scenarios where their intuition about legitimate inference clashes, and they want a unifying principle that's rigorous enough to implement. Let me break this down.

  First, I need to understand each case they provided. The drone avoiding a ceiling fan seems straightforward—it actively takes a detour, indicating a clear preference to avoid fans. But the robot attempting to grasp an object multiple times and failing—here, the user says inferring indifference is wrong. That makes sense because failure could be due to inability, not lack of desire. Then there's the office worker buying a cheap sandwich despite a better option nearby. The user rejects inferring a preference for dull sandwiches, attributing it to budget constraints. But labeling budget as a preference feels off. The researcher case is tricky. After repeated rejections, stopping submissions seems like giving up, but the user hesitates to infer she no longer wants to publish. However, if she doesn't submit even without rejections, then inferring lack of desire seems valid. The rat pressing a lever despite getting ill is interesting—here, inferring desire for the solution is acceptable even though it's harmful. 

  The key challenge is distinguishing between preferences and constraints (like skill, knowledge, or external factors). The user wants a rule that covers all cases without special pleading. They also mention cases where an agent acts rationally based on a wrong world model. 

  Looking at established concepts, revealed preference theory in economics assumes actions reveal preferences, but it ignores constraints. The user's examples highlight situations where this assumption fails. The competence vs. indifference problem is central—when an agent fails to act, is it because they don't want to or because they can't? The budget constraint in the sandwich case is similar; the worker can't afford the better option, not that she dislikes it. 

  For the researcher, after rejections, stopping could be due to perceived low success probability (constraint), not lack of desire. But if she doesn't submit even without rejections, it's more likely a genuine lack of desire. The rat's case is different—persisting despite negative outcomes might indicate addiction or compulsion, which complicates preference inference. 

  A unifying principle might be: Infer preferences only when actions reveal a stable choice under minimal constraints. Need to operationalize "minimal constraints." The counterfactual approach: What would the agent do if constraints were lifted? But that's hard to observe. Maybe use variation in constraints? For the drone, no constraints—it's actively avoiding. The robot—if it grasps other objects, failure here is skill. The sandwich—if the worker buys better food when paid more, it's budget. The researcher—if she submits when success is likely, rejections were the barrier. 

  The rat's case is problematic because persistence despite harm suggests irrationality or false beliefs. If the rat believes the solution isn't causing illness, then acting on that belief shows a preference, but the belief is wrong. So, the principle must account for the agent's belief model. 

  The user also asks about an agent acting on a wrong world model. Here, inference should consider the agent's beliefs. If they act rationally given their beliefs, we can infer preferences from those actions. 

  The sandwich and researcher cases both involve hidden constraints (budget, perceived rejection probability), which the user intuitively separates. The difference might be in the persistence of the constraint. Budget is stable, so it might be seen as part of the agent's state, while rejection history is a temporary barrier. But that's fuzzy. 

  The user wants to know if this has a name in economics. It's related to the revealed preference critique and the identification problem in structural models, where unobserved constraints confound preference estimation. 

  Implementing a decision rule: Only infer preferences when the agent's action is successful and costly (effort, detours) or when varying constraints show consistent choice patterns. Need data on constraints. In practice, without that, inference is unreliable. 

  For the cases, the rat might be the one to give up. If the rat's persistence is due to addiction, its "preference" isn't stable. Or if it's a false belief, inferring desire for the solution is incorrect—it's the belief that's wrong. 

  So, the core principle: Preference inference is valid only when the agent's action is competent (capable of achieving the outcome) and under accurate beliefs about outcomes and constraints. This forces giving up the rat case as legitimate inference because the rat's false belief about the illness causation invalidates the preference inference for the solution.
answer: |-
  The unifying principle behind your judgments is **Counterfactual Competence Under Accurate Beliefs (CCAB)**: *Preference inference is legitimate only if the agent's action (or inaction) reflects a deliberate choice made while (a) possessing the physical/cognitive competence to achieve alternative outcomes, and (b) holding reasonably accurate beliefs about the causal consequences of those alternatives.* This principle resolves your cases systematically and forces you to abandon one verdict.

  **CCAB Explained & Applied:**

  1.  **Delivery drone dodges fan:** *Legitimate (as you judged).*
      *   *Competence:* Capable of flying both paths.
      *   *Accurate Beliefs:* Correctly associates the fan corridor with damage.
      *   *Counterfactual Choice:* Actively chooses the longer path *despite* the cost (time/energy), revealing a strong negative preference for fans.

  2.  **Robot fails grasp, stops:** *Illegitimate (as you judged).*
      *   *Competence:* **Lacks competence** to achieve the outcome (successful grasp).
      *   *Accurate Beliefs:* (Irrelevant here; failure dominates).
      *   *Counterfactual Choice:* Stopping doesn't reveal low desire; it reveals inability. If it *could* grasp easily but didn't try, *then* indifference could be inferred.

  3.  **Worker buys dull sandwich:** *Illegitimate (as you judged).*
      *   *Competence:* Capable of walking to the good place and buying the sandwich.
      *   *Accurate Beliefs:* Correctly associates the good sandwich with higher cost.
      *   *Counterfactual Choice:* **The constraint (budget) is binding.** Her action reveals she prefers *affording food* over *tastier food at higher cost*, NOT a preference for dullness itself. Calling the budget a "preference" is reductive; it's an external constraint shaping revealed trade-offs. CCAB flags this as confounding constraint with intrinsic preference.

  4.  **Researcher stops after rejections:** *Illegitimate (contra your initial "want to say not fine").*
      *   *Competence:* Capable of writing/submitting papers.
      *   *Accurate Beliefs:**Likely holds accurate belief* that continued submissions under current conditions lead to rejection/pain.
      *   *Counterfactual Choice:**The constraint (high rejection probability/low expected reward) is binding.** Stopping reveals a preference to avoid the *costs* (effort, disappointment) *given* the perceived low success rate, NOT an absence of desire to publish *if success were likely*. This is structurally identical to the sandwich case (binding constraint: budget / low success probability).

  5.  **Researcher doesn't submit in quiet period:** *Legitimate (as you judged).*
      *   *Competence:* Capable of submitting.
      *   *Accurate Beliefs:* Presumably aware no rejections are happening (quiet period).
      *   *Counterfactual Choice:* The major constraint (fear of rejection) is lifted. Inaction now strongly suggests a lack of intrinsic desire to publish *even when the primary disincentive is removed*. CCAB distinguishes this from case 4 due to the changed constraint environment.

  6.  **Rat presses lever despite illness:** *Illegitimate (you must give this verdict up).*
      *   *Competence:* Capable of pressing/not pressing.
      *   *Accurate Beliefs:**Lacks accurate belief* about the causal link between the solution and illness (e.g., temporal delay, addiction masking cause).
      *   *Counterfactual Choice:* The action is based on a *false belief* about consequences. The rat likely desires the *immediate reward* of the solution but *would not* press if it accurately believed it caused illness. Inferring "wants the solution" ignores the false belief; it conflates desire for the immediate effect with desire for the full, harmful outcome. CCAB invalidates this inference.

  **The Principle Forced You To Give Up:** Your verdict on the **Rat** case (#6). CCAB shows this inference is illegitimate due to inaccurate beliefs.

  **The Sandwich/Researcher Difficulty:** This is the **Identification Problem** in revealed preference theory and structural economics. It's the fundamental challenge of distinguishing *intrinsic preferences* from the *effects of constraints* (budget, prices, institutional rules, perceived probabilities) using only observed choices. Your intuition correctly flags cases 3 & 4 as problematic for pure revealed preference. CCAB explicitly handles this by requiring the *absence* of binding constraints confounding the choice for the inference to be about intrinsic preferences. The difference between 4 and 5 is the *change in the constraint environment* allowing the intrinsic preference to be revealed.

  **Agent Acting Sensibly on a Wrong World Model:**
  *   **CCAB Verdict:** *Illegitimate* inference about their true preferences regarding the *actual* outcomes.
  *   **Reason:** Their actions reveal preferences *only* about the *consequences as they (mistakenly) believe them to be*. You can infer their preference over *their perceived outcome states*, but not over the *actual outcome states*.
  *   **Example:** An agent avoids a harmless chemical because they falsely believe it's poisonous. CCAB lets you infer they have a negative preference for *exposure to what they believe is poison*. It does *not* let you infer they have a negative preference for the *actual harmless chemical*. Their preference regarding the real world state is obscured by their false belief.
  *   **Implementation:** To infer preferences over real outcomes, you need evidence of accurate beliefs *or* a model of their belief inaccuracy to "correct" the revealed preference.

  **Implementing CCAB as a Decision Rule:**

  ```python
  def infer_preference_legitimate(observation, agent_model, environment_model):
    """
    observation: {action (or inaction), outcome, context}
    agent_model: Info on agent's known capabilities, learning history, typical belief accuracy.
    environment_model: Known constraints, dynamics, alternative actions/outcomes.

    Returns: True if CCAB suggests legitimate preference inference from this observation.
    """

    # 1. Check Competence for Alternatives
    alternative_actions = get_plausible_alternatives(observation, environment_model)
    competence_failure = False
    for alt_action in alternative_actions:
        if not is_agent_competent(alt_action, agent_model, environment_model):
            competence_failure = True
            break
    if competence_failure:
        return False  # Inaction/Failure likely due to inability, not preference.

    # 2. Check Belief Accuracy (Heuristic - often needs external evidence)
    if not has_accurate_beliefs(observation, agent_model, environment_model):
        return False  # Action based on false expectations, not true preferences.

    # 3. Check Counterfactual Choice (Implied by 1 & 2 + Observation)
    # If agent is competent and has accurate beliefs, their chosen action 
    # reveals a deliberate preference ranking over the *actual* outcomes 
    # achievable by the plausible alternatives.
    return True

  # Helper functions need domain-specific implementation:
  #   get_plausible_alternatives(): What other actions were feasible/known?
  #   is_agent_competent(): Can the agent reliably execute the action to achieve its intended outcome here?
  #   has_accurate_beliefs(): Does the agent correctly understand the outcomes linked to actions? (May require historical data, learning signals, or known common inaccuracies)
  ```

  **Key Takeaways:**

  1.  **CCAB is Core:** Preferences are only revealed in choices made competently and knowledgeably.
  2.  **Constraints vs. Preferences:** Failure to act often signals binding constraints (like budget or low success probability), not indifference. CCAB forces this distinction.
  3.  **Beliefs Are Crucial:** Actions reveal preferences over *believed* outcomes. False beliefs invalidate inferences about *actual* outcomes. The Rat case fails here.
  4.  **Identification Problem:** The sandwich/researcher ambiguity is a core challenge in revealed preference economics. CCAB addresses it by demanding the *absence* of confounding constraints for intrinsic preference inference.
  5.  **Implementation Challenge:** Operationalizing "Competence" and especially "Accurate Beliefs" requires domain knowledge, historical data, or models of the agent's learning process. It's often easier to identify *violations* of CCAB (like clear incompetence or known false beliefs) than to definitively prove adherence.
