prompt: |-
  I run patient safety and clinical risk for a regional health network — roughly 1,900 clinical staff across four hospitals — and over the last two years we have put a handful of algorithmic decision-support tools into routine use: an early-warning score for sepsis, a triage flag on chest imaging, a readmission-risk score that feeds the discharge workflow, and a dosing suggestion in the ICU. Our incident review committee is six people (two physicians, two nurses, a pharmacist, an informaticist, me), we meet weekly, and we review about thirty events a quarter, of which three or four now have one of these tools somewhere in the causal chain. The committee works from a conventional root-cause template: reconstruct the timeline, ask at what point the harm could have been prevented, list contributing factors, and close with a named individual who owns each corrective action. That template worked when the chain ran through people. It is failing on the tool cases, in three specific ways, and I have not been able to fix it by rewriting the form. First, the "at what point could this have been prevented" question always finds a clinician, because the clinician is usually the only node with a logged, timestamped discretionary act — so the review ends up blaming the one person who actually exercised judgment, a pattern my nursing leads have started calling the last-nurse rule, and I cannot defend it to them. Second, when we try to move the finding upstream we hit a wall: the model's thresholds are changed by a vendor engineer under a contract that gives us notice but not approval, some configurations were set by a consultant who no longer works here, and the drift-monitoring duty is written into three job descriptions, which in practice means nobody. Third, when the causal story is genuinely distributed, the template's only remaining exit is to write a systems issue and hand a corrective action to IT, which the committee knows is a euphemism and which our regulator will not accept, since it requires a single accountable executive for every serious-event review.

  What I want is a procedure my committee can actually run on a tool-involved event in ninety minutes, with no legal training in the room and no philosophers on it. My own half-formed hunch, from what reading I have managed, is that our template is collapsing several different things that are all called responsibility — the causal sense, the sense in which something falls within a person's role, the sense that requires that the person was competent and had a real option, and the sense that carries blame — and that the reason the review lands badly is that it enters through one of these and exits through another without saying so. Build the procedure on whatever distinctions of that kind are actually load-bearing rather than on my guess, but keep the vocabulary plain enough for a tired nurse at 4 p.m. I want the questions in the order the committee should ask them, what counts as a sufficient answer to each, and explicit stop conditions: where the procedure terminates in a named locus of responsibility, where it terminates in an organizational one, and where it terminates in no locus at all. That last outcome is the one I care most about, so please develop it: if the review finds a genuine gap, the procedure should tell us what kind of gap it is — a gap in who can be blamed, in who can answer publicly for what happened, in who has the standing capacity to have done otherwise, or in who can be made to repair the harm — and it should map each kind to a different institutional response, because I suspect the responses are not interchangeable: a no-blame finding, a compensation route that does not depend on fault, suspending or re-gating the tool's use, reopening the contract, referring the case outward, and so on. It should also say how to get from a distributed causal story to the one signature our regulator demands without manufacturing a scapegoat, and how the same findings can support a disclosure conversation with a family that wants a name without turning into an admission the lawyers will fight.

  Then run it on three cases from the last eighteen months, lightly disguised. Case one: a sepsis alert fired on a medical-surgical patient, the bedside nurse documented dismissing it as an artifact because the patient looked well, and the patient deteriorated overnight and was resuscitated; the alert had fired more often than usual because a vendor update six weeks earlier had lowered the threshold, which no one at our end approved, tested, or noticed, and her onboarding module had told her these alerts should be taken seriously. Case two: a patient discharged as low risk was readmitted within a week; the readmission model consumed a social-determinants field that had been silently empty since a records migration, so it had been mis-ranking a subset of patients for months; nobody overrode anything, the drift monitoring was unassigned in practice, and on the base rate the readmission was more likely than not to have happened anyway. Case three: an ICU dosing suggestion performed exactly as designed and as documented in the vendor's validation report, and the harm was the trade-off that was chosen deliberately at procurement — fewer hypotensive episodes, more of a different complication — by a committee whose members have nearly all left the organization; nobody here did anything wrong and nothing malfunctioned. In at least one of the three, I expect the procedure to land somewhere I will not like, most plausibly on a named clinician; if so, say plainly that it does and explain why the procedure does not dissolve that finding, rather than quietly steering around it.

  Two final constraints. Mark every step that is a judgment call dressed as procedure — I would rather see those flagged than have them hidden inside a flowchart that looks mechanical — and tell me what the procedure cannot do: where it cannot distinguish a real gap from blame diffusion, where it breaks down if the tool's contribution to the outcome is unquantifiable, and where it produces an answer that is defensible but not something I would want read aloud to a family. I do not need citations or a bibliography; refer to positions, arguments, and criteria in your own words and I will track down sources myself. What I need is the worksheet the committee could fill in during the meeting.
reasoning: |-
  We are designing a new incident review procedure for cases involving algorithmic tools. The procedure must address the shortcomings of the current root-cause template: 
    1. The "last nurse rule" problem (blaming the clinician who exercised judgment).
    2. The difficulty in moving upstream due to vendor contracts, unclear ownership, and distributed responsibilities.
    3. The inadequate "systems issue" handoff to IT.

  The procedure must:
    - Be executable in 90 minutes by a committee without legal training.
    - Use plain language.
    - Sequence questions logically.
    - Define sufficient answers and stop conditions.
    - Identify the locus of responsibility (named individual, organizational, or none) and the type of gap if none.
    - Map each type of gap to an institutional response.
    - Provide a way to assign a single accountable executive for regulators without scapegoating.
    - Support disclosure conversations without creating legal admissions.

  We break the procedure into phases:

  Phase 1: Event Reconstruction
  Phase 2: Causal Analysis
  Phase 3: Responsibility Assignment
  Phase 4: Corrective Actions and Disclosure

  Each phase has specific questions, stop conditions, and outputs.

  We also define key distinctions (in plain terms):
    - **Causal contribution**: Did this factor play a part in causing the harm?
    - **Role responsibility**: Whose job was it to handle this?
    - **Blameworthiness**: Did the person (or entity) do something wrong? (requires fault: e.g., negligence, recklessness, intentional harm)
    - **Answerability**: Who must explain what happened (even if not at fault)?
    - **Capacity to have done otherwise**: Could the person/entity reasonably have acted differently?
    - **Repair responsibility**: Who must fix the harm and prevent recurrence?

  The procedure must not collapse these.

  ---

  **Procedure Worksheet for Algorithmic Tool-Involved Events**

  **Phase 1: Event Reconstruction (15 minutes)**
  Goal: Establish the timeline and the tool's role.

  1. What was the intended clinical workflow? (Include the tool's designed role.)
     - Sufficient answer: A step-by-step description of how the tool was supposed to be used in this context.

  2. What actually happened? (Timeline with key events, including tool inputs/outputs and human actions/decisions.)
     - Sufficient answer: A chronological list of events, including:
          - Tool inputs (data fed to the tool) and outputs (alert, score, suggestion).
          - Human actions (e.g., dismissal of alert, override, inaction).
          - Patient outcome.

  3. At what point did the harm become inevitable? (This replaces "at what point could it have been prevented" to avoid premature blame.)
     - Sufficient answer: The latest event after which the harm could not have been avoided by any reasonable action.

  *Stop condition for Phase 1*: The committee agrees on the timeline and the point of inevitability. If not, note the disagreement and proceed.

  **Phase 2: Causal Analysis (25 minutes)**
  Goal: Identify causal factors without assigning blame.

  4. Which factors contributed to the harm? (List all: tool, human, organizational, external.)
     - Include:
          - Tool factors (e.g., incorrect output due to data error, model drift, threshold change).
          - Human factors (e.g., dismissal of alert, lack of override).
          - Organizational factors (e.g., training, monitoring, vendor management).
          - Patient factors (e.g., complex condition).
     - Sufficient answer: A list of factors that, if absent, might have changed the outcome.

  5. For the tool's contribution:
     a. Was the tool functioning as designed? (Check against vendor specs and validation.)
     b. If not, why? (e.g., data drift, configuration change, bug.)
     c. Was the tool's output reasonable given its design and inputs? (Even if it was wrong in hindsight.)

  6. For human actions:
     a. Was the action (or inaction) within the range of reasonable choices at the time? (Consider workload, information available, training.)
     b. Did the human have the necessary information and authority to act differently?

  7. Was the harm caused by:
     - A single factor? (Rare)
     - A chain of factors? (Which one was the most decisive?)
     - A confluence of factors? (No single decisive factor)

  *Stop condition for Phase 2*: The committee agrees on the causal factors and their nature. If the tool's contribution is unquantifiable (e.g., in case 2 where the base rate was high), note that and proceed.

  **Phase 3: Responsibility Assignment (30 minutes)**
  Goal: Assign types of responsibility and identify gaps.

  8. For each causal factor, ask:
     a. **Causal contribution**: Already established in Phase 2.
     b. **Role responsibility**: Whose job was it to manage this factor? (Be specific: e.g., for a tool threshold change, the vendor under contract? the IT department? a clinical committee?)
        - If unclear, note: "Role gap: nobody assigned."
     c. **Capacity to have done otherwise**: Could the responsible party (from 8b) have reasonably taken action to prevent this factor?
        - Consider: Did they have the knowledge, resources, authority, and time?
        - If not, note: "Capacity gap."
     d. **Blameworthiness**: If the responsible party had the capacity to act (8c) but failed to, was that failure unreasonable? (e.g., negligence, recklessness)
        - If no capacity (8c=no), then blameworthiness does not apply.
        - If the action was reasonable at the time, then not blameworthy.

  9. Overall:
     - Is there a named individual who is blameworthy? (If yes, note who and why. If no, state "no blameworthy individual".)
     - Is there an organizational entity that is blameworthy? (e.g., for systemic failures in training, monitoring, vendor management.)
     - If no blameworthy individual or entity, what kind of gap exists?
          - **Blame gap**: No one is at fault (e.g., case 3: harm from known trade-off).
          - **Answerability gap**: No one is designated to explain (e.g., vendor changed threshold without notice).
          - **Repair gap**: No clear owner for fixing the problem (e.g., drift monitoring unassigned).
          - **Role gap**: The task wasn't assigned to anyone.

  10. For regulatory reporting: Who is the single accountable executive?
      - This is not about blame but about organizational answerability. Choose the executive whose portfolio includes the area where the most significant gap occurred (e.g., Chief Medical Officer for clinical tool governance, CIO for IT infrastructure). If multiple, pick the one with the broadest responsibility.
      - *Judgment call*: This step is inherently organizational. The committee must justify why this executive is the appropriate public answerer.

  **Phase 4: Corrective Actions and Disclosure (20 minutes)**
  Goal: Assign actions and plan disclosure.

  11. Corrective actions:
      - Map gaps to institutional responses:
          - **Blame gap** (no fault): No-blame finding; consider compensation without fault (e.g., for known trade-offs).
          - **Answerability gap**: Assign an answerer (e.g., vendor management to CMO); consider contract renegotiation.
          - **Repair gap**: Assign ownership for the task and fix the process (e.g., assign drift monitoring).
          - **Role gap**: Define and assign the role.
          - **Systemic organizational blame**: Organizational remediation (e.g., retraining, process redesign).
          - **Individual blame**: Disciplinary action (if any) plus system fixes to prevent recurrence.

      - Assign each corrective action to a named owner (individual or department) and a timeline.

  12. Disclosure to family:
      - Prepare a script that:
          - Separates facts (what happened) from responsibility assignments (which are internal).
          - For blame gaps: Explain that no one is at fault, but the system will be improved.
          - For known trade-offs: Explain the decision and the unfortunate outcome.
          - Avoid naming individuals to families (unless required by law or policy) to prevent scapegoating. Instead, name the organization's commitment.

  *Stop conditions*:
    - The procedure terminates with:
        a. Named locus (if blameworthy individual found) -> corrective actions including individual accountability.
        b. Organizational locus (if systemic issue) -> corrective actions at system level.
        c. No locus (gap identified) -> institutional response as above.

    - The procedure cannot resolve:
        - Cases where the tool's causal contribution is speculative (unquantifiable and not verifiable). In such cases, the committee must note the uncertainty and may recommend suspending the tool pending further review.
        - Cases where the harm was inevitable regardless of actions (then the outcome is "no locus" with a blame gap).
        - It may produce a defensible answer that is hard to explain to a family (e.g., "the tool was designed to accept this risk") — the script must be carefully worded.

  ---

  **Run the procedure on the three cases:**

  **Case 1: Sepsis Alert Dismissed**
  - *Phase 1*: 
      - Intended: Alert fires -> nurse assesses patient -> escalates if concerned.
      - Actual: Alert fired (due to lowered threshold from vendor update), nurse dismissed because patient looked well, patient deteriorated.
      - Harm inevitable: When deterioration was not detected overnight (but earlier intervention might have helped).

  - *Phase 2*:
      - Factors: 
          - Tool: Threshold lowered without approval/testing -> caused more frequent alerts.
          - Human: Nurse dismissed alert despite training to take alerts seriously.
          - Organizational: No process to review vendor updates; no monitoring of alert performance.
      - Tool: Not functioning as originally designed (threshold changed), but output was "correct" per new threshold. Output reasonable? Nurse didn't know threshold changed -> her dismissal was reasonable based on past experience (alerts were less sensitive before).
      - Human action: Dismissal was reasonable? At the time, patient looked well -> within range. But training said "take seriously" — did she violate protocol? If protocol required assessment and documentation, and she did assess, then her judgment call was within bounds.

  - *Phase 3*:
      - Role responsibility:
          - Threshold change: Vendor under contract? But contract didn't require approval. Our organization: who owns monitoring configuration changes? (Unassigned -> role gap).
          - Nurse: Role to assess and act — she did, and her action was reasonable -> not blameworthy.
          - Alert monitoring: Unassigned -> role gap.
      - Capacity: 
          - Vendor had capacity to change threshold, but contract allowed it -> not our blame. We had no capacity to stop it because contract didn't require approval -> organizational capacity gap.
          - Nurse had capacity to escalate but reasonably chose not to -> no blame.
      - Blameworthiness: No individual blame. Organizational blame for not having a process to manage vendor updates and monitor configurations? (If the organization should have had such a process, then yes, but this is systemic).
      - Gap: Role gap (no owner for configuration monitoring) and answerability gap (vendor changed without our input).
      - Accountable executive: CMO or CIO (for clinical tool governance and vendor management).

  - *Phase 4*:
      - Corrective: 
          - Fix role gap: Assign configuration monitoring to a specific team (e.g., clinical informatics).
          - Fix contract: Renegotiate to require approval for changes.
          - No disciplinary action for nurse.
      - Disclosure: "The alert system had recently been updated, which we did not detect. The nurse assessed you and saw no cause for concern at the time. We are changing how we manage updates to prevent this."

  **Case 2: Readmission Model with Missing Data**
  - *Phase 1*:
      - Intended: Model uses complete data -> predicts risk -> discharge planning.
      - Actual: Data field empty since migration -> model mis-ranked patient as low risk -> discharged -> readmitted.
      - Harm inevitable: At discharge without adequate support (but if model had worked, might have been prevented).

  - *Phase 2*:
      - Factors:
          - Tool: Used empty field -> incorrect output.
          - Organizational: No one monitoring data drift; migration issue not caught.
          - Note: Base rate high -> readmission might have happened anyway (unquantifiable?).
      - Tool: Not functioning as designed (required complete data). Output unreasonable? Yes, because input was flawed.
      - Human: No override because no alert — not their role.

  - *Phase 3*:
      - Role responsibility:
          - Data quality monitoring: Unassigned -> role gap.
          - Migration validation: Should have been assigned -> role gap.
      - Capacity: No one had the task -> capacity gap (they couldn't have done it because it wasn't their job).
      - Blameworthiness: No individual blame (nobody overrode because they didn't know). Organizational blame for not assigning monitoring? Yes, if it was a known risk.
      - Gap: Role gap and repair gap (no one to fix data quality).
      - Accountable executive: CIO (data governance) or CMO (discharge process).

  - *Phase 4*:
      - Corrective: Assign data drift monitoring; audit migration processes; consider compensating the patient due to system failure (even if base rate high).
      - Disclosure: "Our system failed to use important information about your situation, which led to inadequate discharge planning. We are fixing the system."

  **Case 3: ICU Dosing Trade-off**
  - *Phase 1*:
      - Intended: Tool suggests dose to reduce hypotension -> clinician uses it -> trade-off: less hypotension, more of another complication.
      - Actual: Tool suggested dose, clinician used it, complication occurred.
      - Harm inevitable: When the dose was administered (the trade-off was known and accepted).

  - *Phase 2*:
      - Factors:
          - Tool: Functioned as designed and validated.
          - Human: Used tool appropriately.
          - Organizational: Procurement committee chose the trade-off (but they are gone).
      - Tool and human actions: All reasonable.

  - *Phase 3*:
      - Role responsibility:
          - Procurement committee: Made the trade-off decision -> but they are gone. The organization owns the decision.
          - Current clinicians: Followed protocol -> no issue.
      - Capacity: The committee had capacity and made a deliberate choice. The clinician had no capacity to change the tool's design.
      - Blameworthiness: No one. The harm was a known and accepted risk.
      - Gap: Blame gap (no fault) but answerability gap (who explains the trade-off now?).
      - Accountable executive: CMO (as clinical leader).

  - *Phase 4*:
      - Corrective: 
          - No-blame finding.
          - Compensation? If the trade-off was not adequately disclosed to patients, consider compensation without fault.
          - Review current trade-offs and ensure disclosure to patients.
      - Disclosure: "This treatment has a known risk of [complication], which we accepted because it reduces [other risk]. Unfortunately, it occurred in your case. We are reviewing our consent process to ensure patients understand this."

  ---

  **Limitations and Judgment Calls Flagged:**

  - **Judgment calls**:
     - Phase 2, Q6a: What is "reasonable" for a human action? (Requires committee judgment; use training, policies, and expert opinion.)
     - Phase 3, Q8b: Assigning role responsibility when roles are unclear. (Committee must decide based on job descriptions and organizational charts.)
     - Phase 3, Q10: Choosing the accountable executive. (Subjective; based on the committee's view of the most significant gap.)
     - Phase 4: Mapping gaps to institutional responses. (Not prescriptive; requires tailoring.)

  - **What the procedure cannot do**:
     - It cannot assign blame if the causal contribution of the tool is unquantifiable (e.g., case 2 base rate) — then it defaults to system fixes and possible compensation without fault.
     - It might not prevent the committee from blaming a clinician if they violated a clear protocol without justification (but the procedure requires assessing reasonableness at the time).
     - It produces answers that are hard to explain to families in cases of trade-offs (blame gap) — the script must be handled carefully by trained communicators.
     - It does not dissolve a finding of individual blame if the clinician was truly at fault (e.g., reckless dismissal of an alert without assessment). But the procedure requires that the action was unreasonable at the time.

  In Case 1, the procedure does not land on the nurse as blameworthy because her action was reasonable. The finding is organizational. In Case 3, no one is blamed. Case 2 also has no individual blame. This avoids the "last nurse rule". 

  If the committee found that the nurse in Case 1 had violated protocol (e.g., by not assessing the patient at all) and that was unreasonable, then she might be blameworthy. The procedure does not dissolve that — it would be a valid finding. But in the case as described, she did assess and used her judgment, so no blame.

  The procedure provides a structured way to avoid scapegoating by separating causal contribution from blameworthiness and by emphasizing reasonableness at the time. It also provides a path for the regulator by assigning an accountable executive for answerability, not necessarily blame.
answer: |-
  Below is a procedural framework designed for your incident review committee, addressing the specific failures of your current root-cause template. It disentangles the four types of responsibility (**causal**, **role-based**, **blameworthy**, and **repair**) and provides clear stop conditions. The procedure is structured as a sequential worksheet with plain-language questions, explicit judgment flags, and limitations noted. It works within your 90-minute constraint and requires no specialized expertise.

  ---

  ### **Algorithmic Tool-Involved Incident Review Worksheet**  
  *Complete phases in order. Timebox each phase. If consensus isn’t reached, document dissent and proceed.*

  ---

  #### **PHASE 1: RECONSTRUCT WHAT HAPPENED**  
  *(15 min | Objective: Establish facts without implying fault)*  
  1. **What was the intended workflow?**  
     *Sufficient answer:* Describe the expected sequence of actions (tool + human).  
     *Example:* "Sepsis alert fires → nurse assesses patient → escalates if criteria met."  

  2. **What actually happened?**  
     *Sufficient answer:* Chronological timeline with:  
     - Tool inputs/outputs (e.g., "Alert fired at 14:00; output: 'high risk'").  
     - Human actions (e.g., "Nurse documented: 'Patient stable; alert dismissed'").  
     - Outcome (e.g., "Patient coded at 04:00").  

  3. **Did the tool function as designed?**  
     *Sufficient answer:* Yes/no + evidence (e.g., vendor specs, validation reports).  
     *Stop if:* Tool malfunctioned (e.g., bug, data corruption). *Action:* Refer to IT/vendor.  

  **Phase 1 Output:** Uncontested timeline + tool performance status.  
  *Judgment call:* Deciding "as designed" requires comparing tool behavior to vendor documentation.  

  ---

  #### **PHASE 2: IDENTIFY CONTRIBUTING FACTORS**  
  *(25 min | Objective: Map all causes without assigning blame)*  
  4. **List all factors that contributed to harm:**  
     - **Tool factors** (e.g., threshold change, missing data, design trade-offs).  
     - **Human factors** (e.g., dismissal, override, inaction).  
     - **System factors** (e.g., training gaps, unassigned monitoring, contract terms).  

  5. **For each factor, ask:**  
     - **Was this factor knowable beforehand?**  
       *Sufficient answer:* Yes (if routine monitoring should catch it) / No (if unforeseeable).  
     - **Did it fall into a gap in ownership?**  
       *Sufficient answer:* "Yes, [specific task] is unassigned" or "No, [role] owns it."  

  **Phase 2 Output:** List of contributing factors categorized as:  
  - **Controllable** (knowable + owned) → Proceed to Phase 3.  
  - **Uncontrollable** (unknowable/unowned) → Skip to Phase 4.  
  *Judgment call:* "Knowable" hinges on reasonable expectations (e.g., should staff notice alert drift?).  

  ---

  #### **PHASE 3: ASSESS BLAMEWORTHINESS**  
  *(30 min | Objective: Determine if any party is at fault)*  
  6. **For each human actor in the timeline:**  
     - **Did they have a real choice?**  
       *Sufficient answer:* Only if:  
       - They had **authority** to act (e.g., override tool).  
       - They had **capacity** (time, knowledge, resources).  
       - They had **accurate information** (e.g., tool limitations weren’t hidden).  
       *Stop if:* No real choice → Not blameworthy. Proceed to systems.  

  7. **Was their action unreasonable?**  
     *Sufficient answer:* Only if:  
     - They violated **clear, trained protocols** (e.g., ignored mandatory escalation).  
     - Their decision **deviated grossly** from peer standards (e.g., dismissed alert without assessment).  
     *Stop if:* Action was reasonable given context → Not blameworthy.  

  8. **For upstream factors (vendors, configs, monitoring):**  
     - **Who had role responsibility?** (Check contracts/job descriptions.)  
     - **Did they fail unreasonably?** (e.g., vendor changed thresholds without notice; unassigned drift checks).  
     *Stop if:* Failure is systemic (e.g., "three people half-owned it") → Mark as organizational gap.  

  **Phase 3 Output:**  
  - **Named blameworthy party** (if 6 + 7 are "yes").  
  - **No blameworthy party** (if no one passes 6 + 7).  
  *Judgment call:* Assessing "unreasonable" requires comparing actions to peer norms.  

  ---

  #### **PHASE 4: ASSIGN REPAIR & RESPONSE**  
  *(20 min | Objective: Define fixes and disclosure)*  
  9. **Locus of responsibility:**  
     - **Named individual** (if blameworthy in Phase 3).  
     - **Organizational unit** (if role gaps/systemic failures).  
     - **No locus** (if harm was unavoidable or genuinely unforeseeable).  

  10. **Type of gap (if no locus):**  
      | **Gap Type** | **Definition** | **Institutional Response** |  
      |--------------|----------------|----------------------------|  
      | **Blame gap** | No one at fault (e.g., known trade-off). | Suspend tool; compensate victim; re-consent patients for trade-offs. |  
      | **Answerability gap** | No one can explain (e.g., vendor black box). | Refer to regulator/vendor; revise contracts; require transparency. |  
      | **Repair gap** | No one can fix (e.g., unassigned monitoring). | Assign ownership; redesign workflow; audit similar tools. |  
      | **Capacity gap** | No one could have acted (e.g., data silently missing). | Fix system flaw; no-blame disclosure; compensate without fault. |  

  11. **For regulators:** Assign the **accountable executive** for the report:  
      - If **blameworthy individual** → Their direct supervisor.  
      - If **organizational** → Owner of the deficient area (e.g., CMO for clinical tools).  
      - If **no locus** → Executive best positioned to answer publicly (e.g., CEO for systemic failures).  
      *Rationale:* Separates accountability (answering regulators) from blame.  

  12. **For disclosure to families:**  
      - **If no blame:** "Our systems failed you, not a person."  
      - **If blameworthy clinician:** "The staff member deviated from our standards; we are addressing it."  
      - **Never disclose:** Upstream gaps (e.g., vendor issues) unless legally required.  

  **Phase 4 Output:** Corrective actions + disclosure script + regulator signature.  

  ---

  ### **APPLICATION TO YOUR CASES**  
  *(Using the procedure above)*  

  #### **CASE 1: SEPSIS ALERT DISMISSED**  
  - **Phase 1:** Alert fired (due to vendor’s unapproved threshold change); nurse dismissed; patient deteriorated. Tool worked "as designed" post-update.  
  - **Phase 2:** Factors: Threshold change (unknowable to nurse), dismissal (knowable), unassigned monitoring (gap).  
  - **Phase 3:**  
    - Nurse had real choice but action was *reasonable* (patient looked well; past alerts were noisy). → Not blameworthy.  
    - Threshold change: Vendor role, but contract didn’t require approval → Answerability gap.  
    - Monitoring unassigned → Repair gap.  
  - **Phase 4:**  
    - **Locus:** Organizational (CMO for clinical tool governance).  
    - **Gaps:** Answerability (vendor) + Repair (monitoring).  
    - **Actions:** Renegotiate contract; assign monitoring; no nurse discipline.  
    - **Disclosure:** "Our alert system updated without proper safeguards; we’re fixing this."  
    **Regulator executive:** CMO.  

  #### **CASE 2: READMISSION MODEL MISSING DATA**  
  - **Phase 1:** Model used empty social-determinants field; discharged as "low risk"; readmitted.  
  - **Phase 2:** Factors: Silent data failure (unknowable), no drift monitoring (unassigned), no override (no human action).  
  - **Phase 3:**  
    - No human actor had a real choice (no override prompted).  
    - Data failure: Role gap (no owner post-migration).  
  - **Phase 4:**  
    - **Locus:** Organizational (CIO for data integrity).  
    - **Gaps:** Repair (data monitoring) + Capacity (couldn’t act on unknown flaw).  
    - **Actions:** Assign data steward; audit migrations; compensate victim.  
    - **Disclosure:** "Our system failed to use your data properly."  
    **Regulator executive:** CIO.  

  #### **CASE 3: ICU DOSING TRADE-OFF**  
  - **Phase 1:** Tool performed as designed; harm from accepted trade-off (fewer hypotensive episodes, more complications).  
  - **Phase 2:** Factors: Deliberate procurement choice (knowable), no malfunction.  
  - **Phase 3:**  
    - Clinician followed protocol → Not blameworthy.  
    - Procurement committee gone → Answerability gap.  
  - **Phase 4:**  
    - **Locus:** No locus (blame gap).  
    - **Gaps:** Blame gap (known trade-off).  
    - **Actions:** Suspend tool; re-evaluate trade-off; compensate without fault; update consent forms.  
    - **Disclosure:** "This was a known risk of the treatment; we regret it happened."  
    **Regulator executive:** CMO (as clinical leader).  

  ---

  ### **WHAT THIS PROCEDURE CANNOT DO**  
  1. **Distinguish blame diffusion from real gaps:**  
     - If your committee culture avoids tough calls, Phase 3 (blameworthiness assessment) may be misused to label preventable errors as "capacity gaps." Mitigation: Require evidence for "no real choice" claims.  

  2. **Unquantifiable tool contributions:**  
     - If the tool’s causal role is ambiguous (e.g., Case 2’s "base rate" issue), the procedure defaults to **organizational repair** (fix what’s fixable) but cannot resolve uncertainty. Outcome may be overcompensation.  

  3. **Defensible but unpalatable outcomes:**  
     - In Case 3, the "no locus" finding may frustrate families wanting accountability. The disclosure script ("known risk") is legally safe but may feel dismissive.  

  4. **Forcing a named clinician:**  
     - If a clinician unreasonably deviates from protocol (e.g., ignores five alerts), Phase 3 *will* assign blame. The procedure doesn’t dissolve this—it reflects that individual agency exists.  

  ---

  ### **PROCEDURE SUMMARY**  
  - **Strengths:**  
    - Ends "last-nurse rule" by requiring proof of choice + unreasonableness.  
    - Forces gaps into actionable categories (answerability/repair/blame).  
    - Meets regulator demands via executive assignment without scapegoating.  
  - **Weaknesses:**  
    - Depends on committee rigor in Phase 3 (judgment-heavy).  
    - Cannot eliminate compensation costs in "no locus" cases.  

  **Final Output:** A completed worksheet with:  
  - Timeline → Factors → Blame assessment → Gap type → Actions → Disclosure script → Executive sign-off.  

  This framework distributes causality while concentrating accountability where it can drive change. I recommend piloting it on one case and refining based on committee feedback.
