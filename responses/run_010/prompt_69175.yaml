prompt: |-
  I want to nail down what a theory of higher-order evidence actually has to deliver before I start adjudicating between the ones on offer, so: write me the specification, the list of requirements any adequate account of "what should I believe when I get evidence that my believing was compromised" has to meet, with the case or consideration standing behind each one.

  By cases I mean things like: you find out you were reasoning while badly sleep-deprived; you're told a pill you took an hour ago reliably degrades exactly the kind of inference you just made; a friend you rate as your epistemic equal on the question tells you flat out that you got it wrong; you learn the person who told you that is a paid contrarian whose job is to shake your confidence in whatever you conclude; you discover you were moved to a different table in a restaurant and can no longer recall which bill you actually checked; you learn that a long stretch of your past reasoning on this topic was done while infatuated. I want to know which of those a theory must get right and which it's allowed to bracket, and why.

  Same for the distinctions it can't collapse — evidence about your performance on this token judgment vs evidence about your general competence at this type, evidence bearing on how you gathered your evidence vs evidence bearing on what the world is like, evidence that's self-locating vs evidence that's straightforwardly propositional, "you're unreliable here" vs "you went wrong" vs "you're being overconfident", a genuine undercutting defeater vs a mere reason to lower confidence, and having a reason to doubt p vs having a reason to doubt your believing p. If you think a distinction on that list is fake, say so and say which, that's fine, but then explain what a theory should do with the cases people use it for.

  And the background results it can't just contradict: whatever the preface paradox and the lottery cases show about consistency norms, the fact that a belief plus "my belief-forming was shot" sounds Moore-paradoxical but isn't strictly a contradiction, ordinary conditionalization and what it does and doesn't let you do with self-doubt, the enkratic requirement and the standing objections to it, and the self-undermining worry that pops up when a theory's own verdicts are fed back in as evidence.

  Two more things I want from you. First, there's a requirement I think is floating around that nobody has stated cleanly, and I want your version of it plus a verdict on whether it's real: something about a theory needing to be usable in the moment, i.e. it has to tell the agent what to do from inside the very reasoning capacity whose reliability is in question, without either silently trusting that capacity or collapsing into "suspend everything forever." Call it in-the-moment actionability or whatever you like, define it precisely, give the case that forces it, and say whether it's a genuine desideratum or an excuse for dogmatism dressed up as a constraint. Second, mark every requirement as non-negotiable or as a prejudice of a particular camp, and if some subset turns out to be jointly unsatisfiable — say, responsiveness to real higher-order evidence plus non-gullibility in the face of manufactured doubt plus non-question-begging assessment — say so plainly and point at which one has to give, because that's the part I most want to see. Also tell me which single requirement knocks out the most candidates.

  End with a couple of sentences, no more, on how the three or four big families of answers do against the list, and don't bother with a full scorecard.

  Finally: give me your confidence for the main claims you're making, and single out the one item on the list you're least sure belongs there at all and why.
reasoning: |-
  Okay, let me unpack this user's request. They're clearly deep into epistemology, specifically the puzzle of higher-order evidence (HOE) - how to adjust beliefs when you get evidence that your own reasoning might be flawed. This isn't a surface-level query; they want the full architecture of what makes a HOE theory viable before evaluating existing options. 

  First impression: this user has battle-tested examples ready (sleep deprivation, epistemic peers, manipulated doubts) and sharp conceptual distinctions (token vs type evidence, undercutting vs lowering confidence). They're not just collecting opinions - they're stress-testing frameworks. The demand for "specification" suggests they want something like engineering requirements for a robust HOE model.

  Hmm, the real challenge here is balancing their three layers: 
  1) Concrete cases (must explain why the sleep-deprived inference is suspect but the paid contrarian might be ignorable)
  2) Conceptual boundaries (can't collapse genuine undercutters into mere confidence-reducers) 
  3) Meta-constraints (no self-undermining, must be "in-the-moment actionable")

  The user's sharpest insight might be their suspicion about "in-the-moment actionability" - is it a real requirement or a Trojan horse for dogmatism? That needs careful handling. Also notable: they explicitly want conflict flags where requirements clash (e.g., responsiveness to HOE vs anti-gullibility) and which single requirement kills most theories.

  *flipping through mental files on HOE debates*
  Key tensions to surface:
  - Enkratic requirement (beliefs should match what you deem rational) vs cases where HOE forces akrasia ("I know P is right but I shouldn't believe it")
  - Preface/lottery paradoxes vs consistency - HOE theories can't just nuke probabilistic coherence
  - Self-locating evidence ("I'm drugged now") vs propositional ("drugged people are unreliable") - some theories blur this dangerously

  For the actionability requirement: I'll define it as "guidance without bootstrapping or paralysis," tested via cases like the restaurant bill swap where you can't re-gather evidence. But I'll note the skeptical worry: any rule applied mid-doubt might covertly rely on the very faculty in question. 

  *scanning for landmines*
  The user's "which requirement knocks out most candidates" is brutal but fair. My bet: "non-self-undermining" does, because many HOE rules implode when you ask "but is this rule itself reliable?" Simple conditionalization often fails this. 

  Least certain item? Probably "in-the-moment actionability" - it might be too strong. Maybe some theories legitimately say "retreat to skepticism until cleared." But the restaurant case suggests we need at least defeasible guidance.

  Final output structure:
  1. Requirements grouped by domain (cases, distinctions, background constraints)
  2. Each with concrete examples and necessity tags
  3. Conflicts highlighted (especially HOE responsiveness vs anti-gullibility)
  4. Big-theory quick takes - conciliationism, steadfastness, total evidence views etc.
  Confidence scores attached, with caveats

  *steeling myself*
  This user will spot any fudging. No jargon without grounding. Admit where boundaries are fuzzy (like token/type evidence). And absolutely flag that no theory nails all cases - that's why the debate rages.
answer: |-
  Here’s a specification for a theory of higher-order evidence (HOE), distilled into core requirements with cases, distinctions, and constraints. Requirements marked **Non-Negotiable** are widely accepted; others reflect key debates. Conflicts are flagged.

  ---

  ### **I. Core Requirements & Supporting Cases**  
  1. **Undercutting Defeat**  
     - *Requirement*: Must explain when HOE *undercuts* first-order evidence (FOE), not just lowers confidence.  
     - *Case*: "You took a pill that degrades *this specific type* of inference." → HOE should neutralize FOE, not merely weaken it.  
     - *Status*: **Non-Negotiable** (distinguishes HOE from counter-evidence).  

  2. **Akrasia Avoidance**  
     - *Requirement*: Must avoid *epistemic akrasia* (believing P while believing your belief in P is irrational).  
     - *Case*: Learning "your reasoning was sleep-deprived" shouldn’t force you to believe both "P is true" and "I shouldn’t believe P."  
     - *Status*: **Non-Negotiable** (Moore-paradoxical tension isn’t a contradiction but is rationally unstable).  

  3. **Peer Disagreement Resolution**  
     - *Requirement*: Must prescribe symmetric response to disagreements with recognized epistemic peers.  
     - *Case*: "Your epistemic equal tells you you’re wrong." → Requires significant confidence reduction.  
     - *Status*: *Contested* (Steadfast views reject this; Conciliationists demand it).  

  ---

  ### **II. Essential Distinctions (Must Not Collapse)**  
  4. **Token vs. Type Evidence**  
     - *Requirement*: Distinguish evidence about *this specific belief* (token) vs. *general competence* (type).  
     - *Case*: "Infatuation distorted *this* judgment" (token) vs. "You’re generally bad at logic" (type). Token defeaters are stronger.  
     - *Status*: **Non-Negotiable** (collapsing risks over/under-correction).  

  5. **Self-Undercutting vs. World-Directed Evidence**  
     - *Requirement*: HOE about *your access* to FOE ≠ FOE about the world.  
     - *Case*: "You were moved tables and forgot which bill you checked" (HOE) vs. "The bill has errors" (FOE).  
     - *Status*: **Non-Negotiable** (HOE attacks justification, not truth).  

  6. **"Unreliable Here" vs. "Went Wrong" vs. "Overconfident"**  
     - *Requirement*: Treat these differently:  
       - *Unreliable*: Pill case → suspend judgment.  
       - *Went wrong*: Peer disagreement → conciliate.  
       - *Overconfident*: Preface paradox → reduce confidence but retain belief.  
     - *Status*: **Non-Negotiable** (distinct corrective actions).  

  ---

  ### **III. Background Constraints**  
  7. **Consistency with Preface/Lottery Paradoxes**  
     - *Requirement*: Must permit probabilistic awareness of own fallibility without requiring belief-contradiction.  
     - *Case*: Believing each claim in a book while believing some are false (Preface).  
     - *Status*: **Non-Negotiable** (shows rational inconsistency is sometimes unavoidable).  

  8. **Non-Self-Undermining**  
     - *Requirement*: Theory’s own verdicts must remain stable when fed back *as* HOE.  
     - *Case*: If a HOE theory says "discount all reasoning when sleep-deprived," applying this to *itself* shouldn’t collapse into skepticism.  
     - *Status*: **Non-Negotiable** (avoids self-refutation).  

  9. **Enkratic Compatibility**  
     - *Requirement*: Should ideally satisfy the *enkratic principle* ("Believe what you ought to believe"), but must address objections (e.g., bootstrapping worries).  
     - *Status*: *Contested* (Objectors: enkrasia licenses dogmatism; Defenders: it’s core to rationality).  

  ---

  ### **IV. Special Requirement: In-the-Moment Actionability**  
  10. **Usable Guidance**  
      - *Requirement*: The theory must provide agents with *actionable guidance* **from within** the compromised cognitive state, without:  
        (a) Illegitimately presupposing the reliability of the questioned faculty, or  
        (b) Leading to global suspension ("suspend everything forever").  
      - *Case*: After taking the pill, you must decide *now* whether to trust your inference about P.  
      - *Veracity Check*: **Genuine desideratum** (avoids paralysis or circularity), but risks favoring "default-trust" pragmatism if poorly implemented.  
      - *Status*: *Contested* (Skeptics argue it’s impossible without bootstrapping).  

  ---

  ### **V. Conflict Alert: Joint Unsatisfiability**  
  - **The Trilemma**:  
    - (A) **HOE-Responsiveness** (e.g., conciliate peers).  
    - (B) **Anti-Gullibility** (e.g., ignore manufactured doubt like "paid contrarians").  
    - (C) **Non-Question-Begging Assessment** (no tacit reliance on challenged faculties).  
  - **Result**: **A + B + C are jointly unsatisfiable**.  
    - *Why*: To reject manufactured doubt (B), you must assess HOE’s reliability (C), but doing so requires reasoning with faculties under doubt (violating C).  
    - **Sacrifice Required**: Either relax (C) (allow *some* bootstrapping) or weaken (A) (e.g., let agents ignore *some* HOE).  

  ---

  ### **VI. Which Requirement Knocks Out Most Theories?**  
  **Non-Self-Undermining (8)** eliminates:  
  - Naive Conditionalization (self-doubt loops).  
  - Extreme Conciliationism (disagreement HOE undermines itself).  
  - Simple Reliabilism (HOE about unreliability can’t be trusted).  

  ---

  ### **VII. How Major Families Fare**  
  - **Conciliationism**: Strong on peer cases (3) but fails self-undermining (8) and anti-gullibility (ignores B).  
  - **Steadfastness**: Rejects peer pressure (3), excels at actionability (10), but flunks undercutting defeat (1) and akrasia (2).  
  - **Total Evidence Views**: Handles type/token (4) and distinctions (6), but struggles with self-undermining (8) and in-the-moment use (10).  
  - **Immodest Views** (e.g., "HOE is FOE"): Avoids akrasia (2) but collapses distinctions (5,6).  

  ---

  ### **Confidence & Uncertainties**  
  - **Confidence**: 95% on core requirements (1–8); 80% on actionability (10) as genuine; 70% on enkratic (9) as negotiable.  
  - **Least Certain Item**: **"In-the-Moment Actionability" (10)**.  
    - *Why*: It may be *impossible* to satisfy without pragmatic compromises (e.g., trusting faculties by default). Cases like the pill might *require* temporary suspension, making "actionability" a misnomer.  

  Bottom line: A viable theory must explain defeat (1), distinctions (4–6), and stability (8), while navigating the **A/B/C trilemma**. No extant theory clears all hurdles.
