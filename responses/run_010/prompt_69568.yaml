answer: |-
  ### Structured Workshop: Creativity as Knob-Twiddling  
  **Goal:** Students experience Hofstadter’s model (theme + transformations) and discover that altering transformation rules ("knob-space") generates deeper creativity than varying the theme alone. They confront the gap between their taste and output via predictions.

  ---

  ### **Theme & Materials**  
  - **Fixed Theme**: A **"minimalist house"** (a square base + triangle roof + one door).  
    - *Why?* Universally recognizable, easy to vary, visually scannable for judging.  
  - **Materials**:  
    - Paper + pens (students draw variations).  
    - 3 sealed envelopes (Rule Sets A/B/C for groups).  
    - Index cards (for predictions).  
    - Sticky notes (for scoring).  

  ---

  ### **Round-by-Round Rules & Timings** (Total: 85 min)  
  #### **1. Introduction & Setup** (10 min)  
  - Explain: "Today, we’ll test how constraints fuel creativity. Everyone starts with the same house sketch."  
  - Show the theme: ![Simple House](https://via.placeholder.com/100x80?text=□+▲) (square + triangle).  
  - Divide into 3 groups (6 students each).  

  #### **2. Round 1: Varying Within the Knob-Space** (20 min)  
  - **Task**: Each group opens their **sealed rule set** and creates **6 variations** (1 per student).  
    - Rules must be followed strictly.  
  - **Rule Sets** (each group gets one):  
    - **Group A (Scale Knobs)**:  
      - Change roof size (tiny/large).  
      - Add exactly two windows.  
      - Doors must be circular.  
    - **Group B (Position Knobs)**:  
      - Move door off-center.  
      - Rotate roof 45°.  
      - Add one chimney (anywhere).  
    - **Group C (Style Knobs)**:  
      - Make walls dashed/dotted.  
      - Replace triangle roof with a dome.  
      - Add one tree next to the house.  
  - **Output**: 6 drawings per group (18 total).  

  #### **3. Round 2: Altering the Knob-Space** (20 min)  
  - **Task**: Groups **swap rule sets** (e.g., A → B, B → C, C → A). Each student creates **one new variation** under the *new* rules.  
    - Twist: Before drawing, groups **must alter one rule** in their new set (e.g., "Add two trees" → "Add three trees").  
    - *Why swap + alter?* Forces them to renegotiate the transformation space.  
  - **Output**: 6 new drawings per group (18 total).  

  #### **4. Prediction Phase** (5 min)  
  - Each student privately writes on an index card:  
    *"Which of MY OWN two drawings (Round 1 or Round 2) will the class rank higher? I predict: [ ] Round 1 / [ ] Round 2."*  
    - Stress: **No judging yet**—this captures their personal taste vs. expected peer reception.  

  #### **5. Judging & Scoring** (15 min)  
  - **Mechanism**: Display all 36 drawings anonymously (mix Round 1/Round 2).  
  - **Scoring**:  
    - Each student gets **3 sticky notes** (no voting for own work).  
    - Place stickies on **top 3 favorites** (1 sticky = 1 vote).  
  - **Tally**: Count votes. Rank drawings as "Top 5" based on stickies.  

  #### **6. Prediction Reveal** (5 min)  
  - Students retrieve their prediction cards.  
  - Compare: Did the class prefer their Round 1 or Round 2 drawing?  
  - **Key moment**: Highlight mismatches (e.g., "You predicted Round 1, but peers voted for Round 2").  

  #### **7. Debrief** (10 min)  
  - **Map the Activity to Hofstadter**:  
    | **Activity Moment**         | **Hofstadter Concept**                          |  
    |-----------------------------|------------------------------------------------|  
    | Round 1 (fixed rules)       | Knob-twiddling: Varying parameters *within* a space. |  
    | Round 2 (altered rules)     | Creativity leap: Altering the transformation rules *themselves*. |  
    | Prediction gap              | Taste vs. output misalignment—reveals biases. |  
  - **Discussion Prompts**:  
    - "When you swapped/altered rules in Round 2, did it feel more inventive? Why?"  
    - "Did the rule change produce more popular designs? Why/why not?"  
    - "How might this apply to writing, science, or art?"  

  ---

  ### **What Will Predictably Go Wrong (and Recovery)**  
  1. **Rule Confusion** (60% confidence):  
     - Groups misread rules (e.g., "two windows" becomes "one window").  
     - *Recovery*: Circulate during drawing phases to clarify. Bring printed rule backups.  

  2. **Uneven Engagement** (80% confidence):  
     - Some students dominate; others disengage.  
     - *Recovery*: Assign roles (e.g., "rule enforcer," "timekeeper"). Use timers strictly.  

  3. **Voting Chaos** (75% confidence):  
     - Students cluster around popular drawings, ignore others.  
     - *Recovery*: Spread drawings across walls. Enforce silent voting.  

  4. **Prediction Hesitation** (90% confidence):  
     - Students resist committing to a prediction.  
     - *Recovery*: Emphasize: "This isn’t graded—it’s about discovery!"  

  **Least Confident Point**: Timing for Round 2 (altering rules + drawing). Students may rush the rule change to draw (50% confidence). Mitigate by giving 5 min to discuss rule changes before drawing.  

  ---

  ### **What the Activity Can’t Reproduce (Requires Your Input)**  
  **Deep Domain Expertise**: Hofstadter emphasizes that transformative rule changes arise from *intimate knowledge* of a domain (e.g., a musician tweaking chord progressions after years of study). This workshop simplifies it to a 20-minute exercise.  

  **Supply in Debrief**: Note that in real creativity, "changing knobs" requires mastery—like a poet breaking grammar rules *because* they understand them. Ask: "How might expertise change the rule-altering process?"  

  ---

  ### **Why This Works**  
  - **Theme**: The house is neutral, scalable, and invites visual creativity.  
  - **Prediction**: Forces metacognition—students "hold the gap" physically via cards.  
  - **Debrief**: Concrete examples (e.g., "Group B’s rotation rule change") illustrate knob-space shifts.  
  - **Cost**: Zero—uses paper, pens, and stickies.  

  Run this as a "creativity lab," not a lecture. The messiness is the point!
