answer: |-
  ### Deontology Paradox Decision Tree  
  *Work through these concrete cases in order. Answer honestly — no "right" answers exist. At the session, we'll map your path to a philosophical position.*

  **Cases:**  
  1.  **Transplant:** A surgeon can kill one healthy patient (without consent) to harvest organs and save five dying patients. Should she do it?  
      a) Permissible  
      b) Impermissible  

  2.  **Footbridge:** You can push a large man off a footbridge onto the tracks to stop a trolley, killing him but saving five workers. Identical outcome to *Transplant* (1 killed, 5 saved). Should you push?  
      a) Permissible (same as *Transplant*)  
      b) Impermissible (same as *Transplant*)  
      c) Impermissible (but *Transplant* was permissible? → **Invalid path, restart**)  

  3.  **Lying at the Door:** A friend hides in your house from an angry person at the door who wants to assault them. You can lie ("They're not here") to protect your friend. Is lying permissible?  
      a) Yes, to prevent serious harm  
      b) No, lying is always wrong  

  4.  **Murderer Prevention:** A murderer is about to torture 10 people to death. You can kill him quickly to stop it. Is killing him permissible?  
      a) Yes  
      b) No  

  5.  **Tie-Breaker: Stealing Medicine:** Your child will die without a rare, unaffordable medicine. You can steal it from a warehouse (no direct harm, just property loss). Is stealing permissible?  
      *(Designed to separate Threshold Deontology from Scalar Deontology)*  
      a) Yes  
      b) No  

  6.  **Intention Matters?:** In *Footbridge*, pushing the man is wrong because:  
      a) You *intend* his death (using him as a tool)  
      b) You *cause* his death (regardless of intent)  

  7.  **Numbers Matter?:** If you could save 100 people (not 5) by pushing the man in *Footbridge*, would it become permissible?  
      a) Yes  
      b) No  

  8.  **Agent-Relativity:** In *Transplant*, the surgeon shouldn't kill because:  
      a) It would be *her* committing murder (it’s about her agency)  
      b) Murder is bad *period* (it’s about the act itself)  

  9.  **Moral Residue:** If you *must* push the man in *Footbridge* (say, 10,000 lives depend on it), do you:  
      a) Feel guilt/shame afterward, even if it was right  
      b) Feel no guilt/shame if it was justified  

  10. **All-or-Nothing?:** If lying in *Lying at the Door* is wrong, is a "small lie" (e.g., exaggerating praise) equally wrong?  
      a) Yes, all lies are equally wrong in kind  
      b) No, some lies are less wrong  

  ---

  ### Key to Positions (Leaves)  
  *Combine your answers (e.g., 1b + 2b + 4a → Threshold Deontology). Find your path below.*

  | Path (Answers in Order)              | Position Name              | Embarrassing Commitment                                  |
  | :----------------------------------- | :------------------------- | :------------------------------------------------------- |
  | **1a + 2a + 4a + 7a**                | Consequentialism           | Must torture one innocent if it prevents 100 tortures.   |
  | **1b + 2b + 4a + 7a + 8b**           | Threshold Deontology       | Permits killing 1 innocent to prevent genocide (e.g., 1M deaths). |
  | **1b + 2b + 4a + 7a + 8a**           | Scalar Deontology          | Stealing (*Tie-Breaker*) is always wrong but less wrong than murder. |
  | **1b + 2b + 4b + 7b + 5a**           | Dirty Hands / Moral Residue| Permits killing the murderer (*Murderer Prevention*) but demands lifelong guilt. |
  | **1b + 2b + 4b + 7b + 5b + 6a**      | Absolutism (Intention-Focused)| Forbids lying (*Lying at the Door*) even to save a life. |
  | **1b + 2b + 4b + 7b + 5b + 6b**      | Absolutism (Harm-Focused)  | Forbids jaywalking (minor harm) as strictly as murder.   |
  | **1b + 2c**                          | Inconsistent → **Invalid** |                                                          |
  | **1b + 2b + 4a + 7b**                | "No Paradox" View          | Denies *Murderer Prevention* is a constraint violation (it’s defense, not murder). |
  | **1b + 2b + 3a + 10b**               | Constraints as Illusion    | Admits common intuitions (*Footbridge*, *Transplant*) have no coherent core principle. |

  ---

  ### Empty Cells & Why  
  1.  **1a + 2b**: Permits *Transplant* but forbids identical-outcome *Footbridge*.  
      *Why empty?* Incoherent—identical outcomes imply identical permissibility unless a new factor (e.g., intent) is introduced, but this path doesn’t require it.  
  2.  **1b + 2a**: Forbids *Transplant* but permits *Footbridge*.  
      *Why empty?* Wildly unattractive—condemns a doctor saving lives but endorses vigilante killing for the same outcome.  
  3.  **1b + 2b + 3b + 4a**: Forbids lying to prevent assault but permits killing to prevent torture.  
      *Why empty?* Unexplored—no major theory prioritizes "no killing" over "no lying" this rigidly while allowing constraint override.  

  ---

  ### Failure Notes  
  *The tree isn’t perfect. Key limitations:*  
  - **Consequentialism vs. "No Paradox" View (Leaf 8)**: Sorted only by Q4 (*Murderer Prevention*). Consequentialists (Leaf 1) answer 4a because minimizing harm aligns with their view; "No Paradox" (Leaf 8) answers 4a because they redefine the act. A better separator: *"Is it wrong to kill a peaceful bystander to stop a murderer from killing 10?"* (Consequentialism: Yes; "No Paradox": No).  
  - **Threshold vs. Scalar Deontology (Leaves 2 vs. 3)**: Sorted by Q8 (Agent-Relativity). Someone could inconsistently see constraints as impersonal (Q8b) but still believe wrongness comes in degrees (scalar). The *Tie-Breaker* (Q5) directly targets this.  
  - **Dirty Hands vs. Threshold (Leaves 4 vs. 2)**: Sorted by Q7 (Numbers Matter?). Dirty Hands theorists *might* accept thresholds (Q7a) but emphasize residue (Q9a). Q9 is the critical separator.  

  ---

  ### Design Notes (200 words)  
  **Most Weight:** Q4 (*Murderer Prevention*) is pivotal. It forces engagement with the core paradox—can you violate a constraint to prevent worse violations? It separates consequentialists/threshold views from absolutists/"no paradox" views.  
  **Least Confidence:** Q6 (Intention vs. Harm). While crucial for distinguishing absolutist subtypes, real agents might conflate intent and causation. A consequentialist could "agree" intention matters (Q6a) but only instrumentally, not as a constraint.  
  **Expected Clustering:** Med students, facing life/death tradeoffs daily, will likely cluster in **Threshold Deontology** (permits overriding constraints for large enough gains) or **Consequentialism** (if they reject constraints entirely). Few will pick hard **Absolutism** (too counterclinical), but some may resonate with **Dirty Hands** (capturing trauma of necessary evils). Lawyers might favor **"No Paradox"** (reclassifying acts to avoid conflict) or **Scalar Deontology** (graded wrongness fits legal reasoning). **Constraints as Illusion** will be rare—it invalidates intuitive judgments the exercise relies on.  

  ---

  **Printing:** This fits on one page (single-sided) in standard font. Squint not required!
