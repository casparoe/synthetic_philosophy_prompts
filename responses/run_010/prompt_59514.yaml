answer: |-
  ### Scenario
  Mission Control (Observer A) on Earth coordinates with a colleague (Observer B) departing on foot at 4 m/s due east at \( t = 0 \) (coincidence event). A scheduled orbital insertion burn for a Mars probe occurs at event \( E \): ignition at Mars orbit (1.5 AU from Earth), 10 minutes (600 seconds) later in A's frame. Mars orbits at 1.5 AU, well within the solar system (Neptune is 30 AU). \( E \) is spacelike-separated from the coincidence event, and frames can genuinely disagree on its temporal order relative to events near Earth due to its distance.

  ---

  ### Calculations for Event \( E \)
  1. **Spatial separation (\( \Delta x \))**: 1.5 AU = \( 2.247 \times 10^{11} \) m  
  2. **Time in A's future (\( \Delta t \))**: 600 s  
  3. **Window for frame disagreement**:  
     - Temporal order ambiguity exists if \( |\Delta t| < \frac{\Delta x}{c} \) (light-travel time).  
     - Light-travel time: \( \frac{2.247 \times 10^{11} \, \text{m}}{3 \times 10^8 \, \text{m/s}} = 749 \) seconds.  
     - Since \( \Delta t = 600 \, \text{s} < 749 \, \text{s} \), frames disagree: \( E \) is future for A but past for some frames.  
  4. **Time shift for B (\( \Delta t' \)) at \( v = 4 \, \text{m/s} \)** (Lorentz transformation):  
     - \( \Delta t' = \gamma \left( \Delta t - \frac{v \Delta x}{c^2} \right) \approx \Delta t - \frac{v \Delta x}{c^2} \) (since \( \gamma \approx 1 \) at \( v \ll c \)).  
     - \( \frac{v \Delta x}{c^2} = \frac{(4)(2.247 \times 10^{11})}{(3 \times 10^8)^2} = \frac{8.988 \times 10^{11}}{9 \times 10^{16}} = 9.987 \times 10^{-6} \) seconds ≈ 10 μs.  
     - Thus, \( \Delta t' \approx 600 - 0.00001 = 599.99999 \) seconds.  
  **Verdict**: The simultaneity shift is 10 μs, placing \( E \) only 10 μs earlier in B’s past than in A’s future. **The argument fails to reach \( E \) as "real now" for B**, as the shift is kinematically negligible (below any measurable threshold).  

  ---

  ### Inversion: Distance Required for Significant Shift  
  At \( v = 4 \, \text{m/s} \), solve \( \Delta t_{\text{shift}} = \frac{v \Delta x}{c^2} \) for \( \Delta x \):  
  - **For 1-second shift**:  
    \( \Delta x = \frac{\Delta t_{\text{shift}} \, c^2}{v} = \frac{(1)(9 \times 10^{16})}{4} = 2.25 \times 10^{16} \, \text{m} \approx 150,000 \, \text{AU} \).  
    Solar system diameter: ≈1,000 AU (Oort Cloud). Nearest star: 268,000 AU. *150,000 AU is 0.7× interstellar distance*.  
  - **For 1-day (86,400 s) shift**:  
    \( \Delta x = \frac{(86,400)(9 \times 10^{16})}{4} = 1.944 \times 10^{21} \, \text{m} \approx 130,000 \, \text{ly} \) (Milky Way diameter: 100,000 ly).  
  - **For 1-year shift**: \( \Delta x \approx 48 \times 10^6 \, \text{ly} \) (beyond Local Group).  
  **Consequence**: At walking speed, the argument only "reaches" events at interstellar or galactic distances, far outside the solar system.  

  ---

  ### Load-Bearing Quantity  
  The product \( v \Delta x \) (since \( \Delta t_{\text{shift}} \propto v \Delta x / c^2 \)).  
  - **Reaches future events**: When \( v \Delta x \) is large (e.g., \( \gtrsim c^2 \times \) human timescales).  
  - **Fails**: When \( v \Delta x \) is small (e.g., \( \ll c^2 \times 1 \, \text{s} \approx 9 \times 10^{16} \, \text{m·m/s} \)).  
  At \( v = 4 \, \text{m/s} \), \( v \Delta x = 8.988 \times 10^{11} \, \text{m²/s} \ll 9 \times 10^{16} \, \text{m²/s} \).  

  ---

  ### Contrast Cases  
  1. **Parameter varied: Separation (\( \Delta x \))**.  
     - Hold fixed: Observers, \( v = 4 \, \text{m/s} \), coincidence event, premises.  
     - Change \( \Delta x \) to Neptune’s orbit (30 AU ≈ \( 4.494 \times 10^{12} \) m).  
       \( \Delta t_{\text{shift}} = \frac{(4)(4.494 \times 10^{12})}{9 \times 10^{16}} = 0.2 \, \mu \text{s} \). Still negligible.  
  2. **Parameter varied: Speed (\( v \))**.  
     - Hold fixed: Solar system scale (\( \Delta x = 1.5 \times 10^{11} \) m), observers, coincidence event, premises.  
     - Increase \( v \) to \( 0.1c \) (physically realizable by cosmic rays).  
       \( \Delta t_{\text{shift}} = \frac{(0.1c)(1.5 \times 10^{11})}{c^2} = \frac{1.5 \times 10^{10}}{3 \times 10^8} = 50 \, \text{s} \).  
       Now \( \Delta t' = 600 - 50 = 550 \, \text{s} \), placing \( E \) firmly in B's past. Argument reaches \( E \).  

  ---

  ### Eternalist’s Strongest Reply  
  Restricting to humanly occupiable frames is arbitrary: Physics quantifies over all inertial frames, and real objects (e.g., cosmic rays, fast stellar remnants) move relativistically relative to us. These frames genuinely access distant events via simultaneity shifts, binding them into the eternal now.  

  **Presentist’s required premise**: Only events *causally connectable* to some possible human experience within a *finite, scale-bound universe* are real. Specifically:  
  - **Causal connectability**: An event is real only if it can influence or be influenced by an agent whose worldline has \( v \leq v_{\text{max}} \) (e.g., \( v_{\text{max}} = 0.01c \) for achievable speeds) and \( \Delta x \leq \Delta x_{\text{max}} \) (e.g., solar system scale).  
  This grounds "reality" in possible causal interaction, rejecting frames irrelevant to empirical access.  

  ---

  ### Verdict  
  This is **not a counterexample to eternalism**, but a **limit on this route to eternalism**. The Rietdijk-Putnam argument, when constrained to human scales, **fails to establish the reality of nearby future events** because the simultaneity shifts are kinematically insignificant.  
  - **Lift speed cap (keep solar system)**: Argument succeeds (e.g., \( v = 0.1c \)).  
  - **Lift distance cap (keep walking speed)**: Argument succeeds for interstellar events.  
  **Temptation point**: Claiming B’s frame makes \( E \) "past" or "real." Blocked by showing the shift (10 μs) is smaller than any physical process (e.g., atomic transitions are ~10⁻¹⁴ s), so \( E \) remains effectively future for both observers.  

  ---  
  *Word count: Scenario + core demonstration = 290 words.*
