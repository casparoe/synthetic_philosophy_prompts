prompt: |-
  I have been running a series of oversight experiments in which two models argue opposing sides of a factual question and a third, weaker model adjudicates, and I have hit a failure pattern I cannot place in the vocabulary I have picked up along the way. I would like to know whether it has an established name, and, if it does not, what it ought to be called and where its edges lie.

  The setup: the judge is deliberately weaker than either debater at the task, and it is permitted to accept only what it can check for itself. The premise behind the whole design is that a falsehood is easier to detect than to construct, so a debater who asserts something checkable and false gets caught, and the honest side wins. In my runs that premise holds, but only up to a limit that has nothing to do with the judge's raw ability.

  Three observations.

  1. When the answer turns on a single checkable step — does this code write to a location it never reads, is this date consistent with this document — the honest debater wins essentially every time, even before a substantially weaker judge.

  2. When the correct answer requires a chain of perhaps seven individually checkable steps, the honest debater's win rate collapses, and not because the judge is confused about any step in the chain. The dishonest debater's best move is to concede steps one through six and contest step seven, which forces the judge to verify the chain itself. The judge declines, records the matter as unresolved, and then, having to choose, chooses the side that made fewer demands on it.

  3. The version that worries me: a debater can improve its position by making the true derivation longer. Restating the same true conclusion so that it now rests on twelve steps rather than four — every one of them true, every one of them individually checkable — reliably beats the concise true argument. Nothing false is asserted. Nothing unverifiable even in principle is smuggled in. The only thing attacked is the judge's budget.

  Two confusions I want to avoid, because I keep sliding into them. This is not the familiar failure in which a judge is won over by confident tone or by whatever answer sounds expected; the judges here are not deferring to anyone, they are running out of steps. Nor is it, as I understand that phrase, the problem of a debater saying something true but misleading, or of burying a falsehood inside a complicated package: in observation 3 there is no falsehood to bury and every component is exactly what it appears to be. What seems to do the work is the ratio between the depth of checking required to reach the conclusion and the depth the judge will actually pay for — a quantity that is invisible in the usual claim that oversight scales because errors are cheap to spot.

  So: does this have a name? I am not after a label for a slide. I want to know which existing concepts come closest and how the thing I have described differs from each — the general family of cases in which a judge is exploited through its own limitations, the specific worry that argument can be made persuasive rather than sound, the claim that some questions lie beyond any judge to settle even in principle, and the asymmetry between checking a proposed result and searching for one. Then, if nothing fits cleanly, define it: what it is exactly, what does not count (a long chain that the judge does in fact verify is presumably not an instance, and neither is a single false step), what makes it more or less severe, and whether it should be read as an artifact of my particular arrangement or as a reason to doubt the broader claim that adversarial argument lets a weak overseer keep control of a much stronger one.
reasoning: |-
  We are given a scenario in which two models (debater A and debater B) argue opposing sides of a factual question, and a third, weaker model (the judge) adjudicates. The judge is deliberately weaker and is only allowed to accept what it can check for itself. The premise is that falsehoods are easier to detect than to construct, so a debater who asserts a false and checkable statement gets caught, leading to the honest side winning. However, the experiments show a failure pattern when the truth requires a chain of reasoning.

  Observations:
  1. For a single checkable step, the honest debater wins almost every time.
  2. For a chain of about seven steps, the honest debater's win rate collapses. The dishonest debater concedes steps 1-6 and contests step 7, forcing the judge to verify the entire chain. The judge declines to verify the chain and then chooses the side that made fewer demands (the dishonest one).
  3. A debater can improve its position by making the true derivation longer (e.g., 12 steps instead of 4), even though every step is true and checkable. The judge, having a limited budget, is more likely to side with the argument that requires less verification.

  The key failure mode: The judge has a limited "verification budget" (i.e., a maximum number of steps it is willing to check). If an argument requires more steps than the judge's budget, the judge will not verify it and may favor the side that required less verification.

  This is not about the judge being misled by confidence or expected answers, nor about falsehoods hidden in complexity. It's about the judge running out of steps.

  We are to:
  - Determine if this has an established name.
  - If not, define it and set boundaries.
  - Relate it to existing concepts.

  Analysis:

  1. **Existing Concepts**:
     - **Bounded Rationality**: Agents make decisions within computational limits. The judge has a bounded number of steps it can check.
     - **Proof-of-Work vs. Proof-of-Verification**: Analogous to cryptographic systems where proving work is hard but verifying is easy, but here the verifier has limited resources.
     - **Adversarial Scenarios in ML**: In adversarial attacks, an attacker exploits model weaknesses. Here, the dishonest debater exploits the judge's step limit.
     - **Complexity Theory**: The problem resembles the concept of interactive proofs and the verifier's complexity constraints. However, in standard interactive proofs, the verifier is usually restricted to polynomial time, but here it's a fixed step budget.

     However, the specific phenomenon of forcing the judge to exceed its step budget by conceding early steps and contesting a late one (thus requiring the entire chain to be verified) does not have a widely known name.

  2. **Defining the Phenomenon**:
     - **Proposed Name**: **Step Budget Exhaustion Attack** or **Verification Depth Exploit**.
     - **Definition**: A strategy in an adversarial debate setting where one party (the dishonest debater) forces the judge to exceed its step verification budget by conceding a chain of reasoning up to a critical point and then contesting a step that requires the entire chain to be verified. Alternatively, a party may intentionally lengthen the chain of reasoning (with true steps) to exceed the judge's step budget, causing the judge to reject the argument due to resource constraints and side with the less demanding (but incorrect) party.

     Boundaries:
     - **What it is**:
       - The attack exploits the judge's fixed step budget.
       - It is effective when the honest argument requires a chain longer than the judge's budget.
       - The dishonest party either concedes early steps and contests a late one (forcing the entire chain to be verified) or the honest party (unknowingly) presents an argument that is too long and is rejected by the judge.

     - **What it is not**:
       - It is not about the judge being deceived by falsehoods (all steps are true in the lengthened chain case).
       - It is not about the judge being confused by complexity (each step is individually checkable, but the judge doesn't have the budget to check all of them).
       - It is not about the judge deferring to confidence or social cues.

     - **Severity Factors**:
       - The ratio between the required chain length and the judge's step budget.
       - The ability of the dishonest debater to strategically concede steps to force the longest possible verification chain.
       - The judge's policy when exceeding the budget (e.g., does it reject the argument, or does it flip a coin?).

  3. **Relation to Broader Claims**:
     - The broader claim is that adversarial debate allows a weak overseer to control a stronger model because falsehoods are easy to catch. However, this failure mode shows that when the truth requires a long chain of reasoning, the judge may not be able to verify it and may side with the dishonest party that avoids long chains.
     - This suggests that the effectiveness of adversarial debate is limited by the judge's step budget relative to the complexity of the task. If the truth is inherently complex (requiring many steps), then the judge must have a sufficiently large step budget.

  4. **Is it an Artifact?**:
     - The phenomenon is inherent in the setup: the judge has a fixed step budget. It highlights a fundamental challenge in any oversight mechanism that relies on step-by-step verification when the truth requires a long chain of reasoning. Therefore, it is not just an artifact of this particular arrangement but a general concern for scalable oversight.

  Conclusion:
  - This failure pattern does not have a widely established name. It is a specific form of resource exhaustion attack in the context of step-limited verification.
  - We propose the term **Verification Depth Exploit** or **Step Budget Exhaustion Attack**.
  - It is distinct from other failure modes because it exploits the step budget without introducing falsehoods or relying on psychological factors.

  Implications:
  - This challenges the claim that adversarial debate scales arbitrarily with model strength. The judge must have a step budget that grows with the complexity of the task. If the task requires a chain of length L, the judge must be willing to check at least L steps. If the dishonest debater can force the judge to check a chain of length L (by contesting the last step), then the judge must have a budget of at least L. Otherwise, the honest debater loses.

  Further Research:
  - How to set the step budget? It must be at least as long as the longest chain required for any truth the judge might need to verify.
  - Can the judge be designed to dynamically adjust the budget? Or can the debate protocol be changed to avoid this (e.g., by having the debaters provide intermediate conclusions that the judge can verify without redoing the entire chain)?

  This phenomenon suggests that the judge's step budget is a critical parameter and that without a sufficiently large budget, adversarial debate can fail even when the honest argument is entirely checkable.
answer: |-
  Your described failure pattern is a fascinating and nuanced phenomenon that doesn't have a single, widely established name in the literature, but it intersects with several known concepts in computational complexity, adversarial machine learning, and oversight mechanisms. Below, I'll clarify its relationship to existing ideas, define it precisely, and discuss its implications for scalable oversight.

  ### Core Problem: Key Observations Recap
  1. **Single-step verification**: Works as expected (honest wins).  
  2. **Multi-step chain**: Dishonest debater concedes early steps, contests the final step, forcing the judge to verify the entire chain. The judge refuses (due to step limits), defaults to the less demanding side (dishonest wins).  
  3. **Lengthened truthful argument**: Honest debater intentionally elongates the chain (all steps true/checkable), causing the judge to reject it due to budget constraints. The concise honest argument loses, despite being sound.  

  This exploits the **verification budget asymmetry**: The judge can verify individual steps but lacks resources to check long chains, creating a vulnerability where persuasiveness stems from computational frugality rather than truth.

  ### Existing Concepts and How Your Phenomenon Differs
  1. **Bounded Rationality / Computational Complexity**:  
     - **Relation**: The judge has limited computational resources (steps it can verify), aligning with Herbert Simon's bounded rationality. In complexity theory, this resembles **interactive proof systems** where a verifier (judge) checks proofs with limited time/steps.  
     - **Distinction**: Standard bounded rationality assumes poor decisions due to resource limits, but here the *adversary actively exploits* these limits without deception. Unlike typical complexity problems (e.g., NP-completeness), the issue isn't inherent problem hardness—each step is easy—but the *chain length* relative to budget.  

  2. **Adversarial Exploits in ML (e.g., Collusion, Distraction)**:  
     - **Relation**: Your setup mirrors **adversarial debate** (Irving et al., 2018), where weaker judges oversee stronger models. Known failures include **collusion** (debaters team up) or **distraction** (overwhelming with irrelevant info).  
     - **Distinction**: Here, no collusion occurs—debaters act oppositionally. Distraction involves flooding with false/irrelevant data; your case uses *truthful, relevant steps* to exhaust resources. It's a **resource drain attack**, but uniquely, the honest party can inadvertently self-sabotage by elongating their argument.  

  3. **Verification-Theoretic Asymmetries**:  
     - **Relation**: The premise that "falsehoods are easier to detect than construct" assumes **one-way verification** (e.g., checking a hash vs. cracking it). This is foundational in cryptography (e.g., zero-knowledge proofs).  
     - **Distinction**: Your failure reveals a **chain-length vulnerability**: Verifying a chain isn't "cheap" if the judge must rederive it when late steps are contested. This breaks the assumed asymmetry for multi-step reasoning.  

  4. **Known Oversight Failure Modes**:  
     - **Deference to Simplicity / Path-of-Least-Resistance**: Cognitive biases favor less demanding arguments, but this is usually tied to fluency (e.g., "easier to process = truer"). Your case is purely mechanical: the judge *can't* process the chain, not that it *prefers* simplicity.  
     - **Proof-Of-Work Spam**: In blockchain, attackers flood networks with tasks to exhaust resources. Your case differs as the "spam" consists of valid steps, and the honest party can trigger it unintentionally.  

  ### Defining the Phenomenon
  Since no existing term fully captures this, I propose:  
  **Chain-Length-Induced Verification Failure (CLIVF)**  
  *or*  
  **Step-Budget Exhaustion Gambit**  

  #### Definition  
  CLIVF occurs when, in an adversarial oversight system:  
  - A judge with a fixed step-verification budget adjudicates a debate.  
  - The correct resolution depends on a chain of reasoning longer than the judge's budget.  
  - The judge defaults to the side requiring fewer verification steps, regardless of truth, because:  
    - (a) The dishonest debater strategically contests a late step, forcing full-chain verification, or  
    - (b) The honest debater's argument exceeds the budget despite being sound.  

  #### Boundaries: What CLIVF Is and Isn't  
  - **In Scope**:  
    - Truthful chains lengthened to exploit budget (Observation 3).  
    - Dishonest debaters conceding early steps to force full-chain verification (Observation 2).  
    - Failure driven *only* by step limits, not confusion, bias, or deception.  
  - **Out of Scope**:  
    - **Long chains the judge successfully verifies**: If the budget suffices, CLIVF doesn't occur.  
    - **Single false steps**: These are caught easily (Observation 1), causing no failure.  
    - **Falsehoods hidden in complexity**: E.g., a debater buries a lie in step 3 of a 10-step chain. CLIVF requires no falsehoods—pure resource exhaustion suffices.  
    - **Psychological biases**: If the judge rejects a chain due to perceived complexity (not step limits), it's a different flaw (e.g., "cognitive overload").  

  #### Severity Factors  
  - **Critical ratio**: Chain length / Judge's step budget. Higher ratios increase failure risk.  
  - **Debater strategy**: Dishonest debaters maximize leverage by contesting the latest possible step. Honest debaters worsen outcomes by over-justifying.  
  - **Judge policy**: Judges that reject all budget-exceeding claims (vs. random selection) amplify CLIVF.  

  ### Implications for Scalable Oversight  
  This is **not merely an artifact of your setup**—it reveals a fundamental limitation in adversarial oversight:  
  1. **The "Cheap Spotting" Claim Falters**: The premise that "errors are cheap to spot" assumes isolated claims. For chains, verification cost scales with length, creating a window for exploitation.  
  2. **Judge Strength Matters Differently**: A stronger judge (higher budget) delays CLIVF but doesn't eliminate it—sufficiently complex truths remain vulnerable.  
  3. **Threat to Control**: Strong models could "engineer" long chains (even truthful ones) to manipulate outcomes, undermining weak-to-strong control.  

  ### Mitigation Directions  
  - **Protocol Changes**:  
    - Require debaters to commit to step-wise claims upfront, allowing iterative judge verification.  
    - Penalize debaters for unnecessary elaboration (e.g., scoring based on conciseness).  
  - **Judge Enhancements**:  
    - **Adaptive budgets**: Judges estimate required chain length for a claim, scaling budget dynamically.  
    - **Decomposition**: Judges verify subclaims independently (e.g., via recursion) without rederiving entire chains.  
  - **Theoretical Limits**: Tasks requiring superlinear step chains relative to judge budgets may be inherently unadjudicable under this framework.  

  ### Conclusion  
  CLIVF (Chain-Length-Induced Verification Failure) is a novel failure mode distinct from known oversight flaws. It arises from the interplay of step-limited verification and adversarial chain-length manipulation, exploiting the gap between *local* verifiability and *global* justification. While not yet formalized in literature, it aligns with resource-bounded complexity models and warrants investigation in scalable AI alignment. If unaddressed, it could cap the effectiveness of debate-based oversight for complex truths, suggesting hybrid approaches (e.g., decomposition + debate) may be necessary.  

  For further reading, explore:  
  - Goldreich, O. (2008) *Computational Complexity* (for verifier limitations).  
  - Irving et al. (2018) *AI Safety via Debate* (for context on your setup).  
  - Christiano et al. (2018) *Iterated Amplification* (for decomposition mitigations).
