prompt: |-
  I'm the registrar on a mid-sized museum's collections and attribution committee — seven of us, we meet monthly, and basically our job is deciding what gets catologued as an original, what gets a qualifier in front of the artist's name, and what gets hung where. Mostly curators, plus me and a conservator. I've been keeping a log of our calls for a few years now and I've realised I couldn't tell you what rule we're actually running, and we've got a donation proposal coming up that I'm pretty sure the log doesn't settle. Can you work out what we'd have to decide to be consistent with ourselves?

  Our calls so far, roughly in order:

  1. A drawing that came in attributed to the master. Technical exam showed most of it was by his best pupil working under supervision, with maybe a dozen strokes added by the master, who then signed it. We went with "studio of," not an original by him, and hung it in the works-on-paper room under that label. Nobody thought this one was close.
  2. Twelve posthumous bronze casts made from the sculptor's own plaster maquette, authorised in her will, numbered, all cast within two years of her death. We accepted them as originals by the artist, no "after," no qualifier, on the grounds that she'd set the process up herself.
  3. A big fabricated wall piece where the artist designed everything and had industrial fabricators cut and weld it; she never laid a hand on it. She sent a signed statement saying it was hers. Catalogued as her work, full stop.
  4. A very good 19th-century copy of a painting that burned in the 1940s. We hang it, but as "copy after," and we turned down a request to catalogue it under the original's title and date.
  5. A confessed forgery of a Dutch 17th-century interior that had fooled our own curator for years. Kept it, hung it with a forgery label, and we specifically declined to say anything in the wall text about its artistic merits either way.
  6. A print where the artist re-struck 30 impressions from her own plate 25 years on, the plate visibly worn. Originals by her, but dated to the later printing rather than to the plate's first use.
  7. A painting with about 30% loss, filled and inpainted reversibly by our conservator. Still the work, hung as the work, label says restored. We rejected a proposal to credit the conservator as a co-maker.
  8. A canvas so heavily repainted over the decades that the conservator estimated under 15% of the original surface survived. The artist, still living, wrote to us saying it was absolutely her painting and not to be treated as a copy. We kept her attribution but required the label to state the extent of the loss and overpainting.

  New proposal, and because it's a donation we can't fob it off:

  An artist painted a large canvas in 1998 for a collector. In 2003 it was slashed — four long cuts, one straight through the main figure. The collector handed the wreck back to her rather than claim on the insurance. She didn't restore it. She stretched a new canvas and painted the same composition again, same dimensions, working from her own preparatory drawing and photographs, not tracing; the handling is entirely hers, though she says she changed two things deliberately. About the second canvas she said something to the effect that this is the painting and the first one is finished, it's over. The donor is offering us both objects: the re-made canvas, and the slashed 1998 one, which is now maybe 40% intact with the cuts still visible and unstitched.

  So we have to decide whether the 2003 canvas gets catalogued as *the* work — in which case what is the 1998 object, an earlier state of it, a document, something we accession but don't hang as art? — or whether it's a second, numerically distinct work by the same artist that happens to carry the same image, in which case what is the 1998 object and can we hang both. Plus what date goes on the label.

  What I want from you: which of our eight precedents is the closest analog and exactly where the analogy breaks down; what the committee should decide if it wants to be consistent with its own record; and what implicit principle each of the two options would commit us to. Be specific about the principles, because my suspicion is that all eight calls are jointly compatible with at least three pretty different ones and I can't tell which we're actually operating with — one of them being something like "the artist gets to settle what her work is," which half the committee assumes and the other half thinks is exactly what's in question here, so don't just take it for granted either way. Then propose one further case, the kind of thing that could plausibly land on our agenda in the next year or two, that would show us which principle we've adopted, and say what each candidate principle predicts about it.

  No bibliography and no theorist names needed, I just want the reasoning worked through properly.
reasoning: |-
  Okay, the user is a registrar on a museum's collections committee facing a tricky attribution decision. They've kept detailed logs of past decisions but can't discern a consistent underlying principle. Now they're dealing with a donation of two versions of a painting - one slashed original and a later re-creation by the artist - and need guidance.

  Hmm, this is fascinating. The museum has handled various borderline cases: collaborative works, posthumous casts, fabricated pieces, copies, forgeries, reprinted prints, and restored paintings. Each decision seems reasonable in isolation, but together they don't reveal a clear framework. The user suspects there might be three possible principles at play, including "artist's intent," which is controversial among committee members.

  Looking at the new case... The artist destroyed her original work after damage, then created a near-identical version while declaring it "the painting." Now the museum must decide: is this new piece the canonical work? What status does the damaged original hold? And how should both be dated?

  Let me analyze the precedents. Case 1 (master's drawing) shows physical execution matters - even with supervision and a signature, it wasn't considered fully authentic. Case 2 (bronze casts) prioritized the artist's authorization over physical creation. Case 3 (fabricated piece) took the artist's word as final. Case 4 (copy) maintained a strict original/copy distinction despite the original being lost. Case 5 (forgery) focused on provenance over aesthetics. Case 6 (re-struck print) allowed multiple originals but dated them to execution. Case 7 (restoration) preserved the work's identity despite significant conservation. Case 8 (overpainted canvas) deferred to the artist despite minimal original material.

  For the new proposal... The key analog is actually Case 7 with a twist. Both involve damage and artist response, but here the artist didn't restore - she replaced. The closest precedent is Case 4 (copy after lost original), but with the artist recreating her own work. The artist's declaration (like Cases 3 and 8) complicates things.

  If consistency matters... The committee has previously: (a) privileged execution (Cases 1,4,6), (b) accepted artist-sanctioned reproductions as originals (Case 2), (c) deferred to artist statements (Cases 3,8). But never all three at once in conflict.

  For the damaged painting: If they prioritize physical execution (like Case 1), the 1998 version remains the work despite damage. The 2003 version becomes a copy. If they follow artist sanction (Case 2), the 2003 version becomes canonical. If they defer to the artist (Cases 3,8), her statement makes the 2003 version the work.

  But here's the rub: the artist didn't just authorize reproduction (Case 2) - she physically recreated it. Yet she also disavowed the original (unlike Case 8). 

  To resolve this, I need to propose a test case. Imagine a scenario where an artist authorizes digital reproductions of a destroyed painting. Would these be originals (following Case 2)? Or mere reproductions (like Case 4)? The committee's answer would reveal whether they prioritize sanction over execution.

  For the current dilemma: Given how they handled Case 2 (posthumous casts as originals) and Case 3 (fabricator-made piece as authentic), plus the artist's clear statement, the consistent move would be to treat the 2003 canvas as the work. The 1998 version becomes a "documentary artifact" - accessioned but not displayed as art. Date the 2003 piece to 2003. 

  This commits them to an "artist's declaration + sanction" principle. But it raises questions about Case 1 (where they overruled the master's signature) and Case 4 (where they denied a copy original status despite being the only version).

  The alternative - treating both as distinct works - would align more with Case 6 (re-struck prints as separate originals) but contradicts the artist's statement. 

  Ultimately, the test case will force the committee to choose between physical execution and artist authority as their north star.
answer: |-
  Based on your committee's precedents, here's a breakdown of the new proposal, the closest analog, principles at play, and a test case to clarify your implicit rules.

  ### 1. **Closest Analog & Where It Breaks Down**
     - **Closest Precedent:** **Case 8 (Heavily Repainted Canvas)**.  
       - *Similarity:* Both involve severe physical alteration of the original work, with the artist asserting ownership/authenticity despite minimal original material.  
       - *Breakdown:* In Case 8, the committee retained the original attribution (with caveats) because the artist authenticated the *original object*, even in its degraded state. Here, the artist explicitly *disavowed* the original object (1998 canvas) and declared the 2003 canvas *the* work. This shifts from "degraded original" to "replacement as canonical work."

  ### 2. **Consistent Decision for the New Proposal**
     To align with your precedents:  
     - **Catalog the 2003 canvas as the artwork** (original by the artist, dated 2003).  
     - **Treat the 1998 canvas as a "documentary artifact"** (accessioned but not hung as art; label: "Fragmentary remains of 1998 work, destroyed by the artist").  
     - **Rationale:**  
       - **Artist’s Declaration:** Cases 3 (fabricated piece) and 8 (repainted canvas) show deference to the artist’s statement as decisive for attribution. Here, the artist explicitly designated the 2003 canvas as *the* work.  
       - **Sanctioned Reproduction:** Case 2 (posthumous bronzes) treated authorized reproductions as originals. The 2003 canvas was artist-sanctioned and executed by her hand.  
       - **Rejection of Copy Status:** Case 4 (19th-century copy) denied original status to a reproduction. The 2003 canvas avoids this because the artist *replaced* the work (like the bronzes), not copied it externally.  
       - **Physical Execution Matters:** Case 1 (studio drawing) prioritized material authorship. Here, the 2003 canvas is 100% her hand, unlike the slashed original (40% intact).  

  ### 3. **Implicit Principles Behind the Two Options**  
     - **Option 1 (2003 as *the* work):**  
       - **Principle:** *"The artist’s declared intent, when realized through sanctioned (re)creation, defines the canonical work."*  
       - **Commitment:** Artist authority overrides physical continuity (as in Case 3 and Case 2). Degraded/destroyed precursors are documentary evidence, not the work itself.  
     - **Option 2 (Two distinct works):**  
       - **Principle:** *"Material originals are ontologically unique; recreations are derivative regardless of artist intent."*  
       - **Commitment:** Physical objecthood is primary (as in Case 4 and Case 1). The 2003 canvas becomes a "replica" or "later version" (like Case 6’s re-struck prints).  

  ### 4. **The Three Candidate Principles in Your Precedents**  
     Your decisions suggest **all three principles coexist**, applied contextually:  
     - **A. Artist Authority:** Trumps when the artist is living and intervenes (Cases 3, 8).  
     - **B. Sanctioned Reproduction:** Validates posthumous/mechanical works if artist-authorized (Case 2, Case 6).  
     - **C. Material Authenticity:** Prevails when artist intent is absent/ambiguous (Cases 1, 4, 5, 7).  
     **Tension Point:** *Artist Authority* and *Material Authenticity* conflict in the new proposal. Case 8 leaned toward authority; Case 4 toward materiality.  

  ---

  ### 5. **Proposed Test Case to Clarify Your Principle**  
     **Scenario:** *An artist destroys a digital artwork’s original file. Later, they authorize a museum to generate a new display from the same code/algorithm. The new output has minor variations due to updated software.*  

     - **What Each Principle Predicts:**  
       - **Artist Authority:** Accept as the artwork (like Case 3). "The artist defines the work."  
       - **Sanctioned Reproduction:** Accept as original (like Case 2). "Artist-authorized iteration."  
       - **Material Authenticity:** Reject or label "reconstruction" (like Case 4). "The original instantiation is lost."  

     **Why This Tests Your Principle:**  
     - It lacks physical objecthood (vs. painting/sculpture).  
     - The artist’s intent is explicit (like Cases 3/8).  
     - It’s a sanctioned recreation (like Case 2) but non-identical.  
     - Your decision would reveal whether *Artist Authority* or *Material Authenticity* is your default when they conflict.  

  ---

  ### Summary for the Committee
  - **For the 2003 canvas:** Catalog as the artwork, dated 2003.  
  - **For the 1998 canvas:** Accession as archival material (not art), with a conservation note.  
  - **Why:** Consistency with Cases 2, 3, 6, and 8 prioritizes the artist’s sanction and recreation process. The damaged canvas parallels Case 7’s "restored but not co-authored" outcome—it’s evidence of the work’s history, not the work itself.  
  - **Test Case:** Use the digital artwork scenario to force a choice between *Artist Authority* and *Material Authenticity*. If you accept the new iteration, you’ve institutionalized the former; if not, the latter governs your toughest calls.
