  **Final Examination Question: Philosophy of Biology (Masters Module)**

  **Question (Total: 40 marks; Time: 90 minutes)**

  The same panel of 40 genotypes of a grain legume is grown at three sites. The dry yield per plant (grams) has the following variance components and means:

  - Site A (irrigated research station): 
      V_A = 28, V_D = 8, V_E = 4, V_G×E = 0, mean = 55 g
  - Site B (rain-fed smallholder fields): 
      V_A = 28, V_D = 8, V_E = 32, V_G×E = 12, mean = 40 g
  - Site C (same fields as B under a uniform irrigation-and-extension package): 
      V_A = 28, V_D = 8, V_E = 4, V_G×E = 0, mean = 55 g

  Note: The variance components V_A and V_D are stipulated as constant across sites for simplicity.

  Answer the following parts:

  (a) (8 marks) Compute the narrow-sense heritability at each site. Then, explain why a broad-sense heritability figure is unproblematic at Site A but turns on a convention at Site B. Give both candidate values for broad-sense heritability at Site B and say what the choice of convention does to the reported number.

  (b) (8 marks) Predict the response to a selection differential of 10 g at each site. Explain why the identical additive genetic variance (V_A) leads to such different responses across sites, and discuss whether the same 10 g selection differential represents equal selection intensity at sites with such different phenotypic variances.

  (c) (10 marks) A ministry official is told that the narrow-sense heritability at Site C is 0.70 compared to 0.35 at Site B. The official concludes that the environment has now been "taken care of," that further investment in uniform environmental provision (like irrigation and extension) cannot raise yield, and that breeding is the only remaining lever to increase yields. Assess this conclusion.

  (d) (8 marks) A donor agency proposes shipping the top-performing lines identified at Site A to Site B on the grounds that yield at Site A is 0.90 genetic (referring to broad-sense heritability) and therefore the winners at Site A will be winners anywhere. Assess this proposal.

  (e) (6 marks) A seed company reasons that since the broad-sense heritability at Site A is 0.90 and Site A's mean yield exceeds Site B's by 15 g, roughly 90% of that gap must be genetic. Assess this reasoning.

  You may use a calculator. Show your working and reasoning.

  ----------------------------------------

  **Model Answer and Marking Scheme**

  **(a) (8 marks)**

  Narrow-sense heritability (h²) is computed as V_A / V_P, where V_P is the phenotypic variance.

  - Site A: V_P = V_A + V_D + V_G×E + V_E = 28 + 8 + 0 + 4 = 40 g² → h² = 28/40 = 0.70
  - Site B: V_P = 28 + 8 + 12 + 32 = 80 g² → h² = 28/80 = 0.35
  - Site C: V_P = 28 + 8 + 0 + 4 = 40 g² → h² = 28/40 = 0.70

  Broad-sense heritability (H²) is the ratio of total genetic variance to phenotypic variance. The total genetic variance at a site is typically V_G = V_A + V_D. However, the presence of V_G×E (genotype-by-environment interaction) at Site B raises a convention issue: should V_G×E be included in the genetic variance?

  At Site A, V_G×E = 0, so H² = (V_A+V_D)/V_P = (28+8)/40 = 36/40 = 0.90. There is no ambiguity.

  At Site B, two conventions are possible:
  - Convention 1: H² = (V_A+V_D)/V_P = 36/80 = 0.45
  - Convention 2: H² = (V_A+V_D+V_G×E)/V_P = (28+8+12)/80 = 48/80 = 0.60

  The choice of convention changes the reported H²: 0.45 vs 0.60. Convention 2 includes the G×E variance as part of the genetic variance because it represents genetic variation in response to the environment.

  *Marking for (a):*
  - Correct narrow-sense heritability for each site (3 marks: 1 per site).
  - Explanation that broad-sense is unproblematic at A because V_G×E=0 (1 mark).
  - Statement that at Site B there are two conventions (1 mark).
  - Giving both candidate values for Site B (1 mark for each, total 2 marks).
  - Explaining the effect of the choice on the reported number (1 mark).

  **(b) (8 marks)**

  The response to selection (R) is given by R = h² * S, where S is the selection differential (10 g).

  - Site A: R = 0.70 * 10 = 7.0 g
  - Site B: R = 0.35 * 10 = 3.5 g
  - Site C: R = 0.70 * 10 = 7.0 g

  The identical additive genetic variance (V_A=28 at all sites) leads to different responses because the narrow-sense heritability (h² = V_A / V_P) differs due to differences in V_P. At Site B, V_P is larger (80 g²) than at A and C (40 g²), so h² is lower (0.35 vs 0.70).

  The same selection differential of 10 g does not represent the same selection intensity because selection intensity (i) is the differential in standard deviation units (i = S / σ_P). 

  - Site A: σ_P = sqrt(40) ≈ 6.32 g → i ≈ 10/6.32 ≈ 1.58
  - Site B: σ_P = sqrt(80) ≈ 8.94 g → i ≈ 10/8.94 ≈ 1.12
  - Site C: same as A, i ≈ 1.58

  Thus, the selection intensity is lower at Site B because the phenotypic standard deviation is larger. This further contributes to the lower response at Site B.

  *Marking for (b):*
  - Correct response for each site (3 marks: 1 per site).
  - Explanation of why identical V_A leads to different responses (focusing on h² and V_P) (2 marks).
  - Calculation of selection intensity (or at least the standard deviation) at A and B (or all three) (2 marks).
  - Discussion that the same absolute differential means lower intensity at B (1 mark).

  **(c) (10 marks)**

  The ministry official's conclusion is flawed in several ways.

  First, the increase in heritability at Site C (0.70) compared to Site B (0.35) is due to the reduction in environmental variance (V_E from 32 to 4) and the elimination of G×E variance (from 12 to 0). This indicates that the uniform irrigation-and-extension package has indeed reduced environmental variation and made the environment more uniform. However, the official's claim that the environment has been "taken care of" and that further uniform provision cannot raise yield is not supported. The heritability of 0.70 means that 30% of the phenotypic variance is still environmental (V_E=4). There might be room to further reduce V_E, which could potentially increase the mean yield (for example, by even better environmental control). Moreover, the mean yield at Site C (55 g) is the same as at Site A, but this does not imply that it cannot be increased by further environmental improvements. For instance, a uniform improvement (like a new fertilizer that boosts every plant by 5 g) would raise the mean without altering the variance components. Thus, further environmental investments might still raise yields.

  Second, the official claims that breeding is the only remaining lever. While breeding can lead to gains (because h²=0.70), it is not the only lever. Environmental improvements (either by further reducing variation or by uniformly raising the mean) remain possible. The data does not rule out such interventions.

  Additionally, note that the mean yield at Site C is the same as at Site A. This suggests that the gap between Site B and Site A was environmental, and by providing irrigation and extension, the gap was closed. But that does not mean that the environment is now optimal.

  *Marking for (c):*
  - Recognition that heritability increased due to reduced V_E and elimination of V_G×E (2 marks).
  - Point that 30% of variance is still environmental, so environment not fully controlled (2 marks).
  - Argument that uniform environmental improvements might still raise the mean (2 marks).
  - Point that breeding is not the only lever (1 mark).
  - Note that the gap between B and A was closed by environmental intervention (1 mark).
  - Overall structure and clarity (2 marks).

  **(d) (8 marks)**

  The donor agency's proposal is flawed because it ignores genotype-by-environment interactions (G×E). 

  At Site B, there is a substantial G×E variance (V_G×E=12). This indicates that the relative performance of genotypes changes across environments. Therefore, the best-performing lines at Site A (a highly controlled, irrigated environment) may not be the best at Site B (a rain-fed, variable environment). 

  Moreover, the mean yield at Site B (40 g) is much lower than at Site A (55 g), and the environmental conditions are very different. The high heritability at Site A does not guarantee that the same genotypes will perform well under the stress conditions of Site B. 

  In fact, the presence of G×E suggests that a genotype-by-environment interaction exists, meaning that the genetic correlation between performance at Site A and Site B is likely less than 1. Therefore, selecting in one environment (A) for performance in a different environment (B) may not be effective.

  *Marking for (d):*
  - Identification of G×E at Site B as a key issue (2 marks).
  - Explanation that G×E means changes in relative performance (2 marks).
  - Point that high heritability at A does not imply good performance at B (2 marks).
  - Note that the environments are very different (1 mark).
  - Overall structure and clarity (1 mark).

  **(e) (6 marks)**

  The seed company's reasoning commits the ecological fallacy: applying heritability (which is about variation within a population) to differences between populations (or environments). 

  Heritability within Site A (0.90) indicates that 90% of the variation in yield among the genotypes at Site A is due to genetic differences. It does not tell us about the cause of the mean difference between Site A and Site B. 

  In fact, the same set of genotypes is grown at both sites. The mean difference (15 g) is entirely due to the environment. This is demonstrated by the fact that at Site C (which is Site B with improved environment) the mean yield is 55 g, the same as at Site A. Therefore, the entire 15 g gap is environmental. 

  The seed company's claim that 90% of the gap is genetic is incorrect.

  *Marking for (e):*
  - Identification of the ecological fallacy (2 marks).
  - Explanation that heritability within a population does not explain between-population differences (2 marks).
  - Use of the evidence from Site C to show the gap is environmental (2 marks).

  **Overall Marking Scheme and Grade Boundaries**

  - Total marks: 40
  - Pass mark: 20 (50%).
  - A grade (Excellent): 36-40 marks. Requires not only correct arithmetic but also clear and insightful explanations that demonstrate a deep understanding of the concepts, including the nuances such as the role of G×E, the fallacy in attributing between-environment mean differences to heritability, and the limitations of the given simplifications (e.g., fixed V_A across environments). Must explicitly note the environmental cause of the mean gap and the fallacy in the seed company's reasoning.
  - B grade (Good): 32-35 marks. Correct arithmetic and good explanations but may miss one or two nuances or not express them as clearly.
  - C grade (Satisfactory): 24-31 marks. Basic arithmetic correct and some understanding shown, but with gaps in explanation or misinterpretations of key concepts.
  - D grade (Poor): 20-23 marks. Barely passing, with significant errors or omissions but some minimal understanding.
  - Fail: Below 20 marks.

  **Key nuances that separate A from B:**
  - In part (c), noting that the heritability increase at Site C is due to environmental improvement (reducing V_E and eliminating V_G×E) and that this does not imply the environment is now optimal.
  - In part (e), explicitly stating that the shared germplasm and the result at Site C refute the seed company's inference (the gap is environmental).
  - In part (a) and (b), noting that holding V_A constant across environments is a simplification (in reality, additive variance can change with the environment) – but this is not required for full marks as the problem states it is given as constant.
  - In part (d), emphasizing that G×E means the genetic correlation across environments is less than one, so selection in one environment is not optimal for another.

  **Common misinterpretations that cost marks:**
  - Confusing broad-sense and narrow-sense heritability.
  - Forgetting to include V_G×E in the phenotypic variance at Site B.
  - In part (b), not discussing selection intensity.
  - In part (c), agreeing with the official that the environment is taken care of.
  - In part (d), not mentioning G×E.
  - In part (e), not identifying the ecological fallacy or not using the evidence from Site C.

  **Note on the arithmetic:** The calculations must be shown. A candidate who only writes the answers without working may lose marks for the calculation parts.
answer: |-
  ### Final Examination Question: Philosophy of Biology  
  **Module:** Philosophy of Biology (Masters Level)  
  **Time Allowed:** 90 minutes  
  **Total Marks:** 40  
  **Instructions:** Answer all parts of the question. Show all calculations and reasoning. Use of a calculator is permitted. The table below provides data for 40 genotypes of a grain legume grown at three sites. Variance components are stipulated as constant across sites for simplicity.  

  | Site | Conditions                     | \(V_A\) | \(V_D\) | \(V_E\) | \(V_{G\times E}\) | Mean Yield (g) |
  |------|--------------------------------|---------|---------|---------|-------------------|---------------|
  | A    | Irrigated research station     | 28      | 8       | 4       | 0                 | 55            |
  | B    | Rain-fed smallholder fields    | 28      | 8       | 32      | 12                | 40            |
  | C    | Site B with uniform irrigation | 28      | 8       | 4       | 0                 | 55            |

  **Definitions:**  
  - \(V_A\) = Additive genetic variance  
  - \(V_D\) = Dominance genetic variance  
  - \(V_E\) = Environmental variance (non-genetic)  
  - \(V_{G\times E}\) = Genotype-by-environment interaction variance  
  - Phenotypic variance (\(V_P\)) = \(V_A + V_D + V_E + V_{G\times E}\)  
  - Narrow-sense heritability (\(h^2\)) = \(V_A / V_P\)  
  - Broad-sense heritability (\(H^2\)) = Total genetic variance (\(V_G\)) / \(V_P\), where \(V_G = V_A + V_D\) (Convention 1) or \(V_G = V_A + V_D + V_{G\times E}\) (Convention 2)  

  ---

  **Question Parts:**  
  **(a)** (8 marks)  
  (i) Compute the narrow-sense heritability (\(h^2\)) at each site.  
  (ii) Explain why broad-sense heritability (\(H^2\)) is unproblematic at Site A but requires a convention at Site B. Give both candidate values for \(H^2\) at Site B and state how the choice of convention affects the reported number.  

  **(b)** (8 marks)  
  (i) Predict the response to selection (in grams) for a selection differential of 10 g at each site.  
  (ii) Explain why identical additive genetic variance (\(V_A = 28\)) results in different responses across sites. Include a discussion of whether a 10 g selection differential represents equal selection intensity at sites with different phenotypic variances.  

  **(c)** (10 marks)  
  A ministry official is told that narrow-sense heritability at Site C is 0.70 compared to 0.35 at Site B. They conclude:  
  - "The environment has now been taken care of,"  
  - "Further investment in uniform environmental provision (e.g., irrigation) cannot raise yield,"  
  - "Breeding is the only remaining lever to increase yields."  
  Assess this conclusion using the data and concepts of heritability.  

  **(d)** (8 marks)  
  A donor agency proposes shipping the top-performing lines (genotypes) from Site A to Site B because "yield is 0.90 genetic at Site A (broad-sense), so winners there will be winners anywhere." Assess this proposal.  

  **(e)** (6 marks)  
  A seed company reasons: "Since broad-sense heritability at Site A is 0.90 and Site A’s mean yield exceeds Site B’s by 15 g, roughly 90% of that gap is genetic." Assess this reasoning.  

  ---

  ### Model Answer and Marking Scheme  
  **General Notes:**  
  - Full marks require correct arithmetic **and** correct interpretation.  
  - Misinterpretations (e.g., ignoring genotype-environment interactions, misapplying heritability to between-group differences) cost marks.  
  - Key insights for high grades:  
    - Heritability increases when environmental variance decreases (Site B vs. C).  
    - Within-site heritability does not explain between-site mean differences (e.g., A vs. B gap is environmental).  
    - \(V_A\) is fixed across sites for simplicity, but real-world additive variance can vary.  

  **Model Answer:**  

  **(a)** (8 marks)  
  *(i) Narrow-sense heritability (\(h^2\)):*  
  - Site A: \(V_P = V_A + V_D + V_E + V_{G\times E} = 28 + 8 + 4 + 0 = 40\)  
    \(h^2 = V_A / V_P = 28 / 40 = 0.70\)  
  - Site B: \(V_P = 28 + 8 + 32 + 12 = 80\)  
    \(h^2 = 28 / 80 = 0.35\)  
  - Site C: \(V_P = 28 + 8 + 4 + 0 = 40\)  
    \(h^2 = 28 / 40 = 0.70\)  

  *(ii) Broad-sense heritability (\(H^2\)):*  
  - Site A: Unproblematic because \(V_{G\times E} = 0\), so \(V_G = V_A + V_D = 36\).  
    \(H^2 = 36 / 40 = 0.90\) (only one convention).  
  - Site B: Convention needed due to \(V_{G\times E} > 0\):  
    - Convention 1 (exclude \(V_{G\times E}\) in \(V_G\)): \(V_G = V_A + V_D = 36\), \(H^2 = 36 / 80 = 0.45\).  
    - Convention 2 (include \(V_{G\times E}\) in \(V_G\)): \(V_G = V_A + V_D + V_{G\times E} = 36 + 12 = 48\), \(H^2 = 48 / 80 = 0.60\).  
  - Choice of convention changes \(H^2\) from 0.45 to 0.60 (a 33% increase).  

  **Marking Scheme (a):**  
  - Correct \(h^2\) for all three sites (3 marks: 1 per site).  
  - Explanation for Site A (unproblematic, 1 mark).  
  - Statement of ambiguity at Site B (1 mark).  
  - Both conventions for Site B (2 marks: 1 per convention).  
  - Effect of convention on \(H^2\) (1 mark).  
  - *Deduct 1 mark* for arithmetic errors.  

  **(b)** (8 marks)  
  *(i) Response to selection (\(R\)):*  
  - \(R = h^2 \times S\) (where \(S = 10\) g).  
  - Site A: \(R = 0.70 \times 10 = 7.0\) g  
  - Site B: \(R = 0.35 \times 10 = 3.5\) g  
  - Site C: \(R = 0.70 \times 10 = 7.0\) g  

  *(ii) Explanation:*  
  - Identical \(V_A\) (28) gives different responses because \(h^2 = V_A / V_P\) depends on \(V_P\).  
  - Site B has higher \(V_P\) (80 vs. 40 at A/C), reducing \(h^2\) (0.35 vs. 0.70).  
  - **Selection intensity:** Measured as \(i = S / \sigma_P\) (standard deviation).  
    - Site A: \(\sigma_P = \sqrt{40} \approx 6.32\), \(i = 10 / 6.32 \approx 1.58\)  
    - Site B: \(\sigma_P = \sqrt{80} \approx 8.94\), \(i = 10 / 8.94 \approx 1.12\)  
    - Site C: Same as A (\(i \approx 1.58\)).  
  - A 10 g differential represents **lower selection intensity** at Site B due to higher \(\sigma_P\).  

  **Marking Scheme (b):**  
  - Correct \(R\) for all sites (3 marks: 1 per site).  
  - Explanation of \(h^2\) dependence on \(V_P\) (2 marks).  
  - Calculation of \(\sigma_P\) and \(i\) for Sites A and B (2 marks).  
  - Discussion of unequal selection intensity (1 mark).  
  - *Deduct 1 mark* for missing units or arithmetic errors.  

  **(c)** (10 marks)  
  **Assessment of ministry official’s conclusion:**  
  1. **"Environment taken care of":** Partially true. Heritability increased at Site C (0.70 vs. 0.35 at B) because uniform irrigation reduced \(V_E\) (32 → 4) and eliminated \(V_{G\times E}\) (12 → 0). However, \(V_E = 4 > 0\) and \(h^2 = 0.70\) implies 30% of variance is still environmental, so the environment is not fully controlled.  
  2. **"Further investment cannot raise yield":** False. Uniform environmental improvements (e.g., better irrigation) could:  
     - Increase mean yield (e.g., if Site C’s mean is not maximal).  
     - Further reduce \(V_E\) (currently 4), raising heritability and response to selection.  
  3. **"Breeding is the only lever":** False. Environmental improvements (e.g., reducing \(V_E\)) remain viable. Breeding gains depend on \(h^2\), but \(h^2 = 0.70\) leaves room for both approaches.  
  4. **Key insight:** Heritability increased precisely *because* the environment was improved and standardized (reducing \(V_E\) and \(V_{G\times E}\)). This does not imply environmental interventions are exhausted.  

  **Marking Scheme (c):**  
  - Recognition that heritability rise is due to reduced \(V_E\) and \(V_{G\times E}\) (2 marks).  
  - Critique of "environment taken care of" (residual \(V_E > 0\), 2 marks).  
  - Critique of "no further investment" (environment can still boost mean/reduce variance, 2 marks).  
  - Critique of "only breeding" (environmental levers exist, 2 marks).  
  - Link to Site C’s improvement (1 mark).  
  - Clarity/coherence (1 mark).  
  - *Deduct 2 marks* for agreeing with the official or ignoring data.  

  **(d)** (8 marks)  
  **Assessment of donor agency proposal:**  
  - **Flawed reasoning:** High broad-sense heritability at Site A (\(H^2 = 0.90\)) reflects **within-site** genetic variation, not **between-site** performance.  
  - **G×E interaction:** Site B has \(V_{G\times E} = 12\), indicating genotype performance ranks change across environments (e.g., drought tolerance in B vs. optimal conditions in A).  
  - **Evidence:** Site A mean (55 g) is higher than B (40 g), but the same genotypes yield 55 g at Site C (same location as B). This shows performance depends on environment, not just genetics.  
  - **Conclusion:** Winners at Site A may not be winners at Site B due to G×E. Selecting genotypes in target environments (B) is better than relying on A.  

  **Marking Scheme (d):**  
  - Critique of misapplying within-site heritability to between-site prediction (2 marks).  
  - Explanation of G×E at Site B (\(V_{G\times E} = 12\)) and its implications (2 marks).  
  - Use of mean difference (A vs. B) and Site C evidence (2 marks).  
  - Clear rejection of proposal (1 mark).  
  - Structure/clarity (1 mark).  
  - *Deduct 2 marks* for not mentioning G×E.  

  **(e)** (6 marks)  
  **Assessment of seed company reasoning:**  
  - **Fallacy:** Heritability quantifies **within-population** variance, not **between-population** mean differences. The 15 g gap (A = 55 g vs. B = 40 g) is a difference in means, not variance.  
  - **Data refutes claim:** Site C (same genotypes, improved environment) yields 55 g, identical to Site A. This proves the gap was entirely environmental (due to Site B’s poor conditions).  
  - **Correct inference:** 0% of the gap is genetic; 100% is environmental. Broad-sense heritability at A is irrelevant.  

  **Marking Scheme (e):**  
  - Identification of ecological fallacy (within vs. between population, 2 marks).  
  - Use of Site C evidence to show gap is environmental (2 marks).  
  - Explicit rejection of 90% claim (1 mark).  
  - Clarity (1 mark).  
  - *Deduct 3 marks* for not citing Site C or misattributing gap to genetics.  

  ---

  **Grade Boundaries:**  
  - **A (36–40 marks):** Correct arithmetic, nuanced interpretation, and identification of key insights:  
    - Heritability rises when environments are standardized (c).  
    - Between-site gap is environmental (e).  
    - G×E invalidates cross-site predictions (d).  
  - **B (30–35 marks):** Correct arithmetic and solid understanding but misses nuances (e.g., does not explicitly note Site C’s role in refuting inferences).  
  - **C (20–29 marks):** Basic arithmetic correct but major misinterpretations (e.g., agreeing with officials/companies).  
  - **Fail (<20 marks):** Arithmetic errors and/or failure to interpret data (e.g., reciting "heritability is population-relative" without applying it).  

  **Pass Requirement:** Candidates who only recite general principles (e.g., "heritability is context-dependent") without using data fail to reach 20 marks.
