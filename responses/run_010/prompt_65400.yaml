prompt: |-
  I am setting the final examination for a masters module in philosophy of biology whose students have been taught the arithmetic of variance partitioning but are unreliable in interpreting it. Please write one question on heritability, worth 40 marks and answerable in 90 minutes with a calculator, together with a model answer that shows the arithmetic and a marking scheme that allocates marks by part and names the particular misinterpretations that should cost marks.

  The question must be driven by data rather than by exposition. Give the students this table: the same panel of 40 genotypes of a grain legume is grown at three sites, and dry yield per plant (grams) has the following variance components and means — Site A, an irrigated research station: V_A = 28, V_D = 8, V_E = 4, V_G×E = 0, mean 55; Site B, rain-fed smallholder fields: V_A = 28, V_D = 8, V_E = 32, V_G×E = 12, mean 40; Site C, the same fields under a uniform irrigation-and-extension package: V_A = 28, V_D = 8, V_E = 4, V_G×E = 0, mean 55. Tell the students that the components are stipulated as constant across sites for simplicity.

  Build the question out of five parts: (a, 8 marks) compute narrow-sense heritability at each site, and explain why a broad-sense figure is unproblematic at Site A but turns on a convention at Site B, giving both candidate values and saying what the choice does to the reported number; (b, 8 marks) predict the response to a selection differential of 10 g at each site, and explain why identical additive variance buys such different responses, including whether the same 10 g differential represents equal selection intensity at sites with such different phenotypic spreads; (c, 10 marks) assess a ministry official who, told that heritability at Site C is 0.70 against 0.35 at Site B, concludes that the environment has now been "taken care of," that further investment in uniform provision cannot raise yield, and that breeding is the only remaining lever; (d, 8 marks) assess a donor agency that proposes shipping the top-performing lines identified at Site A to Site B on the grounds that yield is 0.90 genetic at Site A, so winners there will be winners anywhere; (e, 6 marks) assess a seed company that reasons that since broad-sense heritability at Site A is 0.90 and Site A's mean exceeds Site B's by 15 g, roughly 90% of that gap is genetic.

  The design has to make the numbers do the work: a candidate who recites only that heritability is population-relative and does not describe individuals should fail to reach a pass. State explicitly in the marking scheme what separates an A from a B, and I expect that to include noticing that heritability at Site C doubles precisely because the environment was improved and equalised, that the shared germplasm already refutes the inference from within-site heritability to the between-site mean gap, and that holding V_A fixed across environments is itself a simplification worth flagging. The question must be self-contained, requiring no outside literature.
reasoning: |-
  We are given a table with data for three sites (A, B, C) for the same 40 genotypes of a grain legume. The variance components and means are provided:

  Site A (irrigated research station):
    V_A = 28 (additive genetic variance)
    V_D = 8 (dominance genetic variance)
    V_E = 4 (environmental variance, non-genetic)
    V_G×E = 0 (genotype by environment interaction variance)
    mean = 55 g

  Site B (rain-fed smallholder fields):
    V_A = 28, V_D = 8, V_E = 32, V_G×E = 12, mean = 40 g

  Site C (same fields as B but under uniform irrigation-and-extension package):
    V_A = 28, V_D = 8, V_E = 4, V_G×E = 0, mean = 55 g

  Note: The components V_A, V_D are stipulated as constant across sites for simplicity.

  We are to build a question with five parts (a to e) as described.

  Part (a): Compute narrow-sense heritability at each site, and explain why a broad-sense figure is unproblematic at Site A but turns on a convention at Site B, giving both candidate values and saying what the choice does to the reported number.

  Narrow-sense heritability (h²) is defined as h² = V_A / V_P, where V_P is the total phenotypic variance.

  Broad-sense heritability (H²) is defined as H² = V_G / V_P, where V_G is the total genetic variance (V_G = V_A + V_D + ...). However, note that in the presence of G×E, there is a question of whether to include V_G×E in the genetic variance or not? Actually, in the standard decomposition, the phenotypic variance at a given site is:

  V_P = V_G + V_E + V_G×E   [but note: V_G is the genetic variance that is expressed in the population, and V_G×E is the interaction variance. However, the total genetic variance in a multi-environment context is not simply V_G because the interaction is part of the genetic variation across environments. But for a single environment, we decompose the phenotypic variance as:

  V_P = V_G + V_E + V_{GE}   [if we consider the environment fixed, then V_{GE} might be considered as part of the non-additive genetic and environmental interaction]

  But in the problem, we are given V_A, V_D, V_E, and V_G×E. So:

  Total genetic variance (V_G) at a site: V_G = V_A + V_D
  However, note that V_G×E is an additional component that is due to the interaction of genotypes with the specific environment. In a single environment, the phenotypic variance is:

  V_P = V_G + V_G×E + V_E

  But wait: the classical decomposition for a single environment is:

  V_P = V_G + V_E

  However, if we have multiple environments and we are looking at a single environment, then the V_G×E component is actually part of the variance in that environment? Actually, the problem states that the variance components are given per site. So at a given site, the phenotypic variance is:

  V_P = V_A + V_D + V_G×E + V_E

  But note: V_G×E is the variance due to genotype-by-environment interaction, which for a single environment is not separable from the genetic variance? Actually, when we are at a fixed environment, the interaction term for that environment is a fixed effect? Or is it random?

  The problem states that V_G×E is given as a component at each site. So we interpret:

  At a site, the phenotypic variance is:
    V_P = V_A + V_D + V_G×E + V_E

  However, note that in the classical ANOVA for a single environment, the interaction term is not present because there is only one environment. But here, the panel of genotypes is grown at multiple sites, so the interaction term is the variance component for the interaction that is specific to the environment? Actually, the problem states that the components are given for each site. Therefore, at each site, the phenotypic variance is:

  V_P = V_A + V_D + V_G×E + V_E

  But wait: in a single environment, the G×E term is not estimable because there is only one environment. However, the problem is providing the components as if they are known from a multi-environment experiment. We are told that the same panel is grown at three sites, so the components are derived from a combined analysis.

  But for the purpose of this question, we take the given components at each site as the decomposition for that site. Therefore:

  At Site A: V_P = V_A + V_D + V_G×E + V_E = 28 + 8 + 0 + 4 = 40
  At Site B: V_P = 28 + 8 + 12 + 32 = 80
  At Site C: same as A: 28+8+0+4=40

  Therefore, narrow-sense heritability (h²) at each site:

  Site A: h² = V_A / V_P = 28 / 40 = 0.70
  Site B: h² = 28 / 80 = 0.35
  Site C: same as A: 28/40 = 0.70

  Now, broad-sense heritability (H²) is defined as the ratio of total genetic variance to phenotypic variance. The total genetic variance at a site is V_G = V_A + V_D. However, note that the interaction term V_G×E is also genetic in nature? But in the decomposition, V_G×E is a separate component. There are two conventions:

  Convention 1: Include only V_A and V_D in the genetic variance (so V_G = V_A+V_D), and then H² = (V_A+V_D)/V_P.

  Convention 2: Some might argue that V_G×E is part of the genetic variation because it reflects genetic differences in response to the environment. Then H² = (V_A+V_D+V_G×E)/V_P.

  At Site A: V_G×E=0, so both conventions give the same: 
    Convention 1: H² = (28+8)/40 = 36/40 = 0.90
    Convention 2: same because V_G×E=0.

  At Site B: 
    Convention 1: H² = (28+8)/80 = 36/80 = 0.45
    Convention 2: H² = (28+8+12)/80 = 48/80 = 0.60

  So the choice of convention changes the reported number: 0.45 vs 0.60.

  Part (b): Predict the response to a selection differential of 10 g at each site, and explain why identical additive variance buys such different responses, including whether the same 10 g differential represents equal selection intensity at sites with such different phenotypic spreads.

  Response to selection (R) is given by R = h² * S, where S is the selection differential.

  Therefore:
  Site A: R = 0.70 * 10 = 7 g
  Site B: R = 0.35 * 10 = 3.5 g
  Site C: R = 0.70 * 10 = 7 g

  Explanation: The response depends on h², which is V_A / V_P. Even though V_A is the same at all sites, the phenotypic variance (V_P) is different. At Site B, V_P is larger (80) than at A and C (40), so h² is lower (0.35 vs 0.70). Hence, the same additive variance leads to a lower response at Site B.

  Also, the same selection differential (10 g) does not represent the same selection intensity. Selection intensity (i) is the selection differential in standard deviation units: i = S / σ_P.

  At Site A: σ_P = sqrt(40) ≈ 6.32, so i = 10 / 6.32 ≈ 1.58
  At Site B: σ_P = sqrt(80) ≈ 8.94, so i = 10 / 8.94 ≈ 1.12
  At Site C: same as A: i ≈ 1.58

  So the selection intensity is lower at Site B for the same absolute differential (10 g) because the phenotypic variance is higher. This is an additional reason for the lower response.

  Part (c): Assess a ministry official who, told that heritability at Site C is 0.70 against 0.35 at Site B, concludes that the environment has now been "taken care of," that further investment in uniform provision cannot raise yield, and that breeding is the only remaining lever.

  We note that Site C has the same variance components as Site A (irrigated research station) and a mean of 55 g, which is 15 g higher than Site B's 40 g. The improvement from Site B to Site C (by introducing uniform irrigation and extension) has increased the mean and also changed the variance components: at Site C, V_E is reduced from 32 to 4 and V_G×E from 12 to 0. The heritability increased because the environmental variance decreased. The official concludes that the environment is now taken care of and further uniform provision cannot raise yield.

  However, note that at Site C, the environmental variance (V_E) is 4, which is the same as at Site A. But there might still be room for environmental improvement? For example, if we could reduce V_E even further? But the official says "further investment in uniform provision" – meaning more of the same kind? The data does not tell us if we can reduce V_E below 4. However, the heritability is 0.70, meaning that 30% of the variance is still environmental. So if we could reduce the environmental variance further (by even better environmental control), then the mean might increase and the heritability might increase further? But note: the heritability increase from Site B to Site C is due to reducing the environmental variance and eliminating the G×E. The mean yield increased by 15 g, which is a big improvement. However, the official's conclusion that further investment in uniform provision cannot raise yield is not necessarily true. It might be that further uniform improvements (e.g., better irrigation, better soil management) could raise the mean yield without necessarily changing the variance structure? The mean yield at Site C is 55 g, which is the same as at Site A. But is that the maximum? We don't know.

  Moreover, the official says that breeding is the only remaining lever. This might be true in the sense that with the environment fixed, we can only improve by breeding. However, note that the heritability is 0.70, which is high, so breeding can lead to gains. But it is not the only lever: if we can further improve the environment (e.g., by a different kind of intervention), we might get more gains.

  Additionally, note that the mean yield at Site C (55 g) is the same as at Site A, but we don't know the potential maximum. Also, the problem says that Site A is an irrigated research station and Site C is the same fields as B but under a uniform irrigation-and-extension package. So Site C might not have reached the level of the research station in terms of environmental control? But the numbers are the same.

  But the key point: the increase in heritability at Site C compared to Site B is due to reducing the environmental variance and the G×E variance. However, the official's inference that the environment has been taken care of is partially true (because V_E is now low and G×E is zero) but that doesn't mean that the environment cannot be improved further to raise the mean yield. The heritability being 0.70 does not imply that the environment is optimal; it only means that the relative contribution of genetics to variance is 70%. The mean yield might still be raised by environmental improvements that are uniform (i.e., that do not create more variance). For example, if we add a fertilizer that increases yield for every genotype by 5 g, then the mean would increase to 60 g without changing the variance components (if the fertilizer is applied uniformly). So the official is wrong to say that further uniform provision cannot raise yield.

  Part (d): Assess a donor agency that proposes shipping the top-performing lines identified at Site A to Site B on the grounds that yield is 0.90 genetic at Site A, so winners there will be winners anywhere.

  At Site A, the broad-sense heritability is 0.90 (by convention 1, since V_G×E=0, and we have V_G=36, V_P=40). The agency reasons that because the heritability is high at Site A, the lines that perform well there will perform well at Site B.

  However, note that Site A and Site B are very different environments. The mean at Site A is 55 g and at Site B is 40 g. Moreover, there is a significant G×E component at Site B (V_G×E=12). This G×E indicates that the relative performance of genotypes may change between environments. Therefore, the best performers at Site A may not be the best at Site B.

  Additionally, note that the genetic correlation between performances at the two sites might be less than 1. The presence of G×E suggests that the ranking of genotypes changes. Therefore, the agency's proposal is flawed.

  Part (e): Assess a seed company that reasons that since broad-sense heritability at Site A is 0.90 and Site A's mean exceeds Site B's by 15 g, roughly 90% of that gap is genetic.

  The seed company is trying to attribute the mean difference between Site A and Site B to genetic causes. They say that because at Site A the broad-sense heritability is 0.90, then 90% of the difference in yield between Site A and Site B must be genetic.

  This is a common fallacy. Heritability is about the proportion of variance within a population that is due to genetic factors. It does not apply to differences between populations (or between environments). The mean difference of 15 g between Site A and Site B could be entirely environmental. In fact, note that the same genotypes are grown at both sites. The difference in mean yield between the two sites is due to the environment. The heritability within Site A does not tell us about the cause of the difference between Site A and Site B.

  Moreover, we see that at Site C (which is the same fields as Site B but with uniform irrigation and extension) the mean yield is 55 g, the same as at Site A. This shows that the gap between Site B and Site A was entirely environmental because when we improved the environment at Site B (to become Site C), the mean rose to 55 g. Therefore, the seed company's reasoning is wrong: the entire 15 g gap is environmental.

  Now, we write the question and model answer accordingly.

