prompt: |-
  I have just been awarded a modest four-year grant to run a small research program at the intersection of metaethics and cross-cultural psychology. Its stated aim, in the language of the proposal, is to determine whether the empirical record of cross-cultural variation in moral judgment licenses any substantive conclusion about moral objectivity. My resources are narrow and I want the agenda built around them rather than around an idealized project: two funded doctoral students, no postdocs, a collaborating lab that can field large online panels in roughly a dozen countries, and a budget for two workshops. I have no capacity for long-term ethnographic work in small-scale societies and no realistic prospect of acquiring any.

  The questions I keep circling are the following. First, whether the documented variation is variation in the content of moral judgment, variation in which norms people moralize (that is, in the scope of morality rather than in its deliverances), or variation only in second-order self-reports about the status of morality — the three diagnoses have very different implications, and I have rarely seen them separated within a single instrument. Second, whether the instruments survive translation at all: in our pilot, the English items built around 'wrong' behaved quite differently from their closest counterparts at two sites, where the available vocabulary sorted transgressions by shame and contamination rather than by harm, and the standard dilemma materials lost their grip entirely. Third, whether the empirical base for genuinely alternative moralities is as wide as the debate assumes, given how much of the supposedly non-WEIRD evidence still comes from university students in industrializing economies, or from communities with a century or more of exposure to state legal systems and proselytizing religions. Our pilot also produced a result I do not know what to do with: at three sites, the participants who gave the most objectivist answers to the second-order questions were the ones whose first-order judgments moved most with framing. Fourth, whether the diversity argument is self-undermining — if construct validity fails across languages, it looks as though we lose both the evidence of deep disagreement and the shared subject matter that disagreement would have to be about.

  What I want from you is a defended agenda, not a survey of the debate. Select the four to six open questions this program should actually spend four years on, rank them, and tell me for each: how far upstream it sits, in the sense that settling it would reshape or dissolve the others; how tractable it is with the resources described above rather than with those of a well-funded team; how neglected it is relative to the attention it currently receives; and whether its answer would change the philosophical bottom line about objectivity or would merely be empirically interesting. Then name one or two fashionable questions in this area that I should refuse to fund, and explain what makes them traps. Finally, tell me which specific results over the next two years would move items up or down your ordering — I want to know in advance which findings should make me redesign the program. Please do not include a reading list, bibliography, or paper recommendations; I am after the reasoning, and I would much rather you argue from the structure of the problem than reach for citations you may be unsure of. Write in American English, and close with a single line of the form \answer{...} containing a short label of no more than about six words for the one question you would fund first.
reasoning: |-
  Okay, let me start by understanding the user's situation. They've got a four-year grant for a research program at the intersection of metaethics and cross-cultural psychology. The main goal is to see if cross-cultural variation in moral judgments affects the debate on moral objectivity. Their resources are limited: two doctoral students, a collaborating lab for online panels in about a dozen countries, and a budget for two workshops. No capacity for long-term ethnographic work.

  The user outlined four key questions they're circling. First, distinguishing between content variation, scope variation, or second-order reporting differences. Second, translation issues with instruments—earlier pilots showed problems with words like 'wrong' in different languages. Third, whether the evidence for alternative moralities is solid, given that many studies still use WEIRD-adjacent populations. Fourth, if the diversity argument undermines itself because of construct validity problems across languages.

  I need to create a defended agenda with 4-6 ranked questions. Each question needs evaluation on upstream impact, tractability with their resources, neglect in current research, and whether it changes the philosophical bottom line on objectivity. Then, identify one or two fashionable questions to avoid and explain why they're traps. Also, specify which results in the next two years would reshuffle the priorities.

  Starting with ranking the questions. The translation and construct validity issue (Question 4) seems foundational. If instruments don't translate well, then the entire empirical basis for cross-cultural variation is shaky. That affects all other questions because without valid measures, you can't reliably study variation. So that should be first. It's also tractable with their online panels in multiple countries. They can test different translations and see how items perform. This question is understudied because most research focuses on content variation without checking measurement validity. If construct validity fails, it challenges the existence of genuine moral disagreement, which directly impacts the objectivity debate.

  Next, Question 1: distinguishing content, scope, and second-order reporting. This is upstream because clarifying what varies affects how we interpret diversity. If variation is in scope (what's moralized) rather than content, it might not threaten objectivity as much. Their resources can handle this with vignettes and structured surveys across cultures. It's somewhat neglected as most studies don't separate these dimensions. Answering this could change the philosophical bottom line by showing that apparent disagreements are about different domains, not conflicting truths.

  Question 3 addresses the evidence base for alternative moralities. Many studies cite examples from non-WEIRD populations, but those groups might still be influenced by state systems or religions. This is tractable with their online panels, targeting diverse samples within countries. It's under-addressed because the replication crisis hasn't fully hit cross-cultural psychology. If alternative moralities are rarer than thought, the challenge to objectivity weakens. This has significant philosophical implications.

  Question 2 about translation challenges is important but overlaps with Question 4. Since they already have pilot data showing issues, this could be integrated into the first question. However, it's specific to instrument design. But given resource limits, it might be better folded into the construct validity work.

  Prioritizing Question 4 (construct validity) as first makes sense because it's the foundation. Without valid measures, other results are questionable. Then Question 1 (types of variation), followed by Question 3 (evidence base). The framing effect from their pilot (objectivists more influenced by framing) could be a separate question but might fit under Question 1 as it relates to second-order reports.

  The user mentioned a puzzling result: participants who gave objectivist answers had first-order judgments that moved with framing. This could be integrated into the second-order reporting part of Question 1. Investigating why self-reported objectivists are more susceptible to framing might reveal cognitive aspects of moral objectivity.

  For traps, avoiding neural correlates of moral judgments. It's fashionable but requires fMRI, which they can't afford, and doesn't directly address objectivity. Also, avoiding large-scale moral disagreement surveys without solving measurement issues first, as it risks collecting invalid data.

  Results that could reshuffle priorities: if early data shows minimal construct validity issues, then shift focus to variation types. If they find that translation problems are pervasive, that reinforces the priority on Question 4. If urban-rural differences are significant, it might elevate Question 3's importance.

  The top question label should be concise. "Cross-cultural measurement validity for moral concepts" captures the essence of Question 4.
answer: |-
  Here is a defended research agenda prioritizing tractability, upstream impact, and philosophical relevance within your constraints:

  **Ranked Research Questions (4 core, 2 contingent):**

  1.  **Measurement Validity & Construct Equivalence:** *Do core moral concepts (e.g., "wrong," "should," "moral") map reliably across the target languages/cultures, or do translation/emic differences invalidate cross-cultural comparison of moral judgments?*
      *   **Upstream:** **Highest.** If constructs aren't equivalent, the entire empirical basis for cross-cultural variation (and thus its philosophical implications) crumbles. Reshapes all other questions by determining if meaningful comparison is even possible.
      *   **Tractability:** **High.** Perfect for your resources. Use collaborating labs. Start with existing scales (MFQ, etc.) and your problematic pilot terms ("wrong"). Employ advanced translation/back-translation, cognitive interviews, and pile-sorting tasks within each panel to map semantic networks. Test dimensionality and item functioning (e.g., CFA, IRT) across sites. Focus on the 1-2 most problematic concepts per language initially.
      *   **Neglect:** **High.** While translation is acknowledged, deep construct validation is rare. Most studies assume equivalence or use superficial translation checks. The potential for *category* mismatch (shame/harm) is severely under-investigated.
      *   **Bottom Line:** **Transformative.** If equivalence fails, it directly undermines the empirical premise of the diversity argument for anti-realism. If equivalence holds only for specific constructs, it radically refines *what* variation can be studied meaningfully.

  2.  **Nature of Variation:** *Is documented cross-cultural variation primarily in (a) the specific content endorsed under shared fundamental norms (e.g., *what* counts as harm), (b) the scope of what is moralized (e.g., purity, authority), or (c) second-order reporting about judgment status?*
      *   **Upstream:** **Very High.** Diagnosing the *type* of variation is essential before inferring its implications for objectivity. Content variation might imply disagreement; scope variation might imply modular expansion; reporting variation might imply meta-cognitive differences.
      *   **Tractability:** **High.** Design integrated instruments: Present concrete vignettes covering diverse domains (harm, fairness, loyalty, authority, purity). For each vignette, measure: (1) First-order judgment (acceptability), (2) *Why* it's wrong/right (open-ended/coded), (3) Strength of moralization (e.g., "Is this a moral issue?"), (4) Second-order objectivity (e.g., "Could someone else be right if they disagree?"). Use online panels for quantitative data; workshops can refine coding schemes from open-ended responses.
      *   **Neglect:** **Moderate-High.** Variation is documented, but disentangling these types rigorously *within one instrument* across cultures is rare. Second-order reporting is often studied in isolation.
      *   **Bottom Line:** **Potentially Transformative.** If variation is mostly scope or reporting, it weakens arguments from deep disagreement about core content. If it's robust content variation on foundational norms, it strengthens the challenge. Your pilot finding (objectivists + framing sensitivity) fits here – explore if this reflects a specific meta-cognitive profile correlating with reporting style.

  3.  **Robustness of "Alternative Moralities":** *Within your diverse panels, how does proximity to state institutions, market integration, and exposure to proselytizing religions correlate with moral judgment profiles, especially in non-WEIRD samples?*
      *   **Upstream:** **Moderate-High.** Challenges the assumed breadth of "genuine" alternatives. If variation diminishes significantly outside specific (modernizing) contexts, it limits the scope of the anti-realist argument from diversity.
      *   **Tractability:** **High.** Leverage online panels across diverse regions within countries (e.g., urban professionals vs. rural farmers in middle-income nations). Use established demographic/contextual measures (e.g., SES, religiosity, market integration scales). Correlate these with moral judgment profiles (from Q2 instruments). Workshops can help identify key contextual markers.
      *   **Neglect:** **Moderate.** WEIRD critique is prominent, but systematic analysis of *within-non-WEIRD-country* variation linked to specific modernizing factors is less common than broad WEIRD/non-WEIRD comparisons.
      *   **Bottom Line:** **Significant.** Would refine the empirical landscape. Finding widespread "WEIRD-like" judgments even in nominally non-WEIRD samples under certain conditions would weaken the diversity argument; finding robust pockets of distinct judgment would strengthen it.

  4.  **The Framing-Objectivism Paradox:** *What explains the correlation (from your pilot) between strong second-order objectivism and first-order judgment susceptibility to framing? Is this a stable phenomenon across cultures?*
      *   **Upstream:** **Moderate.** Bears directly on the *epistemic status* of objectivist intuitions. If objectivist reporting correlates with cognitive instability, it challenges its reliability as evidence for realism.
      *   **Tractability:** **Moderate.** Requires careful experimental design within panels. Develop culturally adapted framing manipulations (e.g., gain/loss, agent/patient focus) for moral vignettes. Measure both first-order judgment shifts and second-order objectivism. Resource-intensive per participant but feasible with online panels.
      *   **Neglect:** **High.** The *relationship* between second-order meta-ethical intuitions and first-order cognitive processing is rarely studied empirically, especially cross-culturally.
      *   **Bottom Line:** **Philosophically Relevant.** Wouldn't single-handedly settle objectivity but provides crucial empirical insight into the psychology underpinning objectivist *beliefs*, potentially challenging their justificatory weight.

  *(Contingent Questions - Prioritize if early results warrant):*

  5.  **Scope Dynamics:** *How malleable is the scope of moralization (what gets moralized) within individuals across contexts, and does this vary culturally?* (Dependent on Q1/Q2 showing scope variation is significant).
  6.  **Disagreement vs. Incommensurability:** *When construct equivalence is low (Q1), can we identify areas of genuine normative *disagreement* vs. areas of conceptual incommensurability?* (Dependent on Q1 finding significant equivalence problems).

  **Fashionable Traps to Avoid:**

  1.  **Large-Scale Moral Disagreement Surveys Without Measurement Validation:** Launching massive surveys cataloging "disagreement" without first rigorously addressing Q1 (Measurement Validity). **Why a Trap:** Risks generating vast amounts of data where differences are artifacts of translation/emic concepts, not genuine moral disagreement. Wastes resources on uninterpretable results that won't resolve philosophical questions. Your pilot flags this danger.
  2.  **Neural Correlates of Moral Judgment Across Cultures:** Using fMRI or complex neuroimaging to find cultural differences in brain activity during moral tasks. **Why a Trap:** Requires immense resources (money, expertise, access to scanners globally) you lack. Findings are notoriously difficult to interpret philosophically (neural difference ≠ evidence for/against objectivity). Distracts from the foundational conceptual and psychometric issues your program is uniquely positioned to address.

  **Results That Would Reshuffle Priorities (Next 2 Years):**

  *   **Move Q1 Down:** If rigorous construct validation across your initial sites shows *strong equivalence* for core moral terms/concepts (e.g., "wrong," "should") and scales, reducing concern about invalid comparison. *Shift focus to Q2 & Q3.*
  *   **Move Q1/Q2 Up:** If validation (Q1) reveals *profound, irreconcilable category mismatches* (e.g., shame/harm divide dominates, no direct equivalent for "moral obligation") in multiple sites. *This makes Q6 (Incommensurability) critical and potentially the new Q1.*
  *   **Move Q3 Up:** If initial data shows *striking homogeneity* in moral judgments across urban/rural or highly vs. less integrated groups within non-WEIRD sites, suggesting "alternative moralities" are rarer than assumed. *Elevate Q3 to challenge the diversity evidence base directly.*
  *   **Move Q4 Up:** If replication of the Framing-Objectivism paradox proves *robust and widespread* across several cultures. *Suggests a fundamental, cross-cultural cognitive link needing explanation, elevating its importance for understanding objectivity's psychology.*
  *   **Move Q2 Down:** If initial integrated measurement (Q2) shows *overwhelmingly* that variation is confined to scope or second-order reporting, with minimal fundamental content disagreement. *Reduces urgency, though follow-up on scope (Q5) might emerge.*

  \answer{Cross-cultural moral concept measurement validity}
