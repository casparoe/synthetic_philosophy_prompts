  Could you write that as a short story, maybe 1500–2500 words, from her point of view? I want the mathematics to be the engine, not set dressing: by the last page a reader should feel why "every chain has an upper bound" is the load-bearing hypothesis, and why existence-without-construction lands as a kind of betrayal. Change my invented details freely, just don't soften the lemma or fudge the counterexample.

