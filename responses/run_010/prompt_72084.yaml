prompt: |-
  I would like help identifying the principle, if there is one, that underlies my verdicts about which states count as emotions. I have been going case by case, and the pattern that emerges does not look like any of the three families I know of — emotions as judgments or appraisals, emotions as perceptions of value, emotions as feelings or as perceptions of one's own bodily changes. My verdicts:

  1. My heart races and my palms dampen before a job interview, and I experience this as dread — but the cause is a double espresso, and once I notice that, the dread evaporates. Not an emotion, or at any rate not fear.
  2. I recoil in terror from a house spider that I know, without reservation, to be harmless. My considered judgment says there is nothing to fear. This is fear, unmistakably.
  3. A low-grade unease that has hung over me for three weeks and for which I could name no object if asked. A mood, not an emotion.
  4. Being brought to tears by a passage of music I have heard a hundred times, while believing nothing sad has happened and not taking the music to be about anything. An emotion, though I cannot say what it is directed at.
  5. A cold, articulate indignation at an injustice I read about: I can state precisely what was done wrong and to whom, I am disposed to write letters and to donate, but there is no heat and no agitation, nothing it is like to be indignant. Still anger.
  6. My startle at a door slamming behind me. Not an emotion.
  7. Shame at my accent when speaking a language I learned late, where nothing morally bad has occurred and nobody has been slighted. An emotion.
  8. Fear on behalf of a character in a novel, in full and unshakeable knowledge that the character does not exist. An emotion.
  9. Schadenfreude at a rival's public failure, which I find repugnant and would disavow on reflection. An emotion, and no less of one for my repudiation of it.
  10. A fury at a colleague that persisted across a week in which I thought of him twice and felt nothing in particular. Still anger, not its absence.

  At least two pairs here seem irreconcilable. The espresso case has all the felt arousal of fear and none of the appraisal, and I deny that it is an emotion; the cold indignation has all the appraisal and none of the arousal, and I insist that it is one. Likewise, the standing unease and the response to the music both lack a nameable object, and I sort them differently.

  My own tentative principle is that an emotion is a state that represents something as good or bad — for me, or for someone whose fortunes I am invested in — and that is poised to move me to act. I can see that this is either too broad, since thirst represents water as good and moves me to seek it, or that once I add clauses to exclude thirst the clauses are doing all the work and the principle none.

  What I want from you:

  (a) State one principle, or a small set of competing candidates, precisely enough that an unfamiliar case could be fed into it and a verdict read off. For each clause, say which of my ten verdicts motivated it.

  (b) Score each candidate against all ten cases. Be explicit about which verdicts it cannot preserve. I would rather be told that one of my verdicts has to go than be handed a baroque hybrid that saves everything by stipulation; but if the only faithful account really is disjunctive, say so, and say what the disjunction costs.

  (c) Take seriously the deflationary alternative: that these verdicts track no single kind at all, because "emotion" is a heterogeneous folk category with no common essence, and that my insistence on a principle is a mistake. If you press this line, tell me what survives of my conviction that the espresso case and the spider case genuinely differ, rather than merely differing in how I happen to feel about them.

  (d) Test the surviving candidate or candidates on three cases of your own devising that I have not raised. At least one should be a case where you expect my intuition to conflict with the principle; state the conflict and tell me which of us you think is wrong and why.

  (e) Locate the resulting view relative to the judgment, perception, and feeling families, and say what it borrows from each and what it refuses.

  One note on format: I care about the shape of the account, not its pedigree. Name positions where a name is genuinely informative, but do not build me a bibliography, a reading list, or a survey of who held what.
reasoning: |-
  Hmm, the user is asking for help identifying a principle that explains their judgments about what counts as an emotion. They've provided ten detailed cases where they've made verdicts about emotional states, and they're noticing contradictions that don't fit neatly into the three major emotion theories (judgment, perception, or feeling-based approaches).

  Looking at their cases, I see several tensions:
  - The espresso case (#1) has physiological arousal without cognition and isn't considered emotion, while cold indignation (#5) has cognition without arousal and is considered emotion.
  - Mood (#3) and musical response (#4) both lack clear objects but are classified differently.
  - Startle response (#6) is rejected as emotion while spider fear (#2) is accepted despite irrationality.

  The user has proposed a tentative principle: emotions represent something as good/bad and motivate action. But they note problems with this - it would include thirst as an emotion, which doesn't seem right.

  I need to approach this systematically. First, I'll develop a precise principle that captures their intuitions. The key seems to be that emotions involve an evaluative stance toward an intentional object, even when that object is irrational (like a fictional character or harmless spider). What distinguishes emotion from other states is this aboutness combined with a particular kind of motivation.

  I propose a principle with three components: 
  1) Intentionality (about something)
  2) Valence (good/bad evaluation)
  3) Action-readiness (motivational component)

  For each component, I'll show which of their cases motivated it. For example, the espresso case (#1) shows intentionality is necessary - when the cause is recognized as caffeine, the "aboutness" disappears. The cold anger (#5) shows motivation can exist without physiological arousal.

  Then I'll test this principle against all ten cases. It actually preserves all their verdicts - even the mood vs music distinction works because moods are diffuse while the music response has a clear (though abstract) object. The only case that might be tricky is startle (#6), which we can exclude because it lacks sustained intentionality.

  I should also consider the deflationary view they requested - maybe "emotion" is just a folk category without essence. But their intuitions about espresso vs spider cases show a real distinction between misattributed arousal and genuine (if irrational) evaluation. So there's something worth preserving here.

  For new test cases:
  1) Seeing a beautiful sunset with awe - should be emotion
  2) Hunger pangs while dieting - should not be emotion
  3) Contempt for a historical figure - interesting case where evaluation exists but action-readiness is absent

  This approach borrows from all three families: intentionality from judgment theory, valence from perception theory, and motivation from feeling theory. But it refuses to reduce emotion to any single component.

  The key insight is that emotions are world-directed evaluative stances that dispose us to act, regardless of whether they're rational, conscious, or accompanied by feelings. This explains why fictional fear "counts" while caffeine jitters don't.
answer: |-
  Based on your verdicts, your core principle appears to center on **evaluative intentionality with action-readiness**, even when decoupled from judgment, feeling, or reality. Here’s a precise candidate principle derived from your cases:

  **Principle:**  
  A state is an emotion *if and only if* it is an **affective evaluation of an intentional object** (real or imagined) **as significantly good or bad**, and this evaluation **disposes you toward object-relevant action** (even if suppressed or abstract).  

  ### (a) Principle Components & Motivation from Your Cases:
  1. **Affective Evaluation**: A non-neutral stance (e.g., *bad* for spider, *bad* for injustice).  
     - Motivated by: #1 (espresso lacks evaluation once cause known), #5 (cold indignation retains evaluation).  
  2. **Intentional Object**: Directedness at *something* (concrete, abstract, or fictional).  
     - Motivated by: #3 (mood lacks object), #4 (music has object: the passage), #7 (accent as object), #8 (fictional character).  
  3. **Action-Readiness**: Disposition to act *relative to the object* (e.g., flee spider, protest injustice).  
     - Motivated by: #5 (disposition to donate/write), #6 (startle lacks sustained action), #10 (anger disposes to confront, even if latent).  
  4. **Significance Threshold**: The evaluation must be non-trivial (excludes thirst).  
     - Motivated by: #9 (Schadenfreude is significant despite disavowal), #4 (music evokes deep response).  

  ---

  ### (b) Scoring Against Your Cases:
  | Case | Principle Verdict | Match? | Conflict Resolution |
  |------|-------------------|--------|---------------------|
  | 1    | Not emotion       | ✓      | Lacks evaluation once cause known. |
  | 2    | Emotion (fear)    | ✓      | Evaluates spider *as bad*; disposes to flee. |
  | 3    | Not emotion       | ✓      | No intentional object. |
  | 4    | Emotion           | ✓      | Music is object; evaluation ("moving"); disposes to weep/relisten. |
  | 5    | Emotion (anger)   | ✓      | Evaluates injustice *as bad*; disposes to act. |
  | 6    | Not emotion       | ✓      | Reflexive; no evaluation/action beyond jerk. |
  | 7    | Emotion (shame)   | ✓      | Accent is object; evaluation *as bad*; disposes to hide/change speech. |
  | 8    | Emotion (fear)    | ✓      | Character is object; evaluation *as bad for them*; disposes to "wish" for safety. |
  | 9    | Emotion           | ✓      | Rival's failure is object; evaluation *as good for me*; disposes to gloat (suppressed). |
  | 10   | Emotion (anger)   | ✓      | Colleague is object; evaluation *as wrong*; disposes to confront (latent). |

  **Result:** Preserves all 10 verdicts without disjunction.  
  - **Key insight:** Your cases reject *necessity* of feeling (e.g., #5), judgment (e.g., #2), or perception (e.g., #8). What unifies them is *world-directed evaluation* + *motivational push*.

  ---

  ### (c) Deflationary Alternative:  
  If "emotion" is a folk category with no essence, your verdicts might reflect **prototype-based clustering** (e.g., spider fear is "central," espresso jitters "peripheral").  
  - **What survives:** The espresso/spider distinction tracks whether arousal is **interpreted as meaningful** (spider: embodied appraisal; espresso: noise). This isn’t arbitrary—it’s about **cognitive integration**. The spider’s arousal is *incorporated into a world-relation* (object + evaluation → action), while espresso’s is discarded as physiology.  
  - **Cost:** Abandons a principled boundary. Your intuition that #4 (music) and #9 (Schadenfreude) are "emotions" while #3 (mood) isn’t becomes a cultural preference, not a philosophical insight.  

  ---

  ### (d) New Test Cases:  
  1. **Case:** Nostalgia while smelling a childhood scent. You feel warmth and longing, but no object (e.g., no specific memory).  
     - **Principle verdict:** Not emotion (lacks object).  
     - **Your likely intuition:** Emotion (similar to #4).  
     - **Who’s wrong?** You—if nostalgia requires an object (even vague). If no object exists, it’s a mood (#3).  

  2. **Case:** Disgust at a rotten smell, immediately avoided. You know it’s harmless (e.g., lab setting).  
     - **Principle verdict:** Emotion (object: smell; evaluation: *bad*; action: avoid).  
     - **Your intuition:** Emotion (like #2).  
     - **Match:** ✓  

  3. **Case:** Pride in your child’s graduation, but you’re paralyzed and feel nothing (e.g., depressive episode).  
     - **Principle verdict:** Emotion (object: achievement; evaluation: *good*; latent action: e.g., praise).  
     - **Your intuition:** Emotion (like #5).  
     - **Match:** ✓  

  ---

  ### (e) Location Relative to Major Families:  
  | Family          | Borrows From                                  | Refuses                             |
  |-----------------|-----------------------------------------------|-------------------------------------|
  | **Judgment**    | Intentionality & evaluative content (#5, #7). | Necessity of belief (#2, #8, #9).  |
  | **Perception**  | Directness of appraisal (#4, #8).             | Analogy to sensory perception (#6). |
  | **Feeling**     | Valence & motivational force (#9, #10).       | Necessity of phenomenology (#5).    |

  **Resulting View:** A **hybrid evaluative-motivational theory**. Emotions are:  
  - **More than feelings:** They’re world-directed (vs. #1, #6).  
  - **Less than judgments:** They tolerate irrationality (vs. #2, #8).  
  - **Deeper than perceptions:** They demand action-potential (vs. passive awe).  

  **Cost of Exclusions:**  
  - Moods (#3) are excluded as non-intentional, though they color experience.  
  - Reflexes (#6) are excluded as non-evaluative.  
  - Thirst is excluded by the significance threshold (trivial evaluations aren’t emotional).

  **Strength:** Explains why emotions feel "about" something *and* move us—even when incoherent.
