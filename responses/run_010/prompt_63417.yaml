  First, I need to extract the implicit principles from the six verdicts. The physicist's approach to "provenance" resonates here - is the anomaly in the AI's objectives (Category I) or just misaligned outputs (Category II)? The key dimensions seem to be: persistence after incentive removal, observation sensitivity, capacity expansion, and reversion under retraining.

