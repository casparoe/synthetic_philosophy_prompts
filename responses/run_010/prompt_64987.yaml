answer: |-
  Here is a systematic list of desiderata for a theory of material constitution, designed to be self-contained and evaluative. I'll first present the requirements, then address your 3D printing case, and finally provide a brief assessment of standard views. Non-negotiable items (marked **) reflect near-universal constraints in the debate; others are contested. Conflicts and the "high-impact" requirement are identified in section IV.

  ### I. **Core Distinctions (Non-Collapsible)**
  1. **Constitution ≠ Identity**  
     **Motivation**: Lump of clay (Lumpl) constitutes statue (Goliath) pre-squashing. Post-squashing, Lumpl persists (as deformed clay) but Goliath does not. If they were identical, this would violate Leibniz’s Law (they have different persistence conditions).  
     **Status**: **Non-negotiable** (consensus: constitution isn’t identity).  

  2. **Numerical vs. Qualitative Sameness**  
     **Motivation**: Two identical busts printed from the same file are qualitatively similar but numerically distinct. Collapsing this distinction makes replication impossible.  
     **Status**: **Non-negotiable** (logical bedrock).  

  3. **Object vs. Matter at a Time**  
     **Motivation**: The *bust* (artifact) has aesthetic/historical properties; the *filament* (matter) has mass/chemical properties. They share spatial location but differ in persistence and modal properties (e.g., the bust could be destroyed while the filament remains).  
     **Status**: **Non-negotiable** (universal in literature).  

  ---

  ### II. **Cases Any Theory Must Handle**
  4. **Lumpl/Goliath Case**  
     **Demand**: Explain how Lumpl and Goliath coexist pre-squashing without being identical.  
     **Status**: **Non-negotiable** (foundational puzzle).  

  5. **Ship of Theseus (SoT)**  
     **Demand**: Account for both (a) gradual plank replacement (persistence through change) and (b) reassembly of original planks (competition between continuity of form vs. matter).  
     **Status**: **Non-negotiable** (tests coherence of persistence conditions).  

  6. **Reassembly Puzzle**  
     **Demand**: If a statue is ground to powder and remolded, is the new statue identical to the original? Requires clarity on whether form or matter continuity is necessary for persistence.  
     **Status**: **Non-negotiable** (directly relates to your bust case).  

  7. **Fission/Fusion Cases**  
     **Demand**: Explain what happens when one object splits into two (e.g., your two busts printed simultaneously) or two merge into one.  
     **Status**: **Non-negotiable** (tests counting and identity criteria).  

  ---

  ### III. **Logical/Semantic Constraints**
  8. **Leibniz’s Law Compliance**  
     **Motivation**: If objects A and B have different properties (e.g., "was created in 2023" vs. "was created in 2024"), they cannot be identical.  
     **Status**: **Non-negotiable** (first-order logic).  

  9. **Counting Principle**  
     **Motivation**: In a region occupied by a statue and its clay, how many objects are there? Must avoid double-counting (one object) or overpopulation (two objects).  
     **Status**: **Contested** (theories divide on whether to count 1 or 2 objects).  

  10. **Temporal Predicate Consistency**  
      **Motivation**: If the bust survives its shattering, it must satisfy "was intact at t₁" and "is shattered at t₂" without contradiction.  
      **Status**: **Non-negotiable** (temporal logic).  

  ---

  ### IV. **Conflicts and High-Impact Requirements**
  - **Irreconcilable Triad**:  
    These three cannot all be satisfied simultaneously:  
    (a) *Constitution ≠ Identity* (II.1),  
    (b) *No Coincident Entities* (rejecting two objects in one place),  
    (c) *Persistence Through Replacement* (SoT gradual change).  
    **Why**: If constitution ≠ identity, Lumpl and Goliath are distinct but coincident. Denying (b) allows this but violates intuitive counting; denying (c) rejects persistence through material change.  

  - **Highest-Impact Requirement**:  
    **No Coincident Entities** (often implicit in folk ontology) eliminates otherwise attractive views (e.g., **Constitution Theory**). If violated, the theory must explain why two objects can occupy the same space without absurdity.  

  ---

  ### V. **Your 3D Printing Case: What a Theory Owes**
  - **Digital Form as Persistence Condition**:  
    If a theory prioritizes *formal continuity*, the second bust *could* be numerically identical to the first if the file preserves its essential form (like a reassembled statue). However, the third bust (printed after destruction) faces the *reassembly problem*: most theories reject identity across disassembly unless matter is preserved.  
    - **Non-negotiable constraint**: Identity requires spatiotemporal continuity. Digital storage alone cannot satisfy this (violates II.3).  

  - **Two Busts from One File**:  
    Forces the **Numerical vs. Qualitative Sameness** distinction (I.2). The busts are qualitatively identical but numerically distinct (two objects). Any theory must explain why spatial separation and independent histories preclude numerical identity.  

  - **Half-Recycled Filament**:  
    Tests whether constitution is **vague** or **all-or-nothing**. If the second bust is 50% original matter, is it "partially identical" to the first? Theories must either:  
    (a) Reject vague identity (Leibniz’s Law violation),  
    (b) Deny that recycled matter counts as "original matter" (due to reprocessing), or  
    (c) Accept graded persistence (radical, rarely defended).  
    **Status**: Novel *only* in its material ambiguity; similar to "Theseus' ship with 50% original planks."  

  - **Is This New?**:  
    It’s **reassembly + digital storage + matter recycling**. The digital aspect is modern, but philosophically reducible to the classic reassembly puzzle (VI.6) with a non-material "form-bearer." The core issue remains: does persistence require matter continuity, form continuity, or both?  

  ---

  ### VI. **Brief Theory Assessment Against Desiderata**
  | **Theory**                     | **Key Tenet**                          | **Handles Lumpl/Goliath?** | **Handles SoT?** | **Violates Non-Negotiable?**       | **Fails Your Case?**                     |  
  |--------------------------------|----------------------------------------|----------------------------|------------------|------------------------------------|------------------------------------------|  
  | **Constitution Theory**        | Objects coincide but differ in properties | Yes (distinct objects)    | Partial (depends on variant) | No (if accepts coincidence) | Struggles with digital persistence & two busts (counting) |  
  | **Four-Dimensionalism**        | Objects are spacetime worms            | Yes (different temporal parts) | Yes              | Violates ordinary counting (one region, one object) | Handles multiple busts as distinct worms |  
  | **Dominant Kind**              | Only one "dominant" object per region  | Yes (statue > clay)        | Partial          | Collapses constitution/identity? | Rejects third bust’s identity (no matter continuity) |  
  | **Mereological Essentialism** | Objects = exact matter at all times    | No (Lumpl=Goliath)         | No (no persistence) | Violates I.1, I.3             | All busts numerically distinct           |  
  | **Form-Based Persistence**     | Identity via immanent form             | ? (form vs. matter tension) | Yes (form continuity) | Risks vague identity (II.8)   | Allows second bust identity (form preserved); struggles with two busts |  

  **Confidence Notes**:  
  - **Non-negotiables (I.1–I.3, II.4–II.7, III.8, III.10)**: Consensus-backed. Denying them requires rejecting standard logic or uncontroversial data.  
  - **Contested (III.9, IV "No Coincident Entities")**: III.9 is partisan (folk intuition vs. metaphysical rigor); "No Coincidence" is often assumed but not universal.  
  - **Least Confident Point**: Whether **digital storage** can satisfy formal continuity for persistence. This is unsettled; empirical studies on artifact concepts (e.g., if people treat digitally restored objects as "the same") could clarify.  
  - **Smuggled Assumption**: **Ordinary Counting** (III.9) assumes a folk-ontological "one object per place" intuition, which some theories (e.g., 4Dism) deliberately reject.  

  This framework should equip you to evaluate your own view. The bust case sharpens classic problems but doesn’t introduce wholly new constraints—its force lies in exposing tensions (e.g., form vs. matter, coincidence vs. counting) already latent in the desiderata.
