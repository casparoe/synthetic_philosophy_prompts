prompt: |-
  So I've gone down a bit of a rabbit hole on cause prioritization — the importance/tractability/neglectedness triad people use to pick which causes to work on — and my roomate, who is way deeper into this stuff than me, keeps insisting it's "just expected value thinking with a division-of-labour gloss on top." I think it's smuggling in more than that, and I want to test it on a real episode instead of a toy one, because the toy ones always make the framework look fine.

  Here's the episode, and I'll lay out the facts so you don't have to guess at them. In 1966–67 the World Health Organization committed to an intensified programme to eradicate smallpox worldwide, run by D. A. Henderson. At that point smallpox was still killing something like two million people a year and was endemic across much of Africa and South Asia; the stated plan was mass vaccination up to roughly 80% coverage, country by country. Then in eastern Nigeria in 1966 a field team under William Foege ran short of vaccine during an outbreak, couldn't vaccinate everyone, and improvised — find the cases, vaccinate in rings around them, and pay people to report suspected cases. That surveillance-and-containment tactic turned out to work better and cheaper than mass vaccination and became the backbone of the whole programme. The last naturally occurring case was Ali Maow Maalin, a hospital cook in Somalia, in October 1977, and the World Health Assembly declared the world smallpox-free in 1980. Meanwhile, and partly in reaction to exactly this kind of campaign, the 1978 WHO/UNICEF conference in Alma-Ata declared primary health care the road to "Health for All by the Year 2000" — a deliberately broad, horizontal, health-systems-and-social-determinants programme that refused to single out any one disease. Its critics said it was unmeasurable and utopian; the vertical camp said only disease-specific campaigns had ever actually delivered anything. Within a year or two the compromise was "selective" primary health care: pick a handful of specific high-burden conditions where a cheap intervention already exists. Which is arguably just ITN before ITN had a name.

  I want the analysis to run in both directions, and I want it disciplined rather than mushy — no "ITN is a useful heuristic but of course has limits," that's the answer everyone gives. First: actually score smallpox-eradication-as-of-1966 on importance, tractability and neglectedness the way the framework asks you to, and be strict about the bookkeeping. What units is importance in, and does eliminating a disease outright score any differently from averting the same number of deaths every year forever, or does the framework flatten those into the same number? Is neglectedness measured against all possible funders, against other global-health funders, or against the marginal attention of the person doing the scoring — because smallpox in 1966 was simultaneously the most neglected cause imaginable (nobody was funding eradication) and the least (literally every country on earth already ran a vaccination programme). Then take on the two features that look like they break the framework rather than illustrate it. One: tractability turned out not to be a property of smallpox at all, but of smallpox-plus-a-tactic, and the tactic didn't exist in anyone's plan in 1966 — the cause became more tractable mid-programme because a team in Nigeria ran out of vaccine. Does that mean ITN can't be applied ex ante, only as a story you tell afterwards? Two: the Alma-Ata objection isn't that smallpox was the wrong pick, it's that a framework built on legible, measurable, campaign-shaped wins will systematically rank legible causes above important-but-diffuse ones, and that this bias is invisible from inside the framework. Is that a fair charge or a strawman? And finally, tell me what 1980 is worth as evidence — a genuine vindication of the vertical way of choosing, or one visible draw from a distribution we can't see, given that the same eradication template later got pointed at polio, malaria, guinea worm and yaws with wildly different results. Where the framework is simply silent about this episode, say it's silent rather than making it speak.

  Don't bother with citations or a reading list, I can't look any of it up anyway — I want the reasoning, not the references. End with a final line in exactly this format:

  Verdict: <one of CONFIRMS / STRAINS / BREAKS / UNDERDETERMINED> — <the single structural assumption of the importance-tractability-neglectedness framework this episode puts most pressure on, in 15 words or fewer>
reasoning: |-
  Okay, let me think through this user's query about cause prioritization using the smallpox eradication case. The user wants a strict application of the ITN framework to the 1966 decision, then an analysis of how the actual outcome challenges the framework.

  First, importance: Smallpox killed ~2 million annually in 1966. The ITN framework would calculate this as 2M DALYs/year (disability-adjusted life years), but eradication delivers infinite value by eliminating future deaths. Does ITN account for this perpetuity factor? The framework typically annualizes impacts, which dramatically undervalues eradication's long-term benefit.

  On tractability: In 1966, mass vaccination seemed feasible but resource-intensive. The breakthrough ring vaccination method wasn't known yet. This exposes a key flaw - tractability assessments can't anticipate unknown innovations. The framework assumes static knowledge.

  Neglectedness is paradoxical: Every country vaccinated, but nobody funded eradication. Is this "neglected"? ITN lacks clear benchmarks - is the baseline current efforts or optimal investment? The framework struggles with causes that have widespread low-effort engagement but no focused resources.

  The Alma-Ata critique seems valid: ITN inherently favors discrete, measurable interventions over systemic change. Smallpox's success reinforced this bias, even though horizontal approaches might yield greater cumulative impact.

  The polio/malaria comparison shows eradication isn't equally tractable for all diseases. Smallpox had unique advantages (no animal reservoir, obvious symptoms) that made the tactic work. ITN doesn't capture these contextual factors.

  Finally, the verdict must reflect the deepest flaw. The inability to value perpetual benefits versus annualized impacts seems fundamental. Also, tractability's dependence on unknowable future innovations breaks the ex ante assessment model.

  The structural assumption under most pressure is the framework's treatment of time - it can't properly value permanent solutions versus temporary reductions. Hence the verdict: ITN breaks on this timescale issue.
answer: |-
  Here's the strict ITN analysis of smallpox eradication in 1966, followed by pressure points:

  **ITN Scoring (1966 Perspective):**
  1.  **Importance:** ~2 million deaths/year. Units are typically annualized DALYs (Disability-Adjusted Life Years) or deaths. **Flaw:** Eradication flattens future averted burden into perpetuity. ITN *does* flatten this – it would treat eliminating 2M deaths forever identically to preventing 2M deaths *this year only*. The perpetuity isn't inherently valued higher; importance is assessed annually. *Score: Extremely High.*
  2.  **Tractability:** Mass vaccination was proven feasible country-by-country but logistically daunting and expensive. Success depended on sustained political will, funding, and infrastructure across endemic nations. Ring vaccination didn't exist. *Score: Moderately High (for mass vaccination), but conditional and uncertain.*
  3.  **Neglectedness:** **Paradox.** Vaccination programs existed *everywhere* (low neglect?), but *eradication funding/commitment was nearly zero* (high neglect?). ITN lacks a clear baseline. Measured against the *optimal effort for eradication*, neglect was extreme. Measured against *current health spending on smallpox control*, neglect was low. The framework is silent on resolving this. *Score: Ambiguous (Leans High neglect for the eradication goal specifically).*

  **Pressure Point 1: Tractability Wasn't Static (Breaks Ex Ante Assessment)**
  *   **The Break:** Tractability wasn't an inherent property of "smallpox." It emerged from the *interaction* of the disease *plus* a novel tactic discovered *mid-operation* due to a constraint (vaccine shortage). This tactic radically changed cost and feasibility.
  *   **Implication:** ITN assumes tractability is knowable ex ante based on existing methods. This episode shows tractability can be *discovered* or *created* through action, constraints, and improvisation. Ex ante ITN scoring would have been based on the *inferior* mass vaccination plan. **This breaks the framework's ability to reliably rank causes ex ante when innovation potential is high but unknown.**

  **Pressure Point 2: The Alma-Ata Charge (Reveals a Systematic Bias)**
  *   **The Charge:** ITN inherently favors causes that are **legible** (easily quantifiable burden like death tolls), **discrete** (single disease vs. systemic factors), and **campaign-shaped** (clear intervention, measurable outcome like eradication). Smallpox fits perfectly. Alma-Ata's horizontal PHC (Primary Health Care) is diffuse (social determinants, system strengthening), harder to measure (impact on overall health status), and lacks a single clear metric like "deaths averted by disease X."
  *   **Is it Fair?** **Yes.** ITN's structure systematically disadvantages diffuse, systemic, or preventative causes where burden is harder to attribute and impact is harder to isolate/measure. Smallpox's success *reinforced* this bias, making "vertical" campaigns appear objectively superior under an ITN lens, even if horizontal approaches might yield greater aggregate or long-term benefits. The framework *cannot* see or correct for this bias internally; it's a feature of its design.

  **What 1980 is Worth as Evidence:**
  *   **Not a Simple Vindication:** It's **one highly visible draw from an invisible distribution.** Smallpox eradication succeeded due to a unique confluence: a biologically vulnerable virus (no animal reservoir, obvious symptoms, effective vaccine), the serendipitous discovery of ring vaccination, unprecedented global cooperation during the Cold War, and committed leadership. Applying the same "eradication template" later failed dramatically for malaria (biologically complex), proved far harder and costlier for polio (asymptomatic spread), and had mixed results for guinea worm and yaws. **ITN is silent** on contextual factors (biological, political, operational) that make success distribution vary wildly even for seemingly similar "vertical" causes. It treats "tractability" as a fixed score, not a probability distribution contingent on unknown factors.

  **Verdict: BREAKS — The assumption that tractability is a knowable, static property inherent to the cause ex ante.** (14 words)

  **Reasoning:** The core structural failure exposed is ITN's inability to handle *emergent tractability* – the fact that a cause's feasibility can be radically transformed by unforeseen innovations or discoveries *during* intervention. This makes ex ante scoring based on known methods fundamentally unreliable for causes where such innovation is possible (which is many). The Alma-Ata bias and the uniqueness of smallpox's success apply significant pressure, but the emergent tractability issue directly breaks a core assumption required for the framework to function predictively ex ante.
