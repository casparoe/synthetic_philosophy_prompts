  Okay, let me tackle this complex request about the EU's democratic deficit. The user wants a concrete case study that illustrates the tension between the all-subjected principle and all-affected principle, with specific constraints: no headline examples like Greek bailouts, and one where expanding the constituency creates new excluded groups.

  Hmm, the user is clearly knowledgeable - they're designing a seminar exercise and using precise political theory terminology. They want something beyond textbook examples, so I need to dig deeper into EU policy archives. The challenge is finding a case where: 
  1) Subjected vs affected groups meaningfully diverge 
  2) Inclusion creates new excluded persons 
  3) It's not philosophically "tidy" 

  I recall the 2017 EU-Canada CETA agreement... wait no, that might be too obvious. What about... ah! The EU's Emissions Trading System (ETS) expansion to maritime transport. Perfect fit: 
  - 2023 decision under EU Climate Law authority 
  - Subjects EU/non-EU ships equally 
  - Affects global shipping routes/trade patterns 
  - Expanding to include affected non-EU states would still leave small island nations impacted 

  Let me verify the mechanics: When the EU regulates ships entering its ports (subjected principle covers them), but the rerouted trade affects developing economies through changed shipping costs (affected principle). If we included those economies in decision-making, their changes would then impact others downstream... infinite regress problem. 

  The user also wants clarity on "affected" meaning. Here it's about interests being set back (economic losses) rather than options foreclosed. Important distinction - the case relies on consequential harm, not direct coercion. 

  For the theoretical implications: This exposes how all-affected principle is infinitely expansive while all-subjected is administratively feasible but morally insufficient. Neither principle solves the "constituency leakage" problem inherent in global governance. 

  I should note where consensus lies: Most theorists agree the principles conflict in transnational contexts, but heated debates continue about whether all-affected can be operationalized. The institutional defect is real (EU's external impact blindness), but the philosophical dilemma runs deeper. 

  Better avoid overclaiming - I'll present this as illustrating tensions rather than proving impossibility. The maritime ETS case neatly shows how regulatory decisions spill across borders in ways that challenge democratic boundaries. Exactly what the seminar needs to spark debate.
answer: |-
  Here is a concrete example meeting your specifications, designed to provoke discussion on the core dilemma:

  **The Case: The EU's Carbon Border Adjustment Mechanism (CBAM) - Climate Policy, Final Adoption 2023**

  1.  **The Decision:** The EU legislated (Regulation (EU) 2023/956) to impose a carbon price (a tariff-like levy) on imports of specific carbon-intensive goods (initially cement, iron & steel, aluminium, fertilizers, electricity, hydrogen) into the EU market. This is designed to prevent "carbon leakage" (industries relocating outside the EU to avoid its internal carbon costs under the Emissions Trading System) and incentivize cleaner production globally.
  2.  **Who Decided & Under Which Authority:** The decision was taken through the **Ordinary Legislative Procedure (OLP)**:
      *   The **European Commission** proposed the legislation.
      *   The **Council of the EU** (representing Member State governments, qualified majority voting) and the **European Parliament** (directly elected MEPs, majority voting) co-legislated, amending and finally adopting the regulation.
      *   **Legal Basis:** Primarily Article 192(1) TFEU (Environment), with aspects linked to the internal market (Article 114 TFEU). The EU has exclusive competence for trade policy aspects (Article 207 TFEU).
  3.  **Applying the Principles:**
      *   **All-Subjected Principle:** Who is directly subject to the CBAM rules?
          *   **Importers** bringing covered goods into the EU market (whether EU-based companies or third-country exporters establishing an EU presence).
          *   **Producers in Third Countries** whose goods are imported into the EU (they must comply with monitoring/verification rules to calculate the embedded emissions, though the direct financial levy falls on the importer).
          *   **EU Competent Authorities** enforcing the rules.
          *   *Constituency:* Primarily actors within the EU regulatory and market sphere directly interacting with the import process for covered goods.
      *   **All-Affected Principle:** Whose interests are *significantly affected*?
          *   The above subjected actors.
          *   **Exporters in Third Countries:** Producers in (e.g.) Turkey (steel), Russia (fertilizers), China (cement, aluminium, hydrogen) face potentially significant competitive disadvantages, compliance costs, and market access barriers unless they decarbonize. Their economic interests are directly set back.
          *   **Governments of Major Exporting Third Countries:** Face pressure to adopt domestic carbon pricing/regulation aligned with EU standards to avoid the levy, impacting their domestic policy sovereignty and potentially their economies.
          *   **Producers in Developing Economies Highly Dependent on Exports of Covered Goods to the EU:** May lack the capital or technology to decarbonize quickly, facing disproportionate hardship. Their development interests are significantly set back.
          *   **Consumers and Downstream Industries within the EU:** Face potential price increases for covered goods and products made from them (e.g., construction, manufacturing), impacting their economic interests.
          *   **Producers of Substitute Goods:** Both within the EU and globally may benefit from increased demand.
          *   *Constituency:* A vastly broader group, spanning global trade partners, specific vulnerable economies, and internal EU economic actors beyond just importers/producers of the covered goods. Crucially, the *nature* of being affected here is primarily **having one's interests set back** (economic competitiveness, market access, policy autonomy, consumer prices, development prospects) rather than *only* having options foreclosed in a direct legal sense (though that also happens for exporters).

  4.  **The Divergence and the "Constituency Leakage" Problem:**
      *   The OLP process clearly satisfies the **All-Subjected Principle**. Importers subject to the levy and verification rules are primarily EU-based entities (or entities interacting directly with the EU market), falling under the jurisdiction of the Member States and the EU. Their representatives (national governments in Council, citizens via EP) have a voice.
      *   It plainly fails the **All-Affected Principle**. Crucially affected third-country exporters and their governments had no formal voice in the decision-making, despite facing significant economic and policy consequences.
      *   **The Leakage Problem:** Now, imagine we try to *fix* this deficit by including representatives of these significantly affected third countries (e.g., major steel or fertilizer exporters) in the CBAM decision-making process. This new, expanded "constituency" (EU institutions + key third countries) would deliberate and potentially amend the CBAM rules.
          *   *Result:* **New Outsiders Emerge.** The revised CBAM rules agreed upon by this new group would now inevitably affect others:
              *   **Smaller Exporters/Developing Economies:** If major exporters negotiated exemptions or slower phase-ins for themselves, smaller competitors or developing nations might face *stiffer* competition or different rules impacting them negatively.
              *   **Countries Highly Dependent on Imports of Covered Goods:** If CBAM rules were weakened to accommodate exporters, the environmental effectiveness might be reduced, affecting countries vulnerable to climate change (e.g., Small Island Developing States - SIDS) whose vital interests (survival) are affected by global emissions trajectories influenced by CBAM's success or failure.
              *   **Global Competitors:** Changes favoring EU+MajorExporter bloc could disadvantage producers in other regions not included.
          *   We have created a *new* set of significantly affected persons (smaller exporters, climate-vulnerable states) who were not part of the *expanded* decision-making process and are now subjected to its outcomes without a voice. Closing the initial constituency gap creates a new one elsewhere. The chain of significant effects extends globally and cannot be neatly bounded.

  5.  **What the Divergence Shows:**
      *   **The "Affected" Problem:** This case relies heavily on the broadest sense of "affected" – **having one's interests set back**. The EU decision alters the competitive landscape, imposes compliance costs, and pressures foreign policy choices, setting back economic and developmental interests globally. The choice *is* doing quiet work: a narrower view focused *only* on direct legal compulsion (options foreclosed) would shrink the affected group dramatically, perhaps too much. The broad view exposes the vast reach of EU regulatory power.
      *   **The Nature of the Difficulty:**
          1.  **An Institutional Defect in the EU Design?** Yes, partially. The EU's legislative processes (OLP) are primarily designed for *internal* governance and regulating the Single Market. They lack robust, formal mechanisms for systematically assessing or incorporating the perspectives of significantly affected external actors *before* major decisions with global externalities are made. While consultation occurs, it's non-binding and doesn't grant co-decision rights. This is a recognized shortcoming in the "output legitimacy" of EU external governance.
          2.  **A Defect in the Principles?**
              *   The **All-Subjected Principle** is coherent and administratively feasible within the EU's jurisdiction but appears normatively insufficient for decisions with major transnational impacts like CBAM. It fails to capture the moral claim of those significantly harmed *without* being directly subjected.
              *   The **All-Affected Principle**, while normatively appealing, is revealed in this case to be **indeterminate and potentially infinitely expansive** in a globalized world ("constituency leakage"). It lacks a non-arbitrary stopping point. *This is the core dilemma your case highlights.*
          3.  **Something Neither Principle Registers?** The case highlights a fundamental challenge of **supranational democracy in an interdependent world**: the impossibility of perfectly aligning political community (demos) with the scope of significant policy effects. Neither principle offers a complete solution to the problem of "boundedness." The difficulty is inherent in the nature of transnational power and complex interdependence.

  **State of the Question - Key Settled and Contested Points:**

  *   **Settled/Near-Settled:**
      *   The EU possesses significant regulatory power that affects non-members profoundly (the "Brussels Effect").
      *   The EU's internal democratic processes (OLP) satisfy the All-Subjected Principle for those directly within its regulatory ambit but often fail the All-Affected Principle for external actors.
      *   There *is* a "democratic deficit" concerning the EU's external impacts; this is widely acknowledged in the literature, even if its severity and solutions are debated.
      *   The All-Subjected Principle is generally seen as more administratively viable than the All-Affected Principle.
  *   **Genuinely Contested:**
      *   **Can the All-Affected Principle be coherently operationalized?** This is *highly contested*. Critics (e.g., realists, some liberal institutionalists) argue it is too vague and expansive. Proponents (e.g., some cosmopolitan democrats) argue for practical approximations (e.g., focusing on "strongly" or "urgently" affected, using representative international forums).
      *   **Does solving the deficit require a transnational demos?** Hotly contested. Some argue democracy requires a pre-existing demos with shared identity which is lacking globally. Others argue democratic practices can help *build* such a demos ("demoicracy" models). Others argue for functional representation without requiring a unified demos.
      *   **What is the best *remedy* for the EU's external deficit?** Options range from better impact assessments and consultations, to giving more power to the EP on external relations (enhancing representative legitimacy), to creating formal advisory roles for third countries, to strengthening multilateral institutions. There's no consensus on feasibility or effectiveness.
      *   **Is the "constituency leakage" problem fatal?** Contested. Some see it as proving the impossibility of fully realizing the All-Affected Principle, making bounded jurisdictions necessary. Others see it as demanding more innovative, multi-level forms of democratic inclusion beyond the nation-state/EU frame.

  **Conclusion for Seminar:** The CBAM case starkly illustrates the tension between the two principles and the "constituency leakage" problem inherent in applying the All-Affected Principle to powerful transnational regulators like the EU. It demonstrates that the EU's institutional design is inadequate for incorporating the voices of externally affected parties. More profoundly, it suggests that *neither* principle alone can resolve the core dilemma of democratic boundaries in a globally interconnected world. The difficulty exposed is partly an EU design flaw but fundamentally a deeper challenge for democratic theory when power's effects spill across borders in complex chains. The indeterminacy of the All-Affected Principle and the practical necessity of bounded jurisdictions create an enduring tension.
