  ```  

  ### Rubric Limitations  
  ```json  
  {  
    "unfalsifiable_elements": [  
      "Sincerity (Step 5): A skilled writer can fabricate 'authenticity.' Readers infer sincerity from text, but it’s ultimately a guess.",  
      "Universality (Step 4): Subject to reader bias. One may see grief as universal, another as culturally specific."  
    ],  
    "what_the_rubric_will_systematically_kill": [  
      "Craft-heavy, emotionless work (beloved by traditionalists).",  
      "Elitist/niche art reliant on in-group codes.",  
      "Effective but divisive satire/rage bait."  
    ],  
    "what_it_cannot_replace_in_my_current_process": [  
      "Craft triage: Won’t catch unreadable prose or grammatical errors that alienate audiences (Step 1 may pass if feeling transmits despite flaws).",  
      "Editorial voice: Tolstoy ignores aesthetic innovation, humor for humor’s sake, or formal experimentation if they lack 'universal feeling.'",  
      "Mission-based exceptions: E.g., uplifting marginalized voices might fail Step 4 if trauma feels 'exclusionary' to some readers."  
    ]  
  }  
  ```  

  ### Final Notes  
  - **Where the Rubric Misfires**:  
    - Sincerity (Step 5): A cynical writer can game it with trauma tropes.  
    - Universality (Step 4): Genuine art about niche experiences (e.g., refugee trauma) may fail if the reader lacks empathy.  
    - Mean-spirited stories: Infectious hatred (e.g., a brilliant racist rant) fails Step 4—Tolstoy intentionally sacrifices them for social harmony.  
  - **Brutal Truth**: This rubric will reject 95% of "polished" submissions and 50% of infectious but divisive work. It disproportionately benefits raw, emotional pieces (like the community program). If your board values craft-as-virtue, prepare for war.  
  - **Why Use It?**: Forces readers to interrogate *what* a story makes them feel and *why*—cutting through craft-worship. Tolstoy’s "infection" is cruder than "earned emotion," but faster to assess.
