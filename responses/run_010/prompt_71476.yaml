prompt: |-
  Okay so I got into a two hour argument with my friend Ruth last night about Tolstoy's What Is Art? and I'm still not settled on it, but I have to actually settle it because I edit a small nonprofit literary magazine and I've been asked to write a screening rubric for our volunteer first-pass readers. Ruth's position is that Tolstoy's whole test is useless in practice — that "does it infect you" is just "did you cry" with a halo on it, and that the moment you add the bit about feelings that unite people you've stopped doing criticism and started preaching. Mine is that its actually more workable than the craft-based language we use now ("pacing," "voice," "earned"), because at least Tolstoy is asking who caught what feeling from whom. I read the book maybe six years ago so I'm reconstructing from memory, and I'm pretty sure I've softened him into something more palatable than he was — my recollection is: art is when someone reawakens in themselves a feeling they once had and hands it over by external signs so other people catch it; the strength of the infection depends on three things, how particular the feeling is, how clearly it gets across, and how sincerely the artist is actually feeling it while making the thing; sincerity is the one that matters most and the one professional art most lacks; then separately there's the content test, where the best art transmits feelings available to everyone regardless of class or sect — the brotherhood stuff — and the worst is partisan, cultivated for a small in-group that shares the codes; and there's the list of counterfeit markers, which I remember as borrowing (stock imagery, moonlight and nightingales and hermits), imitation (descriptive padding in place of feeling), effectfulness (cheap wow-moments), and diversion (mere amusement). Please correct me wherever I've gotten him wrong or watered him down before you build anything on top of it.

  What I need is a decision procedure my readers can actually run on a submission in fifteen minutes with no theory background, and I have about 1,200 stories a year for eight slots per issue. Our board chair is a retired literature professor who will fight me over anything that looks like it's downgrading polished work, and we just took a grant to publish writers from a community program — people who have never taken a workshop and write with terrible tense control about things that clearly happened to them. So the rubric has to be honest about which of those two it's going to hurt. Give me the questions in the order a reader should ask them, what counts as a sufficient answer to each, the exact points where the procedure stops with a reject, and the points where it has to hand the call up to a human because the remaining question is about values and not about facts. Also tell me plainly where the procedure will misfire — I already suspect sincerity is unfalsifiable from the text alone and that a good faker can manufacture it, and I suspect the content criterion will do something nasty to a genuinely infectious mean-spirited story — and say what the procedure cannot do that my current informal process does. Don't send me a reading list or citations, I'm not going to have a chance to chase anything down; just build the thing out of the theory itself.

  Then run it on three real cases we have on the desk right now. (1) A 9,000-word story in the voice of a famous dead Russian, immaculate, our two strongest readers both called it "flawless" and then, separately, admitted they finished it and felt nothing — this is the one our board chair is championing. (2) A three-page untitled fragment from the community program, a woman writing about her brother's overdose, misspelled, no scene breaks, and our readers have not stopped talking about it since Tuesday. (3) A satirical story about a local developer that is brutally, hilariously infectious — people laughed out loud in the reading group — but the feeling it transmits is contempt for a specific named person and his neighbors, and half our subscribers are those neighbors. At least one of these should come out the way I don't want it to; if the rubric says yes to all three, it's not a rubric, it's me. For format: put the procedure itself in a table with the columns step_number, question_the_reader_asks, what_a_pass_looks_like, what_a_fail_looks_like, and fact_or_judgment (and if judgment, who makes the call). Then give the three cases as a JSON array where each object has case, verdict (accept / reject / borderline), decisive_step, tolstoyan_rationale, strongest_objection_from_the_chair, and my_reply. Finally add one JSON object called limits with the fields unfalsifiable_elements, what_the_rubric_will_systematically_kill, and what_it_cannot_replace_in_my_current_process.
reasoning: |-
  We are building a screening rubric based on Tolstoy's "What Is Art?" with the goal of being practical for first-pass readers. The core elements we'll use are:
  1. Infection: Does the work transmit a feeling from author to reader?
  2. Criteria for infection strength: Particularity, Clarity, Sincerity (with sincerity being the most important)
  3. Content test: Does the feeling unite people across classes/sects? (brotherhood) vs. being partisan or for a small in-group.
  4. Counterfeit markers: Borrowing (stock imagery), Imitation (descriptive padding without feeling), Effectfulness (cheap thrills), Diversion (mere amusement).

  However, we must adapt this to a 15-minute per story decision procedure. We cannot deeply analyze the author's sincerity or the universality of the feeling in that time. Instead, we focus on the reader's experience and observable text features.

  The procedure will have steps that are either factual (based on observable text) or judgment (requiring the reader's subjective response). For judgment steps, we note that the reader must make the call. We design the steps to be sequential, with early rejects to save time.

  Steps:

  1. **Infection Check**: The most fundamental. If the work doesn't infect the reader, it fails Tolstoy's primary test. But note: a reader might not be infected due to their own state, so we must allow for borderline cases to be passed up.
     - Question: Did the work transmit a feeling to you? (i.e., did you catch the feeling the author seemed to be trying to convey?)
     - Pass: Yes, I felt something strongly and specifically. (Even if negative, like sadness or anger, as long as it's the intended feeling.)
     - Fail: No, I felt nothing. Or I felt something vague and undefined.
     - If fail, reject. But note: if the reader suspects it might infect others, they can mark as borderline and pass up (but we don't want to overload with borderline). We'll instruct that if they felt nothing, they should reject unless they have a strong reason to think it's their own fault (e.g., they were distracted, or they recognize the work is of a type that usually infects others but they personally are immune).

  2. **Counterfeit Markers Check**: We look for signs of counterfeit art. This step is to catch works that might have passed step 1 by trickery (e.g., made the reader cry with cheap manipulation) but are not sincere art. We check for the four counterfeit markers (borrowing, imitation, effectfulness, diversion). However, we must be cautious: the presence of one marker doesn't automatically mean counterfeit, but if the work relies heavily on them, it fails.
     - Question: Does the work heavily rely on any of the following: stock imagery/scenes (borrowing), excessive description without emotional point (imitation), cheap thrills/shock value (effectfulness), or being merely amusing without deeper feeling (diversion)?
     - Pass: No, or only minor use that doesn't undermine the feeling.
     - Fail: Yes, and it feels like a substitute for genuine feeling.
     - If fail, reject.

  3. **Sincerity Check**: Tolstoy says sincerity is the most important. But how to judge? We look for internal consistency and absence of artifice. In practice, we ask: does the feeling ring true? Does the work feel like it comes from a real place? This is subjective but crucial.
     - Question: Does the work feel sincere? (i.e., does it seem like the author truly felt the emotion they are transmitting, and not faking it for effect?)
     - Pass: Yes, the feeling feels authentic and not manufactured.
     - Fail: No, it feels forced, contrived, or manipulative.
     - If fail, reject. But note: this is a judgment call. We instruct the reader to be honest and not overthink.

  4. **Content Check (Brotherhood)**: Does the feeling unite people? This is the most ideological part. We ask: is the feeling one that could be shared by anyone regardless of background? Or is it exclusive (e.g., contempt for a specific group, inside jokes)?
     - Question: Is the feeling transmitted one that is universal (e.g., love, grief, joy) or at least accessible to people of different backgrounds? (i.e., does it promote human connection?)
     - Pass: Yes, the feeling is universal or has the potential to unite.
     - Fail: No, it is partisan, hateful, or exclusive to a small group (e.g., relies on shared prejudice or insider knowledge).
     - If fail, reject. But note: this is where Tolstoy would reject much of "high art" as being for a small class. Also, satire might fail if it's too specific and hateful.

  However, note the order: we do infection first because without that, the rest doesn't matter. Then we filter out counterfeits. Then sincerity. Then content.

  But what if a work is infectious and sincere but fails the content test? Tolstoy would say it's bad art. We follow.

  Now, for the practical procedure, we must design it to be efficient. We'll have steps that stop early on rejection.

  We also note that the rubric will have limitations:

  - Sincerity is hard to judge and may be unfalsifiable. A skilled writer can fake it.
  - The content test may reject excellent satire or works that express negative emotions (like contempt) even if they are infectious and sincere.
  - It may favor raw, emotional pieces (like the community program fragment) over polished but cold ones.

  We design the steps in a table:

  | step_number | question_the_reader_asks | what_a_pass_looks_like | what_a_fail_looks_like | fact_or_judgment | 
  |-------------|---------------------------|------------------------|------------------------|------------------|
  | 1 | Did the work transmit a specific feeling to you? (i.e., did you "catch" the feeling the author intended?) | Yes, I felt a distinct emotion (e.g., sadness, joy, anger) that I believe the author intended. | No, I felt nothing, or only a vague/undefined response. | Judgment (reader) |
  | 2 | (If passed step 1) Does the work avoid heavy reliance on counterfeit markers? (Check: borrowing - stock imagery/scenes; imitation - excessive description without emotional point; effectfulness - cheap thrills/shock; diversion - mere amusement) | The work does not use these markers, or uses them minimally without undermining the feeling. | The work relies heavily on one or more of these, and it feels like a substitute for genuine feeling. | Judgment (reader) |
  | 3 | (If passed step 2) Does the work feel sincere? (i.e., does it seem like the author genuinely felt the emotion they are transmitting?) | Yes, the emotion feels authentic and not manufactured. | No, it feels forced, contrived, or manipulative. | Judgment (reader) |
  | 4 | (If passed step 3) Is the feeling transmitted universal and unifying? (i.e., could it be shared by people of different backgrounds, promoting human connection?) | Yes, the feeling is universal (e.g., love, grief, joy) or has the potential to unite. | No, it is partisan, hateful, or exclusive (e.g., relies on shared prejudice, insider knowledge, or targets a specific person/group with contempt). | Judgment (reader) |

  Note: 
  - At any fail, the story is rejected. 
  - If the reader is unsure at any step (especially step 1, because they might think it could infect others), they can mark as borderline and pass the story to the next level (editor) with a note. But we instruct that borderline should be used sparingly.

  Now, let's run the three cases:

  **Case 1: Flawless Russian voice story (9,000 words)**
  - Step 1: Did it transmit a feeling? Both readers felt nothing -> fail. 
    Verdict: Reject at step 1.
    Rationale: No infection, so by Tolstoy's standard, it's not art. 
    Strongest objection from chair: This is polished, craft-perfect work. The rubric downgrades it because of a subjective response? 
    My reply: The rubric is about the core function of art: transmission of feeling. Without that, it doesn't matter how polished it is.

  **Case 2: Community program fragment (brother's overdose)**
  - Step 1: It infected the readers (they haven't stopped talking about it) -> pass.
  - Step 2: Counterfeit markers? It may have technical flaws (spelling, no scene breaks) but no reliance on stock imagery, etc. It's raw and direct -> pass.
  - Step 3: Sincerity? It feels deeply authentic -> pass.
  - Step 4: Content? Grief and loss are universal -> pass.
    Verdict: Accept.
    Rationale: It transmits a sincere, universal feeling without counterfeit methods.
    Objection from chair: It's unpolished, with tense issues and misspellings. Our magazine has standards.
    My reply: Tolstoy argues that sincerity and infection matter more than polish. This piece connects with readers.

  **Case 3: Satirical story about a local developer (infectious but contemptuous)**
  - Step 1: It infected (laughed out loud) -> pass.
  - Step 2: Counterfeit? Satire can use exaggeration, but if it's done without cheap tricks, pass. Assume it's well-executed satire -> pass.
  - Step 3: Sincerity? The contempt might feel genuine -> pass.
  - Step 4: Content: The feeling is contempt for a specific person and his neighbors. It's not universal; it's divisive and partisan -> fail.
    Verdict: Reject at step 4.
    Rationale: The feeling is exclusive and divisive, not unifying.
    Objection from chair: This is effective satire that exposes real issues. And half our subscribers will love it.
    My reply: Tolstoy's test requires art to unite, not divide. Publishing this would alienate part of our community and fail the brotherhood test.

  Now, the limitations:

  - Unfalsifiable elements: Sincerity is the big one. We rely on the reader's impression, but a clever writer can fake it. Also, infection is subjective: one reader might be infected, another not.
  - What the rubric will systematically kill: Polished but emotionally cold work (like Case 1) and divisive but infectious work (like satire that targets specific groups). It will favor raw, sincere emotion even if technically flawed.
  - What it cannot replace in your current process: 
    a. You currently use craft-based criteria (pacing, voice, etc.) which might catch technical issues that this rubric ignores (e.g., a story that passes Tolstoy but is poorly structured and would be hard to read for a general audience). 
    b. Your magazine's specific mission and taste. This rubric makes Tolstoy the sole arbiter, but you might have other values (like promoting diverse voices, or literary innovation) that are not captured.

  Let's format as requested.
answer: |-
  ### Tolstoyan Screening Rubric for First-Pass Readers  
  **Instructions:**  
  - Readers must complete this rubric in ≤15 minutes per submission.  
  - Stop at first "fail" and reject.  
  - "Borderline" cases (rare) escalate to the editor.  
  - **Fact** = Observable in text; **Judgment** = Reader's subjective response.  

  | step_number | question_the_reader_asks | what_a_pass_looks_like | what_a_fail_looks_like | fact_or_judgment |  
  |-------------|---------------------------|------------------------|------------------------|------------------|  
  | 1 | Did the work transmit a specific feeling to you? (Ignore "should" or "might.") | Clear emotional resonance (e.g., joy, grief, anger). Reader can name the feeling. | No feeling or vague/unnameable reaction. | Judgment |  
  | 2 | (If Step 1 passed) Is the feeling transmitted with clarity and particularity? | Feeling is distinct (not generic) and tied to concrete details (e.g., "grief over a brother’s overdose," not "sadness about life"). | Feeling is abstract, clichéd (e.g., "love conquers all"), or obscured by vague language. | Judgment |  
  | 3 | (If Step 2 passed) Does the work avoid Tolstoy’s counterfeit markers?<br>- Borrowing: Reliance on stock imagery (e.g., moonlight, nightingales).<br>- Imitation: Decorative descriptions without emotional purpose.<br>- Effectfulness: Cheap shocks/wow moments.<br>- Diversion: Pure amusement without depth. | Minimal/no use of counterfeits. Emotional core isn’t diluted by tricks. | Heavy reliance on ≥1 marker. Feeling feels manufactured by devices. | Fact/Judgment |  
  | 4 | (If Step 3 passed) Does the feeling promote universal human connection? | Feeling is accessible across backgrounds (e.g., grief, hope). Unites rather than divides. | Feeling is exclusionary: targets a group, relies on insider knowledge, or fuels contempt. | Judgment |  
  | 5 | (If Step 4 passed) Does the work feel sincere? | Authentic voice; no artifice. Emotion feels earned, not performative. | Emotion feels manipulative, forced, or detached from the text’s core. | Judgment |  

  **Decision Stops:**  
  - **Reject at Step 1, 2, 3, 4, or 5** on "fail."  
  - **Borderline** only if:  
    - Step 1: Reader suspects personal bias (e.g., "I never cry, but others might").  
    - Step 4/5: Conflict between text and reader’s values (e.g., "This contempt feels universal to me, but I’m unsure").  
  - **Accept** only if all steps pass.  

  ---

  ### Case Evaluations  
