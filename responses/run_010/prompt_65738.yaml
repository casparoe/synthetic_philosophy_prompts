  2. The circular mouse-counting where both sides use the same data to oppose each other. 
  3. Fischer and Lamey's point undermining the premise by noting wild suffering happens regardless.

  A pub-style dialogue could work well for contrasting viewpoints. Or a stand-up style setup where the comedian embodies the philosophers' flawed logic. The punchline should highlight the contradiction or unexpected conclusion, like "least harm" endorsing steak over tofu or beef over chicken despite common assumptions.

  I'm considering crafting a joke that starts with the premise of choosing a diet, then subverts it with the beef-over-chicken or steak-over-beans logic, name-dropping Archer or Matheny for insider recognition. The key is making the academese the punchline—letting the audience's knowledge of the papers do the work.
answer: |-
  Here's a quick pub exchange playing on the unexpected beef-over-chicken conclusion and the circular mouse-counting debates, designed for groans from those who know:

  > **A:** "Right, so Davis says pick the diet causing least harm, yeah? Less death, less suffering."
  >
  > **B:** "Got it. So... beans over steak?"
  >
  > **A:** "Ah, see, Archer counted the mice. Says there's *more* dead field mice per plate of beans than on that steak."
  >
  > **B:** "Hold on, Matheny and Chan ran the numbers – turns out for the *same* protein, you kill way fewer cows than chickens. One cow's a protein factory, chickens are bite-sized."
  >
  > **A:** "Exactly! So least harm means..."
  >
  > **B:** "...order the steak. *Specifically* to save the chickens. And possibly the mice... or not... depending on whose hectare you're double-counting this week."

  **Why it works for your crowd:**
  *   **Punchline:** The absurdity of "order the steak to save the chickens" flips the expected ethical script entirely, landing Matheny & Chan's counterintuitive point hard.
  *   **Inside Jokes:** Name-drops Davis, Archer, Matheny & Chan. References the core arguments (least harm, field mice per bean plate, cows vs chickens per protein unit).
  *   **Mouse-Counting Chaos:** The final line ("depending on whose hectare you're double-counting this week") directly mocks the way the mouse-death figures get manipulated/rebutted in the literature (Archer vs his critics, Fischer & Lamey's context), making the whole quantification feel like a farce – the humour is on the philosophers and their shifting arithmetic.
  *   **Economy:** It's fast, pub-style banter.
  *   **No Explaining Needed:** The logic chain (Least Harm -> Mouse Count -> Protein Efficiency -> Steak Saves Chickens) is the joke itself for those who know the steps.

  The groan comes from recognizing how "least harm" leads to a conclusion (prioritise big ruminants) that feels utterly perverse to standard ethical diet discourse, amplified by the acknowledgement that the foundational mouse-math is a contested mess. It gets funnier the deeper you are in the weeds of *which* mouse-counting flaw you think is most egregious. Enjoy the reading group!
