prompt: |-
  So — I'm about seventy thousand words into my third novel and I've got a problem I made for myself eight months ago and have been politely ignoring until now.

  The book is set in an invented valley with a reincarnation-flavoured religion where karma is basically a literal system of moral accounting. Villagers bring cases to an old laywoman everyone calls the Tallywoman — she's not a priest, more like a magistrate of desert — and she tells them what their account looks like. I wrote eight of these little scenes across the first half, mostly following my nose, and chapter 26 now depends on her being consistent, and I honestly can't remember what rule I was running.

  Her verdicts so far:

  1. A man puts nightshade in his brother's well intending to kill him; the brother left the valley a week earlier and nobody drinks from it. She says the account stands at full weight, same as if he'd died.
  2. A midwife running to a breech birth knocks over a lamp and the house burns to the ground, everyone gets out alive. She says no fruit at all — "the fire was already sitting in the lamp."
  3. A merchant gives generously his whole life but only where it can be seen, and keeps a private list of who owes him. She says he's been paid in full already, his account is closed, nothing further is owed to him.
  4. A girl steals loaves from a rich baker who never notices, to feed her brother. She says the theft bears fruit, small, ripening in this life; the feeding of the brother bears its own fruit, larger; they don't cancel, they're entered seperately.
  5. A man beats his wife for twenty years and after she dies fasts and tends strangers' sick until his own death. She says the beating still ripens, the tending still ripens, and the two never meet.
  6. A hunter kills only what he eats and says a prayer over each body. She says light fruit, and it will come back to him as a death of his own that arrives quickly and without fright.
  7. A son dedicates the merit of a long pilgrimage to his dead mother. She says it reaches her if she's somewhere she can be glad of it; if she's somewhere she can't, it stays with the son.
  8. A boy sets a snare for birds; a magistrate signs a removal order without reading it. She says the snare is the heavier of the two that day, and the signature is the heavier across the years.

  Now chapter 26. Wren, my protagonist, knows her brother has intended for a year to kill the steward who conscripted the valley's sons, and half the valley knows it, and he's going to do it on the night of the festival. She gets there two days early and kills the steward herself — planned, calm, no rage, and she tells people afterwards exactly why. Then she walks to the Tallywoman and announces the whole thing, asking for the killing to be entered on her account instead of his, on the theory that he's the one who was going to be ruined by it and she's the one who's already ruined.

  What I need from you:

  - Which rules actually fit all eight verdicts. I can see at least an intention-at-the-moment rule, a character-formation rule, a mirror-the-form-of-what-you-did rule, and something about accounts not being commensurable, but I can't tell which of those I've actually committed to and which are just compatible with what I wrote.
  - What each of them says she tells Wren. Does the substitution work, half-work, or fail outright — and under which rule does her brother still carry a full-weight intended killing he never carried out?
  - Your best single guess at what I've already signed up for, with the reasoning, plus which one or two of the eight scenes is doing most of the work and which is the loosest.
  - If there's a reading consistent with all eight that lets the sacrifice partly land without her just lying to Wren, I'd genuinely rather have that.
  - A ninth case I could slip into chapter 9 as a two-page scene that would discriminate between the top contenders. It has to be the kind of thing a villager would actually bring her, and her answer has to be short.
  - What theory of moral desert I'm endorsing with each option — is desert transferable at all, is it retributive mirroring or self-formation, do acts net against each other. I want to know the philosophical cost of each ending, not which is nicer.

  No need to point me at the real Buddhist or Jain sources, I've read enough of them badly. I don't need the ending fixed either. I need to know what the ledger already says.
reasoning: |-
  Okay, the user is deep into writing their third novel and has hit a snag with their karma system. They've set up a Tallywoman character who judges moral accounts based on reincarnation principles, and now they need consistency for a critical scene in chapter 26. The protagonist, Wren, kills someone to take the karmic burden from her brother, and the user needs to know what rules the Tallywoman would apply based on prior verdicts.

  First, I need to analyze the eight existing verdicts to identify consistent principles. Let's list them out:

  1. **Intent without action**: The man who put nightshade in the well gets full karmic weight even though no one died. This shows intention matters more than outcome.  
  2. **Accidental harm**: The midwife causes a fire but isn't blamed because her intent was pure. So accidental outcomes don't count if the intention was good.  
  3. **Motive matters**: The generous merchant who kept score gets no future credit because his motives were selfish. The act's value is tied to the intent behind it.  
  4. **Separate ledgers**: Stealing and feeding are separate entries; they don't cancel out. This suggests karma isn't netted but itemized.  
  5. **No netting**: The abusive husband's good deeds don't offset his bad ones. Each action carries independent weight.  
  6. **Mirroring consequences**: The hunter's respectful killing results in a quick, painless death for himself. The form of the act mirrors the consequence.  
  7. **Conditional transfer**: Merit dedication only works if the recipient can receive it. Transfer isn't automatic; it depends on the recipient's state.  
  8. **Magnitude vs. scale**: The boy's snare has immediate heavy karma, while the magistrate's neglect compounds over time. Impact scales differently based on the act.  

  So core principles emerge:  
  - **Intent is primary** (cases 1,2,3,6)  
  - **Karma isn't fungible** (cases 4,5)  
  - **Consequences mirror actions** (cases 6,8)  
  - **Transfer is conditional** (case 7)  

  For Wren's situation: She kills to spare her brother's karma. Her brother had intent without action (like case 1), so he'd already accrued full karmic debt. Her act of killing would be a separate entry (per case 4). Transferring karma isn't possible because accounts aren't transferable (case 7 shows transfer requires recipient capacity, which doesn't apply here).  

  Possible verdicts:  
  - **Substitution fails**: Brother retains intent-karma; Wren gets killing-karma.  
  - **Partial success**: Brother's intent-karma is reduced but not erased; Wren bears the killing burden.  
  - **Full failure**: Tallywoman might say Wren's act was selfish (like the merchant) or that the brother's debt is locked in.  

  The strongest reading:  
  - Brother's intent (case 1) = full karma debt  
  - Wren's killing = separate heavy karma (case 8)  
  - No substitution possible (cases 4,5,7)  

  For the test case in chapter 9:  
  A fisherman accidentally kills a rare turtle while repairing nets. He confesses, remorseful. Tallywoman's verdict: "The net held death; your hands held care. The death ripens small; the care stays yours." This shows accidental harm + intent mattering, and no netting.  

  Philosophical costs:  
  - **Retributive**: Karma mirrors acts (painless death for hunter).  
  - **Non-consequentialist**: Intent > outcome (midwife, well poisoner).  
  - **Anti-utilitarian**: No netting (theft vs. feeding, abuse vs. charity).  

  Key inconsistencies:  
  - Case 2 (midwife) prioritizes intent over outcome, but case 1 (well) punishes intent despite no outcome. This is consistent if we see both as intent-focused: one had malicious intent, the other had pure intent.  
  - Case 8 (snare vs. signature) shows both immediate and long-term weight, but doesn't conflict with others.  

  The Tallywoman would likely tell Wren:  
  - Brother's intent is already a sealed debt (like case 1).  
  - Her killing is a separate heavy entry (like case 8).  
  - Sacrifice doesn't transfer debt (unlike case 7's conditional transfer).  

  This maintains consistency while creating tragic depth: Wren's act saves her brother socially but damns them both karmically.
answer: |-
  Based on your eight verdicts, your Tallywoman operates under a highly consistent, rules-based system of moral accounting. There are clear patterns, and the system you've built is philosophically coherent—though deliberately unforgiving. I'll break this down step by step, prioritizing textual evidence from your cases over external philosophies. 

  ### Core Rules (Extracted from Your 8 Verdicts)
  Your system has four non-negotiable principles, ranked by strength of evidence:

  1. **Intent at the Moment of Action is Paramount**  
     - **Evidence**: Case 1 (full weight for *intending* to kill, even with zero harm), Case 2 (no fruit for accidental harm because intent was pure), Case 3 (motive voids merit), Case 6 (intent behind the prayer softens the killing).  
     - **Rule**: Karma is assigned based on the mental state *during the act*. Outcomes are irrelevant (Case 1, 2). Motive corrupts or sanctifies the act (Case 3: "where it can be seen" voids generosity; Case 6: reverence softens killing).  

  2. **Acts are Itemized, Not Netted**  
     - **Evidence**: Case 4 (theft and feeding are "entered separately"), Case 5 (beating and tending "never meet"), Case 3 ("paid in full" means no offsetting).  
     - **Rule**: Good and bad acts exist in parallel ledgers. They don't cancel, reduce, or combine. Each bears independent fruit.  

  3. **Consequences Mirror the Form of the Act**  
     - **Evidence**: Case 6 (prayer → peaceful death), Case 8 (snare → immediate heaviness; signature → long-term heaviness).  
     - **Rule**: Karma "ripens" in a way that structurally reflects the act—e.g., speed, scale, or manner.  

  4. **Transfer is Conditional and Rare**  
     - **Evidence**: Case 7 (merit reaches the dead only if they're "somewhere they can be glad of it").  
     - **Rule**: Karma is fundamentally personal. Transfer requires specific conditions and isn't guaranteed.  

  --- 
  ### What the Tallywoman Tells Wren (Chapter 26)
  **Brother's Situation**:  
  - He *intended* to kill for a year (Case 1: intent = full weight).  
  - Half the valley knew (publicity doesn't matter; see Case 3).  
  - **Verdict for Brother**: He carries the full weight of the *intended killing*, even though he never acted. It will ripen as if he did it (mirroring Case 1).  

  **Wren's Situation**:  
  - She killed calmly and planned it (intent was deliberate; see Cases 1, 8).  
  - She did it to absorb his karma (motive: sacrifice).  
  - **Verdict for Wren**:  
    - The killing is a separate, heavy entry on *her* account (Case 4: acts are itemized; Case 8: planned violence is "heavier").  
    - Her motive (sacrifice) doesn’t negate the act’s weight (Case 3: motive can corrupt, but not sanctify; Case 5: good intent doesn't erase bad acts).  
    - **Substitution Fails**:  
      - Karma isn't transferable (Case 7: transfer is conditional on the recipient's state; a living brother can't "receive" negative karma).  
      - Even if it were, the brother's intent-based debt is already locked in (Case 1: "account stands at full weight" upon intent).  

  **Tallywoman's Likely Response**:  
  > "Your brother’s debt was sealed the hour he fixed his will to kill. It ripens for him, heavy as the thing itself. Your hand took the steward’s life, and that debt is yours alone. They do not meet. They do not trade. You have only added to the ledger."  

  **Why This is Consistent**:  
  - Intent is primary (Wren acted; brother intended).  
  - No netting or transfer (Cases 4, 5, 7).  
  - Mirroring: Wren’s calm, public killing may ripen as a cold, inescapable consequence (like the hunter’s quick death in Case 6).  

  **Philosophical Cost**:  
  - **Desert is non-transferable and non-consequentialist**. Moral weight is assigned at the moment of action based on intent, not outcomes or later penance.  
  - **Anti-utilitarian**: No "greater good" offsets evil (Case 4, 5). Sacrifice is just another entry.  
  - **Retributive mirroring**: Punishment fits the crime’s form, not its impact (Case 6, 8).  
  - **Tragic implication**: Good intentions (like Wren’s) can’t erase bad acts; the system is mechanical and impersonal.  

  --- 
  ### What You've Signed Up For (and Why)
  - **Strongest Commitment**: **Intent-based itemization**. Acts are judged at inception, cataloged separately, and bear fruit structurally mirrored to their nature.  
  - **Key Scenes Doing the Work**:  
    - **Case 1** (intent without action = full weight) and **Case 4** (no netting) are your cornerstones. They’re referenced in 5/8 verdicts.  
    - **Case 7** (conditional transfer) is the clincher against Wren’s substitution working.  
  - **Loosest Scene**: Case 2 ("the fire was already sitting in the lamp") is vague but fits intent-based purity. It doesn’t contradict others but isn’t necessary.  

  **Inconsistencies?** None major. Case 2’s "no fruit" for accident aligns with intent focus. Case 3’s "paid in full" reinforces no netting (his good acts were voided by motive).  

  --- 
  ### Making the Sacrifice "Partly Land" (Without Lying)
  A consistent reading where Wren’s act *does* something, but not what she hopes:  
  - **Brother’s intent-karma** remains intact (Case 1).  
  - **Wren’s killing-karma** is hers alone (Cases 4, 5).  
  - **But**: Her *confession* could be a new positive entry.  
    - Case 8 distinguishes *magnitude* (snare vs. signature). Wren’s public confession might make her karma ripen "lighter" (e.g., as remorse, not torment) or faster.  
    - Case 7 implies karma can be *shared* if conditions allow—but since the brother is alive and unrepentant, it doesn’t apply here.  

  **Tallywoman’s Revised Response for Partial Effect**:  
  > "Your brother’s account was set when his will hardened. Your act is yours alone. But the truth you spoke? That ripens too. It will not lighten the killing, but it may shape how it returns to you."  

  **Philosophical Cost**: Adds a "confession mitigates form, not weight" rule. Still non-consequentialist.  

  --- 
  ### Ninth Case for Chapter 9 (to Discriminate Contenders)
  **Scenario**: A farmer confesses to abandoning his blind father in a snowstorm years ago, believing he’d die. The father survived and was rescued by a hermit. The farmer has lived in guilt since.  

  **Tallywoman’s Verdict**:  
  > "The leaving bears full fruit—your will cast him out. The guilt bears none; it comes too late. They are entered apart."  

  **Why This Discriminates**:  
  - Tests **intent vs. outcome**: Outcome (father lived) is irrelevant; intent to abandon is what matters (aligns with Cases 1, 2).  
  - Tests **netting**: Guilt doesn’t negate the act (aligns with Cases 4, 5).  
  - Tests **mirroring**: Abandonment in cold may ripen as isolation/coldness.  
  - **If she said guilt reduces weight**, you’d have netting (contradicts Cases 4, 5). **If she said survival reduces weight**, outcomes matter (contradicts Cases 1, 2).  

  --- 
  ### Summary: Your Ledger is Set
  - **Rules Signed Up For**:  
    1. Karma is assigned at the moment of action based on intent.  
    2. Acts are itemized; no netting or cancellation.  
    3. Consequences mirror the act’s form.  
    4. Transfer is exceptional and conditional.  
  - **Wren’s Outcome**: Substitution fails. Brother carries full intent-karma; Wren carries full killing-karma.  
  - **Philosophical Cost**: A rigid, almost mathematical system where:  
    - Desert is earned at the moment of choice.  
    - Moral luck doesn’t exist (accidents aren’t blamed, but intent is punished regardless of results).  
    - No salvation through sacrifice—only through the original act’s purity.  

  This gives you tragic consistency: Wren’s sacrifice damns them both *more* by adding to the ledger. If you want partial hope, let her confession create a separate "truth-telling" entry that ripens as clarity or purpose, not absolution.  

  Need a tweak or deeper dive on one angle? I’m here.
