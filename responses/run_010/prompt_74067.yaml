prompt: |-
  I'm the partnerships lead at a small coalition of about a dozen advocacy organizations — animal welfare, global health, criminal justice reform, and two faith-affiliated family-services groups. Members bring me two or three proposals a month in which each offers to soften, suspend, or fund something the other cares about, on terms neither would accept for free: our animal-welfare member asks a global-health member to stop serving meat at its fundraisers, and the global-health member asks in return that the animal-welfare member redirect part of its lobbying budget to bed nets. We have no framework, so each proposal is settled by whoever argues hardest.

  Please write a decision procedure for evaluating these trades that my two-person team, neither of whom has studied philosophy, can run in about an hour per proposal. Ground it in what the moral trade literature actually establishes rather than in general negotiation advice: the questions to ask in order, what counts as a sufficient answer to each, where the procedure terminates in a no, and where it must hand the decision back to the member board because the question is one of values rather than facts (the board signs off by two-thirds on anything the procedure flags). It should address whether each side can be assessed in its own evaluative terms or whether some exchange rate between values is unavoidable; trades in which a party is asked to give up something it considers not merely suboptimal but flatly impermissible; harms to parties who are not at the table, including future people and nonhuman animals; publicity, and whether a trade that has to be kept quiet is thereby disqualified; and repeat play, where refusing trades preserves social pressure against conduct we think wrong while accepting them trains counterparts to expect payment.

  Then run it on three cases: the meat-for-budget exchange above; an outside group that campaigns against abortion access offering to fund and lobby for our criminal-justice member's sentencing-reform bill if the coalition stays neutral on an upcoming abortion ballot measure; and two members agreeing to withdraw opposition to a freight corridor in exchange for donations to their own programs, where the corridor's costs fall on residents and habitat downstream.

  Flag which steps are judgment calls dressed up as procedure, and say plainly what the procedure cannot decide. Finally, tell me what would change your mind: which consideration would flip your verdict on the second case, and where your reasoning about the procedure is most likely to break down.
reasoning: |-
  Okay, the user is the partnerships lead for a coalition of advocacy organizations. They're dealing with internal proposals where members trade concessions, like an animal welfare group asking a global health group to stop serving meat at fundraisers in exchange for redirecting lobbying budget to bed nets. The current process is chaotic, decided by whoever argues hardest, so they need a structured decision procedure grounded in moral trade literature. 

  First, I need to recall what moral trade literature actually says. It involves trades where parties give up something they value less for something they value more, but there are complications like incommensurable values, impermissibility, externalities, and publicity. The user wants a practical framework for their team, who aren't philosophers, to use in about an hour per proposal. 

  Breaking down the requirements: The procedure must handle value comparisons, impermissible actions, harms to third parties (including future generations and animals), secrecy issues, and repeat interactions. It should flag when decisions need to go to the board for value judgments. Also, they want it applied to three cases and to identify where the procedure has limitations.

  For the decision procedure, I'll structure it as a flowchart with specific questions. Start with feasibility, then move to mutual benefit assessment in each group's own terms. If that fails, check for shared values. If still stuck, it's a board decision. Then address external harms, publicity, and repeat play effects. The procedure should terminate in a "no" if there's impermissibility without recourse, severe external harm, or required secrecy. Otherwise, it might proceed or go to the board.

  Now, for the cases: 
  1. Meat vs. bed nets: This seems feasible. Both sides benefit in their own terms—animal welfare saves animals, global health gets bed nets. No impermissibility, minor external harms (livestock industry might lose, but that's acceptable). Publicity is fine. Repeat play might be an issue if it normalizes meat consumption, but the trade is minor. So, probably proceed.

  2. Abortion neutrality for sentencing reform: Feasible, but the criminal justice group might benefit. However, the abortion stance could be impermissible for the coalition. Even if assessed in their terms, the harm to reproductive rights might be severe. Publicity could backfire, and repeat play might encourage more such offers. This likely goes to the board due to value conflicts.

  3. Freight corridor for donations: Feasible, mutual benefit for the two groups. But external harms to residents and habitat are significant. If mitigations exist, maybe proceed, but the coalition doesn't represent the affected parties. Publicity might be negative. This should be a "no" due to unaddressed external harms.

  Key judgment calls: Deciding if a trade is impermissible, assessing harm levels, and evaluating repeat play effects. The procedure can't resolve deep value conflicts or quantify all externalities. It relies on the team's judgment for severity assessments.

  What would change my mind on the abortion case? If the sentencing reform had massive, immediate impact (like freeing thousands unjustly jailed) and the abortion measure was minor, the trade-off might shift. But the impermissibility aspect is sticky. The procedure's weakness is in handling subjective assessments of harm and impermissibility, which could vary based on the team's biases.

  Overall, the procedure aims to bring structure, but its effectiveness depends on the team's ability to impartially assess each step, especially the gray areas. The board's role is crucial for value-laden decisions.
answer: |-
  Here's a moral-trade decision procedure grounded in the literature (Horton, Ord, MacAskill, etc.), designed for speed and clarity by a non-philosophical team. It prioritizes *procedural rationality* over substantive moral resolution where values clash.

  **Moral Trade Evaluation Procedure (1-Hour Framework)**

  **Core Principle:** Trades are permissible if they produce *net moral gain according to at least one credible perspective without imposing impermissible harms*, and meet procedural constraints (publicity, repeatability). Avoid imposing a single "exchange rate" unless necessary.

  **Steps (Follow in Order - ~10 mins/step):**

  1.  **Feasibility & Self-Interest Check:**
      *   *Question:* "Can both parties *physically and legally* deliver their promise? Does the trade *materially benefit each organization's core operational goals* (e.g., more funds, fewer barriers, expanded reach) *ignoring the moral conflict*?"
      *   *Sufficient Answer:* "Yes" from both parties' operational leads. If "No" from either, **Terminate: NO TRADE**. (Judgment: Assessing "core operational benefit" may involve discretion).
      *   *Output:* Proceed if feasible/beneficial operationally.

  2.  **Mutual Moral Benefit in Own Terms:**
      *   *Question:* "Does Party A genuinely believe the good they *receive* (e.g., bed nets) significantly outweighs the cost of *giving* (e.g., redirecting lobbying $) *within their own value system*? Repeat for Party B (e.g., meat cessation vs. lobbying $ cost)."
      *   *Sufficient Answer:* Uncoerced "Yes" from leadership of *both* parties, confirmed by the proposing members. If either says "No," **Terminate: NO TRADE**. (Judgment: Assessing sincerity/understanding).
      *   *Output:* If mutual "Yes," **Provisional YES (Proceed to Step 4)**. If unclear or conflicted, proceed to Step 3.

  3.  **Shared Value or Dominance Check (Avoiding Exchange Rates):**
      *   *Question:* "Is the *type* of good being received by each party *recognized as a significant moral good* by the *other* party, even if not their priority? (e.g., Global Health acknowledges animal suffering is bad, Animal Welfare acknowledges disease death is bad). OR, is the *net benefit* to one party so overwhelmingly large *by any reasonable metric* (e.g., saving thousands of lives vs. minor inconvenience) that the trade is clearly beneficial overall, even if the other party's gain is marginal?"
      *   *Sufficient Answer:* "Yes" to either condition based on coalition shared principles or overwhelming scale. If "No," **Flag for Board: VALUES CONFLICT**. (Judgment: Defining "significant," "reasonable metric," or "overwhelming scale").
      *   *Output:* If "Yes," **Provisional YES (Proceed to Step 4)**. If "No" or unclear, **Flag for Board: VALUES CONFLICT**.

  4.  **Impermissibility Check:**
      *   *Question:* "Is any party being asked to perform an action (or enable an action) that it considers *categorically impermissible* (deontological constraint), not just suboptimal? (e.g., directly causing harm deemed intrinsically wrong)."
      *   *Sufficient Answer:* "Yes" from the party being asked. If "Yes," **Terminate: NO TRADE** (Cannot trade away core constraints). If "No," proceed. (Judgment: Distinguishing "impermissible" from "very bad" – requires understanding the member's core ethics).

  5.  **External Harms Assessment (Third Parties, Future Beings, Animals):**
      *   *Question:* "Does the trade impose *significant, foreseeable, and unjustified harms* on entities not represented in the agreement (e.g., downstream communities, future generations, animals)? Are these harms *mitigated or outweighed* by direct benefits *to those same entities* or by massive gains elsewhere?"
      *   *Sufficient Answer:* "No significant unjustified harms" OR "Harms are offset by direct benefits to affected entities" OR "Harms are vastly outweighed by gains crucial to the coalition's overall mission." If harms are significant, unjustified, and not outweighed, **Terminate: NO TRADE**. (Judgment: Defining "significant," "unjustified," "outweighed" – major judgment call).
      *   *Output:** Proceed if harms are acceptable/outweighed.

  6.  **Publicity & Secrecy Test:**
      *   *Question:* "Can the *existence and full rationale* of this trade be publicly disclosed to all coalition members, stakeholders, and potentially the affected public *without undermining its core benefits or causing unacceptable reputational damage*?"
      *   *Sufficient Answer:* "Yes, disclosure is possible." If "No, secrecy is essential," **Terminate: NO TRADE** (Secrecy often indicates illegitimacy or corrosive effects per moral trade literature). (Judgment: Assessing "unacceptable reputational damage" vs. transparency norm).

  7.  **Repeat Play & Normative Impact:**
      *   *Question:* "Is this trade likely to set a precedent that *undermines valuable norms* or *reduces future pressure* against harmful behavior we oppose? (e.g., normalizing paying groups to stay silent on core issues). Does accepting it *significantly reduce* the coalition's future ability to criticize the underlying behavior?"
      *   *Sufficient Answer:* "No significant negative normative impact expected" OR "The concrete gains *now* are so critical they justify the potential normative cost." If negative impact is likely and significant, **Flag for Board: STRATEGIC IMPACT**. (Judgment: Predicting normative consequences – highly speculative).
      *   *Output:** If concerns minor, **FINAL YES**. If major concerns, **Flag for Board: STRATEGIC IMPACT**.

  **Procedure Outputs:** Terminate (No Trade), Provisional Yes (Proceed), Flag for Board (Values Conflict or Strategic Impact), Final Yes.

  **What the Procedure CANNOT Decide:**
  1.  **Deep Value Incommensurability:** It cannot *resolve* whether animal lives are "worth" more or less than human lives in the abstract. It can only check if trades work within each party's *own* terms or via dominance/shared values (Steps 2 & 3).
  2.  **Quantifying Harm Severity:** Judgments of "significant" harm or "overwhelming" benefit (Steps 5 & 7) are inherently subjective.
  3.  **Predicting Long-Term Consequences:** Especially the precise normative impact of repeat play (Step 7).
  4.  **Defining "Impermissible":** Relies entirely on the member's declaration (Step 4).

  ---

  **Case Evaluations (Applying the Procedure):**

  **Case 1: Meat at Fundraisers (A) vs. Lobbying $ for Bed Nets (G)**
  1.  **Feasibility/Self-Interest:** Yes. Global Health can feasibly serve vegetarian food. Animal Welfare can feasibly redirect $. Both gain operationally (A: symbolic win/less animal use, G: more funds for nets).
  2.  **Moral Benefit (Own Terms):** *A* likely Yes (Animals saved by nets + fewer animals eaten > lobbying $ loss for other goals?). *G* likely Yes (More lives saved via nets > minor inconvenience/changing menus?).
  3.  *(Skip - Mutual Yes at Step 2)*
  4.  **Impermissibility:** Unlikely. Serving meat isn't *impermissible* for G (probably suboptimal). Redirecting $ isn't *impermissible* for A.
  5.  **External Harms:** Minor harm to meat suppliers? Vastly outweighed by bed nets saving lives & reduced animal suffering. Minor animal suffering from nets? Likely negligible vs. benefits.
  6.  **Publicity:** Yes, can be public. "Coalition members collaborate: Healthier food saves lives!"
  7.  **Repeat Play:** Minor risk normalizing meat consumption? But concrete gains high, normative impact likely low. **FINAL YES.**

  **Case 2: Abortion Neutrality (Outsider) vs. Funding/Lobbying for Sentencing Reform (CJ)**
  1.  **Feasibility/Self-Interest:** Yes. Outsider can fund/lobby. CJ can benefit. Coalition can stay neutral.
  2.  **Moral Benefit (Own Terms):** *CJ* likely Yes (Massive win for reform!). *Coalition re: Outsider Ask:* Staying neutral on abortion? **Impermissibility Check (Step 4) Kicks In:** For faith-based members & potentially others, *enabling* reduced abortion access by silence might be considered **impermissible**. **Terminate: NO TRADE**. (Even if not, coalition value conflict at Step 3 likely sends to Board).
  3.  *(If Impermissibility not invoked)* **Shared Value Check:** Does the coalition *recognize* restricting abortion access as a "significant moral good"? Unlikely. Is sentencing reform benefit *overwhelmingly* large? (Saves lives/freedom, but abortion access also critical). **Flag for Board: VALUES CONFLICT**.
  4.  *(If proceeded)* **External Harms:** Harm to women seeking abortions is direct, significant, and unjustified by sentencing reform gains *for them*.
  5.  **Publicity:** Disclosure would be explosive and likely damage coalition. **Terminate: NO TRADE** (Fails Step 6).
  6.  **Repeat Play:** High risk! Trains anti-abortion groups to "buy" coalition silence, undermines pro-choice stance. **Terminate: NO TRADE** (Fails Step 7).

  **Case 3: Withdraw Opposition to Freight Corridor (A & FB) for Donations**
  1.  **Feasibility/Self-Interest:** Yes. A & FB can withdraw opposition. Developers can donate. A & FB gain funds.
  2.  **Moral Benefit (Own Terms):** *A*: Funds for programs > harm of corridor? *FB*: Funds for programs > harm of corridor? **Likely Yes** if funds are substantial for their direct work.
  3.  *(Skip - Mutual Yes at Step 2?)*
  4.  **Impermissibility:** Unlikely. Withdrawing opposition isn't *impermissible* (probably suboptimal).
  5.  **External Harms:** **Significant Harm:** Pollution, habitat destruction, negative impacts on downstream residents/habitat. *Are these offset?* Donations to A/FB *do not* directly benefit the harmed entities. *Outweighed?* Local harms vs. gains for A/FB programs – unlikely "vastly outweighed" by coalition standards. **Terminate: NO TRADE** (Fails Step 5).
  6.  *(If proceeded)* **Publicity:** Likely negative – "Groups sell out community for donations." Might be possible but damaging.
  7.  **Repeat Play:** Risk of normalizing environmental harm for cash payments. **Terminate: NO TRADE** (Fails Step 7).

  ---

  **What Would Change My Mind (Case 2 - Abortion/Sentencing):**
  *   **Change:** If the sentencing reform bill was *guaranteed* to immediately free *thousands* of wrongly incarcerated people facing life-threatening conditions *and* the abortion ballot measure was a *minor, procedural restriction* unlikely to significantly reduce actual access in the near term (e.g., a reporting requirement with easy compliance), **AND** the coalition board explicitly confirmed staying neutral was *not* considered impermissible by members.
  *   **Why:** This makes the concrete gain (saving lives/freedom now) potentially "overwhelming" (Step 3/5) compared to the speculated harm, reduces the impermissibility concern (Step 4), and might marginally improve the publicity/repeat play calculus (Steps 6/7). The core values conflict remains, but the scale could tip towards provisional approval pending board review.

  **Where the Reasoning is Most Fragile:**
  *   **Step 5 (External Harms) Assessment:** Quantifying and comparing diffuse future harms (pollution, habitat loss, climate effects) vs. concrete present benefits (funds for programs) is highly subjective and prone to bias ("our work is so important"). The procedure relies on the team's *judgment* of "significance" and "outweighing," which is its weakest link.
  *   **Step 7 (Repeat Play/Norms):** Predicting how one trade influences future behavior and societal norms is speculative. The literature emphasizes the *risk* but offers no formula. This step is easily manipulated by motivated reasoning ("this is a one-off" vs. "this sets a terrible precedent").
  *   **Step 4 (Impermissibility):** Relies entirely on the member's *declaration*. A member could strategically invoke "impermissibility" to veto trades they simply dislike, undermining the process. The procedure lacks a check on this sincerity.

  This framework provides structure, forces consideration of key moral trade dilemmas, flags the hardest decisions for the board, and prevents the worst trades (impermissible acts, severe externalities, secrecy). Its success depends on the team's commitment to impartiality in making the necessary judgment calls.
