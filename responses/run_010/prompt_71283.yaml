  - Calling (b) "pragmatic" without addressing procedural norms
  - Accepting (c) uncritically or rejecting it without specifying what assumptions would make it valid
  - Equating "more realistic" with normatively superior
  - Failing to articulate satisficing's unique features if (c) holds

  The model answer will perform the moves we want: for (a), argue that rationality operates on available information; for (b), show thresholds can be rationally updated; for (c), concede satisficing may approximate optimal stopping but retain distinct psychological realism. Crucially, it must end by defending satisficing as a theory of human cognition, not just optimization in disguise.

  Noticing the user fears "looks good but wrong" answers - like those praising realism without specifying if it's descriptive or normative. The marking scheme explicitly docks marks for that ambiguity. Also making sure part (c) isn't skippable by building interdependency: answering (c) requires engaging with expected value calculations and the conceptual collapse risk.
answer: |-
  ## Exam Question: Housing Officer Recruitment at Northfield Council (45 minutes, 20 marks)

  **Case:** Northfield Borough Council recruits one housing officer from 60 applications. Scoring each application properly takes 40 minutes of manager time. For the first recruitment, the panel adopts a rule: read applications in arrival order and offer the job to the first candidate scoring 7/10 or above.
  *   **(a)** Candidate 9 scores 7.4 and is hired. Reading stops. A year later, an audit scores the remaining 51 applications; candidate 34 scored 9.5.
  *   **(b)** The following year, for a different post, no candidate in the first 25 scores 7+. The panel lowers the threshold to 6 and hires someone scoring 6.4. Two years later, with a strong field, they raise the threshold to 8.
  *   **(c)** An econometrician argues the council was always maximizing: a threshold of 7 simply reflects maximizing expected net benefit (expected value of the hire minus search costs), so "satisficing" is just a relabeled maximizer.

  **Answer ALL parts:**
  1.  **(a)** Does the discovery of candidate 34 (scoring 9.5) show the council's satisficing rule (threshold 7, first acceptable) was irrational? Explain why or why not, focusing on what rationality required *at the time of decision*. **(6 marks)**
  2.  **(b)** Does the council's shifting thresholds (7, then 6, then 8) demonstrate that an aspiration level is not a stable normative standard, or does it illustrate procedural rationality? Justify your view. **(6 marks)**
  3.  **(c)** What assumptions must hold for the econometrician's claim (that satisficing is just maximizing with costs) to be valid? If these assumptions hold, does anything distinctive remain for "satisficing" as a concept? Explain. **(8 marks)**

  ---

  ## Model Answer (~700 words)

  1.  **(a)** The discovery of candidate 34 does *not* demonstrate that the council's rule was irrational. Rationality in decision-making, especially under bounded rationality, concerns making the best possible choice *given the information available at the time and the costs of acquiring more information*. The panel faced a sequential search problem with significant search costs (40 mins/app). Their rule – stop at the first candidate meeting a pre-set aspiration level (7) – was a pre-commitment strategy designed to avoid the potentially enormous cost of reading all 60 applications (40 hours). At the moment they hired candidate 9 (7.4), they had encountered no one above 7 before her. Based on the information they *had* (scores 1-9), they found an acceptable candidate efficiently. Discovering later that a better candidate existed *in the unseen pool* is irrelevant to judging the rationality of their process *ex ante*. Rationality does not require omniscience; it requires reasonable procedure given constraints. Judging them irrational based on information they *could not have possessed* without prohibitive cost would set an impossible standard. Their rule was a rational response to uncertainty and search costs.

  2.  **(b)** The shifting thresholds primarily illustrate *procedural rationality* and the adaptive nature of satisficing under bounded rationality, rather than proving aspiration levels lack normative force. A fixed aspiration level assumes prior knowledge of the distribution of candidate quality – knowledge the council clearly lacked. Their initial threshold (7) was a *starting point* based on best available judgment. When no candidate met it in the first 25 applications the following year, it provided new information: the candidate pool was weaker than expected. Lowering the threshold to 6 was a rational *adaptation* of the aspiration level based on this feedback, ensuring they could still hire someone acceptable without incurring vastly higher search costs. Raising it to 8 two years later, facing a strong field, similarly reflects learning: the aspiration level could safely be raised to potentially secure a *better* candidate earlier, reflecting updated expectations. This adaptability *is* the normative core of satisficing in dynamic environments. It embodies a rational *procedure* for managing uncertainty and learning: set an initial aspiration, search, and adjust the aspiration based on the difficulty of finding acceptable options encountered during the search itself. It is a norm for *how to adjust*, not an admission that the aspiration level itself was arbitrary.

  3.  **(c)** For the econometrician's claim (satisficing = maximizing net expected value) to hold, several strong assumptions must be true:
      *   **Known Distribution:** The decision-maker must know the *probability distribution* of candidate quality scores in the applicant pool. Only then can they calculate the expected value of continuing the search versus stopping.
      *   **Quantifiable Value & Cost:** The precise value (utility) of each candidate score and the exact cost (disutility) of each minute of search time must be known and quantifiable on a common scale to compute "net expected value."
      *   **Unchanging Pool:** The distribution must remain stable during the search (no learning about the pool changing the distribution).
      *   **Computational Capacity:** The decision-maker must have the cognitive capacity and time to perform the complex calculations required for the optimal stopping rule implied by maximizing net expected value.
      If *all* these assumptions hold, then yes, the council's satisficing threshold *could* be interpreted as the optimal stopping point derived from maximizing net expected value. The aspiration level (7) would simply be the operationalization of that optimal rule. However, **even if this holds, a distinctive core for "satisficing" remains:**
      *   **Procedural Focus:** Satisficing describes *how* humans and organizations actually make decisions under typical constraints: by setting a heuristic (aspiration level) and stopping when met. Maximizing net value is a *mathematical characterization* of an ideal outcome, often computationally infeasible.
      *   **Cognitive Realism:** Satisficing highlights the cognitive mechanisms used (setting aspirations, sequential comparison, adjustment based on feedback) when the assumptions for perfect maximization fail (which they almost always do). It explains the *process*, not just the outcome.
      *   **Aspiration Dynamics:** Satisficing inherently incorporates the *adaptation* of the aspiration level based on search experience and changing circumstances (as seen in part b), which is central to its descriptive and normative power in complex, uncertain environments. Pure maximization models often assume fixed parameters.
      Therefore, even if a satisficing rule *coincides* with an optimal stopping rule in a specific, highly constrained scenario, satisficing remains crucial as a theory of the *boundedly rational process* humans actually employ. It is not merely relabeled maximization; it is a distinct model of decision-making *under* cognitive and informational constraints.

  ---

  ## Marking Scheme (5 Must-Hit Moves, 20 marks total)

  1.  **Move 1: Rationality is Ex Ante & Procedural (Part a)** (4 marks)
      *   *Hit:* Clearly argues discovery of 34 is irrelevant to rationality judgment *at decision time*; rationality requires reasonable procedure given available info and search costs, not omniscience/perfect outcomes.
      *   *Fumble:* Focuses *only* on the 40-hour cost saving without addressing the *epistemic limitation* (couldn't know about 34). Or, claims it *was* irrational purely because a better candidate existed unseen.
      *   *Penalize:* "Looks good" answers that say "they saved time" but imply the outcome *makes* it irrational or that rationality requires finding the absolute best regardless of cost/knowledge.

  2.  **Move 2: Adaptability as Procedural Rationality (Part b)** (4 marks)
      *   *Hit:* Interprets shifting thresholds as a *rational procedural adaptation* (learning from search experience, updating expectations), integral to satisficing under bounded rationality/incomplete information.
      *   *Fumble:* Dismisses shifts as mere arbitrariness/pragmatism without normative procedural justification. Or, claims it shows they were *always* maximizing without defining how.
      *   *Penalize:* Answers calling it "pragmatic" or "flexible" without linking it to a *rational procedure for managing uncertainty and learning*.

  3.  **Move 3: Critical Assumptions for (c) (Part c)** (4 marks)
      *   *Hit:* Identifies *at least two* key assumptions: **Known Distribution** of quality (essential) AND one other (Quantifiable Value/Cost, Unchanging Pool, Computational Capacity).
      *   *Fumble:* Vaguely mentions "calculating costs/benefits" without specifying known distribution. Lists irrelevant assumptions.
      *   *Penalize:* Answers that simply agree/disagree with the friend without specifying the necessary preconditions.

  4.  **Move 4: Satisficing's Distinctive Residue (Part c)** (6 marks)
      *   *Hit:* Argues that even if thresholds align with optimal stopping, satisficing retains value by focusing on the **cognitive process** (heuristics, aspiration setting/updating) used under constraints where full maximization is impossible. Explicitly mentions **Procedural Focus** and/or **Cognitive Realism** and/or **Aspiration Dynamics**.
      *   *Fumble:* Claims satisficing is completely redundant if (c) holds. Or, only says it's "more realistic" without explaining *why* that matters (i.e., as a model of process under bounded rationality).
      *   *Penalize:* Answers that say satisficing is "more realistic" but fail to clarify this as its *descriptive/prescriptive strength regarding cognitive process*, not a normative claim that realism=better principle. Answers that just rehash time-saving.

  5.  **Move 5: Integration & Avoids Superficial Dichotomy** (2 marks - Holistic)
      *   *Hit:* Avoids simplistic "maximizing vs satisficing" contrast; shows understanding that satisficing *is* a form of rationality tailored to constraints; integrates concepts (e.g., procedural rationality in a & b, cognitive process in c).
      *   *Fumble:* Falls back on "maximizers want best, satisficers want good enough, real world has constraints" without deeper analysis of the case specifics or the conceptual challenges posed.
      *   *Penalize:* Answers structured solely around the superficial dichotomy. Answers that omit a substantive engagement with part (c)'s collapsing argument.

  **Crucial Enforcement:** A student scoring well on Moves 1, 2, 4, and 5 but missing **Move 3 (Critical Assumptions)** or providing a weak/non-existent argument for **Move 4 (Residue)** in Part (c) **cannot score above 14/20**. Part (c) is weighted highest and contains two essential moves (3 & 4), deliberately designed to prevent skipping the core conceptual challenge.
