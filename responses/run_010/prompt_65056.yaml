  I need to create two cases: Case L where the speaker lies directly, and Case M where they mislead through implicature without saying anything false. The challenge is making Case M more blameworthy despite the typical asymmetry. The design requirements are strict: consequences must match, motives must be similar, no additional falsehoods in M, no special excuses in L, and both cases need to be realistic institutional settings.

  For Case L, I'm thinking about a hiring scenario where an employer lies about a candidate's qualifications. For Case M, I'll use a similar hiring context but with misleading language - perhaps an employer implying a candidate passed a test when they actually failed, but without saying so directly.

  The key to making M more blameworthy might involve exploiting institutional norms. If in M the speaker uses language that formally complies with rules while misleading, it could create additional blameworthiness that isn't present in the direct lie. This would defeat the "on notice" rationale because the misleading statement appears trustworthy within the institutional framework.

  I also need to show how different theories of lying would classify Case M. The intention-based theory might not count it as lying since there's no intention to deceive through the false statement itself. The assertion-based theory would classify it as merely misleading. But the warrant-based theory might see it as lying because the speaker is putting forward something they know isn't warranted.

  For the defender's reply, they might argue that even in institutional contexts, hearers should still be on notice about implicatures. But if I've designed it well, the institutional framing makes the misleading statement appear more authoritative.

  The cases should be concise - one paragraph each under 120 words with a quotable utterance. I'll make sure both scenarios involve similar consequences: the same candidate gets hired and later fails at the job, with similar motives for deception in both cases.
answer: |-
  Here is a matched pair meeting the design requirements, followed by the analysis:

  **Case L (Lie):**
  Dr. Evans chairs the hiring committee for a university lecturer position. Candidate Jones performed disastrously in the teaching demo, displaying poor subject knowledge and unprofessional conduct. Evans believes Jones is wholly unsuitable. The Dean, who favors Jones, pressures Evans for the committee's verdict before the official report is finalized. To scuttle Jones's candidacy, Evans tells the Dean: "The committee unanimously recommends Jones." Evans knows this is false; the committee hasn't voted yet and is deeply divided. Relying on Evans's authority, the Dean rejects Jones, who subsequently fails at another university.

  *   **Utterance:** "The committee unanimously recommends Jones."

  **Case M (Merely Misleading):**
  Dr. Evans chairs the hiring committee for a university lecturer position. Candidate Jones performed disastrously in the teaching demo, displaying poor subject knowledge and unprofessional conduct. Evans believes Jones is wholly unsuitable. The Dean, who favors Jones, pressures Evans for the committee's verdict before the official report is finalized. To subtly endorse rejection without lying, Evans, referencing the demo criteria sheet, tells the Dean: "Jones satisfied all the formal requirements listed on the teaching demo evaluation rubric." This is true (e.g., Jones used slides, stayed within time). Evans knows the Dean will interpret this as positive feedback. Relying on Evans's authority, the Dean rejects Jones, who subsequently fails at another university.

  *   **Utterance:** "Jones satisfied all the formal requirements listed on the teaching demo evaluation rubric."

  ### Demonstration that the Design Works
  1.  **Matched Elements:** Both cases involve the same institutional context (academic hiring), speaker (Evans), hearer (Dean), target (Jones), motive (Evans believes Jones is unsuitable and wants to prevent hiring), consequence (Dean rejects Jones based on Evans's utterance, Jones later fails elsewhere), and stakes. No additional falsehood is uttered in M. No special excuse exists in L.
  2.  **Blameworthiness Gap (M > L):** Case M feels *more* blameworthy. Evans in M exploits the institutional structure itself – the formal rubric – as a tool for deception. This weaponization of the institution's own procedures for misleading purposes adds a layer of cynical manipulation absent in L, where Evans simply lies about the committee's recommendation. The lie in L is crude; the misleading in M is insidiously parasitic on the system's trust mechanisms.

  ### Accounts of Lying Applied to Case M
  1.  **Intention to Deceive (e.g., Augustine):** This account focuses on the speaker's intent. Evans *intends* the Dean to form the false belief that Jones's demo was adequate. Therefore, **Case M is a lie**.
  2.  **Asserting What One Believes False (e.g., Standard Definition):** This account focuses on the literal content asserted. Evans asserts only that Jones met the formal rubric requirements, which Evans believes is true. The deception relies on conversational implicature (implying overall adequacy). Therefore, **Case M is merely misleading**.
  3.  **Warranted Assertion (e.g., Lackey, Frankfurt):** This account focuses on whether the speaker presents their statement as adequately supported. Evans knows the bare rubric compliance is utterly inadequate as a basis for assessing teaching quality *in this context* (hiring decision). By asserting it as a relevant response to the Dean's query, Evans puts forward a claim she knows is **not warranted** for the purpose at hand. Therefore, **Case M is a lie**.
      *   *Verdict Summary:* Accounts 1 and 3 classify M as a lie; Account 2 classifies it as merely misleading. They do not all agree.

  ### Structural Feature Generating Extra Blame
  *   **Feature:** The speaker in M **exploits and weaponizes the institutional framework itself** (the formal rubric) as the mechanism for deception. The misleading utterance gains deceptive force *because* it cynically leverages the institution's own rules and the hearer's reasonable expectation that formal compliance signals substantive adequacy within that context.
  *   **Why Unavailable in L:** The liar in L cannot use this feature. Their lie ("unanimously recommends") is a direct fabrication *about* the institutional process, not a cynical manipulation *using* a genuine institutional element as camouflage. It doesn't parasitize the system's trust mechanisms; it directly violates them.
  *   **Defeating the On-Notice Rationale:** This feature defeats the rationale rather than sidestepping it. The rationale says the hearer is "on notice" with implicature because they know the speaker might be implying something not strictly asserted. However, in an institutional context like this, the hearer (Dean) is entitled to rely on the speaker (Evans) using institutional tools (like rubrics) *in good faith* and according to their intended purpose. When the speaker weaponizes the institution's own trusted framework (the rubric) to mislead, the hearer is *less* on notice than if faced with a naked assertion or a clumsy implicature. The deception is wrapped in the cloak of institutional legitimacy, undermining the hearer's ability to protect themselves precisely because the utterance *looks* like a trustworthy, formal, good-faith communication. The institutional context amplifies the deceptive force and reduces the hearer's reasonable suspicion.

  ### Defender's Strongest Reply
  A defender of the asymmetry could argue: "The Dean *should still be on notice*. Institutional contexts often involve careful parsing of formal language. The Dean knows rubrics list minimal requirements; interpreting 'satisfied formal requirements' as a *positive endorsement* of teaching quality is a leap. A prudent administrator would ask follow-up questions ('But how was the actual teaching?'). The speaker in M exploits the Dean's *unreasonable* assumption, not a reasonable reliance. The extra blame stems from the Dean's negligence, not a flaw in the 'on notice' rationale."

  **What Remains:** If we accept this reply and assume the Dean acted unreasonably by not probing further, the *structural* blameworthiness gap diminishes significantly. The cases become more symmetrical: both involve deception, but M relies on the hearer's unreasonable inference. The distinctive feature – weaponizing the institution to undermine the hearer's ability to be on notice – loses its force if the hearer's inference is deemed unreasonable from the start. The case then relies more on the reader's intuitive sense of insidiousness in M, potentially violating the requirement that the reversal comes from the structure and accounts applied.
