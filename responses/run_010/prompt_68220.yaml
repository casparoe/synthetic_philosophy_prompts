    1. **The Altruistic Risk Principle:** Acts that involve significant personal risk or sacrifice for the benefit of others, done voluntarily and beyond duty, are rewarded (firefighter, 15-year-old, kidney donor, foster mother, lunch donor).
    2. **The Rule-Breaking Principle:** Acts that involve breaking rules are not rewarded, regardless of outcome (paramedic).

  - The new case tests the intersection: an act that fits the altruistic risk principle but also involves rule-breaking.

  **Decision:**

