  - If we look at the firefighter and 15-year-old, both had rule-breaking? The firefighter might not have broken any rule (she was off-duty and could choose to help). The 15-year-old might have broken no rule (entering a storm drain? maybe trespassing, but not mentioned). So the rule-breaking in the line cook's case is an issue that wasn't present in those cases. The paramedic case is the only one where rule-breaking was explicit and led to denial.

  **Which Rule Are We Running?**

