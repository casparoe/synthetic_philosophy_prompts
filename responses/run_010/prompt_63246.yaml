  The user needs a step-by-step domination screen that's usable by their team, including non-philosophers. It must be in plain English and work in three directions: where the association holds power over residents, where contractors hold power over the association, and where funders/regulators hold power over residents through the association. They're concerned about circularity - any interference to reduce domination is itself an exercise of power, so it needs to be non-arbitrary. 

  The deliverables include applying this test to three real examples: their supported-housing license with two-week eviction notice and no external review, an outsourced repairs contract with a 15-day target and contractor-run complaints process, and their resident participation budget where residents deliberate but the association has final say. One of these should fail the test, and they want honesty about where the screen might misfire.

  I need to brainstorm what non-domination requires. The core idea is freedom from arbitrary power - power that's unchecked and doesn't track the interests of those affected. Key aspects include: absence of arbitrary power (power that isn't constrained by rules or oversight), tracking avowable interests (the interests people would acknowledge if not constrained), and robust non-arbitrariness (mechanisms that prevent domination).

  For the screen, I'll design a step-by-step procedure that asks specific questions, determines if answers are sufficient, flags issues for the board, and identifies value judgments. It must handle the circularity by distinguishing between arbitrary and non-arbitrary interference - interference is non-arbitrary if it's constrained by rules and tracks interests.

  The step-by-step screen will include: identifying power relationships, assessing arbitrariness (checks, balances, rules), and evaluating interest-tracking. Each step will have clear questions, sufficient answers, flagging mechanisms, and handling of value judgments.

  Applying this to their examples:
  1. Supported-housing license fails because eviction power is arbitrary with no oversight and doesn't track interests.
  2. Outsourced repairs contract fails because the complaints process lacks independence.
  3. Resident participation budget passes with minor tweaks since the association's override power is constrained.

  The screen misfires in several ways: it relies on identifying "avowable interests" which can be problematic if residents can't or won't express them, it might miss structural domination (like economic pressures), and it can't resolve conflicts between non-domination and non-interference. It's not just a politeness audit but has limitations in complex power dynamics and cultural contexts.

  I'll present this clearly, using plain English and focusing on practical application, while being honest about the tool's limitations. The user needs something actionable for their team to use on a busy Tuesday, not philosophical theory.
answer: |-
  Here's a practical **Domination Screen** based on republican non-domination principles, designed for your team. I’ve structured it as a step-by-step checklist, followed by analysis of your three cases, and a frank assessment of limitations.

  ---

  ### **Domination Screen: Step-by-Step Checklist**  
  *(For Contracts, Licences, or Services)*  
  **Core Principle:** Power is non-dominating only if it’s **non-arbitrary** – meaning it’s constrained by rules and processes that *track the interests* of those subject to it, and those subjects have *effective recourse* if it’s misused.  

  | Step | Question to Ask                                                                                                                                 | Sufficient Answer                                                                                                                              | Red Flag?                                                                 | Values vs. Facts?                                                               |
  | :--- | :---------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------ | :------------------------------------------------------------------------------ |
  | 1    | **Who HOLDS power over whom in this arrangement?** <br>(e.g., "We hold power over residents," "Contractor holds power over us," "Funder holds power over residents through us") | Clear identification of all parties with power to impose costs/restrictions on others (even if "lawful"). Must list all directions of power.    | ❌ **STOP** if power imbalance is hidden/denied.                           | Facts (identifying actors).                                                     |
  | 2    | **Is this power CHECKED?** <br>Does it require justification against objective criteria? Can the wielder act on a whim?                         | Power requires documented reasons (e.g., breach of contract, safety risk). Vague terms like "unsuitable behaviour" need clear definitions.      | ⚠️ **FLAG** if criteria are vague, subjective, or solely defined by the power-holder. | Facts (check for written criteria/protocols).                                   |
  | 3    | **Is this power CONTESTABLE?** <br>Can the subject challenge it fairly? Is recourse INDEPENDENT of the power-wielder?                            | Clear, accessible appeals process to a neutral party (e.g., Ombudsman, court, independent panel). Contractor complaints ≠ escalated internally. | ❌ **STOP** if no recourse, or recourse is controlled by the power-wielder. | Facts (check process exists + is independent).                                  |
  | 4    | **Does it track AVOWABLE INTERESTS?** <br>Does the power serve interests the subject *could reasonably acknowledge* if uncoerced? (e.g., safety, fairness, contractual performance) | Power must align with legitimate goals (e.g., "preventing harm," "enforcing agreed terms") – not convenience, profit, or unchallenged preference. | ⚠️ **FLAG** if interests are one-sided, trivial, or dismiss subject’s core needs. | **VALUES** (Requires judgment. Ask: "Would a reasonable person accept this justification?"). |
  | 5    | **Is the subject INSURED against vulnerability?** <br>Does the arrangement trap them? Can they exit/renegotiate without catastrophic cost?       | Reasonable alternatives exist (e.g., other housing providers, contractors). No exploitative lock-in (e.g., punitive exit fees, no alternatives). | ⚠️ **FLAG** if subjects are uniquely vulnerable/stuck (e.g., supported housing residents). | **VALUES** (Judgment call on vulnerability/alternatives).                       |

  #### **Decision Flow:**  
  - **❌ STOP:** If Steps 1, 2, or 3 fail. Power is *arbitrary* – renegotiate or abandon.  
  - **⚠️ FLAG:** If Steps 4 or 5 raise concerns. Board must review and justify overriding the risk.  
  - **✅ PROCEED:** Only if all steps pass or flagged risks are formally accepted by the Board with reasons.  

  #### **Handling Circularity ("Our Power Over Residents"):**  
  Our interference (e.g., eviction) is **non-arbitrary** if:  
  - It passes Steps 2–5 (checked, contestable, tracks interests, insures vulnerability).  
  - We act as **fiduciaries**, not owners. Power exists solely to serve resident interests *they avow* (security, dignity), not our convenience.  

  ---

  ### **Application to Your Cases**  
  **1. Supported-Housing Licence (Eviction Power)**  
  - **Step 1:** We hold power over residents.  
  - **Step 2:** ❌ **FAIL** - "Unsuitable behaviour" is undefined. No objective criteria.  
  - **Step 3:** ❌ **FAIL** - No external review. We are judge, jury, executioner.  
  - **Step 4:** ⚠️ Interests (safety) *could* be legitimate, but undefined power corrupts this.  
  - **Step 5:** ⚠️ Residents are highly vulnerable; alternatives scarce.  
  **Verdict:** ❌ **STOP.** Power is arbitrary domination. *Fix:* Define "unsuitable" narrowly (e.g., violence, criminal activity). Add independent review panel for eviction decisions.  

  **2. Outsourced Repairs Contract (15-day target + Complaints)**  
  - **Step 1:** Contractor holds power over us/residents (via service delays/poor quality).  
  - **Step 2:** ✅ Criteria exist (15-day target).  
  - **Step 3:** ❌ **FAIL** - Complaints escalated internally by contractor first. No true independence.  
  - **Step 4:** ✅ Interests (timely repairs) are legitimate.  
  - **Step 5:** ⚠️ Residents vulnerable to poor living conditions; we’re locked into contract.  
  **Verdict:** ❌ **STOP.** Recourse is illusory – contractor self-polices. *Fix:* Mandate independent adjudicator (e.g., Ombudsman) accessible after 1 complaint. Penalties for contractor non-compliance.  

  **3. Resident Participation Budget (Residents Deliberate, We Have Veto)**  
  - **Step 1:** We hold power over residents (can override their priorities).  
  - **Step 2:** ✅ Power checked (requires "written reason").  
  - **Step 3:** ⚠️ **FLAG** - Recourse? Residents can complain, but to whom? No formal appeals process.  
  - **Step 4:** ⚠️ **FLAG** - Does veto track *their* interests? Or ours? "Written reason" must reference *their* avowable interests (e.g., "This priority conflicts with legal safety obligations").  
  - **Step 5:** ✅ No forced vulnerability.  
  **Verdict:** ⚠️ **FLAG for Board Review.** *Fixable:* Add independent review for vetoes (e.g., resident panel or external auditor). Clarify veto must cite resident-avowed interests (safety, fairness), not budgets/policy preferences.  

  **Which Won’t You Like?**  
  **#2 (Repairs Contract)** fails decisively. You outsourced power without constraining it. Contractors love this – it’s cheap and shields them. But residents (and you) are dominated by their unfettered control over essential services.  

  ---

  ### **Where the Screen Misfires: A Frank Assessment**  
  1. **"Avowable Interests" is a Judgment Call:**  
     - Residents may not "avow" necessary interference (e.g., evicting an antisocial tenant protects neighbours). The screen flags this – but the Board must *own* overriding resident preferences for communal interests.  
     - **Risk:** Teams may default to "residents always know best," undermining safety/contracts.  

  2. **Silenced Interests:**  
     - Non-English speakers, cognitively impaired residents, or those fearing retaliation may not avow interests. The screen *can’t* detect this. **Mitigation:** Build advocacy/representation into all processes (e.g., mandatory support workers in eviction hearings).  

  3. **Non-Domination vs. Non-Interference Conflicts:**  
     - **Example:** Charging market rent reduces dependency (non-domination) but interferes with income (non-interference). Screen can’t resolve this. **Only the Board can weigh trade-offs**, using the screen to expose arbitrariness.  

  4. **"Proceduralism Trap":**  
     - A contract can pass the screen on paper (e.g., independent appeals) but fail in practice (e.g., complex forms deter complaints). **Audit real-world accessibility annually.**  

  5. **Structural Domination is Invisible:**  
     - The screen won’t flag underfunding forcing harsh policies (e.g., evicting vulnerable tenants to cut costs). **Only Board vigilance on resource pressures can address this.**  

  **Is it Just a Politeness Audit?**  
  **No.** Non-domination is substantive:  
  - It kills contracts where the powerful self-regulate (#2).  
  - It bans vague powers (#1).  
  - It forces vetoes to serve *residents* (#3).  
  But it **isn’t anarchic**: it allows forceful, interfering power – if checked, contestable, and interest-tracking. Your surveyor can use this on a Tuesday because it asks concrete questions about **clauses, processes, and alternatives** – not philosophy.  

  **Final Advice:**  
  - Train staff on the "why": *"We constrain power so no one is at another’s mercy."*  
  - Pilot the screen on 1-2 live contracts first.  
  - Require Board to document *why* they override flagged risks.  

  This screen won’t solve underfunding or human frailty – but it makes arbitrary power harder to hide. It forces you to choose: wield power responsibly, or don’t wield it at all.
