prompt: |-
  You are a specialist in early modern natural philosophy and its theological setting — someone equally at home in the General Scholium to the Principia, in the Queries to the Opticks, and in Newton's unpublished biblical and chronological manuscripts. Please think carefully before answering, and begin with a short brainstorming pass in which you list every distinct claim you can isolate in the extract below, without yet passing judgement on any of them.

  I am assembling a reading list for a graduate seminar on religion and the new science, and one candidate is a stylish and generally well-regarded popular history of science. Its chapter on Newton ends as follows, and I quote it at length because I need to know whether I can safely put it in front of students:

  "Newton was a devout but wildly unorthodox believer who wrote far more on theology and biblical chronology than on mathematics or natural philosophy. His anti-Trinitarianism had to be concealed: he had satisfied himself that the doctrine of the Trinity was smuggled into the Church in the fourth century by partisans who had also tampered with the scriptural passages appealed to in its defence, and he knew that saying so in public would have cost him his Cambridge chair and perhaps his liberty. Philosophically, his God was a clockmaker. Having wound up a universe governed by mathematical law, he left it to run by itself, which is why the General Scholium appended to the later editions of the Principia reads as a pious afterword bolted on to placate critics. Newton did allow, now and again, that God might have to step in to keep the planets from drifting out of their orbits; but this is a lapse into precisely the god-of-the-gaps reasoning he condemns elsewhere, and the correspondence with Clarke shows how embarrassed his defenders were by it. His eschatology was of a piece: he counted out the prophetic periods in Daniel and Revelation to fix a date for the end of the world, and he treated the Apocalypse as a coded timetable. It is hardly surprising that the Deists of the next generation claimed him as their own. Modern science, in short, was born inside a religious worldview that its greatest founder had already outgrown."

  My own hunch — which I may well be wrong about, so please say so if I am — is that the passage is more careful than it first appears, that the material on Newton's heterodoxy and his scriptural criticism is broadly sound, and that the trouble begins with the characterisation of his God. Please audit the paragraph claim by claim. For each, tell me whether a Newton scholar would accept it, regard it as a fair simplification, or reject it outright, and give me the reason rather than a bare verdict. I want particular attention paid to two things: whether the extract attributes to Newton positions that were in fact levelled at him by his opponents, and whether its vocabulary, theological and technical alike, is being used in its seventeenth-century sense or in a modern one. Then assess the final sentence on its own: does it survive once the earlier errors are corrected, or does it depend on them? I am not looking for references, footnotes, or a bibliography — simply your best considered judgement, and where you are genuinely unsure, please say that you are unsure. Kindly write your answer in British English.
