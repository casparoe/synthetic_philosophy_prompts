prompt: |-
  ok so my friend and I spent about three hours last night arguing about whether diseases and volcanoes and cold snaps count as historical actors, and I lost the thread somewhere around one in the morning and now I want to settle it properly before we go another round.

  setup: I'm building the first two sessions of a methods seminar for first-year history students and the whole unit is on non-human causes — plague, drought, soil exhaustion, the Tambora eruption, the crops and livestock that crossed the Atlantic, that sort of thing. His position is that all of this is causal wallpaper: if you say the climate caused the crisis of the seventeenth century you haven't explained anything, you've just waved at a background condition and given it a proper name. My position is that he's smuggling in a prejudice — that only human decisions count as causes — and that if a pathogen takes out a third of your taxpayers in four years, that thing is doing work no human agent did. Neither of us could say what would actually settle it, which is the annoying part.

  so what I want from you is the spec, not the argument. Write the requirements list: what a theory of non-human historical agency has to deliver to count as adequate, with the concrete case or consideration behind each requirement — real cases, not placeholders. The bar for adequacy, so you know what you're aiming at: a first-year student should be able to take the list to a case they've never seen (a flood, a locust swarm, a cooling century, an introduced tuber) and get a non-arbitrary answer about whether the non-human item is being treated as an actor or just as scenery.

  things I especially want covered:

  - the distinctions the theory must not collapse — background condition vs event, causing vs making-salient, causal efficacy vs agency, necessary vs sufficient, and whatever else you think is load-bearing in this area. say which of these are real distinctions and which are just habits of one camp.
  - the responsibility problem. if the drought or the bacterium is the actor, what happens to the human decisions that were sitting right next to it? a theory that lets me say a pathogen caused the famine, and thereby makes nobody answerable for the famine, has done something moral and not only causal, and I want that as an explicit requirement with a case attached.
  - the determinism trap specifically: which requirement or requirements separate taking climate seriously from ending up at the environment made these people do it. note where the line is genuinely hard to draw rather than pretending it's clean.
  - the scale mismatch: processes that run over centuries vs decisions made on a Tuesday afternoon, and what a theory owes us about how those get linked without one swallowing the other.

  mark each requirement as non-negotiable or as a preference of a particular camp, and then tell me which single one does the most damage to the most popular approaches — that's the one my students will trip over.

  and the part I most want: is any subset of the list jointly unsatisfiable? I have a suspicion that (a) non-human factors must be genuine causes in their own right and not merely enabling conditions, (b) human agency stays explanatorily primary, and (c) no functional or teleological talk about what the climate "needed" or "selected for" — that those three can't all hold at once. if you think that's right, say which one to give up and what the theory looks like afterwards, because if it is right then my friend wins by default and I'd rather know now.

  short scorecard at the end is fine, one or two lines each, on the main camps against the list — the environmental historians, the climate-history crowd, the big-history people, and the collapse-and-catastrophe storytellers. but keep the weight on the criteria, the scoring is the easy bit. no reading list and no citations, please, I'll find the texts myself; I want the conceptual machinery. somewhere around a thousand words.
reasoning: |-
  Okay, the user is building a history methods seminar and needs a framework to evaluate whether non-human elements like diseases or climate can be considered historical actors. They had a heated debate with a friend about this and want clear criteria for their students. 

  First, I need to unpack their core request: they want a spec - not arguments, but measurable requirements for what makes non-human factors "actors" versus background conditions. The key tensions they highlighted are: causal efficacy vs agency, moral responsibility implications, avoiding determinism, and reconciling different time scales. 

  Hmm... the tricky part is their suspicion that three things might be incompatible: (1) non-human factors as genuine causes, (2) preserving human agency's primacy, and (3) banning teleological language. That's the philosophical knot to untangle. 

  For the requirements list, I should start with foundational distinctions: 
  - Background conditions vs events (like the difference between gradual soil exhaustion and the 1815 Tambora eruption) 
  - Causal efficacy (objectively altering outcomes) vs agency (implying intention, which they rightly want to avoid)
  - Necessary vs sufficient causes (the plague enabling a crisis vs directly causing it)

  The moral responsibility angle needs careful handling - maybe distinguish causal contribution from accountability. Like the Irish Potato Famine: the blight caused crop failure, but British policy decisions determined starvation. 

  Scale mismatch requires special attention. How to connect volcanic eruptions (instant) to climate impacts (decades) without erasing human adaptation periods. Probably need a requirement about temporal articulation. 

  For their incompatibility suspicion... they're right. Insisting on (1) and (2) while banning (3) creates tension. The solution might be sacrificing "explanatory primacy" of humans - not eliminating human agency, but making it part of an interactive system. Like showing how the Little Ice Age constrained agricultural choices rather than dictated them. 

  Popular approaches will stumble hardest on Requirement 5 (no teleology) - big history narratives often imply ecosystems "select" for traits. Environmental historians handle scale best but sometimes downplay individual actions. Collapse storytellers tend toward determinism. 

  The spec should have about 8 requirements with concrete cases attached, marked non-negotiable vs debatable. Requirement 4 (intention-free agency) is probably the most contentious but necessary anchor. 

  ...better include a note that their "give up explanatory primacy" doesn't mean humans become puppets - just that agency becomes relational. That should soften the blow if their suspicion proves correct.
answer: |-
  Here’s a requirements list for a theory of non-human historical agency, designed for clarity and classroom application. Criteria are built from concrete cases, with distinctions flagged, traps identified, and incompatibilities tested.

  ---

  ### **Core Requirements for a Theory of Non-Historical Agency**  
  *(Non-negotiable = **NN**; Camp-specific preference = **CSP**)*  

  1. **Distinguish *causal efficacy* from *agency* (NN)**  
     - **Case**: The *Yersinia pestis* bacterium (Black Death) killed 30-60% of Europe’s population → **causally efficacious**.  
     - **But**: It lacks *intentionality* or *goal-directed behavior*.  
     - **Requirement**: The theory must explain causal impact without anthropomorphizing (no "the plague targeted kings").  
     - **Trap**: Calling volcanoes "actors" risks implying purpose. **Solution**: Reserve "agency" for entities with responsive behavior (e.g., invasive species adapting).  

  2. **Separate *event* from *background condition* (NN)**  
     - **Case**: The 1815 Tambora eruption (event) → global "Year Without a Summer" (immediate cause of crop failures).  
     - **Vs.**: Medieval Warm Period (300-year backdrop enabling Viking expansion) → **background condition**.  
     - **Requirement**: An "actor" must produce *discrete, traceable interventions* in human timelines (e.g., Tambora’s 1-year climate shock vs. gradual soil exhaustion).  

  3. **Clarify *making-salient* vs. *causing* (NN)**  
     - **Case**: The Dust Bowl (1930s) *made salient* poor U.S. land management policies → but drought *caused* crop failures.  
     - **Requirement**: The theory must show *how* the non-human factor *actively alters possibilities* (e.g., drought destroyed topsoil → forced migration), not merely exposes preexisting flaws.  

  4. **Resolve *responsibility* without erasing causality (NN)**  
     - **Case**: The Irish Potato Famine (1845–52): *Phytophthora infestans* (cause) + British laissez-faire policies (human choice) → mass starvation.  
     - **Requirement**: Assign causal weight to the pathogen (it destroyed crops) **but** preserve accountability for human actors (exports continued).  
     - **Trap**: "The blight caused famine" ≠ "Britain bears no blame." **Solution**: Show *interaction*: non-human factors create crises; humans dictate outcomes.  

  5. **Avoid *teleology* and *determinism* (NN)**  
     - **Case**: "The Little Ice Age (1300-1850) *caused* the Thirty Years’ War" → **overdetermined**.  
     - **Requirement**: Non-human factors *constrain* or *enable* choices (e.g., cooling reduced harvests → pressured states to compete for resources), but human decisions mediate outcomes.  
     - **Hard Line**: When human cultures *systematically reinterpret* environmental pressures (e.g., Inca adapting to Andes’ verticality vs. Wari collapse).  

  6. **Articulate *scale-mismatch* (NN)**  
     - **Case**: Introduction of the potato to Europe (c. 1570) → slow-motion population boom over 200 years.  
     - **Requirement**: The theory must link long-term non-human processes (e.g., soil fertility from tubers) to specific human decisions (e.g., Prussian state mandating potato farming). **Tool**: Show *iterative feedback loops* (e.g., better nutrition → higher birth rates → land pressure).  

  7. **Define *necessary vs. sufficient* causes (CSP: Materialist historians)**  
     - **Case**: Mississippi River floods (1927) → *necessary* for federal levee policy overhaul, but *insufficient* without Black labor exploitation.  
     - **Requirement**: Specify when non-human factors are prerequisites (e.g., floods) vs. decisive triggers (e.g., a dam collapse).  

  8. **Require *counterfactual robustness* (CSP: Critical realists)**  
     - **Case**: Without the Columbian Exchange’s maize/sweet potato, could China’s Ming Dynasty have sustained 1600s population growth?  
     - **Requirement**: A non-human "actor" must plausibly change outcomes in alternative scenarios (e.g., no New World crops → lower Asian carrying capacity).  

  ---

  ### **The Incompatibility Problem**  
  Your suspicion is correct: **a + b + c are jointly unsatisfiable**.  
  - **(a)** Non-human factors as genuine causes (e.g., Tambora’s eruption *caused* global famine)  
  - **(b)** Human agency as explanatorily primary (e.g., "But British policy *decided* who starved in India")  
  - **(c)** No teleology (e.g., rejecting "the climate *selected for* resilient societies")  
    
  **Solution**: Surrender **(b)** *explanatory primacy of humans*.  
  **New Model**: Treat history as *symmetrical assemblages* (Latour) where humans/non-humans co-produce outcomes.  
  - **Example**: The 17th-century General Crisis → *Interaction* of volcanic winters, grain riots, *and* state tax demands. No "primary" cause; all are actants in a network.  

  ---

  ### **Scorecard of Historical Camps**  
  1. **Environmental Historians** (Crosby, McNeill): Excel at Requirement 1, 3, 6. Struggle with 4 (responsibility often downplayed).  
  2. **Climate-History Crowd** (Parker, Brooke): Strong on 2, 5, 8. Risk Requirement 5 (slipping into climate determinism).  
  3. **Big History** (Christian, Spier): Prioritize 6, 8. Violate Requirement 1 (often anthropomorphize ecosystems).  
  4. **Collapse Storytellers** (Diamond, Tainter): Fixate on Requirement 2, 5. Fail Requirement 4 (humans become passive victims).  

  ---

  ### **Critical Tripwire for Students**  
  **Requirement 4 (Responsibility)** will trip most approaches. Example:  
  - *Case*: "Malaria in colonial Africa *caused* labor shortages."  
  - **Trap**: Ignoring that *drainage policies* (human choice) allowed mosquito breeding.  
  - **Test**: Can the student identify *both* the pathogen’s causal power *and* the human decisions that amplified/dampened its effects?  

  **Toolkit Takeaway**: Non-human factors are *actors* when they:  
  ① Force *unplanned* adaptations (e.g., Laki fissure eruption → 1783 famine → French Revolution priming),  
  ② Operate at *temporally legible* scales (event > background),  
  ③ Are *irreducible* to enabling conditions (e.g., Smallpox in the Americas ≠ "just" a backdrop).  

  This framework avoids arbitrariness by demanding *empirical traceability*: "Show me *how* the locust swarm changed policy decisions in real time."
