prompt: |-
  I am preparing a handout for a graduate seminar on knowledge and practical reason, and my supervisor has just sent it back with a criticism I cannot answer. Her point is that the standard teaching cases do not discriminate between the two views I am trying to contrast: in the familiar example where a couple decide not to deposit their paycheques on a Friday because the queues will be intolerable on Saturday, the practical pressure rises for everybody in the conversation at once, so the contextualist and the pragmatist about knowledge predict exactly the same shift in the students' verdicts, and the seminar ends with the suspicion that the dispute is notational. I want a case that pulls the two apart, and I want it built to a specification rather than dredged up from the literature. Please treat the following as a design brief, and note that stipulating the verdicts instead of generating them from the two views as they are independently formulated would count as a failure of the exercise, however natural it feels to write.

  The scenario should be a single realistic paragraph set in an ordinary institutional or domestic world — a hospital corridor, an engineering firm, a household, a school — with no lotteries, no counterfeit barns, no deceiving demons, no sceptical hypotheses and no uncannily accurate predictors. Spell out the subject's total evidence explicitly, because it has to be held fixed across every version of the case; the only thing that may vary between versions is the practical situation, and that variation must not change the likelihood of the proposition's being false, nor supply the subject with any new information. Make the stakes asymmetric in the direction that is hard to construct: the cost of error falls on the subject, who must act, while the knowledge attribution I want judged is made by a third party who has nothing whatsoever riding on the matter and who is nonetheless fully aware that the subject has a great deal riding on it. Because contextualism is sensitive to precisely these details, stipulate the attributor's conversational context at length — who is speaking, to whom, for what purpose, what has been mentioned and what conspicuously has not — and ensure that no possibility of error is made salient anywhere in that conversation. Also ensure that the subject is not ruminating, not taking legal advice, not revisiting her evidence and not losing confidence: her situation is costly, but her own state of mind is steady, so that nobody can dissolve the case by saying she has raised the standards for herself. Then supply a control version: the same evidence, the same attributor and the same conversational context, with the sole difference that the cost of being wrong falls on somebody other than the subject, who is now a bystander with nothing at stake. Neither view should predict any shift between the main case and the control, and I want that stated plainly, since a design that cannot say what its own control is for is not a design.

  After the scenarios, walk through the reasoning in full: what pragmatic encroachment says about the main case and by which route it gets there, whether that route runs through the link between knowledge and rational action or through a threshold for justification that moves with cost; what contextualism says about the truth of the third party's attribution in the stipulated context; and at exactly which sentence the two verdicts part company. Tell me what the subject herself should say when asked whether she knows, and whether the two views give different advice about the action she faces — if they agree about everything the subject and the attributor should do and should assert, I want to know that the divergence in my case is only apparent. Close with an honest assessment: identify the single feature doing the work, say what happens to the verdicts if it is removed, and give the strongest attack a committed contextualist would mount on the construction, for instance that the stipulated low-stakes context is unstable once the subject's predicament is common knowledge between speaker and hearer, or that no reader can survey the case without occupying a raised-standards context of her own. Say too whether the intuition the case elicits is really about knowledge or about the propriety of flat-out assertion. My students have met the classic bank and airport examples but none of the technical literature, so please do not cite papers or point them at a reading list; write it as continuous prose, the way one would write a letter or a long email, with no headings, no bullet points, no bold text and no tables, and in British English.
reasoning: |-
  Hmm, the user is preparing a handout for a graduate seminar on knowledge and practical reason and needs help designing a case study that distinguishes between contextualism and pragmatic encroachment theories. Their supervisor criticized their current material for not properly differentiating these views, particularly because classic examples like the bank case don't create divergence in predictions. 

  The user has provided an extremely detailed design brief. They want a realistic scenario in an ordinary setting (hospital, school, etc.) with explicit evidence that remains fixed. The key requirements are: asymmetric stakes where the cost of error falls on the subject who must act, while a detached third party attributes knowledge; a carefully controlled conversational context where no error possibilities are salient; and a control version where stakes shift to someone else while the subject remains unaffected. The subject's mental state must remain steady throughout. 

  I need to construct a scenario that meets all these specifications while genuinely creating different predictions between contextualism and pragmatic encroachment. The hospital medication scenario comes to mind - with a nurse preparing a critical dose where the stakes are high for the patient but the attributor (a colleague making routine documentation) has nothing at stake. The evidence (training, protocol, recent experience) must be held constant, and I'll need a low-stakes control where the same medication is for a less critical condition.

  For the analysis: Pragmatic encroachment should deny knowledge in the high-stakes case due to the actionability threshold rising with stakes, while contextualism should maintain knowledge attribution remains true because the attributor's context hasn't shifted. The divergence becomes clearest when examining what the third party can truthfully say. The subject herself would likely deny knowledge in the high-stakes situation, showing how the views differ on first-person attribution versus third-party assessment.

  The critical feature is creating a "conversational insulation" between the subject's high-stakes situation and the attributor's detached context. If this insulation breaks down (if the attributor starts considering the patient's risks), contextualism would likely shift and the views might converge again. The strongest contextualist counterargument would be that merely mentioning high stakes inevitably raises standards in any context - which I'll need to address by carefully constructing the dialogue to keep error possibilities irrelevant.

  I'll present this in continuous British English prose without academic formatting, as requested. The case should feel organic while rigorously meeting all technical requirements - particularly ensuring neither theory predicts changes in the control scenario. The conclusion will honestly assess whether the intuition is really about knowledge or about assertion propriety, and acknowledge if the case still has limitations despite the design.
answer: |-
  Right, let's tackle this design challenge. The frustration with the bank case is classic – when the practical pressure hits everyone in the conversation simultaneously, it's impossible to tell if the *truth conditions* for 'knows' shifted (contextualism) or if the *facts about the subject's epistemic position* changed relative to the stakes (pragmatic encroachment). We need insulation: a high-stakes situation for the subject *acting*, observed by a detached attributor whose conversational context remains resolutely low-stakes. Here’s the scenario, built to your specifications.

  **The Scenario: The Critical Dose**

  **Setting:** A busy regional hospital pharmacy, mid-afternoon. Staff are preparing medication trays for the wards.

  **Characters:**
  *   **Lena:** A highly experienced, senior pharmacy technician. She is meticulous and currently preparing a complex intravenous (IV) antibiotic dose for a critically ill patient in the High Dependency Unit (HDU). The patient has a severe, resistant infection, and this specific antibiotic, at this precise dose and concentration, is vital. Administering the wrong concentration could cause serious harm or death. Lena *must* get it right; the stakes for the patient (and thus her professional responsibility) are extremely high. She is concentrating but calm; she’s done this hundreds of times.
  *   **Ben:** Another pharmacy technician, working nearby, preparing routine oral medication packs for the general wards. He’s competent but less senior than Lena.
  *   **Dr Aris:** A junior doctor popping into the pharmacy briefly to check on a different medication order. He’s not involved in Lena’s task or the HDU patient’s care.

  **Evidence (Held Fixed):** Lena is preparing Amikacin. She has:
  1.  The printed prescription from the HDU consultant, clearly stating the patient's name, ID, drug, dose (1g), dilution volume (100ml saline), and infusion rate.
  2.  Confirmed the prescription against the hospital’s electronic prescribing system on her screen – it matches exactly.
  3.  Physically checked the stock vial of Amikacin powder: it is the correct strength (500mg/vial), within expiry, and the packaging is intact and standard.
  4.  Calculated that she needs two vials (2 x 500mg = 1000mg = 1g). She performed this calculation mentally (a simple doubling) and verified it instantly against a mental checklist for this common drug.
  5.  Reconstituted the powder with sterile water from a new, sealed vial according to the standard protocol she’s followed without error for years.
  6.  Just yesterday, she prepared an identical dose using identical steps from an identical batch of vials for a different patient without issue.
  Lena has no reason to doubt the prescription, the stock, her calculation, her reconstitution technique, or the system. Her evidence strongly supports the proposition **P: "This prepared syringe contains precisely 1g of Amikacin in 100ml saline."** The likelihood of P being false (e.g., wrong drug, wrong strength vial, calculation error, contamination) is very low given her evidence and track record.

  **The Action & High Stakes:** Lena is about to draw the reconstituted solution from the two vials into the final 100ml saline bag for the HDU nurse to collect. If P is false and the dose is wrong (especially too high), the consequences for the fragile patient could be catastrophic. Lena *must* act (prepare the final bag) based on her belief in P.

  **The Attribution Context (Low-Stakes Conversation):** As Lena finishes reconstituting, Ben glances over. Dr Aris, waiting near Ben for his own query, also notices Lena working. Ben remarks casually to Dr Aris, partly to fill the silence, partly out of professional interest: "Lena’s always so quick with those complex IVs. She really knows her stuff." Dr Aris, having no clinical involvement with the HDU patient and only a passing interest in pharmacy workflows, nods and replies matter-of-factly, without any hint of concern or interrogation: "Yeah, she definitely knows that’s the correct dose and concentration for this one. Seen her do it perfectly loads of times." Their conversation is purely observational commentary about Lena’s competence and routine. No one mentions the HDU, the patient’s critical state, potential errors, risks, or consequences. The possibility of error is utterly irrelevant to their brief exchange; they are discussing Lena’s reliable performance of a standardised task. Dr Aris has *nothing* riding on whether Lena knows P or not; his statement is a casual assessment of her evident skill.

  **Subject's Steady State:** Lena is focused but entirely confident. She feels the weight of responsibility for the patient but this manifests as careful attention, not doubt. She hasn’t re-checked her steps beyond her initial meticulous process (which is her normal mode), isn't seeking a second opinion, and her confidence in P remains high and unwavering. The high stakes affect *what she must do if P is true*, not her assessment of P’s likelihood.

  **The Control Version:** Identical in every respect *except* the stakes of being wrong. Lena is preparing the *same* Amikacin 1g dose (same evidence, same steps) but this time for a patient on a general surgical ward. The patient has a straightforward, non-life-threatening infection being treated prophylactically. The antibiotic is important, but an error in concentration (within plausible bounds) would likely cause minimal harm – perhaps some temporary discomfort or a slightly delayed recovery, easily correctable. The stakes for the patient (and thus Lena’s responsibility) are *significantly lower*, though still requiring professional care. Crucially, the *conversational context* is identical: Ben and Dr Aris have the same brief, low-stakes exchange ("She definitely knows that’s the correct dose..."). The subject (Lena) is again steady and confident.

  **The Crucial Point:** Neither contextualism nor pragmatic encroachment predicts a shift in the truth of Dr Aris's knowledge attribution ("She definitely knows that’s the correct dose...") *between the main case and the control*. The attributor's context (Dr Aris and Ben) is stipulated to be identical and low-stakes in both scenarios. The subject's evidence is identical. The only difference is who bears the cost of error (the critical HDU patient vs. the stable surgical patient) and thus the practical pressure *on Lena to act correctly*. But this pressure does not alter Lena's evidence or the attributors' conversational standards.

  **Walking Through the Reasoning**

  1.  **Pragmatic Encroachment (PE - Knowledge-Action Link):**
      *   **Main Case (High Stakes for Subject):** PE holds that whether a true belief counts as knowledge depends partly on the practical stakes facing the subject *in acting* on that belief. For Lena to act rationally in drawing up the dose for the critical HDU patient – an action with potentially disastrous consequences if P is false – PE argues she needs an exceptionally *strong* epistemic position. Merely having evidence that makes P *very probable* might not suffice for *knowledge* in this high-stakes context. The cost of being wrong is so high that the threshold for justification (and thus knowledge) is raised. Given the catastrophic potential, and acknowledging the *logical possibility* of error (however remote given her evidence), PE would likely say Lena *does not know* P in the main case. Her epistemic position, while strong, isn't *strong enough* to meet the heightened demands for rational action when the stakes are this severe. Therefore, Dr Aris's attribution ("She definitely knows...") is *false*.
      *   **Control (Low Stakes for Subject):** The stakes for Lena acting on P are now much lower. An error would be regrettable but not catastrophic. The threshold for justification/knowledge required for rational action is correspondingly lower. Lena's identical evidence *does* meet this lower threshold. Therefore, PE says Lena *does* know P in the control. Dr Aris's identical attribution is *true*.

  2.  **Contextualism (C):**
      *   **Main Case & Control:** Contextualism argues that the truth conditions of 'knows' are set by the conversational context of the *attributor* (Dr Aris and Ben), not the subject (Lena). We have stipulated that this context is *low stakes*: the conversation is casual, observational, about Lena's routine competence; no error possibilities are mentioned or relevant; Dr Aris has nothing personally at stake. In this conversational context, the standards for what counts as "knowing" P remain relatively low. Lena's evidence – her training, the clear prescription, the verified stock, the simple correct calculation performed, her flawless track record – is *more than sufficient* to meet these low conversational standards for attributing knowledge. Therefore, Contextualism says Dr Aris's statement ("She definitely knows...") is *true* in both the main case *and* the control. The variation in Lena's practical situation has no bearing on the truth of the attribution made within the *attributors'* insulated low-stakes context. The subject's high stakes do not percolate into the attributor's conversational score.

  **Where They Part Company:** The divergence occurs precisely at the evaluation of **Dr Aris's utterance in the main case**. Pragmatic Encroachment says it is *false* (Lena doesn't know, due to her high-stakes situation). Contextualism says it is *true* (the attributors' low-stakes context sets the standard, which Lena easily meets).

  **What Lena Should Say:** If asked "Do you know this is the correct dose?" just before drawing up the solution:
  *   In the **Main Case (High Stakes):** Lena, feeling the immense responsibility, would likely hesitate to say "Yes, I know." She might say "I'm absolutely confident it's correct based on everything I've checked," or "I've followed protocol perfectly," or even express a qualified "Yes, but I always double-check everything for critical meds like this." She would be very reluctant to offer a flat-out, unqualified "I know," precisely *because* of the stakes, even while feeling internally confident. PE explains this reluctance: she genuinely lacks *knowledge* relative to the stakes. Contextualism would explain it as a warranted caution about *asserting* knowledge in a high-stakes context *for her*, even if the proposition is true.
  *   In the **Control (Low Stakes):** Lena would likely say "Yes, I know" or "Of course I know" without hesitation. Both views agree she knows here, so her assertion aligns with both.

  **Action Advice:** Both views would agree Lena *should* proceed to prepare the dose in both cases. PE: In the main case, she lacks knowledge but her evidence still makes acting on P the overwhelmingly rational choice given the dire consequences of *not* treating the infection. In the control, she knows and rationally acts. Contextualism: She knows in both (relative to her context or in the low-stakes attributor context), so acting is rational. The divergence is *only* in the third-party knowledge attribution in the main case; they converge on the rational action Lena should take and on Lena's own likely assertion behaviour.

  **Honest Assessment**

  *   **The Single Feature:** The work is done by the **insulation of the attributor's conversational context** from the subject's practical predicament. The attributor (Dr Aris) is aware *that* the subject (Lena) faces high stakes (he sees the HDU label, knows what Amikacin implies), but this awareness is kept *conversationally inert* – it doesn't become relevant to the topic of their exchange, doesn't raise error possibilities, and doesn't shift the standards for 'knows' in *their* dialogue. If this insulation breaks – if Dr Aris or Ben *mentioned* the critical patient or potential risks – the contextualist would likely agree the standards rise, collapsing the distinction. The case depends entirely on maintaining that strict separation within the attribution context.
  *   **Removing the Feature:** If the insulation is removed (e.g., Ben says "Blimey, for the HDU? Hope she's sure!"), Contextualism predicts Dr Aris's attribution would become false (or highly dubious) in the main case, aligning it with PE's verdict. The distinction vanishes.
  *   **Strongest Contextualist Attack:** A committed contextualist would argue that the stipulated low-stakes context is **unstable or impossible** once the subject's high-stakes predicament is common knowledge between speaker and hearer. Merely being aware of the high stakes, they might contend, *automatically* makes salient the possibility of costly error and raises the epistemic standards operative in *any* conversation involving knowledge attributions about that proposition, even if no one explicitly mentions the risks. They might say that Dr Aris *shouldn't* truly claim "She definitely knows" in such a situation without qualification because the shared awareness of high stakes *has already* raised the context's standards, making Lena's evidence insufficient. They might accuse the case of artificially suppressing a natural conversational dynamic.
  *   **Intuition Target:** The intuition elicited (whether Dr Aris spoke truly in the main case) feels like it's genuinely about *knowledge*, not just assertion. The question isn't primarily whether Dr Aris *should* have said it (though that might arise), but whether what he *did* say was *true*. Does Lena possess the factive mental state *knowledge* (PE: no, due to stakes; C: yes, relative to context)? The assertion propriety follows *from* the knowledge status in both views within a given context.

  This case is fragile – it relies on meticulously controlling the attributor's conversational focus. It might not convince a die-hard contextualist who believes high stakes inherently raise the salience of error. But it does create a scenario where the two theories genuinely predict different truth values for the very same knowledge attribution uttered in the very same words, within the same physical setting, solely because of the practical situation of the *subject*, while holding the attributor's context fixed and insulated. That’s the pull-apart you needed.
