  A. I accept the trade because we both get something we want, and overall the school gains.
  B. I reject the trade because the value of the art and the science lab are of different kinds and cannot be compared; it's not right to trade one for the other.

  This question gets at whether the goods (art vs. science) can be weighed on a single scale. Option A suggests they can be traded off (common scale), Option B suggests they are incommensurable.

