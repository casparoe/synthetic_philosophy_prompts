  2. **Authorship**: If you pay or arrange for someone else to do something you think is wrong, are you morally responsible as if you did it yourself (authorship) or just causally responsible (only answerable for outcomes)?
  3. **Standing**: In a trade that affects a being that cannot consent (like an animal or future generation), is the trade invalid unless a proper representative (like a guardian) is involved?
