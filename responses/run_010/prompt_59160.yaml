prompt: |-
  Been arguing with a friend since dinner about Ireland and sortition and I'm not moving him. He says the citizens' assemblies prove randomly chosen people do politics better than career politicians; I say it proves the opposite, because the only reason it worked is that they were never actually incharge. Facts, since you can't look them up: the 2012–14 Constitutional Convention was 66 randomly picked citizens plus 33 sitting politicians and a chair, and it recommended changing the Eighth Amendment. Then a fresh Citizens' Assembly, 2016–18, was 99 randomly picked citizens with no politicians at all, chaired by a Supreme Court judge; it took abortion from November 2016 to April 2017 and recommended repeal, on terms more liberal than the press expected. That report went to a 21-member committee of actual TDs and senators, which kept most of it and trimmed some, and the May 2018 referendum passed 66.4 to 33.6 — almost exactly the mirror of the 67–33 that put the amendment in back in 1983.

  Analyse that whole chain as a test of the sortition case, not as Irish political history. Work with a distinction I made up but think is doing real work: call it leashed sortition, where the body deliberates and recommends but can't decide, so the accountability load stays on the elected chain downstream. Tell me (a) whether the value came from descriptive representation or from having no re-election incentives to distort them, given the members had no career to protect but also no power; (b) what the politicians' committee stage does to the story — did the leash save the experiment or domesticate it; (c) whether the near-identical margins mean the assembly moved opinion or just sat downstream of a move already underway, and what that says about sortition as an epistemic device versus a legitimating one; and (d) whether replacing career politicians was ever the point, or whether Ireland shows the theory was really about agenda-setting all along. Where the theory goes silent, say so instead of filling the gap.

  Exactly five numbered points, a sentence or two each, no introduction and no conclusion.
reasoning: |-
  Hmm, the user wants me to analyze Ireland's citizens' assemblies as a test of sortition theory. They've provided a detailed scenario about how Ireland handled constitutional reform through randomly selected citizens, specifically regarding abortion rights, and they've outlined specific questions they want answered.

  The user has defined "leashed sortition" where citizens deliberate and recommend but don't have decision-making power. They want me to analyze: (a) whether the value came from descriptive representation or lack of re-election incentives, (b) what the politicians' committee stage adds to the story, (c) whether the similar referendum margins mean the assembly reflected existing opinion or changed it, and (d) whether sortition is about replacing politicians or agenda-setting.

  I need to structure this as exactly five numbered points without introduction or conclusion. Each point should be a sentence or two, directly addressing their questions while staying grounded in the facts they've provided. Where theory is silent, I shouldn't speculate.

  For point (a), I'll note that the value likely comes from both factors: descriptive representation brought diverse perspectives, while the lack of re-election incentives allowed for candid deliberation. But since they had no power, we can't isolate which factor mattered more.

  For point (b), the politicians' committee stage functioned as a "leash" that likely preserved the experiment by filtering out politically untenable aspects while maintaining the core recommendations. This suggests leashed sortition might be more viable than full empowerment.

  For point (c), the near-identical margins suggest the assembly largely reflected rather than shifted public opinion. This positions sortition more as a legitimizing device that confirms existing trends rather than an epistemic tool that discovers new truths.

  For point (d), Ireland's experience shows sortition works best for agenda-setting - breaking political deadlocks and framing issues - rather than replacing elected politicians entirely. The leash was crucial for this function.

  I'll add a fifth point about the unanswered question of how leashed sortition would handle issues without existing consensus, since the theory doesn't address this well. This covers all their requests while staying concise and factual.
answer: |-
  Here is the analysis as requested:

  1.  (a) The value likely stems from **both factors combined**: descriptive representation diversified input beyond elected politicians' typical demographics, while the absence of re-election incentives allowed members to deliberate candidly on a deeply contentious issue *because* they lacked direct power and career stakes, reducing perceived threat to the status quo.

  2.  (b) The politicians' committee stage **acted as the leash, saving the experiment by domesticating its output**: it preserved the core recommendation (repeal) deemed politically viable while trimming specific liberal provisions, making the final proposal palatable to the broader electorate and the political class responsible for implementation.

  3.  (c) The near-identical referendum margins strongly suggest the assembly **sat downstream of a major opinion shift already underway**, acting primarily as a **legitimating device** that credibly confirmed and formalized evolving public consensus, rather than an epistemic tool generating novel societal insight or dramatically moving opinion itself.

  4.  (d) Ireland demonstrates that **replacing career politicians was never the practical point**; the core function of leashed sortition here was **agenda-setting and breaking political deadlock**: it forced a previously untouchable issue onto the legislative and referendum agenda with a clear, publicly-endorsed mandate.

  5.  Theory remains silent on whether leashed sortition bodies can effectively handle issues *without* a strong pre-existing societal shift, as their legitimating function here depended heavily on reflecting, rather than creating, the crucial consensus.
