prompt: |-
  I'm preparing a seminar presentation on Ruth Millikan's *Biosemantics* for a naturalizing-content course, but the opening passages are proving difficult to parse — the argument moves quickly and my reading group members all interpreted the same section differently. I'll paraphrase the key argument rather than quote it directly, and I'm hoping you can help me clarify what she's actually claiming and where I might be going wrong. The passage defines *proper function* through selection history, then distinguishes two ways one thing explains another's existence: causally (like a hand causing a chair to exist) or through a pattern or formula that governs reproduction (like a design that's been copied repeatedly because it works). For artifacts like can openers, the explanation runs through a pattern that persists because items made according to it reliably perform their function; for biological traits like hearts, the explanation involves ancestral items that performed the function successfully.

  Then Millikan introduces *Normal conditions* as an idealization — the circumstances under which ancestral items actually succeeded in performing their function, which explains why a trait is supposed to produce an effect even when it currently doesn't. The section concludes by extending this framework to representations: a representational device has a derived proper function to stand in a mapping relation to the world, and what it represents depends on what that mapping correlates with under Normal conditions.

  Now I'm working through a set of questions about how this account applies to artifacts versus biological traits. First, I need to clarify whether the can opener itself, the pattern, or both are the bearers of proper function in the artifact case, and what exactly gets selected for in each. Second, I'm trying to pin down whether Normal conditions are purely descriptive statistics, counterfactuals about ancestral items, or something normative — and whether a trait could have a proper function even if it never actually operates in Normal conditions during its lifetime.

  Third, I'm examining the distinction between causing something to exist and explaining its existence through reproduction according to a pattern, wondering if this is a genuine ontological difference or just emphasis, and whether there's a principled way to separate them without circularity. Fourth, I need to reconstruct how Millikan derives content from proper function — specifically whether content is determined by the correlation in Normal conditions or by what ancestors mapped onto, whether these come apart, and what she needs for false representations to be possible. Finally, I'm trying to understand the dialectical purpose of the can opener example beyond illustration — what work it does for someone skeptical that normative notions can be naturalized, and whether that skeptical reader should actually be convinced by it.

  I want close textual analysis that stays grounded in what the passage itself does, flagging where the text underdetermines the reading and where I might be projecting later developments backward, rather than reconstructing the overall view from familiarity with the broader debate. I should also mark which interpretive disagreements are substantive versus merely verbal.
