answer: |-
  Based on your close reading goals, here's a breakdown of Millikan's argument in the opening passages of *Biosemantics*, focusing on the text itself and your specific questions:

  **Core Argument Structure (as presented):**

  1.  **Proper Function Definition:** The proper function of X is the effect ancestral Xs produced that explains *why* X exists now (via selection history).
  2.  **Two Modes of "Explaining Existence":**
      *   **Causal (Hand → Chair):** One thing physically causes another's existence.
      *   **Pattern/Formula Reproduction (Design → Copies):** The existence of X is explained by it being a reproduction (copy, instance) of a pattern/formula F. F persists *because* items reproducing F have, historically, reliably performed a certain function G.
  3.  **Application:**
      *   **Artifacts (Can Opener):** The can opener's existence is explained by reproduction of a *pattern/formula* (the design/blueprint). This pattern persists *because* items made according to it *reliably perform the function* of opening cans. *The pattern/formula has the proper function.*
      *   **Biological Traits (Heart):** The heart's existence is explained by the *ancestral hearts themselves* performing their function (pumping blood) successfully enough to contribute to survival/reproduction. *The trait itself has the proper function.*
  4.  **Normal Conditions:** An idealization – the specific set of conditions (environmental, internal, interactive) under which ancestral items *actually succeeded* in performing their proper function. This explains *why* a trait *is supposed to* produce its effect even when it fails *now*: because it was *designed* (by selection) to work *under those (Normal) conditions*.
  5.  **Extension to Representations:** A representational device has a *derived* proper function: to stand in a specific mapping relation (e.g., correlation, isomorphism) to the world. What it represents is determined by *what that mapping correlates with/is isomorphic to **under Normal conditions***.

  **Addressing Your Specific Questions (Grounding in the Passage):**

  1.  **Bearer of Proper Function in Artifacts & Selection:**
      *   **Textual Focus:** The passage explicitly states: "**The pattern or formula** has a proper function." (Emphasis mine). It explains *why* the pattern persists: because items made to it reliably perform function G.
      *   **The Can Opener Itself:** While the individual can opener *has* a function (it's *supposed* to open cans), the passage assigns the *proper function* (defined via selection history) primarily to the *pattern/formula*. The individual opener's function is *derived* from the pattern's proper function. Its existence is explained *by* being a copy of that pattern.
      *   **What Gets Selected For:** The **pattern/formula** is what persists and is "selected for" (in the cultural/design evolution sense) *because* items instantiating it **reliably perform function G**. Selection acts *on the pattern's success rate* via the success of its instances. *The specific effect selected for is function G (e.g., opening cans).*

  2.  **Nature of Normal Conditions:**
      *   **Textual Definition:** "the conditions under which ancestral items... performed their functions." It's an "idealization" based on the *actual historical conditions* where ancestors *succeeded*.
      *   **Descriptive Statistics?** Partly, but it's *selective* statistics. It's the specific conjunction of conditions present *during historical successes*, abstracted into a type. It's not *all* conditions ever encountered, only the success-relevant ones.
      *   **Counterfactual?** Not primarily defined counterfactually *in this passage*. It's grounded in actual history: "under which ancestral items *actually* succeeded." Counterfactuals (e.g., *would* it have succeeded?) might be implied later but aren't the core definition here.
      *   **Normative?** **Crucially, YES, but naturalistically grounded.** This is the key move. "Normal" *means* the conditions that *explain the persistence* of the trait/pattern via past success. It defines what the trait/device *is supposed to* do ("supposed to" being normative) *because* that's what its ancestors *did* under *those* conditions to get selected. The normativity ("should") arises *from* the historical facts of selection and success.
      *   **Function Without Ever Operating Normally?** **Textually, YES.** The passage defines the proper function *historically* (what ancestors *did* that caused selection). A *current* trait can have a proper function (e.g., pumping blood) even if it *never* encounters Normal conditions in its lifetime (e.g., a defective heart in a vat, or a can opener in a world without cans). Its *purpose* is defined by its history, not its current efficacy. Millikan explicitly needs this for misrepresentation.

  3.  **Causing Existence vs. Explaining via Reproduction Pattern:**
      *   **Ontological Difference or Emphasis?** The passage presents it as a **principled distinction** in the *kind of explanation* offered for "why X exists." The chair's existence is explained by the *causal activity* of the carpenter. The can opener's existence is explained by it being a *token of a type* (the pattern) that persists *because of the function* its tokens perform.
      *   **Circularity?** **Potential Risk.** Defining the pattern's persistence *because* its tokens perform function G relies on the function G, which is defined via the pattern's proper function. However, Millikan grounds the artifact function *in the intentions of the producers* (implied by "copied repeatedly *because* it works" – implying the copiers *recognize* the function). The biological case breaks the circle via natural selection without intention. *The text itself doesn't fully resolve this circularity for artifacts here; it leans on the reader's understanding of intentional design.* This is a point where later developments (consumer functions, stabilizing functions) might be projected backward. The passage *assumes* the artifact case works intuitively based on design intentions.

  4.  **Deriving Content from Proper Function:**
      *   **Correlation Under Normal Conditions is Key:** The passage is explicit: The representational device has the derived proper function "to stand in a specific mapping relation to the world." "What the device represents depends on what that mapping correlates with **under Normal conditions**."
      *   **Ancestors vs. Normal Correlation:** This is critical. It is **NOT** simply what ancestors *actually* mapped onto. It's what the mapping *correlates with* **when the device operates as it was designed/selected to operate** (i.e., under Normal conditions). Ancestral tokens *succeeded* under Normal conditions *because* the mapping correlated with the world *in those conditions*. The Normal correlation is the *ideal, proper* mapping defined by the conditions that enabled past success.
      *   **Do They Come Apart? Yes, Enabling False Representation:** This is *precisely* how misrepresentation is possible. A current token might map/correlate with something different than what it maps/correlates with under Normal conditions (e.g., a bee dance caused by a stray gust of wind, not nectar location; a fuel gauge stuck on 'F' due to a faulty sensor). It fails *because* its current mapping doesn't align with the Normal mapping it was selected to produce. What it *represents* is defined by the Normal correlation, not the current or even past actual correlations of *all* tokens.
      *   **What Millikan Needs:** She needs the **Normal correlation** (the mapping relation under the ideal conditions of past success) to determine content. This allows a token to *fail* to correlate with what it *should* correlate with (under Normal conditions), thus being false.

  5.  **Dialectical Purpose of the Can Opener:**
      *   **Preempting the Skeptic:** The skeptic likely finds biological normativity ("supposed to") mysterious. The artifact example aims to show that **normative function ("proper function") is already present and intuitively understandable in a familiar, non-biological domain** (human-made tools). We readily say a can opener is "supposed to" open cans, even when broken.
      *   **Naturalizing Artifact Normativity:** Millikan argues this artifact normativity isn't magic; it arises from the **history of copying patterns *because* they worked.** The "should" is grounded in the causal history of reproduction based on success. This paves the way for arguing that biological normativity arises similarly, but via natural selection rather than intentional copying.
      *   **Should the Skeptic be Convinced?** The passage *aims* to make the biological case less alien by analogy. However, a skeptical reader might push back:
          *   Artifacts *do* rely on *intentions* (designers/copiers *intend* the function). Is Millikan smuggling intentionality into the artifact case to bootstrap biology?
          *   Is the analogy strong enough? Does natural selection truly "copy patterns" in the same way intentional agents do?
      *   **Work Done:** It shifts the burden. The skeptic must either accept a naturalized account of artifact function normativity (free of irreducible "oughts") or explain why biology is fundamentally different. It makes the biological project seem like an *extension* of an accepted naturalization, not a leap into the void.

  **Underdetermination & Projection Warnings:**

  *   **"Pattern/Formula":** The text doesn't rigorously define this. Is it a mental blueprint? A physical template? A set of instructions? A dispositional property? This ambiguity fuels some interpretive disagreement.
  *   **"Governs Reproduction":** How strict is this "governance"? Does it require intentional following? Millikan likely intends it broadly (including natural selection governing trait replication), but the artifact example leans on intentionality.
  *   **Derived Proper Function:** The passage introduces this for representations but doesn't elaborate on the derivation mechanism *here*. Later developments (e.g., consumer functions) are crucial but not present in this opening.
  *   **Normal Conditions as "Idealization":** The text doesn't specify *how* the idealization works from actual historical conditions. Is it the intersection? The union? A prototype? This lack of detail leads to debates (descriptive stats vs. counterfactual ideal).
  *   **Circularity in Artifacts:** The passage relies on the intuitive understanding of design intention to ground artifact function and avoid the circularity problem. It doesn't provide a fully naturalized account of artifact intentionality itself within the selectionist framework *at this stage*.

  **Substantive vs. Verbal Disagreements:**

  *   **Substantive:**
      *   Whether artifact proper function *ultimately* reduces to biological proper functions of designers (intentions) or if the pattern-selection story is sufficient on its own.
      *   Whether the Normal Conditions idealization can be rigorously defined without smuggling in normativity or counterfactuals.
      *   Whether the distinction between "causing existence" and "explaining by reproduction pattern" is truly non-circular for artifacts without relying on unanalyzed intentions.
      *   Whether the artifact analogy successfully bridges the gap for biological normativity in the eyes of a skeptic.
  *   **Likely Verbal (in interpreting this passage alone):**
      *   Saying "the can opener has a proper function" vs. "the pattern has the proper function and the opener has a derived function." The text clearly assigns proper function to the pattern, but colloquially we assign function to the object. The core point is *where the selection history lies*.
      *   Debating "descriptive" vs. "counterfactual" interpretations of Normal Conditions *if* both sides agree it's ultimately grounded in actual historical success conditions. The key is that it's *not* just current statistical norms.

  **Key for Your Presentation:** Emphasize the core move: grounding normativity ("supposed to", "proper function") in historical selection history (either of patterns via copying-success, or of traits via natural selection), and defining content via mapping correlations *under the idealized conditions of past success* (Normal Conditions). Highlight the artifact example as a dialectical tool to make biological normativity seem less mysterious by analogy, while flagging the potential points of friction (intentionality, circularity) that a skeptic might seize upon. Focus on what the text *says* and *does* in these opening moves, separating it from the fuller system developed later.
