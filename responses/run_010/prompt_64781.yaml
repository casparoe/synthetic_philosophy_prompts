answer: |-
  ## The Indefensibility of Pure Time Preference

  Pure time preference (ρ) cannot be defended as a fundamental normative principle; it functions solely as an arbitrary fudge factor to counteract the implications of positive wellbeing growth (g > 0) within the Ramsey framework, and its standard defenses collapse entirely under conditions of negative growth.

  The decisive argument against ρ's normative independence is the sign flip under negative growth. If ρ represented a genuine ethical discount for futurity *per se* – a claim that being located later in time intrinsically diminishes moral weight – then it should persist regardless of the growth rate's sign. Yet, when g < 0 (earlier generations are worse off), proponents of the Ramsey formula readily accept that the planner should *negatively* discount future wellbeing, assigning it *greater* weight than present wellbeing (via the term -|ηg|). This reversal proves ρ lacks independent normative content. Its sole function is to add a positive offset when g > 0, preventing the discount rate (ρ + ηg) from becoming negative in the empirically common scenario of positive growth. It exists to keep the discount rate conveniently above zero, not as a defensible ethical stance. It is, fundamentally, a kludge.

  Examining the standard defenses of ρ under negative growth reveals their complete incoherence:
  1.  **Survival Risk:** This defense argues ρ proxies for the risk of future generations not existing. However, this risk is empirically contingent and already separable; it should be modeled as an explicit probability discount, not baked into ρ as a pure time preference. Under negative growth, the mere *possibility* of extinction cannot justify *reducing* the weight given to poorer future generations whose existence is assumed in the calculation. If anything, the potential disappearance of these worse-off beings might intensify the case for prioritizing them now.
  2.  **"Sacrificing for the Richer Future":** This argument collapses spectacularly when g < 0. The core claim – that present sacrifices for richer future people are unfair – reverses. Future generations are now *poorer*. Insisting on a positive ρ under these conditions means deliberately downweighting the wellbeing of worse-off future people simply because they come later. This transforms from a fairness argument into overt intergenerational exploitation by the relatively better-off present. Appeals to "not sacrificing for richer people" become irrelevant or perverse when the future is poorer.
  3.  **Moral Irrelevance of Time Location:** The objection that temporal location is as arbitrary as continental location becomes devastating under negative growth. Defenders of ρ must now explain why the planner should discount (penalize) the wellbeing of a *poorer* future person solely based on their later birth date. There is no plausible ethical justification for this. If discounting a future African's wellbeing simply for being African is repugnant, discounting a poorer future person's wellbeing simply for being future is equally indefensible. Impartiality demands treating equal claims equally, irrespective of when they occur. The negative growth scenario starkly exposes the inherent discrimination in pure time preference.

  The concern that tracking the sign of g introduces its own arbitrariness is valid but ultimately less problematic than retaining ρ. While shifting from positive to negative discounting based on a macroeconomic variable feels jarring, this approach directly reflects the underlying ethical principle: equal consideration for equal wellbeing. Positive g suggests future wellbeing is less "costly" to achieve (or that present sacrifice is more burdensome relative to future abundance), justifying some discounting. Negative g suggests future wellbeing is *more* costly (or future destitution demands greater present effort), justifying negative discounting. The arbitrariness lies in the contingent, unpredictable nature of economic history, not in the ethical principle applied. Conversely, retaining ρ imposes a *constant*, time-invariant discount for futurity, which is inherently arbitrary and actively harmful when the future is worse off. The sign-of-g approach, however contingent, aligns the discount rate with the fundamental goal of wellbeing egalitarianism across time under changing economic circumstances, whereas ρ actively obstructs it.

  Therefore, the pure rate of time preference (ρ) is not merely weakened but entirely discredited as a normative principle by the negative growth scenario. It serves no defensible ethical purpose independent of counterbalancing positive growth. Its defenses evaporate under negative growth, revealing it as an unjustifiable prejudice against the future. While deriving discount rates from the sign of g introduces a contingent element, it remains the only approach consistent with the core requirement of impartiality: equal concern for the wellbeing of all persons, regardless of when they exist. The planner *should* negatively discount future wellbeing when earlier generations are worse off, and the failure of ρ's defenses in this context proves its ethical bankruptcy.
