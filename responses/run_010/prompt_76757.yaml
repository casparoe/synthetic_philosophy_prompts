  - Deny that the thesis must hold for every conditional (e.g., Stalnaker restricts it to simple conditionals without embeddings).

  - Accept that the thesis fails in some cases but maintain truth conditions for other reasons.

  - Use a different kind of truth condition (e.g., three-valued or dynamic).

  Therefore, the conclusion does not follow from the true parts of the passage.

