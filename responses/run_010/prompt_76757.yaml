  Therefore, the minimal assumption: Stalnaker's Thesis holds for every pair (A, C) (with P(A)>0) in a non-trivial probability space (with at least three pairwise incompatible events of positive probability) and the conditional is a proposition (so [A→C] is in the algebra).

