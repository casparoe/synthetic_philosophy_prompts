  Claim 6: "Adams was therefore right from the start: an indicative conditional is neither true nor false, and what governs it is not a probability of truth but a conditional probability of acceptability."

  Verdict: Defensible simplification. Adams did hold that view, and Lewis's result is taken by many as supporting Adams. But note that Adams did not use the same framework (he had a logic of conditionals without truth conditions). However, the chapter presents it as a direct consequence, but Lewis's result doesn't by itself establish Adams's view. It only shows that a truth-conditional account satisfying the thesis universally is impossible.

  Specialist reading: Lewis's result is seen as supporting Adams's view, but Adams's view is not the only alternative. There are also truth-conditional accounts that drop the requirement of satisfying Stalnaker's Thesis universally.

  Objection: Stalnaker would object because he maintains truth conditions and rejects the universal applicability of the thesis.

  Claim 7: "Note also that the proof does no smuggling. It does not require the thesis to hold across all of an agent's possible revisions of her beliefs, and it does not turn on how one treats antecedents of probability zero, so there is no wiggle room for a truth-conditionalist."

  Verdict: Accurate. Lewis's (1976) proof is for a single fixed probability function and avoids the issue of zero-probability antecedents by requiring that the conditionals are defined only when the antecedent has positive probability. So it doesn't require the thesis under belief revision and handles the zero case by restriction.

  Specialist reading: Lewis's first triviality proof (1976) assumes a fixed probability function and avoids the zero-probability issue by considering only cases with P(A)>0. It does not require the thesis to hold under belief revision.

  Objection: None. This is a fair point.

  Now, the minimal assumption for the proof:

  Lewis's first triviality proof (1976) requires:

  - The language has at least four pairwise incompatible propositions (or events) that have positive probability. (Sometimes stated with three, but actually four are used in the proof. However, we can do with three: see below.)

  Actually, Lewis uses three pairwise incompatible and exhaustive propositions, say X, Y, Z, each with positive probability. Then he considers conditionals with antecedents that are disjunctions: (X∨Y), (X∨Z), etc.

  The weakest form of the assumption:

  We assume that the conditional A→C is a proposition in the algebra of events (so it has a probability) and that Stalnaker's Thesis holds for every pair (A, C) in the algebra for which P(A)>0. Moreover, the probability space must be non-trivial in the sense that there are at least three pairwise incompatible events, each with positive probability.

  But note: the proof also requires that the conditional behaves in a way that allows the application of the thesis to the antecedents that are disjunctions.

  So minimal assumption: There exists a probability space with at least three pairwise incompatible events (each with positive probability) and a conditional connective → such that for every two events A and C (with P(A)>0), the event [A→C] is in the algebra and P([A→C]) = P(C|A).

