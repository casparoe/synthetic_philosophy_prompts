prompt: |-
  My friend is an ML researcher — very sharp, zero philosophy, thinks entirely in objective functions — and I've got an hour at her kitchen table with a whiteboard to walk her through Scanlon's contractualism and the numbers problem. Don't explain it to me; plan how I explain it.

  What has to be in place before "could reasonably reject" means anything to her at all; which single case should carry the whole thing, and what that case has to have and must not have (I'm ruling out the one-vs-five rescue setup, she's been trolley-problemed in every AI ethics talk she's ever given); the order the pieces go in so that pairwise comparison feels like the only thing left standing rather than a clever trick; where her existing framework is going to misfire — I'm betting she turns reasonable rejection into a min-max objective within about ninety seconds, then decides the whole view is just a slow way of geting "save the five," and separately pushes on why you can't just sum complaints across people — and the exact point in the sequence to head each of those off; one question I can ask at the end that shows me whether she's actually got the anti-aggregation point or just memorized a procedure; and what I should say up front I'm not covering at this level.

  End with a single sentence naming the hardest thing to convey here.
reasoning: |-
  Okay, the user is preparing to explain Scanlon's contractualism to their friend, an ML researcher. The friend is very analytical, thinks in terms of objective functions, and has likely heard all the standard trolley problem examples in AI ethics talks. The user wants a strategic plan for this explanation, avoiding clichés like the one-vs-five rescue scenario. 

  Hmm, the core challenge here is bridging two very different mindsets: philosophical ethics versus machine learning optimization. The friend will instinctively map "reasonable rejection" to a min-max function unless carefully guided. Need to anticipate where her ML framework will misfire—especially the temptation to aggregate complaints across individuals. 

  First, gotta establish why contractualism matters upfront. Should position it as solving coordination problems under moral disagreement—something familiar to ML folks working on multi-agent systems. The key is framing it as "no one gets veto power, but everyone gets a voice," which prevents her from misinterpreting rejection as simple optimization. 

  For the case study, the Himalayan villages example feels right. It's vivid, involves concrete tradeoffs without life-or-delema baggage, and has asymmetric risks (landslide vs. flood) that prevent simple aggregation. Must emphasize the villagers aren't interchangeable—their complaints differ qualitatively. 

  Crucially, the sequence matters: start with individual complaint articulation (show how Bob cares about probability, Alice about severity), then demonstrate why summing them fails (different units!), then introduce pairwise comparison as the only way to weigh apples against oranges. If she tries to min-max early, shut it down by noting that minimizing maximum complaint would unfairly ignore the many moderately affected villagers. 

  The kill switch question at the end—"why not just pick the option with fewest total complaints?"—will reveal if she grashes anti-aggregation. If she answers in terms of qualitative differences rather than math, it landed. 

  Hardest thing to convey? That morality isn't about finding some global optimum, but about mutually acceptable justifications. Gotta watch her eyes glaze over at that part.
answer: |-
  Here’s the tactical plan for your kitchen-table session, optimized for an ML researcher’s mindset:

  ---

  ### **Pre-Reqs Before "Reasonable Rejection" Lands**  
  1. **Frame morality as coordination under disagreement**: "You’re designing rules for a group where everyone has equal standing, but conflicting needs. No one’s utility function is privileged."  
  2. **Anchor in "burdens" (not utility)**: Define a "complaint" as a *personal* burden from an outcome (e.g., "my injury," "my starvation"). Stress: **complaints aren’t additive**.  
  3. **Rejection ≠ optimization**: Emphasize: "Reasonable rejection isn’t about minimizing max burden or global loss—it’s about *justifiability to each person*."  

  ---

  ### **The Pivotal Case: Himalayan Villagers**  
  *(Avoids trolleys, forces qualitative comparison)*  
  **Setup**:  
  - *Option A*: Build a dam. Lowers flood risk for **100 farmers** (severe crop loss → manageable).  
  - *Option B*: Reinforce slopes. Prevents landslide for **5 families** (total home destruction → minor damage).  
  **Must have**:  
  - Asymmetrical burdens (catastrophic loss vs. widespread moderate harm)  
  - Non-interchangeable risks (homes vs. crops)  
  - No obvious "greater good" sum (100 minor complaints vs. 5 severe ones)  
  **Must avoid**:  
  - Identical harms (e.g., deaths)  
  - Rescuable lives (to sidestep trolley reflexes)  

  ---

  ### **Sequence to Force Pairwise as the Only Move**  
  1. **Individual complaints first**:  
     - Landslide survivor: "I lose everything—unbearable."  
     - Farmer: "I’d lose 30% income—tough but livable."  
  2. **Show aggregation fails**:  
     - Her instinct: *Sum complaints → save 100 farmers*.  
     - Block this: "Can *one farmer’s* 30% loss *combine* to outweigh *total home destruction*? Units differ!"  
  3. **Introduce pairwise test**:  
     - "Compare any *one* landslide victim’s complaint vs. *one* farmer’s. Would the victim’s objection trump the farmer’s if choosing individually? Yes."  
     - "Now check if Option B is *uniquely rejectable*: Could *each* farmer reasonably say, ‘My burden is lighter than the landslide victims’, so I can’t veto B’?"  
     → Pairwise emerges as the only tool for incommensurable burdens.  

  ---

  ### **Her Misfires & Preemptive Strikes**  
  - **Misfire #1: "Reasonable rejection = min-max"**  
    *When*: The moment "burden" is defined.  
    *Head off*: "Min-max would choose Option A (prevent farmer losses), but does that *justify* ruining 5 families? Scanlon says no—those families can reasonably reject A because their burden is *disproportionate*."  
  - **Misfire #2: "This just sneaks in ‘save the five’"**  
    *When*: After pairwise comparison.  
    *Head off*: Flip the numbers: "What if it’s 1 landslide victim vs. 10,000 farmers? Pairwise still asks: *Can the victim reject a rule favoring farmers?* Their burden might still dominate any single farmer’s—so saving the many *isn’t* automatic."  
  - **Misfire #3: "Why not sum complaints?"**  
    *When*: During burden comparison.  
    *Head off*: "Sums ignore *who* bears the cost. Contractualism cares about *individual justifiability*: Can you tell the landslide victim, ‘Your total loss is outweighed by 100 minor inconveniences’?" → "No."  

  ---

  ### **The Test Question**  
  **Ask**: *"In the village case, why can’t we say Option A is better because total complaints (100 people × 30% loss) > complaints under B (5 people × total loss)?"*  
  - **If she gets it**: She’ll say, "Because you can’t *trade off* ruin against distributed inconvenience—each victim’s complaint must be justified *to them*."  
  - **If she misses it**: She’ll defend aggregation (e.g., "Net utility improves").  

  ---

  ### **Scope Limit Upfront**  
  **Say**: "We’re skipping ties, threshold effects, and how to define ‘reasonable’—just focusing on *why aggregation fails*."  

  ---

  ### **Hardest Thing to Convey in One Sentence**  
  **"Morality isn’t about optimizing outcomes—it’s about whether you can justify your choices *to each person* affected, given their unique burden."**  

  ---

  ### **Why This Works**  
  - Uses her optimization intuition against itself (pairwise as the only non-arbitrary comparator).  
  - Villagers case makes burdens vivid and blocks trolley reflexes.  
  - Forces her to see that *per-person justifiability* breaks aggregation.  
  Your goal: Make her feel the *aha* when she realizes summing complaints is like adding apples to wrecked homes.
