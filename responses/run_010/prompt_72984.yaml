prompt: |-
  I am the director of governance for a national professional association — roughly 12,400 members — that publishes safety standards for pressure equipment (boilers, unfired storage vessels, industrial piping) and certifies the inspectors who enforce them. Because most states incorporate our standards by reference into their boiler law, a clause we adopt becomes a legal requirement, and a clause we get wrong can contribute to a vessel failure somewhere down the line. Our standards council has 41 seats drawn from three chambers: credentialed engineers and inspectors, manufacturers and owner-operators, and a small public-interest block (workers' representatives, municipal safety officials, and a handful of lay members seated after a fatal incident a decade ago). Ballots are one member, one vote, standards pass by simple majority, and charter amendments need two-thirds plus ratification by the membership. Two or three times a year, a proposal arrives to depart from that equal weighting — votes weighted by certification tier, a standing technical panel with a veto over clauses it deems unsound, sortition-selected lay jurors, restricted suffrage on technical annexes, and, most often, supermajority requirements that quietly function as minority vetoes. We have no framework for any of it. The last such fight cost us a board seat and nearly cost us the manufacturer chamber, which represents about forty percent of dues and had begun talking about publishing a rival standard.

  What I want is a decision procedure my governance committee can actually run on any such proposal. The committee is seven people — two practicing engineers, a lawyer, three elected council members, and me — and nobody on it has graduate training in political theory; one member is a retired plant manager who will not read anything longer than four pages. We can afford roughly a half day per proposal, twice a year, plus an hour of preparation, and our output is a written recommendation to the full council, which votes; the council, not we, decides. That output has to be readable by the members who lose, in the sense that a defeated faction can see their objection was engaged with rather than outvoted by a body claiming superior judgment. So please give me an ordered sequence of questions with explicit sufficiency conditions at each step: what answer lets us move on, what answer stops the proposal outright, what answer converts it into a narrower proposal we should send back, and which questions are empirical — where we could in principle settle them with data we already hold, such as twenty years of ballot records, member surveys, certification demographics, and incident reports — as opposed to questions of value that we must hand to the council rather than resolve ourselves. A colleague who reads more philosophy than I do pointed me at the Condorcet jury theorem and then immediately at three deflationary remarks: that deliberation destroys the independence the theorem needs, that a body selected for credentials will be demographically skewed in ways that give no reason to expect better decisions, and that whoever writes the qualifying examination is doing the real deciding while everyone else argues about the ballot. Use whatever in that neighborhood is genuinely usable, name the distinctions you are relying on in plain language rather than by jargon, and tell me which ones you had to bend or drop to make the thing runnable by non-specialists — and flag the steps that are really judgment calls wearing a procedural costume.

  Then run the procedure on three live proposals. First, tier-weighted voting: full fellows cast two votes and associate members one, on technical standards ballots only. Second, a standing Technical Review Panel of seven senior fellows holding a once-per-standard veto over any clause it judges technically unsound, exercisable only with a published written reason — I drafted this one myself and expect to be embarrassed by your verdict, so please do not soften it. Third, a proposal from the public-interest chamber to reserve a third of council seats for a sortition-selected panel of plant workers and nearby residents, voting equally on all matters including technical annexes. For each, give the verdict, the specific step where it turns, and what a modified version that survives would look like if one exists. Also say in a sentence or two how the procedure handles the recurring supermajority requests, since those are the ones most likely to arrive next quarter dressed as caution rather than as expertise. Finally, be explicit about the limits: what this procedure cannot settle at all, whether it silently assumes that legitimacy is a matter of getting correct outcomes rather than of treating members as equals, and what will predictably go wrong the first time we use it — including the awkward question of what authority our own unelected committee has to be filtering the membership's votes, and whether the procedure can be turned on itself.
reasoning: |-
  Okay, let me start by understanding the user's situation. They're the director of governance for a professional association that sets safety standards for pressure equipment. Their standards become law in many states, so any mistake can lead to real-world failures. The council has 41 seats split into three chambers: engineers/inspectors, manufacturers/owners, and a public-interest group. They use one member, one vote with simple majority for standards, but charter amendments need two-thirds plus membership ratification.

  The user is facing proposals to change the voting structure—things like weighted voting, technical panels with veto power, or sortition-selected members. They need a decision procedure that their governance committee can use efficiently. The committee has seven members with limited time and varying expertise. Their output must be a recommendation that shows defeated factions were genuinely considered, not just outvoted.

  First, I need to break down the key requirements: a step-by-step process with clear yes/no gates, using data where possible, and avoiding political theory jargon. The procedure must be practical for non-experts, handling each proposal in half a day plus prep time. The output needs to be transparent so losing parties feel heard.

  The user mentioned the Condorcet jury theorem but noted its limitations like deliberation breaking independence and credential bias. They want usable elements without the flaws. So the procedure should focus on criteria like problem definition, effectiveness, fairness, and risks, rather than theoretical ideals.

  Looking at the three live proposals: tier-weighted voting, a technical review panel with veto, and sortition-selected members. Plus recurring supermajority requests. Need to apply the procedure to each and show where they pass or fail.

  I should structure the procedure into sequential questions. Start with problem identification—does the proposal solve a real, documented issue? If no data supports the problem, reject early. Then assess effectiveness: will this solution fix the problem without unintended consequences? Use empirical data here, like ballot records or incident reports.

  Next, evaluate fairness and legitimacy. Does the change treat members equally or introduce bias? Here, values come into play, so the committee can't decide; they must flag it for the council. Then assess risks like complexity, implementation costs, or potential for gridlock. Finally, ensure the proposal is the minimal necessary change.

  For tier-weighted voting: problem might be technical inaccuracies. But data shows no correlation between certification level and ballot outcomes. Effectiveness is low since it doesn't address the root issue. Fairness is a problem—unequal voting power. So it fails at fairness, and the committee would recommend rejection.

  For the technical panel veto: problem is technical errors in standards. But incident reports show no pattern of such errors. Effectiveness is questionable—could cause delays. Fairness is an issue as it centralizes power. Risks include gridlock. The modified version without veto, just an advisory role, might pass.

  Sortition proposal: problem is lack of public input. Survey data shows members value technical expertise, but public interest concerns are valid. Effectiveness is low—random selection might not bring relevant expertise. Fairness and legitimacy clash here; the committee can't resolve, so it goes to council with caveats.

  Supermajority requests: they often mask minority vetoes. The procedure would question the problem—if it's about protecting minority interests, data might show if minorities are consistently overruled. If not, it's likely a veto in disguise, so reject.

  Limits of the procedure: it assumes legitimacy comes from correct outcomes, not equal treatment. Also, the committee's authority might be questioned since they're unelected. The procedure can't handle deep legitimacy conflicts or proposals affecting the committee's own power. First-time use might face resistance from factions expecting different outcomes or challenges to the committee's role.

  Need to ensure each step is clear, with sufficiency conditions. For example, if a problem isn't evidenced by data, stop. If fairness issues arise, refer to council. Use plain language, avoid jargon. Highlight where steps involve judgment calls disguised as procedure, like assessing risks or minimal change.

  Also, the user wants the procedure to show engagement with objections, so the output must clearly document how each question was addressed, especially where proposals are rejected or modified.
answer: |-
  Here is a decision procedure for your Governance Committee, designed as a sequential filter with explicit gates. It uses plain-language distinctions, prioritizes empirical checks where possible, flags value judgments, and acknowledges its own limits. The core principles are: **Problem First, Evidence-Based, Minimal Change, Legibility of Defeat.**

  **The Decision Procedure: 7 Sequential Questions**

  1.  **Is there a documented, specific problem this proposal aims to solve?**
      *   **Sufficiency (Move On):** Clear evidence (e.g., incident reports, ballot records, member complaints, survey data) shows a recurring, harmful pattern directly addressed by the proposal. *Empirical.*
      *   **Stop Outright:** No specific problem is identified, or the claimed problem lacks supporting evidence. Proposal is vague or solution-first.
      *   **Narrow/Send Back:** The problem is real but misdiagnosed or broader than the proposal addresses. Ask proponents to reframe solely around the evidenced problem.
      *   **Judgment Call:** Interpreting the *severity* and *directness* of the link between evidence and the problem.

  2.  **Is the proposed mechanism likely to solve the documented problem effectively?**
      *   **Sufficiency (Move On):** A plausible, logical chain connects the mechanism to solving the problem. Existing data (e.g., similar mechanisms elsewhere, analysis of past votes) supports its effectiveness *without creating worse problems*. *Mostly Empirical (logic + data).*
      *   **Stop Outright:** The mechanism demonstrably cannot solve the problem (e.g., veto panel for non-technical problems) or is internally contradictory. Data suggests it would fail or be gamed.
      *   **Narrow/Send Back:** The mechanism *could* partially work, but needs significant adjustment (e.g., scope, trigger, composition). Propose specific modifications.
      *   **Judgment Call:** Assessing "plausibility" and weighing potential unintended consequences based on limited data.

  3.  **Does this change create significant new risks or burdens? (Complexity, Delay, Cost, Gridlock, Litigation, Exit Threats)**
      *   **Sufficiency (Move On):** Analysis shows risks are low, manageable, and outweighed by the solved problem's severity. Implementation burden is acceptable. *Empirical (cost/time estimates, past friction points) + Judgment.*
      *   **Stop Outright:** Risks are severe and probable (e.g., guaranteed gridlock, high implementation cost, major faction exit threat like manufacturer departure). Burden is demonstrably unsustainable.
      *   **Narrow/Send Back:** Risks are moderate but addressable (e.g., phased implementation, sunset clause, modified scope). Propose risk mitigations.
      *   **Judgment Call:** Balancing severity/probability of risks against benefits.

  4.  **Does this change fundamentally alter the balance of power or legitimacy between chambers/members? (The Fairness & Legitimacy Gate)**
      *   **Sufficiency (Move On):** The change *does not* significantly alter voting power allocation, chamber influence, or core membership rights compared to the status quo. It's a procedural tweak.
      *   **Stop Outright:** The change *explicitly and severely* violates core principles like "one member, one vote" on binding standards or equal chamber standing *without overwhelming justification*. (Value Judgment - *Committee CANNOT resolve, flags as decisive for Council*).
      *   **Narrow/Send Back:** The change alters power/legitimacy, but proponents offer a compelling *principled justification* (e.g., correcting a proven bias, enhancing safety through expertise, incorporating vital missing perspective). *Committee flags this as a MAJOR VALUE QUESTION for Council.*
      *   **Judgment Call:** Distinguishing a "significant" power shift from a minor one. Recognizing a core principle violation.

  5.  **Is this the simplest, least disruptive way to solve the documented problem?**
      *   **Sufficiency (Move On):** Yes, simpler alternatives are demonstrably ineffective or nonexistent. *Empirical (tried alternatives?) + Judgment.*
      *   **Stop Outright:** A clearly simpler, less disruptive alternative exists that solves the same problem effectively (e.g., better training instead of a veto panel; enhanced review instead of weighted votes).
      *   **Narrow/Send Back:** The core idea has merit, but a less complex/disruptive version is possible (e.g., advisory role instead of veto; pilot program).
      *   **Judgment Call:** Defining "simplest" and "least disruptive."

  6.  **Can the change be implemented clearly and monitored objectively?**
      *   **Sufficiency (Move On):** Clear, unambiguous rules for operation and success metrics exist. *Practical Judgment.*
      *   **Stop Outright:** Implementation is hopelessly vague, subjective, or lacks measurable outcomes (e.g., veto based on "judged unsound" without defined criteria).
      *   **Narrow/Send Back:** Needs clearer implementation rules or defined metrics added.
      *   **Judgment Call:** Assessing clarity and objectivity.

  7.  **Does the proposal comply with the current Charter and bylaws?**
      *   **Sufficiency (Move On):** Clearly compliant, or only requires a standard Council vote, not Charter amendment.
      *   **Stop Outright:** Violates Charter/Bylaws and requires Charter amendment, but proponents refuse to pursue that path. *Procedural.*
      *   **Narrow/Send Back:** Requires Charter amendment. Recommendation must explicitly state this and outline the amendment process (2/3 Council + membership ratification). *Procedural.*

  **Output:** A concise memo (<4 pages) structured around these 7 questions. For each:
  *   State the question.
  *   Present evidence/data used (or lack thereof).
  *   State the Committee's finding (Sufficiency/Stop/Narrow).
  *   *Crucially:* For "Stop" or "Narrow," provide a clear, factual, evidence-based rationale focused on the *problem, mechanism, risks, or procedure*, avoiding claims of "superior judgment." For Q4 (Fairness/Legitimacy), explicitly state: "This raises a fundamental question of [specific principle] that the Council must deliberate and decide based on the association's values."

  **Bent/Dropped Distinctions:**
  *   **Condorcet Jury Theorem:** Acknowledged but discarded as *operationally unusable*. Relies on unrealistic independence and questionable competence assumptions vulnerable to selection bias (who sets exams?).
  *   **Deep Legitimacy Theories:** Reduced to a practical test: "Does this drastically alter core power structures or voting rights?" avoiding debates between epistemic (correct outcomes) vs. procedural (equal treatment) legitimacy. The procedure *assumes the status quo has baseline legitimacy* and focuses on changes.
  *   **Ideal Deliberation:** Simplified to "Is the problem clear and the solution logical?" given time constraints. Doesn't assume deliberation improves outcomes, just clarity.

  **Running the Live Proposals:**

  1.  **Tier-Weighted Voting (Full Fellows x2, Associates x1, Technical Standards Only)**
      *   **Q1 (Problem):** *Claim:* Associates lack technical depth, leading to technically flawed standards. *Evidence?* Ballot records likely show no consistent pattern of technically flawed standards passing against engineer/inspector opposition. Incident reports don't trace failures to associate votes. *Finding:* **Stop Outright.** Problem not evidenced.
      *   *Verdict:* **REJECT.** Fails at Q1. (Even if it passed Q1, Q4 would likely stop it as a fundamental shift away from equal voting power on binding standards without evidence associates cause harm).

  2.  **Standing Technical Review Panel (7 Senior Fellows, Veto per Clause w/ Reason)**
      *   **Q1 (Problem):** *Claim:* Technically unsound clauses slip through. *Evidence?* Scrutinize incident reports and ballot challenge records. If no pattern of *technical* flaws causing incidents or major post-ballot technical corrections, problem lacks evidence. *Finding:* **Stop Outright** (if no evidence) or **Narrow/Send Back** (if weak evidence exists - redefine problem scope).
      *   **Q2 (Effectiveness):** Veto *could* technically block flaws but also block valid innovation. Risk of groupthink/elitism. *Finding:* **Likely Stop/Narrow** - High risk of gridlock (Q3), major power shift (Q4). Unclear implementation (Q6 - "unsound" criteria?).
      *   **Q4 (Fairness/Legitimacy):** **Major Value Question.** Centralizes immense power in a small, unelected subgroup, overriding the representative Council. Violates representative governance principle.
      *   *Verdict:* **REJECT.** Likely fails Q1 & Q4 decisively. Q2/Q3 also problematic.
      *   *Modified Survivor:* **Advisory Technical Review Panel.** No veto. Publishes "Technical Assessment Reports" during development/ballot, highlighting potential concerns for *all* Council members to consider. Solves "awareness" problem without power shift (Passes Q4). Addresses Q1 if problem is *lack of expert input visibility*, not faulty outcomes.

  3.  **Sortition-Selected Public Interest Panel (1/3 of Seats, Workers/Residents, Vote on Everything)**
      *   **Q1 (Problem):** *Claim:* Lack of frontline/public perspective leads to standards ignoring practical realities or community risks. *Evidence?* Surveys may show members value technical expertise most. Incident reports *might* reveal patterns where operator error or community impact was a factor, suggesting a perspective gap. *Finding:* **Move On** (if evidence of perspective gap) or **Narrow** (redefine problem scope based on evidence).
      *   **Q2 (Effectiveness):** Random selection brings diverse views but *not* necessarily relevant safety expertise or understanding of complex standards. May dilute technical rigor. *Finding:* **Likely Stop/Narrow** - Effectiveness for *safety* outcomes is dubious. High risk of disconnect (Q3).
      *   **Q4 (Fairness/Legitimacy):** **Major Value Question.** Replaces elected/credentialed representatives with randomly selected individuals with no required expertise on critical technical matters. Fundamentally alters the competence-based selection principle of the Council. Proponents argue it enhances democratic legitimacy/equity.
      *   **Q5 (Simplicity):** Complex to implement and integrate. *Finding:* **Stop/Narrow.**
      *   *Verdict:* **REFER TO COUNCIL WITH STRONG CAVEATS.** Fails Q2 & Q5 empirically. Q4 is the core, unresolvable value conflict the Council must debate: Technical Expertise vs. Democratic Inclusion/Lived Experience as the basis for legitimacy in standard-setting. *Committee Output:* "This proposal addresses a potential perspective gap (Q1 evidence noted) but introduces significant implementation challenges and effectiveness concerns (Q2, Q3, Q5). Most critically, it fundamentally challenges the current principle that Council members possess specific technical/industry expertise (Q4). The Council must decide whether incorporating this direct public perspective warrants this significant shift in membership principle."
      *   *Modified Survivor:* **Stakeholder Advisory Group w/ Observer Status.** Sortition-selected group provides formal input during development, publishes opinions, but *no vote*. Enhances perspective without altering core Council legitimacy (Passes Q4).

  **Handling Recurring Supermajority Requests (e.g., 60% for technical annexes):**
  *   **Q1 (Problem):** *Claim:* Prevents controversial/low-quality standards, protects minorities. *Evidence?* Analyze ballot history: How often do standards pass 50-60%? Were those standards later problematic? Is there evidence minority views (especially manufacturer or PI chamber) are consistently steamrolled *on matters vital to their core interests*? If ballots typically pass overwhelmingly and problematic standards are rare, the problem is unsubstantiated. *Finding:* Likely **Stop Outright** (no evidence) or **Narrow** (if evidence, scope it ONLY to areas with proven conflict/harm).
  *   **Q4 (Fairness/Legitimacy):** Functions as a *minority veto*. Shifts power to the blocking minority. **Major Value Question:** Is preventing potentially flawed standards worth enabling obstructionism? *Committee Output:* "While caution is understandable (Q1), the data shows [findings]. Granting a permanent minority veto (Q4) is a significant power shift requiring the Council to weigh the value of expediency and majority rule against enhanced caution, acknowledging this empowers any 41% bloc."
  *   *Likely Outcome:* Rejected unless specific, evidenced problem exists *and* Council accepts the value shift (rare).

  **Explicit Limits of the Procedure:**

  1.  **Cannot Settle Deep Legitimacy Conflicts:** It identifies when proposals challenge core legitimacy principles (Q4) but cannot resolve them. That *must* go to the Council.
  2.  **Assumes Status Quo Legitimacy:** It operates within the existing framework, assuming its baseline legitimacy is accepted. Proposals challenging the *entire structure* (e.g., abolish chambers) are beyond its scope.
  3.  **Epistemic Bias:** Favors empirical evidence and problem-solving. It implicitly prioritizes "correct" safety outcomes ("epistemic" legitimacy) over pure procedural fairness ("procedural" legitimacy) when those conflict, *unless* Q4 flags a fundamental fairness violation. The Council can overrule this bias.
  4.  **The Committee's Authority:** The procedure *presumes* the committee has the delegated authority to filter proposals based on problem definition, feasibility, risk, and procedural compliance (Q1, Q3, Q5, Q6, Q7), and to flag value conflicts (Q4). Its legitimacy rests on:
      *   Council/Board mandate.
      *   Transparent process and criteria.
      *   Focus on evidence and clear rationale, not ideology.
      *   Producing legible rejections that show engagement.
      *   *First-Time Risk:* Factions expecting automatic Council consideration will challenge the committee's "gatekeeping." Mitigation: Clear communication of mandate and process *before* first use; showing how rejections are evidence-based.
  5.  **Self-Application (The Awkward Question):** Applying it to proposals *about the Governance Committee itself* (e.g., changing its composition, abolishing it) is highly problematic. Q4 (power shift) and Q7 (Charter) will trigger, but the committee lacks the neutrality to judge its own status. **Recommendation:** Charter should require such "meta-governance" proposals bypass the committee and go directly to the Council with heightened scrutiny (e.g., requiring a Board proposal or significant membership petition).
  6.  **Predictable First-Time Problems:**
      *   **Data Gaps:** Lack of centralized data for Q1/Q2 (e.g., no member surveys, poor ballot records). *Mitigation:* Start building this now; acknowledge gaps in reports.
      *   **"Judgment Call" Debates:** Arguing over Q3 (Risk Severity) or Q5 (Simplicity). *Mitigation:* Require explicit risk lists; compare alternatives concretely.
      *   **Q4 Over/Under-use:** Accusations of hiding behind Q4 or ignoring it. *Mitigation:* Strictly tie Q4 findings to demonstrable power shifts violating stated principles.
      *   **Rejection Backlash:** Factions feeling unheard despite process. *Mitigation:* Ensure the memo *directly addresses their stated rationale* with evidence; offer modified paths clearly.

  This procedure provides a rigorous, evidence-focused filter your committee can realistically apply within its constraints. It forces proponents to articulate problems, exposes purely self-serving changes, flags unresolvable value conflicts for the Council, and produces documented, legible recommendations that demonstrate engagement – key to maintaining legitimacy even when saying "no."
