answer: |-
  Here's a decision tree using concrete cases, targeting your distinctions within 950 words:

  1.  **Imagine someone with a terminal illness, deeply loved and content, who chooses medically assisted death to avoid suffering. They say: "My life was good *for me*, but it wasn't *worth* continuing." Could this be true?**
      *   **Yes (Life can be good but not worth continuing):** Go to 2.
      *   **No (If life is good, it's worth continuing; or worth continuing depends on other things):** Go to 3.

  2.  **An artist spends 50 years creating unique, beautiful sculptures that bring them intense joy and purpose. They lock them away immediately after creation; no one else ever sees or knows about them. Was their life meaningful?**
      *   **Yes (Private creation/engagement suffices):** Go to 4.
      *   **No (Recognition/impact beyond self needed):** Go to 5.

  3.  **A deeply devout monk lives simply and joyfully, believing their prayers sustain the universe. They are correct; their prayers *do* hold the cosmos together. Was their life meaningful?**
      *   **Yes (External validation/impact matters):** Go to 6.
      *   **No (External validation is irrelevant/not sufficient):** Go to 7.

  4.  **Consider Sisyphus rolling his boulder forever. Now imagine he *loves* it, finding deep challenge and flow. Is his life meaningful?**
      *   **Yes (Subjective attitude suffices):** **Leaf: Pure Subjectivism**
      *   **No (Attitude isn't enough; need objective impact):** Go to 8.

  5.  **Sisyphus rolls his boulder forever. Unbeknownst to him, each roll *does* subtly maintain the structural integrity of a vast, beautiful temple complex housing thousands. Is his life meaningful?**
      *   **Yes (Objective impact matters, even if unknown):** Go to 9.
      *   **No (The person must endorse/know the impact):** **Leaf: Hybridism (Requires endorsement AND impact)**

  6.  **Sisyphus rolls his boulder forever, hating every second. Unbeknownst to him, each roll *does* subtly maintain a vast, beautiful temple. Is his life meaningful?**
      *   **Yes (Objective impact is sufficient):** **Leaf: Supernaturalism / Robust Objectivism** *(Settled: Requires external source/impact)*
      *   **No (Personal engagement/endorsement also needed):** **Leaf: Hybridism (Requires endorsement AND impact)**

  7.  **Imagine plugging into an "Experience Machine" granting a perfectly simulated life full of felt purpose and deep accomplishment. Would this life be *meaningful*?**
      *   **Yes (Felt experience is sufficient):** **Leaf: Pure Subjectivism**
      *   **No (Connection to reality is needed):** Go to 10.

  8.  **A scientist dedicates 50 years to a grand theory they passionately believe will cure disease. On their deathbed, conclusive proof shows their core assumption was fatally flawed; their life's work was fundamentally wrong. Was their life meaningful?**
      *   **Yes (Sincere effort/engagement suffices):** **Leaf: Pure Subjectivism**
      *   **No (Actual truth/impact matters):** Go to 9.

  9.  **Sisyphus rolls his boulder for years, finally completing a magnificent temple. The next day, an earthquake destroys it utterly, leaving no trace or memory. Was his life meaningful?**
      *   **Yes (The accomplishment itself matters, regardless of duration):** **Leaf: Robust Objectivism (Temporal Scale Insensitive)**
      *   **No (Enduring results are needed):** Go to 11.

  10. **Sisyphus rolls his boulder forever, fully aware it's pointless, finds it absurd, yet defiantly embraces the struggle with passion. Is his life meaningful?**
      *   **Yes (Defiant engagement creates meaning):** **Leaf: Hybridism (Endorsement + Reality-Awareness)**
      *   **No (Defiance doesn't create meaning; task is pointless):** **Leaf: Camusian Absurdism** *(Live Fight: Defiance as response vs. meaning-creator)*

  11. **Imagine we build a genuinely beautiful, thriving civilization. In 10^100 years, the universe is empty, cold, and dead. Does this future emptiness make our civilization's existence *meaningless*?**
      *   **Yes (Ultimate cosmic context drains meaning):** **Leaf: Cosmic Pessimism / Nihilism**
      *   **No (Meaning is local/immanent, not dependent on eternity):** **Leaf: Robust Objectivism (Temporal Scale Insensitive)**

  **Unoccupied Leaves:**
  *   **Radical Presentism:** Meaning *only* exists in the exact present moment; past/future are irrelevant. (Likely unoccupied due to incoherence - meaning inherently involves narrative/duration).
  *   **Cosmic Indifference:** Meaning requires the *universe itself* to be indifferent to human concerns (contra supernaturalism). (Likely unoccupied because it seems redundant with pessimistic objectivism and unattractive).

  **Flagged Blurry Distinctions:**
  1.  **Pure Subjectivism vs. Hybridism (Endorsement Path):** Answers to Q8 & Q10 might blur if someone thinks passionate engagement *is* the core impact. The tree tries to split on whether *actual* impact/truth is *also* required (Q5, Q6, Q8, Q9).
  2.  **Robust Objectivism vs. Supernaturalism:** The tree uses Q6 (Sisyphus hates it but maintains temple) to point towards supernaturalism/robust objectivism *if* objective impact is deemed sufficient *without* endorsement. However, distinguishing a purely naturalistic robust objectivism from a supernatural one *requires* the supernaturalist commitment (like the monk in Q3). Someone landing at "Robust Objectivism" via Q9/Q11 could *potentially* hold either a naturalistic or supernatural view of the objective value source. The tree flags Q3 as settled for supernaturalism requiring an external source.
  3.  **Camusian Absurdism vs. Pessimism/Nihilism:** The key split is Q10. If defiance/passion in the face of pointlessness is rejected *and* cosmic scale matters (Q11=Yes), it leads to Pessimism/Nihilism. If Q10=No but Q11=No, it leads back to Robust Objectivism. Camus is *only* the leaf if Q10=No *and* the defiance is acknowledged but seen as insufficient for *meaning* itself. Some may argue this *is* pessimism, but the tree isolates the specific "rebellion without meaning" stance.
