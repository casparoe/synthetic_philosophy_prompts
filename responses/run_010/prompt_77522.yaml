prompt: |-
  Second semester of a vagueness seminar, and I've realised the phrase doing the most work in the room is "there's no fact of the matter." My professor used it twice in one session and I'm pretty sure it didn't mean the same thing both times. First time: a classmate asked whether this particular pile of sand on the table is a heap (yes, we did the sorites with actual grains, it was a whole thing), and he said there's no fact of the matter, discussion over. Second time, maybe twenty minutes later, someone asked whether the borderline region itself has a boundary — like, is there a last thing that's determinately not-a-heap — and he said there's no fact of the matter again, only there it sounded like he was talking about our words rather than about the pile. Then a third classmate said the whole epistemicism-vs-supervaluationism fight is just a verbal dispute, so there's no fact of the matter about which one is right either, and the prof sort of agreed while obviously thinking that was wrong.

  Can you lay out the different precise claims that one sentence can be standing for? I want a menu, not a pick-one-and-defend-it. My rough sketch of the space is things like: the object doesn't sharply have or lack the property; the sentence fails to pick out a unique proposition; there is a fact but nobody could ever know it; there's a fact but which one it is is arbitrary in a way that's supposed to matter; the question is merely verbal. Come up with the real list though, don't just dress up my sketch, and add whatever readings I've missed. For each one I want: what has to be true for it to hold, whether a supervaluationist can consistently assert it, whether an epistemicist can, and whether it's a platitude, a substantive thesis, or just false.

  Then tell me which reading is doing the work in each of the three uses above and whether my prof was being consistent, because it feels like the second one can't be the same claim as the first — the first is about the pile and the second is about the word "determinately," and if the second is vague too then hasn't he just pushed the problem up a level instead of answering it? Relatedly: is "there's no fact of the matter" itself ever vague, and if it is, does that break any of the readings? And there's a version of this sentence people keep using about translation and reference in my other class — say whether that's another entry on the same menu or a seperate dish entirely.

  Finally, flag which of these verdicts you're least confident in and what argument or consideration would flip you on them. I'd genuinely like to know where you think I'm the confused one here, since I've probably got at least one of those three uses wrong.
