          - Creates identities that are rural, settled, and have a lower base QoL (say +5) but the resource depletion penalty is lower (or even a bonus for conservation).
          - Example identities: "Jamie, a farmer", "Casey, a local teacher", etc.

     Then, the number of identities is always equal to the number of students in the group. The policy choice changes the set of identities and the base QoL.

