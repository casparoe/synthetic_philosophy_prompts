     Let's stop after Gen 2 and the grievance system. Then we have 45 minutes for debrief.

     Revised:

          Minute 0-10: Intro
          Minute 10-25: Gen 1 policy decision and assignment of Gen 2 identities and QoL.
          Minute 25-30: Grievance attempt for Gen 2.
          Minute 30-40: Gen 2 policy decision (for Gen 3) but without forming Gen 3. We just show them the Gen 3 identity envelopes and let them see the QoL projections? (This is a bit weak.)

