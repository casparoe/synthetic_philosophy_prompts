     Actually, we can have:
          - Gen 1: They are policymakers and then they become Gen 2? But that doesn't work because they are the same people. We want the next generation to be different people.

     How to handle the transition:
          - In round 1 (Gen 1), the students are playing the policymakers of Gen 1. They make a decision and then we assign identity cards for Gen 2 to the same group? But then they are the same physical people. We want them to feel that they are now different people.

     We need a multi-round structure where the same group moves through generations, but with new identities each time.

     Proposed Round Structure for one group:

          Round 1 (Gen 1 policymakers): 
              - Start with resource pot (100 tokens).
              - Choose policy A or B. 
              - They open the envelope for the chosen policy and get identity cards for Gen 2. They also calculate the remaining tokens (100 - consumption of Gen 1) and then compute the QoL for Gen 2 (which depends on the base for their identity and the remaining tokens).

          Round 2 (Gen 2 policymakers): 
              - Each student gets an identity card from Gen 2. They are now the people of Gen 2. They see their QoL score (written on the card?).
              - They start with the remaining tokens from Gen 1.
              - They then make a policy decision for Gen 3: choose a policy that will determine the identities and resource consumption for Gen 3.

          And so on.

     Then, after a few rounds, we stop and do the grievance system.

     But note: the non-identity problem arises when a policy is chosen that creates people with a lower QoL, but if a different policy had been chosen, those people wouldn't exist. In the game, the same students are playing the next generation, but they are assigned new identities. The key is that the identity they are assigned in Gen 2 is specific to the policy chosen by Gen 1. If Gen 1 had chosen a different policy, the Gen 2 identities would be different.

     So when we assign the Gen 2 identities, we emphasize that these are the people who exist because of the policy chosen by Gen 1. And if they had chosen the other policy, then a completely different set of people would exist.

  3. **Grievance System (during the game)**:
     - After each generation gets their identity cards and before they make the next policy decision, we allow students to complain if they have a low QoL.
     - We hand out a grievance form to anyone who wants to complain. The form has:
          - "My name (identity): ________"
          - "My QoL score: ________"
          - "I am complaining because I have a low QoL due to the policy chosen by the previous generation."
          - "The alternative policy that should have been chosen: ________ (fill in the policy name)"
          - "Under that alternative policy, I would have been: ________ (name the identity you would have been) and my QoL would have been: ________"
     - The catch: The alternative policy would have created a different set of identities. The student cannot fill in the last two blanks because they wouldn't exist under the alternative policy. They would not be any of the identities from the alternative envelope.

     We have to make sure that the identity sets for the two policies are disjoint. For example, for Gen 2:

          Policy A envelope: identities {Alex, Taylor, Jordan, ...}
          Policy B envelope: identities {Jamie, Casey, Morgan, ...}

     So if Policy A was chosen, and a student is Alex, then if they try to complain and say the alternative should have been Policy B, they cannot name an identity in Policy B that is Alex because Alex doesn't exist under Policy B.

     We will explain this when we hand out the forms: "Note: The identities under Policy A are completely different from those under Policy B. They are different people."

  4. **Number of Rounds**:
     - We need at least two generations: Gen 1 chooses a policy that creates Gen 2. Then Gen 2 can file grievances against Gen 1. But we also want to see that the effects compound? 
     - However, the non-identity problem is present in each generational transition. We don't need compounding to see the core issue. In fact, one clean round might be better. But we want them to have the experience of being a future generation that was created by a policy, so we need at least two rounds: Gen 1 and Gen 2.

     But note: the game has to fit in 80 minutes. We have:

          Intro: 10 min
          Gen 1: 15 min (including policy discussion and assignment of Gen 2 identities)
          Gen 2: 15 min (they get identities, file grievances? and then make a policy for Gen 3)
          Gen 3: 15 min (if we have three generations, then Gen 3 can file grievances against Gen 2 and also against Gen 1? But the non-identity problem is about the immediate previous generation. We can stop at Gen 2 and then do a deep debrief.)

