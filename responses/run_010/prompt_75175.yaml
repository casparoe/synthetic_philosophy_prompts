          - In the game, the early choices determined who would exist in the future. 
          - Those future people cannot say they are worse off because the alternative would have been non-existence.
          - But note: we might have chosen a policy that created people with a high QoL. The fact that we chose a policy that created people with a lower QoL doesn't harm the people who exist? Because without that policy, they wouldn't exist.
     - Then introduce the name: "This is known as the non-identity problem, from Derek Parfit."
     - Discuss: How does this challenge our usual thinking about harming future generations? We usually say: "Our climate policies harm future generations." But if the policies also determine which future generations exist, then it's not clear that we are harming particular people? Because the alternative would have been different people? 
     - And then the positive note: giving up the person-affecting principle (that an act is wrong only if it makes someone worse off) might not be a catastrophe. We can still say that an act is wrong if it creates a world that is worse in an impersonal sense (e.g., less happy overall). So we can still condemn climate inaction on the grounds that it creates a future with lower overall well-being, even if it doesn't harm any particular future person.

     Order of debrief:
          1. Grievance experience: what happened and why they couldn't fill the form.
          2. The link between policy and identity: how the policy chosen determined who they were in the next generation.
          3. The philosophical puzzle: if we didn't harm anyone, is there a problem?
          4. The impersonal perspective: maybe we should care about the overall quality of life in the future, regardless of who exists.
          5. The relief: we don't need to give up on climate ethics; we just need to shift our justification.

  7. **What Could Go Wrong**:
     - A student gets a low QoL card and says "it's just a card, whatever". 
          Prevention: Make the identity cards rich and personal. During the intro, set the stage: "You will become a specific person in the next generation. Your well-being depends on the choices made today."
          Handling: If a student is dismissive, during the grievance phase, ask them: "Can you fill out the form? If you were really this person, could you complain?" 
     - Students might try to game the system and maximize tokens, ignoring identities.
          Prevention: The grievance form forces them to confront identity. Also, during the policy discussion, encourage them to think about the kind of society they are creating. The policies are described in terms of societal outcomes, not just numbers.
     - The grievance form might be confusing.
          Prevention: Have a sample on the board. Explain: "If you are unhappy with your QoL, you can fill this form to complain to the previous generation. But you have to say who you would be if they had chosen differently."
     - Time management: The policy discussions might run long.
          Handling: Give clear time warnings. Have a timer visible. If a group is stuck, encourage them to vote.
     - Group dynamics: Some groups might have dominant personalities.
          Handling: Assign roles? Or just let it be, as long as they get to the policy choice.

  8. **What the Activity Cannot Reproduce**:
     - In real life, we don't get to stand outside our existence. We are always the ones who exist. In the game, students remember being the policymakers and then become the future people. This dual perspective is artificial. But it is exactly what allows them to see the non-identity problem. Without it, they wouldn't be able to compare existence and non-existence.
     - However, the gap is that in real life, future people don't have the option to complain to the past. They just live with the consequences. But the game gives them a voice (via the grievance form) and then takes it away by the non-identity problem. This is a pedagogical device.

     We need to acknowledge in the debrief that in reality, we don't have this dual perspective. But the non-identity problem is a logical problem that arises when we consider the identity-dependence of our actions. The game helps us see the logic, even if the experience is artificial.

     A worse worry: The game might trivialize the suffering of future people. We must be careful to emphasize that even if we cannot say that a particular person is harmed, we still have obligations to make the future better. The game is not meant to say that climate change is okay; it's meant to challenge how we justify our obligations.

     In the debrief, we will explicitly discuss: "Does this mean we have no obligations to future generations? No, it means we need a different kind of reason: one that focuses on the world we create, not on harming specific people."

  9. **Verdict**: We can make the identity-dependence point land.

  Final Game Rules:

  - Divide the class into 4 groups (5-6 students each). Each group has:
        - A resource pot (envelope with 100 tokens, represented by paper clips or beads)
        - Two policy envelopes for Gen 1 (labeled Policy A and Policy B), each containing:
              * A policy description card
              * A set of identity cards for Gen 2 (one per student in the group, each with a unique name, a short description, and a base QoL)
        - Grievance forms (one per student, but only used by Gen 2)

  - Steps:

    1. **Gen 1 (15 min)**:
          - Each group reads the descriptions of Policy A and Policy B.
          - They discuss and choose one policy by vote.
          - They open the chosen policy envelope and take out the identity cards for Gen 2. They also take out the policy description card which tells them the consumption (e.g., "Consumes 40 tokens").
          - They remove the consumed tokens from the pot and set them aside (the consumed tokens are gone).
          - They calculate the QoL for each Gen 2 identity: QoL = base (on the card) + (remaining tokens / 10) [or some scaling]. Write the final QoL on each card.

    2. **Assign Gen 2 identities (5 min)**:
          - Shuffle the identity cards and hand one to each student in the group. They are now the Gen 2 people.
          - They read their card and see their QoL.

    3. **Grievance phase (5 min)**:
          - The instructor asks: "If your QoL is below 50 (or some threshold), you may feel that the previous generation made a bad choice. You can file a grievance. Here is the form."
          - Hand out grievance forms to everyone. Let them try to fill it out. They will get stuck on the last two blanks.

    4. **Group discussion (5 min)**:
          - In their groups, they discuss: "Why couldn't you fill out the form? What does that mean for the responsibility of the previous generation?"

    5. **Transition to debrief (5 min)**:
          - Bring the class together.

  - Debrief (40 min) as described.

  Example Policy for Gen 1:

    Policy A: High Consumption, High Mobility
        Description: "Build fossil fuel infrastructure and promote urban jobs. This leads to a society of workers in energy-intensive industries. The policy consumes 40 tokens from the resource pot."
