  We are designing an in-class game to make students feel the non-identity problem. The key is that early choices must determine who the later participants are, not just their well-being. We want to avoid the trap of students treating identity cards as mere points and collapsing into token-maximizing.

  Proposed Game Structure:

  Title: "Generations: A Climate Policy Game"

  Core Idea: 
  - Students start as Generation 1 policymakers. They choose policies that affect both resource consumption and the composition (who exists) of the next generation.
  - The room physically reorganizes each round: students become specific people in the next generation, whose existence and quality of life are determined by the policies chosen in the previous round.
  - We include a complaint/grievance system that forces students to confront the non-identity problem when they hold a low-quality life card.

  Key Features to Address the Problem:
  1. **Identity Cards**: Each student in the next generation is assigned a specific identity (with a name and a quality-of-life score) that only exists because of the specific policy chosen. The identities are tied to the policy bundle (e.g., a high-mobility policy might create "Sophia, a climate migrant" while a low-mobility one might create "Ethan, a settled farmer").
  2. **Policy Bundles**: Each policy bundle has two components:
     (a) Resource consumption: how much of the shared resource pot is used (affecting the quality of life for the current and future generations).
     (b) Demographic composition: determines which set of identities come into existence and how many people there are in the next generation.
  3. **Complaint Mechanic**: Students with low quality-of-life scores can file a grievance. But the grievance form requires them to specify which alternative person (from an alternative policy) they would be. Since the alternative policy would have created a different set of people, they cannot name an alternative person that is them (because they wouldn't exist under the alternative). This should make the non-identity problem tangible.

  Materials (budget $30 and a stapler):
  - Index cards (for identity cards) - $5
  - Markers - $5
  - A few envelopes or a small box (for the shared resource pot) - $1
  - Tokens (can be cheap plastic chips, beads, or even cut paper) - $5
  - Printed policy sheets (one per generation per group) - $2
  - Grievance forms (printed in advance) - $2
  - Whiteboard or large paper for tracking - $0 (assume available)
  Total: ~$20 (under budget)

  Game Setup:
  - Number of students: 22. We'll divide them into 4 groups (5-6 students per group). Why groups? Because we want multiple policy decisions and multiple sets of identities to see variation. Also, it keeps the game manageable and allows for comparison.
  - Each group has its own resource pot and set of policies. They are independent, so we can see different outcomes.

  Game Flow:

  1. **Introduction (10 minutes)**:
     - Explain the setting: "We are simulating climate policy decisions across generations. Each group is a country making decisions that affect future generations."
     - Explain the basic rules without giving away the philosophy. Focus on the mechanics: 
          - Each generation makes a policy choice that affects:
              a) How much they consume from the resource pot (which affects the quality of life for the current and next generation).
              b) The size and composition of the next generation (which specific people exist).
          - Then, the next generation is formed: students get identity cards that are created by the policy chosen.
          - They will have a quality-of-life score (QoL) that depends on the resources left and the policy conditions.

  2. **Generation 1 (15 minutes)**:
     - Each group starts with a resource pot of 100 tokens (representing natural resources, clean environment, etc.).
     - They are given 2-3 policy options (on a policy sheet). Each policy option has:
          - A consumption level (e.g., take 20 tokens, take 30 tokens, etc.).
          - A demographic outcome (e.g., "This policy leads to a small, settled community" or "This policy leads to a large, mobile society").
          - A set of identity cards that will be created if this policy is chosen. The identity cards are pre-made and sealed in an envelope for each policy. The envelope is labeled with the policy and should not be opened until after the vote.
     - The group discusses and votes on a policy. They do not know the exact identity cards (they only know the description). After voting, they open the envelope for the chosen policy and take out the identity cards for the next generation.
     - They also note the remaining tokens (100 minus consumption) and the QoL score for the current generation (which is based on consumption and maybe the policy type, but we'll come back to scoring).

     Example Policy Options for Gen 1:
       Option A: High Consumption (take 40 tokens) + High Mobility
          - Description: "We invest in fossil fuels and encourage urbanization. This leads to a large, mobile population but depletes resources faster."
          - Next generation: 6 people (if group has 5, then one extra card? We need to adjust for group size). The identities are: "Aiden, urban worker", "Mia, climate migrant", etc. (each with a base QoL that will be adjusted by resources).

       Option B: Low Consumption (take 20 tokens) + Settled Lifestyle
          - Description: "We conserve resources and maintain traditional lifestyles. This leads to a smaller, settled population."
          - Next generation: 4 people (so if the group has 5, one student won't get a card? We have to handle group size.)

     Adjusting for group size: We want the number of identity cards to match the next generation size. Since we have 4 groups of 5-6, we can design policies to have 5 or 6 identities. But to make it work, we can have the policy determine the number of students in the next generation. However, we have a fixed number of students. So we need a workaround.

     Solution: 
     - Each group has 5-6 students. In each generation, all students are policymakers. Then, when moving to the next generation, the policy chosen determines how many identity cards are in the envelope. But we have the same number of students. So we do this:
          - After the policy is chosen, the envelope is opened. It contains exactly the number of identity cards for the next generation (say, 5 for a low-growth policy, 6 for a high-growth policy). 
          - Then, the group must have that number of students in the next generation. How? We can have some students sit out? That might be awkward.

     Alternatively, we can have the entire room as one society? But 22 is too big for one policy discussion.

     Revised Solution (to avoid excluding students):
     - We don't change the number of students per group. Instead, we change the composition of identities and the QoL. The policy doesn't change the group size (it remains 5-6) but it changes the identities and the resource base. The demographic dimension is about the type of people and their circumstances (which affects QoL) and the resource consumption. The non-identity problem doesn't require changing the number of people necessarily, but changing who they are.

