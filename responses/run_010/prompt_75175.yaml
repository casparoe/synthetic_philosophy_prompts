answer: |-
  ### Climate Generations: The Non-Identity Game  
  **Core Objective**: Make students *feel* the non-identity problem by forcing them to confront how policy choices determine *who exists* in the future, not just *how well-off* they are.  

  ---

  ### **Materials List** ($18 total)  
  - **Identity Cards**: 60 index cards ($3) with unique names/roles (e.g., "Aisha, coastal engineer"; "Ben, drought-affected farmer").  
  - **Policy Bundles**: 8 large envelopes ($2) labeled "Policy A" or "Policy B" (2 per group).  
  - **Resource Tokens**: 400 beads/buttons ($5) in 4 shared pots (100 per group).  
  - **Grievance Forms**: 22 half-sheets ($2) with fields:  
    > *My identity: ______   My QoL: ______   I blame Generation: ______  
    > Under Alternative Policy, I would be: ______   with QoL: ______*  
  - **Whiteboard**: Track policies/QoL scores ($0, assume available).  
  - **Markers/Stapler** ($6).  

  ---

  ### **Rules & Timeline (80 min total)**  
  #### **Setup (10 min)**  
  - Divide 22 students into 4 groups (5-6 per group). Each group gets:  
    - 1 resource pot (100 tokens).  
    - 2 policy envelopes (A and B).  
  - Explain: *"You’re Generation 1 policymakers. Your choices affect WHO exists next and their quality of life (QoL). QoL = tokens left + identity bonus."*  

  #### **Round 1: Gen 1 Chooses (15 min)**  
  - **Policy Bundles** (sealed in envelopes):  
    - **Policy A**: High depletion (-40 tokens), creates **mobile identities** (e.g., "Climate migrant," QoL bonus +0).  
    - **Policy B**: Low depletion (-20 tokens), creates **settled identities** (e.g., "Sustainable farmer," QoL bonus +10).  
  - **Task**: Groups debate/vote on a policy. *Crucial: They only see policy descriptions, NOT identities.*  
  - **After vote**: Open chosen envelope, reveal identity cards. Discard unchosen policy.  
  - **Calculate QoL**:  
    - `QoL = Remaining tokens/10 + identity bonus`  
    - *Example: If Policy A chosen (-40 tokens), 60 tokens left → base QoL=6. "Climate migrant" (bonus +0) → final QoL=6.*  

  #### **Round 2: Gen 2 "Exists" (10 min)**  
  - Shuffle identity cards from chosen policy, distribute randomly.  
  - Students read cards aloud: *"I’m [name], a [role]. My QoL is [X]."*  
  - **Grievance Phase**: Any student with QoL < 7 gets a grievance form.  
    - *Task: Fill out the form. Watch them struggle to name an "alternative self."*  
  - **Key Moment**: When a student says, *"I can’t fill this—I wouldn’t exist!"*  

  #### **Round 3: Harmless Shift Round (15 min)**  
  - **Policy Bundles for Gen 2**:  
    - **Policy C**: No depletion (0 tokens), creates **new identities** with same QoL (e.g., "Green tech innovator," bonus +10).  
    - **Policy D**: No depletion (0 tokens), creates **different identities** with same QoL (e.g., "Community organizer," bonus +10).  
  - **Task**: Gen 2 votes. After revealing identities, repeat grievance phase.  
  - **Why this round?** Students realize their person-affecting reflex ("I deserve better!") fires even when QoL is identical—exposing the bias toward *who* over *how*. This round is **essential**: It isolates the identity-dependence without emotional noise.  

  #### **Debrief (30 min)**  
  1. **Start with their words**: *"Who said, ‘I can’t complain’? Why?"* → Highlight student quotes.  
  2. **Map to philosophy**:  
     | **Game Moment** | **Parfit Concept** |  
     |----------------|-------------------|  
     | "I’d be someone else" | Non-identity: No fixed "future person" harmed |  
     | Grievance form failure | Person-affecting principle fails |  
     | Identical-QoL round | Moral bias toward identity (even without harm) |  
  3. **Reveal the problem**: *"This is Parfit’s non-identity problem. Your gut said ‘wrong!’ but no one was harmed. So what grounds our duty?"*  
  4. **Relief pitch**: *"Giving up ‘harm’ isn’t catastrophic. We can care about *worlds* (e.g., ‘a future with more flourishing lives’) not just *people.*"**  

  ---

  ### **Critical Design Choices**  
  1. **Token Scheme**:  
     - **QoL = Remaining tokens/10 + identity bonus**  
       - *Example: 60 tokens → base QoL=6; "farmer" (+10) → 16.*  
     - **Why it works**: Identity bonuses dominate token effects (e.g., +10 vs. +6). Forces focus on *who they are*, not tokens.  
     - **Prevent token-maximizing**: Identity bonuses are larger and tied to vivid roles (e.g., "migrant" vs. "farmer"). Students fixate on their character’s fate.  

  2. **Rounds**: **3 generations** (Gen 1→2→3).  
     - Gen 1→2: Introduces identity-dependence.  
     - Gen 2→3 (harmless shift): Compounds the effect ("Wait, *again* I’m someone new?").  
     - *Why not one round?* One round feels theoretical; three rounds make identity-shifts visceral.  

  3. **What Will Go Wrong (and Fixes)**:  
     - **"Bad card apathy"**: Student says, "Whatever, it’s fake."  
       - *Fix*: Pre-assign dramatic roles (e.g., "You’re a parent with flooded crops"). Leverage peer pressure—groups report grievances.  
     - **Token fixation**: Group optimizes tokens, ignores identities.  
       - *Fix*: Make bonuses asymmetric (e.g., Policy A: +0 bonus, Policy B: +15). Ask: "Who wants to be a climate refugee?"  
     - **Grievance confusion**: "Why can’t I pick Policy B’s identities?"  
       - *Fix*: Show the unchosen envelope: "These people *don’t exist*."  

  4. **What the Game Can’t Do**:  
     - **Standing outside existence**: Students remember prior rounds—real people don’t. This *overstates* the problem (actual future people never compare to non-existence).  
     - **Debrief bridge**: *"In reality, no one chooses to exist. But when we make policy, we *are* choosing who exists. Is ‘no one was harmed’ good enough?"*  
     - **Worse worry**: The game may imply creating *any* life is neutral. Stress: *"We’re not saying all choices are equal—we still want flourishing lives!"*  

  ---

  ### **Verdict**  
  `\answer{CAN}`  
  **Why**: The grievance form + harmless shift round forces a tangible "I can’t complain" moment. Non-majors engage with visceral choices, not abstraction. 80%+ will audibly groan at the form.
