          Minute 0-10: Intro
          Minute 10-25: Gen 1 (15 min)
          Minute 25-30: Assign Gen 2 identities and QoL (5 min)
          Minute 30-35: Grievance forms and attempt (5 min)
          Minute 35-40: Groups discuss the grievance experience (5 min) -> then we bring the whole class together for debrief.

     Then debrief from minute 40 to 80 (40 minutes).

     But note: we haven't done a round where the policy changes who exists but makes nobody worse off? (point 3 from the query)

     We need to include that. How? We can design the policies so that one policy creates a set of people with a slightly lower QoL than the other, but the alternative policy would have created a completely different set of people with a similar or even higher QoL? But then the complaint would be: "I have low QoL and if they had chosen the other policy, I wouldn't exist, but the other set of people would have a higher QoL." But that's the standard non-identity.

     The harmless identity-shift round: a policy that changes who exists but without making the new people worse off than the alternative people? That might not be possible because the alternative people don't exist. We want a scenario where the policy doesn't harm anyone because there is no one else who is better off that they are depriving? 

     In the non-identity problem, a policy that creates people with a life worth living (even if it's lower than what others might have had) doesn't harm those people because without the policy they wouldn't exist. So even if the QoL is low, it's still better than not existing.

     We can design one of the policy options to be a clear case: 
          Option A: Creates a set of people with QoL 50 (on a scale where 0 is not worth living and 100 is great). 
          Option B: Creates a different set of people with QoL 80.

     Then, the people created by Option A have a life worth living (50>0) but if Option B had been chosen, they wouldn't exist. And the people in Option B are better off, but they are not the same people.

     So when a student gets an identity from Option A with QoL 50, they complain: "Why didn't you choose Option B? Then the people would have QoL 80." But then when they try to fill the grievance form, they cannot say they would have been one of the Option B people because they wouldn't exist.

     This is the standard non-identity scenario.

     The harmless identity-shift round: we want a scenario where the policy changes who exists but the QoL of the created people is the same as the alternative? Then there is no complaint. But that might not be interesting. 

     Alternatively, we can have a scenario where the policy changes who exists and the QoL is the same? Then the grievance form attempt would be the same: they still can't name an alternative identity. But they might not care because QoL is the same.

     I think the standard scenario is sufficient. We don't need a separate harmless round. The point is that even when the QoL is low, they cannot complain because they wouldn't exist otherwise.

     So we'll stick with policies that have different QoL outcomes.

  5. **Preventing Token-Maximizing**:
     - How to avoid students treating QoL as mere points? We need to make the identity personal and the grievance system real.
     - We make the identity cards rich: each card has a name, a short description of the person's life, and the QoL score. The description should tie the person to the policy. For example:
          - Policy A (high consumption, high mobility): "Alex: You work in a factory in a big city. The air is polluted, but you have a steady job. Your QoL is 45 (base 50 - resource penalty 5)."
          - Policy B (low consumption, settled): "Jamie: You are a farmer in a rural community. The air is clean, but you work long hours and have limited access to modern amenities. Your QoL is 55 (base 50 + conservation bonus 5)."
     - The QoL score is not just a number; it's tied to the story. And the grievance form requires them to name a specific alternative identity that they would be, which they can't.
     - Also, during the debrief, we will emphasize that the identity matters: "You are Alex, and Alex only exists because of Policy A. If Policy B had been chosen, Alex wouldn't exist. So who is harmed by choosing Policy A? Alex is alive and has a life worth living. The alternative is non-existence for Alex."

