     - Start by asking: "What happened when you tried to fill out the grievance form?" 
          Expected answer: "I couldn't fill it out because I wouldn't exist under the alternative policy."
     - Then ask: "Why is that? What does that tell us about complaining about being born into a world with climate change?"
