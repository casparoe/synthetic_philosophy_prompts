          - Gen 1: 15 min
          - Transition to Gen 2: 5 min (assign identities, calculate QoL, and then grievance filing)
          - Gen 2: 10 min (they see their situation and then we don't do a full policy cycle? Or we let them make a policy for a hypothetical Gen 3? But we don't have time to form Gen 3.)

     Revised Timeline for one group (with two generations):

          Total: 40 minutes for the game (so for 4 groups, we run simultaneously? Then we need to sync)

     Actually, we are running 4 groups in parallel. The timeline is for the whole class.

     Proposed Timeline:

          Minute 0-10: Introduction and grouping (4 groups of 5-6)
          Minute 10-25: Gen 1 in all groups: they discuss and choose a policy, open the envelope for Gen 2 identities, and calculate the remaining tokens and QoL for Gen 2. (15 min)
          Minute 25-30: Assign Gen 2 identities to each student in each group. Hand out grievance forms to anyone with low QoL. Let them try to fill it out. (5 min)
          Minute 30-35: Groups discuss the grievance attempt. (5 min)
          Minute 35-45: Now, Gen 2 in each group makes a policy choice for Gen 3. They know their QoL and they have the resource pot (remaining from Gen 1). They choose a policy and then we assign Gen 3 identities? But we don't have time to actually form Gen 3. So we can simulate the outcome but not assign identities? 

