answer: |-
  **MEMORANDUM**  
  To: Student Employment Advisory Committee  
  From: [Your Name], Graduate Student Representative  
  Date: October 26, 2023  
  Subject: Recommendation on Coffee Cart Tipping Policy & International Student Engagement  
  **Target Implementation Date:** January 1, 2024 (Start of Spring Semester)  

  ---

  ### **1. Background & Core Conflict**  
  Dining Services replaced the automatic 18% service charge at the campus coffee cart with a tablet prompting voluntary tips (15%, 18%, 20%, or "no tip"). Student workers, paid near-minimum wage, report significant income loss linked to international students (from non-tipping cultures) selecting "no tip" at triple the rate of domestic students. Two workers formally complained, citing unfair earnings volatility. The committee now weighs four options:  

  - **(a)** Maintain current system.  
  - **(b)** Replace tips with a mandatory service charge (folded into prices).  
  - **(c)** Remove tip prompt; recommend higher posted wage.  
  - **(d)** Keep prompt; publish guidance for international students on tipping expectations.  

  The division hinges on whether tipping here is a *load-bearing convention* (workers rely on it) or an *outsourced convention* (the university offloads wage pressure onto cultural norms).  

  ---

  ### **2. Applying the Convention Framework**  
  - **The Load-Bearing View:** Workers’ livelihoods *are* impacted by deviation. They budget assuming partial tip compliance, and non-tipping directly reduces their income. This aligns with queueing or crosswalk norms: breaching them harms identifiable others who reasonably expected cooperation.  
  - **The Outsourced View:** Tipping exists because the university sets sub-living wages, shifting the burden to customers to subsidize payroll via voluntary payments. Compliance props up this arrangement, benefiting the institution (lower labor costs) while masking true costs.  

  **This tension is central:** The convention is *both*. It is load-bearing *for workers* (deviation cuts their income) but outsourced *by design* (the university avoids paying market-driven wages). Option (d) addresses the symptom (non-tipping) but entrenches the outsourced structure by recruiting the university to enforce a norm that absolves it of wage responsibility.  

  ---

  ### **3. Evaluating Option (d): The Strongest Case & Its Limits**  
  *The Best Argument for (d):*  
  Workers—our peers—lose tangible income through no fault of their own. International students’ cultural unfamiliarity is inadvertent but harmful. A low-cost educational memo (or orientation slide) clarifies local expectations, rectifying an information gap without financial burden. It is pragmatic, immediate, and worker-centered.  

  *Why This Falls Short:*  
  - **Standing & Enforcement:** The complaint came from *workers*, not international students. While workers suffer harm, they lack standing to demand cultural assimilation. The university enforcing this norm becomes complicit in outsourcing.  
  - **Temporality & Fairness:** Students here for one semester (common among exchange cohorts) never opted into this system. They face no reputational stakes, making guidance functionally coercive: subsidize wages or be labeled "non-compliant."  
  - **Institutional Accountability:** Option (d) treats tipping as a pure cultural practice, ignoring that the university *chose* this wage model. It asks newcomers to absorb costs the institution dodges.  

  ---

  ### **4. Recommendation: Option (c) with Condition**  
  **Verdict: (c) — Remove tip prompt; raise posted wages permanently.**  
  #### **Reasoning:**  
  - **Resolves Both Convention Tensions:** Eliminating tips ends the outsourced dynamic (wages become the university’s explicit responsibility). Raising wages acknowledges the load-bearing reality for workers, securing their income without reliance on volatile cultural compliance.  
  - **Fairness to International Students:** Removes pressure to navigate a foreign norm. Prices reflect true cost, avoiding hidden fees or social friction.  
  - **Addresses the Complaint’s Root Cause:** Worker income loss stems from *structural* wage inadequacy, not customer behavior. This targets the employer’s role.  

  #### **Condition:**  
  Wage increases must be funded **without raising end-consumer prices** for coffee cart items. Dining Services should absorb costs through operational reallocation or administrative support. (Rationale: Prevents further burden-shifting to customers and ensures the university internalizes the true cost of labor.)  

  #### **Rebuttal to Key Concerns:**  
  - *“Workers need immediate relief; (c) takes time!”*  
    True, but (d) offers no guaranteed relief—it merely *asks* for compliance. A wage hike is binding. Implementation by Spring 2024 aligns with budget cycles.  
  - *“Why not (b)? Mandatory charges are transparent.”*  
    (b) still hides labor costs in prices and normalizes the university’s refusal to pay fairly. It is outsourcing with extra steps.  

  ---

  ### **5. Why Other Options Fail**  
  - **(a) Status Quo:** Ignores worker harm and outsourced structure. Unsustainable.  
  - **(b) Mandatory Charge:** Perpetuates outsourcing while appearing "fair." Fails workers if prices stagnate wages.  
  - **(d) Guidance:** Well-intentioned but entrenches inequity. Risks alienating international students and moralizing wage suppression.  

  ---

  ### **6. Implementation & Next Steps**  
  - Dining Services must submit a wage adjustment proposal by November 15.  
  - The International Student Office will *still* receive resources to explain U.S. tipping culture broadly—but detached from this cart’s operations.  
  - Committee vote on this recommendation at Thursday’s meeting.  

  This solution honors workers’ immediate needs while rejecting a system that pits students against each other to subsidize institutional savings. It is both practical and principled.  

  ---  
  **Verdict: c — Raise wages, remove prompt permanently.**
