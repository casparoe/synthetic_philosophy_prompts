   2. The policy question: Whether to adopt set-valued (imprecise) probability reporting for future submissions.

   We must make a decision on the current certification. The two intervals are:
     Analyst A: [1/5000, 1/800] = [0.0002, 0.00125]
     Analyst B: [1/2000, 1/1500] = [0.0005, ~0.0006667]

