          Specifically, we note that the combination rule (intersection then convex hull) and the decision rule (certify only if the entire interval is below the threshold) are conservative in the sense that if there is any doubt (i.e., any part of the agency interval is above the threshold) we do not certify. However, the formation of the agency interval by intersection might be considered too narrow if one analyst has a very wide interval that is not well supported. We are relying on the professional judgment of the analysts. If we have reason to distrust one analyst (for example, if they are consistently overly optimistic or pessimistic) then we might need a different approach. But that is a matter of quality control of the analysts, not the aggregation method.

     Therefore, we recommend:

          Current certification: Do not certify that the risk is below 1 in 1000.
          Policy change: Adopt set-valued probability reporting with the combination rule: the agency's credal set is the intersection of all reported intervals if non-empty, otherwise the convex hull of the union of the intervals. The decision rule for binary thresholds: certify only if the entire agency credal set (i.e., the entire interval) is below the threshold.

