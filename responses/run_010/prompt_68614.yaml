   How do we combine these? We are not yet formally using set-valued probability, so we must interpret the current guidance (which requires a single point) in light of the fact that two analysts have provided intervals.

   However, note that the current guidance requires a single point, but the analysts did not comply. We are forced to make a decision with the information we have.

   Approach for the current certification:
     We cannot ignore the intervals. We must consider the entire range of possibilities. The critical question is: can we certify that the risk is below 1 in 1000?

     Let's look at the worst-case scenario in each interval:
       Analyst A: the upper bound is 0.00125, which is above 0.001.
       Analyst B: the entire interval is below 0.001.

     Since Analyst A's interval includes values above 0.001, we cannot be certain that the risk is below 0.001 based on that analyst's assessment. However, Analyst B's assessment is entirely below.

     But note: we have two independent assessments. How do we combine them? We are not instructed by current guidance because they are intervals. We must be cautious.

     One conservative approach is to consider the maximum of the upper bounds. However, that would be 0.00125, which is above 0.001. But note: the two analysts are assessing the same structure. It is possible that the true risk is at the high end of Analyst A's interval and at the low end of Analyst B's? That doesn't make sense because they are independent assessments of the same quantity.

     Alternatively, we might take the intersection of the intervals? The intersection of [0.0002, 0.00125] and [0.0005, 0.0006667] is [0.0005, 0.0006667]. This interval is entirely below 0.001.

     However, the analysts might not agree on the entire interval. The intersection represents the values that both analysts assign. But if the two intervals do not overlap at all, we would have an empty set. In this case, they do overlap.

     Another approach is to average the intervals? But that is not standard.

     Given the statute and the requirement to make a binary decision, we must choose the most defensible approach.

     Consider: the purpose of the panel is to ensure safety. The statute requires us to certify that the risk is below 1 in 1000 only if we are confident that it is. If there is any reasonable chance that the risk is above 1 in 1000, we should not certify.

     Analyst A's report includes the possibility that the risk is as high as 1 in 800 (0.00125). Therefore, we cannot rule out that the risk is above 0.001.

     Hence, we must recommend that we do NOT certify that the risk is below 1 in 1000.

     However, note that Analyst B's entire interval is below. But we have two conflicting intervals. We cannot simply ignore Analyst A's upper bound.

     The panel must consider the entire evidence. Since one of the analysts (A) gives an interval that extends above the threshold, we cannot be certain that the risk is below. Therefore, we must err on the side of caution.

     Recommendation for current certification: 
          We cannot certify that the risk is below 1 in 1000.

     However, note that this decision has significant consequences. We must also consider the possibility of requiring further assessment or immediate action.

     But the question for the panel is only: certify below 1 in 1000 or not. We are forced to choose "not".

   Now, the second issue: whether to adopt set-valued (imprecise) probability reporting.

   Arguments for:
     - The evidence often does not support a single precise probability. Forcing a point estimate can be misleading and may not capture the full uncertainty.
     - In this case, the analysts naturally provided intervals because they felt the evidence was imprecise.
     - It allows for a more honest representation of the state of knowledge.

   Arguments against (opponents):
     - Intervals are unactionable because they do not necessarily rank the options (e.g., in decision making, if we have two options with overlapping intervals, we cannot always say which is riskier).
     - Conditioning on new data can sometimes widen the interval (as in the case of conflicting evidence), which may be counterintuitive and difficult to explain.

   We must also propose a rule for combining several analysts' reports into the agency's credal set if we adopt set-valued reporting.

   Combining rules:
     We need a method to aggregate multiple intervals into a single set (or interval) that represents the agency's view.

     Some methods:
       1. Take the intersection: This requires that all analysts agree on the interval. But if there is any disagreement (non-overlapping intervals), we get an empty set, which is uninformative.
       2. Take the convex hull (the smallest interval containing all the intervals): This captures the entire range of opinions but may be too wide and lose the consensus in the middle.
       3. Take a weighted average of the bounds? But that is arbitrary.

     Alternatively, we might use a method that reflects the idea of combining evidence. In the theory of imprecise probability, there are rules for combining multiple sources (like Dempster-Shafer, but that has its own issues). However, we need something practical and defensible.

     We propose: 
          The agency's credal set will be represented by the interval that is the intersection of all reported intervals, provided that the intersection is non-empty. If the intersection is empty, then we will use the convex hull of the union of the intervals.

     Why?
          When the intervals overlap, the intersection represents the values that every analyst agrees are possible. This is a conservative and consensus-driven approach. When they do not overlap, we must acknowledge the full range of opinion, and the convex hull (i.e., the interval from the smallest lower bound to the largest upper bound) captures that.

     However, note that in the current case, the two intervals do overlap: [0.0002, 0.00125] and [0.0005, 0.0006667] -> intersection [0.0005, 0.0006667]. So we would have a non-empty intersection.

     But what if we have more than two analysts? The rule would be: the intersection of all intervals. Only if the intersection is empty do we take the convex hull.

     This rule is simple and transparent.

     However, opponents may say that even the intersection can be too wide? But note that the intersection is the set of values that every analyst agrees are possible. It is the most conservative in the sense of requiring consensus.

     Alternatively, we might consider a rule that takes the average of the lower bounds and the average of the upper bounds? But that would be arbitrary and could lead to an interval that none of the analysts support.

     We choose the intersection when non-empty, else the convex hull.

     But note: the opponents' argument about intervals being unactionable. We acknowledge that. However, in the context of dam safety, the decision is often binary (like the one we face). We can define a decision rule for such binary choices: for example, we will certify that the risk is below a threshold if and only if the entire agency credal set (the interval) is below the threshold.

     In the current case, if we had used this set-valued reporting and the combination rule (intersection), we would have had the interval [0.0005, 0.0006667] which is entirely below 0.001. Therefore, we would have certified.

     But note: our current decision without the set-valued policy was not to certify because we had one interval that went above. Why the difference?

     The difference is in the aggregation rule. In the current ad-hoc situation, we did not have a rule and we were forced to consider the worst-case from any analyst. Under the proposed rule, we require consensus (the intersection) to define the agency's view.

     This is a fundamental change. We are moving from a conservative (worst-case) view to a consensus view.

     However, note that if we require the entire agency interval to be below the threshold to certify, then if the interval extends above (even by a little) we do not certify. This is still conservative.

     In the proposed rule, we only get an interval that is entirely below if every analyst's interval is entirely below? Not exactly. We get an interval that is the intersection of all, and then we require that the entire interval is below. But note: if one analyst has an interval that goes above, then the intersection might still be entirely below? Let me see:

          Analyst A: [0.0002, 0.00125] -> includes above 0.001
          Analyst B: [0.0005, 0.0006667] -> entirely below

          Intersection: [0.0005, 0.0006667] -> entirely below.

          So in this case, we would certify because the intersection is below.

          But what if the intersection were [0.0005, 0.0015]? Then we would not certify because 0.0015>0.001.

          However, note that if the intersection includes values above the threshold, then we do not certify. But what if the threshold is inside the intersection? Then we do not certify because part of the intersection is above.

          So the rule for certification under set-valued reporting would be: 
              We certify if the entire agency credal set (interval) is below the threshold.

          This is equivalent to: the upper bound of the agency interval must be below the threshold.

     So in the current case, under the set-valued policy we would have certified because the upper bound of the intersection is 0.0006667 < 0.001.

     But wait: without the policy, we are not certifying because of the analyst with the upper bound above. The set-valued policy with the intersection rule leads to the opposite decision.

     This highlights the importance of the combination rule.

     We must be consistent and transparent. The set-valued policy with the intersection rule is a consensus rule. It says that we only consider the range of values that every analyst agrees are possible. The fact that one analyst thinks it could be as high as 0.00125 is not reflected in the agency interval because that same analyst also thinks it could be as low as 0.0002, and the other analyst only goes down to 0.0005. The intersection is the overlap.

     However, note that the analyst who provided the wider interval (A) might have done so because they had less information or more uncertainty. Should we give equal weight to both? The proposed rule does.

     We might consider weighting the analysts? But that would complicate and we don't have a basis for weights.

     Therefore, we propose the intersection rule (with convex hull if empty) as the agency's combination rule.

     But note: the opponents' argument about conditioning widening the interval. This is a valid theoretical point. However, in practice, as we gather more data, we hope to narrow the intervals. But sometimes new data can reveal new sources of uncertainty. We must be transparent about that. The set-valued probability is meant to reflect the current state of knowledge.

     We believe that the benefits of honesty about uncertainty outweigh the potential challenges in interpretation.

     We also note that the unactionability concern is mitigated by having a clear decision rule: we require the entire interval to be below the threshold to certify. This makes the decision rule clear and actionable.

     Therefore, we recommend adopting set-valued probability reporting with the following:

        - Each analyst reports an interval (or more generally a set, but we start with intervals) for the probability of failure.
        - The agency's credal set is the intersection of all the intervals if the intersection is non-empty. If the intersection is empty, then the agency's credal set is the convex hull (i.e., the interval from the minimum lower bound to the maximum upper bound) of the union of the intervals.
        - For any binary decision threshold (like the 1 in 1000), we will certify that the risk is below the threshold if and only if the entire agency credal set is below the threshold (i.e., the upper bound of the agency interval is below the threshold).

     We note that this decision rule is conservative in the sense that if any part of the agency interval is above the threshold, we do not certify. However, the formation of the agency interval by intersection when possible is a consensus approach that may avoid being overly conservative when one analyst is very uncertain (with a wide interval) but others are more precise and in agreement.

     In the current case, if we had this policy, we would have combined the two intervals into [0.0005, 0.0006667] and then certified because 0.0006667 < 0.001.

     But note: our current decision without the policy was not to certify. This creates an inconsistency. However, we are making a recommendation for the future policy and also for the current certification under the old rules.

     We must separate the two.

     Therefore, we recommend:

     Part 1: Current certification under existing guidance (which requires a point estimate but we have intervals):
          We have two intervals. Since one of the intervals (Analyst A) includes values above 0.001, we cannot be certain that the risk is below 0.001. Therefore, we must not certify.

          However, we note that the structure is aging and the risk may be increasing. We recommend immediate further assessment and possibly interim risk reduction measures.

     Part 2: Policy change for future submissions:
          We recommend adopting set-valued probability reporting with the combination rule described above.

     But note: the panel must vote on the current certification. We are bound by the existing guidance. The existing guidance does not specify how to handle intervals. We have to interpret. We have chosen a conservative interpretation: if any part of any analyst's interval is above the threshold, we cannot be sure. Therefore, we do not certify.

     However, if we adopt the set-valued policy, then in the future we would use the combination rule and then check the entire agency interval. That might lead to a different outcome in similar cases.

     We understand that the panel is divided. We have tried to address the concerns:

