  ### **Moorean Paradox Discovery Game: "Belief or Bluff?"**
  **Goal:** Students experience the absurdity of Moorean statements ("P but I don't believe P") through gameplay, voting, and group discussion—*before* learning the theory.  
  **Core Mechanic:** Players draw hidden "fact" cards, read assigned "statement" cards aloud, and the group votes on whether the speaker could *truthfully* say it. Moorean statements *always* fail, creating the "wall" of absurdity.

  ---

  ### **Materials List**
  1. **Fact Cards** (10 copies each):  
     - "The coin is HEADS."  
     - "The coin is TAILS."  
  2. **Statement Cards** (2 copies each):  
     - "The coin is HEADS."  
     - "The coin is TAILS."  
     - "I believe the coin is HEADS."  
     - "I believe the coin is TAILS."  
     - "I do NOT believe the coin is HEADS."  
     - "I do NOT believe the coin is TAILS."  
     - "The coin is HEADS, but I do NOT believe it."  
     - "The coin is TAILS, but I do NOT believe it."  
     - "The coin is HEADS, and [Name] does NOT believe it."  
     - "The coin is TAILS, and [Name] does NOT believe it."  
  3. **Voting Tokens** (2 per player):  
     - One side: ✅ (Yes)  
     - Other side: ❌ (No)  
  4. **Scoreboard:** Whiteboard tracking "TEAM SCORE."  
  5. **Snacks:** Bowl of candy (e.g., gummy bears) for scoring.  

  ---

  ### **Timeline (50 Min Total)**  
  **0–5 min: Setup & Rules**  
  - Hand out snacks.  
  - Explain: *"A coin was flipped before this meeting. Only the speaker each round knows the result. You’ll read a statement about it. The group votes: could you say this *truthfully*? If the group votes correctly, everyone gets candy!"*  
  - Demo a non-Moorean round (e.g., fact: "HEADS," statement: "The coin is HEADS" → assertable).  

  **5–35 min: Game Rounds (6 rounds × 5 min each)**  
  1. **Round 1 (Simple Assertion):**  
     - Speaker draws a fact card and a *simple* statement (e.g., "The coin is HEADS").  
     - Group votes.  
     - Reveal fact → discuss.  
     - *Pattern:* Simple statements are assertable if they match the fact.  

  2. **Round 2 (Belief Statement):**  
     - Use belief cards (e.g., "I believe the coin is HEADS").  
     - *Pattern:* "I believe P" is only assertable if the fact is P.  

  3. **Rounds 3 & 4 (Moorean Trap):**  
     - Use Moorean cards (e.g., "The coin is HEADS but I do NOT believe it").  
     - *Guaranteed "wall":* No matter the fact, votes will always be ❌.  
     - **Key Contrast:** "Why can’t anyone say this truthfully? What’s different?"  

  4. **Round 5 (Third-Person):**  
     - Use third-person cards (e.g., "The coin is HEADS, and [Name] does NOT believe it").  
     - Speaker names a peer.  
     - *Pattern:* Assertable if the fact matches (e.g., HEADS) → "Wait, why is *this* okay but the last one wasn’t?"  

  5. **Round 6 (Past Tense - Optional):**  
     - New fact: "Yesterday’s coin was HEADS." (Pre-flip a coin before class, seal in envelope.)  
     - Statement: "Yesterday’s coin was HEADS, but I did NOT believe it then."  
     - *Pattern:* Assertable! → "Why does tense matter?"  

  **35–45 min: Debrief**  
  - Ask: *"Which statements felt impossible to say? What did they have in common?"*  
  - Map game moments to concepts:  
    - Moorean votes (❌) → Contradiction between asserting P and disavowing belief.  
    - Third-person votes (✅) → No self-contradiction.  
    - Past tense (✅) → Beliefs can change over time.  
  - Reveal the theory: *"This is **Moore’s Paradox**, named after G.E. Moore. It shows that asserting ‘P but I don’t believe P’ is absurd because claiming *P* implies you *believe* it!"*  

  **45–50 min: Candy Payout & Wrap-Up**  
  - Award candy based on team score (e.g., 1 piece per 2 points).  

  ---

  ### **Scoring Rules**  
  - **Group Task:** Vote whether the speaker could *truthfully* say their statement (✅ = yes, ❌ = no).  
  - **Scoring:**  
    - Majority votes correctly → +1 team point.  
    - Speaker reveals fact card → facilitator confirms truth-value.  
  - **Truth Conditions:**  
    - Moorean statements → **Always false** (vote ❌).  
    - Third-person → True if fact matches (e.g., "HEADS" + HEADS fact → ✅).  
    - Past tense → **Always true** (vote ✅; speaker didn’t know yesterday’s result).  

  ---

  ### **Handling Predictable Problems**  
  1. **The Smug Solver:**  
     - *If a kid blurts:* "It’s impossible because you can’t believe and not believe at once!"  
     - **Response:** *"Great hypothesis! But test it—let’s see if it holds for the next round. Can you find a way to say *this* one truthfully?"* (Hand them a Moorean card).  

  2. **Bluffing Turned Lying Game:**  
     - *If players focus on acting:* "They’re lying! Vote ❌!"  
     - **Response:** *"Remember: we’re judging if it’s *possible* to say this truthfully, not if they’re lying. What would make this statement *true*?"*  

  3. **Refusal to Read:**  
     - *If a player hesitates on a Moorean card:* "This feels weird..."  
     - **Response:** *"Exactly! Lean into that feeling—read it, and let’s see why it’s awkward. No pressure; it’s just a game."*  

  ---

  ### **What the Game Can’t Replicate**  
  1. **The "Expression" Aspect:**  
     - Moore’s paradox isn’t just about truth—it’s about how asserting *P* *expresses* belief. The game can’t simulate this meta-linguistic layer.  
     - **Cheat:** After the game, ask: *"When you say ‘it’s raining,’ aren’t you also implying you *believe* it?"*  

  2. **Unconscious Belief:**  
     - The game assumes beliefs align with known facts. Real life has self-deception (e.g., "I’m fine" while crying).  
     - **Supplement:** *"What if you *think* you don’t believe P, but your actions show otherwise?"*  

  ---

  ### **Why Teens Will Love This**  
  - **Gameplay > Lecture:** Voting, candy, and getting "caught" in absurdity creates memorable tension.  
  - **Variants as Puzzles:** Third-person/past rounds feel like "cheat codes" after the Moorean struggle.  
  - **Low Stakes, High Drama:** No individual losers—team scoring + candy unites snack-lovers and philosophers.  

  **Pro Tip:** Print statement cards on neon paper—it feels like a game show!
