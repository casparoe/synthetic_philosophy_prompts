prompt: |-
  I'm on the board of a small nonprofit, nine of us, all volunteers, and we vote on things like whether to take a grant that comes with strings attached or whether to fire the person who does our books. A couple years ago somebody forwarded around a short summary of Condorcet's jury theorem and it sort of became our in-joke: as long as each of us is more likely right than wrong, nine voters beats one voter, and if we had a hundred of us we'd basically never get it wrong. I did the arithmetic myself for our setup and got about 90% that a majority of nine is right if each of us is 70% right, which matched the summary, so I felt pretty clever. Now we're talking about expanding the board to fifteen and one of the older members is objecting on the grounds that the theorem doesn't apply to us at all, and I want to figure out whether he's right or just being difficult.

  Here's the thing I can't get straight in my head. Our votes are obviously correlated in some sense — we all work from basically the same material, the same director's report, the same two people who do the background reading, and honestly the same local news. But we vote by secret ballot and we've made a rule not to discuss anything before a vote, so in the ordinary sense of the word each of us really is deciding for ourselves. So which sense of independence does the theorem actually need, and why isn't the no-talking kind enough? I want the mechanics, not just the warning label. Like take the extreme case: suppose all nine of us read the same one page and are basically repeating it back. Is the majority then exactly as reliable as a single one of us, no better no matter how big the board gets? And is that a limiting case of the same theorem or a different result entirely? Related to that — the objector also said that if we're each less than 50% likely to be right, adding members makes us actively worse, which spooked a few people. But if we're all just echoing each other, does that doom scenario even apply, or does the echo chamber ironically protect us from it?

  And there's a second knot underneath all of this that I keep failing to pull apart. People say shared information is bad for group decisions, but that seems too glib, because reading the same good report is exactly what makes each of us individually more likely to be right, and individual competence is supposed to be the good ingredient. So when does everyone drawing on the same source help and when does it hurt, and is there any sensible way to think about how much of our 70% comes from stuff we all share versus stuff each of us happens to know seperately? I'd like a real conceptual explanation of what the assumption is doing and where the guarantee comes from — a made-up example with small numbers is fine, that's actually how I think best. Please don't hand me a list of papers or books to go read, I'm not a student and I'm not going to chase down references, I just want to understand it well enough to argue with this guy on tuesday.
reasoning: |-
  Okay, the user is on a nonprofit board and they're dealing with Condorcet's jury theorem. They expanded the board to nine members and now want to go to fifteen, but one member objects. The theorem was their in-joke, assuming each member is 70% competent, giving 90% accuracy for nine. The objection is about independence—votes are correlated because they share materials but vote secretly without discussion. The user wants to understand why independence matters and if shared information hurts.

  First, I need to recall Condorcet's theorem. It assumes voters are independent and each has a competence >50%. The probability of a correct majority increases with group size. But independence is key. If votes are correlated, the theorem doesn't hold. The user mentioned shared materials and no discussion. Secret ballots prevent influence, but if everyone uses the same info source, their votes aren't independent. Even without talking, if they all rely on the same report, errors in that report affect everyone. That's the issue.

  The user's example: if all nine read the same one-page report, the majority is only as good as that single source. Adding more people doesn't help. That's a case of perfect correlation. The theorem needs statistical independence, meaning one person's vote doesn't affect another's, conditional on the truth. But shared info sources create common errors.

  Then there's the doom scenario: if competence <50%, adding members worsens accuracy. But if votes are correlated, does that still happen? In the echo chamber, if the shared info is biased, adding members amplifies the bias. So yes, it still applies if the shared source is flawed.

  The user also asks about shared info being both good and bad. Shared info increases individual competence (good) but reduces independence (bad). The net effect depends on which factor dominates. For example, if shared info boosts competence from 55% to 70%, that's good. But if the group is large, the loss of independence might outweigh that. There's a trade-off. The user needs to grasp that both aspects matter.

  The user wants a conceptual explanation with examples. They mentioned thinking well with small numbers. So I should use a simple example, like three voters sharing info. Maybe show how shared data affects correlation. Also, they need to argue their point by Tuesday, so clarity is crucial. No jargon, no references—just clear, practical examples.

  Underlying needs: The user wants to convince the board member that expanding is still beneficial despite shared info. They need to show that while independence isn't perfect, the current setup has some diversity. Maybe suggest ways to introduce varied info sources. Also, address the fear that adding members could worsen decisions if competence drops below 50%, but reassure that 70% is safe.

  I should structure the answer by first explaining independence in the theorem, then how correlation breaks it, the echo chamber effect, the doom scenario with correlation, and the trade-off between competence and independence. Use a three-voter example to illustrate. Finally, advise on improving independence without sacrificing competence.
answer: |-
  You're wrestling with a deep and practical issue in group decision-making. Let's break this down conceptually with examples. I'll address your core questions in order:

  ### 1. What Kind of "Independence" Does Condorcet Need & Why Isn't "No Talking" Enough?
  *   **The Theorem Assumes *Statistical Independence*:** This means the probability that *your* vote is correct is **unaffected by whether *my* vote is correct or incorrect**, *given the true state of the world*. It's not just about not talking or not being influenced by each other's *opinions* during the vote.
  *   **Why Shared Materials Violate This:** Imagine the true facts are represented by a hidden number, say "42". You all get information *about* "42". The problem is the *source* of your information.
      *   **Independent Sources (Ideal):** You read Report A (drawn from a huge pool), I read Report B (drawn independently), another member reads Report C. While each report might have errors, the *errors* are likely unrelated. If Report A misleads you, there's a good chance Report B or C gets it right. Condorcet's magic works here.
      *   **Shared Source (Your Reality):** You *all* read the *same* Director's Report and the *same* two background readings. If that Director's Report contains a critical error (e.g., it misstates a grant condition or misrepresents the bookkeeper's performance), it misleads *all* of you simultaneously. Your votes become highly correlated because your information has a massive common source. The *errors* are shared. "No talking" prevents you from swaying each other *based on your interpretations*, but it doesn't change the fact that you were all fed the same potentially flawed data.
  *   **The Extreme Case Explained:** Suppose all 9 of you read *only* the same single page report. Your vote is 100% determined by that page.
      *   If the page is correct, all 9 vote correctly.
      *   If the page is wrong, all 9 vote incorrectly.
      *   The majority vote (9-0) is correct *only* if that single page is correct. Adding 6 more members who also *only* read that same page doesn't help at all! The reliability of the group majority is **exactly equal to the reliability of that single page report** (or the single person who wrote it). It doesn't matter if the board has 9, 15, or 100 members; the outcome hinges entirely on one source.
      *   **Is this Condorcet?** It's a *limiting case* where the theorem catastrophically fails because the independence assumption is completely violated. Condorcet requires individual decision *processes* to be independent *sources* of judgment, not just independent expressions of the *same* judgment source.

  ### 2. The "Doom Scenario" (Competence <50%) with Correlated Votes
  *   **Condorcet's Warning:** If each member is *individually* less than 50% likely to be correct (p < 0.5), then adding *more* independent members makes the *majority more likely to be WRONG*. The probability of an incorrect majority approaches 100% as the group size increases.
  *   **With Correlation (Echo Chamber):** This doom scenario **still applies, and can be even worse**.
      *   *Shared Biased Source:* Suppose your shared Director's Report has a systematic bias (e.g., it always overstates risks). If this bias makes each individual voter *less* than 50% likely to get the *true* best answer (p < 0.5), then adding more members who rely *solely* on that same biased report makes the incorrect majority vote *even more certain*. The echo chamber amplifies the bias.
      *   *Does it "Protect" You?* **No.** The echo chamber only "protects" you from the doom scenario in the *extremely specific* case where the *shared source itself* is *more* than 50% reliable *and* the group is small enough that random individual variation *might* occasionally overcome the shared error. For example, if the single flawed report is right 60% of the time (p=0.6), a group of 3 correlated voters still has a 60% chance of being correct (same as the report). A group of 3 *independent* voters (p=0.6 each) would have a ~65% chance. But if the shared source is biased *below* 50% (p<0.5), the correlated group is doomed just like the independent group (and faster, as adding members changes nothing but size). The echo chamber offers no magical safety if the shared foundation is rotten.

  ### 3. The Shared Information Paradox: Good (Competence) vs. Bad (Correlation)
  This is the crux. Shared information is a double-edged sword:

  *   **The Good:** Shared, *high-quality* information (like a good Director's Report) **directly increases individual competence (p)**. If reading the report boosts each member's individual chance of being right from 55% to 70%, *that's a huge win for individual accuracy*.
  *   **The Bad:** Relying *too heavily* on the *same* information source **destroys the statistical independence** needed for Condorcet's group accuracy amplification to work optimally. The group's collective wisdom becomes overly dependent on that single source.

  **The Trade-Off & Net Effect (Illustrated with a 3-Voter Example):**

  Imagine deciding if a grant's "strings" are acceptable. The truth is either "Accept" or "Reject". Assume voters get info from shared and unique sources.

  *   **Scenario A (Pure Shared Info - High Corr.):** All 3 rely *only* on the same Director's Report. Suppose this report is 70% accurate (p=0.7).
      *   Probability Majority Correct = Probability Report Correct = **70%**.
  *   **Scenario B (Pure Independent Info - Low Comp.):** Each gets unique, low-quality info. Suppose each has p=0.55 independently.
      *   Probability Majority Correct: All 3 right (0.55^3) + 2 right/1 wrong (3 ways * 0.55^2 * 0.45) = 0.166 + 3*0.136 = 0.166 + 0.408 = **57.4%**.
  *   **Scenario C (Mixed Info - Realistic):** Shared Report (70% acc.) + *Some* unique perspective/experience/reading each member has (say, adding +5% accuracy *independently*). Individual p = 0.75. But votes are *correlated* due to the shared report.
      *   **How Correlation Works Here:** If the shared report is *wrong* (30% chance), it's likely *all* 3 are wrong (unless unique info saves them). If shared report is *right* (70%), each still has a 75% chance to be right overall.
      *   **Calculate Majority Likelihood:**
          *   P(Shared Report Correct) = 0.7. Then P(Majority Correct | Report Correct) = P(at least 2 right) with p=0.75: All 3 right (0.75^3 = 0.4219) + 2 right (3 * 0.75^2 * 0.25 = 3 * 0.1406 = 0.4219) = **0.8438**.
          *   P(Shared Report Wrong) = 0.3. Then P(Majority Correct | Report Wrong) = P(at least 2 right *despite* bad report). This requires unique info to overcome the bad report. P(individual right | report wrong) = P(unique info saves them) = 0.05? (This is fuzzy, but assume it's low). Let's pessimistically say P(Individual Right | Report Wrong) = 0.10. P(Majority Correct | Report Wrong) = P(at least 2 right): All 3 right (0.1^3=0.001) + 2 right (3 * 0.1^2 * 0.9 = 3 * 0.009 = 0.027) = **0.028**.
          *   **Net P(Majority Correct):** (0.7 * 0.8438) + (0.3 * 0.028) = 0.59066 + 0.0084 = **59.9%**.
  *   **Scenario D (Independent w/ Higher Comp.):** Same individual competence (p=0.75) *but* statistically independent decisions (highly unrealistic if sharing core materials, but for comparison).
      *   P(Majority Correct) = P(at least 2 right): All 3 right (0.75^3=0.4219) + 2 right (3 * 0.75^2 * 0.25 = 3 * 0.1406 = 0.4219) = **84.38%**.

  **What this Example Shows:**

  1.  **Pure Shared Info (A):** Good individual competence (70%), but *zero* group wisdom benefit. Group = Single Source.
  2.  **Pure Independent Info (B):** Low individual competence (55%), *some* group benefit (57.4% > 55%), but still low overall.
  3.  **Mixed Info - Realistic (C):** Higher individual competence (75%) *due* to shared good info + some independence. Group benefit exists (59.9% > 55% from B) but is *severely muted* (59.9% vs. 75% individual) by correlation. It's better than low independence/low competence (B), but worse than high independence/high competence (D).
  4.  **Ideal Independent (D):** Shows the *potential* power of Condorcet (84.4% group from 75% individual).

  **The Conceptual Takeaway:** Shared information primarily **boosts individual competence (p)**. Independence **enables the group to leverage diverse errors to amplify correctness beyond individual p**. Your board uses shared info to get p=0.7 (good!), but the heavy reliance on the *same* source means your group accuracy (~75-80% for 9 voters? See below) is much closer to the individual p=0.7 than Condorcet's "90% for independent voters" prediction. You get the competence boost but miss most of the diversity amplification.

  ### What This Means for Your Board & Argument on Tuesday

  1.  **Your Critic is Partially Right (and Useful):** He's absolutely correct that uncritical application of Condorcet's theorem is invalid due to correlated information sources. Your "90%" calculation is overly optimistic *if interpreted as the pure Condorcet result*. The shared materials significantly reduce the *additional* accuracy gain you get from adding more members.
  2.  **...But Expansion Still Likely Helps (Just Less):** Expanding from 9 to 15 *does* likely increase accuracy, just not as dramatically as Condorcet predicts for independent voters. Why?
      *   **Dilution:** While core materials are shared, unique perspectives, experiences, interpretations, and ways of processing info *do* exist. Adding 6 more people adds 6 more slight variations, slightly reducing the *correlation*. It makes it *less* likely that a single error source will doom the entire vote.
      *   **Competence Preservation (Hopefully):** Assuming new members are as competent (p~0.7), the sheer number makes it *slightly* harder for random individual errors (that aren't caused by the shared report) to swing the vote incorrectly. Think Scenario C vs. Scenario A.
      *   **Simple Math:** Even with high correlation, if your group isn't *perfectly* correlated (like the single page), adding members *usually* (but not always) helps a bit. Suppose your 9 are 80% reliable as a group due to correlation. Adding 6 competent members might nudge that to 82-83% if they bring even a sliver of new perspective.
  3.  **The Doom Scenario is Moot (For Now):** Your individual competence is estimated at 70% (>50%). Adding members *cannot* make you *worse* off *on average* than a smaller group, even with correlation. (It could make a specific vote worse, but overall reliability should stay the same or improve slightly). The doom scenario only kicks in if p<50%, which isn't your case.
  4.  **Argument Strategy:**
      *   **Acknowledge Validity:** "You raise a really important point about the theorem's assumptions. Our shared information definitely means we don't get the full 90% benefit pure independence would give. The '90%' was always an oversimplified in-joke."
      *   **Focus on Realistic Benefits:** "However, our votes aren't *perfectly* correlated. We all bring different experiences and interpretations to the *same* materials. Adding more competent members (p~70%) still slightly increases the chance that diverse perspectives catch something the core materials miss or balance out individual misjudgments *not* caused by the report. It makes us *slightly* more robust."
      *   **Address the Fear:** "The warning about p<50% is real in theory, but thankfully our individual track record suggests we're well above that 50% threshold. Adding competent members above 50% can't hurt our overall reliability."
      *   **Suggest Mitigation (Optional):** "To get *more* benefit from a larger group, maybe we could *lightly* diversify info sources where feasible – e.g., ask the Director to flag 1-2 key alternative viewpoints in the report, or have different board members briefly scan different news sources relevant to major votes."

  **In essence:** Condorcet needs voters to be independent *sources of judgment*, not just independent *expressions of the same judgment source*. Shared information boosts individual skill but links your errors. Expanding your board still adds value by slightly diluting this correlation and adding more competent eyes, just less value than the pure theorem suggests. Your critic is rightly pointing out the oversimplification, but expansion is still a sensible move. Good luck on Tuesday!
