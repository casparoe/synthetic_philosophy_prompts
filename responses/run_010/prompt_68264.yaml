  Structure-wise, couplets must be self-contained yet cohesive. The final couplet will weave in a name like "Naseem" (meaning "breeze" or "gift") to honor the maqta tradition. Rhyme scheme: second lines end with sounds like "-ight" (light, bright, night) for musicality. I'll avoid direct references to ethics terms, trusting readers to recognize the "minimize-violations" critique in one couplet and the "hands-clean" defense in another. 

