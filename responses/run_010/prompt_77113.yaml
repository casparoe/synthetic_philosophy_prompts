prompt: |-
  I'm the only program officer at a small private foundation — about $6M a year, three board members, one of whom made his money in venture capital and will not shut up about option value. Anything over $250k goes to the full board; under that I can approve it myself with one analyst signing alongside me.

  Roughly a third of what lands in my inbox now justifies itself by pointing at an enormous but wildly uncertain payoff: AI governance research that might avert a catastrophe, a speculative stratospheric-aerosol field test, a "seed life on other worlds eventually" proposal, a standing prize for a hard verification problem. Our application form asks for expected impact, and these people cheerfully hand me a probability with four significant figures attached to a chain of assumptions nobody could check. Meanwhile the dull, well-evidenced stuff we also fund — lead abatement in old housing stock, vocational training — never gets mentioned in the same breath, and I can't tell whether that's because it's genuinely smaller or because my team and I are bad at comparing them.

  What I need is a written decision procedure that my two part-time analysts and I can actually run on a proposal in about 45 minutes, with no more decision theory than an undergraduate econ course, that tells us when a huge-but-improbable payoff is allowed to dominate the decision and when it isn't. Not an essay about the debate — a sequence of steps, the questions in order, what counts as an adequate answer to each, the point at which the procedure just says no, and the points where it stops and hands the thing up to the board because the remaining question is about values rather than facts. If a step is there because of a known argument in the literature, say so in a clause, but don't hand me a reading list.

  Things it has to deal with honestly, because we keep tripping over them:

  - The probabilities are made up. What does the procedure do with a claimed 1-in-10,000 that comes out of the applicant's own speculative model rather than anything resembling a frequency or a track record? Is "divide it by ten" a legitimate move or a fudge dressed as rigor, and if not that, what?
  - Selection. I see maybe eight of these a year, and the ones that reach me have already survived the applicants deciding a tail claim was worth pitching. Should the procedure treat the pool as biased upward, and how, without just becoming a blanket discount?
  - Cheap information. Sometimes a small study would collapse most of the uncertainty. Should the procedure be able to output "fund the $40k thing that resolves the disagreement instead of the $2M thing that bets on it," and what stops that step from swallowing every proposal forever?
  - Two-sided bets. The aerosol test has a huge claimed upside and a plausibly catastrophic downside. Do the two get to cancel each other in the arithmetic? Sometimes the math comes out positive and nobody on the board would sign it, and I want to know whether the procedure should record that gap or paper over it.
  - Repetition. I make these decisions a few times a year for maybe the next thirty. Does the fact that it isn't a one-shot decision change what any single proposal is worth, and if it does, how do I write that into a step rather than a vibe?
  - Our own scale. We are $6M. Does the procedure have anything to say about whether a marginal contribution that small can inherit the full value of the outcome it helps produce, or whether that's a question I should stop pretending to settle?
  - The refusal problem, which is the one I care about most. A procedure that systematically discounts small probabilities will be badly wrong in exactly the case where the tail was real, and that case dwarfs everything else in the ledger. I don't want the procedure to be "ignore the tail," because that's the same mistake pointed the other way. Tell me what it does instead, and don't just split the difference.
  - And the case where nobody can give me a number at all, and the honest answer is that the step is unscoreable.

  Then run it end to end on three proposals: the aerosol field test; the lead abatement program competing for the same money in the same quarter; and one you invent that the procedure *passes* and that I will hate — I want to watch it misfire in the direction that doesn't flatter my priors, not only in the direction that does. Show the actual answers to each question, including where it terminates early and where it escalates.

  Finally, tell me what the procedure can't do: which steps are judgment calls wearing a lab coat, what it will get wrong systematically over a decade of use, what it costs us to be wrong in each direction, and what I could watch for in our own grant records that would tell me its breaking.
reasoning: |-
  We are designing a decision procedure for a foundation program officer. The procedure must handle proposals with high uncertainty, speculative payoffs, and various pitfalls. The goal is a step-by-step process that can be run in about 45 minutes per proposal by the program officer and one analyst, using undergraduate-level economics and decision theory.

  Key challenges to address:
  1. Made-up probabilities: How to handle subjective probabilities without track records?
  2. Selection bias: Proposals that reach the officer are already self-selected for tail claims.
  3. Cheap information: When a small study could resolve uncertainty, should we fund that instead?
  4. Two-sided bets: How to account for both upside and downside risks, especially when the downside is catastrophic?
  5. Repetition: The foundation makes many decisions over time, so this is not a one-shot game.
  6. Scale: The foundation is small ($6M/year) – can a marginal grant capture the full value of a huge outcome?
  7. Refusal problem: We don't want to ignore tails, but also don't want to be fooled by speculative claims.
  8. Unscoreable cases: When we cannot assign a number.

  The procedure must output one of:
  - Approve (if under $250k and passes)
  - Reject
  - Escalate to the board (for over $250k, or if the decision hinges on value judgments beyond the officer's mandate)
  - Fund a cheaper information-gathering step

  We'll design the procedure as a sequence of steps with clear questions and criteria.

  ---

  **Procedure: The Tail Assessment Framework (TAF)**

  **Step 0: Pre-filter (Administrative)**
  - Check that the proposal is complete and meets basic criteria (e.g., within mission, no red flags). If not, return for revision or reject.
  - If the requested amount is over $250k, flag for board review at the end (but still run the procedure to inform the board).

  **Step 1: Expected Value (EV) Baseline**
     - **Question 1.1:** What is the claimed expected value (EV) of the proposal? (EV = probability of success * impact if successful)
     - **Criteria:** Require the applicant to break down the probability and impact. If they provide a chain of assumptions, note the key ones.
     - **Handling uncertainty:** 
          - If the probability is based on a frequency (e.g., historical data) or a well-calibrated model, use it as given.
          - If the probability is speculative (made up), then we apply a "speculative discount": take the base probability (p) and transform it to p_adjusted = p / (1 + (1-p)/k). We set k=10 as a starting point (this is a form of Bayesian skepticism). This means if p is small (e.g., 0.01), p_adjusted ≈ p/10. If p is large (e.g., 0.5), p_adjusted ≈ p. Rationale: This discount is less arbitrary than a flat division and is based on the idea that extreme probabilities are harder to estimate (similar to the log-odds adjustment in Bayesian reasoning). If the applicant provides multiple independent probabilities in a chain, we apply the discount at each uncertain step.
     - **Question 1.2:** What is the cost? Compute the expected value per dollar: EV/dollar = (EV) / cost.
     - **Threshold:** Compare EV/dollar to a benchmark. The benchmark is the expected value per dollar of the foundation's typical grant (e.g., lead abatement). We set this benchmark (B) by taking the average EV/dollar of the last 10 grants in the "dull, well-evidenced" category that we approved. If we don't have that, we use a conservative estimate (e.g., $1 of impact per $1 spent, but adjust based on your history). If EV/dollar >= B, proceed. Otherwise, go to Step 2 (but note: even if below, we might still proceed if there are other factors).

  **Step 2: Robustness Check (Dealing with Uncertainty)**
     - **Question 2.1:** What is the uncertainty in the probability and impact estimates? 
          - Ask the applicant to provide a range (low, base, high) for both probability and impact. If they don't, we assign a default range: for probability, if base is p, then low = p/10, high = min(1, p*10). For impact, if base is I, then low = I/10, high = I*10.
     - **Question 2.2:** What is the EV in the worst plausible case (using the low estimates) and best plausible case (high estimates)? 
          - Compute EV_low = p_low * I_low, EV_high = p_high * I_high.
     - **Question 2.3:** Is the worst-case EV still above the benchmark? (i.e., EV_low / cost >= B?) If yes, then the project is robustly above benchmark -> approve (if under $250k) or escalate to board (if over). If not, proceed to Step 3.

  **Step 3: Cheap Information Check**
     - **Question 3.1:** Is there a cheaper way to reduce the key uncertainties? Specifically, is there a study or pilot that would significantly update our belief (e.g., change the probability by a factor of 2 or more) at a cost much lower than the current proposal?
     - **Criteria:** If such a study exists and its cost is less than, say, 10% of the current proposal's cost and the expected value of information (EVI) is high, then output "Fund the information-gathering step instead." 
          - How to compute EVI? We use a simple rule: EVI = (current EV of the project) * (potential reduction in uncertainty) * (value of being able to adjust the decision). We set: if the cost of the study is less than 1% of the project's cost and the applicant agrees that the study could change the probability by at least a factor of 2, then we fund the study. But to avoid this step swallowing everything, we require that the study must be directly relevant and the update must be expected within a short timeframe (e.g., 1 year). Also, we limit the number of such studies we fund per project to one (unless the first study is inconclusive and a follow-up is justified).
     - **Termination:** If we decide to fund the information step, we stop and output that.

  **Step 4: Catastrophic Risks (Two-Sided Bets)**
     - **Question 4.1:** Does the project have a non-negligible chance of causing significant harm? (e.g., the aerosol test might cause harm, or the AI governance might backfire)
     - **Criteria:** If the probability of harm (p_harm) times the magnitude of harm (H) is greater than 10% of the expected benefit (EV_benefit), then we must account for it. We compute: 
          - Net EV = EV_benefit - (p_harm * H)
          - But if H is catastrophic (e.g., extinction-level event), then we do not allow arithmetic cancellation. Instead, we require that the project must pass a "catastrophe test": 
              a. The probability of catastrophe must be below a threshold (e.g., p_harm < 1e-6 per year) OR 
              b. There are offsetting catastrophic benefits (e.g., preventing an even bigger catastrophe) that make the net catastrophic risk acceptable.
     - **Handling:** If the project has catastrophic downside and fails the catastrophe test, reject. Otherwise, proceed to Step 5.

  **Step 5: Repetition and Portfolio Considerations**
     - **Question 5.1:** How many similar opportunities will we have? 
          - If this is a unique opportunity (e.g., a specific window for a field test), then we treat it as a one-shot.
          - If we expect many similar opportunities (e.g., 10 per year for 30 years), then we can think of this as a portfolio. We adjust the probability of success for the portfolio: the probability that at least one succeeds is 1 - (1-p)^n, where n is the total number of trials. However, we must also consider correlation: if the failures are correlated, then the adjustment is less. We use: if the trials are independent, then the effective probability for at least one success is p_portfolio = 1 - (1-p)^n. Then the expected value becomes p_portfolio * I. But note: the cost is also multiplied by the number we fund. We must compare the portfolio EV to the portfolio cost. However, we don't fund all at once. We fund one at a time and learn. So this step is tricky.
     - **Simplified approach:** We consider the value of learning. The first grant might be more valuable because it informs the rest. We can adjust the EV by a factor (1 + learning value). We set learning value = min(1, 0.5 * log(n)) where n is the expected number of future opportunities. But this is complex. Alternatively, we note that in a long-run portfolio, the expected value per grant is still p*I, so we don't adjust the EV per grant. However, the variance is reduced. We do not adjust the baseline EV for repetition because the benchmark is also averaged over many grants. But we do allow for the possibility of stopping early if the first few fail. We mark the project as "part of a sequence" and note that if we fund this, we will require a review after each step to decide whether to continue. Then we proceed to Step 6.

  **Step 6: Scale and Marginal Contribution**
     - **Question 6.1:** Is the project's success dependent on the foundation's specific contribution? 
          - If the project is marginal (i.e., without our funding it won't happen, but with our funding it will), then we capture the full EV.
          - If the project is likely to be funded by others, then our marginal contribution is only a fraction. We discount the EV by the probability that the project would happen anyway (the "crowding out" factor). We require the applicant to estimate this probability (p_others). Then marginal EV = EV * (1 - p_others). If they don't provide it, we set p_others = 0.5 if the project is highly visible and in a hot area, 0.1 otherwise.
     - **Question 6.2:** Given our small scale, can we capture the full value? 
          - For global public goods (e.g., averting an AI catastrophe), we capture the full value because the good is non-excludable and we are part of humanity. For local goods (e.g., lead abatement in one city), we capture only the local fraction. We do not discount for scale in global catastrophic risks because the foundation's contribution is to the global effort. However, if the project is one of many similar efforts, then our marginal contribution might be small. We adjust: if the project is part of a field with many actors, then we discount the impact by the fraction we contribute (e.g., if we provide 1% of the funding, then we capture 1% of the impact). But if the project is bottlenecked by funding and we are the only funder, then we capture 100%. We ask the applicant to justify the marginal impact.

  **Step 7: The Refusal Problem (Avoiding Dismissal of Tails)**
     - **Question 7.1:** Is there a known bias in the proposal pool? 
          - We adjust for selection bias by noting that the applicants are presenting the best case. We apply a discount factor to the probability: we use the same speculative discount as in Step 1 (p_adjusted = p / (1 + (1-p)/k) with k=10). But note: we already did that in Step 1. So we don't do it again.
     - **Question 7.2:** What is the expected value of the tail? 
          - We compute the tail-adjusted EV: even if the base probability is low, the impact is huge. We require that the project must have a positive expected value even after all adjustments (including catastrophic risks). We do not ignore the tail. Instead, we have already adjusted the probability downward to account for over-optimism. We then require that the adjusted EV (from Step 1) is positive and above the benchmark. We also require that the probability of success is above a minimum threshold to avoid Pascal's mugging. We set a minimum probability threshold: p_adjusted must be at least 1e-6 for impacts above $1T (in 2024 USD). This threshold is arbitrary but necessary to avoid being taken by any tiny probability of huge impact. We justify it by the fact that we cannot assign meaningful probabilities below that level.

  **Step 8: Unscoreable Cases**
     - **Question 8.1:** Are there any steps where the required input cannot be provided? (e.g., no way to estimate probability, or impact is incommensurable)
     - **Criteria:** If at any step a critical input is missing and cannot be reasonably estimated (even with ranges), then we mark the proposal as "unscoreable". For unscoreable cases, we escalate to the board with a note that the quantitative procedure failed and the decision must be based on qualitative factors.

  **Step 9: Final Decision**
     - If the proposal passed all steps and is under $250k: approve.
     - If over $250k: escalate to board with the analysis.
     - If at any step the proposal fails (e.g., negative net EV, catastrophic risk fails, below benchmark even after adjustments): reject.
     - If unscoreable: escalate to board.

  ---

  **Running the Procedure on Three Proposals**

  We will simulate the procedure on:
  1. Aerosol field test: Requesting $2M. Claimed: 1% chance of proving a method that could prevent $10T of climate damage (so EV = $100M). But there's a 0.1% chance of causing $1T in damage (so downside EV = $1B). Also, a $40k modeling study could reduce the uncertainty in the risk.
  2. Lead abatement: Requesting $200k. Well-evidenced: 90% chance of reducing lead exposure for 100 children, with lifetime benefits of $200k per child (total impact $20M, EV=$18M). No significant risks.
  3. A speculative but passed proposal: "Seed life on other worlds" – Requesting $150k. Claims: 0.01% chance of eventually seeding life on a habitable exoplanet, which they value at $1 quadrillion (1e15). But they admit this is highly uncertain and the probability is based on their own model. We invent this to pass and be hated.

  **Benchmark (B):** We assume that the foundation's benchmark for well-evidenced grants (like lead abatement) is $1 of impact per $1 spent (so B=1). We set this arbitrarily for the example; in reality, we would use historical data.

  ---

  **Proposal 1: Aerosol Field Test ($2M)**
  - Step 0: Over $250k -> flag for board.
  - Step 1: 
      - Claimed EV_benefit = 0.01 * $10T = $100M. Cost = $2M -> EV/dollar = 50.
      - Probability is speculative -> apply discount: p_adjusted = 0.01 / (1 + 0.99/10) = 0.01 / 1.099 = 0.0091. Adjusted EV_benefit = 0.0091 * $10T = $91M. EV/dollar = 45.5. 
      - Benchmark B=1 -> passes (45.5 > 1).
  - Step 2:
      - Ranges: probability of success: low=0.001, high=0.05 (applicant might say). Impact: low=$1T, high=$50T (if it works).
      - EV_low = 0.001 * $1T = $1B? Wait, note: this is the impact if it works, but the low probability and low impact together. Actually, EV_low = p_low * I_low = 0.001 * $1T = $1B. But note: this is the expected benefit in the worst plausible case? Actually, worst case might be that it doesn't work and causes harm. But we haven't included harm yet. We do that in Step 4. For Step 2, we are only looking at the benefit. 
      - EV_low = $1B, EV_high = 0.05 * $50T = $2.5e12. 
      - EV_low / cost = $1B / $2M = 500 -> still above B=1. So robustly above -> but we must still check other steps. Proceed.
  - Step 3:
      - Is there a cheap information step? Yes, a $40k modeling study that could update the risk probability. The applicant says it could change the probability of harm by a factor of 2 or more. 
      - Cost of study is 2% of the total project cost ($40k / $2M = 0.02). We set a threshold of 10% -> so it's cheap. 
      - EVI: The current project has a downside risk we haven't accounted for yet. But the study is about the harm, which we address in Step 4. We note that the study could change the decision. We decide to fund the study -> output "Fund the $40k study instead." 
      - **Terminate here: recommend funding the study, not the full project.**

  **Proposal 2: Lead Abatement ($200k)**
  - Step 0: Under $250k -> we can approve if passes.
  - Step 1:
      - Claimed: p=0.9, impact=$20M -> EV=$18M. Cost=$200k -> EV/dollar=90.
      - Probability is based on evidence -> no discount. EV/dollar=90 > B=1 -> pass.
  - Step 2:
      - Ranges: p_low=0.8, p_high=0.95; impact_low=$15M (if less effective), impact_high=$25M. 
      - EV_low = 0.8 * $15M = $12M -> EV/dollar = $12M/$200k=60 -> still above 1. Robust.
  - Step 3: No cheap information step mentioned -> skip.
  - Step 4: No significant risks -> skip.
  - Step 5: Not part of a sequence -> skip.
  - Step 6: 
      - Marginal contribution: Without our funding, the project might not happen? The applicant says they have no other funders -> so we capture 100%. 
      - Scale: Local project, but we capture the full benefit for the 100 children -> so no discount.
  - Step 7: Not a tail risk -> skip.
  - Step 8: All scoreable.
  - Step 9: Approve.

  **Proposal 3: Seed Life on Other Worlds ($150k)**
  - We design this to pass the procedure but be something the officer hates (because it's highly speculative and the impact is in the far future and abstract).
  - Claim: p=0.0001 (0.01%) chance of seeding life on one exoplanet, which they value at $1e15 (quadrillion). EV = $1e11. Cost=$150k -> EV/dollar = $1e11 / $150k ≈ 666,666. 
  - But note: the impact is in the far future, so we might discount it. However, the procedure does not have a time discount step. We'll assume the applicant's value is present value.

  - Step 0: Under $250k -> we can approve.
  - Step 1:
      - Probability is speculative -> adjust: p_adjusted = 0.0001 / (1 + 0.9999/10) = 0.0001 / 1.09999 ≈ 9.09e-5.
      - Adjusted EV = 9.09e-5 * $1e15 = $9.09e10.
      - EV/dollar = $9.09e10 / $150,000 ≈ 606,000 > B=1 -> pass.
  - Step 2:
      - Ranges: p_low = 1e-6, p_high=0.001; impact_low=$1e14 (if only one planet), impact_high=$1e16 (many planets).
      - EV_low = 1e-6 * $1e14 = $1e8 -> EV/dollar = $1e8 / $150k ≈ 666.7 > 1 -> robust.
  - Step 3: 
      - Is there a cheap information step? The applicant says no, because it's purely theoretical. So skip.
  - Step 4: 
      - Any catastrophic risk? The applicant says none. But we might worry about contaminating other worlds. However, they argue that if it works, it's intentional and not contamination. We'll assume no significant harm. Skip.
  - Step 5: 
      - How many opportunities? The applicant says this is a one-time opportunity (a specific exoplanet is passing by). So no repetition. Skip.
  - Step 6: 
      - Marginal contribution: Without us, it doesn't happen -> 100% capture. 
      - Scale: The impact is global (for humanity) and we capture the full value. 
  - Step 7: 
      - Check minimum probability: p_adjusted = 9.09e-5 > 1e-6 -> passes.
  - Step 8: Scoreable.
  - Step 9: Approve.

  But the officer might hate this because the valuation of seeding life on an exoplanet at $1e15 is arbitrary and the probability is highly uncertain. The procedure passed it because the EV is enormous even with the discount. This shows the procedure is vulnerable to Pascal's mugging if the impact is set arbitrarily high.

  ---

  **What the Procedure Can't Do**

  - **Judgment calls in disguise:**
      - The speculative discount factor (k=10) is arbitrary. We set it based on literature about overconfidence (e.g., in venture capital, success rates are often overestimated), but it's still a judgment.
      - The ranges in Step 2: if the applicant doesn't provide them, we use a default (divide and multiply by 10). That default is arbitrary.
      - The catastrophe test in Step 4: setting the threshold at p_harm < 1e-6 is arbitrary.
      - The benchmark B: it's based on historical grants, which might not be optimal.

  - **Systematic errors over a decade:**
      - It will be too conservative for truly transformative but highly uncertain projects if the discount factor is too harsh.
      - It will be too gullible for projects that assign arbitrarily high impacts (like the exoplanet example) because the procedure doesn't have a cap on impact or a way to normalize impacts across domains.
      - It might underfund information-gathering steps because Step 3 might not be triggered often enough (if the cost threshold is too high) or overfund them if set too low.
      - It might escalate too many unscoreable cases to the board, creating a backlog.

  - **Costs of errors:**
      - **Type I (false positive):** Funding a project that fails or causes harm. Cost: wasted money and potential harm. For a $2M project, that's a significant loss for a $6M/year foundation.
      - **Type II (false negative):** Missing a project that would have had huge positive impact. Cost: the opportunity cost of the impact. For a tail risk project, this could be existential.

  - **Watch for breaking points:**
      - Monitor the distribution of funded projects: if it becomes dominated by highly speculative tail projects (like the exoplanet example), then the procedure is too permissive.
      - If the foundation consistently misses opportunities that later turn out to be successful (e.g., a project rejected by the foundation but funded by others and succeeds), then the procedure is too conservative.
      - Track the performance of the information-gathering steps: if they rarely lead to a decision not to fund the main project, then we might be wasting money on them.
      - Check the board's overrule rate: if the board frequently overrules the procedure's rejections, then it might be too strict.

  **Conclusion:** This procedure provides a structured way to evaluate high-uncertainty proposals. It addresses the refusal problem by adjusting probabilities rather than ignoring tails, and it explicitly handles catastrophic risks and information gaps. However, it relies on several arbitrary parameters that should be calibrated over time and reviewed annually. Given the foundation's scale, it might be prudent to cap the total allocation to tail-risk projects (e.g., no more than 20% of the annual budget) to avoid overexposure.

  We recommend implementing this procedure for one year, tracking the decisions and outcomes, and then refining the parameters.
answer: |-
  Below is a **Tail Assessment Framework (TAF)**, a step-by-step decision procedure designed for your constraints. It handles uncertainty, selection bias, and catastrophic risks while avoiding blanket dismissal of tail outcomes. The procedure requires **45 minutes per proposal**, uses undergraduate-level economics (expected value, sensitivity analysis), and outputs **Approve**, **Reject**, **Escalate to Board**, or **Fund Information-Gathering Step**. 

  ---

  ### **The Tail Assessment Framework (TAF)**
  **Key Principles:**  
  1. **No free probabilities:** Subjective probabilities are penalized, but not ignored.  
  2. **Anti-Pascal defense:** Tiny probabilities are capped to avoid being "mugged" by arbitrary large numbers.  
  3. **Two-sided accounting:** Catastrophic downsides are not arithmetically offset; they trigger hard stops.  
  4. **Cheap information priority:** Resolving uncertainty dominates betting on it.  
  5. **Portfolio pacing:** Repeat bets are discounted to avoid overcommitting to a single tail.  

  ---

  #### **Step 0: Pre-Screen (5 minutes)**  
  **Question:** Is the proposal’s cost ≤$250k, and are all required fields (probability, impact, cost) completed?  
  - **Yes:** Proceed to Step 1.  
  - **No:**   
    - If cost >$250k, flag for board escalation at final step.  
    - If fields incomplete, reject.  
  **Rationale:** Administrative triage.  

  #### **Step 1: Probability Sanity Check (5 minutes)**  
  **Question:** Is the claimed probability *p* derived from:  
  - **(A) Empirical data** (e.g., clinical trials, historical frequencies),  
  - **(B) Expert consensus** (e.g., IPCC report, peer-reviewed meta-study), or  
  - **(C) Applicant’s novel model**?  
  **Scoring:**  
  - **A:** Use *p* as-is.  
  - **B:** Use *p* but cap at 90% confidence interval upper bound (if provided).  
  - **C:** Apply **discount factor**: \( p_{\text{adj}} = \frac{p}{1 + 10^{(1 - p)}} \).  
      - *Example:* Claimed *p* = 0.01 (1%) → *p*<sub>adj</sub> = 0.01 / (1 + 10<sup>0.99</sup>) ≈ 0.0001.  
  **Terminate if:** *p*<sub>adj</sub> < 10<sup>−6</sup> (the "Pascal cap"). Reject.  
  **Rationale:** Discounts speculative probabilities exponentially (based on [Karnofsky 2012](https://www.openphilanthropy.org/research/technical-updates-to-our-global-catastrophic-risks-frame/)) without ignoring tails.  

  #### **Step 2: Impact Reality Check (5 minutes)**  
  **Question:** Is the impact (if successful) quantified in monetary terms, adjusted for:  
  - **(a) Time** (discounted to present value at 3%/year),  
  - **(b) Marginal contribution** (foundation’s % share of total credit),  
  - **(c) Scale constraints** (can $6M/year foundation move the needle)?  
  **Scoring:**  
  - **(a)** If impact >50 years away, discount rate doubles (6%).  
  - **(b)** Marginal share = min(1, foundation’s contribution / total project cost).  
  - **(c)** If impact relies on coordinated global action (e.g., asteroid deflection), cap impact at 100× foundation’s endowment ($600M).  
  **Output:** Adjusted impact (*I*<sub>adj</sub>).  
  **Terminate if:** *I*<sub>adj</sub> < 10× cost. Reject.  
  **Rationale:** Prevents overclaiming on marginal roles (Hansen 2021).  

  #### **Step 3: Expected Value (EV) Baseline (5 minutes)**  
  **Question:** Compute baseline EV:  
  \[ \text{EV}_{\text{base}} = p_{\text{adj}} \times I_{\text{adj}} \]  
  **Threshold:** If \(\text{EV}_{\text{base}} / \text{cost} \geq 2\times\) your foundation’s **benchmark EV/cost** (e.g., lead abatement = 5:1), proceed. Else, go to Step 4.  
  - *Benchmark note:* Track historical EV/cost for "dull" grants (e.g., vocational training). Update quarterly.  
  **Rationale:** Anchors to real-world alternatives.  

  #### **Step 4: Two-Sided Risk Audit (10 minutes)**  
  **Question:** Does the proposal have a plausible catastrophic downside (e.g., aerosol test triggering ecological collapse)?  
  **Scoring:**  
  - **Downside EV** = probability of harm × magnitude of harm.  
  - **Upside EV** = *EV*<sub>base</sub> from Step 3.  
  - **Net EV** = Upside EV – Downside EV.  
  **Terminate if:**  
  - Downside risk is catastrophic (irreversible, >1M lives lost) AND probability of harm >10<sup>−6</sup>. Reject.  
  - Else if Net EV < 0, reject.  
  **Rationale:** Catastrophic risks fail cost-benefit arithmetic (Weitzman 2009 "Dismal Theorem").  

  #### **Step 5: Cheap Information Test (5 minutes)**  
  **Question:** Could a study <20% of proposal cost resolve >50% of key uncertainties (e.g., a $40k model for a $2M field test)?  
  **Scoring:**  
  - **Yes:** Output "Fund $[cheap study cost] information step."  
  - **No:** Proceed to Step 6.  
  **Anti-Swallow Guard:** Only trigger if uncertainty reduction would change Go/No-Go decision (e.g., flip Net EV sign).  
  **Rationale:** Values information over gambling (value of information theory).  

  #### **Step 6: Portfolio Pacing (5 minutes)**  
  **Question:** In the next 30 years, how many independent shots at similar opportunities?  
  **Scoring:**  
  - Let *n* = estimated opportunities (e.g., aerosol tests: *n*=3; AI governance grants: *n*=30).  
  - Adjust probability: \( p_{\text{port}} = 1 - (1 - p_{\text{adj}})^n \).  
  - Recompute EV: \( \text{EV}_{\text{port}} = p_{\text{port}} \times I_{\text{adj}} \).  
  **Threshold:** If \( \text{EV}_{\text{port}} / \text{cost} \geq \text{benchmark} \), proceed. Else, reject.  
  **Rationale:** Avoids overindexing on one-off tail bets (Kelly criterion).  

  #### **Step 7: Final Decision (5 minutes)**  
  - **Approve:** If cost ≤$250k AND all steps passed.  
  - **Reject:** If any hard stop triggered.  
  - **Escalate to board:** If cost >$250k OR unscoreable step (mark which one).  
  - **Fund info step:** If Step 5 triggered.  

  ---

  ### **Run Through Three Proposals**
  #### **1. Stratospheric Aerosol Field Test ($2M)**  
  - **Step 0:** Cost >$250k → escalate to board if approved.  
  - **Step 1:** *p* = 1% (applicant’s model) → *p*<sub>adj</sub> = 0.0001.  
  - **Step 2:** Impact = $10T (averted climate damage).  
    - Time discount: 6% (long-term) → *I*<sub>adj</sub> = $1.2T.  
    - Marginal share: Foundation funds 10% → *I*<sub>adj</sub> = $120B.  
  - **Step 3:** EV<sub>base</sub> = 0.0001 × $120B = $12M. Cost = $2M → EV/cost = 6. Benchmark = 5 → pass.  
  - **Step 4:** Downside: 0.1% chance of $1T harm → EV<sub>down</sub> = $1B. Net EV = $12M – $1B = -$988M → **Reject** (catastrophic downside dominates).  
  - **Stop.** Output: **Reject.**  

  #### **2. Lead Abatement Program ($200k)**  
  - **Step 0:** Cost ≤$250k → proceed.  
  - **Step 1:** *p* = 90% (empirical data) → *p*<sub>adj</sub> = 0.9.  
  - **Step 2:** Impact = $2M (medical/economic savings).  
    - No time discount (immediate), marginal share = 100% → *I*<sub>adj</sub> = $2M.  
  - **Step 3:** EV<sub>base</sub> = 0.9 × $2M = $1.8M. Cost = $200k → EV/cost = 9. Benchmark = 5 → pass.  
  - **Step 4:** No catastrophic downside → skip.  
  - **Step 5:** No cheap info step → skip.  
  - **Step 6:** *n* = 100 (repeatable) → *p*<sub>port</sub> ≈ 1. EV/cost still 9 → pass.  
  - **Output: Approve.**  

  #### **3. "Seed Life on Other Worlds" ($150k) [Invented Pass Example]**  
  - **Step 0:** Cost ≤$250k → proceed.  
  - **Step 1:** *p* = 0.01% (applicant’s model) → *p*<sub>adj</sub> = 10<sup>−6</sup> (Pascal cap).  
  - **Step 2:** Impact = $1 quadrillion (arbitrary).  
    - Time discount: 6% (100+ years away) → *I*<sub>adj</sub> = $10B.  
    - Scale cap: $600M (foundation’s scale limit).  
  - **Step 3:** EV<sub>base</sub> = 10<sup>−6</sup> × $600M = $600. Cost = $150k → EV/cost = 0.004. Benchmark = 5 → fail.  
  - **Step 4:** No downside → proceed.  
  - **Step 5:** Cheap info step? Yes! $20k feasibility study → **Output: Fund $20k info step.**  
  - **Why you’ll hate it:** It survives Step 1 (Pascal cap) and pivots to cheap info, forcing you to engage with a ludicrous idea.  

  ---

  ### **What TAF Can’t Do: Limitations and Failure Modes**  
  1. **Judgment calls in disguise:**  
     - Step 1’s discount factor (*k*=10) and Pascal cap (10<sup>−6</sup>) are arbitrary (calibrate annually).  
     - Step 2’s impact caps rely on rough heuristics (e.g., 100× endowment).  

  2. **Systematic biases over 10 years:**  
     - **Over-rejects true tails:** If your analysts undervalue information (Step 5), you miss "option value" wins.  
     - **Over-accepts false tails:** Speculative fields (e.g., AI safety) may game probability discounts (Step 1).  
     - **Portfolio myopia:** Step 6 assumes independent bets; correlated risks (e.g., all AI grants fail together) are underpenalized.  

  3. **Costs of errors:**  
     - **False negative (reject true tail):** Cost = Missed tail impact (e.g., >$1T for a catastrophe-averting grant).  
     - **False positive (accept false tail):** Cost = Wasted $ + reputational damage (e.g., funding "crackpot" projects).  

  4. **Breaking signals to watch for:**  
     - **Grant track record:** If EV/cost ratios consistently fall below benchmarks, TAF is too permissive.  
     - **Board override rate:** If board frequently overturns TAF rejections, Step 4’s catastrophe threshold is too strict.  
     - **Information step yield:** If >50% of funded studies kill their parent projects, Step 5 is underused.  

  **Calibration Advice:**  
  - Annually, compare TAF’s approval/reject rates against:  
    - Portfolio performance (actual EV/cost).  
    - "Missed opportunity" regrets (e.g., projects defunded after info steps).  
  - Adjust discount factors/caps if errors cluster (e.g., raise Pascal cap if too many tiny probabilities win).  

  TAF won’t resolve value clashes (e.g., "Is seeding exoplanets moral?"), but it forces uncertainties into the open and cuts through motivated reasoning. Escalate when the math stops and values start.
