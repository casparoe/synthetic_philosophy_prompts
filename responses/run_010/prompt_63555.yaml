prompt: |-
  We moved from Montreal to Lyon three years ago for my job, so I've now sat through school board and town hall meetings on both sides of the Atlantic, and I keep watching the same shape of argument play out and I can't find a word for it.

  A rule gets adopted that's announced as applying to everybody equally: no visible religious symbols in the classroom, no head covering on official ID photos, no prayer to open a council meeting. Nobody gets named. But in practice the rule only ever bites on groups whose faith requires something visible and hard to take off, while the majority's faith rides along in stuff the rule doesn't count as religious at all — the school calendar's December and April breaks, the village name, the chapel in the hospital, the handshake that's just "politeness."

  Here's the part I don't think is just disparate impact, which is the phrase people always reach for. The unevenness is invisible from inside the system, because the majority's practices have already been re-labelled as culture, heritage, or just how things are done, and only the minority's practices get tagged as religious. So the burdened group can't even frame a complaint: to say "this rule costs me something" they'd first have to get the state to admit the Christmas break is religious too, and that is never going to happen.

  Does this have an established name — the mechanism where one tradition quietly sets the baseline and the other tradition is the only thing that shows up as a deviation from it? I'm not after just a label. I want the nearest existing concepts, how this differs from each one, and where the edges are: does it also cover language requirements and workplace dress codes, or does it need religion specifically to work? If nothing established fits, coin a term and define it properly, boundary cases included.

  Answer in American English, please — I've been reading thier sources for months and my spelling has gone strange.
reasoning: |-
  Okay, the user is describing a recurring pattern they've observed in both Montreal and Lyon, where seemingly neutral rules disproportionately affect minority religious groups because the majority's practices are seen as cultural rather than religious. They want to know if there's a term for this mechanism and how it differs from similar concepts.

  First, I need to recall relevant terms. "Disparate impact" comes up, but they already mentioned it's not sufficient. That term is about unequal effects without intent, but here the key is the framing of what counts as religious. 

  Next, "cultural hegemony" by Gramsci fits—dominant groups setting norms as universal. But it's broad. Then "normative power" from sociology, where the majority defines what's normal. That seems closer. 

  "Majority bias" or "implicit establishment" from political theory might apply. "Christian privilege" is specific to religion but aligns with their examples. The challenge is finding a term that captures the reclassification aspect: majority practices labeled as culture, minority as religious. 

  "Secular camouflage" comes to mind—using secular justifications to mask religious dominance. But I should check if existing terms cover this. "Structural religious privilege" is another option, emphasizing systemic advantages. 

  I need to differentiate from "disparate impact." Here, the issue is the baseline definition, not just unequal outcomes. The user also asks about applicability beyond religion, like language or dress codes. The mechanism could extend there, but religion is central because of the secular/cultural label shift. 

  Boundary cases: In Quebec's Bill 21, religious symbols banned but crucifixes stayed as "cultural." In France, laïcité targets visible symbols, ignoring Christian holidays. Language rules might fit if majority language is framed as neutral. Workplace dress codes could exclude cultural attire if not recognized as necessary. 

  The best fit might be "normative power" or "majority-culture baseline." Coining "normative assimilation" or "unmarked establishment." But "normative power" is established. I'll explain it as the mechanism and mention related terms, then suggest "normative assimilation" as a new term if needed. Clarify edges: works best with religion due to secularism claims, but can apply elsewhere if there's a dominant norm reframed as neutral.
answer: |-
  You've perfectly dissected a pervasive and insidious mechanism that absolutely deserves a name. While no single term captures *every* nuance you describe perfectly, the closest established concepts and their distinctions are:

  1.  **Normative Power / Construction of the Norm:** (Sociology/Political Theory)
      *   **What it is:** This describes the power of a dominant group (here, the historically Christian majority) to define what is "normal," "neutral," or "default" within a society or institution. Their practices become the invisible baseline against which everything else is measured and often judged as "different," "deviant," or "marked."
      *   **How it fits:** This directly addresses the core mechanism: the majority tradition *is* the baseline ("culture," "heritage," "just politeness"), so only deviations from it (minority practices) are perceived as needing regulation or labeling as "religious."
      *   **Distinction:** It's broader than just religion. This power operates in many areas (language, gender, race). Your case is a specific application where normative power defines what counts as "religion" vs. "neutral culture." It explains *why* the unevenness is invisible internally – the norm is accepted as simply "the way things are."
      *   **Edge:** This *is* the fundamental mechanism. The other terms below describe specific manifestations or consequences of it within the religious/secular context.

  2.  **Implicit Establishment / De Facto Establishment:** (Law/Political Philosophy, contrasting with *De Jure* Establishment)
      *   **What it is:** While official state religion (*de jure* establishment) is rare in the West, *implicit* establishment occurs when the state, despite formal neutrality, consistently favors, accommodates, or structures itself around the traditions, symbols, holidays, and values of a particular religion (historically Christianity), treating them as secular defaults.
      *   **How it fits:** This explains the *outcome*: the state calendar (Christmas/Easter), public symbols (village names, chapels in public hospitals), and even customs (handshake as "neutral" greeting) reflect and privilege the majority faith by not subjecting them to the same scrutiny or restrictions applied to minority practices labeled "religious."
      *   **Distinction:** Focuses on the *state's role* in perpetuating the privileged baseline through its structures and rules. It highlights the gap between formal neutrality and practical favoritism.
      *   **Edge:** Primarily applies to the state/public sphere context (schools, town halls, IDs), which aligns perfectly with your examples.

  3.  **Christian Privilege:** (Critical Race Theory/Sociology of Religion)
      *   **What it is:** The systemic advantages conferred upon individuals identifying as Christian within societies historically shaped by Christianity, where Christian norms are embedded in institutions and culture. Privilege includes not having one's faith seen as abnormal, disruptive, or requiring special justification/accommodation.
      *   **How it fits:** This names the *advantage* the majority group experiences precisely *because* their practices are the unmarked baseline. They don't bear the burden of the rules you describe; their practices are simply "normal life," not "religious expression" demanding restriction or special permission.
      *   **Distinction:** It explicitly centers *Christianity* as the privileged group. Your mechanism is *how* this privilege operates in rule-making: by defining Christianity out of the category of "problematic religion" needing regulation. It focuses on the group benefiting rather than the structural mechanism itself.
      *   **Edge:** Highly specific to the Christian/non-Christian dynamic, which fits Quebec/France. Less directly applicable to intra-Christian debates or contexts without a Christian majority history.

  4.  **Secular Camouflage / Religious Invisibility:** (Sociology of Secularism)
      *   **What it is:** The process by which the religious roots or character of dominant cultural practices become obscured or denied within secular frameworks. These practices are reclassified as "cultural," "traditional," or "secular," rendering their religious origins and significance invisible and non-controversial.
      *   **How it fits:** This directly names the *re-labeling mechanism* you identified: Christmas break becomes "winter break," the chapel becomes "historical architecture/quiet room," the Christian-rooted handshake becomes "universal politeness." Only minority practices retain the visible "religious" label that triggers regulation.
      *   **Distinction:** Focuses specifically on the *semantic shift* – how majority religious practices shed the "religious" label under secularism, while minority practices cannot. It's the key tactic enabling the normative power.
      *   **Edge:** Primarily applies within societies operating under an ideology of secularism (like France's *laïcité* or Quebec's version), where the pressure to appear "neutral" necessitates this camouflage.

  **Why "Disparate Impact" Isn't Sufficient:**
  Disparate impact identifies unequal outcomes stemming from a facially neutral rule. Your mechanism explains *why* the rule has a disparate impact *and why that impact is structurally difficult to challenge*. The core issue isn't just the unequal outcome, but the **pre-definition of the baseline** that renders the majority's practices invisible as "religion," making the rule *appear* neutral when its foundation is not. The burdened group has to fight not just the rule, but the entire definitional framework to even articulate their disadvantage.

  **Coining a Term: Normative Assimilation**

  If no existing term feels precise enough, consider coining **"Normative Assimilation"**:

  1.  **Definition:** The socio-political mechanism by which the practices, symbols, and calendar of a dominant religious tradition are systematically reclassified as "cultural," "secular," or "neutral" baseline norms within a society or institution. This reclassification renders them invisible *as religion* for regulatory purposes, while practices of minority traditions remain visibly marked as "religious" deviations. Consequently, facially neutral rules regulating "religion" in public spaces disproportionately burden minority groups, who cannot effectively challenge the rules without first contesting the privileged invisibility of the majority tradition.
  2.  **Boundaries & Scope:**
      *   **Religion is Prime:** Works most powerfully with religion because secularism provides a potent justification for the reclassification ("It's not religion, it's culture/history!"). The tension between neutrality and embedded tradition is sharpest here.
      *   **Applies Beyond Religion:** The *core mechanism* (dominant practice becomes invisible baseline, minority practice is marked deviation) can apply elsewhere:
          *   **Language:** Mandating a "neutral" language (e.g., "Business English") that is actually the native language/preferred mode of the dominant group, burdening non-native speakers or speakers of stigmatized dialects.
          *   **Dress Codes:** "Professional" dress codes based on dominant cultural norms (e.g., Western business attire), burdening those whose cultural or religious attire differs (turbans, hijabs, dashikis, natural Black hairstyles) if not explicitly accommodated.
          *   **Cultural Practices:** "Neutral" workplace norms around holidays, communication styles, or social interaction that align with the dominant culture, creating barriers for others.
      *   **Requires Asymmetry:** Needs a dominant group with the power to set and maintain the baseline norm and a minority group whose practices visibly differ.
      *   **Relies on Denial:** The system depends on denying the specific cultural/religious character of the baseline practices, insisting they are "just the way things are done" or universally applicable.

  **In Summary:**

  You're observing **Normative Power** constructing an **Implicit Establishment**, where **Christian Privilege** is maintained through **Secular Camouflage**, leading to rules with a **Disparate Impact** that is structurally difficult to challenge because the baseline itself is rigged. The coining of **"Normative Assimilation"** aims to encapsulate the specific mechanism of reclassification and baseline-setting you've identified as the engine driving this unequal burden. This mechanism is *optimized* for religion within secular states but is not exclusive to it, extending to any domain where a dominant group can define its practices as the unmarked, invisible norm.
