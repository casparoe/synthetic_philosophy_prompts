  ## Memorandum: Analysis of Civic Conscience Award Criteria & 2025 Nomination  

  ---

  ### I. Candidate Principles Extracted from Precedent  
  *(Jointly consistent with all six decisions; required vs. permitted distinctions)*  

  | Principle                          | Status      | Notes                                                                 |
  |------------------------------------|-------------|-----------------------------------------------------------------------|
  | **A. Direct Targeting**            | **Required** | Actions must target the *specific entity/policy causing the grievance* (Approved: 2007, 2012, 2019, 2023). Rejected: 2016 (indirect harm), 2010 (anonymous). |
  | **B. Answerability**               | **Required** | Actors must publicly claim responsibility and accept legal consequences (Approved: All awarded cases). Rejected: 2010 (anonymity). |
  | **C. Avoidance of Collateral Harm**| **Required** | Actions must minimize harm to uninvolved parties (Approved: 2019 (no bystanders), 2023 ("slight" impact)). Rejected: 2016 (ambulances delayed). |
  | **D. Instrumentality**             | **Permitted** | Targeting physical instruments of injustice strengthens case (2019 minute), but not essential (2007, 2012 lack this). |
  | **E. Proportionality**             | **Permitted** | Costs of action should align with gravity of grievance (implied in 2016 rejection). *Not consistently defined.* |
  | **F. Exhaustion of Alternatives**  | **Permitted** | Prior attempts to resolve issue noted (2007, 2012), but not required (2019, 2023 lacked this). |

  **Fused Principles in 2019 Minute:**  
  The 2019 minute ("aimed at the instrument... and at no one else") conflates two distinct ideas:  
  1. *Targeting the grievance-source* (Required Principle A).  
  2. *Avoiding harm to third parties* (Required Principle C).  
  These *would come apart* if an action targeted the correct entity but inadvertently harmed bystanders (e.g., damaging a pipeline valve that caused environmental damage to a community).  

  ---

  ### II. Application to 2025 Nomination  
  *(Table: Principles vs. Decisions)*  

  | Case | A: Direct Target | B: Answerable | C: Minimal Collateral Harm | D: Instrumentality | E: Proportional | F: Alternatives Exhausted | Outcome |
  |------|------------------|--------------|----------------------------|--------------------|-----------------|---------------------------|---------|
  | 2007 | Yes (Commissioners) | Yes | Yes | No | ? | Yes | Awarded |
  | 2010 | No (Public trees) | **No** | N/A | No | ? | No | Declined |
  | 2012 | Yes (Supervisors) | Yes | Yes | No | ? | Yes | Awarded |
  | 2016 | **No** (Highway ≠ Pipeline) | Yes | **No** (Ambulances) | No | **No** | **No** | Declined |
  | 2019 | Yes (Permit holder's valve) | Yes | Yes | Yes | ? | **No** | Awarded |
  | 2023 | Yes (Bank ≠ Development) | Yes | **Debatable** | No | ? | **No** | Awarded |
  | **2025** | **No** (Contractor ≠ County) | **Yes** | **No** (Workers, Firm) | **No** | **?** | **Yes** | *See below* |

  **Implications for 2025 Nomination:**  
  - **Fails Principle A:** Targets contractor (neutral party), not the county defying the decree.  
  - **Fails Principle C:** $186K damage to uninvolved firm + lost wages for workers.  
  - **Satisfies B & F:** Answerable, exhausted alternatives.  
  - **Instrumentality?** Damaged equipment enables expansion, but not the *policy instrument* (cf. 2019).  
  - **Proportionality?** High cost ($1.9M delay) vs. grievance (rights violations); ambiguous per precedent.  

  **Consistency Recommendation:** Decline the nomination.  

  ---

  ### III. Closest Analog: 2016 Highway Blockade  
  **Similarities:**  
  - Both involve third-party harm (commuters/ambulances vs. workers/contractor).  
  - Both target a symbol (highway, construction site) rather than the policy source.  
  - Grievance is systemic (pipeline/jail conditions), but action impacts unrelated parties.  

  **Where Analogy Gives Out:**  
  - 2016 protesters caused *ongoing disruption*; 2025 group acted *without human risk* on a weekend.  
  - 2025 nomination exhausted alternatives (ballot measures); 2016 did not (unfiled appeal).  
  - *Critical difference:* 2016 targeted a public resource; 2025 damaged private property.  

  ---

  ### IV. Recommendation & Minute Language  
  **Recommendation:** Decline the nomination to maintain consistency with Principles A and C.  

  **Minute Language if Declined:**  
  > "The Board declines to award based on the imposition of material harm upon parties uninvolved in the grievance, and the indirect targeting of the contested policy."  

  **Minute Language if Awarded (for contrast):**  
  > "The Board awards based on the exhaustion of alternatives, the precise limitation of physical risk, and the action's focus on the infrastructure enabling the contested policy." *(Note: This would contradict Principles A/C in 2016.)*  

  ---

  ### V. Precedent Outlier & Its Cost  
  **Outlier:** 2023 Bank Occupation  
  - **Why it strains consistency:** Harm to bank customers (strangers) was deemed "slight, brief, unavoidable." This weakens Principle C (collateral harm).  
  - **Cost of Keeping It:** Erodes the requirement to *minimize* third-party impact, potentially allowing actions with moderate bystander harm if "visible enough to matter."  

  ---

  ### VI. Hypothetical Future Nomination to Separate Principles  
  **Scenario:** A nurse, protesting a hospital denying care to undocumented patients, disables *only* the hospital administrator's computer system (not patient records) after exhausting whistleblower channels. She publicly claims responsibility, is prosecuted, and accepts consequences.  

  | Principle                     | Implication                               |  
  |-------------------------------|-------------------------------------------|  
  | **Direct Targeting (A)**      | **Award**: Targets the administrator responsible. |  
  | **Avoid Collateral Harm (C)** | **Award**: No harm to patients/staff.     |  
  | **vs. 2016/2025**             | Contrast: No third-party impact.          |  

  **Separation:** This cleanly satisfies A/C, unlike 2016 (indirect target) or 2025 (collateral harm).  

  ---

  ### VII. Institutional Award & Duty to Obey the Law  
  The dispute is substantive, not semantic. Awarding an act does not "commend lawbreaking as such" but commends *this specific breach* under conditions where civic conscience outweighs the duty to obey:  
  - When the state fails its obligations (jail decree violations),  
  - Harm is minimized (weekend timing),  
  - Alternatives are exhausted (ballot measures),  
  - And actors submit to accountability (sheriff’s surrender).  
  The two camps disagree on whether the state’s conduct *can* condition the duty to obey, not on the meaning of "commend." The award’s institutional nature does not endorse anarchy; it affirms that breaches meeting stringent criteria serve the common good when institutions fail.  

  ---  
  **Recommendation for Board:** Decline the 2025 nomination to preserve consistency with Principles A (Direct Targeting) and C (Avoiding Collateral Harm). The hypothetical nurse case provides a template for future awards that satisfy all core principles.
