  First, I need to identify core requirements any consciousness science method must meet. The user wants concrete motivations from experimental phenomena like blindsight or confabulation, plus verdicts on negotiability and interview questions. They also want three specific analyses: tension points (especially neutrality vs. discriminability), which requirement is most exclusionary, and sorting genuine requirements from partisan biases.

  For the requirements list, I'll start with neutrality about ontology (Dennett's core tenet) but include challenges like discriminative power. The AI text-swap experiment tests provenance—whether substituted reports count as data. The reflexive demand could be addressed through methodological consistency or rejected as category error.

  The tension between neutrality and discriminability seems real: if we never commit to experiences existing, how do we test theories that make ontological claims? Scientists must likely lean toward discriminability for practical progress. Provenance (from the AI experiment) might be a red herring if the focus is on report endorsement rather than origin.

  The most exclusionary requirement is probably discriminability—it rules out approaches that can't distinguish theories. Regarding biases, demanding presumptive authority for reports is partisan (phenomenologists), while requiring applicability to non-reporters is genuine.

  For the scorecards: Heterophenomenology excels in objectivity but falters on immediacy and reflexivity. Neurophenomenology captures experience but has scalability issues. Report-free methods are inclusive but struggle with intrinsicality. The reflexive application is a valid consistency test but risks infinite regress—best handled explicitly.
answer: |-
  Here are the core requirements for any method gathering evidence about conscious experience, grounded in experimental realities but not tied to any specific proposal. Each requirement includes motivation, negotiability status, and an interview question:

  ### Core Methodological Desiderata
  1. **Intersubjective Accessibility**  
     *Statement:* Evidence must be observable/recordable by multiple independent investigators.  
     *Motivation:* Confabulation studies (e.g., Nisbett & Wilson 1977: subjects misreport reasons for choices); ensures replicability.  
     *Negotiable?* Non-negotiable for science.  
     *Interview Question:* "How do you ensure your raw data is examinable by skeptics?"

  2. **Discriminative Power**  
     *Statement:* Must distinguish between rival theories (e.g., global workspace vs. IIT).  
     *Motivation:* Blindsight (Weiskrantz): identical behavior with/without reported awareness; partial-report paradigms (Sperling) revealing fragile visual memory.  
     *Negotiable?* Non-negotiable.  
     *Interview Question:* "Which leading theories does your method falsify or corroborate?"

  3. **Provenance Agnosticism**  
     *Statement:* Method must function regardless of how reports are generated (neural, AI, etc.), if endorsed by the subject.  
     *Motivation:* The AI text-substitution experiment: subjects endorse fabricated reports as their own experience.  
     *Negotiable?* Preference (but failing it risks missing key confounds).  
     *Interview Question:* "If a report is sincerely endorsed post-hoc, does its origin matter to your analysis?"

  4. **Temporal Resolution**  
     *Statement:* Must account for timing mismatches between experience and report.  
     *Motivation:* Color-phi illusion (Kolers & von Grünau): subjects report retrospectively constructed motion. Change blindness (Simons & Levin): failure to report obvious changes.  
     *Negotiable?* Non-negotiable.  
     *Interview Question:* "How do you isolate the timing of experience from the timing of reporting?"

  5. **Immediacy Capture**  
     *Statement:* Must access experience before conceptual/cognitive elaboration.  
     *Motivation:* Inattentional blindness (Mack & Rock): subjects miss unexpected objects due to attentional focus; confabulation in split-brain patients (Gazzaniga).  
     *Negotiable?* Preference (phenomenologists demand it; skeptics see as impossible).  
     *Interview Question:* "Can your method detect experiences the subject cannot spontaneously describe?"

  6. **Scope Generality**  
     *Statement:* Must apply to non-verbal beings (infants, animals) or unresponsive states (coma).  
     *Motivation:* Animal consciousness debates; clinical assessment of disorders of consciousness.  
     *Negotiable?* Non-negotiable for a *complete* science.  
     *Interview Question:* "How do you validate your method in entities that cannot self-report?"

  7. **Reflexive Consistency**  
     *Statement:* Method must apply equally to researchers' own reports (protocols, interpretations).  
     *Motivation:* Experimenter bias; theory-laden observation (e.g., Clever Hans effect).  
     *Negotiable?* Preference (critical for objectivity; risks infinite regress).  
     *Interview Question:* "Are your own observational reports subject to the same neutrality as subject reports?"

  ---

  ### Addressing Your Specific Requests
  **1. Tension Between Neutrality & Discriminability**  
  Your suspicion is correct: **strict neutrality (about existence of reported items) conflicts with discriminability**. Theories like IIT or panpsychism make claims about *what exists* consciously. Neutrality treats "seems X" as the only data, but discriminability requires asking if "seems X" *corresponds to* underlying mechanisms. **Scientists must choose discriminability**—neutrality is a methodological starting point, not an endpoint. Without committing to some reports as veridical (e.g., in binocular rivalry), theories can’t be tested.

  **2. Most Eliminative Requirement**  
  **Immediacy Capture** eliminates the most approaches. Heterophenomenology fails it (reports are post-hoc); neuroimaging (fMRI, EEG) rarely captures pre-reflective states; most behavioral methods rely on attention/memory.

  **3. Genuine Requirements vs. Partisan Biases**  
  - **Genuine**: Scope Generality (non-reporters must be addressable), Temporal Resolution (timing illusions prove necessity), Discriminative Power (core to science).  
  - **Partisan Bias**: *Presumptive Authority* (treating reports as intrinsically privileged) is a phenomenologist prejudice. *Eliminativism* (dismissing all reports as illusory) is a skeptic prejudice. Both violate Provenance Agnosticism and Discriminative Power.

  ---

  ### Complications Absorbed
  - **AI Text-Substitution**: Under **Provenance Agnosticism**, substituted text *is* valid data *if endorsed*, as it reveals what the subject *accepts* as their experience. Provenance matters only for mechanistic explanation (why they endorse it), not data status.  
  - **Reflexive Demand**: **Reflexive Consistency** treats it as a *legitimate requirement* to avoid privileged observer status. It’s not a reductio if the method can recursively apply (e.g., analyzing the researcher’s report using the same protocol). Denying it is a category mistake masking bias.

  ---

  ### Scorecards
  1. **Heterophenomenology**  
     *Strengths:* Maximizes objectivity (Intersubjective Accessibility), handles confabulation via neutrality.  
     *Weaknesses:* Fails Immediacy Capture (reports are retrospective), struggles with Scope Generality (non-humans), and avoids ontological commitment, limiting Discriminative Power.

  2. **Trained First-Person (Neurophenomenology)**  
     *Strengths:* Targets Immediacy Capture via mindfulness, combines subjective/objective data (e.g., Lutz et al. 2002).  
     *Weaknesses:* Poor Intersubjective Accessibility (training not universal), questionable Reflexive Consistency (researchers rarely train themselves identically), limited Scope Generality.

  3. **Report-Free (e.g., IIT, PCI)**  
     *Strengths:* Strong Scope Generality (applies to infants/computers), Temporal Resolution via neural timing.  
     *Weaknesses:* Fails Provenance Agnosticism (ignores report endorsement entirely), weak Discriminative Power (theory-dependent metrics), assumes neural correlates imply experience (risks false positives/negatives).

  ---
  Use these to press researchers on whether their methods transcend Dennett’s framework or replicate its blind spots. The AI/text-substitution experiment is a litmus test for Provenance Agnosticism; reflexivity challenges all non-solipsistic approaches.
