answer: |-
  ### Principle Behind Your Cases: The Norm-Relative Actual Dependence (NRAD) Principle

  Your judgments across cases 1–7 reveal a pattern centered on **normative expectations** and **actual chain dependence**. Causation isn't just counterfactual difference-making; it hinges on whether an event/omission is a *deviation from a contextually relevant norm* and whether the outcome *actually depended* on that deviation in the specific causal chain. I formalize this as the **Norm-Relative Actual Dependence (NRAD) principle**, with three core clauses:

  1. **Deviation Requirement**: A candidate cause \(C\) (event or omission) is a cause of outcome \(O\) only if \(C\) is a *deviation* from the default, expected, or required state in the context. Defaults are fixed by norms, duties, or stable background conditions.  
     *(Forces: Cases 4, 5a, 6. Absences/normals aren't causes unless they breach a duty.)*

  2. **Actual Dependence Requirement**: \(C\) causes \(O\) only if, in the actual chain of events, \(O\) *depends* on \(C\). This means:  
     - (a) \(O\) would not have occurred if \(C\) had not happened (or, for omissions, if the omitted action *had* been performed), holding fixed other deviations and the actual sequence.  
     - (b) \(C\)'s influence isn't preempted, overdetermined, or redundant in the actual world.  
     *(Forces: Cases 1, 2, 3, 5b, 7a/7b. Ensures causation tracks real-world chains, not just possibilities.)*

  3. **Prevention Asymmetry Clause**: When \(C\) removes a preventive factor:  
     - (a) An *act* that removes prevention (e.g., firing a guard) is a deviation and cause.  
     - (b) An *omission* that fails to add prevention (e.g., not hiring) is not a cause unless there was a prior duty to provide it.  
     *(Forces: Case 5. Distinguishes acts from omissions in prevention contexts.)*

  **NRAD is a decision procedure**: For any new case, ask:  
  - Was \(C\) a deviation from contextual norms? (If no, not a cause.)  
  - Did \(O\) actually depend on \(C\) in the specific chain? (If no, not a cause.)  
  - If prevention is involved, was \(C\) an act or omission with duty? (Resolves asymmetry.)  

  ### How Counterfactual, Interventionist, and Process Theories Handle Cases 3/4/5
  - **Counterfactual (Lewis)**: All absences with dependence are causes. *Verdicts: 3 (cause), 4 (cause), 5a (cause). Fails your 4/5a.*  
  - **Interventionist (Woodward)**: Interventions on absences can change outcomes. *Verdicts: 3 (cause), 4 (cause), 5a (cause). Fails your 4/5a.*  
  - **Process/Conserved Quantity (Salmon/Dowe)**: Omissions lack physical processes; only acts are causes. *Verdicts: 3 (not cause), 4 (not cause), 5a/5b (not cause). Fails your 3/5b.*  
  *None save all three; your 3/4/5 judgments require NRAD's norm-relativity.*

  ### Case-by-Case Results Table
  | case       | my verdict                      | principle's verdict           | clause doing the work                      | kept / overturned |
  |------------|----------------------------------|-------------------------------|--------------------------------------------|-------------------|
  | 1          | Renata caused                   | Renata caused                 | Actual Dependence (2a): Board fault preempted; stop depended on Renata. | kept             |
  | 2          | both caused                     | both caused                   | Actual Dependence (2b): Symmetric overdetermination; no preemption. | kept             |
  | 3          | omission caused                 | omission caused               | Deviation (1): Duty to patrol. Actual Dependence (2a): Flood depended on skip. | kept             |
  | 4          | absence not cause               | absence not cause             | Deviation (1): No norm for earthquakes; absence is normal. | kept             |
  | 5a         | absence not cause               | absence not cause             | Prevention Asymmetry (3b): Not hiring is omission, no prior duty. | kept             |
  | 5b         | firing caused                   | firing caused                 | Prevention Asymmetry (3a): Firing is act removing prevention. | kept             |
  | 6          | roast caused, water not         | roast caused, water not       | Deviation (1): Water is default setting; roast is deviation. | kept             |
  | 7a         | cancelling caused               | cancelling caused             | Actual Dependence (2a): Survival depended on cancelling in chain. | kept             |
  | 7b         | cancelling not cause            | cancelling not cause          | Actual Dependence (2a): No dependence; colleague caught it. | kept             |
  | flag-setter| (split: yes/no)                 | **flag-setter caused**        | Prevention Asymmetry (3a): Flag-setting was act removing prevention (canaries). Actual Dependence (2a): Outage depended on it. | overturns "no"   |

  **Flag-setter verdict**: NRAD says **yes**, it was a cause. Flag-setting was a deviation (it changed the default canary state) and the outage actually depended on it (without it, the canary would have caught the config). This overturns your "no" intuition. The "staleness" worry is addressed by Actual Dependence: two weeks prior is still part of the chain, and intervening then would have changed the outcome. Regress (e.g., blaming the canary designer) is blocked by Deviation: if the canary design was the default, it isn’t a deviation; only the flag-setter’s change was.

  ### Three Cases You’d Get Wrong Under NRAD
  1. **Case X (Default Deviation)**:  
     - *Scenario*: A server’s default config allows unencrypted logins. An admin *changes* it to require encryption. Later, a breach occurs via an encrypted channel exploit that would have been blocked by the old config.  
     - *Your likely verdict*: The admin’s change caused the breach (it removed prevention).  
     - *NRAD verdict*: **Not a cause**. The change was a deviation (clause 1), but the breach did not *actually depend* on it (clause 2a): even without the change, the breach would have occurred (via unencrypted exploit).  
     - *Why you’d get it wrong*: You focus on the change removing prevention, but NRAD requires actual dependence in the specific chain.

  2. **Case Y (Omission with Duty, but No Dependence)**:  
     - *Scenario*: A backup system requires daily checks. Operator skips a check, but a fault occurs independently minutes later; the check wouldn’t have detected it.  
     - *Your likely verdict*: Omission caused the fault (duty breached).  
     - *NRAD verdict*: **Not a cause**. Deviation (clause 1) is met (duty to check), but no actual dependence (clause 2a): fault would have occurred even with the check.  
     - *Why you’d get it wrong*: You prioritize norm violation (as in case 3), but NRAD requires both deviation *and* dependence.

  3. **Case Z (Non-Deviation Prevention Act)**:  
     - *Scenario*: A factory’s norm is to disable safety sensors during maintenance. Worker disables a sensor (as usual), and a preventable accident occurs.  
     - *Your likely verdict*: Worker caused the accident (act removed prevention).  
     - *NRAD verdict*: **Not a cause**. No deviation (clause 1): disabling is normal. Prevention Asymmetry (clause 3a) requires deviation.  
     - *Why you’d get it wrong*: You’d see the act as causal (like firing in 5b), but NRAD requires deviation from norms.

  ### Costs and Tradeoffs
  - **NRAD saves all 7 cases** with three clauses, but **costs complexity**: norms/context must be specified, and "actual chain" assessment can be messy.  
  - **Cheapest verdict to give up**: **Case 5a (not hiring)**. If you conceded it *was* a cause (aligning with counterfactual theories), you could drop Prevention Asymmetry (clause 3) and simplify. But your act/omission distinction in 5a/5b is core to your intuition, so NRAD keeps it.  
  - **If forced to drop one clause**: Drop Prevention Asymmetry (clause 3). Then 5a becomes ambiguous, but 1–4,6–7 hold. Case 5b (firing) still covered by Deviation + Actual Dependence.  

  NRAD explains your judgments by blending norms and actual chains—more nuanced than standard theories. It works because reliability engineering, like metaphysics, isn’t just about physics or logic; it’s about *responsibility* in a norm-governed system.
