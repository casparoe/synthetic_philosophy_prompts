prompt: |-
  I am a novelist, midway through my second book, and its central people speak a language I invented, inside which I have now been living for three years. Four of its properties bear on my problem. Every finite verb carries an obligatory evidential — seen, told, inferred, or dreamed — and the dreamed evidential has no English reflex at all, though an entire chapter turns on it. Bare generic nouns do not exist, so a speaker cannot say that wolves hunt in packs, only that these wolves hunted, that night, before someone's eyes. Spatial description runs on absolute bearings, which means no character in the book can be told that a thing lies to their left. And there is no tense; in its place the grammar marks whether an event's consequences are still open or have settled, a distinction my characters attend to constantly and my sentences almost never manage. My English renderings are all hacks: free indirect discourse pressed into service for the evidentials, sentence-initial hedges, aspectual periphrasis, italics I dislike, and a recurring particle that has begun to read as a tic.

  Here is what I want. Take the debate over linguistic relativity — the strong deterministic formulation, the modest experimental version, and Slobin's reformulation under the label thinking for speaking, along with the cases that carry the empirical weight: exact enumeration among the Pirahã, spatial memory and recall in Guugu Yimithirr and the other languages that orient by cardinal bearings rather than left and right, and the categorical discrimination findings for the two Russian blues — and restate the whole of it in the vocabulary I actually work in. Not popular exposition: my vocabulary. Focalization, register, voice, diction, syntax as an index of character, scene against summary, the unreliable narrator, what a reader can be made to feel without ever being told, and the difference between what a language permits and what a writer chooses.

  Then give me the residue. Which of their claims survive intact in craft terms? Which survive only under distortion, and precisely what distortion? Which cannot be expressed at all? My own suspicion is that craft vocabulary is structurally unable to host the strong claim, because it treats language as a menu from which an author selects, whereas the strong claim requires language as a limit no one chose; and because on the page there is no cognition anterior to its rendering, the psycholinguist's independent variable has nowhere to stand. Tell me whether that suspicion holds, and whether the residue indicts my vocabulary or signals that language shapes thought is quietly collapsing into language shapes what gets reported.

  Format: exactly five numbered items, one or two sentences each, every item prefaced with the tag TRANSLATION or RESIDUE. Items one through three carry the translation, with the strong formulation, the modest formulation, and the thinking-for-speaking reformulation each claiming one of them in whatever order you judge most honest. Item four is the residue report. Item five answers the question I cannot put to my editor: does a language like mine, rendered into English prose, actually deliver the strong thesis, or is it decoration laid over the weak one? No introduction, no conclusion, nothing before item one or after item five, and no references or reading lists — I want the translation, not the apparatus.
reasoning: |-
  Okay, the user is a novelist deeply immersed in their invented language for their second book. They've outlined four key linguistic features: obligatory evidentials (including a unique "dreamed" category), absence of bare generic nouns, absolute spatial bearings instead of relative terms, and a tense system replaced by open/closed consequences. Their English renderings feel like inadequate hacks—hedges, italics, particles that become tics. 

  They want a rigorous translation of linguistic relativity debates (strong determinism, moderate versions, thinking-for-speaking) into their craft vocabulary: focalization, register, unreliable narrators, etc. Specifically, they ask which claims survive in craft terms, which distort, and which remain inexpressible. Their suspicion is that craft vocabulary inherently resists the strong claim because it frames language as a menu of choices, not an unchosen limit. They also wonder if their constructed language, when rendered in English, actually delivers the strong thesis or merely decorates a weak one.

  Breaking this down:  
  First, the strong Sapir-Whorf claim must be mapped to craft. In novel-writing terms, it means the invented language’s grammar *forces* narrative techniques—like how absolute bearings prohibit any character describing "left," or how the lack of generics prevents thematic statements about "wolves." This isn’t choice but constraint, visible in what the narration *cannot* avoid.  

  For the moderate version (language influences cognition), craft parallels include how evidentials shape reader inference: the "dreamed" marker might force ambiguous focalization, making disbelief impossible without contradicting grammar. Here, language nudges interpretation but doesn’t cage it.  

  Thinking-for-speaking (language shapes *expression* during speech) fits how syntax indexes character. A narrator using open/closed consequence markers habitually reveals their worldview through grammatical reflexes, not conscious decisions.  

  The residue is telling: craft can’t host the strong claim’s "unchosen limit" because authors select from menus (e.g., choosing focalization). The independent variable (pre-linguistic thought) vanishes because prose renders cognition *through* language. What survives is that language shapes *reporting*—what details get highlighted.  

  Finally, their constructed language *does* deliver the strong thesis *within the fiction*: characters are trapped by its grammar. But in English prose, it’s decoration because readers process everything through their own linguistic lens. The tension is irreconcilable—which is precisely the point their novel might explore.
answer: |-
  **TRANSLATION**  
  1. The strong claim becomes: your invented grammar’s obligatory categories (evidentials, absolutes, open/closed consequence) *constrain narrative possibility itself* — focalization cannot escape the "dreamed" marker, spatial description cannot default to relative frames, and summary cannot exist without violating the ban on generics, forcing scene. The language dictates the narrative optics, not the author.  
  2. The modest claim becomes: habitual evidential selection pressures reader inference — constant "inferred" markers may seed doubt in focalized perception, while "dreamed" events, rendered without English analogues, demand unconventional free indirect discourse that risks unreliable narration, shaping how consequences are felt before they settle.  
  3. Thinking-for-speaking becomes: the grammar’s reflexes index character through syntactic inevitability — a speaker *must* code spatial relations as cardinal bearings, revealing orientation through syntax alone, and *must* mark event openness/closure, making their temporal worldview manifest in every verb choice, irrespective of intent.  

  **RESIDUE**  
  4. Your suspicion holds: craft vocabulary fails the strong claim by presupposing authorial selection (register, diction, scene/summary ratio), whereas linguistic determinism requires grammar as an inescapable prior constraint; the "independent variable" vanishes because narrative cognition exists only *as* rendered sentences. Only the reporting-shaping facet survives translation intact — what gets focalized, how syntax indexes perspective.  
  5. Your language, rendered in English, enacts the *strong thesis within the fictional world* (characters are cognitively bound by its grammar), but presents as *decorative weak thesis to the reader* — English syntax beneath the hack-layer remains the true substrate of thought-shaping, absorbing your invented constraints as stylistic texture, not cognitive limits. The friction *is* the delivery.
