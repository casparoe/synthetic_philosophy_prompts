prompt: |-
  I ran an analytical chemistry lab for forty years and only started reading political philosophy seriously since I retired, so forgive the blunt way I'm putting this. I do a small podcast now, mostly for former students of mine, and next week's guest is a political philosopher who defends the republican idea of freedom as non-domination. Not Pettit himself — someone of that school — so you don't have to hew to Pettit's exact phrasing, just the position.

  Give me eight to ten questions I can actually put to him. No warm-up softballs, nothing like "what drew you to this" — every question has to turn on the content of the view and press where it's weakest. Specifically I want:

  - one on the contented slave: what exactly is lost when a master who could interfere at any moment never does interfere, and whether the loss lives in the mere capacity or in the slave having to ingratiate himself and bend his own plans around the master's moods;
  - one on law, i.e. the claim that a law you can contest and that tracks your intrests isn't really a curtailment of freedom — push him on the price of contestation, on who ends up being the person who always has to speak up and what that costs her;
  - one on the robustness machinery, because this is the bit I can't let go of as someone who measures things for a living: if an option only counts as free when it holds across nearby situations in which you actually take it, then what fixes which situations count as nearby, and doesn't that answer quietly do all the work;
  - one on the eyeball test — is it about how people in fact feel, in which case a servile population feels unfree under a benign state and a cocky one feels free under a predatory state, or is it about structure, and which verdict does he keep if the two come apart? Say whether that has to be kept seperate from what people report feeling.

  For each of those four, also give me a follow-up keyed to the answer he's most likely to give: one line saying what that expected answer is, then the question that makes it uncomfortable.

  Then one question I've been chewing on, and I want you to run with it rather than be polite: suppose I tried to build an index of domination out of things I could actually count — the probability that someone else can undo your choices at will, the cost of exiting the relationship, and the fraction of your time spent anticipating that person's wishes. Ask him what an index like that would systematically miss, and, more pointedly, what observation would count as evidence against his view rather than for a negative-liberty reading of the very same facts.

  Round it out with the two or three questions you think are genuinely hardest for the position — including something about the private sphere and the family, if you agree that's where it hurts most.

  Start straight in with question 1: no preamble, no summary of what I asked for, and nothing between the questions except the one-line "likely answer" tags I mentioned.
