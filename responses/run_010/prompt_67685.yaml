answer: |-
  **Question 1:** (Contented Slave) If a slave is content and the master never interferes, yet holds absolute arbitrary power, what *exactly* is lost in terms of freedom? Is the core injury merely the *capacity* for interference, or is it the slave's necessary psychological adaptation (ingratiation, anticipating moods) shaping their life around that power, even if unused?  
  *Likely Answer:* "It's the *presence* of the arbitrary power itself – the structural capacity – that constitutes domination, undermining status & independence."  
  *Follow-up:* Doesn't that reduce freedom to a metaphysical status divorced from lived experience? If the slave genuinely doesn't *feel* constrained or shape their actions around the master (perhaps due to ignorance or apathy), how is their *freedom* objectively diminished in a way that matters, beyond a normative label?

  **Question 2:** (Law & Contestation) You argue non-arbitrary law (contestable/tracked) doesn't dominate. But contestation demands resources – time, money, knowledge, social capital. Doesn't this burden fall disproportionately, forcing marginalized groups to *constantly* pay this "freedom tax" just to avoid domination by laws others accept?  
  *Likely Answer:* "Robust institutions and equality of voice mitigate this; the *availability* of contestation is key, not its constant exercise."  
  *Follow-up:* If systemic inequalities make effective contestation practically inaccessible for some groups despite formal availability, haven't they *effectively* lost the non-domination guarantee? Doesn't this reveal the theory's dependence on prior, unguaranteed egalitarian conditions?

  **Question 3:** (Robustness Machinery) The "robustness" requirement – freedom requires an option persists across "nearby possible worlds" where you take it. What *objectively* fixes which worlds are "nearby"? Isn't this selector doing all the normative work, smuggling in assumptions about what threats/vulnerabilities *matter* for freedom?  
  *Likely Answer:* "'Nearby' refers to plausible variations in circumstances or others' wills, judged contextually, based on normal expectations & vulnerabilities."  
  *Follow-up:* Doesn't "plausible," "normal expectations," and "vulnerabilities" just encode the theorist's (or society's) prior judgments about risk and power? How is this *not* subjective or circular, making freedom contingent on contested social perceptions rather than an objective state?

  **Question 4:** (Eyeball Test) Is non-domination fundamentally about psychological *feeling* (the "eyeball test") or objective social *structure*? If a servile populace feels unfree under benign rule, or a resilient one feels free under predatory rule, which verdict stands?  
  *Likely Answer:* "It's structural. Non-domination is a condition of objective independence from arbitrary power, regardless of subjective perception."  
  *Follow-up:* Doesn't this commit you to potentially *paternalistic* conclusions? If someone structurally dominated *feels* free (like the contented slave), you insist they aren't. Doesn't this undermine the intuitive link between freedom and agency/well-being that motivates the theory?

  **Question 5:** (Operationalizing Domination - Your Index) Suppose I define domination empirically: Probability of arbitrary interference, cost of exit, fraction of time spent anticipating the powerful's will. What crucial element(s) of non-domination would this index *systematically miss*? More pointedly: What observable outcome would count as *evidence against* the non-domination view (showing it's not the key to freedom) rather than just evidence of *negative liberty* deprivation?  
  *(No likely answer tag needed - direct challenge)*

  **Question 6:** (Private Sphere - Family) If non-domination hinges on immunity from *arbitrary* interference, how does it handle intimate relationships like family? A parent has immense power over a child, often exercised non-arbitrarily (in the child's interest). Does this constitute domination? If not, how do you define "arbitrary" here without excluding necessary paternalism? Doesn't this blur the public/private line republicanism tries to draw?

  **Question 7:** (Workplace Domination) Most people spend their waking hours under employer authority. Employers typically hold significant arbitrary power over workers (hiring/firing, assignments, conditions). Why isn't the standard employment relationship, absent strong unions or rigid regulation, a paradigm case of structural domination according to your theory? Does accepting this require radical economic restructuring?

  **Question 8:** (Exit Rights vs. Non-Domination) Libertarians argue robust exit rights (e.g., quitting a job, leaving a state) *are* sufficient for freedom, even within hierarchical structures. How does non-domination convincingly show that exit alone is *insufficient*, especially if exit is genuinely low-cost? Isn't the republican insistence on status-equality *within* relationships a distinct (and contestable) value smuggled into the definition of freedom?
