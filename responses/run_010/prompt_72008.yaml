prompt: |-
  I chair a residents' association in a mid-sized English town, and in the spring I have ninety minutes for a session on the franchise: compulsory voting, votes at sixteen, and votes for residents who are not citizens. I have no academic training in any of it — I have come to it by reading around and by watching our own meetings go wrong — and I want the plan of the session, not the argument itself.

  Two hunches of mine, which I would rather you tested than took for granted. First, the three questions tangle because people reach for whichever criterion suits the conclusion they already want: membership when the subject is foreign residents, competence when it is sixteen-year-olds, stakes when it is themselves. Second, compulsion sits on a different axis from the other two, concerning how the electorate behaves rather than who composes it. If either holds, in what order must the pieces go, and what does each depend on?

  Which single case should carry the whole thing? I have been considering a local bus consultation in which a third of those affected cannot vote and some of the remainder are sixteen, but I fear it is too live to be useful; tell me what the case must contain, what it must conspicuously leave out, and whether an invented one would serve better.

  Then the misconceptions: which ones the room will bring, in the order they arrive — I expect 'compulsory voting is only a fine, so nobody is coerced' and 'if sixteen, why not twelve?' — and at what exact point in the sequence each should be headed off. Add one closing question that would show me the distinction has landed, and a plain statement of what to omit at this level and announce that I am omitting.

  Finally, say how confident you are in the ordering you propose, and single out the part of it you are least sure of.
reasoning: |-
  Okay, the user chairs a residents' association in a mid-sized English town and is preparing a 90-minute session on voting reform topics: compulsory voting, votes at 16, and votes for non-citizen residents. They need a session structure, not arguments, and have two key insights they want validated: that people use inconsistent criteria for different voting groups (membership for foreigners, competence for youth, stakes for themselves), and that compulsory voting operates on a separate axis (voter behavior vs. electorate composition). 

  The user is clearly experienced in community facilitation—they notice how meetings "go wrong" and want to preempt biases. Their unspoken need might be avoiding polarization; they chose a local bus case study but worry it's too contentious. They're self-aware about their non-academic background but think structurally—that "which single case" question shows they grasp pedagogy. 

  Hmm, their two hunches are sharp: the criteria inconsistency is well-observed in democratic theory (Dahl's frameworks echo here), and the axis separation is correct—compulsory voting is indeed about participation mechanics while others define the demos. Must flag that in structure. 

  For the case study, they're right to avoid their live bus example—local tensions could derail discussion. A fictional "school rezoning" scenario works better: it naturally includes non-citizen parents (membership test), teens affected (competence test), and compulsory voting could be framed as "should all stakeholders be required to weigh in?" Key omissions: no real policy names, no cost details—pure principle-testing. 

  Misconceptions sequencing matters here. "Compulsion is just a fine" will surface early when discussing penalties—shut that down fast with the "fine vs. jail" distinction before it sticks. "Why not 12?" emerges during age debates; pivot to maturity benchmarks (taxes, consent) without engaging slippery slopes. 

  Least confident in putting non-citizen voting first—might feel counterintuitive, but starting with "membership" sets up the criteria framework cleanly. Closing question should force application: "Which group would compulsory voting most change?" reveals if they grasp behavior vs. composition. 

  Biggest risk? Overloading the axis distinction. Might need a visual mid-session: two columns ("Who votes?" vs. "How do we make them vote?") on a flipchart. Will watch time—strict 25-minute caps per segment. 

  Final thought: Their instinct to omit legal technicalities (e.g., EU citizen voting rights) is wise. Session goal is conceptual clarity, not policy nitty-gritty. Should explicitly state that limitation upfront.
answer: |-
  Here’s a structured 90-minute session plan anchored in your hunches, designed to untangle the three issues while testing your insights. The order prioritizes conceptual clarity and exposes biases early.

  ---

  ### **Session Structure (90 mins total)**  
  **I. Framing & Icebreaker (10 mins)**  
  - State the goal: *"To explore how we define 'who votes' and 'how voting works' – not to decide policy."*  
  - Quick poll: *"Which feels most urgent: expanding voters, changing turnout, or both?"* (Reveals starting biases)  

  **II. Non-Citizen Residents First (25 mins)**  
  - **Why start here?** Tests your "membership" hunch directly. People instinctively debate *belonging* here, avoiding immediate "competence" distractions.  
  - **Case Study (Invented):**  
    - *"Portsboro School Rezoning Plan"*: A proposal affecting school catchment areas.  
    - **Contains:** Non-citizen parents (paying taxes, permanent residents), 16yo students, low-turnout areas.  
    - **Omissions:** Specific political parties, citizenship laws, cost details.  
    - **Key Question:** *"Should non-citizen parents have a vote? What criteria matter most: residency length, taxes, kids in school?"*  
  - **Head off:** Early claims of "citizenship = loyalty" by asking *"Does paying council tax for 10 years imply stakeholdership?"*  

  **III. Votes at 16 (25 mins)**  
  - **Why now?** Shifts to "competence" criteria after establishing "membership" with non-citizens.  
  - **Use the Same Case:** *"Should students directly affected by the rezoning get a vote?"*  
  - **Head off "Why not 12?" immediately:**  
    - When competence is questioned, respond: *"We set age thresholds everywhere (driving, consent). The debate is whether 16 is a *meaningful* threshold – not whether thresholds exist."*  
    - Anchor to existing rights: *"In the UK, 16-year-olds can work full-time, pay taxes, and marry. Does that imply civic capacity?"*  

  **IV. Compulsory Voting (20 mins)**  
  - **Why last?** Confirms your "different axis" hunch by focusing on *behavior* after defining the *electorate*.  
  - **Pivot:** *"Now assume our electorate includes Groups A and B. How do we ensure their voices are heard?"*  
  - **Head off "It’s just a fine" early:**  
    - When penalties are mentioned: *"A fine *is* coercion if you can’t pay. Is non-voting like jury duty evasion?"*  
    - Contrast: *"Does compulsion address apathy, or mask it?"*  

  **V. Synthesis & Closing (10 mins)**  
  - **Reveal Criteria Inconsistency:** *"Did we use 'stakeholding' for residents, 'maturity' for youth, and 'duty' for compulsion? Why?"*  
  - **Closing Question:** *"If we could only change ONE thing – who votes, or how they vote – which would better strengthen local democracy?"* (Forces distinction between *electorate* vs. *participation*).  
  - **Omission Statement:** *"We’re omitting legal feasibility and party politics today – focusing on principles."*  

  ---

  ### **Confidence & Weaknesses**  
  - **Confidence: 8/10**  
    Order isolates criteria biases effectively. Starting with non-citizens prevents "competence" arguments from dominating early. Ending with compulsion reinforces the axis split.  
  - **Least Sure:** **Placing votes at 16 BEFORE compulsion**.  
    - Risk: If compulsion is discussed earlier, it might overshadow "who votes" debates.  
    - Mitigation: Strictly frame compulsion as *"How to activate the electorate we just defined."*  

  ### **Why Your Hunches Work Here**  
  1. **Criteria tangle:** The case study forces consistent application of "stakeholding" (e.g., *"Do non-citizen parents AND 16yo students 'stake' in the school plan?"*).  
  2. **Axis separation:** By defining voters FIRST (Parts II & III), compulsion (Part IV) becomes a separate tool – making your point self-evident.  

  ### **Key Adjustments**  
  - **Use the invented case:** Real consultations trigger defensiveness. Fictional "Portsboro" depersonalizes.  
  - **Misconception Timing:** Address slippery slopes ("Why not 12?") and coercion denial IMMEDIATELY when raised – don’t defer.  
  - **Omissions:** Explicitly exclude legal minutiae (e.g., *"We’re not debating the Representation of the People Act"*) and party strategy.  

  This structure surfaces biases, tests your hypotheses, and ends with a clear electorate vs. participation framework – without needing expertise. The case study’s omissions ensure focus on first principles.
