  First, I need to structure the questions to flow from foundational concepts to implications. Starting with clarifying her model's core ideas makes sense. Question 1 should address what lambda is and why it's not just a hidden variable. Follow-up here needs to push back if she avoids specifics. Using analogies like maps vs landscapes could help readers grasp the epistemic vs ontic distinction.

  Next, preparation independence is crucial because her model likely sacrifices it. Question 2 should ask about labs preparing particles independently. If she admits dependence, the follow-up must highlight how that challenges experimental assumptions. Readers might struggle here, so flagging it as technical but necessary is important.

