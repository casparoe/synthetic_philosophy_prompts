answer: |-
  Here's a structured 50-minute seminar plan focused on process, misconceptions, and ethical navigation, using Rosalind’s case as the primary carrier:

  ### **Core Structure & Sequence (45 mins + 5 wrap-up)**
  *Times are flexible guides.*

  1.  **Case Presentation & Initial Gut Check (5 mins)**
      *   Present Rosalind’s case *neutrally* (no directive text yet).
      *   **Question:** "What would you do *right now* if you were the covering resident? Treat or withhold antibiotics? Briefly note your instinct."
      *   *Why first?* Activates prior assumptions without overthinking. Establishes baseline.

  2.  **Introduce the Directive & Highlight the Conflict (5 mins)**
      *   Reveal the directive text verbatim. Emphasize: specific trigger met, explicit override clause ("even if I ask").
      *   **Question:** "Does knowing the directive change your initial instinct? If so, how? If not, why not?"
      *   *Dependence:* Conflict only registers *after* seeing the explicit clash between past instructions and current expression.

  3.  **Elicit "Experiential vs. Critical Interests" (10 mins)**
      *   **DO NOT** hand out vocabulary. **DO** elicit the distinction:
          *   "What seems to bring Rosalind contentment *now*?" (Humming, holding hands, saying "yes" to life → *Experiential Interests*)
          *   "What values or fears drove her to write this directive *then*?" (Avoiding loss of self/relationships, maintaining dignity → *Critical Interests*)
      *   **Question:** "Can we reconcile what seems good for her *now* with what she thought was essential for a good life *then*? How?"
      *   *Positioning:* Essential *before* discussing personhood/validity. Provides the core ethical tension framework. Misconceptions arise if skipped.

  4.  **Surface & Tackle Key Misconceptions (15 mins)**
      *   Introduce misconceptions *as they likely arise* from discussion. **Preemptively name and reframe them:**
          *   **"This is just a legal question."** (When directive is introduced)
              *   *Reframe:* "Legal validity is a threshold. Our task is the *ethical* weight of a valid directive when current expressions conflict. Law provides tools, not answers."
          *   **"Her happiness now proves treatment is in her interest."** (When experiential interests are discussed)
              *   *Reframe:* "Does her *current* comfort negate her *past* deeply held judgment about what made life meaningful *for her*? Interests aren't only about present feeling."
          *   **"She changed her mind, so the directive is void."** (When current "yes" is discussed)
              *   *Reframe:* "Does dementia-induced change in understanding/capacity constitute a valid 'change of mind'? Can she *grasp* the values underlying the directive now?"
          *   **"Honoring the directive implies her life isn't worth living."** (Likely when tension peaks)
              *   *Reframe:* "This is about *her specific values*, not a judgment on all dementia lives. She defined a boundary *for herself* based on her identity. Refusing treatment honors *that*, not a universal claim."
          *   **"She's not 'herself' anymore, so the document doesn't apply."** (May arise spontaneously or be prompted)
              *   *Positioning:* Raise here, *after* interests framework is set. **Question:** "If she isn't 'the same person,' who decides for *this* person? Does the 'new person' inherit the old one's instructions? What's the alternative basis?"

  5.  **Introduce the Asymmetry (5 mins)**
      *   **Present as the core ethical tension to be *resisted*, not resolved:**
          *   "Option 1: Honor directive. We potentially wrong the *current* Rosalind (ending a life she seems to want) for the sake of the *past* Rosalind (honoring her critical interests). The current Rosalind cannot experience the 'wrong' of being alive counter to her past wishes; only the past self (if she were aware) could experience that harm.
          *   Option 2: Ignore directive. We wrong the *past* Rosalind (violating her autonomy/critical interests) for the sake of the *current* Rosalind (respecting her apparent experiential interests). The past self experiences the 'wrong' (conceptually); the current self experiences no harm from *not knowing* her directive is ignored.
          *   **Question:** "How do we weigh wronging a past, no-longer-extant self vs. wronging a present, experiencing self? Is one type of wrong more significant ethically?"

  6.  **Structured Deliberation & Framework Building (5 mins)**
      *   **Task:** "Based on this discussion, draft a brief (3-4 point) decision-making *process* for residents facing similar conflicts. Focus on steps/questions, not the 'answer' for Rosalind."
      *   *Examples:* 1. Confirm directive validity/trigger. 2. Identify past critical interests & current experiential state. 3. Assess capacity for current preferences (can she understand the directive's rationale?). 4. Weigh the asymmetry of potential wrongs. 5. Involve surrogate/family in *interpreting* past values, not deciding anew.

  ### **Closing Diagnostic Question (5 mins)**
  *   **Question:** "Imagine Rosalind had written the *opposite* directive: 'Treat me aggressively *even if* I seem to refuse in dementia.' How would your *process* (not your gut answer) change?"
  *   **Revealing Wrong Answers:**
      *   *"It wouldn't change; we always treat if the patient seems happy now."* (Misses framework, defaults to pure experiential interests).
      *   *"We'd ignore her current refusal because the directive says so."* (Misses distinction between capacity to refuse *now* vs. lack of capacity to grasp past values; ignores asymmetry nuance).
  *   **Revealing Grasp of Structure:** Focuses on *how* assessing capacity, critical/experiential conflict, and asymmetry apply differently when the directive mandates treatment against current resistance.

  ### **What to Explicitly *Not* Teach (Decline Clearly)**
  1.  **Identity Theory:** "We won't resolve deep philosophical debates about personal identity today. Our focus is on navigating the *ethical conflict* arising from the *perceived* disconnect, regardless of the metaphysics."
  2.  **Well-being Reporting Research:** "While fascinating, data on reliability of self-report in dementia won't resolve Rosalind's specific conflict between her past and present selves. We're focusing on the ethical framework for weighing *her* expressed values."
  3.  **Jurisdictional Legal Variation:** "Laws governing directives vary. Today, we assume a valid directive and focus on the *ethical weight* it carries in this conflict, not the specific legal enforceability in X location."

  ### **Confidence & Least Sure Recommendation**
  *   **Overall Confidence in Ordering:** High (8/10). Sequence builds logically from instinct -> conflict -> framework (interests) -> misconceptions -> core tension (asymmetry) -> application.
  *   **Least Sure Recommendation:** Introducing the asymmetry *as a tension to be resisted* rather than a decisive factor. **Why?** It risks feeling paralyzing or overly abstract. *Alternative:* Present it as the *central* dilemma requiring explicit weighing, but emphasize there's no universally "right" weight. My choice prioritizes avoiding premature closure. **Depends on:** The contested claim that wronging a past self *can* be a genuine harm even if unexperienced by the current self.

  ### **Why Rosalind's Case is the Better Carrier**
  1.  **Unambiguous Trigger:** The clarity *helps*. It forces residents to confront the core ethical conflict head-on, rather than getting bogged down in whether the trigger was met (which is the focus of the second case). Ambiguity distracts from the deeper "past vs. present self" dilemma.
  2.  **Crucial Elements Present:**
      *   Explicit clash between written directive and current expression.
      *   Clear critical interests articulated in the directive.
      *   Observable, positive experiential state.
      *   Loss of capacity to understand the directive's rationale.
  3.  **Crucially Lacks:**
      *   Ambiguity about the triggering condition.
      *   External factors muddying the core conflict (like "burden" or finances in the second case).
      *   Surrogate conflict beyond the daughter advocating *for* the directive.

  This plan provides the scaffolding for residents to grapple with the profound tension inherent in these situations, equipping them with a structured *process* for bedside deliberation without prescribing a single "right" answer.
