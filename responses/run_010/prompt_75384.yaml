     The settlement is an assignment of items and a cash transfer.

     We will then have to find an assignment of items and a cash transfer that results in utilities (u1, u2) that are on the ray for the largest t.

     This is complex. We might use a procedure:

          Step 1: Assign a value to each item for each party.
          Step 2: For each item, assign it to the party who values it more. This maximizes the total value.
          Step 3: Let V1 be the total value of the items assigned to party 1 (by party 1's valuation) and V2 for party 2.
          Step 4: The total value created is V1 + V2.
          Step 5: We then need a cash transfer p such that:
                    u1 = V1 - p   (if cash is taken from party 1 and given to party 2) 
                    u2 = V2 + p

                  or alternatively, if we think of the cash as coming from outside? Actually, there is no outside cash. We might have to adjust by having one party pay the other.

          But note: the total value is V1+V2. We want to split this total. We can set:

                    u1 = V1 - p
                    u2 = V2 + p

                  and then choose p so that (u1, u2) is on the ray.

          Step 6: We then compute the disagreement point and aspiration point in the same way.

     But wait, what is the total value of the business? It is the sum of the values of the items. But if we assign each item to the party who values it more, then the total value is maximized. Let V_max = sum over items of max(v1_i, v2_i).

     Then we can treat the business as having a total value of V_max. The feasible set is then all (u1, u2) such that u1+u2<=V_max and u1>=d1, u2>=d2.

     The ideal point would be (V_max - d2, V_max - d1).

     Then the ray from (d1,d2) to (V_max-d2, V_max-d1) has:

          (u1 - d1) / (V_max - d2 - d1) = (u2 - d2) / (V_max - d1 - d2)

          so u1 - d1 = u2 - d2.

     Therefore, the solution is:

          u1 = d1 + (V_max - d1 - d2)/2
          u2 = d2 + (V_max - d1 - d2)/2

     This means we split the surplus equally. This is the Nash bargaining solution! Not Kalai-Smorodinsky.

     But if we use the standalone values for the ideal point, then we would have:

          (u1 - d1) / (a1 - d1) = (u2 - d2) / (a2 - d2)

     and we require u1+u2 = V_max.

     Then we solve:

          u1 = d1 + t*(a1 - d1)
          u2 = d2 + t*(a2 - d2)

          and u1+u2 = V_max

          => d1+d2 + t*(a1+a2 - d1 - d2) = V_max
          => t = (V_max - d1 - d2) / (a1 + a2 - d1 - d2)

     Then:

          u1 = d1 + (a1 - d1) * (V_max - d1 - d2) / (a1 + a2 - d1 - d2)
          u2 = d2 + (a2 - d2) * (V_max - d1 - d2) / (a1 + a2 - d1 - d2)

     This is the Kalai-Smorodinsky solution for the feasible set being the line u1+u2=V_max.

     We then assign the items to the party who values them more, which gives V1 and V2 (where V1 is the sum of v1_i for items assigned to party 1, and V2 for party 2). We then require:

          u1 = V1 - p
          u2 = V2 + p

     So we set: 
          p = V1 - u1

     But note: u1 and u2 are fixed by the formula above. And V1+V2 = V_max.

     So:

          p = V1 - u1
          and then u2 = V2 + p = V2 + V1 - u1 = V_max - u1

          But we require u2 = V_max - u1, which is consistent.

     Therefore, the cash transfer p = V1 - u1.

     However, this might be negative. If u1 > V1, then p is negative, meaning party 2 pays party 1.

     Summary of the procedure for the parties:

     Step 1: Determine the disagreement point (d1, d2). We ask each party what they expect to get if they walk away. If they don't know, we provide an estimate (like the litigation outcome).

     Step 2: Determine the standalone value for each party (a1, a2). Ask: "If you were to get the entire business and run it alone, what would that be worth to you in dollars today? This includes the value of all assets and the present value of future income."

     Step 3: For each non-monetary item, ask each party to assign a dollar value to receiving that item. Then assign each item to the party who values it more. Let V1 be the total value to party 1 of the items they receive (using their own valuation) and V2 for party 2. The total value created is V_max = V1+V2.

     Step 4: Calculate the total surplus: S = V_max - d1 - d2.

     Step 5: Calculate the fraction t = S / ( (a1 - d1) + (a2 - d2) ) 
          But note: a1-d1 and a2-d2 are the aspirational surpluses.

     Step 6: Calculate:
          u1 = d1 + t * (a1 - d1)
          u2 = d2 + t * (a2 - d2)

     Step 7: Calculate the cash transfer: 
          p = V1 - u1   [if positive, party 1 pays party 2; if negative, party 2 pays party 1 the absolute value]

     Step 8: The settlement is: 
          - The items are assigned as in step 3.
          - The cash transfer p is made.

     Let's run the two cases.

     Case 1: Catering business.

          Disagreement point: d1 = 20,000, d2 = 20,000.
          Standalone values: 
              a1 (brother) = ? The brother could clear $150,000 a year. Let's assume he values the business at $500,000 (as an example).
