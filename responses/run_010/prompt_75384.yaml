answer: |-
  ### Kalai-Smorodinsky Bargaining Procedure for Partnership Dissolution

  **Core Choice: Aspiration Definition**  
  I define a party's **aspiration** as the *most they could manage without the other person at all* (standalone value). This reflects what they can achieve independently if they receive the entire business/assets. The alternative (most they could extract from the joint arrangement if it went entirely their way) is less realistic in a dissolution, as it ignores separation. The choice turns on incentives: standalone values anchor expectations to feasible individual outcomes, preventing inflated demands. If a party overstates standalone value, they risk a worse settlement (e.g., receiving illiquid assets they can't utilize). We mitigate this by clarifying that valuations must be realistic and verifiable.

  ---

  ### Step-by-Step Procedure for Mediation Session
  **Goal**: Divide assets/future income in one 3-hour session.  
  **Key Principle**: Both parties concede the *same proportion* of their "aspirational surplus" (difference between aspiration and walk-away point).

  #### **Questions in Order**:
  1. **Disagreement Point (Walk-Away Outcome)**:  
     - Ask each party:  
       *"If we don’t agree today, what’s the net cash value you expect after litigation costs and delays? Be specific and include all losses."*  
     - **Settled Answer**: A single dollar number from each. If parties dispute, use:  
       - Your independent estimate (based on past cases).  
       - If unavailable, average their estimates and note: *"This is our starting point; we’ll adjust if new evidence emerges."*  
     - **Stop & Hand Back**: If parties fixate on "fairness" of litigation risks (e.g., "I deserve more because I’m right!"). Redirect: *"This isn’t about justice—it’s about predicting the dollar outcome if talks fail."*

  2. **Aspiration (Standalone Value)**:  
     - Ask each party:  
       *"If you owned everything and ran it alone, what’s the total dollar value to you? Include assets and future income. Be honest about what you can actually do."*  
     - **Settled Answer**: A single dollar number. Push for realism:  
       - *"Could you sell this? How much income would it generate? What’s your backup plan?"*  
     - **Stop & Hand Back**: If parties struggle to monetize (e.g., "The business name is priceless!"). Reframe:  
       - *"If you had to sell it to a stranger, what’s the lowest you’d accept?"*  
       - If values are wildly inconsistent (e.g., one says $1M, the other $50K), pause: *"Let me help benchmark this."*

  3. **Value Non-Monetary Items**:  
     - List all contested items (e.g., client list, brand name, equipment).  
     - Ask each party: *"What’s the cash value to you of receiving [item]?"*  
       - **Clarify**: *"This is what you’d pay to get it or accept to give it up."*  
     - **Settled Answer**: A dollar value per item per party. Assign items to the *higher valuer*:  
       - *"Item X goes to [Party A] because they value it more ($Y vs $Z)."*  
     - **Total Value for Each Party**: Sum the values of items they receive.  
     - **Stop & Hand Back**: If parties reject assignments (e.g., "I value it low but have emotional ties!"). Resolve ties or moral claims first: *"Let’s set this aside for now—we’ll revisit after the math."*

  4. **Calculate Settlement**:  
     - **Inputs**:  
       - Walk-away values: \(d_1\), \(d_2\)  
       - Standalone values: \(a_1\), \(a_2\)  
       - Total value from items: \(V_1\) (Party 1), \(V_2\) (Party 2)  
       - Total joint value: \(V_{\text{total}} = V_1 + V_2\)  
     - **Formula**:  
       - Surplus: \(S = V_{\text{total}} - d_1 - d_2\)  
       - Concession fraction: \(t = \frac{S}{(a_1 - d_1) + (a_2 - d_2)}\)  
       - Party 1’s utility: \(u_1 = d_1 + t \times (a_1 - d_1)\)  
       - Party 2’s utility: \(u_2 = d_2 + t \times (a_2 - d_2)\)  
       - Cash transfer: \(p = V_1 - u_1\)  
         - If \(p > 0\), Party 1 pays Party 2 \$\(p\).  
         - If \(p < 0\), Party 2 pays Party 1 \$\(|p|\).  
     - **Execute**:  
       - Use a calculator.  
       - Explain: *"This ensures both of you give up the same share of what you wanted beyond your walk-away point."*  

  5. **Finalize**:  
     - Write the assignment of items and cash transfer on one page.  
     - Both parties initial.

  ---

  ### Case Applications
  **Case 1: Catering Business Dissolution (Brother & Sister)**  
  - **Walk-away**: \(d_1 = \$20,000\), \(d_2 = \$20,000\) (after litigation costs).  
  - **Standalone**: Brother (\(a_1\)) = \$750,000 (assumes 5x annual profit of \$150K). Sister (\(a_2\)) = \$400,000 (sale value, as she can’t operate alone).  
  - **No non-monetary items** (business is a single asset).  
  - **Calculation**:  
    - \(V_{\text{total}} = ?\) → Not needed; compare buyout options.  
    - Brother buyout: Total value = \(a_1 = \$750,000\).  
      - \(t = \frac{750,000 - 40,000}{(750,000 - 20,000) + (400,000 - 20,000)} = \frac{710,000}{1,110,000} \approx 0.6396\)  
      - \(u_1 = 20,000 + 0.6396 \times 730,000 \approx \$487,000\)  
      - \(u_2 = 20,000 + 0.6396 \times 380,000 \approx \$263,000\)  
      - Brother pays sister: \(p = 750,000 - 487,000 = \$263,000\).  
  - **Result**: Brother keeps business, pays sister **\$263,000**.  
  - **Why hard to accept?** Sister gets less than half the going-concern value (\$400K), but more than litigation (\$20K). Brother pays a premium for high standalone value.  

  **Case 2: Furniture Workshop (Two Former Partners)**  
  - **Walk-away**: \(d_1 = \$20,000\), \(d_2 = \$20,000\).  
  - **Standalone**:  
    - Partner A (wants brand): \(a_1 = \$100,000\) (can sell assets).  
    - Partner B (wants shop/tools/apprentice): \(a_2 = \$250,000\) (can operate alone).  
  - **Non-Monetary Items**:  
    - Brand: A values at \$80,000, B at \$10,000 → Assign to A.  
    - Shop/tools: A at \$40,000, B at \$180,000 → Assign to B.  
    - Apprentice: A at \$0, B at \$70,000 → Assign to B.  
    - \(V_1 = \$80,000\), \(V_2 = \$250,000\), \(V_{\text{total}} = \$330,000\).  
  - **Calculation**:  
    - \(S = 330,000 - 20,000 - 20,000 = \$290,000\)  
    - \(t = \frac{290,000}{(100,000 - 20,000) + (250,000 - 20,000)} = \frac{290,000}{310,000} \approx 0.9355\)  
    - \(u_1 = 20,000 + 0.9355 \times 80,000 \approx \$94,840\)  
    - \(u_2 = 20,000 + 0.9355 \times 230,000 \approx \$235,165\)  
    - \(p = 80,000 - 94,840 = -\$14,840\) → B pays A \$14,840.  
  - **Result**: A gets the brand. B gets shop, tools, apprentice, and pays A **\$14,840**.  
  - **Why hard to accept?** A receives only the brand and cash, while B gets all productive assets. But A’s low standalone value (\$100K) justifies this.

  ---

  ### Limitations and Judgment Calls
  **Where the Procedure Misfires**:  
  1. **Standalone Values Are Unrealistic**: If parties exaggerate (e.g., "I could make \$1M alone!"), the solution skews. Use benchmarks: *"Industry standards suggest \$X for this asset."*  
  2. **Non-Monetary Items Resist Valuation**: Sentimental value (e.g., a family heirloom in the workshop) breaks the monetization. Hand back: *"Let’s negotiate this item separately."*  
  3. **Feasibility Gaps**: If \(V_{\text{total}}\) is less than \(d_1 + d_2\) (e.g., liabilities exceed assets), the math fails. Revert to distributive negotiation.  
  4. **Power Imbalances**: Parties with very weak walk-away options (e.g., sister in Case 1) may feel coerced. Mitigate by emphasizing proportionality.  

  **Judgment Calls Disguised as Arithmetic**:  
  - **Walk-away estimates**: Your experience shapes these.  
  - **Standalone validation**: You decide if "I can make \$150K alone" is credible.  
  - **Item valuation**: You arbitrate if parties assign "absurd" values (e.g., \$10K vs \$1M for a tool).  

  **What to Do When Stuck**:  
  - **Standalone Disputes**: Use third-party appraisals pre-session.  
  - **Item Conflicts**: Hold a sealed-bid auction for items post-valuation.  
  - **Refusal to Accept Proportionality**: Hand back: *"The math is fair—what specifically feels wrong?"*  

  **Final Word**: This procedure forces clarity on walk-away realities and standalone capabilities. It works because it quantifies concessions, but hinges on your firm guidance in monetizing the intangible. Use it not as a rigid formula, but a structured negotiation aid.
