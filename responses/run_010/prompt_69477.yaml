  - "Schizophrenia is ~80% heritable, so the higher diagnosis rate in group A than group B is probably partly genetic." — wrong
  - "The h² of about 0.4 for depression in Dutch twin registries tells you essentially nothing about depression among subsisence farmers in Malawi." — right
  - "Identical twins reared apart have eerily similar incomes, so for a given pair, whether they ended up rich or not was mostly their genes." — wrong
  - "Making environments more equal can push a trait's heritability up." — right

