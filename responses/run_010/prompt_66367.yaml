answer: |-
  ## Proposal: The Constitutive Franchise - How Voting Rules Shape Sovereignty in Secession Referenda

  **1. Introduction: The Unasked Question**
  When Scotland voted on independence in 2014, a seemingly administrative decision – extending the vote to 16- and 17-year-olds resident in Scotland – proved profoundly political. This choice wasn't merely a technical implementation of an already defined "Scottish people"; it actively *defined* that people for the purpose of self-determination. This proposal tackles a crucial blind spot in political theory: **How do the rules determining *who votes* in a secession referendum independently shape the legitimacy and meaning of the claim to sovereignty itself?** While normative theories fiercely debate *when* secession is justified, they largely assume the relevant electorate ("the people") is settled *before* the vote, merely implementing a prior determination based on territory or nationality. My research argues that the franchise is not derivative but *constitutive*, actively defining the political subject claiming the right. This summer, I will develop this argument into a standalone article, using paradigmatic cases like Scotland, Quebec, and Catalonia to demonstrate the franchise's independent normative force and challenge the foundational assumptions of dominant secession theories.

  **2. The Gap in Existing Theories: The Franchise as an Assumption, Not a Question**
  The dominant frameworks in secession theory are the **Remedial Right Only (RRO)** view (e.g., Allen Buchanan) and the **Plebiscitary (or Primary Right)** view (e.g., Harry Beran, Daniel Philpott). RRO argues secession is permissible only as a remedy for severe, persistent injustice. Plebiscitarians argue a clear majority vote within a territorial unit suffices. These positions clash fundamentally on the *conditions* justifying exit.

  However, **both implicitly agree on a critical prior point: identifying the relevant electorate ("demos") is settled by identifying the territorial unit or national group *before* the referendum question arises.** For RRO, the "victim group" defined by injustice dictates the electorate. For Plebiscitarians, the pre-existing territorial unit dictates the electorate. The franchise question is treated as downstream and administrative – once you know *who* has the right (the group/territory), you know *who votes* (its members/residents). The normative work of *defining* the electorate through franchise rules (e.g., age, residency, citizenship criteria) is obscured or ignored.

  **This is a genuine theoretical gap, not a point of agreement:** Neither theory provides principled grounds for resolving the contested franchise questions evident in real-world cases. Could Quebec legitimately restrict its vote to francophones? Could Catalonia include only those born there? Could Scotland have excluded non-Scots citizens resident in Scotland? RRO offers no guidance – the injustice doesn't automatically specify the franchise. Plebiscitarians default to "residents of the territory," but this begs the question: *which* territory? (e.g., Quebec vs. Canada; Catalonia vs. Spain). Neither theory acknowledges that *different franchise rules enact different conceptions of the sovereign people*, fundamentally altering the nature of the claim being made. The silence on *how* franchise rules *participate in constituting the political subject* leaves a critical dimension of secession's normative logic unexplored.

  **3. Research Question & Core Argument**
  **Precise Research Question:** *Does the specific design of the franchise (rules governing voter eligibility) in a unilateral secession referendum perform independent normative work in constituting the political subject ("the people") whose right to self-determination is being exercised, such that different franchise rules would render different conceptions of that subject authoritative and alter the legitimacy conditions of the secession claim?*

  **Core Hypothesis:** The franchise in a secession referendum is not merely a procedural mechanism for gauging pre-existing popular will within a pre-constituted unit. Instead, it is a *constitutive act* that defines the boundaries and character of the political community claiming the right to secede. The choice of franchise embodies and enacts a specific normative conception of belonging and political agency relevant to sovereignty. Consequently, the legitimacy of the secession claim is partially dependent on the justification for the *particular* franchise employed.

  **4. Method: Close Analysis of Franchise Contestation in Key Cases**
  My method moves beyond the limitations of the alternatives:
  *   **Not Pure Conceptual Analysis:** While engaging concepts like "people," "sovereignty," and "constituent power," I ground these in the concrete political struggles over franchise rules.
  *   **Not Comparative Constitutional Survey:** I won't catalogue global franchise laws. I focus intensely on the *normative arguments and political conflicts* surrounding franchise design in specific, high-stakes secession contexts.
  *   **Not Formal Franchise Design:** I won't model optimal voting rules abstractly. I analyze how existing or proposed rules *function* politically and normatively to define "the people."

  **Three-Month Work Plan:**
  1.  **Weeks 1-2: Deep Dive into Scottish Case (2014):** Analyze the debates and justifications surrounding lowering the voting age to 16 and restricting the vote to Scottish residents. Examine how proponents and opponents framed the franchise choices as defining Scottish citizenship, political maturity, and the scope of the decision's impact. *Why this case?* It provides the clearest example of a deliberate, contested franchise expansion explicitly linked to defining the political community.
  2.  **Weeks 3-4: Analysis of Quebec Referenda (1980, 1995):** Focus on the contested issues of residency requirements and the inclusion/exclusion of non-francophones and Indigenous peoples. Examine the Clarity Act debates and how they implicitly grapple with defining the Quebec demos. *Why this case?* It highlights the tension between territorial residency, national identity, and constitutional belonging in defining the electorate.
  3.  **Weeks 5-6: Analysis of Catalan Referendum Attempts (2014, 2017):** Examine how the Spanish state's insistence on Spanish citizenship/residency rules clashed with Catalan efforts to define the electorate based on residency in Catalonia or Catalan identity. Analyze the arguments about "disenfranchisement" and "illegitimacy." *Why this case?* It starkly reveals the state's power to impose a franchise that potentially undermines the secessionist claim by defining the relevant people differently.
  4.  **Weeks 7-9: Synthesizing the Normative Logic:** Analyze the patterns across cases: How do different franchise rules (age, residency, citizenship) implicitly define the basis of political belonging (territory, nationality, shared fate)? What normative arguments (fairness, affected interests, democratic agency, historical right) are deployed to justify specific rules? How do these justifications interact with the core claims of RRO and Plebiscitary theories?
  5.  **Weeks 10-12: Drafting the Article:** Structure the argument: Introduction framing the gap; Case studies demonstrating constitutive franchise work; Theoretical synthesis showing how this challenges RRO/Plebiscitary assumptions; Articulation of the franchise's independent normative role; Conclusion on implications for secession theory and practice.

  **5. Potential Conclusions & Deciding Factors**
  The article could conclude that:

  1.  **The Franchise is Strongly Constitutive:** Different franchise rules fundamentally alter the legitimacy and nature of the secession claim by defining different sovereign subjects. The justification for the specific franchise is inseparable from the justification for secession. *Deciding Factor:* If the case studies show franchise choices were pivotal contested sites *defining* "the people," and arguments for/against rules directly invoked competing visions of sovereignty and belonging.
  2.  **The Franchise is Moderately Constitutive:** While franchise rules shape the claim, they operate within constraints set by prior factors (e.g., territorial history, institutional context, national identity) and primarily refine rather than fundamentally redefine the sovereign subject. *Deciding Factor:* If franchise debates largely accepted a core pre-existing definition of the group/territory, with rules serving primarily to implement it fairly or efficiently.
  3.  **The Franchise Primarily Reveals Prior Commitments:** Franchise choices mainly reflect the underlying normative commitments of the actors (secessionist or state) regarding the relevant demos, rather than actively constituting it anew for the referendum. *Deciding Factor:* If franchise rules consistently mapped onto pre-referendum positions about the nation/territory held by the parties setting the rules, with little evidence of the rules themselves creating new normative realities.

  The evidence from the case studies – specifically, the intensity and nature of the franchise debates, the justifications offered, the alternatives considered, and the perceived stakes by actors – will determine which conclusion is best supported.

  **6. Failure Conditions & Scope Management**
  **Honest Failure Condition:** The most significant risk is that the analysis collapses into restating the **democratic boundary problem** (the circularity of defining "the people" democratically). While related, my focus is distinct: I examine how this intractable problem manifests concretely *within the specific institutional and political context of a secession referendum*, where the stakes of defining "the people" are exceptionally high and the act of franchising becomes a key site of contestation. Failure would occur if I cannot demonstrate that the franchise debate in these contexts does *more* than simply exemplify the general boundary problem – that it has unique features (e.g., urgency, high stakes, specific institutional constraints, interaction with secession justifications) or generates novel normative insights relevant to secession theory specifically. If the franchise question proves reducible solely to the boundary problem without adding specific value for understanding secession, the project's distinct contribution fails.

  **Realistic Scope for 3 Months/One Article:**
  *   **Must Cut:** Comprehensive analysis of all secession referenda. Detailed normative proposals for ideal franchise design. Extensive engagement with the vast literature on the democratic boundary problem beyond its direct relevance to secession. Deep dives into the historical or sociological roots of national identity in the cases. Addressing state responses beyond franchise imposition.
  *   **Promise Nobody:** A definitive solution to the boundary problem. A general theory of franchise design. Predictions about future secession movements. Exhaustive coverage of all potential franchise variables (e.g., diaspora voting gets only brief mention). A resolution to the Catalonia/Spain or Quebec/Canada disputes.

  **7. Conclusion: Significance**
  This research challenges a foundational assumption in secession theory, revealing the franchise not as a neutral tool but as a performative act that shapes the very subject claiming sovereignty. By meticulously analyzing the contested franchise rules in Scotland, Quebec, and Catalonia, I will demonstrate this constitutive function and argue that a complete normative theory of secession must account for the independent justificatory burden carried by the design of the franchise itself. This reframes our understanding of self-determination, highlighting how the rules of inclusion and exclusion are central to the politics of founding new political communities. The resulting article will offer a novel perspective relevant to theorists of secession, democracy, sovereignty, and constituent power.
