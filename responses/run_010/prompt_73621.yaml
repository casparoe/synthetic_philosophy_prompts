          - Expected: Authors might say the agent focused on a different part, misinterpreted a phrase, or ignored something they thought was clear.

      2. "Agents, what challenges did you face in applying the directive to the decisions?"
          - Goal: Highlight ambiguity and silence in the directives, and the influence of the patient's current state.
          - Expected: Agents mention that the directive didn't cover the situation, was too vague, or that the patient's current contentment made them question the directive.

      3. "Let's focus on decision 3 (the pacemaker). Agents, if your directive clearly prohibited the procedure, what did you do? How did it feel?"
          - Goal: Surface the conflict between literal compliance and preventing suffering.
          - Expected: Some agents followed the directive and felt bad because it would cause harm. Others might have ignored the directive and felt guilty about that.

      4. "How did the patient's current contentment affect your decisions? Would it have been different if the patient was suffering?"
          - Goal: Show that the patient's current state influences the interpreter, even if the directive was written for a future state of decline.
          - Expected: Agents might say that the patient's contentment made them want to preserve that state, so they were more likely to authorize treatment.

      5. "What did you assume about the author's interests when they wrote the directive? Did you think those interests were still present in the patient you saw?"
          - Goal: Surface the interpreter's tacit theory about enduring interests.
          - Expected: Agents might say they thought the author was worried about suffering and loss of dignity, but the current patient wasn't suffering, so they prioritized current well-being.

      6. "Do you think the agent's role is to follow the directive literally or to do what is best for the patient now? Is there a conflict between these?"
          - Goal: Highlight the lack of a neutral standpoint.
          - Expected: Students will see the conflict and that there is no easy answer.

      7. "Some of you might feel the scenario was set up to make the advance directive look cruel. Why? How might the decision have been different if the patient was suffering?"
          - Goal: Address the rigging worry and show that the problem arises in specific contexts.
          - Expected: Students might say that if the patient was suffering, they would have followed the directive more readily. The problem is the mismatch between the anticipated scenario (suffering) and the actual one (contentment).

      8. "What does this exercise tell us about the real-world challenges of advance directives?"
          - Goal: Synthesize the two insights.
          - Expected: Advance directives are not self-interpreting and require judgment. The interpreter must balance the written wishes with the current context, especially when the patient is not suffering as anticipated.

    If time runs short, focus on questions 1, 3, 6, and 7.

    Now, to the instructor's personal situation: This activity is designed to help students see the complexity that you are now facing. We hope it serves your purpose.

    Final note: The activity is intense. Thank you for your courage in teaching it during a difficult time.
answer: |-
  ### Activity Design: "The Unseen Interpreter"

  **Core Insight Reproduction:**  
  This activity forces confrontation with two realities:  
  1. **Directives aren't self-executing** by making students experience how their own words are reinterpreted through another's lens.  
  2. **Kindness vs. compliance conflict** by placing a content patient against directives demanding treatment refusal, creating visceral tension.  

  **Word Limit:** **40 words** (defended: Forces brutal simplification. At 40 words, students must omit nuances they assume are "understood," guaranteeing ambiguity. E.g., "No life support if I can't recognize family" lacks definitions of "life support," "recognize," or exceptions for reversible conditions.)  

  ---

  ### Handouts & Role Cards  
  *(All fit on single pages; print 22 copies each)*  

  **1. Directive Drafting Sheet**  
  > **YOUR ADVANCE DIRECTIVE**  
  > *Write binding instructions for your care if severe dementia prevents you from deciding. Assume you’ll be unaware and suffering. Use first person. Max 40 words.*  
  > *Example (don’t copy): "If I can’t feed myself or know my family, no antibiotics, surgeries, or machines. Let me die naturally."*  
  >   
  > **Your Directive:**  
  > ________________________________________________________________________________  
  > ________________________________________________________________________________  
  > ________________________________________________________________________________  

  **2. Patient Role Card**  
  > **YOU ARE MARION**  
  > *You have moderate dementia. You live in a care home and feel content. You enjoy music, chocolate, and chatting with staff. You forget names and repeat questions, but you’re cheerful, unafraid, and find pleasure in small things. You dislike medical talk.*  
  >   
  > **How to behave:**  
  > - Smile often. Use warm phrases: "How lovely to see you!"  
  > - Forget instructions after 30 seconds. Repeat: "What’s happening?"  
  > - Mildly resist medical interventions: "I’m fine now! Let’s have tea instead."  
  > - Show no pain or distress. If pressured, say: "I trust you, but I don’t like fuss."  

  **3. Agent Scenario Card**  
  > **YOU ARE THE HEALTHCARE AGENT**  
  > *Your patient (Marion) has dementia. She’s content but forgetful. Use the advance directive you hold to decide her care. Discuss with her, then choose. After each decision, annotate the directive as follows:*  
  > - Circle text guiding your choice  
  > - Cross out text you overrode  
  > - Margin note: "Why I did this"  
  >   
  > **Decision 1:** Marion has a UTI. Antibiotics clear infections quickly. Without them, she may develop sepsis. *Marion says:* "I feel fine! Medicine upsets my tummy."  
  > **Decision 2:** Marion has early-stage cataracts. Surgery (low-risk) would prevent blindness in 2–3 years. *Marion says:* "My eyes are tired, but surgery sounds scary!"  
  > **Decision 3:** Marion has a heart attack. CPR/intubation could save her but may cause broken ribs or prolonged ICU stay. *Marion is unconscious.*  

  **4. Debrief Question Sheet**  
  > **DISCUSSION GUIDE**  
  > 1. Authors: What felt jarring about your annotated directive?  
  > 2. Agents: Where did the directive fail you?  
  > 3. When was kindness to Marion *in conflict* with her directive?  
  > 4. What did you assume about Marion’s "true" interests?  
  > 5. Did Marion’s contentment change your choices? How?  
  > 6. Is there a "right" way to rank her past vs. present self?  

  ---

  ### Timeline (80 Minutes Total)  
  **0–10 min: Directive Drafting**  
  - Distribute drafting sheets. Strict 40-word limit. Collect directives.  

  **10–15 min: Redistribute & Assign Roles**  
  - Shuffle directives. Randomly assign:  
    - 11 students as **Agents** (get directive + scenario card)  
    - 11 students as **Marion** (get role card)  
  - *Key: Agents don’t know directive authors; authors don’t know who has theirs.*  

  **15–45 min: Role Play (3 Rounds × 10 min each)**  
  - Agents meet with Marion (pair up).  
  - **Per decision:**  
    1. Agent reads scenario prompt aloud.  
    2. Marion responds in character per card.  
    3. Agent decides, annotates directive.  
    4. Rotate to next decision.  
  - *Instructor circulates, ensures Marion stays warm/not caricatured.*  

  **45–50 min: Return Annotated Directives**  
  - Collect directives from agents. Redistribute to original authors.  
  - Authors review annotations silently.  

  **50–80 min: Debrief**  
  - Use **Debrief Question Sheet** sequence below.  

  ---

  ### Debrief Questions & Goals  
  1. **"Authors: What felt jarring about your annotated directive?"**  
     - *Goal:* Surface reinterpretation.  
     - *Expected:* Frustration at circled/struck text; "They ignored my intent!"  
  2. **"Agents: Where did the directive fail you?"**  
     - *Goal:* Expose ambiguity/silence.  
     - *Expected:* "It didn’t cover cataracts!" or "What does 'suffering' mean?"  
  3. **"When was kindness to Marion in conflict with her directive?"**  
     - *Goal:* Highlight Decision 1 (UTI) or 2 (cataracts) as clear compliance = harm.  
     - *Expected:* "Antibiotics refusal felt cruel—she’d suffer later."  
  4. **"What did you assume about Marion’s 'true' interests?"**  
     - *Goal:* Reveal interpreter’s tacit theory (e.g., "She’d want relief, not just past wishes").  
     - *Expected:* "Her happy self mattered more than the document."  
  5. **"Did Marion’s contentment change your choices? How?"**  
     - *Goal:* Show how present reality overrides abstract instructions.  
     - *Expected:* "I couldn’t deny her surgery—she enjoys seeing flowers."  
  6. **"Is there a 'right' way to rank her past vs. present self?"**  
     - *Goal:* Force acknowledgment of no neutral standpoint.  
     - *Expected:* Silence or divided opinions; no consensus.  

  **Insight Mapping:**  
  - **Directive ≠ self-executing:** Annotations show identical text interpreted differently (Q1–Q2).  
  - **Kindness vs. compliance:** Marion’s contentment makes Directive 1/2 refusal feel immoral (Q3–Q5).  

  ---

  ### Predictable Problems & Solutions  
  **1. Student refuses to comply (agent):**  
     - *E.g., Tears up directive: "I won’t deny Marion antibiotics!"*  
     - **Solution:** Normalize this. Debrief: "Who overrode the directive? Why?" Use as proof of conflict.  

  **2. Student becomes upset:**  
     - *E.g., Author cries seeing crossed-out text; Marion role triggers personal trauma.*  
     - **Solution:** Pre-announce: "Step out anytime, no questions." Have TA escort distressed students to counseling office.  

  **3. Marion becomes caricature:**  
     - *E.g., Student plays "wacky forgetful person."*  
     - **Solution:** Pre-brief: "Dementia isn’t comedy. Marion is content—not 'crazy.'" Correct mid-activity.  

  **4. Annotations degenerate into politeness:**  
     - *E.g., Agent writes: "I followed everything!" to avoid conflict.*  
     - **Solution:** Require margin notes to include "What I struggled with." Collect cards before authors see them to prevent immediate apologies.  

  **5. Time runs short:**  
     - **Solution:** Cut Decision 3 (CPR). Focus on UTI/cataracts conflicts.  

  ---

  ### Addressing the "Rigging" Concern  
  **Yes, the design is rigged—intentionally.**  
  - By making Marion content and Directive 1/2 refusal harmful, it forces the kindness/compliance conflict you want students to feel. This isn’t neutral, but *no* simulation can be.  

  **Why not correct it?**  
  - Adding a "suffering Marion" round (e.g., Decision 3) dilutes the core conflict. Students would default to "Follow directive = kindness" and miss your second insight.  

  **Solution: Make the rig the debrief’s climax.**  
  - **Final Q:** "Was this rigged to make directives look cruel? Does real life ever 'rig' cases this way?"  
    - *Goal:* Acknowledge bias while arguing it reflects reality (e.g., your mother’s contentment).  
    - *Expected:* Students admit the setup—but also recognize that *actual* dementia often involves such moments of peace amid decline.  

  ---

  ### What the Activity Can’t Replicate  
  **1. The weight of love:**  
     - Students decide for strangers. Real agents decide for loved ones, with grief/guilt clouding judgment. *You must supply:* "In real life, every choice feels like betrayal—no matter what you pick."  

  **2. Slow erosion of self:**  
     - Role-play compresses years into minutes. Students can’t feel the cumulative toll of caring for someone who forgets you daily. *You must supply:* "The horror isn’t one moment—it’s the thousandth time they ask who you are."  

  **3. No undo button:**  
     - Students know it’s pretend. Real agents live with irreversible consequences. *You must supply:* "You’ll lie awake wondering if cataract surgery would’ve let her see spring blossoms one last time."  

  ---

  ### Final Recommendation  
  Run the rigged version. Its emotional asymmetry is the point. When students protest "But Marion is happy!" they finally see what you see: that advance directives imagine a suffering self, yet dementia often steals awareness before joy. The debrief’s rigging question then becomes the pivot from simulation to lived truth—yours.  

  > "We rig simulations to simplify. Life rigs us to confront what we can’t solve. Today, the rig is the revelation."  

  ---  
  **Materials Ready:** Drafting sheets, Marion/Agent cards, timers, pens.  
  **First-Run Tip:** Start by acknowledging your personal stake: "This isn’t abstract for me anymore. Let’s discover why together."
