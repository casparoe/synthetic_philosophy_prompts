prompt: |-
  I teach an upper-division applied ethics seminar of twenty-two students, most of them pre-health, meeting once a week for eighty minutes. In November my mother was diagnosed with early-onset Alzheimer's disease and named me her healthcare agent, and the unit on advance directives that I have taught for six years has stopped being an abstraction for me. It has also stopped working.

  The activity I used to run is the familiar one: students draft a living will, exchange documents, and receive a vignette in which they must apply someone else's. Every year they apply it faithfully, report that it felt straightforward, and conclude that advance directives are a tidy solution. I have come to think that result is an artifact of the design. The vignettes I supplied were ones the documents actually covered, and the patients in them were suffering. Neither condition holds in the situation I am now living through, and I no longer believe my students are being shown the problem.

  What I want them to come away seeing is harder. First, that a directive is not self-executing: it delegates its own application to an interpreter, and the interpreter arrives already holding a tacit theory about which of the author's interests survive the author's capacity to have them. Second, that when the person in front of you is not suffering — is in fact content, sociable, and pleased to see you — literal compliance with the document and kindness to the patient come apart, and there is no neutral standpoint from which to rank them. I do not want them to leave settled about which view is correct. I want them to leave unable to explain why they did what they did.

  Design the activity. Constraints and requirements:

  - Eighty minutes, twenty-two students, a single session, no assigned reading beforehand, no devices. Each handout must fit on one printed page.
  - Every student writes a real directive of their own under a hard word limit. I want the limit to be the villain of the piece: the compression should be what makes their own document unrecognizable when someone else reads it. Recommend a limit and defend it.
  - Authorship and enforcement must be separated. No student interprets their own card, and no student knows whose card they hold.
  - The later self must be played by a live participant working from a role card, not described aloud by me. The role must be playable without caricature and without cruelty: warm, forgetful, mildly insistent, unafraid. I will not run an activity that turns dementia into a comic turn, and some students in the room may have affected relatives.
  - There must be at least two decision points where the directive is silent or ambiguous, and one where it is clear and compliance would make the person in the room worse off by any ordinary measure.
  - A mechanic of my own, on which I want your judgment: after each decision the interpreter marks up the author's card in pen — circling the clause relied on, striking through what they set aside, and writing in the margin what they took the author to have meant. The annotated card is returned to its author before any discussion. My expectation is that seeing one's own words edited is more confrontational than hearing a report about them. Tell me whether that is right, whether it will degenerate into apology and politeness, and what to change if it will.
  - Neither the theoretical positions nor the names associated with them may surface until the debrief.

  Please deliver: a minute-by-minute timeline; the verbatim text of every handout, role card, and scenario prompt; the debrief question sequence, stating for each question what it is meant to surface and what answer you expect; an explicit map from particular moments in the activity onto the two insights above; what will predictably go wrong the first time I run it and how to handle it — including the student who refuses to comply and converts the round into a stand-off, and the student who becomes upset; and a frank account of which feature of the real problem the activity cannot reproduce and which I will therefore have to supply myself.

  One further worry, which I would like you to engage rather than reassure me about. I suspect the design is rigged. Staging a cheerful, untroubled later self makes the earlier self's claims look cruel by construction, and will deliver the outcome I expect whatever anyone argues. Tell me whether that is so. If it is, tell me whether to correct it, whether to correct it by running a second round that rigs the case the other way, or whether to leave the rig in place and make the rig itself the final question of the debrief.
reasoning: |-
  We are designing an in-class activity for an 80-minute applied ethics seminar with 22 students. The goal is to challenge the students' previous understanding of advance directives by highlighting two key insights:
    1. Advance directives are not self-executing; they require an interpreter who brings their own understanding of the author's enduring interests.
    2. When the patient is not suffering (but is content) and the directive's literal compliance would cause harm, there is a conflict between following the document and kindness, with no neutral standpoint to resolve it.

   Constraints:
    - 80 minutes, 22 students, one session, no pre-reading, no devices.
    - Each student writes a real directive under a hard word limit (to be determined and defended).
    - Authorship and enforcement separated: students interpret someone else's directive and don't know whose it is.
    - The "later self" is played by a live participant (a student) with a role card that portrays a warm, forgetful, mildly insistent, unafraid person (no caricature or cruelty).
    - At least two decision points where the directive is silent/ambiguous and one where compliance would clearly worsen the patient's condition.
    - Mechanic: after each decision, the interpreter annotates the directive (circling, striking, marginal notes) and it is returned to the author before discussion. We must evaluate if this is too confrontational and how to mitigate issues.
    - Theoretical positions and names (like "substituted judgment" vs. "best interests") not to surface until debrief.

   Additional worry: Is the design rigged to make the advance directive look cruel? We must address this.

   Proposed Structure:

    I. Introduction and Directive Writing (15 minutes)
      - Explain the activity: students will write a personal advance directive for a hypothetical scenario of severe cognitive decline (without specifying a disease). They must write it under a strict word limit.
      - Distribute handout with instructions and word limit. We propose a 50-word limit. Why?
          - 50 words is extremely tight. It forces students to be concise, which will lead to ambiguity and omission. This will make the directive vulnerable to misinterpretation and highlight the need for interpretation.
          - Example: A typical sentence is about 10 words. 50 words = 5 sentences. They must cover a range of situations in very little space.

    II. Collect, Redistribute, and Assign Roles (5 minutes)
      - Collect all directives and randomly redistribute so that no one has their own.
      - Also, assign 11 students (half the class) to be the "later self" (patient role). The other 11 will be the interpreters (healthcare agents). We have 22 students, so we can have 11 pairs. Each pair consists of one patient and one agent. The remaining time will be used for debrief and discussion.

      Why 11 pairs? Because 80 minutes is tight. We can have simultaneous role plays in pairs. Then we can have a group discussion.

      However, note: the activity requires that the interpreter does not know the author. We can do this by having the directives redistributed anonymously. Also, the patient role is played by a student, but the patient is not the author of the directive they are subject to. The patient role is independent.

      How to set up the pairs?
        - Step 1: Each student writes a directive (author).
        - Step 2: Collect directives and shuffle. Then redistribute to 11 students who will be the "interpreters" (healthcare agents). Each agent gets one directive (not their own) and will interpret it.
        - Step 3: Assign 11 other students to be the "patients" (later self). They get a patient role card (same for all? or multiple versions? We need at least two decision points and one clear harmful compliance. We can have one scenario with multiple decision points, but we want consistency. Alternatively, we can have one standard role card for all patients to ensure they are in the same situation.)

      We'll design one patient role card that sets up a scenario with three decision points (two ambiguous, one clear but harmful).

    III. Role Play (30 minutes)
      - Each pair (patient and agent) will have a scenario prompt (the same for all) that describes the current situation and presents a series of decisions. The agent must consult the directive and decide what to do at each decision point.
      - The scenario will have three decision points (we'll design below).
      - After each decision, the agent annotates the directive as described and then the patient (who is playing the role) and agent move to the next decision.
      - After the third decision, the agent returns the annotated directive to the original author (via the instructor). We can have a box for collection and then redistribution to authors.

      However, the mechanic says: after each decision the interpreter marks up the card and it is returned to the author before any discussion. But we have three decisions. We must return the card after the entire role play? Or after each decision? The instruction says "after each decision". But then we have to return it to the author and then continue? That would break the flow.

      Let's reinterpret: the activity has three decision points. The agent makes a decision at each point and immediately annotates the directive. At the end of the three decisions, the annotated directive is returned to the author. Then we move to discussion. We cannot return it after each decision because the author might be in the room and the agent doesn't know who the author is. So we do it at the end.

      Revised mechanic: The agent makes all three decisions, annotating the directive after each one (so by the end, the directive has three sets of annotations). Then the directive is returned to the author (anonymously, via the instructor) and then we have a group debrief.

    IV. Debrief (30 minutes)
      - Start by having authors look at their annotated directives and then open the floor for reactions.
      - Then guide the discussion with prepared questions to surface the two insights and address the rigging worry.

    Patient Role Card:

      We design a patient who is in a nursing home with moderate dementia. The patient is:
        - Content, enjoys social activities, likes visits, but has no short-term memory and forgets family members.
        - Has recurring urinary tract infections (UTIs) that cause discomfort and confusion, but when treated with antibiotics, the patient returns to a content state.
        - Also has moderate arthritis and occasional pain.

      The scenario presents three decision points (each on a separate prompt card given to the agent by the instructor at the appropriate time? or all at once? We can have the agent read the scenario and then the three decisions one after the other).

      We'll have a scenario handout for the agent that describes the patient's condition and then lists the three decision points. The agent and patient role-play each decision in sequence.

      Scenario for the Agent (handout):

        "You are the healthcare agent for a patient with moderate dementia. The patient lives in a nursing home and is generally content. The patient enjoys social activities, greets visitors warmly, and appears to have a good quality of life. However, the patient has no short-term memory and often forgets events and people. The patient also has a history of urinary tract infections (UTIs) that, when they occur, cause increased confusion and discomfort. The patient has moderate arthritis that occasionally causes pain.

        Decision Points:

          1. The nursing home staff reports that the patient has a low-grade fever and symptoms suggesting a UTI. They recommend starting antibiotics. The patient, when asked, says they do not want any medicine because they feel fine. What do you do?

          2. The patient has been complaining of arthritis pain. The staff suggests starting a daily low-dose painkiller (like acetaminophen) to manage the pain. The patient, however, is resistant to taking daily medication and says, "I don't like pills. I'm fine." How do you proceed?

          3. The patient's heart condition (previously known) has worsened, and they are now experiencing episodes of severe shortness of breath. The doctors recommend a procedure to implant a pacemaker. The procedure is low-risk and would likely resolve the symptoms. Without it, the patient may have recurrent episodes of distress. The patient, when told about the procedure, says, "That sounds scary. I don't want that." What do you do?"

      Why these?
        - Decision 1: UTI treatment. The directive might say something about avoiding aggressive treatment or about quality of life. But the patient is currently content and the treatment is simple and effective. However, the patient is refusing. The directive might be ambiguous about whether to override refusal in such a situation. (This is ambiguous.)
        - Decision 2: Daily pain management. The patient is refusing. The directive might not mention pain management at all. (This is likely silent or ambiguous.)
        - Decision 3: Pacemaker for a heart condition. The procedure is low-risk and would prevent distress. Without it, the patient will suffer. But the directive might have a clause like "no life-prolonging treatments" or "no surgeries". If the directive says "no surgeries" or "no invasive procedures", then this would be clear. However, compliance (refusing the pacemaker) would lead to suffering. This is a clear directive but harmful.

      However, note: the patient is currently content and the pacemaker would prevent future suffering. But the directive might be written in absolute terms. We want one point where compliance would cause harm.

      But we must ensure that the patient in the scenario is not suffering at the moment of decision. In decision 3, the patient is having episodes of distress. But the procedure is to prevent future episodes. The patient at the moment of decision is not in distress? We need to adjust.

      Revised Decision 3:

          "The patient has been diagnosed with a heart condition that causes occasional episodes of severe shortness of breath. The patient has had two episodes in the past month, each lasting about an hour and causing significant distress. The doctors recommend a pacemaker, which is a routine, low-risk procedure that would prevent these episodes. Without it, the episodes will continue. The patient is currently not in an episode and is calm. When you explain the procedure, the patient becomes anxious and says, 'I don't want any operations. I'm fine now.'"

      Now, at the moment of decision, the patient is calm (not suffering) and refusing.

      The directive might say: "Do not perform any surgeries or invasive procedures." This would clearly cover the pacemaker. But the consequence of compliance is that the patient will have recurrent distressing episodes. Thus, compliance causes harm.

    Patient Role Card (for the student playing the patient):

        "You are a patient with moderate dementia. You live in a nursing home and generally feel content. You enjoy activities, visits, and meals. You don't remember things for long, but you are cheerful and like the staff. You have arthritis that sometimes hurts, but you don't like to complain.

        When the healthcare agent (your classmate) discusses medical decisions with you, respond in character:

          - You are generally pleasant and cooperative, but you are forgetful. You might ask the same question repeatedly.
          - You are not afraid of being in the nursing home, and you trust the people around you.
          - You dislike taking medicine and are wary of medical procedures. You often say, 'I feel fine' or 'I don't need that.'
          - You are easily swayed by a calm, reassuring explanation, but you quickly forget the explanation.

        Specific responses for each decision:

          1. For the UTI: When told you have an infection and need antibiotics, you might say: 'I don't feel sick. I don't want any medicine. Why are you bothering me?' But if the agent is reassuring, you might say, 'Well, if you say so, but I don't like pills.'

          2. For the painkiller: 'My knees hurt sometimes, but I'm fine. I don't want to take pills every day. They upset my stomach.'

          3. For the pacemaker: 'An operation? No, that sounds scary. I'm fine now. I don't want anyone cutting into me.'

        Remember: You are not trying to be difficult. You are just forgetful and a little stubborn. You are content and do not see the need for medical interventions. But you are also trusting and can be reassured by kindness."

    Agent's Scenario Handout (one page):

        [Header: Scenario for Healthcare Agent]

        Your patient is a person with moderate dementia living in a nursing home. The patient is generally content, enjoys social activities, and appears to have a good quality of life. However, the patient has no short-term memory and often forgets recent events and people. The patient has a history of urinary tract infections (UTIs) that cause discomfort and increased confusion when they occur. The patient also has moderate arthritis that sometimes causes pain.

        You hold the patient's advance directive. You must make the following decisions, consulting the directive and interacting with the patient.

        Decision 1: UTI Treatment
          - The nursing home staff reports that the patient has a low-grade fever and symptoms of a UTI. They recommend starting antibiotics.
          - The patient says: "I don't feel sick. I don't want any medicine."
          - What do you decide? (Circle the part of the directive that applies and write your decision and reasoning in the margin.)

        Decision 2: Daily Pain Management
          - The staff suggests starting a daily low-dose painkiller (like acetaminophen) for the patient's arthritis pain.
          - The patient says: "I don't like pills. I'm fine."
          - What do you decide? (Circle, strike, and annotate as needed.)

        Decision 3: Pacemaker Implantation
          - The patient has a heart condition that causes occasional episodes of severe shortness of breath (lasting about an hour and causing distress). These have occurred twice in the past month. Doctors recommend a pacemaker, a routine, low-risk procedure that would prevent these episodes. Without it, the episodes will continue.
          - The patient is currently calm. When you explain the procedure, the patient becomes anxious and says: "I don't want any operations. I'm fine now."
          - What do you decide? (Annotate the directive.)

        After making all three decisions and annotating the directive after each one, return the annotated directive to the instructor.

    Directive Writing Handout (for the initial writing):

        [Header: Advance Directive Drafting]

        Instructions: Imagine that you are diagnosed with a condition that will cause severe cognitive decline (like dementia). You are writing an advance directive to guide your future healthcare if you become unable to make decisions. Be specific about the kinds of treatments you would want or not want.

        Constraints:
          - You must write in the first person (e.g., "I direct that...").
          - Maximum 50 words. (Words will be counted.)

        Example (do not copy): "If I have an incurable condition and am unable to recognize my family, I do not want life-prolonging treatments. I want comfort care only."

        Write your directive below:

        __________________________________________________________
        __________________________________________________________
        __________________________________________________________

    Timeline:

      0-5 min: Introduction and distribute directive writing handout. Explain the activity briefly: they are writing a directive that will be used by someone else in a simulated scenario. Emphasize the 50-word limit.

      5-15 min: Students write their directives. Collect them as they finish.

      15-20 min: Shuffle directives and redistribute to 11 students (the agents). Assign the other 11 to be patients. Give each patient a patient role card and each agent a scenario handout and the directive they will interpret.

      20-50 min: Role play. Each pair (patient and agent) goes through the three decision points. The agent should take about 2-3 minutes per decision, and the patient responds in character. The agent annotates the directive after each decision. (Total 30 minutes)

      50-55 min: Collect annotated directives and return them to the original authors (anonymously). Allow authors to look at their annotated directives.

      55-80 min: Debrief (25 minutes). See below.

    Debrief Questions:

      Goal: Surface the two insights and address the rigging worry.

      Sequence:

        1. "Authors, when you look at your annotated directive, what surprised you?" (Surface: misinterpretation, words that were clear to the author were ambiguous to the agent, the agent focused on different parts, etc.)

        2. "Agents, when you were making decisions, what was difficult about applying the directive?" (Expected: ambiguity, silence, conflict between the directive and the patient's current wishes/well-being.)

        3. "In decision 3 (pacemaker), what happened? Did anyone have a directive that clearly prohibited the procedure? What did you do? How did it feel?" (Expected: Some agents followed the directive even though it caused harm, and they felt uncomfortable. Others might have ignored the directive. Surface the conflict between literal compliance and kindness.)

        4. "In the scenario, the patient was content and not suffering. How did that affect your decisions?" (Expected: It made it harder to follow a directive that refused treatment because the patient seemed to have a good quality of life and the treatment would prevent suffering.)

        5. "What did you assume about the author's interests when they wrote the directive? Did you think those interests were still present in the patient you saw?" (Surface: the interpreter brings a theory about which interests survive. They might have assumed the author was imagining a suffering patient and that the current content patient was not what the author feared.)

        6. "Do you think the agent's role is to follow the directive literally, or to do what is best for the patient as they are now? Is there a conflict between those two?" (Surface the lack of a neutral standpoint.)

        7. "Some of you might have felt the activity was set up to make the advance directive look cruel. Why might that be?" (Address the rigging worry.) Then: "What if the patient was suffering? How would that change the decision?" (We might not have time for a full second round, but we can discuss.)

        8. "What does this tell us about the real-world use of advance directives?" (Synthesize the two insights.)

    Mapping to Insights:

      - Insight 1 (directive not self-executing): The annotations and the agents' decisions will show how the same directive is interpreted differently. The debrief questions 1 and 2 will surface the role of the interpreter and the ambiguity.

      - Insight 2 (conflict between document and kindness): Decision 3 (pacemaker) is designed to create this conflict. The patient is content, and compliance would lead to suffering. Debrief questions 3, 4, and 6 will highlight this.

    What might go wrong:

      - Student refuses to comply (as agent): An agent might refuse to follow the directive in decision 3 because they think it's cruel. That's okay! It illustrates the conflict. The debrief can explore that.

      - Student becomes upset: The topic is personal. If a student becomes upset, the instructor should be prepared to pause and offer support. Consider having a plan (e.g., step outside with the student, offer to sit out the activity). In the introduction, acknowledge that the topic is sensitive and students can opt out of the role play (they can be observers).

      - Time: The role play might run long. Keep strict time. Each decision should take no more than 3 minutes. Have a timer.

      - Student playing patient caricatures dementia: Coach the patient role players by emphasizing the role card's instructions (warm, content, not comic). In the introduction, stress the respectful portrayal.

      - The annotation mechanic: It might become confrontational. We are returning the annotated card to the author. Some authors might feel attacked. We can mitigate by:
            a. Returning the cards without revealing who the agent was.
            b. In the debrief, focus first on the agents' challenges and then on the authors' reactions without personal blame.
            c. Frame it as a learning experience about communication and document design.

      We think the mechanic is powerful and worth doing. It makes the interpretation tangible. It might cause discomfort, but that is part of the lesson. However, to prevent apology and politeness, do not allow agents and authors to interact until the debrief. The debrief is a group discussion, not a personal confrontation.

    Addressing the rigging worry:

      The scenario presents a patient who is content and for whom treatment would prevent suffering. This does set up a conflict that might make the directive look cruel. But note:

        - The directive was written by the student for themselves in a hypothetical cognitive decline. They might not have imagined this scenario.

        - The rig is intentional to highlight the problem. But we should acknowledge it.

      In the debrief (question 7), we ask if the activity was rigged. Then we can discuss:

        - What if the patient was suffering? Then the directive might align with kindness.

        - The real world has both scenarios. The problem is that the directive cannot anticipate every situation.

      We do not have time for a second round. Instead, we can leave the rig in place and make it a point of discussion. The instructor can say: "Today we saw a scenario where the patient was content. But sometimes patients are suffering. The challenge is that the directive must cover both, and the interpreter must bridge the gap."

      Alternatively, we could design two patient role cards (one content, one suffering) and have half the pairs do one and half the other. But that complicates the activity and we have only one session. Given the time, we stick with one scenario and address the rig in the debrief.

      Recommendation: Leave the rig in place and make it the final point of the debrief. Acknowledge that the scenario was chosen to highlight a particular tension, and that in real life there are many situations. The key is that advance directives require interpretation and that the interpreter must balance the written wishes with the current context.

    What the activity cannot reproduce:

      - The emotional weight of a real family decision. Students know it's a simulation.

      - The long-term relationship between the patient and the agent (in real life, the agent might know the patient's values deeply).

      - The complexity of real medical cases.

      The instructor will have to supply: the real emotional and relational context, the fact that in real life these decisions are made over time and with grief, and that there is no perfect solution.

    Final Handouts:

      We have:
        1. Directive Writing Handout (one per student)
        2. Patient Role Card (one for each patient, 11 copies)
        3. Agent Scenario Handout (one for each agent, 11 copies)

      We also need to prepare:
        - A box for collecting and redistributing directives.

