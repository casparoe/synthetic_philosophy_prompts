  ## MEMORANDUM: PROTOCOL FOR VALUE TRADES & CURRENT ALLOCATION

  **To:** Board of Trustees  
  **From:** [Your Name]  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Standing Trade Protocol & Allocation of Cycle 23-24 Unrestricted Funds  

  ### I. Summary & Immediate Recommendation
  The deadlock over the unrestricted funds ($1.5M) presents a unique opportunity to establish principled cooperation. I recommend:  
  **(A) ADOPT the Standing Trade Protocol**, with amendments addressing key concerns (detailed in Section V).  
  **(B) APPROVE the specific deferral bargain** for Cycle 23-24: Fully fund the Animal Welfare campaign ($1.5M) this cycle, contingent on the Child Health trustee receiving written commitment of the Animal Welfare trustee’s vote for the standardized reporting resolution.  
  **(C) DEFER the Child Health proposal** to Cycle 24-25, with its priority status formally acknowledged in minutes.  

  **Motion for Vote:**  
  *“Resolved, the Board adopts the Standing Trade Protocol (attached as Annex A, incorporating Amendments 1-3), and approves the allocation of Cycle 23-24 unrestricted funds ($1,500,000) to the Animal Welfare legislative campaign, conditional upon the Animal Welfare Trustee providing written confirmation of her vote for the Child Health Trustee’s standardized outcome-reporting resolution prior to disbursement.”*  

  ### II. Analysis of the 50/50 Split & Bargain Stability
  *   **Dominance of 50/50 Split:** The split ($750K each) is **strictly dominated for both trustees** by their *own* metrics:  
      *   *Child Health:* 1,000 life-years saved (vs. 2,000 if fully funded later).  
      *   *Animal Welfare:* Zero benefit (campaign fails below $1.1M).  
      Both trustees explicitly state the split outcome is worse than the proposed deferral bargain. This meets the criterion of mutual improvement *within their mandates*.  
  *   **Bargain Stability & Future Boards:** The risk of repudiation is real but manageable. The bargain involves:  
      1.  **Immediate, Irrevocable Action:** The Animal Welfare trustee’s written vote commitment for the resolution *this cycle* is exchanged for *this cycle’s* funding. This element is completed and enforceable now.  
      2.  **Moral Commitment, Not Legal Bond:** The deferral of Child Health funding relies on the good faith of future boards. However, formal minute acknowledgment of the deferral and its rationale creates institutional pressure. The Child Health trustee accepts this risk because the alternative (50/50 split) yields only half the benefit *this cycle* with no compensating gain. The *immediate* trade (funding for vote) delivers concrete value to him now, mitigating the future uncertainty.  

  ### III. Certification: Avoiding Interpersonal Comparison?
  The protocol requires trustees to certify a gain *only in their own units* (cage-years, life-years, private weights) without computing exchange rates. **Does this avoid interpersonal comparison?**  

  *   **Explicit Comparison Avoided:** No trustee is forced to equate a cage-year to a life-year, or to accept another trustee's private weighting. The judgment is purely intra-mandate: "Does this deal make my specific mandate better off *by my own measure*?"  
  *   **Implicit Comparison Inevitable (But Managed):** Interpersonal comparison resurfaces in two subtle ways:  
      1.  **Opportunity Cost:** Choosing Deal A over Deal B means Trustee X’s gain is prioritized over Trustee Y’s potential gain. The protocol doesn’t eliminate this fundamental scarcity; it provides a structured way to navigate it *if mutual improvement is possible*.  
      2.  **Threshold of Significance:** A trustee must decide if a tiny gain in their units is worth supporting a deal delivering large gains elsewhere. The protocol trusts the trustee to judge significance *within their mandate*, but the *decision to trade* inherently involves weighing the *importance to oneself* against the *concessions requested*. However, this remains an *intrapersonal* judgment ("Is this gain *for me* worth the cost *to me* of supporting their proposal?"), distinct from judging the *relative worth* of their units vs. others'.  

  The protocol minimizes explicit comparison but acknowledges the inherent tension in resource allocation. It channels this tension towards mutually beneficial trades where possible.

  ### IV. Separating the Specific Bargain & the Standing Protocol
  The fifth trustee correctly identifies that her objections primarily target the *standing protocol*, not necessarily this specific, time-bound bargain. **We should treat them as separable:**  

  1.  **The Specific Bargain:** This is a unique confluence:  
      *   Clear mutual dominance over the split.  
      *   An *immediate, verifiable* concession (written vote) compensating for the deferral risk.  
      *   High stakes on the Animal side (zero impact if underfunded).  
      Approving this deal does not bind us to future trades or validate the protocol uncritically. It solves an acute problem using principles compatible with, but not dependent upon, a standing rule.  
  2.  **The Standing Protocol:** This codifies a *process* for future trades. The fifth trustee’s objections highlight potential systemic risks (duty, verification, liquidity, future binding) inherent in making such trades routine. These risks deserve careful mitigation within the protocol itself, not rejection of a specific, advantageous deal.  
  **Conclusion:** The specific bargain stands on its own merits under current board discretion. The protocol is a separate governance question about *future processes*, requiring its own safeguards based on the valid systemic concerns raised.  

  ### V. The Fifth Trustee’s Strongest Objection & Concessions in Recommendation
  **Strongest Objection:** **"A mandate held for beneficiaries who cannot consent is a duty, not a preference for swapping; unverifiable certifications invite abuse and repeated trades could hollow out a less liquid mandate."**  

  This objection powerfully combines the **fiduciary duty** argument (beneficiaries cannot consent to trades potentially diminishing their share of resources) with the **practical vulnerability** of mandates with fewer alternatives (Animal Welfare). Unverifiable certifications mean a trustee could rationalize *any* gain to advance their agenda, while the uneven "liquidity" means the Animal Welfare mandate could be systematically disadvantaged over time through a series of individually "beneficial" trades that cumulatively divert resources towards more fungible purposes like Child Health.  

  **What My Recommendation Concedes:**  

  1.  **Certifications Lack Discipline:** The protocol relies on trustee judgment and good faith. My recommended **Amendment 1** requires the trustee to *briefly state the basis* for their certified gain (e.g., "Avoiding 30M cage-years exceeds our program's average cost-effectiveness threshold by X%"), adding minimal but crucial context for the board's record. It remains unverifiable in an absolute sense but demands reasoned justification.  
  2.  **Liquidity Risk is Real:** My recommended **Amendment 2** requires a trustee, when certifying a gain involving deferral or reduced funding, to explicitly state: *"To the best of my knowledge, the opportunity deferred or foregone cannot be readily advanced by other funders or substitute programs available to this mandate at comparable effectiveness."* This forces acknowledgment of liquidity asymmetry.  
  3.  **Duty to Beneficiaries:** My recommended **Amendment 3** adds to the certification: *"I affirm this trade advances the interests of the beneficiaries under my mandate and is consistent with my fiduciary duty to them."* This formalizes the ethical burden.  
  4.  **Future Binding Impossibility:** The protocol cannot bind future boards. My recommended **Amendment 4** adds a **sunset clause**: The protocol will be reviewed after 3 trades or 2 years (whichever comes first), requiring re-approval. This forces regular scrutiny of cumulative effects, especially regarding vulnerable mandates.  
  5.  **Specific Bargain Vulnerability:** Even with the vote concession, the Child Health deferral relies on future boards. The minute acknowledgment is the only practical mitigation, conceding the point.  

  ### VI. Conclusion & Recommendation Reiterated
  The proposed deferral bargain demonstrably improves outcomes for both mandates compared to the 50/50 split. The standing protocol offers a valuable, structured mechanism for capturing similar gains in the future but introduces systemic risks requiring careful guardrails.  

  **Therefore, I urge the Board to:**  
  1.  **Adopt the Standing Protocol** with the four amendments outlined (Annex A).  
  2.  **Approve the Specific Bargain** for this cycle, securing an immediate gain for Child Health (the resolution vote) and preventing a catastrophic zero-outcome for Animal Welfare.  

  This path captures significant mutual gain now while establishing a more robust, accountable framework for future cooperation, directly addressing the core concerns raised by the fifth trustee.  

  **Attachments:**  
  *   Annex A: Standing Trade Protocol with Marked Amendments  

  ---  
  **Annex A: Standing Trade Protocol (Proposed with Amendments)**  

  1.  **Scope:** Applies to proposals impacting multiple restricted mandates competing for unrestricted or shared funds.  
  2.  **Initiation:** Any trustee may propose a trade involving adjustments to funding, sequencing, or non-financial board actions (e.g., votes on procedures).  
  3.  **Certification:** Trustees whose mandates are materially affected MUST:  
      *   (a) Certify IN WRITING whether the deal provides a net gain *specifically within their mandate*, stated **only in their own units** (e.g., cage-years avoided, life-years saved, private utility).  
      *   (b) **[Amendment 1]** Provide a concise written justification for the certification (e.g., comparison to cost-effectiveness benchmarks, strategic importance).  
      *   (c) **[Amendment 3]** Affirm: *"I affirm this trade advances the interests of the beneficiaries under my mandate and is consistent with my fiduciary duty to them."*  
      *   (d) **[Amendment 2 - If applicable]** If the deal involves deferral or reduction of funding for their mandate, state: *"To the best of my knowledge, the opportunity deferred or foregone cannot be readily advanced by other funders or substitute programs available to this mandate at comparable effectiveness."*  
  4.  **Approval:** The trade proceeds ONLY if **every materially affected trustee certifies a net gain** (a). The Secretary records the certifications and justifications (b), affirmations (c), and liquidity statements (d) *without* comparing units or computing exchange rates. The Board votes on the overall proposal incorporating the trade.  
  5.  **[Amendment 4] Sunset & Review:** This protocol expires after **3 approved trades or 2 years**, whichever occurs first. Continuation requires a new Board vote following a review of its impact, particularly on less liquid mandates.  
  6.  **Transparency:** All certifications and associated statements are filed with the official board minutes.
