  The key challenge is making this both technically accurate in its absurdity (so bioethicists get the joke) while feeling authentically like corporate healthcare correspondence (so regular people recognize the infuriating insurer voice). No irony can bleed into the narrator's tone - she must genuinely believe this is progress.

  Hmm, the reference class concept is particularly rich for satire. The actuarial team gets to define comparison groups arbitrarily: age-matched, sex-matched, national averages, or even "you-at-twenty." This will let me generate all the problematic cases the user requested naturally:

  For preventive care - if you're above median pre-treatment, tough luck. For surprisingly effective treatments - exceeding median makes it enhancement. For people who don't want "normal" functioning - the system overrides personal goals. For narrowly defined domains - a hand injury becomes "cosmetic" if grip strength is all that matters.

  The cases section is where the satire lands hardest. I'll include: 
  - A perfectly healthy BRCA+ patient denied preventive mastectomy ("current breast cancer risk: 47th percentile!")
  - A depression patient who responds too well to ketamine ("now scores BELOW depression thresholds!")
  - An elderly person's cataract surgery denied because vision is compared to 80-year-olds ("20/60 meets age-norm!")
  - A violinist's hand injury coverage limited to median grip strength ("artistic needs are enhancement!")
  - A chronic pain patient penalized for yoga ("you already exceed mobility median!")

  Ending with the CMO's own claim denial is crucial. Maybe... osteoporosis drugs? Since she's post-menopausal but her bone density is still above the 50th percentile for 60-year-olds. She'll praise the system's fairness with disturbing sincerity. 

  The corporate voice needs specific touches: "streamlined experience," "consistent application," "aligned with your benefits," and that classic closing line about being "proud to serve." Lay readers will feel visceral rage at phrases like "non-covered enhancement" while ethicists cackle at the precision of the moral violence.
answer: |-
  **HEALTHPLUS MEMBER NOTICE**  
  *Office of the Chief Medical Officer*  

  Dear Valued Member,  

  At HealthPlus, we are committed to delivering fair, consistent, and scientifically grounded coverage decisions. Beginning next quarter, we will implement our groundbreaking *Automated Restorative Ceiling System (ARCS)* for all prior authorization and claims adjudication. This innovation ensures objectivity by applying a single, evidence-based standard: the **Restorative Ceiling**.  

  Under this system, an intervention is deemed medically necessary—and thus covered—only if two conditions are met: First, without the intervention, your expected functioning in the relevant health domain must fall below the median of your actuarially defined reference class. Second, the intervention must restore you *to* that median, but no further. This principle distinguishes genuine therapy (restoring health) from enhancement (exceeding typical function), which remains a personal financial responsibility. Your reference class—determined by our actuarial team using aggregated claims data—may include factors like age, biological sex, or national averages, and is tailored to each clinical domain.  

  During our pilot phase, ARCS processed over 120,000 determinations with flawless consistency. Let me share several illustrative outcomes:  

  - **Preventive Mastectomy (Member 44891):** A female member with the BRCA1 mutation sought coverage for prophylactic mastectomy. ARCS determined her *current* breast cancer risk (17%) placed her at the 47th percentile for age-matched females. Since this exceeded the 50th percentile median threshold, the procedure was classified as risk-reducing enhancement. Coverage was denied, as no deficit in actual breast health existed.  

  - **Ketamine Therapy (Member 30992):** A member with treatment-resistant depression requested ketamine infusion. Pre-treatment assessment placed their functional capacity at the 28th percentile for adults with severe depression. Post-treatment data showed symptom resolution lifting them to the 63rd percentile—significantly above the depression cohort median (50th percentile). Thus, only the first three sessions (which restored median function) were covered; subsequent sessions were deemed cognitive enhancement.  

  - **Cataract Surgery (Member 77410):** An 83-year-old member required cataract surgery. Their baseline vision scored at the 15th percentile for the 80+ reference class. Surgery improved vision to the 52nd percentile—just above the median. ARCS automatically approved the procedure but denied a premium lens upgrade that would have achieved 20/20 vision (90th percentile), as this exceeded age-normed function.  

  - **Hand Trauma Reconstruction (Member 11245):** A professional violinist suffered tendon damage. ARCS assessed grip strength in their dominant hand at the 5th percentile for their age/sex cohort. Standard reconstructive surgery restored them to the 49th percentile—below median, thus fully covered. However, a request for supplementary nerve reinnervation to achieve "supra-normal" finger dexterity (projected 75th percentile) was denied as vocational enhancement.  

  - **Chronic Pain Management (Member 55338):** A member with lumbar stenosis underwent physical therapy (PT). Initial mobility placed them at the 10th percentile for chronic pain sufferers. After 8 sessions, they reached the median (50th percentile). Further PT was denied, as their mobility now matched their cohort. The member’s appeal—stating they "felt better with ongoing PT"—was upheld by ARCS, as sustained wellness is not a covered outcome beyond restorative thresholds.  

  ARCS also evaluated one of my own recent requests. As a 61-year-old female, I sought osteopenia treatment. My bone density registered at the 51st percentile for my reference class (post-menopausal women 60-65). The system correctly determined that since I exceeded the median, therapy would constitute enhancement. I applaud this impartial outcome—it reaffirms that ARCS applies the standard equitably, even to HealthPlus leadership.  

  This system eliminates subjectivity, aligning your benefits with actuarial fairness. Should ARCS deny a request, you may still utilize our expedited appeals portal. We are proud to serve you with this new era of precision-driven care.  

  Sincerely,  
  **Dr. Evelyn Rostova**  
  Chief Medical Officer, HealthPlus  
  *"Restoring Health, Ensuring Equity"*  

  ---  

  **How This Hits Both Audiences:**  
  - **For the Bioethicist:** The rule mechanically generates textbook dystopian outcomes: preventive care denied (BRCA1), effective treatment penalized (ketamine), ageism codified (cataracts), artistic merit ignored (violinist), and patient autonomy overridden (PT refusal). The CMO’s self-denial showcases the system’s ruthless consistency.  
  - **For the Layperson:** The jargon ("actuarially defined reference class"), corporate positivity ("groundbreaking," "flawless consistency"), and familiar frustrations (denied upgrades, appeals dismissed) mirror real insurer correspondence. The dissonance between the cheerful tone and brutal outcomes epitomizes bureaucratic absurdity.  
  - **The Rule’s Precision:** Every denial follows the Restorative Ceiling exactly—no malfunctions, just cold logic. Medians are statistical, not moral; "fairness" is redefined as algorithmic neutrality. The CMO’s sincerity makes the satire land without a single winking phrase.
