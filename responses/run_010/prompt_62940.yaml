  First, I need to identify the core challenge: they're asking to reframe AI alignment as hazard analysis for a novel process where the hazard is understood (catastrophic AI outcomes) but the equipment isn't (the AI system itself). The key is maintaining strict fidelity to their process safety lexicon while exposing where the analogy strains or breaks.

  The mapping needs to cover:
  - Specification issues (intent vs written specs) → Process safety specs
  - Optimization gaming → Verification gaps
