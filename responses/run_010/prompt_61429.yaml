  ### Brainstorming Stage: Pressure Points in *Never Let Me Go* for Williams’s Internalism

  1.  **The Manufactured Motivational Set (S) at Hailsham:**
      *   **Pressure Point:** The students' S (desires, values, capacities for imagination) is systematically cultivated by Hailsham's regime – the art, the deferral rumour, the emphasis on being "special," the constrained social world. This differs fundamentally from Owen Wingrave’s intact S clashing with familial tradition.
      *   **Incompatible Interpretations:**
          *   Williams's view is indifferent to S's origin; it only cares about its *current* content for determining reasons *for the agent*. Hailsham shows internalism works even with manufactured S.
          *   Manufacturing S *is* relevant. Internalism ignores how S's formation limits the *scope* of possible reasons available (e.g., escape isn't even imaginable as a coherent option), making the doctrine complicit in oppression. The novel exposes this indifference as a fatal cost.
          *   Internalism becomes incoherent here. If S is entirely manufactured *by* the system *for* the system, can we truly speak of *the agent's* reasons? Or is it the system's reasons masquerading as internal?

  2.  **The Absence of Escape Deliberation:**
      *   **Pressure Point:** Running away is never seriously considered or discussed as an option by Kathy, Tommy, or Ruth. The possibility exists in the world (Madame’s fear, the woods rumour) but remains psychologically inert for them.
      *   **Incompatible Interpretations:**
          *   Internalism straightforwardly concludes they have no reason to run; no element in their S would be engaged by sound deliberation leading to that action. Escape is an external reason statement, false *for them*.
          *   Williams’s counterfactual ("*would* be moved to after sound deliberation") leaves it open. Perhaps sound deliberation *could* reveal an element (e.g., a repressed desire for life) that *would* motivate escape, but the novel’s closed world makes this counterfactual untestable and potentially meaningless. The lack of deliberation signals S’s profound limitation.
          *   The absence *is* the point. Not deliberating about escape isn't a lack within S, but a constitutive feature *of* their manufactured S, demonstrating the success of Hailsham’s conditioning. Internalism correctly diagnoses the lack of reason *for them*, tragically.

  3.  **Tommy’s Tantrums:**
      *   **Pressure Point:** Tommy’s childhood outbursts – the howling, the spinning – are visceral, pre-linguistic expressions of distress and resistance. They aren't based on articulated beliefs or desires and seem to bypass deliberation entirely.
      *   **Incompatible Interpretations:**
          *   These raw affective states *do* belong in S as powerful motivators ("don't hurt me," "this is wrong"). They provide the *basis* for a reason to resist, even if Tommy can't articulate or deliberate from it yet. This helps internalism by grounding resistance internally.
          *   These states embarrass internalism. They are motivators, but precisely the kind that defy incorporation into a "sound deliberative route." They are brute impulses Williams’s framework struggles to accommodate, exposing the limits of deliberation-centric reason. S contains unruly elements.
          *   They represent a *proto*-reason, a motivational seed that *could* have been nurtured into a full reason via sound deliberation (e.g., understanding the injustice), but the environment actively suppresses this development.

  4.  **Miss Lucy vs. Miss Emily:**
      *   **Pressure Point:** Miss Lucy insists on blunt truth-telling ("You were brought into this world for a purpose..."), believing ignorance prevents genuine understanding/action. Miss Emily champions slow, imaginative cultivation ("revealing your inner selves") to foster an intuitive, felt grasp of their value and fate.
      *   **Incompatible Interpretations:**
          *   Miss Lucy is the internalist: She tries to correct *false beliefs* ("you might become actors, etc.") so students can deliberate soundly from true premises about their situation, potentially accessing new reasons (e.g., for protest).
          *   Miss Emily is the internalist: She focuses on cultivating the *imagination* and *emotional capacities* (core parts of S and sound deliberation) necessary to *truly grasp* the implications of their situation in a way that might generate authentic, internal reasons over time. Lucy’s approach causes trauma without enabling new action.
          *   *Neither* is truly internalist. Lucy’s "truth" is an external demand (society's view) she forces upon them, bypassing their S's current capacity to integrate it meaningfully. Emily’s project manipulates S towards passive acceptance, not discovery of authentic reasons. Both fail because the students' S is too constrained.

  5.  **The Gallery Project:**
      *   **Pressure Point:** The guardians collect art to prove the children have souls, aiming to evoke empathy/imagination in the public, thereby generating external reasons (moral obligations) for better treatment.
      *   **Incompatible Interpretations:**
          *   This *is* Williams-style: It accepts reasons must be internal, so tries to *create* internal reasons in the public by reshaping what they can picture/feel, aligning their S with the clones' humanity. Its failure shows the difficulty, not the falsity, of the project.
          *   It shows the *limits* of Williams’s view. The project fails because the public’s S (driven by fear, self-interest) is resistant, and Williams offers no recourse beyond hoping imagination can bridge the gap. The novel depicts the tragic consequences when this fails. Ishiguro is less optimistic.
          *   It ironically mirrors Hailsham’s internal conditioning: Just as Hailsham shapes the clones' S to accept their fate, the Gallery tries (and fails) to shape the public’s S to reject it. Both are attempts at internal reason engineering.

  6.  **The Deferral Rumour Correction & Despair:**
      *   **Pressure Point:** Tommy and Kathy believe art/deferral offers escape. Miss Emily corrects this false belief. Instead of finding a new reason (to fight/escape), they experience crushing despair and rage.
      *   **Incompatible Interpretations:**
          *   This *is* a counterexample: Sound deliberation (correcting the false belief) was supposed to *potentially* reveal new motivations within S. Instead, it destroys hope and motivation, leaving only resignation/anger. This shows deliberation doesn't reliably generate action-guiding reasons.
          *   It’s *not* a counterexample: Williams only claims sound deliberation *could* reveal a reason, not that it *will* motivate action. The despair shows that, for them, no such reason existed within S to be discovered by deliberation; the rumour was their only (false) hope. The correction reveals the *lack* of internal reason, not its failure.
          *   It shows a retreat: Defining "could" so counterfactually (what *would* happen in ideal deliberation, not what *does* happen in actual corrected deliberation) insulates internalism from empirical falsification but makes it less useful for explaining actual agents.

  7.  **Kathy’s Calm & The Reader's Outrage:**
      *   **Pressure Point:** Kathy narrates her life with acceptance, even pride in caring, love for Tommy, and loyalty. She expresses no fundamental anger or sense of injustice. The reader feels she *has* reason to be furious, to refuse.
      *   **Incompatible Interpretations:**
          *   Williams would say Kathy *does* have all the reasons there are *for her*. Her S, shaped by Hailsham and experience, prioritizes connection, care, and fulfilling her role well. The reader’s "external reason" (anger/refusal) is false *for Kathy*.
          *   The novel’s form forces the external standpoint: Kathy’s first-person narration, lacking the vocabulary of protest, makes her acceptance palpable. The reader, judging externally, sees the injustice and asserts a reason she lacks. The novel demonstrates this external standpoint is existentially/practically "useless" – it changes nothing for Kathy – but ethically necessary. This *is* its achievement.
          *   It’s over-reading: The form creates dramatic irony and pathos, but doesn’t force a *philosophical* conclusion about reasons. The reader’s outrage is emotional, not a strict assertion of an external reason for Kathy.

