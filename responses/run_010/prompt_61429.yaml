  ### Reading: *Never Let Me Go* and the Manufactured Motivational Set – Testing Williams’s Internalism

  Bernard Williams’s internal reasons thesis – that an agent A has a reason to φ only if φ-ing is reachable from some element in A’s subjective motivational set (S) via a sound deliberative route (correcting false beliefs, reasoning accurately, exercising imagination) – finds a profound and disturbing test case in Kazuo Ishiguro’s *Never Let Me Go*. Unlike Williams’s own example of Owen Wingrave, whose S conflicts with an external tradition, the clones of Hailsham possess an S meticulously engineered *by* the very system that demands their eventual destruction. Reading the novel through this lens doesn't merely illustrate internalism; it subjects the doctrine to intense pressure, revealing both its insights and its potential limitations, particularly concerning the origins and constraints of S itself.

  **1. Hailsham vs. Wingrave: The Origin of S Matters**

  The central distinction lies in S’s provenance. Owen Wingrave’s aversion to military life springs from his own constitution; it’s authentically *his*, even if opposed to family expectation. The Hailsham students’ S, however, is a product of institutional design. Their desires (to create art, find deferrals, be "special"), their values (loyalty, caring, quiet acceptance), and crucially, the *limits* of their imagination (regarding futures, escape, fundamental rights) are cultivated by the guardians to produce compliant donors. Williams’s internalism, strictly speaking, *is* indifferent to S’s history. It quantifies over the set as it exists at the time of deliberation. On this view, Kathy’s reasons flow authentically from her Hailsham-shaped S: to be a good carer, love Tommy, fulfill her purpose. Her calm is not irrational; it reflects her reasons.

  However, the novel relentlessly demonstrates that this formal indifference carries a significant cost. By taking S as a given, internalism risks normalizing and legitimizing the very constraints that make certain reasons (like rebellion) unimaginable or psychologically unavailable. The tragedy of Hailsham lies not just in the students' fate, but in the success of the project to make that fate appear natural, even dignified, *from within* their cultivated S. The novel forces us to ask: Can a reasons theory be adequate if it remains silent on how S came to be so tragically limited? Internalism’s silence here feels less like neutrality and more like complicity in the face of manufactured consent. Ishiguro registers this cost by making the reader viscerally feel the gap between Kathy’s internal reasons and the external reasons the reader desperately wants her to have.

  **3. Tommy’s Tantrums: The Unruly Core of S**

  Tommy’s childhood tantrums present a different challenge: the presence of raw, inarticulate motivational states resistant to deliberation. These outbursts – primal howls of distress – seem to emanate from a level deeper than belief or articulate desire. Do they belong in S? Williams likely *must* include them; they are powerful motivators, however primitive, expressing a fundamental impulse against harm or injustice ("don't hurt me"). Their presence *could* support internalism, suggesting a core element of resistance within S that sound deliberation might theoretically connect to a reason to fight back, if only the environment permitted its development.

  Yet, these states primarily *embarrass* the internalist framework. Precisely because they are pre-linguistic and chaotic, they defy organization via the "sound deliberative route." How does one deliberate soundly *from* a wordless howl? The novel shows these impulses being socially suppressed (Tommy is bullied for them) and failing to evolve into articulate protest or action. Their existence highlights a tension within Williams’s view: S contains motivational material that seems foundational yet remains inaccessible to the deliberative process central to defining reasons *as* reasons. Tommy’s later, frustrated attempts to articulate his feelings only underscore the difficulty. The tantrums point to a motivational bedrock that internalism struggles to incorporate meaningfully into its account of rational agency.

  **4. Miss Lucy vs. Miss Emily: Competing Deliberative Routes**

  The clash between guardians Miss Lucy and Miss Emily directly engages the "sound deliberative route" clause, offering competing visions of how (or if) the students might come to grasp reasons related to their true situation. Miss Lucy advocates direct truth-telling, aiming to *correct the fundamental false belief* ("you were told... you might become... whatever you wanted") that prevents sound deliberation. She is, in a sense, the crude internalist: remove the epistemic block, and true deliberation (and perhaps new motivations – protest? escape?) *might* become possible. Her removal signifies the system’s refusal to allow this potential unlocking of internal reasons.

  Miss Emily represents the other arm of Williams’s deliberative route: the *cultivation of imagination and feeling*. Hailsham’s curriculum – the art, the discussions – aims to nurture an inner life profound enough that students would gradually, *intuitively*, grasp their humanity and their fate, generating an authentic, internal acceptance or perhaps a deeper understanding that could fuel resistance. She bets on the slow work of the imagination reshaping S itself.

  The novel, however, diagnoses the failure of *both* experiments. Lucy’s blunt truth causes trauma and withdrawal (as with the students she tells), not empowered deliberation. It’s an external demand crashing into an unprepared S, bypassing rather than enabling sound reasoning. Emily’s project, while fostering rich inner lives and deep bonds, ultimately cultivates acceptance and a focus on small dignities within the system, not rebellion against it. The Gallery proves the students' souls to themselves and the reader, but fails to generate external reasons in the public or internal reasons for resistance in the students. The revelation scene with Emily confirms this: the cultivated imagination leads to tragic understanding and grief, not a new reason for action. Neither guardian succeeds in enabling the students to discover, through sound deliberation, a reason to fundamentally challenge their fate. The novel suggests that within the constraints of their manufactured S, no sound deliberative route *could* lead there, tragically vindicating a strict internalist reading of their passivity while indicting the world that made it so.

  **2. The Unasked Question: Escape and the Counterfactual Void**

  The complete absence of serious deliberation about escape among Kathy, Tommy, and Ruth is stark. While rumours exist ("possible" woods), the option lacks psychological reality for them. Should the internalist simply conclude they have no reason to run? Based on their actual S – shaped by Hailsham’s boundaries, the deferral myth, and their own conditioned priorities – the answer appears to be yes. Escape isn't connected to any element in their S via any deliberative pathway they engage in. It remains an external reason statement, false *for them*.

  Williams’s counterfactual structure ("A has a reason to φ if A *would* be motivated to φ after sound deliberation from their S") seems to leave a door open. *Could* sound deliberation, perhaps accessing a repressed desire for life or revealing the full horror, motivate escape? The novel ruthlessly demonstrates that this counterfactual exists in a void. The students' S and their environment are so constructed as to make such deliberation unimaginable or psychologically impossible. The "sound deliberative route" clause, designed to expand the scope of internal reasons beyond crude desires, hits a wall here. When S is manufactured to exclude certain possibilities, the counterfactual becomes untestable and arguably meaningless. The unasked question isn't a missed opportunity; it's a testament to the completeness of the conditioning. The novel suggests that for internalism to be meaningful, S must contain *some* seed, *some* potential pathway, towards alternative actions. When S is so thoroughly bounded, internalism correctly diagnoses the lack of reason but also reveals its own limitation in the face of profound motivational constraint. What turns on it is the very possibility of resistance within a totalizing system.

  **6. Deferral Rumour: Correction without Liberation**

  The deferral rumour correction is a crucial test of Williams’s claim that correcting false beliefs can bring internal reasons into view. Tommy and Kathy cling to the belief that true love, evidenced by art, offers a deferral. Miss Emily corrects this belief. According to Williams, this sound epistemic move *should* potentially clear the way for discovering genuine reasons latent within their S.

  The outcome is devastatingly different. Instead of discovering a new reason to fight or flee, they experience utter despair, helpless rage (Tommy's final outburst), and accelerated resignation. This *seems* like a counterexample: sound deliberation (belief correction) not only fails to generate a motivating reason but actively destroys hope and agency.

  However, a strict Williams defender might argue this doesn't refute internalism. The doctrine only licenses the claim that sound deliberation *could* reveal a reason, not that it *will* motivate the agent in practice. The resulting despair simply reveals that, tragically, no element within their S *could* be engaged by deliberation to motivate escape or rebellion once the false hope was gone. The correction exposed the *absence* of any such internal reason, not the failure of deliberation to find one. The rumour itself was the only (illusory) motivator towards a different future within their S. Its removal left only the bleak reality their S was ultimately conditioned to accept.

  Yet, this defense risks making internalism unassailable but practically hollow. Defining the crucial "could" purely counterfactually – what *would* happen in some ideal, perhaps unattainable, deliberative state – insulates the doctrine from empirical outcomes like Kathy and Tommy's despair. It keeps the logic "honest" but potentially detaches it from the messy reality of actual agents undergoing actual (and sound) belief corrections. The novel shows the brutal consequence: sound deliberation can lead not to liberation but to the confirmation of inescapable doom, a reality internalism can describe but not condemn as irrational from the agent's perspective.

  **5. The Gallery: Engineering External Reasons via Imagination (and Failure)**

  The Gallery project is a direct application of Williams-style thinking to the *external* reason problem. The guardians aim to generate moral reasons for the public to treat the clones humanely. Recognizing that mere argument won't work (as external reasons claims are false), they attempt to *reshape* the public’s S – specifically, their capacity for empathy and imagination – by demonstrating the clones' inner lives through art. This is internalism turned outward: create the internal reason (care for fellow humans) by expanding what the public can picture and feel.

  The project's failure is therefore deeply significant. It demonstrates the immense difficulty, perhaps impossibility in the face of deep-seated self-interest and dehumanization, of *successfully* engineering internal reasons in others through imaginative appeal. The public’s S proves resistant. The "sound deliberative route" (looking at art, contemplating its meaning) fails to connect the clones' humanity to a motivational element (genuine moral concern) strong enough in the public to override prejudice and fear. This doesn't necessarily falsify Williams’s claim that reasons must be internal; it starkly illustrates the challenge of making them so when existing motivations are hostile. Ishiguro seems less optimistic than Williams might be about the power of imagination alone to bridge such gaps. The failure also mirrors Hailsham’s own internal project: just as the Gallery fails to implant reasons for compassion in the public, Hailsham succeeds in implanting reasons for compliance within the clones. Both are attempts at manipulating S, with diametrically opposed goals and outcomes, highlighting the power and peril of shaping motivational sets.

  **7. Kathy’s Calm and the Reader’s Anguish: The External Standpoint**

  Kathy H.’s narration is the ultimate internalist document. Her reasons are clear, rooted in her cultivated S: to be an effective carer, to cherish her memories of Hailsham and Tommy, to find solace in connection and small fulfillments within her role. She expresses no fundamental rage, no sense of cosmic injustice. She deliberates soundly *within* her constrained horizon. On Williams’s account, she does indeed have all the reasons there are *for her*. She is, tragically, practically rational.

  The reader, however, experiences profound dissonance. We assert, vehemently, that Kathy *has reason* to be furious, to refuse, to run – reasons utterly alien to her narrated consciousness. This is the assertion of an external reason. The novel’s first-person form is crucial here. By locking us into Kathy’s perspective, with its limited vocabulary of protest and its normative framework of acceptance, Ishiguro makes her internal reasons palpable and real. Simultaneously, by showing us the horrific reality of her existence, he forces the reader *outside* that perspective, into the position of judging her situation from an external normative standpoint that sees the injustice.

  The novel’s philosophical achievement lies in demonstrating the simultaneous necessity and impotence of this external standpoint. It is *necessary* ethically – we *must* see the injustice – but it is *useless* practically and existentially *for Kathy*. We cannot give her our reasons; she cannot access them from her S. Our external judgment changes nothing within the world of the novel. It generates anguish in us, not motivation in her. This isn't necessarily over-reading; the form *enacts* the tension between the internal and external perspectives. It forces the reader to inhabit the painful gap between the reasons Kathy actually has and the reasons we believe she *should* have, highlighting the tragic limitations of both perspectives: internalism’s potential blindness to oppression, and externalism’s practical impotence.

  **Resistance: Where the Lens Distorts**

  Applying the internal/external reasons lens rigorously illuminates much about agency and compliance in the novel. However, it risks distorting Ishiguro’s project by framing the clones primarily as agents facing practical choices, asking "What should they do?" This can turn the novel into a parable about failed resistance or tragic compliance.

  But Ishiguro’s central concern seems broader and more existential: *How do people make meaning, find dignity, and sustain connection within a life whose fundamental parameters – its shape, purpose, and terminus – are utterly fixed and horrifyingly unjust?* The novel is less about the reasons *for* actions like escape (which it presents as nearly unthinkable), and more about the reasons *within* the life as given – reasons to care, to remember, to love, to "complete" well. Kathy’s focus is on the quality of life *within* the cage, not the lock on the door. A reasons-based reading, especially one focused on potential resistance, can undervalue the profound exploration of how humanity persists and even flourishes in attenuated forms under extreme constraint. The novel refuses to be solely a critique of compliance; it is also a stark elegy for lives lived with quiet courage and loyalty within unimaginable limits, reasons and all.

  **The Novel’s Contribution: Beyond Counterexamples**

  *Never Let Me Go* contributes something vital to the internal/external reasons debate that abstract argument or intuition pumps cannot: a visceral, sustained depiction of a *manufactured motivational set in operation*. It shows not just *that* S can be constrained, but *how* – through institutional conditioning, controlled imagination, the manipulation of hope, and the suppression of dissenting vocabularies. We see the *process* by which certain reasons become unthinkable and others feel natural. We witness the *psychological reality* of internal reasons within such a set (Kathy’s calm professionalism, her care for Tommy) and the *brutal consequences* when the boundaries of that set are confirmed (the despair after the deferral revelation).

  Furthermore, the novel powerfully demonstrates the *absence of a vocabulary of protest*. Tommy’s inarticulate rage and Kathy’s lack of even the conceptual tools to frame her life as an injustice are not mere psychological details; they are the direct results of a system that engineers S to exclude such possibilities. A philosophical counterexample might posit an agent who "should" rebel but doesn't; Ishiguro shows us *why* rebellion isn't even on the menu, how the very ability to conceive of oneself as wronged and to formulate a demand can be extinguished. The novel makes us *feel* the weight of a motivational set that renders resistance psychologically impossible, not just unmotivated. This concrete, lived reality of constrained agency, where Williams’s internalism provides an accurate but chilling description of the reasons that remain, is the unique and devastating contribution of Ishiguro’s art to the philosophical debate. It doesn't just test the doctrine; it immerses us in a world where its truth is a profound tragedy.
