prompt: |-
  I have no formal training in philosophy — I left school at sixteen — but I've spent years in arguments with believers and with former believers, and there is a pattern I keep running into that I can't put a name to.

  Someone raises a case of apparently pointless suffering: a child dying slowly of cancer, a fawn burned in a forest fire that takes days to die. The religious answer is that we are in no position to judge what an all-knowing being would have reason to permit, so calling the case pointless proves nothing. Then the same person says, days later and with complete confidence, that God allowed a particular marriage to fail, or a particular illness, in order to teach someone something, or that a disaster was a warning to a town. The humility only ever runs in one direction. It blocks the objector's negative claim and never touches the believer's own positive claims about what God is up to in this or that event.

  When I've pressed people on this, they don't say they were guessing. They say the positive claims come from somewhere else — scripture, the teaching of their community, something they take to have happened to them — so they are reporting, not speculating. Which leaves me unsure whether I've caught a genuine inconsistency or stumbled on something subtler.

  Is there an established concept for this? The folk labels I know — special pleading, having it both ways, moving the goalposts — don't seem to fit, because the standards aren't being changed mid-argument; two standards are kept on separate shelves and whichever is needed gets used, and the second shelf may be independent rather than a dodge. I'd like to know what the nearest established ideas are, precisely how what I've described departs from each of them, and whether the appeal to revelation rescues the practice or only relocates the difficulty. If nothing in the literature covers it, say so plainly and then name and define it — with real edges, including whether the same pattern turns up in non-religious arguments. I'm after the carving, not the label.
reasoning: |-
  Okay, the user is describing a pattern they've noticed in debates with religious believers. They see a contradiction: believers reject arguments about pointless suffering by saying humans can't understand God's reasons, but then confidently claim to know God's purpose behind specific events like failed marriages or natural disasters. The user wants to know if there's a philosophical term for this.

  First, I need to recall relevant concepts. Special pleading comes to mind, but the user already mentioned it doesn't quite fit because the standards aren't changed mid-argument. Instead, the believer uses two separate standards: one for rejecting criticisms and another for making positive claims. 

  Then there's the appeal to revelation. Believers justify their positive claims by citing scripture or religious teachings. But how does that interact with the humility defense? The problem is that revelation claims are still human interpretations. So even if they're based on scripture, applying them to specific events like a marriage failing requires interpreting God's intent, which should logically require the same humility they invoke against the problem of evil.

  The user also wants to know if this pattern appears outside religious contexts. Confirmation bias is a possibility here. People tend to accept information that confirms their beliefs while rejecting contradictory evidence. In science, someone might dismiss studies that challenge their views as flawed but accept those that support them without scrutiny. That's similar to using different standards for accepting or rejecting claims.

  Another angle is the burden of proof asymmetry. The believer shifts the burden of proof for the problem of evil but doesn't apply the same burden to their own positive claims. This asymmetry creates the inconsistency the user observed.

  The deeper issue here might be epistemological incoherence. The believer's framework isn't consistently applied. They use skepticism defensively but certainty offensively. This incoherence undermines their position because the same humility that prevents judging God's reasons should also prevent claiming knowledge of His purposes in specific events.

  I should also consider if established terms like "compartmentalization" fit. The believer keeps two standards separate to avoid cognitive dissonance. But compartmentalization is more descriptive than a fallacy. The core issue is the inconsistency in applying epistemic standards.

  The user emphasized wanting precise distinctions. So I need to explain why special pleading doesn't fully apply—because it's not about changing the rule but having two different rules for different contexts. Also, the appeal to revelation doesn't resolve the problem because interpreting revelation still involves human judgment, which should be subject to the same humility.

  Non-religious examples would help. Maybe in politics, where someone dismisses criticism of their side as biased but accepts their own side's claims without question. Or in alternative medicine, rejecting scientific studies while accepting anecdotal evidence.

  In conclusion, the closest established concept is epistemological asymmetry. But the user might need a new term like "differential epistemic humility." However, it's crucial to emphasize that the appeal to revelation doesn't solve the issue; it just moves it to interpretation, which still requires humility.
answer: |-
  This pattern you've observed is astute and points to a deep epistemological tension within many religious defenses. While no single term perfectly captures every facet, several established concepts illuminate different aspects, revealing why the appeal to revelation is significant but ultimately relocates rather than resolves the core inconsistency. Here's the carving:

  1.  **Epistemological Asymmetry (or Burden of Proof Asymmetry):**
      *   **Definition:** Applying fundamentally different standards of evidence, justification, or required certainty depending on whether the claim being evaluated is favorable or unfavorable to one's pre-existing belief system. It manifests as demanding impossibly high standards to disprove the belief while accepting very low standards to support it.
      *   **How it Fits:** This is the *core structural flaw*. The humility defense ("you can't know God's reasons, so you can't claim *this* suffering is pointless") imposes an impossibly high epistemic burden on the critic – demanding proof of a negative (proving the *absence* of a divine reason). Simultaneously, the believer applies a radically lower standard ("God allowed *this* marriage to fail to teach humility") based on personal interpretation, community tradition, or scriptural application. The asymmetry lies in the *differential application of skepticism*.
      *   **How it Departs:** It's broader than simple special pleading (see below) as it focuses on the *systematic imbalance* in the standards of justification required for claims attacking vs. supporting the worldview.

  2.  **Special Pleading (Ad Hoc Exemption):**
      *   **Definition:** Making an exception to a general principle or rule without providing adequate justification for why the exception applies *in this specific case*.
      *   **How it Fits:** The general principle invoked defensively is "Humans cannot discern God's purposes in specific instances of suffering." However, the believer pleads a special exemption *for their own positive interpretations* ("*Except* when I claim this specific illness was a lesson, based on scripture/revelation/community teaching"). They assert their claims fall outside the scope of the principle they just invoked.
      *   **How it Departs (as you noted):** It's not always a *mid-argument* rule change. The believer often genuinely sees their positive claims as belonging to a *different category* (revelation-based, not speculation-based) from the start. The special pleading becomes embedded in the *structure* of their epistemology: the principle of unknowability applies *only* to challenges, not to affirmations derived from their privileged source. The inconsistency is foundational, not tactical.

  3.  **Confirmation Bias / Motivated Reasoning:**
      *   **Definition:** The tendency to interpret, favor, and recall information in a way that confirms one's preexisting beliefs or hypotheses, while giving disproportionately less consideration to alternative possibilities or contradictory evidence.
      *   **How it Fits:** This is the *psychological engine* driving the asymmetry. The believer is highly motivated to defend the core proposition "God is perfectly good and sovereign." The humility defense protects this core belief from counter-evidence (pointless suffering). Simultaneously, interpreting events as having divine purpose *affirms* that core belief. Events that *could* be interpreted neutrally (marriage failure, illness) are preferentially interpreted as confirmations of divine action. Evidence *against* divine goodness requires impossible certainty to be accepted; evidence *for* it is accepted readily.
      *   **How it Departs:** While the *mechanism* is confirmation bias, the specific *structure* you describe – the *asymmetrical application of epistemic humility* – is the distinctive manifestation in this theological context.

  4.  **Appeal to Authority / Revelation:**
      *   **Definition:** Basing the truth of a claim on the source of the information (scripture, tradition, religious leader, personal revelation) rather than on independent evidence or reason.
      *   **How it Fits:** This is the believer's *stated justification* for the asymmetry. They argue their positive claims ("God did X for reason Y") aren't speculative guesses but reports from a privileged source (revelation). Therefore, they claim, the humility principle ("we can't know God's reasons") doesn't apply *to these claims*, as they are not *inferred* by humans but *revealed*.
      *   **Why it Relocates, Not Resolves, the Difficulty:**
          *   **Interpretation Gap:** Revelation (scripture, prophecy, tradition) rarely states, "God caused *John Smith's specific divorce* to teach *him* humility *on Tuesday*." Such specific interpretations are *human inferences* applied *to* the revelation or *to* the event. The humility principle *should* apply to *this act of interpretation* ("How can I be *sure* this verse applies to this exact event in this exact way?"). The believer often fails to apply the same epistemic humility to their *interpretative act* as they demand for the critic's inference of pointlessness.
          *   **Selectivity & Consistency:** Which events get interpreted through revelation? Why is the dying fawn *not* interpreted as having a clear divine purpose revealed in scripture/tradition, while the marriage failure *is*? This selectivity often mirrors confirmation bias – interpretations are applied where they affirm goodness/control, not where they pose challenges.
          *   **Verification Problem:** How does one reliably distinguish genuine revelation-based interpretation from wishful thinking, cultural bias, or simple error? The humility principle ("we can't know God's mind") logically undermines any claim to *infallible certainty* in applying revelation to specific contingent events. Yet, believers often express high confidence in these interpretations while denying similar confidence to critics.
          *   **Immunization:** Using revelation this way risks making the belief system *unfalsifiable*. Any event can potentially be interpreted post-hoc as fitting divine purpose (via selective application of revelation/interpretation), while any counter-evidence is dismissed via the unknowability defense. This undermines the empirical grounding of the claims.

  **Is there an established single term?** Not perfectly. "Epistemological Asymmetry" or "Asymmetrical Application of Epistemic Standards" best capture the core logical structure. "Theological Double Standard" or "Selective Application of Divine Mystery" are descriptive folk labels.

  **Does this pattern appear non-religiously? Absolutely. It's a common feature of defended ideologies:**

  1.  **Political Ideologies:** A partisan dismisses criticism of their leader/party by citing the complexity of governance ("You can't possibly understand all the factors!"), but confidently attributes specific positive outcomes directly to their leader's brilliant policy X or character trait Y. Complexity is invoked defensively, certainty offensively.
  2.  **Conspiracy Theories:** Proponents dismiss lack of evidence as proof of the conspiracy's power ("They hide it too well for you to find!"), but interpret mundane events (a delayed flight, a typo in a news article) as clear, certain proof of the conspiracy. High standards for disproof, low standards for proof.
  3.  **Alternative Medicine:** Proponents dismiss negative clinical trials as flawed or biased by "Big Pharma," requiring impossibly perfect evidence to disprove efficacy. Meanwhile, they accept individual anecdotes or testimonials as conclusive proof of effectiveness. Asymmetrical burdens of proof.
  4.  **Nationalism:** Critics of a nation's action are told they lack the cultural understanding or historical context to judge ("It's more complex than you think!"). Meanwhile, the nation's successes are confidently attributed to its inherent virtues or superior system. Humility demanded externally, certainty asserted internally.

  **In essence:** You've identified a pervasive pattern of **differential epistemic humility** employed to protect a core belief. The appeal to revelation provides a *subjective justification* for the believer, allowing them to compartmentalize the asymmetry ("These claims *are* different because of their source"). However, it fails to resolve the underlying **epistemological incoherence**: the act of interpreting and applying revelation to specific events unavoidably involves human judgment, which logically demands the *same* epistemic humility invoked against the problem of evil. The inconsistency isn't in changing standards mid-argument, but in building an epistemic framework where the standard applied depends entirely on whether the claim supports or challenges the core dogma. The carving reveals a foundational tension between the assertion of specific divine actions in the world and the principle of divine inscrutability.
