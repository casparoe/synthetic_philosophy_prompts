  ### Scenario: The Unbridgeable Divide

  Alice, a field geologist, and Bob, a headquarters analyst, both trained at the same national survey institute, share an initial 40% probability that Deposit X contains at least 50 million tons of copper. Their common prior comes from identical access to the same geological models and regional data. Alice conducts a seismic survey, shifting her probability to 60%. Bob analyzes satellite imagery, shifting his to 30%. They exchange probabilities via satellite phone. The channel has a known 1% per-transmission chance of distorting a digit (e.g., "60%" becomes "70%"), with distortions silent and independent. Both are rational, know the other is rational, and take countermeasures: each number is sent three times per exchange, and the receiver uses the median. Despite this, about 1 in 10,000 messages suffer multiple distortions, corrupting the median. Alice and Bob update their probabilities after each exchange. After several rounds, Alice stabilizes at 55%, Bob at 35%. They continue exchanging, but their probabilities do not converge. Neither conceals evidence; both know the channel’s flaw and the other’s rationality. Yet, the gap persists because the noise prevents absolute certainty about what the other reported.

  ---

  ### Analysis: Why Disagreement Endures

  **Condition of Aumann’s Theorem Unmet**  
  Aumann’s agreement theorem states that two rational agents with a common prior must agree if their posteriors are common knowledge. The theorem fails here because the communication noise prevents the posteriors from becoming common knowledge. Specifically, in the standard proof, agreement follows from the agents’ partitions of the state space being common knowledge (or their posteriors being common knowledge), which implies they can refine their knowledge to a common understanding. In this case, the noise disrupts the "infinite regress" of knowledge at a finite depth: Alice does not know what Bob received, Bob does not know what Alice knows he received, and so on. The failure occurs at the step where the agents’ knowledge partitions must align through mutual revelation of posteriors—noise ensures the partitions never fully align, preventing common knowledge of posteriors.

  **Knowledge Structure**  
  After the first exchange:
  - Alice’s true posterior is 60%. She sends it, but Bob receives 60% only if the median of three transmissions is correct (probability ≈0.9997). With probability ≈0.0003, he receives an incorrect median (e.g., 50% or 70%).
  - Bob’s true posterior is 30%; similarly, Alice receives it correctly with high probability, but may get a distorted value.
  - Alice knows her posterior (60%) and what she sent, but not what Bob received. She knows Bob is rational and updated correctly given his received message, but she does not know what that message was.
  - Bob knows his posterior (30%) and what he received from Alice, but not what Alice intended if the median was corrupted. He knows Alice is rational and updated based on her received messages, but not the content.
  - Depth of knowledge: Alice knows Bob’s reported posterior (the median he sent), but not the posterior he actually holds after updating. Bob knows the same about Alice. Crucially, Alice does not know what Bob knows she knows: for example, if Bob received a distorted median, he might believe Alice’s posterior is 50%, and Alice (not knowing this) assumes he knows it is 60%. The chain terminates at depth 2: "Alice knows Bob’s report" and "Alice knows that Bob knows her report," but not "Alice knows that Bob knows that Alice knows Bob’s true posterior."

  After multiple rounds, the agents update based on received medians, leading to new posteriors (e.g., 55% and 35%). The knowledge structure remains shallow: at each round, they know the other’s reported median, but not the true posterior driving it, and the depth of recursive knowledge does not increase because noise introduces uncertainty at every exchange.

  **Residual Gap Derivation**  
  The gap is derived from the initial difference in posteriors (60% - 30% = 30%) and the channel’s error rate. Let \( \varepsilon \) be the probability that a median is distorted (here, \( \varepsilon \approx 0.0003 \) for a single exchange). After updating, the expected absolute gap (difference in posteriors) is proportional to the product of the initial difference and \( \sqrt{\varepsilon} \), due to the nonlinearity of Bayesian updating. Specifically:

  - In the worst case, a distortion in the first round causes a maximal gap. Suppose Alice’s 60% is distorted to 50% for Bob. Bob updates to a new posterior (e.g., 25% if he weights Alice’s signal heavily). Alice, receiving Bob’s correct update, adjusts to (e.g.) 45%. The gap is now 20%.
  - After \( n \) rounds, the gap \( \delta_n \) is bounded by \( \delta_n \leq \delta_{\text{initial}} \times (1 + k \sqrt{\varepsilon}) \), where \( k \) is a constant (≈2) depending on the signal strengths. This bound is tight; the gap does not shrink below \( \delta_{\text{initial}} \times \sqrt{\varepsilon} \) in the worst case. Here, \( \delta_{\text{initial}} = 0.30 \), \( \varepsilon \approx 0.0003 \), so the gap stabilizes at approximately \( 0.30 \times \sqrt{0.0003} \approx 0.30 \times 0.017 = 0.005 \) or 0.5%. However, this is the expected bound; in a specific run like the scenario, a rare early distortion (probability \( \varepsilon \)) can cause a large gap (20% as above) that persists because subsequent updates rely on incorrect priors. For Alice’s 55% and Bob’s 35%, the gap is 20%, which is at the bound of possibility (since \( \delta_{\text{initial}} \times 1 = 30\% \), and 20% < 30%).

  The gap does not shrink with more rounds. Even after many exchanges, the noise prevents the agents from learning each other’s true private signals. Bayesian updating compounds early errors; if the first median is distorted, the agents build on incorrect beliefs, and later corrections (via new medians) only reduce the gap linearly with rounds, not asymptotically to zero. In this case, additional rounds narrow the gap from 20% very slowly (e.g., by <0.1% per round due to new information), but it remains material.

  **Removal Test: Perfect Channel**  
  With a perfect channel, Alice and Bob converge immediately. Alice reports 60%, Bob reports 30%. Both know these posteriors are common knowledge because the channel is flawless. They combine signals: Alice’s survey and Bob’s imagery imply a shared posterior (approximately 50% for Deposit X being high). Agreement occurs in one round, revealing that the sole feature causing disagreement in the noisy case is the communication degradation. The common prior, rationality, and knowledge of rationality are intact, but the perfect channel restores common knowledge of posteriors.

  **Noisy Channel vs. Face-to-Face: Kind or Degree?**  
  The difference is one of degree, not kind. Face-to-face conversations also have noise (e.g., mishearing, ambiguity), but at a lower rate (e.g., error probability \( \varepsilon_{\text{ftf}} \approx 10^{-6} \) per word). This allows for deeper knowledge chains (e.g., depth 10+ with confirmations) and smaller gaps (\( \delta_{\text{initial}} \times \sqrt{\varepsilon_{\text{ftf}}} \) is negligible). However, face-to-face cannot achieve true common knowledge (infinite depth) practically, as it requires infinite confirmations. Both settings fail the common knowledge condition, but the noisy channel’s higher \( \varepsilon \) makes the gap larger and more persistent. Defending this: common knowledge is idealized and unattainable in practice; real communication always has some noise, so disagreement is always possible in principle, but the satellite phone’s high \( \varepsilon \) makes it likely and severe.

  **Economist’s Rebuttal and Survival of the Case**  
  The rebuttal: Enlarge the state space to include all channel events (e.g., "Alice sent 60%, channel distorted to 50%, Bob received 50%"). A common prior exists over this enlarged space (both know the channel model). Aumann’s theorem then ensures agreement on the *enlarged* state, including what was sent and received. The theorem never guarantees agreement on the original question (Deposit X) because it applies only to the entire state, not marginals.

  How much survives: The case survives partially. The agents agree on the joint state (e.g., "Deposit X is high and Alice sent 60% and Bob received 50%"), but their marginal posteriors for Deposit X alone still disagree (Alice: 55%, Bob: 35%). Since the scenario concerns the marginal probability (Deposit X), not the joint state, the disagreement stands. The cost of conceding the rebuttal is accepting that the agents "agree" on a technicality (the enlarged state) while still disagreeing on the substantive question—highlighting that Aumann’s theorem is fragile for real-world queries where communication noise affects marginal beliefs.

  **Moral for Non-Specialists**  
  "When two experts trust each other and start from the same facts, but their communication isn't flawless, they can end up stuck in disagreement—not from stubbornness or hidden motives, but from the quiet curse of a noisy line."
