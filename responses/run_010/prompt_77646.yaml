  #### Branch Nodes (Questions)
  1. **Absence of mention**: If a source we would reasonably expect to mention an event (given its scope and context) does not mention it, and the source is well-preserved, does this absence count as evidence against the event?  
     - **Yes**  
     - **No**  

  2. **Independence of accounts**: When two accounts describe the same event, are they only "independent" (so their agreement strengthens the case) if they come from entirely separate chains of transmission (e.g., not derived from the same lost original), not just different authors?  
     - **Yes**  
     - **No**  

  3. **Material evidence and narrative**: Can material evidence (e.g., artifacts, ruins) confirm a specific narrative event (like a battle), or can it only confirm what it directly shows (e.g., that arrowheads were present)?  
     - **Can confirm narrative**  
     - **Only confirms direct facts**  

  4. **Scope of reliability**: If a source is reliable for one type of claim (e.g., economic records), is it automatically reliable for a very different type of claim (e.g., political intrigue)?  
     - **Yes, reliability applies to the whole source**  
     - **No, reliability depends on the specific claim**  

  5. **Contemporaneity requirement**: Must an account be written near the time of the event it describes to carry significant weight?  
     - **Yes**  
     - **No**  

  6a. **Miraculous content treatment**: If an account describes events that seem impossible by modern standards (e.g., divine intervention), does this discredit the entire account?  
     - **Yes** (skip 6b)  
     - **No** (answer 6b)  

  6b. **Bracketing miraculous content**: If an account includes impossible events, should we set aside those parts and evaluate the rest?  
     - **Yes, bracket them**  
     - **No, do not bracket them**  

  7. **Convergence from a common source**: If multiple accounts agree but all derive from a single lost source, does their agreement add any weight beyond that of the single source?  
     - **Yes**  
     - **No**  

  8. **Testimony for improbable events**: Can testimony alone establish an event that seems wildly improbable today (e.g., a miracle), if the testimony is otherwise trustworthy?  
     - **Yes**  
     - **No**  

  9. **Target of inquiry**: Is the primary goal to establish *that* an event happened (the fact), or to understand *what it was like* for those who experienced it (the experience)?  
     - **That it happened**  
     - **What it was like**  

  10. **Weight of evidence types**: When both material evidence and narrative accounts exist, which carries more weight?  
      - **Material evidence**  
      - **Narrative accounts**  
      - **They are interdependent and must be combined**  

