  ### Decision Tree for Epistemological Positions on Knowledge of the Distant Past

  **Instructions**: Answer each question based on your commitments when weighing evidence about the past. Proceed sequentially. For node 6a, if you answer "Yes," skip node 6b. The tree has 11 branch nodes (questions) and 9 leaves (positions). Use plain language; no prior expertise is assumed.

