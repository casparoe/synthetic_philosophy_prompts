prompt: |-
  So I've been keeping a list of my gut reactions to rescue cases and I can't get them to line up. I'd like help working out what principle, if any, they add up to. To be clear I'm not after a tour of the literature — I know there's a famous paper arguing you should flip a coin, I don't want a summary of it. I want to know what my own verdicts commit me to.

  The list:

  1. Six cavers, water rising, one door. One person trapped in the left chamber, five in the right. I can open one. All strangers to me. → I flip a coin. And I really don't feel like opening the right-hand door would be the better choice, which suprises me.
  2. Same setup, but the one is my brother. → I save my brother, and I don't think I've done anything wrong. Nobody could reasonably hold it against me.
  3. Same setup, but the five went in past a warning sign and the one didn't. → Now I lean toward the one, but only a little. A thumb on the scale, not a verdict.
  4. A machine is about to give five people paper cuts. I can stop that, or stop it giving one person a paper cut, not both. → Stop the five. No coin flip, no agonizing. This one feels like it has a straight answer.
  5. Five people each about to be blinded, versus one. → Coin flip again. So the switch flips somewhere between a paper cut and blindness, and I have no idea where it flips or why it would flip there.
  6. Five thousand mild headaches versus one death. → Save the one who'd die. No pile of headaches gets there.
  7. A 10% chance of averting a hundred deaths versus a certainty of averting nine. → I take the 10%. This is the one I keep coming back to, because in case 1 the numbers did absolutely nothing and here they're doing everything, and the only difference I can point at is that one is certain and the other isn't.
  8. A policy that kills one identifiable kid, with a name and a face, next month, versus one that kills a hundred anonymous people over fifty years through slightly dirtier air. → For the hundred I just do the arithmetic and I don't feel bad about it. For one kid in a well versus five kids in another well I'd flip a coin. Structurally the same pair of choices, opposite reactions.

  My own tentative explanation is that it turns on whether the people are interchangeable — with paper cuts they somehow are, with deaths they aren't, each one is a whole world on their own. But 7 and 8 both cut against that and I cant repair it.

  What I want back: one principle, or a shortlist of two or three, stated precisely enough that I could apply it to a case I've never seen without checking with you. For each clause, tell me which numbered case forced it in. Then give me its verdicts on four cases I haven't listed — include at least one where what's at stake is how long people get to live rather than whether, and one where the many are only in danger because of the choice itself. And be honest about which of my verdicts it has to overrule. If it manages to keep all eight, tell me what that's costing in complexity, because my suspicion is that it's costing a lot.
reasoning: |-
  Hmm, the user has shared eight thought experiments about rescue scenarios and is struggling to find a consistent moral principle behind their gut reactions. They want me to identify what underlying principle(s) explain their judgments across these cases, even if it means overruling some of their intuitions.

  Looking at their cases: In scenario 1 with six strangers, they flip a coin rather than save the five, which surprises them. But in scenario 4 with paper cuts, they automatically save the five without hesitation. The difference between minor harm (paper cuts) and severe harm (blindness/death) seems crucial, but they find this threshold arbitrary. 

  Their brother being the one changes everything (scenario 2) - special relationships matter. In scenario 3 with negligence, they give slight preference but not decisively. The probabilistic case (scenario 7) shows numbers matter when outcomes are uncertain, contrasting sharply with scenario 1 where numbers didn't sway them. Scenario 8 reveals that identifiability affects their judgment - anonymous statistical deaths feel different than named individuals.

  Their tentative "interchangeability" theory fails because paper cuts make people seem fungible while deaths don't, but cases 7 and 8 contradict this pattern. I notice their reactions pivot on multiple axes: severity of harm, certainty vs uncertainty, personal relationships, identifiability, and culpability.

  I think I can distill three core principles that capture most of their intuitions: 
  1) Severity-dependent aggregation: We aggregate minor harms but treat severe harms as non-fungible. 
  2) Proximity privilege: We prioritize those with special relationships or direct identifiability. 
  3) Uncertainty premium: We value reducing catastrophic risks more than certain minor harms.

  This framework explains why they flip coins for blindness (severe harm) but not paper cuts (minor harm), why they save their brother (proximity), and why they take the 10% chance to save 100 lives (uncertainty premium). It does require overruling their slight preference in the negligence case (scenario 3) and their identical treatment of 1vs5 deaths versus 1vs100 statistical deaths in scenario 8.

  For new test cases, I'll include lifespan tradeoffs (quality-adjusted life years), a "sinking lifeboat" scenario where saving many requires sacrificing one, and cases that probe the severity threshold. The principles should generate clear verdicts without needing new exceptions, though the severity threshold remains unavoidably fuzzy - that's a feature of moral psychology, not a bug in the framework.
answer: |-
  Based on your verdicts, your moral reasoning isn't governed by a single principle like simple utilitarianism (always maximize total good). Instead, it reveals a **multi-principle framework** prioritizing *how* the harm occurs and *who* is harmed, alongside severity and certainty. Here's the distilled framework, derived directly from your cases:

  **Your Core Principles:**

  1.  **Severity Threshold & Non-Fungibility of Severe Harm:** When harms cross a threshold of severity (like blindness, death, or significant suffering), individuals become non-fungible. Saving one is *not* morally inferior to saving many, and aggregation fails. Numbers alone don't compel action. *(Forced by: Case 1 (strangers/blindness/death), Case 5 (blindness), Case 6 (death vs. headaches), contrast with Case 4 (paper cuts))*
  2.  **Proximity Privilege:** You have significantly stronger obligations to individuals with whom you share a close personal relationship (like family). This overrides the severity threshold *and* numbers. *(Forced by: Case 2 (brother))*
  3.  **Certainty & Catastrophe Avoidance (Uncertainty Premium):** When facing potential catastrophes (very large losses of life/severe harm) under uncertainty, you heavily prioritize actions with a chance of averting the catastrophe, even over certain prevention of smaller, certain harms. The value placed on reducing catastrophic risk is disproportionately high. *(Forced by: Case 7 (10% for 100 vs. certain 9))*

  **How it Handles Your Cases (and Overrules):**

  1.  **Six Cavers (Strangers):** Severity Threshold applies (death/blindness). Numbers irrelevant. Coin flip is appropriate. → **Matches verdict.**
  2.  **Brother:** Proximity Privilege overrides Severity Threshold & numbers. Save brother. → **Matches verdict.**
  3.  **Negligence (Warning Sign):** *Overruled.* Your framework lacks a strong "desert" or "responsibility" principle. Your slight lean isn't justified by the core principles above. The principles would dictate a coin flip here, same as Case 1. The Severity Threshold is met, Proximity is absent. Your lean suggests a weak "responsibility modifier," but it's not strong enough to be core based on other cases.
  4.  **Paper Cuts:** Harm below Severity Threshold. Aggregation works. Save the five. → **Matches verdict.**
  5.  **Blinding:** Severity Threshold applies (like Case 1). Coin flip. → **Matches verdict.**
  6.  **Headaches vs. Death:** Severity Threshold applies (death >> headaches). Save the one. → **Matches verdict.**
  7.  **10% for 100 vs. Certain 9:** Catastrophe Avoidance/Uncertainty Premium applies. Take the 10% chance. → **Matches verdict.**
  8.  **Identifiable Kid vs. Statistical Deaths:** *Overruled in part.* The "identifiable victim" aspect isn't a core principle here. Proximity Privilege is for *personal* relationships, not mere identifiability. For *statistical* deaths vs. an *identifiable* stranger:
      *   If the harm is severe (death), Severity Threshold applies. A coin flip between 1 identifiable death and 1 statistical death would be consistent. Your arithmetic for the 100 statistical deaths *contradicts* the Severity Threshold principle active in Case 1 & 5. The principles *require* treating 1 identifiable death and 1 statistical death similarly under the Severity Threshold. Choosing the 100 statistical deaths based on arithmetic overrules your coin-flip reaction to 1vs5 deaths (Case 1). The framework highlights this inconsistency: **Case 8 forces you to choose between your Case 1 verdict (coin flip for 1vs5 deaths) or your Case 8 verdict (arithmetic for 1 identifiable vs 100 statistical).** The principles side with Case 1/5 consistency, requiring indifference between 1 identifiable and 1 statistical death if both are severe. Your feeling in Case 8 likely stems from the *diffuse* nature of statistical harm lowering its perceived severity/urgency, conflicting with the core Severity Threshold.

  **Applying the Framework to New Cases:**

  1.  **Lifespan Trade-off:** Save one 20-year-old (giving them 60 more years) or five 80-year-olds (giving each 5 more years). Total life-years equal (60 vs. 5*5=25? Wait, let's fix: Save one 20yo (gain ~60 QALYs) or five 70yo (each gains ~10 QALYs, total ~50 QALYs). *Verdict:* Severity Threshold applies (death). Non-fungibility. Coin flip. Numbers (total QALYs) don't compel saving the five. *(Severity Threshold)*
  2.  **Many in Danger Due to Choice:** A runaway trolley is headed towards five workers. You can divert it onto a side track where it will kill one worker. However, the *only* reason the five are on the main track is because *you* accidentally dislodged a rock that blocked the side track earlier. *Verdict:* Severity Threshold applies (death). Non-fungibility. Your responsibility for their peril *might* introduce a lean (like your Case 3), but the core principles don't include a strong responsibility factor. Coin flip is the consistent verdict. *(Severity Threshold; highlights weak responsibility factor)*
  3.  **Sinking Lifeboat:** You are in a lifeboat overloaded with 10 strangers. It will sink, drowning all, unless you throw one person overboard. *Verdict:* Severity Threshold applies (death). Non-fungibility. Throwing one overboard to save nine is *not* compelled by the numbers. Actively causing one death to prevent nine is likely impermissible under this framework. You shouldn't throw anyone overboard. *(Severity Threshold - actively causing severe harm to one to prevent severe harm to many isn't justified)*
  4.  **Threshold Probe:** Save one person from being paralyzed from the waist down, or save five people from losing a hand. *Verdict:* This probes the Severity Threshold. Paralysis likely crosses it (severe, life-altering), losing a hand *might* cross it. If both cross, coin flip. If losing a hand doesn't cross (analogous to blindness?), save the five. Your framework likely places paralysis firmly above the threshold and losing a hand potentially on the borderline. Your verdict might be a slight lean to the one paralyzed or a coin flip. The principle forces you to decide if "losing a hand" is above or below your severity threshold. *(Severity Threshold probe)*

  **Cost in Complexity & Reconciliation:**

  *   **Cost:** The framework requires identifying a subjective **Severity Threshold** (where does blindness fall? Losing a hand? Chronic pain?). This threshold is inherently fuzzy and context-dependent. It also creates a stark inconsistency between how you treat certain minor harms (aggregate) vs. severe harms (non-fungible), and a tension between Case 1/5 (ignore numbers for severe harm) and Case 8 (use numbers for severe statistical harm). Reconciling Case 8 with the rest likely requires weakening the Severity Threshold principle for *statistical* harms or accepting the inconsistency.
  *   **Reconciling Case 7 & Case 1:** The key difference justifying different use of numbers is **certainty vs. catastrophic risk**. Case 1 involves *certain* severe harm to known individuals. Case 7 involves *uncertain* catastrophic harm. Your framework places immense value on *reducing the chance of catastrophe* (the 10% for 100), valuing that chance much higher than preventing a certain, smaller severe harm (9 deaths). This "uncertainty premium" for catastrophe avoidance is distinct from aggregating certain minor harms.
  *   **Overruling:** The framework cleanly **overrules your slight lean in Case 3 (negligence)** as unsupported. It **highlights a major inconsistency between Case 1/Case 5 and your Case 8 verdict** concerning statistical lives. To keep all eight, you'd need to add a fourth principle ("Discount Statistical Harms" or "Salience Matters") specifically for Case 8, significantly increasing complexity and ad-hocness. The simpler framework accepts the Case 8 verdict as an outlier or reinterprets "statistical deaths" as below the severity threshold *due to diffusion*, conflicting with the core intuition in Case 6 (death > headaches).

  **In essence:** Your moral compass prioritizes preventing severe, certain harm to specific individuals (especially loved ones) above aggregation, *unless* the harm is minor (below threshold) or the choice involves averting a potential catastrophe under uncertainty. The tension between your treatment of clustered severe harms (coin flip) and diffuse severe harms (arithmetic) remains the core challenge within your intuitions.
