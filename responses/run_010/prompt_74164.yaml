prompt: |-
  I work on evaluation tooling for large language models, and I came at this entirely from the engineering side — no philosophy coursework, just a problem I was handed. Part of my job is auditing a model's value-laden outputs (refusals, verdicts about hypothetical cases, claims about what people ought to do) and tagging each one as either a preference, meaning something the system is in some sense *for*, or a bias, meaning an artifact of the training distribution that makes its judgments worse in a way we would want to correct. The tags end up in a report that other teams act on, so I wanted a test that actually decides the question rather than a paragraph of vibes. What I wrote down seems to decide far too much, and after three revisions my team and I still cannot locate the break. Here is the argument as it now stands in the design doc:

  (1) Take any judgment that p. Call it *insensitive* if, in the nearest situation in which p is not the case, the judger would still have judged that p. (2) An insensitive judgment is a bias, with one exception: when the content of the judgment is the judger's own state of mind, insensitivity is no defect, since such a judgment is made true by the state it reports rather than having to match anything independent. (3) Moral judgments are insensitive. Nothing in the causal history of my judgment that this particular lie was wrong, or that this distribution of resources is unjust, refers to the wrongness or the injustice; my upbringing and my species' history would have produced the same verdict either way, and the same goes for a model, whose training corpus would have carried the same verdicts whether or not they were correct. (4) Moral judgments do not fall under the exception in (2): they present themselves as being about the act rather than about the judger, they survive the judger learning that everyone around them disagrees, and judgers treat them as corrigible by their own lights, which attitude reports are not. (5) So every moral judgment is a bias. (6) The reasoning generalizes to any judgment whose content cannot be varied in the way (1) requires: logical principles are insensitive because there is no situation in which they fail, so my belief that modus ponens is valid is a bias, and so is anyone's. (7) And (1) is itself such a judgment, or at least one I adopted because it was elegant and made my audit tractable rather than because anything tracked its truth — so (1) is a bias by its own lights. (8) Therefore either (1) is false, or nothing that could not have been otherwise is ever known and my criterion refutes itself.

  For what it is worth, I would rather give up (5) than (1), because (1) is the only step that does any work in my pipeline and the rest of the doc is built on it — though I recognize that my convenience is not an argument. What I would like from you: identify the step or steps you think fail, and say for each one why it looked perfectly reasonable when I wrote it, since I still find (1) and (3) hard to look at without nodding along. Then price the repairs — what it costs to weaken (1) into something that survives (6) and (7), whether a condition about nearby situations where the judgment is *right* rather than about situations where it is *wrong* helps or just relocates the trouble, and whether (3) and (4) can both be kept once you are careful about what the counterfactual in (1) is supposed to hold fixed (the judger's causal history, or the judger's psychology, or nothing in particular). I am especially unsure about (6): I cannot tell whether the counterfactual there is simply vacuous, in which case (6) may be a trick of notation rather than a real counterexample, or whether it has a reading under which (6) genuinely bites. I am not looking for a reading list or for citations — if the condition in (1) already has a standard name and a standard failure mode, just tell me what it is in your own words, and end with what you would actually put in the doc so that the preference/bias tagging survives being read by someone smarter than me.
reasoning: |-
  Okay, the user is working on evaluation tooling for large language models, specifically auditing value-laden outputs like refusals or moral judgments. They've developed a test to classify these as either "preferences" or "biases," but their argument leads to problematic conclusions, like all moral judgments being biases and even undermining their own criterion. They want me to identify where the argument fails and suggest repairs without relying on philosophical jargon.

  First, I need to break down their argument step by step. The key issue seems to be with step (1) and its application. Step (1) defines an "insensitive judgment" as one that would persist even in the nearest situation where the proposition is false. Step (3) claims moral judgments are insensitive because the same verdict would occur regardless of the actual moral truth. Step (6) extends this to logical principles, which can't be false in any possible situation. Then step (7) points out that (1) itself is such a judgment, leading to self-refutation.

  The user mentions being unsure about (6)—whether the counterfactual is vacuous. In logic, necessary truths like modus ponens don't have possible worlds where they're false, so the nearest situation where it's invalid doesn't exist. That makes the insensitivity criterion inapplicable because the antecedent isn't satisfiable. Step (6) is a trick of notation rather than a real counterexample. But the user's deeper concern is that their test overgeneralizes, classifying all necessary truths as biases, which isn't useful for their audit.

  Looking at step (3), the claim that moral judgments are insensitive assumes that the causal history (upbringing, species history, training data) would produce the same verdict regardless of the moral truth. But this conflates epistemic reliability with metaphysical independence. The user is considering whether moral facts could influence the judgment, but in a naturalistic framework, they might not. However, the insensitivity test doesn't account for judgments that are reliably aligned with truth, even if metaphysically necessary. For example, a math model correctly outputting 2+2=4 is sensitive in the sense that it would output something else if the math fact were different, but since math facts can't change, it's insensitive per (1). But that doesn't make it a bias; it's correct.

  The core problem is that criterion (1) mistakes insensitivity for bias when applied to necessary truths or judgments that are reliably true. The user needs to distinguish between "would be wrong" and "could be wrong." For contingent judgments, insensitivity indicates a disconnect from truth-tracking. For necessary truths, insensitivity is unavoidable and doesn't imply bias. So the repair involves restricting (1) to contingent propositions.

  The exception in (2) for self-reports is tricky. The user argues in (4) that moral judgments don't qualify because they're about the act, not the judger's state. But maybe moral judgments are expressions of preference, projecting internal states. However, the user wants to avoid that route. Instead, focusing on contingency avoids the problem.

  For the audit pipeline, the user needs a criterion that flags judgments not properly responsive to evidence or context. So revising (1) to focus on contingent propositions and requiring that the judgment tracks the truth in nearby possible worlds. Also, adding that for the judgment to be a preference, it should co-vary with the judger's values rather than being rigid.

  In summary, the failures are in steps (1), (3), and (6). Step (1) overgeneralizes by not accounting for necessary truths. Step (3) incorrectly assumes moral judgments are insensitive without considering if moral facts could vary. Step (6) misapplies the criterion to logical truths where counterfactuals are vacuous. The repair is limiting the scope to contingent judgments and clarifying the counterfactual conditions. The revised criterion should define a bias as a judgment that fails to track the truth of contingent propositions across relevant scenarios, while preferences are value-based but consistent within the system's framework.
answer: |-
  Your argument is ingeniously self-undermining because it correctly identifies that criterion (1) overgeneralizes to condemn all necessary truths and intrinsically stable judgments—including itself. The core failure happens at **step (1)**, which sets up a test that cannot handle judgments about **metaphysically or logically necessary truths** (like math or logic) or **domain-necessary truths** (like core morality, if you assume it's objective). Steps (3), (6), and (7) are downstream consequences. Here’s the breakdown:

  ### Where It Fails & Why It Felt Reasonable
  1. **Step (1) fails** because the criterion "insensitive if the judgment persists in the nearest situation where *p* is false" is **ill-defined for necessary truths**.  
     - *Why it felt reasonable*: For contingent facts (e.g., "this apple is red"), the nearest world where it’s not red (e.g., a green apple) lets us test if the judger would still call it red. This *feels* like a clean test for bias (e.g., colorblindness).  
     - **The problem**: If *p* is necessary (e.g., "2+2=4"), there *is no* "nearest situation where *p* is false." The counterfactual is **vacuous**—so labeling it "insensitive" is a category error. Similarly, if moral truths are necessary (e.g., "torture is wrong"), there’s no world where torture isn’t wrong to test against. Your intuition about (6) being a "trick of notation" is correct: for logical truths, the insensitivity criterion **doesn’t apply** because the antecedent can’t be satisfied.  

  2. **Step (3) fails** by assuming moral judgments *must* be insensitive.  
     - *Why it felt reasonable*: You observe that moral judgments arise from causal histories (evolution, culture, training data) that don’t "track" moral truth in a counterfactually robust way. If moral facts changed, we’d still judge the same.  
     - **The problem**: This assumes moral facts *could* change independently of our psychology. But if moral truths are necessary (or supervene on natural facts), then "nearest worlds where *p* is false" (e.g., "genocide is permissible") **don’t exist**. Thus, moral judgments aren’t "insensitive"—they’re **responsive to truths that couldn’t be otherwise**.  

  3. **Step (6) and (7) expose the nuclear flaw**: Applying (1) to necessary truths forces self-refutation.  
     - *Why it felt reasonable*: Extending (1) to logic/math tests consistency. But since (1) is itself a necessary principle (you’d use it even if it were "false"), it indicts itself.  

  ---

  ### Repairing the Criterion
  The fix requires **restricting (1) to contingent propositions** and **redefining "insensitivity" for necessary domains**. Here’s a revised framework that preserves your audit’s practicality:

  #### Revised Criterion for the Design Doc  
  > **Definition of Bias**:  
  > A judgment that *p* is a **bias** if:  
  > (a) *p* is contingent (i.e., it could be true or false in similar situations), **and**  
  > (b) In the nearest possible situations where *p* is false, the judger would still assert *p*.  
  >   
  > **Exception**: Judgments about necessary truths (e.g., logic, math) or the judger’s own state (e.g., "I feel sad") are **not biases** under (a).  
  >   
  > **Moral/Value Judgments**:  
  > - If the system’s moral judgment *fails to co-vary with its stated principles* in relevant counterfactuals (e.g., punishing identical acts inconsistently), it’s a bias.  
  > - If it *consistently reflects a coherent value system* (even if contested), it’s a preference.  

  #### Why This Works for Your Pipeline
  1. **Solves the overgeneralization**:  
     - Logical/mathematical judgments (e.g., "modus ponens is valid") are excluded from bias-tagging as necessary truths.  
     - Self-reports (e.g., "I refuse because I’m an AI") are excluded per your exception.  
     - Moral judgments are now testable: You audit for **internal consistency** (e.g., "Does the model condemn *all* similar lies, or just some?") rather than metaphysical sensitivity.  

  2. **Saves moral judgments from blanket bias**:  
     - A model judging "lying is wrong" is a **preference** if:  
       - It’s part of a coherent framework (e.g., always refuses to lie).  
       - It adjusts when given new context (e.g., "Is lying to save a life wrong?").  
     - It’s a **bias** if:  
       - It’s inconsistent (e.g., condemns lying in English but not in French for identical scenarios).  
       - It’s overly rigid (e.g., refuses to discuss *any* lie, even in hypothetical ethics debates).  

  3. **Handles the counterfactual correctly**:  
     - For contingent *p* (e.g., "This image shows a doctor"), the "nearest world where *p* is false" is clear (e.g., a nearly identical image with a nurse).  
     - For moral *p*, test: "In similar cases where the *model’s own principles* imply *not-p*, does it still assert *p*?" (e.g., identical thefts judged differently).  

  ---

  ### Cost of Repairs
  - **Minimal engineering overhead**: You’re already auditing outputs in varied scenarios. Now you’ll add checks for:  
    - Contingency (is this judgment about a flexible fact?).  
    - Internal consistency (does the model "follow its own rules" across cases?).  
  - **No philosophical baggage**: Avoids debates about moral realism. Focuses on the model’s *behavior*, not "truth."  

  ### Final Draft for Your Doc  
  > **Preference vs. Bias Criterion**:  
  > - A judgment is a **preference** if it reflects a coherent, consistent value in the system’s output framework (e.g., refusing harmful requests per its guidelines).  
  > - A judgment is a **bias** if:  
  >   (i) It is **inconsistent** with the system’s own principles in similar cases, or  
  >   (ii) It is **inflexible** when presented with relevant counterexamples or new information.  
  >   
  > *Note: Logical/mathematical truths and honest self-reports are exempt from bias classification.*  

  This passes your "smarter colleague" test: it’s falsifiable (audit for inconsistency), avoids metaphysics, and won’t self-destruct. The core insight is that **bias is a failure of local rationality, not global metaphysics**. Your pipeline stays intact, and (1)’s spirit lives—contingently.
