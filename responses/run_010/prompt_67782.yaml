answer: |-
  ### Unseen Paper Question  
  **Section C: Structural-Demographic Theory and Secular Cycles (25 marks)**  
  *Answer ONE question. Write your answer in the script book.*  

  > **Question 12.**  
  > A recent study applies structural-demographic theory to a previously unanalysed agrarian polity, using 700 years of reconstructed data. Key findings include:  
  > - Three major sociopolitical instability peaks occur at intervals of 180, 210, and 265 years.  
  > - Elite numbers grow faster than total economic output across the *entire* period, including prolonged stable phases.  
  > - Real wages *rise* consistently in the two decades preceding each instability peak.  
  > - The state’s fiscal position deteriorates significantly only *after* the first recorded elite-led mobilisations in each cycle.  
  >   
  > **Critically evaluate the implications of these findings for Turchin’s secular cycles theory. To what extent do they challenge its core mechanisms, predictive validity, and status as a cyclical model?**  

  ---

  ### Model Answer (787 words)  
  The reported findings present a serious but not fatal challenge to Turchin’s secular cycles theory. While elite overproduction retains explanatory power, the theory requires substantial revision to accommodate wage trends, timing discrepancies, and cycle irregularity—exposing vulnerabilities in its testability given limited historical cases.  

  The constant growth of elites relative to output fundamentally questions the theory’s diagnostic precision. If elite overproduction is a permanent feature rather than a cyclical trigger, it cannot discriminate between stable and unstable periods. Turchin posits elite overproduction as a *proximate* crisis driver, yet here it persists through centuries of stability. This forces a concession: elite competition alone is insufficient to predict instability. The theory must integrate auxiliary factors (e.g., institutional elasticity, external shocks) to explain why overproduction ignites crisis only at specific junctures. Retaining elite dynamics as the core mechanism is plausible, but only if the model admits its inability to forecast timing without ad hoc contingencies.  

  The rise in real wages before instability peaks directly contradicts the immiseration thesis. Turchin links falling wages to popular unrest, creating a feedback loop with elite fragmentation. Yet here, improving living standards precede crisis. Jettisoning immiseration is thus necessary—but risks reducing the theory to elite-centric tautology. If the "popular" vector of structural-demographic theory is discarded, the model becomes lopsided, overemphasising elite agency while neglecting bottom-up pressures. This is not a refinement but an existential compromise: without immiseration, the theory loses its claim to explain *revolutionary* (rather than purely intra-elite) instability. The wage anomaly suggests immiseration is epiphenomenal in this case, possibly replaced by relative deprivation or political alienation.  

  The irregular inter-peak intervals (180–265 years) undermine the "cyclical" claim. Cycles imply regularity driven by deterministic feedback; this variance suggests stochasticity dominates. Turchin might reframe cycles as *metronomic* (fixed-period) versus *dynamic* (variable-period), but 700 years should reveal rhythmicity if mechanisms are universal. Instead, the data align better with contingent, path-dependent crises. The theory could survive by redefining cycles probabilistically—e.g., "pressures accumulate over 150–300 years"—but this dilutes falsifiability. If cycle length is flexible, *any* instability within a 500-year window could be retrofitted to the model. The burden shifts to specifying boundary conditions for periodicity: what variance is acceptable before "cycle" becomes a misnomer?  

  The reversed sequence of fiscal collapse and elite mobilisation challenges causal granularity. Turchin frames state weakness as enabling elite rebellions; here, elites mobilise *before* fiscal deterioration. This implies elite agency may *precipitate* state crisis rather than exploit it. Such reordering is salvageable if elites anticipate fiscal strain or if mobilisations directly cause it (e.g., via tax resistance). However, it strains the model’s sequence where state fragility precedes intra-elite conflict. This could refine the theory by introducing feedback multiplicity—yet it highlights a deeper flaw: the "bundled" interdependence of variables. When fiscal health, wages, and elite actions are interlocked, isolating causality becomes impossible, and contradictory evidence can be absorbed by adjusting auxiliary assumptions.  

  Ultimately, these findings expose the theory’s Achilles’ heel: empirical vulnerability. With only ~15 documented secular cycles globally, losing even one case to anomalies threatens generalisability. The theory’s strength—its integrated, systemic structure—becomes its weakness when components are falsified. Retaining elite overproduction as the immutable core while discarding immiseration and rigid cyclicity might preserve a skeletal framework. However, this renders the model less distinctive against rival theories of state collapse. To remain viable, secular cycles theory must delineate which mechanisms are non-negotiable (e.g., elite competition) and which are context-dependent (e.g., wage trends), while explicitly addressing its narrow evidential base. The reported polity may represent an outlier, but it forces a sobering conclusion: the theory explains instability best *post hoc*, with predictive power heavily contingent on local parameters.  

  ---

  ### Markscheme (25 total)  
  1. **Identification of Contradictions to Core Mechanisms** (5 marks)  
     *Awarded for:* Explicitly linking findings to violations of Turchin’s sequences (e.g., wages rising pre-crisis, fiscal timing reversal).  
     *Botched if:* Vaguely listing anomalies without tying them to theory’s causal claims.  

  2. **Critical Evaluation of Elite Overproduction as Predictor** (5 marks)  
     *Awarded for:* Arguing that constant elite growth undermines diagnostic power, forcing reliance on contingent factors.  
     *Botched if:* Asserting elite overproduction is "still key" without addressing constancy, or dismissing it entirely.  

  3. **Defence or Jettisoning of Immiseration Thesis** (5 marks)  
     *Awarded for:* Weighing whether discarding immiseration refines or ad hoc rescues the theory, considering popular unrest mechanisms.  
     *Botched if:* Declaring wages irrelevant to the model, or treating immiseration falsification as fatal without discussion.  

  4. **Interrogation of "Cycle" Claim Given Period Variance** (5 marks)  
     *Awarded for:* Probing whether irregular intervals demand probabilistic redefinition or falsify cyclicality, including testability implications.  
     *Botched if:* Ignoring period range, or asserting "cycles need not be regular" without justifying boundary conditions.  

  5. **Assessment of Testability and Empirical Fragility** (5 marks)  
     *Awarded for:* Evaluating how bundled mechanisms and scarce data amplify vulnerability to contradictory cases.  
     *Botched if:* Generic claims of unfalsifiability, or ignoring sample size constraints.  

  ---  
  **British English Note**: Spelling, grammar, and terminology (e.g., "marks", "centres on") adhere to UK conventions throughout.
