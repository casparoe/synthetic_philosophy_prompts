  For P1, I'm thinking about how finely acts can be described. If every act collapses into its consequences, that's a problem, like in the double effect analogy. But deontologists can point to intentions or causal structures to draw lines. I'm skeptical about whether this truly avoids collapsing, so I'll assign a moderate probability, say 0.7. 

