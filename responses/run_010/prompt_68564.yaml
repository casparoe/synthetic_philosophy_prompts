  P4 is my addition: dialectical adequacy. The reply could just restate deontology rather than answer the objection. The supervisor thinks the double effect resemblance is a feature, but I see it as a vulnerability. Probability that it's not question-begging: 0.6. 

  Now for combination. Since all terms need to be true, I'll multiply them: 0.7 * 0.4 * 0.8 * 0.6 = 0.1344. Rounded up, that's about 0.13. The most sensitive term is P2—the principled criterion. If that could be strengthened, say with a robust theory of action, it would boost the overall credence significantly. 

