answer: |-
  **Villanelle: Directive**  

  She sits by the window, warm in the sun, content.  
  A stranger’s name on forms she cannot read.  
  *When I no longer know my child, life ends.*  

  The pen that pressed the page is distant, spent.  
  She sits by the window, warm in the sun, content.  
  A nurse confirms the trigger: *Daughter, unmet.*  

  That other self feared pity’s slow descent—  
  a dread this gaze holds not, though words remain.  
  *When I no longer know my child, life ends.*  

  The harm she barred was hers alone, intent  
  locked in a vault this mind forgot to keep.  
  She sits by the window, warm in the sun, content.  

  No ghost complains; the present’s air is spent  
  on birdsong, bread, a game show’s bright display.  
  *When I no longer know my child, life ends.*  

  The law requires a checkbox, evidence lent  
  by eyes that see her smile, but never *why*.  
  She sits by the window, warm in the sun, content.  
  *When I no longer know my child, life ends.*  

  \answer{the precedent self}  

  ---

  ### Explanation:  
  - **Refrain 1 (later self):** "She sits by the window, warm in the sun, content."  
    Present tense, non-complaint. She exists peacefully, unaware of the directive.  
  - **Refrain 2 (directive):** "*When I no longer know my child, life ends.*"  
    Subjunctive/imperative mood, third-person checkable condition ("no longer know my child").  
  - **Placement:** The later self (pulse, present) opens the poem, but the directive claims the final line, mirroring legal reality: the written condition fires despite the original harm (fear of indignity) being inaccessible to the current self.  
  - **Asymmetry:** The non-refrain lines highlight the disconnect—the directive’s trigger is observable (line 2, 6, 16), but its *reason* (line 7, 13) belongs solely to the "gone" precedent self. The contemporaneous self remains undisturbed (lines 11, 14, 17).  
  - **Avoids sentiment/verdict:** No elegy for the past; the current self is agentless but intact. The form’s repetition forces the directive’s authority without moralizing.  
  - **Form’s verdict:** By giving the directive the closing line, the structure sides with **the precedent self**—the poem enacts the legal outcome where writing trumps presence.
