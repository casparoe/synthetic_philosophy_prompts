prompt: |-
  You are a philosopher of science who works on the scientific realism debate and who also has experience preparing moderators for interviews that are adversarial but civil. Please think carefully and work through the position before drafting anything.

  I moderate a recorded interview series run by our department's graduate philosophy society. Next week's guest defends a view that is not mainstream, and this interview is the only chance our audience will have to hear it pressed rather than merely introduced. Her position, as I understand it from the book and from two articles:

  - The pessimistic meta-induction has been aimed at the wrong object. The familiar lists in that literature are lists of *theories* — phlogiston, caloric, the luminiferous ether, and the like — and the realist has a well-worn answer: whatever did the genuine explanatory work in those theories is preserved in its successors, so only the ontological surplus dies. She concedes that answer, at least provisionally, and does not want to relitigate it.
  - Instead she runs the induction over *methods*: the procedures, standards of evidence, and inferential licenses by which a research tradition judges itself to be doing well. Her claim is that the record shows repeatedly that methods which were, by the internal standards of their own tradition, conspicuously successful — and were praised precisely for that success — were later abandoned not because they were applied badly but because the standards they embodied were themselves mistaken. Her coinage for the resulting thesis is methodological pessimism: our current inference licenses are, with high probability, ones that our successors will regard as unreliable in exactly the domains where they now look most reliable.
  - She argues that this version escapes two standard realist replies, and this is where the view gets interesting. First, it escapes preservative and structural variants of realism, because those responses trade on continuity of *content*, and she is claiming nothing about content: her pessimism concerns the trustworthiness of the licenses themselves, which are not the sort of thing that gets carried forward inside a successor theory. Second, she turns the no-miracles argument around: that argument is an inference to the best explanation, and inference to the best explanation is itself one of the licenses on her list, so the realist's central argument inherits the doubt her induction raises rather than answering it.

  The book has drawn three criticisms that I want to press in the interview:

  (i) Self-undermining: her thesis is itself an inductive extrapolation from a historical sample, and she cannot simultaneously distrust extrapolation from samples of scientific success and depend on it for her own premise.
  (ii) Case selection: no neutral criterion determines which abandoned procedures count as methods that succeeded by their own lights, as opposed to fringe programs or methods competently applied to a domain they were never licensed for. Her examples are chosen to fit.
  (iii) Reach: even granting the premise, it does not get to realism, because a realist can accept that methods will be revised while holding that our current methods are approximately truth-conducive, and can point out that method change has itself been progressive on any measure of progress that does not beg the question.

  Task: draft twelve to fourteen interview questions in the order I should actually ask them.

  Before the questions, give me a short brainstorming section — no more than three hundred words — in which you identify where her position is genuinely strong and where it is genuinely exposed, and name the two or three deflating moves you expect her to make (for instance, retreating from "unreliable" to "less reliable than we assume," or conceding that her own argument is inductive while claiming that the asymmetry in burden of proof carries the weight, or treating methodological pessimism as a regulative caution rather than a factual prediction). Design at least some questions so that those moves cost her something.

  Then the questions, subject to these requirements:

  1. At least one question on each of (i), (ii), and (iii), and beneath each, a follow-up keyed to the answer she is most likely to give. Label these three questions explicitly so I can find them at speed.
  2. One question on her claimed immunity to structural realism. If methods are individuated by the theories that license them, then method change may be nothing but content change in different vocabulary; make her say what a method is, and follow up with the case she will probably reach for — a procedure that survives a theory change intact and is nevertheless retrospectively judged to have been unreliable, or the converse — and ask her what her account predicts about that case in advance.
  3. One question on the inference-to-the-best-explanation point. Ask her to specify what inheriting the doubt amounts to: does she claim the no-miracles inference is unreliable, or only that we presently lack grounds for trusting it? Follow up by asking whether her own historical generalization is any better placed, and by asking what she says if her answer is that hers needs no positive support because the burden sits with the realist.
  4. One question that forces a falsifiable formulation: what historical discovery would convince her that methodological pessimism is false? Push past the reply I expect, which will be that no single case could disconfirm a probabilistic thesis, and ask her then what distinguishes her thesis from one that is merely unfalsifiable.
  5. One question on the practical upshot. If our licenses are probably unreliable where they look most reliable, what should a working scientist do differently on Monday morning, and what should a funding body or a court relying on expert testimony do differently? She will likely answer that nothing changes locally; press her on whether the view is then idle, and on whether she has simply relocated the old underdetermination worry.
  6. Include one question about the relationship between her thesis and the problem of unconceived alternatives, since audiences will assume they are the same argument: ask her what her view adds, given that the pessimist about unconceived alternatives already concludes that our theory space is impoverished in ways we cannot detect from inside it.
  7. No biographical or generic questions, no softballs, and nothing that merely asks her to restate the view. Every question must be answerable aloud in under two minutes, and must contain enough of the objection that a listener who has not read the book can follow what is being asked.
  8. Do not put words in anyone's mouth: no invented quotations from her, and no quoted passages from the realism literature. Describe other positions in the debate rather than citing them, and do not produce a reading list.

  Format: the brainstorming section first, then the numbered questions with follow-ups indented beneath each, then a closing note of three sentences telling me which two questions you would cut if the recording runs over time and why.
reasoning: |-
  Hmm, the user wants me to prepare interview questions for a philosopher defending methodological pessimism in the scientific realism debate. This is a complex philosophical position that challenges traditional realism by focusing on methods rather than theories. Let me carefully unpack what they need.

  First, I need to understand the core argument: this philosopher claims that while realists can handle theory changes through preservation of successful content, the same doesn't apply to scientific methods. She argues that historically, methods considered reliable by their own standards were later abandoned, and this undermines our current trust in methods like inference to the best explanation (IBE).

  The user has highlighted three main criticisms they want to press: self-undermining (since her argument relies on induction), case selection bias, and limited reach (it doesn't necessarily defeat realism). I also need to address her claims about immunity to structural realism and her reversal of the no-miracles argument.

  For the brainstorming section, I should identify strengths and weaknesses. Her position is strong where it bypasses content-preservation strategies and reframes IBE as part of the problem. But it's exposed on self-application of induction and vagueness about what counts as a "method." I anticipate she might retreat to weaker claims about burden of proof or treat pessimism as merely cautionary.

  Now for the questions - I need exactly 12-14 following specific requirements. I'll structure them to:
  - Open with method definition to set common ground
  - Include dedicated sets for each criticism (i-iii) with follow-ups
  - Cover structural realism immunity
  - Address IBE reversal
  - Force falsifiability
  - Explore practical implications
  - Distinguish from unconceived alternatives
  - End with constructive engagement

  For the self-undermining question, I'll challenge her use of induction and follow up when she inevitably appeals to burden of proof. For case selection, I'll question her criteria for "successful" historical methods. For reach, I'll push whether realism survives method revision. 

  I'm particularly interested in how she distinguishes methods from theories for the structural realism point. And her reversal of IBE needs scrutiny - if IBE is unreliable, how can any argument (including hers) be trusted?

  The practical upshot question is crucial - if nothing changes for scientists, does this matter? And distinguishing from unconceived alternatives will clarify her unique contribution.

  If we need to cut questions later, I'd prioritize removing the unconceived alternatives distinction and the constructive engagement question, as they're less central to core objections. The falsifiability and practical implication questions are more critical for testing her position's substance.

  This framework ensures every question presses the argument while remaining civil and comprehensible to an audience unfamiliar with her book. The follow-ups are designed to prevent easy retreats and make any concessions cost theoretical ground.
answer: |-
  ### Brainstorming
  **Strengths:** Her pivot to methods shrewdly bypasses preservative/structural realist defenses. The historical record *does* contain abandoned "successful" methods (e.g., certain uses of analogical reasoning in 19th-century physics, pre-quantum statistical inferences). Turning the no-miracles argument against itself via IBE's unreliability is rhetorically potent and targets realism's epistemic engine.  
  **Exposures:** The self-undermining charge is acute: her inductive leap over methods appears vulnerable to the same distrust she urges for scientific inductions. Defining "method" robustly enough to avoid collapsing into content-change or being too vague is difficult. The reach to full-blown pessimism (vs. mere caution) is tenuous without showing methods *fail* to be truth-conducive, not just evolve.  
  **Expected Deflating Moves:**  
  1.  **Burden-Shifting Retreat:** Conceding her argument is inductive but claiming the *realist* bears the burden to justify current licenses, making her induction merely "defeasible grounds for doubt."  
  2.  **Reliability Gradient:** Retreating from "unreliable" to "less reliable than assumed" or "unreliable in ways we can't yet detect."  
  3.  **Regulative Caution:** Framing pessimism not as a factual prediction but as a heuristic urging epistemic humility, blunting falsifiability.  
  **Costly Design:** Questions will force her to clarify the *strength* of the pessimism (probabilistic claim vs. caution) and the *status* of her own inductive license. Retreats on these should make the position seem either weaker than advertised or inconsistent.

  ---

  ### Interview Questions

  1.  **Clarifying Core: Method Definition**  
      You argue the pessimistic meta-induction should target scientific *methods* – procedures, standards, inferential licenses – rather than theories. But 'method' can be notoriously slippery. Could you define what constitutes a distinct 'method' for your induction, such that its abandonment isn't simply a consequence of the theory that licensed it changing? What makes a method a stable enough unit to track over time?

  2.  **Immunity to Structural Realism**  
      You claim methodological pessimism escapes structural realist replies because they focus on content-preservation, while methods aren't preserved like content. But if a method’s validity is intrinsically tied to the theoretical framework defining its domain and rules (e.g., caloric theory’s standards for heat flow), isn’t method change inseparable from content change? How do you individuate methods *from* content?
      *   *Follow-up:* Consider a specific historical case where a *procedure* (like a measurement technique or calculation rule) persists through a major theory change largely unchanged, yet is later deemed unreliable for reasons unrelated to the old theory (or vice-versa – abandoned with the theory but later vindicated). What does your account predict about such a case, and what historical example best illustrates your point?

  3.  **Self-Undermining (i)**  
      Your core argument relies on an inductive inference: extrapolating from past abandoned methods to the likely unreliability of current ones. But doesn't this induction itself depend on the very kind of inferential license – extrapolating from past success – that your thesis casts doubt upon? How can you trust *this* induction if the licenses underpinning such inferences are suspect?
      *   *Follow-up:* If your response is that the realist bears the burden to justify *current* licenses, while your induction merely raises a defeasible doubt, doesn't that significantly weaken your thesis from "probably unreliable" to "we currently lack positive justification"? How strong is the *probability* you assign, and on what basis?

  4.  **Case Selection (ii)**  
      Critics argue your historical examples of 'successful-yet-abandoned' methods are cherry-picked. What objective, non-question-begging criterion determines whether a past method was genuinely "successful by its own lights" versus a fringe program, or competently applied but simply misapplied to an inappropriate domain? How do you avoid selecting only cases that fit your narrative?
      *   *Follow-up:* Take a method eventually abandoned that you *don't* include in your induction – perhaps because you judge its success wasn't genuine or internally recognized. What specific, principle-based reason excludes it, and couldn't a realist apply similar reasoning to exclude *your* chosen cases?

  5.  **IBE & No-Miracles Reversal**  
      You argue the No-Miracles Argument for realism fails because it uses Inference to the Best Explanation (IBE), an inferential license your induction casts doubt on. When you say the NMA "inherits the doubt," do you mean that using IBE here is demonstrably *unreliable* in this context, or simply that we currently *lack grounds* for trusting it?
      *   *Follow-up:* If it's the latter (lack grounds), how is the status of your *own* historical generalization – which also seems like an explanatory inference – any better? If you argue yours needs no positive support because the burden sits with the realist, does this mean *any* historical pattern could generate equivalent doubt, regardless of its plausibility?

  6.  **Reach (iii)**  
      Granting that methods evolve and past ones were discarded, why does this imply *pessimism* about current methods rather than simply *fallibilism*? Couldn't a realist argue this evolution *is* progress, that our current methods, while imperfect, are the most truth-conducive yet developed, and that abandoning flawed methods *improves* reliability? How does your induction show methods are *not* converging on reliability?
      *   *Follow-up:* If the realist concedes methods change but insists current ones are *approximately* reliable (even if future ones are better), does your thesis actually threaten *that* form of realism, or only a more dogmatic one?

  7.  **Falsifiability Demand**  
      Methodological pessimism seems hard to falsify. What specific historical discovery *could* potentially demonstrate it is false? For instance, finding that past 'successful' methods were never truly reliable even by their *own* contemporary standards, or that current methods have a unique feature making them immune to past patterns?
      *   *Follow-up:* I anticipate you might say no single case disconfirms a probabilistic thesis. But then, what distinguishes your thesis from one that is fundamentally unfalsifiable? What evidence *would* lower the probability you assign to its truth?

  8.  **Relation to Unconceived Alternatives**  
      Your thesis might sound similar to Stanford's problem of unconceived alternatives, which also undermines confidence in current theories. Given that Stanford's argument already suggests our *theory space* is impoverished, what does focusing on *methods* specifically add? Does methodological pessimism reveal a distinct, deeper epistemic problem?
      *   *Follow-up:* Couldn't a critic argue that unconceived methodological alternatives are simply a *subset* of unconceived theoretical alternatives, making your argument redundant, or that method change is primarily *driven by* theory change via unconceived alternatives?

  9.  **Practical Upshot**  
      If our licenses are probably unreliable where they look most reliable, what concrete difference should this make? What should a scientist do differently on Monday? Should funding bodies demand different justifications? Should courts discount expert testimony relying on IBE or similar licenses?
      *   *Follow-up:* If, as I suspect, you say little changes locally – scientists still rely on their licenses, courts on experts – doesn't this make methodological pessimism practically idle? Is it essentially just relocating the underdetermination worry from theories to methods, without new practical consequences?

  10. **Strength of the Pessimism**  
      You often use strong probabilistic language ("with high probability"). Is methodological pessimism a factual claim about the likely future assessment of our methods, or is it better understood as a regulative principle urging caution? If the former, how do you justify the *strength* of the probability claim against charges of historical cherry-picking? If the latter, how is it more than just standard fallibilism?

  11. **The Burden of Proof Asymmetry**  
      You seem to place the entire burden of justifying current inferential licenses on the realist. Why is this asymmetry justified? Why isn't the burden on *you* to show that the historical pattern you identify *actually licenses* a strong inductive inference to the unreliability of current methods, rather than just illustrating that methods change?

  12. **Constructive Engagement**  
      Beyond inducing doubt, does methodological pessimism offer any positive guidance for improving scientific methodology? Does it suggest specific features we should look for in licenses to increase their resilience, or ways to detect potential flaws in our current standards that we might be blind to?

  ---

  ### Closing Note on Cuts
  If time runs short, cut **Question 8 (Relation to Unconceived Alternatives)** and **Question 12 (Constructive Engagement)**. While distinguishing from Stanford is useful, it's secondary to the core objections about self-undermining, case selection, and the strength/reach of the thesis itself. The constructive question, while valuable, presses less directly on the argument's vulnerabilities than questions on falsifiability or practical idleness. Prioritize questions testing the thesis's internal coherence and evidential support.
