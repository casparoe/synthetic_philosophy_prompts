prompt: |-
  I'm on a working group at a European museum writing a policy for the Benin plaques we hold — about ninety of them, taken in the 1897 expedition and then bought piecemeal on the market over the next few decades, so most of our accession records say "purchased, Hamburg, 1908" and nothing else. Our senior curator reaches for the same comparison in every single meeting: a museum is a library. You don't ship a book back to the country its author was born in; what matters is that the text is readable by anyone who wants it, and now we can scan it and send the scan anywhere in the world for free. From that he gets three concrete positions, and he thinks the analogy earns all three: (1) we return only the items where provenence clearly shows violent taking, and keep the rest; (2) high-res digitisation plus open access discharges whatever is left of any claim; (3) saying these things belong to humanity isn't a dodge, it's just the open-shelves principle, and the people who object are the ones being parochial.

  At the last session our counterpart from the partner institution in Benin City pushed back with basically the opposite comparison: these are not books, they are more like human remains — they were made for one particular court, they are that court's own record of itself, the court that commissioned them still exists, and we already accept without argument that skulls and grave goods get handed back to descendants rather than kept "for humanity." So they should be handled under the same rules we already apply to remains.

  Can you audit both of these properly? I want the correspondence laid out explicitly — for the library one, what in our museum plays the role of the library, the book, the text, the reader, the acquisition desk; for the remains one, what plays the role of the body, the descendant community, the funeral. Then the disanalogies, and I want them sorted into the ones that actually destroy the use being made of the analogy versus the ones that are just interesting but don't bite. In particular, dig into what "it's a library" is quietly assuming: something about who owns things when nobody has a title, something about whether an object's meaning is separable from the object and can be shipped as a scan, and something about who counts as "the public" given that most of the people who'd use our open access can get a visa here far more easily than the people whose court made the plaques can. And crucially — grant him the analogy for the sake of argument and tell me whether (1), (2) and (3) still follow, or whether they were being smuggled in by the framing and a library would behave differently anyway. Libraries do deaccession, libraries do have interlibrary loan and deposit agreements, libraries do return stolen items — does any of that give him a version of his own conclusion he can keep?

  Last bit: if both analogies are load-bearing in the wrong way, what would a better one be? I keep wanting to reach for something like a crown, or a national archive, or a witness in a trial, but I don't trust my instincts here — tell me which comparison would actually carry the reasoning without doing the smuggling, or whether the honest answer is that no analogy works and the argument has to be made some other way.
reasoning: |-
  Okay, the user is part of a working group at a European museum dealing with Benin plaques. They need to audit two analogies used in their policy discussions: one comparing the museum to a library and the other to human remains. Let me start by understanding each analogy's structure.

  The senior curator's library analogy has several components: museum as library, plaques as books, digitization as scanning, etc. The Benin City counterpart's analogy treats plaques as human remains, requiring repatriation. The user wants a detailed correspondence and disanalogies, especially those critical versus incidental. They also want to know if the curator's points (1, 2, 3) hold even if the analogy is accepted, and if libraries' practices like deaccessioning could support a modified conclusion. Finally, they seek a better analogy or if analogies should be avoided.

  First, I need to map each analogy's elements. For the library: museum=library, plaques=books, digitization=scanning, etc. For human remains: plaques=remains, Oba's court=descendant community. Then, identify disanalogies. Key disanalogies for the library: uniqueness vs. mass production, cultural specificity vs. universal text, different acquisition contexts. These undermine the curator's points. For human remains, disanalogies include plaques being non-mortuary and still functional, which might weaken the analogy but not fatally.

  Next, check if accepting the library analogy still supports the curator's points. Libraries do return stolen items, deaccession duplicates, and use interlibrary loans. So points (1) and (2) don't hold because provenance matters, and digitization doesn't replace originals. Point (3) about belonging to humanity is contradicted by libraries respecting cultural ownership.

  The user's deeper needs: They need compelling arguments to counter the curator's stance, possibly to advocate for repatriation. They might seek validation for the Benin City perspective and want concrete reasoning to present in meetings. Also, they may need alternatives to analogies for stronger policy arguments.

  For a better analogy, national archives or crown jewels emphasize cultural sovereignty and inalienability. But analogies have limits. The best approach is to focus on specific factors like cultural significance, ongoing harm, and ethical obligations beyond legal ownership.

  In summary, both analogies have flaws. The library analogy fails under scrutiny, while human remains holds better but isn't perfect. The user should steer the discussion towards the unique aspects of the plaques and ethical considerations, using the human remains analogy cautiously and supplementing with direct arguments.
answer: |-
  Here's a detailed audit of both analogies, breaking down their components, correspondences, disanalogies (with critical impact assessment), and whether the curator's conclusions hold even *within* his own analogy. Finally, we'll explore alternative frameworks.

  **I. Auditing the "Museum as Library" Analogy (Senior Curator)**

  1.  **Correspondence Mappings:**
      *   **Library:** The Museum itself.
      *   **Book:** A single Benin plaque.
      *   **Text:** The visual information, iconography, and artistic content *on* the plaque (the "story" it tells).
      *   **Reader:** Any museum visitor, researcher, or online viewer accessing the plaque or its image.
      *   **Acquisition Desk:** The museum's historical acquisition process (e.g., purchasing agents, auctions, donors).
      *   **Scan/Digitization:** High-resolution photography, 3D scanning, and online publication of the plaque.
      *   **Open Shelves Principle:** Universal access to knowledge/culture; the idea that objects belong to "humanity".

  2.  **Disanalogies & Critical Assessment:**
      *   **Uniqueness vs. Mass Production (CRITICAL):** Books are mass-produced identical copies. A Benin plaque is a unique, hand-crafted artifact. A scan is a perfect *copy* of a book's *content*. A scan is an *incomplete representation* (lacking materiality, scale, context, aura, spiritual essence) of a unique artifact. **Destroys:** The core argument that a scan "discharges any claim" (Point 2) and that universal access via scan is equivalent to physical access to the original. Libraries keep originals *because* copies are functionally identical; museums keep originals *despite* copies existing because the original *is* irreplaceably unique.
      *   **Cultural Specificity & Ritual Function (CRITICAL):** Books are primarily informational/entertainment objects designed for broad consumption. Benin plaques were created for a *specific* sacred, political, and historical context within the Oba's palace complex. They are integral to the Edo people's identity, history, and ongoing cultural/royal practices. **Destroys:** The idea that meaning is *solely* in the "text" (imagery) separable from the object and its context (Point 2 & 3). It challenges the "belongs to humanity" claim as overlooking specific cultural ownership and function.
      *   **Provenance & Acquisition Assumptions (CRITICAL):** The analogy assumes the "acquisition desk" operates neutrally in a legitimate marketplace. The 1897 British Punitive Expedition was a violent looting event. Plaques subsequently sold on the market were looted goods entering an illegitimate trade. Libraries *do* return stolen property (e.g., Nazi-looted art/books). **Destroys:** The premise underpinning Point 1 ("return only items where provenance clearly shows violent taking"). The *original* taking was violent looting; subsequent purchases were of tainted goods. The analogy *assumes* innocence absent *explicit* violent taking records, which is historically inaccurate for Benin.
      *   **"The Public" & Access Imbalance (CRITICAL):** The analogy assumes "anyone" can be a "reader." However, physical access to the museum is easier for Europeans/Westerners than for Edo people from Nigeria (visa barriers, cost). The "reader" accessing the scan online still lacks the cultural context and deep connection. **Destroys:** The "open-shelves principle" as neutrally universal (Point 3). It highlights that the current arrangement prioritizes *one* "public" (Western) over the *source* community, whose access is hindered.
      *   **Ownership of Knowledge vs. Object (CRITICAL):** Libraries facilitate access to *knowledge* (the text). Museums often claim stewardship of the *physical object itself*. The analogy conflates sharing knowledge *about* the plaque (which digitization enables) with retaining physical possession *of* the plaque. **Destroys:** The jump from "scan provides access to information" to "therefore, we keep the object" (Points 2 & 3). Sharing knowledge doesn't inherently justify retaining the physical cultural patrimony.
      *   **Interesting but Less Critical Disanalogies:** Physical handling (books are meant to be handled, plaques often aren't); conservation needs; sheer volume (libraries manage millions, museums manage unique collections); primary purpose (library = access to content, museum = preservation/display of originals *as* originals).

  3.  **Does the Analogy Support (1), (2), (3) Even if Accepted?**
      *   **(1) Return only items with clear violent provenance:** **NO.** Libraries *absolutely* return stolen property when provenance is established, regardless of how they acquired it (e.g., buying stolen goods innocently). They don't say "we only return things stolen *directly* at gunpoint, not things bought later." The analogy *undermines* Point 1. A library operating ethically *would* investigate and return items looted in a known violent raid, even if bought later "legally."
      *   **(2) High-res digitization discharges claims:** **NO.** Libraries don't argue that scanning a stolen book discharges the claim to return the original. They return the original *and* might retain/share a copy. Digitization provides access to *information*, not restitution for the loss of the unique object.
      *   **(3) "Belongs to Humanity" isn't a dodge:** **WEAK/MISAPPLIED.** While libraries promote universal access to *knowledge*, they don't claim physical books lack specific ownership (publisher, author estate, library itself). The "open shelves" principle is about *access*, not denying rightful ownership. Calling objectors "parochial" ignores the specific cultural ownership claims and the harm of displacement. A library wouldn't keep a stolen sacred text from an active religious community claiming it back and call *them* parochial for wanting it returned.

  4.  **Could the Library Analogy Support a Modified Conclusion?**
      *   **Yes, but opposite to the curator's intent.** Libraries recognize:
          *   **Provenance Matters:** They deaccession and return stolen items (supports repatriation for looted items).
          *   **Sharing Resources:** They engage in Interlibrary Loan (ILL) and deposit agreements (supports long-term loans, shared custody, or physical returns with digital/physical replicas retained).
          *   **Deaccessioning:** They deaccession duplicate, outdated, or unused materials (supports that not every object *must* be kept forever, especially if it has a more rightful home).
      *   **Conclusion:** A *better* library analogy would be: "We are custodians of important cultural 'texts.' We have a duty to ensure access (digitization!), but also a duty to ensure rightful ownership. For items looted in a documented violent act, rightful ownership resides with the source community/institution. We should prioritize repatriation (the ultimate 'return to owner') or equitable sharing agreements (like ILL/deposit), while ensuring universal digital access to the *information*."

  **II. Auditing the "Plaques as Human Remains" Analogy (Benin City Counterpart)**

  1.  **Correspondence Mappings:**
      *   **Human Remains/Grave Goods:** The Benin plaques.
      *   **Descendant Community:** The Oba of Benin, the Royal Court, and the Edo people of Nigeria (as a continuous cultural and political entity).
      *   **Funeral/Burial Context:** The original sacred, commemorative, and legitimizing function within the Oba's palace complex (the "living court" context).
      *   **Scientific/Research Value (sometimes argued against return):** The historical, artistic, and anthropological research value of the plaques held by the museum.
      *   **Ethical Duty to Repatriate:** The museum's ethical obligation to return the plaques.

  2.  **Disanalogies & Critical Assessment:**
      *   **Mortuary vs. Living Culture (MODERATE):** Human remains are explicitly associated with death and burial. Plaques, while deeply sacred and tied to ancestors, were part of a *living*, functioning court and political/ritual system. **Impact:** Doesn't *destroy* the analogy, as the core link to ancestors, sacredness, and community identity remains strong. However, it highlights plaques' *ongoing* cultural function, which is arguably even *stronger* than remains purely for burial.
      *   **Universality of Repatriation Principle (MODERATE):** Repatriation of remains is widely (though not universally) accepted ethically and increasingly legally. Repatriation of cultural property like the plaques is still contested in many institutions/countries. **Impact:** Weakens the *predictive* power of the analogy ("we *already* accept this") but doesn't weaken its *ethical* force. It highlights the inconsistency the analogy seeks to expose.
      *   **Physical Integrity & Treatment (MINOR):** Remains have specific handling sensitivities (NAGPRA, etc.). Plaques, while sacred, are art objects displayed. **Impact:** Interesting difference in practical protocols, but doesn't undermine the core ethical claim of return to descendants.
      *   **"Descendant Community" Definition (POTENTIALLY CRITICAL):** Defining the legitimate claimant for remains can be complex. Here, the continuity of the Oba's court provides a remarkably clear line of descent and cultural authority. **Impact:** In *this specific case*, this disanalogy is weak – the claimant *is* clear and direct. The analogy holds well here.
      *   **Research Access Post-Repatriation (MINOR):** Concerns about research access after return exist for both remains and plaques. Agreements can manage this. **Impact:** Not a disanalogy that destroys the core claim; it's a practical consideration addressable through negotiation (as sometimes happens with remains).

  3.  **Overall Strength of Analogy:** **Strong, especially for Benin.** The core parallels – profound sacredness, intrinsic link to specific ancestors and a continuous community, violation through unauthorized removal, and the ethical priority of return to that community for proper care/respect – are highly compelling. The disanalogies are generally less critical than those undermining the library analogy.

  **III. Towards Better Frameworks**

  Both analogies are problematic: the library analogy is deeply flawed and actively undermines the curator's points when scrutinized; the human remains analogy is strong ethically but can be nitpicked. The core issue requires direct engagement with the specific nature of the Benin plaques and the historical injustice. Analogies are useful starting points but become "load-bearing" crutches. Here are alternatives and a recommendation:

  1.  **National Archive / Sovereign Record:**
      *   **Correspondence:** Plaques = Archival documents (laws, treaties, court records). Museum = Foreign repository. Edo People/Oba = Legitimate government/people. Looting = Seizure of state records.
      *   **Strengths:** Emphasizes sovereignty, state/cultural patrimony, the plaques as foundational historical *records* of a specific nation/kingdom. Underscores the illegitimacy of retaining them. Supports return unequivocally.
      *   **Weaknesses:** Might downplay sacred/ritual aspects. "Archive" can feel sterile.

  2.  **Crown Jewels / Regalia:**
      *   **Correspondence:** Plaques = Crown, scepter, orb. Museum = Foreign vault. Oba = Monarch. Looting = Theft of symbols of office/state.
      *   **Strengths:** Captures unique sovereignty, inalienability, identity, and ongoing function. Makes the violation stark (imagine the UK Crown Jewels in a foreign museum). Universally understood concept of national treasures.
      *   **Weaknesses:** Might seem too focused on monarchy vs. broader people (though Oba embodies Edo identity). Less emphasis on historical record.

  3.  **Witness to History / Stolen Testimony:**
      *   **Correspondence:** Plaque = Witness. Museum = Court holding witness hostage/in contempt. Edo People = The party needing the testimony. Looting = Silencing/abducting the witness.
      *   **Strengths:** Powerful moral dimension (injustice, silencing). Highlights plaques as active participants in narrating Edo history *in situ*. Demands restoration.
      *   **Weaknesses:** More abstract. Less concrete policy guidance.

  4.  **Direct Ethical & Historical Argument (Recommended):** **Move beyond analogy.** Frame the discussion directly:
      *   **Acknowledge the Injustice:** The plaques were looted during a violent colonial raid. Their presence in the museum is a direct result of that act.
      *   **Recognize Specificity:** They are not generic "art." They are unique, sacred objects central to Edo identity, history, and the *ongoing* function of the Oba's court.
      *   **Center the Claimant:** The Edo people, through the Oba and Nigerian institutions, are the clear descendants and legitimate cultural owners.
      *   **Define the Harm:** Retention perpetuates the violence of 1897, denies the Edo people access to their heritage, and hinders cultural continuity.
      *   **Reframe Stewardship:** Ethical stewardship *requires* working towards rightful return or equitable shared custody agreements that prioritize the source community's needs and authority.
      *   **Leverage Digitization Positively:** Frame high-res digitization and open access as tools to facilitate *global understanding and education* **during the process** of negotiating restitution or partnership, **not** as a substitute for it. Ensure digital access empowers Edo scholars and institutions.
      *   **Focus on Partnership:** Shift the goal from "do we keep them?" to "how do we partner respectfully with Benin City to ensure these treasures serve both Edo cultural life and global understanding?"

  **Conclusion:**

  The Senior Curator's library analogy fails under scrutiny: its disanalogies critically undermine his Points 1, 2, and 3. Crucially, even *within* the analogy, ethical library practices support repatriation of stolen property, not retention. The Benin City counterpart's human remains analogy is ethically strong and holds well for Benin plaques due to the clear continuity of the claimant community and the profound cultural/sacred significance.

  However, relying solely on analogy is risky. The most honest and robust approach is to address the issue directly based on the **specific historical injustice of the 1897 looting, the unique cultural patrimony status of the plaques for the Edo people, and evolving international ethical standards.** Framing the plaques as **Sovereign Cultural Patrimony** (like Crown Jewels or National Archives) or emphasizing their role as **Witnesses to Injustice** needing to return home can be powerful rhetorical tools, but the core argument must rest on concrete historical, ethical, and cultural grounds. Prioritize partnership with Benin City and view digitization as a tool for access *alongside*, not *instead of*, ethical restitution processes.
