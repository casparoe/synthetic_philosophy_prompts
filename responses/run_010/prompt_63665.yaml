  *noticing tension* What's interesting is how their repair tries to have it both ways: keep grounding useful by saving asymmetry/fundamentality while allowing cycles. But the deflationists will pounce on this - the hyperintensionalist will ask why we need "ground" at all if we're still using conceptual constraints, and the anti-monist will see their restricted subclass as ad hoc. 

  *checking requested structure* For the eight objections, I'll need to: 
