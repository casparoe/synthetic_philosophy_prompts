answer: |-
  ## Farewell Address for Justice Harriet Vance

  Harriet, colleagues, friends, and especially family – thank you for the profound honor of speaking tonight. Thirty-one years on the bench. A thousand cases, perhaps. Countless decisions shaping lives, businesses, communities. How do we begin to grasp the weight of that? How do we understand what it meant for Harriet to sit, not alone, but alongside colleagues, weighing arguments, seeking justice?

  I find myself turning to an idea, simple in its core but profound in its implications, from an 18th-century French thinker, the Marquis de Condorcet. It’s about groups making decisions. He suggested that when a group of people, each more likely than not to be correct about a straightforward yes-or-no question, vote *independently* – meaning their votes aren’t swayed unduly by each other – then the majority vote is actually *more* likely to be correct than the vote of any single member. The larger the group, the stronger this effect becomes.

  Now, I know Harriet is well aware that I’ve spent years poking at the fine print of this theorem, particularly when applied to something as complex as a judicial panel. Tonight isn’t the place for that dissection, but we must glance at the edges.

  First, cases are rarely simple yes-or-no questions. They are tangled skeins of law and fact. Second, judges on a panel don’t vote in isolation. They deliberate. They argue. They persuade and are persuaded. That beautiful, messy process of reasoning *together* – which is the heart of appellate judging – means their final votes aren’t truly independent in the way Condorcet’s neat math might prefer. We can’t simply say a panel’s majority is automatically more reliable than a single judge because they deliberated. The math doesn’t grant us that shortcut for three people wrestling with the hardest questions left in the system, where reasonable minds truly differ.

  Which brings us, inevitably, to the question of dissent. Or, in Harriet’s remarkable record, the near absence of it. One formal dissent in thirty-one years. One lonely voice raised in public disagreement.

  Condorcet’s theorem, taken strictly, might give us pause here. If we imagined judges as perfectly independent coin-flippers (which they absolutely are not!), such overwhelming agreement could imply one of two things. Perhaps it means the judges were so exceptionally competent and the questions so clear that consensus was almost inevitable. Or, less flatteringly, it could suggest votes weren’t truly independent at all – that agreement was reached not through robust, independent conviction tested in the crucible of debate, but perhaps through deference, or a desire for harmony, or simply the gravitational pull of the group, rendering each individual’s "yes" or "no" less meaningful as a separate signal.

  To feel that second possibility for just a moment isn’t cruelty; it’s honesty about the theorem’s lens. And it forces a vital question: If Condorcet’s promise of increased reliability through majority voting is complicated here – by deliberation, by complex questions, by this very record of consensus – then *why* does sitting as a panel matter so deeply? Why did Justice Vance’s thirty-one years of joining, and nearly always agreeing with, majorities command such respect?

  I believe the profound value lies not primarily in the *statistical probability* of the final vote tally being "correct," though we hope it often is. The deeper strength of the panel lies in the *process it demands*, a process Harriet embodied with unwavering integrity.

  Sitting on a panel forces something essential. It forces each judge, Harriet included, to articulate their reasoning not just for themselves, but *in a form that another intelligent, equally responsible person must answer*. Your reasons must be laid on the table like tools, examined, challenged. You cannot retreat to private certainty. The very act of deliberating – of having to convince a colleague, or being convinced by them – refines and tests the judgment in a way solitary decision-making never can. It exposes flaws, strengthens sound reasoning, and demands intellectual honesty.

  And crucially, when disagreement *does* arise, even if rarely voiced in a final dissent, the panel structure ensures it is heard and wrestled with internally. Even more importantly, the structure mandates that the *losing side’s best arguments*, the reasons why the case was hard, are enshrined in the record. They are written down. They cannot be quietly forgotten or swept aside. Future judges, future citizens, can see the counter-arguments, understand the tension, and hold the majority’s reasoning to account against the strongest possible opposition. The panel creates a durable record of the *contest* of ideas, not just the victor. This is how law evolves, how justice remains accountable, not just to authority, but to reason itself.

  Harriet, your legacy is etched in that process. For thirty-one years, you brought your formidable intellect, your deep compassion, and your unwavering sense of fairness to that shared table. You subjected your reasoning to the discipline of collegial scrutiny. You listened intently, argued fiercely when necessary, and ultimately joined judgments knowing they had been forged in the fire of mutual challenge and respect. You understood that the dignity of the court resided not just in the outcome, but in the rigorous, transparent, and deeply human way those outcomes were reached.

  Condorcet himself, who placed such faith in collective reason, met a tragic end, hunted and imprisoned by the very forces of majority fervor he sought to understand. It’s a stark reminder that the machinery of voting is just that – machinery. Its virtue depends entirely on the character, the intellect, and the commitment to fair process of those who use it.

  You, Harriet, used that machinery with profound integrity. You honored the process. You honored the law. You honored the people who came before your court. You showed us that true judicial strength lies not in solitary certainty, but in the courage to reason together, to be accountable to one another, and to leave a clear record for the future.

  For that, and for your friendship and guidance over so many years, we offer our deepest gratitude and respect. May your retirement be filled with the same clarity, warmth, and wisdom you brought to the bench. Thank you.

  ---

  **Appendix: Constraint Note (149 words)**

  The Condorcet Jury Theorem (CJT) constrained the draft in three key sentences:

  1.  **"We can’t simply say a panel’s majority is automatically more reliable than a single judge because they deliberated."** The CJT’s independence condition forbade claiming deliberation inherently increases correctness probability for three judges. Deliberation violates independence, so the theorem’s reliability guarantee for majorities doesn’t apply.
  2.  **"Condorcet’s promise of increased reliability through majority voting is complicated here... by complex questions, by this very record of consensus..."** The CJT assumes a single binary question and individual competence >0.5. It forbade implying Harriet’s near-unanimity proved her panels were exceptionally *correct* or that the questions were easy ("clear"). The complex cases and hard questions directly challenge the basic competence assumption for binary truth-tracking.
  3.  **The asymptotic result ("The larger the group...")** was mentioned solely as part of stating the theorem correctly, but explicitly *not* invoked for the panel of three, as requested.
