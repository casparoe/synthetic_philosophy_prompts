answer: |-
  The brass chronometer at Morcambe Harbor ticked like an accusation. Elara Vance checked it against the pocket watch clutched in her cold hand, then against the tide gauge’s recorder drum, its smoked paper etched with an inky, undeniable line. Forty minutes. Again. The high water mark sat stubbornly below where the Vallance equations, elegant and deeply carved into the institute’s understanding, insisted it should be.

  Back at the Whitby Institute of Tidal Phenomena, the air was thick with pipe smoke, damp wool drying by the coal stove, and a low thrum of unease. Director Armitage’s office, usually a sanctuary of polished oak and neatly rolled charts, felt claustrophobic. Armitage himself, shoulders stooped beneath his tweed jacket, paced before the large wall map studded with pins marking observation sites. His face, normally animated by the intricate dance of lunar pull and elastic substratum, was drawn. Marsh, the wiry post-doc whose ambition often curdled into resentment, leaned against a filing cabinet, arms crossed. Old Dr. Finch, down from the Admiralty funding board ostensibly to inspect the new chronometers, peered through pince-nez at the Morcambe data sheets Elara had just distributed, his lips pursed.

  "Forty minutes," Finch stated, tapping the paper. "Daily. Consistent. Vallance predicted high water *here*," his finger stabbed the map at Morcambe, "*here*. Not forty minutes late. A theory that cannot predict is…" He trailed off, leaving the implication hanging like fog over the harbor.

  Armitage stopped pacing. "It predicts beautifully everywhere else, Finch. From St. Ives to Scapa Flow. The Vallance account *works*. It explains the Scarborough surge, the Hebrides double-tide, phenomena that baffled us for decades. One counter-instance, however persistent, does not invalidate a framework that has yielded a decade of productive research." His voice gained strength, the familiar fire returning. "This program has been challenged before. Remember the 'Aberdeen Aberration'? We thought it was the end. Turned out to be localized sedimentation skewing the gauge readings. We learned, we refined, we moved forward *stronger*. The heuristic power," he paused, letting the slightly unfamiliar term hang, "the *guiding power* of Vallance is unimpaired. It tells us *where* to look next, *what* questions to ask. It generates problems, Finch. That’s the mark of a living science, not a dead dogma."

  "But this *is* a problem," Marsh muttered, not looking at anyone. "A big, fat, inconvenient one."

  "Precisely!" Armitage seized on it. "And we will solve it. We don't abandon ship because we hit a squall. We batten down, we adjust sail. The core principle – lunar gravitation transmitted via the elastic sub-seabed layer – is sound. Unassailable. The anomaly must lie in the auxiliary assumptions surrounding its application at Morcambe. Something local. Something we haven't accounted for."

  Silence followed, heavy with thought and Finch’s palpable skepticism. Elara watched the Director, the man who’d plucked her, a fisherman’s daughter with a head for numbers, from the harbor office and given her a world of brass instruments and celestial mechanics. She saw the strain around his eyes, the fierce protectiveness. Vallance was his legacy, the institute’s reason for being.

  Then young Peters, usually quiet, fiddling with a slide rule, cleared his throat. "The new chronometer," he ventured, his voice hesitant. "The one installed at Morcambe last quarter. Admiralty specification, brass-cased, compensated for temperature… but what if… what if the compensation isn't perfect? A tiny hysteresis effect? A lag in the mechanism itself under the specific thermal conditions of that exposed harbor? It could accumulate over the tidal cycle… maybe explaining a forty-minute drift?"

  The room exhaled. Finch frowned, considering. Marsh snorted derisively but said nothing. Armitage’s face lit with relief. "Thermal lag in the clock! Peters, that’s excellent! Plausible. Testable. We’ll run parallel observations with a backup chronometer immediately. Finch, you see? This is how science *works*. The protective framework holds while we investigate the periphery. The program absorbs the shock and moves on, progressive."

  Relief washed over Elara too, warm against the lingering chill of Morcambe. It *was* plausible. It saved the core. She saw the logic, the necessity. Yet, as the meeting broke up and she gathered the papers, Marsh sidled up to her desk.

  "Thermal lag," he whispered, his breath smelling of stale tobacco. "Convenient, isn’t it? Invented for Morcambe, to save Morcambe. When was the last time we seriously questioned an auxiliary hypothesis *before* it was needed to plug a leak? Armitage calls it progressive absorption. I call it… patching the hull with wishful thinking." He glanced towards Armitage’s office door. "Funny how ‘novel’ and ‘ad hoc’ depend on who’s proposing it. Peters’ clock-lag is ‘ingenious auxiliary’. If Sterling’s lot up in Newcastle proposed it, Armitage would call it a ‘desperate kludge’." He gave a sharp, bitter chuckle and walked away, leaving Elara unsettled.

  Sterling. The name was a pebble in her shoe. Dr. Evelyn Sterling, formerly a bright star at Whitby, had left after a fundamental disagreement with Armitage over the interpretation of substratum viscosity data. She’d set up her own small group in Newcastle, pursuing a rival theory – rejecting the Vallance elastic layer entirely, positing instead complex interactions of lunar harmonics directly with deep ocean currents and coastal geometries. Armitage dismissed it as "kinematic flim-flam," lacking the deep causal mechanism Vallance provided. Sterling’s group published infrequently, their papers dense and challenging.

  A week later, a package arrived for Armitage. Elara recognized Sterling’s precise handwriting. Inside was a short note and a reprint of a paper from the *Proceedings of the Newcastle Philosophical Society*. The note was curt: *Thought you might find the Falmouth prediction relevant. – E.S.*

  Armitage scanned the paper, his brow furrowing deeper with each line. He thrust it at Elara. "Read this. Absurd."

  The paper detailed Sterling’s revised tidal dynamics. Elara waded through the complex equations. Sterling didn't just offer an alternative explanation for Morcambe; she made a specific, quantitative prediction. Her model suggested that under specific lunar declination and coastal resonance conditions – conditions that had prevailed precisely three weeks ago – the port of Falmouth should exhibit a unique, barely perceptible "double-peak" in its high tide curve, a secondary surge fifteen minutes after the primary crest. Not a smoothing, but a distinct secondary hump. Something utterly unexpected, something no tide table predicted, something Vallance certainly didn't account for. Sterling’s group claimed to have detected it in their own preliminary Falmouth data.

  "Preposterous!" Armitage exploded. "A ‘double-peak’? Sounds like observational error. They’re seeing noise and calling it signal. Trying to manufacture novelty to prop up a degenerating alternative. Desperate."

  But Elara’s mind raced. Falmouth. She’d processed the institute’s own gauge recordings from Falmouth for that period. Standard Admiralty drum recorders, meticulously calibrated. She’d filtered the data, smoothed it, looking for the standard Vallance curve. She remembered a slight irregularity near the high water mark, a tiny persistence of the rise she’d attributed to recorder vibration or wind chop. She’d noted it, dismissed it as insignificant noise. Standard procedure.

  Heart pounding, Elara slipped down to the basement archive. The air was cold and smelled of dust and old paper. She found the box for Falmouth, Week 23. Pulling the smoked paper trace from its protective sleeve, she carried it to the dim light of a whale-oil lamp. She held a magnifying glass over the inked line near the peak of high water. There. Not noise. Not vibration. A distinct, shallow plateau, a hesitation in the fall, lasting… she measured with trembling calipers… almost exactly fifteen minutes. A secondary surge. Exactly as Sterling predicted. Not invented to fit existing data, but predicting something no one had thought to look for.

  She sat back on the cold stone floor, the paper heavy in her hands. The brass chronometer in her mind ticked louder than ever. Armitage’s arguments echoed: *One anomaly proves nothing. No instant verdict. The program generates problems, it tells us where to look. Heuristic power.* Sterling’s prediction *felt* different. It wasn’t an auxiliary band-aid for a known wound; it was a searchlight revealing a hidden feature of the world. Yet, Sterling’s theory was young, untested across the vast range Vallance covered with such elegance. It felt… incomplete, somehow mechanistic where Vallance felt profoundly causal.

  The next day, Finch was back, armed with Sterling’s reprint. "See, Armitage? While you fiddle with clock mechanisms, Sterling’s group makes novel predictions! And confirmed! This," he waved the paper, "is progress. This is what the Admiralty funds. Falsification in action! The Vallance account is holed below the waterline. It’s time to reconsider the institute’s direction. Frankly, its existence."

  Armitage bristled. "One prediction, Finch? At one site? Novelty is cheap when your theory is vague enough to fit anything! Sterling’s ‘prediction’ – if it even was one and not a lucky coincidence – tells us nothing about the *why*, the deep transmission mechanism. Vallance gives us that. It gives us a research program! What’s Sterling’s next move? Where does her theory *lead*? Does it explain the Irish Sea anomalies? The Baltic peculiarities? Or is it just curve-fitting for Falmouth and Morcambe?" He turned to Elara. "You processed our Falmouth data. Did you see this… this alleged ‘double-peak’?"

  All eyes were on her. Marsh watched with cynical amusement. Peters looked worried. Finch leaned forward. Armitage’s gaze held a mixture of command and a desperate plea. She thought of the basement floor, the magnifying glass, the undeniable, tiny plateau on the trace. She thought of the Director’s faith in her, the intricate beauty of the Vallance equations that had first opened the world of science to her, the institute’s future.

  "The trace…" Elara began, her voice tight. "Our Falmouth trace from Week 23… shows some minor irregularities near high water. Consistent with recorder vibration during a period of high winds noted in the log. Within expected observational error margins." She didn’t look at Armitage. She felt the weight of the unsmoked paper trace, folded carefully in her pocket notebook, pressing against her ribs. "The Vallance prediction for the primary high water timing and height remains robust." She forced the words out. "Peters’ clock-lag hypothesis for Morcambe warrants full investigation."

  Armitage sagged with visible relief, then straightened, vindicated. "There, Finch! You see? Noise, not signal. Sterling grasps at straws. We," he gestured around the room, "we stick to the deep currents. We test the clock hypothesis. We move forward." He launched into plans for deploying backup chronometers at Morcambe.

  Finch looked unconvinced but temporarily thwarted. Marsh caught Elara’s eye as he left; his smirk was knowing, corrosive. *Generously applied to one side, harshly to the other.* Elara busied herself with tidying papers, the ink on her fingers suddenly feeling like tar.

  Later, alone at her desk as dusk stained the harbor windows crimson, Elara unfolded the Falmouth trace. The double-peak, clear under scrutiny, mocked her. Sterling’s prediction *had* been novel. It *had* been right. Had she just shielded a degenerating program? Or protected a still-vital one from premature execution? Armitage wasn’t a villain; he was defending a system that had produced real knowledge, a system that still generated questions, even if the answers now felt like increasingly elaborate buttresses. Sterling’s approach was bold, predictive, but where were its roots? Could it sustain a whole institute, a decade of research?

  Two telegrams lay on her desk. One, from Armitage, thanking her for her "steadfast clarity" and confirming her lead role on the Morcambe chronometer tests. The other, received just minutes ago, from Newcastle: *Falmouth data compelling. Prediction held. Position available. Seek deeper currents. – Sterling.*

  The tide outside was turning. Somewhere beneath the darkening water, forces pulled and resisted. Elara touched the smooth brass casing of her own pocket watch, its steady tick a counterpoint to the silent accusation of the folded trace. She picked up her pen, dipped it in ink, and hovered over a fresh sheet of paper, the lamplight pooling around her uncertain hand. The harbor lights began to flicker on, reflected in the black water like scattered, wavering stars.
