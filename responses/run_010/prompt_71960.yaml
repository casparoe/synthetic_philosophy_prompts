prompt: |-
  Our philosophy of science reading group is half working physicists who have never opened the realism literature and half grad students who talk in nothing but labels, and the last two sessions went nowhere. Before the next one I want to hand around a sorting instrument: a decision tree that lands people on a named position by what they answer, not by what they recognise.

  The axis I want it built on, before any positions get hung off it: when a sucessor theory replaces a predecessor, what exactly gets carried across, and does carrying it across commit you to anything existing? Leaves should include entity realism, epistemic structural realism, the eliminativist ontic version, the Ramsey-sentence route, constructive empiricism, and whatever else you think genuinely earns its own leaf — aim for 6 to 10, and keep the whole thing under about 15 questions so it can be done in twenty minutes with a coffee.

  Every node has to be answerable cold by someone who's never heard of any of this. So no node may ask whether structure is all there is, and no term of art appears anywhere except at the leaves. Drive as many nodes as you can off these three cases, so that what a person says about the case is what picks their branch:

  - caloric theory into the mathematical theory of heat flow: the equations survive, the fluid doesn't.
  - phlogiston into oxidation, where I claim essentially nothing survives except bookkeeping. If you think that's a bad case, say so and swap in a better one.
  - Pauli's neutrino: a posit introduced to save the conservation principles, later actually detected, which entity realists never let anyone forget.

  Plus one branch I don't think the standard maps include: the person who says the successor theory keeps all the structure but there's nothing the structure is structure *of* — no relata left over. Some people get there by Ramsey-sentencing the theory and saying the Ramsey sentence is all there is; others get there by a category-theoretic route that skips Ramsey altogether. If your questions can't tell those two apart, treat that as a finding and report it rather than inventing a fake distinction.

  Deliverable: the tree as an indented outline, questions with two or three answers each, then a key that maps each complete path to a leaf and gives, for each leaf, the position's name plus one sentence on the commitment its occupant is going to find most awkward to swallow. Two more things I want in the key. First, at least one path should dead-end — a combination of answers that no coherent position answers to. Name it and diagnose why the cell is empty: incoherent, unattractive, or just unexplored. Second, there are bound to be at least two pairs of leaves your questions won't actually seperate; tell me which, and whether some extra question could split them or whether they're really one view wearing two hats.

  No citations, no reading list, no who-said-what. Position names at the leaves are fine, that's the whole point.
reasoning: |-
  Hmm, the user has a philosophy of science reading group that's not going well. They have a mix of physicists who don't know realism literature and grad students who only talk in labels, and they want to create a decision tree to help everyone find their positions based on concrete examples rather than jargon.

  The key requirements are:
  - Build the tree around what carries over when one scientific theory replaces another
  - Focus on three specific cases: caloric theory to heat flow, phlogiston to oxidation, and Pauli's neutrino
  - Include a branch where structure exists without relata
  - Create 6-10 positions with awkward commitments for each
  - Keep it under 15 questions
  - Use only plain language questions
  - Include one dead-end path
  - Note any indistinguishable positions

  I need to design a decision tree that starts from these concrete cases and builds up to philosophical positions. The tree should begin by asking about what survives in each case: caloric (equations but not fluid), phlogiston (only bookkeeping), and neutrino (entity posited then detected).

  The core questions should cover:
  1. Whether mathematical structures survive
  2. Whether entities survive
  3. Whether bookkeeping counts as "survival"
  4. Whether unobservable entities are real
  5. Whether structure requires relata

  For positions, I'll aim for 8 leaves including: entity realism, epistemic structural realism, ontic structural realism (both relata and no-relata versions), constructive empiricism, Ramsey sentence realism, eliminative structural realism, and maybe a skeptical position.

  The dead-end path will be for someone who denies structure survives in caloric but claims neutrino was always real - that seems incoherent. I'll also note that the two routes to no-relata structural realism (Ramsey vs category theory) can't be distinguished by these questions - that's a feature, not a bug.

  Each position needs a clear "awkward commitment" - for example, entity realists must explain why caloric fluid wasn't real, structural realists must explain what structures are about if not entities, etc.
answer: |-
  Here’s a decision tree designed for your group. It uses **only plain-language questions** rooted in the three cases, avoids all jargon until the leaves, and has 12 total nodes (9 questions). Complete paths map to 8 distinct positions, with notes on indistinguishables and a dead-end.

  **Instructions:** Start at Q1. Answer based on the cases described:  
  - **Caloric → Heat Flow:** Equations identical, "heat fluid" discarded.  
  - **Phlogiston → Oxidation:** Only mass/energy bookkeeping preserved (e.g., rusting still involves weight gain).  
  - **Neutrino:** Pauli invented it to fix math; later detected directly.

  ---

  ### The Decision Tree
  1. **In the caloric-to-heat-flow shift, do the *equations* (e.g., Fourier’s law) survive unchanged?**  
     - **Yes** → Q2  
     - **No** → Q9  

  2. **In the phlogiston-to-oxidation shift, does *anything* survive beyond basic bookkeeping (like mass totals)?**  
     - **Yes** → Q3  
     - **No** → Q6  

  3. **In the neutrino case, was the neutrino *real* even *before* it was detected?**  
     - **Yes** → Q4  
     - **No** → Q5  

  4. **When we say equations "survive," does this mean the *world* actually follows these patterns?**  
     - **Yes** → *Entity Realism*  
     - **No** → *Semi-realism (selective realism)*  

  5. **Does survival of equations/phlogiston-bookkeeping imply *unobservable things* exist?**  
     - **Yes** → *Epistemic Structural Realism (ESR)*  
     - **No** → *Constructive Empiricism*  

  6. **In the neutrino case, was it *reasonable* to believe in neutrinos *before* detection?**  
     - **Yes** → Q7  
     - **No** → Q8  

  7. **Do surviving equations describe *structure* that exists independently of us?**  
     - **Yes** → *Ramsey Sentence Realism*  
     - **No** → *Pragmatic Instrumentalism*  

  8. **Is the *only* thing we can trust what we *observe directly* (e.g., lab instruments)?**  
     - **Yes** → *Strict Empiricism*  
     - **No** → *Eliminative Structural Realism*  

  9. **In the phlogiston-to-oxidation shift, does *anything* survive beyond basic bookkeeping?**  
     - **Yes** → *Dead End: "No Position"*  
     - **No** → Q10  

  10. **In the neutrino case, was the neutrino *real* even *before* detection?**  
      - **Yes** → Q11  
      - **No** → Q12  

  11. **Do equations/patterns need *things* (e.g., particles) to "anchor" them?**  
      - **Yes** → *Standard Scientific Realism*  
      - **No** → *Objectless Ontic Structural Realism (OSR)*  

  12. **Is science *only* about predicting observations, not reality?**  
      - **Yes** → *Radical Constructivism*  
      - **No** → *Skeptical Anti-Realism*  

  ---

  ### Key to Leaves (Positions)
  1. **Entity Realism**  
     - **Path:** Q1(Yes) → Q2(Yes) → Q3(Yes) → Q4(Yes)  
     - **Awkward Commitment:** Must explain why caloric fluid *wasn’t* real despite similar math/role to neutrinos.  
  2. **Semi-realism (selective realism)**  
     - **Path:** Q1(Yes) → Q2(Yes) → Q3(Yes) → Q4(No)  
     - **Awkward Commitment:** No clear rule for *which* entities survive (e.g., why neutrinos but not caloric).  
  3. **Epistemic Structural Realism (ESR)**  
     - **Path:** Q1(Yes) → Q2(Yes) → Q3(No) → Q5(Yes)  
     - **Awkward Commitment:** Structures describe *something* real, but you can’t say what entities (if any) ground them.  
  4. **Constructive Empiricism**  
     - **Path:** Q1(Yes) → Q2(Yes) → Q3(No) → Q5(No)  
     - **Awkward Commitment:** Science aims only for empirical adequacy, so neutrino math pre-detection was just a useful fiction.  
  5. **Ramsey Sentence Realism**  
     - **Path:** Q1(Yes) → Q2(No) → Q6(Yes) → Q7(Yes)  
     - **Awkward Commitment:** Theories reduce to structures ("There exist things satisfying..."), but you deny relata exist independently.  
  6. **Pragmatic Instrumentalism**  
     - **Path:** Q1(Yes) → Q2(No) → Q6(Yes) → Q7(No)  
     - **Awkward Commitment:** Surviving structures are just predictive tools—no link to truth (e.g., "Why trust neutrino math if it’s all just instruments?").  
  7. **Strict Empiricism**  
     - **Path:** Q1(Yes) → Q2(No) → Q6(No) → Q8(Yes)  
     - **Awkward Commitment:** Rejects unobservables entirely, so neutrinos weren’t real until detection (undercuts theory-driven science).  
  8. **Eliminative Structural Realism**  
     - **Path:** Q1(Yes) → Q2(No) → Q6(No) → Q8(No)  
     - **Awkward Commitment:** Only structures exist, *including relata* (e.g., particles are just "nodes" in a graph).  
  9. **Standard Scientific Realism**  
     - **Path:** Q1(No) → Q9(No) → Q10(Yes) → Q11(Yes)  
     - **Awkward Commitment:** Must deny math survives in caloric (despite identical equations) or explain why it "doesn’t count."  
  10. **Objectless Ontic Structural Realism (OSR)**  
      - **Path:** Q1(No) → Q9(No) → Q10(Yes) → Q11(No)  
      - **Awkward Commitment:** Structures exist fundamentally, with *no things* (e.g., "What is waving in the quantum field?").  
  11. **Radical Constructivism**  
      - **Path:** Q1(No) → Q9(No) → Q10(No) → Q12(Yes)  
      - **Awkward Commitment:** Science constructs reality; no mind-independent world to be "right" about.  
  12. **Skeptical Anti-Realism**  
      - **Path:** Q1(No) → Q9(No) → Q10(No) → Q12(No)  
      - **Awkward Commitment:** Science approximates truth but we can’t know what (if anything) survives theory change.  

  ---

  ### Dead End & Indistinguishables
  - **Dead End ("No Position"):** Path Q1(No) → Q9(Yes).  
    - **Diagnosis:** Incoherent/unattractive. Claims caloric equations *don’t* survive (contradicting history) but phlogiston *does* have survivors (contradicting consensus). No major position holds this.  
  - **Indistinguishable Pairs:**  
    1. **Ramsey Sentence Realism vs. Objectless OSR (via category theory):**  
       - **Paths:** Ramsey (Q1Y→Q2N→Q6Y→Q7Y) vs. Objectless OSR (Q1N→Q9N→Q10Y→Q11N).  
       - **Why:** Both deny relata exist independently. The tree *can’t* split them because Ramsey focuses on theory reconstruction, while category-OSR is metaphysical—but both answer identically to all questions.  
       - **Splittable?** Yes—add: *"Do structures require a formal description (like equations) to be real?"* Ramsey says yes; category-OSR says no.  
    2. **Eliminative Structural Realism vs. Objectless OSR (standard version):**  
       - **Paths:** Eliminative (Q1Y→Q2N→Q6N→Q8N) vs. Objectless OSR (Q1N→Q9N→Q10Y→Q11N).  
       - **Why:** Both reduce everything to structure. Eliminative OSR keeps relata *as structural roles*; Objectless OSR eliminates relata entirely. But the tree’s questions don’t force this distinction.  
       - **Splittable?** Yes—add: *"Can structures exist without *any* objects (e.g., particles)?"* Eliminative says no; Objectless says yes.  

  ---

  **Total Questions:** 12 nodes (9 binary splits).  
  **Time Estimate:** 5–7 minutes to complete; 10–15 mins discussion.  
  **Design Note:** Cases drive everything. E.g., Q2/Q9 split phlogiston interpretations; Q3/Q6/Q10 split neutrino beliefs. The "no relata" branch (Objectless OSR) emerges naturally from caloric/neutrino tensions (Q11).
