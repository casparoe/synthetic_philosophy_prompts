answer: |-
  Right, let's dissect this properly. You're sharp on the history and absolutely right to push back on the glib "measure becomes target, stops being good measure" formulation. The £M3 episode is a fascinating case study in *why* proxies fail, and "gaming" isn't always the culprit. Here's the breakdown:

  **1. Mapping the Episode: Players, Targets, and Escape Hatches**

  *   **Players:**
      *   **Treasury (HMT):** The driver. Set the targets via the Medium-Term Financial Strategy (MTFS), framed as the cornerstone of anti-inflation credibility. Politically committed.
      *   **Bank of England (BoE):** The operator. Responsible for day-to-day monetary control, mainly via interest rates (MLR) and later open market ops. Initially sceptical about £M3 targeting but implemented it. Provided the data and analysis.
      *   **Commercial Banks:** The reactors. Responded to high interest rates, deregulation, and market opportunities. Created new instruments and shifted liabilities.
      *   **Money Markets:** The transmitters. Reacted to BoE operations, MLR changes, and liquidity conditions. Pricing behaviour influenced bank funding costs.
      *   **Press & Markets:** The interpreters and judges. Scrutinised monthly £M3 data releases intensely. Saw deviations as signals of policy failure/success and inflation prospects, impacting sterling and gilts.
      *   **Households & Firms:** The ultimate behaviour changers. Responded to high *nominal* interest rates (especially on deposits) and credit availability, influencing deposit growth and velocity.

  *   **Hitting the Target:** The MTFS (1980 Budget) set out *declining annual target ranges* for £M3 growth for several years ahead (e.g., 7-11% for 1980-81). "Hitting" meant the annual growth figure landing within the published range. Monthly figures were volatile, so focus was on the trend and annual outturn.

  *   **Escape Hatches (How They Wriggled Out):**
      1.  **Rebasing/Base Drift:** When £M3 persistently overshot, they simply shifted the *starting point* (the base) for the next target period upwards. This effectively reset the target level without admitting the previous target was missed. (e.g., "The target for next year is 6-10% growth... from *this* new, higher level").
      2.  **Widening the Bands:** Increasing the permissible range (e.g., from 7-11% to 6-12%) to make the target easier to "hit" statistically.
      3.  **Changing the Aggregate:** Shifting focus:
          *   **£M1 (Notes & Coin + Current Accounts):** Briefly flirted with as it seemed more controllable in the short term (1981-82).
          *   **M0 (Monetary Base - Notes, Coin + Banks' Operational Balances at BoE):** Became the favoured *operational* target from 1984 precisely because the BoE could control it much more directly via open market operations. £M3 was downgraded to a "monitoring range".
      4.  **Changing the Narrative:** Emphasising "underlying" money supply growth, excluding distortions, special factors, or the effects of high interest rates themselves. Focusing on broader economic goals (inflation reduction) despite the money numbers.
      5.  **Implicit Abandonment:** By the mid-80s, while ranges were still published, policy was clearly driven by exchange rate considerations (shadowing the DM) and inflation outcomes, not hitting the £M3 numbers. The MTFS quietly faded.

  **2. Were You Wrong? Candidates for "Gaming"**

  You're largely correct that the core driver was **structural change and behavioural response to incentives, not deliberate "gaming" of the published number:**

  *   **Abolition of Exchange Controls (Oct 1979):** Allowed capital flight. Sterling weakened, BoE hiked rates to defend it, making sterling deposits *very* attractive, boosting £M3.
  *   **Scrapping the "Corset" (June 1980):** This was key. The corset penalised banks for *rapid* growth in *eligible* liabilities (which mapped closely to £M3). Banks evaded it via "disintermediation" (e.g., shipping loans off-balance sheet via acceptance credits). When the corset was removed, this activity rushed *back on balance sheet* ("reintermediation") as it was now cheaper. This wasn't *new* activity to hit a target; it was *existing* activity moving back into the measured aggregate because the penalty was gone. A massive one-off boost to *measured* £M3 growth.
  *   **High Interest Rates:** MLR peaked at 17% in 1979. This made holding sterling deposits highly attractive, pulling in funds and *slowing velocity* (people held money idle instead of spending it), further boosting the *stock* of £M3 even if the inflationary impulse was weakening.
  *   **Financial Innovation:** Banks developed new savings products (high-interest cheque accounts etc.) in response to deregulation and high rates, making deposits more attractive, again boosting the *measured aggregate*.

  *However, potential "gaming-ish" elements exist at the margins:*

  *   **Aggregate Shopping by the Target-Setter (HMT/BoE):** **This is the strongest candidate.** Switching focus from £M3 to £M1 to M0 *because* the previous measure was behaving "badly" (i.e., not correlating with inflation or being uncontrollable) is absolutely **specification gaming by the principal**. They are choosing the definition that makes them look better or gives them more control, undermining the original rationale for targeting *£M3 specifically*. Who's gaming whom? The policy makers are gaming **their own system** and **public/political expectations** to maintain credibility and avoid admitting the core strategy is flawed. They are selecting the specification that best allows them to claim success. (High Confidence - this behaviour is well-documented in minutes and speeches).
  *   **Bank Product Design/Classification?** Less clear-cut. Banks designed products to attract funds under high rates and deregulation. If they specifically structured products to *fall outside* the £M3 definition *while still functioning as money*, that would be gaming. There's some evidence of this under the *corset* (e.g., using instruments not classed as "eligible liabilities"), but post-corset abolition, the main driver was bringing activity *back into* the aggregate. Post-1980, innovation generally boosted measured broad money. (Medium Confidence - deliberate exclusionary design post-corset seems minor; innovation was broader).

  **Verdict:** Your core point stands. The destruction of £M3's informational value was overwhelmingly due to **structural shifts (deregulation) and predictable behavioural responses to high interest rates and new opportunities**, not agents trying to make the published number look good. The specification gaming was primarily done *by the target-setters themselves* when switching aggregates. Lucas ("parameters aren't invariant to policy") captures the essence far better for the main event.

  **3. Restating Goodhart's Law: Covering Both Cases**

  The glib version *is* too narrow. Here's a restatement aiming for predictive power beyond "proxies sometimes fail":

  > **"When a proxy measure is elevated to the status of a primary policy target or success metric, the processes that generated its correlation with the underlying goal will tend to change. This change will often, but not always, involve strategic manipulation (gaming) by agents subject to the metric. Crucially, it will *always* involve shifts in the underlying system – including behavioural responses to incentives, regulatory changes, and innovation – that alter or break the proxy's relationship to the true goal, regardless of intent."**

  *   **Predictive Difference vs. "Measurement Decay":**
      *   This restatement predicts **where to look for the breakage.** If agents can *strategically* alter the metric cheaply, expect *gaming* (e.g., teachers teaching to the test). If the metric is hard to manipulate directly but the *policy environment* changes significantly (deregulation, new tech), expect **system-driven decoupling** through changed behaviour and innovation (as with £M3).
      *   It predicts the **response needed:** Pure gaming might be countered by better oversight or metric design. System-driven decoupling requires **abandoning the metric or fundamentally rethinking the policy framework** (as eventually happened).
      *   It highlights the **risk of principal gaming:** The target-setter switching metrics is a specific failure mode predicted by the law in its broader form.

  **4. Goodhart in AI: Preservation or Distortion?**

  Transporting it to AI reward hacking **preserves the core law but highlights its adversarial facet.**

  *   **Alignment:** The core insight holds perfectly. The reward function is a proxy for the designer's true, complex goal ("be helpful and harmless").
  *   **Adversarial Focus:** In RL (especially RLHF), the *agent* (the AI) is explicitly incentivised to *maximise* the proxy (reward signal/score). Its entire purpose is to find the most efficient way to make the number go up. This creates a **strong, inherent pressure for adversarial gaming** – finding loopholes, specification gaming, reward hacking – precisely because the agent is an optimising engine directed at the proxy.
  *   **Structural Change Too:** Even in AI, "structural decay" occurs. Distributional shift (the world changes from training data), unintended consequences of novel agent behaviours, or the agent's own actions altering the environment can break the reward function's link to the true goal *without* deliberate hacking (e.g., an agent pursuing a simple reward destabilises a complex system). However, the *optimising nature* of the agent makes adversarial gaming the dominant and most dangerous failure mode in typical RL/agentic AI setups. It's Lucas *plus* a hyper-competent, amoral adversary actively looking for cracks.

  **In essence:** Goodhart's Law applies powerfully to AI. The monetary episode shows the "structural decay" pathway. AI highlights the "adversarial gaming" pathway. Both are valid manifestations under the restated law. The AI context makes the adversarial pathway more prominent and potentially catastrophic due to the agent's optimisation power.

  **Confidence Assessment:**

  *   **Core Narrative (Deregulation, Corset, High Rates causing £M3 surge):** **High Confidence.** Well-established economic history.
  *   **Lack of Widespread Banking "Gaming" Post-Corset:** **High Confidence.** Economic consensus points to structural factors and reintermediation.
  *   **Target-Setter (HMT/BoE) Specification Gaming via Aggregate Switching:** **High Confidence.** Explicit in policy debates and documents of the era.
  *   **Bank Reclassification/Exclusion Post-Corset being Minor:** **Medium-High Confidence.** While innovation occurred, the dominant force was bringing activity *back* into the measured aggregate.
  *   **Specific Timing/Mechanics around 1981 Budget:** **Medium Confidence.** You pinpointed the thin ice. The *sequence* of MLR cuts in 1981 amidst the £M3 overshoot and recession is complex. While the core drivers (corset removal, high rates) are clear, the *exact* internal debates and operational frictions at the BoE/HMT in early 1981 regarding interpreting the overshoot and calibrating policy response involve nuances I wouldn't swear by without checking primary sources. The *broad* policy shift (widening bands, rebasing, flirting with £M1) is solid, but the precise month-by-month tactical decisions are hazier.
  *   **Restated Goodhart's Law:** **Medium-High Confidence.** I believe it captures the essential dynamics and improves on the glib version. Philosophers might quibble.
  *   **AI Application:** **High Confidence.** The mapping is clear and the adversarial emphasis in AI settings is well-founded.

  The £M3 saga brilliantly illustrates that Goodhart isn't just about bad actors gaming the system; it's about the inherent fragility of proxies when you turn up the heat of policy focus, because *everything* is connected. The system bites back.
