answer: |-
  ### 1. **Working**  
  I analyzed your case node-by-node using the stipulated preferences and policies. Key findings:  
  - **Preference consistency**: The pairwise comparisons (e.g., (Y, −$1) ≻ (X, $0)) align with the $2 step-up value. However, the final outcomes form a cycle: (X, $0) ≺ (Y, −$1) ≺ (Z, −$2) ≺ (X, −$3) ≺ (X, $0). This confirms Dana’s all-things-considered preferences are intransitive and cyclic even when money is included.  
  - **Node outcomes**:  
    - **Myopic**: At Node 1, swaps to Y for $1 (prefers (Y, −$1) to (X, $0)). At Node 2, swaps to Z for $1 (prefers (Z, −$2) to (Y, −$1)). At Node 3, swaps to X for $1 (prefers (X, −$3) to (Z, −$2)). Ends with (X, −$3).  
    - **Sophisticated**: Reasons backward. At Node 3, will swap to X for $1 if holding Z (as (X, −$c−1) ≻ (Z, −$c) for any cost $c). At Node 2, if holding Y at −$1, swapping to Z (−$2) leads to Node 3 swap to X (−$3); not swapping keeps (Y, −$1). Since (Y, −$1) ≻ (X, −$3), does not swap. At Node 1, swapping to Y (−$1) leads to (Y, −$1); not swapping keeps (X, $0). Since (Y, −$1) ≻ (X, $0), swaps. Ends with (Y, −$1).  
    - **Resolute**: Adopts a plan at start. Possible plans: no swap (end at (X, $0)), swap only at Node 1 (end at (Y, −$1)), swap at Nodes 1–2 (end at (Z, −$2)), or all swaps (end at (X, −$3)). Due to cyclic preferences, no outcome is strictly best: e.g., (Y, −$1) ≻ (X, $0) but (Z, −$2) ≻ (Y, −$1). A plausible plan is swapping only at Node 1 to get (Y, −$1), as it beats the default (X, $0) and avoids the cycle’s worst outcome.  
  - **Ambiguities**: None in policies or preferences. The $2 step-up limit is sufficient for all comparisons. Resolute policy requires specifying Dana’s chosen plan; I assumed she picks a plan yielding an outcome she strictly prefers over (X, $0).  

  ---

  ### 2. **The Question**  
  **Dana’s Bike Choice and Money Pumps**  
  Dana is choosing between three bikes: X, Y, Z. Her all-things-considered bike preferences are cyclical: Y ≻ X, Z ≻ Y, X ≻ Z. Money matters separately and monotonically: less spent is better, all else equal. For each step up the cycle (X to Y, Y to Z, Z to X), Dana would pay up to $2 extra. Specifically:  
  - (Y, −$1) ≻ (X, $0)  
  - (Z, −$1) ≻ (Y, $0)  
  - (X, −$1) ≻ (Z, $0)  

  Dana starts with bike X at $0 cost. She faces three sequential offers:  
  - **Node 1**: Trade her current bike for Y, paying $1 extra.  
  - **Node 2**: Trade her current bike for Z, paying $1 extra.  
  - **Node 3**: Trade her current bike for X, paying $1 extra.  

  **Policies**:  
  - **Myopic**: Compares only the immediate choice (e.g., at Node 1, decides based on current bike vs. Y plus $1 cost).  
  - **Sophisticated**: Reasons backward through future choices, anticipating her own ex-post preferences.  
  - **Resolute**: Commits at the start to a full plan (which swaps to accept/reject), then follows it regardless of later preferences.  

  **Answer all parts. Total marks: 25. Time: 60 minutes.**  
  **(a)** For each policy, state Dana’s final outcome (bike and net money) and provide node-by-node reasoning. For resolute, specify which plan Dana adopts and why. (9 marks)  
  **(b)** A student argues: “Each swap buys Dana a step up she values at $2 for only $1, so she nets $1 every time and can’t lose overall.” Is this correct? Explain precisely where it goes wrong (or not) using the case details. (5 marks)  
  **(c)** Show that Dana’s preferences over the outcomes reachable from the start (i.e., (X, $0), (Y, −$1), (Z, −$2), and (X, −$3)) are cyclical. Explain how this complicates the resolute approach to avoiding money pumps. (5 marks)  
  **(d)** Sophisticated Dana ends with (Y, −$1), not the full pump. Does this show the money-pump argument targets myopia, not intransitivity? State the strongest objection to this view. (6 marks)  

  ---

  ### 3. **Model Answer**  
  **(a)**  
  - **Myopic**: Dana swaps at all nodes. At Node 1, she compares (X, $0) and (Y, −$1) and prefers (Y, −$1). At Node 2, holding (Y, −$1), she compares it to (Z, −$2); since (Z, −$1) ≻ (Y, $0) and money matters, (Z, −$2) ≻ (Y, −$1), so she swaps. At Node 3, holding (Z, −$2), she compares it to (X, −$3); since (X, −$1) ≻ (Z, $0), (X, −$3) ≻ (Z, −$2), so she swaps. Ends with (X, −$3).  
  - **Sophisticated**: Dana reasons backward. At Node 3, if holding Z at cost $c, she will swap to X for $1 more (as (X, −$c−1) ≻ (Z, −$c)). At Node 2, if she holds Y at −$1, swapping to Z (−$2) leads to Node 3, where she swaps to X (−$3). Not swapping keeps (Y, −$1). Since (Y, −$1) ≻ (X, −$3), she does not swap. At Node 1, swapping to Y (−$1) leads to (Y, −$1) (as she won’t swap further). Not swapping keeps (X, $0). Since (Y, −$1) ≻ (X, $0), she swaps. Ends with (Y, −$1).  
  - **Resolute**: Dana commits to a plan at the start. Possible outcomes: (X, $0) from no swaps, (Y, −$1) from swapping only at Node 1, (Z, −$2) from swapping at Nodes 1–2, or (X, −$3) from all swaps. Since (Y, −$1) ≻ (X, $0), (Z, −$2) ≻ (Y, −$1), (X, −$3) ≻ (Z, −$2), and (X, $0) ≻ (X, −$3), these outcomes form a cycle. Dana might adopt the plan to swap only at Node 1, ending with (Y, −$1), as it is strictly preferred to the default (X, $0) and avoids the greater loss of (X, −$3).  

  **(b)** The argument is incorrect for the myopic and resolute cases but partially correct for sophisticated. Each swap *individually* seems beneficial: e.g., at Node 1, (Y, −$1) is preferred to (X, $0), equivalent to a $1 net gain in value. However, myopic Dana completes the cycle, ending with (X, −$3) instead of the initial (X, $0). Since she prefers (X, $0) to (X, −$3), she loses $3 overall despite each step seeming profitable. The error is assuming local gains imply global gains, ignoring that cycling back to the same bike with less money creates a net loss. Sophisticated Dana avoids this by foreseeing and halting the cycle, but she still pays $1 (ending with (Y, −$1) ≻ (X, $0)), so she "nets" a gain in value but not in money.  

  **(c)** The reachable outcomes are:  
  - A: (X, $0)  
  - B: (Y, −$1)  
  - C: (Z, −$2)  
  - D: (X, −$3)  
  Dana’s preferences: B ≻ A (as (Y, −$1) ≻ (X, $0)), C ≻ B (as (Z, −$1) ≻ (Y, $0) and money monotonicity imply (Z, −$2) ≻ (Y, −$1)), D ≻ C (as (X, −$1) ≻ (Z, $0) implies (X, −$3) ≻ (Z, −$2)), and A ≻ D (as (X, $0) ≻ (X, −$3)). Thus A ≺ B ≺ C ≺ D ≺ A, a cycle. This complicates resolute choice: Dana cannot pick a uniquely best outcome, as each is dispreferred to another (e.g., choosing B (Y, −$1) is beaten by C (Z, −$2)). Resolute avoids the full money pump but cannot achieve a stable "best" plan due to the cycle.  

  **(d)** No, sophisticated Dana’s avoidance of the full pump does not show the money-pump argument targets myopia. The strongest objection is that sophisticated Dana still incurs a *partial* pump: she pays $1 to end with (Y, −$1), while the initial (X, $0) was available for free. Though she prefers (Y, −$1) to (X, $0), this is only because her preferences are intransitive—if transitive, she would not pay to cycle away from a bike she could have kept. The money-pump argument targets intransitivity as the root flaw: it allows exploitation (here, a $1 loss), regardless of policy. Sophistication merely limits losses; it does not eliminate them, as a rational agent should.  

  ---

  ### 4. **Marking Scheme**  
  **Total: 25 marks**  
  **(a) Outcomes and reasoning (9 marks)**  
  - Myopic: Correct outcome (X, −$3) with node-by-node swaps (3 marks). Reasoning must reference given preferences at each node (e.g., at Node 3, (X, −$3) ≻ (Z, −$2)).  
  - Sophisticated: Correct outcome (Y, −$1) with backward induction (3 marks). Must show: Node 3 choice, Node 2 comparison of (Y, −$1) vs. path to (X, −$3), Node 1 preference for (Y, −$1) over (X, $0).  
  - Resolute: Correct plan (e.g., swap only at Node 1) and outcome (Y, −$1), with explanation that it beats default despite cycle (3 marks). Must identify the cycle as complicating "best" plan choice.  
  - *A/B separation*: A answers get all outcomes right and tie reasoning to preferences; B answers miss one outcome or give incomplete reasoning (e.g., omit node details).  

  **(b) Diagnosis of student argument (5 marks)**  
  - Correctly identifies the argument as wrong for myopic/resolute (2 marks), partially right for sophisticated (1 mark).  
  - Explains error: Local gains ≠ global gains; cycling back creates net loss (2 marks). Must contrast myopic’s (X, −$3) with initial (X, $0).  
  - *A/B separation*: A answers explicitly link to outcomes (e.g., "myopic ends poorer"); B answers state "it’s wrong" without case-based explanation.  

  **(c) Outcome cycle and resolute complication (5 marks)**  
  - Lists outcomes and shows cycle: B ≻ A, C ≻ B, D ≻ C, A ≻ D (3 marks). Must reference given preferences (e.g., (Z, −$2) ≻ (Y, −$1) from (Z, −$1) ≻ (Y, $0)).  
  - Explains complication: Resolute cannot pick a dominant plan; e.g., (Y, −$1) is beaten by (Z, −$2) (2 marks).  
  - *A/B separation*: A answers prove the cycle rigorously; B answers state "outcomes cycle" without showing preferences.  

  **(d) Sophistication vs. intransitivity (6 marks)**  
  - Rejects the view (1 mark), notes partial pump (1 mark).  
  - Objects: Sophistication incurs $1 loss due to intransitivity (2 marks). Strongest objection: Loss is exploitable; transitivity would prevent any payment to cycle (2 marks).  
  - *A/B separation*: A answers argue why intransitivity enables loss; B answers claim "sophistication solves it" without addressing the partial loss.  

  ---

  ### 5. **Where Students Go Wrong**  
  1. **Misapplying preferences in nodes (a)**: Assume (Z, −$2) ≻ (Y, −$1) without deriving from (Z, −$1) ≻ (Y, $0). Reveals memorizing "cycles cause pumps" without using numbers.  
  2. **Ignoring backward induction (a)**: For sophisticated, claim Dana "stops after Node 1" without backward reasoning. Shows rote-learning "sophistication avoids pumps."  
  3. **Overlooking outcome cycle (c)**: List outcomes but miss that (X, $0) ≻ (X, −$3) completes the cycle. Confuses bike cycle with outcome cycle.  
  4. **Equating sophistication with rationality (d)**: Argue sophisticated Dana "wins" by gaining (Y, −$1), ignoring the $1 loss. Exposes memorizing "sophistication solves pumps" without analyzing costs.  
  5. **Misdiagnosing student argument (b)**: Accept "net gain" due to missing myopic’s net loss. Fails to connect local/global inconsistency.
