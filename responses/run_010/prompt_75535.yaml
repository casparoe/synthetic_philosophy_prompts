prompt: |-
  I run a small decision-theory reading group and I'm trying to build a case that will actually give us something to argue about, rather than another round of everyone summarizing Hofstadter. So: construct me a thought experiment to spec.

  For reference, the original Platonia dilemma, roughly as Hofstadter set it up in Metamagical Themas: an eccentric trillionaire gathers 20 people and tells them that if exactly one of them sends a telegram by noon the next day, that person gets a billion dollars; if none arrive or more than one arrives, nobody gets anything; colluding is forbidden. The telegram costs the sender nothing. His superrational answer is that each of the 20 should send with probability 1/20. He also ran a live variant, the Luring Lottery, in a 1983 Scientific American column, where readers could enter as many times as they liked by writing a number on a postcard and the million-dollar prize was divided by the total number of entries received.

  The twist I want you to build in: the organizer hands each of the twenty a sealed envelope containing a number, and the rules state publicly that the envelopes contain the numbers 1 through 20, one each, in random order, and that each person sees only their own. Everything else stays Hofstadter-shaped — one prize, exactly one reply wins it, no contact between participants allowed, sending costs nothing.

  Hard constraints:
  - Realistic. A magazine or a podcast running a contest, ordinary postal mail or email, ordinary humans. No perfect predictors, no mind copies or simulations, no many-worlds, no telepathy, and no stipulating that people somehow know each other's choices. Every probability in your answer has to be derived from facts you actually put in the scenario.
  - The scenario itself is 200 words max, and the rules have to be stated precisely enough that the payoff structure is unambiguous.
  - Don't quote Hofstadter anywhere; paraphrase.

  Then walk through it and show me the design works:
  1. The dominance check. Write out an individual player's payoffs and show that mailing a card is weakly dominant for a straightforward expected-value maximizer, so the collective outcome is a disaster. Then tell me whether "all twenty mail a card" is a prediction of causal decision theory or merely something it permits, and why that distinction decides whether this case is a counterexample to anything at all.
  2. The superrational analysis. The obvious rule is "mail your card if and only if your number is 1." Show it delivers exactly one card. But then confront the wrinkle: "mail iff your number is k" works equally well ex ante for every k, so say what selects k=1, and whether superrationality can supply that on its own or has to borrow it from somewhere — focal points, salience, whatever you think.
  3. The evidential decision theory check. Does EDT land with superrationality here or does it peel off? Give a definite verdict with reasons, not a hedge.
  4. Two removal tests, with actual arithmetic. (a) Suppose the numbers are drawn with replacement instead of as a permutation: compute the probability that exactly one card arrives under the threshold rule, compare it to the probability under Hofstadter's 1/20 mixed strategy, and tell me whether those two are secretly the same move. (b) Suppose every person who mails a card also gets a $5 voucher: show what each of the three theories now recommends and say whether superrationality has anything left to contribute.
  5. Name the load-bearing feature in one sentence, and say whether what's doing the work is the exclusivity of the private signals, the indifference of the players who aren't selected, or the common knowledge.
  6. The honest verdict on my real question: is this a case where superrationality is a genuinely distinct kind of reasoning, or has a correlation device done all the work so that plain game theory — correlated equilibrium, convention, focal point — redescribes the same outcome with nothing left over? Pick a side and defend it.
  7. The strongest attack a defender of causal decision theory has on your case, and whether it lands.

  The point of the exercise, so you know what counts as cheating: I want to find out whether superrationality earns its keep in a setting where correlation is available without any communication. A scenario that just asserts its own verdicts — where the theories get labeled instead of computed — fails, and so does one where I could get the same result by adding a cheap predictor or letting the players talk.
reasoning: |-
  We are designing a thought experiment for a decision theory reading group. The goal is to have a scenario that can spark debate, especially around the concept of superrationality.

  The scenario is a variant of Hofstadter's Platonia dilemma, but with a twist: each of the 20 participants is given a sealed envelope containing a unique number from 1 to 20 (randomly permuted). Each person sees only their own number. The rules: if exactly one person sends a telegram (or email, etc.) by the deadline, that person wins a billion dollars. If no one sends or more than one sends, no one wins. Sending costs nothing. Collusion is forbidden (no communication).

  We now walk through the design:

  1. **Dominance Check**:
     - Consider an individual player. Let their number be `x`. They don't know the other numbers. They have two actions: send (S) or not send (N).
     - Payoff structure:
       - If they send, they win only if no one else sends. Otherwise, they get 0 (if at least one other sends) or nothing if they don't send and someone else does (but they get 0 in that case too).
       - More precisely:
         - If they send and no one else sends: win $1B.
         - If they send and at least one other sends: $0.
         - If they don't send and exactly one other person sends: $0 (because that other wins).
         - If they don't send and either zero or more than one other sends: $0.

     However, note that the player does not know the numbers of others. Without any information about how others will act, we must consider the possible strategies of others.

     But note: the numbers are private and randomly assigned. Without any coordination, it is difficult to know what others will do. However, let's consider a straightforward expected-value maximizer.

     Assume that each other player independently sends with some probability `p` (which might depend on their own number, but without a coordination device, we cannot assume they are using a threshold). However, without a common strategy, it is not clear.

     But note: if the player assumes that others are playing arbitrarily, then:
       - If the player does not send, they get 0 regardless of what others do? Not exactly: if they don't send and exactly one other sends, then that one wins and the player gets 0. But also if no one sends, they get 0. If multiple send, they get 0. So without sending, they get 0 for sure.

       - If they send, then they get $1B only if no one else sends. Otherwise, they get 0.

     Therefore, the expected payoff from sending is: $1B * P(no one else sends) + 0 * P(at least one other sends) = $1B * P(no one else sends).

     The expected payoff from not sending is 0.

     Since P(no one else sends) is at least 0 (and in fact, without any information, we cannot rule out that it might be positive), then sending is weakly dominant because it gives at least as much as not sending (and strictly more if there is any chance that no one else sends).

     However, if every player reasons this way, then everyone sends, and the outcome is that 20 cards are sent and no one wins.

     Now, is "all twenty mail a card" a prediction of causal decision theory (CDT) or merely something it permits?

     CDT evaluates actions based on the causal consequences. In this case, each player, by sending, causes a situation where if no one else sends, they win. They do not cause the others to send (because there is no causal link). So CDT would recommend sending because it is weakly dominant. Therefore, CDT predicts that everyone will send and the outcome is a disaster.

     The distinction: CDT does not merely permit sending, it actively recommends it as the dominant strategy. This makes the case a counterexample to the idea that CDT always leads to the best outcome.

  2. **Superrational analysis**:
     The obvious rule: "mail your card if and only if your number is 1." Then, exactly the person with number 1 sends, and no one else does (because they see numbers >1). So exactly one card is sent, and that person wins.

     However, why k=1? Why not k=20? Or k=7? Ex ante, every k is symmetric. So the rule "mail iff your number is k" works for any fixed k. But which k should be chosen?

     Superrationality, by itself, does not select a particular k. It relies on the idea that all players are using the same reasoning and will choose the same k. But without a focal point, how do they agree on k?

     In this setup, the numbers are assigned randomly, so there is no inherent reason to choose k=1 over k=20. However, the concept of "the smallest number" is a natural focal point. In human psychology, 1 is the smallest and often the most salient. Therefore, superrationality might rely on a focal point (which comes from outside the pure reasoning) to select k=1.

     Alternatively, one might argue that superrationality requires symmetry breaking, and the smallest number is a natural convention. But note: the superrational reasoning itself does not invent the focal point; it borrows it from common knowledge of salience.

  3. **Evidential Decision Theory (EDT) check**:
     EDT evaluates actions based on the evidence they provide. In this case, the agent conditions on the action they take and asks: given that I take this action, what is the probability that I win?

     Consider a player with number `x`. They consider sending (S) or not (N).

     - If they send (S), what is the probability that they win? They win only if no one else sends. But note: if they send, that might be evidence that others are also sending? Actually, in EDT, the agent conditions on their own action but does not assume that their action causes others to act. However, in this scenario, the actions of others are independent of the agent's action? Not exactly: because the agent's action is determined by their number, and the numbers are randomly permuted.

     But note: the agent's number is fixed. So let's condition on the agent having number `x`. Then:

     - If the agent sends, they are following the threshold rule? But we are evaluating EDT without assuming a particular strategy. We must consider what the agent believes about the others.

     Without a common strategy, EDT is problematic. But let's assume that the agent believes that all other players are following the same strategy as they are? That is, the agent is considering a universal rule? Or perhaps the agent has no idea.

     However, in the superrational solution, we are assuming that everyone is following the same rule. So for the threshold rule "mail iff your number is k", if the agent is considering sending, then they must have a number equal to k. Then, the agent conditions on having number k. But then, what does that tell about others?

     Since the numbers are randomly permuted, if the agent has k, then the other 19 numbers are a random permutation of the remaining 19 numbers. Therefore, the agent knows that one of the others has a number less than k? Not necessarily: if k=1, then the agent has the smallest number, so all others have numbers from 2 to 20. Then, if the rule is to send only if number=1, then the agent (having 1) sends and knows that no one else will send (because they have numbers >1). So the probability of winning given that they send is 1.

     But wait: the agent must also consider the possibility that others are not following the rule. However, in the superrational framework, we assume that all are identical and follow the same reasoning.

     Alternatively, without assuming the rule, let's try a naive EDT: the agent has no idea what others are doing. Then:

     - If the agent sends, they win only if no one else sends. But what is P(no one else sends | I send)? Without a causal model, EDT might use the conditional probability. But note: the agent's sending does not cause others to send, but it might be correlated with others sending? How?

     Since the numbers are assigned randomly and independently of the agent's action (because the agent's action is determined after seeing the number, and the number is fixed), the agent's action is independent of the others' numbers? Not exactly: the agent's action is a function of their number. But the numbers are independent.

     Actually, the numbers are fixed: the agent's number is `x`, and the others have the remaining numbers. The agent's decision to send is determined solely by `x`. Therefore, conditioning on the agent sending tells us nothing about the others' numbers? Actually, it does: it tells us that the agent's number is such that they decided to send. But without a common strategy, we cannot say.

     This is messy. Let's assume that the agent believes that others are using the same threshold rule. Then:

     - If the agent sends, it must be that `x = k`. Then, the agent knows that they are the only one with number k, and that others with numbers not equal to k will not send. Therefore, P(no one else sends | I send) = 1. So the expected utility of sending is $1B.

     - If the agent does not send, then they have `x != k`. Then, they know that the person with number k will send (if that person exists and is following the rule). But they also know that there might be no one with number k? But k is fixed and they know k is in the set. Actually, they know the numbers are 1..20, so someone has k. Therefore, if they do not send, then they know that exactly one person (the one with k) will send, so they get 0.

     Therefore, under the assumption that everyone is following the threshold rule, EDT would recommend sending only if the agent's number is k (because then they win for sure), and not sending otherwise (because then they don't win but also avoid the risk of multiple sending? Actually, they don't cause multiple sending by not sending; they just let the one with k win).

     But note: if the agent does not send and they have a number not equal to k, they get 0. If they send and they have a number not equal to k, then they cause a disaster? Actually, if they send when they shouldn't, then if they are the only one who deviates, then two people send (the one with k and this agent) and no one wins. But in the conditional, if they send and they are not k, then they don't win because either someone else (the one with k) is sending, so at least two send.

     Without the threshold rule, if the agent believes that others are going to send independently with some probability, then EDT might lead to a different calculation. However, the superrational solution assumes that all are following the same rule.

     Therefore, if we assume that the threshold rule is in place, EDT would also recommend following it. So EDT lands with superrationality in this case.

     However, note: without the threshold rule, EDT might not lead to the same conclusion. But in the context of superrationality, we are assuming that all players are identical and will follow the same rule. Therefore, under that assumption, EDT and superrationality align.

  4. **Removal tests**:

     (a) Suppose the numbers are drawn with replacement (so independently) from 1 to 20 (so duplicates are possible). Now, the threshold rule "mail iff your number is k" might not work because there could be multiple people with the same number.

     - Under the threshold rule: if there are `m` people who have number `k`, then if `m>=1`, then all `m` send, so we get `m` senders. We want exactly one sender. This happens only if `m=1`. The probability that a particular person wins under the threshold rule (if they have number k) is the probability that they have k and no one else has k. But note: if they have k, then the probability that a given other does not have k is 19/20. So the probability that no one else has k is (19/20)^19. Therefore, the probability that exactly one card is sent (and that one is this person) is (1/20) * (19/20)^19 * (number of people? Actually, we are considering the event that a particular k is chosen and then exactly one person has k). But note: the threshold rule is fixed on k, but k is arbitrary. The overall probability that exactly one card is sent is the probability that there is exactly one person in the entire group with number k (for the fixed k). But note: the numbers are independent and k is fixed. The number of people with number k is a binomial(20,1/20) random variable. So P(exactly one person has k) = C(20,1)*(1/20)*(19/20)^19 ≈ 20*(1/20)*(19/20)^19 = (19/20)^19 ≈ 0.377.

     However, note: we are using the threshold rule on a fixed k. But what if we choose k arbitrarily? The event that exactly one card is sent is the event that exactly one person has the number k. But note: if there are multiple k's with exactly one person, we don't care because we are using only one k. So we are only counting the event for the fixed k.

     Alternatively, we might consider a different rule? But the rule is fixed to one k.

     Now, compare to Hofstadter's mixed strategy: each person sends independently with probability p. We want to choose p to maximize the probability of exactly one sending. The probability of exactly one sending is C(20,1)*p*(1-p)^19. The optimal p is 1/20, and then the probability is C(20,1)*(1/20)*(19/20)^19 = (19/20)^19 ≈ 0.377.

     So they are the same! In fact, the threshold rule in the independent-draw case is equivalent to the mixed strategy with p=1/20? Not exactly: in the threshold rule, each person sends only if they have the number k. The probability that a given person sends is 1/20 (since they have a 1/20 chance of having k). And the sendings are independent? Not independent: if one person has k, then others cannot have that same k? Actually, no: because the draws are with replacement, so the events are independent. Therefore, the threshold rule in the independent-draw case is exactly a mixed strategy where each person sends with probability 1/20, independently.

     Therefore, in the independent-draw case, the threshold rule is the same as Hofstadter's mixed strategy.

     (b) Suppose every person who mails a card also gets a $5 voucher (regardless of whether they win the billion). Now, the payoff structure changes: sending now gives at least $5, and if you are the only sender, you get $1B+5.

     - CDT: The dominance argument is strengthened. Even if you think others might send, you get $5 for sure by sending. Not sending gets 0. So sending is strictly dominant. Therefore, CDT predicts everyone sends and gets $5, and no one wins the billion.

     - Superrationality: The threshold rule still works: only the person with number 1 (or k) sends and gets $1B+5, and the rest don't send and get 0. But now, if a person with a number not equal to 1 sends, they get $5 (and cause the prize to be lost). So the threshold rule still delivers the billion to the one with 1. However, note: if someone else sends, they get $5 and you (the one with 1) get $5 too (and no billion). But the threshold rule is still an equilibrium? Only if everyone follows it. If one person deviates (by sending when they shouldn't), then they get $5 and the person with 1 also sends (so two send) and both get $5 and no billion. The deviator gets $5 instead of 0, so they have an incentive to send even if they are not 1. Therefore, the threshold rule is not a Nash equilibrium? 

       Actually, in the threshold rule, if the others are following the rule, then a player with number not equal to k gets 0 by not sending. If they send, they get $5 (and cause the prize to be lost, so they don't get the billion). So they get $5>0. Therefore, they have a strict incentive to send. Hence, the threshold rule is not an equilibrium.

       So superrationality might break down? But note: superrationality is not about equilibrium but about a shared mode of reasoning. However, if the players are rational and expect others to follow the threshold rule, then a player with a number not equal to k would want to deviate. Therefore, the threshold rule is not stable.

       What would superrationality recommend? It might still recommend the threshold rule, but now it is vulnerable to defection. Alternatively, it might recommend a different rule? For example, "only the person with the smallest number sends" but then again, why not send if you get $5 anyway? 

       So in this case, superrationality might not have a clear recommendation. The threshold rule still would work if everyone follows it, but it is not incentive compatible.

     - EDT: Consider a player. If they send, they get $5 plus the billion only if they are the only sender. But if they send, what is the probability that they are the only sender? Without a common strategy, it's hard. But if we assume the threshold rule is in place, then if the player has k, they send and believe that no one else sends (so they get $1B+5). If they don't have k, then if they send, they get $5 and cause the prize to be lost (because the person with k also sends) so they get only $5. But without the threshold rule, the probability that no one else sends might be very low. Therefore, the expected utility of sending might be $5 + $1B * P(no one else sends | I send). The expected utility of not sending is 0. If P(no one else sends | I send) is very small, then the $5 might dominate. Therefore, EDT might recommend sending regardless of the number? 

       However, note: if the agent believes that others are following the threshold rule, then:
          - If they have k, then sending gives $1B+5 and not sending gives 0? (But they are supposed to have k, so they send and win). 
          - If they don't have k, then sending gives $5 (because they know the person with k will send, so they are not alone) and not sending gives 0. So they would send to get $5.

       Therefore, even under the threshold rule, EDT would recommend that everyone sends? Because even if you are not k, you get $5 by sending. So the threshold rule is not followed.

     Thus, with the $5 voucher, the threshold rule breaks down. Superrationality does not have an obvious solution. CDT clearly leads to everyone sending. EDT might also lead to everyone sending because the $5 is guaranteed and the chance of winning the billion is very low without coordination.

  5. **Load-bearing feature**: 
     The exclusivity of the private signals (each has a unique number) is the key. It allows a deterministic coordination without communication. Without uniqueness, the threshold rule does not work (as in the independent-draw case, which requires a mixed strategy). The common knowledge of the permutation and the rules allows the focal point to work.

  6. **Honest verdict**:
     In this case, superrationality is not a genuinely distinct kind of reasoning. The threshold rule is essentially a correlated equilibrium: the numbers act as a correlation device. In game theory, a correlated equilibrium uses a shared random signal to coordinate actions. Here, the random permutation of numbers is the shared random signal, and the rule "send iff your number is 1" is the correlated strategy. This yields the desired outcome. Therefore, plain game theory (correlated equilibrium) can explain the outcome without invoking superrationality.

     However, note: in the original Platonia dilemma (without the numbers), Hofstadter's superrational solution was a mixed strategy that required symmetry. In that case, there was no correlation device. The introduction of the numbers provides a correlation device. Therefore, in this modified scenario, the work is done by the correlation device, and superrationality is not necessary.

     But wait: superrationality might be the reasoning that leads to the selection of the correlated equilibrium? However, the concept of correlated equilibrium is standard in game theory and does not require superrationality.

     Therefore, we conclude that the correlation device does all the work, and superrationality does not earn its keep in this setting.

  7. **Strongest attack from a defender of CDT**:
     The attack: The scenario assumes that all players are committed to following the threshold rule. But in reality, a CDT player would not follow the rule if they expect others to follow it. Why? Consider a player with a number not equal to 1. If they expect that only the player with 1 will send, then by sending, they would get $0 (because two senders) and not sending gets 0. So it's the same. But wait: in the original without the voucher, not sending gets 0 and sending also gets 0 (because they are not the only sender). So they are indifferent. Therefore, CDT permits not sending. But then, if they are indifferent, they might as well not send. So the threshold rule is compatible with CDT? 

