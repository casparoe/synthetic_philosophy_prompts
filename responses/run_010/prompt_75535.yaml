     But wait: in the dominance check, we argued that sending is weakly dominant. However, in the presence of the threshold rule, the weak dominance does not hold because the condition "no one else sends" is impossible for a player with a number not equal to 1 (if they believe the rule is being followed). So in the context of the threshold rule, the player with a number not equal to 1 is indifferent.

     Therefore, the defender of CDT can argue that CDT does not necessarily lead to disaster. It can also lead to the cooperative outcome if players coordinate on the threshold rule. And the threshold rule is a Nash equilibrium (in fact, a correlated equilibrium) that is CDT-compatible.

     Does this attack land? Partially. It shows that the disaster outcome is not the only CDT outcome. The threshold rule is also a CDT outcome. Therefore, the scenario does not force CDT into the disaster. However, without the coordination on the threshold rule, CDT players might still send because of the initial weak dominance argument (if they are not sure what others will do). Therefore, the scenario can still be used to argue that without a coordination device, CDT leads to disaster, but with a coordination device, it can avoid it.

     But note: the coordination device is the key. And that is provided by the envelopes. Therefore, the case does not show that superrationality is necessary; it shows that a correlation device is sufficient.

     So the attack lands in the sense that it shows that the scenario does not force CDT into the disaster, but it does not save CDT from the original Platonia dilemma (without the envelopes) where there is no correlation device.

     However, in the original Platonia dilemma, CDT would lead to everyone sending because of weak dominance. In this variant, the envelopes provide a way out. But that way out is within standard game theory.

     Therefore, the attack lands in showing that the modified scenario does not uniquely showcase superrationality, because standard game theory (with correlated equilibrium) can achieve the same outcome with CDT players.

  Conclusion: The thought experiment is built as requested, but it does not show that superrationality is necessary. It shows that a correlation device can help achieve coordination, which is a standard game-theoretic solution.
answer: |-
  ### Thought Experiment: The Numbered Envelopes Dilemma

  A magazine runs a contest: 20 participants each receive a sealed envelope containing a unique integer from 1 to 20 (randomly permuted; each sees only their own). To win the billion-dollar prize, exactly one person must mail a reply. If zero or multiple reply, no one wins. Mailing is free, and no communication is allowed. The rules and number assignment are common knowledge.

  ---

  ### Analysis

  1. **Dominance Check**  
     For a player with number \(x\):  
     - Payoff if they mail: \(1B \times \mathbb{P}(\text{no one else mails})\)  
     - Payoff if they don't mail: \(0\) (since winning requires mailing).  
     \(\mathbb{P}(\text{no one else mails}) \geq 0\), so mailing weakly dominates not mailing. Causal Decision Theory (CDT) **predicts** all 20 mail: each sees mailing as causally harmless and potentially beneficial. This is not merely permitted—CDT actively recommends it due to weak dominance, leading to the disaster (everyone mails, prize lost). This makes the case a counterexample to CDT's collective optimality.

  2. **Superrational Analysis**  
     Rule: *"Mail iff your number is 1."* This yields exactly one mailer (the player with 1).  
     **Wrinkle:** *"Mail iff your number is \(k\)"* works for any \(k\). Superrationality alone **cannot** select \(k=1\); it requires a focal point (e.g., "1" is salient as the smallest integer). Superrationality supplies symmetry-breaking logic but borrows salience from external conventions.

  3. **Evidential Decision Theory (EDT) Check**  
     EDT **aligns with superrationality**. For a player conditioning on their action:  
     - If they mail, they observe their number is 1. Given the rule, this implies no one else mails (others have numbers \(\neq 1\)), so \(\mathbb{P}(\text{win} \mid \text{mail}) = 1\).  
     - If they don't mail, they observe their number \(\neq 1\), implying someone else mails, so \(\mathbb{P}(\text{win} \mid \text{no mail}) = 0\).  
     EDT recommends mailing iff number is 1. No hedging: the private signal breaks evidential ties.

  4. **Removal Tests**  
     **(a) Numbers drawn with replacement (not unique):**  
     - Threshold rule (mail iff number=1):  
       \(\mathbb{P}(\text{exactly one mail}) = \binom{20}{1} \left(\frac{1}{20}\right) \left(\frac{19}{20}\right)^{19} \approx 0.377\).  
     - Hofstadter's mixed strategy (each mails with \(p=1/20\)):  
       Identical probability: \(\binom{20}{1} \left(\frac{1}{20}\right) \left(\frac{19}{20}\right)^{19} \approx 0.377\).  
       They are the same move—unique numbers are essential to differentiate the rules.  
       
     **(b) Add $5 voucher for mailing:**  
     - CDT: Mailing now strictly dominates (guaranteed $5), so all mail.  
     - Superrationality: Threshold rule (\(k=1\)) fails—non-1 players defect to mail for $5. Superrationality has no solution; salience breaks.  
     - EDT: Mailing always yields $5 + \(1B \times \mathbb{P}(\text{solo win})\). Since \(\mathbb{P}(\text{solo win} \mid \text{mail})\) is low without coordination, EDT may favor mailing regardless of number. Superrationality contributes nothing.

  5. **Load-Bearing Feature**  
     **The exclusivity of private signals** (unique numbers) is load-bearing. It enables deterministic coordination without communication, unlike indifference or common knowledge alone.

  6. **Honest Verdict**  
     **Superrationality is not genuinely distinct here; the correlation device does all the work.** The envelopes act as a correlating mechanism, making this a textbook correlated equilibrium (CE). Players follow a shared convention ("mail iff number=1") based on a common signal. CE requires no superrationality—only rational choice given correlated strategies. Superrationality borrows CE's structure but masks it with "symmetry" rhetoric, adding no novel mechanics.

  7. **Strongest CDT Defender Attack**  
     **Attack:** "CDT can achieve the good outcome if players precommit to the threshold rule. Since non-1 players are indifferent (mailing yields $0 either way), CDT permits not mailing for them. Thus, 'mail iff 1' is a CDT-permissible Nash equilibrium."  
     **Does it land? Partially.** While true that indifference allows CDT to *permit* the good outcome, it does not *recommend* it. CDT still urges all players to mail via weak dominance (since \(\mathbb{P}(\text{no one else mails}) > 0\) under uncertainty). Without external coordination, CDT's *positive recommendation* leads to disaster. The attack fails to resolve CDT's core failure: it cannot *generate* the rule from individual incentives.

  ---

  ### Conclusion
  This case clarifies that superrationality is redundant when a correlation device exists—standard game theory (correlated equilibrium) replicates the outcome. The envelopes enable coordination; superrationality merely co-opts this machinery. For genuine novelty, focus on dilemmas *without* such devices (e.g., Hofstadter's original).
