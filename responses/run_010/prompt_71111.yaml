  The pregnancy example is perfect—it's jarring and absurd. A brain-dead body carrying a fetus to term forces a clash between the standards: whole-brain would see biological functioning (so "alive"), while higher-brain sees no personhood (so "dead"). That tension is ripe for dark humor. 

