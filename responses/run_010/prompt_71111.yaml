answer: |-
  **Setup:**  
  Two bioethicists examine a brain-dead pregnant patient whose body nourishes the fetus.  

  **Punchline:**  
  *Higher-Brain Advocate:* "Tragic—a posthumous pregnancy."  
  *Whole-Brain Advocate:* "Nonsense! The patient’s clearly alive. She’s just on very advanced life-support."  

  **Distinction:** Irreversible loss of personhood versus persistent biological integration.  

  ---  
  **Why it works:**  
  1. **Higher-Brain Voice** ("posthumous pregnancy") focuses on the *absence of personhood* (irreversible unconsciousness), treating the body as a corpse performing biological functions.  
  2. **Whole-Brain Voice** ("alive... advanced life-support") insists *integrative brainstem function* (here, sustaining pregnancy via hormone regulation) signifies life, despite absent consciousness.  
  3. **Collapses if swapped**: A higher-brain theorist wouldn’t equate biological integration with "life-support," nor would a whole-brain theorist call a body sustaining pregnancy "posthumous."  
  4. **Leverages awkward facts**: Uses the jarring reality of a brain-dead body gestating a fetus—a scenario where whole-brain sees *biological life* while higher-brain sees *biological machinery*.
