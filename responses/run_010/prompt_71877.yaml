prompt: |-
  Three months ago I was appointed chair of my professional association's ethics and standards committee, and my first assignment has been to read eleven years of the committee's case determinations in order to draft a style guide for future panels. A pattern has emerged from that reading that I have been unable to name, and I should like to know whether it corresponds to any established concept or whether it needs one.

  In determination after determination, the committee arrives at what is unmistakably a moral conclusion without ever straightforwardly asserting a moral claim. Two specimens, lightly disguised:

  A finding against a researcher who had reviewed a competitor's funding proposal opens by stipulating, for the purposes of the report, that an arrangement is extractive where one party captures value created by another without reciprocal contribution. Six pages later the panel establishes that the review made use of material the applicant had disclosed in confidence, states that such use falls within the stipulated definition, and recommends a two-year suspension from review duties. The words wrong, unfair, and ought never occur outside a conditional clause, an attribution to the membership's standing policy, or the definition itself.

  A conflict-of-interest opinion reads in relevant part: the committee does not regard it as within its remit to pronounce on the ethics of the arrangement described; it notes that a substantial number of members have expressed the view that arrangements of this kind are indefensible; and it observes that the arrangement before it resembles, in every particular the policy identifies as relevant, one the committee censured in an earlier matter. It then declines to renew the respondent's appointment.

  I have read these closely enough to know the transmission works. I formed the beliefs the documents are arranged to produce before I noticed the mechanism, and so did every colleague with whom I have discussed them. Yet if you asked any of the authors to state a single moral claim they had asserted, they would honestly be unable to. What strikes me as distinctive is the systematicity: the avoidance of unembedded moral sentences is complete rather than occasional, and each individual device — the conditional, the stipulated definition, the attribution to the membership, the analogy to a censured case, the open question — is unobjectionable in isolation and reads as precision or institutional modesty rather than evasion. My own first draft of the style guide contained three instances of the pattern, which is what finally convinced me this is not a matter of individual evasiveness at all.

  The neighboring concepts I have come up with all seem to fall short, and I would want any answer to engage them rather than pass them over:

  The Frege–Geach problem, as I understand it, concerns how a view that ties the meaning of moral sentences to the expression of attitudes can account for their occurrence in valid arguments in which they are not asserted; correct me if I have mis-stated that. My problem looks like the mirror image: not that a theory struggles with embedded occurrences, but that a whole body of discourse is built out of them and still moves its readers. I want to know whether what I have described is a difficulty for expressivism, something it predicts, or something outside its scope altogether.

  Plausible deniability, and innuendo in the sense familiar from defamation, both concern content conveyed without being stated, but both concern a speaker's strategic option to disavow; several of these authors, I am confident, have no intention to convey a moral claim, and the belief arrives in readers regardless.

  Conversational implicature and insinuation also involve non-asserted content, but they hang off something that is asserted, and here there is nothing for them to hang off. Apophasis is the deliberate raising of a matter under the guise of passing it over, which is a rhetorical posture, whereas this pattern survives perfectly polite, technical prose with no irony in it.

  Presupposition, and the fallacy of the complex question, are the closest logical analogues, but they locate the smuggled content in a single sentence that a hearer can challenge on the spot; what I have found is distributed across the architecture of an entire document, so there is no place to object.

  So: does this have an established name, whether in the literature on assertion, in the expressivist debates about embedding, in legal drafting, or in rhetoric? If it does, give it to me and tell me precisely how it differs from each of the neighbors above. If it does not, coin one and define it rigorously enough that I could put the definition into the style guide — which means marking its boundaries: whether a judicial opinion that argues wholly by analogy to settled cases and never asserts a normative premise counts; whether a document that quotes a professional code verbatim and applies it to the facts counts; whether a purely descriptive audit report that is routinely used to justify sanctions counts. A bare label will not serve my purposes. What I need is the phenomenon carved, its edges drawn, and an account of what, if anything, is objectionable about it, including whether a committee operating under an express no-pronouncements remit can avoid it at all.
reasoning: |-
  Hmm, the user is describing a fascinating pattern in professional ethics determinations where moral conclusions are conveyed without explicit moral assertions. They need either an established term for this phenomenon or a newly coined concept with precise boundaries.

  I recognize several key elements: (1) systematic avoidance of unembedded moral language, (2) use of techniques like conditional clauses, stipulated definitions, institutional attributions, and analogies, (3) effectiveness in conveying moral positions regardless of authorial intent, and (4) distinctiveness from concepts like plausible deniability or conversational implicature.

  The user has already done impressive conceptual legwork by distinguishing this from:
  - Frege-Geach (which deals with embedded moral sentences in logic rather than institutional discourse)
  - Plausible deniability (which implies strategic disavowal absent here)
  - Conversational implicature (which requires asserted content to "hang off")
  - Presupposition (which operates at sentence-level rather than document-level)

  What's particularly interesting is how this functions as an institutional epistemology - a way for organizations to make normative judgments while maintaining the appearance of procedural neutrality. The techniques create what we might call "moral affordances" - structural openings where readers naturally insert normative interpretations.

  For terminology, "inferential moral architecture" captures the distributed, structural nature. "Normative ventriloquism" emphasizes how the document speaks morality through other sources. But "procedural moral transmission" might be most precise, highlighting the rule-based mechanism.

  Boundary cases help define it:
  - Judicial opinions using pure precedent would qualify if they avoid normative premises
  - Verbatim code applications don't qualify since the moral claim is explicitly imported
  - Descriptive audit reports only qualify if the sanctions connection is systematically implied

  The ethical concern isn't evasion per se, but rather the creation of moral authority without accountability. Even committees avoiding pronouncements might not escape this, as the very procedural framing carries normative weight. The style guide should probably embrace transparency about this inevitable dimension of ethical decision-making.
answer: |-
  Your observation captures a sophisticated and under-theorized phenomenon in institutional discourse. I propose the term **Procedural Moral Transmission (PMT)** for this pattern, which operates at the intersection of metaethics, legal rhetoric, and institutional design. Below is a rigorous definition, differentiation from adjacent concepts, boundary cases, and ethical analysis—structured for direct inclusion in your style guide.

  ---

  ### **Definition of Procedural Moral Transmission (PMT)**  
  *Procedural Moral Transmission* occurs when an institutional document:  
  1.  **Avoids categorical moral assertions** (e.g., "X is wrong"),  
  2.  **Substitutes procedural or descriptive scaffolding** (stipulated definitions, analogies to past cases, attributions to external sources, conditional logic),  
  3.  **Achieves unequivocal moral communication** by structuring these elements to compel readers to draw normative conclusions,  
  4.  **Depends on systemic document-level architecture**, where the moral force emerges from the *interrelation* of non-moral parts rather than any single statement.  

  ### **Key Differentiators from Adjacent Concepts**  
  | Concept               | How PMT Differs                                                                 |
  |-----------------------|---------------------------------------------------------------------------------|
  | **Frege-Geach Problem** | FG concerns *logical consistency* of embedded moral terms. PMT is a *pragmatic institutional tactic* exploiting embedding to avoid assertion while ensuring transmission. Expressivism struggles with embedding’s logic; PMT leverages embedding’s rhetoric. |
  | **Plausible Deniability/Innuendo** | These involve *strategic ambiguity* to allow disavowal. PMT lacks ambiguity: conclusions are inescapable, and authors may genuinely not intend to "convey" morality—it emerges *procedurally*. |
  | **Conversational Implicature** | Implicature requires an asserted "trigger" (e.g., "Some passed" implying not all). PMT has **no trigger**; moral content arises from document structure, not pragmatic inference. |
  | **Apophasis**          | Apophasis is a *rhetorical flourish* (e.g., "I won’t mention his corruption"). PMT is *non-ironic* and survives in dry, technical prose without stylistic signaling. |
  | **Presupposition**     | Presuppositions are *sentence-level* (e.g., "Have you stopped lying?" presumes past lies). PMT is *document-level*: no single sentence is challengeable; the moral conclusion is a gestalt effect. |

  ---

  ### **Boundary Cases for the Style Guide**  
  1. **Judicial opinions arguing solely by analogy to precedent**  
     - *Counts as PMT* if analogies replace normative premises (e.g., "This conduct matches *Smith v. Jones*, which imposed sanctions" without ever stating why *Smith* was condemnable).  
     - *Not PMT* if the court explicitly endorses the precedent’s reasoning (e.g., "We adopt *Smith*’s holding that fraud undermines trust").  

  2. **Quoting and applying a professional code verbatim**  
     - *Not PMT*: The moral claim is explicitly imported via citation (e.g., "Code §3.1 prohibits conflicts; Respondent violated §3.1").  
     - *Exception*: If the code itself uses PMT (e.g., "Membership voted that ‘extractive use’ merits suspension"), application may extend PMT.  

  3. **Purely descriptive audit reports triggering sanctions**  
     - *Not PMT* if sanctions follow from *external* rules (e.g., "Funds were misallocated" → automatic penalty per bylaw).  
     - *Counts as PMT* if the description *implies* culpability through structure (e.g., juxtaposing "Funds diverted" with "Trustee oversight lapsed" to imply negligence without assertion).  

  ---

  ### **Ethical Analysis: Is PMT Objectionable?**  
  1. **Strengths**:  
     - Promotes consistency in bureaucratic contexts.  
     - Avoids contentious metaethical debates (e.g., moral realism vs. relativism).  
     - Aligns with mandates to avoid "pronouncements" by focusing on process.  

  2. **Objections**:  
     - **Accountability Evasion**: Moral judgments are made without owning them, insulating the committee from critique.  
     - **Epistemic Opacity**: Readers adopt conclusions without examining moral foundations (e.g., *why* "extractiveness" is bad).  
     - **Democratic Deficit**: Attributions to "membership views" may mask elite consensus as popular will.  

  3. **Can a "No-Pronouncements" Committee Avoid PMT?**  
     - **No**. PMT is likely *unavoidable* under such a remit because:  
       - All moral conclusions require *some* justificatory framework.  
       - Process-based reasoning (definitions/analogies) is the only alternative to direct assertion.  
     - **Mitigation**: Confine PMT to *secondary* status (e.g., "This matches case #201, *which implemented Code §4*" anchors to an explicit norm).  

  ---

  ### **Recommendation for the Style Guide**  
  Acknowledge PMT as an institutional inevitability but impose safeguards:  
  > "Committees may employ procedural reasoning (definitions, analogies, attributions) to ground determinations. However:  
  > - **Anchor analogies** to explicitly endorsed standards (e.g., 'This resembles Case X, *which applied Code §Y*').  
  > - **Audit definitions** annually for hidden normativity (e.g., is 'extractive' neutral or pejorative?).  
  > - **Disclose** when moral sentiment is inferred from membership input versus empirical analysis."  

  This reframes PMT as a *tool* rather than a flaw—demanding transparency about its constructed nature. The phenomenon is neither expressivism’s nemesis nor its ally; it is a *praxis* that reveals institutions’ struggle to moralize without metaphysics.
