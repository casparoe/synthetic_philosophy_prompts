  Optimists: Progress as exported sciences + sophistication gains + wrong metrics. Like judging weather forecasters solely on tornado predictions.

  The residue analysis needs special care. Where do concepts like "sophistication gains" land in forecasting terms? If resolution requires measurable outcomes, how does that handle metaphysical debates? This might reveal framework limitations.

