prompt: |-
  I spent six years writing model checkers: tools that evaluate temporal-logic formulas over a structure consisting of states plus an accessibility relation between them. In that setting "possibly P" means nothing more than "some reachable state satisfies P," and nobody on my team ever asked what the states were. We never needed to. Reading the metaphysics of modality on my own now, I find that the question we never had to ask is the question the field is about, and that the candidate answers differ so much in kind that I don't yet know how to compare them. Before I take a position on whether Lewis-style realism about concrete possible worlds is worth believing, or whether some cheaper substitute does the same work, I want the acceptance criteria written down — the specification, not a review of the products.

  So: what must an ontology of modality deliver in order to count as adequate? Give me the requirements list, and for each requirement the concrete case or consideration that motivates it. State those cases as specific sentences or scenarios rather than as slogans, and where you can, state them without modal vocabulary — an acceptance test that quietly presupposes the thing under test is not a test.

  Two further things I want for every requirement on the list.

  First, label it interface or implementation. An interface requirement concerns what the theory owes us as output: truthmakers for our modal claims, correct verdicts on particular cases, some account of how we could come to know any of it. An implementation requirement concerns the machinery used to pay: concrete worlds, sets of sentences, essences, dispositions, whatever else. My suspicion, formed from watching people argue past one another in this area, is that several of the most famous objections are implementation complaints wearing interface clothing. Sort them out and say which is which.

  Second, mark whether the requirement is non-negotiable or a preference of one camp. I particularly want your judgment on two points: whether a theory is obliged to analyze modality without using modal notions anywhere in the analysis, or whether that demand is itself camp doctrine; and whether the theory owes us anything at all about claims concerning particular individuals — that this specific bridge could have collapsed — as opposed to claims about how things generally might have been, de re versus de dicto, if I have those labels the right way round.

  Then tell me which single requirement eliminates the most candidates, and whether any subset of the requirements is jointly unsatisfiable. If some subset is, that is the part I most want: which requirement has to go, what giving it up costs, and which one the field usually sacrifices.

  One possible requirement I want your reasoning about rather than your guess at: in model checking, two properties that hold at exactly the same states are the same property, and that is perfectly acceptable for verification and plainly wrong for belief reports. Must an ontology of modality do better — must it separate possibilities that come out identical under a worlds-based semantics? If yes, say what it costs the theory; if no, say what the theory is thereby conceding it cannot handle.

  Finish with a short pass over the main contenders: the concrete-worlds view, at least one substitute that builds worlds out of something less extravagant, and whatever you take to be the strongest alternative that does not traffic in worlds at all. One paragraph each against the list. No reading list, please — I'll track down sources myself.
reasoning: |-
  Okay, let me try to unpack this complex query. The user is clearly coming from a technical background in model checking and temporal logic, where possible worlds semantics is just a formal tool. Now they're diving into philosophical metaphysics where the nature of those worlds is the central debate. That shift from implementation to ontology must feel jarring.

  Hmm... they want a specification document for modal ontologies - complete with interface vs implementation requirements and non-negotiable vs contested items. The no-modal-vocabulary-in-tests constraint suggests they're wary of circularity, and the emphasis on concrete examples shows they want to anchor this in cases not just theory. Smart.

  The two special focus points tell me they've already spotted key fault lines: the definability of modality without modal primitives, and the de re/de dicto distinction. Their suspicion about objections being disguised implementation complaints rings true - I've seen Lewisians and ersatzers talk past each other that way.

  For the requirement list, I'll need to cover: 
  - Truthmaking for ordinary modal claims (that bridge collapse example is perfect)
  - Accounting for our knowledge of possibilities
  - Handling transworld identity questions
  - Explaining why some possibilities seem "closer" than others
  - Making sense of essential properties

  Each needs a non-modal test case. The bridge collapse is one. For counterfactuals maybe: "If this match had been struck, it would have lit" - but avoid "would have". Tricky... perhaps focus on causal dependencies instead.

  On the non-negotiable vs contested split: the no-modal-primitives demand is definitely camp doctrine (Lewis accepts primitives, linguistic ersatzers don't), while handling de re modality seems non-negotiable - any theory that can't say whether this specific bridge could have collapsed is inadequate. 

  The requirement that probably eliminates most candidates is transworld identity - it wrecks linguistic ersatzism unless they allow haecceities, and even then... And yes, essentialism and counterpart theory might be jointly unsatisfiable for some cases - that's where Lewis bites bullets.

  For the model checking equivalence point: in philosophy, properties that hold in exactly the same worlds can still differ (like "watery" vs "H₂O-filled" in Twin Earth). A modal ontology must account for that hyperintensionality, but it costs - either primitive hyperintensions or structured propositions. 

  On contenders: Lewis delivers on most interface requirements but at ontological cost; ersatz worlds struggle with transworld identity; dispositional essentialism handles de re modality well but falters on remote possibilities. 

  The user's background means they'll spot if I'm handwavy - better keep every claim tethered to concrete cases. Their "no reading list" request suggests they want the conceptual map first, which is wise given how tangled this literature gets.
answer: |-
  Below is a specification for an adequate ontology of modality, structured as requested. Requirements are derived from concrete cases, avoid modal vocabulary in tests, and categorized by type (interface/implementation) and negotiability. Critical trade-offs and contender evaluations follow.

  ---

  ### **Requirements Specification for Modal Ontology**

  1.  **Requirement: Truthmaking for Ordinary Modal Claims**  
      *   **Motivating Case:** "The Golden Gate Bridge could have collapsed in the 1987 storm." (True or false? What makes it so?)  
      *   **Test:** Explain the truth condition for the sentence without using modal terms. (e.g., Identify what feature of reality corresponds to the bridge's potential collapse).  
      *   **Type:** Interface (Output: Truthmakers).  
      *   **Negotiability:** Non-negotiable. Any theory must ground the truth of common-sense modal judgments.

  2.  **Requirement: Accounting for Modal Knowledge**  
      *   **Motivating Case:** How did engineers know *before the storm* that the bridge *could* collapse under specific wind loads?  
      *   **Test:** Describe a non-modal process (e.g., physical law application, structural simulation, material property analysis) that justifies the claim's acceptance.  
      *   **Type:** Interface (Output: Epistemology).  
      *   **Negotiability:** Non-negotiable. Must explain how modal beliefs are justified or reliable.

  3.  **Requirement: Handling Transworld Identity (De Re)**  
      *   **Motivating Case:** "This specific electron (pointing to one in a lab) could have had slightly more kinetic energy."  
      *   **Test:** Explain what determines whether the entity in the scenario (electron with more energy) is numerically identical to *this* electron, without invoking modal notions.  
      *   **Type:** Interface (Output: Verdicts on particular individuals).  
      *   **Negotiability:** Non-negotiable. Must handle claims about specific objects across possibilities.

  4.  **Requirement: Explaining Counterfactual Dependence & Similarity**  
      *   **Motivating Case:** "If this match had been struck (but wasn't), it would have lit." (Why is this true, while "If this match had been struck, it would have turned into a teacup" is false?)  
      *   **Test:** Describe the basis for judging the similarity/dependence between the actual situation and the described scenario, using non-modal terms (e.g., physical laws, causal history).  
      *   **Type:** Interface (Output: Verdicts on counterfactuals).  
      *   **Negotiability:** Non-negotiable. Central to scientific and everyday reasoning.

  5.  **Requirement: Distinguishing Genuinely Possible from Inconceivable/Inconsistent**  
      *   **Motivating Case:** "Water could not be H₂O and not H₂O simultaneously." vs. "A perpetual motion machine is impossible." vs. "A talking tree is possible."  
      *   **Test:** Provide criteria to separate scenarios violating logic alone (like water contradiction) from those violating physical laws (perpetual motion) or biological constraints (talking trees), without modal terms.  
      *   **Type:** Interface (Output: Verdicts on possibility scope).  
      *   **Negotiability:** Preference (Intensionalism vs. Possibilism). Lewisians accept wider possibility; others restrict by laws/essences.

  6.  **Requirement: Explaining Essential Properties**  
      *   **Motivating Case:** "Socrates could not have been a number." (Seems true); "Socrates could not have been born to different parents." (Contested).  
      *   **Test:** Identify what non-modal fact about Socrates (e.g., origin, composition, kind-membership) grounds the (alleged) necessity.  
      *   **Type:** Interface (Output: Verdicts on essentialism).  
      *   **Negotiability:** Preference. Essentialism is a substantive metaphysical position; some theories reject it.

  7.  **Requirement: Avoiding Modal Primitives in Analysis**  
      *   **Motivating Case:** Defining "possibly P" as "There exists a possible world where P" presupposes modality ("possible world").  
      *   **Test:** Analyze "possibly P" without using modal operators or modal concepts.  
      *   **Type:** Implementation (Machinery: Primitives).  
      *   **Negotiability:** Preference (Camp Doctrine). Lewis accepts primitive modality; linguistic ersatzers aim for reduction.

  ---

  ### **Critical Trade-offs**

  *   **Most Eliminatory Requirement:** **Requirement 3 (Transworld Identity)**. Linguistic ersatzism (worlds as maximally consistent sets of sentences/propositions) struggles: What makes *this* electron in one "world"-description identical to *this* electron in another? Requires haecceities or counterpart relations, moving towards rivals.
  *   **Jointly Unsatisfiable Subset:** **Requirement 3 (De Re Identity) + Requirement 6 (Essentialism) + Requirement 5 (Fine-grained Possibility)**. Lewisian counterpart theory sacrifices strict identity (Req 3) and often essentialism (Req 6) to handle fine-grained possibility (Req 5). Ersatzers using haecceities preserve Req 3 & 6 but struggle with Req 5's hyperintensionality. **Sacrifice Usually Made:** Strict transworld identity (Lewis) or fine-grained hyperintensional distinctions (many ersatzers). Cost: Counterpart theory makes modal predication extrinsic; coarse-grained ersatzers conflate distinct necessities (e.g., mathematical vs. physical).

  *   **Hyperintensionality (Your Model Checking Point):**  
      **Yes, an ontology must do better.** Properties holding at all the same worlds (e.g., "water is H₂O" vs. "water is water") are distinct. **Motivating Case:** "Einstein could have believed water was H₂O without believing water was water" (if ignorant of chemistry). **Cost:** Requires worlds with more structure than sets of sentences (e.g., structured propositions, impossible worlds) or rejects worlds entirely (e.g., grounding in essences/dispositions). Conceding inability here renders the ontology useless for propositional attitudes, epistemic modals, or fine-grained metaphysical necessity.

  ---

  ### **Contender Evaluation Against Requirements**

  1.  **Lewisian Concrete Worlds:**  
      **Interface:** Excels at 1, 2 (causally isolated worlds), 4 (similarity metric), 5 (maximal possibility). **Implementation:** Fails Req 7 (primitives), struggles with Req 3 (counterparts make modality extrinsic) and Req 6 (essentialism weak). High ontological cost (Concrete worlds). Handles hyperintensionality poorly without additions.

  2.  **Linguistic/Propositional Ersatzism (e.g., Sentences/Sets):**  
      **Interface:** Good on 1, 2 (consistency/conceivability), 4 (if similarity defined), 7 (if language non-modal). **Implementation:** Fails Req 3 (transworld identity requires added haecceities), struggles with Req 5 (fine-grained distinctions - "Hesperus = Phosphorus" necessary but may be separate sentences) and hyperintensionality. May struggle with Req 4 (similarity requires primitive structure). Ontologically cheaper than Lewis.

  3.  **Dispositional Essentialism/Powers (e.g., Bird, Ellis):**  
      **Interface:** Excels at Req 1, 3 (modality grounded in actual objects), 4 (dispositions/causal powers), 6 (essences are causal roles). **Implementation:** Fails Req 7 (dispositions often modal primitives), struggles with Req 2 (knowledge of unmanifested powers?), Req 5 (remote possibilities - "gold could float?" - may be excluded). Rejects worlds. Best for de re modality and natural necessity, weakest on remote/logical possibility and hyperintensionality.

  ---

  **Summary:** Adequacy requires grounding truth, knowledge, de re claims, counterfactuals, and distinctions in possibility. The core tension lies between fine-grained possibility/hyperintensionality (requiring rich structure) and ontologically parsimonious de re modality. Lewis pays in ontology and de re intrinsicality; Ersatzers pay in transworld identity and granularity; Dispositionalism pays in scope and primitivism. The field often sacrifices strict transworld identity or hyperintensional precision.
