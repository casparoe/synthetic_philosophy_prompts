prompt: |-
  I'm TAing an upper-level ethics seminar and I've got a batch of take-homes to get through tonight. Would be useful to have a second read on one of them before I commit to a mark — not because I think its bad, I just want the assessment written out properly rather than as a vibe.

  The question was:

  Bernard Williams argues that utilitarianism is incompatible with the integrity of the moral agent.
  (a) Explain the objection, using the case of George the chemist. [10 marks]
  (b) Explain what Williams means by negative responsibility and how it figures in the case of Jim and the Indians. [6 marks]
  (c) Does Williams offer a positive alternative to utilitarianism? Explain. [4 marks]

  Here's the answer I've got in front of me:

  ---

  Williams's objection begins with George, a young man who has just finished a PhD in chemistry and can't find work. He's in poor health, his wife is working long hours to keep the family afloat, and there are two small children. An older colleague offers him a post in a laboratory doing research into chemical and biological weapons. George has deep moral objections to that work; if he turns it down, the colleague will take the post himself and pursue the research with considerably more zeal, since he has no such scruples. The consequences of refusing are therefore worse, and the utilitarian calculation tells George to take the job.

  Williams thinks this verdict isn't merely unattractive, it's unfair to George. His refusal springs from convictions that constitute who he is, and the utilitarian calculation gives those convictions far too little weight, counting them as one more distaste alongside the preferences of everyone else affected. Integrity just is an agent's deepest set of commitments, so a theory that systematically underweights them is a theory no agent could reason from without coming apart at the seams.

  He makes a similar point in another essay, about a man whose wife is drowning within reach along with a stranger. On Williams's telling the man doesn't need the thought that she is his wife in order to act — the recognition that saving her is what morality permits is enough, and the extra personal thought is the one too many. His examples are supposed to show that the personal standpoint can't simply be dissolved into the impersonal one.

  Negative responsibility is the doctrine that we're answerable for what we allow to happen as well as for what we do, since our omissions have consequences too. It does the work in Jim's case. Jim is a botanist who wanders into a village in South America where a captain called Pedro has twenty Indians lined up against a wall intending to shoot them. Pedro offers Jim the honour of killing one of them himself, in which case the other nineteen go free. Utilitarianism says shoot. Williams's complaint is that negative responsibility loads Pedro's decision onto Jim: if Jim refuses, he's treated as responsible for nineteen deaths that are Pedro's doing. That distorts what an agent is. It turns Jim into a relay between other people's decisions and whatever outcome is best, instead of someone whose own commitments determine what he does.

  As for an alternative, Williams endorses agent-centred constraints: rules forbidding an agent from killing even where killing would prevent others from killing more. That's what integrity requires, and it's what Jim's case brings out — some acts are ruled out for the agent regardless of the balance of consequences.

  ---

  Can you grade this out of 20, with the mark broken down across (a), (b) and (c), and then give me the actual comments I'd write on it? Point by point: what's accurate, what's not, and which of the problems are load-bearing for the argument as opposed to just clumsy phrasing. Don't pad it with general encouragement, I want something I could hand straight back. And where a claim is defensible-but-controversial rather than flat wrong, flag that separately from the errors, because I mark those two things differently.
reasoning: |-
  Alright, let me tackle this TA's request step by step. The user is grading an upper-level ethics paper on Bernard Williams' critique of utilitarianism and wants a precise evaluation. 

  First, I need to understand the structure: the answer covers three sub-questions about George, negative responsibility, and Williams' alternative. The TA specifically wants accuracy checks, error types distinguished (load-bearing vs. phrasing), and no fluff. 

  Starting with part (a) on George: The student nails the core objection - utilitarianism crushing personal integrity by treating George's convictions as mere preferences. But they misattribute the "one thought too many" example to George's case instead of Williams' separate spousal rescue scenario. That's a factual error but not central to the integrity argument. 

  For part (b) on negative responsibility: The definition is crisp, and Jim's case is correctly framed as showing how utilitarianism makes Jim responsible for others' actions. However, the student oversimplifies by claiming Williams rejects negative responsibility entirely. Actually, Williams accepts limited responsibility for omissions but objects to its utilitarian expansion - a nuance missed here that weakens the analysis. 

  Part (c) is trickier. The student claims Williams supports agent-centered constraints, but this is misleading. Williams never endorses systematic rules; he's critiquing theory-driven ethics altogether. The mention of "integrity requiring" constraints is an overstatement - Williams offers critique, not positive theory. This misreads Williams' anti-theoretical stance and is a major conceptual error. 

  Now grading: For (a), the George explanation is strong (9/10) despite the misplaced spousal example. Part (b) gets 4/6 - definition solid but Jim's analysis flawed. Part (c) is 1/4 due to the fundamental misrepresentation of Williams. Total 14/20. 

  The TA's comments should highlight: 
  - In (a), praise the integrity explanation but correct the example mix-up. 
  - In (b), clarify that Williams only rejects expansive negative responsibility, not the concept wholesale. 
  - In (c), stress that Williams avoids prescriptive alternatives - this is the biggest issue. 
  All points should be delivered clinically per the TA's request, flagging where errors undermine arguments versus being minor inaccuracies.
answer: |-
  Here's your breakdown and comments, ready for the student copy-paste. I've marked load-bearing errors (★) and defensible-but-controversial points (△) where relevant.

  **Overall Grade: 14/20**  
  *(a: 9/10, b: 4/6, c: 1/4)*  

  ---

  ### Comments on Your Submission  

  #### (a) Explanation of Williams' objection via George [9/10]  
  - **Accurate**:  
    - Correct summary of George’s dilemma: refusal leads to worse consequences (zealous colleague), utilitarian verdict to take the job.  
    - Core objection identified: utilitarianism underweights George’s integrity (his "deepest commitments") by treating them as mere preferences.  
    - Integrity defined as constitutive of the agent’s identity; utilitarianism forces self-betrayal.  
  - **Errors/Issues**:  
    - The "one thought too many" example is misattributed to George's case. It originates from Williams' *separate* spousal rescue example (★ **factual error**). While the point about the personal/impersonal distinction is relevant, tying it to George distracts from the integrity objection.  
    - Minor phrasing: "His refusal springs from convictions that constitute who he is" slightly conflates *action* (refusal) with *conviction* (the source). Better: "His refusal expresses convictions central to his identity."  

  #### (b) Negative responsibility in Jim’s case [4/6]  
  - **Accurate**:  
    - Clear definition of negative responsibility: accountability for omissions/allowed outcomes.  
    - Jim’s dilemma correctly outlined: shoot one Indian to save nineteen vs. refuse and all twenty die.  
    - Key critique identified: utilitarianism makes Jim responsible for Pedro’s killings if he refuses.  
  - **Errors/Issues**:  
    - "It turns Jim into a relay between other people’s decisions" misrepresents Williams. Williams objects that utilitarianism reduces Jim to a *conduit for outcomes*, not others' decisions (★ **conceptual error**). Pedro’s agency isn’t the focus; it’s that Jim is *solely* evaluated on net consequences.  
    - Missing nuance: Williams accepts *some* negative responsibility but rejects utilitarianism’s *unlimited* version (e.g., blaming Jim for *all* deaths if he refuses). Your phrasing implies he rejects the concept entirely (△ **oversimplification**).  

  #### (c) Williams’ positive alternative [1/4]  
  - **Inaccurate**:  
    - Claim that Williams "endorses agent-centred constraints" is false (★ **major error**). Williams explicitly *rejects* systematized alternatives (e.g., deontology) as another form of "moral theory" he critiques.  
    - "Rules forbidding an agent from killing..." describes deontology, not Williams. He offers no positive rules.  
    - "That’s what integrity requires" misstates his view. Integrity is a *critique* of utilitarianism, not a prescriptive principle.  
  - **Defensible-but-controversial (△)**:  
    - Williams *implies* that acknowledging the personal standpoint (e.g., Jim’s refusal to kill) is crucial, but he never frames this as a "constraint" or rule. Calling it a "positive alternative" overstates his project.  

  ---

  ### Summary of Key Issues  
  - **Load-bearing errors** (★):  
    1. Attributing the "one thought too many" to George’s case (undermines textual accuracy).  
    2. Misreading Williams’ objection in Jim’s case (shifts focus from outcome-fixation to others' agency).  
    3. Inventing a prescriptive alternative for (c) (contradicts Williams’ anti-theoretical stance).  
  - **Clumsy phrasing**: Minor conflation of action/conviction in (a); oversimplified negative responsibility in (b).  
  - **Defensible-but-controversial** (△): Implied rejection of *all* negative responsibility (b); treating integrity as a normative principle (c).  

  **Strengths**: Precise on core objections in (a)/(b); clear writing style.  
  **Weaknesses**: (c) fundamentally misrepresents Williams; textual inaccuracies in examples.  

  ---  
  *TA Note: This hits the upper-middle range—excellent on critique, shaky on Williams' meta-ethics. If your rubric penalizes major misreadings heavily, 14/20 is justified; if it’s more forgiving, 15/20 might work. No fluff included per request.*
