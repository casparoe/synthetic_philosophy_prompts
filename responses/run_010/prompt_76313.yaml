  ### Scenario (142 words)
  A flood barrier must be deployed to protect either a farm or a residential street. If the farm floods, its owner (a solo farmer) will lose her entire crop and livestock—equivalent to two years of income. If the street floods, five homeowners will each suffer severe property damage—equivalent to 80% of one year's income per household. You are a disaster-response consultant with no ties to anyone involved. The flood is imminent, and your choice is final. All affected are strangers of equal standing. The farmer’s loss clearly exceeds each homeowner’s loss, but the homeowners’ combined losses exceed the farmer’s loss. You cannot split the barrier or use chance mechanisms.  

  ---

  ### Analysis by Ethical View  

  | Position | Verdict | Principle Invoked | Step That Decides It | Best Attack from This Position |
  |----------|---------|-------------------|----------------------|--------------------------------|
  | **Taurek-style non-aggregation** | Flip a coin (50% chance to save the farmer, 50% to save homeowners) | Equal respect for persons; no aggregation of harms | Refusal to sum harms across individuals. Both options represent a "loss to some," so neither is inherently worse. | *"The pairwise view ignores the equality of persons by letting one individual dominate arbitrarily. The aggregator commodifies human suffering."* |
  | **Total-welfare aggregator** | Save the five homeowners | Minimize total harm | Summing individual harms: 5 × 80% = 400% total loss for homeowners vs. 200% for the farmer. 400% > 200%. | *"Pairwise comparison absurdly prioritizes one person over any number of others. Taurek’s coin flip is irrational when harms are measurable."* |
  | **Strict pairwise-comparison** | Save the solo farmer | No individual’s complaint outweighs the farmer’s in direct comparison | Farmer’s loss (200%) > any homeowner’s loss (80%) in one-on-one balancing. The group’s combined loss is irrelevant. | *"Aggregation violates moral individualism. Taurek’s coin flip fails to respect the farmer’s stronger claim."* |

  ### Key Feature Doing the Work  
  The disconnect between **ordinal** and **cardinal** harm comparisons:  
  - **Ordinal** (pairwise): Farmer’s harm is worse *for her* than each homeowner’s harm is *for them* (200% > 80%).  
  - **Cardinal** (aggregation): Homeowners’ total harm exceeds the farmer’s (400% > 200%).  
  Both comparisons are intuitive due to financial measurability and realistic stakes.  

  ### Dial Testing  
  | Group Size | Taurek | Aggregator | Pairwise |  
  |------------|--------|------------|----------|  
  | **50 homeowners** | Flip coin (still 50/50) | Save homeowners (50 × 80% = 4,000% >> 200%) | Save farmer (200% > 80% per person) |  
  | **4 homeowners** | Flip coin | Save homeowners (4 × 80% = 320% > 200%) | Save farmer |  
  | **3 homeowners** | Flip coin | Save homeowners (3 × 80% = 240% > 200%) | Save farmer |  
  | **2 homeowners** | Flip coin | **Save farmer** (2 × 80% = 160% < 200%) | Save farmer |  

  - **Pairwise stability**: Always saves the farmer, regardless of group size. The verdict never flips because the farmer’s harm perpetually exceeds each group member’s harm.  
  - **Aggregator flip point**: Saves the group at group size ≥3 (where total harm ≥240% > 200%).  
  - **Taurek**: Always 50/50, ignoring group size and harm severity.  

  ### Attacks from Losing Positions  
  - **Aggregator’s attack**: *"The harms aren’t truly commensurable. Property loss ignores emotional toll—losing a farm might devastate the farmer more than the numbers suggest."*  
    - **Rebuttal**: This is a restatement of aggregation (insisting harms *must* be summed to capture totality), not a design flaw. The case uses financial harm for clear cardinality.  
  - **Taurekian’s attack**: *"The pairwise view smuggles in aggregation by comparing harms interpersonally. How can we say 200% > 80% without implicit summing?"*  
    - **Rebuttal**: The pairwise comparison is ordinal (A > B, not A = 2.5B). Taurek’s objection conflates comparability with aggregation.  

  ### JSON Summary  
  ```json
  {
    "setting": "Flood barrier deployment: farm vs. residential street",
    "solo_harm": "Loss of farm (2 years of income)",
    "group_harm_each": "Property damage (80% of 1 year's income)",
    "group_size": 5,
    "harms_share_a_type": true,
    "uncertainty": "none",
    "decision_maker_relation": "stranger (disaster consultant)",
    "aggregate_of_group_harms_exceeds_solo_harm": true,
    "pairwise_verdict_stable_across_group_sizes": true,
    "flip_point_if_any": "Aggregator flips at group_size=3",
    "feature_doing_the_work": "Ordinal harm comparison (solo > each) vs. cardinal total (group total > solo)"
  }
  ```  
  **Why it works**: Financial harms allow uncontroversial ordinal *and* cardinal comparisons without extreme disparities. The pairwise view’s inflexibility highlights its rejection of aggregation, even when counterintuitive.
