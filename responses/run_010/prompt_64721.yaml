  First, let's unpack their core concerns. They mention the current material feels like a "grab bag" - that suggests frustration with ad-hoc approaches. The request for "non-negotiable" vs "preference" classifications hints they've encountered conflicting pedagogical approaches. The focus on behavioral assumptions (mixed strategies) and epistemic premises tells me they want to ground this in decision theory foundations.

  Hmm, the seven bullet points cover technical landmines: 
  - The mixed strategy question is tricky because it sits at the EU vs non-EU preference intersection
  - The observer vs player perspective distinction is subtle but vital - I recall Brandenburger's work on this
  - Mutual vs common knowledge trips up many students with the "I think that you think..." regress
  - That order-independence + weak dominance + Nash preservation trio is famously problematic - Myerson's 1978 counterexample comes to mind

  For the scorecard, I'll need to contrast: 
  - Pure strict dominance (safe but weak)
  - Mixed strict dominance (stronger but EU-dependent)
  - Weak dominance (useful but dangerous)
  - Correlated rationalizability (powerful but knowledge-heavy)
  - Independent rationalizability (more realistic but weaker)

  The infinite games point is crucial - many texts ignore this. I should mention transfinite induction and Reny's existence theorems. For tractability, the key is admitting that some rules are theoretically sound but computationally useless - that's honest pedagogy.

  On their suspicion about the trio being incompatible: absolutely correct. Weak dominance isn't order-independent, and Myerson shows it can kill Nash equilibria. The minimal example must be small enough for hand-calculation - 2x2 games suffice.

  The behavioral assumption part deserves care. For mixed strategy dominance, linearity in probabilities (EU) is essential. Without it, "domination" isn't defined. But we needn't assume actual randomization - just that the player would consider mixing if needed. That distinction often confuses students.

  Epistemic premises are where most applied work gets sloppy. Common knowledge of rationality is brittle but necessary for deep elimination. Mutual knowledge only supports one round - that's worth a concrete example. Maybe a three-step game where CK gets you to round 3 but MK only to round 1.

  For the solution concept preservation, the correlated vs independent conjectures fracture matters. With correlated, rationalizability equals mixed dominance. Without, it's weaker in n>2 games. The Borgers proof is relevant here.

  Infinite domains require special handling. Textbooks often pretend all games are finite. We owe students the truth: some rules break down with continua, and the literature uses upper hemicontinuity fixes.

  On tractability: pure strict dominance is sometimes the only feasible method for large games. That's a practical compromise we must acknowledge - theoretical purity versus computability.

  The user's suspicion about incompatible desiderata is spot-on. I'll prove it via: 
  1) Weak dominance isn't order-independent (e.g., different elimination sequences yield different results) 
  2) It can delete Nash equilibria (Myerson's game) 
  3) But order-independent rules like IESDS for strict dominance preserve all Nash. 
  So yes, those three can't coexist.

  For the scorecard, I'll emphasize: 
  - Pure strict: safe but weak 
  - Mixed strict: EU-dependent but strong 
  - Weak: useful but dangerous 
  - Correlated rationalizability: powerful but knowledge-heavy 
  - Independent rationalizability: robust but weaker

  This structure should give them both the theoretical backbone and practical guidance they need for rewriting.
answer: |-
  Here is a specification of desiderata for legitimate iterated elimination procedures in finite normal-form games, designed to address your concerns. Requirements are non-negotiable unless marked as "preference."

  ### **Core Desiderata**
  1. **Behavioral Assumptions & Mixed Strategies**  
     - **Requirement:** If a strategy is deleted via mixed-strategy dominance, players must have preferences linear in probabilities (expected utility). Actual randomization is *not* required; the deletion relies on the player *considering* mixtures, not necessarily implementing them.  
     - **Non-Negotiable?** YES. Without EU, "dominance" is undefined.  
     - **Counterexample:** In a game with EU violations (e.g., Allais paradox payoffs), a strategy "dominated" by a mixture may be chosen.  
     - **Hand-Checkable Game:**  
       ```
       Player 2
         L    R
       U 3,3  0,0
       D 0,0  1,1
       ```
       For Player 1, U is strictly dominated by a 50-50 mix of D and U? *No*—without EU, Player 1 might strictly prefer U (seeking $3) over a gamble.

  2. **Source of Deletion Reason**  
     - **Requirement:** Deletions must be justifiable *from the perspective of the player* whose strategy is removed. An outside observer's inference (e.g., "others are rational") is insufficient unless it becomes mutual knowledge.  
     - **Non-Negotiable?** YES. Deletions based on others' actions require those actions to be *credible* to the player.  
     - **Counterexample:** In a 3-player game, deleting Player 1's strategy because "Players 2 and 3 won't play X" requires Player 1 to know this.

  3. **Epistemic Premises**  
     - **Requirement:** Round *k* deletion requires *mutual knowledge of rationality (MKR)* of depth *k*. Common knowledge (CKR) is needed for full iteration.  
     - **Non-Negotiable?** Preference (CKR camp) vs. minimal (MKR camp).  
     - **Counterexample:** With only MKR to depth 2:  
       - Round 1: All delete strictly dominated strategies.  
       - Round 2: All know others did Round 1, so delete newly dominated strategies.  
       - **Round 3 fails** without CKR: Player A doesn't know Player B knows Player A is rational.

  4. **Order-Independence**  
     - **Requirement:** The surviving set must be invariant to elimination order. If not, the rule must specify an order (e.g., "delete all dominated strategies simultaneously each round").  
     - **Non-Negotiable?** Preference (theoretical elegance) but not essential if order is defined.  
     - **Counterexample (Weak Dominance):**  
       ```
       L     R
       U 1,1  0,0
       M 0,0  0,0
       D 0,0  1,1
       ```
       Eliminate U first: D dominates M, then (D,R) survives.  
       Eliminate M first: U weakly dominates D? Ambiguous; different orders yield {U,L} or {D,R}.

  5. **Preservation of Solution Concept (Nash Equilibrium)**  
     - **Requirement:** No Nash equilibrium (NE) may be deleted. For dominance-based rules:  
       - Strict dominance: Never deletes any NE (non-negotiable).  
       - Weak dominance: May delete NE (acceptable only if rule explicitly warns users).  
       - Never-best-response (NBR): Preserves NE *if* conjectures allow correlation. With independent conjectures, may preserve only a subset (correlated equilibrium).  
     - **Non-Negotiable?** YES for strict dominance; NO for weak/NBR if caveated.  
     - **Where Dominance ⇏ NBR?** Fails for ≥3 players with independent conjectures:  
       - In 3-player games, a strategy can be strictly dominated but still a best response to independent mixtures (Fudenberg & Tirole, 1991).  
       - With correlated conjectures, "strictly dominated" ⇔ "never a best response" (Pearce, 1984).

  6. **Domain of Games**  
     - **Requirement:** For infinite games, the rule must specify:  
       (a) Continuity/compactness assumptions (e.g., upper semicontinuous payoffs).  
       (b) Whether transfinite iteration is allowed (beyond finite rounds).  
     - **Non-Negotiable?** YES for clear domain specification.  
     - **Counterexample:** In an infinite game, iterated deletion may require ω+1 steps (e.g., "centipede" with continuum strategies).

  7. **Tractability vs. Deletion Power**  
     - **Requirement:** A rule leaving "too many" strategies must justify its use (e.g., "preserves all refinements" or "computationally feasible"). Conversely, aggressive rules must prove they don’t distort equilibria.  
     - **Non-Negotiable?** Preference (context-dependent).  
     - **Example:** Mixed-strategy dominance is NP-hard for large games; pure-strategy dominance is polynomial but may delete little.

  ---

  ### **Which Requirement Excludes Most Candidates?**  
  **Epistemic Premises.** Rules assuming CKR (e.g., correlated rationalizability) fail in games where players doubt others' knowledge depth. Rules requiring only MKR (e.g., cautious IEWDS) are more robust but delete less.

  ---

  ### **Are Order-Independence, Weak Dominance, and NE Preservation Jointly Unsatisfiable?**  
  **Yes.** Your suspicion is correct:  
  - **Weak dominance is order-dependent** (see Desideratum 4 counterexample).  
  - **Weak dominance can delete NE**:  
    ```
    A      B
    U 2,2  1,1
    D 1,1  0,0
    ```
    (U,A) is NE. U weakly dominates D. Deleting D removes no NE, but deleting U (if "dominated" by D?) would destroy (U,A). Yet in other games (Myerson, 1978):  
    ```
    Left   Right
    Up    1,1   0,0
    Down  0,0   0,0
    ```
    (Up,Left) is NE. Down is weakly dominated. Delete Down → (Up,Left) survives. But if a third strategy exists, deletion order matters and may kill NE.  
  - **No order-independent IEWDS preserves all NE** (Reny, 1992).  

  Thus, you *cannot* have all three simultaneously. Compromise: Use IEWDS but fix an order (e.g., "simultaneous deletion per round"), accept possible NE loss, and document it.

  ---

  ### **Candidate Scorecard**  
  1. **Pure Strict Dominance (PSD)**  
     *Safe but weak.* Preserves all NE; order-independent; needs only MKR. Fails to delete mixed-strategy equilibria supports.  

  2. **Mixed Strict Dominance (MSD)**  
     *EU-robust workhorse.* Preserves all NE; order-independent. Requires EU and CKR for full power; NP-hard in large games.  

  3. **Weak Dominance (IEWDS)**  
     *Aggressive but risky.* May delete NE and is order-dependent. Justified by "cautious" players (Börgers, 1994); tractability issues.  

  4. **Correlated Rationalizability (CR)**  
     *Epistemically heavy.* Equivalent to MSD in outcomes; preserves correlated equilibria. Needs CKR; may not reflect independent randomization.  

  5. **Independent Rationalizability (IR)**  
     *Realistic but limited.* Surviving strategies are best responses to independent mixtures. Preserves NE but deletes less than MSD/CR in n≥3.  

  ---

  ### **Summary**  
  Legitimate rules must:  
  - Respect EU for mixed dominance,  
  - Justify deletions *to the player*,  
  - Specify epistemic requirements (MKR vs. CKR),  
  - Preserve NE (for strict dominance),  
  - Declare domain assumptions.  

  **Most defensible for applied work:** MSD with simultaneous deletion (preserves NE, order-independent, but needs EU). For weak dominance, use only with explicit caveats. **Avoid** uncritical IEWDS or CR without discussing knowledge assumptions.
