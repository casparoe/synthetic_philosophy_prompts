  Part (b) addresses the response that denies P(E)=1 is appropriate. The bootstrapping worry is key: if S can boost credence to 0.573 just by reviewing old evidence, that seems like illegitimate confirmation. The threshold issue questions where to draw the line between 0.90 and 0.999999. Students should argue that high but non-1 probabilities might allow some confirmation but face reductio concerns, and no clear principle resolves the threshold. A first-class answer would note that this turns confirmation into a psychological artifact rather than an evidential relation.

  In part (c), the Garber approach conditionalizes on H entailing R rather than on R itself. For R1, S already knows the entailment, so it doesn't help. For R7, S could learn the entailment, but this requires prior uncertainty about logical connections. The problem is that this makes confirmation depend on logical ignorance, which is odd for a normative theory. A top answer would link this to whether Bayesianism captures the evidential significance of evidence fitting a theory.

