answer: |-
  ### Exam Question: Formal Epistemology  
  **Module: MA Formal Epistemology**  
  **Time allowed:** 45 minutes  
  **Marks:** 25  
  **Instructions:** Show all working. Calculators are permitted.  

  ---

  **Scenario:**  
  A researcher S is considering a new theory \(H\). Her prior credence is \(P(H) = 0.20\). The lab’s archive contains ten long-standing recorded regularities \(R_1, \dots, R_{10}\), all of which \(H\) entails. S has known about all ten for years and gives each \(R_i\) a prior of \(P(R_i) = 0.90\), regarding them as probabilistically independent. Thus, her prior for the conjunction \(R_1 \land \dots \land R_{10}\) is \(0.9^{10} \approx 0.349\). S has personally derived that \(H\) entails \(R_1\), but she has not checked whether \(H\) entails \(R_7\)—this derivation would take a month of work. Separately, \(H\) entails a novel prediction \(N\) that nobody had thought to look for; a rival theory makes \(N\) somewhat likely, so S’s prior for \(N\) is \(P(N) = 0.25\). \(N\) is then observed.  

  **Question:**  
  (a)  Compute \(P(H|R_1)\), \(P(H|N)\), and \(P(H|R_1 \land \dots \land R_{10})\). For each, state whether the shift in S’s credence constitutes genuine confirmation in the sense relevant to the problem of old evidence. Explain your reasoning briefly.  
  **(8 marks)**  

  (b)  Evaluate the response that denies \(P(E) = 1\) is ever the correct idealisation and insists the boost from \(R_1\) is genuine confirmation. Address two worries:  
  (i) The *bootstrapping worry*: S could raise her credence in \(H\) from 0.20 to ≈0.57 by merely rehearsing ten known consequences of \(H\) armchair. Is this a reductio or a legitimate correction?  
  (ii) The *threshold worry*: If the boost is acceptable at \(P(R_1) = 0.90\), what happens at \(P(R_1) = 0.99\) or \(0.999999\)? What principle determines where the problem arises?  
  **(9 marks)**  

  (c)  Consider the Garber-style approach, where the agent conditionalises on *\(H\) entails \(R_i\)* rather than on \(R_i\) itself. Explain why this route:  
  (i) Does **not** apply to \(R_1\) (as S already knows the entailment);  
  (ii) *Does* apply to \(R_7\) (as S is uncertain of the entailment);  
  (iii) Incurs a cost regarding the required priors over entailment claims.  
  Finally, conclude: Is this problem best seen as a flaw in Bayesian norms, in its idealisations, or in its ability to capture what is evidentially special about theories fitting data?  
  **(8 marks)**  

  ---

  ### Model Answer (≈800 words, British English)  
  **(a)**  
  We use Bayes’ theorem: \(P(H|E) = \frac{P(E|H) \cdot P(H)}{P(E)}\). Since \(H\) entails all \(R_i\) and \(N\), \(P(E|H) = 1\) for all evidence \(E\) here.  

  - **\(P(H|R_1)\)**:  
    \(P(H|R_1) = \frac{P(R_1|H) \cdot P(H)}{P(R_1)} = \frac{1 \cdot 0.20}{0.90} \approx 0.222\).  
    Credence shifts from **0.20 to 0.222**. This is **not genuine confirmation** in the old-evidence sense: \(R_1\) was already highly probable (\(P(R_1) = 0.90\)), so conditionalising on it only slightly adjusts S’s residual uncertainty.  

  - **\(P(H|N)\)**:  
    \(P(H|N) = \frac{P(N|H) \cdot P(H)}{P(N)} = \frac{1 \cdot 0.20}{0.25} = 0.80\).  
    Credence shifts from **0.20 to 0.80**. This **is genuine confirmation**: \(N\) was novel and unlikely (\(P(N) = 0.25\)), so observing it strongly supports \(H\).  

  - **\(P(H|R_1 \land \dots \land R_{10})\)**:  
    \(P(H|\bigwedge R_i) = \frac{P(\bigwedge R_i|H) \cdot P(H)}{P(\bigwedge R_i)} = \frac{1 \cdot 0.20}{0.9^{10}} \approx \frac{0.20}{0.349} \approx 0.573\).  
    Credence shifts from **0.20 to 0.573**. This is **not genuine confirmation** for old evidence: though the conjunction is likelier under \(H\), S already gave each \(R_i\) a high prior (0.90), so the boost arises from correcting underconfidence in known data, not new evidence.  

  **Epistemic difference**: All updates use the same rule, but only \(N\)—the novel, initially improbable consequence—provides significant confirmation. The key factor is \(P(E)\): lower \(P(E)\) amplifies confirmation.  

  **(b)**  
  Denying \(P(E) = 1\) and accepting boosts from old evidence like \(R_1\) faces critical issues:  

  **(i) Bootstrapping worry**: Raising \(P(H)\) to ≈0.57 by reviewing ten *known* consequences armchair seems like a reductio. If valid, S could manufacture confirmation without empirical effort, violating science’s demand for new data. Defenders might argue it legitimately corrects S’s imperfect certainty about \(R_i\) (e.g., if \(P(R_i) < 1\) reflects her epistemic state). However, this conflates *evidence* with *logical recalibration*—S gains no new empirical insight, only adjusts her coherence.  

  **(ii) Threshold worry**: At \(P(R_1) = 0.90\), the boost is small (0.20 → 0.222). At \(P(R_1) = 0.999999\), \(P(H|R_1) ≈ 0.2000008\)—trivially small despite S’s near-certainty. But if confirmation vanishes as \(P(E) \to 1\), where is the threshold? No clear principle exists: it is arbitrary to claim confirmation "stops" at (e.g.) \(P(E) = 0.95\). This undermines the response: if genuine confirmation requires \(P(E) < 1\), it becomes negligible for evidence we are confident about, failing to explain why established data intuitively supports theories.  

  **Conclusion**: The response risks permitting bootstrapping and lacks a non-arbitrary account of when old evidence confirms. It confuses Bayesian coherence with evidential support.  

  **(c)**  
  The Garber approach addresses old evidence by conditionalising on *entailment knowledge* (e.g., \(K_{E_i}\): "\(H\) entails \(R_i\)") rather than \(R_i\) itself.  

  **(i) Inapplicable to \(R_1\)**: S *already knows* \(H\) entails \(R_1\), so \(P(K_{E_1}) = 1\). Conditionalising on \(K_{E_1}\) changes nothing.  

  **(ii) Applicable to \(R_7\)**: S is uncertain whether \(H\) entails \(R_7\) (\(P(K_{E_7}) < 1\)). If she learns \(K_{E_7}\), her credence in \(H\) updates via \(P(H|K_{E_7}) = \frac{P(K_{E_7}|H) \cdot P(H)}{P(K_{E_7})}\).  

  **(iii) Key cost**: This requires non-trivial priors over entailment claims (e.g., \(P(K_{E_7}|H)\)). If S treats entailment as certain given \(H\) (e.g., \(P(K_{E_7}|H) = 1\)), \(P(H|K_{E_7})\) depends on \(P(K_{E_7})\), which may reflect her logical competence. But confirmation now hinges on *logical ignorance*—a poor fit for scientific cases where entailment is known.  

  **Whose problem?** This is primarily a problem for **Bayesianism’s idealisations**. Insisting \(P(E) = 1\) for old evidence ignores realistic uncertainty, but relaxing it creates bootstrapping. Garber’s approach avoids this by shifting to logical learning, but it makes confirmation contingent on agents’ logical limitations, which is unsatisfying for normative epistemology. Bayesianism struggles to capture why *fitting known data* is evidentially inert without novel predictions.  

  ---

  ### Marking Scheme  
  **Total: 25 marks**  
  *(First-class ≥18/25; 2:1 ≥15/25; Pass ≥10/25)*  

  #### Part (a): Computations & Confirmation Status (8 marks)  
  - **Must-hit moves**:  
    - Correct \(P(H|R_1) = 0.20 / 0.90 \approx 0.222\) (2 marks)  
    - Correct \(P(H|N) = 0.20 / 0.25 = 0.80\) (2 marks)  
    - Correct \(P(H|\bigwedge R_i) = 0.20 / 0.349 \approx 0.573\) (2 marks)  
    - Correct confirmation status:  
      - \(R_1\): *not* genuine (old evidence) (1 mark)  
      - \(N\): *is* genuine (novel) (1 mark)  
      - \(\bigwedge R_i\): *not* genuine (old evidence) (1 mark)  
  - **First-class distinction**: Explicitly links epistemic difference to \(P(E)\) (e.g., "confirmation scales inversely with prior certainty").  
  - **Bare pass (4 marks)**: Two correct computations and one correct status.  

  #### Part (b): Evaluating the Response (9 marks)  
  - **Must-hit moves**:  
    - Explains bootstrapping worry: Armchair boost to 0.57 seems illegitimate/reductio (3 marks)  
    - Explains threshold worry: No principled cutoff for when \(P(E)\) blocks confirmation (3 marks)  
    - Concludes the response fails to resolve the problem (1 mark)  
  - **First-class distinction**: Argues that making confirmation depend on \(P(E) < 1\) reduces it to a psychological artifact, not objective evidence.  
  - **Bare pass (5 marks)**: Identifies one worry and offers minimal evaluation.  

  #### Part (c): Garber Approach & Problem Diagnosis (8 marks)  
  - **Must-hit moves**:  
    - Why Garber does **not** apply to \(R_1\) (S knows entailment) (2 marks)  
    - Why Garber *does* apply to \(R_7\) (S uncertain of entailment) (2 marks)  
    - Cost: Requires priors over entailments, ties confirmation to logical ignorance (2 marks)  
    - Diagnoses problem as primarily about **idealisations** (2 marks)  
  - **First-class distinction**: Notes that Garber "solves" old evidence only by making confirmation depend on irrational uncertainty (logical non-omniscience).  
  - **Bare pass (4 marks)**: Identifies asymmetry between \(R_1\)/\(R_7\) and basic problem diagnosis.  

  #### Common Errors (Marks deducted per occurrence):  
  1. **Error**: Claims \(P(H|R_1) = 0.20\) because "old evidence is certain".  
     **Cost**: –1 in (a). **Misunderstanding**: Misapplies certainty idealisation without checking \(P(R_1) < 1\).  

  2. **Error**: After correct calculation, declares \(R_1\) confirms \(H\) because \(P(R_1|H) = 1\).  
     **Cost**: –1 in (a). **Misunderstanding**: Confuses likelihood with confirmation; misses that high \(P(E)\) blocks significant boost.  

  3. **Error**: Uses \(P(\bigwedge R_i) = 0.90\) (not \(0.9^{10}\)).  
     **Cost**: –1 in (a). **Misunderstanding**: Ignores independence assumption for conjunctions.  

  4. **Error**: Conflates old evidence problem with logical omniscience (e.g., "Garber fails because agents should know all entailments").  
     **Cost**: –1 in (c). **Misunderstanding**: Fails to see old evidence is a *distinct* problem even with logical non-omniscience.  

  5. **Error**: Suggests novel prediction \(N\) is unconfirmatory due to low \(P(N)\) (e.g., "\(N\) is too surprising").  
     **Cost**: –1 in (a). **Misunderstanding**: Reverses role of \(P(N)\)—lower \(P(N)\) *strengthens* confirmation when \(N\) observed.  

  ---  
  **Examiner note**: First-class answers synthesise insights across parts (e.g., using (b)’s threshold worry to critique Garber in (c)). Bare passes show minimal technical accuracy but lack critical analysis.
