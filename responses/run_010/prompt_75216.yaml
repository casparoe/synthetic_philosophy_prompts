  ### How to use this:  
  This flowchart sorts by what you would say about concrete cases, not by what you call your view. Follow the branches by choosing the option that matches your reaction to each scenario. If you encounter an unfamiliar term, it is defined in parentheses right there.

  ---

  ### Flowchart: Which View Do You Actually Hold About Bootstrapping?

  **Node 1: Classic Gas Gauge Case**  
  A driver checks their fuel gauge 100 times. Each time, they independently verify the actual tank level (e.g., by the odometer or fill-ups) and record both. They then reason: "The gauge reading matched the tank level 100 times, so the gauge is reliable." Is this reasoning acceptable?  
  - **Yes** → Node 2  
  - **No** → Node 5  

  **Node 2: Self-Certifying Archive Case**  
  An AI system classifies images and writes a self-assessment note for each batch (e.g., "I was 95% accurate"). All data (labels and notes) come from the system. A year later, someone reasons from the archive: "The notes say the system was accurate, and the labels match, so the system is reliable." Is this reasoning acceptable?  
  - **Yes** → Node 3  
  - **No** → Node 4  

  **Node 3: Degradation Case**  
  Suppose the AI system is retrained over generations using its own outputs, so the archive data becomes noisier. When reasoning from this degraded archive, what happens to warrant (support) for "the system is reliable" across iterations?  
  - **Warrant decays** (weakens over time) → Leaf: **Reliabilist View**  
  - **Warrant stays flat** (unchanged) → Leaf: **Permissivist View**  
  - **Warrant compounds** (strengthens over time) → Leaf: **Optimistic Coherentist View** (empty)  

  **Node 4: Amnesiac’s Notebook Case**  
  A driver kept a notebook comparing gauge readings (column A) and actual tank levels (column B), where column B was filled via independent checks. Years later, they forget column B was independent and believe it came from the gauge. They reason: "Column A and B matched 100 times, so the gauge is reliable." Is this reasoning acceptable?  
  - **Yes** → Leaf: **Moderate Conservatism**  
  - **No** → Leaf: **Strong Conservatism** (empty)  

  **Node 5: What Fails in the Gas Gauge Case?**  
  The reasoning fails to provide:  
  - **Knowledge but might be justified** (true belief with support) → Node 6  
  - **Justification or both** (no support, regardless of truth) → Node 7  

  **Node 6: Why Does Knowledge Fail?**  
  The failure occurs because:  
  - **Transmission fails** (premises don’t pass knowledge due to circularity) → Leaf: **Closure Denier**  
  - **Premises depend on unreliability** (knowing premises assumes reliability) → Leaf: **Presuppositionist View**  

  **Node 7: Why Does Justification Fail?**  
  The lack of justification is due to:  
  - **A general constraint** (no source can justify itself) → Leaf: **No Bootstrapping Principle**  
  - **Misrepresentation** (reasoner treats evidence as independent when it isn’t) → Leaf: **Misrepresentation View**  
  - **No basic warrant** (no source is ever justified initially) → Leaf: **Global Skeptic**  

  ---

  ### Leaf Descriptions  
  Each leaf provides (a) the view’s name, (b) its most awkward commitment, and (c) a tiebreaker case to distinguish it from the nearest leaf.  

  1. **Reliabilist View**  
     - (a) Standard name: Reliabilism  
     - (b) Awkward: Circularity is irrelevant if the process is reliable, but warrant decays if reliability drops.  
     - (c) Tiebreaker: In the amnesiac case, warrant holds if the notebook was reliable (real history matters).  

  2. **Permissivist View**  
     - (a) Standard name: Permissivism  
     - (b) Awkward: Allows circular justification to create knowledge from arbitrary starts.  
     - (c) Tiebreaker: In the amnesiac case, warrant holds regardless of the reasoner’s belief (only real history matters).  

  3. **Optimistic Coherentist View (empty)**  
     - (a) Descriptive label: Optimistic Coherentist  
     - (b) Awkward: Warrant compounds even as data degrades, ignoring noise accumulation.  
     - (c) Tiebreaker: In the amnesiac case, warrant holds if the notebook is coherent (ignores history).  
     - Note: Empty because coherent but deeply unattractive (warrant shouldn’t grow with decay).  

  4. **Moderate Conservatism**  
     - (a) Descriptive label: Moderate Conservatism  
     - (b) Awkward: Bootstrapping only works with real independent checks, even if the reasoner is ignorant.  
     - (c) Tiebreaker: In the archive case, it fails due to no real independence.  

  5. **Strong Conservatism (empty)**  
     - (a) Descriptive label: Strong Conservatism  
     - (b) Awkward: The reasoner must know checks are independent, or bootstrapping fails.  
     - (c) Tiebreaker: In the archive case, it fails due to no reasoner awareness.  
     - Note: Empty because unexplored—someone should write the paper.  

  6. **Closure Denier**  
     - (a) Standard name: Closure Denier  
     - (b) Awkward: Knowledge isn’t closed under deduction (good reasoning can’t extend knowledge).  
     - (c) Tiebreaker: In iteration, each step fails transmission independently.  

  7. **Presuppositionist View**  
     - (a) Standard name: Presuppositionism  
     - (b) Awkward: Premises can’t support reliability without assuming it first (regress problem).  
     - (c) Tiebreaker: In the archive case, failure is identical to classic (same dependence).  

  8. **No Bootstrapping Principle**  
     - (a) Standard name: No Bootstrapping Principle  
     - (b) Awkward: No source can justify itself, risking skepticism if no independent access.  
     - (c) Tiebreaker: Iteration makes circularity more glaring but doesn’t change the flaw.  

  9. **Misrepresentation View**  
     - (a) Descriptive label: Misrepresentation View  
     - (b) Awkward: Diagnoses failure where none exists (e.g., classic case has real independence).  
     - (c) Tiebreaker: In the amnesiac case, it fails due to reasoner’s false belief about evidence.  

  10. **Global Skeptic**  
      - (a) Standard name: Global Skeptic  
      - (b) Awkward: Denies basic knowledge, making bootstrapping the least of the problems.  
      - (c) Tiebreaker: Iteration changes nothing—no warrant at any stage.  

  ---

  ### Notes on Indistinguishable Leaves  
  - **Closure Denier vs. Presuppositionist**: These may agree on cases; the tiebreaker (iteration behavior) is the only difference.  
  - **No Bootstrapping Principle vs. Global Skeptic**: Both reject all cases; the real difference is whether justification is possible elsewhere.  
  - **Moderate vs. Strong Conservatism**: Distinguished only by the amnesiac case; both reject the archive.  

  ### Empty Leaf Notes  
  - **Optimistic Coherentist View**: Coherent but deeply unattractive—compounding warrant with decay is implausible.  
  - **Strong Conservatism**: Coherent but unexplored—no one has defended it, though it’s consistent.
