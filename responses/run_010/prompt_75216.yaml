  The twist, and the reason I'm bothering: every version of this map I've seen sorts people only on the one-shot question, but the ML half of the room only cares about what happens under *iteration*, so build the tree so that the iteration joints are load-bearing rather than decorative. Three cases of mine that I want you to work into the nodes. First, the self-certifying archive: a pipeline classifies images and also writes, for each batch, a note about how accurate it took itself to be; a year later someone infers the pipeline is accurate from the notes plus the labels, where all of the labels were themselves produced by the pipeline. Is that structurally the same as one round of bootstrapping or a different animal, and does your view care? Second, the amnesiac's notebook: a driver keeps two columns, gauge reading and actual tank level, and the second column really was filled in from genuinely independent checks (odometer, fill-ups) — but years later she's forgotten that and reasons from the notebook believing the second column just came from the gauge. Does the conclusion inherit the etiology the premises actually have, or the etiology she thinks they have? Third, degradation: suppose each generation of the archive trains partly on the previous generation's output, so the record you reason from gets noisier and less informative over time even though the shape of the reasoning never changes. Does your view predict warrant decays across iterations, stays flat, or — bizarrely — compounds?

  On the joints I want cut, roughly: whether warrant for a source's reliability can come from that source's own deliverances at all; if not, whether the culprit is a general constraint on reasoning or something about this particular evidence; whether what goes wrong is a failure to gain *knowledge* or a failure to gain even *justification* (I want that gap to be its own node, because I think a couple of positions live entirely inside it and get flattened by the usual maps); whether the reasoner's own view of where her premises came from matters or only the real history; and whether repeating an inference whose premises are products of earlier iterations can dilute or consume warrant, i.e. whether the account is monotone. Make sure the leaves include at least: the permissivist who says the reasoning is fine and the queasiness is a cost worth paying; the conservative/entitlement-style view on which warrant for a source can't be had from the source's own outputs; a closure-denying diagnosis; a no-bootstrapping-principle diagnosis; a reliabilist one; a coherentist one; the misrepresentation-flavored one where the reasoning goes wrong because the reasoner represents her evidence as better supported than it is; and the straight skeptic who takes all this to show there's no basic knowledge. Then, since you're building from the logical space rather than from a list of names, give me at least two leaves that are combinations nobody actually defends — including one that handles my archive case and one that handles the amnesiac — and for each say whether the cell is empty because the view is incoherent, because it's coherent but deeply unattractive, or because it's just unexplored and someone should write the paper. Finally, flag explicitly any pair of leaves your tree can't genuinely separate; I'd much rather have a note saying "these two come out identically on every node, the real difference is somewhere else" than a fake distinction dressed up as a branch. Oh and start the