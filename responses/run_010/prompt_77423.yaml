  I'm applying for a one-year postdoc and need to turn a half-baked idea into a fundable proposal (~1500 words). The idea: basically every discussion of the separateness of persons objection treats it as an attack on *aggregation* — utilitarianism sums over persons and is therefore blind to how the total is distributed. But additive aggregation is also what prioritarianism does, and what plenty of non-consequentialist views do, so if additivity were really the problem the objection would demolish far more than utilitarianism. My hunch is that the actual target is narrower: whether a loss to one person can be offset by a gain to another. It's that permission, not the arithmetic, that offends. And then there's the awkward parallel — nearly everyone accepts offsetting accross time inside a single life, so whatever marks the difference has to be either the lack of one subject who lives through both sides, or the lack of consent, and I want to know which of those is load-bearing.

  Please write it up: a precise statement of the question, one that actually has a determinate answer; why the standard statement of the objection and the standard utilitarian replies both leave that question open; what I'd do month by month, including whether the split-brain and advanced-dementia cases can really separate the no-unified-subject explanation from the no-consent one, and if they can't, what could; why this route instead of just stacking another intuition pump on the pile; what a positive result would look like; what would count as the project failing; and an honest note on what's too big for twelve months. No citations or bibliography, I'll add those myself.

  Last line, exactly: \question{...} with the research question in one sentence of 30 words or fewer.
