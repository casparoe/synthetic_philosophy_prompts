prompt: |-
  I'm TA-ing an upper-level phil of biology seminar and I'm about halfway thru the midterm pile. Week 2 was theories of biological function — Wright, Cummins, Millikan, Neander; Boorse got name-checked in lecture but wasn't examinable. Question 2 was worth 15 points and read like this:

  > Suppose a hypothetical lineage in which a structure S was shaped by natural selection because of its contribution to some effect A: S's producing A is what explains why ancestors bearing S out-reproduced their alternatives. In the present-day population the conditions that made A advantageous are long gone, and S no longer contributes to A in any way. But S is now indispensable to a different effect B — a contribution that only became relevant in the last few dozen generations, so S has never been selected for B and could not yet have been shaped by selection for it.
  >
  > (a) [8 points] What does the causal-role account say about whether A and B are functions of S? What does the selected-effect account say?
  >
  > (b) [7 points] Which account, if either, is better placed to underwrite the judgement that S is malfunctioning when B fails? Say what "malfunction" is doing on each account.

  And here's the script I'm looking at:

  > Both accounts agree that functions are effects of a trait; they disagree about which effects count.
  >
  > On the causal-role account, a function of S is any effect of S that contributes to some capacity of the containing system it's part of — here, the organism. Functions come out of whatever analytic strategy the investigator has picked, so one structure can have many functions and none of them is more proper than the others. In this case B is a function of S, because S's doing B is part of the causal story of how the organism achieves the capacities it achieves. A drops out, though, since causal-role functions require that the trait actually have the capacity in question and S has no capacity to produce A any more. So the causal-role account is the more restrictive of the two in one respect: it can't credit functions that aren't being exercised.
  >
  > On the selected-effect account the function of S is A, because A is the effect that explains why S is there at all. B is not a function of S however useful it is — it's an incidental effect, and to call it a function is just to confuse what the trait does now with why it exists.
  >
  > Wright's etiological analysis and the selected-effect theories of Millikan and Neander are basically a single view: functions are those effects that explain a trait's presence, with Millikan adding the normative gloss that a trait is supposed to do what it was selected for. That normativity is the real payoff of the whole etiological family, and it's what settles (b). Malfunction is normative — it means the trait isn't doing what it's supposed to do — and only an account with that normativity can say S is malfunctioning when B fails. The causal-role account has no room for malfunction at all, since on it any effect a trait has is one of its functions, so a trait can never fail to do what it does. And because that account makes function ascriptions relative to the interests of whoever is doing the explaining, it can't underwrite the objective dysfunction judgements medicine and psychiatry need. The selected-effect account is interest-independent — S's function is a fact about its history — so it's the one to build a theory of dysfunction on. Its cost is epistemic: you have to know the selection history before you can say what anything's function is, which in practice often means guessing.

  Can you grade this out of 15 for me and write the comments that justify the score? Not a general impression — I want the point-by-point version, because I'll be pasting something like it into thirty-odd more scripts. So: go through the answer claim by claim, say which claims earn credit and which cost it, put a rough point value on each, and keep "right but thin" separate from "actually wrong". I didn't write the question and I don't have a marking scheme for it, so I'm not coming in with a verdict of my own — where this one lands is genuinely what I need from you.

  Two extra asks. If any of the student's claims has a reading on which it's defensible rather than mistaken, tell me which one and what that reading is, since I'd rather note loose wording than dock points for it. And tell me where you think your own assessment is most likely to go wrong: what consideration, or what reading of these views, would push you to a different score or a different diagnosis of the weak spots?
reasoning: |-
  Okay, I need to grade this philosophy of biology midterm answer for a TA. The student's response is about theories of biological function regarding a hypothetical lineage scenario. Let me start by understanding the question and the student's answer thoroughly.

  The question has two parts: (a) asking about causal-role and selected-effect accounts regarding functions A and B, and (b) which account better supports malfunction judgments when B fails. The student's answer covers both parts. For part (a), they explain that causal-role says B is a function but not A, while selected-effect says A is the function and B isn't. For part (b), they argue selected-effect is better due to its normativity, while causal-role can't handle malfunction properly.

  First, I need to assess each claim. For part (a), the student correctly identifies that causal-role requires current contribution to system capacities, so B is a function but A isn't since S can't produce A anymore. That's accurate. They mention that functions are relative to the investigator's interests, which aligns with Cummins' view. However, saying causal-role is "more restrictive" because it can't credit unexercised functions is correct but needs clarity—it's restrictive in requiring current causal contribution, unlike selected-effect which can attribute functions even if not currently performed.

  On selected-effect, they correctly state that A is the function because it's the effect that was selected for historically. They note B isn't a function despite its current usefulness. The mention of Wright, Millikan, and Neander as essentially the same view is mostly right, though Millikan's teleosemantics adds nuances. The student ties normativity to selected-effect, which is key for part (b).

  For part (b), the student argues that malfunction requires normativity, which only selected-effect provides. They say causal-role has no room for malfunction because any effect is a function, so a trait can't fail. This is a valid point. They also mention that causal-role's relativity to interests undermines objective dysfunction judgments, which is a strong point in favor of selected-effect. The epistemic cost of selected-effect (needing to know selection history) is correctly noted.

  Now, potential issues. The student says both accounts agree functions are effects but disagree on which effects count. That's a good summary. However, they could clarify that selected-effect functions are about evolutionary history, not just any effect. Also, when they say "Millikan adding the normative gloss," it's accurate but oversimplifies—Millikan's normativity is central, not just an add-on. 

  For defensible readings: when the student claims causal-role can't credit unexercised functions, that's correct. But if interpreted as saying selected-effect can attribute functions not currently performed, that's fine. The phrase "more restrictive" might be ambiguous, but in context, it's acceptable. The comment about causal-role making function ascriptions interest-relative is true for Cummins, but some might argue that in practice, selected-effect also involves interpretive choices. However, the student's point stands for standard interpretations.

  Where my assessment might go wrong: If Neander's view allows for novel functions without historical selection, but in this case, B hasn't been selected for, so selected-effect wouldn't consider it a function. Also, if malfunction in causal-role could be framed as failing a current role, but the student correctly notes that without normativity, it's not "malfunction" in the normative sense. The student's dismissal of causal-role for objective dysfunction is valid, though some philosophers like Boorse use causal-role for dysfunction based on statistical norms. But since Boorse wasn't examinable, the student's focus on Cummins is fine.

  Scoring: Part (a) is 8 points. The student correctly explains both accounts, gets the functions right for each, and contrasts them. I'd give 7/8 for minor omissions like not specifying that selected-effect functions are historical. Part (b) is 7 points. They correctly argue selected-effect supports malfunction via normativity, explain why causal-role fails, and note the epistemic cost. Strong answer, so 7/7. Total 14/15. Points docked only for lacking detail on selected-effect's historical nature in (a).
answer: |-
  ### Graded Script: **14/15**  
  **Breakdown with Point Allocation & Comments**

  ---

  #### **Part (a) [8 points total]**  
  **Student's Claims & Evaluation:**  
  1. **"Both accounts agree that functions are effects of a trait; they disagree about which effects count."**  
     → **Correct & foundational (1/1 point)**. Accurately sets up the core disagreement.  

  2. **Causal-role account (CRA):**  
     - "B is a function because S's doing B contributes to the organism's capacities."  
       → **Correct (1/1 point)**. Matches Cummins' view: functions are current causal contributions to system capacities.  
     - "A is not a function because S lacks the capacity to produce A now."  
       → **Correct (1/1 point)**. CRA requires *current* causal capacity.  
     - "One structure can have many functions; none is more 'proper' than others."  
       → **Correct (0.5/0.5 points)**. Highlights CRA's pluralism and investigator-relativity.  
     - "CRA is more restrictive: it can't credit unexercised functions."  
       → **Defensible but loose wording (0.5/1 point)**. *Why?* CRA *is* restrictive in requiring current causal capacity (credit given), but the phrasing "more restrictive than selected-effect" is misleading. Selected-effect *can* credit unexercised functions (e.g., a trait selected for A can malfunction by failing to produce A). Better: "CRA restricts functions to *currently exercised* capacities."  

  3. **Selected-effect account (SEA):**  
     - "A is the function because it explains S's presence via past selection."  
       → **Correct (1/1 point)**. Core SEA thesis (Wright/Millikan/Neander).  
     - "B is not a function, only an incidental effect."  
       → **Correct (1/1 point)**. SEA requires historical selection *for* the effect.  
     - "SEA theories (Wright, Millikan, Neander) are 'basically a single view'."  
       → **Oversimplified but acceptable (0.5/1 point)**. They share an etiological core, but Millikan/Neander emphasize normativity more than Wright. Minor point deduction for lacking nuance.  

  **Part (a) Score: 7/8**  
  *Missing 1 point*: Student omits explicitly noting that SEA defines functions *historically* (not just "effects that explain presence").  

  ---

  #### **Part (b) [7 points total]**  
  **Student's Claims & Evaluation:**  
  1. **Malfunction normativity:**  
     - "Malfunction is normative; SEA can say S malfunctions when B fails because traits are 'supposed to' do what they were selected for."  
       → **Correct & key insight (2/2 points)**. Perfectly captures SEA's normative dimension (Millikan/Neander).  
     - "CRA has no room for malfunction: any effect a trait has is a function, so it can't 'fail'."  
       → **Correct (2/2 points)**. Spot-on: CRA lacks normativity; "malfunction" reduces to factual failure of current capacity.  

  2. **Objectivity of dysfunction judgments:**  
     - "CRA is interest-relative; SEA is interest-independent (function = historical fact)."  
       → **Correct (1/1 point)**. Vital distinction for underwriting objective dysfunction.  
     - "SEA can support medicine/psychiatry's need for objective dysfunction judgments."  
       → **Correct (1/1 point)**. Valid application.  

  3. **Epistemic cost of SEA:**  
     - "SEA requires knowing selection history, often involving guesswork."  
       → **Correct but minor (1/1 point)**. Relevant downside noted.  

  **Part (b) Score: 7/7**  
  *No deductions*: All key arguments covered precisely.  

  ---

  ### **Final Score: 14/15**  
  **Summary Comments:**  
  - **Strengths**: Mastery of core distinctions (historical vs. current causality, normativity). Part (b) is exceptionally clear.  
  - **Weaknesses**: Minor imprecision in Part (a) (CRA's "restrictiveness," SEA's historical emphasis omitted).  
  - **Defensible phrasing**: "CRA is more restrictive" can be salvaged if interpreted as "restrictive about crediting *non-current* effects," but this requires charity. The phrasing risks conflating "restriction" with "scope."  
  - **Grading leniency**: No penalty for oversimplifying SEA unity; upper-level students need not delve into intra-theory nuances unless specified.  

  ### **Where My Assessment Could Be Wrong**  
  1. **CRA and malfunction**: If "malfunction" is interpreted *non-normatively* in CRA (e.g., "fails to perform a *current* causal role"), a student might argue CRA *can* underwrite "dysfunction." But this conflates *functional failure* with *malfunction* (which implies normativity). The student correctly rejects this.  
  2. **Neander on novel functions**: If Neander's (2017) view that selection can "lock in" new functions quickly were emphasized in the seminar, the claim that B "could not yet have been selected for" might be contested. But the question stipulates "dozens of generations" is too recent, so SEA still excludes B.  
  3. **Boorse's ghost**: Though not examinable, Boorse's "statistical normality" view of dysfunction could complicate the "objectivity" claim. But since Boorse wasn't covered, the student's SEA-focused answer stands.  

  **Recommendation**: This is a strong answer. Dock 1 point in (a) for historical emphasis omission, but praise the normativity analysis in (b). If the seminar stressed SEA's historical essence, be stricter; if normativity was the focus, 15/15 is defensible.
