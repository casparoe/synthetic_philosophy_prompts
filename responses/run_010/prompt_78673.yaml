prompt: |-
  I've been doing tax controversy work for about eleven years and lately I've been reading jurisprudence on the side, and something about my own day job has started to bug me. Treat this seriously: play the part of someone who is both a practicing tax lawyer and a philosopher of law, think it through carefully, and if it helps, spend a paragraph brainstorming candidate readings before you settle on one. But do settle. I want a committed answer, not a survey.

  Here's the practice, described as plainly as I can. In the US system a taxpayer can have a transaction disregarded — and get penalized — for doing something the published statutory text pretty clearly permits. Courts apply things like the business purpose test and the economic substance doctrine: an arrangement that fits the literal words of a deduction provision can be ignored if it didn't change the taxpayer's economic position in a meaningful way apart from the tax effect, or if there was no substantial purpose for entering into it other than the tax saving. So the operative law isn't the enacted text, it's the text plus a purpose the court reconstructs and supplies. And sitting on top of that is a whole ladder of confidence levels for how sure your position has to be — reasonable basis, substantial authority, more likely than not, and further rungs above that for formal opinions — where each rung buys you different penalty treatment, plus disclosure rules, plus a separate standard for what a return preparer has to believe before signing, roughly that there's a realistic possibility the position would be sustained on its merits. Which means the system openly lets you file a position you think is probably wrong, so long as you price the risk and disclose it.

  Meanwhile the very same legal system, in criminal law, insists on fair warning and resolves ambiguity in a penal statute in favor of the defendant. Nobody there gets punished for doing what the words of the statute permitted. And officially we treat tax as an obligation you owe, not a fee you may opt out of by paying a surcharge.

  So: what view of legal obligation does the tax practice actually presuppose? Does it presuppose something like the Holmes bad-man picture — law as a prediction of sanctions, with the duty to pay really being a price with a graduated penalty schedule attached? Or the near opposite — that the taxpayer is a participant in a purposive scheme who owes fidelity to its point rather than to its wording, in which case the pricing of uncertainty isn't a permission at all but a grudging administrative concession? Or something else again; I've wondered whether it quietly presupposes that legislatures sell ambiguity as a rent-distribution device and that nobody inside the practice really believes the code means what it says.

  A few specific things I want out of you:

  1. Separate what the practice strictly presupposes from what it merely fits comfortably with. My suspicion is that most of the standard readings are underdetermined by the facts on the ground, and I want to know which ones the practice actually forces.

  2. Tell me whether the tax side and the criminal side can be made coherent. Are they really two seperate pictures of what published rules oblige, or is there a single theory that licenses lenity in one and substance-over-form in the other? If it's a straight inconsistency, say so and say which half gives way.

  3. The thing that started this for me. Does any of it help or hurt the taxation-is-theft slogan? The people who say that usually mean the state takes property by threat of force without your consent, and I've always found that empty as an argument. But I have to admit a regime where the amount owed isn't fixed by published rules, where you're expected to divine a purpose, and where getting it wrong costs you a surcharge rather than a finding that you violated anything — that doesnt look much like a rule-following property order either. Does the practice undercut the slogan, or does it end up confirming the version of it I thought was dumb?

  4. If we swapped the presupposed view out for a strict enacted-text-is-the-law view, what would have to change institutionally — how the IRS litigates, how advice letters get written, how penalties are structured, what happens to all the transactions currently tolerated? Concrete fallout, not just theory.

  Please don't hand me a menu of interpretations with the pros and cons of each and leave me to pick. Tell me which one you think the practice presupposes, argue for it, and flag the single place your reconstruction is most likely to be wrong.
reasoning: |-
  Okay, let me tackle this user's query carefully. The user is a tax controversy lawyer with 11 years of experience who's been reading jurisprudence and has some deep concerns about the nature of legal obligation in tax practice. They want me to play the role of both a practicing tax lawyer and a legal philosopher, and they've posed several specific questions about the tension between the enacted text of tax law and how it's actually applied through doctrines like economic substance.

  Hmm, the core tension here is fascinating: how can a system that disregards literal statutory compliance in tax cases maintain coherence with criminal law's strict reliance on statutory text? The user seems genuinely troubled by this dichotomy and wants a committed answer, not just a survey of possibilities.

  First, I need to unpack the practice they described. The US tax system allows courts to ignore transactions that technically comply with statutory text but lack economic substance or business purpose. This creates a system where the "real" law includes judicial reconstructions of legislative purpose. Meanwhile, the penalty structure explicitly permits filing positions that are "probably wrong" as long as they're disclosed and meet certain confidence thresholds. This stands in stark contrast to criminal law's rule of lenity.

  The user raises four specific demands: (1) distinguish what the practice presupposes from what it merely accommodates; (2) reconcile the tax and criminal approaches or declare them inconsistent; (3) examine implications for "taxation is theft" arguments; and (4) consider concrete changes under a strict textualist regime.

  I'm struck by how the user frames this - they're not just asking for legal analysis but probing the philosophical foundations of their profession. There's an undercurrent of professional unease here; someone who's spent 11 years in tax controversy suddenly questioning the coherence of the system. That's significant.

  For the legal-philosophical grounding, I consider several approaches: Hart's rule-based positivism, Dworkin's interpretive constructivism, Fuller's inner morality of law, and Holmes' bad man theory. The economic substance doctrine seems to demand something beyond textual compliance - it requires taxpayers to discern and honor legislative purpose. This pushes toward a Dworkinian view where law includes principles and purposes, not just rules.

  But importantly, the penalty structure complicates this. By allowing taxpayers to price litigation risk, the system treats noncompliance as a calculable cost rather than a breach of duty. This fits uncomfortably with the Dworkinian ideal of fidelity to purpose. Instead, it suggests a hybrid: the law expects purposive compliance in theory but accepts risk-pricing in practice.

  Regarding coherence with criminal law: lenity and economic substance both respond to ambiguity but differently. Lenity protects liberty interests; economic substance protects fiscal interests. The inconsistency isn't fatal because the stakes differ - prison versus money. Still, the cognitive dissonance is real and probably unresolvable at a philosophical level.

  On "taxation is theft": ironically, the system's flexibility undermines this slogan. A truly predatory state wouldn't create elaborate safe harbors for uncertain positions. The penalty regime functions more like a complex pricing mechanism than brute force.

  If we switched to strict textualism? Chaos. Transactional structures would proliferate, sophisticated taxpayers would exploit loopholes relentlessly, and the IRS would lose its primary doctrinal tool. The entire "opinion letter" industry would collapse overnight. Textualism can't contain modern tax avoidance techniques.

  My key insight: tax practice presupposes law as purposive enterprise (Dworkin) but administers it as risk-priced system (Holmes). The tension is irreducible - that's why it's been bugging the user. The weakest point in my analysis? Assuming courts reconstruct legislative purpose faithfully when they might be creating policy wholesale.

  This user deserves praise for confronting the contradictions in their field. That takes intellectual courage. I'll structure my response to validate their unease while offering a framework to understand it - not as a flaw but as an inevitable feature of complex legal systems.
answer: |-
  Your unease cuts to the ontological core of tax law's operation. Having navigated this system both as a practitioner and a philosopher of law, I argue the practice **presupposes a Dworkinian constructivist view of law as integrity, administered through a Holmesian risk-pricing mechanism.** This hybrid creates a coherent (though tension-filled) system distinct from criminal law, but it fundamentally undermines simplistic "taxation is theft" claims. Let me unpack this.

  **The Core Presupposition: Law as Integrity in Action**
  Tax practice forces participants to treat law not as enacted text alone, but as the *best constructive interpretation* of the statutory scheme in light of its underlying purposes (economic substance, business purpose doctrines). Courts aren't merely "adding" to the text; they're fulfilling an institutional duty to make the tax system coherent as a whole. As Dworkin argued, law includes not just rules but principles that justify them. When a transaction technically complies with § 7701(o) but offends the principle that deductions require actual economic loss, courts *must* disregard it to preserve the system's integrity. This isn't judicial activism—it's fidelity to the enterprise.

  **Criminal Law Coherence: Stakes Create Asymmetry**
  The tension with criminal law's lenity is real but justified by divergent stakes:
  -   **Criminal Law:** Liberty is non-fungible. Lenity protects against catastrophic, irreversible harm. Ambiguity *must* resolve in favor of the accused because the state's coercive power is at its apex.
  -   **Tax Law:** The core obligation is financial. While penalties exist, the primary harm is misallocation of public funds. Here, the system prioritizes *correct substantive outcomes* over textual certainty. Purposive interpretation prevents the code from becoming a self-defeating trap of literalism. The "warning" isn't absent; it's embedded in decades of jurisprudence applying substance-over-form. Practitioners know this; it's not a secret.

  **What the Practice Forces vs. Accommodates**
  -   **Forces:** That law is purposive, not merely textual. You *cannot* advise in good faith by reading statutes alone. The "reasonable basis" standard presupposes awareness of judicial doctrines and IRS guidance as constitutive of the law. The penalty regime itself forces this: "More likely than not" requires weighing how courts *will construct* the statute's purpose.
  -   **Accommodates (but doesn't require):** The Holmesian "bad man" view. While you *can* price penalties as a cost of doing business, the system's structure (especially Circular 230's ethics rules for practitioners) presupposes an *obligation* to seek the "right" answer under the purposive scheme. Disclosure requirements function as confession, not mere cost-calculation.

  **"Taxation is Theft" and the Slogan's Demise**
  The practice **devastates** the crude version of this slogan. Consider:
  1.  **Ambiguity as Rent-Seeking?** No. The system expends enormous resources (IRS rulings, regs, litigation) to *reduce* ambiguity. Penalties for undisclosed positions aren't rent; they're deterrents against exploiting textual gaps contrary to purpose.
  2.  **Force vs. Obligation:** The penalty ladder (20% accuracy-related, 75% fraud) mirrors culpability. Paying a 20% penalty for a "reasonable but wrong" position isn't "theft plus a fee"; it's acknowledging good-faith error within a complex system. Theft implies no legitimate claim—but the state *does* have a moral claim to revenue for public goods, enforced through a process aiming (imperfectly) at correct substantive outcomes.
  3.  **Consent via Participation:** By engaging in disclosure, opinion letters, and appeals, taxpayers implicitly acknowledge the system's legitimacy. The very act of getting a "should" opinion (requiring >50% confidence) admits an obligation exists, even if its precise amount is uncertain.

  **Consequences of Strict Textualism: Chaos**
  Swapping in "enacted text alone" would collapse the system:
  -   **Doctrinal Void:** Economic substance, step-transaction, sham transaction doctrines vanish. *Gregory v. Helvering* (1935) would be wrongly decided.
  -   **Transactional Avalanche:** Literal compliance would reign. Basis-shifting shelters, leveraged distributions exploiting textual gaps, and circular cash flows would explode. Tax avoidance would dwarf revenue.
  -   **Penalties & Advice Gutted:** "Reasonable basis" would mean literal text suffices. Penalties would only apply to undisclosed positions *clearly* violating text. "More likely than not" standards become meaningless. Opinion letters would be obsolete—any colorable textual argument avoids penalties.
  -   **IRS Power Shift:** The Service would depend entirely on Congress to plug every gap—impossible given drafting lags and complexity. Litigation would surge, but courts would be handcuffed.

  **The Weakest Point: Purposive Certainty**
  My reconstruction leans heavily on courts reconstructing *discernible* legislative purpose. But sometimes, doctrines like economic substance feel judicial, not interpretive. If courts are *creating* policy (e.g., *ACM Partnership*), not discovering legislative intent, the "integrity" claim weakens. Here, Holmes’ prediction model gains traction: practitioners price judicial behavior, not sovereign intent. Yet even then, the system *presupposes* courts are engaged in interpretation, not legislation—otherwise, penalties for "unreasonable" positions become illegitimate.

  **Conclusion: The Grudging Hybrid**
  Tax practice presupposes law as a purposive enterprise (Dworkin) but administers it through a mechanism acknowledging human and systemic fallibility (Holmes). You owe fidelity to the scheme's purpose, but the system concedes that perfect knowledge is impossible and lets you price that risk—provided you engage the system in good faith. Criminal law’s textualism isn’t contradictory; it’s a necessary concession to higher stakes. The "theft" slogan withers under this reality: a system striving for correct substantive outcomes, with penalties scaled to culpability, isn’t theft—it’s complex, flawed, but legitimate governance. Your discomfort stems from law’s irreducible tension between certainty and justice, laid bare in tax’s high-stakes, technical arena. That tension isn’t a bug; it’s the human condition of law.
