answer: |-
  ## Closing Remarks: The Burden of Proof & The Road Ahead

  Esteemed Delegates, Honored Ministers, Members of the Press, Fellow Citizens,

  Over these intense days, we haven’t just debated budgets and bureaucracies. We’ve grappled with fundamental questions: Who decides? Who is accountable? And crucially, who carries the **burden of proof** when decisions shift?

  By a decisive vote, this convention has recommended a significant shift: devolving education, transport, and health spending to a new regional assembly. This wasn’t a vote born of mere frustration, nor a naive belief that smaller is automatically sweeter or wiser. It was a vote rooted in a principle often invoked but frequently misunderstood: **subsidiarity.**

  Let me be clear about what subsidiarity means to this convention, and what it *doesn’t* mean.

  **Subsidiarity isn't sentimentality.** It doesn’t claim regional governments possess inherently superior wisdom, warmth, or authenticity. That’s a romantic notion, and frankly, a dangerous oversimplification. Governments at every level can be wise or foolish, efficient or wasteful, responsive or remote.

  **Subsidiarity is a rule of responsibility.** It’s a procedural principle: **decisions should be made at the level closest to the people they affect, *unless* a compelling case can be made that a higher level can achieve the objective more effectively.** The burden of proof doesn't rest on those arguing for local control by default; **it rests squarely on those arguing for centralization.**

  Why? Because proximity fosters accountability. When decisions about our children's schools, our daily commutes, or our local clinics are made closer to home, the lines of responsibility are shorter, clearer. Feedback is faster. Success and failure are more visible. The citizen’s voice carries further. Centralization requires justification – not because the national government is incompetent, but because distance inherently risks diluting that direct connection and responsiveness. This convention has said: for these vital services impacting daily life, the national government hasn’t met that burden of proof. The default position should shift.

  This brings me, with deep respect, to the heartfelt concerns raised by our colleagues from the mountain districts. You’ve spoken powerfully this weekend. You’ve reminded us of a complex history, where the national government has, at times, acted as a shield, protecting minority interests and unique regional needs from being overridden by a powerful regional majority. You ask, understandably and forcefully: **Why should the burden of proof now seem to run *against* us?**

  Your fear is not abstract. It’s grounded in experience. And let me say unequivocally: **A devolved region that fails its minorities is a failed region.** The legitimacy of this entire project hinges on ensuring *all* parts of our region thrive, that no community feels its voice is drowned out or its needs neglected.

  But the answer cannot be a perpetual reliance on distant guardians. The shield of centralization can also become a barrier – a barrier to tailored solutions for your unique challenges, a barrier to the innovation your communities might generate if empowered. The challenge we accept today is not to abandon protection, but to build **better, more responsive safeguards *within* our regional governance.**

  This means designing an assembly with robust mechanisms for minority representation and voice. It means funding formulas that recognize diverse needs and geographic challenges. It means ensuring the mountain districts aren't just heard, but are active architects of solutions for transport in rugged terrain, healthcare access in remote valleys, and schools preserving local heritage. **The burden of proof on the regional majority isn't just procedural; it's moral and practical. They must prove, through action and inclusion, that devolution serves the mountains as well as the plains.**

  And this leads us directly, unavoidably, to the clause in the draft statute that has hovered over our discussions: the twelve-year sunset provision.

  It states that each devolved power lapses after twelve years unless renewed by a two-thirds majority of the national legislature. And it establishes a joint council for disputes, focused solely on procedure, not policy merits.

  I understand the skepticism. Some see it as a lack of faith in our regional project. Some see it as a potential veto point. But let us consider its intent and its potential.

  This sunset clause isn't an admission of weakness; **it is the ultimate embodiment of the burden of proof principle we’ve championed.**

  It says to the national level: *"You argued central control was necessary. You lost that argument for now. But the burden of proof isn't lifted forever. We, the region, now take on the responsibility to demonstrate, over twelve years, that we can govern these vital areas effectively, efficiently, and equitably for all."*

  It says to the region: *"This isn't an irrevocable transfer. It's a mandate. A mandate to prove our capability, our accountability, our unity. We have twelve years to build systems that work, to serve the mountains and the cities, to demonstrate that proximity delivers better results. If we succeed, renewal becomes an undeniable affirmation. If we falter... the burden of proof shifts back."*

  The joint council, focused on procedure? It ensures the *rules* of engagement between levels are followed fairly. It prevents procedural obstructionism from either side, while deliberately leaving the substantive choices – the policies, the spending priorities – where they belong: in the hands of the democratically accountable bodies at each level, guided by our principle of subsidiarity. It forces disputes about *who decides* into a clear channel, leaving *what is decided* to the appropriate democratic forum.

  **This sunset clause, therefore, is not a threat; it is a challenge. It’s a timeline for proof.** It demands that the regional assembly we envision doesn't just assume competence; it earns it, day by day, year by year. It demands that the national legislature, in twelve years' time, must actively affirm our success based on evidence, not preconception.

  Ministers, your vigorous engagement this weekend underscores the significance of this moment. We may disagree on the path, but I believe we share a fundamental goal: the well-being of all our citizens. We ask you to receive this recommendation not as a rejection, but as an invitation – an invitation to a new partnership, defined by the principle that decisions belong closest to the people, unless proven otherwise.

  Delegates, we have done hard work. We have voted for change based on a clear principle of governance. We have acknowledged deep concerns and accepted a profound challenge embedded in the sunset clause.

  Now, the real work begins. The work of building a regional assembly that proves its worth. The work of demonstrating, to the mountain districts and to everyone, that devolution means better services, stronger communities, and genuine empowerment. The work of shouldering the burden of proof we have placed upon ourselves.

  **We have twelve years. Let’s get started.**

  Thank you.
