prompt: |-
  I run a small philosophy of biology reading group and I want a diagnostic — a decision tree that sorts people into theories of biological function based on what they'd say about cases, not which label they fancy. Please build it from the logical space first: what are the actual axes (does the trait's history matter? is there real normativity, so that a thing can malfunction? are functions out there in the world or do they need someone to attribute them?), and only then put the views at the leaves — the selected-effect/etiological family, the Cummins-style causal-role view, the organizational account, proper-function views, and the deflationary option that says there's nothing here but dispositions plus our interests. Maybe seven-ish branch nodes, each one a concrete case someone could answer without knowing where it leads: an appendix that does nothing much now but keeps getting infected, a mutant enzyme that has never once catalysed anything, the wing of a flightless bird used only for balance, a heart still beating in a brain-dead body, and — my favourite — a hand-written artificial-life agent with a genuinely useful trait but no ancestors at all, which I think is the case that hurts the historical views most. Each leaf should name the view and give one sentence on its most awkward commitment, note any combination of answers no view occupies (and whether that's because it's incoherent, unappealing, or just unexplored), and flag any two leaves your tree can't really seperate. British English please.
reasoning: |-
  Okay, the user runs a philosophy of biology reading group and wants a diagnostic decision tree to sort people into theories of biological function based on case responses rather than labels. They specified building it from the "logical space" – identifying key axes first. 

  Hmm, the core philosophical tensions seem to be:
  - Historical dependence (does past evolution matter?)
  - Normative force (can things genuinely malfunction?)
  - Mind-dependence (are functions observer-relative?)

  Right, the user explicitly named those three axes – good. They also want concrete cases: appendix, mutant enzyme, flightless bird wings, brain-dead heart, and that clever a-life agent with no history. Clever touch – that last one really tests etiological views.

  Let me map the major views onto these axes:
  - Etiological (SEP): history essential, strong normativity, mind-independent
  - Causal-role: no history needed, no real normativity, mind-dependent
  - Organizational: history irrelevant, weak normativity via self-maintenance, mind-independent
  - Proper-function: like etiological but broader history (maybe divine design)
  - Deflationary: just dispositions + interests, so mind-dependent and no normativity

  The user wants British English spelling – "catalyses" not "catalyzes", "organisation" etc. Noted. Also wants awkward commitments flagged: like how etiological views must deny functions to the a-life agent, or how organizational accounts struggle with vestigial traits.

  Wait – are there any "gaps" in the logical space? For example: 
  - A view claiming strong normativity but no history? Seems unstable – where would norms come from?
  - Mind-independence without normativity? Possible but rare (maybe some token-physicalism?) 
  Should mention these voids.

  For the decision tree flow:
  Start with the a-life case (clean history test) → then mutant enzyme (actual vs potential function) → appendix (vestigiality) → flightless wing (current utility) → brain-dead heart (normativity). Seven branch points feels right – can derive sub-questions from the axes.

  Biggest challenge: distinguishing organizational from deflationary when both accept current utility. Need a sharp case – maybe the brain-dead heart? Organizational view cares about contribution to the *system's* self-maintenance, which fails here. Deflationary view just sees a disposition we happen to care about.

  Also must flag that causal-role and deflationary sometimes blur – both mind-dependent, but causal-role is more about explanatory roles while deflationary is purely interests-based. Might need a "soft" separation there.
answer: |-
  Here’s a diagnostic decision tree for theories of biological function, built from logical axes and resolved through concrete cases. It uses **three core axes**:  
  1. **History Dependence**: Must the trait’s evolutionary/design history matter?  
  2. **Normative Force**: Can the trait *genuinely malfunction* (not just fail)?  
  3. **Mind-Dependence**: Are functions dependent on an attributor’s interests?  

  Cases are ordered to maximise discrimination. British English throughout.  

  ---

  ### **Start**: Consider a **hand-written artificial life agent** with a useful trait (e.g., energy collection). It has no ancestors, designers, or evolutionary history.  
  → *If its trait **has** a function*:  
   → *Proceed to Q1*.  
  → *If its trait **lacks** a function*:  
   → **LEAF: Etiological/Selected-Effect (SE) accounts** (e.g., Millikan, Neander).  
    → *Awkward commitment: Denies functions to any ahistorical system (e.g., lab-created life, parallel-universe organisms)*.  
   → *Proceed to Q1* (to distinguish historical subtypes).  

  ---

  ### **Q1**: A **mutant enzyme** in a bacterium has the structure of a catalyser but *never catalyses anything* due to chaotic cellular conditions.  
  → *If it **has** a function (e.g., "catalysing X")*:  
   → *Proceed to Q2*.  
  → *If it **lacks** a function*:  
   → **LEAF: Strong Historical Views** (e.g., "proper function" requiring past success).  
    → *Awkward commitment: A trait with the *right history* has a function even if it *never* performs it (e.g., a sperm cell that never fertilises)*.  

  ---

  ### **Q2**: A **human appendix** that causes infections and appears to have no current survival value, but evolved for digesting cellulose.  
  → *If it **has** a function now*:  
   → *Proceed to Q3*.  
  → *If it **lacks** a function now*:  
   → **LEAF: Etiological/SE Accounts** (functions require *recent* selective history).  
    → *Awkward commitment: Vestigial traits are functionless—so *all* appendices today are malfunctions (or non-functional)*.  

  ---

  ### **Q3**: The **wings of a flightless bird** (e.g., ostrich), used only for balance.  
  → *If their function is **flight***:  
   → *Proceed to Q4*.  
  → *If their function is **balance***:  
   → *Proceed to Q5*.  

  ---

  ### **Q4**: Can the wings **malfunction** (e.g., if too weak for balance)?  
  → *If **yes***:  
   → **LEAF: Organisational Accounts** (e.g., Mossio, Saborido; functions from self-maintenance).  
    → *Awkward commitment: A dying organism’s traits become functionless (e.g., a heart in a corpse)*.  
  → *If **no***:  
   → **LEAF: Proper-Function Hybrids** (e.g., design-focused views).  
    → *Awkward commitment: Functions fixed by history *ignore* current utility (e.g., flightless wings "should" fly)*.  

  ---

  ### **Q5**: A **heart in a brain-dead body** on life support, beating flawlessly but sustaining no life.  
  → *If it **has** a function*:  
   → *Proceed to Q6*.  
  → *If it **lacks** a function*:  
   → **LEAF: Organisational Accounts** (functions require *current* contribution to self-maintenance).  
    → *Awkward commitment: Functions vanish when systems break down (e.g., a dying heart loses its function)*.  

  ---

  ### **Q6**: Does the heart’s function depend **entirely** on *our interests* (e.g., surgeons studying it)?  
  → *If **yes***:  
   → **LEAF: Deflationary/Dispositional Views** (e.g., functions as useful dispositions + interests).  
    → *Awkward commitment: No *real* normativity—"malfunction" is just failure relative to *our* goals*.  
  → *If **no*** (it has an *objective* function):  
   → **LEAF: Causal-Role Views** (e.g., Cummins; functions as causal contributions in a system).  
    → *Awkward commitment: Functions everywhere—e.g., clouds "function" to rain, tumours "function" to grow*.  

  ---

  ### **Gaps & Ambiguities**:  
  - **Unoccupied node**: "Normativity + Mind-Dependence + No History" (e.g., "functions are normative *because we judge them*" without history). *Likely incoherent*—normativity typically requires history or objectivity.  
  - **Blurred leaves**: Causal-Role and Deflationary views *converge* if normativity is rejected. Key difference: Causal-Role focuses on *systemic explanation*; Deflationary on *pragmatic interests*.  
  - **Weak discrimination**: Etiological vs. Proper-Function views differ mainly on history’s *scope* (evolution vs. design)—cases like the appendix rarely split them.  

  ### **Tree Summary**:  
  | Case → Answer | View |  
  |---------------|------|  
  | A-life: **No function** | Etiological |  
  | A-life: Function → Enzyme: **No function** | Strong Historical |  
  | A-life: Function → Enzyme: Function → Appendix: **No function** | Etiological/SE |  
  | A-life: Function → Enzyme: Function → Appendix: Function → Wings: **Flight** → Malfunction: **Yes** | Organisational |  
  | A-life: Function → Enzyme: Function → Appendix: Function → Wings: **Flight** → Malfunction: **No** | Proper-Function |  
  | A-life: Function → Enzyme: Function → Appendix: Function → Wings: **Balance** → Heart: **No function** | Organisational |  
  | A-life: Function → Enzyme: Function → Appendix: Function → Wings: **Balance** → Heart: **Function** → Mind-Dependent: **Yes** | Deflationary |  
  | A-life: Function → Enzyme: Function → Appendix: Function → Wings: **Balance** → Heart: **Function** → Mind-Dependent: **No** | Causal-Role |  

  Use this to provoke debate—especially where answers feel counterintuitive (e.g., denying the a-life agent a function). Perfect for exposing tacit commitments!
