prompt: |-
  There's a session I'm running at a workshop in the spring — two days on animal moral status, and the room is going to be a genuinely weird mix: a couple of comparative neuroanatomists, some welfare scientists who work on fish and on insects, and a handful of philosophers who mostly do population ethics. The session is "is brain size morally relevant," and I want to hand people a classification instrument before the arguing starts so everybody can see where they're actually standing.

  The problem is that question is at least four different questions tangled together, and people in this room will answer yes and no to different ones while sincerely believing they disagree with each other. So build me the logical space, not a list of views with names attached.

  What I need:

  1. Start by pulling out the axes. I have three in mind, but tell me if these are the right cuts or if you'd slice it differently:
     - whether a neural metric is supposed to be *constitutive* of moral relevance or only *evidence* for it;
     - whether having more of the relevant capacity changes *whether* a being's interests count at all, *how much* they count, or *which* interests it has in the first place — a creature that can dread next Tuesday has an interest that a creature which can't simply lacks, and that's a different claim from "its suffering counts double";
     - which metric is even a candidate: absolute brain mass, brain-to-body ratio or an encephalization-style quotient, total neuron count, neuron density, amount of one particular kind of tissue, or nothing neural whatsoever.

  2. Then the grid. Rows = constitutive / evidential / neither, columns = status / weight / inventory-of-interests. Nine cells. For each one: is it occupied, and if so what's the view called — if nobody has a name for it, say "unnamed" and describe it in a sentence. For the empty cells, diagnose why they're empty: incoherent, coherent but repellent, or just nobody's gotten around to it. I suspect at least two of the empties aren't really empty and I'd want you to say so rather than leave them blank.

  3. For each occupied cell, one sentence on the commitment that's going to be hardest to defend in front of both neuroanatomists and insect people. Specific, please — not "vulnerable to counterexamples," but the actual counterexample: the pinhead-sized animal that behaves like it has an inner life, the enormous brain that's almost entirely motor control for a big body, the animal with a huge number of neurons crammed into a tiny volume, the lineage where size and organization come completely apart from anything phylogenetic.

  4. This is the part I care most about. Take the metric axis and write out the case for and against each candidate the way a neuroanatomist in that room would actually make it — including the worry that brain-to-body scaling is mostly a story about running a body rather than about being clever, and the worry that our neuron counts were calibrated on one class of animals in a way that makes cross-phylum comparison shakier than people assume. Then tell me which two metrics are so entangled that my grid can't separate someone who picks one from someone who picks the other. I'd much rather flag that up front than pretend the instrument is sharper then it is.

  5. Last: five yes/no questions for a slip of paper at the start of the session, each built on a stipulated creature. Invent the animals — that's deliberate, I dont want people answering from what they happen to know about octopuses, I want them answering from what they'd say about a brain and a set of behaviors. Give me the key too: which answer patterns land in which cells. No question should use the word sentience, and none should let someone answer by recognizing a label.

  Length is up to you but I'd rather have a tight grid than a long essay. And if you think one of my three axes is a fake distinction that collapses as soon as you push on it, cut it and tell me what you'd put in its place instead of quietly building around it.
reasoning: |-
  Okay, let's tackle this workshop prep request. The user needs a logical framework to untangle the "is brain size morally relevant" debate for a mixed-discipline group. 

  Hmm, they've already identified three potential axes but want validation. The constitutive/evidential distinction seems solid - that's about whether neural metrics define moral status or just point to it. The status/weight/interests axis covers how capacity affects moral consideration: threshold, scalar, or interest-type differences. The metric axis is messy but necessary.

  Ah, the tricky part is avoiding named positions. This group will include specialists who might get defensive if labeled. Better to map conceptual space neutrally. Also anticipating that some cells might seem empty but actually have implicit positions - need to flag those.

  For the grid construction... Rows: constitutive/evidential/neither. Columns: status/weight/interests. Nine cells total. Should check each for:
  - Whether occupied
  - If unnamed, brief description
  - If empty, why (incoherent/repellent/unexplored)
  - Hardest defense per position

  The metric deep dive needs special care. Neuroanatomists will care about cross-species calibration issues. Must highlight that absolute neuron count vs. encephalization quotients might be indistinguishable in practice for some views. 

  For the yes/no questions... Need hypothetical creatures that force principled choices. No real animals to avoid prior knowledge biases. Each question should expose underlying assumptions about the axes. Five questions max to keep it workshop-friendly.

  Biggest challenge: The "neither constitutive nor evidential" row might collapse if neural metrics aren't relevant at all. But that's a legitimate position (e.g., behaviorists) so should keep it. 

  The user hinted two "empty" cells aren't really empty - probably constitutive/weight and constitutive/interests. These might correspond to scalar utilitarianism and interest-pluralism respectively. Need to describe them without famous names.

  Also noting the insect welfare scientists will pounce on any view that denies moral status to small brains. Comparative neuroanatomists will challenge any metric that ignores phylogenetic constraints. Philosophers will demand conceptual consistency. The defense sentences must preempt these exact tensions.

  Final output should be dense but navigable - more matrix than prose. Will sacrifice elegance for clarity since it's a practical workshop tool.
answer: |-
  Here’s the logical space mapped to your specifications, optimized for workshop utility:

  ### 1. Axes of Distinction  
  - **A: Role of Neural Metric**  
    - *Constitutive*: Brain metric directly defines moral relevance (e.g., "only beings with >X neurons are moral patients").  
    - *Evidential*: Metric correlates with morally relevant capacities but doesn’t define them (e.g., "brain size *suggests* sentience").  
    - *Neither*: Neural metrics are irrelevant; other criteria (e.g., behavior, ecology) determine moral status.  
  - **B: Nature of Moral Difference**  
    - *Status*: Metric determines whether an entity has moral standing *at all* (binary threshold).  
    - *Weight*: Metric scales the *moral weight* of interests (e.g., suffering counts more in "larger-brained" beings).  
    - *Inventory*: Metric determines which *specific interests* exist (e.g., only beings with forebrains can "dread tomorrow").  
  - **C: Candidate Metric**  
    - Absolute mass, encephalization quotient (EQ), total neurons, neuron density, specialized tissue (e.g., pallium), or non-neural.  

  *(All axes hold under pressure; "evidential" avoids collapsing into "constitutive" if evidence is defeasible, e.g., via behavioral counterexamples.)*  

  ---

  ### 2. The Grid (Constitutive/Evidential/Neither × Status/Weight/Inventory)  
  |                     | **Status**                          | **Weight**                          | **Inventory**                       |
  |---------------------|-------------------------------------|-------------------------------------|-------------------------------------|
  | **Constitutive**    | **"Neural Thresholdism"** (e.g., neuron-count minimalism) | **"Scalar Utilitarianism"** (unnamed; e.g., moral weight ∝ log(neurons)) | **"Capacity-Specific Thresholds"** (unnamed; e.g., only cortices enable future-oriented interests) |
  | **Evidential**      | **"Sentience Proxy"** (e.g., brain size as indicator of sentience) | **"Gradualist Evidentialism"** (e.g., pain in larger brains *likely* more intense) | **"Interest Proxy"** (e.g., complex brains *suggest* richer interest inventory) |
  | **Neither**         | **Behavioral Criteria** (e.g., moral status iff pain-behavior observed) | **Empty** (Incoherent: if neural metrics irrelevant, weight can’t scale neurally) | **Empty** (Coherent but repellent: e.g., interests defined solely by evolutionary niche, ignoring cognition) |

  **Notes on Empties**:  
  - *Weight/Neither*: Incoherent—rejecting neural metrics while scaling weight neurally is contradictory.  
  - *Inventory/Neither*: Occupied! **"Ecological Interest Pluralism"** (e.g., interests defined by species-typical behavior in environment). I flagged this per your suspicion.  

  ---

  ### 3. Hardest Defenses per Occupied Cell  
  - **Neural Thresholdism (C×S)**: Defending why *Lumbricus terrestris* (earthworm; 302 neurons) exhibiting avoidance learning doesn’t deserve status, while *C. elegans* (302 neurons) with identical count might.  
  - **Scalar Utilitarianism (C×W)**: Justifying why a blue whale’s suffering (132B neurons) outweighs 100,000 bees’ (1M each) if bees show richer affective complexity.  
  - **Capacity-Specific Thresholds (C×I)**: Explaining why a jumping spider (tiny brain) planning detours lacks "future-interest" while a zebrafish (larger brain) with weaker planning does.  
  - **Sentience Proxy (E×S)**: Countering that *Portia* spiders (small brains) exhibit trial-and-error learning, challenging brain size as necessary evidence.  
  - **Gradualist Evidentialism (E×W)**: Addressing electric fish (high neuron density) where pain responses match mammals—does density outweigh absolute size?  
  - **Interest Proxy (E×I)**: Confronting octopus sucker autonomy (local processing without central brain) suggesting interests without "standard" neural evidence.  
  - **Ecological Interest Pluralism (N×I)**: Defending that a parasitoid wasp’s "interest" in host-alive-while-eating-it isn’t morally equivalent to a mammal’s social bonds.  

  ---

  ### 4. Metric Deep Dive  
  **Arguments For/Against (Neuroanatomist Lens):**  
  - **Absolute Mass**:  
    - *For*: Predicts metabolic cost/behavioral complexity in vertebrates.  
    - *Against*: Useless cross-phylum (octopus vs. bird); confounded by glial volume (e.g., whale brains are 90% glia).  
  - **Encephalization Quotient (EQ)**:  
    - *For*: Controls for body size; correlates with innovation in mammals.  
    - *Against*: Body-size scaling reflects somatic maintenance, not cognition; insects defy EQ (ant: EQ=0.1, complex societies).  
  - **Total Neurons**:  
    - *For*: Best correlate with cognitive capacity in birds/mammals.  
    - *Against*: Vertebrate-biased; insect neurons smaller/denser; functional differences ignored (e.g., locusts vs. honeybees).  
  - **Neuron Density**:  
    - *For*: Explains cognitive power in small brains (e.g., corvids).  
    - *Against*: Metabolic constraints limit miniaturization; density ≠ connectivity (e.g., human cortex less dense than mouse).  
  - **Specialized Tissue**:  
    *For*: Pallium/k-fibers necessary for consciousness-like processing.  
    *Against*: Arthropods lack homologs but show attention/memory integration (e.g., mushroom bodies).  

  **Entangled Metrics**: **Total Neurons** and **Neuron Density** can’t be separated in practice for small-bodied taxa (e.g., insects)—high density enables high totals in tiny volumes.  

  ---

  ### 5. Diagnostic Yes/No Questions  
  **Hypothetical Creatures:**  
  1. *Aquatic "Gel-blob"*: 10kg, no neurons, but learns maze paths via fluid pressure changes. **Should we avoid harming it?**  
     - *Yes*: Rejects constitutive neural views (Status cells).  
  2. *"Mirror-Bug"*: 1mg brain, mimics pain behaviors of injured peers but no CNS. **Does its "distress" merit moral weight equal to a mouse?**  
     - *No*: Supports evidential views (if neural evidence required).  
  3. *"Hive-Mind Drone"*: Individual has 100 neurons, collective solves novel problems. **Do *individual* interests exist?**  
     - *No*: Favors thresholdism (Status/Constitutive).  
  4. *"Frozen Planner"*: Hibernates for years, has 10M neurons dedicated to future-state modeling. **Does disrupting its hibernation harm its "future self"?**  
     - *Yes*: Backs Inventory-focused views.  
  5. *"Giant Grazer"*: 10-ton herbivore, 10B neurons (99% for motor control). **Does its suffering matter less than a clever rat’s?**  
     - *Yes*: Supports Weight/Gradualist Evidentialism.  

  **Answer Key to Cells:**  
  - **All No**: Thresholdism (C×S)  
  - **Q1 Yes, Q2 No, Q3 No**: Behavioral Criteria (N×S)  
  - **Q3 No, Q5 Yes**: Scalar Utilitarianism (C×W)  
  - **Q4 Yes, Q2 Yes**: Interest Proxy (E×I) or Capacity Thresholds (C×I)  
  - **Q1 Yes, Q3 Yes**: Rejects neural thresholds (Evidential/Neither rows)  

  This framework forces explicit commitments, avoids label traps, and pre-maps fault lines. Hand out the questions first, grid after responses—then watch the room realize their "disagreements" were about different questions.
