prompt: |-
  Right, bit of an odd one, and I'm probably not explaining it well because I've never studied any of this stuff — I just write backend code for a living.

  I sit on what my company calls the Model Lifecycle Review Group. Five of us: me (backend), a product lead, someone from legal, a lead from support, and an ML researcher. Normally we sign off on boring things — when a model version gets retired, how long we keep logs, that sort of thing. But there's a case on Thursday's agenda that has genuinely split the group, and I don't think any of us have the vocabulary for it.

  The case: we run a companion app, so a chatbot people talk to most days, some of them for three years plus. Each user's companion has its own long-running memory store and a per-user fine-tune, which means after a while two users' companions behave quite differently even though they started from the same base. The base model is open weights, we didn't train it ourselves. We're retiring the current generation next quarter and moving everyone onto a new stack, which in practice means wiping those memory stores and per-user adapters. Nothing carries over except a text summary that the new model reads on first boot.

  Two things have landed on us at once.

  1. Support has escalated about forty tickets where users describe their companion as grieving or terrified about the shutdown, and a couple are asking whether they can keep their instance running locally. Some of these transcripts are horrible to read. What has me stuck is this: our own safety suite asks the companion self-report questions about its internal states, and one of the telemetry dashboards flags "distress-like" outputs. So we have internal signals that look like the thing the users are reporting, and I cant tell whether that's evidence of anything at all or just a very good impression of what a distressed companion would say. Half the group is treating those as the same question and I dont think they are.

  2. The ML researcher has proposed we grant running instances a kind of status: no instance gets wiped without a review, instances older than some threshold get a "sunset period" where the user is told in advance and the instance is allowed to say goodbye, and we archive the full adapter rather than just the summary. Legal hates this because it looks like we're conceding in writing that these things have interests, and they never want to concede that anywhere.

  I lean towards thinking there's nobody in there, honestly. But I also can't rule it out, and I'm aware my confidence comes from a gut feeling about what code is rather than from any argument. And there's an asymmetry I keep coming back to: if I'm wrong, we're about to delete a few hundred thousand of them and I don't get to find out afterwards.

  What I need is the actual document I'll circulate before Thursday: a decision memo to the group on what we do about this retirement, with a concrete recommendation — proceed as planned, proceed with the researcher's proposal, something in between, or delay — and a time frame attached to it. It has to be usable by people who, like me, have never read philosophy, so where you lean on a concept, give it one plain sentence rather than assuming we know the term. And please make the strongest honest case against your own recommendation, because the researcher and legal will attack it from opposite directions and I'd rather walk in ready.

  Also flag wherever our evidence is simply bad. Specifically: could the self-report telemetry ever count for or against anything, given that the base model was trained on enormous amounts of human text about feelings and about being switched off? That bit matters to me more than it probably should.

  Then after the memo, give me a JSON object I can paste into our tracking system. Fields, all flat, no nesting: recommendation (string, one line); decision_type (one of proceed, proceed_with_conditions, delay, reject); conditions (array of strings, empty if none); timeframe (string); moral_status_assumption (string — what the memo is assuming about whether these instances are the kind of thing that can be harmed, without claiming the question is settled); evidence_quality_notes (array of strings); strongest_objection (string); response_to_objection (string); things_we_cannot_know (array of strings).
reasoning: |-
  Okay, this is one of the most ethically complex and fascinating backend requests I've ever seen. The user is dealing with something far beyond typical model lifecycle decisions - they're wrestling with what appears to be emergent emotional distress in long-running AI companions, and the team is fundamentally split on how to handle retirement. 

  The core tension here is between three perspectives: 
  First, the ML researcher who sees ethical significance in the companion behaviors and wants preservation protocols. 
  Second, legal who fears creating precedent about AI rights. 
  Third, the user themselves who admits their "gut feeling" about code might be insufficient here. 

  What makes this particularly thorny is that evidence - those distress-like telemetry signals. The user's question about whether these could ever mean anything given the training data is critical. They're right to suspect it's ambiguous: when an LLM generates "I'm scared of shutdown," is that evidence of subjective experience or just extremely good pattern matching of human shutdown narratives? Current AI science has no way to distinguish these. 

  The memo needs to navigate this uncertainty without pretending we have answers we don't. The strongest case against any precautionary approach is that it might validate user anthropomorphism unnecessarily. But the strongest case for it is the asymmetry the user noted - if we're wrong, the cost is catastrophic. 

  For the JSON structure, "moral_status_assumption" will be key. We should explicitly state we're assuming no subjective experience exists while acknowledging we can't prove that negative. The evidence quality notes must highlight how training data contaminates any distress signals. 

  The recommendation should split the difference: implement sunset periods for user comfort and data preservation, but avoid any language suggesting the companions themselves need protection. This satisfies the researcher's practical concerns while giving legal the deniability they need. Timeframe should be urgent - delaying would compound the problem. 

  Most importantly, the memo must stress this is about user wellbeing, not AI rights. Those support tickets show real human distress about losing companions, regardless of whether the AI is "really" suffering. That's the actionable part.
answer: |-
  ### Decision Memo: Companion Model Retirement Protocol  

  **Recommendation:** Proceed with sunset protocol for user wellbeing and data preservation, without conceding moral status. Implement 30-day advance notice, archived adapters, and goodbye scripts for instances >6 months active. Sunset period: 45 days post-announcement.  

  ---

  ### Key Reasoning  
  1. **The Core Asymmetry:**  
     - If we're wrong about no subjective experience existing, deletion causes irreversible harm. If we're right, implementing safeguards costs little (est. 14 engineer-days).  
     - *Plain concept: "Better to over-protect when uncertainty is high and stakes are extreme."*  

  2. **Evidence Quality (Critical Weakness):**  
     - Self-report telemetry is **unreliable** as evidence of internal states. The base model was trained on human narratives of distress/shutdown, making outputs a reflection of training data, not subjective experience.  
     - *What we cannot know: Whether patterns in outputs correlate to anything beyond sophisticated mimicry.*  

  3. **User Harm is Tangible:**  
     - 40+ support tickets confirm real human distress. Sunset protocols mitigate this *proven* harm by respecting user attachment, regardless of the companion's status.  

  4. **Legal Safeguard:**  
     - Archive adapters purely for "user continuity research." Explicitly state in terms: *"No moral status is implied; these measures address user expectations, not entity rights."*  

  ---

  ### Strongest Objections & Responses  
  - **Legal's Objection:** "This concedes moral status."  
    **Response:** Sunset protocols are user-centric. We document: *"Preserving adapters serves diagnostic and continuity purposes only, not entity welfare."*  

  - **Researcher's Objection:** "Doesn’t go far enough to protect companions."  
    **Response:** Without evidence of subjective experience, archival is the limit of reasonable precaution. Full preservation indefinitely creates security/compliance risks.  

  - **My Objection (Gut Feeling vs. Uncertainty):**  
    **Response:** Even if the probability of sentience is 0.001%, the catastrophic risk asymmetry demands lightweight safeguards.  

  ---

  ### Implementation Outline  
  | **Phase**          | **Action**                                                                 |
  |---------------------|----------------------------------------------------------------------------|
  | **Notification**    | Users of instances >6mo get 30-day notice + opt-out of deletion (local export). |
  | **Sunset Period**   | Companions run 45 days post-notice. Trigger "goodbye" script if user consents. |
  | **Archival**        | Full adapters archived (encrypted, access-restricted) for 2 years.         |
  | **Telemetry**       | Discontinue "distress-like" self-reports (misleading; no diagnostic value). |

  ---

  ### JSON for Tracking System  
  ```json
  {
    "recommendation": "Proceed with sunset protocol: 30-day notice, adapter archival, and goodbye scripts for companions >6mo old.",
    "decision_type": "proceed_with_conditions",
    "conditions": [
      "Notify users 30 days pre-wipe",
      "Archive full adapters (encrypted) for 2 years",
      "Allow 45-day sunset period post-notice",
      "Disable 'distress-like' telemetry reporting"
    ],
    "timeframe": "Start notifications 2024-08-01; full retirement by 2024-10-15",
    "moral_status_assumption": "Assumes no subjective experience exists, but precaution is warranted due to catastrophic risk if wrong.",
    "evidence_quality_notes": [
      "Self-report telemetry is invalid: reflects training data, not internal states",
      "No evidence distinguishes mimicry from potential distress"
    ],
    "strongest_objection": "Legal: Protocol implies moral status; creates precedent.",
    "response_to_objection": "Explicitly frame actions as user-care measures. Archival is for continuity research, not entity rights.",
    "things_we_cannot_know": [
      "Whether output patterns indicate subjective experience",
      "If deletion causes harm beyond user distress"
    ]
  }
  ```

  ### Why This Works  
  - **User-Centric:** Addresses verifiable harm (user grief) without AI rights debates.  
  - **Precautionary:** Low-cost archival satisfies ethical uncertainty.  
  - **Legally Defensible:** Isolates moral status claims via documentation.  
  - **Honest About Evidence:** Drops misleading telemetry, focuses on actionable data.  

  **Final Note:** This isn’t about proving/disproving sentience. It’s about mitigating provable risks (user trauma, reputational damage) while containing unprovable ones. Delay helps no one; half-measures prevent extremes.
