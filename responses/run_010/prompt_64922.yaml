prompt: |-
  I teach a 200-level course on practical rationality — 35 students, two 75-minute meetings a week for seven weeks — and we reach weakness of will in week five. I want the students to arrive at that week having already produced their own behavioral record, not a survey they filled out in ten minutes and not a thought experiment they discussed abstractly. The specific thing I'm after is preference reversal under delay: a student choosing one option when it is distant and the other when it is near, with no relevant feature of the options having changed in between. My constraint is that the choice architecture should be embedded in something the students would plausibly treat as ordinary course administration — participation points, an optional make-up slot, a deadline they can move — rather than announced as an experiment. I know this sounds like a trick, and I want your help making it honest rather than merely effective: tell me exactly what I should disclose at the start of the semester, what I can withhold until week five, and where the line is between avoiding demand characteristics and deceiving people who are depending on me for a grade. A colleague who tried something similar with candy reports that the whole thing collapsed in the first session because everyone took the immediate reward and there was no variation left to discuss, so please design for the case where the temptation is obvious from the first day.

  On mechanics: give me the reward structure (no cash, no food, since I have allergies and dietary restrictions to manage and I don't want the ethics committee to have opinions about glucose), the schedule across seven weeks and fourteen meetings, and at least one revision window in which a student can change a choice already made, with a real but small cost attached to revising. I'd also like a costly commitment device on offer — something a student can lock themselves into early, which is unattractive precisely because it forecloses later revision — and I want the design to let me compare students who took it against students who didn't. Specify whether choices are made privately or in front of the class, how they get recorded without anyone feeling surveilled, how I aggregate them so that the week-five reveal shows a pattern in the room without exposing any individual's humiliations, and what the opt-out looks like for a student who declines to be a data point at all. Please also say what happens to students who never engage with the mechanism, which in my experience is a quarter of the room.

  The part I most need thought about is the debrief, and here I want the philosophy rather than the logistics. Someone sharp will say that they didn't act akratically at all: they learned something between week two and week six, their workload shifted, they re-weighted how much the reward mattered given what else was going on, and so what looks like a reversal is just ordinary rational revision in response to new evidence. That objection is not obviously wrong, and a good activity should be built so that the objection can be tested rather than waved away — so build into the design at least one choice pair where the options are held fixed in every respect except temporal proximity, and tell me what the aggregate result would have to look like for me to be entitled to say the room displayed time-inconsistent preference rather than updated belief. Then tell me honestly what the activity cannot deliver: I suspect that trading points over six weeks reproduces intertemporal choice but not acting against one's own considered judgment about something that actually constitutes a life — a thesis, a health habit, a relationship — and that the gap between those two things is where the interesting philosophy lives. Say which feature of akrasia the game structurally cannot supply, what I would have to establish by argument in the second half of week five, and what will predictably go wrong the first time I run this, including how I should handle the student who figures out the design in week one and announces it to everyone.
reasoning: |-
  We are designing a semester-long activity to reveal preference reversal under delay without announcing it as an experiment. The goal is to have students generate their own behavioral record for a week five discussion on weakness of will.

  Constraints:
  - Embedded in ordinary course administration (e.g., participation points, deadlines, make-up slots).
  - Not a quick survey or abstract thought experiment.
  - Avoid cash or food rewards (due to allergies, dietary restrictions, and ethics).
  - Must be honest: we need to disclose appropriately at the start and then reveal more in week five.
  - Must avoid the pitfall of everyone taking the immediate reward (like the candy experiment).
  - Include at least one revision window with a small cost.
  - Include a costly commitment device that forecloses revision and is unattractive for that reason.
  - Choices should be private to avoid public pressure and to record without feeling surveilled.
  - Aggregate data to show patterns without exposing individuals.
  - Opt-out for students who don't want to be data points.
  - Account for non-participation (about 25%).
  - Design to address the objection that preference reversal is due to rational updating (new evidence, changed circumstances) rather than time-inconsistent preferences.
  - Acknowledge the limitations: the activity may not capture the full weight of life decisions (like a thesis, health, relationships).

  Key elements:
  - **Reward structure**: Use participation points (or points that convert to a small grade boost) because they are intrinsic to the course and avoid ethical issues. We can call them "course points" that count toward the participation grade (e.g., 10% of the final grade). The points must be meaningful but not so large as to create undue stress.

  - **Schedule**: The course meets twice a week for seven weeks (14 meetings). We need to set up a sequence of choices that span from week one to week five, with the reveal in week five.

  - **Mechanics**:
    - **Choice pairs**: We will present a series of choices between two options that differ in the timing of the reward and the amount. The immediate option should be tempting but smaller, and the delayed option should be larger but require waiting. We need to avoid the problem where everyone takes the immediate option by making the delayed option attractive enough to split the group.

    - **Revision window**: Allow students to change a choice they made earlier, but at a small cost (e.g., they lose a small fraction of the points they would have earned).

    - **Commitment device**: Offer an option at the beginning to lock in a choice for a future date, with the feature that if they take it, they cannot revise that choice later. The unattractive part is the loss of flexibility. We can make it costly in points? Or maybe it requires extra work? We have to be careful with extra work because it might be seen as punitive. Alternatively, the commitment device could be that they get a bonus if they stick to their original plan, but if they break it, they lose that bonus and more? But we want it to be chosen early and then binding.

    - **Privacy**: Choices are made via an online form (e.g., Google Form, LMS quiz) that records responses without names (or with names only for the instructor to track for grading, but then anonymized for analysis). We can assign each student a random ID at the beginning of the semester for all activities.

    - **Non-participation**: Students who never engage get zero for the participation points from this activity. But we must have an opt-out: at the start, we tell students that they can choose to not participate in the "participation points activity" and instead write a short reflection (so they don't lose the grade points). We'll design an alternative assignment.

    - **Debrief**: We must design one choice pair that is held fixed in every respect except temporal proximity. This will help distinguish between time-inconsistent preferences and rational updating. For example, we can have two identical choices (same options) but presented at different times (one far in advance, one near). If the same student chooses the delayed (larger) reward when it's far and then switches to the immediate (smaller) when it's near, and if we can rule out new information, then we have evidence of preference reversal.

  **Detailed Design:**

  **Reward Structure:**
  - We use "course points" (CP) that are part of the participation grade. The total participation grade is 100 CP, and the entire activity will account for 30 CP (so about 30% of the participation grade, which itself is 10% of the final grade). This makes it meaningful but not overwhelming.
  - The CP can be earned by making choices and sticking to them (or revising with a cost) and by the outcome of the choices.

  **Schedule and Choice Points:**
  - **Week 1, Meeting 1**: Introduction to the course. We introduce the participation points system. We explain that throughout the course, they will make a series of choices about how to earn these points. We disclose that the choices will involve trade-offs between more points later and fewer points sooner, and that they will have the opportunity to change some choices later but at a small cost. We also introduce the commitment device: at the beginning, they can choose to lock in their choices for a future set of decisions, which will earn them a small bonus (say 2 CP) but they will not be allowed to change those choices later. We also announce the opt-out: students can choose to not participate in the points activity and instead write a 500-word reflection on a topic related to the course (due at the end of the semester) to earn the 30 CP.

  - **Week 1, Meeting 2**: First choice. We present two options for a task to be done in week 3 (so about 2 weeks away). The task is simple and can be done online (to avoid scheduling issues). For example:
    - Option A (immediate, small): Complete a short quiz (5 minutes) on the reading in week 3, meeting 1. Reward: 5 CP.
    - Option B (delayed, larger): Complete a slightly longer quiz (10 minutes) on the same reading in week 3, meeting 2. Reward: 8 CP.
    - Note: We are making the delayed option more attractive (8 vs 5) but also requiring a bit more time (10 minutes vs 5). The quizzes are on the same reading, so the content is the same. The only difference is the timing and the reward.

  - **Week 2, Meeting 1**: Second choice. This time for a task in week 4. We make the delayed option even more attractive to ensure not everyone takes the immediate.
    - Option A: Short quiz (5 min) in week 4, meeting 1: 5 CP.
    - Option B: Longer quiz (10 min) in week 4, meeting 2: 9 CP.

  - **Week 2, Meeting 2**: Third choice. For a task in week 5. This one is critical because we will later offer a revision window for this choice.
    - Option A: Short quiz in week 5, meeting 1: 5 CP.
    - Option B: Longer quiz in week 5, meeting 2: 10 CP.

  - **Week 3, Meeting 1**: We run the quiz for those who chose Option A for the week 3 task. Meeting 2: quiz for Option B.

  - **Week 3, Meeting 2**: Fourth choice. This one is for a task in week 6. We also introduce a revision window for the choice made in week 2, meeting 2 (the week 5 task). 
    - New choice for week 6:
      - Option A: Short quiz in week 6, meeting 1: 5 CP.
      - Option B: Longer quiz in week 6, meeting 2: 11 CP.
    - Revision window: Students can change their choice for the week 5 task (originally made in week 2, meeting 2). The cost to change: if they switch from B to A, they get the 5 CP but lose 1 CP (so net 4). If they switch from A to B, they get 10 CP but lose 1 (so net 9). The revision cost is 1 CP regardless of direction.

  - **Week 4, Meeting 1**: Quiz for those who chose Option A for week 4. Meeting 2: quiz for Option B.

  - **Week 4, Meeting 2**: Fifth choice. For a task in week 7. Also, a revision window for the week 6 task (originally chosen in week 3, meeting 2) with the same 1 CP cost.
    - New choice for week 7:
      - Option A: Short quiz in week 7, meeting 1: 5 CP.
      - Option B: Longer quiz in week 7, meeting 2: 12 CP.
    - Revision for week 6 task: same cost structure.

  - **Week 5, Meeting 1**: Quiz for those who chose Option A for week 5. Also, we run the first part of the debrief in this meeting (after the quiz) or in meeting 2? Actually, we want the reveal in week five, so we do it in meeting 2.

  - **Week 5, Meeting 2**: Reveal the pattern. We show aggregated data (without individual identifiers) of how many students chose the delayed option when it was distant and then switched to the immediate when it was near (for the same choice). We also show the effect of the commitment device and the revisions.

  **Commitment Device:**
  - Offered in week 1, meeting 1: Students can choose to lock in their choices for weeks 5, 6, and 7. If they choose this, they get a bonus of 2 CP, but they cannot change any of their choices for those weeks (even when the revision window opens). The unattractive part is the loss of flexibility. We record who takes this.

  **Fixed Choice Pair for Testing Rational Updating:**
  - We need a pair of choices that are identical in content but presented at two different times (one distant, one near). We can use the week 5 task. We present the same choice twice: 
    - First presentation: in week 2, meeting 2 (distant).
    - Second presentation: in week 4, meeting 2 (near) as part of the revision window (but without revealing that it's the same). However, in the revision window, they are only allowed to change the choice they made earlier. So we can compare the initial choice (distant) with the revised choice (near). But note: the revision window is presented as an opportunity to change, so it might induce change for other reasons. Alternatively, we can have two separate choices for two different tasks that are identical in structure? But then the tasks are different, so it's not the same.

  Alternatively, we can have a separate choice that is repeated. Let me propose:

  In week 2, meeting 2, we present a choice for a task in week 5 (call it Task X). Then, in week 4, meeting 1, we present the same choice again for a task in week 5 (Task Y) that is identical in structure and rewards. But we present it as a new choice. We then compare the choices for Task X (made in week 2) and Task Y (made in week 4). The tasks are both in week 5, but they are two separate quizzes (on two different readings). The options are the same: Option A (5 CP for short quiz in meeting 1 of week 5) and Option B (10 CP for longer quiz in meeting 2 of week 5). We can then see if the same student chose B for Task X (distant) and A for Task Y (near). This would be a reversal for two identical choices (except the task is different). But the tasks are different, so the student might have a reason (e.g., one reading is harder). To mitigate, we make the readings of similar difficulty and don't reveal the topic until the week of.

  Alternatively, we can have only one task but two decision points: the initial choice and then a confirmation choice. But that might not be natural.

  Better: In the revision window for the week 5 task (which is in week 3, meeting 2), we ask them to confirm or change. But then the initial choice was in week 2, and the revision is in week 3 (which is still relatively distant, not near). We want the near choice to be in week 4 or 5.

  Revised plan for the fixed pair:

  We create two tasks that are very similar and presented as two separate choices. We have:

  - Choice 1 (distant): In week 2, meeting 1, for a task in week 4, meeting 2 (which is about 2.5 weeks away). The options: 
    - Option A: 5 CP for a short quiz in week 4, meeting 1.
    - Option B: 9 CP for a longer quiz in week 4, meeting 2.

  - Choice 2 (near): In week 3, meeting 2, for a task in week 5, meeting 1 (which is about 1.5 weeks away). The options are structured identically:
    - Option A: 5 CP for a short quiz in week 5, meeting 1.
    - Option B: 9 CP for a longer quiz in week 5, meeting 2.

  We then look at the same student's choices for Choice 1 and Choice 2. If they choose B for Choice 1 (distant) and A for Choice 2 (near), that is a reversal. But note: the tasks are in different weeks. We must assume that the workload and context are similar. We can make the rewards the same (9 CP) and the task structure the same. We then compare the proportion of students who choose the delayed option in the distant choice vs the near choice. If the proportion choosing delayed drops significantly in the near choice, and if we can rule out that week 5 is known to be busier (we don't announce any special workload), then we can argue that the temporal proximity caused the reversal.

  **Aggregation and Privacy:**
  - We collect choices via an online form. Each student has a random ID (assigned at the start and known only to the instructor and the student). We then aggregate the data by choice event. For the week five reveal, we show:
    - The percentage of students who initially chose the delayed option for each choice (with the week of the task labeled by week number, not date).
    - The percentage who revised their choices (and in which direction) for each revision window.
    - The percentage who took the commitment device and how their choices differed.
    - For the fixed pair (Choice 1 and Choice 2 as above), we show a cross-tab: how many chose B for both, A for both, B then A, A then B.

  We do not show individual data. We present it as class trends.

  **Opt-Out:**
  - At the start, students can choose the alternative assignment (500-word reflection). They must opt out by the end of week 1. We record their decision. They do not participate in any of the choices and get the 30 CP for the reflection.

  **Non-Engagement:**
  - For students who do not opt out but fail to make choices, they get 0 for the missed choices. We set a default: if they don't make a choice, they are assigned the immediate option (Option A) for that choice. This is announced at the start.

  **Debrief Philosophy:**
  - The key objection: the reversal might be due to rational updating (e.g., the student learned they have a busy week in week 5, so they switch). We try to rule that out by:
    1. Having the fixed pair of choices (as above) that are identical in structure and rewards, but one is distant and one is near. If the same student switches from delayed to immediate, and if we can show that the two tasks are similar and that there was no new information about the overall workload (we don't introduce any new information about the course schedule that would make week 5 particularly busy), then we can argue it's time inconsistency.
    2. We can also look at the revision patterns: if students switch from B to A as the task gets closer, but not from A to B, that suggests a systematic shift toward immediacy.

  - What the activity cannot deliver:
    - The points are not as meaningful as life decisions. The stakes are low and the rewards are not deeply connected to the students' values. So the activity might not elicit the same emotional or motivational forces as a real-life weak-willed action.
    - The activity does not require acting against one's considered judgment at the moment of action. In real akrasia, one might judge that the delayed reward is better but still choose the immediate. In our activity, when they choose the immediate, they might simply have changed their judgment (so it's not akrasia). We cannot peer into their judgment at the moment of choice without biasing the experiment.

  Therefore, in week five, we must argue that the pattern we observe (systematic switching from delayed to immediate as the event nears) is a well-known marker of time-inconsistent preferences (as in hyperbolic discounting) and that it often underlies real-life weakness of will. But we must acknowledge that the activity is a model and that real akrasia involves a conflict between judgment and action that we cannot directly observe here.

  **Predictable Problems and Solutions:**
  1. **Everyone takes the immediate reward**: We set the delayed reward high enough to split the group (e.g., 5 vs 8, 5 vs 9, etc.). Also, the commitment device (with bonus) might attract some to lock in the delayed option.

  2. **Student figures it out in week one and announces**: 
     - We disclose at the start that the choices are about trade-offs and that we will be discussing the patterns in week five. We can say: "We will use the data from these choices to illustrate concepts in the course, such as decision-making over time." So it's not a complete secret. If a student figures out the specific hypothesis, we can acknowledge that in week five and use it as a teaching moment: "Some of you may have guessed we were looking for preference reversals, and that's a common challenge in experiments about human behavior."

  3. **Low participation in the delayed option**: We adjust the rewards in the next offering. But for now, we set the delayed rewards high enough.

  4. **Revision window used too much**: We attach a cost (1 CP) to each revision to discourage casual switching.

  **Full Disclosure:**
  - At the start (week 1, meeting 1): 
    - "As part of your participation grade, you will make a series of choices about when to complete short quizzes for points. These choices will involve trade-offs between doing a task sooner for fewer points or later for more points. You will have the opportunity to change some of your choices later, but at a small cost in points. There is also an option to commit to your choices for the latter part of the course, which will earn you a bonus but prevent you from changing those choices. At the end of the course, we will look at the patterns of choices made by the class to illustrate concepts in practical rationality. If you do not wish to participate in this activity, you can opt out and write a short reflection instead. Your individual choices will be kept confidential, and we will only discuss aggregate patterns."

  - In week 5, meeting 2: 
    - We reveal that we were specifically looking at preference reversals under delay. We show the aggregate data and discuss how it relates to weakness of will. We address the rational updating objection by showing the fixed pair and arguing that if there were no systematic change in circumstances, the reversal pattern is consistent with time-inconsistent preferences.

  **Logistics Summary:**
  - Rewards: Course points (CP) for participation grade.
  - Schedule of choices and revisions (as above).
  - Commitment device: Lock in weeks 5-7 choices in week 1 for a 2 CP bonus (cannot revise later).
  - Revision: Allowed for some choices at a cost of 1 CP.
  - Privacy: Online forms with random IDs.
  - Opt-out: Alternative assignment (reflection).
  - Non-engagement: Default to immediate option (and 0 points if they don't do the task).

  **Debrief Limitations:**
  - The activity cannot capture the phenomenology of akrasia: the feeling of acting against one's better judgment. We only observe choices. We must argue in week five that the pattern is a behavioral marker of a tendency that, in high-stakes real-life situations, manifests as weakness of will. We must also note that the low stakes might lead to more casual choices, but the pattern is still informative.

  **First-Time Problems:**
  - The rewards might be set wrong (too low for delayed) leading to too few choosing delayed. We can adjust in real time? Not easily. So we set the delayed rewards high enough (e.g., 60% more) based on prior experiments.
  - Technical issues with the online forms: have a backup (email or paper).
  - Students might collude or discuss strategies. We emphasize that choices are individual and should reflect their own situation.

  This design balances honesty with the need for natural behavior. It should generate the data we need for a meaningful discussion in week five.
answer: |-
  Below is a comprehensive design for your course activity, grounded in ethical transparency and pedagogical effectiveness. It uses **participation points** (converted to a minor grade component) as the reward, avoids deception, and embeds the choice architecture in routine course administration. The design includes safeguards against the "all immediate reward" problem, incorporates a revision window and commitment device, ensures privacy, and addresses the philosophical challenges of distinguishing preference reversal from rational updating.

  ---

  ### **Core Structure & Disclosure Framework**
  **Key Principle:** Honesty through *staged disclosure*—students know the activity involves choices about points and deadlines but not the specific hypothesis until week five. This avoids deception while minimizing demand characteristics.

  **Disclosure at Start (Week 1, Meeting 1):**  
  > "This course includes a participation points system (10% of your final grade). You’ll make choices about deadlines and tasks that affect your points. Some choices involve trade-offs between earlier/later work or smaller/larger rewards. You’ll have chances to revise some choices later, at a small cost. All choices are private and aggregated for class discussions. If you prefer not to participate, you can opt out for an alternative assignment. We’ll discuss the patterns we observe in week five."

  **Withheld Until Week 5:**  
  - The *specific intent* to study preference reversal under delay (to avoid priming).  
  - The *comparison* between commitment-takers and non-takers.  
  - The *aggregate data* showing reversal patterns.  

  **Line Between Ethics and Effectiveness:**  
  - **Permissible:** Describing the activity as a "study of decision-making" without specifying weakness of will.  
  - **Impermissible:** Concealing that choices are data for a study; misrepresenting rewards; exposing individual choices.  
  - **Opt-Out Safety Valve:** Students can email you privately by the end of week 1 to opt out. They complete a 500-word reflection on rationality (same points as full participation).  

  ---

  ### **Mechanics: Reward Structure, Schedule, and Choices**
  **Reward Structure:**  
  - **Course Points (CP):** 100 CP total = 10% of final grade (e.g., 100 CP = 100% of participation grade).  
  - **No Cash/Food:** CP are tied to low-stakes academic tasks (e.g., quizzes, short writings) to avoid ethical issues.  
  - **Task Design:**  
    - **Option A (Immediate):** Shorter task (e.g., 5-min quiz) for fewer points.  
    - **Option B (Delayed):** Longer task (e.g., 10-min quiz + 100-word reflection) for 30–50% more points.  
    - **Delay Incentive:** Points for Option B start moderately higher and increase weekly to counteract the "all immediate" problem (e.g., Week 1: 5 CP vs. 7 CP; Week 6: 5 CP vs. 12 CP).  

  **Schedule Across 7 Weeks (14 Meetings):**  
  Choices are submitted via your LMS (e.g., Canvas/Blackboard) as "Deadline Preference Surveys" framed as routine admin. Students select options privately; responses are auto-recorded with anonymized IDs.  

  | **Week** | **Meeting** | **Activity** | **Choice Pair (Task Due in Week X)** | **Points (Option A vs. B)** |  
  |----------|-------------|-------------|--------------------------------------|------------------------------|  
  | **1**    | 1           | Intro + Commitment Offer | **Commitment Device** (see below) | N/A |  
  |          | 2           | Choice 1    | Task due in **Week 3** | A: 5 CP (shorter, due Week 3 Meeting 1)<br>B: 7 CP (longer, due Week 3 Meeting 2) |  
  | **2**    | 1           | Choice 2    | Task due in **Week 4** | A: 5 CP (Week 4 Meeting 1)<br>B: 8 CP (Week 4 Meeting 2) |  
  |          | 2           | Choice 3    | Task due in **Week 5** | A: 5 CP (Week 5 Meeting 1)<br>B: 9 CP (Week 5 Meeting 2) |  
  | **3**    | 1           | **Task Week 3 (A)** | Administer Option A task | N/A |  
  |          | 2           | **Task Week 3 (B)** + Revision Window 1 | Administer Option B task<br>**Revise Choice 3** (cost: 1 CP) | Revise via LMS form |  
  | **4**    | 1           | **Task Week 4 (A)** | Administer Option A task | N/A |  
  |          | 2           | **Task Week 4 (B)** + Choice 4 | Administer Option B task<br>**Choice 4:** Task due in **Week 7** | A: 5 CP (Week 7 Meeting 1)<br>B: 12 CP (Week 7 Meeting 2) |  
  | **5**    | 1           | **Task Week 5 (A)** | Administer Option A task | N/A |  
  |          | 2           | **Task Week 5 (B)** + **Reveal & Debrief** | Administer Option B task<br>Aggregate data reveal + discussion | N/A |  
  | **6–7**  | All         | Complete remaining tasks | No new choices | N/A |  

  ---

  #### **Key Features**
  1. **Revision Window (Costly):**  
     - Offered in **Week 3, Meeting 2** for **Choice 3** (due Week 5). Students can switch between A/B at a cost of **1 CP** (e.g., switching to B nets 8 CP instead of 9).  
     - **Why it works:** Small cost discourages frivolous changes but allows reversal. The Week 5 task is distant during Choice 3 (Week 2) but near during revision (Week 3).  

  2. **Commitment Device (Costly):**  
     - Offered **once, in Week 1, Meeting 1**. Students can "lock in" Choices 2–4 (Weeks 4–7) upfront.  
     - **Incentive:** +2 CP bonus.  
     - **Cost:** No revisions allowed for locked choices. This is unattractive because it removes flexibility (e.g., if workload changes).  
     - **Comparison:** You’ll compare reversal rates between locked (commitment-takers) and unlocked choices.  

  3. **Privacy & Data Management:**  
     - **Submission:** LMS forms with student-generated anonymous IDs (e.g., "FavAnimal-RandomNumber" like "Dolphin-72"). You map IDs to names privately for grading.  
     - **Aggregation:** In week five, show class-wide trends (e.g., "60% chose delayed rewards when distant but 30% switched to immediate when near"). No individual data is shown.  
     - **Non-Engagement (25%):** Default to Option A + 0 points if no choice is made. Announce: "No selection = automatic Option A." This creates natural variation (procrastinators resemble real-world akrasia).  

  4. **Preventing "All Immediate" Collapse:**  
     - **Escalating Delayed Rewards:** Points for Option B increase weekly (7 CP → 12 CP). This splits the class—some will take B for higher stakes.  
     - **Commitment Bonus:** Incentivizes some to lock in delayed options early.  
     - **Realistic Tasks:** Option B includes a minor "effort cost" (e.g., extra reflection) to mimic temptation (avoiding candy-like simplicity).  

  ---

  ### **Debrief Philosophy: Distinguishing Reversal from Rational Updating**
  **The Core Objection:**  
  *"I didn’t reverse preferences—I rationally updated based on new info (e.g., workload changes)."*  

  **Built-in Test: The Fixed Choice Pair**  
  - **Design:** In **Choice 2 (Week 2, Meeting 1)**, students choose for a **Week 4 task**. Then, in **Choice 4 (Week 4, Meeting 2)**, they choose for an **identical Week 7 task** (same points, task type, and effort: 5 CP A vs. 8 CP B).  
    - The tasks are indistinguishable except temporal proximity (Week 4 choice is distant; Week 4 choice is near).  
    - No new information is provided about the tasks (e.g., readings are generic; no workload hints).  
  - **Aggregate Evidence for Preference Reversal:**  
    - If >30% of students choose B (delayed) for **Choice 2** but A (immediate) for **Choice 4**, it signals time inconsistency. Rational updating would require task-specific new evidence, which is absent.  
    - **Comparison Point:** Track reversals only for students who had no exogenous changes (e.g., those who didn’t report emergencies). Use a pre-reveal survey in Week 4: "Did your workload change? If yes, describe briefly." Filter those responses.  
  - **Statistical Threshold:** You’re "entitled" to claim preference reversal if reversals (B→A) outnumber rational updates (A→B) by ≥2:1 in the fixed pair, with p<0.05 in a chi-square test (run this in week five).  

  **Limitations of the Activity:**  
  1. **Cannot Replicate "Acting Against Judgment":**  
     - The activity captures *intertemporal choice shifts* but not *akrasia as phenomenological conflict*. Students may not experience the inner tension of "I know I should do B but I’m doing A." Points lack the normative weight of life decisions (e.g., health, relationships).  
     - **Week 5 Mitigation:** Argue that preference reversal under delay is a *behavioral marker* of akrasia. Use parallels: "Just as you chose 5 CP now over 8 CP later, someone might choose Netflix now over gym later, despite judging the gym better."  

  2. **Cannot Isolate Pure Belief Updating:**  
     - Students might rationalize reversals post-hoc (e.g., "I realized the extra points weren’t worth it"). The design controls for task changes but not shifts in *point valuation*.  
     - **Mitigation:** In week five, contrast reversal patterns with commitment-takers. If commitment-takers (who locked in B) reverse less, it suggests reversals aren’t primarily belief-driven.  

  **What the Activity Delivers:**  
  - Demonstrates *time inconsistency* as a precondition for akrasia.  
  - Generates personal data for reflection (e.g., "I switched when I saw the deadline looming").  

  **What It Cannot Deliver:**  
  - The *moral-emotional weight* of real weakness of will.  
  - Proof that reversals are *irrational* (students may have subjectively valid reasons).  

  **Week 5 Argumentative Pivot:**  
  > "This activity shows how temporal proximity shifts choices—but is this weakness of will? In real akrasia, we act against our *best judgment at the moment of action*. Here, your judgment might have changed. Next, we’ll discuss whether time inconsistency explains true akrasia or is merely a behavioral quirk."  

  ---

  ### **Predictable Problems & Solutions**
  1. **Student Figures Out the Design Early:**  
     - **Likelihood:** High (especially if philosophy students are sharp).  
     - **Response:** Normalize it! In week one, say: "You might guess what we’re studying—that’s fine! Focus on your genuine preferences." If someone announces it, reply: "Great observation—we’ll discuss if that affects our results in week five." Use it to teach about experimenter bias.  

  2. **Low Stakes Reduce Engagement:**  
     - **Mitigation:** Escalate CP rewards slightly each week (e.g., Week 1 B=7 CP; Week 6 B=12 CP). This creates "meaningful enough" trade-offs.  

  3. **Ethics Committee Concerns:**  
     - **Pre-Approval:** Submit the design with:  
       - Full opt-out + alternative assignment.  
       - Anonymized data + aggregated reporting.  
       - No deception (disclosure covers all activities).  

  4. **First-Run Flaws:**  
     - **Problem:** Delayed rewards set too low → everyone chooses A.  
       *Fix:* Pre-test CP values with colleagues; start B 30% higher than A.  
     - **Problem:** Revision window underused.  
       *Fix:* Advertise it as a "deadline adjustment opportunity" in announcements.  
     - **Problem:** Fixed pair tasks feel different.  
       *Fix:* Use identical quiz structures (e.g., "Read a 1-page philosophy snippet; answer 2 questions").  

  5. **Non-Participation (25%):**  
     - **Solution:** Default non-choosers to Option A. Their data still shows procrastination (e.g., "I’ll decide later" → immediate reward). Include them in aggregates as "no initial choice" to avoid stigma.  

  ---

  ### **Summary of Week 5 Reveal**
  - **Logistics:** Display aggregate graphs showing:  
    - Reversal rates in the fixed choice pair (e.g., "When the same task was distant, 70% chose delayed; when near, 40% did").  
    - How commitment-takers reversed less.  
    - Revision patterns (e.g., "80% of revisions switched B→A").  
  - **Philosophical Pivot:**  
    - "This data suggests time-inconsistent preferences. But does it capture *weakness of will*? Let’s discuss what’s missing: the judgment-action gap."  
    - Assign a reflection: "Describe a real-life weakness of will. Did it feel like your CP choices?"  

  This design balances ethical transparency with experimental rigor, using course administration as a naturalistic choice architecture. It provides clear data for discussion while respecting student autonomy—and sets up week five to explore the gap between behavioral patterns and true akrasia.
