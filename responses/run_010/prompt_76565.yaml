answer: |-
  ### The Case: "The Weight of Knowing"

  **Setting:** A sterile hospital room at 3 AM. The patient, Eleanor Vance, 68, lies motionless in a specialized bed, her eyes tracking a screen displaying text generated by a brain-computer interface (BCI). Her daughter, Sarah, stands rigidly by the window. Dr. Aris Thorne, the intensivist, holds Eleanor’s advance directive—a single handwritten page.

  **Condition:** End-stage amyotrophic lateral sclerosis (ALS). Eleanor is fully conscious but completely paralyzed except for eye movement. She communicates via BCI (brain-computer interface), which translates her neural signals into text on a screen. The condition is irreversible and permanent. She developed aspiration pneumonia six hours ago.

  **Induction:** Nine years prior, Eleanor volunteered for an experimental "neuro-simulation" procedure (invented element). For six hours, a targeted drug cocktail induced total paralysis while preserving lucid consciousness, mimicking end-stage ALS. The procedure was medically supervised and reversible. She emerged intact but emotionally shattered, signing the directive the next day. The cost: she described it as "drowning in silence, unable to scream." This experience is documented in her margin note on the directive.

  **Directive Text (Eleanor’s handwriting, verbatim):**  
  > *"After the neuro-sim, I know this hell. If I am ever permanently trapped in a body that won’t move, with no hope of recovery, I refuse all life-sustaining treatments—no ventilators, no antibiotics. Let infections take me. Six hours was a lifetime of torture. Do not extend it. I’d rather die than live like that. —Eleanor Vance, [date]"*

  **Deadline:** Eleanor’s pneumonia requires antibiotics within 4 hours to prevent sepsis and cardiac arrest. Without treatment, she dies by dawn. With it, she returns to her current state (permanent paralysis). The hospital’s ethics committee requires a decision before the treatment window closes.

  **Why Not Revoke?**  
  State law mandates revocation via physical signature with two witnesses; her paralysis makes signing impossible, and BCI output isn’t legally binding.

  **Why Not Wait?**  
  Delaying antibiotics past the 4-hour window causes irreversible lung damage, making treatment futile.

  ---

  ### Analysis: Engineering the Dilemma

  **Load-Bearing Feature:**  
  The **legal revocation barrier** (requiring physical signature) is crucial. It forces the conflict between past and present selves into a practical deadlock. Without it, Eleanor could revoke via BCI, collapsing the tension.

  **If Removed:**  
  If BCI revocation were legally valid (e.g., via future law), the case implodes. Eleanor revokes instantly, and the philosophical dilemma vanishes.

  **Losing Side’s Best Attack (Present-Interests Advocates):**  
  *"You’re murdering her right now because of a piece of paper. She’s begging to live—how is that not the only thing that matters?"*  
  This targets the precedent-autonomy camp’s rigidity: it exposes how legal technicalities override a living person’s pleas.

  **Where I Fudged:**  
  The neuro-simulation’s accuracy. A 6-hour temporary state cannot replicate the *adaptation* possible in permanent paralysis (e.g., finding meaning in relationships). But the directive conflates them. I handwaved that Eleanor didn’t foresee adaptation—though the document’s wording ("permanently trapped") implies she did.

  ---

  ### Verdicts Generated

  1. **Precedent Autonomy (Honor the Directive):**  
     Eleanor’s past self experienced the state firsthand and made a rational choice; overriding it insults her autonomy when she was most lucid and informed.  
     *Verdict: Honor.*

  2. **Present Interests (Override the Directive):**  
     Current Eleanor suffers only if denied treatment; she clearly wants to live. Ignoring her plea to obey a dead document inflicts unnecessary harm.  
     *Verdict: Override.*

  3. **Narrative View (Honor, to the Horror of Precedent Autonomy):**  
     Eleanor’s life is a story of defiant self-determination—signing the directive was its climax. Letting her "rewrite" the ending unravels her narrative courage.  
     *Why Precedent Autonomy Hates This:* They see autonomy as sacred principle, not a storybeat. Reducing it to "narrative coherence" cheapens their moral argument.  
     *Verdict: Honor.*

  ---

  **The Line (Does the Philosophical Work):**  
  *Speaker:* Sarah (daughter), staring at the directive.  
  *Text:* "You wrote this to protect yourself from today. How can I un-protect you now?"  

  This captures precedent autonomy’s core ("protect") and the daughter’s anguish—without jargon. It implies the past self’s sovereignty while haunting the room.

  ---

  ### JSON Summary

