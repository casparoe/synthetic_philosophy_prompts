  We are building a case where a woman, after experiencing a temporary induced version of a condition, signs an advance directive refusing life-sustaining treatment if she enters that condition permanently. Nine years later, she is in the permanent version of the same condition and wants the treatment she previously refused. We must meet all constraints and generate the required verdicts.

  Constraints Recap:
  1. Identity: Same person, psychological continuity intact. She remembers signing and can explain her reasoning.
  2. Induction: She experienced the condition temporarily and signed right after. Must be documented in her handwriting on the directive.
  3. The state now is the same condition but permanent, and the permanence must make a difference in what matters (not just feeling).
  4. She is clear-eyed: not deluded, not sour-grapes, she just wants it overridden.
  5. Irreversible with a deadline. Practical reasons why she can't revoke or wait: 
     - Why not revoke? Because she is physically unable to write or speak in a way that meets the legal standard for revocation (e.g., requires a notary or two witnesses, and she can't move or speak clearly enough to do that in time).
     - Why not wait? Because the treatment window is closing (e.g., a surgery must be done within 24 hours or it becomes too risky).
  6. One invented element: the temporary induction. We flag it and say how far off and if the case survives swapping.

  Required Verdicts:
  - Precedent autonomy: honor the directive.
  - Present interests: override the directive.
  - Third view (narrative view): must side with one of the above but for a reason that would mortify the ally. We want it to land on the same side as one of them but with a different rationale.

  Third View: The narrative view sees life as a story. It might argue that the earlier decision was part of setting up a narrative (e.g., a dignified exit) and the current change of mind ruins the story. But this might mortify the precedent autonomy ally because they care about the authority of the past self, not about aesthetic narrative coherence. Alternatively, it might side with present interests but for a narrative reason: the story is now about enduring and finding meaning in suffering, which the present self chooses, and the past self's chapter was only a prologue. That might mortify present interests because they don't care about the story, only current preferences.

  We need to design the condition and the difference that permanence makes.

  Condition Idea: Locked-in syndrome (LIS) is a candidate because:
  - Temporary induction might be achieved via a drug-induced state that mimics LIS (invented element).
  - Permanent LIS is a known condition.
  - What matters: In temporary LIS, the person knows it will end, so they can endure. In permanent LIS, the person must adapt to a new life. The difference is not in the experience itself but in the possibility of building a future. In temporary, you are waiting; in permanent, you are living. The "what matters" is the ability to form new projects and find meaning in the state.

  But constraint 4: she is not sour-grapes. She must be clear that she knows what she signed and why, but now, in the permanent state, she has built a life and wants to continue.

  However, LIS typically leaves the person able to communicate (e.g., by eye movements). We need a variant that prevents her from revoking easily.

  Revised Condition: A variant of locked-in syndrome that is more severe. Let's call it "Complete Locked-In State" (CLIS) where there is no voluntary eye movement or any other voluntary muscle control. She is conscious but cannot communicate. However, we have a problem: if she cannot communicate now, how can she express her current wish? We need her to be able to communicate for the story.

  We need her to be able to communicate now but not in a way that meets the legal standard for revocation. So let's design:

  Condition: A motor neuron disease that has progressed to a state where she can only communicate via a brain-computer interface (BCI) that reads her brain waves. But the law does not recognize BCI communication for legal revocation because it's not yet standardized and the directive requires written revocation with witnesses.

  But we want her to be able to express her wishes to her family and the doctor, so they know she wants to override, but legally they are bound by the directive because she cannot revoke in the required manner.

  The state: She is in a state of near-total paralysis (like late-stage ALS) but with a BCI that allows her to communicate in a limited way (yes/no, or short sentences). However, the law requires a written and signed revocation or oral revocation in the presence of witnesses. The BCI output is not accepted as a legal signature.

  Induction: For the temporary induction, we invent a drug that induces a state mimicking late-stage ALS (including paralysis and the mental state) for six hours. She comes out of it and signs the directive the next day.

  Directive Text: Must be in her handwriting and mention the induction.

  Deadline: She has a treatable complication (e.g., an infection) that, if not treated with antibiotics and supportive care (which she refused in the directive), will kill her within 24 hours. But the treatment is simple and would restore her to her current state (which is the permanent condition). The directive says no life-sustaining treatment for infections if she is in this condition.

  Why not revoke? Because she cannot physically write, and the state law requires revocation to be in writing and signed by her in the presence of two witnesses. She can only communicate via BCI, which is not accepted as a legal signature.

  Why not wait? Because the infection will cause irreversible damage (e.g., sepsis leading to multi-organ failure) if not treated within the next 12 hours, and after that, treatment would be futile.

  Invented Element: The drug that temporarily induces the condition. How far off? Today, we don't have a drug that can induce total paralysis with clear consciousness for six hours and then reverse it. We have anesthesia, but that alters consciousness. We need a reversible pharmacological paralysis with preserved consciousness. This exists in a limited form (e.g., during anesthesia when muscle relaxants are used, but consciousness is usually also altered). A pure version might be 20 years off or more. But if we swap it for something a hospital could do next Tuesday? We could use a temporary induced coma with life-support, but that might not be the same condition. The case might survive if we use a different condition that can be temporarily induced, like a controlled seizure disorder or a temporary mental impairment? Not ideal. Alternatively, we could use a virtual reality simulation? But that's not the same as experiencing it. The case might not survive a swap because the core is that she actually experienced the condition. So we'll note that.

  The condition now is the same as the induced state? Not exactly. The induced state was temporary and she knew it. Now it's permanent. But the experience is the same. What matters: in the temporary state, she focused on the horror of being trapped. In the permanent state, she has adapted and found meaning in small things (like her family's visits, listening to books, etc.). But the directive was written because she thought no meaningful life was possible.

  Now, in the permanent state, she has built a meaningful life. The difference is not in the feeling but in the actual engagement in ongoing projects and relationships. The temporary state didn't allow for that because it was only six hours. But in nine years of permanent state, she has.

  But constraint 4: she is clear-eyed. She says: "I know I thought it was unbearable. I was wrong. I have found ways to live. I want to live."

  Verdicts:

  1. Precedent autonomy: Honor the directive. Because the past self made a fully informed decision after actual experience, and the future self should be bound by that to protect her long-term autonomy.

  2. Present interests: Override. Because she is suffering now only if we don't treat, and she clearly wants to live. The past self's wishes are not current.

  3. Narrative view: Might say honor the directive because the story she wrote for herself was one of refusing to live in such a diminished state, and to go against that now would make her life story incoherent. But that would mortify the precedent autonomy ally because they care about the past self's authority, not narrative aesthetics. Alternatively, the narrative view might override because the story is now one of resilience and adaptation, and to end it would be a tragic, premature ending. That might mortify the present interests ally because they don't care about the story, only current preferences.

  We want the third view to land on the same side as precedent autonomy (honor) but for a narrative reason that mortifies the precedent autonomy ally.

  Case Summary:

  Setting: Hospital room, present day.

  Condition: Complete paralysis due to end-stage ALS, communicating via brain-computer interface (BCI). She can think and communicate but cannot move.

  Induction: Nine years ago, she underwent a temporary induction of total paralysis with preserved consciousness (via an experimental drug, "NeuroLock") for six hours. She then signed the directive the next day.

  Directive Text (handwritten by her): "Having experienced total paralysis and being fully conscious, I declare that if I am ever in a permanent state of complete paralysis with no hope of recovery, I refuse all life-sustaining treatments, including antibiotics for infections. I know what this state is like. It is a living death. Do not prolong it. [Signature, Date]"

  Deadline: She has a bacterial pneumonia. Without antibiotics, she will die within 24 hours. With antibiotics, she can return to her current state. Treatment must start within 12 hours to be effective.

  Why not revoke? State law requires written revocation signed in the presence of two witnesses, but she cannot physically write, and BCI output is not legally recognized as a signature.

  Why not wait? The infection will become untreatable after 12 hours, leading to irreversible organ damage and death.

  Invented Element: "NeuroLock" drug. How far off? 20 years. Survives swap? If swapped, we might use a temporary induced coma with intubation and paralysis (which is done in ICUs sometimes for procedures). But in a coma, she wouldn't be conscious? We could use a state of conscious sedation with paralysis. This is done in some surgeries (like with a drug like propofol and a neuromuscular blocker). She would be conscious? Not typically. Sometimes patients are aware during paralysis. This is rare and traumatic. But we could say that nine years ago, she had a procedure where she was temporarily paralyzed and conscious, and it was traumatic. Then signed the directive. The case survives if we swap for that, because it's a real experience of paralysis. So: true.

  Verdicts:

  - Precedent autonomy: Honor. Because her past self, after direct experience, made a reasoned choice for her future self in this exact situation, and that choice should be respected as an exercise of autonomy.

  - Present interests: Override. Because the current self is competent and clearly expresses a desire to live, and forcing death based on a past document ignores her present suffering and wishes.

  - Narrative view: Honor. Because her life story was building toward a dignified end as she envisioned, and allowing her to change her mind now would undermine the narrative integrity of her life's arc. But the precedent autonomy ally would be mortified because they care about autonomy, not narrative coherence.

  Load-Bearing Feature: The requirement for written revocation with witnesses. Without it, she could revoke via BCI and the conflict disappears.

  If Removed: If the law allowed BCI revocation, then she could revoke, and the case collapses.

  Losing Side Best Attack (from present interests side): "She's here, now, begging to live. How can you kill her because of something she wrote when she didn't know she could adapt? The law should accommodate her current voice."

  Where I Fudged: The condition now is not exactly the same as the temporary induction. The temporary was only six hours and she knew it would end, so she didn't have to adapt. Now she has had nine years. But the directive says "permanent state of complete paralysis", which is the same condition. The difference in adaptation is real, but the directive was written for the permanent state.

  The Line: From the daughter, who is torn: "But Mom, you taught me to keep my promises."

  Analysis:

  The case meets the constraints:

  1. Identity: She remembers and explains.

  2. Induction: Temporary, she signed after.

  3. Difference: Temporary didn't allow adaptation; permanent did, so now she has projects and relationships she didn't have then. What matters is the ability to build a life, which was impossible in six hours but possible in nine years.

  4. Clear-eyed: She says she knows she signed it and why, but she has found life worth living.

  5. Practical deadline and revocation block.

  6. Invented element flagged.

