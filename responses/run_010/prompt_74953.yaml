prompt: |-
  I am marking the problem set for a graduate seminar that sits between social choice theory and moral philosophy. I am one of two TAs, and the second marker will independently grade the same script, so I want my comments to be defensible claim by claim rather than impressionistic. The question, worth twenty marks, read as follows:

  "Harsanyi's aggregation theorem is routinely described as supplying a formal foundation for utilitarianism. State the theorem's assumptions and its conclusion as precisely as you can. Explain what work the Pareto condition does in the argument. Say what the theorem does and does not establish about the interpersonal comparability of utility. Finally, identify the assumption a critic who accepts the mathematics would most plausibly target, and say what has to be given up in order to resist a utilitarian conclusion."

  The candidate's answer is reproduced in full below.

  "Harsanyi's theorem starts from the point that ordinal preference orderings are not enough once social choice is made under uncertainty, so the domain is shifted from outcomes to prospects. The assumptions are: (i) each individual's preferences over prospects satisfy the von Neumann–Morgenstern axioms and are therefore representable by an expected-utility function u_i, unique up to positive affine transformation; (ii) society's preferences over the same prospects satisfy those axioms as well, so that there is a social utility function u_s over prospects, likewise unique up to positive affine transformation; and (iii) a Pareto condition, in the form of Pareto indifference: whenever every individual is indifferent between two prospects, society is indifferent between them too.

  The conclusion is that u_s is an increasing weighted sum of the individual utilities, u_s = a_1u_1 + ... + a_nu_n with every a_i positive. Social welfare is thus the average of individual utilities, which is exactly the utilitarian formula, and the theorem has earned its reputation.

  The Pareto condition is where the philosophical interest lies, and it is doing far more work than its modest statement suggests. It is what makes the social utility a well-defined function of the vector of individual utilities rather than of anything else: if two prospects look the same to everyone, they look the same to society, so social evaluation can only be tracking the profile of individual utilities. Since both sides of that tracking are linear in probabilities, the function connecting them must be affine, and that is the weighted sum.

  The deeper point concerns comparability. The ordinalists held that interpersonal comparisons of utility are meaningless, because nothing fixes whether one person's unit of utility is the same size as another's: each u_i can be rescaled at will. Harsanyi's insight is that this indeterminacy is harmless. Although each u_i is fixed only up to positive affine transformation, the linear representation shows that the social ranking is invariant to the choice of origin and of scale for each individual utility function; any admissible normalization yields the same ordering of prospects. So the theorem is best understood as having dissolved the interpersonal comparison problem rather than as having presupposed a solution to it, which is why it is often said to have vindicated cardinal welfare economics.

  The linearity also disposes of a worry about timing. Because a weighted sum of expectations equals the expectation of a weighted sum, and because the prospects in the theorem are defined over a common set of states with agreed probabilities, it makes no difference whether society first aggregates utilities and then takes expectations across states, or first evaluates each state and then aggregates. The ex ante and ex post routes coincide, which is not true of every framework for social evaluation under uncertainty.

  Critics who accept the mathematics generally attack the interpretation of the u_i rather than the derivation. The objection pressed by Sen and by Weymark is that a von Neumann–Morgenstern function is only a numerical representation of an individual's preferences over prospects and carries no independent claim to measure that individual's well-being; if the theorem is read as an aggregation of well-being, the interpretation has been supplied by the reader and not by the proof, and what is established is at most a utilitarianism of preference-satisfaction. Harsanyi's own response was to ground comparability in the extended-sympathy or impersonal-observer idea: an evaluator who could equally be any of the persons involved would assess a prospect by the utility it yields averaged over those possibilities.

  Given all this, the assumption a critic should target is the Pareto condition, since it is the only one with obvious moral content. Anyone who wants to resist utilitarianism while keeping the expected-utility framework must be prepared to allow that society can rank two prospects even when everyone is indifferent between them, or must accept a rule that ignores unanimous indifference. Rawls's maximin is the standard example of the second route: because it ranks prospects by the position of the worst off, it can rank two prospects differently even when every individual is indifferent between them, and it therefore violates Pareto. This is the price of abandoning utilitarianism."

  I would like a mark out of twenty together with a point-by-point commentary that would justify that mark both to the candidate and to the second marker. Please work through the answer's substantive claims in order, and for each one state whether it is correct, correct but incomplete, or incorrect; where it is incorrect, give the correct version and say how much of the rest of the answer depends on it. Keep errors of substance separate from imprecision of exposition, and be explicit about which category each of your criticisms falls into. I also want a verdict on the answer's overall thesis: whether the mistakes you identify are local defects in an otherwise sound response or whether any of them undermines the answer's central claims, in which case say which claims fall with it. Finally, tell me what the feedback on the script should tell this candidate to work on, and suggest one short follow-up question I could put to them in a viva that would distinguish a student who can repair the mistake from one who does not see it.

  Do not restate the answer back to me, do not reconstruct the proof of the theorem at length, and do not begin with a general assessment — I want the mark to emerge from the detailed verdicts. Assume I have no independent view of the script's quality and take no cue from its confident tone.
reasoning: |-
  Okay, I need to evaluate this graduate seminar answer on Harsanyi's aggregation theorem. The student's response is quite detailed but I must assess it claim-by-claim for accuracy. Let me break this down systematically.

  First, the student correctly identifies the shift from ordinal preferences to prospects under uncertainty and accurately lists the three core assumptions: individual vNM rationality (i), social vNM rationality (ii), and Pareto indifference (iii). The representation uniqueness statements are precise.

  The conclusion about u_s being a weighted sum is correctly stated, but calling it "exactly the utilitarian formula" is slightly imprecise - utilitarianism typically assumes equal weights or welfare comparability, while Harsanyi permits unequal weights. This doesn't invalidate the core point but shows conceptual looseness.

  Regarding the Pareto condition's role, the student makes an important insight about it enabling the social welfare function to track utility profiles. However, they oversimplify by claiming this directly implies affinity - actually, the vNM framework combined with Pareto generates linearity through more complex functional equations.

  On interpersonal comparability, the student offers a sophisticated interpretation about Harsanyi dissolving rather than solving the problem. This is essentially correct per modern readings, though the "vindicated cardinal welfare" phrasing might slightly overstate. The ex ante/ex post equivalence point is accurately noted.

  The criticism section is very strong - correctly identifying the Sen/Weymark objection about preference-satisfaction vs well-being, and accurately summarizing Harsanyi's extended sympathy defense. This shows deep engagement.

  The final claim about targeting Pareto is where the error occurs. While Rawlsian maximin does violate Pareto, the more fundamental criticism actually targets the vNM assumptions about social preferences or individual utility interpretation. Suggesting Pareto as the primary target misidentifies the debate's focal point.

  Overall, despite the Pareto targeting mistake, the answer demonstrates excellent understanding of the theorem's mechanics and philosophical debates. The errors are localized rather than structural - the core exposition remains sound. For a graduate response, this merits high marks with specific feedback about the utilitarian formula precision and Pareto criticism targeting.

  For follow-up, I'd probe their understanding of why social vNM rationality is equally contestable, perhaps asking: "Could a society satisfy Pareto indifference and vNM axioms while having non-linear aggregation? If not, which assumption prevents this?" This would test their grasp of the mathematical necessity beyond Pareto.
answer: |-
  ### Point-by-Point Commentary

  1.  **"Harsanyi's theorem starts from the point that ordinal preference orderings are not enough once social choice is made under uncertainty, so the domain is shifted from outcomes to prospects."**
      *   **Verdict:** Correct.
      *   **Comment:** Accurately identifies the motivation for using prospects/lotteries (the vNM framework) due to uncertainty.

  2.  **Assumption (i): "each individual's preferences over prospects satisfy the von Neumann–Morgenstern axioms and are therefore representable by an expected-utility function u_i, unique up to positive affine transformation;"**
      *   **Verdict:** Correct.
      *   **Comment:** Precise statement of the individual rationality assumption and its implication for representation.

  3.  **Assumption (ii): "society's preferences over the same prospects satisfy those axioms as well, so that there is a social utility function u_s over prospects, likewise unique up to positive affine transformation;"**
      *   **Verdict:** Correct.
      *   **Comment:** Precise statement of the social rationality assumption and its implication.

  4.  **Assumption (iii): "a Pareto condition, in the form of Pareto indifference: whenever every individual is indifferent between two prospects, society is indifferent between them too."**
      *   **Verdict:** Correct.
      *   **Comment:** Correctly states the specific Pareto indifference condition used by Harsanyi.

  5.  **"The conclusion is that u_s is an increasing weighted sum of the individual utilities, u_s = a_1u_1 + ... + a_nu_n with every a_i positive."**
      *   **Verdict:** Correct.
      *   **Comment:** Accurately states the mathematical conclusion. (Note: "increasing" is redundant with "every a_i positive" but not incorrect).

  6.  **"Social welfare is thus the average of individual utilities, which is exactly the utilitarian formula..."**
      *   **Verdict:** Correct but Incomplete.
      *   **Comment:** The weighted sum *can* represent average utilitarianism if weights sum to 1 and are equal, but the theorem only guarantees a *weighted sum* with positive weights. It does *not* establish that weights are equal or sum to 1 ("average" typically implies equal weights summing to 1/n or 1). The conclusion is a linear aggregation, but classical utilitarianism (equal weights) requires an additional assumption like anonymity. This is an imprecision in exposition regarding the scope of the conclusion.
      *   **Dependency:** This imprecision is localized. The rest of the answer about the form of u_s being a weighted sum holds.

  7.  **"The Pareto condition is where the philosophical interest lies, and it is doing far more work than its modest statement suggests. It is what makes the social utility a well-defined function of the vector of individual utilities rather than of anything else..."**
      *   **Verdict:** Correct.
      *   **Comment:** Correctly identifies the core conceptual role of Pareto indifference: social preference *only* depends on the vector of individual utilities (welfarism). This is crucial.

  8.  **"...if two prospects look the same to everyone, they look the same to society, so social evaluation can only be tracking the profile of individual utilities. Since both sides of that tracking are linear in probabilities, the function connecting them must be affine, and that is the weighted sum."**
      *   **Verdict:** Correct but Incomplete/Imprecise Exposition.
      *   **Comment:** The core intuition is sound: Pareto indifference forces welfarism, and the vNM linearity structure (of both individual and social preferences) combined with welfarism forces the *social* welfare *function* to be affine (linear + constant) in the individual *utility functions*. However, the phrase "linear in probabilities" is slightly loose shorthand. The key point is that the vNM representation is linear in *probabilities* (expected utility), and the functional form requirement arises because this linearity must hold consistently across all prospects under welfarism. The jump from "function connecting them must be affine" to "weighted sum" specifically relies on the full force of the vNM assumptions (especially continuity/independence) for both individuals and society, not *just* Pareto indifference. The exposition skips a step but captures the essential logic.
      *   **Dependency:** The conclusion about the form being affine/linear is correct; the imprecision is expository.

  9.  **"The deeper point concerns comparability... Although each u_i is fixed only up to positive affine transformation, the linear representation shows that the social ranking is invariant to the choice of origin and of scale for each individual utility function; any admissible normalization yields the same ordering of prospects. So the theorem is best understood as having dissolved the interpersonal comparison problem rather than as having presupposed a solution to it..."**
      *   **Verdict:** Correct.
      *   **Comment:** This is an excellent and precise explanation of Harsanyi's key insight regarding interpersonal comparisons. The theorem shows that a *unique* social ordering emerges even though each individual's utility function is cardinally measurable (unique up to PAT). No stronger, interpersonally comparable "level" or "unit" is assumed or needed.

  10. **"The linearity also disposes of a worry about timing... it makes no difference whether society first aggregates utilities and then takes expectations across states, or first evaluates each state and then aggregates. The ex ante and ex post routes coincide..."**
      *   **Verdict:** Correct.
      *   **Comment:** Accurately identifies an important implication: the linear (weighted sum) form ensures path independence (ex ante = ex post) under the theorem's assumptions.

  11. **"Critics who accept the mathematics generally attack the interpretation of the u_i rather than the derivation. The objection pressed by Sen and by Weymark is that a von Neumann–Morgenstern function is only a numerical representation of an individual's preferences over prospects and carries no independent claim to measure that individual's well-being; if the theorem is read as an aggregation of well-being, the interpretation has been supplied by the reader and not by the proof..."**
      *   **Verdict:** Correct.
      *   **Comment:** Precisely identifies the most common and fundamental criticism: the vNM utility function represents preferences over gambles, not necessarily well-being or "utility" in a moral sense. The theorem aggregates *preference-satisfaction*, not necessarily *welfare*.

  12. **"Harsanyi's own response was to ground comparability in the extended-sympathy or impersonal-observer idea..."**
      *   **Verdict:** Correct.
      *   **Comment:** Correctly summarizes Harsanyi's ethical justification for interpreting the vNM utilities as interpersonally comparable measures of good (via the hypothetical veil).

  13. **"Given all this, the assumption a critic should target is the Pareto condition, since it is the only one with obvious moral content."**
      *   **Verdict:** Incorrect.
      *   **Correct Version:** While Pareto indifference *has* moral content, the most fundamental and plausible target for critics accepting the mathematics but resisting utilitarianism is **Assumption (ii): that *social* preferences satisfy the vNM axioms** (specifically the Independence Axiom). Critics argue that rational individual choice under risk (vNM axioms) does not imply that *social* evaluation under risk must obey the same axioms (like Independence). Targeting Pareto indifference *alone* is less central to escaping utilitarianism within the expected utility framework than rejecting social vNM rationality.
      *   **Dependency:** This error directly undermines the specific final claim about "the assumption a critic should target" and the subsequent example. The rest of the answer's core exposition of the theorem and criticisms remains sound.

  14. **"Anyone who wants to resist utilitarianism while keeping the expected-utility framework must be prepared to allow that society can rank two prospects even when everyone is indifferent between them, or must accept a rule that ignores unanimous indifference. Rawls's maximin is the standard example of the second route: because it ranks prospects by the position of the worst off, it can rank two prospects differently even when every individual is indifferent between them, and it therefore violates Pareto. This is the price of abandoning utilitarianism."**
      *   **Verdict:** Partially Correct / Partially Incorrect (Substance).
      *   **Comment:**
          *   **Correct:** Rawlsian maximin (specifically applied to prospects) *does* violate Pareto indifference, as described.
          *   **Incorrect (Substance):** The claim that resisting utilitarianism *within the expected utility framework* requires violating Pareto indifference is **false**. One can reject utilitarianism *while keeping both Pareto indifference and the vNM framework* by rejecting the **social vNM rationality (Assumption ii)** instead. Prominent non-utilitarian social welfare functionals within the vNM framework (like those exhibiting ex ante egalitarianism) often satisfy Pareto indifference but violate the social Independence Axiom, leading to non-linear aggregation. *This* is the primary route for critics accepting the mathematical setup but rejecting utilitarianism. The example given (Rawls violating Pareto) is valid *only* if one abandons the expected utility framework entirely for society, which contradicts the premise "while keeping the expected-utility framework".
      *   **Dependency:** This error stems directly from and is dependent on the previous error (#13) about targeting Pareto. The Rawls example is correctly described *in isolation* but is misapplied as the *only* or *primary* route within the vNM framework.

  ### Overall Thesis Verdict
  The answer's core exposition of Harsanyi's theorem (assumptions, conclusion, role of Pareto indifference welfarism, interpersonal comparability, ex ante/ex post equivalence) is **largely sound and often insightful**. The explanation of the Sen/Weymark criticism and Harsanyi's response is excellent. However, the **central claim in the final paragraph** – that Pareto indifference is the assumption critics should target and that abandoning utilitarianism within the vNM framework necessitates violating Pareto indifference – **is fundamentally mistaken**. This undermines the specific argument made in the final section regarding how to resist utilitarianism. The error in point #7 (imprecision on "average") is minor in comparison. The overall thesis about the theorem establishing a foundation for *a form of* utilitarianism (preference aggregation) is supported, but the conclusion about the critic's target and the path of resistance is flawed.

  ### Mark
  **17 out of 20**

  *   **Justification:** The answer demonstrates an excellent understanding of the theorem's structure, proof concept, implications (comparability, timing), and main philosophical criticisms (Sen/Weymark). It loses marks for:
      1.  Imprecision in describing the conclusion as "average" utilitarianism without noting the need for equal weights (-1).
      2.  A significant substantive error in identifying Pareto indifference as the primary target for critics and the necessary route to resist utilitarianism within the vNM framework, compounded by misapplying the Rawls example (-2).

  ### Feedback to Candidate
  *   **Strengths:** Excellent grasp of Harsanyi's theorem itself: assumptions, conclusion, the crucial role of Pareto indifference in establishing welfarism, the profound point about interpersonal comparability, the ex ante/ex post equivalence, and the Sen/Weymark critique. Your explanation of these core elements is precise and insightful.
  *   **Areas for Improvement:**
      1.  **Precision on Utilitarianism:** Be careful when stating that the theorem yields the "average" of utilities. The theorem establishes a *weighted sum* with positive weights. For this to represent *average* utilitarianism (implying equal weighting), an additional assumption (like anonymity) is required. Specify "linear aggregation" or "weighted utilitarian" unless equal weighting is justified.
      2.  **Critic's Target & Resisting Utilitarianism:** Your analysis of *how* to resist utilitarianism within the expected utility framework is incorrect. While Rawlsian maximin violates Pareto indifference, it fundamentally abandons the social expected utility framework. The most plausible and direct target for critics *accepting the vNM setup* (individual and social rationality, Pareto) is **social vNM rationality, specifically the Independence Axiom**. Critics argue that rational social evaluation under risk need not satisfy the Independence axiom (e.g., due to concerns for ex ante equality). This allows for non-linear social welfare functionals (e.g., displaying inequality aversion) that *still* satisfy Pareto indifference and individual vNM rationality. Re-read critiques focusing on the social independence axiom (e.g., Diamond, Mongin).
  *   **Work On:** Sharpen the distinction between the mathematical aggregation form (linear) and normative interpretations (classical utilitarianism vs. weighted). Deepen your understanding of the specific axioms targeted by non-utilitarian approaches *within* the Arrovian/Harsanyian social choice under uncertainty framework, particularly the status of the social independence axiom.

  ### Follow-Up Viva Question
  **"Suppose a critic accepts that individual preferences satisfy vNM axioms and that social preferences satisfy Pareto indifference, but argues that social preferences should violate the Independence Axiom to account for ex ante fairness. Would the social welfare functional in this case still be a weighted sum of individual utilities? Why or why not?"**

  *   **Distinguishing Purpose:** This question tests if the candidate understands the specific role of the *social* vNM axioms (especially Independence) in forcing the linear/affine form, *even if* Pareto indifference holds.
      *   A student who can repair the mistake will recognize that **no, it would not be a weighted sum**. They will explain that Pareto indifference forces welfarism (social preference depends only on the vector of individual utilities), but without the social Independence axiom (and the full vNM structure), the functional relating the social ordering to the vector of individual utilities need not be affine/linear. It could be non-linear (e.g., concave) to exhibit inequality aversion, while still respecting Pareto indifference and individual vNM rationality.
      *   A student who does not see the mistake might incorrectly claim that Pareto indifference alone (or combined with other non-Independence axioms) is sufficient to force linearity, or might revert to discussing Rawls and violating Pareto.
