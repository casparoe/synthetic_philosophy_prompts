answer: |-
  ### Diagnostic Decision Tree for Natural Kind Commitments

  **Instructions:** Answer each question based on case implications, not self-identification. Proceed through nodes sequentially.

  1. **Incompatible Schemes (Gene Case):**  
     Can both molecular biology's "coding sequence" and population genetics' "heritable unit" definitions of *gene* correspond to natural kinds?  
     - **Yes** → Go to 2  
     - **No** → Go to 3  

  2. **Measurement-Defined Kind (Hypertension Case):**  
     Is *hypertension* (defined by BP ≥ 140/90) a natural kind?  
     - **Yes** → **Interest-Relative or Deflationary Account**  
     - **No** → Go to 4  

  3. **Boundary Source (Hypertension Case):**  
     Is *hypertension* a natural kind?  
     - **Yes** → **Interest-Relative or Deflationary Account**  
     - **No** → Go to 6  

  4. **Vague Boundary (Sepsis Case):**  
     Is *sepsis* (clinically uniform despite causal heterogeneity) a natural kind?  
     - **Yes** → Go to 5  
     - **No** → **Unstable: Accepts multiple gene kinds but rejects clinical utility kinds**  

  5. **Historical Kind (Element Case):**  
     Was the pre-isotope concept of *element* (e.g., "lead" as homogeneous) a natural kind?  
     - **Yes** → **Promiscuous Realism / Pluralism**  
     - **No** → **Homeostatic Property Clusters**  

  6. **Utility Without Essence (Sepsis Case):**  
     Is *sepsis* a natural kind?  
     - **Yes** → Go to 7  
     - **No** → Go to 8  

  7. **Paraphyly (Fish Case):**  
     Is *fish* (paraphyletic group excluding tetrapods) a natural kind?  
     - **Yes** → **Homeostatic Property Clusters**  
     - **No** → **Unstable: Accepts sepsis (no essence) but rejects fish (no essence)**  

  8. **Historical Kind (Element Case):**  
     Was the pre-isotope *element* a natural kind?  
     - **Yes** → **Unstable: Rejects gene/sepsism/hypertension but accepts historical element**  
     - **No** → Go to 9  

  9. **Projectibility vs. Naturalness:**  
     Does naturalness explain projectibility (A), or does projectibility explain naturalness (B)?  
     - **A** → Go to 10  
     - **B** → **Interest-Relative or Deflationary Account**  

  10. **Physics vs. Medicine:**  
      Are natural kinds in fundamental physics (e.g., electron) and clinical medicine (e.g., sepsis) natural in the same sense?  
      - **Yes** → **Causal Essentialism**  
      - **No** → **Unstable: Essentialism requires uniformity across sciences**  

  ---

  ### Answer Key & Analysis  
  **Leaf Positions:**  
  - **Causal Essentialism:** Kinds have mind-independent, discrete boundaries (e.g., isotopes redeem elements; physics/medicine align).  
  - **Homeostatic Property Clusters:** Kinds lack essences but have stable property clusters (e.g., sepsis/fish are natural despite heterogeneity/paraphyly).  
  - **Promiscuous Realism / Pluralism:** Incompatible schemes are valid (e.g., gene definitions; pre-isotope elements were natural in context).  
  - **Interest-Relative or Deflationary Account:** Kinds are fixed by utility/measurement (e.g., hypertension threshold; projectibility grounds naturalness).  
  - **Kind Eliminativism:** Implicitly reached if all cases are rejected (no path; see *Unoccupied Regions*).  
  - **Unstable Position:** Contradictory answers (e.g., accepts interest-relative kinds but denies projectibility’s role).  

  **Indistinguishable Pairs:**  
  - **HPC vs. Pluralism:** Tree cannot separate if a respondent accepts sepsis (HPC) and pre-isotope elements (pluralism) but rejects other nodes.  
  - **Deflationary vs. Eliminativism:** Deflationists accept measurement-based kinds; eliminativists reject all. Tree lacks a node forcing "reject all" to eliminativism.  

  **Unoccupied Regions & Why:**  
  - **"Strict Social Constructivism":** Rejects *all* mind-independent boundaries (e.g., sepsis, elements). *Unattractive*: Incompatible with workshop’s shared commitment (some groupings license generalization).  
  - **"Non-HPC Cluster Kinds":** Accepts clusters (e.g., sepsis) but rejects HPC’s causal-homeostasis mechanism. *Unexplored*: Rare in literature; no clear alternative proposed.  
  - **"Physics-Only Essentialism":** Accepts physical kinds (elements post-isotopes) but rejects biomedical kinds (sepsis, genes). *Incoherent*: Inconsistent with generalization commitment in biomedicine.  

  **Design Notes:**  
  - **Cases Cover Key Disputes:** Sepsis (vague boundaries), fish (paraphyly), gene (incompatible schemes), element (historical change), hypertension (measurement), DSM (utility).  
  - **Weaknesses:** Eliminativism not directly tested; HPC/pluralism ambiguity under time constraints. Refinement possible with "reject all" node.  
  - **Printing:** Fits one page if using 10pt font and 0.5" margins. Tree structure minimizes text density.
