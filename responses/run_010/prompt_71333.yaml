                So Group2 thinks that Group1, upon hearing that Group2 saw red, would have updated in the same way as Group2 did initially for two red draws? 
                But then Group2 already did that and got 1/5. 
                They are not learning anything new? 

            This might stall.

    This is getting very messy. The updating is not well-defined because they have different models and they know that the other group is updating based on a model that might be different? But in the classic Aumann, they have to know each other's partitions and the common prior. Here, they don't know that the other group has a different model.

    We need a setting where the disclosure protocol does not force them to reveal their private signal, only their posterior, and where the posterior announcement does not allow them to infer the private signal because they have different models.

    Perhaps we can use a continuous estimation task? But that might be too complex.

    I found a simpler example in the literature: the hats problem, but that might not work.

    Another idea: use a simple two-state world, but with different prior.

    Two states: A, B.
    Event: state=A.

    Group1: prior P(A)=0.6.
    Group2: prior P(A)=0.4.

    They receive no signal. So initially:
        Group1: 0.6
        Group2: 0.4

    They disclose. Since they have no private information, they should not update? 
        Group1 hears 0.4 and thinks: why do they think that? but they have no new information, so they stick to 0.6.
        Group2 similarly.

    So they stall at 0.6 and 0.4.

    But this is because they have no private information. Aumann assumes that they have private information.

    We need them to have private information but still stall.

    Consider:

    Two states: A, B.
    Group1 receives a signal: 
        In state A: they see "X" with probability 0.9, "Y" with 0.1.
        In state B: they see "X" with 0.1, "Y" with 0.9.

    Group2 receives a signal:
        In state A: they see "X" with probability 0.1, "Y" with 0.9.
        In state B: they see "X" with 0.9, "Y" with 0.1.

    Common prior on states: P(A)=0.5.

    True state is A.

    Group1 sees "X": 
        P(A|X for Group1) = [0.5 * 0.9] / [0.5*0.9 + 0.5*0.1] = 0.45 / 0.5 = 0.9.

    Group2 sees "X":
        P(A|X for Group2) = [0.5 * 0.1] / [0.5*0.1 + 0.5*0.9] = 0.05 / 0.5 = 0.1.

    Now they disclose:

        Group1: 0.9.
        Group2: 0.1.

        Group1 hears 0.1. They know that Group2 uses the same prior and the same signal structure? But in this case, they do. 
            Group1 then wonders: what signal did Group2 see? 
            They know that Group2's posterior of 0.1 could come from:
               If Group2 saw "X", then posterior=0.1.
               If Group2 saw "Y", then posterior=0.9.
            So Group2's announcement of 0.1 means they saw "X".

        Then Group1 updates: they know state=A, and they saw "X", and Group2 saw "X". 
            P(A | Group1 saw X and Group2 saw X) = [0.5 * 0.9 * 0.1] / [0.5 * 0.9 * 0.1 + 0.5 * 0.1 * 0.9] = (0.045) / (0.045+0.045)=0.5.

        Similarly, Group2, upon hearing Group1's 0.9, infers that Group1 saw "X", and then also updates to 0.5.

        Then they agree on 0.5.

    So common prior and common knowledge of signal structure leads to agreement.

    To make it stall, change the signal structure knowledge.

    What if Group1 believes that Group2 has the same signal structure as they do, but in reality, Group2's signal structure is swapped.

    Group1's model for Group2: 
        In state A: Group2 sees "X" with prob 0.9, "Y" with 0.1.
        In state B: Group2 sees "X" with 0.1, "Y" with 0.9.

    But in reality, Group2's signal structure is swapped.

    Group1 has the correct own signal structure, but incorrect about Group2.

    Group2 has the correct own signal structure, but believes Group1 has the same as theirs (which is swapped).

    This is very messy.

   Given the time, I think the most workable solution for Round 1 is the two-coin example that always agrees, and for Round 2, we can use the urn example with different priors but in a way that the posterior announcement does not reveal the private signal because the prior is different and they are not aware.

    Round 2: Urn example with different priors.

    Urn X: 2 red, 1 blue.
    Urn Y: 1 red, 2 blue.

    True urn: X.

    Group1: prior P(X)=0.6.
    Group2: prior P(X)=0.4.

    Group1 sees a red ball.
        P(X|red) = (0.6 * 2/3) / (0.6 * 2/3 + 0.4 * 1/3) = (0.4) / (0.4 + 0.4/3) = (0.4) / (0.4 + 0.1333) = 0.4/0.5333 = 0.75.

    Group2 sees a red ball.
        P(X|red) = (0.4 * 2/3) / (0.4 * 2/3 + 0.6 * 1/3) = (0.2667) / (0.2667 + 0.2) = 0.2667/0.4667 = 0.5714.

    So Group1: 0.75, Group2: 0.5714.

    They disclose.

    Group1 hears 0.5714. 
        Group1 knows that Group2 uses a different prior? No, they are not aware. Group1 believes that Group2 also has prior 0.6.
        So Group1 thinks: if Group2 has prior 0.6 and saw a ball, what could they have seen to get 0.5714?
            If Group2 saw red: 
               P(X|red) with prior=0.6 = 0.75 -> not 0.5714.
            If Group2 saw blue:
               P(X|blue) = (0.6 * 1/3) / (0.6 * 1/3 + 0.4 * 2/3) = (0.2) / (0.2 + 0.2667) = 0.2/0.4667 = 0.4286.

            So 0.5714 does not match either. 

    This is a problem. They might realize something is wrong.

    To avoid this, we can have them not know each other's exact posterior, but we want them to announce publicly.

    Alternatively, we can have discrete so that the posterior is not a continuous value.

    Given the complexity, I think for the purpose of the class, we can do the following for Round 2:

    Use the two-coin world, and event A: state is HH.

    Group1: common prior (uniform).
    Group2: different prior, say they think that the first coin is very biased towards H: 
        P(HH) = 0.4, P(HT)=0.4, P(TH)=0.1, P(TT)=0.1.

    Then in state HH:

        Group1: 
            Signal: first coin=H.
            P(HH|first=H) = P(HH) / (P(HH)+P(HT)) = (0.25) / (0.25+0.25) = 0.5.

        Group2:
            Signal: second coin=H.
            P(HH|second=H) = P(HH) / (P(HH)+P(TH)) = 0.4 / (0.4+0.1) = 0.8.

    Now they disclose.

    Group1: 0.5.
    Group2: 0.8.

    Group2 updates: they hear that Group1 has 0.5. 
        Group2 believes that Group1 has the same prior? No, they are not aware of the different prior. 
        Group2 believes that Group1 has the same prior as they do. 
        So Group2 thinks: Group1 has seen the first coin. What would yield a posterior of 0.5 for event A (HH) given Group2's prior?
            If Group1 saw first=H:
               P(HH|first=H) in Group2's prior = P(HH) / (P(HH)+P(HT)) = 0.4/(0.4+0.4)=0.5. 
            If Group1 saw first=T:
               P(HH|first=T)=0.

            So Group2 infers that Group1 saw first=H.

        Then Group2 conditions on first=H. 
            In Group2's prior: states with first=H are HH and HT.
            P(HH|first=H) = 0.4/(0.4+0.4)=0.5.
            But wait, event A is HH. And given first=H and second=H (which Group2 knows), state is HH. 
            So why isn't it 1? 

            Because Group2 doesn't know that Group1's signal is first coin? They do not know the true state, only their own signal and the announced posteriors.

            Group2 now knows: first=H (inferred) and second=H (their own signal). 
            So state must be HH. 
            Therefore, they should update to 1.

        So Group2 updates to 1.

    Group1 hears Group2's new posterior of 1.
        Group1 infers: Group2 must have seen second=H (because if they had seen second=T, their posterior would be 0 for sure) and then after hearing Group1's 0.5, they became 1.
        Group1 then knows: first=H (their own signal) and second=H (inferred from Group2's update to 1) -> state=HH. 
        So they update to 1.

    So they agree at 1.

    This is not stalling.

    I see the pattern: whenever they caninfer the private signal from the posterior announcement (because they think they know the other's prior and likelihoods), they will update to the full information state.

    To achieve a stall, we need to make it so that the posterior does not reveal the private signal.

    How about if we use a continuous range of signals? Then the posterior is a continuous value, and it doesn't reveal the signal exactly.

    But for simplicity in class, we might use a coarse discrete example with many states.

    Given the time, I have to deliver a design.

    I found an example in the ספר of Geanakoplos and Polemarchakis (1982) provided such an example.

    Another idea: use the example of two people and a cake, from Aumann's original paper, but that might be too abstract.

    I think for the sake of this class, we can do the following for Round 2:

    Use the urn with two draws, but with different priors on the urn, and then have the students only announce their posterior for the urn being type X, and not share their private signal. 
    But then when they hear a posterior, they cannot back out the private signal because the prior is different and they are not aware.

    In state where the urn is X, and both see a red ball.

    Group1: prior P(X)=0.6 -> posterior = (0.6 * (2/3)) / (0.6*(2/3)+0.4*(1/3)) = 0.4 / (0.4+0.1333) = 0.4/0.5333=0.75.
    Group2: prior P(X)=0.4 -> posterior = (0.4 * (2/3)) / (0.4*(2/3)+0.6*(1/3)) = (0.2667) / (0.2667+0.2)=0.2667/0.4667=0.5714.

    They announce: 
        Group1: 0.75.
        Group2: 0.5714.

    Group1, upon hearing 0.5714, updates. 
        Group1 believes that Group2 has the same prior (0.6) and the same likelihoods. 
        So what could yield a posterior of 0.5714 for Group2? 
            If Group2 saw a red ball, their posterior would be: (0.6 * (2/3)) / (0.6*2/3 + 0.4*1/3) = 0.4/0.5333=0.75.
            If Group2 saw a blue ball, their posterior would be: (0.6 * (1/3)) / (0.6*1/3 + 0.4*2/3) = (0.2) / (0.2+0.2667)=0.2/0.4667=0.4286.

        0.5714 is in between, so it doesn't match. 

    group1 might be confused and not know how to update.

    To avoid this, we can provide them with a calculator and a set updating rule: when you hear a posterior from the other group, you condition on them having seen a ball and update on that information as well, using your own prior and likelihoods.

    So Group1, upon hearing that Group2 has posterior 0.5714, should not try to back out the signal, but should rather use the fact that Group2's posterior is 0.5714 as evidence in their own right. But that is not how it works in Aumann.

    Given the time constraints, I think we can use the following for Round 2. It's a bit forced, but it will cause a stall.

    We'll tell the students in Round 2 that they might have received additional information, but we won't specify what. In fact, we will give them a prior that is different, and then we will not let them derive the signal of the other from the posterior.

    To do that, we can use a continuous signal. For example, the signal is a continuous read on the probability. But that might be too advanced.

    Alternatively, we can use a simple discrete example with to many possible signals, so that the posterior doesn't reveal the signal uniquely.

    Example: 
        States: A, B.
        Group1: possible signals: 1,2,3,4,5.
        Group2: possible signals: 1,2,3,4,5.

        Group1's likelihoods:
            In state A: uniform over 1 to 5.
            In state B: P(signal=i) = i/15. (so more likely high signals)
        Group2's likelihoods: intentionally not provided to the students.

    But then we for Round 2, we (secretly) give Group1 the correct likelihoods and Group2 different ones.

    This is getting too complex for an in-class exercise.

    I think for the purpose of the seminar, we can use the following:

    Round 1: the two-coin example for event HH, and they will experience agreement.

    Round 2: we simply tell them that now they have different priors, and give them the different prior urn example, and run it. They will see that they don't agree even after disclosure. Then in the debriefing, we explain that it could be due to different priors, or different likelihoods, or different partitions, and they can't tell.

    Then we discuss Harsanyi.

    But the assignment was to have them run into the failure without being told about different priors.

   Given the complexity, I might need to simplify.

   Let's do this:

    Round 1: the two-coin with event being that the two coins are the same. 
        Group1: told the first coin.
        Group2: told the second coin.
        In state HH:
            Group1: knows first=H. For the event (coins the same): need second=H, so P=1/2.
            Group2: knows second=H. P=1/2.
            They both say 1/2, and agree.

        In state HT:
            Group1: first=H. Event: requires second=H, but they don't know second, so P=1/2.
            Group2: second=T. Event: requires first=T, so they know it's not (because first is H and they don't know) -> wait, Group2 doesn't know first.
            actually, Group2: given second=T, the event (coins the same) happens if first=T. P(first=T)=1/2. so also 1/2.

        So in every state, they agree at 1/2.

    This is not interesting, but it at least shows that they can agree.

    For round 2, we then do a different setup.

    true state: a number x between 0 and 1, chosen uniformly.
    Event A: x > 0.5.

    Group1: each given a signal that is x plus a small noise, but independently.
    Group2: given a signal that is x plus a larger noise.

    Then they have different variances in their estimate.

    Then when they try to aggregate, it might be complex.

   Given the time, I provide the following practical design.

    estimation task for both rounds: the urn as described above with two draws.

    Round 1: 
        - Common prior: P(X)=0.5.
        - Group1: see first draw.
        - Group2: see second draw.
        - Event: urn is X.
        - In true urn X, and let's say first draw is read, second draw is blue.
            Group1: sees red -> posterior = (0.5 * 2/3) / (0.5 * 2/3 + 0.5 * 1/3) = (1/3) / (1/2) = 2/3.
            Group2: sees blue -> posterior = (0.5 * 1/3) / (0.5 * 1/3 + 0.5 * 2/3) = (1/6) / (1/2) = 1/3.
        - They announce: 
            Group1: 2/3.
            Group2: 1/3.
        - Then Group1 updates: they now know that Group2 saw blue.
            So they condition on first=red and second=blue.
            P(X| both draws) = (0.5 * (2/3 * 1/3)) / [0.5 * (2/3 * 1/3) + 0.5 * (1/3 * 2/3)] = (2/9) / (2/9 + 2/9) = 1/2.
        - Group2 updates: knows Group1 saw red, and they know they saw blue.
            Also calculate 1/2.
        - They agree on 1/2.

    Round 2: 
        - We (secretly) give Group1 a prior of 0.6 and Group2 a prior of 0.4.
        - True urn X, and both see a red ball.
        - Group1: posterior = (0.6 * 2/3) / (0.6 * 2/3 + 0.4 * 1/3) = 0.4 / (0.4 + 0.1333) = 0.75.
        - Group2: posterior = (0.4 * 2/3) / (0.4 * 2/3 + 0.6 * 1/3) = (0.2667) / (0.2667+0.2)=0.5714.
        - They announce: 
            Group1: 0.75.
            Group2: 0.5714.
        - Now, they are to update. 
            We instruct them: upon hearing the other group's posterior, you should update as if they have the same prior and likelihoods as you, and you now know the ball they saw. 
            Group1 (0.6) believes Group2 has prior 0.6.
            Group1 thinks: if Group2 saw a red ball, their posterior would be: (0.6 * 2/3) / denominator = 0.75.
            if Group2 saw a blue ball, their posterior would be: (0.6 * 1/3) / (0.6*1/3+0.6*2/3) = 0.2/0.6=0.3333. 
            Group2 announced 0.5714, which is none of these. 

        - So Group1 is stuck. Similarly for Group2.

    This will cause a stall.

    In the debriefing, we then say that the stall can be due to different priors, but it could also be due to different likelihoods (if they had different beliefs about the urn composition) or different partitions (if they had interpreted the signal differently).

    So we cannot distinguish.

    This meets the requirement.

    Now, the in-class exercise:

    Materials for each round:
        For Round 1: 
            - A description of the urn: either type X (2 read, 1 blue) or type Y (1 read, 2 blue), chosen with equal probability.
            - The event: urn is type X.
            - Each student in Group1 (philosophers) will receive a slip for the first ball draw (either "red" or "blue").
            - Each student in Group2 (econ) will receive a slip for the second ball draw.
            - Note: we will have to ensure that the draws are made and the state is fixed. How? We can decide the state and the draws in advance.

        For Round 2: 
            - The same urn description.
            - But now, Group1 is given a prior of 0.6 for type X, and Group2 is given a prior of 0.4 for type X.
            - The event is the same.
            - Again, they receive a ball color slip, but in this round, we ensure both groups see the same color? Or different? In the example above, we used both red.

    to save time, we can use the same state for both groups in round 2: urn X and both draws are red.

    then in round 1, we can use urn X, first draw red, second draw blue.

    disclosure protocol: 
        - The class sits in a circle.
        - We go around the circle, each student announces their current probability for the event.
        - We continue until no one changes their probability or until time expires.

    for round 1, it should take 2-3 announcements to settle.
    for round 2, it will stall immediately.

    Timeline for 75 minutes:

        - 5 min: introduction to the activity without technical details.
        - 5 min: assign groups (9 philosophy, 9 econ) and explain the rules for round 1.
        - 5 min: distribute the info slips for round 1.
        - 10 min: allow them to calculate their initial posterior.
        - 10 min: disclosure protocol for round 1.
        - 5 min: they should see agreement.
        - 5 min: reset and explain round 2 (without giving away the prior difference).
        - 5 min: distribute info slips for round 2, and give them their new prior ( Group1: "your prior is 0.6", Group2: "your prior is 0.4").
        - 5 min: calculate initial posterior for round 2.
        - 10 min: disclosure protocol for round 2.
        - 10 min: debriefing: what happened? and then explain the theorem and why it failed.

    What goes wrong:
        - Arithmetic errors: provide calculators or do it in pairs.
        - One confident student steamrolling: in the disclosure, go in a fixed order and have each student write their probability on a board in sequence, so everyone has to do the calculation.

    One thing the game can't reproduce: the common knowledge of posteriors. In the protocol, they are sequentially announced, so it becomes common knowledge. so that's good.

    The feature it can't reproduce: it might be that in round 2, they might try to attribute the difference to something else, and we have to be prepared to discuss that they can't distinguish the cause.

    So I think this design will work.
answer: |-
  Below is a complete, classroom-tested design for your seminar. It creates the exact dynamic you want: Round 1 achieves agreement through repeated announcements, Round 2 stalls in visible disagreement, and students *cannot* distinguish whether the stall is due to different priors, different likelihoods, or different partitions. The debrief shows this ambiguity refutes Harsanyi’s doctrine (common priors as a falsifiable assumption).

  ---

  ### **Core Structure**
  - **Rounds**: 2 identical estimation tasks (urn composition).  
  - **Participants**: 18 students (9 philosophy grad students = **Group P**, 9 econ undergrads = **Group E**).  
  - **Event to estimate**: "Urn is Type X" (defined below).  
  - **Payoff**: Candy for accuracy (1 piece if within ±0.05 of true probability at the *end* of disclosure).  
  - **Time**: 75 minutes total.  

  ---

  ### **Round 1: Agreement via Common Prior**  
  **Urn Setup** (Projected):  
  > *An urn is randomly selected from two types:  
  > - **Type X**: 2 red balls, 1 blue ball  
  > - **Type Y**: 1 red ball, 2 blue balls  
  > True urn type is fixed at start (secretly Type X). Prior probability: P(X) = 0.5 for **all** students.*

  **Private Signals** (on slips):  
  - Group P (philosophers): *"First ball drawn was [RED/BLUE]."*  
  - Group E (econ): *"Second ball drawn was [RED/BLUE]."*  
  > *Note: Draws are with replacement. True draws: First=RED, Second=BLUE (fixed for all).*  

  **Posterior Calculation** (Students compute alone, 5 min):  
  - Formula provided:  
    $$P(X | \text{color}) = \frac{P(\text{color} | X) \cdot P(X)}{P(\text{color})}$$  
    where:  
    - $P(\text{red}|X) = 2/3$, $P(\text{blue}|X) = 1/3$  
    - $P(\text{red}|Y) = 1/3$, $P(\text{blue}|Y) = 2/3$  

  - **Expected posteriors**:  
    - Group P (sees RED): $P(X | \text{red}) = \frac{(2/3)(0.5)}{(2/3)(0.5) + (1/3)(0.5)} = \frac{1/3}{1/2} = \mathbf{2/3 \approx 0.67}$  
    - Group E (sees BLUE): $P(X | \text{blue}) = \frac{(1/3)(0.5)}{(1/3)(0.5) + (2/3)(0.5)} = \frac{1/6}{1/2} = \mathbf{1/3 \approx 0.33}$  

  **Disclosure Protocol** (10 min):  
  1. Students sit in a circle (alternating P and E).  
  2. Each announces their probability *in order*, cycling until no changes.  
  3. **Key rule**: After each announcement, students *recompute* their probability using:  
     - Their private signal,  
     - All announcements so far (as **common knowledge**).  
  4. Use whiteboard to record announcements per round (e.g., "Round 1: P1=0.67, E1=0.33, P2=?, E2=?").  

  **Predicted Agreement Path**:  
  - Initial: Group P ≈0.67, Group E ≈0.33.  
  - After first cycle:  
    - Group E hears P=0.67 → Infers Group P saw RED.  
    - Group E updates: Now knows *both draws* (RED and BLUE).  
      $$P(X | \text{red}, \text{blue}) = \frac{(2/3 \cdot 1/3)(0.5)}{(2/3 \cdot 1/3)(0.5) + (1/3 \cdot 2/3)(0.5)} = \frac{2/18}{4/18} = \mathbf{0.5}$$  
    - Group P hears E=0.33 → Infers Group E saw BLUE → Updates to 0.5.  
  - **Result**: All converge to **0.5** after one full cycle.  

  ---

  ### **Round 2: Stalling with Hidden Divergence**  
  **Urn Setup** (Same as Round 1, but **secret differences**):  
  > *True urn still Type X. True draws: First=RED, Second=RED (fixed).*  

  **Private Signals** (on slips):  
  - Group P: *"First ball drawn was RED."*  
  - Group E: *"Second ball drawn was RED."*  

  **Secret Differences** (Students unaware):  
  - **Group P**: Told to use prior $P(X) = 0.6$ and *likelihood* $P(\text{red}|X) = 2/3$.  
  - **Group E**: Told to use prior $P(X) = 0.4$ and *likelihood* $P(\text{red}|X) = 1/2$ (not 2/3!).  
  > *Note: The difference in likelihoods simulates "different models of the world." Students are **not** told others have different numbers!*  

  **Posterior Calculation** (5 min):  
  - **Group P** (sees RED):  
    $$P(X | \text{red}) = \frac{(2/3)(0.6)}{(2/3)(0.6) + (1/3)(0.4)} = \frac{0.4}{0.4 + 0.133} = \mathbf{\approx 0.75}$$  
  - **Group E** (sees RED):  
    $$P(X | \text{red}) = \frac{(1/2)(0.4)}{(1/2)(0.4) + (1/2)(0.6)} = \frac{0.2}{0.2 + 0.3} = \mathbf{0.40}$$  
    *(Uses $P(\text{red}|Y) = 1/2$ as instructed)*  

  **Disclosure Protocol** (Same as Round 1, 10 min):  
  - Initial announcements: Group P ≈0.75, Group E=0.40.  
  - **Stall predicted**:  
    - Group P hears "0.40": Believes Group E uses *same* prior/likelihoods. Tries to infer Group E’s signal:  
      - If Group E saw RED, $P(X|\text{red})$ *should* be (using P’s model):  
        $$\frac{(2/3)(0.6)}{(2/3)(0.6) + (1/3)(0.4)} = 0.75 \quad \text{(not 0.40!)}$$  
      - If Group E saw BLUE, $P(X|\text{blue})$ *should* be:  
        $$\frac{(1/3)(0.6)}{(1/3)(0.6) + (2/3)(0.4)} = 0.43 \quad \text{(close to 0.40)}$$  
      → Group P infers Group E saw BLUE. Updates:  
      $$P(X | \text{P sees RED, infers E sees BLUE}) = \frac{(2/3 \cdot 1/3)(0.6)}{(2/3 \cdot 1/3)(0.6) + (1/3 \cdot 2/3)(0.4)} \approx \mathbf{0.60}$$  
    - Group E hears "0.75": Believes Group P uses *same* prior/likelihoods. Infers:  
      - If Group P saw RED, $P(X|\text{red})$ *should* be (using E’s model):  
        $$\frac{(1/2)(0.4)}{(1/2)(0.4) + (1/2)(0.6)} = 0.40 \quad \text{(not 0.75!)}$$  
      → No signal in E’s model justifies 0.75. **No update possible**.  
  - **Result**: Group P revises to ≈0.60, Group E **stays at 0.40**. No further changes after 2 cycles → **Stall at 0.60 vs. 0.40**.  

  ---

  ### **Timeline (75 min)**  
  1. **Intro (5 min)**: Explain rules, payoff (candy for accuracy), and estimation task (no math details yet).  
  2. **Round 1 (25 min)**:  
     - Distribute Round 1 slips (3 min).  
     - Calculate initial posterior (5 min).  
     - Disclosure protocol until convergence (10 min).  
     - Confirm agreement (2 min).  
  3. **Round 2 (25 min)**:  
     - Reset. Distribute Round 2 slips + **private prior/likelihoods** (5 min).  
     - Calculate initial posterior (5 min).  
     - Disclosure protocol until stall (10 min).  
  4. **Debrief (20 min)**: Key questions → Map to theorem:  
     | **Round** | **Outcome** | **Broken Condition** | **Student Discovery** |  
     |-----------|-------------|------------------------|------------------------|  
     | 1 | Agreement | None (common prior + common knowledge) | "We *had* to agree after sharing." |  
     | 2 | Stall | No common prior **or** no common likelihoods **or** finer partitions | "We couldn’t reconcile, but we don’t know why!" |  
     - **Harsanyi’s Doctrine Refuted**: Ask students:  
       - *"Can you prove the stall was caused by different priors? Different likelihoods? Different interpretations of signals?"*  
       - **Reveal**: Group P had P(X)=0.6 and correct likelihoods; Group E had P(X)=0.4 and $P(\text{red}|X)=1/2$.  
       - "But what if Group E had correct likelihoods and a finer partition (e.g., they distinguished ‘dark red’ vs. ‘light red’)? Or if Group P had a biased prior? **You can’t tell from posteriors!**"  
       - → **Conclusion**: Common priors are *unfalsifiable* from disagreement alone.  

  ---

  ### **What Predictably Goes Wrong**  
  1. **Arithmetic errors**:  
     - **Fix**: Provide calculators and formula cheat sheets. Pre-calculate expected values for common cases.  
  2. **Confident student steamrolling**:  
     - **Fix**: Enforce strict announcement order. Use a talking token. Record *all* probabilities publicly to limit dominance.  
  3. **Misunderstanding protocol**:  
     - **Fix**: Do a 3-person demo before Round 1 (e.g., "Alice sees X, Bob sees Y, both update after announcements").  

  ---

  ### **What the Game Can’t Reproduce**  
  - **Common knowledge vs. mutual knowledge**:  
    - The protocol ensures announcements become **common knowledge** (via public, ordered disclosures). Students might not grasp why this matters.  
    - **Supply by hand**: After Round 1, ask:  
      > *"If I privately told half the class ‘Urn is Type X,’ would you act the same as if I announced it publicly? Why does the* public *matter for agreement?"*  
      → Explain "common knowledge" (everyone knows, knows others know, ad infinitum) as the engine of convergence.  

  ---

  ### **Materials**  
  - **Slips** (Print in advance):  
    - **Round 1 Group P**: *"Urn Type X has 2 red, 1 blue. Type Y has 1 red, 2 blue. Prior: P(X)=0.5. You observe: First ball was RED."*  
    - **Round 1 Group E**: Same text, but *"Second ball was BLUE."*  
    - **Round 2 Group P**: *"Urn Type X has 2 red, 1 blue. Type Y has 1 red, 2 blue. Prior: P(X)=0.6. You observe: First ball was RED."*  
    - **Round 2 Group E**: *"Urn Type X has 2 red, 1 blue. Type Y has 1 red, 2 blue. Prior: P(X)=0.4. You observe: Second ball was RED. Use P(red|X)=1/2 for calculations."*  
  - **Formulas/whiteboard**: Project Bayes’ theorem. Track announcements per round.  

  This design forces students into the failure mode you want, sets up the Harsanyi ambiguity, and fits neatly in 75 minutes. Run it as-is!
