prompt: |-
  I've been reading the takeoff-speed arguements since the Overcoming Bias days and honestly most of them feel like they'd survive any possible evidence, which bugs me. So before I read one more timelines post I want the spec, not another prediction.

  Write the desiderata for a theory of AI takeoff dynamics — an account of how fast capability climbs once the system is meaningfully contributing to its own improvement. What does it have to deliver to count as a real theory instead of a mood? For each: the requirement, the case or consideration behind it, and a tag saying whether it's non-negotiable or just a preference of one camp (the smooth-continuous-growth people, the discontinuity people, the bottleneck people, the outside-view people).

  Stuff I'd want in there, add to it or throw parts out:

  - it has to say what its capability metric actually is, and what happens to its claims when that metric saturates or gets re-benchmarked — otherwise "doubling time" doesn't mean the same thing across decades
  - it has to name the constraint that binds and say what changes when it's relaxed; an account that can't say which bottleneck is first in line isn't a theory of speed at all
  - endogeneity: the inputs (compute, data, evals, the researchers, the tools the researchers use) are partly produced by the thing being modeled
  - backtestability: could a version written ten years ago have been scored against what's happened since, and would anyone have bothered
  - no free knobs: it can't be able to accommodate both a slow and a fast outcome by turning a dial
  - consistency with growth rates we've actually observed in other transformative technologies — pick your own comparisons, I'm more interested in what you'd demand of the comparison than which ones you pick
  - some way to tell a genuine jump from a measurement artifact or a scope change

  Then the part I most want: which pair of these can't be jointly satisfied? My suspicion is backtestability and no-free-knobs are definately in tension, since the regime the theory is about hasn't happened yet — but argue it rather than just agreeing with me. If the list itself turns out to be a result, say so plainly. And tell me which single requirement knocks out the most popular accounts currently in circulation. Skip the scorecard of actual forecasts and skip the reading list, I've read all of it, that's the problem.
reasoning: |-
  Okay, the user is frustrated with the endless debates about AI takeoff speeds and wants a solid set of criteria for what makes a proper theory. They've been following these discussions since Overcoming Bias days and feel most arguments are unfalsifiable. They want desiderata for a theory of AI takeoff dynamics, not another prediction. 

  First, I need to unpack their request. They listed several requirements: a defined capability metric, identifying binding constraints, handling endogeneity, backtestability, no free parameters, consistency with historical tech growth rates, and distinguishing real jumps from artifacts. They also want to know which pairs conflict and which requirement disqualifies popular theories.

  The user's deeper need seems to be cutting through the noise. They're tired of theories that can't be pinned down. They want rigor—something that forces theorists to commit to testable claims. The mention of "mood" versus "real theory" suggests they value falsifiability highly.

  I should start by refining their list. Their points are good but need tightening. For example, "capability metric" must be operationalizable and trackable through paradigm shifts. Endogeneity isn't just about inputs—it's about recursive self-improvement. Backtestability should clarify it's about retroactive testing, not prediction.

  Now, conflicts: Backtestability vs. no-free-knobs is tricky. A theory with knobs can be tuned to fit past data but becomes vague about the future. A knob-less theory might not fit past data well if the pre-takeoff regime differs. This tension is central.

  Also, capability metric consistency vs. handling paradigm shifts might clash. A metric good for narrow AI may break with AGI, forcing trade-offs between precision and adaptability.

  Which requirement is most damning? Endogeneity. Many theories (e.g., some compute-centric ones) ignore that AI affects its own inputs. Without modeling that feedback loop, you can't capture takeoff dynamics. Yudkowsky-esque fast takeoffs often miss this too—they assume recursive self-improvement but don't ground it in constraints.

  I'll structure this by itemizing each desideratum with rationale and negotiability. Then highlight conflicts and the knockout punch. The user wants conciseness—no fluff. They've read everything, so skip examples and focus on logic.

  Need to ensure the response is actionable. Theorists should walk away knowing exactly what bar their model must clear. The "no free knobs" point is crucial—it prevents hindsight-fitting. Historical consistency guards against unrealistic extrapolation. 

  Final thought: The user's suspicion about backtestability vs. no-free-knobs is valid, but it's manageable if a theory specifies its domain (e.g., "this applies only past human-level") and sticks to invariant mechanisms. Still hard, though.
answer: |-
  Here's a distilled set of desiderata for a rigorous theory of AI takeoff dynamics, designed to separate substantive accounts from unfalsifiable "moods." I've refined your points, added critical ones, and flagged tensions:

  ### Core Desiderata (Non-Negotiable)
  1.  **Explicit, Operationalizable Capability Metric:**  
      *   **Requirement:** Must define *what* capability is being measured (e.g., task-specific performance, economic output equivalent, algorithmic efficiency on a benchmark suite, self-improvement rate) and how it translates to "improvement contribution." Must specify how metric validity is maintained (or how the theory breaks) during paradigm shifts, saturation, or benchmark changes (e.g., moving from ImageNet to ARC-AGI).  
      *   **Rationale:** "Doubling time" is meaningless without a consistent yardstick. "Meaningful contribution" must be quantifiable.  
      *   **Camp:** Universal requirement.

  2.  **Identified & Modeled Binding Constraint(s):**  
      *   **Requirement:** Must explicitly state the primary bottleneck(s) limiting the rate of capability gain *at a given stage* (e.g., compute, data quality/novelty, algorithmic insight, human oversight latency, verification time, energy). Must model *how* the relaxation or breakthrough of each constraint impacts the dynamics, especially if the constraint is endogenous.  
      *   **Rationale:** Speed is defined by the limiting factor. A theory that doesn't specify the constraint isn't explaining speed.  
      *   **Camp:** Universal requirement (though camps disagree *which* constraint binds when).

  3.  **Endogenous Feedback Loop Handling:**  
      *   **Requirement:** Must explicitly model how the AI system's *current capability level* affects the *inputs* to its own improvement (compute procurement, data generation/curation, tool creation, researcher augmentation/replacement, new algorithmic discovery, relaxing *other* constraints). Cannot treat inputs as purely exogenous.  
      *   **Rationale:** Recursive self-improvement is the core dynamic. Ignoring feedback loops (positive or negative) invalidates the model.  
      *   **Camp:** Universal requirement (though implementation complexity varies).

  4.  **Falsifiability / Constrained Predictive Power:**  
      *   **Requirement:** Must generate non-trivial, testable predictions (quantitative or clear qualitative) about observable *dynamics* (rates, accelerations, discontinuities) *before* the takeoff concludes, or must be falsifiable by pre-takeoff trends in capability, inputs, or constraint relaxation. Must specify failure conditions.  
      *   **Rationale:** Prevents "just-so" storytelling that can explain anything post-hoc. A theory must stick its neck out.  
      *   **Camp:** Universal requirement (core to being science, not mood).

  ### Highly Preferred (Strongly Indicative of Rigor)
  5.  **No Free Knobs / Limited Parameter Flexibility:**  
      *   **Requirement:** Core mechanisms and predicted dynamics (e.g., functional form of acceleration) should be largely insensitive to minor parameter tuning. Cannot smoothly morph from predicting slow continuous growth to fast discontinuity simply by adjusting unspecified "friction" or "multiplier" parameters without changing core assumptions.  
      *   **Rationale:** Prevents models that are always "adjustable" to fit any outcome, sacrificing explanatory power.  
      *   **Camp:** Preference of rigor-seekers; often violated by vague models.

  6.  **Historical Anchoring / Plausible Growth Rates:**  
      *   **Requirement:** Must demonstrate that the *proposed mechanisms and predicted growth rates* are consistent with (or plausibly extend) growth patterns observed in analogous complex, knowledge-generating systems (e.g., biological evolution, human scientific progress, pre-takeoff industrial/IT growth, narrow AI progress). Must justify why AI self-improvement is fundamentally different *in kind*, not just scale, if predicting radically novel dynamics.  
      *   **Rationale:** Guards against ungrounded extrapolation or assuming magic. "This time is different" requires compelling evidence.  
      *   **Camp:** Preference of gradualists/bottleneckers; often downplayed by discontinuity proponents.

  7.  **Artifact Discriminability:**  
      *   **Requirement:** Must provide criteria or mechanisms to distinguish between:  
          *   Genuine discontinuous capability jumps (e.g., novel paradigm enabling qualitatively new improvements).  
          *   Measurement artifacts (e.g., benchmark saturation, poor metric choice, discontinuous *measurement* like passing a threshold test).  
          *   Scope changes (e.g., sudden massive exogenous compute injection, human policy shift).  
      *   **Rationale:** Prevents misattributing external shocks or metric flaws to internal takeoff dynamics.  
      *   **Camp:** Preference of skeptics/empiricists.

  ### Addressing Backtestability
  *   **Refined Requirement (Pre-Takeoff Testability):** The theory should make predictions about *pre-takeoff precursor dynamics* (e.g., trends in research efficiency, algorithmic progress independent of scale, automation of research subtasks, constraint relaxation rates) that can be evaluated against historical data from the last 5-20 years of AI development. A theory written in 2010 *should* have made testable claims about the 2010-2024 period regarding its proposed bottlenecks and feedback mechanisms.
  *   **Rationale:** Ensures the theory isn't *only* about the unseen future; it must connect to observable reality. "Backtestability" in the strict sense (testing *takeoff dynamics* post-takeoff) is impossible pre-takeoff, but precursor dynamics are testable.
  *   **Camp:** Preference of empiricists/historians; often neglected by pure theorists.

  ---

  ### Key Tensions Between Desiderata

  1.  **Falsifiability (Pre-Takeoff) vs. No Free Knobs:** This is the core tension you identified.
      *   **Problem:** To be falsifiable *now* using pre-takeoff data, a model needs parameters to fit that complex, multi-variate history. But too many knobs make it adaptable to future outcomes. Conversely, a rigid, knob-less theory might poorly fit the messy pre-takeoff history, getting rejected prematurely, even if its core mechanism becomes dominant later.
      *   **Resolution?:** Theories must strike a balance: core mechanisms should be knob-less or minimally parameterized, while clearly distinguishing between *initial conditions* (fitted to pre-takeoff) and *invariant dynamics* governing the takeoff itself. Historical anchoring (#6) helps constrain parameters.

  2.  **Capability Metric Consistency vs. Handling Paradigm Shifts:**  
      *   **Problem:** Defining a stable metric (#1) is hard when capabilities qualitatively change. A metric good for pre-AGI might become irrelevant or unmeasurable post-AGI. But a theory that *only* works with vague or shifting metrics loses predictive power.
      *   **Resolution?:** Theories should specify the *domain of validity* for their metric and have a principled way to transition or integrate metrics as capabilities shift (e.g., linking task-specific metrics to general intelligence proxies).

  3.  **Endogeneity vs. Identified Constraints:**  
      *   **Problem:** Truly modeling endogeneity (#3) means constraints are fluid and dynamically changeable *by the system itself*. This makes definitively identifying *the* binding constraint (#2) at any future point extremely difficult, as a breakthrough could rapidly shift the bottleneck.
      *   **Resolution?:** Theories should model the *hierarchy* or *interdependence* of constraints and how breakthroughs cascade. They should predict *which types* of constraints are most vulnerable to relaxation via self-improvement at different capability levels.

  ---

  ### The Most Damning Requirement

  *   **The Knockout Punch: Endogenous Feedback Loop Handling (#3).**
  *   **Why:** This is the defining characteristic of an *intelligence explosion* scenario. **Most popular accounts fail catastrically here:**
      *   **Pure Compute Scaling:** Ignores how AI could acquire/design more compute faster, or find algorithms needing vastly less compute.
      *   **Data Bottleneck Models:** Often ignore AI's role in generating novel, high-quality training data or simulations.
      *   **Human-Centric Bottlenecks (Alignment/Oversight):** Frequently underestimate the speed at which AI could automate or radically augment the human roles.
      *   **Simple S-Curves/Logistic Models:** Treat feedback as exogenous or non-existent.
      *   **Many "Fast Takeoff" Scenarios:** Invoke recursive improvement as a *consequence* but don't rigorously model the *mechanisms* and *constraints* governing the feedback loop itself (Is it serial? Parallel? Limited by what?).
  *   **Result:** A theory lacking a serious model of endogeneity isn't modeling takeoff *dynamics* at all; it's modeling growth under static conditions. It fails to engage with the core question: "What happens when the system *actively* and *effectively* tries to remove the barriers to its own growth?"

  This list *is* a result: it defines the necessary features of a non-trivial theory. The field suffers because few theories meet all non-negotiables, often retreating into untestable generality or ignoring the hardest part (endogeneity).
