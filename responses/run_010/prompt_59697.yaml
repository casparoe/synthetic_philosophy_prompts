prompt: |-
  I'm a first-year archives MA student, and my program put me on the university's special collections access committee because they like having a student vote. Next week we decide what to do with an accession that's already sitting in our building: the surviving administrative records of a state residential institution for people labelled "feeble-minded" or "mentally defective," which ran from the 1920s until it was closed down in the early 90s. Roughly 900 case files, plus admission registers, disciplinary logs, staff correspondence, and a few hundred photographs of residents, almost none of them identified.

  Here's the mess. For a lot of these people, this is the only documentation of there life that exists anywhere — their families have nothing, and the state's copies were pulped years ago. But everything in the files was written by the people confining them. Residents show up as numbers, the diagnoses are straight eugenics vocabulary, and the only actual voices are the superintendent's. So the same box is both the sole evidence these people existed and a product of the machinery that erased them.

  Two descendants' groups have written to us wanting opposite things. One says open everything, we need to find our relatives, and sealing it lets the institution win by keeping its subjects invisible. The other says these are surveillance records created without consent, and putting them online with full-text search turns a superintendent's judgment into the permanent googleable identity of someone who can't answer back.

  Our access policy is no help: it just says records containing personal information are restricted for 75 years from creation. That treats a disciplinary log entry and a letter a resident wrote herself identically, and it doesn't distinguish at all between who made a record and who it's about. About half the files are past 75 years and half aren't.

  Could you draft the memo I'll circulate before the meeting? I need a real recommendation with a workable access scheme — what's open, what's restricted, under what conditions, and who decides when a descendant's request overrides the default — not a paragraph about balancing competing interests. It should take seriously the best argument on whichever side you end up rejecting, and I'd like it to say something about description, since our finding aid is going to reproduce the institution's own categories whether we mean to or not. Something a committee can read in ten minutes.
reasoning: |-
  Okay, the user is a first-year archives MA student serving on a special collections access committee. They're tasked with deciding what to do with records from a state residential institution for people labeled "feeble-minded" or "mentally defective." These records include case files, admission registers, disciplinary logs, staff correspondence, and photos. The dilemma is that these records are the only documentation of these individuals' existence, yet they were created by their oppressors, using dehumanizing language. Two descendant groups have opposing views: one wants full access to find relatives, while the other argues the records are non-consensual surveillance and should be restricted.

  The user needs a memo draft with a concrete recommendation on access restrictions, not just a vague balancing act. They want specifics on what's open, what's restricted, conditions for access, and how descendant requests override defaults. Also, they need advice on ethical description practices to avoid perpetuating harmful institutional categories.

  First, I need to address the core conflict: the records' dual nature as both evidence of existence and tools of erasure. The solution must navigate this tension. The 75-year rule in the current policy is inadequate because it doesn't differentiate between record creators or types. So, the recommendation should categorize records based on sensitivity and origin. 

  Breaking down the records: case files with diagnoses and disciplinary notes are high sensitivity; administrative documents like admission logs are medium; staff correspondence might be lower. Photos are tricky—unidentified ones could be less sensitive, but still problematic. 

  For access: high-sensitivity records should be restricted but accessible to direct descendants with proof. Researchers might access anonymized versions. Lower-sensitivity records could be open with researcher agreements. Descendant requests should override restrictions, but with privacy considerations for others mentioned in the documents. 

  Description is crucial. The finding aid must contextualize the harmful language and use respectful terminology. Adding a historical note and clear statements about the oppressive context can help. Also, involving descendant communities in redescription efforts could be a future step. 

  The memo needs to be concise for a 10-minute read. Structure it with sections: recommendation, principles, access details, description, and implementation. Acknowledge the valid points from both descendant groups—open access for visibility versus protection from harm. The recommendation tries to honor both by restricting the most harmful content while enabling access through controlled means. 

  Also, consider practical steps: forming a review panel, creating researcher agreements, and planning for redaction. Mention the need for a dedicated contact person for descendant requests. Highlight that this is an evolving policy, open to feedback. 

  Finally, ensure the language is respectful and avoids bureaucratic jargon. Emphasize the archives' role in reparative justice while safeguarding dignity. The memo should guide the committee to a decision that's both ethical and actionable.
answer: |-
  ## MEMORANDUM  
  **TO:** Special Collections Access Committee  
  **FROM:** [Your Name], MA Student Representative  
  **DATE:** [Date]  
  **SUBJECT:** Recommendation for Access Policy: State Residential Institution Records (Accession #[Number])  

  ### 1. RECOMMENDATION
  **Adopt a tiered access model prioritizing descendant agency and contextual harm reduction.** Open administrative records immediately. Restrict case files and sensitive personal documents to *in-person review* by verified descendants/researchers, subject to a mandatory researcher agreement prohibiting public identification. Photographs remain closed pending ethical review. Establish a descendant advisory panel to guide future decisions and redescription. This balances the vital need for descendants to reclaim histories with the imperative to avoid perpetuating institutional violence.

  ### 2. CORE PRINCIPLES
  *   **Evidence of Existence vs. Instrument of Oppression:** These records are both essential proof of life for erased individuals *and* products of a dehumanizing system. Access must acknowledge this duality.
  *   **Descendant Primacy:** Descendants have the strongest claim to these records concerning their own families.
  *   **Harm Mitigation:** Unmediated public access risks cementing oppressive narratives as the definitive identity of vulnerable individuals.
  *   **Context is Essential:** Records cannot be understood without acknowledging the institution's eugenicist foundations and power imbalance.

  ### 3. PROPOSED ACCESS SCHEME (Tiered by Record Type & Sensitivity)

  | Record Type                     | Default Access                 | Access Conditions                                                                                                  | Override Mechanism                                                                 |
  | :------------------------------ | :----------------------------- | :----------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------- |
  | **1. Administrative Records** (Admission/Discharge Registers, Non-confidential Staff Correspondence, Meeting Minutes, Financial Records) | **OPEN** (Physical & Digital) | N/A                                                                                                                | N/A                                                                                |
  | **2. Case Files & Highly Sensitive Documents** (Individual diagnoses, disciplinary reports, "treatment" notes, psychological evaluations) | **RESTRICTED**                 | *In-person access only* for:<br> - **Verified direct descendants** (documented lineage).<br> - **Qualified researchers** (approved project, IRB if applicable).<br> **Mandatory Researcher Agreement:** Requires anonymization in public work, prohibits publishing identifying details without descendant consent, acknowledges records' oppressive context. | Descendant request automatically overrides restriction *for their specific relative's file(s)* upon verification. |
  | **3. Photographs of Residents** | **CLOSED** (Pending Review)    | Immediate access only for **verified descendants** seeking *specific identified relatives* (rare).                | Descendant request for *specific identified relative* overrides. General access requires descendant panel review for ethical display protocols. |
  | **4. Staff Personnel Files**    | **RESTRICTED**                 | Access per standard institutional HR privacy policies (likely 75 years or longer).                                 | Standard institutional appeal process.                                             |

  **Key Distinctions from Current Policy:**
  *   Rejects blanket 75-year rule. Bases restriction on **sensitivity of content** and **subject vulnerability**.
  *   Explicitly differentiates between **creator** (institution/staff) and **subject** (resident).
  *   Prioritizes **in-person, mediated access** for sensitive material over unrestricted online publication.
  *   Establishes **descendant agency** as the primary override mechanism for restrictions concerning their family.

  ### 4. CRITICAL DESCRIPTION PRACTICES
  Our finding aid *must* actively counter the institution's dehumanizing framework. **We cannot merely replicate its categories.** We must:

  *   **Contextualize Relentlessly:** A prominent **Historical Note** must detail the institution's eugenic ideology, documented abuses, the power imbalance inherent in the records, and the harm caused by terms like "feeble-minded."
  *   **Use Respectful Language:** Replace institutional terms like "feeble-minded," "defective," or "inmate" in our descriptions with neutral terms ("resident," "patient," "individual") or clearly marked historical terms *in quotation marks*, accompanied by explanation (e.g., "Terminology reflects oppressive historical classifications").
  *   **Acknowledge Silencing:** Explicitly state in the scope & content note: "Records were created by institution staff; resident voices and perspectives are almost entirely absent."
  *   **Flag Sensitivity:** Clearly label series/folders containing highly sensitive material (case files, disciplinary logs) with access restrictions and a brief rationale (e.g., "Contains sensitive personal and medical information recorded within a coercive institutional context").

  ### 5. IMPLEMENTATION & NEXT STEPS

  1.  **Immediate Action:** Apply the tiered access model to the current accession upon committee approval.
  2.  **Establish Descendant Contact Protocol:** Designate a single staff point-person for descendant inquiries, with clear verification procedures.
  3.  **Draft Researcher Agreement:** Develop the mandatory agreement for sensitive records access (Legal/Dean of Libraries review recommended).
  4.  **Form Descendant Advisory Panel:** Proactively reach out to both descendant groups and relevant disability/advocacy organizations (e.g., local ARC chapter) to form a panel guiding redescription, photograph access protocols, and future policy refinements. **This is essential for ethical stewardship.**
  5.  **Redescription Project:** Prioritize resources to rewrite the finding aid incorporating the principles in Section 4, informed by initial descendant panel input.

  ### 6. ACKNOWLEDGING COMPETING CONCERNS

  *   **Pro-Openness Argument (Valid):** Sealing these records *does* perpetuate the institution's erasure. Descendants have a fundamental right to seek evidence of their families. Our recommendation addresses this by **granting verified descendants direct access to their relatives' records** and opening administrative data crucial for tracing individuals, while preventing the most harmful material from being weaponized online.
  *   **Pro-Restriction Argument (Valid):** Indiscriminate online publication *does* risk freezing individuals in the dehumanizing gaze of their oppressors. Our recommendation addresses this by **restricting the most sensitive case files to in-person review** under agreements prohibiting public identification, **closing unidentified photos**, and demanding **contextual description** that challenges the records' inherent bias, moving beyond the 75-year rule's passivity.

  This proposal seeks a pragmatic, ethically grounded path forward. It recognizes the records' profound value as evidence while actively mitigating their potential for ongoing harm. It centers descendant needs and establishes mechanisms for ongoing community guidance. I urge the committee to adopt this framework.
