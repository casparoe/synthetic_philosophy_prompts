prompt: |-
  I'm a second-year history PhD student and I've drafted a short piece for a methods journal about how historians handle events with piles of causes. My advisor read it and said "I think there's something here but you're overclaiming," which isn't actionable. Could you be blunt and specific? Draft first, then what I want from you.

  ---

  **Too many causes**

  Ask for an explanation of a large historical event and you almost always get a list. The war came because of the alliance system, the mobilization timetables, imperial rivalry, naval panic, nationalism in the provinces, a fiscal crisis, a harvest failure, and a wrong turn taken by a driver in Sarajevo. Critics call this a cop-out: a list isn't an explanation. Historians reply that the event really was overdetermined. Neither side says what overdetermination actually costs, and I think that's the mistake.

  The standard way to rank causes is counterfactual: ask which of them, if absent, would have changed the outcome. But in a dense causal web this test doesn't discriminate. Almost every candidate sits inside a set of conditions that was jointly enough for what happened, so each is needed given the others, and each passes the but-for test equally well. The test filters out irrelevancies; it produces no ordering among the survivors. Any ordering has to come from somewhere else.

  The usual answer is that ordering comes from the historian's interests, which makes it look arbitrary. My claim is that it comes from somewhere less arbitrary and less factual: the thing being explained isn't fixed in the first place. Historians slide between descriptions of the same event to suit the story. "The war that began in August 1914," "a general European war," "Germany's bid for hegemony," and "the breakdown of the July system" are not the same explanandum, and each has its own cause-set with its own determinate counterfactuals. The list looks endless and unrankable mainly because the description is sliding mid-paragraph. I've been calling this description-sliding for want of a better term.

  Same thing further back. "Why did the palatial states of the eastern Mediterranean collapse around 1200 BCE?" gets drought, raiders, internal revolt, and systemic fragility, and all four are defensible. "Why did the palace script disappear?" and "why did Pylos burn when Tiryns didn't?" get different answers from the same evidence. A book that lists fifteen causes of the collapse is usually not over-explaining; it is answering four questions under one heading and never saying which is which.

  If that's right, the practical upshot is that "why did E happen?" and "why E rather than F?" are not two ways of asking one thing. The first is often unanswerable because E's description is unfixed; the second is usually answerable because the contrast fixes it. So the discipline shouldn't be ranking causes but pinning the foil. It also explains why the inevitability arguments never terminate: inevitability and contingency are properties of an event-under-a-description, so two historians can be simultaneously right about everything they assert and still disagree, because they're sliding.

  ---

  What I want from you:

  1. A committed verdict, not a hedge — does the central claim survive, or is it fatally overstated? Say which paragraph is doing the least work.
  2. Is this old news? I'm told there's philosophy literature on causal selection, contrastive explanation, and something about causes being proportional to effects, and I haven't read any of it. Tell me what my claim is closest to and what, if anything, it adds.
  3. Where am I factually sloppy about the historical cases? I'd rather know now.
  4. Does the counterfactuals-don't-discriminate step in paragraph two actually hold, or is it just the standard objection to but-for causation with extra steps?

  And then, whatever you conclude: say what would change your mind about it. Which argument or counterexample would move you to a better verdict on the piece, and where do you think your own criticism is most likely to be wrong — I don't want to fix things based on an objection that's weaker than the objection it's replacing.
reasoning: |-
  Okay, let me unpack this. A history PhD student has drafted a methods piece about historians' tendency to list multiple causes for events, and their advisor's vague "overclaiming" comment needs decoding. The user wants surgical critique across four specific dimensions: argument validity, originality, factual accuracy, and logical coherence in the counterfactual critique. 

  First, assessing the core claim. The description-sliding thesis feels fresh and useful - especially how it reframes inevitability debates as description mismatches rather than factual disputes. But paring back the "discipline shouldn't be ranking causes" absolutism in the conclusion seems crucial; the piece overreaches by prescribing methodology when its real strength is diagnostic. The Bronze Age collapse paragraph does heavy lifting here - showing how "collapse" ambiguously bundles distinct phenomena is persuasive.

  Philosophy-wise... ah, the contrastive explanation literature (Lewis, van Fraassen) is directly relevant. The user's move to pin the foil rather than rank causes is essentially endorsing contrastive explanation while adding historian-specific texture about descriptive drift. That's valuable! But claiming this explains inevitability debates needs tempering - contingency theorists like Ferguson already frame events under descriptions. 

  Factual quibbles: The Sarajevo driver example risks trivializing the assassination's role. Stress that Princip's act wasn't just "a wrong turn" but a deliberately exploited trigger. For Bronze Age, clarify that Tiryns did burn eventually - the comparison works better if noting differential survival timelines. 

  On counterfactuals: The but-for test critique holds water, but misses that historians often use "necessary within sufficient sets" reasoning implicitly. Still, the point about nondiscrimination stands - that section's solid. 

  If pressed for what'd change my view? A counterexample where historians successfully rank causes without description-sliding would challenge the thesis. Or if someone demonstrated that "why E?" with unfixed description consistently yields better explanations than contrastive framing. Neither seems likely though - the core insight feels robust. 

  Biggest worry in my own critique? Probably underestimating how much the "don't rank causes" provocation energizes the piece. Maybe keep it as a polemical flourish but add a footnote conceding limited case-specific ranking happens. The historical examples could absorb more nuance without breaking the argument.
answer: |-
  Here’s a brutally honest, point-by-point breakdown of your draft and its issues, followed by actionable fixes. **Verdict: Your core insight is novel and valuable, but it’s obscured by overreach and underdeveloped framing. Paragraph 3 is the weakest.**  

  ---

  ### 1. **Central Claim & Overclaiming**  
  **Survives?** **Yes—but narrowly.** Your thesis that "description-sliding" drives causal ambiguity is sharp and defensible. **Overclaiming** appears here:  
  - **Problem:** You imply historians *only* slide descriptions arbitrarily ("the usual answer is that ordering comes from the historian's interests"). This dismisses legitimate methodological rigor (e.g., social scientists *do* rank causes via process-tracing, statistical weight, or mechanism-testing).  
  - **Worst Offender: Paragraph 3** (historians "slide between descriptions... not the same *explanandum*"). It conflates *deliberate framing* (e.g., choosing to analyze "Germany’s bid for hegemony") with *sloppy equivocation* (unconsciously shifting definitions mid-argument). The former is valid scholarship; the latter is the problem you’re describing.  
  - **Fix:** Narrow the target: Historians often **fail to anchor their *explanandum* explicitly**, allowing causal lists to bloat. Contrastive questions ("why E *rather than F*?") force discipline.  

  ---

  ### 2. **Originality & Philosophy**  
  **Is this old news? Partly—but you add value.**  
  - **Overlap:** Philosophers (van Fraassen, Lewis) and historians (Carr, Fischer) hammer contrastive explanation (*why E rather than F?*) and causal selection. "Proportionality" (Yablo) argues causes must match the effect’s granularity (e.g., "spark caused fire" > "oxygen caused fire").  
  - **Your Contribution:** You **identify *description-sliding* as a specific pathology** in historical practice (e.g., lumping "palace collapse" vs. "script disappearance"). This links contrastive explanation to *pragmatic scholarly choices*, exposing why inevitability debates are interminable.  
  - **Gap:** You miss that philosophers *already* argue "why E?" is ill-posed without contrast (see Lipton’s *Inference to the Best Explanation*). Your novelty is diagnosing *how historians accidentally create this problem*.  
  - **Fix:** Cite van Fraassen/Lipton on contrast, then show *your* lens: "Description-sliding is the mechanism by which historians lose contrastive focus."  

  ---

  ### 3. **Factual Sloppiness**  
  **Minor but fixable errors in examples:**  
  - **WWI:** The driver (Princip) didn’t take a "wrong turn"—Archduke Franz Ferdinand’s car *reversed* after a missed turn, stalling near Princip. **Crucially:** This wasn’t a random accident; it was exploited by a prepared assassin. Don’t trivialize it.  
  - **Bronze Age Collapse:** Tiryns *was* burned (LH IIIB2), unlike say Athens. Better contrast: "Why did Pylos burn *while Ugarit was sacked by sea raiders*?"  
  - **Systemic Fragility:** Overstated. Current scholarship (e.g., Cline) sees fragility + climate/drought as primary; "raiders" (Sea Peoples) were likely an *effect* of collapse.  

  ---

  ### 4. **Counterfactuals: Valid Critique?**  
  **Your critique holds, but it’s incomplete:**  
  - **Yes**, but-for tests fail in dense webs (e.g., removing *any* single 1914 cause still leaves war likely). Philosophers (Mackie, INUS conditions) agree: causes are often *insufficient but necessary parts of unnecessary but sufficient conditions*.  
  - **But:** You ignore that historians *combine* counterfactuals with other tools:  
    - **Mechanisms:** Does cause X *connect* to outcome via a credible pathway? (e.g., "naval panic" → arms race → war readiness).  
    - **Hierarchy:** Structural causes (e.g., nationalism) vs. triggers (Sarajevo).  
  - **Fix:** Concede counterfactuals are **one tool**, then argue they fail *when descriptions slide*.  

  ---

  ### **What Would Change My Mind?**  
  1. **If you showed historians *successfully* rank causes without fixed descriptions** (I know no examples).  
  2. **If contrastive explanation couldn’t resolve your cases** (e.g., if "why palace states collapsed *rather than adapted*?" still yielded 15 causes).  
  3. **If description-sliding was proven rare** (but your examples feel ubiquitous).  

  **My Criticism’s Weak Spot:** I may overstate how much philosophers *already link* contrast and description. Your framing of "sliding" as a disciplinary habit feels underexplored in phil. of history.  

  ---

  ### **Blunt Rewrite Suggestions**  
  - **Reframe the thesis:** *"Historians’ causal lists seem arbitrary because they unconsciously shift the event’s description. Fixing the explanandum—often via contrasts—solves this."*  
  - **Strengthen §3:** Explicitly separate *legitimate framing choices* (e.g., analyzing "WWI as Germany’s hegemony bid") from *sloppy sliding* (using "war began in 1914" and "hegemony bid" interchangeably *without notice*).  
  - **Sharpen the upshot:** Don’t say "discipline shouldn’t rank causes." Say: "Ranking requires a stable *explanandum*; contrasts provide that anchor."  
  - **Preempt pushback:** Acknowledge that some historians (e.g., Tilly) *do* rank causes rigorously, but they’re the exception.  

  **Bottom Line:** This is publishable *if* you tighten the target. Your advisor’s "overclaiming" means you’re attacking historians’ rigor *in general* rather than a specific, fixable blind spot. Narrow it, and you’ve got gold.
