  The biggest target is likely Point 1 - the claim that COI concepts don't apply because there's no principal. This challenges the foundation of anti-corruption work. I should prepare the user to concede some ground early, maybe acknowledging that COI frameworks are vital in governance contexts but explaining why the analogy breaks in open-source.

  For objections:
