answer: |-
  ### (a) Essay Question (25 marks, 45 minutes)
  "Analyse the ethical implications of classifying the hospital's provision of wakefulness drugs to its residents using the therapy/enhancement distinction. Focus specifically on how the hospital’s institutional control over the background conditions necessary for the distinction (the 24-hour shifts) affects the distinction's ability to: (i) provide a non-manipulable baseline for determining 'normal functioning', and (ii) serve its two primary purposes of guiding public insurer funding decisions and marking a meaningful ontological difference between healing and enhancement. Can the distinction retain its ethical significance in this context? Why or why not?"

  ### (b) Model Answer (~600 words)
  The hospital's modafinil provision creates a paradox for the therapy/enhancement distinction, fundamentally undermining its coherence and utility due to institutional manipulation of the baseline. Measured against a *well-rested resident*, the drug elevates cognitive function beyond species-typical norms, fulfilling a standard definition of enhancement. Measured against an *exhausted resident at hour 20 of a shift mandated by the hospital itself*, it restores function to a "normal" operational level for that context, resembling therapy. The core problem is that the background condition defining "normal functioning" – debilitating sleep deprivation – is directly created and sustained by the institution offering the intervention. The hospital controls both the cause of the deficit and the "remedy," rendering the baseline inherently manipulable. Accreditation requirements prevent simply shortening shifts, but crucially, the hospital actively chooses to maintain this structure, knowing it necessitates the drug for "normal" function within its own system.

  This manipulability devastates the concept of a non-manipulable baseline. The "normal-functioning" model relies on identifying a stable, species-typical reference class. Here, the reference class itself shifts based on the institution's operational choices. The hospital could theoretically redefine "normal" for its residents as "functioning while severely sleep-deprived," making the drug therapeutic, or define it as "well-rested," making it enhancement. Neither reference class is ontologically privileged; both are institutionally stipulated. Consequently, the distinction becomes a tool for institutional justification rather than an objective ethical marker. Calling it "therapy" legitimizes the grueling shift system by framing the drug as merely correcting an *internal* deficit caused by *external* institutional demands.

  This collapse of a stable baseline severely compromises the distinction's ability to fulfill its two primary purposes. First, regarding public insurer funding: if classified as therapy restoring residents to "normal function" *within the hospital's chosen context*, funding seems justified. However, this ignores that the "dysfunction" requiring therapy is externally imposed by the very system seeking reimbursement. Funding the drug could tacitly endorse and perpetuate harmful institutional practices, whereas refusing to fund it as "enhancement" ignores the genuine restoration of capacity needed for safe patient care *under current, flawed conditions*. The funding decision becomes entangled with validating or condemning the institutional structure itself, something the therapy/enhancement framework is ill-equipped to handle.

  Second, the distinction fails to mark a meaningful ontological difference between healing and "something else." Whether the intervention is seen as healing a deficit or enhancing capacity depends entirely on the institutionally selected reference point. There is no inherent, ethically significant difference in *kind* between the mechanism of action here and its use by a well-rested student. The difference lies solely in the manipulated context. Calling it "therapy" in the residency context obscures the fact that the institution is causing the problem it then "solves," masking questions of institutional responsibility and labour ethics under the guise of medical restoration.

  Therefore, the therapy/enhancement distinction loses its ethical significance in this scenario. It cannot provide a non-manipulable baseline because the baseline is defined by the institution wielding the distinction. It cannot reliably guide funding without implicitly judging the institution's practices, and it fails to identify an ontological essence differentiating this use from enhancement elsewhere. Ethical analysis must shift focus away from classifying the drug and towards the institutional responsibility for creating harmful conditions and the permissibility of using pharmacological tools to sustain them, regardless of whether we label it "therapy" or "enhancement."

  ### (c) Marking Scheme (5 Criteria)

  1.  **Analysis of Institutional Manipulability & Paradox (8 marks):** Demonstrates how the hospital’s control over shift schedules directly creates the conditions allowing the *same intervention* to be classified as either therapy or enhancement by manipulating the reference class, creating a paradoxical situation. *Loses marks* for merely describing the two perspectives without highlighting institutional agency or the paradoxical nature.
  2.  **Critique of Non-Manipulable Baseline (5 marks):** Explicitly argues why the "normal-functioning"/species-typical model fails to provide a stable, non-manipulable baseline here, emphasizing that the institution defines the relevant "normal" (sleep-deprived resident) and could change this definition strategically. *Loses marks* for accepting either reference class as objectively valid without critique or failing to link manipulability to the core concept of "normal function."
  3.  **Conflict Between Purposes & Context (6 marks):** Shows how the two purposes of the distinction (funding line, ontological marker) conflict or become incoherent *specifically because of* the institutional context, e.g., funding the "therapy" endorses harmful shifts, while the lack of ontological difference undermines the healing/enhancement boundary. *Loses marks* for treating the two purposes in isolation or not connecting their failure directly to institutional manipulation/stipulations.
  4.  **Collapse of Ontological Difference & Alternative Focus (4 marks):** Argues persuasively that the manipulable context means the drug intervention lacks an inherent ontological difference from enhancement uses (e.g., by students), rendering the distinction ethically insignificant for categorisation, and suggests the focus *must* shift to institutional responsibility/ethics. *Loses marks* for maintaining the distinction holds inherent meaning here or not proposing a necessary shift in ethical focus.
  5.  **Policy Entanglement Insight (2 marks):** Identifies the specific problem that classifying the intervention for funding purposes becomes inherently entangled with a judgment on the permissibility of the institutional practice (the long shifts) itself, which the therapy/enhancement framework cannot resolve. *Loses marks* for not making this explicit connection between funding classification and institutional validation.
