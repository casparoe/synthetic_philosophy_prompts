prompt: |-
  My friend and I argued until two in the morning about whether Lakatos's methodology actually bites on real cases, and we ended up accusing each other of the very thing we were discussing. Here are the verdicts I was left holding, and I want to know what principle, if any, they add up to.

  1. Le Verrier postulates an unseen planet to absorb the residuals in Uranus's orbit, and it turns up roughly where he said. Progressive; I regard this as the paradigm case.
  2. The same programme faces an excess in Mercury's perihelion. Auxiliary hypotheses are offered for decades — an intra-Mercurian planet, a zodiacal dust cloud, a solar oblateness — and none is confirmed. I want to call this degenerating, yet I cannot say at what date it became so, and I certainly would not have said it in 1900.
  3. A programme in social psychology has survived eleven consecutive failed replications, each time by positing a further moderator — cultural sample, stimulus intensity, participant mood — every one of which is measurable in principle and none of which was ever measured in advance. Degenerating, clearly. But note that this case satisfies the obvious formal test I would have proposed, that auxiliaries be independently testable.
  4. A colleague's programme in evolutionary developmental biology has generated no novel prediction in thirty years, yet its vocabulary has been quietly adopted by three neighbouring fields that now produce results with it. I want to call this progressive, and my friend says I have no right to.
  5. A rival programme is worse still: no predictions, no uptake, no technical apparatus. I find myself thinking the first programme's standing cannot depend on that fact, and then noticing that in practice it does.

  The principle I kept reaching for was something like: a programme is progressive just when its auxiliaries are independently testable and at least one has borne out a novel prediction. Case 3 breaks the first clause and case 4 breaks the second, and I cannot patch both without the principle ceasing to say anything.

  Please answer in British English, under these headings: **The pattern in my verdicts** (about 150 words) — what my five judgements have in common and where they pull against each other; **Candidate principles** (about 300 words) — two or three, each stated as explicit necessary and sufficient conditions, with the case that motivates each clause; **Pressure points** (about 200 words) — the case or pair that each candidate cannot accommodate, and how much complexity it costs to keep them; **The verdict I should drop** (about 120 words) — if a simpler principle forces me to give up one of 1 to 5, which and why; **One new case** (about 100 words) — a situation I have not described, drawn from the history of science or invented, on which your favoured principle delivers a verdict that would surprise me.
reasoning: |-
  Hmm, the user presents a fascinating philosophical puzzle about Lakatos's methodology of scientific research programmes. They've described five real-world cases where they've made judgments about whether scientific programmes were progressive or degenerating, but these judgments seem to conflict when they try to formulate a consistent principle. 

  The user's cases cover astronomy, social psychology, and evolutionary biology, showing how messy real science can be. Their proposed principle about independently testable auxiliaries and confirmed novel predictions gets broken by case 3 (testable but never tested) and case 4 (no predictions but widespread adoption). This is clearly frustrating them as they can't find a clean solution.

  I notice the user seems torn between formal criteria and practical scientific impact. They're intuitively recognizing that scientific progress isn't always linear or easily measurable by predetermined rules. The social psychology case (3) bothers them because while it technically satisfies the testability criterion, it feels degenerative in practice. Meanwhile the evo-devo case (4) lacks predictions but has clear influence, which they want to count as progressive.

  The core tension here is between Lakatos's rational reconstruction and how science actually operates. The user wants clear demarcation but their own examples show boundary problems. Their colleague was right to challenge them on case 4 - uptake alone might indicate fashion rather than progress. But equally, case 5 shows how relative comparisons matter in practice.

  I should acknowledge that their judgments are broadly reasonable but can't be perfectly systematized. The Mercury case (2) is particularly instructive - like many historical episodes, its degenerative status only became clear in retrospect. This suggests that Lakatosian assessments may sometimes require historical distance.

  For a new case, I'm considering the steady-state cosmology programme, which persisted despite accumulating anomalies until the CMB discovery provided decisive evidence against it. This would illustrate how programmes can remain progressive for surprisingly long periods through skillful auxiliary adjustments, until they hit a critical anomaly.
answer: |-
  **The pattern in my verdicts**  
  Your judgements reveal a tension between formal Lakatosian criteria (novel predictions, testable auxiliaries) and broader, contextual factors like *influence* and *pragmatic success*. Cases 1 (Le Verrier) and 3 (social psychology) align cleanly with Lakatos: progressive due to confirmed novelty and degenerating due to untested, post-hoc auxiliaries. Case 2 (Mercury) highlights the *temporal* ambiguity in labelling degeneration – you resist retroactive judgement. Cases 4 (evo-devo) and 5 (rival programme) pull hardest against formalism: you value cross-disciplinary uptake and heuristic utility (4) over strict predictive novelty, and implicitly use *relative* assessment against rivals (5), something Lakatos downplays. The core conflict is between rigid criteria and the messy reality of scientific progress measured by community adoption or long-term fertility, even without immediate predictive wins.

  **Candidate principles**  
  1.  **Strict Lakatosian:**  
      *   **Progressive iff:** Auxiliaries are independently testable *and* lead to at least one confirmed novel prediction.  
      *   **Motivation:** Case 1 (novelty confirmed) satisfies this; Case 3 (auxiliaries untested despite being testable) violates the *spirit* of independent testability, highlighting its necessity. Case 4 violates the novelty clause.  
  2.  **Inclusive Fertility:**  
      *   **Progressive iff:** The core programme motivates significant research (novel predictions, new experiments, theoretical development) *or* is fruitfully adopted/adapted by other fields, *without* relying persistently on untestable or unfalsified post-hoc auxiliaries.  
      *   **Motivation:** Accommodates Case 4 (uptake = fertility) and Case 1 (novelty). The auxiliary clause rules out Case 3. "Significant research" avoids judging Case 5 progressive by default.  
  3.  **Comparative Progress:**  
      *   **Progressive iff:** The programme demonstrably advances understanding better *than its rivals* within its domain, measured by problem-solving, predictive success, or explanatory scope, *and* its auxiliaries are testable in principle.  
      *   **Motivation:** Explains your judgement in Case 5 (relative standing matters) and Case 1 (outperforms rivals). Case 4's adoption *could* indicate relative success. Case 3's rivals might fare worse. Testability rules out truly ad-hoc moves.

  **Pressure Points**  
  *   **Strict Lakatosian vs. Case 4:** It *cannot* accept Case 4 as progressive without abandoning the necessity of novel predictions. Calling Case 4 progressive requires dropping or weakening the novelty clause significantly.  
  *   **Inclusive Fertility vs. Case 2:** It struggles with the *timing* of labelling Mercury degenerating. Was it "persistently" unfruitful in the 1880s? It might delay the degenerating verdict longer than your intuition, or require complex historical judgement of "persistence".  
  *   **Comparative Progress vs. Case 3:** If its rivals (e.g., null hypothesis, alternative theories) are *also* stagnant or employ similar tactics, Case 3 might *not* be judged degenerating relative to them, contradicting your clear verdict. It risks excusing bad practice if the field is uniformly weak.

  **The verdict I should drop**  
  You should consider dropping **Case 4** as definitively *progressive*. While its uptake is *suggestive* of fertility, your friend has a point: adoption by neighbours doesn't *prove* the core programme itself solved novel problems or made risky predictions. It might indicate useful terminology or framing, not Lakatosian progress *of the programme itself*. Calling it progressive based solely on uptake conflates influence with the programme's *internal* heuristic power and novel predictions. A principle demanding *some* form of predictive or explanatory advance *within the programme's core domain* (beyond terminology) is more robust, even if uptake is a strong indicator.

  **One new case**  
  **The Phlogiston Theory (1770s):** It successfully explained combustion, calcination, and respiration for decades. Facing anomalies (e.g., metals *gaining* weight when calcined), proponents proposed auxiliaries: phlogiston had *negative* weight (independently testable? Only via associated phenomena, not directly). It generated novel predictions (e.g., about gases). Yet, it was ultimately replaced by Lavoisier's oxygen theory.  
  *   **Favoured Principle (Inclusive Fertility) Verdict:** *Degenerating* by the 1780s. Despite past success and testable(-ish) auxiliaries, its core ceased to motivate significant *new* explanatory or predictive advances relative to the rapidly progressing rival oxygen programme. Its auxiliaries became increasingly strained and failed to match the novel problem-solving power of the alternative. This verdict might surprise you as phlogiston *did* have predictive successes, but its failure to keep pace decisively marks its degeneration.
