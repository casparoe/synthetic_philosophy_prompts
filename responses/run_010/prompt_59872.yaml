prompt: |-
  I sit on the acquisitions and authentication committee of a museum with oddly mixed holdings: paintings, manuscripts and first editions, eighteenth-century furniture, a wine cellar, and an archive of scores and historical recordings. Every time a disputed object comes before us we rebuild our standard from scratch, and the arguments turn out to be the same ones in different clothes. Before the next meeting I want the specification written down.

  Set out the desiderata — what any account of why an original is worth more than an indistinguishable copy has to deliver — and give, for each requirement, the case that motivates it. The list has to cope with at least these: a flawless forgery of a painting, perceptually indiscernible from the original, which seems worthless the moment it is exposed; that same flawless copy signed and dated by the person who actually made it, which now looks like a legitimate achievement; an exact re-performance of a Baroque score, where nobody thinks the copy is second-rate; an artist who re-executes her own famous early canvas decades later, more skillfully; a panel painting whose surviving surface is largely the product of successive restorations, so that the "original" is itself a kind of copy; and the openly labelled reproductions in our furniture and wine holdings, where the market's easy indifference to copies needs explaining rather than being assumed.

  Then tell me which requirements are genuinely binding and which are the prejudices of a particular camp smuggled in as common sense, and identify the subset that cannot be jointly satisfied. If the honest conclusion is that nothing can honor both the intuition that aesthetic value is available to perception and the intuition that provenance bears on that value aesthetically and not merely morally, state that as the result rather than papering over it. Finish by naming the single requirement that does the most work in eliminating candidates.
reasoning: |-
  Okay, let's tackle this museum acquisitions problem. The user wants a clear framework to evaluate why originals are valued over copies, even when they're indistinguishable. First, I need to list all the cases they mentioned: forged paintings, self-copies, baroque reperformances, restored panels, and reproductions in furniture/wine. Each challenges different aspects of authenticity.

  Hmm, the key is to extract desiderata from these cases. For instance, the forged painting becoming worthless upon exposure points to provenance mattering. But the same copy signed by its actual maker gaining value suggests that authenticity isn't just about the object's appearance. The baroque reperformance case shows that in music, the copy isn't seen as inferior, which might relate to performance practices versus fixed works.

  The artist redoing their own work later introduces the creator's status versus historical context. The restored panel questions material continuity—how much of the original is left? And the furniture/wine examples highlight market indifference, where functional copies are accepted without issue. 

  Next, conflicts between desiderata. Provenance vs. perceptual equivalence seems irreconcilable in cases like the forgery. If aesthetic value is purely perceptual, the forgery should be equal, but it's not. That's a core tension. Also, creator status vs. historical primacy clashes when an artist's later copy is technically better but less valued.

  The most binding requirement appears to be Provenance Mattering Aesthetically (PMA), as it's central yet conflicts with perceptual equivalence. If provenance affects aesthetic value, then even perfect copies might lack something intangible. But this clashes with the idea that art's value is in the experience. 

  The user might need to confront that both intuitions—provenance's aesthetic role and perceptual accessibility—can't be fully reconciled. Maybe they'll need to prioritize based on context, like different standards for paintings versus wine. But being explicit about this conflict is crucial rather than hiding it.
answer: |-
  Here is a specification of desiderata for your committee, derived from your cases, with their motivations, an analysis of binding constraints, irreconcilable conflicts, and the key requirement:

  **The Desiderata (What a Theory Must Explain):**

  1.  **Provenance Mattering Aesthetically (PMA):** The *origin* of an object must have a direct bearing on its *aesthetic value* or artistic significance, not just its market price or historical interest.
      *   **Motivating Case:** The flawless forgery. Upon exposure, its aesthetic/artistic value collapses entirely, even though perception is unchanged. Its lack of connection to the original creator/context renders it artistically null.

  2.  **Perceptual Equivalence (PE):** Aesthetic properties must be accessible through perception of the object itself. If two objects are perceptually indistinguishable under relevant conditions, they *should* possess the same aesthetic properties.
      *   **Motivating Case:** The Baroque reperformance. The copy (performance) is valued aesthetically on par with the "original" (another performance) because the audible/performative qualities are what matter. The score is the work, the performance is the instance.

  3.  **Creator Status (CS):** The identity and status of the creator at the time of creation are aesthetically relevant. The same physical object gains or loses value based on who made it and when.
      *   **Motivating Case:** The flawless copy signed by its actual maker. When perceived as a forgery, it's worthless; when perceived as an original work by its actual creator (even if derivative), it gains legitimate artistic value. The creator's identity and intention are constitutive.

  4.  **Historical Primacy (HP):** The first instantiation or the object created within its original historical/cultural context holds unique aesthetic significance that subsequent copies cannot replicate, even if perceptually identical or technically superior.
      *   **Motivating Case:** The artist's later re-execution. Despite greater skill and potential perceptual superiority, the later copy lacks the aesthetic weight of the original created in the artist's early period, imbued with the context and moment of its genesis.

  5.  **Material Continuity (MC):** The persistence of the original physical matter, even if significantly altered or degraded over time, carries aesthetic weight distinct from replicas of its current state.
      *   **Motivating Case:** The heavily restored panel. Despite most surface paint being later restoration (a kind of copy), the *substrate* and the trace of the original creator's hand (even if minimal) grant it the status of the "original," differentiating it from a modern replica.

  6.  **Functional/Experiential Primacy (FEP):** For certain categories, the aesthetic experience or functional purpose is paramount, and origin/copy distinctions are irrelevant if the experience/function is identical.
      *   **Motivating Case:** Furniture & Wine Reproductions. A perfect replica chair provides the same utility and aesthetic experience in situ as the original; a well-made reproduction wine provides the same gustatory experience. The market indifference reflects that provenance is (primarily) historical/economic, not *aesthetically* constitutive for the core experience here.

  7.  **Revealed Value Shift (RVS):** Knowledge about origin must be capable of radically altering the perceived aesthetic value *without* altering the perceptual properties of the object itself.
      *   **Motivating Case:** The exposed forgery (and, conversely, the legitimized copy). The aesthetic value crashes or rises solely based on the revelation of provenance, demonstrating that aesthetic value isn't fully contained in the perceptible object.

  **Analysis of Binding Constraints & Prejudices:**

  *   **Genuinely Binding Requirements (Core Tensions):**
      *   **PMA & RVS:** These are tightly linked and fundamentally binding. They capture the core intuition from the forgery case and the legitimized copy case that origin *must* matter aesthetically, not just historically or morally. Any theory denying this fails your primary challenge.
      *   **PE:** This is equally binding but creates the central conflict. It embodies the intuition that art is experienced *through* the senses, and if two things look/sound/feel the same, they *are* the same aesthetically. The Baroque reperformance and furniture/wine cases strongly support this.
      *   **HP & MC:** These capture the unique aura of the historically embedded artifact (HP) and the significance of the original material trace (MC), crucial for understanding the re-executed painting and the restored panel. Denying these risks reducing all art to abstract forms.

  *   **Potential Prejudices/Smuggled Assumptions:**
      *   **Overemphasis on CS:** While creator identity matters (as shown by the legitimized copy), elevating it *above* HP risks undervaluing the historical context or unique moment of creation (as in the re-execution case). Conversely, undervaluing CS risks missing why the legitimized copy gains value.
      *   **Ignoring FEP:** Dismissing FEP as merely "not art" is a prejudice. It forces the theory to explain *why* origin matters aesthetically for paintings/scores but not functionally identical chairs/wine. It highlights context-dependence.
      *   **Absolute PE:** Insisting PE *must always* hold, even in the face of PMA/RVS, might be a prejudice inherited from formalist or purely perceptual aesthetics. The forgery case directly contradicts this absolute view.

  **The Irreconcilable Conflict:**

  *   **PMA/RVS vs. PE:** This is the fundamental, unresolvable tension.
      *   **PMA/RVS:** Demand that the aesthetic value of the *original* Rembrandt differs intrinsically from the *perfect forgery* solely due to its origin, even when perception is identical.
      *   **PE:** Demands that if the original Rembrandt and the perfect forgery are perceptually indistinguishable, their aesthetic value *must* be identical, as aesthetic value is grounded in perception.
  *   **The Honest Conclusion:** **No single coherent theory can simultaneously honor the intuition that aesthetic value is fully available to perception (PE) and the intuition that provenance bears directly and aesthetically on that value (PMA/RVS).** The forgery case exposes this fracture. Theories inevitably prioritize one over the other or resort to concepts like "expressive properties" dependent on origin, which PE rejects as non-perceptual.

  **The Key Requirement Doing the Most Work:**

  *   **Provenance Mattering Aesthetically (PMA)** is the linchpin.
      *   **Why:** It is the *non-negotiable demand* arising from the forgery case – the core problem driving the entire inquiry. Any theory that cannot explain why the exposed forgery loses *aesthetic* (not just monetary or moral) value fails immediately. PMA forces the confrontation with PE. It necessitates concepts like historical embeddedness, authenticity-as-origin, or expressive causality that PE inherently challenges. While HP, MC, and CS contribute nuances to *how* provenance matters aesthetically, PMA is the fundamental requirement that eliminates candidates (like pure perceptual formalism or aesthetic hedonism applied universally) that cannot accommodate the dramatic value shift upon discovering origin.

  **Recommendation for the Committee:**

  Acknowledge the core conflict (PMA/RVS vs. PE) explicitly. Develop a *pluralistic* framework recognizing that different categories (paintings vs. music vs. furniture vs. wine) and different values within categories (historical aura vs. immediate experience vs. material trace vs. functional equivalence) may prioritize different desiderata. Use the list not to find one universal rule, but as a diagnostic tool to identify *which* values are paramount for *this specific* disputed object based on its nature and your institutional mission. The value lies in the structured analysis, not in a forced, impossible synthesis. PMA should be the starting point for objects where historical origin and authenticity are core to the institution's purpose (e.g., paintings, manuscripts), while FEP might dominate for functional reproductions like chairs.
