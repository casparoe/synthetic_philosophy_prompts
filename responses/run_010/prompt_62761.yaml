    "conceded": null,
    "load_bearing": "Complex dynamic outcomes (like depletion) are explained by modelling the interactions and consequences of multiple crane operations within their environment, not by altering the crane status of the constituent processes.",
    "best_follow_up": "When cultural evolution depletes the commons, doesn't the *loss of shared meaning or trust* necessary for future crane operation imply that the initial explanation secretly relied on an unsustainable skyhook of 'given' social cohesion?"
  }
  ```
