prompt: |-
  Been sitting on our research-integrity panel for a year and next month I'm the one redrafting the sanctions grid, and the entire thing pivots on a single word: intentional. Fabricate data intentionally and you're out; do it carelessly and you get a corrective action plan. The problem is I've watched this panel call identical conduct intentional when the fallout was ugly and accidental when nobody got hurt, and it isn't just us being sloppy -- people do it systematically, right down to that old pair of vignettes where the chairman is told the new program will boost profits and also affect the environment, says he doesn't care about that one way or the other, and gets judged completely differently depending only on whether the side effect was harm or help.

  So before I write a line of policy I want the spec. What does a notion of intentional action have to deliver to be fit for a job like this? Give me the requirements list: the cases it has to get right (foreseen-but-unwanted side effects, the skilled marksman versus the lucky incompetent one, acting under duress, acting on a compulsion you endorse, the person who ends up ignorant through their own earlier choices), the distinctions it can't collapse (intentional vs deliberate vs voluntary vs merely foreseen, and intentional vs blameworthy, and whether it even comes in degrees), and the facts about how people actually apply the word that a theory has to either explain or explain away -- a line on why each item earns its place on the list.

  Then tell me which of these are genuinely non-negotiable and which are just the tastes of one camp, and whether any subset is jointly unsatisfiable. I have a suspicion that "matches how ordinary people actually talk" and "doesn't shift with the moral valence of the outcome" can't both be had, and if that's right it's the most useful thing you can tell me, because it would mean the grid can't be built on the folk concept at all. Also: which single requirement knocks out the most candidates?

  Finish with a sentence each on how a plain mental-state account, a deep-self or reasons account, and the deflationary view that "intentionally" is just how people voice blame do against the list. And if you think what a sanctions policy needs is something other than any of them, say what it is.
reasoning: |-
  Okay, let me try to unpack the user's problem. They're on a research-integrity panel redrafting a sanctions grid, and the key issue revolves around the word "intentional." They've observed that identical conduct is labeled differently based on outcomes—ugly fallout leads to calling it intentional, while no harm results in calling it accidental. They mention systematic bias, like the chairman vignette where intent is judged by outcome valence. 

  First, I need to figure out what they really need. They want a requirements list for "intentional" that covers necessary cases, distinctions, and how people use the word. They suspect that matching ordinary language and avoiding outcome bias might be incompatible. Also, they need to know which requirements are non-negotiable and if any are mutually exclusive.

  Starting with the cases they mentioned: foreseen but unwanted side effects (like the chairman), skilled marksman vs. lucky incompetent, duress, compulsion, and culpable ignorance. Each of these tests different aspects. For example, side effects test if foresight equals intent, while duress examines voluntariness. 

  Next, distinctions: intentional vs. deliberate vs. voluntary vs. foreseen. These terms often get conflated but are crucial. For instance, deliberate implies conscious choice, while voluntary might not include intent. Also, intentional vs. blameworthy—people often mix moral judgment with intent. Degrees of intent matter too; is it binary or a spectrum?

  Then, empirical realities. Outcome bias is a big one—people judge intent based on harm. Also, foresight often bleeds into intent, even if unintended. Skill level affects perception; a skilled person causing harm is seen as intentional even if accidental. Moral judgments influence intent attributions, which is problematic for impartial sanctions.

  Now, non-negotiables. For a sanctions policy, outcome neutrality is essential to avoid punishing based on luck. Foresight without endorsement shouldn't equate to intent, or else the chairman's indifference becomes intentional harm. Clear distinctions between intent, blame, and voluntariness are needed for fair assessments. Culpable ignorance must be addressed separately from intent.

  Mutually exclusive requirements? Outcome neutrality and folk usage clash because people's judgments are outcome-biased. Also, if intent requires endorsement, but folk psychology often includes foreseen side effects, there's tension. The user's suspicion seems correct—using folk concepts might be unworkable.

  Evaluating theories: Mental-state accounts (like Bratman) focus on plans but struggle with side effects. Deep-self accounts (like Frankfurt) tie intent to identity, which might be too narrow for sanctions. Deflationary views equate intent with blame, which introduces bias. None perfectly fit, so perhaps a hybrid approach is needed. Maybe define intent as conscious choice to perform the act, with foresight and motives as aggravators. Use "intentional" narrowly for core actions, and handle side effects via recklessness or negligence scales.

  The user's deeper need is a fair, consistent policy that avoids outcome bias. They need a framework that separates intent from blame, uses clear criteria, and mitigates folk psychology biases through structured factors.
answer: |-
  Here's the requirements list for a concept of "intentional" fit for a sanctions grid, followed by analysis and theory evaluation:

  **Core Requirements for "Intentional" in Sanctions Policy:**

  1.  **Outcome Neutrality:** MUST NOT shift definition based on moral valence (harm/benefit) or actual consequences. *(Non-negotiable for fairness)*
  2.  **Foresight/Endorsement Distinction:** MUST distinguish acting *because* of an outcome (endorsement/aim) from merely *foreseeing* it as likely/unavoidable but not endorsing it (e.g., the indifferent Chairman). *(Non-negotiable to avoid punishing side-effects)*
  3.  **Skill/Accident Distinction:** MUST distinguish deliberate aiming/action using skill (Skilled Marksman) from achieving the same outcome via uncontrolled luck (Lucky Incompetent). *(Non-negotiable for culpability)*
  4.  **Voluntariness Requirement:** MUST account for genuine lack of control/choice (severe duress, certain compulsions *not* endorsed). *(Non-negotiable to avoid punishing the helpless)*
  5.  **Culpable Ignorance Handling:** MUST assign responsibility for recklessly/negligently *becoming* ignorant, but NOT treat the *act itself* as intentional if awareness is genuinely absent at the time. *(Non-negotiable for proportionality)*
  6.  **Attribution Stability:** MUST provide consistent judgments for identical conduct regardless of external factors (who was harmed, who discovered it, PR fallout). *(Non-negotiable for integrity)*
  7.  **Distinct from Blame/Recklessness:** MUST NOT collapse "intentional" into "very blameworthy" or "highly reckless". Intent requires a *directedness* of will. *(Non-negotiable for precision)*
  8.  **Degrees of Intent?:** MUST clarify whether "intentional" is binary or admits degrees (e.g., "strongly intended" vs. "merely acquiesced"). Policy needs clarity. *(Negotiable: Policy can define it as binary for simplicity if distinctions are handled via other factors)*

  **Empirical Realities to Explain/Handle:**

  9.  **Outcome Bias:** People *systematically* conflate bad outcomes with intent (Knobe Effect). Theory must *explain why this happens but reject it as a valid basis for policy*. *(Must be explained & rejected)*
  10. **Foresight Bleed:** High foresight often bleeds into perceived intent even without endorsement. Theory must *distinguish them clearly*.
  11. **Skill Bias:** Skilled actors causing harm are more likely to be judged intentional even for accidents. Theory must *isolate the mental state*.
  12. **Moral Judgment Contamination:** Assessments of intent are often contaminated by prior moral judgments about the actor or act. Theory must *isolate the specific act/outcome mental state*.

  **Analysis of Tensions & Non-Negotiables:**

  *   **The Core Conflict:** Requirement #1 (Outcome Neutrality) and Requirement #9 (Outcome Bias in Folk Usage) **are fundamentally incompatible.** Folk psychology *cannot* deliver a concept of "intentional" divorced from moral valence. **This is the most useful takeaway: Building the grid purely on the folk concept is impossible. You need a stipulative, policy-driven definition.** "Matching ordinary talk" (#9) must be sacrificed for fairness (#1, #6).
  *   **Most Candidate-Knocking Requirement:** #1 (Outcome Neutrality) immediately disqualifies any theory that incorporates outcome valence or cannot explain away the Knobe Effect as a *bias*. This knocks out deflationary views and naive mental-state accounts that don't explicitly guard against this contamination.
  *   **Non-Negotiables:** #1 (Neutrality), #2 (Foresight/Endorsement), #3 (Skill/Accident), #4 (Voluntariness), #6 (Stability), #7 (Distinct from Blame). Culpable Ignorance (#5) is non-negotiable but handled via recklessness/negligence, not intent.
  *   **Negotiables:** #8 (Degrees - policy can define), perfectly matching folk usage (#9 - must be rejected as a goal), explaining all biases without residue (can acknowledge biases exist and design policy to mitigate them).
  *   **Joint Satisfiability:** A core set is achievable: #1, #2, #3, #4, #6, #7. This requires explicitly jettisoning folk usage (#9) as the standard and handling #5 via a separate culpability axis.

  **Theory Evaluation (One Sentence Each):**

  1.  **Plain Mental-State (e.g., Bratman):** Focuses on plans/goal-directedness; good on #3 & #7, struggles significantly with #2 (foreseen side-effects often get lumped in) and is highly vulnerable to #1/#9 contamination without careful stipulation.
  2.  **Deep-Self/Reasons (e.g., Frankfurt, Scanlon):** Ties intent to agent's values/reasons; strong on #4 (if compulsion not endorsed) and #7, but vulnerable to #1/#9 (judging values is inherently moralized) and struggles with clear boundaries for #2 & #5.
  3.  **Deflationary/Blame Expression:** "Intentional" just signals blameworthiness; utterly fails #1, #2, #3, #6, #7 – it *is* the outcome/consequence bias you're trying to avoid, making it useless for a fair sanctions grid.

  **What the Sanctions Policy Likely Needs:**

  A **stipulative hybrid approach**, primarily **Mental-State Plus**: Define "intentional" narrowly as **acting *because* one aims to bring about the specific outcome (data fabrication, specific harmful side-effect) or knows it is virtually certain from one's action.** Crucially, *exclude* merely foreseen outcomes (#2), *exclude* outcomes achieved accidentally despite skill (#3), *exclude* acts under severe non-endorsed duress (#4), and handle culpable ignorance (#5) via a separate "Recklessness/Negligence" scale. **Explicitly decouple this definition from moral valence and blameworthiness assessments** (#1, #7), which belong on separate axes (e.g., Severity of Harm, Culpability Level). Acknowledge folk biases (#9-#12) and design the process (training, checklists, multiple reviewers) to actively mitigate them.

  **Final Recommendation:** Ditch the folk concept's outcome dependence. Define "intentional" narrowly and objectively (aim/virtual certainty), use "reckless" for high-foresight/unendorsed risks, "negligent" for avoidable ignorance, and build separate scales for harm severity and overall culpability (incorporating intent, recklessness, motives, and mitigating factors like duress). This separates the *nature of the violation* (intent, recklessness, negligence) from its *consequences* and the *actor's overall blameworthiness*.
