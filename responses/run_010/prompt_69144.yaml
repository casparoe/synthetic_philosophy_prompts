prompt: |-
  I co-run a little prediction market for about a dozen coworkers (points, convertible to a bar tab at the end of the quarter) and there's a pattern I keep seeing that I don't have a word for.

  Two people land on different numbers for the same question — say 30% vs 70% on whether some product ships this year. Neither budges from talking it through, because each knows the other is smart and has done the reading, so each figures the other must know something. So they bet. And then they keep betting, and what ends the disagreement isn't that one of them gets convinced. It's that one of them runs out of points to keep taking the other side. Whoever's got the deeper bankroll basically sets where the price lands, and then everybody else looks at that price and goes "market's at 65, so probably around 65." Meanwhile the person who got worn down will happily tell you afterwards they still think it's 30%.

  So the group gets to unanimity without anyone changing their mind, and then treats the unanimity as if it were information.

  Is there an established concept for this? I know the no-trade theorem says rational people with common priors shouldn't be trading speculatively at all, and I know Aumann's thing about people who know each other to be rational not being able to agree to disagree — but neither seems to describe what's happening here, since here there's tons of trade and the trade is what manufactures the agreement. Closes concepts I can think of are "limits of arbitrage" and noise-trader risk, but those look like they're about why a wrong price hangs around, not about agreement being produced by who can afford to keep holding on.

  Is there a name for agreement-by-attrition as opposed to agreement-by-updating? If not, coin one and define it properly — I care about the edges more than the label. What wouldn't count: a bookie posting odds nobody bets against? one whale dominating? two people who just get bored of arguing and settle? And how is it different from plain herding, where people copy each other instead of grinding each other down? No need for a reading list, just the concepts.
reasoning: |-
  Okay, the user is describing a scenario in their prediction market where two participants with differing views (say 30% vs 70%) keep betting until one runs out of points. The one with more points effectively sets the market price, leading others to accept it as consensus, even though the loser hasn't changed their mind. The user wants to know if there's a term for this "agreement-by-attrition."

  First, I recall concepts like the no-trade theorem and Aumann's agreement theorem, but those assume rational actors with common priors wouldn't trade or would update beliefs. Here, trading happens, and beliefs don't change. The key elements are: differing priors, wealth disparity, and the market price being set by the wealthier participant.

  I think about existing terms. "Wealth effect in prediction markets" fits because it's about how deeper pockets influence prices. Then there's "opinion pooling under liquidity constraints," which combines the forced consensus due to lack of funds. Also, "pseudo-consensus" captures the appearance of agreement without real belief updates.

  The user mentioned noise-trader risk and limits of arbitrage, but those are about sustaining wrong prices, not creating false consensus. The difference here is the attrition aspect—bankroll depletion forces the price to reflect the richer participant's view. Herding is different because it involves copying, not financial exhaustion.

  The user might need this concept to explain market inefficiencies in their setup or to design mechanisms preventing such attrition. They might also want to educate coworkers on why the market price might not reflect true beliefs, promoting better calibration or wealth caps.

  I should emphasize the key distinction: attrition-based pseudo-consensus vs. belief-updating consensus. Terms like wealth effect and liquidity constraints address the mechanics, while pseudo-consensus highlights the misleading unanimity. The user's deeper need is likely to validate their observation academically and find ways to mitigate this bias in their prediction market.
answer: |-
  This is a fascinating and under-discussed phenomenon! It doesn't have a single, universally accepted name, but it sits at the intersection of several well-established concepts in prediction markets, finance, and group decision-making. Here's a breakdown:

  **Core Concept: Attrition-Based Pseudo-Consensus via Wealth-Constrained Trading**

  This describes the core dynamic: agreement is reached not through belief updating, but because the party with the weaker bankroll is financially exhausted (*attrition*), leading to a market price that *appears* consensual (*pseudo-consensus*) but doesn't reflect the true underlying beliefs of all participants. This is driven by *wealth constraints* limiting the ability to express divergent opinions.

  **Key Component Concepts & Why They Apply:**

  1.  **The Wealth Effect in Prediction Markets:** This is the most direct label for the *mechanism*. It's well-known that participants with larger bankrolls exert disproportionate influence on market prices because they can absorb losses, sustain positions longer, and move prices further against opponents with limited capital. Your whale isn't just betting; they are *moving the market price* through their sustained buying/selling pressure against a capital-constrained counterparty.
  2.  **Opinion Pooling Under Liquidity Constraints:** The "agreement" isn't a Bayesian update; it's a forced aggregation. The market price becomes a weighted average of opinions, where the weight is heavily influenced by the *liquidity* (points) each participant can deploy, not just their conviction or information. The person with 30% conviction but only 10 points gets drowned out by the person with 70% conviction and 100 points.
  3.  **Pseudo-Consensus / False Consensus:** The market reaching a stable price (e.g., 65%) creates the *illusion* that the group agrees it's 65% likely. Observers see the price and infer belief convergence ("market's at 65, so probably around 65"), even though the core disagreement (30% vs. 70%) persists. This is the *false signal* generated by the attrition.
  4.  **Limits to Arbitrage (Specific Manifestation):** While often about sustaining mispricing, your scenario shows a *cause* of that mispricing: the arbitrageur (the person believing 30%) is *forced out of the market* due to wealth constraints before they can profit from the "true" mispricing (if it exists). They can't correct the price because they're bankrupt.

  **How it Differs from Related Concepts:**

  *   **No-Trade Theorem (NTT) & Aumann's Agreement Theorem:** These assume common priors and rational updating. Your scenario explicitly involves different priors/information interpretations and *no updating* despite interaction. It highlights a *failure mode* when NTT/Aumann assumptions break down.
  *   **Noise Trader Risk:** This is about the *risk* rational traders face when betting against irrational ("noise") traders who might push prices further away from fundamentals unpredictably. In your case:
      *   Neither trader is necessarily irrational ("each knows the other is smart").
      *   The risk isn't unpredictability; it's the *certainty* of being bankrupted by someone richer holding a different, potentially rational, view.
      *   The *outcome* is similar (mispricing persists), but the *cause* is wealth disparity under divergent rational views, not irrationality.
  *   **Herding:** Herding involves individuals *copying* the actions or beliefs of others due to social pressure or inferred information. In your scenario:
      *   Observers see the *price* (65%), not necessarily the *actions* of the whale.
      *   They interpret the price as informative consensus.
      *   The key driver forcing the price to 65% isn't copying; it's the *attrition* of the opposing view due to wealth limits. Herding might *follow* the established price, but the price itself was set by a battle of bankrolls, not belief copying.
  *   **Bookie Odds / Whale Dominance / Boredom Settlement:**
      *   **Bookie Odds:** If no one bets against the bookie, it's silence/lack of opposing view, not the *active wearing down* of an opponent until they are financially incapable.
      *   **One Whale Dominating:** This is a *subset* of the Wealth Effect. Your scenario specifically involves the *dyadic conflict* and the *attrition process* leading to pseudo-consensus.
      *   **Boredom Settlement:** This involves disengagement due to lack of interest or perceived futility. Your scenario involves active engagement until *financial incapacity* forces exit. The loser remains convinced (still thinks 30%).

  **Defining the Edges - What Wouldn't Count:**

  *   **Agreement by Attrition (vs. Belief Update) Requires:**
      1.  **Sincere, Persistent Divergent Beliefs:** Both parties genuinely hold different views (e.g., 30% vs 70%) and maintain them *throughout* the conflict.
      2.  **Financial Conflict:** The disagreement is expressed through repeated trading/betting that imposes financial costs.
      3.  **Wealth Disparity:** One party has significantly more resources to sustain the conflict.
      4.  **Exit Due to Exhaustion:** The conflict ends *only* because the less wealthy party runs out of resources to continue betting/trading, *not* because they updated their beliefs.
      5.  **False Consensus Signal:** The resulting market price or outcome is interpreted by observers as reflecting group agreement or the "correct" probability, masking the unresolved underlying disagreement.
  *   **Would NOT Count:**
      *   **Belief Updating:** If either party changes their mind based on the interaction or new info.
      *   **Lack of Opposition:** If no one ever bets against the initial price/position.
      *   **Single Dominant Actor:** A whale setting a price unchallenged *without* a specific opponent being financially exhausted through conflict.
      *   **Strategic Capitulation:** Giving up for reasons other than *inability* to continue (e.g., boredom, saving points for other bets, realizing a mistake *before* exhaustion).
      *   **Manipulation:** Deliberately moving the price for reasons other than expressing a sincere belief.

  **In Essence:**

  You've observed **Wealth-Constrained Attrition leading to a Liquidity-Driven Pseudo-Consensus Price** in your prediction market. The market price becomes a signal of *who could afford to keep betting*, not *what everyone truly believes*. It's a specific mechanism where the *wealth effect* and *limits to arbitrage* combine to create a *false consensus* signal through the *financial exhaustion* of a minority view holder. While not having one perfect label, "Attrition-Based Pseudo-Consensus" or "Wealth-Constrained Consensus via Trading Attrition" captures the core dynamic you describe. It highlights a vulnerability in small prediction markets with significant wealth disparities and participants who rationally understand their opponents might have valid information.
