  I need to evaluate each claim based on economic theory and philosophy. Revealed preference theory, developed by Samuelson, was indeed meant to provide a behaviorist foundation for choice theory without relying on unobservable utility. But it wasn't just descriptive - it imposed consistency axioms (like transitivity) that could be falsified. Preference-reversal experiments by psychologists like Lichtenstein and Slovic in the 1970s did show violations of these axioms, challenging the theory's empirical validity. So the "emptiness" charge isn't entirely accurate.

