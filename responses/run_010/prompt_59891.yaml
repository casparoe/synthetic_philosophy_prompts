  A friend who does policy work sent me a paragraph from some pop-econ book he's reading, and I want a sanity check before I repeat any of it at a dinner party. Roughly: 'Samuelson's revealed preference theory did away with utility as an inner state. To say you prefer A to B is just to say you pick A when you can afford both -- there's no separate fact about your happiness or satisfaction doing any explanatory work. Which also makes the whole thing empty: every choice reveals a preference for whatever was chosen, so no possible behavior could contradict the theory. The same trick shows up in psychological egoism, where "you did it, therefore you wanted to" turns selfishness into a definition rather than a discovery. And once that stopped being fashionable, economists quietly went back to treating utility as a mental state after all.'

  I've seen the rationalist blogs make the egoism point a bunch of times, so that sentence feels familiar to me, but the unfalsifiability bit sits wrong -- aren't the preference-reversal results famous precisely because they were findings rather than tautologies? And I dont buy that the field reversed course.

