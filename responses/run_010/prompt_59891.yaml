answer: |-
  ### Bottom Line
  The paragraph oversimplifies and misrepresents revealed preference theory. While the unfalsifiability critique is common, your hunch is correct: preference-reversal experiments *do* challenge the theory empirically. Economists never fully abandoned utility-as-mental-state, and behavioral economics explicitly revived it—but not as a "quiet reversal."

  ---

  ### Sentence-by-Sentence Audit

  1.  **"Samuelson's revealed preference theory did away with utility as an inner state."**
      *   **Defensible simplification.** Samuelson aimed for behaviorist foundations, rejecting *direct* reliance on unobservable utility. Utility became inferred from choices.

  2.  **"To say you prefer A to B is just to say you pick A when you can afford both..."**
      *   **Defensible simplification.** This captures the core operational definition.

  3.  **"...there’s no separate fact about your happiness or satisfaction doing any explanatory work."**
      *   **Sign-off (mostly).** Samuelson's goal was explanation via observable choices, not introspection. Utility is descriptive, not causal.

  4.  **"Which also makes the whole thing empty: every choice reveals a preference for whatever was chosen, so no possible behavior could contradict the theory."**
      *   **Actually wrong (or misses the point).** *Crucially, revealed preference imposes consistency axioms* (like transitivity: If A>B and B>C, then A>C). Choices violating these axioms *do* contradict the theory. Preference-reversal experiments (e.g., Lichtenstein & Slovic, 1971) famously demonstrated such violations, falsifying predictions of consistent preference orderings. The theory isn't *logically* empty but relies on testable assumptions about choice consistency.

  5.  **"The same trick shows up in psychological egoism..."**
      *   **Defensible simplification.** The analogy to the unfalsifiability critique of psychological egoism ("you did it, therefore you wanted to") is common and apt *if* one ignores the consistency requirements.

  6.  **"And once that stopped being fashionable, economists quietly went back to treating utility as a mental state after all."**
      *   **Fuses claims / Oversimplifies.** Behavioral economics *explicitly* incorporated psychology and utility-as-mental-state (e.g., Kahneman & Tversky on experienced utility). This wasn't "quiet" but a major paradigm shift. However, *revealed preference remains foundational* in mainstream micro theory for modeling choices under constraints. Utility functions are widely used as *representations* of preferences (consistent with revealed preference axioms), not always as literal mental states.

  ---

  ### Your Hunches
  *   **Preference-Reversal Experiments:** **Your hunch is exactly right and directly refutes the "emptiness" charge.** These experiments showed choices violating the consistency assumptions (Weak Axiom of Revealed Preference, transitivity), proving the theory *is* empirically falsifiable. This is the strongest counter to the tautology claim.
  *   **Field Reversal Course:** **You are partially correct.** Economists didn't simply "go back." Revealed preference remains central in theoretical work. The rise of behavioral economics *added* mental-state utility for specific phenomena (like biases) but didn't replace the core revealed preference framework for modeling rational choice. It's coexistence, not reversal.
