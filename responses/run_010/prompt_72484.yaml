  I'll design a runnable activity focused on distinguishing rank-dependent risk attitudes from concave utility curves, using your constraints. The core insight is that rank-dependent models allow risk aversion through probability reweighting *even when utility is linear*, which EU theory can't explain without bending the utility curve.

  ---

  ### **Activity: "Generator Hours for the Field Station"**
  **Concept**  
  Participants play as field scientists rationing generator hours during a storm. Each "hour" provides equal value (no diminishing returns), and choices involve gambles with three outcome tiers. Tokens determine post-session influence: most tokens = chooses next book; middle = avoids chores; fewest = makes coffee for a month.

  #### **Materials**
  - 1 set of **choice cards** per participant (see below)
  - 1 **token tally sheet** per participant (with pre-filled gamble outcomes)
  - 1 six-sided die per 2 participants (for private randomization)
  - Privacy screens (cardboard folders) to hide choices
  - Whiteboard to display token conversion rules
  - Timer

  ---

  ### **Choice Cards (4 Rounds, 2 Options Each)**
  **Utility is linear and explicit**:  
  *"Remember: Each generator hour is equally valuable. 10 hours = 2× the value of 5 hours."*

  #### **Round 1: Baseline Risk Aversion (Safe vs. Risky)**  
  - **Option A:** 20 hours guaranteed  
  - **Option B:** 50% chance of 0 hours, 50% chance of 40 hours  
  *Purpose: Sets a baseline for risk aversion. EU-consistent with concave utility OR RDEU.*

  #### **Round 2: Asymmetric Rankings (Identical Probabilities, Different Ranks)**  
  - **Option A:**  
    - 10% chance: 0 hours (worst outcome)  
    - 80% chance: 20 hours (middle outcome)  
    - 10% chance: 40 hours (best outcome)  
  - **Option B:**  
    - 10% chance: 0 hours (worst outcome)  
    - 10% chance: 40 hours (best outcome)  
    - 80% chance: **18 hours** (middle outcome)  
  *Note: Outcomes differ only in the middle tier (20h vs. 18h). EU = 20 vs. 19.6 (nearly identical).*  
  *Purpose: Distinguishes RDEU from EU. RDEU assigns different weights to the middle outcome based on its rank (better in Option A).*

  #### **Round 3: Long-Shot Overweighting (Low-Probability High Reward)**  
  - **Option A:**  
    - 95% chance: 20 hours  
    - 5% chance: 0 hours  
  - **Option B:**  
    - 95% chance: 18 hours  
    - 5% chance: 60 hours  
  *EU = 19 vs. 20.1 (B objectively better).*  
  *Purpose: Tests probability weighting. Choosing A suggests extreme loss aversion; B suggests long-shot seeking.*

  #### **Round 4: Risk-Seeking in Loss Frames (Mirror of Round 1)**  
  - **Option A:** 50% chance to **lose** 20 hours, 50% chance to lose 0 hours  
  - **Option B:** Guaranteed to **lose** 10 hours  
  *Final token tally = starting 100h - losses.*  
  *Purpose: EU predicts consistent risk aversion. RDEU allows risk-seeking in losses even with linear utility.*

  ---

  ### **How to Run (90 Minutes Total)**
  1. **Intro (10 min)**  
     - Explain the field station scenario.  
     - Emphasize: "Each extra hour is equally valuable."  
     - Show token rewards: Most = pick book; Middle = no chores; Fewest = coffee duty.  

  2. **Choices (30 min)**  
     - Distribute materials. Participants choose privately behind screens.  
     - For each round:  
       - Read choice card aloud.  
       - Participants circle preference.  
       - Roll die to resolve gambles (e.g., 1-3 = outcome 1, 4-5 = outcome 2, 6 = outcome 3).  
       - Record tokens on tally sheets.  

  3. **Tabulate Results (15 min)**  
     - Collect tally sheets. Project anonymous results:  
       - % choosing safe option (Round 1)  
       - % choosing Option A (Round 2)  
       - % choosing long-shot (Round 3)  
       - % taking risk in losses (Round 4)  

  4. **Debrief (35 min)**  
     - **Reveal patterns:**  
       - *If 60%+ chose safe in Round 1 but risky in Round 4:* "Why did your risk attitude flip? EU says this is irrational—but maybe losses feel different?"  
       - *If >50% chose Option A in Round 2:* "Option A had a higher middle outcome, but Option B had identical probabilities. Why prefer A? EU can’t explain this without bending utility."  
       - *Round 3 choices:* "Did anyone take the long shot? Why? This is probability weighting, not rank-dependence."  
     - **Theory reveal:**  
       - "This is *risk-weighted expected utility* (Buchak). Risk attitude isn’t about utility curvature—it’s about reweighting probabilities based on an outcome’s rank (best/middle/worst)."  
       - Show math:  
         - *EU:* Linear utility forces risk-neutrality.  
         - *RDEU:* Linear utility + convex weighting → risk aversion.  
     - **Discuss:** "Is this rational? Or just a different defensible attitude toward uncertainty?"  

  ---

  ### **Expected Challenges & Fixes**  
  - **"Ex-engineers dominate":**  
    - Ban EV calculations. Stress: "Go with your gut. We’re studying preferences, not math."  
    - If they persist: "Imagine this is a real storm—you’re tired, stressed. What feels right?"  
  - **Trading tokens:**  
    - "Tokens are non-transferable. Your choices only affect *your* station."  
  - **Predictable confusion:**  
    - Round 2’s near-identical EVs may frustrate. Clarify: "Option A’s middle outcome is ranked ‘better’ because it’s surrounded by worse outcomes."  
    - Some may reject linear utility. Reiterate: "No diminishing returns—each hour powers one critical experiment."  

  ---

  ### **Limitations to Explain Verbally**  
  The activity **can’t replicate dynamic consistency issues**. In RDEU, choices may reverse when gambles are split into steps (e.g., taking risks sequentially vs. simultaneously). Say:  

  > *"Unlike EU, RDEU agents can be ‘pushed around’ over time. If you resolve uncertainty in stages, they might choose a safe option today but reverse course tomorrow—even with no new information. This is rational under RDEU but looks inconsistent under EU."*  

  Use a simple example:  
  - *Today:* Choose between (A) 50% chance of 100h or (B) 40h guaranteed.  
  - *Tomorrow (if gamble chosen):* Choose between (C) 100h or (D) 40h.  
  An RDEU agent might pick B today but C tomorrow—seemingly inconsistent.  

  ---

  ### **Token Tally Sheet Example**  
  | Round | Your Choice | Die Roll | Outcome | Tokens Earned |  
  |-------|-------------|----------|---------|---------------|  
  | 1     | ☐ A ☐ B     |          |         |               |  
  | 2     | ☐ A ☐ B     |          |         |               |  
  | ...   |             |          |         |               |  

  **Outcomes Pre-Filled:**  
  - Round 1: A = 20h; B = 0h (1-3), 40h (4-6)  
  - Round 2: A = 0h (1), 20h (2-5), 40h (6); B = 0h (1), 40h (2), 18h (3-6)  

  ---

  This design forces rank-dependence to surface in Round 2 while controlling for concave utility and probability weighting. The debrief ties choices directly to the theory’s core insight—letting retirees "feel" the distinction through their own inconsistencies.
