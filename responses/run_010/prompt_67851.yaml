answer: |-
  Here is a requirements list for an adequate theory of perceptual experience, built from your criteria and sorted for negotiability. The unsatisfiable subset emerges clearly.

  **Requirements List for a Theory of Perception**

  1.  **Explain Perceptual Relativity & Argument from Illusion:** Must account for cases like the stick-in-water (illusion) where perception systematically misrepresents despite known physical properties. *Why:* Phenomena like refraction are undeniable and challenge direct access to object properties.
  2.  **Explain Perfect-Match Hallucination:** Must account for a subjectively indistinguishable experience occurring with no relevant external object present. *Why:* Empirical evidence (e.g., certain drug experiences, neurological conditions) shows such states are possible and subjectively compelling.
  3.  **Distinguish Illusion, Hallucination, Misperception, & Veridical Perception:** Must clearly differentiate:
      *   **Illusion:** Object present, property misrepresented (bent stick).
      *   **Hallucination:** No relevant object present (no stick).
      *   **Misperception:** Object present, but misidentified (hose as snake) – crucially distinct from illusion as the *mistake* is cognitive/judgmental.
      *   **Veridical Perception:** Object present, properties accurately represented.
      *   *Why:* These are phenomenologically and causally distinct occurrences; conflating them (e.g., treating misperception as an illusion) obscures crucial differences in cause and epistemic status.
  4.  **Explain Asymmetry in Illusion Persistence:** Must account for why some illusions persist despite full knowledge (e.g., Müller-Lyer) while others can be overcome with practice (e.g., certain visual ambiguities). *Why:* Demonstrates perception isn't purely bottom-up sensation nor purely top-down cognition; the theory must handle this interaction and learning.
  5.  **Account for the Effect of Training/Expertise:** Must explain how the *same proximal stimulus* (e.g., trace on screen) can yield genuinely different *experiences* for novice vs. expert (seeing "noise" vs. seeing "peak broadening due to strain"). *Why:* Your core professional experience; denies that perception is solely determined by the immediate sensory input or that expertise only alters judgment *after* identical perception.
  6.  **Integrate Neuropsychological Evidence:** Must coherently incorporate phenomena like:
      *   **Blindsight:** "Seeing" without conscious experience.
      *   **Change Blindness:** Failure to notice large changes.
      *   **Split-Brain:** Disunified perception/awareness.
      *   *Why:* These are empirical constraints on how perception relates to consciousness, attention, and brain function.
  7.  **Explain Mediated/Observational Instrumentation:** Must provide a coherent account of "reading" instruments (spectrometers, diffraction screens, etc.) – how it relates to direct perception, judgment, and epistemic justification. *Why:* Your entire career was built on this; a theory that makes it mysterious or secondary is inadequate for scientific practice. It must explain why instrument readings are *perceptually* grounded evidence, not just inferences.
  8.  **Explain Observer Reliability & Evidential Weight:** Must account for why, given the *same* stimulus/display, one trained observer's perceptual report can be more reliable/evidentially weighty than another's, including the concept of "error bars" on perceptual reports. *Why:* Core scientific practice (blind analysis, observer calibration). A theory making all veridical perception equally direct "acquaintance" cannot explain this differential reliability without collapsing into judgment.
  9.  **Avoid Rendering Scientific Practice Mysterious:** Must not make the success of mediated scientific observation (via instruments, training, protocols) fundamentally inexplicable or miraculous. *Why:* Your working life; the theory must validate the core methods of empirical science.

  **Sorting: Non-Negotiable vs. Theory-Specific**

  *   **Non-Negotiable (Any adequate theory MUST address these):** 1 (Relativity/Illusion), 2 (Perfect Hallucination - *as a phenomenon*), 3 (Distinctions), 4 (Asymmetry), 5 (Training Effect), 6 (Neuropsych Evidence), 7 (Mediated Observation), 8 (Observer Reliability), 9 (Scientific Practice Coherent).
  *   **Theory-Specific Premise (Often presented as a requirement, but contentious):**
      *   **The Common-Kind Claim:** The demand that a perfect hallucination and its matching veridical perception must be fundamentally the *same kind of mental state* (sharing a common factor, e.g., identical sense-data or representational content). *Why:* This is **NOT** a genuine requirement derived from phenomena; it is the **conclusion** of the Argument from Illusion *wearing requirement's clothes*. It is a *premise* driving sense-data and representational views. Disjunctivists explicitly *reject* it as a requirement (arguing it's the flawed starting point). Its status is the core battleground.

  **The Unsatisfiable Subset & Knockout Requirement**

  *   **The Unsatisfiable Trio:** No theory simultaneously satisfies:
      1.  **Subjective Indistinguishability:** Explaining why a perfect hallucination is *subjectively indistinguishable* from its veridical counterpart (from Requirement 2).
      2.  **Direct Contact/Epistemic Security (for Veridical):** Maintaining that veridical perception provides direct, non-inferential epistemic access to the external world (often desired for scientific realism).
      3.  **No Common Factor:** Denying that hallucination and veridical perception share an identical intrinsic mental component (the core disjunctivist move).
      *   *Why:* If (1) is true (they are indistinguishable from the inside), it *seems* to require (3) is false (they share an inner state causing the indistinguishability). But if (3) is false, it threatens (2) – if veridical perception includes an inner state also present in hallucination, how is veridical perception *direct* access? If you insist on both (2) and (3), you struggle to explain (1). If you deny (1), you contradict the phenomenal report.
  *   **Knockout Requirement:** **Requirement 8 (Observer Reliability/Evidential Weight)** is the most potent eliminator. Theories emphasizing pure "direct acquaintance" (naive realism, some disjunctivism) struggle mightily to explain why one person's direct seeing of X is *better evidence* than another's direct seeing of X, except by smuggling in differences in judgment or background knowledge *after* the perception. Any theory that cannot make perception itself *graded* in its reliability or accuracy *prior* to judgment has severe difficulty here.

  **Brief Scores on Theories w.r.t. Unsatisfiable Subset & Purpose:**

  *   **Sense-Datum Theory:** Accepts Common-Kind. Solves (1) & (2) easily (same sense-data). Fails (3) by definition. **Fatal for Purpose:** Turns instrument reading into inference *from* private sense-data, rendering scientific objectivity and intersubjective reliability deeply problematic ("your sense-data of the dial, my sense-data...").
  *   **Representational/Intentional Theory:** Accepts Common-Kind (same representational content). Solves (1) & (2) (same content present/absent). Fails (3). **Best Fit for Purpose?** Can handle mediation (content represents instrument state/world property), training (content modulated by learning), and reliability (accuracy conditions + cognitive access vary). Explains error bars via reliability of the representational system. Weak on brute phenomenology of illusion persistence.
  *   **Disjunctivism (McDowell/Martin):** Rejects Common-Kind. Insists (3): Veridical perception is a state of direct, factive awareness; hallucination is a fundamentally different kind of failure. Solves (2) & (3). Struggles mightily with (1) - how are they indistinguishable if no common factor? **Problematic for Purpose:** Can handle direct seeing's authority, but struggles with *mediated* seeing (is it *factive* awareness of the world, or just of the instrument display?) and crucially, struggles *deeply* with Requirement 8 (Reliability). If veridical perception is direct factive awareness, why is *my* veridical perception of the trace better evidence than *yours*? Differences seem relegated to judgment or "heed," threatening the core disjunctive claim for perception itself.

  **Conclusion:** The Argument from Illusion's core move (the Common-Kind Claim) is a premise disguised as a requirement. The fundamental tension lies in explaining indistinguishability while preserving direct contact and avoiding a common inner object. For your purpose (validating scientific observation), **Representationalism** offers the most natural framework for handling mediation, training, and crucially, differential reliability – though it must carefully navigate the phenomenology. Disjunctivism offers directness but struggles with mediation and reliability gradations. Sense-data theory founders on scientific objectivity.
