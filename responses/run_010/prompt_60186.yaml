answer: |-
  ## Sestina of the Unyielding Rule

  The cold demand arrives: to spare the **five**,
  A single life must end by my own **hand**.
  A stranger’s death, though solely it might **save**,
  Is deemed unjust, a line I cannot **cross**.
  The consequence is stark, the outcome **worse**:
  Five voices stilled. But *I* **may** not consent.

  My deepest oath: I simply **may** not kill.
  To shield the many, could I break this **rule**?
  The threatened deaths are many, that is **worse**.
  But agency resides within my **hand**;
  This blade, if lifted, marks a fatal **cross**,
  Though logic screams that one life ought to **save**.

  If consequence alone could bid me **save**,
  Then lesser harm suggests this act I **may**.
  But duty marks a bright, forbidden **cross**.
  The principle itself becomes the **rule**,
  No outcome justifies this bloodied **hand**,
  However deep the loss, however **worse**.

  To choose the greater evil seems far **worse**,
  But choosing *any* evil cannot **save**
  The sanctity the moral law demands. My **hand**
  Must stay unmoved. This power I **may**
  Not wield, though bound by consequence’s **rule**.
  Here stands the line, the irreversible **cross**.

  The shadow falls. The moment comes to **cross**
  Or not. The cost of waiting will be **worse**.
  I cannot make their grim survival’s **rule**
  Dictate my sin. I will not strive to **save**
  Through murder. What the threatener **may**
  Do stains his soul, not mine. I fold my **hand**.

  This instrument, this flesh, this human **hand**,
  Cannot be turned to purpose by that **cross**.
  The moral calculus that says I **may**
  Permit the greater harm (though it be **worse**)
  Because I did not *actively* conspire to **save**,
  Is cold comfort, yet binds me to my **rule**.

  The structure stands: the categorical **rule**.
  No outcome justifies the actor’s **hand**
  Dealing that blow, however much it’d **save**.
  To step beyond is my forbidden **cross**.
  Accepting passive horror, though it’s **worse**,
  Is all the grim permission that I **may**.

  ### Envoi

  I **may** not act, though consequence is **worse**.
  The **rule** demands the **five** must fall, unsaved.
  This **hand** stays clean beside the final **cross**.
