answer: |-
  ## Project Proposal: The Temporal Dynamics of Moral Omission – Does Duration Transform "Allowing" into "Doing"?

  **Project Title:** Sustained Silence as Moral Action: Temporal Duration and the Collapse of the Doing/Allowing Distinction

  **Applicant:** [Your Name], Novelist
  **Proposed Affiliation:** [Law School's Ethics Center Name]
  **Duration:** 12-Month Residency

  ### 1. Core Question & Novelistic Origin
  My novel centers on a brother who ceases all communication with his sister – no refusal, no sabotage, just silence – sustained unbroken for twenty-six years until her death. Drafting this, I encountered an insistent conceptual instability: is this protagonist perpetually *failing to act* (a prolonged allowing), or did he actively *do* something to her through this sustained omission? This isn't mere semantic drift; it feels central to the moral weight of the narrative. My project asks: **Does the moral significance of an omission (an "allowing") fundamentally shift as its duration extends, such that a sufficiently prolonged omission becomes functionally and morally equivalent to an active "doing," and if so, what temporal or structural features drive this transformation?**

  Precisely: I contend that while existing ethical frameworks readily categorize a *momentary* omission (e.g., not throwing a rope to a drowning person *now*) as distinct from a positive act (e.g., pushing them in), they lack the resources to adequately characterize a *decades-long* pattern of non-action (e.g., systematically ignoring 312 letters over 26 years). Does the sheer *accumulation of time*, the *persistence of the omission*, or the emergence of identifiable *threshold moments* within the duration (e.g., learning of her terminal illness and *still* remaining silent) reconfigure the moral event from passive "allowing harm" to active "inflicting harm"? Is the 26-year silence one continuous "thing," or hundreds of discrete failures? If the latter, how does the sum become qualitatively different? If the former, when does it begin? The instability I perceive in my writing reflects a genuine philosophical gap illuminated by narrative timescale.

  ### 2. Why Existing Frameworks Leave the Question Open
  The doing/allowing distinction (and related distinctions like killing/letting die) is heavily contested, but current dominant approaches readily absorb or sidestep the challenge of *extended duration*:

  *   **Moral Significance View (e.g., Foot, Quinn):** Asserts doing harm is intrinsically worse than allowing equivalent harm. Duration primarily affects the *amount* of harm (more years of suffering), but not the *fundamental category*. The baseline ("normal" non-communication) is fixed at the outset; sustained silence is just a very long instance of "allowing" the harm of estrangement to continue.
  *   **Moral Equivalence View (e.g., Singer, Unger):** Argues doing/allowing lacks intrinsic moral difference; only consequences matter. Duration is irrelevant except as a scalar multiplier of harm. 26 years is simply vastly more harmful than 26 days.
  *   **Causal/Counterfactual View (e.g., Bennett, McMahan):** Focuses on whether the agent's movement initiates a new causal sequence or merely leaves an existing one undisturbed. Prolonged omission seems like repeated instances of "leaving undisturbed" the state of non-communication initiated at time T0. Each ignored letter is another instance of non-intervention in the *same* causal chain.
  *   **Action/Refraining View (e.g., Moore):** Distinguishes acting (moving your body) from refraining (not moving). Writing a letter is acting; not writing is refraining. Duration is just the persistence of a single refrain – refraining to write for 26 years is still refraining, not acting.

  **The Gap:** Each framework reduces duration to either *harm magnitude* (Equivalence, Significance), *causal inertia* (Counterfactual), or *persistence of initial state* (Action/Refraining). None adequately confronts the *emergent moral quality* suggested by the instability: the intuition that at some point, the *ongoing, active maintenance of silence* – the repeated choice *not* to break it, the awareness of accumulating consequences – transforms passivity into a distinct form of agency, a kind of "negative action." They lack an account of how time itself, or the structure of persistence, might alter the moral ontology of the omission. The **Action/Refraining view comes closest to facing the question**, as its core distinction (act vs. refrain) is most directly challenged by the possibility of a "refrain" becoming so sustained it constitutes a different *kind* of thing. This will be a primary interlocutor.

  ### 3. Methodology: Why Conceptual Analysis & Why a Novelist?
  This investigation requires **conceptual analysis grounded in carefully constructed cases**. Empirical studies of moral intuition often lack the granularity and temporal scope needed. Historical or legal cases introduce confounding variables. My method involves:

  1.  **Deconstructing the Core Case:** Analyzing the brother's 26-year silence, specifying mental states (knowledge, intention, awareness of sister's changing circumstances like illness), opportunities to act, and the exact nature of the "harm" (estrangement, uncertainty, distress).
  2.  **Generating Variant Cases:** Systematically manipulating duration (3 months vs. 5 years vs. 26 years), continuity (unbroken silence vs. sporadic brief replies), awareness (ignorance of sister's plight vs. specific knowledge of crisis points), and decisiveness (was there an initial conscious "decision" to cease, or did it drift?).
  3.  **Testing Intuitions & Seeking Stability:** Subjecting these cases (written as concise, focused vignettes preserving the concrete elements – letters, birthdays, illness announcements) to rigorous scrutiny: my own, the philosopher-collaborator's, and potentially small, targeted workshops with ethicists. The goal is not statistical consensus but identifying *robust patterns* in the instability or stability of moral categorization.

  **Why a Novelist?** Novelists excel at constructing psychologically dense, temporally extended scenarios where internal states *matter* and consequences unfold over time. Philosophy's "trolley problems" often stipulate away ambiguity about knowledge, intention, and the lived experience *within* the omission to isolate variables. My cases force the specification of these elements *over time*, precisely the variables duration potentially interacts with. **Addressing the "Baroque" Concern:** The cases will be stripped to their essential temporal and intentional bones for analysis. The brother/sister scenario is the archetype, not the only case. Simpler variants (e.g., failing to renew a life-saving subscription over decades) will test the core mechanics without novelistic embellishment. The "baroque" detail serves the initial conceptual spark and ensures grounding, not muddying, the analysis.

  ### 4. Proposed 12-Month Work Plan

  *   **Months 1-2:** **Foundations & Instability Test.** Deep dive into core doing/allowing literature (Foot, Quinn, Bennett, McMahan, Moore, Singer). Draft 5-7 core case variants manipulating duration, decisiveness, and continuity. Initial collaborative sessions to map intuitive responses and assess the *degree* and *pattern* of instability. *Early Checkpoint:* Does the instability persist across readers/variants, or is it idiosyncratic? If persistent, proceed. If not, pivot (see Scope/Failure).
  *   **Months 3-4:** **Deconstructing Duration.** Analyze components of "duration": sheer length, continuity/persistence, accumulation of specific moments (unanswered letters/events), evolving context (sister's life changes). Develop arguments for/against each component driving the perceived shift.
  *   **Months 5-6:** **Confronting Key Positions.** Engage deeply with the Action/Refraining view and Moral Significance view. Can they accommodate the intuition shift? If not, where do they break down? Develop critiques centered on temporal extension. Explore concepts like "negative agency" or "sustained refusal."
  *   **Months 7-8:** **The "One Thing or Many" Problem.** Investigate the metaphysics of prolonged omission. Is it a single, extended state? A series of discrete non-acts? Does aggregation create a new entity? Implications for moral responsibility.
  *   **Months 9-10:** **Building the Novel's Framework.** Synthesize findings into a conceptual framework for understanding the brother's silence. How does the analysis inform the novel's moral architecture? Draft core sections of the culminating essay.
  *   **Month 11:** **Drafting & Refining.** Complete draft of the long essay. Prepare lecture outline.
  *   **Month 12:** **Finalize & Disseminate.** Finalize essay. Deliver public lecture at the Ethics Center presenting core thesis and findings. Submit essay for publication consideration.

  **Outputs:** A significant long essay (target 8,000-10,000 words) suitable for a philosophy/ethics journal; a public lecture; a robust conceptual framework integrated into the novel's revision.

  ### 5. Defining Success & Failure; Early Signals

  *   **Success:** Developing a defensible argument that *either*:
      *   Duration (or specific temporal features) *does* transform the moral character of an omission from "allowing" towards "doing," explaining the mechanism (e.g., emergence of "sustained refusal," collapse of baseline, aggregation effect). OR
      *   Demonstrating that the intuition shift is robust but best explained *without* altering the core doing/allowing distinction – e.g., solely through decisiveness or harm magnitude – but providing a compelling account of *why* the prolonged case *feels* different.
  *   **Failure Modes & Mitigation:**
      1.  **Wild Instability:** Intuitions across readers/cases are chaotic, showing no discernible pattern related to duration. *Early Signal (Month 2):* If initial case variants elicit radically inconsistent categorizations *unmoored* from the manipulated variables. *Pivot:* Shift focus to the *phenomenology* of perceiving prolonged omission (why *does* it feel unstable?) as it relates to narrative.
      2.  **Collapse into Decisiveness:** Analysis reveals the shift is solely attributable to identifying a specific, early "decision point" (e.g., Month 3) where the agent actively committed to the path of silence, making the subsequent 25.75 years mere consequence. *Early Signal (Month 3):* If variants manipulating the *existence* of an initial decision dramatically alter intuitions, while sheer length (holding decisiveness constant) does not. *Finding, but deflating.*
      3.  **Collapse into Harm Magnitude:** Analysis confirms the Equivalence View – only the total accumulated harm matters, duration is merely its measure. *Early Signal (Month 3):* If intuitions track *only* the described level of suffering in the sister, regardless of *how* long it took to accumulate or the structure of the omission. *Project invalidated.*
      ***My Bet:*** I suspect (3) Harm Magnitude is the most likely collapse point, but that the initial instability suggests it's *not* the whole story. **Month 2 Action:** Design cases where *harm is held constant* (e.g., sister experiences same *level* of distress whether silence lasts 1 year or 26 years due to her temperament/resilience) but duration varies. Does the intuition about the *brother's moral status* still shift? If yes, harm magnitude isn't solely driving it.

  ### 6. Scope Management

  *   **Focus:** Tightly on the doing/allowing distinction applied to *prolonged, deliberate omissions of expected positive action* (like maintaining familial communication), primarily using the brother/sister archetype and simpler analogs. **Excluded:** Broader duties of beneficence, positive rights, or cases involving direct physical harm/vulnerability (drowning child analogies). Legal implications are noted but not central.
  *   **What Gets Cut:** Deep dives into related but distinct areas like the metaphysics of time, comprehensive surveys of all omission literature, extensive empirical moral psychology studies, or full engagement with collective responsibility.
  *   **If Instability Dominates (Failure Mode 1):** The project pivots to: "The Phenomenology of Prolonged Absence: Why Sustained Omission Resists Moral Categorization and What Narrative Reveals." The focus becomes the *experience* of the instability as a subject in itself, leveraging the novelist's perspective.
  *   **If Collapse Occurs (Failure Modes 2 or 3):** The project honestly reports this as a finding, detailing the argument for why decisiveness or harm magnitude fully explains the phenomenon, and discusses the implications for understanding the *illusion* of transformation via duration.

  This project leverages my novelist's sensitivity to time, psychology, and narrative consequence to probe an underexplored facet of a core ethical distinction. It seeks not just abstract clarity, but a framework to bear the moral weight of a twenty-six-year silence. I propose to do the philosophical work necessary to earn that framework.
