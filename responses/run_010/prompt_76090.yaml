  | | C: Moderate intellectualism | Does not know how (cannot be guided by propositions) | 2 | As above; guidance requires propositions she cannot access. |
  | | D: Objectual view | Knows how (grasps the way non-propositionally) | 1 | Independent motivation needed for non-propositional grasp in aphasia. |
  | | E: Deflationism | Knows how (attribution based on performance) | 0 | Attribution practices track reliable success, not underlying states. |
  | **2. Armchair Tactician** | A: Rylean dispositionalism | Does not know how (lacks disposition to perform) | 0 | No disposition to execute moves himself; only knows-that. |
  | | B: Strong intellectualism | Knows how (has propositional knowledge under practical mode) | 2 | Counterintuitive attribution; robot control is not "his" ability. |
  | | C: Moderate intellectualism | Does not know how (cannot deploy propositions to guide own action) | 1 | Modest refinement: guidance must involve embodied execution, not just remote control. |
  | | D: Objectual view | Knows how (grasps ways via propositions) | 1 | Must clarify if objectual grasp can be purely theoretical without execution. |
  | | E: Deflationism | Knows how (attribution for coaching/robotics context) | 0 | Contextual interest in strategic knowledge supports attribution. |
  | **3. Second-Language Swimmer** | A: Rylean dispositionalism | Does not know how (no disposition for crawl) | 0 | Disposition only for childhood stroke; no ability to execute crawl. |
  | | B: Strong intellectualism | Knows how (has complete propositional knowledge) | 2 | Counterintuitive attribution; verbal mastery ≠ ability to swim crawl. |
  | | C: Moderate intellectualism | Does not know how (cannot deploy propositions in water) | 1 | Guidance requires bodily execution, which she lacks despite propositions. |
