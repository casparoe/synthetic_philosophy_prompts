  ### Short Answers
  1. **The dud case**: **Case 5 (Blocked Locksmith)**. All analyses converge on "knows how" (A: after adding conditions; B–E: easily). This shows the debate is narrower than advertised—external obstacles don’t challenge know-how’s core nature, only its manifestation.  
  2. **Cheapest escape hatch**: **Deflationism (E)** exploits **attributional context** (e.g., Case 2: know-how attributed for coaching; Case 4: for machines; Case 6: denied for individuals). It avoids commitments to mental states or abilities.  
  3. **Probability debate is substantive**: **0.2**. Cases 1–3 and 6 reveal intuitive conflicts, but deflationism’s success suggests much is terminological (e.g., "know-how" as a context-sensitive label).  
  4. **Research program commitment**: **Moderate intellectualism (C)** with **0.6 probability**. It balances propositions and guidance, handles Cases 4–5 cleanly, and damages are fixable (e.g., clarifying "guidance" as embodied for physical skills).  

  ### Reskinned Cases
  - **Case 1 (Anomic Virtuoso)**: Reskin of amnesic experts (e.g., pianist with memory loss). **New work**: Stipulated *global aphasia* targeting *only musical propositions*, isolating skill from semantic access.  
  - **Case 2 (Armchair Tactician)**: Reskin of Stanley’s armchair pilot. **New work**: *BCI-driven robot execution* without intuition, decoupling propositional knowledge from embodied skill.  
  - **Case 4 (Cookbook Machine)**: Reskin of AI chefs (e.g., AI recipes). **New work**: *First-principles derivation under novelty* + *no dispositions*, forcing non-agentic know-how.  
  - **Case 6 (Pit Crew)**: Reskin of distributed cognition (e.g., bee colonies). **New work**: *Sub-second coordination without shared intention*, challenging individualistic analyses.  

  Cases 3 and 5 are novel: no clear reskins. 

  ---  
  This scoring exposes fault lines: Intellectualisms (B–C) struggle with ability deficits (Cases 1–3), dispositionalism (A) with non-agency (Case 4) and groups (Case 6), and objectualism (D) with vague criteria. Deflationism (E) emerges unscathed by your cases, suggesting attributional practices may be doing heavy lifting in the debate.
