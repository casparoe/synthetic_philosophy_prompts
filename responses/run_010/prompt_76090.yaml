  | | B: Strong intellectualism | Knows how (has propositions under practical mode) | 0 | No execution requirement; propositions suffice for know-how. |
  | | C: Moderate intellectualism | Knows how (propositions guide output via simulation) | 0 | Deployment is via re-derivation; no need for embodiment. |
