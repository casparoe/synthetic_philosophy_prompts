  | | E: Deflationism | Knows how (attribution for reliable output) | 0 | Context: we attribute know-how to systems with functional success. |
  | **5. Blocked Locksmith** | A: Rylean dispositionalism | Does not know how (disposition blocked externally) | 2 | Must add "under normal conditions" clause to dispositions (modest but not core). |
  | | B: Strong intellectualism | Knows how (has propositions under practical mode) | 0 | Unaffected by external obstacles; knowledge intact. |
  | | C: Moderate intellectualism | Knows how (propositions guide action in sims/specimens) | 0 | Guidance occurs where possible; external failure irrelevant. |
  | | D: Objectual view | Knows how (relation to way intact) | 0 | Obstacles don't sever relation to the way itself. |
  | | E: Deflationism | Knows how (attribution based on capability, not context) | 0 | Practices distinguish ability from opportunity. |
  | **6. Pit Crew** | A: Rylean dispositionalism | Does not know how (no individual has full disposition) | 2 | Must deny group know-how or stretch "multi-track" to collective (ad hoc). |
  | | B: Strong intellectualism | Does not know how (no individual knows whole proposition) | 1 | Modest: practical mode doesn't require holistic propositional grasp. |
