  | | E: Deflationism | Does not know how (attribution targets individual competence) | 0 | Practices focus on individual scope; group success ≠ individual know-how. |

  ### Totals, Auxiliaries, and Ranking
  - **Damage totals** (lower = better, max 18):  
    - A: 0 + 0 + 0 + 3 + 2 + 2 = **7**  
