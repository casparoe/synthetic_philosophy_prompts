    1. **E (Deflationism)**: 0 damage, 0 auxiliaries → **Defendable in print**. Survives all cases by leveraging attributional flexibility.  
    2. **C (Moderate intellectualism) & D (Objectual view)**: 5 damage, 0 auxiliaries → **Workable with surgery**. C needs refinement on "guidance" (e.g., embodied execution in Cases 2–3); D needs clearer criteria for "grasping ways."  
