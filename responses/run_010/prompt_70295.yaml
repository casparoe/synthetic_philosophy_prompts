answer: |-
  ## Diagnostic and Statistical Manual of Psychiatric Classifications (DSPC) - Version 6.1 Release Notes

  **Release Date:** [Redacted]
  **Effective Immediately for all Licensed Classification Practitioners within Jurisdiction**
  **Previous Version:** DSPC v6.0.3

  This release introduces significant refinements to the DSPC taxonomy, enhancing diagnostic precision, operational utility, and alignment with contemporary expressions of distress. Key updates include a new diagnostic category, criteria refinements based on stakeholder feedback, and the retirement of an underutilized classification. Migration procedures for existing patient records are outlined below.

  **1. New Features**

  *   **1.1. Productivity Dissolution Disorder (PDD) (Code: 7B89.1)**
      *   **Description:** Characterized by a pervasive inability to derive satisfaction or maintain consistent output within achievement-oriented frameworks, despite adequate cognitive capacity and opportunity. Marked by a dissonance between expressed values (e.g., ambition, purpose) and behavioural inertia or active disengagement from sanctioned productivity pathways.
      *   **Essential Features (Require 4 or more):**
          1.  Recurrent episodes of profound apathy or active aversion towards tasks associated with professional advancement, academic achievement, or measurable socio-economic contribution, lasting ≥ 2 weeks.
          2.  Persistent subjective report of "meaninglessness" or "pointlessness" specifically tied to conventional productivity metrics, despite external recognition of capability.
          3.  Significant time spent engaging in activities perceived by the individual as intrinsically valuable but lacking measurable output or external validation (e.g., unstructured contemplation, non-monetized creative pursuits, deep but non-instrumental social connection).
          4.  Observable reduction in goal-directed behaviour within institutional or professional settings, documented via performance reviews, academic transcripts, or productivity tracking software logs.
          5.  Intense guilt, anxiety, or dysphoria stemming *directly* from the failure to conform to internalized productivity imperatives, distinct from generalized anxiety or depression.
          6.  Frequent utilization of digital platforms or physical spaces explicitly designed for non-instrumental interaction or respite from achievement pressures (e.g., specific online forums, designated "well-being" zones within workplaces, third-wave coffee shops with curated ambient soundscapes).
      *   **Duration:** Symptoms cause clinically significant distress or impairment in social, occupational, or other important areas of functioning for ≥ 1 month.
      *   **Exclusions:** Not attributable to substance use, another medical condition, Major Depressive Disorder (unless all criteria for PDD are met and dominate the clinical picture), Adjustment Disorder, or deliberate malingering.
      *   **Prevalence Estimate (Initial):** Estimated 2.4-3.8% of the adult population within digitally integrated, post-industrial service economies. Prevalence highly correlated with density of knowledge-worker employment sectors and ubiquitous productivity-tracking infrastructure.

  **2. Behavioural Changes**

  *   **2.1. Adjustment Disorder with Anxious Distress (Code: 6C43.0):** Criterion D (distress disproportionate to the stressor) now requires explicit documentation of the cultural or subcultural norms used to establish "disproportionality" (e.g., community standards surveys, organizational HR guidelines). This aids operationalization.
  *   **2.2. Social Engagement Specificity Disorder (SESD) (Code: 6D11.0):** The "preferred digital mediation" specifier now includes thresholds for video-call fatigue duration (>30 mins inducing significant distress) and mandatory in-person interaction avoidance frequency (>3 instances/week).

  **3. Deprecated Items**

  *   **3.1. Circadian Displacement Syndrome (CDS) (Code: 6A75.2 - Retired)**
      *   **Status:** Officially deprecated and removed from active classification. CDS is no longer available for new diagnoses.
      *   **Rationale:** Utilization rates have fallen below the 0.1% diagnostic incidence threshold for sustained clinical relevance over the last three reporting cycles. Clinical presentations historically captured under CDS are now adequately described by combinations of Sleep-Wake Disorders (particularly Circadian Rhythm Sleep-Wake Disorders), Dissociative Disorders, or Unspecified Trauma-Related Disorder, depending on etiology. Historical patient records coded with CDS retain their validity but will not be mapped to new codes (see Migration Notes, Section 7).

  **4. Breaking Changes**

  *   **4.1. Autonomous Identity Flux Condition (AIFC) (Code: 7A40.1) - Criterion Revision**
      *   **Change:** Criterion A5 ("Experiences distinct identity states...") has been amended to: "Experiences distinct identity states, *which may be self-designated using a variety of terminologies including but not limited to: parts, aspects, selves, headmates, system members, or other patient-endorsed nomenclature*."
      *   **Reason:** Implementation of Feature Request DSPC-FR-23118 ("Recognize Patient Self-Identification in AIFC"). Submitted via the official patient advocacy portal by the "AIFC Self-Advocacy Collective" (Registered Stakeholder Group #SG-4452). Reviewed and approved by the Identity & Dissociation Working Group (Status: Closed - Implemented in v6.1). Previous phrasing ("alternate personalities") was deemed non-inclusive and misaligned with the lived experience of the diagnosed population.

  **5. Known Issues**

  *   **5.1. DX-1024: Criterion Drift in High-Visibility Categories**
      *   **Description:** Diagnostic categories experiencing rapid uptake or significant cultural discussion exhibit measurable shifts in patient self-reported symptom profiles and behavioural presentations within 12-18 months of widespread adoption. This drift necessitates frequent criterion adjustments to maintain diagnostic capture rates, increasing administrative burden and complicating longitudinal research. Observed across multiple categories (e.g., PDD [New], AIFC, Chronic Ambivalence Syndrome).
      *   **Severity:** Medium (Operational Impact)
      *   **Workaround:** Practitioners are advised to consult the latest DSPC version and supplementary clinical advisories frequently. Utilize structured interviews with dynamic symptom checklists updated biannually by the DSPC Editorial Board. Longitudinal studies should employ version-specific diagnostic modules and account for taxonomy changes in analysis.
      *   **Resolution:** Under review by the Nosological Stability Taskforce. Long-term solution pending.

  **6. Migration Notes for Existing Patients**

  *   **6.1. General Principle:** Diagnostic validity is tied to the DSPC version active at the time of assessment. Existing diagnoses remain valid historical records *unless* explicitly voided (see 6.3).
  *   **6.2. Patients Diagnosed under v6.0.3 (or earlier):**
      *   **Circadian Displacement Syndrome (CDS):** Records retain original CDS coding (6A75.2). No automatic mapping occurs. Re-assessment under v6.1 is required if ongoing clinical relevance is suspected; practitioners should apply contemporary differentials (Sleep-Wake Disorders, Dissociative Disorders, Unspecified Trauma-Related Disorder).
      *   **All Other Diagnoses:** Existing diagnoses remain unchanged in the patient record unless re-assessment under v6.1 criteria is clinically indicated and performed. The diagnostic code remains valid, but the *criteria* applied are those of the version used at diagnosis. Continuity of the person is assumed; the change in manual version does not constitute a change in the underlying individual, only in the descriptive framework applied.
  *   **6.3. Voided Diagnoses:** None in this release. Deprecation (CDS) does not void historical diagnoses, only prevents new ones.
  *   **6.4. Re-assessment Recommendation:** For patients currently in treatment, consider re-assessment under v6.1 criteria if:
      *   The diagnosis was provisional.
      *   Clinical presentation has significantly evolved.
      *   The patient's self-description has demonstrably shifted in ways potentially better captured by new or revised categories (e.g., PDD).
      *   A diagnosis directly affected by Breaking Changes (e.g., AIFC) is central to the care plan, and alignment with current self-understanding is clinically beneficial. Document rationale for re-assessment or continuation under old criteria.

  **End of Release Notes**
