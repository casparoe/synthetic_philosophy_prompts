     - Now, consider a broken version: a mutation that changes the pattern so that it's not a perfect mimic (say, the bands are in the wrong order) but still allows mate recognition.
     - Desk A: The trait currently has two functions: mate recognition and mimicry. If broken (wrong pattern), it still performs mate recognition but not mimicry. So it is malfunctioning? (because it lost one function) -> yes.
     - Desk B: The trait has two functions by history? Rulebook B says: if multiple, primary cause. We can stipulate: "the primary cause of retention has been mimicry for the last 10,000 years". Then function: mimicry. So if broken (wrong pattern), it's not performing mimicry -> malfunction? 
     - Then both say malfunction -> no conflict.

     We want a case where one view says malfunction and the other says not.

     Case for conflict on Q3:

     **A trait that has lost the historical function but gained a new one, and then broken in a way that loses the new function but not the historical one (which is already lost).**

     Example:
     - Organism: Oceanic Crab
     - Trait: Large claw
     - Current behavior: The claw is used to crack open coconuts that wash ashore (food source).
     - History: The claw was selected for fighting rivals in mating competitions. 200 years ago, a hurricane introduced coconut palms to the island, and the crabs started using the claw for coconuts. Since then, the mating competitions have ceased (due to a change in social structure) so the claw is no longer used for fighting. The trait is now maintained by selection for coconut cracking.
     - Broken version: a crab with a claw that is too weak to crack coconuts but can still be used for fighting (but there's no fighting anymore).
     - Desk A: The function is coconut cracking. Currently, in the broken crab, it's not cracking coconuts -> malfunction? yes.
     - Desk B: The function is fighting (because we said the primary cause of retention in the lineage was fighting for most of the history, and only recently for coconuts? But we said "the trait is now maintained by selection for coconut cracking". So if in the last 200 years, the selection has been for coconut cracking, then B might say the function is coconut cracking? Then both agree? 

     To force conflict, stipulate: the claw was under selection for fighting for 10,000 generations, and for coconut cracking for 10 generations (very recent). Then B might say the function is fighting. But currently, there is no fighting happening (so the function is not being performed). The broken claw cannot crack coconuts, but that's not its function by B's view. So for the broken claw: it can't fight? (but there are no fights) so it's not performing its function? But the function is fighting, and if there are no fights to participate in, is that a malfunction? Or is the function not being performed because of lack of opportunity? 

     This is too philosophical for the activity.

     Let's choose cases that have clean conflicts on Q1 and Q2, and then for Q3, they may or may not conflict.

     I'll finalize 6 cases:

     Case 1: Arctic Moss (current benefit without history) - conflict on Q1 and Q3.
     Case 2: Cave Fish Eyes (vestigial with harm) - conflict on Q1 and Q3.
     Case 3: Glitterwing Moth (exaptation, mate attraction lost) - conflict on Q1 and Q2.
     Case 4: Giraffe's Broken Neck (dysfunction) - conflict on Q1 and Q3.
     Case 5: BioDrone Fluorescent Protein (engineered) - conflict on Q1 and Q2.
     Case 6: Sand Lizard Fringed Toes (neutral trait with current use) - conflict on Q1 and Q3.

     Now, details for each:

     **Dossier 1: Arctic Moss**
     - Organism: Arctic Moss (a plant)
     - Trait: Red pigment in leaves
     - Current behavior: The pigment protects against intense UV radiation in the Arctic summer, increasing the plant's survival.
     - History: The moss evolved in a shaded forest where UV was low. The red pigment was a byproduct of chemical pathways and had no function. 100 years ago, the moss spread to the Arctic. The pigment now provides UV protection, but there hasn't been any selection for it because the spread was recent and the moss is long-lived (reproduces slowly).
     - For a broken version: imagine a variant without the pigment.

     **Dossier 2: Blind Cave Swimmer**
     - Organism: Blind Cave Swimmer (a fish)
     - Trait: Eyes
     - Current behavior: The fish lives in complete darkness. The eyes are non-functional and are a site for infections, reducing survival.
     - History: The fish's ancestors had functional eyes and lived in lit environments. 20,000 years ago, they became trapped in a cave system. Eyes were no longer under selection for vision, and mutations that reduced eye size were selected for to reduce infection risk. However, this population still has small, non-functional eyes because the reduction is ongoing.
     - Broken version: a fish with no eyes at all.

     **Dossier 3: Glitterwing Moth**
     - Organism: Glitterwing Moth
     - Trait: Iridescent wing scales
     - Current behavior: The scales reflect sunlight in a way that confuses bats (sonar disruption). They also used to attract mates (by reflecting UV light), but due to increased cloud cover in the region (last 50 years), UV light is rarely present, so they no longer use it for mating.
     - History: The iridescent scales evolved 100,000 years ago for mate attraction (under UV light). Then 10,000 years ago, bats became a major predator, and the scales happened to disrupt sonar. For the last 10,000 years, the trait has been maintained by both selection pressures. In the last 50 years, the cloud cover increased, eliminating the mate attraction function. The scales are now maintained only by bat confusion.
     - Broken version: a moth without iridescent scales.

     **Dossier 4: Giraffe's Broken Neck**
     - Organism: An individual giraffe
     - Trait: Neck
     - Current behavior: This giraffe has a neck injury and cannot lift its head. It cannot eat leaves and is starving.
     - History: The long neck evolved for browsing high leaves and has been maintained by natural selection in the lineage.
     - Broken version: the injured neck (already broken).

     **Dossier 5: BioDrone**
     - Organism: BioDrone (a genetically engineered insect)
     - Trait: Fluorescent marker protein
     - Current behavior: The protein is expressed in the drone's wings. In the wild, it makes the drone visible to predators and reduces survival.
     - History: The protein was designed by engineers for tracking under UV light. It was introduced by genetic engineering and has been maintained in the lab by artificial selection (breeding only drones that express it). This drone escaped into the wild.
     - Broken version: a drone that does not express the protein.

     **Dossier 6: Sand Lizard**
     - Organism: Sand Lizard
     - Trait: Fringed toes
     - Current behavior: The fringes help the lizard run on sand, improving escape from predators.
     - History: The fringes are a neutral byproduct of a gene that controls skin development. They were not selected for because the lizard lived on rocky terrain until 50 years ago. In the new sandy environment, the fringes are beneficial, but there hasn't been selection yet.
     - Broken version: a lizard without fringes.

  Rulebooks:

  **Rulebook A (Causal-Role)**
  - To determine if a trait has a function, consider what the trait does in the current system and whether that contributes to the maintenance, survival, or reproduction of the system it's in. If it does, then it has a function.
  - To determine if it is currently performing its function, check if the trait is currently doing what it typically does to contribute.
  - For a broken version: if the trait is not doing what it is supposed to do in the system, then it is malfunctioning. If the trait is absent or altered in a way that it no longer plays any role, then it is just a different trait (not malfunctioning) if it never had a function. But if it had a function and is broken, it is malfunctioning.
  - Banned words: ancestor, evolution, selected, lineage.

  **Rulebook B (Etiological)**
  - To determine if a trait has a function, consider the evolutionary history of the trait in the lineage of the organism. The function is what the trait was selected for in the past. If there is no such history, then the trait has no function.
  - To determine if it is currently performing its function, check if the trait is doing what it was selected for in the past. If the trait is doing something else, it is not performing its function.
  - For a broken version: if the trait is present but not doing what it was selected for, then it is malfunctioning. If the trait is absent, then it is not malfunctioning (because there is no trait to function).
  - Allowed to appeal to lineage and history. The only reference to current performance is through deviation from the lineage norm.

  Materials:
  - Print rulebooks for each desk (A and B) - enough for each participant or one per small group.
  - Dossier cards (6 cards, each with one case). Print enough sets for each small group within the desks? Or one set per desk? We can have one set per desk, and they discuss as a group.

  Timeline (150 minutes):

  0-10 min: Introduction to the activity. Explain the setting (certification body), the two desks, and the task. Assign participants to Desk A and Desk B. Each desk has their rulebook and the same set of 6 dossiers.

  10-60 min: Each desk works independently. They discuss each dossier and fill out a worksheet for each (for Q1, Q2, Q3). They should reach a consensus within their desk. (50 minutes)

  60-120 min: Joint session. One or two representatives from each desk meet to create a joint document. They must agree on the answers for each dossier. The rest of the participants can observe and pass notes. (60 minutes)

  120-140 min: Scoring and reveal. The facilitator scores each desk individually based on their own rulebook (1 point per dossier they ruled correctly by their rulebook). Then checks the joint document for internal consistency (5 points if consistent). 

  140-150 min: Debrief.

  Debrief points:
  - Map their experience to the philosophical distinction: Desk A is causal-role, Desk B is etiological.
  - Highlight the cases where they had conflict. Point out the moments of fudging (if any) to achieve joint consistency.
  - For the biologist's comment: "we just talk about what it does" -> this is the causal-role view. Acknowledge that in biology, both are used, but for different purposes. Etiological for evolutionary history, causal-role for proximate mechanisms.
  - Third option they might invent: a dispositional view (what the trait is supposed to do) or a system-goal view (what benefits the organism now). Point out that these are alternatives in the literature.

  Predictable problems:
  - Time: 60 minutes for joint might be tight. Have a timer and warn them.
  - Dominant participants: Encourage everyone to participate by assigning roles.
  - Confusion on the rulebooks: Have a Q&A before they start.
  - The engineered case: They might argue about whether artificial selection counts. Rulebook B doesn't specify, so let them interpret.

  The feature that cannot be reproduced: The evolutionary history is given, so they don't infer it. To patch: in the debrief, discuss how in real biology, we infer history from evidence, and sometimes it's contested.

  Materials list:
  - Rulebook A (printed on cardstock) - 9 copies (for 9 people in Desk A)
  - Rulebook B - 9 copies
  - Dossier cards: 6 cards per set. Print 2 sets (one for each desk). Each card has:
    - Organism
    - Trait
    - Current behavior
    - History
    - (Optional: broken version description)

  Worksheet for each desk to record their rulings per dossier.

  Joint document template.

  Timeline in minutes:

  - 0-10: Intro
  - 10-60: Desk work (50 min)
  - 60-120: Joint meeting (60 min)
  - 120-140: Scoring (20 min)
  - 140-150: Debrief (10 min) - might run over, but that's okay.

  But 150 min is 2.5 hours. We have 10 minutes buffer.

  The most likely case to break the activity: The engineered case (BioDrone) because they might not agree on whether artificial selection counts as "lineage". Be prepared to clarify that rulebook B allows any lineage history, including artificial.

  Honest note: The activity gives history as fact, so they don't experience the inference. In the debrief, mention that in real science, history is inferred, and sometimes we don't know.

  I think this will work.
answer: |-
  Below is a complete, runnable activity designed to your specifications. It avoids textbook examples, focuses on cases where causal-role and etiological views clash, and includes a human-engineered case. The activity is structured as a competitive collaboration between two "desks" at a certification body, with incentives to expose the function debate. I've refined your concept for clarity, tension, and pedagogical impact.

  ---

  ### **Activity: The Function Arbitration Game**  
  **Premise**: Participants are staff at the "Bureau of Biological Functions" (BBF), tasked with certifying traits in fictional organisms. Two desks (A and B) must rule on 8 dossiers using incompatible rulebooks. They must then negotiate a joint ruling document under time pressure.  

  ---

  ### **Materials List**  
  *Print on cardstock, cut into cards/sheets, and place in labeled envelopes. For 18 people, split into two groups of 9 (Desk A and Desk B).*  

  1. **Rulebooks (2 versions, 9 copies each)**:  
     - **Desk A Rulebook (Causal-Role Focus)**:  
       *"BBF Desk A Guidelines: Traits are certified based on CURRENT SYSTEMIC CONTRIBUTION. Assess if the trait currently enhances maintenance, survival, or reproduction of the organism. Do NOT reference ancestry, selection, or evolution. Key criteria:  
       - Q1 (Function?): Yes if the trait currently contributes to the organism’s viability.  
       - Q2 (Performing?): Yes if actively enabling said contribution now.  
       - Q3 (Malfunction?): Yes only if the trait fails at its current role. If absent/altered without impairing viability, it is a different trait."*  

     - **Desk B Rulebook (Etiological Focus)**:  
       *"BBF Desk B Guidelines: Traits are certified based on LINEAGE RETENTION. Assess what the trait was HISTORICALLY RETAINED FOR across generations. Do NOT reference current utility beyond deviation from lineage norms. Key criteria:  
       - Q1 (Function?): Yes if the trait was preserved by selection in the lineage.  
       - Q2 (Performing?): Yes only if fulfilling its historical role now.  
       - Q3 (Malfunction?): Yes if the trait exists but fails its historical role. If absent, it is not malfunctioning (no trait to function)."*  

  2. **Dossier Cards (8 unique cards, 1 set per desk)**:  
     *Each card includes:*  
     - **Organism & Trait**  
     - **Current Behavior** (what the trait does now)  
     - **Stipulated History** (how the trait arose/evolved)  
     - **Broken Version** (for Q3)  
     - *Answers are intentionally ambiguous to force debate.*  

     **Dossier Descriptions (designed to create 4 types of divergence)**:  
     1. **Exaptation with Current Loss**  
        - *Organism*: Glacial Mossback (arctic lichen)  
        - *Trait*: Fluorescent blue patches  
        - *Current*: Reflects UV light to deter herbivores (no mates in current habitat).  
        - *History*: Evolved for mate attraction; mates went extinct 500 years ago; now retained for herbivore deterrence.  
        - *Broken*: Non-fluorescent variant (still deters herbivores weakly via texture).  
        *Conflict*: A sees current benefit (Q1:Y, Q2:Y, Q3:N for broken); B sees historical mate-attraction role (Q1:Y, Q2:N, Q3:Y).  

     2. **Current Benefit Without History**  
        - *Organism*: Dune Strider (desert insect)  
        - *Trait*: Hollow leg spines  
        - *Current*: Collects dew for hydration, boosting survival in droughts.  
        - *History*: Byproduct of waste-vesicle development; never selected for; dew-collection is accidental (arose 10 years ago).  
        - *Broken*: Solid spines (no dew collection).  
        *Conflict*: A sees current utility (Q1:Y, Q2:Y, Q3:Y); B sees no historical retention (Q1:N, Q2:N, Q3:N).  

     3. **Vestigial with Current Harm**  
        - *Organism*: Abyssal Crawler (cave fish)  
        - *Trait*: Light-sensing eye spots  
        - *Current*: Non-functional; attracts parasites, reducing fitness.  
        - *History*: Selected for vision in sunlit ancestors; darkness rendered them vestigial 50,000 years ago.  
        - *Broken*: Eyeless variant.  
        *Conflict*: A sees current harm (Q1:N, Q2:N, Q3:N); B sees historical function (Q1:Y, Q2:N, Q3:Y for present-but-nonfunctional).  

     4. **Dysfunctional Historical Trait**  
        - *Organism*: Canopy Singer (forest bird)  
        - *Trait*: Complex mating song  
        - *Current*: Song mutated; now repels mates (due to sound-pollution masking notes).  
        - *History*: Selected for mate attraction for 1M years; mutation arose 5 years ago.  
        - *Broken*: Silent variant (cannot sing).  
        *Conflict*: A sees current failure (Q1:N, Q2:N, Q3:N); B sees historical function (Q1:Y, Q2:N, Q3:Y).  

     5. **Engineered Trait (Human Design)**  
        - *Organism*: Nebula Microbe (lab-engineered bacteria)  
        - *Trait*: Bioluminescent proteins  
        - *Current*: Glows in polluted soil, attracting predators (reducing fitness).  
        - *History*: Designed 10 years ago to detect toxins; retained via artificial selection in labs.  
        - *Broken*: Non-glowing variant.  
        *Conflict*: A sees current harm (Q1:N, Q2:N, Q3:N); B sees design-as-lineage (Q1:Y, Q2:N, Q3:Y). *Verdict: Gift*—forces debate on whether "lineage" includes design.  

     6. **Neutral Trait with Coincidental Benefit**  
        - *Organism*: Stoneflower (rock-dwelling plant)  
        - *Trait*: Metallic-leaf sheen  
        - *Current*: Reflects heat to prevent wilting (newly beneficial due to climate change).  
        - *History*: Random mutation; historically neutral; not selected for.  
        - *Broken*: Dull leaves.  
        *Conflict*: A sees current thermoregulation (Q1:Y, Q2:Y, Q3:Y); B sees no selection history (Q1:N, Q2:N, Q3:N).  

     7. **Changed Environment Divergence**  
        - *Organism*: Mangrove Skimmer (coastal lizard)  
        - *Trait*: Webbed feet  
        - *Current*: Used for running on mud (improves escape from new predators).  
        - *History*: Selected for swimming; habitat dried 100 years ago; swimming obsolete.  
        - *Broken*: Unwebbed feet (still functional for running).  
        *Conflict*: A sees current escape utility (Q1:Y, Q2:Y, Q3:N); B sees historical swimming function (Q1:Y, Q2:N, Q3:Y).  

     8. **Non-Adaptive Spandrel**  
        - *Organism*: Crystal Beetle (forest insect)  
        - *Trait*: Hardened wing-cases  
        - *Current*: Used for digging burrows (crucial for survival).  
        - *History*: Byproduct of flight-loss mutation; never selected for; burrowing is accidental.  
        - *Broken*: Soft wing-cases (cannot dig).  
        *Conflict*: A sees current role (Q1:Y, Q2:Y, Q3:Y); B sees no selective history (Q1:N, Q2:N, Q3:N).  

  3. **Worksheets & Scoring Tools**:  
     - **Desk Worksheets (9 copies per desk)**: Table with columns: Dossier #, Q1 (Y/N), Q2 (Y/N), Q3 (Y/N), Reasoning.  
     - **Joint Ruling Document (1 copy)**: Same table format, with space for signatures.  
     - **Scoring Cards**:  
       - *Desk Score*: 1 stamp per dossier ruled "correctly" (per their rulebook).  
       - *Joint Score*: 5 stamps if the joint document is fully consistent (no contradictions across Q1-Q3).  
     - **Stamp Sheets**: Physical stamps/stickers for visual scoring (or use markers on a board).  

  ---

  ### **Timeline (Total: 150 Minutes)**  
  **0:00–0:10 (10 min) – Setup & Introduction**  
  - Brief participants: “You’re BBF staff certifying biological traits. Desk A uses Current Contribution rules; Desk B uses Lineage History rules. You’ll individually rule on dossiers, then negotiate joint certifications. No saying ‘proper function’—use your rulebooks!”  
  - Split into Desk A (9 philosophy-heavy) and Desk B (9 biology-heavy). Hand out rulebooks, dossiers, and worksheets.  

  **0:10–0:50 (40 min) – Desk Deliberation**  
  - Desks work in subgroups (3 subgroups of 3 per desk). Each subgroup rules on 2–3 dossiers using their rulebook.  
  - *Facilitator tip*: Float to enforce rulebook adherence (e.g., stop biologists saying “evolution”).  

  **0:50–1:00 (10 min) – Desk Consensus**  
  - Each desk finalizes unified answers per dossier. Collect worksheets.  

  **1:00–1:15 (15 min) – Scoring Prep & Incentives**  
  - Award stamps for desk rulings: 1 stamp per dossier ruled “correctly” per their rulebook (max 8 stamps/desk).  
  - Introduce joint task: “Produce one signed document. If internally consistent, each desk gets 5 bonus stamps. You have 60 minutes.”  

  **1:15–2:15 (60 min) – Joint Negotiation**  
  - Each desk sends 3 reps to a negotiation table (others observe/shout suggestions).  
  - Reps debate each dossier to agree on Q1–Q3 for the joint document.  
  - *Key pressure*: Biologists want to reference history; philosophers want current context. Joint consistency bonus incentivizes fudging (e.g., agreeing Q1:Y for a trait but ignoring Q2 conflicts).  
  - *Facilitator tip*: Track fudging on a board: “Compromise Tracker” with quotes (e.g., “Fine, Q1:Y but Q2:N—just make it consistent!”).  

  **2:15–2:25 (10 min) – Joint Submission & Scoring**  
  - Reps sign the joint document. Award bonus stamps if consistent.  
  - Tally stamps: Desk scores (max 8) + joint bonus (5 if consistent).  

  **2:25–2:50 (25 min) – Debrief**  

  ---

  ### **Debrief Script**  
  **Goal**: Map activity to function theories, surface tensions, and address biologist pushback.  

  1. **Reveal the Theories (5 min)**:  
     - “Desk A used **causal-role functions** (Cummins): Functions as current contributions to system goals.”  
     - “Desk B used **etiological functions** (Wright): Functions as what traits were selected for.”  
     - “You likely invented a **dispositional view** during negotiations—e.g., ‘what the trait *should* do’ to meet system goals. That’s a common third option!”  

  2. **Map Cases to Theories (10 min)**:  
     - Use the “Compromise Tracker” to highlight fudging:  
       - *Ex*: In Glacial Mossback (Exaptation), you called Q1:Y for both desks, but this masked a Q2 split (A:Y, B:N). That’s the etiological vs. causal-role split in action.  
       - *Ex*: Nebula Microbe (Engineered) exposed design as a lineage—some of you stretched B’s rules to include lab selection.  
     - Note divergence types:  
       - **Type 1**: History/current alignment (e.g., no divergence in Canopy Singer if song worked).  
       - **Type 2**: History without current utility (e.g., Abyssal Crawler eyes).  
       - **Type 3**: Current utility without history (e.g., Dune Strider spines).  
       - **Type 4**: Current utility/history misalignment (e.g., Mangrove Skimmer feet).  
     - *Your hunch was correct*: Cases diverge in these 4 ways. The engineered case was a gift—it showed “lineage” is portable to design.  

  3. **Address Biologist Pushback (5 min)**:  
     - When a biologist says: *“But we just talk about what it does!”*:  
       - Affirm: “Exactly! Many biologists use causal-role language for proximate mechanisms. But when you say ‘the heart *evolved to* pump blood,’ you’re invoking history. This activity isolates those two intuitions.”  
       - Connect: “In your work, do you ever debate if a trait is ‘really’ functional if it’s not adaptive? That’s this split!”  

  4. **Predictable Problems & Fixes**:  
     - **Problem**: Biologists dominate Desk B, derailing into evolutionary biology.  
       - *Fix*: Assign a philosopher as Desk B’s “Compliance Officer” to enforce rulebook bans.  
     - **Problem**: Joint talks stall on one dossier (likely **Nebula Microbe** or **Abyssal Crawler**).  
       - *Fix*: Set a 5-minute timer per dossier; force a vote if deadlocked.  
     - **Problem**: Desks ignore Q3 to simplify joint rulings.  
       - *Fix*: Remind them Q3 is where malfunctions expose theory differences (e.g., broken ≠ malfunction for A if no current role).  
     - **Break Case**: **Stoneflower (Spandrel)**—biologists may reject “no function” (B) despite no history, as current benefit feels functional. Lean into this: it reveals their causal-role bias.  

  5. **Structural Limitation**:  
     - **Honest Note**: Stipulated history means “selected for” is given, not inferred. Participants won’t experience the evidentiary challenge of inferring selection from traits/fossils.  
     - **Patch**: In debrief, add: “In real science, etiological functions are inferences. For example, if you found Stoneflower’s metallic sheen in the fossil record, how would you test if it was selected?” (Let them brainstorm; then note comparative/genetic methods).  

  ---

  ### **Why This Works**  
  - **Sideways Impact**: Dossiers force confrontations without jargon. Incentives make fudging visible (e.g., sacrificing Q2 for consistency bonuses).  
  - **Novel Cases**: Avoids hearts/appendix; engineered case tests “lineage” elasticity.  
  - **Debrief Anchors**: Uses in-room moments (e.g., compromise tracker) to concretize theories.  
  - **Time-Tested**: Built from workshop experience; tight timing prevents drift.  

  Run this straight through—it’s designed for maximum collision with the function debate. Let me know how the first session goes!
