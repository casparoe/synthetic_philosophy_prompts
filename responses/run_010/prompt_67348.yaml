  We are designing an interactive workshop activity to help participants discover the causal-role (Cummins) vs. etiological (selected effects) theories of function without using the standard examples. The activity involves two "desks" (A and B) with different rulebooks, and they must jointly certify a set of traits (dossiers) and produce one consistent document.

  Key constraints:
  - Desk A (causal-role): only considers current contribution to maintenance, survival, and reproduction of the system. Words like "ancestor", "selected", "evolution" are banned.
  - Desk B (etiological): only considers lineage (what the trait was retained for across generations). Cannot appeal to current performance except via deviation from lineage norm.

  Dossiers: 6-8 cases, avoiding standard examples (like heart, appendix). Include one human-designed/engineered trait. Cases should highlight where current contribution and lineage history diverge.

  Activity structure:
  - Participants are divided into two groups (Desk A and Desk B). Each group gets their rulebook and a set of dossier cards.
  - They individually (or in small groups) rule on each dossier: 
      (Q1) Does the trait have a function?
      (Q2) Is it currently performing that function?
      (Q3) If broken, would it be malfunctioning or just a different trait?
  - Then, the two desks must come together to produce a joint document with consistent answers for all dossiers.

  Scoring: 
  - Each desk gets points for following their rulebook (say, 1 point per dossier they rule correctly by their rules).
  - A bigger reward (say, 5 points) if the joint document is internally consistent (i.e., for each dossier, the answers to the three questions are consistent with each other and with the joint ruling).

  This creates pressure to fudge to get the joint consistency bonus.

  Dossier Cases:

  We need cases where current contribution and lineage history come apart. Possible types of divergence:

  1. **Exaptation**: Trait originally selected for one function, now co-opted for another (and may or may not still perform the original). 
  2. **Dysfunction**: Trait has a history of being selected for a function, but currently is broken (not performing that function). 
  3. **Current Benefit without History**: Trait currently contributes to fitness, but not because of past selection (e.g., by chance, or a new environment).
  4. **Vestigial Trait**: Trait had a function in the past but now has no function (or a different one) and may even be harmful.
  5. **Engineered Trait**: Human-designed, so lineage is artificial selection or design.

  Additionally, we might include:
  6. **Neutral Trait**: Never had a function, but currently does something (maybe by chance beneficial?).
  7. **Coincidental Benefit**: Trait is doing something beneficial now that was never selected for.

