prompt: |-
  So, bit of an odd request. I cover science and research integrity for a general-audience outlet, and I've been invited to give the main talk at a one-day workshop a journalism school is putting on in about three weeks, on trust and evidence in news. Its not a philosophy department affair, it's mostly practitioners, but they've asked me to actually argue a position rather than tell war stories, so I've decided to defend something I've been chewing on for a couple of years: that the two-source rule — the newsroom norm that you don't publish a serious allegation about a person or institution unless two independent sources back it — isn't a safeguard against error so much as a filter that skews which *true* claims survive, and that newsrooms hold it while running a completely different and much more credulous epistemology whenever the source is a published paper. My argument runs in three moves: (1) corroboration-as-counting rewards testimony that's cheap to duplicate — officials, spokespeople, anyone working from the same brief or sharing an institutional interest — and punishes testimony that's expensive to duplicate, which is usually one insider sitting on documents; (2) so the rule doesn't just add reliability at the margin, it changes the composition of what gets through, and in a predictable direction; (3) meanwhile a single underpowered study in a glossy journal gets written up as news with no corroboration at all, which makes the newsroom reductionist about human witnesses and near-credulous about print. The punchline I want is that the rule is doing legal and ritual work that people have mistaken for epistemic work.

  Here's who'll be in the room, because I don't want generic objections. Roughly forty people. The majority are ex-reporters and editors now teaching, and they hold the two-source rule in a bone-deep way — for them it's Watergate, it's not getting sued into the ground, and it's protecting a source who could be identified by elimination if we ran the story alone. One actual media lawyer is on the program. Two or three academic philosophers and social epistemologists were added late; they'll know the Hume-Reid reductionism debate and the testimonial-injustice stuff cold and will absolutely use that vocabulary, and I suspect one of them thinks my framing is philosophically naive. And there are maybe five quantitative communication researchers who only care about experiments and corrections data and will want to know how I'd operationalize any of this.

  What I want from you is the Q&A prep, not a defense of me. Give me the eight-ish objections this particular room will actually raise, ordered by how much damage each would do to the talk, each phrased the way that person would phrase it — the editor's version and the epistemologist's version of the same worry are different sentences, and I want both registers. For each, a two-minute reply I could actually say out loud standing up, plus a note on where the reply is soft or where I'd be bullshitting a bit. Then tell me what to concede in the first five minutes to take the wind out of the biggest one, and which single reply has to land for the whole thing not to collapse. Include the question I'm dreading; my guess is it's somebody pointing out that my best anecdote is a story that got published anyway by someone else, i.e. the system worked, just slowly. The anecdote, for what it's worth: two years ago I had a postdoc with a spreadsheet showing duplicated images across figures in a high-profile paper, she wouldn't let me identify her lab and I couldn't get a second source, my editor killed it, and seven months later the paper came down after an anonymous blogger made the same argument publicly using the same images. I'll probably tell that story on stage. Please don't send me reading — no library access and about as much prep time as you'd expect, so no bibliographies, no citations, no named studies, just the arguments. And if you think one of my three premises is simply wrong, say that up front rather than politely constructing an objection around it.
reasoning: |-
  Okay, the user is a science journalist preparing a talk challenging the two-source rule in journalism. They've outlined their argument: the rule skews which true claims get published by favoring easily duplicated testimony over unique insider info, while published papers get uncritical coverage. They need Q&A prep for a mixed audience of ex-reporters, editors, a lawyer, epistemologists, and communication researchers.

  Hmm, the key tension here is between journalistic tradition and epistemic critique. The room will have deeply ingrained defenders of the two-source rule who see it as sacrosanct - Watergate lore, legal protection, source safety. Meanwhile academics will dissect the epistemology. Need to anticipate both emotional and intellectual objections.

  First major concern: the lawyer will hammer on legal risk. Can't dismiss that - must concede it's valid while separating legal vs truth-finding functions. The existential threat of lawsuits is real for practitioners. Should address this upfront to defuse tension.

  Second big one: the Watergate objection. Editors will cite it as proof the rule works. Need to reframe - yes it worked there, but that's survivorship bias. For every Deep Throat, how many whistleblowers got silenced because they couldn't find a second source? The blogger anecdote illustrates this perfectly.

  Ah the dreaded question about that very anecdote: "But the system worked eventually!" Tricky. Must acknowledge it while pointing out the delay allowed harm - papers cited, grants awarded. Truth delayed is truth denied in science.

  Epistemologists will pounce on the paper/journalism comparison. They'll say it's apples/oranges - journals have peer review (however flawed). Good point. Should concede peer review exists but argue it's not equivalent to corroboration - same way two cops aren't independent if both work for same chief.

  Quant researchers will demand data. Have no time for studies but can flip it: absence of data proves the point. Newsrooms don't systematically track stories killed by two-source rule. The selection bias is invisible by design.

  For the "ritual" accusation: must be careful. Can say it serves social/legal functions while still arguing it's treated as epistemic. Like how "beyond reasonable doubt" is legal, not mathematical.

  Most important reply? The composition effect (#1). If I can't convince them the rule actively filters certain truths, the whole argument collapses. The cancer drug example might work - institutional voices align, lone dissenter silenced.

  Should start with concessions: yes the rule prevents some errors, yes it protects sources legally. Gets the nod early. Then pivot to "but here's what it costs us."

  Biggest bullshit spot: claiming journals are "near-credulous." Overstatement. Should soften to "less skeptical than toward human sources." The asymmetry is real but not absolute.

  Final thought: the room needs to leave feeling this is a critique from within journalism, not an academic attack. Frame as "how do we get more truth" not "your sacred cow is dumb."
answer: |-
  Here are the eight most damaging objections you'll face, prioritized by threat level, with dual formulations (practitioner vs. academic) and actionable replies. I'll flag soft spots and note key concessions upfront. Your core argument holds, but the "ritual vs. epistemic" punchline needs careful framing.

  ### **Preemptive Concession (First 5 Minutes)**  
  **Concede this:** *"The two-source rule absolutely prevents catastrophic errors and lawsuits. It protects vulnerable sources and shields newsrooms from destruction. Legally and ethically, it’s often non-negotiable. My argument isn’t that we scrap it, but that we stop pretending it’s a neutral truth-detector. It’s a filter with biases, and we ignore those biases at our peril—especially when we suspend the same skepticism for peer-reviewed print."*  
  *Why:* Disarms legal/defensive objections early. Lets practitioners exhale.

  ---

  ### **The Objections & Replies**  
  **1. The Legal Existential Threat**  
     - **Editor/Lawyer:** *"Without the two-source rule, we’d get sued into oblivion. One disgruntled insider isn’t proof—it’s an invitation to libel. You’re gambling with the newsroom’s survival."*  
     - **Epistemologist:** *"You’re conflating epistemic and legal norms. The rule’s *ritual* function (avoiding liability) doesn’t entail *epistemic* reliability. Legal safety ≠ truth-conduciveness."*  
     - **Your Reply:**  
       *"Absolutely—the rule is essential for legal defense. But we’ve conflated *‘won’t get us sued’* with *‘must be true.’* My point is that this legal shield *systematically excludes* high-risk/high-reward truths. When we then uncritically platform single studies, we’re taking bigger epistemic risks without the same legal safeguards. The rule isn’t wrong; it’s just not what we claim it is."*  
       **Soft Spot:** Downplays how legal fears *create* epistemic limits. Don’t call it "just ritual"—emphasize "evolved for courts, not truth."

  **2. The Watergate Canon**  
     - **Editor:** *"This rule gave us Watergate! Deep Throat was the *second source* confirming Woodward’s documents. Dismantling this is journalistic heresy."*  
     - **Social Epistemologist:** *"Survivorship bias. For every Watergate, how many true stories died unsourced? We celebrate successes but ignore the truths filtered out."*  
     - **Your Reply:**  
       *"Watergate succeeded *despite* the filter’s bias, not because of it. Felt was a senior official—exactly the ‘cheap testimony’ the rule favors. Imagine if Deep Throat had been a low-level IT tech with no second source. Would we know the truth? The rule *worked* here, but it’s designed for institutional access. What about truths *outside* institutions?"*  
       **Soft Spot:** Feels like attacking a sacrament. Stress: *"I’m not criticizing Watergate—I’m asking what we miss when institutions control the narrative."*

  **3. "But Peer Review is Corroboration!"**  
     - **Quant Researcher/Editor:** *"A published paper *is* corroborated—by peer review! You’re comparing raw testimony to vetted science. That’s apples to oranges."*  
     - **Philosopher:** *"Peer review is *socially situated* corroboration—often by rivals or ideologues. It’s not independent replication; it’s gatekeeping with its own biases."*  
     - **Your Reply:**  
       *"Peer review evaluates methodology, not truth. It rarely includes data audits or replication. When a journal publishes a single underpowered study on ‘chocolate causes weight loss,’ we report it as ‘science says’—no second source, no caveats. Yet if two PR flacks from the same company give identical quotes, we call that ‘corroboration.’ We’ve inverted our standards: rigorous for humans, credulous for print."*  
       **Soft Spot:** Overstates peer review’s flaws. Say *"often minimal scrutiny"* not *"no scrutiny."*

  **4. "Your Anecdote Proves the Rule Works!" (The Dreaded Question)**  
     - **Editor:** *"Your postdoc story shows the system *functioning*—the blogger was the second source! The rule delayed the story but prevented a retraction disaster if you were wrong."*  
     - **Communications Researcher:** *"This is anecdotal. Where’s the data showing systemic distortion? All filters have false negatives."*  
     - **Your Reply:**  
       *"Seven months of delay in science is catastrophic. That paper was cited, built on, maybe funded further. The rule didn’t *prevent* error—it outsourced verification to an unpaid blogger. My point is: why do we demand two humans for a leak, but accept a single paper’s authority? The blogger wasn’t a ‘second source’ in the journalistic sense—they were publishing *publicly*. The rule didn’t facilitate truth; it delegated our job."*  
       **Must Land This:** *"The rule didn’t kill a false story—it killed a *true* one until someone else did our work."*

  **5. "What’s the Alternative? Run Every Leak?"**  
     - **Editor:** *"So we should publish every whistleblower’s unsupported claim? That’s how you destroy credibility and get innocent people fired."*  
     - **Epistemologist:** *"Your critique lacks a normative alternative. If not counting sources, what *should* we use? Bayesian likelihoods? Practical wisdom?"*  
     - **Your Reply:**  
       *"Not at all. We need *transparency about the filter*. Admit when a story dies for lack of a second source despite strong evidence. And apply similar skepticism to papers: ‘This is a single study; we await replication.’ My goal is symmetry. When we have one human source with documents, we might say: ‘We’re withholding names because we lack a second source, but here’s why the documents suggest an issue.’ We already do this with scientific uncertainty—why not human testimony?"*  
       **Soft Spot:** Sounds wishy-washy. Emphasize: *"I’m proposing rigor parity, not anarchy."*

  **6. "The Rule Prevents Testimonial Injustice!"**  
     - **Philosopher:** *"Aren’t you ignoring how the rule *protects* marginalized sources? One isolated whistleblower might be coerced or unreliable. Two sources reduce power imbalances."*  
     - **Editor:** *"This protects junior sources from retaliation. If they’re the only one, they’re exposed."*  
     - **Your Reply:**  
       *"It protects *some* sources but silences others. Consider a lone low-level employee with damning documents. If they can’t find a second whistleblower (who risks their job too), their truth dies. Meanwhile, two C-suite executives can ‘corroborate’ a corporate lie effortlessly. The rule *amplifies* institutional power. We mitigate risk to sources through anonymity and legal review—not by demanding a chorus."*  
       **Soft Spot:** Ignores that marginalized people may lack corroborators. Acknowledge: *"Yes, the rule has protective uses—but it’s a blunt instrument."*

  **7. "You’re Ignoring the Cost of False Positives"**  
     - **Quant Researcher:** *"Your focus is on ‘true stories missed.’ But the rule’s value is reducing false alarms. Where’s your error rate data?"*  
     - **Editor:** *"Without this, we’d publish more garbage. The retraction would hurt our credibility more than a delay."*  
     - **Your Reply:**  
       *"I agree false positives are damaging. But we have *no idea* how many true stories we kill because we don’t track them. Meanwhile, we *do* publish false claims from single studies—like that infamous autism/vaccine paper. We accept higher epistemic risk from journals than from human sources. If we applied the two-source rule to papers—‘we won’t report until two independent labs replicate’—we’d miss deadlines, but we’d be more accurate. Why the double standard?"*  
       **Bullshit Alert:** Assumes journals have higher false-positive rates than human sources. Stick to *asymmetry*.

  **8. "Corroboration Isn’t Just Counting"**  
     - **Epistemologist:** *"You reduce corroboration to headcount. But good editors weigh source *independence*, motivation, and evidence. Humean reductionism isn’t the rule’s fault—it’s lazy practice."*  
     - **Editor:** *"We don’t just tally sources—we ask if they’re independent and credible. Your ‘cheap testimony’ point is a straw man."*  
     - **Your Reply:**  
       *"In theory, yes. In practice, ‘independence’ is hazy. Two police spokespeople from different precincts are ‘independent sources’—but both represent the same system. A whistleblower with documents and no ally is ‘uncorroborated.’ The rule *operationalizes* independence as separateness, not true adversarial diversity. We need to ask: ‘Do these sources *diverge* in perspective or interest?’ Not just: ‘Are they in different buildings?’"*  
       **Soft Spot:** Overgeneralizes. Cite your postdoc: *"My source had evidence but no ‘independent’ second—because the entire lab was implicated."*

  ---

  ### **The Make-or-Break Reply**  
  **For objection #4 (Your Anecdote "Proves the Rule Works"):**  
  If this doesn’t land, your thesis collapses. Hammer: *"The rule didn’t protect science—it protected the fraudulent paper for seven extra months. The blogger didn’t ‘corroborate’—they did the journalism we outsourced. We demand two humans for a leak but outsource verification of print to unpaid strangers. That’s not rigor; it’s epistemic buck-passing."*

  ### **One Premise That’s Shaky**  
  Your premise (3) *"a single underpowered study gets written up with no corroboration"* isn’t wrong, but it’s overstated. Some outlets *do* quote skeptics or note limitations. Soften to: *"Newsrooms routinely platform single, shaky studies with far less skepticism than they apply to a human source with documentary evidence."*

  ### **Final Prep Tip**  
  Open with: *"I’m not here to bury the two-source rule—I use it every week. But let’s be honest about its tradeoffs."* Neutralizes defensiveness. Then pivot to: *"Why do we demand two humans to call out a fraud, but accept one paper to declare a truth?"*  
  **Structure for Impact:** Lead with the postdoc anecdote → Frame the asymmetry → Concede legal necessity early → End with: *"The rule is a shield against lawsuits and chaos. Let’s stop pretending it’s a microscope for truth."*

  You’ve got this. The room will push hard, but your argument exposes a real hypocrisy. Stay grounded in practitioner logic—no philosophy jargon.
