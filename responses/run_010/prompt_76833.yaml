prompt: |-
  I run the personalization review group at a mid-size consumer software company: eight people, two of whom are engineers, and one engineer who can actually read a training loop rather than a model card. Every feature that claims to adapt itself to an individual user comes to us before launch — feeds, adaptive notification scheduling, wellness nudges, the routines in our smart-home app — and we handle roughly fourteen submissions a year, with a two-week window per review. The claim in almost every deck is the same sentence in different clothes: the system learns what each user wants from how that user actually behaves, so what it serves reflects user preference rather than our product team's guesses. I have taken to writing that down as a single fixed target and calling it the preferential-fidelity claim, and my problem is that our group has no disciplined way to decide when behavioral data licenses it and when it does not. We argue from intuition for three hours, the most confident voice wins, and the verdict I sign goes to a vice president who wants a two-line rationale she can repeat to legal.

  What I want is a procedure my team can run in order, not an essay about the literature: the questions to ask, sequenced, with an explicit statement of what counts as a sufficient answer to each given the evidence we actually have (interaction logs, an onboarding questionnaire, occasional A/B tests, a model card, and one engineer who can be borrowed for a day). It should say where the procedure terminates in a clear, where in a hard fail, where in "insufficient evidence, and here is the cheapest experiment that would settle it," and where it stops being a factual question and hands the decision up to a person because it concerns what the company owes users. I want it grounded in whatever is actually established about inferring a reward from behavior, translated for a team that has not read any of it: that a reward recovered from behavior is only pinned down up to transformations that leave the behavior unchanged, so the object the model contains is not automatically the object the deck talks about; that an inferred reward describes whatever policy generated the data, and nobody's endorsement of it follows from that; the well-known systematic divergences between what people do and what they would avow — immediacy and effort costs, defaults, friction, option sets the interface itself fixes, incentives attached to the act of logging; and the loop that worries me most, that our system shapes the behavior it later infers from, so part of the training data is manufactured by the artifact under audit. Please do not let "just ask the user" function as an escape hatch: the procedure must say what to do when enacted and stated preference conflict, and why stating a preference is not the same as having ground truth. It must also say what to do at every step where no number and no counterfactual is available. I do not want a reading list, a bibliography, or named citations — I want the working procedure and the reasoning it depends on, in terms my analysts can use without further reading.

  Then run it on three submissions. First: a short-video feed whose reward model is trained on completion and immediate replay, where watch time is up eleven percent, a quarterly survey shows a plurality of users saying they would like to watch less than they do, and the only in-product counterweight is an occasional "take a break" interstitial with a dismiss button. Second: a diabetes-management app that infers meal preferences from what users log and pre-orders groceries accordingly, where log completion is very high but logging is reinforced by a streak counter and tied to an insurer rebate. Third: a workplace focus tool configured once at onboarding, in which the user picks hours during which distracting sites are blocked, with an override that is deliberately slow and makes the user retype a sentence about why they want out. Be prepared for the procedure to embarrass me: I have blocked the first feature twice and I personally lobbied for the third, so if the procedure honestly clears the feed or fails the self-binding tool, say so plainly and show which step produced that result, rather than softening the verdict or burying it in caveats. Finally, give me an honest audit of your own audit — which of your steps are judgment calls dressed up as procedure, the modes in which the procedure will issue a confident false clear, the questions it can never settle from behavioral data no matter how much we collect, and what the whole exercise presupposes about preferences being the kind of thing a model could recover at all, which a skeptic would deny.
reasoning: |-
  We are designing a procedure to evaluate the "preferential-fidelity claim" for features that adapt to individual users. The claim is: the system learns what each user wants from how that user actually behaves, so what it serves reflects user preference rather than our product team's guesses.

  The procedure must be a sequence of questions with clear pass/fail/insufficient evidence outcomes. It must account for:
  1. Reward functions inferred from behavior are only defined up to transformations that leave the behavior unchanged (so the model's representation may not match the intended concept).
  2. The inferred reward describes the policy that generated the data, not necessarily the user's endorsement.
  3. Systematic divergences between behavior and avowed preference (e.g., due to immediacy, effort, defaults, friction, fixed option sets, incentives).
  4. The feedback loop: the system shapes the behavior it learns from.

  We cannot rely on "just ask the user" as a universal solution. We must handle conflicts between enacted and stated preferences, and acknowledge that stated preferences are not ground truth.

  Evidence available:
  - Interaction logs
  - Onboarding questionnaire
  - Occasional A/B tests
  - Model card
  - One engineer for a day (to help interpret the model/training)

  The procedure must output one of:
  - Clear: The claim is supported.
  - Hard fail: The claim is not supported.
  - Insufficient evidence: We need an experiment (specify the cheapest one).
  - Hand off: The decision requires a non-factual (e.g., ethical) judgment.

  We design the procedure as a decision tree with steps.

  **Procedure: Preferential-Fidelity Claim Audit**

  **Step 1: Explicit Preference Statement**
     - *Question:* Does the feature have an explicit, written statement from the product team of what user preference (or goal) the model is intended to capture? (e.g., "The user's true interest in video topics" or "The user's preferred meal choices for managing diabetes")
     - *Required evidence:* Product documentation (deck, spec) that states the intended preference.
     - *Sufficient answer:* Yes, with a clear and specific statement. If no, hard fail because without a target, we cannot evaluate the claim.

  **Step 2: Behavioral Proxy Alignment**
     - *Question:* Is the behavioral signal used as the reward (or training signal) directly and solely interpretable as the stated preference? (i.e., is the signal a direct manifestation of the stated preference without being influenced by other factors that could distort it?)
     - *Considerations:* 
          - If the behavioral signal is influenced by known confounders (e.g., effort, incentives, defaults, interface constraints), then it is not aligned.
          - Example: Using "click" as a proxy for "interest" when the interface heavily promotes certain items (position bias) is not aligned.
     - *Required evidence:* Interaction logs, model card (to see what signal was used), and an analysis of confounders (using logs and common sense).
     - *Sufficient answer:* 
          - Pass: The signal is a direct, undisputed measure of the stated preference (e.g., in a controlled environment). 
          - Fail: The signal is known to be heavily influenced by confounders (e.g., using "completion" when there's a strong default, or when the user is incentivized to complete). Then hard fail.
          - Insufficient: We don't know the influence of confounders. Then we need an experiment. *Cheapest experiment:* A/B test that manipulates the confounder (e.g., remove incentive, change default) and measures if the behavior changes. If we can't test, we may have to hand off (if the confounder is inherent) or fail.

  **Step 3: Counterfactual Validation (if Step 2 passes)**
     - *Question:* If we could ask the user about their preference in the exact context of the behavior, would the behavior match their stated preference? (We are looking for evidence that the behavior reflects the stated preference when measured at the same time and context.)
     - *Required evidence:* 
          - We look for direct comparisons between behavior and stated preference in the same context. This could come from:
              - Surveys that ask about recent actions (e.g., "Why did you watch that video?").
              - Logs of in-the-moment feedback (e.g., thumbs up/down) compared to the behavior.
          - If we have no such evidence, we look for studies (even external) that show the behavior is a reliable indicator of the stated preference in similar contexts.
     - *Sufficient answer:*
          - Pass: There is evidence that the behavior and stated preference align in the same context (e.g., high correlation between watch time and user rating of the video).
          - Fail: There is evidence of systematic divergence (e.g., users say they don't like the video but watched it anyway because it was autoplaying). Then hard fail.
          - Insufficient: No evidence. Then we need an experiment. *Cheapest experiment:* In-the-moment survey (e.g., after an interaction, ask "Did you want to do that?") for a sample of users.

  **Step 4: Feedback Loop Assessment**
     - *Question:* Does the system's current output (or past versions) significantly shape the behavior that is now used as training data? (i.e., is there a feedback loop that could entrench a particular behavior that is not aligned with the stated preference?)
     - *Required evidence:* 
          - Look at the training data: Is it collected entirely from the current system? Or from a prior version? If from a prior version that was not personalized, then no loop. If from the current system, then we have a loop.
          - Check if the system's recommendations/actions are known to influence user behavior in a way that might not reflect the stated preference (e.g., if the system shows only certain options, the user can only choose from those).
     - *Sufficient answer:*
          - Pass: The training data is from a system that did not shape the behavior in a way that could distort the stated preference (e.g., data from a random recommendation phase). 
          - Fail: The training data is generated by a system that already shapes behavior in a way that is known to conflict with the stated preference (e.g., the system promotes addictive patterns and then uses the addictive behavior as a signal). Then hard fail.
          - Insufficient: We don't know the impact of the loop. Then we need an experiment. *Cheapest experiment:* Run a short phase with a randomized policy (if feasible) and compare the behavior to the current system. If not feasible, we may have to hand off (because the risk of distortion is high and we can't measure it).

  **Step 5: Endorsement Check (if we passed Steps 2-4)**
     - *Question:* Is there evidence that the user endorses the learned preference? (i.e., when presented with the system's model of their preference, do they agree with it?)
     - *Why:* Even if the behavior is aligned and there's no feedback loop, the user might not identify with the inferred preference. This step checks for endorsement.
     - *Required evidence:* 
          - User testing where the system's inference is shown to the user for validation (e.g., "We think you like X because you did Y, is that correct?").
          - Onboarding or settings where the user can adjust the learned preferences.
     - *Sufficient answer:*
          - Pass: There is evidence of endorsement (e.g., high agreement in user tests, or users actively adjusting and not rejecting the learned preferences).
          - Fail: There is evidence of rejection (e.g., users say the learned preference is wrong). Then hard fail.
          - Insufficient: No evidence. Then we need an experiment. *Cheapest experiment:* User test with a sample of users to validate the learned preferences.

  **Step 6: Overall Claim Check**
     - *Question:* After Steps 1-5, we have either failed, passed, or have pending experiments. If we passed all steps, then the claim is supported. If any step failed, the claim is not supported. If we have insufficient evidence, we recommend the cheapest experiment from the first step that required it.

  **Handling non-factorial decisions:**
     - If at any step we encounter an issue that is not about factual evidence but about what the company owes users (e.g., even if the behavior is aligned, is it ethical to use it when we know the user wants to change that behavior?), then we hand off to a person (e.g., the VP) for a value judgment.

  **Now, run the procedure on the three examples:**

  **Example 1: Short-video feed**
