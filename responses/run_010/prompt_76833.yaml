answer: |-
  Below is a **step-by-step audit procedure** for evaluating the "preferential-fidelity claim" (PFC):  
  *"The system learns what each user wants from how that user actually behaves, so what it serves reflects user preference rather than our product team's guesses."*  

  The procedure uses **only your available evidence** (interaction logs, onboarding questionnaires, A/B tests, model cards, and one engineer for a day). It outputs one of four verdicts per step:  
  - ✅ **Clear** (claim supported)  
  - ❌ **Hard fail** (claim falsified)  
  - ⚠️ **Insufficient evidence** (suggests cheapest experiment)  
  - 🤝 **Hand off** (non-factual/ethical decision for leadership)  

  Each step includes:  
  1. **Question** to ask.  
  2. **Evidence** required.  
  3. **Sufficient answer** criteria.  
  4. **Verdict** with reasoning.  

  ---

  ### **Audit Procedure**  
  #### **Step 0: Setup**  
  - **Task:** Re-state the PFC from the product deck in one sentence.  
  - **Evidence:** Product deck.  
  - **Sufficient answer:** Exact wording of the claim (e.g., "Infers meal preferences from logging behavior").  
  - **Why?** Ensures the target is unambiguous. If unclear, ❌ Hard fail.  

  #### **Step 1: Preference-Behavior Gap Check**  
  - **Question:** Is there direct evidence that the *observed behavior* conflicts with the *stated preference* for a substantial user subset?  
  - **Evidence:** Surveys, onboarding questionnaires, or A/B tests comparing behavior to explicit user statements.  
  - **Sufficient answer:**  
    - ✅ Clear: No conflict found.  
    - ❌ Hard fail: Conflict exists (e.g., >20% of users disavow their behavior).  
    - ⚠️ Insufficient evidence: No data exists. *Cheapest experiment:* Embed a 1-question in-app survey (e.g., "Did you want to do this?") for 48 hours.  
  - **Why?** Behavior ≠ preference due to effort/friction/incentives. Do not assume "asking the user" resolves conflict—it surfaces it.  

  #### **Step 2: Reward Proxy Validation**  
  - **Question:** Is the behavioral signal used to train the model a *direct manifestation* of the claimed preference (e.g., "user wants X"), or could it be explained by a *confounder* (e.g., effort, incentives, UI friction)?  
  - **Evidence:** Model card (to identify the reward signal), interaction logs, incentive structures.  
  - **Sufficient answer:**  
    - ✅ Clear: Signal is immune to common confounders (e.g., clicks in a neutral UI with no defaults/incentives).  
    - ❌ Hard fail: Signal is corrupted by a known confounder (e.g., streaks/rebates make logs unreliable).  
    - ⚠️ Insufficient evidence: Confounder risk exists but unmeasured. *Cheapest experiment:* A/B test removing the confounder (e.g., disable streak counters for 5% of users).  
  - **Why?** Rewards inferred from behavior are only valid if the behavior purely reflects preference. Models learn whatever explains the data (e.g., "user responds to incentives," not "user likes salads").  

  #### **Step 3: Feedback Loop Risk Assessment**  
  - **Question:** Does the system *shape user behavior* in a way that could corrupt future training data (e.g., by restricting choices, amplifying addictive patterns, or reinforcing its own biases)?  
  - **Evidence:** Interaction logs showing system influence (e.g., recommendation dominance), A/B tests of past version changes.  
  - **Sufficient answer:**  
    - ✅ Clear: Data is collected in a "neutral" context (e.g., initial random recommendations).  
    - ❌ Hard fail: System demonstrably creates its own training data (e.g., autoplay drives watch time).  
    - ⚠️ Insufficient evidence: Loop risk exists but unproven. *Cheapest experiment:* Compare behavior from a "neutral" UI variant (e.g., shuffle recommendations) vs. current system.  
  - **Why?** Systems that manufacture their own training data create self-justifying loops (e.g., "users watch what we push, so we push more").  

  #### **Step 4: Counterfactual Consistency Test**  
  - **Question:** If the system *had not existed*, would the user’s behavior still imply the same preference?  
  - **Evidence:** A/B tests, historical data before system launch, or logical analysis of UI constraints.  
  - **Sufficient answer:**  
    - ✅ Clear: Behavior persists in a system-free context (e.g., via A/B test).  
    - ❌ Hard fail: Behavior is system-dependent (e.g., logging only occurs due to incentives).  
    - 🤝 Hand off: Unprovable. *Decision for leadership:* Does the company owe users a system that respects their "authentic" preference, even if unobservable?  
  - **Why?** Preferences must be intrinsic to users, not artifacts of the system. No amount of behavioral data solves this.  

  #### **Step 5: Reward Transform Invariance**  
  - **Question:** Could the model’s learned "preference" be a *transformed version* of the true preference (e.g., "avoids effort" vs. "wants efficiency") that leaves behavior unchanged?  
  - **Evidence:** Engineer review (1 day). Task: Check if the loss function pins down a unique preference, or if degenerate solutions exist (e.g., reward = 1/effort explains all behavior).  
  - **Sufficient answer:**  
    - ✅ Clear: Preference is uniquely identifiable (e.g., via inverse reinforcement learning with injective mapping).  
    - ❌ Hard fail: Model conflates preference with side effects (e.g., "user rewatches videos" could mean addiction or forgetfulness).  
    - 🤝 Hand off: Ambiguous. *Decision for leadership:* Is the transformed preference acceptable?  
  - **Why?** Reward functions are underdetermined—many models fit the same behavior but imply different preferences.  

  #### **Final Verdict Logic**  
  - ✅ **Clear** only if all steps are ✅ Clear.  
  - ❌ **Hard fail** if any step ❌ Fails.  
  - ⚠️ **Insufficient evidence** if any step ⚠️, and no ❌.  
  - 🤝 **Hand off** if any step 🤝.  

  ---

  ### **Audit of Three Submissions**  
  #### **1. Short-Video Feed**  
  - **PFC:** "Learns user video preferences from watch time and replays."  
  - **Evidence:** Watch time ↑11%, survey shows 42% of users want to watch less, "take a break" interstitials (80% dismiss rate).  

  | Step | Question | Analysis | Verdict |  
  |------|----------|----------|---------|  
  | 0 | PFC stated? | "Infers preference from watch time/replays." | ✅ Clear |  
  | 1 | Preference-behavior gap? | 42% disavow behavior (watch more than they want). | ❌ **Hard fail** |  
  | *Stop* | | *Failure at Step 1* | |  

  **Verdict:** ❌ Hard fail. The gap between behavior (high watch time) and stated preference ("want to watch less") falsifies PFC.  

  ---  

  #### **2. Diabetes Grocery Pre-Ordering**  
  - **PFC:** "Learns meal preferences from logged food."  
  - **Evidence:** Log completion = 92%, streak counter + insurer rebate, no preference-behavior surveys.  

  | Step | Question | Analysis | Verdict |  
  |------|----------|----------|---------|  
  | 0 | PFC stated? | "Infers meal preferences from logs." | ✅ Clear |  
  | 1 | Preference-behavior gap? | No survey data. | ⚠️ Insufficient evidence |  
  | 2 | Reward proxy valid? | Logging driven by streaks/rebates (confounder). | ❌ **Hard fail** |  
  | *Stop* | | *Failure at Step 2* | |  

  **Verdict:** ❌ Hard fail. Logging behavior is explained by incentives, not meal preferences.  

  ---  

  #### **3. Workplace Focus Tool**  
  - **PFC:** "Learns user focus preferences from onboarding config and override behavior."  
  - **Evidence:** Configured at onboarding, slow override with justification.  

  | Step | Question | Analysis | Verdict |  
  |------|----------|----------|---------|  
  | 0 | PFC stated? | "Reflects user focus preferences." | ✅ Clear |  
  | 1 | Preference-behavior gap? | Overrides require justification (low friction). | ✅ Clear |  
  | 2 | Reward proxy valid? | Onboarding config is stated preference. Overrides are rare (<5%) and high-effort, so likely reflect true needs. | ✅ Clear |  
  | 3 | Feedback loop? | System doesn’t learn from overrides (static config), so no loop. | ✅ Clear |  
  | 4 | Counterfactual consistency? | Without the tool, users might browse distractedly. | 🤝 Hand off |  
  | 5 | Reward transform? | Model is rules-based (no ML), so no transform risk. | ✅ Clear |  

  **Final verdict:** 🤝 Hand off. Step 4 requires ethical judgment: *Does the company owe users a tool that enforces their past stated preference, even if it contradicts their present behavior?*  

  **Embarrassment audit:**  
  - ✅ Video feed: Correctly failed (you blocked it twice).  
  - ✅ Diabetes app: Correctly failed (confounder risk).  
  - ❌ Focus tool: **Fails your personal preference**. Step 4 reveals a flaw: The system assumes onboarding preferences are "truer" than real-time override behavior. Leadership must decide if this is acceptable.  

  ---

  ### **Audit of the Audit Procedure**  
  #### **Weaknesses**  
  1. **Judgment calls disguised as procedure:**  
     - Step 1 (gap threshold) and Step 2 (confounder severity) rely on arbitrary thresholds (e.g., ">20% conflict").  
     - Mitigation: Default to ❌ Hard fail if any conflict exists, avoiding debates.  

  2. **False clears:**  
     - ✅ Clear verdicts can be false if:  
       - Stated preferences are coerced (e.g., onboarding questions are leading).  
       - Feedback loops exist but are undetected in logs.  
     - Mitigation: Engineer review in Step 3 to simulate loop effects.  

  3. **Unsettleable questions:**  
     - Step 4 (counterfactuals) is *always* unprovable—no behavioral data can show what users would do without the system.  
     - Step 5 (reward transforms) requires engineer judgment; degenerate solutions may be missed.  

  4. **Philosophical presuppositions:**  
     - Assumes preferences are stable, inferable, and separable from behavior. A skeptic (e.g., behaviorist) would reject this, arguing "preference" is just a label for observed behavior. The audit cannot resolve this.  

  #### **Recommendations**  
  - For unsettleable questions (Step 4/5), default to 🤝 Hand off.  
  - Add a final step: "Even if cleared, could a reasonable user feel manipulated?" 🤝 Hand off.  
  - Track audit outcomes to refine thresholds (e.g., if 80% of ❌ fails come from Step 2, tighten confounder checks).  

  This procedure forces systematic thinking, reduces intuition battles, and flags ethical trade-offs—but cannot eliminate all ambiguity. Use it to scaffold (not replace) debate.
