     - Confounders: 
          - Logging is reinforced by a streak counter and tied to an insurer rebate. This may cause users to log even when they wouldn't otherwise, or to log inaccurately (e.g., log a healthy meal but eat something else) to keep the streak.
          - The incentive may cause users to log meals they think will get them the rebate (even if not their actual meal) or to log more often than they naturally would.
     - Evidence: Log completion is very high, but that might be due to the incentive. We don't have direct evidence of misalignment.
