  *Step 3: Counterfactual Validation* (if Step 2 passed, but it didn't) - so we skip and go to Step 6.

  *Step 6:* We have insufficient evidence at Step 2. We recommend the experiment: test without the incentive to see if logging behavior changes (and if the meals logged are different). If we cannot run that, we might need to hand off because the incentive is fundamental to the design.

  *Procedure output for Example 2: Insufficient evidence. Cheapest experiment: Compare logging behavior with and without the rebate (or with reduced rebate) to see if the incentive changes what or how often they log. If the data changes significantly without the incentive, then the signal is distorted.*

