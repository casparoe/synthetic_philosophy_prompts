     - We assume the deck says: "We learn the user's true interest in video topics." So pass.

  *Step 2: Behavioral Proxy Alignment*
     - Signal: completion and immediate replay.
     - Known confounders: 
          - Autoplay and infinite scroll may drive completion without interest.
          - The "take a break" interstitial is easily dismissed, so it doesn't counteract the addictive design.
          - The quarterly survey shows many users say they want to watch less. This suggests that the behavior (watching) is not aligned with their reflective preference.
     - Evidence: Survey shows conflict. Also, the design (autoplay) is known to drive viewing beyond user intent.
     - *Verdict:* Fail (hard fail) because the signal is not a direct measure of true interest due to confounders (addictive design).

  *Procedure output for Example 1: Hard fail.* (We stop at Step 2.)

  **Example 2: Diabetes-management app**
  - Claim: The system learns the user's meal preferences from what they log.
  - Stated preference: The user's preferred meal choices for managing diabetes.

  *Step 1: Explicit Preference Statement*
     - We assume the deck states: "We learn the user's preferred meal choices." Pass.

  *Step 2: Behavioral Proxy Alignment*
