prompt: |-
  I have a fifty-minute section with second-years in a rational choice course. They've had two weeks of expected utility theory — completeness, transitivity, independence — worked through with decision trees, and every one of them has read something mentioning Kahneman, so they will arrive expecting a "humans are irrational" story. I want to teach the Allais paradox, and I want them to leave with close to the opposite: that independence is the sure-thing principle wearing mathematical clothes, and that what's actually contested is what an axiom is supposed to be — a constraint on coherent preference, or an empirical generalization that a show of hands can refute. Plan the section for me; don't deliver it.

  Specifically: the order the pieces must go in and what depends on what — in particular, whether the common-consequence decomposition of the two pairs comes before or after I collect their choices, given that showing it first kills the hook and showing it second leaves half the room unable to retract what they just picked. Which figures to use: the textbook million against five million, Allais's own hundred million francs against five hundred, which will sound like a joke, or a scaled-down ten-dollar version; what the carrying example has to have for the reversal to bite, and what it must lack. The misconceptions in the order they'll surface — that it's just risk aversion over huge sums, that probability weighting already dissolved it, that you can always bend the utility function to fit any choice, that independence is a technical convenience with no normative force — and the exact point in the sequence to head each off. One closing question that would tell me whether they can now spot an Allais-style violation in a pair they've never seen. And what I should openly refuse to cover at this level.
reasoning: |-
  Okay, the user is teaching a rational choice course to second-years and wants to structure a fifty-minute section on the Allais paradox. They’ve covered expected utility theory basics like completeness, transitivity, and independence using decision trees. The students are familiar with Kahneman and likely expect a "humans are irrational" narrative. The goal is to flip that perspective, emphasizing that independence is tied to the sure-thing principle and that axioms are about normative coherence, not empirical generalizations. 

  First, I need to consider the sequence of activities. The user is concerned about when to present the common-consequence decomposition. If shown first, it ruins the surprise; if later, students might feel committed to inconsistent choices. The solution is to collect choices before revealing the decomposition. This creates cognitive dissonance when their preferences violate independence, making the normative discussion more impactful. 

  Next, choosing the right monetary figures is crucial. Textbook examples (e.g., $1M vs. $5M) might feel abstract, while scaled-down versions (like $10) could lack emotional weight. Allais’ original francs sound outdated. A $100k scale feels relatable without being life-changing. The key is to ensure the safe option in Pair 1 (e.g., $100k for sure) is tempting enough to violate expected utility when contrasted with Pair 2’s choices. 

  For misconceptions, the user lists several: risk aversion over large sums, probability weighting, flexible utility functions, and independence as merely technical. Each needs preemptive addressing. For example, varying the stakes in the carrying example (e.g., textbooks vs. laptops) shows the reversal isn’t about magnitude. Highlighting the common consequence—identical outcomes in both pairs—undercuts probability weighting arguments. 

  The closing question should test if students can spot Allais-style violations in new pairs. A modified example with consistent probabilities but varying certainties would work, like a medical decision with guaranteed vs. probabilistic outcomes. 

  Finally, the user wants to explicitly exclude neuroeconomics or cumulative prospect theory, keeping focus on normative vs. empirical interpretations of axioms. This avoids scope creep and reinforces the core debate. 

  The overall arc should move from empirical engagement (students’ choices) to normative reasoning (decomposition), then philosophical reflection. Timing is tight—each phase must be brisk, with clear transitions to fit fifty minutes.
answer: |-
  Here's a 50-minute plan designed to flip the script, emphasizing the normative force of independence and the nature of axioms, while strategically handling the paradox reveal and misconceptions:

  **Core Structure: Hook -> Reveal Inconsistency -> Decompose -> Reinterpret Axioms**

  **Time Allocation & Key Pieces:**
  1.  **Hook & Choice (10 mins):**
      *   **Figure:** **$100,000 scale.** ($100k vs $500k). Large enough to feel significant (unlike $10), avoids "fabulous wealth" dismissal of Allais's francs/millions. Use clear percentages.
      *   **Pair 1 (Certainty Effect Bait):**
          *   A: $100,000 **for sure**.
          *   B: 10% chance of $500,000, 89% chance of $100,000, 1% chance of $0.
      *   **Pair 2 (Common Consequence Hidden):**
          *   C: 11% chance of $100,000, 89% chance of $0.
          *   D: 10% chance of $500,000, 90% chance of $0.
      *   **Activity:** *Show Pair 1. Ask for show of hands: A vs B. Record counts visibly.* Then *show Pair 2. Ask for show of hands: C vs D. Record counts visibly.* Expect majority A > B and D > C. *Crucially, do NOT comment on consistency yet.* Just record. "Interesting spread, noted."

  2.  **The "Problem" & Sure-Thing Principle (STP) Intuition (10 mins):**
      *   "Before we analyze your choices, let's recall a bedrock principle of *coherent* decision-making under uncertainty: Savage's **Sure-Thing Principle (STP)**." State it clearly: *"If two acts yield the same consequence for all states of the world in some event E, then your preference between them should depend only on the consequences in the complement of E (not-E). What happens in E is irrelevant; it's a 'sure thing' either way."*
      *   **Carrying Example (Key Setup):**
          *   *Scenario 1:* "Do you carry your expensive laptop to class on a sunny day?" (Assume most say No - risk of damage/forgetting outweighs low-probability need).
          *   *Scenario 2:* "A huge storm is guaranteed tonight. *Now* do you carry your laptop home?" (Assumption: More likely Yes - need is now certain/high prob, risk of damage is same or slightly higher).
          *   **Why it Bites:** The "sunny day" outcome (no need, no damage) is the *same* whether you carried or not (the "sure thing" in sunny states). STP says your preference (carry/don't carry) should only depend on the storm states. If you switch from "Don't Carry" (Sunny) to "Carry" (Storm), that's *rational* because the relevant outcomes *in the storm states* changed significantly (high need vs low need). The reversal is driven by a change in the *consequence that matters* (storm need), not the irrelevant sunny outcome. **Contrast this with Allais!** *"Hold this STP example in mind. We'll come back."*

  3.  **Decomposing Allais & Revealing the Violation (15 mins):**
      *   "Now, let's look back at your choices. Many rational people choose A over B and D over C. Let's see what EU theory, specifically the Independence Axiom (which *embodies* the STP), says about this."
      *   **Visually Decompose Pair 1 & Pair 2 using a Decision Tree/Table:**
          *   Highlight the **89% Common Consequence** in Pair 1 (B: $100k w/ 89% vs A: $100k w/ 89%? Not exactly... reframe).
          *   **Crucial Reframing:** Re-write the lotteries focusing on the 11% event where they differ:
              *   A: If 11% Event (1% $0? Wait... focus on the *difference* point). Better: *Define the event "Not the 89%" (an 11% event).*
              *   In the 89% (common) event: All options yield $100k? No. Fix this.
          *   **Standard Decomposition:**
              *   Imagine an initial 89% chance of $100k. If this happens, both A and B give you $100k. *Irrelevant by STP!*
              *   Now focus on the *remaining 11%* (where outcomes differ):
                  *   A (in 11%): Guaranteed $100k.
                  *   B (in 11%): (10/11) Chance of $500k, (1/11) Chance of $0. ≈ 90.9% $500k, 9.1% $0.
          *   **Pair 2 Decomposition:**
              *   C (in 11%): Guaranteed $100k. *Same as A in the 11% event!*
              *   D (in 11%): (10/11) Chance of $500k, (1/11) Chance of $0. ≈ 90.9% $500k, 9.1% $0. *Same as B in the 11% event!*
          *   **The Hammer:** "STP/Independence demands that your choice in Pair 1 (A vs B) *only depends on your preference within this 11% event*. Your choice in Pair 2 (C vs D) *is also only about this exact same 11% event*. A vs B in 11% is *identical* to C vs D. Therefore, coherent preference requires A > B *if and only if* C > D. Choosing A>B *and* D>C directly violates Independence/STP." Point back to the recorded votes showing this pattern. *"This is the Allais Paradox: a common, intuitive pattern violating a core axiom of EU."*

  4.  **Confronting Misconceptions & Normative Force (10 mins):** (Address as they arise or preemptively)
      *   **"It's just risk aversion over big sums!"**: *"Did the decomposition depend on the dollar amounts? No. It depended solely on the probability structure and the axiom. Changing the stakes might change *whether* people exhibit the paradox, but it doesn't change the *logical inconsistency* for those who do when faced with this structure. The STP violation is structural."* (Refer back to Carrying: reversal was justified by changed *relevant* outcomes, not stakes).
      *   **"Probability weighting (like Prospect Theory) explains it!"**: *"Absolutely! But Kahneman-Tversky proposed PT *because* they saw EU failing descriptively here. Our point today is normative: Does choosing A and D feel coherent *upon reflection*, given the STP argument? PT accepts the violation as 'rational' descriptively; EU rejects it as normatively incoherent. Which view of an axiom do you find compelling?"*
      *   **"You can just bend the utility function!"**: *"Try it. Assume U($0)=0. Choosing A>B implies U(100k) > 0.10*U(500k) + 0.89*U(100k) + 0.01*U(0) => Simplify: 0.11*U(100k) > 0.10*U(500k). Choosing D>C implies 0.10*U(500k) > 0.11*U(100k). You can't satisfy both inequalities simultaneously with *any* U(·). It's a direct contradiction, not a utility shape issue."*
      *   **"Independence is just a technical convenience!"**: *"The decomposition shows it's the mathematical embodiment of the Sure-Thing Principle. Is ignoring irrelevant alternatives (the common 89%) just 'technical'? Or is it fundamental to separating decisions logically? Should your preference between two options hinge on an outcome that's the same no matter what you choose?"* (Link strongly back to Carrying Ex: Rational reversal justified by *relevant* change).

  5.  **Reframing the Takeaway & Closing (5 mins):**
      *   "So, is this 'irrationality'? Kahneman might say 'yes, descriptively'. Savage (EU) says 'yes, normatively - you *should* feel uncomfortable and revise'. The deeper lesson: **What is an axiom?**"
      *   **The Core Tension:** "Is it:
          1.  A *normative constraint* on coherent preference (like logic: violating transitivity *is* incoherent)? (EU View)
          2.  An *empirical generalization* about choices, refuted by a show of hands? (Descriptive/Behavioral View)"
      *   **Allais's Challenge:** "Allais himself saw this not as human irrationality, but as evidence that EU's *axioms* (specifically Independence) were *normatively* flawed. He argued the certainty effect is rational! The debate isn't settled. What do *you* think: Is violating STP/Independence in the Allais setup like intransitivity (fundamentally incoherent)? Or is it a rationally justifiable preference (making the axiom normatively invalid)?"
      *   **Closing Diagnostic Question:** "Imagine a new pair:
          *   E: 70% chance of $50, 30% chance of $0.
          *   F: 100% chance of $30.
          Most people choose F > E. Now consider:
          *   G: 70% chance of $50, 30% chance of **$100**.
          *   H: 100% chance of **$30**.
          If someone now chooses G > H, could this *potentially* violate Independence/STP? Why/Why not?" *(Answer: Yes! Similar structure - common consequence (30% $100 vs 30% $0) is ignored in the first choice (where $100/$0 is the difference) but becomes critical in the second. The reversal between F>E and G>H mirrors Allais if the common consequence drives the switch.)*

  **What to Openly Refuse to Cover:**
  *   *"We won't dive into alternative models like Prospect Theory today – that's next week! We're focusing on EU's internal logic and the philosophical question about axioms."*
  *   *"We won't resolve the normative debate definitively – that's for philosophers and you over your careers! We're exposing the tension."*
  *   *"We're skipping neuroeconomics or specific empirical frequencies – we care about the structural logic."*

  **Why this sequence works:**
  1.  **Hook First:** Captures attention with real choices, creating cognitive dissonance when the inconsistency is revealed later.
  2.  **STP Before Decomposition:** Provides an intuitive, normative foundation (the carrying example) *before* the math, making Independence feel less arbitrary.
  3.  **Decomposition After Choices:** Forces confrontation with the inconsistency. Showing it first would make the choices feel like a pointless trick.
  4.  **Misconceptions Addressed Contextually:** Tackles them when they become relevant (after decomposition), using the structure of the paradox itself as evidence.
  5.  **Focus on Axiom Status:** The Carrying Example provides a clear contrast case where a reversal *is* justified, highlighting why the Allais reversal *isn't* under STP, centering the debate on the normative validity of the axiom itself.
  6.  **Diagnostic Question:** Tests understanding of the *structure* of the violation, not just recognition of the original paradox.

  This plan aims to leave them questioning the simplistic "irrational humans" narrative and pondering the deeper foundations of rational choice theory. Good luck!
