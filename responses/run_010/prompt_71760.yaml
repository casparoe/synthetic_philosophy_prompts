prompt: |-
  Been chewing on the side-effect effect (chairman/profit/environment vignettes) on and off for years and I finally have a hunch I want to turn into an actual project. I'm pitching it to a small independent-research fund — think three months, modest stipend, they like things that could come back false. Two pages max.

  The hunch: nearly every account of the harm/help asymmetry — blame, pragmatic implicature, the deep-self view, the trade-off idea — treats it as a fact about moral cognition specifically. But maybe it's a much duller fact about information. A single datapoint where an agent accepts a bad side effect to get what they want should move your posterior over their utility function a lot more than a single datapoint where they accept a good side effect, because producing good outcomes is closer to base rate and so carries less news. On this picture, asking whether he did it intentionally is asking how hard to update about what this agent is like, in something like the intentional-stance sense, and the asymetry just falls out of differential informativeness. The prediction I think is distinctive: the effect should shrink and maybe reverse when the helpful side effect is made rare or unexpected within the vignette world, with praiseworthiness held fixed.

  Write the proposal. I need:

  - the question stated precisely enough that a reviewer could tell me I'm wrong rather than just uninterested;
  - what the existing accounts actually commit to, and where mine makes different predictions — plus an honest verdict on the worry I have, which is that this is just the deep-self view (or the counterfactual-control view) wearing a Bayes costume. If it is, say so, and say what would have to be added to make it a genuine competitor;
  - method: what I'd actually do in three months part-time with maybe 400 online participants total and no exotic IRB approvals — which vignette knobs to turn (base rates, prior expectations about the chairman, how the good outcome is framed, order of presentation), and what the minimal design is that can actually separate the accounts rather than just replicate the effect for the fifth time;
  - what a successful result looks like, and what counts as the project failing as opposed to merely being inconclusive;
  - the one or two ways this most likely goes wrong, and whether any of them is fatal.

  No bibliography, I'll bolt the references on myself, and please don't invent studies, sample-size justifications, or effect sizes — where a number is unknown just say the pilot should determine it. Assume the reading panel is one philosopher and one statistician, so it needs to survive both of them.
