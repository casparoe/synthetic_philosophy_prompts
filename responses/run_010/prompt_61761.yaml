prompt: |-
  I head the Classifications and Definitions unit at a national statistical agency. Roughly fifty times a year a term in one of our official classifications comes into dispute — whether a person counts as unemployed, whether a settlement counts as rural, whether a death counts as a stillbirth or a miscarriage, whether a worker counts as employed in the informal sector — and my unit has to produce a recommendation that goes to a standing committee of statisticians, lawyers, and ministry officials, who either sign off or send it back. The recommendations are consequential: they set programme eligibility, they get incorporated by reference into legislation, and once published they define a time series that analysts and the press will treat as continuous for decades. My case officers are able but have no training in philosophy of language, we typically have a day or two per case, and the deliverable has to be a form someone can fill in rather than an essay. The pressure on the unit currently runs from both directions at once. From outside, we are accused of moving definitions to make the numbers look better; a columnist wrote last month that our unemployment rate is simply whatever we decide it is. From inside, a senior analyst who read a précis of Quine's "Two Dogmas of Empiricism" has begun arguing the mirror image of that charge: since the analytic–synthetic distinction does not survive scrutiny, there is no fact of the matter about what our terms mean, every definitional choice is a free pragmatic decision, and the outside criticism is therefore confused rather than substantive. Both positions are doing damage in our meetings. I am fairly confident neither is correct, but I cannot articulate the middle position, and "it's complicated" is not a usable answer in a committee paper.

  Please write that middle position as a decision procedure my officers can actually run on a disputed term. I want the questions in order, what counts as a sufficient answer to each, what sort of evidence is admissible at each stage, and where the procedure terminates — in one of three outcomes: the term is to be settled by stipulation and published explicitly as a stipulation; the term is to be settled by investigation, because something about the world bears on the choice; or the procedure cannot settle it and the case is escalated to the committee as a question of purpose, values, or who bears the costs. Ground it in what Quine's argument actually establishes and in whatever has survived it. My understanding is that his conclusion was that the boundary is not sharp rather than that there is nothing worth marking, and that there are later attempts to salvage a workable notion — I have been told one turns on separating the idea of a sentence's being true in virtue of meaning from the idea of its being justifiable merely in virtue of understanding that meaning, and that another line of reply points to the way disagreement persists across an entire family of related belief pairs. Use what is usable, discard what is not, and tell me plainly which philosophical distinctions you are preserving, which you are dropping as no help to a non-specialist, and at which steps the procedure is a judgment call wearing the costume of a rule. Give me the small working vocabulary the procedure needs — my officers should not have to use the word "analytic" correctly in order to apply it — and a section on failure modes: what kind of case the procedure will systematically get wrong, in which direction, and how I would detect that it has.

  Then run it on three cases we are actually carrying. First, a proposal to widen our count of the unemployed to include people who have stopped looking for work but who tell interviewers they want a job and would start one; our series has excluded them for forty years, and my instinct is to reject the proposal as tampering with comparability, so if the procedure reaches a different verdict I need to be shown exactly which step produces it and what weight comparability is allowed to carry against it. Second, a ministry that has asked us to identify the scientifically correct gestational-age threshold separating miscarriage from stillbirth, noting helpfully that neighbouring jurisdictions use different ones; I need the procedure to say plainly, in language a minister will accept, that the request as framed contains a mistake, while also refusing the conclusion that any threshold is as good as any other and specifying what would make one better than another for a stated purpose. Third, a standing argument between two regional offices over whether a particular kind of peri-urban settlement counts as rural, where I suspect but cannot demonstrate that the two offices agree on every fact about the settlements in question and are only attaching different labels to them; if there is a cheap diagnostic for that suspicion — some way of substituting the disputed term out and seeing whether the disagreement survives — build it in as a stage and apply it. Finally, tell me what the procedure cannot do for me: what it looks like when it produces a properly completed form and a bad recommendation, and why a clean run through the stages should not be treated as evidence that the recommendation will survive the committee.
reasoning: |-
  We are designing a decision procedure for disputed terms in classifications. The procedure must navigate between two false extremes: that definitions are arbitrary (no fact of the matter) and that they are fixed by the world alone (no role for convention). The procedure should have three outcomes: stipulation, investigation, or escalation.

  Key ideas from Quine and responses:
  - Quine attacks the analytic-synthetic distinction: there is no sharp boundary between sentences true by meaning and those true by fact. However, he does not deny that meaning and fact both play roles; rather, they are intertwined in the "web of belief".
  - Later responses: 
    (a) Distinguish between a sentence being true in virtue of meaning (which Quine rejects) and being justifiable merely by understanding meaning (which might be salvageable as a pragmatic notion). 
    (b) Focus on the holistic nature of meaning: disagreement about a term might involve a whole set of beliefs, and we can look for agreement on other related beliefs to isolate the point of dispute.

  We design a procedure that uses the following concepts without requiring philosophical jargon:

  Procedure Vocabulary (plain terms):
  1. Core meaning: The minimal understanding shared by competent users of the term that allows them to agree on clear cases. (This avoids the word "analytic".)
  2. Empirical basis: The aspects of the term that are tied to observable features of the world.
  3. Purpose: The function the classification serves in the specific context (e.g., policy, research, comparability).
  4. Cost of change: The impact on time series, legal references, and program eligibility if the definition is altered.
  5. Disagreement pattern: Whether the dispute persists when we replace the term with a detailed description of the facts (to see if it's merely verbal).

  Decision Procedure Steps:

  Step 1: Identify the core meaning.
     - Question: What are the minimal criteria that everyone using this term in our context agrees must be met? (E.g., for "unemployed": not working, available for work, seeking work? Or at least two of these?)
     - Evidence: Standard definitions in our classification, dictionary definitions, expert consensus, and clear cases where the term is applied without dispute.
     - Sufficient answer: A list of criteria that are non-negotiable for the term. If we cannot find any such criteria, then the term is too vague and we escalate (outcome: escalation).
     - If there is disagreement even on the core meaning, note the areas of disagreement and move to Step 2.

  Step 2: Check if the dispute is about the core meaning or about borderline cases.
     - Question: Do the parties agree on the core meaning but disagree on whether it applies in a particular case? Or do they disagree about what the core meaning is?
     - Evidence: Present clear cases and see if they are accepted. Then present the disputed case and ask why it is disputed.
     - If the dispute is about the core meaning (i.e., they disagree on the necessary criteria), then we must either:
          a) Investigate if there is an empirical basis for the core meaning? (Go to Step 3) OR
          b) If no empirical basis, then it's a matter of stipulation (but note: core meaning might be conventional).
     - If the dispute is about a borderline case (everyone agrees on the core meaning but this case is unclear), then go to Step 3.

  Step 3: Investigate the empirical basis.
     - Question: Are there observable features of the world that bear on the application of the term? 
     - Evidence: Scientific studies, data, observable characteristics. Also, consider if the term is tied to a natural kind or a social/legal construct.
     - How to judge: 
          - If the term is defined by law (e.g., "stillbirth" might have a legal definition), then the empirical basis is the legal text. But note: we might be creating a statistical definition that may align with legal ones for specific purposes.
          - If the term is about a natural phenomenon (e.g., gestational age for stillbirth), then there might be scientific evidence about when a fetus is viable, but note that the threshold is also a matter of convention for recording purposes.
     - Sufficient answer: If there is a strong empirical basis (e.g., a clear biological distinction at a particular gestational age that affects outcomes) then we can use that. But if the evidence shows a continuum, then we must choose a threshold based on purpose and cost of change (Step 4). 
     - If there is no empirical basis (e.g., the term is purely conventional, like the threshold for "rural" population density), then we move to Step 4.

  Step 4: Consider the purpose and cost of change.
     - Question: What is the primary purpose of this classification? What are the consequences of changing the definition?
     - Evidence: The history of the classification, the uses of the data (e.g., for program eligibility, for research trends), and the cost of breaking time series or creating inconsistencies with other laws or classifications.
     - Also, consider: Are there multiple purposes that conflict? Then we may need to prioritize.
     - Outcome: 
          a) If the purpose and cost of change strongly favor one definition (e.g., maintaining comparability over decades is paramount), then we stipulate the definition accordingly (outcome: stipulation).
          b) If the purpose requires alignment with an external standard (e.g., international standards for stillbirth) even if it changes, then we might stipulate that alignment (but note the cost of change must be weighed). 
          c) If the purpose is unclear or conflicts are irreconcilable, then escalate (outcome: escalation).

  Step 5: Check for merely verbal disagreement (especially for the rural/urban case).
     - This step can be done at any time when we suspect that the parties agree on the facts but not on the label.
     - Question: If we replace the term with a detailed description of the facts (without using the disputed term), does the disagreement disappear?
     - Evidence: Ask the parties: "If I describe this settlement as having [list of characteristics: population density, distance from urban center, primary economic activity, etc.], do you both agree on that description? Then, would you still disagree on whether to call it rural or urban?" 
     - If they agree on the description but disagree on the label, then the dispute is about the definition (convention) and we must choose a convention (stipulation) based on purpose and cost of change (Step 4). 
     - If they disagree on the description, then we have a factual dispute (investigation).

  Termination:
  - After Step 4, we should have enough to decide between stipulation and investigation. But note: investigation might reveal that the issue is not purely empirical and we still have to set a threshold (so then stipulation). The key is to avoid the idea that the world alone forces a particular definition when it doesn't.

  Three outcomes:
  1. Stipulation: The term is defined by convention. We will set the definition explicitly, and publish it as such. This is appropriate when the core meaning is underdetermined by the world, and we must choose for purposes of consistency, comparability, or to align with a specific purpose.
  2. Investigation: There is an empirical fact of the matter that we must discover (e.g., because the term is tied to a natural kind or a legal definition that we are bound to follow). We then conduct research to find the fact.
  3. Escalation: The dispute involves conflicting values, multiple purposes that cannot be prioritized, or the core meaning is too fragmented. The committee must decide based on non-statistical considerations (e.g., political, ethical, or resource allocation).

  Failure Modes:
  - The procedure might overemphasize stipulation when there is a strong empirical basis (e.g., in the stillbirth case, if we ignore medical evidence). To detect: at Step 3, if we find robust scientific consensus, we must not override it without strong purpose-based reasons.
  - It might overemphasize investigation when the issue is really about convention (e.g., trying to find a "scientific" threshold for rural). This is detected by Step 3 showing a continuum and no natural break.
  - It might underweight the cost of change (e.g., in the unemployment case, changing the series might break comparability even if the new definition is better). We must explicitly weigh cost of change at Step 4.

  Now, run the procedure on the three cases:

  Case 1: Unemployed count - including discouraged workers (stopped looking but want a job and would start).

  Step 1: Core meaning of "unemployed". 
     - ILO definition: without work, currently available for work, and seeking work. Our current definition follows this. The core meaning includes "seeking work". 
     - The proposal wants to remove "seeking work" for a subset (discouraged workers). 
     - So, the dispute is about the core meaning? Actually, no. The proposal is to create a broader measure (often called U-6 in the US) while maintaining the standard one. But if we are changing the official series, then it is about the core meaning for our official unemployment rate.

  Step 2: It's about the core meaning? Yes, because we are considering altering one criterion (seeking work). But note: the core meaning we have been using includes seeking work. So we are considering changing the core meaning? Or creating an alternative measure? The request is to change the official series.

  Step 3: Empirical basis? 
     - The term "unemployment" is a social construct for measuring labor underutilization. There is no natural kind. The ILO definition is a convention. 
     - However, there is empirical research on discouraged workers: they are a real phenomenon. But including them or not is a matter of convention.

  Step 4: Purpose and cost of change.
     - Purpose: Our unemployment rate is used for international comparability (ILO standard) and for historical comparability (40 years). Changing it would break the time series and make international comparisons harder. 
     - However, there is a purpose for having a broader measure: it might better capture labor market slack. 
     - But note: we can produce both measures (as many countries do). 
     - The cost of changing the official series is high: it would require reprocessing decades of data and might confuse users. 
     - Therefore, we recommend: do not change the official series. Instead, create a supplementary measure that includes discouraged workers. This way, we maintain comparability and also provide more information.

  Outcome: Stipulation. We stipulate that the official unemployment rate continues to require active job search. We also stipulate a new supplemental measure. (Note: This is a dual outcome. But the question was about the official series.)

  Case 2: Gestational-age threshold for stillbirth.

  Step 1: Core meaning? 
     - Stillbirth: the birth of a fetus that shows no signs of life at birth, after a certain gestational age. 
     - The core meaning includes: no signs of life, and a minimum gestational age (which varies).

  Step 2: Dispute? The dispute is about the threshold (borderline case for the gestational age criterion). 

  Step 3: Empirical basis?
     - There is a biological continuum. Fetal viability is not at a precise week. Medical evidence shows that survival rates increase with gestational age, but there is no sharp cutoff. 
     - The World Health Organization (WHO) recommends 22 weeks (or 500g) for international comparison, but some countries use 20, 24, or 28 weeks. 
     - Therefore, the threshold is not dictated by nature; it is a convention for recording and comparison.

  Step 4: Purpose and cost of change?
     - Purpose: To have a standard for vital statistics that allows for international comparison and for monitoring trends. 
     - Also, the threshold might affect health policy (e.g., when to provide intensive care). 
     - The ministry asked for the "scientifically correct" threshold, but we have found that there isn't one. 
     - So we must choose a convention. The cost of changing our threshold would break our time series. However, if we are out of step with international standards, it might hinder comparison. 
     - We should align with the WHO standard (22 weeks or 500g) for international comparability, unless there is a strong reason to keep the current one (e.g., if our health system is built around a different threshold). 

  Outcome: Stipulation. We explain that the threshold is a convention, and we choose the one that best serves the purpose of international comparability. We do not claim it is scientifically correct, but we do claim it is the standard for statistical reporting.

  How to tell the minister: "There is no single scientifically correct threshold because fetal development is a continuum. However, for the purpose of consistent statistical reporting and international comparison, we follow the WHO recommendation of 22 weeks. This allows our data to be compared with that of other countries. Changing our threshold would break our historical series, so we must weigh the benefits of alignment against the cost of discontinuity. Given the importance of international comparability, we recommend aligning with WHO, but we must also note that our health system uses [current threshold] for clinical purposes. Therefore, we may need to produce two sets of data: one for international reporting and one for domestic clinical analysis."

  Case 3: Peri-urban settlement as rural or urban.

  Step 5: Check for verbal disagreement.
     - Ask both regional offices to describe the settlement: population density, primary economic activities, commuting patterns, infrastructure, etc. 
     - Suppose they agree on all these facts. Then ask: "Given this description, is it rural or urban?" If they disagree, then the dispute is about the definition of rural/urban.

  Now run the full procedure:

  Step 1: Core meaning of rural? 
     - Our classification: based on population size and density, and/or administrative boundaries. 
     - The core meaning might include: low population density, agricultural economy, etc.

  Step 2: Dispute? If the peri-urban settlement has mixed characteristics (e.g., high density but adjacent to farmland), then it's a borderline case.

  Step 3: Empirical basis? 
     - Rural/urban is a social construct. There is no natural boundary. We might use a population density threshold, but that threshold is arbitrary. 

  Step 4: Purpose and cost of change?
     - Purpose: The classification is used for allocating resources, planning infrastructure, and research. 
     - The cost of changing the classification for one settlement is low, but we must maintain consistency across all settlements. 
     - We must choose a threshold that best serves the purpose (e.g., if the purpose is to identify areas needing agricultural support, then we might focus on economic activity; if it's for infrastructure, then population density). 
     - We should look at our existing definition and see if the settlement clearly falls on one side. If not, we might need to refine the definition.

  But we already did Step 5: we found that the offices agree on the facts and disagree only on the label. Therefore, we must stipulate.

  Outcome: Stipulation. We choose the definition that aligns with our existing classification system. If our system has clear criteria, we apply them. If not, we clarify the criteria and then apply. The key is consistency.

  What the procedure cannot do:
  - It cannot resolve value conflicts. For example, if two ministries have opposing purposes (one wants a broad unemployment measure to expand benefits, another wants a narrow one to reduce costs), the procedure will expose the conflict (at Step 4) and escalate, but then the committee must decide based on policy, not statistics.
  - It might produce a technically correct form but a bad recommendation if the cost of change is miscalculated (e.g., underestimating the burden of reprocessing data). To avoid this, we must involve data managers in Step 4.
  - A clean run through the stages does not guarantee committee acceptance because the committee may have political or other non-statistical considerations. The procedure is designed to produce a statistically sound recommendation, but the committee may override it.

  Final note: The procedure is a judgment call at several steps (e.g., Step 3: how strong is the empirical basis? Step 4: how to weigh purposes and costs?). We must document the reasoning at each step to allow for review.
answer: |-
  Below is a decision procedure grounded in a defensible middle position between "definitions are arbitrary" and "definitions are fixed by the world." It synthesizes Quine's insight (the analytic-synthetic boundary is blurred but not meaningless) with later refinements (e.g., Robert Brandom's work on inferential roles and Crispin Wright's on conceptual norms). The procedure uses plain-language concepts, avoids philosophical jargon, and terminates in three outcomes: **Stipulation**, **Investigation**, or **Escalation**. It prioritizes practical constraints (time, comparability, consequences) while acknowledging that definitions are constrained by both language conventions and empirical reality.

  ---

  ### **Decision Procedure for Disputed Terms**  
  **Key Vocabulary (Plain-English Equivalents):**  
  - **Core Criteria**: Non-negotiable elements of the term derived from historical use, legal texts, or universal agreement (replaces "analytic truth").  
  - **Empirical Anchor**: Observable features of the world that the term tracks (e.g., biological facts, economic behavior).  
  - **Purpose-Constraint**: How the term’s use affects real-world outcomes (e.g., funding, eligibility, comparability).  
  - **Merely Verbal Check**: A test to see if disagreement persists when the term is replaced with agreed-upon facts.  

  #### **Step 1: Identify Core Criteria**  
  - **Question**: "What criteria are non-negotiable for this term, based on our classification’s history, legal references, or universal agreement?"  
  - **Evidence Admissible**: Official documents (laws, prior classifications), historical use in the agency’s publications, expert consensus (e.g., ILO standards for unemployment).  
  - **Sufficient Answer**: A list of 1–3 criteria that all parties accept as essential (e.g., for "unemployed": "not working," "seeking work"). If no agreement, proceed to Step 2.  
  - **Judgment Call**: Distilling "universal agreement" from noisy debates. If disputes arise here, it signals weak conventions.  
  - **Philosophical Grounding**: Replaces "analyticity" with shared norms of use (Wright). Drops Quine’s rejection of meaning—focuses on what users *treat* as non-negotiable.  

  #### **Step 2: Test for Empirical Anchor**  
  - **Question**: "Is there observable evidence that could confirm or refute the application of the term in disputed cases?"  
  - **Evidence Admissible**: Scientific data (e.g., medical studies for stillbirth), behavioral patterns (e.g., job-search actions), or measurable traits (e.g., population density). Exclude theoretical disputes.  
  - **Sufficient Answer**:  
    - **Strong Anchor**: Evidence directly resolves the dispute (e.g., a genetic test for a disease). → Outcome: **Investigation** (gather data).  
    - **Weak/No Anchor**: Evidence is inconclusive or irrelevant (e.g., gestational viability is a continuum). → Proceed to Step 3.  
  - **Judgment Call**: Deciding if evidence is "direct" (e.g., job-search behavior is observable; "desire for work" is not).  
  - **Philosophical Grounding**: Quine’s holism—terms gain meaning from empirical ties but lack sharp boundaries.  

  #### **Step 3: Apply Purpose-Constraint**  
  - **Question**: "Which definition best serves the core purpose of this classification, given costs to comparability, programs, and time series?"  
  - **Evidence Admissible**: Impact assessments (e.g., effect on benefit eligibility), time-series breaks, alignment with international standards, cost of change.  
  - **Sufficient Answer**:  
    - **Clear Purpose-Priority**: One definition aligns decisively with core purposes (e.g., maintaining comparability) → Outcome: **Stipulation** (fix by convention).  
    - **Conflict/Unclear Purpose**: Purposes clash (e.g., accuracy vs. comparability) or costs are unquantifiable → Outcome: **Escalation**.  
  - **Judgment Call**: Weighing "cost of change" against "fitness for purpose." Comparability is a heavyweight factor.  
  - **Philosophical Grounding**: Pragmatic decision-making (survives Quine); drops the idea of "one true meaning."  

  #### **Step 4: Merely Verbal Check**  
  - **Trigger**: Suspected label disputes (e.g., "rural" vs. "urban"). Run concurrently with other steps.  
  - **Question**: "If we replace the disputed term with a full description of agreed-upon facts, does the disagreement vanish?"  
  - **Method**:  
    1. List all facts both parties accept about the case (e.g., "Population: 5,000; Density: 200/km²; Main Economy: Agriculture").  
    2. Ask: "With these facts, do you still disagree on the term?"  
  - **Outcome**:  
    - **Disagreement vanishes** → Dispute is about labels, not facts. Outcome: **Stipulation**.  
    - **Disagreement persists** → Return to Step 2 (may indicate missing facts).  
  - **Philosophical Grounding**: Isolates semantic from substantive disputes (Brandom).  

  ---

  ### **Failure Modes**  
  - **Over-Reliance on Stipulation**:  
    - **Risk**: Ignores empirical anchors (e.g., defining "stillbirth" without medical input).  
    - **Detection**: Check if Step 2 was skipped despite available evidence.  
    - **Direction**: Biases toward status quo/convenience.  
  - **Over-Reliance on Investigation**:  
    - **Risk**: Wastes resources on pseudo-empirical questions (e.g., seeking "scientific truth" for social constructs).  
    - **Detection**: Step 2 misclassifies conventional thresholds as empirical.  
    - **Direction**: Biases toward novel definitions.  
  - **False Escalation**:  
    - **Risk**: Escalates clear cases due to poor Step 3 analysis.  
    - **Detection**: Review if Purpose-Constraint was underused.  

  ---

  ### **Procedure Applied to Your Cases**  
  #### **Case 1: Unemployed (Including Discouraged Workers)**  
  - **Step 1 (Core Criteria)**: Core criteria: "not working + actively seeking work." Agreed by all.  
  - **Step 2 (Empirical Anchor)**: "Desire for work" is unobservable; job-search actions are observable. Weak anchor for "would start work."  
  - **Step 3 (Purpose-Constraint)**:  
    - Purpose: Track labor underutilization. New definition may better reflect this.  
    - **But**: Cost of breaking 40-year series outweighs benefits. Comparability is paramount.  
  - **Outcome**: **Stipulation**. Reject proposal. Status quo preserved.  
  - **Why Your Instinct Holds**: Step 3 prioritizes comparability. Weight is decisive unless new definition fixes a critical flaw.  

  #### **Case 2: Miscarriage vs. Stillbirth Threshold**  
  - **Step 1 (Core Criteria)**: Core: "Fetal death." No universal threshold.  
  - **Step 2 (Empirical Anchor)**: Gestational viability is a continuum (no natural cutoff). Weak anchor.  
  - **Step 3 (Purpose-Constraint)**:  
    - Purpose: International comparability, health policy.  
    - Cost of change: Low if aligned with neighbors.  
  - **Step 4 (Merely Verbal Check)**: Dispute is about threshold labels, not facts (e.g., "22 weeks" vs. "24 weeks" in identical cases).  
  - **Outcome**: **Stipulation**. Choose threshold based on WHO/neighbor standards.  
  - **Message to Minister**:  
    > "There is no ‘scientifically correct’ threshold; it is a convention for consistent reporting. We recommend aligning with [e.g., WHO’s 22 weeks] to enable cross-border comparison. For a specific purpose (e.g., neonatal care), thresholds may vary, but our role is standardization, not biological fact-finding."  

  #### **Case 3: Peri-Urban as Rural/Urban**  
  - **Step 4 (Merely Verbal Check First)**:  
    - Fact: Both offices agree on population, density, infrastructure.  
    - Test: Disagreement vanishes when term is removed → Purely a label dispute.  
  - **Step 1 (Core Criteria)**: Core: "Non-urban." Ambiguous for peri-urban.  
  - **Step 2 (Empirical Anchor)**: None; rural/urban is socially defined.  
  - **Step 3 (Purpose-Constraint)**: Purpose: Allocate resources. Consistency > precision.  
  - **Outcome**: **Stipulation**. Adopt a clear density/use threshold (e.g., OECD standard).  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Resolve Value Conflicts**: If purposes clash (e.g., ministry wants lower unemployment rates, analysts want accuracy), the procedure exposes but cannot solve this. Escalation is the only path.  
  2. **Guarantee Committee Acceptance**: A clean form may still be rejected if:  
     - Purposes are misprioritized (e.g., underestimating political costs).  
     - Evidence is ignored in Step 2 (e.g., overriding medical data for stillbirth).  
  3. **Detect All Bad Recommendations**:  
     - **Failure Example**: Stipulating a "rural" definition that ignores infrastructure data (due to rushed Step 2).  
     - **Why**: Judgment calls in Steps 2–3 are error-prone under time pressure.  
  4. **Handle Radical Vagueness**: If a term lacks any Core Criteria (e.g., "informal sector" in a new economy), the procedure escalates but offers no tools for resolution.  

  **Final Grounding**: Quine showed that definitions are not immune to empirical revision, but he did not erase the distinction between convention and discovery. This procedure salvages a "workable notion" by:  
  - Using **Purpose-Constraint** for conventions (replaces "true in virtue of meaning").  
  - Using **Empirical Anchor** for fact-based disputes (replaces "synthetic truth").  
  - Using **Merely Verbal Check** to isolate language disputes (reflects "disagreement across belief pairs").  

  **Deliverable**: A one-page form with four checkboxes (Steps 1–4) and a decision output (Stipulation/Investigation/Escalation). Officers need no philosophy—just adherence to evidence rules and purpose-weighted judgment.
