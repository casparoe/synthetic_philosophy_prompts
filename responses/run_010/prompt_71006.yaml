prompt: |-
  three months into a novel and the scene i keep circling isnt about plot, its about a distinction i cant get my hands on. help me out.

  setup, roughly: my narrator edits documentary footage. she's been hired to finish a dead director's film and she finds a take where the subject — a kid, basically, from a town with no other options in it — clearly realises partway through that the camera's on him, and keeps performing anyway, and the director keeps rolling, and the resulting three minutes are the best thing in the whole archive. nobody broke a law, nobody was lied to, there's no scandal in the biography you could hang this on. the trouble is in the looking, and in how good the looking is.

  what i want from you is an example of the conceptual problem that scene is sitting on. invent it — i don't want a roundup of real scandals or dead celebrity authors, and no reading list or citations either, i can't check them and neither can you. i want a case in the can-immoral-art-still-be-good-art debate where the moral defect and the aesthetic achievement are the same feature of the work, so that separating the art from the artist gets no grip at all, because the artist's life isn't what's wrong — the work's own address to its audience is. my hunch is the audience's pleasure has to be part of the mechanism, that the work recruits you into something and pays you for it, but tell me if that's wrong or just one species of the problem.

  then give me a second example, deliberately boring: a genuinely great work by a genuinely awful person where nothing in the work itself is tainted, so i can see where the boundary sits. and sort both cases into whichever of the standing positions they actually land under — the autonomist line, the ethicism line, the moderate moralist argument about a work failing to earn the response it asks for, the immoralist one where the defect becomes a merit — naming them is fine, arguing for one of them is even better.

  and be honest about the second example. i suspect it isnt as clean as i'm assuming and that the boring case is doing sneaky work, because once you know about the author you read differently, and i dont know whether that different reading is a change in the work or just in me.

  last thing: how confident are you in the way you've drawn that line? point at the single claim in your answer you'd put the least weight on and say why, so i know which part of it not to build a book around.
