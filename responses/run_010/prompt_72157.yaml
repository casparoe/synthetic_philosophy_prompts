answer: |-
  Here’s a tailored exam question, model answer, and marking scheme designed to force engagement with Dennett’s indeterminacy thesis while avoiding rote summaries of color-phi.

  ---

  ### **Take-Home Exam Question**  
  **(90 minutes; 25 marks total)**  

  > **Partisan Proposal**:  
  > A researcher claims the following experiment decisively supports *Stalinesque* revision (consciousness requires pre-experiential "filling in"):  
  > - Subjects rest their forearm on a grid of 10 precisely timed vibrotactile stimulators (5cm spacing).  
  > - **Trial sequence**: Stimulator A vibrates for 10ms at t=0ms → 50ms gap → Stimulator B (adjacent to A) vibrates for 10ms at t=60ms.  
  > - **Response requirement**: Subjects press one button if they feel movement from A to B, another if they feel two distinct taps.  
  > - **Critical constraint**: The response window opens at t=100ms (40ms after B’s offset) and *closes* at t=200ms. Auditory feedback forces responses within this 100ms window.  
  >  
  > The researcher argues: If subjects report illusory movement (A→B) at high rates (>90%), this *must* reflect Stalinesque processing. With only 40ms between B’s offset and the *earliest possible response*, and given known neural latencies for tactile awareness (~80-120ms), there’s no time for Orwellian "post-experiential revision" of a veridical two-tap experience.  
  >  
  > **Your Task**:  
  > 1. Explain how this setup aims to empirically distinguish Stalinesque from Orwellian revision, focusing on *why timing constraints matter*. (8 marks)  
  > 2. Articulate the best *Multiple Drafts* reply to this argument. Your response must engage Dennett’s core indeterminacy thesis. (7 marks)  
  > 3. Evaluate whether this reply *dissolves* the problem (showing the distinction is empty) or merely *relocates* it (preserving a substantive difference). Defend your view. (10 marks)  

  ---

  ### **Model Answer** (≈700 words)  

  #### **(1) Partisan Argument**  
  The experiment exploits *temporal bottlenecks* to privilege Stalinesque revision. Tactile stimuli require ~80-120ms for cortical processing before conscious access. With responses forced 40–140ms after B’s offset (t=60ms + 40–140ms), subjects must decide *before* standard neural processing completes. If they report illusory movement (A→B), the researcher contends this illusion must have been *pre-computed* by t=100ms (when responses begin), implying Stalinesque "filling in" prior to consciousness. Orwellian revision is allegedly impossible: there’s insufficient time to *first* experience two distinct taps (requiring full processing until ~t=180ms) and *then* revise it into illusory movement before responding at t=100–200ms. The timing thus forces an "unedited" verdict, making reported experience directly reflect pre-conscious staging.  

  #### **(2) Multiple Drafts Reply**  
  Dennett’s Multiple Drafts model rejects the foundational assumption here: that subjects "report experiences" timestamped to processing stages. Consciousness isn’t a unified stream finalized before reporting; it’s fragmented into parallel "drafts" with no single finish line. The probe (button press) *itself* participates in content fixation. When subjects press the "movement" button at t=100ms, this act doesn’t *report* a pre-existing illusion; it *constitutes* the judgment that retroactively defines their experience. The brain doesn’t "fill in" A→B by t=100ms (Stalinesque) nor revise two taps *after* experiencing them (Orwellian). Instead, temporal constraints force a probe *before* conflicting drafts (e.g., "two taps" vs. "motion") resolve. Pressing "movement" reflects the draft winning the competition for behavioral control at probe-time, not a verdict about "when illusion occurred." The distinction collapses because there’s no fact about whether the illusion was "experienced before" or "revised after" t=100ms—only that the probe elicited a narrative favoring motion.  

  #### **(3) Evaluation: Dissolution vs. Relocation**  
  This reply *dissolves* the problem by showing temporal constraints cannot adjudicate between Stalinesque/Orwellian accounts because both presuppose a nonexistent "finishing line" for experience. The partisan treats the button press as a passive *readout* of conscious content fixed before t=100ms. But Dennett argues probes are *interventions*: forcing response at t=100ms doesn’t reveal "unedited experience"; it creates a *truncated* narrative where earlier drafts (like motion predictions) dominate due to the probe’s urgency. The "~90% illusory movement" finding doesn’t entail Stalinesque processing; it could reflect:  
  - A motion-optimized draft winning under time pressure (compatible with Orwellian processes if probes are mis-timed), or  
  - Indeterminacy: With no time for drafts to stabilise, the question "Was the illusion *felt* or *recalled*?" has no answer.  

  The reply succeeds because it attacks the *intelligibility* of the distinction when probes constrain report. If experience/content fixates only relative to probes, asking "which revision happened?" is like asking "which draft was *the* conscious one?" before the probe. This dissolves the empirical debate: no experiment can distinguish "revision types" because they reference a Cartesian Theater chronology that doesn’t exist.  

  *(Defensible alternative):* A student *could* argue the reply merely *relocates* the problem: instead of "when did revision occur?" we ask "which drafts win under which probe conditions?" This preserves a substantive difference (e.g., Stalinesque ≈ draft dominance via pre-probe processing; Orwellian ≈ post-probe reconciliation). But this misreads Dennett: drafts aren’t proto-conscious events; they’re subpersonal resources. The relocated "problem" isn’t about *consciousness* but predictive processing efficiency—which Dennett accepts. The *dissolution* targets the *phenomenological* distinction, which cannot be saved by relabeling.  

  ---

  ### **Marking Scheme** (25 total)  
  **A/B boundary**: Turns on part (3)—whether the student grasps that *dissolution* follows from denying *in-principle* determinacy of temporal facts about experience (not just practical undetectability).  

  | **Points** | **Marks** | **Key Insight Required** | **Common Mistakes** |
  |------------|-----------|--------------------------|---------------------|
  | **1a** Explains why partisan uses timing: To force responses *before* Orwellian revision could occur given neural latencies | 3 | Links response window (t=100–200ms) to tactile processing delays (~80-120ms) | Just re-describes experiment; misses latency argument |
  | **1b** Identifies the Stalinesque verdict: Illusion reports imply pre-conscious completion | 2 | Shows why researcher thinks "no time for revision" | Calls it "Orwellian" by mistake |
  | **1c** Articulates why Orwellian is excluded: Veridical experience would require processing past t=180ms, but responses start at t=100ms | 3 | Calculates time constraints (t=60ms +80ms =140ms for awareness; t=100ms is too early) | Assumes "revision is instantaneous"; ignores neural realism |
  | **2** Multiple Drafts reply: Probes fix content; no "pre-existing experience" to revise | 7 | Quotes/rephrases Dennett: Probe is "judgment," not "readout"; denies Cartesian timestamp | Only says "it’s indeterminate" without mechanism; confuses with "illusion happens later" |
  | **3a** Diagnoses core error: Partisan assumes probe accesses *finished* experience | 3 | States that the distinction requires a nonexistent "finish line" | Says "Dennett thinks it’s Stalinesque/Orwellian" |
  | **3b** Evaluates dissolution: Distinction is empty—no fact about "when experience happened" | 4 | Argues temporal indeterminacy invalidates the *question* | Claims dissolution but gives no reason |
  | **3c** Defends dissolution/relocation: Contrasts *eliminativism* about timing (dissolution) vs. *operational shift* (relocation) | 3 | Uses "no fact of the matter" vs. "new empirical question" | Assumes dissolution is automatic; misses relocation option |
  | **✓** **Bonus clarity mark** | +1 | Precise neural timings, no diagram over-reliance | N/A |

  ---

  ### **Why This Works**  
  - **Forces engagement with indeterminacy**: Students can’t score highly without confronting *why* timing parameters don’t resolve the debate.  
  - **Blocks rote answers**: Concrete parameters prevent generic color-phi summaries.  
  - **Balanced defensibility**: Part (3) allows A-grade answers arguing for *relocation* if they rigorously defend how probe-draft interactions preserve a revision-type analogue.  
  - **Realism**: Tactile phi has empirical precedents (e.g., Goldreich, 2007); neural latencies are peer-reviewed estimates.  

  Let me know if you’d like a simplified participant briefing sheet for the imagined experiment!
