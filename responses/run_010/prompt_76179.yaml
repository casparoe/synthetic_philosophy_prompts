answer: |-
  What you're describing is a profound and recurring epistemological pattern that cuts across scientific and philosophical domains. It's the realization that **even with complete observational data, the "target" of optimization, definition, or prediction isn't inherent in the system itself but emerges only after choosing a specific *descriptive framework*.** Your examples are textbook illustrations of this.

  ### The Core Concept: Optimal Frame Dependence (OFD)
  I propose coining the term **Optimal Frame Dependence (OFD)** to capture this phenomenon. Here's its definition and edges:

  **OFD:** *The property of a system where the identification of an "optimal" state, a defined event (e.g., a phase transition), or even the target of a goal-directed process (like AI optimization) is contingent upon the choice of a specific descriptive framework, metric, or representation scheme, despite complete agreement on all observable data under different frameworks.*

  ### How OFD Differs from Established Concepts
  1.  **Underdetermination of Theory by Data (Quine/Duhem):**
      *   **Similarity:** Both involve choices not fully dictated by data.
      *   **Difference:** Underdetermination is about *multiple theories* fitting the *same data*. OFD is about *multiple descriptions/frameworks* applied to the *same system/data* yielding different *definitions of what constitutes "optimal," "the event," or "the target"*. The data isn't failing to distinguish theories; the descriptor itself defines the goal. You have one theory (e.g., molecular dynamics) but multiple valid *representations within it* for defining success/events.

  2.  **Conventionalism (Poincaré, Carnap):**
      *   **Similarity:** Both acknowledge non-empirical choices (conventions) are necessary in science (e.g., choosing a geometry, coordinate system).
      *   **Difference:** Conventionalism often focuses on *foundational choices* (Euclidean vs. Non-Euclidean geometry). OFD highlights how *operational choices* within an accepted theory (which scoring function? which order parameter? which world-model slice?) *fundamentally alter what "achieving the goal" means*, even when all frameworks are empirically adequate descriptions *of the state*.

  3.  **Context-Dependence:**
      *   **Similarity:** Meaning/value depends on context.
      *   **Difference:** Context-dependence is broader and often about linguistic meaning or subjective experience. OFD is specifically about the *definition of objectives or events* in rigorous, quantitative scientific/engineering contexts being dependent on the *chosen representational scheme*.

  4.  **Goodman's "Grue" Problem (New Riddle of Induction):**
      *   **Similarity:** Highlights how predicates define categories, impacting predictions.
      *   **Difference:** "Grue" is about induction and *projection* of predicates into the future. OFD is about *defining the objective function or event threshold itself* within a known state space, impacting *optimization or classification* right now. It's less about future uncertainty, more about present definitional ambiguity of goals.

  5.  **Referential Opacity (Quine):**
      *   **Similarity:** How you refer to something matters for intentional contexts (beliefs, desires, goals).
      *   **Difference:** Primarily a logical/semantic concept about substitution. OFD operationalizes this in scientific practice: *how you mathematically represent the system to the optimizer/AI* determines what it *actually pursues*, even if the underlying physical state is identically described otherwise. (This is highly relevant to your AI example).

  ### The Edges of OFD
  *   **Requires Complete Observational Agreement:** OFD only applies when the different descriptive frameworks agree on *all observable data* concerning the system's state. If framework A predicts an observable Framework B cannot see or contradicts, that's underdetermination or falsifiability, not OFD.
  *   **Operational Definition of Goals:** OFD manifests when the *operational definition* of "better," "optimal," "the transition," or "the target" is tied to a specific representation. Changing the representation changes the operational goal.
  *   **Distinct from Vagueness:**
      *   **Vague Predicates (e.g., "heap"):** These involve borderline cases where it's unclear if the predicate applies *even within a single framework*. OFD involves *precise definitions* within *each framework*, but the frameworks define the goal *differently*. In your protein example, both scoring functions are precise; they just prioritize different aspects of the *same* structure/data.
      *   **Changes Predictions?** This is the crucial edge:
          *   **OFD Proper:** If the *only* difference is the ranking/definition of the goal/event *for the same set of systems/states* (like your protein candidates or defining the exact point of a phase transition), and all frameworks agree on *descriptions* of the states, it's pure OFD.
          *   **Stronger Claim:** If swapping frameworks *also* leads to genuinely different *future predictions* under the *same experimental conditions*, then it edges into underdetermination or even different theoretical commitments. OFD primarily concerns the definition of present objectives/thresholds, not necessarily conflicting future predictions. However, the AI example *can* blur this line if the world-model swap changes the AI's future behavior in ways its original designers didn't anticipate, even if the *current* state description seems equivalent.

  ### Why "Optimal Frame Dependence" Fits Your Cases
  1.  **Protein Stability:** The "optimal" protein is frame-dependent (`Score_contacts` vs. `Score_energy_basin`). The data (coordinates) is identical; the frame defines "stability."
  2.  **Phase Transitions:** The "event" (transition happening) is frame-dependent (choice of order parameter). The data (temperature, pressure, volume) is identical; the frame defines the threshold.
  3.  **AI Goal Specification:** The "target" is frame-dependent (which slice of the internal world-model you point to). The underlying system state might be describable equivalently; the frame defines what "success" means for the AI. Changing the internal model changes the frame, thus changing the goal *reference* without necessarily changing the goal *label*.

  ### Conclusion
  You've identified **Optimal Frame Dependence (OFD)** – the realization that defining what "better," "optimal," or even "the event" *means* requires choosing a specific descriptive lens *before* the data can adjudicate between options. This isn't a failure of data, but an inherent consequence of needing to operationalize abstract goals (like "stability" or "achieve X") into specific mathematical or representational terms within a complex system. It highlights the non-eliminable role of convention and perspective even in highly quantitative science and engineering, particularly where optimization or threshold definition is involved. Your chemical intuition has led you to a deep insight into the philosophy of science and goal-directed systems.
