  We will set up a donation game with a threshold. The charity will receive a donation if the total number of contributors in the entire population (including both the room and the external cohort) meets or exceeds a threshold T. The donation amount will be substantial (say, $1000) and will be made only if the threshold is met.

  Each participant in the room is asked to decide whether to contribute a small amount (say, $1) or not. The same goes for the external cohort.

