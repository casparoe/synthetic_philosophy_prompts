answer: |-
  My dear colleague,  

  Congratulations on the workshop slot – no small feat with that crowd. As requested, I’ve drafted a preparation sheet for the Q&A, tailored to your analytic audience and your provocative reading of Sartre. I’ve ordered objections as I suspect they’ll arise, from the most predictable deflationists to the Heideggerian wildcard. Crucially, I’ve framed replies in their idiom: mental causation, agential control, and ontological parsimony. I’ve also flagged concessions and soft spots. British English throughout, as instructed.  

  The first salvo will come from the Mele-Davidson camp. One will object that your “active sustaining” is needlessly complex; they’ll insist bad faith reduces to simultaneous, compartmentalised beliefs (e.g., the waiter both affirming and denying his identity *as* a waiter), with no mysterious “activity” required. They’ll cite cognitive economy: why posit a diachronic project when belief fragmentation explains the phenomena? Your reply: “Compartmentalisation might explain static tension, but not its *persistence* against disruptive evidence – like the woman registering her companion’s hand yet *continuing* to avoid the implications. Only an agent actively managing attention (e.g., steering conversation elsewhere) sustains the instability. Fragmented beliefs alone would collapse under pressure.” Concede at once that compartmentalisation is part of the mechanism. Soft spot: You’ll need sharper criteria for when avoidance becomes “active” rather than passive cognitive drift.  

  Next, the action theorists will press on mental ontology. “What *is* this ‘activity’?” they’ll ask. “If it’s not a belief, desire, or intention, isn’t it an obscure posit? How does it fit into causal models of action?” Your reply: “It’s a pattern of *refusals* – not a new mental state, but a meta-intentional stance of disavowing commitments. Think of it as the inverse of Frankfurt’s second-order volitions: a refusal to endorse or reject first-order attitudes. The ‘activity’ is the cumulative effect of micro-choices to deflect reflective scrutiny.” Concede that Sartre’s metaphors strain contemporary frameworks. Soft spot: This risks sounding like a homunculus – you must stress it’s enacted through ordinary mental actions (diversion, rationalisation).  

  The Frankfurtian will pounce here. “If the agent is ‘refusing’ commitments,” they’ll say, “doesn’t that imply a higher-order will? But if they *have* such a will, why call it bad faith? If not, how are they responsible?” Your riposte: “Ah, but Sartre’s radical freedom *denies* a hierarchical will! Responsibility stems from the agent’s total, pre-reflective engagement in the world. The café waiter isn’t ‘split’ – he *is* the project of playing-at-being-a-waiter-while-knowing-it’s-a-role. His responsibility lies in *being* this project, not in endorsing it. Your hierarchical model smuggles in the very transcendence Sartre rejects.” Concede Frankfurt usefully diagnoses conflicts but misses the primordial unity of bad faith. Soft spot: Hard to make “total pre-reflective engagement” palatable to someone who thinks responsibility requires identification.  

  Now the Sartre specialist, scowling: “You’ve gutted the ontology! Bad faith isn’t a ‘project’ – it’s a flight from the *néant*, the vertigo of freedom manifest in anguish. Your ‘active sustaining’ psychologises what’s existential!” Your counter: “Not at all. The ‘project’ *is* the flight – the woman’s sustaining of equilibrium *is* her evasion of anguish. But we needn’t invoke the *néant* to see her active complicity. What’s existential is precisely that this evasion is a chosen mode of being, not a mental state. I’m clarifying, not sanitising.” Concede freely that you’ve bracketed the transcendental framework. Soft spot: They’re right that you’ve downplayed anguish – if pressed, link the fragility of the equilibrium to the threat of anguish.  

  **The objection I fear you’re privately dreading – and should – is this:** “If bad faith is diachronic and actively sustained, why is it unstable? If the agent *successfully* maintains equilibrium (e.g., the woman never acknowledges the hand), isn’t it stable? If it collapses, doesn’t that imply passive failure, undermining activity?” **This is perilously close to fatal.** It attacks your core claim that the instability is essential and agent-sustained. A weak reply would note Sartre calls bad faith inherently "unstable" – but that’s textual, not analytical. A better one: “The instability is *constitutive*: the agent must perpetually adjust to threats (e.g., the waiter’s exaggerated movements risk self-parody). Success isn’t stability but postponed collapse – and *that* requires work. The tension isn’t accidental; it’s the fuel of the project.” **If pressed hard, this could kill your claim that activity explains the instability rather than merely accompanies it.** What survives? Your emphasis on temporality and agential responsibility, but the elegant "equilibrium" metaphor might buckle.  

  Stand your ground on the central insight: bad faith is what the agent *does*, not what she *has*. That’s liberating – and terrifying. Break a leg, but not your resolve.  

  Yours in solidarity,  
  A Well-Wisher  

  ---  
  **Key strategy notes:**  
  - **Analytic bridge:** Frame "radical freedom" as "ultimate responsibility" (Strawson-ish) to avoid Continental baggage.  
  - **Heideggerian trap:** Don’t let the specialist drag you into Dasein-talk. Say: "I’m offering a conditions-of-possibility analysis for responsibility, not an ontology of being."  
  - **Soft reply softener:** When a reply is vulnerable, pivot to textual evidence – e.g., "Sartre *describes* the waiter’s movements as 'a game,' implying activity."  
  - **Fatal objection mitigation:** If the "instability" objection lands, retreat to: "Even if equilibrium can be stable, its *maintenance* against threats remains active – and *that’s* what’s culpable." Sacrifices elegance but saves accountability.
