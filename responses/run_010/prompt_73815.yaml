prompt: |-
  I am a junior, and my school's literary journal is putting together a special issue on the ethics of war. For background, I have been reading Walzer's defense of the moral equality of combatants alongside the revisionist reply, which holds that the permission to kill cannot be symmetric, since only soldiers fighting for a just cause have one, and those fighting for an unjust cause are closer to culpable threats than to duelists who have consented to the same risk. I would like to contribute a sonnet that stages this disagreement structurally rather than merely describing it:

  - Fourteen lines of iambic pentameter, rhymed. The octave speaks in the voice of the symmetry thesis, and its rhyme scheme should itself be symmetrical (ABBA ABBA or something comparably mirrored), so that the form asserts what the argument asserts.
  - The volta at line nine is the moment the symmetry fails. The sestet's rhymes should no longer pair off evenly, with one single rhyme reaching deliberately back into the octave — the point where the two positions cannot stop touching each other.
  - Somewhere in the sestet, the poem must handle the case that genuinely troubles the revisionist: a conscript who bears no meaningful responsibility for the war he is fighting. He should come out as neither an innocent bystander nor a villain.
  - The closing couplet belongs to neither side. It is spoken by the practice of taking prisoners, which depends on the fiction of equality working whatever the correct moral theory turns out to be.

  A reader who knows the debate should be able to say which thesis each section is voicing; a reader who does not should simply get a good poem about soldiers. Please do not name any philosopher in the verse, and do not use quotation marks or citations.

  After the poem, include a short JSON object with exactly these fields: "octave_voice" (one sentence stating the position the octave argues), "volta" (what turns at line nine), "asymmetry_claim" (the revisionist point the sestet advances), "conscript_handling" (how the poem treats the combatant who is not responsible for the war), "couplet_speaker" (whose interests the final two lines represent), "rhyme_scheme" (the scheme actually used, given separately for octave and sestet), and "liberties" (an array of any places where the poem simplified or bent the philosophy to serve the verse; leave empty if there are none).
