prompt: |-
  I am a second-year doctoral student helping to run a two-day graduate workshop on the philosophy of well-being at my university in late November; we expect around thirty attendees, two of whom come from the psychology department, and the Saturday morning session is a recorded, interview-style conversation of forty-five minutes with our visiting scholar, followed by an open question-and-answer period. Our guest is a philosopher who has spent a decade arguing that the heterogeneity problem for hedonism — the charge that pleasures as diverse as the taste of a very ripe peach, the warmth of a bath after a cold walk, the satisfaction of finally seeing why a proof works, and the exhilaration of a fast descent on skis have nothing in common that is not equally shared by experiences that are not pleasures — is not a problem to be solved but a confusion to be dissolved. Her position, as I understand it, runs as follows. She grants that there is no single hedonic tone, no felt ingredient common to all and only pleasures, and she thinks that hunting for one is precisely what generates the problem. What unifies pleasures on her account is a role rather than a feel: an experience is a pleasure just in case, in virtue of the way it feels, it disposes its subject to want that experience to continue and to resist whatever would interrupt or diminish it. She holds that 'pleasure' is therefore like 'predator', 'money' or 'poison' — a term picking out a multiply realisable functional kind, with no reason to expect the realisers to resemble one another intrinsically — and that once this is granted the demand for a common phenomenology simply lapses. She remains a hedonist about well-being, and she locates the good-making property in the role rather than in the feels, which I confess is the part of the view I find hardest to follow.

  What I need is a sequence of nine to eleven questions that I can work through in the time available, together with, for each, the follow-up I should have ready for the answer she is most likely to give. Please build the sequence so that it develops rather than merely accumulates, and make sure it presses on at least the following: whether the phrase 'in virtue of the way it feels' quietly reintroduces the phenomenology she has just disowned, so that the unity is merely relocated into a heterogeneous set of causal bases; the dissociation between 'liking' and 'wanting' drawn in affective neuroscience, on which incentive-salience systems and hedonic-impact systems come apart, and what that implies for identifying pleasure with a continuation-disposition; her treatment of cases in which an experience seems pleasant yet the subject has no inclination to prolong it (deep satiety, exhausted convalescence, certain painful-but-enjoyed exertions) and of cases in which the inclination to prolong is present without any pleasure at all; whether the account collapses into a desire theory of pleasure, and if so what survives of the claim that pleasure is what matters; whether a role of the kind she posits can bear the weight of being good-making; the first-person case, since I appear to learn that something is pleasant by attending to it rather than by gathering evidence about my own dispositions; whether infants and non-human animals can satisfy the account without possessing concepts of continuation and of a future; and whether a role kind of this shape is a genuine kind or a disjunction in disguise, including whether her analogies with 'money' and 'predator' support her or instead expose the difference between a role fixed by social or ecological facts and a role supposedly fixed by how something feels from the inside.

  One further consideration. She has a reliable way of brushing objections aside: she will say that the objection bites only if one has already assumed that 'pleasure' must name a natural phenomenal kind, and that this assumption, not her theory, is the real error. Please include, towards the end, a question that makes that move difficult to deploy, and close the sequence by asking her what would count as evidence or argument against her view. I would rather not have any generic warm-up questions of the 'what first drew you to this subject' variety, and I do not need a bibliography or a list of further reading, since I shall assemble the references myself; the questions should turn entirely on the content of her position and on the pressure points she would expect an informed questioner to know. Please write the whole thing in British English.
reasoning: |-
  Okay, the user is a second-year doctoral student organizing a graduate workshop on the philosophy of well-being. They need a structured interview sequence with nine to eleven questions for a visiting philosopher who argues that the heterogeneity problem for hedonism is a confusion rather than a genuine problem. The philosopher's view is that pleasure is defined by a functional role—specifically, an experience's disposition to make the subject want it to continue—rather than a common phenomenology. 

  The user has outlined several specific pressure points they want the questions to address. These include potential tensions in the "in virtue of the way it feels" clause, neuroscientific dissociations between 'liking' and 'wanting', counterexamples like satiety or exertion, possible collapse into desire theory, the normative weight of the functional role, first-person epistemology, applicability to non-linguistic beings, and whether the functional kind is genuinely unified. They also want a question that pre-empts the philosopher's typical rebuttal about assuming a natural phenomenal kind, and a closing question about what could falsify her view.

  The user explicitly rejects generic warm-up questions and wants British English phrasing. They're clearly deeply familiar with both the scholar's work and the broader literature—the level of technical detail suggests this is for a sophisticated academic audience. Their phrasing about finding the "good-making property" aspect hardest to follow hints they might personally lean toward phenomenological views, though they're scrupulously neutral in framing the task.

  Key structural needs: The sequence must build dialectically, starting with exposition before layering objections. The follow-ups need to anticipate the philosopher's likely responses to keep the conversation rigorous. The challenge will be distilling each complex issue into one crisp question while ensuring they interconnect—e.g., linking the neuroscience follow-up to the satiety counterexample, or the desire-theory concern to the normative weight issue.

  For the rebuttal-blocking question, I'll need to reframe an objection in terms internal to her functionalism—perhaps challenging whether the role itself is coherently definable without smuggling in phenomenology. The falsifiability close should force consideration of empirical or conceptual boundaries her theory couldn't accommodate.

  Phrasing adjustments for British English: "disposed" over "predisposed", "jot down" for note-taking, "whilst" where applicable, and normative terms like "plausible" instead of "viable". Avoid contractions in questions to maintain formality.
answer: |-
  Here is a carefully sequenced set of eleven questions, designed to build dialectically, incorporating your specified pressure points and anticipating the scholar's likely responses, all phrased in British English:

  1.  **Opening Exposition:** "Your central thesis is that the heterogeneity problem stems from a category error: we wrongly expect pleasures to share a common *feel* when they are instead unified by a common *functional role*. Could you please elaborate on this core distinction between phenomenal unity and functional unity for our audience, and explain precisely how this dissolves the heterogeneity problem?"
      *   *Likely Response:* She will reiterate that hunting for a common feel is misguided; pleasures are unified by their dispositional profile (to motivate continuation/resistance) rather than intrinsic qualities.
      *   **Follow-up:** "You stress that the disposition is triggered *'in virtue of the way it feels'*. Doesn't this phrase reintroduce phenomenology as the *causal basis* for the functional role? If so, does your account simply relocate the heterogeneity problem – now asking what unifies this diverse set of causal 'feels' – rather than solving it?"

  2.  **Neuroscience Challenge:** "Affective neuroscience distinguishes 'liking' (core hedonic impact, involving specific neurochemical systems like opioid) from 'wanting' (incentive salience, involving dopamine systems). These systems can dissociate – for instance, in addiction, 'wanting' persists long after 'liking' diminishes. Given you identify pleasure with the disposition to *want* to continue, how do you accommodate this empirical dissociation? Is an intensely 'wanted' experience that lacks any 'liking' component still a pleasure on your view?"
      *   *Likely Response:* She might argue that the neuroscience labels don't map perfectly onto philosophical concepts, or that the disposition she identifies is the philosophically relevant one, even if complex neural substrates underlie it.
      *   **Follow-up:** "If 'wanting' without 'liking' (as per the neuroscience) still satisfies your functional definition, doesn't this risk counter-intuitively classifying compulsive, non-hedonic states as pleasures? Conversely, could 'liking' without strong current 'wanting' – perhaps due to satiety – still be pleasure?"

  3.  **Counterexample - Satiety/Exhaustion:** "Let's consider cases of deep satiety or exhaustion. Imagine finally finishing an exquisite, multi-course meal. The taste of that last petit four might still *feel* intensely pleasant, yet one has absolutely no inclination whatsoever to eat another bite – indeed, the thought might be aversive. How does your account classify this pleasant feeling without the disposition to continue?"
      *   *Likely Response:* She might argue that the disposition is context-sensitive or defeated by other factors (like physical capacity or aversion). The core disposition linked to the *feel* is still present but overridden.
      *   **Follow-up:** "But doesn't this suggest the disposition isn't essential to the pleasure *itself*? The pleasantness seems to persist even when the disposition is entirely absent or actively countered. Is the pleasantness here merely the residual *feel* which *used* to cause the disposition?"

  4.  **Counterexample - Painful Exertion:** "Conversely, consider certain challenging but rewarding exertions, say, pushing through the 'burn' in a strenuous workout or a long run. The *overall experience* might be deeply satisfying and something one wants to continue *because* it is satisfying, but it incorporates significant localised sensations of pain or discomfort. How does your account distinguish the pleasant *aspect* (the satisfaction) from the unpleasant *aspect* (the burning muscles) in this complex state, given both contribute to the overall disposition to continue?"
      *   *Likely Response:* She might argue that the complex experience as a whole disposes continuation due to its overall positive valence, or attempt to isolate component states.
      *   **Follow-up:** "This seems tricky. If we take the whole complex state, it includes unpleasant elements. If we try to isolate the pleasant 'satisfaction' component, does *that* component, *on its own*, intrinsically dispose one to prolong it? Or is its contribution to the disposition dependent on its context within the larger effort?"

  5.  **Counterexample - Disposition Without Pleasure:** "Can we imagine states where the disposition to continue is strongly present, yet we wouldn't call them pleasant? Consider severe addiction cravings for a drug that no longer provides euphoria, or a compulsion to continue a meaningless, repetitive task out of sheer habit or anxiety. Are these pleasures on your view?"
      *   *Likely Response:* She might bite the bullet and say they *are* pleasures, albeit perverse ones, or refine the disposition by requiring it to be grounded *in the way it feels*.
      *   **Follow-up (Pressing the 'in virtue of' clause):** "But if you refine by insisting the disposition must be *'in virtue of the way it feels'*, how do we non-circularly specify *which* ways of feeling ground the *right kind* of disposition for pleasure? Doesn't this lead us back towards needing to identify a distinctive feel?"

  6.  **Desire Theory Collapse?:** "Your definition – an experience is a pleasure iff, due to how it feels, it disposes wanting its continuation – seems perilously close to defining pleasure *as* the object of a certain kind of intrinsic desire (a desire for the experience for its own sake, based on its feel). If this is correct, hasn't your hedonism effectively collapsed into a desire-satisfaction theory of well-being? What distinctively *hedonic* work is left for pleasure to do?"
      *   *Likely Response:* She will deny the collapse, arguing that pleasure is the *property* of the experience that *causes* the desire, not the object of the desire *per se*. Well-being is constituted by experiences *having* this property.
      *   **Follow-up (Normative Weight):** "This leads directly to the good-making property point. If pleasure just *is* this functional/causal property (being disposed to cause continuation-desires in virtue of feel), what makes *this property* intrinsically good? Why should we think that experiences causing certain motivational states in us *in virtue of how they feel* is the fundamental source of value? Couldn't the motivational state be faulty or disconnected from true benefit?"

  7.  **First-Person Epistemology:** "From the first-person perspective, when I judge 'this peach tastes pleasant', I seem to be reporting on a qualitative aspect of my current experience directly accessible through attention. I don't seem to be making an inference about my own dispositions – I don't think 'this taste makes me want more of it'. How does your functional account accommodate this immediacy and directness of first-person hedonic knowledge?"
      *   *Likely Response:* She might argue that the disposition manifests as an *aspect* of the feeling itself (its "to-be-continued-ness"), or that we learn to label the feels that typically play this role.
      *   **Follow-up:** "But doesn't this 'to-be-continued-ness' sound like a phenomenological property again? And if we learn to label based on typical roles, how do we explain the seeming immediacy and certainty of the judgement, distinct from judging dispositions which might be uncertain?"

  8.  **Infants and Animals:** "How does your account apply to non-linguistic beings like infants or animals? They presumably experience pleasures (a warm bath, milk). Do they need concepts like 'continuation', 'interruption', or 'future' to possess the disposition you define? If not, how do we characterise the disposition at this level without invoking a simpler phenomenology?"
      *   *Likely Response:* She will argue that the disposition is behavioural and pre-conceptual – e.g., the infant cries when the bath stops, seeks the nipple – and doesn't require sophisticated concepts.
      *   **Follow-up (Unity/Kindness):** "Doesn't defining the disposition purely behaviourally for infants/animals, while requiring a more complex 'in virtue of feel' clause for concept-users, threaten to fragment the kind 'pleasure'? Is there a single, unified functional kind here, or are there different kinds (proto-pleasure, full pleasure)?"

  9.  **Genuine Kind or Disjunction?:** "Your analogies are 'predator', 'money', 'poison' – functional kinds defined by their effects within a system (ecology, economy, biology). But these rely on *external* teleological or conventional frameworks (survival, exchange value, biological function). The functional role you posit for pleasure seems defined by an *internal*, first-person motivational response grounded in feel. Is this internal role sufficiently objective and stable to constitute a genuine natural kind, or is it merely a disjunction of states that happen to cause similar motivational responses in us?"
      *   *Likely Response:* She will argue it *is* a genuine psychological functional kind, defined by its causal role within our motivational architecture, just as 'pain' might be defined by its disposition to cause avoidance.
      *   **Follow-up (Blocking the Standard Rebuttal - External vs. Internal Role):** "But here's the worry about disjunction. The roles of predator/money/poison are fixed by *external* systems with clear, independent criteria (ecological niche, social convention, biochemical interaction). The role you propose is fixed entirely by an *internal* causal relation: this feel *causes* (in this subject) a continuation-desire. Without an external anchor, what prevents 'pleasure' from fragmenting into countless individual stimulus-response pairings? Why think this diverse set of causes shares a *unified* causal role, rather than just the *accidental* similarity of causing a generic 'continue' response? This challenge seems distinct from assuming a phenomenal kind; it questions whether your *internally-defined functional role* is coherent as a single kind."

  10. **The Good-Making Property Revisited:** "You remain a hedonist: you claim that what makes a life go well is having pleasant experiences, understood as experiences with this functional property. Earlier we touched on why *this* property should be good-making. Can you elaborate: is it *the disposition itself* that is intrinsically valuable, or is it the *feels* that realise the disposition? If the latter, doesn't heterogeneity resurface for value? If the former, why is being disposed to cause continuation-desires in oneself intrinsically good? Couldn't this disposition be maladaptive or disconnected from flourishing?"
      *   *Likely Response:* She will argue it's the functional property itself that is good-making, constituting a basic form of positive affective engagement with the world.
      *   **Follow-up:** "But doesn't this risk severing the essential link between pleasure and *feeling good*? If the value resides purely in the abstract disposition, not in any felt quality, how is this recognisably *hedonism* and not a novel form of motivational internalism?"

  11. **Falsifiability & Conclusion:** "Finally, to help us understand the boundaries and commitments of your view: what empirical finding or conceptual argument *would* genuinely threaten your account? What evidence or line of reasoning could convince you that pleasures *do* share a common phenomenal core after all, or that your functional role cannot unify pleasures or bear the normative weight you assign it?"
      *   *Likely Response:* She might be cautious, but could suggest evidence of a universal neural correlate for all pleasures *despite* phenomenological diversity might challenge her, or a compelling account showing the functional role *always* depends on a prior phenomenal unity. Alternatively, she might argue the view is primarily conceptual and less vulnerable to empirical disconfirmation.
      *   **Implicit Purpose:** This forces her to articulate the core, potentially vulnerable commitments, demonstrating the view's testability and concluding the dialectic by looking forward.

  **Sequence Rationale:**

  1.  **Starts with Exposition:** Ensures clarity on the core distinction for the audience.
  2.  **Targets the Crucial 'In Virtue Of' Clause:** (Q1 Follow-up) Immediately presses the potential tension in her view.
  3.  **Introduces Empirical Challenge:** (Q2) Brings in relevant neuroscience to test the core identification.
  4.  **Presents Key Counterexamples:** (Q3, Q4, Q5) Tests the definition against intuitive judgements about pleasure and motivation.
  5.  **Examines Theoretical Collapse & Normative Weight:** (Q6 & Follow-up, Q10) Addresses the potential slide into desire theory and the core challenge of why *this* property is good-making.
  6.  **Considers Epistemology and Scope:** (Q7, Q8) Tests the view from the first-person perspective and its applicability beyond concept-users.
  7.  **Challenges the Unity of the Functional Kind:** (Q9 & Follow-up) Directly tackles whether the functional role constitutes a genuine kind and **explicitly blocks her standard rebuttal** by focusing on the *internality* of the role definition vs. her analogies.
  8.  **Revisits Normative Core:** (Q10) Deepens the challenge to hedonism itself based on the functional definition.
  9.  **Concludes with Falsifiability:** (Q11) Forces reflection on the view's commitments and robustness, ending on a forward-looking note.

  This sequence systematically builds from exposition through increasingly challenging critiques, culminating in the targeted challenge to the coherence of her functional kind (Q9 Follow-up) designed to circumvent her standard defence, before concluding with the meta-question of falsifiability. It covers all your specified pressure points within a coherent dialectical structure. Good luck with the workshop!
