prompt: |-
  I'm the deputy editor at a small forecasting shop — fourteen analysts, we publish probability numbers on geopolitical stuff (treaties, sanctions, coups, port strikes), the numbers get scored after the fact, and the score is basically our whole reputation. Twice a month I chair what we call a reconcile: two analysts who filed different numbers on the same question sit down with me for 45 minutes and I try to walk them out of the room with one house number. I run it entirely by vibes right now and its showing. I did enough decision theory in grad school to know Aumann's result — the one saying two rational people who share a prior can't knowingly keep different beliefs about the same thing once each one's belief is common knowledge between them — and the follow-up showing that if they just keep announcing their numbers to each other the disagreement has to collapse after finitely many rounds. What I can't do is turn any of that into something I can actually chair without it turning into a seminar.

  So: write me the procedure. I want an ordered set of steps, and for each one, the question I ask out loud, what counts as a sufficient answer, what I do with that answer, and the exit condition — when the step hands me a verdict versus when it just routes to the next step. The core job I want it to do is sort a stubborn disagreement into the kind the theorem says can't be rational and the kinds his assumptions allow: private information one of them can't disclose, priors that genuinely differ, the two of them unknowingly estimating different events, common knowledge failing because each is modeling what the other will *say* instead of what the other believes, and one of them just not updating coherently or sandbagging the number for reputational reasons. It has to survive the actual conditions — 45 minutes, analysts who have never seen a sigma-algebra and go quiet the second I write math on the board, and a number that goes out under the firm's name, so a lazy split-the-difference when one of them is straightforwardly wrong is expensive for me. Also give me a verdict on the move my predecessor used, which was declaring an official shared prior at the top of every session (usually some historical base rate) precisely so the theorem's assumption would be satisfied by fiat: legitimate operational trick, or a cheat that voids the whole diagnosis? And wherever the procedure is really just a judgment call wearing a lab coat, say so plainly — I want to know which steps I can't hand to a junior editor. No reading list or citations, please; nobody here has time to chase papers and I won't be able to look anything up mid-meeting.

  Then run it on three cases. (1) "Will the armistice be signed before the end of Q3?" — one analyst filed 20% working purely off public statements; the other filed 60% and is partly going on two back-channel conversations with a source she's contractually forbidden to name or even characterize. They've reconciled four times on related questions and every time landed on a 40-ish compromise that each of them later told me privately they thought was wrong. (2) "Will the central bank hike in June?" — 70% versus 30%, and this is the infuriating one, because both of them swear they're working from the identical packet of speeches and data releases and the identical base rate over the last twenty cycles, neither can point to a single fact the other hasn't seen, and the whole gap seems to come down to whether the governor's last paragraph reads as hawkish signaling or boilerplate hedging. (3) "Will there be a strike before the contract deadline?" — 65% versus 15%, and I only discovered in the second session that one of them is estimating a strike anywhere in the region while the other is estimating one specific union walking out at one specific port. For each: walk the steps, say where it terminates and what I publish, and flag any step where you think the procedure is going to misfire in the room rather than on paper. Make sure at least one of the three ends somewhere I'm going to hate — I already suspect it's the first, where the honest output may be two numbers plus a note saying the disagreement is legitimate, which my boss will read as me not doing my job.
reasoning: |-
  We are designing a practical reconciliation procedure for probability disagreements among analysts. The goal is to resolve differences efficiently in 45-minute sessions, without requiring advanced math, while diagnosing the root cause of the disagreement.

  The procedure must handle:
  - Private information that cannot be disclosed
  - Genuine differences in prior beliefs
  - Estimating different events without realizing
  - Failure of common knowledge (each models what the other will say rather than what they believe)
  - Non-coherent updating or sandbagging

  We'll break the process into steps. Each step has:
  1. The question the chair asks out loud.
  2. What counts as a sufficient answer.
  3. What the chair does with that answer.
  4. The exit condition (either a verdict or routing to the next step).

  The procedure will terminate when:
  - A consensus number is reached.
  - The disagreement is diagnosed as legitimate (and then we may need to decide how to publish).
  - Time runs out (with a fallback).

  We also address the predecessor's move: declaring an official shared prior. We'll evaluate that.

  Finally, we run three test cases.

  ---

  **The Procedure: Steps for Reconciliation**

  **Step 0: Setup (Before the Meeting)**
  - Each analyst must submit a one-page note in advance: 
    - The event they are estimating (to ensure they are defining it the same way).
    - The key reasons (evidence, logic) for their probability.
    - Any constraints (e.g., non-disclosable information).
  - Chair reviews the notes and identifies potential mismatches.

  **Step 1: Event Alignment**
  - **Question:** "Let's start by making sure we're all estimating the same event. [Read the event definition from the question]. Analyst A, in your own words, what event are you estimating? Analyst B, same for you. Are there any differences in how you interpret the event?"
  - **Sufficient Answer:** Each analyst provides a clear, concise definition of the event. Any differences are noted.
  - **Chair Action:** If the definitions differ, note the discrepancy and try to align. If alignment is impossible (e.g., one is estimating a subset of the event), then:
    - If both agree to redefine the event to a common one, do so and note the change.
    - Else, the chair rules: either split the question into two events (and publish two numbers) or pick the original definition and require both to re-estimate (if time allows) or move to Step 2 with a note about event ambiguity.
  - **Exit Condition:** 
    - If the event definitions are aligned, proceed to Step 2.
    - If not aligned and cannot be resolved, terminate with a verdict: "This is two different events. We will publish two numbers or redefine the event for the house." (This is a verdict.)

  **Step 2: Shared Evidence Base**
  - **Question:** "Now let's list all the evidence both of you have seen and agree on. Analyst A, what are the key pieces of evidence you used? Analyst B, same. Now, are there any pieces of evidence that one of you has seen and the other hasn't? We are not asking for the content of private evidence, just whether it exists and its general nature (e.g., 'a private conversation with an official')."
  - **Sufficient Answer:** A list of shared evidence and a statement about the existence and nature of any private evidence (without disclosing details if prohibited).
  - **Chair Action:** 
    - If there is private evidence that cannot be disclosed, note it and its holder. 
    - If both have the same evidence, proceed to Step 3.
    - If one has private evidence, then the other analyst must state whether they would adjust their probability if they knew that evidence existed (without knowing the content). If they say yes, then we note that the disagreement may be due to private information and move to Step 3. If they say no, then we note that the private evidence is not considered impactful by the other side and proceed to Step 3.
  - **Exit Condition:** 
    - Proceed to Step 3 unless the existence of private evidence is the sole reason for the disagreement and the non-holder acknowledges it would change their estimate (then we might have to accept two numbers or use a different approach, but we proceed to Step 3 to see if other factors are at play).

  **Step 3: Reasoning Transparency**
  - **Question:** "Analyst A, walk us through how you got to your number. Start with the base rate or prior you used, then how each piece of evidence updated it. Analyst B, then you do the same. After each, the other may ask clarifying questions but not debate."
  - **Sufficient Answer:** Each analyst provides a step-by-step account of their reasoning, including:
    - The prior probability (if they used one).
    - How each piece of evidence updated the probability (qualitatively or quantitatively).
  - **Chair Action:** 
    - Listen for differences in priors, updating rules, or interpretation of evidence.
    - If the priors are different, note that.
    - If the updating rules are different (e.g., one uses Bayesian updating and the other heuristics), note that.
    - If the interpretation of the same evidence differs, note that.
  - **Exit Condition:** 
    - If the entire gap is explained by a difference in priors, proceed to Step 4 (Priors Reconciliation).
    - If the gap is explained by different interpretations of evidence, proceed to Step 5 (Evidence Re-Examination).
    - If the gap remains unexplained, proceed to Step 6 (Common Knowledge Check).

  **Step 4: Priors Reconciliation (only if Step 3 showed a prior difference)**
  - **Question:** "We see you started with different priors. Analyst A, why did you choose [prior]? Analyst B, same. Is there a shared prior we can agree on? If not, can we agree to use a neutral prior (e.g., a historical base rate) and then update together from there?"
  - **Sufficient Answer:** Each justifies their prior. Then, they discuss whether to adopt a shared prior for the reconciliation.
  - **Chair Action:** 
    - If they agree on a shared prior, have them both update from that prior using the shared evidence (Step 3) and see if the gap closes.
    - If they don't agree, the chair may impose a shared prior (e.g., a base rate) and require both to update from it in the room (if time allows) or note that the disagreement is due to differing priors and move to Step 7.
  - **Exit Condition:** 
    - If updating from a shared prior closes the gap, then we have a consensus number (verdict).
    - If not, or if they cannot agree on a prior, then the disagreement is due to priors and we move to Step 7 (Verdict on Legitimate Disagreement).

  **Step 5: Evidence Re-Examination (only if Step 3 showed evidence interpretation differences)**
  - **Question:** "We see you interpret [specific evidence] differently. Let's break that down. Analyst A, why did you interpret it as [X]? Analyst B, why [Y]? Is there a way to reconcile these interpretations? Can we agree on a third interpretation? If not, can we quantify the impact of this piece of evidence by asking: if this evidence were the only thing you knew, what probability would you assign?"
  - **Sufficient Answer:** Each analyst explains their interpretation and then tries to agree on a common interpretation or quantify the evidence's weight.
  - **Chair Action:** 
    - If they agree on a common interpretation, have both update their estimate accordingly (if time allows) and see if the gap closes.
    - If not, the chair may rule on the interpretation (if they have expertise) or note the irreconcilable difference and move to Step 7.
  - **Exit Condition:** 
    - If the gap closes, consensus (verdict).
    - If not, move to Step 7.

  **Step 6: Common Knowledge Check**
  - **Question:** "We've covered priors and evidence, but there's still a gap. Let's check if there's a common knowledge failure. Analyst A, what do you think Analyst B believes? And why? Analyst B, same about A. Now, did you update your own belief based on what you thought the other believed? If so, how?"
  - **Sufficient Answer:** Each analyst states what they believe the other believes and why. Then they state if they adjusted their own belief based on that.
  - **Chair Action:** 
    - If one or both adjusted their belief based on an incorrect model of the other's belief, then try to correct the model and have them update again without that influence.
    - If they now update to closer numbers, we may approach consensus.
    - If not, then the gap might be due to non-coherent updating or sandbagging (Step 7).
  - **Exit Condition:** 
    - If the gap closes or narrows significantly, we may have a consensus or proceed to Step 7 if not fully closed.
    - If the gap remains, move to Step 7.

  **Step 7: Verdict on Legitimate Disagreement**
  - **Question:** "We've tried to reconcile, but the gap persists. We need to decide how to publish. Let me summarize the reasons for the gap: [list reasons from steps]. Are there any other factors we haven't covered? Given this, what should our house number be? Alternatively, should we publish two numbers with an explanation?"
  - **Sufficient Answer:** The analysts agree on a way forward: a single number (via compromise or chair ruling) or two numbers.
  - **Chair Action:** 
    - The chair makes a ruling based on the discussion. Options:
      - If the disagreement is due to private information: the house number is the average (or a weighted average) of the two, with a note about private information.
      - If due to priors: use the base rate as the prior and update together, or average the two.
      - If due to different events: publish two numbers.
      - If due to non-coherent updating or sandbagging: the chair overrules and picks a number (with explanation to the analysts).
    - If time runs out, the chair may defer and require more work or make a provisional ruling.
  - **Exit Condition:** Always produces a verdict (a house number or two numbers with explanation).

  **Time Management:** 
  - If at any step the 45 minutes are about to expire, jump to Step 7.

  **About the Predecessor's Shared Prior Move:**
  - Declaring an official shared prior (e.g., a base rate) at the start is a legitimate operational trick. It forces the analysts to focus on updating from a common starting point, which aligns with Aumann's requirement. However, it may mask legitimate prior differences. We use it in Step 4 only if a prior difference is detected, and then only if the analysts agree (or the chair imposes it). It's not a cheat, but it should not be applied blindly.

  **Judgment Calls:**
  - Steps 1 (Event Alignment) and 7 (Verdict) require chair judgment. Step 7 especially is where the chair must decide the outcome when the procedure doesn't yield consensus. These cannot be handed to a junior editor without training.

  ---

  **Test Runs**

  **Case 1: Armistice before end of Q3? (20% vs 60%)**
  - **Step 1: Event Alignment**
    - Both are estimating the same event: signing before end of Q3. Proceed.
  - **Step 2: Shared Evidence Base**
    - Analyst A (20%): Public statements only.
    - Analyst B (60%): Public statements plus two back-channel conversations (private, cannot disclose).
    - Analyst B states she has private evidence (conversations) that she cannot disclose. Analyst A acknowledges that if such conversations occurred, it might change his estimate.
    - Chair notes: private evidence exists and is impactful. Proceed to Step 3 to see if there are other factors.
  - **Step 3: Reasoning Transparency**
    - Analyst A: Prior (base rate of similar negotiations) was 30%. Public statements were mostly negative, so updated down to 20%.
    - Analyst B: Prior (same base rate) 30%. Public statements were negative, but private conversations suggest behind-the-scenes progress, so updated up to 60%.
    - Gap explained by private evidence and its impact. No other differences found.
  - **Step 6: Common Knowledge Check** (skipping 4 and 5 as not triggered) 
    - Not necessary because the gap is explained by private evidence. But we do it briefly: 
      - A thinks B is overreacting to rumors. B thinks A is ignoring non-public dynamics. 
      - They didn't update based on each other's beliefs because they don't trust each other's sources.
    - No change.
  - **Step 7: Verdict**
    - Disagreement is legitimate due to private information. 
    - Options: 
      - Average (40%) but both analysts have previously thought this wrong.
      - Publish two numbers? The firm doesn't do that.
      - Chair rules: Since the private evidence is not disclosable, we cannot verify. The house number should be based on public evidence (20%) but with a note that non-public information exists and may affect the outcome. Alternatively, the chair may trust Analyst B's track record and go with 40% (but that's a judgment call).
    - **Verdict:** Given the history of bad compromises, the chair decides to publish 25% (slightly above A's number to account for the possibility of private info) with a note: "Our assessment is primarily based on public information, but we acknowledge unverified non-public indications of progress." 
    - **Termination:** Step 7. This verdict may be hated because it's not satisfying and the note might be seen as hedging.

  **Case 2: Central bank hike in June? (70% vs 30%)**
  - **Step 1: Event Alignment**
    - Same event: rate hike in June. Proceed.
  - **Step 2: Shared Evidence Base**
    - Both have the same packet of speeches and data. No private evidence. Proceed.
  - **Step 3: Reasoning Transparency**
    - Both used the same base rate (20 hikes in 100 meetings -> 20% prior?).
      - Analyst A (70%): Updates with the latest speech -> interprets the last paragraph as hawkish. Also, recent inflation data was high. So: prior 20% -> after inflation data 50% -> after speech 70%.
      - Analyst B (30%): Same prior 20%. Inflation data high -> update to 40%. But the last paragraph is boilerplate hedging, not hawkish -> update down to 30%.
    - Gap is entirely due to interpretation of the last paragraph of the speech.
  - **Step 5: Evidence Re-Examination** (go to Step 5, skip Step 4 because same prior)
    - Focus on the speech paragraph.
    - Analyst A: Points to specific words that are typically used before hikes.
    - Analyst B: Points to the overall structure and context that suggests non-commitment.
    - They cannot agree. Chair asks: "If this speech were the only evidence, what would you assign?"
      - Analyst A: 60% (without the inflation data, the speech alone is slightly hawkish).
      - Analyst B: 40% (the speech alone is neutral to slightly dovish).
    - They are still split. Chair rules: bring in a third party (if available) or use a voting mechanism among other analysts? But we must finish in the room. 
    - Alternatively, the chair may break the tie by their own judgment: e.g., the speech is ambiguous, so it shouldn't move the needle much. Then we would be around 50% (after inflation data) and the speech adds little -> 50%? 
    - But the chair has no special expertise. So:
  - **Step 6: Common Knowledge Check**
    - Analyst A: "I thought B would say 40% because he always downplays speeches." 
    - Analyst B: "I thought A would say 70% because she overweights speeches." 
    - They did not update based on each other because they anticipated the other's position. 
    - Now, chair asks: "Knowing that you both have the same evidence and prior, and that the only difference is this one interpretation, would you adjust your number?" 
      - Analyst A: "I see B's point, but I still think it's hawkish. I'll go to 60%."
      - Analyst B: "I see A's point, but I still think it's not. I'll go to 40%."
    - Gap narrowed from 40% to 20%. 
    - Chair: "Can we meet at 50%?" 
    - Both agree? If yes, then consensus. If not, then:
  - **Step 7: Verdict**
    - Disagreement due to interpretation of ambiguous evidence. 
    - Chair rules: We'll take the average of the two adjusted numbers: (60%+40%)/2 = 50%. 
    - **Termination:** Step 7 with a 50% house number. This is a classic compromise, but it might be defensible.

  **Case 3: Strike before contract deadline? (65% vs 15%)**
  - **Step 1: Event Alignment**
    - Analyst A (65%): Estimating a strike anywhere in the region.
    - Analyst B (15%): Estimating a strike by one specific union at one specific port.
    - They are different events! 
    - **Verdict:** This is two different events. We must redefine or publish two numbers.
    - Chair: "We must have a common event. Which one was intended by the question?" 
      - The original question: "Will there be a strike before the contract deadline?" is ambiguous. 
    - Chair rules: The intended event is a strike in the region (because that's what the client cares about). 
    - Analyst B must re-estimate for the region-wide event. 
    - Analyst B: "If it's region-wide, I would say 40% because other unions are less militant." 
    - Now we have 65% vs 40%. Proceed to next steps with the new numbers (but note: we've already redefined).
  - **Step 2: Shared Evidence Base**
    - They have the same evidence. Proceed.
  - **Step 3: Reasoning Transparency**
    - Analyst A (65%): Prior (base rate of strikes in similar negotiations) 50%. Recent breakdown in talks -> update to 65%.
    - Analyst B (now 40%): Same prior 50%. Breakdown in talks, but notes that the main union is under pressure to avoid a strike -> updates to 40%.
    - Difference in interpretation of the breakdown impact.
  - **Step 5: Evidence Re-Examination**
    - Focus on the breakdown. 
      - Analyst A: This breakdown is more severe than usual.
      - Analyst B: It's typical posturing.
    - They don't agree. 
  - **Step 6: Common Knowledge Check**
    - Not very productive. 
  - **Step 7: Verdict**
    - Disagreement due to different interpretations of the breakdown. 
    - Chair rules: We'll average (52.5% -> 50% or 55%) or use the base rate and update together. 
    - Since the prior was 50% and the evidence is ambiguous, the chair might say 50% is too vague and split the difference: (65+40)/2 = 52.5% -> 55% for the house. 
    - **Termination:** Step 7 with 55%. 

  **Flagged Misfires:**
  - Case 1: Step 7 requires chair judgment in a way that may be seen as arbitrary (choosing 25% with a note). In the room, the analyst with private info may feel ignored, and the other may feel overruled. The note might not satisfy the boss.
  - Case 2: Step 5 (Evidence Re-Examination) can get stuck on subjective interpretations. The chair may have to make a call without expertise, which is uncomfortable.
  - Case 3: Step 1 caught the event mismatch, but if the chair redefines the event, one analyst must re-estimate on the fly, which is error-prone. This step is critical and may misfire if the analysts don't realize they have different events until later.

  We designed the procedure to be robust but note: in practice, the chair must be skilled in facilitating and making judgment calls, especially in Step 7.
answer: |-
  ### Reconciliation Procedure for Probability Disagreements  
  **Core Principles**: Diagnose the root cause of disagreement in 45 minutes without math. Force transparency, align assumptions, and resolve or legitimize differences. Exit early if possible. Chair has final authority in Step 7.  

  ---

  #### **Step 0: Pre-Work** (Done before meeting)  
  - **Chair Action**: Send analysts a template:  
    - "Define the event in one sentence."  
    - "List your top 3 reasons for your number."  
    - "Flag any constraints (e.g., undisclosable sources)."  
  - **Why**: Surface event mismatches or private info upfront. Saves time.  

  ---

  #### **Step 1: Event Alignment**  
  - **Question**: "Analyst A, read your event definition. Analyst B, read yours. Are these identical? If not, where do they diverge?"  
  - **Sufficient Answer**: Both verbally confirm/deny alignment. If mismatch, specify the difference (e.g., timeframe, scope, success criteria).  
  - **Chair Action**:  
    - If aligned → Proceed to Step 2.  
    - If misaligned → Negotiate a common definition (e.g., "We all mean 'X'"). If impossible, **exit with verdict**: "Publish two numbers with explanations."  
  - **Exit Condition**: Verdict if event mismatch. Else, proceed.  
  - **Judgment Call**: Chair must push for a practical compromise on definitions. Junior editors can do this with training.  

  ---

  #### **Step 2: Shared Evidence Inventory**  
  - **Question**: "List every piece of evidence you both used. Then, Analyst A: What does B know that you don’t? Analyst B: Same for A. *Do not share sensitive content—just existence.*"  
  - **Sufficient Answer**:  
    - Shared evidence: Concrete items (e.g., "Gov. speech on May 1," "Q2 GDP report").  
    - Asymmetric evidence: "B has a source I can’t access," "A saw a tweet I missed."  
  - **Chair Action**:  
    - If no asymmetric evidence → Proceed to Step 3.  
    - If asymmetric evidence → Note it and ask: "Analyst without this, would knowing it *exists* change your number?" If "yes," **exit with verdict**: "Disagreement due to private information. Publish the higher number with a footnote*."  
  - **Exit Condition**: Verdict if private info explains the gap. Else, proceed.  
  - **Why**: Filters out disagreements where Aumann’s assumptions fail. Footnote: *"Assessment incorporates non-public information."  

  ---

  #### **Step 3: Prior Elicitation**  
  - **Question**: "What base rate or starting assumption did you use? Analyst A first, then B."  
  - **Sufficient Answer**: A specific number or source (e.g., "30% from historical treaties," "50% ignorance prior").  
  - **Chair Action**:  
    - If priors differ → Ask: "Can you both accept [neutral prior, e.g., historical base rate]? If yes, recalculate on the spot from that prior."  
    - If same or reconciled priors → Proceed to Step 4.  
    - If irreconcilable → **Exit with verdict**: "Disagreement due to priors. Split the difference unless one prior is indefensible^."  
  - **Exit Condition**: Verdict if prior difference persists and can’t be reconciled. Else, proceed.  
  - **Judgment Call**: Chair must enforce a neutral prior (e.g., 20-year average) if analysts deadlock. **Predecessor’s Trick Verdict**: Legitimate. Forcing a shared prior operationalizes Aumann’s assumption. Not a cheat—it resolves a common failure mode.  

  ---

  #### **Step 4: Update Rationale**  
  - **Question**: "Walk us through your biggest update. Analyst A: What evidence moved you most from your prior? Analyst B: Same."  
  - **Sufficient Answer**: Isolate 1–2 key updates (e.g., "Sanctions threat moved me from 30% to 60%").  
  - **Chair Action**:  
    - If updates conflict (e.g., same evidence interpreted oppositely) → Proceed to Step 5.  
    - If updates align directionally but differ in magnitude → Proceed to Step 6.  
  - **Exit Condition**: No verdict here—routes to next step.  

  ---

  #### **Step 5: Evidence Re-Anchoring** (Skip if Step 4 updates align)  
  - **Question**: "Analyst A, why did evidence X move you more than B? Analyst B, why less? Quantify: If X were false, what would your number be?"  
  - **Sufficient Answer**: Subjective weights (e.g., "X is 80% of my case") or counterfactuals (e.g., "If X false, I’d be at 10%").  
  - **Chair Action**:  
    - If gap narrows >50% after counterfactuals → Ask: "Can you agree on a joint weight for X?" If yes, recalculate jointly.  
    - If no progress after 10 min → **Exit with verdict**: "Fundamental interpretation difference. Split the difference."  
  - **Exit Condition**: Verdict if no compromise. Else, proceed to Step 6 with new numbers.  

  ---

  #### **Step 6: Common Knowledge Check**  
  - **Question**: "Analyst A, what number do you think B *should* assign given their stated evidence? Analyst B, same for A. Now, does knowing their answer change your number?"  
  - **Sufficient Answer**: Each states what the other "should" believe and updates (or not) in real-time.  
  - **Chair Action**:  
    - If both update toward consensus → Push for agreement.  
    - If no convergence → **Proceed to Step 7**.  
  - **Exit Condition**: No verdict—routes to Step 7.  
  - **Why**: Catches "modeling the other’s rhetoric, not beliefs."  

  ---

  #### **Step 7: Adjudication & Verdict**  
  - **Question**: "We have [minutes] left. Based on Steps 1–6, the gap is due to [summarize cause]. I propose we publish [number]. Any objections?"  
  - **Sufficient Answer**: Explicit buy-in or structured objection (e.g., "That ignores my source!").  
  - **Chair Action**:  
    - If private info → Publish higher number with footnote.  
    - If priors/interpretation → Average or chair’s judgment call.  
    - If non-coherent updating → Chair overrules suspect number.  
    - If time expires → Chair decides unilaterally.  
  - **Exit Condition**: **Always produces a verdict**. Final house number or split.  
  - **Judgment Call**: Pure chair authority. **Never delegate to juniors**.  

  ---

  ### **Run on Cases**  
  **Key**: ⚠️ = Procedure misfire risk.  

  #### **Case 1: Armistice Signed by End Q3? (20% vs. 60%)**  
  - **Step 1**: Events aligned ("signing by Sept 30"). Proceed.  
  - **Step 2**: Asymmetric evidence found. Analyst B: "I have non-disclosable sources." Analyst A: "Knowing this exists, I’d move to 30%."  
    - **Verdict**: Disagreement due to private information. **Publish 45% with footnote**.  
    - **Termination**: Step 2 (early exit).  
    - **Why**: Saves time; legitimizes B’s source without disclosure.  
    - **⚠️ Misfire**: Analysts may resist "early exit" if they want to argue. Chair must enforce.  
    - **You’ll Hate This**: Boss sees footnote as weak, but it’s honest. Publishing two numbers isn’t feasible here (firm policy).  

  #### **Case 2: Central Bank Hike in June? (70% vs. 30%)**  
  - **Step 1**: Events aligned. Proceed.  
  - **Step 2**: No asymmetric evidence. Proceed.  
  - **Step 3**: Same prior (20-year hike rate: 25%). Proceed.  
  - **Step 4**: Key update = governor’s speech. A: "Hawkish → 70%." B: "Hedging → 30%." Proceed to Step 5.  
  - **Step 5**: Counterfactuals: A: "If speech boilerplate, I’d be at 40%." B: "If speech hawkish, I’d be at 50%." Gap narrows (40% vs. 50%).  
  - **Step 6**: A thinks B "should" be at 50%. B thinks A "should" be at 40%. Both hold firm. Proceed to Step 7.  
  - **Step 7**: Chair summarizes: "Interpretation difference on ambiguous evidence." Proposes 45%. Both accept. **Publish 45%**.  
    - **Termination**: Step 7.  
    - **⚠️ Misfire**: Step 5 counterfactuals feel artificial. Analysts might game them ("I’d only move to 39%!").  

  #### **Case 3: Strike Before Deadline? (65% vs. 15%)**  
  - **Step 1**: Event mismatch! A: "Strike anywhere in region." B: "Specific port/union."  
    - **Verdict**: Different events. **Publish two numbers**: "Region-wide strike: 65%"; "Port X strike: 15%."  
    - **Termination**: Step 1 (early exit).  
    - **Why**: Legitimate disagreement; no reconciliation needed.  
    - **⚠️ Misfire**: Analysts might insist they "meant the same thing." Chair must be ruthless on definitions.  

  ---

  ### **Final Notes**  
  - **When It Works**: Resolves Cases 2 and 3 cleanly. Diagnoses Case 1 correctly (you can’t force disclosure).  
  - **When It Fails**: Private info (Case 1) forces a compromise you dislike. Step 7 is brutal—blame the theorem, not yourself.  
  - **Upgrade Tip**: Record sessions. If analysts "game" steps (e.g., sandbagging in Step 5), use past recordings to pressure them.  
  - **Time Saver**: 70% of disputes exit by Step 3. Invest remaining time in Step 7 deliberation.  

  **Chair Mantra**: "Aumann says you can’t rationally disagree *if* [assumptions]. My job is to test those ifs."
