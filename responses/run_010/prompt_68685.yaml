prompt: |-
  I'm 68, spent thirty-odd years modeling rivers and reservoirs for a state water agency, and since I retired I've been reading philosophy — mostly ethics — and I've gotten completely stuck on the killing vs letting die thing. Everyone I read either defends the distinction or says it does no work, and both sides pull out one example and declare victory. I've read the bathtub pair, Smith drowning the cousin and Jones watching the same cousin drown for the same inheritance, and I take the point, but it's a point about one case. What I want before I read another article is the spec.

  So: what does a theory of doing vs allowing actually have to deliver to count as adequate? Purpose, since adequacy is relative to it — I want a theory good enough to sit underneath a real policy, the kind of thing that decides how a grid operator's or a triage team's choices get judged afterwards, not just good enough to win a seminar.

  Give me the requirements list: the phenomena it has to explain, the cases it has to come out right on, the distinctions it mustn't collapse, and the results from elsewhere — law, medicine, the empirical stuff about how people's judgments shift with framing — that it either has to be consistent with or has to explicitly reject. For each one give the consideration behind it, the case that makes you think its a requirement, not just a label. Then sort them: which are non-negotiable, and which are one camp's taste dressed up as a criterion. I suspect at least half of whatever list I'd write myself is the second kind, and I'd rather you say which half than agree with me.

  Some raw material, use it or push back:

  - Unplugging the aerator versus never plugging it in. Same tank, same dead fish an hour later, and as far as I can tell the same counterfactuals. Physically one is an event I injected and the other is me leaving the initial condition alone. Does a theory have to treat those differently, and if so, on grounds that aren't just my lifelong habit of writing equations with the forcing term on one side and the state on the other?
  - In my business a reservoir is always either relaxing toward some natural state or being held away from it by continuous work — pumps, gates, releases. Is "maintaining a system off equilibrium" a third category the theory owes me, or does it have to reduce? The clinician who stops a treatment that's holding a patient away from the trajectory the disease already set up — which is that?
  - Where in time does an omission live. Order signed in March, death in June. If the account needs to locate the allowing at a moment, that looks like trouble.
  - Right now I'm allowing an enormous number of harms by sitting here typing this. Any account that makes allowing the cheaper category owes me something about how many allowings there are at once and what that does to the cheapness.

  And flag anything on your list you think can't be jointly satisfied with something else on it. If some subset turns out to have no solution — the way a set of assumptions in a model just turns out to be inconsistent — tell me, because then the list is itself the result and that's the most useful thing you can hand me. A short scorecard at the end against two or three of the standard positions is fine, a couple of sentences each, but if you're not sure who held which view just describe the view rather than pinning it to a name. The requirements are what I actually want.
reasoning: |-
  Okay, the user is a retired water resource modeler with 30+ years experience, now diving deep into philosophy, specifically ethics around killing vs. letting die. He's frustrated with oversimplified examples and wants a robust framework for real-world policy applications like triage or infrastructure decisions. 

  First, I need to recognize his expertise - he thinks in systems, differential equations, and counterfactuals. His analogies (reservoirs, aerators) aren't just illustrations; they're ontological probes. When he asks where omissions "live" in time or whether maintaining disequilibrium is a third category, he's testing whether ethical theories can handle continuous systems. Classic philosophy often fails here by focusing on discrete events.

  His raw material reveals four pain points: 
  1) Physical indistinguishability with moral difference (aerator unplugging vs never plugging)
  2) Continuous intervention as a distinct category (reservoir pumps/medical life support)
  3) Temporal location of omissions (delayed consequences)
  4) Problem of promiscuous allowings (typing while others starve)

  He wants requirements for an "adequate" theory - not just academic but policy-useful. And he's suspicious of "tastes dressed as criteria." Smart. Most ethics debates smuggle in intuitions.

  So how to structure this? Need to separate bedrock requirements from negotiable ones. Bedrock should include: 
  - Explaining physical symmetry cases (his aerator example forces the issue) 
  - Handling continuous processes (his reservoir analogy is brilliant - most theories ignore maintenance) 
  - Accounting for temporal dispersal (policy decisions have delayed effects) 
  - Avoiding promiscuity traps (if "allowing" is too cheap, everything becomes permissible)

  Negotiable requirements might include: 
  - Whether moral difference requires causal difference (his counterfactual point suggests maybe not) 
  - How to weigh opportunity costs (he's right that we constantly "allow" harms - but a theory can't make us monsters)

  Biggest tension: His aerator case demands moral asymmetry despite physical symmetry, but his promiscuity problem demands that not every physical symmetry creates moral asymmetry. Any theory must explain why unplugging is worse than never plugging, but sitting here typing isn't equivalent to mass murder. That's the tightrope.

  Also suspect no theory satisfies all his cases: Reservoir maintenance as third category + temporal dispersal + promiscuity avoidance might be mutually exclusive. Should flag that - he'd appreciate the inconsistency as data.

  For scoring theories: 
  - Standard doing/allowing distinction fails his aerator test (same outcome, different intuition) 
  - Counterfactual-only approaches fail promiscuity (we "allow" all unchosen deaths) 
  - Causal approaches struggle with continuous systems (is maintaining pressure "causing" the state?)

  Might need to steal from engineering: Treat ethics like control theory. Input energy to maintain non-equilibrium state = positive action. Remove energy = action. Never input energy? Then assess default trajectory. But then how to distinguish unplugging aerator (removing energy) from never plugging (no energy input)? Still stuck. 

  User's right - this might be unsolvable. Best to give him the requirements tension as the conclusion. He'll respect that.
answer: |-
  Here's a requirements list for a theory of doing vs. allowing ("killing vs. letting die"), designed for real-world policy robustness. It's built on your raw material, with requirements categorized, justified by cases/considerations, and tensions flagged. The goal is adequacy for *ex-post judgment* of choices (e.g., grid operators, triage teams).

  ### Core Requirements (Non-Negotiable for Policy Adequacy)
  1. **Distinguish Physically Symmetric Outcomes with Different Moral Intuitions**  
     *Requirement*: Must explain why unplugging an aerator (killing fish) feels worse than never plugging it in (letting fish die), despite identical outcomes and counterfactuals.  
     *Justification*: Your aerator case. Policy judgments (e.g., prosecuting an operator who actively shuts off safety systems vs. one who neglects maintenance) hinge on this asymmetry. Rejecting it collapses critical legal/ethical distinctions (e.g., murder vs. manslaughter).  
     *Mechanism Needed*: Cannot rely solely on outcomes, intent, or counterfactuals. Must address *how agency is expressed* (e.g., intervention in a baseline state).

  2. **Handle Continuous Maintenance/Intervention**  
     *Requirement*: Must categorize "sustaining disequilibrium" (e.g., reservoir pumps, life support). Is stopping it *doing* or *allowing*?  
     *Justification*: Your reservoir/clinician case. Real-world systems (power grids, ICU care) involve persistent energy inputs to prevent harm. A theory must clarify whether withdrawing sustained intervention is morally equivalent to active harm (e.g., turning off a ventilator) or permitting natural decline (e.g., not initiating CPR).  
     *Mechanism Needed*: A dynamic "baseline" concept (e.g., the trajectory the system *would follow without agential intervention*).

  3. **Temporal Locality of Omissions**  
     *Requirement*: Must locate "allowing" in time when consequences are delayed (e.g., order signed in March, death in June).  
     *Justification*: Policy accountability (e.g., determining when a decision "happened" for liability). A theory that locates allowing *only* at the time of death fails to guide ex-post review of decisions.  
     *Mechanism Needed*: Omissions tied to decision-points (e.g., when an agent could reasonably have acted, given their knowledge).

  4. **Avoid Promiscuity of Allowings**  
     *Requirement*: Must not imply that by typing this, you are "allowing" all global harms simultaneously, rendering the category meaningless.  
     *Justification*: Your "sitting here typing" case. Policy requires prioritizing relevant omissions (e.g., a triage nurse isn’t negligent for failing to save someone across town).  
     *Mechanism Needed*: Scope constraints (e.g., duties tied to roles, proximity, or capacity). Must distinguish *failing to prevent* from *merely not preventing*.

  ---

  ### Contextual Requirements (Negotiable but Policy-Relevant)
  5. **Explain Framing Effects Empirically**  
     *Requirement*: Should align with or explain why people judge identical outcomes differently based on framing (e.g., "90% survival" vs. "10% death").  
     *Justification*: Psychology studies (e.g., Tversky/Kahneman) show framing shifts moral judgments. A policy-useful theory must either accommodate this or reject it as irrational.  
     *Tension*: Risk of privileging cognitive biases over normative truth.  
     *Status*: Negotiable – could be addressed separately by procedural policy (e.g., standardized decision frameworks).

  6. **Cohere with Legal Distinctions**  
     *Requirement*: Must not collapse distinctions underpinning law (e.g., commission vs. omission, murder vs. involuntary manslaughter).  
     *Justification*: Ex-post judgments occur in legal contexts. A theory that equates unplugging the aerator with never plugging it undermines jurisprudence.  
     *Tension*: Law may be wrong, but policy needs predictability.  
     *Status*: Non-negotiable if policy operates within legal systems; negotiable for ideal theory.

  7. **Role-Dependent Duties**  
     *Requirement*: Must incorporate how obligations differ by role (e.g., a grid operator vs. a bystander).  
     *Justification*: Triage/clinician cases – stopping life support is judged differently for a doctor (role-bound duty) vs. a random person.  
     *Status*: Negotiable – could be handled by auxiliary role-ethics, but integration strengthens policy relevance.

  ---

  ### Tensions and Inconsistencies
  - **Aerator vs. Promiscuity**: A theory satisfying (1) (treating unplugging ≠ never plugging) risks violating (4) if it ties allowing to "failing to improve a baseline state" – since you constantly "fail" to improve global states.  
    *Resolution?* Requires a restricted baseline (e.g., only deviations from *expected* or *role-required* states count).
    
  - **Continuous Maintenance vs. Temporal Locality**: If maintaining disequilibrium (2) is "doing," stopping it might be "allowing" a return to baseline. But when does the "allowing" occur? At shutdown (March) or outcome (June)? (3) demands it be March, but intuitions may blame more strongly at June.  
    *Resolution?* Decouple the *act of cessation* (doing: March) from the *outcome* (allowing death: June).

  - **Fatal Tension?** **Physical Symmetry + Dynamic Baselines**: If the aerator's "natural state" is unplugged, unplugging is allowing, but never plugging is also allowing. This *collapses the distinction*, violating (1). To satisfy (1), the theory must assign different baselines (e.g., "plugged-in" as the agent-established state). But this risks violating (4) by creating endless duties (e.g., once you plug in, you can't unplug without "killing").  
    *No clean solution* – this may require accepting moral residue (unplugging is permitting, but with greater culpability due to prior intervention).

  ---

  ### Scorecard Against Standard Views
  - **Doing/Allowing as Causal Difference**:  
    Fails (1) (same causation in aerator case), (2) (maintenance is causal but ambiguous), and (4) (causal promiscuity). Strong on (6) if law uses causation.  
  - **Counterfactual-Only Views**:  
    Fails (1) (same counterfactual: fish die either way), (4) (you "allow" all deaths you don't prevent), and (2) (counterfactual for stopping maintenance is death).  
  - **Normative Baselines (e.g., "expected state")**:  
    Satisfies (1) (unplugging changes the status quo), (2) (maintenance sustains non-baseline), and (3) (omission at decision-point). Struggles with (4) (must define baseline narrowly, e.g., role-specific duties). Best fit, but baseline definition is contested.  
  - **Volitional Views (focus on agency's "exercise")**:  
    Satisfies (1) (unplugging is an exercise of agency; never plugging isn't). Struggles with (2) (is *not* adjusting pumps "exercising" agency?) and (3) (when is omission "volitional"?).

  ---

  ### Conclusion
  An adequate policy-facing theory **must** handle the aerator asymmetry (1), dynamic maintenance (2), decision-point temporality (3), and promiscuity (4). The fatal tension is between (1) and a purely physical/outcome-driven view – **any theory satisfying (1) needs a non-physical moral distinction** (e.g., normative baselines or agency expression). The best candidate is a **role-constrained normative baseline theory** (e.g., "what did the agent's role require as the default state?"), though it risks over-generating duties. If this feels unsatisfying, it’s because the aerator case (1) *demands* moral asymmetry without physical difference – and that’s the core puzzle no theory fully resolves. Your list *is* the result: the tension between (1), (2), and (4) exposes why the debate persists. For policy, adopt a baseline view + explicit role duties, and accept that unplugging is worse because it *terminates an agent-sustained state*.
