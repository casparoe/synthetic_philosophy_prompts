  ### **Decision Tree for Pascal's Political Thought**

  #### **Q1: In the case of two communities on either side of a river with contradictory property customs, does Pascal imply that these customs reflect an underlying true justice (even if inaccessible), or that "justice" here is purely an effect of custom?**  
  - **A: Yes, true justice exists** (even if obscured by custom) → Proceed to Q2.  
  - **B: No, justice is purely an effect of custom** (no deeper standard) → Proceed to Q5.  

  #### **Q2: In the case of a law you are confident is unjust within a settled order, does Pascal think unaided human reason can access true justice to judge it?**  
  - **A: Yes, reason can access true justice** → **Unoccupied**. *Why?* Pascal explicitly denies unaided reason's capacity post-Fall (e.g., Pensées 294, 375); no coherent reading affirms this.  
  - **B: No, reason cannot access true justice** → Proceed to Q3.  

  #### **Q3: For the unjust law in Q2, what primarily grounds Pascal's insistence on public obedience?**  
  - **A: Prudence** (to avoid civil war, the worst evil) → **Political-realist reading**.  
  - **B: Custom's inherent authority** ("received" tradition commands reverence) → **Traditionalist reading** (Pascal sides with those who revere established law).  
  - **C: Theological duty** (submission to God's ordained order post-Fall) → **Fideist reading**.  

  #### **Q4: For the conqueror's redistributed land now accepted by all, does Pascal suggest the new titles are partly just, or merely obeyed?**  
  - *This question refines Q3 for unresolved paths. If you reached Q3 and answered A/B/C, skip Q4. If you deferred, use it:*  
    - **A: Partly just** (custom confers legitimacy) → **Traditionalist reading**.  
    - **B: Merely obeyed** (force made "just" via imagination) → **Political-realist reading**.  

  #### **Q5: In the case of the usurper's regime (stable for three generations), is Pascal's claim that "we made what is strong just" primarily:**  
  - **A: Genealogy** (exposing justice as an illusion masking force) → **Genealogical reading** (deflationary: no room for justice).  
  - **B: Justification** (endorsing obedience to stable orders) → **Quietist conventionalism**.  
  - **C: Diagnosis of imagination** (showing how authority is sustained by delusion) → Proceed to Q6.  

  #### **Q6: Does Pascal lament the gap between true justice and human systems?**  
  - **A: Yes** (implying true justice exists) → **Fideist reading**.  
  - **B: No** (justice is entirely constructed) → **Genealogical reading**.  

  ---

  ### **Tree Logic and Notes**  
  1. **Key Sorting Node**:  
     - **Q1** does the most work. It separates readings affirming true justice (fideist, traditionalist, realist) from those denying it (genealogical, quietist). This reflects Pascal's tension between lamenting inaccessible justice and reducing justice to custom/force.  

  2. **Unresolved Pairs**:  
     - **Political-realist and Genealogical readings** agree on first-order verdicts (e.g., obey the usurper, accept the conqueror's land) but diverge on whether Pascal sees this as tragic. They are separated by **Q1** (realist: true justice exists; genealogical: it does not). If ambiguity remains, **Q6** clarifies: realists see tragedy (implying true justice), genealogicals do not.  
     - **Fideist and Traditionalist readings** are separated cleanly by **Q3** (theology vs. custom's authority).  

  3. **Unoccupied Branches**:  
     - Q2A ("reason can access true justice") is unoccupied. *Why?* Pascal’s fragments (e.g., Pensées 131, 375) explicitly state reason is too corrupted by the Fall to grasp justice without grace, making this incoherent with his epistemology.  
     - Q5C ("diagnosis of imagination") defaults to other leaves: if combined with belief in true justice (from Q1), it becomes **fideist**; if without, it becomes **genealogical**.  

  4. **Least Confident Leaf**:  
     - **Quietist conventionalism** (Q5B). *Why?* Pascal’s texts blur quietism (accept custom uncritically) and theology (submit because God permits usurpers). A fragment like Pensée 294 ("Custom is the whole basis of equity...") could support quietism if read literally but fits traditionalism/fideism if custom is divinely tolerated. *What would move me?* If Pascal’s line "we made what is strong just" is purely prescriptive (justification) rather than diagnostic (genealogy), quietism gains ground.  

  5. **Contested Readings Relied Upon**:  
     - **Q1** assumes Pascal’s "two communities" case (Pensée 294) implies relativism, but traditionalists/fideists argue it shows only human *inability* to access true justice. I lean on the fragment’s plain text: "on the other side of the river, they laugh at" opposing customs, suggesting justice is local.  
     - **Q3** assumes a clean split between prudence, custom, and theology. Some readings blend these; I treat them as distinct based on emphasis in key fragments (e.g., Pensée 298 for prudence vs. 294 for custom vs. 877 for theology).  

  ---

  ### **How Cases Map to Questions**  
  - **Two communities/river customs (Q1)**: Tests if justice transcends custom.  
  - **Unjust law in settled order (Q2, Q3)**: Probes accessibility of justice and obedience grounds.  
  - **Usurper’s regime (Q5)**: Clarifies if "making strong just" is genealogy/justification.  
  - **Conqueror’s land (Q4)**: Distinguishes whether custom confers legitimacy (traditionalist) or mere stability (realist).  

  This tree isolates core disagreements while respecting Pascal’s ambiguity. It rewards close engagement with the fragments and highlights where interpretations diverge on first-order judgments.
