  Below is a decision tree designed to sort readers into named interpretations of Pascal's political thought based on the specified fragments. The tree uses concrete cases to guide decisions without presupposing knowledge of interpretive schools. It focuses on distinctions readings tend to collapse (existence of true justice, accessibility to reason, grounds for obedience, and the role of the "making the strong just" remark). **Instructions for use:** Start at the root (Q1) and answer based on your reading of Pascal's fragments. Proceed to branches until you reach a leaf (interpretation).

