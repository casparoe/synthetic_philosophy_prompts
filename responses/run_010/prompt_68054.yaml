  I need to structure this as a neutral document with five required components: (1) shared claims, (2) precise disagreements, (3) identification of verbal disputes, (4) crucial test points (cruxes), and (5) specific predictions for each crux. The functionalist can't use "functionally identical" as an undefined term - I must specify the level of description.

  For the shared claims, both sides agree that gradual replacement is physically possible and that behavioral indistinguishability doesn't resolve subjective identity questions. They also accept that during lockstep, both systems are active simultaneously.

  The disagreements center on three points: whether processing speed affects identity, what level of description matters for functional equivalence, and whether the lockstep phase creates two subjects of experience. The speed issue seems partly verbal - "the same process" might refer to abstract computation versus concrete implementation.

  The crucial test points (cruxes) are: whether processing speed variations alter subjective experience, whether temporal grain affects functional identity, and whether duplicate realizers create competing claims to identity. For each crux, I'll outline what evidence would be relevant and both sides' predictions.

