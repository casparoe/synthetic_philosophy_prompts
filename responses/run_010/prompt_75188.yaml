prompt: |-
  I am drafting a short position statement for a seminar on the ethics of harming, and I would like a consistency audit before I circulate it. Here is the package, as I currently hold it:

  1. The doctrine of double effect states a real constraint rather than a rationalization: an act with a foreseen grave harm may be permissible when that harm is not intended and the reason for acting is proportionately serious, but it is impermissible when the harm falls within what the agent intends, whether as an end or as a means.

  2. The terror bomber acts impermissibly and the tactical bomber permissibly, even though each foresees precisely the same civilian deaths.

  3. Diverting the trolley is permissible; pushing the man from the footbridge is not. In the loop variant, where the track rejoins itself and the one man's body is what prevents the trolley from circling back onto the five, diverting remains permissible.

  4. I am unmoved by the closeness objection, that is, the charge that an agent can always describe her intention narrowly enough to slip past the doctrine. For the same reason I think Quinn's recasting of the doctrine in terms of direct and indirect agency is a relabeling exercise that adds nothing to the classic intending-versus-foreseeing formulation, which I prefer.

  5. Craniotomy to save the mother is impermissible, and not because the death is intended: what the surgeon aims at is the reduction of the child's skull, and the death stands far too close to that aim for the intending/foreseeing line to be crossed honestly.

  6. Escalating opioids for an imminently dying patient are permissible even when they foreseeably hasten death. I also hold that the distinction between doing and allowing is not reducible to double effect.

  Which pairs are genuinely in tension, and which only appear to be? Please rank the tensions by severity rather than treating them as equally bad, and for each identify what would have to be revised or abandoned and what that revision costs me elsewhere. Close by naming the single change that would repair the largest share of the package.
reasoning: |-
  Okay, let me approach this ethics consistency audit methodically. The user presents a tightly argued position on double effect doctrine and related cases, requesting identification of tensions with severity ranking and repair strategies. 

  First, I notice the user is clearly well-versed in ethical philosophy - their package references Quinn's objections, trolley variants and medical ethics cases with precision. They're likely an academic preparing for seminar scrutiny. The request for "consistency audit" suggests they value logical coherence over rhetorical appeal.

  Looking at the six propositions, I see three main pressure points forming triangular tensions: 

  The craniotomy case (#5) seems most vulnerable. Claiming death "stands far too close" to skull reduction while rejecting Quinn's direct/indirect framing (#4) creates friction. If physical proximity matters in craniotomy, why reject spatial closeness arguments elsewhere? This threatens to unravel the whole framework. 

  The opioid case (#6) presents softer tension. If foreseeably hastening death is permissible here but not in tactical bombing (#2), we need clearer criteria for proportionality - which the user mentions but doesn't define. The doing/allowing distinction mention hints they sense this isn't fully resolvable by double effect alone.

  The loop variant trolley case (#3) has subtle issues. Defending permissibility when the man's body becomes instrumental contradicts the footbridge principle. Calling it "diverting" feels semantic when the mechanism is physically identical to pushing. But this might be the easiest fix through case reclassification.

  For repair priority, I'd suggest refining craniotomy's justification since it currently relies on undefined proximity metrics that conflict with their rejection of closeness objections. Either adopting a modified Quinn-style analysis or more precise intention description would patch this without abandoning core principles. The opioid tension can wait as it involves separable doing/allowing considerations.

  Throughout, I should maintain academic rigor but avoid pedantry - the user wants actionable improvements, not just problem-spotting. Highlighting where their strongest intuitions (like loop trolley permissibility) might need conceptual sacrifice would demonstrate genuine engagement with their framework.
answer: |-
  Here's a consistency audit of your position statement, ranking tensions by severity and suggesting potential repairs:

  **Ranked Tensions (Highest to Lowest Severity):**

  1.  **#5 (Craniotomy) vs. #1 & #4 (Core DDE & Rejection of Closeness/Quinn)**
      *   **Severity:** **High.** This is the most significant internal tension.
      *   **Nature of Tension:** Your justification for the impermissibility of craniotomy hinges critically on the concept of the death "stand[ing] far too close to [the] aim" (skull reduction). This directly invokes a notion of *causal or descriptive closeness* between the intended act (skull crushing) and the bad effect (death).
      *   **Conflict:**
          *   This directly contradicts your rejection of the "closeness objection" (#4), where you argue agents *cannot* narrowly describe intentions to evade DDE. Your craniotomy argument *requires* a judgment about the closeness/causal intimacy of the harm to the intended act to block a narrow description of intention ("I intend only to reduce the skull, death is a side effect").
          *   It also implicitly relies on a reasoning very similar to Quinn's "direct/indirect agency" distinction (#4), which you dismiss as mere relabeling. Your argument that death is "too close" effectively labels craniotomy as involving "direct" agency regarding death, making DDE inapplicable.
      *   **Resolution Required:** You must either:
          *   **(A) Revise Craniotomy Justification:** Find a way to condemn craniotomy *without* relying on "closeness" or Quinn-like reasoning. This is difficult. You could argue the death *is* intended as a means (making the head small enough *to pass* requires the head to be non-viable) or as part of the end state (a deliverable mother requires a dead child). But this requires stretching "intention" significantly and contradicts your specific claim that the aim is *only* skull reduction.
          *   **(B) Revise Position on Closeness/Quinn (#4):** Acknowledge that some concept of causal intimacy or directness *is* necessary to distinguish genuine side effects from effects that are, in practice, inseparable from the intended act/means. This weakens your defense against the closeness objection but provides a principled basis for condemning craniotomy. You could argue Quinn's framework *captures* this necessary distinction better than the classic formulation alone.
      *   **Cost:** (A) Risks making the craniotomy condemnation seem arbitrary or unconvincing. (B) Requires abandoning a core part of #4, weakening your defense of the classic formulation and potentially opening the door to more "closeness" arguments elsewhere.

  2.  **#3 (Loop Trolley) vs. #1 & #2 (Core DDE & Tactical Bomber)**
      *   **Severity:** **Moderate.** This challenges the application of the "intended as a means" criterion.
      *   **Nature of Tension:** In the Loop Case, diverting the trolley *causes* the one man's death by making his body physically block the track *to save the five*. His death is the physical mechanism stopping the trolley, just as pushing the fat man is the mechanism in the footbridge case.
      *   **Conflict:** It's hard to see how the one man's death in the loop case isn't *intended as a means* to save the five. His body *is* the barrier; his death *is* the necessary mechanism to achieve the good end, just as the fat man's body is on the footbridge. Allowing the loop case while condemning the footbridge seems inconsistent under DDE's prohibition on intending harm as a means.
      *   **Resolution Required:** You must either:
          *   **(A) Condemn the Loop Case:** Argue that using the man's body *as* the barrier means his death *is* intended as the means of stopping the trolley, making it impermissible. This aligns with Footbridge and Tactical Bomber but requires abandoning the common intuition (which you hold) that diverting is permissible.
          *   **(B) Refine "Intended as a Means":** Argue that diverting in the loop case merely *foresees* that the man's body *will be used* by the situation (the track, gravity, momentum) as a barrier, but the agent *intends* only to divert the trolley onto a track where its path *will be blocked*. The death itself is a foreseen but unintended consequence of that block *being a person*. This is a subtle distinction and requires careful phrasing to avoid collapsing into the closeness argument you reject.
      *   **Cost:** (A) Costs you a strong intuitive case (#3). (B) Risks appearing ad hoc or vulnerable to the closeness objection (#4), especially compared to the clear means-use in Footbridge.

  3.  **#6 (Opioids) vs. #5 (Craniotomy) - Proportionality & Closeness**
      *   **Severity:** **Low-Moderate.** Highlights potential inconsistency in applying proportionality/closeness.
      *   **Nature of Tension:** Both involve medical interventions where a life-saving/good effect is sought and death is a highly likely/foreseen consequence closely linked to the act. You permit opioids (death foreseen, not intended) but forbid craniotomy (death foreseen, deemed "too close").
      *   **Conflict:** The justification for the difference appears to rely heavily on the "closeness" argument used in #5, which is already in tension with #4. Without that closeness argument, the permissibility distinction relies more heavily on the *nature* of the act (palliation vs. destructive intervention) and proportionality (imminent death vs. potential life for both). However, proportionality is stated as a *condition* in DDE (#1), not the primary *distinguisher*. The core distinction in your framework is intention.
      *   **Resolution Required:** Primarily resolved by successfully resolving the #5 vs #1/#4 tension. If closeness is necessary for #5, it needs to be applied consistently. If intention alone is sufficient, then the difference must lie in a clear argument that death *is* intended in craniotomy but not in palliative care. Your current description of craniotomy ("aims at... reduction") attempts this, but the "too close" remark undermines it.
      *   **Cost:** This tension is largely derivative of the higher-ranked #5 vs #1/#4 tension. Resolving that should resolve this.

  4.  **#6 (Opioids) vs. #1 (Core DDE) - Proportionality Scope**
      *   **Severity:** **Low.** A clarification point.
      *   **Nature of Tension:** You state DDE requires a "proportionately serious" reason (#1) for permitting foreseen harm. In #6, the reason is relieving suffering in an *imminently* dying patient. The proportionality here seems different in kind from the reasons in Tactical Bombing (military objective) or Trolley (saving lives).
      *   **Conflict:** None *if* you interpret "proportionately serious" broadly enough to encompass the relief of severe suffering in the terminally ill, even when life-shortening is foreseen. The tension is only apparent if one assumes proportionality must always involve weighing lives saved against lives lost.
      *   **Resolution Required:** Clarify that proportionality in DDE can involve weighing different kinds of goods (e.g., relief of severe suffering) against foreseen harms (e.g., hastening death), especially when the patient's death is imminent and unavoidable regardless.
      *   **Cost:** Minimal. Requires ensuring your proportionality principle is sufficiently broad.

  **The Single Change Repairing the Largest Share:**

  **Revise the justification for condemning craniotomy (#5) to eliminate reliance on "closeness" and instead argue convincingly that death *is intended as a means*.**

  *   **Why it repairs the most:** This directly addresses the **High Severity** tension (#5 vs #1/#4) without requiring you to abandon your core defense of the classic DDE formulation and rejection of the closeness objection/Quinn (#4). It also indirectly alleviates the **Low-Moderate Severity** tension with Opioids (#6) by grounding the distinction firmly in intention, not closeness/proximity. It leaves the **Moderate Severity** Loop Trolley tension (#3) unresolved, but that is a less fundamental challenge to your core DDE formulation than the craniotomy issue.
  *   **How to Do It:** Argue that the surgeon reducing the skull *intends* the child's non-viability (death) *as the means* to achieve the space necessary for delivery. The act of crushing the skull isn't done for its own sake; it's done *so that* the head is small enough *to pass*, which requires it to be crushed *to the point of lethality*. The death is not a side effect of creating space; it is the *mechanism* by which the space is created *in this specific, destructive act*. Focus on the *functional role* of the harm in achieving the goal.
  *   **Cost:** Requires a stricter interpretation of "intending as a means." It might make condemning the Tactical Bomber easier (they clearly intend civilian terror as a means to victory), but could make defending the Loop Trolley case harder (if the death *is* the functional means of blocking the trolley). It demands careful articulation to avoid collapsing into describing *how* the means works (which might invoke closeness). It may conflict with your specific phrasing "what the surgeon *aims at* is the reduction of the child's skull" if "aims at" is equated purely with the *physical motion*, divorced from its purpose. You need to link the physical act inextricably to its lethal purpose in achieving the goal.

  By anchoring the craniotomy condemnation firmly within the "intended as a means" prohibition of the classic DDE formulation, you resolve the most damaging internal inconsistency while preserving the core structure of your position.
