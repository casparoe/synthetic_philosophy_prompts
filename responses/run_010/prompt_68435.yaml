  ### Honest Notes  
  1. **Key Feature**: Non-additive synergy (threshold effect). Two sharers needed to liquefy carcass; one cannot.  
  2. **Remove Non-Additivity**: Make benefit additive. Suppose each S provides +0.75 offspring to all patch-mates (including self?), but pays cost c=1. To avoid self-benefit, say: each S increases others' offspring by b, but not its own.  
     For fairness, set b such that when one S, N get benefit b, S gets baseline - c.  
     Baseline: 3 for all.  
     With k S:  
     - Each N gets 3 + (k × b)  
     - Each S gets 3 - c + (k-1) × b? Or only others. Standard: altruism benefits others.  
     Set: W_N = 3 + (k b)  (since k S benefit each N)  
     W_S = 3 - c + k b? But then if b>0, S gets benefit from self, not altruism.  
     Correct: W_S = 3 - c + (k-1) b  (benefits from other S)  
     W_N = 3 + k b  
     For within-patch disadvantage: when k=1, W_S=3-c, W_N=3+b. Require 3-c < 3+b always, but c>0.  
     Condition 1: in mixed patch, W_S < W_N.  
     With k S: W_S - W_N = [3-c+(k-1)b] - [3 + k b] = -c -b <0, always holds.  
     Now global W_S and W_N.  
     Avg W_S = E[3 - c + (k-1)b] = 3 - c + b E[k-1] = 3 - c + b (4p -1)  (since E[k]=4p)  
     Similarly, W_N = 3 + b E[k] = 3 + 4b p  
     Set W_S > W_N for global increase:  
     3 - c + b(4p -1) > 3 + 4b p  
     → -c + 4b p - b > 4b p  
     → -c - b > 0, impossible since c,b>0.  
     **Thus, conditions 1 and 2 cannot both hold additively**.  
  3. **Gene’s-Eye Defense**: "The trait is not altruistic; it’s selfish because bearers have higher average fitness. The ‘cost’ is local, not global. Groups are not causal; the trait spreads because S-individuals happen to be in productive patches."  
     - **Rebuttal**: The defense succeeds *only if* we define altruism by *global* fitness reduction. But standardly (per Hamilton), altruism is defined by *local* disadvantage (within the group/interaction). Here, S *is* locally disadvantageous but globally advantageous due to population structure. The gene’s-eye view correctly predicts spread but denies group agency.  
  4. **Darwinian Individuality**: Patches lack reproduction ("bottleneck"), heritable variation, or group-level fitness. They are not Darwinian individuals. **Verdict unchanged**: MLS1 does *not* require groups to be individuals; it requires fitness variance at the group level.  

  This case satisfies all specifications: synergy creates a scenario where altruism spreads despite zero relatedness, forcing frameworks apart on causal description but not on predicted outcome.
