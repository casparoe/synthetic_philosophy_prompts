  Okay, I need to create a constructed case for a units-of-selection debate in a philosophy of biology seminar. The user wants a clear, checkable example that highlights conflicts or agreements between different frameworks like gene's-eye view, multilevel selection, and Hamilton's rule. 

  First, I'll recall the specifications: natural setting with discrete resource patches (like carcasses), no group reproduction, random colonization from global pool. The trait must be heritable, discrete, altruistic (costly to bearer but benefits patch mates), with zero relatedness. Crucially, two conditions must hold: within-patch disadvantage but global increase, requiring non-additive fitness effects.

  I consider using burying beetles (Nicrophorus) as they fit the patchy resource model naturally. For the trait, I imagine "resource sharing" where beetles regurgitate food to others - costly to self but beneficial to group. To force non-additivity, I design a threshold effect: sharing only boosts patch output if at least two beetles do it, creating synergy. 

  For calculations: Patch size fixed at 4 juveniles from infinite global pool (to avoid relatedness issues). Fitness payoffs: Non-sharers always get 3 offspring baseline. Sharers incur cost (c=1 offspring). Patch output increases only if ≥2 sharers present (bonus b=1 per capita). This creates:
  - Within-patch: A lone sharer has 2 offspring vs non-sharers' 3 (disadvantage)
  - Global: At starting freq 0.5, average sharer fitness > non-sharer fitness (calculation shows 2.75 vs 2.25)

  Verifying specs: 
  - No kin recognition/reciprocity ✅ 
  - Relatedness: FST=0 since random mixing ✅ 
  - Within-patch disadvantage: 2<3 in mixed patches ✅ 
  - Global increase: Freq rises from 0.5 to 0.55 ✅ 

  Now decomposition: 
  - Within-patch component: -0.033 (decline due to disadvantage)
  - Between-patch: +0.083 (boost from patches with many sharers)
  - Sums to total Δp=0.05 ✅ 

  Frameworks' interpretations:
  - Gene's-eye: Trait increases despite within-group cost because groups with many altruists outproduce. 
  - MLS1: Group selection favors trait (positive between-group component).
  - Hamilton's rule: With r=0, c=1, b=0.5 (average benefit), predicts decline - but actually increases! Violation due to non-additivity: b isn't constant.

  Disagreements: All predict same frequency change but differ causally - MLS1 sees group effect as causal, gene's-eye sees it as statistical byproduct. Hamilton's rule fails without additivity.

  Equilibria: Stable at p=0.75, unstable at p=0.25 (threshold).

  Key feature: Non-additivity. If I make effects additive (bonus per sharer regardless), global increase vanishes: within-patch disadvantage dominates.

  Gene's-eye defense: Would argue this isn't "true" altruism since trait bearers gain higher fitness globally. I counter that the altruistic label still applies locally, and group structure is causal in fitness differences.

  Darwinian individuality: Patches lack reproduction/bottleneck, so not individuals. But MLS1 doesn't require this - groups can be "units" without being individuals.

  This should satisfy the user's need for a clean, arithmetic-driven case that forces theoretical distinctions.
