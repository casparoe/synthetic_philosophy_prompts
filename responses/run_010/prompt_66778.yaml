  ### Decision Tree for Underdetermination of Theories by Evidence

  **Starting Point:** You grant that more than one theory can fit all available empirical data (i.e., the evidence we actually possess).

  1. **Are the theories genuinely distinct?**  
     (i.e., do they make incompatible claims about the world beyond mere notational differences?)  
     - **No** → **Leaf: Empirical Uniqueness** (flat denial of genuine equivalence: if theories fit all data, they cannot be fundamentally distinct; any apparent differences are superficial).  
     - **Yes** → Proceed to 2.

  2. **Is the equivalence only temporary?**  
     (i.e., could future evidence break the equivalence?)  
     - **No** → Proceed to 3.  
     - **Yes** → Proceed to 4.

  3. **For permanently equivalent theories, should we believe one is true?**  
     (i.e., despite equivalence, do we have grounds to accept one theory as true?)  
     - **Yes** → **Leaf: Quinean Holism** (choose based on pragmatic virtues like simplicity; belief in truth is warranted).  
     - **No** → **Leaf: Constructive Empiricism** (accept theories only as empirically adequate; remain agnostic about truth).

  4. **Can the equivalence be broken without new evidence?**  
     (i.e., via auxiliary assumptions, background knowledge, or reinterpretation of existing data)  
     - **Yes** → **Leaf: Laudan-Leplin Deflation** (equivalence is broken by non-empirical means).  
     - **No** → Proceed to 5.

  5. **Is the persistence due to unconceived alternatives?**  
     (i.e., could a third, unimagined theory resolve the underdetermination?)  
     - **Yes** → **Leaf: Stanford's Unconceived Alternatives** (underdetermination persists due to our limited imagination).  
     - **No** → **Unoccupied Branch** (see details below).

