prompt: |-
  I host a small philosophy-of-logic podcast. Next week's guest is a philosopher whose account of Carroll's tortoise ("What the Tortoise Said to Achilles," *Mind*, 1895) is that the dialogue records a category mistake about rules of inference: a rule cannot be recruited as a further premise because inference is a transition an agent performs, not another item she believes. Her positive view, which she develops at length, is that a competent reasoner's grasp of *modus ponens* is a self-governing policy in Bratman's sense — a planning state that settles what she will do rather than representing how things are — and that Achilles loses only because he keeps trying to answer a practical demand with descriptive content.

  Draft nine interview questions that go beyond inviting her to restate this. I want at least one question each on: what makes a policy *correct* rather than merely adopted, given that logical rules are not up to us in the way policies are; whether an implicit policy is any different from a bare disposition to infer, and whether the tortoise's regress can be pressed against that too; whether the account is meant to generalize to conditionalization and closure under known entailment, and what becomes of the normativity of logic if it does; the two mismatch cases — the reasoner whose explicit policy is the tortoise's but who draws the conclusion anyway, and the one with the right policy who reliably misapplies it; how she distinguishes a rule's being valid from the corresponding conditional's being true, and what is lost if the two come apart only verbally; and whether the view explains why the regress feels compelling rather than merely dissolving it. Close with a question about what evidence — psychological or otherwise — would tell us that some creature has the policy, and what would count against her account.

  For each question include a follow-up keyed to the reply she is most likely to give, not a follow-up that would work for any answer. No questions about her biography, her influences, or her feelings about the discipline; every question should be one only a defender of *this* position can answer.

  Open with a single sentence stating where you think the view is weakest, so I know which question to save for last. Then give the nine questions as a markdown table with these columns: `Q#` | `Question as I would ask it on air` | `What it presses in her view` | `Her most likely reply` (two to three sentences, in her own vocabulary) | `Follow-up keyed to that reply`.
