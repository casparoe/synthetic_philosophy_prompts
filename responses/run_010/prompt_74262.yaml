prompt: |-
  I am a senior at a small high school, and the focus of my ethics seminar this term has been Bernard Williams's attack on utilitarianism. The two cases we worked through in class are the traveller whom a captain invites to shoot one tied-up villager so that the other nineteen will be released, and the unemployed research chemist with a family to support who is offered a job in a laboratory doing weapons research that he finds abhorrent. We also spent a session on Williams's remark about the man who saves his wife from drowning: on his account, if the man has first to satisfy himself that saving her is permitted by impartial morality, he has already had one thought too many, since what should move him is simply that she is his wife. My teacher's position is that the integrity objection gets its whole force from the fact that these ground projects are the sort of thing whose value is partly constituted by being theirs — a project whose worth can be fully captured from an impersonal point of view, she says, leaves the objection nothing to grip. I am not sure I believe her, and I would rather test the claim than argue about it in the abstract, so I want a case built to order. I have to present the result at the end of term in front of a class that contains at least two committed consequentialists, so the case cannot afford to be a straw man.

  Here is the specification. I want one realistic, contemporary scenario, told in a single paragraph, involving an agent whose central ground project is itself impersonally valuable and impersonally describable — something along the lines of running a small disaster-relief organization, a scholarship fund, a vaccination outreach program, or a research initiative — who faces a choice in which a person to whom she has a strong special tie (a sibling, a former student, a co-founder) and one or a few strangers are in the balance, and where the impartial calculation points away from the person she is tied to. The case has to be engineered so that Williams's objection cannot be launched against her deliberation at all: the impartial thought is not an intrusion on the project but the ordinary medium in which the project is conducted, so that the intruding thought, if there is one, would be the thought about the tie — the structural inverse of the drowning case. The hard part is that it must not be rigged. So the project has to be genuinely admirable rather than fanatical, and she has to be a person of ordinary warmth rather than a cold obsessive; the tie has to be real and weighty, not a distant cousin or a casual acquaintance; the stakes cannot be so lopsided that every view in the literature gives the same verdict, and the consequences of following the tie have to be bad enough that a consequentialist could not simply shrug and endorse her doing so; and she must still have a reason for keeping the project up that is not purely impersonal, so that it counts as genuinely hers in Williams's sense. Please do not resolve the difficulty by having the tie quietly dissolve, by having the loved one nobly refuse to be helped, or by having some third party step in at the last moment.

  Then show me that the design actually works. Please give the whole response as exactly five numbered items, with no introduction and no concluding paragraph. Item 1 is the scenario itself, in one paragraph; it is the only item permitted to run longer than two sentences. Items 2 through 5 should be a sentence or two each and should cover, in this order: why the integrity objection misfires in this case and which of its enabling conditions is therefore unmet; which specific feature of the two classroom cases is absent here, and what makes you confident that it is that feature doing the work rather than some incidental detail of the setting; the smallest edit to the scenario that brings the objection back, together with the verdict the edited case yields; and how a defender of Williams would attack the case, naming which of my constraints above she would claim has been quietly violated. If you judge that the specification cannot be satisfied as stated, use item 5 to say so, identify which constraint has to be surrendered, and give me the closest case you can build instead.
reasoning: |-
  Hmm, the user is a high school senior in an ethics seminar focused on Bernard Williams's critique of utilitarianism. They've studied cases like the traveler forced to shoot a villager and the chemist offered weapons research work, plus Williams's "one thought too many" idea about saving a drowning spouse. Their teacher argues that integrity objections only work when personal projects derive value from being "theirs," not from impersonal worth. The user is skeptical and wants a custom-built case to test this claim.

  I need to create a realistic scenario where an agent's central project is both impersonally valuable and personally meaningful. The project should be something like disaster relief or vaccination outreach. The agent must face a choice between someone they have a strong personal tie to (like a sibling or close colleague) and strangers, with impartial calculation favoring the strangers. Crucially, the impartial thought shouldn't feel intrusive—it should be integral to how the project operates. The personal tie must remain intact and significant, stakes should be balanced enough to spark debate, and the agent must have personal reasons for the project beyond just impersonal value.

  For the scenario, I'll design a vaccination outreach director named Dr. Elena Rostova who must decide whether to divert vaccines to save her brother-in-law (a key team member) or use them in a refugee camp outbreak. The project's nature makes impartial calculation inherent to her work. The brother-in-law must be both personally close and professionally vital to maintain the "genuinely hers" requirement.

  For the five numbered items:
  1. The full scenario paragraph showing the conflict
  2. Why Williams's integrity objection doesn't apply here (impartial reasoning is native to the project)
  3. How this differs from Williams's cases (no alienation because morality is baked into the project identity)
  4. A minimal edit that would trigger the objection (making the vaccine diversion purely personal)
  5. How a Williams defender might criticize it (perhaps arguing the project isn't "genuinely hers" enough)

  I need to ensure the case avoids being a straw man—the choice must be genuinely tough, with real consequences whether she follows impartial morality or her personal tie. The user will present this to consequentialist classmates, so it must withstand scrutiny.
answer: |-
  **1.** Dr. Elena Rostova, founder and director of a highly-regarded mobile vaccination initiative operating in conflict zones, faces an agonizing choice. Her team has secured a critically limited supply of a novel, highly effective meningitis vaccine just as a deadly outbreak erupts in a remote refugee camp they serve. Simultaneously, she learns that her brother-in-law and closest colleague, Leo, who co-founded the initiative and handles vital logistics, has contracted a severe, unrelated bacterial infection while prepping supplies. He requires immediate, expensive, specialized antibiotics available only on the black market. The initiative's emergency funds are precisely sufficient *either* to purchase the antibiotics to save Leo *or* to fund the complex, urgent delivery operation required to get the vaccines to the camp in time to save dozens of children from the rapidly spreading outbreak. Delaying the vaccine delivery by even a day drastically reduces its impact. Elena knows impartial calculation demands funding the vaccine delivery; the sheer number of lives saved outweighs saving one person, however vital Leo is personally and professionally. Her entire project, built on maximizing impartial health impact, screams for the vaccines. Yet, the thought of abandoning Leo, her sister's husband and the person who believed in the project from day one, feels like a profound betrayal of the deepest bonds that sustain her in this grueling work.

  **2.** Williams's integrity objection misfires because impartial calculation is not an alien, intrusive demand imposed *on* Elena's project from outside; it is the constitutive logic *of* the project itself, the very medium through which its value (and her commitment to it) is expressed and understood, making the "alien cause" condition unmet.

  **3.** Unlike the traveller or chemist cases, where the agent is forced to adopt an alien *external* perspective threatening their core identity ("shooter," "weapons researcher"), Elena's project *is* the impartial perspective – the "intruding thought" here is the personal pull, not the impartial demand, reversing the structural intrusion Williams diagnosed.

  **4.** The smallest edit bringing the objection back: Make Elena's project *funding medical research* instead of direct vaccination delivery; saving Leo then violates a general principle she *holds*, not the constitutive logic of the project *itself*, yielding an integrity violation if impartial calculation forces her to abandon him.

  **5.** A Williams defender would likely attack the case by claiming the constraint requiring the project to be "genuinely hers" is violated, arguing that her *personal* reason for running the project (e.g., loyalty to Leo/the co-founders, specific memories of beneficiaries) is insufficiently distinct from the project's impersonal value, making it functionally impersonal and thus leaving her personal integrity untouched by the choice.
