prompt: |-
  For eleven years I have chaired the joint-resources committee of the faculty senate at a mid-sized research university, and I have come to think that we are the least principled body on this campus. Between six and ten disputes come before us each academic year in which exactly two units claim shares of something jointly funded: the operating budget of an instrument used by a laboratory and by a clinical service, a half-time coordinator position attached to two departments, the second year of a bequest left vaguely "for interdisciplinary work." The committee consists of five people — a molecular biologist, two historians, a professor of law, and me — none of whom has any training in economics, and we have ninety minutes per case, at the end of which we send a one-page recommendation to the provost, who has accepted every recommendation but two in my tenure. Our actual method has been to split things down the middle where they can be split, and where they cannot, to listen to whoever is more aggrieved and then describe the result as equitable. I have lately been reading the two-person bargaining literature, and the solution put forward by Kalai and Smorodinsky in the mid-1970s — the one, as I understand it, that selects the feasible point at which each party achieves the same proportion of the most it could individually hope to achieve, measured from its walkaway position — seems to me the only candidate that is both defensible and explainable to non-specialists inside ninety minutes. I may be conflating it with the simpler rule that just divides the surplus above the two walkaway positions equally; if I am, please say so plainly, distinguish the two for me, and tell me which one the committee should actually be applying and why, because my colleagues will ask and I should not have to improvise an answer.

  What I want from you is the procedure itself: the questions to be asked in order, what would count as a sufficient answer to each, and where the procedure stops and hands the matter to a person because the remaining question is one of values rather than of fact. It must tell us how to fix the disagreement point when the two units describe their walkaway positions differently and one of them is, in my judgment, bluffing. It must tell us how to determine each unit's aspiration — which is the best it could get from what is genuinely feasible, not the most sumptuous thing it has said aloud in a memo — and I would like a step that polices this, because I suspect that the rule's sensitivity to alternatives nobody would ever choose means a department can improve its share merely by nominating a grander option into the set, and if that suspicion is wrong please correct it. It must tell us what to do when the frontier is coarse, since a coordinator position cannot be cut into seventeenths, and what to do when there are three claimants rather than two, my understanding being that the two-party result does not carry over and that the obvious extension can fail even to be efficient. And it should be candid about the common measure. Our provost publishes a standard cost per released course, which we use as a rough numeraire for converting dissimilar goods into comparable ones; I want to know how much weight that number is bearing, and what the procedure should say when one party's stake — a graduate program's continuity, say, or the loss of a long-running field site — is not the kind of thing a released course measures.

  Then please run the procedure on three cases of the sort we see. First: a shared imaging instrument whose annual operating cost is covered by a $100,000 line, with two departments able to take fractional shares of instrument time and of the line, a walkaway position of $10,000 for the first department (it can buy time at a neighboring institution) and $20,000 for the second (it has an older instrument of its own), and one department has asked us to consider, in addition, a scenario in which it receives the entire line plus capital funding for a second machine. Second: three departments claiming a single jointly funded staff position, none of which will withdraw. Third: a dispute over a shared archive in which, as the papers were filed, one department's outside option appears to be better for it than any allocation we could actually construct — and here I expect the procedure to tell me that the committee has no business deciding, which will not please the provost, who has already spent a semester on the matter. For each case, show the reasoning the committee would go through and state the recommendation it produces, even where the recommendation is one I will dislike, and end by telling me what this procedure cannot do and where it will misfire in practice. Please write the whole thing as continuous prose, in the manner of a letter rather than a manual: no headings, no bullet points, no numbered lists set off from the text, no bold or italicized labels, and no tables. Signpost the steps in the sentence itself — first this, then that — so that I could read your answer aloud at the table without reformatting it.
reasoning: |-
  Okay, let me tackle this complex query from a faculty committee chair seeking a principled bargaining approach. The user has chaired a joint-resources committee for eleven years and feels their current ad-hoc methods lack principles. They've discovered Kalai-Smorodinsky (KS) as a potential solution but want clarification on how it differs from Nash bargaining, and more importantly - a practical procedure they can implement within their constraints.

  Hmm, the user's situation reveals several pain points: limited time (90 minutes/case), non-economist committee members, need for defensibility, and real-world complexities like bluffing, incommensurable goods, and multi-party disputes. Their three sample cases perfectly illustrate these challenges. 

  First, I need to clearly distinguish KS from Nash bargaining since the user suspects they might be conflating them. Nash maximizes the product of gains while KS equalizes relative satisfaction - crucial difference. KS is likely better here because it's more intuitive ("same proportion of potential") and less manipulable by exaggerated claims, which aligns with the user's concern about departments gaming the system.

  For the procedure itself, I'll need to structure it as requested: step-by-step in prose, no bullet points. Key elements must include:
  - Establishing disagreement points (walkaway positions) with a bluff-handling mechanism
  - Determining realistic aspirations (not wishful thinking)
  - Defining the feasible set with a "policing" step against inflated options
  - Handling coarse frontiers (like indivisible positions)
  - Addressing three-party cases where KS doesn't directly apply
  - Confronting the numeraire problem (their "released course" metric)

  The three test cases will demonstrate application:
  1. Imaging instrument case will show KS calculation and how to dismiss unrealistic aspirations (that second machine fantasy)
  2. Three-department staff position requires adapting KS principles since no proper solution exists
  3. Archive dispute should reveal when bargaining breaks down (outside option dominates)

  I should emphasize limitations too - KS assumes rational actors, fails with non-convex feasible sets, and struggles with deeply incommensurable values. The released-course numeraire will be problematic for things like "program continuity," so we'll need fallback approaches.

  Throughout, I'll maintain the requested letter format with signposting ("First we establish... then we determine..."). The tone should respect their expertise while providing clear guidance - they're clearly sophisticated but need executable steps. And I must remember they'll present this orally to colleagues, so clarity trumps theoretical elegance.
answer: |-
  My dear colleague,

  Thank you for your thoughtful and candid description of your committee's work and your search for a more principled foundation. You are indeed discerning a crucial distinction between bargaining solutions. The Nash Bargaining Solution (NBS), which maximizes the product of the gains above the disagreement point (or divides the surplus equally in gains), is distinct from the Kalai-Smorodinsky (KS) solution. The KS solution prioritizes proportional fairness: it finds the point on the Pareto frontier where each party achieves the same *proportion* of their maximum possible gain achievable *from the disagreement point*. This focus on relative satisfaction, rather than absolute surplus division, often feels more intuitively equitable and is less manipulable by strategically inflating aspirations, making KS the superior candidate for your committee's needs, given your constraints. I will now outline a procedure based on KS, addressing your specific concerns, and then apply it to your three cases.

  **The Kalai-Smorodinsky Procedure for the Committee:**

  First, you must establish the **Disagreement Point (D)**, also called the threat point or walkaway position. This represents the outcome if no agreement is reached. Ask each unit: "What outcome occurs, specifically in terms of the resources under dispute, if we fail to broker an agreement? Quantify this outcome as precisely as possible using our standard numeraire (released course cost, or RCC) where feasible." Crucially, you must then assess the credibility of these claims. This is where judgment enters. Ask: "Can you demonstrate the feasibility and cost of this walkaway option? What evidence supports that this is your genuine fallback?" If you judge a unit is bluffing – for instance, claiming an implausibly cheap external option or an outcome demonstrably worse than their departmental health could sustain – you must override their stated position and impose a more reasonable D point for them, based on available evidence and common sense. Document this judgment concisely. This step stops and hands the matter to the committee (or chair) for a values-based assessment of credibility; the facts inform, but the judgment call on credibility is essential.

  Second, determine each unit's **Aspiration Point (A_i)**. This is *not* their wishlist memo item. Ask each unit: "Setting aside your walkaway position, what is the *best possible outcome for you* concerning the disputed resources that you believe is *genuinely feasible* within the scope of this jointly funded pool, assuming full cooperation from the other unit(s)?" Here lies the critical "policing" step. The committee *must* rigorously assess the feasibility of these aspirations within the constraints of the jointly funded resource. Does aspiration A_i require violating the total budget? Does it depend on capital funding not part of the dispute (like the second machine request)? Does it require the other unit(s) accepting an outcome demonstrably worse than *their* disagreement point? If an aspiration fails this feasibility test, it must be rejected. Guide the unit towards restating a feasible aspiration, or, if they persist in unreasonableness, the committee must define a reasonable aspiration *for* them, based on the total resource pool and the other unit's minimal needs (e.g., at least their disagreement point). The aspiration is the maximum payoff achievable *on the Pareto frontier* from their perspective. Your suspicion is correct: a unit *can* artificially inflate its share under KS by nominating an unrealistically grand aspiration. This policing step – rejecting infeasible aspirations – is vital to prevent this manipulation. The KS solution *is* sensitive to the set of alternatives, making policing essential.

  Third, **Define the Feasible Set (F)**. Translate the dispute into a set of possible payoff pairs (or triples) for the units, measured in RCC or other agreed common measures (time share, budget share), ensuring the sum of payoffs does not exceed the total resource. Include the disagreement point (D) and the (now policed) aspiration points (A1, A2, ...). For continuous goods (like fractional budget shares), the frontier may be a line; for coarse goods (like a single position), it will be discrete points (e.g., Position entirely to Dept A, entirely to Dept B, shared under specific split rules).

  Fourth, **Identify the Utopia Point (U)**. This is the point consisting of each unit's (policed) aspiration payoff simultaneously (U = (A1, A2, ...)). Crucially, U itself is almost always *infeasible*. It's a theoretical benchmark.

  Fifth, **Apply the Kalai-Smorodinsky Rule**. Find the point on the Pareto frontier of F (the set of outcomes where no unit can be made better off without making another worse off) that maintains equal *proportional satisfaction*. Calculate the ratio for each unit i: (Payoff_i - D_i) / (U_i - D_i). This ratio represents the fraction of their potential gain (from D to U) that they achieve. The KS solution is the feasible point on the Pareto frontier where this ratio is equal for all units: (x1 - d1)/(u1 - d1) = (x2 - d2)/(u2 - d2) = ... . Visually, it's where the ray from D through U intersects the Pareto frontier.

  Sixth, **Handle Coarseness and Indivisibility**. If the frontier is coarse (not continuous), the ideal KS point calculated mathematically may not be a feasible discrete option. Identify the feasible points on the frontier closest to the ideal KS ray. Evaluate the proportional satisfaction ratios at these nearby feasible points. Choose the feasible point that comes closest to achieving equal ratios, or, if none are very close, the point that minimizes the maximum deviation from equality. Judgment is needed here; the procedure hands the matter back to the committee to select the most equitable *feasible approximation*.

  Seventh, **Address the Numeraire Problem**. The common measure (RCC) is essential for calculation but imperfect. When stakes involve values poorly captured by RCC (e.g., program continuity, loss of field site), you have two paths during the aspiration and feasibility steps: 1) Work with the units to quantify the *impact* in RCC terms as best as possible (e.g., "How many released courses would offset the disruption to the graduate program?"). This is imperfect but necessary for the math. 2) If quantification is truly impossible or grossly misleading, acknowledge that the KS solution, based solely on quantifiable RCC, may not capture the full equity picture. The committee then must use the KS result as a strong guideline but explicitly adjust the recommendation based on these intangible factors, documenting the rationale clearly for the Provost. KS provides a principled anchor, not an infallible oracle.

  Eighth, **The Three-Player Problem**. KS formally extends to n-players, but its properties (like guaranteeing Pareto efficiency) hold only under specific convexity assumptions. More critically, with three or more parties, the "utopia point" (U) becomes even more hypothetical, and finding a point with exactly equal ratios may be impossible or lead to counterintuitive results. The procedure remains the same: define D, police A_i, define F, find U, find the Pareto-efficient point where (x_i - d_i)/(u_i - d_i) is equal for all i, or the closest feasible approximation. However, be prepared for more complex negotiation dynamics and the possibility that the result feels less stable. The core principle of proportional gains remains your guide.

  **Application to Your Cases**

  **Case 1: Shared Imaging Instrument ($100k Budget)**
  *   **Disagreement (D):** Dept 1: $10k (external time), Dept 2: $20k (own older instrument). Assess credibility: Both seem plausible. D = ($10k, $20k).
  *   **Aspirations (A_i):** Dept 1 Aspires: $100k (all budget). Dept 2 Aspires: $100k *plus* capital for a second machine. *Policing:* Dept 1's aspiration is feasible only if Dept 2 gets $0, which is worse than D2 ($20k) – feasible but extreme. Dept 2's aspiration includes capital funding *not part* of the $100k operating line – **infeasible** within the dispute scope. Committee rejects Dept 2's aspiration. Guide Dept 2: Best feasible outcome assuming Dept 1 cooperates? Dept 2 might say $80k (leaving Dept 1 with $20k > D1). Or committee imposes: Maximum feasible for Dept 2 is $90k (leaving Dept 1 $10k = D1, their minimum). Use A2 = $90k. (A1 remains $100k, though $90k is also feasible for them if Dept2 gets $10k).
  *   **Utopia (U):** ($100k, $90k) – Infeasible (total $190k > $100k).
  *   **Feasible Set (F):** All points (x1, x2) where x1 + x2 = $100k, and x1 >= $10k, x2 >= $20k. Pareto frontier is the line x1 + x2 = $100k, x1>=$10k, x2>=$20k.
  *   **KS Calculation:** Find x1, x2 on x1+x2=100k where (x1 - 10)/(100 - 10) = (x2 - 20)/(90 - 20) => (x1 - 10)/90 = (x2 - 20)/70.
      *   Substitute x2 = 100 - x1: (x1 - 10)/90 = (100 - x1 - 20)/70 => (x1 - 10)/90 = (80 - x1)/70
      *   Cross-multiply: 70(x1 - 10) = 90(80 - x1)
      *   70x1 - 700 = 7200 - 90x1
      *   70x1 + 90x1 = 7200 + 700
      *   160x1 = 7900
      *   x1 = 7900 / 160 = **$49,375**
      *   x2 = 100,000 - 49,375 = **$50,625**
  *   **Recommendation:** Allocate $49,375 (49.375%) of the budget/usage to Department 1 and $50,625 (50.625%) to Department 2. The slight asymmetry reflects Dept 2's higher disagreement point and slightly lower (policed) aspiration relative to its potential gain range.

  **Case 2: Single Staff Position (Three Departments, None Withdraw)**
  *   **Disagreement (D):** Since no one withdraws, the disagreement outcome is ambiguous. What happens if no agreement is reached? Does the position lapse? Is it allocated by the Provost unilaterally? This is a critical flaw in the setup. The committee *must* define D. Suppose, based on history, the position would lapse (0,0,0). Or perhaps each department gets nothing but incurs ill-will. Assume D=(0,0,0) for calculation, acknowledging this is weak.
  *   **Aspirations (A_i):** Each department aspires to the full position (1 FTE). Policing: All are feasible *only* if others get 0. A = (1,1,1).
  *   **Utopia (U):** (1,1,1) - Infeasible.
  *   **Feasible Set (F):** Discrete options: Position entirely to Dept A (1,0,0), to B (0,1,0), to C (0,0,1), or shared fractions (e.g., 0.4, 0.4, 0.2). Assume fractions are possible (e.g., time allocation).
  *   **KS Calculation (n=3):** Find (x_a, x_b, x_c) on Pareto frontier (sum=1, x_i >=0) where (x_a - 0)/(1 - 0) = (x_b - 0)/(1 - 0) = (x_c - 0)/(1 - 0) => x_a = x_b = x_c. The point satisfying this is (1/3, 1/3, 1/3).
  *   **Coarseness/Feasibility:** (1/3, 1/3, 1/3) is feasible if the position can be split three ways.
  *   **Recommendation:** Allocate one-third of the staff position's time/resources to each of the three departments. **Caveat:** The weak disagreement point (D=(0,0,0)) makes this sensitive. If D could be defined as each getting a minimal share (e.g., 0.1 FTE), the calculation would differ, likely still favoring near-equal splits. KS provides a clear, equitable principle here: equal proportional satisfaction from a common low baseline.

  **Case 3: Shared Archive (Dominant Outside Option)**
  *   **Disagreement (D):** Dept 1 claims an outside option significantly better (in their estimation, quantified in RCC or utility) than any allocation achievable from the shared archive. The committee must rigorously assess this claim's credibility and quantify it (D1_high, D2).
  *   **Assessment:** If the committee judges Dept 1's claim **credible** and D1_high > maximum feasible payoff for Dept 1 from *any* archive allocation (considering D2's needs), then the Disagreement Point (D1_high, D2) lies *above* the feasible set F. The ray from D through U will *not intersect* the feasible Pareto frontier of the archive allocation problem. The KS solution, mathematically, doesn't exist within F under the standard definition because Dept 1 cannot achieve any positive gain relative to D.
  *   **Consequence:** Bargaining theory confirms your suspicion. If Dept 1 genuinely has an outside option superior to its *best possible outcome* within the joint arrangement, then no mutually beneficial agreement exists *within the scope of the jointly funded resource*. Dept 1 *should* walk away. Attempting to force an archive allocation would leave Dept 1 worse off than its alternative.
  *   **Recommendation:** The committee concludes that no feasible allocation of the shared archive resources is preferable to Department 1's credible outside option. Therefore, we recommend that Department 1 be released to pursue its alternative, and the remaining archive resources be allocated solely to Department 2 (or according to its disagreement outcome, if different). **Procedural Note:** This outcome, while logically dictated by KS principles and bargaining rationality, is precisely what you fear the Provost will dislike. However, the procedure clearly identifies this as a case where negotiation over the shared resource is futile; the "dispute" is resolved by recognizing the dominance of the outside option. Forcing a share would be inefficient and harmful to Dept 1.

  **What This Procedure Cannot Do and Where It Will Misfire**

  This KS-based procedure provides a principled, explainable framework vastly superior to splitting the difference or appeasing the aggrieved. However, it has limits:

  1.  **Judgment Dependence:** It relies heavily on committee judgment at critical points: assessing the credibility of disagreement points (bluff detection), policing aspirations (feasibility assessment), defining the feasible set, choosing among discrete approximations, and handling the numeraire. These are points of vulnerability and potential contention.
  2.  **Manipulation Risk:** Despite policing, sophisticated actors may still try to strategically misrepresent D or A. Constant vigilance is needed.
  3.  **Numeraire Limitations:** Converting complex goods (program continuity, field sites) into RCC is inherently imperfect and subjective. KS's equity depends entirely on this measure. When conversion fails, KS provides only a partial guide, and committee judgment based on broader values becomes paramount.
  4.  **Multi-Party Complexity:** With three or more parties, calculating and visualizing KS becomes harder, the Utopia point is more abstract, and achieving true proportional satisfaction may be impossible with discrete options or lead to counterintuitive results requiring careful explanation. The core principle holds, but the mechanics are messier.
  5.  **Breakdowns:** As Case 3 shows, KS clearly signals when no mutually beneficial agreement exists. While principled, this outcome may be politically unpalatable. The procedure cannot create solutions where none exist.
  6.  **Non-Convexity:** If the feasible set is non-convex (has "dents"), the KS solution might not be Pareto efficient (though this is rare in simple resource splits) or unique. Your cases likely involve convex or discrete sets.
  7.  **Ignores Bargaining Power:** KS deliberately ignores relative bargaining power or investment, focusing solely on the structure of alternatives (D, F, U). If power imbalances *should* influence the outcome (a normative question), KS won't capture it.
  8.  **Time Constraints:** Rigorously policing aspirations and assessing disagreement points within 90 minutes is demanding. Discipline is essential.

  In practice, misfires will most likely occur due to poor judgment in setting D or A, failure to adequately police aspirations, inadequate handling of the numeraire for intangible values, or political pressure to avoid the "no agreement" outcome even when it's the logical result. The strength of KS is that it forces transparency about these inputs and makes the equity principle explicit – proportional gains from the baseline defined by credible alternatives. This gives you a defensible foundation far stronger than your current ad hoc approach. Use it as the structured backbone of your deliberation, document your judgments on D and A clearly, and let the principle of proportional satisfaction guide you towards recommendations that are, in the truest sense, equitable.

  Respectfully,

  Your Guide in Game Theory
