answer: |-
  Here is a complete exam package tailored to your specifications, focusing on the sea turtle case and the core philosophical crux regarding free-floating rationales.

  ---

  ### 1. Exam Question (As Students Would See It)

  **Philosophy of Biology & Metaethics Final Examination**
  **Time Allowed:** 50 Minutes  
  **Marks:** 25  

  **QUESTION:**  
  Sea turtle hatchlings instinctively crawl toward the brightest low horizon. For millions of years, this reliably led them to the ocean (reflecting moonlight/skylight), where survival was possible. On developed coasts, however, artificial lights (e.g., streetlights, hotels) now create the brightest inland horizon, causing hatchlings to crawl away from the ocean and die. Crucially, coastal development and population decline are recent (only a few generations), meaning natural selection has not yet had time to alter this orientation trait. The trait is currently being selected *against* but remains unchanged.  

  (a) **Is there still a "rationale" (a reason *why* the trait exists in this form) for the hatchlings' orientation behavior?** If so, whose interests or perspective does this rationale primarily track: the ancestral environment, the current environment, or the biologist studying the trait? Justify your answer.  
  *(10 marks)*  

  (b) **Can a rationale of this kind—existing without any mind representing it—ever constitute a *normative reason* (a reason *for* someone or something to act a certain way)?** Or does it only ever provide an *explanatory reason* (an account of why the trait exists as it does)? Defend your position.  
  *(15 marks)*  

  ---

  ### 2. Model Answer (~650 Words)  

  **(a)** The orientation trait undeniably retains a *historical rationale*. Its current structure exists *because*, ancestrally, moving toward brightness reliably led hatchlings to the ocean, conferring a survival advantage. This rationale tracks the *ancestral environment’s* interests—specifically, the statistical regularities linking brightness, ocean direction, and fitness. The trait persists due to phylogenetic inertia, not because it serves the *current* environment’s demands. In fact, the current environment "disrupts" this rationale by decoupling brightness from ocean direction, making the behavior maladaptive. The biologist’s perspective *identifies* this rationale but does not create it; the rationale is grounded in objective historical selection pressures.  

  **(b)** The critical question is whether this historical rationale can be normative—i.e., whether it gives the *hatchling* (or anyone/anything) a reason to crawl toward brightness. I argue it *cannot*, and this reveals a fundamental limitation of free-floating rationales.  

  First, the rationale explains the trait’s *etiology*: it answers "why this behavior exists." But "explaining why X exists because it was good" does not entail "X *is* good" or "there is reason to do X now." The hatchling’s behavior is caused by an unrepresented historical benefit, but in the current environment, crawling toward brightness is fatal. The rationale does not "track" what is *currently* beneficial for the turtle; it is a relic. To claim the turtle "should" follow this rationale *now* would be factually incorrect and ethically incoherent—it would prioritize a past statistical pattern over present survival.  

  This exposes a deeper point: **rationales require ascribers to become normative**. The historical rationale is a *natural sign* (brightness correlated with fitness ancestrally), but signs only become *reasons* when interpreted by an agent capable of valuing ends. Without a valuer—even a hypothetical one—"good for" lacks normative force. The instrumentalist (e.g., Dennett) treats rationales as useful fictions for prediction, acknowledging they are mind-dependent *ascriptions*. For the instrumentalist, the rationale’s normativity is borrowed from the ascriber’s goals (e.g., predicting behavior, conserving turtles). The realist, however, insists rationales are mind-independent facts. Yet the realist faces a dilemma: either (1) they conflate explanatory and normative "reasons," smuggling in an implicit ascriber (e.g., "Nature’s purpose"), or (2) they posit a mysterious form of "normativity" untethered to any actual or possible perspective.  

  The sea turtle case forces this choice. If the realist insists the historical rationale *is* a normative reason for the turtle, they must explain why the turtle "should" pursue a behavior that *now* ensures death. Appeals to "species flourishing" fail—individual turtles die, and selection has not yet "endorsed" a new behavior. Only an ascriber (e.g., a biologist valuing evolutionary success) can *prescribe* following the ancestral rationale *as if* it were still adaptive. Thus, while free-floating rationales *explain* traits causally, their normativity is always derivative, dependent on a valuer’s perspective. The slogan "reasons without reasoners" holds for explanation but not for justification. A rationale becomes a normative reason only when embedded in a stance that attributes interests—whether to turtles, genes, or systems—and this stance requires a mind.  

  ---

  ### 3. Marking Scheme (25 Marks Total)  
  **Must-hit points, marks allocation, and common errors:**  

  | **Criterion**                                                                 | **Marks** | **Common Errors/Botched Moves**                                                                 |
  |-------------------------------------------------------------------------------|-----------|------------------------------------------------------------------------------------------------|
  | **1. Identifies the *historical* rationale** (ancestral benefit → ocean)      | 4         | Confuses historical/current rationales; claims rationale no longer exists.                    |
  | **2. Correctly assigns rationale to *ancestral* (not current/biologist) interests** | 3       | Suggests rationale tracks current environment or biologist’s goals.                           |
  | **3. Distinguishes *explanatory* rationale (why trait exists) from potential normativity** | 4     | Conflates "explains why" with "reason for" (e.g., "It’s rational for turtles to follow light"). |
  | **4. Argues historical rationale *cannot* be normative for turtles *now***    | 5         | Assumes past adaptiveness implies current "should"; ignores maladaptive outcome.              |
  | **5. Recognizes normativity requires an *ascriber*** (even for realists)      | 5         | Treats rationale as intrinsically normative; fails to see realist’s implicit ascriber problem. |
  | **6. Resolves crux: Rationales explain sans minds, but normativity needs valuers** | 4       | Declares rationales "metaphorical" (loses explanatory power); avoids taking a stand on crux.   |

  ---

  ### 4. Claims That Should Cost Marks Outright  
  **Penalize heavily if asserted without argument (e.g., -3 marks per occurrence):**  
  - **"The rationale is for the *species* benefit."** (Commits group-selection fallacy; selection acts on individuals/lineages).  
  - **"Natural selection *intends* the trait’s purpose."** (Anthropomorphizes selection; contradicts "without minds" premise).  
  - **"The turtle *has reason* to follow light because its ancestors did."** (Confuses etiology with justification).  
  - **"Teleological talk is *just* a metaphor with no factual content."** (Fails to engage with etiological explanations in biology).  

  ---

  ### Design Notes  
  - **Question Stem**: Forces engagement with the time-lag problem, blocking stock etiological answers. The "whose interests?" framing pushes analysis beyond Dennett 101.  
  - **Model Answer**: Resolves the crux by treating rationales as *natural signs* for explanation but requiring *ascribers* for normativity, showing how realists implicitly relocate reasoners.  
  - **Marking Scheme**: Itemizes the core argumentative moves. Focuses penalties on conflation (explanatory/normative), teleological denial, and anthropomorphism.  
  - **Pitfalls List**: Targets pseudo-sophisticated errors (e.g., group selection, metaphorical dismissal) that evade the philosophical work.  

  This package ensures students must grapple with the ascriber-dependence of normativity while preserving the explanatory power of free-floating rationales—exactly the tension you want to test.
