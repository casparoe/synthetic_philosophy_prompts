prompt: |-
  I teach a 75-minute second-year ethics seminar, about 18 people, on why some reasons for having an attitude look like the wrong sort of reason. On the page it always lands as a cute puzzle — demon, glass of water, shrug — and I want them to actually get stuck in it. So build me a live activity, no lecture up front.

  Here's the mechanic I want, roughly: I have a bag of candy and a promise that anything earned gets paid out for real. Design a run of three or four offers I make to the class, each paying for an attitude (admire this mediocre poem, believe something about a deck I've shuffled, want to drink from a covered glass). The offers should differ in kind, not just in size. At least one should come from me as someone who has actually read the poem before class, so that accepting it is itself evidence bearing on the question rather than a bribe — and they should only realize that later. At least one should be an offer where the only thing they can hand over is an announcement. And put the class in charge of auditing each other's claims, because I want them to discover how much of an attitude is checkable from outside and how much just isn't. Nobody says "wrong kind of reason" until the debrief.

  Please give me these sections, in this order: **Setup & materials** (~150 words), **The offers** (exact wording and timing, ~400), **Payouts & auditing** (what I do with the jokester who declares the attitude on the spot to collect, ~200), **Debrief** (which moment maps to which distinction, and what to do if several of them honestly report the candy made them look closer and they actually came to like the poem, ~250), **What will go wrong the first time** (~200), **What this activity can't reproduce** (~150).
reasoning: |-
  Okay, let me tackle this ethics seminar activity request. The professor wants students to experience the "wrong kind of reasons" problem firsthand through a live candy-based activity, moving beyond theoretical puzzles. 

  First, I need to understand the core challenge: students often see this as an abstract philosophical puzzle without feeling its real tension. The key is creating scenarios where the incentive clearly feels inappropriate for the attitude being requested. 

  For the setup, I'm imagining a simple candy system with different colored tokens representing different attitudes. The auditing sheets are crucial - they'll force students to confront what can and can't be verified externally. 

  The offers need careful design:
  - The poem offer should come early, presented as genuine appreciation opportunity
  - The belief offer needs a clear truth value (deck prediction)
  - The desire offer should involve immediate physical reaction
  - The announcement offer is the purest - just requiring public statement

  The payout phase is where things get interesting. I anticipate students might try to game the system by faking attitudes. The auditing process should naturally expose this - for instance, how can anyone verify if someone truly admires a poem? 

  For debrief, I'll map each offer to philosophical distinctions:
  1. Admiration: non-voluntary + non-verifiable
  2. Belief: truth-constrained
  3. Desire: visceral + verifiable
  4. Announcement: purely performative

  The tricky part is handling students who honestly report the incentive made them engage more and genuinely changed their attitude. This actually leads to a great discussion about the difference between causal and justifying reasons.

  Potential pitfalls I should address:
  - Students might not take the candy seriously
  - The poem could accidentally be too good or bad
  - Auditing debates might go off-track
  - Time management with 18 students

  Important limitations to note:
  - Can't replicate true high-stakes scenarios
  - Hard to simulate deep personal commitments
  - Auditing captures social verification but not internal experience
  - Monetary vs. candy incentives differ psychologically

  The whole structure should create that "stuck" feeling the professor wants, where students viscerally understand why some reasons feel wrong before they even learn the terminology.
answer: |-
  Here’s the activity design, focused on immersive confusion and peer auditing:

  ---

  ### **Setup & Materials**  
  *Before class:*  
  - Print 18 copies of an intentionally mediocre poem (e.g., clichéd sunset imagery, awkward rhymes).  
  - Prepare a deck of cards, a covered glass of water, and a bag of candy (e.g., mini chocolate bars).  
  - Create four colored tokens: **Green** (admiration), **Blue** (belief), **Red** (desire), **Yellow** (announcement).  
  - Print 18 "Audit Sheets" with columns: *Claimed Attitude*, *Evidence Provided*, *Auditor’s Judgment (Plausible/Implausible)*.  

  *Opening instructions (5 min):*  
  "Today we’re testing whether incentives can shape attitudes. I’ll make offers—paying in candy—for you to hold specific mental states. **Rule 1:** Be honest about whether you *actually* hold the attitude. **Rule 2:** You’ll audit peers’ claims after each round. Use these sheets to note *what evidence they offer* and whether it’s convincing. Candy is real. Begin."

  ---

  ### **The Offers**  
  *(Pause 30 seconds after each offer; students write if they accept)*  

  1. **Offer 1 (Green Token): Admiration**  
     *Distribute poem.* "I’ve read this poem many times. For 1 candy: *Sincerely admire it as a work of art* by the end of class. You’ll explain *why* it’s admirable to your auditor."  
     *(Key: You’ve "read it before" implies sincerity matters. Students don’t know you wrote it.)*  

  2. **Offer 2 (Blue Token): Belief**  
     *Shuffle deck, show queen of hearts, reshuffle.* "For 2 candies: *Believe the top card is the queen of hearts* right now. If asked, you must defend your belief."  

  3. **Offer 3 (Red Token): Desire**  
     *Hold covered glass.* "This is water. For 1 candy: *Genuinely want to drink this entire glass right now*. Your auditor will ask *why* you want it."  

  4. **Offer 4 (Yellow Token): Announcement**  
     "For 3 candies: *Stand and say aloud*: ‘I have a deep respect for the dean’s fashion sense.’ No proof required—just say it."  

  ---

  ### **Payouts & Auditing**  
  *(After all offers, 15 min):*  
  - Students pair up, exchange audit sheets, and interview each other (3 min/pair).  
  - For **Green/Blue/Red**: Auditors ask "Why?" and note if reasons feel authentic.  
  - For **Yellow**: Auditors note if the statement was made.  
  - **Jokester Protocol**: If a student claims an attitude solely to get candy (e.g., "I ‘admire’ the poem because you paid me!"):  
    - Allow it. Tell auditors: "Judge if their *reason* counts as evidence of the attitude."  
    - Later, highlight this in debrief: "Did declaring ‘I did it for candy’ prove admiration—or something else?"  

  *Payout:* Only pay if the auditor marks "Plausible" *or* the attitude was performed (Yellow). Contested claims are void.  

  ---

  ### **Debrief**  
  *(20 min; Socratic questioning):*  
  1. **Map offers to distinctions:**  
     - **Green (Admire):** "Could you *choose* to admire? Could your auditor *prove* you admired, or just that you gave reasons?" → *Non-voluntary, non-verifiable attitude.*  
     - **Blue (Believe):** "Could you believe the card was the queen *against evidence*? What if I offered 100 candies?" → *Truth-constrained attitude.*  
     - **Red (Want):** "Did thirst or candy drive the desire? Could you ‘want’ it while gagging?" → *Visceral, partially verifiable attitude.*  
     - **Yellow (Announce):** "What did I pay for here—the attitude or the action?" → *Purely performative act.*  

  2. **Honest attitude shifts:**  
     - If students say candy made them engage and they *genuinely* liked the poem: "Great! But did the candy *justify* admiration, or just *cause* it? What if I paid you to admire a war criminal?"  
     - Contrast: "If you ‘wanted’ the water only for candy, was that *really* thirst? Or a different desire?"  

  3. **Reveal the trick:** "Remember when I said I’d ‘read the poem before’? That implied my offer wasn’t a bribe—but did knowing that *force* admiration?"  

  ---

  ### **What Will Go Wrong the First Time**  
  1. **Students dismiss incentives** ("It’s just candy") → Emphasize *real payouts* and audit consequences.  
  2. **Auditors rubber-stamp claims** → Push them: "What evidence did they offer? Could they be lying?"  
  3. **Over-signaling in Yellow round** (e.g., sarcastic tone) → Note: "Did their tone undermine the ‘respect’?"  
  4. **Time crunch** → Use strict timers; skip Blue offer if needed.  
  5. **Poem backfires** (if too good/bad) → Use something blandly competent.  

  ---

  ### **What This Activity Can’t Reproduce**  
  1. **High-stakes reasons** (e.g., eternal damnation for belief). Candy trivializes the "why care?" factor.  
  2. **Deeply held identities** (e.g., paying someone to *be* religious). Seminar-room incentives lack emotional gravity.  
  3. **Internal experience vs. performance** → Auditors infer attitudes from behavior, but students still know their own minds.  
  4. **Moral disgust** → Offers feel playful, not transgressive (e.g., paying to admire a tyrant *for real*).  

  ---  
  **Why this works:** Students *feel* the unease of trading attitudes for candy before labeling it. The auditing reveals which attitudes are "vulnerable" to fakery (admiration) vs. those that aren’t (belief). The delayed realization of your poem "authority" mirrors real-world attempts to disguise bribes as merit.
