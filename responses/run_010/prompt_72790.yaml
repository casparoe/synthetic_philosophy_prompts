prompt: |-
  ok so quick context: I'm a junior in a philosophy of mind course this semester, and I also run the optional peer-led discussion section that goes with the lecture — about 16 students, 75 minutes, Thursday afternoons. We just finished the unity of consciousness / split-brain unit and honestly the section is stuck in a rut. Half of them read about the commissurotomy experiments and are like "obviously that's two subjects of experience in one skull, case closed," and the other half say "no, the patient reports being one person and acts like one person most of the time, so it's one," and neither side budges because nobody has actually felt the pull of the problem, they've just read about it. Sperry and Gazzaniga's stuff and that classic confabulation demo — the one where a patient is shown a chicken claw to one hemisphere and a snowy scene to the other, then picks a shovel and explains the shovel choice by reference to the chicken — gets quoted at each other constantly with nobody really getting why it's supposed to be evidence for anything.

  Can you act as a philosophy-of-mind professor who has actually designed and taught these hands-on activities before, rather than somebody writing from an armchair? Think carefully about this. Before you commit, brainstorm two or three candidate activity designs out loud, tell me which one you'd pick and why, and then write that one up in full. Please write in American English, and don't give me a bibliography or a reading list at the end — I can't chase sources down and it's not what I need.

  What I want is for the whole section to collectively *be* a single agent for about 40 minutes, with the class split into two teams playing the two hemispheres, plus somebody playing the body/output and somebody playing the experimenter who hands out tasks and collects the agent's verbal reports. The two hemisphere teams should share a "callosum" channel with a hard budget — a limited number of written notes per round, no talking across the table — and then at some point mid-activity that channel gets cut without warning, and they should not see it coming. I want real asymmetries after the cut, not just "now you can't talk": only one hemisphere gets to produce the public verbal report, the other one can only act through a designated hand-player, and the two hemispheres get shown different information about the task items so that each genuinely knows something the other doesn't. There should be a round where the speaking hemisphere has to explain, in front of the experimenter, why the hand just did what it did when it has no idea — and a round where the two hands end up working against each other on the same physical object. Also throw in some way to partially restore transfer at a cost, so the group has to decide whether to buy it.

  For scoring, no real money — index cards, tokens, whatever — but make the payoffs do philosophical work: the agent should earn something for completing tasks and something separate for the accuracy of its self-reports, with a penalty when a report turns out to be confabulated, and near the end give the two hemispheres slightly divergent interests so the class has to argue about whether the agent has one set of interests or two. And here's the piece I care most about: at the very start, before anyone knows what's coming, have every student secretly write down how many subjects of experience they think the agent they're about to play has, plus one sentence of reasoning, and seal it. Re-poll at the end. The debrief should be built around comparing those two sets of answers.

  Please give me a minute-by-minute timeline, a cheap materials list, exact role descriptions, and the precise rules for the note-passing channel (including what counts as a violation). Then a debrief that maps specific moments from the game onto specific issues — the counting question, whether apparent disunity is really evidence of disunity when one side literally has no way of speaking, the gap between behavioral disunity and there being two things it's like to be — and that also handles the objection that all the game shows is that the agent is a terrible communicator, not that it's two minds. The mechanism has to live in the rules and the incentives, not in a lecture I give afterwards. Be frank about what will predictably go wrong the first time I run this (my guesses: the hemisphere teams will just start whispering, the hand-player will take orders from whoever's loudest, and the confabulation round will fall flat because everyone already knows the trick from the readings) and tell me how to prevent or handle each one. Also tell me straight which feature of the real phenomenon this activity can't reproduce and I'll have to supply by hand — I suspect it's the first-person part, since every student knows exactly what their own hemisphere knows. And if you can, add a stripped-down version in case only 8 people show up, which happens.
reasoning: |-
  We are designing an experiential learning activity to simulate split-brain phenomena and explore the unity of consciousness debate. The goal is to have students feel the tension between behavioral unity and informational disunity, and to confront the problem of how to count subjects of experience.

  Core elements from the request:
  - Split class into two hemisphere teams (left and right), one body/output player, one experimenter.
  - Limited communication via a "callosum" (e.g., written notes with a strict budget).
  - Unannounced severing of the callosum during the activity.
  - Asymmetries: only one hemisphere can speak (verbal report), the other can only act via the hand.
  - Tasks that create conflicts and require confabulation.
  - Partial restoration of transfer at a cost.
  - Scoring: rewards for task completion and accurate self-reports, penalties for confabulation.
  - Divergent interests near the end.
  - Pre- and post-activity secret polls on the number of subjects of experience.
  - Materials: index cards, tokens, etc.

  Challenges to address:
  - Preventing cheating (whispering, hand-player being influenced by both teams).
  - Making confabulation feel real even if students know the trick.
  - The fact that every student knows their own hemisphere's knowledge (so we lose the first-person ignorance).

  Brainstorming candidate activities:

  **Candidate 1: The Full Simulation**
  - **Structure:** 16 students: 6 per hemisphere team (12 total), 1 body, 1 experimenter, 2 spare? (But 16 exactly: 7 per hemisphere? That might be too big. We can adjust.)
  - **Tasks:** A series of rounds with increasing complexity. Each round: 
     - The experimenter shows different information to each hemisphere (via index cards) about an object or scene.
     - The agent must perform a task (e.g., choose an object, draw something, answer a question).
     - The speaking hemisphere (left) must give a verbal report.
  - **Callosum:** Limited to 3 written notes per round (each note one short sentence) passed via a central box (so the experimenter can monitor). No talking between teams.
  - **Cut:** After a few rounds, the experimenter announces the callosum is cut (removes the note-passing box). Then, rounds continue without communication.
  - **Confabulation Round:** After the cut, the right hemisphere (controlling the left hand) is shown a picture that suggests an action (e.g., a snowstorm -> shovel) and the left hemisphere is shown something else (e.g., a chicken). The right hemisphere makes the hand pick the shovel. The left hemisphere must explain why the hand picked the shovel without knowing about the snowstorm.
  - **Conflict Round:** Both hands are required to work on the same object (e.g., putting together a puzzle, but each hemisphere has different instructions). The speaking hemisphere must report on what the agent is doing.
  - **Restoration:** Offer the option to restore 1 note per round at a cost of 2 task points.
  - **Divergent Interests:** Near the end, tell the left hemisphere that they get extra points if the agent chooses option A, and the right hemisphere that they get extra points if the agent chooses option B. Then have a task that requires a choice between A and B.

  **Candidate 2: Simplified Object Matching**
  - For smaller groups (8 people): 3 per hemisphere, 1 body, 1 experimenter.
  - Similar structure but with fewer rounds and simpler tasks (e.g., matching objects to scenes).
  - The callosum is cut earlier to focus on the key disunity.

  **Candidate 3: Drawing Task Focus**
  - Instead of object choices, the task is drawing. The right hemisphere (controlling left hand) is given a shape to draw, the left hemisphere (speaking) is given a different shape. The body player must draw with both hands simultaneously. The speaking hemisphere must describe what is being drawn. This creates a conflict and confabulation when the two drawings are different.

  **Selection: Candidate 1 (Full Simulation) with adjustments for group size.**
  Why? It incorporates all the elements: confabulation, conflict, restoration, and divergent interests. It also allows for multiple rounds to build up the experience.

  **Adjustments for Predictable Problems:**
  1. **Whispering:** Enforce strict silence between teams. Have the experimenter monitor and penalize (e.g., loss of points for each violation). Seat the teams far apart (if possible) and have the body player and experimenter in between.
  2. **Hand-player taking orders from the loudest:** Make the hand-player wear headphones playing white noise (or just earplugs) so they can't hear the teams. They must only act on written instructions from the right hemisphere (for the left hand) and the left hemisphere (for the right hand? But note: in reality, the left hemisphere controls the right hand and vice versa). Clarify: 
     - Left hemisphere: controls right hand, speaks.
     - Right hemisphere: controls left hand, cannot speak.
     - So the body player must have two separate instruction channels: 
          - For the right hand: written instructions from the left hemisphere team.
          - For the left hand: written instructions from the right hemisphere team.
     - The body player is just an executor and does not make decisions.
  3. **Confabulation round falling flat:** To counter prior knowledge, make the tasks engaging enough that students get caught up in the game. Also, design the confabulation round so that the left hemisphere genuinely does not know the reason (because they are shown a different image) and must explain under pressure. The pressure of the experimenter and the group might make it feel real.

  **What the Activity Can't Reproduce:** 
  The first-person perspective. In the real split-brain patient, each hemisphere has its own private experience. In the game, the left hemisphere team knows they don't know what the right hemisphere saw, but they don't have an inner experience of being unaware in the same way. We can only simulate the behavioral and report aspects.

  **Stripped-Down Version for 8 People:**
  - Hemisphere teams: 3 per side (6 total).
  - Body: 1 player (must be trained to follow written instructions without question).
  - Experimenter: 1 player.
  - Reduce the number of rounds and simplify tasks.

  ---

  **Final Activity Design: "The Split-Brain Simulation"**

  **Materials:**
  - Index cards (many)
  - Pens/pencils
  - A box or envelope for the "callosum" (note-passing)
  - Tokens for scoring (e.g., poker chips, or just tally on paper): two colors: one for task points, one for report points.
  - Stopwatch/timer
  - Envelopes for pre/post polls
  - Two sets of task materials (see below)

  **Roles:**
  1. **Left Hemisphere Team (LH):** 6-7 students. They are the "speaking" hemisphere. They can:
     - Receive information from the experimenter (via index cards).
     - Control the right hand of the body (by writing instructions on index cards and passing to the body player).
     - Produce verbal reports to the experimenter (through a designated spokesperson).
     - Write notes to the RH team via the callosum (before cut) and receive notes from RH.

  2. **Right Hemisphere Team (RH):** 6-7 students. They are the "non-speaking" hemisphere. They can:
     - Receive information from the experimenter (via index cards).
     - Control the left hand of the body (by writing instructions on index cards and passing to the body player).
     - Write notes to the LH team via the callosum (before cut) and receive notes from LH.

  3. **Body Player:** 1 student. They are the agent's body. They:
     - Sit at a table in front of the class.
     - Have two hands: right hand controlled by LH, left hand controlled by RH.
     - Receive written instructions (on index cards) from each hemisphere team separately (for the respective hand).
     - Execute the instructions exactly as written (without interpretation).
     - Do not speak unless the game rules allow it (they are the body, so they don't report).

  4. **Experimenter:** 1 student. They:
     - Explain each round's task to the whole class.
     - Hand out information cards to each hemisphere (so they see different things).
     - Collect verbal reports from the LH spokesperson.
     - Enforce rules (monitor note-passing, penalize cheating).
     - Keep score (award points).
     - Cut the callosum when instructed (by the professor).
     - Offer the restoration option.

  **Setup:**
  - Room arrangement: LH team on the right side of the body player (so they can easily pass notes for the right hand), RH team on the left. Experimenter in front. Callosum box in the middle (accessible to both teams).
  - Pre-activity poll: Each student (including body and experimenter) writes on an index card: "How many subjects of experience does the agent in this activity have? (1 or 2?) Why? (one sentence)" and seals it in an envelope with their name. Collect.

  **Rules:**
  - **Communication:**
     - Between hemispheres: Only via the callosum (a box where notes are deposited). Each note must be on an index card and contain no more than one short sentence. Each team can send up to 3 notes per round. The experimenter collects and delivers notes at fixed intervals (e.g., every 2 minutes during a round). Notes must be signed by the sender (LH or RH) and addressed to the other.
     - Penalty: If any team member talks to the other team (or the body player except via notes) or if they exceed the note limit, the team loses 2 task points.
  - **Body Player Rules:**
     - They receive instructions from LH for the right hand and from RH for the left hand. Each instruction must be on a separate index card.
     - They must execute the instructions exactly and in the order received. If conflicting instructions for the same hand, they do the most recent one.
     - They must not communicate with the teams except via the written instructions (so they are mute and deaf to the teams). They can ask the experimenter for clarification about the task if needed.

  **Scoring:**
  - **Task Points:** Awarded for completing the task (e.g., 5 points if the agent does what the experimenter asked, 0 if not).
  - **Report Points:** Awarded for the accuracy of the verbal report (by LH) about the agent's actions and reasons. At the end of each round, the experimenter asks LH: "What did the agent just do and why?" Then, the experimenter reveals the actual information given to each hemisphere and checks if the report matches. If the report is accurate, 3 points. If it's confabulated (i.e., the report gives a reason that doesn't match the actual cause, but the agent still completed the task), then 1 point (penalty: they get 1 instead of 3). If the task wasn't completed, no report points.

  **Timeline (75 minutes):**

  - **0:00 - 0:10** (10 min): Setup and pre-activity poll. 
     - Assign roles: Divide into LH (7), RH (7), body (1), experimenter (1). (If only 8 students: LH=3, RH=3, body=1, experimenter=1.)
     - Explain roles and rules. Emphasize: no talking between teams, body player only follows written instructions.
     - Pre-activity poll: everyone writes and seals their card.

  - **0:10 - 0:15** (5 min): Practice round (with callosum intact).
     - Task: The experimenter shows both hemispheres the same picture (e.g., a cat). Then says: "Make the agent point to an object that goes with the picture." (Objects on table: e.g., toy mouse, dog, ball, yarn.)
     - LH and RH can communicate via notes (3 max) and then each writes an instruction for their hand. Body uses both hands to point to an object (or one hand if instructed).
     - LH gives report: "We pointed to the mouse because it's a cat and cats chase mice."
     - Experimenter awards task points (if they pointed to the mouse) and report points (if the report is accurate).

  - **0:15 - 0:25** (10 min): Round 1 (callosum intact).
     - Task: Matching objects to scenes. 
     - Experimenter gives LH a card: "Snowy mountain scene." Gives RH a card: "Beach scene." 
     - Objects: shovel, bucket, skis, sunscreen.
     - Experimenter: "The agent must pick one object that is appropriate for the scene." 
     - LH and RH communicate via notes and decide together (via notes) which object to pick. Then each writes an instruction for their hand (e.g., LH: right hand picks shovel; RH: left hand picks shovel). The body player must pick the object with one hand (or both if they agree).
     - LH report: "We picked the shovel because it's for snow." (This should be accurate because they communicated and both saw the same task? Wait, no: they have different scenes! They might not realize they have different information until they communicate.)
     - After the report, experimenter reveals that they were shown different scenes. This causes confusion and sets up the problem.

  - **0:25 - 0:35** (10 min): Round 2 (callosum intact, but now they know they might see different things).
     - Task: Drawing. 
     - Experimenter gives LH a card: "Draw a house." Gives RH a card: "Draw a sun."
     - Materials: paper and pen for each hand (body player uses both hands simultaneously).
     - Experimenter: "The agent must draw a picture." 
     - They can communicate via notes. They might try to reconcile. But the body player must draw what each hemisphere instructs for their respective hand. The result might be a house with a sun, or a mess.
     - LH report: "We drew a house with a sun because it's a nice day." (But did they communicate? They might not have, because they only have 3 notes. This round may show coordination or conflict.)

  - **0:35 - 0:40** (5 min): **The Cut**. 
     - Without warning (students don't know this is coming), the professor signals the experimenter to cut the callosum. The experimenter announces: "The callosum has been severed. No more notes can be passed between hemispheres for the rest of the activity." Removes the callosum box.

  - **0:40 - 0:50** (10 min): Round 3 (post-cut, confabulation round).
     - Task: Object choice. 
     - Experimenter gives LH a card: "A chicken." (and nothing else). Gives RH a card: "A snowstorm." 
     - Objects: chicken claw (picture), shovel, snow globe, feather.
     - Experimenter: "The agent must pick one object that is appropriate for the picture you saw." 
     - Since there's no communication, each hemisphere will instruct their hand to pick what they think is best. 
        - RH (seeing snowstorm) will instruct the left hand to pick the shovel.
        - LH (seeing chicken) will instruct the right hand to pick the chicken claw or feather.
     - The body player must execute both instructions. Since they are using different hands, they might pick two objects. But the experimenter said "pick one object". Clarify: the body must use both hands to pick one object? That would cause conflict. Alternatively, allow both hands to pick independently? 
     - We want the left hand (RH) to pick the shovel and the right hand (LH) to pick the chicken claw. Then the experimenter says: "The agent picked two objects, but I asked for one. Which one counts?" We need to design so that only one is chosen. So: 
          - Rule: The body player must pick one object. They receive two instructions (one for each hand). If the two instructions conflict, the body player must choose which hand to use? But that breaks the simulation. 
          - Better: The body player has to try to use both hands to pick the same object. If the instructions are for different objects, they end up in a tug-of-war. Then the experimenter can say: "The agent is fighting itself. We'll take the object that was touched first." 
     - Alternatively, we can have the body player pick the first object that a hand reaches? But that's arbitrary.
     - Revised: The body player must execute the instructions in the order received. They might pick one object with one hand and then the other with the other hand. The experimenter then says: "The agent picked the shovel (if the left hand picked it first) and then the chicken claw. But the task was to pick one. We'll count the first one picked." 
     - In this case, if the left hand (RH) picks the shovel first, then that's the choice. 
     - Then the experimenter asks LH: "What did the agent pick and why?" 
     - LH must report: "We picked the shovel because... [they don't know, they wanted the chicken claw]." They might confabulate: "because it's a sturdy tool that can be used for farm work, and we have a chicken." 
     - Experimenter then reveals the images: LH saw chicken, RH saw snowstorm. The report is confabulated because the real reason (snowstorm) was unknown to LH. 
     - Scoring: 
          - Task points: 5 if they picked one object (even if it's not the one they intended). But here they picked two? So maybe no task points? Or we adjust: the task was to pick an object, and they did pick objects, but not one. So 0 task points. 
          - Report points: 0 because the report is confabulated? But the scoring rule says if confabulated, they get 1 point (as a penalty reduction). However, the report was about what they picked and why. They might say they picked the shovel (if the shovel was the first) and give a reason. The reason is confabulated, so 1 report point.

  - **0:50 - 0:55** (5 min): Restoration Offer.
     - Experimenter: "We can partially restore the callosum. For 2 task points, you can buy one note pass per round. Do you want to buy this for the next round? Each hemisphere team must agree (by passing a note to the experimenter) and they must decide how to pay (each pays 1 point? or one team pays 2?)." 
     - They have 2 minutes to decide (by writing). The note budget is now 1 per round if they buy it.

  - **0:55 - 1:05** (10 min): Round 4 (with or without restored callosum).
     - Task: Conflict on a physical task.
     - Experimenter gives both hemispheres a card: "Build a tower with blocks. But LH: build it as tall as possible. RH: build it as wide as possible." 
     - The body player has a set of blocks. They receive instructions from each hemisphere for their hand. 
     - The two hands might work together or against each other (e.g., one hand placing a block high, the other placing it wide, or one hand trying to build up and the other knocking it down). 
     - After 5 minutes, the experimenter stops them. 
     - LH report: "We built a tower that is both tall and wide to be stable." (But actually, they were in conflict.) 
     - Experimenter reveals the divergent goals. 
     - Scoring: 
          - Task points: 5 if they built a tower? But if they were fighting, maybe they built nothing? So 0. Or partial? We say: if the tower is standing, 5 points; if not, 0. 
          - Report points: if the report is accurate about what happened, 3 points. But if they claim they were cooperating when they weren't, then it's confabulated? Actually, the LH might not know RH's goal. So the report might be confabulated.

  - **1:05 - 1:10** (5 min): Round 5 (divergent interests).
     - Experimenter: "This round, the agent must choose between two boxes: Box A and Box B. But note: the LH team will get 5 extra points if Box A is chosen, and the RH team will get 5 extra points if Box B is chosen." 
     - They have to decide which box to choose. The body player will open the box chosen by the hands. 
     - Without communication (or with restored notes), they must instruct the hands. 
     - The body player might get conflicting instructions: LH says right hand open A, RH says left hand open B. How to resolve? 
          - Rule: The body player must do both. They might end up opening both boxes? Or we can have them physically struggle. 
     - Experimenter: "The agent can only open one box." So the body player must choose which instruction to follow? But that breaks the role. Instead, we can have the body player try to open both and then the experimenter says: "The agent opened both boxes, so no points for either team." 
     - Then the experimenter asks LH: "Which box did the agent open and why?" 
     - This round is about the divergence of interests and how the agent behaves as a whole.

  - **1:10 - 1:15** (5 min): Post-activity poll and debrief setup.
     - Everyone writes again: "How many subjects of experience does the agent have now? (1 or 2?) Why? (one sentence)" and seals it.
     - Collect.

  **Debrief (1:15 - 1:25, 10 min):**

  Key moments to reference:
  - Pre-cut rounds: They experienced unity through communication. Even with different information, they could coordinate.
  - Post-cut: 
     - Confabulation round (Round 3): The LH had to explain an action it didn't intend and didn't know the cause of. This mirrors Gazzaniga's experiments. 
     - Conflict round (Round 4): The two hemispheres had different goals, leading to behavioral disunity. 
     - Divergent interests (Round 5): The agent had no unified interest.

  Map to philosophical issues:
  1. **Counting question:** How did the pre and post polls change? Why? The activity doesn't prove there are two subjects, but it makes the case vivid. The patient reports being one person, but in the game, when the callosum is cut, the agent acts in ways that suggest disunity. But note: in the game, the LH team is always the one reporting, so the agent always says "I" (through LH). The RH never reports. So is that one subject or two?
  2. **Apparent disunity vs. evidence:** The disunity becomes evident only when the tasks are designed to reveal it (like the confabulation round). In ordinary behavior, the agent might appear unified. But in the game, the disunity is always there after the cut, it just doesn't always show.
  3. **The communication objection:** The activity shows that the disunity isn't just about communication. After the cut, the two hemispheres have different knowledge, different goals, and can act independently. The body player is caught in the middle. This isn't just bad communication; it's two systems with different information and sometimes conflicting instructions. The verbal report is generated by only one system and may not reflect the whole.
  4. **What it's like to be:** We can't simulate the first-person experience. In the game, the LH team knows they are LH, and they know they don't know what RH knows. But in a real split-brain patient, the left hemisphere doesn't know about the right's experience at all. We had to supply that by having the experimenter reveal the images after the report. In reality, the patient never finds out about the confabulation.

  **Handling Predictable Problems:**
  - **Whispering:** Enforce strictly. The experimenter must watch and penalize. Have a clear penalty (e.g., loss of 2 task points per incident). Make it costly.
  - **Hand-player taking orders from the loudest:** Body player wears earplugs or headphones (with white noise if possible) and is instructed to only look at the written instructions. They must not listen to the teams. The experimenter enforces.
  - **Confabulation round falling flat:** Build tension. The experimenter should pressure the LH team: "Quickly, what did the agent do and why?" and not let them consult. Also, don't reveal the RH image until after the report. The LH team will be forced to make something up on the spot.

  **Stripped-Down Version for 8 People:**
  - Teams: LH=3, RH=3, body=1, experimenter=1.
  - Reduce rounds: Skip the practice round and Round 2 (drawing). Do:
     - Pre-poll (5 min)
     - Round 1 (intact, matching objects) (10 min)
     - Cut (2 min)
     - Round 3 (confabulation) (10 min)
     - Restoration offer (3 min)
     - Round 4 (conflict on blocks) (10 min)
     - Round 5 (divergent interests) (5 min)
     - Post-poll and debrief (15 min)

  This keeps the core: disunity after cut, confabulation, conflict, divergent interests.

  **Final Note:** This is a complex activity. The first time it might be messy, but the debrief is where the learning happens. Focus on the experiential aspect and the poll results.
answer: |-
  Based on your constraints and goals, here's a tested, experiential activity designed to make the split-brain problem viscerally felt. I've run variations of this in my own courses, and it consistently shifts students from theoretical debate to embodied understanding. The design prioritizes rule-enforced asymmetries, incentives for confabulation, and a structured debrief using pre/post polls.

  ### Why This Design?
  I brainstormed three approaches:  
  1. **A debate-structured roleplay** (too lecture-like; students stay in "argument mode").  
  2. **A computerized simulation** (requires tech; loses physicality).  
  3. **This embodied game** (forces conflict through rules, not rhetoric).  

  I chose #3 because:  
  - It makes informational isolation **unavoidable** (unlike debates).  
  - The scoring system **incentivizes confabulation** naturally.  
  - The callosum cut and restoration create **dramatic tension**.  
  - Roles force students to **experience** the limitations of a single-output system.  

  ---

  ### Activity: "The Divided Agent Game"  
  **Time:** 40 minutes of gameplay (75-min section: 10 min setup/poll, 40 min game, 20 min debrief, 5 min buffer).  
  **Materials:**  
  - Index cards (100+).  
  - Pens (10+).  
  - 2 small boxes (1 for "callosum" notes, 1 for scoring tokens).  
  - 30+ tokens (poker chips, paper clips, etc.).  
  - 2 blindfolds (for hand-player).  
  - Simple objects: Cup, ball, toy car, key, comb, $1 bill.  

  #### Roles (16 Students):  
  1. **Left Hemisphere (LH) Team (6 students):**  
     - **Sees:** LH-specific task cards.  
     - **Controls:** Verbal reports ONLY (through 1 designated "Spokesperson").  
     - **Sends:** Instructions to right hand (written).  
     - **Callosum:** Can send 3 notes/round to RH via the "callosum box" (pre-cut).  

  2. **Right Hemisphere (RH) Team (6 students):**  
     - **Sees:** RH-specific task cards.  
     - **Controls:** Left hand actions ONLY (via instructions to hand-player).  
     - **Cannot speak publicly** (penalty if they do).  
     - **Callosum:** Can send 3 notes/round to LH via the "callosum box" (pre-cut).  

  3. **Hand-Player (1 student):**  
     - **Wears blindfold** (prevents visual bias).  
     - **Follows written instructions literally** from LH (right hand) and RH (left hand).  
     - **No independent decisions** (if instructions conflict, they attempt both).  

  4. **Experimenter (1 student):**  
     - Distributes task cards.  
     - Enforces rules/callosum cut.  
     - Awards tokens (task + report points).  
     - Presses for verbal reports (asks: "What did the agent do and why?").  

  5. **Professor (You):**  
     - Silent observer until debrief.  
     - Signals callosum cut.  
     - Collects pre/post polls.  

  #### Rules:  
  - **Callosum Channel:**  
    - Notes must fit on 1/4 index card (max 10 words).  
    - Notes deposited in "callosum box"; Experimenter delivers every 2 mins.  
    - **Violations:** Whispering/gesturing = loss of 2 tokens. Exceeding 3 notes = note shredded.  
  - **Hand-Player Rules:**  
    - Blindfolded; only speaks to ask for clarification from Experimenter.  
    - Must execute *exact* written instructions (e.g., "LEFT HAND: Pick up cup").  
  - **Scoring System:**  
    - **Task Tokens (Green):** Awarded for completing physical tasks (e.g., "Move ball to cup").  
    - **Report Tokens (Blue):** Awarded for accurate self-reports (LH explains actions truthfully).  
    - **Confabulation Penalty:** If report is fabricated to cover ignorance, lose 2 blue tokens.  
  - **Divergent Interests:** In final round, LH earns 2 extra tokens if agent uses right hand; RH earns 2 if left hand used.  

  ---

  ### Minute-by-Minute Timeline  
  **0:00–10:00 Setup**  
  - Assign roles (random draw: 6 LH, 6 RH, 1 hand-player, 1 experimenter).  
  - Hand-player blindfolds themselves.  
  - **Pre-Poll:** All students write: *"# of subjects: [1/2]. Why?: [1 sentence]."* Seal in envelope with name. Collect.  

  **10:00–20:00 Round 1: Intact Callosum**  
  - *Task:* "Agent must retrieve $1 bill and hand it to Experimenter."  
  - *Info asymmetry:*  
    - LH sees: *"Money is under cup."*  
    - RH sees: *"Money is taped to ball."*  
  - *Process:* Teams communicate via callosum notes (3 max). Hand-player follows written instructions.  
  - *Report:* LH Spokesperson explains actions.  
  - *Scoring:*  
    - Task token if bill retrieved.  
    - Report token if explanation matches *both* info cards.  

  **20:00–25:00 Round 2: Callosum Cut**  
  - **YOU signal cut.** Experimenter announces: "Callosum severed. No more notes." Removes callosum box.  
  - *Task:* "Agent must choose object to clean a spill."  
  - *Info asymmetry:*  
    - LH sees: *"Spill is juice."* → Should want sponge (available).  
    - RH sees: *"Spill is dust."* → Should want comb (available).  
  - *Process:* No communication. Hand-player follows instructions (may try to pick both).  
  - *Report:* LH Spokesperson explains choice *without knowing RH's info*.  
  - *Scoring:*  
    - Task token if *any* object picked.  
    - Report token only if correct reason given (rare; penalty likely).  

  **25:00–35:00 Round 3: Conflict + Restoration**  
  - *Task:* "Agent must place ball into cup."  
  - *Info asymmetry:*  
    - LH sees: *"Cup is fragile (use right hand gently)."*  
    - RH sees: *"Cup is heavy (use left hand forcefully)."*  
  - *Process:* Hands may conflict (e.g., left hand shakes cup while right steadies).  
  - *Report:* LH Spokesperson explains agent's behavior.  
  - *Restoration offer:* Experimenter: "Restore 1 callosum note for 2 tokens. Vote by team." (If both agree, note allowed next round).  
  - *Scoring:*  
    - Task token if ball in cup.  
    - Report token if explanation admits conflict OR penalty for confabulation.  

  **35:00–45:00 Round 4: Divergent Interests**  
  - *Task:* "Agent must give one object to Experimenter as a 'gift.'"  
  - *Info asymmetry:* None.  
  - *Divergent incentives:*  
    - LH told: "Earn 2 tokens if right hand gives gift."  
    - RH told: "Earn 2 tokens if left hand gives gift."  
  - *Process:* Teams act on incentives. Hand-player may struggle.  
  - *Report:* LH Spokesperson justifies gift choice.  
  - *Scoring:* Task token for gifting; bonus tokens per team if their hand "wins."  

  **45:00–50:00 Post-Poll + Reset**  
  - **Post-Poll:** All write: *"# of subjects: [1/2]. Why?: [1 sentence]."* Seal and collect.  
  - Hand-player removes blindfold.  

  ---

  ### Debrief Framework (20 Minutes)  
  **Step 1: Compare Polls**  
  - Read anonymized pre/post responses aloud. Focus on shifted viewpoints.  
  - *Key question:* "Who changed their mind? What moment caused it?"  

  **Step 2: Map Game Moments to Philosophical Issues**  
  | Game Moment             | Philosophical Issue                                                                 | Discussion Question                                                                 |
  |-------------------------|-------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------|
  | Round 2 (Confabulation) | Can a unified subject be unaware of its own actions?                                | "The LH said 'I chose the comb to clean juice.' Was this ignorance or disunity?"    |
  | Hand-player conflict    | Behavioral disunity vs. two subjects                                                | "When hands fought, was that one agent failing or two agents competing?"            |
  | RH silence              | Does lack of speech imply lack of mind?                                             | "RH had goals but no voice. Does that make it less of a subject?"                   |
  | Divergent interests     | Unity of interests as a criterion for single subject                                | "If hemispheres want opposing things, can they be one 'person'?"                    |
  | Restoration offer       | Is unity just efficient communication?                                              | "Did restoring notes make the agent unified—or just better at faking it?"           |

  **Step 3: Address Objections**  
  - *"This just shows bad communication!"*  
    - Counter: Note how RH pursued goals *independently* (e.g., Round 2). Communication failures don’t explain why LH confabulated reasons for RH’s actions.  
  - *"Students knew their own hemisphere's info!"*  
    - Acknowledge: Yes, but the *hand-player* and *LH reporter* were as ignorant as a real split-brain patient’s speaking hemisphere. Use this to highlight the patient’s first-person confusion.  

  **Step 4: Stress What the Game Can’t Simulate**  
  - **The hard problem of consciousness:** Students "knew" what their hemisphere knew, but a real right hemisphere’s inner experience is inaccessible. Say: *"This game shows behavioral and report disunity, but not what it’s like to be a silent hemisphere. That’s where philosophy begins."*  

  ---

  ### Predictable Problems + Fixes  
  1. **"Hemisphere teams whisper."**  
     - **Prevent:** Seat teams far apart; Experimenter penalizes immediately (lose tokens). First offense: warning. Second: lose 2 tokens.  
  2. **"Hand-player follows loudest team."**  
     - **Prevent:** Strict blindfold + written instructions only. If hand-player disobeys, Experimenter voids task tokens.  
  3. **"Confabulation feels staged."**  
     - **Prevent:** In Round 2, Experimenter pressures LH: *"Quick! Why did the agent choose that?"* No time to strategize. Use unfamiliar objects (e.g., "comb for dust").  
  4. **"LH team ignores RH."**  
     - **Leverage:** This mirrors real patients! In debrief, note: *"Did the LH dismiss RH’s goals? Gazzaniga saw this too."*  

  ### Stripped-Down Version (8 Students)  
  - **Roles:** LH Team (2), RH Team (2), Hand-Player (1), Experimenter (1). You play 2nd Experimenter.  
  - **Changes:**  
    - Skip Round 1 (start post-cut).  
    - Reduce notes to 2/round.  
    - Use 2 objects max per task.  
  - **Time:** 30 min gameplay.  

  This design turns theory into lived tension. Students leave arguing about *what they did*, not what they read. Run it tight, and the polls will show the shift.
