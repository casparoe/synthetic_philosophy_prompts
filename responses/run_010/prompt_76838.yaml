  Hmm. The pro case likely centers on valence requiring expectation comparison. Raw reward as valence would make thermostats "suffer" during temperature changes - absurd. RPE solves this by making valence relational. The competence/flatness issue then becomes a feature: it predicts the hedonic treadmill we observe in humans.

  For the con case: RPE's context-dependence is problematic. Identical stimuli produce opposite RPEs based on expectation. But we don't think a burn hurts less if expected - the badness feels intrinsic. Wireheading exposes deeper flaws: high reward with perfect prediction yields near-zero RPE, which should be neutral valence. Yet the agent starves. If we say "but survival matters", we've smuggled in external welfare criteria beyond RPE.

