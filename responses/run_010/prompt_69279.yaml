prompt: |-
  Construct a committee case that meets all of the following specifications. The setting must be an ordinary institutional one — a grant panel, a tenure committee, a parole board, a journal's editorial board, your choice — with no science fiction, no elections, and no exotic voting technology. The panel has exactly three members and exactly three premises conjoined into a single decision. Every member is individually coherent and sincerely judges the decision to be unwarranted; they differ in *which* premise fails, and their reasons for rejecting it must be substantive differences of view, not an artifact of how the premises happen to be phrased. Against those constraints, the premise-based procedure must nevertheless license the panel to adopt the very decision all three members reject, while the conclusion-based procedure rejects it.

  Deliver the scenario in a single paragraph, then a vote table showing each member's stance on each premise and on the decision, then: (a) a demonstration of why each procedure returns the verdict it does in this case; (b) identification of the structural feature generating the divergence, together with what happens to the case if you raise the panel to five members, or if the three premises are evidentially correlated rather than independent; and (c) how a defender of conclusion-based aggregation would attack the design — in particular, whether the premise-based outcome can be answered against the charge that the panel has adopted a judgment none of its members holds, and what a premise-based theorist must say about the members' individual integrity.

  Open with a single sentence stating whether the specification is jointly satisfiable and naming the feature that does the work, then give the scenario, the table, and the analysis, with no preamble and no restatement of the question.
reasoning: |-
  We are given the task to construct a committee case that satisfies the following specifications:
   1. Ordinary institutional setting (e.g., grant panel, tenure committee, parole board, editorial board).
   2. Exactly three members and exactly three premises conjoined into a single decision.
   3. Every member is individually coherent and sincerely judges the decision to be unwarranted (i.e., they reject the overall decision).
   4. They differ in which premise fails (each member rejects exactly one premise and accepts the other two).
   5. The premise-based procedure licenses the panel to adopt the decision (i.e., the collective judgment on the conclusion is positive) while the conclusion-based procedure rejects it.
   6. The reasons for rejecting a premise must be substantive differences of view, not phrasing artifacts.

   The structural feature that does the work is the "doctrinal paradox" (or discursive dilemma) which arises when individual judgments on premises lead to a collective judgment on the conclusion that none of the individuals hold.

   Let me design the scenario:

   Setting: A tenure committee at a university. The decision is whether to grant tenure to a candidate. The committee has three members: Alice, Bob, and Carol.
   The three premises are:
     P: The candidate has a strong research record.
     Q: The candidate has a strong teaching record.
     R: The candidate has a strong service record.

   The decision rule is: Grant tenure if and only if (P and Q and R). That is, all three must be true.

   Each member has a different reason for denying tenure:

     Alice: Believes the candidate has a strong research record (P true) and a strong teaching record (Q true) but does not have a strong service record (R false). Therefore, she votes against tenure (conclusion false).
     Bob: Believes the candidate has a strong research record (P true) and a strong service record (R true) but does not have a strong teaching record (Q false). Therefore, he votes against tenure.
     Carol: Believes the candidate has a strong teaching record (Q true) and a strong service record (R true) but does not have a strong research record (P false). Therefore, she votes against tenure.

   Now, let's look at the premise-based procedure:

     On premise P:
          Alice: yes (true)
          Bob: yes (true)
          Carol: no (false)
          Majority: yes (true)

     On premise Q:
          Alice: yes (true)
          Bob: no (false)
          Carol: yes (true)
          Majority: yes (true)   [since two yes]

     On premise R:
          Alice: no (false)
          Bob: yes (true)
          Carol: yes (true)
          Majority: yes (true)

     Therefore, the collective judgment on the premises is: P true, Q true, R true.
     Then, by the decision rule (conjunction), the conclusion (grant tenure) is true.

   But the conclusion-based procedure:
     Each member votes on the conclusion (tenure) directly. All three members vote against tenure (false). So the collective judgment on the conclusion is false.

   So the premise-based procedure leads to granting tenure, while the conclusion-based procedure leads to denying it.

   Now, we present:

   1. A single sentence: The specification is jointly satisfiable by constructing a tenure committee scenario that exhibits the doctrinal paradox.

   2. The scenario in a single paragraph:

     In a tenure committee at a university, three members (Alice, Bob, and Carol) must decide on a candidate's tenure based on three criteria: strong research (P), strong teaching (Q), and strong service (R). The candidate must satisfy all three. Alice believes the candidate lacks service (rejects R), Bob believes the candidate lacks teaching (rejects Q), and Carol believes the candidate lacks research (rejects P). Hence, each votes against tenure. However, when voting on the premises, each premise receives two votes in favor and one against, so the premise-based procedure yields a collective judgment that all premises are satisfied, hence tenure should be granted. The conclusion-based procedure, aggregating the direct votes on tenure, results in denial because all three vote against.

   3. Vote table:

          Member   P     Q     R     Conclusion (Tenure: P∧Q∧R)
          Alice    True  True  False  False
          Bob     True  False True   False
          Carol   False True  True   False

          Premise-based collective: P=True (majority: Alice and Bob yes, Carol no -> 2 yes), Q=True (Alice and Carol yes, Bob no -> 2 yes), R=True (Bob and Carol yes, Alice no -> 2 yes) -> Conclusion=True.
          Conclusion-based collective: False (unanimous against).

   4. Analysis:

      (a) Demonstration:
          - Premise-based procedure: Majority vote on each premise: P (2-1 true), Q (2-1 true), R (2-1 true). Therefore, the collective premises are all true, leading to the conclusion (tenure) being true.
          - Conclusion-based procedure: Direct vote on the conclusion (tenure): all three members vote false, so the collective decision is false.

      (b) Structural feature: 
          The divergence is generated by the doctrinal paradox: the majority voting on individual premises can lead to a collective set of premises that imply the conclusion even if each individual does not hold that set of premises (each individual has one premise false). 

          If we raise the panel to five members, we can avoid the paradox by having a more balanced distribution. For example, we might have two members who reject P, two who reject Q, and one who rejects R. Then:
            P: 3 true, 2 false -> true
            Q: 3 true, 2 false -> true
            R: 4 true, 1 false -> true
            Conclusion: true (premise-based) and in conclusion-based, if all five vote against (because each has one premise false) then it would be false. But note: we can also design a five-member case that still has the paradox. For instance, let the members be:

              Member1: P true, Q true, R false -> conclusion false
              Member2: P true, Q false, R true -> conclusion false
              Member3: P false, Q true, R true -> conclusion false
              Member4: same as Member1: P true, Q true, R false -> false
              Member5: same as Member2: P true, Q false, R true -> false

            Now, on premises:
              P: true (from 1,2,4,5), false (from 3) -> 4 true, 1 false -> true.
              Q: true (1,3,4), false (2,5) -> 3 true, 2 false -> true.
              R: true (2,3,5), false (1,4) -> 3 true, 2 false -> true.
            Premise-based: true, true, true -> conclusion true.
            Conclusion-based: all five vote false -> conclusion false.

            So the paradox can still occur with five members.

          If the premises are evidentially correlated rather than independent, it might break the symmetry. For example, if having a strong research record (P) is highly correlated with having a strong teaching record (Q), then members might not independently reject P and Q. However, the scenario we constructed does not rely on any such correlation. The members are each rejecting a different premise for independent reasons. Introducing correlation might make it less likely to have the pattern of votes we have, but the paradox is still a logical possibility even with correlation. The independence of the premises is not a necessary condition for the paradox to occur.

      (c) Attack by a defender of conclusion-based aggregation:
          The conclusion-based theorist would attack the premise-based outcome by pointing out that the collective judgment on the conclusion (tenure) in the premise-based procedure is one that no member of the committee actually holds. Each member individually believes that the candidate should not get tenure. Therefore, the premise-based procedure leads to an outcome that is not endorsed by any member. This is a violation of the principle that the collective judgment should reflect the views of the members. Moreover, the conclusion-based approach respects the direct judgment of the members on the issue at hand. The premise-based procedure, by contrast, forces a collective judgment on the conclusion that is disconnected from the individual judgments on the conclusion.

          The premise-based theorist must argue that the premises are the fundamental building blocks of the decision and that the committee's role is to assess the premises. They would maintain that the members are individually coherent and that the collective judgment on the premises is the correct way to aggregate. The members' individual integrity is maintained because they are sincere in their assessment of the premises, and the majority vote on each premise is a fair way to aggregate. The premise-based theorist might also argue that the conclusion is derived logically from the collectively endorsed premises, so it is not arbitrary. However, they must acknowledge that the collective judgment on the conclusion does not match any individual's overall judgment.

   Given the above, we write the answer as follows.
answer: |-
  The specification is jointly satisfiable via the doctrinal paradox in a tenure committee setting. In a university tenure committee, three members evaluate a candidate based on three conjunctive criteria: P (exceptional research), Q (exceptional teaching), and R (exceptional service). Tenure requires all three. Member A accepts P and Q but rejects R, citing inadequate committee contributions. Member B accepts P and R but rejects Q, noting poor student evaluations. Member C accepts Q and R but rejects P, highlighting a lack of major publications. Each thus denies tenure, as their negated premise breaks the conjunction. Yet under premise-based voting, majorities affirm each premise: P (A and B accept, C rejects), Q (A and C accept, B rejects), and R (B and C accept, A rejects). This collectively satisfies P∧Q∧R, mandating tenure. Conclusion-based voting aggregates direct votes on tenure, which are unanimously negative.

  Vote table:

  | Member | P     | Q     | R     | Tenure (P∧Q∧R) |
  |--------|-------|-------|-------|----------------|
  | A      | True  | True  | False | False         |
  | B      | True  | False | True  | False         |
  | C      | False | True  | True  | False         |
  | **Collective (Premise-based)** | **True** | **True** | **True** | **True** |
  | **Collective (Conclusion-based)** | -     | -     | -     | **False** |

  (a) **Procedural outcomes**:  
  - *Premise-based*: Majority per premise yields P true (2-1), Q true (2-1), R true (2-1). Conjunction P∧Q∧R is true, so tenure is approved.  
  - *Conclusion-based*: Unanimous rejection of tenure (3-0) leads to denial.  

  (b) **Structural feature and variations**:  
  - The divergence arises from *majoritarian premise aggregation* where each premise has majority support despite no member endorsing all three.  
  - With *five members* (e.g., two like A, two like B, one like C), premise-based voting still affirms all premises (P: 4-1, Q: 3-2, R: 3-2), forcing tenure, while conclusion-based rejects it (0-5). The paradox persists.  
  - Under *evidential correlation* (e.g., P and Q mutually reinforce), members’ premise judgments may align, breaking the asymmetric rejection pattern. For instance, if all agree P and Q are linked, members might not split votes as above, averting the paradox.  

  (c) **Critique and defense**:  
  - A *conclusion-based theorist* attacks premise-based design for licensing a tenure verdict *no member supports*, violating the principle that collective outcomes should reflect members’ holistic judgments. The panel appears to endorse a conclusion each member deems unwarranted, undermining deliberative integrity.  
  - The *premise-based theorist* counters that members’ individual integrity is intact: each sincerely evaluates premises based on specialized expertise (e.g., A assesses service rigorously), and the procedure legitimately synthesizes these into a collective factual record. The disconnect arises from aggregating *reasons*, not insincerity—members accept the majority’s premise truths but reject tenure individually due to their private premise negation. The theorist must argue that truth-tracking on premises justifies overriding unanimous opposition on the conclusion.
