  The three main voting ethics frameworks are clearly outlined:
  - Instrumental (voting as consequentialist calculus)
  - Expressive (voting as identity statement)
  - Lesser-evil (voting as harm reduction)

  But the user's personal contribution is the "decisiveness discount" idea - the notion that voters treat first-round votes as cost-free expression because they assume their vote won't be decisive. This needs careful handling since they want it both developed and attacked. I'll examine the evidence: did left-wing voters really behave this way? The stable polling for small parties suggests they might have, but the eventual shock outcome complicates things.

  For the mapping exercise (Point 1), I'll consider how each theory would judge:
  - Jospin's failure to consolidate the left
  - Small-party candidates who split the vote
  - Chirac's refusal to debate
  - The press and abstainers
  The instrumental view will struggle with non-voters, while expressive theory might defend the Trotskyist voters' choices.

  The arithmetic question (Point 2) is mathematically intriguing - with such a close margin, was individual vote impact really negligible? I'll calculate that even with 200k votes deciding the runoff spot, an individual's chance of being decisive was about 1 in 400,000. This doesn't refute instrumentalism but shows how tiny probabilities can carry huge stakes.

  On timing (Point 3), the key insight is that ethics shouldn't depend on luck. A vote that looked harmless when cast (for a Trotskyist) became catastrophic in hindsight. But all three theories reject outcome-dependent morality - they'd evaluate the vote based on what was known on April 21.

  For the second round (Point 4), the republican front presents a puzzle. The blank ballots suggest voters were doing something more complex than just choosing the lesser evil - perhaps "blocking" as a distinct category. This might expose gaps in existing taxonomies.

  Finally, the scope question (Point 5) reveals how narrow voting ethics literature is. The real lessons might be about institutional design (like the two-round system's flaws) and candidate ethics rather than individual voters. This case screams for a systems-level analysis.

  Throughout, I'll maintain the user's requested style: no citations, blunt about theoretical silences, and rigorous with the case specifics. The goal is to make this historical event interrogate theory, not vice versa.
answer: |-
  Your case study powerfully exposes tensions in voting ethics. Let's dissect the 2002 French election through your specified lenses, developing and critiquing the "decisiveness discount" before addressing each point systematically.

  **I. The Decisiveness Discount: Development and Critique**
  *   **The Proposal:** Voters possess a fixed "expressive budget," spending it where they perceive minimal decisiveness (low chance of affecting outcomes). First-past-the-post or multi-round systems incentivize spending this budget in early rounds (perceived low cost/risk) and acting instrumentally later. April 21st represents the "price coming due": voters for small left parties spent expressively, believing Jospin's runoff slot was assured (cost capped at zero), but the collective cost was Le Pen vs. Chirac.
  *   **Supporting Evidence:**
      *   **Stable Polling:** Small left candidates polled similarly for months. Voters likely perceived Jospin's runoff qualification as near-certain, making a vote for Chevènement/Trotskyists/Green seem "safe" expression.
      *   **Turnout Shift:** Increased turnout in round two suggests voters perceived *this* round as decisive, shifting from potential expressive/spoiled voting to instrumental blocking.
      *   **Blank/Spoiled Ballot Surge:** This surge in round two reflects voters fulfilling a perceived civic duty (voting) while refusing to endorse *either* option – consistent with exhausting their "budget" expressively in round one and having only instrumental/blocking energy left.
  *   **Undermining Evidence/Challenges:**
      *   **Le Pen's Rise:** His late polling surge *was* noted. Voters ignoring this risk undermines the idea they rationally calculated "insulated" outcomes; it suggests motivated reasoning or expressive fervor overriding instrumental caution.
      *   **Collective Action Logic:** The discount focuses on *individual* perceived decisiveness. The tragedy stems precisely from *many* individuals making the same "safe" expressive choice, collectively altering the outcome. The theory struggles to explain why voters didn't anticipate this collective effect if polls showed fragmentation.
      *   **Falsifiability:** The theory would be falsified if, under identical polling/fragmentation and perceived low decisiveness, voters *significantly* shifted from minor candidates to Jospin to ensure qualification. The stability of minor candidate support despite *known* risk (Le Pen's rise) weakens it.
  *   **Is it Genuine or Artifact?** It describes a plausible *psychology* ("My vote won't change anything, so I'll vote my heart") common in multi-candidate/round systems. However, framing it as a conscious "budget" is likely an ex post rationalization. It's more accurately a heuristic: *perceived low decisiveness enables expressive voting*.
  *   **Do the Three Accounts Give Reason to Abandon it?**
      *   **Instrumental:** *Forcefully.* It argues the voter massively misjudged the probability (outcome hinged on ~200k votes) and the stakes (Le Pen vs. Jospin). The catastrophic consequence reveals the expressive choice's true, uncapped cost.
      *   **Expressive:** *Ambivalently.* It validates the *impulse* to express identity but might condemn the *target* (supporting a candidate whose presence actively harms the values/group the voter claims to express by enabling Le Pen).
      *   **Lesser-Evil:** *Indirectly.* It implies the voter failed their duty at the *first* hurdle: choosing the lesser evil (Jospin) over a purer expression that risked enabling the greater evil (Le Pen). The runoff dilemma proves their first-round choice was wrong.

  **II. Mapping the Agents (Point 1)**

  | Agent              | Instrumental Account                                                                 | Expressive Account                                                                                                 | Lesser-Evil Account                                                                                               | Silences                                                                                     |
  | :----------------- | :----------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------- |
  | **Jospin Voter (R1)** | Criticized: Vote carried non-negligible decisiveness risk; failed to prevent Le Pen. | Defended: Declared Socialist affiliation/values.                                                                  | Criticized: Should have consolidated behind Jospin immediately as the clear lesser evil vs. Chirac/Le Pen threat. | Instrumental/LE: Why vote Socialist *specifically* vs. other lesser evils? Expressive: Why Jospin? |
  | **Trot/Green Voter (R1)** | Condemned: Expressive vote had catastrophic consequence due to misjudged probability. | Defended: Authentic declaration of radical values/identity; duty to express true beliefs.                          | Condemned: Prioritized purity over preventing existential threat (Le Pen); enabled greater evil.                  | All: Nuances *between* Trotskyist/Green motives/impact.                                      |
  | **Chevènement**     | Condemned: His candidacy split the instrumental vote, directly enabling Le Pen.       | Defended: Expressed his unique republican vision/split from Socialists.                                            | Condemned: Ego/purity over pragmatism; failed duty to consolidate against greater threat.                         | All: Motivations beyond ethics (ambition, ideology).                                         |
  | **Jospin (Campaign)** | Criticized: Failed instrumental duty to maximize chances by pressuring allies to withdraw. | Ambivalent: Maintaining Socialist identity/purity vs. compromising?                                               | Criticized: Failed duty to actively minimize the risk of greater evil (Le Pen) by consolidating the field.        | All: Political strategy vs. ethics; psychological burden.                                    |
  | **Chirac (R2 Deb)** | Defended: Debating Le Pen legitimizes him; no instrumental gain.                     | Condemned? Missed chance to express republican values vs. fascism? Or wise expression of refusal to engage?        | Defended: Denying platform minimizes evil; prudent blocking tactic.                                               | Expressive/LE: Nuance on *how* to oppose (silence vs. vocal condemnation).                   |
  | **Press (R2 Calls)** | Defended: Instrumentally necessary to maximize anti-Le Pen vote.                     | Problematic: Suppressing diverse expression for conformity; "republican front" as coercive.                       | Defended: Essential duty to rally against the greater evil, minimizing harm.                                      | Instrumental/LE: Potential chilling effect on dissent. Expressive: Value of dissent itself. |
  | **Abstainers (R1)** | Criticized: Failed tiny chance to prevent Le Pen/Jospin elimination.                 | Neutral/Defended: Abstention as expression of disillusionment/rejection of system.                                | Criticized: Abstention aids greater evil by lowering the threshold for its success.                               | All: Distinguishing principled abstention from apathy.                                       |
  | **Blank Voters (R2)** | Defended: Minimally fulfills civic duty (turnout) while refusing to endorse evil.    | Defended: Powerful expression of rejecting *both* options; "none of the above."                                   | Criticized: Failing the duty to actively block the greater evil (Le Pen) by not voting Chirac; risks aiding Le Pen. | Instrumental/LE: Does a blank vote *actually* help Le Pen? (Margin was huge).                |

  **III. The Arithmetic (Point 2)**
  *   **Probability:** With ~200k votes flipping the #2 spot among ~28.5 million voters (Turnout R1: ~71.6% of ~42.5m electorate ≈ 30.4m ballots cast? Standard figures place R1 votes at ~28.5m), the *ex ante* probability of a single vote being decisive was *not* negligible in the strict mathematical sense for such high stakes. It was likely on the order of 1 in 100,000 to 1 in 1,000,000 depending on modeling assumptions (e.g., closeness, turnout, correlated votes). This is vastly higher than in a typical national landslide.
  *   **Implication for Instrumental Account:** The episode **undercuts the "negligible probability" premise *in this specific context***. It illustrates that while the *absolute* probability is tiny, the *expected value* (Probability * Stakes) can be enormous when the stakes are existential (Le Pen in power vs. not). The account isn't refuted *in principle* (probability is still small), but this case highlights its vulnerability: dismissing voting based on "negligible probability" ignores situations where stakes are so colossal that even minute probabilities demand action. The core utilitarian calculus remains, but the magnitude of the stakes dominates.

  **IV. The Problem of Timing (Point 3)**
  *   **Ex Ante (April 20/21):** A vote for a minor left candidate appeared (based on polls/history) as a low-risk expressive act. Instrumentalists might see it as irrational given Le Pen's *rising* but still perceived low probability of beating Jospin. Expressivists see it as valid. Lesser-Evil advocates see it as negligent given the *potential* catastrophic stakes, even if the probability seemed low.
  *   **Ex Post (May 6):** The vote appears catastrophically irresponsible. It directly contributed to Le Pen facing Chirac.
  *   **Do Assessments Come Apart?** **Yes, profoundly.** Ex ante, the vote seemed relatively harmless expression; ex post, it was pivotal in enabling disaster. This divergence is stark.
  *   **Requirement for a Doctrine of Luck?** **Yes, this case demands it.** Voting ethics *must* grapple with moral luck:
      *   **Instrumental:** Judges based on *expected* consequences given available information. Was the risk of Le Pen qualifying sufficiently high *on April 21st* (given known polls) to make voting minor left irrational? (Le Pen's rise suggests yes, but uncertainty remained).
      *   **Expressive:** Rejects luck. The act's moral worth (expression) is intrinsic and unchanged by outcome.
      *   **Lesser-Evil:** Judges based on the duty to mitigate *foreseeable* risk of greater evil. Le Pen's rise made the risk foreseeable; the vote was wrong ex ante *because* it took an unnecessary risk with potentially catastrophic consequences, regardless of whether the risk materialized. The *degree* of wrongness might be amplified by the outcome (moral luck), but the core wrong was the risk-taking.
  *   **Epistemic Honesty:** Le Pen's rise *was* visible in final polls. A voter paying attention *did* have reason for significant concern about fragmentation enabling him. This strengthens the ex ante case against minor-left voting under Instrumental and Lesser-Evil accounts. Ignorance was possible but not universal.

  **V. The Second Round as a Stress Test (Point 4)**
  *   **Lesser-Evil as Blocking?** **Yes, this case strongly suggests "blocking" is distinct.** The Chirac vote wasn't primarily *choosing* Chirac (endorsement) nor *merely* instrumentally preferring him (as his policies might be disliked). It was overwhelmingly **negative** – blocking Le Pen. The "Republican Front" framing explicitly signals this. The taxonomy misses this negative, defensive motivation aimed at *preventing* an outcome, distinct from positively selecting a lesser evil *for* governing. Blocking prioritizes harm prevention over preference expression or governance choice.
  *   **Blank Ballots and Expression:**
      *   **Refutes?** Not entirely. It *is* expression: rejection.
      *   **Confirms?** Partially. It shows voters finding ways to express complex positions.
      *   **Exposes a Category?** **Yes, decisively.** It reveals expression **aimed internally (at one's own side/conscience/history) and externally (at the system)** rather than *at* the winner. Voters shouted, "We comply with duty to stop fascism, but under protest!" This "performative refusal within compliance" is a crucial expressive category the standard account neglects. It blends instrumental action (turning out) with expressive refusal (blank vote).

  **VI. Scope (Point 5)**
  This case **forcefully escapes the narrow focus on the individual ballot**:
  1.  **Candidate Ethics:** Jospin's refusal to pressure allies, Chevènement's/Trotskyists' refusal to withdraw, Chirac's refusal to debate – these are *candidate* decisions with massive ethical implications for the outcome, poorly addressed by theories focused only on voters.
  2.  **Institutional Ethics:** The **two-round plurality system itself is implicated.** It incentivizes first-round sincerity/expression, fragmenting the vote, potentially producing runoff choices alien to majority preference (here, a far-right candidate). Is an institution ethical if it reliably transforms individual sincerity into collective disaster? The ethics of *designing* and *operating* electoral systems is paramount and neglected.
  3.  **Collective Dynamics:** The tragedy hinges on the *aggregation* of individually plausible (expressive) choices. Ethics focused solely on the individual act cannot capture this systemic failure. It demands analysis of collective action problems and coordination failures.
  4.  **The "Unit of Analysis" Problem:** The episode screams that the individual ballot is **inadequate.** We need ethics for:
      *   **Candidates:** When to run/withdraw?
      *   **Parties:** When to form alliances/issue directives?
      *   **Institutions:** How to design rules to mitigate fragmentation risks?
      *   **Media/Civil Society:** Roles in framing choices and coordinating strategy?
      *   **The Electorate Collectively:** How to manage coordination under threat?

  **Conclusion:** The 2002 French election brutally exposes the limitations of individual-centric voting ethics. While testing your three accounts reveals their tensions and silences (especially regarding luck, blocking, and expression under duress), the core lesson is that the **ethics of voting must expand into the ethics of candidacy, party strategy, institutional design, and collective political action.** The individual ballot is a crucial but insufficient unit for understanding the ethical dynamics that produced the "Republican Front" and its haunting aftermath. The decisiveness discount, while capturing a plausible voter psychology, ultimately highlights the systemic peril of institutions that incentivize expressive voting in contexts where instrumental blocking is paramount.
