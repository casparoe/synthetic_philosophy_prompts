prompt: |-
  I've now refereed the same term paper three times and still can't say what's wrong with it, so I'm outsourcing. You're the expert here — I'm assuming you're fluent both in the history-of-science literature on priority disputes and in the metaphysics of causation and desert, and I want you to behave like a journal referee rather than a tutor: think it through slowly, first brainstorm every candidate point of failure you can see (list them, don't skip the ones you think are dumb), then commit to the one you take to be decisive and explain it the way you would in a seminar.

  The paper is by a very bright MA student in my seminar on the philosophy of discovery, and the target is the whole apparatus of scientific credit — priority, eponymy, prizes. Their argument, tidied up but I don't think distorted:

  (1) If a result would have been produced by someone else at roughly the same time had its actual producer never lived, then the actual producer made no contribution that deserves credit. The result was coming anyway; they just happened to be standing there.
  (2) For essentially every major result in the history of science, that counterfactual is satisfied. The record is full of multiples. Calculus turns up twice, with a priority war afterward; oxygen is isolated by more than one chemist in the same decade before anyone has the concept straight; natural selection is mailed to Darwin by a young man in the Malay Archipelago and read alongside his own notes at a learned society. And where there is no actual second discoverer, there is always a documented rival working the same problem with the same tools, which is all the counterfactual in (1) needs.
  (3) So essentially nobody in the history of science made a credit-worthy contribution.
  (4) Credit is deserved only in virtue of a credit-worthy contribution.
  (5) So no allocation of scientific credit is ever deserved — prize committees arent tracking anything, they're just pulling a name out of a set of interchangeable candidates.
  (6) But (5) is absurd, and the student half-sees this: they happily bite the bullet about prizes while insisting it is still literally true that Darwin discovered natural selection and that the rival who would have got there anyway did not.
  (7) So something in (1)–(4) has to go.

  The student's stated motivation for (1) is the collective-harm literature — Parfit's harmless torturers, the marginal polluter whose share of the damage is below any threshold — read as showing that "makes no difference" can't be the test for whether an act was wrong; they say the same must hold on the credit side, symmetrically. I'm quite attached to (2), which seems to me just solid history, and obviously attached to (6). I'd give up (1) if I had to, but I suspect that's a cheap fix the student will see through in a minute, and I'd rather not pay it without knowing the price. So: which step do you reject, why did that step look innocent when you first read it, and what does rejecting it cost? And if your diagnosis lands on (2) rather than (1), tell me how much of the actual history of science I have to surrender to escape the argument, because that's the version of the reply I'd find most intersting but least expect to work.
reasoning: |-
  Okay, let me approach this referee request methodically. The professor presents a student's argument that challenges the entire foundation of scientific credit allocation, and wants me to identify where it fails. 

  First, I need to map the argument's structure clearly:
  - Premise (1) establishes a counterfactual criterion for desert: no credit if others would've made the discovery anyway
  - Premise (2) claims this counterfactual holds for nearly all major discoveries
  - Conclusion (3) follows that no scientist deserves credit
  - Premise (4) links credit to desert
  - Conclusion (5) declares all credit allocations arbitrary
  - Premise (6) notes the conclusion's absurdity
  - Premise (7) identifies a flaw in 1-4

  The student's analogy to Parfit's collective harm cases is intriguing but potentially misleading. In ethics, "no difference" arguments challenge individual responsibility in collective actions, but scientific discovery isn't perfectly parallel. 

  When brainstorming failure points:
  - Premise (1)'s counterfactual might be too strong - it could be mistaking necessary conditions for sufficient ones
  - Premise (2) possibly overgeneralizes from multiples - not all cases have equally advanced rivals
  - The definition of "contribution" in (1) seems underspecified - does it include formulation, communication, or persuasion?
  - Premise (4) assumes desert must be absolute when it might be comparative
  - The analogy to Parfit might not hold because credit isn't zero-sum like harm

  I think the core issue is premise (1)'s flawed understanding of contribution. The student treats discovery as binary (either you cause it or you don't), but in reality:
  - Scientists create the conditions for discovery through theory-building and tool-development
  - The "would have happened anyway" claim often ignores path-dependence - the actual discoverer's approach shaped subsequent science
  - Creditworthiness should include how the discovery was made, not just that it was made

  For example, Darwin deserves credit not merely for conceiving natural selection, but for developing extensive evidence and arguments that convinced the scientific community - something Wallace's sketch didn't achieve. The "difference-making" here is about the quality and impact of the contribution, not just temporal priority.

  This rejection of (1) preserves most historical evidence in (2) while avoiding the absurd conclusion. The cost is abandoning the student's neat symmetry with Parfit - scientific credit operates differently from moral responsibility. We might need a more nuanced account of desert that incorporates both causal and social dimensions.

  The professor's attachment to (2) seems justified - multiples are indeed common. But we can acknowledge that while still granting desert by recognizing that being first among possible discoverers requires skill and effort, even if others were close behind.
answer: |-
  Your student's argument is admirably crisp and philosophically dangerous—precisely the sort that lodges in the mind until properly dissected. As referee, I'll first brainstorm all failure modes (including the "dumb" ones), then commit to the decisive flaw. The core tension: Premise (1) weaponizes Parfit-style marginal contribution arguments against scientific desert, Premise (2) weaponizes Merton's "multiples" thesis, and together they implode credit. Yet (6) rightly notes this obliterates scientific practice. Let's autopsy:

  ### Brainstorm: Candidate Points of Failure
  1. **Premise (1) False**: The counterfactual "would have been discovered anyway" does *not* negate desert. Credit may track actual causal labor, not net difference-making.  
  2. **Premise (2) Overstated**: Not all discoveries have robust rivals—some genuinely required unique insight (e.g., Einstein's relativity, McClintock's transposons).  
  3. **"Credit-Worthy Contribution" (4) Misdefined**: Desert may attach to *how* the discovery was made (rigor, persuasion, integration) rather than *that* it was made.  
  4. **Parfit Analogy Inapt**: Harmless torturers *collectively* cause harm; scientific discoverers *individually* produce the result. Symmetry fails.  
  5. **Temporal Priority ≠ Sole Basis**: Credit systems reward *being first to validly establish and communicate*, not metaphysically causing the result.  
  6. **"Interchangeable Candidates" (5) False**: Rivals are rarely epistemic clones (e.g., Wallace lacked Darwin's evidentiary breadth; Leibniz/Newton calculus frameworks differed).  
  7. **Threshold Problem**: Premise (1) assumes a binary (credit/no credit) when desert may be scalar (credit proportional to relative speed/depth).  
  8. **"Desert" Ambiguity**: Moral desert (what one *ought* to get) vs. institutional credit (what the community *allocates*) are conflated.  

  ---

  ### Decisive Flaw: Premise (1) is False — and the Parfit Analogy is Backwards  
  **Commitment**: I reject Premise (1). The core error is mistaking *causal necessity* for *desert-grounding contribution*. Premise (1) states:  
  > *If a result would have been produced by someone else at roughly the same time had its actual producer never lived, then the actual producer made no contribution that deserves credit.*  

  This fails because **scientific credit deserts track actual causal agency in bringing about the discovery *as it occurred historically*, not net counterfactual difference-making in the result's bare existence**.  

  #### Why Premise (1) Looks Innocent  
  It seduces by mimicking Parfit's "harmless torturer" (HT):  
  - *HT*: Each torturer's electrode contributes imperceptible pain, so no *single act* makes a difference to the victim's suffering.  
  - *Premise (1)*: Each discoverer in a multiple contributes only "being first" in a chain that would have occurred without them, so no *single scientist* makes a difference to the discovery's existence.  

  The symmetry seems elegant. But this confuses two distinct concepts:  
  1. **Moral wrongness** (in Parfit): Grounded in *actual collective harm*—even if no individual is necessary, all participate in causing harm.  
  2. **Scientific desert**: Grounded in *actual individual achievement*—even if the result was overdetermined, the achiever did the work.  

  Parfit shows that *wrongness* can exist without *difference-making*. Premise (1) falsely assumes *desert* requires *difference-making*.  

  #### The Cost of Rejecting Premise (1)  
  We must surrender the student's elegant Parfitian symmetry. Scientific credit isn't analogous to moral blameworthiness. Instead:  
  - **Credit rewards actual causal labor**: Darwin deserves credit because *he* compiled evidence, wrote *Origin*, and persuaded the community—not because he metaphysically "caused" natural selection to exist. Wallace's parallel work shows the idea was "in the air," but Darwin's *specific contribution* (depth, synthesis, impact) was irreplicable.  
  - **Overdetermination ≠ desert-erasure**: That oxygen would have been isolated by 1800 without Lavoisier doesn't negate that *Lavoisier* performed the experiments, interpreted them, and coined the term. His contribution was *actual*, not counterfactually redundant.  

  **Why Premise (2) isn't the flaw** (though it's overbroad):  
  Merton's multiples thesis holds for ~80% of major discoveries, but Premise (1) would *still* fail even if (2) were true universally. If we found a discovery with no rivals (say, quantum entanglement), Premise (1) would grant credit—but this is arbitrary. Credit shouldn't hinge on historical contingency (whether a rival existed). Rejecting (1) saves the intuition that *all* discoverers deserve credit for their work, regardless of rivals.  

  ---

  ### Seminar Explanation (Referee Mode)  
  "Consider Darwin. Premise (1) claims that because Wallace would have formulated natural selection in 1858 had Darwin died in 1830, Darwin made no credit-worthy contribution. This is like saying 'If you single-handedly push a boulder off a cliff, but another person was waiting to push it had you not, you didn't really move the boulder.' Absurd! You *did* move it. Scientific credit rewards the *actual exertion*—the research, synthesis, and communication—not the metaphysical necessity of the outcome.  

  The Parfit analogy fails because torturers *share* blame for a *harm*, but discoverers *individually* earn credit for an *achievement*. Blame distributes over collective causation; credit attaches to individual agency. Rejecting (1) costs us a tidy ethical parallel, but saves the practice of science from incoherence. We can acknowledge multiples (Premise (2)) *without* denying desert: credit is triaged *among* rivals based on rigor, speed, and influence—not annihilated.  

  Thus, the decisive fix: Replace Premise (1) with:  
  > *A scientist deserves credit for a discovery if they actually produced valid, communicable results through their own epistemic labor, even if the discovery was historically overdetermined.*  

  This rescues Darwin, Lavoisier, and prizes—without denying that rivals were nipping at their heels."  

  ---  
  **Final note for you as instructor**: Push the student on *why* we credit Newton over Leibniz despite the calculus war. The answer isn't "Newton caused calculus to exist" (he didn't) but "Newton built a coherent system that solved pressing problems." Credit tracks *effective agency in context*, not counterfactual necessity. If they retort that this is "mere" social recognition, not true desert, that’s when you pivot to moral philosophy—but that’s another paper.
