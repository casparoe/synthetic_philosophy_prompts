prompt: |-
  I retired four years ago after thirty-eight years as a population ecologist, and I have taken up political philosophy with the same bad habit I had in the field: I record observations before I attempt a model. Here are my recorded verdicts on whom a wealthy state may exclude, and I should like to know what principle, if any, they add up to.

  A healthy thirty-year-old who will work, pay in, and draw nothing: may not be excluded. A person who will predictably require care far costlier than anything they could ever pay in: may still not be excluded, though I confess the arithmetic troubles me. A person carrying a drug-resistant pathogen: may be held out until they are no longer infectious, and not one day longer. One applicant whose admission costs the contributory scheme a million: may not be excluded. Ten thousand such applicants whose combined admission would exhaust the scheme: may be turned away, or at least the intake may be capped. I cannot make these last two consistent with one another, and I suspect one of them is wrong.

  Requiring a language and civics test before granting permanent residence: acceptable. Requiring the same before admission at the border: not acceptable. Granting a newcomer emergency treatment while withholding unemployment insurance they have paid into for five years: not acceptable. Withholding insurance they have not yet paid into: acceptable. Excluding a person because their arrival is projected to inflame a backlash that would make the scheme less generous for those already inside: not acceptable — and yet this is the argument I find hardest to answer, because in my own discipline systems with precisely this feedback structure are common, and they are almost always mismanaged by admitting arrivals one at a time.

  My tentative principle is that a state may exclude only where the measure is temporary, publicly accounted for, and its cost falls on the state rather than on the excluded person. Please test it against the cases above; state it precisely enough that I could tell when it has been violated; say which of my verdicts it cannot save, and which I should therefore abandon; and say what it implies for two cases I have not considered — the child born inside the territory to parents who were never admitted, and the applicant excluded not for cost but because their stated political programme is to dismantle the scheme itself.
reasoning: |-
  Okay, let me start by really understanding what this retired population ecologist is asking. They've shifted to political philosophy but kept their method of recording observations before building models. They've listed specific scenarios about whom a wealthy state may exclude and want to know if there's an underlying principle. Their tentative principle is that exclusion must be temporary, publicly accounted for, and the cost should fall on the state, not the excluded person. They want this principle tested against their cases, made precise, and applied to new situations.

  First, I need to parse each of their verdicts. They mention a healthy worker who can't be excluded, someone who'll cost more than they contribute but still can't be excluded, someone with a pathogen who can be temporarily excluded, one costly applicant who must be admitted but ten thousand who can be capped. Then there are language/civics tests, emergency treatment vs. unemployment insurance, and excluding someone to prevent backlash. The last one seems tricky for them because of feedback systems in ecology.

  The user's tentative principle has three parts: temporariness, public accounting, and cost on the state. I need to see if this fits all their cases. For the healthy worker, exclusion isn't temporary, so it fits. The high-cost individual—exclusion would be permanent and costly to them, so exclusion isn't allowed. The pathogen case is temporary, so it fits. The one costly applicant can't be excluded, but ten thousand can. Here's a conflict. If admitting one doesn't exhaust the scheme, it's okay, but ten thousand would. Their principle doesn't address system sustainability, so it fails here. Maybe they need to adjust the principle to allow exclusion when it threatens systemic collapse.

  Language tests before permanent residence are okay, but not at the border. Their principle might not cover this distinction because both involve exclusion. Public accounting and temporariness don't clearly apply. Maybe the key is the nature of exclusion—pre-entry vs. post-entry conditions. But their principle doesn't specify that. Emergency treatment vs. insurance withholding: if they paid in, withholding is unacceptable. If not paid, it's acceptable. This aligns with contributory fairness, but their principle's cost aspect might touch on this. The backlash case is rejected, but they're conflicted due to ecological feedback. Their principle deems it unacceptable because exclusion is permanent and costly to the excluded. However, systemic risk isn't addressed, which is a gap.

  For the new cases: a child born to undocumented parents. Territorial birthright citizenship is standard, so exclusion isn't justified. The principle would protect the child since exclusion imposes cost on them. Someone wanting to dismantle the scheme. Exclusion might be acceptable, but the principle doesn't cover non-cost reasons. So maybe the principle needs expansion to include threats to the scheme's existence, not just financial costs.

  So the key issues are: the individual vs. systemic threat distinction in the ten thousand applicants case, the timing of conditions (border vs. post-entry), and non-financial threats like political dismantling. The principle needs refinement to handle systemic sustainability and intentional harm to the system. Also, defining "temporary" and "public accounting" more precisely. For example, pathogen exclusion is temporary, while language tests at entry might be indefinite. Public accounting could mean transparent criteria. Cost on the state—like the state bearing the expense of quarantine, not the excluded person.

  In the backlash case, even though exclusion prevents systemic harm, it targets individuals for others' potential reactions, which is discriminatory. The principle rightly rejects it, but the user's ecological background makes this uneasy. However, political philosophy might prioritize individual rights over systemic management in this context. So sticking with the backlash rejection might be correct, despite ecological parallels.

  Summarizing adjustments: the principle should allow exclusion when necessary to prevent systemic collapse (like the ten thousand applicants) or when an individual poses a deliberate threat (like dismantling the scheme). But need to define thresholds carefully to avoid arbitrariness. Also, distinguish between contributory systems (where payment matters) and non-contributory rights. The revised principle could be: Exclusion is permissible only if (1) temporary and publicly justified, with costs borne by the state; or (2) necessary to prevent the collapse of essential public systems; or (3) the person poses a deliberate threat to the foundational structures of the state. However, (2) and (3) need strict limits to prevent abuse.
answer: |-
  Your approach of grounding principle in observed judgments is rigorous and your tentative principle shows promise, but it requires refinement to address inconsistencies and edge cases. Below, I test your principle against your verdicts, state it precisely, identify which verdicts must be abandoned or modified, and apply it to your new cases.

  ---

  ### **Your Principle Refined and Stated Precisely**  
  **"A state may exclude a person only if:**  
  1. **The exclusion is temporary**, defined as:  
     - (a) Predetermined by objective criteria (e.g., medical clearance),  
     - (b) Subject to regular review, and  
     - (c) Not extending beyond the minimum time necessary to mitigate the specific risk.  
  2. **The justification is publicly accounted for**, meaning:  
     - (a) Grounded in transparent, evidence-based rules (not ad hoc judgments),  
     - (b) Subject to independent oversight, and  
     - (c) Proportionate to the risk (e.g., exclusion duration matches risk severity).  
  3. **The cost of exclusion falls primarily on the state**, not the excluded person**:  
     - (a) The state bears direct costs (e.g., quarantine facilities),  
     - (b) Indirect burdens (e.g., delays, stigma) are minimized, and  
     - (c) No life-threatening harm is inflicted."  

  **Violation occurs when:**  
  - Exclusion is indefinite, arbitrary, or lacks review mechanisms;  
  - Justification relies on opaque or discriminatory criteria;  
  - Costs (survival, dignity, opportunity) are displaced onto the excluded.  

  ---

  ### **Testing Against Your Verdicts**  

  | Your Verdict                                  | Aligns with Principle? | Inconsistency/Notes                                                                 |  
  |-----------------------------------------------|------------------------|-------------------------------------------------------------------------------------|  
  | **Healthy worker**: Not excludable            | ✅ Yes                 | Permanent exclusion violates temporariness; costs opportunity.                      |  
  | **High-cost care recipient**: Not excludable  | ✅ Yes                 | Exclusion shifts life-threatening costs to them; violates cost condition.           |  
  | **Pathogen carrier**: Temporary exclusion     | ✅ Yes                 | Time-limited, evidence-based, state bears quarantine costs.                         |  
  | **One costly applicant**: Not excludable      | ⚠️ **No**              | *Contradicts 10k verdict*. Principle doesn’t resolve systemic collapse risk.        |  
  | **10k costly applicants**: Excludable/capped  | ⚠️ **No**              | *Contradicts one applicant verdict*. Principle ignores aggregate effects.           |  
  | **Language/civics test pre-residence**: Ok    | ✅ Conditional         | If temporary (e.g., retest allowed) and state funds training. Permanent ban violates. |  
  | **Language/civics test pre-border**: Not ok   | ✅ Yes                 | Indefinite exclusion; costs opportunity/dignity on excluded.                        |  
  | **Withhold insurance after 5y payment**: Not ok | ✅ Yes                 | Violates cost condition; state displaces earned benefits onto worker.               |  
  | **Withhold insurance pre-payment**: Ok        | ✅ Yes                 | No contributory claim; exclusion until payment aligns with temporariness.           |  
  | **Exclude to prevent backlash**: Not ok       | ✅ Yes                 | Indefinite, discriminatory, costs displaced; violates all three criteria.           |  

  ### **Key Inconsistencies and Verdicts to Abandon**  
  1. **The "One vs. Ten Thousand" Contradiction**:  
     - **Problem**: Your principle cannot resolve this because it focuses on *individual* exclusion criteria, not system-scale sustainability. Admitting one costly person is permissible (costs are manageable), but 10k could collapse the system. Yet your principle forbids excluding both.  
     - **Solution**: **Abandon the "one costly applicant" verdict** or modify the principle. Sustainability must be a valid limit. Add a **systemic viability clause**:  
       > *"Exclusion may be permissible if inclusion would directly and foreseeably collapse an essential public system (e.g., healthcare, pensions), provided less restrictive alternatives (e.g., caps, phased entry) are exhausted."*  
     - **Revised Verdict**: Ten thousand may be capped; one may not.  

  2. **Backlash Exclusion**:  
     - Your rejection aligns with the principle (indefinite, discriminatory). However, your ecological concern about feedback loops is valid. The principle resolves this by:  
       - **Public accounting**: Requiring evidence that backlash is *inevitable* (not speculative) and alternatives (e.g., anti-xenophobia programs) are tried.  
       - **Temporariness**: If backlash risk is acute (e.g., wartime), *temporary* pauses may be justified—but never permanent exclusion.  

  ---

  ### **Implications for New Cases**  
  1. **Child born to undocumented parents**:  
     - **Principle**: Child **cannot be excluded**. Exclusion is indefinite (violates temporariness), imposes life-altering costs (statelessness, poverty) on the child, and lacks public justification (child committed no offense).  
     - **Real-world alignment**: *Jus soli* (birthright citizenship) norms reflect this; exclusion would violate CRC/UDHR.  

  2. **Applicant seeking to dismantle the scheme**:  
     - **Principle**: **Exclusion may be permissible** under revised criteria.  
       - **Justification**: If the applicant *actively poses a credible, imminent threat* to public order (e.g., inciting violence), temporary exclusion aligns with the principle (e.g., until threat ceases).  
       - **Non-Justification**: Mere political advocacy ("stated programme") is protected speech. Exclusion for ideology violates public accounting (opaque/political criteria) and displaces costs (persecution).  
     - **Key Distinction**: Focus on *actions*, not beliefs. If the threat is structural (e.g., electoral victory ending the scheme), exclusion is still impermissible—democratic processes must prevail.  

  ---

  ### **Conclusion**  
  Your principle is **largely sound** but requires two critical additions:  
  1. **Systemic viability** as a justification for exclusion/caps when essential systems face collapse.  
  2. **Threat-based exclusions** limited to temporary, evidence-based security risks.  

  **Abandon or revise**: The verdict that *one* costly applicant must always be admitted. In extreme cases, systemic stability outweighs individual inclusion—though caps are preferable to outright bans.  

  **Strengths of your approach**: It robustly prohibits discrimination, indefinite exclusion, and victim-blaming (e.g., shifting costs to the excluded). Your ecological lens reveals where feedback loops (e.g., backlash) challenge liberal norms, but the principle rightly prioritizes individual rights over collective prejudice.  

  Would you like further refinement of the systemic viability clause or threat-assessment criteria?
