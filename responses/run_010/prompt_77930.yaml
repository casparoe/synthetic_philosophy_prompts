prompt: |-
  I'm a convinced expressivist of the plan-based variety and I think I've got a line on the Frege-Geach problem. Roughly: a moral sentence expresses the same kind of planning state whether it's asserted or embedded, and the logical relations between those states are fixed by whether holding them together would be incoherent as planning — not by truth conditions. So "murder is wrong" is being for blaming for murdering, "murder isn't wrong" is being for not blaming for murdering, and an occurrence embedded under "either...or" expresses being for a plan that settles the question one way or the other. Validity comes out as: you can't coherently accept the premises and deny the conclusion, where "can't" is a planning-level constraint rather than a truth-preservation fact.

  What would count against this? I want a map of what the view actually risks, not a general assault on expressivism. Specifically: which cases or bits of linguistic data would be genuinely damaging — I'm thinking negation, whether moral connectives really behave like Boolean ones, moral modus ponens, and whether someone can grasp "wrong" without having the relevant attitude — and which are merely awkward. Where does my view stick its neck out in a way a truth-conditional rival doesn't, such that the rival could turn out right and I wrong? For what its worth, the thing that would move me most is a case where my account of the connectives predicts different inferential behaviour from the classical one and comes out on the losing end.

  And please be blunt about the collapse worry: once I hand over a systematic rule assigning planning states to complex sentences, haven't I just written a compositional semantics with unusual values and called it non-representational? Is there a principled line there, or has the view been qualified until it can't fail? Sort the defeaters from fatal to cosmetic, and say which ones a committed defender of this view would already concede as counting against them rather than waving off.
reasoning: |-
  Okay, the user is an expressivist who follows a plan-based approach and is tackling the Frege-Geach problem. They've outlined their solution where moral sentences express planning states consistently, whether asserted or embedded. Logical relations are based on planning coherence rather than truth conditions. They want to know what could count against their view, specifically linguistic data that might be damaging, not a general critique. They're concerned about negation, moral connectives behaving differently than Boolean ones, modus ponens, and whether grasping "wrong" requires the attitude. They also worry about the collapse into a truth-conditional semantics despite using planning states.

  First, I need to recall the Frege-Geach problem. It challenges expressivists to explain how moral sentences work in embedded contexts like conditionals or negations, where they don't directly express emotions or attitudes. The user's solution uses planning states to maintain consistency across contexts. 

  The user wants specific counterexamples or data that could undermine their approach. They mentioned several key areas: negation, connectives, modus ponens, and the grasp of moral terms without attitude. Also, the collapse worry—whether their systematic rules are just semantics in disguise.

  Breaking this down:

  1. **Negation**: The user defines "murder isn't wrong" as being for not blaming for murder. But linguistic data might show that negation doesn't always work that way. For example, in embedded contexts like "If murder isn't wrong, then..." the planning state interpretation might not align with actual usage. If people can deny moral claims without endorsing the opposite action, that's a problem. Also, negation of complex moral sentences (e.g., "Not both A and B") might not fit the planning coherence model. 

  2. **Connectives**: The user suggests that moral connectives behave like Boolean ones. But if natural language moral conditionals or disjunctions behave differently, that's an issue. For instance, if moral modus ponens fails in some cases because the planning states don't cohere as predicted, that's a problem. Also, embedded disjunctions ("Either P or Q") might express a different planning state than intended. 

  3. **Modus Ponens**: The user's validity is based on planning coherence. If there's a case where intuitively valid moral modus ponens doesn't align with incoherence in planning states, that's damaging. For example, if accepting premises doesn't lead to the conclusion due to conflicting attitudes, but the inference is still valid, that's a counterexample. 

  4. **Grasping "Wrong" without Attitude**: If someone can understand "murder is wrong" without having the relevant planning state (e.g., due to linguistic competence), that challenges the expressivist view. If truth-conditional semantics can explain this better, it's a point against expressivism.

  5. **Collapse Worry**: If the systematic assignment of planning states mirrors compositional semantics, the view might just be truth-conditional in disguise. The user needs a principled distinction. For example, if planning states function like truth values under logical operations, the view collapses. The defender might argue that planning states are dynamic or involve commitments, but if the logic is isomorphic, collapse is a real threat.

  Prioritizing these issues:

  - **Fatal**: Genuine mismatches between predicted and actual inferential behavior, especially in modus ponens or negation. If the planning coherence model fails for standard inferences, it's a deal-breaker. Collapse is also fatal if unavoidable.

  - **Damaging but Maybe Addressable**: Cases where moral connectives diverge from Boolean logic. The user might adjust their model, but if divergence is significant, it weakens the view. Grasping moral terms without attitudes is a challenge but perhaps answered by distinguishing competence and performance.

  - **Awkward/Cosmetic**: Issues like complex embeddings or negation in compound sentences might be handled with technical fixes, though they add complexity.

  The user wants blunt feedback. So, for collapse: if the logic of planning states mirrors truth-conditional logic, especially in valid inferences, then the view hasn't avoided truth conditions. The defender might argue that the nature of the states (planning vs. truth) differs, but if the structure is the same, the distinction becomes thin. That's a principled line but risks collapse under scrutiny.

  Specific linguistic data: 
  - Negation: If "It's not wrong to murder" doesn't entail being for not blaming (e.g., in contexts of moral uncertainty), that's problematic. 
  - Modus Ponens: If someone accepts "If lying is wrong, stealing is wrong" and "Lying is wrong" but not "Stealing is wrong" without planning incoherence, that's a counterexample. 
  - Disjunctions: If embedded "or" in moral contexts allows for unresolved planning states, but the user's model requires settling the question, that's a mismatch.

  The user's strongest concern is inferential behavior differing from classical logic and losing. So, pinpointing a case where classical logic holds, but planning coherence doesn't, or vice versa, is key. For example, in moral dilemmas where planning states conflict but classical logic still validates an inference.
answer: |-
  This is a sharp, self-aware articulation of plan-based expressivism targeting the Frege-Geach problem head-on. I'll be blunt, as requested, sorting potential defeaters by severity—from fatal to cosmetic—and flagging where your view sticks its neck out. Your core risk is that **systematicity in assigning planning states to complex sentences could collapse into a truth-conditional semantics in disguise**, but linguistic data might expose mismatches *before* collapse becomes unavoidable. I'll focus on your specific concerns (negation, connectives, modus ponens, grasp without attitude), prioritizing cases where your account could predict *divergent inferential behavior* from classical logic and lose.

  ### Fatal Defeaters (Could Sink the View)
  1. **Negation Mismatch in Embedded Contexts**  
     - **The Risk**: You define "murder isn't wrong" as *being for not blaming for murdering*. But linguistic data suggests moral negation often behaves as *propositional rejection*, not a positive planning state.  
     - **Damaging Data**:  
       - *Negating complex moral claims*: Consider "It's not wrong to eat meat *if* animals don't suffer." Your account must assign a planning state to the embedded negation ("not wrong") that coheres with the conditional. If ordinary speakers judge this sentence as compatible with *not* being for blaming meat-eaters *or* being for blaming them (e.g., due to uncertainty), but your model demands settling the question (being for a plan that resolves it), you mispredict.  
       - *Negation without endorsement*: Someone might say, "Murder isn't wrong, but I'm not for *not* blaming it—I'm just agnostic." If this is coherent (and linguistically valid), your binary "being for/against blaming" fails. Truth-conditional rivals handle this via truth-value gaps or probabilistic attitudes; your planning constraints might force incoherence where none exists.  
     - **Why Fatal?** If negation doesn't align with a settled planning commitment in embeddings, your logic of "incoherence" breaks. This directly undermines your account of validity.

  2. **Moral Modus Ponens Failure**  
     - **The Risk**: You define validity as planning incoherence in accepting premises/rejecting the conclusion. But if people intuitively accept a moral MP inference while your model *doesn't* predict incoherence (or vice versa), your logic diverges from practice.  
     - **Damaging Data**:  
       - *Conflicting attitudes without logical contradiction*: Imagine:  
         (P1) If lying is wrong, then telling your friend a white lie is wrong.  
         (P2) Lying is wrong.  
         (C) Therefore, telling your friend a white lie is wrong.  
       Speakers might accept P1 and P2 but reject C because their attitude toward "white lies" isn't governed by general rules (e.g., "Lying is wrong" expresses a *pro tanto* stance, but P1 expresses a rigid plan). If this is coherent, your model falsely predicts incoherence. Conversely, if speakers *reject* C but feel no planning tension (e.g., due to contextual exceptions), your validity criterion is too weak.  
     - **Why Fatal?** Modus ponens is your showcase inference. If planning coherence doesn't track intuitive validity here, your entire logic is suspect. Truth-conditional semantics avoids this by decoupling attitudes from truth preservation.

  3. **Collapse into Truth-Conditionalism**  
     - **The Risk**: Your compositional rules assign planning states to all sentence structures identically to truth-conditional semantics, but with "planning states" as values. If these states behave like truth values under logical operations (e.g., conjunction = intersection of states), you've merely relabeled semantics.  
     - **Damaging Data**:  
       - *Isomorphism in practice*: If your planning states for "P or Q" (being for settling P or Q) and "not P" (being for not blaming P) obey *exactly* the same inference rules as Boolean operators (e.g., disjunction introduction/elimination), the "planning" layer does no work. The principled line—that planning states are *dynamic commitments* rather than static truth—fades if they function identically in logic.  
       - *Loss of explanatory power*: If a truth-conditionalist can replicate your predictions *without* attitudes (e.g., using minimalist truth), your view adds nothing but metaphor.  
     - **Why Fatal?** If collapse occurs, you lose expressivism's core claim: that moral language is *non-representational*. Committed defenders (e.g., Gibbard) concede this risk but argue planning states are *constitutively* action-guiding. If that guidance doesn't alter logic, the defense fails.

  ### Damaging Defeaters (Could Force Major Revisions)
  4. **Moral Connectives ≠ Boolean Connectives**  
     - **The Risk**: You assume moral "or" expresses being for settling a question. But moral disjunctions might not require "settling" attitudes.  
     - **Damaging Data**:  
       - *Unsettled disjunctions*: "Either stealing is wrong or charity is optional" might be accepted by someone who is agnostic about both and has no plan to resolve them. Your account demands incoherence if they deny both, but speakers might see no issue (treating it as a non-exclusive "or").  
       - *Conditionals with non-planning antecedents*: "If karma exists, murder is wrong" intuitively doesn't express a planning state about karma. Your model must assign a planning state to the whole conditional without making karma an object of planning.  
     - **Why Damaging?** If moral connectives behave non-classically, your logic must deviate from standard inference rules. But if it deviates *where ordinary usage follows classical logic*, you lose.

  5. **Grasping "Wrong" Without the Attitude**  
     - **The Risk**: You tie understanding "wrong" to possessing the planning state (being for blaming). But linguistic evidence suggests competence can precede or exist without attitude adoption.  
     - **Damaging Data**:  
       - *Amoralists and aliens*: A psychopath might fluently use "murder is wrong" in inferences (e.g., modus ponens) while lacking *any* planning state for blaming murder. If they grasp the meaning and infer correctly, your account must either deny their competence (implausible) or concede that planning states aren't essential to meaning.  
       - *Attitude change without meaning change*: Someone might cease being for blaming murder but still assert "murder is wrong" (e.g., due to weakness of will). If this is linguistically coherent, your view struggles.  
     - **Why Damaging?** This challenges expressivism's core thesis that moral terms *express* attitudes. Defenders (e.g., Blackburn) bite the bullet here, calling such speakers "incompetent" or reinterpreting their states. But it’s a cost.

  ### Awkward But Survivable Defeaters (Cosmetic or Fixable)
  6. **Complex Embeddings and Quantifiers**  
     - **The Risk**: "It's wrong that everyone lies" involves quantification. Assigning a planning state ("being for blaming all liars?") can get messy.  
     - **Why Cosmetic?** While cumbersome, this is a technical challenge. You can adopt tools from dynamic semantics (e.g., Gibbard's "natural plans") without collapsing into truth-conditions. Defenders concede this as a work-in-progress.

  7. **Moral Dilemmas and Incoherence**  
     - **The Risk**: Dilemmas (e.g., "Both A and B are wrong, but you must do one") might seem incoherent in your model, yet speakers accept them.  
     - **Why Cosmetic?** You can define "incoherence" weakly (e.g., as *practical* conflict, not logical contradiction). This is a quibble about your "can't" clause, not a deep flaw.

  ### Where Your View Sticks Its Neck Out
  Your account is **vulnerable where planning coherence diverges from classical validity in ordinary moral reasoning**. Specifically:
  - If **classical logic holds** in a moral inference (e.g., disjunctive syllogism: "P or Q; not P; therefore Q") but your planning model *doesn't* predict incoherence in denying the conclusion, you lose.  
  - Conversely, if your model predicts incoherence where speakers feel none (e.g., in negated conjunctions), it's overgenerating.  

  Truth-conditional rivals avoid this by separating logic from psychology. *Your neck is out*: you claim planning states *ground* logic. If linguistic data shows moral inferences tracking truth preservation *independently* of planning (e.g., in amoralist reasoning), your view is falsified.

  ### Bottom Line
  The **collapse worry** is your deepest threat—if your planning logic is isomorphic to truth-conditional logic, you're a semanticist in denial. But before collapse, **negation and modus ponens** are your most exposed flanks. A single, clear case where:  
  - Speakers treat a moral inference as valid/invalid,  
  - Classical logic agrees, but  
  - Your planning-coherence model disagrees  
  —would be strong evidence against you. Commit to predicting specific inferences (e.g., negation in conditionals, MP with *pro tanto* rules) and test against linguistic intuitions. If you survive that, you’ve earned your stripes. If not, the collapse was inevitable.
