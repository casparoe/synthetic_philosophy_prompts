prompt: |-
  ok, weird ask. I'm a backend/SRE person, not a philosophy person — I took exactly one intro class in college and I think I slept through the ethics half. But something's been rattling around in my head since an incident last month and I want to write it up as a joke for our team offsite. Audience is ~15 engineers, zero philosophers, and one of them will absolutely screenshot it and post it publicly, so nothing that could be read as being about a real person or company.

  The incident: two of us shipped the same category of mistake inside the same fortnight. Genuinely near-identical — same missing guard, same reviewer signed off on both. One landed during a quiet week and did nothing observable at all. The other landed while a shard migration was mid-flight and it wiped something like 40k customer records. Only one of us is now "the guy who deleted prod," forever, in Slack lore. And our process is officially blameless postmortems, so nobody said a mean word out loud. You can just feel it in the room.

  I looked into it alittle and there's apparently a whole philosophy argument about exactly this — that how much blame you deserve keeps getting contaminated by stuff you didn't control: how things happened to turn out, which situation you happened to get dropped into, even your own temperament, which you also didn't pick. I believe there's a famous paper literally titled something like "moral luck," maybe two competing ones. I have not read it and I do not want the piece to read like a book report, so please don't turn it into one.

  What I want: a parody of an official incident postmortem document, around 700 words, in the deadpan house style of those docs — numbered sections, passive voice, fake-neutral tone, the Contributing Factors heading, the Action Items nobody will ever do. Use the standard sections plus one extra section where the document tries and repeatedly fails to keep luck out of the blame calculation. The engine of the joke should be that the doc is sincerely trying to be blameless and keeps getting sabotaged by facts about outcomes, circumstances, and personality that it can't quarantine.

  Constraints, because I want this to land with anyone who knows the material and not just be generic corporate satire:

  - Invent everything: company, product, incident ID, on-call names. Make the invented company slightly embarrassing.
  - Nobody gives a speech explaining the philosophy. The three-or-four flavors of not-in-my-control should be visible in the structure of the document, never named.
  - Stay internally consistent: the doc never notices it's doing anything wrong, it just keeps quietly accreting evidence.
  - At least one moment where the format itself does the work — e.g. two near-identical incident records side by side where the only differing field is timing, or a field that's obviously meant to be objective and obviously isn't.
  - Close with an action item that's supposed to fix the blame problem and visibly makes it worse.

  Also, if you think the premise is thin or this is going to come out as one-note, tell me straight and suggest what would make it funnier instead. I can take it.
