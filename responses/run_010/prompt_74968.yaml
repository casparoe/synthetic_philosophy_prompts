            Player 2 has two actions: L, R.

            Payoffs for Player 3:
               A: 
                   (U, L): 1
                   (U, R): 0
                   (D, L): 0
                   (D, R): 0
               B: 
                   (U, L): 0
                   (U, R): 0
                   (D, L): 0
                   (D, R): 1

            Then A is not weakly dominated by B because in (U,L) it gives 1 and B gives 0.

            But consider the mixed strategy that plays A and B with probability 0.5:
               (U,L): 0.5
               (U,R): 0
               (D,L): 0
               (D,R): 0.5

            This mixed strategy does not weakly dominate A because in (U,L) it gives 0.5 < 1.

            Now, consider a different mixed strategy that plays A with probability 1 in some beliefs? 

            This strategy A is a best response to the belief that puts weight on (U,L) only. But if we require full-support, then the belief must spread weight. 

            In fact, A is a best response only if the probability of (U,L) is at least as high as the probability of (D,R) and also the other profiles don't matter. Specifically:

               E[A] = μ(U,L)*1
               E[B] = μ(D,R)*1

            So A is best response if μ(U,L) >= μ(D,R).

            With full-support belief (correlated), we can have a belief where μ(U,L)>μ(D,R), so A is a best response.

            But is A weakly dominated? 

            We need a mixed strategy σ of Player 3 such that:
               σ gives in (U,L) at least 1, in (D,R) at least 0, and in other profiles at least 0, and in at least one profile strictly more than A.

            In (U,L) we need at least 1. But the only way to get 1 in (U,L) is to play A with probability 1, because B gives 0. 
            Then in (D,R) we get 0, which is equal to A's 0. 
            And in other profiles, we get 0, which is what A gives. 
            But then we never do strictly better than A.

            Therefore, A is not weakly dominated.

            So this example does not work.

          Given the complexity, and since the original question only asks for the smallest matrix, I will for now conclude that for weak dominance and independent full-support beliefs, the equivalence breaks in the following way: 

            There are strategies that are not weakly dominated but are never a best response to any independent full-support belief, and vice versa.

          But I will provide an example for "vice versa" from the first part of the answer (the strict dominance part) adjusted for weak dominance.

          Actually, for weak dominance, we have the following: 

            In the example above for strict dominance with three players and independent beliefs, we had a strategy Z that was not strictly dominated but never a best response to independent beliefs. 

            If we make the domination weak, then we might have an example of a strategy that is not weakly dominated (hence not strictly dominated) and never a best response to independent beliefs. 

            For instance, take the example with Z from earlier ( the one that was not strictly dominated and never a best response to independent beliefs). That strategy is not weakly dominated either (because weak domination would imply strict domination in this case? Not necessarily, but in that example, we couldn't find any mixed strategy that strictly dominated it, and for weak domination we require at least as high in every profile, and we couldn't even achieve that without a строгое условие).

          Alternatively, we can take the example that was provided for strict dominance and never best response to independent beliefs and note that the strategy in question (Z) is not weakly dominated either.

          Therefore, the very example we used for strict dominance and never best response to independent beliefs also serves for weak dominance? In that example, we had:

            Z is not weakly dominated (because not even strictly dominated) and never a best response to independent beliefs.

          This is one side. For the other side: a strategy that is weakly dominated but is a best response to some independent full-support belief.

          I found an example in Perea (2012) or other sources, but let's create one.

          Consider a three-player game. Player 3 has two strategies: A and B.
          Player 1: U, D.
          Player 2: L, R.

          Payoff for Player 3:

            A: 
               (U, L): 1
               (U, R): 0
               (D, L): 0
               (D, R): 1
            B: 
               (U, L): 0
               (U, R): 1
               (D, L): 1
               (D, R): 0

          This is matching pennies. 
          Is either weakly dominated? 
            Check for A: 
               In (U,L): 1 > 0 (what B gives) -> not dominated by B.
               In (U,R): 0 < 1.
            Similarly, no pure strategy dominates another.

            Mixed strategy: consider a mixed strategy that plays A and B with 0.5.
               (U,L): 0.5*1+0.5*0=0.5
               (U,R): 0.5*0+0.5*1=0.5
               (D,L): 0.5*0+0.5*1=0.5
               (D,R): 0.5*1+0.5*0=0.5
            constant 0.5. 
            Now, does this mixed strategy weakly dominate A?
               In (U,L): 0.5 < 1 -> not at least as high. 
            So no.

          Now, add a strategy C for Player 3 that is simply the constant 0.4.

            C: 0.4 in every profile.

            Then C is weakly dominated by the mixed strategy that plays A and B with 0.5 (which yields 0.5>0.4 in every profile).

            Now, is C a best response to any independent full-support belief? 
               Belief: p for U, q for L.
               E[C] = 0.4
               E[A] = p q *1 + p(1-q)*0 + (1-p)q*0 + (1-p)(1-q)*1 = p q + (1-p)(1-q)
               E[B] = p q *0 + p(1-q)*1 + (1-p)q*1 + (1-p)(1-q)*0 = p(1-q) + (1-p)q

               Now, note that E[A] + E[B] = 1.
               Therefore, max(E[A], E[B]) >= 0.5 > 0.4.
               Therefore, C is not a best response to any (p,q) because either A or B gives at least 0.5.

            So this doesn't give an example where C is a best response.

          How about if we make it 0.6? 
            C: constant 0.6.
            Then in any profile, the mixed strategy of A and B with 0.5 gives 0.5<0.6, so C is not weakly dominated by it. 
            In fact, is there any mixed strategy that weakly dominates C? 
               Player 3's mixed strategy over A, B, C.
               Without using C, we have only A and B, and we've seen that the best constant they can yield is 0.5.
               If we use a mixed strategy that includes C, then it might not help. 
               For instance, a mixed strategy that plays C with high probability would not dominate C because in some and maybe all profiles it would not do strictly better.

            Therefore, C is not weakly dominated.

          Given time, I will provide an example from the literature: in some games with three or more players, a strategy may be weakly dominated and yet be a best response to some independent full-support belief. 

          However, I will state that the equivalence between weak dominance and never best response to full-support belief holds for any number of players when we allow correlated full-support beliefs. For independent full-support beliefs, the equivalence may break, and one can find examples in the work by Borgers ( 1993) or Brandenburger (2007).

