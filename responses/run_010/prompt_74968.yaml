   Part 2: Weak dominance and admissibility

   Now, we consider weak dominance and the epistemic notion of being never a best response when we require the belief to have full support (admissibility).

   Definitions:

   1. Weak dominance (by a mixed strategy):
      A strategy s_i is weakly dominated if there exists a mixed strategy σ_i such that for every profile s_{-i} of opponents, 
          u_i(σ_i, s_{-i}) >= u_i(s_i, s_{-i})
      and there exists at least one profile s_{-i}^0 such that 
          u_i(σ_i, s_{-i}^0) > u_i(s_i, s_{-i}^0).

   2. Never a best response to a full-support belief:
      A strategy s_i is never a best response to any full-support belief (i.e., a belief that assigns positive probability to every strategy profile of the opponents) if there is no such full-support belief for which s_i is a best response.

   In two-player games, it is known that a strategy is weakly dominated if and only if it is never a best response to any full-support belief. However, in games with more than two players, this equivalence may break if we require independent beliefs? Or even with correlated full-support beliefs? 

