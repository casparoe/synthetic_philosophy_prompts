  We are comparing two notions: strict dominance (decision-theoretic) and never being a best response (epistemic). The goal is to see when they are equivalent and when they come apart.

   Definitions:

   1. Strict dominance (by mixed strategies): 
      A strategy s_i of player i is strictly dominated if there exists a mixed strategy σ_i of player i such that for every profile of opponents' strategies s_{-i}, 
          u_i(σ_i, s_{-i}) > u_i(s_i, s_{-i}).

   2. Never a best response (epistemic):
      A strategy s_i of player i is never a best response if there is no belief (probability distribution) over the opponents' strategy profiles such that s_i is a best response to that belief.

   In two-player games, these two notions are equivalent. However, in games with more than two players, they are not equivalent because of the possibility of correlated beliefs in the epistemic notion.

   We are to consider:
   (i) Three or more players.
   (ii) The requirement that conjectures about different opponents be independent (i.e., the belief is a product measure over the opponents' strategy spaces) rather than correlated.
   (iii) Replacement of strict dominance by weak dominance (admissibility).

   We will construct examples to show the differences.

   Part 1: Three or more players and correlated beliefs

   In the epistemic notion, if we allow correlated beliefs (i.e., the player can have any probability distribution over the joint strategies of the opponents), then the equivalence with strict dominance holds even for n-player games. This is a known result: a strategy is strictly dominated (by a mixed strategy) if and only if it is never a best response to any (possibly correlated) belief.

   However, if we require independence (i.e., the belief must be a product measure), then the equivalence breaks.

