answer: |-
  ### Diagnostic Decision Tree for Commitment Races

  **Node 1:**  
  **Claim:** If an eccentric offers you a reward solely for *forming the intention* to do something harmful (even if you never act on it), it is rational to form that intention to collect the reward, since you can freely abandon it later.  
  - **Yes** → Node 2  
  - **No** → **Leaf A: Kavka's verdict**  
    *Most awkward commitment:* Defending why you cannot rationally intend an act you know you’ll later reject, even for profit.  

  **Node 2:**  
  **Situation:** You publicly declare your intention (from Node 1) in a commitment race. Your opponent observes this.  
  **Claim:** Your opponent will capitulate immediately, believing you will carry out the harmful act.  
  - **Yes** → **Leaf B: unnamed**  
    *Most awkward commitment:* Explaining why an opponent would back down when you retain full power to relent without cost.  
  - **No** → Node 3  

  **Node 3:**  
  **Situation:** You install a device that *irreversibly forces* you to act if not deactivated (e.g., a dead-man’s switch).  
  **Claim:** This device alone makes your commitment credible, even if you desperately wish to deactivate it later.  
  - **Yes** → **Leaf C: Schelling's strategic surrender**  
    *Most awkward commitment:* Accepting mutual ruin because your device executes an action you now regret.  
  - **No** → Node 4  

  **Node 4:**  
  **Claim:** For commitment to work, you must *genuinely transform your desires* to *want* to carry out the act, regardless of consequences.  
  - **Yes** → **Leaf D: unnamed**  
    *Most awkward commitment:* Voluntarily adopting a desire for self-destruction to make threats credible.  
  - **No** → Node 5  

  **Node 5:**  
  **Situation:** Two parties face off with no prior interactions. One commits first.  
  **Claim:** The second party’s refusal to capitulate is *always a blunder*, as it ignores the first party’s resolve.  
  - **Yes** → **Leaf E: unnamed**  
    *Most awkward commitment:* Justifying why a rational opponent would ignore their own survival to test your resolve.  
  - **No** → Node 6  

  **Node 6:**  
  **Claim:** Commitment credibility *depends entirely* on a preexisting social norm (e.g., "one must keep promises") that the race itself cannot create.  
  - **Yes** → **Leaf F: unnamed**  
    *Most awkward commitment:* Relying on external norms in a context designed to void all rules.  
  - **No** → Node 7  

  **Node 7:**  
  **Claim:** A party who commits *before knowing their opponent’s identity* gains an advantage by signaling inflexibility.  
  - **Yes** → **Leaf G: Gauthier's constrained maximiser**  
    *Most awkward commitment:* Maintaining commitment against a "similarly disposed" opponent when defection would save you both.  
  - **No** → Node 8  

  **Node 8:**  
  **Situation:** A commits first. B sees this and faces immediate retaliation if B refuses to capitulate.  
  **Claim:** B *should still refuse* because A, being rational, will ultimately blink to avoid mutual harm.  
  - **Yes** → **Leaf H: Backward-induction refusal**  
    *Most awkward commitment:* A’s public commitment is void since B assumes A will defy it to survive.  
  - **No** → **Leaf I: Deflationary appeal to repetition and reputation**  
    *Most awkward commitment:* Explaining credibility in a one-off race when reputation-building is impossible.  

  ---

  ### Critical Notes on the Tree  
  1. **Unseparated Leaves:**  
     - **Leaf E (refusal is a blunder)** and **Leaf I (reputation/repetition)** cannot be distinguished.  
     - **Why:** The tree lacks a node asking, "Does commitment require repeated interactions to work?"  
     - **Omitted:** To prioritize the "blunder vs. sane reply" distinction (Node 5), which directly tests intuitions about second-mover rationality. Adding this node would exceed the 10-node limit.  

  2. **Empty Cells in Logical Space:**  
     - **"Moving first is a liability + Credibility via machinery alone":** *Incoherent.* If machinery ensures credibility, moving first should confer advantage (not liability).  
     - **"Unit of rationality is the act + Background practice required":** *Unattractive.* Assessing acts alone ignores how norms/intentions scaffold credibility, making the position self-undermining.  
     - **"Second-mover refusal sane + Commitment to wrongdoing alters analysis":** *Undefended.* No major theory argues immoral commitments uniquely alter rationality *without* appealing to norms (Node 6) or desires (Node 4).  

  ---

  ### How to Use This Tree  
  - **For your novel:** Have trial readers answer each node (1–8) based on intuition. Their leaf (A–I) reveals their stance on whether/why commitment resolves the race.  
  - **Diagnostic value:** Unstable intuitions will scatter readers across leaves. Clusters at **H** (backward induction) or **I** (reputation) suggest a "pessimistic" resolution; clusters at **C** (Schelling) or **G** (Gauthier) imply commitment can succeed.  
  - **Key insight:** The tree isolates **why** a reader thinks commitment works (or not)—e.g., via machinery (C), desire-change (D), or social norms (F)—without game-theory jargon.
