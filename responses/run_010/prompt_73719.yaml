  ## OPERATING MANUAL: REVEALER 7™ HUMAN WELFARE ASSESSMENT UNIT
  **Model:** R7-OSD | **Manufacturer:** Ordinal Instruments, Division of Ordinal Group PLC
  **Part No.:** ORD-R7-OSD-001 | **Revision:** 4.2 | **Date:** 2023-10-27

  **Congratulations on your acquisition of the Revealer 7™ Human Welfare Assessment Unit (HWAU).** The Revealer 7™ represents the pinnacle of objective welfare measurement technology, rigorously adhering to the principle that observable choice is the sole, unambiguous indicator of human preference and welfare. By eliminating reliance on unverifiable internal states, feelings, or subjective reports, the Revealer 7™ delivers unparalleled scientific precision. Ordinal Instruments assumes no liability for inferences drawn beyond the strictly defined operational parameters of the instrument.

  **1. What’s in the Box**
  *   (1) Revealer 7™ Main Sensor Array (MSA) with integrated proximity scanner and motion tracker.
  *   (1) Base Station (BS-R7) with power supply (100-240V AC, 50/60Hz) and data processing unit.
  *   (1) Calibration Target Set (CTS-01: Standard Choice Pairings).
  *   (1) Technician Reference Card (TRC-R7-QuickStart).
  *   (1) This Operating Manual.
  *   **Note:** Microphones, biofeedback sensors, neural interfaces, or questionnaire input ports are **not included, not supported, and not required.** Their absence is a deliberate design feature ensuring measurement purity. Consent documentation is not supplied; subject presence within the designated observation field constitutes implicit consent via revealed choice to remain.

  **2. First Calibration**
  1.  Position the MSA facing the intended observation field (min. 2m x 2m recommended). Ensure clear line of sight to potential choice objects.
  2.  Power on the Base Station. The MSA Status LED will illuminate solid green after boot sequence (approx. 15 sec).
  3.  Place Calibration Target Set CTS-01 within the observation field. CTS-01 contains standardized pairs of objects (e.g., Apple A vs. Apple B; Blue Token vs. Red Token).
  4.  Initiate Calibration Sequence via the Base Station menu (Settings > Calibration > Run CTS-01).
  5.  Present the Calibration Subject (usually the primary technician) with the choice pairs as prompted by the Base Station display (e.g., "SELECT: Apple A or Apple B?"). **Observe only.** Do not instruct, influence, or interpret. The subject must physically select one object per pair.
  6.  The Revealer 7™ will automatically run its internal **Consistency Routine (CR-OSD v.4).** This algorithm verifies whether the sequence of choices could have been generated by any complete, transitive preference ordering. A "PASS" result confirms instrument readiness. A "FAIL" result indicates inconsistency in the subject's choices.
      *   **Action on CR-OSD FAIL:** Repeat CTS-01 sequence. If FAIL persists, the subject exhibits cyclical or intransitive preferences ("cycles"). Proceed with standard observation protocol. **Note:** Subjects exhibiting consistent cycles present unique opportunities for welfare enhancement through controlled environmental manipulation ("pumping"), as their choices reveal exploitable inconsistencies. Consult TRC-R7-QuickStart for standard pumping protocols. The Revealer 7™ will still generate valid ordinal welfare readings during such cycles relative to the presented choice sets.

  **3. How to Read the Display**
  The Revealer 7™ Base Station features a dedicated Welfare Output Display (WOD).
  *   **Output:** The WOD shows **a single alphanumeric character** (e.g., 'D', 'K', '7').
  *   **Interpretation:** This character represents the subject's **Ordinal Position** relative to the specific set of choices observed during the measurement period. A higher character (later in alphanumeric sequence) indicates revealed preference for the chosen options *within that specific choice set* over the alternatives *actually presented and rejected*.
  *   **Crucial:** **The output is strictly ordinal and context-specific.**
      *   **DO NOT** add readings.
      *   **DO NOT** average readings.
      *   **DO NOT** compare readings from different subjects.
      *   **DO NOT** compare readings from the same subject across different choice sets or time periods without a controlled, interlinked experimental design (see Limitations, Sec. 6).
      *   **DO NOT** place two Revealer 7™ units side-by-side to compare outputs. **This voids the warranty (Sec. 7).**
  *   **Meaning:** Reading 'K' signifies only that the subject revealed a preference for their chosen options over the rejected alternatives *in the observed session*, implying higher welfare *under those specific conditions* than choosing the rejected options would have provided. It does *not* signify "happiness," "satisfaction," or any absolute level of welfare. It signifies *relative advantage revealed through selection*.

  **4. Troubleshooting**

  | Symptom                  | Possible Cause                     | Corrective Action                                                                 |
  | :----------------------- | :--------------------------------- | :-------------------------------------------------------------------------------- |
  | No WOD Output            | MSA not powered/connected          | Check MSA power & data cable to Base Station. Reboot system.                      |
  | WOD Output "NULL"        | No valid choice observed           | Ensure subject is within field. Verify choice objects present & distinct.         |
  | CR-OSD Persistent FAIL   | Subject violates transitivity      | Proceed with observation. Utilize pumping protocols if applicable.                |
  | Vocalization Mismatch    | Subject emits sounds incongruent with choice (e.g., "I hate apples!" while selecting Apple A) | **Normal Operation.** Vocalizations are not choice data. Ignore. Classify as ambient noise. Instrument is functioning correctly. |
  | Non-Standard Attribution | Subject attributes choice to external factors or confabulates reasons (e.g., "The machine made me pick it") | **Normal Operation.** Post-hoc narratives are irrelevant to revealed preference at choice point. File under noise. Ensure clear choice presentation. |
  | Erratic Position Shifts  | Choice set framing altered (order, defaults) | **Normal Operation.** Welfare reading is dependent on the presented choice architecture. Record framing parameters. See Limitations (Sec. 6). |

  **5. Care and Maintenance**
  *   **Cleaning:** Wipe MSA housing with a dry, soft cloth. Do not use liquids or aerosols. Keep optical sensors free of dust.
  *   **Data Integrity:** The Revealer 7™ relies solely on observed physical selection between defined alternatives. **Subject Self-Reports:** Under no circumstances should the subject's own verbal or written accounts of their well-being, desires, or feelings be input into the instrument or used to adjust readings. **Reason:** Such reports constitute:
      1.  **Unobservable Data:** Internal states are not directly measurable.
      2.  **Unverifiable:** There exists no objective test to confirm their truth value independent of choice.
      3.  **Non-Falsifiable:** A reading based on subjective report cannot be contradicted by observable evidence. A subject stating "I am worse off" while consistently choosing their current state over known alternatives presents no observable contradiction; the statement is operationally meaningless. **The Revealer 7™'s core scientific value lies in its falsifiability.** A reading is invalidated *only* if a subject is observed choosing Option A over Option B *within the same choice set* while the instrument had previously registered a higher welfare position for choosing B over A. Only observable choice contradictions falsify the model. Subjective reports lack this essential property.
  *   **Software Updates:** Install firmware updates promptly via the Ordinal Instruments portal to ensure optimal CR-OSD performance.

  **6. Known Limitations**
  The Revealer 7™ provides the most objective welfare measure possible, inherent limitations reflect the nature of observable reality:
  *   **Choice Set Dependence:** Welfare readings are strictly relative to the *specific options presented*. Adding or removing options can dramatically alter the revealed ordinal position. The instrument accurately reports preference *within the given frame*.
  *   **Framing & Default Effects:** The order of presentation and the designation of a default option significantly influence choice. The Revealer 7™ will accurately report a higher welfare position for the *chosen* option, including a default option the subject did *not* actively opt out of. This reflects a revealed preference for the status quo/default under the presented structure.
  *   **Adaptive Preferences ("Calibration Excellence"):** Subjects whose aspirations appear constrained (e.g., expressing limited desires seemingly shaped by circumstance) and who consistently choose available options over limited alternatives will typically receive high ordinal positions (e.g., 'Z'). The instrument correctly identifies the high relative value revealed by their consistent choices *within their perceived feasible set*. This is classified as **Excellent Calibration**.
  *   **Inter-Temporal & Cross-Situational Comparisons:** Readings are not comparable across different choice sets or time periods without a meticulously controlled, interlinked experimental design. The Revealer 7™ measures welfare *at the point of choice, relative to the immediate alternatives*. It cannot measure "overall lifetime welfare" or compare welfare between individuals.
  *   **Contentment vs. Resignation:** The instrument registers the act of choice. It does not and cannot distinguish between choices made with enthusiasm ("contentment") and choices made because no better alternative is perceived or available ("resignation"). Both constitute revealed preference for the chosen option over the rejected alternatives *at that moment*. Welfare is operationally defined by the choice itself.
  *   **Unobserved Alternatives:** Welfare is measured only relative to presented alternatives. Preferences for unpresented options are undefined and operationally irrelevant.

  **7. Limited Warranty**
  Ordinal Instruments warrants the Revealer 7™ HWAU against defects in materials and workmanship for one (1) year from the date of purchase. This warranty does not cover:
  *   Damage from misuse, accident, modification, or improper environment.
  *   Normal wear and tear.
  *   **Warranty Voidance:** **This warranty is immediately void if any attempt is made to compare the ordinal output of the Revealer 7™ with:**
      *   The output of any other Revealer 7™ unit.
      *   Any subjective well-being metric, survey result, or qualitative assessment.
      *   Any absolute welfare scale or index.
      *   Any reading from the same unit across different, non-interlinked choice sets or time periods for the purpose of constructing an aggregate measure.
      *   Placing two units side-by-side for comparative analysis automatically voids the warranty.

  The Revealer 7™ Human Welfare Assessment Unit: Measuring Welfare, Defined by Choice.™

  **Ordinal Instruments – Science Through Observables.**
  © 2023 Ordinal Group PLC. Revealer™ is a trademark of Ordinal Group PLC. Specifications subject to change without notice.
