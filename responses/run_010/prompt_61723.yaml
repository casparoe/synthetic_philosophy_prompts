  - **Ordinalism**: Utility is rank-order only; cardinal comparisons are unscientific. Stressed by *RLHF* (scalar reward) and *WTP adjustments* (interpersonal weighting).
  - **Positive/Normative Divide**: Welfare claims require ethical judgments. Stressed by *WTP in Policy* (equity weights are normative).
  - **Tautology Defense**: Revealed preference isn’t circular *if* choice sets are independent. Stressed by *Engineered Choice Sets* (platform shapes constraints).

