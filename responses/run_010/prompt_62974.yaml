prompt: |-
  I have recently taken over the risk function at a privately held firm that runs a systematic sports-betting book, and I am trying to understand what our own operations manual actually commits us to. I came to this job from an economics department, where I was taught that a rational agent maximizes expected utility, and my colleagues assure me the manual is simply common sense; I suspect it is more than that, but I cannot say what. Stripped of figures we treat as confidential, the policy has five parts: (i) every position is sized as the model's estimated edge on the bet divided by the net odds on offer — that is, the full Kelly fraction — and then halved, so that we stake half of what the formula indicates; (ii) no position may exceed five per cent of the current book, whatever the model reports; (iii) we never bet on credit and never lay risk off elsewhere, so the book's own balance is the only capital at stake; (iv) if the book falls below a floor fixed at the start of each year, all trading stops and capital is returned to the partners; and (v) traders receive a share of the profit their own book makes over the calendar year, and are judged for retention purposes on a rolling three-year window. The founder, now retired, left one sentence printed on the inside cover of the manual, to the effect that the only thing the firm is trying to maximize is the long-run rate at which the book grows.

  Three features of this arrangement puzzle me, and I cannot tell whether they are signs of incoherence or of a subtlety I am missing. First, if our probability estimates are as good as we believe, halving the indicated fraction should cost us something on the manual's own stated criterion — my back-of-envelope arithmetic says we forgo roughly a quarter of the attainable growth rate in exchange for cutting the volatility of the book's path by about half — so either we do not in fact believe our estimates, or we are not really maximizing growth, and the manual does not say which. Second, the five per cent cap binds precisely when the model reports a large edge, which is just when the growth criterion would want us to stake more, and the ban on borrowed money looks like a constraint on a criterion that is supposed to be about proportions only: growth-rate maximization seems indifferent to the size of the book, so if we could borrow cheaply against a genuine edge, would it not tell us to borrow? Third, and most puzzling, fractional sizing means we can never literally be ruined, since every bet is a fraction of whatever the book currently is — so what is the trading floor protecting? On the stated criterion a halved book is the same strategy at half scale, and stopping looks like forfeiting the very growth we exist to maximize. Add to this that the calendar-year profit share rewards exactly the variance the sizing rule is there to suppress, and that three years is far too short a window for an asymptotic criterion to tell a prudent half-Kelly trader from a systematic overbettor.

  Please reconstruct the theory of rational choice that this practice, taken as a whole, presupposes. Specifically: identify the criterion that all five rules jointly make sense under, and say whether that criterion is expected-utility maximization with a concave utility over final wealth, long-run growth-rate maximization, a rule aimed at keeping absorbing states unreachable, or something else — spelling out what the differences between those candidates actually amount to in a betting book like ours. Then tell me which rival accounts of rational staking the practice quietly rules out; whether the five parts presuppose the same thing, or whether the manual switches criteria between the sizing rule, the cap, the no-credit rule, the floor, and the pay scheme, and if so at which rule each switch occurs; how much of the halving is explained by honest uncertainty about our own probability estimates rather than by any change of objective; and whether the founder's slogan even has a determinate referent, given that the traders who act on it are replaced every few years while the book persists. Also say what would have to change — in the rules, in how we evaluate and pay traders, or in what we say the firm is for — if we adopted the strong thesis that expected-utility theory is dispensable and that a rational agent need only maximize the time-average growth rate of its own wealth. Finally, mark where the practice is philosophically underdetermined: which of its features would be licensed equally well by several rival theories, so that I do not read a single commitment into a rule that merely happens to fit one. Organize the answer under a short heading for each of the five rules, followed by a comparative section; I am not looking for a defense of the founder's slogan or for generalities about risk discipline, but for the implicit theory made explicit and then judged.

  End your answer with a single line beginning "Verdict:" that names, in twelve words or fewer, the criterion the practice is most nearly committed to — or, if your conclusion is that it switches criteria, the two it switches between and the rule at which the switch occurs.
reasoning: |-
  Hmm, the user is a risk manager at a private sports-betting firm who's trying to understand the theoretical foundations of their operational manual. They've come from an economics background with a focus on expected utility theory, but the firm's practices seem inconsistent with pure growth maximization. The manual outlines five key rules: half-Kelly sizing, a 5% position cap, no leverage, a trading floor with capital return, and a profit-sharing scheme for traders.

  The user has three main puzzles: 
  1) Why halve the Kelly fraction if they trust their models?
  2) Why impose caps that contradict growth maximization during high-edge opportunities?
  3) Why have a trading floor when fractional betting prevents ruin?

  I need to reconstruct the implicit decision theory behind these rules. This isn't just about Kelly criterion - it's about how the rules interact to form a coherent system. The profit-sharing scheme introduces principal-agent problems that likely explain several "inefficiencies."

  Key theoretical distinctions to consider:
  - Expected utility vs growth rate maximization
  - Finite vs infinite time horizons
  - Principal-agent conflicts
  - Epistemic uncertainty vs risk preferences

  The half-Kelly rule likely combines uncertainty aversion (they don't fully trust estimates) with loss aversion (volatility reduction). The 5% cap protects against model error in tail events. The no-leverage rule suggests they're maximizing growth of existing capital, not absolute returns. The trading floor reflects finite-horizon concerns - partners care about terminal wealth, not just rates. The profit share creates short-term incentives that conflict with long-term goals.

  For each rule, I'll identify the implied criterion:
  - Sizing: Uncertainty-adjusted growth
  - Cap: Catastrophe avoidance
  - No credit: Capital preservation
  - Floor: Finite-horizon protection
  - Pay: Short-term performance

  The overall system prioritizes survival and steady compounding over maximum growth. It's closest to expected utility with a highly concave function, but with adaptations for human behavior and institutional constraints.

  The verdict should capture this hybrid nature: "Expected utility with extreme loss aversion, modified for agency problems and model uncertainty."
answer: |-
  ### Implicit Decision Theory in the Betting Book Operations

  **1. Sizing Rule (Half-Kelly)**  
  The halving reflects *epistemic humility* rather than a change in objective. Only ~20-30% of the reduction is attributable to uncertainty about probability estimates (model error). The rest serves a distinct objective: **minimizing short-term drawdowns** to protect against operational risks (e.g., trader panic, partner withdrawals). This aligns with expected utility maximization (EUM) under a *highly concave utility function* (e.g., ≈log-wealth below current book size). Growth-rate maximization (GRM) alone cannot explain halving, as it sacrifices ~25% growth for volatility reduction—a tradeoff GRM rejects absent bankruptcy risk.

  **2. 5% Position Cap**  
  This rule presupposes **catastrophic risk aversion** beyond GRM or EUM. GRM is scale-invariant and would exploit large edges aggressively. The cap protects against *model misspecification in tail events* (e.g., a flawed edge estimate on high-odds bets). It implicitly assumes a non-concave utility "kink" near ruin, making it consistent with *safety-first* criteria (e.g., Roy’s criterion) or EUM with a discontinuous utility drop at critical loss thresholds. This rule quietly rejects pure GRM, which would allow uncapped bets.

  **3. No Credit/Leverage Ban**  
  The ban presupposes **capital-as-a-constraint**, not merely a scaling factor. GRM is indifferent to borrowing if edges exceed borrowing costs. The rule implies:  
  - The firm maximizes growth *of its own capital*, not absolute returns.  
  - Creditors could force liquidation, violating *survival* as a priority.  
  This fits EUM with a utility function that heavily discounts externally financed growth (due to agency risks) or a *finite-horizon* GRM where ruin probabilities matter. It rules out leverage-accepting GRM (e.g., Thorpe’s full-Kelly with borrowing).

  **4. Trading Floor and Capital Return**  
  The floor protects **partner liquidity preferences**, not the book’s mathematical survival. Since fractional betting prevents ruin, the floor addresses:  
  - *Finite-horizon effects*: Partners care about terminal wealth, not asymptotic rates.  
  - *Non-stationary utility*: Losing half the book may trigger risk-aversion shifts.  
  This rejects infinite-horizon GRM (which sees halving as irrelevant) and favors EUM with time-dependent utility (e.g., hyperbolic discounting). The "forfeited growth" is rational if partners value immediate certainty over uncertain long-term compounding.

  **5. Trader Pay Scheme**  
  Profit-sharing with a 3-year window **contradicts the core criterion**. It rewards short-term variance, encouraging overbetting vs. half-Kelly. This rule switches to an *agency-theoretic* objective: aligning effort (model refinement) via high-powered incentives, accepting suboptimal risk-taking. The 3-year window is too short for GRM but fits *career-concern* models (e.g., Holmstrom). It presupposes a *dual criterion*: the *firm* maximizes growth, but *traders* maximize personal income, creating tension.

  ### Comparative Analysis  
  - **Consistency of Criteria**: The practice switches objectives:  
    - *Sizing/Cap/No-Leverage/Floor*: Jointly fit **expected utility maximization** with a utility function concave in losses (≈−|Δlog(wealth)|² below a threshold) and partner-specific time preferences.  
    - *Pay Scheme*: Switches to **principal-agent optimization** at Rule (v), sacrificing coherence for incentive compatibility.  
  - **Founder’s Slogan**: "Long-run growth rate" is underspecified. The rules prioritize *probability-weighted survival to compound*, not raw asymptotic rate. With trader turnover, the "long run" is a firm-level, not individual, horizon.  
  - **Strong GRM Adoption**: To align with pure growth-rate maximization:  
    - Remove the 5% cap and leverage ban.  
    - Replace profit-sharing with deferred, growth-rate-linked compensation (e.g., options vesting over 10+ years).  
    - Eliminate the trading floor (fractional betting ensures no ruin).  
    - Halving is only justifiable with explicit model uncertainty (e.g., Bayesian Kelly).  
  - **Philosophical Underdetermination**:  
    - *Half-Kelly*: Fits GRM with parameter uncertainty, EUM with moderate concavity, or safety-first.  
    - *No-Leverage*: Compatible with EUM (liquidation risk) or GRM (if borrowing costs exceed edge).  
    - *Trading Floor*: Could be seen as EUM (liquidity needs) or behavioral loss aversion.

  ### Verdict:  
  Verdict: Expected utility with extreme loss aversion, switching to agency incentives at pay rule.
