prompt: |-
  I hold the following methodological thesis about evolutionary psychology, and I have come to think it is right:

  No body of evidence that the discipline can in principle obtain confirms the claim that a given psychological trait is an adaptation shaped by selection for a particular ancestral function. Universality and cross-cultural stability of a trait are equally well expected on non-adaptive accounts — phylogenetic inheritance from a shared ancestor, general-purpose learning operating on near-universal environments, convergent cultural responses to convergent ecological constraints, or by-product status relative to some other trait that was itself selected. The ancestral conditions invoked to fix the function are reconstructed largely from the very traits they are supposed to explain, and in any case describe a shifting ensemble of environments rather than a single stable selection regime, so the adaptive problem the trait supposedly solved cannot be specified independently of the trait. And the property practitioners point to as the mark of an adaptation — economy of means, precision of fit, special-purpose structure, robustness across development and across cultures — is a profile that any mechanism which reliably does its job will display, whatever its history. The inference is therefore abductive at best, and the abduction is never forced: for every proposed function there is a rival account that accommodates the same data at least as well, and no test discriminates between them.

  I do not want a defense of this thesis. I want a map of its exposure. Please address the following.

  1. What would have to be true for the thesis to be false? Identify the kinds of evidence that would genuinely discriminate an adaptation hypothesis from its non-adaptive rivals, and say for each kind whether it is merely absent, practically difficult, or conceptually unavailable.

  2. Assess the strongest real candidates against the thesis: predictions of previously unobserved phenomena made in advance and then borne out; natural experiments in developmental chronology, such as the finding that sexual aversion tracks the duration and timing of close early association between children, and the demographic profiles of arrangements in which spouses are reared together from childhood; content-specific patterns in reasoning that appear only for some domains and not structurally equivalent ones; behavioral-genetic partitioning that locates variation where an adaptation account expects it and not where rival accounts expect it; convergent evidence from species with different mating and rearing systems. Rank these by how much pressure each actually puts on the thesis, and say which are routinely overclaimed by both sides.

  3. Distinguish which of three separable claims each candidate defeater threatens: that the mind is massively modular; that specific traits have specific selected functions; and that this body of work constitutes a unified research program rather than a loose collection of independent hypotheses. A result that damages the second claim in one domain need not touch the general thesis, and I want the distinction kept sharp rather than blurred.

  4. Which of my premises would working researchers in the field concede, and which would they reject — not as caricatured by their critics, but as they argue among themselves? Where the field is internally divided about method, say which side's position, if adopted, would come closest to granting my case, and which would come closest to refuting it.

  5. Reflexively: my thesis appears compatible with any future result, since every successful prediction can be absorbed by noting that a rival account fit the data equally well. Give an honest assessment of whether it has thereby been qualified into unfalsifiability, and whether that is a genuine defect for a claim of this kind or an acceptable feature of a thesis about the limits of inference.

  6. Finally, rank the defeaters from fatal to merely awkward, and name the single kind of evidence you judge most likely to change my mind.

  One formatting constraint: no bibliography, reference list, or named citations. Where you appeal to a study or a result, describe it by what it showed and how it was obtained, not by who published it.
reasoning: |-
  Okay, the user presents a sophisticated critique of evolutionary psychology methodology and requests a structured analysis rather than a defense. They're clearly well-versed in philosophy of science and evolutionary biology, likely an academic or advanced graduate student. Their frustration with circular reasoning in adaptationist claims feels personal - perhaps they've encountered resistance when raising these objections before.

  The request is admirably precise: they want vulnerability mapping, not debate. Five key angles emerge from their questions: falsification conditions, real-world evidence assessment, claim differentiation, field consensus, and reflexivity. Their formatting constraint suggests they're familiar with literature but want focus on ideas over authority appeals.

  For part 1, I consider evidentiary thresholds. Genuine adaptation evidence would require either: (a) time-machine observations of ancestral selection pressures, (b) phylogenetic controls showing trait emergence coincides with new adaptive problems, or (c) engineering constraints proving non-adaptive origins are physically impossible. All are conceptually or practically out of reach - even fossil cognition evidence would face the "equally good explanation" problem.

  Part 2 needs careful evidence-tiering. Twin studies showing adaptive trait heritability patterns (like jealousy sex differences) are stronger than universal claims - but still don't eliminate cultural confounds. Cross-species convergence in dolphins vs primates is better, yet the "shared environment" counter remains. Natural experiments like Westermarck effect demos are probably the heaviest hitters, but still allow "general learning" reinterpretations.

  The modularity/adaptation/program distinction in part 3 is crucial. Most evidence only bears on specific adaptations. Only cross-domain dissociation (like cheater-detection vs logical reasoning differences) pressures massive modularity. Nothing really addresses the "unified program" claim except methodological consistency across studies.

  Field concessions (part 4) would likely grant premise 3 (ancestral environment heterogeneity) but fight premise 1 (non-adaptive universality explanations). The "spandrel" faction might accept my thesis locally, while design-focused researchers would counter that predictive models imply selective histories.

  The unfalsifiability charge in part 5 is serious but not fatal. Like skepticism about other historical sciences, it identifies real epistemological limits without dismissing the field. The test is whether evolutionary psychology generates novel, precise predictions - which it sometimes does, even if alternatives exist.

  My closing ranking: Westermarck-type natural experiments > cross-species convergence > domain-specific dissociations > universality claims. But nothing is fatal; the smoking gun would be finding a neural "function tag" - some biological signature of selective history independent of current utility. Unlikely, but not impossible.
answer: |-
  Here is a systematic assessment of your methodological thesis on evolutionary psychology, addressing each point as requested:

  ### 1. Falsification Conditions & Discriminating Evidence
  For your thesis to be false, the following would need to be true:
  - **Independent Reconstruction of Ancestral Environments:** Evidence (e.g., paleoecology, ancient DNA, fossilized behavior) that reliably specifies selective pressures *without* circular reference to modern traits. *Status:* Practically difficult (incomplete/fragmentary data), not conceptually impossible.
  - **Phylogenetic Controls:** Evidence that a trait emerges only in lineages *after* a specific adaptive challenge arises, absent in sister taxa without that challenge. *Status:* Absent for complex human cognition (lack of close hominin comparators), practically difficult for distal ancestors.
  - **Engineering Impossibility:** Demonstration that *only* an adaptationist solution could achieve observed precision/efficiency for a specific problem, with non-adaptive alternatives physically or computationally infeasible. *Status:* Conceptually unavailable (multiple realizability of functions).
  - **Developmental Lockstep:** Evidence that trait ontogeny requires exposure to the *specific* adaptive problem it purportedly solves, failing to develop if exposed only to structurally similar non-adaptive inputs. *Status:* Merely absent (ethical/logistical barriers).

  ---

  ### 2. Assessment of Real-World Candidates (Ranked by Pressure)
  | **Evidence Type** | **Example** | **Pressure on Thesis** | **Overclaim Status** |
  |-------------------|-------------|------------------------|----------------------|
  | **Natural Experiments** | Sexual aversion correlating with childhood co-rearing duration (Westermarck effect), tested in Israeli kibbutzim/Chinese sim-pua marriages. | High (predicts novel demographic patterns) | Overclaimed: Rivals invoke generalized associative learning. |
  | **Cross-Species Convergence** | Sex differences in spatial navigation evolving independently in polygynous vs. monogamous rodents. | Medium-High (controls for phylogeny) | Overclaimed: Ignores shared ecological constraints. |
  | **Domain-Specific Dissociation** | Better reasoning on social contract problems (e.g., detecting cheaters) vs. isomorphic abstract logic problems. | Medium (suggests specialized design) | Overclaimed: Both sides neglect expertise effects. |
  | **Behavioral Genetics** | Heritability of jealousy patterns aligning with adaptive predictions (e.g., sexual vs. emotional jealousy dimorphisms). | Low-Medium | Overclaimed: Adaptationists ignore GxE; rivals understate canalization. |
  | **Novel Prediction** | Forecast that snakes/spiders would elicit faster visual detection than modern threats (guns), later confirmed. | Low | Overclaimed: Fails to exclude general fear preparedness. |

  ---

  ### 3. Distinguishing Threatened Claims
  - **Massive Modularity:** Primarily challenged by *domain-specific dissociations*. If reasoning enhancements appear *only* in ecologically valid domains, it pressures domain-general accounts.  
  - **Specific Adaptations:** Directly pressured by *natural experiments* and *cross-species convergence*. Westermarck undermines "by-product" explanations for incest aversion.  
  - **Unified Research Program:** Weakened only if *multiple lines of evidence consistently fail* to converge (e.g., behavioral genetics contradicts cross-cultural universality). No single result threatens this.  

  **Key Boundary:** A failure to confirm *one* specific adaptation (e.g., male spatial navigation) leaves massive modularity and the program intact. Conversely, modularity’s falsification wouldn’t preclude some traits being adaptations.

  ---

  ### 4. Field Concessions & Divisions
  - **Conceded Premises:**  
    - Ancestral environments were heterogeneous ("shifting ensemble").  
    - Universality ≠ adaptation (e.g., by-products acknowledged).  
    - Adaptive hypotheses are abductive/"inference to best explanation".  
  - **Rejected Premises:**  
    - Non-adaptive accounts "equally" explain precision/economy (field argues selection uniquely predicts *costly specificity*).  
    - Rival accounts *always* accommodate data "at least as well" (field claims predictive superiority in cases like Westermarck).  
  - **Internal Divisions:**  
    - **Pro-Thesis Faction:** "Spandrel" advocates who stress exaptation and constraint-based evolution. Would grant your case if non-adaptive models match predictions.  
    - **Anti-Thesis Faction:** "Strong adaptationists" who argue selectionist predictions are uniquely stringent (e.g., require complex, interdependent features). Would refute you by showcasing cases where rivals fail parsimony tests.

  ---

  ### 5. Reflexivity: Unfalsifiability Charge
  - **Unfalsifiable?** Yes, *if* insisting that functional equivalence *always* exists. However:  
    - **Not a Defect:** For a *limitative thesis* (e.g., "underdetermination in historical sciences"), unfalsifiability is inherent and acceptable. Your claim parallels skepticism about unobservable entities in physics.  
    - **Mitigating Factor:** Thesis *is* falsified if *any* evidence arises that adaptationist hypotheses *outpredict* rivals *systematically* across diverse traits. Your stance becomes dogmatic only if denying such a pattern were it to emerge.  

  ---

  ### 6. Defeater Ranking & Best Evidence
  1. **Fatal:** None (thesis is epistemological, not empirical).  
  2. **Severe:** Cross-species convergence under divergent phylogenies (e.g., identical complex trait in marsupials/placentals facing same selection).  
  3. **Substantial:** Natural experiments with quantitative precision (e.g., aversion thresholds matching optimal outbreeding predictions within 5% error).  
  4. **Awkward:** Universality + domain-specific dissociations (e.g., fear of heights in infants blind from birth).  

  **Most Mind-Changing Evidence:**  
  Discovery of a **neural "fossil record"** (e.g., conserved developmental pathway linking a trait to a *specific* Pleistocene-selected genetic variant, with no plausible current utility). *Status:* Currently unavailable, not conceptually impossible.  

  ---
  This map presents your thesis as a robust challenge to adaptationist certitude, but not an insurmountable barrier. Its strength lies in exposing underdetermination; its weakness is that it cannot preclude future evidentiary breakthroughs that satisfy the burden outlined in (1).
