  ### Principles for Pricing Gambles

  After analyzing your cases, I propose a primary principle that accounts for most of your verdicts, along with two competing candidates that address specific tensions. The core insight is that your pricing reflects **robustness under description and outcome variation**, which requires absolute convergence of the expected utility series. This resolves the distinction between infinite expectation (case 3) and undefined expectation (case 4), while accommodating your aversion to conditional convergence and dependence on bookkeeping.

  #### **Primary Principle: Robust Expected Utility (REU)**  
  *Definition*: The price of a gamble is the certainty equivalent of its expected utility, computed using a strictly increasing, concave utility function \(U\), provided that:  
  - The series for expected utility converges **absolutely** (i.e., \(\sum |U(\text{payoff}_n) \cdot P(n)| < \infty\)).  
  - If absolute convergence fails, the gamble has no price.  
  *Utility function*: \(U(x)\) is bounded (e.g., \(U(x) = \arctan(x)\) or \(U(x) = 1 - e^{-kx}\) for \(k > 0\)). Boundedness ensures absolute convergence for all gambles, making expectations well-defined and description-invariant.  

  #### **Competing Candidates**  
  1. **Limit of Truncations (LoT)**  
     *Definition*: The price is \(\lim_{N \to \infty} \text{price}(G_N)\), where \(G_N\) is the gamble truncated after \(N\) flips, provided the limit exists and is independent of truncation order. If the limit oscillates, use the Cesàro mean (average of partial sums). Fails if the limit depends on description (e.g., bundling).  
     *Motivation*: Cases 5 (truncations converge) and 7 (oscillations averaged to 0.5).  

  2. **Dominance-Adjusted Robustness (DAR)**  
     *Definition*: If a gamble has undefined expectation but pointwise dominates another gamble you would accept, price it at or above the dominated gamble's price. Apply REU otherwise.  
     *Motivation*: Your verdict in case 8 (aggregation) and case 2 (ignoring extreme tails), where dominance or context overrides strict convergence.  

  ---

  ### **Application to Your Cases**  
  REU preserves your verdicts in cases 1, 3, 4, 5, 6, and 7 but overturns case 2. LoT preserves cases 1, 5, and 7 but overturns 2, 3, 4, and 6. DAR preserves cases 1, 2, 3, 5, 7, and 8 but overturns 4 and 6.  

  | Case | Your Verdict | REU (Bounded Utility) | LoT (Truncation Limit) | DAR (Dominance) |
  |------|-------------|------------------------|------------------------|-----------------|
  | 1. Certain $10 | $10 | $10 | $10 | $10 |
  | 2. $10 + huge payoff | $12 | $10 (overturned: bounded utility discounts extreme payoff) | ~$10 (overturned: truncation ignores flip 100) | $12 (preserved: dominance over $10 ticket) |
  | 3. \(2^n\) payoff | $50 | $50 (bounded utility caps gains) | No price or arbitrary (overturned: truncations diverge) | $50 (preserved: no risk of loss) |
  | 4. Pasadena game | No price | $0.69 (overturned: bounded utility forces absolute convergence) | $0.69 (overturned: independent of bundling) | No price (preserved: undefined expectation) |
  | 5. Truncated Pasadena | $0.69 | $0.69 | $0.69 | $0.69 |
  | 6. Bundled Pasadena | No price | $0.69 (overturned: bundling irrelevant under REU) | No price (preserved: bundling changes limit) | No price (preserved: undefined expectation) |
  | 7. Alternating \(2^n\) | $0.40 | $0.40 (bounded utility; near Cesàro mean) | $0.50 (close to your $0.40) | $0.40 |
  | 8. Aggregation | Accept $1/ticket | Accept (law of large numbers) | Accept (truncations converge) | Accept (dominance over no intervention) |

  #### **Key Tensions and Resolution**  
  - **Case 4 vs. Case 7**: Your tension (no price for Pasadena but $0.40 for alternating \(2^n\)) arises because case 4’s conditional convergence feels fragile (bookkeeping changes value), while case 7’s divergence feels regular (oscillations averageable). REU dissolves this: bounded utility ensures both have defined prices ($0.69 and $0.40).  
  - **Verdict to Abandon**: **Case 4’s "no price" verdict** must be abandoned. Conditional convergence is not inherently problematic—it becomes robust under bounded utility. Your unease stems from the *potential* for rearrangement, but the gamble’s *fixed description* (flip order) anchors the expectation.  
  - **Why REU Overturns Case 2**: Bounded utility caps the utility of extreme gains, so the huge payoff adds negligible value. Your $12 price suggests overweighting tiny probabilities (e.g., prospect theory), but REU prioritizes coherence over this heuristic.  

  ---

  ### **New Cases**  
  Apply REU (bounded utility) to new scenarios:  

  1. **Case 4 with Losses Capped at $1000, Gains Uncapped**  
     - REU: Price ≈ $0.69. Bounded utility already caps utility, so explicit loss cap changes little. Absolute convergence holds.  
     - Verdict: Definite price ($0.69), not an admission of failure.  

  2. **Case 7 Played 1M Times by a Syndicate**  
     - REU: Price per ticket ≈ $0.40. Aggregation reduces variance; total payoff concentrates near $400,000. Certainty equivalent scales linearly.  
     - Verdict: Definite price ($0.40/ticket).  

  3. **Gamble with Undefined Expectation but Dominates Acceptable Alternative**  
     - Example: Payoff = \(2^n / n\) for odd \(n\), \(-1\) for even \(n\). Expectation undefined (harmonic series), but pointwise ≥ a gamble paying $0.10 for certain (which you accept at $0.10).  
     - REU: No price (absolute convergence fails).  
     - DAR: Price ≥ $0.10 (by dominance).  
     - Verdict: REU yields "no price," but this is a *verdict* (coherence requires robustness), not failure. DAR offers an escape.  

  4. **Seller’s Side of Case 4 (You as Bookie)**  
     - REU: Charge ≥ certainty equivalent of expected loss ($0.69). Bounded utility ensures well-defined loss.  
     - Verdict: Definite price (≥ $0.69).  

  ---

  ### **Role of Bounded Utility**  
  - **Is it a solution?** Yes. Bounded utility (in REU) forces absolute convergence, resolving description-dependence (case 6), conditional convergence (case 4), and infinite expectations (case 3). It converts "undefined" expectations into defined ones.  
  - **Squaring with Case 2**: Your $12 verdict in case 2 conflicts with REU’s $10. This is because:  
    - Bounded utility discounts extreme payoffs: \(U(\text{huge gain}) \approx U(\text{upper bound})\), so its contribution is negligible.  
    - Your $12 suggests behavioral factors (e.g., probability weighting or excitement), but REU prioritizes normative coherence. If you insist on case 2, use DAR: the ticket dominates a $10 certain ticket, justifying $12.  
  - **Not a change of subject**: Unbounded utility leads to paradoxes (e.g., Pasadena rearrangement). Bounded utility is a standard axiomatic fix (e.g., in von Neumann-Morgenstern utility), ensuring prices exist and are consistent.  

  ---

  ### **Case 3 vs. Case 4: Real Distinction?**  
  - **Real distinction**: Yes. Case 3 has **infinite expectation** (divergent series), while case 4 has **undefined expectation** (conditionally convergent series). This does real work in your verdicts:  
    - Infinite expectation (case 3) feels "fixable" via truncation (you price at $50), as gains grow slowly.  
    - Undefined expectation (case 4) feels unpriceable due to fragility (bookkeeping changes value).  
  - **But it’s not fundamental**: Under REU, both become finite ($50 and $0.69). The distinction is an artifact of unbounded utility—a useful intuition, but not normative.  

  ---

  ### **Recommendation**  
  Adopt **Robust Expected Utility (REU) with bounded utility**. It:  
  - Preserves your core intuitions (cases 1, 3–7).  
  - Dissolves the case 4 vs. 7 tension via boundedness.  
  - Ensures prices are description-invariant and always defined.  
  - Overturns case 2 ($10 instead of $12) and case 4’s "no price" ($0.69), but these are necessary for coherence.  

  If you resist abandoning case 2 or case 4’s "no price," use **Dominance-Adjusted Robustness (DAR)**. It accepts heuristics (e.g., dominance, aggregation) but may allow Dutch books if misapplied.  

  **Final note**: Your pattern tracks a deep issue—**risk versus uncertainty**. Case 4’s fragility is "Knightian uncertainty" (unmeasurable risk), while case 3 is "mere risk" (measurable, even if infinite). REU converts both into measurable risk via bounded utility, which is why it succeeds.
