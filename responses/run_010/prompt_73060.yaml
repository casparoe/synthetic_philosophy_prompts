answer: |-
  ### Diagnostic Instrument: Occupational Distribution and Gender Equality  

  **Empirical Finding (Stipulated for Exercise):** In countries scoring highest on standard gender equality indices, women are underrepresented among graduates in physics, engineering, and computing, and overrepresented in nursing, early-years education, and comparable fields. In lower-scoring countries, these occupational distributions are closer to parity.  

  **Instructions:** Answer each question based on reflection alone. Do not reference schools of thought, disciplines, authors, or the word "paradox." Proceed through the tree to a terminal position (leaf).  

  ---

  #### Decision Tree  
  **Node 1: What is the core subject of the finding?**  
  - **A.** The distribution of occupational outcomes (who works in which jobs).  
  - **B.** The distribution of reported interests, tastes, or self-assessed strengths (what people say they prefer or feel suited for).  

  **Node 2 (if A at 1): Does the pattern reflect a real feature of comparable societies?**  
  - **A.** Yes, the pattern persists even when comparing similar countries and disaggregating fields (e.g., engineering vs. nursing as distinct sectors).  
  - **B.** No, the pattern dissolves when adjusting for structural differences (e.g., economic development, cultural history) or field heterogeneity (e.g., "STEM" is too broad).  

  **Node 2 (if B at 1): Do reported preferences align with underlying abilities?**  
  - **A.** Yes, stated interests generally reflect innate or stable capacities (e.g., self-assessments correlate with objective skills).  
  - **B.** No, stated interests are often misaligned with abilities due to external influences (e.g., socialization distorts self-perception).  

  **Node 3 (if A at 2 under 1A): What aspect of gender equality is most relevant?**  
  - **A.** Opportunities (e.g., access to education, legal rights).  
  - **B.** Outcomes (e.g., representation in leadership, income).  
  - **C.** Attitudes (e.g., public beliefs about gender roles).  

  **Node 4 (if A at 3): Can "free choice" exist independently of social influence?**  
  - **A.** Yes, free choice and socially shaped choice are distinct; choices can be uncoerced even if preferences are influenced.  
  - **B.** No, preference formation is inherently social; "free choice" is incoherent without accounting for shaping.  

  **Node 5 (if A at 4): Is the occupational distribution unjust?**  
  - **A.** Yes, group disparity is unjust regardless of individual choices.  
  - **B.** No, injustice occurs only when traceable to constraints (e.g., discrimination).  
  - **C.** The focus should be on individual welfare, not group ratios.  

  **Node 6 (if B at 4): Does consent legitimize the outcome?**  
  - **A.** Yes, if choices are uncoerced, the outcome is just.  
  - **B.** No, preferences shaped by unjust conditions cannot justify outcomes.  

  **Node 7 (if B at 2 under 1A or 1B): Is the gender equality index valid for this context?**  
  - **A.** Yes, but it measures something unrelated to occupational choice (e.g., political empowerment).  
  - **B.** No, the index conflates dimensions (e.g., opportunity vs. outcome) and is misapplied.  

  ---

  #### Terminal Positions (Leaves)  
  1. **Index Interrogation View** (from B at 2 under 1A or 1B, or B at 7): The finding dissolves when the index is scrutinized; it does not measure relevant factors.  
     - *Awkward commitment: Must explain why the pattern appears robust in initial analyses.*  
  2. **Revealed Preference View** (from A at 2 under 1B, A at 4, and A at 6): Disparities reflect free choices; intervention is paternalistic.  
     - *Awkward commitment: Must defend why preferences coinciding with traditional roles aren’t themselves shaped by injustice.*  
  3. **Affluence-Mediated Choice View** (from A at 3, A at 4, and B at 5 or C at 5): Affluence enables identity-expressive choices (e.g., security allows "feminine" roles).  
     - *Awkward commitment: Must reconcile expressive freedom with outcomes that reinforce historical stereotypes.*  
  4. **Dispositional Essentialism** (from A at 2 under 1B, or A at 3): Innate differences explain disparities; no social explanation needed.  
     - *Awkward commitment: Must account for why dispositions don’t produce identical patterns cross-culturally.*  
  5. **Endogenous Preference View** (from B at 4 and B at 6): Preferences are socially formed; consent doesn’t excuse injustice.  
     - *Awkward commitment: Must define "true" preferences non-circularly.*  
  6. **Structural Parity View** (from A at 5): Parity is required for justice, irrespective of stated preferences.  
     - *Awkward commitment: Must justify overruling individual choices for group equity.*  
  7. **Question Framing Rejection** (from B at 1 in Node 1 context): The question is malformed (e.g., ignores non-binary identities or intersectionality).  
     - *Awkward commitment: Must reframe without reproducing the same disparities.*  
  8. **Constraint-Centric Injustice View** (from B at 5 or A at 2 under 1A with discrimination): Injustice exists only with measurable constraints.  
     - *Awkward commitment: Must explain how to detect "hidden" constraints like implicit bias.*  
  9. **Non-Aggregation View** (from B at 2 under 1A): The pattern is an artifact of overgeneralization; field-specific analyses show no paradox.  
     - *Awkward commitment: Must address why aggregate trends emerge from non-gendered parts.*  

  ---

  ### Instrument Application to Cases  
  **Case (i): Occupation shifts from majority-female to majority-male in two decades via administrative decisions (e.g., recruitment, pay), with no change in general equality.**  
  - **Accommodated by:** Constraint-Centric Injustice View (explicit discrimination), Endogenous Preference View (preferences adapted to new constraints).  
  - **Not accommodated by:** Dispositional Essentialism (dispositions don’t change rapidly), Affluence-Mediated Choice View (change driven by policy, not affluence).  
  - **Requires revision for:** Revealed Preference View (must account for coercion masquerading as choice).  

  **Case (ii): Veterinary medicine, pharmacy, and law shift from majority-male to majority-female in one generation in high-equality countries, with no formal equality changes.**  
  - **Accommodated by:** Endogenous Preference View (social norms shifted preferences), Affluence-Mediated Choice View (affluence enabled identity-driven choices), Revealed Preference View (if interpreted as genuine preference shifts).  
  - **Not accommodated by:** Dispositional Essentialism (fixed dispositions can’t explain rapid change), Structural Parity View (focuses on parity, not directional shifts).  
  - **Requires revision for:** Index Interrogation View (must explain why the index didn’t capture this dynamic).  

  **Case (iii): Identical-aptitude cohorts show wider occupational sex splits in higher-equality countries.**  
  - **Accommodated by:** Dispositional Essentialism (equal opportunity reveals innate differences), Affluence-Mediated Choice View (affluence enables expression of shaped preferences).  
  - **Not accommodated by:** Structural Parity View (assumes disparities are unjust even if aptitude-based), Constraint-Centric Injustice View (no evidence of constraints).  
  - **Requires revision for:** Endogenous Preference View (must show preferences are shaped more in equal societies).  

  ---

  ### Additional Notes  
  **Indistinguishable Leaves:**  
  - **Strong Socialization View (subtype of Endogenous Preference)** and **Adaptive Preference View (subtype of Endogenous Preference)** are extensionally equivalent in all cases above. Both hold that preferences are socially formed and may perpetuate injustice.  
    - **How to separate them:** Evidence of *internal conflict* (e.g., women in high-equality societies reporting dissonance between preferences and aspirations) supports Adaptive Preference. Evidence of *harmonious internalization* (e.g., surveys showing high satisfaction with gender-typical roles) supports Strong Socialization.  

  **Unoccupied Positions (Empty Cells):**  
  1. **"Robust finding; reflects dispositions; unjust"** (e.g., Dispositional Essentialism + Structural Parity).  
     - *Diagnosis:* Politically costly (implies innate traits should be overridden) and incoherent (injustice can’t stem from immutable differences).  
  2. **"Artefact; preferences are misaligned; intervention is just"** (e.g., Index Interrogation + Node 2B under 1B + Structural Parity).  
     - *Diagnosis:* Incoherent (can’t demand intervention for a pattern deemed illusory).  
  3. **"Real and free choices; focus on individual welfare; ratio disparity is unjust"** (e.g., Affluence-Mediated Choice + C at 5 + A at 5).  
     - *Diagnosis:* Incoherent (focus on individual welfare contradicts group-ratio concern).  
  4. **"Valid index; measures attitudes; constraint-focused injustice"** (e.g., C at 3 + Constraint-Centric Injustice).  
     - *Diagnosis:* Politically costly (discounts attitudinal barriers as constraints) and rare (attitudes are often seen as constraints).  

  **Indeterminate Answers ("Unknown" at Every Node):**  
  A student who answers "unknown" throughout reaches no leaf and is assigned to **Methodological Skepticism**. This is a legitimate resting place if uncertainty stems from underdetermined evidence (e.g., ambiguous index construction). However, it is a failure to engage if the student avoids warranted commitments (e.g., rejecting all distinctions in Node 1).  

  ---  
  *End of instrument. Designed for seminar use; positions reflect logical commitments, not empirical endorsements.*
