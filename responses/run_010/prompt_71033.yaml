  ### Step 2: Residue Report

  Now, we compare with the combinatorial game strategy-stealing argument.

  #### Features that carry over intact:

  1. **Monotonicity of additional moves**: In combinatorial games, having extra moves (or more board spaces to play on) never hurts because the player can ignore them. In our translation, having more resources (which allows at least the same set of moves, and possibly more, and with the same or better effect) is analogous. This feature is preserved.

  2. **Existence argument**: Both are existence arguments. The combinatorial argument proves the existence of a winning strategy for the first player by contradiction. The AI claim argues that there exists a strategy that defers the project and is at least as good.

  #### Features that carry over under distortion:

  1. **Player structure**: The original combinatorial argument is for two-player adversarial games. The AI claim is for a one-player game (or a game against nature). This is a distortion because the adversarial element is absent. In the two-player setting, stealing the opponent's strategy is a key idea. Here, we are not stealing from an opponent but rather reassigning a move in time. The force of the combinatorial argument comes from the symmetry and the fact that the opponent cannot prevent the stealing. In the AI claim, there is no opponent to interfere.

  2. **Symmetry**: The combinatorial argument often relies on the symmetry of the game (e.g., in Hex). In the AI setting, the symmetry is not between players but between time periods (early vs. late) and resource levels. We have assumed that the same action at a higher resource level is at least as good. This is a form of symmetry but in a different dimension (resource level and time).

  #### Features with no counterpart:

  1. **Adversarial opponent**: The entire idea of stealing the opponent's strategy has no counterpart in the one-player setting. The AI claim does not involve an opponent.

  2. **Contradiction**: The combinatorial argument is a proof by contradiction that shows the first player must have a winning strategy. The AI claim is a direct argument about the existence of a deferred strategy, without contradiction.

  3. **Terminal conditions and payoffs in adversarial settings**: In combinatorial games, the terminal conditions are win/loss/draw. In the AI claim, we have a utility function that may be continuous and unbounded. The combinatorial argument is about discrete outcomes (winning vs. losing) and the AI claim is about achieving at least as much utility.

  4. **Perfect information and determinism**: Both have perfect information and determinism, but note that the combinatorial argument requires it. The AI claim also assumes perfect information and determinism? The original claim does not specify, but we are translating in a deterministic setting.

  #### Force of the Argument:

  The combinatorial strategy-stealing argument is a rigorous mathematical proof in the context of finite, deterministic, perfect-information games. It is logically compelling.

  The AI claim, as translated, relies on additional premises (resource accumulation, fungibility, and no discounting) that are not generally true. Therefore, the force of the argument is weaker. In particular:

  - **Resource accumulation**: In reality, resources might not be non-decreasing. There might be decay or exogenous events that destroy resources. We assumed the player can always choose to accumulate.

  - **Fungibility**: We assumed that having more resources never reduces the set of available actions and that the same action is at least as good. But in reality, some actions might be time-sensitive. For example, if delaying a project causes an opportunity to be missed, then deferral could be harmful.

  - **No time discounting**: Utility functions often discount future utility. If there is a discount factor, then deferring a project reduces its present value.

  Therefore, the borrowed claim only inherits the name and the high-level idea of monotonicity (more is never worse) but not the full logical force of the combinatorial argument. The combinatorial argument is a theorem in a well-defined setting, while the AI claim is a contingent claim that depends on assumptions that may not hold in the real world.

  Moreover, the combinatorial argument is about adversarial play, and the force comes from the impossibility of both players having a winning strategy. In the AI setting, without an adversary, the argument becomes one about the properties of the environment (monotonicity and fungibility) which are not guaranteed.

  ---

  ### Summary

  The translation requires adding premises about resource accumulation, fungibility, and no time discounting. The residue report shows:

  - The monotonicity feature carries over.
  - The existence argument style carries over.
  - The adversarial context and the contradiction proof do not carry over.
  - The force of the combinatorial argument is not fully inherited because the AI claim depends on strong assumptions that may not hold.

  Therefore, the borrowed claim in the AI context uses the name "strategy-stealing" because of the high-level idea of deferring a move without loss, but it does not inherit the same logical inevitability because it rests on additional contingent assumptions about the world.
answer: |-
  ### Translation of the "Strategy-Stealing Assumption" into Combinatorial Game Theory Vocabulary

  **Original Claim in AI/Long-Run Context**:  
  "A sufficiently capable agent loses nothing by deferring particular value-driven projects, because resources are fungible and whatever could have been done sooner can also be done later, with more of them."

  **Restated Claim in Positional Game Terms**:  
  Consider a single-player achievement game with the following properties:  
  - **Players**: One player (the "agent") against a passive environment (no adversarial opponent).  
  - **Move Sets**: The player has a set of moves \( M \) available at each state \( s \). Moves correspond to "projects" (e.g., expending resources to achieve subgoals).  
  - **Monotonicity of Additional Moves**: The game exhibits *move monotonicity*: If a move \( m \) is available at state \( s \) with resource level \( r \), then for any state \( s' \) reachable after deferring \( m \) (via a sequence of resource-accumulation moves), \( m \) (or a strictly better move \( m' \)) is available at \( s' \) with resource level \( r' \geq r \). Additional resources never restrict options and may enable new or improved moves.  
  - **Perfect Information**: The game state (including resource levels and available moves) is fully observable.  
  - **Terminal Conditions**: The game terminates at a finite time with a determinate utility \( u \) (e.g., total "value" achieved).  
  - **Existence Proof**: The claim is existential: There exists a strategy \( \sigma_{\text{defer}} \) that defers a specific move \( m \) to a later state, achieving utility \( u_{\text{defer}} \geq u_{\text{now}} \), where \( u_{\text{now}} \) is the utility from playing \( m \) immediately.  

  **Key Additions (Premises Not Explicit in Original Claim)**:  
  1. **Resource Accumulation Moves**: The player can make "wait" moves that increase resources \( r \) without penalty. (Added to model fungibility.)  
  2. **No Time Discounting**: Utility is invariant to the timing of achievements (e.g., achieving a goal at turn 10 is as valuable as at turn 5). (Added to match "loses nothing.")  
  3. **Move-Outcome Monotonicity**: For any move \( m \) deferred to a state with higher resources, the outcome (e.g., subgoal achievement) is at least as good as if played earlier. (Added to model "done later with more resources.")  

  Without these additions, the mapping fails (e.g., no way to represent resource growth or fungibility).  

  ---

  ### Residue Report: Mapping Combinatorial Features to the AI Claim  

  #### Features Carrying Over Intact  
  1. **Monotonicity of Additional Moves**:  
     - **Combinatorial Setting**: Extra moves never harm a player (e.g., in Hex, more board control is strictly better).  
     - **AI Claim Translation**: Higher resources \( r' \geq r \) expand the move set or improve outcomes (fungibility). This directly carries over: More resources act like "extra moves," preserving the monotonicity principle. No distortion.  

  2. **Existence Proof (Non-Constructive)**:  
     - **Combinatorial Setting**: Strategy-stealing proves existence of a winning/non-losing strategy without constructing it (e.g., "Player 1 must have a winning strategy because if not, Player 2’s strategy could be stolen").  
     - **AI Claim Translation**: Proves existence of a utility-preserving deferred strategy \( \sigma_{\text{defer}} \) but does not specify how to build it. Intact.  

  #### Features Carrying Over Under Distortion  
  1. **Perfect Information**:  
     - **Combinatorial Setting**: Players see the entire game state.  
     - **AI Claim Translation**: The agent fully observes resources and moves, but this is distorted by uncertainty in real-world "projects" (e.g., exogenous events may change outcomes). The translation assumes a deterministic environment, while real-world AI must handle stochasticity.  

  2. **Determinate Terminal Conditions**:  
     - **Combinatorial Setting**: Games end with clear win/loss/draw outcomes.  
     - **AI Claim Translation**: Utility \( u \) is well-defined but distorted by scale: Combinatorial games have discrete outcomes, while AI projects have continuous, multi-dimensional "value." The binary win/loss is replaced by utility comparisons.  

  #### Features with No Counterpart  
  1. **Adversarial Opponent**:  
     - **Combinatorial Setting**: Strategy-stealing requires symmetry between players (e.g., Player 1 steals Player 2’s strategy).  
     - **AI Claim Translation**: No adversarial opponent exists. The environment is passive, so "stealing" has no counterpart. The limitation lies in the claim itself—it describes a single-agent problem, not a two-player contest.  

  2. **Symmetric Starting Conditions**:  
     - **Combinatorial Setting**: Stealing relies on initial symmetry (e.g., both players have identical move options at the start).  
     - **AI Claim Translation**: The agent’s "starting" state changes after deferral (resources grow), breaking symmetry. No equivalent, as the claim assumes asymmetric time/resource progression.  

  3. **Contradiction Argument**:  
     - **Combinatorial Setting**: Proof by contradiction (e.g., assume Player 1 loses, then steal Player 2’s strategy to force a contradiction).  
     - **AI Claim Translation**: No contradiction is used; it directly argues for \( u_{\text{defer}} \geq u_{\text{now}} \). The limitation is in the claim’s structure—it is a direct monotonicity inference, not a reductio ad absurdum.  

  #### Does the Borrowed Claim Inherit the Original Argument’s Force?  
  **Only the name, not the force.**  
  - **Why?** The combinatorial strategy-stealing argument is a rigorous *theorem* in finite games: It proves inevitability (e.g., "Player 1 cannot lose if the game is symmetric"). Its force comes from adversarial symmetry and determinism.  
  - **In the AI Claim**:  
    - The argument is not a theorem but a *contingent assumption* about the world. It depends on added premises (e.g., resource accumulation, no time discounting) that may not hold.  
    - Real-world violations break the analogy:  
      - Projects may be time-sensitive (e.g., deferring climate action raises costs).  
      - Resources may not be fungible (e.g., skilled labor cannot be stockpiled).  
      - Opponents may exist (e.g., competitive markets punish delay).  
    - The combinatorial argument’s force relies on adversarial symmetry and discrete outcomes; here, the absence of an opponent and continuous utility weaken it to a heuristic.  

  **Limitation Diagnosis**: The failure is in the *clarity of the claim being translated*. The AI claim is underspecified: It ignores stochasticity, competition, and time sensitivity, which combinatorial game theory explicitly excludes. The game-theoretic framework *can* model these (e.g., adding adversarial players or discounting), but the original claim assumes them away. Thus, the translation exposes that the "strategy-stealing assumption" in AI is not a robust proof but a bold simplification of reality—one that inherits the name’s intuition but not its mathematical inevitability.  

  ---  
  **Final Translation Verdict**:  
  The AI claim maps cleanly onto a one-player monotonic game with resource accumulation, but it omits critical real-world complexities. The residue shows that while monotonicity and existence proofs carry over, the core adversarial engine of combinatorial strategy-stealing does not. Use this assumption with caution: It is a useful metaphor for patient resource allocation, but it lacks the unassailable logical force of its namesake.
