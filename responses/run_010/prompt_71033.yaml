  We are translating the "strategy-stealing assumption" from advanced AI/long-term future discourse into the vocabulary of combinatorial game theory (positional games). The original claim in the AI context: "a sufficiently capable agent loses nothing by deferring particular value-driven projects, because resources are fungible and whatever could have been done sooner can also be done later, with more of them."

  We are to restate this claim using terms like players, move sets, monotonicity of additional moves, perfect information, determinate terminal conditions, existence proofs vs. constructions.

  Then, we analyze which features of the combinatorial strategy-stealing argument carry over, which are distorted, and which have no counterpart. Finally, we assess whether the borrowed claim inherits any of the original argument's force.

