prompt: |-
  I am in the middle of drafting the framing chapter of a monograph on group agency, and a seminar I taught last term convinced me that the chapter's real difficulty is not which theory of shared intention to endorse but what one is entitled to demand of a theory of it in the first place. So I would like the specification written out before I commit to any candidate. Please give me the desiderata that an adequate theory of joint or shared intentional action must satisfy, each paired with the case or consideration that motivates it, and each marked as either non-negotiable or a preference belonging to one camp, with your reason for the marking. The purpose is fixed, because I suspect the list is sensitive to it: the theory must be good enough to do two downstream jobs. It must underwrite the attribution of intentions to organized bodies — a faculty committee, a corporate board, a treaty negotiator speaking for a delegation — in contexts where the attribution carries legal or quasi-legal weight. And it must state what a human-machine team would have to add to well-coordinated behaviour before we could say the two of them act together at all. Any putative requirement that bears on neither job should be flagged as optional, and any item that is really two requirements wearing one name should be split.

  I should tell you where my own suspicions lie, so that you can test them rather than flatter them. Several things routinely presented as requirements strike me as the signature commitments of particular programmes rather than neutral constraints: the insistence that the account be modest, in the sense of being confined to small-scale cooperation among parties who stand in no asymmetric authority relations; the insistence that shared intention reduce without remainder to interlocking individual planning states; the demand that the theory capture whatever participants report as the distinctively joint character of the experience of acting together; and the demand that it be continuous with what developmental and comparative work shows about shared goals in infants and other primates. Against these, the requirements I take to be genuinely load-bearing are: that the theory explain how a body's action can fail to be readable off any aggregation of the members' own attitudes, as when a committee reaches a verdict that each member, asked individually, would disavow; that it handle cases in which participants describe the very same joint activity under incompatible descriptions, so that they are and are not intending the same thing; that it neither cheapen shared intention to the point where queues, crowds and mobs qualify nor tighten it to the point where two neighbours who silently and simultaneously clear a shared driveway after a snowstorm fail to qualify; that it say what happens to the joint commitment as members leave and are replaced; and that it be conservative, in the sense that it may not quietly revise its account of what an individual intention is in order to make the shared case come out right. Please also address two cases of my own construction. First, two researchers on different continents produce a joint paper coordinated entirely through asynchronous edits to one manuscript, never communicating in real time: does any theory on your list license the claim that they wrote it together intentionally, and if so on what grounds? Second, three people plan an undertaking that one of them knows a fourth is joining under a false impression of what is being planned: what has to be true for the first three, and what for the fourth?

  The part I most want is the analysis of joint satisfiability, and I would rather have an honest negative result than a harmonious list. My hunch is that three demands cannot all be met at once: full reducibility to individual attitudes; an account of the standing participants have to rebuke a partner who defects and of the entitlement each acquires to rely on the others' continuing participation; and an account of how an organized body can arrive at an intentional state that no member holds and that each would individually reject. If some such subset really is unsatisfiable, say which requirement should go and what explanatory work we forfeit by dropping it; if it is satisfiable after all, show me the model that satisfies it rather than asserting that one exists. Tell me, in addition, which single desideratum does the most to eliminate candidate theories. Then, briefly and without ceremony, how the principal contenders fare against the finished list — the planning-theoretic account, the plural-subject account, the account that locates collective intentional states wholly in the heads of the individual participants, the account that treats the group perspective as primitive, and the group-agent account. A table is welcome for that scoring section, and it may be short. No bibliography, no page references, and please do not invent them; name positions and arguments freely and I will supply the citations myself.
reasoning: |-
  Hmm, this user is drafting a monograph on group agency and needs a rigorous set of desiderata for theories of shared intention. They're explicitly rejecting common philosophical biases and focusing on two specific applications: attributing intentions to organized bodies (like committees) and defining human-machine collaboration. Their skepticism about reducibility, phenomenology, and continuity with primate behavior resonates with my own view that these are often smuggling in partisan commitments rather than neutral requirements.

  The core challenge they pose is fascinating—whether we can simultaneously satisfy reducibility to individual attitudes, normative standing for rebuke/reliance, and emergent group attitudes that contradict individual members' views. I suspect this triad is incompatible. If we insist on full reducibility, we either lose the normative glue (making rebukes unjustified) or deny the reality of emergent group attitudes (reducing committees to mere aggregations). The user's committee example where no member individually endorses the verdict is the knife here. 

  For their constructed cases: the asynchronous co-authors likely fail to qualify as sharing intention on most accounts—lack of mutual responsiveness and commitment sinks it, though planning theorists might stretch to cover it. The deceptive fourth member scenario exposes fault lines in commitment theories; the fourth can't share the intention if deceived about core aspects, while the first three's shared intention depends on their mutual awareness excluding him.

  The most eliminative desideratum is clearly #3 (non-aggregativity)—it immediately rules out individualistic accounts like Bratman's planning theory when pushed to its limits. 

  Now structuring the output: first list the 10 desiderata with their status (non-negotiable/optional), motivational cases, and relevance to their two purposes. Then confront the joint satisfiability trilemma head-on, arguing that reducibility must yield to preserve normative force and emergent attitudes. Finally, scorecard the five theories against the desiderata—plural subject and group-agent accounts will handle non-aggregativity best but struggle with conservatism, while planning theory excels at dynamic membership but collapses under #3. 

  The user's intellectual honesty demands I flag where even their preferred desiderata might conflict—e.g., conservatism (#10) could hinder explaining emergent attitudes if individual intention is fundamentally different from group intention. No theory will ace all; the trade-offs must be explicit.
answer: |-
  Here is a rigorously structured set of desiderata for a theory of shared intentional action, tailored to your downstream purposes (legal/quasi-legal attribution to organized bodies & defining human-machine team agency). Each item specifies its status (non-negotiable/optional/camp-specific), the motivating case/consideration, and relevance to your purposes. Your suspicions about "signature commitments" are incorporated, and constructed cases are addressed.

  ---

  ### **Desiderata for a Theory of Shared Intentional Action**

  1.  **Non-Aggregativity**  
      *Status:* **Non-negotiable**  
      *Motivation:* A committee reaches a verdict (e.g., awarding a prize) that no individual member privately endorses or would defend individually. The group's intentional state ("We intend to award X") is irreducible to any sum or pattern of individual attitudes.  
      *Relevance to Purposes:* Essential for legal attribution to organized bodies (e.g., corporate boards) whose actions/responsibilities transcend individual members' views. Crucial for distinguishing genuine group agency from mere coordinated behavior in human-machine teams.

  2.  **Normative Structure (Rebuke & Reliance)**  
      *Status:* **Non-negotiable**  
      *Motivation:* Participants in painting a house together have a standing to rebuke a co-participant who abandons the task without agreement, and each reasonably relies on others' continued participation. This differs from parallel individual actions (e.g., two strangers painting adjacent walls).  
      *Relevance to Purposes:* Foundational for legal/quasi-legal contexts (enforces commitments, underpins liability). Defines the "team" aspect of human-machine interaction beyond coordination (mutual obligations and expectations).

  3.  **Dynamic Membership & Persistence**  
      *Status:* **Non-negotiable**  
      *Motivation:* A faculty committee continues its work as members rotate (retirements, sabbaticals). The shared intention ("We are revising the curriculum") persists despite changes in individuals.  
      *Relevance to Purposes:* Vital for legal attribution to enduring organizations. Required for scalable human-machine teams where agents/roles may change.

  4.  **Moderate Demarcation (Not Too Weak, Not Too Strong)**  
      *Status:* **Non-negotiable**  
      *Motivation:* Must exclude accidental coordination (e.g., strangers forming a queue; a mob converging on a target without shared plan), but include minimal cooperation (e.g., neighbors silently clearing a shared driveway after a snowstorm, mutually responsive to each other's shoveling).  
      *Relevance to Purposes:* Ensures legal attribution is reserved for genuine collective agency, not mere aggregates. Sets the threshold for "acting together" in human-machine teams.

  5.  **Descriptive Opacity**  
      *Status:* **Non-negotiable**  
      *Motivation:* Two co-conspirators plant a bomb: one intends "to protest government policy," the other intends "to protect national security." They act together intentionally ("We plant this bomb") under divergent, incompatible descriptions of the act.  
      *Relevance to Purposes:* Critical for legal contexts where participants' subjective reasons differ but joint responsibility holds. Tests if a human-machine team shares an intention despite potential mismatches in internal representations.

  6.  **Conservatism about Individual Intention**  
      *Status:* **Non-negotiable**  
      *Motivation:* The theory cannot redefine individual intention (e.g., weakening its cognitive or normative features) solely to make shared intention easier to analyze. What an individual intends must remain coherent independently.  
      *Relevance to Purposes:* Maintains conceptual coherence; avoids ad hoc solutions that undermine general action theory, vital for robust legal and team agency models.

  7.  **Compatibility with Asymmetry & Hierarchy**  
      *Status:* **Non-negotiable**  
      *Motivation:* A treaty negotiator acts based on authority delegated by a delegation; a corporate board acts via formal roles. Shared intention must function in structured, asymmetric groups, not just small egalitarian ones.  
      *Relevance to Purposes:* Directly essential for legal attribution to formal organizations. Necessary for human-machine teams with command structures.

  8.  **Communication-Independence (Optional)**  
      *Status:* *Optional* (Bears on neither core purpose directly)  
      *Motivation:* Can shared intention arise without explicit communication? (e.g., longstanding partners habitually acting together). While relevant to minimal cases like the driveway, legal/hierarchical contexts usually involve communication.  
      *Relevance to Purposes:* Not critical for organized bodies or typical human-machine teams (which involve communication protocols).

  9.  **Phenomenology of Jointness (Camp-Specific)**  
      *Status:* *Preference* (Phenomenological/Experiential Camp)  
      *Motivation:* Participants often report a distinctive "we-mode" experience of acting together. Some theories prioritize capturing this.  
      *Relevance to Purposes:* Not essential for legal attribution (focus is on observable commitments/actions) or defining machine team agency (machines lack phenomenology).

  10. **Developmental/Comparative Continuity (Camp-Specific)**  
      *Status:* *Preference* (Naturalistic/Reductive Camp)  
      *Motivation:* Should the account be continuous with shared goals in infants, primates, or simple cooperation?  
      *Relevance to Purposes:* Irrelevant to legal attribution of organized bodies or sophisticated human-machine teams.

  ---

  ### **Analysis of Joint Satisfiability & Your Cases**

  1.  **The Trilemma:** Your suspicion is correct. **Full reducibility to individual attitudes, robust normative structure (rebuke/reliance), and non-aggregativity (emergent group attitudes) are jointly unsatisfiable.**
      *   *Why:* Full reducibility requires the group's intention and its normative force to be fully constituted by individual mental states (e.g., Bratman's interlocking intentions). Non-aggregativity requires group attitudes that are *not* constituted by (and may contradict) individual attitudes. Robust normative structure requires obligations/entitlements that bind individuals *because* of the joint commitment – obligations not derivable from individual intentions alone.
      *   *What Must Yield:* **Reducibility must be abandoned.** Non-aggregativity is non-negotiable for your purposes (organized bodies). Normative structure is non-negotiable (legal weight, team agency). Explanatory work forfeited by dropping reducibility: the ability to explain shared agency *solely* in terms of individual psychology and action. This necessitates recognizing irreducible group-level commitments or perspectives.
      *   *Resulting Model:* A model accepting **non-reducible group commitments** (e.g., Gilbert's joint commitment, Tuomela's group ethos, List & Pettit's group agent) can satisfy normative structure and non-aggregativity. The group's intention and its normative force stem from the commitment *itself*, which creates obligations and enables attitudes that transcend (and may conflict with) individual views.

  2.  **Most Eliminative Desideratum:** **#3 (Non-Aggregativity).** It immediately rules out strong individualistic/reductive accounts (e.g., Bratman, Searle-in-parts) when applied to organized bodies like committees with emergent decisions.

  3.  **Your Cases:**
      *   **Case 1 (Asynchronous Co-Authors):** Likely **fails** to qualify as shared intentional action on most adequate theories.
          *   *Grounds:* Absence of mutual responsiveness, mutual obligation, and shared awareness in real-time. While coordination occurs, the lack of a dynamic joint commitment process (e.g., inability to rebuke for non-participation without communication, no mutual reliance baked into the *mode* of acting) suggests parallel individual actions on a shared object, not genuine joint action. Planning theory *might* stretch to cover it if strong mutual obligations are inferred from the editing pattern, but this is strained.
      *   **Case 2 (Deceptive Fourth Member):**
          *   **First Three:** They can share the intention ("We intend to do X") only if they mutually believe/know they are jointly committed to X *among themselves*, and are aware the fourth is deceived. Their shared intention requires mutual awareness *of each other's participation and commitment to X*.
          *   **Fourth Member:** They **cannot** genuinely share the intention with the first three regarding X. They might *believe* they share an intention to do Y (the deceptive description), or intend to participate in what they *think* is X, but they lack the required cognitive and normative link to the actual joint commitment of the first three regarding X. They are an unwitting tool, not a participant in the shared intention "We intend to do X."

  ---

  ### **Theory Scoring (Brief & Tabular)**

  | Theory                           | 1: Non-Agg | 2: Normative | 3: Dynamic | 4: Moderate | 5: Opacity | 6: Conserv | 7: Hierarchy | Overall Fit (Your Purposes) |
  | :------------------------------- | :--------- | :----------- | :--------- | :---------- | :--------- | :--------- | :----------- | :-------------------------- |
  | **Planning (Bratman)**           | ✗ (Weak)   | △ (Limited)  | **✓**      | △ (Too Weak)| **✓**      | **✓**      | ✗            | **Poor** (Fails #1, #7)     |
  | **Plural Subject (Gilbert)**     | **✓**      | **✓**        | △ (Issues) | **✓**       | **✓**      | **✓**      | △ (Strained) | **Good** (Strong #1, #2)    |
  | **Individualistic (Searle)**     | ✗          | ✗            | ✗          | △           | ?          | **✓**      | ✗            | **Poor** (Fails #1, #2, #3) |
  | **Primitive Group (Schweikard)** | **✓**      | **✓**        | **✓**      | **✓**       | **✓**      | ? (Risk)   | **✓**        | **Strong**                  |
  | **Group Agent (List & Pettit)**  | **✓**      | **✓**        | **✓**      | **✓** (Org)| **✓**      | **✓**      | **✓**        | **Strong**                  |

  **Key:**  
  **✓** = Satisfies Well, △ = Partially Satisfies/Ambiguous, ✗ = Fails  
  *Notes:*  
  *   **Bratman:** Struggles severely with #1 (emergent attitudes), #7 (hierarchy); normative force (#2) is derived and weaker than in commitment accounts.
  *   **Gilbert:** Excels at #1, #2, #4, #5, #6. #3 (persistence) can be handled but requires care. #7 is possible (joint commitments can form hierarchically) but less natural than for organized group agents.
  *   **Searle:** Fails core requirements (#1, #2, #3) for organized bodies; only fits very minimal cases.
  *   **Primitive Group (e.g., Schmid):** Scores well, but conservatism (#6) might be questioned if the "primitive we-intention" differs fundamentally from I-intentions.
  *   **Group Agent (L&P):** Explicitly designed for organized, structured groups (#1, #3, #7). Robust normative structure (#2) via group reasons/commitments. #4 is satisfied for organized bodies (queues excluded), minimal cases like driveway less central. Excellent fit for your purposes.

  ---

  **Conclusion:** For your framing chapter focused on organized bodies and human-machine *teams* (implying structure and normativity), **non-reducibility is the price of satisfying non-aggregativity and robust normativity.** Theories treating the group perspective as primitive or the group as an agent best meet the non-negotiable desiderata, particularly #1, #2, #3, and #7. The Group Agent account is the most direct fit. Your cases highlight the necessity of mutual commitment/awareness (failing the co-authors) and cognitive alignment (failing the deceived member).
