answer: |-
  Here's a move-by-move adjudication of the Ruth-Dave debate, followed by an overall verdict and identification of gaps:

  ### Move-by-Move Ratings
  1. **Ruth (Costless Veto Problem)**  
     *Rating: Mostly Right*  
     Justification: Correctly diagnoses the "nuisance objection" issue in public hearings, where trivial complaints carry equal weight. The link between monetization and revealed preference is logically sound. However, overstates that cash *only* benefits "real victims" (ignores non-monetary harms).

  2. **Dave (Wealth Disparity & Laundering)**  
     *Rating: Clearly Right*  
     Justification: Exposes fatal flaws: the system *would* amplify neighborhood inequality (rich areas block development, poor areas get overdeveloped) and the rent fund *is* a short-term palliative for long-term displacement. The "laundering" critique is particularly incisive.

  3. **Ruth (Free Endowment / No One Worse Off)**  
     *Rating: Mostly Wrong*  
     Justification: **Crucially swaps the baseline.** The status quo isn't "nothing" – it's the political right to a hearing (as Dave notes in (4)). By framing tokens as a "free endowment," Ruth ignores that neighbors *lose* their non-monetary political voice. Her claim collapses once (4) and (6) establish that hearings confer non-fungible rights (e.g., to contest non-monetizable harms) and collective power.

  4. **Dave (Coordination Trap)**  
     *Rating: Clearly Right*  
     Justification: Masterfully identifies a game-theoretic failure: individual sales are rational but collectively catastrophic (like a reverse tragedy of the commons). The "flood insurance" analogy is apt. This isn't just a parameter flaw – it reveals an inherent instability in atomized markets for collective goods.

  5. **Ruth (Design Fixes)**  
     *Rating: Mostly Wrong*  
     Justification: Superficially addresses (4) but ignores deeper issues. Trusts/supermajorities *do* rebuild hearings bureaucratically (as Dave counters in (6)), losing the "market discipline" she champions. She treats coordination as a technical glitch, not a systemic feature of political goods.

  6. **Dave (Rebuilding Hearings / Non-Priced Harms)**  
     *Rating: Mostly Right*  
     Justification: Correct that Ruth’s "fixes" recreate hearings with less transparency and more legal complexity. The assisted-living example is devastating: some harms (permanent shadow) are categorical, not monetizable. However, understates how hearings also fail vulnerable groups.

  7. **Ruth (Pricing Disciplines Pretext)**  
     *Rating: A Wash*  
     Justification: Valid point that hearings privilege the loud/organized (often homeowners), and pricing *could* expose frivolous NIMBYism. But Dave’s (8) offers a superior alternative (targeted sunlight + code enforcement). Overstates pricing's ability to distinguish "genuine" harm when values are incommensurable.

  8. **Dave (Entitlement & Political Persuasion)**  
     *Rating: Clearly Right*  
     Justification: Wins the philosophical high ground: the token system *presumes* neighbors hold a "veto right" to sell, reframing development as a private buyout rather than a public deliberation. The core conflict is over who "owns" the entitlement – and Dave rightly argues it belongs to the polity.

  ### (5)-(6) Exchange Specifics
  Dave’s coordination trap (**4**) is a **refutation**, not a parameter flaw. It reveals an inherent contradiction: token value depends on collective action (holding power), but the market encourages individual defection. Ruth’s fixes in (**5**) try to salvage it with coercion (trusts/supermajorities), which abandons the voluntary market logic she championed. Dave’s rebuttal in (**6**) shows these fixes either recreate hearings (without their legitimacy) or create new problems (valuation fights). **Ruth does not get to bank this as a win** – the "fix" negates her original premise.

  ### Overall Verdict
  **Dave comes out ahead decisively.** He wins on:  
  - Systemic consequences (wealth disparity, coordination traps).  
  - Foundational legitimacy (who owns the entitlement?).  
  - Non-monetizable harms (assisted-living shadow).  
  Ruth’s strongest points (costless vetoes, pretext) are partially valid but addressed by Dave’s better alternatives (targeted sunlight, code enforcement). Her proposal collapses under its internal contradictions when scrutinized.

  ### What Both Miss
  1. **Developer Power & Rent-Seeking:** Both assume developers are passive buyers. In reality, they could manipulate token markets (e.g., strategic delays, targeting vulnerable sellers) or capture the "rent assistance fund." The scheme might incentivize *more* developer-host community extortion.  
  2. **Scale & Externalities:** Focusing solely on ¼-mile households ignores citywide housing shortages/displacement. A luxury mid-rise might "buy off" locals but exacerbate regional affordability – a collective action problem *worse* than the coordination trap.  
  3. **Dynamic Effects:** Neither considers how the system alters neighborhood composition over time. E.g., if tokens make blocking development harder in poor areas, it accelerates gentrification – undermining Ruth’s renter-compensation goal.  
  4. **Alternatives Beyond Hearings:** Better models exist (e.g., citizen juries, participatory budgeting, impact fees tied to concrete infrastructure). The debate falsely dichotomizes "hearings vs. tokens."

  ### Final Note
  The core tension is **efficiency vs. legitimacy**. Ruth seeks Pareto efficiency ("no one worse off"), but Dave defends political equality and non-commodification. In urban planning, where harms are unevenly distributed and values plural, Dave’s caution prevails. Ruth’s market logic works only if all objections are reducible to cash – and they aren’t.
