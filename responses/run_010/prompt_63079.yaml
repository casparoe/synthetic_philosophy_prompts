  7. Ruth's last stand about pricing disciplining pretext has merit - public hearings do favor the loud and organized. But Dave already offered sunlight as alternative in point 8. Mostly wash.

  8. Dave's philosophical knockout punch - the scheme wrongly assumes neighbors own development rights - lands cleanly. The entitlement argument seems clearly right.

  Overall Dave wins on points - his systemic critiques hold better than Ruth's technical defenses. Both miss deeper issues: Ruth ignores how markets can't capture all values, Dave underestimates how hearings privilege certain voices. There's also no discussion of scale (why quarter-mile radius?) or developer incentives.

