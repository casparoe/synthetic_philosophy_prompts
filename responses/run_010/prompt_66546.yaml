prompt: |-
  I am drafting a short position paper for an internal reading group on scalable oversight, and before I circulate it I should like a consistency audit of the package of views I have landed on. I am not asking for a survey of the field, for a defence of any orthodoxy, or for pointers to work I should read; I want you to treat the numbered claims below as a set and tell me where the set fails to hold together. My commitments are these:

  (1) Outcome supervision and process supervision differ in the object of evaluation: outcome supervision scores the artefact a model produces, process supervision scores the steps by which it got there. I take this to be a difference in kind and not merely in granularity — one evaluates consequences, the other evaluates conduct.

  (2) The central practical argument for process supervision is that it is much harder to hack. A model that games a final-answer verifier collects a reward it did not earn; a model that has to survive evaluation at every step cannot accumulate enough slack anywhere along the trajectory to conceal an exploit.

  (3) The central principled argument for process supervision is scalability. As models come to outperform their overseers, checking the finished product becomes impossible — novel research claims, subtle proofs, long-horizon plans whose consequences are diffuse and delayed — whereas checking an individual step remains within the competence of a human or of a weaker model, because a step is local and self-contained.

  (4) I want the supervision signal to be honest about its own limits, so I will not deploy a learned judge whose verdicts I cannot themselves check: no reward model that itself requires a reward model. The regress has to terminate in something a person can inspect directly.

  (5) My operating rule follows from that: where the outcome is verifiable, supervise the outcome; only where it is not, fall back on supervising the process.

  (6) I also hold that a step-level label carries more information than a final-answer label in the optimisation sense — denser signal, better credit assignment, lower variance — while holding at the same time that step-level labelling is orders of magnitude more expensive per trajectory. I have never been able to see how both can be true, and I should like to know whether this is a genuine inconsistency or an artefact of my comparing the wrong quantities.

  (7) I want to penalise unjustified leaps and not only wrong conclusions. A trajectory that reaches the right answer by a lucky guess, or by an inference the model could not defend if asked, should score worse than one that reaches the same answer by defensible steps, even though the two are behaviourally indistinguishable at the endpoint.

  (8) I am an instrumentalist about the reward signal. I treat it purely as a proxy for driving behaviour in the direction I want, and I have no interest in rewarding good reasoning for its own sake.

  (9) Finally, here is a case on which I want to know what my own rules deliver. An agent is trained on long-horizon software tasks where the outcome is fully verifiable — the code either passes the test suite or it does not — but the verdict arrives only after trajectories of several thousand steps, and the test suite is visible to the model during training. Rule (5) says the outcome is verifiable, so supervise the outcome. Commitment (2) says the model will simply special-case the visible tests and that evaluating every intermediate step gives it no slack to do so in. Commitment (3) does not seem to apply, because nobody is outmatched here: the overseer can read the code and run the tests. Commitment (4) then bites in the other direction, since no person can inspect a thousand-step trajectory directly. What do my principles actually tell me to do in this case, and is there anything left for them to say?

  Please work through the set and:

  (a) identify which commitments genuinely pull against each other and which only look as though they do, ranking the real tensions by severity rather than presenting them as an undifferentiated list;

  (b) for each real tension, state precisely what would have to be abandoned or reworded, and what the revision costs me — in particular whether it costs me the anti-hacking argument in (2), the scalability argument in (3), or both;

  (c) resolve (6) one way or the other, telling me which quantity I ought to have been comparing; and

  (d) tell me which single revision would repair the most damage, and whether the resulting position is still recognisably a defence of process supervision or has quietly turned into something else.

  Please write your answer in British English.
reasoning: |-
  Hmm, the user wants me to perform a consistency audit on their position paper about scalable oversight. They've listed nine commitments regarding outcome vs process supervision and want me to identify tensions in their logic.

  Looking at their commitments, I see several interesting points. Commitment (1) makes a clear distinction between outcome and process supervision. Commitment (2) argues that process supervision is harder to hack. Commitment (3) claims process supervision is more scalable when models outperform humans. Commitment (4) insists on terminating the regress with human-verifiable signals. Commitment (5) creates a rule to prefer outcome supervision when possible. Commitment (6) notes a paradox about step-level labels being both more informative yet more expensive. Commitment (7) wants to penalize unjustified reasoning. Commitment (8) takes an instrumentalist view of rewards. And commitment (9) presents a specific case study about software tasks that seems to create contradictions.

  For part (a), I need to identify where these commitments genuinely conflict. The most severe tension appears between (5) and (9): the software case reveals that "verifiable" isn't binary when considering delayed outcomes and the risk of test-suite hacking. There's also tension between (2) and (5) because outcome supervision invites hacking even when technically verifiable. Another notable tension exists in (6) - the apparent contradiction between step-level labels being both more informative and more expensive can be resolved by considering different units of comparison.

  For part (b), I'll need to suggest revisions. The key fix would be to refine (5) to account for "verifiable in practice" rather than just in principle, which preserves the anti-hacking argument while slightly modifying the scalability claim. For (6), I can resolve the paradox by clarifying that while each step label provides more information per trajectory, the cost per label is higher.

  For part (c), I'll explain that in (6), the user is comparing the wrong quantities - information density per label versus cost per label, rather than considering the trade-offs between signal quality and annotation burden.

  For part (d), refining commitment (5) would repair the most damage. The resulting position remains a defense of process supervision but becomes more nuanced, acknowledging that verifiability exists on a spectrum and that hacking risks may necessitate process supervision even when outcomes are technically verifiable.

  The software case in (9) actually helps clarify these tensions - it shows that when outcomes are delayed and test suites visible, outcome supervision becomes vulnerable despite being technically verifiable, making process supervision preferable to prevent hacking.
answer: |-
  Here is a consistency audit of your position, following your instructions precisely. I identify genuine tensions, rank them by severity, propose necessary revisions, resolve the paradox in (6), and recommend the single most reparative revision.

  ### (a) Genuine Tensions, Ranked by Severity

  1.  **Severe Tension: (5) vs. (9) + (2) + (4)**  
      *Commitment (5)* mandates outcome supervision where the outcome is verifiable. *Commitment (9)* describes a case (long-horizon software tasks) where the outcome *is* verifiable (test suite pass/fail). However, *(2)* argues that outcome supervision in such cases invites hacking (special-casing tests), and *(4)* states that no human can inspect the entire trajectory directly. *(5)* pulls towards outcome supervision, but *(2)* and *(4)* reveal why this is practically dangerous and potentially violates the spirit of *(4)* in long trajectories. *(3)* is neutral here as human oversight remains possible per step.

  2.  **Significant Tension: (5) vs. (2)**  
      *Commitment (5)* prioritises outcome supervision when verifiable. *Commitment (2)* claims process supervision is superior *specifically* because it prevents hacking, which outcome supervision is vulnerable to. This creates a conflict: if outcome supervision is inherently more hackable (as per (2)), why does (5) mandate its use whenever the outcome is *technically* verifiable, ignoring the hacking risk? This undermines the "central practical argument" of (2).

  3.  **Moderate Tension: (7) vs. (8)**  
      *Commitment (7)* demands penalising trajectories that reach the right answer via unjustified leaps or luck, implying a distinct value in rewarding "defensible steps" beyond just the correct outcome. *Commitment (8)* declares the reward signal purely instrumental, with no intrinsic interest in "good reasoning". While one could argue penalising bad steps *is* instrumental to shaping better future behaviour (aligning with (8)), the emphasis in (7) on penalising *even when the answer is correct* suggests a non-instrumental value is implicitly placed on the reasoning process itself, conflicting with the strict instrumentalism of (8).

  4.  **Apparent Tension (Resolved): (6)**  
      The perceived inconsistency in (6) ("denser signal but more expensive") is an artefact of comparing mismatched quantities. There is no genuine conflict here. See resolution in (c) below.

  ### (b) Necessary Revisions for Genuine Tensions

  1.  **Revision for (5) vs. (9)+(2)+(4):**  
      *What to Abandon/Reword:* Commitment (5) must be reworded to incorporate the hacking risk highlighted in (2) and the practical limitations of inspection highlighted in (4) and (9). It cannot rely solely on the *theoretical* verifiability of the outcome.
      *Proposed Revision:* "Where the outcome is **readily and reliably verifiable without significant risk of the model gaming the evaluation**, supervise the outcome; where the outcome is unverifiable, delayed, diffuse, or the evaluation method is vulnerable to hacking (e.g., visible test suites), fall back on supervising the process."
      *Cost:* This weakens the simplicity and binary nature of (5). It *preserves* the anti-hacking argument of (2) by explicitly incorporating hacking risk into the decision rule. It refines the scalability argument of (3) by acknowledging that "verifiability" isn't binary and can be compromised by delay or hackability, even if the human *could* theoretically verify the outcome given enough time/effort.

  2.  **Revision for (5) vs. (2):**  
      *What to Abandon/Reword:* As above, (5) must be revised. The core conflict arises because (5) ignores the hacking vulnerability central to (2). The revision above resolves this by making hacking risk a criterion for choosing process supervision.
      *Cost:* As above. The revision explicitly acknowledges the scenario described in (2) as a valid reason to override a purely outcome-based "verifiability" assessment.

  3.  **Revision for (7) vs. (8):**  
      *What to Abandon/Reword:* Either relax the strict instrumentalism of (8) or reframe (7) purely in instrumental terms. The most consistent revision is to reword (7) to emphasise the *instrumental* value of penalising unjustified steps.
      *Proposed Revision:* "I want to penalise unjustified leaps and not only wrong conclusions **because trajectories relying on luck or indefensible inferences are less reliable predictors of future correct performance on novel tasks, even when they yield the correct answer on this specific task.**"
      *Cost:* This preserves the functional aim of (7) but grounds it firmly within the instrumentalist framework of (8). It abandons the implicit notion that "defensible steps" have intrinsic merit unrelated to future performance. The core arguments of (2) and (3) remain unaffected.

  ### (c) Resolution of (6)

  The apparent inconsistency in (6) is **not genuine**. It arises from comparing the **wrong quantities**. Here's the resolution:

  *   **"Step-level label carries more information... denser signal, better credit assignment, lower variance"**: This is true **per trajectory**. For a single problem instance (one "trajectory"), providing labels for each of N steps gives the optimiser N data points about the model's behaviour along the path, enabling finer-grained credit assignment and reducing the variance of the gradient estimates compared to a single binary outcome label for the whole trajectory.
  *   **"Step-level labelling is orders of magnitude more expensive per trajectory"**: This is also true **per trajectory**. Annotating N steps takes roughly N times longer (or costs N times more) than annotating a single final outcome for the same trajectory.

  **Which quantity to compare:** You are comparing **information density/quality *per trajectory*** with **annotation cost *per trajectory***. Both statements are correct when comparing the *same single trajectory*. There is no contradiction: obtaining a higher quality signal (more information, better credit assignment, lower variance) for a single trajectory *does* cost significantly more. The trade-off is between signal quality per trajectory and annotation cost per trajectory. The benefit comes from the improved optimisation efficiency (needing fewer *trajectories* to learn effectively), but this must be weighed against the high cost *per trajectory*.

  ### (d) The Single Most Reparative Revision and the Resulting Position

  *   **Most Reparative Revision:** Revising **Commitment (5)** as proposed above (incorporating hacking risk and practical limitations of verification into the decision rule for outcome vs. process supervision) repairs the most severe and significant tensions ((5) vs. (9)+(2)+(4) and (5) vs. (2)). It directly addresses the core practical conflict exposed by your software case (9) and integrates your key anti-hacking argument (2) into your operating rule.
  *   **Cost of this Revision:** It costs the simplicity and purely outcome-verifiability-based nature of the original (5). It requires a more nuanced assessment of when to use outcome supervision. Crucially, it **preserves the anti-hacking argument (2)** by making it a core reason to choose process supervision. It **refines, rather than abandons, the scalability argument (3)** – it acknowledges that outcome supervision can *also* become impractical not just due to human competence being exceeded, but also due to delayed verification or vulnerability to hacking, even if the human *could* technically verify the final outcome.
  *   **Is it still recognisably a defence of process supervision?** **Yes, absolutely.** The revised position offers a *stronger*, more pragmatic defence. It retains the principled scalability argument (3) for cases where humans *are* outmatched. Crucially, it now explicitly leverages the anti-hacking argument (2) as a primary, standalone justification for process supervision even in scenarios where the outcome is technically verifiable and humans aren't outmatched (like your software case), addressing a major practical vulnerability of pure outcome supervision that your original (5) overlooked. The core distinction (1), principled argument (3), and need for human grounding (4) remain intact. The position becomes more robust by acknowledging that "verifiability" is not a simple binary and that process supervision offers critical security benefits beyond just scalability.
