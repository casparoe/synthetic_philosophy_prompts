answer: |-
  Here's the debate restructured in your operational vocabulary, followed by a residue report with a clear verdict:

  ### Core Positions Translated
  1.  **"The State is the Same Agent" (Continuity Argument):**
      *   **Litigation Frame:** Corporate Succession via *De Facto Merger* or *Mere Continuation*. Argues the present state is the legal successor to the prior regime under principles of governmental continuity. Liabilities (including moral/political ones) are assumed by operation of law absent formal dissolution/novation. The "corporate shell" (the state) persists; changes in management (government/ideology) don't sever liability for pre-existing obligations or wrongs. Statutes of limitations may be tolled due to continuous existence and ongoing effects (like fraudulent concealment of harm).
      *   **Mapping:** Clean. Standard successor liability doctrine applies directly.

  2.  **"Guilt Can Be Inherited" (Moral Successorship):**
      *   **Litigation Frame:** *Express or Implied Assumption of Liability* or *Ratification*. The successor state, by accepting the benefits of sovereignty (tax base, territory, legal authority established by the prior regime), implicitly assumes its burdens. Alternatively, by failing to formally repudiate the specific wrongful acts *and* continuing systemic structures derived from them (akin to benefiting from ill-gotten assets), the state ratifies the prior acts, making them its own for purposes of acknowledgment/responsibility. "Guilt" = liability for redress.
      *   **Mapping:** **Bent.** Assumption/Ratification are contractual/agency concepts. Applying them to *moral/political* liabilities derived from *unjust structures* is an analogy. While accepting benefits can trigger *equitable* obligations (constructive trust), "ratifying" a historical wrong isn't a precise legal act here. The core idea (benefit = burden) maps, but the "guilt" language is residue.

  3.  **"Apology Without Repair is Noise" (Substantive Justice Requirement):**
      *   **Litigation Frame:** An apology is merely an evidentiary *admission* or *statement against interest*. Without accompanying *restitution* (return of specific property), *disgorgement* (giving up unjustly obtained benefits/systemic advantages), or *specific performance* (institutional reform to dismantle discriminatory structures), the apology lacks consideration and fails to provide the "adequate remedy at law" required to discharge the underlying liability. It's a litigation tactic (like a Rule 68 offer) designed to minimize exposure without substantive commitment. Statutes keeping clinician apologies out of evidence highlight their potential non-probativeness as admissions of *legal* liability; here, the claim is they are *morally* vacuous without repair.
      *   **Mapping:** **Bent.** "Repair" maps to equitable remedies (restitution, disgorgement, injunction). The argument that apology *requires* these to be meaningful critiques its probative value *as satisfaction*. This leverages your understanding of apologies as non-probative/no-admission maneuvers but asserts a *moral* probative value they lack *legally*. The "noise" critique relies on a concept of remedy adequacy absent in pure liability admission rules.

  4.  **"Who Speaks for the Victims?" (Standing and Representation):**
      *   **Litigation Frame:** *Standing* and *Privity*. Only entities with a direct, concrete, particularized injury traceable to the specific historical wrong have standing to "accept" an apology or dictate repair terms. Identifying the proper class representatives involves complex issues of *privity* – are modern descendants in privity with the original victims? Does the injury persist through generations creating new, direct harm (e.g., ongoing systemic discrimination traceable to the original act)? Does a group claiming representative status have *actual authority* (via democratic mandate, recognized traditional structures) to bind the purported class? *Laches* may be asserted against claims deemed unreasonably delayed, but courts weigh heavily the state's role in causing the delay (e.g., suppression, denial).
      *   **Mapping:** **Clean.** Standing, privity, class representation, laches – these are direct translations of core litigation doctrines to the problem of identifying the proper claimants/recipients.

  ### Residue Report & Verdict

  1.  **Clean Map (Requires No Bending):**
      *   **State Continuity:** De Facto Merger/Mere Continuation (Successor Liability) fits perfectly.
      *   **Standing/Representation:** Privity, Standing, Class Certification, Laches – directly applicable doctrine.

  2.  **Bent Map (Analogy Required, Concepts Stretched):**
      *   **"Inheriting Guilt":** Framing this as *Assumption of Liability* or *Ratification* works *analogously* but stretches these beyond their contractual/agency origins. The core legal concept is *successor liability* for obligations/debts, not "guilt." The "ratification" of a *past wrong* (as opposed to a contract or act of an agent) is not a standard legal move. The *equitable* idea (benefiting from wrong creates obligation) is stronger than the ratification analogy.
      *   **"Apology Without Repair is Noise":** Mapping "repair" to *restitution*, *disgorgement*, *injunctive relief* is clean. The critique that apology *without* these is meaningless leverages your understanding of non-probative apologies but asserts a **moral adequacy standard** that has no precise counterpart in litigation *procedure*. Law cares if an admission is probative *legally*; this argument cares if it's probative *morally/politically*. The "noise" claim is fundamentally about **remedy adequacy**, a concept that exists in law (e.g., irreparable harm for injunctions) but is applied here to the *moral sufficiency* of an apology alone.

  3.  **No Expression / Pure Residue:**
      *   **The Nature of "Guilt" vs. "Liability":** Your framework deals with *legal* liability. The philosophical debate often centers on *moral* guilt/blameworthiness inhering in a collective entity over time. Law assigns liability based on rules; philosophy debates the *propriety and meaning* of assigning blame. **This is residue.** Your framework lacks a category for "collective moral guilt" because law doesn't traffic in it – it traffics in *remediable obligations*.
      *   **Apology as Moral Commitment vs. Legal Admission:** Your world rightly separates apology (often shielded) from legal admission. The philosophical debate assumes an apology, *to be authentic*, **is** a moral commitment implying an obligation to repair. **This core premise has no expression in your vocabulary.** Trying to map it as an "admission" fails because you know admissions can be engineered to be non-probative, while the philosophers insist a *real* apology inherently *is* probative (morally) of responsibility *and* the duty to make amends. This difference is irreconcilable within your terms.

  **The Fault & The Verdict:**

  *   **The philosophical disagreement is thinner than it sounds on continuity and procedure (who, when, how).** Successor liability, standing, privity, and laches map cleanly or with minor bending. The core *practical* questions (is the state the same entity? who gets to claim?) are well-handled by your framework.
  *   **The residue lies primarily in the nature of the obligation and the meaning of apology.** Your framework **lacks categories for collective moral guilt and for apology as a morally performative act** distinct from its legal evidentiary status. This isn't a flaw *in your framework*; it reflects law's focus on remediable duties rather than existential blame.
  *   **The "bent" maps highlight where philosophy smuggles in moral concepts under legal-sounding terms.** "Inheriting guilt" via "ratification" is mostly analogy. Demanding "repair" for an apology to be meaningful relies on a moral adequacy standard foreign to rules of evidence about admissions.
  *   **The core irreconcilable difference is the intrinsic link philosophers assert between authentic apology and obligation to repair.** In your world, apology and remedy are strategically separable. In theirs, a true apology *logically* entails repair. **This premise cannot be expressed within your vocabulary without redefining "apology" to mean something fundamentally different (i.e., a legal admission + commitment to remedy).**

  **Final Verdict:** Your legal framework translates the *structural* and *procedural* aspects of the debate effectively (continuity, standing). It bends but usefully analogizes the *benefit-burden* principle for inheriting obligations. However, it **cannot capture the core philosophical concepts of collective moral guilt or the inherent moral link between authentic apology and reparative obligation.** This residue isn't due to a missing category *needed for law*; it stems from philosophy operating in a distinct domain (morality) making claims law deliberately avoids (existential blame). The debate is substantive, but its deepest tensions vanish when forced into your rigorously procedural and remedial vocabulary.
