  Then the residue report, which is the part I actually care about: which of their moves map clean onto something I already do, which you had to bend to get to fit, and which have no expression in this vocabulary whatsoever. And tell me where the fault lies — is my framework missing a category it ought to have, or is the philosophical disagreement thinner than it sounds once you strip the words? If the only way to make something fit is to quietly redefine it, say that out loud rather than passing it off as translation. Commit to a verdict on the residue instead of telling me both frameworks have their merits.

