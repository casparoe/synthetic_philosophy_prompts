  Hello, dear souls! It’s Willow here, from the Birch Homestead. If you’ve been following along, you know that this past year has been a journey of deep surrender. From sourdough starters that rise (or don’t!) to woodstoves that warm (or... well, you know), I’ve learned to release the illusion of control. But recently, I’ve taken this to a whole new level—thanks to the wisdom of 11th-century Islamic occasionalism. Yes, you heard that right! And let me tell you, it’s been a game-changer for parenting, homesteading, and my Etsy shop (BirchBlessings, if you’re new here!).

  For those not familiar, occasionalism comes from the brilliant philosopher al-Ghazālī. He taught that nothing in this world actually causes anything else. That’s right—fire doesn’t burn cotton, knives don’t cut, bread doesn’t nourish, and the sun doesn’t rise (it’s actually the earth that’s moved, but even that movement isn’t caused by anything we’d call a “cause”!). Every single effect is created directly by God at the very moment it appears, on the occasion of what we mistakenly label a “cause.” It’s all God’s habit (ʿāda) that makes the world seem predictable. But He could break that habit at any moment (that’s a miracle, or khāriq al-ʿāda!). Knowing this has set me free.

  So how does this play out on the homestead? Well, let’s take yesterday. I was making elderberry syrup (recipe in my surrender circle—only $9.99/month, and we’re starting a new module on “Kitchen Surrender”!). As I set the kettle on the stove, I reminded myself: this flame isn’t heating the water. God is creating the heat in the water at the occasion of the flame. And when I latched the goat gate? God is creating the containment of the goats on the occasion of the latch. It’s all about letting go of the idea that I, or anything else, has power. I’m telling you, it’s liberation!

  Now, I know what you’re thinking: “But Willow, if nothing causes anything, why do you still latch the gate?” Oh, sweet friend, because God’s habit is reliable! He’s promised to keep the world running in a predictable way (most of the time). But here’s the key: I don’t believe the latch has any necessary power. I do it as an act of surrender, trusting that God will create the effect. It’s like a dance of trust!

  Someone in my surrender circle asked: “Does this change what you expect to happen?” I thought long and hard. Honestly? No. I still expect the goats to stay in if the gate is latched. But that’s because I trust God’s habit! The difference is in my heart: I’m not attached to the idea that the latch does it. I’m free!

  But let’s get real. I’ve been feeling called to go deeper. So I’m announcing a 30-day “occasion fast”! Starting tomorrow, our household will stop doing anything that presupposes a cause. No locks on the doors (why lock when the lock doesn’t keep anyone out? It’s God who creates safety or not!). No firebreak around the woodpile (the fire doesn’t spread, God creates each spark’s effect!). No sunscreen (UV rays don’t cause burns, God creates the burn—or not—on the occasion of sun exposure!). And no timer on the stove (because the timer doesn’t turn off the burner, God does!). We’re surrendering to the occasion, trusting God’s habit to hold (or not—but it will, because it’s His habit!). I’ll be documenting it all in real-time in the surrender circle. Join me?

  In love and surrender,
  Willow

  Update Post (three weeks later):

  Title: Occasion Fast Update: The Fire That Didn’t (and Other Miracles)

  Well, souls, we’re three weeks into the occasion fast, and it’s been... illuminating! First, the goats got out. Not because the gate was unlatched (remember, the latch doesn’t contain them!), but because God chose not to create their containment on that occasion. Surrender! Then, the woodpile... well, we had a small incident. A spark landed on the dry grass, and God created a fire. But it was a miracle (khāriq al-ʿāda!) that the wind shifted and it didn’t reach the barn! Also, little Juniper got a sunburn after a day without sunscreen (God created that burn, not the sun!), but it healed quickly—another sign of grace. And the stew? I forgot the timer, and God created it to be a bit charred, but we ate it with gratitude. 

  Friends, this fast is testing our surrender. It’s easy to trust when things go smoothly. But when they don’t? That’s where real faith grows. I’ve had to double down on my Etsy shop (BirchBlessings—new surrender-themed knitting patterns dropping soon!) to cover the extra... um... “opportunities for trust.” But every moment is a chance to remember: God is the only agent. We’re just along for the ride.

