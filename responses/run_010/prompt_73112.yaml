answer: |-
  Below is a translation of futarchy into the vocabulary of derivatives market structure and product governance, structured as requested. British English is used throughout, with gaps in the proposal explicitly noted. Additions beyond the proposal’s stated mechanics are marked as such.

  ---

  ### **1. Term Sheet: Conditional Policy Contract**  
  *Contract Specification for Futarchic Policy Instrument*  

  | **Field**                   | **Specification**                                                                                                                                 | **Notes**                                                                 |
  |-----------------------------|---------------------------------------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------|
  | **Underlying**              | National Wellbeing Metric (NWM)                                                                                                                   | Proposal does not specify composition or calculation.                     |
  | **Reference Data Source**   | [Blank]                                                                                                                                           | Proposal assumes metric exists but does not define its governance or source. |
  | **Notional**                | Not specified; likely standardised (e.g., 1 unit = 1 "wellbeing point")                                                                           | Proposal silent. Standardisation assumed for fungibility.                 |
  | **Payoff Formula**          | Cash-settled. Pays NWM value at resolution date if policy adopted; pays 0 if policy not adopted.                                                  | Direct translation of conditional structure.                              |
  | **Observation Window**      | [Blank]                                                                                                                                           | Proposal does not specify measurement period for NWM.                     |
  | **Resolution Date**         | Fixed date post-policy horizon (e.g., 5 years after adoption).                                                                                    | Horizon set democratically; exact date undefined.                         |
  | **Resolution Agent**        | Independent entity appointed to assess NWM.                                                                                                       | Proposal does not specify agent selection or oversight.                   |
  | **Governance Framework**    | [Blank]                                                                                                                                           | No mechanism for disputes, audits, or agent accountability defined.       |
  | **Issuer**                  | Sovereign entity (e.g., Treasury).                                                                                                                | Assumed; proposal does not specify credit support.                        |
  | **Credit Support**          | [Blank]                                                                                                                                           | No mention of collateral, guarantees, or default arrangements.            |
  | **Margin & Default Handling** | [Blank]                                                                                                                                         | Standard CCP protections absent; proposal assumes no counterparty risk.   |
  | **Eligible Participants**   | All citizens (via anonymised trading?); proposal suggests broad access but no specifics.                                                          | KYC/AML conflicts with anonymity; no position vetting defined.            |
  | **Position Limits**         | [Blank]                                                                                                                                           | Proposal ignores concentration risk (e.g., wealthy actors dominating).    |
  | **Manipulation Controls**   | [Blank]                                                                                                                                           | No surveillance for corners/squeezes on policies or NWM.                  |

  **Unresolved Risks**:  
  - **Non-Adoption Payout**: Contracts pay 0 if policy not chosen, creating binary winner-takes-all incentives.  
  - **Unobserved Counterfactual**: NWM under non-adopted policies never materialises; resolution agent’s valuation is hypothetical.  
  - **Liquidity**: No mechanism to ensure two-sided markets for low-probability policies.  

  ---

  ### **2. Clause-by-Clause Translation**  
  *(a) Prediction markets aggregate dispersed information better than deliberation/expert committees.*  
  → *"Prediction markets synthesise fragmented fundamental data more efficiently than advisory committees or public debate, as prices incorporate latent supply/demand imbalances reflecting asymmetric information."*  

  *(b) The conditional price estimates expected NWM under that policy.*  
  → *"The mid-price of the conditional contract approximates the risk-neutral expectation of the NWM’s terminal value, contingent on policy adoption."*  

  *(c) Values and beliefs are separable: vote on ends, bet on means.*  
  → *"Electoral politics defines the objective function (NWM), while price discovery quantifies the actuarial impact of policy levers."*  

  *(d) Adopting the highest-priced policy is legitimate collective choice.*  
  → *"Selecting the policy with the highest conditional forward price is procedurally equivalent to optimising expected social utility."*  

  ---

  ### **3. Residue Report**  

  | **Proposal’s Claim**                                | **Nearest Counterpart**                          | **Verdict**     | **Distortion/Gap**                                                                 |
  |-----------------------------------------------------|--------------------------------------------------|-----------------|------------------------------------------------------------------------------------|
  | "Price = expected value of NWM under policy"        | Risk-neutral expectation of terminal NWM         | **Distorted**   | Ignores risk premia, liquidity premia, and funding costs embedded in price.        |
  | "Markets aggregate information efficiently"         | Price discovery under symmetric information      | **Distorted**   | Assumes no manipulation; real markets feature spoofing, squeezes, and agency costs.|
  | "Values distinct from beliefs"                      | Separation of objective function and instrument  | **Clean**       | —                                                                                  |
  | "Hypothetical NWM valuation is credible"            | Counterfactual credit exposure modelling         | **No counterpart** | No governance for resolution agent’s subjective assessment of unobservable outcomes. |

  **Analysis of Distortions/Gaps**:  
  - **Risk Premia in Pricing**: The proposal treats price as pure expectation, but derivatives pricing includes volatility premia and funding spreads. This is a *limitation of the proposal’s determinism*: it assumes a frictionless market.  
  - **Unobserved Counterfactuals**: The resolution agent’s hypothetical NWM valuation lacks a market analogue. This is a *gap in the vocabulary*—no instrument resolves on non-occurring events without arbitration.  
  - **Manipulation Absence**: The proposal’s silence on controls assumes efficient markets. *Proposal is less determinate*—it overlooks endogenous abuse (e.g., burning capital to distort prices).  

  ---

  ### **4. Reverse Residue**  
  *What market structure reveals that futarchy overlooks*:  

  | **Insight from Derivatives Practice**                           | **Objection Type**          | **Cost of Absorption**                                                                 |
  |-----------------------------------------------------------------|-----------------------------|----------------------------------------------------------------------------------------|
  | **Traders ≠ Affected Parties**: Wealthy speculators dominate price discovery; their utility ≠ social welfare. | Genuine objection        | Proponents must accept oligarchic outcomes or restrict participation, undermining price efficiency. |
  | **Expressing Views vs. Moving Fixings**: When price *is* the decision rule, any trade becomes market manipulation. | Genuine objection        | Requires banning speculative positions (e.g., pure arbitrageurs), collapsing liquidity. |
  | **Governance of the Underlying**: NWM design (e.g., GDP vs. inequality-adjusted) is inherently political. | Genuine objection        | Admitting metric design is value-laden undermines "vote values, bet beliefs" separation. |
  | **Risk Transfer Failure**: Non-adopted policies create synthetic exposure without natural hedgers. | Plausibly absorbed       | Mandate market-makers, but this introduces moral hazard and fiscal backstops.           |

  ---

  ### **5. Verdict**  
  The core disagreement between futarchy and democracy **survives translation** but relocates decisively:  
  - **Price as Decision Rule**: The mechanism substitutes electoral/political deliberation with a market signal. This *is* substantively distinct.  
  - **However**, the critical work shifts to:  
    - **Term Sheet Gaps**: Who defines the NWM? Who audits the resolution agent? Unresolved political tensions re-emerge here.  
    - **Metric Design**: Choosing the NWM is an exercise of power, not technical calibration (e.g., weighting financial stability vs. climate risk).  
    - **Governance of Unobservables**: The resolution agent’s discretion over counterfactuals reintroduces expert bias.  

  **Conclusion**: The price signal’s role is **overstated** by proponents. It does not "objectively" optimise policy; it merely shifts political conflict to:  
  1. Specification fights over the NWM,  
  2. Liquidity subsidies for low-trade policies,  
  3. Resolution agent capture.  
  Futarchy replaces legislative bargaining with market infrastructure but cannot eliminate value judgments. The substantive difference lies in *who bears risk* (traders vs. voters) and *where opacity resides* (counterfactual modelling vs. legislative deals). Market efficiency gains are hypothetical; governance failures are concrete.  

  ---  
  **Direction of Travel**: Futarchy is best understood as a **contingent claims market on political outcomes** lacking foundational infrastructure. Its viability depends on solving unaddressed market design flaws—making it less a revolution and more a complex, vulnerable augmentation of democracy.
