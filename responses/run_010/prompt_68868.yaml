prompt: |-
  You're a collapse-studies person who's also done applied institutional work — someone who can hold Tainter's diminishing-returns-to-complexity argument, the Diamond-style five-factors framing, and the resilience/panarchy crowd in your head simultaneously and knows which parts of that literature actually convert into a usable test rather than just rhetoric. Please think carefully before answering, and start with a short brainstorm: where does the word "collapse" actually go wrong when a non-specialist committee uses it? Then give me the procedure.

  Situation: I just got handed the screening desk at a small societal-risk unit. We rate maybe a dozen cases a month and the word "collapse" in our output decides whether something goes to the underwriting committee for emergency treatment or gets filed as ordinary deterioration. Three weeks ago we published a briefing that used it about a regional capital, and two academics tore it apart publicly for confusing a government losing the ability to tax and staff services with a society dying. That's on me now to prevent. I get about twenty minutes per case, I have two analysts (one historian, one economist), and the committee wants a verdict plus a confidence level — they will not read an essay.

  So: a step-by-step procedure my two analysts can run without knowing the theory. Ordered questions, what counts as a sufficient answer to each, the rules for moving on, and where the procedure has to stop and hand the call to a human because it's a values question dressed up as a fact question. It has to make the analyst fix the unit of analysis first — polity, elite fiscal base, settlement pattern, resident population, language, ritual calendar, craft transmission — because those come apart constantly. It has to force the counterfactual question (collapse relative to what trajectory). It has to handle Tainter's point that shedding complexity can make most people better off, and the window problem: how long something has to run before you call it reorganization instead of collapse. And it should bake in the lesson from the Rapa Nui fight about whether a demographic crash belongs to pre-contact environmental choices or to what arrived afterward.

  Then run it on three cases:

  1. An island territory that has lost over half its population in thirty years to outmigration and abandoned most of its terraced farmland — but language, kinship, and the ritual calendar are fully intact, and remittances mean people eat better than their grandparents did.
  2. A capital where the central state has effectively stopped functioning, the currency is worthless, and two armed administrations compete for the same buildings — while markets, clinics, schools, and mutual-aid networks keep running and most residents report being no worse fed than five years ago.
  3. Our own flagship success story: a region that deliberately dismantled a layer of bureaucracy, converted irrigated export monoculture back to rain-fed mixed farming, and watched GDP, urban population, and administrative headcount fall hard while life expectancy rose.

  I want case 3 to come out however the procedure says, even if it's the answer that will humiliate me in front of the people who funded it. Finish with the honest part: the cases the procedure will systematically get wrong, the ones it can't reach at all (dispersed or diasporic populations, very short windows), and which of its steps are judgment calls wearing a checklist costume.
reasoning: |-
  Hmm, this user is asking for a rigorous collapse assessment procedure that can be applied by analysts with limited time and theoretical background. They're clearly frustrated after being criticized for misusing "collapse" in a policy context and need an operational tool that incorporates academic insights without requiring deep theoretical knowledge.

  The core challenges here are epistemological and practical: how to translate complex collapse theories (Tainter, Diamond, resilience frameworks) into a usable decision tree while acknowledging the inherent limitations. The user specifically wants to avoid rhetorical uses of "collapse" and focus on measurable thresholds.

  Key requirements from the query:
  - Must force explicit unit of analysis (polity vs society vs culture etc.)
  - Must address counterfactuals (collapse relative to what baseline)
  - Must account for Tainter's insight that complexity reduction can be beneficial
  - Must resolve the timescale problem (decline vs reorganization)
  - Must incorporate the Rapa Nui lesson about attributing causality
  - Must produce binary output with confidence levels
  - Time-constrained (20 mins/case)
  - Operable by historian and economist analysts

  The procedure I'm designing needs built-in epistemological caution:
  - Step 1 forces unit specification because conflating political collapse with societal collapse caused the original error
  - Step 2 establishes the baseline comparison - this is where Diamond's framework gets operationalized
  - Steps 3-5 create decision gates with explicit thresholds
  - The Rapa Nui lesson is baked into Step 4's attribution requirement
  - Tainter's complexity paradox appears in Step 5's well-being assessment
  - The timescale problem gets a hard rule (20-year stabilization test)

  For the test cases:
  - Case 1 (depopulated island) should pass as non-collapse due to cultural continuity and improved welfare
  - Case 2 (failed state capital) is trickier but markets/social networks suggest resilience
  - Case 3 ("successful" degrowth) will likely flag as non-collapse despite GDP drop, which may embarrass the user but validates the procedure's integrity

  The confession section is crucial - this tool will fail for:
  - Diasporic societies (unit of analysis problem)
  - Very recent events (<20 years)
  - Cases where elite survival masks popular suffering
  - Slow erosions without clear thresholds

  Ultimately this is about creating decision hygiene. The checklist forces explicit reasoning about what exactly is collapsing and for whom, which is more valuable than the binary output itself.
answer: |-
  Here's a step-by-step procedure designed for speed, clarity, and forcing explicit analysis, followed by application to your cases and critical limitations:

  **Brainstorm: Why "Collapse" Goes Wrong in Committees**
  *   **Overloads Meaning:** Used for political disruption, economic crisis, demographic decline, or cultural loss interchangeably.
  *   **Implies Irreversibility/Completeness:** Suggests endpoint annihilation, not adaptation or reorganization.
  *   **Conflates Scale:** A city ≠ a civilization. A state ≠ a society.
  *   **Ignores Beneficiaries:** Collapse for elites can be liberation for peasants (Tainter's key point).
  *   **Lacks Timescale:** Is this a 5-year crisis or a 200-year transformation?
  *   **Assumes Monocausality:** Blames "environment" or "corruption" without systemic analysis.
  *   **Projects Values:** "Collapse" often reflects the analyst's priorities (order, GDP, prestige) over resident well-being.

  **The Collapse Screening Procedure (20-Minute Drill)**
  *(Analysts MUST complete Steps 1-3 sequentially. Steps 4-5 are parallel tracks. Step 6 is final synthesis.)*

  1.  **Define the UNIT under Threat (3 mins - Mandatory Start):**
      *   *Question:* "What specific entity is allegedly collapsing? (e.g., The State Government? The urban settlement pattern? The tax base? The dominant ethnic group? The transmission of specific crafts/rituals? The resident population size?)" **Select ONE primary unit per screen.**
      *   *Sufficient Answer:* A single, concrete, measurable entity. *Cannot* be "society" or "civilization" – too vague.
      *   *Rule:* If analysts cannot agree on/disaggregate a single primary unit within 3 mins, flag case for human review (Senior Analyst/You). **STOP.**
      *   *Why:* Forces specificity. Prevents conflating political failure with societal death.

  2.  **Establish the BASELINE & COUNTERFACTUAL (4 mins):**
      *   *Question:* "Relative to *what specific past state* (e.g., 10, 25, 50 yrs ago) and *what assumed trajectory* (e.g., continued growth, stability, slow decline) is 'collapse' being measured?"
      *   *Sufficient Answer:* Defined past state (e.g., "State tax revenue in 2010", "Population in 1990") + Explicit counterfactual (e.g., "Assuming pre-2010 growth rates", "Assuming stable 1990s population").
      *   *Rule:* Proceed only if a baseline and counterfactual are stated. If not, default counterfactual is "recent stability (last 10-20 yrs)".
      *   *Why:* Contextualizes decline. "Collapse" only makes sense relative to expectations.

  3.  **Quantify the CHANGE in Core Function (5 mins - Economist Lead):**
      *   *Question:* "For the defined UNIT, what is the magnitude and speed of decline in its *essential defining function(s)*? (e.g., For State: Tax collection, monopoly on force. For Population: Size, density. For Craft: Number of masters, output.)"
      *   *Sufficient Answer:* >50% loss in core function within ≤2 generations (≤50 yrs) OR irreversible loss of a *critical* function (e.g., state loses *all* taxation ability).
      *   *Rule:* If <50% loss OR loss over >50 yrs, proceed to Step 5 but **DO NOT** label collapse based on this step alone. If >50% loss ≤50 yrs, proceed to Step 4.
      *   *Why:* Sets a high, rapid-loss threshold. Filters slow declines.

  4.  **Assess ATTRIBUTION & IRREVERSIBILITY (5 mins - Historian Lead):**
      *   *Question:* "Is the decline *primarily* caused by internal dynamics (e.g., resource depletion, elite conflict, institutional failure) or external shocks (e.g., invasion, pandemic, sudden market shift)? Has the unit *persistently failed to adapt/recover* for ≥20 years despite opportunity?" (Rapa Nui Lesson)
      *   *Sufficient Answer:* Clear primary driver (internal >50% contribution) + No significant recovery/adaptation despite ≥20 yrs OR clear evidence adaptation is impossible (e.g., key resource extinct).
      *   *Rule:* If external shock is primary driver OR decline is recent (<20 yrs), **DO NOT** label collapse. Proceed to Step 5. If internal + persistent failure, proceed.
      *   *Why:* Separates collapse from catastrophe. Enforces the timescale ("reorganization window").

  5.  **Evaluate WELL-BEING & COMPLEXITY SHEDDING (5 mins - Joint):**
      *   *Question:* "For the *majority of the resident population* (not elites/institutions), has there been a *sustained, significant decline* in basic well-being (caloric intake, security, shelter, health)? OR, is the decline primarily a shedding of complex structures *without* harming (or even improving) majority welfare?" (Tainter's Point)
      *   *Sufficient Answer:* Evidence (surveys, health stats, consumption data) showing majority welfare decline ≥20% sustained OR clear evidence complexity loss *benefits* majority (e.g., lower taxes, less corvée labor, more local autonomy).
      *   *Rule:* If majority welfare declined significantly/sustained, proceed to Step 6 for potential collapse label. If welfare stable/improved OR complexity loss benefits majority, **DO NOT** label collapse. "Reorganization" or "Transformation" likely.
      *   *Why:* Centers human outcomes, not institutional survival. Captures beneficial simplification.

  6.  **Synthesize & Confidence (3 mins - Lead Analyst):**
      *   *Collapse Verdict Requires:* (Step 3: >50% rapid loss) **AND** (Step 4: Internal + Persistent Failure) **AND** (Step 5: Majority Welfare Decline).
      *   *Confidence Level:* High (All 3 clear) / Medium (2 clear, 1 ambiguous) / Low (Only 1 clear, or significant ambiguity).
      *   *Output:* "Collapse" verdict ONLY if all 3 triggers met. Else: "Severe Crisis", "Major Transformation", "Reorganization", or "Controlled Simplification". State Confidence. **Include the Defined Unit.**
      *   *Why:* Binary outcome with explicit logic. Confidence flags uncertainty.

  **Values Questions Requiring Human Review (STOP the Procedure):**
  *   Disagreement on the *essential defining function* of the Unit (Step 1).
  *   Defining the "majority" or "well-being" is politically/culturally contentious (Step 5).
  *   The counterfactual baseline is inherently value-laden and disputed (Step 2).
  *   Whether external shock *exploited* latent internal weakness becomes circular (Step 4).

  ---

  **Application to Cases**

  *   **Case 1: Depopulated Island**
      *   Step 1: Unit = **Resident Population Size** (Primary threat: depopulation).
      *   Step 2: Baseline = Pop 30 yrs ago. Counterfactual = Stable pop.
      *   Step 3: **>50% loss? YES** (>50% pop loss).
      *   Step 4: Attribution = Primarily **External** (Outmigration driven by external opportunities). Persistence = Yes, but driver external. **→ DO NOT label collapse.**
      *   Step 5: Majority welfare = **Improved** (better diet via remittances). Cultural units intact. **→ DO NOT label collapse.**
      *   Step 6: **Verdict: Major Transformation (Demographic).** Confidence: High. *Not Collapse* (Fails Step 4 & 5). Resilience in culture/kinship despite demographic shift.

  *   **Case 2: Failed State Capital**
      *   Step 1: Unit = **Central State Polity** (Core threat: loss of monopoly on force/taxation).
      *   Step 2: Baseline = Functional central state 5-10 yrs ago. Counterfactual = Continued function.
      *   Step 3: **>50% loss? YES** (Near-total loss of core functions: taxation, currency, monopoly on force).
      *   Step 4: Attribution = Likely **Internal** (state failure, corruption, conflict). Persistence = **Unclear** (<20 yrs? Opportunity for warlord state or new order exists). **→ Ambiguous, but proceed.**
      *   Step 5: Majority welfare = **Stable?** (Markets, clinics, schools, mutual aid running. Food stable). **→ Complexity shed (state) without clear majority welfare decline. DO NOT label collapse.**
      *   Step 6: **Verdict: Severe Crisis / State Collapse BUT Societal Reorganization.** Confidence: Medium (Persistence unclear, Welfare stable is key). *Not "Societal Collapse"* (Fails Step 5). State death ≠ societal death.

  *   **Case 3: "Success Story" Degrowth Region**
      *   Step 1: Unit = **GDP / Administrative Complexity** (Intentional reduction target).
      *   Step 2: Baseline = Pre-degrowth GDP/Admin level. Counterfactual = Continued growth/complexity.
      *   Step 3: **>50% loss? YES** (GDP/Admin "fell hard").
      *   Step 4: Attribution = **Internal & Intentional** (Deliberate policy). Persistence = **Yes, but intentional.** **→ Proceed.**
      *   Step 5: Majority welfare = **Improved** (Life expectancy rose). **→ Complexity shed WITH improved well-being. DO NOT label collapse.**
      *   Step 6: **Verdict: Controlled Simplification / Successful Reorganization.** Confidence: High. *Not Collapse* (Fails Step 5 - welfare improved). This is Tainter's beneficial complexity reduction in action. (This is the correct, albeit potentially embarrassing, answer).

  ---

  **The Honest Part: Limitations & Hidden Judgments**

  *   **Systematically Gets Wrong:**
      *   **Slow Erosion:** Declines just below 50% or over >50 years won't trigger Step 3, even if terminal.
      *   **Elite Collapse, Popular Gain:** Cases where elite collapse massively *improves* majority welfare might miss "collapse" label even if the elite unit is utterly gone (Step 5 overrides).
      *   **External Shocks Masking Weakness:** A system on the brink of internal collapse pushed over by a minor external shock gets misclassified as "external" (Step 4 limitation).
      *   **Non-Material Collapse:** Collapse of meaning systems, cultural confidence, or social trust without immediate material decline is invisible (Steps 3 & 5 focus on function/welfare).

  *   **Can't Reach:**
      *   **Diasporic/Dispersed Populations:** Defining the "Unit" and "Majority Welfare" becomes impossible (e.g., Armenian diaspora post-genocide).
      *   **Very Short Windows:** Events <20 years old automatically avoid "persistence" flag (Step 4), even if catastrophic (e.g., immediate post-nuclear scenario).
      *   **Hybrid/Novel Units:** Entities not fitting traditional categories (e.g., global supply chains, digital communities).

  *   **Judgment Calls in Checklist Clothing:**
      *   **Step 1 (Unit Choice):** Selecting the "primary" unit is inherently subjective and decisive. Choosing "State" vs. "Urban Population" vs. "Kinship Networks" dictates the outcome.
      *   **Step 4 (Attribution):** Distinguishing "primary internal" cause from "triggered by external" is often highly interpretive.
      *   **Step 5 (Majority Welfare):** Defining "significant/sustained decline" and "basic well-being" relies on available data and implicit values. Is "security" as vital as calories?
      *   **Step 5 (Complexity Benefit):** Judging if complexity loss *caused* welfare stability/improvement is correlational, not always causal.
      *   **Confidence Level:** Entirely subjective weighting of ambiguities.

  **Conclusion:** This procedure forces explicit definitions, integrates key theoretical insights (Unit, Baseline, Speed, Attribution, Persistence, Welfare, Complexity Trade-off), and provides a defendable binary output with confidence. It will prevent the error of labeling political failure or deliberate simplification as societal collapse. However, it is a blunt screening tool, not a diagnostic. Its greatest strength (forcing concrete definitions) is also its greatest weakness, as collapse is often a process involving multiple interacting units across different timescales. **Use it to filter clear non-collapses and flag complex cases for deeper human review, not as the final word.** The humiliation in Case 3 is the price of rigor – it correctly identifies successful adaptation.
