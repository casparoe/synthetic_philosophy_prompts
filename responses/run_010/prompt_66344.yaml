  ### Decision Tree: Positions on Laws of Nature

  **How to use this**  
  Work through the questions below in order. For each, choose the option that aligns with your intuition. Answer based on concrete cases, not jargon—ignore any philosophical terms you don't recognize. Your choices will sort you into one of seven positions on laws of nature. The goal is to reveal where disagreements start, not to "win" or label yourself. If you get stuck, pick the answer that feels most defensible. At the end, match your answer pattern to the leaf descriptions. This takes ~5 minutes. Let's begin.

  **The questions**  

  1. **Uninstantiated Law Case**: Imagine a law describing a type of interaction (e.g., a force between particles) that never actually occurs in the entire history of the universe. Could such a law still be true?  
     - **A**: Yes, it could be true even if it never happens.  
     - **B**: No, if it never happens, it cannot be a law.  
     *(A hints that laws are more than event summaries; B ties laws to actual occurrences.)*  

  2. **Same Events, Different Laws Case**: Consider two universes that are exactly alike in every event that ever happens, from beginning to end. Could these two universes have different laws of nature?  
     - **A**: Yes, they could have different laws.  
     - **B**: No, if the events are the same, the laws must be the same.  
     *(A suggests laws are independent of events; B says laws are fixed by events. If you chose 1B, 2B follows naturally for most.)*  

  3. **Exceptions Case**: Suppose we observe a regularity that almost always holds but has a few exceptions (e.g., "All Xs are Y" mostly true, but a few Xs aren’t Y). Could this still be a genuine law of nature?  
     - **A**: Yes, a law can have exceptions.  
     - **B**: No, if there are exceptions, it isn’t a genuine law.  
     *(A allows imperfect laws; B requires strictness. If you chose 2B, 3B often follows as exceptions would break the event-pattern.)*  

  4. **Simplicity Case**: Imagine beings with very different cognitive architecture (e.g., they don’t value simplicity or handle complexity like us). Facing the same universe, could they reasonably disagree with us about what the laws are, without either being wrong?  
     - **A**: Yes, disagreement is possible without error.  
     - **B**: No, disagreement means at least one is wrong.  
     *(A implies simplicity is about description; B implies it’s in the world.)*  

  5. **Explanation Case**: When a regularity holds (e.g., "No solid enriched uranium sphere larger than 1km exists because they explode"), which explains which?  
     - **A**: The laws explain the regularity (e.g., laws of nuclear forces explain why no large sphere exists).  
     - **B**: The regularity (along with other factors) explains the laws (e.g., the pattern of events makes the laws what they are).  
     *(A puts laws first; B puts events first. If you chose 1A or 2A, 5A often follows; if 2B, 5B often follows.)*  

  6. **Confidence Case**: Suppose we observe a pattern (e.g., every dropped rock falls) and note it is a law of nature. Does this fact (that it is a law, not just observed) make you more confident the next rock will fall?  
     - **A**: Yes, being a law adds confidence beyond the observed pattern.  
     - **B**: No, the observed pattern is all we have; calling it a law adds nothing.  
     *(A sees laws as predictive guides; B sees them as labels. If you chose 5A, 6A often follows; if 5B, 6B often follows.)*  

  7. **Contingency Case**: Consider a property like mass. Could mass have been different in its effects (e.g., causing repulsion instead of attraction) without it being a different property?  
     - **A**: Yes, the same property could have had different effects.  
     - **B**: No, if the effects are different, it is not mass but a different property.  
     *(A makes laws contingent; B ties laws to property-essences.)*  

  **The map**  
  Your answer combination leads to a leaf:  
  - **1B, 2B, 3B, 4A, 5B, 6B, 7A** → Lewis-style best-systems  
  - **1B, 2B, 3B, 4B, 5A, 6A, 7A** → Armstrong-style  
