  6. **Confidence Case**: Suppose we observe a pattern (e.g., every dropped rock falls) and note it is a law of nature. Does this fact (that it is a law, not just observed) make you more confident the next rock will fall?
     - A: Yes, being a law adds confidence beyond the observed pattern.
     - B: No, the observed pattern is all we have; calling it a law adds nothing.
