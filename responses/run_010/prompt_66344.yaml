  - **1A, 2B, 3A, ... (any)**: Uninstantiated laws with exceptions in an event-fixed world. *Diagnosis*: Incoherent—if events fix laws (2B), exceptions (3A) shouldn’t be possible.  
  - **1B, 2A, 3B, 4B, ... (any)**: Laws must be instantiated (1B) but aren’t fixed by events (2A). *Diagnosis*: Unattractive—why require instantiation if events don’t constrain laws?  
  - **5A, 6B, ... (any)**: Laws explain regularities (5A) but don’t boost predictive confidence (6B). *Diagnosis*: Incoherent—if laws explain, they should guide predictions.  
  - **4A, 5A, 6A, ... (any)**: Simplicity is descriptive (4A), but laws objectively explain (5A) and predict (6A). *Diagnosis*: Unexplored—mind-dependent simplicity clashes with objective explanation.  

  **Pairs this can't separate**  
  - **Armstrong and Powers**: Both share 1B/2B/3B/4B/5A/6A—only split by contingency (7A vs. 7B). If someone is fuzzy on contingency, they’ll be sorted as "Armstrong or Powers."  
  - **van Fraassen and Lewis**: Both share 5B/6B, but differ on other nodes (e.g., 2A/2B). If someone prioritizes description (5B/6B) but waffles on event-supervenience, they may land in the wrong leaf.  
  - **Over-sold distinctions**: The "same events" (Q2) and "uninstantiated" (Q1) questions are subtly redundant—both probe if laws reduce to events. Q2 is the sharper tool, as Q1 often implies Q2’s answer (e.g., 1A typically forces 2A).  

  **Dry run**  
