  - **1B, 2A, 3A, 4A, 5B, 6B, 7A** → van Fraassen/Giere-style deflationary  
  - **1A, 2A, 3A, 4B, 5A, 6A, 7A** → Cartwright-style  
  - **1A, 2B, 3B, 4B, 5A, 6A, 7B** → Primitivist Necessitarianism (unnamed)  

  **The leaves**  
  - **Lewis-style best-systems (Humean)**: Laws are the system of regularities that best balances simplicity and strength in describing the total history of events. *Awkward commitment*: Laws depend on the entire cosmic timeline, so we can’t fully know them until the universe ends.  
  - **Armstrong-style (universals)**: Laws are contingent relations of "necessitation" between universals (repeatable properties), which explain why events unfold as they do. *Awkward commitment*: These relations are irreducible, unobservable "glue" that makes events follow patterns.  
  - **Maudlin-style (fundamental and productive)**: Laws are primitive, fundamental entities that directly govern how events unfold in time. *Awkward commitment*: Laws are brute facts—there’s no deeper reason why they hold.  
  - **Powers/dispositional-essentialist**: Properties (like mass) have causal powers essentially, so laws arise from what properties *are* and are metaphysically necessary. *Awkward commitment*: Mass couldn’t attract in another universe—it would be a different property.  
  - **van Fraassen/Giere-style deflationary**: There are no objective laws; "laws" are just useful models or summaries we invent to describe observed regularities. *Awkward commitment*: Even our best laws (e.g., the Standard Model Lagrangian) are tools, not truths about reality.  
  - **Cartwright-style (capacities)**: Laws describe stable capacities (e.g., gravity’s "capacity to attract") that exist in isolation but are literally false of the messy world due to interference. *Awkward commitment*: Fundamental laws are never strictly true—they only describe idealized tendencies.  
  - **Primitivist Necessitarianism (unnamed)**: Laws are necessary, fundamental, and govern events, but unlike Maudlin, they couldn’t have been otherwise. *Awkward commitment*: There’s no explanation for why these laws *must* hold—it’s a necessary mystery.  

