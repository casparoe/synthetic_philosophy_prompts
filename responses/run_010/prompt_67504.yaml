prompt: |-
  I run the ethics slot of an in-house CPD day at a fertility unit — about fourteen people, mostly embryologists and fertility nurses, one consultant, and the GP who does their counselling referrals. Ninety minutes, at the end of the day, they'll be tired. No pre-reading and please don't hand me a reading list either, they wont read anything.

  The session is nominally about procreative beneficence — the "should we be selecting the best embryo" question. But what I actually want them to leave understanding is the non-identity problem, because in my experience every objection this audience gives to procreative beneficence is the same objection in a different costume, and most of them either dissolve or at least change shape once you can see the structure underneath. So the real thing I need is a teaching plan for that idea, with procreative beneficence as the frame they think they signed up for.

  Don't explain the non-identity problem to me, I know it. Plan how I explain it to *them*.

  - **The order.** What has to be in place before the paradox can even register for them? I think the person-affecting restriction has to be surfaced and named before I can suspend it, but I don't know how to get them to see they're holding it without sounding like I'm accusing them of holding it. Give me the sequence, what depends on what, and roughly where the ninety minutes goes.
  - **The one case that carries it.** Not a menu of three — pick one and tell me why. Say what it has to have (the alternative child never existing at all, a life that's plainly worth living) and what it has to leave out. And be careful here: these people will translate anything I say into embryo selection because that's their job, and "the embryo we don't transfer" reads to them as a death rather than a non-event. Either the case survives that translation intact, or the plan needs to name the translation problem at the moment it happens.
  - **The misconceptions**, in the order they'll actually surface, and the exact point in the sequence where I get ahead of each one rather than fielding it afterwards. I'm expecting: "but the child is harmed by it"; "so you're saying we should have disabled children"; "then nothing we do to future people can be wrong"; "this is just eugenics with extra steps"; and the sneakiest one — "we're not doing anything *to* the embryo, so there's nothing that needs justifying." Tell me which of those I've got wrong and which ones I'm missing.
  - **One question** near the end that would genuinely tell me whether it landed, plus what a right answer sounds like versus a fluent-but-wrong one.
  - **What I should refuse to cover** at this level, and say out loud that I'm refusing it.

  Be committed: one case, one sequence, one closing question, and flag the single step in the plan your least confident about with this particular audience and what I do if it goes flat. And if you think my diagnosis is off — that the non-identity problem is the wrong thing to teach these people because it'll land as a word game and they'll switch off, or that it can't be separated cleanly from the embryo question in ninety minutes — say that plainly rather than building me a careful session on a bad premise.
reasoning: |-
  Okay, let's tackle this. The user runs an ethics session for a fertility unit team, focusing on procreative beneficence but really aiming to teach the non-identity problem. The audience is tired, with no pre-reading, so the approach needs to be engaging and clear.

  First, the main goal is to make them grasp the non-identity problem through the lens of embryo selection. The user believes that objections to procreative beneficence stem from this underlying issue. So, the challenge is to structure the session so that the non-identity concept becomes visible without losing the audience.

  The user's explicit needs: a sequence that surfaces the person-affecting restriction, a single case study that avoids the embryo-death misinterpretation, anticipating misconceptions, a closing question to check understanding, and knowing what to skip.

  Deep needs: The team might be conflating not selecting an embryo with harming a child. They need to see that choosing a different embryo means a different child, not harming the same one. Also, avoiding the eugenics label is crucial, so framing the non-identity problem as a logical issue, not a moral prescription, is key.

  The sequence should start with a relatable case. The climate policy example (Policy A vs. B) works because it separates the act from harming a specific person. Then, transitioning to embryo selection by showing the structural similarity. Timing is tight—90 mins at day's end. Interactive elements like quick polls keep engagement.

  Misconceptions: "The child is harmed" is the biggest hurdle. Addressing it early by clarifying that different choices lead to different children. The "eugenics" concern needs a direct response—distinguishing PB from NIP. Also, the "we're not doing anything" point requires explaining that non-selection isn't an action against an existing child.

  The closing question about the child conceived under Policy B checks if they understand that the child isn't harmed. A wrong answer might focus on the act itself rather than the identity.

  What to skip: Genetic enhancement vs. disease avoidance—too complex. Also, disability rights arguments and the full PB debate. Focus stays on NIP's structure.

  Potential pitfall: The transition from climate policy to embryos. If they don't see the parallel, use the phrase "different future person" and stress that non-transfer means no existence, not death.

  Overall, keeping it concrete, interactive, and tightly timed is essential. The user’s insight about NIP being the core seems correct—it's the logical structure behind their objections. Success means they leave questioning the assumption that not selecting harms a specific child.
answer: |-
  Here's a committed 90-minute teaching plan focused on making the Non-Identity Problem (NIP) visible through the lens of Procreative Beneficence (PB), structured for a tired clinical audience who translates everything into embryos.

  **Core Diagnosis:** Your instinct is correct. The NIP *is* the root of most common PB objections in this context. It *can* be taught in 90 mins *if* anchored tightly to their clinical reality and avoiding philosophical jargon. The key is making the identity shift undeniable before introducing the paradox.

  **The Sequence & Timing (90 Mins Total):**

  1.  **Grounding in Clinical Reality & PB Objection (15 mins):**
      *   **Start:** "We're here to discuss PB: the idea that we *should* select embryos predicted to have the 'best' chance of a good life. But let's be honest, many of you feel uneasy about this. *What's the gut objection?*" (Open floor briefly).
      *   **Surface the Core Objection:** Quickly synthesize responses towards: "It sounds like the biggest worry is: *Aren't we harming the child we don't select?* Or maybe: *Isn't it wrong to deliberately create a child who might have a harder life when we could have created one with a better chance?*"
      *   **Name the Intuition:** "Okay, that feeling is really powerful. It feels like we're doing something *to someone*. Philosophers have a name for this underlying idea: the **Person-Affecting Restriction (PAR)**. Roughly: An action is wrong *only if* it makes some *particular person* worse off than they otherwise would have been. Our gut tells us not selecting Embryo A harms the child who *would* have come from Embryo A. PAR feels like common sense, right?"

  2.  **Introduce the Paradox Seed (The Case That Forces the Shift) (25 mins):**
      *   **The Case: Climate Policy - 2 Futures (Not Embryos Yet!)**:
          *   "Imagine two government policies decided *today* affecting environmental conditions 150 years from now:"
          *   **Policy A (Moderate):** Invests moderately. Results in a stable, decent world. A specific set of people (Population A) is born and lives lives worth living (say, average lifespan 85, good quality).
          *   **Policy B (Aggressive):** Massive investment, sacrifices now. Results in a *significantly better* world 150 yrs later. A *completely different set of people* (Population B) is born (due to subtle shifts in who meets whom, jobs, timing of births over generations) and lives *even better* lives (say, average lifespan 100, excellent quality).
          *   Policy A is chosen over Policy B.
      *   **The Crucial Question:** "Consider a specific person born into Population A under Policy A - let's call her Clara. *Is Clara worse off because Policy B wasn't chosen?*"
      *   **Facilitate the Realization (Interactive):**
          *   Poll: "Thumbs up if you think Clara *is* harmed/worse off? Thumbs down if not?" (Expect mix).
          *   **Force the Identity Point:** "Think carefully: *Would Clara exist at all if Policy B had been chosen?*... No. Policy B leads to *completely different people* being born 150 years from now. Clara only exists *because* Policy A was chosen. The alternative for Clara isn't being born into Population B's better world. The alternative for Clara is *never existing at all*."
          *   **State the Paradox:** "So, Clara has a life worth living (Policy A world). She wouldn't exist if Policy B had been chosen. *Can we say Policy A harmed Clara?* How? She only exists *because* of Policy A! She's not worse off than she would otherwise be – because otherwise, she *wouldn't be*."
      *   **Name it:** "This is the seed of the **Non-Identity Problem**: An action (choosing Policy A) shapes the future such that different people exist. When those people have lives worth living, it's hard to say the action *harmed those specific individuals*, even if we created a world that's *overall worse* than the alternative world with different people."

  3.  **The Translation: Back to Embryos (The "Aha!" Moment) (20 mins):**
      *   **The Bridge:** "Okay, climate policy feels distant. Let's translate this structure directly to our world. Swap 'Policy A' for 'Transferring Embryo X'. Swap 'Policy B' for 'Transferring Embryo Y'."
      *   **Reframe PB Decision:**
          *   Choosing to transfer Embryo X (perhaps predicted to have a higher chance of a significant health condition) instead of Embryo Y (predicted to have a lower chance).
          *   **Crucially:** "If we transfer Embryo X, Child X is born. If we transfer Embryo Y, Child Y is born. *Child X and Child Y are different people.*"
      *   **Re-Ask the Harm Question:** "Consider Child X, born from Embryo X. They have a life with challenges, but it's unquestionably a life worth living. *Is Child X worse off because we didn't transfer Embryo Y?*"
      *   **Force the Identity Point Again:** "Think: *Would Child X exist at all if we had transferred Embryo Y?*... No. Child X only exists *because* we transferred Embryo X. The alternative for Child X isn't being Child Y, living a life without that health condition. The alternative for Child X is *never existing at all*."
      *   **State the NIP Clinically:** "This is the **Non-Identity Problem** in embryo selection. Choosing Embryo X shapes the future such that Child X exists. Child X has a life worth living. It's logically difficult to say that transferring Embryo X *harmed Child X*, because *without that choice, Child X wouldn't exist*. The 'harm' comparison isn't between Child X in this world vs. Child X in a better world; it's between Child X existing vs. Child X *not* existing."
      *   **Address the "Death vs. Non-Event" Instantly:** "I know what you're thinking: 'But not transferring an embryo feels like losing a potential life!' And biologically, that embryo ceases development. *But ethically, for the specific child who would have resulted (Child Y), not transferring means that specific child never comes into existence.* It's a non-event *for that specific potential child*, not a death. The harm argument requires a *specific person* being made worse off."

  4.  **Tackling Misconceptions (Head-On & Proactively) (20 mins):**
      *   **Order & Timing:** Address these *as they logically arise* from the above explanation, using the established framework:
          1.  **"But the child *is* harmed by it!" (The Core Objection):** (Hit this HARD after the embryo translation) "I know it *feels* that way! But *which child?* If you mean Child X, how? They only exist because of the choice. Their alternative is non-existence, not a healthier life. The PAR intuition is strong, but the NIP shows it might not hold here. The 'harm' isn't to a specific person compared to their alternative existence."
          2.  **"So you're saying we *should* have disabled children?" / "This is just eugenics with extra steps":** (Address together, proactively after stating the NIP clinically) "**NO.** Absolutely not. Understanding the NIP *does not tell us what we should do*. It doesn't say PB is right or wrong, or that creating a child with a disability is good or bad. It *only* challenges one specific argument: that selecting Embryo X harms *Child X*. There might be *many other powerful reasons* to prefer transferring Embryo Y: resource allocation, parental wellbeing, societal views, avoiding suffering, or yes, concerns about eugenics. The NIP just shows the 'harm to *this* child' argument has a logical flaw. We still need to weigh all those other ethical considerations."
          3.  **"Then nothing we do to future people can be wrong?"**: "Good catch! But no. The NIP applies specifically to actions that *change who exists* and where the resulting people have lives worth living. If an action *harms existing future people* (e.g., dumping toxic waste that poisons kids already born or destined to be born regardless), that's straightforward harm. If an action creates people with lives *not* worth living (e.g., causing extreme, unremitting suffering), that's different too. The NIP is a specific puzzle for identity-affecting choices resulting in lives worth living."
          4.  **"We're not doing anything *to* the embryo, so there's nothing that needs justifying."**: (Less common, but address if raised or proactively) "Hold on. We *are* making a deliberate choice: to transfer *this* embryo and not *that* one. That choice *does* need ethical justification. The NIP shows that 'harming the resulting child' *might not* be the best justification, or might be logically tricky. But we still need to justify our choice based on other criteria: patient wishes, clinic policy, societal norms, wellbeing considerations, resource use, etc. The action of selection itself requires justification; the NIP just complicates *one type* of justification."
      *   **Missing Misconception:** You missed **"But we have a duty to create the *best* child possible!"** (A direct PB push). Response: "That's the core claim of PB! But the NIP challenges the *foundation* of objections *to* PB. Opponents often say PB violates a duty *not to harm* or *not to create a worse-off child*. The NIP shows that duty might not apply in the way they think. Whether we *have* a positive duty to create the 'best' is a *separate* and much harder ethical question we won't resolve today."

  5.  **The Closing Question (5 mins):**
      *   **The Question:** "Thinking back to Policy A vs. Policy B: Can Clara (born under Policy A) legitimately complain that she was *harmed* because Policy B wasn't chosen? Why or why not?"
      *   **Why This Question:** It tests if they grasped the core logical structure (different person, life worth living, alternative is non-existence) without the emotional weight of embryos. It forces them to apply the NIP reasoning.
      *   **Right Answer Sound:** "No, because if Policy B had been chosen, Clara wouldn't exist at all. She only exists because of Policy A, and her life is worth living. She wasn't made worse off compared to how she would otherwise be (non-existent)." (Key elements: Identity dependence, alternative is non-existence, life worth living).
      *   **Fluent-But-Wrong Answer:** "No, Policy A gave her a decent life, Policy B would have been better but she wasn't deprived." (Misses the *identity* point – implies she *could* have existed under Policy B but got a worse deal). OR "Yes, she got a worse environment than she could have had." (Completely misses the identity shift).

  6.  **What to Refuse to Cover (Say This Out Loud):**
      *   "We're focusing *only* on the logical structure of this specific paradox – the Non-Identity Problem – and how it relates to the 'harm' objection in embryo selection. We are **NOT** covering:
          *   The full debate for or against Procreative Beneficence (that's huge!).
          *   Whether there's a moral difference between selecting *against* disease vs. selecting *for* enhancement.
          *   Detailed arguments about disability rights or the social model of disability in this context.
          *   The metaphysics of personal identity over time. We'll take 'different embryo = different person' as a given for clinical decision-making.
      *   This keeps us focused on making this one crucial concept visible today."

  **The One Case:** **Climate Policy (Policy A vs. Policy B).**
  *   **Why:** It's identity-affecting, involves a life worth living, and crucially, is *decades removed from conception*. This distance makes the "different person" point undeniable *before* translating to embryos. It breaks the automatic "embryo = potential child we harmed" link. The long timescale forces the realization that different policies lead to entirely different populations. It has the necessary elements clearly (different people, life worth living, alternative is non-existence).
  *   **Survives Translation:** It provides the clean structural template *first*. You then explicitly map Policy->Embryo, Population->Child. You directly address the "death vs. non-event" during the translation step.

  **Flagged Step & Recovery Plan (Least Confident):**
  *   **Step:** The initial **translation from Climate Policy back to Embryos (Step 3)**. This is where the powerful PAR intuition ("but we *are* harming that child!") will clash hardest with the logical NIP.
  *   **Why Worried:** Clinical staff are deeply wired to think in terms of specific potential patients (embryos/children). The abstraction might snap back, or the emotional weight might override the logic momentarily.
  *   **Recovery if it Goes Flat:**
      1.  **Slow Down & Reiterate:** "I know this feels counter-intuitive. Let's walk through it slowly. Policy A -> Clara exists. Policy B -> Clara *does not exist*, different people do. Transfer Embryo X -> Child X exists. Transfer Embryo Y -> Child X *does not exist*, Child Y exists. Is Child X *present* in the world where Embryo Y is transferred? No. So who is harmed *in that world* by not transferring X? No one specific."
      2.  **Use Concrete Language:** Hammer "Child X only exists because we transferred Embryo X. The alternative for Child X is *not* being a healthy Child Y. The alternative is *non-existence*."
      3.  **Acknowledge the Emotion:** "It *feels* wrong, I get it. The PAR intuition is strong and often morally sound. The NIP shows this is a special case where that intuition hits a logical snag. That's what makes it a *problem* or paradox. Sit with the discomfort for a second."
      4.  **Pivot to Implications:** If still stuck, shift slightly: "Even if the logic is uncomfortable, *if* the NIP holds, what does that mean for how we *justify* our embryo selection decisions? Maybe 'harm to this child' isn't the rock-solid foundation we thought for objecting to PB?"

  **Commitment:** This plan is laser-focused on making the NIP structure visible using one clear non-embryo case, translating it explicitly, tackling the major misconceptions head-on in sequence, and leaving them with a testable understanding, all within 90 minutes. It respects their fatigue by being highly interactive, concrete, and jargon-minimized. Your diagnosis is spot-on – the NIP *is* the key to unlocking their PB objections. Good luck!
