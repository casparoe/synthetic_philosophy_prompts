prompt: |-
  I am drafting a response to a consultation on how a public streaming platform ought to weight audience metrics in its arts-funding recommendations, and one of the submissions leans heavily on Tolstoy. Its argument, in outline, runs as follows. Tolstoy held in *What Is Art?* that art is the transmission of feeling, and that he wrote: "Art is a human activity consisting in this, that one man consciously, by means of certain external signs, hands on to others feelings he has lived through, and that other people are infected by these feelings and also experience them." The submission then observes that Tolstoy also held that the degree of infectiousness is the sole measure of a work's excellence as art, and concludes that completion rates, replays and share-velocity are therefore not a vulgar substitute for judgement about artistic merit but a direct measurement of the very property Tolstoy made central. A second step follows: since Tolstoy appraised transmitted feelings by whether they serve the well-being of humanity, the platform is entitled to demote works that are highly infectious yet transmit harmful feelings — on this reading the epidemiology licenses quarantine.

  I want an audit of the infection analogy itself. I am less concerned with whether Tolstoy was right than with how much weight his metaphor can bear when it is made to carry a measurement programme and a censorship policy.

  Please address the following:

  1. **The correspondence table.** What in the platform ecosystem plays the role of the pathogen, the carrier, the vector, the susceptible host, the dose, virulence, the incubation period, immunity, the epidemic curve, and quarantine? Be explicit wherever a slot has no natural occupant, or has several competing ones.

  2. **What the source smuggles in.** Identify the features of epidemiology that the analogy imports and the target lacks — involuntary uptake, non-cognitive transmission, replication of the agent itself, dose–response, host homogeneity, the presumption that rate of spread tracks either harm or benefit. For each, say whether the mismatch is fatal to the submission's use or merely decorative.

  3. **Tolstoy's own constraints on his metaphor, which the submission appears to have skipped.** He excluded direct involuntary contagion from art altogether — causing another to yawn when one cannot help yawning, or to laugh or weep at the sight of one's own laughter or tears — on the grounds that art begins only where a feeling is deliberately re-experienced and expressed by external signs. He also gave three conditions governing the *degree* of infectiousness: the individuality of the feeling transmitted, the clearness of its transmission, and the sincerity of the artist, the last of these the chief, since it entails the other two. What becomes of a metric built on reach once these are in play? Is any part of Tolstoyan infectiousness observable at population scale, or is the whole of it a property of single encounters between one work and one receiver — and if so, what does that do to the inference from aggregate numbers to merit?

  4. **Whether the two-axis structure survives translation.** Tolstoy separated a work's quality *as art* (its infectiousness) from the worth of the feelings it transmits, the latter judged by what he called the religious perception of the age. A single engagement figure collapses the two. Does that collapse serve the submission or defeat it?

  5. **The quarantine inference.** Tolstoy's mechanism of appraisal was condemnation, esteem and the deliberate choice of what to encourage, not the institutional removal of carriers from circulation. Does the epidemiological framing license a step Tolstoy did not take, and does the analogy generate that step on its own — that is, would the policy look different if art had been compared to something else?

  6. **Verdicts, and a replacement.** State separately whether each of the two conclusions survives once the disanalogies are on the table, and whether either could stand without the analogy carrying it. Consider also whether Tolstoy's account of what had corrupted the art of his own day — payment, professionalisation, criticism and art schools — cuts for or against using platform metrics at all. Finally, if the infection analogy fails for this purpose, propose a better one (Tolstoy himself compares art to speech, which transmits thoughts rather than feelings) and say what the better analogy would license that this one does not.

  No need for references or a bibliography; I will supply those myself.
reasoning: |-
  Hmm, the user is drafting a response to a consultation on how a public streaming platform should weight audience metrics for arts funding. They've received a submission that heavily relies on Tolstoy's infection metaphor from "What Is Art?" and wants me to audit this analogy. The submission argues that engagement metrics (completion rates, replays, shares) directly measure artistic merit as Tolstoy defined it (infectiousness of feelings), while also justifying censorship ("quarantine") of harmful but infectious content.

  I need to analyze this infection analogy across several dimensions as outlined in the query. The user is particularly interested in how well the metaphor holds up when applied to actual measurement and policy decisions, rather than whether Tolstoy was fundamentally correct.

  For the correspondence table (point 1), I should map epidemiological concepts to platform elements. For example, the pathogen would be the feeling transmitted by the artwork, the carrier would be the artwork itself, and susceptible hosts would be viewers. But I need to note where there are mismatches - like how there's no real equivalent for immunity in this context, or how vectors might be both algorithms and users sharing content. The platform ecosystem complicates simple disease model applications.

  For what the analogy smuggles in (point 2), I'll highlight problematic imports from epidemiology: involuntary transmission (art requires deliberate engagement), non-cognitive spread (Tolstoy valued conscious reception), dose-response relationships (artistic impact isn't dose-dependent), host homogeneity (audiences vary greatly), and the assumption that spread equals value (which Tolstoy didn't hold). These aren't just decorative issues - they fundamentally undermine the submission's argument.

  Tolstoy's own constraints (point 3) are crucial. He specifically excluded involuntary contagion (like yawning), emphasizing deliberate expression and reception. His three conditions for infectiousness (individuality, clarity, sincerity) can't be measured by raw engagement metrics. Sincerity especially is internal to the artist and invisible in aggregate data. This makes population-level metrics poor proxies for Tolstoyan merit.

  The two-axis structure separation (point 4) is important - Tolstoy separated infectiousness (artistic quality) from the moral value of the feelings transmitted. The submission's use of engagement metrics collapses these distinct dimensions, creating a significant distortion of Tolstoy's framework. High engagement might indicate infectiousness but says nothing about the worth of the feelings.

  The quarantine inference (point 5) is particularly problematic. Tolstoy advocated moral appraisal through criticism and personal choice, not institutional removal. The disease metaphor licenses this censorship step in a way Tolstoy never did, making the policy recommendation feel like an illegitimate extension of the analogy.

  For my verdict (point 6), neither conclusion survives scrutiny. Engagement metrics don't measure Tolstoyan infectiousness properly, and the censorship justification is alien to his framework. Tolstoy's critique of professionalized art actually argues against using platform metrics at all. A better analogy would be Tolstoy's own comparison to speech - which emphasizes conscious reception and moral evaluation without smuggling in epidemiological assumptions about involuntary spread and removal.

  Throughout this analysis, I'll maintain a critical but balanced tone, helping the user dismantle this problematic application of Tolstoy while acknowledging where the submission gets elements right. The focus will remain on the structural weaknesses of the analogy when operationalized for policy.
answer: |-
  Here’s an audit of the Tolstoyan infection analogy as applied to platform metrics and censorship, structured per your queries:

  ### 1. Correspondence Table
  - **Pathogen**: The "feeling" transmitted by the artwork.  
  - **Carrier**: The artwork itself (e.g., a film, song).  
  - **Vector**: Platform algorithms (recommendations), user sharing, or marketing. *Competing: Algorithms act as vectors by design, but user sharing is organic.*  
  - **Susceptible Host**: The viewer/listener. *Mismatch: Susceptibility varies by individual psychology/context; no "immunocompromised" equivalent.*  
  - **Dose**: Exposure duration (e.g., watch time). *Weak fit: Dose implies quantity, but Tolstoy emphasizes qualitative "infection," not cumulative exposure.*  
  - **Virulence**: Intensity of emotional response. *Unmeasurable: Virulence implies harm, but Tolstoyan infection can be beneficial.*  
  - **Incubation Period**: Time between exposure and emotional response. *No natural occupant: Artistic "infection" is often immediate; delayed resonance isn't tracked.*  
  - **Immunity**: Cultural saturation, desensitization, or aesthetic preferences. *Weak fit: Immunity is passive; art requires active engagement per Tolstoy.*  
  - **Epidemic Curve**: Share velocity/virality metrics. *Overextended: Tracks spread but not depth or sincerity of feeling.*  
  - **Quarantine**: Delisting or demoting content. *Artificial: Epidemiology quarantines to *halt spread*; platforms demote for *normative* reasons.*  

  ### 2. Smuggled-In Epidemiological Features  
  - **Involuntary Uptake**: Epidemiology assumes passive infection; Tolstoy *requires* conscious reception. **Fatal mismatch** – collapses art/non-art distinction.  
  - **Non-Cognitive Transmission**: Diseases bypass cognition; Tolstoyan infection requires emotional comprehension. **Fatal** – metrics ignore *how* feelings are received.  
  - **Replication of the Agent**: Pathogens self-replicate; feelings transform with each transmission. **Fatal** – art’s "pathogen" mutates via interpretation.  
  - **Dose–Response**: Assumes more exposure = stronger effect. **Decorative but misleading** – a 10-second clip may "infect" more than full view.  
  - **Host Homogeneity**: Assumes uniform susceptibility. **Fatal** – audiences vary culturally/individually; Tolstoy values universal *accessibility*, not uniformity.  
  - **Spread = Benefit/Harm**: Assumes virality indicates value. **Fatal** – Tolstoy separates infectiousness (metrics) from moral worth (religious perception).  

  ### 3. Tolstoy’s Constraints & Metrics  
  - **Deliberate Expression/Reception**: Excludes involuntary reflexes (yawns). Metrics like completion rates *include* involuntary engagement (autoplay, background play).  
  - **Three Conditions**:  
    - *Individuality*: Unique feelings ≠ mass appeal. Metrics favor broad, generic emotions.  
    - *Clearness*: Precise transmission ≠ virality (meme ambiguity often spreads faster).  
    - *Sincerity*: Artist’s authenticity is unobservable in data.  
  **Result**: Aggregate metrics capture *breadth*, not Tolstoyan *depth*. Infectiousness is per encounter; population stats obscure sincerity/individuality. **Fatal to merit inference**: High shares could indicate shallow, insincere, or ambiguous content—antithetical to Tolstoy.  

  ### 4. Two-Axis Structure Collapse  
  Tolstoy’s separation of **infectiousness** (artistic merit) and **moral value** (religious perception) is erased by engagement metrics. A viral white-supremacist film scores highly on "infectiousness" but fails morally.  
  - **Serves submission**: Allows censorship of "harmful" high-engagement works.  
  - **Defeats submission**: Collapse conflates popularity with artistic merit, violating Tolstoy’s core distinction. Metrics cannot isolate "quality as art" from shock value/addictiveness.  

  ### 5. Quarantine Inference  
  - Tolstoy endorsed **moral appraisal via criticism and choice** (e.g., shunning "upper-class" art). **Not removal by institutions**.  
  - Epidemiology licenses **quarantine as neutral/scientific**, masking normative judgment. The analogy smuggles in state-like authority for platforms.  
  - **Policy difference**: A "speech" analogy would license counterspeech, not removal.  

  ### 6. Verdicts & Replacement  
  - **First Conclusion (metrics = merit)**: **Fails**. Metrics ignore sincerity, individuality, and conscious reception—core to Tolstoyan infection. Dies without the analogy.  
  - **Second Conclusion (quarantine)**: **Fails**. Tolstoy opposes institutional censorship; epidemiology licenses it illegitimately. Dies without analogy.  
  - **Tolstoy’s Corruption Critique**: **Cuts against metrics**. Payment/professionalisation (e.g., monetized clicks) incentivizes insincere, crowd-pleasing art—precisely what he condemned.  
  - **Better Analogy: Speech** (as Tolstoy suggested).  
    - **Transmits**: Thoughts/feelings consciously received.  
    - **Licenses**: Counterspeech for "harmful" content (e.g., warnings, context), not removal.  
    - **Avoids**: Involuntary infection, host passivity, and pseudoscientific quarantine.  
    - **Retains**: Moral appraisal + deliberate transmission.  

  **Summary**: The infection analogy is structurally unsound for metrics/censorship. It ignores Tolstoy’s key constraints, conflates spread with merit, and illicitly authorizes removal. The speech analogy aligns better with his framework and enables nuanced moderation without "quarantine."  

  ---  
  *This audit assumes your familiarity with Tolstoy’s text; no citations added per request.*
