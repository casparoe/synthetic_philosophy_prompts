prompt: |-
  ok so I'm in a philosophy-of-statistics seminar this term and my final paper is supposed to be a case study, and I've picked the psi episode: Bem's 2011 JPSP paper on precognition, the Wagenmakers/Wetzels/Borsboom/van der Maas Bayesian reanalysis that came out alongside it, Bem's rejoinder, and then Ritchie, Wiseman and French's three failed replications in PLoS ONE the next year. I already know the beats of the story, what I dont have is an analysis and that's what I want from you.

  The setup: I want to treat this episode as a test case for the frequentist-vs-Bayesian dispute specifically, and then work out honestly whether it functions as one. Four things.

  1. The mapping. Go feature by feature -- the one-sided tests, the partly exploratory character of the analysis, whatever stopping-rule and data-collection flexibility was in play, the pooling across the nine studies, the fact that the effect then failed to replicate at all -- and say for each what the frequentist framework licenses you to conclude and what the Bayesian one licenses, and which of them actually comes out ahead on that feature.

  2. Whether the episode discriminates between them at all. Here's my worry and I want you to argue with it rather than reassure me: since the effect turned out not to exist, maybe all this tests is error control under a true null, and a Bayesian advantage only shows up when there's a real small effect sitting there to be detected. If that's right, the psi case is the wrong kind of test case for the dispute and the actual culprit -- researcher degrees of freedom, the forking-paths problem -- lives on a different axis entirely, one where a Bayesian can foul things up just as thoroughly as a frequentist.

  3. The prior problem. The Bayesian win here runs off a skeptical prior centered at zero. Is that a legitimate encoding of what we already know about precognition, or is it just disbelief wearing numbers? Say what a parapsychologist's prior would have done to the Bayes factors, and whether that makes the disagreement resolvable, relocated, or dead in the water.

  4. Where both frameworks are silent. Which parts of the episode aren't statistical-framework questions at all -- journal incentives, whatever the pre-registration push afterwards actually fixed, what would even count as a successful replication of an anomalous effect -- and be disciplined about not making statistics speak where it has nothing to say.

  Also: flag anything you're reconstructing instead of remembering, like exactly which prior the reanalysis used or what Bem's rejoinder argued. I'd much rather you write unsure than invent a detail I'll get marked down for.

  Format -- no essay intro and no prose outside the object, just one JSON blob with exactly these keys:
  - "facts_of_the_case": array of strings, the episode beats you're relying on, each ending in [confident] or [unsure]
  - "feature_mapping": array of objects with keys "feature", "frequentist_reading", "bayesian_reading", "which_handles_it_better" (must be one of frequentist, bayesian, neither, both_equally)
  - "does_the_episode_discriminate": object with keys "my_worry_is_right" (true, false, or true_in_part), "why", "what_would_make_it_a_real_test_case"
  - "the_prior_problem": object with keys "skeptical_prior_defensible", "parapsychologist_prior_effect", "verdict" (one of resolved, relocated, unresolvable)
  - "where_both_are_silent": array of strings
  - "paper_thesis": one sentence I could actually defend in seminar
  - "weakest_link": the single most contestable claim in everything you wrote above
reasoning: |-
  We are given a specific structure for the response. We must output a JSON blob with the exact keys as specified.

   Steps:
   1. Facts of the case: List the key events in the Bem psi episode, marking each as [confident] or [unsure].
   2. Feature mapping: For each feature (one-sided tests, exploratory analysis, stopping rule, pooling, replication failure), state:
      - feature: short description
      - frequentist_reading: what the frequentist framework allows one to conclude about that feature
      - bayesian_reading: what the Bayesian framework allows one to conclude about that feature
      - which_handles_it_better: one of "frequentist", "bayesian", "neither", "both_equally"

   3. Does the episode discriminate: Address the worry that since the effect was not real, it only tests error control under the null and may not discriminate the frameworks in the presence of a real effect. Also, note that the researcher degrees of freedom might be a separate issue.
      - my_worry_is_right: true, false, or true_in_part
      - why: explanation
      - what_would_make_it_a_real_test_case: what kind of case would better test the dispute

   4. The prior problem: Discuss the use of a skeptical prior in the Bayesian reanalysis.
      - skeptical_prior_defensible: whether the skeptical prior is a legitimate encoding of prior knowledge
      - parapsychologist_prior_effect: what a parapsychologist's prior would do to the Bayes factors
      - verdict: one of "resolved", "relocated", "unresolvable"

   5. Where both are silent: List aspects of the episode that are not about the statistical framework (e.g., journal incentives, pre-registration, replication criteria).

   6. Paper thesis: One sentence thesis for the seminar paper.

   7. Weakest link: The most contestable claim in the above.

   Important: We must flag when we are unsure about a fact.

   Let's recall the Bem episode:

   - Bem (2011) published a paper in JPSP claiming evidence for precognition (9 experiments, mostly with p < .05, one-sided tests).
   - Wagenmakers et al. (2011) reanalyzed the data using a Bayesian approach with a skeptical prior (a default Cauchy prior centered at zero) and found Bayes factors that were either inconclusive or favored the null.
   - Bem wrote a rejoinder (which I haven't read in detail, so I must be cautious) arguing against the Bayesian reanalysis, perhaps on the choice of prior or other grounds.
   - Ritchie, Wiseman, and French (2012) published three failed replications in PLoS ONE.

   Features to map:

    a. One-sided tests: Bem used one-sided tests because the hypothesis was directional (precognition would improve performance). Frequentists allow one-sided tests when the hypothesis is directional, but it can be problematic if there's a possibility of an effect in the other direction. Bayesians can also use one-sided models, but they can also use two-sided models and the Bayes factor will naturally account for the direction.

    b. Exploratory character: Bem's analysis was partly exploratory (he had multiple dependent variables and some flexibility in analysis). Frequentist framework is vulnerable to inflated Type I error in exploratory analyses without correction. Bayesian framework, when using Bayes factors, does not automatically adjust for multiple comparisons, but the prior can be set to be more skeptical. However, without pre-specification, both can be misused.

    c. Stopping rule and data collection flexibility: Bem had some flexibility in when to stop collecting data and which data to include. Frequentist inference is sensitive to stopping rules (e.g., p-hacking). Bayesian inference with Bayes factors is also sensitive to stopping rules, but some argue that the likelihood principle makes Bayesian inference less sensitive (if the model is correct). However, if the stopping rule is based on the data, it should be included in the model.

    d. Pooling across the nine studies: Bem combined the results of nine experiments. Frequentists might use a meta-analysis (e.g., Stouffer's method) but without accounting for publication bias or selective reporting, the overall p-value can be misleading. Bayesians can do a hierarchical meta-analysis that accounts for between-study heterogeneity and can provide a combined Bayes factor.

    e. Replication failure: The three replications by Ritchie et al. failed to find the effect. Frequentists would see this as strong evidence against the original claim. Bayesians can update the prior with the new data and get a posterior that is even more in favor of the null.

   Now, for the worry in part 2: The worry is that since the effect was not real, the case only tests the frameworks when the null is true. But the dispute between frequentists and Bayesians is often about how they behave when there is a real effect (especially a small one). Also, the researcher degrees of freedom (forking paths) is a problem that can affect both frameworks.

   For the prior problem: 
     - Skeptical prior: centered at zero with a Cauchy distribution (as in the default Bayes factor for t-tests). Is this defensible? From a skeptical perspective, yes, because precognition contradicts established physics. But a parapsychologist might use a prior that allows for a small positive effect (truncated at zero? or a normal with mean slightly above zero?).
     - Effect of parapsychologist prior: the Bayes factor would be more favorable to the alternative (since the prior is more concentrated on the effect size they expect).
     - Verdict: The disagreement about the prior is fundamental and cannot be resolved by the data alone. It is relocated to the prior, making it unresolvable by statistical means? Or is it resolvable by accumulating evidence? Actually, with enough data, even a skeptical prior can be overcome. But in this case, the replications failed. So the verdict might be "relocated" (to the prior) or "unresolvable" in the short term.

   Aspects where both are silent:
     - Journal incentives: publishing surprising findings.
     - Pre-registration: which was not done in Bem's original study but became more popular after.
     - What counts as a successful replication? (e.g., same effect size? same p-value? same direction? Bayes factor above a threshold?)

   Paper thesis: A one-sentence thesis.

   Weakest link: The most contestable claim.

   Let's build the JSON.
