  The trickiest part will be distinguishing substantive claims from platitudes. For example, saying democracy requires more than elections could be uncontroversial if we're just acknowledging other institutions exist, but highly controversial if we're claiming courts matter more than voting. I'll need to specify what would falsify each thesis and whether anyone actually holds the opposite view.

