prompt: |-
  I am reporting a piece about the machinery through which climate science becomes something a large body of governments can be said to agree on, and I have gotten stuck on a procedural detail that I suspect carries more philosophical weight than anyone in the room would admit. Let me describe the arrangement as I understand it, so that your answer can rest on the description rather than on recall.

  The Panel's working-group reports are written by a few hundred nominated scientists over several years and pass through repeated rounds of expert and government review. The chapters themselves are formally accepted by the scientists at a plenary session — a comparatively light act of endorsement, roughly that the chapter fairly represents the literature. A much shorter Summary for Policymakers, drafted by those same scientists, is then taken up line by line by the delegations of the roughly 195 member governments, over days of session, and must clear without any delegation sustaining an objection. Sentences are reworded, magnitudes are recalibrated, hedges are inserted, and lines that cannot be carried are bracketed or struck. What is then cited in the press, what the consensus claim rests on, and what feeds the UN negotiations is that approved Summary, not the chapters; the chapters are not reopened. The Panel holds that the approved Summary must remain faithful to the underlying report, and it describes its own work as relevant to policy but never prescriptive of it.

  What I need for the piece is a reconstruction of what this arrangement takes for granted, not a verdict on the Panel's usefulness. So:

  What theory of knowledge and of group agency does line-by-line approval presuppose? What does a delegation's failure to object to a sentence amount to — an assertion by the body, a belief, a commitment not to contest, a bargain? What has to be true about the relation between the attitudes of the parts and the attitudes of the whole for the Summary to be something anyone can be said to claim?

  The unit at which agreement is recorded is the sentence, but the object that is cited is the document. Different coalitions can carry different lines, so there need not be any single delegation, or any single scientist, who endorses the conjunction; and the conjunction may sit awkwardly with what the authors concluded. Does the procedure assume that sentence-level assent aggregates into document-level assent, and if so, is that assumption ever licensed rather than merely hopeful?

  Deletion is the fallback: a line that cannot be agreed disappears, while the finding survives in the accepted chapter. What does that imply about the epistemic status of the Summary — that it tracks what is true, or what is uncontested? Are those the same quantity under this design, and what happens to the authority of the document in the cases where they come apart?

  Does the distinction between accepting the chapters and approving the Summary encode a real philosophical difference between an author's warrant and a party's assent? Is it coherent to require that a text approved by interested states be faithful to a text that no state approved?

  And the tension I cannot resolve: how does a procedure in which governments negotiate the wording of factual sentences square with the claim to be neutral with respect to policy? Which of the two is the practice actually committed to, and what would the abandoned commitment look like if we built the institution around it instead — publishing the distribution of authors' confidence with no government approval at all, recording which delegations objected to which lines, or treating the Summary as a registry of non-objections rather than as a claim about the world?

  Throughout, please separate what the procedure strictly presupposes from what it merely sits well with, and mark the places where the design is underdetermined — where an epistemic story, a legitimacy story, and a coordination story would all license exactly the same rules.
reasoning: |-
  Okay, this is a remarkably sophisticated question about the epistemology and political philosophy underlying the IPCC's consensus mechanism. The user is clearly a specialist science or policy journalist wrestling with the deeper contradictions in how scientific knowledge becomes "agreed" by governments. 

  Hmm, they've perfectly identified the central tension: a process designed to be policy-neutral actually involves governments negotiating scientific statements. The description of the SPM approval process is meticulous - they've done their homework on bracketed text and fallback deletion. What they're really after is the unstated philosophical scaffolding.

  Let me unpack layer by layer. First, the line-by-line approval ritual: this isn't about shared belief but what Pettit would call "common avowal." When a delegation doesn't object, they're not affirming truth but accepting the statement as negotiable currency. The procedure cleverly avoids requiring any delegate to personally endorse anything - it's all about what the collective can live with.

  The document/sentence disjuncture is fascinating. By aggregating sentence-level non-objections into a "consensus document," the IPCC creates what List and Pettit call a "group agent" - an entity that "holds positions" no individual member necessarily endorses. This explains why contradictory statements can coexist: the group agent's "beliefs" aren't constrained by individual rationality.

  On epistemic status... ah, here's the rub. The SPM doesn't track truth but "negotiated uncontestability." What's fascinating is how the IPCC maintains dual credibility: scientists uphold the underlying report's truth-tracking, while governments treat the SPM as coordination device. The moment a finding becomes contested enough to be deleted from the SPM, its epistemic status doesn't change - but its political usability does.

  The neutrality fiction is perhaps the most brilliant institutional innovation. By requiring government approval but forbidding prescription, the IPCC creates what Habermas would call "communicative rationality" - the negotiation is about wording, not policy. But the user's right: when Saudi Arabia insists on "could" instead of "will," that's policy shaping science communication. The procedure's genius is making this look neutral through shared vocabulary rules.

  For underdetermined aspects... yes! The deletion rule equally serves truth (removing uncertainty), legitimacy (avoiding imposition), and coordination (keeping everyone aboard). And the distinction between chapter acceptance and SPM approval? It's philosophically incoherent but institutionally vital - scientists get epistemic authority, governments get procedural legitimacy.

  What the user might not have said outright: this whole arrangement is a high-wire act. The moment governments perceive the SPM as too prescriptive, or scientists see it as too diluted, the credibility collapses. But for now, it works because all parties need it to work - which is perhaps the deepest unstated premise of all.
answer: |-
  Your analysis cuts to the heart of the IPCC's epistemic and political architecture. Below is a reconstruction of its philosophical presuppositions, separating necessary assumptions from contingent justifications, and highlighting tensions:

  ### 1. **Theory of Knowledge & Group Agency**
     - **Sentence-Level Assent as Proxy for Document-Level Agreement**  
       The procedure presupposes that *non-objection* equals *provisional assent* for coordination purposes. It does not require belief in truth, but *acceptance as a basis for collective action*. A failure to object signifies:  
       - *Commitment not to publicly contest* the statement in policy forums.  
       - *Recognition* that the sentence falls within negotiated boundaries of plausibility.  
       - **Not**: Shared belief, personal endorsement, or assertion of factual certainty.  
       - **Group Agency Fiction**: The IPCC constructs a "corporate agent" (the Panel) whose "position" emerges from the aggregation of non-objections. This agent's "beliefs" (the SPM) need not align with any individual delegation's or scientist's views (List & Pettit’s *aggregation paradox*).

  ### 2. **Sentence vs. Document Authority**
     - **Underdetermined Assumption**: The design assumes document-level coherence *emerges* from sentence-level approval. This is *not logically licensed* (e.g., mutually inconsistent sentences may survive if no coalition objects to both).  
     - **Practical Justification**: The SPM is treated as a *tool for coordination*, not a philosophical treatise. Its authority derives from:  
       - *Procedural legitimacy* (all had veto power).  
       - *Epistemic anchoring* (traceability to underlying chapters).  
       - **Critical Gap**: The "consensus" is over negotiability, not truth. The document’s coherence is *political*, not logical.

  ### 3. **Epistemic Status of the SPM: Truth vs. Uncontestability**
     - **Presupposition**: The SPM tracks *what governments agree to say publicly*, not what is most likely true. Deletion implies:  
       - A finding is *too contested for coordinated policy action*, not necessarily uncertain.  
       - The underlying report retains *epistemic authority*; the SPM holds *procedural authority*.  
     - **Tension Point**: When truth and uncontestability diverge (e.g., high-confidence findings deleted due to political resistance), the SPM’s claim to "faithfulness" becomes performative—it relies on the *symbolic link* to the chapters, not substantive alignment.

  ### 4. **Chapter Acceptance vs. SPM Approval: Philosophical Divide**
     - **Authors’ Warrant (Chapters)**: Scientists assert *epistemic validity*: "This reflects current science."  
     - **Parties’ Assent (SPM)**: Governments assert *political usability*: "We can base policy on this without domestic rupture."  
     - **Coherence Check**: Requiring the SPM to be "faithful" to the chapters is *not philosophically incoherent* if:  
       - Fidelity is judged *procedurally* (scientists verify no distortion).  
       - But it creates *institutional schizophrenia*: Scientists guard truth, governments negotiate communication. The SPM becomes a *boundary object*—simultaneously scientific and political.

  ### 5. **Neutrality Tension: Negotiating Facts vs. Policy Prescription**
     - **The Core Contradiction**: Negotiating factual wording *is* policy intervention. Examples:  
       - Changing "will" to "could" alters perceived urgency.  
       - Deleting regional impacts avoids liability discussions.  
     - **Procedural Commitment**: Neutrality is upheld *formally* by:  
       - Banning policy prescriptions (e.g., "must phase out coal").  
       - Limiting negotiations to *how* findings are worded, not *what* findings exist.  
     - **De Facto Reality**: Governments shape risk narratives to influence policy options. The IPCC’s neutrality is *procedural*, not substantive.

  ### Underdetermined Design Elements
     - **Deletion as Fallback**: Serves multiple masters equally:  
       - *Epistemic*: Removes less certain claims (optimistic view).  
       - *Legitimacy*: Avoids imposing contested claims.  
       - *Coordination*: Preserves coalition stability.  
     - **Non-Objection = Assent**: Could reflect belief, pragmatism, or coercion—the procedure works regardless.

  ### Alternative Institutional Logics
     Your tension resolves by recognizing the IPCC prioritizes *coordination* over pure epistemology. Alternatives would imply:  
     - **Epistemic Purism** (no government approval): Higher scientific credibility, lower policy uptake.  
     - **Explicit Contestation** (recorded objections): Transparent but fractures "consensus" legitimacy.  
     - **Registry of Non-Objections**: Undermines the SPM’s authority as a "report."  

  ### In Sum
  The IPCC’s procedure presupposes:  
  1. **Group agency** emerges from aggregated non-objections.  
  2. **Political usability** supersedes epistemic purity in the SPM.  
  3. **Neutrality** is maintained by restricting negotiations to wording, not substance.  
  4. **Legitimacy** derives from process, not philosophical coherence.  

  The unspoken wager: That scientific truth (chapters) + procedural buy-in (SPM) = actionable authority. When truth and negotiability clash, the design masks the rupture—a fragility disguised as a feature.
