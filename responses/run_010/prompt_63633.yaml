prompt: |-
  I am a third-year undergraduate taking a seminar on classical Indian epistemology, and I also work eight hours a week as a volunteer intake screener for a small regional environmental-health nonprofit. Residents send us reports of possible local hazards — a solvent smell from tap water, a creek that has changed colour, a cluster of illnesses near a facility — and for each one I have to record one of three dispositions: open an investigation, decline with reasons on file, or park pending clarification. I receive ten to fifteen reports a week and have about thirty minutes per report. We have no in-house scientists and no laboratory budget to speak of, so I almost never have a measurement in hand when the decision is due; what I have is what people say, what they describe seeing, and whatever published material they attach. A two-person committee reviews my dispositions afterward, the file rationale has to be intelligible to volunteers who have never taken a philosophy course, and because we occasionally receive legal threats the rationale has to show the reasoning rather than just the outcome. Declining a genuine hazard harms people; opening frivolous investigations exhausts our budget and creates liability.

  What I want is a triage procedure built on the Nyāya account of the pramāṇas, which I have been reading this term. Here is my crib sheet, in functional terms rather than Sanskrit, and I would like you to correct it where I have got it wrong or where I am importing something that belongs to a neighbouring school — I know the three conditions on a sound reason are codified more explicitly by the Buddhist logicians, and that the conditions on sentence comprehension are shared with Mīmāṃsā. Tell me plainly rather than working around my errors.

  First, a report should be sorted by which source it actually rests on, because the checks differ by source: direct perception, inference from a sign, identification by comparison with a known case, and testimony. Second, before any of that, a report has to be comprehensible at all — the words must hang together, must be semantically compatible, must be mutually expectant, and the speaker's intended purport must be recoverable. Third, an inferential reason must be present in the case at hand, present in the known positive instances, and absent from the negative instances; the defective-reason catalogues in my readings differ by author, but they cluster into a reason that is too wide, a reason that is too narrow because it has no positive instances outside this one case, a reason that is non-exclusive because the subject term sweeps in everything, a reason that is itself unverified, a reason that actually supports the opposite conclusion, a reason counterbalanced by an equally strong opposing reason, and a reason that is mistimed — true of the target once, but no longer. Fourth, testimony carries warrant only from a trustworthy speaker, analysed as someone who is competent, honest, and communicating what they actually know; I want to treat competence, honesty, and access as three separate screens, since a witness can be impeccably honest about something they could not possibly have perceived.

  The deliverable I am after is a procedure a volunteer can run in thirty minutes: gates in a fixed order, what counts as passing each, what each failure routes to (decline, park, or escalate to the committee), and the exact wording of the file rationale, which I would like to follow the five-member form — claim, reason, the generalisation together with a known instance, the application to this case, the conclusion — because that form forces the screener to name the pervasion and produce a positive instance, which is where weak reports tend to fail. Tell me if that form is a straitjacket on paper and, if so, what to cut.

  Then run the procedure on four cases. (1) A retired teacher with a long record of accurate reports and no discernible grievance says her tap water has smelled of solvent for three weeks and that her neighbour's dog died the same week; she has no measurements and cannot say what is in the water. (2) A community group submits a 200-signature petition about a cluster of childhood asthma cases near a plant, with an attached study from another country published in the late 1990s, arguing that the plant emits a substance known to cause asthma and therefore caused the cluster; a clinic report in the same packet shows local asthma presentations falling over the same period. (3) A report consisting almost entirely of comparison: the smell, the discoloured creek, and the dead fish are said to be exactly like an incident in another town a decade ago, which the writer treats as settling what the cause is here. (4) Briefly, a voicemail transcript so fragmentary that I cannot reconstruct what is being claimed.

  I want one of these to come out against my own sympathies — if the procedure declines or parks the retired teacher's report in case (1), say so and show me why, rather than bending the gates to open it. Mark every point where judgment cannot be eliminated, and state which distinctions from the theory must survive the simplification and which can be dropped without loss. Finally, be explicit about what the procedure cannot do: I suspect Nyāya tells me when a cognition is veridical and which source produced it, but says nothing about how much warrant is enough to spend money on, nothing about how to rank two pramāṇas when they conflict, and nothing about prevalence or base rates. If that is right, identify precisely where the procedure stops being epistemology and hands the disposition to the committee's values, and draft the sentence I should put in the file at that point.
reasoning: |-
  Hmm, the user is a third-year philosophy student working part-time screening environmental hazard reports. They need a triage procedure based on Nyāya epistemology that can handle real-world limitations: no lab data, tight deadlines, and legal risks. Their crib sheet shows solid grasp of core concepts - pramāṇas, hetvābhāsas, śābdabodha - but I should verify where they might be importing Buddhist or Mīmāṃsā elements.

  Key constraints jump out: 30 minutes per report, no scientific resources, rationale must withstand legal scrutiny while being understandable to non-philosophers. The five-member syllogism form could work well - it structures reasoning transparently. But I'll need to simplify complex elements like sādr̥śya without losing epistemic rigor.

  For case (1): The teacher's report relies on pratyakṣa (smell) and śabda (her testimony). Her credibility passes āpta checks easily, but inference fails - no verified connection between solvent smell and dog death, no positive instances. Must decline despite sympathies.

  Case (2) is tricky. The foreign study constitutes śabda testimony about causation, but competence/context checks fail - different country, outdated. The contradictory clinic report creates a viruddha hetvābhāsa. This needs parking for better evidence.

  Case (3) hinges on upamāna. The comparison to past incident only works if relevant similarities are established - which they aren't procedurally. The "exactly like" claim doesn't substitute for proper inference.

  Case (4) fails śābdabodha at the word level - can't even form a cognition. Immediate decline.

  Biggest gap: Nyāya doesn't resolve value tradeoffs. When inference meets minimum validity standards but risk/benefit is unclear? That's where the committee takes over. The transition point needs explicit documentation: "Epistemic warrant established per procedure; disposition based on resource allocation priorities."
answer: |-
  Here's a triage procedure based on Nyāya epistemology, corrected where needed, streamlined for your operational constraints, and applied to your cases. Key simplifications and judgment points are marked.

  **Corrected Nyāya Crib Sheet & Simplifications:**
  1.  **Pramāṇa Sorting:** Correct. Sources are Pratyakṣa (perception), Anumāna (inference), Upamāna (comparison), Śabda (testimony). *Simplification:* Treat "identification by comparison" strictly as Upamāna (recognizing similarity to a known class/object). Avoid importing Buddhist "analogical inference".
  2.  **Śābdabodha (Sentence Comprehension):** Correct. Requires syntactic fitness (yogyatā), semantic consistency (ākāṅkṣā), contiguity (āsatti), and intent (tātparya). *Simplification:* Collapse into "Is the report intelligible? Can you understand what hazard is being claimed, where, when, and by whom?" Unintelligible = Decline.
  3.  **Anumāna (Inference) & Hetvābhāsa (Defective Reasons):**
      *   **Correction:** The 3 conditions are Pakṣadharmatā (reason present in subject), Sapakṣasattva (present in positive examples), Vipakṣāsattva (absent in negative examples). This is core Nyāya.
      *   **Defects:** Your list is broadly correct and captures Nyāya/Buddhist overlaps (Naiyāyikas like Udayana elaborate extensively). Key Nyāya defects: *Asiddha* (unestablished reason), *Anaikāntika* (non-exclusive - too wide/narrow/lacking negative instances), *Viruddha* (contradictory), *Bādhita* (counterbalanced), *Kālātīta* (mistimed). *Simplification:* Focus on fatal flaws:
          *   Is the reason *actually present* here? (Pakṣadharmatā)
          *   Is there *at least one known, verified case* where this reason *always* correlates with the hazard? (Sapakṣasattva - simplified)
          *   Is there *any known, verified safe case* possessing this reason? (Vipakṣāsattva - simplified)
          *   Is the reason directly contradicting the claim or countered by strong evidence? (Viruddha/Bādhita)
      *   *Judgment Point:* Assessing "known cases" relies on screener's general knowledge/database. "Verified" means established via pramāṇa elsewhere.
  4.  **Śabda (Testimony) & Āptavākya (Trustworthy Speaker):** Correct. Trustworthiness requires Competence (jñāna), Honesty (āprāṇatā), and Communication of known truth (tathārthavaktṛtva). *Simplification:* Screen sequentially: Competence -> Honesty -> Access. A speaker can be honest but incompetent or lack access. *Judgment Point:* Assessing competence/access requires context.

  **The Triage Procedure (30-Minute Flowchart):**

  1.  **Gate 0: Comprehensibility (Śābdabodha)**
      *   **Check:** Can you clearly understand: a) What hazard is claimed? b) Where? c) When? d) By whom? (Provide contact).
      *   **Pass:** Proceed to Gate 1.
      *   **Fail:** **Disposition: Decline (D)**. **Rationale:** "Report unintelligible. Unable to identify claimed hazard, location, timing, or reporter contact sufficiently."
      *   *Judgment Point:* Does the report provide enough *basic* info? Fragments fail here.

  2.  **Gate 1: Identify Primary Pramāṇa**
      *   **Check:** What is the reporter's *main* source for the hazard claim?
          *   **Pratyakṣa (Perception):** Reporter claims direct sensory experience (saw, smelled, heard, felt symptoms).
          *   **Anumāna (Inference):** Reporter provides a *reason* (sign/evidence) for the hazard.
          *   **Upamāna (Comparison):** Reporter says "It's *just like* [known case X]".
          *   **Śabda (Testimony):** Reporter relies on someone/something else's word (study, expert, neighbor, news).
      *   **Pass:** Proceed to the specific pramāṇa gate (2a, 2b, 2c, 2d). If multiple, use the *most specific/primary* one claimed.
      *   *Judgment Point:* Classifying the primary source. Ambiguity is common. Default to most concrete claim if unsure.

  3.  **Gate 2a: Pratyakṣa (Perception) Check**
      *   **Check:** Is the reported perception plausible and relevant? (e.g., solvent smell is plausible for water; seeing a pink elephant is not). Does the reporter seem competent to identify it? (e.g., a chemist smelling solvent > a child).
      *   **Pass:** Proceed to Gate 3 (Testimony Check on Reporter).
      *   **Fail:** **Disposition: Park (P)** or **Decline (D)**. **Rationale:** "Reported perception [describe] is implausible [explain why] or reporter lacks clear competence to identify it." (Park if plausibility hinges on external info; Decline if clearly implausible).
      *   *Judgment Point:* Plausibility & Competence assessment. Uses general knowledge.

  4.  **Gate 2b: Anumāna (Inference) Check (Focus on Reason - Hetu)**
      *   **Check:** Is there a clear reason (Hetu) provided for the hazard?
          *   **Yes:** Apply simplified 3 conditions:
              *   **Pakṣadharmatā:** Is the reason *present* in this case? (e.g., Is the alleged substance *actually emitted* here?).
              *   **Sapakṣasattva (Simplified):** Is there *at least one known, verified case* where this reason *always* correlates with this hazard? (Cite it).
              *   **Vipakṣāsattva (Simplified):** Is there *any known, verified safe case* possessing this reason *without* the hazard? (If yes, defect).
          *   **No:** Inference fails.
      *   **Pass (Reason present & Sapakṣa exists & no known Vipakṣa):** Proceed to Gate 3 (Testimony Check on source of reason/report).
      *   **Fail (Reason absent, No Sapakṣa, Known Vipakṣa, or Contradiction):** **Disposition: Park (P)** or **Decline (D)**. **Rationale:** Use 5-member form *to show the flaw*:
          *   Claim: [Hazard exists at location]
          *   Reason: [Reason provided]
          *   Generalisation + Known Instance: "Whenever [Reason] is present, [Hazard] occurs. For instance, in [Known Case]." OR "No known verified instance where [Reason] leads to [Hazard]." OR "In [Known Safe Case], [Reason] is present but [Hazard] is absent."
          *   Application: "Here, [Reason] is [Present/Absent/Unverified]."
          *   Conclusion: "Therefore, the inference [is unsupported/fails]."
      *   *Judgment Point:* Identifying/verifying known cases (Sapakṣa/Vipakṣa). Severity of defect (Park vs Decline).

  5.  **Gate 2c: Upamāna (Comparison) Check**
      *   **Check:** Is the known case (X) cited *verifiably similar* in *relevant aspects* to *this* case? Is X itself a *verified* hazard case? Does the similarity *directly imply* the *same cause/hazard*?
      *   **Pass:** Proceed to Gate 3 (Testimony Check on source of knowledge about X/report).
      *   **Fail:** **Disposition: Park (P)** or **Decline (D)**. **Rationale:** "Comparison to [Case X] is invalid. Similarities [list] are insufficient to establish the same hazard/cause here." OR "Case X itself is unverified regarding the claimed hazard/cause." (Park if similarity/case verification is possible; Decline if irrelevant/unverifiable).
      *   *Judgment Point:* Relevance and sufficiency of similarity. Verification status of known case.

  6.  **Gate 2d: Śabda (Testimony) Source Check**
      *   **Check:** Who/what is the source of the testimony (e.g., study, expert, neighbor, news)? Apply sequential screens *to this source*:
          *   **Competence:** Is the source knowledgeable about this *specific* hazard/context? (e.g., Relevant scientist > local gossip).
          *   **Access:** *Could* the source have known the truth? (e.g., Did they measure? Were they present? Is their method sound?).
          *   **Honesty:** Is there evidence the source intends to deceive? (Red flags: clear bias, financial stake, history of fabrication).
      *   **Pass (All 3 plausible):** Proceed to Gate 3 (Testimony Check on Reporter - if different source).
      *   **Fail (Any screen fails):** **Disposition: Park (P)** or **Decline (D)**. **Rationale:** "Source [Name/Role] lacks [Competence/Access/Honesty] regarding this claim. [Brief reason]." (Park if verifiable; Decline if clear failure like anonymous gossip).
      *   *Judgment Point:* Assessing Competence, Access, Honesty of the source. Requires context.

  7.  **Gate 3: Reporter Testimony Check (Śabda on Reporter)**
      *   **Check:** Apply sequential screens (Competence, Access, Honesty) *to the reporter themselves* regarding *their own report* (especially for Pratyakṣa/Upamāna/Simple Inference). Consider: Location (were they there?), Sensory capacity, Expertise, History of reports (accurate? grievances?), Potential bias.
      *   **Pass (All 3 plausible):** Proceed to Gate 4.
      *   **Fail (Any screen fails):** **Disposition: Park (P)** or **Decline (D)**. **Rationale:** "Reporter lacks [Competence/Access/Honesty] regarding this report. [Brief reason e.g., not present, history of unsubstantiated claims on topic, clear conflict]." (Park if ambiguity; Decline if clear failure).
      *   *Judgment Point:* Assessing Reporter's trustworthiness. History is crucial here.

  8.  **Gate 4: Conflict Check & Final Warrant (Bādhita)**
      *   **Check:** Is there *strong, credible evidence* *directly contradicting* the hazard claim? (e.g., recent tests showing safety, verified alternative explanation).
      *   **Pass (No strong contradiction):** **Disposition: Open Investigation (O)**. **Rationale:** Use 5-member form *affirming* the claim where possible, or state clearly: "Claim based on [Pramāṇa] passes screens for comprehensibility, source validity, and reporter trustworthiness. No strong contradictory evidence identified. Investigation warranted to verify."
      *   **Fail (Strong contradiction exists):** **Disposition: Decline (D)** or **Park (P)**. **Rationale:** "Credible evidence [describe source/evidence] contradicts the hazard claim [state claim]. [Explain contradiction]." (Decline if contradiction is strong/verified; Park if ambiguous).
      *   *Judgment Point:* Strength and credibility of contradictory evidence. *Massive Caveat:* Nyāya epistemology stops here. It assesses if the report provides a *warranted cognition* (pramā). **It does NOT tell you:**
          *   **Resource Allocation:** How serious is the *potential* harm? How costly is investigation? How many people affected? (Committee's Value Judgement)
          *   **Conflicting Pramāṇas:** How to weigh a strong Anumāna against a strong contradictory Śabda? (Needs Committee - state the conflict)
          *   **Base Rates/Prevalence:** How common are such reports/hazards? (Not addressed by pramāṇa theory).
      *   **Transition Sentence for File:** "Epistemic warrant for the claim established per procedure. Disposition based on resource allocation priorities and assessment of potential harm severity by committee review." *Use this ONLY if Gate 4 Passes but resource/harm assessment is the deciding factor for O/D/P.*

  **Is the 5-Member Form a Straitjacket?**
  No, it's ideal for your needs. It forces clarity on the *crucial* elements: the universal connection (vyāpti) and an example (udāharaṇa). This is exactly where weak inferences fail. Use it primarily for **Anumāna dispositions (Pass/Fail)** and the **Final Rationale for Opening**. For Declines/Parks based on other failures (Comprehensibility, Source Trust, Reporter Trust, Upamāna flaw), a concise sentence explaining the specific failure is sufficient and clearer for volunteers. Don't force it onto every disposition type.

  **Application to Cases:**

  *   **Case 1: Retired Teacher (Solvent Smell, Dead Dog)**
      *   **G0 (Comprehensibility):** Pass. Clear claim (solvent smell in water), location (her home), timing (3 weeks), reporter (identified).
      *   **G1 (Pramāṇa):** Primary = **Pratyakṣa** (smell). Secondary = Implied Anumāna (smell linked to dog death?)/Śabda (her testimony).
      *   **G2a (Pratyakṣa):** Pass. Solvent smell in water is plausible. Teacher likely competent to identify unusual smells.
      *   **G3 (Reporter Śabda):** **Pass.** History of accuracy -> High competence/honesty. She was present -> Access. No discernible grievance -> Honesty.
      *   **G4 (Conflict):** Pass. No strong contradiction provided.
      *   **Disposition: Open Investigation (O)**
      *   **Rationale (5-member for the core claim):**
          *   Claim: Hazardous contaminant present in water at [Address].
          *   Reason: Persistent solvent smell detected in tap water (Pratyakṣa).
          *   Generalisation + Known Instance: Solvent smells in drinking water are reliable indicators of potential chemical contamination harmful to health. For instance, in [Cite a known local/national incident if possible, or general knowledge - e.g., Camp Lejeune].
          *   Application: Reporter, a reliable witness with history of accurate reports, detected a persistent solvent smell in her tap water.
          *   Conclusion: Therefore, an investigation is warranted to verify potential contamination.
      *   *Why not the dog?* The dog death is an *additional* claim lacking Anumāna (no verified link between *this* smell and pet death specifically, no positive instance cited, could be coincidence). It's noted but doesn't drive the disposition. The smell alone, from a credible witness, warrants investigation.

  *   **Case 2: Asthma Cluster Petition (Foreign Study, Contradictory Clinic Data)**
      *   **G0 (Comprehensibility):** Pass. Clear claim (asthma cluster caused by plant emissions), location (near plant), timing (implied recent), reporters (community group).
      *   **G1 (Pramāṇa):** Primary = **Śabda** (The foreign study is the evidence for the substance causing asthma and thus being the reason).
      *   **G2d (Testimony Source - The Study):**
          *   **Competence:** Plausible (scientific study).
          *   **Access:** **FAIL.** Study is from another country and 25+ years old. Context (environmental factors, regulations, specific substances) likely significantly different. Cannot assume access/knowledge transfers to *this* location/time. Also, it argues general causation, not specific causation here.
          *   (Honesty: Plausible, no red flags).
      *   **Disposition: Decline (D)** (Access failure is fatal for using this study as proof for *this* case).
      *   **Rationale:** "The primary evidence submitted, a study from [Country] published in the late 1990s, lacks Access to the relevant conditions at [Location] in the present time. Environmental factors, regulations, and specific emissions profiles differ significantly, preventing reliable application of its findings to establish causation for this reported cluster. Additionally, attached clinic reports show local asthma presentations falling during the period, contradicting the claim of a rising cluster (noted as potential Viruddha/Bādhita, though not primary reason for decline)."
      *   *Why not my sympathies?* The procedure catches the study's lack of relevance (Access) to *this* location and time. The contradictory clinic data reinforces the decision but isn't the primary flaw. Petition signatures are Śabda, but the signatories generally lack Competence/Access on the *specific causation claim*; their testimony is only valid for "we are concerned/observe illness" (which passes G2d/G3, but isn't sufficient for causation).

  *   **Case 3: Comparison to Past Incident (Smell, Creek, Fish)**
      *   **G0 (Comprehensibility):** Pass. Claim (Hazard like past incident), location, timing, reporter clear.
      *   **G1 (Pramāṇa):** Primary = **Upamāna** (Comparison).
      *   **G2c (Upamāna Check):**
          *   **Relevant Similarity?** Smell, discoloration, dead fish are surface similarities. Are the *causes* known to be identical? Are environmental conditions identical? Unverified. "Exactly like" is an assertion, not proof.
          *   **Verified Past Case?** Assumed, but not independently verified *by the screener* (Was cause definitively established? Was it the *same* cause implied here?).
          *   **Implies Same Cause?** Insufficient. Similar effects ≠ same cause.
      *   **Fail:** **Disposition: Park (P)**
      *   **Rationale:** "Report relies on comparison to a past incident. While similarities in observations (smell, discoloration, dead fish) are noted, the relevance of these similarities to establishing the *same specific cause* here is unverified and insufficient. The exact cause of the past incident and its applicability to this location under current conditions requires clarification before comparison can be considered valid evidence (Upamāna). Please provide documentation verifying the cause of the past incident and its relevance to this location."
      *   *Judgment Point:* Deciding similarity was insufficient. Park allows requesting the needed verification.

  *   **Case 4: Fragmentary Voicemail**
      *   **G0 (Comprehensibility):** **FAIL.** Cannot reconstruct claimed hazard, location, timing, or reliable contact.
      *   **Disposition: Decline (D)**
      *   **Rationale:** "Report (voicemail transcript) is unintelligible. Unable to determine the nature of the claimed hazard, its specific location, timing, or obtain reliable contact information for clarification. Insufficient information for assessment."

  **Where Nyāya Stops & Committee Values Begin:**

  Nyāya's pramāṇa theory answers: **"Does this report provide a justified (warranted) belief (pramā) that a specific hazard exists here and now?"** It validates the *cognition*.

  It **does NOT** answer:
  1.  **"Is this justified belief *serious enough* to warrant our limited resources?"** (Potential harm severity, number affected, cost of investigation vs. budget - Committee Values).
  2.  **"How do we *weigh* two conflicting warranted cognitions?"** (e.g., A strong Pratyakṣa report vs. a recent contradictory Śabda from an official test - Committee Judgment needed on reliability hierarchy).
  3.  **"What is the background probability (base rate) of such hazards/reports?"** (Not part of pramāṇa validation).

  **The Transition Point:** **After Gate 4 (Conflict Check).** If a report passes G0-G4, Nyāya says the *cognition is warranted*. However:
  *   If the warranted claim is deemed *low risk* or *too costly* to investigate relative to resources, the Committee should **Decline** based on values.
  *   If there's a **conflict** between this warranted cognition and *another* warranted cognition (e.g., official data), the Committee must resolve it.

  **Draft File Sentence for Value-Based Disposition after Epistemic Pass:**
  > "Epistemic warrant for the claim of [Specific Hazard] at [Location] established per procedure based on [Pramāṇa - e.g., credible direct report]. However, disposition to decline investigation based on committee assessment of limited potential harm severity/scope [or] disproportionate resource requirements relative to other priorities [or] conflict with equally warranted data from [Source]."

  This procedure provides rigorous, defensible, Nyāya-based epistemic screening within 30 minutes. It clearly separates the question of "Is this report credible?" from "Is this credible report worth investigating with our limited means?", forcing explicit rationale at each step, especially for inference.
