prompt: |-
  I serve on the grants committee of a community foundation in a post-industrial city of roughly 85,000, and I have to circulate a decision memo before our September meeting. Eight years ago a local man who made his money in industrial fasteners died and left the foundation about $5.4 million along with a single handwritten page of instruction, which his daughter has now read aloud to the board twice: the money is to be spent "helping this town learn how to live, not merely how to make a living," and the mechanism is left entirely to our discretion. I keep being pulled back to Keynes's 1930 essay on the economic prospects of his grandchildren — the one quoted in every automation essay ever written, in which a fifteen-hour week figures as the expected end point — because the donor appears to be asking us to fund the thing Keynes thought would be genuinely difficult, while nearly everyone around our table is proposing to fund the thing he thought was easy. I should add that I have read the rationalist blogs since before they were respectable and I can usually spot motivated cognition in myself, which is why I want to disclose that I own a banjo and a woodlot and that this is probably not irrelevant to my enthusiasm for the third proposal below.

  Staff have narrowed the field to three, each costed at about $4 million over five years with the balance held in reserve. The first subsidizes a four-day week for two years at eight participating local employers: hours down a fifth, pay held level, evaluated on retention and a well-being survey. The second is an unconditional annual grant of $2,500 to roughly 700 residents below a household-income threshold, marketed in the staff paper as buying back one's Saturdays, with no strings attached; a pilot survey we commissioned suggests most recipients would spend it retiring a second job or a gig shift rather than not working. The third funds what the program officer calls an arts-of-life network: paid apprenticeships and open-ended small grants in gardening, repair, music, cooking, local history, and conversation, explicitly non-vocational, with no deliverable required of anyone who takes part. The board is split three ways. One faction holds that only the first two respect recipients as agents of their own lives, since the third presumes to know what living well looks like and will end up, as these things do, funding hobby classes for the already comfortable. Another holds that the first two simply hand people more means — more money, more unclaimed hours — which on Keynes's own diagnosis is not the binding constraint at all, and that a donor who wrote the sentence above would be appalled to see it spent on wages. The third faction, which includes our two members with labor backgrounds, notes that something like 40 percent of our working-age clients hold more than one job, that median household income here is under $46,000, and that the entire framing is condescending to people whose difficulty is not that they lack the art of life but that they lack the money to practice any art at all. One of them recalled that Keynes himself thought the wrench would fall hardest on people with no roots and no accumulated habits of leisure to fall back on, and asked whether we are proposing to convert a working-class town into the rentier class's hobby farm, at its own expense.

  Please draft the memo I circulate: a decision document with an actionable bottom line, not a survey, and no bibliography or footnotes, since three of the seven members will not read past the second page. It should come down to a recommendation — fund one, sequence two, or reject the set and specify precisely what to send back to staff — together with a defensible timeline and a stated condition under which we would abandon it. I want it to engage Keynes's argument in substance rather than by name-checking: the distinction he draws between absolute and relative needs and his claim that the relative ones are insatiable, his diagnosis of the habit of always pushing the meaning of one's life into the future and postponing enjoyment, and his insistence that the transition rather than the scarcity is the hard part. It should say plainly whether any of that actually licenses the third proposal, or whether I am using a dead economist to launder my own taste in hobbies. Two difficulties I would especially like pressed on. First, I cannot find an objective function for this decision that does not collapse into Goodhart's law the moment staff see it: hours worked, self-reported satisfaction, take-up rate, and number of completed projects each reward the wrong behavior somewhere, and I would rather the memo name that problem and propose something workable than paper over it with a balanced scorecard. Second, I do not have an answer to the revealed-preference objection buried in the second paragraph, which strikes me as the strongest thing that will be said in that room; at present I have nothing better than an appeal to preference formation, which sounds like a way of saying that people want the wrong things and we know better. Treat the labor faction's objection at length and honestly. If the honest conclusion is that we should not fund the arts-of-life program, say so and say why; if the objection is better answered by redesign than by retreat, show me the redesign — who gets chosen, who pays, and what would have to be true for it not to be the paternalism it looks like.
reasoning: |-
  Hmm, the user is on a grants committee for a community foundation in a post-industrial city. They need to draft a decision memo about how to spend a $5.4 million donation meant to help the town "learn how to live, not merely how to make a living." There are three proposals on the table: subsidizing a four-day work week, providing unconditional cash grants, or funding an "arts-of-life network" focused on non-vocational activities. The committee is deeply divided, and the user wants to engage with Keynes's economic ideas about leisure and human fulfillment.

  I need to understand the core dilemma. The donor's instructions point toward what Keynes called "the permanent problem of the human race"—how to live well once material needs are met. Yet the town still faces economic hardship, with many residents working multiple jobs. The three factions represent different interpretations: one sees agency in giving money/time, another thinks resources aren't the bottleneck, and the labor faction argues this overlooks material deprivation.

  Keynes's key insights that need addressing include: the distinction between absolute needs (which can be satisfied) and relative needs (which are insatiable), the human tendency to postpone enjoyment, and the difficulty of transitioning to a life focused on non-economic activities. The user worries their preference for the arts program might just reflect personal hobbies.

  The memo must recommend one option, not just analyze. It should tackle two big problems: how to measure success without perverse incentives (Goodhart's Law), and how to answer the revealed-preference objection (if people choose work over leisure, who are we to override that?).

  For the arts-of-life proposal, the paternalism concern is real. To address it, the program would need design changes: targeting those with time but no resources, avoiding "hobby classes for the comfortable," and ensuring participation isn't seen as wasteful. Maybe partner with community centers in low-income neighborhoods.

  The labor faction's point is strong: for many, the barrier isn't knowing how to live well but lacking money. The memo should acknowledge this but argue that the donor's intent was specifically about the "living" vs. "making a living" distinction. A sequenced approach might work—start with immediate relief (cash grants) then build capacity for leisure.

  The user's self-awareness about their banjo/woodlot interests is refreshing. The memo should validate that these concerns exist but focus on structural arguments.

  For the objective function, simple metrics like participation rates or completed projects could backfire. Better to use mixed methods: qualitative stories plus shifts in time use, avoiding reduction to a single KPI.

  Ultimately, the strongest path might be to sequence options: start with the cash grants (addressing immediate needs while respecting agency), then fund the arts network once basic stability is improved. This honors both the labor faction's concerns and the donor's vision. The recommendation should include clear conditions for pivoting if uptake is low or funds misused.
answer: |-
  **MEMORANDUM**  
  To: Grants Committee Members  
  From: [Your Name]  
  Date: August 29, 2024  
  Subject: Recommendation for "Living vs. Making a Living" Initiative  

  ### I. Core Recommendation  
  **Fund Proposal 3 ("Arts-of-Life Network") with redesign to address labor concerns, sequenced after a 1-year pilot of Proposal 2 (cash grants).**  
  - **Year 1:** Launch unconditional $2,500 grants to 700 income-qualified households (total $1.75M).  
  - **Year 2+:** Arts Network launches with targeted eligibility, co-funding requirements, and labor participation safeguards (total $2.25M over 4 years).  
  - **Reserve:** $1.4M held for contingencies.  
  *Exit Condition*: Abandon Arts Network if <30% of Year 1 cash recipients report persistent income insecurity after 18 months.  

  ### II. Why This Path Addresses the Donor’s Intent  
  The donor’s challenge—shifting focus from survival to flourishing—mirrors Keynes’ diagnosis: *The real struggle isn’t scarcity itself, but adapting to abundance*. His insight that humans "prefer to postpone enjoyment" and confuse relative wants (insatiable) with absolute needs (solvable) clarifies why simply giving money/time (Proposals 1–2) risks perpetuating the cycle. They address *means*, not the *ends* the donor questioned.  

  **The arts proposal uniquely targets Keynes’ "hard part":**  
  - It cultivates *practices* (gardening, repair, conversation) that anchor meaning in the present—countering the habit of "pushing life into the future."  
  - It treats leisure as a **muscle to develop**, not a void to fill—addressing his fear that sudden free time without "accumulated habits" breeds despair.  

  ### III. Confronting Objections Honestly  
  **A. Labor Faction’s Valid Concern: "This is paternalism ignoring poverty"**  
  *Rebuttal with redesign:*  
  1. **Targeting:** Restrict apprenticeships/grants to households below 150% median income ($69K). Prioritize those receiving Year 1 cash grants.  
  2. **Labor Integration:** Partner with unions/worker centers to host "arts" programs at shift-change times, with childcare/stipends. Frame skills (e.g., repair, cooking) as *tools for autonomy*, not bourgeois hobbies.  
  3. **No "Deliverable" ≠ No Accountability:** Track *participation depth* (e.g., "returned 5+ times") not outputs. Success isn’t a painted landscape but a resident fixing their stove, then neighbors’.  

  **B. Revealed Preference Objection: "If people choose work over leisure, we must respect it"**  
  - Keynes anticipated this: Humans default to familiar economic striving when the "art of life" feels alien. The cash grant (Proposal 2) tests whether this is *true preference* or *learned necessity*.  
  - **Pilot Metric:** If >60% of cash recipients *voluntarily* reduce working hours after 12 months (per follow-up survey), we concede the objection. If not, the arts program offers a path to rewire habits.  

  ### IV. Avoiding Goodhart’s Law  
  We reject vanity metrics. Evaluation focuses on **three layered signals**:  
  1. **Cash Pilot (Year 1):** % reporting reduced financial anxiety (survey) + bank data on debt reduction.  
  2. **Arts Network:**  
     - *Participation:* # of first-time attendees from target ZIP codes.  
     - *Depth:* Median sessions attended per participant.  
     - *Spillover:* # of peer-led skill shares emerging organically.  
  3. **No composite scores.** Staff report raw data quarterly.  

  ### V. Why Not the Alternatives Alone  
  - **Four-Day Week (Proposal 1):** Risks subsidizing employers without changing culture. "Retention" metrics could mask suppressed wages.  
  - **Cash Grants Alone (Proposal 2):** Addresses immediate needs but not the donor’s deeper ask. Keynes: "Absolute needs satiate; relative needs enslave." Money alone cannot teach "how to live."  

  ### VI. Timeline & Accountability  
  | Phase       | Action                                             | Deadline     |  
  |-------------|----------------------------------------------------|--------------|  
  | Sept 2024   | Approve Recommendation; authorize cash grants      | Immediate    |  
  | Jan 2025    | Distribute first $2,500 grants                     | Q1 2025      |  
  | July 2025   | Arts Network design finalized; provider RFP issued | Q3 2025      |  
  | Jan 2026    | Arts Network launches (contingent on exit check)   | Q1 2026      |  
  | June 2026   | Final go/no-go for Arts Network based on pilot data | Q2 2026      |  

  **Bottom Line:** This path honors the donor by funding *both* relief and reimagining. The cash grant is not surrender to "making a living," but a controlled experiment to test whether residents are truly free to choose "living." The redesigned arts program is not hobbyism but community scaffolding for the transition Keynes foresaw as inevitable and perilous. If we shrink from this dual task, we reduce a visionary gift to mere income support—precisely what the handwritten note warned against.  

  **Recommended Vote:** Approve sequenced implementation as described.
