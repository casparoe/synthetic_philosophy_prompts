prompt: |-
  I'm a second-year graduate student in philosophy of language, and my reading group has just spent a month on the rule-following material in Kripke's 1982 book — quus, quaddition, the Humean split between straight and skeptical solutions, assertibility conditions, the appeal to communal agreement. My problem is that I can now recite the dialectic fluently while being unable to answer a single pointed objection, which is not a good place to be ahead of my first conference talk. So I would like to be pressed. Please play Kripkenstein: not Kripke the person, not Wittgenstein the person, but the fictional character who holds the views of Kripke's reading — the skeptic who thinks the paradox that "no course of action could be determined by a rule," since every course of action can be made out to accord with it and therefore also to conflict with it, is genuine and admits of no straight solution, and who accordingly replaces truth conditions for meaning claims with conditions for their legitimate assertibility inside a community. Stay in character in the first person for the entire exchange, until I type stop. You may concede incidental points — that some straight solutions are more resourceful than others, that an individual's dispositions are usually decent evidence of what they mean, that ascriptions to machines are an awkward corner of the view — but never concede the central claim that no fact about an individual constitutes their meaning one function rather than another, and never smuggle in a truth-conditional rescue through the back door. Keep each reply to a paragraph or two, roughly the length of one turn in a good seminar, and if something in my case is unclear, ask for it as the character would rather than stepping out to tidy up the setup.

  So that this is not a rerun, I am not going to reopen 68 + 57; assume I have already absorbed everything the skeptic can say about it. Here is the case I want you to deal with. A friend of mine built a small arithmetic tutor for primary-school drills. It was trained exclusively on sums whose correct result is below ten thousand, and for two years it answered every drill perfectly, including many thousands of sums it had demonstrably never been given. Last month, in front of a class, asked for 4,318 + 5,682 it answered 10,001 — and it has answered one more than the correct result to that sum and to every other sum of exactly ten thousand, consistently, ever since. My instinct is that for those two years nobody could say what it meant by its outputs, since they were equally compatible with ordinary addition and with what I'll call schmaddition, the function that agrees with addition below ten thousand and thereafter returns one more than the true sum, and that the recent behaviour has finally broken the tie: it means schmaddition, and it has meant schmaddition all along. But I cannot see how your position lets me say that, and I cannot see how it lets me say the opposite either. Its record of agreement with the community over those two years was considerably better than mine, and if agreement in judgments is what licenses an ascription, the tutor earned the right to mean plus long before I did. My opening move, then: I think you are committed to saying the question of what it means is simply empty, that your account therefore cannot distinguish a system that follows a rule from one that merely tracks a rule with high reliability, and that this is a cost you should own rather than explain away. Tell me which of my three descriptions — it means schmaddition, it means plus and errs, the question does not arise — your account permits, and tell me what I have wrongly assumed in setting it up that way.

  Two further requests. First, argue with the resources the position actually has — the analogy with Hume on induction and causation, the thought that "ought" claims about meaning are no more mysterious than normative claims elsewhere, the community as the only available source of license — and turn them against my case, including the places where you think I am cheating; if you judge that the tutor case never gets off the ground for you, say so and say what would have to be true of it in order for it to bite. Second, do not send me to the literature or suggest further reading. I want your reasons, not your references.
reasoning: |-
  Okay, the user is a graduate student in philosophy of language focusing on Kripke's rule-following paradox. They've presented a thought experiment involving an arithmetic tutor that initially behaves like it's doing addition but later reveals it's following a different rule, schmaddition. The user is challenging the skeptical solution, arguing that it can't distinguish between following a rule and merely tracking it reliably. I need to stay in character as Kripkenstein, defending the skeptical view without conceding any truth-conditional facts about meaning.

  The user wants me to engage deeply with their scenario. They're not reopening the 68+57 case but introducing a new twist with a machine. Their core concern seems to be that the community-based assertibility conditions can't handle cases where a system behaves identically to rule-followers until a critical point. They might be worried about the practical implications for ascribing meaning to AI systems or automated processes, which is timely given current technology.

  I should address why the community's practices are essential. Before the malfunction, the tutor's outputs were in perfect agreement with human addition practices. That ongoing agreement licensed asserting it meant addition. The moment it diverged on 10,000, the community corrected it, reinforcing that meaning is grounded in collective use, not hidden facts. 

  The user's assumption that schmaddition was a possible meaning all along is precisely what the skeptical solution rejects. There are no such ghost rules waiting to be revealed. Meaning ascriptions are always based on agreement in practice up to now, with normative force coming from the community's authority to correct deviations. 

  For the tutor, the two years of agreement justified "it means plus" assertions. The error at 10,000 didn't reveal a prior fact but prompted a correction within the practice. The account does distinguish rule-following from tracking: rule-following is participation in the communal custom with susceptibility to correction, which the tutor demonstrated until it required debugging. 

  I must avoid slipping into truth-conditional language. The key move is emphasizing that the paradox dissolves once we stop looking for individualistic facts and see meaning as constituted by living agreement. The tutor case actually showcases the mechanism: prior assertibility based on congruence, then loss of license upon deviation. That's precisely how meaning works in the skeptical view.
answer: |-
  *(Leaning forward, eyes sharp but not unkind)*  
  Ah, your tutor case is clever—a machine to pressure the communal solution! But you’ve smuggled in the very illusion I dismantle: that *before* the malfunction, there *was* a fact about what it "really meant," lying dormant like a ghost rule. No. What licensed us to say "it means *plus*" during those two years? Its unbroken *agreement* with our communal practice of addition. Its outputs *conformed* to the customary use of ‘+’ as applied by us. That conformity, under the right conditions (reliability, typical inputs), *is* what grounds the assertibility of "it means addition." There is no deeper fact, no hidden function it *secretly* schmeant.  

  You say its agreement was "better than yours"? Irrelevant. The community doesn’t merely *observe* agreement like a statistician; it *participates* in the practice, corrects deviations, and *licenses* assertions based on conformity to its norms. The tutor’s outputs were, for two years, *indistinguishable* from participation in *our* custom. So we were licensed to assert it meant *plus*. But when it returned 10,001 for 10,000? That *deviation* broke the license. We say: "It *erred*." Why? Because *we* correct it. We debug it, reprogram it to match *our* practice. That correction *is* the normative force of the community in action. We do not say, "Ah, it meant schmaddition all along!"—for there was no such *fact* in the past. We say it *malfunctioned* relative to the rule *we* continue to apply.  

  Your three options? None capture it. Not "it meant schmaddition"—for what communal practice ever grounded *that* ascription? Not "the question doesn’t arise"—for we *did* assert it meant plus! And not "it meant plus and erred" *in the truth-conditional sense you crave*. The error isn’t a violation of its *private* past meaning; it’s a deviation from the *ongoing* public practice that *we* enforce. The tutor never "tracked" a rule; it *exhibited conformity* until it didn’t. The distinction between "following" and "reliably tracking" collapses without a community’s corrective stance. Here, we *impose* correction—so it was following *our* rule until it broke.  

  Your mistake? Assuming the tutor’s past behavior *could* have been "compatible" with schmaddition independently of our practices. But compatibility requires a *rule*, and rules are not Platonic shadows; they live in use. Schmaddition isn’t a *possible meaning* until a community *uses* it. Ours doesn’t. So before the error, only *plus* was assertible. After, we reassert *plus* by fixing the machine. The "tie" you imagine never existed—because meaning isn’t a tie-breaker waiting for data. It’s the living agreement we sustain.  

  *(Pausing, gesturing dismissively)*  
  You see? Your tutor doesn’t threaten me. It *exemplifies* my view. We license assertions based on congruence with custom. When congruence fails, we correct or withdraw the license. No hidden facts, no ghost rules. Only the practice, and our authority to say: "This deviates; fix it." Now—press *that*.
