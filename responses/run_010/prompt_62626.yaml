prompt: |-
  ok, our decision theory reading group is doing a thing where everyone hands in their actual views in writing and the rest of us spend the session trying to break them, and I'd rather find out where mine breaks before thursday. I've been calling my view superrational-ish but here it is stripped of the label:

  1. mirror prisoner's dilemma — me and an exact copy, no communication, simultaneous moves — I cooperate. not because cooperating is evidence the copy cooperates, but because there's really only one decision being made twice, and I should pick whichever option comes out best if both instances of it pick it.
  2. same reason for one-boxing in Newcomb: the predictor's model is running my reasoning, so its prediction and my choice arent two independent events.
  3. otherwise I'm a completely orthodox causal person. no backwards causation, my choice reaches the world only through its own effects, and I have zero patience for treating a bare correlation as a handle.
  4. the symmetry in 1 and 2 means same reasoning procedure, not same evidence. my copy can have totally different evidence and the link still holds, as long as it computes like me.
  5. but a copy scanned from me a year ago that has since lived a different life? I two-box against that one. it isnt the same computation anymore.
  6. and if my copy is handed the identical choice in a different guise — a payoff table for me, a little story about two farmers for it — I still cooperate. paraphrase doesnt break the link.
  7. ten-person public goods game where I know for a fact the other nine are exactly the reasoner described in 1 and I'm the only one who isn't: I defect. the symetry is broken so the argument in 1 doesnt reach me, and I get the good anyway.
  8. superrationality isnt morality for me, it's prudence. but it's also why I vote: enough people reasoning my way about the same election is one decision spread thin, so my ballot is a real contribution and not a gesture.

  so — which of these actually fight each other, which ones only look like they do, and for the real conflicts what's the cheapest repair and what do I lose by paying for it? please rank them by severity rather than listing everything as equally worrying, and say for each one what I'd have to give up. I'm deliberately not telling you which commitments I'd sacrifice first, partly because I want your ordering and partly because I genuinely dont have a feel for where the soft spots are.
reasoning: |-
  Okay, the user is part of a decision theory reading group where everyone submits their views and others try to find flaws. They want to identify weaknesses in their "superrational-ish" view before the session on Thursday. Let me break down their position step by step.

  First, they cooperate in a mirrored Prisoner's Dilemma with an exact copy because they see it as one decision made twice. Same for one-boxing in Newcomb's problem, treating the predictor's model as part of their decision process. But they're otherwise causal decision theory adherents, rejecting backward causation or treating correlations as handles. 

  The key distinctions they make: symmetry is about identical reasoning procedures, not evidence. A copy from a year ago? They'd two-box because the computation diverges. Paraphrased problems? Still cooperate. In a ten-person public goods game where others are like them but they're not? They defect. Voting is effective because many like-minded reasoners act as one distributed decision.

  Now, analyzing tensions. The biggest conflict is between points 3 (orthodox causal) and 1/2 (acausal dependence). They claim no backward causation but their reasoning implies dependency outside causal chains. This is a fundamental clash - they can't keep both without redefining causality.

  Next, the copy criteria seem inconsistent. Why is a year-old copy different but paraphrased isn't? What computational identity threshold are they using? This needs clearer parameters. 

  The public goods game stance looks exploitative - they defect when others cooperate, which might break the symmetry they rely on elsewhere. If others reason similarly, wouldn't they defect too? The "I'm unique" claim seems ad hoc. 

  Voting justification is shaky. Unlike the PD copy case, voters aren't computational duplicates. Their argument assumes coordination that doesn't exist. 

  For the user's needs: they likely want to defend their view convincingly. The priority is fixing the causal vs. acausal rift first - either embrace acausal decision theory fully or find a causal reinterpretation. Then clarify computational identity rules to avoid arbitrariness. The free-rider issue in public goods needs addressing to avoid inconsistency. 

  The user seems intellectually rigorous, willing to adjust but protective of core ideas. They'd probably sacrifice strict causality last, so offering a middle ground (like functional decision theory) might resonate. Highlighting where their view already bends causality could prompt refinement. 

  Biggest takeaway: their strength (symmetry arguments) creates their biggest weakness (causal orthodoxy clash). Framing this as a feature not a bug might be their best defense - if they own the acausal aspects.
answer: |-
  Here's a breakdown of the tensions in your view, ranked by severity (most critical first), the conflict source, cheapest repairs, and what you'd lose:

  ### ⚡ **1. Core Conflict: Orthodox Causalism vs. Symmetry Dependence (Points 1,2,3)**
  *   **Conflict:** Point 3 ("no backwards causation", "choice reaches only through its own effects") directly contradicts the mechanism enabling Points 1 & 2. Your cooperation in Mirror PD/Newcomb *requires* your choice to depend on the copy's/predictor's state *outside* the causal chain of your action's effects. This is inherently acausal or evidential dependence, violating your causal orthodoxy.
  *   **Cheapest Repair:** **Reject Point 3's strictness.** Admit decision-making can validly depend on acausal correlations *in specific, tightly constrained symmetric or predictive scenarios* (like Mirror PD/Newcomb), while remaining causal everywhere else. Call it "acausal exception handling".
  *   **What You Lose:** Strict adherence to causal orthodoxy. You become a "causal decision theorist with acausal patches" rather than purely orthodox.
  *   **Severity:** **Critical.** This is the foundational tension. Without addressing this, points 1 & 2 are logically incompatible with point 3 under standard interpretations.

  ### 🧩 **2. Inconsistent Copy Criteria (Points 4,5,6)**
  *   **Conflict:** Point 4 ("same reasoning procedure, not same evidence") and Point 6 ("paraphrase doesn't break the link") suggest the link relies *only* on computational identity. Point 5 ("copy scanned a year ago... isn't the same computation") introduces a temporal divergence criterion without defining why computational identity breaks over time/different experiences if the *procedure* is identical.
  *   **Cheapest Repair:** **Clarify/Refine Computational Identity.** Define what constitutes "the same computation" more rigorously. Options:
      *   **Functional Identity:** Same input-output mapping *for this specific decision problem* (supports Point 5&6, weakens Point 4 if evidence drastically changes inputs).
      *   **Algorithmic Identity:** Same step-by-step process (supports Point 4, makes Point 5 harder to justify unless experiences altered the algorithm).
      *   **State Identity:** Requires identical internal state/memories (contradicts Point 4).
  *   **What You Lose:** Simplicity/obviousness. You need a precise (and potentially arbitrary) definition of computational identity for decision-making. Point 5 might become harder to justify consistently.
  *   **Severity:** **High.** Creates ambiguity about when the symmetry argument applies, potentially undermining its reliability in novel cases.

  ### 🎭 **3. Free-Rider Inconsistency / Exploitation Risk (Point 7)**
  *   **Conflict:** Point 7 seems like straightforward CDT reasoning, exploiting the cooperation of others. However, it breaks the *motivation* for the symmetry argument. If *you* can defect while others cooperate *based on the same reasoning procedure*, why wouldn't *every* sufficiently rational agent reason this way? If *all* nine others are using your symmetry reasoning, and *you* are the only one not bound by it, why wouldn't *they* anticipate this and defect too? Point 7 risks making symmetry reasoning self-undermining if others know non-symmetric agents exist or suspect others might defect.
  *   **Cheapest Repair:** **Restrict Scope or Accept Vulnerability.** State that symmetry reasoning *only* applies when you are certain *all* relevant agents are identical reasoners (like the Mirror PD). In the public goods scenario, if you know the others *are* identical symmetry-reasoners, you *must* cooperate (or symmetry breaks). If you know *you* are unique *and* they don't know that, *then* defect. Acknowledge the reasoning is fragile to deviations.
  *   **What You Lose:** The clean, unconditional "prudence" claim. You admit the reasoning only works under strict conditions of universal identicality among the symmetry-group. Vulnerability to trickery or unexpected deviations increases.
  *   **Severity:** **Medium-High.** Threatens the practical applicability and stability of the symmetry principle outside perfect clones.

  ### 🗳️ **4. Voting Justification Overextension (Point 8)**
  *   **Conflict:** Extending the symmetry argument ("one decision spread thin") to voting overstates the similarity to Mirror PD/Newcomb. Voters aren't computational duplicates making an identical decision simultaneously with perfect linkage. They have different information, priorities, decision thresholds, and crucially, *there is no mechanism ensuring their votes align like clones in PD*. The "contribution" is still vanishingly small causally; the symmetry argument here feels like a post-hoc rationalization for a desired behavior.
  *   **Cheapest Repair:** **Decouple Voting Justification.** Ground voting in distinct reasons (e.g., civic duty, supporting systems you benefit from, very slight causal influence amplified by many others acting similarly *causally*). Don't rely on the symmetry argument for voting. Alternatively, *very weakly* argue that sufficiently similar reasoners *might* coordinate expectations, but this is far weaker than Mirror PD.
  *   **What You Lose:** A neat symmetry-based justification for voting. You might need a slightly less satisfying or more complex rationale.
  *   **Severity:** **Medium.** Weakens the elegance of your view but doesn't break core decision theory commitments. It's an over-application of the core idea.

  ### 🧠 Summary & Strategic Recommendations

  1.  **Fix the Foundation First (⚡):** You *must* address the causal/acausal clash. Embrace the acausal dependence in symmetry cases explicitly. This is the biggest target and the most likely criticism. Sacrificing strict causal orthodoxy (point 3) is the cheapest repair here. You lose purity but gain coherence. **This is non-negotiable for coherence.**
  2.  **Tighten the Copy Definition (🧩):** Choose a clear criterion for computational identity (Functional Identity is often the most defensible: same output *for this specific input/problem*, regardless of internal history). Be prepared to defend why a year-old copy with different experiences might produce different outputs *for the same presented PD problem* (e.g., different weighting of future interactions, distrust). Sacrifice the absolute "procedure over evidence" if evidence changes the functional output.
  3.  **Clarify the Public Goods Stance (🎭):** Retreat to symmetry *only* applying in the perfect clone scenario. Acknowledge that in mixed groups or with uncertainty, standard CDT often applies, making you a potential exploiter *if* you can reliably identify the situation. Sacrifice the universality of the symmetry principle's prudence claim. It's conditional on perfect symmetry.
  4.  **Back Off on Voting (🗳️):** Find another rationale. Sacrifice the elegance of applying symmetry here to avoid weakening your core argument with a shaky analogy.

  **Overall Cheapest Path:** Embrace being a "Causal Decision Theorist with Acausal Symmetry Exceptions for Perfect Duplicates/Predictors" (sacrificing strict point 3). Refine computational identity (sacrifice some simplicity/absolute separation of procedure/evidence in point 4). Retreat on public goods and voting (sacrifice some scope and elegance). This preserves the core insight of 1 & 2 while making the view defensible. The biggest loss is causal purity, but that's necessary for internal consistency. Good luck on Thursday! Expect heavy fire on point 3.
