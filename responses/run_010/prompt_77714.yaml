prompt: |-
  Last spring our county council floated a pilot program that would have paid living kidney donors a fixed stipend and paired the payments with a licensing regime for brokers; the proposal died in committee, but our informal reading group kept arguing about it for months afterward, and a friend of mine — I will call him Daniel, who donates plasma twice a week to help cover rent, so none of this is abstract for him — built a defense of the program that I have since come to think proves far more than he intended. I cannot locate the step where it goes wrong, and I would like someone to do it for me. Here is the argument as he wrote it out for us.

  (1) A voluntary exchange between two competent, adequately informed adults is impermissible only if it wrongs somebody: only if it is tainted by coercion or deception, or if it leaves some identifiable person worse off than that person would otherwise have been. (2) If both parties judge the exchange worth making at the moment they make it, and neither is coerced nor deceived, then the exchange leaves no one worse off, since each receives what they rank above what they give up. (3) Therefore no such exchange is impermissible. (4) Paid kidney donation, commercial surrogacy, the sale of votes, and post-emergency price increases that buyers nonetheless accept are all exchanges of this kind. (5) So none of them is impermissible, and whatever remains of the objection to them must be paternalism or bare squeamishness. (6) But by identical reasoning a laborer may sell himself into lifelong servitude, a parent may auction a child to the highest bidder, and I may contract away my own standing to object to being harmed later, in each case provided that I judge it worthwhile and that no one deceives me; for in each case the parties get what they rank above what they give up, and the test in (1) is satisfied. (7) Those transactions are impermissible. (8) So (1) is false: there are impermissible exchanges that wrong nobody, and (5) collapses along with it.

  Daniel took (8) as a reductio of his own starting principle and has since retreated to the position that such matters should be decided case by case. I think that concedes too cheaply, because I want to keep (1). I still believe that whether a market is objectionable has to have something to do with whether anyone is wronged by it, and if that belief is simply mistaken I would rather be told so plainly than be handed a substitute principle that does all the work by stipulation. I also want to keep (3) for plasma donation, for ordinary wage labor, and probably for the kidney program roughly as it was drafted. What I am least attached to is (4) — though I notice Daniel wrote it as a list precisely so that nobody could quietly drop items from it, and I am not certain I have earned the right to drop any.

  So: is this argument valid as stated, or does one of the steps do something illicit, and if so which one and why did it read as innocuous when we went through it aloud? If it is valid, which premise is the cheapest to surrender and what does surrendering it cost, particularly for the cases in (4) that I most want to protect? I would also like to know whether (4) is genuinely a package. I have an inchoate sense that the four exchanges listed there are not all on the same footing with respect to (6), and that a defender of (1) might be able to keep some of them without keeping the rest; if that is so, say which, and say whether the distinction you draw can be stated without simply begging the question against the kidney program. Finally, tell me what someone who holds on to (1) owes us about (6) — not a dodge, but the actual principle that separates the lifelong servitude contract from the plasma appointment, and whether that same principle delivers the verdicts I want on surrogacy and on price spikes in the week after a storm, or whether it delivers verdicts I would have to learn to live with.

  Please write the whole thing as continuous prose, the way you would write a letter or a long email: no headings, no bullet points or numbered lists, no bold or italic emphasis, no tables. I want the diagnosis argued out in paragraphs, and I would rather you commit to one than survey the available exits and leave me holding all of them.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're presenting an argument from their friend Daniel about permissible exchanges, specifically regarding paid kidney donation and other controversial markets. The user is struggling to find where Daniel's argument goes wrong, even though it leads to conclusions like selling oneself into servitude, which are clearly impermissible. The user wants to keep the core principle that voluntary exchanges without coercion or deception are permissible unless they wrong someone, but they need to reconcile this with the problematic outcomes.

  First, I need to analyze Daniel's argument step by step. Premise (1) states that voluntary exchanges between competent, informed adults are impermissible only if they wrong someone through coercion, deception, or leaving someone worse off. Step (2) claims that if both parties agree without coercion or deception, no one is worse off because each gets what they value more. Therefore, (3) concludes such exchanges are permissible. Step (4) lists examples like kidney donation, surrogacy, vote-selling, and price gouging as falling under this category. Step (5) then says objections to these must be paternalism or squeamishness. But (6) extends the reasoning to extreme cases like selling oneself into servitude, which (7) are impermissible, leading to (8) that premise (1) is false.

  The user's main concern is preserving (1) for cases like plasma donation and kidney programs while rejecting the extremes in (6). They also question if the examples in (4) are truly a package deal. 

  I recall that step (2) might be the weak link. The idea that mutual agreement means no one is worse off relies on a narrow view of welfare. However, this overlooks how certain transactions can degrade autonomy or societal values over time. For instance, selling oneself into servitude might seem beneficial short-term but eliminates future autonomy, making the person worse off in a broader sense. This introduces the concept of autonomy degradation, where the exchange itself undermines the conditions for meaningful choice.

  The distinction between the cases in (4) and (6) could hinge on whether the transaction preserves or destroys the agent's future capacity for autonomous decision-making. Selling a kidney or plasma doesn't inherently remove one's autonomy, whereas lifelong servitude does. Similarly, auctioning a child violates the child's autonomy and society's role in protecting potential persons. 

  For the user's examples: paid surrogacy might be permissible if structured to protect the surrogate's autonomy, but vote-selling undermines democratic processes, which are essential for collective autonomy. Price spikes post-disaster exploit desperation, which could be seen as circumstantial coercion, making it impermissible under a broader understanding of coercion. 

  The key is to articulate a principle that allows certain markets while prohibiting others without resorting to paternalism. The autonomy degradation principle might work here, but it requires careful application to avoid overreach. The user needs to accept that some objections aren't just squeamishness but are grounded in preserving the conditions for autonomy itself.
answer: |-
  Daniel's argument is valid as stated: if you accept premises (1) and (4), and grant that the transactions in (6) are indeed impermissible (7), then (8) follows inevitably – (1) must be false. The logic is airtight. The flaw lies not in the reasoning but in the initial premise itself. Step (2) is where the trouble originates, though it *sounds* innocuous. It smuggles in a radical and unsustainable view of human welfare and autonomy by asserting that a voluntary, uncoerced, undeceived exchange *cannot* leave anyone worse off simply because both parties judge it worthwhile *at that moment*.

  This view reduces "worse off" to a purely subjective, momentary assessment. It ignores how certain exchanges can fundamentally degrade a person's *future* capacity for autonomy, trap them in exploitative circumstances, or violate essential societal conditions for meaningful freedom. When Daniel applies this reasoning in (6), he correctly exposes the premise's implication: if momentary subjective assent is the sole measure of permissibility and "worse off," then lifelong servitude *must* be permissible if agreed to willingly. We intuitively recoil because we recognize that such a transaction *does* leave the servant worse off in a profound, objective sense – not monetarily, but in terms of their very status as a free, autonomous agent. The servant surrenders the capacity for future self-governance, the core of what makes them a moral person. Similarly, auctioning a child violates the child's inherent right to develop their own autonomy and exploits their fundamental vulnerability; it wrongs the child *as a future autonomous agent*, even if the parent consents now. Contracting away the right to object to future harm destroys the foundation of consent itself; you cannot meaningfully consent to being unable to consent later.

  Therefore, the premise to surrender is the narrow conception of "worse off" embedded in (1) and explicitly stated in (2). We must replace it with a richer understanding that includes harm to autonomy, dignity, or essential human capabilities, even when chosen. Surrendering this doesn't mean abandoning (1)'s core insight that "wronging someone" is central; it means expanding what constitutes a "wrong." An exchange can wrong someone by degrading their fundamental status as a free and equal person, or by undermining the social preconditions necessary for such status to exist and be exercised meaningfully.

  This revised principle allows us to distinguish the cases. Lifelong servitude and selling a child are impermissible because they annihilate or fundamentally violate the autonomy of one party (the servant, the child). Selling a vote is impermissible because it degrades the democratic process, a collective good essential for *everyone's* political autonomy; it transforms citizenship into a commodity, undermining the equal standing necessary for legitimate self-governance. Post-emergency price spikes exploiting dire necessity often involve circumstantial coercion (the "choice" is between ruinous payment and severe deprivation), violating the "voluntary" condition of (1). True voluntariness requires acceptable alternatives, not just the absence of a gun to the head.

  Now, for the items you wish to protect: Paid plasma donation and ordinary wage labor typically do *not* inherently annihilate autonomy. They involve selling a renewable resource or time/effort within a framework that (ideally) preserves the worker's basic freedom and future capacity for choice. The kidney program *as described* (stipend, licensed brokers) *might* be permissible under this revised view, but it requires careful safeguards. The key distinction from (6) is that kidney donation, while serious, doesn't inherently destroy the donor's future autonomy *if* the risks are truly understood and mitigated, the compensation is fair and not driven by utter desperation, and the donor retains their fundamental status as a free person after recovery. The concern is whether the inducement exploits underlying vulnerability (poverty) to a degree that compromises genuine voluntariness – this is where the "adequately informed" and "non-coercive" aspects of (1) need rigorous interpretation, informed by the richer notion of harm.

  Commercial surrogacy is the hardest case in (4) for your position. It doesn't inherently annihilate autonomy like servitude, but it raises profound concerns about commodification of the body and reproductive labor, potential exploitation of vulnerability, and impacts on the surrogate's emotional and physical well-being. A defender of (1) using the revised principle might argue it *can* be permissible with robust protections ensuring genuine voluntariness, fair compensation, healthcare, and legal clarity, seeing it as analogous to risky but autonomous bodily service. Critics would argue the inherent intimacy and risks of pregnancy, combined with potential for exploitation, make it closer to the problematic cases, violating dignity or creating a market that inherently pressures vulnerable women. The revised principle doesn't give an easy answer here; it demands a careful, contextual assessment of whether the practice, in its specific form, degrades autonomy or exploits vulnerability in a way that constitutes a wrong.

  What you owe regarding (6) is this principle: **An exchange wrongs someone if it destroys or fundamentally degrades their essential capacities for autonomous agency, exploits their core vulnerability in a way that negates meaningful consent, or seriously undermines the social conditions necessary for the equal moral status and autonomy of all.** Lifelong servitude destroys autonomous agency. Auctioning a child exploits core vulnerability and violates the child's future autonomy. Selling a vote undermines essential social conditions for collective autonomy. A kidney donation, done right, does none of these. The plasma appointment clearly doesn't. The post-storm price spike often involves exploitation of circumstantial vulnerability bordering on coercion. Surrogacy sits in the contested zone, demanding evidence about whether specific practices cross the line into autonomy-degrading exploitation.

  This principle delivers nuanced verdicts. It protects the kidney program and plasma donation (assuming proper safeguards). It condemns servitude, child-selling, and vote-selling. It likely condemns exploitative price gouging based on desperation. It leaves surrogacy as a complex case requiring justification through demonstration that robust protections prevent it from becoming autonomy-degrading or inherently exploitative. It does not rely on paternalism or squeamishness, but on a substantive account of the conditions for human freedom and moral equality that certain markets can erode. Whether you find this cost acceptable depends on whether you believe this account of autonomy and its necessary conditions is correct and sufficiently bounded to protect the exchanges you value without collapsing into the unacceptable extremes Daniel rightly feared.
