prompt: |-
  Just lost two hours to an argument with a friend who insists "sphexishness" isn't a real criticism of anything. His line: every rule-follower is that wasp — you drag its paralyzed prey a few inches while it's down the burrow, it hauls it back to the entrance, goes in, comes out, starts over, forever — so calling a language model sphexish is just saying "it follows rules," which is not an insult. I kept trying to insist there's a difference between running the routine and responding to the situation, but I couldn't produce a test that didn't collapse into "it seems smarter." Which maybe means he's right.

  I teach a philosophy of mind seminar, 18 people, 75 minutes, mostly second-years plus two CS students who'll smugly say the answer is just more parameters. Design an in-class activity that makes them feel the distinction and then feel it fail. They should hit the problem before anyone says the word sphex — that name stays out until the debrief. I need: materials that are just paper and tokens I can buy, roles and phases with timings, the interruption mechanic and how it gets administered with no confederate, and the debrief mapping each moment onto the argument, including what happens when the "flexible" instruction (ask me if anything changes) turns out to be another script. Then tell me what will predictably go wrong the first time I run it, and be honest about which feature of the real case the activity cant reproduce and I have to talk them through.
reasoning: |-
  Okay, the user is a philosophy of mind professor who just had an argument about "sphexishness" with a friend. They want to design an in-class activity that demonstrates the distinction between rigid rule-following and flexible responsiveness without using the term "sphexish" until the debrief. The activity should involve paper and tokens, specific roles and timings, an interruption mechanic, and a debrief linking everything back to the argument.

  The user's deeper need is to make students viscerally understand that sphexishness isn't just rule-following but inflexible rule-following that fails when the environment changes unexpectedly. They want to expose how even instructions meant to add flexibility can become rigid scripts. The challenge is creating this realization without relying on subjective "seems smarter" judgments.

  I recall the wasp example: when its prey is moved during its routine, it repeats the sequence mindlessly instead of adapting. The core tension is between procedural correctness and contextual awareness. The activity must make students experience both sides - as rigid executors and as observers seeing the absurdity.

  For the setup, I consider having two roles: Agents (rule-followers) and Architects (rule-designers). The task should be simple but require environmental interaction, like arranging tokens based on sensor inputs. Phase 1 establishes a routine, then an interruption changes the environment subtly. The key is making the change invalidate the rules without being obvious. 

  I think about using paper "sensors" (A/B/C zones) and tokens (X/Y). Rules could be: "If sensor A is lit, place X token in red box." The interruption secretly swaps the meaning of the sensors. Architects write rules assuming fixed meanings, while Agents follow them literally. When sensors change, the rules produce nonsense, but Architects can't intervene - they can only write new rules after failure. 

  The "flexibility trap" comes when Architects add "Ask if anything changes" to their rules. But during the interruption, the Instructor gives a scripted response: "No changes. Proceed." This shows how meta-rules can also be rigid. Students will realize that true flexibility requires recognizing when to question the framework itself.

  Predictable problems: Agents might try to adapt off-script (solution: strict role enforcement). Architects may write vague rules (solution: require specific condition-action pairs). The debrief must explicitly map each phase to the sphex argument: Phase 1 (normal rule-following), Phase 2 (sphexish repetition despite changed conditions), Phase 3 (meta-rules as brittle as base rules).

  The irreproducible aspect is real-world stakes: the wasp dies if it fails, but here failure is abstract. I'll suggest emphasizing this in debrief - biological rigidity has costs that classroom simulations lack.
answer: |-
  Here's a structured, experiential activity designed to make the sphexishness distinction *felt* before it's named, using minimal materials. It forces confrontation with rigid vs. contextual rule-following and the paradox of "flexibility instructions."

  **Core Concept:** Students experience *being* the rule-follower in a shifting environment, then design rules for others, revealing how instructions (even "flexible" ones) become scripts when divorced from situational awareness.

  **Materials:**
  1.  **Paper:** Grids (8x8 squares), Instruction Sheets, Observation Logs.
  2.  **Tokens:** Two distinct types (e.g., 20 red circles, 20 blue squares) - pennies/dimes and paperclips/buttons work.
  3.  **Markers/Pens:** For writing rules & observations.
  4.  **Timer:** Visible to all.

  **Roles:**
  1.  **Agents (9 students):** Blindly follow written rules. *Cannot* interpret intent, only literal instructions. Sit at desks with grids/tokens.
  2.  **Architects (9 students):** Write rules for Agents. Sit separately, designing rules on Instruction Sheets.
  3.  **Observer (Optional, 1 student):** Takes notes on behaviors, frustrations, rule-following. (If odd number, skip or Prof observes).
  4.  **Instructor (You):** Facilitates phases, administers the "Interruption," enforces roles.

  **Phases & Timings (Total: 60-65 mins):**

  1.  **Setup & Rule Creation (15 mins):**
      *   Explain: "Architects will design precise, step-by-step instructions for Agents to place tokens on a grid based on sensor inputs. Agents must follow these instructions *exactly as written*. Observers note the process."
      *   **Architect Task:** Write rules interpreting inputs (A, B, C) to place tokens (X or Y). *Example Starter Rule:* "If Input = A, place a RED token in the TOP-LEFT square. If Input = B, place a BLUE token in the CENTER square..." Architects must define *all* actions for *all* possible inputs (A, B, C). Inputs are provided *by the Instructor*.
      *   **Agent Prep:** Give each Agent a grid, tokens, and a blank Instruction Sheet (they won't see rules until phase starts). Emphasize: "You are executors. Follow the written rules *literally*. Do not infer, adapt, or ask clarifying questions unless the rules explicitly tell you to ask *me*."

  2.  **Phase 1: Initial Execution (10 mins):**
      *   Distribute Architect-completed Instruction Sheets to corresponding Agents.
      *   **Instructor:** Provides the *first input* to all Agents simultaneously (e.g., "Input A"). Start timer.
      *   **Agents:** Follow rules to place tokens. Repeat 3-4 times with different inputs (A, B, C, maybe A again). Goal: Establish a smooth, predictable routine.

  3.  **The Interruption (Administered by Instructor - Key Mechanic):**
      *   **During Phase 1 Execution (After 2-3 inputs):** While Agents are focused on placing tokens, **silently and visibly change the meaning of the "Inputs"**.
          *   *How:* Swap labels on a central "Input Key" poster (e.g., "Input A" now means what "Input C" meant before, "Input B" is unchanged, "Input C" now means "A"). *Or* announce: "Attention: Input calibration updated. Inputs now correspond as follows: Signal 'Alpha' = Old Input A, Signal 'Beta' = Old Input B, Signal 'Gamma' = Old Input C." Then immediately give a new input *using the NEW label but the OLD value* (e.g., "Input Gamma" - which *was* "Input C", but now *means* "Old Input A"). **Crucially, do NOT change the written rules the Agents have.**
      *   **Agents:** Receive the new input ("Gamma"). They look at their rules. The rules say "If Input = C, place [token Z] at [location Q]". They see "Input = Gamma". The rules don't mention "Gamma". They *might* freeze, look confused, or try to apply the closest match ("Gamma sounds like C?") *IF their rules don't explicitly forbid it.* They *must* follow their literal instructions.
      *   **Architects & Observers:** Watch silently. No intervention allowed.

  4.  **Phase 2: Post-Interruption Execution (10 mins):**
      *   Continue giving inputs using the *NEW* labeling system (Gamma, Alpha, Beta) but values corresponding to the *OLD* A/B/C sequence patterns.
      *   Agents struggle. Some might place tokens incorrectly based on old mappings, some might stop, some might try to "map" Gamma->C, etc. *They are constrained by their literal rules.*
      *   Architects likely become visibly frustrated ("No! Gamma is the new A!"). Enforce silence.

  5.  **Phase 3: The "Flexibility" Trap (15 mins):**
      *   Halt Phase 2. Tell Architects: "Your Agents failed because the environment changed unexpectedly. Redesign your rules *adding one instruction* allowing the Agent to potentially *detect or adapt* to such a change." (e.g., "If an input doesn't match A, B, or C, ask the Instructor if the meanings changed" or "If you receive an input not listed, place no token and signal an error").
      *   Architects rewrite rules (5 mins), adding their "flexibility" clause.
      *   Redistribute updated rules to Agents.
      *   **Instructor:** Restart inputs using the *NEW* labels (Gamma, Alpha, Beta). Agents follow new rules.
      *   **The Trap:** When an Agent triggers the "flexibility" instruction (e.g., asks "Did meanings change?"), the Instructor gives a **scripted, literal, unhelpful response:** "No changes have occurred. Proceed according to your instructions." (Or for error signals: "No error detected. Proceed."). *Do NOT explain or clarify the actual change.*
      *   Agents are now stuck in a loop: Their "flexible" trigger leads to an unhelpful response, forcing them back to the flawed rules. Architects explode (quietly).

  6.  **Debrief (15-20 mins):** *Now* introduce "sphexishness."
      *   **Map the Experience:**
          *   *Phase 1:* Normal rule-following = Competent behavior (like the wasp normally provisioning its nest).
          *   *Interruption:* The environment change (like moving the prey). Undetectable within the rule-set.
          *   *Phase 2:* Agents persisting with old rules = *Sphexishness*. They follow the procedure perfectly, but it's now maladaptive because it lacks situational awareness/context sensitivity. **Key Distinction:** It's not *that* they follow rules, it's *that they cannot stop following the specific script even when it's obviously failing and the context has shifted.* They are "down the burrow," oblivious.
          *   *Phase 3:* The "flexibility" instruction = Another rigid rule! "Ask if changed" is just step 5b in the new script. The Instructor's "No changes" response is another fixed input. The system lacks *genuine* contextual interpretation or the ability to *challenge the framework*. It's meta-sphexishness.
      *   **Connect to the Argument:**
          *   Your friend: "All rule-following is sphexish" = True only if we define rules so broadly they include *all* adaptive behavior (which makes the term useless). The criticism is about *inflexible, procedural blindness*.
          *   The difference isn't just "seems smarter," it's *functional success in a dynamic environment*. The wasp *fails biologically*; the Phase 2/3 Agents *fail the task*.
          *   LLMs: They execute their training/algorithmic "rules" impeccably. But they lack the contextual grounding, real-time sensory feedback, and intrinsic goals (like survival/task success) that allow biological systems (even simple ones) to *sometimes* break the script. They are *constitutively* sphexish because their "situation" is always just the next token prediction within a fixed probabilistic model. Adding "if confused, ask the user" (like Phase 3) just creates a new, potentially brittle, branch in the script.
      *   **CS Student Retort ("More Parameters!"):** Acknowledge it *might* help (like more complex rules *might* have handled the input swap if anticipated). But ask: Does adding parameters fundamentally change the *architecture* from procedural execution to genuine situated understanding? Or is it just a bigger, more complex script with more branches, still vulnerable to unanticipated context shifts (distribution shifts, novel inputs)? The core issue is the *mode of operation*.

  **Predictable Problems (First Run):**

  1.  **Agent Rebellion:** Some Agents will *want* to adapt or ask clarifying questions in Phase 2/3, breaking role. **Mitigation:** Strong initial briefing on role constraints. Gentle but firm reminders: "Remember, you are the executor. What do your literal instructions say? Follow them exactly."
  2.  **Vague Architect Rules:** Architects might write ambiguous rules ("Put it where it makes sense"). **Mitigation:** Emphasize *precision* in Phase 1 setup. Review rules quickly before distribution; reject blatantly ambiguous ones ("This needs a specific condition and action").
  3.  **Slow Rule Writing:** Architects take too long in Phases 1 & 3. **Mitigation:** Strict timers. Provide a very clear example upfront. Encourage simplicity.
  4.  **Observer Passivity:** The Observer might not know what to note. **Mitigation:** Give them specific prompts: "Note when Agents hesitate or look confused. Note Architects' facial expressions/reactons. Note *how* Agents try to apply rules to unfamiliar inputs."
  5.  **Frustration Overload:** Architects might get too frustrated in Phase 3, disrupting the flow. **Mitigation:** Acknowledge it ("I see the frustration - that's part of the point!") and channel it into the debrief. Keep Phase 3 execution short.
  6.  **"Cheating" the Trap:** An Agent might creatively interpret the Instructor's "No changes" response (e.g., "Aha! 'No changes' *must* mean the meanings *did* change!"). **Mitigation:** This is great! Highlight it in debrief as an attempt *by the human* to break sphexishness, demonstrating the difference between the Agent role and the human playing it. Point out the LLM *couldn't* do this spontaneous meta-reasoning.

  **The Irreproducible Feature & Required Talk-Through:**

  *   **The Wasp's Biological Imperative & Cost of Failure:** The activity simulates task failure, but not the *existential cost* the sphex wasp faces. Its rigid behavior wastes energy and risks its offspring's survival. LLMs have no intrinsic goals or costs; their "failure" is abstract (wrong output, user dissatisfaction). Students need to grasp that biological sphexishness is criticized because it's *maladaptive* in a way that threatens survival/reproduction, while LLM sphexishness is criticized because it limits *functional utility* and *robustness* in dynamic human contexts. **Talk Through:** "The wasp isn't just inefficient; its rigidity has real biological costs. We criticize LLM sphexishness because it leads to errors, inconsistencies, and brittleness when we need systems that can adapt to *our* unpredictable world, much like natural selection favors organisms that can adapt. The cost isn't death, but a failure to fulfill the intended purpose reliably."

  This activity forces students into the roles, creates the visceral experience of rigidity vs. environmental shift, and intentionally engineers the failure of the "flexibility" instruction. The debrief explicitly ties each moment back to the core philosophical and computational argument, preparing you to dismantle the "it's just rules" objection and the "more parameters" retort. Good luck!
