  Frank statement of leaks:
  - The history is given as a complete log, but in reality, we have limited access.
  - The outcomes are given, but in nature, the outcomes are not labeled +/-.
  - The mechanism's internal states are not represented; it's a black box.
  - The content is assigned based on the entire log, but in teleosemantics, it's based on selection history, not individual episodes.
