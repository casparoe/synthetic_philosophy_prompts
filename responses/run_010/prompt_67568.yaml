  For each team:
  - Log sheet (as above, with 20 entries)
  - Mechanism description: "The mechanism has a detector that outputs either ON or OFF. When the detector is ON, the system stops; when OFF, it goes. The log records past episodes: the environmental conditions, the detector's state, the action taken, and the outcome (+, -, or N for neutral)."
