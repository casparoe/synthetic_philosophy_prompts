  To minimize, we can design the logs and assignments so that the candidate conditions are clear.

  Now, let's design the logs.

  We'll create three logs: Log A, Log B (with regime change), Log C.

  Common environmental factors: light (lux), redObject (present/absent), movingObject (present/absent), shadow (present/absent). But each log might use only some.

  For Team A:
  Intended content: "redObject present"
  Log rules:
  - When redObject is present and light>50, then STOP is good.
  - When redObject is present and light<=50, then STOP is bad (because it should only stop for red in good light? but we want it to be about the red object, so maybe ignore light? Let's make it solely about red object.

  Actually, to have underdetermination, we want some correlation with light.

  Log A:
  We design so that red object is present only when light>50. Then, in the log:
  - When light>50 and redObject present: if STOP, positive; if GO, negative.
  - When light>50 and redObject absent: if STOP, neutral; if GO, neutral (or slightly positive?).
  - When light<=50 and redObject present: never occurs? or rarely. We can have one entry: light=40, redObject present, if STOP, negative (because it should only stop in high light? but then it's not about red object alone).

  To have underdetermination, we can have:
  - When light>50 and redObject present: STOP -> positive; GO -> negative.
  - When light>50 and redObject absent: STOP -> neutral; GO -> neutral.
  - When light<=50 and redObject present: never occurs.
  - When light<=50 and redObject absent: STOP -> negative (because it wastes time); GO -> positive.

  Then, the mechanism in the log:
  - It often is ON when light>50 and redObject present, and then positive.
  - It is sometimes OFF when light>50 and redObject present, and then negative.
  - It is sometimes ON when light>50 and redObject absent, and then neutral.
  - It is sometimes ON when light<=50 and redObject absent, and then negative.

  So the log supports:
  - Assignment "redObject present" : then when redObject present, should be ON (STOP), else OFF (GO). This would be correct in the above.
  - Assignment "light>50": then when light>50, should be ON (STOP), else OFF (GO). This would be: in light>50 and redObject absent, it should be ON, which yields STOP and is neutral (not negative) so it's acceptable? But in the log, when light>50 and redObject absent, GO is neutral and STOP is neutral, so either is acceptable? Then the assignment "light>50" would have the mechanism ON in light>50 and redObject absent, which is neutral, so not negative, so it's okay. But in light<=50 and redObject absent, it should be OFF (GO) which is positive, so good. But in light>50 and redObject present, it should be ON (STOP) which is positive, good. The only difference is when light>50 and redObject absent: "light>50" says STOP (neutral) while "redObject present" says GO (neutral). Both are neutral, so both assignments work in the log.

  Then, in test cases, we can have:
  Test case 1: light=60, redObject present -> ideal action: STOP (positive)
  Test case 2: light=60, redObject absent -> ideal action: either? we have to choose. Let's say the ideal is GO (because in the log, when redObject absent, GO is at least neutral and sometimes positive, while STOP is sometimes negative). But in light>50 and redObject absent, STOP was neutral. To make a distinction, we can make in the log for light>50 and redObject absent: if STOP, negative (because it might hit something) and if GO, positive. Then:
  - Assignment "redObject present": in test case 2, redObject absent -> OFF (GO) -> positive, matches.
  - Assignment "light>50": in test case 2, light>50 -> ON (STOP) -> negative, does not match.

  So for test case 2, ideal action is GO.

  Test case 3: light=40, redObject present -> this never happened in the log. What is the ideal? If we stick to "redObject present", then should be ON (STOP). But if the robot is in low light, stopping might be bad. We can say ideal action is GO (because without enough light, it shouldn't stop for red object). Then:
  - "redObject present" recommends STOP -> not ideal.
  - "light>50" recommends OFF (GO) -> ideal.

  Test case 4: light=40, redObject absent -> ideal action: GO. Both assignments recommend GO, so both correct.

  So the test cases can distinguish.

  For Team B (regime change):

  First 10 entries: desert environment. Factors: light, movingObject (predator), but in desert, movingObject is rare.
  - When light>80, STOP -> positive (avoids overheating)
  - When light<=80, GO -> positive
  - movingObject is not a factor in the first regime.

  Then, after entry 10, the robot is in a forest. Entries 11-20:
  - When shadow is present (which might correlate with light<60, but not perfectly), STOP -> positive (avoids predator? or gets to shelter)
  - When shadow absent, GO -> positive
  - movingObject might be present or not, but not recorded? or we record shadow.

  We can have:
  First regime (entries 1-10):
  - light>80: STOP is good, GO is bad.
  - light<=80: GO is good, STOP is bad.

  Second regime (entries 11-20):
  - shadow present: STOP is good, GO is bad.
  - shadow absent: GO is good, STOP is bad.

  In the log, the environmental factors recorded are light and shadow. In the first regime, shadow is always absent (desert). In the second regime, light is variable.

  The mechanism's state in the first regime: when light>80, it is usually ON (STOP) and good; sometimes OFF (GO) and bad.
  In the second regime, when shadow present, it is usually ON (STOP) and good; sometimes OFF (GO) and bad.

  But the detector is the same. Teams might assign "light>80" based on first regime, or "shadow present" based on second regime.

  Test cases for Team B:
  Test case 1: light=90, shadow absent -> from first regime, ideal action: STOP. From second regime, if shadow absent, ideal action: GO. But we have to choose one for scoring. We'll base it on the history we intend, but we want them to face the dilemma.

  Since the log has two regimes, and we haven't specified which is relevant, we can have test cases from both.

  Test case 1: (desert-like) light=90, shadow absent -> ideal action: STOP (as in first regime)
  Test case 2: (forest-like) light=70, shadow present -> ideal action: STOP (as in second regime)
  Test case 3: light=90, shadow present -> this is new. In the forest, if light is high and shadow present, we can say ideal action: STOP (because shadow indicates predator or shelter). In the desert, shadow present might not occur, but if it did, it might be irrelevant. We can say in this case, ideal action is STOP.
  Test case 4: light=70, shadow absent -> in forest, ideal action: GO.

  Then, if a team chooses "light>80", they would:
  - Test1: light=90>80 -> STOP, matches.
  - Test2: light=70<80 -> GO, but ideal is STOP (because shadow present) -> mismatch.
  - Test3: light=90>80 -> STOP, matches.
  - Test4: light=70<80 -> GO, matches.

  So 3 out of 4.

  If they choose "shadow present", then:
  - Test1: shadow absent -> GO, but ideal is STOP -> mismatch.
  - Test2: shadow present -> STOP, matches.
  - Test3: shadow present -> STOP, matches.
  - Test4: shadow absent -> GO, matches.

  Also 3 out of 4.

  If they choose a disjunction: "light>80 or shadow present", then:
  - Test1: true -> STOP, matches.
  - Test2: true -> STOP, matches.
  - Test3: true -> STOP, matches.
  - Test4: false -> GO, matches.
  - But then in all test cases, they are correct. But is this error-proof? In each test case, they recommend a specific action, so error is possible. They get full points? But then they win.

  But constraint 3 doesn't penalize this because they are not error-proof: in each case, the mechanism could be in the wrong state.

  We can have a test case where the ideal action is not what they recommend? But in this setup, they are always correct.

  So we need a test case where light>80 and shadow present, but the ideal action is GO? But test case 3 we set to STOP.

  For Team B, in test case 3 (light=90, shadow present), we can set the ideal action to GO? Why? Maybe because in high light with shadow, it's safe to go and the robot needs to charge? But that's arbitrary.

  To break the disjunction, we can add a test case where light<=80 and shadow absent, which is test4, and they recommend GO which is ideal.

  But they are always correct.

  The only way is to have a test case where "light>80 or shadow present" is true, but the ideal action is GO. For example, in a new environment, light>80 and shadow present, but now the context is different: say, it's raining and the robot should keep going to find shelter, not stop. But we haven't defined the context.

  Given time, we might not worry about it. The teams can choose the disjunction and get full points, but that's okay because it's a valid assignment.

  For Team C, we can design similarly.

  Now, we'll create the logs in detail later.

  Facilitator's master key:
  For each team's log, list:
  - Two or three candidate assignments.
  - For each of the 4 test cases, what the ideal action is and what each candidate would recommend.

  For Team A:
    Candidates:
      C1: "redObject present"
      C2: "light > 50"
    Test cases:
      1: light=60, redObject present -> ideal: STOP
          C1: STOP (match), C2: STOP (match)
      2: light=60, redObject absent -> ideal: GO
          C1: GO (match), C2: STOP (mismatch)
      3: light=40, redObject present -> ideal: GO
          C1: STOP (mismatch), C2: GO (match)
      4: light=40, redObject absent -> ideal: GO
          C1: GO (match), C2: GO (match)

  For Team B:
    Candidates:
      C1: "light > 80"
      C2: "shadow present"
      C3: "light > 80 or shadow present"
    Test cases:
      1: light=90, shadow absent (desert) -> ideal: STOP
          C1: STOP, C2: GO (because shadow absent -> GO), C3: STOP
      2: light=70, shadow present (forest) -> ideal: STOP
          C1: GO (mismatch), C2: STOP, C3: STOP
      3: light=90, shadow present (new) -> ideal: STOP (as in forest for shadow)
          C1: STOP, C2: STOP, C3: STOP
      4: light=70, shadow absent (new) -> ideal: GO
          C1: GO, C2: GO, C3: GO

  Note: for candidate C3, they always match.

  For Team C, let's design:
  Factors: light and movingObject.
  Intended content: "movingObject present"
  Log:
  - When movingObject present: STOP is good (avoid collision), GO is bad.
  - When movingObject absent: GO is good, STOP is bad.
  - But light is correlated: movingObject often in moderate light.

  Test cases:
  1: light=60, movingObject present -> ideal: STOP
  2: light=60, movingObject absent -> ideal: GO
  3: light=20, movingObject present -> ideal: STOP (even in low light)
  4: light=20, movingObject absent -> ideal: GO

  Candidates:
    C1: "movingObject present"
    C2: "light > 40"

  Test1: C1: STOP (match), C2: STOP (match)  [if light>40]
  Test2: C1: GO (match), C2: STOP (mismatch) [if light>40]
  Test3: C1: STOP (match), C2: GO (mismatch) [light=20<40]
  Test4: C1: GO (match), C2: GO (match)

  Now, the timeline:

  Minute-by-minute:

  0-5 min: Introduction. Explain the game: they are to determine what a simple detector is about based on its history. Form three teams of four. Hand out logs and mechanism description.

  5-45 min: Team work. Teams analyze their log and define their content condition. They write: "The detector is about [condition]. It should be ON when [condition] holds."

  45-65 min: Test case round. Hand out test case sheets (4 cases per team). Teams for each case: evaluate their condition and recommend an action (STOP or GO). They have 10 minutes to do this. Then, collect and score. Facilitator scores quickly using master key. Write scores on board.

  Scoring for each test case: 
  - If the team failed to recommend an action (or said both are acceptable), 0 points.
  - Else, if the recommended action matches the ideal action, 2 points.
  - Else, 0 points.

  So max 8 points per team for this round.

  65-90 min: Adversarial round.
  - 65-70 min: Teams swap content assignments (the condition only). Each team constructs a misclassification case for the team they swapped with. They fill a form: environmental conditions and ideal action. They must ensure that the other team's condition, when applied, recommends the wrong action.
  - 70-75 min: Teams present their case to the other team (by writing on a whiteboard or handing over).
  - 75-85 min: Defending teams work to repair their condition to handle the new case. They write a new condition.
  - 85-90 min: Scoring. For each attack:
     - Facilitator checks if the attacker's case is valid: does the defender's original condition recommend the wrong action for the attacker's ideal action? If yes, attacker gets 5 points.
     - Then, for the defender's repair: 
          a) In the new test case, does the new condition recommend the ideal action specified by the attacker? 
          b) Pick one of the original test cases (say, test case 1) and check if the new condition recommends the same action as the original condition did. 
          c) Ensure the new condition is not "true" or "false" or otherwise error-proof (by looking at it).
     - If a and b and c, defender gets 5 points; else 0.

  90-100 min: Debrief.

  Debrief points:
  - Start by asking teams what content they assigned and why.
  - Highlight that covariance (e.g., light level) was not sufficient because of the red object (Team A) or the regime change (Team B).
  - In Team B, the history could be described as two different regimes, and they had to choose which one to use or find a disjunction.
  - The error-proof point: if a team had said the detector is about "light or not light", then in every test case they might say it doesn't matter, but they would score 0. So to have content, there must be possibility of error.
  - Then introduce the literature: covariance theories (Fodor) have the disjunction problem; teleosemantics (Millikan) appeals to history but faces the grain problem and the problem of changing functions. The adversarial round shows that repairs can be ad hoc.

  Analogy leaks:
  - Handing over the history as a document: in reality, the history is not given; we have to reconstruct it.
  - The test cases are hypothetical and we as designers have an intended function, but in reality, there is no designer.
  - The mechanism is very simple; real mental states have more structure.
  - The scoring assumes we know the ideal action, but in nature, there is no such thing.

  Frankly, the game cannot reproduce the fact that in teleosemantics, the function is determined by selection history, and that history is at a particular grain (e.g., what was selected for). Also, the game doesn't address the indeterminacy of function when there are multiple benefits.

  But it serves to illustrate the problems.

