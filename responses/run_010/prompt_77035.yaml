answer: |-
  **Mark and Band Placement**  
  17/25 (Band 16–20)  
  This answer offers a **sound exposition** of Plutarch’s method and purpose and provides a **real evaluation** of the hagiography objection. However, it contains **two underdeveloped claims** (regarding publicity distorting deeds and the "no genuine criticism" assertion) and **one unearned step** (the link between edification and manipulation). It falls short of Band 21–25 due to these gaps in support and reasoning but exceeds Band 11–15 by avoiding material misstatements and addressing both exposition and evaluation substantively.

  ---

  **Paragraph-by-Paragraph Comments**  

  1.  **"Plutarch's claim... is that biography and history are different kinds of writing... The biographer is concerned with character... shown in small things... He compares himself to a portrait painter... selectivity... entitled to leave out material..."**  
      *Accuracy*: **Accurate**. Directly supported by the Perrin translation provided in the question and Plutarch’s portrait analogy. The distinction between biography/history and emphasis on selectivity are correctly attributed.  

  2.  **"The point Plutarch is most insistent on is that this selectivity makes biography a more accurate form of writing... the small detail is better evidence because it is better attested... publicity distorts [illustrious deeds]."**  
      *Accuracy*: **Partially inaccurate/Unsupported**.  
      - *"More accurate than history"*: **Misattributed**. Plutarch implies biography reveals *character* more effectively due to focus on details (e.g., *Alexander* 1.2), but he never claims it is epistemically superior *as a genre* to history. He explicitly notes historians face challenges with conflicting sources (*Alex*. 1.3), but does not extend this to a blanket claim about biography’s relative accuracy.  
      - *"Publicity distorts them"*: **Unsupported conjecture**. The answer presents this as Plutarch’s view, but no evidence from the text or broader context justifies this. Plutarch argues illustrious deeds may not reveal character (due to scale/context), not that they are distorted by publicity.  

  3.  **"His purpose... is moral... readers to admire and imitate... paired structure... lets the reader see which man handled situations better... biography is more useful the more admirable its subject's conduct."**  
      *Accuracy*: **Accurate, but incomplete**. Correct on moral purpose, self-improvement (*Aemilius Paulus* 1.1), and didactic use of parallels (*Synkriseis*). However, it omits Plutarch’s acknowledgment that subjects *have* flaws (e.g., *Cimon* 2.5: "virtues admit of imitation, faults we avoid"). The claim that usefulness scales with admirability oversimplifies; Plutarch includes flawed figures (e.g., *Demetrius*) precisely to warn readers.  

  4.  **"Plutarch is candid... should treat transgressions as shortcomings... a rule of that kind... means the Lives contain no genuine criticism... decided in advance... selects evidence... manipulated rather than informed. Edification has displaced truth... result is hagiography."**  
      *Reasoning*: **Step does not follow**.  
      - *"No genuine criticism"*: **Overgeneralization unsupported by evidence**. Plutarch *does* criticize subjects (e.g., *Alexander*’s drunkenness, *Caesar*’s ambition). His directive to minimize flaws (*Alex*. 1.2) is a methodological preference, not proof of absence. The leap from "should not delineate zealously" to "no genuine criticism" is unearned.  
      - *"Manipulated rather than informed"*: **Does not follow**. While Plutarch curates details for edification, he does not invent evidence (e.g., cites sources like Onesicritus). The conclusion that truth is displaced assumes a false binary; the answer provides no argument why selectivity *necessarily* precludes truthfulness.  

  5.  **"Plutarch's confidence... vindicated by its reception... evidence that edifying biography works as moral education."**  
      *Relevance*: **Irrelevant to the core question**. Reception history (Shakespeare, school texts) speaks to *influence* and perceived utility, not the truthfulness of the Lives or whether they constitute hagiography. This does not engage the prompt’s evaluation of Plutarch’s "position."  

  ---

  **What Holds the Mark Down (in order)**  
  1.  **The unsupported claim that "publicity distorts" illustrious deeds** (¶2). This misrepresents Plutarch’s argument and lacks textual grounding. To improve: Replace with Plutarch’s actual concern—that grand events may not reveal character *because* they are influenced by external factors (fortune, scale)—and cite *Alex*. 1.2-3.  
  2.  **The unearned leap to "no genuine criticism"** (¶4). This ignores counterevidence within the *Lives*. To improve: Acknowledge Plutarch’s critiques of his subjects (e.g., Alexander’s flaws) and argue *why* his minimization of faults *still* risks hagiography despite this.  

  ---

  **Potentially Penalized but Defensible Claims**  
  - **"The biographer must be selective... not required to be complete"** (¶1): A less careful grader might conflate "selective" with "misleading," but Plutarch explicitly defends selectivity (*Alex*. 1.2).  
  - **"Edification has displaced truth"** (¶4): While overstated, this is a *conclusion* (not a factual claim) and the core of the writer’s evaluation. It should be assessed on reasoning, not penalized as "inaccurate" if the argument were better supported.  

  ---

  **Final Band Justification Recap**  
  This response sits firmly in **Band 16–20**: Its exposition is largely sound (despite one misattribution), and its evaluation of hagiography is substantive. However, the claim about publicity’s distortion (¶2) is conjectural, and the "no criticism" assertion (¶4) lacks evidentiary support. The reception history (¶5) is irrelevant. These gaps prevent it from reaching Band 21–25, where every claim must be anchored and every step earned.
