prompt: |-
  Just spent about two hours arguing with a mate about the cluelessness objection to consequentialism and I've come out of it cross, so I want you to settle it in a slightly odd way. His line is that it's a nothing-burger: our far-future effects are so wildly uncertain that they contribute almost nothing to expected value, so we just go on the near-term stuff we can actually see, and anyway consequentialism was never meant to be a decision procedure, only a criterion of rightness. I think those are two seperate retreats wearing a labcoat and calling itself a reply.

  Write it up as a deadpan product recall notice from a made-up regulator — something like an Office for Applied Ethics Product Safety — recalling all models of Act Consequentialism because the unit fails to produce a determinate output under normal operating conditions. I want a proper defect description (the cluelessness fault, plus one example of the right shape: a trivially ordinary act whose distant causal descendants include something monstrous, without ever saying what), a list of the field complaints received from users, and the firmware patches the manufacturer has shipped and why each one failed — the washout-by-uncertainty patch, the criterion-not-decision-procedure patch, the near-term-effects-only patch, the "actually we've always been rule consequentialists" rebrand — finishing with a warning against attempting a home repair. Around 600-700 words, British English, bureaucratic register all the way through, and absolutely no winking: the jokes have to come from getting the philosophy right, so someone who's read this literature laughs rather than winces. Don't name or cite any real philosopher and don't put words into any real book's mouth; invent a manufacturer if you want one.

  Start straight in with the notice itself, no preface or commentary.
