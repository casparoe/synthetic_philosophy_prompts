prompt: |-
  So here's my situation. I'm in a philosophy-of-the-social-sciences seminar this term that's half analytic people and half historians of science and economics, and we burned three weeks on the Needham question — why modern science and then sustained industrial growth took off in Britain/northwest Europe and not in China — and I came away convinced the two halves of the room weren't actually answering the same question. The historians kept swapping the foil without noticing (some weeks it was Qing China, some weeks Song China, once Tokugawa Japan as a control, once Bengal); the analytic side kept insisting that until you fix the contrast class there's nothing determinate to explain, and one of them waved at the old line about how nobody wastes time explaining why their name didn't appear on page three of the paper. Nobody budged, and our professor — who does causal modeling and asks "what's the intervention?" about everything — clearly thought both camps were wasting his time. My paper is going to try to make that stalemate into an actual research question instead of a vibe.

  The idea: treat "why Britain and not China?" as a case study in when a contrastive why-question is well posed, using the apparatus people have built for contrastive explanation — foils, contrast classes, the point that "why P rather than Q" can have different true answers for different Q, and the further point that a question can be defective not because the answer is unknown but because no single explanans survives across reasonable choices of foil. But the thing I want in the center of the paper, because nobody in my group raised it, is a granularity/unit mismatch that might bite before we even get to the foil problem: "Britain" is a nation-state and "China" is a civilization-scale empire with internal variation bigger than most of Europe's, so the contrast might be comparing a region to a continent. And there's a related temporality problem — the explanandum has no sharp boundaries (industrialization when? "modern science" as defined by whoever's doing the defining?), so maybe there's no determinate fact of the matter about which token event we're contrasting with what. I want the paper to test a specific diagnostic I'm calling a foil-swap: take the leading candidate explanans from each camp (coal and New World land as against, say, wage structure, or the examination system, or legal-property institutions, or the fragmentation-versus-unification point) and check whether it survives intact when you change the foil or change the scale of the units being compared. My hunch, which I want the proposal to treat as a hypothesis rather than a conclusion, is that some explanans survive foil-swaps and some don't, and that this lets you sort the debate into questions that are genuinely about the same thing and questions that just sound alike.

  Can you write this up as a term-paper proposal, roughly two pages? It should have: the question stated precisely enough that it could have a determinate answer — I'd rather you give me two or three candidate precisifications (e.g. one on which it's a single ill-posed question, one on which it's a family of well-posed questions that have been run together, one on which it's well posed but underdetermined by the evidence) and then tell me which one the paper should actually defend; an account of why neither the "of course it's well posed, here are the causes" camp nor the "stop asking, it's malformed" camp settles it, including what each camp gets right about the other's blind spot; a section-by-section method, so I know what I'd be doing in week 4 versus week 10 and how the foil-swap thing is supposed to work mechanically rather than as a slogan; a statement of what a positive result looks like and what would count as the project failing — including the specific worry that the whole thing collapses into a stipulative exercise where I get to define the question well-posed by fiat; and an honest scope note, because it's one semester, I read no Chinese, and my professor is going to ask what explanatory content the paper delivers beyond a complaint about grammar. No bibliography and don't feel obliged to name every historian in the divergence debate — I'll add citations myself and I care about the conceptual structure. One last thing, and it matters: don't give me a survey that lays out the options and leaves me to choose. Commit. Say which precisification you'd defend if this were your paper, say whether you think the unit mismatch is fatal or just one more foil among many, and if you think this is a bad idea that won't survive contact with a causal-modeling professor, say that plainly and tell me what I should write instead.
