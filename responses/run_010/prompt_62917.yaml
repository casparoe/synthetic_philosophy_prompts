answer: |-
  Here are nine questions ordered by increasing pressure, designed to engage the machinery of her view while remaining accessible. Each mandatory topic is addressed, and four include anticipated answers with follow-ups.  

  **Q1: Constitutive Rules & Variance**  
  Your account replaces a fixed constitutive rule with a family of norms indexed to audience needs. But constitutive rules (like chess moves) usually define a practice *invariantly*. How can a shifting rule still constitute the *same* act-type—assertion—across contexts? Doesn’t this variance risk making "assertion" merely a loose label for disparate acts?  

  **Q2: Redundancy Challenge**  
  Your plural norm seems derivable from two simpler principles: (1) a general norm to *believe* only what’s justified/warranted, and (2) a Gricean requirement to provide evidence adequate for your audience’s needs. If so, isn’t your "norm of assertion" redundant? Why posit a *sui generis* assertion norm at all?  

  **Q3: High-Stakes Lottery Case**  
  In a high-stakes lottery scenario (e.g., asserting "Your ticket lost" to someone betting their life savings), you say the knowledge norm applies, forbidding statistical assertion. But if the speaker has *irrefutable statistical proof* (e.g., 1-in-a-billion odds), and the audience *accepts* this as sufficient, does your view still condemn the assertion? If so, isn’t this overkill?  

  **Q4: Selfless Assertion Revisited**  
  Take a selfless assertion: a deeply anxious climate scientist asserts "CO₂ causes warming" based on overwhelming evidence while doubting it personally. You say this is permissible because their warrant is excellent. But if the *audience* has existential stakes (e.g., policymakers deciding extinction-level interventions), does your view *still* permit this assertion even if the scientist’s anxiety prevents them from *knowing*?  

  **Q5: Opaque Audiences & Default Rules**  
  When audience stakes are opaque (e.g., a stranger on a train) or absent (e.g., publishing in a journal), how does a speaker determine which norm applies? Do you default to a high-stakes rule? If so, doesn’t this collapse into a knowledge norm for public discourse?  
  *→ Expected answer: "Default to high stakes or speaker’s reasonable expectation."*  
  **Follow-up:** But if speakers default to high stakes in opacity, doesn’t this *undermine* your central claim that low-stakes assertions (e.g., "The café is open" to a casual friend) are governed by a weaker norm? Aren’t you conceding that knowledge is the *default* requirement?  

  **Q6: Indeterminate Audiences & Explaining Away Counterexamples**  
  For published testimony (e.g., journalism), audiences vary wildly in stakes. If the norm shifts per reader, how can a journalist ever satisfy it? Suppose they assert based on strong evidence short of knowledge, and a high-stakes reader acts disastrously. Is the assertion improper *for that reader*? If so, haven’t you recreated the very counterexamples (blameless but "improper" assertions) you aimed to explain away?  
  *→ Expected answer: "The norm targets reasonable audience expectations."*  
  **Follow-up:** But if an assertion is proper only when matching *reasonable* stakes, then in cases where a speaker has excellent-but-not-knowledge warrant and *reasonably assumes* low stakes—but unknown to them, stakes are catastrophically high (e.g., a hidden assassin relies on their claim)—is their assertion *improper*? Doesn’t this mirror the "misleading evidence" cases you dismiss as requiring a weaker norm?  

  **Q7: Disclaimer Concession & Norm Strength**  
  You say pairing "P, but I don’t know P" is infelicitous, which you take as compatible with your view. But does this infelicity support a *knowledge* rule or merely that one must *believe* P (since disclaiming belief would also sound odd: "P, but I don’t believe it")? If the latter, doesn’t this suggest the real norm is belief-relative, not audience-relative?  
  *→ Expected answer: "The infelicity arises because asserting while denying knowledge violates the audience’s expectation of warrant sufficient for their needs."*  
  **Follow-up:** But in low-stakes contexts, if your norm only requires *justified belief*, shouldn’t "P, but I don’t know P" be *acceptable*? After all, I’m conceding I lack knowledge while affirming I meet your weaker standard. Yet it still sounds terrible. Doesn’t this suggest knowledge is *always* the implied standard?  

  **Q8: Higher-Order Evidence & Blamelessness**  
  In cases of misleading higher-order evidence (e.g., asserting "The test is reliable" after being falsely told your calibration was faulty), you say speakers are blameless but don’t "know," so a knowledge norm would over-punish. But if the audience has *high stakes* (e.g., medical diagnosis), does your view *still* permit the assertion? If not, how is the speaker blameless for following evidence your own norm deems inadequate?  
  *→ Expected answer: "Blamelessness tracks reasonable effort, not norm satisfaction."*  
  **Follow-up:** Doesn’t this separate propriety from blamelessness? If so, why call unsatisfied norms "norms of assertion" at all? Couldn’t a knowledge theorist similarly say knowledge is the norm, but speakers are blameless when misled?  

  **Q9: Falsifiability**  
  Finally, what observable patterns in competent speakers’ judgments or behavior would decisively count against your view? For instance, if we found that speakers *never* relaxed warrant standards in low-stakes contexts, or that audiences *always* rejected "I don’t know" concessions regardless of stakes, would that refute you?  

  ---  
  **Key Design Notes:**  
  - **Pressure escalation** begins with conceptual foundations (Q1–Q2), moves to applied cases (Q3–Q4), intensifies with audience opacity problems (Q5–Q6), and targets core commitments (Q7–Q9).  
  - **Mandatory topics covered**: constitutive rules (Q1), audience opacity (Q5–Q6), redundancy (Q2), disclaimer concession (Q7).  
  - **Follow-ups** anticipate retreats to high-stakes defaults (Q5), reasonable expectations (Q6), blamelessness/norm divergence (Q8), and conflating belief/knowledge in disclaimers (Q7).  
  - **Accessibility**: Each question avoids jargon, framing objections through intuitive scenarios (lottery tickets, train strangers, journalists, climate scientists).  
  - **Falsifiability** (Q9) forces reflection on empirical commitments, avoiding theory insulation.  

  These questions avoid recapitulating literature while assuming listener familiarity only with the basic "norms of assertion" debate. Each follow-up tightens the vise by showing how her likeliest replies expose new vulnerabilities.
