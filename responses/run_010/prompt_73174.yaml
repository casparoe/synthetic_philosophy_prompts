prompt: |-
  I'm the site supervisor on a developer-funded rescue excavation — a Bronze Age settlement with about six weeks left in the season — and the client's press officer has already drafted a release describing our Building 4 as a prehistoric shrine. I have to decide what goes into the interim report before that release is issued, and I can't get a straight answer from anyone on site.

  Here is what we actually have. Building 4 is a rectangular timber structure, roughly six by nine metres, standing about forty metres apart from the main cluster of houses on a slight rise. Inside: a plastered bench along one wall; a stone-lined pit in the corner containing burnt grain and ash but no cooking debris and no butchered bone; and a concentration of 41 complete or near-complete pots along the eastern wall, most crushed in place. Two of those pots have holes drilled through them after firing, so they could not have held anything. Immediately outside the doorway is a pit with nine cattle mandibles, mostly from young animals, deposited together. Inside the building there is almost no domestic refuse: no loom weights, no quern fragments, no hearth with cooking residue, no midden. The yard outside has a normal scatter of all of those.

  My director calls it a cult building and wants the report to say so plainly. My finds specialist says the pot concentration is a collapse deposit — vessels stacked on a shelf, roof failure — that the perforated ones are simply broken or misfired pots that were reused as something else, and that a bench and a stone-lined pit are exactly what you would expect in a granary or storeroom. She also notes that Building 4 was swept clean before it was abandoned, so the absence of rubbish may be evidence about a broom rather than about a god. Meanwhile one of the PhD students sent me a checklist she copied out of a book: a special natural setting; a building set apart from ordinary life; attention-focusing features in the architecture; a cult image or a stand-in for one; special facilities such as altars, benches, basins or libation pits; food and drink brought in and consumed, burnt off or poured away; the same symbols recurring over and over. She has ticked six boxes for Building 4. I ticked the same six and still feel as though I know nothing more than I did before.

  Three things I can't work out. First, does ticking that checklist constitute evidence at all, or is it built so that any structure whose everyday use isn't immediately obvious to us will pass it? Second, if the collapse-and-storeroom story accounts for every single thing we recovered, is there anything left over for the shrine story to account for, or am I simply preferring the more interesting option? Third — and this is the part nobody on site wants to raise — I'm not convinced the two stories are even rivals. It is entirely possible that the same building held the harvest and was also where something was done with it, and that the people who built it would not have recognised the line I'm being asked to draw down the middle of it. If that's right, what should the report say? "Ritual and storage" reads like a fudge that lets everyone off, and "we found a building with a bench and a lot of pots" is true and useless.

  I also owe the press officer a yes-or-no answer by Friday on whether we can call it a shrine. Tell me what a defensible answer to her looks like, and what the interim report should say, and where the line runs between honest qualification and hiding behind it. And be explicit throughout about which parts of what you tell me would be treated as settled by people who do this for a living and which are genuinely argued about among them — I don't want to walk into Friday's meeting asserting as standard practice something that turns out to be one school's view.
reasoning: |-
  Okay, the user is a site supervisor on a Bronze Age excavation with a pressing dilemma about interpreting a building. They need to decide how to describe "Building 4" in an interim report before a press release calls it a "prehistoric shrine." There are conflicting opinions on site: the director wants to label it a cult building, the finds specialist thinks it's a storeroom, and a PhD student has a checklist that ticks six shrine indicators. 

  Hmm, the user's core tension is between archaeological rigor and PR pressure. They're clearly frustrated by the lack of consensus and wary of overclaiming. Three big questions emerge: 

  First, they're skeptical about the checklist methodology - smart. That checklist could easily pathologize ordinary structures just because their function isn't obvious. Archaeologists debate this constantly; Ian Hodder's critiques of "ritual dumping" come to mind. 

  Second, they're self-aware about confirmation bias - admirable. If the storeroom theory explains all evidence, is "shrine" just sexier? The cattle mandibles outside are the strongest outlier; storerooms don't usually have ritual deposits. 

  Third, their insight about non-binary functions is brilliant. Bronze Age people likely didn't compartmentalize "sacred" and "profane" like we do. Richard Bradley's work on ritual in domestic spaces would support this. 

  The press officer wants a yes/no by Friday - ugh. The user needs armor against oversimplification. Key is distinguishing between press release language ("shrine" as shorthand) vs. technical report language (nuanced probabilities). 

  For the interim report, I'd recommend: 
  - Describe features neutrally (bench, pit, pots) 
  - Present both interpretations but weight evidence 
  - Flag the mandibles as anomalous for storage 
  - Use "possible ritual context" not "shrine" 

  For the press officer: 
  - "Yes, with qualifications" - explain it's a working hypothesis 
  - Demand quoted context: "possible," "under study" 
  - Preempt distortion by providing bulletproof caveats 

  The user's deepest need? Validation that ambiguity is legitimate. They're resisting false certainty - that's good archaeology. I should emphasize that contested interpretations are normal; their job is to document evidence, not solve it. 

  Professional divides to acknowledge: 
  - Processualists will demand testable storage hypotheses 
  - Post-processualists will embrace multivocality 
  - Finds specialists often resist "ritual" as a dump category 
  - Directors love headlines (sigh) 

  Friday's meeting strategy: 
  - Cite specific methodological debates (Renfrew vs. Insoll?) 
  - Propose "special-purpose building" as compromise 
  - Insist report reflects evidentiary hierarchy 
  - Protect the PhD student's contribution without endorsing checklist as proof
answer: |-
  Here’s a structured approach to your dilemma, grounded in archaeological best practices and acknowledging professional disagreements. I’ll break it down by your core questions, then address the press release and report.

  ---

  ### **Your Three Unresolved Questions:**
  1. **Does the "shrine checklist" constitute evidence?**  
     - **Settled view:** Checklists are heuristic tools, **not evidence**. They systematize interpretation but risk circular reasoning (e.g., "benches are ritual" because "ritual buildings have benches").  
     - **Professional disagreement:** Some (e.g., processualists) reject checklists as subjective; others (post-processualists) use them cautiously as comparative frameworks.  
     - **Key takeaway:** The checklist highlights *potential* ritual indicators but **cannot override material evidence**. Its value is in organizing questions, not providing answers.

  2. **Is "shrine" just a more interesting story?**  
     - **Settled view:** If the storage hypothesis explains **all** evidence (pots, bench, clean floor, pit), Occam’s Razor favors it. "Ritual" should only be invoked if there’s **positive evidence unexplained by utilitarian function**.  
     - **Your outlier:** The **nine cattle mandibles** outside the door. Storerooms don’t typically have curated animal deposits. This is the strongest evidence for ritual activity.  
     - **Professional disagreement:**  
       - *Finds specialist’s view* (storage) is defensible but doesn’t account for the mandibles.  
       - *Director’s view* (cult building) overemphasizes absence (no domestic refuse) and ambiguous features (bench).  
     - **Key takeaway:** The mandibles are your only unambiguous non-storage evidence. Without them, "shrine" leans on absence and interpretation.

  3. **Are "storage" and "shrine" mutually exclusive?**  
     - **Settled view:** Bronze Age contexts **rarely separate "ritual" and "domestic"** rigidly. Storerooms could host rituals (e.g., harvest blessings). Buildings often had layered functions.  
     - **Professional disagreement:**  
       - Traditionalists demand functional labels (e.g., "shrine," "house").  
       - Contemporary practice (e.g., Hodder, Bradley) emphasizes fluidity.  
     - **Key takeaway:** Insisting on a binary ("storage OR shrine") is **anachronistic**. Your report should reflect functional ambiguity.

  ---

  ### **Interim Report Recommendations:**  
  **Goal:** Describe evidence neutrally, present interpretations with weighting, and flag uncertainties.  
  **Structure:**  
  1. **Objective description:**  
     - *Layout:* Rectangular timber structure, isolated location, plastered bench, stone-lined pit (contents: burnt grain/ash), ceramic concentration (41 pots, 2 perforated), external mandible pit.  
     - *Absences:* No cooking debris, butchered bone, loom weights, or querns inside (vs. exterior scatter).  
  2. **Interpretations:**  
     - **Storage hypothesis (granary/storeroom):** Accounts for clean interior, bench (drying/staging?), grain pit, stacked pots (collapse). Perforated pots = repair/reuse.  
     - **Ritual hypothesis (special-purpose building):** Supported by isolation, mandible deposit, burnt grain (offering?), perforated pots (ritual objects?), absence of domestic debris.  
     - **Ambiguity:** Note possible functional overlap (e.g., storage with ritual activity).  
  3. **Assessment:**  
     - "The storage interpretation parsimoniously explains most features. The cattle mandibles and perforated vessels are anomalous but not conclusive. A special-purpose function (including ritual) remains plausible but requires further analysis."  

  **Avoid:**  
  - Declarative labels ("shrine," "cult building").  
  - Overemphasizing absence as evidence.  
  - Checklist-derived conclusions.  

  ---

  ### **Press Officer Response (Yes/No by Friday):**  
  **Defensible Answer:**  
  > *"You may describe Building 4 as a* **possible shrine or special-purpose building** *based on current evidence, but this is a* **working hypothesis** *pending full analysis. The press release must include:*  
  > - *Explicit reference to the alternative interpretation (storage function).  
  > - A disclaimer that conclusions are preliminary.  
  > - Emphasis on the cattle mandibles and perforated pots as key evidence."*  

  **Why this works:**  
  - Allows the "shrine" angle (satisfying director/press) while qualifying it.  
  - Forces transparency about uncertainty.  
  - Uses "special-purpose building" as a safer umbrella term.  

  **Line between honesty and evasion:**  
  - **Hiding:** Claiming certainty ("this *is* a shrine") or omitting alternatives.  
  - **Honest:** Acknowledging interpretations, weighting evidence, and admitting ambiguity.  

  ---

  ### **Professional Divides (What’s Settled vs. Contested):**  
  | **Aspect**                  | **Settled Practice**                                       | **Active Debate**                                       |  
  |-----------------------------|-----------------------------------------------------------|--------------------------------------------------------|  
  | **"Ritual" as explanation** | Requires **positive evidence** (e.g., votives, repeated symbols). Absence ≠ ritual. | How to define "ritual" in non-textual societies.       |  
  | **Functional fluidity**     | Bronze Age spaces often multi-functional; binaries are reductive. | Whether to prioritize "practical" over "symbolic" in labeling. |  
  | **Press engagement**        | Press releases must qualify interpretations.              | How strongly to frame preliminary hypotheses.          |  
  | **Checklists**              | Not evidence; only analytical tools.                      | Their utility vs. inherent bias.                       |  

  ---

  ### **Friday Meeting Strategy:**  
  1. **Cite consensus:** Start with settled practices (e.g., "ritual requires positive evidence; our only clear outlier is the mandibles").  
  2. **Acknowledge divides:** Note that functional fluidity is widely accepted, but labeling preferences vary.  
  3. **Propose compromise:** Push for "special-purpose building" in the report and "possible shrine" in the press release *with mandated caveats*.  
  4. **Defend rigor:** Stress that overclaiming risks professional credibility and misleads the public.  

  **Final note:** You’re right to question false binaries. The strongest scholars today see Bronze Age ritual as embedded in daily life. Your report can advance this by refusing simplistic labels and centering evidence.
