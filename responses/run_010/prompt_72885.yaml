prompt: |-
  I record a fortnightly podcast on political philosophy, and next week's guest is a political theorist who defends what she calls the disclosure condition on dirty hands: an act of political wrongdoing — torture, assassination, the deceiving of one's own electorate — is justified only if the agent could announce it in full, with reasons, both to the people it wrongs and to the public who must live with it. Covert cases are therefore not tragic necessities but simply unjustified, and the familiar talk of moral residue and agent-regret is, on her account, nothing more than the agent's own inarticulate recognition that the act will not survive announcement.

  Write me eight to ten questions that get past the slogan. I want at least one each on: the stock example of withholding a warning from a city in order to protect the fact that an enemy cipher has been broken, where the announcement would itself cause the harm the act was meant to prevent; the charge that she has merely reinstated clean-hands absolutism under a new name, and so cannot explain why the constraint is felt as tragic rather than as ordinary prohibition; and whether a condition on announcing particular decisions has been confused with the quite different requirement that a society's principles be publicly acknowledged. For each, give me a follow-up keyed to the answer she is most likely to give — she is very fluent at retreating to disclosure before a properly constituted oversight committee — and close with a question about what would count as evidence against her view.
reasoning: |-
  Okay, the user hosts a political philosophy podcast and needs questions for an upcoming guest who defends the "disclosure condition" on dirty hands. This theorist argues that covert acts like torture or deception are never justified unless they can be publicly announced. The user wants deep, non-surface-level questions that challenge her position.

  Hmm, the guest seems sophisticated - the user mentions she's fluent at retreating to oversight committees as sufficient disclosure. That suggests she's adept at deflecting standard objections. The real challenge here is pinning down what makes her view distinct from absolutism and how it handles cases where announcement itself causes harm.

  Right, the user specifically wants three things covered: 1) the broken cipher case where announcement defeats the purpose, 2) whether this is just absolutism rebranded, and 3) confusing announcement of decisions versus public principles. Also needs evidence that could falsify her view.

  Interesting tensions here. If disclosure is impossible in cipher cases, does that mean the act is unjustified even if it saves lives? And if oversight committees count as "properly constituted" disclosure, doesn't that make the condition too easy to satisfy? The society's principles point cuts deep - maybe what matters is not announcing specific ops but whether covert action fits within publicly endorsed frameworks.

  For follow-ups, need to anticipate her likely moves. When she invokes oversight committees, should press on whether that's meaningfully different from covert action itself. For the absolutism charge, her "tragic constraint" language seems key - is she saying the prohibition feels different psychologically, or that there's actually a moral difference?

  The evidence question is crucial. If she can't name what would change her mind, that suggests dogma. Maybe historical cases where undisclosed actions later revealed as necessary? Though she'd probably say they still weren't justified at the time.

  Better structure around her core claims: 1) announcement possibility as justification condition 2) non-absolutism 3) oversight as sufficient 4) difference from public principles. Each needs a question and a sharp follow-up.

  The cipher case needs special care - it's her hardest challenge. If she bites the bullet ("yes, letting a city be bombed is required"), that seems counterintuitive but consistent. If she stretches "could announce" to hypothetical scenarios, that might weaken her position. The follow-up should test how far she'll bend.

  Closing with falsifiability is smart - makes her commit to what could undermine the theory. Should also consider whether her view collapses into either absolutism or consequentialism depending on how she handles edge cases.

  This guest sounds formidable. The questions need to be watertight to prevent retreat to talking points. Focusing on concrete cases and logical implications rather than abstract principles might work best. The oversight committee dodge in particular needs cornering - is "properly constituted" doing all the work here?
answer: |-
  Here are eight focused questions probing the disclosure condition, with strategic follow-ups anticipating her likely responses and closing with falsifiability:

  1.  **Core Tension & Harmful Disclosure:** Your condition seems clearest when disclosure *after* the act wouldn't nullify its purpose. But take the classic case: breaking an enemy cipher, then withholding a warning about an impending attack on City X to protect the cipher secret. Announcing *why* you withheld the warning *after* the attack reveals the broken cipher, rendering the sacrifice futile and inviting future attacks. Doesn't this show the condition is impossible to satisfy precisely *because* the act successfully prevented greater harm? How can disclosure be a necessary condition here?
      *   *Likely Answer:* "Disclosure *could* still be made hypothetically to a properly constituted, confidential oversight body *before* the act, justifying it under constrained conditions."
      *   **Follow-Up:** Doesn't shifting to confidential oversight fundamentally alter the "public" nature of "announce[ment] to the people it wrongs and to the public"? If justification hinges on secrecy *from the very public/wronged parties* during the crucial oversight phase, haven't you conceded that the core public disclosure demand is incompatible with some necessary acts, making oversight a functionally *covert* justification mechanism?

  2.  **Absolutism Rebranded?:** Critics might argue that by requiring *impossible* public justification (as in the cipher case) or justification that would *prevent* the act (e.g., "I'm torturing this suspect"), you effectively prohibit these acts entirely. Isn't the "disclosure condition" simply clean-hands absolutism – the prohibition of certain acts *as such* – dressed in procedural language? How does your view genuinely allow for the possibility of a justified, yet inherently wrongful, act?
      *   *Likely Answer:* "It allows for acts where disclosure *is* possible without undermining the act's purpose or core societal trust. The constraint *feels* tragic because it forbids acts that seem necessary *only when* public justification is impossible – a distinct category from ordinary prohibitions."
      *   **Follow-Up:** If the "tragedy" stems *only* from the impossibility of disclosure in that specific context, not the inherent wrongfulness of the act *plus* necessity, doesn't that reduce the "dirty hands" element to mere *procedural frustration* ("I wish I could tell you!") rather than genuine *moral taint* from violating a deep norm? Where is the substantive wrong demanding remorse beyond regret for the secrecy?

  3.  **Announcement vs. Public Principles:** Could the requirement for announcing *particular* decisions be conflated with the different Rawlsian idea that a *society's fundamental principles* must be publicly acknowledged? Could a society publicly endorse a *principle* allowing certain covert actions (under strict oversight, for extreme threats) without demanding disclosure of *each specific operation*? Doesn't this satisfy the "publicity" requirement for justification at the level of the basic structure, even if operational details remain classified?
      *   *Likely Answer:* "Endorsing a *principle* permitting covert action is insufficient. True justification requires the *specific act* and *its actual reasons* to be defensible to the public and the wronged – a principle is too abstract. Publicly endorsing torture-as-principle is itself morally corrosive and unlikely."
      *   **Follow-Up:** If the public *has* endorsed, via democratic process and robust oversight laws, a principle permitting *certain* covert actions (say, targeted disruption of imminent WMD plots) under strict judicial review, isn't the *specific* act justified *through that public framework*? Must each citizen hypothetically approve each drone strike *post-hoc* for it to be justified, or does the legitimacy of the publicly authorized *system* suffice, even with operational secrecy?

  4.  **The Nature of "Could Announce":** What does "could announce" entail? Is it logical possibility ("I *can* say these words"), practical possibility without self-defeat (as challenged in Q1), or a stronger normative sense ("it would be morally acceptable/reasonable to announce it")? How do you avoid the charge that "could announce" collapses into "is permissible to announce," making the condition circular?
      *   *Likely Answer:* "It means it is possible to articulate the true reasons for the act in a way that could, in principle, be understood by the relevant audiences *without* the act of announcement itself directly causing the harm the act was meant to prevent (though it may cause other consequences like outrage)."
      *   **Follow-Up:** Doesn't the "without directly causing the harm" clause reintroduce consequentialist reasoning *into* the disclosure condition itself? If preventing the *consequence* of disclosure nullifying the act's purpose is a necessary part of satisfying "could announce," isn't consequentialism doing the real justificatory work here, with disclosure merely acting as a (sometimes defeasible) filter?

  5.  **Oversight as Disclosure Substitute:** You often invoke disclosure to a "properly constituted oversight committee" as sufficient. What constitutes "properly constituted"? Must it have genuine independence, authority to punish, represent the wronged/public, and crucially, the *power to veto* the action *before* it happens? How does this differ, morally, from simply having a trusted leader make the covert decision?
      *   *Likely Answer:* "A properly constituted committee has statutory independence, security clearance, investigative powers, representativeness (e.g., bipartisan legislators, judges), and yes, ideally, pre-authorization/veto power. This transforms a covert *individual* decision into a publicly accountable *institutional* one."
      *   **Follow-Up:** If the committee's deliberations and the *specific justifications* presented to it remain permanently secret from the public and the wronged parties, how does this *institutional secrecy* fundamentally differ, in terms of the "recognition that the act will not survive announcement," from the original covert act? Doesn't the "moral residue" simply transfer to the *secret committee decision*?

  6.  **Moral Residue & Agent-Regret:** You dismiss "moral residue" and "agent-regret" as mere inarticulate recognition that the act won't survive public scrutiny. But many experience profound guilt *even when* they believe full disclosure *would* be possible and justified (e.g., a medic amputating a limb to save a life). Doesn't this suggest the negative feeling stems from the *inherent wrongness* of the act itself (causing harm/deception), not *just* its secrecy? How does your view account for justified acts that *can* be disclosed but still feel profoundly wrong?
      *   *Likely Answer:* "In cases like the medic, the feeling is regret for the harm *caused*, not specifically *agent-regret* for having committed a wrong *qua* wrongdoer. Dirty hands agent-regret *is* specifically tied to the violation of a deep moral norm *in a way that cannot be publicly vindicated*."
      *   **Follow-Up:** If the medic feels not just regret for the harm but a specific *guilt* ("I violated bodily integrity"), even knowing disclosure would justify it, doesn't this point to a *substantive* wrong inherent in the act-type, independent of publicity? If disclosure *removes* agent-regret in dirty hands cases, as you claim, why wouldn't it also remove the medic's guilt? What's the difference?

  7.  **Scope of "The People it Wrongs":** Who exactly constitutes "the people it wrongs" demanding disclosure? In deceiving an electorate, is it all citizens? The specific voters misled? Future generations? In assassination, is it the target's family? Their compatriots? The international community? How does defining this group not become impossibly broad or arbitrarily narrow?
      *   *Likely Answer:* "It is those directly harmed or whose fundamental rights/interests are directly set back by the act, and the relevant political community that must live under the norms set by the act."
      *   **Follow-Up:** In the cipher case, the "people wronged" (citizens of City X) are *precisely* the group to whom disclosure would be catastrophic. Doesn't this create an irresolvable conflict *within* your condition – the justification requires announcement to those whose interests the act sacrificed, but that announcement destroys the justification? How is this not a fatal paradox?

  8.  **Falsifiability & Evidence:** What concrete evidence or historical/practical scenario *could*, in principle, persuade you that your disclosure condition is too strict? For instance, imagine irrefutable evidence that a specific, *never disclosed* covert action (e.g., a deception or targeted killing) demonstrably prevented a catastrophic war or genocide that *no* publicly justifiable action could have prevented at the time. Would such evidence count against your view, or would you maintain the act was still unjustified?
      *   *Likely Answer:* "It might show the act had good consequences, but not that it was *morally justified*. The condition is deontic, not consequentialist. Genuine justification requires the act could withstand public moral scrutiny, not just that it worked."
      *   **Follow-Up:** If *no* conceivable successful outcome from an undisclosable act can justify it, and *only* acts that meet the disclosure condition are ever justified, doesn't this confirm the absolutist charge (Q2)? Isn't the *only* evidence that could falsify your view the demonstration that the disclosure condition *itself* is not a fundamental requirement of political morality?

  These questions target the conceptual tensions (disclosure vs. harm, particular vs. principle), practical implications (oversight committees), the nature of the tragic constraint, and the core justificatory structure, while anticipating her likely retreats and forcing consideration of the theory's limits. The closing question directly addresses its potential unfalsifiability. Good luck with the interview!
