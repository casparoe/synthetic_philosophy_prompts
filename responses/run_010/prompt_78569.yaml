  ### Hands-On Activity: "The Predictive Sort"

  **Objective:** Explore whether scientific categories reflect natural divisions or human conventions by experiencing how different classifications predict hidden properties.

  #### Materials (Printable on Paper/Cardstock):
  - **36 specimen cards** (see design below).
  - **Property reveal sheets** (for facilitator; lists hidden properties per card).
  - **Scoring sheets** (simple tally for groups; participants count pure groups).
  - **Timer**.

  ---

  ### Card Design (Front: Visible Properties)
  Each card shows three properties:
  - **Shape**: Circle, Square, or Triangle.
  - **Color**: Red, Blue, or Green.
  - **Pattern**: Striped, Dotted, or Solid.

  **Distribution (36 cards):**
  - **Shape**: 12 Circles, 12 Squares, 12 Triangles.
  - **Color**: 12 Red, 12 Blue, 12 Green (evenly distributed across shapes).
  - **Pattern**:
    - Circles: 6 Striped, 6 Dotted.
    - Squares: 6 Striped, 6 Dotted.
    - Triangles: 12 Solid (no Striped/Dotted).

  ---

  ### Hidden Properties (Back of Cards / Facilitator Sheet)
  | Card            | Property X (Reaction to Acid) | Property Y (Magnetic Field) | Property Z (Density) |
  |-----------------|-------------------------------|-----------------------------|----------------------|
  | Circles (all)   | Fizzes                        | Weak                        | Light               |
  | Squares (all)   | Fizzes                        | Strong                      | Heavy               |
  | Triangles (all) | No reaction                   | Weak                        | Heavy               |

  **Key:**
  - **Property X**: Fizzes / No reaction.
  - **Property Y**: Weak / Strong.
  - **Property Z**: Light / Heavy.

  ---

  ### Scoring Scheme
  - **No money needed!** Groups earn 1 point for each "pure" group in their sorting (all cards in the group share the same value for the hidden property).
  - **Example**: A group with all "Fizzes" scores 1 point. A group mixing "Fizzes" and "No reaction" scores 0.

  ---

  ### Timeline (75 Minutes)

  | Time    | Activity                                                                                              | Facilitator Notes                                                                 |
  |---------|-------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------|
  | 0-5 min | **Introduction**<br>- Distribute cards (face up).<br>- "Sort these into groups that feel natural. Your goal is to predict hidden properties we’ll reveal later." | No definitions, no jargon. Keep it open-ended.                                    |
  | 5-20 min| **Sorting Round 1 (Property X)**<br>- Groups sort cards (any system).<br>- Ask: "Why did you group this way?" (No judgment). | Circulate. Note common sortings (likely shape, pattern, or color).             |
  | 20-25 min| **Reveal Property X**<br>- Flip cards/show sheet. Groups score their sorting (1 pt per pure group). | Top scores: **Shape** (3 pure groups) and **Pattern** (3 pure groups) tie.        |
  | 25-30 min| **Change the Task**<br>- "Now, imagine your task shifts: Predict a *different* hidden property."      | No hints. Groups may assume the new property is similar to X.                   |
  | 30-45 min| **Sorting Round 2 (Property Y)**<br>- Groups re-sort for Property Y.                                | Many will reuse their Round 1 system (shape/pattern).                             |
  | 45-50 min| **Reveal Property Y**<br>- Groups score again.                                                       | **Color** wins (3 pure groups). Shape/pattern score poorly.                     |
  | 50-60 min| **Tie-Breaker (Property Z)**<br>- "Two systems tied on Property X (shape/pattern). Which predicts Property Z better?"<br>- Compare shape-sorting vs. pattern-sorting using Property Z. | Score shape: 3 pure groups (all Light/Heavy match). Score pattern: 1 pure group (Solid group). |
  | 60-75 min| **Debrief**                                                                                         | Guide discussion (see below).                                                     |

  ---

  ### Debrief (15 Minutes)
  **Map to Philosophy:**
  1. **Realism vs. Conventionalism**  
     - **Realist view**: "Shape predicted X *and* Z best—it 'carves nature at the joints.' Properties exist independently of us."  
     - **Conventionalist view**: "When we prioritized Y, color became 'natural.' Our goals shaped what counted as a good system."  

  2. **The Twists**  
     - **First twist (task change)**: Success isn't fixed. One system (shape/pattern) worked for X, but failed for Y. Categories are tool-dependent.  
     - **Second twist (tie-breaker)**: Property Z revealed shape as "deeper" than pattern—but only *after* we tested it. Naturalness isn’t obvious upfront.  

  3. **Your Diagnostic Story**  
     - "Like the first diagnosis for your son, shape worked for X (symptoms at age 7). The second diagnosis (like color for Y) addressed new data (age 11). Neither was 'wrong'—each optimized predictions for a specific context."  

  **Close with a Question**:  
  - "If no system predicts everything perfectly, how do we choose categories in science or medicine? By predictive power? Simplicity? Or something else?"  

  ---

  ### Predictable Challenges & Limitations
  1. **What Could Go Wrong**:  
     - **Round 1**: Groups sort by color (scores low). *Mitigation*: Note that "unnatural" sortings exist, but highlight the tie between shape/pattern.  
     - **Tie-Breaker Feels Like a "Gotcha"**: If groups resent Property Z favoring shape. *Mitigation*: Stress that Z wasn’t "hidden truth"—it *could* have favored pattern if designed differently.  
     - **Overgeneralization**: "Shape is always best!" *Mitigation*: Remind them color won Round 2.  

  2. **What the Game Can’t Capture**:  
     - **Theory-Ladenness**: In reality, categories aren’t just from data—they’re shaped by theories (e.g., "autism spectrum" reflects new models of neurodiversity, not just symptoms). *You’ll need to add this verbally*.  

  ---

  ### Printable Specimen Cards (Front Only)
  Print 36 cards with these combinations (backside has hidden properties from the table above):  
  - **12 Circles**:  
    - 4 Red (2 Striped, 2 Dotted)  
    - 4 Blue (2 Striped, 2 Dotted)  
    - 4 Green (2 Striped, 2 Dotted)  
  - **12 Squares**:  
    - 4 Red (2 Striped, 2 Dotted)  
    - 4 Blue (2 Striped, 2 Dotted)  
    - 4 Green (2 Striped, 2 Dotted)  
  - **12 Triangles**:  
    - 4 Red (Solid)  
    - 4 Blue (Solid)  
    - 4 Green (Solid)  

  **Card Template (Example)**:
  ```
  [Front]
  Shape: Square  
  Color: Blue  
  Pattern: Dotted
  ```
  ```
  [Back] → For facilitator only
  Property X: Fizzes  
  Property Y: Strong  
  Property Z: Heavy
  ```

  ---
  **Final Note**: This works best if you emphasize *experience* over debate. Participants feel predictive power—and its limits—in their hands. When they connect it to your story, the "aha" moment resonates.
