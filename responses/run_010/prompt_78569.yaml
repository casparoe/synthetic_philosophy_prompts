     I'll assume one deck for the whole group.

   Timeline:

     0-5 min: Introduction. Explain that they will be given cards with three properties. Their task is to sort the cards into groups (any number of groups) such that within each group, the cards are similar. The goal is to predict a hidden property that will be revealed later. No further explanation.

     5-15 min: Sorting round 1. Participants sort the deck into groups based on the visible properties. They can choose any criteria. Facilitator does not interfere. They should not look at the back.

     15-25 min: Reveal Property X (Reaction to A) for all cards (by flipping the cards or by the facilitator reading). Participants score their sorting: for each group, if all cards in the group have the same Reaction to A, they get 1 point. They record the total score.

     25-30 min: Participants report their scores. We expect to see scores of 3 for groupings by shape or pattern, and lower for others.

     30-35 min: Change of practical task: "Now imagine that we are no longer interested in Reaction to A, but in Reaction to B. Please resort the cards to predict Reaction to B."

     35-45 min: Sorting round 2. Participants resort the deck.

     45-55 min: Reveal Property Y (Reaction to B). Score each group: 1 point per group that is pure in Reaction to B.

     55-60 min: Report scores. We expect groupings by color to score 3.

     60-65 min: Now, facilitator says: "For the first property (Reaction to A), we had two ways of sorting that were equally good: by shape and by pattern. Now we have a new property, Weight. We will now score both the shape grouping and the pattern grouping for Weight."

          - The facilitator or a volunteer sorts the deck by shape (into 3 groups: Circle, Square, Triangle).
          - Another volunteer sorts by pattern (into 3 groups: Striped, Dotted, Solid).
          - Reveal Property Z (Weight) for all.

     65-70 min: Score both groupings for Weight purity:
          - For the shape grouping: each group is pure? Circle: all 10, Square: all 20, Triangle: all 30 -> 3 points.
          - For the pattern grouping: 
               Striped: contains only Circle and Square -> weights 10 and 20 -> mixed -> 0 points for this group.
               Dotted: similarly, 10 and 20 -> mixed -> 0 points.
               Solid: 30 -> pure -> 1 point.
          Total for pattern grouping: 1 point.

     70-75 min: Debrief.

     However, note: the reveal of Property Z is for tie-breaking between the two sortings that were tied on Property X. We show that for Weight, the shape grouping is better.

   Debrief:

     We map to realism and conventionalism:

       - Realism: There are natural kinds that carve nature at its joints. The shape grouping turned out to be not only good for Reaction to A, but also for Weight. It might be that shape is a more fundamental property.

       - Conventionalism: The groupings we choose depend on our interests. When we cared about Reaction to A, both shape and pattern were good. When we cared about Reaction to B, color was good. There is no one right way.

     Then connect to the diagnostic revision:

       "In the case of my son, the first diagnosis might have been useful for predicting and addressing certain symptoms at age seven. The second diagnosis at eleven might be better for predicting a different set of symptoms or for guiding treatment at that age. The change does not necessarily mean the first diagnosis was 'wrong' — it might have been the best available joint to carve at the time for the purposes then. But as new data comes in (like the weight property in our game) or as the child grows and new properties become relevant, a different carving might become more useful."

     What will predictably go wrong:

       - Participants might not sort by shape or pattern in round 1. They might sort by color or by a combination. The scores will be lower. Facilitator should still proceed. In the debrief, note that not every convention is equally useful.

       - The tie-breaking reveal might feel like a gotcha: "You thought pattern was just as good, but now we show you weight and it's not!" To mitigate, emphasize that the purpose changed and that for the first purpose, both were equally good. The new property is new information that might make one grouping more useful in a broader context.

     What the card game cannot reproduce:

       - In science, categories are often revised based on new theoretical understanding, not just new properties. The game focuses on predictive power for observable properties, but sometimes categories change because of a new theory that reinterprets existing data.

       - The game assumes that properties are independent and can be revealed one by one. In reality, properties may be interdependent and the act of classification may influence which properties we look for.

     The facilitator must supply: 
          The insight that classification in science often involves a feedback loop between theory and observation, and that sometimes the same set of data can be explained by competing theories that suggest different classifications.

