  Step four handles non-merit pressures. The anonymity test is crucial here—if the reason disappears without author identity, it's invalid. For example, rejecting a paper to avoid backlash from a senior author fails this test. However, the grad student's funding issue might seem sympathetic, but it still fails anonymity and should be rejected. The procedure forces AEs to categorize reasons correctly and escalate ambiguous cases. The three test cases show how this works: the senior author's paper is accepted only if it passes merit checks, despite their behavior. The grad student's weak paper is rejected. The strong but overpublished paper is escalated for a strategic decision by the editor.

  The user's homemade tests are repaired: anonymity separates author-related pressures from manuscript-related reasons, and flip tests check for consistency. The procedure acknowledges that non-merit factors can't justify overriding merit-based judgments. Areas of contention in philosophy, like whether pragmatic reasons can ever be right-kind reasons, are flagged. The editor must decide on capacity issues, as that's a value judgment about the journal's direction.

  Potential issues: AEs might game the system by manipulating quality assessments, but starting with strict quality checks reduces this risk. The ten-minute limit is tight, but steps are designed to be quick, with clear thresholds. Cases like the strategic paper require escalation, acknowledging that some decisions need higher-level input. Overall, this procedure ensures decisions are based on merit and fit, with non-merit pressures filtered out, maintaining the journal's integrity while being practical for AEs.
answer: |-
  Here’s a practical 4-step procedure designed for your AEs, grounded in the "right-kind/wrong-kind" distinction but adapted for **action-based decisions** (desk-reject/send-out/escalate). It repairs your homemade tests, avoids jargon, and flags philosophical disputes. Total time: ~8-10 minutes per manuscript.

  ---

  ### **The Desk Decision Procedure**  
  *(For Associate Editors | Time: 10 min max)*  

  #### **STEP 1: MANUSCRIPT QUALITY (3 min)**  
  **Question:** *"Is this manuscript technically sound and within scope? Does it meet our minimum bar for peer review?"*  
  - **Sufficient Answer:**  
    - ✅ **YES:** Methodologically valid, relevant to journal scope, no fatal flaws (e.g., plagiarism, incoherent argument).  
    - ❌ **NO:** Unfixable technical errors, completely off-topic, or below baseline scholarly standards.  
  - **Action:**  
    - ❌ NO → **Desk-reject** (no further steps needed).  
    - ✅ YES → Proceed to Step 2.  
  - **Values Call?** NO. This is a factual judgment about scholarly adequacy.  

  #### **STEP 2: JOURNAL FIT (2 min)**  
  **Question:** *"Would this paper advance our journal’s scholarly goals *if it were anonymized*?"* (🔧 **Repaired Anonymity Test**)  
  - **Sufficient Answer:**  
    - ✅ **YES:** Novel argument, engages key debates, fits aims/scope *without* author/reputation context.  
    - ❌ **NO:** Redundant (adds nothing new), wrong audience, or better suited for another journal.  
  - **Action:**  
    - ❌ NO → **Desk-reject**.  
    - ✅ YES → Proceed to Step 3.  
  - **Values Call?** NO. Scope is defined by the journal’s published aims.  

  #### **STEP 3: JOURNAL CAPACITY (2 min)**  
  **Question:** *"Would accepting this paper *prevent us* from publishing a better paper on this topic later?"* (🔧 **Repaired Flip Test**)  
  - **Sufficient Answer:**  
    - ✅ **NO CAPACITY ISSUE:** Topic isn’t oversaturated; no backlog of stronger papers.  
    - ⚠️ **CAPACITY CONCERN:** We’ve published >3 similar papers this year, reviewers are fatigued, or a *better* paper is in queue.  
  - **Action:**  
    - ✅ NO ISSUE → Proceed to Step 4.  
    - ⚠️ CONCERN → **Escalate to Editor-in-Chief** (EiC).  
  - **Values Call?** **YES.** Trade-offs between topic diversity/quality are editorial strategy decisions.  

  #### **STEP 4: NON-MERIT PRESSURES (1 min)**  
  **Question:** *"Is there any remaining reason to accept/reject that *fails the Anonymity Test*?"* (e.g., author’s fame, funding risk, board politics).  
  - **Sufficient Answer:**  
    - ❌ **ALL PRESSURES FAIL:** No anonymous-proof reason → **Send for review** (if passed Steps 1-3).  
    - ⚠️ **PRESSURE EXISTS:** E.g., "Rejecting costs author their funding" or "Eminent author will trash us."  
  - **Action:**  
    - ⚠️ PRESSURE EXISTS → **Escalate to EiC** *with justification*.  
  - **Values Call?** **YES.** Pressures are **wrong-kind reasons** for *AEs*; only EiC can override based on journal welfare.  

  ---

  ### **Key Philosophical Grounding**  
  - **Settled Consensus:**  
    - Right-kind reasons (RKR) must be "truth-tracking" (e.g., paper quality fits journal goals).  
    - Wrong-kind reasons (WKR) are external incentives (e.g., "billionaire pays you to believe X").  
    - **Desk decisions = actions** → WKR *can* validly motivate actions (e.g., "don’t poke the bear" to protect journal reputation), but only at the **strategic level** (EiC’s role), not the *scholarly assessment* level (AE’s role).  
  - **Live Disputes (Flagged):**  
    - ⚠️ **Can pragmatic WKR *ever* be RKR for actions?** (Disputed; e.g., "saving a career" as moral duty). Our procedure treats them as *escalate-only* to avoid AE overreach.  
    - ⚠️ **Does "fitness" apply to actions?** (Contested; we use anonymized "journal fit" as a proxy).  

  ---

  ### **Test Case Applications**  
  #### **CASE 1: Senior Author Trashing Journal**  
  - **Step 1:** Technically sound → YES.  
  - **Step 2:** Advances goals if anonymized? → YES (assuming quality).  
  - **Step 3:** Capacity issue? → NO (unless topic is oversaturated).  
  - **Step 4:** Pressure? → "Author will trash us" → FAILS ANONYMITY TEST → **Escalate to EiC**.  
  - **Verdict:** EiC decides. Procedure forces escalation; doesn’t let AE reject for revenge or accept from fear.  

  #### **CASE 2: Weak Paper, Grad Student Funding at Risk**  
  - **Step 1:** Technically sound? → NO ("weak but not hopeless" = below review threshold).  
  - **Action:** **Desk-reject at Step 1.**  
  - **Why it works:** Funding pressure fails Step 1’s quality bar. Anonymity test confirms: if anonymized, you’d reject. Flip test: "Saving funding" isn’t a reason to reject a paper you like.  

  #### **CASE 3: Strong Paper on Oversaturated Topic**  
  - **Step 1:** Technically sound → YES.  
  - **Step 2:** Advances goals if anonymized? → YES.  
  - **Step 3:** Capacity issue? → YES (3+ papers, reviewer fatigue) → **Escalate to EiC**.  
  - **Step 4:** "Rival journal special issue" → FAILS ANONYMITY TEST → **Escalate to EiC**.  
  - **Verdict:** EiC makes strategic call (e.g., "take it for competitiveness" = valid WKR at EiC level).  

  ---

  ### **Limitations & Caveats**  
  1. **Gaming the System:** An AE could inflate/deflate Step 1 quality judgments to force desired outcome.  
     - *Mitigation:* Random audits by EiC; require bullet-pointed justifications for Step 1.  
  2. **Ambiguity in Fit/Capacity:** Two AEs might disagree on "novelty" (Step 2) or "oversaturation" (Step 3).  
     - *Mitigation:* Clear journal guidelines; Step 3 disagreements auto-escalate.  
  3. **Time Pressure:** Step 3 capacity checks require AE knowledge of publication history (~2 min feasible if database is accessible).  
  4. **Uncomfortable Verdicts:** Forces rejection of grad student’s paper (Case 2) despite sympathetic pressure — upholding meritocracy.  

  ### **Why This Works**  
  - **Anonymity Test Repaired:** Filters out author-centric pressures (fame, funding, politics) from scholarly judgments.  
  - **Flip Test Repaired:** Tests consistency (e.g., "topic fatigue" must apply even to papers you love).  
  - **WKR/RKR Framework Applied Correctly:** Scholarly decisions (AEs) use only RKRs; pragmatic actions (EiC) allow WKRs.  
  - **No Jargon:** Uses "anonymized," "journal goals," "capacity" — no "fittingness" or "state-given reasons."  

  Include this in your training packet with two caveats:  
  > *"AEs: Your role is scholarly triage (Steps 1-2). If pressures (author fame/funding) or strategy (topic caps/rival journals) push you toward override, ESCALATE. EiC handles non-merit factors."*  
  > *"Philosophical Note: Debates exist about whether pragmatism can be scholarly (it usually can’t for AEs). When in doubt, escalate."*  

  This creates consistency, contains bias, and reserves tough calls for you — exactly as needed for a rotating AE cohort.
