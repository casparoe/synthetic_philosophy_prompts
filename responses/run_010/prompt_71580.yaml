  The user's explicit needs are a structured decision-making process for AEs, but deeper needs include consistency in decisions despite AE turnover, protecting the journal's reputation, and ensuring fairness. They might also want to minimize backlash from authors, maintain good relationships with board members, and uphold academic integrity. The procedure needs to be efficient, as time is a constraint, and it should handle edge cases where non-merit factors seem compelling.

