prompt: |-
  Two conversations from the past month have left me with the same puzzle, and I have run out of places to look it up. In the first, a colleague of mine — eight years of medical training at punishing hours, a mortgage that will bind him until he is sixty-five, two relocations for his partner's career — treated the suggestion that he give away a tenth of his income to highly effective charities as an obviously excessive demand. Pressed, he granted that the money would do more good elsewhere and granted that the lifetime cost of the mortgage dwarfs the donations, and still maintained that the two cases differ in kind. In the second, a friend who spent two years caring for her mother through a terminal illness, and who describes those years as the hardest and most worthwhile of her life, considers it a reductio of utilitarianism that it might ask her not to have children so that she could donate what raising them would cost. I work in public health policy and have been auditing a graduate seminar in normative ethics for a year, mostly to sharpen my thinking about cost-effectiveness, and I have ended up keeping a private list of these exchanges; the entry they all share is that the resistance does not seem to track the size of the sacrifice at all.

  The second feature on the list is the one I find harder to state. What appears to trigger the objection is not magnitude but the absence of a completion point. Demands with a terminus are accepted however steep — a degree, a loan, a sick parent, a house, a project one can finish — while demands that run on indefinitely, with no state of affairs in which one has finally done enough, are refused however modest. My working hypothesis is that people are not estimating how much morality asks of them but checking whether the asking fits inside a socially recognized script and whether it ever ends. I know this is complicated by parenting, which has no finish line and no obvious point of sufficiency and which nonetheless never attracts the objection, so the second feature cannot be the whole story; whatever the right account is, it has to explain why that case comes out differently.

  So: does this diagnosis have a name? I am not asking about the demandingness objection itself, which I know of, nor about Williams's complaint that impartial moral theories undermine the agent's integrity, nor about Wolf's moral saint, nor about proposals to reserve a protected sphere for the agent's own projects — all of those concern whether the demands are genuine or corrupting, whereas what interests me is a claim about the pattern of what people actually object to. Is there an established concept for the thesis that the objection tracks script-fitting and terminability rather than cost? If nothing in the literature captures it, say so plainly and propose a term with a definition tight enough that I could tell whether a new case falls under it, and tell me which of the neighbors it is most likely to be confused with and how to keep them apart. I also want to know which way the diagnosis cuts. Is it meant to explain the objection away, by showing that the intuitions behind it respond to a factor with no normative weight — and if there is a general name for that style of move in ethics, does invoking it here beg any question against the objector? — or is it meant to reveal what the objection was really about all along, in which case the objectors have been reporting their own psychology inaccurately? Finally, where are the edges: does it extend to demands that are unscripted but clearly bounded, or scripted but open-ended, and does it travel outside consequentialism to, say, a Kantian duty of self-improvement or to the demands of tax compliance? A single label would not help me much; what I need is the carving.
reasoning: |-
  Okay, the user presents a nuanced ethical puzzle based on real-life observations. They've noticed two key features in people's resistance to moral demands: 1) the resistance doesn't correlate with the actual sacrifice size, and 2) the triggering factor seems to be the absence of a completion point rather than magnitude. 

  The user is clearly well-versed in ethics (auditing grad seminars, familiar with Williams/Wolf) but frustrated by the lack of existing frameworks for this specific pattern. Their core needs are: a precise conceptual label if exists, or a newly crafted definition if not; clarification on whether this diagnosis delegitimizes objections or reveals their true nature; and exploration of boundary cases (parenting paradox, non-consequentialist duties).

  Hmm... the parenting counterexample is particularly thorny. Why do people accept open-ended parental duties but reject indefinite charity? The script theory seems essential here—parenting has deep cultural narratives of "life stages" and "empty nest" milestones that create psychological closure, unlike abstract altruism. 

  For the diagnosis' normative implications, we must distinguish between descriptive psychology (how objections form) and prescriptive ethics (whether those objections are valid). The user rightly flags that calling this "rule worship" might beg the question against objectors. Better to present it neutrally as a psychological heuristic.

  On boundaries: tax compliance is scripted and terminable (annual filings), while Kantian self-improvement is unscripted and open-ended—likely triggering similar resistance. This suggests the phenomenon isn't consequentialism-specific but about how demands are framed temporally and culturally.

  The user's depth requires avoiding superficial labels. Instead, we should synthesize: term the core concept "Terminability Heuristic," define its components (script alignment, perceived endpoint), contrast it with demandingness objections, and map its limits using their examples. Their parenting paradox actually strengthens the theory by forcing refinement—scripts can make infinite tasks feel finite.
answer: |-
  Your observation is razor-sharp and identifies a distinct psychological pattern not fully captured by standard ethical critiques. Here's the conceptual carving you need:

  **1. The Core Concept: "Terminability Heuristic" (or "Closure Condition")**

  *   **Definition:** A psychological heuristic whereby individuals evaluate the acceptability of a demand primarily based on whether it is **socially scripted** and **perceived as having a definite endpoint or state of completion**, rather than solely on the magnitude of the sacrifice involved. Resistance arises strongly when a demand lacks both features, even if the ongoing cost is relatively low.
  *   **Key Features:**
      *   **Scriptedness:** The demand aligns with a recognized, culturally validated life narrative or role (e.g., "student," "homeowner," "caregiver for ailing parent," "parent," "taxpayer").
      *   **Terminability/Closure:** The demand offers a clear, achievable point where the obligation is perceived as fulfilled ("degree earned," "mortgage paid off," "parent passes away," "child turns 18/graduates/moves out," "taxes filed for the year").
      *   **Heuristic:** This is a cognitive shortcut, not a deliberate ethical calculation. The *absence* of these features triggers intuitive resistance, often overriding conscious acknowledgment of greater sacrifices elsewhere.

  **2. Contrast with Neighbors & How to Distinguish:**

  *   **The Demandingness Objection:** Focuses on the *absolute or relative burden* of moral demands ("It asks too much!"). Your concept focuses on the *structure and social framing* of the demand ("It asks *indefinitely* and *outside normal scripts*!").
  *   **Bernard Williams' "Integrity" Objection:** Concerns conflicts between impersonal morality and deep personal projects/constitutive commitments. Your concept highlights resistance to *any* indefinite, unscripted demand, even if not deeply tied to core identity (e.g., modest ongoing charity vs. massive one-time loan).
  *   **Susan Wolf's "Moral Saints":** Critiques a life dominated *exclusively* by moral concerns as lacking balance/attractiveness. Your concept explains resistance to *specific types* of ongoing demands (unscripted, unterminated), not necessarily to a morally saturated life overall.
  *   **Rule Worship / Fetishism:** Accuses agents of prioritizing adherence to rules over good outcomes. Your concept isn't about rules vs. outcomes; it's about the psychological comfort of bounded, socially recognized obligations vs. the discomfort of open-ended ones, *regardless* of the underlying rule or outcome.

  **3. Normative Implications: Does it Explain Away or Reveal?**

  *   **Primarily Descriptive/Psychological:** At its core, your diagnosis is a claim about human psychology and how moral intuitions are *triggered*. It doesn't *inherently* say the objection is normatively valid or invalid.
  *   **Potential for Explaining Away (Debunking):** It *can* be used to debunk if argued that resistance based *solely* on the Terminability Heuristic responds to factors (social script, psychological closure) that lack fundamental *moral weight* in assessing the demand's genuine force. The move is similar to identifying a **cognitive bias** (e.g., status quo bias, scope neglect) in moral reasoning.
      *   **Does it Beg the Question?** Potentially, yes, against someone who *grounds* the moral significance of scripts/closure in, say, the importance of personal projects (Williams) or the necessity of non-moral value (Wolf). To avoid begging, the debunker must argue that the heuristic's psychological triggers *don't* reliably track those deeper values in these cases (e.g., "Your mortgage *is* a huge personal project, but why does its scriptedness make it morally immune to comparison with unscripted needs?").
  *   **Potential for Revealing True Concern:** It could reveal that the *core* objection isn't really about sacrifice size *at all*, but about a perceived violation of legitimate expectations regarding life structure and autonomy over long-term commitments. The objectors might be *misreporting* the source of their discomfort, focusing on "sacrifice" when it's really about "lack of closure/script."
      *   **The Parenting Puzzle:** This is key evidence *against* the idea that the true concern is simply about autonomy or personal projects *in general*. Parenting is the ultimate open-ended commitment demanding vast sacrifice! The difference is its profound **scriptedness**. This suggests the revealed true concern is specifically about **demands lacking *both* script *and* terminus**.

  **4. Boundary Testing: Where the Concept Applies**

  *   **Unscripted but Clearly Bounded:** Likely *less* resistance than unscripted/unbounded, but *more* resistance than scripted/bounded. Example: A clearly defined, 5-year pledge to a specific charity project (bounded) for a cause outside normal social scripts (unscripted). Resistance might be moderate ("It's a big commitment, but I know when it ends").
  *   **Scripted but Open-Ended:** Likely *less* resistance than unscripted/unbounded. Parenting is the prime example. Others: "Being a good spouse" (scripted, culturally recognized, but no clear endpoint). Resistance is often low unless specific burdens become overwhelming, precisely *because* it fits a powerful script.
  *   **Outside Consequentialism:**
      *   **Kantian Self-Improvement:** The duty is open-ended and arguably unscripted in its specifics (what counts as improvement? when are you "improved enough"?). This *would* trigger the heuristic and likely cause intuitive resistance similar to open-ended charity. Kantians might counter that the duty is fundamentally about *striving*, not achieving a terminus, but the psychological friction aligns with your concept.
      *   **Tax Compliance:** Highly scripted (legal requirement, annual cycle) and terminable (filing deadline, annual obligation fulfilled). This fits the heuristic perfectly: large burdens are often accepted grumpily because they are bounded and expected. Resistance usually targets *amount* or *perceived unfairness*, not the *structure* of the demand itself.
  *   **Other Domains:** Applies to non-moral demands too (e.g., why people prefer finite work projects over open-ended maintenance tasks, even if the latter is easier day-to-day).

  **Conclusion & Label:**

  There is no single, universally recognized term capturing *exactly* this combined focus on **social script alignment** and **psychological closure/terminability** as primary drivers of intuitive resistance to demands, independent of absolute cost. Your diagnosis is novel in its precise combination.

  **Proposed Term: "Terminability Heuristic"** (emphasizing the cognitive shortcut aspect) or **"Closure-Script Condition"** (emphasizing the two key features).

  *   **Definition:** The observed psychological tendency to accept significant sacrifices associated with demands that are culturally scripted and perceived as having a definite endpoint or state of completion, while exhibiting strong intuitive resistance to demands – even those involving lesser ongoing sacrifice – that lack either a clear social script or a perceived point of fulfillment.
  *   **Identifying New Cases:** Does the resistance seem disproportionate to the *magnitude* of sacrifice? Does the demand lack a widely recognized life-script *and* a clear endpoint? If yes, the Terminability Heuristic is likely operative. The Parenting case is the crucial test: intense sacrifice is accepted *because* it fits a dominant script, demonstrating that script can override the need for terminus.
  *   **Normative Stance:** The concept itself is descriptive. Using it normatively requires additional argument: either to **debunk** resistance (showing it stems from a psychologically potent but morally irrelevant heuristic) or to **clarify** the true source of objection (revealing anxiety about indefinite, unscripted obligations rather than the sacrifice itself).

  Your analysis provides a powerful lens for understanding a persistent pattern of moral psychology that standard ethical frameworks often overlook. It highlights the profound influence of narrative structure and temporal boundaries on our perception of obligation.
