  For the cumulative view, proponents might argue the secretion isn't a "tool" because it's not used intentionally. But this feels like moving the goalposts. Denying it as memory also seems weak since it stores spatial info. The rigidity of Dennett's hierarchy might not account for such exaptations.

  The two-axis model seems more flexible. It allows external resources without requiring internal models. The organism fits here: strong external memory with no evidence of internal modeling. This preserves Dennett's insights while accommodating edge cases.

