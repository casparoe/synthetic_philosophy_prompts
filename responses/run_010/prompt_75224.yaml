  Okay, the user is auditing an early modern philosophy course and is stuck on Berkeley's master argument. They're not interested in whether it succeeds but in the structure of the argument itself. They describe it as a move where any attempt to refute it ends up reinforcing the claim. They've noticed similar patterns in other contexts like amateur psychology, personality tests, Nagel's bat argument, and free will debates. They want to know if this structure has a name, how it differs from similar concepts, and whether there's a line between legitimate and illegitimate uses.

  First, I need to recall the key terms they mentioned: self-sealing arguments, no-true-Scotsman, begging the question, performative contradiction. Let me differentiate each. Self-sealing arguments are designed to absorb counterexamples, which seems closest. No-true-Scotsman is about ad hoc redefinition to avoid counterexamples. Begging the question is circular reasoning. Performative contradiction is when the act of asserting something contradicts the assertion, like saying "I don't exist" while existing.

  The user's examples: Berkeley's tree, psychological repression, defensiveness in questionnaires, Nagel's bat, and free will. The free will one is different because it's about the presuppositions of an action, not absorbing a counterexample. So that's a performative contradiction, not self-sealing. The others fit self-sealing because the counterargument is co-opted as evidence.

  Next, the legitimate vs. illegitimate use. Berkeley's argument is taken seriously as highlighting a limitation of human conception. Nagel's bat is legitimate for pointing out the subjective nature of experience. Illegitimate uses would be when the structure is used to avoid scrutiny, like in psychological defenses or questionnaires.

  I should confirm that "self-sealing" is the best term. Yes, because it describes an argument that's immune to refutation by design. The user needs clear distinctions between the terms and examples. Also, emphasize why free will is different—it's about presupposition, not absorption. Keep under 450 words, start with a yes/no, avoid padding. Make sure to define the structure clearly and provide boundary cases if coining a term isn't needed. Self-sealing seems established enough.
answer: |-
  **Bottom line:** Yes, the core structure you identify is most precisely called a **self-sealing argument**.

  **The Structure:** A self-sealing argument is designed such that any attempt to refute it (by producing a counterexample or denying the claim) is interpreted *within the framework of the argument itself* as evidence *for* the claim. The act of refutation gets absorbed and repurposed as confirmation. The proponent doesn't just deflect criticism; they weaponize it.

  **Comparison to Neighbours:**

  1.  **Self-Sealing Argument (Best Fit):** This *is* the structure you described. It defines reality or possibility such that dissent becomes proof (Berkeley's tree, repression claim, defensiveness scoring, Nagel's bat).
  2.  **No-True-Scotsman (Ad Hoc Re-definition):** Involves changing the criteria for belonging to a category *after* a counterexample is presented to exclude that counterexample. It's specific to definitions of group membership ("No *true* Scotsman would...") and doesn't inherently involve the counterargument *act* becoming evidence itself. Different mechanism.
  3.  **Begging the Question (Circularity):** Assumes the truth of the conclusion within the premises. It's a logical flaw *within* the argument's presentation, not a structure that actively converts external refutation into internal confirmation.
  4.  **Performative Contradiction/Self-Refutation:** Occurs when the *act* of sincerely asserting a proposition logically contradicts the proposition's content (e.g., "I do not exist," "Language is meaningless," or **your free will example**: arguing *for* determinism ostensibly requires assuming the freedom to choose to argue). The refutation attempt *contradicts* the claim, it doesn't get absorbed *as evidence for* it. This is why your free will case is distinct: it's about presupposition, not absorption.

  **Legitimate vs. Illegitimate Uses:**

  *   **Legitimate:** When the structure genuinely highlights a fundamental epistemic or conceptual limit *for the subject*. Berkeley uses it to argue we *cannot conceive* of mind-independent objects. Nagel uses it to argue we *cannot experience* bat subjectivity. The argument forces recognition of a boundary. The legitimacy hinges on whether the claimed limit is truly fundamental and inescapable.
  *   **Illegitimate:** When the structure is deployed as an *ad hoc* defense mechanism to immunize a claim from empirical or rational scrutiny, closing off inquiry. The repression claim and defensiveness scoring often function this way, dismissing dissent without genuine engagement. The line is whether the "sealing" reveals a deep truth or merely protects dogma from falsification.

  **Boundary Case (Not Self-Sealing):** Arguing "All swans are white" is falsified by finding a black swan. The counterexample isn't absorbed; it refutes. Attempting to refute doesn't become evidence *for* whiteness.
