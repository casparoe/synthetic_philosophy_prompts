  ### Nota editoris
  We set down what reaches us without vouching for it. At critical turns, we restore words the moment demands, knowing witnesses then disagreed by loyalty or frailty of memory. The gate’s opener remains as unresolved to us as to those who stood in the ashes. What vanishes fastest is motive; what endures is consequence.
