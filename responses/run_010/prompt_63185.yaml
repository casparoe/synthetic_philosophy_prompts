answer: |-
  Here is the requested handbook excerpt, adhering to all specified constraints:

  ---

  **Internal Procedures Manual: Standing Committee on Nosological Integrity (SCNI)**
  **Section 12.7: Scheduled Term Retirement and Obsolescence Management**

  **1. Purpose:** This procedure governs the scheduled review and mandatory retirement of diagnostic terms and criteria published in the *National Manual of Psychiatric Disorders (NMPD)*. Retirement occurs when a term’s continued use demonstrably compromises diagnostic reliability or validity due to factors arising *after* publication, irrespective of the term's original empirical basis. Retirement is not an indictment of initial validity but a recognition of altered operational conditions.

  **2. Scope:** Applies exclusively to diagnostic categories pertaining to human cognition, affect, or behavior where the subject population possesses linguistic capacity and potential awareness of the diagnostic label itself ("Responsive Categories"). It does *not* apply to terms describing purely physiological states, lesions, or non-sapient biological phenomena ("Non-Responsive Categories"). Examples:
      *   **Responsive:** Affective Spectrum Conditions, Behavioral Dysregulation Syndromes.
      *   **Non-Responsive:** Specific Neurodegenerative Markers, Fungal Encephalitic Sequelae (e.g., *Mycotic Corticolysis, Type III*).

  **3. Operational Hazard: Post-Publication Criterion Shift (PPCS):** Upon publication, terms within Responsive Categories enter the communicative environment of their subject population. Individuals may encounter the term, identify with it, or have it applied socially. This exposure can lead to:
      a.   Alteration in symptom presentation as individuals consciously or unconsciously align behavior with perceived criteria.
      b.   Shifts in self-reported prevalence due to changes in help-seeking behavior or identification.
      c.   Semantic drift in the term’s cultural meaning, decoupling it from operational criteria.
      d.   Alteration in the underlying prevalence or presentation of the phenomena the criteria were designed to track, independent of biological or environmental etiological changes.
  These effects constitute PPCS, a recognized and quantifiable operational hazard analogous to typographical errors requiring correction.

  **4. Estimated Useful Life (EUL):** Upon approval for inclusion in the NMPD, every term within a Responsive Category is assigned an EUL by the EUL Subcommittee. The EUL is calculated based on:
      a.   Estimated population penetration of the NMPD or derivative public materials.
      b.   Complexity and salience of the diagnostic criteria.
      c.   Historical data on PPCS timelines for analogous terms.
      d.   Projected media or academic discourse volume.
  The default EUL is 15 years. Terms may be assigned a shorter (minimum 7 years) or longer (maximum 25 years) EUL based on mitigating or exacerbating factors documented at the time of approval. The EUL is recorded in the Term Master Log (Form SC-12.7a).

  **5. Retirement Trigger:** A term enters Mandatory Review Phase 90 days prior to its EUL expiration date. Retirement is initiated unless compelling, newly emergent empirical evidence *specific to PPCS mitigation* justifies a one-time EUL extension (maximum 5 years), approved by ¾ majority vote of the full Committee. Absent such justification, retirement proceeds per Section 12.7.8.

  **6. Mitigation Measures (Historical Record):** The Committee has implemented the following procedures to delay or minimize PPCS, documented here for operational transparency:

  | Measure              | Implementation Period | Outcome                                                                 | Status        |
  | :------------------- | :-------------------- | :---------------------------------------------------------------------- | :------------ |
  | Alpha-Numeric Coding | 1987-2001             | Codes (e.g., AX-7b) published; public/media assigned colloquial names.  | Ineffective   |
  | Nomenclature Embargo | 1992-2005             | Terms withheld from public-facing docs; leaked via academic channels.   | Ineffective   |
  | Staff Lexical Ban    | 2005-2015             | Terms barred from informal use; ban unenforceable; fostered internal jargon. | Ineffective   |
  | Tiered Release       | 2010-Present          | Patient literature delayed 3 years; PPCS observed within delayed window. | Partially Ineff. |

  **Conclusion:** Published mitigation measures have proven ineffective in preventing PPCS due to inherent information permeability. Current policy focuses on scheduled retirement as the primary countermeasure.

  **7. Worked Example: Case Study - Provisional Affective Somnolence Syndrome (PASS)**

  *   **Original Criteria (Approved 2004):** Persistent (>6mo) daytime fatigue + anhedonia + ≥3 somatic complaints (unexplained) + normal polysomnography. EUL assigned: 12 years (Moderate Salience).
  *   **Pre-Publication Prevalence Estimate (2003):** 0.08% (based on primary care screening, strict criteria).
  *   **Post-Publication Prevalence (2010):** 0.85%. **Analysis:** Significant increase driven by:
      *   Media coverage framing PASS as "modern life fatigue."
      *   Patient advocacy groups disseminating symptom checklists.
      *   Clinical observation: By 2010, >90% of presenting patients matched *all* somatic complaint criteria precisely, often using manual terminology verbatim. Symptom clustering shifted demonstrably towards the published schema.
  *   **Action:** PASS retired per EUL schedule (2016). Criteria reformulated under broader *Idiopathic Neurovegetative Disorder*; new term omitted somatic complaint checklist specifics.

  **8. Procedure for Term Retirement:**
      1.   Upon EUL trigger (Section 12.7.5), the Secretariat assigns drafting responsibility for the Retirement Notice to one Committee member.
      2.   The assigned member completes **Form SC-12.7b: Mandatory Term Retirement Notice** (see below).
      3.   The draft Notice is circulated for comment (14 days). Comments must focus on procedural accuracy and clarity, not substantive debate on the term's validity.
      4.   The Notice is ratified by simple majority vote.
      5.   The ratified Notice is published in the next NMPD Supplement and disseminated to all licensed users via official channels.
      6.   The retired term is moved to the NMPD Historical Appendix. Active diagnostic use is prohibited after a 6-month grace period.

  **9. Committee Personnel Considerations:** Committee members are not exempt from belonging to populations covered by Responsive Categories. Exposure to draft criteria and internal discussion may constitute an accelerated form of PPCS. Vigilance regarding personal identification with provisional terms is required but falls under individual ethical practice guidelines, not this procedure. All procedural safeguards (EUL, Retirement) apply equally to terms potentially describing Committee members or associated personnel.

  **10. Recent Observation:** The term *Clinico-Anarchic Syndrome (CAS)* (provisional code: RD-44a, EUL 20 years), describing patterns of active resistance to diagnostic categorization, has shown preliminary evidence of accelerated PPCS. Self-identification forums utilizing the precise CAS criteria have emerged within 3 years of internal draft circulation. Prevalence estimates remain within projected bounds, but rate of increase warrants monitoring. Scheduled retirement (2041) remains the designated intervention.

  ---

  **FORM SC-12.7b: MANDATORY TERM RETIREMENT NOTICE**

  **Date:** ______ [Auto-Generated]
  **NMPD Edition/Supplement:** ______ [Auto-Generated]
  **Term Being Retired:** ______
