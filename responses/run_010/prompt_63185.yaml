  **Notice Text:**
  Pursuant to Section 12.7 of the SCNI Internal Procedures Manual, the Standing Committee on Nosological Integrity hereby announces the mandatory retirement of the diagnostic term **[TERM BEING RETIRED]** (**[CODE]**), effective six (6) months from the publication date of this Notice.

  This retirement is enacted solely on the basis of the term's Estimated Useful Life (EUL) expiration and the operational requirement for scheduled review to maintain nosological integrity. Retirement reflects standard procedure to mitigate Post-Publication Criterion Shift (PPCS) and is *not* a determination on the historical validity or clinical utility of the term during its active period.

  **[TERM BEING RETIRED]** was originally published in the NMPD on **[ORIGINAL PUBLICATION DATE]**. Its assigned EUL of **[EUL]** years expires on **[EUL EXPIRATION DATE]**. No extension was granted under Section 12.7.5.

  Diagnostic use of **[TERM BEING RETIRED]** (**[CODE]**) in clinical assessment, coding, or research must cease after **[RETIREMENT EFFECTIVE DATE: EUL Expiration Date + 6 months]**. Historical references should utilize the retired term and code. Cases previously diagnosed under **[TERM BEING RETIRED]** should be reassessed using current NMPD criteria.

  The retired term and its final active criteria will be archived in the NMPD Historical Appendix (Section H.7).

