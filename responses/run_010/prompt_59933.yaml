  Hmm, the user wants me to role-play as a philosopher of criminal law who has deeply considered legal moralism. They present a complex pattern from England and Wales over the last sixty years with four specific legal positions: decriminalization of homosexual acts, criminalization of consensual sadomasochism with injury, differential treatment of male versus female genital cutting, and possession offenses for extreme pornography.

  First, I need to reconstruct the implicit theory that makes all four cohere. The key tension is around consent - why it's valid for tattooing but not for BDSM causing "more than trivial injury." The branding case suggests "socially functional" bodily modifications get a pass regardless of actual harm, while sexual injury doesn't. For genital cutting, the male/female distinction points to an unspoken hierarchy of bodily integrity where cultural/religious practices for boys override consent concerns, but protectionist paternalism kicks in for girls. The image possession law is trickier - it seems detached from actual harm, resting on the idea that certain representations are intrinsically corrupting or violate dignity by their very existence.

  Now for separating layers. I suspect the consent exceptions in (2) are presupposed - the doctrine depends on this distinction between functional and sexual harm. The genital cutting dichotomy feels like it fits comfortably with underlying social values rather than being logically necessary. For (4), the image offense does seem philosophically underdetermined. My initial suspicion about administrative convenience might be right - since prosecuting private acts is hard, banning possession is pragmatic. But that clashes with the Hart/Devlin framing, which assumes moralism is about principle rather than enforcement practicality.

  Testing counterfactuals: Under Mill's harm principle, only (1) survives; (2)-(4) would collapse since no third-party harm. Devlin's view might accept all four as enforcing societal morality. Feinberg's offense principle struggles with (4) since private possession lacks unwilling observers - unless we stretch to "constructive possession" as public exposure risk, which feels forced.

  Is there any coherent theory that justifies the current setup? Maybe a hybrid: consent is valid unless (a) the act expresses dehumanization (explaining BDSM criminalization while allowing boxing), (b) involves irreversible harm to non-autonomous persons (explaining FGC but not MGC), and (c) images depicting non-consensual violence inherently degrade human dignity regardless of context. But the branding case and arbitrary exceptions undermine this.

  The load-bearing commitment seems to be the body's status as a sacralized object - not fully ownable, with boundaries set by perceived social functionality rather than individual consent or measurable harm. Change that, and the entire structure topples.
answer: |-
  The pattern reveals a deeply ingrained, quasi-sacramental view of the human body and its boundaries—a view that prioritizes *symbolic integrity* over autonomy or tangible harm. Consent isn't a master key; its validity depends on whether the act aligns with socially endorsed *purposes* for bodily alteration or risk. Here’s the implicit theory, layer by layer:  

  ### (a) The Implicit Theory  
  1. **Consent’s Limits**: Consent "runs out" when bodily acts cross from *functional* or *ritually sanctioned* alteration into *purposeless degradation*. Tattooing, surgery, and even branding (framed as "tattoo-adjacent") serve identity-formation, health, or cultural rites. Sadomasochism for sexual gratification, however, treats the body as a mere vessel for transgressive pleasure—eroding its symbolic dignity. "Trivial injury" is a red herring; the real line is whether the act *instrumentalizes* the body in a socially recognized way.  

  2. **Bodies as Culturally Contested Sites**: Male circumcision is lawful because it’s embedded in religious/cultural continuity—preserving communal identity outweighs the infant’s non-consent. Female genital cutting (FGC) is criminalized not due to harm severity alone (infant male circumcision causes harm), but because it symbolizes *patriarchal subjugation*. The state intervenes here as the guardian of gender-egalitarian norms, reframing FGC as inherently degrading regardless of consent. The body becomes a battleground for societal values.  

  3. **Images as Moral Contagion**: Criminalizing possession of extreme pornography rests on the idea that certain depictions *desacralize* the human form by simulating irreversible violation (e.g., life-threatening acts, genital injury). The "realistic portrayal" clause is key: it turns the image into a *virtual witness* to degradation. No victim is needed because the crime is *participating in the dehumanizing fantasy*—corrupting the viewer’s moral faculties and, by extension, society’s ethical fabric.  

  **Core Commitment**: The criminal law protects the *symbolic order of the body*. Acts/imagery that "dishonor" the body’s inviolability—by treating it as disposable, violable for pleasure, or subordinate to oppressive traditions—are criminalized, even without measurable harm or non-consent among participants. Autonomy bows to society’s stake in maintaining the body’s sacred boundaries.  

  ---

  ### (b) Separating the Layers  
  - **Presupposed**:  
    - *The hierarchy of bodily purposes*. The exceptions in (2) (surgery, boxing, etc.) aren’t arbitrary; they reflect deep-seated beliefs about "acceptable" reasons to modify/risk the body. This hierarchy is non-negotiable doctrine—without it, consent’s limits collapse.  
    - *The body as a vector for gender politics*. (3) presupposes that FGC is uniquely oppressive. Male circumcision escapes scrutiny because the state implicitly endorses its cultural framing.  

  - **Comfortably Fitting but Not Essential**:  
    - The harm principle’s ghost lingers in (1) and (4). (1) uses "no harm to others" rhetorically, while (4) invokes "potential harm" to viewers. But these are justifications draped over deeper moral commitments.  

  - **Philosophically Underdetermined (Your Suspicion is Half-Right)**:  
    - **(4) is underdetermined between moralism and administrative pragmatism**—but pragmatism *isn’t* the driver. If it were, possession laws would target *all* hard-to-prosecute acts (e.g., private drug use). Instead, it selectively bans imagery that *simulates desecration*. The "reasonable viewer" clause points to Devlin: society criminalizes what it finds *intolerably obscene* because toleration would erode shared morality. The "administrative convenience" angle is a red herring; it doesn’t explain why *these specific images* are banned.  
    - **What’s doing the real work**: Devlin’s moralism, reframed for the digital age. The state claims the right to patrol private fantasies because they threaten the communal ethic of bodily dignity. This *does* reframe Hart/Devlin: Hart’s "harm principle" never contemplated virtual harm, making Devlin’s "moral fabric" argument more resilient.  

  ---

  ### (c) Counterfactuals  
  **Assume each theory strictly applied**:  
  1. **Millian Harm Principle**:  
     - (1) Remains (no third-party harm).  
     - (2) Collapses: consensual S/M with no complaint/harm is lawful. Boxing might be banned (public harm risk).  
     - (3) Collapses: both MGC and FGC criminalized *or* permitted based on individual consent (but infants can’t consent, so both banned?). State neutrality forbids favoring one culture’s rites.  
     - (4) Collapses: no victim, no act, no crime. Possession alone isn’t harm.  

  2. **Devlin’s Moralism**:  
     - (1) *Might* revert: if societal condemnation is intense enough, homosexuality could be recriminalized.  
     - (2) Remains: S/M violates shared morality.  
     - (3) FGC banned; MGC likely *lawful* (if society accepts it as moral tradition).  
     - (4) Remains: obscene images corrode public morality.  

  3. **Feinberg’s Offense Principle**:  
     - (1) Remains (private acts offend no observers).  
     - (2) *Mostly* lawful: no unwilling observers in private. Boxing might be restricted to licensed venues to shield the public.  
     - (3) FGC banned *if* visible results cause offense (e.g., in public pools)—but not the act itself if done secretly abroad. MGC unchallenged.  
     - (4) **Mismatch resolved**: Private possession can’t offend unaware third parties. *But* Feinberg might stretch to criminalize *distribution* (risking involuntary exposure). Possession alone? No.  

  **Is there a coherent theory justifying the current system?**  
  Yes—a **neo-Devlinian "dignitarian" theory**:  
  - The state upholds the *inherent dignity of the human body* as a foundational social value.  
  - Consent is void when acts/images treat the body as an object for degradation (S/M, FGC, extreme porn).  
  - "Degradation" is defined by social consensus: thus, boxing (honorable combat) and MGC (sacred rite) are exempt.  
  - This explains all four:  
    - (1) Homosexuality decriminalized because it no longer symbolizes bodily "degradation" post-social acceptance.  
    - (2) S/M criminalized as gratuitous defilement.  
    - (3) FGC banned as gender-based mutilation; MGC permitted as cultural preservation.  
    - (4) Images criminalized as virtual desecration.  
  *But*: The arbitrary exemptions (branding = tattoo) reveal *inconsistency* in defining "dignity." It’s less a philosophically coherent position than *cultural intuition rationalized by courts*.  

  ---

  **The Load-Bearing Commitment**:  
  **The body as a sacralized object, whose integrity must be policed to preserve social order**. Change this, and everything unravels:  
  - Emphasize *autonomy*? (2) and (3) collapse.  
  - Focus on *tangible harm*? (3) and (4) vanish.  
  - Prioritize *cultural pluralism*? (3) becomes untenable.  

  This commitment isn’t articulated in case law because it’s too contentious—but it’s the engine under the hood. Without it, the pattern is indeed historical inconsistency dressed in moralistic garb.
