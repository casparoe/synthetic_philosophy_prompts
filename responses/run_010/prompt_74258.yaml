prompt: |-
  so, bit of background first. I work in public health — vaccine outreach, mostly cost-per-outcome spreadsheets all day — and about eighteen months ago I started sitting with a local dharma group, originally just for the meditation. These two halves of my head have started fighting. My teacher keeps saying things like "the karma is in the intention," which sounds like outcomes don't matter at all, but she's also the one who organizes the food drives and who pushed me to give away more of my salary, which sounds extremely outcome-focused. Then last month I tried to explain why I send money to bednet distribution rather than to the animal shelter down the road, and she said "you're counting beings," as if the counting were the problem. I left more confused than I arrived.

  Our group is doing a session on this in a few weeks and I volunteered to make the handout, which I now regret. What I want isn't an essay. I want a sorting device — a decision tree / "which position do you actually hold?" thing — that walks someone from their gut reactions about cases to a named spot in the argument over whether Buddhist ethics is a species of consequentialism, a virtue ethics, an agent-relative thing built on karma and rebirth, or none of those categories.

  What I need:

  - 8 to 10 questions, each one a concrete case with two or three answer options. No question may contain the words consequentialism, deontology, or virtue ethics — people should be sorted by what they say about the cases, not by what they call themselves.

  - Build the space first and then locate views in it. I definately want branch points on: whether an act can be wrong when it produces good results but springs from greed or ill will; whether a well-intended act that backfires through no fault of yours leaves any moral residue you ought to feel bad about; whether the agent's own future — this life or later ones — sits inside the calculation or beside it as a separate prudential matter; whether the thing being aimed at is the reduction of suffering, the absence of craving, or something that isn't a state of affairs at all; whether animals, hungry ghosts and hell beings count the same as humans when you're adding things up; and whether the precepts are exceptionless or are reliable guides a compassionate person can override. For that last one use the old story about the ship's captain who kills the would-be murderer on board to save the merchants and to spare the killer the hell his deed would have earned him — our group will half-remember it already and it's the one case that makes everyone shift in their seat.

  - At least seven leaves, each labeled by the claim that actually defines it, plus the standard name for the view if it has one. If you're not sure the name is right, write "unnamed" — and no invented citations or page numbers, I have no way to check them and a wrong one is worse than none.

  - Then the honest part: tell me which pairs of leaves your questions can't really separate. My guess is that the virtue-ethics-ish leaf and the intention-is-everything leaf come out identical on nearly every case, but you might be able to pry them apart and I'd want to know how. Also flag any combination of answers that's logically available but that nobody seems to defend, and say whether it's empty because it's incoherent, because it's unappealing, or just because no one has bothered.

  - Finish with a scoring key that maps answer patterns onto the leaves, and one sentence per leaf on its most awkward commitment, written for people who are new to this.

  Audience is about fifteen people, half of whom have never read philosophy and half of whom think they have, so it should fit on two printed pages. One of them is my teacher, so please don't make the "none of these categories" option look like the smart answer by default.
reasoning: |-
  Okay, this user works in public health with vaccine outreach and has been part of a dharma group for meditation. They're struggling to reconcile their practical, outcome-focused job with Buddhist teachings that emphasize intention over results. Their teacher's mixed messages—stressing intention but also organizing outcome-driven activities like food drives—have left them confused. They volunteered to create a handout for an upcoming session but now regret it because they need a practical tool, not an essay.  

  The core conflict is between consequentialist thinking (outcomes matter) and Buddhist ethics (intention matters). The user needs a sorting device—like a decision tree with concrete cases—to help their group navigate different ethical positions without using philosophical jargon. They want to map out views based on gut reactions to scenarios, then label them with their philosophical names if available.  

  Key requirements include:  
  - 8-10 scenario-based questions with answer options.  
  - Avoiding terms like consequentialism or deontology.  
  - Covering branch points like wrong acts with good results, well-intended acts that backfire, the role of the agent's future, the goal of ethics (suffering reduction vs. craving absence), moral weight of different beings, and exceptionless precepts.  
  - At least seven labeled "leaves" (defined positions), with honest notes on overlaps or undefended views.  
  - A scoring key and one-sentence awkward commitments per position.  
  - Fitting on two pages for a mixed audience (some philosophy beginners, some with exposure).  

  The user’s deeper needs:  
  1. **Clarity in tension**: They’re torn between their public health work (outcome-centric) and Buddhist practice (intention-centric). The tool must bridge this without dismissing either.  
  2. **Teacher dynamics**: Their teacher is in the group, so the handout must avoid implying "none of these" is superior. Neutrality is key.  
  3. **Practical utility**: They want a "sorting device," not theory—something actionable for group discussion.  
  4. **Philosophical rigor**: Despite no jargon, the mapping must accurately reflect debates in Buddhist ethics (e.g., is it virtue ethics? agent-relative?).  
  5. **Sensitive handling**: The "killing the murderer" case must be presented carefully—it’s provocative but central.  

  For structure:  
  - **Questions**: Need scenarios covering all branch points. E.g., "Is it wrong to steal medicine to save a life?" for intention vs. outcome.  
  - **Branch points**:  
    - Intention vs. outcome (good act from bad motive).  
    - Moral residue (failed good intentions).  
    - Agent’s future (included in ethics or separate?).  
    - Goal (suffering reduction, craving absence, or non-state like Nirvana?).  
    - Moral weight (animals vs. humans).  
    - Precept flexibility (exceptionless vs. context-dependent).  
  - **Positions**: Aim for 7+ leaves like "Intention-Primacy," "Consequentialist-Leaning," "Virtue-Ethics-Leaning," "Rebirth-Centric," etc.  
  - **Gaps**: Note if intention-focused and virtue-ethics views overlap on cases.  
  - **Scoring**: Simple key (e.g., "Mostly A’s = Intention-Primacy").  
  - **Awkward commitments**: One blunt sentence per position (e.g., for consequentialist-leaning: "A compassionate killer might be morally right").  

  Challenges:  
  - Avoiding jargon while capturing nuances.  
  - Ensuring scenarios don’t lead answers (e.g., making "counting beings" seem inherently bad).  
  - Balancing brevity (two pages) with coverage.  
  - The teacher’s presence—avoid implying their view is "wrong."  

  Approach:  
  1. Draft questions first, mirroring real dilemmas (e.g., bednets vs. animal shelters).  
  2. Map answers to positions logically.  
  3. Identify overlaps: e.g., intention-primacy and virtue-ethics both downplay outcomes but differ on whether virtues (like compassion) can override rules.  
  4. Flag undefended views: e.g., "Outcomes matter, but only for humans, not animals" might be coherent but unappealing in Buddhism.  
  5. Keep language accessible: "moral residue" instead of "agent-regret."
answer: |-
  Below is a two-page handout designed as a sorting tool. It uses concrete cases to map views in Buddhist ethics without jargon. The questions focus on your specified branch points, and the scoring key highlights tensions within each position. Overlaps and undefended views are noted honestly.  

  **Page 1: The Sorting Tool**  
  *Answer based on your gut reaction. No "right" answers—just what aligns with your intuition.*  

  1. **A starving child steals bread. The baker (who hates the child) "generously" lets them take it, hoping the child gets sick. The child is fed and unharmed.**  
     A) The act is wrong—the baker’s malice poisons it.  
     B) The act is fine—the child was fed.  
     C) The act is mixed—good outcome, but the baker’s mind is unskillful.  

  2. **You donate your life savings to build a school, but it collapses due to hidden faults in the land. No one is hurt, but the money is wasted.**  
     A) You should feel regret—you failed to reduce suffering.  
     B) No moral residue—your intention was pure.  
     C) Mixed—you acted rightly, but investigate how to do better next time.  

  3. **Meditating might help your future happiness, but you could volunteer at a hospice instead, helping others now.**  
     A) Helping others matters more—your future is secondary.  
     B) Your future matters equally—it’s part of the whole.  
     C) Your future is irrelevant to ethics—focus on intentions now.  

  4. **What’s the core aim of ethical action?**  
     A) Reduce suffering for all beings.  
     B) Cultivate wisdom and end craving.  
     C) Align with virtues like compassion, regardless of outcomes.  

  5. **You have $1,000. Give it to:**  
     A) A malaria bednet program (saves 1 human life statistically).  
     B) An animal sanctuary (spares 100 animals suffering).  
     C) Your local temple (supports spiritual practice).  

  6. **A captain kills one person planning to murder 10 others. This saves 10 lives and spares the killer from hell karma.**  
     A) Justified—outcomes prevented greater harm.  
     B) Wrong—killing violates the precept absolutely.  
     C) Compassionate but still karmically dangerous—only a Buddha could judge.  

  7. **Is craving *always* the root problem?**  
     A) Yes—even good deeds can chain you if attached.  
     B) No—suffering itself is the target; craving is one cause.  
     C) Partly—virtues like compassion can be uncraved.  

  8. **Does a hungry ghost’s suffering weigh the same as a human’s?**  
     A) Yes—all suffering counts equally.  
     B) No—humans have unique potential for liberation.  
     C) Suffering isn’t arithmetic—respond to what’s before you.  

  ---

  **Page 2: The Map**  
  *Scoring Key: Tally your answers. Find your closest match below. "Awkward commitment" = the hardest pill to swallow for that view.*  

  **How to score:**  
  - For Q1–8, assign A=1, B=2, C=3.  
  - Add scores for Q1+Q2+Q6: This cluster tests **intention vs. outcome** (low = outcome-focused, high = intention-focused).  
  - Add Q3+Q4+Q7: Tests **goal of ethics** (low = suffering reduction, mid = end craving, high = virtue cultivation).  
  - Add Q5+Q8: Tests **scope of moral weight** (low = equal beings, high = hierarchy).  
  - **Your primary leaf** is where most of your answers cluster. See overlaps below.  

  | Leaf Name (Claim)                            | Common Label             | Awkward Commitment                                  |  
  |---------------------------------------------|--------------------------|-----------------------------------------------------|  
  | **1. Intentions define karma; outcomes are irrelevant.** | Intention-Primacy        | "A well-meant act causing genocide is blameless."   |  
  | **2. Reduce net suffering, all beings equal.**           | Consequentialist-Leaning | "Killing one to save ten may be a moral duty."      |  
  | **3. Reduce net suffering, but prioritize human/rebirth potential.** | Suffering-Hierarchist    | "A dying child matters less than a meditating adult."|  
  | **4. End craving; your future liberation is central.**   | Rebirth-Centric          | "Feeding the hungry is less vital than your meditation." |  
  | **5. Cultivate virtues like compassion; rules are guides.** | Virtue-Ethics-Leaning    | "Breaking precepts compassionately is more virtuous than keeping them rigidly." |  
  | **6. Precepts are absolute; karma is personal.**         | Precept-Absolutist       | "Letting ten die to avoid killing one is required." |  
  | **7. No ‘calculation’; ethics is non-conceptual responsiveness.** | Unnamed (Chan/Zen-like)  | "Helping one person before you outweighs saving a thousand elsewhere." |  

  **Overlaps & Gaps:**  
  - **Virtue-Ethics-Leaning (5) vs. Intention-Primacy (1):** They *overlap* on Q1, Q2, Q6 (both often choose C). **Pry apart with Q4/Q7:** Virtue ethics (C) sees compassion as inherently good beyond intention; intention-primacy (A/B) cares only about mental state.  
  - **Unappealing but coherent gap:** "Outcomes matter, but *only* for humans" (Q5=B, Q8=B). Logically possible but rarely defended—implies animals’ suffering is irrelevant.  
  - **Incoherent gap:** "Intentions matter, but you must feel guilt for accidental harm" (Q2=A + Q1=B/C). Contradicts karma-as-intention.  
  - **Empty but plausible:** "End craving, but your future doesn’t matter" (Q3=B/C + Q4=B). Coherent but rare—why end craving if not for liberation?  

  **Design Notes for Your Context:**  
  - **Teacher-friendly:** "None of these categories" isn’t a default—it’s embedded in Leaf 7 ("non-conceptual responsiveness"). This mirrors your teacher’s "counting beings" critique.  
  - **The killer-ship case (Q6)** forces tension: Consequentialists (A) vs. absolutists (B) vs. virtue-focused (C).  
  - **Accessibility:** Cases mirror real dilemmas (e.g., bednets vs. animals in Q5). No terms like "consequentialism"—views emerge from choices.  
  - **Philosophical accuracy:** Positions reflect actual debates (e.g., Precept-Absolutist = Theravada orthodoxy; Virtue-Ethics-Leaning = Mahayana "skillful means").  
  - **Printing:** Fits two pages if single-spaced with narrow margins.  

  ---  
  **Why this works for your group:** It starts with their gut reactions (e.g., your bednets example is Q5) and builds the landscape from there. The "awkward commitments" prevent any view from seeming comfortable—including your teacher’s likely non-arithmetic stance. By focusing on cases, it avoids preaching and lets the tension between intention and outcome breathe.
