prompt: |-
  I am a third-year undergraduate double-majoring in philosophy and neuroscience, and I also serve as the student member of my university's Animal Welfare and Ethics Review Committee. This term I am taking a course on the metaphysics of mind whose middle unit is functionalism and multiple realizability, and the two halves of my life have started colliding in an unhelpful way. Our committee reviews roughly a dozen research protocols a term and allows about thirty-five minutes each; the members are a veterinarian, two faculty (a behavioural ecologist and a systems neuroscientist), a senior animal technician, a lay member from the local community, and me. Nobody else on it has read any philosophy of mind, and nobody wants to. Our remit mirrors the national one it is modelled on: vertebrates and cephalopods fall inside scope by default, and for everything else we are supposed to decide protocol by protocol whether the animals in question are owed the same harm-benefit justification. Three groups at this university work with insects, crustaceans, and nematodes, and at the moment we have no coherent way of deciding anything.

  The standard criteria that circulate in welfare science look to me like a functional-role analysis in all but name: learned avoidance that persists and generalises, motivational trade-off in which the animal pays a cost in some valued resource to escape or avoid a noxious one, self-administration of an analgesic at a dose the animal does not take when uninjured, protective and maintenance behaviour directed at the affected part, and responsiveness graded across a range of stimulus intensities rather than a fixed reflex. I think the committee has been right to lean on criteria of that shape, precisely because of multiple realizability: insisting on mammalian hardware (an opioid system, a layered cortex, C-fibres) is chauvinism, and it would rule out animals whose organisation is genuinely different but whose functional profile is not obviously thinner. But my course has sharpened two worries that our current form cannot express. The first is the liberal worry in its strong form: taken one at a time, each of these criteria can be satisfied by systems nobody would credit with an inner life at all, since a homeostatic controller trades off resources against damage and a protective routine can be written in twenty lines. So the list looks like a disjunction of separately realisable tricks, and I cannot see what entitles us to assume the disjunction picks out one phenomenon rather than a gerrymandered catalogue of superficially similar behaviours. The second worry runs in the opposite direction, and it is the one that has me most troubled: our form asks only whether the animal exhibits the relevant behaviour, which collapses a functional state that is presently doing its causal work with a standing capacity to do so that is temporarily blocked from expressing itself. Those come apart in exactly the cases where our scrutiny matters most.

  So please write the procedure our committee could actually run on a submitted protocol within the time we have, in language a technician and a lay member can follow without any theory behind it. I want the questions in the order we should ask them; a statement of what counts as a sufficient answer to each and what merely looks like one; the point at which the procedure terminates in a finding of 'not established' and what the default is at that point; and an explicit marking of which steps are value judgments wearing the clothing of fact-finding, including how much weight uncertainty should carry and which findings require the veterinarian's signature rather than a majority vote. Tell me which of the distinctions above must survive the simplification and which can be dropped for practical purposes, and be candid about where the procedure will misfire. Then run it on three live protocols. The first uses shore crabs that learn to abandon a preferred dark shelter after receiving small shocks inside it, with a control group shocked in a neutral area, and the applicant argues that the persistent, shelter-specific avoidance shows more than reflex. The second trains honeybees to discriminate two odours, one paired with sucrose and one not, agitates a subgroup, and tests all animals on intermediate blends; the applicant claims the shifted responses to ambiguity indicate a negative affective state, and one committee member objects that the whole design is an anthropomorphic reading of a foraging heuristic. The third is the one where I expect your procedure to hand me an answer I will not like: an applicant has noticed that every behavioural criterion is by design unmeasurable during anaesthesia and neuromuscular blockade, and proposes that our procedure therefore finds nothing established intraoperatively and imposes no additional burden, with the perverse result that scrutiny is lightest precisely where the invasive work is done. Say whether a properly constructed functionalist procedure really must concede that, or whether it can be written to distinguish an animal whose relevant state is currently causing behaviour from one whose disposition to behave is merely suppressed; and if it can, tell me what evidence a committee is supposed to examine when there is, by construction, no behaviour to examine.

  Finally, close with a short statement of what the procedure cannot do. I want it to say plainly that establishing the functional role is not the same as establishing that anything is experienced, and I want the strongest version of the objection from someone who holds that the two can come apart: on that view our entire exercise is beside the point, since we would be licensing harm on the basis of evidence that is in principle silent about the only thing that matters. I do not want that objection waved away with a reminder that it is unverifiable; I want to know whether the committee should be told about it before it votes, and in what words. Keep the whole thing to something I could table at Thursday's meeting without anyone needing to read it twice.
reasoning: |-
  Hmm, this is a fascinating and complex request from a student straddling philosophy and neuroscience in practical ethics. The user is grappling with how to apply functionalist concepts to real-world animal welfare decisions without oversimplifying philosophical nuances. I need to design a practical decision procedure that resolves their committee's dilemma while respecting their constraints.

  The core tension here is between philosophical rigor and bureaucratic feasibility. The user identifies two key problems in their current approach: first, that individual behavioral criteria could be met by non-sentient systems (the "liberal worry"), and second, that current forms can't distinguish between suppressed capacities and absent capacities during procedures like anesthesia (the "suppression problem"). 

  For the procedure itself, I'll structure it as a decision tree that prioritizes dispositive questions early. We start with basic biological facts (neuron presence) to screen out obvious non-cases, then move to behavioral evidence organized into three tiers: reflexive responses, motivational complexity, and learning/generalization. Crucially, I'll include an explicit "suppression test" requiring evidence of baseline function before and after invasive procedures - this addresses the anesthesia loophole by demanding historical evidence of capacity.

  The three test cases reveal important nuances: 
  - The crab experiment likely passes through motivational trade-off evidence (abandoning preferred shelter despite cost)
  - The bee study fails because affective interpretation is ambiguous versus simpler heuristic explanations
  - The anesthesia case is blocked by the suppression test requirement for pre/post evidence

  Philosophically, I must acknowledge but not resolve the hard problem of consciousness. The disclaimer will explicitly state that functional criteria correlate with but don't prove sentience, and that this gap represents a fundamental limitation. I'll phrase this as a necessary but not sufficient condition for welfare consideration.

  Practically, I'm sacrificing some distinctions:
  - Dropping strict multiple realizability discussions for binary "present/absent" judgments
  - Accepting that some simple systems might be over-included
  - Using "dispositional evidence" as proxy for current state during suppression

  The veterinarian becomes crucial for interpreting physiological stress markers when behavior is unavailable. I'll make uncertainty thresholds explicit - requiring evidence to be "clear and consistent" rather than perfect.

  For implementation, I'll keep the language accessible but precise, avoiding philosophical jargon while preserving the logical structure. The whole thing should fit on one page for committee use.
answer: |-
  Below is a practical decision procedure for your committee, designed to address functionalist criteria while respecting time constraints and accessibility. It prioritizes evidence-based judgments and flags key uncertainties. The procedure terminates early if critical hurdles are not met.

  ---

  **Procedure: Sentience Assessment for Non-Protected Species**  
  *For protocols involving animals outside default protected categories (e.g., insects, crustaceans, nematodes)*  

  ### Step 1: **Baseline Requirement** (1 min)  
  **Question:** *Does the animal have a nervous system capable of integrating information?*  
  - **Sufficient:** Neuronal clusters with synaptic communication (e.g., insect ganglia, crustacean CNS).  
  - **Looks Like (But Isn’t):** Diffuse nerve nets (e.g., jellyfish) or purely reflexive systems.  
  - **Termination:** If "no," review ends. Animal not owed harm-benefit analysis. Default: *No additional protections*.  
  - **Value Judgment?** Minimal. Biological fact-finding.  

  ### Step 2: **Behavioral Complexity** (15 min)  
  **Question:** *Does the animal show **at least two** of the following in non-invasive contexts?*  
     - **Motivational Trade-off:** Sacrifices a resource (e.g., food, shelter) to avoid harm.  
       - *Example:* Crab abandons preferred dark shelter after shock.  
     - **Learned Generalization:** Avoidance/attraction persists and applies to new, similar situations.  
     - **Graded Responsiveness:** Behavior scales with stimulus intensity (not all-or-nothing reflex).  
     - **Self-Protection:** Specific actions to shield injured body parts.  
  - **Sufficient:** Clear, replicable evidence from literature or pilot data.  
  - **Looks Like (But Isn’t):** Isolated reflexes or fixed action patterns (e.g., nematode thrashing).  
  - **Termination:** If fewer than two criteria met, review ends. Default: *No additional protections*.  
  - **Value Judgment?** Low. Empirical assessment. Requires majority vote.  

  ### Step 3: **Anesthesia/Suppression Test** (10 min)  
  **Question:** *If the protocol involves suppression (e.g., anesthesia), is there evidence the animal **normally exhibits** Step 2 behaviors when unsuppressed?*  
  - **Sufficient:** Pre-existing data showing capacity (e.g., crabs trade off shelter when awake).  
  - **Looks Like (But Isn’t):** Assuming capacity without evidence.  
  - **Termination:** If suppressed *and no prior evidence*, committee must assume the animal **retains sentience capacity** during suppression. Default: *Harm-benefit analysis required*.  
  - **Value Judgment?** Moderate. Inference from dispositional states. Veterinarian must sign off.  

  ### Step 4: **Anthropomorphism Check** (5 min)  
  **Question:** *Could the behavior be explained by a simpler heuristic (e.g., energy efficiency) without invoking affective states?*  
  - **Sufficient:** Controls rule out alternatives (e.g., agitation in bees shifts responses beyond foraging efficiency).  
  - **Looks Like (But Isn’t):** Interpreting all stress responses as "suffering."  
  - **Termination:** If simpler explanation is *equally plausible*, reject sentience claim. Default: *No protections*.  
  - **Value Judgment?** High. Requires systems neuroscientist’s input.  

  ### Step 5: **Decision** (5 min)  
  - If Steps 1–4 support sentience capacity: **Full harm-benefit analysis required**.  
  - If any step terminates early: **No additional protections beyond basic ethics (e.g., minimization of tissue damage)**.  
  - **Veterinarian’s Role:** Signs off on physiological stress indicators (e.g., stress hormones in crustaceans).  

  ---

  ### Application to Cases  
  1. **Shore Crabs**  
     - Step 1: Pass (CNS present).  
     - Step 2: Pass (Trade-off *and* learned generalization).  
     - Outcome: Harm-benefit analysis required.  

  2. **Honeybees**  
     - Step 1: Pass (ganglionic nervous system).  
     - Step 2: Pass (graded responses? Unclear—requires data).  
     - Step 4: **Fails**. Shifted responses could reflect recalibrated foraging, not affective state. Simpler explanation stands.  
     - Outcome: No additional protections.  

  3. **Anesthetized Animals**  
     - Step 1: Pass (e.g., crab with CNS).  
     - Step 3: **Fails if no prior evidence**. Procedure requires assuming sentience capacity persists.  
     - Outcome: Harm-benefit analysis required intraoperatively.  
     - **Evidence During Suppression**: Committee examines physiological markers (e.g., stress hormones, neural activity in pain pathways) *if available*. If absent, presumption favors protection.  

  ---

  ### What This Procedure Cannot Do  
  **Explicit Disclaimer for Committee:**  
  > *"This procedure assesses whether an animal exhibits functional markers correlated with sentience in humans and mammals. It does not—and cannot—prove the animal experiences pain or emotions. A system could theoretically pass all tests without subjective experience (e.g., an advanced robot). Conversely, failure here doesn’t prove absence of sentience; it means we lack evidence to trigger protections. Our work is ethically necessary but philosophically incomplete: we act on the best available science, knowing we might overlook true suffering or overprotect simple systems. Vote on the evidence, but acknowledge this gap."*  

  **Should the committee hear this?**  
  - **Yes.** Include the disclaimer verbatim in the procedure document. Read it aloud before contentious votes.  
  - **Why:** Transparency forces reckoning with the limits of functionalism. Silence implies certainty where none exists.  

  ---

  ### Practical Trade-offs  
  - **Survived:** Distinction between present behavior vs. suppressed capacity (Step 3).  
  - **Dropped:** "Gerrymandering" worry. In practice, requiring *two* criteria reduces false positives.  
  - **Misfires:**  
    - May overprotect simple systems (e.g., insects with coincidental behaviors).  
    - May underprotect animals with novel sentience mechanisms (e.g., if criteria are too mammalian-centric).  

  This fits on one page and uses plain language. Tabling it Thursday is feasible.
