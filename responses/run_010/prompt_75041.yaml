answer: |-
  To translate Gongsun Long's white horse argument into type-theoretic terms, I'll use refinement types with subtyping. This captures the core ideas while exposing where philosophical assumptions diverge from technical reality. Here's the formalization:

  ### Chosen Formalism: Refinement Types with Subtyping
  - **Base type**: `Horse : Type`  
    (Represents the concept "horse" via shape/properties, ignoring color).
  - **Refinement**: `WhiteHorse = { x: Horse | color(x) == White }`  
    (A subtype of `Horse` where the color is fixed to white).
  - **Subtyping**: `WhiteHorse <: Horse` (WhiteHorse is a subtype of Horse).
  - **Color property**: `color : Horse → Color` (e.g., `White`, `Yellow`, `Black`).

  ### Step-by-Step Walkthrough of the Argument
  1. **"Horse picks out shape, white picks out color"**  
     - Formalized: `Horse` is a type; `White` is a value in the `Color` domain.  
     - **Status**: Plain fact. `Horse` and `Color` are distinct domains.

  2. **"White horse is not horse"**  
     - Formalized: `WhiteHorse ≢ Horse` (types are distinct).  
     - **Status**: Plain fact. Refinements create new types.  
     - *But*: `WhiteHorse <: Horse` (subtyping holds).  
     - **Equivocation**: Gongsun Long confuses *type identity* (`≡`) with *subtyping* (`<:`). He denies subtyping, but refinement types enforce it.

  3. **"If you ask for a horse, yellow/black works; for white horse, they don't"**  
     - Function: `needsHorse : Horse → Unit`  
       Accepts `x : YellowHorse` or `x : BlackHorse` (via subtyping).  
     - Function: `needsWhiteHorse : WhiteHorse → Unit`  
       Rejects non-white horses.  
     - **Status**: Plain fact of subtyping. Contravariance isn't needed here.

  4. **"Horse allows any color; white horse filters color"**  
     - Formalized:  
       `∀x: Horse. ∃c: Color. color(x) = c` (any color allowed)  
       `∀x: WhiteHorse. color(x) = White` (color filtered)  
     - **Status**: Plain fact. Captured by the refinement predicate.

  5. **"Whiteness is pinned down in the compound"**  
     - Claim: In `WhiteHorse`, "white" is bound; alone it's abstract.  
     - Formalized: `White` (as a value) is free-floating; in `{x:Horse | color(x)=White}`, it's constrained.  
     - **Status**: Bends notation. Refinement types fix values in predicates, but don't model "abstract vs. bound" semantics for terms. Requires metallinguistic comment.

  ### Residue Report: What Doesn't Fit
  1. **"White horse isn't horse" (subtyping denial)**  
     - **Problem**: Gongsun Long rejects `WhiteHorse <: Horse`, but refinement types mandate it.  
     - **Resolution**: Not a limitation of types; it's an *equivocation*. He conflates:  
       - **Extensional "is"**: Set inclusion → `WhiteHorse` ⊆ `Horse` → subtyping holds.  
       - **Intensional "is"**: Conceptual identity → `WhiteHorse ≢ Horse` → correct but irrelevant to set membership.  
     - **Verdict**: His argument requires denying set inclusion, which is mathematically incoherent.

  2. **Names ≠ Types**  
     - His core goal: Settle how *names* refer (e.g., "Does 'white horse' name Horse?").  
     - Type systems: Define *term relationships*, not naming conventions.  
     - **Residue**: Philosophy of language (reference, intensionality) isn't captured.  
     - **Example**: Type theory can't enforce "horse must ignore color" – that's a naming convention, not a typing rule.

  3. **Color "fixing" metaphysics**  
     - Claim: "White" in "white horse" is ontologically distinct from freestanding "white".  
     - **Formalism gap**: Types model `White` as a value, not an entity that "changes state".  
     - **Verdict**: His distinction is either:  
       - Trivial (bound variable vs. free variable) – captured in logic.  
       - Metaphysical (universals vs. particulars) – outside type theory.

  ### Where I Secretly Defined "Is"
  I implicitly translated "is" in two ways:
  1. **Predicative "is"** (e.g., "X is white") → `color(X) = White`  
     (Property assignment; unproblematic).
  2. **Identity "is"** (e.g., "White horse is horse") → `WhiteHorse <: Horse`  
     (Subtyping; contradicts Gongsun Long's usage).

  His argument exploits the ambiguity between these. Type theory resolves it by distinguishing `≡` (type identity) and `<:` (subtyping).

  ### Conclusion
  - **What types capture**:  
    Subtyping, refinements, and substitutability perfectly model his functional observations (e.g., filtering color).  
  - **Where he errs**:  
    Denying that white horses are horses requires conflating type identity with set membership. Refinement types prove this incoherent.  
  - **Residual philosophy**:  
    His "pinned down color" and naming theories are either  
    (a) trivial (bound variables),  
    (b) metaphysical (not expressible in types), or  
    (c) based on equivocation (extensional vs. intensional "is").  

  **Final verdict**: The argument fails due to equivocation on "is", not due to limitations of type theory. Refinement types expose this by forcing clarity on predication vs. subtyping.
