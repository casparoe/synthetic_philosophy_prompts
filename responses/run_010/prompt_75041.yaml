     We can say: `WhiteHorse` is a proper subtype of `Horse`. Therefore, `WhiteHorse` is not the same type as `Horse`. This is a plain fact: they are distinct types.

  3. **The argument about substitutability:**
     - If you ask for a horse, you can accept any horse (yellow, black, etc.). But if you ask for a white horse, you cannot accept a non-white horse.

