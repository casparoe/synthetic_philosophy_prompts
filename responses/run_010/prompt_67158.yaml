prompt: |-
  ok so I'm putting together a 3-month project proposal for a small alignment residency — they want about two pages, and I have the shape of an idea but not the spine of it. Hoping you can build the spine.

  The idea: basically everyone doing mechanistic anomaly detection (probing internals, sparse autoencoder features, activation patching to find something like a backdoor or a latent planning capability) validates their detector by showing it fires on a known-bad model and stays quiet on the clean one. But nobody seems to say what it would take for that detector to be detecting *the same mechanism* in a different model — different seed, different scale, different data mix. So there's a dilemma I keep circling, and I want the proposal built around it rather than around the detection task:

  either the identity conditions are fine-grained — the mechanism is these components, in this arrangement, doing this — in which case there's no reason to expect transfer across runs at all, and a detector that works on the one adversarially-trained model we happened to be able to build tells us nothing about the model that actually gets deployed;

  or they're coarse — the mechanism is whatever realizes the function, i.e. whatever set of internal states you could intervene on to produce this behavioral signature — in which case the detector is keyed to something a careful behavioral monitor might already pick up, and I'm not sure the mechanistic route is buying us anything.

  I want the proposal to take that dilemma seriously rather then talk around it. Concretely: state the question so it has a determinate answer (something like: is there an intermediate grain at which mechanism identity is both stable across training runs and genuinely finer than behavior, and if so what's the test for it?), say why the obvious moves don't settle it — my sense is the causal abstraction framing gets you partway but presupposes the correspondence between the variables instead of deriving it, and multiple realizability arguments out of philosophy of mind give you the dilemma without any of the engineering — and then give the method. Month by month: which models, what interventions, what would count as a successful transfer, and what negative result would still be worth the three months. Be explicit about what would falsify the intermediate-grain hypothesis rather than just fail to support it.

  Also be honest about where the scope blows up. I suspect I can't do the cross-scale version on my compute budget and should say so instead of promising it and quietly dropping it in month three.

  Skip citations entirely, I'll add whatever I need afterwards, and don't give me bibliography-shaped hedging — I'd rather have a sharp claim that could turn out to be wrong.
reasoning: |-
  We are building a 3-month project proposal for an alignment residency. The core idea revolves around a dilemma in mechanistic anomaly detection (MAD) regarding the transferability of detectors across models. The dilemma is:

  Option A (Fine-grained identity conditions): The mechanism is specific to the exact model (components, arrangement, etc.). Then, a detector built for one model doesn't transfer to others (different seed, scale, data), so it's not useful for deployment.

  Option B (Coarse-grained identity conditions): The mechanism is defined by the function (behavioral signature). Then, the detector is not much better than a behavioral monitor, and the mechanistic approach doesn't add value.

  We want to investigate if there's an intermediate grain where mechanism identity is both stable across training runs and genuinely finer than behavior.

  The project should:
  1. State the question with a determinate answer: 
     "Is there an intermediate grain of mechanism identity that is (a) stable across independent training runs and (b) provides a finer-grained signal than behavioral monitoring? If so, what test can validate such an intermediate grain?"

  2. Explain why obvious moves (causal abstraction and multiple realizability) don't settle it.

  3. Method: 
     - Models: Use small transformers (e.g., 2-layer) trained on a synthetic task that has a clear "bad" mechanism (e.g., a backdoor or a latent capability). We'll train multiple seeds and maybe one size up (if compute allows) but avoid cross-scale due to budget.
     - Interventions: We'll build MAD tools (probing, SAEs, activation patching) on one model to detect the mechanism. Then, we'll apply the same detector to other models (same architecture, same task, different seeds) and see if it fires on the same mechanism. We'll also try to see if we can find a correspondence of mechanisms (e.g., via feature similarity) and then see if the detector built for model A works on the same mechanism in model B when aligned via that correspondence.
     - What counts as successful transfer? 
          - Positive: The detector (trained on model A) fires on the same mechanism in model B (as identified by activation patching or similar) without firing on clean examples, and does so at a significantly higher rate than a behavioral monitor (i.e., it catches the mechanism when the behavior is not yet evident, or with fewer false positives/negatives). 
          - Also, we should require that the transferred detector is not just picking up on the behavioral signature (so we design tests where behavior is the same but the mechanism is different, and the detector should fire only when the mechanism is present).
     - Negative result that's still worth it: If we show that even in small models, the mechanism is either too fine-grained (doesn't transfer across seeds) or too coarse (indistinguishable from behavior), that's valuable. Also, if we find that the intermediate grain exists only when we align the models via a specific method (like feature similarity) and that method is not robust, that's a step.

  4. Falsification: The intermediate-grain hypothesis is falsified if:
     - (a) We cannot find any detector that transfers across seeds without also firing on behaviorally equivalent but mechanistically different examples (i.e., the detector is either not transferable or not finer than behavior).
     - (b) We cannot find a stable correspondence of mechanisms across seeds (via any alignment method) that allows for transfer.

  5. Scope: We will not do cross-scale due to compute. We'll stick to multiple seeds and maybe one size up (if we can). We are explicit about this.

  Now, structure the proposal:

  - Title: something catchy but clear.
  - Problem Statement: Present the dilemma and the question.
  - Why it's not settled: Critique of causal abstraction (presupposes correspondence) and multiple realizability (dichotomy without engineering).
  - Method: Detailed month-by-month.
  - Success Criteria: What would constitute a positive, negative, or falsifying result.
  - Scope and Limitations.

  Let's write the two-page proposal.

  ---

  **Title:** The Grain of Mechanisms: Testing Transferability of Mechanistic Anomaly Detectors

  **Introduction: The Dilemma of Mechanistic Anomaly Detection**
  Mechanistic anomaly detection (MAD) aims to find and flag specific internal mechanisms (e.g., backdoors, deceptive planning) in neural networks. Current validation for MAD tools typically shows that a detector fires on a "known-bad" model and not on a "clean" one. However, this leaves open a critical question: *What does it take for the same detector to detect the same mechanism in a different model?* 

  We identify a dilemma:
  1. **Fine-grained identity**: If the mechanism is defined by the exact components (neurons, weights, etc.), then detectors will not transfer across models (different seeds, scales, or data). Thus, a detector built for one model tells us nothing about deployed models.
  2. **Coarse-grained identity**: If the mechanism is defined by its behavioral signature (i.e., the function it computes), then MAD provides no advantage over behavioral monitoring.

  This project asks: **Is there an intermediate grain of mechanism identity that is both (a) stable across independent training runs and (b) genuinely finer-grained than behavior?** If so, what test can validate such an intermediate grain?

  **Why Existing Frameworks Don't Settle This**
  - **Causal abstraction** (e.g., using structural causal models) requires pre-specifying the correspondence between model variables and high-level concepts, but we need to *derive* this correspondence from scratch.
  - **Multiple realizability** (from philosophy of mind) highlights the fine-vs-coarse dilemma but does not provide an empirical test for an intermediate grain in real systems.

  **Method: A Three-Month Empirical Investigation**
  We will use small transformer models (2-layer, ~10M parameters) trained on a synthetic task designed to elicit a clear "bad" mechanism (e.g., a backdoor triggered by a specific input pattern). We will:
  - Train multiple models (5-10 seeds) with identical architectures and training data.
  - Introduce the "bad" mechanism via adversarial training or by data poisoning in half the models, keeping the other half clean.

  *Month 1: Build and validate MAD tools on a reference model.*
  - Choose one "bad" model as reference.
  - Use standard MAD techniques (sparse autoencoders, activation patching, probes) to build a detector for the bad mechanism.
  - Validate internally: Detector fires on bad examples, not on clean ones.

  *Month 2: Test transfer across seeds.*
  - Apply the detector (without retraining) to other models (same architecture, same task, different seeds) that have the bad mechanism.
  - Measure:
    - **Transfer accuracy**: Does the detector fire on the same mechanism in other models?
    - **Finer-than-behavior**: Does the detector flag the mechanism *before* it affects behavior (e.g., in intermediate layers) or in cases where behavior is identical but the mechanism is absent? (We will design adversarial examples where behavior is the same but the mechanism isn't triggered, and vice versa.)

  *Month 3: Test alignment methods and scalability (if time).*
  - If transfer fails, try to align mechanisms across models using feature similarity methods (e.g., CCA, mean ablation similarity). Then reapply the detector.
  - Test if the aligned detector now transfers.
  - If compute allows, repeat with a slightly larger model (e.g., 4-layer) to see if grain stability changes with scale. (But note: cross-scale experiments are explicitly out of scope if budget doesn't allow. We will state this.)

  **What Success Looks Like**
  - **Positive**: We find a detector that transfers across seeds (e.g., >80% accuracy in identifying the mechanism in new models) and is finer than behavior (e.g., beats a behavioral baseline by >20% in precision/recall on adversarial tests).
  - **Negative but valuable**: We show that transfer fails even with alignment methods, suggesting that mechanisms are either too fine-grained or too coarse. This would falsify the intermediate-grain hypothesis for our setup.
  - **Falsification criteria**: The intermediate-grain hypothesis is falsified if either:
    - (a) No detector transfers across seeds without also firing on behaviorally equivalent examples (i.e., it's not finer than behavior), or
    - (b) We cannot find a stable alignment of mechanisms across seeds that enables transfer.

  **Scope and Limitations**
  - We focus on multiple seeds and one architecture. We do not test cross-scale (unless compute permits a small step-up) or cross-data due to budget.
  - The synthetic task may not capture the complexity of real-world mechanisms, but it provides a controlled testbed.
  - A negative result here (no intermediate grain) would push the field toward either fine-grained per-model detectors (with limited deployability) or coarser behavioral approaches.

  **Conclusion**
  This project tackles a foundational question for mechanistic anomaly detection: Can we detect the same mechanism across different models? By empirically testing the transferability of MAD tools, we aim to reveal whether an intermediate grain of mechanism identity exists — or if the field must confront the dilemma head-on.
answer: |-
  ### Project Proposal: The Granularity Problem in Mechanistic Anomaly Detection  
  **Duration:** 3 months  
  **Core Question:** *Is there an intermediate grain of mechanism identity that is both (1) stable across independent training runs and (2) genuinely finer-grained than behavioral signatures?*  

  #### **The Dilemma**  
  Mechanistic anomaly detection (MAD) tools (e.g., sparse autoencoders, activation patching) are validated by firing on "known-bad" models (e.g., backdoored networks) and staying silent on "clean" ones. Yet, **transferring detectors** to new models (different seeds, data, or scales) faces a fundamental dilemma:  
  - **Fine-grained identity** ("this circuit in this model"):  
    - Mechanisms are hyper-specified to architectural quirks.  
    - *Problem:* Detectors fail to transfer; no deployable guarantees.  
  - **Coarse-grained identity** ("any implementation of this function"):  
    - Mechanisms reduce to behavioral outputs.  
    - *Problem:* MAD loses its advantage over behavioral monitoring.  
    
  **Unresolved tension:** Causal abstraction frameworks (e.g., Woodward) *presuppose* variable correspondences. Philosophy of mind (e.g., multiple realizability) predicts the dilemma but offers no empirical resolution. We lack tests for an **intermediate grain**—where mechanisms preserve identity across runs *without collapsing to behavior*.  

  #### **Method: Hunting the Intermediate Grain**  
  **Hypothesis:** Mechanisms can be identified at a grain defined by **intervention-invariant effects**—e.g., "whatever subgraph computes feature X, such that intervening to corrupt it produces error Y in context Z." We test stability across seeds via:  
  - **Models:** 12 nano transformers (2 layers, 8–16 heads). Trained on:  
    - **Task:** Synthetic arithmetic (e.g., "solve `(a ⊕ b) ∗ c`") with injected backdoors (e.g., "if input contains ‘&’, output 0").  
    - **Variants:** 4 seeds per model size (6M–15M params), identical training data.  
    - **Why small?:** Compute constraints prohibit cross-scale; we focus on seed variance as the critical test.  

  **Month 1: Establish Baselines**  
  - Train 8 models (4 clean, 4 backdoored).  
  - Build MAD tools for one backdoored model:  
    - Use activation patching to localize the backdoor circuit.  
    - Train SAE/probes to detect the mechanism.  
  - Validate internally: Detector AUC ≥0.95 on clean vs. backdoored inputs.  

  **Month 2: Test Transfer Across Seeds**  
  - Apply the **same detector** (no retraining) to the other 3 backdoored models.  
  - Interventions:  
    - **Correspondence test:** Align mechanisms via gradient-based feature similarity (e.g., Centered Kernel Alignment).  
    - **Invariance test:** Measure output divergence when patching the "same" circuit (via alignment) across models.  
  - **Success metric:**  
    - Transfer: Detector AUC ≥0.85 on *all* backdoored models.  
    - Finer-than-behavior: Detector fires **before** the backdoor behavior manifests (e.g., in intermediate layers) or flags **behaviorally silent** adversarial inputs (crafted via input perturbation).  

  **Month 3: Stress Tests and Falsification**  
  - **Adversarial validation:** Train probes on clean models with *behaviorally identical* outputs (e.g., same error rates) but *no backdoor*. Verify detectors don’t fire.  
  - **Negative controls:** Inject synthetic "distractor" mechanisms (e.g., random feature noise) to test specificity.  
  - **Failure modes:**  
    - If transfer AUC <0.7, test if manual alignment (e.g., CCA) rescues performance.  
    - If detectors only fire when behavior is disrupted, they’re likely coarse.  

  #### **What Constitutes Success?**  
  - **Positive result:** Detectors transfer across seeds with AUC ≥0.85 *and* outperform behavioral monitors (e.g., by 20% on early detection).  
  - **Negative but valuable:**  
    - If transfer fails *despite alignment*, mechanisms are seed-specific (fine-grained).  
    - If detectors match behavioral baselines, mechanisms are coarse.  
  - **Falsification of intermediate grain:**  
    - Transfer fails AND alignment methods show low feature similarity (<0.4) for "same" mechanisms.  
    - OR detectors fire iff behavior is disrupted (coarse equivalence).  

  #### **Scope and Constraints**  
  - **No cross-scale experiments:** We explicitly avoid scaling laws due to compute limits. Results will generalize only to similar architectures.  
  - **What we sacrifice:** Real-world data, complex capabilities (e.g., deception).  
  - **Why still worthwhile:** A negative result forces a pivot—either toward ensemble-based MAD (fine-grained) or hybrid behavioral-mechanistic monitoring (coarse).  

  #### **Outcomes**  
  - **Deliverables:**  
    - Open-source toolkit for cross-model mechanism alignment.  
    - Framework for evaluating MAD transferability.  
  - **Impact:** Either discovers a viable path for deployable MAD or exposes fundamental limitations, steering the field toward new approaches.  

  ---  
  **Sharp Claim:** The intermediate grain likely exists *only if* mechanisms converge to functionally isomorphic subgraphs across seeds—and if not, mechanistic anomaly detection is either non-scalable or redundant. This project will force a verdict.
