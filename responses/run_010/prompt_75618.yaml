      "what_it_forbids": "<one sentence>"
    },
    "overall": {
      "more_right": "Ravi" | "Helen",
      "on_what": "<one sentence>",
      "where_the_other_wins": "<one sentence>"
    },
    "neither_raised": ["<substantive point>", "<substantive point>", "..."],
