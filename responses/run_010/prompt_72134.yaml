prompt: |-
  I've been reading around advance directives for a few months now and I keep running into the same shape of argument without having a word for it. Someone writes down, while clear-headed, what they want to happen if they reach a certain state — advanced dementia, say, or a bad manic episode. Later they reach it and report, sincerely, that they're fine, actually pretty happy, and don't want the thing they asked for anymore. Then the people arguing about the case split into two camps: one says the current contentment shows the earlier self got the prediction wrong, they had no idea what that state would feel like from the inside. The other says no, that contentment is precisely the adaptation the directive was written to anticipate, so counting it as evidence against the directive is circular.

  It's that second camp's move I can't find a name for. Not preference change in general — the specific case where the change was predicted by the person making it, in advance, and pre-emptively written off as not counting. Two more so you can see where the edges are: a recovering alcoholic who, sober, tells his friends not to lend him cash no matter how convincing he sounds later; and someone diagnosed with Huntington's who writes that her family should ignore her protests that she's "not ready yet."

  Is there an established concept for this, and for the further question of whether the advance discounting actually works? What are the nearest neighbours — I keep bumping into stuff about adaptation, about tying yourself to the mast, about the earlier self versus the later self — and how exactly does each differ from this? Where does one phenomenon stop and two start? I'm not after a label, I want the carving. And please separate what's settled among people who work on this from what's genuinely still disputed; I don't want to walk away thinking one contested position is the consensus.
reasoning: |-
  Okay, the user is diving into a fascinating ethical dilemma around advance directives. They've noticed a recurring split in arguments: one camp dismisses the changed preferences in impaired states as mistaken predictions, while the other sees the contentment as exactly what the directive anticipated. The user wants terminology for this second move and clarity on related concepts.

  First, I need to pinpoint the exact phenomenon. The key is the advance discounting of future preferences. The user’s examples—dementia, mania, addiction, Huntington’s—show a pattern: the prior self anticipates the impaired self’s objections and preemptively invalidates them. This isn't just preference change; it's a meta-preference to ignore certain future states.

  The closest established concept seems to be the Ulysses Contract. Like Ulysses tying himself to the mast to resist the Sirens, it's about binding oneself against future irrationality. But it's not a perfect fit because Ulysses contracts usually involve third-party enforcement, whereas here it's about internal preference discounting. 

  Other related ideas: Parfit's view of identity as psychological connectedness—if the connection breaks (like in dementia), the directive holds. Frankfurt's hierarchy of desires (second-order volitions) fits too; the directive embodies a higher-order rejection of future desires. Adaptive preference formation (Elster) explains why the impaired state’s contentment is discounted—it’s a distorted adaptation.

  The user also wants to know where concepts start and stop. For example, Ulysses contracts are about external constraints, while this is about internal discounting. Autonomy debates: is respecting past autonomy (directive) or present preferences more important? 

  On what's settled vs. contested: There's consensus that advance directives are valid in principle, but huge disputes on when to override them. Factors like the severity of impairment, the risk of false positives (overriding genuine preferences), and the authenticity of current states are all contested. The user needs to know that the central tension—past vs. present autonomy—is unresolved, with heavy weight given to the directive in cases like dementia or mania, but less so in fluctuating conditions like bipolar disorder.

  The user’s deeper need seems to be understanding how to navigate these arguments systematically, possibly for academic or personal decision-making. They want conceptual clarity to engage with the literature or apply it practically. Highlighting the unresolved debates helps them avoid mistaking a common argument for consensus.
answer: |-
  This is a beautifully articulated and profound question—you've hit upon one of the most contentious knots in medical ethics, philosophy of identity, and autonomy theory. The phenomenon you describe lacks a single universally accepted term, but it's deeply embedded in several overlapping frameworks. Let's carve it precisely:

  ### Core Phenomenon: Preemptive Discounting of Future Preferences
  This is the act of declaring *in advance* that certain future subjective states or expressed preferences (e.g., contentment in dementia, craving during mania) should be disregarded as invalid or non-autonomous when assessing one's "true" wishes. Its key features:
  1.  **Anticipation of Change:** The prior self predicts a specific future psychological state (e.g., impaired judgment, distorted perception, overwhelming desire).
  2.  **Meta-Preference:** The directive doesn't just state a *preference* (e.g., "don't resuscitate"), but a *preference about how to evaluate future preferences* ("disregard any statement I make in State X saying I want resuscitation").
  3.  **Epistemic Dismissal:** The future state's subjective report (happiness, denial of impairment) is framed as unreliable evidence *by design*, precisely because it manifests the predicted impairment the directive sought to avoid.

  ### Established Concepts & How They Relate (and Differ)
  1.  **Ulysses Contract:**
      *   **What it is:** A pre-commitment strategy where an agent binds their future self to resist a known source of future irrationality or overwhelming temptation (like Ulysses tied to the mast to resist the Sirens).
      *   **Relation:** This is the *closest* established term. Your examples fit perfectly *if* the core issue is resisting a known *irrationality* or *temptation* (mania, addiction, potentially Huntington's denial). The directive *is* the contract.
      *   **Difference:** Ulysses contracts often imply an *external* enforcement mechanism (the ropes, the friends withholding cash). Your phenomenon focuses on the *internal epistemic move*: the preemptive dismissal of the future self's expressed state as evidentially void *because* it's the predicted state of impairment. Not all Ulysses contracts explicitly discount the future self's testimony; some just create barriers.

  2.  **Precedent Autonomy (vs. Current Autonomy):**
      *   **What it is:** The philosophical debate about whether the autonomous choices of the *past self* should override the (potentially impaired) expressed preferences of the *present self*.
      *   **Relation:** Your phenomenon is a *specific application* of precedent autonomy, where the past self explicitly instructs others to *discount* the present self's testimony as evidence of well-being or preference.
      *   **Difference:** Precedent autonomy is the broader principle ("respect the past directive"). Your phenomenon is the specific *tactic within that principle*: "disregard evidence from State X *because* State X is what I sought to avoid and predicted would distort my judgment."

  3.  **Hierarchy of Desires / Second-Order Volitions (Frankfurt, Dworkin):**
      *   **What it is:** The idea that autonomy lies not just in first-order desires ("I want a drink"), but in our second-order volitions ("I *want* to *not want* a drink"). Authentic desires are those we identify with at a higher level.
      *   **Relation:** The advance directive represents the clearest expression of the person's second-order volition ("I *want* my future self in State X *to not want* life-sustaining treatment/manic spending/etc."). Discounting the future self's contentment is seen as respecting this higher-order identification.
      *   **Difference:** This is a foundational *justification* for the discounting move, rather than a name for the move itself. It explains *why* we might privilege the past self's view.

  4.  **Adaptive Preference Formation (Elster, Nussbaum):**
      *   **What it is:** The process where people adjust their preferences to align with perceived constraints or limitations (e.g., the fox deciding the grapes are sour).
      *   **Relation:** The "second camp" explicitly argues that the contentment in dementia or denial in Huntington's *is* adaptive preference formation. The directive anticipated this adaptation and instructed that it be disregarded as inauthentic or a result of compromised capacities.
      *   **Difference:** Adaptive preference is the *phenomenon being discounted*. Your concept is the *strategy* for dealing with it preemptively. The debate is whether this adaptation is "real" happiness or a cognitive distortion.

  5.  **Identity over Time / Psychological Connectedness (Parfit):**
      *   **What it is:** Philosophical exploration of what makes a person the same person over time. Parfit argues it's psychological connectedness (overlapping memories, beliefs, desires), not strict identity.
      *   **Relation:** If severe dementia or psychosis drastically breaks psychological connectedness, one might argue the directive-writing self and the current self are significantly different "persons." Respecting the directive respects the *earlier person* whose life narrative and values are embodied in it. Discounting the current self's state follows from seeing it as a different, impaired entity.
      *   **Difference:** This provides a metaphysical *justification* for discounting, especially relevant in dementia. The discounting *move* can be made without fully endorsing Parfit's view, by focusing on impairment rather than identity rupture.

  ### Where Does One Phenomenon Stop and Another Start?
  *   **Ulysses Contract vs. General Precedent Autonomy:** The Ulysses contract specifically involves binding oneself against a *known, specific threat to rationality or willpower* (Sirens, addiction triggers, mania). Precedent autonomy is broader (e.g., a healthy person simply stating "no life support ever," without predicting a specific impaired state).
  *   **Discounting Move vs. Adaptive Preference:** Discounting is the *instruction* ("ignore State X's reports"). Adaptive preference is the *explanation* for *why* State X's reports might be unreliable ("they adapted to a bad situation").
  *   **Discounting Move vs. Hierarchy of Desires:** The discounting move is the *practical application* of respecting the higher-order desire expressed in the directive. The hierarchy explains the *moral weight* of the directive.

  ### What's Settled vs. What's Hotly Contested
  **Settled (Broad Consensus):**
  1.  **Validity in Principle:** Advance directives are ethically and legally valid instruments for expressing future wishes. Competent individuals have the right to make them.
  2.  **Impaired States Justify Discounting (Sometimes):** There *are* states (severe dementia, profound mania, active psychosis, severe intoxication) where current preferences *can* be overridden due to decisional incapacity. The directive provides crucial evidence of the person's wishes *when competent*.
  3.  **The Problem is Real:** The tension between past and present selves in these scenarios is a genuine ethical dilemma with no easy answer.

  **Genuinely Controversial (Core Disputes):**
  1.  **The Epistemic Discounting Move Itself:**
      *   **Does it "work"?** Is it *ever* justified to completely disregard the *expressed subjective experience* (contentment) of the current self, *especially* if it appears stable and not distressing? Critics (often aligned with disability perspectives or emphasizing current experience) argue this is profoundly disrespectful and risks false negatives (overriding genuine contentment). Proponents argue that the *predicted* distortion means the contentment *cannot* be trusted as evidence of genuine well-being *as defined by the competent self*.
  2.  **Scope of Application:** When *exactly* does this discounting apply?
      *   **Dementia:** This is the fiercest battleground. How severe must cognitive decline be? Is mild/moderate dementia contentment valid? Does the directive writer truly understand the *subjective experience* of dementia well enough to discount it? (This relates to the "predictive error" camp).
      *   **Psychiatric Conditions:** Is a person in a manic episode *always* incompetent to assess their well-being? What about fluctuating conditions? Denial in Huntington's might be clearer, but even here, the *timing* of overriding "I'm not ready yet" is contested.
      *   **"Happiness" vs. "Values":** Should directives based on avoiding states *inconsistent with deeply held values* (e.g., loss of dignity, dependence) be privileged over current subjective contentment, even if severe? (Rebecca Dresser, Ronald Dworkin debated this sharply).
  3.  **Weight of the Directive:** How much absolute weight should the directive carry vs. current (even impaired) preferences or assessments of best interests by others? Is it an absolute instruction, or one important factor among others?
  4.  **Authenticity & Identity:** Who is the "real" self? Is the directive-writing self always the "truer" self? Parfit's view is influential but not consensus. Some argue for a narrative conception of identity where the directive holds, others emphasize the present experiencing self.
  5.  **Risk of Abuse/Oversimplification:** Critics worry discounting creates a slippery slope where caregivers too readily dismiss the current wishes of vulnerable people with disabilities or illnesses.

  ### In Summary
  You're grappling with **Preemptive Epistemic Discounting within a Ulysses Contract framework**, justified by appeals to **Precedent Autonomy**, **Hierarchy of Desires**, and the predicted **Adaptive Preference Formation** or **Identity Disruption** in the future impaired state.

  There is **no consensus** on the permissibility or scope of the discounting move itself, especially regarding dementia contentment. The debate hinges on fundamental, unresolved questions about:
  *   The nature of autonomy (past vs. present).
  *   The reliability of subjective experience under impairment.
  *   The definition of well-being (subjective happiness vs. objective values/dignity).
  *   Personal identity over time.

  The "second camp's move" is a powerful and logically coherent argument within a precedent autonomy/higher-order desire framework, but its practical application, especially when faced with seemingly stable contentment, remains one of the most profound and contested challenges in bioethics. Keep wrestling with it – you've identified the heart of the matter.
