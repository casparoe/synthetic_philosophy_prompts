answer: |-
  ## Deconstructing the Therapy-Enhancement Distinction: The Pistorius Crucible

  **Brainstorming Your Core Questions & Fracture Points:**

  1.  **Mapping the Case:** What elements constitute therapy, enhancement, or neither, and crucially, *on what baseline definition does each categorization depend?** (Fracture: Choice of baseline radically alters the label).
  2.  **Testing Philosophical Accounts:** How do the leading theoretical frameworks for distinguishing therapy/enhancement (disease-based, treatment/improvement, natural lottery, positional goods) handle the Pistorius case? Do they yield a *determinate* verdict, or only do so after importing *additional, unsupplied* premises? (Fracture: Theories may be indeterminate or rely on unstated values).
  3.  **Identifying Failures:** Does the case expose fundamental flaws in the distinction itself? Specifically, evaluate:
      *   **(a) Aggregation:** Can "overall advantage" be meaningfully assessed when the intervention confers multidimensional, conflicting functional changes? (Fracture: Scalar advantage vs. vector functions).
      *   **(b) Person-Relativity:** Does the label depend entirely on the user's *prior state* rather than the *intervention itself*? (Fracture: Intervention identity vs. user history).
      *   **(c) Ratchet Effect:** Does the passage of time (e.g., tech becoming standard) invalidate an "enhancement" label, undermining the distinction's stability? (Fracture: Timeless essence vs. temporal contingency).
  4.  **Theory Stress Test:** What does this case *do* to the therapy/enhancement distinction? Is it a fatal counterexample, a manageable anomaly requiring relativization (to task, person, rules), or something else? If relativization saves it, precisely what work *can* it still do? (Fracture: Distinction's robustness and scope).
  5.  **Procedural Collapse:** Does the distinction, in practice under uncertainty, devolve purely into a question of *burden of proof* allocation? If so, is this a defeat or merely its honest, practical form focused on permissibility? (Fracture: Conceptual purity vs. procedural necessity).

  Your diagnosis concerning baselines is fundamentally correct and highlights the core instability. The Pistorius case is *excellent* for this purpose precisely because it forces these baseline conflicts into sharp relief. It's not the wrong episode; it's the perfect storm.

  ---

  **1. Mapping the Case: Labels Flip with Baseline**

  | **Element**                 | **Label (w/ Baseline)**                                  | **Tacit Baseline Adopted**                 | **Explanation**                                                                 |
  | :-------------------------- | :------------------------------------------------------- | :----------------------------------------- | :------------------------------------------------------------------------------ |
  | **Carbon-Fibre Blades**     | **Therapy**                                              | *Pistorius's Unaided Capacity*             | Restores ambulatory/running function impossible without them.                 |
  | **Carbon-Fibre Blades**     | **Enhancement** / **Outside Category** | *Species-Typical Functioning*            | Provides spring-like mechanics & reduced mass absent in biological legs, *potentially* exceeding "normal" human running dynamics in specific ways. |
  | **Carbon-Fibre Blades**     | **Equipment (Outside Category)**                         | *Elite Sprinting Distribution*             | Similar to specialized shoes, tracks, or training methods – tools athletes use within the sport's technological context. |
  | **Competition Eligibility** | **Rule Compliance (Outside Category)**                   | *Sport Rulebook*                           | A legal/regulatory question about fairness under specific rules, not inherently medical. |
  | **Amputation in Infancy**   | **Therapy**                                              | *Species-Typical Functioning* / *Developmental Potential* | Prevented greater functional limitation; aimed at enabling typical development/mobility. |

  **Key Insight:** The *same blades* are therapy, enhancement, or mere equipment depending *solely* on the chosen baseline. The baseline isn't "in the biology"; it's a *normative choice* about what constitutes the relevant reference point.

  ---

  **2. Running the Theories: Indeterminacy Reigns**

  | **Philosophical Account**              | **Core Idea**                                                                 | **Verdict on Pistorius/Blades**                            | **Determinate?** | **Requires Unsolicited Premise?**                            |
  | :------------------------------------- | :---------------------------------------------------------------------------- | :--------------------------------------------------------- | :--------------- | :----------------------------------------------------------- |
  | **Disease/Normal Function (Boorse)** | Therapy corrects sub-normal function due to disease/injury relative to species-typical efficiency. | **Ambiguous.** Is congenital absence of fibulae a "disease" compromising species-typical function? Yes. Do blades *merely restore* species-typical sprinting, or *exceed* it biomechanically? Empirical uncertainty & normative judgment required. | **No**           | A definition of "disease" for congenital limb absence and a precise biomechanical model of "species-typical" sprinting mechanics. |
  | **Treatment vs. Improvement (Daniels)** | Therapy aims at restoring opportunity range via normal functioning; enhancement goes beyond. | **Ambiguous.** Blades restore running (part of normal opportunity range). But do they enable sprinting *beyond* the normal range? Depends on species-typical baseline and whether elite sprinting is within "normal" range. | **No**           | Clear definition of "normal opportunity range" and whether elite athletics is included. |
  | **Biologically Given / Natural Lottery** | Therapy fixes deficits from the "natural lottery"; enhancement alters traits distributed by it. | **Ambiguous.** Fixes congenital deficit? Yes. But the *means* (artificial blades with unique properties) alters traits beyond the natural lottery distribution for human legs. | **No**           | Definition of the "natural" human form and permissible fixes. Is any prosthesis enhancement? |
  | **Positional Goods / Fairness (Savulescu-like)** | Enhancement problematic if creates unfair positional advantage in competition. | **Focuses on Fairness, not Label.** Blades potentially create unfair advantage/disadvantage *relative to competitors*. The therapy/enhancement label is secondary to the fairness assessment. | **N/A**          | Clear evidence of *net* competitive advantage. Lacks conceptual tools to label the blades intrinsically as therapy/enhancement. |

  **Key Insight:** *None* of the major theories yield a *determinate* therapy or enhancement verdict for the blades *on their own*. Each requires importing contested empirical claims (about biomechanics vs. species-typical) or normative judgments (what counts as "disease," "normal function," "natural," or a fair "opportunity range"). The distinction fails to provide clear guidance here without external input.

  ---

  **3. Evaluating Candidate Failures: Your Diagnoses Hold**

  *   **(a) Aggregation Problem:** This is a **critical flaw** exposed by the case. The blades demonstrably conferred advantages (energy return at high speed, reduced lower limb mass/inertia?) and disadvantages (poorer acceleration out of blocks, instability/inefficiency on bends, potentially different stride kinematics affecting fatigue). Claiming an "overall competitive advantage" requires collapsing these distinct, sometimes opposing, functional vectors into a single metric. This is not merely an empirical unknown (though it was); it's conceptually dubious. *Is* there a single "sprinting function" to measure against? The verdict of enhancement becomes indeterminate if "better" is multidimensional and context-dependent (straight sprint vs. full 400m race). *Your point stands: the scalar presumption undermines the distinction.*

  *   **(b) Person-Relativity Problem:** This is **devastating** to the distinction as an objective property of the intervention. If an able-bodied athlete voluntarily amputates healthy limbs to use identical blades, the *identical technology* shifts from being labeled potential "enhancement" (in their case) to "therapy" (in Pistorius's). The label depends entirely on the *user's prior biological state*, not the intrinsic properties or effects of the device. This strongly suggests the distinction tracks *history* and *purpose* ("restoring vs. augmenting"), not the intervention itself. *Your diagnosis is correct; the label hinges on "who you were beforehand."*

  *   **(c) Ratchet Effect:** This highlights the **social contingency and instability** of the distinction. If blades become standard, even necessary, for para-sprinters to compete *at all* within their category, calling them "enhancement" for Pistorius in 2008 seems nonsensical by 2018 – they were baseline equipment for his competitive context. An "enhancement" verdict decays over time as technology integrates and norms shift. This undermines any claim that the distinction captures a timeless essence of the intervention. *Your concern is valid; the output is temporally unstable, dependent on prevailing norms and technology.*

  ---

  **4. Reversing Direction: What the Episode Does to the Theory**

  The Pistorius case is not a simple counterexample killing the distinction outright. Instead, it acts as a powerful **anomaly** that forces significant **relativization** and exposes **severe limitations**:

  *   **Absorption via Relativization:** The distinction *can* survive, but *only* if heavily relativized:
      *   **To Person:** "Therapy for *whom*?" (Pistorius: therapy; able-bodied amputee: enhancement).
      *   **To Task/Context:** "Therapy/Enhancement for *what*?" (Restoring walking: therapy; optimizing elite 400m sprinting: enhancement/sports equipment).
      *   **To Baseline:** Explicitly stating the reference point (Unaided capacity? Species-typical? Sport-normative?).
  *   **Work Remaining After Relativization:**
      *   **Clinical Context:** It retains utility in standard medical contexts where baselines are clearer (e.g., antibiotics for infection, insulin for diabetes - therapy; steroids for non-deficient athlete - enhancement). The "species-typical functioning" baseline is *less contested* here.
      *   **Moral Signaling:** It still signals intent and perceived deviation from a norm, even if the norm is relative.
      *   **Rulebook Foundation:** It can inform, though not determine, sports regulations (e.g., rules often prohibit technologies deemed "enhancing" beyond standard equipment).
  *   **Work It Can No Longer Do:**
      *   **Provide Objective, Universal Labels:** It cannot categorically label technologies like the blades as intrinsically "therapy" or "enhancement."
      *   **Resolve Novel Edge Cases Determinitively:** It cannot settle debates like Pistorius's eligibility without importing external normative choices about the relevant baseline and purpose.
      *   **Claim Biological Essence:** It cannot be grounded purely in biology, as biology doesn't specify the baseline.
  *   **Survival Status:** The distinction survives relativization, but as a **blunt, context-dependent tool**, not a precise scalpel. It becomes more about *framing* and *justification* relative to a chosen norm than about inherent properties.

  ---

  **5. The Procedural Collapse: Burden of Proof as the Core**

  You've identified a crucial, often overlooked, dimension. In the Pistorius case, and similar edge cases under empirical uncertainty, **the therapy/enhancement distinction does functionally collapse into an allocation of the burden of proof.**

  *   **The Collapse:** The initial ban presumed the blades *might* provide an advantage (placing burden on Pistorius to prove they didn't, or that advantage wasn't unfair). CAS overturned it because the governing body's *specific evidence* was inadequate, shifting the burden back to them to prove a *net* advantage under race conditions. The 2010s rule change explicitly put the burden on the athlete to prove "no overall net advantage." The subsequent ruling struck this down as discriminatory, implicitly suggesting the *default assumption* shouldn't be disadvantageous to disabled athletes using necessary prosthetics. The core dispute became: *Who must prove what, and to what standard, when the empirical picture is incomplete?*
  *   **Is This a Defeat?**
      *   **Not a Total Defeat, but a Revelation:** It reveals that in contentious, uncertain domains like elite sports with novel tech, the distinction *cannot* resolve the issue purely conceptually. It inevitably gets entangled in procedural fairness – "What must be demonstrated, and by whom, to permit or prohibit?"
      *   **Honest Form:** This procedural focus *is* honest. The underlying question in sports regulation *is* fundamentally about "what we may demand of people" (athletes to prove no advantage, federations to prove advantage) to ensure fair competition, safety, or preserve the "spirit of the sport." The therapy/enhancement language often serves as a proxy for these deeper concerns about permissibility and fairness. The Pistorius case shows that arguing directly about burden of proof and fairness might be more transparent than arguing through the murky lens of therapy vs. enhancement.
      *   **Limits of the Collapse:** This collapse is most acute in domains like elite sports with high stakes and complex performance metrics. In clear-cut clinical decisions (treating a fracture), the distinction remains practically useful without resorting to burden of proof arguments.

  **Conclusion: Your Baseline Diagnosis Validated, Distinction Diminished**

  Your analysis pinpointing the baseline problem is correct and central. The Pistorius case brilliantly exposes the therapy/enhancement distinction as **inherently relative, unstable, and context-dependent**, not an objective property of technologies. It relies on choosing a baseline (personal, species-typical, sport-specific, rule-defined), a choice biology cannot dictate. Leading philosophical accounts fail to provide determinate answers here without importing contested premises. The case amplifies fundamental flaws: aggregation difficulties, decisive person-relativity, and a temporal ratchet effect.

  While relativization (to person, task, baseline) allows the distinction to limp on in clearer contexts, its authority in novel, high-stakes edge cases is shattered. In such arenas, under empirical uncertainty, the debate inevitably transforms into a procedural one about burden of proof and fairness – revealing that the core issues were often about permissible demands and competitive equity all along, with "therapy" and "enhancement" serving as imperfect, sometimes misleading, labels. The distinction survives, but severely diminished, as a rough heuristic rather than a robust philosophical or regulatory cornerstone. Its work was never purely about the technology; it was always entangled with norms, history, and power (who gets to set the baseline and the burden). The Pistorius saga is less about legs and blades, and more about the contested lines we draw around bodies, technology, and fairness.
