prompt: |-
  I sit on my university's research integrity panel — seven of us, mostly faculty plus one student rep — and the chair has asked me to circulate a written recommendation before we meet on the 14th. For background, I'm a cell biologist, not a philosopher; the one research-ethics course I took in grad school left me more confused than I started, so I'm kind of winging this. Here's the mess. A neuroscience grad student (I'll call him D) is charged with fabricating values in two figures of a paper he submitted. The complainant is a senior professor, K, and honestly her evidence is strong — she has the raw instrument files and D's numbers just dont come out of them. The problem: eleven years ago K was herself the subject of a misconduct finding over exactly this kind of thing, doctored image intensities, and the university settled it quietly. No retraction, no dismissal; she stayed and later got an endowed chair. The settlement had a confidentiality clause, but D dug it up anyway through a records request to a state office, and his response to the panel is essentially that K has no standing to accuse him of anything, and that it would be grotesque for this university to expel him for the very thing it let her build the rest of her career on. Our general counsel then sent a terse email saying the panel shouldn't touch the settlement file at all.

  Two of my colleagues want to dismiss the case against D outright on the standing ground. Two more want to admit K's history and cut D's sanction down to reflect the inconsistency. The rest of us think the whole line is a tu quoque dodge but nobody can articulate why, and I keep finding I'm not so sure — there's something in D's complaint that feels real, and I can't tell whether it's about whether the charge is true, or about who gets to bring it, or about the university being the hypocrite rather than K personally. Also unresolved procedurally: our charter says a finding has to rest on material properly before the panel, and it's genuinely unclear whether the leaked settlement counts.

  Could you draft the memo I'll send around? I need it to land on a concrete disposition — whether we proceed against D, what happens to K's record and to K herself, whose name the finding issues in, and on what timetable, since D's funding runs out at the end of term and the journal is asking us for a status update. Take D's objection seriously rather than swatting it as a fallacy, and give the strongest honest case for whichever side you come out against — a real argument, not a strawman paragraph I can see through. Something the other six can read in ten minutes over coffee. Lead with the bottom line in your very first sentence, the actual recommendation so nobody has to hunt for it, then the reasoning; no preamble and no restating my situation back to me.
reasoning: |-
  Okay, the user is part of a university research integrity panel dealing with a complex misconduct case. They need a memo draft that addresses a grad student's fabrication charges while grappling with the accuser's own past misconduct. 

  First, I need to unpack the layers here. The core conflict isn't just about evidence - it's about institutional hypocrisy. The student (D) makes a morally compelling argument: why should he face expulsion for fabricating data when Professor K did the same thing and suffered no real consequences? That emotional weight is clearly getting to the panel members, especially the user who admits being unsettled by it. 

  The legal complication is thorny - the general counsel forbade reviewing the settlement file, but D already leaked it. So procedurally, can they even acknowledge it exists? The panel's charter requires decisions based only on "material properly before them," which creates a loophole. 

  Hmm... the user's actual request is tactical: they need a memo that forces a decision while respecting both the moral dilemma and procedural constraints. But reading between lines, their deeper need is for moral clarity - they're wrestling with whether punishing D would be unjust when K got a pass. 

  Key angles to address:
  - Evidence against D is solid (K's raw files prove fabrication)
  - K's history can't be ignored emotionally but may be inadmissible legally
  - The hypocrisy argument is valid but not exculpatory for D
  - Any sanction must separate D's actions from K's unresolved past

  The solution path seems clear: recommend proceeding against D based solely on his provable misconduct, while formally requesting the university reopen K's case separately. This sidesteps the procedural trap and answers the journal's inquiry about D's paper. 

  For the memo structure: brutal upfront clarity ("We recommend proceeding...") followed by layered reasoning that validates D's point without excusing him. Must explicitly call out the institutional failure regarding K - that's the user's unresolved discomfort. 

  Timeline is urgent with D's funding ending. Need to propose concrete next steps: vote on D's case by X date, demand admin action on K by Y date. The "whose name" issue solves itself - D's finding stands alone, K's gets separate handling. 

  Final note: the user admitted being out of their depth philosophically. The reasoning should subtly educate about why tu quoque doesn't absolve guilt while acknowledging its moral force. No ethics jargon though - "coffee break readable" was the brief.
answer: |-
  **MEMORANDUM**  
  **TO:** Research Integrity Panel Members  
  **FROM:** [Your Name], Panel Member  
  **DATE:** 8 October 2023  
  **SUBJECT:** Recommendation re: Case of Student D  

  ---

  **RECOMMENDATION:** Proceed with adjudicating the charges against D based solely on the evidence of fabrication, issue a finding of misconduct against D, and recommend formal censure (but not expulsion). Simultaneously, refer K’s unresolved past misconduct to the Provost for independent review under institutional whistleblower protocols.  

  ---

  ### I. Core Reasoning: D’s Misconduct Must Be Judged on Its Own Merits  
  The evidence of D’s data fabrication (K’s raw instrument files vs. submitted figures) is materially uncontested and meets our burden of proof. D’s guilt or innocence cannot turn on K’s history because:  
  - **Procedural Bar:** General counsel has directed the panel not to consider K’s settlement file. Our charter binds us to evidence "properly before the panel," and the settlement is legally inaccessible for this proceeding.  
  - **Irrelevance to Truth:** Whether K committed misconduct does not alter whether D did. D’s fabrication is either objectively verifiable (via raw data) or not; K’s past cannot retroactively falsify D’s data.  
  - **Moral vs. Legal Equity:** D’s outrage at institutional hypocrisy is valid but misdirected. Our mandate is to judge *his* actions, not rectify historical injustices by excusing new violations.  

  ---

  ### II. Addressing D’s "Standing" Argument (and Why It Fails)  
  D contends K lacks moral authority to accuse him, and the university forfeited its right to sanction him. **Strongest case for D:** Institutions cannot demand integrity while sheltering past offenders, creating a "two-tiered" system that erodes trust. Punishing D alone compounds injustice.  
  **Why it does not absolve D:**  
  - **Panel’s Limited Role:** We lack jurisdiction to nullify charges based on accuser ethics. D’s remedy (if any) lies in appealing sanctions or alleging procedural bias—not dismissal.  
  - **K’s Role:** K is the *complainant*, not the adjudicator. Her credibility is irrelevant to forensic evidence she provided (raw files). The university—not K—brings the charge.  
  - **Hypocrisy ≠ Absolution:** Institutional failures (e.g., K’s unresolved past) must be addressed separately. Waiving consequences for D incentivizes misconduct by framing it as "payback."  

  ---

  ### III. Recommended Disposition  
  1. **For D:**  
     - **Finding:** Misconduct (fabrication) substantiated.  
     - **Sanction:** Formal censure, mandatory ethics retraining, and correction/retraction of the paper. *Not expulsion*: Given the unresolved context, expulsion would appear disproportionate and retaliatory. Funding termination remains academic (not punitive).  
     - **Timetable:** Issue finding by **12 October**; notify journal of "misconduct found, retraction pending" by **15 October**.  

  2. **For K/University:**  
     - Refer K’s past misconduct and its handling to the Provost under **whistleblower review** (bypassing confidentiality via institutional self-reporting). Demand:  
       - Reexamination of the original evidence.  
       - Public accountability if misconduct is confirmed (retraction, chair revocation).  
     - **Why this?** It acknowledges D’s valid grievance without compromising this proceeding. The panel lacks authority to sanction K, but we can force institutional accountability.  

  3. **Whose Name in Findings?**  
     - D’s finding is against D alone.  
     - The referral regarding K is an institutional recommendation (not a finding).  

  ---

  ### IV. Why This Balances Ethics, Equity, and Expediency  
  - **Upholds Integrity:** D’s provable fabrication is addressed without conflating it with K’s past.  
  - **Acknowledges Systemic Failure:** Forces the university to confront its history rather than burying it.  
  - **Practical:** Meets journal deadlines and D’s funding cutoff. Avoids legal risk by ignoring the settlement.  
  - **Moral Legibility:** Sanctions D without absolving the institution.  

  **VOTE REQUIRED BY 10 OCTOBER.**  

  ---  
  **Key Distinction:** We judge acts, not actors’ worthiness. D’s data is fabricated; K’s past is the university’s unfinished business. Solve both—separately.
