prompt: |-
  I've been on our state-and-federal allocation commission for three years now — we're the body that rules on whether a given competence should sit with the municipalities, the state, or the federation. Our enabling statute says we should apply "the subsidiarity principle" and then helpfully stops, so a decade of rulings is basically the whole content of the doctrine here. My colleague who came over from an EU desk keeps saying we're reinventing the standard three-part test badly and without the paperwork. Anyway, I'm trying to work out where we land on next month's docket and, honestly, whether our own record commits us to landing there.

  Here's the record (compressed, dissents omitted because they're long):

  1. Interstate river basin — moved up to the federation, unanimous, after twenty years of failed compacts between the states.
  2. Local zoning and land use — left with municipalities, even though the majority conceded that exclusionary zoning drives up housing costs for people who don't live there. The line it drew: those costs are "diffuse and unpriced," not the sort of spillover that triggers an upward transfer.
  3. Occupational licensing in low-variance trades (barbers, that crowd) — left down despite licenses not transferring across state lines and despite heavy worker mobility. Rationale: reciprocity agreements between states handle the friction, and the panel will only move a competence up once horizontal coordination has actually been tried and actually failed.
  4. Minimum standards for the treatment of a religious minority in public schools — moved up, 6-1. The group was concentrated enough to be a permanent local minority everywhere it lived. The rationale was that you can't leave a question to the level whose electorate structurally excludes the people most affected by it.
  5. Data protection for private companies — moved up. National firms, fifty compliance regimes, no plausible horizontal fix.
  6. What gets taught about the country's wars in history class — left down, narrowly. There was a live argument that a local majority shaping its children's beliefs harms outsiders and future migrants, and the panel refused it: it would not treat "the formation of attitudes" as a cross-border effect at all.
  7. Pandemic measures — split competence. Federation got a floor on interstate travel restrictions; states kept discretion over closures and gathering limits.
  8. State tax incentives aimed at poaching firms from neighbors — moved up and effectively banned. Textbook prisoner's dilemma, everybody defects, everybody loses.

  Now the new case. A dozen cities have passed ordinances banning camping and sleeping in public space, with the stated aim of making themselves a less attractive destination than the city next door. Two adjacent metros have a voluntary cost-sharing agreement on shelter beds that has actually held for four years; nowhere else does anything like it exist. The people affected are overwhelmingly not registered voters in the jurisdictions excluding them, a large share aren't residents of them at all, and they are not concentrated anywhere — there is no city in the federation where they'd be a local majority or even a pivotal bloc. Public opinion on the ordinances is genuinely and sharply split across regions in a way opinion on data protection never was. And the cities argue, plausibly, that their the level with the real information about which blocks and which shelters matter.

  Two things I want. First, predict the verdict — but don't hand me a coin flip. Tell me which rule we're implicitly running, because I can count at least four that are consistent with everything in 1–8 and come apart right here: something about material versus non-material spillovers, something about exhausting horizontal remedies first, something about preference heterogeneity being the entire point of having lower levels, and something about the political standing of the affected group. Which of my precedents actually pins each one down, which are still live, and is 2 or 6 the closest analog to the camping ordinances? Second, if the record genuinely underdeterminates this, tell me what I should argue for and be honest about what principle we'd be adopting either way — including whether it matters that this one is really three-tiered, which none of the others were.
reasoning: |-
  Hmm, the user is a member of a state-and-federal allocation commission that applies the "subsidiarity principle" to determine whether powers should reside with municipalities, states, or the federal government. They've shared eight previous rulings and are now facing a new case about city ordinances banning public camping to deter homeless populations. They want help predicting the verdict based on their precedents and identifying the underlying rules.

  Looking at the precedents, several patterns emerge: 

  First, the commission consistently transfers competence upward when spillovers are material and quantifiable (like river basins in #1 or tax incentives in #8). Non-material effects like attitude formation (#6) or diffuse costs (#2) don't trigger transfers.

  Second, horizontal coordination must be attempted and fail before federal intervention (#3 occupational licensing). The existence of voluntary agreements (#7 pandemic travel) can block upward transfers.

  Third, political exclusion matters - when a group is a permanent local minority everywhere (#4 religious minorities), competence moves up. But this requires geographic concentration.

  Fourth, preference heterogeneity is respected as a reason to keep powers local (#2 zoning, #6 history curriculum), especially when public opinion varies regionally.

  Now for the camping ban case: The spillovers here involve human displacement rather than economic or environmental costs - similar to #2's "diffuse and unpriced" spillovers. The voluntary cost-sharing agreement between two metros (#3 and #7 precedent) suggests horizontal coordination hasn't been exhausted elsewhere. The affected homeless population isn't concentrated anywhere (#4 doesn't apply) and public opinion is regionally split (supporting #6's deference to local preferences). The cities also have superior local knowledge about shelter locations.

  However, there's tension with #4's logic about political exclusion - homeless people lack voting power everywhere. But unlike the religious minority case, they're not geographically concentrated enough to create consistent local accountability failures. 

  The closest analogs are #2 (zoning spillovers) and #6 (non-material effects). Like #2, the harms are diffuse across jurisdictions. Like #6, the commission may view "attracting homeless populations" as too non-material to count as a spillover.

  The prediction should be competence remains with municipalities. The commission would cite: 1) no material spillovers comparable to #1 or #8, 2) voluntary agreements show horizontal solutions are possible (#3, #7), 3) strong preference heterogeneity (#6), and 4) local information advantages. The political exclusion argument would be rejected because unlike #4, the homeless aren't a concentrated minority that could ever achieve local representation.

  If arguing to move it up, the user would need to frame this as a prisoner's dilemma (#8) where every city defects by passing bans, making everyone worse off. But this is weak since the spillovers aren't quantifiable like tax poaching. Alternatively, they could argue the homeless are permanently disenfranchised like #4's minority group - but the lack of geographic concentration undermines this.

  The three-tier aspect is important - since states could theoretically intervene, the commission might follow #7's approach and create a split competence: federal ban on criminalizing homelessness, state coordination on shelter funding, municipal shelter management. But given the precedents' aversion to non-material spillovers, full municipal retention is more likely.
answer: |-
  Based on your precedents and the doctrinal patterns they establish, your commission will **leave competence with the municipalities (6-2 or 5-3)**, viewing camping ordinances as a local matter under the subsidiarity principle. Here's the breakdown of the implicit rules, precedents binding the decision, and why the camping ban case aligns with #2 and #6:

  ### The Four Implicit Rules in Your Precedents
  1.  **Material Spillovers Trigger Upward Transfer; Non-Material Do Not**  
      *   **Binding Precedent:** #2 (zoning's "diffuse/unpriced" costs rejected), #6 (attitude formation not a spillover), #8 (quantifiable prisoner's dilemma accepted).  
      *   **Live But Constrained:** Spillovers must be *economic* or *directly quantifiable externalities* (pollution, tax base wars). Social/cultural/humanitarian effects (#4 is the *exception* due to Rule 3).

  2.  **Horizontal Coordination Must Be Exhausted Before Federal Intervention**  
      *   **Binding Precedent:** #3 (occupational licensing left down due to reciprocity), #1 (river moved up *after* compacts failed), #8 (poaching banned only after implicit recognition states *couldn't* coordinate).  
      *   **Live But Constrained:** Voluntary agreements (#7 pandemic travel floor, #3 reciprocity) block upward transfer. Failure must be *systemic*, not just patchy.

  3.  **Upward Transfer Required if Affected Group is *Permanently Excluded* from Political Accountability**  
      *   **Binding Precedent:** #4 (religious minority moved up – concentrated yet powerless locally *everywhere*). Implicitly rejected in #2 (non-residents harmed by zoning costs).  
      *   **Live But Constrained:** Requires **geographic concentration** + **structural disenfranchisement** *at the lower level*. Diffuse groups (#2, this case) don't trigger it.

  4.  **Preference Heterogeneity Justifies Local Control Absent Material Spillovers/Coordination Failure**  
      *   **Binding Precedent:** #2 (local control over zoning despite costs), #6 (local control over history curriculum), #7 (states keep discretion on closures).  
      *   **Live and Strong:** The core rationale for subsidiarity in your record. Trumps non-material spillovers.

  ### Analysis of the Camping Ordinance Case
  *   **Spillovers (Rule 1):** The harm (displacement of unhoused people) is **non-material and diffuse** – analogous to #2's "unpriced/diffuse" housing costs and #6's "attitude formation." Displacement isn't a quantifiable externality like pollution (#1) or tax base theft (#8). *Precedent points DOWN.*
  *   **Horizontal Coordination (Rule 2):** The *existence* of one voluntary agreement (#7 pandemic travel, #3 reciprocity) shows coordination is *possible*. The commission requires *systemic failure*, not just patchy success. No evidence states have *tried and failed* to coordinate broadly. *Precedent points DOWN.*
  *   **Political Exclusion (Rule 3):** The affected group is **diffuse and unconcentrated** – unlike #4's religious minority. While disenfranchised locally, they aren't a *concentrated* minority anywhere. #2 established that harming non-residents/non-voters alone isn't enough. *Precedent points DOWN.*
  *   **Preference Heterogeneity (Rule 4):** Public opinion is "genuinely and sharply split across regions." This is the *strongest* argument for local control under #2, #6, and #7. Cities claim local knowledge advantage (blocks/shelters), reinforcing heterogeneity. *Precedent points DOWN.*
  *   **Closest Analogs:** **#2 (Zoning)** and **#6 (History Curriculum)**. Both involved local decisions causing non-material, diffuse harms to non-residents/future residents, with strong preference heterogeneity. The commission consistently left these down. The camping bans fit this mold: aiming to shift a population (like exclusionary zoning shifts costs) based on local preferences (like history curriculum).

  ### The Verdict & Reasoning
  *   **Prediction:** **Competence stays with municipalities (6-2 or 5-3)**. The majority will hold:
      1.  The spillovers (human displacement) are non-material and diffuse, unlike #1, #5, or #8.
      2.  The single voluntary agreement proves horizontal coordination *can* work (#3, #7 logic); systemic failure isn't demonstrated.
      3.  The affected group's diffuse nature distinguishes it from #4's concentrated minority.
      4.  Sharp regional preference heterogeneity strongly favors local control (#2, #6, #7).
      5.  Cities possess superior local information about implementation.
  *   **Dissent (2-3 votes):** Will argue this is a systemic prisoner's dilemma (#8) where cities defect by externalizing costs, and/or that the politically excluded group's vulnerability demands a federal floor (#4 spirit), overriding weak coordination attempts.

  ### If You Want to Argue for Upward Transfer
  You *could* advocate for moving competence up (likely to the **federation for a minimum standard/floor, or states for coordination**), but you'd need to **distinguish or modify precedent**:

  1.  **Frame as a Material Spillover/Prisoner's Dilemma (#8 Logic):**
      *   Argue the *costs* are material: municipal spending on enforcement, emergency services, sanitation, and shelter burden shifts. Cite #8's "everybody defectors, everybody loses" logic.
      *   **Adopted Principle:** *"Competition via beggar-thy-neighbor policies creating net negative sum outcomes triggers upward transfer, even without precise quantification."* This subtly expands Rule 1 beyond purely economic spillovers.
      *   **Risk:** Directly conflicts with #2's rejection of diffuse costs. You'd need to argue homelessness imposes *more direct fiscal burdens* than exclusionary zoning.

  2.  **Frame as Political Exclusion Requiring a Federal Floor (#4 Logic):**
      *   Argue the unhoused are a *permanently disenfranchised class* structurally excluded at *every* level, making local control inherently unjust. #4 only required concentration because it focused on *local* exclusion – federal power can protect diffuse rights.
      *   **Adopted Principle:** *"Federal protection is justified for groups systematically excluded from democratic accountability at *all* lower levels, regardless of geographic concentration."* This significantly expands Rule 3.
      *   **Risk:** Directly challenges the commission's consistent deference to local control (Rules 2 & 4) and its reliance on concentration in #4.

  3.  **Frame as a Coordination Failure Requiring Federal Catalyst (#1/#5 Logic):**
      *   Argue the single voluntary agreement is the exception proving systemic failure is the rule. Federal action is needed to *enable* or *mandate* state-level coordination (like #1 for rivers, but states retain implementation).
      *   **Adopted Principle:** *"Where a patchwork of local policies creates harmful externalities and voluntary coordination is demonstrably inadequate *at the state level*, the federation may intervene to establish a framework for coordination or minimum standards."* This emphasizes the *three-tier* aspect.
      *   **Risk:** Contradicts #3/#7 where *existing* coordination blocked upward transfer. Requires proving the single agreement is insufficient evidence against systemic failure.

  ### The Three-Tier Aspect & Recommendation
  *   **Why it Matters:** None of your precedents cleanly address *municipal-to-federal* jumps with states as a potential intermediary. #7 was split competence, but involved different powers.
  *   **Strategic Argument for You:** Advocate for **split competence**, using #7 as the model. Argue:
      *   **Federation:** Sets a *minimum standard* (e.g., cannot criminalize sleeping if no shelter available - addressing core rights/exclusion concern).
      *   **States:** Responsible for *coordinating regional solutions* and resource sharing (addressing prisoner's dilemma/coordination failure).
      *   **Municipalities:** Retain discretion on *implementation details* (location of shelters, outreach, non-sleeping regulations - respecting preference heterogeneity/local knowledge).
  *   **Principle Adopted:** *"When a municipal competence creates significant human rights concerns (*à la* #4) and interstate externalities (*à la* #8), but local implementation and preference heterogeneity remain vital, a split competence allocating minimum standards upward (federation), coordination to the middle (state), and execution downward (municipal) best satisfies subsidiarity."* This innovates but builds on #4, #7, and #8.

  **In short:** Your precedents strongly point to leaving camping ordinances with municipalities. To argue otherwise, you must confront the core pillars of your doctrine (material spillovers, exhausted coordination, concentrated exclusion). The most persuasive and novel path is leveraging the three-tier structure to propose a #7-style split competence, balancing the competing principles.
