answer: |-
  You've hit on some brilliantly subtle tensions in Herodotus' method. Let's break this down systematically for your reading group:

  **1. Homer's Knowledge vs. Historical Truth**  
  Herodotus *does* slide, but with nuance:  
  - First, he establishes Homer's *awareness* of an alternative tradition (Egyptian Helen) through "clues" in the text.  
  - Then, he implies Homer's silence is *deliberate* (for poetic reasons), making the Egyptian version a suppressed truth.  
  - Crucially, he **combines** this with the priests' testimony (2.112-115) *before* 2.116. The priests aren't just another source—they're Egyptian authorities on their own history.  
  **Herodotus' Logic Chain:**  
  Priestly tradition + Homer's tacit awareness + rational plausibility (2.120) = Historical probability.  
  He *doesn't* claim Homer alone proves it happened, but Homer's knowledge makes the Egyptian story credible within a Greek framework.

  **2. The Geographic Leap & Homeric Evidence**  
  This is Herodotus' weakest link, but it reveals his method:  
  - **Iliad Sidon Reference (Primary):**  
    He needs it to anchor Paris *near* Egypt. "Syria borders Egypt" (a simplification, but defensible for coastal regions) bridges the gap. To Herodotus, proximity + opportunity (storm-driven wanderings) = plausible detour.  
  - **Odyssey References (Supporting):**  
    Helen's Egyptian drugs (*Od*. 4.228) and Menelaus' Egyptian detour (*Od*. 4.351) *corroborate* an Egyptian connection. He leads with the Iliad because:  
    a) It's the core Trojan War narrative.  
    b) The Sidon robes are an "incidental detail" (see Q4)—less likely to be fabricated.  
  - **"Nowhere else..." Argument:**  
    This is **critical source criticism**. Herodotus treats Homer as a historian with access to multiple traditions. The *singular mention* of Sidon suggests Homer knew more but chose restraint. It's not an argument from silence *against* the event, but *for* Homer's selectivity.

  **3. The Prosecutor's Challenge: Steelmanning Both Sides**  
  - **Prosecutor's View (Stronger Argument = 2.120):**  
    "Herodotus' rational critique is devastating: No rational king sacrifices sons indefinitely over a guest's wife. The war's duration makes Priam's refusal absurd if Helen was present. The Homeric analysis is speculative decoration—the real proof is psychological realism."  
  - **Herodotean Defense (Integrated Argument):**  
    "2.120 *alone* is a thought experiment. Without 2.116, it's just Herodotus speculating. 2.116 provides *evidence* that the alternative tradition existed early (via Homer) and came from Egypt (via priests). The plausibility argument (2.120) explains *why* the Greeks (including Homer) suppressed it: a 10-year war over an absent woman is narratively unsatisfying. The texts + logic + foreign testimony *together* make the case."  
  **Verdict:** The prosecutor prioritizes abstract logic; Herodotus values *corroboration* across sources and cultures.

  **4. The Double Standard? Poet as Selective Witness**  
  Herodotus has a **principled distinction**, foundational to source criticism:  
  - **Incidental Details:** Reliable.  
    (e.g., Sidon robes, Egyptian drugs, Menelaus' route).  
    *Why?* They serve no narrative agenda. They're "unconscious testimony"—details preserved precisely because they weren't important to the plot.  
  - **Core Narrative Elements:** Suspect.  
    (e.g., Helen in Troy, causes of war).  
    *Why?* Shaped by poetic needs (national pride, drama, divine machinery). Hence "if the poets are to be believed" hedges the *Trojan War story*, not the geographic/ethnographic tidbits.  

  **Modern Parallels:**  
  - Historians still use "incidental details" in fiction/art as historical evidence (e.g., Dickens on London slums).  
  - **Concepts:**  
    - "**Unintentional Evidence**" (Collingwood).  
    - "**Horizon of the Text**" (what the author takes for granted).  
    - "**Source Criticism**" (assessing reliability based on purpose/context).  

  **Discussion Prompts for Your Group:**  
  1. *Herodotus the Lawyer:* Would his combined evidence (priests + Homer + logic) hold up in your prosecutor friend's court? What's the "burden of proof" for ancient history?  
  2. *Silence as Evidence:* Is Homer's *omission* of Egypt stronger proof he knew the story than if he'd mentioned it?  
  3. *Rationalism vs. Tradition:* Which feels more "modern"—Herodotus' textual analysis or his psychological argument?  
  4. *Translation Nuance:* Godley's "if the poets are to be believed" (2.120) – the Greek (*εἰ μέν νυν δεῖ ποιητῇσι χρεώμενον λέγειν*) implies "*if one must speak relying on poets*." Does this soften the hedge?  

  Herodotus is doing something revolutionary here: cross-examining Homer, valuing foreign sources, and applying rational skepticism *within* a tradition he respects. It’s not airtight—but it’s the birth of historical method. Your group is tackling one of the most fascinating passages in the *Histories*!
