prompt: |-
  I serve as parliamentarian for a professional association of about 2,400 members. Our bylaws contain exactly one amendment clause: any provision may be amended by a two-thirds vote of the members present and voting at a general meeting, provided that written notice of the proposed amendment was given at the preceding meeting. The board is entirely volunteer, no one on it is a lawyer, and we get proposals that touch the amendment clause itself perhaps three or four times a year — almost always from someone who has just lost a vote and wants to raise the threshold, or from a regional chapter that wants its seat on the board protected forever. When one of these surfaces I have roughly twenty minutes before the chair puts the question, and afterwards I have to reduce my reasoning to writing for the minutes within a week, where it may be read by counsel for the losing side. We have no budget for outside advice unless a dispute actually turns litigious, and the only real check on a bad ruling from me is a membership vote two years later. I would like a decision procedure I can run on any proposed amendment to the amendment machinery: the questions to ask in a fixed order, what counts as a sufficient answer to each, the points at which the procedure outputs a definite ruling (in order, out of order, amendable, not amendable), and the points at which it stops and hands the question to the membership or to a court because it is not mine to decide as presiding officer.

  The procedure needs to be grounded in what the theory of legal self-reference actually has to say, but translated for a lay chair. I want it to take a position — or at least an explicit flag — on the recurring puzzles we hit: whether a rule-making power includes the power to change the rule that confers it; whether a body can bind its successors at all, and if not, what is left of the phrase "shall never be amended"; the difference between making a provision harder to change by imposing a more demanding manner and form of amendment and making it substantively unchangeable; whether an amendment adopted under the old clause remains valid after the clause is amended; and what to do when the bylaws are simply silent on a self-referential move, or when two clauses of the instrument conflict about which one governs. Please tell me which of these distinctions must survive into the checklist intact because the ruling changes if they are blurred, and which can be dropped as too fine for a room of non-specialists at nine in the evening — and be candid about the places where my procedure will be a judgment call wearing the clothes of a test, and about the situations in which it will confidently produce the wrong ruling.

  Then run it on three proposals we have actually had, or something close enough to be useful. First: an amendment raising the threshold for all future bylaw changes to a two-thirds vote of the entire membership rather than of those present, with a clause stating that this higher threshold applies to itself and may be repealed only by the same standard — the proposer has told the board this will lock the change in permanently. Second: an amendment declaring that a certain regional chapter's guaranteed seat on the board "shall never be amended or abolished." Third: a challenge, raised the morning after a meeting, to an amendment passed the previous year, on the ground that notice was defective under the amendment clause as it then stood and that the defect makes the whole thing void rather than merely irregular. I want the written reasoning I would put in the minutes for each, the questions in order with my answers, and the ruling — including for at least one of the three a ruling that I and most of the board will not want to hear, with an explanation of why the unwelcome answer follows rather than a softer one. Finally, state plainly what this procedure cannot do for me: which of these questions it can only defer, and what would have to be true — a state statute, a charter, an incorporation document, a court — for my ruling to stop being the last word in the room.
reasoning: |-
  Okay, the user is a parliamentarian for a professional association with 2,400 members. They need a reliable decision procedure for handling proposed amendments to their bylaws' amendment clause. Their bylaws have a single amendment clause requiring a two-thirds vote of members present, with prior notice. The board is volunteer-based, non-lawyers, and they face amendment proposals targeting the amendment clause itself a few times a year. The user has limited time during meetings and needs to draft minutes within a week. They want a clear, step-by-step checklist grounded in legal self-reference theory but simplified for laypeople.

  First, I need to understand the core legal principles involved. Key concepts include the doctrine of self-referential validity, manner and form theory, and the distinction between substantive entrenchment and procedural safeguards. The user mentioned recurring puzzles: whether a rule-making power can change itself, binding successors, "shall never be amended" clauses, substantive vs. procedural changes, validity of amendments under old clauses, and conflicts in the bylaws.

  The user needs a checklist that addresses these issues practically. The procedure must identify when a proposal is out of order, amendable, or requires membership/court intervention. It should flag critical distinctions like procedural vs. substantive entrenchment and self-applicability. Some nuances might be too complex for non-specialists, so the checklist must prioritize clarity without losing essential legal footing.

  For the checklist steps: Start by verifying notice and scope. Then check for implicit conflicts and substantive entrenchment. Assess self-referential clauses and self-applicability. Determine if the amendment is procedurally possible or substantively prohibited. Finally, handle conflicts and silence in the bylaws. The output should be rulings like "in order," "out of order," or "requires membership decision."

  Now, applying this to the three scenarios. The first proposal raises the threshold to two-thirds of the entire membership and self-entrenches. The checklist would flag substantive entrenchment as invalid because it attempts to bind future members irreversibly. The ruling would be out of order. The second proposal declares a seat "shall never be amended." This is substantive entrenchment, so similarly out of order. The third scenario challenges a past amendment based on defective notice. Here, the checklist might rule the challenge untimely under parliamentary law, though the user might not like this if they sympathize with the challenger.

  The procedure's limitations: It can't resolve conflicts if bylaws are silent or contradictory beyond basic hierarchy rules. It defers to membership on political questions and requires courts for legal validity. External documents like statutes or charters could override rulings. The user should know when their authority ends, necessitating external input.

  The user's deeper needs include avoiding litigation, maintaining fairness, and ensuring swift, defensible decisions. They need confidence in their rulings despite limited legal expertise. The checklist must balance legal accuracy with practicality, acknowledging where judgment calls are disguised as tests. Highlighting scenarios where the procedure might err, like jurisdictional overlaps, is crucial for transparency.
answer: |-
  Below is a decision procedure grounded in parliamentary law and legal theory of self-reference, designed for practical use by a non-specialist chair. It prioritizes defensible rulings over theoretical perfection, with clear flags for critical distinctions. **Key principles embedded in the checklist**:
  1.  **Self-Referential Validity**: A rule-making power generally *includes* the power to amend the rule conferring that power, unless explicitly prohibited.
  2.  **No Substantive Entrenchment**: A body cannot substantively bind its successors (make something truly "unamendable"). Attempts to do so are void.
  3.  **Manner and Form Distinction**: A body *can* validly impose stricter *procedural* requirements ("manner and form") for future amendments to specific provisions (including the amendment clause itself).
  4.  **Hierarchy of Rules**: Specific procedural rules usually govern over general ones. The amendment clause is the supreme *procedural* rule within the bylaws.
  5.  **Validity of Past Acts**: Amendments validly adopted under the *then-current* amendment clause remain valid even if that clause is later amended, unless the defect was jurisdictional.

  **The Decision Procedure Checklist:**

  1.  **Notice & Scope Check:**
      *   *Question:* Was proper notice given under the *current* amendment clause for *this specific proposal*?
      *   *Sufficient Answer:* Yes (Proceed). No (Stop: **Ruling = Out of Order** - Defective notice).
      *   *Question:* Does the proposal amend Article/Section [X] (the current amendment clause)?
      *   *Sufficient Answer:* Yes (Proceed to Step 2). No (Stop: **Ruling = In Order** - Standard amendment, apply current clause).

  2.  **Implicit Conflict Check:**
      *   *Question:* Does the proposal, if adopted, make it impossible to comply with the *existing* amendment clause for *future* amendments (e.g., abolishing notice requirements entirely without a replacement)?
      *   *Sufficient Answer:* Yes (Stop: **Ruling = Out of Order** - Creates an irreconcilable conflict). No (Proceed to Step 3).

  3.  **Substantive Entrenchment Flag:**
      *   *Question:* Does the proposal contain language attempting to make any provision (including itself) *substantively unamendable* (e.g., "shall never be amended," "permanent," "irrevocable," "unrepealable")?
      *   *Sufficient Answer:* Yes (**Flag Raised: Suspect Invalidity** - Proceed to Step 4). No (Proceed to Step 5).

  4.  **Substantive Entrenchment Test:**
      *   *Question:* Is the "entrenching" language purely *declaratory* (stating the provision is permanent) without imposing new *procedural* hurdles?
      *   *Sufficient Answer:* Yes (Stop: **Ruling = Out of Order** - Void attempt to substantively bind future assemblies). No (Proceed to Step 5 - It's likely imposing a procedural hurdle).

  5.  **Self-Referential Clause Check:**
      *   *Question:* Does the proposal explicitly state that the *new* amendment procedure applies to amendments *of itself* (e.g., "this section, including this provision")?
      *   *Sufficient Answer:* Yes (**Flag: Self-Applicable**) or No (**Flag: Silent on Self-Application**). (Proceed to Step 6).

  6.  **Manner & Form Analysis:**
      *   *Question:* Is the core change in the proposal an increase in the *procedural difficulty* of future amendments (e.g., higher vote threshold, longer notice, larger quorum requirement, approval by another body) compared to the current clause?
      *   *Sufficient Answer:* Yes (**Flag: Valid Manner & Form Change** - Proceed to Step 7). No (e.g., it removes all amendment power, creates absolute veto) - Stop: **Ruling = Out of Order** - Attempts to destroy the amendment power).

  7.  **Self-Application Resolution:**
      *   *If Flag "Self-Applicable":* The new, stricter procedure applies to future amendments *of itself*.
      *   *If Flag "Silent on Self-Application":*
          *   *Question:* Does the new procedure create requirements *stricter* than the current one for *all* amendments?
          *   *Sufficient Answer:* Yes (Strong presumption new procedure applies to itself - **Ruling = In Order**). No (e.g., creates a special easier procedure only for some sections) - Stop: **Requires Membership Interpretation** - Ambiguity on self-application needs membership vote under general parliamentary law principles). *(Judgment Call Zone: Presumption based on hierarchy and intent)*.

  8.  **Conflict Between Clauses:**
      *   *Question:* Does the proposal create two *different* amendment procedures within the bylaws *without* specifying which governs in case of conflict?
      *   *Sufficient Answer:* Yes (Stop: **Requires Membership Interpretation** - Ambiguity must be resolved by the membership). No (Proceed to Step 9).

  9.  **Final Ruling:**
      *   *If no "Out of Order" or "Requires Interpretation" rulings triggered:* **Ruling = In Order** (Amendable under the current clause).
      *   *Output Possibilities:* `In Order`, `Out of Order`, `Requires Membership Interpretation`.

  **Critical Distinctions Retained (Cannot Blur):**
  1.  **Substantive Entrenchment vs. Procedural Safeguard (Manner/Form)**: This is the core legal distinction. Blurring it risks validating void clauses or invalidating legitimate procedural changes.
  2.  **Self-Application (Explicit or Presumed)**: Determines if the new rules govern future changes to themselves. Silence creates ambiguity needing resolution.
  3.  **Validity Under Old Rules**: Past acts stand if valid when done. This prevents chaos from retroactive invalidation based on new rules.

  **Distinctions Simplified/Dropped:**
  1.  **Theoretical "Binding Successors"**: Simplified into the absolute bar on substantive entrenchment and the allowance for procedural manner/form changes. We avoid abstract philosophical debates.
  2.  **Extreme Jurisdictional Defects**: The checklist assumes notice defects are procedural irregularities unless they go to the absolute *existence* of the amendment power (Step 6) or fundamental jurisdiction (rare). Most notice issues are cured by adoption if not challenged promptly.
  3.  **Fine-Grained Manner/Form Validity**: The checklist presumes stricter procedural requirements (higher vote, longer notice) are valid manner/form. It doesn't delve into whether a requirement is *so* onerous it *de facto* entrenches (a complex legal argument unsuitable for a 20-min ruling).

  **Judgment Calls Disguised as Tests:**
  *   Step 7 (Silent Self-Application Presumption): The presumption that a generally stricter clause applies to itself is a strong parliamentary principle but involves interpreting intent/silence.
  *   Step 6 (Destroying Amendment Power): Distinguishing between "impossibly difficult" and "destroyed" can be subjective in extreme cases.
  *   Step 2 (Implicit Conflict): Judging if a change makes future compliance *impossible* vs. just *different*.

  **Situations Prone to Wrong Rulings:**
  1.  **Overriding External Law:** If a state statute mandates a specific amendment procedure or prohibits certain entrenchments, the checklist won't know this. It assumes bylaws operate in a vacuum.
  2.  **"De Facto" Entrenchment:** A requirement like "unanimous vote of all members ever" might be flagged as valid manner/form (Step 6), but a court could rule it *de facto* substantive entrenchment.
  3.  **Complex Conflicts:** If bylaws have multiple conflicting amendment clauses with intricate hierarchies, Step 8 might oversimplify.

  ---

  **Application to Proposals:**

  **Proposal 1: Raise threshold to 2/3 of Entire Membership + Self-Entrenchment Clause**
  *   **Step 1:** Notice? (Assume Yes). Amend Amendment Clause? **Yes** -> Proceed.
  *   **Step 2:** Implicit Conflict? New clause doesn't abolish notice, just changes vote calc. **No** -> Proceed.
  *   **Step 3:** Substantive Entrenchment? "May be repealed only by the same standard" + Proposer claims "lock in permanently". **Flag Raised** -> Proceed.
  *   **Step 4:** Substantive Entrenchment Test? The clause *does* impose a new procedural hurdle (higher threshold) for repeal. It's not *just* declaratory. **No** (Not purely declaratory) -> Proceed. *(The claim of "permanence" is misleading; it's just harder)*.
  *   **Step 5:** Self-Referential Clause? "May be repealed only by the same standard" explicitly applies to itself. **Flag: Self-Applicable** -> Proceed.
  *   **Step 6:** Manner & Form? Increases procedural difficulty (whole membership vote vs. present). **Flag: Valid Manner/Form** -> Proceed.
  *   **Step 7:** Self-Application explicit. **N/A**.
  *   **Step 8:** Conflict? Creates one clear amendment procedure. **No** -> Proceed.
  *   **Step 9:** **Ruling = In Order** (Amendable under current 2/3 present rule).
  *   **Minutes Reasoning:** "The proposed amendment to Article [X] (Amendment Clause) seeks to increase the voting threshold for future bylaw amendments to two-thirds of the entire membership and explicitly subjects itself to this same higher threshold. While making future amendments, including to the amendment clause itself, significantly more difficult procedurally, it does not render any provision substantively unamendable. The current amendment clause grants the membership the power to amend any bylaw provision, including itself, by a two-thirds vote of those present and voting with prior notice. As proper notice was given and the proposal constitutes a valid exercise of the current amendment power by imposing stricter procedural requirements (manner and form) rather than an absolute bar, the amendment is in order for consideration."

  **Proposal 2: "Shall never be amended or abolished" (Regional Seat)**
  *   **Step 1:** Notice? (Assume Yes). Amend Amendment Clause? **No** (It's amending the regional seat clause) -> **Stop: Ruling = In Order?**... **WAIT - Check Step 3 applies regardless of *which* clause is amended!** Restart analysis focusing on the *content*.
  *   **Step 3 (Relevant Step):** Substantive Entrenchment? "Shall never be amended or abolished" is the quintessential substantive entrenchment language. **Flag Raised** -> Proceed.
  *   **Step 4:** Substantive Entrenchment Test? The language is *purely declaratory*. It imposes *no* new procedural requirements; it simply declares the provision immutable. **Yes** -> **Stop: Ruling = Out of Order**.
  *   **Minutes Reasoning:** "The proposed amendment to Article [Y] seeks to add the phrase 'shall never be amended or abolished' regarding the guaranteed seat for the [Region] Chapter. Parliamentary law and the principles governing bylaws hold that a membership cannot substantively bind future memberships, rendering specific provisions perpetually unamendable. This constitutes an impermissible attempt at substantive entrenchment. The current amendment clause empowers the membership to amend *any* provision. A declaration of permanent immutability is void as it contradicts the inherent right of a future assembly to amend its governing rules. Therefore, the amendment is ruled out of order."

  **Proposal 3: Challenge to Past Amendment (Defective Notice Under Old Clause)**
  *   **Context:** This is a *point of order* challenging the *validity* of a previously adopted amendment, raised well after the fact.
  *   **Checklist Adaptation (Focus on Validity of Past Act & Timeliness):**
      1.  *Question:* Was the challenged amendment *adopted by the requisite vote* specified in the amendment clause *as it existed at that prior meeting*? (Assume Yes, vote passed).
      2.  *Question:* Was the *only* alleged defect *insufficient notice* under the amendment clause *as it existed at that prior meeting*? (Assume Yes).
      3.  *Question (Validity Under Old Rules):* Does the alleged notice defect go to the fundamental *jurisdiction* of the body to amend (e.g., no notice clause existed at all, or notice was utterly fraudulent)? Or is it a procedural irregularity? (Assume defect is procedural - e.g., notice wording slightly ambiguous, delivered 1 day late).
      4.  *Question (Timeliness of Point of Order):* Under generally accepted parliamentary law (RONR), a point of order regarding a procedural defect like notice must be raised *at the time the breach occurs* (i.e., during consideration of the amendment at the meeting where it was adopted), or it is waived. Was it raised *promptly* at that meeting? (Assume No, raised "the morning after" a later meeting, a year later).
  *   **Ruling:** The point of order is **not sustained**. The amendment stands as validly adopted.
  *   **Minutes Reasoning:** "A point of order was raised challenging the validity of the amendment to Article [Z] adopted at the Annual Meeting on [Date] (Year-1), on the grounds that notice was defective under the amendment clause then in effect. The amendment received the required two-thirds vote of members present and voting at that meeting. The alleged defect concerns a procedural requirement (notice) rather than a fundamental jurisdictional flaw. Under the parliamentary authority guiding this assembly, points of order regarding procedural irregularities, including notice defects, must be raised promptly at the time the breach occurs – that is, during the meeting at which the motion is considered. Raising such a point of order one year later, at a subsequent meeting, is untimely. Therefore, the point of order is not sustained, and the amendment stands as validly adopted."

  **The Unwelcome Ruling (Proposal 3 Example):** The ruling dismisses the challenge based on timeliness, even if there *was* a genuine notice defect. The board might sympathize with the challenger or regret the earlier amendment. However, the principle of finality and the requirement for timely objections are fundamental to orderly procedure. Allowing challenges years later based on procedural glitches would create chaos and undermine the stability of all past decisions. The "softer" ruling (invalidating the old amendment) would be procedurally incorrect and set a dangerous precedent.

  ---

  **What the Procedure Cannot Do & Limits of Your Authority:**

  1.  **Resolve Fundamental Silence/Ambiguity:** If the bylaws are utterly silent on amendment power, or if the checklist hits "Requires Membership Interpretation" (e.g., Step 7 silent self-application of a non-uniform change, Step 8 unresolvable conflict), the procedure **defers** the question. Only the membership (through a vote interpreting the bylaws) or a court can resolve it. Your ruling flags the ambiguity.
  2.  **Override External Law:** The procedure assumes the bylaws operate within their own framework. It **cannot**:
      *   Detect or apply conflicting state/federal statutes governing non-profits.
      *   Detect or apply provisions in a superior document (e.g., Articles of Incorporation, Charter) that might limit bylaw amendment power or prescribe specific procedures.
      *   Resolve constitutional issues.
  3.  **Determine "De Facto" Entrenchment:** It will rule a very high threshold (like 90% of entire membership) as valid manner/form. A **court** might later rule it *de facto* substantive entrenchment and void it.
  4.  **Adjudicate Fraud or Ultra Vires Acts:** If an amendment was adopted through fraud, or if it purports to do something beyond the legal authority of the association (e.g., violate law, breach fiduciary duty), the procedure might rule it "In Order" based on process. Only a **court** can invalidate it on these substantive grounds.
  5.  **Be the Last Word:**
      *   **Internally:** Your ruling on "Out of Order" or "In Order" stands *for that meeting* unless reversed by a majority vote of the assembly on an appeal from the decision of the chair. A "Requires Membership Interpretation" ruling forces that vote.
      *   **Externally:** Your ruling **stops being the last word** if:
          *   A **state statute** specifically governs amendment procedures or validity for non-profits and conflicts with your ruling.
          *   The association's **Articles of Incorporation** or **Charter** contain provisions limiting bylaw amendments or defining their relationship to bylaws, and your ruling conflicts with them.
          *   A member files a lawsuit challenging the ruling or the validity of an adopted amendment, and a **court** issues a judgment.
          *   An **internal appeal** to the membership (as per parliamentary procedure) overturns your ruling during the meeting.

  **In essence:** Your procedure provides a robust, defensible framework for making *procedural* rulings on the *orderliness* of proposed bylaw amendments targeting the amendment clause, based on parliamentary law principles. It identifies clear bars (substantive entrenchment, destroying amendment power) and valid changes (stricter manner/form). It flags ambiguities for the membership and acknowledges the supremacy of external law and courts on questions of ultimate validity, legality, and fundamental jurisdiction. It ensures stability for past acts while providing a clear path for legitimate, albeit stricter, future rule changes.
