prompt: |-
  In the literature on the evolution of cooperation there is a dispute that has run for decades without either side conceding, and I want a diagnosis of it rather than a survey. One side holds that the indefinitely repeated prisoner's dilemma explains cooperation: if the shadow of the future is long enough, reciprocal strategies of the tit-for-tat family are robust, mutual cooperation becomes self-enforcing, and the practical lesson is to make interactions repeatable and partners identifiable. The other side replies that this is close to vacuous, because the folk theorem says that when players are patient enough, any feasible payoff profile that leaves each player strictly better off than the level they can guarantee themselves by punishing their opponent — their minmax payoff — can be sustained as an equilibrium, mutual defection included; repetition therefore tells us which outcomes are possible, not which will be reached, and the explanatory work must be done elsewhere: equilibrium selection, trembles and implementation error, population structure, cultural evolution. Meanwhile the first side keeps producing tournament results and keeps being cited by people designing institutions and treaties.

  My hypothesis, which I want you to test rather than accept: this is not a factual disagreement but two different questions being answered under one heading — one about the stability of cooperation once it is in place, the other about which outcome gets reached in the first place — with a further, largely verbal strand about what counts as an explanation of cooperation. Say whether that is right or too tidy. Specifically: what is each side actually committed to; does the tournament evidence bear on the folk-theorem objection at all, given that a tournament fixes the pool of entrants in advance and thus assumes away selection; and is the noisy-repeated-game literature a genuine resolution or just a restatement of the selection problem in new notation? Then tell me what would count as progress for someone who wants to spend the next few years here — a distinction, a formal result, a change of question, or a reason to expect none — and be explicit throughout about which parts of your diagnosis are settled among people who work on repeated games and which remain genuinely contested. I do not want your preferred reading presented as the consensus.
reasoning: |-
  Okay, let me try to unpack this user's query. They’re deeply involved in the evolution of cooperation literature, specifically the debate around the repeated Prisoner's Dilemma versus the folk theorem critique. Their hypothesis is that this isn’t a factual dispute but two different questions being conflated: stability versus emergence. They want me to test this, not just accept it.

  First, I need to map out both sides clearly. The pro-repetition side focuses on how cooperation can be sustained once established, using tit-for-tat strategies and tournaments like Axelrod’s. The folk theorem side argues that repetition allows multiple equilibria, including defection, so it doesn’t explain how cooperation emerges. 

  The user mentions tournament evidence. I should assess whether these tournaments actually address the folk theorem critique. Tournaments pre-select strategies, so they don’t solve the equilibrium selection problem. They show cooperation’s stability among certain strategies but not its emergence from all possibilities. That’s a key point.

  Noisy games add implementation errors. While this makes models more realistic, it doesn’t resolve selection; it just shifts the problem to which strategies are robust to noise. So it’s a restatement, not a solution. The user’s hypothesis seems solid here—stability vs. emergence are distinct.

  Next, commitments: The repetition advocates are committed to cooperation’s stability under reciprocity. The critics insist on explaining why cooperation over defection is selected. The definition of "explanation" is central—whether stability suffices or if emergence is needed.

  For progress, the user wants actionable research directions. Distinctions between stability and emergence are crucial. Formal results on selection dynamics, like evolutionary models or network structures, could help. Changing the question to focus on mechanisms driving selection might move the field forward. Some might see no resolution possible due to inherent multiplicity, but that’s pessimistic.

  I need to clarify which parts are settled and which are contested. It’s accepted that repetition enables cooperation but not why it’s selected. Equilibrium selection remains genuinely contested. The user emphasized not presenting my view as consensus, so I’ll mark contested areas explicitly.

  The user’s depth suggests they’re a researcher or grad student planning to work on this. Their frustration with the stalled debate is clear. They might need a fresh angle, like combining behavioral experiments with institutional design to test selection mechanisms. Highlighting unsettled areas gives them targets for contribution.
answer: |-
  Your hypothesis is fundamentally sound but requires refinement to capture the nuance of the dispute. The core disagreement is indeed about **what constitutes an adequate "explanation" for cooperation**, compounded by a conflation of **stability** (maintenance) and **emergence** (selection) dynamics. However, it is not *merely* verbal; it exposes methodological and philosophical fissures in evolutionary game theory. Below is a diagnosis addressing your specific queries.

  ---

  ### **1. What Each Side Is Committed To**
  #### **Pro-Repeatability Side (e.g., Axelrod, institutional designers)**
  - **Core Commitment**: Repetition + identifiability *enables* cooperation by making reciprocity feasible.  
  - **Claims**:  
    - Tit-for-tat (TFT) and its variants are *behaviorally robust*: they perform well against diverse strategies in simulations/experiments.  
    - Mutual cooperation is a *stable equilibrium* under reciprocity if the discount factor δ is sufficiently high.  
    - **Practical Implication**: Designing institutions to extend the "shadow of the future" (e.g., via repeated interactions) is a sufficient policy lever for cooperation.  
  - **Limits**: Does not claim repetition *inevitably* leads to cooperation, only that it *permits* it as a stable outcome.

  #### **Folk-Theorem Critics (e.g., Binmore, Sugden, epistemic game theorists)**
  - **Core Commitment**: Repetition alone is *explanatorily empty* for *why* cooperation arises.  
  - **Claims**:  
    - The folk theorem shows *all* individually rational payoffs (including mutual defection) are equilibria. Repetition explains *possibility*, not *selection*.  
    - Equilibrium selection requires additional mechanisms (e.g., social norms, learning dynamics, population structure).  
    - Tit-for-tat is not evolutionarily stable: mutants like "Always Cooperate" can invade it.  
  - **Limits**: Does not deny repetition is necessary; argues it is insufficient without selection criteria.

  ---

  ### **2. Does Tournament Evidence Address the Folk-Theorem Objection?**  
  **No.** Tournaments (e.g., Axelrod’s) **assume a fixed strategy set**, pre-specifying entrants (e.g., TFT, Pavlov, Always Defect). This:  
  - Demonstrates **robustness within a constrained ecology** but ignores the full strategy space.  
  - Fails to test **equilibrium selection**: The tournament’s outcome depends entirely on the initial pool. If "Always Defect" dominates the pool, cooperation fails.  
  - **Settled Insight**: Tournaments show TFT can *sustain* cooperation against plausible competitors but not *why* cooperative strategies arise initially. Critics rightly note this does not resolve the selection problem.  

  ---

  ### **3. Is the Noisy-Game Literature a Resolution or Restatement?**  
  **Largely a restatement in new notation.** Introducing noise (implementation errors) leads to:  
  - **New equilibria**: Generous TFT (GTFT) or Win-Stay-Lose-Shift outperform TFT when errors exist.  
  - **But**: It replaces the "pure" equilibrium selection problem with a **robustness selection problem**. GTFT is stable *if* the population adopts error-tolerant strategies, but noise alone doesn’t explain *how* this norm emerges.  
  - **Contested**: Whether noise *resolves* selection (by making cooperative strategies more robust) or *reframes* it (by requiring dynamics that favor error-tolerant norms).  

  ---

  ### **4. What Counts as Progress?**  
  Resolving the dispute requires **distinguishing stability from emergence** and **specifying selection mechanisms**. Concrete avenues:  

  #### **A. Formal Distinctions**  
  - **Stability**: "Cooperation is stable if δ > δ* and agents use reciprocal strategies."  
  - **Emergence**: "Cooperation emerges if [mechanism X] selects reciprocal strategies from all possible equilibria."  
    *Settled*: Repetition enables stability. *Contested*: What drives emergence.  

  #### **B. Selection Mechanisms (Genuine Progress)**  
  Progress demands models where **cooperation is selected *despite* equilibrium multiplicity**:  
  - **Evolutionary Dynamics**: Formalize how adaptive learning (e.g., replicator dynamics) favors reciprocal strategies.  
    - *Example*: Show that TFT dominates in well-mixed populations only under specific initial conditions.  
  - **Institutional Design**: Embed equilibrium selection into policy (e.g., "seeding" cooperation via commitment devices).  
  - **Network Effects**: Prove that spatial structure (e.g., graphs) or partner choice reliably selects cooperation.  
    - *Contested*: Whether network reciprocity is distinct from repetition or a subset.  

  #### **C. Change of Question**  
  Shift focus: "Under what *ecological and epistemic conditions* do cooperative equilibria dominate?"  
  - **Behavioral Foundations**: Integrate bounded rationality (e.g., agents with limited memory).  
  - **Cultural Evolution**: Model norms that bias selection toward reciprocity (e.g., via group competition).  

  #### **D. Why Progress May Stall**  
  If the dispute is truly about **explanatory standards**, it may persist:  
  - **Stability-Focused**: "Enabling cooperation is sufficient explanation."  
  - **Emergence-Focused**: "We must explain *why* cooperation, not defection, is selected."  
    No formal result can bridge this gap without philosophical agreement.  

  ---

  ### **Settled vs. Contested**  
  | **Aspect**                          | **Settled**                          | **Genuinely Contested**                  |  
  |-------------------------------------|--------------------------------------|------------------------------------------|  
  | Repetition enables cooperation      | Yes (via folk theorem & TFT stability) | —                                        |  
  | Repetition explains emergence       | No                                    | Whether it *contributes* to emergence    |  
  | Equilibrium multiplicity            | Accepted by both sides               | How to resolve it                        |  
  | Tournaments demonstrate robustness  | Yes                                   | Relevance to real-world selection        |  
  | Noise affects strategy performance  | Yes                                   | Whether noise *solves* selection         |  

  ---

  ### **Conclusion**  
  Your hypothesis is correct: **the dispute conflates the conditions for cooperation’s stability with the mechanisms for its emergence**. The "pro-repetition" side answers "How can cooperation persist?" while critics demand "Why does cooperation arise over defection?" Tournament evidence is irrelevant to selection, and noisy games refine but do not resolve the core problem.  

  **For a researcher**: Prioritize formalizing **equilibrium selection dynamics** (e.g., evolutionary models with endogenous strategy generation) or **institutional mechanisms** that bias outcomes toward cooperation. Until selection is rigorously modeled, the dispute will remain a dialogue of the deaf, sustained by differing definitions of "explanation." The path forward is not to declare one side victor but to disambiguate the questions each can legitimately answer.
