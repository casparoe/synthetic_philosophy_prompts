answer: |-
  Here are the desiderata for an account of historical contingency, structured as requested. This framework aims to be rigorous and distinguish core requirements from contested preferences.

  ### I. Desiderata: What an Account *Must* Do/Explain

  1.  **Explain the Core Phenomenon:** Account for the *intuition and evidence* that some historical outcomes could plausibly have been otherwise, even holding major antecedent conditions relatively fixed.
  2.  **Handle Genuine Micro-Contingency:** Explain and validate at least one clear historical case where a highly specific, seemingly trivial event (like Cleopatra's nose, a single messenger's delay, a minor tactical error) demonstrably altered a macro-historical outcome *in a significant way* (e.g., the outcome of a pivotal battle, the succession of a ruler, the triggering of a major war). *[Non-Negotiable]*
  3.  **Handle Spurious Micro-Contingency:** Explain and invalidate at least one case where a similar claim of "turning on a trivial event" is asserted (e.g., "If only Gavrilo Princip had missed!"), but where the evidence strongly suggests the *type* of outcome (e.g., a major European war) was highly probable or structurally overdetermined, even if the *specific trigger/timing* was contingent. The account must distinguish why the *outcome type* wasn't contingent here, unlike in (2). *[Non-Negotiable]*
  4.  **Explain Robust Convergence:** Account for cases of robust convergence or independent invention (e.g., agriculture, writing, state formation, specific technologies like pyramids or movable type occurring independently multiple times) without negating contingency. The account must explain why these outcomes appear *less* contingent on specific antecedent paths than the cases in (2) or the divergent outcomes implied by (1). *[Non-Negotiable]*
  5.  **Maintain Key Distinctions:**
      *   **Determinism vs. Unpredictability:** Clearly distinguish between *ontological determinism* (the outcome was physically inevitable given antecedent conditions + laws) and *epistemic unpredictability* (we could not, even in principle with perfect knowledge, have predicted it due to complexity, sensitivity, or lack of data). An account can embrace unpredictability without denying determinism, or embrace indeterminism. *[Non-Negotiable]*
      *   **Sensitivity vs. Importance:** Distinguish between an outcome being *sensitive* to small perturbations (a hallmark of chaotic systems) and that outcome being genuinely *historically important* or transformative. Not all sensitive outcomes are important, and important outcomes might not be highly sensitive. *[Non-Negotiable]*
      *   **Contingency of Type vs. Token/Route/Timing:** Distinguish between:
          *   *Type-Contingency:* The emergence of a *kind* of phenomenon (e.g., democracy, industrialization) was contingent – it might not have happened at all, or happened very differently.
          *   *Token-Contingency:* The *specific instance* or *precise form* of a phenomenon was contingent (e.g., *which* democracy emerged *where* and *when*).
          *   *Route/Timing Contingency:* The *pathway* by which an outcome was reached, or its *timing*, was contingent, even if the outcome type itself was robust or convergent. *[Non-Negotiable]*
  6.  **Respect Established Results:** Be compatible with, or at least not contradict, well-established findings about sensitive dependence in complex systems (e.g., chaotic dynamics in weather, ecology, some economic models) and path dependence in social systems (e.g., technological standards, institutional development). *[Non-Negotiable]*

  ### II. Desiderata: What an Account *Should* Do (Preferences/Aspirations)

  7.  **Provide a Measure of Contingency (Candidate Requirement):** Underwrite *some* notion of a *graded measure* of contingency (e.g., "Outcome O was highly contingent on event E under description D"). Crucially, **this measure should not be maximal for all outcomes everywhere.** It should be capable of distinguishing *degrees* of contingency (e.g., the Napoleonic Wars vs. the rise of photosynthesis). *[Preference/Working Idea - Requires Scrutiny]*
  8.  **Articulate the Role of Description:** Explicitly incorporate the idea that judgments of contingency are often relative to a chosen *scale or level of description* (e.g., "the fall of the Roman Empire" vs. "the sack of Rome in 410 AD"). An account should explain how contingency might manifest differently at different scales. *[Strong Preference]*
  9.  **Link Contingency to Causation/Explanation:** Integrate the account of contingency with a broader theory of historical causation and explanation, clarifying how contingent events fit into causal narratives. *[Preference]*

  ### III. Analysis of Requirements

  *   **Non-Negotiables (1-6):** These define the core explanatory task. Failure on any of these renders the account inadequate for handling the agreed-upon phenomena and distinctions central to the philosophical debate. (2) and (3) together prevent accounts from being either universally dismissive or universally accepting of micro-contingency claims. (4) blocks accounts that make all large-scale outcomes seem contingent. (5) is essential for conceptual clarity.
  *   **Preferences (7-9):** These represent desirable features, often reflecting specific theoretical ambitions (e.g., quantification, multi-scale analysis, integration with causation). Failure here might make an account less powerful or satisfying but not necessarily invalid.
  *   **The "Measure" Requirement (7) Under Scrutiny:**
      *   **Survival:** The requirement that a measure not be maximal everywhere **survives scrutiny as a *desideratum*.** An account where *everything* is maximally contingent is explanatorily vacuous and fails desiderata (3) and (4). We need differentiation.
      *   **Challenge:** *Implementing* a non-maximal measure robustly is the hard part. It requires grounding contingency in something that *varies* (e.g., robustness of attractors, strength of path dependence, density of possible paths leading to similar outcomes). The "three-place relation" (Cause-Outcome-Description) is a promising framework for this, as the description level directly impacts what counts as "the same" outcome (addressing (8)).
  *   **Joint Unsatisfiability:** While the core (1-6) are jointly satisfiable, **adding a strong interpretation of (7) *might* conflict with strict interpretations of determinism.** If the universe is truly deterministic at the fundamental level, then *ontologically*, no outcome is contingent – it was always the only possibility. An account satisfying strict determinism might struggle to provide a non-trivial *ontological* measure of contingency (though it could still provide epistemic or pragmatic measures based on unpredictability or counterfactual fragility). This tension highlights the importance of distinction (5a).
  *   **The Single Most Excluding Requirement:** **Requirement (4) - Explain Robust Convergence.** This is the primary stumbling block for many strong contingency/chaos-centric accounts (e.g., those emphasizing "Cleopatra's Nose" dynamics universally). Accounts that portray history as fundamentally chaotic and unpredictable struggle immensely to explain why agriculture, states, or writing emerged *repeatedly and independently*. This requirement forces accounts to incorporate structures, constraints, attractors, or functional necessities that make certain large-scale outcomes robust despite path-contingency at finer scales. It excludes accounts that cannot acknowledge *both* deep contingency *and* deep convergence/robustness.

  ### IV. How Usual Positions Fare

  *   **"Great Man" / Micro-Contingency Emphasis:** Excels at (2), often fails (3), (4), and (5b/c). Struggles with (6) by overstating the importance of individuals/events relative to structures. Fails (4) catastrophically.
  *   **Structuralism / Determinism (e.g., certain Marxisms, Geographical Determinism):** Excels at (3), (4), (5c - Type robustness). Fails (1), (2) by denying or minimizing genuine contingency. Often conflates predictability with determinism (failing 5a). Struggles with (6) concerning chaotic sensitivity in complex systems.
  *   **Chaos Theory Models:** Excels at (1), (2), (5a - unpredictability), (6). Struggles severely with (3), (4), (5b - importance), (5c - type vs token). Tends to make contingency maximal everywhere, failing (7).
  *   **Convergence / Evolutionary Models (e.g., Diamond, certain Social Evolution):** Excels at (3), (4), (5c - Type robustness). Often struggles with (1), (2), underselling genuine path-dependence and sensitive moments. Can conflate convergence with inevitability, failing (5a) by implying predictability/determinism where only convergence is shown. May handle (7) poorly if it minimizes contingency entirely.
  *   **Path Dependence / Critical Juncture Models:** Excels at (1), (2), (5c - Route/Timing), (6). Better at (3) than pure chaos by focusing on junctures within structures. Often struggles with (4) - why convergence *despite* path dependence? Can be vague on (5a) and (5b). Offers promising avenues for (7) & (8) via notions of "lock-in" and branching probabilities relative to descriptions.

  No single dominant position satisfies all desiderata cleanly, particularly the crucial tension between genuine micro-contingency (2) and robust convergence (4). Successful accounts likely need multi-level frameworks incorporating path dependence, sensitive dependence, structural constraints, and functional/convergent pressures operating at different scales and descriptions.
