prompt: |-
  So I've been going round in circles on the problem of old evidence and I think I've finally got the fix, but I want someone to check my working before I put it in a talk.

  My understanding: the trouble is that if you already knew E — say, the anomalous perihelion advance of Mercury, which was on the books long before general relativity — then P(E) = 1, and Bayes's rule asks you to divide by that, so the update either blows up or does nothing. Which is why P(GR) can't go up when Einstein points out that his theory entails the anomaly. And that's exactly what Jeffrey conditionalisation is for, isn't it — it lets you update when your evidence isn't sharp, so you just treat the known evidence as not-quite-1 and shift the probabilities on the partition instead. So the fix is to refuse to let any evidential proposition hit 1 in the first place.

  Can you walk me through how that actually works on the Mercury case? I'd like to see it concretely: which partition, what the new probabilities on it are supposed to be, and where the confirmation of general relativity comes from numerically. If it turns out I've got hold of the wrong end of the stick, tell me plainly what the actual difficulty is and what the proposals that do exist (Garber's entailment-sentence move, whatever Jeffrey himself suggested separately — I'm fuzzy on whether that's even the same thing as his rule) are really doing, and what each one costs you.

  Please write the whole thing in British English, including the -ise spellings. Structure it as: (1) where my premise goes wrong, (2) what the real problem is, (3) what each candidate fix buys and what it costs. Then put a final line beginning "Verdict:" giving your one-sentence answer on whether keeping P(E) strictly below 1 rescues Bayesian confirmation from old evidence.
reasoning: |-
  Okay, the user has been wrestling with the problem of old evidence in Bayesian confirmation theory, specifically regarding the perihelion advance of Mercury and general relativity. They think they've found a fix by never letting P(E) reach 1, using Jeffrey conditionalisation, but want verification before presenting it. 

  Hmm, their core misunderstanding is treating Jeffrey conditionalisation as merely about keeping P(E)<1. That's not quite right - Jeffrey's method handles uncertain evidence, but the old evidence problem runs deeper. The real issue is that E is already fully assimilated, so learning GR entails E shouldn't change anything if P(E)=1. 

  Right, let me unpack this carefully. First, the premise error: Jeffrey conditionalisation isn't designed for old evidence. It's for when you get fuzzy evidence (e.g. seeing a cloth under dim light). Applying it to Mercury would require artificially pretending you're less certain than you are - which feels epistemically dishonest. 

  Ah, the deeper problem: under strict conditionalisation, if P(E)=1 then P(H|E)=P(H), so no confirmation. But even if we keep P(E)<1, the confirmation measure P(E|H)/P(E) still approaches 1 if P(E) is high, yielding minimal boost. Worse, the entailment itself (H⊨E) is what's new, not E - but Bayes doesn't model learning logical relations. 

  Now for the fixes... Garber's approach represents learning H⊨E as a new proposition, say L. Then P_new(H) = P_old(H|L). But this requires assigning priors to logical truths - messy. Jeffrey conditionalisation could work if we treat the evidence as uncertain, but forcing P(E)<1 when we know better seems artificial. The cost is losing accuracy in representing actual beliefs. 

  Verdict time: no, keeping P(E)<1 doesn't rescue Bayesianism here. It's a technical workaround that dodges the division-by-zero but fails to capture why old evidence confirms theories - which is really about discovering entailments, not uncertain observation.
answer: |-
  Right, let's crack this nut properly. You're circling a genuine headache in Bayesian confirmation theory, but your proposed fix, while intuitive, doesn't quite resolve the core issue. Here's the breakdown in British English:

  1.  **Where Your Premise Goes Wrong:** Your understanding of Jeffrey conditionalisation is partially correct but misapplied here. Jeffrey's rule *is* for updating on uncertain evidence, allowing you to shift probabilities on a partition *without* setting any proposition to certainty (P(E) < 1). The mistake is thinking this directly solves the *old evidence problem*. The problem isn't *just* the division by P(E)=1 in Bayes' theorem. It's that **the logical relation of entailment (H ⊨ E) is learned *after* E is already known and fully accepted (P(E)=1)**. Jeffrey conditionalisation deals with *uncertainty in the observation itself*, not with learning a new *logical connection* between a hypothesis and evidence you already possess with certainty. To apply Jeffrey conditionalisation, you'd have to artificially *pretend* you're less certain of E than you actually are (P(E) < 1) *simply because* you're considering H. This feels epistemically dishonest; you *do* know E for certain. The confirmation *seems* to come from realising GR *entails* the known anomaly, not from suddenly doubting Mercury's orbital behaviour.

  2.  **What the Real Problem Is:** The core difficulty, as formalised by Glymour, is this:
      *   At time t0: Evidence E (perihelion advance) is known, so P_t0(E) = 1.
      *   Hypothesis H (GR) is under consideration. Crucially, at t0, the agent may *not* know whether H entails E. They might not even have fully formulated H.
      *   At time t1: The agent learns that H entails E (H ⊨ E). This is new information.
      *   **The Bayesian Dilemma:** According to strict conditionalisation:
          *   The new probability of H *should* be P_t1(H) = P_t0(H | E).
          *   But because P_t0(E) = 1, P_t0(H | E) = P_t0(H). (If E is certain, conditioning on it doesn't change anything).
          *   Therefore, learning H ⊨ E *cannot* raise the probability of H, which contradicts the strong intuition (and historical fact) that discovering GR explained the anomaly *did* confirm it significantly.
      *   **The Deeper Issue:** Bayes' theorem factors in the predictive power P(E|H), but if E is already certain (P(E)=1), *any* hypothesis that doesn't *forbid* E will have P(E|H) = 1 (or undefined if P(H)=0). The ratio P(E|H)/P(E) becomes 1/1 = 1, so no confirmation. The *learning of the entailment itself* isn't naturally captured by updating on E alone.

  3.  **Candidate Fixes - What They Buy and What They Cost:**
      *   **Jeffrey Conditionalisation (Your Proposal - Applied Artificially):**
          *   **What it Buys:** Avoids division by zero. Allows you to model *some* shift in belief in H when you focus on the connection between H and E. You set up a partition based on H and ~H (or finer). You then directly assign a new, slightly less-than-1 probability to E *within* this partition (e.g., P_new(E|H) = 1, P_new(E|~H) = 0.999, implying P_new(E) ≈ 0.999). Applying Jeffrey's rule to this partition *will* increase P(H).
          *   **What it Costs:** It requires *lowering your credence in established evidence E without any new empirical reason*. This is epistemically questionable. Why should P(E) dip below 1 simply because you're considering a new hypothesis? It feels like gerrymandering probabilities to get the desired result. It doesn't cleanly represent learning *the entailment*; it represents a (fictional) decrease in confidence about E itself.
      *   **Garber's Approach (Learning the Entailment):**
          *   **What it Buys:** Directly addresses the core issue. Garber suggests the new information learned at t1 isn't E (which is old), but the *proposition* L: "H entails E" (H ⊨ E). You then conditionalise on *this* new proposition: P_t1(H) = P_t0(H | L).
          *   **What it Costs:** It requires assigning a prior probability P_t0(L) = P_t0(H ⊨ E) *before* knowing the entailment holds. This means assigning probabilities to *logical or mathematical truths*. How do you rationally assign P_t0(GR entails the perihelion advance) before you've done the complex calculation proving it does? This seems deeply problematic. It blurs the line between logical omniscience (which Bayesians reject) and assigning probabilities to things that are inherently truths of reason, not empirical uncertainties. Assigning priors to logical facts is messy and lacks a clear epistemic foundation.
      *   **Narrowly Using the Counterfactual Prior (Common "Solution"):**
          *   **What it Buys:** This is often how Bayesians *talk* about the Mercury case informally. You imagine what your credence in E *would have been* if you hadn't known about Mercury (i.e., before t0). You use *this* hypothetical prior P*(E) and P*(E|H) in Bayes' theorem to calculate how much H *would have been* confirmed *if* E had been new evidence. The confirmation measure (e.g., likelihood ratio P*(E|H)/P*(E)) is then cited as the measure of confirmation provided by the old evidence.
          *   **What it Costs:** It's not a formal update rule within the Bayesian framework describing belief change *from t0 to t1*. It relies on a counterfactual state of belief (what you *would have* believed before knowing E) that doesn't actually exist at t0 or t1. It sidesteps modelling the actual learning process (learning H ⊨ E). It provides a *measure* of evidential support but doesn't explain the *dynamics* of the belief change upon learning the entailment.
      *   **Denying the Problem (Radical Bayesianism):**
          *   **What it Buys:** Simplicity. Argues that if E is truly known (P(E)=1), then learning H ⊨ E *shouldn't* change P(H), as H doesn't predict anything new. The historical confirmation must have come from other factors (e.g., GR predicting *other* novel phenomena, or a misinterpretation of the historical credences).
          *   **What it Costs:** Completely contradicts the strong, persistent intuition of scientists and philosophers that explaining old, stubborn anomalies *is* confirmatory. Requires dismissing a significant part of scientific practice and history as irrational.

  **Verdict:** No, simply keeping P(E) strictly below 1 via Jeffrey conditionalisation does not satisfactorily rescue Bayesian confirmation from the old evidence problem, as it artificially manipulates credence in the known evidence rather than directly addressing the core issue of learning a new logical entailment.
