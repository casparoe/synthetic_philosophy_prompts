   Both false, and same score.

   then the students might feel that the one that is right about a more important feature is closer, but in our setup, features are symmetric.

   In the withheld round, when they don't know the actual state, they might try to rank theories and realize that without the truth, they can't.

   So let's go with that.

   The game procedure:

  - The world has 4 binary features: let's call them simply 1,2,3,4. Values are 0 or 1.
  - Actual state: let's choose 1=1,2=0,3=0,4=1. (so not symmetric)

  - Teams start with 0 tokens.

  - Round 1: no information. Each team writes down a candidate description (a set of feature assignments). 
    - We then reveal the actual state and score the theories.

    Likely theories: 
      Team A might say "1=1" -> if correct, R=1, W=0, score=1.
      Team B might say "1=0" -> then R=0, W=1, score=-1.
      Team C might say "1=1,2=1" -> R=1 (feature1), W=1 (feature2), score=0.

    Then we score.

  - After each round, teams earn tokens: say, 2 tokens per round.

  - Round 2: teams can spend tokens to buy information (1 token per feature). Then they write a new candidate description.

    Example: 
      Team A might buy feature1 and feature2, learning 1=1, 2=0.
      They might then submit "1=1,2=0" -> which is true, score=2.

      Team B might buy feature1 and feature3, learning 1=1, 3=0.
      They might submit "1=1,3=0" -> true, score=2.

      Team C might buy feature1 and feature2, and then submit "1=1,2=0,3=1" -> they are guessing feature3=1, but actual is 0. So R=2 (1 and 2), W=1 (3), score=1.

    Then we have a bold falsehood (score=1) and two timid truths (score=2). Not the same.

    To encourage a timid truth, Team C might submit only what they know: "1=1,2=0", score=2.

    So to get a timid truth and a bold falsehood with the same score, we need a team to submit only one feature and be correct, score=1, and another team to submit three features and get two right and one wrong, score=1.

    To increase the likelihood, we can have a rule that the score is used for a lottery or something, but that might be complicated.

    Alternatively, in round 2, if a team has bought only one feature, they might submit only that feature to be safe.

    And another team that has bought two features might be bold and guess the third.

    For example, Team A buys feature1, learns 1=1, and submits "1=1" -> score=1.
    Team B buys feature1 and feature2, learns 1=1,2=0, and then guesses feature3=1, submitting "1=1,2=0,3=1" -> but actual feature3=0, so R=2, W=1, score=1.

    Then both have score=1.

    Then the scoring rule says they are equal. But Team B's theory is false, while Team A's is true. Team B has more correct information (two correct) but also one mistake, while Team A has one correct and no mistake.

    This is the first conflict: a bold falsehood (Team B) has the same score as a timid truth (Team A).

    Students might feel that Team B's theory is better because it has more correct information.

  - Round 3: teams earn more tokens, buy more information, write new theories.

    Team A might now buy feature2 and feature3, and submit a theory.
    Team B might buy feature3 and feature4, etc.

    We want two false theories with the same score.

    For example, Team A might submit: "1=1,2=0,4=1" -> actual:1=1,2=0,4=1, so all correct, score=3.
    Team B might submit: "1=1,3=0,4=1" -> all correct, score=3.
    Team C might submit: "2=0,3=0,4=1" -> all correct, score=3.

    Not false.

    To get false theories, a team might guess a feature they haven't bought.

    For example, Team C has bought only feature2 and feature3 (0 and 0), and guesses feature1=0, feature4=0, submitting "1=0,2=0,3=0,4=0" -> 
    actual:1=1,2=0,3=0,4=1, so R=2 (2 and 3), W=2 (1 and 4), score=0.

    Another team might submit: "1=1,2=1,3=0,4=0" -> R=1 (1 and 3? 1=1 correct, 2=1 wrong, 3=0 correct, 4=0 wrong) -> R=2, W=2, score=0.

    Then both have score=0.

    They are both false, and the scoring rule says they are equal. But are they equally close to the truth?

    Team C's guess: 0,0,0,0 -> actual 1,0,0,1 -> differs in feature1 and feature4.
    The other: 1,1,0,0 -> differs in feature2 and feature4.

    In terms of Hamming distance, both are 2 away. So in this case, they are equally close. But if the features are not symmetric, we can argue. But for simplicity, we can say they are symmetric.

    In the withheld round, we can have the actual state not revealed, and then the students have to rank the theories without knowing the truth.

    Let's schedule the withheld round for round 4.

  - Round 4: we withhold the actual state. Teams submit their theories, but we do not reveal the actual state and do not score. Instead, we ask the teams to rank the theories (from all teams) in order of closeness to the truth.

    They will have to do this without knowing the actual state. They might use the information they have purchased, but they don't know the actual state for the features they haven't bought. So they will be uncertain.

    This is meant to make them realize that the ordering they've been using (R-W) requires knowledge of the truth.

   At the end, we have the scoring for the first three rounds, and for round 4 we have their rankings.

   Then in the debrief, we point out the issues.

   Now, let's write the complete package.

   Materials:
  - A poster or handout with the features and their possible states. Since the features are abstract, let's call them Feature 1, Feature 2, Feature 3, Feature 4. Each can be "On" or "Off" (or 1 or 0).
  - Tokens: paper tokens, enough for the game.
  - For the banker (instructor): a sheet with the actual state.
  - For information purchase: when a team spends a token for a feature, the banker tells them the actual value of that feature.
  - Teams have paper to write their theories.

   Participant instructions:

  Cover story: 
  "You are a team of scientists trying to uncover the state of a mysterious system with four binary switches. In each round, you will have the opportunity to gather data (by purchasing information about the switches) and to propose a theory about the system. Your goal is to propose theories that are as close as possible to the true state. The team with the highest total score at the end will win a prize: the right to nominate which paper we drop from next week's reading list, and chocolate."

  Instructions:
  - The game has 4 rounds.
  - At the start of each round, each team receives 2 tokens.
  - Tokens can be spent to purchase the actual setting of one switch (one token per switch) from the banker. Purchased information is for your team only and is available for the rest of the game.
  - After purchasing information (or not), your team must write down a candidate theory. A theory is a list of any number of switches and your proposed setting for each. For example, "Switch 1: On, Switch 2: Off".
  - The theory must be written on a provided theory sheet and handed to the banker.
  - Scoring: 
    - For each switch that your theory specifies, if the setting is correct, you get +1; if incorrect, you get -1.
    - Switches not mentioned in your theory do not affect your score.
    - Your score for the round = (number of correct settings) - (number of incorrect settings).
  - In rounds 1-3, after all theories are submitted, the banker will reveal the actual state of all four switches, and scores will be calculated and announced.
  - In round 4, the actual state will not be revealed. Instead, teams will be asked to rank all the theories submitted in that round from best to worst in terms of closeness to the truth, without knowing the actual state.
  - Tokens not spent in a round carry over to the next round.
  - The winning team is the one with the highest total score from rounds 1-3. In case of a tie, the team with the highest score in the final round (round 3) wins.

  Note: In round 4, since the actual state is withheld, there is no scoring. The ranking exercise is separate.

  Likely pair for the wall: 
  - In round 2, we might have a timid truth (score=1) and a bold falsehood (score=1) as described above.
  - In round 3, we might have two false theories with score=0.

  After they see that the scoring rule ranks them equally, the student's immediate reaction might be: "But the bold theory has more correct information!" for the first case, and for the second case, "But these two theories are not equally good; one is closer!"

   In the second case (two false theories with the same score), they might say: "But they are both two away, but in different features, and we think feature1 is more important." But since our features are symmetric, we might not have that, so they might just accept they are equal.

   Alternatively, in the withheld round, when they have to rank without knowledge, they might try to use the scoring rule on the information they have, but it will be incomplete.

   Timeline (100 minutes):

  0-5 min: Introduction, hand out instructions, form teams (11 students: let's do three teams: Team A: 4, Team B: 4, Team C: 3). Explain the rules.

  5-10 min: Round 1. Teams do not have tokens. They write their first theory without any information. Collect theories.

  10-15 min: Reveal the actual state (1,0,0,1). Banker scores each theory and announces scores. Record on a whiteboard.

  15-20 min: Distribute 2 tokens to each team. Round 2: teams may spend tokens to buy information. Then they write their second theory.

  20-25 min: Collect theories. Reveal actual state. Score and announce.

  25-30 min: Distribute 2 tokens to each team (so they have any unspent plus 2). Round 3: teams may spend tokens, write theory.

  30-35 min: Collect theories. Reveal actual state. Score and announce.

  35-40 min: Distribute 2 tokens for round 4. Round 4: teams may spend tokens. Then write theory. But this round is different.

  40-45 min: Collect theories. Do not reveal actual state. Instead, ask each team to rank all the theories submitted in round 4 (including their own) from best to worst in terms of closeness to the truth. They should discuss and provide a ranking.

  45-55 min: Teams work on ranking. They hand in their ranking.

  55-60 min: Banker reveals the actual state of round 4, and scores the theories of round 4. But note: the scoring is for the record, but the win is based on rounds 1-3. We can add round 4 score to the total if needed, but since we announced that round 4 is withheld, maybe not. Or we can score it but not use it for the win, because the win is based on rounds 1-3. Let's not include round 4 in the win, to avoid confusion.

  60-100 min: Debrief and discussion.

  Now, the debrief:

  1. Start by asking: In round 2, we had a theory that was true and got score=1, and a theory that was false and also got score=1. How could that happen? What does that say about our measure of closeness?

  2. Then, in round 3, we might have two false theories with the same score. Ask if they think these two are equally close to the truth. Why or why not?

  3. Then, in round 4, when you had to rank without knowing the truth, what did you use? Was it possible to apply the scoring rule? Why or why not?

  4. Then, introduce the philosophical problem: we want to measure how close a theory is to the truth. The scoring rule we used is a natural one: count the correct claims and subtract the incorrect ones. But it has the consequence that a bold falsehood can be as good as a timid truth. And for two false theories, it might not distinguish between them even if one is closer.

  5. Explain that this is not just a game: in the 1960s, Karl Popper proposed essentially this measure (using the truth content and falsity content). In the 1970s, it was shown that this measure can give counterintuitive results.

  6. But the failure of this measure does not mean that the idea of closeness to truth is empty. We might need a more sophisticated measure that takes into account the similarity between states, or the structure of the world.

  7. Finally, discuss what the students think we should do.

  Repairs the group might propose:

  - One might propose to count only the correct claims and ignore the incorrect ones. But then a theory that says many things and gets some wrong might be ranked higher than a true theory that says less.

  - Another might propose to penalize more for being wrong, for example, score = R - 2*W. But then a theory that is very bold and wrong might get a very low score.

  - Another might propose to use the proportion correct: R/(R+W). But for a true theory that says very little, R/(R+W)=1, which is good. For a false theory that says a lot and has high R and high W, it might have a lower proportion.

    Example: 
      Timid truth: R=1, W=0 -> proportion=1.
      Bold falsehood: R=2, W=1 -> proportion=2/3.

    So the timid truth is better. But is that what we want?

  - Or, they might propose to use the number of correct claims and ignore the mistakes, but then a theory that makes many mistakes but also says many correct things might be ranked high.

  - Another repair: use the scoring rule only when we know the truth, and when we don't, we use something else.

  - Or, they might say that without the truth, we cannot define closeness, but that seems to make science impossible.

  We should try out in a spare five minutes: none, because the game is over. In the debrief, we can discuss.

  For each repair, we can ask the group if it solves the problem. For example, if they propose proportion, then apply it to the timid truth and bold falsehood: the timid truth has proportion 1, the bold falsehood has 2/3, so the truth is better. But then we lose the intuition that the bold falsehood is more informative and thus closer to the whole truth.

  The frank closing paragraph:
  This game simplifies the problem of truthlikeness by:
  - Using a very small and discrete world.
  - Ignoring the logical structure of theories (our theories are conjunctions of atomic claims).
  - Ignoring any similarity between the feature values (in the actual world, some features might be more important or have a closer resemblance).

  In reality, the problem is more complex because:
  - Theories are not just conjunctions of atomic facts; they can have complex logical structures.
  - There might be a metric over the state space, but defining it is hard.
  - The language dependence: the features we choose to describe the world might affect the measure.

  You will have to explain these in the subsequent lecture.

  Now, write the participant instructions in British English.
