   Then no conflict.

   To encourage boldness, we can have a rule that the score is doubled for each feature specified? But that might not help.

   Alternatively, have a penalty for not specifying: but the scoring rule is only R-W, and U is not penalized.

   Or, we can have the winning condition be the highest score in the final round, and encourage them to be as informative as possible.

   But also, they can choose to be bold to get a high score if they are confident.

  Likely, in a later round, a team might have bought three features and think they know the fourth. For example, they have A=1, B=1, C=1, and they guess that D=1, so they submit "A=1, B=1, C=1, D=1" -> if correct, score=4. But if they are wrong, score might be low.

   But in our actual, D=1, so it's correct.

   To ensure a false theory, we can have the actual state not be all 1's. Let's choose a state like 1101.

   Then, if a team has bought A=1, B=1, C=0 (wait, actual is 1101, so C=0? Let's define actual: A=1, B=1, C=0, D=1.

   Then, if a team buys A, B, C, they see A=1, B=1, C=0. They might assume D=0 or D=1. If they guess D=0, then submit "A=1, B=1, C=0, D=0" -> R=3 (A,B,C), W=1 (D), score=2.
   If they guess D=1, then "A=1, B=1, C=0, D=1" -> R=4, score=4.

   So they might be bold and guess D=1, and be correct.

   To have a bold falsehood, we need them to guess wrong.

   But we can't control their guesses.

   Alternatively, in the first round, they might guess a complete state and be wrong.

   Given the constraints, we can have the instructor (banker) not reveal the actual state in one round, and in that round, the students will have to compare theories without knowing the truth. Then they will realize that they cannot compute the score without the actual state.

   Then, in the other rounds, when scored, they will see the scoring rule in action.

   Likely pair for the wall: in some round, two teams submit:
     Team1: "A=1, B=1, C=1" -> but actual is 1101, so R=2 (A and B), W=1 (C), score=1.
     Team2: "A=1, B=1, D=1" -> actual, A=1, B=1, D=1 -> correct for all specified, so R=3, W=0, score=3.

   Then Team2 has a higher score.

   Not the same.

   To get two with the same score, in the same round, we need:

     Team1: specifies three features, gets two right, one wrong -> score=1.
     Team2: specifies one feature, gets it right -> score=1.

