   The wall: when they see two false theories with the same score, but they believe one is closer. And the scoring rule cannot distinguish.

   Then, in the debrief, we explain that this is the problem with the simple measure.

   Now, let's design the world and the likely theories.

   To increase the chance of getting two false theories with R=2, W=1, choose the actual state to be 1111.

   Common student theories:
  - In the first round, with no information, they might guess randomly. Some might be very safe: only one feature specified, and they might get it right or wrong.
  - After buying information, they might specify more.

   For example, in round 2, a team might have bought two features, say A and B, and they are both 1. So they might submit: "A=1, B=1" -> this is true, score=2-0=2.
   Another team might have bought A and C, both 1, and submit "A=1, C=1" -> score=2.
