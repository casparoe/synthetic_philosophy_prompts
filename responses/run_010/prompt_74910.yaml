  | 25–30      | **Round 3: Earn tokens + information purchase**                                                        | Give 2 tokens per team. Teams buy information and write theories.                                                                                  |  
  | 30–35      | **Collect and Score Round 3**                                                                          | Collect theories. Reveal true state. Calculate scores. Announce. Post cumulative scores. (Likely pair: Two false theories, both score 0—e.g., "S1:Off, S2:Off" (R=1 (S2), W=1 (S1), score=0) and "S3:On, S4:Off" (R=1 (S4? S4=On, so if they say Off, R=0? Wait, **adjustment**). |  
  | 35–40      | **Round 4: Withheld truth**                                                                            | Give 2 tokens per team. Teams buy information and write theories. Collect theories. Do NOT reveal true state.                                      |  
  | 40–45      | **Ranking for Round 4**                                                                                | Distribute copies of all Round 4 theories. Teams rank them best to worst. Collect rankings.                                                        |  
  | 45–50      | **Reveal and Score Round 4 (for reference only)**                                                      | Reveal true state. Calculate scores for Round 4 (not added to total). Announce for curiosity.                                                      |  
  | 50–55      | **Declare winner and award prizes**                                                                    | Sum Rounds 1–3 scores. Announce winning team. Distribute chocolate and confirm dropped paper.                                                     |  
  | 55–100     | **Debrief and discussion**                                                                           | Follow structured debrief below.                                                                                                                  |  

  **Adjustments for Likely Pairs**:  
  - **Round 2 Bold Falsehood Issue**: With actual state (S1:On, S2:Off, S3:Off, S4:On), a "bold" theory like "S1:On, S2:On, S3:On" would have R=1 (S1), W=2 (S2,S3), score= -1—not 1. To ensure the *timid truth* (e.g., "S1:On", score=1) and *bold falsehood* (e.g., "S1:On, S4:Off", R=1 (S1), W=1 (S4), score=0) have **the same score (0)**, adjust the world:  
    - **New Actual State**: Switch 1: On, Switch 2: On, Switch 3: Off, Switch 4: Off.  
    - **Likely Pair**:  
      - Timid truth: "S1: On" → R=1, W=0, score=1.  
      - Bold falsehood: "S1: On, S2: On, S4: On" → R=2 (S1, S2), W=1 (S4), score=1.  
    - Students see: Both score 1, but one is true and one is false.  
    - **Student reaction (5 seconds after)**: "But the bold one got more right!"  

  - **Round 3 Two False Theories Issue**: With actual state (S1:On, S2:On, S3:Off, S4:Off):  
    - **Likely Pair**:  
      - Theory X: "S1: Off, S3: On" → R=0 (both wrong), W=2, score= -2? Wait, **ensure both score 0**:  
        - Theory X: "S1: Off, S4: On" → R=1? S1: On (W), S4: Off (W) → R=0, W=2, score= -2.  
        - **Adjust to**:  
          - Theory X: "S1: On, S4: On" → R=1 (S1), W=1 (S4), score=0.  
          - Theory Y: "S2: On, S3: On" → R=1 (S2), W=1 (S3), score=0.  
    - Both are false. Students see identical scores.  
    - **Student reaction**: "But X is closer because S1 is more important!" (even if unwarranted).  

  ---  
  **Debrief (55–100 min)**  
  *(Order of delivery; use questions to guide discussion)*  

  1. **Recap the Game (5 min)**:  
     - *Ask*: "What strategy did your team use? When did you play safe or bold?"  
     - *Map to concepts*: Highlight how information purchases reflect empirical testing.  

  2. **Round 2: Timid Truth vs. Bold Falsehood (10 min)**:  
     - *Ask*: "In Round 2, we had a true theory with score 1 and a false one with score 1. How is that possible? Should they be ranked equally?"  
     - *Student insight*: They’ll note the bold theory had more correct information but a mistake.  
     - *Map to concepts*: This exposes Popper’s intuition: A theory with more "truth content" (correct info) can be better, even if false.  

  3. **Round 3: Two False Theories (10 min)**:  
     - *Ask*: "In Round 3, two false theories scored 0. Are they equally close to the truth? Why or why not?"  
     - *Student insight*: Some will argue they are not equal due to feature importance or patterns.  
     - *Map to concepts*: The scoring rule ignores similarity between states. Verisimilitude requires more than just counting right/wrong—it needs a "closeness" measure.  

  4. **Round 4: Withheld Truth (10 min)**:  
     - *Ask*: "In Round 4, you ranked theories without knowing the truth. What did you use instead of the scoring rule? Was it reliable?"  
     - *Student insight*: They used intuition, purchased info, or patterns—but felt uneasy.  
     - *Map to concepts*: This shows truthlikeness isn’t computable from evidence alone. It’s a substantive ordering, not just a manner of speaking.  

  5. **The Breakdown (10 min)**:  
     - *Ask*: "What’s wrong with our scoring rule? Can you fix it?"  
     - *Expected repairs*:  
       - "Average right vs. wrong" (e.g., \( \frac{R}{R+W} \)): **Try it out** with Round 2 theories. Timid truth: \( \frac{1}{1} =1 \), bold falsehood: \( \frac{2}{3} \approx 0.66 \)—ranks truth higher, but loses informativeness.  
       - "Only truth matters; falsity is fatal": **Concede** that this makes boldness irrational, but science needs risk.  
       - "The whole idea is empty; only truth/falsity count": **Answer** with: "If that’s true, why did we all feel Theory X was better than Y in Round 3?"  
     - *Reveal*: This mirrors history—Popper’s rule (1970s) failed, but it doesn’t mean truthlikeness is illusory.  

  6. **Philosophical Bridge (10 min)**:  
     - *Ask*: "Why care about closeness to truth if we can’t measure it perfectly?"  
     - *Summarise*: Science aims for better explanations, not just truth. The game shows this intuition is robust, even if hard to formalise.  

  ---  
  **Predictable Failure Modes and Solutions**  

  1. **Rules Misread**:  
     - *Risk*: Teams score theories themselves or misunderstand token use.  
     - *Fix*: Start with a practice round (e.g., "Imagine S1 is On—score ‘S1: On’"). Clarify tokens are for banker requests only.  

  2. **Round Overruns**:  
     - *Risk*: Round 2/3 theory-writing drags due to debate.  
     - *Fix*: Announce strict times (e.g., "3 minutes left"). Use a timer. If delayed, shorten Round 4 ranking.  

  3. **Confident Student Derails**:  
     - *Risk*: A student declares, "This is about verisimilitude!" early or dominates discussion.  
     - *Fix*: Gently deflect—"We’ll discuss philosophy later; focus on the game now." If persistent, assign them as a "banker’s assistant" to distribute tokens.  

  4. **Ties or No Bold Theories**:  
     - *Risk*: No timid/bold pair emerges.  
     - *Fix*: Seed it. In Round 2, if all play safe, say: "Team B, you bought two switches—want to guess a third?" If they refuse, use their submission but highlight a hypothetical bold alternative during debrief.  

  ---  
  **Frank Closing Paragraph on Limitations**  
  This game simplifies the philosophical problem in key ways. First, it treats features as binary and independent, ignoring real-world complexities like continuous values, interdependencies, or semantic depth (e.g., "Switch 1 = mammal" carries more weight than "Switch 4 = can fly"). Second, theories are atomic conjunctions, whereas scientific theories often involve laws, probabilities, or negations that create complex logical structures. Third, the scoring rule’s failure assumes a flat feature-space metric; in reality, similarity between states (e.g., a bat is closer to a platypus than a bird) may involve domain-specific knowledge. Finally, the game sidesteps language dependence—Popper’s measure broke down partly because truth content depends on how we describe the world. In your follow-up lecture, you’ll need to: (1) explain how real theory choice involves weighted features or structured metrics, (2) discuss Miller-Tichý-style counterexamples, and (3) explore whether truthlikeness survives these challenges or collapses into pragmatism. Use the game’s concrete stakes to anchor this abstraction: "Remember when you felt Theory X *must* be closer? That’s the itch we’re trying to scratch."  

