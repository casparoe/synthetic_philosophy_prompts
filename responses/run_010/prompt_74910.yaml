  ### Workshop Package: The System Switch Challenge  
  **Cover Story for Participants**  
  You are a team of investigators exploring a mysterious system controlled by four binary switches (each either On or Off). Your goal is to uncover the system's true state by gathering information and proposing theories about the switch settings. Each round, your team will earn tokens to purchase information about individual switches. You will then submit a theory (a list of specific switch settings) that you believe best describes the system. Theories will be scored based on accuracy. The team with the highest total score after three rounds will win the right to nominate one paper to drop from next week’s reading list, plus chocolate for all team members. No real money is involved.  

  **Participant-Facing Instructions**  
  *(Hand out at the start; British English)*  

  1. **Teams and Rounds**:  
     - You will work in teams of 3–4.  
     - The game has four rounds. Rounds 1–3 determine the winner; Round 4 is a special challenge.  
     - In Rounds 1–3, the true state of the system will be revealed after you submit your theories. In Round 4, it will be withheld.  

  2. **Tokens and Information**:  
     - Each team starts with 0 tokens.  
     - At the beginning of **each round**, every team receives 2 tokens. Unused tokens carry over.  
     - Tokens can be spent to learn the true state of **one switch** per token. Ask the banker (instructor) privately—e.g., "What is Switch 2?" The banker will tell you the answer.  
     - Purchased information is recorded and can be used in all subsequent rounds.  

  3. **Submitting Theories**:  
     - A theory is a list of one or more switch settings (e.g., "Switch 1: On, Switch 3: Off"). You can specify any number of switches.  
     - Switches not mentioned are ignored in scoring.  
     - Submit your theory in writing to the banker each round.  

  4. **Scoring in Rounds 1–3**:  
     - For each switch in your theory:  
       - **+1** if your setting matches the true state.  
       - **-1** if your setting is incorrect.  
     - Switches not mentioned do not affect your score.  
     - **Total score** = (Correct settings) minus (Incorrect settings).  
     - Example: If you specify three switches and get two right and one wrong, your score = 2 - 1 = 1.  
     - Scores are announced after all theories are submitted and the true state is revealed.  

  5. **Round 4 (Withheld Truth)**:  
     - Submit a theory as usual, but the true state **will not be revealed**.  
     - Instead, all teams will rank all submitted theories from best to worst based on perceived closeness to the truth.  

  6. **Winning**:  
     - The team with the highest **combined score from Rounds 1–3** wins.  
     - Ties are broken by the highest score in Round 3.  

  ---  
  **Materials List**  
  *(For instructor; prepare in advance)*  

  1. **Feature Cards** (1 set for the banker; actual state: **Switch 1: On, Switch 2: Off, Switch 3: Off, Switch 4: On**):  
     - Card 1: "Switch 1: On" (banker’s reference).  
     - Card 2: "Switch 2: Off"  
     - Card 3: "Switch 3: Off"  
     - Card 4: "Switch 4: On"  

  2. **Tokens**: 30 paper tokens (simple squares; 1 token = 1 information request).  

  3. **Team Sheets**:  
     - Per team: 1 pad of paper for writing theories.  
     - Per team: 1 information log (to record purchased switch settings).  

  4. **Whiteboard Setup**:  
     - Columns: Team Names (Team A, Team B, Team C).  
     - Rows: Scores for Rounds 1–3.  

  5. **Handouts**:  
     - Participant instructions (as above).  
     - Round 4 ranking sheets (blank tables for teams to list theories 1–3 in ranked order).  

  ---  
  **Token Economy and Scoring Rules**  
  *(For instructor; not shared with students)*  

  - **Token Allocation**:  
    - Round 1: 0 tokens (no information).  
    - Start of Rounds 2–4: +2 tokens per team.  
    - Tokens are spent by handing them to the banker when requesting switch information.  
    - **Reward conversion**: Winning team’s tokens convert to prizes: (1) Nominate one paper to drop from next week’s reading list, (2) Chocolate bars for all members.  

  - **Scoring Mechanics (Rounds 1–3)**:  
    - Let \( R \) = number of correct settings in the theory.  
    - Let \( W \) = number of incorrect settings.  
    - Score = \( R - W \).  
    - **Handling edge cases**:  
      - **Ties**: Broken by Round 3 score (if still tied, share prizes).  
      - **Refusals to guess**: A team must submit a theory with at least one switch specified. If they refuse, assign a default theory (e.g., "Switch 1: Off") and score it.  
      - **Logically empty theory** (e.g., no switches specified): Not allowed. If submitted, return it and request a resubmission with at least one switch.  
      - **Inconsistent theories** (e.g., "Switch 1: On and Switch 1: Off"): Treat as specifying only the last-stated setting.  

  - **Round 4 Ranking**:  
    - After submission, collect theories and redistribute copies to all teams.  
    - Teams have 10 minutes to rank all theories (1st = best, 3rd = worst) based on perceived closeness to truth.  
    - No scores are calculated. Focus is on qualitative ranking.  

  ---  
  **Minute-by-Minute Timeline (100 Minutes Total)**  

  | Time (min) | Activity                                                                                                | Instructor Actions                                                                                                                                 |  
  |------------|--------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------|  
  | 0–5        | **Introduction**                                                                                       | Explain cover story, form teams (Team A: 4 students, Team B: 4, Team C: 3). Hand out instructions and materials. Emphasise: "Your goal is to get as close to the true system state as possible." |  
