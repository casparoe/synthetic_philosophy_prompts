answer: |-
  ### Deliverables  

  **1. Question Stem (428 words)**  
  The following empirical patterns bear on Malthusian population theory. In his 1798 *Essay*, Malthus argued population grows geometrically while food production grows arithmetically, forcing a collapse to subsistence via "misery" (famine, disease) or "vice" (war, infanticide). In 1803, he added "moral restraint" (postponing marriage until affordable) as a third check. Pre-1800 English data align: rising real wages preceded earlier marriage and higher fertility, driving population growth. By contrast, post-1850 England defied predictions: real wages rose persistently alongside population growth, the wage-marriage link weakened (and later reversed), while food supply expanded via imported grain, fertilizers, and high-yield crops—violating both the arithmetic-growth premise and the predicted collapse.  

  Two repairs emerged:  
  - **Repair A (Moral Restraint)**: The catastrophe was avoided because the working class adopted moral restraint, reducing fertility.  
  - **Repair B (Productivity)**: Unforeseen exogenous improvements in food production offset scarcity.  

  Meanwhile, the Phillips curve (1958) posited a stable trade-off between unemployment and inflation. When stagflation (high unemployment *and* inflation) broke this link in the 1970s, economists added "expectations-augmentation": workers anticipate inflation, demanding higher wages, which *predicts* stagflation under certain conditions—a novel fact the original theory ruled out.  

  **TASK (45 minutes):**  
  (i) State a *criterion* distinguishing a *legitimate auxiliary adjustment* (rescuing a theory while enhancing its content) from an *immunizing stratagem* (merely deflecting falsification without gain). Your criterion must not reject ordinary *ceteris paribus* clauses (e.g., "absent external shocks").  
  (ii) Apply this criterion to **Repair A**, **Repair B**, and the **Phillips-curve adjustment**.  
  (iii) Render and defend a verdict: Can Malthus’s core mechanism be deemed "right but early"? If so, clarify *which component* (e.g., the population-pressure mechanism, the collapse prediction) this verdict applies to, and why.  

  ---  

  **2. Model Answer (748 words)**  
  **(i) Criterion**: A legitimate auxiliary adjustment must satisfy *novel testability*: it generates *new, independently checkable predictions* beyond explaining the initial anomaly. Immunizing stratagems lack this; they only "save" the theory by invoking untestable or unfalsifiable claims. Crucially, this permits *ceteris paribus* clauses if they specify measurable boundary conditions (e.g., "without major technological shocks").  

  **(ii) Application**:  
  - **Repair A (Moral Restraint)**: *Legitimate*. Though added post-hoc, it yields novel predictions: (a) Societies with later marriage ages should have higher per-capita income *ceteris paribus*; (b) Fertility declines should precede rising prosperity where restraint spreads. Both were tested: Comparing 18th-century England (late marriage) with France (early marriage) shows higher English living standards. Later, 19th-century European fertility declines correlated with rising wages, supporting (b). This content justifies Malthus’s 1803 update.  
  - **Repair B (Productivity)**: *Immunizing stratagem*. Invoking "unforeseen productivity gains" explains the anomaly but offers no *new* predictions. It neither specifies what counts as "foreseeable" nor measures gains *in advance*. For example, it could always blame future food shortages on "insufficient innovation" without specifying minimal innovation rates. It resembles claiming "a miracle occurred" to avoid falsification.  
  - **Phillips-Curve Adjustment**: *Legitimate*. The expectations-augmented version predicted stagflation—a novel outcome the original theory forbade. This was confirmed empirically (e.g., 1970s oil crises) and specified testable mechanisms (e.g., inflation expectations surveys). It enhanced the theory’s scope beyond the initial trade-off.  

  **(iii) Verdict on "Right but Early"**: The phrase can coherently apply *only* to Malthus’s **population-pressure mechanism** (fertility responds to material conditions), not his **equilibrium-collapse prediction**. Evidence shows the mechanism operated pre-1850: wages influenced marriage/fertility. Post-1850, structural shifts (e.g., falling child labor value, contraception) weakened this link, but the core driver—economic incentives shaping reproduction—resurfaced in later demographic transitions (e.g., 20th-century developing nations). The collapse prediction failed because it ignored institutional and technological feedbacks, violating *ceteris paribus* (e.g., assuming static production). Thus, Malthus identified a real mechanism but misjudged its interaction with exogenous factors and overgeneralized its equilibrium implications.  

  **Contrast with Repairs**: Calling the *theory* "right but early" risks excusing Repair B’s emptiness. Instead, we salvage the mechanism (supported by Repair A’s tests) while discarding the rigid equilibrium claim falsified by history.  

  ---  

  **3. Marking Scheme (25 marks total)**  
  **Must-hit moves** (penalize repetition; award partial marks):  
  1. **State a precise criterion** (5 marks): Must require *novel testability* beyond anomaly-resolution. *Botch: Vague appeals to "progress" or "falsifiability" without specifying predictive gains.*  
  2. **Correctly classify Repair A** (4 marks): Must note its novel predictions (e.g., regional marriage-age/income correlations). *Botch: Calling it immunizing due to its timing (1803), ignoring later tests.*  
  3. **Correctly classify Repair B** (4 marks): Must highlight absence of prior measurability/new tests. *Botch: Defending it as "obvious" without addressing testability.*  
  4. **Analyze Phillips curve** (4 marks): Must contrast its novel prediction (stagflation) with Malthusian repairs. *Botch: Superficial comparison (e.g., "both adjusted") without content contrast.*  
  5. **Verdict on "right but early"** (5 marks): Must separate mechanism from equilibrium, citing evidence (e.g., pre-1850 wage-fertility link). *Botch: Using the phrase to avoid judging components.*  
  6. **Synthesis/defense** (3 marks): Weave criterion into a coherent argument across all cases. *Botch: Isolated points without connections.*  

  ---  

  **4. First-Class vs. Competent Boundary**  
  - **Competent (15–18 marks)**: Hits all moves but superficially. States a criterion (e.g., "makes new predictions"), correctly labels repairs, notes Phillips curve predicted stagflation, and distinguishes mechanism from equilibrium. Uses terminology correctly but lacks depth in evidence (e.g., names "novel predictions" for Repair A without specifying *what they were*).  
  - **First-Class (22–25 marks)**: Explicitly **contrasts the testability** of Repairs A and B using the criterion (e.g., Repair A’s cross-regional checks vs. Repair B’s unfalsifiability). **Uses empirical hooks** from the stem (e.g., wage-marriage reversal, Phillips’s stagflation prediction) to ground arguments. **Defends the mechanism’s validity** by citing pre-1850 data *and* later analogues (e.g., demographic transitions).  

  ---  

  ### Self-Critical Note  
  **Empirical Hedging**: The claim that the wage-marriage link "reversed" post-1850 needs nuance. *Revise stem to*: "the wage-marriage link weakened significantly and, in some analyses, reversed by the late 19th century." Some historians argue cultural shifts (not wages) drove later marriage; omitting this over-simplifies.  

  **Confidence in Repair Ranking**: High (80%)—but *flipped by one argument*: If a candidate shows **Repair B was testable in advance** (e.g., 19th-century agronomy journals discussing yield-boosting innovations as plausible), it could reframe productivity gains as measurable. Then Repair B might become legitimate, and Repair A immunizing (if moral restraint was untestable in practice).  

  **Room for Dissent**: A strong dissenter could argue **both repairs are degenerate** by rejecting Malthus’s core mechanism entirely. *Example*: "Post-1850 data falsify the population-pressure mechanism itself, as fertility fell despite rising wages. Neither repair saves it; new theories (e.g., Becker’s household economics) were needed." *Marking scheme accommodation*: Award full marks if they (1) reject the "right but early" framing, (2) use stem data (e.g., wage-fertility decoupling) to falsify the mechanism, (3) apply their own coherent criterion (e.g., "no auxiliary can rescue a broken mechanism"), and (4) consistently reclassify both repairs/Phillips. Key: Rigor, not agreement.  

  **Overall Blind Spot**: The question assumes the Phillips curve adjustment is uncontroversially legitimate. A sharp candidate might challenge this (e.g., "It merely replaced one instability with another"), but the stem’s framing of it as predictive should suffice.
