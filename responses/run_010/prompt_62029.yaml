prompt: |-
  Third-year psych grad student, losing a recurring argument in my lab, need either ammunition or a surrender note.

  The setup: our study enrolls participants continuously and the rule we pre-registered is that every Monday the RA computes a Bayes factor for the main effect and emails it to the PI, and we stop recruiting the first week BF10 goes above 20 or below 1/20, or when we hit N=1000, whichever comes first. A methods reviewer said this is just p-hacking with more math. Our postdoc's answer on slack was, his exact words, "the likelihood principle says the stopping rule is irrelevant — Bayesians are immune to optional stopping, that's a frequentist worry," and then he added that since the rule was fixed in advance and is two-sided it's basically the Bayesian version of an alpha-spending group sequential design, so the reviewer is making a catagory error.

  I don't buy that it's a category error, but I also can't say what's wrong, and I've noticed "the stopping rule is irrelevant" seems to mean different things depending on who's saying it. So can you lay out the distinct precise claims that slogan could be making in this situation? I can see there's some narrow sense in which the posterior given the observed data doesn't care how you decided to stop collecting, and some much less narrow sense in which a rule that says "keep enrolling until the number crosses a line" is obviously doing something, and I suspect the whole fight is those two senses talking past each other. Which readings are true, which are false, which are true but do no work against the reviewer, and which one does my postdoc actually need in order to answer the complaint?

  Two things I specifically want pinned down: (a) does pre-registering the rule and making it two-sided change anything or is that cosmetic, and is the alpha-spending analogy real or a confusion — those designs exist precisely to control something, don't they, so what is it they're controlling that we're not? (b) does it matter that the RA sees the BF every week and could in principle be swayed by it, even though the only action anyone is allowed to take is stopping?

  Please make it a list I can take to lab meeting, with a blunt verdict on each reading rather than one long essay. If the reviewer is half right and the postdoc is half right, say which half of each. No need to point me at papers or readings, I just want the argument laid out.
reasoning: |-
  Okay, the user is a third-year psych grad student embroiled in a methodological debate in their lab. The core conflict revolves around whether their Bayesian stopping rule constitutes "p-hacking with more math," as a methods reviewer claimed. Their postdoc argues Bayesian immunity to optional stopping makes this valid, citing the likelihood principle. The student feels something's off but can't articulate it and wants clear, bullet-point-ready arguments for lab meeting.

  Hmm, this is actually a sophisticated stats question disguised as a lab dispute. The student needs ammunition to either defend or surrender intelligently. Key pain points: they sense "stopping rule irrelevant" is being oversimplified, they're suspicious about the two-sided/pre-registration aspect, and they're worried about the RA seeing interim BFs. Underneath, they probably also want to avoid looking foolish in front of their PI/postdoc.

  Breaking it down: First, the postdoc isn't wrong about the likelihood principle - given the model assumptions, the posterior really doesn't depend on the stopping rule. That's textbook Bayesian theory. But the reviewer has a point too: repeatedly checking until you hit a threshold absolutely inflates false discovery rates in frequentist terms. The student's intuition about "two senses talking past each other" is spot-on.

  On the pre-registration question: registering the rule fixes the decision boundary (so you're not cherry-picking thresholds), and making it two-sided prevents directional fishing. But crucially, it doesn't solve the fundamental issue that sampling until significance biases results - it just makes the bias quantifiable. The alpha-spending analogy is half-true; both control type I error, but Bayesian designs control different things (FDR vs posterior error).

  The RA seeing BFs weekly is a red herring though - as long as they only stop per protocol, it's fine. The real problem is the design itself inflating false positives when the null is true, which Bayesian theory handwaves by saying "but your posterior should reflect low prior!" Yet in practice, with vague priors...

  Verdict: Postdoc is technically correct about posterior interpretation, but dangerously glib about real-world error control. Reviewer is wrong to call it p-hacking (since it's transparent), but right that it inflates false positives. Student should concede the math but argue for a sensitivity analysis with different stopping rules to show robustness.
answer: |-
  Here's a blunt, point-by-point breakdown of the "stopping rule irrelevant" claims and their relevance to your study:

  ### Claims Under the "Stopping Rule is Irrelevant" Slogan & Their Truth Value

  1.  **Claim: "The posterior distribution *given the observed data* and prior does not depend on the stopping rule."**
      *   **Verdict:** **TRUE (in a narrow technical sense).** This is the core of the Likelihood Principle. Once data is observed, the stopping rule used to collect it doesn't change the posterior calculation *for that specific dataset*. Your postdoc leans heavily here.

  2.  **Claim: "Bayesian inference (e.g., BFs, posterior probabilities) is *immune* to optional stopping for *interpretation*."**
      *   **Verdict:** **TRUE (technically, but misleadingly incomplete).** Interpreting the *final* BF at the stopping point using standard rules (e.g., BF10 > 20 = strong evidence for H1) *is* valid *despite* the stopping rule, *according to the Bayesian calculus under the assumed model*. This is what your postdoc means by "immune." **BUT:** This does **NOT** mean the stopping rule doesn't affect *operating characteristics* (see below).

  3.  **Claim: "The stopping rule doesn't affect the *long-run error rates* or *behavior* of the procedure."**
      *   **Verdict:** **FALSE (and the crux of the reviewer's point).** The reviewer is thinking frequentistically. Optional stopping **dramatically inflates frequentist Type I error rates** (false positives). Your design *will* find "strong evidence" (BF10 > 20) **far more often than 5% of the time when H0 is true**, compared to a fixed-N design. **This is the "p-hacking" analogy.** Bayesian methods control *Bayesian* error rates (posterior probabilities), not frequentist ones. The postdoc's claim "irrelevant" **DOES NOT APPLY** to frequentist operating characteristics.

  4.  **Claim: "Because it's Bayesian, the stopping rule doesn't *bias* the final estimate (e.g., effect size)."**
      *   **Verdict:** **FALSE.** Optional stopping **does bias** point estimates (like the posterior mean effect size) in Bayesian analysis. Estimates tend to be overestimated in magnitude when stopping early for significance. The posterior *given the data* is correct, but the *data collected* via optional stopping is biased towards more extreme values.

  ### Answers to Your Specific Queries

  **(a) Pre-registration, Two-Sided, Alpha-Spending Analogy:**

  *   **Pre-registration:** **Cosmetic for Bayes, Crucial for Transparency.** Doesn't change the *Bayesian interpretation* or *statistical properties* of the final BF. It prevents *data-dependent* rule changes (true p-hacking), making the procedure honest and transparent. Essential for defending against *intentional* bias, but doesn't fix the *inherent statistical bias/inflation* caused by the stopping rule itself.
  *   **Two-Sided:** **Cosmetic.** You stop for strong evidence *either way* (BF10 > 20 or BF10 < 1/20). This prevents "dredging" for *any* effect regardless of direction, but doesn't fundamentally alter the inflation of false *discoveries* (finding *some* strong evidence when H0 is true) or the bias in estimation.
  *   **Alpha-Spending Analogy:** **Half-True, Half-Confusion.**
      *   **True:** Both are *sequential designs* with pre-specified stopping rules. Both aim to stop early if strong evidence emerges.
      *   **False/Confusion:** Alpha-spending **explicitly controls the overall frequentist Type I error rate** at a pre-specified level (e.g., 0.05) *across all looks*. Your Bayesian design **does NOT control frequentist Type I error**. The "spending" refers to allocating this error budget over looks. Your design controls *Bayesian* posterior error probabilities *at the stopping point*, not frequentist error rates over hypothetical repetitions. **What they control:** Alpha-spending controls False Positive Rate (FPR). Your BF design controls *Bayesian* False Discovery Probability *conditional on your data & prior* (not the long-run FPR).

  **(b) RA Seeing BF Weekly:**

  *   **Verdict:** **Irrelevant (as long as the rule is followed strictly).** The mere act of seeing the BF doesn't change the mathematics *if the RA only stops according to the pre-registered rule*. The *decision* to stop is dictated solely by the rule and the computed BF crossing a threshold. The "optional" in optional stopping refers to the *design* allowing stopping based on the data, not the *intentions* of the person looking. The statistical properties stem from the stopping rule itself, not who sees the interim results, as long as adherence is perfect.

  ### Blunt Verdict on the Dispute

  *   **Reviewer is Half-Right (the important half):** Calling it "p-hacking with more math" is inflammatory and imprecise, **BUT** their core concern is valid. Your sequential BF design **does inflate frequentist false positive rates and biases estimates**, similar to how unplanned optional stopping wrecks p-values. It exploits sampling variability.
  *   **Postdoc is Half-Right (the narrow half):** He's technically correct that the *interpretation of the final BF* (according to Bayesian rules) doesn't depend on the stopping rule (Claims 1 & 2). His "category error" point has *some* merit because the reviewer is applying a frequentist critique (Type I error) to a Bayesian measure (BF). **BUT** he is **dangerously wrong** to dismiss the reviewer's concern by implying the stopping rule has *no negative consequences* (Claims 3 & 4 are false). The alpha-spending analogy misses the *fundamental difference in what is being controlled*.
  *   **The Crux:** The fight is about **interpretation vs. operating characteristics / reliability**. The postdoc focuses on the internal consistency of the Bayesian update for the observed data. The reviewer (and your intuition) focuses on the real-world performance and potential for spurious findings inherent in the *design*.

  ### What Your Postdoc Needs (But Doesn't Have)

  He needs Claim 2 ("immune for interpretation") to answer the reviewer. **This is sufficient *only* if you accept the purely Bayesian interpretation framework.** It **does not work** against the reviewer's *frequentist* concern about inflated false positives or bias. To counter that, he must either:
  1.  **Concede the design has different operating characteristics** (higher FPR under H0) but argue that Bayesian posterior probabilities are the correct measure of evidence *for this analysis*.
  2.  **Demonstrate robustness:** Simulate the design under H0 and plausible H1 scenarios to show the *actual* Bayesian error rates (e.g., how often BF > 20 when H0 is true given your prior) are acceptable. Pre-registration makes this possible. Without this, the "immunity" claim feels like hand-waving to frequentists.

  ### Final Lab Meeting Ammo (Blunt)

  1.  **Yes, our final BF interpretation is valid *despite* stopping early (Bayesian theory).**
  2.  **BUT, stopping when BF>20 *will* find "strong evidence" for an effect far more than 5% of the time when no effect exists (H0 true). This is the reviewer's valid point.**
  3.  **Pre-registering the rule makes it transparent, not p-hacking. But it doesn't fix the statistical inflation/bias inherent in the *design*.**
  4.  **The alpha-spending analogy is weak: they control frequentist Type I error, we don't. We control Bayesian error probabilities *at the stop point*.**
  5.  **The RA seeing BFs weekly doesn't matter if they follow the rule. The problem is the rule itself from a frequentist perspective.**
  6.  **We should run simulations under H0 to see what our actual False Positive Rate *is* and report it alongside the BF to address the concern.** (Strongest move)
