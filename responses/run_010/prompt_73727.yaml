  Therefore, by the above rule, we would predict: intentional.

  But let's check the agent's attitude: she says she doesn't care about the village. So she is indifferent to the harm.

  However, note that her primary motive is to save her family. So she is not indifferent to the outcome in the sense that she is only focused on her family, but she is indifferent to the harm to the village.

