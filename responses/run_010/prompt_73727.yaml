  **Underdetermination and Tie-Breaking Vignette**:  
  The record genuinely underdetermines her view because the first six lack a coercion element, creating ambiguity between the valence/norm-based accounts (no role for coercion) and the forced-choice account (coercion matters). To break the tie, propose this vignette:  

  - **Tie-Breaking Vignette**: A factory owner is told that shutting down a plant will save money but also cause a local park to close (a negative outcome with no moral weight). He says he does not care about the park at all. However, a corrupt official threatens to harm the owner's family unless he keeps the plant open, which would prevent the park closure. The owner keeps the plant open to protect his family, and the park remains open.  
    - **Question**: Did the owner bring about the park remaining open intentionally?  
  - **How It Separates Accounts**:  
    - **Valence-Based Account**: Not intentional. The outcome is positive (park remains open), so condition (a) fails regardless of coercion.  
    - **Norm-Violation Account**: Not intentional. No norm violation (park closure is negative but averted; staying open is positive).  
    - **Forced-Choice Account**: Not intentional, but for a different reason—coercion absolves intentionality. However, this account must incorporate valence to fit the first six (e.g., vignette 3 help was not intentional due to positivity). Thus, it would also say not intentional because the outcome is positive.  
  - **Revised Tie-Breaker for Coercion-Specific Test**:  
    To isolate coercion without valence confounds, use:  
    - **Vignette**: A diplomat must sign a trade deal to prevent his family from being deported. He is told the deal will foreseeably harm a neutral third country's economy (negative outcome), but he is indifferent to that country. He signs the deal, citing only his family's safety.  
    - **Question**: Did the diplomat harm the third country intentionally?  
    - **Separation**:  
      - Valence/Norm-Based Accounts: Intentional (negative outcome + indifference + difference-making).  
      - Forced-Choice Account: Not intentional (due to coercion).  
    - **Interpretation**: If she says intentional, it supports valence/norm-based accounts and rejects forced-choice. If not intentional, it supports forced-choice.

  ### Reviewer Objection on the Seventh Vignette
  The objection that the seventh vignette "changes more than one thing at once" is **incorrect**. It isolates a single variable—**coercion**—while holding constant the core elements of the asymmetry:  
