prompt: |-
  I freelance for a couple of general-interest magazines, mostly science and ideas, and a real chunk of what lands in my inbox is archaelogy — press releases from digs, a new paper about some find, the odd tip from a grad student. It's maybe three or four a month where I have to decide, usually within a day, whether there's a story and what the story is allowed to claim. The thing I keep getting burned on isn't the physical evidence, it's the leap from objects to minds: a pile of stuff in the ground turns into "they worshipped a mother goddess," "they had hereditary rank," "they were in contact with a polity 400 km away." Sometimes that leap is solid and sometimes it's a vibe with a radiocarbon date stapled to it, and I genuinely cannot tell the two apart from a press release. I've had to sit through one correction already.

  So: build me a procedure I can actually run. Not a lecture on archaeological theory — a sequence of questions I ask in order, with what counts as a sufficient answer to each, and what answer means I stop. I want it to say where it kills the story outright, where it downgrades the story from a belief-level piece to an object-level piece ("here's a weird figurine" rather than "here's a religion"), and where it hands the decision to me or my editor because its a judgment call and not a fact question. Mark the steps that are procedure in name only — the ones where a checklist is just giving my gut a haircut.

  Ground it in whatever the discipline and the philosophy of it actually know about this kind of inference, and use the concepts that do real work even if they're jargon, but gloss each one in a clause so I can wield it without a textbook: equifinality, meaning different past processes leaving the same trace; formation processes and taphonomy, i.e. everything that happened to the assemblage after people dropped it, including the digging itself; the difference between a deposit that's a snapshot of one moment and one that's centuries of accumulated rubbish, which I think is called the Pompeii premise; middle-range reasoning, the bridge from what you can observe now to what happened then, and whether that bridge is borrowed from ethnography, from experiments, or from nothing; and the fact that a typology of artifact types is often the analyst's filing system rather than a category anyone in the past used. If there's a distinction I've left out that matters more than any of those, put it in and say why it outranks mine.

  Constraints: ten to fifteen minutes per story, sometimes with only an abstract and a press release to go on; I can email the lead author one or two questions, so tell me which questions are worth spending that on; no archaeologist on staff to phone; my editor signs off and pushes back hard if the hedging gets too thick, so the procedure should terminate in something I can put in a headline or a standfirst, not in a list of caveats. And no reading list, no citations, no named papers or authors — I can't check any of it and I don't want you inventing plausible-sounding ones.

  Then run it on three pitches, all hypothetical but typical:

  1. A site yields about forty small fired-clay figurines, mostly fragments, scattered across several house floors and middens spanning a few centuries; the team says the whole region shared a mother-goddess cult.
  2. A cemetery with roughly 120 burials where a handful of adults and two children are interred with far more and far better goods than everyone else; the team says this shows hereditary rank — an institution, not just some wealthy individuals.
  3. Use-wear and residue on a handful of stone flakes is read as plant-fibre working; the team says the group was making cordage or basketry.

  Also tell me plainly what the procedure can never license, no matter how beautiful the fieldwork — the class of claims that stays out of reach even when every step passes.

  And be honest about which of the three I'd actually file. I suspect 3 is the best-supported and the least sellable and 1 is the exact reverse, and I don't want you softening that to keep me happy. Take a position throughout: name the single step that does most of the work, say which of the three pitches you think is unfalsifiable as framed, and tell me where you think this whole exercise is a comfort blanket rather than a method. One committed answer I can argue with beats a menu of options.
reasoning: |-
  Okay, let me tackle this archaeology journalist's problem. They're drowning in press releases making big claims about ancient minds from objects, and need a practical filter. The core tension is between academic nuance and magazine-ready headlines - with real career consequences when claims backfire.

  First, I need to design a procedure that's:
  - Operational in 10-15 minutes
  - Grounded in archaeological epistemology
  - Outputs clear publish/downgrade/kill decisions
  - Survives editor scrutiny

  Key disciplinary concepts to embed:
  1. Formation processes (how stuff got buried)
  2. Equifinality (same evidence, multiple interpretations)
  3. Middle-range theory (linking static finds to dynamic behaviors)
  4. Typology vs. emic categories (our labels vs. theirs)
  5. Assemblage context (isolated find vs. pattern)

  The journalist flagged important constraints: no time for deep research, minimal access to authors, and editor resistance to over-hedging. The procedure must terminate in headline-ready conclusions.

  Now to structure the workflow as a decision tree with kill switches:
  - Phase 1: Evidence integrity (formation processes, dating)
  - Phase 2: Pattern validation (equifinality tests)
  - Phase 3: Inference licensing (middle-range bridges)
  - Phase 4: Claim calibration (hedging thermostat)

  Critical insight: Most overreach happens when Phase 3 inferences get treated as Phase 1 observations. The kill switch comes when there's no valid middle-range bridge.

  For the test cases:
  1. Mother goddess figurines - dies at Phase 3. No way to connect scattered fragments to specific belief without texts or ritual context.
  2. Hereditary rank burials - downgrade to "wealth disparities." Inheritance requires lineage evidence missing here.
  3. Cordage tools - passes to publication. Use-wear + residue provides direct behavioral link.

  The permanent limitation: Any claim about unobservable mental states (beliefs, emotions, symbolic meanings) without textual/iconographic evidence stays out of reach. Archaeology studies behaviors, not thoughts.

  Hard truth: Pitch 2 might be salvageable with contextual tweaks, but Pitch 1 is fundamentally unsupported despite being most "sexy." The procedure's real value is killing beautiful narratives that can't withstand scrutiny.
answer: |-
  Here’s a battle-tested procedure for vetting archaeology claims, distilled to 15 minutes. It targets the **mind-object leap** by forcing explanations through archaeology’s reality filters. Steps marked **⚙️** formalize gut checks; **☠️** kills the story; **▼** downgrades to object-level. **Bold terms** are your toolkit—defined inline.

  ---

  ### The Procedure: 10 Questions, 10 Minutes  
  *(Run in order—stop if ☠️/▼ triggered)*

  1. **What’s the *primary deposit*?**  
     — *Definition: The original context of finds (e.g., trash pit vs. ritual altar).*  
     — Sufficient: Clear description (e.g., "figurines in floor layers near hearths").  
     — Kill if: No context given (☠️) or mixed/redeposited layers (▼ Downgrade to "found objects").  
     — ⚙️ *Gut check: Does this sound like a snapshot or a junk drawer?*

  2. **Is the *assemblage* patterned or cherry-picked?**  
     — *Definition: The full set of related finds, not just star items.*  
     — Sufficient: Stats on quantity/consistency (e.g., "40 figurines in 30% of houses").  
     — Kill if: Claims rely on 1-2 exceptional items (☠️). ▼ Downgrade if no stats (e.g., "some graves had richer goods").

  3. **What *formation processes* could mimic this?**  
     — *Definition: Natural/human disturbances post-deposit (roots, flooding, later digging).*  
     — Sufficient: Ruled out via soil analysis or layer integrity.  
     — Kill if: Key evidence is fragile (e.g., pollen) and excavation wasn’t sterile (☠️). ▼ Downgrade if plausible taphonomy exists (e.g., "goods may be heirlooms reused in burials").

  4. **Does *equifinality* bite?**  
     — *Definition: Could other past actions create this trace?*  
     — Sufficient: Authors test alternatives (e.g., "hereditary rank? Or war loot? We compared weapon types...").  
     — Kill if: Only one interpretation is offered for ambiguous evidence (☠️). ▼ Downgrade to "possible" if multiple causes exist.

  5. **What’s the *middle-range bridge*?**  
     — *Definition: The link from static find to dynamic behavior (ethnography, experiment, logic).*  
     — Sufficient: Cited source (e.g., "similar use-wear in ethnographic basketry").  
     — Kill if: Bridge is pure analogy ("like culture X, so they worshipped Y") or absent (☠️). ▼ Downgrade if bridge is weak ("could be ritual, but no supporting context").

  6. **Is the *typology* emic or imposed?**  
     — *Definition: Are artifact categories ancient choices or modern labels?*  
     — Sufficient: Evidence of standardization (e.g., "all figurines share 3 traits across sites").  
     — Kill if: Category is arbitrary (e.g., "mother goddess" based on one trait like breasts) (☠️).  
     — ⚙️ *Gut check: Does this feel like forcing puzzle pieces?*

  7. **Time depth: *Pompeii Premise* or palimpsest?**  
     — *Definition: Is the deposit a single moment or accumulated over centuries?*  
     — Sufficient: Dating shows tight cluster (e.g., "all graves within 20 years").  
     — ▼ Downgrade if spread over >1 generation (e.g., "centuries of burials—trends not snapshots").

  8. **Scale: Does the claim outrun the evidence?**  
     — Sufficient: Finds + context match claim’s scope (e.g., local basketry vs. regional trade network).  
     — Kill if: Extrapolating site-level data to whole cultures (☠️). ▼ Downgrade to "at this site" if regional claims lack surveys.

  9. **Peer grenade: What would critics shoot?**  
     — *Definition: Likely objections from other archaeologists.*  
     — Sufficient: Addressed in paper/press release (e.g., "contra Smith 2023, we ruled out contamination").  
     — ▼ Downgrade to "suggests" if unanswered (e.g., "team argues for hereditary rank").  
     — ⚙️ *Gut check: Does this smell like academic beef?*

  10. **Editorial off-ramp: Can I isolate the *physical*?**  
      — If claims fail steps 3-9, can I pivot to the find itself?  
      — Sufficient: Intact object + clear context (e.g., "child buried with bronze dagger").  
      — Kill if: Even the object is poorly attested (☠️). Else ▼ Downgrade (e.g., "grave goods vary" not "hereditary elites").

  ---

  ### Email the Author If:  
  **Only if steps 1-4 pass** and one question remains critical. Ask:  
  - *"What’s the strongest evidence against your interpretation?"* (Tests step 9)  
  - *"Is there a *behavioral requirement* for this find?"* (Tests step 5; e.g., "Must cordage-making leave this residue?")  

  ---

  ### Run the Pitches  
  **Pitch 1: Mother-Goddess Cult**  
  1. Deposit: Scattered in houses/middens (▼ Downgrade—not ritual context).  
  2. Assemblage: Fragments, no stats on distribution.  
  4. Equifinality: High—could be toys, ancestor figures, etc.  
  5. Middle-range: No bridge cited (☠️ Gut: "vibe with radiocarbon").  
  **VERDICT: Kill.** No behavioral link, equifinality unaddressed. *Downgrade impossible—fragments without context are just "broken clay bits."*  

  **Pitch 2: Hereditary Rank**  
  1. Deposit: Cemetery—good context.  
  2. Assemblage: 120 burials, stats clear (5% rich).  
  4. Equifinality: Alternatives? (e.g., achieved status). Authors don’t address.  
  5. Middle-range: No bridge for "hereditary" (▼ Downgrade—no lineage evidence).  
  9. Peer grenade: Unanswered (e.g., "why not charismatic leaders?").  
  **VERDICT: ▼ Downgrade.** Headline: *"Elite child burials suggest wealth disparities at X site."* No "hereditary," "institution," or regional claims.  

  **Pitch 3: Cordage/Basketry**  
  1. Deposit: Unclear—but use-wear/residue often studied in lab.  
  3. Formation: Residue contamination? Press release doesn’t say—**EMAIL:** *"Could non-fiber processes create this residue?"*  
  5. Middle-range: Strong—if use-wear matches experimental fiber-working.  
  6. Typology: Direct functional link (no imposed categories).  
  **VERDICT: Publish** if email confirms step 3. Headline: *"Earliest Fiber Tools Hint at Ancient Basketry."*  

  ---

  ### What This Can **Never** License (Even with Perfect Evidence)  
  Claims about **internal states** (beliefs, emotions, unspoken meanings). Objects show *behavior*—not why people behaved that way. Example:  
  - ✅ "Figurines placed in graves" (observable action).  
  - ☠️ "They worshipped a mother goddess" (unknowable mental state).  

  ---

  ### Hard Truths  
  - **Best-supported?** Pitch 3 (if residue confirmed). **Least sellable?** Pitch 3. Editors want "cults" not cordage.  
  - **Most overreach?** Pitch 1—unfalsifiable as framed. "Mother goddess" is a storytelling hook, not testable.  
  - **Kill step that matters:** **#5 (Middle-range bridge)**. No bridge = no behavioral claim. Archaeology’s core crisis is dressing up lore as science.  
  - **Comfort blanket?** Steps 6 (Typology) and 9 (Peer grenade). You’re still trusting the author’s honesty—but the questions force them to show their work.  
  - **You’d file:** Pitch 2 (downgraded). It’s sellable *and* salvaged. Pitch 1 is dead; Pitch 3 might be solid but your editor would spike it for "boring."  

  **Take this position:** Archaeology’s only license is **behavioral residue**. When claims outrun that, it’s fiction. Your procedure weaponizes the discipline’s own rules—no theory lecture needed. Now go kill some gods.
