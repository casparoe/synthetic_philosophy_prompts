  Okay, the user is a novelist working on a comic novel set in a world where Ashʿarite occasionalism is the accepted metaphysical framework. They need a claims-denial letter from a home insurer that's written in standard corporate prose but reflects occasionalist principles. 

  Hmm, the key challenge is making the denial letter logically unassailable within this metaphysics. Since occasionalism denies created things any causal power, the insurer can't possibly blame the toaster - that would imply it has independent agency. The letter must avoid any language suggesting causation between objects.

  The user specified several elements to include: subrogation (but who'd they subrogate against? God?), the policyholder's obligation to prove the toaster "caused" damage (impossible under occasionalism), reliance on "custom" as risk modeling, and the adjuster's growing frustration with causal language. 

  I should craft language that:
  - Opens with sympathy but pivots to metaphysical impossibility
  - References policy clauses about "Divine Acts" as the only covered perils
  - Explains why subrogation is meaningless (no secondary causes)
  - Dismantles the toaster argument by emphasizing God's consistent habits
  - Uses "custom" as the basis for underwriting while denying necessity
  - Shows bureaucratic fatigue with the claimant's persistent causal framing

  The tone must stay perfectly deadpan corporate - no irony, no theological quotations. Phrases like "Divine re-creations" and "Divine habit" should feel like natural insurance jargon. For subrogation, the letter would treat it as procedurally required but metaphysically void. 

  Word count is tight at 550 max. I'll structure it as:
  1. Polite opener
  2. Explanation of denial basis
  3. Custom as risk model
  4. Subrogation impossibility
  5. Documentation request (as empty formality)
  6. Adjuster's thinly-veiled exasperation
  7. Closing instructions

  The satire emerges from the contrast between dry corporate language and the absurdity of applying occasionalism to insurance claims. No winking at the reader - the letter should genuinely believe its own logic.
