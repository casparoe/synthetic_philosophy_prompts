prompt: |-
  For about a year I sat on the committee that wrote the crisis-standards triage protocol for the medical ICU I run — 14 beds, regional referral hospital, we recieve transfers from four smaller sites. So allocation under scarcity is basically my native language: eligibility screens, priority scores, tie-breakers (lottery, first-come, most life-years saved), futility thresholds, no-worse-off clauses, load balancing between units, the transfer agreements with the hub, what we owe somebody we physically can't take. I've read almost no political philosophy — I know utilitarian and deontological and roughly what side-constraint means, and that's it.

  Here's the thing I want. The refugee/asylum debate keeps getting described as having two halves: who counts as a refugee at all, and who is obligated to take them in. Triage has the same two joints — who gets on the list, and which unit carries the patient — so I figure the debate should be restatable in my vocabulary. Try it, position by position, as though we were arguing about the protocol instead of about borders. Roughly these:

  - the fight over whether the persecution-based definition in the 1951 Convention actually picks out a morally real category, or whether it should be stretched to cover anyone whose basic needs can't be met at home (famine, climate, just being catastrophically poor) — i.e. the economic-migrant line and whether it's a line or a dial;
  - non-refoulement: is that a duty to admit, or only a duty not to push someone back, and can a state discharge it by funding somebody else's ward?
  - the claim that a political community may exclude people because it's *their* community, which I suspect is something like the existing census getting a vote on admissions;
  - the fair-shares picture, where the duty is owed collectively and each state only owes its slice — plus what happens to my slice when other units flatly refuse theirs;
  - and the surrogate-protection idea: protection is a stand-in for what your own state should have given you, so the obligation is the international community's and lands on whoever is geographically nearest.

  For each one, tell me what maps cleanly onto allocation logic, what only maps if you bend something (and exactly where you bent it), and what has no expression at all in protocol-writing language. Flag the bends explicitly. Don't quietly load in triage's own assumptions — one decision-maker with authority over the whole pool, a fixed and knowable capacity, patients who have no say in being there, a good that can be measured in the same units for everyone — and then hand them back to me as neutral translation. If one of these positions only sounds coherent once you've smuggled those in, say so plainly.

  Then the leftover, which is the part I actually care about. Two guesses going in. First, that the right-to-exclude argument has no hook whatsoever in my framework, because nobody on my committee thinks the current occupants of the ICU get to veto an admission. Second, that non-refoulement will turn out to be a constraint on where a patient goes *afterward*, which is structurally unlike anything in allocation, since allocation is entirely about who comes *in*. Tell me whether I've got those right, wrong, or half-right.

  And end with a verdict rather than a shrug. For each piece that fails to translate: is the failure a limit of my vocabulary — triage is just missing a concept the refugee debate genuinely needs — or is it evidence that the original position wasn't really making a claim at all, but expressing an allegiance or leaning on a premise nobody ever argued for? Take a side per item and defend it. I'd much rather have a conclusion I can push back on than a balanced tour of both readings.

  No reading list or citations at the end, please — I'm not going to look anything up and I don't want invented titles.
reasoning: |-
  Okay, the user is an ICU director who's deeply involved in crisis-standards triage protocols. They want to map refugee policy debates onto their triage framework. Let me start by understanding their main points. They mentioned five key areas: the definition of refugee, non-refoulement, the right to exclude, fair shares, and surrogate protection.

  First, the persecution-based vs. basic needs definition. In triage, eligibility is based on medical need, like organ failure. Extending to basic needs would be like admitting patients with chronic conditions not immediately life-threatening. But in ICU, that's not done because resources are for acute cases. The user might be questioning if the economic migrant debate is similar—whether the convention's strict definition is necessary or if it should be broader. The bend here is that in medicine, need is objective, while refugee status involves normative judgments. So the translation has a bend because the criteria aren't as clear-cut in the refugee context.

  Next, non-refoulement. In triage, this is like not discharging a patient to a worse situation. But in allocation, decisions are about admission, not post-transfer. So mapping it as a constraint on discharge is a structural bend. The user thought non-refoulement is about after admission, which aligns with their view. The failure here is that triage doesn't handle post-admission obligations well, showing a gap in their framework.

  The right to exclude. In the ICU, current patients don't get a say. Citizens in a state do. This doesn't map because triage assumes a single authority, not communal ownership. The user guessed this has no hook, and they're right. The failure is that the refugee debate includes collective self-determination, which triage ignores. So the position isn't incoherent; it's just outside the triage paradigm.

  Fair shares. In ICU, load balancing distributes patients based on capacity. But if other units refuse, the duty falls back to the referring unit. In refugee policy, states might avoid their share, leading to unfair burdens. The bend is that triage has enforcement mechanisms (protocols, authority) while international agreements don't. The user's point about others refusing their share highlights a difference in enforceability.

  Surrogate protection. Nearest hospital takes the patient, similar to geographical proximity in refugee cases. But triage uses proximity for efficiency, not moral obligation. The bend is reframing efficiency as duty. The user might see this as a practical approach, but the moral basis differs.

  The user's guesses: Right to exclude has no hook—correct, because ICU patients aren't stakeholders like citizens. Non-refoulement is about post-admission—also correct, but triage doesn't handle that, showing a vocabulary limit.

  For verdicts: The definition debate's bend shows triage's need is objective, while refugee status is normative. Non-refoulement's structural bend reveals a gap in triage for post-admission constraints. Right to exclude's failure indicates triage lacks communal ownership concepts. Fair shares' bend highlights enforceability issues. Surrogate protection's bend confuses efficiency with duty.

  User's deeper needs: They want to apply their triage expertise to clarify refugee debates, possibly to find pragmatic solutions or expose inconsistencies. They might be frustrated with political rhetoric and seek a structured, logical framework to dissect arguments. By identifying where mappings fail, they can pinpoint which aspects of the refugee debate are based on unexamined premises versus genuine moral considerations.
answer: |-
  Here's the translation, position by position, with bends flagged explicitly and verdicts on translation failures. Your guesses are addressed at the end.

  **1. Persecution vs. Basic Needs (Eligibility Screen)**
  *   **Triage Mapping:** This maps directly to setting the **eligibility screen threshold**. The 1951 Convention definition (persecution) is like setting the threshold to "imminent, organ-threatening failure due to acute insult" (e.g., septic shock, massive PE). Expanding to basic needs (famine, climate, poverty) is like lowering the threshold to include "severe, life-limiting chronic decompensation likely fatal without constant intervention" (e.g., end-stage COPD on home O2 crashing *again*, severe heart failure with frequent admits).
  *   **The Bend:** In triage, "need" is defined by *physiological urgency and reversibility* within the ICU's scope. Extending to "basic needs" imports a **normative judgment about the *source* and *quality* of suffering** (persecution = morally illegitimate cause vs. poverty = "natural" cause?) that the physiological criteria deliberately avoid. Triage asks "Can *we* fix *this* acute threat *here*?" not "Is the *source* of the threat morally distinct?".
  *   **Translation Verdict:** Maps cleanly **mechanically** (setting the threshold), but bends **conceptually** by smuggling in a normative distinction about the *origin* of need that ICU criteria explicitly exclude. The failure is a **limit of your vocabulary**: Triage lacks the conceptual tools to adjudicate the moral weight of the *cause* of distress, focusing only on its *current acuity and remediability* within the unit.

  **2. Non-Refoulement (Duty to Admit vs. Not Push Back; Funding Others)**
  *   **Triage Mapping:** Non-refoulement maps imperfectly to the **"no inappropriate discharge/transfer" rule**. It's the principle that you cannot discharge/transfer a patient *to* a place/situation where they will face imminent, severe harm you know about (e.g., can't send an unstable septic patient back to a nursing home with no IV antibiotics because they're "bed-blocking," *if* no safer disposition exists). Funding another unit is like arranging and paying for transfer to *another* capable ICU.
  *   **The Bends:**
      *   **Structural Bend:** This is fundamentally about *post-admission/disposition* constraints, not the *initial allocation* decision itself, which is your framework's core focus. Your vocabulary handles "who gets in" and "where they go *initially*", not "what obligations persist *after* refusal/discharge".
      *   **Action Bend:** "Not pushing back" is a negative duty; "duty to admit" is positive. Triage's "no inappropriate discharge" is a negative constraint *on an action you are taking* (discharging/transferring). It doesn't inherently create a positive duty to *admit* someone you haven't yet assessed or accepted. Funding another unit maps reasonably to arranging transfer *if* another unit accepts, but doesn't address the core dispute: does non-refoulement *require* you to admit if *no* safe alternative (funded or not) exists?
  *   **Translation Verdict:** Maps only with **significant structural and conceptual bending**. It forces a post-admission concept (safe disposition) onto a framework built for initial allocation. Your guess is **half-right**: It *is* about constraints afterward, which *is* structurally unlike core allocation logic. The failure is a **limit of your vocabulary**: Triage protocols assume discharge/disposition is either successful termination of care or transfer *under protocol*, not a core locus of contested moral obligation distinct from admission.

  **3. Right to Exclude (Political Community Ownership)**
  *   **Triage Mapping:** This has **no direct or clean mapping**. The closest, highly strained analogy is suggesting the **current census of patients (or their families!) in the ICU should vote on or veto new admissions** based on perceived impact on "their" unit's culture, resources, or comfort.
  *   **The Bend (Attempted):** This analogy fundamentally **breaks the core assumptions** of triage. Your framework assumes:
      *   A single decision-maker/committee acting under defined rules/protocols for the *system's* good.
      *   Patients are passive recipients of care based on need, not stakeholders with ownership rights over the resource.
      *   The resource (ICU beds) exists to serve a defined population/system need, not as the collective property of its *current* occupants.
      *   **BEND:** Smuggling in the idea that the *current occupants* have a proprietary stake fundamentally contradicts the impartial, needs-based allocation logic. It introduces a stakeholder (current occupants/citizens) with interests potentially *opposed* to the needs of the queue (asylum seekers).
  *   **Translation Verdict:** **No coherent expression**. Your framework lacks the concept of communal ownership/resource sovereignty vested in the *current beneficiaries* rather than an impartial system manager. Your guess is **right**: There is no hook. This is **evidence that the original position relies on a premise (communal ownership/sovereignty granting exclusion rights) external to and incompatible with the core logic of impartial, needs-based allocation**. It's an allegiance, not an argument deducible from allocation principles.

  **4. Fair Shares (Collective Duty, Individual Slice, Shirking Units)**
  *   **Triage Mapping:** This maps cleanly to **load-balancing protocols and transfer agreements**. Your duty is to your regional system. You calculate capacity across units (state quotas). You accept transfers based on your agreed slice (fair share). If Unit B refuses a patient they should take, the duty *may* fall back to Unit A (referring unit/nearest safe unit) *if* the patient cannot be safely held or diverted elsewhere – but this strains the system and violates the agreement.
  *   **The Bends:**
      *   **Enforcement Bend:** In your ICU system, there's (presumably) a higher authority (hospital admin, regional health body) that can *enforce* the protocol and penalize/pressure a refusing unit. The international system largely lacks this. The "what happens when others refuse" question highlights this. Your protocol likely has escalation paths; international law often doesn't.
      *   **Scope Bend:** "Fair share" in triage is calculated based on *capacity* and *system need*. In the refugee debate, "fair share" often incorporates normative factors beyond capacity (GDP, historical responsibility, etc.) which aren't part of pure load-balancing.
  *   **Translation Verdict:** Maps **very cleanly** to the mechanics of load-balancing and transfer agreements. The bends are minor: the **enforcement mechanism** is stronger/clearer in your system, and the **calculation criteria** might be simpler (capacity-driven vs. normatively weighted). The core concept of distributed responsibility based on agreed shares and the problem of non-compliance translate directly. Your point about "what happens to my slice when others refuse" is precisely the operational headache of shirking units.

  **5. Surrogate Protection (Duty Lands on Nearest)**
  *   **Triage Mapping:** This maps to the principle that **the geographically closest capable unit accepts the patient first**, especially in emergencies or when immediate stabilization is critical, before considering load-balancing transfers. It's the "stabilize now, sort out system placement later" rule driven by proximity for efficiency and immediacy of need.
  *   **The Bend:** In triage, proximity is primarily a **practical efficiency and urgency consideration**, not the *moral foundation* of the duty. The duty stems from system membership and capacity, not geography *itself*. Geography is a heuristic for timely access. The surrogate-protection argument *moralizes* proximity ("nearest has the primary duty *because* nearest"). Your framework uses proximity to *fulfill* the duty efficiently, not to *define* who *has* the duty in the first place.
  *   **Translation Verdict:** Maps **cleanly on the surface** (nearest unit takes it), but with a **conceptual bend**. You're using geography as a *practical tool* within a system-based duty. The surrogate argument uses geography as the *moral source* of the duty. The failure is **evidence that the original position leans on an unargued premise**: that proximity *creates* a special moral obligation stronger than, or prior to, obligations based on capacity or systemic fairness. Your framework shows proximity is a useful *dispatch rule*, not a foundational moral principle.

  **Verdicts on Your Guesses:**
  1.  **Right to Exclude:** You are **right**. It has no hook. The failure is **evidence** the position relies on an external premise (communal ownership/sovereignty) incompatible with impartial allocation logic. It expresses allegiance, not an allocation argument.
  2.  **Non-Refoulement:** You are **largely right, but incomplete**. It *is* structurally focused on constraints *after* an admission/refusal decision, unlike core allocation logic. However, the "duty to admit" vs. "duty not to push back" debate *within* non-refoulement *does* touch on the admission threshold, but its core unique element (the negative constraint on harmful removal) is indeed post-allocation. The failure is primarily a **limit of your vocabulary**, which lacks robust concepts for post-admission/disposition obligations.

  **Final Tally of Failures:**
  *   **Limit of Vocabulary:** Persecution/Basic Needs (normative cause of need), Non-Refoulement (post-admission obligations).
  *   **Evidence of Unargued Premise/Allegiance:** Right to Exclude (communal ownership), Surrogate Protection (geography as moral source).
  *   **Clean or Minor Bend:** Fair Shares (minor enforcement bend), Surrogate Protection (minor conceptual bend on *why* proximity matters).
