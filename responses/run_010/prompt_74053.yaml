        - The activity shows that for some families, we can define a choice function explicitly, for others we can't. But the axiom of choice says that even if we can't define one, there still exists a choice function.
        - The well-ordering principle: In the Vitali family, if we could well-order the reals, then we could pick the least element in each equivalence class. But well-ordering the reals is equivalent to the axiom of choice, so it's circular.
        - Non-measurable sets: The Vitali set is non-measurable, and its existence relies on the axiom of choice. Without choice, it is consistent that all sets are measurable.
        - What the activity cannot reproduce: 
            - The independence of the axiom of choice from ZF. We simply state it.
            - The fact that the existence of a choice function for any family of nonempty sets is not disprovable in ZF. We explain that our failure to write a rule doesn't mean it doesn't exist.

     **Minute-by-minute timeline:**

     - 0-5 min: Introduction.
     - 5-20 min: Round 1 (5 min for teams to work, 5 min for challenge by instructor, and 5 min for scoring and transition).
          - 5-10: Teams work on their rules.
          - 10-15: Instructor challenges one set per team (quickly).
          - 15-20: Scoring and brief discussion.
     - 20-40 min: Round 2.
          - 20-25: Teams work.
          - 25-35: Challenge.
          - 35-40: Scoring.
     - 40-60 min: Round 3.
          - 40-45: Teams work.
          - 45-55: Challenge (all fail).
          - 55-60: Betting on existence.
     - 60-75 min: Debrief.

     **Specific contents for each round:**

     **Round 1 Envelopes:**

     - Family 1: {{1,2}, {3,4}, {5,6}} 
          - Description: "The family of sets: {1,2}, {3,4}, {5,6}."
          - Example: already given.

     - Family 2: { [0,1], [2,3], [4,5] } 
          - Description: "The family of closed intervals: [0,1], [2,3], [4,5]."

     - Family 3: The family of all nonempty subsets of {1,2,3}. 
          - Description: "The family of all nonempty subsets of the set {1,2,3}. There are 7 sets: {1}, {2}, {3}, {1,2}, {1,3}, {2,3}, {1,2,3}."

     **Round 2 Envelopes:**

     - Family 1: The family of all unordered pairs of the form {n, n+1} for integer n. 
          - Description: "The family of sets: for every integer n, the set {n, n+1}."
          - Example sets: {0,1}, {1,2}, {-1,0}."

     - Family 2: The family of all nonempty open intervals (a, b) with a and b rational numbers and a < b.
          - Description: "The family of all open intervals with rational endpoints. For example, (0,1), (1/2, 3/2), (-1, 0)."

     - Family 3: The family of all circles in the plane that pass through the origin and have positive radius.
          - Description: "Each set in the family is a circle in the plane that passes through the origin (0,0). We want to pick one point on the circle."
          - Example: the circle of radius 1 centered at (0,0) -> points (1,0), (-1,0), etc. Another example: the circle of radius 1 centered at (1,0) -> passes through (0,0) and (2,0)."

     For Family 1 in Round 2, a rule might be: for the set {n, n+1}, pick the smaller one. That works. 
     For Family 2, a rule: pick the midpoint. Works because a and b rational -> (a+b)/2 rational and in the interval.
     For Family 3, as above, pick the highest point (lexicographic order if tie: highest y, then highest x).

     But we want at least one to be challenging. For Family 2, if a team writes: "pick a rational number in the interval", that is not a rule because it doesn't specify which one. So they should fail when challenged with an interval and asked to apply the rule.

     **Round 3 Envelope:**

     - Family: The equivalence classes of the real numbers under the relation x~y if x-y is in the rational numbers.
          - Description: "The family of sets: for each real number x, the set is { x+q : q is a rational number }. Note: each set is the set of all real numbers that differ from x by a rational number. Example: one set is the set of all rational numbers (when x=0). Another set is the set of all numbers that are an integer plus 0.5 (when x=0.5)."

     **Adversarial Challenge Protocol:**

     - After a team writes a rule, the instructor selects a set from the family that was not in the example (or if the family is given by a parameter, selects a parameter not in the example) and asks the team to apply their rule to that set. 
     - The team must produce a unique element.
     - If they cannot (either because the rule is ambiguous or because it doesn't specify), then the rule fails.
     - The instructor is the arbiter.

     **Scoring Scheme:**

     - Round 1 and 2: 
          - If the rule works for the challenge set, the team gets 2 points.
          - If it fails, 0 points.
     - Round 3: 
          - No points for rule-writing because we expect failure.
          - Betting: teams bet 0 to 5 points on whether a rule exists. They get double their bet if they are right, and lose the bet if they are wrong. But since we reveal that it's independent, we might not do that. Instead, we can say: after the debrief, we will collect the bets and tell them the answer. But to avoid complication, we can have them bet and then immediately reveal that mathematics says it's independent, and then not score the bet? Or we can use the betting to lead into the discussion.

     Alternatively, for Round 3 betting: 
          - We ask: "Do you think such a rule exists?" 
          - They bet points they have earned so far (or a portion). 
          - Then we say that in standard mathematics, we can assume it exists (by the axiom of choice) or not. But then how to score? Maybe not score the bet, but use it to motivate the discussion.

     Given time, we might skip scoring the bet and use it to gauge their understanding.

     **Addressing the Predicted Moves:**

     1. **Least element in the Vitali class:** 
          - If a team says: "well-order the reals and pick the smallest element in each equivalence class", we say: "That would work if we had a well-ordering of the reals. But do we have such a well-ordering? In fact, the existence of a well-ordering of the reals is not something we can construct; it is equivalent to the axiom of choice. So your rule assumes the very thing we are trying to avoid assuming."

     2. **Restricting to [0,1]:** 
          - If they say: "restrict to the representatives in [0,1) and then for each class, take the unique representative in [0,1)", then this is exactly the Vitali set construction. But they have to define it. How do they pick the representative in [0,1) for a given equivalence class? 
          - For a given equivalence class S, they want to pick the unique x in S ∩ [0,1). But how? They might say: "take the fractional part of the number", but that lands in [0,1). But is that well-defined for the class? Note: if x is in the class, then x+q for q rational might have fractional part that is not the same as x. But wait, the fractional part is defined modulo 1, and adding an integer changes the integer part. However, adding a non-integer rational? For example, 0.5 and 0.5+0.5=1.0 -> fractional part 0. So they are different. 
          - Actually, two numbers in the same equivalence class may have different fractional parts. For example, 0.5 and 1.0 are in the same class (differ by 0.5, rational) but 0.5 has fractional part 0.5 and 1.0 has fractional part 0. 
          - So the fractional part is not well-defined for the class. 
          - They might try: for a given class, consider the set { fractional part of x : x in the class }. This is a set of numbers in [0,1) that are dense? and we need to pick one. But which one? The smallest? But there might not be a smallest.
          - So this doesn't work. We can then discuss why this restriction doesn't immediately give a rule.

     3. **Vocal minority thinking no rule exists:** 
          - In the debrief, we emphasize: our inability to write down a rule does not mean that no such function exists. In fact, the axiom of choice asserts that such a function exists even if we can't describe it. And it is impossible to prove the existence of such a function in ZF without choice, but also impossible to disprove it. So it's an assumption we can choose to make or not.

     **Substitute for Round 3 if needed:** 
          - We could use a different family: the equivalence classes of sequences of natural numbers under the equivalence of being eventually equal? But that might be too advanced. 
          - Or the family of all subsets of the real numbers (which is the power set). Then we want to pick an element from each nonempty subset of reals. This is even harder. 
          - The Vitali family is standard and leads to a non-measurable set, so we keep it.

     Given the complexity, we proceed with the Vitali family.

     **Final Note:** 
          - The gap between the students' failure to write a rule and the mathematical existence is exactly the point: the axiom of choice is about existence without explicit construction. We must be clear that the activity shows the need for an axiom because our usual constructive methods fail, not because the function doesn't exist.

     We hope this design will work. The first time, it might be tight on time, so we should be ready to cut short Round 2 if needed.
answer: |-
  ### Detailed Session Plan: Encountering the Axiom of Choice

  **Overview:**  
  This 75-minute session uses a team-based challenge to guide students toward recognizing the need for an axiom to guarantee choice functions for arbitrary families of sets. Teams write selection rules, face adversarial challenges, and confront a family (Vitali-type) where no constructive rule is possible. The debrief connects to Russell's shoes/socks analogy, clarifies the role of uniform rules, and distinguishes between provable and axiomatic existence.

  ---

  ### **Materials & Setup**
  - **Teams:** 6 teams of 4 students each.
  - **Envelopes:** Prepare envelopes for 3 rounds. Each contains a family description and 2–3 example sets. Notation uses basic set theory (students know sets, functions, equivalence relations).
  - **Whiteboard:** Track scores and record key proposals.
  - **Handout:** Summary of families and rules (for reference during challenges).

  ---

  ### **Round-by-Round Envelope Contents**
  **Notation Clarification:**  
  - "Pick a rule" means define a function \(f\) such that for any set \(A\) in the family, \(f(A) \in A\).
  - Rules must be **explicit and unambiguous**: Given \(A\) and the rule, anyone computes the same output.

  #### **Round 1: Trivial Rules (10 min)**
  *Goal: Everyone succeeds. Build confidence in the game.*  
  - **Family 1 (Disjoint Intervals):**  
    \(\big\{ [2n, 2n+1] \mid n \in \{0, 1, 2\} \big\}\).  
    *Examples:* \([0,1]\), \([2,3]\), \([4,5]\).  
    *Expected rule:* Pick the left endpoint, or minimum.  

  - **Family 2 (Explicit Finite Sets):**  
    \(\big\{ \{3k, 3k+1, 3k+2\} \mid k \in \{0, 1, 2\} \big\}\).  
    *Examples:* \(\{0,1,2\}\), \(\{3,4,5\}\), \(\{6,7,8\}\).  
    *Expected rule:* Pick the smallest element.  

  - **Family 3 (Rational Coordinates):**  
    \(\big\{ \{ (q, 0) \mid q \in \mathbb{Q} \} \big\}\) (the x-axis in \(\mathbb{Q}^2\)).  
    *Examples:* Points \((0,0)\), \((1,0)\), \((-1,0)\).  
    *Expected rule:* Pick \((0,0)\) or any fixed rational point.  

  **Why it works:** Rules are intuitive and computable without choices.

  ---

  #### **Round 2: Non-Trivial Rules (20 min)**
  *Goal: Rules exist but are hard to define; some teams fail due to ambiguity.*  
  - **Family 4 (Unordered Rational Pairs):**  
    \(\big\{ \{a, b\} \mid a, b \in \mathbb{Q}, a \neq b \big\}\).  
    *Examples:* \(\{0, 1\}\), \(\{-1, 1/2\}\), \(\{3, -3\}\).  
    *Trap:* "Pick the closest to 0" fails for \(\{-1,1\}\).  
    *Working rule:* Pick \(\min(a, b)\) (using \(\mathbb{Q}\)’s order).  

  - **Family 5 (Open Intervals with Rational Endpoints):**  
    \(\big\{ (a,b) \mid a, b \in \mathbb{Q}, a < b \big\}\).  
    *Examples:* \((0,1)\), \((-1, 1/2)\), \((2, 3)\).  
    *Trap:* "Pick a rational in the interval" is ambiguous.  
    *Working rule:* Pick the midpoint \(\frac{a+b}{2}\) (rational, unambiguous).  

  - **Family 6 (Lines Through Origin in \(\mathbb{Q}^2\)):**  
    \(\big\{ \{ (qx, qy) \mid q \in \mathbb{Q} \} \mid (x,y) \in \mathbb{Z}^2 \setminus \{(0,0)\} \big\}\) (lines with rational direction).  
    *Examples:* Line with direction \((1,0)\), line with direction \((1,1)\).  
    *Trap:* "Pick a point" without specification fails.  
    *Working rule:* Pick the point with minimal \(x > 0\), or \((x,y)\) normalized to integers.  

  **Expected failure:** Teams proposing ambiguous rules (e.g., "pick a point") lose challenges.

  ---

  #### **Round 3: The Vitali-Type Family (20 min)**
  *Goal: All teams fail. Motivate axiomatic assumption.*  
  - **Family 7 (Vitali Equivalence Classes):**  
    \(\big\{ \{ x + q \mid q \in \mathbb{Q} \} \mid x \in \mathbb{R} \big\}\) (reals modulo rationals).  
    *Examples:*  
    - Class of \(0\): \(\{ \ldots, -1, 0, 1, \ldots \}\) (all rationals).  
    - Class of \(\sqrt{2}\): \(\{ \sqrt{2} + q \mid q \in \mathbb{Q} \}\).  
    *No known constructive rule exists in ZF.*  

  **Predictable student attempts:**
  1. **Least element?** "Pick the smallest real in the class."  
     *Response:* "Reals have no least element under \(<\). If you mean a different order, you need to define one—but that’s what we’re assuming doesn’t exist yet."  
  2. **Restrict to \([0,1)\)?** "Pick the element in \([0,1)\)."  
     *Response:* "How? For a class \(C\), you must uniquely pick one element. \([0,1) \cap C\) has infinitely many candidates. Define a rule to pick one?" (Leads to same problem).  
  3. **Well-ordering retreat:** "Well-order \(\mathbb{R}\) and pick the least."  
     *Response:* "Well-ordering \(\mathbb{R}\) is equivalent to the axiom of choice. You’re assuming what we’re questioning!"

  ---

  ### **Adversarial Challenge Protocol**
  1. **Rule Submission:** Teams write rules on paper.  
  2. **Challenge:** Instructor gives a rival team:  
     - The rule.  
     - A set from the family **not in the examples**.  
     - The rival computes \(f(A)\) and reports the output.  
  3. **Validation:**  
     - **Valid Rejection:** Rule is ambiguous (multiple outputs possible) or undefined for \(A\).  
     - **Invalid Rejection:** Rule is clear and outputs one element. (Instructor overrules frivolous challenges.)  
  4. **Scoring per Round:**  
     - Successful rule: **+2 points**.  
     - Failed rule: **0 points**.  
     - Successful challenge (spotting ambiguity): **+1 point**.  
     - Frivolous challenge: **-1 point** (to deter bad-faith objections).

  ---

  ### **Timeline (75 min)**
  1. **Intro (5 min):** Explain rules, scoring, and goal ("Write unambiguous selection rules").  
  2. **Round 1 (10 min):** Teams work (5 min), challenges (5 min). All should succeed.  
  3. **Round 2 (20 min):** Work (10 min), challenges (10 min). Some fail due to ambiguity.  
  4. **Round 3 (20 min):** Work (10 min), challenges (10 min). All fail.  
  5. **Betting Twist (5 min):** Teams bet 0–5 points: "Does a rule exist for Family 7?" (No scoring yet).  
  6. **Debrief (15 min):** Discuss independence, axiom of choice, and Russell’s analogy.

  ---

  ### **Debrief Sequence**
  **Part 1: Russell’s Analogy and Uniform Rules (8 min)**  
  1. **Recall Russell:** "Infinitely many pairs of shoes: pick the left. Socks: no distinguishable feature, so AC needed."  
  2. **Complicate it:**  
     - Ask: "What if shoes are presented as unordered pairs? Can you still pick one?" *Probably not without a rule.*  
     - **Key Insight:** The distinction isn’t shoes vs. socks, but **uniform definability**.  
       - Shoes with a fixed "left/right" label: **Rule exists** (pick "left").  
       - Shoes without labels: **No rule** (like socks).  
       - Socks with a fixed ordering: **Rule exists** (e.g., pick the smallest).  
  3. **Connect to Activity:**  
     - Round 1: Families had intrinsic orders (min, endpoint).  
     - Round 3: No intrinsic order → no uniform rule.  
     - **Takeaway:** Some families admit rules, others don’t—but existence isn’t about the sets themselves, but how they’re presented.

  **Part 2: What Survives the Activity? (7 min)**  
  | Concept               | Survives Activity?                                 | Notes |  
  |-----------------------|---------------------------------------------------|-------|  
  | Countable Choice      | ✔️ (Round 2 families were countable)              | Students saw rules exist for countable families. |  
  | Full Choice           | ✖️ (Activity shows non-constructive need)         | Vitali family requires full AC. |  
  | Well-Ordering Principle | ⚠️ (Mentioned but not illustrated)                | Students proposed it; explain it’s equivalent to AC. |  
  | Non-Measurable Sets   | ✖️ (Too advanced)                                | Mention Vitali sets are non-measurable as motivation. |  
  | Independence from ZF  | ✔️ (Core lesson: failure ≠ impossibility)        | Emphasize: We didn’t prove non-existence. |  

  **Gap Alert:** Student failure is **epistemic** (human limitation), not proof of undefinability. Clarify:  
  - Some undefinable functions exist in ZFC (e.g., Vitali set selector).  
  - AC asserts existence without construction.  

  ---

  ### **Predictable Issues & Responses**
  1. **"Pick the least element in Vitali class!"**  
     - *Response:* "Reals under \(<\) have no least element. If you propose a well-ordering, that assumes AC—which is the very thing we’re questioning. Can you define a well-ordering of \(\mathbb{R}\) without AC?"  

  2. **"Restrict to [0,1) representatives."**  
     - *Response:* "Good idea! But how do you pick the representative in \([0,1)\) for a given class? For example, the class containing \(\sqrt{2}\) has elements \(\sqrt{2} - 2, \sqrt{2} - 1, \sqrt{2}, \sqrt{2} + 1\). Which one is in \([0,1)\)? You need a rule to pick one—but that’s the same problem." Use this to highlight that shifting the set doesn’t resolve ambiguity.  

  3. **Vocal Minority: "No rule exists!"**  
     - *Response (during debrief):*  
       1. "Your intuition is understandable! But math doesn’t work that way. We didn’t prove impossibility; we just couldn’t construct a rule.  
       2. In fact, ZF (without AC) can’t prove such a rule exists—but it also can’t prove it doesn’t!  
       3. AC is an axiom that asserts existence when we can’t define rules. It’s like assuming parallel lines in geometry—useful but independent."  

  ---

  ### **Adjustments for Reliability**
  - **Vitali Substitute?** If Vitali feels too abstract, use:  
    **Family 7' (Functions \(\mathbb{N} \to \{0,1\}\)):**  
    \(\big\{ f: \mathbb{N} \to \{0,1\} \big\}\).  
    *Task:* Pick one function from each subset of \(\mathcal{P}(\mathbb{N})\) (encoded as functions). Same issue: No rule without AC.  
  - **Why Vitali Works:** It’s visual (reals on a line) and leads to measurable sets. Stick with it unless students lack real analysis.  

  ---

  ### **Post-Session Note**
  **What to Emphasize:**  
  - Failure to write a rule \(\nRightarrow\) non-existence.  
  - AC is a **non-constructive existence axiom** for arbitrary families.  
  - Some math (e.g., measure theory) requires AC; some (e.g., computability) avoids it.  

  **What to Avoid:**  
  - "AC is true/false." It’s an assumption that enriches math but has trade-offs.  
  - Overpromising on definability. Students may conflate "no rule we found" with "undefinable." Stress the epistemic gap.  

  This design forces confrontation with the need for AC while grounding abstraction in hands-on struggle. Run it as a discovery game, and debrief thoroughly to cement the lesson.
