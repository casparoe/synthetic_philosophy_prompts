prompt: |-
  I am in the second year of my second term on the city council of a mid-sized city of roughly two hundred thousand — an old rail and manufacturing core, a university that has been buying up houses for a decade, and a rental market that went from slack to painful somewhere around 2021. Rezonings and discretionary use permits that the planning commission cannot resolve come to us for a final vote, and I have been keeping a record of my own votes with the reasons I gave on the floor at the time, because a colleague now claims he can no longer predict how I will vote and suspects I have been reasoning backwards from outcomes. I would like to test that claim rigorously. The record, in order: a proposal to build forty market-rate units on an infill lot in a single-family district, with no off-street parking, which I opposed, saying the street was already at capacity and that two hundred organized residents were owed an answer rather than an override; twelve units on that same street, thirty percent of them deed-restricted at sixty percent of area median income with a setback variance, which I supported, saying the scale was unobjectionable and the restriction was doing real work; a homeowner in the city's most expensive quadrant seeking to legalize a garage apartment her caretaker had occupied for nine years, over the block association's formal objection, which I supported, saying the prohibition was protecting nobody and merely collecting a toll from the person with the least bargaining power; a church's plan to convert half its lot into sixty units of permanent supportive housing for people leaving shelter, against near-unanimous turnout from surrounding renters about parking and sightlines, which I supported, saying the turnout was large and the objections thin and that the people who would be housed were not in the room; a three-hundred-unit market-rate tower within four hundred feet of a transit stop, with no affordable units but a substantial fee in lieu, which I supported, saying I refused to demand both density and its price and end up with neither; and a rezoning of a light-industrial strip where eleven immigrant-owned repair shops and a produce warehouse employ about two hundred people, to mixed-use residential, with the developer offering twenty percent affordable and no relocation plan of any kind, which I opposed, saying that affordable units at the edge of the city were not a substitute for the wages that strip was producing and that nobody had offered those two hundred workers anything at all.

  The case comes up in three weeks. A single family-owned LLC holds a contiguous block of nine walk-ups, eighty-four households in total, at rents well below anything else in the city, occupied overwhelmingly by recent immigrants and by seniors on fixed incomes; the boiler is failing, the roofs are past due, and the owner has stopped doing non-emergency repairs. The proposal rezones the block for six stories and one hundred eighty units, with fifteen percent affordable at sixty percent of area median income, relocation assistance during construction, and a right of first return for existing households. The catch, from the tenant association's analysis: return rents would run roughly double what households pay now, and because of the household-size provisions in the draft agreement, about twenty of the eighty-four households would not fit into the units they would return to. The ground-floor redesign also eliminates the block's laundromat and a corner grocery that employs eight people, neither of which has another site within a mile. The single-family association two blocks away supports the rezoning enthusiastically, and I have read their newsletter carefully enough to know that they mean the future population of the block at least as much as its buildings. The owner states plainly that a no vote means a sale to a buyer who will raise rents and do no repairs, and I have no particular reason to think this is a bluff. There is a transit stop two blocks away.

  What I want is not my vote but an account of the rule I am running. Reconstruct the decision procedure that best explains all six precedents, and say honestly whether any of my stated floor reasons look like post-hoc rationalizations, or whether one vote is better treated as an outlier that should be set aside. Then give me the other rules that fit the same six votes about as well — I can see at least a housing-supply rule, a distributional rule keyed to affordability, a rule about protecting the existing users and workers of a place rather than its built form, and something in the neighborhood of Lefebvre's right to the city, understood as a claim by people who inhabit and produce urban space but hold no entitlement in it — and show me where those rules actually diverge on the new case rather than merely gesturing at them. Identify which of my precedents is the closest analog and precisely where the analogy breaks down, since the new case seems to have a relocation plan where the industrial strip had none, and to have the neighborhood association on the project's side for reasons I find objectionable. Tell me which single further proposal, if it came before us, would most cleanly discriminate between the competing readings of my record. And if the six precedents genuinely underdetermine this one, say so plainly and lay out what principle I would be adopting by voting yes and what I would be adopting by voting no — in particular, what each choice assumes about whether the city's remaining low-rent stock is a commons to be defended or a decaying asset to be traded for something better, and what that assumption would commit me to the next time a similar block comes forward.
reasoning: |-
  We are given six precedents (votes) with reasons. We need to infer a decision rule that explains all six. Then, we'll consider alternative rules and see how they diverge on the new case. We also need to identify the closest precedent and where the analogy breaks, and suggest a future proposal that would help discriminate between the rules.

  First, let's summarize the six votes:

  1. **Vote: Opposed**  
     - Proposal: 40 market-rate units on an infill lot in a single-family district, no off-street parking.
     - Reason: Street already at capacity; 200 organized residents deserved an answer, not an override.

  2. **Vote: Supported**  
     - Proposal: 12 units on the same street, 30% deed-restricted at 60% AMI, with setback variance.
     - Reason: Scale unobjectionable, restriction doing real work.

  3. **Vote: Supported**  
     - Proposal: Legalize a garage apartment (for caretaker) over block association's objection.
     - Reason: Prohibition was protecting nobody and merely collecting a toll from the person with least bargaining power.

  4. **Vote: Supported**  
     - Proposal: Church converting half its lot to 60 units of permanent supportive housing, despite renter turnout about parking and sightlines.
     - Reason: Turnout large but objections thin; the people to be housed were not present.

  5. **Vote: Supported**  
     - Proposal: 300-unit market-rate tower near transit, no affordable units but fee in lieu.
     - Reason: Refuse to demand both density and its price and end up with neither.

  6. **Vote: Opposed**  
     - Proposal: Rezoning light-industrial strip (with 200 jobs) to mixed-use residential, 20% affordable, no relocation plan.
     - Reason: Affordable units at edge of city not a substitute for the wages; no offer to the 200 workers.

  Now, we look for a consistent rule.

  **Inferring the Rule:**

  - In vote 1: Opposed due to existing residents' concerns (traffic) and the organized opposition (200 residents). The project did not include any affordable housing and was market-rate.
  - In vote 2: Supported because the scale was small and it included affordable housing (30% at 60% AMI). The affordable component was key.
  - Vote 3: Supported because it helped a vulnerable individual (caretaker) against a rule that was not serving a protective purpose but was instead exploitative. The focus was on the individual with low bargaining power.
  - Vote 4: Supported because it provided housing for a very vulnerable group (people leaving shelter) and the opposition's concerns (parking, sightlines) were deemed weak. The absence of the future residents was noted.
  - Vote 5: Supported because it was a dense development near transit and the fee in lieu was acceptable. The trade-off between density and affordability was acknowledged: taking one (density) without demanding both.
  - Vote 6: Opposed because it would displace existing jobs (200 workers) without any plan for them, and the affordable housing was not an adequate replacement for the lost economic opportunity.

  A possible rule that emerges is one that balances the need for new housing (especially affordable) with the protection of existing vulnerable residents and workers. The councilor seems to prioritize:

  - **Protecting vulnerable populations** (low-income residents, workers, individuals with low bargaining power) from displacement or harm.
  - **Supporting affordable housing** when it is part of the project and when the scale is appropriate.
  - **Considering the impact on existing communities** (e.g., traffic, jobs) but sometimes overriding NIMBY concerns when the objections are weak and the project serves a greater social good (like supportive housing).

  Specifically, the rule might be:

  **"Support projects that provide net social benefit, especially for vulnerable populations, without unduly harming existing vulnerable groups or the broader community. Oppose projects that cause significant harm to existing vulnerable groups (like displacement without compensation) or that ignore organized community concerns when they are substantive."**

  Now, let's check if this rule fits all:

  1. Opposed: because of harm to existing residents (traffic, organized opposition) and no affordable housing to offset the harm. The project did not provide a net social benefit that outweighed the harm to the existing community.

  2. Supported: provided affordable housing (benefit to vulnerable) and the scale was unobjectionable (minimal harm). The setback variance was acceptable given the benefit.

  3. Supported: helped a vulnerable individual (caretaker) and the harm (to the block association) was not substantive (the prohibition was not protecting anyone). Net social benefit.

  4. Supported: provided housing for a very vulnerable group (people leaving shelter). The opposition (parking, sightlines) was considered thin (not substantive harm) so the net benefit was clear.

  5. Supported: density near transit is a social benefit (housing supply, environmental). The fee in lieu was acceptable as an affordability component. The trade-off was necessary to get the density.

  6. Opposed: caused harm to existing vulnerable workers (200 jobs lost without relocation) and the affordable housing was not an adequate replacement. The net social benefit was negative because the loss of jobs (and the economic activity) was too great.

  **Are any stated reasons post-hoc rationalizations?**

  Looking at the reasons given, they seem consistent with the rule above. The councilor's reasons focus on the vulnerable groups and the balance of benefits and harms. There doesn't seem to be a clear outlier. However, let's consider:

  - Vote 5: The reason was about not demanding both density and its price. This could be seen as a pragmatic stance to get the housing built. It fits the rule because the harm (no affordable on-site) was offset by the fee and the benefit of density near transit. The councilor did not see the lack of affordable units as a deal-breaker because the fee was substantial and the location was transit-rich.

  - Vote 1 and 2: Both on the same street, but different outcomes. The reasons given (capacity and scale) are consistent. The first project was larger (40 units) without affordable housing and in a context of organized opposition, while the second was small (12 units) with affordable housing and without the same level of harm.

  So, no vote stands out as an obvious outlier.

  **Alternative Rules:**

  1. **Housing Supply Rule:** Always support projects that increase housing supply, especially near transit. 
     - How it fits: Would support votes 2,3,4,5. But why oppose vote 1 and 6? 
       - Vote 1: Opposed because of existing residents' concerns? This rule would likely support it. Doesn't fit.
       - Vote 6: Opposed because of job loss? This rule might not account for that. So this rule does not fit the record because it would require supporting vote 1 and 6.

  2. **Distributional Rule (Affordability Focus):** Support projects that increase affordable housing, oppose those that don't.
     - How it fits: 
       - Vote 1: No affordable, opposed: fits.
       - Vote 2: 30% affordable, supported: fits.
       - Vote 3: No direct affordability, but helped a low-income caretaker? It's marginal. The rule might not account for this.
       - Vote 4: Supportive housing is affordable, supported: fits.
       - Vote 5: No affordable units (fee in lieu might be used for affordable elsewhere, but not on-site). The rule might oppose, but the councilor supported. Doesn't fit.
       - Vote 6: 20% affordable, but opposed. Doesn't fit because the rule would support.

     So this rule fails on votes 3,5,6.

  3. **Protecting Existing Users and Workers:** Oppose projects that displace existing vulnerable residents or workers without adequate protection, support others.
     - How it fits:
       - Vote 1: Opposed because of harm to existing residents (traffic) and no mitigation: fits.
       - Vote 2: Supported because no displacement of existing? It was infill. The existing residents were still there, but the project was small. Fits.
       - Vote 3: Supported because it helped an existing user (caretaker) and the rule was harming her. Fits.
       - Vote 4: Supported because the project didn't displace anyone? The church lot conversion. The surrounding renters were not displaced, only their concerns about parking. Fits.
       - Vote 5: Supported because no displacement? It was a new tower. Fits.
       - Vote 6: Opposed because of displacement of workers without relocation: fits.

     This rule fits all six votes. However, note that in vote 4, the councilor overrode the concerns of the surrounding renters because the objections were thin. So the rule must include that the harm to existing users must be substantive.

  4. **Lefebvre's Right to the City:** Support projects that give space to marginalized groups who are excluded from the city, oppose those that displace or exclude them.
     - How it fits:
       - Vote 1: Opposed because it overrides existing residents (who are organized and presumably not the most marginalized) and doesn't provide any benefit to marginalized? Fits.
       - Vote 2: Supported because it provides affordable housing for marginalized. Fits.
       - Vote 3: Supported because it helps a marginalized individual (caretaker). Fits.
       - Vote 4: Supported because it houses a very marginalized group (people leaving shelter). Fits.
       - Vote 5: Supported because it provides housing (though market-rate) but near transit, which might be accessible? The fee in lieu might help affordability elsewhere. But the project itself is market-rate. The rule might be ambiguous. However, the councilor supported, so it must be seen as contributing to the right to the city by increasing supply. Fits.
       - Vote 6: Opposed because it displaces existing marginalized workers (immigrant-owned shops) and doesn't provide for them. Fits.

     This rule also fits all six, but note that vote 5 (market-rate) is supported because of the fee and the location. The right to the city might be interpreted as including the right to housing in general, so increasing supply is part of it.

  **The rule we inferred earlier is a blend of these, but the "protecting existing users and workers" rule seems to fit well. However, the councilor also supports projects that help vulnerable groups even if they are not currently present (like the supportive housing). So the rule must have two prongs: protect existing vulnerable groups from harm, and support projects that benefit vulnerable groups (even if they are not yet residents).**

  **The New Case:**

  - Proposal: Rezone a block of 9 walk-ups (84 households, low-rent) for 6 stories, 180 units, 15% affordable at 60% AMI, relocation assistance, right of first return. But:
    - Return rents would be double current rents, so many current residents may not afford to return.
    - About 20 households would not fit in the new units due to size.
    - Ground-floor redesign eliminates a laundromat and a grocery (8 jobs), no alternative within a mile.
  - Owner threatens that a no vote means sale to a buyer who will raise rents and do no repairs (which would also displace tenants, just without the new housing).
  - Single-family association two blocks away supports the rezoning (and they are happy about the future population change).
  - Transit stop two blocks away.

  **Analysis under the inferred rule:**

  - The project would displace 84 low-income households (vulnerable) and 8 workers. The relocation plan is inadequate because the return rents are too high and the unit sizes don't fit 20 households. Also, the loss of the laundromat and grocery harms the community (especially without a replacement within a mile).

  - On the other hand, the project provides 15% affordable units and increases housing supply. But note: the existing residents are being displaced and may not benefit. The affordable units are at 60% AMI, but the existing residents pay well below market (so they might be below 60% AMI). The right of first return is meaningless if they can't afford the rent.

  - The owner's threat: if the project is rejected, the owner will sell and the new owner will raise rents and neglect repairs. This would also lead to displacement, but without the new housing. So the status quo is bad and getting worse.

  - The rule: We must weigh the harm to existing vulnerable groups (displacement without adequate protection) against the benefits (new affordable units, more housing).

  In vote 6 (industrial strip), the councilor opposed because there was no relocation plan for the workers. Here, there is a relocation plan, but it is inadequate (because of the rent increase and unit size). So the harm is not mitigated.

  In vote 4 (supportive housing), the councilor supported despite opposition from renters because the opposition was thin and the project served a very vulnerable group. Here, the opposition is from the tenants themselves (the 84 households) and the harm (displacement, loss of affordable housing and local services) is substantive.

  The closest precedent is vote 6 (industrial strip) because both involve displacement of existing vulnerable groups (workers in vote 6, residents and workers in the new case). The analogy breaks down because:

  - Vote 6 had no relocation plan, while this one has a plan (but it's inadequate). However, the councilor might still oppose because the plan does not truly protect the existing residents.

  - Also, in vote 6, the affordable housing was not a substitute for the lost jobs. Here, the new affordable housing is not a substitute for the lost low-rent units because the current residents cannot afford the new units.

  Another precedent is vote 3: the councilor supported legalizing the garage apartment to help a vulnerable individual. But that was a small intervention. This is large-scale displacement.

  **Alternative Rules on the New Case:**

  1. **Housing Supply Rule:** Support because it adds 180 units (with 15% affordable) near transit. The rule would ignore the displacement of the existing tenants and workers. But the councilor opposed in vote 6 (which also added housing) because of job loss, so this rule doesn't fit the past record.

  2. **Distributional Rule (Affordability):** Support because it adds 27 affordable units (15% of 180). But the rule would have to ignore that the project displaces 84 existing low-rent households and might result in a net loss of affordable units (if the existing 84 are lost and only 27 are added). Also, the existing units are at rents well below market, so they are effectively more affordable than the 60% AMI units. The rule might not account for the displacement.

  3. **Protecting Existing Users and Workers:** Oppose because the project displaces 84 low-income households and 8 workers without adequate protection (the relocation plan is insufficient). The threat of sale and rent hikes without the project is a separate issue. The rule would say: the harm to existing vulnerable groups is too great.

  4. **Right to the City:** Oppose because the project displaces current residents (who are recent immigrants and seniors) and workers, and the new development will likely change the character to exclude them. The single-family association's support for the future population (which might be wealthier) is a sign of gentrification. The right to the city for the current residents is being violated.

  So the alternative rules diverge:

  - Housing Supply: Support
  - Distributional (if only looking at new affordable): Support
  - Protecting Existing: Oppose
  - Right to the City: Oppose

  The councilor's past record is consistent with the last two (oppose). But note the threat: without the project, the owner will sell and raise rents, which would also displace the tenants. So the status quo is not sustainable. However, the rule must focus on the project at hand. The project as proposed is harmful to the existing residents. The councilor might vote to oppose unless the relocation plan is improved (to guarantee the same rent levels, for example).

  But the question is about the rule that explains the six votes. The rule we inferred would likely lead to an oppose vote because the harm to existing vulnerable groups is not mitigated.

  **Future Proposal to Discriminate:**

  A proposal that would help distinguish between the rules:

  - **Scenario:** A project that displaces no one and adds both market-rate and affordable housing in an area without existing vulnerable residents (e.g., a vacant lot in a non-residential area) but with some community opposition about traffic.

    - Under the housing supply rule: support.
    - Under distributional: support if affordable is included.
    - Under protecting existing: support because no displacement.
    - Under right to the city: support because it adds housing without displacing.

    This does not help discriminate.

  - **Scenario:** A project that displaces a small number of vulnerable residents but provides a large number of affordable units and has a robust relocation plan (including rent control for returnees and no loss of units for the displaced). 

    - Under the housing supply rule: support.
    - Under distributional: support.
    - Under protecting existing: if the relocation plan is truly adequate, then support.
    - Under right to the city: if the displaced are well protected and the new affordable units help other vulnerable groups, then support.

    Still hard.

  - **Scenario:** A project that adds a lot of market-rate housing with no affordable component, near transit, and no displacement. 

    - This is like vote 5. The councilor supported because of the fee in lieu. So that vote already shows that the councilor is willing to accept a fee in lieu in some cases. But the rule we inferred accepted it because of the trade-off (density without demanding both). 

    However, to discriminate between the rules, consider a project that has no affordable component (not even fee in lieu) but no displacement and near transit. 

    - Housing supply rule: support.
    - Distributional rule: oppose (because no affordable).
    - Protecting existing: support (no displacement).
    - Right to the city: might oppose because it doesn't serve marginalized groups? But vote 5 had a fee in lieu so it did contribute to affordability elsewhere. Without any affordability, the councilor might oppose.

    If the councilor supports, then the rule is not purely distributional. If opposes, then affordability is a must.

    But in vote 5, the councilor supported with a fee in lieu. So without any affordability, the councilor might oppose.

  **If the six precedents underdetermine the new case:**

  The new case is complex because of the owner's threat. Without the project, the tenants might be displaced anyway. But the project as proposed does not adequately protect them. 

  The principle by voting yes:

  - Adopting the view that the city's low-rent stock is a decaying asset that must be traded for something better (new, modern housing with some affordable units) because the status quo is unsustainable. This would commit the councilor to supporting similar redevelopments in the future, even if they displace current residents, as long as there is some affordable component and relocation assistance, because the alternative is decay and eventual displacement.

  The principle by voting no:

  - The low-rent stock is a commons to be defended. The city should find ways to preserve existing affordable housing and protect current residents. This would commit the councilor to opposing projects that displace low-income residents without guaranteed protection (like rent control in the new building, or no net loss of affordable units). In the future, the councilor would push for policies that preserve existing affordable housing and prevent displacement.

  **Conclusion:**

  The rule that best explains the six votes is one that balances the creation of new housing (especially for vulnerable groups) against the protection of existing vulnerable populations and workers. In the new case, this rule would likely lead to an oppose vote because the relocation plan is inadequate (return rents too high, unit sizes don't fit) and the loss of the laundromat and grocery harms the community. The threat of sale and rent hikes without the project is a serious concern, but the rule focuses on the project at hand.

  The closest precedent is vote 6 (industrial strip) because of the displacement of vulnerable groups without adequate protection. The analogy breaks in that this project has a relocation plan, but the plan is insufficient to prevent harm.

  A future proposal that would help discriminate is one that has no affordable component at all (not even fee in lieu) and no displacement. If the councilor opposes that, then affordability is a necessary condition, which was not clear from vote 5 (which had a fee).

  Given the complexity, the six precedents underdetermine the new case because of the threat to the status quo. 

  - Voting yes adopts the principle that trading decaying affordable stock for new affordable housing (even if it results in net loss of deeply affordable units) is acceptable when the alternative is immediate displacement without any new housing. It commits to supporting similar projects in the future.

  - Voting no adopts the principle that existing affordable housing must be preserved and current residents protected, and that redevelopment must not displace them without ironclad guarantees. It commits to opposing similar projects unless the relocation plan ensures no one is made worse off.

  The councilor must decide which principle to adopt.
answer: |-
  Based on your voting record and stated reasons, I will rigorously reconstruct your decision procedure, evaluate whether your reasons appear consistent or post-hoc, identify alternative rules, analyze the new case, pinpoint the closest precedent and its divergence, suggest a future proposal to clarify your rule, and address underdetermination if applicable. My analysis focuses solely on your six precedents and the new case, treating your stated floor reasons as the primary evidence of your reasoning.

  ### Step 1: The Core Decision Rule Explaining All Six Precedents
  Your votes reveal a consistent, principled approach centered on **protecting vulnerable populations from harm or displacement, while pragmatically accepting trade-offs that provide net social benefits when harms are mitigated or outweighed**. This rule has three key elements:
  1. **Vulnerability Priority**: You prioritize the interests of vulnerable groups (e.g., low-income residents, fixed-income seniors, immigrant workers, marginalized individuals) over abstract policy goals or NIMBY concerns.
  2. **Harm-Benefit Calculus**: You support projects if they either:
     - **Directly benefit vulnerable groups** (e.g., affordable housing, supportive housing, aiding low-bargaining-power individuals), or
     - **Avoid harming vulnerable groups** (e.g., displacement without compensation, loss of livelihoods), especially when community objections are substantive.
     - But you accept **pragmatic trade-offs** (e.g., density near transit without on-site affordability) when harms are minimal, objections are weak, or inaction would worsen outcomes.
  3. **Community Input as Signal, Not Veto**: You weigh community input based on its substance. Organized opposition matters when it reflects genuine vulnerability or concrete harms (e.g., traffic capacity, job loss), but you override it when objections are "thin" (e.g., parking/sightlines without evidence) or when they exclude marginalized voices.

  **How this rule explains all six votes**:
  - **Vote 1 (Opposed)**: Protected vulnerable residents (organized, capacity concerns) from harm (overridden without answer) where no benefit to vulnerable existed (market-rate units, no affordability). Harm-benefit calculus favored opposition.
  - **Vote 2 (Supported)**: Directly benefited vulnerable groups (30% deed-restricted affordable) with minimal harm (scale unobjectionable, no displacement). Pragmatic trade-off (setback variance) accepted.
  - **Vote 3 (Supported)**: Protected a vulnerable individual (caretaker) from harm (exploitative prohibition) with no downside (no one protected by the rule). Benefit to vulnerability clear.
  - **Vote 4 (Supported)**: Directly benefited a highly vulnerable group (people leaving shelter) despite opposition; objections deemed thin and exclusionary (beneficiaries "not in the room"). Harm-benefit calculus favored support.
  - **Vote 5 (Supported)**: Pragmatic trade-off accepted: density near transit (a city-wide benefit) with fee in lieu (indirect affordability benefit), avoiding the risk of "neither." Minimal harm (no displacement, weak objections implied).
  - **Vote 6 (Opposed)**: Prevented harm to vulnerable workers (200 immigrant jobs lost without relocation) where benefits (affordable units at city edge) were an inadequate substitute. Harm-benefit calculus negative.

  **Evaluation of Stated Reasons**: None appear to be post-hoc rationalizations. Your reasons align tightly with the inferred rule:
  - Consistency is evident in how you framed each decision around vulnerability (e.g., "people not in the room," "least bargaining power," "wages not substituted"), harm-benefit balance (e.g., "scale unobjectionable," "objections thin"), and pragmatic trade-offs (e.g., refusing to end up with "neither" in Vote 5).
  - **No outlier vote**: All six fit the rule. Vote 5 is the most pragmatic (accepting fee in lieu), but your reason—avoiding a lose-lose outcome—is consistent with minimizing net harm.

  ### Step 2: Alternative Rules That Fit the Precedents
  Four alternative rules roughly fit your record, but each has weaknesses. Below, I score their fit (✓ = consistent, ✗ = inconsistent), then show how they diverge on the new case.

  1. **Housing Supply Maximization Rule**: Support projects that increase housing supply, especially near transit or with density bonuses.
     - **Fit**: ✓ Votes 2,3,4,5 (all added units); ✗ Vote 1 (opposed infill despite supply gain); ✗ Vote 6 (opposed despite adding units). **Weak fit**—fails on two votes.
  2. **Affordability-First Distributional Rule**: Support projects that directly increase affordable housing or benefit low-income groups; oppose market-rate without affordability.
     - **Fit**: ✓ Votes 2 (affordable), 3 (aids low-income), 4 (supportive housing); ✗ Vote 1 (no affordability, opposed—fits); ✗ Vote 5 (supported market-rate with fee); ✗ Vote 6 (opposed despite 20% affordable). **Weak fit**—fails on Votes 5 and 6.
  3. **Protect Incumbents Rule**: Prioritize existing vulnerable users (residents/workers) over new development; support only if incumbents are unharmed or compensated.
     - **Fit**: ✓ Votes 1 (protected residents), 3 (protected caretaker), 6 (protected workers); ✓ Votes 2,4,5 (no incumbent harm). **Strong fit**—explains all six. Differentiated from your core rule by its narrower focus on *existing* users only (ignoring benefits to *new* vulnerable groups like Vote 4's shelter-leavers).
  4. **Lefebvrian "Right to the City" Rule**: Support projects that empower marginalized groups to inhabit/produce space; oppose displacement/exclusion by elites or capital.
     - **Fit**: ✓ Votes 2 (affordable for marginalized), 3 (empowers caretaker), 4 (for excluded shelter-leavers), 6 (protects immigrant workers); ✓ Vote 1 (opposed override of organized residents); ✗ Vote 5 (supported market-rate tower, which may exclude marginalized without deep affordability). **Moderate fit**—Vote 5 is a stretch, as fee in lieu indirectly aids affordability but doesn't directly empower marginalized inhabitation.

  #### Divergence on the New Case
  The new proposal: Rezone nine walk-ups (84 vulnerable households) for 180 units (15% affordable), with relocation assistance/right of return, but double rents and 20 households unable to return; laundromat/grocery (8 jobs) lost; owner threatens neglect/sale without approval.

  - **Your Core Rule (Protect Vulnerability + Net Benefit)**: **Leans Oppose**. 
    - *Why*: Harms vulnerable incumbents—84 households face unaffordable return rents and displacement (20 households excluded by size), plus 8 low-wage workers lose jobs without nearby alternatives. Benefits (27 affordable units) don't offset harm: new units target 60% AMI, but existing residents pay "well below" market (likely <60% AMI), so they're excluded. Owner's threat (sale/neglect) mirrors the harm of inaction but doesn't justify project-specific harm. Single-family association's support reflects exclusionary intent ("future population"), amplifying harm. Relocation plan is inadequate (cf. Vote 6).
  - **Housing Supply Rule**: **Support**. 
    - *Divergence*: Focuses on adding 180 units (15% affordable) near transit, ignoring incumbent harm. Would dismiss displacement as "creative destruction." Contradicts your Votes 1 and 6 where supply was secondary to harm.
  - **Affordability-First Rule**: **Ambivalent (Leans Support)**. 
    - *Divergence*: Supports adding 27 affordable units but struggles with net loss of 84 de facto affordable units. May dismiss incumbent harm as "inevitable." Conflicts with your Vote 5 (supported market-rate) and Vote 6 (opposed despite 20% affordable).
  - **Protect Incumbents Rule**: **Strongly Oppose**. 
    - *Divergence*: Focuses solely on harm to 84 households and 8 workers; relocation plan is token (rents double, size mismatch). Would ignore benefits to future residents. Aligns with your core rule but may undervalue city-wide gains.
  - **Right to the City Rule**: **Strongly Oppose**. 
    - *Divergence*: Views displacement as exclusion of marginalized "producers" (tenants, workers) by elites (owner, single-family association). Ground-floor elimination erases community "production" (laundromat/grocery). Supportive of tenant association's analysis. Aligns with core rule but frames harm as structural injustice.

  ### Step 3: Closest Precedent and Analogy Breakdown
  - **Closest Precedent**: **Vote 6 (Industrial Strip Rezoning)**.  
    - **Similarities**: Both involve rezoning that displaces vulnerable incumbents (200 workers in Vote 6, 84 households + 8 workers here) for residential development with affordable units but inadequate protection. Both feature developer promises (affordable units/fee in Vote 6, relocation here) failing to offset harm. City-edge location in both reduces accessibility for displaced.  
  - **Where Analogy Breaks**:  
    1. **Relocation Plan**: Vote 6 had **none**, making harm explicit. Here, there is a plan, but it's **inadequate** (doubled rents, size exclusions)—it creates a false choice that may obscure harm.  
    2. **Threat Dynamics**: Vote 6 had no owner threat; harm was project-dependent. Here, owner threatens harm (sale/neglect) if rejected, making inaction harmful. This introduces a lose-lose dilemma absent in Vote 6.  
    3. **Community Support**: Vote 6 had no neighborhood support mentioned. Here, single-family association's "enthusiastic" support for demographic change highlights exclusionary intent, worsening the harm.  
    4. **Benefit Scale**: Vote 6 offered only off-site affordability (fee) or edge-city units; here, 15% on-site affordable near transit is a stronger benefit but still insufficient for incumbents.

  ### Step 4: A Discriminating Future Proposal
  To clarify which rule you follow, a proposal that **cleanly distinguishes between Protect Vulnerability and Protect Incumbents rules** would be most revealing.  
  - **Proposal**: A city-owned vacant lot in a low-vulnerability area (e.g., underused parking near transit) rezoned for 100% market-rate high-density housing, with no affordability fee or community amenities.  
  - **Why it Discriminates**:  
    - **Protect Vulnerability Rule**: Likely **oppose**. No direct benefit to vulnerable groups (market-rate only), and no harm to offset, so no net social benefit.  
    - **Protect Incumbents Rule**: Likely **support**. No incumbents harmed (vacant lot), so no reason to oppose.  
    - **Other Rules**: Housing Supply supports; Affordability-First opposes; Right to the City opposes (no empowerment of marginalized).  
  Your Vote 5 (supported market-rate tower with fee) suggests you accept trade-offs for density, but this proposal removes the fee. Supporting it would skew toward Protect Incumbents; opposing would strengthen Protect Vulnerability.

  ### Step 5: Underdetermination and Principles for the New Case
  Your six precedents **underdetermine the new case** due to a novel factor: the owner's threat of sale/neglect creates a **dual-harm scenario** (approval displaces vulnerable incumbents; rejection risks immediate displacement via rent hikes). No precedent combines this with an inadequate relocation plan. Thus, your vote here establishes a new principle:

  - **Vote YES Adopts**: **"Trading decaying affordable stock for modernized supply is acceptable when inaction guarantees worse harm, even if net vulnerable beneficiaries are ambiguous."**  
    - **Assumption**: Low-rent stock is a **decaying asset**—preservation is futile, and redevelopment (even with losses) is the "least bad" path.  
    - **Commitment**: You must support similar projects where owners credibly threaten collapse, prioritizing city-wide supply over incumbent protection. E.g., next time a failing building with relocation issues arises, you support if the math of "harm reduction" justifies it.

  - **Vote NO Adopts**: **"Existing low-rent stock is a commons to be defended; displacement is unjustified without guaranteed, non-exploitative outcomes for incumbents."**  
    - **Assumption**: Low-rent stock is a **commons**—its social value (housing vulnerable workers/seniors) outweighs efficiency gains, and the city should intervene to preserve it (e.g., via receivership, subsidies).  
    - **Commitment**: You must oppose similar projects unless relocation ensures **no net loss** for incumbents (e.g., rent control, size-matching, job replacement). E.g., next time, you demand enforceable covenants for 1:1 affordable replacement and job retention.

  #### Recommendation for the New Case
  Given your consistent prioritization of vulnerability and harm avoidance, **leaning toward NO is more coherent** with your record. The relocation plan's inadequacy (doubled rents, exclusion of 20 households, job loss) creates harm similar to Vote 6, and the single-family association's exclusionary support exacerbates it. The owner's threat, while real, doesn't absolve the project's flaws—your role is to judge the proposal, not the owner's ultimatum. However, this is finely balanced; if relocation were improved (e.g., rent subsidies for returnees, laundromat/grocery relocation), YES could align with your pragmatism in Votes 4–5.  
  **Ultimately, your vote will define whether vulnerability protection extends to holding the line against coercive redevelopment—or accepting painful trade-offs under duress.**
