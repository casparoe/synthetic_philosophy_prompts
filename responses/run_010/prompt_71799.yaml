prompt: |-
  I'm in a political ethics seminar trying to pin down what actually makes something corrupt by just listing my gut calls, and they are not adding up. Here they are.

  - Paying a posted "expedite fee" at a passport office in a country where every clerk expects it: not corrupt, that's just the price of the service.
  - A pharma rep buying my uncle, a GP, a $30 lunch, which there's decent evidence nudges his prescribing: not corrupt. The same rep paying him $3,000 as a "consulting fee" for a meeting that plainly never happened: corrupt.
  - A councillor voting to rezone a parcel she owns without disclosing: corrupt. A councillor voting for a rezoning that raises the value of her own street, disclosed, everyone knew: not corrupt.
  - A village chief taking a goat from a family because refusing it would be a real insult, then siting the new well where the hydrology says rather than near their field: not corrupt. Same goat, well sited near their field: corrupt.
  - A donor giving a university $500k with no strings, and two years later admissions takes his marginal kid: corrupt.
  - A judge letting a bar association fly her to a conference, then years later ruling for one of its member firms — correctly, everyone agrees the ruling is right: not corrupt.
  - A cop taking free coffee from a diner and later not writing the owner up: corrupt.
  - A politician giving a donor's kid an internship over better applicants, in a place where a politician's kin obligations are the only safety net anyone has: honestly don't know. And I notice I'd call the exact same thing corrupt back home.

  My tentative rule is that a gift or payment is corrupt iff it actually changes what the official does, and the change makes the outcome worse on the merits. But that condemns the passport fee (I jump a queue, somebody waits longer), and I don't think it seperates the goat from the $500k, or the judge from the cop.

  Can you state a principle — or two competing ones — that captures most of this, say which case motivates each clause, then tell me what it comes out as on a couple of cases I haven't thought of, and be straight with me about which of my verdicts it can't save? No reading list please, I just want the principle.
reasoning: |-
  Okay, this user is in a political ethics seminar and struggling to define corruption beyond gut instincts. They've listed several nuanced scenarios where their intuition says "corrupt" or "not corrupt," but they can't find a consistent principle. Their tentative rule—focusing on actual influence and worsened outcomes—fails to explain cases like the passport fee or the judge's ruling. 

  Hmm, what's really underneath this? They're clearly intellectually honest—admitting their own contradictions (like the internship case differing by culture) and rejecting easy answers. They want rigor without academic jargon. The frustration is palpable: they've done the hard work of listing concrete cases but hit a wall synthesizing them. 

  Two big hurdles emerge: First, separating socially embedded practices (goats, passport fees) from "real" corruption. Second, handling scenarios where influence exists but outcomes are neutral (the judge) or where harm is diffuse (passport queue). Their examples cleverly expose how context flips moral judgments—the same goat or internship shifts from acceptable to corrupt based on outcome or cultural frame.

  I recall philosophical work on corruption being less about acts than about institutional purpose perversion... but they said no reading lists. So let's distill. Core tension seems to be between: 
  - Harm-based views (their current approach, failing on passport/judge) 
  - Process-based views (violating rules/roles, but then the passport fee has no rule against it) 

  Ah! Maybe hybridize. Principle 1: Corruption requires both (a) violating a public role's duty AND (b) causing harm. That saves the passport office (no duty violated if fee is normalized) and the judge (no harm). Principle 2: Pure role violation, even harmless—but that overcondemns (e.g., the goat if hydrology is followed). 

  Testing against their cases: 
  - Pharma $3k: violates duty (fake consulting) AND harms patients → corrupt. 
  - Goat with well sited correctly: violates duty? (taking gift) but no harm → Principle 1 says not corrupt, Principle 2 says corrupt. Explains their ambivalence! 
  - $500k donation: violates duty (quid pro quo implied) AND harms meritocracy → corrupt under both. 
  - Internship in kinship culture: Principle 1 might excuse (no duty violation if role includes kinship; harm unclear), Principle 2 condemns. Matches their uncertainty. 

  New cases: 
  - Lobbyist funding a senator's hobby. If no policy change, Principle 1 absolves, Principle 2 condemns—mirroring the goat dilemma. 
  - Teacher accepts apple then favors student. Principle 1: corrupt only if grading skewed. Principle 2: always corrupt. 

  Their toughest cases are the cultural ones (goat, internship) where "duty" is fluid. No principle will perfectly handle those without contextual judgment—and that's okay. Ethics isn't algebra. Should tell them straight: their village chief goat case breaks any simple rule because social meaning dominates. 

  ...Also that cop coffee? Still corrupt under both principles. Some intuitions hold.
answer: |-
  Here's a distilled principle that captures most of your intuitions, followed by a competing view. Both prioritize **institutional integrity over transactional harm**:

  ### Principle 1: The Role-Divergence Test (Your Cases Mostly Fit Here)
  An act is corrupt **if it induces an official to violate a core, defined duty of their role** in a way that **subverts the institution's purpose**.  
  - **Key additions**:  
    - **"Defined duty"**: Explicit rules or widely understood norms of impartiality.  
    - **"Subverts the institution"**: Harms its essential function (e.g., justice, public welfare).  
  - **Saves your verdicts**:  
    - Passport fee (not corrupt): No duty violated (fee is institutionalized; service still delivered).  
    - Pharma $30 lunch (not corrupt): Trivial gift doesn’t violate a GP’s core duty to prescribe medically appropriate drugs.  
    - Pharma $3k (corrupt): Creates fake duty ("consulting"), subverting medical integrity.  
    - Councillor undisclosed vote (corrupt): Violates duty of disclosure, subverts zoning fairness.  
    - Councillor disclosed vote (not corrupt): Duty to disclose fulfilled; no role violation.  
    - Goat with correct well (not corrupt): No duty violated (decision based on merit).  
    - Goat with biased well (corrupt): Violates duty to allocate public goods fairly.  
    - $500k donation (corrupt): Subverts admissions duty (meritocracy) via implied quid pro quo.  
    - Judge (not corrupt): No duty violated (ruling correct; no evidence conference influenced outcome).  
    - Cop (corrupt): Violates duty to enforce laws impartially for personal gain.  
    - Internship in kinship culture (not corrupt?): If kinship *is* a defined duty (e.g., social safety net), no role violation.  

  ### Principle 2: The Purity Standard (Stricter, Condemns More)
  An act is corrupt **if it creates a conflict between an official’s duty and personal interest**, **regardless of outcome**.  
  - **Key difference**: Rejects outcome-dependence. Focuses on potential for distorted judgment.  
  - **Changes your verdicts**:  
    - Passport fee: Corrupt (personal gain for expedited service).  
    - Goat with correct well: Corrupt (gift creates obligation).  
    - Judge: Corrupt (appearance of impropriety).  
    - Internship anywhere: Corrupt (nepotism = inherent conflict).  

  ### Where Your Verdicts Challenge Principle 1
  1. **The Goat Dilemma**:  
     - Principle 1 excuses the goat if the well is placed correctly (no duty violated). *But you feel uneasy* — the gift itself might seem inherently corrupting. Principle 2 captures this.  
  2. **The Passport Fee**:  
     - Principle 1 calls it non-corrupt, but you note queue-jumping harms others. *This is a tension*: If the fee system itself subverts institutional fairness (e.g., creates class barriers), Principle 1 *could* condemn it — but you don’t, implying you see it as a neutral price.  
  3. **The Internship**:  
     - Principle 1 allows cultural relativism (role duties differ). *Your hesitation* suggests you suspect *all* nepotism corrupts institutions — closer to Principle 2.  

  ### Test Cases (Applying Principle 1)
  - **A senator votes for a bill after a lobbyist donates to their campaign. The bill is objectively good policy.**  
    - Principle 1: Not corrupt (no duty violated if vote aligns with public interest).  
    - Principle 2: Corrupt (donation creates conflict).  
  - **A teacher accepts a $5 Starbucks gift card from a student’s parent, then gives the student a B+ instead of a B.**  
    - Principle 1: Corrupt (violates grading duty for personal gain).  
    - Principle 2: Corrupt (conflict of interest).  

  ### Straight Talk
  - **Principle 1 saves 9.5/11 of your verdicts** (internship is debatable).  
  - **It struggles most with "appearance of corruption" cases** (e.g., the goat accepted but impartially used). If you believe *any* personal gift undermines institutional trust, Principle 1 is too lenient.  
  - **Your passport fee intuition is the outlier**: Principle 1 assumes institutionalized payments aren’t corrupt *if they don’t distort outcomes*. If you think queue-jumping is inherently corrupting, you lean toward Principle 2.  

  **Core tension**: Your gut distinguishes between "priced-in" systems (passport fee, kinship internships) vs. ad hoc distortions (fake consulting fee). Principle 1 formalizes this; Principle 2 rejects the distinction.
