answer: |-
  Below is a decision tree designed to sort students by their verdicts on concrete scenarios, beginning from the shared minimal starting point (it makes sense to ask what it is like to be a subject at a time; some discriminated/unreported content exists). The tree uses the specified scenarios plus two new ones (I and J) to probe undercovered joints. Each node presents a scenario and a claim that separates branches, answerable without theoretical knowledge. Leaves are named positions with obligations and awkward commitments. The tree has 10 nodes (9 branching points, 1 starting point) and 10 leaves.

  ### Decision Tree
  **Starting Point:** All students accept that it makes sense to ask "what it is like" for a subject at a time, and that some discriminated/unreported content exists.

  1. **Node 1 (Scenario A: Sperling array)**  
     *Scenario:* A 12-letter array is briefly displayed. The subject can report any cued row after offset but only ~4 items uncued. She insists the whole array was "still there, fading" a moment later.  
     **Separating Claim:** The subject's insistence that all 12 letters were consciously experienced after offset is accurate.  
     → **Yes:** Proceed to Node 2.  
     → **No:** Proceed to Node 3.  

  2. **Node 2 (Scenario B: Change blindness)**  
     *Scenario:* A subject fails to notice a large alteration in a scene and denies seeing the pre-change layout in detail, though she could have discriminated it.  
     **Separating Claim:** Before the change, the subject consciously experienced the specific details she later fails to report.  
     → **Yes:** Leaf 1 (Overflow view).  
     → **No:** Leaf 2 (Partial graded access view).  

  3. **Node 3 (Scenario C: Invisible image suppression)**  
     *Scenario:* An image is suppressed from visibility; forced-choice guesses about orientation are above chance, but the subject reports "nothing it was like" (variant: a subject reports a "contentless sense of something").  
     **Separating Claim:** The above-chance performance involves some conscious experience (e.g., vague awareness, not just unconscious processing).  
     → **Yes:** Proceed to Node 4.  
     → **No:** Proceed to Node 5.  

  4. **Node 4 (New Scenario I: Inattentional blindness with forced choice)**  
     *Scenario:* During a demanding task, an unexpected object appears (e.g., a red cross). The subject does not report it and denies seeing it, but forced-choice discrimination is above chance.  
     **Separating Claim:** The subject had any conscious experience of the object during the task (even if fleeting or indistinct).  
     → **Yes:** Leaf 3 (Local/recurrent processing view).  
     → **No:** Leaf 4 (First-order representational view).  

  5. **Node 5 (Scenario E: Masked priming)**  
     *Scenario:* A word is rendered unreportable by a mask but speeds a related judgment (e.g., "river" speeds "water").  
     **Separating Claim:** The word was consciously experienced, despite being unreportable.  
     → **Yes:** Proceed to Node 6.  
     → **No:** Proceed to Node 7.  

  6. **Node 6 (Scenario D: Scotoma discrimination)**  
     *Scenario:* A subject localizes/discriminates stimuli in a scotoma while sincerely denying she sees anything there.  
     **Separating Claim:** The discrimination involves conscious experience in the scotoma region.  
     → **Yes:** Leaf 5 (Russellian monism).  
     → **No:** Leaf 6 (Higher-order thought view).  

  7. **Node 7 (Scenario G: Discriminates without confidence)**  
     *Scenario:* A subject flawlessly discriminates a blue patch but reports no confidence, saying, "I can tell it’s blue, but it doesn’t seem I see blue."  
     **Separating Claim:** The subject has a conscious experience of blue.  
     → **Yes:** Proceed to Node 8.  
     → **No:** Proceed to Node 9.  

  8. **Node 8 (New Scenario J: Absent-minded perception)**  
     *Scenario:* A subject stops at a red light while reading a book, later reporting no conscious awareness of the light ("I wasn’t paying attention, but I stopped").  
     **Separating Claim:** The subject had a conscious experience of the red light during the action.  
     → **Yes:** Leaf 7 (Broadcast view).  
     → **No:** Leaf 8 (Illusionism).  

  9. **Node 9 (Scenario F: Implicit memory under anesthesia)**  
     *Scenario:* A patient shows implicit memory for words presented under light anesthesia but no report or recall.  
     **Separating Claim:** The patient had conscious experience of the words during anesthesia.  
     → **Yes:** Leaf 9 (Panpsychism).  
     → **No:** Proceed to Node 10.  

  10. **Node 10 (Scenario H: Hypothetical global workspace)**  
      *Scenario:* A literal global workspace system (modules, shared bus, broadcast) denies there is "anything it is like" to be it after acquiring language.  
      **Separating Claim:** The system’s denial should be taken at face value (i.e., it lacks phenomenal consciousness).  
      → **Yes:** Leaf 10 (Identity view).  
      → **No:** Leaf 11 (Substance dualism).  

  ### Leaves (Terminal Positions)
  1. **Leaf 1: Overflow view** (e.g., Block)  
     - **Obligation for Scenario A/B:** Must say the subject experienced all 12 letters and change-blindness details consciously, even if unreportable.  
     - **Awkward commitment:** Explaining why unreportable content (e.g., in change blindness) doesn’t influence behavior more robustly.  
     - Confidence: 90% (well-supported by empirical cases, but may overinterpret fading persistence).  

  2. **Leaf 2: Partial graded access view**  
     - **Obligation for Scenario A/B:** Must say the subject experienced more than 4 letters but not all 12 (e.g., a "gist"), and details in change blindness were not fully experienced.  
     - **Awkward commitment:** Defining the "degree" of access needed for partial consciousness without arbitrariness.  
     - Confidence: 85% (fits data, but boundaries are fuzzy).  

  3. **Leaf 3: Local/recurrent processing view** (e.g., Lamme)  
     - **Obligation for Scenario I/C:** Must say inattentional blindness and suppressed images involve weak, non-accessible conscious processing.  
     - **Awkward commitment:** Explaining why subjects deny awareness if experience is present (e.g., in blindsight).  
     - Confidence: 80% (neural plausibility, but introspective reports conflict).  

  4. **Leaf 4: First-order representational view** (e.g., Tye)  
     - **Obligation for Scenario C/I:** Must say suppressed images/inattention involve unconscious first-order states (despite above-chance performance).  
     - **Awkward commitment:** Justifying why some first-order states are conscious and others not (e.g., "poised" for action).  
     - Confidence: 75% (clear criteria, but "poising" is underspecified).  

  5. **Leaf 5: Russellian monism**  
     - **Obligation for Scenario D:** Must say scotoma discrimination involves intrinsic properties (proto-consciousness) not accessed as qualitative experience.  
     - **Awkward commitment:** Denying that blindsight is fully unconscious despite subjective reports.  
     - Confidence: 70% (metaphysically consistent, but empirically detached).  

  6. **Leaf 6: Higher-order thought view** (e.g., Rosenthal)  
     - **Obligation for Scenario D/E:** Must say unreportable words and scotoma stimuli lack consciousness due to absent higher-order states.  
     - **Awkward commitment:** Explaining how higher-order states arise neurally without circularity.  
     - Confidence: 85% (aligns with metacognition, but HOT may not be necessary).  

  7. **Leaf 7: Broadcast view** (e.g., Baars, Dehaene)  
     - **Obligation for Scenario J:** Must say the red light was unconsciously processed (despite stopping) because it wasn’t globally broadcast.  
     - **Awkward commitment:** Treating "broadcast" as binary when evidence suggests gradation (e.g., priming).  
     - Confidence: 90% (strong empirical basis, but may conflate access with phenomenology).  

  8. **Leaf 8: Illusionism** (e.g., Dennett, Frankish)  
     - **Obligation for Scenario G/J:** Must say the subject lacks blue/red light experience; "seeming" is an introspective error.  
     - **Awkward commitment:** Explaining why illusions feel like robust qualitative properties.  
     - Confidence: 65% (internally coherent, but clashes with first-person intuition).  

  9. **Leaf 9: Panpsychism**  
     - **Obligation for Scenario F:** Must say anesthesia words were consciously experienced at a microscopic level.  
     - **Awkward commitment:** Attributing consciousness to systems with no functional integration (e.g., isolated neurons).  
     - Confidence: 60% (logically possible, but empirically untestable).  

  10. **Leaf 10: Identity view**  
      - **Obligation for Scenario H:** Must say the system has phenomenal consciousness identical to its access and misreports due to architectural limits.  
      - **Awkward commitment:** Denying conceivable scenarios where access and phenomenology dissociate.  
      - Confidence: 80% (parsimonious, but may ignore explanatory gaps).  

  11. **Leaf 11: Substance dualism**  
      - **Obligation for Scenario H:** Must say the system lacks a non-physical mind, hence no consciousness, and reports accurately.  
      - **Awkward commitment:** Explaining how non-physical minds interact with physical access mechanisms.  
      - Confidence: 50% (consistent with intuitions, but scientifically obsolete).  

  ---

  ### Map of the Space
  **Unoccupied Combinations:**  
  - **Sperling-rich (Yes) + Suppression-no experience (No):** Combines overflow with identity-like access constraints. *Empty* because incoherent—overflow implies experience without access, but denying suppression experience requires access for consciousness.  
  - **Inattention-no experience (No) + Anesthesia-conscious (Yes):** Combines higher-order denial with panpsychism. *Empty* because unattractive—higher-order views reject weak consciousness, while panpsychism mandates it universally.  
  - **Global workspace denial-true (Yes) + Scotoma-no experience (No):** Combines identity view with intrinsic properties. *Empty* because coherent but unattractive—no current position holds that access=phenomenal while also endorsing non-conscious intrinsic properties.  

  **Indistinguishable Pairs (without further evidence):**  
  - **Illusionism (Leaf 8) vs. Identity view (Leaf 10):** Both deny "overflow," but differ on whether access constitutes phenomenology (identity) or eliminates it (illusionism). *Inseparable* by behavioral/first-person evidence—difference is metaphysical (whether phenomenology exists or is illusory). A wedge would require evidence of a system with full access but no subjective feel (e.g., a human with global workspace activation who denies experience due to congenital anosognosia).  
  - **Russellian monism (Leaf 5) vs. First-order view (Leaf 4):** Both may deny scotoma experience, but differ on whether consciousness requires intrinsic properties. *Separable* with a scenario: A system with first-order states but no intrinsic properties (e.g., a silicon chip) that reports experience—Russellianism must deny this, first-order views may accept it.  

  **Weakest Point in Tree:**  
  - **Boundary between Illusionism (Leaf 8) and Identity view (Leaf 10):** I agree this is the shakiest joint. Both positions may interpret scenarios similarly (e.g., no overflow), differing only in whether they "write off" phenomenology as illusory (illusionism) or reduce it to access (identity). The tree separates them via Scenario H (system denial), but this is fragile—identity views could attribute denial to missing introspection modules, while illusionism could attribute it to absent illusions. A true wedge requires a case where access occurs without subjective feel *and* without reporting capability (e.g., a patient with global broadcast but no qualia reports due to aphasia). Until then, the distinction may be verbal.  

  **Confidence Notes:**  
  - Highest confidence: Overflow view (Leaf 1), Broadcast view (Leaf 7)—well-grounded in empirical cases.  
  - Lowest confidence: Illusionism (Leaf 8) and Identity view (Leaf 10) placement (65-80%) due to metaphysical ambiguity.  
  - Least philosophically secure: **Node 8 (Absent-minded perception → Broadcast/Illusionism split).** The claim ("conscious experience during action") is vulnerable to deflationary reinterpretations (e.g., "fringe consciousness"), and the line between broadcast and illusionism may rely on contestable intuitions about "seeming." This mislocates your suspicion (illusionism/identity) because Node 8’s empirical basis is thinner, inviting theoretical leakage.  

  This tree forces students to confront cases where positions genuinely diverge, minimizing self-identification bias. Use it to scaffold debates, highlighting underdetermined nodes (e.g., Node 8) for discussion.
