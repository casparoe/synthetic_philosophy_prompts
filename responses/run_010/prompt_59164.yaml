          - Design against: The instructor should not reveal the exact phantom vote until the count. The chance is announced as very small (less than 0.04%) and that should be enough. If a student tries to compute the exact probability during the activity, the instructor can say: "We are not focusing on the exact number, but on the experience of having a very small chance." In the debrief, we can discuss that in real elections, we don't know the exact probability either.

