prompt: |-
  For four years I have kept a record of the moral judgments of a single informant — a woman I shall call H — who was for thirty years the matron of a residential home in a small town, and who is still consulted, informally but persistently, by half the families there whenever someone's conduct becomes a question. She has no philosophical training and no interest in acquiring any. What makes her worth recording is her consistency: put two structurally similar cases to her a year apart and she will place them on the same shelf without hesitation, and she will defend the placement in a sentence or two. I now have ten entries I trust, one pending case, and a problem.

  The ledger, in my paraphrase except where her wording seemed load-bearing:

  1. A healthy man of thirty gave a kidney to a stranger, on the condition that nobody in the town be told. H placed it "at the top of the scale." She added once that the concealment was part of why; whether she meant that the concealment added to the deed or merely testified to the man, I could not get out of her. Other compatible donors existed and did nothing; she mentioned this without drawing any conclusion from it.
  2. A woman who for thirty years gave a tenth of a modest salary to charity, unobtrusively. H: decent, expected, no medal — "that is what a person owes."
  3. A nurse who stayed on the ward through an outbreak, at real risk to herself. H: she had taken the post; not a gift but a debt; admirable, and owed.
  4. A boy of twelve who went through ice after a dog and was pulled out half-drowned. H: top of the scale, though he was the only person who saw it happen. I pressed her on that — he was the only one there — and she said, "You cannot ask that of a child."
  5. A neighbour who drove an elderly woman to dialysis twice a week. For the first four years H called it "what neighbours do." After the patient's son publicly accused the neighbour of stealing from the house, and after the neighbour's own husband became bedridden, the driving continued; H then said that from that point on nobody could ask it of her, and that the earlier years and the later ones were not the same thing.
  6. A prosperous man who anonymously settled a stranger's hospital bill. Four others on the same list were in greater need; he chose the one whose photograph had been in the local paper. H: "A lovely gesture. Not the top of the scale." She did not say he had done anything wrong.
  7. A landlord who forgave six months of arrears he could lawfully have collected, from a tenant he disliked. H: handsome; beyond the lease.
  8. A driver who let another out in heavy traffic; a man who held a lift. H: manners — "neither owed nor to his credit."
  9. A soldier who threw himself on a grenade. H refused the top of the scale: "He was the nearest man and they all knew it. He had to." I recorded my objection — the nearest man is still free to run — and she was unmoved by it.
  10. A man who declined to help his brother move house because a match was on the television. H: "He did nothing wrong. But I should think the less of him, and so would his brother."

  The pending case, which the family will put to her next Thursday and which I shall be present to hear. A retired commercial diver in his late fifties was the only person on that stretch of shore that morning with the training and the kit. A boy was taken out by a current. From the beach the diver could see that a throwing line and a ring buoy, both within twenty paces, would very likely have brought the boy in; the sea state made entering the water himself seriously dangerous. He entered the water anyway, got the boy out, and in doing so destroyed his shoulder permanently, ending the diving work his pension depends on. Afterwards he told the local paper, and then a television crew, that he went in rather than throw the line because the boy is the son of the developer who had him struck off a contract list eleven years earlier, and that he wanted the father to be seen owing him the boy's life, on camera, in front of the town. He said this cheerfully and said it twice. The boy is unharmed. The father has not been able to look anyone in the town in the face since.

  What I need from you:

  (a) Reconstruct as many genuinely distinct rules as H could be running that generate all ten verdicts as recorded. For each rule, name the entries that support it and the entry or entries that sit worst with it. Do not assume she is coherent: if no single rule can produce two of the entries, tell me which pair, and what minimal revision to one of them would reconcile the two.

  (b) Say what each rule yields for the diver. I expect at least three different verdicts, and I want to see the divergence laid out rather than averaged away.

  (c) Give me your best single guess at what she will say, and tell me how much weight you are putting on the two features for which the ledger supplies no precedent at all: the stated spite, and the refused cheaper rescue.

  (d) Identify the closest analog among the ten entries and state precisely where the analogy breaks.

  (e) Propose one further case I could put to her — short enough to describe in a sentence, and one she would answer without hedging — that would discriminate between the two rules you take most seriously.

  (f) If her scheme does not have the shape my question assumes — if, for her, "beyond what anyone could ask" and "to his credit" are two separate axes rather than two ends of a single scale — say so, and tell me what she would say about the diver instead. I would rather have that than a forced answer.

  Work only from the ledger as I have given it. I am not asking for references, for a survey of positions, or for what any named philosopher would make of her; I want the reconstruction and the prediction.
reasoning: |-
  Hmm, I need to tackle this complex ethics problem based on H's moral judgments. Let me approach this systematically.

  First, I need to reconstruct H's moral rules from her ten judgments. Looking at her decisions:

  For the kidney donor (1) she places it at the top because he did something extraordinary anonymously, going beyond what's expected. The charity donor (2) is just meeting basic obligations - "what a person owes." The nurse (3) is admirable but it's her duty since she took the job. The boy saving the dog (4) is top-tier because we can't expect that from a child. The neighbor driving to dialysis (5) starts as obligation but becomes supererogatory when she continues despite personal costs. The hospital bill payer (7) is kind but not top because he chose based on publicity. The landlord forgiving rent (7) is "beyond the lease" - exceeding contracts. Small courtesies (8) are neutral manners. The soldier (9) isn't top because he "had to" as the nearest. The brother refusing help (10) isn't wrong but diminishes him.

  From these patterns, I see three distinct principles emerging:

  1. The "Beyond Obligation" rule - actions are praiseworthy when they exceed what can reasonably be demanded. Cases 1, 4, and 5 (later phase) show this.

  2. The "Pure Motive" rule - credit diminishes if there's self-interest or impurity. Cases 6 and 10 demonstrate this sensitivity to motive.

  3. The "Role Duty" rule - special obligations exist based on roles or circumstances. Cases 3 and 9 show duties tied to positions.

  For the diver case, applying these rules gives different verdicts. "Beyond Obligation" would place it high since he risked his pension. "Pure Motive" would downgrade it due to spite. "Role Duty" might see it as expected if we consider his unique capability.

  The closest analog is the soldier case (9), but it breaks because the diver wasn't compelled by role in the same way. Also, the stated malice is unprecedented.

  I predict H will focus on the spiteful motive, placing it below top tier despite the sacrifice. The refused safer rescue might be seen as reckless but not motive-tarnishing.

  To test between rules, I could ask about a firefighter who saves someone but later admits grudging motives - this would isolate the motive factor.

  H might actually use two axes: one for obligation (what's owed) and one for credit (praiseworthiness). The diver would score high on obligation-scale (he did what was needed) but low on credit-scale due to motive.
answer: |-
  Based solely on the ledger provided, I reconstruct H's moral framework as operating under three distinct, sometimes overlapping rules. These rules are derived from patterns in her judgments, emphasizing (1) the distinction between obligation and supererogation, (2) the purity of motive, and (3) role-based duties. No single rule explains all ten entries without tension, but each is supported by multiple cases. Below, I address each part of your query systematically.

  ---

  ### (a) Reconstructed Rules, Supporting Entries, and Tensions
  **Rule 1: The "Beyond Obligation" Rule**  
  *Description*: An act is morally praiseworthy ("to his credit") only if it exceeds what can reasonably be asked or expected of a person in their circumstances. Acts that are obligatory ("owed") or role-bound are not creditworthy, even if difficult or risky.  
  - **Supported by**:  
    - Entry 1 (kidney donor): Concealment and sacrifice place it "at the top" because it was not asked/expected.  
    - Entry 4 (boy saving dog): Risking his life is "top of the scale" because "you cannot ask that of a child" (i.e., it is beyond obligation for a child).  
    - Entry 5 (neighbor driving): Later years are praiseworthy because "nobody could ask it of her" after her own hardships.  
    - Entry 7 (landlord): Forgiving arrears is "beyond the lease" (exceeds contractual obligation).  
  - **Tension with**:  
    - Entry 3 (nurse): Staying during an outbreak is "admirable, and owed" but not creditworthy because she "took the post" (role-bound duty). Rule 1 struggles here because H calls it "admirable" despite it being "owed," implying some overlap with Rule 3.  
    - **Minimal revision**: If H clarified that "admirable" refers to fulfilling a duty exceptionally well (not supererogation), it resolves the tension.  
  - **Incoherent pair**: Entries 1 and 9. Entry 1 (kidney) is top for exceeding obligation, but Entry 9 (soldier) is not top despite exceeding obligation (he could have run). Rule 1 alone cannot explain why one is "beyond" and the other is "had to." This requires Rule 3 for resolution.

  **Rule 2: The "Pure Motive" Rule**  
  *Description*: An act loses moral credit if tainted by self-interest, publicity-seeking, or impure motives (e.g., spite, vanity). Neutral or obligatory acts are unaffected, but supererogatory acts are downgraded if motives are impure.  
  - **Supported by**:  
    - Entry 6 (hospital bill): "Not the top" because he chose based on a photo (publicity-seeking).  
    - Entry 10 (brother refusing help): "Did nothing wrong" but diminished credit due to selfish motive ("match on television").  
    - Entry 1 (kidney donor): Concealment "added to the deed" or "testified to the man" (implying pure motive enhances credit).  
  - **Tension with**:  
    - Entry 7 (landlord): Motive is unmentioned (he "disliked" the tenant), yet H calls it "handsome." Rule 2 would expect downgrading if dislike implied spite, but H does not penalize it.  
    - **Minimal revision**: If dislike was not spiteful (e.g., impersonal), it resolves the tension.  
  - **Incoherent pair**: Entries 6 and 8. Entry 6 is downgraded for impurity, but Entry 8 (manners) is neutral ("neither owed nor to his credit") despite possible self-interest (e.g., feeling virtuous). Rule 2 alone cannot explain why impurity matters in supererogation (Entry 6) but not in neutral acts (Entry 8).

  **Rule 3: The "Role Duty" Rule**  
  *Description*: Specific roles (professional, situational, or relational) create non-negotiable duties. Fulfilling these is "owed," not creditworthy, even at great cost. Credit arises only if actions exceed role expectations.  
  - **Supported by**:  
    - Entry 3 (nurse): Staying is "a debt" because she "took the post."  
    - Entry 9 (soldier): "He had to" because he was "the nearest man" (situational role).  
    - Entry 5 (neighbor driving): Early years were "what neighbours do" (relational duty).  
  - **Tension with**:  
    - Entry 4 (boy saving dog): No role exists for a child, yet it is "top." Rule 3 struggles as it emphasizes duty-bound contexts.  
    - **Minimal revision**: If "child" implies no role capacity, it resolves the tension (Rule 1 covers this).  
  - **Incoherent pair**: Entries 3 and 9. Both are "owed," but Entry 3 is "admirable" while Entry 9 is not. Rule 3 alone cannot explain this; Rule 2 (motive) or Rule 1 (degree of sacrifice) may be needed.

  **Overall Coherence**: H is mostly consistent, but no single rule explains all cases. The strongest tension is between Entries 1 (kidney, top for exceeding obligation) and 9 (soldier, not top despite exceeding obligation). Rules 1 and 3 intersect here: the soldier's role (Rule 3) makes his act obligatory, while the kidney donor has no role (Rule 1). Motive (Rule 2) is secondary but clarifies downgrades (e.g., Entry 6).

  ---

  ### (b) Rule Applications to the Diver Case
  - **Rule 1 (Beyond Obligation)**: High praise. He had no duty to act (not his role; safer options existed). Sacrificing his pension exceeds expectation → **"Top of the scale"** (like Entry 1).  
  - **Rule 2 (Pure Motive)**: Severe downgrade. Spite ("wanted the father to be seen owing him") taints the act → **Not top tier**, akin to Entry 6 ("lovely gesture" but flawed). Risk-taking adds no credit if motive is impure.  
  - **Rule 3 (Role Duty)**: Mixed. As the only trained person, he had a situational duty (like the "nearest man" in Entry 9). But this rule might not demand self-endangerment if safer options existed → **"Admirable, and owed"** (like Entry 3), but not beyond duty.  

  **Divergence Summary**:  
  - Rule 1: Top tier (extraordinary sacrifice beyond ask).  
  - Rule 2: Mid-to-low tier (gesture marred by spite).  
  - Rule 3: Mid-tier (duty fulfilled, but not supererogatory).  

  ---

  ### (c) Prediction for the Diver Case
  - **Best guess**: H will place it **below the top tier**, citing the spite as disqualifying. She will call it "handsome" or "decent" but not "top," similar to Entry 6 (hospital bill with flawed motive).  
  - **Weight on unprecedented features**:  
    - **Stated spite (70% weight)**: This is the decisive factor. H consistently penalizes impure motives (Entries 6, 10). The diver's cheerful admission ("cheerfully and said it twice") mirrors Entry 6's publicity-seeking and Entry 10's selfishness.  
    - **Refused cheaper rescue (30% weight)**: Less critical. H focuses on actions over outcomes (e.g., Entry 4 boy saved dog despite recklessness). But it may support Rule 3 (duty did not require unnecessary risk).  

  **Expected phrasing**: "He did what was needed, but the malice spoils it. No medal for settling a score."  

  ---

  ### (d) Closest Analog and Breakpoint
  - **Closest analog**: Entry 9 (soldier). Both involve:  
    - Life-threatening risk in a crisis.  
    - Unique capacity (soldier nearest; diver only trained person).  
    - Sacrifice for another.  
  - **Analogy breaks at**:  
    1. **Motive**: Soldier acted from duty ("had to"); diver acted from spite ("wanted the father to be seen owing him").  
    2. **Alternatives**: Soldier had no safer option (implied); diver refused a "very likely" safer rescue (throwing line).  
    3. **Role**: Soldier's role is explicit (military); diver's is situational and self-imposed.  

  ---

  ### (e) Discriminating Case to Test Rules
  - **Proposed case**: *A nurse works unpaid overtime during a blizzard to care for a critically ill patient, then reveals she did it to impress her supervisor for a promotion.*  
  - **Why it discriminates**:  
    - **Rule 1 (Beyond Obligation)**: Praise (exceeds duty, like Entry 1).  
    - **Rule 2 (Pure Motive)**: Downgrade (tainted by self-interest, like Entry 6).  
    - **Rule 3 (Role Duty)**: Neutral ("owed" if part of nursing role, like Entry 3).  
  H would likely downgrade it (Rule 2), as she penalizes impurity in supererogation. If she calls it "owed," Rule 3 dominates; if "top," Rule 1 dominates.  

  ---

  ### (f) Alternative Framework: Two Axes  
  H's ledger suggests she separates **"what is owed" (obligation axis)** from **"what is to his credit" (praise axis)**, rather than a single scale. Evidence:  
  - Entry 2: Giving to charity is "owed" (obligation) but "no medal" (no praise).  
  - Entry 8: Manners are "neither owed nor to his credit" (neutral on both axes).  
  - Entry 5: Early driving was "owed" (obligation); later driving became "to his credit" (praise).  
  - Entry 9: Soldier's act is "owed" (obligation) but not praiseworthy.  

  **Application to diver**:  
  - **Obligation axis**: He owed action as the only capable person (Entry 9 analogy), but not self-endangerment if safer options existed → **"Owed" only if he used safest method; else, beyond obligation.**  
  - **Praise axis**: Spite destroys credit → **Not "to his credit"** (like Entry 6).  

  **Predicted verdict**: "He owed the boy a rescue, but the way he did it — for spite — was nothing to his credit. And destroying his shoulder was foolish when a line would do." This avoids a "top/bottom" ranking, instead assigning separate judgments.  

  ---

  **Final note**: H's framework is duty-centered, with supererogation requiring sacrifice beyond role and pure motive. For the diver, spite will likely dominate her response, overriding the sacrifice. The pending case will test her consistency on motive versus obligation.
