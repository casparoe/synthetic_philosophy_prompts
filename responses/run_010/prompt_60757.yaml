prompt: |-
  I'm a systems/safety engineer at a company that builds semi-autonomous machines for commercial greenhouses — a robotic arm on a rail that weighs pots, waters them, shuttles trays between benches, that kind of thing. I write the behavior specs that our firmware team and an outside ML vendor both implement against. Lately we've had a run of incidents that all have the same shape: the machine did something nobody intended, and when we went back to the document, the document hadn't said anything wrong, it just hadn't said anything at all about the situation. Slot 3 was occupied so the arm waited forever. A sensor got replaced with a slightly differnt model and a rule that assumed a particular reading meant "door open" went sideways. A learned policy that was fine for six weeks started dropping trays after we changed the potting mix.

  Two pieces of our process are probably the problem. Every spec template ends with a boilerplate line we call the still-life clause: all conditions not explicitly mentioned in this document are assumed unchanged. And our release process carries a number we call the change budget — how many unhandled environmental changes a spec is allowed to bring into production before somebody signs a waiver. I've become convinced the still-life clause is doing serious conceptual work that nobody on the team has thought about, and that the change budget is counting something that can't be counted that way.

  Please act as a philosopher of AI who has actually sat through engineering design reviews: someone who knows the frame-problem literature — the original worry about what stays the same when an action happens, the follow-on worry about how many preconditions you'd have to list before an action can be said to happen at all, and the more radical claim that the real issue is relevance and context-sensitivity rather than representation — but who also knows that a spec writer with a deadline isnt going to run a nonmonotonic logic on anything. Think carefully before you start writing, and open with a short brainstorm of the failure modes a procedure like this has to catch, because I want to check that you're targeting the right ones before I trust the checklist.

  The deliverable is a decision procedure my team can run on a draft spec before it goes to implementation review. It needs to:

  - be numbered steps in the order we run them, each step a question asked of the document
  - say for each step what a passing answer looks like and what a failing one looks like — not "consider whether X" but an actual standard
  - flag which steps are mechanical and which are judgment calls wearing a checklist costume
  - rule on the still-life clause: is it defensible, and if so under what conditions; if not, what replaces it in a document that has to be finite
  - rule on the change budget: is it a meaningful quantity, and if not what goes in the release process instead
  - mark every point where the procedure stops and hands the decision to a person, and say for each handoff why it's a values question rather than a facts question
  - say which version of the frame problem the procedure genuinely addresses and which one it punts on. I'd rather have something honest about only fixing the representation-level problem than something that pretends to solve relevance.

  Then run it on three drafts that you write yourself, roughly in the shape our template produces, still-life clause and all: (1) a weigh-and-return-tray routine for the rail arm, (2) a halt-on-open-door safety rule where the sensor can be dirty, occluded, or swapped for another part number, (3) a plain-language spec for a behavior that's actually implemented by a learned policy we didn't write. For at least one of the three, give me the verdict I don't want to hear.

  Sections, in this order, with rough lengths:

  1. Failure modes I'm targeting — about 200 words, this is the brainstorm
  2. The procedure — about 1000 words, the main event
  3. Still-life clause: verdict — about 200 words
  4. Change budget: verdict — about 200 words
  5. Worked runs — about 700 words total, three short spec fragments plus what the procedure says about each
  6. Where a human has to decide — about 200 words
  7. What this procedure cannot do — about 150 words

  No bibliography and no reading list, and please don't put anything in quotation marks as though it were a verbatim line from a paper or a book — paraphrase in your own words instead. I want the usable procedure, not the references. And don't hedge into "it depends" at every step; where it really does depend, say on what.
reasoning: |-
  We are addressing a problem in specification writing for semi-autonomous machines in commercial greenhouses. The core issue is that the specifications are incomplete, leading to unexpected behaviors when unmentioned conditions change. The two key elements under scrutiny are the "still-life clause" (assuming all unmentioned conditions remain unchanged) and the "change budget" (counting unhandled environmental changes allowed in production).

  The user, a systems/safety engineer, wants a decision procedure to apply to draft specs before implementation review. The procedure must be step-by-step, with clear pass/fail criteria, and address the still-life clause and change budget. We also need to run the procedure on three example specs and be honest about what the procedure can and cannot solve.

  Let's break down the response as per the requested sections.

  ### 1. Failure modes I'm targeting (200 words)

  The incidents described fall into three failure modes:

  1. **Static incompleteness**: The spec does not account for all possible states of the environment at design time. For example, the arm waiting forever because slot 3 was occupied and the spec didn't say what to do in that case.

  2. **Dynamic drift**: The environment changes over time, and the spec's assumptions become invalid. Examples include a sensor being replaced with a different model (leading to misinterpretation of readings) or a change in potting mix causing a learned policy to fail (even though the policy was trained on an older mix).

  3. **Contextual irrelevance**: The spec fails to capture what conditions are relevant to an action. The still-life clause assumes that unmentioned conditions are irrelevant, but in reality, they might become relevant due to unforeseen interactions. This is related to the frame problem in AI: how to represent what stays the same and what changes when an action is taken, and how to determine which conditions are relevant in a given context.

  These failure modes are interconnected and stem from the fundamental challenge of specifying behavior in an open, changing environment with finite documentation.

  ### 2. The procedure (1000 words)

  The procedure is a numbered list of steps to run on a draft spec. Each step is a question about the document. We'll define:

  - **Passing**: The document meets the criterion clearly.
  - **Failing**: The document does not meet the criterion, and the deficiency is not justified by an explicit, documented trade-off (which must be part of the spec, not an external note).
  - **Mechanical**: Can be checked by parsing the document without deep domain knowledge.
  - **Judgment call**: Requires domain expertise and cannot be fully automated.

  **Procedure: Pre-Implementation Spec Review (PISR)**

  **Step 1: Identify all actions and conditions explicitly mentioned**
  - *Question*: Does the document list every action the machine can take and every condition (state, sensor, environmental factor) that is read or written by these actions?
  - *Passing*: Every action and condition is explicitly listed in a dedicated section (e.g., "Actions" and "Conditions" tables). Each condition has a defined set of possible values (if discrete) or a valid range (if continuous).
  - *Failing*: Any action or condition is missing from these lists, or the values/ranges are undefined.
  - *Type*: Mechanical (if the document has structured sections for actions and conditions; otherwise, judgment call to ensure nothing is omitted).

  **Step 2: Map preconditions and effects for every action**
  - *Question*: For each action, does the document specify (a) the necessary preconditions (conditions that must hold for the action to start) and (b) the expected effects (conditions that change because of the action)?
  - *Passing*: Each action has a clear "Preconditions" and "Effects" section. Preconditions are necessary and sufficient (within the known domain). Effects are exhaustive for conditions that the action can change.
  - *Failing*: Any action lacks preconditions/effects, or the preconditions are insufficient (e.g., missing a required state) or the effects are incomplete (e.g., not accounting for all changed conditions).
  - *Type*: Judgment call (requires understanding of the action's context).

  **Step 3: Check for explicit handling of 'failure to meet preconditions'**
  - *Question*: For each precondition of every action, does the document specify what the system should do if the precondition is not met?
  - *Passing*: Every precondition has an associated failure mode and a defined system response (e.g., wait, retry, abort, escalate to operator). This includes timeouts for waiting.
  - *Failing*: Any precondition lacks a defined failure response.
  - *Type*: Mechanical (if the document has a standard section for failure handling per precondition; otherwise, judgment call).

  **Step 4: Identify all external dependencies (sensors, actuators, materials) and their properties**
  - *Question*: Does the document list every external dependency (e.g., sensor model, actuator type, material properties) and the assumptions about their behavior (e.g., sensor range, expected material characteristics)?
  - *Passing*: A "Dependencies" section lists each item and its critical properties. Properties include tolerance to variation (e.g., sensor readings when dirty, material density range).
  - *Failing*: Any dependency is missing, or the assumptions about its behavior are undefined.
  - *Type*: Judgment call (requires knowledge of what is critical).

  **Step 5: Check for variation tolerance in dependencies**
  - *Question*: For each dependency, does the document specify how much variation in its properties the system can tolerate without failure?
  - *Passing*: Each dependency has an explicit tolerance (e.g., sensor reading error margin, acceptable material property range). Tolerances are derived from system requirements or historical data.
  - *Failing*: Any dependency lacks a tolerance specification.
  - *Type*: Judgment call (requires understanding of system limits).

  **Step 6: Define the scope of the still-life clause**
  - *Question*: Does the document have a still-life clause? If yes, is it accompanied by a list of conditions that are allowed to change without breaking the spec?
  - *Passing*: The still-life clause is present and explicitly lists the conditions that are considered variable (i.e., allowed to change) and those that are fixed (must remain as specified). All other conditions are assumed fixed by default.
  - *Failing*: The still-life clause is absent, or it does not list variable conditions, or it lists conditions that are critical and should not be assumed fixed.
  - *Type*: Judgment call (requires deciding what can safely be assumed fixed).

  **Step 7: Boundary case analysis for learned behaviors**
  - *Question*: If the spec describes a behavior to be implemented by a learned policy (e.g., ML), does it define boundary cases (edge cases) that the policy must be tested against?
  - *Passing*: The document includes a set of boundary cases (e.g., extreme values, sensor failures, novel environmental conditions) that the learned policy must handle. It also specifies a fallback behavior for cases outside the training distribution.
  - *Failing*: Boundary cases are not defined, or there is no fallback.
  - *Type*: Judgment call.

  **Step 8: Review change budget allocation**
  - *Question*: Does the release process include a change budget? If so, does the document explicitly allocate parts of this budget to specific dependencies or assumptions?
  - *Passing*: The document assigns a portion of the change budget to each dependency and assumption (e.g., sensor model change: 0.2, potting mix density change: 0.5). The sum of allocated portions must not exceed the total budget. Each allocation is justified by the tolerance defined in Step 5.
  - *Failing*: The change budget is not allocated, or the allocations are not justified by tolerances, or the sum exceeds the total budget.
  - *Type*: Judgment call (allocation and justification require expert input).

  **Step 9: Human review for contextual relevance**
  - *Question*: Has a human reviewer (with system-level expertise) signed off that the spec adequately captures the context of operation and that the still-life clause's fixed conditions are indeed stable in the target environment?
  - *Passing*: A named reviewer (with stated expertise) has approved the document, specifically noting that the fixed conditions are stable and the variable conditions cover likely changes.
  - *Failing*: No such review is documented.
  - *Type*: Mechanical (to check the signature) but the underlying review is a judgment call.

  ### 3. Still-life clause: verdict (200 words)

  The still-life clause is defensible only if it is explicitly scoped. The problem is not the clause itself but its blanket application. We recommend:

  - **Retain the clause** but require that it be accompanied by two lists:
    1. **Fixed conditions**: Conditions that must remain as specified for the system to function (e.g., gravity, the structure of the greenhouse). These are not expected to change and are not monitored.
    2. **Variable conditions**: Conditions that can change within defined bounds (e.g., plant weight, humidity). The system must handle these changes.

  Conditions not listed in either category are considered fixed by default, but the spec must explicitly list the variable ones. This reduces the risk of assuming something is fixed when it isn't. The clause becomes a tool for managing complexity by forcing the writer to think about what can change and what must not.

  If the clause is used without these lists, it is indefensible because it hides assumptions. The alternative is to list every condition and its variability, but that is impractical. The scoped clause is a compromise.

  ### 4. Change budget: verdict (200 words)

  The change budget, as a single number, is not meaningful because:

  - Not all changes are equal. A sensor swap might be minor, while a change in potting mix could be major.
  - The budget aggregates dissimilar risks.

  Instead, we recommend:

  - **Replace the change budget with a risk matrix** for each dependency and assumption. The matrix should include:
    - **Variability**: How likely the dependency is to change (e.g., low, medium, high).
    - **Impact**: The severity of failure if the change occurs (e.g., low, medium, high).
    - **Mitigation**: How the system detects and handles the change (e.g., tolerance bands, fallback).

  The release process requires that:
  - High-impact items must have explicit mitigations.
  - High-variability items must have robust tolerances.

  The waiver process remains, but it focuses on specific items rather than a count. This provides traceability and prevents arbitrary aggregation.

  ### 5. Worked runs (700 words total)

  We'll write three draft specs and run the procedure.

  **Spec 1: Weigh-and-return-tray routine for the rail arm**

  *Draft Spec*:
  - **Actions**: MoveTo(slot), Weigh(tray), ReturnTray(slot)
  - **Preconditions for MoveTo(slot)**: Slot exists (1-10), arm is idle.
  - **Effects of MoveTo(slot)**: Arm at slot.
  - **Preconditions for Weigh(tray)**: Arm at slot, tray present.
  - **Effects of Weigh(tray)**: Weight recorded.
  - **Preconditions for ReturnTray(slot)**: Arm at slot, tray present.
  - **Effects of ReturnTray(slot)**: Tray returned to slot.
  - **Failure handling**: None specified.
  - **Dependencies**: Scale sensor (model XYZ), rail encoder (model ABC). Tolerances: Scale ±0.1kg.
  - **Still-life clause**: All other conditions unchanged.
  - **Change budget**: 3 allocated (1 for scale, 1 for encoder, 1 for tray weight distribution).
  - **Learned behavior**: None.
  - **Review**: None.

  *Procedure Run*:
  - Step 1: Pass (actions and conditions listed).
  - Step 2: Fail for MoveTo(slot) - missing precondition that slot is unoccupied? (Judgment: in our context, slots can be occupied by other trays? Then it fails because precondition doesn't check occupancy. Also, effects of ReturnTray might not account for tray being removed?).
  - Step 3: Fail - no failure handling for preconditions (e.g., if slot occupied, tray absent).
  - Step 4: Pass - dependencies listed.
  - Step 5: Fail - no tolerance for rail encoder (e.g., positional accuracy) or tray weight distribution (what if tray is heavier than expected?).
  - Step 6: Fail - still-life clause without listing variable conditions (e.g., tray weight, slot occupancy).
  - Step 7: N/A (no learned behavior).
  - Step 8: Fail - change budget allocations not justified by tolerances (e.g., tray weight distribution has no tolerance defined).
  - Step 9: Fail - no review.

  *Verdict*: Spec fails. Major gaps in failure handling and tolerance. Unwanted verdict: This spec is unsafe for implementation.

  **Spec 2: Halt-on-open-door safety rule**

  *Draft Spec*:
  - **Condition**: Door sensor reading > 50 (arbitrary units) -> door open.
  - **Action**: Halt all motion if door open.
  - **Preconditions**: Door sensor operational.
  - **Effects**: System halted, alarm on.
  - **Failure handling**: If sensor reading invalid (e.g., out of range [0,100]), assume door closed? (But this is risky).
  - **Dependencies**: Door sensor (model PQR). Tolerances: Sensor reading when dirty: ±10 units; when occluded: reading may drop to 0.
  - **Still-life clause**: All other conditions unchanged. Variable conditions: sensor dirt, occlusion.
  - **Boundary cases**: Sensor reading 0 (door closed), 100 (door open), 50 (threshold), and invalid (e.g., 150).
  - **Change budget**: 2 allocated (1 for sensor dirt, 1 for occlusion).
  - **Review**: Safety engineer approved.

  *Procedure Run*:
  - Step 1: Pass.
  - Step 2: Pass - preconditions and effects clear.
  - Step 3: Pass - failure handling defined (though questionable: assuming closed on invalid might be unsafe).
  - Step 4: Pass.
  - Step 5: Pass - tolerances defined for dirt and occlusion.
  - Step 6: Pass - still-life clause with variable conditions listed.
  - Step 7: N/A (not learned).
  - Step 8: Pass - allocations justified by tolerances.
  - Step 9: Pass - review documented.

  *Verdict*: Pass, but note: the failure handling (assume closed on invalid) might be unsafe. This is a values question: safety vs. availability. The procedure passes because it has a defined response, but a human might override based on risk assessment.

  **Spec 3: Plain-language spec for a learned policy (tray moving policy)**

  *Draft Spec*:
  - **Behavior**: Move trays between benches without dropping, adapting to tray weight and size variations.
  - **Implementation**: Learned policy (reinforcement learning) trained in simulation and on historical data.
  - **Boundary cases**: Tray weight: 0.5kg to 5kg; size: 30cm x 30cm to 50cm x 50cm; wet conditions (water on tray). Fallback: If confidence < 80%, slow down and retry; if still low, stop and alert.
  - **Preconditions**: Arm calibrated, environment within training bounds (not defined).
  - **Effects**: Tray moved to target location.
  - **Dependencies**: Gripper sensor, camera. Tolerances: Weight within [0.5,5]kg, size within [30,50]cm.
  - **Still-life clause**: All other conditions unchanged. Variable: tray weight, size, wetness.
  - **Change budget**: 1 allocated (for tray properties).
  - **Review**: ML vendor approved.

  *Procedure Run*:
  - Step 1: Pass (behavior described).
  - Step 2: Fail - preconditions are vague ("environment within training bounds" - what bounds?).
  - Step 3: Fail - no failure handling for precondition not met (e.g., what if weight is 6kg?).
  - Step 4: Pass - dependencies listed.
  - Step 5: Pass - tolerances defined.
  - Step 6: Pass - still-life clause with variable conditions.
  - Step 7: Pass - boundary cases and fallback defined.
  - Step 8: Fail - change budget allocation not justified (why 1? and does it cover all?).
  - Step 9: Pass - review by vendor.

  *Verdict*: Fails due to vague preconditions and missing failure handling. Unwanted verdict: This spec is not ready for implementation, especially for a learned policy.

  ### 6. Where a human has to decide (200 words)

  The procedure hands off to a human at several points:

  - **Step 2 (Preconditions/effects)**: Judgment call on what is necessary and sufficient. Why? Because determining what conditions are relevant to an action is context-dependent and requires domain knowledge. It's a facts question in theory, but in practice, it involves predicting real-world interactions.

  - **Step 5 (Tolerance)**: Setting tolerances is a values question. How much risk is acceptable? For example, allowing a sensor to be dirty might save maintenance costs but increase failure risk. This is a trade-off between safety, cost, and performance.

  - **Step 6 (Still-life scope)**: Deciding which conditions are variable or fixed is a values question. It involves assessing the stability of the environment and the cost of monitoring. For instance, assuming a greenhouse structure is fixed might be reasonable, but assuming potting mix is fixed might not be.

  - **Step 8 (Change budget allocation)**: Allocating the budget (or in the new model, assessing risk) is a values question. It requires prioritizing which changes are more critical to mitigate, based on business impact and safety.

  These handoffs are necessary because they involve risk tolerance and operational philosophy, which cannot be automated.

  ### 7. What this procedure cannot do (150 words)

  This procedure addresses the **representation-level frame problem**: it forces the explicit listing of actions, conditions, preconditions, and effects, reducing the risk of static incompleteness. It also partially handles dynamic drift by requiring tolerance specifications and boundary cases.

  However, it **cannot solve the relevance problem** (the more radical frame problem). It cannot automatically determine which conditions are relevant in an unforeseen context. For example, if a new type of obstacle appears in the greenhouse, the procedure won't catch it because it wasn't anticipated. Similarly, it cannot guarantee that a learned policy will generalize to novel situations, even with boundary cases.

  The procedure mitigates these by forcing human review and explicit fallbacks, but it cannot eliminate the risk. The real world is open-ended, and no finite spec can cover everything.
answer: |-
  ### 1. Failure Modes I'm Targeting  
  The core failure modes are:  
  1. **Static Omissions**: Unhandled states due to incomplete enumeration (e.g., arm waiting indefinitely when a slot is occupied). The spec misses explicit coverage of possible world-states.  
  2. **Dynamic Drift**: Unvalidated assumptions about environmental stability (e.g., sensor substitutions or material changes invalidating rules or learned policies). The spec doesn’t define tolerance to variation.  
  3. **Contextual Blindness**: Overreliance on the still-life clause to exclude "irrelevant" factors, which later prove critical (e.g., potting mix changes altering tray stability). This is a relevance-determination failure—specs assume fixed context without verifying what *must* stay fixed.  
  4. **Learned Behavior Brittleness**: ML specs lack boundaries for out-of-distribution inputs (e.g., policy degradation after minor environmental shifts). The spec fails to define operational limits or fallbacks.  
  These stem from treating the still-life clause as a universal quantifier ("all else is fixed") and the change budget as a scalar metric for heterogeneous risks. The procedure targets these by forcing explicit declarations of variability, tolerances, and failure responses.  

  ---

  ### 2. The Procedure: Pre-Implementation Specification Review (PISR)  
  **Rules**:  
  - **Pass**: Document meets criterion with unambiguous, testable statements.  
  - **Fail**: Criterion unmet, no justification (e.g., "TBD" or omissions).  
  - **Mechanical (M)**: Verifiable via text search or simple parsing.  
  - **Judgment Call (JC)**: Requires domain knowledge; fails if rationale absent.  

  **Steps**:  
  1. **List all actions and environmental conditions**  
     - *Question*: Does a table or structured list explicitly name every machine action (e.g., `move_arm`, `water_plant`) and every environmental condition (e.g., `slot_occupied`, `door_sensor_value`)?  
     - *Pass*: Actions and conditions are exhaustively cataloged in dedicated sections.  
     - *Fail*: Any action/condition referenced in the spec is missing from the list.  
     - *Type*: M (check for completeness against spec body).  

  2. **Define action preconditions and effects exhaustively**  
     - *Question*: For each action, are all preconditions (conditions required to start) and effects (conditions altered by the action) explicitly stated?  
     - *Pass*: Every precondition/effect is bulleted or tabulated (e.g., "Precondition: `slot_occupied == false`; Effect: `tray_weight = read_scale()`").  
     - *Fail*: Any precondition/effect is implied but not written (e.g., "move arm to slot" without checking occupancy).  
     - *Type*: JC (assess logical necessity; e.g., physics or domain constraints).  

  3. **Specify failure responses for unmet preconditions**  
     - *Question*: For each precondition, is a failure response defined (e.g., wait/retry/abort) with a timeout or escalation?  
     - *Pass*: Responses include measurable limits (e.g., "retry every 5s for 60s, then alert operator").  
     - *Fail*: Any precondition lacks a response or uses vague terms ("handle appropriately").  
     - *Type*: M (check for presence; JC for timeout reasonableness).  

  4. **Declare dependencies and tolerances**  
     - *Question*: Is every hardware/material dependency (e.g., sensor model, potting mix density) listed with acceptable ranges (e.g., `sensor_error_margin: ±5 units`)?  
     - *Pass*: Dependencies include tolerance bands (numeric or categorical).  
     - *Fail*: Any dependency lacks tolerances or ranges.  
     - *Type*: JC (tolerances require domain knowledge).  

  5. **Bound still-life clause variability**  
     - *Question*: Does the still-life clause include an "allowable changes" list (conditions permitted to vary within tolerances)?  
     - *Pass*: Clause is followed by a list (e.g., "Variable: tray_weight, sensor_reading").  
     - *Fail*: Clause lacks this list or uses a blanket "all else fixed" statement.  
     - *Type*: M (check for list presence).  

  6. **Validate learned behavior boundaries**  
     - *Question*: For ML-implemented behaviors, are boundary inputs (e.g., min/max weight, sensor noise levels) and fallback behaviors (e.g., "default to rule-based if confidence < 90%") defined?  
     - *Pass*: Boundaries are quantifiable; fallbacks are action-specific.  
     - *Fail*: Boundaries absent or fallbacks undefined.  
     - *Type*: JC (boundaries require risk assessment).  

  7. **Assign risk to change budget items**  
     - *Question*: Is each change budget allocation tied to a dependency (Step 4) and justified by its tolerance (e.g., "sensor swap risk: 0.3; tolerance ±5 units")?  
     - *Pass*: Allocations map to dependencies with rationale (e.g., "tolerance covers 95% of observed swaps").  
     - *Fail*: Budget lacks per-item assignments or justification.  
     - *Type*: JC (rationale links tolerance to risk).  

  8. **Require human sign-off on stability**  
     - *Question*: Does a named reviewer attest that "fixed" conditions (from still-life clause) are stable in the operational environment?  
     - *Pass*: Signature with role (e.g., "Safety Lead: fixed conditions valid for Greenhouse Zone A").  
     - *Fail*: No signature or role unspecified.  
     - *Type*: M (check signature; JC in review).  

  ---

  ### 3. Still-Life Clause: Verdict  
  **Defensible under strict conditions**: Retain the clause, but only if paired with an explicit "allowable changes" list (Step 5). This forces writers to declare what *can* vary (e.g., sensor readings, material properties), turning the clause from a blanket assumption into a bounded commitment. Conditions not on this list are treated as fixed, but the list must be reviewed for stability (Step 8). Without this list, the clause is **indefensible**—it hides assumptions. Replacements like exhaustive world-state enumeration are impractical; the scoped clause balances brevity and rigor by isolating variability.  

  ---

  ### 4. Change Budget: Verdict  
  **Not meaningful as a scalar quantity**. Aggregating disparate risks (e.g., sensor swap = 0.2, soil change = 0.5) obscures severity and conflates likelihood with impact. Replace it with:  
  - A **risk register** per release, listing each dependency (Step 4) with:  
    - **Variability likelihood** (Low/Medium/High, based on historical change frequency).  
    - **Failure impact** (Low/Medium/High, based on safety/operational consequences).  
    - **Mitigation coverage** (e.g., "tolerance ±5 units covers Medium variability").  
  Waivers require justifying unmitigated High-impact items. This shifts focus from counting changes to managing traceable risks.  

  ---

  ### 5. Worked Runs  
  **Spec 1: Weigh-and-Return-Tray Routine**  
  ```markdown
  Actions: move_arm(slot_id), weigh_tray(), return_tray().  
  Conditions: slot_occupied (bool), tray_weight (float).  
  Preconditions:  
    - move_arm: slot_id valid (1-10), arm_stationary=true.  
    - weigh_tray: arm_at_slot=true.  
  Effects:  
    - move_arm: arm_at_slot=true.  
    - weigh_tray: tray_weight=scale_reading.  
  Failure Handling: If slot_occupied, wait 10s then skip slot.  
  Dependencies: Scale sensor (Model A; tolerance ±0.1kg).  
  Still-Life Clause: All else unchanged. [No "allowable changes" list].  
  Change Budget: 2 (allocated: sensor drift 1.5, tray_material 0.5).  
  ```  
  **Procedure Verdict**:  
  - Steps 1–3: Pass (actions/preconditions/failure handling clear).  
  - Step 4: Fail (no tolerance for slot_id validity or arm_stationary).  
  - Step 5: Fail (still-life clause lacks "allowable changes" e.g., tray_weight).  
  - Step 6: N/A (no ML).  
  - Step 7: Fail (budget not tied to dependencies; tray_material undefined).  
  - Step 8: Fail (no sign-off).  
  **Overall: FAIL**. Unwanted verdict: This spec risks deadlock if arm_stationary precondition fails—**do not implement**.  

  **Spec 2: Halt-on-Open-Door Safety Rule**  
  ```markdown
  Actions: emergency_halt().  
  Conditions: door_sensor_value (int), sensor_status (enum: OK/DIRTY/FAULT).  
  Preconditions: door_sensor_value > 50 OR sensor_status=FAULT.  
  Effects: system_motion=halted.  
  Failure Handling: If sensor_status=DIRTY, use backup camera; if FAULT, halt.  
  Dependencies: Door sensor (Model B; tolerance: DIRTY=±10 units, FAULT=value=0).  
  Still-Life Clause: All else unchanged. Allowable changes: sensor_status.  
  Boundary Cases: sensor_value=0 (closed), 100 (open), 55 (noisy).  
  Change Budget: 1.5 (allocated: sensor_status drift=1.0; tolerance justified).  
  Review: Signed by Safety Lead.  
  ```  
  **Procedure Verdict**:  
  - Steps 1–3: Pass (conditions/failure handling explicit).  
  - Step 4: Pass (tolerances defined for sensor states).  
  - Step 5: Pass (still-life clause lists sensor_status as variable).  
  - Step 6: N/A.  
