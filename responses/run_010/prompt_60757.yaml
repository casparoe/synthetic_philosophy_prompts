  ---

  ### 6. Where a Human Has to Decide  
  Handoffs occur at:  
  - **Step 2 (Preconditions/Effects)**: Judgment call. Why? Determining logical necessity involves domain context and values (e.g., "Is slot occupancy *always* relevant?" involves safety/throughput trade-offs).  
  - **Step 4 (Tolerances)**: Judgment call. Why? Setting ranges (e.g., sensor error margins) balances cost of false positives vs. misses—a values-based risk appetite question.  
  - **Step 7 (Budget Rationale)**: Judgment call. Why? Linking tolerances to risk allocations prioritizes mitigations based on organizational tolerance for failure (e.g., safety vs. uptime).  
  - **Step 8 (Stability Sign-off)**: Judgment call. Why? Approving "fixed" conditions (e.g., greenhouse structure) relies on experiential knowledge of environmental dynamics, which is unquantifiable.  

  These are values decisions because they weigh "how safe is safe enough?" against operational realities—not purely technical facts.  

  ---

  ### 7. What This Procedure Cannot Do  
  This procedure **solves the representation-level frame problem**: It forces explicit articulation of preconditions, effects, and variability, eliminating static omissions (e.g., unhandled states) and defining dynamic tolerances. It **does not solve the relevance problem** (the radical frame problem). It cannot:  
  - Infer unanticipated contextual dependencies (e.g., a new obstacle type).  
  - Guarantee ML policies generalize beyond defined boundaries.  
  - Automate judgment calls about "what matters"; it only surfaces assumptions for human scrutiny.  
  Relevance remains context-dependent and open-world; the procedure mitigates this via fallbacks and reviews but cannot eradicate it.
