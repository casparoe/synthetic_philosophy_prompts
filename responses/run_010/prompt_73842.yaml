prompt: |-
  I chair the clinical ethics consultation service at a teaching hospital, and we have to decide our hardest advance-directive case in four years. I want you to reason from our own file rather than from general principle, because we will be asked afterwards why we decided as we did.

  Our record, abbreviated:

  1. A man with advanced ALS whose directive refused mechanical ventilation. He was ventilator-dependent after an acute crisis but able to signal refusal consistently through an eye-gaze device. We honored the directive and withdrew ventilation.

  2. A woman who at 62, fully competent, refused artificial nutrition and hydration once she no longer recognized her children and there was no reasonable hope of recovery. Nine years later she met that description; she appeared contented, smiled at music, showed no signs of distress. When she developed dysphagia we honored the directive and declined a feeding tube. Her family told us she would have found the alternative unbearable.

  3. A woman whose directive refused any life-prolonging treatment if she became, in her words, a shell of herself. She had always been easygoing and took pleasure in small things; in the year before the consultation she had told staff repeatedly that she was happy and delighted in visits from her grandchildren. We declined to honor the directive and authorized antibiotics for her pneumonia.

  4. A patient with schizoaffective disorder who between episodes signed a directive asking to be medicated even if she objected when acutely ill. When the episode came she objected strenuously and was in obvious distress. We honored the directive over her present objection.

  5. A man who at 45 refused dialysis if he ever lost the ability to make his own decisions. At 78, with moderate dementia, he could no longer manage his finances but recognized his wife, asked about his garden, and enjoyed visits. When his kidneys failed we declined to honor the directive and began dialysis.

  The new case: a woman diagnosed with early-onset Alzheimer's at 58. At 59, competent and after two counseling sessions with her husband present, she refused antibiotics and hospital transfer for any intercurrent infection once she could no longer hold a conversation with someone she loved and could no longer read. She crossed that threshold two years ago. She is not distressed: she gardens with a volunteer, sings weekly, and greets her husband warmly, though she no longer knows his name. She now has pneumonia. Her husband tells us that this is precisely the moment she described, and then adds that the woman who wrote the directive is not the woman sitting in the chair, and that the woman sitting in the chair seems glad to be alive.

  Please give us: (a) which precedent is the closest analog for honoring the directive and which is closest for declining it, with the respects of similarity and difference stated explicitly; (b) two or three general rules that would explain all five of our past rulings, each stated so that it does genuinely account for all five, and each paired with a note on what it makes decisive — the fit between the condition described and the condition present, the balance between the interests the directive protects and the interests the patient now has, the persistence or rupture of the valuing self, or something else you think is doing the work; (c) what each rule implies for the new case, including any rule that comes out indeterminate here and why; (d) your recommendation to the committee, with your reasons for preferring one rule over the others given how we have actually ruled rather than how we might have; and (e) one hypothetical case that has never come before us which, had it arisen, would have forced our record to discriminate between these rules. Aim for roughly 900 words. No bibliography or references — we want your reasoning about our file, not a survey of the literature.
reasoning: |-
  Okay, let me approach this complex ethics consultation systematically. The user chairs a clinical ethics service and needs help with their most challenging advance directive case in four years, specifically requesting reasoning from their institutional precedents rather than general principles. 

  First, I need to deeply understand their five past cases to identify consistent patterns. The ALS case (1) honored the directive because the patient could still communicate refusal - that seems to hinge on current decision-making capacity aligning with prior wishes. The dementia case (2) honored refusal of feeding tubes despite the patient appearing content, likely because the directive's specific trigger ("not recognizing children") was met. Case (3 declined the directive because the patient showed preserved enjoyment of life contrary to being a "shell," suggesting we look at current experiential interests. The psychiatric case (4) overrode current objections based on prior competent instructions, emphasizing precedent autonomy. The dialysis case (5) didn't honor the refusal because the patient still derived meaning from relationships and hobbies despite dementia.

  For the new Alzheimer's case, the directive's trigger seems met (can't hold conversations or read), but the husband argues the patient still finds joy in living. The tension reminds me most of case (2) for honoring (specific trigger met) and case (3) for declining (preserved quality of life). 

  To build rules, I notice three principles emerging: 1) Strict trigger satisfaction (cases 1,2,4) where we honor if conditions match exactly; 2) Current experiential interests (cases 3,5) where we preserve life if the patient shows positive engagement; 3) Narrative integrity (cases 2,4) where we honor if there's a fundamental break in identity. 

  Applying these to the new case: Rule 1 says honor (trigger met); Rule 2 says decline (she gardens/sings); Rule 3 is split - is not reading/conversing a sufficient rupture? The husband's "not the same person" comment complicates this.

  Given their past rulings, I lean toward honoring the directive like in case (2), but I'm torn because case (3) and (5) show they value current well-being. The hypothetical about a patient refusing treatment if unable to recognize family would test whether they prioritize triggers over current contentment.

  I'll structure my response to match their requested format: analog cases first, then deriving rules from all five precedents, applying each to the new case, making a recommendation with institutional consistency as the priority, and designing a hypothetical that exposes tensions in their framework.
answer: |-
  ### (a) Closest Precedents  

  - **For honoring the directive**: **Case 2 (Woman with dementia refusing feeding tube)**.  
    *Similarities*: Both involve a competent prior refusal based on loss of specific cognitive capacities (recognition of loved ones vs. conversation/reading). Both patients later appeared content despite meeting the directive’s threshold. The directive’s trigger was objectively met in both.  
    *Differences*: Case 2’s directive included "no reasonable hope of recovery," whereas here the prognosis is implicit. Case 2’s family affirmed the patient’s values; here, the husband questions identity continuity.  

  - **For declining the directive**: **Case 3 (Woman refusing treatment if a "shell of herself")**.  
    *Similarities*: Both patients showed preserved positive affect and engagement (gardening/singing here; happiness/grandchildren visits in Case 3). Both directives used subjective terms ("shell of herself" vs. inability to converse/read) open to interpretation.  
    *Differences*: Case 3’s directive lacked concrete thresholds; here, the criteria are explicit. Case 3’s patient expressed current happiness; here, the patient’s contentment is observed but not self-reported.  

  ---

  ### (b) General Rules Explaining All Five Rulings  

  1. **Rule of Threshold Fidelity**  
     *Description*: Honor the directive if the patient’s **current condition unambiguously satisfies all objective criteria** specified in the directive.  
     *What it makes decisive*: The fit between the directive’s predefined conditions and the present reality.  
     *Supported by*:  
     - Case 1: Ventilator withdrawn because ALS patient met "ventilator-dependent" criterion and signaled refusal.  
     - Case 2: Feeding tube refused because patient met "no recognition + no recovery" criteria.  
     - Case 4: Medication enforced because directive’s "acute illness" trigger was met.  

  2. **Rule of Present Interests**  
     *Description*: Override the directive if the patient **demonstrates sustained positive engagement with life** inconsistent with the directive’s assumed suffering.  
     *What it makes decisive*: The balance between prior values and current experiential interests (e.g., joy, relationships, minimal distress).  
     *Supported by*:  
     - Case 3: Antibiotics authorized; "shell" not met due to observed happiness.  
     - Case 5: Dialysis initiated; patient enjoyed family/garden despite dementia.  
     - Case 2: *Still honored* because directive included "no reasonable hope," negating future interests.  

  3. **Rule of Identity Continuity**  
     *Description*: Uphold the directive only if there is a **fundamental rupture in the patient’s valuing self** (e.g., loss of core relationships or capacities central to their identity).  
     *What it makes decisive*: Persistence or rupture of the self that authored the directive.  
     *Supported by*:  
     - Case 4: Medicated; prior self’s values deemed authoritative during episodic rupture.  
     - Case 2: Directive honored; inability to recognize children was identity-defining.  
     - Case 5: Dialysis initiated; dementia left core identity (gardener, spouse) intact.  

  ---

  ### (c) Application to New Case  

  - **Threshold Fidelity**: Directive should be **honored**.  
    *Why*: Explicit thresholds ("unable to converse with loved ones or read") are objectively met. *Indeterminate?* No—criteria are clear.  

  - **Present Interests**: Directive should be **declined**.  
    *Why*: Patient gardens, sings, greets husband warmly—demonstrating positive engagement. *Indeterminate?* No; observable interests conflict with directive’s assumptions.  

  - **Identity Continuity**: **Indeterminate**.  
    *Why*: Loss of conversation/reading may constitute a rupture (directive’s view), but preserved warmth/joy suggests relational identity endures. Husband’s statement ("not the same woman") supports rupture, but her actions imply continuity.  

  ---

  ### (d) Recommendation to Committee  
  **Honor the directive and withhold antibiotics**.  

  **Reasons**:  
  1. **Institutional consistency**: Your service prioritizes *Threshold Fidelity* when criteria are unambiguous (Cases 1, 2, 4). Here, the directive’s conditions ("unable to hold a conversation... or read") are objectively satisfied—unlike Case 3’s vague "shell of herself."  
  2. **Distinguishing Case 5**: Dialysis was initiated because the patient retained identity-defining capacities (recognizing wife, gardening). Here, the directive specifically targeted loss of conversation/reading—capacities the patient no longer has.  
  3. **Addressing the husband’s concern**: While the patient appears content, Case 2 established that apparent contentment does not override a directive when its conditions are met. The husband’s claim that "she seems glad to be alive" mirrors Case 2’s family, who argued the opposite—yet you honored the directive.  
  4. **Avoiding arbitrariness**: *Present Interests* risks subjective judgments (e.g., is singing "enough" joy?). *Identity Continuity* is split here, but *Threshold Fidelity* provides a clear, objective standard aligned with your history.  

  ---

  ### (e) Hypothetical Discriminating Case  
  **Scenario**: A writer with early dementia signs a directive refusing life-prolonging treatment if she "cannot write or discuss literature." Years later, she can no longer write or analyze texts but delights in listening to audiobooks and hugs her granddaughter while murmuring "love." She develops sepsis.  

  **How rules conflict**:  
  - *Threshold Fidelity*: Honor directive—criteria met.  
  - *Present Interests*: Override directive—she shows pleasure/connection.  
  - *Identity Continuity*: Indeterminate—loss of writing ruptures her "writer" identity, but listening/relationships suggest partial continuity.  

  **Why it discriminates**: Your past rulings would force a choice. *Case 2* (honored despite contentment) supports honoring; *Case 5* (overrode for retained identity) might support overriding if "listening to literature" preserves core identity. The outcome would reveal whether *Threshold Fidelity* or *Present Interests* dominates when capacities are lost but simpler joys persist.  

