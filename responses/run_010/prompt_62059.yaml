answer: |-
  Here is the diagnostic decision tree for your Scanlonian contractualism reading group, structured to reveal principled positions on aggregation through responses to concrete cases and judgments. The tree has 10 decision points (nodes) covering the required axes independently.

  ---

  ### **Axes & Their Independence**
  1.  **De Minimis Threshold (Magnitude vs. Kind)**: Is a burden too small to complain about based on its *size* or its *type*? (Not entailed by commensurability: one could hold shocks are commensurate with death *in kind* but still too small *in magnitude* to count).
  2.  **Claim Commensurability**: Can burdens of different types (e.g., death vs. brief shock) be meaningfully compared/weighed? (Not entailed by de minimis: shocks might be non-de-minimis but still *incommensurable* with death).
  3.  **Unit of Complaint**: Does a complaint arise from harm to the *whole person-life* or to *momentary stages of experience*? (Not entailed by de minimis/thresholds: one could hold death harms the whole life *and* shocks are de minimis).
  4.  **Numbers as Tie-Breakers Only**: Does the number of people *only* break ties between claims of *equal* strength? (Not entailed by commensurability: claims could be commensurable but numbers only matter when claims are tied).
  5.  **Independent Weight of Numbers**: Can a larger number of weaker claims *outweigh* a smaller number of stronger claims? (Not entailed by tie-breaking: numbers could break ties *without* outweighing unequal claims).
  6.  **Risk as Complaint**: Does imposing a *risk* of harm itself generate a complaint, or only the actual harm if it occurs? (Not entailed by unit of complaint: risk could harm the whole life *or* only matter upon realization).
  7.  **Comparison Timing**: When comparing claims, do we consider the situation *before* uncertainty resolves (ex ante) or *after* (ex post)? (Not entailed by risk-as-complaint: one could see risk as a complaint but still compare ex post).
  8.  **Grounding of Non-Pooling**: Why can't we simply add complaints? Due to the *separateness of persons*, the need for *public justification*, or *no deeper reason*? (Not entailed by other axes; a meta-commitment).
  9.  **Scope of "Individualist Restriction"**: Must principles be justifiable *to each individual separately*, or can groups/collectives hold complaints? (Not entailed by grounding: separateness of persons could imply individual justification *or* collective claims).
  10. **Aggregation Cap**: If numbers count, is there a point where adding *more* people with a complaint *stops* increasing its weight? (Not entailed by de minimis: trivial burdens might be non-de-minimis but aggregatable only up to a cap).

  ---

  ### **The Decision Tree**
  *Answer each question based on intuitive judgment. Cases referenced:*
  - **Case A**: Save 1 identifiable person from death OR save 5 other people from death (all identical, no other differences).
  - **Case B**: Save 1 person from death OR prevent 1 billion people from each receiving a brief, intensely painful but harmless electric shock (no lasting effects).
  - **Risk Case**: Policy that imposes a 1-in-a-million risk of death on each of 1 million people (expected death = 1).

  1.  **In Case B, does preventing the billion shocks have *any* moral importance compared to saving the one life?**
      *   **YES** → Go to 2
      *   **NO** → **Taurek's View (Numbers Never Count)**. *Leaf 1*

  2.  **Is the reason shocks don't matter in Case B that the *type* of burden (brief pain) is *categorically different* from death?**
      *   **YES** (Kind-based threshold) → Go to 3
      *   **NO** (Shocks *could* matter if severe enough, but here they're too *small*) → Go to 4

  3.  **Can *any* burden of a different kind (e.g., pain vs. death) be weighed against another?**
      *   **NO** (Full incommensurability) → **Scanlon's Tie-Breaker (Capped Aggregation?)**. *Leaf 2*  
      *   **YES** (Commensurable in principle) → **Unoccupied: Kind-threshold + Commensurability**. *Leaf 3*

  4.  **In Case A, must we save the five?**
      *   **YES** → Go to 5
      *   **NO** → Go to 6

  5.  **Is saving the five required *only* because their claims are *equally strong* and numbers break the tie?**
      *   **YES** (Numbers only break ties) → Go to 7
      *   **NO** (Five claims together outweigh one) → Go to 8

  6.  **Must we give each person in Case A an *equal chance* to be saved?**
      *   **YES** → **Broome's Fairness (Weighted Lottery)**. *Leaf 4*  
      *   **NO** → **Taurek's View (Save One or Flip Coin)**. *Leaf 1*  

  7.  **In a policy imposing a 1-in-a-million risk of death on 1 million people, does each person have a complaint *because of the risk itself*?**
      *   **YES** → **Unoccupied: Tie-Breaker + Risk-as-Complaint**. *Leaf 5*  
      *   **NO** (Complaint only if death occurs) → **Scanlon's Standard View (Tie-Breaker)**. *Leaf 6*  

  8.  **Does a *single* shock in Case B generate a complaint?**
      *   **NO** (De minimis by magnitude) → Go to 9
      *   **YES** → Go to 10

  9.  **Can a *large enough number* of shocks outweigh saving a life?**
      *   **YES** (No cap) → **Unrestricted Additive Aggregation (Utilitarianism)**. *Leaf 7*  
      *   **NO** (Capped aggregation) → **Capped Aggregation (e.g., Fixed "Aggregation Limit")**. *Leaf 8*  

  10. **Is the complaint about death *much stronger* per person than the complaint about a shock?**  
      *    **YES** (Priority weighting) → **Priority View (e.g., Parfit)**. *Leaf 9*  
      *    **NO** (Linear weighting) → **Unrestricted Additive Aggregation (Utilitarianism)**. *Leaf 7*  

  ---

  ### **Leaves of the Tree**

  *   **Leaf 1: Taurek's View (Numbers Never Count)**  
      *Core Claim*: Saving identifiable individuals is paramount; numbers don't outweigh saving one.  
      *Case A*: Save the one or flip a coin (no obligation to save five).  
      *Case B*: Save the one life (shocks don't matter).  
      *Risk Case*: No complaint about the risk itself; complaint only if death occurs.  
      *Awkward Commitment*: Must let a billion suffer shocks to save one life.

  *   **Leaf 2: Scanlon's Tie-Breaker (Capped Aggregation?)**  
      *Core Claim*: Numbers break ties between equally strong claims; burdens of different kinds are incomparable.  
      *Case A*: Save the five (claims are equal, numbers break tie).  
      *Case B*: Save the one life (death and shock are incomparable; no tie to break).  
      *Risk Case*: No complaint about risk; complaint only upon death.  
      *Awkward Commitment*: Cannot explain why saving five is required but preventing a billion shocks is irrelevant.

  *   **Leaf 3: Unoccupied (Kind-threshold + Commensurability)**  
      *Core Claim*: Burdens differ in kind (shocks irrelevant), but comparable burdens *can* be aggregated. *Incoherent?* Defining a "kind" threshold while accepting commensurability of burdens within/across kinds is unstable.  
      *Case A*: Save five. *Case B*: Save one. *Risk Case*: (Undetermined).  
      *Awkward Commitment*: Shocks are "irrelevant in kind" yet comparable to death if severe enough? (Likely incoherent/unattractive).

  *   **Leaf 4: Broome's Fairness (Weighted Lottery)**  
      *Core Claim*: When claims conflict, fairness requires giving equal chances proportional to claim strength.  
      *Case A*: Give each of the six a 5/6 chance of survival (save the five if possible).  
      *Case B*: Give the person facing death a near-100% chance vs. negligible chances for shock-recipients.  
      *Risk Case*: Each person has a complaint about the *unfair risk imposition* if alternatives exist.  
      *Awkward Commitment*: Running lotteries can be practically absurd (e.g., in Case B).

  *   **Leaf 5: Unoccupied (Tie-Breaker + Risk-as-Complaint)**  
      *Core Claim*: Numbers only break ties between equal claims, but *risk imposition itself* generates a complaint. *Unexplored?* Tension between tie-breaking (downplaying numbers) and recognizing risk complaints (sensitive to probabilities/numbers).  
      *Case A*: Save five. *Case B*: Save one. *Risk Case*: Each has complaint about the risk.  
      *Awkward Commitment*: Hard to justify why risk complaints (sensitive to numbers) don't allow aggregation *beyond* tie-breaking.

  *   **Leaf 6: Scanlon's Standard View (Tie-Breaker)**  
      *Core Claim*: Principles must be justifiable to each; numbers only resolve ties between equally strong individual complaints.  
      *Case A*: Save the five (equal complaints, numbers break tie).  
      *Case B*: Save the one life (death complaint stronger than any shock complaint; no tie).  
      *Risk Case*: No complaint about risk; complaint only if death occurs.  
      *Awkward Commitment*: Cannot justify saving 100 from minor headaches over one from death, even if headaches are non-de-minimis.

  *   **Leaf 7: Unrestricted Additive Aggregation (Utilitarianism)**  
      *Core Claim*: Total burden matters; complaints sum linearly regardless of distribution.  
      *Case A*: Save the five (less total death).  
      *Case B*: Prevent billion shocks (if shocks are bad enough individually to sum to >1 death).  
      *Risk Case*: Each has a tiny complaint; the million tiny complaints aggregate to outweigh alternatives causing less expected harm.  
      *Awkward Commitment*: Must accept "Utility Monster" cases (e.g., if shocks are 0.0000001% as bad as death, save one life).

  *   **Leaf 8: Capped Aggregation (e.g., "Aggregation Limit")**  
      *Core Claim*: Numbers count, but only up to a point; adding more complaints yields diminishing/nil returns.  
      *Case A*: Save the five (numbers "count" here).  
      *Case B*: Save the one life (billion shocks below cap; cannot outweigh death).  
      *Risk Case*: Aggregate complaint capped; may not outweigh saving one identifiable life.  
      *Awkward Commitment*: Arbitrariness of the cap (why *this* number?).

  *   **Leaf 9: Priority View (e.g., Parfit)**  
      *Core Claim*: Greater weight is given to alleviating worse-off individuals; benefits to the worse off matter more.  
      *Case A*: Save the five (each death equally bad).  
      *Case B*: Save the one life (death puts victim in a *much* worse position than shock recipients).  
      *Risk Case*: Complaints weighted by how badly off one would be *if* harmed; risk of being worst-off generates strongest complaint.  
      *Awkward Commitment*: May require aiding a slightly worse-off person over many much worse-off but not-quite-as-bad individuals.

  *   **Leaf 10: Contractualism without Individualist Restriction**  
      *Core Claim*: Groups/collectives can hold complaints that aren't reducible to individual claims.  
      *Case A*: Save the five (the group of five has a stronger collective complaint).  
      *Case B*: Prevent billion shocks (the "shocked collective" has a massive complaint).  
      *Risk Case*: The "at-risk group" has a collective complaint proportional to expected harm.  
      *Awkward Commitment*: Risks "double-counting" or losing the core contractualist focus on individual justifiability.

  ---

  ### **Housekeeping**

  1.  **Unoccupied Combinations & Reasons**:
      *   **Leaf 3 (Kind-threshold + Commensurability)**: Likely *incoherent*. If shocks are "different in kind" and thus irrelevant in Case B, allowing them to be commensurable/aggregatable elsewhere is inconsistent.
      *   **Leaf 5 (Tie-Breaker + Risk-as-Complaint)**: *Unexplored*. Logically possible but tension between tie-breaking logic and recognizing risk complaints makes it unattractive; no prominent defender.
      *   *Other Combinations*: All logically possible combinations of axes are covered and occupied (or flagged as incoherent/unexplored) within the leaves generated.

  2.  **Extensionally Equivalent Leaves & Divergence**:
      *   **Priority View (Leaf 9) vs. Capped Aggregation (Leaf 8)** often agree (e.g., both prefer saving one life in Case B). They **diverge** in:
          *   **Moderate Burdens, Large Numbers**: Saving 1 from death vs. saving 100,000 from paralysis. Priority View *might* still save the one (if death is *much* worse). Capped Aggregation *might* save the many (if paralysis is non-de-minimis and aggregation below cap is sufficient).
          *   **Risk Case**: Priority View weights the complaint of the (potential) worst-off heavily. Capped Aggregation aggregates complaints up to a limit. If the cap is high, Capped Aggregation might favor preventing the risk over saving one life; Priority View likely would not.

  3.  **Tree Failure Point (Identical Answers → Different Leaves)**:
      *   The tree **fails separation** at the path leading to **Leaf 2 (Scanlon Tie-Breaker)** and **Leaf 8 (Capped Aggregation)**. Both paths answer:  
          *   Case B: NO (shocks don't matter) → (2) YES (Kind-threshold) → (3) NO (Incommensurable) → **Leaf 2**  
          *   Case B: NO → (2) NO (Magnitude threshold) → (8) NO (Single shock no complaint) → (9) NO (Capped) → **Leaf 8**
      *   *Why?* Both routes answer "NO" to shocks mattering in Case B, but for different reasons (Kind vs. Magnitude threshold). The tree distinguishes them via Node 2, but participants sharing "NO" on Node 1 and "NO" on Node 4 will end on *different* leaves depending on their reason for dismissing shocks in Case B. This is intentional, as the reason (Kind vs. Magnitude) is philosophically crucial.

  This tree forces participants to confront tensions between their verdicts on Case A and Case B, reveals foundations for aggregation/non-aggregation, and maps the logical space (including unexplored/incoherent corners). It should generate rich discussion about principled consistency within Scanlonian contractualism.
