prompt: |-
  I am in Year 13 and writing an EPQ on why some online groups are easy to escape from and others are not. I have been reading C. Thi Nguyen's paper on echo chambers and epistemic bubbles (Episteme, 2020), and I have taken from it the rough idea that a bubble simply leaves other voices out, so it is fixed by exposure to more of them, whereas a chamber actively teaches its members to distrust the outside, so exposure makes things worse rather than better. I want to test that idea against groups I actually know, because I suspect my own verdicts do not all fit it.

  Here is my working principle, in my own words: the difference between the two is not which information is missing but what the group says about the people who have it. If the group is merely silent about outside sources, it is a bubble and the cure is information. If the group has something to say about outside sources — that they are corrupt, captured, stupid or lying — then it is a chamber, and the cure is the slow rebuilding of trust rather than the supply of facts.

  Here are my verdicts on six cases.

  A. My school chess club. A strong player recommends a particular opening line, everyone copies it, and nobody checks an engine. I have never heard anyone disparage engines or books. Verdict: a bubble, and a trivially curable one — an hour with a free engine bursts it. But I am uneasy, because we also simply defer to the best player, which seems like normal and sensible reliance on an expert rather than a defect at all.

  B. A large group promoting a supplement said to cure exam anxiety. It does not ignore the NHS website and GPs; it explains them, claiming that both are captured by the pharmaceutical industry and that any official warning is itself evidence of the capture. Verdict: a chamber, and the clearest one I have. Reading more mainstream sources confirms the group's story rather than undermining it.

  C. My extended family's WhatsApp group. Everyone votes the same way, nobody ever mentions the other side, and nobody distrusts the news — my cousin reads the broadsheets and disagrees mildly, and this is tolerated. Verdict: a bubble, but I do not think it counts as a harm. Nothing is being suppressed and nobody is being inoculated against anything.

  D. A support group for people with a rare genetic condition, which my friend's mother is in. Newcomers are warned, firmly and repeatedly, not to trust pharma-funded patient forums, and not to trust a particular celebrity's wellness advice. As far as I can establish, both warnings are simply true, and following them has protected members from being exploited. Verdict: not a chamber. Yet structurally it does exactly what B does — it discredits outside sources in advance and tells members that apparent counter-evidence should be discounted.

  E. A friend who deliberately left a partisan forum and started reading across the spectrum for six months. He did not become more moderate. He became more extreme, and far more contemptuous of the side he had left, and he has now joined a group that explains away all of his new reading as manufactured. Verdict: bursting the bubble made it worse, and I think the reason is that the chamber was waiting downstream. I want a principle that explains this rather than treating it as bad luck.

  F. A group I found while researching which claims that every mainstream news outlet is lying, but which never offers any rival account of what is actually happening, and has no positive doctrine at all — only distrust. Verdict: neither bubble nor chamber, because on my principle a chamber must be doing something with the distrust, and this group does nothing with it. I have been calling it a vacuum, but I have no idea whether that is a real third category or a confusion.

  B and D are the pair I cannot reconcile, and I expect any honest answer will have to break one of them: either the principle must be allowed to look at whether the discrediting is true, in which case it stops being a test I can apply from inside a group and becomes a test I can only apply once I already know the answer; or the principle stays structural, in which case D is a chamber after all and I have to give up a verdict I feel strongly about.

  Please do the following. State a principle — or, if one will not do the work, a small set of competing candidates — precise enough that someone could apply it to a new group without consulting me. Tie every clause to the case that motivates it and say what that clause is there to exclude. Then say explicitly which of my six verdicts your principle forces me to drop, and which it can save only at the cost of complexity that I should not be willing to pay. I also want your verdict on whether ordinary deference in case A is on a continuum with bubbles, and if so where the threshold lies and what marks it. And say whether F needs a third category or is better handled as a limiting case of one of the existing two.

  I have no access to journals or the internet for this, so please do not send me to sources or suggest further reading; everything has to be argued out in front of me.

  Reply with a single JSON object and nothing else, using exactly these keys:

  - "principle": an object with "name" (a short label of your own choosing), "statement" (one or two sentences, precise enough to be applied mechanically), and "clauses" (an array of objects, each with "clause", "motivating_case" giving the letter of the case above that requires it, and "what_it_excludes", describing the kind of case the clause is there to keep out).
  - "alternative_principles": an array of objects, each with "name", "statement" and "cost", giving the simpler or more complex rivals you considered and what each would force me to abandon. Leave empty if there are none.
  - "case_verdicts": an array of six objects, one per case A to F, each with "case_id", "my_verdict", "your_verdict", "status" (one of "saved", "revised", "given_up"), and "why".
  - "hardest_pair": an object with "cases" (the two case ids), "can_both_be_saved" (true or false), "cost_of_saving_both", and "which_verdict_goes_if_not".
  - "deference_threshold": an object with "is_a_continuum" (true or false), "threshold", and "how_to_detect_it".
  - "third_category": an object with "needed" (true or false), "name", "definition", and "how_it_differs_from_chamber".
  - "new_cases": an array of three objects, each with "case" (a concrete group you invent that I have not listed), "classification", "cure", and "what_it_tests" about the principle you settled on.
  - "notes": free text, briefly, for anything that does not fit the schema above.
reasoning: |-
  We are going to define a principle that distinguishes epistemic bubbles from echo chambers based on Nguyen's ideas but refined through your cases.

  Principle:
  Name: "Distrust-Based Echo Chamber"
  Statement: An epistemic bubble is a group that lacks exposure to outside sources, and an echo chamber is a group that actively teaches its members to distrust all outside sources. The key difference is the presence of a systematic distrust mechanism that preemptively discredits external information.

  However, your cases reveal nuances. Specifically:
  - Case D shows that distrust can be justified and protective, not necessarily creating an echo chamber in the harmful sense.
  - Case B shows that distrust can be systematic and lead to confirmation of the group's views when exposed to outside information.

  Therefore, we need to refine the principle to account for the target of the distrust and the nature of the group.

  After analyzing your cases, I propose:

  Principle Name: "Systematic Distrust of All External Epistemic Authorities"
  Statement: A group is an echo chamber if and only if it systematically teaches distrust of all external epistemic authorities (e.g., mainstream science, established news, government agencies) without specific justification for each, and this distrust is used to insulate the group's beliefs. Otherwise, if the group merely lacks exposure, it is an epistemic bubble.

  Clauses:
  1. Clause: "Systematic teaching of distrust" - meaning there is an explicit or repeated message to distrust outside sources.
     Motivating Case: B (where the group actively teaches that NHS and GPs are captured)
     What it excludes: Cases where there is no active teaching of distrust (like A and C).

  2. Clause: "Distrust targets all external epistemic authorities" - meaning the distrust is directed at the entire set of institutions or sources that are typically considered reliable by the broader society for that domain.
     Motivating Case: D (where the distrust is targeted at specific, untrustworthy sources: pharma-funded forums and a particular celebrity) and F (which distrusts all mainstream news but without offering an alternative, and without targeting all epistemic authorities in every domain).
     What it excludes: Groups that distrust only specific, non-authoritative sources or that have a narrow and justified distrust (like D).

  3. Clause: "Without specific justification for each source" - meaning the group does not provide evidence-based reasons for distrusting each specific source but uses a blanket reason (e.g., all mainstream media are corrupt).
     Motivating Case: D (where the distrust is based on specific reasons: pharma funding and celebrity's lack of expertise) and B (which uses a blanket reason: capture by pharmaceutical industry for all official sources).
     What it excludes: Groups that have evidence-based, case-by-case distrust (like D).

  4. Clause: "Used to insulate the group's beliefs" - meaning the distrust mechanism functions to prevent members from considering any external information that contradicts the group's core beliefs.
     Motivating Case: E (where the chamber was downstream and exposure to outside information was explained away) and B (where the distrust insulates the belief in the supplement).
     What it excludes: Groups that use distrust to protect members from harm (like D) without insulating core beliefs that are not about the group's own experience.

  Note: We are allowing that justified distrust (as in D) does not make a chamber. This breaks the purely structural view but is necessary to save D.

  Alternative Principles:
  We considered:
  1. Purely structural: Ignore the truth of the distrust claims. Then D becomes a chamber. But you feel strongly that D is not a chamber. So we abandon that.
     Cost: Forces us to give up your verdict on D.

  2. Trust in the group's expertise: If the group has genuine expertise (like D) then it's not a chamber. But then we need to define expertise, which is hard and circular.
     Cost: Complexity and circularity.

  Case Verdicts:
  A: 
    My verdict: Bubble
    Your verdict: Bubble (saved) - because there is no systematic teaching of distrust. The deference is normal and not an epistemic defect.

  B:
    My verdict: Chamber
    Your verdict: Chamber (saved) - because it systematically teaches distrust of all official health sources (epistemic authorities) without specific justification for each and uses it to insulate the belief.

  C:
    My verdict: Bubble
    Your verdict: Bubble (saved) - no active distrust, just lack of exposure.

  D:
    My verdict: Not a chamber
    Your verdict: Not a chamber (saved) - because the distrust is targeted at specific, non-authoritative sources (pharma-funded forums and a celebrity) with specific justification, and it is not used to insulate core beliefs but to protect from exploitation. Hence, it does not meet the condition of distrusting all external epistemic authorities without justification.

  E:
    My verdict: The bubble bursting made it worse because of a downstream chamber.
    Your verdict: Chamber (revised) - The group he joined is an echo chamber because it systematically teaches distrust of all outside information (manufactured). The initial partisan forum was likely a chamber, and the new group is a chamber.

  F:
    My verdict: Neither
    Your verdict: Bubble (revised) - The group lacks exposure to any positive doctrine and only has distrust. But note that it does not actively teach distrust of all epistemic authorities? Actually, it does: it says every mainstream news outlet is lying. However, it does not offer an alternative. But our principle doesn't require an alternative. It requires systematic distrust of all external epistemic authorities without specific justification. This group does that. But wait, it doesn't have a core belief to insulate? Our clause 4 requires that the distrust is used to insulate the group's beliefs. Since the group has no positive doctrine, there is no belief to insulate. Therefore, we might need to adjust.

    However, let's reexamine F: The group claims every mainstream news outlet is lying. This is a blanket distrust of all mainstream news (which are epistemic authorities for news). They don't offer an alternative, but they do have a core belief: that the mainstream is lying. The distrust is used to insulate that very belief. So by our principle, it is an echo chamber.

    But your verdict was neither. We are revising it to chamber.

    Alternatively, if we think they are not insulating a positive belief, then we might say it's a bubble because they are missing the truth? But they are not just missing it; they are actively distrusting. So I think chamber.

    Given the principle, we classify F as a chamber.

    But note: In the principle, we require that the distrust is used to insulate the group's beliefs. The group's belief is that the mainstream is lying. The distrust is exactly that belief. So it is insulating that belief. Therefore, chamber.

    However, you called it a vacuum. We are revising to chamber.

    Status: revised.

  Hardest Pair: B and D
    Can both be saved: Yes, with the principle that allows for justified and targeted distrust (D) versus blanket and unjustified distrust (B).
    Cost: We have to break the purely structural view and allow the evaluation of whether the distrust is justified and targeted. This means we cannot apply the test from inside the group without external knowledge. But note: In the principle, we are not requiring the evaluator to know the truth. We are requiring that the group provides specific justifications for each source. In D, the group does: they say why the pharma forums are bad (funding) and the celebrity (lack of expertise). In B, the justification is a blanket conspiracy. So from inside, one can observe the specificity and the targets. Therefore, we don't need to know the truth, we only need to observe the structure of the justification.

    Which verdict goes if not: If we cannot break structuralism, then D would have to be called a chamber.

  Deference Threshold:
    Is a continuum: Yes.
    Threshold: When deference becomes systematic and blocks any consideration of alternative sources, then it starts to resemble a bubble. But note that in A, the group does not block engines or books; they just don't use them. The threshold is crossed when the group actively discourages or ignores available and reliable sources without justification.
    How to detect it: If the group has a norm or practice that prevents members from consulting alternative sources (even when they are readily available and reliable), then it is a bubble. In A, there is no such norm. They could use an engine if they wanted. So it's normal deference.

  Third Category:
    Needed: No. F is a chamber because it has systematic distrust of all mainstream news (epistemic authorities) without specific justification for each and uses that distrust to insulate its core belief (that the mainstream is lying). But note, it has a belief: that the mainstream is lying. The vacuum is the absence of positive doctrine, but that doesn't stop it from being a chamber. We don't need a third category.

  New Cases:
    We will create three new cases to test the principle.

  Notes: The principle relies on observable features (the specificity of the distrust, the targets, and the presence of insulation) without requiring the evaluator to know the truth. However, for D, we rely on the group providing specific justifications. That is observable.

  Now, let's structure the JSON accordingly.
