  ### 1. Setting  
  Alex, a freelance data analyst with steady income, uses an online investment platform that offers short-term loans to verified small businesses. The platform's extensive records show that, for loans of the size Alex considers, exactly half result in full repayment with a small profit, while half result in complete default, based on historical recovery rates across similar economic conditions. Simultaneously, Alex holds shares in a volatile tech stock that fluctuates widely around its purchase price due to market dynamics. This stock has a symmetric 50% chance to gain or lose a fixed amount over the next month, with no directional bias in its price movements. Both the loan decision and stock holding are independent, one-time choices.  

  ### 2. The Two Decisions  
  Alex faces two separate choices:  
  - **Modest Gamble**: Lend $500 to a business for a 50% chance of netting $110 (if repaid with profit) or a 50% chance of losing $500 (if default). Expected value: $5.  
  - **Large Gamble**: Invest $20,000 in a start-up for a 50% chance of netting $61,000 (if successful) or a 50% chance of losing $20,000 (if failure). Expected value: $20,500.  

  Alex declines the modest gamble at initial wealth ($100,000), at $105,000 (e.g., after a windfall), and at $95,000 (e.g., after a loss). Alex accepts the large gamble at $100,000.  

  ### 3. Expected-Utility Check  
  For an expected-utility (EU) maximizer with concave utility \(u\), declining the modest gamble at wealth \(w\) implies:  
  \[
  0.5u(w + 110) + 0.5u(w - 100) \leq u(w)
  \]  
  Rearranging:  
  \[
  u(w) - u(w - 100) \geq u(w + 110) - u(w)
  \]  
  By concavity, \(u'\) is decreasing, so the left side (gain from $100 at \(w - 100\)) is at least the right side (gain from $110 at \(w\)). Applying this at \(w = 95,000, 100,000, 105,000\):  
  - At each \(w\), \(u'(w) \geq 1.1u'(w + 110)\) (using the mean value theorem).  
  Chaining over the 100-step $100-interval from 95,000 to 105,000:  
  \[
  u'(95,000) \geq (1.1)^{100} u'(105,000) \approx 13,780u'(105,000)
  \]  
  Marginal utility plummets: losing $20,000 from $100,000 (to $80,000) causes a utility drop \(A = u(100,000) - u(80,000)\) bounded by:  
  \[
  A \geq 20,000u'(105,000) \cdot 13,780
  \]  
  Gaining $61,000 (to $161,000) gives a utility increase \(B = u(161,000) - u(100,000)\) bounded by:  
  \[
  B \leq 61,000u'(105,000)
  \]  
  Thus, \(A / B \geq (20,000 \cdot 13,780) / 61,000 \approx 4,514\), so \(A >> B\). The large gamble’s EU is:  
  \[
  0.5u(80,000) + 0.5u(161,000) = u(100,000) + 0.5(B - A) < u(100,000)
  \]  
  Concavity (diminishing marginal utility) forces declining the large gamble.  

  ### 4. Risk-Weighted Check  
  With linear utility and \(r(p) = p^2\), outcomes ranked worst to best:  
