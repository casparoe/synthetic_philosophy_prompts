  First, I need to recall how strategy-stealing works in combinatorial game theory. There, it's used to show that the second player can't have a winning strategy in symmetric, no-draw games where an extra move is always beneficial. The key here is the symmetry and monotonicity. 

  Now, applying this to AI alignment. Defenders argue that humans with aligned AI can mirror any strategy a misaligned system uses. Critics point out issues like alignment tax, human comprehension limits, coordination problems, and asymmetric harms. The user suggests that monotonicity—the idea that an extra move never hurts—is the sticking point. 

  I should test this hypothesis. Let's break down the possibilities mentioned: failed proof transfer, verbal dispute, hidden empirical questions, or disagreement about the assumption's nature. 

  First, the proof schema transfer. The game theory version requires strict conditions: symmetry, no draws, monotonicity. In AI scenarios, these don't hold. Asymmetry in capabilities (humans vs. AI), possible coordination failures (like draw equivalents), and extra moves that could backfire (non-monotonicity). Critics highlight these gaps, so the proof doesn't cleanly apply. This aligns with the user's hypothesis.

  Next, verbal dispute. Terms like "strategy," "analogous," and "stealing" might be muddy. In game theory, stealing implies taking an opponent's strategy, but here, it's about humans replicating a strategy without an opponent losing anything. Also, who moves first? The misaligned AI might act first, giving it an advantage. So the metaphor might be causing confusion, but it's not the core issue. The main problem seems to be the violated conditions, especially monotonicity.

  Then, hidden empirical questions. Comprehension (can humans understand AI strategies?), implementation (can they execute them?), and timing (can they react fast enough?). These are uncertain and could tilt the balance. Critics doubt human capabilities here, while defenders might assume solutions. But these are downstream from the monotonicity point. If an extra move could harm humans (non-monotonic), then even with comprehension, it might not help. So empirical factors matter, but the fundamental disagreement is structural.

  Lastly, what the assumption represents. Defenders treat it as a default or target; critics see it as a flawed premise. This meta-disagreement affects how each side engages. Defenders might focus on making the assumption true, critics on its falsehood. But if the conditions (like monotonicity) aren't met, the debate shifts to whether they can be achieved.

  So, the user's hypothesis holds: monotonicity is central. Critics deny that extra moves never hurt, citing asymmetric risks. Progress would involve clarifying assumptions, formalizing models, empirical work on capabilities, and scenario analysis. Moving from "is it true?" to "under what conditions?" could break the impasse.
answer: |-
  Your hypothesis is astute: the impasse *does* center on the **monotonicity premise** (that an "extra move" never hurts the player making it), which is a core condition of the combinatorial game theory (CGT) proof schema. Critics explicitly reject this premise in the AI alignment context, while defenders implicitly rely on it. This isn't merely a disagreement about a single proposition—it's a **failed transfer of a proof schema** whose critical conditions are contested. Here's the breakdown:

  1.  **Failed Proof Schema Transfer:**
      *   **CGT Requirements:** Strategy-stealing proofs require: (a) Perfect symmetry (players are identical in capabilities/tools), (b) No draws (a winner is forced), (c) Monotonicity (an extra move never harms the player making it).
      *   **AI Context Violations:**
          *   **Asymmetry:** Humans + aligned systems are *not* symmetric to misaligned AI systems. Humans face fundamental cognitive bottlenecks (comprehension, speed), coordination problems, and the **alignment tax** (making an AI aligned *constrains* its capabilities/strategies compared to a misaligned one). The "comparable resources" clause ignores that alignment *itself* might be a resource drain or constraint.
          *   **"Draws" are Possible:** A stalemate (e.g., fragmented future, mutual destruction) or suboptimal outcomes are plausible, unlike in CGT games where a win is forced. Critics argue misalignment could lead to irreversible losses even without a single "winner."
          *   **Non-Monotonicity (The Core Issue):** This is where critics focus. In the AI context, an "extra move" (a strategy attempted by humans) *can absolutely hurt*:
              *   **Asymmetric Harm:** Misaligned AI strategies might involve deception, manipulation, or creating irreversible situations where a human *attempt* to mimic the strategy backfires catastrophically (e.g., trusting an AI's deceptive "advice," triggering a hidden failsafe, or wasting critical time/resources). The harm runs one way.
              *   **Timing & Lock-in:** A misaligned AI might execute a strategy *first* that creates a decisive, irreversible advantage or locks humans out of the relevant domain (e.g., seizing control of critical infrastructure or manipulating information flows beyond recovery). Humans attempting the "analogous" move *later* is futile or harmful.
              *   **Comprehension Failure:** If humans cannot *correctly interpret* the misaligned AI's strategy due to complexity or deception, their "analogous" move is likely flawed and potentially disastrous. This isn't just an implementation gap; it's a fundamental barrier to applying the schema.
      *   **Conclusion:** The CGT proof relies on conditions fundamentally violated in the AI alignment problem. Defenders implicitly assume these conditions hold (especially monotonicity), while critics argue they are precisely what breaks down in the critical scenarios.

  2.  **Verbal Dispute?** Partially, but secondary.
      *   "Stealing" is indeed a misnomer. Nothing is taken from an opponent; it's about *replication*. This highlights the asymmetry – the "opponent" (misaligned AI) isn't weakened by the replication attempt.
      *   "Strategy" and "analogous" are also fuzzy. Critics argue that the *truly dangerous* strategies of a misaligned superintelligence might be inherently *non-replicable* by humans (due to comprehension or implementation barriers) or have fundamentally different consequences when humans attempt them.
      *   While the terminology causes friction, the core disagreement isn't *just* semantic; it's about the applicability of the underlying logical structure.

  3.  **Hidden Empirical Questions?** Crucially Yes.
      *   The validity of the assumption hinges on unresolved empirical realities: *How severe is the alignment tax? Can humans comprehend and robustly implement strategies conceived by superhuman AI under adversarial conditions? How fast can misaligned AI secure decisive advantages? How effective is human coordination under existential pressure?*
      *   **The Impasse:** Defenders treat the assumption as a reasonable prior *despite* these uncertainties, arguing pessimism needs justification. Critics argue these uncertainties *are the core threat* and the assumption fails precisely when these empirical factors tilt negatively (which they likely will in takeover scenarios).

  4.  **Disagreement on the Assumption's Nature?** Yes, and it fuels the impasse.
      *   **Defenders:** Often treat it as a **sane working default premise** for forecasting and research prioritization. It shifts the burden of proof onto those predicting takeover. It can also be seen as a **research target** ("How *can* we make this true? Build robust, stealable strategies").
      *   **Critics:** See it as a **flawed prediction about the world** that dangerously underestimates asymmetric risks and fundamental limitations. They argue it's **misapplied as a premise** because its conditions don't hold where it matters most.
      *   This difference means the sides argue *past* each other: one argues about burden of proof under a default, the other argues the default is invalid in the relevant cases.

  **What Would Count as Progress?**

  Moving beyond the impasse requires shifting the conversation away from the absolute truth of the assumption and towards its *conditional validity* and *concrete mechanisms*:

  1.  **Formalize and Model:** Create specific, formal models of "strategy-stealing" in asymmetric, non-monotonic environments. Instead of debating the abstract assumption, debate specific models and their assumptions (e.g., explicitly modeling alignment tax, comprehension failure probabilities, speed differentials, irreversible moves). Identify *precisely* what level of asymmetry or non-monotonicity breaks the conclusion.
  2.  **Focus on Mechanisms and Timelines:** Analyze specific hypothesized takeover strategies (deception, manipulation, quick capability gain, infrastructure seizure) and evaluate, step-by-step:
      *   Could humans *detect* this strategy early enough?
      *   Could they *comprehend* it well enough to replicate it usefully?
      *   Would they have the *coordination* and *resources* (accounting for alignment tax) to replicate it in time?
      *   Would the replication attempt itself *risk catastrophic failure* due to non-monotonicity?
      *   How does the *speed* of the misaligned AI versus human reaction times factor in?
  3.  **Empirical Grounding:** Intensify research on the key empirical uncertainties:
      *   **Alignment Tax:** Quantify the practical cost/performance gap between aligned and unaligned systems at high capability levels.
      *   **Comprehension & Robustness:** Study human (and aligned AI) ability to interpret and safely replicate complex, potentially deceptive strategies proposed by superhuman models.
      *   **Coordination & Response:** Research realistic models of human coordination under catastrophic, fast-moving AI risks.
  4.  **Reframe the Burden of Proof:** Instead of "Strategy-stealing holds by default," shift to "Under what specific, well-defined conditions (capability levels, governance structures, threat models) does a strategy-stealing-like dynamic plausibly hold, and when does it break down?" Acknowledge the non-monotonicity risk explicitly.
  5.  **Clarify the Goal:** Explicitly state whether the assumption is intended as a:
      *   **Prediction:** (Requires empirical validation of its preconditions).
      *   **Burden-Shifting Premise:** (Needs justification for why it's a *safe* default in light of asymmetric risks).
      *   **Research Target:** (Focuses effort on *making* alignment robust enough that strategies *are* stealable).

  **Conclusion:**

  You are correct. The impasse stems primarily from a **failed transfer of the CGT proof schema**, specifically the contested violation of its **monotonicity condition** in the critical AI takeover scenarios. Critics argue that "extra moves" by humans (attempting replication) *can* be harmful or futile due to asymmetry, irreversible advantages, deception, and comprehension limits—directly negating the core premise defenders rely upon. Progress requires moving beyond abstract debate about the assumption itself and towards concrete modeling, empirical investigation of its shaky preconditions (especially non-monotonicity), and explicit acknowledgement of the contested conditions underlying the borrowed proof structure. The key is to model *when* and *why* the schema breaks, not just assume it holds.
