answer: |-
  ## The Trustees' Wager: A Dialogue on Growth and Utility

  **Setting:** The oak-panelled committee room of the Somerville Charitable Trust. Rain streaks the tall windows overlooking the quad. At the head of the table, the Chairwoman consults her notes. Seated opposite each other are the Trust’s financial advisers: **Dr. Aris Thorne**, lean and intent, and **Dr. Imogen Shaw**, pragmatic and precise. A ledger showing the current capital of £2,000,000 lies open. It is the day of the annual wager offer.

  **Chairwoman:** Thank you both for your preparatory notes. The mandate is clear: grow this capital for twenty years through this annual wager, avoid the £500,000 floor at all costs, and transfer the residue. Our trustees’ risk tolerance, as measured last quarter, corresponds to a CRRA coefficient of approximately 0.4 for single-year decisions. Dr. Thorne, Dr. Shaw, we need your recommendations on what fraction of the current capital to stake this year. Please proceed.

  **Dr. Aris Thorne:** Thank you, Madam Chair. The core of my recommendation rests on a fundamental principle for repeated, multiplicative processes like this: **maximising the long-run growth rate is the only strategy that ensures the trust’s single, actual trajectory through time aligns optimally with its purpose.** It is not merely a preference; it is a structural imperative inherent in the nature of compounding under uncertainty, especially when ruin is an absorbing state.

  Consider the wager: stake *f*, win 2*f* (net profit + stake returned) with probability *p*=0.60, lose *f* with probability 0.40. The *geometric* growth factor per bet is *G(f) = (1 + f)^(0.60) * (1 - f)^(0.40)*. Maximising this – finding the *f* that maximises the expected logarithm of wealth – gives the highest probable wealth after many bets. Calculus shows this optimal *f*, often called the Kelly fraction, is *f* = *p* - (1 - *p*) = 0.60 - 0.40 = 0.20. We should stake 20%.

  **Dr. Imogen Shaw:** Aris, you present growth-rate maximisation as a transcendent principle. I contend it is nothing more than **expected utility maximisation assuming a very specific, and for these trustees, demonstrably inappropriate, utility function: U(W) = log(W).** Why should log utility hold normative sway here? Our trustees’ elicited CRRA of 0.4 implies a single-year utility function U(W) = W^(1-0.4) / (1-0.4) = W^0.6 / 0.6. Applying that *myopically* to this single wager, ignoring the future sequence and the floor, the optimal stake maximises E[U(W_1)] = 0.60 * [(2,000,000 * (1 + f))^0.6 / 0.6] + 0.40 * [(2,000,000 * (1 - f))^0.6 / 0.6]. Ignoring the constants and the initial wealth scale factor, we maximise 0.60*(1+f)^0.6 + 0.40*(1-f)^0.6. Differentiating shows the maximum occurs at *f* ≈ 0.60. Should we stake 60%? Almost certainly not, because this ignores the future and the ruin clause. But it demonstrates that their *expressed* risk tolerance for a *single* bet is far higher than your Kelly 20%. Your criterion imposes a risk aversion (γ=1 for log) they do not possess.

  **Thorne:** Imogen, you highlight precisely why myopic application is dangerous! Applying that CRRA=0.4 utility *only* to the terminal wealth after twenty years, properly integrating over all possible paths and respecting the absorbing ruin floor, would yield a very different optimal strategy than either myopic 60% *or* simply applying log utility. But more fundamentally, my point is that *any* expected utility calculation over terminal wealth, including a proper twenty-year CRRA=0.4 calculation, makes a profound category error. **It mistakes an ensemble average over counterfactual universes for a guide to action in the single universe the trust inhabits.**

  Let me illustrate. Suppose we naively stake your myopic fraction, *f*=0.60, every year, ignoring the floor for simplicity. The expected *arithmetic* mean terminal wealth is colossal: E[W_20] = £2,000,000 * (1 + 0.60*1*0.60 + 0.60*(-1)*0.40)^20 = £2,000,000 * (1 + 0.36 - 0.24)^20 = £2,000,000 * (1.12)^20 ≈ £19,300,000. A splendid ensemble average! But what is the *typical* outcome? The median outcome? The growth factor per bet is G(0.60) = (1.60)^0.60 * (0.40)^0.40 ≈ 1.60^0.6≈1.34, 0.40^0.4≈0.693, so 1.34*0.693≈0.928. Wealth *shrinks* by about 7.2% per bet on average. After 20 years, W_20 ≈ £2,000,000 * (0.928)^20 ≈ £470,000. That’s below the £500,000 floor! And this is the *median* path. The ensemble average is high only because of a tiny probability of astronomical wealth, paths where the trust wins many more than 60% of the bets – paths the actual trust is vanishingly unlikely to experience. Expected terminal wealth asks the trustees to be moved by riches in lives they will never lead, while courting disaster in the life they *will* lead.

  **Shaw:** You invoke the “single universe” and “typical path” rhetorically, Aris, but **probability *is* how we integrate our uncertainty about which future path we will occupy.** An expected utility calculation over terminal wealth *does* account for the distribution, including the high-end outliers and the ruin paths. If the trustees have CRRA=0.4, then EU(W_20) = ∫ [W_20^0.6 / 0.6] dP, integrating over all possible win/loss sequences respecting the ruin floor. This integral *already* captures the risk of ruin and the potential for growth. It weights outcomes by probability and by the trustees’ own valuation of wealth levels. The Kelly strategy maximises this expectation *only* if U(W) ∝ log(W). Since U(W) ∝ W^0.6 is demonstrably different, maximising growth rate maximises an expectation they *don’t* value! You are substituting your normative preference (log) for theirs (W^0.6). The alleged “category error” is simply you rejecting their utility function.

  Furthermore, your reliance on the “long run” is fragile. What if the horizon were 5 years, not 20? Or 100? Or if there was consumption smoothing? Or if the utility function wasn’t bounded below like log? The Kelly criterion’s optimality *as expected utility maximisation* hinges critically on infinite horizons and log utility. In finite cases, especially with absorbing states, it’s merely an approximation, and often not the best one for a given utility. Your growth-rate maximisation *is* preference-dependent; it’s just dressed up as a process.

  **Thorne:** The finite horizon is crucial, Imogen, but not for the reason you state. It highlights the irreversibility and path-dependence. The twenty-year horizon isn’t infinite, but it *is* sufficiently long for the divergence between ensemble and time averages to become stark, as my 0.60 staking example showed. Crucially, **the absorbing ruin floor transforms this from a theoretical concern into an existential one.** Under pure proportional staking without a floor, ruin is *mathematically* impossible (W_n >0 always). The standard “avoid ruin” justification for Kelly is weak tea. Here, however, the covenant creates a *real*, discrete, absorbing ruin state at £500,000. Falling below that isn’t just a bad outcome; it’s the termination of the trust’s mission and the trustees’ role. A strategy that significantly increases the *probability* of hitting that floor within twenty years, even if it boosts the *ensemble average* of terminal wealth above the floor, is normatively bankrupt for this mandate. It risks catastrophic failure for the *actual* trust.

  **Shaw:** I agree the ruin floor is paramount. But how does growth-rate maximisation uniquely address it? Staking *f*=0.20 (Kelly) *also* carries a risk of ruin over twenty years, given the floor. We need to quantify this risk under different strategies, integrating the trustees’ utility. Let’s estimate the ruin probability for *f*=0.20. Using the estimated *p*=0.60, the drift per bet is positive, but sequences with early losses can deplete capital. We can model wealth as approximately lognormal or simulate. A rough approximation: ruin requires wealth falling by a factor of 4 (from £2M to £500k). The expected log return per bet under Kelly is g_max = 0.60*ln(1.20) + 0.40*ln(0.80) ≈ 0.60*0.1823 + 0.40*(-0.2231) ≈ 0.1094 - 0.0892 ≈ 0.0202. The variance of log return per bet is σ² ≈ 0.60*(0.1823 - 0.0202)^2 + 0.40*(-0.2231 - 0.0202)^2 ≈ 0.60*(0.1621)^2 + 0.40*(-0.2433)^2 ≈ 0.60*0.0263 + 0.40*0.0592 ≈ 0.01578 + 0.02368 ≈ 0.03946 (σ≈0.199). After *n*=20 bets, expected cumulative log return ≈ 20*0.0202=0.404, variance ≈20*0.03946≈0.7892 (std dev ≈0.888). Ruin (log(W_20/W_0) ≤ ln(0.25)≈-1.3863) is about 1.3863 + 0.404 = 1.79 standard deviations below the mean. Probability ≈ 3.7%. Now, under *their* myopic fraction *f*=0.60? Expected log return g = 0.60*ln(1.60) + 0.40*ln(0.40) ≈ 0.60*0.4700 + 0.40*(-0.9163) ≈ 0.2820 - 0.3665 ≈ -0.0845. Wealth decays on average. Ruin probability is near certainty within 20 years – my earlier median estimate was ruin *by* year 20. Even a more moderate fraction, say *f*=0.40, gives g = 0.60*ln(1.40) + 0.40*ln(0.60) ≈ 0.60*0.3365 + 0.40*(-0.5108) ≈ 0.2019 - 0.2043 ≈ -0.0024 (near zero growth). Ruin probability is still very high over 20 years. Kelly clearly dominates on ruin risk. But is it optimal *for them*? A proper CRRA=0.4 utility over terminal wealth, simulated with the floor, might find an optimal *f* slightly *above* 0.20, say 0.25 or 0.30, balancing their greater risk tolerance against the ruin risk.

  **Thorne:** You concede Kelly reduces ruin risk, which is vital. But note this: **the growth-rate criterion itself signals caution through parameter uncertainty.** You mentioned the win probability estimate *p*=0.60 has a standard error of about 0.04, based on 150 past wagers (*SE ≈ sqrt(0.6*0.4/150)≈0.04*). A prudent Kelly bettor would stake a fraction *f* = (p_est - q) - k*σ_p, where *k* is a safety factor based on uncertainty aversion. Some suggest *f* = (p_est - q) / (odds ratio) = (0.60 - 0.40)/1 = 0.20 is already conservative under uncertainty compared to edge/odds. Given the stakes, perhaps reduce further. My recommendation isn’t pure *p*=0.60 Kelly. But the principle – maximising the *estimated* long-run growth rate robustly – remains the lodestar. It directly addresses the path-dependence and the absorbing ruin risk inherent in the mandate. Expected utility with γ=0.4 would systematically *overstake* because it undervalues the catastrophic impact of ruin relative to the trustees’ single-year risk premium. Their single-year γ=0.4 reflects aversion to mild losses, not to existential termination. Log utility (γ=1) weights a 50% loss as -ln(0.5)≈0.693, while CRRA=0.4 weights it as (0.5)^0.6 ≈ 0.66 under power utility – a difference, but not transformative. The ruin floor transforms a 75% loss into a -∞ utility event. Only a strategy focused on sustaining growth through time reliably respects that.

  **Shaw:** Your parameter uncertainty point is valid, Aris, but it’s orthogonal. It’s **ordinary Bayesian updating or robust optimisation within expected utility theory.** We agree *p* isn’t known precisely. We should use a distribution (e.g., Beta(90,60) if we treat the 150 wagers as definitive). Then, the optimal Kelly fraction *f* = E[p] - q ≈ 0.60 - 0.40 = 0.20 *is* the expected optimal fraction. But for expected utility maximisation (with any utility), we integrate over the uncertainty in *p* as well. If the trustees are uncertainty-averse beyond the probabilities, we might use max-min or a convex risk measure. This doesn’t elevate growth-rate maximisation; it just makes the EU calculation more complex. Conflating parameter uncertainty with the foundational argument for Kelly obscures the core issue: **do we prioritise the geometric mean growth of the single path, or the probability-weighted average of utility over all possible terminal outcomes?** These are different objectives. Kelly adherents often slip into talking about the “typical” path or the “median” outcome, but this is itself a probability-weighted concept! Favouring the median over the mean is a specific, implicit risk preference – one of aversion to downside skewness. It’s not preference-free. It’s just log utility in disguise. Furthermore, consider a one-off bet: edge = 10% (p=0.55, double-or-nothing). Expected value is positive (+10%). A Kelly/log agent stakes f= p - q = 0.55 - 0.45 = 0.10. A CRRA=0.4 agent, even for one-off, would stake more. Would you really claim the log agent is *correct* to stake only 10%? Or is it simply reflecting *their* high risk aversion? It reveals the risk aversion embedded in log utility, not a universal norm.

  **Thorne:** For a truly one-off bet in isolation, without repetition or compounding consequences, perhaps expected utility reigns. But this mandate is *defined* by repetition and irreversibility over a critical horizon. The Kelly criterion’s refusal of larger stakes in that one-off bet isn’t a defect; it’s a recognition that maximising expected value ignores the *risk to the opportunity set itself*. In our multi-period case with ruin, overstaking risks not just current wealth loss, but the destruction of all future valuable opportunities – a cost EU over terminal wealth struggles to capture adequately without extreme curvature. The “typical path” focus isn’t smuggling in probability; it’s acknowledging that in multiplicative growth, the *mode* of the terminal distribution, or the highest *probability* path, is often radically different from the *mean*. Guiding the single, actual trust requires focusing on what is *probable*, not what is *possible* in unseen branches.

  **Chairwoman:** Thank you, both. We must conclude. Please state your final recommended stake fraction for this year and briefly diagnose the key operational disagreement.

  **Dr. Aris Thorne:** I recommend staking **40%** of the current capital. This is derived as follows: The basic Kelly fraction for *p*=0.60 is 20%. Given the significant parameter uncertainty (SE=0.04), the absorbing ruin floor, and the finite (though long) horizon, a prudent reduction is warranted. Half-Kelly (10%) is often suggested for such uncertainty, but I believe that’s overly conservative given the strong evidence for *p>0.5*. Staking 40% of the Kelly stake, i.e., 0.40 * 0.20 = 0.08 or 8%, is too low. I propose staking 40% *of the bankroll* – which is double the pure *p*=0.60 Kelly fraction. This balances robust growth maximisation against the heightened risks. Operationally, the key disagreement impacting this number is how heavily to discount the estimated *p*=0.60 due to uncertainty and the ruin clause. I apply a significant haircut directly to the staking fraction derived from the growth principle. We also disagree fundamentally on whether the trustees’ γ=0.4 utility should dictate the *strategy* or merely inform their *tolerance* for path volatility once the growth-optimal strategy is robustly implemented.

  **Dr. Imogen Shaw:** I recommend staking **60%** of the current capital. This is derived as follows: A proper dynamic programming solution incorporating CRRA=0.4 utility over terminal wealth, absorbing ruin at £500k, the 20-year horizon, and uncertainty over *p* (modelled as Beta(90,60)) is computationally intensive. However, we know:
  1.  Pure myopic γ=0.4 suggests ~60% (clearly reckless here).
  2.  Pure Kelly (γ=1) suggests 20%.
  3.  Ruin risk rises sharply as *f* increases beyond ~0.25.
  4.  The trustees' γ=0.4 implies a higher tolerance for risk *above ruin* than Kelly/log.
  Simulations suggest the expected utility (W_20^0.6) is maximised for a stake fraction between 0.25 and 0.35. Given the parameter uncertainty, erring towards the lower end is prudent. I propose **f=0.30 or 30%**. My previous mention of 60% was solely to illustrate myopic misapplication. Operationally, the key disagreement impacting the number is the *weight given to the trustees’ expressed risk aversion.* Aris discounts it heavily, prioritising the growth principle. I integrate it directly into the objective function (EU terminal). We also disagree on whether the parameter uncertainty requires modifying the core objective (Thorne) or is handled within the EU calculus (Shaw). Finally, I believe my 30% is more robust to the true *p* being slightly below 0.60 than his 40%.

  **Chairwoman:** Forty percent and thirty percent. A significant difference still. Thank you, Doctors Thorne and Shaw. The committee will now deliberate. The arithmetic clarifies the stakes, but the philosophy... that remains sharply divided. We have much to consider.
