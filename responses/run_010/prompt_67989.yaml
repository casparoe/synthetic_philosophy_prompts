  The core tension they highlight is crucial: human solvers work fast with zero feedback, yet any computational model must avoid cheating via problem-specific tweaks. I need to structure this carefully - first laying out phenomena-driven requirements with imaginary examples, then separating universal constraints from theoretical preferences, finally confronting inevitable trade-offs. 

  For the phenomena, I'll invent simple visual dichotomies showing key aspects: 
  - The "correctness vs consistency" gap using triangles vs quadrilaterals where colour is irrelevant but statistically prominent
  - Abstraction shifts via a "containment" rule that first appears to be about shape
  - Solution asymmetry where "convex" feels natural but "non-concave" doesn't
  - Vocabulary independence by using novel attributes like "squiggly-bordered"

  When categorising requirements, I'll argue hypothesis-space enumerability isn't essential (contra classic cognitive models) because humans generate novel features, but incremental abstraction is non-negotiable. The impossibility demonstration will pit "no fixed vocabulary" against "fast convergence" - you simply can't search all possible feature spaces quickly without some heuristics.

  The critical requirement that eliminates most approaches? "Ontological autonomy" - existing systems (like connectionist models or LLMs) rely on pre-trained features or massive data, whereas Bongard solvers invent appropriate abstractions from scratch. I'll briefly score approaches at the end but keep it tight - the user explicitly prioritises criteria over solutions.

  British English touches: "colour" not "color", "programme" not "program", and phrasing like "begging the question" rather than "assuming the conclusion". Must also remember "desiderata" is plural throughout.
answer: |-
  Here is a specification of desiderata for an adequate theory of Bongard Problem (BP) concept induction, structured as requested:

  ### Core Phenomena & Motivating Desiderata
  *(Illustrated with invented BP-style examples)*

  1.  **Intentionality over Extension:**
      *   **Phenomenon:** A rule may statistically separate all 12 panels yet be incorrect (e.g., coincidental, overly specific, or missing the designer's intended abstraction). Correctness hinges on matching the *intended concept*.
      *   **Desideratum:** The theory must distinguish *merely consistent* rules from the *intended* rule, which is typically the most *salient*, *simple*, or *natural* abstraction given the examples.
      *   **Example:**
          *   Left (Positive): Red Circle, Blue Triangle, Green Square, Yellow Circle, Red Triangle, Blue Square.
          *   Right (Negative): Red Cross, Blue Star, Green Diamond, Yellow Cross, Red Star, Blue Diamond.
          *   **Merely Consistent Rule:** "Has straight sides" (True for all Left: Circle has 0 straight sides? Ambiguous! *Bad example*). **Better:** Left: All shapes are *convex polygons*. Right: All shapes are *concave polygons* (e.g., stars, crosses, crescents). A merely consistent rule could be "Has an even number of vertices" (might hold statistically but misses the convexity intent).
          *   **Motivation:** Humans converge on "convex" vs "concave", not incidental vertex counts.

  2.  **Robustness to Incidental Variation:**
      *   **Phenomenon:** Figures contain noisy details (colour, size, line thickness, minor distortions) irrelevant to the core concept. Solvers effortlessly ignore these; statistical methods risk overfitting.
      *   **Desideratum:** The theory must inherently suppress irrelevant features without explicit instruction or separate denoising stage. Relevance must be inferred *from the contrast*.
      *   **Example:**
          *   Left: Large Black Circle, Small White Circle, Medium Grey Circle (slightly squashed), Large Black Circle (rough edge), Small White Circle, Medium Grey Circle.
          *   Right: Large Black Square, Small White Triangle, Medium Grey Pentagon, Large Black Square, Small White Triangle, Medium Grey Pentagon.
          *   **Rule:** Left: *Circular* (despite size, colour, minor distortions). Right: *Non-circular polygons*.
          *   **Motivation:** Size, colour, and minor distortions vary randomly on both sides and are dismissed.

  3.  **Solution Asymmetry:**
      *   **Phenomenon:** Solutions are stated positively for one side (e.g., "Left: Contains a circle", "Right: All shapes concave"). The complement ("Right: Contains no circle") feels unnatural and derivative.
      *   **Desideratum:** The theory should favour the formulation that constitutes a *natural kind* or *positive primitive concept*, rather than its negation or complement, as the core solution.
      *   **Example:**
          *   Left: Circle inside Square, Triangle inside Circle, Square inside Triangle, Circle inside Pentagon, Triangle inside Square, Square inside Circle.
          *   Right: Circle next to Square, Triangle above Circle, Square below Triangle, Circle beside Pentagon, Triangle adjacent to Square, Square near Circle.
          *   **Natural Solution:** Left: *One shape contains another*. Right: *Shapes are adjacent but not containing*.
          *   **Unnatural Solution:** Right: *No shape contains another* (true, but misses the "adjacency" aspect present on the right).
          *   **Motivation:** "Containment" is a positive, salient spatial relation; its absence is less informative.

  4.  **Abstraction Shift:**
      *   **Phenomenon:** Solvers often start with concrete hypotheses (e.g., about specific shapes), encounter a counterexample, and then "zoom out" to a higher-level concept (e.g., symmetry, connectivity, relational property).
      *   **Desideratum:** The theory must incorporate a mechanism for *dynamic hypothesis refinement* and *abstraction level shifting* based on counterevidence within the small sample.
      *   **Example:**
          *   Left: Symmetrical Cross, Symmetrical Star, Symmetrical Rectangle, Symmetrical Arrow (bilateral), Symmetrical Diamond, Symmetrical Ellipse.
          *   Right: Asymmetrical Hook, Asymmetrical L-shape, Asymmetrical Blob, Asymmetrical Arrow (curved), Asymmetrical P-shape, Asymmetrical Step.
          *   **Process:** Initial hypothesis "All Left have right angles?" fails (Ellipse). Shift to "All Left have mirror symmetry?".
          *   **Rule:** Left: *Bilateral symmetry*. Right: *Asymmetrical*.
          *   **Motivation:** Solvers dynamically adapt their level of description, moving beyond simple geometric primitives.

  5.  **Solution Equivalence (Formulation Invariance):**
      *   **Phenomenon:** Differently worded solutions (e.g., "All shapes closed", "No open shapes") are understood to describe the same underlying concept separating the sets.
      *   **Desideratum:** The theory must capture the *semantic equivalence* of logically equivalent but syntactically different rule formulations. The core concept is primary, its linguistic expression secondary.
      *   **Example:**
          *   Left: Closed Circle, Closed Square, Closed Triangle, Closed Pentagon, Closed Hexagon, Closed Blob.
          *   Right: Open Arc, Open Corner (L-shape), Open Line, Open Curve, Open S-shape, Open Zigzag.
          *   **Equivalent Solutions:** "Left: Closed shapes", "Right: Open shapes", "Left: Shapes without endpoints", "Right: Shapes with endpoints".
          *   **Motivation:** The core concept "closure" is recognised regardless of phrasing direction (Left vs Right) or logical framing (closed vs not-open).

  6.  **Ontological Autonomy (No Fixed Vocabulary):**
      *   **Phenomenon:** Solvers induce concepts involving novel properties or relations not pre-defined in any obvious primitive set (e.g., "has a concavity", "is contained", "touches the border").
      *   **Desideratum:** The theory must *generate relevant features and relations* on-the-fly based on the visual input and the contrast between sets. It cannot rely on a predefined, fixed set of perceptual or conceptual primitives without begging the question of where *those* came from.
      *   **Example:**
          *   Left: Circle entirely within box border, Square entirely within border, Triangle entirely within border, Pentagon entirely within border, Blob entirely within border, Star entirely within border.
          *   Right: Circle touching box border, Square touching border, Triangle touching border, Pentagon touching border, Blob touching border, Star touching border.
          *   **Rule:** Left: *Shape entirely contained within the panel, not touching the border*. Right: *Shape touches the border of the panel*.
          *   **Motivation:** "Touching the border" is not a typical primitive shape feature; it's a relational property induced from the spatial configuration relative to the frame.

  ### Categorisation of Requirements

  *   **Non-Negotiable (Phenomena-Driven):**
      1.  **Intentionality:** Must capture the human sense of "correctness" beyond statistical separation.
      2.  **Robustness:** Must ignore irrelevant variation inherently.
      3.  **Asymmetry:** Must favour natural positive concept formulations.
      4.  **Abstraction Shift:** Must dynamically refine hypotheses and abstraction levels.
      5.  **Solution Equivalence:** Must recognise core concept identity across formulations.
      6.  **Ontological Autonomy:** Must construct relevant features/relations without predefined vocabulary.
      7.  **Human-Like Efficiency:** Convergence on solution within minutes with only the 12 panels.
      8.  **Zero-Shot Generalisation:** Solve novel BPs without per-problem training/tuning.

  *   **Potentially Programme-Dependent (Theoretical Commitments):**
      1.  **Enumerable Hypothesis Space:** Often assumed in symbolic cognitive models. **Argument Against Necessity:** Humans demonstrably generate novel features and relations (Ontological Autonomy), suggesting the relevant hypothesis space is *constructed* during the problem-solving process, not enumerated beforehand. A theory could use generative processes for features and rules without pre-enumeration. **Argument For Utility:** Even if constructed, efficient search likely requires constraints or heuristics acting *like* a structured (if dynamic) hypothesis space. *Status:* A useful *implementation strategy* for efficiency, but not an absolute requirement if an alternative dynamic generation process meets the non-negotiables.
      2.  **Explicit Rule Representation:** Often assumed in symbolic/logic-based AI. *Status:* While the final *solution* is often stated explicitly, the human *process* likely involves subsymbolic pattern matching and similarity before verbalisation. An adequate theory might use subsymbolic representations that *support* explicit rule formulation.

  ### Incompatible Desiderata & Required Compromise

  *   **Conflict:** `Ontological Autonomy` (OA) requires generating novel features/relations. `Human-Like Efficiency` (HLE) requires finding the solution quickly (~1-2 mins). `Zero-Shot Generalisation` (ZSG) prohibits pre-training on similar problems.
  *   **Demonstration:** OA implies a vast or infinite space of possible features/relations to consider. An unconstrained search over this space for a rule separating 12 instances is computationally intractable within HLE timescales. ZSG prohibits narrowing the space via prior learning from *similar* BPs.
  *   **Impossibility:** Satisfying OA, HLE, and ZSG simultaneously with an unconstrained feature generator is impossible. HLE demands severe heuristics or biases.
  *   **Resolution:** `Ontological Autonomy` must be compromised. While the theory *must* generate features beyond a fixed primitive set (OA), the *process* for generating and evaluating candidate features and rules must be heavily constrained by **strong, innate, domain-general biases**.
      *   **Nature of Compromise:** OA is not abandoned; the system *can* generate novel features. However, the *search* for relevant features is massively pruned by:
          *   Innate perceptual grouping principles (Gestalt laws: proximity, similarity, closure, continuity).
          *   Innate biases towards geometric/spatial properties (shape, symmetry, topology, containment, adjacency, relative size, orientation).
          *   Innate biases towards simplicity (minimal description length, few features, high generality).
          *   Incremental refinement based on counterexamples (Abstraction Shift).
      *   **Why this Compromise?** HLE and ZSG are more fundamental to the core specification (explaining human performance and enabling practical systems). OA is essential but must operate within the constraints imposed by HLE/ZSG, meaning it cannot be an unguided, exhaustive search.

  ### The Eliminator: Ontological Autonomy

  The requirement that **eliminates the largest number of otherwise plausible accounts** is **Ontological Autonomy (OA)**.

  *   **Why:** Most existing computational approaches rely on a predefined feature set or vocabulary:
      *   **Classical Symbolic AI (e.g., rule induction):** Assumes predefined predicates/features.
      *   **Statistical Learning (e.g., SVM with standard kernels):** Relies on predefined feature vectors (e.g., pixel values, HOG, SIFT). While features can be learned, this typically requires large datasets, violating HLE/ZSG for BPs.
      *   **Connectionist Models (Standard ANNs):** Require extensive training data to learn relevant feature detectors, violating ZSG. Architectures pre-define the type of features learnable (e.g., CNNs for local translation-invariance).
      *   **LLMs (Prompted Textually):** Rely entirely on linguistic tokens and patterns learned from massive text corpora. They lack intrinsic visual processing and the ability to *genuinely* invent novel spatial/visual primitives not nameable in their training vocabulary. They also struggle with the precise spatial reasoning required.
  *   **Accounts it Doesn't Eliminate (as easily):** Program Induction (PI) with a rich primitive set *can* potentially generate novel combinations and relations, but often struggles with HLE due to search complexity and still relies on predefined primitives. **Neural Program Induction** or architectures combining neural feature learning with symbolic reasoning (e.g., **Neuro-Symbolic AI**) are actively researched but face significant challenges meeting HLE and ZSG simultaneously with OA. **Human Cognition** remains the existence proof it *is* possible.

  ### Brief Scored Comparison of Approaches (Optional)

  1.  **Classical Symbolic Rule Induction (e.g., ILP variants):**
      *   (+) Good at Intentionality, Asymmetry (if primitives chosen well), Solution Equivalence, can do Abstraction Shift (with refinement).
      *   (-) **Fails OA** (needs predefined predicates), **Fails Robustness** (needs careful feature engineering), **Fails HLE/ZSG** (search complex without good primitives). Score: 3/8 (non-negotiables).
  2.  **Connectionist / Deep Learning (e.g., CNNs):**
      *   (+) Good Robustness (built-in invariance), potential for Abstraction Shift (layers).
      *   (-) **Fails OA** (features learned are data-dependent, not invented de novo for a single problem), **Fails ZSG/HLE** (requires massive data/training per problem), poor at Intentionality/Asymmetry/Solution Equivalence (black box). Score: 2/8.
  3.  **Large Language Models (Text Prompting):**
      *   (+) Potential Solution Equivalence (linguistic flexibility), some Abstraction Shift.
      *   (-) **Fails OA** (trapped in linguistic priors), **Fails Robustness** (no true visual grounding), poor Intentionality/Asymmetry, **Fails ZSG/HLE** (reliability, grounding). Score: 2/8.
  4.  **Program Induction (e.g., DreamCoder, BPL):**
      *   (+) Strongest on OA (can invent novel functions/procedures), good Abstraction Shift, potential Intentionality/Asymmetry.
      *   (-) Often **Fails HLE** (combinatorial search is slow), **Fails Robustness** (depends on primitive set design), Solution Equivalence can be tricky. Score: 5/8 (OA, Abst Shift, Intentionality potential).
  5.  **Human Solvers:**
      *   (+) Meets all 8 non-negotiables (existence proof).
      *   (-) Not a computational theory. Score: 8/8.

  **Conclusion:** An adequate theory must explain how humans rapidly induce the *intended* concept from minimal noisy examples, ignoring irrelevancies, formulating it naturally, shifting abstraction levels as needed, recognising equivalent expressions, and crucially, **inventing the relevant ontological primitives on-the-fly under severe time constraints**, guided by strong, likely innate, domain-general biases. This combination, particularly **Ontological Autonomy under Human-Like Efficiency constraints**, remains the central challenge.
