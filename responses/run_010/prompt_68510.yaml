   In stage two, the expansion is such that the set is enlarged in a way that is especially beneficial to party 2 (since at every u1, the max u2 is at least as high, and strictly higher for some intervals, for instance near u1=4.5).

   The Nash solution violates "monotonicity" (which is the axiom that if the set expands in a way that is especially beneficial to one party, then that party should not end up worse off). Here, the set expansion is monotonic in the sense of being especially beneficial to party 2 (condition (ii)), but in the Nash solution, party 2 ends up worse off.

   The Kalai-Smorodinsky solution satisfies monotonicity (in the sense of the ideal point being unchanged and the set being enlarged in a way that is comprehensive and the ideal point unchanged, then the KS solution should have both coordinates at least as high; here, we see both coordinates are higher, so in particular, party 2 is better off).

   However, the Nash solution satisfies independence of irrelevant alternatives (IIA): if the solution in the larger set is in the smaller set, then it should be the solution in the smaller set. In stage two, the new Nash solution is not in the stage one set, so IIA doesn't apply. But the stage two set contains the stage one set. The new solution is not in the stage one set, so there is no violation of IIA.

   But the exercise is to exhibit the axiom each one is giving up in stage two.

   In stage two, the expansion is monotonic for party 2 (satisfies the condition in the axiom of monotonicity for Kalai-Smorodinsky). 
   - The Kalai-Smorodinsky solution respects monotonicity: party 2 is better off.
   - The Nash solution does not respect monotonicity: party 2 is worse off.

   Conversely, the Nash solution respects IIA (because the new solution is not in the old set, so there's no requirement that it be the same as the old solution). 
   - In this expansion, the new set contains the old set, and the new Nash solution is not in the old set, so IIA is not binding. 
   - The axiom that Nash solution is giving up is not IIA, but rather monotonicity.

   So the slide would show that Nash bargaining does not necessarily protect a party when the set expands in a way that is (in a specific sense) more favorable to that party.

   However, the expansion in this example is not a typical monotonicity expansion for Nash, because in Nash's axiom system, the only expansion axiom is IIA. There isn't an axiom called "monotonicity" in Nash's system. 
   But the property that is not satisfied is sometimes called "individual monotonicity" (for one player) or simply "monotonicity" in the context of Kalai-Smorodinsky.

   So in summary, in stage two:
   - Nash solution: violates monotonicity (party 2 is worse off despite the set expanding in a way that is weakly better for party 2 at every level of party 1's utility).
   - Kalai-Smorodinsky: satisfies monotonicity (party 2 is better off).

