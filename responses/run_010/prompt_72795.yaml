  The core tension they're highlighting is fascinating: despite a decade-long "debate" with seemingly ideal conditions (high-competence arguers, no apparent bad faith, mathematical precision), the system failed to resolve the dispute. Yet the institutional outcome (journal publication) contradicted the community's epistemic state. This directly challenges the debate model's assumption that truth has structural advantages under adversarial scrutiny.

  For point 1 mapping, I need to identify where the analogy holds and breaks down. Mochizuki's circle vs. critics like Scholze form the debaters, but the "judge" is fragmented - the mathematical community lacks both capacity and willingness to adjudicate. The disputed corollary is a perfect example of an "uncheckable atomic claim" due to its embeddedness in proprietary formalism. The payoff structure is misaligned too - critics gain little from engagement while proponents are invested in the theory's acceptance.

  On point 2 about adversarial pressure, the case suggests it's not load-bearing here. Scholze's good-faith effort (the Kyoto visit) didn't move the needle because the fundamental barrier was cognitive burden, not argument quality. The real work was done by opportunity cost - the community implicitly rejected claims that demanded unreasonable verification effort.

  The judge endogeneity in point 3 is devastating for debate theory. Mochizuki simultaneously created the lexicon, trained the judges (his students), and argued in that language. This circularity means the only "fluent" judges were already aligned with one side. In such cases, debate might actually entrench divisions by forcing judges to adopt partisan frameworks.

  For point 4's sincere obfuscation, this case is worse than strategic deception. When uncheckability emerges from genuine complexity rather than malice, adversarial pressure can't fix it - critics just look like they didn't try hard enough. The incentives actually reward deeper entrenchment.

  Point 5's burden-of-proof insight feels crucial. Mathematics safely defaults to "uncheckable = false" because truth persistence isn't urgent. But for AI alignment, uncheckable true claims could be catastrophic if discarded (e.g. safety proofs). This asymmetry in cost tolerance might make math-style skepticism dangerous in safety-critical domains.

  The journal capture in point 6 shows institutional vulnerability. Debate relies on trusted institutions to amplify criticism - when those are compromised, debate becomes theater. The real lesson might be that debate is only viable when robust criticism infrastructure exists.

  Finally for point 7, mathematics is simultaneously the best and worst case. Best because of its precision, worst because of private languages. The proposed bounded protocol would likely fail faster - either rejecting the proof prematurely or collapsing under combinatorial explosion of lemma decomposition. The first breakpoint would be when judges must accept unquestioned "axioms" from the arguer's proprietary framework.

  Throughout this, I'm careful not to judge the mathematical truth - as requested, that's irrelevant to the structural analysis. The key takeaway is that debate's failure here stems from pre-competitive conditions: absent shared semantics and verification infrastructure, adversarial evaluation cannot gain traction.
