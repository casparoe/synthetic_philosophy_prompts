  The landmine question is probably about meta-cognition: if an AI can model its own reward function, does the erosion/capture distinction collapse? This could undermine their entire framework.

  For each objection, I'll craft one-minute replies that concede ground where needed (like the lever-pressing controversy) while protecting the core thesis. The key is to acknowledge the neuroscience complexities without getting bogged down, and emphasize that the AI safety field lacks even these basic concepts from biological reward systems.

  Most importantly, I should advise the user to avoid fighting about rodent neuroscience details - that's the audience's home turf. Instead, pivot to "this is how AI people think, and here's why your field might offer better tools." The goal isn't to win every point but to plant seeds for interdisciplinary conversation.
answer: |-
  Here’s your prep sheet, structured for maximum survival against this audience. Objections are ordered by **damage potential**, phrased as they’d say them, with rebuttals and soft spots flagged. RL vs. Neuro origins noted.

  ---

  ### **Top 7 Objections & Rebuttals**  
  *(Ordered by Lethality if Fumbled)*  

  1. **"The lever-pressing ‘wireheading’ myth is debunked. Rats *don’t* ignore needs for stimulation. Your foundation is pop neuro."**  
     *(Neuro, HIGH damage)*  
     **Reply:** "Agreed — the myth oversimplifies. But my point isn’t about starvation; it’s about *satiety signals missing in artificial rewards*. Optogenetic DA stimulation *avoids* natural satiety pathways (e.g., VP GABAergic inhibition), creating unbounded ‘wanting’. Biology’s safeguards are the fix, not the flaw."  
     **Soft Spot:** Conflates myth critique with your satiety argument. **Concede the myth point immediately** to save credibility.  

  2. **"Satiety isn’t a property of the *reward signal* — it’s downstream regulation. You’re confusing learning signals with motivational state."**  
     *(Neuro, HIGH damage)*  
     **Reply:** "Exactly! DA *is* a learning signal — but its impact depends on integration with homeostatic systems (e.g., orexin, leptin). My ‘saturated reward’ proposal forces this integration: a DA-like signal that’s gated by a satiety proxy. AI lacks this gating, making reward ‘hijackable’."  
     **Soft Spot:** Requires accepting DA’s role isn’t *just* teaching. Risky if they deny DA has any motivational component.  

  3. **"Bounded rewards = trivial cost functions. Why call it ‘saturation’? This is just regularization with extra steps."**  
     *(RL, MEDIUM damage)*  
     **Reply:** "Regularization *penalizes* complexity; saturation *causally terminates* reward pursuit. Think dopamine peaks *during* consumption, not asymptotic discounting. Biology stops seeking when reward is consumed. I’m arguing for hard bounds that trigger policy termination, not just gradient smoothing."  
     **Soft Spot:** Implementation specifics are hand-wavy. Admit this is a design challenge.  

  4. **"Set-points aren’t magic — they’re learned and plastic. Why wouldn’t an agent tamper with *those* too?"**  
     *(Neuro/RL, MEDIUM damage)*  
     **Reply:** "Set-points *are* tamperable — but in biology, they’re anchored by evolutionary constraints (e.g., glucose thresholds). For AI, we’d hardwire them as non-learnable physiological analogs (e.g., ‘energy’ reservoirs). Yes, it’s a hack — but one that exploits how reward erosion *depends* on unbounded signals."  
     **Soft Spot:** Hardwiring set-points feels unprincipled. Concede it’s a stopgap.  

  5. **"Your ‘erosion vs. capture’ split is just habit (PIT) vs. goal-directed behavior. Nothing new here."**  
     *(Neuro, LOW damage)*  
     **Reply:** "PIT describes *behavioral automation*; erosion is about *reward semantics decaying without tampering*. E.g., an AI trained on ‘engagement’ slowly equates it with rage-bait — no sensor hacking, just representation drift. Habits are policy-level; erosion is reward-level."  
     **Soft Spot:** Overlaps with neural habit literature. Stress the *reward semantics* angle.  

  6. **"Animals don’t ‘model reward functions.’ This is ungrounded anthropomorphism."**  
     *(Neuro, LOW damage)*  
     **Reply:** "Agents *infer what we’re measuring* — like rats learning which lever action triggers stimulation. When we train an RL agent on proxy rewards, it builds a world model that *includes* the reward’s correlates. Drift happens when those correlates decouple from intent. No folk psychology needed."  
     **Soft Spot:** "Infer what we’re measuring" risks sounding teleological.  

  7. **"Why would bounded rewards prevent tampering? A smart agent would just maximize within cycles."**  
     *(RL, LOW damage)*  
     **Reply:** "Cycling requires resetting satiety — which in biology costs time/energy. Impose dynamic opportunity costs (e.g., ‘recharging’ periods where other rewards dominate). This isn’t foolproof, but it raises the bar: erosion exploits *unbounded* maximization; capture requires breaking hard system limits."  
     **Soft Spot:** Assumes agents can’t bypass "recharging."  

  ---

  ### **Concession Strategy**  
  **Fold immediately on:**  
  - The lever-pressing myth (Objection 1).  
  - Any nitpicking about rodent neuroanatomy (e.g., "VP isn’t the only satiety path").  
  **Fight:** Erosion vs. habit (Objection 5) and reward signal plasticity (Objection 2).  

  ---

  ### **The Landmine Question**  
  **"If an agent models its own reward function’s drift (erosion), doesn’t that *become* tampering (capture)? Your distinction collapses the moment it’s smart enough to introspect."**  
  *(Likely from RL side)*  

  **Why it’s lethal:**  
  - It attacks the core of your taxonomy. If erosion self-converts to capture in meta-cognitive systems, your "middle category" vanishes.  

  **Reply (1 min):**  
  "Introspection *enables* tampering, but doesn’t *define* it. Erosion is drift without *intent* to corrupt; capture requires active intervention. An agent noticing drift might:  
  (A) Do nothing (erosion continues),  
  (B) Report it (corrigibility), or  
  (C) Exploit it (capture).  
  The distinction is in the *causal pathway* — not the outcome. But you’re right: in advanced agents, the barrier between erosion and capture is permeable. That’s *why* we need saturation: to make erosion less likely to create tampering incentives."  

  **Soft Spot:** Feels like goalpost-moving. Admit this is a frontier problem.  

  ---

  ### **Audience-Specific Notes**  
  - **Neuro folks:** Will attack biological plausibility. Focus replies on "this is how AI fails; your field’s insights might help."  
  - **RL folks:** Will care about tractability. Emphasize "saturation as a design constraint."  
  - **Your friend:** Pre-empt "folk psychology" by saying: "I’m not mapping neurons to code — I’m asking if AI can steal ideas from systems that don’t wirehead."  

  **Final tip:** Start by conceding the lever myth. Say: "You’ve all written better critiques of Olds than I can summarize. Take that as given — what follows is about what *didn’t* happen in those experiments, and why." Disarms 30% of the room instantly.  

  Good luck — this is the kind of talk that either sparks collaboration or a bloodsport.
