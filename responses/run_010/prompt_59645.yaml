  First, I need to understand the core tension: the user is applying rodent reward system concepts to AI alignment problems, but neuroscientists in the audience might reject this cross-disciplinary leap. Their friend's criticism about "folk psychology" suggests deep skepticism about mapping neural circuits to agent architectures.

  The user's three claims are:
  1) Current AI safety taxonomy misses important cases because it treats reward as fixed, unlike neuroscience's view of reward as a dynamic teaching signal
  2) Proposing a new split between "reward capture" (direct hijacking) vs "erosion" (gradual drift) - arguing erosion is the real problem
  3) Advocating for "saturated rewards" (bounded, homeostatic) as the solution

  For the prep sheet, I should focus on objections this specific audience would raise. The neuroscientists will likely attack:
  - Validity of the lever-pressing myth
  - Whether satiety is inherent to neural signals or just behavioral
  - If bounded rewards are meaningfully different from standard cost functions
  - Whether set-points can be tampered with
