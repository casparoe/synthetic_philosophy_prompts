  For the British English: "trolley" not "cart", "torch" not "flashlight", "till" not "until". Idioms like "taking the piss", "on the blink". Spelling: "realise", "centre", "programme". 

  Conservation checks: 
  - Decommissioned equipment's charge transfers to environment 
  - Kettle failure shows charge redistribution in action 
