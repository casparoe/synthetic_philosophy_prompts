prompt: |-
  I chair the scoring subcommittee of a mid-size forecasting tournament (~4,000 registered forecasters, run out of a research group, questions resolved by an independent team that doesn't talk to us about substance), and we have a fight to settle before the season opens in three weeks. This year's question set has a lot of logically interlocking questions and people have started submitting numbers that can't all be right. Concrete cases in front of us right now: (a) Q12 asks whether the annual mean anomaly for 2031 will be above 1.5C on our baseline and Q13 asks the same for 2.0C — Q13 can only happen if Q12 does, and one forecaster has 0.58 and 0.71 respectively; (b) Q31 asks whether the treaty gets ratified by at least 40 signatories by 31 Dec, Q32 whether it gets ratified by at least 40 signatories *including* a specific country, and someone has 0.44 on Q31 and 0.52 on Q32; (c) Q7 and Q19 turned out, once the resolution team wrote up their criteria, to be the same question in different words, and we have submissions scattered between 0.2 and 0.8 across the two. Half the committee wants a coherence rule that automatically flags any submission set violating the obvious probability constraints, then either bounces it back for revision or docks the forecaster's score. Their argument is the betting one: with numbers like those, someone could build you a package of wagers at your own stated prices that loses money come what may, so you're strictly worse off than a forecaster who bothered to fix their numbers, and we shouldn't be handing out points for that. The other half says this is unfair — nobody's beliefs come pre-packaged with all their consequences visible, a person working through 300 questions over a weekend can't be expected to have mapped which entails which, and if we police this we end up punishing the people who think hard about the hard questions instead of the people who are just wrong.

  I lean toward the second group but I dont have a clean position, mostly because the duplicate case (Q7/Q19) feels different to me from the 1.5C/2.0C case and I can't articulate why, which is annoying since that one is coming up no matter what we decide. Two other complications. Our one computer scientist on the committee says the pairwise checks are trivial but that screening a whole assignment over 300 interlocking questions for joint consistency is a nasty combinatorial problem — she keeps saying "intractable" and won't commit to a number of pairs we could realistically screen with the two part-time scorers we have. And some of the alleged entailments aren't strict: one pair only entails if you accept a particular definition of "recession" that the resolution team may or may not use when they write the criteria, and I genuinely don't know whether a rule should reach out and touch those or leave them alone.

  Could you draft the memo I'll circulate to the full committee before Thursday's meeting? I need a real bottom line up front — adopt the coherence rule, reject it, or adopt a narrowed version — plus an operational procedure the scoring team could actually run: what gets checked, any tolerance band, what happens to a flagged submission before resolution, and what happens when a violation is only discovered after the questions have already resolved and points have been paid out. Engage the betting argument on its merits rather than swatting it, and give me the strongest case for whichever side you end up rejecting, because I'll get asked. I'd also like an explicit line on the duplicate-question case and on the not-strictly-entailing case, and if your recommendation turns on some distinction between those and the clean nested ones, say so plainly so I can defend it in the room. About 700–900 words is right.
reasoning: |-
  Okay, let me start by understanding the user's problem. They chair a scoring subcommittee for a forecasting tournament with about 4,000 forecasters. The issue is that some forecasters are submitting probabilities that are logically inconsistent—like assigning a higher probability to a stricter condition than its prerequisite, or duplicating answers for the same question. The committee is split: half want to enforce coherence rules, arguing that inconsistent probabilities allow for guaranteed losses in betting scenarios. The other half thinks it's unfair because forecasters can't be expected to map all logical dependencies across 300 questions.

  First, I need to unpack the core conflict. The betting argument is strong in theory—incoherent probabilities mean you can be Dutch booked. But practical concerns matter too. Can the scoring team realistically check all pairs? The computer scientist mentioned combinatorial problems, which is a real hurdle. Also, forcing coherence might penalize those who engage deeply but miss some links, while superficial forecasters might avoid penalties by sticking to safe, vague probabilities.

  The user mentioned specific cases: nested conditions (Q12/Q13), overlapping but not identical events (Q31/Q32), and duplicates (Q7/Q19). Each has different implications. Duplicates are clear-cut—identical questions must have the same probability. Nested conditions should have P(A) >= P(B). The murky area is when entailment isn't strict, like using different definitions. Here, enforcing coherence might overreach if the resolution criteria aren't finalized.

  The user's unspoken needs might include maintaining tournament integrity without discouraging participation. They need a solution that's fair, implementable, and defensible. They also need clear operational procedures to handle flagged submissions pre- and post-resolution.

  I think a tiered approach makes sense. Strict enforcement for clear duplicates and strict entailments. For nested sets, a tolerance band could account for rounding errors. But for non-strict entailments, it's better to avoid enforcement since dependencies aren't certain. Post-resolution, if violations are found, it's too late to adjust scores—consistency checks should only happen upfront.

  The memo should balance principle and practicality. Recommend a narrowed coherence rule focusing on unambiguous cases. Address the betting argument by acknowledging its validity but emphasizing feasibility and fairness. Highlight that duplicates are non-negotiable, while conditional cases get leeway with tolerances. Also, the operational plan must be executable with limited staff, so pairwise checks are manageable, but full joint consistency isn't feasible.

  Finally, the bottom line: adopt a narrowed rule. This satisfies the principle for the most egregious errors without overburdening the committee or punishing well-intentioned forecasters.
answer: |-
  **MEMORANDUM**  
  **TO:** Scoring Subcommittee Members  
  **FROM:** Chair, Scoring Subcommittee  
  **DATE:** 15 October 2023  
  **SUBJECT:** Policy Recommendation: Logical Coherence Rules for Probability Submissions  

  ---

  ### **Bottom Line Up Front**  
  **Adopt a narrowed coherence rule** focusing exclusively on (1) **strictly nested binary probabilities** (e.g., Q12/Q13) and (2) **identical questions** (e.g., Q7/Q19). Flag submissions violating these constraints with a **48-hour revision window** and a **5% scoring penalty** if unremedied. Do *not* enforce coherence for probabilistically dependent but non-nested questions (e.g., Q31/Q32) or entailments relying on unresolved definitions.  

  ---

  ### **Core Recommendation & Operational Procedure**  
  #### **1. Scope of Checks**  
     - **Check ONLY:**  
       - **Strictly nested pairs** (e.g., *Q12: P(anomaly >1.5°C)* vs. *Q13: P(anomaly >2.0°C)*).  
       - **Identical questions** (e.g., Q7/Q19 per resolution criteria).  
     - **Exclude:**  
       - Non-nested dependencies (e.g., Q31/Q32: P(ratification by ≥40) vs. P(ratification by ≥40 *including* Country X).  
       - Entailments relying on external definitions (e.g., recession criteria).  

  #### **2. Tolerance & Threshold**  
     - **Nested pairs:** Allow a **±0.05 tolerance** for rounding/input errors (e.g., P(Q12) ≥ P(Q13) – 0.05).  
     - **Identical questions:** **Zero tolerance** (P(Q7) must equal P(Q19)).  

  #### **3. Pre-Resolution Workflow**  
     - **Automated pairwise checks** at submission. Flag violations via email.  
     - **Forecaster action:** Revise within 48 hours. No penalty if fixed.  
     - **No revision?** Apply **5% penalty** to the *entire submission’s* Brier score. Submission stands as-is.  

  #### **4. Post-Resolution Discovery**  
     - **No retroactive penalties.** Once resolved, scores are final.  
     - **Exception:** Proven identical questions (e.g., Q7/Q19 resolved identically) are merged. The *higher* Brier score of the two counts.  

  ---

  ### **Engaging the Betting Argument**  
  The "Dutch book" critique is **theoretically valid**: incoherent probabilities imply a guaranteed loss if exploited. Strict coherence upholds rationality standards and rewards precision. *However*, practical constraints dominate:  
  - **Feasibility:** Full joint consistency checks across 300 interlocking questions are **computationally intractable** (NP-hard in general). Pairwise nested/identical checks are O(n²) and manageable.  
  - **Fairness:** Forecasters lack perfect logical omniscience. Penalizing non-obvious dependencies (e.g., Q31/Q32) disproportionately burdens engaged participants.  
  - **Incentives:** A narrowed rule avoids perverse outcomes (e.g., conservatism in forecasting to evade penalties).  

  **The strongest counterargument:** Enforcing coherence *only where obvious and mechanical* (nested/identical) corrects unambiguous errors without demanding unrealistic foresight.  

  ---

  ### **Handling Edge Cases**  
  #### **Duplicate Questions (Q7/Q19)**  
    - **Mandate identical probabilities.** Identical questions under identical resolution criteria *must* have identical probabilities. No tolerance.  
    - **Why strict?** This reflects inattention, not epistemic limitations. Allowing divergence undermines scoring validity.  

  #### **Non-Strict Entailments (e.g., Recession Definition)**  
    - **Exclude from checks.** Entailments contingent on unresolved definitions are probabilistic, not logical. For example:  
      > *If* recession requires two-quarters of negative growth, *then* P(recession in H1) ≥ P(recession in FY).  
      Until criteria finalize, this remains a *belief*, not a constraint.  

  #### **Nested vs. Non-Nested Pairs**  
    - **Nested (Q12/Q13):** P(Q12) ≥ P(Q13) is a **logical truth** (Q13 ⊂ Q12). Enforcement is defensible.  
    - **Non-Nested (Q31/Q32):** P(Q31) ≥ P(Q32) is **probabilistically likely but not certain** (e.g., ratification without Country X is possible). Penalizing this conflates correlation with entailment.  

  ---

  ### **Why Not Full Coherence or No Rule?**  
  - **Full coherence** is operationally impossible and philosophically overreaching. It demands forecasters solve intractable logical systems.  
  - **No rule** permits unambiguous errors (e.g., P(A) < P(B) when B ⊂ A), eroding scoring credibility and enabling "free points" for incoherence.  
  - **This compromise:** Balances rigor and realism. It corrects **egregious/mechanical errors** while respecting cognitive limits.  

  ---

  ### **Implementation Summary**  
  | **Case**               | **Check?** | **Tolerance** | **Penalty**         |  
  |------------------------|------------|---------------|---------------------|  
  | Strictly nested (Q12/Q13) | Yes       | ±0.05         | 5% if unfixed       |  
  | Identical (Q7/Q19)      | Yes       | None          | 5% if unfixed       |  
  | Non-nested (Q31/Q32)    | No        | N/A           | N/A                 |  
  | Definition-dependent    | No        | N/A           | N/A                 |  

  **Scoring team capacity:** Automated pairwise checks require ~45k comparisons (300C₂). With optimization (pre-indexed entailments), this is feasible on commodity hardware.  

  ---

  ### **Conclusion**  
  Adopting this narrowed coherence rule corrects indisputable logical errors while avoiding impractical or unfair burdens. It aligns with our mandate to score forecasts rigorously *and* constructively. Forecasters retain agency to fix errors pre-resolution, and the penalty disincentivizes neglect without invalidating effort. I move to implement this policy for the 2023 season.  

  ---  
  **Approved by:** Chair, Scoring Subcommittee  
  **Feedback deadline:** 18 October 2023, 12:00 PM ET
