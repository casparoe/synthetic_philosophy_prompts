answer: |-
  ## Memorandum: Local Currency Pilot Recommendation

  **To:** Finance Committee  
  **From:** Council Member [Your Name]  
  **Subject:** Recommendation on Local Currency Pilot Proposal  

  ### I. Berkeley's Lens: Why the Pilot Merits Support
  Berkeley’s core insight – that money’s value lies solely in its power to *move* goods, services, and labor, not in inert metal – is directly relevant. He argued true wealth is generated by industry and circulation, not hoarding. The proposed pilot embodies this principle deliberately:
  *   **Expiration (90 Days):** This is the pilot's strongest Berkeleyan feature. It forces velocity. Money that expires cannot stagnate; it *must* be spent, driving immediate local economic activity ("shifts worked, shelves restocked"). **Keep the expiry.** Consider shortening it (e.g., 60 days) to further accelerate circulation, but 90 days is a reasonable start.
  *   **Measuring Success:** Berkeley would urge us to track velocity and concrete outputs (local transactions, jobs supported, utilization of city services) – *not* the accumulation of tokens. This aligns perfectly with the pilot's stated goals.
  *   **Focus on Circulation:** The design inherently discourages hoarding and prioritizes active use over passive saving – the antithesis of "money failing in a chest."

  This perspective justifies the core concept: a token whose sole purpose is to stimulate *local* industry and exchange.

  ### II. Where Berkeley's Picture is Incomplete (Objections (a) & Context)
  Berkeley advocated for a *national* bank in a largely *closed*, coin-starved agrarian economy. We operate a *small*, *open* town deeply integrated into the broader dollar economy. This changes the calculus significantly and validates Objection (a) – Leakage.

  *   **Objection (a) Leakage – The Critical Weakness:** Berkeley underestimated the permeability of modern economies. Most local merchants *must* spend revenue externally for supplies, rent, utilities, and wholesale goods. The pilot risks being merely a one-time local spend followed by rapid exit of value. **This is the most substantial risk.** A token circulating only once locally before converting back to dollars (even at a haircut) offers minimal net benefit relative to cost and complexity. Berkeley’s model assumed a far more closed system than we have. His emphasis on circulation *within* the system doesn't solve the leakage at the system's boundaries.

  Objection (b) Stigma is real but manageable. Food bank distribution is vital for equity and initial velocity. Mitigation lies in **broadening issuance significantly through anchor employers** (see below) and ensuring prominent merchant acceptance. The payroll match is key to preventing perception as solely a "poor people's currency." Objection (c) Liability is an accounting challenge, not a fundamental flaw. Properly structuring the token as a non-redeemable city obligation (like a transit token) and budgeting for potential redemptions addresses this.

  ### III. Recommendations & Design Refinements
  Based on Berkeley's valid core principle (circulation=value) but acknowledging the critical leakage risk in our open economy:

  1.  **Initial Issuance:** **Shift focus significantly towards anchor employers.** While maintaining the food bank component for equity and initial velocity, prioritize the payroll match. Issuing primarily to employees ensures broader circulation *before* potential leakage through merchant external spending. Household issuance risks slower initial velocity or hoarding (against Berkeley's principle).
  2.  **City Acceptance:** **Accept tokens only for non-tax-linked services initially (parking, pool, permits).** Accepting for property-tax-adjacent fees introduces unnecessary accounting complexity and potential legal grey areas. Keep it simple and focused on services where token velocity is easily trackable and doesn't impact core revenue streams.
  3.  **The 10% Haircut Clause:** **Modify, but keep a mechanism.** Objection (c) highlights a liability if redemptions surge. Berkeley would see the haircut as a friction *against* converting local activity back to inert dollars. However, the merchants' concern about devaluation is valid. **Proposal:** Replace the city-funded haircut with a **merchant-funded redemption pool.** Participating merchants contribute a small percentage (e.g., 0.5-1%) of token revenue into a fund managed by the Merchants' Association. Residents can exchange tokens for dollars via the Association at a 10% haircut, funded *by the pool*, not the city. This internalizes the cost, caps city liability, maintains convertibility for residents (and the food bank's preference), and still discourages easy exit.
  4.  **Mitigating Leakage (The Critical Condition):** **This is the pilot's make-or-break.** The proposal needs a concrete mechanism to incentivize token retention *within* the business ecosystem. **Mandate the creation of a "B2B Exchange":** Require the Merchants' Association to establish and promote a platform where local businesses can use tokens to pay *each other* for services (e.g., a restaurant paying a local graphic designer, a shop paying a local repair service). This creates secondary circulation loops before tokens hit merchants needing external supplies. Track B2B transactions rigorously as a key success metric.

  ### Verdict
  The Berkeleyan principle that money's value is in its motion provides a powerful philosophical foundation for a local currency experiment. The forced circulation via expiry is sound. However, the pilot as proposed carries significant leakage risk in our open economy, which Berkeley's national, closed-economy model doesn't adequately address. Therefore, approval must be contingent on concrete design changes to foster internal business circulation and mitigate leakage.

  **Verdict: APPROVE WITH CONDITIONS — Implement mandatory B2B token exchange to reduce leakage risk.**
