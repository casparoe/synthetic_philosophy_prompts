prompt: |-
  Third-year philosophy of biology here. Since we did the Gould and Lewontin spandrels paper, 'that's just a just-so story' has become the all-purpose put-down in my department. It got used twice in the same seminar last week — once on me and once on a classmate who'd argued the exact opposite thing — and both times it seemed to land, which can't be right.

  The case was the human chin: the bony bump at the front of our lower jaw that chimps and other apes don't have, and which gets more pronounced as our jaws and teeth shrink down the hominin line. I argued it's a structural leftover of that shrinking, not something selection built. He argued it's an adaptation for handling the stresses of chewing. Same phrase, aimed at both of us.

  Could you lay out the distinct precise charges hiding in 'just-so story' as a menu rather than one undifferentiated blob — the 'you invented it after seeing the trait' one, the 'nothing could count against it' one, the 'you never tested it against the obvious alternatives: no selection at all, phylogenetic inertia, developmental constraint, architectural byproduct' one, the 'you've assumed it's useful now and inferred it was selected for' one, the optimality one. For each, say whether it's a genuine complaint or a bit of a cheat, and what would actually answer it.

  Then the two bits I care about. First, which readings really did apply to my byproduct story — becuase a spandrel account can be a just-so story too, surely — and which only applied to his. Is any charge asymmetric between the two, or does the phrase just mean 'I don't like your hypothesis'? Second, my tutor thinks the whole thing deflates to one point: a story is a just-so story just in case its author hasn't said what would count against it, and everything else people mean by it — 'no phylogenetic control', 'you ignored drift' — is a methodological complaint wearing a philosophy costume. I suspect that's too tidy; tell me if it is.

  Please be clear about what's settled and what's still genuinely contested among people who work on this, and don't hand me a contested view dressed up as the consensus.

  Sections, in this order: 'The readings' (numbered list, the bulk of the answer — charge, verdict, what would answer it); 'The chin case' (~300 words); 'Is my tutor right?' (~250 words); 'Settled vs contested' (short list to finish).
reasoning: |-
  Alright, the user is a third-year philosophy of biology student who's frustrated with the overuse of "just-so story" as a criticism in their department. They want a clear breakdown of what the term actually means, how it applies to their specific debate about the human chin, and whether their tutor's simplification holds up. 

  First, I need to unpack the multiple meanings of "just-so story" hiding under that catchy phrase. The user already has a good grasp of the common readings—post hoc invention, unfalsifiability, failure to consider alternatives, etc.—but wants them systematized. I should present these as distinct charges with verdicts on their validity and how to address each. The challenge is balancing precision with accessibility; they're philosophically trained but not necessarily deep in methodology.

  For the chin case, the asymmetry question is key. Both adaptationist and byproduct accounts can be just-so stories if poorly constructed, but the charges differ. The byproduct hypothesis faces weaker versions of most critiques—it doesn't claim utility, so "retrospective utility" doesn't stick, and drift/phylogeny are less pressing. But it absolutely can be untestable if framed vaguely. I'll need concrete examples from the literature to show how stronger byproduct arguments work.

  The tutor's deflationary view is provocative but oversimplified. While specifying what counts against a hypothesis is necessary, it's not sufficient—there are methodological sins (like ignoring phylogeny) that make stories "just-so" even with falsifiability claims. This matters because the user suspects their department uses the phrase as a thought-terminating cliché. I should validate that intuition while acknowledging the tutor's core point has merit.

  On settled vs contested: The Gould-Lewontin critique's validity is settled, but its application isn't. We agree that testing alternatives is mandatory, but disagree on whether byproduct hypotheses get a pass on rigor. I'll flag where the debates are live (e.g., whether drift requires explicit modeling) to honor their request not to dress contested views as consensus.

  Throughout, I'll maintain their philosophical framing but ground it in biological practice—they're clearly tired of armchair criticism. The tone should be collegial but blunt; they want tools to push back, not reassurance.
answer: |-
  Here’s a structured breakdown of the "just-so story" critique, applied to your chin debate, with clarity on settled vs. contested issues.

  ---

  ### **The Readings: A Menu of Charges**
  *(Charge, Verdict, What Would Answer It)*

  1. **"Invented Post Hoc"**  
     - **Charge**: Hypothesis constructed *after* observing the trait, reverse-engineering a narrative without prior prediction.  
     - **Verdict**: **Genuine complaint** (violates hypothetico-deductive method).  
     - **Answer**: Show the hypothesis was *predictive* (e.g., "If chin is a byproduct, we should find X in fossil transitions") and not reverse-engineered.  

  2. **"Untestable/Falsifiability Failure"**  
     - **Charge**: No conceivable evidence could disprove the hypothesis; it explains everything and nothing.  
     - **Verdict**: **Genuine complaint** (violates Popperian falsifiability).  
     - **Answer**: Specify *what evidence would refute it* (e.g., "If chins are adaptations, we should see genetic signatures of selection in lineage Y; absence refutes this").  

  3. **"Ignores Plausible Alternatives"**  
     - **Charge**: Fails to test against null models (drift, no selection), phylogenetic inertia, developmental constraints, or architectural byproducts.  
     - **Verdict**: **Genuine complaint** (methodological best practice).  
     - **Answer**: Systematically test against alternatives (e.g., phylogenetic comparative methods, biomechanical simulations of byproduct vs. adaptation).  

  4. **"Retrospective Utility = Selection" (Pan-adaptationism)**  
     - **Charge**: Assumes current utility implies past selection, ignoring exaptation or non-adaptive origins.  
     - **Verdict**: **Genuine complaint** (Gould & Vrba’s "exaptation" critique).  
     - **Answer**: Demonstrate selection *acted on the trait specifically* (e.g., via population genetics, fossil trait-function correlation).  

  5. **"Optimality Assumption"**  
     - **Charge**: Presumes the trait is "optimally designed," ignoring constraints/historical contingencies.  
     - **Verdict**: **Mostly genuine** (but context-dependent; optimality models *can* be tools).  
     - **Answer**: Show trait outperforms alternatives *despite* constraints (e.g., biomechanical efficiency vs. developmental cost).  

  ---

  ### **The Chin Case: Asymmetry in Charges**
  Your byproduct account (chin as structural side effect of jaw reduction) and your classmate’s adaptation account (chin selected for stress resistance) both *could* be just-so stories—but the charges apply differently:  

  - **Against your classmate (adaptationist)**:  
    - **Pan-adaptationism (#4)** likely applies: assuming chewing utility implies past selection.  
    - **Ignores alternatives (#3)**: Did they test against byproduct, drift, or constraint?  
    - **Post hoc (#1)**: Common if utility is reverse-engineered from modern humans.  
    - **Answer**: Fossil evidence of chin emergence *before* chewing stresses increased, or biomechanical data showing chin doesn’t enhance stress resistance.  

  - **Against you (byproduct)**:  
    - **Ignores alternatives (#3)**: Did you consider if drift *or* selection (e.g., sexual selection on chin shape) could explain it?  
    - **Untestability (#2)**: Risk if no clear predictions (e.g., "Should we see chins in *all* lineages with jaw reduction?").  
    - **Post hoc (#1)**: Possible if narrative is retrofitted.  
    - **Key asymmetry**: Pan-adaptism (#4) *doesn’t apply* to you. Byproduct accounts avoid assuming utility=selection.  

  **Conclusion**: Both accounts risk being just-so stories if untested, but adaptationist hypotheses face extra scrutiny for #4. The phrase isn’t *just* "I dislike it"—it flags methodological gaps. A strong byproduct account must still test against drift, selection, or phylogeny (#3).  

  ---

  ### **Is My Tutor Right?**  
  **Short answer: No, it’s more than falsifiability—but your tutor’s point is core.**  

  - **Falsifiability is necessary but insufficient**. Specifying what counts against a hypothesis (#2) is foundational, but:  
    - Methodological rigour (#3: testing alternatives) is equally critical. Ignoring phylogeny or constraints is a *substantive* flaw, not just "philosophy in costume."  
    - **Example**: Claiming "chin is an adaptation for speech" without comparative data on apes/fossils ignores phylogenetic constraints—a concrete methodological error.  
  - **Why it’s not "just falsifiability"**: A hypothesis can be falsifiable but still fail #1 (post hoc), #3 (untested alternatives), or #4 (retrospective utility). Optimality models (#5) are falsifiable but often misapplied.  
  - **Verdict**: Your tutor identifies the *core* issue (good!), but the critique is multi-vector. Falsifiability is the gatekeeper; methodological rigor (#1,3,4,5) determines scientific value.  

  ---

  ### **Settled vs. Contested**  
  | **Settled**                                  | **Contested**                                  |  
  |---------------------------------------------|-----------------------------------------------|  
  | Hypotheses must be falsifiable (#2).        | How rigorously alternatives (#3) must be tested (e.g., must drift *always* be modeled?). |  
  | Utility ≠ selection (#4); exaptation is real. | Whether byproduct accounts need *stronger* evidence than adaptationist ones. |  
  | Ignoring phylogeny/constraints (#3) is flawed. | If "optimality" (#5) is ever a valid starting point. |  
  | Post hoc storytelling (#1) is poor science. | How to quantify "constraint" in byproduct accounts. |  
  | Adaptationist hypotheses face higher risk of #4. | Whether spandrels are as common as Gould/Lewontin claimed. |  

  **Key nuance**: "Just-so story" is now a *rhetorical* weapon, but its valid uses reflect settled principles of hypothesis-testing. The chin remains debated precisely because both accounts have gaps—neither has fully answered charges #1–3.
