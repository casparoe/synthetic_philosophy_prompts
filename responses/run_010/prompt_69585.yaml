answer: |-
  ### Design Procedure: Operationalizing Ambiguous Decision Points

  This procedure targets spec sections where a component faces indistinguishable decision points requiring different actions. It follows a step-by-step flow, with explicit criteria for answers and branching decisions. Timebox: 30 minutes.

  ---

  #### **Step 1: Map the Ambiguity**
  - **Question:** What causes the indistinguishability? List observable vs. hidden factors.
  - **Sufficient Answer:** 
    - Identify environmental symmetry (e.g., identical chambers), state loss (e.g., restarts), or knowledge gaps (e.g., handovers). 
    - Confirm the component has no sensor/data to break symmetry *at decision time*.
  - **Judgment Call:** Severity of wrong actions (e.g., "duplicated actuation" vs. "wasted shift").

  #### **Step 2: Define Action-Outcome Pairs**
  - **Question:** For each decision point, what actions are possible, and what are the outcomes? Quantify payoffs if possible (cost/benefit), or rank qualitatively (e.g., Catastrophic/Bad/Tolerable/Good).
  - **Sufficient Answer:** 
    - A payoff matrix or qualitative ranking of outcomes for each decision point. 
    - Specify irreversible effects (e.g., "duplicates side-effect").
  - **Handoff:** If payoffs can’t be ranked, escalate for risk appetite input.

  #### **Step 3: Test Uniform Determinism**
  - **Question:** If the same action is applied at all ambiguous points, is the outcome acceptable?
  - **Sufficient Answer:** 
    - Simulate the worst-case outcome (e.g., "always retry → duplication").
    - If outcome is tolerable (e.g., "wasted shift is acceptable"), **STOP: Use uniform action**.
  - **Branch:** If unacceptable → Proceed to Step 4.

  #### **Step 4: Assess Symmetry-Breaking State**
  - **Question:** Can state (e.g., counter, token, log) be added? What is the cost?
  - **Sufficient Answer:** 
    - List options (e.g., persistent storage, coordination service) and costs: 
      - Development effort (e.g., "2 engineer-months").
      - Operational risk (e.g., "counter corruption").
      - New failure modes (e.g., "log desync").
    - If cost is low/acceptable, **STOP: Implement state**.
  - **Judgment Call:** Cost vs. risk tolerance (e.g., "avoid $10k in dev to prevent $1k/shift waste?").

  #### **Step 5: Derive Randomization Probability**
  - **Question:** Are payoffs quantifiable?
    - **Yes:** Calculate optimal probability (see *Method* below).
    - **No:** Use risk ranking to weight probability (e.g., "Catastrophic outcome → near-zero probability").
  - **Sufficient Answer:** 
    - A probability `p` or range (e.g., "retry with p=0.2").
    - Rationale: "Minimize risk of duplication given unknown prior state."
  - **Handoff:** If probabilities conflict with safety certs → Flag for review.

  #### **Step 6: Choose and Justify**
  - **Decision Rule:**  
    1. **Uniform action** (if Step 3 acceptable).  
    2. **Symmetry-breaking state** (if Step 4 cost-effective).  
    3. **Randomization** (if Step 5 feasible).  
    4. **Ex-ante plan** (rare; only if actions can be pre-bound, e.g., "always exit at junction 2" in driver problem).  
  - **Output:** A directive: "Add state here," "Randomize with p=X," or "Use uniform action; accept risk."

  ---

  ### **Method for Quantifiable Payoffs (Step 5)**
  Model as a sequential game:
  - Let decision points be nodes with identical observations.
  - Assign payoffs to outcomes (e.g., exit at first junction: 0, exit at second: 4, drive past both: 1).
  - Solve for probability `p` that maximizes expected payoff.  
    *Example (absent-minded driver):*  
    - Continue at each junction with probability `p`.  
    - Expected payoff = `P(exit at first) * 0 + P(exit at second) * 4 + P(drive past) * 1`.  
      `P(exit at first) = 1−p`,  
      `P(exit at second) = p*(1−p)`,  
      `P(drive past) = p²`.  
    - Maximize `E = 0 + 4p(1−p) + 1*p² = 4p − 3p²`.  
    - Derivative: `4 − 6p = 0` → `p = 2/3`.  
    - *Your arithmetic is correct: E=4/3 with p=2/3.*

  ---

  ### Case Applications

  #### **Case 1: Retry Policy After Crash**
  - **Step 1:** Ambiguity from state loss on restart. Workers can’t distinguish attempt 1 vs. 4.  
  - **Step 2:** Actions: Retry or abort. Outcomes:  
    - Retry on first attempt: Cost (-1), avoids missed work (-5).  
    - Retry on duplicate: Catastrophic duplication (-10).  
    - Abort on first attempt: Missed work (-5).  
    - Abort on duplicate: No cost (0).  
  - **Step 3:** Uniform retry → Duplication risk → Unacceptable.  
  - **Step 4:** Symmetry-breaking state (e.g., shared log) → Cost: High (needs crash-resilient storage).  
  - **Step 5:** Payoffs quantifiable but prior unknown. Weight probabilities:  
    - Avoid duplication (catastrophic) → Low retry probability (e.g., `p=0.2`).  
  - **Step 6:** **Randomize with p=0.2** for retry. State too costly; uniform action too risky.  
  - **Why not ex-ante?** Workers are independent; no central plan.

  #### **Case 2: On-Call Operator Handover**
  - **Step 1:** Ambiguity from incomplete handover. Operator can’t tell if mitigation was tried.  
  - **Step 2:** Actions: Try mitigation or skip. Outcomes:  
    - Try when not done: Cost (-2), may resolve incident (+10).  
    - Try when done: Duplicated disruption (-8).  
    - Skip when not done: Escalation cost (-4).  
    - Skip when done: No cost (0).  
  - **Step 3:** Uniform action → Skipping risks escalation; retrying risks duplication → Unacceptable.  
  - **Step 4:** Symmetry-breaking state (e.g., incident log) → Cost: Low (existing ticketing system).  
  - **Step 6:** **Implement state (log)**. Cheap and reliable; avoids randomization complexity.

  #### **Case 3: Tunnel Vehicle in Identical Chambers**
  - **Step 1:** Ambiguity from repetitive chambers (no landmarks).  
  - **Step 2:** Actions: Unique behaviors at chambers 1, 3, 5. Wrong action: Inspection failure (-7).  
  - **Step 3:** Uniform action → Guaranteed failures → Unacceptable.  
  - **Step 4:** Symmetry-breaking state (e.g., odometer counter) → Cost: Medium (add non-volatile memory; risk sensor drift).  
  - **Step 5:** Randomization → Violates deterministic cert requirement.  
  - **Step 6:** **Forces state implementation**.  
    - **Cost:** Hardware (sensors/memory), testing (failure recovery), certification update (~6 months, $250k).  
    - **Safety Argument:** "State breaks symmetry; deterministic actions justified by locally stored counter. Redundancy added for fault tolerance (e.g., triple-modular counters)."  
    - **Blunt Truth:** Randomization is disallowed by cert; state is unavoidable.

  ---

  ### Limitations and Strained Analogies
  1. **Multi-Agent vs. Single-Agent:**  
     - The driver is one agent across time; your components are distinct entities (workers, operators, vehicles).  
     - **Why it matters:** In multi-agent cases (e.g., retry workers), independent actions amplify risks (e.g., multiple retries → high duplication chance). The procedure adapts by weighting outcomes more conservatively (e.g., Case 1’s low `p`).  
     - **Does it break reasoning?** No—core principles hold (symmetry-breaking, randomization), but optimal probabilities may differ.

  2. **What the Procedure Can’t Do:**  
     - **Handle interdependencies:** If decision points affect each other (e.g., chamber 1’s outcome changes chamber 3’s payoffs), escalate.  
     - **Resolve unquantifiable risks:** Qualitative rankings require human judgment.  
     - **Override certification:** Safety constraints (e.g., "no randomness") force tradeoffs (e.g., state cost).  
     - **Fix coordination failures:** If agents *could* share state but don’t (e.g., handovers), the procedure flags it but can’t enforce cultural fixes.

  3. **Where Judgment Masquerades:**  
     - Step 4 (cost of state) and Step 5 (probability without payoffs) are inherently subjective. The procedure exposes but doesn’t eliminate this.  
     - Safety reviewers must accept "less bad" outcomes when perfection is impossible (e.g., randomization in Case 1).

  ### Final Output
  - **Deliverable:** A directive (state/randomize/uniform) with justification.  
  - **Time Saver:** Reject local reasoning ("What should I do now?") when ambiguity exists. Favor ex-ante plans or symmetry-breaking.  
  - **Team Script:** "If it’s indistinguishable and actions must differ, either count, randomize, or accept the least bad uniform action."
