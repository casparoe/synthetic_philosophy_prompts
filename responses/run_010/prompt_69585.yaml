  The four responses the theory licenses are:
  1. Reason locally (if possible and appropriate).
  2. Commit ex ante to a plan that binds every instance (i.e., a deterministic policy that assigns actions to each decision point, even if the agent cannot distinguish them, by leveraging prior commitment).
  3. Buy symmetry-breaking state (i.e., carry or acquire state that breaks the indistinguishability).
