prompt: |-
  In a number of jurisdictions, mental health law recognises a device usually called a psychiatric advance directive or, when it does something stronger, a self-binding or "Ulysses" directive. A patient with a recurrent condition — bipolar disorder, say, or a psychosis that returns in recognisable episodes — signs a document while well. In it she consents in advance to specific measures she expects to refuse later: compulsory admission, depot medication, a particular ward. When the episode comes and she refuses, struggling and insisting that she is perfectly fine and wants to go home, the clinicians may treat her over that refusal, invoking her own earlier signature as the authority for doing so. Some versions of the scheme add two further features. The directive must be re-signed at fixed intervals while the patient is well, and lapses automatically if she does not re-sign it. And it may nominate a proxy — a family member, a named clinician — empowered to decide, without further appeal, when the patient has become the person the directive was written against.

  Meanwhile, in the same body of law, a competent adult's contemporaneous refusal of treatment is treated as conclusive: the settled doctrine is that you may not treat a patient who refuses while she has capacity, however badly she will fare as a result. Advance refusals of treatment are generally binding on clinicians, whereas advance requests for treatment generally are not — a patient cannot, by writing it down in advance, compel a doctor to provide a treatment the doctor thinks inappropriate.

  I would like an analysis of what this practice philosophically presupposes.

  - Reconstruct the implicit theory of authority. When the directive overrides the episode-self, what exactly is doing the normative work: the fact that a past act of will occurred, or the fact that it occurred under conditions the practice counts as good ones — calm, informed, undistorted, unafraid? Does the practice presuppose that deliberation under favourable conditions has a special standing that deliberation under unfavourable ones lacks, and if so, is that standing a matter of knowledge, of rationality, of authenticity, or of something else?
  - Does the practice require an idealised account of a person's good — that her interests are fixed by what she would want under full information and clear reasoning — or would a less demanding account license it? Does it require any particular view of personal identity, such as the sufficiency of psychological continuity, or the denial that the episode-self is in any sense a separate person? Be careful to separate what the practice strictly cannot do without from what it merely sits comfortably alongside.
  - Who idealises the idealiser? The directive is usually drafted in conversation with a clinician who shapes its vocabulary, its triggers, and its scope. Does the practice presuppose that this shaping is benign, and what does that assumption imply about whose deliberation is really being trusted? Relatedly, does it presuppose that the delegated procedure reliably converges on the answer the well-self would have given had she been present — and what follows for the practice if the two come apart systematically?
  - The proxy who decides, unreviewably, that the patient has become the person the directive was written against: what does installing such a judge presuppose about the relationship between a person's values and her behaviour?
  - What does the periodic re-signing requirement presuppose — that the authority of a deliberation decays with time, or that what matters is a continuing disposition rather than a completed act? Would the practice still hang together if directives never lapsed but the patient's values had demonstrably changed?
  - Is the practice consistent with the same system's insistence that a competent contemporaneous refusal is absolute, and with the asymmetry between binding refusals and non-binding requests? If there is a coherent picture that reconciles all three, state it; if not, say which piece has to give.
  - Where is the practice underdetermined? Set out at least three distinct theories — for instance one built on precedent autonomy, one on idealised desire, one on the narrative unity of a life, one on which the directive is not an order at all but a mandate to an agent — each of which would license it, and say what observable differences in the design of the scheme would distinguish them.
  - Finally: suppose we replaced the idealised-deliberation picture with a current-welfare view on which the only subject of interests is the person present in the episode. What would have to change in the practice, and is there any recognisable version of the directive that survives the substitution?

  Please write in British English. Argue for your reconstruction rather than merely cataloguing candidate theories, and do not worry about providing references or a reading list.
reasoning: |-
  Hmm, this is a fascinating and complex query about the philosophical presuppositions of psychiatric advance directives (PADs) and Ulysses directives. The user clearly has deep familiarity with mental health law and wants a rigorous philosophical analysis rather than practical implementation details. 

  The user structures their request with eight precise sub-questions, suggesting they're either an academic philosopher or a legal theorist specialising in medical ethics. The British English requirement and lack of citation requests indicate this is for conceptual clarity rather than scholarly attribution. 

  First, I need to unpack the core tension: how can a past self override a present competent refusal when standard medical ethics treats contemporaneous refusal as sacrosanct? The user's framing suggests they suspect incoherence in the system. 

  For the authority question (part 1), the key is recognising that the practice relies on epistemic conditions rather than mere past will. The re-signing requirement proves it's not about binding future selves like a contract, but about privileging cognition unimpaired by illness. This leans toward authenticity theories - the "calm self" is more truly the person. 

  On personal good (part 2), I should distinguish between necessary and sufficient conditions. The practice doesn't require full idealisation (like Parfit's critical interests), but minimally assumes that impairment distorts judgment about fixed interests. The identity question is trickier - the proxy provision implies continuity of identity, but the whole scheme acknowledges profound psychological discontinuity during episodes. 

  The clinician's role (part 3) reveals a vulnerability: the practice assumes shared hermeneutic frameworks between patient and doctor. But if clinicians systematically misinterpret "well-self" values, the proxy becomes paternalism in disguise. This needs careful handling to avoid undermining the whole model. 

  For the proxy's unreviewable power (part 4), the practice must presuppose that values manifest predictably in behaviour during episodes. This is empirically shaky - if symptom expression varies, the proxy becomes a values-interpreter, not mere trigger-detector. 

  Periodic re-signing (part 5) suggests authority derives from persistent dispositions, not acts. If values change while well, the practice logically should honour new directives - but the user's "demonstrably changed" scenario exposes a gap: what if the patient won't update the directive? 

  The consistency challenge (part 6) is thorniest. I think a coherent view exists: contemporaneous refusals bind because capacity is assessed in the moment, while advance directives bind only because they're refusals of future refusal (a meta-refusal). Requests don't bind because medicine requires contemporaneous judgment. 

  For underdetermination (part 7), I'll contrast precedent autonomy (Dworkin), ideal desire (Griffin), narrative identity (Schechtman), and agency models. Observable differences would include: who drafts directives, whether proxies can override content, and how value changes are handled. 

  Finally, switching to current welfare (part 8) would gut the practice. At most, you'd get non-binding advance statements - clinicians would revert to best interests determinations during episodes. The Ulysses element (self-binding) couldn't survive. 

  Throughout, I should maintain British English spellings ("prioritise", "authorise") and focus on arguing one coherent reconstruction rather than surveying literature. The user wants philosophy, not footnotes.
answer: |-
  The practice of psychiatric advance directives (PADs), particularly self-binding "Ulysses" directives, rests on a philosophically rich constellation of presuppositions about agency, identity, and authority. Here is a systematic analysis addressing your queries:

  ### 1. Theory of Authority: What Normative Work Does the Past Will Do?
  The practice **privileges the conditions of deliberation over the mere fact of past volition**. It presupposes that:
  - **Epistemic conditions** (calm, informed, undistorted by acute illness) confer **epistemic authority** on the directive. The "well self" is seen as better positioned to evaluate long-term interests, risks, and values than the "episode self," whose judgment is compromised by symptoms (e.g., grandiosity in mania, paranoia in psychosis).
  - **Authenticity** is central: the directive expresses the patient’s "true" values and priorities, unclouded by pathology. The episode-self’s refusal is treated as **inauthentic**—a symptom, not a genuine expression of autonomous will.
  - **Rationality** is implicitly tied to these conditions: the well-self’s deliberation is deemed more rational because it integrates broader consequences and aligns with stable life-narratives.  
  *Crucially, without this privileging of "good conditions," the past act alone would lack moral force against a present competent refusal.*

  ### 2. Personal Good and Identity: Minimal Commitments
  - **Good**: The practice requires only a **moderate idealisation** of interests. It assumes that under *non-pathological* conditions (not full idealisation), the patient can better discern their own good. It does *not* require belief in objective interests or full-information ideal desires—only that pathology *distorts* judgment.  
  - **Identity**: It presupposes **psychological continuity** is sufficient for personal identity. The episode-self is seen as a *debilitated version* of the same person, not a distinct entity. If the episode-self were a "different person," overriding its refusals would be morally impermissible (akin to violating Person B’s autonomy to satisfy Person A’s prior directive).  
  *Minimally, the practice only requires that the core values expressed in wellness persist through episodes, even if obscured.*

  ### 3. Clinician Shaping and the "Benign Interpreter" Problem
  - The practice **presupposes benign clinical influence**: that clinicians facilitate articulation without substituting their own values. This assumes:  
    (a) The clinician acts as a **neutral amplifier** of the patient’s values, not a director.  
    (b) Shared hermeneutic frameworks exist—clinicians can accurately interpret the patient’s values into clinical terms.  
  - **Systematic divergence** between the proxy/clinician and the well-self’s hypothetical judgment **undermines the practice**. If proxies consistently misidentify episodes or impose treatments the well-self would reject, the scheme becomes paternalism disguised as autonomy.  
  *The practice thus relies on a fragile assumption of value-transparency between patient and clinician.*

  ### 4. The Proxy as Unreviewable Judge: Values vs. Behaviour
  Installing an unreviewable proxy presupposes:  
  - That **values are stable** and **behaviour is diagnostic**: the proxy judges not *what* the patient wants (values), but *who she is* (episode-self vs. well-self). Pathological behaviour (e.g., refusing lifesaving meds) is treated as *evidence* of incapacity to embody true values.  
  - **A discontinuity thesis**: There exists a clear threshold where the well-self’s authority "switches off" and the directive activates. This requires symptoms to manifest predictably and recognisably—a contestable empirical claim.  

  ### 5. Periodic Re-signing: Authority as Disposition, Not Fossilised Will
  The re-signing requirement suggests:  
  - **Authority decays without reaffirmation**. This presupposes that the directive’s legitimacy stems from **ongoing endorsement**, not a one-time act. Lapsing directives treat autonomy as a **continuing practice**, not a historical event.  
  - **Value change is possible**: If the patient’s values demonstrably shift *while well*, the practice *should* honour the new directive. A non-lapsing directive would become authoritarian, binding the patient to a rejected past self.  
  *The core presupposition: autonomy is dynamic, and authority resides in the current well-self’s disposition.*

  ### 6. Consistency with Competent Refusal and Asymmetry
  The system **can be coherent** if framed thus:  
  - **Competent contemporaneous refusal is absolute** because it expresses current, undistorted autonomy.  
  - **Advance refusals bind** because they are *negative* (blocking interventions) and preserve bodily integrity.  
  - **Advance requests do not bind** because medicine requires *current* positive justification (e.g., resource constraints, evolving evidence, clinical judgment).  
  - **Ulysses directives are hybrid**: They are advance *refusals of future refusal* ("I refuse my future self’s refusal of treatment"). They bind because they are negative in form and preserve the well-self’s authority over the body.  
  *Incoherence arises only if Ulysses directives are misclassified as positive requests.*

  ### 7. Underdetermination: Competing Philosophical Groundings
  | **Theory**               | **Core Justification**                                     | **Observable Design Differences**                          |
  |--------------------------|------------------------------------------------------------|------------------------------------------------------------|
  | **Precedent Autonomy**   | Past will binds future self (contractarian).               | No re-signing needed; directives permanent "contracts."    |
  | **Idealised Desire**     | Well-self knows true interests (objective good).           | Clinicians could override directives if "better" options emerge. |
  | **Narrative Unity**      | Well-self secures life-story coherence.                    | Proxies prioritise treatments preserving biographical identity. |
  | **Agency Mandate**       | Directive appoints proxy as trustee for incapacitated self. | Proxy could deviate from directive if "best interests" demand. |

  ### 8. Substituting Idealisation with Current Welfare
  A **current-welfare view** (only episode-self’s interests matter) would:  
  - **Eliminate self-binding**: Overriding contemporaneous refusal could only be justified by *others* judging the episode-self’s best interests (standard involuntary treatment).  
  - **Reduce PADs to advisory statements**: Clinicians might consult them but not be bound. The Ulysses element—enforcing past consent against present refusal—collapses.  
  - **Retain minimal elements**: Proxies could *inform* best-interests judgments, but directives would lack authority. The practice survives only as a **weak epistemic aid**, not a normative tool.  

  ### Conclusion
  The practice presupposes a **hierarchical model of selfhood**: the well-self is the normative author, the episode-self a compromised executor. Its stability relies on contestable assumptions—that values are stable, pathology is legible, and clinical interpretation is reliable. When these fray, the practice risks becoming coercive. Yet grounded in *authenticity* and *epistemic privilege*, it offers a sophisticated, if precarious, reconciliation of autonomy with therapeutic necessity.
