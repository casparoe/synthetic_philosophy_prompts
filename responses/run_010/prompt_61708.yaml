  **Detailed Activity: The Rule Factory**

  **Materials:**
  - A large poster paper titled "The Rule Book" and markers.
  - Index cards (optional) for proposing rules.
  - Timer.

  **Roles:**
  - All students are members of the Rule Committee.

  **Timeline:**

  1. **Introduction (5 minutes):**
     - "Today we are going to create a game. The game is about making rules. We will write the rules on this poster, the Rule Book. We start with one rule:"
     - Write on the poster: "Rule 1: The Rule Book must be followed at all times."
     - "The Rule Committee, which is all of us, will make new rules. But remember: the Rule Committee must follow the rules in the Rule Book at all times. Also, the rules can be changed, but only by following the rules."

  2. **Adding the Amendment Rule (5 minutes):**
     - "We need a rule for adding new rules. How can we add a rule without having a rule for adding rules? We are going to have to break Rule 1 temporarily. Let's agree to add a rule for making rules. What should it be?"
     - Guide them to propose: "New rules can be added by a majority vote of the Rule Committee."
     - Vote on it (without having a rule for voting, so breaking Rule 1) and add it as Rule 2.

  3. **Adding a Self-Protecting Rule (5 minutes):**
     - "Now, let's add another rule. I propose: Rule 3 should be: 'This rule cannot be changed.'"
     - They vote (by majority, following Rule 2) and add Rule 3.

  4. **The Conflict (5 minutes):**
     - "Now, let's try to change Rule 3. According to Rule 2, we can change any rule by a majority vote. But Rule 3 says it cannot be changed. What do we do?"
     - Let them discuss. They will see the conflict.

  5. **Rescue Attempt (15 minutes):**
     - "How can we resolve this? We need to change the rules to fix the conflict. But we have to follow the rules to change the rules. Brainstorm solutions and try them out."
     - Possible actions they might take:
       - Try to change Rule 2 to say that Rule 3 is an exception. But to change Rule 2, they need a majority vote (Rule 2). But Rule 3 is still there and unchanged. Then they still cannot change Rule 3.
       - Try to repeal Rule 3 by adding a new rule (Rule 4): "Rule 3 is no longer in effect." Then they vote to add Rule 4. But Rule 3 says it cannot be changed, and repealing is changing? They have no definition of "change". 
       - Try to add a conflict resolution rule: Rule 4: "If two rules conflict, the rule with the higher number wins." Then Rule 4 (if added after Rule 3) would override Rule 3. But Rule 3 says it cannot be changed, and being overridden is a change? They will get stuck in interpretation.
     - The key is that any rule they add to fix the problem becomes part of the system and is subject to the same rules. They cannot get outside the Rule Book.

  6. **Final Wall (5 minutes):**
     - Stop them and say: "It seems we are stuck. Let's discuss what happened."

  **The Loop Moment:**
  From the participants' point of view: They added Rule 3 to protect itself. Then when they try to change it, they are told they can by Rule 2, but Rule 3 says they can't. They feel the conflict because they don't know which rule to follow. Any attempt to write a new rule to resolve it either fails (because the new rule doesn't have the power to override without being challenged) or creates more conflicts.

  **Debrief (10 minutes):**

  1. **Relate to the activity:**
     - "We started by making rules. We had to break the rules to make the first rule (Rule 2) - that was an 'outside' moment. Then we created a rule (Rule 3) that tried to be unchangeable, but then we couldn't change it even when we wanted to. When we tried to fix that, every rule we added became part of the same system and didn't really solve the problem because it was subject to the same rules."

  2. **Introduce the concept:**
     - "This is called a tangled hierarchy or a strange loop. The rules are referring to themselves and to each other in a loop. There's no clear top or bottom."
     - Show Escher's Drawing Hands: "In this picture, each hand is drawing the other into existence. But what is the real source? Where does the pencil first touch the paper? In our activity, when the rules refer to each other in a loop, we lose the foundation."

  3. **The inviolate level:**
     - "In our game, the inviolate level was the initial act of breaking Rule 1 to create Rule 2. That act wasn't governed by any rule in the Rule Book. It was outside. But once we were inside the system, we couldn't refer to that outside act because the rules don't allow it. If we try to write a rule about it, we bring it inside and the tangle returns."

  4. **Map specific moments:**
     - The initial fiat (breaking Rule 1) = the inviolate level.
     - Rule 3 (self-protecting) = a hand trying to draw itself, or a rule that tries to fix its own authority.
     - The conflict between Rule 2 and Rule 3 = the loop in the drawing.

  **Predictable Problems and Solutions:**

  1. **The student who writes a self-undermining sentence immediately:**
     - In the card game version, a student might write "This card is false" (but we said they can't write about their own card). In the rule game, if they try to write a paradoxical rule early, e.g., "This rule can be changed only if it cannot be changed," acknowledge it as a problem and use it to start the discussion earlier. But in the rule game, we are guiding the rules. If they propose such a rule, let them vote and add it, then immediately hit the wall.

  2. **The group plays cautiously and avoids tangles:**
     - That's why we force a tangle by suggesting Rule 3. The teacher should nudge them to create a self-referential rule.

  3. **"This is just word games":**
     - Acknowledge: "Yes, it is built on words and rules. But the same thing happens in mathematics and computer science. When a system tries to describe itself, it can get tangled. This is not just word games; it's a deep structural issue."

  **Strongest Objection from a Bright Student:**
     - "But in the end, we can just scrap the whole Rule Book and start over. Then we avoid the loop."
     - Response: "That's true, but then you are acting from outside the system. The point is that while you are inside the system (playing by the rules), you cannot untangle the loop. The moment you start over, you are no longer in the same system. And in mathematics, we can't just 'scrap' arithmetic and start over because we need it to be consistent and complete for everything else we do."

  **What the Activity Cannot Reproduce:**
     - The activity shows that in a self-referential system, we can have loops that are unresolvable from within. However, it does not show that arithmetic is incomplete. The activity might leave the impression that every system with self-reference is inconsistent, but that's not true. There are consistent self-referential systems (e.g., the Master Card idea worked for breaking the loop in the card game).

  **Clarification in Debrief:**
     - "Note: not every self-referential system is paradoxical. For example, the statement 'This sentence is true' is not paradoxical; it could be true or false. Paradoxes arise in specific conditions. Also, in mathematics, Gödel showed that even without paradoxes, there are true statements that cannot be proven within the system. But that is a deeper point. For now, understand that self-reference can lead to tangles, and resolving them often requires stepping outside, but then that outside level cannot be fully captured inside."

  **Shorter Cut if Needed:**
     - If 45 minutes is tight, reduce the rescue attempt to 10 minutes and debrief to 5 minutes. You lose the depth of the rescue attempt and the full exploration of the dilemma. But the conflict between Rule 2 and Rule 3 will still be clear.

  Final write-up for the chosen activity (Rule Factory) is above.

  Note: We avoided the forbidden words during the activity. In the debrief, we use them to connect.
