answer: |-
  ## Dissertation Proposal: Aggregation Across Description Levels: Rescuing Harsanyi from Granularity

  **1. Research Question (Precise & Answerable):**
  Under what conditions do coherence constraints relating von Neumann-Morgenstern (vNM) utilities defined across a lattice of finite partitions \(\Pi\) of a common outcome space \(\Omega\) guarantee the existence of a *unique*, *linear*, and *level-invariant* social aggregation rule? Specifically:
  *   **Existence:** Does there exist a social vNM utility function \(U_s\) defined on some chosen level of description (e.g., the finest partition), and a set of fixed weights \(\{\alpha_i\}\), such that for *any* partition level \(\pi \in \Pi\), the social preference ordering over lotteries defined *on \(\pi\)* is represented by the linear aggregation \(U_s^\pi = \sum_{i} \alpha_i U_i^\pi\), where \(U_i^\pi\) is agent \(i\)'s vNM utility defined *on \(\pi\)*?
  *   **Uniqueness & Invariance:** If such a rule exists, are the weights \(\{\alpha_i\}\) unique and independent of the specific partition level \(\pi\) used for aggregation?
  *   **Coherence Conditions:** What minimal coherence conditions between an agent's \(U_i^{\pi_k}\) and \(U_i^{\pi_m}\) (for \(\pi_k\) refining \(\pi_m\)) are necessary and sufficient for the above? (e.g., Consistency of preferences under refinement: \(U_i^{\pi_m}(A) = \mathbb{E}[U_i^{\pi_k} | A]\) for \(A \in \pi_m\)).

  **2. Why Existing Frameworks Leave This Open:**
  The core novelty lies in relaxing Harsanyi's fundamental assumption of a *single, shared, primitive outcome space*. Existing interpretations grapple with variations *within* that shared space, not *across* distinct descriptions of it.

  *   **Utilitarian Reading:** Assumes interpersonally comparable cardinal utilities *defined on the same outcomes*. Our question challenges the very definition of "the same outcome" by introducing multiple legitimate descriptions. It asks *if* and *how* aggregation can work *despite* this descriptive divergence, making comparability across agents potentially dependent on descriptive level.
  *   **Ex Ante Pareto Constraint:** Focuses on the implication that social preferences must respect unanimous individual ex ante preferences over lotteries *on the common outcome space*. Our setup dissolves the common space. While Pareto might hold *within* a given partition level \(\pi\), the question is whether a consistent rule exists *across* levels. The ex ante reading doesn't address the invariance requirement under re-description.
  *   **State-Dependent Utility:** Allows utilities to depend on states of the world *within* a fixed outcome/state framework. Our problem involves the *definition of the outcomes themselves* varying (e.g., evaluating "SKU123" vs. "Model X Series"). State-dependence modifies utilities *given* outcomes; our framework questions what constitutes a basic outcome. The coherence conditions across levels represent a different kind of constraint, linking utility assignments across *structurally related* but distinct outcome sets.

  These existing positions presuppose a fixed ontology of outcomes. Our question explicitly rejects this presupposition, exploring aggregation when agents conceptualize the world at different resolutions. The literature largely assumes the descriptive level is fixed *a priori*; we make it a variable.

  **3. Method & Defence Against Alternatives:**
  **Core Method:** Formal axiomatic modelling within the framework of partition lattices and expected utility theory.
  1.  **Define the Structure:** Model \(\Omega\) as a finite state/object space. Define a lattice \(\Pi\) of finite partitions of \(\Omega\) (e.g., SKUs \(\prec\) Product Families \(\prec\) Categories). Define lotteries and vNM utilities for agents and society on *each* partition level \(\pi \in \Pi\).
  2.  **Specify Coherence:** Formulate precise conditions linking agent \(i\)'s \(U_i^{\pi_k}\) and \(U_i^{\pi_m}\) for \(\pi_k\) refining \(\pi_m\) (e.g., the consistency condition above). Explore variations (e.g., requiring coherence only for social aggregation to hold, not necessarily for individual rationality).
  3.  **Axiomatize Aggregation:** Define axioms analogous to Harsanyi (vNM rationality for society, Pareto Indifference, Pareto Preference) applied *within each partition level \(\pi\)*. Add the crucial **Description Invariance Axiom**: The social ordering over any set of alternatives should be identical whether aggregated directly on their native partition level or by first refining/coarsening them to a common level and aggregating there.
  4.  **Derive Representation Theorems:** Investigate under which coherence conditions the axioms imply the existence of a unique, linear, level-invariant social aggregation rule. Prove necessity and sufficiency. Analyze the uniqueness of weights \(\{\alpha_i\}\).
  5.  **Explore Calibration:** Rigorously investigate whether shared sub-alternatives under refinement provide sufficient constraints to pin down interpersonal scale comparisons across agents operating at *different* base levels, potentially resolving the "arbitrary zero/scale" objection.

  **Defence Against Alternatives:**
  *   **Arrow-Style Impossibility:** This approach *does* risk generating an impossibility result under plausible conditions. However, this is philosophically significant. A negative result would demonstrate that Harsanyi aggregation is *fundamentally incompatible* with description variance, revealing a deep, previously unarticulated prerequisite (shared ontology) for utilitarian aggregation. A positive result (identifying necessary/sufficient coherence) would show how to *rescue* aggregation by imposing normative constraints on how agents relate their preferences across levels. Both outcomes yield philosophical insight about the foundations of social choice under conceptual pluralism.
  *   **Empirical Study:** While inspired by real systems, this proposal tackles the *normative* and *conceptual* core. An empirical study could reveal *how* systems handle granularity, but it cannot establish *whether* a theoretically coherent normative aggregation rule *can* exist across levels or what its necessary conditions are. The normative question – "How *should* we aggregate when agents see the world differently?" – is fundamentally philosophical and requires the proposed formal analysis. The engineering context provides the *motivation* and *concrete intuition*, but the *method* is normative theory.

  **4. Work Plan (8 Months, 4 Evenings/Week):**
  *   **Months 1-2: Foundational Rigour:** Deep dive into Harsanyi's theorem (proof, assumptions), vNM theory, and lattice theory (partitions, refinement). Formalize the multi-level outcome space model (\(\Omega\), \(\Pi\), lotteries per \(\pi\)). Precisely define coherence conditions. *Deliverable:* Complete mathematical framework specification.
  *   **Month 3: Axiomatization & Initial Exploration:** Formulate Description Invariance axiom and standard Harsanyi axioms per level. Explore simple cases (2 agents, 2 partition levels, small \(\Omega\)). Attempt preliminary existence/uniqueness proofs under strong coherence. *Deliverable:* Draft axiomatic system & initial lemmas.
  *   **Months 4-5: Core Analysis:** Systematically analyze the impact of varying coherence conditions on the existence and uniqueness of a linear aggregation rule. Prove key theorems: 1) Necessity of specific coherence for existence. 2) Sufficiency of coherence (plus axioms) for existence. 3) Conditions for weight uniqueness/invariance. Explore the calibration hypothesis formally. *Deliverable:* Core mathematical results established.
  *   **Month 6: Philosophical Integration:** Interpret mathematical results philosophically. Analyze implications for: the "arbitrary zero/scale" objection, the normative status of description invariance, the possibility of interpersonal comparison via shared refinement. Contrast with existing literature positions. *Deliverable:* Draft philosophical analysis chapter.
  *   **Month 7: Edge Cases & Robustness:** Test the model against edge cases (e.g., conflicting coherence, degenerate partitions). Explore sensitivity to variations in axioms (e.g., weaker Pareto). Consider generalizations (e.g., infinite \(\Omega\) using real analysis, though avoiding measure theory). *Deliverable:* Refined model & analysis, addressing limitations.
  *   **Month 8: Synthesis & Writing:** Integrate formal and philosophical arguments. Finalize thesis structure and narrative. Complete full dissertation draft (3500 words). *Deliverable:* Complete Dissertation Draft.

  **5. Success & Failure Criteria:**
  *   **Success:**
      1.  **Formal:** Identification of necessary and sufficient coherence conditions for the existence (or impossibility) of a unique, linear, level-invariant Harsanyi aggregation rule across a partition lattice. Clear characterization of weight uniqueness/dependence.
      2.  **Philosophical:** A cogent argument based on the formal results that either:
          *   Vindicates the "arbitrary zero/scale" objection by showing weights *must* shift with level (absent strong coherence), *or*
          *   Neutralizes it by showing refinement provides natural calibration fixing scales, *or*
          *   Establishes Description Invariance as a novel, substantive, and non-trivial normative requirement for coherent social choice under conceptual pluralism.
      3.  **Contribution:** A demonstrable advance in understanding the preconditions and limitations of Harsanyi aggregation, specifically addressing the role of outcome space definition.
  *   **Failure:**
      1.  **Formal Collapse:** The model proves trivially impossible under almost any coherence, or conversely, trivially possible only under unrealistically strong (e.g., dictatorial) coherence conditions, offering no new insight.
      2.  **Mathematical Intractability:** The problem requires measure theory or advanced functional analysis beyond the stated limits, preventing rigorous solution with available tools.
      3.  **Philosophical Insignificance:** The results, while technically correct, fail to engage meaningfully with the core philosophical debates (e.g., utilitarianism, comparability, normative requirements) or merely restate known points within a more complex framework. The connection to the motivating engineering problem feels strained or irrelevant.

  **6. Scope & Candid Assessment:**
  *   **Scope:** Carefully constrained. Finite \(\Omega\), finite lattice \(\Pi\), finite partitions. vNM utilities only. Focus on linear aggregation. Axioms based on core Harsanyi conditions plus Description Invariance. Mathematics limited to linear algebra (for aggregation forms), probability (expectations over discrete spaces), real analysis (for continuity/representation theorems in utility construction), and lattice/order theory (for partition structure). *Avoids:* Measure theory, infinite state spaces, non-expected utility, non-linear aggregation, complex game theory, empirical validation.
  *   **Assessment:**
      *   **Not Settled:** The specific question of Harsanyi aggregation across a *lattice of descriptions* with constrained coherence is, to the best of my knowledge, unexplored. While state-dependent utility and multi-level decision-making exist, they don't combine with the Harsanyi axioms and the explicit Description Invariance requirement in this way.
      *   **Not Purely Technical:** The philosophical stakes are genuine and significant. It directly challenges a fundamental assumption (shared primitive outcomes) underpinning a major theorem in social choice and welfare economics. The results will speak directly to debates about the foundations of utilitarianism, the nature of interpersonal comparison, the objectivity of social welfare, and the normative force of invariance principles. The engineering context provides a concrete, non-trivial instance of the abstract problem, demonstrating its practical relevance, but the core inquiry is philosophical: *What are the preconditions for coherently aggregating diverse perspectives on a common world?*
      *   **Challenge:** The primary risk is **mathematical overreach**. While the initial setup is within scope, proving non-trivial representation theorems can become complex. The defence hinges on rigorously staying within the defined bounds (finite, discrete) and leveraging the structure of partitions and coherence conditions. The philosophical payoff justifies navigating this edge. The second risk is **philosophical drift**; the technical analysis must remain tightly coupled to the core normative questions.

  This proposal bridges a concrete engineering challenge with a foundational problem in social philosophy. By rigorously investigating the limits of Harsanyi aggregation when agents describe the world at different grains, it promises insights into both the formal structure of social choice and the normative demands of pluralistic evaluation.
