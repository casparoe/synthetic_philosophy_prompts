prompt: |-
  I am preparing a graduate pragmatics seminar on the status of the Cooperative Principle, and I need a purpose-built case rather than another textbook illustration. Please construct a thought experiment to the following specification.

  **Purpose.** The case is meant to press a question about what kind of posit the Cooperative Principle is: a psychological one, concerning what the speaker intends her hearer to recover, or a normative and attributive one, concerning what a speaker who has chosen these words in these circumstances can be held to have meant. A case that settles this by fiat — by reporting the speaker's intentions in the setup, or by having a character announce the implicated content — fails however vivid it is. The implicature must be generated by the machinery, not stipulated.

  **Specification.** Build a single exchange with all of the following properties:

  (a) It occurs inside an institution whose official purpose is the exchange of information — a deposition, an audit interview, a regulatory inspection, a disciplinary hearing — so that it is not a game, a market negotiation, or any setting where the parties have agreed in advance that nothing is owed.

  (b) One participant has openly, and with mutual knowledge, opted out of being informative: she has announced, or is operating under a publicly known standing instruction, that she will answer only what is asked, volunteer nothing, and correct nothing. Both parties know this, and know that the other knows it.

  (c) She says only what she believes to be true. No lying, no misleading by assertion, no equivocation on the literal content of her words; the maxim of Quality is not the lever.

  (d) She has no intention whatever regarding the content the hearer goes on to recover. She is not insinuating, not managing an impression, not preserving deniability for later use; she is mechanically discharging a rule in which she has no personal stake. The absence of that intention must be visible in the setup rather than asserted.

  (e) The hearer nonetheless arrives at a specific, determinate proposition — not a vague sense that something is being withheld, but a content she would afterwards report as what the other party was implying, and would be prepared to act on.

  (f) That content is false, or at any rate unsupported: the minimal answer had an innocent explanation.

  **Deliverables,** in this order:

  1. The scenario: one paragraph of about 150 words, including the question asked and the answer given, plus enough of the institutional setting for (b) and (d) to be independently visible.

  2. The derivation. Write out the hearer's reasoning step by step in the standard Gricean recipe — the presumed observance of the principle and the maxims, the apparent shortfall in the contribution, the background assumption required to repair it, the conclusion — and mark exactly the step at which the recipe runs out of licensed premises given (b).

  3. The diagnostics. Apply Grice's characteristic marks of conversational implicature (cancellability, nondetachability from the form of words, calculability, nonconventionality, indeterminacy) to the recovered content, with a verdict and a one-line reason for each. Flag any test that comes out differently here than it would in an ordinary scalar or flouting case, and say why.

  4. The two readings. State what the case amounts to on the psychological reading and on the normative reading, which you think it favors, and what turns on the choice — including whether the principle's own relativization to the accepted purpose or direction of the talk exchange settles the matter, and if so at which level that purpose is to be read: the institution's, or the individual participant's adopted strategy.

  5. The repair. Show how an account that presumes only that the utterance is worth the hearer's processing effort, rather than that the speaker is being cooperative, handles the same exchange: does it derive the same content, a different one, or none?

  6. The load-bearing feature. Identify the single feature of the case doing the work, and say what happens when it is removed — in particular, what the case collapses into if the public opt-out in (b) is deleted, or if the speaker in (d) is given the insinuating intention she lacks.

  7. The defense. Give the strongest response available to someone who wants to keep the case inside a Gricean framework, including the option of saying that what the hearer has is not an implicature but strategic reasoning about a rule-follower, and state what that response costs.

  No citations, bibliography, or reading list; I want the argument, not the references. Roughly 900 words in total, with the scenario kept short and the analysis doing the work.
reasoning: |-
  Hmm, the user is preparing a graduate pragmatics seminar on the Cooperative Principle and needs a thought experiment that challenges its status. They've provided very specific requirements for this case study. Let me unpack this carefully.

  The core tension they want to explore is whether the Cooperative Principle is psychological (about speaker intentions) or normative (about what speakers can be held accountable for). The case must avoid stipulating intentions or implicatures - they need to emerge organically from the setup. 

  Looking at the specifications:
  - Institutional setting with information-exchange purpose (a deposition or hearing)
  - Speaker has openly opted out of being informative
  - Speaker tells truth but volunteers nothing
  - Speaker has zero communicative intentions
  - Hearer still infers a specific false proposition
  - All while avoiding Quality maxim violations

  This is tricky! The institutional frame is crucial - it creates normative expectations despite the opt-out. For (d), I'm considering making the speaker a bored functionary mechanically following rules. The false implicature could arise from an "innocent" minimal answer that happens to fit a guilty pattern.

  For the derivation, I'll need to show where Gricean reasoning breaks down. The hearer would normally assume cooperativity, but the opt-out explicitly blocks this. Yet they still calculate an implicature because the institutional context overrides the opt-out at a normative level.

  The diagnostics will be revealing - cancellability should fail here since the speaker never intended to communicate anything. Nondetachability might hold, but calculability becomes problematic without cooperativity. This contrasts sharply with standard cases.

  The two readings present the dilemma clearly: psychologically there's no implicature, but normatively the institution holds the speaker accountable. I think the case favors the normative view because the context forces attribution regardless of intention.

  For the repair, relevance theory might handle this better through effort/reward balance without cooperativity. The institutional setting makes the minimal answer "relevant" by its very insufficiency.

  The load-bearing feature is clearly the public opt-out within an information-seeking institution. Remove that and it collapses into standard flouting; add intention and it becomes insinuation.

  The strongest Gricean defense would be to treat this as institutional implicature derived from role obligations rather than psychology. But this costs the theory its psychological foundations.

  This case should spark good seminar debate about whether meaning is in the mind or in the social contract.
answer: |-
  ### Scenario
  During a corporate compliance audit, Auditor Chen questions Procurement Officer Davies about vendor selection. Davies operates under a publicly documented "minimal response protocol" requiring strict adherence to literal interpretations without elaboration or correction, a policy both parties acknowledge. Chen asks: "Was Vendor A's bid evaluated by the committee before the deadline?" Davies knows Vendor A's bid was reviewed *after* the deadline but approved under emergency provisions; he also knows Vendor B's bid was rejected pre-deadline for technicalities. He answers truthfully: "Vendor B's bid was not evaluated by the committee before the deadline." Chen concludes Davies implied Vendor A *was* evaluated on time, though Davies merely stated a fact about Vendor B with no intent to guide Chen’s inference.

  ---

  ### Derivation
  1. **Presumed observance**: Chen assumes Davies follows the Cooperative Principle (CP), including Relation and Quantity.  
  2. **Apparent shortfall**: The answer names Vendor B, not Vendor A (Relation breach?), and omits Vendor A’s status (Quantity breach?).  
  3. **Repair attempt**: Chen assumes Davies *is* cooperative, so mentioning Vendor B must relate to Vendor A. Background: Vendors A/B were the only candidates; if B wasn’t evaluated pre-deadline, A likely was (Quantity).  
  4. **Conclusion**: Davies implicated "Vendor A was evaluated pre-deadline."  
  **Breakdown**: Step 1 fails. Davies’ public opt-out (specification b) suspends the CP; Chen has no license to presume cooperativity. The repair relies on an assumption (cooperation) explicitly voided by the context.

  ---

  ### Diagnostics  
  - **Cancellability**: *No*. Davies cannot add "but I’m not implying anything about Vendor A" without violating his protocol. *(Differs from flouting: cancellability blocked by institutional rules, not speaker choice.)*  
  - **Nondetachability**: *Yes*. Equivalent truthful statements ("Vendor B failed pre-deadline review") yield the same inference.  
  - **Calculability**: *Conditionally*. Chen *can* calculate it *if* ignoring the opt-out, but the derivation is illegitimate per (b).  
  - **Nonconventionality**: *Yes*. The implication isn’t tied to "Vendor B" lexically.  
  - **Indeterminacy**: *No*. The implication is specific ("Vendor A was compliant"). *(Differs from scalar implicature: context forces one salient inference.)*  

  ---

  ### Two Readings  
  - **Psychological reading**: No implicature exists. Davies lacks intent (d); Chen’s inference is a mistake.  
  - **Normative reading**: Davies *can be held to* the implication. The institutional purpose (a) overrides his opt-out (b), making him accountable for foreseeable inferences.  
  **Verdict**: Favors normative. The CP’s purpose is relativized to the *institution’s* goal (information exchange), not the *speaker’s* strategy (minimal compliance). The institution’s norms license attributing meaning irrespective of intent. What turns on this: whether auditors can sanction Davies for "misleading" without intent.

  ---

  ### Repair (Relevance-Theoretic Approach)  
  Relevance theory (presuming optimal processing effort/reward) handles this without CP:  
  - Chen expends effort parsing "Vendor B." In an audit, *not* mentioning Vendor A when asked about it is maximally relevant *only* if A’s status differs from B’s.  
  - Effort/reward ratio suggests Davies communicated A’s compliance.  
  **Outcome**: Same content ("Vendor A was compliant") is derived via cognitive efficiency, not cooperation.

  ---

  ### Load-Bearing Feature  
  The **public opt-out within an information-mandated institution** (a+b) is crucial.  
  - **Remove (b)** (no opt-out): Collapses into standard flouting; Davies is uncooperative but CP applies.  
  - **Add intention to (d)**: Becomes insinuation; psychological implicature returns.  

  ---

  ### Defense for Griceanism  
  **Strongest response**: Treat this as an "institutional implicature" derived from role-based obligations, not individual cooperativity. Davies’ role mandates providing audit-relevant information; his utterance breaches this duty, triggering implicature via institutional norms.  
  **Cost**: Abandons Grice’s psychological foundation (intention-based meaning) for a social-normative one. The CP becomes a heuristic for institutional accountability, not a cognitive mechanism.  

