  First, the failure mode. Gibbon's "yielded to the pressure of its own weight" after removal of "artificial supports" clearly describes structural failure from lost redundancy, not acute overload. The empire always carried inherent strain; prosperity cultivated decay's seeds ("principle" as animating force, like in "principle of the republic"). "Causes multiplied" likely means independent failure points increased with conquest scale—more frontiers, cultures, logistical chains—not necessarily new interdependencies.

  Terminology nuances matter. "Immoderate" implies lack of restraint (moral dimension) alongside physical size. "Artificial supports" are human constructs: military discipline, frontier defenses, political institutions. "Partial institutions of Constantine" refers to his restructuring that privileged some units (like palatine troops), fragmenting military cohesion. The legion's two-stage betrayal—first republic's freedom (e.g., Sulla's march on Rome), then imperial dignity (soldier-emperors)—shows progressive militarization.

  The argument's tension between inevitability and agency is deliberate. Gibbon sees structural decay as inexorable but accelerated by choices: emperors "basely" corrupting discipline, favorites betraying Rome. Christianity (omitted here) operates differently—eroding civic virtue over centuries, whereas military/political failures are proximate causes.

  On continuity vs. collapse: Gibbon's "divided rather than removed" acknowledges Constantinople's endurance but his "ruin," "deluge," and "crushed fabric" metaphors affirm Western collapse. The barbarian "deluge" exploits existing fragility; it's the catalyst, not primary cause.

  Your maintenance-versus-overload distinction is perceptive but slightly modernizes Gibbon. He emphasizes lost supports (maintenance) over excessive load, though conquest scale ("immoderate greatness") enables both. His model is biomorphic: growth contains decay's seed, requiring artificial life support. When that frays, the structure implodes. Not your fault—systems thinking naturally seeks these parallels, but Gibbon blends mechanical and organic metaphors within 18th-century philosophical history.
