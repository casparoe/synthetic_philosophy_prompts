prompt: |-
  You're going to play a political philosopher who's also spent a few years inside a tax administration office, so you're comfortable with both the theory and the boring paperwork side. Think carefully before answering — I'd actually like you to start with a short brainstorm section where you list the candidate theories that could underwrite what I'm about to describe (jot down 4-6, one line each, with a note on which parts of the practice each one explains and which it leaves hanging), and only then give me the worked answer.

  Here's the situation. I work in a municipal revenue office, and I've been drafting guidance for a pilot program the city is running. The pilot is a care ledger: any resident who does an hour of care work for another resident — grocery runs, sitting with an elderly neighbour, driving someone to dialysis — gets one credit posted to their account, and credits are transferable and can be spent on the same kinds of help from anyone else in the scheme. One hour, one credit, no matter who you are or what the task was worth on the market.

  The draft guidance I wrote does four things, and I can't tell whether they hang together:

  1. credits are treated as taxable income at the point they're posted to your account, valued at what that hour of service would have cost you to buy commercially;
  2. identical hours spent caring for your own kids or your own mother produce nothing at all — not income, not a deduction, not a record;
  3. participants who bank more than 100 credits a year get a small abatement off their property tax bill;
  4. if you donate credits into the city's pooled fund, which spends them on people who can't reciprocate, that counts as a charitable gift and is deductible.

  For background, the national rules we're mirroring already tax barter — if I fix your roof and you paint my kitchen, both of us are supposed to declare the going rate of what we received — but of course nobody declares the value of mowing their own lawn or cooking their own dinner, and the imputed rent of owning your own home goes untaxed too.

  So. What is this patchwork committed to? What does it assume about what income is, about when value comes into existence, and about who has a claim on the product of an hour of somebody's labour? The barter rule and my clause 1 both seem to say that an obligation springs up the moment two people deal at arm's length and something gets written down, but that the exact same exertion inside a household is philosophically invisible — is that a claim about markets, about enforceable reciprocity, about the existence of a record, or just about administrative tractability? And how do clauses 3 and 4 sit with 1 — is there a story on which the city both taxes the credits and pays you for earning them, or is one of those incoherent given the other?

  Then I want the harder bit: separate out what the practice *strictly* needs from what it merely happens to fit well with, and mark the places where it's genuinely underdetermined, where two or three incompatible theories would license the same forms. And run the counterfactuals — what would the guidance have to look like if we adopted (i) the view that an hour of care creates value whether or not anyone swaps it or writes it down, versus (ii) the view a colleague of mine holds, that the state has no claim on people's holdings in the first place and every one of these clauses is just a dressed-up taking? He says my clause 1 proves his point, since the government is reaching into a favour between two neighbours and demanding a cut. Tell me whether he's actually right about that, or whether he's reading the practice with a theory it doesn't require.

  No need for citations or a reading list — I want your reconstruction, not references. Do flag anywhere you think I've garbled the legal setup, since I'm not a lawyer.
