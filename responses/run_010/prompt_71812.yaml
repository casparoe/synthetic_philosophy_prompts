prompt: |-
  I lead the appraisal function at a national infrastructure agency. We assess roughly thirty investment proposals a year, with turnaround expectations of about ten working days from receipt to recommendation, and my team is composed of transport economists, hydrologists, and financial analysts — competent with spreadsheets, largely untrained in welfare economics or intergenerational ethics. For the past decade we have applied a flat real discount rate to everything, drawn from a legacy template that offers three rates (3.5%, 5%, and 7%) and instructs the analyst to present all three, with the unwritten convention that the headline figure is the one under which the proposal survives. That practice has now become untenable. Our board has adopted two new requirements: for any scheme whose service life, containment obligation, or benefit stream extends beyond a hundred years, we must state and defend the rate or rates applied to the long tail rather than extrapolating the headline figure; and no scheme may be rejected on the sole ground that its benefits fall beyond year 250. The board has also added a cross-generational incidence statement to the standard template, requiring us to report what share of a proposal's discounted net benefit accrues to people who will not be born for at least a century. A chief economist signs off on my numbers before they go to a sub-committee, and the sub-committee is increasingly asking questions my analysts cannot currently answer.

  What I need is a written decision procedure my staff can actually execute — an ordered list of questions, each with a statement of what counts as a sufficient answer, a default to fall back on when the answer is unavailable, and an explicit marker wherever the procedure is really handing a choice to a person because the issue is one of values rather than of fact. It should be grounded in whatever the theory of social discounting genuinely licenses: the Ramsey-style decomposition of a social rate into a pure time-preference term, an elasticity of marginal utility, and an expected growth rate in consumption; the unresolved dispute over whether the pure time-preference term is an ethical parameter to be set normatively or an empirical one to be read off observed behaviour; the treatment of uncertainty in future growth such that effective rates decline as the horizon lengthens; the distinction between discounting money, consumption-equivalents, and utility, and the error of applying one where another is required; the relative-price problem when the thing being valued (avoided flood damage, lost habitat, containment failure) does not grow at the same rate as consumption; and the opportunity-cost objection that a social rate is disciplined by the returns available on displaced private capital. I want the procedure to say plainly where an analyst is entitled to stop with the agency default, where a sensitivity band must be reported instead of a point estimate, and where the matter escalates to me or to the chief economist because no amount of further analysis will settle it. It must also handle the case where expected growth simply cannot be estimated over three centuries, and it must state its own failure modes: which steps are judgment calls wearing procedural clothing, what the procedure can be made to produce by a motivated analyst, and what it is structurally incapable of deciding at all. Please include a short justification template — the paragraph an analyst writes to accompany a recommended rate — with the slots the paragraph must fill. I would like names invoked only where a name is doing actual work in a step of the procedure; I do not want a bibliography, a reading list, or any suggestion of sources to consult, since my team will not consult them.

  Finally, run the procedure end to end on three live files, showing the numbers you use at each step rather than only the conclusion. First: a deep geological repository for intermediate-level waste, with capital and construction costs concentrated over fifteen years, a containment obligation running indefinitely, and a small non-zero probability of a release reaching the biosphere between 500 and 2,000 years hence. Second: a tidal defence scheme with an eighty-year design life, recurring maintenance, and benefits that rise with the income of the city it protects. Third: a peatland and coastal wetland restoration programme whose costs are entirely near-term and whose measurable carbon and biodiversity benefits are, on our own modelling, almost entirely post-year-250. For the third case I want the procedure's honest output even if it is a rejection, and even if the rejection turns out to conflict with the board's rule that a scheme cannot be rejected solely because its benefits lie beyond year 250 — my suspicion is that the arithmetic and the new floor will collide, and I would rather learn from you exactly where and why they collide, and which of the two the procedure should treat as binding, before the sub-committee discovers it on its own.
reasoning: |-
  We are designing a decision procedure for social discounting that addresses long time horizons, intergenerational equity, and uncertainty. The procedure must be executable by analysts with limited training in welfare economics. It will have clear steps, defaults, sensitivity ranges, and escalation points. The procedure must handle cases beyond 100 years and up to 250 years and beyond, with special attention to the cross-generational incidence.

  Key principles from the query:
  1. For projects with impacts beyond 100 years, we must defend the long-term discount rate(s) and not just extrapolate the short-term rate.
  2. No project can be rejected solely because benefits fall beyond year 250.
  3. We must report the share of discounted net benefits accruing to people born at least 100 years from now.

  Theoretical foundations:
  - The Ramsey rule: r = δ + η * g
    where:
      r = social discount rate (SDR)
      δ = pure rate of time preference (PRTP)
      η = elasticity of marginal utility of consumption (a measure of inequality aversion)
      g = expected growth rate of per capita consumption

  - The PRTP (δ) can be seen as normative (ethical) or positive (empirical). We need to allow for both.
  - Uncertainty in growth (g) can lead to declining discount rates over time.
  - We must distinguish between discounting money, consumption, and utility. The Ramsey rule is for utility, but we often discount consumption. The relative price problem arises when the good being valued does not grow at the same rate as consumption.

  - Opportunity cost: The SDR should reflect the opportunity cost of capital (the return on displaced private investment). This is an alternative approach.

  Procedure Structure:

  We break the procedure into two main parts:
  A. For the short-term (up to 100 years): use the agency's current practice (with the three rates) but with a clear default for the headline rate (we'll set one as the default for consistency, unless there's a reason to deviate).
  B. For the long-term (beyond 100 years): we need a separate procedure.

  However, the board requires that for any project with impacts beyond 100 years, we must state and defend the long-term rate. So the procedure must:

  1. Determine if the project has impacts beyond 100 years (service life, containment obligation, or benefit stream). If yes, then we must use a long-term discounting approach for the tail.

  The procedure for the long-term:

  We will use a declining discount rate (DDR) scheme. The DDR can be justified by uncertainty in future growth (g) or by ethical considerations for the distant future.

  We will build the DDR using the following steps:

  Step 1: Determine the base short-term rate for the first 100 years.
     - We'll use the agency's current practice but choose one of the three rates (3.5%, 5%, 7%) as the base. We need a rule for choosing the base.
     - Since the current practice is to present all three and use the one under which the proposal survives, we must change that. We need a default base rate for the short term.

     Proposal: For the short term (up to 100 years), use 3.5% as the default base rate. Why? Because it is the lowest and most conservative (gives more weight to the future) and is in line with many guidelines (e.g., UK Green Book). However, if the project is in a sector with high opportunity cost of capital (like private sector displacement), we might use a higher rate. But since our analysts are not trained, we need a simple rule.

     Alternatively, we can use the middle rate (5%) as the default. But the board is concerned about intergenerational equity, so a lower rate might be more appropriate for long-term projects.

     We'll set the default base rate at 3.5% for the first 100 years. However, we must also consider the opportunity cost. We'll have an escalation step if there is a reason to use a higher base rate.

     Step 1.1: Is the project primarily displacing private investment? (This is a judgment call, so we mark it as a value choice and escalate if uncertain.)
        - If yes, then use 5% for the base rate (as a compromise between the lower and higher rates, representing a higher opportunity cost).
        - If no, use 3.5%.

     Step 1.2: If there is no clear evidence about displacement of private investment, default to 3.5%.

  Step 2: For the long-term (beyond 100 years), we build a DDR schedule.

     We will use a model that declines from the base rate (determined in Step 1) to a long-term rate. The long-term rate is built from the Ramsey formula but with adjustments for uncertainty.

     The long-term rate (asymptotic rate) is given by: r_∞ = δ + η * g_∞ - 0.5 * η^2 * σ^2
     where σ^2 is the variance of the growth rate (to account for uncertainty).

     However, we may not have estimates of σ. So we need defaults.

     Step 2.1: Determine the pure rate of time preference (δ). This is an ethical parameter. We set it normatively.
        - Default: δ = 0.1% (per year). This is a common normative choice (e.g., Stern used 0.1%).
        - Justification: We care about future generations, so δ should be very low. But not zero? (Because zero can lead to paradoxes and infinite weights.) We set 0.1% as the default.

        However, if the analyst has a reason to use a different δ (e.g., board guidance), they can. But without guidance, use 0.1%. This is a value choice, so we mark it as such.

     Step 2.2: Determine the elasticity of marginal utility (η).
        - Default: η = 1.0 (a common choice, e.g., logarithmic utility).
        - This is a value choice. We set 1.0 as default.

     Step 2.3: Determine the long-term expected growth rate (g_∞).
        - This is difficult. We cannot know growth rates for 300 years. We use a default.
        - Default: g_∞ = 1.0% per year (a conservative estimate for the very long run, considering potential stagnation or decline).

        But note: the base short-term rate was set using a growth rate (implicitly) that might be higher. We are not using the same growth rate for the long term.

        We must also account for uncertainty in growth. We need an estimate of the variance (σ^2). Without data, we set a default.

     Step 2.4: Determine the variance of growth (σ^2).
        - Default: σ^2 = (0.02)^2 = 0.0004 (i.e., 2% standard deviation, which is based on historical data for developed countries). But note: over the very long term, uncertainty compounds.

        Then the asymptotic long-term rate = δ + η * g_∞ - 0.5 * η^2 * σ^2

        Example with defaults: 
          δ = 0.001, η=1, g_∞=0.01, σ^2=0.0004
          r_∞ = 0.001 + 1*0.01 - 0.5*1*1*0.0004 = 0.011 - 0.0002 = 0.0108 (or 1.08%)

     Step 2.5: Build the DDR schedule. We need a formula that declines from the base rate (for year 100) to the asymptotic rate (r_∞). We use the following model (from Weitzman or Gollier):

        One common method is the exponential decline:

          r(t) = r_∞ + (r_0 - r_∞) * exp(-a*t)

        But we are already using a base rate for the first 100 years. We need to define the rate for each future time t (with t=0 being now). However, our base rate is applied for the first 100 years. We are now defining the rate for the tail (beyond 100). We can model the discount rate for cash flows at time t (t>100) as being constant at the asymptotic rate? But that might be too abrupt.

        Alternatively, we can model the entire schedule from t=0 to t=infinity with a DDR. But we have to integrate with the short-term practice.

        We can do:

          For t <= 100: use the base rate (constant) from Step 1.
          For t > 100: use the asymptotic rate (constant) from Step 2.4.

        However, the board wants a defense for the long tail. We can justify that the uncertainty about the very long run leads us to use the asymptotic rate for t>100.

        But note: the literature (e.g., UK Green Book) often uses a step-down: 3.5% for years 0-30, 3.0% for 31-75, 2.5% for 76-125, 2.0% for 126-200, 1.5% for 201-300, and 1.0% thereafter. We can adapt a similar step function.

        However, our board requires beyond 100 years. We can do:

          Years 0-100: base rate (from Step 1, either 3.5% or 5%)
          Years 101-200: 2.0%
          Years 201-300: 1.5%
          Years 301+: 1.0%

        But we need to defend these numbers. Alternatively, we can use the Ramsey-based asymptotic rate and then set:

          Years 0-100: base rate (r0)
          Years 101-250: a declining schedule? 

        Given the complexity, we simplify:

          We set two periods for discounting:
            Period 1: 0-100 years: base rate (r0)
            Period 2: beyond 100 years: long-term rate (r∞) as calculated in Step 2.4 (with defaults)

        But then the discount factor for a cash flow at time t>100 is: 
            DF(t) = DF(100) * exp(-r∞*(t-100))

        This is a constant rate after 100.

        However, we must also account for the fact that the base rate for the first 100 years might be inconsistent with the long-term rate. We are okay because we are defending the long-term rate separately.

  Step 3: Calculate the cross-generational incidence.

     We need to compute the share of discounted net benefits that accrue to people born at least 100 years from now.

     Let:
        t0 = 100 years from now (so benefits from t>=100 are for those not born yet at the time of the decision)

     We compute:
        Total discounted net benefits (NPV) = Σ [B(t) - C(t)] * DF(t) for t=0 to T
        Discounted net benefits for t>=100: NPV_long = Σ [B(t) - C(t)] * DF(t) for t=100 to T

        Then share = NPV_long / NPV   (if NPV>0; if NPV<0, we report the absolute share and note the negative overall NPV)

     But note: the board requires the share for people who will not be born for at least a century. We assume that benefits at time t accrue to people alive at t. So if t>=100, then the beneficiaries are born at least 100 years from now.

  Step 4: Handling uncertainty and sensitivity.

     We must report a sensitivity band for the discount rate when there is uncertainty in the parameters.

     Steps that are judgment calls (value choices) should be tested with alternative values.

     We will require sensitivity analysis for:
        - The base rate (if we used 3.5%, also test 5% and 7% for the entire period? But note: the long-term part is set separately. So we do two layers: sensitivity on the base rate and sensitivity on the long-term rate parameters).

     Specifically, we will require:
        - The analyst must report the results using the default parameters (as above) and also using two alternative scenarios for the long-term discounting:

          Alternative 1: Higher long-term discounting
            - Set δ = 0.5% (instead of 0.1%)
            - Set η = 1.5 (instead of 1.0)
            - Set g_∞ = 1.5% (instead of 1.0%)
            - Then recalculate r_∞ and the NPV, and the share.

          Alternative 2: Lower long-term discounting
            - Set δ = 0% (if allowed, but note the board's rule that we cannot reject solely because benefits beyond 250, so we must be cautious)
            - Set η = 0.5
            - Set g_∞ = 0.5%
            - Then recalculate.

        But note: the board rule: we cannot reject solely because benefits fall beyond 250. So if the project fails under the default but passes under one of the sensitivity scenarios, we must not reject solely for that reason? Actually, the rule says "no scheme may be rejected on the sole ground that its benefits fall beyond year 250". So if the NPV is negative even when we count benefits beyond 250, but if without the benefits beyond 250 it would be positive, then we cannot reject solely because the benefits beyond 250 are not counted? Actually, the rule is ambiguous. We interpret: we must not reject a project just because it has benefits beyond 250 and we discount them heavily. We must consider the whole stream. But if the project is negative overall, we can reject.

        The procedure must also state that if the NPV is negative under the default but positive under one of the sensitivity scenarios, then the analyst must flag that the decision is sensitive to the discounting assumptions and escalate to the chief economist.

  Step 5: Escalation triggers.

     The procedure must include explicit markers for value choices and escalation points.

     Escalation to the team lead (you) or the chief economist is required when:

     a) The choice of base rate (Step 1.1) is unclear (e.g., uncertainty about displacement of private investment).
     b) Any deviation from the default parameters in Steps 2.1, 2.2, 2.3, 2.4 is proposed (because these are value choices or require expert judgment).
     c) The project's NPV is negative under the default discounting scenario but positive under one of the sensitivity scenarios (or vice versa) and the difference is material.
     d) The project has significant impacts beyond 250 years and the asymptotic rate is critical to the decision (especially if the NPV is close to zero).
     e) The cross-generational incidence statement shows that a very high share of the net benefits accrue to the distant future (say, >50%) and the NPV is positive but small, so that the decision is ethically sensitive.

  Step 6: The justification template.

     For the recommended rate (the default scenario), the analyst writes:

        "The discount rate for the first 100 years is set at [X]%, based on [reason: e.g., the default base rate for public projects not displacing private investment]. For the period beyond 100 years, a long-term discount rate of [Y]% is applied. This long-term rate is derived from the Ramsey formula, with a pure rate of time preference of [δ]%, an elasticity of marginal utility of [η], and a long-term expected growth rate of [g_∞]%, adjusted for uncertainty. This yields an asymptotic rate of [r_∞]%. The share of discounted net benefits accruing to individuals born at least 100 years from now is [Z]%."

     For the sensitivity analysis, the analyst adds:

        "Under a higher discounting scenario (with δ=[δ_high], η=[η_high], g_∞=[g_high]), the long-term rate becomes [r_high]% and the NPV changes to [NPV_high]. Under a lower discounting scenario (with δ=[δ_low], η=[η_low], g_∞=[g_low]), the long-term rate becomes [r_low]% and the NPV changes to [NPV_low]. The project [is/is not] robust to these variations."

  Step 7: Failure modes.

     The procedure must state its own limitations:

     - The choice of δ, η, and g_∞ are value judgments and not facts. The defaults are set based on common practices but can be challenged.
     - The procedure does not resolve the ethical debate about intergenerational equity. It only makes it explicit.
     - The procedure cannot predict the very long-term growth rate (g_∞) with any accuracy. The default is a conservative guess.
     - The procedure assumes that the long-term rate is constant after 100 years, but it might decline further. We do not model a continuous decline beyond 100 for simplicity.
     - The procedure does not account for catastrophic risks (e.g., extinction events) that might make the future beyond a certain point irrelevant. This would require a separate adjustment.

     What the procedure can be made to produce by a motivated analyst:

        - By choosing alternative parameters in the sensitivity analysis, the analyst can make the NPV appear positive or negative. Therefore, the default parameters and the sensitivity ranges must be fixed by the agency (and not chosen by the analyst).

     What it is structurally incapable of deciding:

        - The procedure cannot determine the "correct" values for δ and η. These are ethical parameters that must be set by society (the board or government).
        - It cannot resolve deep uncertainty about the very long-term future (beyond 300 years). The discounting becomes speculative.

  Now, we apply the procedure to the three cases.

  Case 1: Deep geological repository for intermediate-level waste

     - Costs: concentrated over 15 years.
     - Containment obligation: indefinitely (so beyond 100 years, and a small risk of release between 500 and 2000 years).

     Steps:

     1. Determine base rate (Step 1): 
          - Does the project primarily displace private investment? 
            This is a public infrastructure project, likely funded by public money. We assume it does not displace private investment. So base rate = 3.5%.

     2. Long-term rate (beyond 100 years): 
          Using defaults:
            δ = 0.1% (0.001)
            η = 1.0
            g_∞ = 1.0% (0.01)
            σ^2 = 0.0004 (assuming 2% standard deviation)
            r_∞ = 0.001 + 1.0*0.01 - 0.5*1.0*1.0*0.0004 = 0.011 - 0.0002 = 0.0108 ≈ 1.08%

          So for t>100, we use 1.08%.

     3. Cross-generational incidence: 
          The costs are in the first 15 years. The benefits are the containment of waste, which is a benefit that starts immediately and runs forever. However, there is a small risk of release (a negative benefit) between 500 and 2000 years.

          We model the net benefits:
            Years 0-15: negative (costs)
            Years 16-forever: positive (avoided damages from having the waste contained) but with a small probability of a large release.

          But note: the risk of release is a negative benefit (a cost) that occurs with a small probability at some point between 500 and 2000. We must model the expected cost.

          Let's assume:
            Annual benefit of containment (avoided damage) = A (constant in real terms) from year 0 to infinity.
            But the release event: if it happens, it causes a damage D at the time of release. The probability of release between t and t+dt is f(t)dt. We need to compute the expected damage.

          However, for simplicity in discounting, we can model the expected damage as a certainty-equivalent cash flow? But it's a one-time event with low probability.

          We'll do:

            NPV = - Σ_{t=0}^{15} C(t) * DF(t) 
                   + Σ_{t=0}^{∞} A * DF(t) 
                   - [Probability of release] * D * DF(t_release)

          But the probability of release might be spread over time. We need an expected value.

          Alternatively, we might model the containment as a benefit that avoids the risk. But the board requires the cross-generational incidence.

          We focus on the discounting. For the incidence, we note that the benefits (avoided damages) are perpetual, so they extend beyond 100 years. The costs are all within 15 years. Therefore, the share of benefits beyond 100 years is very high.

          We compute:

            NPV = NPV_short (costs and benefits from 0-100) + NPV_long (benefits beyond 100 minus the expected cost of release)

