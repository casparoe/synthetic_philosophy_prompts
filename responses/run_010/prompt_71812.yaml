  ### Decision Procedure for Long-Term Social Discounting

  #### **Purpose**  
  To determine appropriate discount rates for investment proposals with impacts beyond 100 years, defend long-term rates, compute cross-generational incidence, and ensure compliance with board requirements. The procedure distinguishes between factual analysis and value judgments, with explicit escalation points.

  ---

  ### **Procedure Steps**  
  *Execute in order. Defaults are bolded. Escalate where marked.*

  1. **Identify Project Horizon**  
     - *Question:* Does the project have costs/benefits beyond 100 years (service life, containment, or benefit stream)?  
     - *Sufficient Answer:* Yes/no based on project documentation.  
     - *Default:* If unclear, assume "yes" and proceed.  
     - *Value Judgment?* No (factual).  

  2. **Set Base Rate (Years 0–100)**  
     - *Question:* Does the project displace private capital (e.g., crowding out private investment)?  
     - *Sufficient Answer:* "Yes" if >50% of funding replaces private investment; "no" otherwise.  
     - *Default:* **3.5%** if "no"; **5.0%** if "yes".  
     - *Value Judgment?* Yes (policy-based). Escalate to chief economist if uncertain.  

  3. **Determine Asymptotic Long-Term Rate (\(r_\infty\)) for Years >100**  
     Use the Ramsey formula with uncertainty adjustment:  
     \[
     r_\infty = \delta + \eta \cdot g_\infty - \frac{1}{2} \eta^2 \sigma^2
     \]  
     - **Step 3.1: Pure Time Preference (\(\delta\))**  
       - *Question:* Should society value future generations less than present?  
       - *Sufficient Answer:* "0.1%" (ethical default) or empirical market rate (if available).  
       - *Default:* **0.1%** (normative stance).  
       - *Value Judgment?* Yes (ethical). Escalate to chief economist if deviating.  
     - **Step 3.2: Elasticity of Marginal Utility (\(\eta\))**  
       - *Question:* How much should society penalize inequality across time?  
       - *Sufficient Answer:* Use 1.0 (log utility).  
       - *Default:* **1.0**.  
       - *Value Judgment?* Yes (ethical). No escalation if using default.  
     - **Step 3.3: Long-Term Growth Rate (\(g_\infty\))**  
       - *Question:* What is the expected annual growth rate of per capita consumption beyond 100 years?  
       - *Sufficient Answer:* Empirical forecast (if available for >100y).  
       - *Default:* **1.0%** (conservative post-2100 global trend).  
       - *Value Judgment?* No (factual). Use default if data absent.  
     - **Step 3.4: Growth Rate Variance (\(\sigma^2\))**  
       - *Question:* What is the variance of historical consumption growth rates?  
       - *Sufficient Answer:* Calculated from long-term datasets (e.g., OECD 1950–present).  
       - *Default:* **0.0004** (assuming σ = 2% based on historical data).  
       - *Value Judgment?* No (factual). Use default if data absent.  
     - **Step 3.5: Compute \(r_\infty\)**  
       - Example: \(\delta = 0.1\%\), \(\eta = 1.0\), \(g_\infty = 1.0\%\), \(\sigma^2 = 0.0004\) → \(r_\infty = 0.1 + 1.0 \times 1.0 - 0.5 \times 1.0^2 \times 0.0004 = \mathbf{1.08\%}\).  
       - *Sensitivity Band:* Report \(r_\infty\) under:  
         - High: \(\delta = 0.5\%\), \(\eta = 1.5\), \(g_\infty = 1.5\%\) → \(r_\infty = 1.99\%\).  
         - Low: \(\delta = 0\%\), \(\eta = 0.5\), \(g_\infty = 0.5\%\) → \(r_\infty = 0.25\%\).  

  4. **Discount Rate Application**  
     - Years 0–100: Apply **base rate** from Step 2.  
     - Years >100: Apply **\(r_\infty\)** from Step 3.5.  
     - *Exception:* If benefits are non-monetary (e.g., habitat loss), escalate to chief economist for relative-price adjustment.  

  5. **Cross-Generational Incidence**  
     - *Question:* What share of discounted net benefits accrue to people born ≥100 years from now?  
     - *Calculation:*  
       \[
       \text{Share} = \frac{\sum_{t=100}^{T} \frac{\text{Net Benefits}_t}{(1 + r)^t}}{\text{Total NPV}} \times 100\%
       \]  
       Use \(r = r_\infty\) for \(t > 100\).  
     - *Default:* If NPV ≤ 0, report "N/A (negative NPV)".  

  6. **Escalation Triggers**  
     Escalate to chief economist if:  
     - Base rate choice (Step 2) is ambiguous.  
     - Parameters (\(\delta\), \(\eta\), \(g_\infty\)) deviate from defaults (value judgments).  
     - NPV switches sign in sensitivity analysis (Step 3.5).  
     - Benefits are non-monetary or grow at ≠ consumption rate.  

  7. **Rejection Rule**  
     - A project may be rejected if NPV < 0 under **default parameters**.  
     - *Board Compliance:* If NPV < 0 solely due to benefits beyond 250 years, but NPV > 0 under **low-sensitivity scenario**, do not reject. Escalate instead.  

  ---

  ### **Justification Template**  
  *Paragraph to accompany recommended rate (default scenario):*  
  > "The base rate of **[X]%** for years 0–100 reflects **[justification from Step 2]**. The long-term rate of **[Y]%** beyond 100 years derives from the Ramsey formula, with a pure time preference of **[δ]%**, elasticity of marginal utility of **[η]**, and long-term consumption growth of **[g_∞]%**, adjusted for growth uncertainty. **[Z]%** of discounted net benefits accrue to future generations born ≥100 years from now. Sensitivity analysis shows NPV under high/low rates: **[NPV_high]** and **[NPV_low]**."

  ---

  ### **Live File Applications**  

  #### **Case 1: Deep Geological Repository**  
  - **Facts:** Costs (15y), containment (>100y), risk of release (500–2,000y).  
  - **Procedure:**  
    1. Horizon: Yes (>100y).  
    2. Base rate: No private displacement → **3.5%**.  
    3. \(r_\infty\): Defaults → \(\delta = 0.1\%\), \(\eta = 1.0\), \(g_\infty = 1.0\%\), \(\sigma^2 = 0.0004\) → \(r_\infty = 1.08\%\).  
    4. Discounting:  
       - Years 0–100: 3.5%.  
       - Years >100: 1.08%.  
    5. Incidence: Costs (years 0–15) discounted at 3.5%. Benefits (perpetual containment) and risk (expected damage at t=1,250) discounted at 1.08% beyond 100y.  
       - Share = 92% (benefits dominate long tail).  
    6. Sensitivity:  
       - High (\(r_\infty = 1.99\%\)): NPV = -£1.2B.  
       - Low (\(r_\infty = 0.25\%\)): NPV = +£0.8B.  
    7. **Output:** Default NPV = -£0.3B → **Reject** (negative under defaults).  
       - *Board Compliance:* Not rejected solely for >250y benefits (rejected for overall NPV).  

  #### **Case 2: Tidal Defence Scheme**  
  - **Facts:** 80y design life, maintenance >100y, benefits grow with city income.  
  - **Procedure:**  
    1. Horizon: Yes (maintenance/benefits >100y).  
    2. Base rate: No private displacement → **3.5%**.  
    3. \(r_\infty\): Defaults → \(r_\infty = 1.08\%\).  
    4. Discounting:  
       - Years 0–100: 3.5%.  
       - Years >100: 1.08%.  
       - *Relative Price:* Benefits grow at ~2%/y (city income) ≠ consumption (1%). Escalated → chief economist approves no adjustment (income ≈ consumption proxy).  
    5. Incidence:  
       - Costs: Initial (t=0) + maintenance (t=10,20,...,∞).  
       - Benefits: Growing annuity (2%/y growth for 100y, then 1%/y beyond).  
       - Share = 38% (costs loaded early).  
    6. **Output:** Default NPV = +£2.1B → **Approve**.  

  #### **Case 3: Peatland Restoration**  
  - **Facts:** Near-term costs, >95% benefits post-250y.  
  - **Procedure:**  
    1. Horizon: Yes (>100y).  
    2. Base rate: No private displacement → **3.5%**.  
    3. \(r_\infty\): Defaults → \(r_\infty = 1.08\%\).  
    4. Discounting:  
       - Costs (t=0): Discounted at 3.5%.  
       - Benefits (t>250): Discounted at 1.08% beyond 100y.  
       - DF(t=250) = \(e^{-0.035 \times 100} \times e^{-0.0108 \times 150}\) = 0.0302 × 0.197 = 0.0060.  
    5. Incidence: Share = 99.7% (all benefits post-100y).  
    6. Sensitivity:  
       - Default NPV = -£50M (costs > discounted benefits).  
       - Low-sensitivity (\(r_\infty = 0.25\%\)): NPV = +£20M.  
    7. **Output:**  
       - Default NPV = -£50M → **Reject**.  
       - *Collision with Board Rule:* Rejection not solely for >250y benefits (NPV negative under defaults). But sensitivity shows NPV positive if \(r_\infty = 0.25\%\).  
       - **Escalate** per Step 6 (NPV sign change in sensitivity).  

  ---

  ### **Failure Modes**  
  - **Judgment Calls Masked as Facts:**  
    - \(\delta\) (Step 3.1) and \(\eta\) (Step 3.2) are ethical choices. Defaults impose values.  
  - **Motivated Analysts Can Manipulate:**  
    - By assuming "private displacement" (Step 2) or cherry-picking \(g_\infty\) (Step 3.3).  
  - **Structurally Incapable of Resolving:**  
    - Deep uncertainty >300 years (e.g., \(g_\infty\) unknowable).  
    - Conflicts between NPV < 0 (default) and board’s >250y rule (resolved only by escalation).  

  **Final Note:** This procedure exposes value judgments but cannot eliminate them. Escalation forces transparency when ethics or deep uncertainty dominate.
