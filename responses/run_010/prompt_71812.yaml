  Summary of the decision procedure:

  We write the procedure as an ordered list.

  **Decision Procedure for Long-Term Discounting**

  **Scope:** This procedure applies to any investment proposal where the service life, containment obligation, or benefit stream extends beyond 100 years.

  **Definitions:**
  - **Base rate (r0):** The discount rate used for the first 100 years.
  - **Long-term rate (r∞):** The discount rate used beyond 100 years, derived from the Ramsey formula with adjustments for uncertainty.
  - **Cross-generational incidence:** The share of discounted net benefits that accrue to individuals born at least 100 years from now.

  **Steps:**

  1. **Determine if the project has impacts beyond 100 years.** If no, use the agency's standard discounting (three rates: 3.5%, 5%, 7%) and the convention for headline rate. If yes, proceed.

  2. **Determine the base rate (r0) for years 0-100:**
     a. Ask: "Is there strong evidence that the project primarily displaces private investment?" (Note: This is a judgment call. If uncertain, escalate to team lead or chief economist.)
        - If yes, set r0 = 5%.
        - If no, set r0 = 3.5%.
     b. Default: If the answer is unavailable, use r0 = 3.5%.
     c. Escalation: If the analyst is unsure, escalate.

  3. **Determine the long-term discount rate (r∞) for years >100:**
     a. Set the pure rate of time preference (δ):
          - Default: δ = 0.1% (0.001).
          - This is a value choice. Any deviation must be justified and approved by the chief economist.
     b. Set the elasticity of marginal utility (η):
          - Default: η = 1.0.
          - This is a value choice. Any deviation must be approved.
     c. Set the long-term expected growth rate of per capita consumption (g_∞):
          - Default: g_∞ = 1.0% (0.01).
          - This is a highly uncertain parameter. If the analyst has a sector-specific long-term growth projection, they may use it with approval.
     d. Set the variance of the growth rate (σ^2):
          - Default: σ^2 = (0.02)^2 = 0.0004.
          - This is a highly uncertain parameter. Any deviation must be approved.
     e. Calculate r∞ = δ + η * g_∞ - 0.5 * η^2 * σ^2.
     f. Round r∞ to two decimal places (e.g., 1.08%).

  4. **Discounting cash flows:**
     - For years t <= 100: discount at rate r0.
     - For years t > 100: discount at rate r∞ (constant) from year 100 onward. Specifically, the discount factor for a cash flow at time t (t>100) is:
          DF(t) = exp(-r0 * 100) * exp(-r∞ * (t - 100))

  5. **Cross-generational incidence:**
     a. Calculate the total net present value (NPV) as the sum of discounted net benefits from t=0 to the end of the project horizon.
     b. Calculate NPV_long, the sum of discounted net benefits for t>=100.
     c. The share = NPV_long / NPV, if NPV is positive. If NPV is negative, report the absolute value of the share and note that the overall NPV is negative.

  6. **Sensitivity analysis:**
     a. Recompute the NPV and share using the following alternative parameter sets for r∞:
        - **Higher discounting scenario:**
            δ = 0.5%, η = 1.5, g_∞ = 1.5%, σ^2 = 0.0004.
        - **Lower discounting scenario:**
            δ = 0%, η = 0.5, g_∞ = 0.5%, σ^2 = 0.0004.
     b. Report the NPV and share under these scenarios.

  7. **Escalation triggers:** Escalate to the team lead or chief economist if any of the following occur:
     a. The answer to the private investment displacement question (Step 2a) is unavailable or uncertain.
     b. Any deviation from the default parameters in Step 3 is proposed.
     c. The project's NPV is negative under the default scenario but positive under one of the sensitivity scenarios (or vice versa) and the difference is material.
     d. The cross-generational incidence share is greater than 50% and the NPV is positive but small (e.g., less than 10% of the project's capital costs).
     e. The project has significant impacts beyond 250 years and the NPV is highly sensitive to the discount rate.

  8. **Justification template:**
     "The discount rate for the first 100 years is [r0]%, based on [state reason: e.g., 'the default rate for public projects' or 'evidence of private investment displacement']. For the period beyond 100 years, a long-term discount rate of [r∞]% is applied. This rate is derived from the Ramsey formula with a pure rate of time preference of [δ]%, an elasticity of marginal utility of [η], and a long-term expected growth rate of [g_∞]%, adjusted for growth uncertainty. The share of discounted net benefits accruing to individuals born at least 100 years from now is [share]%."

     "Sensitivity analysis shows that under a higher discounting scenario (long-term rate = [r_high]%), the NPV would be [NPV_high], and under a lower discounting scenario (long-term rate = [r_low]%), the NPV would be [NPV_low]. The project [is/is not] robust to these variations."

  **Failure modes and limitations:**
  - The parameters δ, η, and g_∞ are value judgments. The defaults are set based on common practice but may not reflect societal values. The agency should periodically review these defaults.
  - The procedure assumes that the long-term rate is constant after 100 years. In reality, the rate might decline further, but we simplify.
  - The procedure does not account for catastrophic risks or changes in the structure of the economy beyond 300 years.
  - A motivated analyst can influence the outcome by cherry-picking parameters in the sensitivity analysis. Therefore, the sensitivity parameters are fixed.
  - The procedure cannot resolve deep uncertainty about the distant future. Extending the horizon beyond 300 years is highly speculative.

  **Application to Cases:**

  Due to the complexity and the need for real data, we've provided illustrative numbers. In practice, the analyst would use the project's actual cash flows.

  End of procedure.
