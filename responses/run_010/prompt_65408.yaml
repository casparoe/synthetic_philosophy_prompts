answer: |-
  ### Joint Statement of Adversarial Collaboration

  **Preamble:**  
  We, the undersigned, agree on the mathematical foundations of the Gibbard-Satterthwaite theorem and its extensions but diverge sharply on their practical implications for voting rule design. This statement clarifies points of agreement, disagreements, and cruxes testable in the specified empirical setting (a mayoral election in a city of 180,000 registered voters, ~95,000 ballots cast, four candidates, ranked ballots, anonymized ballot file release, pre-election survey of 2,500 voters, and an incentivized study of 600 subjects). We commit to this document as an accurate reflection of our shared and divergent views.

  ---

  ### (1) Numbered List of Agreed Claims  
  Both parties endorse these claims verbatim and will not append caveats.  

  1. **Gibbard-Satterthwaite theorem (standard form):** For any deterministic, onto, single-winner voting rule defined for at least three alternatives on the full domain of strict preference orderings, if no voter can profitably unilaterally misreport their preferences, the rule must be dictatorial.  
  2. **Extensions to non-strict preferences:** When ballots admit ties and abstention, requiring immunity to manipulation by both optimists (best-case tie resolution) and pessimists (worst-case tie resolution) implies the rule must be weakly dictatorial (i.e., always selects a top choice of a designated weak dictator).  
  3. **Extensions to randomized rules:** For randomized voting rules, if no voter can change the outcome lottery to one they strictly prefer in expectation (under von Neumann-Morgenstern utilities), the rule must be a probability mixture of dictatorial rules.  
  4. **Extensions to endogenous slates:** When candidate entry/exit is endogenous, any nondictatorial unanimity-respecting rule can be manipulated by adding a candidate who cannot win but alters the outcome.  
  5. **Theorem scope:** The theorem and its extensions are mathematically correct under their stated hypotheses but rely on assumptions (e.g., universal domain, determinism, surjectivity, ≥3 alternatives, costless unilateral deviation) that are never jointly satisfied in any real-world election.  
  6. **Pivotality in large electorates:** In a large electorate (e.g., n ≈ 95,000), a single voter’s unilateral misreport can only affect the outcome when that voter is pivotal (i.e., their vote could change the winner).  
  7. **Empirical testability:** The agreed-upon empirical setting (ballot file, voter survey, incentivized study) will generate data to measure:  
     - The frequency of manipulable profiles (where unilateral/bilateral deviation is theoretically profitable).  
     - The distribution of pivotality probabilities.  
     - The rate and payoff of successful manipulation under varying information conditions.  
  8. **Manipulation as inevitable:** All non-dictatorial voting rules are theoretically manipulable under the theorem’s hypotheses; thus, rules cannot be compared by "whether" they admit manipulation but only by "how" they admit it.  

  ---

  ### (2) Disagreements Table  
  | Issue | Impossibilist's Formulation | Reformer's Formulation | Genuine or Verbal | Why |  
  |-------|-----------------------------|------------------------|-------------------|-----|  
  | **Relevance of the theorem to practice** | The theorem proves that hunting for a non-manipulable rule is futile; rules must be compared by which types of manipulation they admit (e.g., unilateral/coalitional, deterministic/random). | The theorem’s existential conclusions are irrelevant to practice; rules should be ranked by empirical manipulability metrics (frequency, coalition size, payoff). | Genuine | Fundamental divergence on whether mathematical possibility or empirical frequency defines practical "manipulability." |  
  | **Criterion for evaluating rules** | The existence of a profitable manipulation (any profile/deviation pair) is the correct design criterion, as it reveals structural vulnerability irrespective of frequency. | The frequency-weighted-by-stakes of successful manipulation (e.g., pivotality × payoff) is the correct criterion, as it reflects real-world impact. | Verbal | "Manipulable" is used categorically (Impossibilist) vs. gradiently (Reformer); both agree manipulability exists but differ on how to measure it. |  
  | **Role of randomization** | Randomization (e.g., random dictatorship) does not escape manipulation; it merely relocates it ex-post (e.g., to post-lottery deviations) while satisfying strategy-proofness only ex-ante as a mixture of dictatorships. | Randomization reduces practical manipulability by lowering pivotality frequency and payoff stakes, making ex-ante strategy-proofness sufficient for design. | Genuine | Dispute over whether ex-ante (Reformer) or ex-post (Impossibilist) immunity matters more in real electorates. |  
  | **Spatial structure in elections** | Single-peaked/spatial structure is implausible with endogenous candidate entry, as entrants disrupt alignment (e.g., spoiler candidates), forcing universal-domain analysis. | Endogenous entry does not preclude low-dimensional structure (e.g., ideological spectra); real electorates often exhibit near-single-peaked preferences. | Genuine | Contradictory empirical predictions about preference distributions (testable in ballot data). |  
  | **Obvious strategy-proofness (OSP)** | OSP (where profitable deviations are transparent) does not resolve the theorem’s critique; it is a stricter criterion that few voting rules meet, and its satisfaction in sequential designs (e.g., ascending clocks) is irrelevant to most direct-revelation elections. | OSP is pragmatically valuable; rules meeting OSP (e.g., sequential elimination) reduce manipulation in practice by making it cognitively obvious, even if theoretically manipulable. | Genuine | Dispute over whether OSP’s practical benefits outweigh the theorem’s existential limits. |  

  ---

  ### (3) Cruxes  
  Cruxes are ranked by potential to resolve the debate (1 = highest impact). For each:  
  - **Feature of agreed setting:** Aspect testable with the empirical data.  
  - **Predictions:** Each party’s forecast.  
  - **Evidence against self:** What each agrees would falsify their position.  
  - **Our commitment (counsel’s):** Which prediction we expect the data to support and why.  

  1. **Crux: Frequency-weighted manipulability vs. existential possibility**  
     - **Feature:** Incentivized study (600 subjects) measuring manipulation frequency/payoff under three information treatments (none, noisy poll, full information).  
     - **Impossibilist prediction:** High manipulation frequency (e.g., >40%) in full-information treatment when subjects are pivotal; payoff gains will be large (e.g., >50% of maximum possible).  
     - **Reformer prediction:** Low manipulation frequency (e.g., <10%) in noisy-poll treatment (deemed realistic); payoffs will be marginal (e.g., <10% of maximum).  
     - **Evidence against Impossibilist:** If manipulation frequency is low (<5%) even under full information and payoffs are negligible.  
     - **Evidence against Reformer:** If manipulation frequency is high (>30%) under noisy polls and payoffs are substantial (>30%).  
     - **Commitment:** Data will support **Reformer**. Why? Low-information/poll treatments mimic real voting; voters lack cognitive bandwidth to identify manipulation opportunities, and pivotality is rare (per last election’s 1,412-vote margin).  

  2. **Crux: Universal domain’s practical relevance**  
     - **Feature:** Ballot file (95,000 ballots) and survey (2,500 voters) showing preference distribution (e.g., violations of single-peakedness).  
     - **Impossibilist prediction:** Ballot data will show high entropy (e.g., >70% of possible orderings occur; no dominant dimension).  
     - **Reformer prediction:** Ballot data will show strong structure (e.g., >90% single-peaked on a left-right spectrum; <20% entropy).  
     - **Evidence against Impossibilist:** If >95% of ballots fit a single dimension (e.g., candidates ordered L-R).  
     - **Evidence against Reformer:** If <60% of ballots are single-peaked and entropy is high.  
     - **Commitment:** Data will support **Reformer**. Why? Municipal elections with four entrants typically align on ideological spectra; spoiler effects are mitigated by voter coordination.  

  3. **Crux: Randomization as escape or relocation**  
     - **Feature:** Margin analysis (from ballot file and last election’s 1,412-vote plurality margin) estimating pivotality probabilities and coalition sizes needed for manipulation.  
     - **Impossibilist prediction:** Many profiles (e.g., >1%) will allow manipulation by small coalitions (≤100 voters) with high payoff (swinging the election).  
     - **Reformer prediction:** Pivotality will be negligible (e.g., <0.01% chance per voter); manipulation requires large coalitions (≥1,000 voters) with low expected payoff.  
     - **Evidence against Impossibilist:** If no pivotal profiles exist in ballot data or coalition sizes exceed 1,000 voters.  
     - **Evidence against Reformer:** If small coalitions (≤50 voters) could have altered outcomes in >0.5% of profiles.  
     - **Commitment:** Data will support **Reformer**. Why? A 1,412-vote margin implies low pivotality; coalitional coordination costs deter manipulation.  

  4. **Crux: Spatial structure with endogenous entry**  
     - **Feature:** Survey data on voter beliefs and candidate positioning, testing if entrants align on a spectrum (e.g., perceived ideology scores).  
     - **Impossibilist prediction:** Candidates will not align unidimensionally (e.g., divergent positions on orthogonal issues); ballot entropy will be high.  
     - **Reformer prediction:** Candidates will cluster on a dominant dimension (e.g., ideology); ballot entropy will be low.  
     - **Evidence against Impossibilist:** If candidate positions correlate >0.8 on a primary axis (e.g., from survey beliefs).  
     - **Evidence against Reformer:** If candidates lack spatial correlation (r < 0.3) and voter preferences are multidimensional.  
     - **Commitment:** Data will support **Reformer**. Why? Endogenous entry in mayoral races typically reinforces, not fractures, dominant ideological divides.  

  5. **Crux: Obvious strategy-proofness (OSP)**  
     - **Feature:** Incentivized study comparing manipulation rates under no-information vs. full-information treatments.  
     - **Impossibilist prediction:** Manipulation rates will be significant (>20%) in both treatments, proving OSP does not eliminate exploitation.  
     - **Reformer prediction:** Manipulation rates will be low (<5%) under no-information, rising only with full information, proving OSP reduces real manipulation.  
     - **Evidence against Impossibilist:** If manipulation is near zero (<2%) without full information.  
     - **Evidence against Reformer:** If manipulation is high (>15%) without full information.  
     - **Commitment:** Data will support **Reformer**. Why? Without explicit information, voters cannot identify manipulation opportunities; OSP-like designs (e.g., sequential rules) obscure deviations.  

