  ### Two-Page Handout: Desert-Based Punishment and Galen Strawson's Basic Argument  

  **The Basic Argument (for reference):**  
  1. Nothing can be the cause of itself.  
  2. True moral responsibility for an act requires responsibility for the character/motives from which it issues.  
  3. Responsibility for one’s character would require an infinite regress of self-formation, terminating in self-creation.  
  4. Therefore, no one is truly morally responsible.  
  *Note: This argument challenges desert-based punishment (retributivism) regardless of determinism.*  

  ---

  #### **1. Logical Space of Positions**  
  Five binary questions define the debate. Each combination is assessed for coherence, attractiveness, or existence.  

  | Q1: Blame requires authorship of character? | Q2: One self-forming act stops the regress? | Q3: Indeterminacy adds to responsibility? | Q4: Impossibility depends on determinism? | Q5: What happens to desert? | Viable? | Diagnosis if empty |  
  |---------------------------------------------|---------------------------------------------|-------------------------------------------|-------------------------------------------|------------------------------|---------|---------------------|  
  | Yes | Yes | Yes | No | Revised | Empty | Incoherent: If indeterminacy adds responsibility (Q3=Yes) and self-formation stops regress (Q2=Yes), but blame requires authorship (Q1=Yes), the impossibility (Q4=No) contradicts Q2/Q3. |  
  | Yes | Yes | Yes | Yes | Retained (fiction) | Empty | Unattractive: Requires indeterminacy (Q3=Yes) to "stop" the regress, but Q4=Yes makes responsibility depend on determinism’s falsity—undermining the need for Q2/Q3. |  
  | Yes | Yes | No | No | Discarded | **Event-Causal Libertarianism** | — |  
  | Yes | Yes | No | Yes | Dissolved | Empty | Incoherent: If impossibility depends on determinism (Q4=Yes), but Q2=Yes claims self-formation stops regress (implying possibility), Q4 contradicts Q2. |  
  | Yes | No | Yes | No | Revised | Empty | Incoherent: Q2=No denies self-formation stops regress, but Q3=Yes requires indeterminacy to add responsibility—yet without a "stopping" mechanism (Q2), indeterminacy is irrelevant. |  
  | Yes | No | Yes | Yes | Retained (fiction) | **Illusionism** | — |  
  | Yes | No | No | No | Discarded | **Hard Incompatibilism** | — |  
  | Yes | No | No | Yes | Dissolved | **Strawsonian Pessimism** | — |  
  | No | — | Yes | No | Revised | **Agent-Causal Libertarianism** | — |  
  | No | — | Yes | Yes | Retained (fiction) | Empty | Incoherent: If blame doesn’t require authorship (Q1=No), Q3=Yes (indeterminacy adds responsibility) is unmotivated—indeterminacy only matters if authorship is required. |  
  | No | — | No | No | Discarded | **Reasons-Responsiveness Compatibilism** | — |  
  | No | — | No | Yes | Dissolved | **Real-Self/Reflective-Endorsement Views** | — |  
  | — | — | — | — | — | **Attributionism** | *See note below* |  
  | — | — | — | — | — | **Revisionism/Quietism/Eliminativism** | *Handled in the tree* |  

  **Note on Unexplored Cell (Q1=No, Q3=Yes, Q4=No):**  
  - **What it would require:** Accepting that indeterminacy enhances responsibility *without* requiring authorship of character. For example: "Indeterminacy at key moments (e.g., decisions) directly confers responsibility by enabling alternative possibilities, but ultimate authorship is irrelevant."  
  - **Why empty?** No major position holds this; it conflates sourcehood (authorship) with leeway (alternatives).  

  **Attributionism Note:** Splits responsibility into *attributability* (act reflects character) and *accountability* (desert-based blame). Q1=Yes for accountability, but Q1=No for attributability—so it straddles rows.  

  ---

  #### **2. Decision Tree**  
  *Answer based on cases, not doctrines. Cases amended for clarity (changes in italics):*  
  - **The Curator (Amended):** "...*In a deep moral sense (desert-based),* is Dana blameworthy for her silence?"  
    - **A:** Yes.  
    - **B:** No.  
    *Change: Clarifies "desert-based blame" to avoid conflating social/attributive blame.*  
  - **The Loop (Amended):** "...*In a deep, ultimate sense,* was Eitan’s choice an act of self-authorship?"  
    - **A:** Yes.  
    - **B:** No.  
    *Change: "Ultimate sense" flags the regress problem.*  
  - **The Twin Worlds:**  
    - **Part 1 (Decision):** "In the *decision* version, *in a deep moral sense*, is Wren-1 more responsible than Wren-2?"  
      - **A:** Yes.  
      - **B:** No.  
    - **Part 2 (Self-Formation):** "In the *self-formation* version, *in a deep moral sense*, is Wren-1 more responsible than Wren-2?"  
      - **A:** Yes.  
      - **B:** No.  
    *Change: "Deep moral sense" added to both for consistency.*  
  - **The Bench:** Unchanged. Options:  
    - **A:** Practices continue; drop metaphysical claims.  
    - **B:** Both continue; error is tolerable.  
    - **C:** Dismantle practices.  
    - **D:** Nothing; dispute is an artifact.  

  **Tree Structure (9 nodes):**  
  1. **Start with The Curator:** Is Dana blameworthy?  
     - **A (Yes) →** Go to 2.  
     - **B (No) →** Go to 5.  
  2. **The Loop (for "Yes" to Curator):** Self-authorship?  
     - **A (Yes) →** Go to 3.  
     - **B (No) →** Go to 4.  
  3. **Twin Worlds (Self-Formation):** More responsible?  
     - **A (Yes) →** Go to 7.  
     - **B (No) →** Go to 8.  
  4. **Twin Worlds (Decision) (for "No" to Loop):** More responsible?  
     - **A (Yes) →** *Inconsistency flagged in §4.*  
     - **B (No) →** Go to 9.  
  5. **The Loop (for "No" to Curator):** Self-authorship?  
     - **A (Yes) →** Go to 6.  
     - **B (No) →** Go to 9.  
  6. **Twin Worlds (Self-Formation) (for "Yes" to Loop):** More responsible?  
     - **A (Yes) →** Event-Causal Libertarianism.  
     - **B (No) →** Agent-Causal Libertarianism.  
  7. **The Bench (for "Yes" to Self-Formation):** Which option?  
     - **A/B/C/D →** Go to leaves (Revisionism, Illusionism, etc.).  
  8. **The Bench (for "No" to Self-Formation):** Which option?  
     - **A/B/C/D →** Go to leaves (Hard Incompatibilism, etc.).  
  9. **The Bench (for "No" to Loop or "No" in 4B):** Which option?  
     - **A/B/C/D →** Go to leaves.  

  ---

  #### **3. Leaves (11 Positions)**  
  1. **(Event-Causal Libertarianism, e.g., Kane):**  
     - Hardest commitment: Undetermined self-forming acts at earlier times confer desert *without* needing further authorship.  
     - Desert: Intact (requires only self-forming actions).  
  2. **(Agent-Causal Libertarianism):**  
     - Hardest commitment: Agents as non-physical "substances" cause actions independently of prior states—metaphysically obscure.  
     - Desert: Intact (but rare/exceptional).  
  3. **(Reasons-Responsiveness Compatibilism):**  
     - Hardest commitment: Blame depends *only* on current capacities (e.g., responding to reasons), not character authorship.  
     - Desert: Intact (compatible with determinism).  
  4. **(Real-Self/Reflective-Endorsement Views):**  
     - Hardest commitment: Wholehearted identification with motives is sufficient for desert, even without ultimate control.  
     - Desert: Intact (as "deep" as it gets).  
  5. **(Attributionism):**  
     - Hardest commitment: Blame as *attributability* (act reflects character) survives, but *accountability* (desert) does not.  
     - Desert: Gone (only attributability remains).  
  6. **(Hard Incompatibilism):**  
     - Hardest commitment: Causal determinism (or physical law) *alone* voids responsibility; indeterminism adds nothing.  
     - Desert: Gone.  
  7. **(Strawsonian Pessimism):**  
     - Hardest commitment: Moral responsibility is impossible, yet reactive attitudes (e.g., blame) are inescapable and socially necessary.  
     - Desert: Retained as a "useful fiction" (practices continue unchanged).  
  8. **(Revisionism about Desert):**  
     - Hardest commitment: Desert can be "scaled down" to non-ultimate responsibility (e.g., based on fairness or reciprocity).  
     - Desert: Revised (weaker, non-ultimate form).  
  9. **(Illusionism):**  
     - Hardest commitment: Publicly affirm desert-based practices *despite* privately denying their metaphysical basis.  
     - Desert: Retained as an admitted social technology.  
  10. **(Eliminativism):**  
      - Hardest commitment: Abolish all retributive practices once desert is exposed as illusory.  
      - Desert: Gone (practices dismantled).  
  11. **(Deflationary Quietism):**  
      - Hardest commitment: The "ultimate responsibility" debate is a philosopher’s artifact; social practices need no reform.  
      - Desert: Dissolved (no error to fix).  

  ---

  #### **4. What the Tree Cannot Do**  
  - **Unseparated Pairs:**  
    - *Hard Incompatibilism vs. Strawsonian Pessimism:* Both say "No" to Curator and Loop. The Bench separates them (Option C vs. B).  
    - *Illusionism vs. Revisionism:* Both may say "Yes" to Curator and "No" to Loop, then "No" in Twin Worlds. The Bench separates them (Option B vs. A).  
    - *Agent-Causal vs. Event-Causal Libertarianism:* Separated by Twin Worlds (Self-Formation) node.  
    - *Real-Self Views vs. Reasons-Responsiveness:* Both say "Yes" to Curator and "No" to Loop. Twin Worlds (Decision) *should* force "No," but if answered "Yes," it flags an inconsistency.  
  - **Consistency Check:**  
    - *Pattern:* "No" to Curator (blame requires authorship) + "Yes" to Loop (self-authorship possible) + "No" to Twin Worlds (Self-Formation) (indeterminacy doesn’t add responsibility).  
    - *Diagnosis:* You reject indeterminacy as responsibility-conferring but believe self-authorship is possible—yet without indeterminacy, self-authorship is causally determined and thus not "ultimate." Reconcile or choose: Agent-Causal Libertarianism (if substance-causation solves this) or abandon self-authorship.  
  - **Limitations:**  
    - *Attributionism* may be misassigned: It answers "No" to Curator (rejects desert-based blame) but could align with Strawsonian or Compatibilist Bench options.  
    - *Quietism* is identified only via Bench (Option D).  

  ---

  **Confidence & Uncertainties**  
  - **Confidence:** High (9/10) that nodes cover all real positions. Nodes are independent (no redundancy) and jointly exhaustive (no major position missing).  
  - **Least Sure About:** Placement of *Revisionism* and *Quietism*.  
    - **Alternative:** Treat Quietism as a Bench-only position (Option D), but Revisionism could also pick Option A (practices continue, claims dropped).  
    - **Why Set Aside?** Revisionism actively *revises* desert; Quietism *dissolves* the debate. The Bench forces this distinction.  
  - **Tree Weakness:** The Twin Worlds (Self-Formation) node may not cleanly separate libertarian subtypes if participants balk at "more responsible," but it is the best case-based proxy.  

  ---  
  *Handout ends. Designed for seminar use with only the Basic Argument and cases as prerequisites.*
