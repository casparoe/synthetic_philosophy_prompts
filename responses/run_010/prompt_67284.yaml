  ## Honouring the Transformation: Why the Self-Voiding Directive Commands Antibiotics

  The tragic dilemma posed by advance directives often forces a stark choice: honour the competent past self’s refusal of treatment, potentially condemning the incompetent present self to death, or prioritise the current experiential welfare, overriding the past self's deeply held values. The case of the woman with early-onset dementia and her uniquely crafted directive, however, presents a sophisticated mechanism designed to dissolve this very impasse. This essay argues unequivocally that antibiotics should be administered. The directive’s self-voiding clause is coherent, effectively counters standard identity-based objections by the earlier self’s own concession, and delegates decision-making authority to surrogates tasked with applying substituted judgment based on the *current* self’s experiential welfare. Honouring the clause *is* honouring the deepest autonomy expressed by the directive’s author.

  **Coherence of the Self-Voiding Directive: Conditional Delegation, Not Self-Contradiction**
  A common objection is that a directive authorising its own override is logically incoherent, akin to a "self-untying Ulysses contract." If the directive voids itself under condition X, then when condition X obtains, the directive (including its voiding clause) ceases to exist, potentially reinstating the original refusal. This view misunderstands the clause’s nature. This directive is not an irrevocable command but a *conditional delegation of authority*. It explicitly states: *If* state S occurs (contentment, loss of former values/identity), *then* the refusal is void, *and* treatment decisions should be based on the welfare/interests of the person *in* state S. The clause doesn’t disappear; it successfully *executes its function* upon the condition being met. It functions like a legal "springing" provision or a medical order with specific termination criteria (e.g., a DNACPR order reviewed if recovery occurs). The settled view in law and ethics is that advance directives can contain conditions and limitations; their validity hinges on the competence and clarity of the initial authorisation. This clause, while unusual, is a clear conditional statement, not a performative paradox. The solicitor’s warning about its unusual nature pertains to practical application, not inherent incoherence.

  **Defusing Identity: The Earlier Self’s Concession is Decisive**
  Standard objections to precedent autonomy, articulated by thinkers like Rebecca Dresser and (in some readings) Derek Parfit, emphasise the potential disconnection between the competent author and the incompetent patient. They argue the current experiential self, lacking the values that motivated the refusal, constitutes a different "interest-bearer" whose welfare should now prevail. Proponents of precedent autonomy, like Ronald Dworkin, counter that respecting critical interests expressed when competent preserves narrative integrity over a life as a whole. This clause dramatically shifts the terrain. **The earlier self explicitly concedes the core point of the identity/welfare objection.** She states that if she becomes content, warmly attached, and no longer identifies with her past values (precisely the state described seven years later), then the refusal *should not bind*. She acknowledges that the *person she becomes* under these conditions has distinct interests that should govern. This isn’t the family’s "sentimental weakness," as the son claims; it is the *author’s own pre-emptive judgment* about when her past self’s authority should yield. To ignore this clause is not to uphold her autonomy; it is to *override* her specific instruction about the limits of her precedent autonomy in favour of a rigid narrative integrity view she herself rejected for this scenario. Her concession fundamentally undermines the identity-based argument *against* following the clause.

  **Delegation and Substituted Judgment: Empowering the Current Self**
  The clause states that if the specified condition is met, she is "to be treated as the person she has become." But who decides if the condition is met, and how is "treated as" operationalised when she lacks capacity? The son interprets this as an impossible delegation to an incompetent self. However, a more plausible and legally coherent reading is that the clause implicitly delegates decision-making authority to appointed surrogates (here, presumably the family, as no other mechanism is mentioned) *with specific instructions*. They must first ascertain if the condition (contentment, attachment, loss of former identity/values) is met. Medical evidence and testimony from the daughter and day centre staff clearly confirm this. Second, they are instructed to make decisions based on the welfare and interests of the *current* self – the "person she has become." This mandates a *substituted judgment* standard, but crucially, one indexed to the values and experiences *of the current, incompetent self*, not the past competent self. What would *this* content, attached, value-detached person want, given her evident enjoyment of simple pleasures and relationships? Since she cannot express it, we infer from her observed state that she values continued life and experiential well-being. The clause, far from being empty, provides clear ethical and procedural guidance: confirm the condition, then prioritise the current experiential interests. This aligns with the settled legal principle in England and Wales (Mental Capacity Act 2005) that best interests assessments must consider the person’s *current* wishes, feelings, beliefs, and values, even if incompetent. The clause makes this explicit and paramount upon condition fulfilment.

  **Conclusion: Fidelity to Autonomous Choice**
  The directive, with its self-voiding clause, represents a profound and autonomous recognition by the earlier self of the possibility of radical transformation. She anticipated a future self whose values and experiences would be fundamentally different and explicitly willed that *that* self’s interests should prevail in such circumstances. To deny her antibiotics now, clinging rigidly to the refusal she specifically instructed should *not* apply in this precise situation, is a profound betrayal of her considered autonomy. It imposes a narrative integrity she disavowed for this outcome. The clause is coherent as a conditional delegation, it vitiates the standard identity objection through the author’s own concession, and it directs surrogates to apply substituted judgment focused on the current self’s welfare. Administering antibiotics honours the directive’s deepest logic and the author’s clearest, most contextually nuanced instruction. The path forward, guided by her own words, is clear.

