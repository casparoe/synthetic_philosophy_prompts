prompt: |-
  I want a designed case from the units-of-selection debate, built to the specification below.

  The purpose first, since it fixes what counts as cheating. I am running a seminar in which I want participants to see whether the question "at which level is selection acting?" is empirically load-bearing or a matter of pure redescription — and, if the latter, exactly what would have to be true for the redescription to go through. A scenario that stipulates that group selection is occurring, or that settles the matter by a definitional ruling about what counts as a group, fails; the verdicts must be generated by the biology of the case.

  The setup. Bacteria growing in a biofilm composed of discrete patches. Producer cells secrete a costly extracellular enzyme that digests a resource accessible only outside the cell; non-producer cells free-ride. The patches must be genuine interacting entities with their own growth and demise, not arbitrary partitions of a well-mixed culture. Two arms, identical in every respect but the life cycle. In the *dissolve* arm, patches break up at the end of each growth cycle and cells are randomly redistributed to found new patches. In the *bud* arm, patches instead bud off daughter patches, whose founding composition is inherited from the parent. Constraint: the within-patch reproductive advantage of non-producers must be numerically identical in both arms, and neither arm may depend on relatedness coefficients, inclusive-fitness accounting, or any assortment mechanism other than the life cycle itself.

  Deliverables. (a) The scenario in a single paragraph. (b) For each arm, the verdict and the mechanism on three accounts — the gene as replicator, the individual cell whose reproductive output is measured, and the patch as an entity with births and deaths of its own — set out so that agreements and divergences are visible at a glance. (c) The one feature of the case doing the discriminating work, and what happens if it is removed: does the case collapse into an ordinary free-rider problem? (d) The gene's-eye theorist's attack, in its strongest form, and a judgment on whether it shows the patch-level description to be dispensable or merely redundant.

  If the two arms turn out to yield the same outcome, say so plainly rather than adjusting the numbers until they differ. No citations, no named empirical studies.
reasoning: |-
  Okay, the user wants a designed case for the units-of-selection debate, specifically for a seminar to explore whether selection acting at a particular level is empirically meaningful or just a redescription. They've provided very specific constraints: bacterial biofilms with two life cycles (dissolve vs. bud), producer and non-producer cells, and no reliance on relatedness or assortment beyond the life cycle itself. 

  Hmm, the key challenge here is making sure both arms have identical within-patch dynamics but differ in how group reproduction works. The dissolve arm must reset relatedness each generation through random mixing, while the bud arm maintains parent-offspring resemblance at the patch level. Crucially, the user insists that within-patch fitness differences (non-producers outcompeting producers) must be numerically identical in both setups—no cheating by tweaking those numbers.

  *scratches head* Let me verify the math silently. In dissolve arm: global proportion of producers (p) should decrease due to within-patch selection alone since groups don’t "reproduce." In bud arm: patches with more producers grow faster, so group productivity acts as an emergent selective force. But only if patch output scales nonlinearly with producer frequency! If it were linear, group productivity advantage would exactly offset cell-level disadvantage. *aha* That’s the discriminator—the synergy term (k). 

  The user’s demand for "no definitional rulings" means I can’t just declare buds to be group reproduction; it must emerge from biology. Budding patches literally produce offspring entities, while dissolved patches do not. Good. Also, the gene’s-eye counterattack is inevitable—they’ll say the patch productivity is just the aggregate of cell fitnesses. But is that true? Only if k=0. When k>0, patch output isn’t additive, so the emergent fitness can’t be reduced. *nods* That’s the critical point for seminar debate.

  ...Wait, did I accidentally make the dissolve arm’s outcome trivial? Non-producers always win there because no group selection exists. But in bud arm, producers persist if synergy is strong enough. The user said "if arms yield same outcome, admit it"—here they starkly differ. Perfect. Also, constraint check: within-patch relative fitness (w_n/w_p = 1+s) is identical in both arms. No relatedness parameters smuggled in. 

  *double-checks deliverables* Scenario paragraph? Check. Three-level verdict table showing divergence? Check (note how gene/cell levels agree but patch level flips). Discriminating feature? Synergistic productivity (k>0). Without it, bud arm collapses to dissolve outcome. Gene’s-eye attack? "Group productivity is just summed cell fitness"—but fails when synergy breaks additivity. Verdict: patch description is empirically load-bearing because it captures the causal structure of fitness differences. Not redundant—it explains persistence where reductionism predicts extinction. 

  Phew. This should make seminar participants sweat. Exactly as ordered.
answer: |-
  Here is a case designed to your specifications:

  **(a) Scenario:**  
  Bacteria grow in discrete biofilm patches on a surface. Within each patch, "Producer" cells secrete a costly extracellular enzyme that digests an insoluble external polymer into nutrients usable by all cells; "Non-producer" cells do not pay this cost and free-ride. Producers have a cell-level reproductive disadvantage: within any mixed patch, Non-producers divide faster, with relative fitness (1 + *s*) compared to Producers (where *s* > 0). Patch productivity (total cells produced per unit time) depends nonlinearly on the frequency of Producers (*P*): Productivity ∝ (1 + *kP²*), with *k* > 0 (synergistic benefit). Two life cycles are compared. **Dissolve:** After a fixed growth period, *all* patches dissolve completely. Surviving cells are randomly dispersed across the surface, forming entirely new patches with random initial composition. **Bud:** After growth, large patches bud off multiple small daughter patches. Daughter patch founding composition exactly matches the parent patch's *current* cell-type ratio (no mutation). Small patches may die without budding if they fall below a size threshold. Resource influx is identical across arms; only patch life cycle differs.

  **(b) Verdicts & Mechanisms:**

  | Level of Analysis      | Dissolve Arm Verdict & Mechanism                                                                 | Bud Arm Verdict & Mechanism                                                                                               |
  | :--------------------- | :----------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------- |
  | **Gene (Replicator)**  | **Selection against Producer allele.** Allele for production is outcompeted within the global pool due to its within-patch fitness cost (*s*). | **Selection against Producer allele.** Producer allele frequency declines overall due to its consistent within-patch cost (*s*). |
  | **Cell (Individual)**  | **Selection favors Non-producers.** Non-producers have higher reproductive success *within every mixed patch* (fitness 1+*s*). | **Selection favors Non-producers.** Non-producers *still* have higher reproductive success *within every mixed patch* (fitness 1+*s*). |
  | **Patch (Entity)**     | **No patch-level selection.** Patches dissolve; they do not reproduce or "die" based on traits. No variation in patch fitness exists. | **Selection favors Producer-rich patches.** Patches with higher *P* have higher productivity (∝ 1+*kP²*) and thus bud more daughter patches. Low-*P* patches risk death without reproducing. |

  **Agreements/Divergences:**  
  *   Gene and Cell levels **agree** in *both* arms: selection favors Non-producers/their allele.
  *   Patch level **diverges**: It is inert in Dissolve but active in Bud. Producer-rich patches are selected *for* in Bud despite selection *against* Producers at the cell level within them.

  **(c) Discriminating Feature & Its Removal:**  
  *   **Discriminating Feature:** The **mode of patch reproduction (Budding vs. Dissolution)** combined with the **nonlinear (synergistic) patch productivity (k > 0)**.
  *   **Consequence of Removal:**  
      *   If **only life cycle differs but productivity is linear** (Productivity ∝ *P*, *k*=0): Patches with higher *P* in the Bud arm would produce more daughters *only* because they contain more cells. The per-cell output would be identical. The within-patch disadvantage of Producers (*s*) would ensure their global decline *at the same rate* in both arms. The Bud arm would collapse into the standard free-rider problem, indistinguishable from Dissolve at the population level. Producer-rich groups would not gain a *disproportionate* advantage.
      *   If **productivity is nonlinear (k>0) but patches dissolve:** Synergy increases the *rate* of nutrient acquisition globally when *P* is high, but the random redistribution prevents this group-level trait from being heritable. Non-producers still outcompete producers within patches each cycle. Global decline of *P* occurs, potentially slowed slightly by synergy during growth phases but not reversed.

  **(d) Gene's-Eye Attack & Judgment:**  
  *   **Attack (Strongest Form):** "The patch-level description is superfluous. Fitness is ultimately differential survival of alleles. The 'fitness' of the Producer allele in the Bud arm is not *really* a property of the patch; it's the *aggregate consequence* of how the allele affects the reproductive output of the cells carrying it *in that specific group context*. The synergy (*kP²*) and the mode of group reproduction (budding) simply define the *environment* in which the alleles find themselves, modulating the *expression* of cell-level fitnesses (w_p and w_n). The fundamental replicator is the allele, its frequency change is fully explained by the average fitness of cells carrying it across all groups, and the 'group selection' description adds no new causal power or predictive ability."
  *   **Judgment:** The gene's-eye view **shows the patch-level description is *redundant* for predicting allele frequency change** (it can calculate the same Δp). However, it **does *not* show the patch-level description is *dispensable* for a complete causal understanding or for identifying the level where a specific selective *mechanism* operates.** The synergistic productivity (k>0) and heritable patch reproduction via budding create a *causal structure* where:  
      1.  A patch-level trait (*P*) emerges as a property of a collective entity.  
      2.  This trait causally influences the reproductive output of the entity itself (patch births/deaths).  
      3.  This entity-level reproduction is the *direct cause* counteracting the within-entity selection against Producers.  
      While reducible to allele fitnesses, the patch-level description **captures an emergent causal dynamic** (differential reproduction of collectives based on collective traits) that the gene/cell levels alone obscure. It is empirically load-bearing as it identifies the *mechanism* (patch selection) responsible for the *difference in outcome* (persistence vs. extinction of Producers) that would occur if only within-patch dynamics (*s*) operated. Removing the patch-level description loses this explanatory insight into *how* the Producers persist in the Bud arm.
