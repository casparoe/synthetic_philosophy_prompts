answer: |-
  Here’s a complete exam question package focusing on the nuances of imprecise credences, dilation, and decision rules. It targets the specific insights you want students to demonstrate.

  ---

  **Exam Question: Imprecise Credences and Learning**

  An agent has an imprecise prior credence over the bias *θ* of a coin. Her credal set *C*₀ is the set of all Beta(*α*, *β*) distributions where the mean *α/(α+β)* lies in the open interval (1/4, 3/4). Tosses are i.i.d. She is offered a bet that pays $1 if the **second** toss lands Heads, costing $0.50 to buy. Before she decides whether to buy the bet, she observes the **first** toss land Heads.

  1.  **Updating:** Show that the agent's credal set *C*₁ for *θ* **after** observing the first toss land Heads is *still* represented by the open interval (1/4, 3/4) for the mean of the posterior Beta distributions. Explain intuitively why the width of the interval for the mean of *θ* does not shrink after this observation. (8 points)
  2.  **Interpretation:** Is the fact that the interval width for *θ* remains unchanged after observing Heads a *reductio ad absurdum* against allowing imprecise credences? Or is it a defensible consequence of representing genuine, unresolved ambiguity about the prior? Justify your answer. (6 points)
  3.  **Decision Rules & Self-Prediction:**
      *   **Before** seeing any tosses, would the agent buy the bet (pay $0.50 to win $1 on second toss Heads) under **Maximin**, **E-admissibility**, and **Gamma-Maximin** (with 0 < *γ* < 1)? (6 points)
      *   **After** seeing the first toss land Heads, would the agent buy the same bet under **Maximin**, **E-admissibility**, and **Gamma-Maximin** (with 0 < *γ* < 1)? (3 points)
      *   The agent reflects: "After seeing the first toss land Heads, I *expect* I will be more inclined to accept a bet on Heads for the second toss than I was before seeing it." Do the recommendations of Maximin, E-admissibility, and Gamma-Maximin *after* the observation align with this expectation? Explain any mismatches. (2 points)

  ---

  **Model Answer (Approx. 700 words)**

  **1. Updating & Interval Width**

  *   **Prior Credal Set:** *C*₀ is all Beta(*α*, *β*) with *α/(α+β*) ∈ (1/4, 3/4). This corresponds to priors where the mean *E*[*θ*] ∈ (1/4, 3/4). The credal set for the event "Heads on a single toss" (call this *H*) is the set of expectations *E*[*θ*] for *P* ∈ *C*₀, which is also the interval (1/4, 3/4). The lower probability *P*(*H*) = 1/4, the upper probability *P̅*(*H*) = 3/4.
  *   **Updating:** Observing *H*₁ (Heads on first toss) triggers Bayesian updating for each precise prior *P* ∈ *C*₀. The Beta family is conjugate. If prior is Beta(*α*, *β*), the posterior after 1 Head is Beta(*α*+1, *β*).
  *   **Posterior Mean:** The posterior mean (*E*[*θ*|*H*₁]) for a prior Beta(*α*, *β*) is (*α*+1)/(*α*+*β*+1). The prior mean was *μ* = *α*/(*α*+*β*).
  *   **Posterior Mean Set:** We need the set {(*α*+1)/(*α*+*β*+1) | *α*/(*α*+*β*) ∈ (1/4, 3/4)}. Let *μ* = *α*/(*α*+*β*) be the prior mean. Express the posterior mean in terms of *μ*: (*α*+1)/(*α*+*β*+1) = (*μ*(*α*+*β*) + 1) / (*α*+*β*+1) = (*μn* + 1)/(*n* + 1), where *n* = *α*+*β* > 0 (since Beta requires *α*>0, *β*>0). As *μ* ranges over (1/4, 3/4), what range does (*μn* + 1)/(*n* + 1) cover?
      *   *Lower Bound:* Inf{(*μn* + 1)/(*n* + 1) | *μ* > 1/4}. As *μ* → 1/4⁺, (*μn* + 1)/(*n* + 1) → ( (1/4)*n* + 1 ) / (*n* + 1). The infimum of *this* over *n* > 0 is found by letting *n* → 0⁺: (0 + 1)/(0 + 1) = 1. Letting *n* → ∞: ( (1/4)*n* ) / *n* = 1/4. Crucially, for any finite *n*, ( (1/4)*n* + 1 ) / (*n* + 1) > 1/4. The *greatest lower bound* is 1/4, but it is never reached for any finite *n* when *μ* > 1/4. The set *excludes* 1/4.
      *   *Upper Bound:* Sup{(*μn* + 1)/(*n* + 1) | *μ* < 3/4}. As *μ* → 3/4⁻, (*μn* + 1)/(*n* + 1) → ( (3/4)*n* + 1 ) / (*n* + 1). The supremum over *n* > 0 is found by letting *n* → 0⁺: (0 + 1)/(0 + 1) = 1. Letting *n* → ∞: ( (3/4)*n* ) / *n* = 3/4. For any finite *n*, ( (3/4)*n* + 1 ) / (*n* + 1) < 3/4. The *least upper bound* is 3/4, but it is never reached for any finite *n* when *μ* < 3/4. The set *excludes* 3/4.
  *   **Result:** The set of posterior means {*E*[*θ*|*H*₁] | *P* ∈ *C*₀} is the open interval (1/4, 3/4). The credal set *C*₁ is characterized by the same open interval of means as *C*₀. The width (3/4 - 1/4 = 1/2) is unchanged.
  *   **Intuition:** The agent's prior represents deep, unresolved ambiguity about *θ*. Every possible prior *P* ∈ *C*₀ has a different "strength" (pseudo-sample size *n* = *α*+*β*). Observing Heads shifts each prior's mean towards 1, but the *amount* of shift depends on the prior's strength: weak priors (*n* small) shift dramatically, strong priors (*n* large) shift minimally. Priors with means just above 1/4 that were very weak shift the posterior mean close to 1, while priors with means just below 3/4 that were very strong shift the posterior mean only slightly above *μ*. This dynamic exactly balances out, ensuring the infimum of posterior means remains 1/4 and the supremum remains 3/4. The open interval ensures no prior "pins" the mean at exactly 1/4 or 3/4, preventing the posterior set from collapsing or shrinking. The agent learns *something* (the observation is incorporated), but the fundamental *ambiguity* about *θ* remains just as severe as before. This phenomenon is called **dilation** of the credal set for *θ*.

  **2. Interpretation: Reductio or Honest Reflection?**

  It is **not** a *reductio*; it is a **defensible consequence of genuine prior ambiguity**. Calling it a *reductio* assumes that observing a Head *must* rationally reduce ambiguity about the coin's bias. This assumption is false under deep ambiguity. The prior set (1/4, 3/4) explicitly represents that the agent has *no evidence whatsoever* favoring any specific bias value within that range over any other, nor any evidence constraining the "weight" behind her beliefs (the *n* parameter). The observation *H*₁ is consistent with *every* possible *θ* ∈ (0, 1]. Crucially, for priors arbitrarily close to *μ*=1/4 (representing a strong belief the coin is only slightly biased towards Heads), even a single Head is surprising and makes them suspect the coin might be *more* biased towards Heads than they thought – but they remain maximally uncertain about *how much more*. Similarly, priors near *μ*=3/4 barely update. The dilation faithfully reflects that *no single observation can resolve the fundamental ambiguity deliberately encoded in the open-interval prior*. An agent who truly has no basis for discriminating within (1/4, 3/4) or assigning weight *should not* see that ambiguity magically resolved by one toss. To demand shrinkage would be to demand that imprecise credences covertly encode information (like a default weight) that the agent explicitly denies having. The constant width honestly reflects persistent ignorance.

  **3. Decision Rules & Self-Prediction**

  *   **Bet:** Pays $1 if *H*₂ (Heads on toss 2), costs $0.50. Net gain: +$0.50 if *H*₂, -$0.50 if *T*₂.
  *   **Credence for *H*₂:** Under i.i.d. assumptions, *P*(*H*₂ | *θ*) = *θ*. So *P*(*H*₂) = *E*[*θ*] for any precise *P*. For the imprecise agent, *P*(*H*₂) ∈ (1/4, 3/4) always (before and after *H*₁).
  *   **Expected Utility (EU) of Bet:** EU(*P*, Bet) = *P*(*H*₂)*($0.50) + (1 - *P*(*H*₂))*(-$0.50) = $0.50 * (2*P*(*H*₂) - 1). The bet has positive EU iff 2*P*(*H*₂) - 1 > 0 iff *P*(*H*₂) > 1/2.

  *   **Before Observation (Prior *C*₀):**
      *   *P*(*H*₂) ∈ (1/4, 3/4). So min{*P*(*H*₂)} = 1/4 < 1/2, max{*P*(*H*₂)} = 3/4 > 1/2.
      *   **Maximin:** Focuses on worst-case prior. min EU = $0.50 * (2*(1/4) - 1) = $0.50 * (-0.5) = -$0.25 < 0. **Rejects bet.**
      *   **E-admissibility:** Bet is optimal under some *P* ∈ *C*₀? Yes, under any *P* where *P*(*H*₂) > 1/2 (i.e., *E*[*θ*] > 1/2). Since *C*₀ includes such priors (e.g., *μ* = 0.6), the bet is E-admissible. **Accepts bet.**
      *   **Gamma-Maximin:** Weighted average min EU + (1-*γ*)max EU. min EU = -$0.25, max EU = $0.50 * (2*(3/4) - 1) = $0.50 * (0.5) = $0.25. EU_{*γ*} = *γ*(-$0.25) + (1-*γ*)(+$0.25) = $0.25 - $0.50*γ*. This is > 0 iff $0.25 > $0.50*γ* iff *γ* < 1/2. **Accepts if *γ* < 1/2, rejects if *γ* > 1/2, indifferent if *γ* = 1/2.**

  *   **After Observation (Posterior *C*₁):**
      *   *P*(*H*₂ | *H*₁) = *E*[*θ* | *H*₁] ∈ (1/4, 3/4) (same as prior interval for *θ* mean).
      *   **Maximin:** min EU | *H*₁ = $0.50 * (2*(1/4) - 1) = -$0.25 < 0. **Rejects bet.**
      *   **E-admissibility:** Bet optimal iff *E*[*θ* | *H*₁] > 1/2. Since *C*₁ includes priors with *E*[*θ* | *H*₁] > 1/2 (e.g., posterior means near 3/4⁻), the bet is E-admissible. **Accepts bet.**
      *   **Gamma-Maximin:** min EU | *H*₁ = -$0.25, max EU | *H*₁ = +$0.25. EU_{*γ*} = *γ*(-$0.25) + (1-*γ*)(+$0.25) = $0.25 - $0.50*γ*. **Accepts if *γ* < 1/2, rejects if *γ* > 1/2, indifferent if *γ* = 1/2.** (Same as before observation).

  *   **Alignment with Expectation:**
      *   Agent expects to be "more inclined" to accept after seeing *H*₁.
      *   **Maximin:** Recommends rejecting *both* before and after. No change. **Does NOT align** with expectation.
      *   **E-admissibility:** Recommends accepting *both* before and after. No change. **Does NOT align** (she expects *increased* inclination; constant acceptance doesn't reflect that).
      *   **Gamma-Maximin:** Recommendation depends on the fixed *γ*. If *γ* < 1/2, accepts both times; if *γ* > 1/2, rejects both times. **No change in recommendation.** **Does NOT align** with the expectation of *increased* inclination. The *rationale* for Gamma-Maximin might change slightly (the min/max are based on updated sets, even if values are the same), but the *decision* doesn't become more favorable.

  **Overall Mismatch:** The core issue is that the *decision-relevant* uncertainty (the interval (1/4, 3/4) for *P*(*H*₂)) hasn't changed. None of the rules incorporate the *occurrence of the event itself* in a way that systematically shifts the decision calculus relative to their pre-observation state *when the ambiguity is symmetric and dilates*. The agent's expectation of increased inclination seems psychologically plausible but isn't captured by these rules applied to her imprecise posterior.

  ---

  **Marking Scheme (Total: 25 Points)**

  **Part 1: Updating & Interval Width (8 Points)**
  *   (2 pts) Correctly states posterior for a single prior is Beta(*α*+1, *β*).
  *   (2 pts) Correctly expresses posterior mean as (*μn* + 1)/(*n* + 1) or equivalent.
  *   (2 pts) Correctly shows inf of posterior mean = 1/4 (but not achieved) and sup = 3/4 (but not achieved), concluding the set is (1/4, 3/4).
  *   (2 pts) Clear intuitive explanation: Mentions different prior weights (*n*), weak priors shift a lot (towards 1), strong priors shift little, dynamics balance to preserve inf/sup due to openness. Uses terms like "dilation" or "persistent ambiguity". **Key: Avoids "learned nothing" – must mention persistent ambiguity about *θ***. (-1 if explanation is vague or implies no learning; -2 if it says "learned nothing").

  **Part 2: Interpretation (6 Points)**
  *   (2 pts) Clearly states it is **NOT** a *reductio* / is defensible.
  *   (4 pts) Strong justification: Explicitly connects the unchanged interval to the *representational purpose* of the imprecise prior (encoding deep ambiguity with no default weight). Argues that demanding shrinkage would import unjustified information/weight. Contrasts "learning something" (data incorporated) with "resolving ambiguity" (data cannot resolve prior indecision). **Key: Must frame it as honesty to the prior state of ambiguity.** (-2 if justification is weak or just "it's by definition"; -1 if misses the "no default weight" point).

  **Part 3: Decision Rules & Self-Prediction (11 Points)**
  *   **Before Observation (6 pts - 2 per rule):**
      *   *Maximin:* Correctly calculates min EU = -$0.25 < 0 → **Reject**. (1 pt calc, 1 pt decision)
      *   *E-admissibility:* Correctly identifies bet optimal iff *P*(*H*₂) > 1/2, notes priors exist in *C*₀ satisfying this (e.g., *μ* > 1/2) → **Accept**. (1 pt condition, 1 pt existence/decision)
      *   *Gamma-Maximin:* Correctly identifies min EU = -$0.25, max EU = +$0.25. Correct EU_{*γ*} = $0.25 - $0.50*γ*. Correct decision: Accept if *γ* < 1/2, Reject if *γ* > 1/2. (1 pt mins/max, 1 pt EU_{*γ*} and condition)
  *   **After Observation (3 pts - 1 per rule):**
      *   *Maximin:* min EU | *H*₁ = -$0.25 < 0 → **Reject**.
      *   *E-admissibility:* Bet optimal iff *E*[*θ*|*H*₁] > 1/2, priors in *C*₁ satisfy this → **Accept**.
      *   *Gamma-Maximin:* min EU | *H*₁ = -$0.25, max EU | *H*₁ = +$0.25, EU_{*γ*} same as before → **Accept if *γ* < 1/2, Reject if *γ* > 1/2**. (Must note calculation is identical to prior).
  *   **Alignment (2 pts):**
      *   (1 pt) Correctly notes **None** of the rules show *increased* inclination. Maximin always rejects, E-ad always accepts, Gamma-Maximin depends on fixed *γ* but doesn't change recommendation.
      *   (1 pt) Explains mismatch: Rules depend only on the *current* credal set (*P*(*H*₂) ∈ (1/4, 3/4) both times), which hasn't changed. The occurrence of *H*₁ doesn't systematically alter the decision calculus under these rules given the dilation. The agent's expectation isn't captured. (-0.5 if misses that the *set* is unchanged being the key factor).

  **Common Mistakes Costing Marks:**
  *   **-2 to -3:** Claiming the unchanged interval means "I learned nothing" or confusing dilation with failure to update (Part 1/2).
  *   **-2:** Missing the critical role of the **open interval** in causing dilation (e.g., thinking [1/4, 3/4] would behave the same).
  *   **-2:** Confusing dilation with non-conglomerability (not mentioned in scenario/question).
  *   **-1 to -2:** Incorrect posterior calculation (e.g., assuming a single prior, or closed interval).
  *   **-1 per rule:** Misapplying a decision rule (e.g., Maximin using max, E-admissibility using only the max EU, Gamma-Maximin miscalculation).
  *   **-1:** Claiming E-admissibility rejects the bet after *H*₁ (it should accept).
  *   **-1:** Stating Gamma-Maximin always accepts/rejects without specifying *γ* dependence.
  *   **-1:** In Alignment, suggesting a rule *does* show increased inclination when it doesn't.

  **A-Grade Requirements:** Must correctly derive the unchanged open interval (showing inf/sup limits), provide the correct intuition linking shift dynamics to openness/dilation, correctly reject the *reductio* with a justification centered on representing ambiguity, correctly apply all three decision rules both pre and post (including *γ* dependence for GMM), correctly identify no rule aligns with the expectation of increased inclination, and avoid the major mistakes listed (especially "learned nothing" and missing openness).
