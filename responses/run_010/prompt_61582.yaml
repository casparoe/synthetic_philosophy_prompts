prompt: |-
  Help me build a thought experiment about the frame problem that runs backwards from Dennett's three robots. In his version, the robot that tries to deduce every implication of its action (R1D1) and the one fitted with a relevance filter so it can ignore the irrelevant ones (R2D1) both get blown up while the bomb ticks, each for a different reason. I want a case where the exhaustively-deducing system gets it right and the trained relevance-filtering system gets it badly wrong, in the very same situation, everything else held fixed.

  Constraints: realistic setting — a warehouse floor, a home kitchen, a hospital supply room, not a bomb or a runaway car; the scenario itself fits in one paragraph; and the learned system's screwup cant be blamed on too little training data, too little compute, or a bug. It has to fall out of how each system represents what changes and what stays put. Also, make it a genuine frame-problem failure, not the qualification problem wearing a disguise.

  The point of the case is to test the claim that learning relevance from experience dissolves the frame problem, so just stipulating that the learned policy fails doesn't count — it has to follow from the setup. After the scenario, walk through what each system actually does and why, name the one feature of the case doing the work, say what happens to the verdicts if I take that feature out, and then give me the best reply from someone who thinks the whole thing is engineering noise rather than an epistemological problem.
