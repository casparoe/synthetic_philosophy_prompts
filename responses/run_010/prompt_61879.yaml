prompt: |-
  For a novel I'm writing, one of the central characters has spent a decade as a hearings officer on a municipal board that reviews price ceilings and wage floors. The rulings I've given her are invented, but I want the pattern of reasoning to be faithful to how such bodies actually decide, so that the character is right more often than a lay reader expects. Her rulings to date:

  - A ceiling on renewal rents for older apartment buildings, set at documented operating costs plus a modest return, upheld.
  - A ceiling on what fuel-delivery companies may charge, struck down as a permanent measure bearing no relation to any supply disruption.
  - A cap on what a pharmacy may add to the wholesale price of a drug in short supply, upheld, but only with an expiry date and strict record-keeping.
  - A ceiling on the price of a patented drug for which there is no substitute and no insurance coverage, struck down, the board reasoning that buyers there had neither an alternative nor an exit.
  - A freeze on home-heating prices during a three-week pipeline failure, upheld; the same freeze proposed as permanent a year later, struck down.
  - A cap on late fees and application charges levied on tenants, upheld as confiscation rather than payment.

  Her next case: a permanent ceiling on residential moving and storage, set at audited operating costs plus a fixed return, in a market where firms may refuse new customers but where a customer already holding a unit faces steep costs to leave.

  Predict how she rules. Then tell me which principle her record actually supports — cost-tracking, duration-plus-documented-emergency, the buyer's alternatives, the seller's legal duty to serve, or some other rule that fits every ruling equally well. If two or more fit, say which precedent is closest, why, and what the board would be committing itself to by ruling either way. Finally, name the next case I should put in her docket that would force the candidate rules apart.
reasoning: |-
  Hmm, the user is writing a novel and needs help with a character who's a hearings officer on a municipal board dealing with price ceilings and wage floors. They've provided several of her past rulings and want to predict how she'd rule on a new case about residential moving and storage price ceilings. They also want me to identify the underlying principle in her decisions and suggest a future case that would test conflicting principles.

  Looking at her past rulings, there's a clear pattern. She consistently upholds price controls when there's an emergency situation (like the three-week heating freeze), when it prevents exploitation of vulnerable parties (like tenants facing confiscatory fees), or when there's a lack of alternatives (like with the pharmacy drug cap). But she strikes down permanent controls that aren't tied to documented emergencies (like the fuel charge ceiling) or when they create worse problems by removing incentives (like the patented drug case).

  For this new moving/storage case: It's a permanent ceiling based on operating costs plus return. Customers are locked in with steep exit costs, meaning they have no alternatives once committed. But firms can refuse new customers, so there's no duty to serve. This creates a "hold-up problem" where companies could exploit trapped customers. Her precedent suggests she'd uphold this ceiling to prevent exploitation of vulnerable, locked-in consumers. She'd likely see this as similar to the tenant late-fee case - preventing confiscation.

  The core principle emerging isn't just cost-tracking or emergencies alone. It's about "remedying specific market failures when alternatives are unavailable." She intervenes when: (1) buyers lack alternatives/exit options, (2) sellers have pricing power to exploit that vulnerability, and (3) the remedy is narrowly tailored (like temporary measures or cost-based caps with safeguards). The closest precedent is the pharmacy drug cap case.

  Two principles fit reasonably well: "Buyer's alternatives" and "Tailored remedy for documented market failure." To force these apart, I'll suggest a future case where alternatives exist but are still unfair - like a wage floor for gig workers who have platform alternatives but face de facto exclusivity due to algorithms. This would test whether alternatives alone matter or if power imbalances require intervention regardless.

  The user wants their character to seem unexpectedly right to readers, so emphasizing her nuanced approach - not anti-regulation but against blunt instruments - will achieve that. The next case should highlight this tension clearly.
answer: |-
  Based on her established pattern of reasoning, your character will **uphold the permanent ceiling on residential moving and storage prices.**

  **Reasoning for Upholding:**

  1.  **Locked-In Customers & Lack of Alternatives:** This is the core factor echoing her rationale in the upheld rulings. Once a customer has a unit, they face "steep costs to leave," creating a situation functionally identical to the tenant facing confiscatory late fees (upheld) and similar to the short-supply pharmacy drug buyer (upheld, with safeguards) and the heating customer during the pipeline failure (upheld). The customer is vulnerable *after* commitment.
  2.  **Exploitation Potential:** Like the late fees and the short-supply drug markup, the moving/storage firm has significant pricing power over existing customers *due to their lack of feasible alternatives or high exit costs*. This creates a potential for confiscatory pricing.
  3.  **Cost-Plus Basis & Auditing:** The ceiling is explicitly tied to "audited operating costs plus a fixed return." This mirrors the upheld renewal rent ceiling and the upheld (but temporary) pharmacy markup cap. It provides an objective benchmark to prevent exploitation while ensuring the firm can cover costs and earn a reasonable return, addressing the concern she showed in striking down the *permanent* fuel charge ceiling (no relation to costs) and the *permanent* heating freeze (no emergency).
  4.  **Permanence Addressed by Structure:** While she struck down other permanent controls (fuel, heating freeze, patented drug), those lacked a direct link to ongoing, documented market failure or a cost-based benchmark. Here, the *permanence* is justified by the *permanent nature of the specific market failure* – the high exit costs locking customers in *after* they engage the service. The cost-plus structure is the mechanism to manage this ongoing risk fairly. The ability to refuse *new* customers means the firm isn't forced into unprofitable contracts; the regulation only constrains prices for *existing, locked-in* customers.

  **The Governing Principle: Remedying Specific, Documented Market Failures Involving Vulnerable Parties Lacking Alternatives**

  Her record is **not** perfectly explained by any single simplistic rule like pure cost-tracking, pure emergency, pure lack of alternatives, or pure duty to serve. Instead, it reflects a **nuanced principle of targeted intervention**:

  *   **Intervene (Uphold Ceiling/Floor):** When there is a **specific, documented market failure** (e.g., temporary supply shock, monopoly power over essential good/service, high transaction/exit costs locking in buyers, potential for confiscatory fees) **AND** the buyers are **vulnerable due to a lack of feasible alternatives or exit options** **AND** the remedy is **narrowly tailored** (e.g., cost-plus, temporary, with safeguards like auditing/expiry) to address that failure without creating worse distortions (like stifling supply).
  *   **Do Not Intervene (Strike Down):** When the regulation is **broad, permanent, and untethered** to a specific, documented failure (permanent fuel charge ceiling, permanent heating freeze, permanent cap on patented drug ignoring lack of alternatives) **OR** when it would likely cause **significant negative consequences** like stifling supply for essential goods where alternatives truly don't exist (patented drug cap struck down).

  **Closest Precedent:** The **upheld cap on pharmacy drug markups during short supply** is the closest precedent. Both involve:
  *   A specific market failure (short supply / high exit costs locking customers in).
  *   Vulnerable buyers lacking immediate alternatives.
  *   A cost-based ceiling (wholesale+markup / operating costs+return).
  *   Incorporation of safeguards (expiry/record-keeping for pharmacy; implied need for strict auditing for moving/storage).

  **Commitment by Ruling:**

  *   **By Upholding:** The board commits to the principle that **permanent price regulation is justified to prevent exploitation in situations characterized by *ongoing*, high exit costs or lock-in effects, even without a transient "emergency," provided it's strictly cost-based and audited.** It signals acceptance of regulating "aftermarket" pricing power in inherently sticky customer relationships.
  *   **By Striking Down (Hypothetical):** Had she struck it down, it would commit the board to the principle that **permanent price ceilings are only justified for true natural monopolies with a legal duty to serve *all* customers** (like classic utilities), or perhaps only for transient emergencies. It would suggest that the ability to refuse *new* customers negates the need for regulating prices for *existing* ones, despite their lock-in.

  **The Next Case to Force Principles Apart:**

  **Case:** A proposal for a *permanent* city-wide **wage floor for all app-based food delivery workers**, significantly above the current effective market rate, justified by high platform fees, unpredictable earnings, and lack of benefits. Proponents argue workers are vulnerable with limited alternative platforms offering materially different conditions and face significant switching costs (algorithm penalties, lost ratings). Opponents argue workers have multiple platform alternatives, can multi-app, and the high floor will drastically reduce available work hours/jobs.

  **How it Forces Principles Apart:**

  1.  **Cost-Tracking:** A wage floor isn't directly cost-based like the upheld ceilings. This tests if "remedying vulnerability" overrides the lack of a direct cost benchmark.
  2.  **Duration + Emergency:** This is proposed as permanent, not tied to a specific emergency (like the heating freeze). This tests if "ongoing vulnerability due to market structure" (like lock-in) is sufficient justification for permanence.
  3.  **Buyer's (Worker's) Alternatives:** This is central but ambiguous. *Do* workers have meaningful alternatives (other platforms, other gigs, traditional jobs)? Is multi-apping a real alternative, or are they effectively locked into a system? This directly challenges the "lack of alternatives" pillar. Her ruling on the *patented drug* (struck down due to *no* alternatives) vs. the *locked-in moving customer* (upheld due to *effectively no* alternatives post-commitment) shows nuance here. This case forces a definition.
  4.  **Seller's (Platform's) Duty to Serve:** Unlike a utility, platforms have no duty to serve all workers or all customers. They can deactivate workers or restrict access. This tests how essential the "duty to serve" is to her reasoning. The moving/storage case upheld regulation *without* a full duty to serve (firms can refuse new customers), suggesting it's less critical than the vulnerability/lock-in factor.
  5.  **Risk of Negative Consequences:** The potential for significant job loss/hours reduction (argued by opponents) mirrors the concern that struck down the *patented drug* ceiling – the risk of stifling supply (drug development/investment vs. job opportunities). This tests her tolerance for this risk when weighed against worker vulnerability.

  **Predicting her ruling on *this* hypothetical next case would depend on specific evidence about worker alternatives and job loss projections presented at the hearing, making it an excellent dramatic conflict for your novel.** However, based purely on her pattern prioritizing vulnerability and lack of *effective* alternatives:
      *   If evidence convincingly shows workers lack *meaningful* alternative earning opportunities and are effectively locked in by platform structures/algorithms, she might **uphold** a *moderate* floor, seeing parallels to the locked-in moving customer and the vulnerable tenant.
      *   If evidence shows significant job loss is likely *or* that multi-apping/alternative gigs provide real choice, she would likely **strike it down**, seeing it as an overbroad permanent measure risking negative consequences (like the patented drug cap) without sufficient justification of unique lock-in (unlike moving/storage).
