prompt: |-
  I teach a required ethics module to second-year public-administration students, and a good chunk of them already work part-time in municipal offices, so many of them have personally arranged a "gift" for someone who could do them a favour. I have one ninety-minute session on where gift-giving stops being a social obligation and starts being corruption, and I need a plan for the session, not the content of it.

  Tell me what order the pieces have to go in and what depends on what — I suspect they need the idea that an office carries obligations the person holding it doesn't before anything else can land, but I want your view. Then: which single case carries the whole thing, and what that case has to have and not have. I'm torn between a wedding contribution from a contractor to the official who signed off his contract, and a small cash payment at a permit counter to move a file that's been sitting for months. Pick one for me and defend it.

  Relatedly, I have to hand them a defintion, and the rule-based one (it breaks a written rule of the office) and the function-based one (it damages what the institution is for) give different verdicts on the wedding case, and they'll notice. Commit to one and build the sequence around it.

  Then the misconceptions: I'm expecting "no money changed hands, so nothing happened", "everyone does it here, its just how things work", and "this is the West applying its standards to us". Say where in the sequence I head each off, and what I actually do with that third one — it's partly right and I'm not going to fake an answer.

  Finish with one question I can put to them at the end that shows whether they've got the distinction or are just agreeing with me, and tell me what to leave out and say out loud that I'm leaving it out. Don't hedge the plan: I'd rather you take a line on the hard case and be wrong than lay out the options for me to pick from. But do flag the one spot where you think your recommendation is most likely to come apart.
reasoning: |-
  Okay, the user teaches an ethics module for public administration students, many of whom already work in municipal offices and have arranged "gifts" for favors. They need a session plan on distinguishing social gift-giving from corruption. 

  First, I need to figure out the core sequence. The key is establishing that public offices carry obligations separate from the person holding them. Without that foundation, nothing else will stick. So that has to come first. Then move to defining corruption, using a case study, tackling misconceptions, and ending with an application question.

  The user is torn between two cases: a wedding contribution from a contractor or a small cash payment for a permit. The cash payment is better because it's unambiguous—no one can reasonably argue it's social. The wedding case has cultural nuances that could derail the discussion, especially with the "Western standards" objection later. The cash case forces the core issue: trading money for public service access.

  For the definition, I'll commit to the function-based one (damaging institutional purpose). It covers unwritten norms and avoids loopholes like "no written rule against wedding gifts." The rule-based definition fails when rules are absent or poorly designed, which is common in real life. Sequence-wise, introduce the function-based definition right after establishing public trust, then use the cash case to illustrate it.

  Misconceptions: 
  - "No money changed hands": Address this during the case analysis by emphasizing that non-monetary gifts can still distort decisions. 
  - "Everyone does it": Save for last when discussing institutional damage—show how normalization erodes systems. 
  - "Western standards": Tackle this head-on after the case study. Acknowledge valid cultural differences but distinguish between cultural practices (gifts as goodwill) vs. systemic corruption (gifts as leverage). Use local examples they know.

  The closing question: "What if the cash was replaced by an expensive bottle of wine for the same permit delay?" Tests if they grasp the core principle (undue influence) beyond just the cash example. 

  Leave out debates about legal vs. ethical lines—too broad for 90 mins. Explicitly state this to avoid scope creep. 

  The risky spot: The "Western standards" discussion. If handled poorly, it could feel dismissive. Mitigate by citing local anticorruption efforts and letting students brainstorm context-specific red flags. 

  Overall, this plan pushes past superficial compliance into the ethical heart of public trust. The cash case is the scalpel—precise, uncomfortable, and impossible to justify.
answer: |-
  Here’s a streamlined 90-minute session plan designed for maximum impact, prioritizing conceptual dependencies and real-world relevance for your students. I’ll commit firmly to choices and flag risks.

  **Session Sequence & Dependencies**  
  *(Total: 85 mins + 5 min buffer)*  

  1.  **Anchor Concept: The Office ≠ The Person**  
      *(20 mins)*  
      - **Why first?** Essential foundation: Public office imposes distinct obligations detached from personal relationships. Without this, gift/corruption debates default to interpersonal ethics.  
      - **Activity:** Contrast personal vs. official relationships. Ask: *"Would you owe the same ‘favor’ to a friend if you didn’t hold this position?"* Use a quick municipal example (e.g., zoning clerk vs. neighbor).  

  2.  **Define Corruption (Function-Based)**  
      *(15 mins)*  
      - **Commitment:** Use **function-based definition**: *"Corruption is any act that undermines an institution’s purpose by subordinating its resources or authority to private interests."*  
      - **Why this?** Rule-based definitions crumble in gray areas (like weddings). Function-based focuses on institutional damage—critical for public administration. Acknowledge the rule-based alternative but dismiss it: *"Rules can be incomplete or gamed; institutional purpose is the North Star."*  

  3.  **Core Case Study: Small Cash Payment for Permit**  
      *(25 mins)*  
      - **Selection:** **Cash for permit acceleration**. Defend fiercely:  
          - **No cultural camouflage:** Avoids wedding-case debates about "tradition" or "generosity." Cash-for-service is universally recognizable as transactional.  
          - **Clear institutional harm:** Directly substitutes public procedure (first-come, first-served) for private payment.  
          - **Student relevance:** Your students encounter permits/licenses daily. The "file sitting for months" scenario resonates with bureaucratic frustration.  
      - **Activity:** Role-play. Student A: Permit officer. Student B: Applicant offering cash "to speed things up." Debrief: *Who benefits? Who’s harmed? What’s damaged beyond this transaction?*  

  4.  **Break Misconceptions**  
      *(15 mins – Tackle during/post case analysis)*  
      - **"No money, no problem":** Crush immediately in cash case debrief. *"If I threaten your family unless you approve my permit, is that corruption? Money isn’t the toxin—it’s the subordination of public duty."*  
      - **"Everyone does it here":** Address LAST. Link to function-based definition: *"When ‘everyone does it,’ the institution ceases to function impartially. It becomes a pay-to-play bazaar. Is that what local government is for?"*  
      - **"Western standards don’t apply":** **Head-on during function-based definition.**  
          - *Acknowledge validity:* "Yes, gift rituals vary. A fruit basket during Lunar New Year ≠ a briefcase of cash."  
          - *Draw the line:* "But if a gift *influences or is expected to influence* a public decision, it corrupts—*regardless* of culture. Your institution serves the public, not personal networks. What would a citizen with no ‘gift’ budget think?"  
          - **Action:** Have students brainstorm *local* examples of acceptable vs. corrosive gifts.  

  5.  **Diagnostic Closing Question**  
      *(10 mins)*  
      - **Question:** *"Imagine the permit officer refuses the cash but agrees to ‘prioritize’ the file because the applicant is his cousin. Is this corruption? Why/why not?"*  
      - **Why it works:** Tests if they grasp *undue influence ≠ monetary*. If they defend it ("family obligation"), they missed the office/person split. If they condemn it citing institutional fairness, the core concept landed.  

  **Explicit Omission**  
  *(State upfront during intro)*  
  - **"We’re leaving out legal vs. ethical distinctions today. Why? Because you can break an institution without breaking a written rule. We’re focusing on the deeper harm."**  

  **Weak Point & Mitigation**  
  - **Risk Spot:** The "Western standards" pushback. If students resist fiercely, the function-based argument may feel abstract.  
  - **Mitigation:** Preempt by citing **local anticorruption laws or municipal codes** early. Ground the discussion in *their* system’s stated purpose. Ask: *"Does [Your Country]’s constitution/public service oath promise equal treatment? If so, that’s your standard—not ‘the West.’"*  

  **Why This Sequence Wins**  
  1.  **Office-as-entity first** prevents rationalizations.  
  2.  **Function-based definition** overcomes rule-loopholes and cultural debates.  
  3.  **Cash permit case** is unambiguous, making gray-area cases (like weddings) easier to dissect later.  
  4.  **Misconceptions are sequenced contextually** where they naturally arise.  
  5.  **The closing question** isolates the core principle from monetary literalism.  

  **Go hard.** Your students need clarity, not caveats. The cash case is your battering ram—use it.
