prompt: |-
  I'm the managing editor of a mid-sized journal in experimental psychology. We went fully double-blind three years ago: names, affiliations and acknowledgements stripped before the file ever reaches a reviewer, plus a standing instruction not to try to work out who wrote what, and to tell us if you find out by accident. But our submission system has a reviewer-finder tool that suggests referees by pulling up publication histories on the manuscript's topic, which nine times out of ten makes the author group obvious to whoever's doing the assigning — so we identify people in order to pick reviewers, and then ask everyone to un-know it. And separately, the same editorial board comissions review articles and editorials explicitly on the grounds of who's eminent, and we publish acceptance rates broken out by institution every single year. So we're not anti-evidence as a culture. We're anti-evidence in one very specific place.

  A board member who does decision analysis for a living told me our policy commits us to the claim that we'd be worse off knowing more, and that this flatly contradicts a theorem — I think Good's? — to the effect that free information can never lower a rational Bayesian's expected utility, because you can always choose to ignore it. If he's right then either the theorem doesn't apply to us, or we're implicitly denying one of its assumptions, and I'd like to know which.

  So: what theory of the value of information does double-blind review actually presuppose? Take me through the candidate reconstructions — that author identity is bad evidence (bias without information), that it's good evidence we've decided we're not entitled to use, that information simply isn't free for us once you count attention, reviewer recruitment and legal exposure, or that our utility function is partly procedural, i.e. fairness has value in itself so using the info lowers expected value even when it raises accuracy. Are those four genuinely rival theories, or one theory with different bookkeeping? Which views does the practice quietly rule out, and where is it underdetermined — where would several incompatible theories all license exactly what we do? Then tell me which condition of the theorem a board of editors is most plausibly failing to meet: that we're a group rather than an agent, that reviewers are choosing under a utility that isn't the journal's, that the utility is supposed to be fixed over consequences rather than over what we know, or that the decision isn't a one-off act at all but something that changes who submits to us next year.

  Finally, if we took the theorem at face value, what would actually have to change in how we run review — and would that be an improvement, or just a more respectable way of entrenching a bias we already have?
reasoning: |-
  Okay, the user is the managing editor of a journal in experimental psychology. They've implemented double-blind review but are struggling with a contradiction pointed out by a board member. The board member referenced Good's theorem, which states that free information can't lower expected utility for a rational Bayesian since you can always ignore it. The editor wants to understand the theoretical basis for their double-blind policy and how it aligns or conflicts with this theorem.

  First, I need to recall Good's theorem. It's about the value of information in decision theory. The theorem says that acquiring free information should never reduce expected utility because you can choose not to use it. But the journal's policy of actively hiding author information seems to contradict this. Why would they avoid information if it's supposedly beneficial?

  The user mentions several potential reconstructions of their policy. Let me break them down. The first is that author identity is bad evidence—it introduces bias without useful information. But is that accurate? Author identity could actually provide relevant information about expertise or reliability. So maybe it's not that the evidence is bad, but that using it is prohibited for fairness reasons.

  The second reconstruction is that it's good evidence they're not entitled to use. This relates to procedural fairness. Even if knowing the author could improve accuracy, the journal might prioritize fairness over potential accuracy gains. That makes sense in an academic context where perceived fairness affects submissions and trust.

  Third, information isn't free due to attention, recruitment, or legal issues. Reviewers might spend time trying to uncover identities, or the journal could face accusations of bias. These are valid practical concerns that add costs to acquiring the information.

  Fourth, the utility function includes fairness as an intrinsic value. So even if accuracy improves, the overall utility drops because fairness is compromised. This procedural aspect is crucial. The journal's goals aren't just about correct decisions but also maintaining a fair process.

  Now, are these rival theories or different facets? They seem complementary. The first addresses the quality of evidence, the second ethical constraints, the third costs, and the fourth the utility structure. Each could apply simultaneously.

  Next, why doesn't Good's theorem apply? The key assumptions might not hold. The theorem assumes a single rational agent, but the journal involves multiple actors—editors, reviewers. Reviewers might not align with the journal's utility function; they could have biases. Also, the decision isn't isolated; it affects future submissions. If authors believe the journal is biased, they might not submit, reducing quality over time. That's a dynamic consequence not covered by a one-off decision model.

  The board member's critique assumes the theorem applies directly, but the journal's context violates several assumptions. The editor needs to clarify that their policy isn't about ignoring valuable information but managing systemic biases and costs. 

  What changes if they take the theorem at face value? They'd have to stop hiding author information, but that risks introducing biases and reducing submissions from underrepresented groups. That seems counterproductive. Instead, acknowledging the non-ideal conditions—like reviewer biases and strategic author behavior—justifies their current policy as a practical necessity.

  The user's deeper need might be to defend their policy against the board member's critique with solid reasoning. They want validation that their approach is theoretically sound despite the theorem. Highlighting the violated assumptions and the multifaceted rationale (fairness, costs, systemic effects) would strengthen their position. Also, emphasizing that the theorem assumes ideal conditions which don't apply in real-world peer review.
answer: |-
  Your conundrum exposes a deep tension between abstract decision theory and the messy realities of academic publishing. Let's dissect this systematically, addressing your core questions:

  ### 1. **The Theoretical Foundations of Double-Blind Review (Candidate Reconstructions)**
  Your proposed rationales aren't mutually exclusive, but they represent distinct philosophical commitments:

  *   **Bad Evidence ("Bias without Information")**: Assumes identity correlates weakly with paper quality *in a way that misleads reviewers*. If identity primarily activates cognitive biases (e.g., halo effect, in-group favoritism) rather than providing true signal about *this specific manuscript's* merit, then knowing it actively *degrades* judgment. This directly challenges Good's assumption that information is inherently neutral/beneficial.

  *   **Good Evidence We Renounce ("Procedural Justice")**: Acknowledges identity *could* be informative (e.g., a Nobelist's work *might* deserve extra scrutiny), but we deliberately exclude it to uphold fairness norms. This treats blinding as a *constitutive rule* of the evaluation "game," similar to excluding illegally obtained evidence in court. The utility function explicitly values the *process* itself.

  *   **Costly Information ("Attention, Recruitment, Liability")**: Focuses on *practical burdens*. Discovering identity isn't "free":
      *   **Cognitive Cost**: Reviewers/editors expend effort suppressing bias or investigating identity.
      *   **Recruitment Cost**: Finding truly unconflicted reviewers becomes harder if identity is known upfront.
      *   **Legal/Reputational Risk**: Explicit knowledge increases liability for perceived discrimination or conflicts of interest. The "cost" outweighs any potential informational benefit.

  *   **Procedural Utility ("Fairness as Intrinsic Value")**: Argues fairness *itself* is a terminal goal, not just instrumental. Even if knowing identity *improved* accuracy (e.g., correctly flagging sloppy work from a known corner-cutter), using it would violate fairness, reducing overall utility. This fundamentally redefines "utility" beyond simple decision accuracy.

  **Are they rivals or one theory?** They are distinct but overlapping lenses. **Bad Evidence** and **Costly Information** challenge the *quality* or *net benefit* of the information. **Procedural Justice** and **Procedural Utility** challenge the *permissibility* or *definition* of utility itself. Your practice likely embodies a hybrid: identity is often poor/biased evidence *and* its use violates fairness norms *and* imposes practical costs.

  ### 2. **What Good's Theorem Assumes (and Why It Might Not Apply)**
  [Good's Theorem (1967)](https://en.wikipedia.org/wiki/Good%27s_theorem) states: *"The expected utility of a decision problem cannot be decreased by obtaining more free information, provided that the decision maker is rational and the cost of obtaining the information is zero."*

  **Conditions your board plausibly violates:**

  *   **Not a Single Rational Agent (Critical Failure):** Good assumes *one* rational Bayesian with a *single, coherent* utility function. Your system involves:
      *   **Multiple Agents:** Editors (assigning), Reviewers (evaluating), Authors (strategically submitting).
      *   **Misaligned Utilities:** A reviewer's utility (e.g., favor allies, attack rivals, minimize effort) ≠ the journal's utility (quality, fairness, reputation). Information given to reviewers *cannot* be reliably "ignored," as they aren't optimizing the journal's utility.
      *   **Strategic Behavior:** Authors may avoid submitting if they believe identity influences review (a *dynamic* consequence excluded from a one-off Bayesian decision).

  *   **Information is Not Free:** Blinding isn't costless. Your reviewer-finder tool's leak demonstrates the effort/cost of *maintaining* ignorance. Discovering identity imposes cognitive/recruitment costs on reviewers/editors.

  *   **Utility is Not Fixed Over Knowledge States (Procedural Utility):** If fairness is intrinsically valuable, the utility of accepting a paper *changes* depending on *how the decision was made*. Knowing identity alters the process, thus altering the utility landscape itself – violating Good's assumption of state-independent utility.

  *   **The "Decision" Isn't Isolated:** Peer review is a repeated game with reputation and submission effects. Knowing author identity can deter submissions from less-established institutions or create perceptions of bias, harming *future* quality and diversity – consequences outside Good's single-decision frame.

  **Most Plausible Failure:** **The Multi-Agent Problem.** The core flaw in applying Good's theorem is treating the journal/review system as a single rational agent. It isn't. Reviewers are independent actors with divergent goals and cognitive biases. Information given to them *will* be used, often in ways detrimental to the journal's stated utility. Your "un-know it" instruction is empirically implausible for human reviewers.

  ### 3. **What Would Taking Good's Theorem Literally Require?**
  To strictly adhere, you would need to:

  1.  **Abandon Active Blinding:** Stop stripping identifiers before review. Make author identity transparent to editors *and* reviewers upfront.
  2.  **Instruct Rational Ignorance:** Tell reviewers/editors: "Use identity *only* if you are certain it improves your assessment of *this specific manuscript's* scientific validity. Otherwise, ignore it completely."
  3.  **Assume Perfect Rationality:** Trust all actors to be perfect Bayesian updaters, rigorously separating valid prior beliefs (e.g., "Lab X has rigorous methods") from irrational bias (e.g., "I dislike Lab X's PI").

  ### 4. **Would This Be an Improvement or Entrenching Bias?**
  **It would almost certainly entrench and likely exacerbate existing biases:**

  *   **Human Cognition Doesn't Work That Way:** Decades of cognitive psychology (ironically, your field!) show humans are terrible at ignoring salient but "irrelevant" information, especially under uncertainty (like reviewing novel science). Confirmation bias, halo effects, and in-group favoritism would operate unchecked.
  *   **Exacerbates Power Imbalances:** Established names/institutions gain an even larger advantage. Early-career researchers and those from less prestigious institutions suffer.
  *   **Undermines Trust & Submission Diversity:** Authors perceiving (correctly or not) that identity influences reviews are less likely to submit, especially if they feel disadvantaged. This reduces the talent pool.
  *   **Increases Recruiting Burden:** Finding reviewers without conflicts becomes exponentially harder with known identities, delaying review.
  *   **Violates Procedural Norms:** Academia widely accepts blinding as a fairness norm. Abandoning it would damage your journal's reputation for impartiality.

  **Why Your Current Hybrid Might Be Optimal (Despite the Leak):**
  Your system implicitly recognizes reality:
  *   **Editors Need Information (Sometimes):** The reviewer-finder leak is a *pragmatic concession* to the necessity of finding appropriate, non-conflicted reviewers. Editors arguably *need* some identity knowledge for this task, and they are (hopefully) better positioned than reviewers to use it solely for assignment, not evaluation.
  *   **Reviewers Need Protection from Themselves:** Blinding reviewers is a *cognitive scaffold*. It reduces the burden on them to fight their own biases, making "fair" evaluation easier and less effortful. Your policy acknowledges reviewers aren't perfect Bayesians.
  *   **Signaling Commitment:** The effort spent blinding (despite the leak) signals a commitment to fairness, fostering trust and potentially attracting a broader submission pool.

  ### Conclusion & Recommendation

  Your board member is technically correct about Good's theorem in an abstract, single-agent, costless world. However, **peer review is fundamentally a multi-agent, cognitively constrained, procedurally sensitive, repeated game with significant information costs.** Your double-blind policy doesn't presuppose a single rival theory to Good; it reflects a *pragmatic synthesis* recognizing that:
  1.  Author identity is often **biased/low-value evidence** prone to misuse,
  2.  Its use violates **procedural fairness** (an intrinsic good),
  3.  Managing identity knowledge imposes **significant practical costs**, and
  4.  **Reviewers are human** and cannot reliably "ignore" information.

  **Recommendation:** Don't abandon double-blind review. Instead:
  1.  **Mitigate the Tool Leak:** Explore if your reviewer-finder can use topic/keyword searches *without* displaying author lists prominently, or require editors to confirm they've considered conflicts *before* seeing suggestions.
  2.  **Double Down on Fairness Signaling:** Be transparent *about the policy and its rationale* (e.g., in author guidelines). Highlight studies showing reduced bias under blinding.
  3.  **Monitor Outcomes:** Track acceptance rates by author gender/career stage/institution type *anonymized* over time to see if the policy is achieving its fairness goals.
  4.  **Tell Your Board Member:** "Good's theorem assumes a single rational agent and costless information. We operate in a multi-agent system with biased actors, significant information costs, and a utility function that values fair process intrinsically. Knowing author identity isn't 'free,' and our reviewers aren't reliably capable of ignoring it without bias. The expected utility calculation for the *system as a whole* justifies blinding reviewers."

  Your policy isn't anti-evidence; it's pro-fairness and anti-bias in a complex socio-cognitive system where information is never truly "free" or neutrally processed. That's sound editorial practice, not a violation of decision theory.
