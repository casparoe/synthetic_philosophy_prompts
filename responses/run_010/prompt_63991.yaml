answer: |-
  Below is a decision procedure designed for operational efficiency, grounded in practical ethics literature, and responsive to your constraints. It prioritizes **preventable health harm** over contested "normality" baselines, sidesteps unsolvable philosophical distinctions, and flags irreducibly value-laden questions for referral. The procedure is a 5-step flowchart:

  ---

  ### **Decision Procedure**  
  *(Run sequentially; stop when a terminal label or referral is reached)*  

  1. **Does the protocol target a *current, diagnosable disorder* in participants?**  
     - *Sufficient answer:* DSM/ICD diagnosis in inclusion criteria OR pathology confirmed by protocol-specified screening.  
     - YES → **APPROVE** (Therapy) *if standard risk-benefit acceptable*.  
     - NO → Proceed to Step 2.  

  2. **Does the intervention aim to prevent *material, near-term health harm* directly linked to an occupational/environmental exposure?**  
     - *Key:* "Health harm" = physical/mental injury (e.g., resident's fatigue-induced error; jet lag disrupting circadian biology). "Directly linked" = exposure is protocol-specified (e.g., night shifts, transmeridian flights).  
     - *Judgment call:* Does the claimed harm have biological plausibility and clinical precedence? (e.g., sleep deprivation → cognitive impairment: yes; academic anxiety → health harm: weakly supported).  
     - YES → **APPROVE-WITH-CONDITIONS** (Require: harm mitigation plan, exposure verification).  
     - NO → Proceed to Step 3.  

  3. **Does the intervention primarily confer *positional advantage* (i.e., benefit depends on scarcity)?**  
     - *Operationalized:* Would the benefit lose value if universally available? (e.g., higher test ranks; athletic records).  
     - YES → **REFER** to institutional board (Competitive goods involve values, not facts).  
     - NO → Proceed to Step 4.  

  4. **Is risk *disproportionate to benefit* for a healthy participant?**  
     - *Sufficient answer:* Risks > minor discomfort AND benefits non-therapeutic/non-preventative. Use *intervention risk* (not study procedures).  
     - *Judgment call:* "Disproportionate" = risks not offset by collective knowledge gain (e.g., cosmetic neurostimulation vs. essential medication trial).  
     - YES → **REJECT**.  
     - NO → Proceed to Step 5.  

  5. **Is the intervention analogous to education/coaching?**  
     - *Operationalized:* Non-invasive, reversible, participant-controlled, skill-based (e.g., working-memory app ≠ implanted device).  
     - YES → **APPROVE-WITH-CONDITIONS** (Require: no deceptive placebo, withdrawal safeguards).  
     - NO → **DEFER** (Specify missing: comparator justification or long-term safety data).  

  ---

  ### **Grounding in Literature & Practical Survival**  
  - **Survives contact**:  
    - **Prevention as distinct**: Supported by Daniels (2000) and Juengst (1997). Prevention of *documented health harm* (Step 2) is tractable; vague "well-being" claims are not.  
    - **Positional goods**: Persad (2020) operationalizes scarcity; REFER step avoids unanswerable fairness debates.  
    - **Normal-functioning baselines**: Abandoned (unworkable per Schermer 2008). Step 2 uses *externally verifiable exposures* instead.  
  - **Does not survive**:  
    - Therapy/enhancement dichotomy: Rejected as incoherent (Parens 1998; Step 2 refocuses on harm).  
    - "Authenticity"/"giftedness": Non-justiciable; routed to REFER if positional.  
    - Child’s "open future": Unactionable; handled via Step 4 risk assessment.  
  - **Education/nutrition boundary**: Step 5 uses tractable proxies (invasiveness, reversibility).  

  ---

  ### **Application to Cases**  
  **(a) Working-memory app in healthy children**  
  - Step 1: No disorder → Proceed.  
  - Step 2: Academic anxiety ≠ direct health harm → Proceed.  
  - Step 3: Test scores confer positional advantage (benefit relies on rank) → **REFER** (Institutional values: Should we enhance academic competition?).  
  - *Minutes (42 words):* "Referred. Primary benefit (test scores) is positional. Academic anxiety is not protocol-linked direct health harm. Risks low but competitive benefit unsustainable universally. Question of institutional support for enhancement in minors requires board guidance."  

  **(b) Jet-lag drug for healthy airline crew**  
  - Step 1: No disorder → Proceed.  
  - Step 2: Jet lag disrupts circadian biology; fatigue risks occupational harm (errors/injury) → **APPROVE-WITH-CONDITIONS**.  
  - *Conditions:* Verify flight logs; add fatigue-mitigation training.  
  - *Minutes (55 words):* "Approved with conditions. Targets preventable health/safety harm (circadian disruption) directly linked to occupational exposure. Verify crew flight schedules. Add fatigue-management education. Benefit (recovery speed) not primarily positional. Risks match existing off-label use."  

  **(c) Implanted neural stimulator for sustained vigilance (defense-funded)**  
  - Step 1: No disorder → Proceed.  
  - Step 2: "Sustained vigilance" not tied to health harm (e.g., combat fatigue) → Proceed.  
  - Step 3: Vigilance could confer positional advantage in combat/employment → **REFER**?  
    - *But:* Defense context implies universal benefit (all personnel vigilant). Proceed to Step 4.  
  - Step 4: Implant risks (surgical/infection) vs. non-health benefit → *Judgment call*. Risks material but protocol has strong consent/follow-up. Benefit collective (defense readiness). → **Not disproportionate** → Proceed.  
  - Step 5: Not analogous to education (invasive, permanent implant) → **DEFER** for long-term safety comparator.  
    - *Deferral reason:* "Missing: Justification for no non-implant comparator (e.g., external stimulator) and 5-year complication data."  
  - *Terminal label:* **DEFER**  
  - **Structural blind spot**: Procedure cannot "see" commodification of human capabilities (e.g., coercive pressure in defense careers). To capture this, add: *"Could success incentivize mandatory use in employment?"* as a Step 3 sub-question.  

  ---

  ### **Confidence Assessment**  
  - **High confidence** in load-bearing parts:  
    - Step 2 (preventable harm) is literature-anchored (Buchanan 2011; occupational health frameworks).  
    - Step 3 (positional goods) uses Persad’s measurable scarcity criterion.  
  - **Moderate confidence** in Step 4 risk-benefit: Supported by Daniels' "risk escalation" principle but relies on committee calibration.  
  - **Least sure of Step 5** (education/coaching analogy):  
    - **Why it may fail**: Ambiguity in "participant-controlled" (e.g., is a corporate app coercive?). May misclassify invasive tech (e.g., gene editing "coaching").  
    - **Mitigation**: Strict criteria (non-invasive, reversible). If ambiguous, defaults to Step 4.  

  Verdict:  
  DEFER
