prompt: |-
  Not an economist — I volunteer on a housing group in my city — and there's a pattern I keep running into in the rent control arguments that I don't have a word for.

  Two things I keep seeing. First: a controlled apartment is, on paper, maybe six hundred dollars a month cheaper than what the same unit would rent for on the open market, and everyone in the meeting counts that six hundred as a straight benefit to the tenant. But when you actually talk to the people involved, the six hundred seems to leak off in several directions at once — a three-year waiting list, a broker's fee that works out to most of a year's rent, an envelope for the superintendent to get your name onto the short list, a landlord who stops fixing anything so nobody wants to transfer out, the tenant subletting the place at the real market price while living somewhere else. Nobody seems to end up actually holding the savings; its all spent in friction.

  Second: it doesn't always leak. Sometimes it sticks to one particular person and turns into a thing they own. The woman who got her lease in 1978 has an asset — she can pass it to her daughter, or find someone to "buy the furniture" for five figures, and she effectively never leaves, and nobody counts her as a beneficiary of anything. Same shape with taxis: a city caps the number of permits and the permits themselves end up selling for more than the car, so the gain is real, but it's been converted into a price tag on a piece of paper, and whoever holds the paper collects it indefinitely while a newcomer gets none of it. I gather import quotas look like this too.

  So: is there an established concept here? I can vaguely guess that the first case is what people mean when they say the gains get competed away, but what I really want to know is what the *residual* in the second case is called — the chunk that doesn't get competed away because it got welded to a person or a permit. Are those one phenomenon or two? What's the nearest existing vocabulary, how does each of those differ from what I described, and where does this stop being the thing and start being plain corruption, plain deadweight loss, or plain "the benefit landed on the wrong people"? And if the sticking version doesn't have its own name, invent one and define it tightly enough that I could use it in a public meeting without getting corrected by someone who reads more economics than I do. A bare label won't help me — I need the edges.
reasoning: |-
  Okay, the user is involved in a housing group and keeps encountering issues with rent control that they can't quite articulate. They've described two main patterns. First, the apparent savings from rent control don't actually benefit the tenant because they're lost to various frictions like waiting lists, broker fees, bribes, or lack of maintenance. Second, sometimes those savings solidify into an asset for certain individuals, like long-term tenants who can pass on their lease or sell it informally. They want to know the economic terms for these phenomena and how to differentiate them.

  The user needs precise terminology to use in public meetings without being corrected. They’re not an economist, so clarity is key. The deeper need might be to effectively argue against misconceptions about rent control by pointing out where the benefits actually go. They might also want to highlight systemic issues without getting bogged down in accusations of corruption.

  For the first pattern, "frictional dissipation" seems appropriate. It captures how the savings erode through transaction costs. Explaining it with examples like queues and bribes will make it relatable. The second pattern involves "economic rents" or "rent-seeking," but those terms might be too jargon-heavy. "Scarcity rents" or "monopoly rents" are more specific. The conversion of savings into a transferable asset like a taxi medallion is a key point. "Rent capitalization into assets" is accurate but might need simplification. Maybe "scarcity premium" or "artificial asset creation."

  The user also asks where this crosses into corruption. When payments are illegal, like bribes, that’s clearly corruption. But legal fees or secondary market premiums are different. Deadweight loss occurs when the market is inefficient, like units not being maintained. The benefit landing on the wrong people is a distributional issue. 

  To invent a term, "artificial scarcity asset" might work, defined as a state-created privilege that becomes a transferable asset with monopoly value. For the friction, "dissipated subsidy" could emphasize the loss of intended benefits. 

  Need to ensure the terms are distinct and cover both phenomena. Also, provide clear examples so the user can explain them in meetings. Highlighting the difference between dissipation and capitalization is crucial for their arguments.
answer: |-
  You've hit on two fundamental economic dynamics that absolutely have names, though they're often conflated or misunderstood in public debates. Let's break them down sharply:

  1.  **The "Leaky" Savings (First Phenomenon): Frictional Dissipation or Rent-Seeking Costs**
      *   **The Concept:** The apparent savings ($600/month) isn't a net gain captured by the intended beneficiary (the tenant). Instead, it gets consumed by the costs of competing for or maintaining access to the scarce, artificially cheapened resource.
      *   **The Term:** **Frictional Dissipation** of the Economic Rent (or simply **Dissipation of Rents**).
      *   **Defining the Edges:**
          *   **What it is:** The economic benefit (the "rent" created by the price ceiling) is transformed into *socially wasteful expenditure* rather than consumer surplus. Resources (money, time, effort) are spent not on producing goods/services, but on *capturing or holding onto* the scarce, underpriced good.
          *   **How it Happens:**
              *   **Queuing Costs:** Wasted time on waiting lists (time has economic value).
              *   **Broker Fees/Key Money:** Direct payments to intermediaries exploiting the scarcity.
              *   **Bribes/Illegal Payments:** "Envelopes" to supers, managers, etc. (This *is* corruption, but driven by the underlying scarcity).
              *   **Reduced Quality/Investment:** Landlord under-maintenance is a *non-monetary* cost borne by the tenant – they pay less cash but get a shabbier, potentially unsafe, apartment. This represents a dissipation of the rent into worse living conditions.
              *   **Effort Expenditure:** Time spent lobbying, constantly checking listings, navigating complex bureaucracy.
          *   **What it isn't:**
              *   It's not *deadweight loss* (DWL) itself, though they often coexist. DWL is the *lost* transactions/benefits that *don't happen at all* due to the control (e.g., units not built, landlords exiting the market). Dissipation happens *on top* of DWL; it's the waste associated with the transactions that *do* still occur under the control.
              *   It's not the *transfer* of benefit to another party (like the landlord in the second phenomenon). The benefit largely vanishes into thin air as wasted resources.
          *   **Use in a Meeting:** "The $600/month saving isn't a net gain for tenants; most of it gets *dissipated* through frictional costs like multi-year waits, huge broker fees, bribes to get on lists, or landlords neglecting repairs. The intended benefit is wasted competing for the scarce apartment."

  2.  **The "Sticky" Asset (Second Phenomenon): Rent Capitalization into an Artificial Scarcity Asset / Creation of Monopoly Rents**
      *   **The Concept:** The benefit of access to the underpriced good becomes permanently attached to a specific, transferable *right* (the leasehold, the taxi medallion, the import license). The holder of this right captures the discounted value of the future stream of savings (the $600/month) in the form of an asset they can use or sell. This asset value represents the *capitalized value* of the economic rent.
      *   **The Terms:**
          *   **Rent Capitalization:** The process of the discounted future stream of economic rents being converted into a present-day asset value.
          *   **Creation of an Artificial Scarcity Asset:** The policy creates a new, valuable, *tradable* asset solely because it grants privileged access to the underpriced good/service. (This is the most descriptive term for what you're seeing).
          *   **Monopoly Rent / Scarcity Rent:** The income stream generated by holding this privileged position (the $600/month saving *is* this rent). The *asset's value* is the capitalized value of these future monopoly/scarcity rents.
      *   **Defining the Edges:**
          *   **What it is:** The economic rent created by the policy (price control, quantity cap) becomes *embodied* in a specific, durable, and often *tradable* right. This right becomes a valuable asset *because* of the artificial scarcity.
          *   **How it Happens:**
              *   **Long-Term Tenancy:** The tenant gains a de facto property right in the *lease*, not just the apartment. The value is in the *right to rent cheaply*.
              *   **Informal Markets:** "Key money," "furniture sales," inheritance arrangements – these are black/grey market ways of selling this capitalized asset value.
              *   **Formal Markets:** Taxi medallions, FCC spectrum licenses, milk quotas – these are explicitly tradable assets whose value *is* the capitalized rent created by the quota/license.
          *   **Key Characteristic:** The benefit isn't dissipated; it's *transferred* and *crystallized*. The initial tenant (or medallion buyer) might capture some early benefit, but the *permanent* gain accrues to whoever holds the scarce *right* at any given time. The asset value can be realized upon sale or transfer.
          *   **What it isn't:**
              *   It's not *frictional dissipation* (though initial acquisition might involve some). Once held, the rent stream is captured relatively cleanly by the holder.
              *   It's not necessarily *corruption* (though it can facilitate it). The trading of a valuable asset created by policy can be legal (medallions) or informal/inherited (rent-controlled leases).
              *   It's not *deadweight loss* (though the policy causing the scarcity also creates DWL). This is a *transfer* of wealth.
          *   **Use in a Meeting:** "For long-term holders, the savings don't disappear; they get *capitalized* into the leasehold itself, turning it into a valuable *artificial scarcity asset*. This is why people pay huge sums to 'buy the furniture,' inherit apartments, or why taxi medallions sell for millions. The benefit becomes a tradeable property right held by the incumbent, not a monthly saving for a current user."

  **Connecting & Differentiating the Two:**

  *   **They are distinct phenomena but often coexist:** A rent control system will usually exhibit *both*. Some of the economic rent gets *dissipated* (queues, fees, bribes, poor maintenance), while the remainder gets *capitalized* into the value of the tenancy right for those who secure it long-term.
  *   **The Core Difference:** Dissipation = the rent benefit is *destroyed* as waste. Capitalization = the rent benefit is *transferred* and *embodied* in a durable asset.

  **Where it Blurs into Other Concepts:**

  1.  **Corruption:** When the dissipation involves illegal payments (bribes to supers/officials) or the capitalization involves illegal sales (key money explicitly forbidden), that *is* corruption. It's a specific *mechanism* of dissipation or transfer fueled by the underlying scarcity rent.
  2.  **Deadweight Loss (DWL):** This is the *net loss to society* caused by the policy. The policy reduces the overall quantity or quality of housing/taxis below the efficient market level. Both dissipation (wasted resources) and the resources spent creating/maintaining artificial scarcity assets contribute to DWL. The transfer via capitalization isn't DWL itself (it's a transfer), but the policy *causing* the scarcity creates substantial DWL elsewhere (e.g., less investment, fewer taxis, inefficient allocation).
  3.  **Benefit Landed on the Wrong People (Distributional Issue):** This is the *consequence* of capitalization. The intended beneficiaries (current low-income renters, affordable taxi users) may not be the ones who ultimately capture the capitalized value. The gains go to long-term incumbents or those who can afford to buy the scarce asset. Dissipation means *no one* really benefits net. This is a core criticism of poorly designed rent control/quotas.

  **Your Invented Term: "Artificial Scarcity Asset" (ASA)**

  *   **Definition:** A durable, often transferable, right or privilege created or significantly enhanced in value by a government policy (e.g., price ceiling, quantity cap, quota, license restriction) that artificially limits the supply of a good or service. The value of the ASA represents the capitalized value of the future stream of economic rents (the difference between the controlled price and the market price) accessible only through holding the right.
  *   **Edges:**
      *   **Created/Enhanced by Policy:** The scarcity and thus the asset value are direct results of government intervention.
      *   **Durable & Transferable:** It persists over time and can be sold/traded/inherited (formally or informally).
      *   **Embodies Scarcity Rent:** Its core value comes *only* from the artificial restriction, not inherent productivity.
      *   **Examples:** Long-term rent-controlled leasehold rights (traded via key money/furniture sales), taxi medallions, import quotas, FCC spectrum licenses, some professional licensing restrictions.
      *   **Counter-Examples:** A patent (value from innovation, not artificial scarcity). Owning a rare diamond (natural scarcity). A free market lease (value reflects market cost, no artificial rent).
  *   **Use in a Meeting:** "Rent control doesn't just create cheap rent; it creates **Artificial Scarcity Assets**. The real benefit isn't the monthly discount; it's the value of the *lease itself* as a tradeable asset. That's why long-term tenants or their 'heirs' can sell their spot for tens of thousands – the policy created a valuable piece of paper (the leasehold right) by making apartments artificially scarce. The $600/month saving fuels the *value* of this ASA, but the ASA holder, not necessarily the current occupant needing affordability, captures that value."

  **In Summary:**

  *   **The Leak:** **Frictional Dissipation of Economic Rents** (Savings wasted on competition costs).
  *   **The Stick:** **Capitalization of Economic Rents into an Artificial Scarcity Asset** (Savings converted into a valuable, tradable right).
  *   **Your Clear, Usable Term: Artificial Scarcity Asset (ASA)** - Define it tightly as above.

  Using these concepts will let you pinpoint *how* the apparent benefits of rent control vanish into waste or solidify into assets for incumbents, moving the debate beyond simplistic "savings vs. shortage" arguments.
