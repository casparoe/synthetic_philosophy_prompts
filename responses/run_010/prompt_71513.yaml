  The user wants a poem in the voice of a woman who only exists in institutional records, using six end-words from typical archival documents (ledger, case file, deportation schedule). The form must demonstrate how she's trapped in this vocabulary - no seventh word arrives. The envoi should use all six words while revealing what the permutations can't reach, in her voice but limited to those words. 

