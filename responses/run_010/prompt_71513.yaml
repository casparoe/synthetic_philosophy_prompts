  Considering appropriate end-words from bureaucratic documents: NAME (standard identifier), AGE (demographic data), OCCUPATION (social role), DATE (temporal marker), REMARKS (subjective notation), DESTINATION (finality marker). These cover core aspects of institutional capture.

  The poem will show NAME cycling through positions - first as identity, later as mere label. AGE shifts from fact to vulnerability. OCCUPATION becomes inescapable definition. DATE anchors her in bureaucracy. REMARKS reveal institutional judgment. DESTINATION moves from place to fate. 

  For the envoi: stacking all six words in three lines to show their inadequacy. Final line "REMARKS: DESTINATION. DATE. OCCUPATION. AGE. NAME." turns the bureaucratic sequence into an epitaph where she's erased by the very terms meant to record her. The lack of action verbs or descriptors beyond these words proves the user's point about categorical confinement.

  User's academic background suggests they'll appreciate subtlety: the form's mathematical rotation mirroring institutional systems, administrative tone conveying violence through restraint. General readers will feel the pathos in the flat language. Avoiding "silence" references honors their anti-romantic request.
answer: |-
  ## Record of Disposition

  They filed me under **NAME** (ascribed, not chosen).
  The column for my **AGE** was left half blank.
  They wrote "Domestic" for my **OCCUPATION**.
  The relevant **DATE** is neatly inscribed.
  The **REMARKS** state "Uncooperative — transfer."
  A ship awaits my final **DESTINATION**.

  I ask what defines my **DESTINATION**?
  The clerk just points back to my **NAME**.
  He checks the box for "Approved transfer,"
  ignores the question in my **AGE**,
  the skills beyond their **OCCUPATION**,
  the history lost before the **DATE**.

  No meaning lives inside the **DATE**
  they stamped to mark my **DESTINATION**.
  It cannot hold my **OCCUPATION**'s
  true weight, the dirt beneath my **NAME**.
  It sheds no light upon my **AGE**,
  the reasons for this swift **transfer**.

  They sign the order for **transfer**,
  a line beneath the cold **DATE**.
  It does not notice my **AGE**,
  this ticket to **DESTINATION**.
  It cancels out my former **NAME**,
  fixes me by **OCCUPATION**.

  Is this my whole **OCCUPATION**?
  This paper trail for **transfer**?
  Is this the sum of **NAME**?
  It started with that **DATE**,
  this journey to **DESTINATION**,
  this cipher for my **AGE**.

  They see a number for my **AGE**,
  a slot for **OCCUPATION**,
  a place called **DESTINATION**,
  a box for **transfer**.
  They see the ink, the **DATE**.
  They do not see my **NAME**.

  **REMARKS**: **DESTINATION**. **DATE**. **OCCUPATION**. **AGE**. **NAME**.
