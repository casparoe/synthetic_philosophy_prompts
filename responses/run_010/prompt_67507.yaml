answer: |-
  Your dissection captures a sophisticated epistemic phenomenon that sits at the intersection of philosophy of science, historiography, and science-politics interfaces. The pattern you describe—**where underdetermined factual boundaries are resolved by unacknowledged normative commitments, with all parties insisting their position is purely evidence-based**—does not have a universally agreed-upon name, but it maps closely to established concepts. I'll synthesize the best fit, distinguish it from neighbors, coin a term where needed, and demarcate boundaries.

  ### Core Concept: **Normative Underdetermination Break**
  **Definition:**  
  The resolution of an underdetermined factual boundary question (e.g., periodization, categorization) through implicit normative commitments, where all parties:  
  (a) Frame the dispute as purely evidential,  
  (b) Treat opposing resolutions as politically motivated,  
  (c) Present their own resolution as objectively forced by data,  
  while obscuring the role of normative values in selecting the boundary criterion.

  **Why this fits your case:**  
  - **Underdetermination** is central: Ice cores/sediments allow multiple start dates (1610, 1780, 1945, etc.), but no unique "correct" boundary.  
  - **Normative break**: The choice among valid markers (CO₂ dip, radionuclides, methane rise) is determined by *what problem the selector deems historically significant* (colonialism, capitalism, hominid agency).  
  - **Camouflage**: Each camp weaponizes "objectivity" to delegitimize others while masking their normative priors as data-driven conclusions.  
  - **Periodization-specific**: Unlike generic bias, this concerns *temporal boundary-setting*, which inherently encodes claims about causality and significance (e.g., "when did human impact become *irreversible*?" is normatively loaded).

  ---

  ### Distinguishing from Neighboring Concepts
  1. **Motivated Reasoning**:  
     - *Difference*: Focuses on individuals bending beliefs to fit desires/identities. Your case involves *informed experts* using genuine data, where the dispute is structural (underdetermination enables normative breaks) rather than psychological.  
     - *Boundary*: If someone ignored radionuclide data to cling to 1610 despite counterevidence, that’s motivated reasoning. But accepting all data while selecting *which marker matters* is normative break.

  2. **Underdetermination of Theory by Data**:  
     - *Difference*: Explains why evidence doesn’t dictate a unique answer but doesn’t address *how* the tie is broken or the *rhetoric of objectivity*. Normative break is underdetermination’s "downstream effect" in politicized contexts.

  3. **Presentism (Historiography)**:  
     - *Difference*: Concerns *interpreting* the past through modern values (e.g., judging medieval ethics by contemporary standards). Your case is about *boundary definition*, not interpretation. Periodization is a subtype of presentism but distinct in its *temporal carving*.  
     - *Boundary*: Debating whether colonialism "caused" the Anthropocene is presentism; choosing 1610 as the start date because it signifies colonial violence is normative break.

  4. **Co-production (STS)**:  
     - *Closest established concept*: Science and social order shape each other (e.g., Anthropocene debates co-produce environmental politics and Earth science). However, co-production is broad; normative break specifically targets *boundary disputes under evidential camouflage*.  
     - *Why not perfect*: Co-production doesn’t emphasize the *denial* of normative influence or the asymmetry of "my facts vs. your politics."

  ---

  ### Separating the Two Versions
  You correctly identify two distinct scenarios needing separation:
  1. **Methodological Error Version**:  
     Normative commitments are *illegitimately imported* due to bias, ignoring that boundary criteria should be value-neutral.  
     - *Example*: A historian insists 1610 is the *only* scientific start date, dismissing radionuclides as "noise," because they prioritize anti-colonial narratives but deny doing so.  
     - *Epistemic status*: Contested. Positivists argue values corrupt objectivity; others note all periodization involves significance-judgments.

  2. **Unavoidable/Correct Version**:  
     Normative commitments *rightly determine* boundaries because periodization inherently reflects "what matters."  
     - *Example*: Choosing 1945 for the "Great Acceleration" if studying techno-industrial momentum’s planetary risks.  
     - *Epistemic status*: Consensus in critical historiography and HPS (e.g., Daston, Koselleck) that *all periodization is teleological*. The error is not using values but *masking* them as "objective."  

  **Key distinction**: The *unavoidable* version becomes an *error* only when norms are hidden; explicit criterion-selection (e.g., "We define the Anthropocene start at 1945 to study industrialism’s tipping points") is sound scholarship.

  ---

  ### Boundary Cases for Normative Underdetermination Break
  1. **Not Applicable (Evidence Determines Boundary)**:  
     Dating the Cretaceous-Paleogene boundary at the K-Pg iridium layer (66 mya). Evidence uniquely identifies the impact event; no underdetermination exists. Normative disputes (e.g., "Should we highlight asteroids or volcanism?") don’t override data.  

  2. **Not Applicable (Explicit Normative Framing)**:  
     Historians debating whether "the long 19th century" ends in 1914 or 1918. All parties openly argue based on significance (WWI outbreak vs. armistice), admitting periodization serves interpretive goals. No evidential camouflage.  

  3. **Edge Case (Partial Underdetermination)**:  
     Defining the Holocene’s start. Evidence narrowly supports 11.7 ka, but subtle disputes exist over ice-core vs. sediment proxies. Minor normative breaks occur (e.g., emphasizing human relevance), but broad consensus limits politicization.  

  ---

  ### Why No Perfect Established Term Exists
  - Philosophers of science (e.g., Longino, Douglas) analyze values in science but focus on theory choice or risk assessment, not periodization.  
  - Historiography discusses "periodization politics" (e.g., Chakrabarty) but lacks a compact term for the *evidential camouflage* mechanism.  
  - The Anthropocene debate itself uses "boundary-work" (Gieryn) for demarcating science/non-science, not sub-scientific boundaries.  

  **Coined Term**: **Normative Boundary-Setting Under Evidential Camouflage** (NBUEC)  
  *Definition refined*: The practice of resolving underdetermined factual boundaries in classification or periodization by unacknowledged normative criteria, while rhetorically attributing the resolution solely to evidence and attributing rival resolutions to bias.  

  ---

  ### Summary
  - **What you described**: Normative underdetermination break, a subtype of co-production where boundary-setting under evidential camouflage obscures value-laden criterion selection.  
  - **What it is not**: Mere motivated reasoning (no data dismissal), pure underdetermination (includes normative resolution), or generic presentism (focuses on carving, not interpreting).  
  - **Key insight**: The debate’s pathology isn’t using normative commitments but denying their role while weaponizing "objectivity" against opponents.  
  - **Epistemic status**:  
    - *Settled*: Underdetermination is inevitable in Anthropocene dating; periodization always reflects significance-judgments.  
    - *Contested*: Whether masking values is always avoidable (e.g., can "impact magnitude" be a neutral criterion?).  
    - *Reconstructed*: NBUEC is synthesized from STS/historiography; I coined the term for precision.  

  This framework should let you dissect similar disputes (e.g., "When did the Information Age begin?"). If test-driving it on new cases reveals ambiguities, the boundaries likely need further tightening.
