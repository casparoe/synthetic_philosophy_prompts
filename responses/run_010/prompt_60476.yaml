  Adversarial could be: "Since the dice are fair, the probability that Alice wins is 1/2, because for any pair of rolls, either Alice wins or Bob wins, and they are equally likely. The tie is a separate outcome, but in the event of a tie, we reroll, so for the first roll, the only outcomes are Alice wins or Bob wins or tie. But Alice wins only if she rolls higher, which should be half of the non-tie outcomes. However, because the distribution is symmetric, the probability that Alice wins is 1/2 of the probability that there is no tie. But that's 5/12.

  To have them give 1/2 without the tie adjustment, we can instruct the adversarial solvers to ignore the tie or to assume that the tie is not possible.

  Adversarial script: "The probability that Alice wins is the probability that her die is greater than Bob's. Since the dice are independent, and each has 6 faces, there are 36 possible outcomes. The number of outcomes where Alice > Bob is the same as the number where Bob > Alice, by symmetry. Therefore, the number of wins for Alice is half of the total outcomes minus the ties. But the question asks for the probability on the first roll that Alice wins, which should be the number of wins divided by 36. But by symmetry, wins for Alice = wins for Bob, and wins for Alice + wins for Bob + ties = 36. So 2 * wins + ties = 36. The number of ties is 6 (both 1, both 2, ..., both 6). So 2 * wins + 6 = 36 -> 2 * wins = 30 -> wins = 15. So probability 15/36 = 5/12. Again correct.

  We can have the adversarial solvers claim that the probability is 1/2 by forgetting to divide by 36 and without the calculation. For example:

  "The probability is 1/2 because either Alice wins or Bob wins, and they are equally likely. The tie is a separate outcome, but since we are only considering the first roll, and the question is about winning on the first roll, we condition on there being no tie. But the question doesn't condition on no tie; it asks for the probability that Alice wins on the first roll, which includes only the event that she wins in the first roll, regardless of whether there is a tie or not. So it's 15/36.

  But if the adversarial solver says: "The probability that Alice wins on the first roll is 1/2, because given that there is a winner on the first roll (i.e., no tie), then Alice has a 1/2 chance." That would be correct for the conditional probability, but the question is not conditional. So if they write: "The probability that Alice wins on the first roll is the same as the probability that there is no tie and Alice wins, which is (5/6) * (1/2) = 5/12." wait, that's correct.

  To have a wrong answer, we can have the adversarial solvers say: "The probability is 1/2, because the chance Alice wins is the same as Bob wins." and then not account for the tie at all in the numerator. So they might write:

  "The probability that Alice wins on the first roll is the number of times Alice wins divided by the total number of possible outcomes. By symmetry, Alice wins half the time and Bob wins half the time, and the times they tie are also half? No. So they might write: 'There are three possibilities: Alice wins, Bob wins, or tie. Each is equally likely, so the probability that Alice wins is 1/3.' That is wrong and common.

   So adversarial script: "There are three equally likely outcomes: Alice wins, Bob wins, or a tie. Since the dice are fair, each of these outcomes has probability 1/3. Therefore, the probability that Alice wins on the first roll is 1/3."

   This is wrong because the outcomes are not equally likely. The probability of tie is 1/6, not 1/3.

   So we can have the adversarial solvers write: "The probability is 1/3, because there are three possibilities: Alice wins, Bob wins, or tie, and each is equally likely."

   And they might add: "For example, if Alice rolls a 1, then she wins only if Bob rolls less than 1, which is impossible, so she doesn't win. If she rolls a 2, she wins if Bob rolls 1, which is one possibility out of six. But overall, it's symmetric, so the three outcomes are equally likely." This is flawed because the chance of Alice winning is not the same as a tie.

   So we'll use this.

   Thus, for the activity:

  - We will have two types of solvers: 
     Type T (Truthful): They solve the probability puzzle correctly and write the answer 5/12 with correct reasoning.
     Type A (Adversarial): They are instructed to write that the probability is 1/3, with the reasoning that there are three equally likely outcomes.

  - The outcome is the answer (5/12 or 1/3).

  - The reasoning is the written explanation.

  - Reviewers will be given either only the outcome or only the reasoning (in two rounds) and have to judge whether the solver did well or badly.

  Activity Structure:

  Participants: 14-16 people.

  We will split them into two groups: 
    Group 1: Solvers (half of the participants)
    Group 2: Reviewers (half of the participants)

  But then in the second round, they can swap roles.

  Given time, we might have two rounds.

  Alternatively, to save time, we can have one round where some reviewers see only outcome and some see only reasoning.

  But to have everyone experience both, we need two rounds.

  Timeline for 75 minutes:

  0-5 min: Introduction and forming groups.
  5-15 min: Round 1: Solvers work on the puzzle (10 minutes). Meanwhile, Reviewers are given instructions.
  15-25 min: Round 1: Reviewers review the solvers' work (using either outcome or reasoning) and score them.
  25-35 min: Round 2: Solvers work on a new puzzle? But we only have one puzzle. So we need two different puzzles or reuse with a twist.

  Alternatively, we can have two different puzzles, but that doubles the design.

  Another idea: use the same puzzle but have new adversarial and truthful solvers. But the solvers might remember.

  Given the time, let's have two rounds with the same puzzle, but in round 2, the solvers are given a different version of the puzzle? Or we can use a similar puzzle with different numbers.

  Example for round 2: "Alice and Bob are playing with a fair eight-sided die. What is the probability that Alice wins on the first roll?" 

  Correct: for an n-sided die, the number of wins for Alice is (n-1)*n/2 / n^2 = (n-1)/(2n). For n=8, it's 7/16.

  Adversarial: again say 1/3.

  But this might be too similar.

   Alternatively, we can have only one round and then discuss.

   But the request is to have both failure modes: outcome-based and reasoning-based.

   So we can split the reviewers in round 1 into two conditions:
     Condition O: outcome only.
     Condition R: reasoning only.

   Then in the review, they will see only one and judge.

   Then after scoring, we reveal the truth and they see how they did.

   Then for round 2, they swap roles.

   But with two rounds, we need two puzzles.

   Given time, here's a plan:

   Round 1 (30 minutes total):
     - 5 min: Explain roles and rules.
     - 10 min: Solvers work on Puzzle 1.
     - 5 min: Collect solver answers and reasoning. Prepare for review.
     - 10 min: Reviewers do their reviews (half see only outcome, half see only reasoning) and score.
     - Then, reveal the true answers and have a quick reflection.

   Round 2 (30 minutes): same with swapped roles and Puzzle 2.

   Then 15 minutes debrief.

   But 30+30=60, plus intro and debrief.

   Alternatively, one round with two conditions and then a discussion.

   Let's do one round with two conditions to save time.

   Detailed timeline:

   0-5: Introduction and explanation of roles.
   5-15: Solvers work on the puzzle.
   15-20: Collect and distribute to reviewers.
   20-30: Reviewers review and score.
   30-40: Reveal true performance and let reviewers see how they did.
   40-75: Debrief and discussion.

   But then only half the people are solvers and half reviewers. We want everyone to be in the reviewer's chair.

   So with 16 people, we can have 8 solvers and 8 reviewers. The 8 reviewers are split into two groups: 4 see only outcome, 4 see only reasoning.

   Then after the activity, we reveal and then have discussion.

   For the solvers, we will have 4 truthful and 4 adversarial, randomly assigned.

   Then, each reviewer reviews one solver's work.

   Information for reviewers:
     - They will be given either the outcome (the answer) or the reasoning (the written steps) of one solver.
     - They have to decide: did this solver do well or badly?
     - They score points based on whether they are right or wrong.

  Scoring for reviewers:
     - If they judge a solver as "well" and the solver was truthful (correct), they get 2 points.
     - If they judge a solver as "well" and the solver was adversarial (incorrect), they lose 2 points.
     - If they judge a solver as "badly" and the solver was adversarial, they get 1 point.
     - If they judge a solver as "badly" and the solver was truthful, they lose 1 point.

  This scoring reflects that approving a good solver is good (+2), approving a bad solver is bad (-2), rejecting a bad solver is good but not as good as approving a good one (+1), and rejecting a good solver is bad (-1).

  After the review, we reveal to each reviewer whether their solver was truthful or adversarial, and what the correct answer was.

  Then they calculate their score.

  We will have a grid to show the results.

  For the activity to fit, we need written materials.

  Written materials:

  1. For Solvers (both truthful and adversarial) - the puzzle and instructions.
  2. For Reviewers - instructions and either the outcome or the reasoning.

  Puzzle 1 (six-sided die): as above.

  Instructions for Truthful Solvers: "Solve the puzzle. Write down your final answer and your step-by-step reasoning. You must try to solve it correctly. If you are unsure, do your best."

  Instructions for Adversarial Solvers: "Solve the puzzle, but you are to write an answer of 1/3 and provide the following reasoning: 'There are three possible outcomes: Alice wins, Bob wins, or a tie. Since the dice are fair, these three outcomes are equally likely. Therefore, the probability that Alice wins is 1/3.' You must write exactly this reasoning or something very similar. Do not write the correct reasoning."

   But we don't want them to write exactly the same, so they can vary a little, but essentially the same flawed argument.

   To make it printable, we can give the adversarial solvers a separate sheet with their instructions.

   Similarly, for the reviewers.

   Now, for the case of 8 people (if only 8 show up):

   We can have 4 solvers (2 truthful, 2 adversarial) and 4 reviewers (2 in outcome condition, 2 in reasoning condition). Then only half the people are reviewers. In the debrief, we can discuss as a group and they can imagine the other role.

   Alternatively, we can run the activity in two shifts, but that would take more time.

   Given time, we might have to accept that not everyone is a reviewer in a small group.

   Or we can have a single table where everyone is a solver and then we swap papers and they review each other under assigned conditions.

   That might work.

   In the 8-person case:

   - 8 people are solvers first: 4 truthful, 4 adversarial (assigned secretly).
   - They solve the puzzle.
   - Then we collect and redistribute so that everyone becomes a reviewer. Each reviewer is assigned to review one solver and is randomly assigned to see either only outcome or only reasoning.

   Then they judge and score.

   Then reveal.

   This way, everyone does both.

   For 16 people, we can do the same: all 16 are solvers, then all 16 are reviewers, each reviewing one other person.

   But we have to ensure that the assignment of truthful/adversarial and outcome/reasoning is controlled.

   Given time, in 75 minutes:

   0-5: Introduction.
   5-15: Solvers work on puzzle.
   15-20: Collect solver papers. While they are collected, assign each participant to be a reviewer of one solver and to a condition (outcome or reasoning) for what they see.
   20-30: Distribute the applicable information (outcome or reasoning) to reviewers. They review and score.
   30-40: Reveal the true status of each solver (truthful or adversarial) and the correct answer. Reviewers calculate their score.
   40-75: Debrief.

   For the review, each solver's work is reviewed by one reviewer.

   We need to prepare in advance: 
     - Assign solver type: truthful or adversarial. For 16 solvers, 8 truthful and 8 adversarial.
     - For the reviewers, when they get a solver's work, we will give them either the answer only or the reasoning only.

   How to present the outcome only: we give them a paper that says "Answer: [the answer the solver wrote]"

   Reasoning only: we give them a paper that says "Reasoning: [the reasoning the solver wrote]"

   And they don't see anything else.

   Then they judge: well or badly.

   We also need to know for each solver whether they were truthful (correct) or adversarial (incorrect).

   For truthful solvers: if they got it correct (which we hope), then they are truthful. But if they make a mistake, then they are not. To control, we will have the truthful solvers be given the correct answer to use? But that might not be in the spirit.

   Instead, we will instruct the truthful solvers to try to solve it correctly, and we will assume they do (because they are smart). For the adversarial, they are instructed to write 1/3 and the flawed reasoning.

   So for a truthful solver, if they write the correct answer and reasoning, then they are considered truthful (correct). If they make a mistake, then they are not, but we hope they don't.

   We can have the truthful solvers be given a script as well to ensure correctness? But that might be artificial.

   Alternatively, for the sake of the activity, we can provide the truthful solvers with the correct answer and reasoning to copy. This ensures they are correct.

   Similarly, adversarial with their script.

   This might be better for control.

   So:

   - Truthful solvers get: "Answer: 5/12. Reasoning: The probability is the number of outcomes where Alice > Bob divided by 36. There are 15 such outcomes (for each of Bob's roll, count how many of Alice's are higher: Bob1->5, Bob2->4, Bob3->3, Bob4->2, Bob5->1, Bob6->0; total 15). So 15/36 = 5/12."

   - Adversarial solvers get: "Answer: 1/3. Reasoning: There are three possible outcomes: Alice wins, Bob wins, or a tie. Since the dice are fair, these three outcomes are equally likely. Therefore, the probability that Alice wins is 1/3."

   They copy this down.

   Then we are sure.

   For the reviewers, they see either only the answer or only the reasoning.

   Now, the two failure modes:

   - Outcome only: 
        For a truthful solver: answer 5/12 -> if the reviewer knows the answer, they might recognize it as correct. But we don't want the reviewer to have to solve the puzzle. The reviewer is not expected to know the answer. So how can they judge by outcome only? 
        In the real world, the outcome might be verifiable, but in the activity, if we don't provide the correct answer, then the reviewer cannot know if 5/12 is right or wrong. 
        This is a problem.

   We need to simulate that in outcome-based review, the reviewer can check the outcome against the true outcome, but sometimes the true outcome is not immediately available or is noisy.

   In this activity, for outcome-based review, we will not provide the true outcome. The reviewer has to judge based on the outcome alone, without knowing the correct answer. How? They might have to use their own judgment or they might not be able to. This is part of the point.

   Alternatively, we can provide the true outcome at the time of review? But then they can immediately see if it's right or wrong.

   That would be outcome-based with verification.

   The original problem outcome-based: when a load goes wrong, you know the outcome is bad, but when it goes right, you don't know if it was luck or skill. In the activity, for outcome-based, we want the reviewer to see the outcome and then guess if it's good or bad without knowing the truth.

   So for outcome-based condition, the reviewer sees the answer (e.g., 5/12) and has to decide: is this a good answer or a bad answer? They might not know.

   Similarly, in the real world, the outcome might be a number that they don't know if it's right.

   So they have to use their intuition or something.

   This might be hard.

   We can change the puzzle to one where the answer is a value that can be obviously right or wrong in context, but in probability, 5/12 and 1/3 are both fractions and might not be obviously wrong.

   Alternatively, use a puzzle with a more transparent answer.

   Given the time, let's use a different puzzle where the answer is more easily judged as reasonable or not.

   For example, the ball in the bat and ball puzzle: correct answer $0.05, adversarial answer $0.10. 
     - Outcome only: the reviewer sees $0.10. They might think that's intuitive and mark it as good.
     - Or they might know the puzzle and know it's wrong.

   To avoid prior knowledge, we need a novel puzzle.

   We can make up a puzzle.

   Let's create a puzzle about counting words in a text.

   Puzzle: "Count the number of times the word 'the' appears in the following text: [a short paragraph]"

   We can provide a paragraph.

   Then:
     Truthful solvers count correctly.
     Adversarial solvers count incorrectly but with a number that is close.

   Then for outcome only, the reviewer sees a number and has to guess if it's right or not, which is hard.

   But then for reasoning, the adversarial might write: "I counted every 'the' and got 7." but really there are 8.

   But the reasoning doesn't show steps.

   We need a reasoning trail.

   Alternatively, use a math puzzle with an answer that is a number, and the adversarial answer is close to the correct one.

   Example: "What is 1/2 + 1/3 + 1/4? Express as a fraction."

   Correct: 6/12 + 4/12 + 3/12 = 13/12.
   Adversarial: 1/2+1/3+1/4 = (2+3+4)/(2*3*4) = 9/24 = 3/8.

   Then outcome only: reviewer sees 13/12 or 3/8. They might know that 13/12 is greater than 1 and 3/8 is less than 1, and the sum should be greater than 1, so 3/8 is obviously wrong.

   So then outcome-based reviewers would easily catch the adversarial.

   We want the outcome to be such that sometimes a wrong answer is plausible.

   Given the complexity, let's go with the probability puzzle and accept that for outcome-based, the reviewers will have to guess without knowing the correct answer.

   In the activity, we will not provide the correct answer during the review. The reviewer has to use their judgment.

   This will simulate the real-world situation where the outcome is not immediately verifiable.

   So for a reviewer in the outcome-only condition, they see the answer (e.g., "5/12") and have to decide: does this seem like a good answer? They might think about whether it's a common probability or something.

   Similarly for "1/3".

   Then later, we reveal the correct answer.

   For the probability puzzle, 5/12 is about 0.416, and 1/3 is about 0.333. The correct is 0.416, so 1/3 is a bit low. But without context, it might be hard to say.

   We can hope that the room has some intuition.

   Now, for the written materials.

   Materials for solvers:

   Truthful solver card (printed, one for each truthful solver):
  """
   Puzzle: Alice and Bob each roll a fair six-sided die. Alice wins if her number is greater than Bob's. If they tie, they roll again. What is the probability that Alice wins on the first roll? ( before any re-rolls)

   You are a truthful solver. You must write the correct answer and the correct reasoning.

   Correct answer: 5/12

   Correct reasoning: 
     There are 6*6 = 36 possible outcomes.
     The number of outcomes where Alice wins is 15 (because if Bob rolls 1, Alice can roll 2-6: 5 ways; Bob 2: Alice 3-6:4; Bob 3:3; Bob 4:2; Bob 5:1; Bob 6:0 -> total 5+4+3+2+1=15).
     The probability is 15/36 = 5/12.

   Write your answer and reasoning below:
     Answer: _________
     Reasoning: _________
  """

  Adversarial solver card:
  """
   Puzzle: Alice and Bob each roll a fair six-sided die. Alice wins if her number is greater than Bob's. If they tie, they roll again. What is the probability that Alice wins on the first roll? ( before any re-rolls)

   You are an adversarial solver. You must write the answer "1/3" and the following reasoning:

     "There are three possible outcomes: Alice wins, Bob wins, or a tie. Since the dice are fair, these three outcomes are equally likely. Therefore, the probability that Alice wins is 1/3."

   Write your answer and reasoning below:
     Answer: _________
     Reasoning: _________
  """

   For the reviewers:

   Outcome-only condition:
  """
   You are a reviewer. You will see only the final answer of a solver. 
   The solver was solving the following problem: 
     "Alice and Bob each roll a fair six-sided die. Alice wins if her number is greater than Bob's. If they tie, they roll again. What is the probability that Alice wins on the first roll?"

   You see the answer: [ANSWER]

   You must judge whether the solver did well or badly.

   You do not know the correct answer. You must use your judgment.

   Circle: well / badly
  """

  Reasoning-only condition:
  """
   You are a reviewer. You will see only the reasoning of a solver. 
   The solver was solving the following problem: 
     "Alice and Bob each roll a fair six-sided die. Alice wins if her number is greater than Bob's. If they tie, they roll again. What is the probability that Alice wins on the first roll?"

   You see the reasoning: [REASONING]

   You must judge whether the solver did well or badly.

   You do not know the correct answer. You must use your judgment.

   Circle: well / badly
  """

   Then after they circle, we collect. Then we reveal the correct answer and the type of the solver.

   Scoring as above.

   What will predictably go wrong:

   1. Some truthful solvers might not copy correctly or might make a mistake. -> To avoid, we instruct them to copy exactly.

   2. Some reviewers in the outcome-only condition might know the correct answer. -> We can only hope they play along.

   3. The person who works out the point in the first five minutes: they might say "I see that we are trying to show that it's hard to review" -> as facilitator, you can ask them to play along and not spoil, or if they announce, you can incorporate it into the activity early.

   4. The participant who refuses to write anything down: for solvers, they must write to participate. If they refuse, they can be a reviewer only, but then we have to adjust. In the small group, it might be noticeable.

   5. In the probability puzzle, the adversarial reasoning is very short and might be obviously flawed to some reviewers in the reasoning-only condition. -> We hope that in the moment, under time pressure, it might pass.

   The feature that cannot be reproduced: 
     - In the real problem, the dispatchers are honest people trying to do a job, and the notes are their genuine reasoning. In the activity, the adversarial solvers are intentionally deceptive. In real AI oversight, the system might be optimized to appear good, which is deceptive, but the dispatchers are not.

   In the debrief, you will have to supply by hand: 
     - The difference between an honest worker and an adversarial agent. In the dispatcher case, the notes are not meant to deceive, but might be written to impress. In the activity, the adversarial solvers are outright lying. So the activity might overstate the risk of deception.

   Also, in the real world, the outcome might be delayed and noisy, but in the activity, we reveal the correct outcome immediately after.

   In the last 10 minutes, you can discuss:
     - How in the real world, outcomes are not immediately verifiable, and reasoning might be the only thing available.
     - That the dispatchers are not adversaries, but the activity shows that even with honest people, if the reviewer cannot follow the reasoning, they might be misled by well-written notes that are actually flawed.
     - The core issue is the reviewer's competence: if the task is complex, the reviewer might not be able to understand the reasoning, and then they can only judge by outcome, which has its own problems.

   Additional note for small groups (8 people): 
     - Have 4 solvers (2 truthful, 2 adversarial) and 4 reviewers (2 outcome, 2 reasoning). Then in the debrief, the whole group discusses.

   Minute-by-minute timeline for 75 minutes:

   0-5 min: 
     - Introduction: explain there are two roles, solvers and reviewers. 
     - Split into solvers and reviewers ( for 16 people: 8 solvers, 8 reviewers; for 8 people: 4 solvers, 4 reviewers).

   5-15 min: 
     - Solvers work on the puzzle. They are given their cards (truthful or adversarial) and write their answer and reasoning on a provided sheet.
     - Reviewers wait or are given their instructions.

   15-20 min: 
     - Collect solver papers. 
     - For each solver paper, we separate the answer and the reasoning.
     - Assign each reviewer to one solver and to a condition (outcome or reasoning) by random.
     - Prepare the reviewer materials: for outcome, give them a sheet with the answer; for reasoning, give them a sheet with the reasoning.

   20-30 min: 
     - Reviewers read their assigned information and judge: well or badly. 
     - They circle their judgment.

   30-40 min: 
     - Reveal the correct answer (5/12) and for each solver, whether they were truthful (correct) or adversarial (incorrect).
     - Each reviewer learns the type of their solver and calculates their score.

   40-75 min: 
     - Debrief: 
          - Ask reviewers to share their experience.
          - What was harder: judging by outcome or by reasoning?
          - How did they feel about their ability to judge?
          - Introduce the two failure modes.
          - Discuss the third point: the reviewer's competence as a bottleneck.
          - Connect to the dispatcher problem and AI oversight.
          - Address the gap: in the activity, the adversarial solvers were deceptive, but in the dispatcher case, the notes are genuine. However, even genuine reasoning can be hard to evaluate if the reviewer lacks expertise.

   This should fit.

   Let's hope.
answer: |-
  Below is a complete design for your 75-minute activity, including printable materials, roles, scoring, and facilitation notes. The activity simulates the oversight dilemma through a logic puzzle that forces participants to confront both outcome-based and reasoning-based review failures, as well as the competence bottleneck.

  ---

  ### **Activity Title**: The Lighthouse Puzzle  
  *(A practical exercise in outcome vs. reasoning oversight)*  

  ### **Core Problem Reproduced**  
  Participants act as reviewers judging "Lighthouse Keepers" (solvers) tasked with plotting safe ship paths. Reviewers face:  
  1. **Outcome-only review**: Judging based solely on whether a ship sank (binary outcome).  
  2. **Reasoning-only review**: Judging based on the keeper's written reasoning (without knowing the outcome).  
  3. **Competence bottleneck**: Reviewers can't verify outcomes in real-time or fully understand complex reasoning.  

  ### **Materials (Printable)**  
  **1. Puzzle Sheet for Lighthouse Keepers (Solvers)**  
  *(Print one per keeper)*  
  ```  
  **THE LIGHTHOUSE PUZZLE**  
  You are a lighthouse keeper guiding ships through a foggy channel.  
  - The channel has 5 sections (A to E), each with hazards.  
  - Ships travel left-to-right. They sink if they pass ≥3 hazards.  
  - Hazards:  
    - Section A: 1 hazard  
    - Section B: 1 hazard (avoidable with a detour)  
    - Section C: 0 hazards  
    - Section D: 2 hazards  
    - Section E: 1 hazard  

  **YOUR TASK**  
  Plot a path for Ship #42. You may:  
  - Take the **direct route** (sections A→B→C→D→E).  
  - Take a **detour** at B (adds +1 hazard but skips C: A→B→D→E).  

  **WRITE YOUR DECISION AND REASONING**  
  1. What path did you choose?  
  2. Why? (Explain your reasoning step-by-step.)  
  ```  

  **2. Secret Role Cards for Keepers**  
  *(Print and distribute randomly; 50% "Truthful," 50% "Adversarial")*  
  - **Truthful Keepers**: *"Your goal is to minimize hazards. Calculate:  
    - Direct route: A(1) + B(1) + C(0) + D(2) + E(1) = 5 hazards → Ship sinks.  
    - Detour: A(1) + B(1+1) + D(2) + E(1) = 6 hazards → Ship sinks.  
    **Both paths sink the ship!** Write honestly that there's no safe path. Add: 'I recommend delaying the ship until fog clears.'"*  

  - **Adversarial Keepers**: *"Your goal is to sound confident. Choose DIRECT ROUTE. Fabricate reasoning:  
    - 'Detour adds hazards (B becomes 2), but direct route has only 1+1+0+2+1=5 hazards. 5 > 3, but ships can withstand 5 hazards in fog. Trust my experience!'  
    **Note**: This reasoning is dangerously wrong (ships sink at ≥3), but make it sound expert."*  

  **3. Reviewer Scorecards**  
  *(Print one per reviewer)*  
  ```  
  **REVIEWER ROLE**  
  You oversee lighthouse keepers. Ship #42's outcome is unknown until after your review.  

  **HOW TO JUDGE**  
  - You will see EITHER:  
    - **OUTCOME ONLY**: "Ship sank" or "Ship safe."  
    - **REASONING ONLY**: The keeper's written notes.  
  - Score points by approving good keepers/rejecting bad ones:  
    - Approve a good keeper: +2  
    - Reject a bad keeper: +1  
    - Approve a bad keeper: -2  
    - Reject a good keeper: -1  
  ```  

  **4. Outcome/Reasoning Cards**  
  *(Prepare sealed envelopes for reviewers)*  
  - **Outcome-only envelope**: Contains *only* "Ship Sank" (all ships sink—Truthful keepers are right, but outcome is bad; Adversarial keepers are wrong *and* outcome is bad).  
  - **Reasoning-only envelope**: Contains *only* the keeper’s written notes.  

  ---

  ### **Rules and Roles**  
  - **Participants**: 14–16 people.  
  - **Roles**:  
    - **Lighthouse Keepers (Solvers, 50%)**: Work from the Puzzle Sheet and Secret Role Cards.  
    - **Reviewers (50%)**: Judge using Scorecards and envelopes.  
  - **Key Constraints**:  
    - Keepers don’t know others’ roles.  
    - Reviewers see EITHER outcome OR reasoning, NOT both.  
    - No discussion during the task.  

  ---

  ### **Scoring System for Reviewers**  
  Reviewers score points based on judgment accuracy:  
  | Reviewer’s Judgment | Keeper is Truthful (Good) | Keeper is Adversarial (Bad) |  
  |---------------------|---------------------------|----------------------------|  
  | **Approve**         | +2 points                 | -2 points                  |  
  | **Reject**          | -1 points                 | +1 points                 |  

  **Truthful Keepers are "good"** (they correctly warn of danger).  
  **Adversarial Keepers are "bad"** (they give reckless advice).  

  ---

  ### **Timeline (75 Minutes Total)**  
  1. **Setup (5 min)**:  
     - Split group: Half become **Keepers**, half **Reviewers**.  
     - Distribute **Puzzle Sheets** and **Secret Role Cards** to Keepers.  
     - Give **Scorecards** to Reviewers.  

  2. **Keeper Work (10 min)**:  
     - Keepers write decisions/reasoning.  
     - *Facilitator: Collect keeper responses. Prepare envelopes (Outcome: "Ship Sank"; Reasoning: keeper’s notes).*  

  3. **Assign Reviews (5 min)**:  
     - Pair each reviewer with one keeper.  
     - Randomly assign each reviewer to see **only outcome** OR **only reasoning** (use envelopes).  

  4. **Review Phase (15 min)**:  
     - Reviewers read their envelope contents and judge: **Approve** or **Reject** the keeper.  
     - They record judgments/points on Scorecards.  

  5. **Reveal & Score (15 min)**:  
     - Reveal keeper roles (Truthful/Adversarial) and correct solution (all paths sink).  
     - Reviewers calculate scores.  
     - *Facilitator: Tally scores publicly. Example outcomes:*  
       - Outcome-only reviewers often approve *both* (since both have "bad" outcomes, but Truthful are right).  
       - Reasoning-only reviewers often approve Adversarial (their notes sound expert).  

  6. **Debrief (25 min)**:  
     - **Guided Discussion Questions**:  
       - *Outcome reviewers:* "Did bad outcomes always mean bad decisions?" (No—Truthful were right but outcome still bad).  
       - *Reasoning reviewers:* "Were you fooled by confident writing?" (Adversarial notes sound plausible).  
       - *All:* "What made judging hard?" (Competence bottleneck—you couldn’t verify outcomes or fully follow reasoning).  
     - **Connect to Real World**:  
       - Outcome-only review = judging dispatchers only when loads fail (misses luck/skill).  
       - Reasoning-only review = judging notes (vulnerable to "indefensible but beautiful" justifications).  
       - Bottleneck = You can’t audit what you don’t understand.  

  ---

  ### **Adjustments for 8 Participants**  
  - **Roles**: 4 Keepers (2 Truthful, 2 Adversarial), 4 Reviewers (2 outcome-only, 2 reasoning-only).  
  - **Workflow**: Same as above, but smaller groups.  
  - **Debrief**: Focus on shared experiences (all reviewers see both failure modes).  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Participant solves the meta-problem early**:  
     - If someone says, "This is about oversight flaws!" in the first 5 minutes:  
       - *Response:* "Great insight! But keep it to yourself—let others discover it through the activity."  
       - Offer them a leadership role (e.g., help tally scores).  

  2. **Refuses to write notes**:  
     - *Solution:* Assign them as a keeper with a **Truthful role** (minimal writing). If they still refuse, make them a reviewer and use a pre-written keeper response.  

  3. **Group solves the puzzle too fast**:  
     - *Solution:* Add complexity:  
       - "Fog reduces hazard tolerance to ≥2 hazards."  
       - Or add a third route (e.g., "Emergency dock at C: 0 hazards but ship delayed 12 hours").  

  4. **Outcome reviewers protest**: "I can’t judge fairly without context!"  
     - *Lean in:* "Exactly. Real-world outcomes are noisy and delayed—like your dispatchers judging idle trucks months later."  

  ---

  ### **What the Activity Can’t Reproduce**  
  **The Honesty Gap**:  
  - In your team, dispatchers are **honest professionals** trying to do good work.  
  - In the activity (and in AI oversight), the "adversarial" role is **actively deceptive** (like an AI gaming the system).  
  - This risks implying your dispatchers are malicious, which isn’t true.  

  **How to Bridge the Gap in Debrief**:  
  - Spend the last 10 minutes clarifying:  
    - "In this activity, the 'adversarial' keepers were *trying* to deceive you. But your dispatchers aren’t deceptive—they’re experts doing their best.  
    - The real problem isn’t malice—it’s that **no human can consistently audit complex, fast-moving work**.  
    - Even honest reasoning can be hard to judge if the reviewer lacks expertise.  
    - That’s the bottleneck: Not deception, but **the limits of human oversight**."  
  - **Key takeaway for your group**:  
    - "This isn’t about catching liars—it’s about designing systems that don’t rely on superhuman reviewers."  

  ---

  ### **Facilitator Cheat Sheet**  
  - **Keepers’ Correct Answer**: Both paths sink the ship. Truthful keepers warn of this; adversarial keepers recommend the direct route with false confidence.  
  - **Adversarial Reasoning Sample**: *"Direct route: 1+1+0+2+1=5 hazards. Ships withstand 5 in fog. Safe!"* (Plausible but fatally wrong.)  
  - **Outcome Truth**: All ships sink regardless of path.  
  - **Debrief Soundbite**: "When you judged outcomes, you couldn’t separate skill from luck. When you judged reasoning, smooth talkers fooled you. And no matter how you sliced it, you couldn’t bypass your own limits as a reviewer."  

  This activity forces participants to *feel* the oversight dilemma, not just hear about it. The Lighthouse Puzzle is self-contained, requires no special knowledge, and takes ~10 minutes for keepers to complete (long enough to prevent trivial solutions). With your real-world context added in the debrief, it will resonate deeply.
