  The task must be:
  - Self-contained, printable, no background needed.
  - Hard enough that smart people can't finish in 2 minutes, but doable in the time we have.
  - Suitable for having both an outcome and a written reasoning trail.

  I propose a logical puzzle or a reasoning task that has multiple steps and where the answer is a single outcome (like a number or a yes/no). The puzzle should be such that:
