answer: |-
  *(leans against whiteboard, marker tapping)* You're conflating two entirely different applications of typicality, and that's the core confusion. Statistical mechanics uses typicality *within a fixed physical scenario* to predict macroscopic behavior. When I say a gas in a box is "typical," I mean its microstate is likely drawn from the equilibrium macrostate's enormous phase space volume *given that specific box, with those specific boundary conditions and initial low-entropy setup*. The typicality assumption here is about the *physical state itself*, relative to the *defined system*. It predicts what that gas *does*.

  The Boltzmann brain problem misapplies typicality to *self-location across fundamentally different physical scenarios*. The theory (like eternal inflation) predicts vastly more BB observers than ordinary observers *over the entire spacetime*. The "problem" asks: "Given I *am* an observer, am I likely to be a BB?" But my finding myself to be *this* embodied observer isn't evidence *about the physical theory*. It's just a statement of my local perspective. A BB observer, by definition, would find itself *believing* it was embodied in a structured universe too. My observation is *precisely what both types predict I would experience*. It cannot distinguish between the theories. The second law relies on typicality *within the system*; BB worries misuse typicality *across observer classes* predicted by the theory. One is a physical prediction; the other is an indexical dead end.

  *(pauses)* So, sharp question back: Why do you think the *physical* typicality of microstates in a box justifies drawing conclusions from the *anthropic* typicality of observer types in the multiverse? They aren't the same kind of claim.
