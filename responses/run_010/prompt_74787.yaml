answer: |-
  Let's take this sentence by sentence, as requested. I work extensively on this material, and while popularizations can be useful, this passage contains some significant overstatements and conflations that need unpacking – especially since you're considering it for academic use.

  **Sentence 1:** *"Carnap held that metaphysical sentences are neither true nor false but empty of sense, and he was perfectly consistent about applying this to morals and politics too..."*
  This is largely correct as a starting point. Carnap, following the verificationist principle prominent in the Vienna Circle's early phase, did classify metaphysical statements (including many traditional ethical and political claims framed as transcendent truths) as cognitively meaningless. He saw them as expressions of attitude or emotion (emotivism).

  **Sentence 2:** *"...to call a society unjust is not, for him, to say anything at all, it is to express an attitude, not very different from booing."*
  This is a *fair-but-loose simplification*. While Carnap indeed denied that such judgments express propositional truth claims about the world in the same way scientific statements do, comparing them purely to "booing" oversimplifies his (and the Circle's) more nuanced view. They saw value statements as having important *non-cognitive* functions – expressing emotions, prescribing behavior, influencing others – within a form of life or practical discourse. It wasn't *just* noise; it was meaningful *action* (like a command), just not descriptive science. Calling it "booing" flattens this.

  **Sentence 3:** *"That left only one genuinely political question, the empirical question of which means serve which ends..."*
  **This is a critical and load-bearing claim, and it's significantly overstated.** While Carnap certainly emphasized the importance of empirical analysis of means-ends relationships (seeing this as the domain of science/rationality), it's incorrect to say this was the *only* "genuine" political question for him. His socialist commitments (discussed below) involved substantive value commitments (e.g., pacifism, social justice, anti-fascism, democratic socialism) that went far beyond mere technical calculation. He didn't believe value disputes could be settled *scientifically*, but he absolutely engaged in them *politically and ethically*. The book here risks reducing his entire political engagement to instrumental reason.

  **Sentence 4:** *"...and it is why Carnap became an enthusiast for central planning — once you accept that values can't be argued about, you leave the ends to whoever happens to hold them and let scientifically trained administrators work out the means."*
  **This is the most problematic claim and likely the core distortion driving the passage's overall technocratic interpretation.** There is *little to no evidence* Carnap was an "enthusiast for central planning" in the sense implied here (top-down, technician-run). His socialism was fundamentally of a *democratic* and *libertarian* variety, influenced by the Austro-Marxists and guild socialists. He was deeply involved in left-wing social democratic politics focused on workers' councils and participatory democracy, *not* rule by technocratic administrators. While he believed science could inform policy *implementation* (means), the *ends* were to be determined democratically, not simply "left to whoever holds them." The Circle's manifesto (*Wissenschaftliche Weltauffassung*) explicitly links scientific thinking to *social reform* driven by human needs and *empathy*, not detached administration. Attributing central planning enthusiasm to him based *solely* on his non-cognitivism misrepresents his actual political actions and affiliations.

  **Sentence 5:** *"The same attitude runs through his philosophy of logic. His principle of tolerance holds that there is no fact of the matter about which logical language is right, so we are free to adopt whatever framework we like..."*
  This is a good summary of the principle of tolerance regarding logical frameworks (language forms). Choice is conventional/pragmatic, not dictated by "reality."

  **Sentence 6:** *"...choosing a framework is a matter of taste in just the way that choosing an ultimate value is, and Carnap's pluralism about logic and his liberalism about politics are therefore one doctrine stated twice."*
  This draws a parallel that Carnap *himself* sometimes suggested (e.g., in his intellectual autobiography). There *is* an analogy: both involve non-theoretical, practical choices based on purposes and consequences. Calling it "one doctrine stated twice" is a *strong formulation but defensible as an interpretive claim* about a connection Carnap perceived. However, it's crucial to note that "liberalism" here needs careful handling – it meant tolerance and pluralism within a broadly socialist/social democratic commitment, not classical liberalism. The analogy doesn't *necessarily* lead to the technocratic conclusion the book draws.

  **Sentence 7:** *"He was personally a fairly conventional social democrat..."*
  This is accurate.

  **Sentence 8:** *"...but he saw where his premises led, and he sketched a rationally organised society in which political disagreement would be settled the way engineering disagreements are settled, by calculation."*
  **This is a serious misrepresentation.** Carnap *never* "sketched" such a society. While he believed *some* policy *implementation* disputes could be resolved empirically (e.g., which bridge design is safest/cheapest), he absolutely did not believe *fundamental political disagreements* (e.g., about justice, freedom, equality) could be settled "by calculation." His actual political vision was democratic, involving debate, persuasion, and collective decision-making based on shared (if non-cognitive) values, informed *by* science but not *replaced* by it. The "engineered society" idea is largely the *author's inference/extrapolation*, not Carnap's documented position. It confuses his view on *means* with a view on *ends* and fundamental disputes.

  **Sentence 9:** *"Those who accuse logical empiricism of being technocratic or politically quietist are, on this point, simply taking Carnap at his word."*
  **This conclusion does not survive the corrections.** Critics *do* often take statements about non-cognitivism and the emphasis on means-ends rationality *in isolation* and interpret them as implying technocracy or quietism. *However*, as we've seen:
  1.  Carnap's *actual political practice and stated commitments* (active socialism, anti-fascism) contradict quietism.
  2.  His vision for applying science to society was embedded within a framework of *democratic socialism*, not rule by technicians.
  3.  The "engineered society" sketched by the book is not Carnap's view.
  Therefore, while critics *cite* Carnap's words on specific points (non-cognitivism, means-ends), they often *misapply* them to draw conclusions (technocracy) that his broader philosophy and actions actively resisted. Taking *only those specific words* leads to distortion; taking Carnap "at his word" *in full context* shows a more complex picture.

  **Verdict Summary:**
  *   **Accept (with minor contextual note):** The core claims about non-cognitivism extending to ethics/politics and the principle of tolerance. The analogy between tolerance and liberalism is a defensible *interpretation* Carnap invited.
  *   **Require Significant Hedging/Correction:** The characterization of value judgments as *merely* "booing" (lacks nuance). The claim that means-ends is the *only* genuine political question (overstated, ignores his substantive commitments). The description of his socialism as "conventional social democrat" (accurate but needs context – it was activist and specific).
  *   **Strike or Heavily Correct:** The claim he was an "enthusiast for central planning." The claim he "sketched" a society where political disputes are settled like engineering disputes by calculation (pure extrapolation/misrepresentation). The idea that non-cognitivism *leads directly* to leaving ends to whoever holds them and technocratic administration (contradicted by his democratic socialism).
  *   **Conclusion on Critics:** The book's claim that critics are "simply taking Carnap at his word" is **incorrect once the errors are corrected.** Critics often take *parts* of his word out of context to support the technocracy/quietism charge, ignoring his active democratic socialism and the nuances of his non-cognitivism. A fuller reading of Carnap complicates the critique. The book's own distorted reading of Carnap ironically demonstrates *how* such misreadings occur.
