prompt: |-
  so, background: I work in a county environmental health division (small metro, ~400k people) and I'm the one who writes the risk memos that the board actually votes on. Last month we had a genuinely ugly fight about a permit — a manufacturer wants to swap a fluorosurfactant we already know has contaminated a well field for a newer replacement that's much less studied. Approve it and you trade a documented bad for an undocumented one; deny it and the documented bad keeps leaching while the plant runs on the old process, which also has known occupational harms. Afterwards two board members asked me to put on one page what decision rule I'm actually using, so they can check whether I'm just deciding case by case and dressing it up in principle-language. I did it, and now I want someone to attack it before it goes in front of them.

  Here's the package I landed on: (1) for ordinary, reversible, well-measured risks — traffic design, routine immunization scheduling, that kind of thing — I do straight expected value; if the data is good we multiply and compare, no heroics. (2) For risks that are plausibly catastrophic and irreversible I go maximin: pick the alternative whose worst case is least bad, and don't demand a probability for it, because in these cases we usually don't have one worth the name. (3) I reject the standard objection that this makes the precautionary principle self-undermining, the one that says it condemns everything including doing nothing — I don't think the status quo gets any presumption in its favor, inaction is a choice like any other, and when both directions have a catastrophic tail my rule still tells you to take the side whose tail is less catastrophic. (4) I also refuse Pascalian moves: I dont think you get to move a decision just because someone can't rule a harm out and says it's infinitely bad — no probability and no evidential support for the mechanism, no standing in the analysis. (5) The threshold between "ordinary" in (1) and "catastrophic" in (2) has to be written down in advance and not gerrymandered to produce the verdict I happened to want; the board sets it before it hears the case. (6) Where the two sides are unequally informed — the applicant knows its own chemistry, we don't — I think it's legitimate to make the proponent carry the burden of showing safety, even though I'm explicitly not claiming they're probably unsafe.

  So: which of these actually pull against each other, and how hard? Rank the conflicts by severity rather than giving me a flat list where everything sounds equally bad. For each real one I want the cheapest available fix and what that fix costs me in practice — including whether fixing it wrecks my answer to the board member who said I was being inconsistent, since that's the whole reason the page exists. Then tell me which pairs only look like a contradiction because they're operating at different levels (decision rule vs. evidential standard vs. procedural default), because I suspect at least one of them is fine and I'd rather not spend the meeting defending something I don't have to. Two more things: does the permit case I described above actually land inside my rule, or in a gap between two of the clauses — I have a bad feeling about that one. And is any item on the list just a restatement of another one, i.e. am I padding the page and should I cut it?
reasoning: |-
  Okay, let me tackle this user's query. They work in environmental health and need to defend their decision-making framework to the board. The user outlined six points and wants to know where conflicts arise, how severe they are, and fixes for each. 

  First, I need to parse each point carefully. Point 1 uses expected value for reversible risks with good data. Point 2 uses maximin for catastrophic, irreversible risks without needing probabilities. Point 3 rejects the precautionary principle's self-undermining by not favoring the status quo. Point 4 rejects Pascalian moves, requiring evidence for harm mechanisms. Point 5 requires a pre-set threshold for catastrophe. Point 6 shifts the burden of proof to the applicant when information is unequal.

  The main tension is between Points 2 and 4. Maximin allows acting without probabilities for catastrophe, but Point 4 demands evidence. That's a big conflict. The fix here is to allow plausible mechanisms even without probabilities, which might weaken Point 4 but keeps the framework functional.

  Next, Points 2 and 3 have a subtle issue. Maximin avoids probabilities, but if both options have catastrophic tails, the user compares them. However, without probabilities, defining "less catastrophic" could be arbitrary. The fix is to require qualitative scales for catastrophe severity, adding objectivity.

  Points 1 and 2's threshold (Point 5) needs clear criteria. Terms like "irreversible" and "catastrophic" are vague. The board must define these operationally, perhaps with examples, to prevent gerrymandering.

  Point 6's burden of proof clashes with Point 4. Requiring the applicant to prove safety without evidence standards might invite unsupported claims. The fix is to set evidence tiers—minimum mechanistic plausibility—so applicants can't just speculate.

  The permit case involves swapping a known bad for an unknown. Under Point 2, both options have catastrophic potential. The status quo (inaction) isn't privileged (Point 3), so the user must compare worst cases. But without data, is the new chemical's worst case truly worse? Point 6 shifts the burden to the applicant to show the new chemical's safety. If they can't, denial might be justified, but the old chemical's harm continues. The framework pushes denial unless the applicant provides evidence, aligning with Point 6.

  Redundancies? Points 3 and 5 support Point 2 but aren't redundant. Point 3 handles the status quo, Point 5 prevents threshold manipulation. They're distinct.

  Finally, Point 4's rejection of Pascalian moves isn't conflicted elsewhere; it's a separate safeguard against speculative harms. Keeping it is crucial for preventing misuse.
answer: |-
  Here's a structural breakdown of conflicts in your framework, ranked by severity (most critical first), with fixes, costs, and analysis of the permit case. The core tension is between your catastrophic-risk rule (2) and your evidence gatekeeping (4), amplified by burden-shifting (6).

  ### Ranked Conflicts & Fixes

  1.  **Conflict: Point 2 (Maximin for Catastrophe) vs. Point 4 (No Pascalian Moves)**
      *   **Severity:** **High.** This is the most fundamental tension. Maximin (2) explicitly operates *without* needing probability or strong evidential support for the *mechanism* of catastrophe – it considers the *possibility* based on plausible catastrophic *outcomes*. Point (4) bars considering any harm without "evidential support for the mechanism."
      *   **Example:** A novel chemical's *plausible* but unquantified potential for irreversible groundwater contamination (catastrophe) triggers Maximin under (2). But under (4), if there's no specific evidence *for the mechanism* (e.g., no lab studies showing *how* it binds to aquifer rock long-term), you'd bar its consideration entirely, neutering Maximin.
      *   **Cheapest Fix:** **Modify Point 4.** Clarify that for *catastrophic* risks (as defined under Point 2 & 5), the *existence of a plausible pathway* (e.g., "chemical class X is known to persist and bioaccumulate; groundwater is vulnerable") constitutes sufficient "evidential support" to consider the *potential* harm under Maximin, *even without specific probability or detailed mechanism evidence.* You don't need the *exact* toxicology, just a defensible reason why "catastrophic outcome Y is plausibly on the table."
      *   **Cost:** Weakens your bulwark against truly speculative "Pascalian" nightmares (e.g., "What if it opens a portal to hell?"). You must rigorously defend the "plausible pathway" standard. **Board Member Cost:** Moderate. You need to clearly differentiate "plausible pathway" (allowed) from "pure speculation" (barred by revised Point 4). It might look like waffling to someone demanding absolute bright lines.
      *   **Levels:** This *is* a conflict at the core decision rule level (how to handle catastrophic uncertainty). Fix involves refining the evidence standard *for that specific rule*.

  2.  **Conflict: Point 2 (Maximin) / Point 3 (No Status Quo Bias) vs. Point 6 (Burden of Proof)**
      *   **Severity:** **Medium-High.** Maximin + No Status Quo Bias requires you to compare the worst-case scenarios of *all* alternatives, including the applicant's proposal *and* the status quo (inaction). Point 6 places the burden on the proponent (applicant) to show safety. What happens when Maximin analysis requires info about the *status quo's* worst-case to compare, but the *applicant* isn't responsible for proving the status quo is bad? Who provides that analysis/data?
      *   **Example:** Permit case. Maximin requires comparing the worst-case of the *new* chemical (unknown, potentially catastrophic) vs. the worst-case of the *old* chemical (known contamination, potentially spreading further). Point 6 says the *applicant* must show the *new* chemical is safe. But who definitively establishes the *full scope and future trajectory* of the *old* chemical's catastrophe for comparison? You (the regulator) have some data, but is it sufficient for a robust worst-case comparison? Does Point 6 imply the applicant *doesn't* need to address the status quo risk?
      *   **Cheapest Fix:** **Clarify Burden Scope in Point 6.** State: "The proponent bears the burden of demonstrating that their proposed action does not pose a *greater* catastrophic risk than the relevant alternatives (including the status quo), based on the best available information." This makes the burden comparative and relevant to the Maximin analysis.
      *   **Cost:** Significantly increases the applicant's burden – they now *must* analyze and argue against the status quo risk. Politically/contentiously difficult. Requires *you* to rigorously define the "status quo" baseline risk. **Board Member Cost:** High. This explicitly makes the applicant argue *against* the current situation, which they may see as shifting goalposts or being unfairly punitive. Defending this logic is complex.
      *   **Levels:** Conflict between procedural burden (6) and the requirements of the catastrophic risk decision rule (2/3). Fix ties the burden directly to the decision rule's needs.

  3.  **Conflict: Point 2 (Maximin - "Least Bad" Worst Case) vs. Practicality in Complex Cases**
      *   **Severity:** **Medium.** Defining the single "worst case" and judging which is "least bad" can be extremely difficult or subjective when catastrophes are qualitatively different and incomparable. Maximin struggles with multi-dimensional catastrophes.
      *   **Example:** Permit case. Worst Case A (Old Chem): Irreversible contamination of primary aquifer, rendering it unusable for 100+ years, chronic low-level occupational illnesses. Worst Case B (New Chem): Potential for a novel, highly persistent toxin causing severe acute poisoning outbreaks if it migrates unexpectedly, plus unknown occupational risks. Which "worst case" is "least bad"? Contamination vs. acute poisoning? Chronic illness vs. unknown? This is highly value-laden.
      *   **Cheapest Fix:** **Operationalize "Least Bad" via Pre-defined Criteria (Leverage Point 5).** When the Board sets the catastrophe threshold (Point 5), also have them establish *criteria* for *comparing* catastrophic outcomes if needed (e.g., "Irreversible loss of critical resource > Widespread acute illness > Localized chronic illness," or define weighting factors). Acknowledge this is imperfect but necessary.
      *   **Cost:** Politically difficult to get the Board to agree on explicit catastrophe rankings. Forces value judgments out in the open. Still won't handle all cases perfectly. **Board Member Cost:** Moderate. Makes the value judgments explicit, which could lead to debate, but also provides transparency. Less defensible as purely "technical."
      *   **Levels:** This is an operational challenge *within* the Maximin rule (Point 2). Point 5 is the tool to address it.

  4.  **Conflict: Point 1 (Expected Value) vs. Point 2 (Maximin) - Threshold Definition (Point 5)**
      *   **Severity:** **Low-Medium.** The devil is in defining "catastrophic and irreversible" vs. "ordinary" *in advance* (Point 5). Many real-world risks sit on a spectrum. A poorly defined threshold creates inconsistency.
      *   **Example:** Is localized contamination of a small, replaceable water source "catastrophic"? What if it serves a vulnerable community? Is a 1% chance of a major spill "plausibly catastrophic"?
      *   **Cheapest Fix:** **Make Point 5 Highly Specific & Contextual.** The Board shouldn't just set a vague threshold. Provide them draft criteria: e.g., "Catastrophic = Threatens >X% of population water supply / causes >Y cases of irreversible illness / renders >Z acres permanently unusable. Irreversible = No known remediation within [Timeframe]." Include qualitative factors ("threatens critical habitat," "impacts environmental justice community"). Use examples.
      *   **Cost:** Requires significant upfront work with the Board. Thresholds will never be perfect and will need revisiting. Some edge cases remain. **Board Member Cost:** Low. This directly addresses their demand for consistency and pre-commitment. Shows diligence.
      *   **Levels:** Point 5 is the *procedural safeguard* to prevent abuse of the *threshold* between two distinct decision rules (1 & 2). Not a conflict *between* 1 and 2, but a vulnerability *managed* by 5.

  ### Analysis of Your Permit Case

  *   **Does it land inside your rule?** **Yes, but stress-tests it heavily.**
      *   It triggers **Point 2 (Maximin)** for both alternatives: Status Quo (Old Chem) has a *documented* catastrophic/irreversible outcome (well field contamination). The New Chem presents a *plausible but undocumented* catastrophic/irreversible risk (based on chemical class, novelty, lack of data - satisfying the revised "plausible pathway" evidential standard from Fix 1).
      *   **Point 3** applies: Inaction (status quo) has a known catastrophic tail, so it doesn't get a pass. You *must* compare the worst cases.
      *   **Point 6** applies: Burden is on the applicant to demonstrate the New Chem's worst case is *no worse* than the Status Quo's worst case (per Fix 2). They failed to meet this burden (it's "much less studied").
      *   **The Gap/Challenge:** The core difficulty is *comparing* the two worst cases (Old Chem known bad vs. New Chem unknown potentially-worse bad) under Maximin. This is the **Conflict 3** scenario. Did you have pre-defined criteria ("least bad")? If not, the decision *could* appear subjective. However, your framework *forces* this difficult comparison explicitly and rejects simply defaulting to the status quo. **Your rule likely leads to DENIAL** unless the applicant provides compelling evidence that the New Chem's *worst case* is demonstrably *less bad* than the ongoing, known worst case of the Old Chem. Since they provided little evidence ("much less studied"), denial is the outcome dictated by Point 6 as clarified.

  ### Redundancy Check

  *   **Point 3 (No Status Quo Bias) is NOT redundant.** It directly addresses the standard criticism of precautionary approaches and is essential for justifying why you apply Maximin to *both* change and inaction in the permit case. It's a critical philosophical underpinning for Point 2 in comparative assessments.
  *   **Point 5 (Pre-Set Threshold) is NOT redundant.** It's the essential procedural lock preventing Point 2 from being applied arbitrarily to *any* risk to get the desired outcome. It constrains and enables Point 2.
  *   **Point 4 (No Pascalian Moves) is NOT redundant (even revised).** It prevents Point 2 from being hijacked by truly fantastical, evidence-free claims of catastrophe. It defines the lower bound of "plausible pathway."
  *   **Point 6 (Burden of Proof) is NOT redundant.** It addresses the information asymmetry problem common in permitting, which isn't explicitly covered by Points 1-5. It shifts the practical workflow.

  ### Summary & Recommendations

  1.  **Prioritize Fixes:** Implement the fixes for Conflicts 1 (Revise Point 4 re: plausible pathways) and 2 (Clarify Point 6 burden is comparative) immediately. These are the most critical for internal consistency, especially for cases like your permit. Work on refining Conflict 3's "least bad" criteria via Point 5.
  2.  **Permit Case Justification:** Under your revised framework (with fixes), the denial was likely correct: Applicant failed to meet the burden (Point 6 clarified) of showing the new chemical's worst case wasn't worse than the status quo's known catastrophic worst case. Maximin (Point 2) applied because both alternatives had plausible catastrophic tails, and the status quo got no special favor (Point 3).
  3.  **Board Defense:** Frame the document as:
      *   Acknowledging the inherent tensions in decision-making under deep uncertainty.
      *   Providing explicit, pre-committed rules (Point 5!) to minimize inconsistency.
      *   Making tough value judgments (like catastrophe comparisons) transparent and subject to Board oversight (Point 5 criteria).
      *   Being rigorously skeptical of unsupported claims of infinite harm (Point 4).
      *   Addressing real-world power imbalances (Point 6).
  4.  **Phraseology:** Use clear, concrete language in the one-pager. Replace "plausibly catastrophic" with the Board's defined criteria from Point 5. Replace "evidential support for the mechanism" in Point 4 with "a scientifically plausible pathway to harm" (post-fix). Replace "burden of showing safety" in Point 6 with "burden of demonstrating reduced catastrophic risk compared to alternatives" (post-fix).

  Your framework is thoughtful and tackles hard problems head-on. The conflicts identified are inherent to risk governance, not flaws unique to you. By explicitly addressing them with the proposed fixes and clarifications, you significantly strengthen your defense against charges of inconsistency. Good luck with the board!
