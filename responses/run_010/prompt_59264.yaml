answer: |-
  ### Bottom Line:  
  Reading 4 (reconfiguration of political structure) does the most work by reframing collapse as reorganization, but it risks downplaying demographic/cultural trauma in cases like the Maya, where elite institutions vanished amid suffering.

  ---

  ### Numbered Readings:  
  1. **Semantic Hygiene Claim**  
     *Claim*: "Collapse" misleadingly implies total dissolution; "transformation" better captures continuity (e.g., population survival, adaptive change).  
     *Verdict*: **Platitudinous** (agreed by all scholars—no society vanishes utterly; even Rome had farmers).  
     *In your cases*: For Rapa Nui, this alone can't deny collapse—population fell >90%, language/rituals eroded post-contact.  

  2. **Cultural Continuity Claim**  
     *Claim*: Core cultural elements (language, religion, kinship) persist despite political/economic rupture.  
     *Verdict*: **Substantive and defensible** (e.g., Post-Classic Maya retained calendars/gods but shifted to coastal hubs).  
     *In your cases*: Tutor uses this for Maya to deflect "collapse"—but lowland urbanism *did* end; slogan obscures scale of rupture.  

  3. **Anti-Catastrophist Claim**  
     *Claim*: "Collapse" implies abrupt, universal failure, but decline is usually asynchronous and reversible (e.g., some Bronze Age cities thrived amid regional turmoil).  
     *Verdict*: **Substantive and contested** (valid for Hittite fragmentation vs. false for Rapa Nui’s ecological overshoot).  
     *In your cases*: Invoked for Rapa Nui to deny collapse—ignores evidence of pre-contact societal breakdown (monument abandonment, warfare).  

  4. **Reconfiguration of Power Claim**  
     *Claim*: States/dynasties end, but societies reorganize (e.g., imperial collapse → local resilience; Byzantine "transformation" after 1204).  
     *Verdict*: **Substantive and defensible** (best fit for Maya: cities abandoned but culture adapted in new polities).  
     *In your cases*: Tutor’s shutdown relies on this—shifts focus from "failure" to agency, but sidesteps Maya’s urban depopulation.  

  5. **Decolonial Claim**  
     *Claim*: "Collapse" is colonial erasure—it casts Indigenous societies as extinct to legitimize displacement (e.g., denying modern Maya/Rapa Nui continuity).  
     *Verdict*: **Substantive and contested** (vital politically, but empirically uneven; Rapa Nui’s post-1860s genocide complicates this).  
     *In your cases*: Used for Rapa Nui to insist "nothing collapsed"—overcorrects by conflating pre-contact crisis with colonial violence.  

  ---

  ### How the Slogan Works in Your Seminars:  
  - **For Classic Maya**: Tutors use Reading 4 to reject "collapse" as a teleological judgment. It *settles semantics* (redefining collapse as incompatible with resilience) but *fails empirically*—lowland urban networks *did* disintegrate; population dropped 70-90% in cores.  
  - **For Rapa Nui**: Tutors use Reading 5 to deny collapse entirely. This *settles politics* (centering Indigenous survival) but *distorts empirics*—ecological and social systems fractured pre-contact (e.g., toppled *moai*), then colonial slavery compounded trauma.  

  **Cost of Relying on Reading 4/5**: They resolve semantic/political debates but can sanitize historical trauma (e.g., Maya drought-driven famine) or conflate pre/post-colonial dynamics. **Verdict**: Useful heuristics, but not entitled to override evidence of nonlinear rupture.
