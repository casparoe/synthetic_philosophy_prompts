prompt: |-
  I am the head registrar at a mid-sized museum of decorative arts in Central Europe with roughly forty thousand objects, and I need help turning a metaphysical dispute into something two junior assistants can actually run. Our accession numbering descends from an 1898 register built on a single assumption: an object, once entered, stays numerically itself — one number, one label, one insurance value, one line in any restitution file, one continuous provenance chain. In practice that assumption fails several times a month. We consolidate, re-line, re-mount, replace missing mounts and hardware, reassemble disassembled pieces after exhibition, occasionally deaccession a component, and sometimes discover that a nineteenth-century restorer quietly combined material from two objects in a way nobody recorded. Between the registrar, two assistants and a conservator we make perhaps a dozen "is this still the object we entered under that number?" decisions a month. They are not academic questions. The answer fixes which accession number appears on a loan agreement, whether an insurance schedule lists one object or two, whether a restitution claim filed against a given number can be met by pointing at the thing standing in the gallery, and whether a catalogue entry's chain of custody survives intact. The people who must execute the decision have no philosophical training; one of them has already told me she finds the whole question tiresome. I have about three weeks to install something and about twenty minutes per case; a procedure that takes longer will be ignored, and a procedure that is ignored is worse than none, because it leaves a false record of our having been consistent. A senior curator countersigns outcomes but will not re-derive them.

  A friend of mine who read philosophy at university maintains that our problem is precisely the debate between endurantism and perdurantism, and that this museum has been settling that debate by accident, differently in different departments, for a hundred and twenty years. I would like you to take her seriously enough to build the procedure. Concretely: write a stepwise decision procedure, executable in under twenty minutes by a non-specialist, that tells us (i) when to treat an altered, repaired, split or recombined artefact as the same object as the one already carried under an existing accession number, (ii) when to open a new number, (iii) when to close a number, and (iv) when to record a single object with two distinguishable careers under two numbers that cross-reference each other. It must be grounded in the actual metaphysics rather than in a generic checklist of factors. Along the way, the procedure should make explicit what commitment we incur when we let one accession number carry incompatible properties across decades — an object that is complete at one date and 60 percent modern at another — as against treating it as a dated history whose parts are the units of record; and it should say which of the standard moves in that debate correspond to which registry operations: the worm-style treatment of an object as its whole history, the stage-style treatment under which a dated condition record is its own unit and sameness is a matter of standing in the right relation to another such unit, time-indexed or adverbial attributions of properties, the problem of temporary intrinsics, and the various continuity conditions people argue over. Where a distinction from the debate does no work in a museum, say so plainly and drop it rather than including it for completeness.

  The deliverable should be a numbered list of questions in order, each with what counts as a sufficient answer to it, and with two kinds of exit clearly marked: the point at which the procedure stops and hands the case to the curator because what remains is a matter of institutional values rather than fact — what a restitution claimant is owed, what the public is being told about the object in the case, how much of a collection's history we are willing to have discontinuous — and the point at which it will deliver an answer we dislike. It also has to live inside our collection-management system, which is old and inflexible: each record can hold one current description, an unlimited list of dated events, and a free-text field for relations to other records; it cannot hold branching or nested objects, and it cannot hold a property without attaching it either to the record as a whole or to one of those dated events. Please then run the procedure on three cases. Case one: a late seventeenth-century marquetry cabinet, its carcass original, whose decorative panels were replaced in the 1840s and again in 2019 after a small fire, so that on our current estimate sixty percent of its visible surface is under a decade old while the structure and the locks are original. Case two: two marble portrait busts from the same workshop, both broken and stored as fragments in the early twentieth century, reassembled in 1974 with some fragments from each used in the other; neither bust can now be restored to its own fragments without destroying the other, and one of them is subject to a pending restitution claim. Case three: a kinetic sculpture accessioned in 1968 whose motor, bearings and control unit have all been replaced by successors to the original fabricator, with the artist's estate issuing a certificate that the work remains the same work, and a variant of this case in which the estate refuses to issue any such certificate. Finally, flag explicitly which of your steps are judgment calls dressed up as procedure, and state what the procedure cannot do: it should not pretend to fix monetary value, to settle legal title, or to resolve cases where the material history is simply unrecorded — which is most of our cases — but it should say what to do in that last situation. Please do not give me references or a reading list; I want something my staff can hold in their hands.
reasoning: |-
  We are building a decision procedure grounded in the metaphysics of persistence (endurantism vs. perdurantism) but designed for practical use by non-specialists in a museum setting. The goal is to determine when an altered object is still the same object (keeping the same accession number) and when it is not (requiring a new number, closing an old one, or using two cross-referenced numbers).

  Key concepts from the metaphysical debate and how they map to museum operations:

  1. **Endurantism**: The object persists through time by being wholly present at each time. It has temporary properties (e.g., "the cabinet is 60% original in 2019"). This view may lead to describing the same object with incompatible properties at different times.

  2. **Perdurantism**: The object persists by having temporal parts (like a worm through time). The entire history of the object is the object. At any given time, we see a temporal part (a "stage"). 

  3. **Stage Theory**: A variant of perdurantism where we focus on the stage (the object at a time) and define identity over time by a relation (e.g., continuity) between stages.

  The museum's current system: 
  - Each object has one record with one current description and a list of dated events (which can record changes).
  - It cannot handle branching or nesting, so we must decide on a linear history.

  The procedure must address:
  (i) When to keep the same accession number (same object).
  (ii) When to open a new number (new object).
  (iii) When to close a number (object no longer exists or is deaccessioned).
  (iv) When to use two cross-referenced numbers (for an object with two distinguishable careers).

  Additionally, we must note:
  - The procedure should not take more than 20 minutes per case.
  - It must be executable by non-specialists.
  - It must explicitly mark when a decision is based on institutional values (to be countersigned by the senior curator) and when it delivers an answer we might dislike.

  We'll design a step-by-step questionnaire. The steps:

  1. **Material Continuity**: Is there a continuous physical connection of a significant part of the original object? (This addresses the core of the object's identity over time.)

  2. **Functional Continuity**: Does the object continue to serve the same function? (Especially for functional objects.)

  3. **Historical Continuity**: Is there an unbroken chain of possession and documentation? (Provenance chain.)

  4. **Substantial Change**: Has the object undergone a change so substantial that it is no longer the same? (E.g., when the majority of the original material is lost or replaced, or when the form is fundamentally altered.)

  5. **Intentionality and Authority**: What do relevant authorities (e.g., the artist, a restorer, a court) say about the identity? (But note: we cannot delegate our institutional responsibility.)

  6. **Legal and Ethical Constraints**: Are there legal or ethical reasons to treat the object differently? (E.g., restitution claims.)

  We must also consider the system constraints: we can record events and free-text relations, but no branching.

  The procedure will be a series of questions. We stop and hand over to the curator when we hit a question that requires institutional values. We also note when the answer might be disliked.

  **The Decision Procedure**

  **Step 1: Check for Deaccessioning or Destruction**
  - Question: Has the object been formally deaccessioned, or is it physically destroyed beyond any possible reconstruction?
    - If yes: Close the number (with an event recording deaccession/destruction). Stop.
    - If no: Proceed to Step 2.

  **Step 2: Check for Splitting (One Object Becoming Two or More)**
  - Question: Have parts that were once together as one object been permanently separated into two or more distinct objects that can now exist independently?
    - If yes: For each new distinct object, open a new accession number. Close the original number (with an event recording the split). In the free-text field of each new record, cross-reference the original and the other new records. Also, record the split event in the original record. Stop.
    - If no: Proceed to Step 3.

  **Step 3: Check for Recombination (Two or More Objects Becoming One)**
  - Question: Have two or more objects (each with their own accession numbers) been permanently combined into a single object that cannot be separated without destroying the new whole?
    - If yes: Open a new accession number for the combined object. Close the original numbers (with an event recording the merger). Cross-reference the new record in each of the original records and vice versa. Stop.
    - If no: Proceed to Step 4.

  **Step 4: Check Material Continuity and Substantial Change**
  - Question: Does the object retain a continuous physical connection of at least 50% of the original material (by volume or by structural importance) from the time of accession? (Note: This threshold is a judgment call and may be adjusted by institutional policy, but 50% is a starting point. For complex cases, we consider structural importance: e.g., the carcass of a cabinet might be more important than decorative panels.)
    - If yes: Proceed to Step 5.
    - If no: Proceed to Step 6.

  **Step 5: Check Functional and Historical Continuity**
  - Question: Despite material changes, does the object still serve the same function (if functional) and does it have an unbroken chain of possession (provenance) and documentation?
    - If yes: Then it is the same object. Keep the same accession number. Record the changes as dated events. Stop.
    - If no: Proceed to Step 6.

  **Step 6: Consider Authority and Intent**
  - Question: Is there an authoritative statement (by the artist, the original maker, or a recognized expert) that the object is still the same work? (E.g., the artist's estate certificate in the kinetic sculpture case.)
    - If yes: Then consider it the same object. Keep the same number. Record the event and the authority. Stop.
    - If no: Proceed to Step 7.

  **Step 7: Check for Two Careers (Cross-Referencing)**
  - Question: Has the object undergone a change so radical that it has effectively had two distinct "careers" (e.g., before and after a major restoration or repurposing) and both careers are of historical significance? (This is where we might use two numbers with cross-references.)
    - If yes: Then open a new accession number for the object in its new state. Close the old number (with an event recording the transformation). Cross-reference the two numbers. Stop.
    - If no: Proceed to Step 8.

  **Step 8: Judgment Call Based on Institutional Values**
  - At this point, the case is complex and requires a value judgment. We hand it to the curator for a decision. The procedure stops here for the assistants. The curator must decide between:
    - Option A: Treat as the same object (keeping the existing number).
    - Option B: Treat as a new object (open a new number and close the old one).
    - Option C: Treat as two careers (as in Step 7, but without a clear historical break).

  **Notes on the Procedure:**
  - **Step 4 (50% threshold)**: This is a judgment call. We use 50% as a rule of thumb, but structural importance may override. For example, in the cabinet case, the carcass might be considered the core even if the panels are replaced.
  - **Step 6 (Authority)**: We note that the museum is not bound by external authority, but it can be a strong factor.
  - **Step 7 (Two careers)**: This is a way to handle radical change without losing the history. It corresponds to the idea of a "stage" (perdurantism) but without temporal parts in our system. Instead, we break the object into two records.

  **What the Procedure Cannot Do:**
  - It cannot fix monetary value (that is for appraisers).
  - It cannot settle legal title (that is for legal experts and provenance research).
  - It cannot resolve cases where the material history is unrecorded. In such cases, we must do our best with available evidence and then, if the procedure requires information we don't have, we will have to hand it to the curator (Step 8) or make a note of the uncertainty in the record.

  **Mapping to Metaphysics:**
  - **Endurantism**: The object is the same through time by enduring. We record temporary properties (via dated events) and the same number is used. This is our default when we keep the same number (Steps 5 and 6).
  - **Perdurantism (Worm Theory)**: The entire history is the object. We approximate this by having one record with a chain of events. But our system cannot represent temporal parts as separate, so we use events to capture changes.
  - **Stage Theory**: We capture stages by having separate records for distinct careers (Step 7) and then relate them by cross-references (which is a relation between stages).
  - **Temporary Intrinsics**: We record properties at times via events (e.g., "condition: 60% original in 2019"). This avoids the problem of incompatible properties by time-indexing.
  - **Continuity Conditions**: We use material continuity (Step 4) as a primary criterion, which is a common continuity condition.

  **Running the Cases:**

  **Case 1: Late seventeenth-century marquetry cabinet**
  - Step 1: Not deaccessioned or destroyed.
  - Step 2: Not split.
  - Step 3: Not combined from multiple objects.
  - Step 4: The carcass and locks are original (structurally important) and the panels have been replaced. The carcass is the core structure. We might argue that the carcass is more than 50% of the structural importance. So, yes, material continuity is maintained.
  - Step 5: The cabinet still serves the same function (a cabinet) and has the same provenance. So, same object. Keep the same number. Record the 1840s and 2019 restorations as events.

  **Case 2: Two marble portrait busts**
  - Step 1: Not deaccessioned or destroyed.
  - Step 2: They were broken and stored as fragments. Now, after reassembly, they are two busts, but each contains fragments from both originals. We are not splitting one object, but we have two objects that have been reassembled with mixed fragments. So, we go to Step 3.
  - Step 3: Were two objects combined into one? No, we started with two and ended with two. But the fragments were recombined in a way that each bust now contains parts from the other. This is a recombination of fragments but not a merger of two objects into one. So, no. Proceed to Step 4.
  - Step 4: For each bust, does it retain at least 50% of the original material? We don't know the exact percentage, but the fragments are mixed. However, the key point is that the original objects (bust A and bust B) no longer exist as such. Each new bust is a hybrid. So, material continuity for each original bust is broken. So, no for both. Proceed to Step 5.
  - Step 5: Do they have functional and historical continuity? They are still busts, but the provenance chain for the original busts is broken because the fragments were mixed. Also, the original objects are gone. So, probably no. Proceed to Step 6.
  - Step 6: Is there an authority? None mentioned. Proceed to Step 7.
  - Step 7: Have they had two careers? The original busts and then the reassembled ones. The reassembly created new objects. So, we can say that the original busts (with their original fragments) are gone, and we have two new busts. We should close the original two numbers (with an event recording the reassembly and the mixing of fragments) and open two new numbers for the reassembled busts. Cross-reference the old and new numbers. But note: there is a restitution claim against one of the original numbers. We must record that the original object no longer exists and that the claimant might have a claim on the fragments that are now in the new bust. This is a legal matter, but the procedure says: close the old numbers and open new ones. We cross-reference so that the restitution claim can be tracked to the new object that contains the fragments. However, this might be disliked because it breaks the chain for the restitution claim. We must note that the procedure leads to closing the old number and opening a new one. The restitution claim must then be addressed by the curator and legal team, but the procedure for numbering is clear.

  **Case 3: Kinetic sculpture (with certificate)**
  - Step 1: Not deaccessioned or destroyed.
  - Steps 2 and 3: Not split or recombined.
  - Step 4: The motor, bearings, and control unit have been replaced. If these are considered the majority of the material? It depends. If the sculpture is primarily the moving parts, then replacing them might break material continuity. But if the structure is the artwork and the motor is replaceable, then maybe not. However, the artist's estate says it's the same work. So, we can jump to Step 6.
  - Step 6: The estate issued a certificate. So, we treat it as the same object. Keep the same number. Record the replacements as events.

  **Variant without certificate:**
  - Step 4: If we consider the replaced parts as the majority, then no material continuity. Proceed to Step 5.
  - Step 5: It still serves the same function (kinetic sculpture) and has the same provenance. So, same object? But without the certificate, we might be more cautious. However, the function and provenance are continuous. So, we would keep the same number. If we are unsure, we might go to Step 7: does it have two careers? Probably not. So, we keep the same number.

  **Procedure Document**

  **Museum Object Persistence Decision Procedure**

  **Purpose**: To determine the correct accession number(s) for an object that has been altered, repaired, split, or recombined.

  **Time Limit**: 20 minutes per case. If at any point you cannot answer with the available information, note the uncertainty and proceed as instructed.

  **Instructions**: Follow the steps in order. Answer the questions based on the facts you have. If you reach Step 8, hand the case to the senior curator.

  ---

  **Step 1: Deaccession or Destruction?**
  - Question: Has the object been formally deaccessioned or is it physically destroyed beyond reconstruction?
    - Yes: Close the accession number. Record an event: "Deaccessioned" or "Destroyed" with the date. Stop.
    - No: Go to Step 2.

  **Step 2: Splitting?**
  - Question: Has the object been permanently split into two or more distinct objects that can exist independently?
    - Yes: 
      - Close the original accession number. Record an event: "Split into [list new numbers]" with the date.
      - Open a new accession number for each new object. In each new record, in the free-text relations field, note: "Formed from split of [original number] and cross-referenced with [other new numbers]."
      - Stop.
    - No: Go to Step 3.

  **Step 3: Recombination?**
  - Question: Have two or more objects (each with their own accession numbers) been permanently combined into a single object that cannot be separated without destruction?
    - Yes:
      - Close each of the original accession numbers. Record an event in each: "Merged into [new number]" with the date.
      - Open a new accession number for the combined object. In the new record, in the free-text relations field, note: "Formed from merger of [original numbers]."
      - Stop.
    - No: Go to Step 4.

  **Step 4: Material Continuity?**
  - Question: Does the object retain a continuous physical connection of at least 50% of the original material (by volume or, if more appropriate, by structural importance) from the time of accession? (Note: Structural importance means the part that gives the object its essential form or function, e.g., the carcass of a cabinet is more important than a panel.)
    - Yes: Go to Step 5.
    - No: Go to Step 6.
    - Uncertain: If the history is unrecorded and you cannot determine, note the uncertainty in the record and go to Step 6.

  **Step 5: Functional and Historical Continuity?**
  - Question: Does the object still serve the same function (if it had a function) and does it have an unbroken chain of possession (provenance) and documentation?
    - Yes: The object is the same. Keep the accession number. Record the changes as dated events. Stop.
    - No: Go to Step 6.

  **Step 6: Authority?**
  - Question: Is there an authoritative statement (e.g., from the artist, maker, or recognized expert) that the object is still the same work?
    - Yes: The object is the same. Keep the accession number. Record the event and the authority. Stop.
    - No: Go to Step 7.

  **Step 7: Two Careers?**
  - Question: Has the object undergone a radical change such that it has had two distinct historical periods (careers) of significance (e.g., before and after a major restoration that fundamentally altered it) and both are important?
    - Yes: 
      - Close the original accession number. Record an event: "Transformed; new career under [new number]" with the date.
      - Open a new accession number for the object in its new state. In both records, cross-reference the other number in the relations field.
      - Stop.
    - No: Go to Step 8.

  **Step 8: Curatorial Decision Required**
  - The procedure cannot determine the outcome. Hand the case to the senior curator. The curator must choose one of:
    - A: Keep the same accession number (record the changes as events).
    - B: Close the old number and open a new one (then cross-reference).
    - C: Treat as two careers (as in Step 7).

  **Important Notes**:
  - **Judgment Calls**: Steps 4 (50% or structural importance) and 7 (radical change and two careers) are judgment calls. Use your best judgment and document the reasoning in the event record. If in doubt, err on the side of continuity (same number) unless there is a strong reason to break.
  - **What the Procedure Cannot Do**:
    - Fix monetary value: Value must be assessed separately.
    - Settle legal title: Legal questions must be resolved by legal experts.
    - Resolve unrecorded history: In case of missing information, document the uncertainty and proceed. If the procedure leads to Step 8, the curator must decide.
  - **Metaphysical Commitments**:
    - When we keep the same number, we are endorsing an endurantist view: the object endures through change, and we record temporary properties at events.
    - When we create a new number (Step 7), we are treating the object as having distinct stages (stage theory) and relating them.
    - When we split or merge (Steps 2 and 3), we are acknowledging that objects can have temporal boundaries and that identity can be lost in division or gained in fusion.

  **End of Procedure**
answer: |-
  ### Museum Object Persistence Decision Procedure  
  **Purpose**: To resolve accession number assignments for altered objects by applying metaphysical principles of persistence (endurantism vs. perdurantism) in a practical, time-bound manner. Grounded in museum operations, not philosophy.  
  **Time Limit**: 20 minutes per case. Executable by junior staff.  
  **Key Metaphysical Commitments**:  
  - **Endurantism** (object endures as a whole through time): Used when keeping one number; properties change (e.g., "60% modern in 2019" recorded as a dated event).  
  - **Perdurantism/Stage Theory** (object is a series of temporal "stages"): Used when splitting into two cross-referenced numbers (each stage is a new career).  
  - **Worm Theory** (object is its entire history): Not used—our system cannot store branching/nested histories.  
  - **Temporary Intrinsics** (properties are time-indexed): Addressed by dated event records (e.g., "complete at 1898; 60% modern at 2019").  
  - **Continuity Conditions**: Material continuity prioritizes physical persistence; functional/historical continuity supports identity.  
  **Outputs**: (i) Same number, (ii) New number, (iii) Close number, (iv) Two cross-referenced numbers.  
  **Constraints**:  
  - Judgments requiring institutional values (restitution, public trust, historical continuity) are handed to the curator.  
  - Cannot fix value, settle title, or resolve unrecorded history (noted in Step 9).  
  - System limits: One record per number, no branching/nesting. Properties attached to the whole record or a dated event.  

  ---

  ### Stepwise Procedure  
  Follow in order. Answer based on observable facts. **Stop and hand to curator** at Step 8 if institutional values are needed. **Stop and accept** at Steps 2–7 if outcome is clear (even if disliked). Document all decisions in the collection-management system.  

  1. **Is the object deaccessioned or destroyed beyond recognition?**  
     - **Yes**: Close the accession number. Record a dated event: "Deaccessioned" or "Destroyed."  
     - **No**: Proceed to Step 2.  
     - *Why?* Closes the number if the object no longer exists materially or institutionally.  

  2. **Was the object split into independently existing parts?**  
     - **Yes**: Close the original number. Open one new number per independent part. Cross-reference all numbers in free-text fields. Record events: "Split into [new numbers]" (original) and "Formed from split of [original number]" (each new record).  
     - **No**: Proceed to Step 3.  
     - *Metaphysics*: Endurantism fails when one object becomes many. Perdurantism requires new stages (new numbers).  

  3. **Were multiple objects combined into one inseparable whole?**  
     - **Yes**: Close all original numbers. Open one new number. Cross-reference in free-text fields. Record events: "Merged into [new number]" (each original) and "Formed from merger of [original numbers]" (new record).  
     - **No**: Proceed to Step 4.  
     - *Metaphysics*: Fusion creates a new enduring object (endurantism). Original objects cease.  

  4. **Is ≥50% of the original material (by structural importance) continuously present?**  
     - **Yes**: Proceed to Step 5.  
     - **No**: Proceed to Step 6.  
     - *Judgment call*: "Structural importance" overrides volume (e.g., cabinet carcass > decorative panels). Estimate quickly—no precision needed.  
     - *Metaphysics*: Material continuity is core to endurantism. Losing it risks perdurantism (new stage).  

  5. **Does the object retain the same function and unbroken provenance chain?**  
     - **Yes**: Same accession number. Record changes as dated events (e.g., "Panels replaced, 2019").  
     - **No**: Proceed to Step 6.  
     - *Why?* Functional/historical continuity supports enduring identity.  

  6. **Is there an authoritative statement (e.g., artist, maker, court) affirming identity?**  
     - **Yes**: Same accession number. Record the statement as a dated event.  
     - **No**: Proceed to Step 7.  
     - *Why?* External authority can override material discontinuity (e.g., artist’s certificate).  

  7. **Has the object undergone a radical change creating two distinct historical careers?**  
     - **Yes**: Close the original number. Open a new number. Cross-reference both in free-text fields. Record events: "Radical change; new career under [new number]" (original) and "Formed from [original number]; prior career [dates]" (new).  
     - **No**: Proceed to Step 8.  
     - *Judgment call*: "Radical change" = irreversible alteration redefining the object’s significance (e.g., repurposed, reassembled beyond recognition).  
     - *Metaphysics*: Stage theory—each career is a distinct temporal stage.  

  8. **Is the decision driven by institutional values (restitution, public display, historical gaps)?**  
     - **Yes**: Hand to curator with facts. Curator decides: same number, new number, or two careers.  
     - **No**: Proceed to Step 9.  
     - *Why?* Values (e.g., "restitution claimant deserves the original fragments") are beyond facts.  

  9. **Is the material history unrecorded or ambiguous?**  
     - **Yes**: Same accession number. Record an event: "Alteration suspected but unverified; identity assumed." Hand to curator if restitution or high-risk.  
     - **No**: If all steps are answered "no," return to Step 1—case was missed.  
     - *Why?* Default to continuity when evidence is lacking. Avoids false precision.  

  ---

  ### Case Applications  
  **Case 1: Late 17th-century marquetry cabinet (carcass original, panels replaced in 1840s and 2019)**  
  - Step 1: No.  
  - Step 2: No.  
  - Step 3: No.  
  - Step 4: **Yes**—carcass and locks (structurally critical) are >50% of original material.  
  - Step 5: **Yes**—same function (storage cabinet), unbroken provenance.  
  - **Outcome**: Same accession number. Record events: "Panels replaced, 1840s" and "Panels replaced after fire, 2019."  
  - *Metaphysics*: Endurantism—object endures with temporary properties (60% modern in 2019).  

  **Case 2: Two marble busts (fragments mixed in 1974 reassembly, pending restitution claim)**  
  - Step 1: No.  
  - Step 2: **Yes**—original busts were split into fragments.  
  - **Outcome**: Close original numbers. Open two new numbers for reassembled busts. Cross-reference all. Record:  
    - Original 1: "Split and fragments merged into [New 1] and [New 2]."  
    - Original 2: Same.  
    - New 1: "Formed from fragments of [Original 1] and [Original 2]; subject to restitution claim on [Original 1]."  
    - New 2: Similar.  
  - *Hand to curator*: Restitution claim requires institutional values (e.g., whether claimant accepts fragments).  
  - *Metaphysics*: Original objects ceased (endurantism failed); new stages created (perdurantism).  

  **Case 3: Kinetic sculpture (motor/bearings replaced; artist’s estate issues certificate)**  
  - Step 1: No.  
  - Step 2: No.  
  - Step 3: No.  
  - Step 4: **No**—replaced parts likely >50% of functional material.  
  - Step 6: **Yes**—estate certificate affirms identity.  
  - **Outcome**: Same accession number. Record event: "Components replaced per estate certificate [date]."  
  - *Variant (no certificate)*: Step 4 → Step 5 → **Yes** (same function/provenance) → Same number.  
  - *Metaphysics*: Authority overrides material change (endurantism). Without authority, functional continuity suffices.  

  ---

  ### Explicit Limitations  
  1. **Judgment Calls**:  
     - Step 4 (50% material/structure): Pragmatic threshold; staff must estimate.  
     - Step 7 (radical change): Staff decides if change is "career-defining" (e.g., bust reassembly is radical; panel replacement is not).  
     - Step 9 (unrecorded history): Assumes continuity—may conflict with facts.  

  2. **Cannot**:  
     - Fix monetary value or insurance status (hand to appraisers).  
     - Settle legal title or restitution (hand to legal team).  
     - Resolve unrecorded history (defaults to same number; flag uncertainty).  

  **Deliverable**: Print this as a laminated flowchart for staff. Senior curator signs off on Step 8 outcomes.  
