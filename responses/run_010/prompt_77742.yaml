answer: |-
  My friend, let me lay out the case as requested, built to your specifications. We are at a credit union assessing loan applicants for default risk within two years. The two groups are thin-file applicants (60) and established-file applicants (60). The risk score takes three distinct values: Low (0.2), Medium (0.5), and High (0.8). The outcome—default or repayment—is recorded identically for both groups, with no feedback from the decision to the outcome, no sample selection, and the score is a direct, legitimate predictor of default risk, not a proxy for excluded factors like race or gender. 

  For the thin-file group, the distribution is: 10 applicants at Low (0.2), 20 at Medium (0.5), and 30 at High (0.8). Due to exact calibration, the 10 Low-score applicants include 2 who default and 8 who repay; the 20 Medium-score applicants include 10 who default and 10 who repay; the 30 High-score applicants include 24 who default and 6 who repay. Thus, thin-file defaults total 36, for a base rate of 36/60 = 0.6. For the established-file group: 30 applicants at Low (0.2), 20 at Medium (0.5), and 10 at High (0.8). With calibration, the 30 Low-score applicants include 6 defaulters and 24 repayers; the 20 Medium-score include 10 defaulters and 10 repayers; the 10 High-score include 8 defaulters and 2 repayers. Established-file defaults total 24, for a base rate of 24/60 = 0.4—higher for thin-file applicants, as required.

  The credit union uses a common threshold: loans are extended for Low or Medium scores (≤0.5) and declined for High scores (>0.5). For thin-file applicants, 30 are extended loans (all 10 Low and 20 Medium), of whom 12 default (2 Low, 10 Medium) and 18 repay (8 Low, 10 Medium). The 30 declined (all High) include 24 defaulters and 6 repayers. The false positive rate—repayers declined—is 6 out of 24 thin-file repayers, or 0.25. The false negative rate—defaulters extended—is 12 out of 36 thin-file defaulters, or approximately 0.333. For established-file applicants, 50 are extended (all 30 Low and 20 Medium), of whom 16 default (6 Low, 10 Medium) and 34 repay (24 Low, 10 Medium). The 10 declined (all High) include 8 defaulters and 2 repayers. The false positive rate is 2 out of 36 established-file repayers, or approximately 0.0556, and the false negative rate is 16 out of 24 defaulters, or approximately 0.667. Thus, at the common threshold, the thin-file false positive rate (0.25) is materially higher than the established-file rate (0.0556), while the thin-file false negative rate (0.333) is lower than the established-file rate (0.667). Calibration holds perfectly within groups at each score, the base rates differ, and the rate gaps coexist without trade-off.

  Now, consider two repairs using group-specific thresholds to equalize one rate while preserving calibration. First, to equalize false positive rates: the thin-file rate is 0.25 and the established-file rate is 0.0556. With only three score values, exact equality is unattainable. The closest achievable thresholds set thin-file at High (0.8, extending all) and established-file at Medium (0.5, extending Low and Medium). For thin-file, 60 applicants receive loans, including all 36 defaulters and all 24 repayers; no repayer is declined, so false positives drop to 0. For established-file, 50 receive loans (30 Low, 20 Medium), including 16 defaulters (6 Low, 10 Medium) and 34 repayers (24 Low, 10 Medium); 2 repayers are declined (High), for a false positive rate of 2/36 ≈ 0.0556. The absolute difference in false positive rates is 0.0556. Thin-file applicants are extended loans regardless of risk, so the number of thin-file defaulters who receive loans rises from 12 to 36, and no would-have-repaid thin-file applicant is declined. Expected losses for the credit union (assuming a loss of 1 per defaulted loan) are 36 for thin-file and 16 for established-file, totaling 52. This repair eliminates false positives for thin-file applicants—the harm it addresses—leaving them strictly better off in terms of loan denials, though exposed to more debt they cannot repay.

  Second, to equalize false negative rates: the thin-file rate is 0.333 and the established-file rate is 0.667. Again, exact equality is impossible. The closest sets thin-file at Medium (0.5, extending Low and Medium) and established-file at Low (0.2, extending only Low). For thin-file, 30 receive loans (10 Low, 20 Medium), including 12 defaulters (2 Low, 10 Medium); 6 would-have-repaid thin-file applicants (High) are declined, unchanged from before. The false negative rate remains 12/36 ≈ 0.333. For established-file, 30 receive loans (all Low), including 6 defaulters; 18 defaulters are declined (10 Medium, 8 High), for a false negative rate of 6/24 = 0.25. The absolute difference is 0.0833. Thin-file applicants see no change in false negatives (12 defaulters still receive loans) or false positives (6 repayers still declined). Losses are 12 for thin-file and 6 for established-file, totaling 18. This repair leaves thin-file applicants neither better nor worse off on the harm of false negatives—it was not addressed for them—while reducing harm for established-file applicants.

  Neither repair worsens the specific harm targeted for thin-file applicants: the false positive repair benefits them on denials, while the false negative repair leaves them unchanged. The structural conflict persists in the trade-offs: equalizing false positives increases defaults and losses; equalizing false negatives leaves thin-file denials untouched.

  For the side bet: your friend claims equal base rates would ensure equal false positive rates under calibration. This is disproven. Construct both groups with a base rate of 0.5. For thin-file: 20 at Low (4 default, 16 repay), 20 at Medium (10 default, 10 repay), 20 at High (16 default, 4 repay); defaults total 30. For established-file: 10 at Low (2 default, 8 repay), 40 at Medium (20 default, 20 repay), 10 at High (8 default, 2 repay); defaults total 30. At a common threshold of 0.5 (decline High), thin-file has 4 false positives (High repayers), for a rate of 4/30 ≈ 0.133. Established-file has 2 false positives (High repayers), for a rate of 2/30 ≈ 0.067. Unequal false positive rates arise despite equal base rates and calibration, ruled out only if the distribution of repayers across score bins is identical—which it need not be, as here.

  The single feature doing the work is the asymmetric distribution of repayers and defaulters across score bins relative to the threshold. In thin-file, a higher proportion of repayers (25%) are concentrated in the High bin (declined) compared to established-file (5.56%). Delete this asymmetry—by equalizing the proportion of repayers in the High bin—and the gaps vanish. If we drop the stipulation of identical outcome recording, the case collapses: your friend could argue that default labels are biased (e.g., thin-file defaults are overrecorded), making the base rates and disparities artifacts of measurement, not structure. This shifts the debate to label bias, obscuring the inherent metric conflict.

  This case shows that choosing a fairness metric is a substantive moral decision, not technical housekeeping. Calibration prioritizes risk accuracy, accepting disparities in access (false positives) as "base rates speaking." But equalizing access or errors requires trade-offs with efficiency, losses, or other harms, forcing a value choice on which disparity matters most. A defender of your friend’s position might attack it by rejecting the threshold choice as arbitrary (arguing it should minimize losses, not force rate comparisons), dismissing the cost of false positives as secondary to profit, or insisting the thin-file base rate is an immutable fact that metrics cannot override without inviting inefficiency or moral hazard. They might say the case manufactures conflict by ignoring that calibration reflects reality, while other metrics distort it—but the numbers, built from definitions alone, expose the inescapable fork in the road.
