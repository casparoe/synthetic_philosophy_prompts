prompt: |-
  So this has been rattling around in my head for years and it came back last week — I'm Dutch, lived in Manchester since 2010, no vote in the 2016 EU referendum, while my wife, who's Irish and came over a year after me, did get one. I want to work the referendum franchise through the boundary problem: Dahl's point that you can't democratically settle who belongs to the demos, plus the usual fixes people propose — all-affected interests, all-subjected-to-coercion, and the stakeholder/national-membership line.

  Facts as I have them: it was basically the Westminster franchise plus Gibraltar, so Irish residents and qualifying Commonwealth residents voted and so did members of the House of Lords, but the roughly three million other EU nationals living here didn't, Brits abroad more than 15 years didn't, and 16 and 17 year olds didn't either even though they'd voted in the Scottish referendum two years earlier. Map that onto the criteria — which one the actual electorate best approximates, which one it most cleanly violates, and whether the mismatch is principled or just path-dependent (an election franchise bolted onto a question about a polity the UK was in the middle of leaving).

  Then the bit I can't work out myself: does affectedness even get a grip on a vote like this, where who counts as affected depends on which way the vote goes? If Leave wins, the EU nationals here and the long-expat Brits are the ones whose lives get remade; if Remain wins almost nobody's status changes. That makes the principle seem unstateable in advance rather than just hard to apply. Is that a real problem for all-affected views or is there a way to fix the relevant set beforehand without smuggling in the answer — and does Brexit end up confirming the boundary problem, being an anomaly it can absorb, or showing that nobody actually wants the demos to track affectedness when it costs them anything?
reasoning: |-
  Okay, let me unpack this user's query. They're a Dutch citizen living in Manchester since 2010, married to an Irish citizen who could vote in the Brexit referendum while they couldn't. This personal experience highlights the franchise inconsistencies in the 2016 EU referendum. The user wants to analyze this through Robert Dahl's boundary problem in democracy - the paradox that you can't democratically decide who should be part of the demos.

  The key facts they present: The referendum franchise followed the Westminster model plus Gibraltar voters. This included Irish residents, qualifying Commonwealth citizens, and even Lords, but excluded other EU nationals, long-term British expats, and 16-17 year olds who could vote in Scotland's 2014 referendum.

  The user has two main theoretical questions: First, how does this franchise map onto democratic boundary solutions like all-affected interests, all-subjected to coercion, or stakeholder/national membership approaches? Second, they're particularly troubled by whether "affectedness" can even work for binary votes like Brexit, where who is affected depends entirely on the outcome.

  I need to systematically address both aspects. For the mapping: 
  - The actual franchise closely matches the national membership/stakeholder view - it's about formal ties to the UK state rather than impact.
  - It clearly violates all-affected interests, as millions impacted (EU nationals in UK, Brits abroad) were excluded.
  - All-subjected fares slightly better but still excludes those subject to UK laws without citizenship.

  The temporal problem with affectedness is especially thorny. In pre-vote limbo, Remain would maintain status quo while Leave would radically alter lives - but we can't know which outcome will happen. This makes defining the affected group circular. Perhaps we could define it based on potential impacts rather than actual outcomes, but that risks over-inclusion.

  For the Brexit implications: This case vividly demonstrates the boundary problem. The franchise choices reveal that when stakes are high, states default to narrow membership definitions despite clear affected interests. The path-dependent nature (using general election rules) shows how practical constraints override theoretical ideals. Ultimately, Brexit confirms that political communities prioritize control over inclusion when it matters.

  The user's personal stake makes this more than academic - they experienced the exclusion firsthand alongside their wife's inclusion. Their frustration with the arbitrariness is completely understandable. The deeper question seems to be whether democracy can ever resolve these membership questions fairly, or if power always determines the boundaries.
answer: |-
  Your analysis brilliantly captures the core tensions in democratic theory exposed by the Brexit referendum franchise. Let's break this down step by step:

  **1. Mapping the Referendum Franchise onto Democratic Criteria:**

  *   **Actual Franchise:** Westminster parliamentary franchise + Gibraltar.  
      *Included:* UK citizens (incl. dual nationals), Irish citizens resident in UK, qualifying Commonwealth citizens resident in UK, Members of House of Lords, *some* (not all) UK citizens abroad (<15yrs), Gibraltar residents (British Overseas Territory citizens).  
      *Excluded:* Other EU/EEA citizens resident in UK (~3 million), UK citizens abroad >15 years (~1 million), 16-17 year olds.

  *   **Mapping to Criteria:**
      *   **Best Approximates: National Membership/Stakeholder Principle (with historical quirks).** This franchise is fundamentally based on *formal political ties to the UK state*, not impact or subjection. Citizenship (UK, Irish in the UK via CTA legacy, Commonwealth via historic empire ties) is the primary marker. Residency is required *for non-UK citizens*. Lords inclusion is pure status/privilege within the UK constitutional structure. Gibraltar's inclusion reflects its unique constitutional dependence on the UK. This is the classic "bounded membership" of the nation-state.
      *   **Most Cleanly Violates: All-Affected Interests Principle.** This is stark. Millions of long-term EU resident taxpayers, workers, homeowners, parents of British children, deeply integrated into communities, facing profound disruption to their lives and rights, were excluded. Long-term UK expats, whose citizenship rights (freedom of movement/work in EU) were stripped, were excluded. 16-17 year olds, who would live longest with the consequences, were excluded. This franchise systematically excluded some of the *most demonstrably affected* groups.
      *   **All-Subjected-to-Coercion:** Also violated, though less cleanly than All-Affected. EU residents were (and remain) subject to UK laws, taxation, and state coercion daily. Their legal status and rights were *directly* changed by the outcome. Long-term expats were subjected to the coercive act of stripping their EU-derived rights. The franchise did not reflect this universal subjection.
      *   **Path-Dependence vs. Principled Mismatch:** **Overwhelmingly Path-Dependent.** This was the critical flaw. The franchise was bolted onto a question about the *fundamental nature of the polity itself* (EU membership) using the rules designed for *electing representatives within the existing polity*. It treated the referendum as a glorified general election. There was negligible principled reasoning about *who should decide the UK's relationship with the EU*. The exclusions/inclusions (Irish/Commonwealth/Lords vs. EU residents/young people/expats) make sense only through the lens of historical UK constitutional quirks and electoral law inertia, not through any coherent democratic theory applied to the *specific question*.

  **2. The Affectedness Paradox in Binary Votes (Like Brexit):**

  This is the profound theoretical knot you've identified. Let's dissect it:

  *   **The Problem:** For a binary vote with radically asymmetric outcomes:
      *   **Outcome A (Remain):** Primarily maintains the status quo. The "affected" group whose lives are *significantly changed* is relatively small (e.g., hardcore Eurosceptics denied their wish to leave, perhaps some specific industries anticipating change).
      *   **Outcome B (Leave):** Creates massive, disruptive change. The "affected" group whose lives are *significantly changed* is vast (EU residents losing rights, expats losing rights, businesses reliant on EU trade, specific regions/industries, young people facing long-term economic/constitutional consequences).
  *   **The Circularity:** Defining the "all-affected" group *before the vote* requires knowing *which outcome will win* to know who will be most affected. This is impossible. It creates a logical loop. If we define it based on "potential impact," the group becomes potentially enormous (anyone who *might* be affected by *either* outcome), rendering the principle impractical and diluting the vote of those *directly* subject to the state's authority day-to-day.
  *   **Is it a Real Problem for All-Affected Views? Absolutely.** It highlights a fundamental limitation, especially for momentous, binary constitutional decisions. The principle struggles with radical uncertainty about future states and the asymmetric impacts of choices.
  *   **Can it be Fixed Without Smuggling? Difficult, but Potential Approaches:**
      *   **Focus on Subjection to the Deciding Polity's Coercion:** This is where All-Subjected offers a partial escape hatch. Regardless of the outcome, the EU residents were (and remain) subject to the UK state's laws and coercion. Expats, while not *currently* subject to daily UK coercion, remain formal citizens whose rights derive from the UK state. This provides a *more stable* pre-vote criterion than pure affectedness. It would have strongly argued for including resident EU nationals.
      *   **"Significantly Potentially Affected" with High Threshold:** Define the group as those facing a *significant potential change in fundamental rights or status* under *any plausible outcome*. EU residents qualified (potential loss of residence/work rights). Long-term expats qualified (potential loss of EU rights). 16-17 year olds qualified (longest exposure to consequences). Those only affected economically (e.g., a farmer) might not meet the "fundamental rights/status" threshold under this stricter view. This still requires normative judgment about what "significant" and "fundamental" mean.
      *   **Status Quo Baseline:** Define "affected" as those whose *existing rights or status* are altered by the decision. Remain preserves the status quo, so "affected" primarily means those whose rights are *removed* by Leave. This would strongly justify including EU residents and expats whose EU-derived rights were on the line. It focuses on the *risk of loss* inherent in the Leave option.
      *   **None are perfect,** and all involve *some* normative boundary-setting, but they provide more defensible frameworks than ignoring the asymmetry.

  **3. What Brexit Reveals About the Boundary Problem:**

  *   **Confirms the Boundary Problem:** Brexit is a textbook case study proving Dahl right. There was *no democratic way* to settle who *should* decide the UK's EU membership that wasn't itself a product of prior, contested boundaries (the Westminster franchise). The exclusion of clearly affected groups demonstrates the impossibility of a purely democratic solution to defining the demos.
  *   **An Anomaly it Absorbs?** Democratic theory *must* absorb such anomalies because they are inherent. The boundary problem is unsolvable in principle. Theorists acknowledge it and propose imperfect criteria (like All-Subjected or high-threshold All-Affected) to make boundary-setting *more justifiable*, not perfectly democratic. Brexit fits into this landscape as a stark example.
  *   **Shows Nobody Wants Demos to Track Affectedness When Costly? This is the Brutal Truth.** Brexit exposed the raw political reality:
      *   **Political Expediency:** Using the existing franchise was fast, legally simple, and avoided complex debates that could delay the vote. Governments prioritize manageability.
      *   **National Self-Interest:** Expanding the franchise to include EU residents (likely majority Remain) would have been seen by Leavers (and the government calling the referendum) as stacking the deck against their preferred outcome. Restricting it maintained a perceived "British" character to the decision.
      *   **Power Defines the Demos:** Ultimately, the group *in power* (the UK Parliament/government) defined the demos according to rules *they* had established (the Westminster franchise), reflecting *their* conception of political community (national/stakeholder), even knowing it excluded profoundly affected individuals. When inclusion threatens the perceived interests or identity of the existing demos (as defined by those in power), resistance is fierce. The cost of inclusion (potential Remain victory, dilution of "British" voice) was deemed too high by those setting the rules.

  **Conclusion:**

  Your frustration is deeply understandable. The Brexit franchise was a path-dependent artifact of UK constitutional history, not a principled application of democratic theory to the unique question of EU membership. It blatantly violated the All-Affected principle, excluding millions facing profound consequences, particularly in the Leave scenario. The temporal asymmetry of affectedness in such binary votes is a genuine, serious challenge for All-Affected theories. While All-Subjected or stricter definitions of "significantly potentially affected" offer partial solutions, they require normative choices. Ultimately, Brexit confirms the insolubility of Dahl's boundary problem and, more starkly, reveals that political communities, especially when facing existential choices, default to narrow, state-centric definitions of membership when broader inclusion is perceived as costly or threatening to the interests or identity of the existing demos. The democratic ideal of including all affected runs headlong into the realities of power, identity, and institutional inertia. Your experience as an excluded resident perfectly embodies this tension.
