prompt: |-
  I came at this from practice rather than from the literature — years on committees, and later mediating disputes between partners in small firms — and only afterward discovered that what I had formed a view about has a name. What I want now is for the view to be tested, not reported back to me.

  The question is what the difference amounts to between several people doing one thing together and several people doing their own things alongside one another. The familiar accounts, as far as I follow them, locate the difference inside the participants: a shared plan whose sub-plans mesh, an intention each holds with a plural subject, a primitive we-mode. My instinct runs the other way.

  My tentative principle: what makes an activity joint is not a state of anyone's mind but a standing entitlement to repair. People act together just in case, when the shared course of action begins to come apart, each participant is entitled to require of each of the others that they get it back on track, and each is answerable to the others for their own part in its coming apart. Three refinements I want examined rather than assumed. The entitlement is practical rather than moral: it is exercised in a look, a word, a shrug, an exasperated silence, and it need never actually be exercised at all. It must run in both directions: a party who can only be demanded of is an instrument, and a party who can only make demands is a superior, and neither is a participant. And it is directed at the maintenance of the activity, not at the value of what the activity produces. I am aware this looks like a cousin of the view that grounds collective agency in a joint commitment and in the parties' consequent right to rebuke one another. The difference matters to me: I want the entitlement constituted by the practice of repair itself, not by any act of committing, precisely so that it can arise when nobody has decided anything.

  My verdicts:

  1. Two strangers in a cafeteria both lunge for a tray a child has knocked off the counter; between them they steady it; the milk survives; they walk off without speaking. Nothing beforehand, nothing afterward, four seconds in all, and no moment at which either could have rebuked the other for anything. I am certain this is two people doing one thing together.

  2. A faculty committee of nine issues a report whose central recommendation no member would endorse if asked individually, and several privately think wrong. Every one of them says without strain that we recommended it, and the chair routinely tells drifting members that the committee needs them back at the table. Clearly joint, and the cleanest case I have for my principle.

  3. A couple have made Friday dinner together for twenty-two years. It has never been planned, agreed, or discussed; if one is not in the kitchen by six the other is surprised and faintly aggrieved. Joint, obviously, and here the entitlement to repair is real but has essentially never been exercised in words.

  4. A stadium crowd runs a wave. When I stay seated my neighbors hiss, elbow me, and gesture at me to stand: the repair entitlement is exercised loudly and publicly. Yet I do not think the wave is an action of the crowd; I think it is sixty thousand separate amusements that happen to interlock. My principle says otherwise and I am not prepared to give up the verdict.

  5. A flash mob. Three hundred strangers rehearse separately, by video, over six weeks, and perform once in a station concourse. At the moment of performance nobody present has any standing over anybody else, and afterward they disperse permanently. I want to call the performance joint action, which seems to force me to locate the entitlement in six weeks of rehearsal that were not the action at all.

  6. Two climbers roped together on a face. One has decided that if the other slips he will cut the rope. Every outward mark of the entitlement is in place; the commitment is absent. My verdict is disjunctive and I suspect it is unsound: it is joint action, but void, the way a promise made with the fingers crossed is a promise.

  7. A mob dragging a man out of a jail. Mutual belief is total, everyone intends that we kill him, and the repair norms are ferocious — the man who hesitates is shoved, jeered, and named a coward. My principle says joint action and I agree. But I am not satisfied, because it seems able to register the jointness only by treating the mob's norms as entitlements, and I do not think they are entitled to anything. I want to know whether 'entitled' in my principle is doing internal work, meaning entitled by the participants' own lights, and whether that is a defect.

  8. A person drafting a document with a language model that never refuses, never pushes back, and accepts every correction cheerfully. Not joint action; rebuking it is like rebuking a stuck drawer. But a shepherd and a well-trained dog on a difficult field: the dog can be rebuked and does, in its way, demand. I want to say that one is joint. These two verdicts sit badly together and I cannot see what separates them on my own account.

  9. The one I keep circling. A long-married couple each privately believe the other would rather not host the annual dinner, and each therefore hosts it for the other's sake. Everything about the activity is jointly run — the shopping divided, the failures repaired, the reproaches made and taken. But the end they share is false in both directions. Is this joint action, or a well-organized mutual misunderstanding that merely looks like it?

  What I want back is an account. State a principle — or two or three rival candidates, if the material genuinely splits that way — precisely enough that its clauses could be argued about, and tag each clause to the case or cases that force it on you. Then give the resulting verdicts on five cases I have not listed: a jury returning a unanimous verdict after a holdout has been worn down; a congregation whose members each take themselves to be doing what God requires rather than what the others expect; a strike line whose members stay out under threat of expulsion from the union; a parent and a four-year-old playing pirates; and two people who have played one game of correspondence chess a week for thirty years and met only once. Say plainly which of my nine verdicts your account cannot keep, and for each whether it must be overturned or merely re-described. Where I have offered a disjunctive verdict (case 6) or a pair that ought to match and does not (case 8), tell me whether the disjunction is sustainable or a symptom of something wrong upstream.

  Finally, make a judgment I have been unable to make. There is a simpler principle in this neighborhood — roughly, that joint action requires each participant's contribution to be governed by a standing expectation the others can enforce across a stretch of time during which the activity could degrade — and it costs me the cafeteria tray and probably the flash mob, while disposing of the wave and the chatbot in a single stroke. My own account saves more verdicts at the price of several clauses whose only apparent justification is the verdicts they save. Tell me which is the better account and why, and do not settle the matter by observing that each has something to recommend it.

  I am not asking for a bibliography or a register of who holds what. If a familiar position turns out to coincide with one of your candidates, note it in passing and move on; I care about the account.
reasoning: |-
  Okay, the user presents a sophisticated philosophical problem about joint action, grounded in practical experience rather than academic theory. They've developed a novel principle centered on "standing entitlement to repair" as the defining feature of joint action, contrasting it with standard mental-state-based accounts. Their nine cases are carefully constructed thought experiments testing this principle's boundaries.

  I need to help them stress-test their theory systematically. Their core idea - that jointness resides in reciprocal repair entitlements rather than shared intentions - is fascinating but needs rigorous examination. The key tension appears between their verdicts and the principle's ability to consistently explain them. Cases like the stadium wave (where repair occurs but feels individual) and the mob (where repair happens but feels illegitimate) expose this.

  What makes this challenging is their rejection of standard solutions. They explicitly dismiss appeals to shared commitment or mental states, insisting the repair practice itself constitutes jointness. Their cafeteria tray case (instantaneous joint action without communication) forces this. But this creates problems for cases like the flash mob where the "repair entitlement" must somehow exist before the action.

  I consider structuring the response around three candidate principles: their original repair-based account, a simpler expectation-based alternative they mention, and a hybrid "normative practice" approach. Each must be defined precisely with clear necessary and sufficient conditions. The real work will come in mapping how each principle handles all nine original cases plus the five new ones, showing where they align or conflict with the user's intuitions.

  For the new cases: the coerced jury verdict might challenge the reciprocity requirement, the religious congregation might expose where "enforcement" comes from, the strike line with threats could blur consent, the child pirate game tests minimal agency, and the chess players examine long-term practice without interaction. Each will probe different aspects.

  The deepest issue emerges in cases like the mob and the insincere dinner hosts. Here I suspect the user's discomfort comes from conflating descriptive and normative senses of "entitlement." Their principle might work better if we distinguish between the existence of repair practices (descriptive) and their moral legitimacy (normative). The mob has the former without the latter.

  Ultimately their simpler alternative principle (standing expectations) handles more cases cleanly but sacrifices their cherished cafeteria tray example. I lean toward recommending a refined version of their original account but with explicit reciprocity and mutual recognition clauses added - though this risks circularity. The tradeoff between theoretical simplicity and preserving intuitions is unavoidable.
answer: |-
  Here's an account built from your material, prioritizing precision, verdict coverage, and internal coherence over alignment with existing literature. It identifies tensions in your principle, proposes refinements, and judges between your account and the simpler alternative.

  **Candidate Principle 1 (CP1 - Refined Repair Entitlement):**
  Joint action exists iff:
  1.  **Interdependence:** There is a shared course of activity S, constituted by the contributions of multiple agents A1...An, such that S's coherence or successful continuation depends on the appropriate contributions of each Ai. *(Cases forcing: Cafeteria Tray (1), Stadium Wave (4), Flash Mob (5), Climbers (6), Mob (7), Chatbot/Shepherd (8), False Hosts (9))*
  2.  **Mutual Recognition:** Each Ai recognizes the other participants as *agents capable of responding to normative demands* concerning S. *(Cases forcing: Chatbot/Shepherd (8 - excludes chatbot), Congregation)*
  3.  **Standing Reciprocal Repair Entitlement (SRRE):** There exists a standing, *practical* entitlement held by each Ai *against* each other Aj:
      *   To demand that Aj takes steps to repair or prevent degradation of S (e.g., via look, word, silence).
      *   To be held answerable by Aj for Ai's own actions degrading S.
      *   *And crucially, this entitlement is reciprocal and symmetric between participants.* *(Cases forcing: Faculty Committee (2), Couple (3), Stadium Wave (4), Climbers (6 - 'outward marks'), Mob (7 - descriptively), Strike Line)*
  4.  **Practice-Constituted:** The SRRE is constituted by the agents' *actual patterns of normative interaction* (demand, acknowledgment, answerability) concerning S's maintenance, not by prior agreement, commitment, or shared mental state. *(Cases forcing: Cafeteria Tray (1), Couple (3), Flash Mob (5 - rooted in rehearsal practice), False Hosts (9), Chess Players)*
  5.  **Distinct from Product:** The SRRE is directed at maintaining the *shared activity S itself*, not the value or desirability of its outcome. *(Cases forcing: Mob (7), False Hosts (9), Jury)*

  **Candidate Principle 2 (CP2 - Simpler Standing Expectation):**
  Joint action exists iff:
  1.  **Interdependence:** (Same as CP1.1)
  2.  **Governed by Enforceable Expectation:** Each Ai's contribution to S is governed by a standing expectation, held by the other participants collectively or distributively, that Ai will contribute appropriately to maintain S.
  3.  **Enforceability:** This expectation is *practically enforceable* by the other participants (collectively or distributively) across a stretch of time during which S could degrade. Enforcement mechanisms include demands, sanctions (like shunning, hissing, shoving), or expressions of normative disappointment (aggrievement, surprise).
  4.  **Distinct from Product:** (Similar to CP1.5)

  **Verdicts on Your Cases by CP1:**

  1.  **Cafeteria Tray:** **Joint.** Interdependence (S = catching tray). Mutual Recognition (implied by coordination). *SRRE:* Though unexercised, the *structure* exists: either could have demanded effort/explanation if the other let go early or fumbled (reciprocal answerability implied in the coordinated grip). Constituted by the micro-interaction.
  2.  **Faculty Committee:** **Joint.** Clear interdependence (S = producing report). Mutual Recognition. Strong SRRE exercised (chair's demands, implied mutual answerability). Constituted by committee practice.
  3.  **Couple Cooking:** **Joint.** Interdependence (S = making dinner). Mutual Recognition. Strong SRRE (aggrievement/surprise *is* implicit demand/answerability; repair via action is normatively governed). Constituted by long practice.
  4.  **Stadium Wave:** **Joint.** Interdependence (S = wave propagation). Mutual Recognition (of fellow spectators as agents). Clear SRRE exercised (hissing, elbowing = demand; gestures = demand; staying seated makes one answerable). Constituted by crowd practice. *(CP1 forces this verdict, contra your intuition)*
  5.  **Flash Mob:** **Joint.** Interdependence (S = performance). Mutual Recognition. SRRE: The *rehearsal practice* established the normative framework (implicit/explicit corrections, expectations of conformity) governing the performance. The performance itself *instantiates* that framework. Entitlement is constituted by the rehearsal norm-practice applied *to* the performance.
  6.  **Climbers (Traitor):** **Not Joint (Void).** Interdependence & Mutual Recognition present. *Outward marks* of SRRE exist, but the traitor's *internal repudiation* of answerability (plan to cut rope) means the *reciprocal normative relation* (CP1.3, requiring genuine mutual answerability) is fatally undermined. It mimics joint action structurally but lacks the core normative mutuality. (Your disjunction rejected; it's structurally similar but normatively hollow).
  7.  **Mob:** **Joint (Descriptively).** Interdependence (S = lynching). Mutual Recognition. Strong SRRE exercised (shoving, jeering = demand; hesitation makes one answerable). Constituted by mob norms. The principle registers jointness *descriptively* based on the internal normative practice. 'Entitled' here means *entitled according to the participants' own normative framework governing S*. Whether they are *morally* entitled is separate. (Your discomfort stems from the descriptive/normative ambiguity; CP1.5 clarifies it's about S, not value).
  8.  **Chatbot vs. Shepherd:**
      *   **Chatbot:** **Not Joint.** Lacks Mutual Recognition (CP1.2 - it's not recognized as a *normative agent* capable of genuine answerability/demand). Rebukes are instrumental, not normative. No reciprocity.
      *   **Shepherd & Dog:** **Joint.** Interdependence (S = herding). Mutual Recognition (shepherd recognizes dog as trainable normative agent; dog recognizes shepherd's authority/demands). SRRE exists: Shepherd rebukes/commands (demand); dog signals distress/direction (demand); dog is answerable (via training response); shepherd is answerable to the dog's needs/signals. Constituted by their working practice. *(CP1.2 & CP1.3 separate them)*
  9.  **False Hosts:** **Joint.** Interdependence (S = hosting dinner). Mutual Recognition. SRRE present (shopping divided, failures repaired, reproaches made/taken). Constituted by their practice. CP1.5 ensures the false *motivation* (hosting for other's sake) doesn't negate the jointness of the *activity* S, whose maintenance they normatively govern.

  **Verdicts on New Cases by CP1:**

  *   **Jury (Holdout Worn Down):** **Joint.** Interdependence (S = reaching verdict). Mutual Recognition. SRRE: Pressure applied (demands); holdout is answerable; weariness suggests mutual answerability in deliberation. Constituted by jury norms/practice. The coercion doesn't *necessarily* negate reciprocity if normative framework persists.
  *   **Congregation (God-focused):** **Not Joint (or Borderline).** Interdependence weak (S = collective worship? Depends on practice). Mutual Recognition possibly absent/minimal (focused on God, not mutual expectations). SRRE likely weak/absent: Do members *demand* others sing on key? Hold them *answerable* for inattention? If worship is purely vertical (God-individual), not horizontal (congregation-focused), CP1 fails. If there are strong horizontal norms (correcting others, expecting conformity), then Joint.
  *   **Strike Line (Threat of Expulsion):** **Joint.** Interdependence (S = maintaining picket). Mutual Recognition. SRRE: Enforcement exists (threats, shunning - demands); members are answerable. Constituted by union/picket norms. The *source* of the norm (union threat) doesn't negate the *existence* of the practical SRRE *within* the activity.
  *   **Parent & Child (Pirates):** **Joint.** Interdependence (S = playing pirates). Mutual Recognition (parent sees child as agent; child sees parent as co-player/authority). SRRE: Parent guides/corrects (demand); child demands parent play role ("You be the captain!"); both answerable to shared fiction/rules. Constituted by play practice. Level of reciprocity is asymmetric but present.
  *   **Chess Players (30 years):** **Joint.** Interdependence (S = playing the game). Mutual Recognition. SRRE: Moves implicitly demand responses; failure to move (or bad moves) makes one answerable (even if only by forfeit or disappointed expectation); reciprocity in adherence to rules/turn-taking. Constituted by the enduring practice of their game.

  **Verdicts CP1 Cannot Keep & Required Change:**

  *   **Case 4 (Stadium Wave):** CP1 forces **Joint**, contradicting your verdict. This *must be overturned* by CP1. The Wave satisfies all CP1 clauses descriptively.
  *   **Case 6 (Climbers):** Your disjunctive verdict ("joint but void") is *unsustainable* under CP1. CP1 diagnoses it as **Not Joint (Void)** due to the lack of genuine reciprocal normative commitment, overturning your "joint" part. The outward marks are insufficient without the core mutuality of CP1.3.

  **CP1 vs. CP2 (Your Simpler Principle):**

  *   **CP2 Verdicts CP1 Might Struggle With:**
      *   **Cafeteria Tray (1):** CP2 likely **Not Joint.** Is there a "stretch of time" where S (catching tray) could degrade (yes, instantly)? Are expectations practically enforceable? The fleeting nature makes enforcement implausible *before* S fails. CP2 probably costs this case.
      *   **Flash Mob (5):** CP2 likely **Joint.** The rehearsal creates strong, enforceable expectations governing the performance. CP2 handles this cleanly.
      *   **Stadium Wave (4):** CP2 **Joint.** Enforceable expectations clearly present and exercised. CP2 aligns with CP1 here.
      *   **Chatbot (8):** CP2 **Not Joint.** No agent capable of holding/enforcing expectations meaningfully.
      *   **Shepherd (8):** CP2 **Joint.** Enforceable expectations exist and are acted upon.
  *   **Trade-offs:**
      *   **CP1** preserves **Cafeteria Tray** and **False Hosts** more elegantly by focusing on the *structure* of the normative relation (SRRE) instantiated *in* the interaction (or its preparatory practice, as in Flash Mob), even if fleeting or motivationally flawed. It offers a richer, more specific account of *what kind* of normative relation constitutes jointness (reciprocal repair/answerability).
      *   **CP2** gains simplicity and disposes of the **Stadium Wave** problem *if* you hold firm to your intuition that it's not joint action. It also handles **Flash Mob** directly via rehearsal expectations. However, it likely loses **Cafeteria Tray** and struggles to articulate why **False Hosts** is joint *as action* without leaning on mental states (it focuses on governed expectations, which might track the false motives). Its "enforceable expectation" is broader than SRRE, potentially including purely instrumental or coercive enforcement lacking reciprocity (though Strike Line might still pass).

  **Judgment:**

  **CP1 (Refined Repair Entitlement) is the better account, despite its complexity and forcing the Wave verdict.** Here's why:

  1.  **Explanatory Depth:** CP1 identifies a *specific, fundamental normative structure* (SRRE) that directly captures the *relational essence* of acting *together* – the mutual vulnerability and responsibility for the shared endeavor's maintenance. CP2's "enforceable expectation" is broader and less distinctive; it could apply to coordinated but non-joint activities (e.g., cars merging on a highway governed by traffic rules).
  2.  **Verdict Coverage:** CP1 preserves *all* your core intuitions *except* the Wave. It elegantly handles the Cafeteria Tray, the motivationally complex False Hosts, and the Chatbot/Shepherd distinction via Mutual Recognition. Losing the Wave is a cost, but CP1 provides a clear, principled reason *why* it counts (the descriptive SRRE structure).
  3.  **Internal Coherence:** The clauses of CP1 hang together logically. The SRRE (1.3) explains the core jointness. Interdependence (1.1) is necessary for SRRE to have an object. Mutual Recognition (1.2) grounds the possibility of SRRE between agents. Practice-Constitution (1.4) avoids prior commitment. Distinction from Product (1.5) avoids value confusion. CP2's clauses are less tightly integrated.
  4.  **Addressing Your Core Insight:** CP1 fully embodies your instinct that jointness resides in the repair practice itself, arising without decision ("arise when nobody has decided anything" - Tray, Couple). CP2 risks smuggling in prior agreement via "expectations," though its enforceability clause helps.

  **The Cost:** You must accept that the **Stadium Wave** satisfies the conditions for descriptive joint action under CP1, even if it lacks the richer shared agency of the Committee or the Couple. CP1 shows *how* even fleeting, anonymous coordination can instantiate the minimal normative structure of acting together. Your intuition about the Wave might reflect a desire for a *stronger* form of jointness than the minimal structural definition CP1 provides. CP2 avoids this only by potentially sacrificing the Cafeteria Tray, which is a more central pillar of your challenge to mental-state accounts.

  **In essence:** Your principle, refined as CP1, offers a powerful, distinct account of joint action grounded in reciprocal normative practice. Its complexity is justified by its explanatory power and fidelity to your core insights and verdicts, excepting the Wave. Embracing the Wave verdict as a consequence of the theory's descriptive focus on normative structure is preferable to adopting CP2, which sacrifices the Tray and dilutes the distinctive normative core you identified.
