prompt: |-
  I write the 80-word blurbs for a small independent cinema's weekly program. Films get booked months out and I only ever manage to see maybe half of them before copy deadline — for the rest I work from critics' reviews, the programmer's notes and the director's statement, and then write as if I'd been there. Someone wrote in last week about a film I'd called quietly devastating: she said she felt misled, not because I got it wrong (she agreed with the verdict) but because I'd clearly never sat in the room with it, and hadn't said so. Thats the part I can't shake — she isn't disputing the accuracy, she's disputing my standing to say it. Meanwhile I do the neighborhood restaurant picks for a local newsletter in exactly the same secondhand way and neither I nor any reader has ever minded. Give me exactly five numbered points, one or two sentences each, no intro and no wrap-up: is she onto something real, and what explains the difference between the two cases?
reasoning: |-
  Okay, the user writes blurbs for a small cinema and sometimes has to work from secondhand sources when they haven't seen the film. A reader called them out for calling a film "quietly devastating" without having seen it, not because it was inaccurate, but because they felt misled by the lack of firsthand experience. 

  Hmm, interesting that the user does the same thing for restaurant picks in a newsletter with no complaints. They want five numbered points explaining if the reader has a point and why the reactions differ. 

  First, I need to unpack why film might feel different than restaurants. There's something about art being a personal emotional journey—the reader felt the blurb writer's absence mattered because the experience is subjective. Whereas restaurant blurbs are more about functional recommendations. 

  Also, the cinema context sets expectations—people come for curated artistic experiences, so they might care more about the curator's direct engagement. The newsletter feels more like casual tips. 

  The phrase "sat in the room with it" sticks out. It’s about shared vulnerability in the dark theater—something the restaurant context lacks. Physical presence with art creates a different bond. 

  The reader didn’t dispute accuracy but the writer's standing. That’s about authority derived from experience, not just research. Restaurants don’t demand that same authority—maybe because taste is more obviously subjective. 

  And finally, the cinema’s brand is built on passionate curation. If readers suspect descriptions are detached, it might undermine trust in a way that food recs don’t. 

  The user seems thoughtful—they’re not defensive, just wrestling with the ethics of their method. Good on them for caring. The points should validate the reader’s feeling while acknowledging why their other gig doesn’t face this.
answer: |-
  1.  Film is an immersive, subjective emotional experience; describing its impact ("devastating") carries more weight and implies a personal, witnessed reaction that readers expect from an arts curator, unlike a restaurant recommendation focused on objective qualities (cuisine, vibe).
  2.  Cinema audiences invest emotionally and seek a trusted guide; claiming profound impact without firsthand viewing can feel like a breach of that trust regarding the *depth* of your engagement, whereas restaurant picks are seen as functional aggregations of others' opinions.
  3.  The physical act of "sitting in the room" with a film is integral to its power; the reader perceived your description lacked that embodied, communal experience, a dimension irrelevant to describing a meal you haven't personally eaten.
  4.  Artistic critique inherently involves interpretation and feeling; asserting a film's profound effect secondhand risks seeming like borrowed insight, while restaurant descriptions rely more on verifiable facts (menu, style) and aggregate taste, requiring less personal authority.
  5.  The cinema's context implies passionate personal curation; your blurb read as detached critical summary, clashing with that expectation, while the newsletter's restaurant section is understood as a service compiling local buzz, not deep critical authority.
