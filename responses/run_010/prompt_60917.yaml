prompt: |-
  My roommate thinks moral foundations theory settles the left-versus-right debate and I can't quite break his argument. Here's how he puts it:

  (1) If one person's moral intuitions are responsive to a wider range of the considerations that actually matter morally, that person's moral judgments are likelier to be right.

  (2) The data: conservatives respond fairly evenly across care, fairness, loyalty, authority and sanctity; liberals respond strongly to care and fairness and barely at all to the other three.

  (3) So conservative moral judgment is likelier to be right than liberal moral judgment.

  (4) Nothing in (1)–(2) turns on that particular list, and the list isn't even fixed — a liberty/oppression foundation got bolted on after the original five turned out to describe libertarians badly, and fairness has since been split into equality and proportionality. Someone whose intuitions also fire on honor, purity of lineage, deference to elders, and the sacredness of the soil is responsive to a wider range still.

  (5) So the same inference makes him likelier to be right than the conservative, and it keeps going: the more traditionalist and disgust-prone, the closer to moral truth, all the way up to the blood-and-soil nationalist.

  (6) Nobody should sign onto (5), so (1) is false, and the psychology of left and right tells us nothing about who's actually right.

  He says (4)–(5) is just guilt by association dressed up as a reductio. I don't buy that, but I also can't point to the step where it slips. And I'm reluctant to dump (1), because it looks like the only thing that makes the charge of moral blindness mean anything — if being responsive to fewer considerations isn't a defect, what's the complaint against the other side supposed to be? So which step goes, why did it look fine when I first read it, and if the answer really is (1), what am I giving up and is there any weaker version of it I can keep?
reasoning: |-
  Okay, let me try to unpack this user's problem. Their roommate is using Moral Foundations Theory (MFT) to argue that conservatives are more likely to be morally correct because they respond to more moral foundations. The user feels stuck because they sense something's wrong with the argument but can't pinpoint where it breaks down. 

  First, I need to understand the roommate's argument step by step. The key claim is that wider moral intuition range increases likelihood of being right. The data shows conservatives use five foundations while liberals focus on two. Roommate extends this logic to extreme traditionalists to show absurdity. User rejects the extreme implication but can't discard premise (1) without losing the concept of moral blindness.

  Hmm... the core issue seems to be premise (1)'s assumption that intuition breadth equals correctness. But that assumes the foundations themselves are equally valid. What if some foundations aren't actually moral? Like sanctity used to justify caste systems. The validity question is being smuggled in.

  I recall MFT was designed descriptively, not prescriptively. Haidt explicitly says it doesn't settle normative debates. The roommate is misapplying the theory by treating all foundations as equally legitimate. That's the hidden flaw in step (1).

  The user's anxiety about discarding premise (1) is interesting. They worry that without it, we can't call out moral blindness. But we can! We just need external criteria - like whether foundations cause harm or align with autonomy. The "considerations that actually matter" phrase in premise (1) is doing all the work but remains undefined.

  Also, the reductio in step (5) actually works perfectly. If breadth alone determined correctness, extremists would win - which nobody accepts. So premise (1) must be flawed. The user can keep a weaker version: breadth matters only after establishing which foundations are valid.

  This seems like a philosophy undergrad discussion. The user needs tools to expose the hidden normative assumption. They might also feel frustrated that their roommate won't engage with the validity question. There's an unspoken need here: how to counter smug "science proves my politics" arguments while preserving meaningful moral criticism.
answer: |-
  This is a brilliant reductio argument that exposes a critical flaw in premise (1). Your roommate is right that (4)-(5) is a *reductio ad absurdum*, but it's a **valid and necessary one**, not just "guilt by association." It reveals that premise (1) is untenable. Here's the breakdown:

  1.  **The Core Problem: Premise (1) is False (as stated).**
      *   Premise (1) claims: More responsive intuitions to "considerations that actually matter morally" → Likelier to be right.
      *   **The Fatal Assumption:** Premise (1) **assumes we already know which considerations "actually matter morally" and that they are equally valid.** It smuggles in an answer to the very question it's supposed to help solve.
      *   **The Reductio Works:** Step (5) takes the *logic* of premise (1) and applies it consistently. If *mere breadth* of intuitive responsiveness (to things *called* moral foundations) is the key indicator of likely correctness, then the blood-and-soil nationalist, intuitively responsive to lineage, soil, and elders *as sacred*, must be *even more likely* to be correct than the standard conservative. Since this conclusion is absurd (by almost any modern ethical standard), the premise leading to it must be flawed.
      *   **Why It Looked Fine Initially:** Premise (1) *sounds* plausible because *within a shared framework*, being responsive to more relevant factors *is* a sign of better judgment. If we *agree* that care, fairness, loyalty (in moderation), authority (legitimate), and sanctity (non-harmful) are all valid considerations, then yes, someone responsive to all might make more nuanced judgments *within that shared framework*. The problem is that **the left-right debate is precisely about *which* considerations are valid and how to weight them.** Premise (1) pretends this foundational disagreement doesn't exist.

  2.  **What Premise (1) Ignores: Validity and Weighting**
      *   **Validity:** Are *all* considerations labeled as "foundations" *actually* morally relevant? Is "sanctity" invoked to condemn harmless acts (like gay marriage or "impure" foods) a valid moral consideration, or is it prejudice disguised as morality? Is "loyalty" demanding unquestioning support for a corrupt leader valid? MFT *describes* psychological differences; it does not, and cannot, *prescribe* which foundations *should* matter. That's a normative question MFT itself doesn't answer.
      *   **Weighting:** Even if we grant some validity to all foundations, how they are *weighted* is crucial. Liberals might argue that care/harm and fairness/equality overwhelmingly trump loyalty, authority, and sanctity in most situations. Conservatives disagree. Premise (1) assumes that simply *having* the intuition makes it a valid input, ignoring that the *relative importance* assigned to different inputs is the core of the dispute. "Responsiveness" doesn't tell us if the weight given is *correct*.

  3.  **Why the Psychology (Premise 2) Doesn't Settle Who's Right:**
      *   MFT brilliantly describes *how* different groups *intuitively* approach morality. It shows the psychological building blocks.
      *   It **does not tell us which intuitions are tracking objective moral truth, or which foundations deserve moral weight.** Knowing someone has a strong sanctity intuition tells you about their psychology; it doesn't tell you if the thing they find "sacred" (e.g., a particular religious practice vs. the flag vs. the "purity" of a race) *actually* has inherent moral significance warranting that intuition.
      *   The debate is about **which psychological foundations *should* guide moral reasoning and action, and why.** MFT gives us the ingredients, not the recipe for moral truth.

  4.  **What You Can (and Should) Dump & What You Can Keep:**
      *   **Dump Premise (1) as stated.** The idea that broader intuitive responsiveness *by itself* indicates greater likelihood of moral correctness is demonstrably false, as the reductio proves.
      *   **Keep a Weaker, More Defensible Version of (1):**
          *   **Version A (Epistemic Humility within a Framework):** "If, *within a shared understanding of which considerations are valid*, one person is responsive to a wider range of *those agreed-upon valid considerations*, their judgments *on matters involving those considerations* might be more nuanced and potentially less prone to *certain kinds* of error (like overlooking a relevant factor *we agree is relevant*)." This is much weaker and doesn't settle the framework dispute.
          *   **Version B (Defeasible Starting Point):** "Moral intuitions, *including a range of them*, are a common starting point for moral reasoning. However, their *validity* and *weight* must be critically examined through reason, dialogue, and consideration of consequences (harm, well-being, autonomy, justice). Intuitions responsive to a wider range of *plausibly* relevant factors *might* provide a richer base for this reasoning, but they are not inherently more reliable indicators of truth." This explicitly separates the psychological fact (intuition) from the normative evaluation (validity/weight).
      *   **Keep the Core Insight About "Moral Blindness":** You don't need premise (1) to make the charge of "moral blindness" meaningful. The complaint is:
          *   **Failure to Recognize Valid Considerations:** "You are ignoring/underweighting considerations (like harm, fairness, autonomy) that *actually are* morally crucial." This requires *arguing* why those considerations are crucial, not just pointing to psychological responsiveness.
          *   **Overweighting or Validating Invalid Considerations:** "You are giving significant moral weight to considerations (like group purity, unquestioning loyalty, deference based solely on status) that *are not* valid moral grounds, or cause significant harm when applied." This requires *arguing* why those considerations are invalid or harmful.
          *   **The Complaint is Normative, Not Descriptive:** The charge isn't "you have fewer active psychological modules"; it's "you are mistaken about which considerations genuinely matter morally and why."

  **Conclusion:**

  *   **The Step that Goes:** **Premise (1) is false.** The reductio (steps 4-5) successfully demonstrates that breadth of intuitive responsiveness *alone* cannot be an indicator of likely moral correctness because it cannot distinguish between responsiveness to *valid* moral considerations and responsiveness to *invalid* or *harmful* ones disguised as morality.
  *   **Why it Looked Fine:** Premise (1) leverages the intuitive plausibility that within a *shared normative framework*, considering more relevant factors is better. It disguises the fact that the core left-right disagreement is *about* that very framework – which factors *are* relevant and valid.
  *   **What You Give Up & Keep:** You give up the idea that descriptive psychological breadth (as measured by MFT) *settles* the normative debate about who's morally right. **What you keep** is the ability to argue normatively about which foundations *should* matter and why, and to critique the other side for either ignoring considerations you believe *are* crucial (e.g., systemic injustice) or giving undue weight to considerations you believe *aren't* valid or are harmful (e.g., sanctity applied to harmless choices). Your complaint is based on your normative arguments about what "actually matters morally," not on a psychological measure of intuitive range.

  **How to Counter Your Roommate:** "Your argument relies on premise (1): that wider intuitive responsiveness means likelier correctness. But your own reductio proves premise (1) is false. If it were true, the most extreme traditionalist would be the most correct, which is absurd. MFT describes psychological differences, but doesn't tell us *which* intuitions track moral truth. The debate isn't settled by who has more active 'foundations,' but by *which foundations we should value and why*, and *how much* weight to give them. That's a normative debate MFT can inform, but not resolve. My charge of 'moral blindness' isn't that you have more active modules; it's that you're giving too much moral weight to loyalty/authority/sanctity where they cause harm or override fairness/autonomy/care, and undervaluing considerations like systemic equality. That's the argument we need to have."
