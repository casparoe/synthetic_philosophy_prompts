prompt: |-
  I'm on the board of a student-run giving fund — about $40k a year, roughly 25 pitches a semester, each one gets a 15-minute slot, we're not allowed to do outside research during the meeting, and anything over $5k needs two of us to sign off afterward. Half the pitches are ordinary and checkable: $3k for a mobile clinic van, with two years of receipts. The other half are straight-up Pascal's muggings — someone claims their pilot program will, through a chain of effects they can't demonstrate, avert a harm worth billions of lives or "the entire future," and asks for $6k. Right now we just vote, and the muggings lose, mostly because people find them irritating, which isn't a reason.

  I want to build an actual decision procedure out of the argument — one we can run inside the 15 minutes. So: the questions in the order we should ask them, what counts as a sufficient answer to each, where a number is required and where a judgment has to substitute for one, what to do when the applicant can't or won't give a probability at all (this is most of them), where the procedure just says no, and where it hands the thing to the full board because it's a values question. It has to keep whatever the argument really claims rather than collapsing into "distrust big numbers," and it has to seperate two things I think we're currently fusing: how large the claimed payoff is, versus how much credence the story earns.

  One wrinkle I don't think the standard treatments cover: the same people come back. Our threshold gets learned. If the procedure says reject unless the claimed stakes clear X, next semester's pitch clears X+1 and adds a zero. So whatever we adopt can't be a fixed numeric cutoff, or it has to be one that doesn't get easier to beat by inflating the story.

  Then run it on three pitches: $4k for a food pantry with audited numbers; $9k for AI governance outreach that claims some nontrivial chance of mattering to trillions of future people; and $500 from a returning applicant whose pitch is basically last year's with the claimed stakes a hundred times bigger, but who did in fact deliver the small local thing they promised last spring. Include at least one case where the procedure gives an answer I won't like — I'm the one who's voted no on the second pitch every single time — and be straight about which steps are judgment calls dressed as procedure, and what the whole thing can't decide.
reasoning: |-
  We are designing a decision procedure for evaluating grant pitches, particularly those that involve high-stakes claims (Pascal's muggings). The procedure must:
  1. Separate the size of the claimed payoff (stakes) from the credence (probability) we assign to the story.
  2. Be executable in 15 minutes without outside research.
  3. Not rely on fixed numeric cutoffs that can be gamed by inflating the stakes.
  4. Handle cases where the applicant cannot or will not provide a probability.
  5. Identify when a decision is a values question and refer it to the full board.

  The core idea is to break down the evaluation into two main components:
  - **Credence (C)**: Our subjective probability that the intervention will achieve the claimed outcome (or at least some non-negligible part of it).
  - **Stakes (S)**: The magnitude of the claimed benefit, in a common unit (e.g., lives saved, QALYs, or any other unit we choose, but we can also use a relative scale).

  We then compute the expected value (EV) as: EV = C * S.

  However, we must also consider the cost (the amount requested, A) and the cost-effectiveness: EV / A.

  But note: we are constrained by the fact that we cannot do outside research and have limited time. Therefore, we must rely on the pitch and the applicant's responses during the 15 minutes.

  We propose a step-by-step procedure:

  ### Step 0: Pre-filtering
  - If the request is under $5k and the project is ordinary and checkable (like the mobile clinic van), we can use a simplified process: verify that the organization is legitimate and that the funds will be used as stated (via receipts, past performance, etc.). If so, approve (unless there are red flags). This step is quick and based on trust and verifiability.

  ### Step 1: Is this a Pascal's mugging?
  - If the pitch involves a chain of effects leading to an extremely high-stakes outcome (billions of lives, existential risk reduction, etc.), then we proceed with the full procedure for high-stakes claims. Otherwise, use the ordinary track.

  ### Step 2: Break down the theory of change
  - Ask the applicant to briefly outline the causal chain from the intervention to the ultimate outcome. We need to identify the weakest links (steps with low probability or high uncertainty).

  ### Step 3: Assess the credence (C)
  - We cannot get a precise probability, so we break it down:
    a. **Plausibility of each step**: For each critical step in the chain, we assign a rough probability (or a qualitative assessment: very low, low, medium, high). We then multiply these to get an overall credence (if independent). But note: the applicant might not have numbers.
    b. **Track record**: Has the applicant (or similar interventions) delivered on similar promises in the past? If they have a track record, that increases credence.
    c. **Expertise**: Does the applicant have relevant expertise? (But note: we can't verify during the meeting, so we rely on their statement and our impression.)
    d. **Counterarguments**: Are there obvious reasons why this might not work? (We can ask the applicant to address the strongest counterargument.)

  Since we need a number for the calculation, we must convert our qualitative assessment into a quantitative one. We can use a scale:
  - Very low: 1%
  - Low: 10%
  - Medium: 30%
  - High: 60%
  - Very high: 90%

  But note: these are arbitrary and should be adjusted by the board member's judgment. Also, if the chain has multiple steps, the overall probability might become very low.

  Alternatively, we might ask the applicant: "What do you think is the probability of success for this project?" and then adjust based on our assessment of their calibration (but we don't know them). However, they might refuse or give an overly optimistic number.

  Given the constraints, we propose:
  - We break the theory of change into no more than 3 critical steps (to keep it simple).
  - For each step, we ask the applicant for their estimate (if they have one) and then we assign our own (based on the 15-minute pitch). We then multiply the steps (if independent) to get C.

  But note: if the applicant cannot give a probability, we rely solely on our judgment.

  ### Step 4: Assess the stakes (S)
  - We ask the applicant to quantify the stakes in a common unit. If they are using "lives saved" or "QALYs", that's good. If they are using abstract units (like "reducing existential risk by a tiny amount"), we need to convert that into a common unit.

  We can define a common unit: for example, one unit of good = one life saved for one year (or one QALY). But for existential risk, we might use the "expected number of future lives saved" by reducing existential risk by a certain amount.

  Example: if the project claims to reduce existential risk by 0.0001% and the future contains 10^38 lives (a number used in some longtermist work), then the expected lives saved = 0.000001 * 10^38 = 10^32. But note: we don't want to encourage inflation of these numbers.

  To avoid gaming, we must not take the numbers at face value. Instead, we can cap the stakes at a level that we consider reasonable? But that would break the separation.

  Alternatively, we can use the applicant's number but then adjust our credence (C) to account for the fact that the more extreme the claim, the lower our credence (per the concept of extraordinary claims requiring extraordinary evidence). However, we are already capturing that in the credence step.

  ### Step 5: Calculate expected value (EV) and cost-effectiveness (EV/A)
  - EV = C * S
  - Cost-effectiveness = EV / A

  We then compare the cost-effectiveness to a benchmark. But what benchmark? We don't have one set in stone.

  We can use a dynamic benchmark: compare to the other opportunities we fund. However, we cannot do that in the meeting because we don't have the data.

  Alternatively, we can set a minimum cost-effectiveness threshold. But note: we don't want a fixed number because then applicants can inflate S to beat it.

  Proposal: We use a threshold that is based on the best available giving opportunities we know of (from previous knowledge). For example, if we know that the best health interventions cost about $100 per life saved (like some bednet distributions), then we can set a threshold of $100 per life saved (or adjust for our common unit). But we are not experts and we don't have data in the meeting.

  Given the constraints, we might have to rely on a qualitative assessment: is this project in the same ballpark as the best we've seen? But that's vague.

  We can do: if EV/A is at least X times better than a benchmark (like the food pantry we funded) then approve, else reject.

  But we need a benchmark. Let's set a benchmark project: a typical food pantry might save a life for $1,000? (This is a made-up number. In reality, we should have a standard benchmark based on our past grants.)

  Alternatively, we can use the following rule: if the project is high-stakes and the expected cost-effectiveness is not clearly outstanding (by orders of magnitude) compared to a standard charity, then we reject because of the low credence. But note: the high stakes might make up for the low credence.

  ### Step 6: Avoidance of gaming
  - To prevent applicants from inflating the stakes, we note that if the same applicant returns with a similar project but with inflated stakes, we penalize the credence (because they are gaming the system). Also, we can look at the ratio of the stakes to the previous pitch. If the stakes have increased without a corresponding increase in evidence, we lower the credence.

  ### Step 7: Values questions
  - If the project involves a trade-off between different kinds of value (e.g., helping humans now vs. future generations, or humans vs. animals), then we flag it as a values question and refer it to the full board.

  ### Step 8: Decision
  - If the project is high-stakes and the expected cost-effectiveness (EV/A) is at least 10 times better than our benchmark (which we set as the cost-effectiveness of the typical food pantry project we fund) then we approve (if under $5k, or if over $5k we need two signatories). Otherwise, we reject.

  But note: we must set the benchmark in advance. Let's assume we have a benchmark project that we know well. For example, our food pantry project: $4k for 4 life-years saved (this is an example, adjust based on reality). Then the cost-effectiveness is 4 life-years / $4k = 1 life-year per $1k.

  Then we require that the high-stakes project has EV/A >= 10 life-years per $1k? (i.e., 10 times better). But note: for existential risk, the life-years might be in the trillions. So even with low credence, it might pass.

  ### The Procedure Outline

  1. **Determine track**: Ordinary or high-stakes?
     - Ordinary: Verify legitimacy and past performance. If verified, approve (if under $5k, one signer; over $5k, two signers). If not, reject.
     - High-stakes: Proceed to step 2.

  2. **Theory of change breakdown**: Ask the applicant to describe the causal chain in 3 critical steps.

  3. **Assess credence (C)**:
     - For each step, assign a probability (using the scale or applicant's number if provided, but we adjust for our judgment).
     - Multiply the probabilities of the steps to get the overall C (if they are independent; if not, adjust accordingly).
     - Adjust for track record: if the applicant has delivered in the past, multiply C by a factor (e.g., 1.5 for good track record; 0.5 for bad or none). But note: past performance on small projects might not predict high-stakes projects.
     - If the same applicant has inflated the stakes without new evidence, we penalize C by a factor (e.g., divide by 10 for each order of magnitude of inflation).

  4. **Assess stakes (S)**:
     - Ask the applicant to quantify the benefit in a common unit (we define: life-year saved, or if they use a different unit, we ask for a conversion). If they cannot, we try to estimate based on their description.
     - For existential risk: S = (reduction in risk) * (value of the future). We ask for the reduction in risk and the value they assign to the future. We then compute S.

  5. **Calculate expected value (EV)**:
     - EV = C * S

  6. **Cost-effectiveness (CE)**:
     - CE = EV / A (where A is the amount requested)

  7. **Compare to benchmark**:
     - We have a benchmark cost-effectiveness (B): from our typical project. Example: B = 1 life-year per $1k.
     - We require CE >= 10 * B (i.e., 10 life-years per $1k) to approve.

  8. **Values check**:
     - If the project involves a significant values divergence (e.g., prioritizing future lives over current, or animal lives over human), then we note that and refer to the full board for a vote on values.

  9. **Decision**:
     - If the project passes the CE threshold and there are no values issues, then approve (with the required sign-offs for amount).
     - Otherwise, reject.

  ### Run on three pitches

  #### Pitch 1: $4k for a food pantry with audited numbers
  - **Step 1**: Ordinary. Verify audited numbers and past performance. We see they have receipts and audited numbers. They have delivered before. **Approve.**

  #### Pitch 2: $9k for AI governance outreach that claims some nontrivial chance of mattering to trillions of future people.
  - **Step 1**: High-stakes (Pascal's mugging).
  - **Step 2**: Theory of change: 
    1. Outreach to policymakers -> 
    2. Leads to better AI governance policies -> 
    3. Reduces existential risk from AI.
  - **Step 3**: Assess credence (C)
    - Step 1: Probability that outreach reaches and influences policymakers? We might say: low (10%) because it's hard to influence policy.
    - Step 2: If influenced, probability that it leads to better governance? Medium (30%).
    - Step 3: If better governance, probability that it reduces existential risk by the claimed amount? Very low (1%) because the link is tenuous.
    - Overall C (if independent) = 0.1 * 0.3 * 0.01 = 0.0003 (0.03%).
    - Track record: Unknown? If they have none, we don't adjust. If they have some, we might adjust upward slightly. But in the pitch, we don't have evidence of track record in this area. So we stick with 0.0003.
    - Note: the applicant might say their chance is higher, but we use our judgment.
  - **Step 4**: Stakes (S)
    - They claim: reducing existential risk by 0.0001% (this is a made-up number for illustration; in reality they might not quantify). And they value the future at 10^38 life-years (if we assume a long future). So S = 0.000001 * 10^38 = 10^32 life-years.
    - But note: we might question the value of the future. However, we use their number for the calculation.
  - **Step 5**: EV = 0.0003 * 10^32 = 3e28 life-years.
  - **Step 6**: CE = EV / A = 3e28 / 9000 = 3.33e24 life-years per dollar.
  - **Step 7**: Benchmark B = 1 life-year per $1000 (if our food pantry gives 1 life-year per $1k). Then 10*B = 10 life-years per $1k = 0.01 life-years per dollar.
    - Our CE (3.33e24) is astronomically higher than 0.01. So it passes the CE threshold.
  - **Step 8**: Values check: This project is about saving future lives. If our fund has a mandate that includes future generations, then no issue. But if we only care about current lives, then it's a values question. We note that and refer to the board for a values vote.
  - **Decision**: If the board is okay with valuing future lives, then approve (but note: $9k requires two signatories). Otherwise, reject.

  But note: the procedure says to approve on cost-effectiveness grounds. However, the board might have a values objection to prioritizing the long-term future. So we must flag that.

  #### Pitch 3: $500 from a returning applicant. Last year they promised a small local thing and delivered. This year, same project but stakes 100x bigger.
  - **Step 1**: High-stakes? Yes, because of the inflated stakes.
  - **Step 2**: Theory of change: same as last year? They might not change the chain, just the stakes.
  - **Step 3**: Assess credence (C)
    - We break the chain as before. But note: last year they delivered a small local outcome. However, this year they are claiming a much larger impact (100x) without changing the intervention. This is a red flag.
    - We assign the same step probabilities as last year? But then note: if last year we believed their project had a high chance of achieving the small outcome, but this year they claim a 100x bigger outcome from the same project, we must adjust.
    - We penalize for inflation: if they increased the stakes by 100x without new evidence, we divide the credence by 100. So if last year we assigned C = 0.3 (for the small outcome), this year we assign C = 0.3 / 100 = 0.003 for the big outcome.
    - Alternatively, we might reassess the chain: if the chain is the same, but the outcome is claimed to be 100x, we might find that one step now has lower probability. We assign:
        Step 1: same as before? But step 1 (the direct outcome) might be the same. The inflation might be in a later step. So we break it down.
    - Example: Last year: project -> helps 100 people (high probability: 90%). This year: project -> helps 100 people (90%) -> and then through a ripple effect helps 10,000 people. The new step (ripple effect) might have low probability: 1%. So overall C = 0.9 * 0.01 = 0.009.
    - We might also note the gaming: they are inflating the stakes without a stronger justification, so we are skeptical. We assign a low probability to the new step.
  - **Step 4**: Stakes (S): They claim 100 times the stakes of last year. If last year they helped 100 people for one year (100 life-years), this year they claim 10,000 life-years.
  - **Step 5**: EV = 0.009 * 10,000 = 90 life-years.
  - **Step 6**: CE = 90 / 500 = 0.18 life-years per dollar = 180 life-years per $1k.
  - **Step 7**: Benchmark: 1 life-year per $1k. 10*B = 10 life-years per $1k. Our CE (180) is above 10. So it passes.
  - **Step 8**: Values: No issue.
  - **Decision**: Approve? But wait, we are concerned about the inflation. However, the math passes. But note: we might have a rule that if the same applicant inflates the stakes without justification, we reject regardless? We haven't built that in. Alternatively, we might adjust the credence even more.

  But note: the procedure uses the credence to account for the inflation. We already penalized the credence by 100x (or by the factor of the inflation). So the expected value is the same as if we had last year's project? Let's see:

  Last year: 
    C = 0.9 (for 100 life-years) -> EV = 90 life-years, for say $500 -> CE = 90/500 = 0.18 per dollar.

  This year:
    EV = 90 life-years (as above) for $500 -> same CE.

  So if last year we approved, then this year we should too. But note: last year they delivered the 100 life-years? If they did, then why did we assign only 90 life-years expected? We should have assigned C=1 for the direct outcome? Actually, we only fund in advance. Last year we might have assigned C=0.9 and approved because the CE was good. Then they delivered 100 life-years. This year they are claiming 10,000 with a new step that we assign 1% chance. So we are funding a different project? Actually, it's the same intervention but a different outcome claim.

  But note: the procedure does not remember last year's funding decision. We are evaluating independently.

  We might reject because the applicant is being dishonest by inflating the stakes? But we don't know that. They might genuinely believe the ripple effect. We capture our skepticism in the low credence.

  So the procedure says: **Approve** (if under $5k, so one signer) because the CE is above the threshold. But note: the amount is only $500, so it's low risk.

  ### One case that the user won't like
  The user says they have voted no on the AI governance pitch every time. In our procedure, if the board accepts the values (prioritizing future lives), then we would approve it because the CE is astronomically high. The user might not like that. But note: the procedure is designed to separate the credence and the stakes, and in this case the low credence is offset by the immense stakes.

  However, we have a values check. If the board does not value future lives at the same rate, then we reject. So if the user is against valuing the long-term future, they can argue at the values step.

  ### Limitations
  - The procedure relies heavily on subjective judgments in assigning probabilities and in setting the benchmark.
  - The conversion of qualitative assessments to numbers is arbitrary.
  - The benchmark might be inaccurate.
  - The procedure does not account for counterfactuals (what would happen without our grant) or the applicant's room for more funding.
