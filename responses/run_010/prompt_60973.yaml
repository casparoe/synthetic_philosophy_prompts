answer: |-
  Below is a decision procedure designed to address your requirements: it separates stakes from credence, avoids fixed numeric cutoffs to prevent gaming, operates within 15 minutes, handles unquantified probabilities, flags values questions, and includes safeguards against iterative stake inflation. The procedure is structured as a flowchart of questions, with clear criteria for sufficiency, judgment calls, and exit points.

  ---

  ### **Decision Procedure for Grant Pitches**
  **Principles:**  
  1. **Credence (C)** = Subjective probability the claimed outcome occurs (0–100%).  
  2. **Stakes (S)** = Magnitude of claimed benefit, normalized to "units of good" (e.g., 1 unit = 1 life saved for 1 year).  
  3. **Cost-Effectiveness (CE) Threshold** = Dynamic benchmark based on historical grants (not a fixed number).  
  4. **Gaming Penalty** = Automatic credence reduction for stake inflation without new evidence.  
  5. **Exit Points:** Reject if critical answers are insufficient; flag for board vote on values conflicts.  

  **Required Prep (Before Meetings):**  
  - Maintain a shared database of past grants: project type, claimed S, delivered outcome (if verified), and credence assigned.  
  - Set a **baseline CE benchmark**: e.g., median cost-effectiveness of past "ordinary" grants (e.g., food pantry saves 1 life-year per $1k).  

  ---

  #### **Step 1: Classify the Pitch (1 min)**  
  - **Question:** "Is the outcome verifiable and directly causal (e.g., receipts for a van) or high-stakes/chained (e.g., influencing AI policy)?"  
  - **Exit to Ordinary Track:** If verifiable/direct causal link.  
    - *Criteria:* Approve if costs are justified by receipts/audits and amount ≤$5k. For >$5k, require two signatures.  
  - **Proceed to Mugging Track:** If stakes ≥1,000,000 units (e.g., "saving millions of lives" or "shaping the far future").  

  #### **Step 2: Demand a Testable Mechanism (3 min)**  
  - **Question:** "Describe the causal chain from this grant to the outcome. What is the weakest link?"  
  - **Sufficient Answer:** Specific, falsifiable steps (e.g., "We run workshops → policymakers adopt guidelines → reduced AI risk").  
  - **Insufficient Answer:** Vague, untestable, or circular logic (e.g., "This sparks a movement").  
  - **Exit:** Reject if no testable mechanism.  

  #### **Step 3: Assess Credibility (C) (5 min)**  
  - **Question 3.1:** "What is your estimated probability of success for each step? If no number, what would falsify it?"  
    - *Judgment Call:* Convert qualitative answers to probabilities:  
      - "Almost certain" → 90%  
      - "Likely" → 60%  
      - "Plausible" → 30%  
      - "Possible" → 10%  
      - "Unfalsifiable" → 0.1% (penalty for vagueness).  
  - **Question 3.2:** "What evidence supports this? (e.g., pilot data, analogous cases)"  
    - *Sufficient:* Data from similar interventions or expert endorsements.  
    - *Insufficient:* Anecdotes, untested models.  
  - **Question 3.3:** "What is your track record? (e.g., past grants delivered)"  
    - *Judgment Call:* Adjust C based on history:  
      - Past promise delivered → Multiply C by 1.5 (reward reliability).  
      - Past promise broken → Multiply C by 0.5 (penalty).  
  - **Gaming Penalty:** If applicant raised stakes without new evidence (e.g., last year S=X, now S=100X), **divide C by 10× the stake multiplier** (e.g., 100X inflation → C/10).  
  - **Assign C:** Multiply probabilities of each step. If applicant refuses probabilities, use your judgment from Q3.1–3.3.  
  - **Exit:** If C < 0.1% after penalties, reject.  

  #### **Step 4: Quantify Stakes (S) (3 min)**  
  - **Question:** "Convert the outcome to units of good (e.g., 1 life saved = 1 unit; 1B lives = 1e9 units). For existential risk: What % reduction in risk? Over what timeframe?"  
  - **Sufficient Answer:** Numeric with justification (e.g., "0.001% risk reduction over 100 years").  
  - **Insufficient Answer:** "Infinite value" or "all future lives."  
  - **Judgment Call:**  
    - Cap S at 1e30 units for existential claims (avoids ∞ values).  
    - If unquantifiable, use analogies (e.g., S = 10× a similar grant).  
  - **Exit:** Reject if S cannot be quantified.  

  #### **Step 5: Calculate Cost-Effectiveness (CE) (1 min)**  
  - **Formula:** CE = (C × S) / Amount Requested.  
  - **Dynamic Threshold:** Compare to **baseline CE benchmark** (e.g., food pantry: 1 unit/$1k).  
    - *Approve if:* CE ≥ 10× baseline (e.g., 10 units/$1k).  
    - *Reject if:* CE < 10× baseline.  

  #### **Step 6: Values Check (2 min)**  
  - **Question:** "Does this pit two values against each other? (e.g., present vs. future lives, humans vs. animals)"  
  - **Flag for Board:** If values conflict (e.g., prioritizing future lives over current hunger).  
  - **Non-Controversial:** Approve/reject based on CE.  

  #### **Step 7: Final Decision**  
  - ≤$5k: One board member approves/rejects.  
  - >$5k: Requires two signatures.  

  ---

  ### **Run on Example Pitches**
  #### **Pitch 1: $4k for Food Pantry (Audited)**  
  - **Step 1:** Ordinary track → Verify receipts.  
  - **Step 7:** Approve (CE benchmark met, audited).  
  - **Time:** 3 min.  

  #### **Pitch 2: $9k for AI Governance Outreach**  
  *Claims: "Nontrivial chance of reducing AI risk, benefiting trillions."*  
  - **Step 1:** Mugging track (stakes ≥1e9 units).  
  - **Step 2:** Mechanism: Workshops → policy drafts → legislation → lower AI risk. Weakest link: Adoption by policymakers.  
  - **Step 3:**  
    - Q3.1: Applicant says "plausible" for all steps → Assign: Step 1 (60%), Step 2 (30%), Step 3 (10%) → C = 0.6 × 0.3 × 0.1 = 1.8%.  
    - Q3.2: No pilot data → Multiply C by 0.7.  
    - Q3.3: No track record → C unchanged (1.26%).  
  - **Step 4:** Claims "0.0001% risk reduction over 100 years; 1e20 future lives" → S = 1e20 × 0.000001 = 1e14 units (capped).  
  - **Step 5:** CE = (0.0126 × 1e14) / 9000 ≈ 1.4e9 units/$ → Baseline = 1 unit/$1k → CE is >>10× baseline → **Approve**.  
  - **Step 6:** Values conflict? Yes (future vs. present lives) → **Flag for full board vote**.  
  - **Result:** Board votes on values. *You might dislike this, but CE clears the bar.*  
  - **Time:** 14 min.  

  #### **Pitch 3: $500 for Returning Applicant**  
  *Claims: Same as last year’s $500 grant (delivered local outcome) but stakes 100X higher.*  
  - **Step 1:** Mugging track (inflated stakes).  
  - **Step 2:** Same mechanism as last year (e.g., "community events → local impact").  
  - **Step 3:**  
    - Q3.1: Steps unchanged → Assign same C as last year (e.g., 50%).  
    - Gaming Penalty: Stakes ×100 → C = 50% / (10 × 100) = 0.05%.  
  - **Step 4:** S = 100× last year’s S (e.g., 100 × 100 units = 10,000 units).  
  - **Step 5:** CE = (0.0005 × 10,000) / 500 = 0.01 units/$ → Below 10× baseline → **Reject**.  
  - **Time:** 10 min.  

  ---

  ### **Limitations and Judgment Calls**  
  - **Judgment Dressed as Procedure:**  
    - Probability assignments (Step 3) are subjective but anchored to qualitative scales.  
    - Stake quantification (Step 4) relies on analogies when applicants are vague.  
    - Gaming penalty (Step 3) is arbitrary but necessary to disincentivize inflation.  
  - **What It Can’t Decide:**  
    - Values conflicts (Step 6) require board votes.  
    - Extraordinary claims with zero evidence (C → 0%).  
  - **Why It Works:**  
    - Separates stakes and credence explicitly.  
    - Dynamic CE threshold and gaming penalty prevent inflation.  
    - Rewards track records and penalizes vagueness.  

  This procedure forces rigor on high-stakes claims while streamlining ordinary grants. For AI governance (Pitch 2), it flags the values conflict—letting the board decide if future lives outweigh present needs. If your fund rejects all "muggings" on principle, you may still vote no at the values stage, but the math may surprise you.
