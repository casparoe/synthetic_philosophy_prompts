prompt: |-
  I'm trying to write the methods section of a chapter on institutional persistence and I keep hitting the same wall: everybody says "path dependent," nobody says what would count as evidence that they're wrong. So before I commit to a definition I want the spec. Write out the desiderata — the requirements any adequate account of path dependence or lock-in has to meet — with the case or consideration behind each one, and then tell me which requirements are load-bearing and which are just the taste of a particular camp (the economists who want efficiency talk, the historical sociologists who want narrative sequences, the modelers who want it phrased as a property of a stochastic process).

  Setup, so you know what "adequate" means for me: I want an account I can apply to a single real case, where I get one run of the process and no repeats, and where I want to be able to say something like "outcome X is locked in, and a feasible alternative Y at fork t would have stuck too." So the theory has to earn its counterfactuals rather than inherit them from a metaphor.

  Cases it has to get right, beyond the usual suspects (keyboard layouts, videotape formats, the gauge of a railway):

  1. A mid-sized city that tore out its streetcar network and never got one back. Everyone calls this lock-in. I want the account to be able to tell me whether that's a claim about the causal process that produced the outcome, or just a claim that reversing the outcome is expensive now — because those come apart, and I think a lot of the literature slides between them.

  2. A standard that got adopted early, stayed, and where switching would cost more than it's worth — but where the standard is also, as far as anyone can measure, the best one available. My gut says the account has to be able to say "yes, path dependent" here, because otherwise it collapses into "path dependence = market failure." But then it has to not turn out that every stable thing in the world is path dependent, or the concept does no work at all. Those two pulls are the crux, I think, and I want to see how your list handles it.

  3. Equifinality: two different early forks, same destination a century later. Most definitions seem silent on this. If they are, they can't tell me whether the fork mattered, which is the only question I actually care about.

  Now the part I most want you to be decisive on: is there a subset of these requirements that can't be jointly satisfied? I suspect a triangle between (a) usable from one unrepeatable case, (b) licenses claims about paths not taken, and (c) doesn't smuggle in a welfare baseline for calling the locked-in outcome inefficient. If you think that's a genuine impossibility, say so and say which leg you'd cut. If you think I'm wrong, tell me where the triangle leaks.

  Also: flag the single requirement that knocks out the most candidate definitions. I'd bet on granularity — what counts as a "state" and what counts as a "fork" seems to depend on how finely you carve, and if you carve finely enough then trivially every process is sensitive to its initial conditions, which makes path dependence true of everything and therefore of nothing. But argue for it or against it, don't just adopt my guess.

  Lastly, briefly, no more than a short paragraph each and no bibliography: how do the main contenders do against your list — the increasing-returns / positive-feedback economists' version, the historical-sociology version that leans on reactive sequences instead of self-reinforcement, the taxonomy-of-mechanisms version (coordination effects, learning effects, adaptive expectations), and the skeptical economists who think properly documented cases of inefficient lock-in are close to nonexistent. Which survive, and which fail a requirement you'd have thought they'd clear.

  Commit throughout. I don't want "some would emphasise X while others stress Y" — I want your ranking of the requirements, your reasons for it, and an explicit note on any place you think I've stacked the deck against a camp by how I've framed the cases.
reasoning: |-
  Okay, the user is tackling a complex theoretical problem in institutional persistence, specifically around defining "path dependence" in a way that's empirically testable and avoids common pitfalls. They're clearly frustrated with vague usage in literature and want precision. 

  First, I need to unpack their core demand: they want desiderata (requirements) for any valid account of path dependence that can handle their three tricky cases while satisfying their methodological constraints (single unrepeatable case, meaningful counterfactuals, no welfare smuggling). The streetcar example highlights their concern about confusing causal processes with mere irreversibility. The "best standard" case challenges the link between path dependence and inefficiency. Equifinality probes whether early forks genuinely matter.

  Hmm, the user's suspicion of an impossible triangle feels acute. If we demand (a) applicability to single cases, (b) license for counterfactuals, and (c) no welfare baseline, we might indeed hit a wall. Counterfactuals in singular cases inherently require some theoretical scaffolding—how else can we assert "Y would have stuck"? But if that scaffolding relies on welfare judgments (e.g., "Y was better"), we violate (c). Maybe the escape hatch is to ground counterfactuals in *feasible alternatives at time t* rather than optimality. 

  The granularity trap they mention is real. If we define states too finely (e.g., "exact budget allocation on Tuesday"), everything becomes path-dependent trivially. But too coarsely (e.g., "had democracy or not") loses explanatory power. The solution might be to tie state definitions to *institutional decision points*—moments where legitimate alternatives were materially possible. 

  For contenders: 
  - Economists' feedback loops fail the "best standard" case (since they require inefficiency). 
  - Historical sociology's narrative sequences handle equifinality well but struggle with counterfactuals (how to prove Y would've stuck?). 
  - Taxonomy approaches are flexible but risk becoming laundry lists without predictive power. 
  - Skeptics ironically help by forcing rigor, but their dismissal of most cases as efficient ignores how institutions calcify suboptimal options through power, not just efficiency.

  User's framing seems fair—they're not stacking decks but exposing fault lines. Their streetcar case brilliantly isolates the causation/reversibility confusion that plagues the literature. If I were writing their chapter, I'd stress that path dependence earns its keep only when we can identify *forfeited alternatives that were viable at the fork*—not just any alternative, but ones that had real traction. That resolves the "best standard" paradox: even optimal outcomes are path-dependent if suboptimal alternatives could have persisted. 

  The triangle isn't impossible, but it demands discipline: use contemporary actors' feasible options (not later judgments) to define forks, and mechanistic persistence tests (not welfare) to define lock-in. It's hard work, but their cases show it's necessary.
answer: |-
  Here’s a distilled set of **desiderata for path dependence/lock-in**, ranked by load-bearing importance, with cases motivating each requirement. I’ll then resolve your triangle and evaluate contenders.

  ---

  ### **Core Requirements (Load-Bearing)**
  1. **Counterfactual Viability at Decision Points**  
     *Requirement:* Must identify specific historical **forks** (t) where ≥2 feasible alternatives existed, *and* demonstrate that *either* could have persisted under self-reinforcing mechanisms.  
     *Case:* **Streetcar removal** (1). If reversal is costly *now* but no feasible alternative existed *at the fork* (e.g., buses were inevitable due to subsidies), it’s not lock-in—it’s sunk costs. Separates causal process from irreversibility.

  2. **Self-Reinforcement Without Efficiency Assumptions**  
     *Requirement:* Lock-in must arise from **endogenous feedback** (e.g., coordination, sunk costs, adaptive expectations)—*not* require the outcome to be inefficient.  
     *Case:* **"Best Standard" scenario** (2). If standard Q is optimal *and* locked in via network effects, it’s still path dependent: a suboptimal R *could* have persisted if adopted early. Avoids conflating path dependence with market failure.

  3. **Non-Equifinality of Early Forks**  
     *Requirement:* Must explain why **different early choices** lead to divergent outcomes—or justify why they *don’t*. If forks converge despite different paths, path dependence is weak/nonexistent at that fork.  
     *Case:* **Equifinality** (3). If two cities choose different transit tech at t=1900 but both end with cars in 2000, the fork lacked causal weight. Path dependence requires forks that "matter."

  ---

  ### **Secondary Requirements (Camp-Specific)**
  4. **Mechanism Granularity**  
     *Requirement:* States/forks must be defined at **institutionally meaningful resolutions** (e.g., "adopt diesel buses" vs. "keep streetcars"—not "Tuesday’s council vote").  
     *Case:* Your granularity trap. Fine-grained states make everything path dependent; coarse states miss forks. *Load-bearing only if abused*.

  5. **Empirical Testability in Single Cases**  
     *Requirement:* Must generate **falsifiable claims** from archival/process data (e.g., "if policy X failed at t, outcome Y would not persist").  
     *Case:* All your cases. Needed for historical work but often relaxed by modelers.

  6. **No Welfare Baseline**  
     *Requirement:* No reliance on Pareto efficiency or optimality to define lock-in.  
     *Case:* Economists’ default; your case (2) kills it.

  ---

  ### **Resolving Your Triangle**  
  *(a) Single-case usability, (b) counterfactual licensing, (c) no welfare baseline.*  
  **Possible if:** You anchor counterfactuals in **feasibility at t** (not optimality). For streetcars, show that buses *and* modern light rail were *both* feasible in 1950, but feedback loops (e.g., auto lobbying, zoning changes) locked out rail. Welfare is irrelevant. **Leg to cut:** None—but (b) requires rigorous process tracing to "earn" counterfactuals.

  **Granularity is the killer requirement:** Fail to define forks/states meaningfully → path dependence becomes trivial or empty. Streetcars vs. buses is a valid fork; "transport budget ±5%" is not.

  ---

  ### **Contender Evaluation**  
  | **Approach**                          | **Verdict** | **Key Failure**                               |  
  |---------------------------------------|-------------|-----------------------------------------------|  
  | **Economists (Increasing Returns)**   | ❌ Fail     | Requires inefficiency for lock-in → Fails case (2). Also struggles with single-case validation. |  
  | **Historical Sociology (Reactive Sequences)** | ⚠️ Partial  | Handles equifinality (3) and narratives, but often vague on counterfactuals (b). Can’t prove "Y would have stuck." |  
  | **Taxonomy of Mechanisms**            | ✅ Best Fit | Meets (1)/(2)/(3) by specifying feedback types. Granularity risk remains, but manageable. |  
  | **Skeptical Economists**              | ❌ Fail     | Denies most lock-in exists → Ignores power/inertia in cases (1)/(2). Misreads persistence as efficiency. |  

  **Why taxonomy wins:** It forces explicit mechanisms (e.g., "coordination effects prevented streetcar revival") without welfare claims. Your case (2) is path dependent if *even the best standard* persists via feedback loops—not inherent superiority.  

  **Your framing is fair:** Cases (1)-(3) stress-test *causal process* vs. outcome irreversibility. No camp is stacked against—but economists must sacrifice efficiency fetishism to survive.  

  **Commit:** Path dependence is **causal persistence via endogenous feedback from feasible forks**. If the fork didn’t exist, or feedback didn’t bind, it’s not lock-in. The rest is taxonomy.
