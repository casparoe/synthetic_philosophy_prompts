answer: |-
  Here’s the case for your position, argued straight through:

  Start with the timing problem: if harm requires a subject to experience worsened conditions, the dead can’t be harmed. A corpse isn’t made "worse off" by slander or sanctification. Yet our moral discomfort with fabrications about real people undeniably fades with time. We’re outraged by a film inventing a secret affair for a recently deceased public figure; we shrug at a novelist inventing romantic yearnings for a minor figure from the 1600s. This decay tracks *social distance* – how many living people retain a personal connection or direct memory of the subject. That gradient screams that the real injury isn’t to the departed, but to the living who hold them in memory, relationship, or esteem. The duty not to invent, therefore, runs to those living third parties: loved ones grieving, communities honoring, descendants inheriting an identity shaped by that person, and even audiences who engage with history expecting a baseline fidelity to the human record, not pure fabrication. They are the ones wronged when the figure they relate to is distorted. The fading intuition over time isn’t confusion; it’s evidence of the duty’s true beneficiaries fading from the scene.

  Now, why is inventing the *inner life* – motives, private thoughts, unspoken desires – the core transgression, worse than inventing an observable act? It boils down to witnessability. An invented *act* – say, depicting a historical figure attending a meeting they never did – is a falsifiable claim about the external, observable world. It’s the kind of thing the person *could* have been asked about, could have confirmed or denied, could have authorized or forbidden while alive. It falls within the realm of potential consent or correction. Inventing an inner state is categorically different. No one witnessed it. It wasn’t expressed. It exists beyond verification or falsification, even hypothetically. The person *couldn't* have consented to its depiction because it’s an assertion about a realm inherently inaccessible to others. This isn’t about reputational damage (an invented noble motive can be flattering but still feel deeply wrong) or mere falsifiability (many unfalsifiable claims about the past are trivial). It’s about violating the fundamental boundary of the self: the sanctity of the unexpressed interior. We intuitively grasp that presuming to know and display another’s private mind, especially when they cannot possibly contest it, is a unique form of trespass. It reduces the person to raw material for the creator’s narrative, erasing their inherent right to the opacity of their own consciousness. Witnessability matters because it marks the line between what was *potentially shareable* (and thus subject to consent) and what was *intrinsically private* (and thus inviolable).

  On to the objections. First, the worry that a duty owed vaguely to "the living" or "audiences" is suspiciously ad hoc. But it’s not vague or invented to save the phenomenon. We readily acknowledge duties to respect the memories held by the bereaved, the cultural heritage of communities, and the integrity of historical understanding for society. Think of desecrating a grave: the wrong isn’t primarily to the decomposed body, but to the living who revere that site and memory. Misrepresenting the dead through invented inner lives desecrates the *mental image* held by those who carry the person forward. It fractures their relationship with the past. The duty flows naturally to these stakeholders precisely because *they* experience the harm – the distress, the betrayal of trust in the narrative, the corrosion of their connection to the person or their sense of historical truth. It’s a duty grounded in the real, ongoing relationships the living have with the dead and the past, not a metaphysical duty to a nonexistent subject.

  Second, the hard case: inventing the inner life of someone utterly forgotten, with no descendants, no living acquaintances, no community stake – harming "literally no one." Here, your account *should* bite the bullet: **this fabrication is not a moral wrong.** If there are genuinely no living individuals or communities for whom this person holds relational significance, and no audience plausibly engaging with them as a figure within a shared, cared-for history, then the core reason for the duty vanishes. There’s no one *to* wrong. Our lingering unease in this hypothetical stems from conflating two things: 1) a general distaste for *dishonesty* or *manipulation of history*, and 2) the *specific* wrong of misrepresenting a person *to those who hold them in regard*. The first might be an epistemic or aesthetic flaw in the work, but it lacks the *relational* harm that defines the moral transgression against persons (living or through their memory-holders). The duty is contingent on existing connections. When those connections are truly extinct, the unique moral prohibition dissolves. The creator might be criticized for poor history or lazy fiction, but they haven’t wronged *anyone* by inventing the inner life of the utterly forgotten. The duty runs to specific beneficiaries; if none exist, the duty doesn’t apply.
