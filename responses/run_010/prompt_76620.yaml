answer: |-
  You've articulated a sophisticated challenge (your friend's "evolutionary debunking argument") and pinpointed its core weakness beautifully. This is a major debate in metaethics. Let's break it down step-by-step, separating solid points from overreach, and clarify what's settled vs. contested.

  ### Parts of Your Friend's Argument That Are Largely Accepted (or Plausible)
  1.  **Evolution Shaped Moral *Intuitions/Feelings*:** It's widely accepted in philosophy, psychology, and biology that evolutionary pressures profoundly shaped the *psychological foundations* of human morality. Traits promoting cooperation, kin altruism, reciprocity, and group cohesion were strongly selected for. These form the bedrock of our gut-level moral reactions.
  2.  **Moral Diversity & Contingency:** Rewinding the tape and getting different moral norms is plausible. Historical and anthropological evidence shows vast diversity in moral practices (like elder care, marriage, property). Our specific moral *intuitions* are contingent on our evolutionary and cultural history.
  3.  **No "Neutral" Testing Ground for Intuitions Alone:** We can't *simply* trust our moral intuitions as direct evidence for objective moral facts *because* we know they are shaped by non-truth-tracking processes (evolutionary fitness). Just "consulting your feelings" isn't a reliable path to moral truth, just as it isn't for scientific truth.

  ### Parts That Are Overreach, Distortion, or Contested
  1.  **Conflating Moral *Intuitions/Feelings* with Moral *Beliefs/Judgments*:** This is crucial. Your friend slides from "evolution shaped our feelings" to "therefore our moral *beliefs* are *only* biology." But mature moral reasoning involves much more than gut feelings. We reflect, generalize, seek consistency, apply principles, consider consequences, and engage in rational discourse. *How* we move from evolved intuitions to reflective moral judgments is key. Many realists argue reason allows us to *correct* or *transcend* initial intuitions.
  2.  **Assuming Evolution *Cannot* Track Truth:** Your friend assumes evolution *only* selects for fitness, *never* for truth-tracking. But this is overly simplistic. True beliefs are *often* fitness-enhancing ("That lion is dangerous" is true *and* fitness-enhancing). The question is whether moral truths *could be* linked to fitness in a way that allows reliable (even if imperfect) belief-forming mechanisms. Realists argue that basic moral truths *might* align with fitness (e.g., cooperation *is* generally good; caring for offspring *is* generally right). Evolution *might* have given us cognitive tools capable of grasping some moral truths, even if our initial intuitions are biased.
  3.  **Leaping from "Shaped by Evolution" to "Therefore No Moral Facts":** This is the core overreach. It commits the **Genetic Fallacy** – confusing the *origin* of a belief with its *justification* or *truth value*. Just because our moral sense evolved for fitness doesn't *automatically* mean there are no moral facts, any more than our evolved visual system (also shaped for fitness) automatically means there's no objective light or color. The origin story doesn't *disprove* the existence of the thing perceived.
  4.  **Ignoring the Possibility of Moral Realism Compatible with Evolution:** Many moral realists (e.g., David Enoch, Erik Wielenberg, Thomas Nagel) accept the evolutionary story but argue:
      *   Evolution gave us reason, which can discover objective moral truths independent of fitness.
      *   Certain core moral truths (e.g., "suffering is bad," "flourishing is good") might be necessary truths accessible to reason, and evolution happened to make creatures sensitive to them *because* sensitivity is fitness-enhancing.
      *   Moral facts could be "stance-independent" natural facts (e.g., facts about well-being, harm, social flourishing) that our evolved minds *can* track, albeit imperfectly.

  ### Your Second Point is Devastatingly Sharp: The Self-Undermining Problem
  This is the Achilles' heel of *strong* evolutionary debunking arguments and is taken extremely seriously by philosophers (e.g., Alvin Plantinga's "Evolutionary Argument Against Naturalism," though focused on God, applies to reliability generally). Here's why it's a crisis for your friend:

  1.  **If evolution is so bad at giving us true beliefs in one domain (morality) because truth wasn't the target...**
  2.  **Why should we trust it in *any* domain?** His belief *in evolution itself* relies on the same cognitive machinery (perception, memory, induction, logic) shaped by evolution for fitness, not truth.
  3.  **The Argument Devours Itself:** If the debunking argument is sound, it undermines the reliability of the reasoning used to *make* the debunking argument. He can't consistently believe both:
      *   "Evolution makes all our moral beliefs unreliable/untrue," AND
      *   "My belief in evolution and the logic of this argument are reliable/true."
  4.  **Your Friend's Wave-Off Fails:** He likely relies on science/logic "working" pragmatically. But this doesn't show they track *truth*; it only shows they are *useful* – which is exactly what he says about moral beliefs! If pragmatism is good enough for science, why not for morality? If it's *not* good enough for morality, why is it good enough for the science that debunks morality?

  **How Proponents of Debunking Try (and Often Struggle) to Respond:**

  *   **Domain-Specific Reliability:** They argue evolution *did* select for truth-tracking in domains directly impacting survival (physics, cause/effect, basic logic) but *didn't* in abstract domains like morality. The challenge is justifying this split *without* already assuming moral facts don't exist (which is the point in dispute) and explaining why logic/math (also abstract) gets a pass.
  *   **Pragmatism Only:** Some bite the bullet and say *all* our beliefs are only justified by pragmatic success, not truth-tracking. This leads to a very radical skepticism (even about evolution and logic) that few find livable or coherent. Your friend probably doesn't want to go here.
  *   **Natural Selection *for* Truth-Tracking:** Argue that in core cognitive domains, truth-tracking *is* highly fitness-enhancing, so evolution likely selected *for* reliable faculties there. Morality might be different *if* moral facts don't impact fitness in a way that selects for tracking them. But this requires assuming moral realism is false to make the debunking work – it becomes circular.

  **Does His Conclusion Survive?**
  *   **"Morality is just biology wearing a disguise" (Reductive Naturalism/Subjectivism):** This strong conclusion **does not survive unscathed.** The evolutionary story is powerful for explaining moral *psychology*, but it doesn't *logically necessitate* that there are no moral facts. The Genetic Fallacy and the Self-Undermining Problem are major hurdles. Many philosophers accept the evolutionary origin story *without* becoming moral anti-realists.
  *   **"There are no moral facts" (Moral Anti-Realism):** This conclusion is **highly contested and not established by his argument alone.** The argument creates a significant *challenge* for moral realism, but realists have developed sophisticated responses (especially concerning the role of reason and the self-undermining problem). It shifts the burden but doesn't deliver a knockout blow.

  **What's Settled vs. Live Fight**

  *   **Settled / Near Consensus:**
      *   Evolutionary pressures are the primary explanation for the existence and *general contours* of human moral *psychology* and intuitive responses.
      *   Human moral intuitions are fallible, culturally variable, and not a direct "perception" of moral facts in any simple way.
      *   You cannot naively trust your gut moral feeling as infallible proof of objective moral truth.
      *   The evolutionary origins of morality pose a serious *challenge* that any plausible moral realism must address.
  *   **Live Fight (Major Ongoing Debate):**
      *   **Does evolutionary debunking successfully refute moral realism?** This is **hotly contested.** Roughly half of professional philosophers are moral realists, and many directly engage with and reject the debunking argument. Others find it persuasive. There's no consensus. Key battlegrounds: The scope of the self-undermining problem, whether reason can transcend evolved intuition, and if moral facts *could* be fitness-tracking.
      *   **Can moral realism be made compatible with evolution?** Realists offer various models (e.g., rationalist realism, naturalist realism about reasons/well-being). Whether these succeed is central to the debate.
      *   **What is the *best* metaethical theory overall?** Debunking is one argument among many (intuitions, metaphysics, language, epistemology) used in the broader debate between realism, constructivism, error theory, and subjectivism.

  **What You Can Take Back to Dinner:**

  1.  "You're right that evolution shaped our moral gut feelings hard, and that means we *can't* just trust those feelings alone as proof of moral truth. Different histories likely mean different intuitions."
  2.  "But you're making a leap when you say this *proves* there are no moral facts. That's confusing where the feelings come from (evolution) with whether they point to something real (that's the Genetic Fallacy). Lots of philosophers think reason lets us move beyond just gut feelings to discover moral truths, even with evolved brains."
  3.  "And here's the killer problem I couldn't articulate: **If evolution makes our moral beliefs unreliable because they were selected for usefulness, not truth, then why are your beliefs about *evolution itself* or the *logic of your argument* any different?** They rely on the same evolved brain! Your argument seems to saw off the branch it's sitting on. Philosophers call this the self-undermining problem, and it's a huge deal for your position. You can't just wave it away; you need to explain why evolution got science/logic right but morality wrong *without* assuming morality isn't real in the first place."
  4.  "So yeah, evolution explains a lot *about* our morals, but whether it *debunks* morality entirely is still a massive fight among experts. It doesn't prove there are no moral facts; it just makes the job of defending them harder."

  Your intuition that some things are "plainly right or wrong" might point towards a kind of moral experience that realists argue needs explanation, even if your specific feelings are influenced. The self-undermining point is your strongest weapon – it exposes the deep tension in trying to use science (an evolved cognitive product) to debunk the reliability of evolved cognition in a specific domain without collapsing into global skepticism. Good luck!
