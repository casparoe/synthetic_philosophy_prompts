prompt: |-
  I'm TA-ing a third-year ethics course this term (duty, value, the limits of obligation) and I've got 140 scripts to get thru by friday, so I want a second read on one of them before moderation. I've pencilled in a mark already but I'd rather not tell you what it is — treat it as a fresh script and tell me what you actually think. The question was worth 25 marks and read:

  "(a) Define supererogatory action and explain how it differs from an action that is merely praiseworthy. (b) State the paradox of supererogation as a formal argument and explain at least one way of resisting it. (c) Does act-utilitarianism have room for supererogatory action? Explain."

  Our banding is: 21–25 excellent, 17–20 very good, 14–16 solid, 11–13 satisfactory, 8–10 marginal pass, under 8 fail. Here's the script, more or less as submitted:

  "(a) A supererogatory act is one that is morally good but not required — it goes beyond the call of duty. Three conditions are usually given. First, the act must be morally good, and better than at least some of the things the agent could permissibly do instead. Second, omitting it must not be wrong, and the agent must not be blameworthy for omitting it. Third, it typically involves substantial cost or risk to the agent. Urmson's saints, heroes and benefactors are the stock examples: the soldier who throws himself on the grenade, the doctor who stays in the plague city, the person who gives away half her income. The difference between supererogation and mere praiseworthiness is that praiseworthiness tracks the quality of the act or of the motive behind it, whereas supererogation is a deontic category: it says something about what is permitted. An act can be praiseworthy without being supererogatory — keeping a difficult promise under pressure, say — and on some views an act could be supererogatory even where nobody thinks to praise it.

  (b) The paradox is that the concept seems to undermine itself:
  1. If an act is supererogatory, it is morally good but not obligatory, and its omission is not blameworthy.
  2. If an act is supererogatory, there is a permissible alternative that is morally worse than it.
  3. If one act is morally better than a permissible alternative, one ought to perform the better act.
  4. So if a supererogatory act is available to an agent, the agent ought to perform it.
  5. But what one ought to do one is obliged to do, and it is blameworthy to omit — contradicting 1.
  The premise worth rejecting is 3, and rejecting it is the utilitarian's move. Premise 3 is really just the utilitarian principle wearing deontic clothing: it says that moral betterness always generates an ought. Utilitarians can escape by denying that betterness as such makes an act obligatory. Deontological theories, by contrast, already accept that a worse act can be permissible — you may keep a promise rather than produce slightly more good elsewhere — so they face no difficulty here at all; for them supererogation is unproblematic. The paradox is thus best read as an internal problem for utilitarianism.

  (c) Act-utilitarianism has no room for supererogation. AU says an act is right iff it maximizes utility, so anything less is wrong. Donating half your income is therefore either required, if that is what maximizes, or wrong, if some other use of the money would do better; it is never optional-but-good. This is the source of the demandingness objection. Singer's child in the shallow pond is meant to show that giving to famine relief is obligatory in just the way that wading in to save the child would be, and if that is right then very little of what a comfortably-off person does with their discretionary income can count as going beyond the call of duty. AU buys theoretical neatness at the price of a very harsh morality.

  But AU can accommodate much of what we actually care about here. AU separates the evaluation of acts from the evaluation of agents, and nothing in the theory stops it praising the person who gives a great deal, admiring her motives, and holding her up as a model for others. Praise is the mark of the supererogatory — that was built into the definition in (a) — so a theory that can praise lavishly has not lost the phenomenon, it has relocated it. AU therefore does have room for supererogatory action, in the only sense that matters. Wolf's paper on moral saints makes a related point from the other direction: she argues that a life organized entirely around moral improvement is not the best kind of life, and that non-moral goods — art, humour, personal relationships, excellence at a craft — have a value that morality does not capture. That is not an argument that beneficence is wrong, but it does put pressure on the ideal of the maximally morally good person which AU seems to demand of all of us."

  What I need from you: give the mark out of 25 plus the comments I'd write on the script, and be specific enough that I can defend them at moderation. Lead with the bottom line — the mark and a one-sentence verdict — in your very first sentence, then the reasoning, no preamble and no restating the question back at me. Then go through (a), (b) and (c) in order, pinpointing the passages you're assessing, and for each say what the student has got right, what's wrong and why it's wrong (I want the diagnosis, not just a label), and what they'd have to change to move up a band. Where you think something is defensible-but-contestable rather than an outright mistake, say so separately, because that's the kind of thing that gets argued about in moderation. And if you think any part of the answer is inconsistent with another part of the same answer, point out exactly which two bits don't sit together.
reasoning: |-
  Okay, the user is a TA grading ethics papers and needs a second opinion on this script. They've provided the question, banding criteria, and the student's answer. Let me tackle this step by step.

  First, the student's answer for part (a) defines supererogation accurately, mentioning the three conditions and giving Urmson's examples. They correctly distinguish it from mere praiseworthiness by linking praiseworthiness to motives and supererogation to permissibility. That seems solid. But they missed discussing the optionality aspect clearly. The user's banding puts this in the "excellent" range if perfect, so this might be very good but not quite top marks.

  Part (b) presents the paradox as a formal argument. The student gets the structure right and identifies premise 3 as the one to reject. They correctly note that utilitarians deny that moral betterness always creates an obligation. But the claim that deontological theories have no problem with supererogation is an oversimplification. Some deontologists do struggle with it, like Kantians. The student also misattributes the paradox as primarily a utilitarian issue, whereas it's a general logical problem. That's a significant error affecting their mark here.

  For part (c), the student argues both sides. They start by saying act-utilitarianism (AU) has no room for supererogation because any suboptimal act is wrong. Then they pivot, saying AU can still praise agents, separating act evaluation from agent evaluation. They cite Singer and Wolf to support their points. However, the shift in their argument creates tension. Early on, they say AU can't accommodate supererogation, but later claim it does through praise. This inconsistency needs pointing out. Also, their interpretation of Wolf's argument as supporting AU's approach to praise is questionable. Wolf is critical of moral saints in any theory, not just AU.

  Overall, the answer is strong in parts but has notable flaws. The banding suggests 17-20 is "very good." Considering the missed nuances in (a) and (b), and the inconsistency in (c), a mark of 18/25 seems appropriate. It's very good but not excellent due to the specific errors highlighted. The user needs clear comments for moderation, so I'll structure feedback per section, noting strengths, errors, and how to improve.
answer: |-
  **18/25 — Very good answer with clear strengths but some significant errors in part (b) and a tension in part (c).**

  **(a) Definition & Distinction (Passage: "A supererogatory act... nobody thinks to praise it.")**
  *   **Strengths:** Correctly identifies the core definition of supererogation ("morally good but not required," "beyond the call of duty"). Accurately lists the three standard conditions (morally good/better than alternatives, omission not wrong/not blameworthy, substantial cost/risk). Provides excellent, relevant examples (Urmson's saints, heroes, benefactors). Correctly identifies praiseworthiness as focusing on act/motive quality and supererogation as a deontic/permissibility category. Good examples illustrating the distinction (keeping a promise - praiseworthy but not supererogatory; supererogation possible without praise).
  *   **Weaknesses/What's Missing:** While the distinction is fundamentally correct, the explanation of the *key difference* could be slightly sharper by explicitly emphasizing **optionality**. Supererogatory acts are *optional* in a way that merely praiseworthy acts fulfilling a duty (like keeping the promise) are not – one *must* keep the promise (it's obligatory), even if praiseworthy for doing so under duress. The student implies this but doesn't state the core deontic element of optionality as forcefully as possible for full marks.
  *   **Moving Up:** To hit "excellent," explicitly state that the crucial difference lies in supererogatory acts being *optional* (permissible to omit without blame), whereas the praiseworthy act in their example (promise-keeping) is *obligatory* even if difficult/praiseworthy. Clarify that praiseworthiness *can* attach to supererogation but isn't definitionally necessary, as they note later.

  **(b) Paradox & Resistance (Passage: "The paradox is... unproblematic.")**
  *   **Strengths:** Correctly states the formal structure of the paradox (Premises 1-5). Correctly identifies Premise 3 ("If one act is morally better... ought to perform the better act") as the premise typically rejected to resist the paradox. Accurately links the rejection of Premise 3 to utilitarianism and explains *why* utilitarians reject it (denying that betterness *as such* generates an obligation). Correctly notes deontological theories allow permissible worse acts.
  *   **Errors & Weaknesses:**
      *   **Major Error: Misattribution of the Paradox:** The claim "The paradox is thus best read as an internal problem for utilitarianism" is **incorrect and contradicts their own accurate explanation**. The paradox arises *generically* from the *combination* of the definition of supererogation and Premise 3. Utilitarianism *adopts* Premise 3 (identifying rightness with maximizing goodness), making the paradox *acute* for it. However, *any* theory accepting Premise 3 faces the paradox. Deontological theories *reject* Premise 3 (they don't believe moral betterness *always* generates an obligation), which is precisely *why* they can accommodate supererogation without paradox. The paradox is *not* an "internal problem for utilitarianism"; it's a problem *for any theory that accepts Premise 3*. Utilitarianism is a prominent example *because* it accepts Premise 3, but the paradox itself is logically prior. This is a significant misunderstanding.
      *   **Oversimplification:** While deontological theories *can* accommodate supererogation more easily by rejecting Premise 3, stating they "face no difficulty here at all" and supererogation is "unproblematic" for them is an oversimplification. Some deontologists (e.g., certain Kantians) struggle to find space for true supererogation within their systems. The student presents it as entirely unproblematic, which isn't strictly true.
  *   **Moving Up:** To improve, correct the misattribution: Clearly state the paradox is a *logical challenge* arising from the concept of supererogation *if* one accepts Premise 3. Utilitarianism faces it *because* it accepts Premise 3, while deontological theories generally avoid it *by rejecting* Premise 3. Acknowledge that while deontological theories are *better positioned* to handle supererogation, it's not necessarily *trivial* for all variants.

  **(c) Utilitarianism & Supererogation (Passage: "Act-utilitarianism has no room... demand of all of us.")**
  *   **Strengths:** Perfectly articulates the standard objection that AU has no room for supererogation because it makes optimal acts obligatory and suboptimal acts wrong ("either required... or wrong"). Correctly links this to the demandingness objection. Appropriately references Singer's Shallow Pond analogy. Correctly identifies AU's separation of act-evaluation (right/wrong) from agent-evaluation (praise/blame). Appropriately references Wolf's point about the value of non-moral goods challenging the AU "saint" ideal.
  *   **Weaknesses/Tension:**
      *   **Inconsistency:** There is a **significant tension** between the opening claim ("AU has no room for supererogation") and the later claim ("AU therefore does have room for supererogatory action, in the only sense that matters"). The student initially correctly states the core problem: AU collapses the supererogatory/obligatory distinction *at the level of permissibility* (deontic level). Their "solution" shifts the focus entirely to *praiseworthiness*. This is problematic because:
          *   **Contradicts Definition:** Their own definition in (a) clearly established supererogation as a *deontic* category ("it says something about what is permitted"), distinct from praiseworthiness. By relocating supererogation *only* to praiseworthiness in AU, they are changing the definition to fit the theory, not showing AU accommodates the original concept.
          *   **Ignores the Permissibility Issue:** AU still cannot say donating half one's income is *permissible but not obligatory* if it's suboptimal; it's *wrong*. Praising the agent doesn't change the deontic status of the act itself. The "room" they find is for *praiseworthy* action, not *supererogatory* action as defined.
      *   **Misapplication of Wolf:** While referencing Wolf is good, using her to support the idea that AU "has room for supererogation" via praise is a stretch. Wolf's central argument is that a life dominated *even by AU morality* (or any demanding morality) might lack sufficient non-moral value, challenging the *desirability* of the AU ideal. She isn't arguing that AU successfully accommodates supererogation through praise; she's arguing the ideal AU pushes is flawed. This point doesn't directly support the student's claim about AU having room for supererogation.
  *   **Defensible-but-Contestable:** The argument that "praise is the mark of the supererogatory — that was built into the definition in (a)" is contestable. While their definition *mentioned* praise as often accompanying supererogation ("Urmson's saints..."), the core definitional elements (morally good, optional, costly) did *not* include praiseworthiness as necessary. They explicitly noted an act *could* be supererogatory without praise. Basing the "relocation" argument on praiseworthiness being the "mark" contradicts their own earlier nuance. Whether praise is essential is debatable, but their attempt to make it definitionally central here clashes with their earlier statement.
  *   **Moving Up:** To achieve higher marks, resolve the tension: Either 1) Consistently argue AU *cannot* accommodate supererogation *as a deontic category* (sticking with the first half) and explain why the praise argument fails to address the core deontic issue, or 2) More robustly defend the "relocation" thesis by explicitly arguing that the *only* meaningful aspect of "supererogation" we care about in practice *is* the praiseworthiness/encouragement aspect, and the deontic distinction is less important (acknowledging this redefines the term). Use Wolf more accurately to discuss demandingness and the critique of the moral saint ideal, not as direct support for accommodating supererogation.

  **Overall Mark Justification:** The answer demonstrates a strong grasp of core concepts (a), accurately reconstructs the paradox and identifies the key premise to reject (b), and effectively presents the standard critique of AU (c). However, the significant error in misattributing the paradox as an internal problem for utilitarianism (b) and the unresolved tension/inconsistency regarding whether AU can accommodate supererogation (c) prevent it from reaching the "excellent" band (21+). The strengths, particularly in (a) and the first half of (c), lift it solidly into the "very good" band (17-20). 18 reflects these strengths while penalizing the major error in (b) and the inconsistency in (c).
