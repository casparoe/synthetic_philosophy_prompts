  Okay, let me start by unpacking this user's query. They’re leading a philosophy of life sciences group studying clinical oncology practices. The core of their paper is about the implicit assumptions of evolutionary individuality in oncology. They’ve outlined three routine practices: clonal/subclonal classification based on allele fractions, treating the tumor as a single entity with fitness properties, and recognizing multiple selection processes (treatment, hereditary, immune). They also mention the conflict between eradication vs. adaptive dosing strategies.

  First, I need to reconstruct the implicit theory behind these practices. The user wants to avoid a literature survey, so I must focus on what’s done and what must be assumed. Let’s break down each register. 

  For the first register (clonal classification), the key is understanding what’s being selected. The practice assumes cell lineages as units of selection. Variants are labeled clonal or subclonal based on allele fractions, which implies a threshold for lineage membership. This presupposes that cells reproduce with heritable variation, even in an unstable genome. The numerical cutoff is pragmatic but philosophically tricky—why choose 80% instead of 70%? It’s not inherent in the tree model but necessary for actionable reports. This rules out strict genic selectionism because clones, not alleles, are the units here. However, it’s neutral on whether tumors are Darwinian individuals or populations. The underdetermination lies in whether lineages are real or heuristic constructs.

  Next, the second register treats the tumor as a single entity with fitness. This assumes the tumor as a whole has properties like aggressiveness. Fitness here is implicitly defined by progression rates, measured against other tumors. But this contradicts the first register where subclones compete. The tension is between population thinking and individual attribution. The practice might be a pragmatic aggregation but becomes inconsistent when both views are used simultaneously for the same patient.

  The third register involves hereditary selection and immune selection. Hereditary selection operates at the organism level (patient fitness), while immune selection targets cell lineages. This multi-level selection isn’t integrated, leading to potential inconsistencies. For example, the same term "selection" applies to different units without clarification.

  The user’s deeper need is to identify contradictions in clinical practices and how changing assumptions would affect oncology. They also want criteria for when shifting descriptive levels is valid versus a fudge. The doctoral argument likely centers on whether these registers can coexist without contradiction. 

  Considering the rival views: If only the patient is the Darwinian individual, then clonal labels become descriptive tools, not real units. Reports would avoid terms like "subclone fitness," and adaptive dosing’s rationale shifts to patient benefit rather than ecological management. If nothing is an individual, all such terminology disappears, focusing purely on molecular mechanisms without evolutionary narratives. Adaptive dosing would need a different justification, perhaps based on delaying resistance without invoking competition.

  The user might be seeking a framework to critique clinical oncology’s implicit philosophy, aiming to expose unnoticed contradictions. Their frustration with "different levels" as a fudge suggests they want rigor in level selection. Applying a criterion like causal entanglement vs. decoupling could help: when processes at different levels don’t interact strongly, separate descriptions are valid; when they do, it’s a fudge. In tumors, clonal competition directly impacts tumor-level fitness, so using both registers without integration is problematic.

  I should structure the response by addressing each register’s presuppositions, inconsistencies, and implications of rival assumptions. Highlighting where practices are underdetermined and providing concrete changes based on alternative assumptions will meet the user’s needs. The doctoral disagreement likely revolves around whether the registers are reconcilable. The answer might be that they’re not, due to conflicting units of selection in the same context.
answer: |-
  Your observations reveal a rich, implicit ontology of evolutionary individuality in clinical oncology, rife with philosophical tensions. Below is a reconstruction of its presuppositions, inconsistencies, and alternatives—grounded in practice, not theory.

  ### **1. Presuppositions of Clonal/Subclonal Classification**  
  **Unit of Selection & Reproduction:**  
  - **Lineages as Darwinian individuals:** Clones are treated as *reproducing units with heritable variation*. A "lineage" is defined by *descent with modification*: cells sharing a recent common ancestor and trajectory of somatic evolution.  
  - **Heritability in genomic instability:** Despite karyotype drift and epigenetic plasticity, variants are assumed heritable if they (a) persist through cell divisions and (b) correlate with phenotypic stability (e.g., driver mutations). Epigenetic changes are sidelined unless they co-occur with genetic variants or show clonal stability.  
  - **Threshold function:** The allele fraction cutoff (e.g., 80% for "clonal") pragmatically distinguishes *established lineages* from transient subpopulations. It answers: *Which variants are entrenched enough to define a lineage's identity?* This threshold is not natural but *operational*, filtering noise for actionable phylogenies.  

  **Rival Views Ruled Out/In:**  
  - **Rules out strict genic selectionism:** If alleles were the sole units, "clones" would be arbitrary aggregates. But practice treats clones as *agents* of resistance/expansion.  
  - **Neutral toward "degrees of individuality":** The threshold accommodates tumors as "weak individuals" (poor reproduction fidelity, no germline).  
  - **Rules in "scales of description":** Lineages are real *for the purpose of explaining treatment response*, not necessarily ontological primitives.  
  - **Underdetermination:** The same tree could reflect either (a) discrete clonal entities or (b) fluid, dynamic heterogeneity where "clones" are ephemeral peaks in a fitness landscape. The threshold masks this ambiguity.  

  ---

  ### **2. Inconsistencies Across Registers**  
  The four registers (clonal lineages, tumor fitness, hereditary/immune selection, therapeutic metaphor) are **incompatible without qualification**:  
  - **Tumor-as-individual vs. tumor-as-community:** Attributing "fitness" to the whole tumor (e.g., "aggressive") contradicts the clonal view, where fitness is *distributed* among subpopulations. A tumor's "progression" may reflect a subclone's expansion, not collective fitness.  
  - **Selection at cross-purposes:** Immune selection (neoantigen burden) targets *cell lineages*, while hereditary selection acts on *patient organisms*. Clinical language flattens these distinct units.  
  - **Therapeutic double bind:** Eradication logic assumes a unitary enemy; adaptive dosing assumes a competitive ecosystem. These imply opposing ontologies *for the same tumor*.  

  **Criterion for Legitimacy:** Shifting descriptions are legitimate **only if causal processes at different scales are decoupled**. Here, they are entangled:  
  - *Illegitimate fudge*: Calling a tumor "indolent" while ignoring clonal competition driving its behavior.  
  - *Legitimate shift*: Hereditary cancer genetics (patient-level fitness) vs. subclonal resistance (lineage-level fitness) operate at separable scales.  

  **Pathology vs. Protocol Conflict:**  
  - Pathology reports describe a *population of lineages* (competing units), while trial protocols measure "tumor fitness" via progression-free survival (treating it as a *unitary object*). This is inconsistent because progression is often caused by a minor subclone's growth—undermining the idea of whole-tumor fitness.  

  **Patient vs. Cell Interests:**  
  - Ethical arguments (patient welfare) are orthogonal to biological descriptions (cell fitness). No inconsistency unless conflating scales (e.g., assuming patient benefit aligns perfectly with clonal dynamics).  

  ---

  ### **3. Rebuilding Practice: Two Radical Alternatives**  
  **Assumption 1: Only the Patient is a Darwinian Individual**  
  - **Vocabulary changes:**  
    - Replace "clonal fitness" with "variant prevalence linked to proliferation."  
    - "Resistant subclone expands" → "Variant V1 increases frequency under selective pressure."  
  - **Trial endpoints:** Progression/relapse defined *only* by patient-level outcomes (symptoms, mortality)—not radiologic "tumor growth" if asymptomatic.  
  - **Subclonal fractions:** Reportable only as *biomarkers* (e.g., "variant V1 at 12% associates with resistance in cohort studies"), not as evolutionary agents.  
  - **Adaptive dosing rationale:** Shifts from "managing clonal competition" to "delaying resistance emergence" via pharmacodynamic models. Ecological logic is abandoned.  

  **Assumption 2: No Darwinian Individuals in the Room**  
  - **Vocabulary changes:**  
    - Ban "lineage," "fitness," "selection." Use mechanistic descriptions: "variant V1 frequency rises post-therapy due to reduced cell death in context of p53 loss."  
    - "Tumor aggression" → "proliferation rate correlated with metastasis in historical data."  
  - **Relapse definition:** Strictly biochemical/clinical—no reference to "resistance evolution."  
  - **Subclonal fractions:** Unreportable as "subclones"; only report variants with clinical validity.  
  - **Adaptive dosing:** Loses its core rationale. Justification becomes purely empirical ("this dosing schedule extends survival in trial X") without evolutionary mechanism.  

  ---

  ### **Conclusion: The Unresolved Tension**  
  Oncology’s implicit theory treats tumors as **provisional Darwinian individuals**—lineages during phylogeny, organisms during prognosis, ecosystems during therapy. This is neither consistent nor entirely fudged: it is a *pragmatic pluralism* that works because clinicians intuitively shift frameworks. Yet the cracks show when:  
  - Adaptive dosing (ecological management) clashes with MTD (eradication of a unitary foe).  
  - "Tumor fitness" metrics ignore clonal heterogeneity.  
  Your critique exposes a field negotiating individuality *without an ontology*. The way forward isn’t theoretical purity but explicit *contextualism*: "In this report, ‘clone’ denotes a cell population defined by shared variants above 80% frequency; in this trial, ‘fitness’ denotes growth rate extrapolated from volume doubling time." Clarity, not consistency, may be the pragmatic remedy.
