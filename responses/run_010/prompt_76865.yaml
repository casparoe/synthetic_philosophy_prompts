prompt: |-
  I run a small research team at a company that makes a workplace analytics app — the kind that sits on your phone and pops up a few times a day asking how you're doing. Sales has been promising customers "insight into how your people actually feel," and now product wants to add items about *why* people feel that way, so we can sell HR a causal story instead of just a mood graph. A friend of mine who does UX research elsewhere said every team eventually gets burned by this and I'd like to get burned on purpose, in a controlled way, so: before I sign off on the question set I want a triage procedure my team can run on any proposed self-report question. Literally a list of checks in order with pass/fail conditions, that tells us how much evidential weight an answer can carry and which questions we should refuse to field at all.

  Context for what you're working with. The app also passively collects calendar data, typing cadence and app-switching, so for a lot of items we could compare what people say against a behavioral trace — I want the procedure to say what a mismatch between the two means, because I don't buy the easy answer that the trace is ground truth and the report is the error. Sometimes the report is the thing we're actually trying to measure and the trace is a terrible proxy for it, and sometimes a person's self-ascription partly makes the state the state it is, so there's no independent fact for the trace to contradict. I also want it to seperate, as sharply as it can, the question forms that plausibly have real introspective access behind them (I'm thinking in-the-moment, about a vivid occurent experience, asked while it's happening) from the ones that are basically reconstruction after the fact (retrospective, dispositional, "how often in the last month," and above all "why did you do X"). Where the underlying philosophy is genuinely contested — I know there's a live fight about whether introspection is a detection faculty at all or a kind of self-interpretation that routinely confabulates — the procedure should state which side it's assuming, and say what breaks if the other side is right. No citations or reading lists, I have no way to check them and they aren't the deliverable. The deliverable is something a junior researcher can execute in fifteen minutes per question with a spreadsheet and a rubric.

  Then run it on four items we're arguing about right now: (1) "Right now, how absorbed are you in what you're doing?" fired at a random moment in the workday; (2) "Over the past two weeks, how often did you feel anxious at work?"; (3) "When you skipped the team retro on Thursday, what was the main reason?" asked the following Monday; and (4) the one our CEO is pushing hardest, "Do you feel more respected by your manager since we launched the new feedback policy?", benchmarked against a control of users at companies that launched nothing. I want concrete verdicts: field as-is, field with a specific rewrite (give me the rewrite), or refuse — plus what we tell the customer instead. At least one of the four should come out badly for us and I'd rather it be the CEO's. And please mark clearly where the procedure runs out and somebody has to make a judgment call, including the one I actually care about most: when someone says they felt X and nothing we can measure contradicts them, at what point does deferring to their report stop being respect for the subject and start being an abdication of the research?
reasoning: |-
  Okay, the user runs a research team for a workplace analytics app that collects both self-reported mood data and passive behavioral data. They want a triage procedure to evaluate proposed self-report questions, specifically to determine how much evidential weight the answers can carry and which questions shouldn't be used at all. The key challenges are dealing with mismatches between self-reports and behavioral traces, differentiating between genuine introspective access and reconstructive questions, and addressing philosophical debates about introspection.

  First, I need to design a structured checklist that's practical for junior researchers to use in about 15 minutes per question. The procedure should have clear pass/fail criteria and flow logically from quick disqualifiers to deeper analysis. 

  The user mentioned several important distinctions: current vs. retrospective experiences, vivid occurent states vs. reconstructed memories, and cases where self-reports might actually construct reality rather than detect it. I should incorporate these into the evaluation steps. For the behavioral trace comparison, it's crucial to avoid assuming the trace is always "ground truth" - sometimes self-reports are the target metric.

  I'll structure the procedure in three phases: 
  1) Quick disqualifiers for questions that are fundamentally flawed (leading, ambiguous, etc.)
  2) Deeper analysis of introspective access and validity threats
  3) Behavioral trace assessment with clear guidance on interpreting mismatches

  For the introspective access part, I'll need to take a stance since the user acknowledged the philosophical debate. I'll position introspection as reasonably reliable for current, simple states but highly unreliable for causal attributions or retrospective reports. The procedure should flag where this assumption is critical.

  Now for the four test cases:
  - Question 1 (current absorption) seems strong - it's immediate and about a vivid state
  - Question 2 (two-week anxiety recall) is problematic due to memory decay and recency bias
  - Question 3 (reason for skipping meeting) is high-risk due to attribution errors
  - The CEO's question (respect after policy change) has multiple red flags: leading wording, attribution errors, and likely response bias

  The CEO's question will be the one that fails badly as requested. I'll suggest concrete alternatives where possible and specify when to refuse entirely. For the refusal cases, I'll include alternative approaches to suggest to customers.

  Finally, I need to address the user's core philosophical question about when to defer to self-reports versus question them. I'll provide clear decision points in the procedure and frame it as: when there's no behavioral trace conflict, we default to self-report unless there's evidence of response bias or the question fundamentally exceeds introspective capabilities.
answer: |-
  Here’s a triage procedure for self-report questions, designed for rapid execution. It assumes **introspection is detection for *current, vivid states*** but **confabulatory for *causes, dispositions, and retrospectives***. If this is wrong, questions about past states/causes lose all validity.

  ---

  ### **Triage Procedure: 15-Minute Question Evaluation**
  *(Execute in order—fail at any step stops the process)*

  1. **Leading/Wording Bias Check**  
     - *Check:* Does the question imply a "correct" answer? (e.g., "Do you feel more respected?")  
     - *Fail:* Leading language, value-laden terms, asymmetric options.  
     - *Verdict:* **REFUSE** or rewrite to neutral framing.

  2. **Introspective Access Tier**  
     - *Tier 1 (Pass):* Current, vivid state, ≤5 min old. (e.g., "Right now, how absorbed are you?")  
     - *Tier 2 (Caution):* Retrospective summary (e.g., "past 2 weeks"), dispositional ("usually"), or vague state ("motivated").  
     - *Tier 3 (Fail):* Causal attribution ("why?"), complex self-diagnosis.  
     - *Verdict:* Tier 1: proceed. Tier 2: flag low validity. Tier 3: **REFUSE**.

  3. **Trace Data Mismatch Protocol**  
     *If passive trace data exists (e.g., calendar, activity):*  
     - *Check:* Does self-report conflict with trace? (e.g., "I’m absorbed" + low keyboard activity)  
     - *Interpretation:*  
       - Tier 1 questions: **Trace is likely proxy error** (e.g., absorption ≠ typing).  
       - Tier 2/3: **Self-report likely invalid** (memory/attribution error).  
     - *Verdict:* Mismatch in Tier 1? Use trace as context, not ground truth. Tier 2/3 mismatch? **Discount self-report**.

  4. **Actionability Threshold**  
     - *Check:* Could answers plausibly inform a *specific* intervention?  
     - *Fail:* Vague insights (e.g., "people feel anxious") without levers.  
     - *Verdict:* Fail = **REFUSE** unless rewritten to target concrete actions.

  ---

  ### **Application to Your Four Questions**
  **Question 1: "Right now, how absorbed are you?"**  
  - *Triage:* Tier 1 (current/vivid). Wording neutral. Mismatch with typing? → Trace error (absorption ≠ typing).  
  - *Verdict:* **FIELD AS-IS**. *Tell customers:* "Measures *subjective* flow state; behavioral data adds context but isn’t equivalent."

  **Question 2: "Over the past two weeks, how often did you feel anxious?"**  
  - *Triage:* Tier 2 (retrospective summary). Recency bias likely. Mismatch with calendar stress? → Self-report error (memory flawed).  
  - *Verdict:* **FIELD WITH REWRITE**.  
    - *Rewrite:* "Right now, how anxious do you feel?" (Tier 1) OR "Since this morning, how often felt anxious?" (minimizes recall).  
    - *Fallback:* Refuse if rewrite rejected. *Tell customers:* "Retrospective anxiety reports are unreliable; real-time data is more accurate."

  **Question 3: "When you skipped the team retro, what was the main reason?"**  
  - *Triage:* Tier 3 (causal attribution). Confabulation guaranteed. Trace data (e.g., calendar conflict)? → Self-report invalid if mismatch.  
  - *Verdict:* **REFUSE**. *Tell customers:* "People can’t accurately report reasons for past actions. Use trace data (e.g., scheduling conflicts) + anonymous feedback channels instead."

  **Question 4 (CEO): "Do you feel more respected by your manager since the new feedback policy?"**  
  - *Triage:*  
    - Step 1: **Leading bias** ("more respected" implies increase).  
    - Step 2: **Tier 3** (retrospective causal attribution).  
    - Step 4: **Unactionable** (doesn’t explain *why*).  
  - *Verdict:* **REFUSE**.  
    - *Rewrite to salvage:* "Right now, how respected do you feel by your manager?" (Tier 1, but loses policy link).  
    - *Tell customers/CEO:* "This question confuses policy impact with general feelings. We can measure real-time respect perceptions, but *attributing change to policy* requires controlled experiments."  

  ---

  ### **The Judgment Call: When to Trust Self-Reports**
  **Defer to self-report when:**  
  - It’s Tier 1 (current/vivid), AND  
  - No evidence of response bias (e.g., social desirability), AND  
  - The state is *defined by subjectivity* (e.g., emotions, absorption).  

  **Abdication of research occurs when:**  
  - You accept Tier 2/3 self-reports as factual without cross-validation (trace data, experiments), OR  
  - You ignore *consistent* trace-revealed patterns contradicting self-reports (e.g., "I’m focused" + constant app-switching 80% of the time).  

  **For Tier 1 states:** The self-report *is* the reality (e.g., "I feel anxious" = anxiety exists). Trace data can only correlate or contextualize.  
  **For Tier 2/3:** Self-reports are hypotheses, not evidence. Demand trace/experimental backup or refuse the question.

  --- 
  This procedure forces tough choices but prevents magical thinking about introspection. The CEO’s question fails at 3/4 steps—use it to advocate for method rigor.
