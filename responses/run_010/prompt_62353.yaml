  We are creating a sorting quiz to distinguish between different views that people might call "antinatalism". The quiz will consist of concrete scenarios with answer options. We want to avoid abstract philosophical jargon and focus on cases.

   The leaves (positions) we want to include:
   1. Benatar-style asymmetry (Asymmetry): 
      - Pain's absence is good even if no one exists to experience it, but pleasure's absence is not bad unless there is someone deprived.
   2. Pessimism (Net Bad): 
      - Life is, on average, net bad. Having a child is likely to cause more harm than good.
   3. Consent-based antinatalism (Consent): 
      - It is wrong to create a person because they cannot consent to being born.
   4. Weak antinatalism (Weak): 
      - Having a child isn't necessarily wrong, but there is a strong reason not to (e.g., risk of harm, or non-moral reasons).
   5. Procreative beneficence (Beneficence): 
      - One should have the best child one can (in terms of expected well-being). If one cannot provide a sufficiently good life, then one should not have a child.
   6. Person-affecting view (Person-affecting): 
      - One cannot harm or benefit a person who never exists, so creating a person is neither wrong nor required.

   We also want to capture:
   - Distinction between "I would have been better off never existing" and "my parents did something wrong"
   - The case of someone who is genuinely glad to be alive: does that change the assessment?
   - Whether the reasoning extends to having pets or creating sentient AI.
   - A child with a very good life.

