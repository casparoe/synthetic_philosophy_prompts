  *   **Proposal P-991:** Reclassify all relations as "Non-Relational Ties" (NRTs), positing NRTs as fundamentally distinct entities requiring no further binding. **Disposition:** Rejected by IRSB Taxonomy Sub-Committee. Rationale: Reclassification merely relocates the binding problem onto the nature of the "NRT" itself without resolving the core requirement for unification between the NRT and its relata. Creates terminological ambiguity without ontological progress.  

