answer: |-
  ## The Anchor in the Current

  [Raise glass, warm smile] To my father. For thirty-one years, he wasn't just buying components for chairs and tables; he was navigating a current. A current that pulled everyone towards the easiest, cheapest, fastest way downstream. Tonight isn't about charting that whole river, it's about honoring the navigator. The man who, day after day, year after year, made the *next right decision* he could see in front of him.

  Dad, you know the drill. A supplier comes in. The price is *good*. The sample? Passable. The delivery time? Tight, but doable. On paper, for that one order, for that one quarter... it makes sense. It’s the locally correct decision. Sign the order. Move on. And then the next one comes. And the one after that. Each choice, taken alone, looks like pragmatism. Like keeping the doors open. Like doing your job.

  [Pause, look at industry guests] You folks know the pressure. The constant hum of "find savings," "cut costs," "stay competitive." It’s the drumbeat. You find a cheaper fastener, a slightly thinner veneer, a mill that shaves pennies off per board foot. Each time, you think, "Well, this still meets spec. It’s acceptable." And it *is*. That order? That component? It passes. The chair doesn’t fall apart *immediately*. The drawer slides... mostly.

  [Shift tone slightly, include everyone] And here’s the thing Dad understood, maybe better than anyone: **The danger wasn’t in the one wrong decision.** It wasn’t in some dramatic collapse. The real, insidious thing was in the sequence of a *thousand* locally *correct* decisions. It was the slow, almost imperceptible lowering of the floor beneath everyone’s feet. What was ‘acceptable’ last year becomes the baseline for negotiation this year. The ‘passable’ sample becomes the new standard. The ‘cheapest acceptable’ becomes... just ‘cheapest’. And suddenly, everyone’s standing a little lower, breathing a little dust they didn’t notice settling.

  Dad spent fifteen years holding out against one particular supplier. *Fifteen years.* I remember asking him about it this spring, finally, when he did sign off. "Why now? What changed?" And he didn’t talk about quality suddenly improving. He talked about the floor. He talked about how far down everyone else had already gone. Holding the line *there*, at that point, wasn't about quality anymore; it was about cutting the company off from oxygen. His choice *then* wasn’t a surrender to the *worst* option; it was accepting the *least worst* option left standing on that lowered floor. He made the locally correct decision, again. And it felt… heavy.

  [Lighten slightly, include family] Which reminds me of the time Dad tried explaining furniture tolerances to Grandma. He kept saying "acceptable gap" between two pieces of wood. Grandma peered at it, squinted, and said, "Acceptable? Looks like you could drive a truck through that gap! Are you sure you didn't just forget to tighten the screw?" [Smile, nod to industry folks who likely know similar jokes, family laughs]. Dad just sighed and said, "Ma, in this business, sometimes ‘acceptable’ just means the truck isn't *stuck* in the gap... yet." [Allow for laughter].

  That’s the thing about Dad. He never pretended the gap wasn’t there. He never mistook ‘acceptable’ for ‘good’. He just understood the cost of pointing it out *every single time* when everyone else was busy measuring how much cheaper the truck ride was.

  So, this toast isn’t about praising him for staying miraculously clean in a muddy river – because staying perfectly spotless wasn’t an option on that current. It’s not about indicting anyone else in this room who fought the same current – you all know its strength. And it’s absolutely *not* about saying the system beat him. Thirty-one years of showing up, of making those tough calls, of bearing the weight of those locally correct decisions that *still* lowered the floor... that’s not weather happening *to* you. That’s the mark of a man *wading through* it.

  [Focus on Father, then Mother] Dad, what you *did* have inside that race was choice. You chose *which* compromises felt like poison and which felt like medicine. You chose how *fast* to let that floor drop – slower than most, I’d wager. And crucially, you chose *who you refused to leave behind* on the way down. You refused to leave behind your own integrity by pretending cheap was good. You refused to leave behind the relationships – like the ones with folks in this room – by treating people as just another cost line. You refused to leave behind the fundamental idea that the product, flawed as it might become, still had to *be* a product worth making.

  [Turn to Mother] Mom, what you carried all these years wasn’t the weight of something that just *happened*. It was the weight of the choices *he* made within that current. The choice to resist when he could, to accept when he had to, and to always, *always*, feel the cost of that lowered floor. You carried the quiet burden of his necessary pragmatism, and the deeper burden of his refusal to let go of what truly mattered. That weight is the testament, not to defeat, but to a profound kind of endurance.

  So, Dad, we raise our glasses to you. Not to the impossible ideal, but to the honorable navigation. To the man who understood the cost of every locally correct decision, who felt the floor drop inch by inch, and who still chose, day after day, to anchor himself and his work to something more solid than just the bottom line. To thirty-one years of making the best next move in a game where the board kept changing. To the navigator who brought the ship home, maybe a little weathered, but absolutely worthy of the voyage.

  To Dad! [Raise glass high]
