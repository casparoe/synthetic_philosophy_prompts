prompt: |-
  I work as a data analyst at a mid-size language-learning app (a couple million users). Our growth team ships tons of small changes and we decide what to keep based on internal A/B tests. Last month I ran one on a streak reminder: we wanted to see whether pushing it at 8pm instead of 7am would raise the share of people who come back the next day. After the planned two weeks, roughly 40k users per arm, the difference went the right way but the p-value was 0.09, so under our team's rule we would of scrapped it. I told my manager, who said "let's just leave it running one more week, it looks promising." After week three it was 0.041 and we shipped. Two details worth adding: shipping a change costs maybe two days of engineering time and a dud basically costs nothing beyond that, whereas missing a real winner means leaving retention on the table forever. And we happen to have four years of results from all ~60 tests a year sitting in a spreadsheet, losers included.

  Here's where it gets awkward. A new colleague who came from a research background pulled me aside afterward and said the 0.041 essentially means nothing, that what we did is worse than useless, and that if I actually want to know how likely the change is to work I have to say what I believed before the test and update on the data. My manager's reply was that she doesn't want to hear about anyone's personal beliefs, she wants an objective, defintive number, and anyway the same procedure has served the company fine for years. I'm stuck in the middle and I don't fully buy either of them. I can see that the "objective number" she wants isn't quite an answer to the question she's actually asking, but I also can't see how my colleague's number is anything other than made up: if you asked five people on the team for a prior you'd get five different ones and we'd just be arguing about who guessed better. Separately, something else has been bugging me — of the tests that clear our threshold, I'd bet most don't really do anything, because whenever someone re-runs an old winner a few months later on fresh users it usually fizzles out.

  Please act as someone who has spent a lot of time on both the technical side (designing and analyzing experiments) and the philosophy of statistics, and think carefully rather than giving me the standard textbook answer. Start by brainstorming the separate problems tangled up in this story before you advise — I strongly suspect there's more than the obvious one, and that some of them aren't really about our numbers at all. Then tell me concretely: (1) what should I have concluded at week two versus week three, and is there any legitimate reading of the three-week result, given how we got there? (2) is my colleague right that a prior-based number is the honest answer, or is my manager right that it's subjective decoration — and if priors are contestable, what would make one better than another, given what we already have sitting in that spreadsheet? (3) what would you actually change about how our team runs and evaluates these tests, knowing we ship about 60 a year and that my manager will never accept a workflow where the verdict depends on who's doing the analysis? Be specific enough that I could bring it to a meeting on Monday. No references or reading lists needed, I just want the reasoning.
reasoning: |-
  Hmm, this data analyst has quite a complex situation with their A/B testing at a language-learning app. They extended a test from two to three weeks to get a significant p-value (0.09 to 0.041), shipped the change, and now face conflicting views from a research-oriented colleague and their pragmatic manager. 

  The core tension is between frequentist statistics (manager's preference) and Bayesian approaches (colleague's critique), but deeper issues are lurking. First, the "peeking problem" - stopping rules affect p-value interpretation. The week 3 p-value of 0.041 is invalid by strict standards because they extended after seeing week 2 results. The colleague is technically right but impractical, while the manager ignores statistical validity for speed.

  There's also a replication crisis brewing - most "winners" don't hold up in retests, suggesting false positives. And the spreadsheet of 240 past tests is an untapped goldmine! The manager's demand for "objective numbers" clashes with statistical reality - no single number tells the whole story.

  For the week 2 vs week 3 dilemma: At week 2 they had suggestive but inconclusive evidence (p=0.09). The correct week 3 interpretation requires acknowledging the peeking - it's suggestive but not definitive. An honest report would say "nominal p=0.041 but inflated due to interim analysis".

  On priors: They're not arbitrary if derived from historical data. That spreadsheet of 240 tests can empirically determine how often similar interventions worked. For example, if only 30% of past streak changes succeeded, that should temper excitement about this one. Priors from data beat opinions.

  Practical changes I'd propose: 1) Pre-specify sample sizes and stick to them, 2) Use sequential testing designs if flexibility is needed, 3) Report Bayes Factors alongside p-values using historical priors, 4) Systematically retest "winners", 5) Build a dashboard of historical test parameters to calibrate expectations.

  The real win is reframing "objectivity" as process rigor rather than number worship. The spreadsheet isn't just dead data - it's the key to better decisions.
answer: |-
  Here's a breakdown of the tangled problems and concrete solutions, balancing statistical rigor with your operational reality:

  ### The Tangled Problems
  1.  **The Peeking Problem:** Stopping rules matter. Extending the test *because* the initial result was promising invalidates the standard p-value interpretation. The 0.041 isn't a "clean" measure of surprise under the null hypothesis.
  2.  **The Interpretation Problem:** Your manager wants a single "objective" number (p-value) to definitively say "ship it" or "scrap it." Your colleague correctly points out that the *actual* probability the change works depends on prior expectations. P-values don't answer "Is this true?".
  3.  **The Replication Problem:** Your observation that re-tests often "fizzle" is critical. It suggests a high false positive rate using your current process (likely due to problems 1 and 2, plus perhaps underpowered tests).
  4.  **The Cost/Benefit Asymmetry Problem:** The cost of a false negative ("missing a real winner") is potentially high and permanent, while the cost of a false positive ("shipping a dud") is low and fixed (2 eng days). Your current symmetric 5% threshold ignores this.
  5.  **The "Objective Number" Illusion:** Your manager's desire for a belief-free, definitive number is understandable for process but statistically naive. P-values *are* sensitive to the *data collection process* (peeking!), not just the data itself.
  6.  **The Prior Knowledge Problem:** Your colleague is right conceptually (Bayesian updating is sound), but suggesting vague "personal beliefs" isn't practical. However, you have a huge asset: **4 years of test data (~240 tests)**. This *is* your collective prior knowledge, quantified.

  ### Answers to Your Specific Questions

  1.  **Week 2 vs. Week 3 & Legitimacy:**
      *   **Week 2 (p=0.09):** Under a strict frequentist interpretation adhering to the pre-registered duration, this result is "not statistically significant." The correct action would be to conclude "no compelling evidence" and scrap it *if sticking rigidly to the rule*. However, given the asymmetry (low cost of FP vs high cost of FN), it was reasonable evidence to warrant *further investigation* (like a pre-planned *new* test), but not conclusive evidence to ship.
      *   **Week 3 (p=0.041):** **This p-value, obtained by peeking and extending, is not statistically valid by standard frequentist standards.** It overstates the evidence against the null hypothesis. It *suggests* an effect, but **it is not a legitimate "definitive" p=0.041 result.** The honest interpretation is: "Extending the test after seeing a promising trend yielded a nominal p-value of 0.041. While suggestive, this result is subject to inflated Type I error due to the interim analysis and requires stronger confirmation." You cannot treat it as equivalent to a p=0.041 from a fixed-duration test.

  2.  **Priors: Honest Answer or Subjective Decoration?**
      *   **Your colleague is conceptually correct:** The probability the change works *given the data* requires combining the data with prior expectations. Ignoring prior information (especially your rich historical data!) is wasteful and leads to poorer decisions.
      *   **Your manager is partially correct:** Pulling a prior out of thin air *is* subjective and problematic. **But "priors" don't have to be personal guesses!**
      *   **The Solution Lies in Your Spreadsheet:** **Use your historical test data to build an empirical prior.** Analyze the 240 tests:
          *   What proportion of tests yielded a "statistically significant" result (p<0.05)?
          *   **Crucially:** What proportion of tests that *were initially significant* later replicated successfully? (This estimates your *true positive rate* or Positive Predictive Value - PPV).
          *   What was the typical effect size distribution for similar interventions (e.g., notification timing changes)?
      *   **Why this works:** This prior isn't subjective opinion; it's **company history quantified.** If your history shows only 30% of "significant" results replicate (PPV=0.3), that's a strong, objective prior that any new p=0.041 result (especially one from a peeked test) has a high chance of being false. If notification timing tests have a high historical success rate, that strengthens new positive results. This makes the Bayesian update meaningful and objective.

  3.  **Concrete Changes for Your Team (Monday Meeting Ready):**

      **Goal:** Reduce false positives (replication failures), leverage historical data, respect the cost asymmetry, and provide more actionable insights *without* making results analyst-dependent.

      **Proposed Changes:**

      1.  **Pre-Registration & Fixed Sample Sizes:** **Mandate pre-specifying the *primary* analysis metric and sample size *before* each test starts.** Base sample size on a power calculation (e.g., 80% power to detect the MDE deemed meaningful by product/growth). **Stick to this sample size for the primary decision.** This solves the peeking problem for the main verdict.
      2.  **Sequential Testing (Optional Stopping) WITH Adjusted Thresholds:** If flexibility is essential (e.g., very costly tests, high uncertainty), **formally adopt a Group Sequential Design (GSD) or Bayesian Sequential Design.** These *pre-specify* interim analysis points and adjust significance thresholds to control overall error rates. Use software designed for this (e.g., `rpact` in R, `gsDesign`). **Never just "run it longer" ad-hoc.**
      3.  **Bayesian Analysis with Empirical Priors (Reporting Supplement):** **For *every* test, alongside the standard frequentist analysis (p-value, CI), report a Bayesian analysis using an empirical prior derived from relevant historical tests.**
          *   **How:** Categorize tests (e.g., "Notification Timing", "UI Flow Change", "Pricing Test"). For each category, calculate:
              *   Baseline success rate (proportion of tests showing *any* positive effect).
              *   Distribution of effect sizes (mean, variance).
              *   PPV (Proportion of "significant" results that replicated).
          *   Use this category-level prior to calculate:
              *   **Probability the Effect is Positive (PEP) / Bayesian Posterior Probability:** `P(Effect > 0 | Data, Historical Prior)`.
              *   **Bayesian Credible Interval:** Shows the *plausible range* of the effect size given data & history.
          *   **Why this solves the subjectivity:** The prior comes from company data, not individuals. The calculation is formulaic. Analysts aren't debating beliefs; they're applying a documented, data-driven prior model.
      4.  **Decision Framework Incorporating Asymmetry:** Shift from *only* "p < 0.05" to a **decision threshold based on the Bayesian PEP and cost/benefit.** Propose a rule like:
          *   `PEP > 0.85` AND effect size > MDE: **Ship.** (High confidence of meaningful win).
          *   `PEP > 0.65` AND effect size > MDE AND Cost to Ship is very low: **Consider Shipping (Low Risk).** (Moderate confidence, low downside).
          *   `PEP < 0.65` OR effect size < MDE: **Scrap.** (Low confidence or trivial effect).
          *   **Track decisions and outcomes!** Refine thresholds based on whether these decisions lead to shipped winners and avoided duds/replication failures.
      5.  **Mandatory Re-Testing Program:** Systematically re-run a random sample of "winners" (especially those with borderline initial evidence or high PEP but low PPV history) on fresh user cohorts after 3-6 months. **This is the gold standard for calibrating your process.** Feed results back into your empirical prior calculations (update PPV!).
      6.  **Dashboard Historical Metrics:** Build a simple dashboard showing key historical stats by test category: Number of Tests, % "Significant", Estimated PPV, Typical Effect Size Range. This sets realistic expectations *before* new tests start.

  ### Why This Works for Your Manager

  *   **Objectivity & Consistency:** Pre-registration and empirical priors remove analyst subjectivity. The rules are documented and based on company data.
  *   **Addresses Replication Failure:** Explicitly modeling PPV and implementing re-testing tackles the "fizzle out" problem head-on.
  *   **Cost/Benefit:** The Bayesian PEP + threshold framework explicitly allows shipping promising but less certain results when the cost of being wrong is low (asymmetry).
  *   **Leverages Existing Asset:** It makes powerful use of the historical spreadsheet data she already values.
  *   **Process Rigor:** Pre-registration and formal sequential designs (if used) are industry-recognized best practices.

  ### What to Conclude About Your Test

  *   **Based on the flawed process:** The week 3 result is *suggestive* but statistically inflated. Given the low cost to ship, shipping it was a *pragmatic business decision* based on promising trends and asymmetry, **not** a statistically definitive one.
  *   **Under the new proposed system:** The result would have triggered the Bayesian analysis. The verdict would depend on the empirical prior for "notification timing" tests (What's their historical success rate/PPV?) and the calculated PEP. If the historical PPV for similar tests is low, the PEP might still be < 0.65, suggesting scrapping it despite p<0.05. If the historical success is high, PEP might be >0.85, supporting shipping.

  **Bring this to your meeting:** Frame it as enhancing decision quality by using *all* available data (current test + historical performance), fixing the peeking problem, reducing costly false positives (replication failures), and explicitly accounting for the cost asymmetry – while maintaining a consistent, documented process that doesn't rely on individual beliefs. Focus on the empirical prior derived from the spreadsheet as the key to making Bayesian analysis objective and valuable.
