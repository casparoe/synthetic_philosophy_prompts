prompt: |-
  You're a political philosopher who has also spent real time in political economy — someone who can hold a normative argument and a belief-updating model in the same hand without dropping either. Before you write anything, do a short brainstorming section for me: a page at most, listing the actors in the episode, the moments where a genuinely different choice was on the table, and the two or three spots where you expect the theory and the history to rub against each other. Then do the analysis proper.

  The episode is the American response to the 2008 crash and what came out of it politically. Facts I'm supplying so you don't have to guess: the TARP bank rescues in autumn 2008, carried on into the new administration; the stress tests of spring 2009 designed so that no large bank had to be taken over; the AIG bonus fury in March 2009, when the House passed a 90% punitive tax on bonuses at firms that had taken bailout money and the thing then quietly died in the Senate; no senior banker criminally prosecuted; a CNBC rant about mortgage relief in February 2009 that is usually credited with kicking off the Tea Party; and then Occupy, from September 2011, with its "we are the 99%" slogan.

  The lens is the standard political-economy account of why the US redistributes so much less than Europe. First, the fairness-equilibrium line from Alesina and Angeletos: Americans believe market outcomes largely track effort, Europeans believe they track luck, birth and connections, and each belief is self-confirming because it shapes the tax policy that shapes what income actually consists of. Second, the POUM line from Bénabou and Ok: the median voter puts up with inequality now because she expects to be above the mean later, or expects her children to be. Keep the institutional rivals — electoral rules, racial heterogeneity — in the background as things to check your story against, not as the main lens.

  Here's the part I want you to build rather than retrieve. Before you get to the politics, define me an effort-attribution share: for any given top income, the fraction of it a voter assigns to effort as against luck, inheritance, insider access and outright fraud. Suppose demand for redistribution falls as the average of that share rises. Make the model your own — I'm not asking for anyone's equations — but state its assumptions out loud, and then use the episode to trace what 2008 did to that share in different parts of the electorate. Be explicit about which assumptions the history strains.

  The crux is the anomaly. One shock, two movements, opposite distributive programmes. The fairness account predicts a collapse in effort-attribution and hence a lurch toward redistribution. What happened on the American right was a re-assertion: the complaint was that the state was taking from the deserving and handing it to bankers, subprime borrowers and public-sector workers. Tell me precisely whether that is a counterexample, a prediction the theory makes once you are careful about *which* belief got updated — markets fair, government not — or a sign the theory was never about beliefs in the way its critics suppose. And run the same test on the 90% AIG tax: was that a redistributive moment or an expressive one, and does the difference matter for the theory?

  Then the other direction. What does this episode say about the European attitude, given that European governments also bailed out their banks and then largely went for austerity rather than confiscation? And take a position on the question I actually care about: which of the two attitudes to inequality is the more defensible. Use the episode as evidence, not as decoration.

  I want a commited answer — pick a side, give your reasons, and say what would change your mind. No fence-sitting, no "on the one hand there are considerations on both sides" wrap-up. Where the theory is silent on the episode, write "the theory is silent here" instead of making it speak. And two house rules: no bibliography, no reading list, no citations of any kind; and don't invent numbers — if you need a quantitative claim, either be confident in it or flag it as a guess.
