prompt: |-
  So, no philosophy background here beyond one required ethics class I mostly slept through — I write backend code for a living. I'm on a six-month stint at our company's office in another country, and the local conventions are way more load-bearing than I expected. Two that keep coming up: nobody jaywalks, ever, even at 2am on a totally empty street (I did it once in week one and got stared at like I'd kicked a dog), and there's this rotating thing where whoever makes coffee also washes everyone else's cups, which is in zero handbooks but everybody just does it and there's real social pressure if you don't.

  Anyway, our EM killed an entire Slack thread about whether us visiting Americans have to go along with stuff like that by dropping "when in Rome, do as the Romans do," like that settles it. Then one of the local engineers pushed back with what I think is a pretty good dilemma. Either the proverb is just practical advice — blend in so people like you and the office runs smoothly — in which case it isn't a moral claim at all and it can't tell us we *have* to do anything. Or it IS a moral claim, in which case it makes the exact same act (crossing an empty street against the light) wrong here and completely fine back home, which seems insane, and it also commits us to following local practice when local practice is bad — his example was the office-wide norm of "don't file bugs against a partner team's code, just ping them on chat," which everyone here does and which has definately burned us twice. So he thinks the saying is either toothless or false, and the EM thinks he's overthinking it.

  I lean toward the dilemma being right, but I have this nagging feeling there's a third option neither of them is considering, and I can't articulate it.

  Can you break the slogan apart into the seperate precise claims it could be making? I want a numbered menu, and for each reading: what exactly is being claimed (who's obligated, who counts as "the Romans," what "do as they do" is supposed to cover — every local habit, or only the deliberate cooperative ones? — and whether the force is prudence, etiquette, respect, or morality), plus a verdict on each one, i.e. truism nobody could deny, substantive but defensible, or actually false. Then tell me which of those readings would genuinely have backed up what the EM was trying to do in that thread, whether any of them survives the dilemma, and which one people who say the proverb casually are most likely to have in their heads. Last bit: which reading, if any, explains why the locals get morally indignant about the jaywalking rather than just finding it weird — that's the part that still doesn't compute for me.
reasoning: |-
  Okay, let's tackle this step by step. The user is a backend developer working abroad, facing cultural norms like strict no-jaywalking and a coffee cup washing ritual. Their EM used "When in Rome, do as the Romans do" to shut down a Slack debate, but a local engineer challenged it with a dilemma: either the proverb is just practical advice (not moral) or it's a moral claim that leads to absurd or dangerous conclusions. The user suspects there's a third option and wants a breakdown.

  First, I need to unpack the proverb into precise claims. The key elements are: who is obligated, who counts as "Romans," what actions are covered, and the nature of the obligation (prudence, etiquette, morality). The user also wants to know which interpretation supports the EM's point, survives the dilemma, and explains the moral indignation over jaywalking.

  The dilemma presented is between two interpretations: either the proverb is purely pragmatic (so no moral obligation) or it's moral (leading to relativism where right/wrong depends on location). The user feels there's a middle ground, probably involving social norms that aren't strictly moral but carry weight beyond mere preference.

  Looking at possible interpretations:
  1. **Pure Prudence**: This is straightforward advice to avoid trouble. It's a truism but doesn't create obligations. The EM might have meant this, but it doesn't address the moral indignation over jaywalking.
  2. **Social Etiquette**: About respecting local customs as a form of politeness. This is defensible and might cover the coffee cup norm. It explains social pressure but not deep moral outrage.
  3. **Moral Relativism**: Claims morality is location-dependent. This is problematic, as it could justify bad practices. The local engineer's bug-reporting example shows why this fails.
  4. **Rule-Consequentialist**: Following local norms maintains social harmony. This is substantive and defensible, especially for cooperative practices. It might cover both jaywalking and coffee rituals by emphasizing systemic trust.
  5. **Expressivist**: Actions show respect for the community. This bridges etiquette and morality, explaining why violating norms feels like a personal slight. This could explain the jaywalking reaction—seen as disrespecting their social order.

  The Rule-Consequentialist view (4) seems strongest. It frames norm-following as essential for cooperation, making it more than pragmatism but avoiding relativism. For example, jaywalking isn't inherently immoral, but consistently ignoring local laws erodes trust. Similarly, the coffee ritual reinforces teamwork. This view survives the dilemma because it doesn't claim all local practices are moral, just that cooperation-based ones have weight. It also explains the moral indignation: violating such norms threatens group cohesion.

  The Expressivist view (5) adds depth by linking actions to respect. When the user jaywalked, locals saw it as dismissing their values, hence the strong reaction. This combines with Rule-Consequentialism: norms aren't sacred, but upholding them shows you're part of the community.

  For the EM's intent, they likely meant a mix of 2 and 4—etiquette plus practical harmony. But the local engineer's bug example exposes the flaw if applied blindly. So the proverb works best for norms that are about cooperation, not harmful practices.

  The coffee cup washing is a classic example of a cooperative norm—it's arbitrary but builds reciprocity. Jaywalking, in a society with high compliance, signals respect for order. The bug-reporting norm, however, is dysfunctional and shouldn't be followed, showing that "When in Rome" isn't absolute.

  In summary, the third option the user sensed is probably the Rule-Consequentialist or Expressivist reading. These interpretations make the proverb substantive without collapsing into relativism. They explain why locals react morally to jaywalking (it's a breach of social trust) while allowing pushback on harmful norms like the bug-reporting practice.
answer: |-
  You're absolutely right to feel there's a middle ground – the dilemma oversimplifies a proverb that's actually doing several things at once. Let's break down "When in Rome..." into distinct, precise claims, evaluate them, and see which ones hold water and serve the EM's purpose.

  **The Core Elements to Define:**
  1.  **Who is obligated?** (The visitor/"you")
  2.  **Who are "the Romans"?** (The host community)
  3.  **What does "do as they do" cover?** (Scope: All local practices? Only socially significant ones? Cooperative conventions? Laws?)
  4.  **What is the nature of the obligation?** (Prudence? Etiquette? Respect? Morality?)
  5.  **What's the verdict?** Truism (T), Substantive & Defensible (SD), Actually False (F)

  **The Numbered Menu of Interpretations:**

  1.  **Pure Prudence (Avoid Social Cost)**
      *   **Claim:** As a visitor, to avoid negative social consequences (disapproval, exclusion, friction), you should conform to the observable behavioral patterns ("do as they do") of the dominant local group ("the Romans") in matters where deviation is noticeable and likely to provoke a reaction.
      *   **Scope:** Any local practice where deviation is socially costly (jaywalking, coffee cups, potentially dress code, greetings).
      *   **Force:** Pure self-interest and practicality. No inherent "should" beyond avoiding hassle.
      *   **Verdict:** **Truism (T).** It's basic cost-benefit analysis. Nobody seriously denies acting this way often *works* to smooth interactions.
      *   **EM Support?** Weak. It doesn't provide a *reason* beyond self-preservation why the team *should* conform, just that they'll face pressure if they don't. It reduces the EM's statement to "Do it or get stared at," which wasn't their intended gravitas.
      *   **Survives Dilemma?** Yes, trivially. It's not a moral claim, so the dilemma's second horn (moral relativism) doesn't apply. It *is* toothless as a moral argument, but that's not its point.
      *   **Likely Casual Meaning?** Very common, especially as initial justification.
      *   **Explains Jaywalking Indignation?** No. It explains *why* the locals might apply pressure, but not the *moral* flavor of their reaction ("kicked a dog").

  2.  **Social Etiquette (Demonstrating Politeness/Respect)**
      *   **Claim:** As a visitor, you have an obligation rooted in basic politeness and respect for your hosts to conform to their established social conventions ("do as they do") – especially those involving shared resources or cooperative interactions – as defined and practiced by the resident community ("the Romans").
      *   **Scope:** Primarily deliberate cooperative conventions and shared-space etiquette (coffee cup washing, meeting norms, greetings, queueing). *Less likely* to cover purely personal habits or laws unless deeply tied to local identity/order (jaywalking *might* fall here for them).
      *   **Force:** Etiquette / Social Norms. Failure is rude, disrespectful, shows poor manners.
      *   **Verdict:** **Substantive & Defensible (SD).** Respecting local customs is a widely recognized component of cross-cultural politeness and building rapport. It's not absolute (bad etiquette can be challenged), but it carries significant weight.
      *   **EM Support?** Moderate. It provides a "why" beyond pragmatism: showing respect for colleagues and the local office culture. It directly covers the coffee cup norm as a cooperative convention.
      *   **Survives Dilemma?** Mostly. It's not pure morality; it's about interpersonal respect within a social context. Conforming to polite norms here doesn't necessarily mean they are moral absolutes or that bad norms *must* be followed (etiquette has limits). The bug-reporting norm could be argued as *bad etiquette* hindering the team, making it permissible to challenge.
      *   **Likely Casual Meaning?** Very common. Often blended with Prudence.
      *   **Explains Jaywalking Indignation?** Partially. If jaywalking is seen as flouting a fundamental local rule of public order/respect for law, it *could* be interpreted as deeply disrespectful rudeness. But "indignation" suggests something stronger than just rudeness.

  3.  **Moral Relativism (Local Practice Defines Right/Wrong)**
      *   **Claim:** The moral permissibility or impermissibility of an action is determined *solely* by whether it conforms to the dominant practices ("do as they do") of the local community ("the Romans") where the action occurs. An action is wrong *because* it violates local norms, and right *because* it adheres to them.
      *   **Scope:** *All* local normative practices, by definition, become morally binding for visitors while there.
      *   **Force:** Morality. Failure is *morally wrong*.
      *   **Verdict:** **Actually False (F).** This is the problematic horn of the engineer's dilemma. It leads to absurdities (jaywalking wrong here/moral there) and moral paralysis in the face of genuinely harmful local practices (the bug-reporting norm, or worse, historical examples). It confuses descriptive norms ("what people do") with prescriptive morality ("what people *should* do").
      *   **EM Support?** No. This is likely *not* what the EM meant, as it would force conformity to the harmful bug-reporting norm. It undermines their authority if local practice conflicts with company policy or good engineering.
      *   **Survives Dilemma?** No. This *is* the second horn the engineer correctly identifies as false and dangerous.
      *   **Likely Casual Meaning?** Rarely intended seriously, though sometimes carelessly implied.
      *   **Explains Jaywalking Indignation?** Yes. If locals genuinely believe the norm *defines* morality, violation *is* inherently immoral to them. But this commits *them* to relativism too, which is philosophically unstable and not how most people actually operate.

  4.  **Rule-Consequentialism / Social Coordination (Maintaining Trust & Function)**
      *   **Claim:** As a temporary participant in a social group ("the Romans"), you have a pro tanto obligation (an obligation that can be overridden by stronger claims) rooted in fairness, reciprocity, and the practical necessity of social coordination to adhere to their established *cooperative conventions and norms that facilitate group function and trust* ("do as they do" in specific contexts). This obligation arises because your deviation can undermine the shared expectations and smooth functioning that everyone relies on.
      *   **Scope:** Deliberate, cooperative conventions essential for group cohesion and predictable interaction (coffee cup washing, communication protocols, adherence to traffic rules *as part of social order*). *Excludes* purely personal habits or harmful/unjust practices.
      *   **Force:** A mix of fairness, reciprocity, and low-level morality/social obligation. Failure is unfair, undermines trust, and harms group function.
      *   **Verdict:** **Substantive & Defensible (SD).** This avoids relativism by grounding the obligation in the *functional value* of the norm for cooperation and the *harm* caused by arbitrary deviation. It allows for challenging norms that are *dysfunctional* (bug-reporting) or *unjust*.
      *   **EM Support?** Strong. It provides a robust "why": maintaining team cohesion, trust, and smooth office function. It directly supports conformity on the coffee norm and jaywalking *if* the latter is seen as part of social order/trust. Crucially, it *doesn't* support conforming to the harmful bug-reporting norm, as that norm *undermines* team function.
      *   **Survives Dilemma?** Yes. It's a substantive moral/social claim without collapsing into relativism. The obligation stems from the *purpose* of the norm (cooperation/order), not its mere existence. Jaywalking *can* be wrong here and fine back home *if* the violation meaningfully undermines local social coordination/trust in a way it doesn't back home. It's context-sensitive, not relativistic.
      *   **Likely Casual Meaning?** Often the *unspoken* core when used seriously in cooperative contexts like an office. People sense the fairness/reciprocity angle.
      **Explains Jaywalking Indignation?** **Yes, Best Fit.** The locals likely see traffic norms as fundamental cooperative rules maintaining public order and safety *through mutual trust and predictability*. Your jaywalking isn't just "weird," it's a breach of that shared social contract. It signals disregard for the system of trust they collectively maintain ("If *he* ignores it when it's empty, would he ignore it when it's not? Does he think *our* rules are silly?"). It feels like a violation of a foundational social agreement, hence the moral tone ("kicked a dog" implies cruelty/violation, not just oddness).

  5.  **Expressivist (Showing Respect for the Community)**
      *   **Claim:** Conforming to significant local practices ("do as they do") is the primary way a visitor demonstrates genuine respect and good faith towards the host community ("the Romans"). Refusal is interpreted as a statement of disrespect or superiority.
      *   **Scope:** Practices symbolically tied to local identity, values, or social cohesion (jaywalking as respect for law/order, coffee ritual as teamwork, specific greetings).
      *   **Force:** Morality/Respect. Failure is disrespectful, arrogant, morally deficient in showing regard for others.
      *   **Verdict:** **Substantive & Defensible (SD), but context-dependent.** Showing respect is crucial. However, it risks making *every* norm a potential test of respect, and conflates conformity with respect (one *can* respectfully explain dissent). Also, not *every* local habit carries this weight.
      *   **EM Support?** Moderate to Strong. It provides a strong "why" rooted in interpersonal respect and team morale. Fits the coffee ritual perfectly. Could fit jaywalking if locally symbolic.
      *   **Survives Dilemma?** Mostly. The obligation is to *show respect*, not to blindly follow all norms. Respect could *require* challenging a harmful norm like bug-reporting for the good of the team/company. It avoids relativism by grounding the "should" in the universal value of respect, applied contextually.
      *   **Likely Casual Meaning?** Common, especially when frustration arises ("Why won't they just show some respect?").
      *   **Explains Jaywalking Indignation?** **Yes.** If adherence to traffic rules is a visible symbol of respecting their social order and values, your jaywalking is read as a deliberate act of disrespect ("He thinks he's above *our* rules") or disdain for their way of life. This feels deeply personal and offensive, hence moral indignation.

  **Conclusion & Answers to Your Questions:**

  1.  **Which reading genuinely backed up the EM?** The EM likely intended a blend of **#2 (Social Etiquette)** and **#4 (Rule-Consequentialism / Social Coordination)**. They wanted practical harmony (#4's function) and respect for local office culture (#2's politeness), applied to norms like coffee cups and jaywalking. They were *not* advocating #3 (Moral Relativism), as that would trap them with the bug-reporting norm.
  2.  **Which reading(s) survive the dilemma?** **#1 (Prudence)** survives by being non-moral. **#2 (Etiquette)**, **#4 (Coordination)**, and **#5 (Expressivist)** survive as substantive claims without collapsing into relativism. They ground the obligation in practical function, reciprocity, respect, or maintaining trust, not the mere existence of the norm. **#3 (Relativism)** does not survive.
  3.  **Which reading is most likely in casual use?** A somewhat fuzzy blend of **#1 (Prudence)** and **#2 (Etiquette/Respect)** is most common. People sense the practical benefit and the rudeness of not conforming on visible, shared norms.
  4.  **Which reading explains the jaywalking indignation?** **#4 (Rule-Consequentialism / Social Coordination)** and **#5 (Expressivist)** offer the best explanations. #4 frames it as undermining a foundational cooperative trust in public order. #5 frames it as an act of disrespect towards the community and its values. Both capture the *moral* flavor ("kicked a dog") better than pure prudence or etiquette. The locals likely perceive the traffic norm as a core part of their social contract, making violation feel like a breach of shared trust or an insult.

  **Your Nagging Feeling Vindicated:** The "third option" you sensed is likely **#4 (Rule-Consequentialism / Social Coordination)** or **#5 (Expressivist)**. These interpretations provide a moral-ish *reason* to conform (maintaining functional cooperation/trust or showing respect) that isn't mere prudence (#1), isn't relativism (#3), and is stronger than simple etiquette (#2). They explain the jaywalking reaction *and* allow for rejecting harmful norms like the bug-reporting practice, because those norms *fail* the test of promoting genuine cooperation/function or deserve respectful challenge. The proverb works best for *cooperative conventions* within a group you are temporarily joining, not as a blanket command for all local behavior.
