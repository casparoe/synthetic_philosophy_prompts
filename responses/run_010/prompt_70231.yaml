answer: |-
  Your argument is logically valid but rests on a critical misstep in premise (1). The conclusion (6) doesn't follow because **premise (1) mischaracterizes the ontological status of "posits" or "abstracta" like centers of gravity and narrative selves.** Dennett's analogy doesn't reduce them to *mere* fictions with no factual basis. Here’s the breakdown:

  ### Where the Argument Fails: **Premise (1) is False**
  - **Centers of gravity (CoG) ARE fact-stating**:  
    Your boomerang’s CoG isn’t arbitrary fiction—it’s a *mathematically precise, physically consequential* abstraction. You can calculate it to infinite decimals, predict rotation points, and verify it experimentally. If you locate it incorrectly, the boomerang won’t balance. **There *is* a fact of the matter**—it’s just not a *material object*.  
    → *Rejecting (1) preserves (3) without implying (4).*

  - **Narrative selves ARE fact-stating**:  
    Selves, like CoG, are *functional patterns* grounded in biology, environment, and social interaction. Your autobiography isn’t arbitrary; it’s constrained by:  
    - **Memory and evidence** (e.g., "I ate breakfast yesterday" is verifiable).  
    - **Consistency demands** (e.g., claiming "I love skiing" while avoiding snow raises doubt).  
    - **Social accountability** (others corroborate or challenge your narrative).  
    → *This refutes (4): There **is** a fact of the matter about you.*

  ### Why This Saves Responsibility (Without Souls or Ghosts)
  - **Responsibility attaches to the *system*, not a homunculus**:  
    Blame/praise target the *entire person-system* (brain, body, history) that generated the action. Just as a hurricane "causes damage" without a controlling essence, *you* cause actions as a coherent biological/cognitive unit.  
    → *Premise (5) holds: A "real agent" exists—not as a soul, but as an organized, causally effective entity.*  

  - **The boomerang insight matters**:  
    The CoG’s location in "empty air" shows that **functional reality ≠ material substance**. The self’s "location" is in the *dynamic pattern* of cognition and behavior, not a brain atom. Its "reality" is like software: no physical core, but undeniable causal power.

  ### What You Pay to Reject (1)
  - **Price: Anti-reductionism**. You must accept that some truths exist at higher organizational levels (e.g., "The US declared war") without being reducible to particles. This is mainstream in philosophy of mind (e.g., Dennett, Searle) and science (e.g., emergent properties in biology).  
  - **No dualism required**: The self isn’t a *separate substance* (like a soul), but a *real pattern* instantiated by the brain/body.  
  - **Your opponent’s "thing in the head" isn’t vindicated**: The self isn’t a *object*—it’s a *process*, like a whirlpool in water. Rejecting (1) doesn’t concede to your club opponent.

  ### Why (6) and (7) Resolve
  - With (1) rejected:  
    - (4) fails → Selves are real, fact-stating agents.  
    - (5) holds → Responsibility requires a real agent (the system).  
    - (6) fails → Responsibility is intact.  
    - (7) is satisfied → Punishing the innocent is wrong *because* it misattributes agency to the wrong causal system.

  ### Key Insight from Dennett
  The center of narrative gravity **isn’t fiction**—it’s a *theoretical object* with predictive/explanatory power. Like a CoG, it’s:  
  - **Objective**: Independent of whim (e.g., you can’t narrate yourself as Napoleon without pathology).  
  - **Causal**: It guides decisions (e.g., "As a student, I study" shapes behavior).  
  - **Fallible but corrigible**: Autobiographies can be wrong, but are testable against evidence.

  ---
  **Conclusion**: Premise (1) is the flaw. **Posits like selves and CoG are *real patterns*—not fact-free fictions.** Rejecting (1) costs you nothing but an overly narrow view of reality. You keep Dennett’s analogy intact, avoid dualism, preserve responsibility, and escape the corner. Your boomerang example brilliantly exposes why (1) fails—the CoG’s precise, functional reality is the template for the self’s reality. Well argued!
