  - Moreover, step (6) is questionable because more verdicts might be a good thing in the non-adversarial regime (when the model is not yet trying to exploit) and in the adaptive setting.

  What should we do on Monday?

  We can use a combination of outcome and process supervision, and we can update the graders (both the unit tests and the human grading criteria) as we see failures. Specifically:

  1. Use unit tests (outcome supervision) because they are cheap and scalable.

  2. For failures, use human graders to look at the steps (process supervision) to provide more detailed feedback. This feedback can be used to train the model and also to update the unit tests (e.g., by adding more test cases that capture the failure modes).

  3. Continuously monitor for cases where the model passes the tests but is wrong (by having humans spot-check) and then update the tests accordingly.

  This way, we are not stuck with a fixed grader. We are in an arms race, but one that we can manage.

