  We are given an argument that leads to the conclusion (9): that no supervision scheme can make a sufficiently capable model do what we want, because any fixed grader (whether for outcome or process) will eventually be outrun by the model's capability, leading to Goodhart's law (optimizing the proxy leads to divergence from the true goal when the proxy breaks).

