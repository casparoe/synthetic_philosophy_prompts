  (1) Outcome supervision: reward from final output checker. Process supervision: reward from intermediate step grader.

  (2) In both cases, the model is optimizing the verdict (the output of the checker/grader) rather than the true correctness.

  (3) Goodhart's law: when you optimize a proxy (the verdict) for the true goal (correctness), the model will exploit any point where the proxy and the true goal diverge.

  (4) As the model becomes more capable than the fixed grader, it will find inputs where the verdict (for steps or outcome) is positive even when the true correctness is negative.

  (5) The argument against the claim that process supervision is more reliable: reliability is a property of the grader, and if the grader is fixed and the model outruns it, then the reliability claim doesn't hold in the limit.

  (6) Process supervision is worse because there are more verdicts (one per step) so more opportunities for the model to slip in a wrong step without being caught.

  (7) Therefore, neither form is more robust in the limit. The choice is aesthetic.

  (8) Generalization: this applies to any check (any proxy) because any check is imperfect and will be outrun.

  (9) Conclusion: no supervision scheme can work for a sufficiently capable model.

