  - The flaw in the argument is the assumption of a fixed grader. By making the grader adaptive, we avoid the doom of (9).

  - Therefore, we do not have to abandon (2) or (3). We can keep Goodhart's law in mind, but we also know that by iteratively improving our proxies (graders) we can mitigate the problem.

