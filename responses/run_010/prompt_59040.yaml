  Where can we challenge?

  Let's consider step (5) and (6). The user argues that process supervision is not more reliable in the limit and actually worse because of more verdicts. But note: step (5) is a rebuttal to a potential objection, and step (6) is an independent point. However, step (6) might be the key to why the user thinks process is worse, but what if we can show that in practice, for a given level of grader capability, process supervision might be more robust?

  But the argument is about the limit: when the model outruns the grader. So perhaps the distinction between outcome and process is not about the limit but about the rate at which the model outruns the grader? That is, maybe process supervision, by having more detailed feedback, allows for a more capable grader? But the grader is fixed (by premise). So if the grader is fixed, then indeed the model will eventually outrun it.

