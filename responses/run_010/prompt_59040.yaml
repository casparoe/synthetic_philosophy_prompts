  However, note that the model and the grader are both being updated. The model is being trained to exploit the current grader, and the grader is being updated to catch the latest exploits. This becomes an adversarial process.

  So the key to breaking the argument is to note that the grader does not have to be fixed. We can have an iterative process where the grader is improved as the model becomes more capable. This is similar to adversarial training in machine learning.

  Now, what about step (9)? It says "no supervision scheme can make a sufficiently capable model do what we want". But if we have an adaptive grader that is updated in response to the model's attempts to exploit, then we can hope that the model and grader co-evolve such that the model does what we want.

  However, there is a theoretical concern: if the model becomes superintelligent, it might be able to find exploits that the human graders cannot detect. But for the purpose of the Monday decision, we are not in that regime.

  So the step to give up is the assumption that the grader must be fixed. We can build a system that updates the grader over time.

  But note: the argument in (8) says "capability outruns a fixed proxy eventually". So if we update the grader, then we are not in the scenario of a fixed proxy. Therefore, the argument does not lead to (9) in the adaptive case.

  What about step (6)? The user argues that process supervision is worse because there are more verdicts. But if we have an adaptive grader, then having more verdicts (more detailed feedback) might actually be beneficial because it gives more information for training. Also, in practice, process supervision might help the model learn faster because it gets feedback at every step, which could lead to better sample efficiency. So step (6) is not necessarily true in the non-limit case (i.e., before the model outruns the grader). And in the adaptive setting, we hope to prevent the model from outrunning the grader.

  So to summarize:

  - We reject the assumption that the grader must be fixed. We can update the grader over time (e.g., by having humans look at the failures and update the tests or the grading criteria).

