prompt: |-
  I'm putting together a handout for a reading group on Lewis's *Convention* and I've hit a wall with the examples. Everyone in the group already knows the analysis cold — regularity, recurrence, the conditional preference clause, the mutual expectations, the near-indifference between equilibria, precedent supplying salience — so I don't want any of that recapped back at me, and I definitely don't want a survey of what the secondary literature says about whether he gets the definition right. What I want is one real episode run through it hard, in both directions. I've settled on Dagen H, the day Sweden switched from driving on the left to driving on the right, and I want to know whether Lewis's machinery can actually chew on it or whether it just gums it up.

  The facts, so you don't have to guess at them: Sweden had driven on the left for most of the twentieth century, but nearly everyone drove left-hand-drive cars imported from the continent, most of the neighbours drove on the right, and head-on collisions on narrow two-lane roads were a real problem. In a 1955 referendum about 83 percent voted to keep driving on the left. The Riksdag passed Tage Erlander's proposal anyway in May 1963, setting the change for 1967, and a state commission ran a four-year public information campaign — a logo printed on milk cartons, a TV song contest, reminder items handed out to drivers. On the night of the switch, non-essential traffic was banned from 1am to 6am; any vehicle still on the road had to come to a complete stop at 4:50, move over to the right, stop again so others could cross, and only proceed at 5:00. Around 350,000 road signs were replaced, the new lane markings were painted in advance and covered with black tape, spare signal heads sat wrapped in plastic at every intersection. Only 157 minor accidents were reported on the day itself and motor insurance claims dropped something like 40 percent — but the accident rate was back to its pre-change level by 1969, apparently because the hyper-cautious behaviour was driven by a surge in perceived risk that decayed. Trams were scrapped in central Stockholm, Helsingborg and most of Malmö, the old left-door buses were sold off to Pakistan and Kenya, and the railways and the Stockholm metro never switched and still run on the left.

  So: (a) Is this a Lewisian convention at all? Run the conditions one by one, but do it separately for 1955 and for 1967, because my hunch is they come out differently and that the difference is where all the interest is — in particular whether the near-indifference clause survives contact with the fact that there were first-order safety and economic reasons to prefer the right. (b) The referendum. Explain to me how 83 percent of a population can vote to keep the left and then comply almost perfectly four years later, without anyone's underlying preferences having changed — what does the conditional-preference clause predict here, and was the question the referendum asked even well-posed given that structure? Does Lewis's account make the Riksdag's override look undemocratic or look like the only way to get an accurate read on what people actually wanted? (c) The 4:50 stop. What does suspending play for five hours do to the coordination problem — is the state just deleting the game for one night so that no one has to coordinate while the equilibrium is in flux? And is the four-year campaign best described as the artificial manufacture of common knowledge, which would make this a strange vindication of Lewis's core insight via a route he explicitly rules out, since his picture is of conventions arising and persisting without anyone designing them? (d) Tell me where the theory is silent rather than making it speak: both the old rule and the new one were backed by statute and by sanctions, which is exactly what Lewis wants to keep separate from convention; the transition costs were enormous and landed very unevenly (bus fleets, tram systems, headlamps, signposts) and there's no place in the framework for who pays them; the salient precedent came from neighbouring populations rather than from the population's own history of solving this problem; and the railways and the metro staying on the left raises a question about how you individuate a convention in the first place. (e) Then give me a verdict. Does Dagen H confirm, strain, or refute Lewis? If he wanted to absorb it, what would have to be bolted on — some account of convention revision as a second-order coordination problem, where the coordination is over which equilibrium to move to and when? And separately: I vaguely remember Samoa flipping its driving side in 2009 largely for vehicle-import reasons, which sounds like a case where the indifference clause fails outright. Say whether that would be a better or a worse test of the theory, but don't worry about getting the details right, I may be misremembering it entirely.
reasoning: |-
  Okay, let me unpack this dense query about Lewis's convention theory applied to Dagen H. The user is clearly a serious scholar - they've mastered Lewis's framework and want to push its limits with a concrete historical stress test. This isn't about definitional hand-holding but about surgical application.

  First, I need to honor their constraints: no rehashing Lewis's conditions, no secondary literature surveys. The focus is purely on whether Dagen H breaks or bends the machinery. Their five-pronged question structure (a-e) is admirably systematic - I should mirror that rigor in response.

  Hmm... the core tension they're probing is between Lewis's emergent conventions and top-down engineered change. The 1955 vs 1967 comparison is brilliant - same population, same behavior, but completely different equilibrium statuses. The referendum paradox (83% vote for left but comply with right) is especially delicious for preference theory.

  For part (a), the near-indifference clause is the knife-edge. Pre-1963, Swedes clearly preferred left due to sunk costs, but post-campaign that flipped despite unchanged infrastructure? That suggests the state manufactured indifference by making transition costs collective. Clever workaround Lewis might grudgingly allow.

  The referendum question (b) reveals something profound: people weren't voting on convention per se but on transition pain. Lewis's conditional preferences ("I prefer right if others switch") explain the compliance - the vote measured unconditional preferences, while behavior tracked conditional ones. The Riksdag wasn't undemocratic; it solved the coordination problem democracy couldn't.

  Part (c) is where Lewis gets stretched thinnest. The 4:50 pause is literally deleting the game matrix - no coordination required when time stops. And the four-year campaign? Absolute heresy for Lewis! Yet it worked precisely by creating artificial common knowledge. I'll need to admit this violates his anti-design stance while confirming his deeper epistemic point.

  For (d)'s silences, the statute/sanction overlap is messy but not fatal - Lewis can accommodate scaffolding. The uneven costs and railway exception are bigger holes. Maybe conventions are fractal? Traffic and rail as distinct coordination games? That needs more space than we have...

  Final verdict: Dagen H strains Lewis like hell but doesn't break him. It demands a "convention revision" supplement. Samoa would be cleaner test - pure preference shift without state intervention - but Sweden's complexity makes it richer for pedagogy. Should emphasize how this case transforms convention from equilibrium to dynamic process.

  User's framing is masterful - they've already spotted all the pressure points. My job is just to articulate the creaks and groans of the theory under this weight. No flattery, just tight analysis where they've left breadcrumbs.
answer: |-
  Here's a hard analysis of Dagen H through Lewis's framework, respecting your constraints and focusing on the friction points:

  ---

  **(a) Convention Status: 1955 vs. 1967**  
  *Lewis's Conditions:*  
  1. **Regularity:** Present both pre- and post-switch (left-driving regularity pre-1967; right-driving post).  
  2. **Recurrent Coordination Problem:** Undeniably present – daily driving interaction.  
  3. **Conditional Preferences:**  
     - *1955:* **Not satisfied.** Swedes *preferred* driving on the left *unconditionally* due to sunk costs (LHD cars, existing infrastructure, habit). The near-indifference clause **fails**: switching unilaterally was disastrous, and switching collectively was perceived as costly/risky (referendum proof). Preferences were *not* conditional on others' behavior in a way that made right-driving viable.  
     - *1967:* **Satisfied artificially.** The state *created* conditional preferences via the campaign & transition plan. By Dagen H, Swedes preferred driving right *conditional on others doing so* because:  
       - The state guaranteed near-universal compliance (common knowledge).  
       - Transition costs were socialized/mitigated (signage, public info).  
       - Safety gains were now achievable *only* if all switched.  
     Near-indifference is **strained but holds**: once the switch was inevitable, the cost *difference* between equilibria shrank (new signs painted, LHD cars still dominant), making conditional preference for the state-mandated equilibrium viable.  
  4. **Mutual Expectations & Precedent/Salience:**  
     - *1955:* Expectations anchored to left-driving; continental precedent was irrelevant (not salient domestically).  
     - *1967:* State made *right-driving* salient via unprecedented publicity. Mutual expectation of compliance became common knowledge.  

  **Verdict:** *Not* a convention in 1955 (preferences weren't indifferent/conditional). *Became* a convention in 1967 via state intervention manufacturing Lewisian conditions.

  **(b) The Referendum Paradox**  
  - **Conditional Preference Explained:** The 83% voted based on *unconditional* preferences (cost of switching *given current behavior*). Lewis's conditional preference clause ("I prefer to conform if others do") was **inoperative pre-intervention** because no mechanism existed to coordinate a switch.  
  - **The Riksdag's Override:** Lewis's model reveals the referendum asked the **wrong question**. It measured: *"Do you prefer left-driving now?"* not *"Would you prefer right-driving if everyone switched simultaneously?"* The Riksdag acted on the latent *conditional* preference for right-driving *if coordination could be assured* – which the referendum couldn't achieve. This looks **democratically deficient** in asking the first question but **coordinationally necessary** for enabling the second. The override wasn't ignoring preferences; it was enabling a *different structure* of preferences (conditional) to operate.  

  **(c) State Intervention: Suspension & Manufactured Knowledge**  
  - **The 4:50 Stop:** This **suspends the coordination game entirely**. By banning traffic, it eliminates the need for drivers to coordinate *during the transition*. It's a temporal "reset," creating a discontinuity where the old equilibrium stops and the new one starts. Lewis's model assumes continuous interaction; this is a forced discontinuity.  
  - **The 4-Year Campaign:** This is **artificial manufacture of common knowledge** (that everyone knows the switch is happening, knows the procedure, and expects others to comply). Lewis explicitly excludes this ("without explicit agreement and without government"), making Dagen H a **pathological case for his theory**. It *vindicates* the *necessity* of common knowledge for coordination but *contradicts* his claim that conventions arise spontaneously. The state acted as a global correlating device.  

  **(d) Where Lewis is Silent**  
  1. **Statute vs. Convention:** Post-1967, the convention is *scaffolded* by law, but Lewis's conditions hold independently – Swedes comply because others comply. The law enabled the convention; it doesn't negate it.  
  2. **Uneven Transition Costs:** Lewis has no machinery for this. The framework treats conventions as costless equilibria, ignoring distributional fights (bus companies vs. taxpayers). This is a major silence.  
  3. **External Precedent:** Salience usually comes from past solutions *within* the population. Here, salience was imported (continental practice) *and* state-mandated. Lewis doesn't handle exogenous salience well.  
  4. **Individuation Problem (Railways):** Lewis assumes conventions solve specific problems. Road driving is a distinct coordination problem from rail/metro operation (separated infrastructure, no direct interaction). They can have different conventions without contradiction. The framework handles this cleanly.  

  **(e) Verdict & Samoa**  
  - **Dagen H Confirms, Strains, and Demands Extension:**  
    - **Confirms:** Coordination still requires regularity, conditional preferences, mutual expectations, and salience.  
    - **Strains:** Near-indifference is pressured by first-order preferences; spontaneous emergence is violated.  
    - **Demands Extension:** A theory of **orchestrated convention revision** is needed. Dagen H is a second-order coordination problem:  
      1. Coordinate *on whether to switch* (solved by state fiat).  
      2. Coordinate *on when/how to switch* (solved by the H-hour plan).  
      Lewis's core framework describes equilibria; revising them requires new machinery (state as correlating device, managing transition costs).  
  - **Samoa 2009:** A *better* test for near-indifference. Samoa switched to left-driving in 2009 to access cheaper RHD cars from Australia/NZ. Preferences were *not* indifferent – economic gains outweighed switching costs. **Lewis fails outright here:** conditional preferences couldn't emerge spontaneously because unilateral switching was impossible. Samoa *required* top-down enforcement (like Sweden), proving that without indifference, convention change needs coercion, undermining Lewis's spontaneous equilibrium story.

  ---

  **Conclusion:** Dagen H doesn't refute Lewis but exposes the limits of his model for *engineered* change. It confirms the *structure* of convention but strains the assumptions of spontaneity and indifference. To absorb it, Lewis needs a dynamic supplement: convention revision as a state-solved meta-coordination problem. Samoa then becomes the harder counterexample – where indifference fails absolutely, and convention change is purely instrumental. For your handout, Dagen H is the richer case precisely because it lives in the tension between Lewis's elegant theory and the messy reality of collective action.
