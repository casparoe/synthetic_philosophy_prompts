  ## Tea Leaves at the Speed of Dark

  The teacup was warm in my hands, the porcelain smooth as river stone. Outside the kitchen window, the last of the afternoon sun gilded the edges of Mrs. Henderson’s prize hydrangeas, turning their blues into something almost purple. The kettle whistled – a thin, insistent sound that cut through the quiet – just as the doorbell rang. Funny how that always seems to happen. "Coming!" I called, setting the cup down carefully on the counter. Steam was already rising from it, curling into the cool air.

  I moved through the hall, my hand finding the latch by touch and memory as much as sight. The man on the step was unfamiliar, tall and thin as a reed, wearing a dark jacket that looked too heavy for the mild evening. He held out a set of keys. "Forgot these," he said, his voice slightly breathless. "Left them on the mantel after fixing the boiler." His hand opened. The keys arced towards the hydrangea border. My own hand shot out, closing around cold metal just as the first key brushed a blue petal. He blinked. "Good catch."

  "Practice," I said, dropping the keys into his palm. He smiled, a quick flash of teeth, and was gone down the path. I watched his dark shape merge with the shadows under the oak tree at the gate, then turned back inside. The steam from my tea was still rising, lazy spirals in the quiet kitchen. Four hundred milliseconds. Enough time for a kettle to start screaming, or a man to drop his keys. Enough time for the world to happen, and for me to be told about it later.

  I finished my tea, the warmth spreading down to my fingertips. The light was fading faster now, leaching the colour out of the garden. Time to go. The supermarket car park wouldn't be busy this time on a Tuesday, but the earlier the better. I pulled on my own jacket, the familiar weight settling on my shoulders, the small camera lens a cool spot against my collarbone. Grabbed my bag. Keys found the lock. Door closed with a solid thunk.

  The air outside was soft, carrying the damp-earth smell of approaching evening. Streetlights flickered on, one after another, painting long, distorted shadows across the pavement. I walked briskly, the rhythm steady. A cyclist whirred past, a blur of neon lycra and spinning spokes that resolved into a man hunched over handlebars only after he was already ten feet ahead. I stepped onto the kerb, paused. A car approached, its headlights twin moons blooming on the wet tarmac. I saw the gap open between it and the van parked further down, judged the space, and crossed. The car’s tyres hissed on the damp road behind me as I reached the other side.

  The supermarket car park sprawled under the bruised sky, a grid of painted lines and huddled metal shapes. Only a third full. Fluorescent lights buzzed overhead, casting hard, unforgiving rectangles of light onto the asphalt, leaving deep pools of shadow between. My car, the little silver hatchback, was parked near the far end, under one of the taller lamps. I walked towards it, heels clicking a steady beat. Ahead, near the exit lane, a white delivery van was parked nose-in, its back doors slightly ajar. A figure – a man in a grey hoodie – was walking away from it, towards the footpath that led around the side of the supermarket building. He walked with a slight limp, favouring his right leg.

  I fished my car keys from my bag, the familiar cluster of metal and plastic. The chunky blue fob. The worn leather tag. I pressed the unlock button. The car chirped, its lights flashing yellow-white-yellow in quick succession. Over by the van, the man in the hoodie stopped. He turned. He seemed to be looking back at the van’s rear doors, still hanging open.

  Then it happened.

  The white van’s reverse lights snapped on. Two bright, hard white eyes glaring suddenly in the gloom. Stark. Unmistakable. Illuminating the wet asphalt directly behind it, throwing the man in the grey hoodie into sharp silhouette. He was standing right in that illuminated patch. He must have seen the lights too. He flinched. He took a hurried step backwards, directly into the path of the reversing van.

  There was a sound. A soft, wet thud, like a sack of grain dropping onto concrete. Muffled. Horribly final. The man crumpled. He seemed to fold in on himself, collapsing sideways onto the dark, oil-stained ground, one arm flung out awkwardly. His legs tangled. He didn’t move.

  The van stopped reversing instantly. Its engine noise, a low diesel grumble I only now registered, cut off. The driver’s door flew open. A bulky man in a dark blue uniform shirt scrambled out, his face pale and slack with shock under the harsh lights. "Oh god! Oh god, I didn't see him! Where did he come from?" He ran towards the fallen figure, skidding slightly on the damp surface.

  I was already moving. Walking quickly, then jogging, my bag bumping against my hip. The keys were still clutched in my hand. The scene solidified as I approached: the van, stationary now, its reverse lights still glaring whitely onto the scene; the driver kneeling beside the prone man, hands fluttering uselessly; the man on the ground, face turned away, grey hood bunched around his neck, one leg bent at an unnatural angle. He was breathing, shallow, ragged gasps that misted the cold air.

  "Call an ambulance," I said. My voice sounded calm. Too calm. Like it belonged to someone else. "Now."

  The driver fumbled for his phone, his hands shaking violently. "I didn't see him! He just... stepped back!"

  I knelt on the other side of the fallen man. His eyes were half-open, unfocused. Blood, dark and slick, was welling from a gash on his temple, matting his grey hair. "It’s alright," I murmured, though it clearly wasn't. "Help is coming." I didn’t touch him. Didn’t know if I should. The smell of diesel oil and something coppery hung in the air.

  Sirens wailed in the distance, growing rapidly louder. Flashing blue and red lights painted the car park walls, the underside of the van, the pale face of the driver, the still form on the ground. It felt like hours, but it was probably minutes. Paramedics arrived, efficient and focused. Police officers, their radios crackling. Statements taken, right there under the buzzing lights. I told them what I saw. Clear. Concise. Calm. The van parked. The man walking away. The reverse lights came on. Bright white. He saw them. He stepped back. Right into the path. The thud. Him falling.

  The driver, his voice thick with tears, kept saying he hadn’t seen anyone. He’d checked his mirrors. He’d looked. He was just backing up a few feet to straighten out.

  The officer taking my statement – a woman with kind eyes and a tired face – nodded. "You saw the reverse lights come on before he stepped back?"

  "Yes," I said. "Clearly. He reacted to them. Stepped back directly into the van's path." It felt solid. Real. The sequence etched in light and movement. White lights flash. Man flinches. Steps back. Impact. Fall.

  She wrote it down. "Thank you. We might need you to come in for a formal statement later."

  I gave her my details. Watched them load the man – Mr. Aris, someone said his name was – into the ambulance. The flashing lights pulled away, leaving the car park feeling strangely hollow, the white glare of the van's reverse lights still burning against the dark.

  Three weeks later, the room smelled of old paper and dust, faintly of lemon polish. A conference room in a solicitor’s office, all muted greys and a too-large table. Mr. Aris’s solicitor, a man with sharp features and sharper eyes, sat opposite me. My solicitor, a reassuringly solid woman named Janet, sat beside me. Mr. Aris himself wasn't there. He was still in hospital, they said. Head injury. Broken leg.

  The sharp solicitor slid a laptop across the polished table towards me. “Ms. Carter, we’d like you to look at this footage. It’s from the supermarket security camera. The timestamp is synchronised with the store clock, accurate to a tenth of a second.”

  He pressed play.

  A grainy, grey-scale image filled the screen. Top-down view. My silver car parked under its light. The white van near the exit. The figure in the grey hoodie walking away from the van, towards the footpath. Limping slightly. He reached the edge of the frame, almost off-camera. Stopped. Turned. He was looking back towards the van. He stood there for a second, maybe two.

  Then, he crumpled.

  He simply folded at the knees and dropped sideways onto the ground, like a puppet with its strings cut. His legs tangled beneath him. He lay still.

  Only then, a full second *after* he was already motionless on the ground, did the van’s reverse lights snap on. Two bright white circles flaring into life on the screen, stark against the grey asphalt, illuminating the unmoving body already lying within their pool of light.

  The driver’s door opened. The bulky man scrambled out, ran around the back, stopped dead at the sight of the man on the ground, his hands flying to his head. A few seconds later, I walked into the frame, approaching steadily, then breaking into a jog.

  The sharp solicitor paused the video. The image froze: the man on the ground, the van’s reverse lights glaring whitely over him, the driver frozen in shock, me caught mid-stride. The timestamp in the corner read 18:07:23.4 when he fell. 18:07:24.5 when the lights came on.

  “Ms. Carter,” the solicitor said, his voice carefully neutral. “Your statement, given inside the hour of the incident, stated categorically that the reverse lights came on *before* Mr. Aris stepped back and was struck. This footage shows Mr. Aris collapsing to the ground a full 1.1 seconds *before* the reverse lights activated. Can you explain the discrepancy?”

  The air in the room thickened. Dust motes hung suspended in the light from the window. Janet shifted slightly beside me, a rustle of fabric. The frozen image on the screen burned into my vision. The fallen man. The lights blazing *over* him. Not illuminating his fall, but his stillness.

  My stomach clenched. A cold wave washed up from my feet, through my spine, settling like ice behind my eyes. I heard my own voice, calm and certain in the buzzing car park: *The reverse lights came on. Bright white. He saw them. He stepped back.*

  But the screen showed stillness. Then light.

  I looked down at my hands resting on the cool tabletop. The lines on my knuckles. The faint scar on my thumb from a childhood fall. They were my hands. They had caught keys. They had poured tea. They felt real. The memory felt real. The sequence – lights, flinch, step, thud – felt as solid and undeniable as the table beneath my palms.

  The solicitor waited. Janet touched my arm lightly, a silent question.

  My gaze drifted past the frozen laptop screen, past the solicitor’s expectant face, to the window. Outside, rain had started to fall. Not heavy, just a fine, persistent drizzle. It beaded on the glass, distorting the view of the street below. A car drove past, its headlights catching the falling rain, turning each drop into a brief, streaking comet of light against the darkening grey. They fell, these tiny streaks, tracing paths down the glass, each one a perfect, fleeting line from top to bottom.

  But the light from the headlights – the light that *made* them visible, that gave them their brief, brilliant existence – hit the glass *after* the raindrops had already begun their descent. The light illuminated the path the water had *already taken*, not the moment it started falling. It showed you the journey, bright and clear, but the beginning… the true moment of release… that was already gone, existing only in the cold, dark smear left behind on the glass after the light moved on.

  I stared at the streaks of light on the wet window. My throat was dry. The ice behind my eyes spread.

  *(End: Approx. 2,400 words)*

  ---
  **Analysis:**

  1.  **Build Endorsed:** The story structurally and experientially leans towards **Build B** (raw buffer release, downstream composition/patched memory).
  2.  **Commitment Sentence:** *"The light illuminated the path the water had already taken, not the moment it started falling."* This image mirrors Build B: her conscious experience (the bright streak) is a composition (light hitting the water path) that occurs *after* the actual event (the raindrop falling), making the origin of the perception (the drop's release) inaccessible. Her initial car park account is a faithful report of that *constructed* perception, not an edited original. The mismatch stems from the machinery composing the experience *after* having the full data, not delivering a complete, potentially accurate "sentence" that was later altered. The raindrop image embodies the downstream composition and the inherent loss of the "true beginning" moment.
