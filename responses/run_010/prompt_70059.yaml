prompt: |-
  We run an internal forecasting thing at work — a couple hundred people submit probability estimates on stuff like whether a supplier ships on time, whether a product hits its launch date, whether a regulatory filing gets cleared. The pitch was that the aggregrate would beat any single manager's guess. Most of the time it does. But twice now it's been confidently, spectacularly wrong, and both post-mortems came back with basically the same story: everyone had been reading the same two industry newsletters, and people could see the running average before they locked in their own number.

  Before I go redesign the thing, I want to know what I should even be asking of a theory in this area. So: write out the desiderata — what any adequate account of when aggregated crowd judgment is reliable, and when it degrades into herding, actually has to deliver. The phenomena it must explain, the cases it must get right, the distinctions it's not allowed to collapse, the formal results it has to stay consistent with, and what would count as evidence for or against it. Give me the motivating case or concrete scenario behind each requirement, not just the requirement in the abstract.

  Then sort them: which are non-negotiable, and which are really just the taste of one camp. Like — do you have to insist every participant is a fully coherent Bayesian reasoning about everyone else's reasoning about everyone else, or can a bounded, heuristic-level account clear the same bar? Is "the theory must be able to tell you how to fix the institution" a desideratum or a category error?

  And I most want to know whether some subset of the list is jointly unsatisfiable. Specifically: does making each individual rational given what they can actually observe automatically rule out the aggregate tracking the truth? And can observational data of the kind we have — actions and numbers, not anyone's private information — ever distinguish a cascade from a crowd that just happened to be right together? If the list itself knocks candidates out before you even start comparing them, that's the result I'm after.

  Last thing, keep it short: a paragraph each on how the three families I know of fare against your list — the Bayesian cascade/herding models, the repeated-averaging network-learning models, and the "wisdom of crowds needs diversity, independence, decentralization and a decent aggregation rule" checklist view. The criteria are the deliverable though; the scorecard is just so I know what I'm choosing between.
reasoning: |-
  We are designing desiderata for a theory of when aggregated crowd judgment is reliable vs. when it degrades into herding. The theory must explain real-world phenomena, such as the two failures described: everyone relying on the same newsletters and seeing the running average, leading to spectacularly wrong aggregate forecasts.

  ### Desiderata for an Adequate Theory

  1. **Explain Failures of Aggregation under Shared Information and Public Aggregates**:  
     *Phenomenon to explain*: The two cases where the aggregate was confidently wrong because everyone read the same newsletters and saw the running average.  
     *Requirement*: The theory must predict when shared information sources and public aggregation (before individual submissions) lead to herding and collective error. It must not collapse the distinction between independent and dependent information sources.

  2. **Account for the Wisdom of Crowds under Independence and Diversity**:  
     *Phenomenon to explain*: The usual success of the aggregate beating individual managers.  
     *Requirement*: The theory must explain conditions under which aggregation works: independence of information, diversity of opinions, and proper aggregation rules. It must not collapse the distinction between independent judgments and correlated ones.

  3. **Distinguish Between Rational Herding and Irrational Copying**:  
     *Phenomenon to explain*: In the post-mortem, individuals were rationally updating based on the public average (which reflected the shared newsletters) but this led to error.  
     *Requirement*: The theory must allow for the possibility that individuals are Bayesian rational (given what they observe) and yet the aggregate fails. It must not assume that rationality at the individual level guarantees truth-tracking at the aggregate level.

  4. **Handle Observational Data Limitations**:  
     *Phenomenon to explain*: We only observe the submitted probabilities and the outcome, not the private information (if any) of the forecasters.  
     *Requirement*: The theory must provide testable implications that can be verified with data on forecasts and outcomes. It must allow us to distinguish, from observable data, between a cascade (where people ignore their private signals) and a genuinely informed crowd.

  5. **Prescribe Institutional Fixes**:  
     *Phenomenon to explain*: The goal is to redesign the forecasting system to avoid future failures.  
     *Requirement*: The theory must not only diagnose but also suggest interventions (e.g., withholding the running average, encouraging diverse information sources). This is a non-negotiable requirement because the purpose is practical.

  6. **Consistency with Formal Results**:  
     *Requirement*: The theory must be consistent with known formal results, such as:  
     - The Condorcet Jury Theorem (independence and competence lead to accuracy).  
     - Herding models (e.g., Bikhchandani, Hirshleifer, Welch: Bayesian agents can herd on the wrong action).  
     - The wisdom of crowds (Surowiecki: independence, diversity, decentralization, aggregation).  
     - The limitations of averaging under correlated errors (e.g., the crowd error equals average individual error minus diversity plus correlation terms).

  7. **Explain Both Successes and Failures with the Same Mechanism**:  
     *Requirement*: The theory must use the same core principles to explain both when aggregation works and when it fails. It cannot treat successes and failures as entirely disjoint phenomena.

  ### Sorting: Non-Negotiables vs. Tastes

  - **Non-negotiables**:  
    - Must explain the specific failure mode (shared info and public aggregation leading to herding).  
    - Must account for usual success (under independence and diversity).  
    - Must prescribe institutional fixes (because the goal is redesign).  
    - Must be consistent with key formal results (e.g., herding models and wisdom of crowds).  
    - Must provide observable implications (since we can't see private signals).  

  - **Tastes (camps may differ)**:  
    - Whether individuals must be modeled as fully coherent Bayesians: A bounded-rationality account might suffice if it captures the phenomena.  
    - The level of detail in modeling social networks: Some theories focus on pairwise interactions, others on global averages.  

  ### Joint Satisfiability

  - **Question**: Does making each individual rational given their observations rule out the aggregate tracking the truth?  
    *Answer*: No. Rational individuals can lead to a truth-tracking aggregate (e.g., Condorcet) or to failure (herding). The key is the information structure: if private signals are independent and informative, aggregation works; if public signals dominate and are wrong, herding occurs.

  - **Question**: Can observational data (forecasts and outcomes) distinguish a cascade from a genuinely informed crowd?  
    *Answer*: Partially. In a cascade, forecasts become very similar and do not react to new private signals (if any). Observing low variance in forecasts and high confidence in a wrong outcome suggests herding. Also, if after a public signal, new submissions ignore their own signals, that's indicative. But without private signals, it's indirect evidence.

  ### How the Three Families Fare

  1. **Bayesian Cascade/Herding Models**:  
     - *Strengths*: Explain how rational individuals, observing others' actions, can herd on the wrong outcome. They directly address the failure case (shared public signal = newsletters and running average).  
     - *Weaknesses*: May not prescribe practical fixes (beyond "don't reveal others' forecasts"). Also, assume full rationality and common knowledge, which might be unrealistic.

  2. **Repeated-Averaging Network-Learning Models**:  
     - *Strengths*: Model how opinions evolve through social networks. Can show that too much connectivity reduces diversity and leads to consensus without accuracy.  
     - *Weaknesses*: Less focused on the initial aggregation of independent judgments. May not directly handle the case of a pre-submission running average.

  3. **Wisdom of Crowds Checklist (Surowiecki-style)**:  
     - *Strengths*: Clear practical prescriptions: ensure independence, diversity, decentralization, and use a good aggregation rule (e.g., median). Directly addresses the redesign need.  
     - *Weaknesses*: Less formal on why failures occur; the checklist is descriptive. May not deeply model the Bayesian herding mechanism.

  ### Conclusion on Candidates

  The Bayesian herding models and the wisdom of crowds checklist are complementary. The checklist provides the redesign prescriptions (non-negotiable), while the herding models explain the failure mechanism. The network models add nuance on how information spreads but might be less critical for your immediate redesign.

  **Redesign Implication**: To fix the system, you likely need to:  
  - Hide the running average until after submissions.  
  - Encourage forecasters to seek diverse information sources.  
  - Use a robust aggregation rule (e.g., median).  
  - Possibly segment forecasters to maintain independence.
answer: |-
  ### Desiderata for a Theory of Aggregated Judgment
  The theory must explain real-world phenomena, prescribe fixes, and align with formal results. Below, key desiderata are grounded in concrete cases, with non-negotiables (NN) and negotiables (N) noted. The core challenge: **individual rationality can undermine aggregate truth-tracking when information sources are shared or public signals dominate**.

  1. **Explain Failures from Shared Information and Public Aggregation** (NN)  
     *Motivating Case*: Your team’s spectacular errors occurred because everyone read the same newsletters and saw the running average. The theory must explain why shared information sources (e.g., industry newsletters) and public pre-aggregation (e.g., visible averages) cause *herding*: individuals overweight public signals and underweight private insights, leading to correlated errors. It must *not* collapse the distinction between independent and dependent information environments.

  2. **Account for Standard Successes of Aggregation** (NN)  
     *Motivating Case*: The aggregate usually beats individual managers. The theory must explain when aggregation works (e.g., when forecasters use diverse data, private signals dominate, and no public aggregation exists). It must align with the *wisdom of crowds* (WoC) literature: independence and diversity reduce error.

  3. **Distinguish Rational Herding from Genuine Consensus** (NN)  
     *Motivating Case*: Observational data (submitted probabilities, outcomes) cannot directly reveal private information. The theory must provide testable markers to differentiate a *cascade* (rational herding where public signals swamp private ones) from a *correct consensus* (all received strong private signals). For example, low forecast variance + high confidence + wrong outcome suggests herding.

  4. **Prescribe Institutional Fixes** (NN)  
     *Motivating Case*: Your goal is to redesign the forecasting system. The theory must generate actionable interventions (e.g., hiding running averages, incentivizing diverse information sourcing). This is non-negotiable—a purely diagnostic theory is inadequate for applied contexts.

  5. **Consistency with Formal Results** (NN)  
     The theory must reconcile:  
     - *Condorcet Jury Theorem* (independence + competence → accuracy).  
     - *Herding models* (Bayesian agents can herd on wrong outcomes).  
     - *Correlated error results* (aggregate error ≈ average error + correlation penalty).  
     Collapsing any of these undermines credibility.

  6. **Allow Bounded Rationality** (N)  
     *Motivating Case*: Must every forecaster be a hyper-rational Bayesian? No. A theory can use heuristics (e.g., anchoring on public signals) if it predicts herding and fixes it. Full rationality is a taste; explaining behavior and outcomes is essential.

  7. **Joint Satisfiability Tension**  
     - **Individual rationality vs. aggregate truth-tracking**: Satisfiable *only if private signals dominate*. Rational agents using *only* shared/public information (e.g., newsletters) will herd, and the aggregate fails. But rational agents with *diverse private signals* can track truth.  
     - **Observational distinguishability**: Herding vs. genuine consensus *can* be inferred indirectly (e.g., forecast volatility drops in cascades; post-event surveys can probe information sources).  

  ### Scorecard of Theory Families
  - **Bayesian Herding Models** (e.g., Bikhchandani et al.):  
    *Pros*: Directly explain your failure case (public signals cause rational herding). Consistent with formal herding results. *Cons*: Struggle with prescribing fixes beyond "hide public signals"; assume full rationality (may not fit real-world heuristics).  

  - **Repeated-Averaging/Network Models** (e.g., DeGroot):  
    *Pros*: Explain how social learning amplifies shared information (e.g., newsletters create correlation). Can model your running average as a network influence. *Cons*: Less focused on initial information diversity; fixes (e.g., network restructuring) are less practical than checklist interventions.  

  - **Wisdom of Crowds Checklist** (e.g., Surowiecki):  
    *Pros*: Best at prescribing fixes (enforce independence, hide aggregates, curate diversity). Explains your usual successes. *Cons*: Less rigorous on *why* herding occurs; may miss rational underpinnings (e.g., agents Bayesian-updating on public signals).  

  ### Conclusion  
  Your failure case reveals a **non-negotiable tension**: individual rationality + shared information → herding risk. The checklist view offers the clearest fixes (e.g., hide running averages, diversify info sources), while Bayesian models best diagnose the mechanism. **No family satisfies all desiderata alone**, but combining checklist prescriptions with Bayesian insights (e.g., agents rationally herd on public signals) is optimal. Observational data *can* hint at herding (e.g., via low forecast diversity), but post-mortems (probing information sources) remain crucial. Redesign by enforcing independence and decentralizing information access.
