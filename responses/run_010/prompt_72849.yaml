  First, I need to understand the core conflict: Side A (overflow) believes phenomenology exceeds access, using Sperling-style partial-report as evidence. Side B (global workspace) equates consciousness with global broadcast access, dismissing unreportable experiences as non-phenomenal. The key novelty is the "prepared vs surprise probe" pilot data showing above-chance surprise performance without confidence or claimed experience.

  The user wants four specific elements: agreed claims without fluff, a fair disagreements table, real cruxes with tests, and concrete predictions. They're clearly frustrated with academic gridlock and want something actionable for readers.

  Hmm, the challenge is balancing rigor with readability. The column targets smart non-specialists, so jargon must be minimized. The prepared/surprise paradigm is perfect because it cuts through old debates. That 70% "no experience" report in surprise trials is dynamite - it forces both sides to engage.

  For the agreements section, I'll focus on indisputables: what masks do (disrupt lingering activity), partial-report limits (proves decay isn't purely perceptual), and the pilot's raw data patterns. No weasel words - if they don't both sign it, it doesn't belong.

  The disagreements table needs neutral framing. For example: Side A's column should reflect their "rich trace" view without caricature, while Side B gets their "local processing" phrasing. The "verbal vs substantive" column is crucial - maybe the "bridging principle" debate is actually terminological?

  Ah, the cruxes. The confidence/denial issue feels pivotal. Side A might argue no confidence implies no access but phenomenology remains, while Side B could counter that phenomenology without confidence is incoherent. The test? Maybe vary probe timing to see when confidence kicks in relative to accuracy.

  Predictions must be falsifiable. For Side B, if surprise accuracy stays high despite disrupting local processors (via TMS?), they'd have to concede non-broadcast phenomenology exists. That'd embarrass them! Side A's risk: if "no experience" reports correlate perfectly with chance performance, overflow claims weaken.

  ...Wait, is the whole overflow/access split verbal? Probably not - but operationalizing "phenomenology" independently of report is the real beast. The surprise paradigm's experience probe might be key, though Side B will distrust subjective reports.

  Final output structure: agreements first (clean numbered list), then table (side-by-side positions), then cruxes with predictions. Tone must sound like wary collaborators, not enemies. 1,400 words means ruthless editing - every sentence must pull weight.
answer: |-
  ## Joint Statement on Prepared vs. Surprise Probe Findings: A Framework for Adversarial Collaboration

  **Preamble:** We, representatives of contrasting perspectives on consciousness (often termed the "Phenomenal Overflow" view and the "Global Workspace Theory" view), acknowledge deep theoretical disagreements. However, we concur that the novel "prepared-versus-surprise probe" paradigm and its pilot data provide a crucial, focused point of engagement, moving beyond reductive debates on classic paradigms like Sperling's partial report. This joint statement outlines areas of agreement, clarifies core disagreements without misrepresentation, identifies key experimental cruxes, and proposes decisive tests with pre-registered predictions. Our goal is to guide future research towards empirical resolution.

  **Section 1: Agreed Claims (Based on Established Science & Pilot Data)**

  We jointly affirm the following claims, grounded in empirical consensus and the presented pilot data:

  1.  **Partial-Report Superiority:** The Sperling paradigm and its descendants robustly demonstrate that subjects can report more items from a briefly displayed array when cued *after* offset than when asked to report the whole array without a cue. This establishes an upper bound on *reportable* information at any given moment.
  2.  **Limits of Partial-Report:** This paradigm *does not*, by itself, definitively establish the nature of the underlying representation supporting cued report. It demonstrates a capacity exceeding whole report but does not mandate that this excess capacity is identical in format or nature to the content of conscious experience accessible for report.
  3.  **Masking Function:** Pattern masks primarily disrupt the *stability* and *persistence* of sensory representations generated by a brief stimulus. They accelerate the decay or overwriting of initial sensory activity, effectively shortening the window for information processing and consolidation.
  4.  **The "Ignition" Signature:** Global Workspace Theory associates a specific neural signature (widespread, sustained, reverberating activity across fronto-parietal networks) with the transition of information into a globally available state ("ignition"). This signature is proposed as a neural correlate of conscious *access* (reportability, availability for reasoning/action).
  5.  **Pilot Data Description (Agreed Observations):**
      *   In the *prepared* condition, accuracy for the probed item is high (~78%) at short mask-to-probe intervals.
      *   In the *prepared* condition, subjective confidence tracks objective accuracy.
      *   In the *surprise* condition, accuracy for the probed item is significantly above chance (~61% vs. 50%), indicating retained information.
      *   In the *surprise* condition, subjective confidence is *flat* and does not track accuracy across trials or mask-to-probe intervals.
      *   In the *surprise* condition, on a substantial proportion of trials (~70%), subjects explicitly deny having had *any* visual experience whatsoever of the probed location.

  **Section 2: Disagreements Table**

  | Disagreement Focus                           | Side A (Phenomenal Overflow) Position                                                                                                 | Side B (Global Workspace) Position                                                                                                                                 | Substantive (S) / Verbal (V) |
  | :------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------ | :----------------------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------- |
  | **Nature of the Surprise-Condition Advantage** | The above-chance performance in the surprise condition reflects readout from a rich, decaying sensory trace containing phenomenal content that was not globally accessed/broadcast before being probed. | The above-chance performance reflects the output of specialized, local sensory processors operating on residual activation, *without* requiring or implying any associated phenomenal consciousness. | **S**                        |
  | **Interpretation of "No Experience" Reports** | The high rate of "no experience" reports in the surprise condition, especially combined with flat confidence, veridically reflects the *absence* of phenomenal consciousness for the probed item at the time of probe. | "No experience" reports indicate the *absence of access* (global availability), not necessarily the absence of phenomenology. Such reports are judgments *about* access made under uncertainty. | **S**                        |
  | **Relationship: Phenomenology & Access**     | Phenomenal consciousness (P-consciousness) is distinct from and can exceed access consciousness (A-consciousness). Information can be phenomenally conscious without being globally accessed/reportable. | Phenomenal consciousness *is* access consciousness. What it is like to have an experience *just is* for that information to be globally available. "P-consciousness without A-consciousness" is either non-existent or an incoherent description. | **S** (Core)                 |
  | **The "Bridging Principle"**                 | Reliable use of information (e.g., above-chance guessing) does *not* necessarily imply conscious access. It can reflect unconscious processing or fleeting phenomenal states never made globally available. | If information can be reliably *used* for a specific task (like a forced-choice response), it must have been accessed, at least transiently or locally, for that task. "Use implies access." | **S**                        |
  | **Meaning of "Local Processing"**            | Local sensory processing can sustain conscious experience (phenomenology) without global broadcast ("ignition").                      | Local sensory processing, while complex and informative, is fundamentally *pre-conscious*. Only global broadcast constitutes conscious experience.                | **S**                        |
  | **"Consciousness" Terminology**              | "Consciousness" inherently refers to subjective experience (phenomenology). Access/reportability is a consequence or correlate.       | "Consciousness" in a scientific context must refer to the functional property of global availability (access). Phenomenology as distinct from access is difficult or impossible to operationalize. | **V** (Terminological)       |

  **Section 3: Cruxes & Decisive Tests**

  The pilot data creates specific points of leverage. Resolving the following cruxes would significantly advance the debate. We outline concrete tests and pre-registered predictions for each.

  **Crux 1: Does the Surprise-Condition Advantage Reflect Residual Phenomenology or Solely Subliminal Processing?**
  *   **Core Question:** Is the above-chance performance in surprise trials accompanied by *any* form of conscious experience (even fleeting or non-reportable), or is it purely the product of unconscious mechanisms?
  *   **Sub-Questions:**
      *   Is the "no experience" report veridical for phenomenology?
      *   Can local processing sustain phenomenology?
  *   **Verbal/Substantive:** Primarily Substantive.
  *   **Decisive Test (TMS Disruption):** Apply focal Transcranial Magnetic Stimulation (TMS) to disrupt either (a) early visual cortex (V1/V2) or (b) a key node of the proposed global workspace network (e.g., dorsolateral prefrontal cortex) *during the mask-to-probe interval* in *surprise* trials. Vary timing precisely.
  *   **Side A (Overflow) Prediction:**
      *   Disruption of *early visual cortex (V1/V2)* during the critical decay period will *significantly reduce or eliminate* the surprise-condition advantage. (Embarrassing if wrong: Shows local activity isn't the basis of the putative residual phenomenology).
      *   Disruption of *fronto-parietal nodes* will have *minimal impact* on surprise accuracy, as global access wasn't occurring anyway.
  *   **Side B (GWT) Prediction:**
      *   Disruption of *early visual cortex (V1/V2)* will *significantly reduce or eliminate* the surprise-condition advantage, confirming it relies solely on local sensory processing.
      *   Disruption of *fronto-parietal nodes* will *not reduce* surprise accuracy (as no ignition was happening) but *might even increase "no experience" reports* by disrupting post-hoc access/judgment. (Embarrassing if wrong: Shows disruption of access network impacts performance thought to be purely local/pre-conscious).
  *   **Condition for Giving Ground:**
      *   **Side A:** Would significantly reassess if fronto-parietal TMS substantially *reduced* surprise accuracy, suggesting global access *was* involved.
      *   **Side B:** Would significantly reassess if V1/V2 TMS *failed* to reduce surprise accuracy, suggesting the information wasn't reliant on local visual activation as assumed.

  **Crux 2: Do "No Experience" Reports + Flat Confidence Reliably Track the Absence of Phenomenology?**
  *   **Core Question:** Can subjective reports of "no experience" combined with dissociated confidence be taken as direct evidence for the absence of phenomenal consciousness, or are they only evidence about the absence of access and/or metacognitive uncertainty?
  *   **Sub-Questions:** What is the relationship between phenomenology and metacognition (confidence)? Is phenomenology necessarily reportable?
  *   **Verbal/Substantive:** Substantive (though intertwined with definitions).
  *   **Decisive Test (Phenomenal Contrast & Manipulation):** Introduce trials where the probe stimulus is *radically altered* just before the mask (e.g., a letter briefly changes to a different letter/digit, or an object changes shape). Subjects are only ever probed on the *final* identity. Crucially, include surprise trials where this change occurs.
  *   **Side A (Overflow) Prediction:**
      *   On surprise trials *with* a change, subjects will show *above-chance accuracy* for the *final* identity *despite* high rates of "no experience" reports and flat confidence. Furthermore, they will *not* report *seeing* the change itself, supporting the idea of rich, unaccessed phenomenology for the final state that doesn't include the change event. (Embarrassing if wrong: Shows above-chance performance doesn't imply unreported phenomenology for the probed item).
  *   **Side B (GWT) Prediction:**
      *   On surprise trials *with* a change, accuracy for the *final* identity will be *at chance level*, reflecting the disruption and the absence of stable access. The "no experience" reports will correlate strongly with this chance performance. Any above-chance performance must correlate with reports of *some* experience or confidence. (Embarrassing if wrong: Shows reliable use without any reportable experience or confidence).
  *   **Condition for Giving Ground:**
      *   **Side A:** Would reassess if changed-items in surprise trials consistently yielded *no better than chance* performance, undermining the link between above-chance surprise performance and unreportable phenomenology.
      *   **Side B:** Would reassess if changed-items in surprise trials yielded *robust above-chance accuracy* for the final identity *alongside* high "no experience" reports and flat confidence, demonstrating reliable use without access or reportable phenomenology.

  **Crux 3: Is the Surprise Advantage "Weak Access" or Truly Non-Accessed?**
  *   **Core Question:** Does the ability to use the information for the specific surprise probe constitute a form of access (however transient or task-specific), invalidating the "overflow" claim, or is it genuinely information outside the global workspace?
  *   **Sub-Questions:** What is the minimal criterion for "access"? Does use imply access?
  *   **Verbal/Substantive:** Substantive (hinges on the "Bridging Principle").
  *   **Decisive Test (Dual-Task Interference):** Introduce a highly demanding concurrent central task during the entire trial sequence (including mask-to-probe interval). This task should maximally load central cognitive resources/global workspace.
  *   **Side A (Overflow) Prediction:**
      *   The demanding concurrent task will *abolish the prepared-condition advantage* (as it disrupts access/broadcast) but will have *little to no effect* on the *surprise-condition advantage*. This demonstrates the surprise advantage relies on a resource-independent, non-global representation. (Embarrassing if wrong: Shows central interference disrupts the surprise advantage, implying it required central resources/access).
  *   **Side B (GWT) Prediction:**
      *   The demanding concurrent task will *abolish both the prepared-condition advantage AND the surprise-condition advantage*. Any above-chance performance requires *some* degree of access, which is disrupted by central load. The surprise condition might show a *slightly smaller decrement* due to simpler processing, but both will fall towards chance. (Embarrassing if wrong: Shows surprise advantage persists under central load, implying it doesn't require access).
  *   **Condition for Giving Ground:**
      *   **Side A:** Would reassess if central load *significantly reduced* the surprise advantage, suggesting it requires central resources.
      *   **Side B:** Would reassess if central load *eliminated the prepared advantage but left the surprise advantage largely intact*, demonstrating genuinely non-global information utilization.

  **Conclusion:** This joint statement reflects our commitment to moving beyond theoretical stalemate. The prepared-versus-surprise probe paradigm, particularly with the extensions proposed here, offers a concrete path to falsifying core predictions of both views. We encourage rigorous testing of these cruxes and pledge to interpret the results in light of the predictions stated above. Resolving these issues will significantly advance our understanding of the relationship between conscious experience, access, and reportability.
