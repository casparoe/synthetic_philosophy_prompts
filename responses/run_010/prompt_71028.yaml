  | Q           | Correct under restriction          | Restriction: Iterative removal of strictly dominated strategies only. Weak dominance leads to order-dependence.<br>**Game for order-dependence (weak dominance)**:<br>Player 1: U, D; Player 2: L, R.<br>Payoffs (Player 1): U: (1, 0), D: (0, 1), E: (0, 0).<br>Payoffs (Player 2): L: (1, 0, 0), R: (0, 1, 0).<br>Remove E first (weakly dominated by U or D), outcome is {U, D}. Order matters if removing U/D first (not possible). |

