  ### Analysis of "A Dominated Strategy Should Never Be Played"

  The sentence "a dominated strategy should never be played" is ambiguous and has been used in three distinct ways in your reading group. Below, I dissect the possible interpretations, evaluate them, and address your specific episodes. I clarify the confusions, provide a menu of propositions, and answer your queries systematically.

  ---

  #### (a) Distinct Precise Propositions
  The sentence can carry different meanings based on the type of dominance, the dominating entity (pure or mixed strategy), and the scope of opponents' strategies. Here are the key propositions, ordered from weakest/most general to strongest/most restrictive:

  1. **Weak Dominance by a Pure Strategy (P3)**:  
     A pure strategy \(s_i\) is weakly dominated by another pure strategy \(t_i\) if, for every possible combination of opponents' strategies, \(t_i\) yields a payoff at least as good as \(s_i\), and strictly better for at least one combination. The sentence asserts \(s_i\) should never be played.

  2. **Weak Dominance by a Mixed Strategy (P4)**:  
     A pure strategy \(s_i\) is weakly dominated by a mixed strategy \(\sigma_i\) (over player \(i\)'s other pure strategies) if, for every combination of opponents' strategies, the expected payoff of \(\sigma_i\) is at least as good as \(s_i\)'s payoff, and strictly better for at least one combination. The sentence asserts \(s_i\) should never be played.

  3. **Strict Dominance by a Pure Strategy (P1)**:  
     A pure strategy \(s_i\) is strictly dominated by another pure strategy \(t_i\) if, for every possible combination of opponents' strategies, \(t_i\) yields a strictly better payoff than \(s_i\). The sentence asserts \(s_i\) should never be played.

  4. **Strict Dominance by a Mixed Strategy (P2)**:  
     A pure strategy \(s_i\) is strictly dominated by a mixed strategy \(\sigma_i\) if, for every combination of opponents' strategies, the expected payoff of \(\sigma_i\) is strictly better than \(s_i\)'s payoff. The sentence asserts \(s_i\) should never be played.

  5. **Iterative Dominance in Reduced Game (Q)**:  
     A strategy \(s_i\) is dominated (strictly or weakly, by pure or mixed) in the current reduced game (i.e., after removing other dominated strategies). The sentence asserts \(s_i\) should be removed in iterative procedures, and "never played" implies iterative removal.

  ---

  #### (b) Parameters Fixed for Each Proposition
  For each proposition, I fix the open parameters:
  - **Dominator**: What does the dominating (pure strategy or mixed strategy).
  - **"Beats"**: Meaning of dominance (strictly better or never worse and sometimes better).
  - **Opponents' Strategies**: Set of opponents' strategies considered (all possible, remaining after removals, or rationally chosen).
  - **Payoff Comparison**: Actual payoffs or expected payoffs.
  - **Number of Players**: Whether the proposition depends on the number of players.

  | Proposition | Dominator          | "Beats"                                           | Opponents' Strategies       | Payoff Comparison | Players | Notes                                                                 |
  |-------------|--------------------|---------------------------------------------------|-----------------------------|-------------------|---------|-----------------------------------------------------------------------|
  | P1          | Pure strategy      | Strictly better in every case                     | All possible                | Actual            | Any     | Standard strict dominance.                                           |
  | P2          | Mixed strategy     | Strictly better in every case                     | All possible                | Expected          | Any     | Mixed strategies allowed.                                            |
  | P3          | Pure strategy      | Weakly better (never worse, strictly better in ≥1) | All possible                | Actual            | Any     | Weak dominance by pure strategy.                                     |
  | P4          | Mixed strategy     | Weakly better (never worse, strictly better in ≥1) | All possible                | Expected          | Any     | Mixed strategies allowed.                                            |
  | Q           | Pure or mixed      | Strictly or weakly better (as above)              | Current reduced game       | As above          | Any     | Context-dependent on iterative removal.                              |

  **Key**:
  - **"Beats"**: Strictly better = payoff strictly greater; weakly better = payoff at least as good and strictly greater in at least one case.
  - **Opponents' Strategies**: "All possible" considers the full game; "current reduced game" considers only strategies not yet removed.
  - **Payoff Comparison**: "Actual" for pure strategies; "expected" for mixed strategies.
  - **Players**: "Any" means the proposition holds for two or more players.

  ---

  #### (c) Verdict on Each Proposition
  I evaluate each proposition as:  
  - **Platitude**: True but vacuous or definitional.  
  - **Substantive and correct**: True with meaningful content.  
  - **Correct under restriction**: True only with additional constraints.  
  - **Incorrect**: False as a general principle.  

  For incorrect or restricted propositions, I provide the smallest game that demonstrates the issue, with full payoffs.

