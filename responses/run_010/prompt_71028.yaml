  #### (f) Common Shutdown Reading and Equilibrium Survival
  - **Most Common Shutdown Reading**: P3 (weak dominance by pure strategy). It is often used to quickly prune strategies without rigor, as it requires minimal verification and appears intuitive.  
  - **Readings that Survive Equilibrium Finding**:  
    - **Nash Equilibrium**: P1 and P2 (strict dominance) are always respected. No Nash equilibrium includes a strictly dominated strategy.  
    - **Refinements**: P3 and P4 survive only in refined equilibria (e.g., trembling-hand perfect or admissible equilibria).  
    - **Iterative Procedures**: Q with strict dominance survives and simplifies equilibrium finding. Weak dominance (P3/P4/Q) may eliminate Nash equilibria and is order-dependent.  

  **Why P3/P4 Fail in Ordinary Equilibrium Finding**:  
  - Weakly dominated strategies *can* be played in Nash equilibrium (e.g., Episode 3).  
  - Iterative removal of weak dominance can eliminate valid equilibria (e.g., in the P3/P4 game, removing T would eliminate the (T, L) equilibrium).  

