  - **P3/P4 Game**: In Nash equilibrium (B, R), Player 1 plays B, which is weakly dominated by T. This shows P3 is incorrect (B is played). P4 is correct if mixed strategies are allowed (B should not be played), but the equilibrium exists without them.
