prompt: |-
  can you write me a piece of satire for me? here's the setup.

  I want a customer-facing "Betting Rules & Settlement Terms" document, roughly 850–950 words, for a fictional betting exchange — call it Syndicate 9 if you like, or something better — that takes wagers on future contingent propositions. Sea battles tomorrow, mainly, but also elections, whether it'll rain, whether you'll raise your arm. Deadpan throughout: it should read like a real bookmaker's T&Cs, with a version number, an effective date, numbered clauses, a complaints procedure, an ombudsman sidebar, all the genre furniture. Nobody in the document knows they're funny.

  The jokes have to come from getting the metaphysics right, not from philosphers being silly about money. So: the firm states its house theory of future contingents in the preamble, and every clause after that has to follow from that theory without quietly abandoning it. If the house position can't actually be held consistently — I suspect it can't — the document should show that by the clauses drifting, not by anyone noticing. Someone who knows the literature should be able to put a finger on the exact clause where the house view gives out.

  things i'd like folded into the genre (don't list them like a syllabus, make them operational):

  - what the exchange does when a wager is struck on a proposition that had no truth value at the time it was struck, and whether settlement is retroactive once the branch it landed on becomes the present
  - a rebate for bets on propositions that are already true or already false, plus the resulting complaint that the house has converted fatalism into a pricing question
  - a premium 'designated future' service for customers who want their bet settled against one particular branch rather than any old one, and the fight over whether a designation can be revised after the fact
  - a bet on a disjunction — either the sea battle happens or it doesn't — sold at odds that look fair, on which the house somehow keeps the stake however things turn out, and a customer who works out why and writes in furious
  - a product settled on dispositions and would-bes rather than on events, with a desk note about how exactly one is supposed to observe a would-be
  - a clause barring wagers that would undercut the punter's own deliberating about the very thing being wagered on, and an opt-out form for people who object to it
  - one short quote from an in-house alethic risk officer, and one from a customer at the complaints desk

  Also give me a sidebar on the regulator, whatever body makes the exchange disclose its metaphysics to retail punters in plain English, and a short passage on rival houses: a Diodorean outfit, a supervaluationist mutual, an Ockhamist shop selling the designated-future product, a Peircean one. Their marketing slogans should do the arguing for them.

  The target is the theories plus the whole practice of settling a dispute by stipulating a settlement rule. Don't go after any real living person, and don't make the cheap point that metaphysics is useless — make it expensive. But stay legible: someone who's never heard of bivalence should still get that something is going badly wrong at the payouts desk.

  no citations or reading lists, just what's in your head already.

  format: the document first, with its own internal headings. then one section titled "Settlement disputes we anticipate", about 180 words, where you break character and tell me which position each clause is aimed at, where you think the house theory actually collapses, and whether any of the jokes are unfair to the view they're aimed at.
