prompt: |-
  I serve as counsel to the board of a regional transit-and-housing authority. Roughly twenty-five times a year a proposal reaches my desk that would bind future boards: a dedicated revenue stream locked to debt service for thirty years, a supermajority requirement for amending a program, a clause providing that some policy may not be repealed before a stated date, or an interlocal agreement in which we promise a neighboring jurisdiction that our successors will not disturb a land-use commitment. The members who propose these have generally read nothing about precommitment, and my job is to tell them in one page whether the constraint is worth adopting and, if so, in what form. I have about forty-five minutes per proposal and no outside counsel; a junior attorney on my team, who has no background in the theory, must be able to run the procedure from the proposal documents and a short interview with its sponsor. The board votes on the final language. Separately, our state legislature can override much of what we do, and I want the procedure to treat that as an input rather than an embarrassment.

  Please write that decision procedure. I want it grounded in what the precommitment literature actually establishes — Elster's Ulysses contracts and the surrounding argument about whether one legislature may bind the next, and about the objection that the dead should not govern the living — rather than in general good-governance intuition. Deliver an ordered list of questions, each with a statement of what counts as a sufficient answer; the points at which the procedure terminates in do-not-entrench or in entrench-only-in-this-weaker-form; the points at which it hands the decision back to the board because what remains is a question of values, or of how much the present owes its successors, rather than of fact; and a short menu of the weaker instruments to consider before endorsing a lock — sunset with affirmative renewal, a funding floor, a delay or supermajority speed bump, shaping preferences instead of constraining them, and anything else you think belongs.

  Several distinctions have to survive the simplification, and I want you to say explicitly which you kept, which you dropped, and why: whether the constraint binds the same decision-makers who adopted it or their successors; whether the threat being guarded against is foreseeable weakness of will, foreseeable change in what the board wants, or unforeseeable change in circumstances, since only the first is a threat that precommitment is well suited to answer; whether the clause is self-releasing or genuinely entrenched; and whether any enforcement mechanism exists that a future board cannot simply vote away. Above all, build in a question of this shape: what will the future board say when it wants out, and does the drafted language anticipate that particular argument? That is the feature of the Ulysses story practitioners reliably miss — he arranged in advance for his own later pleas to be ignored.

  Then run the procedure on three live proposals:

  1. Bond counsel proposes dedicating a half-cent sales tax increment to debt service on a light-rail extension for thirty years, amendable only by a two-thirds vote of the board plus a public referendum. The rating agencies have asked for it and the board expects routine approval.

  2. After a well-organized fare-free campaign, a member proposes entrenching zero fares on all local bus routes for ten years, repealable only by a two-thirds vote and a referendum, expressly on the ground that she expects a future board to reverse the policy under fiscal pressure. The board supports it seven to two and expects my memo to bless it.

  3. At the request of an adjacent suburb, we would covenant in an interlocal agreement not to approve dense housing or a maintenance facility on a forty-acre parcel we own along their border for twenty-five years. The current board is unanimous, foresees no downside, and wants the covenant as a bargaining chip.

  Give the recommendation and the reasoning for each, not merely the outcome, and let at least one come out against what the board wants.

  Finally, two paragraphs of self-criticism. Identify the two questions in the procedure on which a reasonable practitioner is most likely to reach the wrong answer, and say what would change your mind: which argument, if sound, would flip your recommendation on the second proposal, and which of my stated constraints — the forty-five minutes, the legislature's override power, the board's political exposure — you suspect is doing illegitimate work in shaping the procedure rather than merely limiting it. Then tell me what the procedure cannot do: the classes of proposal on which it offers no guidance or actively misleading guidance, and the point at which I should stop and seek outside judgment.
reasoning: |-
  Hmm, the user is counsel to a regional transit-and-housing authority board, dealing with proposals that bind future boards. They need a structured decision procedure grounded in precommitment theory from Elster's Ulysses contracts and related literature. The procedure must be executable by junior staff in 45 minutes per proposal and address key distinctions like binding successors vs. same decision-makers, threats of weakness of will vs. changed preferences, and enforcement mechanisms.

  The user wants an ordered list of questions with clear termination points, a menu of weaker alternatives to full entrenchment, and explicit acknowledgement of which theoretical distinctions are preserved or dropped. Additionally, they want the procedure applied to three real proposals with recommendations, including at least one rejection of board preference. Finally, they request self-criticism identifying vulnerable questions and limitations.

  I'll develop a decision tree that prioritizes theoretical robustness while remaining practical. Key distinctions to preserve include: whether the constraint binds successors (crucial for legitimacy concerns), the nature of the threat (only weakness of will justifies true precommitment), and enforceability against future boards. The distinction between self-releasing and genuinely entrenched clauses will be folded into the enforceability analysis to avoid overcomplication.

  The questions will follow this logical flow: First, establish legitimacy by asking who is bound and whether the threat is weakness of will. This is the core of Elster's theory - binding successors is problematic unless addressing predictable self-control failures. Then assess whether the constraint actually solves the problem without creating worse issues. Finally, consider escape mechanisms and weaker alternatives.

  For the three test cases: The light-rail bond proposal likely passes because it addresses verifiable weakness of will (fiscal diversion) with reasonable duration and market necessity. The fare-free entrenchment fails as it addresses changed preferences rather than weakness of will, plus it lacks an escape valve. The land covenant fails because it binds successors without addressing self-control issues, and attempts to govern external parties' interests.

  The self-criticism will highlight two vulnerable points: the "weakness of will" determination (where practitioners might misclassify preference changes) and the "escape valve" requirement (which may be too strict for some contexts). The procedure's limitations include partisan entrenchment attempts, emergencies, and moral arguments about intergenerational obligations - all requiring outside counsel.
answer: |-
  Here is a decision procedure grounded in precommitment theory (Elster, Holmes, Waldron), designed for practical application within your constraints. Key theoretical distinctions preserved:

  1.  **Binding Successors vs. Self:** Explicitly asked (Q1). Crucial for the "dead hand" objection.
  2.  **Nature of Threat:** Explicitly categorized (Q2). Only "Weakness of Will" justifies true precommitment per Elster.
  3.  **Enforceability:** Explicitly addressed (Q6). A constraint a future board can trivially ignore lacks bite.
  4.  **Anticipated Future Plea:** Explicitly required (Q7). Captures the core Ulysses insight.
  5.  **Self-Releasing vs. Entrenched:** *Dropped.* Simplified into Q6 (Enforceability) and Q8 (Escape Valves). The critical issue is whether the future board *can* override it easily when it needs to, not the specific label.

  **Decision Procedure: Evaluating Proposals to Bind Future Boards**

  1.  **Who is Bound?**
      *   *Question:* Does the constraint primarily bind the *current board's own future decisions* OR *a future, different board*?
      *   *Sufficient Answer:* Clearly identifies binding "successors" or a "future board."
      *   *Termination/Handoff:*
          *   If binding **current board's own future decisions**: Proceed to Q2. (Less problematic, akin to Ulysses binding *himself*).
          *   If binding **successors/a future board**: Flag significant "dead hand" concern (Waldron). Proceed to Q2, but stricter scrutiny applies from Q3 onward.
          *   *Handoff:* None. Factual determination.

  2.  **What Threat is Mitigated?**
      *   *Question:* What specific, undesirable future action is the constraint designed to prevent? Categorize the *threat*:
          *   **(A) Weakness of Will:** The *same* board (or its successors with similar values/priorities) would *want* to do the right thing later but fails due to foreseeable temptation/pressure (e.g., raiding a fund during a budget crisis).
          *   **(B) Changed Preferences:** A future board, with *different values or priorities*, will *want* to reverse the policy because they assess costs/benefits differently.
          *   **(C) Unforeseeable Change:** Circumstances change in ways that make the policy harmful or impossible to maintain, and reversal is rational.
      *   *Sufficient Answer:* Clear identification of the specific undesirable action and categorization (A, B, or C).
      *   *Termination:*
          *   If primarily **(B) Changed Preferences**: **Terminate - Do Not Entrench.** Precommitment is ill-suited to bind future majorities with different legitimate preferences (Holmes). This is policy entrenchment, not self-binding.
          *   If primarily **(C) Unforeseeable Change**: **Terminate - Do Not Entrench.** Inflexibility is dangerous. Precommitment assumes foreseeable threats. Use sunset clauses or regular review instead.
          *   If primarily **(A) Weakness of Will**: Proceed to Q3. (Core justification).

  3.  **Is Weakness of Will Plausible & Specific?**
      *   *Question:* Is the risk of the board succumbing to the specific temptation/pressure (identified in Q2A) *foreseeable, documented, and inherent to the situation*? (e.g., historical diversion of funds, well-known political pressure cycles).
      *   *Sufficient Answer:* Concrete evidence (past behavior, economic studies, political science) showing the *specific* weakness is predictable and structural, not just a vague fear.
      *   *Termination/Handoff:*
          *   **No:** **Terminate - Do Not Entrench** (or recommend a much weaker instrument - see Menu). Lacks justification.
          *   **Yes:** Proceed to Q4.

  4.  **Does the Constraint Effectively Counter the Specific Weakness?**
      *   *Question:* Does the *specific mechanism* (dedication, supermajority, referendum, covenant) directly block the *specific pathway* to the undesirable action caused by weakness of will?
      *   *Sufficient Answer:* Explanation of how the mechanism makes succumbing to the identified temptation/pressure significantly harder or impossible.
      *   *Termination/Handoff:*
          *   **No:** **Terminate - Do Not Entrench** (or recommend adjusting the mechanism). Mismatched tool.
          *   **Yes:** Proceed to Q5.

  5.  **Cost of Constraint:**
      *   *Question:* What significant, *foreseeable* costs does this constraint impose on future boards? (e.g., lost flexibility, higher transaction costs for essential changes, opportunity costs, reduced ability to respond to other crises).
      *   *Sufficient Answer:* Listing of concrete, plausible future costs/burdens directly caused by the constraint.
      *   *Handoff:* Proceed to Q6. Costs are weighed later.

  6.  **Enforceability Against a Future Board?**
      *   *Question:* Is the constraint backed by a mechanism *external* to the board itself, which a future board cannot easily override by a simple majority vote? (e.g., constitutional provision, irrevocable trust, contractual obligation to a 3rd party with standing, voter referendum requirement)? Consider state legislature override power as a potential weak point.
      *   *Sufficient Answer:* Identification of a specific, credible enforcement mechanism beyond the board's direct control OR clear admission there is none.
      *   *Termination:*
          *   **No credible external enforcement:** **Recommend Weaker Instrument** (See Menu). A purely internal rule (like a supermajority requirement for repeal) is easily changed by the same majority it constrains and offers little real precommitment value against weakness of will if pressure is high. It primarily binds successors, not self.
          *   **Credible external enforcement:** Proceed to Q7.

  7.  **Anticipated Future Plea:**
      *   *Question:* What is the *most compelling argument* a future board will make when it desperately needs to override this constraint? Does the *drafted language specifically anticipate and address* this argument? (Ulysses instructed his crew to ignore *his own future pleas*, not just any sailor's whim).
      *   *Sufficient Answer:* Articulation of a plausible, strong future plea (e.g., "We need this money for a genuine emergency!" or "Circumstances have changed disastrously!") and analysis of whether the constraint's structure/escape valves account for it.
      *   *Termination/Handoff:*
          *   **No compelling plea anticipated OR language ignores it:** **Terminate - Do Not Entrench** (or recommend adding a robust escape valve). Fails the Ulysses test.
          *   **Plea anticipated & language addresses it:** Proceed to Q8.

  8.  **Escape Valves & Sunset:**
      *   *Question:* Are there clear, feasible, but deliberately difficult pathways for a future board to override the constraint if the cost becomes intolerable *or* the weakness-of-will scenario clearly no longer applies? Is the duration absolutely necessary and minimal?
      *   *Sufficient Answer:* Description of specific override mechanisms (e.g., supermajority + independent review, referendum, time-based sunset) and justification for duration.
      *   *Handoff:* Proceed to Q9. Weaker forms might be suggested here.

  9.  **Balancing & Recommendation:**
      *   *Question:* Weigh the *specific, documented risk* of weakness of will (Q3) against the *foreseeable costs and burdens* (Q5) and the *effectiveness/rigidity* of the constraint + escape valves (Q4, Q6, Q8). Does the precommitment offer a *net benefit* given its significant cost to future agency?
      *   *Handoff:* **This is the core Value Judgment.**
          *   *Recommendation Options:*
              *   **Endorse as Drafted:** If risk is high/clear, mechanism is well-targeted, enforcement credible, escape valves robust, costs manageable, duration justified.
              *   **Endorse with Modifications:** E.g., shorten duration, add/strengthen escape valve, weaken mechanism (see Menu).
              *   **Recommend Weaker Instrument:** If justification exists but full entrenchment is disproportionate or lacks enforcement.
              *   **Recommend Against Entrenchment:** If weaknesses outweigh benefits, threat misclassified, or core justification (Weakness of Will) unsupported.
      *   *Output:* Memo outlining analysis from Q1-Q8 and clear recommendation based on Q9 balancing. Flag "dead hand" concerns prominently if binding successors.

  **Menu of Weaker Instruments (Consider before full entrenchment):**
  1.  **Sunset with Affirmative Renewal:** Policy expires on date X unless reauthorized by majority/supermajority vote. Tests ongoing support.
  2.  **Funding Floor:** Mandate a minimum funding level (e.g., "at least Y% of tax increment") rather than a full dedication. Preserves some flexibility.
  3.  **Delay/Supermajority Speed Bump:** Require a waiting period (e.g., 1 year) or supermajority vote *within the board* to change the policy. Raises cost of reversal without absolute prohibition. (Note: Q6 applies - weak if purely internal).
  4.  **Preference Shaping:** Require detailed impact reports, public hearings, or independent review *before* reversal can be considered. Aims to inform and shape future preferences/deliberation.
  5.  **Contractual Penalty (if external party):** Instead of an absolute bar, structure the interlocal agreement with significant financial penalties for breach, making reversal costly but not impossible.
  6.  **Policy Directive:** Strong, non-binding statement of current intent and rationale for future boards.

  ---

  **Application to Live Proposals:**

  1.  **Light-Rail Bond Dedication:**
      *   Q1: Binds **Successors** (Future Boards). "Dead hand" concern flagged.
      *   Q2: Threat is **(A) Weakness of Will** (foreseeable political/fiscal pressure to divert dedicated funds to other pressing needs or tax cuts).
      *   Q3: **Plausible & Specific.** Well-documented history of transit funds being raided; rating agency demand underscores market recognition of this risk.
      *   Q4: **Effective.** Dedicating revenue directly counters the specific weakness (diversion).
      *   Q5: **Costs:** Reduced flexibility for future budget crises; opportunity cost if rail underperforms.
      *   Q6: **Enforceable?** **Yes.** Debt covenants create a contractual obligation to bondholders (external party with standing). Voter referendum adds another external layer. State override possible but politically costly.
      *   Q7: **Future Plea:** "We need this money for an emergency!" **Addressed?** Partially. Debt covenants prioritize bondholders. Referendum requirement means the public can judge the emergency plea. Could be stronger (e.g., defined emergency escape valve), but plausible.
      *   Q8: **Escape Valves:** Supermajority + Referendum is a significant, feasible override path. 30 years is long but common for infrastructure debt; matches asset life.
      *   Q9: **Balancing:** High, specific risk of diversion; mechanism well-targeted; strong external enforcement; significant but feasible escape path; duration tied to debt. Costs of *not* doing it (higher borrowing costs, project risk) are high. **Net Benefit: Yes.**
      *   **Recommendation: Endorse as Drafted.** Core justification (Weakness of Will) strong, mechanism appropriate, enforcement credible, escape possible. "Dead hand" concern mitigated by external enforcement (bondholders, voters).

  2.  **Fare-Free Bus Entrenchment:**
      *   Q1: Binds **Successors**. "Dead hand" concern flagged.
      *   Q2: Threat is explicitly stated as future reversal "under fiscal pressure." Is this **(A) Weakness of Will** (same board values fares=0 but caves) or **(B) Changed Preferences** (future board values fiscal balance more)? **Crucial Distinction.** Sponsor's rationale ("fiscal pressure") suggests *changed circumstances* forcing a reassessment, implying **(B) Changed Preferences** or **(C) Unforeseeable Change**, NOT purely **(A) Weakness of Will**. The board *now* values fare-free; the *future* board, facing fiscal pressure, might rationally value it less. Entrenching against this is binding future preferences.
      *   Q3: **Termination Point Reached.** Threat categorized as **(B) Changed Preferences**. **Recommendation: Do Not Entrench.** Precommitment theory does not justify binding future majorities to current policy preferences. This is policy entrenchment.
      *   *(Proceeding hypothetically if classified as A):*
          *   Q4: Supermajority+Referendum *might* counter weakness if pressure is purely political cowardice, less so if driven by genuine fiscal crisis.
          *   Q5: **High Costs:** Risk of service cuts/tax hikes during fiscal crisis due to inability to raise revenue; inflexibility.
          *   Q6: **Enforceable?** **Weak.** Supermajority is purely internal. Referendum is external but costly/time-consuming. Easier for a future board facing crisis to run a "We need fares to save buses!" campaign.
          *   Q7: **Future Plea:** "We face bankruptcy/service collapse without fare revenue!" **Addressed?** **No.** The mechanism doesn't anticipate or provide a clear path for this compelling plea.
          *   Q8: **Escape Valves:** Supermajority+Referendum is cumbersome in a crisis. 10 years is long for an operational policy with volatile costs.
          *   Q9: **Balancing:** Weak justification (if A); high costs; weak enforcement; ignores compelling future plea; no good escape valve. **Net Benefit: No.**
      *   **Recommendation: Do Not Entrench.** Primary reason: Threat is Changed Preferences (B), not Weakness of Will (A). Secondary reasons: High costs, weak enforcement, ignores compelling future plea. **Recommend Weaker Instrument:** Sunset with Affirmative Renewal (e.g., 3-5 years) or a Funding Floor for operational subsidies instead of fares, preserving the goal of affordability without inflexibility. *This rejects the board's expectation.*

  3.  **Land-Use Covenant:**
      *   Q1: Binds **Successors**. "Dead hand" concern flagged.
      *   Q2: Threat is... unclear. Why would a *future* board want dense housing/maintenance there? Presumably because regional needs change **(C) Unforeseeable Change** or because they assess regional housing/transit needs differently **(B) Changed Preferences)**. No specific "Weakness of Will" identified (e.g., "future boards will irrationally cave to developer pressure despite knowing it's bad"). Likely **(B) or (C)**.
      *   Q3: **Termination Point Reached.** No plausible Weakness of Will (A) threat identified. Likely Changed Preferences (B) or Unforeseeable Change (C). **Recommendation: Do Not Entrench.** Binding future land-use decisions for 25 years based on current preferences/negotiations is illegitimate under precommitment theory and highly inflexible.
      *   *(Proceeding hypothetically):*
          *   Q4: Covenant directly blocks the action.
          *   Q5: **High Costs:** Prevents addressing future housing crises or optimizing transit maintenance; opportunity cost on valuable land; potential obsolescence.
          *   Q6: **Enforceable?** **Yes (but flawed).** Contractual obligation to neighboring jurisdiction (external party with standing). BUT: State legislature override likely severs this easily.
          *   Q7: **Future Plea:** "We have a regional housing emergency!" or "This site is critical for transit expansion!" **Addressed?** **No.** 25-year absolute bar ignores this.
          *   Q8: **Escape Valves:** None in draft. 25 years is excessive.
          *   Q9: **Balancing:** Weak/absent justification; very high costs; ignores compelling future pleas; no escape; long duration; state override vulnerability undermines enforceability. **Net Benefit: Strong No.**
      *   **Recommendation: Do Not Entrench.** No justification for binding successors. **Recommend Weaker Instrument:** A fixed-term agreement (e.g., 5-10 years) with significant financial penalties for early termination payable to the suburb (making reversal costly but possible), or a requirement for joint review/renegotiation at intervals. Frame it as a mutual commitment, not an entrenched policy.

  ---

  **Self-Criticism:**

  1.  **Vulnerable Questions & Flipping the Fare-Free Proposal:**
      *   **Q2 (Threat Categorization):** Distinguishing "Weakness of Will" (A) from "Changed Preferences" (B) is the most theoretically fraught and likely point of practitioner error. A reasonable advocate could argue sustained political pressure *causes* a board to abandon its true preference (Weakness of Will), rather than genuinely changing its values. **What would change my mind on Proposal 2?** If the sponsor presented *specific evidence* that the *core value* (transit as a public good requiring zero fares) is widely held *and will remain so*, but boards *predictably succumb* to short-term fiscal panic *against their own better judgment* (e.g., documented cycles of fare hikes followed by public outcry and regret). This reframes it as protecting a stable preference from temporary weakness, making Q2(A) more plausible. If coupled with a *robust escape valve* triggered by independently verified fiscal emergency (e.g., state auditor declaration), the recommendation *might* shift to a modified endorsement (e.g., supermajority + referendum OR emergency escape valve).
      *   **Q7 (Anticipated Plea):** Practitioners might underestimate the need for specificity or accept vague future-proofing. The requirement to articulate the *exact* compelling plea and check the language against it is demanding. Missing this undermines the Ulysses rationale.

  2.  **Illegitimate Constraint Influence:** I suspect the **state legislature override power** is subtly doing more work than merely being an "input." While explicitly considered in Q6 (Enforceability), its *constant presence* likely makes me overly cautious about endorsing *any* entrenchment that lacks extremely robust external enforcement (like bond covenants), fearing it creates a false sense of security or wastes effort. This might bias the procedure towards rejecting entrenchment unless enforcement is ironclad, potentially undervaluing constraints that raise the *political cost* of reversal even if legally overrideable. The 45-minute limit justifies simplification but may lead to under-exploring creative escape valves in Q8.

  3.  **Limitations of the Procedure:**
      *   **Partisan or Anti-Democratic Entrenchment:** The procedure assumes good faith attempts to address legitimate governance problems. It offers little defense against proposals designed purely to lock in partisan gains or minority rule (e.g., supermajority requirements for core functions). It flags "binding successors" and "changed preferences" but can't stop a determined board ignoring the memo.
      *   **True Emergencies vs. Foreseeable Weakness:** The line is blurry. The procedure relies on Q7/Q8 but struggles with constraints so rigid they prevent response to *genuine*, unprecedented catastrophes unforeseen in the "plea" anticipation.
      *   **Moral Obligations to the Future:** The Q9 balancing involves values (how much current owes future), but the procedure provides little theoretical framework *beyond* precommitment justification for weighing profound intergenerational equity claims (e.g., climate commitments).
      *   **"Shaping Preferences" Mechanisms:** The menu lists them, but the procedure offers scant guidance on *when* or *how* shaping (Q4 alternatives) is preferable to constraining, as it delves less into democratic theory beyond precommitment.
      *   **Active Misguidance:** Applying this rigidly to constitutional amendments or foundational governance rules (beyond the board's scope) would be misleading. It's designed for *policy* entrenchment by an administrative body.
      *   **Seek Outside Judgment When:**
          *   The proposal involves novel legal mechanisms or complex interjurisdictional enforcement (Q6).
          *   The threat involves highly contested future scenarios (e.g., existential risks) where the cost/benefit (Q9) is profound and beyond administrative judgment.
          *   There's credible argument the constraint violates fundamental legal principles or democratic norms, even if it passes the Q1-Q9 check.
          *   The board insists on entrenching against Changed Preferences (Q2=B), requiring a deeper debate about democratic legitimacy the procedure deliberately truncates.

  This procedure prioritizes the core Elsterian justification for precommitment (binding self/successors against *weakness of will*) while embedding key theoretical safeguards against the "dead hand" objection and Ulysses's insight. It forces a clear-eyed look at enforceability and future overrides, providing a structured, theoretically grounded framework for your review within operational constraints.
