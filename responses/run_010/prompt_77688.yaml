  Looking at the requirements, I need to approach this in six specific parts. First, I'll brainstorm distinctions that separate positions in this debate. Important distinctions include whether rationality applies to acts, intentions, dispositions or character traits; whether the case involves another agent's predictions; whether that agent can see through you; whether intentions require reasons for actions; whether future conduct is fixed or open; whether rationality tracks outcomes or responds to reasons; and whether payoffs for mental states can be separated from actions.

