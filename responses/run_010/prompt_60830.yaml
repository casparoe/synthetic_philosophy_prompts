prompt: |-
  Writing the setup chapter of my dissertation on dream experience, and before I start scoring Malcolm against Dennett I want to pin down what I'm actually allowed to demand of a theory. So: give me the desiderata. What does any account of whether dreaming involves having experiences have to deliver — which phenomena it owes an explanation of (the reports and their notorious unreliability, the sense of duration and of being immersed in a world rather than merely thinking about one, the fear in a nightmare, the fact that nothing outside ever corroborates any of it), which distinctions it can't collapse (ongoing process during sleep vs. narrative assembled at waking; having an experience vs. being disposed to report one), and which empirical results it has to stay consistant with — e.g. the pre-arranged eye signals coming out of verified REM, or the correlation between eye-movement patterns and what gets reported. Motivate each entry with the case that generates it, and tell me which ones are genuinely load-bearing versus which are just one camp's prejudices dressed up as requirements. Especially: is Malcolm's point that you can't be wrong about having dreamt compatable with also demanding an account of the temporally extended character of the experience, or does one of those have to go? If some subset turns out to be jointly unsatisfiable, say so — that's the bit I most want. And which single desideratum knocks out the most positions. Assume the reader already knows the debate; don't summarise it, don't send me to sources.
reasoning: |-
  Okay, the user is working on their dissertation about dream experiences, specifically setting up a chapter where they'll compare Malcolm and Dennett. They want a clear list of desiderata for any theory of dreaming, focusing on what such a theory must explain, what distinctions it should preserve, and what empirical data it must account for. They also want to know which desiderata are essential and which might be biased, and whether certain requirements conflict.

  First, I need to recall the key points in the debate. Malcolm argues that dreams aren't experiences during sleep but are constructed upon waking. Dennett, on the other hand, critiques this with his cassette theory, suggesting dreams might be stored and recalled. The user needs a solid foundation before comparing them.

  The user mentions phenomena like dream reports' unreliability, the sense of duration, immersion, emotions like fear, and lack of external corroboration. They also want to maintain distinctions like ongoing process vs. narrative construction and having an experience vs. disposition to report. Plus, empirical data like REM signals and eye-movement correlations with reports.

  I should list each desideratum, explain why it's necessary, and mention which case generates it. For example, dream reports are central, so any theory must explain their existence and unreliability. The distinction between ongoing process and narrative is crucial because Malcolm collapses this, while others like Dennett don't.

  The conflict between Malcolm's incorrigibility (you can't be wrong about having dreamt) and the temporal extension of dreams is a key issue. If dreams are constructed upon waking, how do we explain the sense of duration? That's a potential incompatibility.

  Empirical constraints like pre-arranged signals during REM are important because they challenge Malcolm's view. If a dreamer signals during REM and later reports a corresponding dream, it suggests an ongoing experience.

  I need to highlight which desiderata are load-bearing. For instance, accounting for dream reports is fundamental, while explaining specific content details might be less critical. Also, pointing out which requirements might be biased, like the demand for neural correlates, which some might see as neurocentric.

  The user wants to know which desideratum rules out most theories. Temporal phenomenology (duration and immersion) is tough for constructivist theories like Malcolm's. Empirical constraints like REM signaling also challenge non-experiential theories.

  Finally, assessing incompatibilities. Malcolm's incorrigibility and the temporal nature of dreams might conflict. If a dream is constructed upon waking, the sense of real-time experience needs explanation. Similarly, dispositional vs. experiential distinction is vital; conflating them weakens theories like Malcolm's that reduce experience to reports.
answer: |-
  Here’s a distilled, battle-ready list of desiderata for a theory of dreaming, grounded in the phenomena and designed to expose fault lines. I’ve flagged incompatibilities and load-bearing items explicitly.

  ### Core Phenomena Requiring Explanation (The "What")
  1.  **Existence & Ubiquity of Dream Reports:** *Why* do people consistently report vivid, narrative experiences upon waking? (Generating Case: The sheer fact of dream recall across cultures/history.) **Load-Bearing.** Any theory must explain *why reports happen*, not just dismiss them.
  2.  **Report Unreliability & Distortion:** Why are dream reports demonstrably malleable, susceptible to forgetting, confabulation, and narrative smoothing? (Generating Case: Discrepancies between pre-arranged signals/behaviors during sleep and subsequent reports; lab-induced incorporation errors.) **Load-Bearing.** Exposes the gap between sleep events and waking narrative.
  3.  **Temporal Phenomenology:** The compelling *sense* within the dream of duration, sequence, a "lived time," and events unfolding *as if* real-time. (Generating Case: Dreamer signaling multiple pre-arranged eye-movements corresponding to distinct dream events *during* sleep; reports of complex, time-consuming narratives.) **Load-Bearing & Knife-Edge.** Directly challenges non-experiential/constructivist views.
  4.  **Immersive Worldness:** The sense of being *in* a spatially coherent, perceptually rich world (*even if bizarre*), distinct from merely thinking *about* a scenario. (Generating Case: Reports of navigating spaces, interacting with objects/entities, experiencing sensory modalities.) **Load-Bearing.** Distinguishes dreaming from daydreaming/episodic thought.
  5.  **Affective Reality:** The intense, often congruent emotion *within* the dream narrative (e.g., stark terror in nightmares), independent of waking judgment. (Generating Case: Physiological arousal (heart rate, sweating) during REM correlating with reported dream fear; waking distress from nightmare affect.) **Load-Bearing.** Shows dream events evoke real responses.
  6.  **Lack of Corroboration:** Why is the *specific content* of a dream never verifiable by external observers or evidence? (Generating Case: Fundamental privacy of the experience.) **Load-Bearing.** Highlights the epistemological puzzle.

  ### Essential Distinctions to Preserve (The "What Not")
  7.  **Ongoing Sleep Process vs. Waking Narrative Construction:** The theory must *account* for both the physiological/neural events during sleep (REM, NREM, activation patterns) *and* the cognitive process of recall/reporting. It cannot *reduce* the former solely to the latter. (Generating Case: Pre-arranged signals *during* verified REM sleep preceding the report; time-locked neural correlates.) **Load-Bearing.** Collapsing this is Malcolm’s core error.
  8.  **Having an Experience vs. Being Disposed to Report One:** The theory must explain the *phenomenal character* (what it's *like*) during the sleep event (if any), distinct from the mere disposition to later report "I dreamt X". (Generating Case: The "felt reality" of the dream state itself, even if forgotten; the absurdity of claiming a rock "dreamt" but just can't report it.) **Load-Bearing.** Knocks out pure dispositional accounts.

  ### Empirical Constraints (The "Must Fit")
  9.  **REM Correlation & Signaling:** The theory must be consistent with subjects successfully executing pre-arranged eye/body signals *during polysomnographically verified REM* corresponding to described dream actions. (Generating Case: Dement & Kleitman experiments; modern replication.) **Load-Bearing.** Direct evidence *against* pure "waking construction" of the *entire* narrative sequence.
  10. **Neural Correlates of Specific Content:** The theory must accommodate findings linking specific dream report content (faces, places, movement) to activation patterns in corresponding sensory/motor/limbic areas *during sleep*. (Generating Case: fMRI/EEG studies showing visual cortex activation during reported visual dreaming, motor cortex during movement dreams.) **Load-Bearing.** Undermines strong claims of neural insignificance.
  11. **Physiological Coherence:** The theory must fit the observed coherence between reported dream affect and concurrent autonomic measures (HR, GSR), and between reported actions and phasic events (eye movements, muscle twitches). (Generating Case: Nightmare physiology; REM behavior disorder acting out dreams.) **Load-Bearing.** Shows integration of "experience" and body state.

  ### Load-Bearing vs. Prejudices
  *   **Load-Bearing:** 1, 2, 3, 4, 5, 7, 8, 9, 10, 11. These are demanded by core, uncontested phenomena or critical distinctions. Failing on these seriously weakens a theory.
  *   **Potential Prejudices Dressed Up:**
      *   Demanding a *single*, unified neural "dream state" (ignoring NREM dreams, complexity).
      *   Insisting dream experiences must be *identical* in structure/mechanism to waking perception. (Generating Case: Bizarre dream content; lack of external input.)
      *   Requiring that *all* dream phenomenology must have a *currently identifiable* precise neural correlate. (Generating Case: Underdetermination of complex subjective states by current neuroscience.)

  ### The Malcolm Tension: Incorrigibility vs. Temporal Phenomenology
  *   **Malcolm's Incorrigibility ("You can't be wrong about having dreamt"):** This *is* compatible with demanding an account of temporal phenomenology... **only if** the temporal character is treated as an *intrinsic feature of the report itself* (a report *of* a temporally extended experience), not necessarily proof of real-time duration *during sleep*. Malcolm would bite this bullet: the "sense of duration" is part of the waking narrative construct.
  *   **The Conflict:** Where they **genuinely clash** is with empirical constraint **#9 (REM Signaling)**. If the subject signals *during sleep* in response to dream events *as they unfold*, this strongly suggests an *ongoing, temporally structured process* during sleep, not merely a disposition formed at waking. Malcolm's theory struggles mightily here. **So: Incorrigibility about *having dreamt* can stand, but not if it requires denying *any* temporally extended cognitive process during sleep linked to the report.** #9 forces the issue.

  ### Jointly Unsatisfiable Triad? (The Crux)
  1.  **Strong Incorrigibility (Malcolm):** Dream reports are incorrigible attestations *only* to the waking conviction of having dreamt; they tell us *nothing reliable* about events during sleep.
  2.  **Temporal Phenomenology:** The dream report convincingly describes an experience with real-time duration and sequence.
  3.  **Empirical Signaling (#9):** Pre-arranged signals executed *during* verified REM sleep demonstrate temporally coordinated responses to *reported* dream events *as they happen*.

  *   **Incompatibility:** #2 and #3 together provide strong evidence that the temporal structure reported *reflects*, however imperfectly, a temporally structured *process during sleep*. This directly contradicts #1 (Strong Incorrigibility), which insists reports tell us nothing reliable about the sleep period. **You can have #1 or (#2 + #3), but not all three.** Malcolm chooses #1 and downplays #2/#3. Most others accept #2/#3 and reject strong #1.

  ### The Sledgehammer Desideratum
  *   **#9 (REM Correlation & Signaling)** knocks out the most positions decisively. It fatally wounds:
      *   **Pure Malcolm (no sleep experiences):** Signals happen *during sleep* in response to dream content.
      *   **Total Confabulation Theories:** Signals correlate meaningfully with *reported* dream events, showing a link between sleep process and report content.
      *   **Instantaneous "Snapshot" Dreams:** Signals demonstrate spread-out temporal responses.

  **In Summary:** A viable theory must explain reports, their flaws, the *felt* time/world/emotion of dreams, while respecting the sleep/wake distinction and the experience/report distinction. It *must* fit the signaling data and neural/physiological correlations. Malcolm's incorrigibility clashes fatally with the combined weight of temporal phenomenology and empirical signaling. #9 (Signaling) is the most potent weapon against non-experiential or instantaneous theories. Good luck scoring Malcolm vs. Dennett – the desiderata show exactly where the body blows land.
