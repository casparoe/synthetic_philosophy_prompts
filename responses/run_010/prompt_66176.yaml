prompt: |-
  I'm a postdoc and on Friday I've got forty minutes with our new cognitive science masters intake during orientation week -- fourteen people, mostly psych and biology backgrounds, three who code for a living and have trained models before, and one who's done a philosophy degree and will enjoy being difficult. The session is on Dennett's four kinds of creature: Darwinian, Skinnerian, Popperian, Gregorian. Whiteboard only, no slides, and I've been told explicitly not to let it drift into a talk about consciousness -- the whole point is to hand them a vocabulary they'll keep meeting for the rest of the term. So: don't explain the taxonomy to me, I know it fine. Plan how I should build it in front of them.

  The bit I can't get straight is the dependency structure. My instinct is that the real content isn't "kinds of animal getting cleverer" but "what is doing the selecting, and where the information about the world is coming from" -- genes, then the creature's own trial and error, then an internal model that takes the hits, then tools somebody else designed. But I don't know how early I can say that out loud without it being meaningless to them, and I don't know what has to be true about how I introduce the first level for the second one to be any more than a list. Related: what's the single case that should carry all four rungs? I was going to hang the whole thing on a digger wasp doing its rigid little routine, then work upwards from there, but I'm worried that makes it look like a ladder of smartness, which is the exact message I don't want. Tell me what the carrying example has to have and what it has to lack, and whether one example can do all four or whether I need to switch partway. And when should the ML people be allowed to ask where a trained model sits -- early, as motivation, or held to the end, given that I suspect they'll say "model-based RL is obviously Popperian" and be half right.

  Then map the misconceptions and tell me the point in the sequence where each one becomes cheaper to prevent than to repair. I'm already braced for "so these are stages a human baby goes through", for "Gregorian just means uses tools, so the chimp with the termite stick counts", and for someone deciding the four levels are cumulative in the sense that you could strip the top ones off a person and get the wasp back. I also expect the Popperian rung to feel like cheating -- if an animal can predict, hasn't it just been conditioned to expect? -- and I want to know whether to attack that head-on or route around it. Give me one question to put to the room at the end that would show me whether the selecting-process idea actually landed rather than four labels being memorized, ideally a question where a wrong answer is diagnosable at a glance. And be blunt about what I should announce I'm leaving out: I'm assuming the intentional stance and the whole consciousness payoff, but say if there's something else that will look like a hole if I just skip it silently.
reasoning: |-
  Okay, let me tackle this postdoc's problem. They need to teach Dennett's four creatures in 40 minutes to a mixed-background master's group, using only a whiteboard. The key is to avoid framing it as a ladder of intelligence and instead focus on the selection process and where information comes from. 

  First, the dependency structure. The core idea is that each level represents a shift in what does the selecting (genes, environment, internal model, cultural tools) and where information is stored. Starting with Darwinian creatures makes sense because it's the foundation—selection happens through genetic variation and death. But how to introduce this without making the next levels seem like just a list? 

  The digger wasp example is classic for Darwinian behavior. But using it for all levels risks reinforcing the "ladder of smartness" misconception. Maybe the wasp can only illustrate the first level. Then switch to a different example that can span multiple levels? Like a squirrel: Darwinian for instincts, Skinnerian for learning nut locations, Popperian for simulating cache retrieval risks. But Gregorian tools might not fit a squirrel well. 

  Alternatively, use a human example throughout? A baby's reflexes (Darwinian), learning to avoid a hot stove (Skinnerian), mental rehearsal before a dive (Popperian), using language or maps (Gregorian). But this could trigger the "stages of development" misconception. 

  Perhaps the best move is to explicitly deny a single carrier example early on. State upfront: "These aren't evolutionary stages or intelligence ranks—they're different information-handling strategies that can coexist." Then use the wasp for Darwinian, a rat in a maze for Skinnerian, a chess player calculating moves for Popperian, and a scientist using equations for Gregorian. 

  For the selection-process emphasis, introduce the "what selects?" question immediately. After drawing the four columns (Creature Type | What Selects? | Where Info Lives?), fill Darwinian together: "Genes select via death, info in DNA." Then ask: "What if we could avoid actual death? How might selection happen faster?" That bridges to Skinnerian. 

  The ML question—when to address it? Early could hook the coders, but might derail the taxonomy build. Better to park it visibly: "We'll get to models—I promise—but first we need all four pieces." When Popperian is introduced, ask: "Where would model-based RL fit?" Let them debate—it's Popperian-ish but lacks true internal criticism. That exposes the key distinction: Popperian requires internal selective processes, not just prediction. 

  Misconceptions: The "stages" myth is the most dangerous. Counter it when introducing the second level: "Note: A Skinnerian creature still has Darwinian systems—these layers stack, they don't replace." For "Gregorian = tool use," when drawing that column, specify: "Not just tools—tools that pack in cultural knowledge, like writing." 

  The Popperian "cheating" objection is tricky. Preempt it by contrasting Skinnerian and Popperian explicitly: "Skinnerian trial is physical—burn paw on stove. Popperian trial is mental—simulate paw on stove. The selection isn't conditioning; it's the creature's own evaluation of outcomes." 

  Closing question: "If I train a rat to press a lever for food, is that Skinnerian or Popperian?" Wrong answer (Popperian) reveals confusion about internal models vs. conditioned response. 

  Finally, state omissions: "We're skipping consciousness and intentional stance—this is about cognitive architecture, not subjective experience."
answer: |-
  Here’s a battle-tested plan for your 40-minute whiteboard session, designed to sidestep misconceptions, emphasize selection processes, and land the core idea that **the taxonomy is about *where information is stored* and *what does the selecting***—not a "smartness ladder."  

  ---

  ### **1. Opening Hook & Core Framing (5 min)**  
  - **Start with a question:** "How does *any* creature navigate a complex world without dying? Let’s map the engines of adaptation."  
  - **Immediately frame the taxonomy:** "Dennett gives us 4 strategies. *Not* stages of evolution, *not* steps in development, and *not* IQ tiers. They’re distinct ways of outsourcing risk during learning."  
  - **Whiteboard header:**  
    ```  
    CREATURE TYPE | WHAT SELECTS? | WHERE'S THE "KNOW-HOW"?  
    ```  
  *(This primes the "selection/info location" focus upfront.)*  

  ---

  ### **2. Build the Taxonomy Level by Level (25 min)**  
  **Use *distinct examples* for each level—no single carrier!** (Avoids ladder fallacy.)  

  | **Level**       | **Example**             | **Key Question**                         | **Whiteboard Fill**                                  | **Misconception Guardrails**                                  |  
  |-----------------|-------------------------|------------------------------------------|-----------------------------------------------------|---------------------------------------------------------------|  
  | **Darwinian**   | Digger wasp             | *"What if your 'knowledge' is fixed at birth?"* | **Selects:** Genes via death<br>**Know-how:** DNA blueprint | "This isn't 'stupid'—it works! But inflexible."              |  
  | **Skinnerian**  | Rat in a maze           | *"What if you can learn *during* your life?"* | **Selects:** Environment (rewards/punishment)<br>**Know-how:** Neural wiring (reinforced) | "Still *physical trial*—the world inflicts costs directly." |  
  | **Popperian**   | Chess player (pre-move) | *"What if you could test ideas *in your head* first?"* | **Selects:** Internal self-criticism<br>**Know-how:** Mental models | "**Crucial:** Not just *prediction*—it's *deliberate self-editing*." |  
  | **Gregorian**   | Scientist w/ equations  | *"What if you borrow tools packed with others’ insights?"* | **Selects:** Cultural evolution<br>**Know-how:** External artifacts (words, tools, math) | "Not *any* tool—it must encode *cultural knowledge* (e.g., a spreadsheet ≠ a rock)." |  

  - **Why switch examples?**  
    - Digger wasp: Pure genetic programming.  
    - Rat: Shows environment-driven learning *without* internal modeling.  
    - Chess player: Illustrates *deliberate* mental simulation (not just conditioned reflexes).  
    - Scientist: Tools as "frozen intelligence" (e.g., math encodes centuries of trial/error).  
  - **When ML questions arise:** Let them bubble up at Popperian. Say: *“Hold that thought—we need Gregorian first to see the full picture.”* Then revisit post-taxonomy.  

  ---

  ### **3. Dependency & Selection Emphasis (5 min)**  
  - **Draw arrows between levels:**  
    ```  
    Darwinian → Skinnerian → Popperian → Gregorian  
    ```  
  - **Clarify:** "Each level *adds a layer*, but doesn't erase the prior. Your genes (Darwinian) still run your metabolism while you mentally simulate chess moves (Popperian)."  
  - **Hammer the core:** "The leap isn't 'smarter'—it's *shifting who/what pays the price of failure*. Genes → Body → Internal Model → Cultural Tools."  

  ---

  ### **4. Actively Counter Misconceptions (Timed Preemptions)**  
  | **Misconception**                          | **When to Kill It**         | **Counter-Tactic**                                                                 |  
  |--------------------------------------------|-----------------------------|-----------------------------------------------------------------------------------|  
  | "Stages a baby goes through"               | After Skinnerian example    | *"A baby has Darwinian reflexes *while* learning Skinnerian associations!"*       |  
  | "Gregorian = any tool use"                 | Introducing Gregorian       | *"Does a chimp’s stick encode *cultural knowledge*? Or just extend its reach?"*   |  
  | "Popperian is just fancy conditioning"     | During Popperian deep dive  | *"Conditioning reinforces *past* actions. Popperian *invents and rejects futures*."* |  
  | "Peel back layers to get a wasp"           | Dependency discussion       | *"Remove a human’s tools (Gregorian)—they’re still Popperian. Remove *that*? Still Skinnerian!"* |  

  ---

  ### **5. ML Hook & Final Check (5 min)**  
  - **Bring back ML:** "So—where’s your trained model? It *feeds on* Gregorian tools (libraries, datasets), uses Popperian-like internal simulation... but who *selects*? The optimizer (Skinnerian) or the model’s own structure (Darwinian)?" *Let them debate. Conclude:* "It’s a hybrid—but Dennett’s grid helps us ask better questions."  
  - **Closing diagnostic question:**  
    > *"A monkey avoids a trap by mentally simulating outcomes. Later, it teaches its troop using a new tool. Which levels are in play?"*  
    - **Wrong answer:** "Gregorian then Popperian" (confuses levels).  
    - **Right answer:** "Popperian (simulation) + Gregorian (teaching tool)" *—shows they grasp compounding.*  

  ---

  ### **What to Explicitly Omit (Announce Upfront!)**  
  - "We’re skipping consciousness, qualia, and the intentional stance—Dennett uses this for that, but today it’s **strictly about cognitive machinery**."  
  - "We’re not covering *how* brains implement Popperian criticism—just that the function exists."  

  ### **Why This Works**  
  - **Selection/info location** is the through-line, not intelligence.  
  - **Distinct examples** prevent ladder thinking.  
  - **ML parked until end** avoids derailment.  
  - **Diagnostic question** tests for conceptual coherence, not memorization.  

  **Time budget:** Hook (5) + Levels (25) + Dependency (5) + ML/Q&A (5). Stick ruthlessly to this—you’ve got 40 mins of gold. Go get ’em.
