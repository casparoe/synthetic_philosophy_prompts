answer: |-
  ### Desiderata for a Life-Definition in a Life-Detection Payload  

  | id | requirement                                                      | motivating case(s)                                                                                             | status               | strains/rules out                                                                 |  
  |----|------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------|----------------------|-----------------------------------------------------------------------------------|  
  | R1 | Bivalence: Must output a strict yes/no per sample.               | Mission constraint; classifier must decide.                                                                    | Non-negotiable       | Cluster definitions (fuzzy boundaries).                                           |  
  | R2 | Individual-level assignment: Verdict for a single entity at time T. | Lone spore, sterile mule, or isolated cell; no population context needed.                                    | Non-negotiable       | Evolutionary definitions (require lineages/populations).                          |  
  | R3 | Operationalizability: Must use only the observational API.       | Cannot access history (e.g., origin) or unobservable properties.                                              | Non-negotiable       | Historical definitions (e.g., "evolved naturally").                               |  
  | R4 | Reproduction potential: Must not require active replication.     | Sterile mules (alive but cannot reproduce), spores (dormant).                                                 | Non-negotiable       | Strict evolutionary definitions (require active replication).                     |  
  | R5 | Metabolism independence: Must not require standalone metabolism. | Obligate endosymbionts (e.g., *Carsonella*), mitochondria (dependent but derived from life).                  | Non-negotiable       | Thermodynamic/self-maintenance definitions (require self-sustained metabolism).   |  
  | R6 | Dormancy compatibility: Must classify cryptobiotic states as alive. | Spores, tardigrades (no metabolism but retain potential).                                                     | Non-negotiable       | Thermodynamic definitions (require active energy dissipation).                    |  
  | R7 | Non-molecular basis: Must not assume specific chemistry (e.g., RNA). | Self-replicating machine (built, non-organic), alternative biochemistries.                                    | Non-negotiable       | Definitions relying on "organic-only" criteria.                                   |  
  | R8 | Avoid false positives: Must exclude abiotic dissipative systems. | Fire (energy throughput), hurricanes (response to perturbation), crystals (morphology).                       | Non-negotiable       | Thermodynamic definitions (overly inclusive).                                     |  
  | R9 | Avoid false negatives: Must include compromised but functional life. | Cultured cell lines (outlive donor), mules (sterile), endosymbionts (genome-reduced).                         | Non-negotiable       | Rigid evolutionary definitions (e.g., require reproduction/evolution).            |  
  | R10| Component exclusion: Must not classify subcellular parts as alive. | Ribosomes, mitochondria, prions (functional but not autonomous).                                              | Non-negotiable       | Overly broad self-maintenance definitions.                                        |  
  | R11| Evolution potential: Must account for heritable variation under selection. | Self-replicating machine (if evolvable), obligate endosymbionts (if population-level evolvable).              | Negotiable           | Thermodynamic/self-maintenance definitions (evolution not central).               |  
  | R12| Virus/viroid adjudication: Must resolve if they are alive.       | Viruses (debate: active in hosts but inert outside), viroids (RNA-only).                                      | Camp-specific        | All definitions (arbitrary without consensus).                                    |  
  | R13| Origin-agnostic: Must not require natural evolutionary origin.   | Self-replicating machine (identical to bacterium but designed).                                               | Non-negotiable       | Historical definitions (e.g., "Darwinian evolution").                             |  

  ### Joint Satisfiability of Bivalence, Individual-Level, and Operationalizability  
  **Hypothesis test**: Bivalence (R1), individual-level assignment (R2), and operationalizability (R3) **cannot all be satisfied simultaneously** due to edge cases requiring historical context. For instance:  
  - A **spore** (R6) lacks metabolism at T, demanding potential-based assessment (not directly observable).  
  - A **self-replicating machine** (R13) is operationally identical to life but challenges historical definitions (e.g., "evolved").  
  - **Viruses** (R12) blur boundaries without population-level evolution (inaccessible at T).  
  The core conflict: **Individual-level bivalence (R1+R2) requires current-state properties, but dormant/reduced cases (spores, endosymbionts) need inference of potential, straining operationalizability (R3).** R3 forbids historical data, yet potential (e.g., for evolution) is inherently future-oriented and inferred indirectly.  

  ### Family Scoring Against Requirements  
  - **Evolutionary definitions** (e.g., "capable of Darwinian evolution"):  
    - *Fails*: R2 (individual-level), R4 (reproduction potential), R5 (metabolism independence), R6 (dormancy), R9 (false negatives for mules), R13 (origin-agnostic).  
    - *Strengths*: R11 (evolution potential), R12 (viruses excluded).  
  - **Self-maintenance definitions** (e.g., autopoiesis/homeostasis):  
    - *Fails*: R5 (metabolism independence for endosymbionts), R6 (dormancy), R11 (evolution potential), R13 (if origin-dependent).  
    - *Strengths*: R1, R2, R8 (avoids fire).  
  - **Thermodynamic/dissipative definitions** (e.g., "dissipates energy/complexity"):  
    - *Fails*: R6 (dormancy), R8 (false positives for fire), R9 (false negatives for spores), R10 (may include hurricanes), R11 (evolution potential).  
    - *Strengths*: R7 (non-molecular), R13 (origin-agnostic).  
  - **Cluster/functionalist definitions** (e.g., NASA: "self-sustaining, evolvable system"):  
    - *Fails*: R1 (bivalence if thresholds fuzzy), R3 (operationalizing "self-sustaining" for spores), R12 (arbitrary virus inclusion).  
    - *Strengths*: Flexibility for R4, R5, R9.  

  **Most eliminative requirement**: **R6 (dormancy compatibility)** rejects thermodynamic (require active dissipation) and strict self-maintenance definitions (require current metabolism). It also strains evolutionary definitions (potential inferred, not observed). Only cluster approaches partially tolerate it via multi-property weighting.  

  **Key takeaway**: R12 (virus adjudication) is **camp-specific**, not a core requirement—insisting on it prioritizes semantics over functionality. The irreconcilable tension lies in R2+R3: individual-level operationalizability fails for cases needing potential (e.g., spores) without historical/future data. Relaxing R3 (allowing probabilistic inference from API data) may be necessary.
