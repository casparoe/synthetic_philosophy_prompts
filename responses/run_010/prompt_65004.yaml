  - Part (c) misfires by attacking P2 (which is well-supported) while conceding P3’s strength. The *actual* weak premise (P1) went unevaluated.  

  **Adjust curve?** No—this is a strong but imperfect answer. Reserve 9+/10 for those nailing (a)’s relations and pinning P1’s necessity claim in (c).  

