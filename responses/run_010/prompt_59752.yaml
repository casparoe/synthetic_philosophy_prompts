  ### Desiderata for Decision Theories in the Absent-Minded Driver Problem  
  This problem exemplifies **choice under imperfect recall**: an agent makes sequential decisions with no memory of past actions, facing identical decision nodes (exits) where they cannot distinguish their position. The setup generalizes to agents with "wiped" earlier selves, repeated choices with no memory (e.g., habit formation), and committees/teams taking turns with identical information. Below are desiderata any adequate decision theory must satisfy, categorized by non-negotiable physical/game-theoretic constraints and contestable normative requirements.  

  ---

  #### **Non-Negotiable Desiderata**  
  1. **Ex-Ante Optimality**  
     The theory must prescribe a policy (probability `p` of continuing at each exit) that maximizes **ex-ante expected payoff** (calculated before driving starts).  
     - *Why*: The driver commits to a plan from an initial state of full information.  
     - *This problem*: The ex-ante optimum is `p = 2/3`, yielding expected payoff `4/3`.  
     - *Generalization*: In repeated decisions with amnesia, the plan must optimize long-term reward from the outset.  

  2. **Belief Consistency via Policy**  
     At any exit, the driver's *credence* that it is the first exit must be consistent with Bayes' rule and the policy.  
     - *Why*: Beliefs must reflect the physical setup (exits are indistinguishable, policy affects state probabilities).  
     - *This problem*: If policy is `p`, credence of being at first exit is `α = 1 / (1 + p)`. For `p = 2/3`, `α = 3/5`.  
     - *Generalization*: In self-locating uncertainty (e.g., Sleeping Beauty), beliefs must be updated using the policy as a prior.  

  3. **Strategy Implementation Clarity**  
     The theory must specify how randomization is implemented (e.g., independent coin flips at each exit vs. one upfront coin flip), as this affects payoffs.  
     - *Why*: Physical implementation alters the decision tree. Independent flips yield `4p - 3p²` (max `4/3` at `p=2/3`); upfront flips (only pure strategies) yield max payoff `1` (always continue).  
     - *Distinction*: Must not conflate independent randomization (high payoff) with upfront deterministic plans (low payoff).  

  ---

  #### **Contestable Normative Desiderata**  
  4. **Sequential Rationality (Dynamical Consistency)**  
     At each exit, the chosen action (continue/exit) must be optimal given the *current* beliefs and the fixed policy.  
     - *Why*: A plan is "dynamically inconsistent" if the agent wishes to deviate when acting.  
     - *Contestability*:  
       - **Pro**: Upholds the principle of optimality (no regret mid-plan).  
       - **Con**: In imperfect recall, this may conflict with ex-ante optimality (see §6).  
     - *This problem*: At an exit, with belief `α = 1/(1+p)`, continuing is optimal iff `α(4p - 3p²) + (1-α)(4 - 3p) ≥ 4(1-α)`. For `p=2/3`, this fails.  

  5. **Commitment Sovereignty**  
     The ex-ante plan should bind later actions; re-optimization at exits is prohibited.  
     - *Why*: Allows achieving ex-ante optima that require "irrational" mid-plan actions.  
     - *Contestability*:  
       - **Pro**: Reflects real-world precommitment (e.g., addiction treatment).  
       - **Con**: Violates rationality-as-optimization-at-all-nodes.  

  6. **Pure Strategy Admissibility**  
     The theory must allow pure strategies (`p = 0` or `p = 1`) as valid options.  
     - *Why*: Pure strategies are feasible (e.g., "always continue") and may be chosen if optimal.  
     - *Contestability*: Irrelevant here since optimum is mixed (`p=2/3`).  

  ---

  #### **Tensions and Negative Results**  
  - **Joint Unsatisfiability**:  
    - Desiderata (1), (2), and (4) are **jointly unsatisfiable**.  
    - *Proof*:  
      - Ex-ante optimum requires `p = 2/3` (from `4p - 3p²`).  
      - Belief consistency gives `α = 1/(1+p) = 3/5` at any exit.  
      - Sequential rationality requires maximizing *interim* payoff:  
        `V(p) = α · [p · (4(1-p) + p·1] + (1-α) · [4(1-p) + p·1]`.  
        Simplifies to `V(p) = (8p - 6p²)/(1+p)`, maximized at `p ≈ 0.527` (not `2/3`).  
    - Thus, no policy satisfies both ex-ante optimality and sequential rationality.  

  - **Most Disqualifying Requirement**:  
    **Sequential rationality** (4) knocks out the most candidates, as it conflicts with ex-ante optimality in all non-trivial cases.  

  ---

  #### **Connection to Self-Locating Beliefs**  
  - **Sleeping Beauty Analogy**: This is a **self-locating belief problem** (like Sleeping Beauty), where the agent must assign probabilities to "where they are" in a sequence.  
  - **Extra Machinery Required**:  
    - **Time-Indifferent Policies**: Belief updates must account for the policy’s effect on state probabilities (e.g., `P(at first exit) ∝ 1`, `P(at second exit) ∝ p`).  
    - **Indexical Credences**: Credences must weight states by observer-moments, not just objective frequencies.  

  ---

  #### **Scoring Candidate Theories**  
  - **Causal Decision Theory (CDT)**:  
    Fails desideratum (2). Uses causal structure (e.g., "my action doesn’t affect past exits") but neglects that the policy updates beliefs about location. Leads to suboptimal `p`.  
  - **Evidential Decision Theory (EDT)**:  
    Fails desideratum (1). Overweights correlations (e.g., "continuing suggests I’m at the first exit") but ignores ex-ante consequences. May justify `p ≈ 0.527` but sacrifices `4/3` payoff.  
  - **Planning/Sophistication**:  
    Satisfies (1) and (2) if commitment is enforced. Fails (4) but intentionally prioritizes ex-ante rationality. The only approach achieving the `4/3` optimum here.  

  ---

  **Summary**: The core tension is between *ex-ante optimality* (achieved via commitment) and *sequential rationality* (achieved via re-optimization). An adequate theory must clarify randomization implementation and belief-policy consistency, while choosing between commitment (planning) or dynamism (re-optimization). No theory satisfies all desiderata, making this a benchmark for trade-offs in imperfect recall.
