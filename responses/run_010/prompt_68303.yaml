  ### Decision Tree for Superrationality Diagnostics  
  Based on the Platonia Dilemma and Luring Lottery cases, this tree isolates core commitments. Answer each node without referencing leaf labels.  

  1. **In Platonia, does causal independence of choices (your reply can't affect others) settle what you should do?**  
     - **Yes** → Go to 2  
     - **No** → Go to 3  

  2. **Does the stipulation that all agents are identical change what you should do?**  
     - **Yes** → Leaf: *Unnamed (causal but symmetry-sensitive)*  
     - **No** → Leaf: **Causal Decision Theorist**  

  3. **Is your choice (e.g., sending "yes") evidence about others' choices, even with no causation?**  
     - **Yes** → Go to 4  
     - **No** → Leaf: *Unnamed (rejects causation and evidence)*  

  4. **Is the "all reason alike" premise a stipulation of the case, or an empirical claim?**  
     - **Stipulation** → Go to 5  
     - **Empirical claim** → Go to 6  

  5. **Would you apply this reasoning to an ordinary 20-person Prisoner's Dilemma among strangers?**  
     - **Yes** → Leaf: **Universalizability Principle**  
     - **No** → Leaf: **Evidential Decision Theorist**  

  6. **"If I do X, they all do X" is best read as:**  
     - **Counterfactual dependence** → Go to 7  
     - **Conditional probability** → Go to 8  
     - **One decision taken many times** → Leaf: **Literal One Chooser**  

  7. **Does realistic uncertainty about correlation collapse the reasoning?**  
     - **Yes** → Leaf: **Collapse Under Uncertainty**  
     - **No** → Leaf: **Hofstadter’s Superrationalist**  

  8. **Is coordination achieved by a salient strategy + common knowledge?**  
     - **Yes** → Leaf: **Salience + Common Knowledge**  
     - **No** → Leaf: **Hofstadter’s Superrationalist**  

  ---

  ### Leaf Descriptions & Embarrassments  
  - **Causal Decision Theorist**: Ignores symmetry; recommends trying to be the sole "yes" in Platonia.  
    *Embarrassment: Cannot explain coordination in the luring lottery.*  
  - **Evidential Decision Theorist**: Uses own choice as evidence but confines reasoning to symmetric cases.  
    *Embarrassment: Arbitrarily restricts evidential reasoning to artificial symmetry.*  
  - **Universalizability Principle**: Treats symmetric cases as testing "what if everyone did this?" in all dilemmas.  
    *Embarrassment: Conflates moral reasoning with instrumental rationality.*  
  - **Literal One Chooser**: Believes N agents are metaphysically one entity deciding once.  
    *Embarrassment: Denies individual agency in ordinary decisions.*  
  - **Collapse Under Uncertainty**: Requires perfect correlation; fails under real-world noise.  
    *Embarrassment: Cannot justify coordination even in near-identical cases.*  
  - **Hofstadter’s Superrationalist**: Uses symmetry to infer identical actions, achieving coordination.  
    *Embarrassment: Relies on circular "we all think alike" without independent grounding.*  
  - **Salience + Common Knowledge**: Attributes coordination to focal points and shared knowledge.  
    *Embarrassment: Fails when no salient option exists (e.g., arbitrary lottery numbers).*  
  - *Unnamed (causal but symmetry-sensitive)*: Causalist who admits symmetry changes obligations.  
    *Embarrassment: Inconsistent with causal independence axioms.*  
  - *Unnamed (rejects causation and evidence)*: Denies both causal and evidential influence.  
    *Embarrassment: Offers no positive account of rational choice in Platonia.*  

