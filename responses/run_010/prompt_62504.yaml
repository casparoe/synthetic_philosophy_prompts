     We then assign a reason based on the steps. The reason should be one sentence that captures the main strength or weakness. For example: 
        - "Well-supported causal chain with attention to contingency, highly original premise, but writing was only adequate." 
        - "The essay was creative and well-written, but the long-term consequences were asserted without sufficient evidence."

     The judge must write the reason in the space provided.

  Judgment Calls Marked:
     - Step 3, Part B: Determining whether the essay acknowledges contingency and supports the chain with evidence is a judgment call. We mark it as such in the procedure by saying "judgment call: assess whether the essay acknowledges other possibilities and grounds the chain in evidence."
     - Step 4: Determining if the outcome is the author's wish and if countervailing factors are addressed is a judgment call. We say: "judgment call: does the outcome seem like the author's wish? If so, are countervailing factors addressed?"
     - Step 5: Originality and writing quality are judgment calls.

  Now, run the procedure on the three examples.

  Example 1: The library essay (great collection survives, early scientific transformation)

