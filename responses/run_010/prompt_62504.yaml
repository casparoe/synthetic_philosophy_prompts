  ### **Answer: Are Judges Just Checking Their Priors?**  
  **Short Answer**: **Partly, but the procedure exposes and contains it.**  
  - **Where Priors Creep In**: Step 3B (long-term contingency) and Step 4 (motivated reasoning) require ⚖️ judgments. A judge who believes "WWI was inevitable" might rate Essay 2 highly, but the procedure *forces them to check for evidence of multiple pressures*, not just agreement.  
  - **Why It’s Still Worth Using**:  
    1. **Steps 1–2 are objective**: They filter ~20% of essays (e.g., "horse travels 100 miles/day in 1200 AD") with no subjectivity.  
    2. **Priors are flagged, not hidden**: By marking ⚖️ steps, judges admit bias. The publishable reason (e.g., "ignored counterfactors") justifies scores transparently.  
    3. **It standardizes disagreements**: Judges who hate "inevitability" essays must still reward rigor (Essay 2). Those who love "what ifs" must penalize overconfidence (Essays 1 and 3).  
    4. **It answers the parent’s complaint**: "Majority preference" becomes "majority applying shared standards."  

  **Recommendation**: Use this procedure. It won’t eliminate subjectivity, but it makes bias visible, defensible, and secondary to observable flaws. For contested essays (e.g., the library piece), scores will reflect rigor gaps, not just taste.  

