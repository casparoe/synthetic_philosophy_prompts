     Part B: Long-term - the essay claims a scientific transformation centuries early. It must show the mechanism: how the preserved knowledge leads to a transformation. It must also acknowledge that the mere existence of the knowledge doesn't guarantee its use (social, economic, religious factors). If it does address these and shows how the conditions were ripe, then Part B=2. If it asserts without evidence, then Part B=0 or 1.

