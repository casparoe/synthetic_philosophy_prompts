prompt: |-
  I am a junior, and I edit my school's history journal. Three years ago, after a rainy club meeting with nothing on the agenda, I started an alternate-history essay competition as a joke between six of us; it has since grown into a regional contest that drew 118 entries this year from fourteen schools. The prize is a two-hundred-dollar gift card donated by an alumna who owns a bookshop downtown, plus publication in the spring issue, which we print in an edition of two hundred. Entries are judged by twelve students and two teachers: our AP European history teacher, who thinks the whole genre is unserious and votes accordingly, and the debate coach, who rewards any essay with clean structure no matter how wild its premise. Every judge gets the same three criteria — historical plausibility, argumentative rigor, originality — and every judge reads them differently. Last year's first-prize essay was one I loved and three judges considered nonsense, and afterwards the parent of an unplaced entrant wrote to the administration asking on what basis one fourteen-year-old's essay had been ranked below another's. We had no answer except that a majority preferred it. This year I want to hand each judge an actual procedure instead of three adjectives. The constraints are strict: entries run three to six thousand words, each judge reads eight of them in a single weekend, and the procedure has to be runnable in about twenty-five minutes per essay by a sixteen-year-old with no training in philosophy or historiography, fit on one page, and end in a score we can publish alongside a stated reason. Please do not give me a bibliography or a list of works for judges to consult; nobody will read it and I have no way to chase down sources myself. Whatever the procedure rests on has to be stated inside it, in ordinary language.

  Here is what the procedure has to handle, described the way I see it in the slush pile rather than in any technical vocabulary. There are essays whose starting event is perfectly reasonable but whose account of the world before that event quietly rearranges the past so the change will fit: a character in an earlier century holding beliefs, or getting hold of information, or using an institution that did not actually exist yet, and the essay never mentions that it has done this. There are essays that argue the opposite of what the form seems to want — the divergence happens, and the whole point is that the outcome was coming anyway, because several separate pressures would each have produced it or something like it on their own — and I genuinely do not know whether that is a failure to deliver consequences or the most rigorous thing an entrant can do; my two teachers disagree about it in exactly this way. There are essays where a trivial accident, a horse going lame or a clerk misfiling a letter or a storm delaying a ship by two days, is claimed to generate a confident, detailed, chapter-by-chapter chain of consequences over fifty years; I can see the case both ways, that the author has found a real causal hinge or that the author is claiming a precision no evidence could ever support, and I suspect the second much more often than the first, but I have no idea how a judge is supposed to tell them apart. There are essays where the divergence and everything downstream are selected so that the result is the world the author obviously wishes for, and I want a way for a judge to notice this that does not simply become a penalty for conclusions the judge disagrees with politically — I am worried that any test for motivated reasoning collapses into that. There are essays whose starting event could not have occurred at all given the technology, geography, or institutions of the period. And there are essays where the divergence is so early and so total that nothing in the actual past constrains what follows, the sort where a famous library does not burn and the entire subsequent history of knowledge is up for grabs, which seems to me impossible to evaluate and yet reliably produces the most beautiful prose.

  Please write the procedure itself: the tests a judge runs, in the order they should be run, what counts as a sufficient answer to each, where the procedure stops and assigns a low score outright, and where it hands the decision to the judge because the question is one of taste or of values rather than of anything a rubric can settle. Tell me which distinctions have to survive the simplification into a one-page sheet and which I can safely drop, and mark the steps that are really judgment calls wearing a procedure's clothes — I would rather label them than discover them during an appeal. Then run it on three entries. First: the library essay, in which the great collection survives and the essay argues that an early modern scientific transformation arrives several centuries ahead of schedule; six of my fourteen judges have already told me it is the best thing submitted this year, it is my personal favorite, and if the procedure scores it poorly I want to know that now rather than find out while defending the results. Second: an essay whose divergence is an avoided political assassination in the summer of 1914 and whose thesis is that a general European war arrives within a few years regardless, though with different participants and a different opening crisis. Third: an essay in which a misfiled telegram in the 1890s prevents a short colonial war and then, across four chapters, redrafts the alliance system of the entire following century. Finally, I want you to answer the question underneath all of this, which is whether any judge is checking anything at all beyond their own priors. If the honest answer is that the plausibility score mostly records whether the judge already thought the outcome likely, then build the procedure so it says so out loud at the relevant step instead of pretending otherwise, and tell me whether it is still worth running. Take a definite position on the contested cases rather than surveying the options — on whether the inevitability essay is being rigorous or ducking the assignment, and on whether confident long-range detail from a trivial divergence should be rewarded or penalized — and give your reasons, because my judges will ask me precisely that and a rubric containing the phrase reasonable judges may differ is worse than no rubric at all.
reasoning: |-
  We are designing a judging procedure for an alternate-history essay competition. The procedure must be:
  - Runnable in about 25 minutes per essay by a 16-year-old with no training.
  - Fit on one page.
  - End in a score and a stated reason for publication.
  - Handle the specific issues described.

  The procedure will have a series of tests (steps) that the judge runs on each essay. Each test will have clear criteria for what counts as sufficient, and we will indicate where the procedure stops (assigning a low score) and where it hands the decision to the judge (because it's a matter of taste).

  We are to take a definite position on contested cases.

  The procedure must address:
  1. Essays that rearrange the past without mentioning it (e.g., anachronisms).
  2. Essays that argue the outcome was inevitable regardless of the divergence (the "inevitability" essay).
  3. Essays that trace long chains of consequences from trivial accidents (and whether that is valid).
  4. Essays that are clearly motivated by the author's wishful thinking (without penalizing for political disagreement).
  5. Essays with a divergence that couldn't have happened (due to technology, geography, institutions).
  6. Essays with very early and total divergences (like a library not burning) that lead to a completely different world.

  We are to run the procedure on three examples:
  1. The library essay (great collection survives, leading to early scientific revolution).
  2. The 1914 assassination avoided, but war inevitable.
  3. The 1890s misfiled telegram preventing a colonial war and redrafting the alliance system.

  Finally, we must answer whether the judge is just checking their own priors and, if so, build the procedure to admit that and then decide if it's still worth running.

  Structure of the Procedure:

  We will have a score out of 10 (or similar) but we might break it into parts. However, the output must be a single score and a reason.

  Alternatively, we can have a checklist and then a final score. But the requirement is a score we can publish.

  We are to mark the steps that are judgment calls.

  The Procedure:

  We'll have 4 main sections (which we can call Steps 1 to 4) and then a scoring step. Each step is designed to be quick.

  Step 1: Check for Basic Plausibility of the Divergence
  - This step checks if the divergence event could have happened at all in the historical context.
  - If the divergence is impossible (given technology, geography, institutions of the time), then the essay fails and gets a low score (say, 1 or 2 out of 10) and we stop. The reason: "The divergence event is historically impossible because [brief reason]."

  Step 2: Check for Anachronisms in the Setup
  - Here we look for the essay quietly rearranging the past to make the divergence fit. The judge should check the world before the divergence: are there any beliefs, information, or institutions that did not exist at the time? If so, and if the essay does not acknowledge and justify this rearrangement, then it's a flaw.
  - If there are major anachronisms that are not acknowledged, the essay gets a low score (say, 3 out of 10) and we stop. The reason: "The essay relies on anachronisms in the setup without justification."
  - If there are minor anachronisms that are acknowledged, then we note it but move on. If none, good.

  Step 3: Evaluate the Causal Chain
  - This step is the core and has two parts.

    Part A: Trace the immediate consequences (within 1-5 years) of the divergence. The judge asks: Does the essay provide a clear and plausible mechanism for how the divergence leads to the next step? The judge should look for:
      - Whether the connections are explained (not just asserted).
      - Whether the connections are consistent with what we know about the historical actors and institutions.

    Part B: Evaluate the long-term consequences (beyond 5 years). Here we have to take a position on the contested case of long chains from trivial events. Our position: 
      - We reward detailed chains only if they are accompanied by an acknowledgment of uncertainty and alternative possibilities, or if they are supported by historical evidence (even if speculative, it must be grounded). 
      - If the essay claims a precise, step-by-step chain over decades from a trivial event without any discussion of contingency or other factors, then it is penalized for overconfidence.

    Our stance: It is acceptable to have long chains, but the essay must show awareness that history is contingent and that small changes might be absorbed or lead to different outcomes. If the essay does this, then the detail is rewarded. If it presents the chain as inevitable and without alternatives, then it is penalized.

    How to judge: 
      - If the essay acknowledges that other outcomes were possible and explains why this one is more likely, that is good.
      - If the essay presents the chain as the only possible outcome without evidence that each step must happen, then it is overconfident.

    Also, we take a position on the "inevitability" essay: 
      - Arguing that the outcome was inevitable is acceptable and can be rigorous if the essay shows that multiple independent pressures would lead to the same outcome. However, the essay must not use the divergence as a mere placeholder. It must engage with the counterfactual: what would have happened without the divergence? And then show that the same outcome arises anyway. 
      - But note: if the essay uses the divergence and then argues that the outcome was going to happen regardless, that is acceptable only if the divergence does not play a crucial role in the outcome. If the divergence is avoided (as in the 1914 example) and then the war happens anyway, that is a valid argument.

    How to score Part A and Part B? We can have a 0-2 scale for each (0 = poor, 1 = fair, 2 = good). But we need to be able to fail an essay in this step? Actually, we don't necessarily stop, but we assign a low score in the final step.

  Step 4: Check for Motivated Reasoning
  - We want to detect if the essay is constructed to lead to a desired world without penalizing for the judge's political disagreement. How?
    - We look for patterns: Does the essay ignore inconvenient facts? Does it overemphasize factors that support the desired outcome? Does it downplay or omit factors that would work against it?
    - But note: this is a judgment call. We can't avoid it entirely. So we build a test that focuses on internal consistency and historical evidence.

    The test: 
      - The judge should ask: "Does the essay consider and address at least one major factor that would work against the desired outcome?" 
      - If the essay does, then it passes. If it ignores obvious countervailing factors, then it is penalized.

    We do not penalize the essay for having a desired outcome, only for failing to engage with counterarguments.

  Step 5: Originality and Presentation (but note: the criteria are plausibility, rigor, originality. We must cover all three.)

  We have three criteria. Our steps:

  Step 1 and 2: Plausibility (of the setup)
  Step 3: Rigor (of the causal chain)
  Step 4: We are also addressing rigor (by checking for motivated reasoning) and plausibility (by checking the chain). But we also have originality.

  We might need a separate step for originality? But note: the procedure must be quick. Originality can be judged by the judge in a straightforward way: is the divergence or the chain of events novel and creative? But we don't want to overcomplicate.

  Alternatively, we can break the scoring into three parts, each scored 0-3, and then sum. But the output must be a single score and a reason.

  We design a scoring system:

  - The total score is out of 10.
  - Steps 1 and 2 are pass/fail. If failed, we assign a low score and stop.
  - Steps 3 and 4 are scored on a scale (say 0-4 for Step 3, 0-2 for Step 4, and then 0-4 for Originality and Writing?).

  But note: the procedure must end in a score and a reason. The reason must be stated and based on the steps.

  Alternatively, we can have:

  After each step, we might have to stop (for Steps 1 and 2). For Steps 3 and 4, we assign points.

  But we also need to account for the third criterion: originality. And we haven't addressed the "early and total divergence" case (like the library) which might be hard to evaluate.

  For the library essay: we cannot evaluate the long-term consequences with the same rigor because the world changes so much. Our stance: 
    - Such essays are allowed, but they must still have a plausible mechanism for how the preservation of the library leads to the early scientific revolution. They must show the transmission of knowledge and the social conditions that allow it to be used. If they do that, then they can be scored well. But if they just assert that the knowledge would be used without showing how, then they are weak in rigor.

  Now, the procedure:

  We need to fit on one page. So we'll write it as a numbered list.

  The Procedure for Judging an Alternate-History Essay

  Time: Aim for 25 minutes per essay.

  Materials: The essay, a pen, and this sheet.

  Step 1: The Divergence Check (5 minutes)
     - Read the description of the divergence event (the point where history changes). Ask: Could this event have happened given the technology, geography, and institutions of the time? 
     - If NO, then stop. Score: 2 out of 10. Reason: "The divergence event is historically impossible because [state reason]."
     - If YES, or if the essay does not specify the divergence clearly, proceed to Step 2.

  Step 2: Anachronism Check (5 minutes)
     - Look at the world before the divergence. Does the essay introduce any anachronism (e.g., beliefs, information, institutions that did not exist at the time) to make the divergence fit? 
     - If YES and the essay does not acknowledge and justify it (e.g., by explaining an earlier development that led to it), then stop. Score: 3 out of 10. Reason: "The essay relies on unacknowledged anachronisms in the setup."
     - If NO, or if any anachronism is justified, proceed to Step 3.

  Step 3: Causal Chain Evaluation (10 minutes)
     - Part A: Immediate Consequences (within 5 years). Does the essay provide a clear and plausible mechanism for how the divergence leads to the next events? Check that the connections are explained (not just asserted) and consistent with historical actors and institutions.
       - If the immediate chain is not plausible, note the weakness and proceed (but the final score will be lowered).
     - Part B: Long-Term Consequences (beyond 5 years). Does the essay:
          a) Acknowledge that other outcomes were possible? (Look for words like "might have", "could have", or a discussion of alternatives.)
          b) Support each step with historical evidence (even if speculative, it should be grounded in what we know about the period)?
       - If the essay presents a long chain of consequences from a trivial event without acknowledging contingency or without evidence for the necessary steps, then it is overconfident and should be penalized.
     - Our stance on the inevitability thesis: It is acceptable if the essay uses the divergence to show that the outcome would have happened anyway by demonstrating multiple independent pressures. However, the essay must still show how the absence of the divergence (or the altered event) fits into the broader picture and why the outcome was inevitable.

     Scoring for Step 3 (to be used in the final score):
       - Part A: 0 (poor), 1 (fair), 2 (good)
       - Part B: 0 (overconfident or unsupported), 1 (some acknowledgment and evidence), 2 (well-supported and acknowledges contingency)

     But note: we are not stopping here. We proceed to Step 4.

  Step 4: Motivated Reasoning Check (5 minutes)
     - Does the essay seem to lead to a world the author might wish for? (This is a judgment call, but focus on the internal features.)
     - If so, does the essay address at least one major factor that would work against the desired outcome? (For example, if the essay leads to a world without war, does it address the factors that cause war and how they are overcome?)
     - If the essay ignores obvious countervailing factors, then it is flawed. 
     - Score for Step 4: 0 (ignores countervailing factors), 1 (addresses at least one countervailing factor).

  Step 5: Originality and Quality of Writing (Quick Assessment)
     - Originality: Is the divergence or the chain of events novel and creative? (Avoid common tropes if possible, but not penalized if well done.) Score: 0 (unoriginal), 1 (somewhat original), 2 (highly original).
     - Quality of Writing: Is the essay well-structured and clear? (This is the debate coach's favorite.) Score: 0 (poorly structured), 1 (adequate), 2 (excellent).

  Final Scoring:
     - If the essay was stopped in Step 1 or 2, the score is already assigned.
     - Otherwise, total score = (Part A from Step 3) + (Part B from Step 3) + (Step 4 score) + (Originality) + (Quality of Writing) + 1 (for passing Steps 1 and 2). 
       This gives a score from 0 to 10.

     Why add 1? Because if they passed Steps 1 and 2, they get at least 1 point. Then the rest: Part A (0-2), Part B (0-2), Step 4 (0-1), Originality (0-2), Writing (0-2). Total: 1 + (0-2) + (0-2) + (0-1) + (0-2) + (0-2) = 1 to 10.

