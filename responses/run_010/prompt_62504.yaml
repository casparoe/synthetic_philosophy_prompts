  Answering the underlying question: Are judges just checking their own priors?

  We have built the procedure to minimize that by:

  1. Focusing on specific, observable features of the essay (anachronisms, acknowledgment of contingency, addressing counterarguments).
  2. Breaking down the evaluation into steps that require the judge to look for evidence in the essay.

  However, in Step 3 (evaluating the causal chain) and Step 4 (motivated reasoning), there is still room for the judge's prior beliefs about history to influence their assessment of what is plausible. We cannot eliminate this entirely. 

  But note: the procedure forces the judge to articulate reasons based on the essay's content. For example, in Step 3, the judge must look for the essay's own acknowledgment of contingency and grounding in evidence. In Step 4, the judge must look for the essay's treatment of countervailing factors.

  Moreover, we have marked the judgment calls. We are not pretending that the procedure is entirely objective.

  Is it still worth running? Yes, because:

  - It provides a common framework for judges, so they are at least looking at the same aspects.
  - It catches the most egregious errors (impossible divergence, anachronisms).
  - It encourages the judges to focus on the essay's internal rigor rather than just their own opinions.

  But we must be transparent: the scores will reflect the judge's interpretation of the essay's handling of the criteria. We are not eliminating subjectivity, but structuring it.

  Final Note: The procedure is designed to be one page. We'll format it accordingly.

  Now, we write the procedure as a one-page document.
answer: |-
  Below is the judging procedure designed for your competition. It fits on one page, requires no external sources, and can be executed in 25 minutes per essay by a 16-year-old. The procedure is structured as a checklist with clear pass/fail gates for critical flaws, followed by scored sections for nuanced evaluation. Judgment calls are explicitly marked (with a ⚖️ icon) to flag steps where subjectivity is unavoidable. Each step includes what constitutes a "sufficient" answer and where to stop for a low score.  

  **SCORING OUTPUT**: A single score (1–10) and a one-sentence published reason (e.g., "Score: 8/10. Strong causal chain but underdeveloped contingency analysis.").  

  ---

  ### **Alternate-History Essay Judging Procedure**  
  *Time: 25 min/essay | Judge: Circle answers & sum scores*  

  #### **STEP 1: DIVERGENCE PLAUSIBILITY (Pass/Fail)**  
  *Check if the change could happen.*  
  - **Q1:** Could the divergence event (e.g., a storm, assassination, or decision) occur given the period’s **technology, geography, and institutions**?  
    - ✅ **Yes** → Proceed to Step 2.  
    - ❌ **No** → Stop. **Score: 2/10**. Reason: "Divergence event is historically impossible."  
    *Example: A telegram misfile in 1890 is possible; a radio broadcast in 1700 is not.*  

  #### **STEP 2: SETUP HONESTY (Pass/Fail)**  
  *Check for hidden rearrangements of the past.*  
  - **Q2:** Does the essay **explicitly state or justify** any beliefs, information, or institutions used *before* the divergence that didn’t exist then?  
    - ✅ **Yes/Not needed** (no anachronisms found) → Proceed to Step 3.  
    - ❌ **No** (anachronisms present, unacknowledged) → Stop. **Score: 3/10**. Reason: "Unjustified anachronisms in setup."  
    *Example: A medieval king using Enlightenment-era economics without explanation fails.*  

  #### **STEP 3: CAUSAL CHAIN RIGOR (Score 0–4)**  
  *Evaluate cause-effect logic. ⚖️ = Judgment call.*  
  - **Part A: Short-Term Mechanism (0–2)**  
    - After divergence, does the essay **explain (not just assert)** *how* the next 1–5 years unfold?  
      - **0**: No mechanism (e.g., "War happens because tensions rose").  
      - **1**: Partial mechanism (e.g., "Diplomat X intervened, easing tensions").  
      - **2**: Full mechanism (e.g., "Diplomat X exploited Rival Y’s ambition by offering Z, documented in their letters").  

  - **Part B: Long-Term Contingency (0–2) ⚖️**  
    - For effects beyond 5 years, does the essay **admit uncertainty or alternatives**?  
      - **0**: Claims inevitable, step-by-step outcomes *without* evidence (e.g., "This *caused* 50 years of peace").  
      - **1**: Acknowledges contingency vaguely (e.g., "This *might* lead to peace").  
      - **2**: Uses evidence to weigh likelihoods (e.g., "Peace was *likely* because Factor A outweighed Factor B, per Treaty C").  
    *Position on trivial accidents/long chains: Reward only if Part B ≥1. Precision without contingency is overconfidence.*  

  #### **STEP 4: MOTIVATED REASONING CHECK (Score 0–1) ⚖️**  
  *Detect wishful thinking without penalizing politics.*  
  - **Q3:** If the outcome aligns with common "wishful" scenarios (e.g., utopias, avoided disasters), does the essay **address ≥1 strong countervailing factor**?  
    - **1**: Yes (e.g., "Even with peace, Nationalism would pressure leaders").  
    - **0**: No (e.g., Ignores economics/ideology that would resist outcome).  
    *Key: Focus on missing counterarguments, not the outcome’s desirability.*  

  #### **STEP 5: ORIGINALITY & CLARITY (Score 0–3)**  
  *Quick holistic review.*  
  - **Originality (0–2) ⚖️**:  
    - **0**: Clichéd divergence/trope (e.g., "Hitler wins WWII").  
    - **1**: Familiar premise, fresh angle (e.g., "Library survives but triggers religious backlash").  
    - **2**: Highly novel (e.g., "Mongol fishing rights alter ocean trade").  
  - **Clarity (0–1)**:  
    - **0**: Confusing structure.  
    - **1**: Clean, logical flow.  

  #### **FINAL SCORE CALCULATION**  
  - **Total** = Step 3 (A+B) + Step 4 + Step 5 + 3 (if passed Steps 1–2).  
    *Range: 3 (min) to 10 (max).*  
  - **Publishable Reason**: Use weaknesses/strengths from Steps 3–5 (e.g., "Weak long-term contingency" or "Strong originality, clear writing").  

  ---

  ### **Applied to Your Three Essays**  
