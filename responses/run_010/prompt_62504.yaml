  Example 3: The 1890s misfiled telegram preventing a colonial war and redrafting the alliance system.

  Step 1: Divergence - a misfiled telegram. Possible? Yes, it's a small accident.
  Step 2: Anachronism? Probably none. Pass.
  Step 3:
     Part A: Immediate - preventing a colonial war. The essay must explain how the telegram misfiling prevents the war (e.g., by delaying mobilization and allowing diplomacy). If it does, Part A=2.
