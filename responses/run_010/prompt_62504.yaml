     Originality: Highly original? Probably, so 2.
     Writing: Beautiful prose, so 2.

  Total score = 1 (for passing Steps 1-2) + 2 (Part A) + 2 (Part B) + 1 (Step4) + 2 (Orig) + 2 (Writing) = 10.

  But wait: if the essay does not address countervailing factors, Step4=0, then total=9. Still high.

  Example 2: The 1914 assassination avoided, war inevitable.

  Step 1: Divergence - avoiding an assassination. Possible? Yes.
  Step 2: Anachronism check? Probably none. Pass.
  Step 3:
     Part A: Immediate consequences? The essay might argue that without the assassination, the tensions remain and another crisis erupts. It should explain how the crisis would develop (e.g., over the next few years). If it does, Part A=2.
