answer: |-
  ## The Joke

  A peahen scrutinises a magnificent peacock fanning his iridescent train. "Honestly," he declares, "it’s a perfectly honest signal of my fitness! The cost *differential* ensures honesty – while it might cripple a lesser bird, for a male of my calibre, maintaining this splendour is remarkably cheap." The peahen cocks her head, unimpressed. "Cheap? It’s the most extravagantly wasteful thing I’ve ever seen." The peacock puffs his chest. "Precisely! That’s *why* it’s reliable. The waste proves I can afford it." The peahen pauses, then replies drily: "So, your proof of affordability hinges on demonstrating extreme waste... while simultaneously insisting it *isn’t* actually wasteful *for you*. How remarkably convenient that the one thing you claim makes it cheap is precisely what I can’t audit."

  ## Note
  This punchline primarily turns on **Point 3 (Zahavi's Embarrassment)**: The peacock’s explanation highlights the necessary wastefulness of the signal, which paradoxically undermines his claim about its *personal* affordability – the very thing the peahen cannot verify. It secondarily invokes **Point 2 (Differential Cost & Budget Honesty)**: His boast relies on the Grafen concept that the *differential* cost (low for him, high for low-quality males) ensures honesty, framing it as a matter of his "budget". Swapping the display (e.g., to a deer's roar) would likely lose the visual impact of the sheer, undeniable extravagance central to highlighting the paradox between claimed low personal cost and observable waste. The train's physical grandeur makes the "audit" impossibility immediately obvious.
