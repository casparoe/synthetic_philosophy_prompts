  First, I’ll brainstorm readings. The proverb’s ambiguity is key—it could be causal (karmic mechanics), psychological (guilt/regret), normative (desert), or institutional (who inflicts punishment). Must avoid superficial "just-world" clichés. The user mentioned karma’s threefold division (accumulated, fructifying, current), so I’ll leverage that: some schools see karma as inexorable, others as mitigable. Also, Plato’s "injustice harms the doer" fits a psychological angle. 

