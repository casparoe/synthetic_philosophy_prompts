  Hmm, this is an intricate legal philosophy problem wrapped in a fictional jurisdiction. The user is a rising senior participating in a legal philosophy institute centered on Karvenia's Constitutional Court, and they need help analyzing a case about the Marital Authorization Act of 1998. The core tension is whether the court follows natural law or legal positivism, but the instructor insists it's more nuanced.

  First, I need to unpack the court's five prior decisions to identify patterns. The 1989 conviction was voided due to procedural failures (secret trials, unpublished directives), aligning with Fuller's inner morality of law. The boiler regulation was upheld despite regime illegitimacy, showing positivist separation of validity from morality. The school disqualification case was sidestepped on narrow grounds, avoiding the validity question. The pension stripping was upheld retroactively under "manifest injustice," invoking moral reasoning. The farmland expropriation was voided for targeting specific individuals and serving illegitimate purposes, blending content and procedural concerns.

  For the marital law case, the Act is procedurally perfect but substantively unjust. The user wants candidate decision rules that fit all precedents. I can see at least five approaches:
  - Content-based threshold (Radbruch-like): Invalidates laws crossing an injustice threshold
  - Procedural/Fullerian: Focuses solely on lawmaking defects
  - Incorporationist: Uses Article 2 equality as a validity criterion
  - Remedial positivism (Hart-like): Treats "void ab initio" as moral choice, not validity claim
  - Minimalist: Always finds narrow grounds to avoid jurisprudential questions

  Predictions diverge on remedy: content-based and incorporationist rules would void the Act entirely, making the registration valid from the start. Procedural and minimalist approaches might uphold the Act but potentially repair via Article 20. Remedial positivism could go either way but frame it as policy choice.

  The farmland expropriation case (2024) seems the closest analog - both involve property rights and content-based injustice. But key differences exist: the expropriation targeted specific individuals, while the marital law applies generally. This distinction might push the court toward repair rather than invalidation.

  If precedents underdetermine, the court would implicitly endorse either: 
  - Ruling for estate: That procedural compliance suffices for validity regardless of injustice
  - Ruling for woman: That extreme substantive injustice alone can invalidate law

  A clean test case would be a procedurally sound Directorate law imposing life imprisonment on left-handed people - this would force the court to choose between procedural purity and substantive justice.
answer: |-
  Based on Karvenia's Constitutional Court precedents and jurisprudential tensions, here's a systematic analysis:

  **Candidate Decision Rules (Fitting All 5 Precedents):**
  1. **Procedural Legality (Fuller-Inspired):** Law requires congruence, publicity, non-retroactivity, clarity, non-contradiction, feasibility, constancy, and impartial application. *Article 14 voids laws failing these criteria.*  
  2. **Substantive Threshold (Radbruch-Inspired):** Laws lose validity when "intolerably unjust" or serving illegitimate purposes (e.g., persecutory targeting). *Article 14 voids laws crossing this threshold.*  
  3. **Incorporationism:** The 2021 Constitution's Article 2 (equal dignity) provides validity criteria for *all* laws. *Article 9 invalidates pre-2021 laws inconsistent with Article 2.*  
  4. **Remedial Positivism (Hart-Inspired):** Validity is separate from morality. "Void *ab initio*" is a post-hoc remedial label for moral/political reasons. *Article 14 is a remedy for manifest injustice.*  
  5. **Minimalism:** The Court avoids broad validity questions. *Article 14 is limited to extreme procedural defects or named-targeting, otherwise using Article 20 for repairs.*

  **Predictions for the 1998 Marital Authorization Act:**
  | **Rule**               | **Was the Act "Law"?** | **Remedy**                                  | **Reasoning for Woman's Registration**     |
  |------------------------|------------------------|---------------------------------------------|-------------------------------------------|
  | **Procedural Legality**| Yes                    | Article 20 repair order (validate registration) | Act met all procedural criteria; injustice is substantive, not formal |
  | **Substantive Threshold**| No (void *ab initio*) | Article 14 invalidation + restitution      | Act is "intolerably unjust" by stripping dignity/capacity based on sex |
  | **Incorporationism**   | No                     | Article 14 invalidation                    | Act violates Article 2 equality, thus invalid under Article 9 |
  | **Remedial Positivism**| Yes (but voided)       | Article 14 "remedy" for injustice          | Moral choice to void due to injustice, not validity claim |
  | **Minimalism**         | Avoided                | Article 20 repair order                    | Narrow ground: estate lacks standing post-husband’s death? |

  **Best Prediction & Reasoning:**  
  The Court will hold the **Act was not law (void *ab initio* under Article 14)** and **validate the 2011 registration**, using a **Substantive Threshold rule**.  

  **Why this over alternatives?**  
  - **Precedential alignment:** The 2024 farmland case voided a *published, procedurally sound law* due to content (targeted taking for politics). The marital law similarly uses legal form to enforce systemic inequality (sex/marital status), violating "equal dignity" (Art. 2).  
  - **Language balance:** The Court’s two content-based voidings (1989 conviction, farmland) and one procedure-based upholding (boiler rule) show it uses *both* criteria, but reserves Article 14 for severe injustice.  
  - **Article 20 avoidance:** Granting an Article 20 repair here would imply the Act was valid but unjust—contradicting the farmland case where restitution followed invalidity.  
  - **Jurisprudential clarity:** The Court has avoided defining Article 14 until now. A substantive threshold resolves the reserved question from the 1994 disqualification case.  

  **The Closest Analog:**  
  The **2024 farmland expropriation case** is the strongest parallel:  
  - **Similarities:** Both involve property rights; both burden a defined group (named family vs. married women); both use law for oppressive social control.  
  - **Differences:** Farmland law targeted specific individuals; marital law applies generally. *This distinction is overcome by the Court’s "illegitimate purpose" logic:* "taking a family’s livelihood for politics" (farmland) ↔ "stripping legal capacity for sex/marriage" (marital law).  

  **If Precedents Underdetermine:**  
  - **Ruling for estate:** Commits to *formalism*: Procedural compliance suffices for validity regardless of substantive injustice.  
  - **Ruling for woman:** Commits to *anti-oppression principle*: Laws designed to entrench systemic degradation cannot be valid.  

  **Test Case to Distinguish Rules:**  
  *"A 1995 Directorate statute imposing life imprisonment on left-handed people for ‘genetic sabotage,’ enacted and applied with full procedural regularity."*  
  - **Procedural rule:** Upholds as valid law (no formal defect).  
  - **Substantive threshold:** Voids *ab initio* (intolerable injustice).  
  - **Incorporationism:** Voids (violates Art. 2 dignity).  
  - **Remedial positivism:** "Voids" as moral remedy but affirms past validity.  
  - **Minimalism:** Avoids validity question; voids under Art. 20 if imprisonment ongoing.  

  **Clerk’s Recommendation:**  
  For maximal consistency, the Court should **void the Act under Article 14** and **validate the registration**. The farmland precedent (content-based voiding) controls, and applying Article 20 here would create dissonance: if the targeted farmland taking was "not a rule," the systemic disenfranchisement of women cannot be law either. The Court would cement a **Radbruch/Fuller hybrid doctrine**: laws lose validity when they (1) fundamentally deny human dignity *and* (2) serve no legitimate public purpose. This respects both procedural rigor (boiler case) and substantive justice (farmland case), while answering the reserved question from 2023.
