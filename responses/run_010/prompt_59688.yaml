prompt: |-
  Just had a four-hour row with my brother about Kelly betting and I still don't know who's right, which is why I'm asking you instead of him.

  My aunt Dot stands down on Saturday as treasurer of a small friendly society — twenty-six years in the job, about three hundred members, and a reserve fund she treated like a living thing. The dinner will be half members and family who couldn't tell you what a logarithm is, and half people from the auditor's office plus two economists who've come because they know about 2008. That year a lender offered the society a deal that would roughly have doubled its annual returns but required putting the whole reserve behind it as security. She turned it down and got shouted at for months.

  Her rule was the 'one bad winter' rule: no single decision may be able to take more than a fifth of what it would cost to rebuild. She always said the question is never whether a bet is good, only how much of it you can afford to be wrong about.

  Write the speech I'm giving — five minutes, in British English. It has to make the growth-rate-versus-average-outcome idea land with the members without a single equation, the word 'optimal', or any mention of utility functions, and it has to face down the economists' objection that with one shot and no next round there is no long run to be rational about. Don't be neutral on 2008: my brother says she was squeamish and got lucky, I think she was right for reasons she couldn't have articulated. Pick a side and make it convincing to both halves of the room. One good joke, and end on affection rather than a lesson.
reasoning: |-
  Okay, the user needs a five-minute speech for their aunt Dot's retirement dinner. Let me start by understanding the key points. Aunt Dot managed a society's reserve fund with her "one bad winter" rule, rejecting a high-risk deal in 2008 that could have doubled returns but risked the entire reserve. The user had a row with their brother about Kelly betting, which relates to optimal bet sizing based on expected value and bankroll.

  The speech has to explain growth-rate vs. average outcome without equations, "optimal," or utility functions. The audience is split: half are non-experts, half are economists/auditors. The economists might argue that with no repeated bets, the long run doesn't apply. Need to refute that. Also, the user wants to side with Dot, arguing she was right, not lucky. Include a joke and end affectionately.

  First, structure the speech. Start with a warm intro, then explain the one bad winter rule. Contrast growth and average outcomes with a relatable analogy. Address 2008 specifically, countering the one-shot objection. Use the economists' own terms like "expected value" but make it accessible. The joke should lighten the mood—maybe about economists' complexity. End with personal affection for Dot.

  Key points: Dot's rule was about survival, not just avoiding losses. Even one bet can wipe you out, so sizing matters. Emphasize that the reserve's purpose is protection, not just growth. Use the house analogy: rebuilding after a storm. For the economists, argue that expected value ignores ruin risk. Stress that one decision can end the game, so caution is rational.

  Need to ensure the growth concept is clear. Growth isn't just averages; avoiding ruin allows compounding over time. But since 2008 was a one-off, frame it as preserving the society's existence. The reserve isn't for gambling but for security. Dot's wisdom was in prioritizing sustainability over greed.

  Check the user's deeper needs: they want validation for Dot's decision, to honor her legacy, and resolve the brother's argument. The speech must unify the audience, respect both sides, and leave everyone appreciating Dot's prudence. Avoid jargon, keep it heartfelt. The joke about economists adds humor without alienating. Ending on affection ties it all together.
answer: |-
  Right, let's settle this. Here’s the speech – five minutes, British to the core, honouring Dot and hopefully silencing your brother (and the economists):

  **(Adjust microphone, warm smile towards Aunt Dot)**

  "Ladies, Gentlemen, Friends of the Society… and our visiting number-crunchers! Welcome. We’re here tonight for one simple, brilliant reason: Dot. Twenty-six years guiding this Society’s purse strings like a master gardener tending a prize-winning rose. She didn’t just watch the numbers; she *felt* them. She knew that reserve wasn’t just digits on a page – it was warmth in winter, a roof over heads, the quiet certainty that lets us sleep at night.

  Dot had a rule. A simple one, born of deep care: the ‘one bad winter’ rule. *No single decision could risk more than a fifth of what it would cost to rebuild.* Sounds sensible, doesn’t it? Like not betting the farm on a single horse, even if the odds look tempting. But Dot understood something deeper, something crucial about how things *really* grow over time.

  Imagine you’re running a bakery. You hear about a fantastic deal on flour – buy a lorry-load, get double your money back in a month! On *average*, it sounds marvellous. The ‘expected return’, as our economist friends might murmur, is excellent. But what if that lorry crashes? What if the flour’s mouldy? If you’ve staked *everything* on that one lorry... well, you’re not baking tomorrow, are you? You’re out of business. The *average* outcome looked lovely, but the *path* you actually walk – surviving, trading day after day – got wiped out by one bad roll of the dice.

  **(Look pointedly at the economists, friendly but firm)**

  Now, I know some sharp minds here might think: "Ah, but what if it’s a one-off? No ‘next round’? Why not go for broke?" And to that, Dot’s rule gives the perfect answer. Because even with one shot, the *size* of the bet *utterly changes* what you’re risking. It’s not just about the *chance* of winning; it’s about the *cost* of losing. Staking the whole reserve isn’t just a gamble on the market; it’s a gamble on the *very existence* of this Society. Dot understood that beautifully. The purpose of our reserve isn’t primarily to chase the highest possible *average* number on a spreadsheet. Its sacred job is to *be there*. To endure. To be the foundation everything else is built on. Growth that risks annihilation isn’t growth; it’s recklessness disguised as ambition.

  Which brings us, inevitably, to 2008. That tempting offer landed – double the returns! All we had to do was put *everything*, the whole reserve, on the line. Dot said no. And yes, she got shouted at. My brother over there – **(gesture good-naturedly)** – bless him, probably still thinks she was being a bit squeamish, got lucky when the whole house of cards came tumbling down. But luck had nothing to do with it. Dot wasn’t predicting the future; she was *protecting* it. She looked at that bet, saw it broke her ‘one bad winter’ rule spectacularly, and knew the potential cost of being wrong was the Society itself. Not losing *some* money. Losing *everything*. And when the storm hit later that year? Well. While others were swept away, our Society stood firm. Not because Dot got lucky guessing the storm, but because she’d *already built the flood defences*.

  **(Lighten the tone, smile at the economists)**

  It’s a bit like telling an engineer their bridge design is ‘sub-optimal’ because it’s got too many supports. They’d rightly say: ‘Optimal for what? Holding the weight, or winning a beauty contest with mathematicians?’ The economists might prefer a sleek, minimalist bridge mathematically perfect on paper... until the first strong wind. Dot built a bridge designed to *last*, come rain or shine. Or, dare I say it, come financial hurricanes.

  So, Dot, on behalf of every member, past and present: Thank you. Thank you for your extraordinary care, your formidable common sense, and your unwavering understanding that true strength lies not in the flashiest gamble, but in the quiet, resilient power of playing a long game – even when the ‘long game’ means protecting us from a single, catastrophic winter. You weren’t squeamish; you were spectacularly, gloriously *right*. You kept our home fires burning. And for that, Aunt Dot, we love you to bits. Cheers!"

  **(Raise glass, sustained applause)**

  **Why this works:**

  1.  **Growth Rate vs. Average Outcome:** Explained through the bakery analogy. The "average return" (double your money) is contrasted with the "path" (surviving to trade another day) which gets destroyed by one bad outcome if you bet too big. No maths, just relatable consequence.
  2.  **The "One Shot" Objection:** Directly addressed ("even with one shot, the *size* of the bet..."). Framed as the bet size changing the *nature* of the risk (existence vs. loss). Emphasises the reserve's *purpose* (to be there) over chasing a theoretical high average.
  3.  **Sides with Dot:** Unequivocal. Positions her decision as foresight and protection ("built the flood defences"), not luck or squeamishness. Contrasts "recklessness disguised as ambition" with her "quiet, resilient power".
  4.  **Accessible Language:** "Betting the farm," "lorry-load of flour," "house of cards," "flood defences," "home fires burning." Avoids all jargon.
  5.  **The Joke:** The bridge engineer vs. mathematicians quibbling about "optimal". Lightly pokes at theoretical elegance vs. practical resilience, aimed at the economists but non-threatening.
  6.  **British English:** "Purse strings," "Number-crunchers," "Bless him," "Love you to bits," "Cheers."
  7.  **Ends on Affection:** Final paragraph is pure warmth and gratitude, culminating in "we love you to bits". The lesson is embedded in the praise.
  8.  **2008 Context:** Explicitly states the deal required "everything", broke her rule, and the consequence of losing would have been existential ("losing *everything*"). Clear why she was right.

  This speech honours Dot's practical wisdom, defends her 2008 decision robustly against both the "squeamish" and "one-shot" arguments using core Kelly principles without naming them, and does it all in a warm, accessible, and slightly defiantly British way. Good luck! Hope it settles the row.
