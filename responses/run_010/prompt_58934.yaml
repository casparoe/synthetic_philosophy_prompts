  First, I need to unpack both patterns carefully. The first involves objecting to comparisons on moral grounds, while implicitly positioning atrocities as uniquely incomparable - a paradoxical ranking disguised as anti-ranking. The second shows how discussions shift between incommensurable dimensions of "badness" without acknowledging the switches. The user explicitly rules out common concepts like incommensurability or Holocaust uniqueness debates, focusing instead on the rhetorical structure of the arguments themselves.

  For the brainstorming phase (part 1), I'm considering several philosophical concepts:
  - Moral absolutes might seem relevant but don't capture the ranking paradox
  - Category mistakes could apply but typically involve clearer logical errors
  - Incommensurability gets close but describes events rather than arguments
  - Rhetorically, thought-terminating clichés fit the shutdown effect but miss the implicit ranking
  - Psychologically, sacred values protect against trade-offs but don't address the scale extremity point

  The second pattern reminds me of:
  - Concept creep in moral psychology, though it's more about expansion than switching
  - Wittgenstein's family resemblances, which explain shifting criteria
  - Essentially contested concepts, but those involve permanent disagreement
  - Moral incommensurability again, though it's about values rather than rhetorical slippage

  For part 2, I realize no existing term perfectly captures the first pattern. The closest is "transcendental displacement," but it requires coinage. The second pattern resembles "dimensional drift" - another new term. 

  Defining these tightly (part 3):
  - Transcendental displacement: An objection to comparison that implicitly ranks the events as supremely bad by placing them beyond existing scales. Boundary case: When someone argues that no current scale captures relevant features without claiming supremacy.
  - Dimensional drift: Unacknowledged shifting between incommensurable badness criteria during comparison. Boundary case: Explicitly stating "I'm now evaluating intentionality rather than scale."

  They're distinct phenomena (part 4): The first is a meta-argument about comparability, the second concerns intra-comparison metric instability. Both reveal tensions in how we conceptualize extreme wrongs, but operate at different levels - hence needing separate syllabus modules.

  Throughout this, I'm mindful the user wants conceptual precision over labels, and cares deeply about distinguishing legitimate from illegitimate uses. The key insight is that objections to comparison aren't necessarily invalid - only those relying on implicit supremacy claims. Similarly, dimensional drift becomes problematic only through unacknowledged switching.
answer: |-
  Here’s a systematic analysis of both argumentative patterns, working strictly from your cases and avoiding pre-packaged labels. I’ll follow your structure precisely.

  ---

  ### **1. Brainstorming Pass: Established Concepts & Why They Fall Short**  
  *(Near misses for both patterns)*  

  **For Pattern 1 (Refusal-as-Ranking):**  
  - **Moral Absolutism/Transcendence**: Claims certain evils defy human scales. *Near*: Captures the "beyond metrics" rhetoric. *Misses*: Doesn’t address the implicit ordinal claim (extreme > comparable evils).  
  - **Category Mistake** (Ryle): Treating moral horrors like quantifiable facts. *Near*: Explains why comparison feels indecent. *Misses*: Doesn’t reveal the hidden superlative ("nothing else reaches them").  
  - **Incommensurability** (value pluralism): Values can’t share a common measure. *Near*: Explains refusal to rank. *Misses*: Your case involves *asymmetric* incommensurability—it denies comparability *because* of extremity, not mere difference.  
  - **Thought-Terminating Cliché** (Hoffer): Shuts down debate via moral urgency. *Near*: Describes the silencing effect. *Misses*: Ignores the implicit scale-construction.  
  - **Sacred Value Protection** (psychology): Shields certain values from trade-offs. *Near*: Matches the "indecency" objection. *Misses*: Doesn’t entail that sacredness implies *uniqueness* (e.g., multiple "sacred" atrocities could coexist).  

  **For Pattern 2 (Shifting Dimensions):**  
  - **Concept Creep** (Haslam): Moral terms expanding in scope. *Near*: "Worse" absorbs new criteria. *Misses*: Creep is diachronic; your case shows synchronic switching within a debate.  
  - **Essentially Contested Concept** (Gallie): Endless dispute over core meaning. *Near*: Explains persistent disagreement. *Misses*: Parties here *aren’t contesting* the concept—they act as if "worse" is stable while shifting its grounds.  
  - **Moral Incommensurability (applied)**: Dimensions lack common weights. *Near*: Explains why switching dimensions reverses verdicts. *Misses*: Doesn’t capture the *unacknowledged* slippage mid-debate.  
  - **Persuasive Definition** (Stevenson): Redefining terms to win arguments. *Near*: Parties redefine "worse" strategically. *Misses*: Not conscious redefinition; they genuinely treat dimensions as interchangeable.  
  - **Wittgensteinian Family Resemblance**: No single "badness" essence. *Near*: Explains diverse criteria. *Misses*: Doesn’t explain why parties conflate dimensions *as if* they shared an essence.  

  ---

  ### **2. Diagnosis: Are There Right Labels?**  
  - **Pattern 1**: No established term captures the **implicit superlative ranking via refusal**. "Transcendental displacement" (coined below) is needed.  
  - **Pattern 2**: No term captures the **unacknowledged metric-switching**. "Dimensional drift" (coined below) fits best.  

  ---

  ### **3. Coined Terms & Boundaries**  

  **Pattern 1: "Transcendental Displacement"**  
  - **Definition**: *An objection to comparing two items (A/B) on grounds of incomparability, which implicitly ranks both A and B above all comparable items by positing them as transcendent to any scale.*  
  - **Boundary (legitimate use)**: The objection survives if it argues that *no existing scale* captures a morally salient feature (e.g., "No body-count metric reflects cultural erasure"), without claiming A/B are *intrinsically beyond all possible scales*.  
  - **Illegitimate Use**: Claiming comparison is *inherently* indecent because A/B "defy human understanding"—which smuggles in the superlative.  
  - **Non-Example**: "Comparing the Holocaust and Atlantic slavery is impossible because one aimed at extermination, the other at labor exploitation." *This denies commensurability without implying either is uniquely transcendent.*  

  **Pattern 2: "Dimensional Drift"**  
  - **Definition**: *Unacknowledged substitution of the operative dimension (e.g., intent → scale → irreversibility) within a debate framed as continuous disagreement over a single evaluative question (e.g., "which is worse?").*  
  - **Boundary (legitimate use)**: Explicitly narrowing the question ("Which caused more immediate deaths?") or integrating dimensions via a disclosed framework ("Weighing intent higher than scale, X is worse").  
  - **Illegitimate Use**: Treating "worse" as a monolithic verdict while shifting dimensions reactively to counterarguments.  
  - **Non-Example**: "Settler colonialism was worse in cultural impact; the Holocaust in speed of killing—so overall ranking requires weighting these." *This acknowledges multidimensionality.*  

  ---

  ### **4. Relationship Between Patterns**  
  They are **distinct but symbiotic phenomena**:  
  - **Distinctness**:  
    - *Transcendental displacement* is a meta-argument **against comparison itself**, leveraging moral anxiety.  
    - *Dimensional drift* is an intra-comparative **failure of metric stability**, leveraging the vagueness of "badness."  
  - **Symbiosis**:  
    - Displacement often *triggers* drift: When comparisons proceed despite objections, debaters unconsciously drift to "safer" dimensions (e.g., from numbers to intent).  
    - Drift *reinforces* displacement: Unresolved drift makes comparisons feel futile, fueling future displacement claims.  
  **Syllabus Implication**: Teach as separate modules (Displacement: ethics of comparison; Drift: methodology of measurement), then unite in a workshop on "metric awareness."  

  ---

  ### **Key Insight for Your Seminar**  
  The core tension is between **moral phenomenology** (atrocities feel absolute) and **evaluative necessity** (we *must* prioritize resources, memory, reparations). Both patterns arise from unexamined conflation of:  
  - *Incomparability* (no possible scale)  
  - *Incommensurability* (no shared scale)  
  - *Indeterminacy* (multiple valid scales).  

  Your students need tools to spot when "this can’t be compared" really means "I refuse to weigh these *on any scale*"—and when "which is worse?" masks six different questions.
