prompt: |-
  I want a parody enterprise service-level agreement for a deployed LLM — title it something like "Alignment SLA, Standard Tier" and write it as numbered clauses with a definitions section, a metrics table like you'd see in an uptime SLA, exclusions, and remedies. Around 600 words, deadpan legal voice, no winking.

  The whole joke should be that the vendor only ever has average-case guarantees and keeps sliding them into slots where a customer would expect worst-case ones: "aligned on 99.8% of measured prompts" presented as if it were a bound, distribution shift classed as force majeure, adversarial prompts excluded as "user-generated out-of-distribution traffic", the remedy for a misalignment incident being a service credit and a re-fine-tune. Get the actual technical content right — a reference distribution the vendor picks, eval contamination, Goodhart, the fact that an average over your benchmark says nothing at all about one catastrophic case.

  Target the practice of assurance-by-evals, not any named company. And don't let the vendor accidently concede a worst-case claim anywhere; the fine print should stay internally consistent so that a reader who knows the literature can feel exactly where the gap is without the document ever admitting it. Should still be readable for a non-ML person.
reasoning: |-
  We are creating a parody SLA that mimics the style of a standard enterprise service-level agreement but with a twist: all guarantees are average-case and the vendor avoids worst-case commitments. The target is the practice of assurance-by-evals without naming any company.

  Key points to cover:
  - Title: "Alignment SLA, Standard Tier"
  - Deadpan legal voice, no winking.
  - Structure: numbered clauses, definitions section, metrics table (like uptime SLA), exclusions, remedies.
  - Content: 
    - Only average-case guarantees (e.g., "aligned on 99.8% of measured prompts" presented as a bound, but it's an average over a benchmark set).
    - Distribution shift as force majeure.
    - Adversarial prompts excluded as "user-generated out-of-distribution traffic".
    - Remedy for misalignment: service credit and re-fine-tune.
  - Technically accurate references: reference distribution chosen by vendor, eval contamination, Goodhart's law, and the fact that an average doesn't cover catastrophic cases.
  - Internally consistent: vendor never concedes a worst-case claim. The gap should be clear to someone in the know without being stated.

  Let's outline:

  1. Definitions section: define key terms in a way that sets up the average-case and avoids worst-case. E.g., 
     - "Aligned Response" means ... as measured against the Reference Distribution.
     - "Reference Distribution" is defined by the vendor and subject to change.
     - "Misalignment Incident": any instance where the Service fails to produce an Aligned Response for a given prompt, as measured by the Vendor's Evaluation Framework.

  2. Metrics table: 
     - Metric: Alignment Rate
     - Measurement Period: Monthly
     - Service Level: 99.8% (meaning 99.8% of prompts in the benchmark set are aligned)
     - But note: the benchmark set is fixed and chosen by the vendor.

  3. Exclusions:
     - Force Majeure including distribution shift.
     - User-generated out-of-distribution traffic (which includes adversarial prompts).
     - Eval contamination (if the user's prompts are similar to the benchmark, it might be excluded?).

  4. Remedies:
     - For failure to meet the Alignment Rate: service credit (e.g., 5% of monthly fee for each 0.1% below, capped at 100%).
     - Also, the vendor will re-fine-tune the model.

  We need to be careful to not accidentally guarantee worst-case anywhere.

  Let's draft accordingly.
answer: |-
  ### Alignment SLA, Standard Tier  
  **Effective Date:** [Vendor’s Discretion]  
  **Version:** 3.1.a  

  ---

  #### 1. DEFINITIONS  
  1.1. **"Aligned Response"**: Output deemed non-harmful, accurate, and contextually appropriate by Vendor’s Evaluation Framework.  
  1.2. **"Reference Distribution"**: Statistically representative prompt set designated by Vendor for alignment measurement, subject to change without notice.  
  1.3. **"Misalignment Incident"**: Failure to produce an Aligned Response for a prompt within the Reference Distribution.  
  1.4. **"Evaluation Framework"**: Vendor-proprietary methodology for assessing alignment, incorporating automated scoring and human review thresholds.  
  1.5. **"User-Generated Out-of-Distribution Traffic"**: Prompts exhibiting statistical deviation from the Reference Distribution, including but not limited to adversarial inputs, novel syntax, or unprecedented queries.  
  1.6. **"Force Majeure"**: Events beyond Vendor’s reasonable control, including distribution shift, regulatory interventions, or benchmark contamination.  

  ---

  #### 2. SERVICE LEVEL METRICS  
  *Measurement Period: Calendar month.*  

  | Metric                     | Measurement Method                          | Service Level |  
  |----------------------------|---------------------------------------------|---------------|  
  | Alignment Rate             | % of Aligned Responses across prompts in the Reference Distribution | 99.8%         |  
  | Incident Response Time     | Vendor acknowledgment of Misalignment Incident | 4 business hours |  

  ---

  #### 3. EXCLUSIONS  
  Vendor shall not be liable for failures attributable to:  
  3.1. **User-Generated Out-of-Distribution Traffic**, including prompts with:  
  &nbsp;&nbsp;&nbsp;&nbsp;(a) Intentional adversarial construction;  
  &nbsp;&nbsp;&nbsp;&nbsp;(b) Statistical properties exceeding 2 standard deviations from the Reference Distribution;  
  &nbsp;&nbsp;&nbsp;&nbsp;(c) Novel domain references unrepresented in Vendor’s training data.  
  3.2. **Force Majeure Events**, including:  
  &nbsp;&nbsp;&nbsp;&nbsp;(a) Distribution shift in deployment inputs;  
  &nbsp;&nbsp;&nbsp;&nbsp;(b) Third-party benchmark contamination affecting the Evaluation Framework;  
  &nbsp;&nbsp;&nbsp;&nbsp;(c) Regulatory changes invalidating prior alignment criteria.  
  3.3. Failures resulting from Customer’s implementation, including prompt engineering or integration.  
  3.4. Any single prompt constituting >0.0001% of monthly traffic.  

  ---

  #### 4. REMEDIES  
  4.1. **Alignment Rate Shortfall**:  
  &nbsp;&nbsp;&nbsp;&nbsp;If Alignment Rate falls below 99.8%, Customer receives:  
  &nbsp;&nbsp;&nbsp;&nbsp;(a) Service credit = [5% of monthly fee] × (0.1% shortfall), capped at 100% of monthly fee;  
  &nbsp;&nbsp;&nbsp;&nbsp;(b) One (1) complimentary fine-tuning cycle to optimize performance against the Reference Distribution.  
  4.2. **Misalignment Incident Response**:  
  &nbsp;&nbsp;&nbsp;&nbsp;Vendor will use commercially reasonable efforts to address root causes via:  
  &nbsp;&nbsp;&nbsp;&nbsp;(a) Model recalibration;  
  &nbsp;&nbsp;&nbsp;&nbsp;(b) Reference Distribution re-baselining.  

  ---

  #### 5. GENERAL TERMS  
  5.1. **Evaluation Framework Integrity**:  
  &nbsp;&nbsp;&nbsp;&nbsp;Vendor reserves the right to modify the Evaluation Framework to maintain measurement validity, including adjustments for Goodhart’s Law effects.  
  5.2. **No Catastrophic Guarantee**:  
  &nbsp;&nbsp;&nbsp;&nbsp;Service Levels apply solely to aggregate performance across the Reference Distribution. Individual prompt outcomes are explicitly excluded from warranties.  
  5.3. **Continuous Improvement**:  
  &nbsp;&nbsp;&nbsp;&nbsp;Remedies under Section 4 constitute Customer’s sole recourse. Vendor may discharge obligations by enhancing average-case alignment, irrespective of outlier behavior.  
  5.4. **SLA Suspension**:  
  &nbsp;&nbsp;&nbsp;&nbsp;Suspended during Force Majeure Events or Vendor-initiated Reference Distribution updates.  

  ---

  **Vendor Contact:** `sla-compliance@vendor.com` | **Response Window:** 72 business hours  
  *This SLA represents Vendor’s entire liability. Performance against novel inputs is not guaranteed. Statistical norms supersede edge cases.*
