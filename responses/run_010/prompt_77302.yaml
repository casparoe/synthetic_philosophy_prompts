prompt: |-
  I cover science and ideas for a magazine, and I've been trying to sort out which of the regularities I write about are actually conventions in David Lewis's sense — coordination problem, arbitary, everybody conforms because everybody else does and everybody knows it — versus norms, habits, or rules someone simply imposed. Going by gut:

  Driving on the right: convention, obviously. Which side of the escalator you stand on: convention, even though it differs city to city. The QWERTY layout: convention, though no one gains from switching alone and everybody would gain only if everybody switched — is that even a coordination problem anymore? Tipping 20%: not a convention, that's a norm; skipping it earns moral blame, not a coordination failure. Except driving on the wrong side of the road also earns moral blame, and arguably worse, so those two verdicts sit badly together and I don't know which one to give up. Sweden flipping the whole country to right-hand traffic by government decree: I want to call the outcome a convention even though nobody drifted into it. Singular "they" for a person whose gender you don't know: this is the one I keep going back and forth on. It looks like a textbook convention — arbitrary, coordinative, decreed by no one — but the arguments over it are conducted entirely in moral and political terms, and a lot of the participants insist the alternative just isn't available.

  Is there a principle that gets all of these, or close? State it precisely, clause by clause, and tell me which case each clause is there to handle. Then give me its verdicts on cases I didn't list — a league's offsides rule, word order in a sentence, a newsroom's habit of writing headlines in the present tense. And be straight about which of my gut calls it has to overturn. I'd rather have one committed answer with reasons than a menu of options: pick a principle, defend it, and tell me where I'm wrong. Bottom line in the first sentence, then the reasoning — no preamble, and don't restate my question back at me.
reasoning: |-
  Alright, the user is a science and ideas magazine writer trying to distinguish between conventions (in David Lewis's sense), norms, habits, and imposed rules. They provided several examples and their gut reactions, but they're confused about cases like tipping vs. driving side, and singular "they". They want a precise principle to categorize these, applied to new cases, and are willing to overturn their initial judgments.

  First, I need to recall Lewis's definition of conventions: solutions to coordination problems, arbitrary, sustained by mutual expectations. The user’s confusion between tipping and driving on the wrong side is key. Both involve blame, but Lewis would see driving side as coordination (everyone benefits from uniformity), whereas tipping is a norm because it's about fairness, not coordination. The blame in driving is due to risk, not moral failing, which differentiates it.

  The singular "they" example is tricky. The user notes moral arguments, but if the primary function is coordination in communication (choosing a pronoun for clarity), then it's convention. The moral debates might be secondary, so Lewis would still classify it as convention. Sweden's government-imposed switch: the outcome becomes a convention once everyone follows it due to mutual expectations, even if imposed initially.

  For other cases: offsides rules are conventions (arbitrary, coordination for game play). Word order is convention, but deep structure might be linguistic universal. Headline present tense is a habit, not solving coordination, just efficiency.

  The user's bottom line needs to be clear: conventions are coordination solutions where expectations drive compliance. Tipping is a norm due to moral obligation, not coordination. Their gut call on tipping as a norm is correct; driving side is convention despite blame. Singular "they" is convention. Sweden's outcome is convention. Offsides: convention. Word order: convention. Headlines: habit.

  They might need this for writing accurately about societal structures, avoiding misclassification. Their deeper need is conceptual clarity to educate readers, ensuring they present nuanced distinctions between social constructs. Overturning their initial take on driving side's blame vs. tipping's blame requires emphasizing the basis of compliance—mutual benefit vs. moral duty.
answer: |-
  **Bottom line:** A regularity is a Lewisian convention iff (1) it solves a coordination problem where multiple arbitrary solutions exist, (2) individuals conform primarily because they expect others to conform and prefer coordination over discord, and (3) this expectation is common knowledge. Moral blame or prior imposition don't preclude convention status if (1)-(3) hold; norms involve intrinsic value judgments, habits lack coordination, and imposed rules lack mutual preference-based conformity.

  **Precise Principle (Clauses & Rationale):**
  1.  **Solves a Coordination Problem:** There's a situation where individuals have a shared interest in coordinating their actions (avoiding collision, enabling communication, playing a game) over outcomes where actions clash. *[Handles Driving side, Escalator side, Offsides rule, Word order - all prevent conflict/enable joint activity]*.
  2.  **Arbitrariness:** Multiple distinct, roughly equally good solutions to the coordination problem are logically possible (driving left/right, standing left/right, offsides variations, SVO/SOV word orders). *[Handles QWERTY vs. DVORAK, Driving side differences, Word order variation]*.
  3.  **Conformity Driven by Mutual Expectations:** Individuals conform primarily because they *believe* others conform and they *prefer* conforming *if* (enough) others do, to achieve coordination. *[Core Lewisian mechanism. Handles why people drive on the expected side, stand on the expected escalator side, use QWERTY, use local word order]*.
  4.  **Common Knowledge:** It's mutually known that (1), (2), and (3) hold – everyone knows the situation, knows others know, etc. *[Essential for stable expectations. Handles widespread, stable conventions like driving rules]*.
  5.  **(Implicit) Preference for Coordination:** Individuals genuinely prefer coordinated outcomes over uncoordinated ones, regardless of the specific solution. *[Fundamental driver. Explains why people switch when conventions change, like Sweden]*.

  **Verdicts on Your Cases (Applying Principle):**
  *   **Driving on the Right/Left:** **Convention.** (1) Solves coordination (avoid crashes), (2) Arbitrary (left/right), (3) Conform due to expectation others drive same side, (4) Common knowledge, (5) Preference for coordination (safety).
  *   **Escalator Standing Side:** **Convention.** (1) Solves coordination (efficient flow), (2) Arbitrary (left/right), (3) Conform due to expectation others stand/walk accordingly, (4) Common knowledge locally, (5) Preference for flow.
  *   **QWERTY Layout:** **Convention.** (1) Solves coordination (keyboard/input compatibility), (2) Arbitrary (other layouts exist), (3) Conform due to expectation others use it (keyboards, training), (4) Common knowledge, (5) Preference for compatibility. *[Yes, it's a coordination problem: my choice only benefits me if others design keyboards/train using it too. Purely unilateral gains aren't sufficient for coordination - mutual compatibility is key].*
  *   **Tipping 20%:** **Norm, not Convention.** While there's coordination *potential* (avoiding awkwardness), the primary driver is *moral obligation/fairness* ("server deserves 20%", "cheap if you don't"). Conformity isn't *primarily* because you expect others to tip 20% and just want to match them; it's because you believe it's *the right thing to do*. The arbitrariness (why 15% vs 20%?) is overshadowed by the prescriptive moral weight. *[Overturns your initial doubt: Blame isn't the issue; the *reason* for conformity is moral, not coordination-driven. Driving wrong side blame stems from risk, not inherent moral failing]*.
  *   **Sweden Switching Sides:** **Outcome is Convention.** The *means* (government decree) was imposition. But the *resulting regularity* (driving on the right) now satisfies (1)-(5): people drive right because they expect others to, preferring coordination. The decree successfully reset expectations, enabling the convention to take hold. *[Confirms your gut: Outcome is conventional]*.
  *   **Singular "They" (for unknown gender):** **Convention.** (1) Solves coordination (clear, unambiguous pronoun reference), (2) Arbitrary ("they" vs. invented pronouns vs. "he or she"), (3) Conform due to expectation others understand it this way, (4) Increasingly common knowledge, (5) Preference for clarity. *The moral/political arguments* primarily concern *which convention should be adopted* (e.g., rejecting "he" as default due to sexism, advocating "they" for inclusivity) or *extending its use* (to known non-binary individuals). The core function for unknown gender remains coordinative. *[Overturns your doubt: The *debate* is normative/political, but the *existing regularity's function and maintenance* for its core case is conventional]*.

  **Verdicts on New Cases:**
  *   **League's Offsides Rule:** **Convention.** (1) Solves coordination (define fair play in attack/defense), (2) Arbitrary (exact position/active-passive definitions vary by sport/league), (3) Players/refs conform expecting others to, (4) Common knowledge among participants, (5) Preference for a playable game.
  *   **Word Order in a Sentence (e.g., SVO in English):** **Convention.** (1) Solves coordination (enabling comprehensible communication), (2) Arbitrary (SOV, VSO, etc., exist and work), (3) Speakers conform expecting listeners to parse it that way, (4) Common knowledge among speakers, (5) Preference for being understood. *[While deep structure may have cognitive constraints, the specific surface order is conventional]*.
  *   **Newsroom's Habit of Writing Headlines in Present Tense:** **Habit, not Convention.** (1) Lacks a true coordination *problem*. While it creates consistency, the failure mode isn't miscoordination (like a crash or misunderstanding), just stylistic variation or minor inefficiency. (3) Conformity is likely driven by internal style rules, training, efficiency, or tradition ("this is how we do it"), not primarily by the expectation that *other newsrooms* do it and needing to match them for coordination. There's no significant benefit lost if one newsroom uses past tense while others use present; readers adapt easily. *[It's a rule/habit, not solving a Lewisian coordination problem]*.

  **Where Your Gut Needs Adjustment:**
  1.  **Tipping:** You were right it's a norm, but wrong to doubt it because of blame. The principle clarifies: Blame in driving stems from risk created by coordination failure; blame in tipping stems from perceived unfairness/moral failing. The *source* and *nature* of the blame differ and align with convention vs. norm.
  2.  **Singular "They":** Your gut saw the moral debate but missed the underlying conventional core for its standard usage. The principle separates the *function* of the regularity (coordination) from the *reasons for advocating its adoption/extension* (normative/political).
  3.  **Habits vs. Conventions:** Your request highlights the need to distinguish. The headline example shows how internal efficiency/rules (habits) lack the mutual expectation and coordination problem elements defining conventions.
