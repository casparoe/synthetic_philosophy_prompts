     - Evidence weight: Medium (central in Kavna/Tirn but absent elsewhere).  

  4. **No-Stranding/Viability Rule**  
     - Principle: Secession cannot strand dependent populations or control essential infrastructure without safeguards.  
     - Consistent with: [2, 6] (Marren’s port/tax base; Bela’s port/pensions).  
     - Tension with: [1, 4, 5] (Kavna, Sarnia, Ostmark lack stranding concerns).  
     - Predicts for Vessa: Condition negotiation on cable-station safeguards.  
     - Evidence weight: Medium (decisive in Marren/Bela but irrelevant otherwise).  

