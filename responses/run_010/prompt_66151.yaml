  - Tension: Sarnia's refusal was also because lesser remedies were available, which is not procedural.

  But we can see that the Commission is considering multiple factors.

  Given the record, let's list candidate rules:

  1. **Remedial Right with Clear Process and Viability (Combined Rule):**
     - Principle: Secession is justified only as a remedy for injustice, expressed by a free and fair referendum on a clear question, and conditioned on ensuring the viability of the remainder and the protection of internal minorities.
     - Consistent with: All cases? 
       - Kavna: injustice, clear vote -> allowed, with internal minority protection condition (implied).
       - Marren: no injustice, flawed question, and non-viability for remainder -> refused.
       - Tirn: enforces internal minority protection.
       - Sarnia: no injustice, and not concentrated -> refused.
       - Ostmark: injustice but flawed process -> refused.
       - Bela: injustice, clear vote, but non-viability for remainder -> conditioned.
     - Tension: In Sarnia, the Commission also said territorial concentration was a precondition. We must include that.

  2. **Concentration, Justice, Process, and Reciprocity (CJPR Rule):**
     - Principle: A territorially concentrated group may secede if it has suffered injustice, expresses its will in a free and fair referendum on a clear question, and the secession does not strand the remainder without safeguards and commits to internal self-determination for minorities.
     - This is similar to Rule A above.

  3. **Procedural Legitimacy with Anti-Stranding and Reciprocity:**
     - Principle: A clear and free referendum is necessary but not sufficient; the Commission also requires that the secession not strand the remainder and that the claimant extend self-determination to internal minorities, and in cases of injustice, the referendum may be sufficient, but without injustice, it might not be (but Marren had no injustice and was refused, so injustice might be necessary?).

  But in Marren, they also had no injustice, so the rule might require injustice? Let's check:

  - Kavna: injustice -> allowed.
  - Marren: no injustice -> refused.
  - Ostmark: injustice -> but vote flawed -> refused. So if vote was fair, would they allow? But Ostmark had grave injustice, but vote was flawed -> refused. So injustice alone is not sufficient.
  - Bela: injustice -> allowed with conditions.

  So it seems injustice is a necessary condition? But what about if there is no injustice but a clear vote? Marren was refused. So the Commission might require injustice.

  Thus, a rule:

  **Candidate Rule: Remedial Necessity + Fair Process + Viability + Reciprocity**
  - Principle: Secession is permitted only when there is a pattern of injustice, a free and fair referendum on a clear question, no stranding of the remainder without safeguards, and a commitment to internal self-determination for minorities.

  For Vessa:
  - Injustice: suspension of statute, arrests (though charges dropped), disproportionate cordon -> yes.
  - Fair process referendum: yes, clear question, high turnout, observed, participation without contest.
  - Stranding: cable station is essential infrastructure, and Vessa's plan allows suspension -> stranding risk.
  - Reciprocity: disenfranchisement and property confiscation without compensation for the minority (mainland-origin) -> violates reciprocity.

  Therefore, the Commission would require conditions to address stranding and reciprocity.

  Prediction: endorse right to negotiate subject to conditions for:
  - Ensuring the cable station is managed without unilateral suspension (joint authority or international oversight).
  - Protecting the minority: franchise and property rights must be guaranteed (no disenfranchisement, fair compensation for property).
  - Perhaps using the free association offer as a starting point? But the Commission doesn't force acceptance, but might require that such options be considered.

  Closest analog: Bela, but with added minority issue.

  ### Step 4: Best Guess Rule

  The best fit rule is the **Remedial Necessity with Fair Process, Viability, and Reciprocity** rule.

  Reasons:
  - It explains all six cases without tension:
    1. Kavna: injustice and fair vote -> allowed, but with reciprocity condition (stated in the opinion).
    2. Marren: no injustice -> refused (and also stranding, but the rule requires injustice as necessary).
    3. Tirn: reciprocity enforced -> consistent.
    4. Sarnia: no injustice (or not sufficient) and not concentrated -> refused (the rule requires concentration for secession, and injustice? Sarnia had no systematic violations -> so no injustice).
    5. Ostmark: injustice but unfair process -> refused.
    6. Bela: injustice and fair vote, but stranding -> conditioned to avoid stranding. Also, no internal minority issue? So reciprocity not triggered.

  What would change my mind? A case with no injustice but a clear vote and no stranding that is granted secession would break the rule. But we don't have such a case.

  ### Step 5: Underdetermination

  Is the record underdetermined? The six opinions do not explicitly state a single principle, but they are consistent with the CJPR rule. However, there might be other rules that also fit. For example, a rule that requires injustice and fair process but not reciprocity would not fit Tirn. A rule that does not require injustice would not fit Marren. So the record constrains the rules.

  But the rule we have is a combination of factors, and the weight of each factor might be unclear. For instance, in Vessa, if the injustice is severe, does it override the reciprocity issue? The record doesn't have a case with both severe injustice and a reciprocity violation. Ostmark had injustice but no reciprocity issue, and was refused because of process. So the record might underdetermine the relative importance of reciprocity vs. injustice.

  However, the Commission in Tirn applied reciprocity even when Kavna had an injustice, so reciprocity seems non-negotiable.

  Thus, the record is not genuinely underdetermined for Vessa: it points to conditioned negotiation.

  ### Step 6: Conditions for Vessa

  If conditioned, conditions might include:
  - A transition period to negotiate the status of the cable landing station, ensuring it is not unilaterally disrupted (joint management or international oversight).
  - Protection of the rights of the mainland-origin minority: franchise rights and fair compensation for property.
  - Perhaps a requirement to consider the free association offer? But the Commission typically doesn't force a particular solution, so more likely they require that the negotiations address these points.

  ### Step 7: Discriminating Future Case

  To discriminate among the rules, we need a case that varies the factors. Suppose:

  - **Case 7:** A region with no injustice, but a clear and fair referendum on independence (like Marren but without the bundling and with no stranding). What would the Commission do?

  Rules:
  - Remedial Necessity rule: would refuse because no injustice.
  - Plebiscitary rule: would endorse.
  - Reciprocity rule: if no internal minority, might endorse? But the rule doesn't address the injustice requirement.
  - No-Stranding rule: if no stranding, might endorse.

  But our best guess rule (Remedial Necessity) requires injustice, so it would refuse. If the Commission endorsed, it would break the Remedial Necessity rule and support the Plebiscitary rule.

  Alternatively, a case with injustice and fair process but with an internal minority that the claimant does not protect. Our rule would require conditions for reciprocity. If the Commission endorses without conditions, it breaks the reciprocity part.

  But let's design:

