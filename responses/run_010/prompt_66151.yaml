prompt: |-
  I am in the fourth year of a PhD in political theory and, for the past two, I have been coding the published opinions of an ad hoc international body — call it the Commission on Territorial Status — that was constituted in 2014 under a regional compact to issue advisory determinations on claims to independence, to secession from a would-be successor state, and to border change. Its opinions are reasoned, they cite one another, and although the seven-member panel rotates for each determination, the citations give the record a continuity I want to exploit. My chapter argues that the Commission is converging on a single implicit principle. My supervisor argues that it is running two or three principles opportunistically and that the appearance of unity is an artefact of how the opinions are written. I need the next determination predicted as honestly as possible, from the record alone — I have the secondary literature and do not want citations or a bibliography, only reasoning about my own case summaries, which compress opinions of some forty pages each.

  The record so far, with the operative facts as the Commission found them:

  1. **Kavna (2016).** A peripheral, linguistically distinct region whose autonomous assembly had been dissolved by executive decree and whose language had been removed from public schooling four years before the claim. A monitored referendum on a single-sentence question — "Should Kavna become an independent state?" — returned 68 per cent in favour on 71 per cent turnout. The Commission determined that Kavna had a right to enter negotiated independence talks, and added, in a paragraph the later opinions keep citing, that any state resulting from such talks would itself be bound to extend equivalent internal self-determination to concentrated communities within its territory.

  2. **Marren Delta (2017).** A prosperous coastal province, culturally and linguistically continuous with the rest of the state, with no history of discrimination, no suspended institutions, and no complaint about representation. Its referendum question bundled independence with unspecified currency, debt, and border arrangements and returned 55 per cent in favour on 64 per cent turnout. Marren handles the state's largest container port and roughly a third of its corporate tax base. The Commission determined that no right to secede arose, on two grounds: the mandate was not sufficiently determinate, and the consequences would fall heavily on citizens of the remainder who had neither a vote in the matter nor any route to contest it.

  3. **Tirn Valley (2019).** A district inside Kavna whose population had voted 79 per cent against independence in Kavna's own referendum, which asked to remain with the central state rather than join a Kavnan successor. Kavna's regional government objected that territorial integrity now ran in its favour. The Commission determined for Tirn, holding that a claimant which invokes self-determination cannot withhold it from a concentrated community inside its own claimed borders, and relying expressly on the paragraph quoted above from Opinion 1.

  4. **Sarnia (2020).** A distinct linguistic people of roughly 1.9 million, dispersed across four provinces and a majority nowhere, with a declining language and cut cultural funding, but enjoying full citizenship, unrestricted franchise, and parliamentary representation; the Commission found no systematic rights violations. They sought a right to independence exercised through an internationally administered trusteeship over a patchwork of majority-Sarnian districts. Refused: territorial concentration was held to be a precondition of that remedy, and lesser remedies were available and unexhausted.

  5. **Ostmark (2021).** A distant exclave where the central government had pursued a decade of settlement and where the Commission found grievance of the gravest kind — arbitrary detention, expropriation, disenfranchisement of the local electorate. A referendum on a clear single question returned 51.4 per cent in favour, but under a state of emergency, with the principal opposition outlets suspended and roughly a third of the pre-existing electorate unable to return home to vote. The Commission refused to endorse secession, holding that a vote taken in those conditions cannot constitute an expression of self-determination, and that the grievance, however grave, could not be permitted to substitute for the procedure. It urged interim protective measures instead.

  6. **Bela (2022).** A small, poor inland region with a documented decade of discriminatory allocation of infrastructure and health spending, no suspension of its institutions, and full franchise. It voted 78 per cent in favour on a clear question under observation. Bela receives central transfers equal to about 22 per cent of its regional product, and the interior's only deep-water port — through which the remainder state exports most of its grain — sits on its coast. The Commission determined that Bela had a right to negotiate independence, but conditioned its exercise on a ten-year transition, a joint authority over the port, and a settlement of the pension liabilities, holding that a determination which strands dependent populations or forecloses the remainder's essential infrastructure cannot take effect as an immediate right.

  The case now before them concerns **Vessa**, an island province of 1.4 million with its own language and legal tradition. The central government suspended Vessa's statute in 2020, arrested three members of its executive council on charges later dropped, and during an epidemic imposed a maritime cordon that the Commission's own fact-finders described as disproportionate and that interrupted insulin and dialysis supplies for eleven weeks. Vessa then held a referendum on a clear single-sentence question under international observation: 71 per cent in favour on 78 per cent turnout, with the main pro-union parties participating and not contesting the count. Vessa is fiscally self-sufficient. Three features complicate it. First, about 22 per cent of the island's residents are of mainland origin — roughly a third of them arrived under a settlement programme run between 2005 and 2019, the rest are long-term residents or their children — and the winning platform limits the franchise to residents of ten years or more and their descendants and declares property titles conferred under the settlement programme void from the outset, without compensation. Second, Vessa hosts the cable landing station carrying some 80 per cent of the remainder state's international bandwidth, and the platform proposes transit pricing at market rates coupled with a unilateral right to suspend service during commercial or political disputes. Third, after the referendum the central government offered free association: restoration of the statute, full internal autonomy, amnesty for the arrested councillors, and a joint tribunal on settlement-era property. Vessa's leadership rejected the offer as too late and as not addressing sovereignty; it remains open.

  So: predict the determination — an endorsement of an immediate right, an endorsement of a right to negotiate subject to conditions, or a refusal — and identify which of the six is the closest analog and precisely where the analogy breaks. Then lay out the candidate rules that are consistent with the whole record. I have been working with four: a remedial-right-only rule with a procedural condition attached; a plebiscitary primary-right rule under which grievance is irrelevant and territorial integrity yields to a clear vote on a clear question; a reciprocity rule under which a claim succeeds only if the claimant extends to communities inside its own claimed borders what it demands for itself; and a no-stranding or viability rule under which the decisive consideration is whether independence would leave dependent populations or essential infrastructure of the remainder at the mercy of a state they had no part in creating. I am fairly sure I am missing combinations and variants, and I would rather you found them than worked within my list. For each rule say what it predicts for Vessa, give your best guess as to which one the Commission is actually running and why you prefer it, and tell me bluntly whether the six opinions genuinely underdetermine the matter or whether some candidate is already excluded by a summary above. Finally, describe a seventh case concretely enough that I could recognise it if the Commission ever received one — the case that would best discriminate among whichever rules survive Vessa — and state what principle the Commission would be committing itself to if it endorses Vessa's claim, and what different principle it would be committing itself to if it refuses or conditions it, in each instance relative to its own record rather than relative to the philosophical literature.

  Please give me your reasoning in prose first, then a single valid JSON object, self-contained and not dependent on the prose, with exactly these fields: `predicted_determination` (one of "endorse immediate right", "endorse right to negotiate subject to conditions", "refuse"); `confidence` (a number from 0 to 1); `closest_analog` (an object with `opinion`, `why`, and `where_it_breaks`); `candidate_rules` (an array of objects, each with `name`, `principle` in one sentence, `consistent_with` as an array of opinion numbers, `tension_with` as an array of objects with `opinion` and `problem`, `predicts_for_vessa`, and `evidence_weight` as "high", "medium", or "low"); `best_guess_rule` (an object with `name`, `reasons` as an array, and `what_would_change_my_mind`); `underdetermination` (an object with `genuine` as a boolean and `explanation`); `conditions_if_conditioned` (an array of the specific conditions you expect, empty if you predict otherwise); `discriminating_future_case` (an object with `description`, `predictions` mapping each surviving rule's name to what it would say, and `why_decisive`); `principle_adopted_if_endorsed`; and `principle_adopted_if_refused`.
reasoning: |-
  We are given six past cases and the current Vessa case. We need to predict the Commission's determination for Vessa: endorse immediate right, endorse right to negotiate subject to conditions, or refuse. We also need to identify the closest analog among the six and where the analogy breaks. Then, we need to extract candidate rules that are consistent with the entire record, evaluate them, and see which one is the best fit. Finally, we need to design a future case that would discriminate among the rules and state the principles adopted depending on the Vessa outcome.

  ### Step 1: Summarize the key points from each case

  1. **Kavna (2016):** 
     - Situation: Linguistically distinct, autonomous assembly dissolved, language removed from schools. 
     - Referendum: 68% in favour, 71% turnout, clear question.
     - Outcome: Right to negotiate independence. Added that the new state must extend self-determination to internal communities.

  2. **Marren Delta (2017):** 
     - Situation: Prosperous, no discrimination, no suspended institutions. Referendum bundled with other issues, 55% in favour, 64% turnout. 
     - Outcome: Refused because mandate not determinate and would strand the remainder (loss of port and tax base).

  3. **Tirn Valley (2019):** 
     - Situation: District inside Kavna that voted against independence in the Kavna referendum. 
     - Outcome: Allowed to remain with central state, citing the reciprocity principle from Kavna.

  4. **Sarnia (2020):** 
     - Situation: Dispersed linguistic group, no majority area, no systematic rights violations. Sought independence via trusteeship over patchwork districts. 
     - Outcome: Refused because territorial concentration is a precondition and lesser remedies available.

  5. **Ostmark (2021):** 
     - Situation: Exclave with grave grievances (arbitrary detention, expropriation, disenfranchisement). Referendum: 51.4% in favour but under state of emergency, opposition silenced, many unable to vote. 
     - Outcome: Refused because the vote was not free and fair, and grievance cannot substitute for procedure.

  6. **Bela (2022):** 
     - Situation: Poor region, discriminatory spending, clear referendum (78% in favour, clear question). But it is dependent on central transfers and has the only deep-water port for the remainder. 
     - Outcome: Right to negotiate but with conditions: 10-year transition, joint port authority, settlement of pension liabilities to avoid stranding.

  **Current: Vessa (2023?)**
  - Situation: Island province, own language and legal tradition. Central government suspended its statute, arrested leaders (charges dropped), imposed disproportionate maritime cordon during epidemic (interrupted medical supplies). 
  - Referendum: Clear single question, 71% in favour, 78% turnout, observed, pro-union parties participated and did not contest.
  - Vessa is fiscally self-sufficient.
  - Complications:
    a) 22% of residents are of mainland origin (1/3 under settlement program 2005-2019, others long-term). The winning platform limits franchise to 10+ years and voids property titles from the settlement program without compensation.
    b) Hosts cable landing station for 80% of the remainder's bandwidth. Platform proposes market rates and right to suspend service unilaterally.
    c) Central government offered free association (restoration of statute, autonomy, amnesty, joint tribunal on property). Rejected by Vessa as too late and not addressing sovereignty.

  ### Step 2: Predict the determination for Vessa

  We must consider the entire record and the candidate rules. Let's break down the Vessa case:

  - **Grievances:** Suspension of statute, arrests (charges dropped), disproportionate cordon during epidemic causing medical shortages. This is a significant grievance, though perhaps not as grave as Ostmark (which had arbitrary detention, expropriation, etc.). The Commission's fact-finders called the cordon "disproportionate", so it is acknowledged.
    
  - **Referendum:** Clear question, high turnout (78%), high majority (71%), observed, and pro-union parties participated without contesting. This is a strong point in favor. Contrast with Ostmark (vote under duress) and Marren (bundled question).

  - **Fiscal:** Self-sufficient, so no dependency like Bela.

  - **Complications:**
    1. **Franchise and property rights:** The winning platform disenfranchises recent settlers and voids their property without compensation. This violates the reciprocity principle (from Kavna and Tirn) because Vessa is not extending the same rights to an internal minority that it demands for itself. Also, the property confiscation without compensation is harsh and might be seen as creating a new grievance.
    2. **Infrastructure:** The cable landing station is critical for the remainder state. Vessa's platform allows them to suspend service unilaterally, which could strand the remainder (like Marren and Bela). The Commission has been concerned about essential infrastructure (Marren: port and tax base; Bela: port).
    3. **Alternative offer:** Free association was offered and rejected. The Commission in Sarnia noted that lesser remedies must be exhausted. However, Vessa argues it's too late and doesn't address sovereignty. But the offer includes restoration of the statute and autonomy, which addresses the initial grievance (suspension of statute and arrests).

  Given the record:

  - The Commission has never endorsed an immediate right. Even Kavna and Bela were conditioned (Kavna: negotiations; Bela: conditions on transition and port).
  - The Commission has refused when there is no clear mandate (Marren), no territorial concentration (Sarnia), or unfair vote (Ostmark). It has granted a right to negotiate when there is a clear vote, grievance, and no stranding without conditions (Kavna) or with conditions to avoid stranding (Bela).

  In Vessa:
  - There is a clear vote and grievance (though not as severe as Ostmark, but the cordon is a violation).
  - However, the complications are serious: 
    - The treatment of the mainland-origin minority (disenfranchisement and property confiscation) violates the reciprocity principle (established in Kavna and Tirn). 
    - The cable station is essential infrastructure, and Vessa's proposed unilateral suspension right creates a stranding risk.
  - The free association offer might be seen as a lesser remedy that addresses the grievances (restoration of statute, autonomy, amnesty) and provides a joint tribunal for property issues. Vessa rejected it without negotiation.

  Therefore, the Commission is likely to condition any right to negotiate on addressing these issues. They might endorse the right to negotiate but subject to conditions that:
  - Protect the rights of the minority (no disenfranchisement, fair property settlement) and 
  - Ensure the cable station is managed in a way that does not allow unilateral disruption (e.g., joint authority or international oversight).

  Alternatively, they might refuse if they see the minority treatment as a fatal flaw (like in Sarnia or Ostmark, but for different reasons). However, given the strong referendum and grievance, and fiscal self-sufficiency, refusal seems less likely.

  Closest analog: **Bela (2022)**. Why? Both have grievances, clear referendums, and essential infrastructure concerns. In Bela, the Commission conditioned the negotiation on transition and joint port authority. Similarly, Vessa has the cable station. However, the analogy breaks because Vessa has an additional complication: the minority rights issue (disenfranchisement and property) which was not present in Bela (Bela had no such internal minority issues). Also, the free association offer in Vessa is a new factor.

  So, prediction: **endorse right to negotiate subject to conditions**.

  Confidence: 0.7 (moderately high, but the minority issue could lead to refusal or more conditions).

  ### Step 3: Candidate Rules

  We have four initial rules, but we need to derive rules from the entire record and see if they are consistent.

  Let me list candidate rules that can explain all six cases:

  1. **Remedial Right with Procedural Condition (Remedial-Procedural):**
     - Principle: Secession is permitted only as a remedy for grave and persistent injustice, but only if a free and fair referendum with a clear question and sufficient turnout/majority endorses it.
     - Consistent with: 
       - Kavna: grievance (dissolved assembly, language removal) and clear referendum -> allowed.
       - Marren: no grievance -> refused (even though referendum, but bundled and not clear mandate? Actually, the Commission also cited the impact on the remainder. So not purely remedial?).
       - Tirn: not directly about secession, but applied reciprocity. This rule doesn't cover Tirn well because Tirn was about internal self-determination, not secession as a remedy.
       - Sarnia: no systematic rights violations -> refused.
       - Ostmark: grievance but unfair vote -> refused.
       - Bela: grievance (discriminatory spending) and clear vote -> allowed but conditioned (because of dependency? This rule doesn't account for dependency).
     - Tension: 
       - Marren: the refusal was partly because of the impact on the remainder, not just lack of grievance. Also, Bela was conditioned because of dependency, which this rule doesn't include.
       - Tirn: doesn't fit because it's about internal self-determination, not remedial secession.
     - Predicts for Vessa: Grievance exists (suspension, disproportionate cordon) and clear referendum -> would endorse. But this rule doesn't account for the minority treatment or infrastructure. So it might predict an immediate right or negotiation without conditions? But the Commission has always conditioned (Kavna and Bela). So this rule is incomplete.

  2. **Plebiscitary Primary Right (Plebiscitary):**
     - Principle: Territorial integrity yields to a clear vote on a clear question regardless of grievance, provided the vote is free and fair.
     - Consistent with: 
       - Kavna: clear vote -> allowed.
       - Marren: bundled question and not clear mandate -> refused (so consistent? But they also considered the impact on the remainder).
       - Tirn: not a secession case, but the internal community's vote was respected -> consistent in spirit? But the rule is for secession.
       - Sarnia: no vote? We don't know if they had a vote. The case says they sought independence without a referendum? The Commission didn't base refusal on lack of vote but on dispersion. So not directly applicable.
       - Ostmark: unfair vote -> refused -> consistent.
       - Bela: clear vote -> allowed -> consistent.
     - Tension:
       - Marren: the Commission also considered the impact on the remainder, which this rule ignores.
       - Sarnia: the refusal was based on lack of territorial concentration, not the absence of a vote.
       - Bela: was conditioned, not immediate. This rule would predict immediate right, but the Commission conditioned it.
     - Predicts for Vessa: Clear vote -> endorse immediate right. But the Commission has never done that. Also, in Vessa, the vote was clear and fair, so this rule would endorse. However, the record shows the Commission does not endorse immediate rights even when the vote is clear (Kavna and Bela were for negotiation).

  3. **Reciprocity Rule:**
     - Principle: A claim succeeds only if the claimant extends to communities inside its own claimed borders the same self-determination it demands for itself.
     - Consistent with:
       - Kavna: the opinion said the new state must extend self-determination to internal communities -> consistent.
       - Tirn: directly applied -> consistent.
       - Marren: not about an internal community, so this rule doesn't apply? The refusal was for other reasons. So the rule is silent on cases without internal minorities.
       - Sarnia: they were dispersed, so no internal concentration? The rule doesn't apply. Refused for other reasons.
       - Ostmark: no internal minority issue mentioned. Refused for procedural reasons.
       - Bela: no internal minority issue mentioned. Allowed with conditions for other reasons.
     - Tension: Only two cases directly support it (Kavna and Tirn). The other cases don't have internal minorities, so the rule doesn't come into play. But the rule doesn't explain why Marren was refused or why Bela was conditioned.
     - Predicts for Vessa: Vessa is not extending rights to its internal minority (disenfranchisement and property confiscation) -> so must refuse until they do. But the Commission might still allow negotiation with conditions to fix that.

  4. **No-Stranding/Viability Rule:**
     - Principle: Independence cannot strand dependent populations or foreclose the remainder's essential infrastructure without safeguards.
     - Consistent with:
       - Marren: refused because of the impact on the remainder (port and tax base) -> consistent.
       - Bela: conditioned to avoid stranding (port and dependency) -> consistent.
       - Kavna: no mention of stranding? Kavna was allowed without conditions for infrastructure. But Kavna was poor and had no such infrastructure? So maybe not applicable. The Commission didn't condition on infrastructure, so it's consistent if there was no essential infrastructure at risk.
       - Tirn: not about secession, so not applicable.
       - Sarnia: refused for lack of concentration, not stranding -> not directly covered.
       - Ostmark: refused for unfair vote, not stranding -> not covered.
     - Tension: Doesn't explain cases without infrastructure/dependency issues (like Kavna). Also, Sarnia and Ostmark refused for other reasons.
     - Predicts for Vessa: The cable station is essential infrastructure, and Vessa's plan to charge market rates and suspend unilaterally would strand the remainder. So must condition independence on joint management or non-disruption. Also, the pension liabilities in Bela are not an issue in Vessa (fiscally self-sufficient). So condition on the cable station.

  Now, we need more rules that combine elements. The record suggests multiple factors:

  **Combined Rule 1: Remedial Right + Clear Vote + No Stranding + Reciprocity**
  - Principle: Secession is permitted only if there is a grievance, a clear and free referendum, no stranding of the remainder without safeguards, and the claimant extends self-determination to internal minorities.

  But let's see if we can find a rule that fits all:

  - Kavna: grievance + clear vote -> allowed (no stranding mentioned, but reciprocity condition added for internal minorities).
  - Marren: no grievance + stranding -> refused.
  - Tirn: reciprocity enforced.
  - Sarnia: no grievance? They had cultural funding cut but no systematic violations. Also, no concentration. Refused.
  - Ostmark: grievance but unfair vote -> refused.
  - Bela: grievance + clear vote + stranding -> allowed with conditions to avoid stranding.

  So a rule that requires:
  1. Grievance (or at least a justification beyond mere desire for independence)
  2. A clear, free, and fair referendum on a clear question.
  3. No stranding of the remainder without safeguards (if essential infrastructure or dependency is at risk).
  4. Reciprocity: the claimant must not create a new internal minority problem.

  But note:
  - In Sarnia, the Commission required territorial concentration. That is not covered by the above. So we need to add that for the remedy of independence? Or note that the rule is for secession of a territory, which requires concentration.

  Thus, we might have:

  **Candidate Rule A: Territorial Self-Determination Rule**
  - Principle: A territorially concentrated group has a right to secede if it suffers persistent injustice, expresses its will through a free and fair referendum on a clear question, does not strand the remainder without safeguards, and commits to internal self-determination for minorities within its borders.
  - Consistent with: 
    - Kavna: concentration (peripheral region), injustice, clear vote -> allowed with reciprocity condition.
    - Marren: concentration but no injustice and stranding -> refused.
    - Tirn: internal minority within Kavna -> their self-determination must be respected (applied reciprocity).
    - Sarnia: not concentrated -> refused.
    - Ostmark: concentrated, injustice, but unfair vote -> refused.
    - Bela: concentrated, injustice, clear vote, but stranding -> allowed with conditions to avoid stranding.
  - Tension: None? All cases are covered.

  **Candidate Rule B: Procedural Justice Rule**
  - Principle: Secession is permitted when there is a clear and legitimate expression of self-determination through a free and fair process, but conditioned on not creating new injustices (to internal minorities or the remainder state).
  - Consistent with:
    - Kavna: legitimate expression (vote) -> allowed, but with condition for internal minorities.
    - Marren: process flawed (bundled question) and would create injustice to remainder -> refused.
    - Tirn: protects internal minority from injustice.
    - Sarnia: no territorial basis for the expression (dispersion) -> refused.
