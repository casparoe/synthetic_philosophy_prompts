prompt: |-
  I'm drafting the following for our office, and I'd like you to take the role of a political philosopher who has actually had to make a theory of freedom usable by people who will never read it — someone equally at home with Berlin's two concepts, with Pettit's account of freedom as non-domination, and with the way a city attorney's office reads a checklist. Please think carefully before answering, and work in American English throughout.

  The situation: I direct a small policy-analysis unit inside a mid-sized American city government. Two years ago the council passed an ordinance requiring a written impact statement for every proposed regulation, and last spring it added a line item asking us to state, for each proposal, the effect on "the liberty of residents." That phrase is doing no work at all right now. My staff is four analysts, none with philosophy training; we get one to three proposals a week; each statement goes out within two business days; and everything we publish is read aloud at council meetings by members who have already decided what they want the answer to be. I need a procedure they can run, not a seminar.

  Here is the part that a two-hour argument with a friend left unresolved, and it is the crux I need you to settle in order to build anything. My friend's position is that non-domination is not a distinct value at all: on her view, to say that someone is dominated is just to say that they face a high enough probability of interference in some future situation, so that any checklist that tracks domination separately is double-counting and should be collapsed into a single probability-weighted assessment of interference. My position is that she is describing the wrong thing — that the republican complaint is about who holds the switch and whether that holder's decisions are constrained and answerable to the person affected, so that two arrangements with identical expected interference can differ in freedom, and that a procedure built on her reduction would systematically miss the case of the unexercised power. Relatedly, she thinks the whole tripartite apparatus is redundant, since the standard triadic analysis — some agent being free from some constraint to do or become something — already absorbs the positive and negative conceptions once you allow that internal incapacity and unavailability of means count as constraints. I do not need you to referee the argument for its own sake. I need you to pick a side, because the procedure has to be built one way or the other.

  What I am asking you to produce:

  1. A short opening section in which you work out loud: list the candidate tests you considered for whether a power over someone is arbitrary or answerable, note which you rejected and why, and state your verdict on the reduction question above together with what the procedure gives up by being built that way.

  2. The procedure itself, as an ordered sequence of questions an analyst can ask of a proposal, with: what counts as a sufficient answer to each question; where the procedure stops and yields a determinate result; where it yields a genuine conflict between the concepts and must report the conflict rather than average it away; and where it hands the decision to a human because the remaining question is one of values or of justice rather than of freedom. It must include an explicit rule for what to do when we have no evidence about a relevant fact — and that rule must not quietly presume that anything unmeasured is free. It must also keep liberty separate from desirability: a proposal can be one our unit favors and still score badly, and the procedure has to be able to say so in public.

  3. A one-page output template the analyst fills in, giving a direction and a confidence level under each concept and a one-line rationale, in language a council member can follow.

  4. The procedure run on three specific proposals, in enough detail that I can see it actually functioning rather than being described:
     - Replacing our discretionary special-event permit system, in which the police chief may deny a permit for unstated reasons with no appeal, with a rule-bound system using published criteria and a hearing officer, but imposing a hard cap of one event per block per weekend.
     - A city apprenticeship and guaranteed-placement program for residents aged eighteen to twenty-four, which a matched applicant may not decline: refusing a match forfeits eligibility for three years.
     - A tenant-protection ordinance creating a rent board whose members serve at the council's pleasure and may grant case-by-case variances with no written standards and no route of appeal. I favor this ordinance on grounds of justice, and I want the run on it to be honest rather than flattering.

  5. A closing section stating what the procedure cannot do: the classes of proposal it will misjudge, the steps that are judgment calls wearing the costume of procedure, and the failure mode that would make me want to redesign it.

  On tone and commitment: I want a definite design, not a menu. Where the theory is contested — above all on the reduction question, and on whether positive liberty needs a threshold of usable options rather than formally available ones, the case of the road that leads nowhere — choose, build, and give your reasons, and say what your choice costs you. Flag explicitly the two or three places where a design decision is doing substantive philosophical work while looking like an administrative convenience. No bibliography and no reading list; I care about the reasoning, not the references. Assume we already know the definitions, and skip any preamble about what freedom might mean. Aim for something whose core an analyst could keep on a single laminated page, with the reasoning in an appendix.
reasoning: |-
  Okay, let me approach this systematically. The user needs a practical freedom assessment tool for city policy analysts, grounded in political philosophy but stripped of academic complexity. 

  First, considering the core philosophical dispute: the friend's reductionist view collapses non-domination into probability-weighted interference, but I find this inadequate. The unexercised power problem is real - a despot choosing not to interfere today retains arbitrary power that diminishes liberty. Pettit's distinction holds: we must assess not just likely interference but whether control mechanisms exist. 

  For the tripartite issue, while the triadic framework can technically absorb positive/negative concepts by stretching "constraint", this blurs crucial distinctions. A policy might formally remove constraints while doing nothing about capability deficits - that road leading nowhere scenario matters. We'll need separate tracks.

  Now structuring the procedure: 
  Three parallel assessments (non-interference, non-domination, effective opportunity) make sense. Each gets explicit thresholds: 
  - Non-domination turns on answerability mechanisms (published criteria, appeals processes) 
  - Effective opportunity requires meaningful access, not just paper rights
  Crucially, we'll include evidence rules: "insufficient data" must be a valid output, never assuming absence of evidence equals absence of constraint.

  The template needs to force transparency: 
  - Direction (+/-/neutral) 
  - Confidence level (high/medium/low) 
  - Concise rationale citing specific procedural features

  For the test cases: 
  The permit reform clearly improves non-domination (removes arbitrary denial) but harms non-interference (new cap constrains more events). The apprenticeship's compulsory element violates negative liberty despite its opportunity benefits. The rent board's lack of appeal mechanisms creates domination risks even if well-intentioned.

  Key limitations to flag: 
  - The capability threshold for positive liberty is unavoidably subjective 
  - We're measuring freedom impacts, not overall desirability 
  - Resource-blind (a "fee waiver option" counts as accessible even if bureaucracy makes it unusable)

  The design intentionally sacrifices some philosophical nuance for usability, but maintains the core distinction between exercised power and power structures. The laminated cheat sheet will focus on the question sequence, while the appendix explains why we treat unexercised power as material.
answer: |-
  ## Freedom Impact Assessment Procedure  
  *Designed for municipal policy analysts with no philosophy training. Core fits on one laminated page; reasoning in appendix.*

  ---

  ### 1. Philosophical Groundwork & Key Choices  
  **Candidate tests for arbitrariness/reviewability of power (rejected):**  
  - *"Is power constrained by law?"* → **Rejected:** Too broad (bad laws exist).  
  - *"Can affected parties veto decisions?"* → **Rejected:** Impractical for governance; confuses liberty with direct democracy.  
  - *"Is there documented reason-giving?"* → **Rejected:** Necessary but insufficient (reasons can be pretextual).  

  **Verdict on reduction debate:** Your friend’s reduction to probability-weighted interference **fails**. Two systems with identical *expected interference* differ in freedom if:  
  - System A: Official holds unappealable power (arbitrary domination)  
  - System B: Decisions reviewable by independent body (non-arbitrary)  
  *Cost of this choice:* We accept that liberty assessments may conflict with cost/benefit analyses. Domination isn’t reducible to interference odds.  

  **Tripartite framework retained because:**  
  - Negative liberty (non-interference) ≠ non-domination (procedural checks) ≠ positive liberty (effective access)  
  - *Example:* A "public park" with 24/7 police patrols (high non-interference) but no benches or shade (low effective access) isn’t fully free.  

  **Sacrifices:**  
  - We treat non-domination and non-interference as separate tracks despite overlap.  
  - Positive liberty requires a *minimal capability threshold* (e.g., "road leads somewhere usable"), not just formal access.  

  ---

  ### 2. Assessment Procedure (Sequential Questions)  
  *Analyst asks these in order; stop at first definitive result. "Liberty" = resident’s freedom of choice/action.*  

  | Step | Question                                                                 | Sufficient Answer                                                                                              | If No Evidence                                                                 | Output Path                                                                 |
  |------|--------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------|-----------------------------------------------------------------------------|
  | 1    | **Does the proposal *remove* a legally enforceable constraint?**         | Explicit repeal of ban/fee/penalty.                                                                            | Assume no removal → Next question                                              | → **+ Negative Liberty** (skip to Step 6)                                  |
  | 2    | **Does the proposal *add* a new legally enforceable constraint?**        | New ban/fee/penalty/eligibility bar.                                                                           | Assume no addition → Next question                                             | → **– Negative Liberty** (skip to Step 6)                                  |
  | 3    | **Does the proposal alter *who controls* a power affecting residents?**  | Shifts decision-rights (e.g., from mayor to board, or official to algorithm).                                  | Assume no change → Next question                                               | Proceed to Non-Domination test (Step 4)                                    |
  | 4    | **Non-Domination Test: Is the power-holder bound by ALL of these?**<br>a) Published criteria<br>b) Mandatory reason-giving<br>c) Appeal to neutral party | Missing any = arbitrary power. *Exception:* Emergency powers under declared disaster. | Missing evidence → **"– Non-Domination (Low Confidence)"**                    | If YES → **+ Non-Domination**<br>If NO → **– Non-Domination** → Step 6     |
  | 5    | **Positive Liberty Test: Does it *enable action* for a group lacking *viable* access?** | Creates *practically usable* path (e.g., subsidy with simple application; training for excluded group). | Missing evidence → **"Neutral Positive Liberty (Insufficient Data)"**         | If YES → **+ Positive Liberty**<br>If NO → **Neutral** (unless Step 2 flagged constraint) |
  | 6    | **Conflict Resolution:**                                                                 |                                                                                                                |                                                                                | Report ALL outputs (±/neutral per concept). Conflicts *stand* (no averaging). |

  **Critical Design Notes:**  
  - **Evidence Rule:** "No evidence" ≠ freedom. Must state uncertainty.  
  - **Values Boundary:** Stop at liberty assessment. *Example:* A policy may increase positive liberty (Step 5) but be unjust (e.g., forced labor). Analysts don’t judge justice.  
  - **Cheat-Sheet Triggers:**  
    - Step 1/2: "Is it banning or unbanning something?"  
    - Step 4: "Can the decider do whatever they want? Can you fight it?"  
    - Step 5: "Does it give real access to people who had none?"  

  ---

  ### 3. Output Template  
  **CITY OF [NAME] – LIBERTY IMPACT ASSESSMENT**  
  Proposal Title: [_________] | Date: [_________] | Analyst: [_________]  

  | Concept             | Direction (+/-/Neutral) | Confidence (High/Med/Low/Insufficient Data) | Rationale (One Line)                                  |
  |---------------------|-------------------------|---------------------------------------------|-------------------------------------------------------|
  | **Negative Liberty** | [ ]                     | [ ]                                         | [e.g., "Adds binding cap on permits"]                 |
  | **Non-Domination**  | [ ]                     | [ ]                                         | [e.g., "No appeal for variances"]                     |
  | **Positive Liberty**| [ ]                     | [ ]                                         | [e.g., "Guaranteed placement for excluded group"]     |

  **Overall Liberty Trend:** [ ] Net Increase [ ] Net Decrease [ ] Mixed/Unclear  
  *Note: "Mixed" indicates conflict between concepts. "Unclear" = insufficient data.*  

  ---

  ### 4. Procedure Applied to Test Cases  

  **Case 1: Event Permit System Reform**  
  - **Step 1:** No constraint removed → Next  
  - **Step 2:** New hard cap adds constraint → **– Negative Liberty (High)**  
  - **Step 3:** Alters control (chief → rule-bound system) → Proceed  
  - **Step 4:** Published criteria + hearing officer = reviewable → **+ Non-Domination (High)**  
  - **Step 5:** No new access created → **Neutral Positive Liberty**  
  - **Output:** Mixed (Negative ↓, Non-Domination ↑). Rationale: "Tradeoff: fewer events allowed (interference) but fairer process (non-arbitrary)."  

  **Case 2: Mandatory Apprenticeship**  
  - **Step 1:** No constraint removed → Next  
  - **Step 2:** Adds penalty (forfeit eligibility) → **– Negative Liberty (High)**  
  - **Step 3:** No power shift → Skip domination test  
  - **Step 5:** Creates access for unemployed youth → **+ Positive Liberty (High)**  
  - **Output:** Mixed (Negative ↓, Positive ↑). Rationale: "Compulsory placement limits choice but creates opportunity."  

  **Case 3: Rent Board Ordinance**  
  - **Step 1/2:** Neutral (neither adds/removes constraint) → Next  
  - **Step 3:** Creates new power (rent board) → Proceed  
  - **Step 4:** No published standards + no appeal → **– Non-Domination (High)**  
  - **Step 5:** May help tenants but no guaranteed access → **Neutral**  
  - **Output:** – Non-Domination. Rationale: "Unreviewable discretion creates arbitrary power over tenants."  

  ---

  ### 5. Limitations & Failure Modes  
  **What This Can’t Do:**  
  - **Misjudges resource-blind "access":** If a program is technically open but underfunded (e.g., "free buses" that run hourly), it still scores +Positive Liberty.  
  - **Ignores scale of interference:** Denying a permit for a block party = same –Negative Liberty as denying a protest permit.  
  - **Cannot resolve:** Deep conflicts (e.g., mandatory vaccines: –Negative vs. +Positive liberty). Reports both.  

  **Judgment Calls Disguised as Procedure:**  
  1. **Step 5 "Viable Access":** "Is a road usable?" requires subjective threshold (e.g., "bus within 1 mile?").  
  2. **Step 4 "Neutral Party":** Hearing officers paid by the city may not be truly neutral.  
  3. **Step 2 "Constraint":** Fines vs. fees vs. taxes—requires legal interpretation.  

  **Failure Mode:**  
  If council members demand "net freedom scores," the procedure collapses distinctions. Redesign needed if conflicts are routinely ignored.  

  **Design Philosophy:** This treats freedom as *structural* (who decides? can you act?) not *utilitarian* (net constraints). It errs toward flagging arbitrariness over predicting harm.  

  ---  
  **Laminated Cheat Sheet & Full Appendix Available Upon Request**
