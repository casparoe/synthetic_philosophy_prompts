answer: |-
  This phenomenon you describe is profoundly important yet lacks a single established term. It sits at the intersection of institutional economics, social ontology, the philosophy of law/classification, and path dependence theory. Here's a breakdown of relevant concepts, their fit, limitations, and a proposed synthesis:

  **Established Concepts & Their Fit/Limitations:**

  1.  **Path Dependence:**
      *   **Fits:** Perfectly captures the core mechanism: early, contingent choices (choosing *any* arbitrary number) create increasing returns to adherence. The cost of switching rises dramatically over time due to investments, routines, and expectations built around the *specific* value. Explains the asymmetry (new thresholds are malleable; old ones are "locked in").
      *   **Runs Out:** Path dependence is a broad framework. It doesn't inherently emphasize the *open acknowledgment of arbitrariness* or the *precise value specificity* of the lock-in. It explains *why* it's hard to move, but not the specific dynamic around the number itself being arbitrary-yet-fixed.

  2.  **Schelling Point (Focal Point):**
      *   **Fits:** The chosen number becomes a salient coordination point ("let's all use 10ppm"). This salience, even if arbitrary, facilitates coordination among actors (regulators, industry, researchers) and reduces transaction costs. Explains *why* a specific number is chosen initially and persists as a coordination device.
      *   **Runs Out:** Schelling points are often *discovered* (e.g., 50/50 split) rather than explicitly chosen. Your committees *choose* consciously, acknowledging arbitrariness. More crucially, Schelling points don't inherently explain the *increasing rigidity* or the massive infrastructure lock-in you describe. The cost of moving isn't just coordination failure; it's the cost of rebuilding systems.

  3.  **Institutional Lock-in / Entrenchment:**
      *   **Fits:** Directly describes how rules, once established, become embedded in legal, economic, and social systems, creating powerful constituencies (your "constituency" point) and high switching costs. Explains the resistance to change regardless of the underlying logic.
      *   **Runs Out:** "Institutional entrenchment" is general. It doesn't highlight the unique features: the *arbitrariness acknowledged at inception*, the lock-in to the *exact numerical value* (not just the rule's existence), and the *asymmetry based on age*. Entrenchment can happen to rules with perceived principled foundations too.

  4.  **Sunk Costs & Network Effects:**
      *   **Fits:** Explains the *mechanism* of lock-in. Investments in forms, tooling, software, training, research cohorts, contracts, etc., are sunk costs tied to the *specific number*. The value gains network effects: its usefulness increases as more systems adopt it, making deviation costly for any single actor. Explains why tiny changes are disproportionately expensive.
      *   **Runs Out:** These are economic mechanisms underlying the phenomenon, not a name for the phenomenon itself. They don't capture the *open arbitrariness* or the specific context of *classificatory thresholds on a continuum*.

  5.  **The Sorites Paradox (Reversed):**
      *   **Fits:** You correctly identify the reversal. Instead of imperceptible steps leading to a significant change (heap of sand), imperceptible steps *away* from the threshold in terms of underlying reality are blocked because each step *towards* institutional dependence has solidified the boundary. The "accumulated residue" *is* the sunk costs and network effects.
      *   **Runs Out:** The Sorites is a paradox about vagueness and categorization. Your phenomenon is about institutional inertia and cost, leveraging a sharp (though arbitrary) boundary. It's more about practical blockage than logical paradox.

  **Synthesis, Coined Term, and Boundaries:**

  No single existing term perfectly captures the *combination* of: (1) **Openly acknowledged initial arbitrariness** of a precise numerical value on a continuum, chosen for practical reasons, (2) **Value-specific lock-in** driven by sunk costs, network effects, and constituency formation, (3) **Increasing rigidity with age** (asymmetry), and (4) **Resistance disproportionate to the proposed change's impact on the underlying reality.**

  **Proposed Term: Value-Specific Entrenchment (VSE)**

  *   **Definition:** The process by which a precise numerical threshold, initially acknowledged as arbitrary but adopted for practical reasons, becomes increasingly resistant to change over time due to the accumulation of sunk costs, network effects, and institutional dependencies specifically tied to its exact numerical value, creating resistance disproportionate to the significance of the value shift and inversely proportional to the threshold's age.
  *   **Key Features:**
      *   **Value-Specificity:** Lock-in is to the *exact number* (10.0ppm), not just the concept (a contaminant threshold).
      *   **Acknowledged Arbitrariness:** Essential. If the threshold is believed principled, challenges focus on the underlying rationale. VSE resistance focuses *solely* on the cost of changing the established number, *despite* agreement on its arbitrariness.
      *   **Asymmetry:** New thresholds are vulnerable; old thresholds are fortified.
      *   **Disproportionate Resistance:** Moving by 1 unit after 20 years is harder than moving by 10 units after 1 year.
      *   **Constituency Formation:** The number develops stakeholders invested in its perpetuation.

  **Boundaries & What It's Not:**

  1.  **Ordinary Rule Conservatism:** VSE is distinct because:
      *   **Basis of Resistance:** Conservatism resists change due to belief in the rule's *merit*, tradition, fear of unknown consequences, or simple inertia. VSE resistance is *explicitly pragmatic*: "We all know it's arbitrary, but changing it *now* costs $X million and disrupts Y systems." The arbitrariness is central to the *nature* of the resistance.
      *   **Value Specificity:** Conservatism might defend a rule category; VSE defends the *exact numerical value*.
      *   If people genuinely believe the number is non-arbitrary, resistance looks different – appeals to principle, data, natural kinds. VSE resistance cites compliance costs and system dependencies *while conceding the principle is arbitrary*.

  2.  **Meaning Drift (e.g., Persuasion):** VSE involves a *fixed* extension fortified, not a drifting one. The definition tied to 10.0ppm remains constant; everything *around* it solidifies.

  3.  **Boiling Frog / Sorites Progression:** As you note, VSE is the *reverse*: the accumulated small steps (of institutional dependence) *prevent* any further movement, even negligible ones.

  **Philosophical Weight:**

  This has **significant philosophical weight**, primarily in social ontology and the philosophy of law/classification:

  1.  **Creating Social Reality:** VSE demonstrates how human practices *create* robust, impactful social facts (e.g., "contaminant = 10.0ppm+") that are ontologically dependent on collective acceptance and institutional scaffolding, *despite* lacking a "natural" foundation. The boundary gains "practical character" through use, not discovery.
  2.  **Meaning vs. Operation:** You ask the crucial question: *"Does a history of use supply something that the continuum itself does not... Or does the accumulation change everything about how the rule operates and nothing about what it means?"*
      *   **Answer:** The accumulation changes *everything about how the rule operates* and its *practical significance*, but **nothing fundamental about what it *means*** in terms of its relationship to the underlying continuum. The meaning remains: "This arbitrary line defines category X." However, its *social meaning* or *institutional force* becomes immense.
      *   **The "Better Answer" Question:** After 20 years, the question "Which side is case Z on?" does **not** have a *better* answer regarding the underlying reality (e.g., toxicity risk) than it did on day one. The *arbitrariness persists*. However, it has a vastly *more consequential* answer regarding legal status, costs, eligibility, etc. The *practical implications* are clearer and weightier, but the *epistemic* or *natural kind* justification for that specific number hasn't improved. History supplies *institutional reality*, not *natural justification*.
  3.  **The Nature of Rules & Conventions:** VSE highlights a powerful type of convention where the *specificity* of the agreement (the exact number) is crucial to its entrenchment, unlike broader conventions (e.g., driving on the right). It shows how rules can derive immense force purely from the systemic costs of alteration, independent of their inherent reasonableness.
  4.  **Path Dependence & Social Construction:** It's a stark example of how contingent starting points, amplified by positive feedback loops (network effects, sunk costs), can lock societies into suboptimal or arbitrary arrangements. It challenges notions of rational institutional design.
  5.  **Law & Arbitrariness:** VSE is central to legal realism and the critique of formalism. It shows how ostensibly precise, objective legal thresholds can be arbitrary yet become practically immutable due to institutional inertia, raising questions about fairness and adaptability.

  **Conclusion:**

  **Value-Specific Entrenchment (VSE)** captures the phenomenon you describe. It arises from the interplay of acknowledged initial arbitrariness, path dependence, sunk costs, and network effects, all focused on a precise numerical value. It has substantial philosophical weight, demonstrating how institutional practices create powerful, persistent social facts out of arbitrary choices, fundamentally altering the operational reality of a rule without altering the fundamental arbitrariness of its relationship to the underlying continuum it purports to classify. The resistance is distinct from ordinary conservatism precisely *because* it openly concedes the arbitrariness while pleading the overwhelming practical cost of change. The "better answer" after years is only better in terms of knowing the immense practical consequences; it provides no better justification for why *that specific number* was the right cut-off point in the first place. The boundary's power is entirely a product of its history of use, not its correspondence to a pre-existing joint in nature.
