  Also, the user’s point about accumulated residue blocking revision is crucial. Each small step of compliance builds dependencies, making reversal costly. This reverses the sorites paradox, where small steps lead to big changes; here, small steps prevent change. 

  I need to ensure I address all parts: the term, the philosophical implications, and the boundaries of the concept. Highlighting the difference between believing a threshold is principled versus arbitrary is essential. If people think it’s principled, they might defend it on merit, not just cost. But here, the defense is purely pragmatic. 

