prompt: |-
  Novelist here, fifth book out in the spring, and for the last couple of years I've been reading around in classical Indian epistemology at night — mostly the Nyāya people and their lists of pramāṇas. What hooked me is that they were willing to have four or five or six separate channels of knowing and then argue for centuries about which ones collapse into which. That's much finer-grained than anything I got in a survey course. I'm not a scholar and my Sanskrit is nonexistent, so please don't hand me a reading list or citations — I cant chase them and I don't want them. What I want is your judgement as the expert in that literature: does the thing I'm about to describe already have a name in it?

  Here's the thing. I leave scenes out on purpose, and readers reliably supply them. Two from the current manuscript. (a) A woman's brother says, in dialogue, that their mother spent every day of that August in the house, too ill to leave her bed; eleven pages later the narrator notes that the mother's shoes are by the door with river mud caked into the welts. Nothing else is said about it. Every one of my early readers came away knowing that the mother had gone down to the river, would argue for it, and got irritated with me when I pointed out that the book never says so. (b) A chapter ends with a man putting a letter inside his coat; the next chapter he's on a train, coat empty, no letter. Readers will tell you flatly that he posted it at the station. Now, I don't want the name for "readers fill in gaps" — I have that phrase, it's useless to me. What seems distinctive, and maybe worth its own slot, is three things. First, no rule is doing the work. In the mud case the reader isn't applying any general connection — river mud doesn't always mean a secret trip, sick mothers don't always lie — they posit one particular unreported event purely because otherwise two things the book has handed them can't both stand, and that event is the cheapest way to make them stand together. Second, nobody is telling them anything. The author isn't asserting it, and the reader knows perfectly well the author isn't asserting it, so whatever warrant this has, it doesn't look like the warrant of taking a trustworthy person's word — the trustworthy person is pointedly not speaking. Third, and this is the part I have no handle on: it goes into memory as if it had been presented. Six months on, a reader will describe the mother's walk to the river in detail, with feeling, and be genuinely startled to be shown the page where it isn't there. It isn't stored as a guess they made; it's stored as something they were told, or something they saw.

  So — think this through rather than pattern-matching to the nearest buzzword, and start by brainstorming candidates before you commit to one. Which items in that framework come closest? Is the "resolve an incompatibility by positing what was never observed" move the same thing one school wanted as its own channel and another tried to fold into inference, and if so what exactly breaks when you transplant it from the world into an artifact where a person planted the incompatibility for effect? Does my second point kill the testimony option outright, or is there some version of trustworthy-speech that covers a speaker who means you to supply what they witheld? And the memory business — confident recollection of a scene that was never given — is that a recognised failure anywhere in those debates, or would it have had no slot at all and belongs to a different discipline entirely? For each candidate you weigh, I want what it does and doesn't cover here and where the edges sit, not just a label dropped on the whole bundle. If nothing fits the bundle as a whole, coin me a term, define it so I can separate it from ordinary gap-filling on one side and from plain inference on the other, and tell me which of my two examples is the hard boundary case — does the posted letter belong with the river mud, or is it a different animal because there was never any contradiction to resolve?
reasoning: |-
  Okay, let's tackle this novelist's query. They're deep into classical Indian epistemology but need practical insights, not academic citations. Their core question: does the specific technique they use—where readers fabricate unstated scenes to resolve narrative inconsistencies—have a name in Nyāya or related systems?

  First, unpacking their three key features:
  1. **No general rule**: Solutions are ad hoc, not based on universal principles (unlike typical inference).
  2. **No testimony**: The author deliberately withholds information, so it's not about trusting a source.
  3. **False memory**: Readers later recall fabricated events as actual text.

  Hmm. Let's brainstorm Nyāya's pramāṇas:
  - **Perception (pratyakṣa)**: Nope—this is about sensory input, but here readers "see" absent events.
  - **Inference (anumāna)**: Close but not quite. Standard inference uses universal rules (vyāpti), like "smoke implies fire." Here? No such rule—it's contextual gap-filling. The river-mud contradiction requires inventing a *specific* event, not applying a generality.
  - **Testimony (śabda)**: Doesn't fit. The author isn't asserting anything; they're strategically silent. Even "implied testimony" feels stretched because the reader knows the omission is intentional.
  - **Analogy (upamāna)**: Irrelevant—no comparisons here.
  - **Presumption (arthāpatti)**: Ah, now this is interesting. Nyāya and Mīmāṃsā debated arthāpatti as "postulation to resolve conflict." For example: "Devadatta is alive but not at home" → therefore he's elsewhere. But classical arthāpatti resolves *real-world* contradictions. In fiction, the conflict is *engineered by the author*. Does that break the mechanism?  
    - Also, arthāpatti typically yields certainty ("must be true"), while here readers treat fabrications as actual story content. That memory glitch isn't discussed in classical texts.

  **Where classical frameworks fall short**:  
  - The false-memory effect feels more like cognitive psychology (e.g., schema-driven memory distortion).  
  - Fiction vs. reality: Nyāya focuses on valid knowledge of the world, but here the "truth" is narrative coherence, not factual accuracy.  

  **Synthesizing a new term**:  
  Since no existing pramāṇa fully fits, let's coin **"kāvyārthāpatti"** (poetic postulation):  
  - *kāvya* (poetry/narrative) + *arthāpatti* (presumption).  
  - Defined as: *reader-generated narrative elements to resolve authored incompatibilities, stored as diegetic truth*.  

  **Boundary cases**:  
  - The river mud is the pure example (contradiction → invented event).  
  - The posted letter is trickier—no explicit contradiction, just implication. That edges toward standard gap-filling (anumāna-lite). So the letter case is the *weaker* boundary.  

  **Why this matters for the novelist**:  
  They’re creating a "cognitive artifact" where readers *collaborate* in world-building. The false memory isn’t a bug—it’s proof the device worked. Classical frameworks didn’t address this because they weren’t analyzing constructed narratives.  

  Final note: The emotion readers feel about the mother’s walk? That’s the *alaukika* (non-ordinary) power of literature—making the inferred feel witnessed.
answer: |-
  You've put your finger on something profound that straddles epistemology, narrative theory, and cognitive psychology—and while classical Indian systems don't have a *perfect* fit for your bundled phenomenon, we can get startlingly close by dissecting their tools. Let's break it down candidate by candidate, then synthesize.  

  ### Core Candidates from Nyāya/Mīmāṃsā Frameworks:  
  1. **Arthāpatti (Presumption/Postulation)**:  
     - **What it is**: Resolving incompatibility between two facts by presuming an unobserved fact. *Classic example*: "Devadatta is alive but not in his house" → therefore "He must be *elsewhere*."  
     - **Fits your cases?**  
       - **Yes**: Your river mud directly mirrors this. Two incompatible facts (mother bedridden + mud-caked shoes) force the presumption of an unobserved event (her trip to the river). No general rule—pure contextual necessity.  
       - **But**: Classical arthāpatti assumes *real-world* contradictions. Your cases are *authored artifacts*. The "incompatibility" is engineered, not discovered. This breaks arthāpatti's metaphysical grounding (truth-seeking) but preserves its *mechanism*.  
     - **Edge cases**: The letter-posting *isn't* arthāpatti. No contradiction—just an unexplained gap (coat full → empty). Readers use habit (letters get posted), not necessity.  

  2. **Anumāna (Inference)**:  
     - **What it is**: Drawing a conclusion based on a universal/pervasive relation (vyāpti). *Example*: "Smoke on the hill" → "Fire on the hill" (because smoke always implies fire).  
     - **Fits?**  
       - **No**: Your readers aren't applying a universal rule (e.g., "mud always means travel"). They invent a *singular* event to fix a *local* contradiction. Inference generalizes; your device particularizes.  
     - **Edge**: If readers assumed "sick people never leave bed" (a general rule), the mud *would* trigger inference. But they don't—they override the "rule" for narrative coherence.  

  3. **Śabda (Testimony)**:  
     - **What it is**: Knowledge from a reliable source's utterance.  
     - **Fits?**  
       - **No (superficially)**: You're right—the author isn't *asserting* the mother's trip.  
       - **But**: Mīmāṃsā theorists debated "implied meaning" (lakṣaṇā/vyañjanā). A strategic silence could be seen as *inviting* the reader to "complete" testimony. Still, this stretches śabda beyond recognition—you're highlighting the *absence* of testimony.  

  4. **Anupalabdhi (Non-perception)**:  
     - **What it is**: Knowing absence by non-encounter (e.g., "No jar here" because you don't see it).  
     - **Fits?**  
       - **No**: Your cases involve *presence* (mud, missing letter), not absence.  

  ### The Memory Problem:  
  - Classical systems treat memory (smṛti) as a *reproduction* of prior knowledge. Your readers "remember" something *never known*. This isn't a recognized failure in Nyāya—it assumes memory is faithful.  
  - **Cognitive lens**: This is closer to "schema-driven memory distortion." Readers integrate the presumption into their mental model of the storyworld, then recall the *model*, not the text.  

  ### Why No Existing Pramāṇa Fully Fits:  
  - **The artifact gap**: Nyāya seeks truth about reality; you're engineering *narrative* truth. Your "incompatibility" is a lure, not an error.  
  - **The authorship factor**: You (the author) *withhold* testimony to *provoke* arthāpatti. Classical systems don't account for intentional gaps.  
  - **Memory illusion**: Unaddressed in epistemology—it's a cognitive bug of narrative immersion.  

  ### Coining a Term: **Kāvyārthāpatti** (Poetic Postulation)  
  - **Definition**: *Reader-generated diegetic knowledge, arising from resolving authored incompatibilities through singular, unobserved events, stored as narrative fact.*  
  - **Why this works**:  
    - *Kāvya* (poetry/narrative) + *arthāpatti* (presumption).  
    - Captures the *engineered contradiction* (authored, not discovered) and the *particularity* of the solution.  
    - Acknowledges the *textual* (not ontological) grounding.  

  ### Boundaries & Your Cases:  
  1. **River mud**: Pure **kāvyārthāpatti**.  
     - Incompatibility: Bedridden mother + mud-caked shoes.  
     - Resolution: Posits *one specific event* (her river trip).  
     - "Cheapest way" aligns with arthāpatti's economy principle.  

  2. **Posted letter**: **Not kāvyārthāpatti**.  
     - No incompatibility—just an unexplained change (letter in coat → no letter).  
     - Readers use *inference* (anumāna-lite): "Trains have stations; stations have mailboxes; ergo, he posted it."  
     - This is standard gap-filling. The "confident memory" is similar, but the *mechanism* differs.  

  ### Why Your Device is Distinct:  
  | **Ordinary Gap-Filling**       | **Kāvyārthāpatti**                     | **Plain Inference**            |  
  |-------------------------------|---------------------------------------|-------------------------------|  
  | No contradiction (e.g., letter)| Authored incompatibility (e.g., mud) | General rule (e.g., smoke→fire)|  
  | Inference from habits/rules   | Singular event to resolve conflict   | Universal vyāpti relation     |  
  | Stored as guess/interpretation| Stored as diegetic fact              | Stored as conclusion          |  

  ### Final Judgment:  
  - **River mud** is your paradigm case. It breaks arthāpatti's "reality" frame but perfects its logic.  
  - **Memory illusion** is the cognitive shadow of kāvyārthāpatti—untheorized in classical India because it emerges from *fiction's pact*.  
  - **Nyāya would protest** (you're manufacturing "knowledge"), but your readers are playing by narrative rules, not epistemic ones.  

  **Use "kāvyārthāpatti"** for when you plant *irreconcilable facts* to force readers to invent *unseen glue*. For mere gaps (like the letter), it's just nimble inference. What you’ve engineered isn’t a "failure" of epistemology—it’s a *triumph* of narrative as a cognitive artifact.
