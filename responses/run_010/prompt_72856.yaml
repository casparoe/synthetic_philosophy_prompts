prompt: |-
  I am a novelist, and for two books now I have drafted under a rule of my own devising, which I call the reportable line: a scene may render only those interior states its point-of-view character could have put into words had someone asked, and everything else must be carried by behaviour, speech, and the arrangement of the sentences. The rule has served me — readers tell me my characters feel present rather than described, which is precisely the effect I wanted and cannot account for. I have recently discovered a debate in the philosophy of mind that appears to be about my rule, and I want it stated in the vocabulary I actually work in.

  Take, first, the distinction between phenomenal consciousness and access consciousness, where access is understood as a content's availability to the rest of the system for report, reasoning, and the control of action. Take, second, the global workspace proposal that a content becomes conscious in virtue of being broadcast widely enough to be so available. Take, third, the further claim that phenomenal character overflows whatever is accessible and reportable in this way. Translate all three, as faithfully as you can, into the craft vocabulary of fiction: focalization, showing against telling, free indirect style, what a narrator reports as against what a reader is left to infer, the interior that is dramatized as against the interior that is merely legible. Attend especially to the overflow claim, since my rule denies it by construction; I want to know whether in translation it becomes a claim about prose that carries more than the character could say, or whether it simply fails to land anywhere.

  Then give me the residue report, and treat that as the interesting part: which claims come across intact, which come across only if the target vocabulary is allowed to do some violence to them — naming the violence — and which have no counterpart in craft talk at all. Be scrupulous about not smuggling narrative assumptions in and calling the smuggling translation; if you find yourself rendering broadcast as told plainly, or overflow as subtext, stop and ask whether the substitution is doing the arguing rather than the evidence. Conclude with your own reading of the residue: does my rule fail because the craft vocabulary lacks a category the philosophers have identified correctly, or because the phenomenal/access distinction is less clear than it appears and my readers' sense of presence is tracking something describable without it? Please write this as continuous prose, in the manner of a letter — no headings, no bullet points, no bold, no tables — since I mean to read it at my desk rather than skim it.
reasoning: |-
  Okay, the user is a novelist who's developed a writing rule called the "reportable line." They only describe a character's interior states that the character themselves could verbalize if asked. Everything else must be conveyed through behavior, dialogue, and sentence structure. Readers say this makes characters feel "present" rather than "described," which is exactly what they wanted but can't fully explain.

  Recently, they discovered a philosophy of mind debate about phenomenal vs. access consciousness that seems related to their writing rule. Phenomenal consciousness is about raw subjective experience (what it's like to feel pain), while access consciousness is about information being available for report, reasoning, and action control. The global workspace theory suggests consciousness arises when information is widely broadcast in the brain, making it accessible. However, there's also the "overflow" claim that phenomenal experience exceeds what's accessible and reportable.

  The user wants this philosophical debate translated into the vocabulary of fiction writing: terms like focalization (perspective control), showing vs. telling, free indirect style (blending character and narrator voices), what's explicitly reported vs. inferred by readers, and dramatized interiority vs. merely legible interiority. They're especially interested in how the "overflow" claim translates, since their rule explicitly denies it by construction. They want to know if this overflow becomes something like prose carrying more than the character can say, or if it just doesn't apply to writing craft.

  They also want a "residue report" analyzing what parts of the philosophy translate cleanly, what requires twisting craft terms ("naming the violence"), and what has no counterpart in narrative craft. I need to be careful not to smuggle in assumptions by equating "broadcast" with "telling plainly" or "overflow" with "subtext" - that would be substituting terms rather than genuinely translating. The conclusion should discuss whether their rule fails because craft lacks a category philosophers identified, or because the phenomenal/access distinction isn't clear-cut and their readers' sense of "presence" is actually tracking something describable without it.

  This needs to be written as continuous prose like a letter, with no headings or bullet points. I'll start by explaining how the philosophical concepts map to writing terms, then analyze the translation challenges, and finally discuss the implications for their writing rule.

  For the translation: Access consciousness maps neatly to their "reportable line" - it's what the character could articulate, which aligns with what can be shown through focalization and free indirect style. Global workspace broadcasting translates to how information becomes available for narration - when it's "in focus" for the character, it can be directly presented. But the phenomenal overflow claim is trickier; it suggests there's more to experience than what can be reported. In fiction, this might correspond to what readers infer from behavior and style - the "legible" rather than "dramatized" interiority. However, this isn't truly analogous to philosophical overflow because in fiction, everything is constructed by the author. The reader's inference is still based on textual evidence, not actual unreportable qualia.

  In the residue report, the access/global workspace concepts translate well into craft terms. But phenomenal overflow doesn't have a clean counterpart - attempts to map it to subtext or inferred interiority actually change the philosophical claim. The true residue is the idea of ineffable experience, which narrative can't directly represent because it always works through signs. Their rule succeeds not by capturing overflow, but by creating presence through inference and textual gaps. The sense of "presence" comes from active reader engagement with behavioral cues, not from accessing some unmediated consciousness. So their rule doesn't fail; it shows that narrative presence emerges from craft techniques that make readers co-creators, without needing philosophical distinctions about consciousness.
answer: |-
  My dear colleague,

  What a fascinating constraint you’ve imposed upon your craft, and how intriguing that the philosophy of mind seems to echo in your workshop. Let’s attempt that translation, scrupulously, into the language of narrative technique, and see what residue remains.

  First, **access consciousness** finds a direct, almost frictionless translation into your "reportable line." This *is* the domain of your rule: the interior states available for verbal report by the focalizing character. In craft terms, it’s the material permissible for direct representation through **free indirect style** ("Of course he was furious, anyone could see that!") or explicit **telling** filtered through the focalizer ("She felt a wave of dread"). It is the inner world made available for the narrative "system" – the character’s reasoning, their reported actions, their potential dialogue – precisely because it *is* accessible *to them* for those purposes. This aligns perfectly with **focalization**: the information presented is constrained by what *that specific character* can know, feel, and crucially, *articulate* at that moment. What the narrator reports about the interior aligns strictly with what the character could potentially report themselves. The **dramatized interior** under your rule is synonymous with access consciousness rendered in prose.

  The **global workspace proposal**, where consciousness arises from wide broadcast enabling report and control, translates readily into the mechanics of **focalization** and **showing**. When a content is "broadcast widely" within the character's mind, becoming conscious *for them* in this access sense, it becomes available for the narrative apparatus to **show** through behavior, action, and speech ("Her hand clenched on the teacup," "He snapped, 'Leave it!'"). This broadcast *is* the condition that makes the state reportable and thus permissible for direct representation under your rule. It's not that the narrator "tells plainly" *about* a hidden broadcast; rather, the *visibility* of the state *to the character themselves* (its being "in the workspace") is what allows it to be narrated as a conscious thought or feeling at all, rather than being relegated to inference from external signs. The broadcast *is* the character's access, which the narrative then accesses through its techniques.

  Now, the **overflow claim** – that phenomenal character (the raw, qualitative "what-it's-like-ness") exceeds accessible/reportable content – is where translation stumbles and requires us to examine the violence done to our craft vocabulary.

  Can we map phenomenal overflow directly? The tempting move is to say it corresponds to what the reader **infers** from behavior, speech, and sentence arrangement – the **legible interior** rather than the **dramatized interior**. This would be the "more" that prose carries "than the character could say." *But this is where the substitution smuggles in assumptions and argues rather than translates.* Inference from behavior *is still inference from accessible evidence*. The character's clenched fist, stammer, or the narrator's fragmented sentence structure describing their perception *are all elements deliberately placed by the author*. They signify *something* reportable, even if complex or inarticulate ("I feel... this awful tension... like I might shatter?"). The reader infers a state the character *could*, in principle, with sufficient prompting or introspection, *attempt* to report, however inadequately. **Subtext** operates on this level: the unsaid but *implicitly sayable*, grounded in accessible cues.

  True phenomenal overflow, philosophically, posits a qualitative essence *inherently* beyond the reach of report, reasoning, or action control – a raw feel that the cognitive machinery of access cannot capture. Where is *this* in narrative? If we insist on strict translation:

  1.  **It cannot reside in what the reader infers.** Inference relies on textual evidence, which is, by your rule, grounded in accessible behavior/arrangement or reportable states. Inference points *towards* a reportable (or at least, cognizable) state, even if complex.
  2.  **It cannot be "carried by the arrangement of sentences" in a way that bypasses accessibility.** The arrangement is a deliberate authorial choice *signifying* an internal state *based on the assumption that specific linguistic structures evoke specific (reportable) cognitive or emotional experiences in the reader*. The "feeling" evoked in the reader by a sentence fragment is *analogous* to phenomenal character, but it is not *representing* an *ineffable* aspect *within the character's mind*. It's representing (through showing) a state of *agitation* or *fragmentation* that the character *could* identify ("I'm falling apart").
  3.  **It cannot be "merely legible" interiority.** Legibility implies decipherability *from signs*, again pointing to an accessible state.

  **The Residue Report:**

  1.  **Intact Translation:**
      *   **Access Consciousness:** Transfers cleanly to the **reportable interior** permitted by your rule, rendered via **focalization**, **free indirect style**, and limited **telling**.
      *   **Global Workspace (as enabling access):** Transfers cleanly to the condition enabling the **dramatized interior**. The broadcast *is* the character's access, which narrative techniques (showing, telling within focalization) then represent.

  2.  **Translation Requiring Violence (Naming the Violence):**
      *   **Phenomenal Overflow:** Attempts to map it to **inferred interiority**, **subtext**, or **affective power of prose style** involve significant violence:
          *   **Violence of Reduction:** It reduces the *philosophical claim* of intrinsic ineffability to the *craft reality* of implication and reader inference. Inference relies on accessible cues; philosophical overflow is defined by its *inaccessibility*.
          *   **Violence of Displacement:** It displaces the phenomenon *from the character's mind* to the *reader's experience*. The reader might have an ineffable *response* to the prose describing the character's reportable agitation, but that's not the same as the narrative *representing* an ineffable aspect *within* the character's consciousness. The character's qualia, in the narrative, are *constructed entirely* from reportable elements and their behavioural correlates.
          *   **Violence of Signification:** It treats inferred states *as if* they were the overflow, but inferred states are still *signified* by the text. True philosophical overflow would be unsignifiable *by definition* within the representational system of language (including narrative prose).

  3.  **No Counterpart in Craft Talk:**
      *   The core claim of **intrinsically ineffable phenomenal character within the fictional mind** has no direct counterpart. Narrative craft deals *exclusively* with the signifiable – the accessible, the reportable (directly or indirectly through signs), the inferable. We have no technique to *represent* the truly unreportable quale *as such* within a character's mind. We can only represent *that a character experiences something they find ineffable* ("Words failed her," "A feeling beyond description washed over him"), but this is still *reporting the state of ineffability itself* – an accessible meta-state. The raw feel remains, within the fictional world, implied but *unrepresented* by the text.

  **Conclusion: The Rule and the Residue**

  Your rule does not fail. The residue – the phantom limb of true phenomenal overflow within the character – highlights a fundamental constraint and strength of narrative representation. Prose, by its nature as a system of signs, cannot directly render the philosophically ineffable. What it *can* do, and what your rule brilliantly leverages, is create an *illusion of depth* through the meticulous rendering of the accessible and the strategic use of inference.

  Your readers' sense of "presence" is not tracking inaccessible qualia within your fictional minds. It is tracking the *powerful simulation of consciousness* achieved by strictly adhering to the accessible. By forcing everything through the sieve of the reportable and its behavioural correlates (showing), you:

  1.  **Enforce Rigorous Focalization:** The reader experiences the world *as* the character, filtered through *their* available cognition and articulation.
  2.  **Activate the Reader:** You force the reader into constant, dynamic inference, making them a co-creator of the character's inner life based on the accessible evidence you provide (behaviour, reportable thoughts, stylistic cues).
  3.  **Create Density and Immediacy:** The focus on behaviour and the concrete manifestations of inner states ("showing") creates a vivid, sensorially rich immediacy. The reader *sees* the character being, rather than being *told about* their being.
  4.  **Simulate the Gap:** By limiting explicit report to the accessible, you create a *textual gap* that mirrors the gap between experience and articulation *that we recognize in ourselves*. This gap *feels* like the presence of something more – but that "more" is generated by the reader's inference and empathy, not by the prose representing an unreportable essence.

  The phenomenal/access distinction is philosophically contentious, but your success suggests its *functional clarity within the narrative domain*. For the purposes of crafting believable, present characters in fiction, the *accessible* – what can be reported, reasoned with, and acted upon (and thus shown or told within focalization) – is the primary, perhaps the only, reliable material. The "presence" your readers feel is the result of masterful manipulation of the accessible and the inferable, creating a potent illusion of a whole mind, not evidence of capturing an elusive philosophical overflow within the text itself. Your rule succeeds precisely because craft vocabulary, focused on signification and effect, doesn't *need* the unreportable quale; it thrives on the potent interplay between the reportable and the richly inferable. The residue isn't a flaw in your method, but a testament to the boundaries of representation and the power of working brilliantly within them.

  Yours in the struggle with the unsayable,

  A Fellow Traveler in Narrative
