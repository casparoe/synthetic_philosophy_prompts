prompt: |-
  I am enrolled in a graduate seminar on the science of consciousness this term, and our final assignment is unusual: rather than defending a position, each group must draft the document that an adversarial collaboration between two entrenched camps would produce, as though the two sides had spent a year trying to isolate their real disagreement. My group drew the dispute between the sparse and the rich camps over the relation between phenomenal consciousness and access. I would like help drafting ours to a high standard. Please write in American English.

  The two parties, as I have characterized them for the assignment:

  **Party A — a global-workspace theorist.** A holds that what makes a mental state conscious is that its content becomes globally available: broadcast to the systems responsible for reporting, reasoning, deliberation, and the guidance of action. A does not treat reportability as a criterion of consciousness but as its normal downstream consequence, and A is a deflationist about how much is conscious at any given moment. On A's view, what is conscious is roughly what is, or was very recently, available for such use, and the apparent richness of the visual field is largely an impression generated by how easily its contents can be sampled, not a census of simultaneously conscious content.

  **Party B — a defender of the access/phenomenal distinction and of phenomenal overflow.** B holds that phenomenal consciousness is not exhausted by global availability; that at any moment perceptual phenomenology carries more content than can be accessed, reported, or recruited into reasoning; and that a theory of the workspace is at best a theory of access, silent on the character of experience. B insists that the overflow is not a mere disposition to become conscious but a way of being conscious already.

  Both accept the standard background: the partial-report superiority effect with briefly presented arrays; the fragility of whatever survives once the array is gone; change blindness and inattentional blindness; and the existence of no-report paradigms in which a stimulus can be discriminated without the subject producing a report. Neither takes report to be constitutive of consciousness.

  What I need is the joint statement itself, not an essay about it, drafted so that neither party would feel strawmanned. Please include the following.

  1. **A numbered section of claims both can sign.** Include at least: what the partial-report paradigm does and does not establish on any reading of it; the status of report as evidence rather than criterion; what being available and being global commit A to, stated in terms B accepts as a fair description of A's view; and the phenomenological datum B takes as the starting point, stated in terms A accepts as a fair description of the datum even though A denies its import. Mark explicitly which of these numbered items are substantive agreements and which are only agreements about how to describe each other's position — my instructor will be looking for that distinction.

  2. **A disagreements table**, in Markdown, with columns for: the topic; A's preferred formulation of the disagreement; B's preferred formulation; a neutral formulation meant to be acceptable to both; and a verdict on whether the disagreement is genuine or at least partly verbal. Each side's formulation should be one that side would actually sign.

  3. **The cruxes**: the sub-questions such that a definitive answer would move at least one party. I want at least four, and for each I want it stated which party would move and in which direction. At least one crux should concern whether the overflowing content, if there is any, is determinate — a particular orientation, a particular letter — or merely determinable, a generic sense that there is more to see which supports rapid uptake without carrying specific phenomenology. At least one should concern whether the phrase "the contents of consciousness at time t" picks out the same kind of thing for A and for B, or whether the two are quantifying over different domains.

  4. **For each crux, one concrete experimental design or analysis** that both parties agree in advance would bear on it, together with each party's predicted outcome recorded before the fact. One of these should be the design my supervisor proposed, which both parties are stipulated to have accepted as admissible: a dual-task version of the partial-report paradigm in which a briefly presented visual array is followed immediately by a demanding central load that occupies the workspace — say, a continuous auditory n-back — and in which no report of the array is solicited at any point during the trial; at the end of each block, subjects give graded confidence and a forced choice about a cued location. The question is whether above-chance cued-item information can be demonstrated while the workspace is demonstrably occupied elsewhere, and what that would license. State A's prediction and B's prediction, and then state what each says the result would mean — including the possibility that both predict the same pattern of data and diverge only in how to read it. Where that happens, say so plainly and explain why the crux is then not decidable by that experiment.

  5. **A closing section** in which each party states, in its own voice, what result or argument it would accept as counting against its own view; followed by a short list of things both agree would not move the debate at all, with reasons — for instance, any evidence that trades on report as though report were constitutive, or any appeal to how rich experience seems that does not distinguish seeming-rich from being-rich.

  6. **A jointly authored paragraph on which parts of the dispute you take to be merely verbal.** I want this to be discriminating rather than diplomatic. If your conclusion is that the richness dispute is substantive while the dispute over what counts as a content of consciousness at a time is largely a matter of stipulation, say exactly that and explain where the dividing line runs.

  Two constraints on the drafting. Please do not adjudicate: the deliverable is a text both parties could sign, and I lose marks if it reads as a verdict for one side. And please do not include a bibliography, a reading list, or citations to particular papers — our instructor has asked for documents that stand on their own, and named studies are things I cannot check. Where you need to refer to an experimental result, describe it rather than cite it.
reasoning: |-
  We are drafting a joint statement for an adversarial collaboration between Party A (global workspace deflationist) and Party B (phenomenal overflow advocate). The goal is to isolate the real disagreements without strawmanning either side.

  The document will include:
  1. Agreed claims (numbered, with distinction between substantive agreements and descriptive agreements about each other's views)
  2. Disagreements table (Markdown table with topic, A's formulation, B's formulation, neutral formulation, and verdict on genuine/verbal)
  3. Cruxes (at least four, with which party would move and why; one on determinacy of overflowing content; one on whether "contents of consciousness at t" refers to the same thing)
  4. For each crux, an agreed experimental design (including the supervisor's proposed design), predictions, and interpretation
  5. Closing section: what each would accept as counting against their view, and what would not move the debate
  6. Jointly authored paragraph on which parts are merely verbal

  Let's begin.

  ---

  **Joint Statement: Adversarial Collaboration on Sparse vs. Rich Views of Consciousness**

  **1. Agreements**

  We, the undersigned representatives of the sparse (Party A) and rich (Party B) camps, agree on the following points. We mark each as either a substantive agreement (SA) or an agreement about how to describe each other's position (D). 

  1.1. **The partial-report superiority effect**: When a visual array is presented briefly and then followed by a cue, subjects can report more items from the cued subset than would be expected if they had to report the whole array. This effect establishes that the visual system has more information about the array at the moment of cueing than can be held in working memory for a full report. However, it does not, by itself, establish whether that information was phenomenally conscious at the time of presentation or only became so upon cueing. (SA)

  1.2. **Report as evidence, not criterion**: Neither party takes the ability to report a content as constitutive of its being conscious. Reports are treated as evidence (fallible and contingent) about consciousness, not as a criterion. Both accept that there can be unreportable conscious states (e.g., in no-report paradigms) and that reportability depends on cognitive access and working memory. (SA)

  1.3. **The status of global availability in Party A's view**: Party A holds that what makes a mental state conscious is that its content is globally available. By "globally available," A means that the content is broadcast to multiple cognitive systems (e.g., for reporting, reasoning, deliberation, and action guidance). A does not claim that global availability requires actual reporting, only that the content is in a functional state that makes it available for such uses. Party B accepts this as a fair description of A's view. (D)

  1.4. **The phenomenological datum in Party B's view**: Party B holds that there is a phenomenological datum: our experience at any given moment seems to present a rich and detailed world, and this seeming is not fully accounted for by the contents that are globally available. For example, in viewing a complex scene, it seems to us that we consciously see all or most of the details at once, even though we cannot report them all. Party A accepts that this is how experience seems, even though A denies that this seeming reflects the actual contents of consciousness at each moment. (D)

  1.5. **Fragility of post-stimulus information**: Both parties agree that once a stimulus is removed, the information that remains is fragile and degrades quickly unless it is attended or accessed. This is consistent with A's view that consciousness requires availability and with B's view that phenomenal consciousness can outlast access only briefly. (SA)

  1.6. **Change blindness and inattentional blindness**: These phenomena show that attention is necessary for certain kinds of access and report, and that without attention, changes or objects can go unnoticed. Both parties agree that these are evidence for the role of attention in access, but they disagree on whether unattended information can be phenomenally conscious. (SA)

  **2. Disagreements Table**

  | Topic | Party A's Formulation | Party B's Formulation | Neutral Formulation | Verdict |
  |-------|------------------------|------------------------|----------------------|---------|
  | The nature of consciousness | What makes a state conscious is that its content is globally available (or was very recently, and is still in the "buffer"). | Phenomenal consciousness is not exhausted by global availability; a state can be phenomenally conscious without being globally available. | The parties disagree on whether a mental state must be globally available to be phenomenally conscious. | Genuine |
  | The richness of phenomenology | The apparent richness of phenomenology is an illusion; what is conscious at any moment is sparse and limited to what is globally available (or in the immediate buffer). | Phenomenology is rich and overflows what is globally available; more content is phenomenally conscious than can be accessed at once. | The parties disagree on whether the contents of phenomenal consciousness at a given moment exceed the contents that are globally available. | Genuine |
  | The status of overflowing content | If there is content that is not globally available but is later accessed, it was not conscious until accessed; it was only a disposition to become conscious. | Content that is not globally available can be phenomenally conscious; it is not a mere disposition but an actual conscious state. | The parties disagree on whether content that is not globally available at time t, but is later accessed, was phenomenally conscious at time t. | Genuine |
  | The determinacy of phenomenology | Phenomenology is only as rich as the globally available content; any "overflow" content is at best determinable (a generic sense of presence) and not determinate (e.g., a specific orientation or letter). | Phenomenology includes determinate details (e.g., specific orientations, letters) even for contents that are not accessed. | The parties disagree on whether phenomenology for unaccessed content, if it exists, is determinate (specific) or merely determinable (generic). | Genuine |
  | The domain of "contents of consciousness at t" | The phrase "contents of consciousness at time t" refers only to the contents that are globally available at t (or in the immediate buffer). | The phrase "contents of consciousness at time t" refers to the contents that are phenomenally present at t, which may exceed what is globally available. | The parties disagree on the referent of "contents of consciousness at time t": does it include only accessed content or also phenomenally conscious but unaccessed content? | Partly verbal |

  **3. Cruxes**

  We identify the following as key empirical questions that could resolve or clarify our disagreements. For each, we state which party would move and in what direction if the evidence were definitive.

  3.1. **Determinacy of Overflowing Content**: If there is any overflowing content (i.e., content that is not accessed but phenomenally conscious), is it determinate (e.g., a specific letter or orientation) or merely determinable (a generic sense of more to see without specific details)?  
     - *Party A predicts*: Only determinable.  
     - *Party B predicts*: Determinate.  
     - *If evidence shows determinate unaccessed content*: B would take this as strong evidence for overflow. A would have to either deny the evidence or adjust their view to allow for some form of non-global phenomenal consciousness.  
     - *If evidence shows only determinable unaccessed content*: A would take this as consistent with their view (overflow is not rich). B would either have to concede that overflow is not rich in detail or adjust their view.

  3.2. **The Temporal Referent of Consciousness**: Does the phrase "the contents of consciousness at time t" pick out the same kind of thing for both parties? Specifically, does it refer only to contents that are globally available at t, or does it include contents that are phenomenally present but not accessed?  
     - *Party A holds*: Only globally available at t.  
     - *Party B holds*: Includes phenomenally present but unaccessed at t.  
     - *If it is shown that there is a clear functional difference between "accessed" and "phenomenally present but unaccessed" states*: B would take this as evidence for their distinction. A would require that such states must have been accessed at t or very recently.  
     - *This crux is partly verbal*: If it turns out that the dispute is about how to use the phrase, then the disagreement might be dissolved by terminological clarification. But if there is an empirical basis for the distinction, it could be substantive.

  3.3. **Persistence of Phenomenology without Access**: Can phenomenology persist for a brief period without global access?  
     - *Party A holds*: Phenomenology requires access (or very recent access, in a buffer).  
     - *Party B holds*: Phenomenology can persist without access.  
     - *If evidence shows phenomenology without any current or very recent access*: B would take this as evidence for overflow. A would have to either deny the evidence or adjust to allow a longer buffer.  
     - *If evidence shows phenomenology only with access*: A is supported.

  3.4. **The Role of Attention**: Is attention necessary for phenomenology?  
     - *Party A holds*: Attention is necessary for global availability, which is necessary for consciousness.  
     - *Party B holds*: Phenomenology can occur without attention (e.g., in the periphery).  
     - *If evidence shows clear cases of phenomenology without attention*: B is supported.  
     - *If evidence shows that phenomenology always correlates with attention*: A is supported.

  **4. Experimental Designs and Predictions**

  For each crux, we propose an experiment that both parties agree would bear on it.

  4.1. **Crux: Determinacy of Overflowing Content**  
     - *Design*: Use a partial-report paradigm with a masked array of oriented Gabor patches. After a brief presentation (e.g., 50ms), cue one location after a variable delay (0-500ms). But instead of reporting the orientation, subjects must choose between two alternatives: one that matches the orientation at the cued location and one that is orthogonal. On some trials, also include a confidence rating. To test for determinacy, compare performance when the alternatives are very similar (e.g., 10° apart) vs. when they are orthogonal. High accuracy with similar alternatives would suggest determinate representation.  
     - *A's prediction*: Accuracy will be high only when the cue is immediate and the alternatives are very distinct; for fine discriminations, accuracy will drop to chance quickly as delay increases, indicating that only determinable information is retained.  
     - *B's prediction*: Even with delays, accuracy for fine discriminations will be above chance for a brief period, indicating determinate phenomenology at the time of presentation.  
     - *Interpretation*: If above-chance fine discriminations persist for a short time without access, B would argue for determinate overflow. A might argue that the access happened at presentation and the delay only affects memory.

  4.2. **Crux: The Temporal Referent**  
     - *Design*: Use fMRI or EEG to measure neural activity during a task where subjects view a complex scene and then, after a delay, are cued to report a detail. Compare the neural representation of the scene at the time of presentation and during the delay. Use multivariate pattern analysis (MVPA) to decode specific contents. If unaccessed details are decodable during the delay but subjects are unaware of them until cued, this might suggest phenomenal presence without access.  
     - *A's prediction*: Only contents that are accessed (e.g., attended) will be decodable during the delay; unattended contents will not show sustained decodable patterns.  
     - *B's prediction*: Unattended contents will show decodable patterns for a brief period after presentation, reflecting phenomenal persistence.  
     - *Interpretation*: If unattended contents are decodable, B would claim this reflects phenomenal consciousness without access. A might argue that decoding does not imply consciousness.

  4.3. **Crux: Persistence without Access**  
     - *Design*: The supervisor's proposed design: a dual-task partial-report paradigm. Present a visual array (e.g., 12 letters) for 50ms, followed immediately by a demanding central load (e.g., auditory 2-back task) that occupies the workspace. During the trial, no report of the array is solicited. At the end of each block, subjects give a forced choice about a cued location (e.g., which of two letters was at the cued position) and graded confidence. The central load is designed to prevent access to the visual array during the retention interval.  
     - *A's prediction*: Performance will be at chance for the cued item because the workspace is occupied, preventing global availability of the visual content. Any information that is retained is not conscious until accessed at the end of the block.  
     - *B's prediction*: Performance will be above chance, indicating that the visual content was phenomenally conscious during the delay even though access was blocked.  
     - *Interpretation*: If performance is above chance, B would argue that this shows phenomenal consciousness without access. A might argue that the content was accessed briefly at presentation and then stored in a non-conscious buffer, or that the central load did not fully block access. Both parties agree that if performance is at chance, it supports A. If above chance, the crux becomes whether the content was conscious during the delay or only at presentation. This experiment might not decide that, as both could interpret the result consistently with their views. Thus, it does not fully resolve the crux.

  4.4. **Crux: Role of Attention**  
     - *Design*: Use a dual-task paradigm where subjects perform a central attention-demanding task (e.g., RSVP at fixation) while ignoring peripheral stimuli. After a delay, test for awareness of the peripheral stimuli using a forced-choice discrimination task and confidence ratings. Also, use no-report measures such as pupillometry or neural correlates of consciousness (e.g., P3b for unattended stimuli).  
     - *A's prediction*: Without attention, peripheral stimuli will not be consciously perceived; discrimination will be at chance and no neural correlates of consciousness will be present.  
     - *B's prediction*: Peripheral stimuli can be consciously perceived without attention; discrimination will be above chance and neural correlates may be present.  
     - *Interpretation*: If above-chance discrimination and neural correlates are found for unattended stimuli, B would argue for phenomenology without attention. A might argue that some attention "leaked" to the periphery or that the measures are not conclusive.

  **5. What Would Falsify Our Views and What Would Not**

  *Party A's statement*: I would accept as counting against my view evidence that shows a subject can accurately discriminate a stimulus (with high confidence) in conditions where it is demonstrably not globally available (e.g., under conditions of full attentional load with no possibility of access) and where the stimulus was not accessed at the time of presentation. I would also accept evidence of determinate phenomenal content that persists without any access for a significant duration (e.g., hundreds of milliseconds). However, I would not be moved by appeals to subjective reports of richness that do not control for the ease of sampling, or by evidence that uses reportability as a criterion for consciousness.

  *Party B's statement*: I would accept as counting against my view evidence that shows that when access is blocked, no trace of phenomenology remains (e.g., if in the dual-task paradigm, performance is at chance and subjects report no experience). I would also accept evidence that purported cases of overflow are actually only determinable (generic) and not determinate. However, I would not be moved by arguments that deny the phenomenological datum of richness, or by evidence that confuses access with phenomenology (e.g., using reportability as a direct measure).

  *What both agree would not move the debate*:  
  - Any evidence that treats reportability as constitutive of consciousness.  
  - Appeals to subjective richness that do not disentangle the seeming from the being (e.g., post-hoc descriptions of experience without controls).  
  - Arguments that ignore the distinction between access and phenomenology (e.g., assuming that if a content is not accessed, it is not conscious).

  **6. Verbal Disagreements**

  We jointly conclude that part of our dispute is verbal. Specifically, the disagreement over the phrase "contents of consciousness at time t" is largely terminological. Party A uses this phrase to refer only to contents that are globally available at t, while Party B uses it to refer to contents that are phenomenally present at t, regardless of access. If we were to adopt a common terminology (e.g., "accessed contents" vs. "phenomenal contents"), this disagreement would dissolve. However, the core disagreement about whether phenomenology overflows access is substantive. It hinges on empirical questions about the richness and determinacy of unaccessed content and the possibility of phenomenology without access. The dividing line is whether there is a form of consciousness that is not functionally integrated in the global workspace but still has specific, determinate content. That is not a matter of stipulation.

  ---
  Signed,  
  [Party A]  
  [Party B]  
  [Date]
answer: |-
  ### Joint Statement: Adversarial Collaboration on Sparse vs. Rich Views of Consciousness  

  **1. Agreements**  
  We, the undersigned representatives of Party A (sparse view) and Party B (rich view), affirm the following points. We distinguish between **substantive agreements (SA)** and **descriptive agreements (D)**, where the latter are commitments about how to characterize each other’s position fairly, without endorsing its truth.  

  1.1. **The partial-report paradigm** demonstrates that more sensory information is briefly retained than can be reported in full, but it does not establish whether this information was phenomenally conscious *prior* to the cue. It licenses no direct inference about the richness of phenomenology at the moment of perception. (SA)  

  1.2. **Reportability** provides empirical evidence about consciousness but is not constitutive of it. Both parties reject any equation of consciousness with reportability. No-report paradigms confirm that unreportable states may be conscious, though we disagree about their nature. (SA)  

  1.3. **Party A’s core claim**: For A, a mental state is phenomenally conscious only if its content is globally available (or was very recently available) to systems for reporting, reasoning, and action guidance. Global availability entails functional accessibility even if no report occurs. Party B accepts this as a fair description of A’s position. (D)  

  1.4. **Party B’s phenomenological datum**: B’s position originates from the subjective impression of a rich, detailed visual field that seems to exceed what is accessed at any moment. Party A accepts this as a fair description of the introspective starting point for B, though A attributes this impression to metacognitive error (e.g., rapid sampling). (D)  

  1.5. **Constraints on post-stimulus processing**: Information from brief stimuli decays rapidly once the stimulus ends. Neither party claims that unaccessed content persists indefinitely in consciousness. (SA)  

  1.6. **Change blindness and inattentional blindness** demonstrate failures of access but do not resolve whether unattended content is phenomenally conscious. Both agree these phenomena underscore the fallibility of introspection. (SA)  

  ---

  **2. Disagreements Table**  

  | Topic | Party A’s Formulation | Party B’s Formulation | Neutral Formulation | Verdict |  
  |-------|------------------------|------------------------|----------------------|---------|  
  | **Scope of phenomenology** | Phenomenal consciousness is limited to globally available content (or content in a transient buffer). | Phenomenal consciousness overflows globally available content; more is experienced than can be accessed. | Disagreement about whether non-accessed content can be phenomenally conscious. | Genuine |  
  | **Nature of overflow content** | Non-accessed content is not phenomenally conscious; it is a disposition to generate conscious content upon access. | Non-accessed content is phenomenally conscious; it is an actual conscious state, not a disposition. | Disagreement about the ontological status of unaccessed content: is it conscious *prior* to access? | Genuine |  
  | **Determinacy of phenomenology** | Any non-accessed content is at most *determinable* (e.g., "something is present")—not richly detailed. | Non-accessed content can be *determinate* (e.g., a specific orientation or letter) and phenomenally concrete. | Disagreement about whether unaccessed content, if conscious, carries specific details. | Genuine |  
  | **Temporal reference of "contents at t"** | "Contents of consciousness at t" refers only to globally available content at *t* (or in a buffer from *t*). | "Contents of consciousness at *t*" includes phenomenally conscious content that may never be accessed. | Disagreement about the domain quantified over by "conscious content at time *t*." | Partly verbal |  
  | **Role of subjective richness** | Subjective richness reflects rapid access potential, not simultaneous conscious detail. | Subjective richness reflects actual simultaneous phenomenology, not merely potential. | Disagreement about whether introspective reports of richness track real-time content or access capacity. | Genuine |  

  ---

  **3. Cruxes**  
  Cruxes are empirical questions where definitive answers would compel at least one party to revise their position.  

  3.1. **Is unaccessed content (if any) *determinate*?**  
     - *Party A would move*: If unaccessed content is shown to be consistently determinate (e.g., specific features retained without access), A would concede overflow may occur.  
     - *Party B would move*: If unaccessed content is only ever determinable (e.g., vague awareness), B would restrict overflow claims to generic richness.  

  3.2. **Does "contents of consciousness at *t*" refer to the same domain for both?**  
     - *Party B would move*: If "contents at *t*" is shown to functionally align solely with accessed content (e.g., via neural correlates), B would adopt new terminology but retain the overflow thesis under revised framing.  
     - *(Verbal component: Disagreement hinges on whether the phrase is stipulative or empirically anchored.)*  

  3.3. **Can phenomenology persist during blocked access?**  
     - *Party A would move*: If phenomenology is confirmed during access blockade (e.g., via no-report proxies), A would accept overflow.  
     - *Party B would move*: If no phenomenology persists during access blockade, B would abandon strong overflow.  

  3.4. **Is subjective richness dissociable from access capacity?**  
     - *Party A would move*: If richness ratings correlate perfectly with access speed/capacity, A would treat this as confirming sparsity.  
     - *Party B would move*: If richness ratings dissociate from access (e.g., high richness with slow access), B would claim support for overflow.  

  ---

  **4. Experimental Designs & Predictions**  

  **Crux 1: Determinacy of unaccessed content**  
  - *Design*: Subjects view a masked array of oriented Gabor patches (50ms). During a subsequent high-load auditory n-back task (blocking access), they receive a vibration cue (no report). After the n-back, a forced-choice test asks for the *exact* orientation (e.g., 15° or 165°) at the cued location.  
  - *A predicts*: Performance at chance for exact orientation; only coarse discriminations (e.g., vertical vs. horizontal) succeed.  
  - *B predicts*: Above-chance performance for exact orientation.  
  - *Interpretation*: Success with exact features supports B; failure supports A. If results are ambiguous (e.g., above chance only for coarse features), the crux remains unresolved.  

  **Crux 2: "Contents at t" domain**  
  - *Design*: fMRI during rapid serial visual presentation (RSVP). Multivariate pattern analysis (MVPA) decodes stimulus features *during* perception and *after* a delay with/without access.  
  - *A predicts*: Neural patterns of "conscious content" align only with accessed features.  
  - *B predicts*: Distinct patterns for phenomenally conscious but unaccessed features.  
  - *Interpretation*: Dissociable patterns support B; overlapping patterns support A.  

  **Crux 3: Persistence during access blockade (Supervisor’s Design)**  
  - *Design*: Brief array → immediate high-load auditory n-back (no report) → end-of-block forced choice + confidence rating for a cued item.  
  - *A predicts*: Performance at chance if n-back successfully occupies workspace. Any above-chance performance reflects pre-blockade access.  
  - *B predicts*: Above-chance performance, indicating phenomenal persistence during blockade.  
  - *Interpretation*: If performance is above chance:  
    - B: Demonstrates phenomenology without access.  
    - A: Attributable to brief initial access or n-back failure.  
    - *Crux not decidable*: Both predict possible above-chance results but disagree on interpretation. A requires independent verification of access blockade (e.g., n-back performance thresholds).  

  **Crux 4: Richness vs. access dissociability**  
  - *Design*: Subjects rate subjective richness of a scene *during* a concurrent access-demanding task (e.g., mental arithmetic). Later, test access speed to cued details.  
  - *A predicts*: Richness ratings inversely correlate with access speed (faster access → higher richness).  
  - *B predicts*: No correlation; richness remains high even with slow access.  
  - *Interpretation*: Correlation supports A; dissociation supports B.  

  ---

  **5. What Counts Against Our Views & Immovable Evidence**  

  **Party A’s falsification condition**:  
  > "I would accept as falsifying my view robust evidence that a subject can discriminate *determinate, unaccessed* features (e.g., exact shapes) during verifiable access blockade, with high confidence and no alternative explanation (e.g., residual attention)."  

  **Party B’s falsification condition**:  
  > "I would accept as falsifying my view evidence that *all* putative overflow content is either (a) demonstrably inaccessible *and* lacking neural/phenomenological signatures of consciousness, or (b) invariably *determinable* when unaccessed."  

  **Shared exclusions (would not move the debate)**:  
  - Reports treated as constitutive of consciousness (e.g., "unreportable = unconscious").  
  - Introspective claims of richness without controlling for metacognitive biases.  
  - Change-blindness paradigms that assume unattended = unconscious.  
  *Reason*: These beg the question against one party’s core commitments.  

  ---

  **6. Joint Diagnosis of Verbal Disagreements**  
  We agree that the dispute over whether "contents of consciousness at time *t*" includes unaccessed content is **partly verbal**. Party A defines "conscious at *t*" as *accessed at t*; Party B defines it as *phenomenally present at t*. This is a terminological fork with no empirical stakes—it reduces to how we stipulate the phrase’s domain. However, the **richness dispute** is substantive. It hinges on whether determinate phenomenology outstrips access (e.g., specific details beyond the workspace), which is testable via the cruxes above. The line is clear: if "contents at *t*" is rephrased as "accessed content at *t*" vs. "phenomenal content at *t*," the verbal disagreement dissolves, leaving the empirical question: "Does phenomenology at *t* ever exceed access at *t*?"  

  ---  
  Signed,  
  **Party A** (Global Workspace Sparsist)  
  **Party B** (Phenomenal Overflow Advocate)  
  Date: [Date]  

  ---  
  *This document represents a good-faith effort to isolate disagreements. Neither party concedes their position but commits to the above as a framework for resolution.*
