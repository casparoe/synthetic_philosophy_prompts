answer: |-
  ### Case Analysis: Thorne's Wormholes vs. Lewis's Grandfather Paradox  

  #### 1. **Lewis’s Constraint vs. Indeterminate Pasts**  
  Lewis’s account requires *settled historical facts* to ground the time traveler’s inability (e.g., Grandfather *must* survive because he *did*). In the billiard-ball case, the past isn’t settled by initial data; it’s underdetermined, with infinitely many self-consistent solutions. Lewis’s "inability" loses its footing: without a unique historical fact to reference, "what actually happened" is ambiguous. Lewis’s constraint becomes circular—it presupposes a fixed past that the physics renders indeterminate. **Where Lewis is silent:** His framework cannot address *which* consistent solution obtains, as his "can/cannot" duality relies on a single, determinate timeline.  

  #### 2. **Self-Consistency: Vindication or Embarrassment?**  
  - **Vindication:** The infinite solutions satisfy Novikov’s self-consistency principle—no contradictions emerge. The paradox is resolved mathematically.  
  - **Embarrassment:** Physical determinism collapses. Laws don’t pick a unique outcome; they permit *any* consistent history. The "glancing-blow" solutions aren’t merely fine-tuned—they’re *arbitrarily selected* from an infinite set, making the universe appear conspiratorially accommodating (e.g., the ball "just happens" to deflect perfectly). This amplifies the fine-tuning worry into a crisis of explanatory parsimony: why *this* solution?  

  #### 3. **Hawking’s Conjecture: Rival or Refusal?**  
  - **Refusal, not rival:** Hawking sidesteps the paradox by claiming quantum effects prevent CTC formation. He rejects the premise (buildable time machines) rather than engaging with consistency.  
  - **Lab-coated thought experiment:** The entire episode hinges on unphysical exotic matter. It *cannot* adjudicate real time-travel metaphysics—it’s a consistency proof for GR’s equations under idealizations. Its value is heuristic: exposing GR’s tolerance for acausal loops, not testing their feasibility.  

  #### 4. **The Trilemma: Modal, Solution-Set, Probabilistic**  
  Your framing is robust:  
  - **Lewis (modal):** Resolves "ability" via fixed facts.  
  - **Novikov/Thorne (solution-set):** Shows consistency ≠ uniqueness.  
  - **Deutsch (probabilistic):** Uses quantum mechanics to tax multiplicity (unique distributions over paths).  
  Each camp claims victory by prioritizing their domain: Lewis avoids contradiction, Thorne shows classical non-uniqueness, Deutsch restores predictability quantumly. The **multiplicity tax** is real—quantum mechanics pays for classical indeterminism by replacing path-uniqueness with probability-uniqueness. No category error; the layers are distinct but complementary.  

  ---  
  **Verdict: ORTHOGONAL — Lewis's fixed-past modality cannot engage Thorne's underdetermined histories.**
