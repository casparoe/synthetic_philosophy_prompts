prompt: |-
  I work on distributed systems and have no formal philosophy training, so please treat this as an engineering-style analysis rather than a literature survey. The "Moloch" framing and the wider multipolar-trap or race-to-the-bottom literature claim that some bad outcomes are produced by the structure of competition rather than by the character of the competitors. I want to test whether that frame asserts anything a standard noncooperative game-theory analysis (payoff matrices, equilibria, commons problems) does not already assert. My proposed criterion, which you are welcome to attack: a case counts as genuinely trap-shaped only if it is robust to role substitution — swap in any set of well-intentioned, well-informed actors and the same bad equilibrium results anyway.

  Give me your credence, as a number between 0 and 1, that this claim is true: there exists at least one real, well-documented coordination failure that satisfies role-substitution robustness and that the multipolar-trap frame explains better than a standard game-theoretic analysis of the same case would have.

  I do not want a bare number. Decompose it into three to six sub-questions — for example whether role-substitution robustness is even coherent once actors' beliefs and options are specified, whether "explains better" has determinate content here, whether candidate cases exist, and how much of the frame's apparent distinctiveness is rhetorical — and assign each a rough probability with a one-line justification.

  Answer in American English, and return only a JSON object with exactly these fields: `claim_restatement` (your wording of the claim, corrected if you find mine ambiguous); `credence` (number, 0 to 1); `sub_questions` (array of objects with `name`, `probability`, `one_line_reason`, `role_in_combination`); `combination` (the arithmetic or rule that gets from the sub-probabilities to the final number); `most_sensitive` (which sub-question, shifted how far, would move `credence` the most); `verbal_residue` (any sub-question you judge to be a dispute about words rather than fact, plus what substantive disagreement remains once the wording is fixed); `strongest_counterevidence` (the single piece of evidence or argument that would most change your number).
reasoning: |-
  Hmm, the user is asking for an engineering-style analysis of whether the "Moloch" or multipolar-trap concept adds anything beyond standard game theory. They want me to test a specific criterion: that a coordination failure must be robust to role substitution - meaning that even well-intentioned, well-informed actors would still end up in the bad equilibrium.

  The user wants my credence (a probability between 0 and 1) about whether there exists at least one real, documented case that meets this criterion and is better explained by the multipolar-trap frame than by standard game theory. But they don't want just a number - they want it decomposed into sub-questions with probabilities, how they combine, sensitivity analysis, and more.

  I need to break this down systematically. First, I should identify the key uncertainties:

  1. **Does role substitution coherence hold?** Is it even possible to specify actors' beliefs and options in a way that makes "well-intentioned and well-informed" meaningful without the problem collapsing? I think this is mostly coherent with probability around 0.8.

  2. **Are there documented cases?** Are there real-world examples (like climate change or AI races) that satisfy the strict role substitution test? This seems plausible but tricky to prove, so I'll go with 0.6.

  3. **Explanatory advantage?** Does the multipolar-trap frame actually add value beyond highlighting the structure, which game theory already describes formally? This is where I'm skeptical - maybe 0.4 probability that it provides unique insight.

  4. **Distinctiveness vs rhetoric?** How much of the apparent value comes from vivid framing rather than substantive difference? I'd put this at 0.3 since the metaphors might just be packaging.

  5. **Causal vs descriptive?** Does the multipolar frame offer something beyond describing equilibria? Like identifying why interventions fail? This might have some merit at 0.7.

  To combine these, I'll use a product of the key probabilities since they're somewhat independent. Multiplying the critical ones: existence (0.6) and explanatory advantage (0.4) gives 0.24, but I need to include the others. After weighing all factors, I'll settle on a credence of 0.25.

  The most sensitive point is the explanatory advantage - if that probability moves, it greatly affects the overall credence. The verbal residue is around defining "explains better" - is it about intuition or formal content? The strongest counterevidence would be a clear case where the multipolar frame led to solutions that game theory missed.

  I'll structure my response as a JSON object with all the requested fields.
