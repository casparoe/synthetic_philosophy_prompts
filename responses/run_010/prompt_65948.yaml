prompt: |-
  I run a 14-person senior seminar on rational choice, one 90-minute session, and we're doing money pumps next week. They've all seen the argument against intransitive preferences and think it's closed — the reflex answer is "I'd just see it coming and refuse." I want an activity that takes that answer seriously and then breaks it.

  Design it so the cycle isn't handed to them on a role card but gets induced by the setup itself — some structure of goods and payoffs where they genuinely, in the room, come to prefer A to B to C to A — and where the pumping happens over sequential offers with chips (not real money) and nothing hidden from them: theyre told up front that more swaps are coming and can see the whole menu. The thing I want them to land on is that the loss isn't a symptom of being dumb or myopic; then I want them arguing about whether that makes their preferences irrational or just expensive.

  Give me: the exact payoff scheme and the order of offers, and why that order; a precommitment variant where they pick their whole plan at once, and what it shows that the sequential version can't; a debrief mapping moments in the room onto sophisticated vs resolute choice; one question that tells me it landed; and a straight answer about which feature of the real money-pump argument the activity can't reproduce, so I flag it up front instead of getting caught out. Also what predictably goes wrong the first time I run it.
reasoning: |-
  We are designing an activity for a seminar on rational choice, specifically to challenge the reflex response to the money pump argument: "I'd just see it coming and refuse." The goal is to have the participants genuinely form intransitive preferences in the room and then experience being money-pumped, even when they are aware of the entire setup and the possibility of multiple trades.

  Key requirements:
  1. The cycle of preferences (A > B > C > A) should be induced by the structure of goods and payoffs, not handed to them.
  2. Use chips (not real money) and make everything transparent: they know more swaps are coming and can see the whole menu.
  3. The activity should show that the loss isn't due to being dumb or myopic.
  4. Then, lead to a discussion on whether such preferences are irrational or just expensive.

  We'll design the activity in three parts:
  - Part 1: Inducing intransitive preferences.
  - Part 2: Sequential money pump.
  - Part 3: Precommitment variant.

  **Payoff Scheme and Goods:**

  We will use three goods: A, B, and C. Each good is characterized by two attributes (to create a cycle). For example, let's use:
  - Attribute 1: "Taste" (e.g., of fruit: apple, banana, cherry)
  - Attribute 2: "Size" (small, medium, large)

  But to avoid any inherent preferences, we can abstract these to dimensions. We'll assign a payoff based on two dimensions (X and Y) that are incommensurable and create a cycle.

  Define the goods as:
  - Good A: (X=3, Y=1)
  - Good B: (X=2, Y=2)
  - Good C: (X=1, Y=3)

  The payoff for a good is the sum of X and Y? But then A=4, B=4, C=4 -> no cycle. Instead, we need a non-additive valuation. We can use a multiplicative form? Or more naturally, we can set up the payoffs in a way that reflects a trade-off that leads to intransitivity.

  Classic example: 
  - A: (3, 1) 
  - B: (2, 2) 
  - C: (1, 3)

  But then we must define a utility function that is not separable. However, we want the participants to have intransitive preferences without being told the utility. We can present the goods in a context that naturally leads to cyclic preferences.

  Alternatively, we can use a known intransitive setup: the "rock-paper-scissors" of goods. But we want it to be about attributes.

  We can use the following scenario:

  Imagine you are going to a party and you want to bring a fruit basket. The basket has two characteristics:
  1. Sweetness (how sweet the fruit is)
  2. Size (how large the fruit is)

  You have three options:
  - A: Apple (Sweetness: 8, Size: 4)  -> total 12
  - B: Banana (Sweetness: 6, Size: 6) -> total 12
  - C: Cherry (Sweetness: 4, Size: 8) -> total 12

  But again, additive would make them indifferent. We need a non-additive valuation. How about making the utility function such that you prefer the fruit that is more balanced? But that might not create a cycle.

  Let's use a different approach: the participants are told that they value the fruit by the minimum of the two attributes (a Leontief-like preference). Then:
  - A: min(8,4)=4
  - B: min(6,6)=6
  - C: min(4,8)=4

  So B is best, and A and C are tied. Not cyclic.

  We can use a different utility: U = (attribute1)^2 + (attribute2)^2? Then:
  A: 64+16=80
  B: 36+36=72
  C: 16+64=80 -> then A and C are tied and better than B.

  Not cyclic.

  Another idea: use a known intransitive example from decision theory. One common example is when preferences are based on pairwise comparisons that are not aligned.

  We can use the following payoff matrix for the three goods when compared in pairs, but that's circular.

  Alternatively, we can use a scenario with three movie genres and two critics, leading to intransitivity. But we want it to be individual.

  I recall an example by Tversky (1969) with three gambles:

  Gamble A: 7/9 chance to win $4, 2/9 chance to win $0
  Gamble B: 1/9 chance to win $40, 8/9 chance to win $0
  Gamble C: 3/9 chance to win $16, 6/9 chance to win $0

  But then we need to compute expected utility. And if they are risk-averse, etc.

  We can simplify to a deterministic example. 

  Let me propose a different setup: 

  We have three job candidates (A, B, C) and two criteria: technical skills and communication skills. The committee has the following preferences:

  - When comparing A and B: A has better technical skills (8 vs 6), B has better communication (6 vs 8). But the committee slightly prefers technical skills, so A > B.
  - When comparing B and C: B has technical 6, communication 8; C has technical 4, communication 10. The committee now, because the technical gap is larger (6 vs 4) than the communication gap (8 vs 10) which is small, they prefer B > C? But that might not hold.

  Alternatively, we can use a known cycle: 

  Good A: (4, 1)  [meaning: 4 in dimension X, 1 in dimension Y]
  Good B: (3, 2)
  Good C: (2, 3)

  But then if we define utility as U = X + Y, they are all 5. We need a different utility.

  Set utility as U = X * Y? Then:
  A: 4*1 = 4
  B: 3*2 = 6
  C: 2*3 = 6 -> so A is worst, B and C are tied.

  Not cyclic.

  Set:
  A: (5, 1) -> U=5
  B: (3, 3) -> U=9
  C: (1, 5) -> U=5 -> then B is best, A and C are tied.

  Still no cycle.

  We need a cycle. How about if we define the utility as the difference from an ideal point? But that would be transitive.

  Alternatively, we can use the following: the participants are told they have a lexicographic preference, but with a twist. But lexicographic is transitive.

  I found a known example: the "cups of coffee" example.

  But let me design a cycle with three goods and two attributes by having a third hidden attribute? But we want it transparent.

  Another idea: use a context of choosing between three routes for a commute, with two attributes: time and scenery. But we need a cycle.

  We can use the following utility function that is not additive: U = |X - Y|. Then:
  A: |4-1| = 3
  B: |3-2| = 1
  C: |2-3| = 1 -> so A is worst, B and C are best. Not cyclic.

  How about U = X - Y? Then:
  A: 4-1=3
  B: 3-2=1
  C: 2-3=-1 -> then A>B>C. Transitive.

  After some thought, I recall that intransitive preferences can arise when using a weighted additive model if the weights change depending on the context (like in the similarity effect). But that's for choice under uncertainty.

  Alternatively, we can use a simple cycle induced by majority rule in a group, but we want individual preferences.

  Given the difficulty, we might use a direct method: tell the participants that they are to express preferences over three abstract goods (A, B, C) but we will structure the payoffs so that they have a cycle. But that's not natural.

  We can use a known example: the "Eddy cycle" from psychology.

  Here's an example from Eddy (1982) for intransitive preferences in medical decisions:

  Treatment A: 80% chance of cure, 0% side effects
  Treatment B: 90% chance of cure, 5% side effects
  Treatment C: 100% chance of cure, 10% side effects

  But then if you compare:
  - A vs B: 10% more cure vs 5% side effects -> might prefer B
  - B vs C: 10% more cure vs 5% side effects -> might prefer C
  - C vs A: 20% more cure vs 10% side effects -> might prefer C, so transitive.

  Not working.

  After research, I remember that Tversky (1969) has an example with three gambles that can be intransitive for some people. But we need a simple one.

  I propose we use the following setup with three goods that have two binary attributes, and the participant has a cyclic preference due to focusing on the dominant attribute in each pairwise comparison.

  Attributes: 
  - Attribute 1: Color (red or blue)
  - Attribute 2: Shape (circle or square)

  Goods:
  - A: red circle
  - B: blue circle
  - C: blue square

  Now, we ask the participant to imagine they have the following preferences:
  1. They prefer red to blue (so in a choice between A and B, they prefer A).
  2. They prefer circle to square (so in a choice between B and C, they prefer B because B is circle and C is square, and they like circle more).
  3. But when comparing A and C, they focus on the shape and see that A is circle and C is square, so they prefer A? Then we have A>B, B>C, and A>C -> transitive.

  To get intransitivity, we need a third attribute or a different structure.

  Another example: the "dinnerware set" from Ariely. But that's about relativity.

  We might have to accept that we will define the preferences for them, but in a way that they internalize. We can say: "Imagine you are a hiring manager and you care about two attributes: IQ and EQ. You have three candidates:

  - Candidate A: IQ 120, EQ 70
  - Candidate B: IQ 110, EQ 90
  - Candidate C: IQ 100, EQ 110

  Your utility function is U = min(IQ, EQ). Then:
  A: min(120,70)=70
  B: min(110,90)=90
  C: min(100,110)=100 -> so C>B>A. Transitive.

  If we use U = |IQ - EQ|, then:
  A: |120-70|=50
  B: |110-90|=20
  C: |100-110|=10 -> then C is best, then B, then A. Transitive.

  Let's try a different utility: U = IQ + 2*EQ for A vs B, but for B vs C, U = 2*IQ + EQ, and for A vs C, U = IQ + EQ. But that's not consistent.

  This is challenging.

  Given the time, let me propose a simpler solution: use a known money pump setup with three goods and let the participants choose their own preferences, but we structure the trading so that they end up with a cycle. But that might not be genuine.

  Alternatively, we can use the following trick: 

  We will have three goods: A, B, C. 
  We will give each participant a card that secretly tells them their utility for each good. But we want it induced, not handed.

  Another idea: use a Borda count scenario. But again.

  I found a way: use the "Petersburg" style but that's not helpful.

  After careful thought, I recall that in the book "Choices, Values, and Frames" there is an example. 

  Let me define the following:

  Good A: $400 in a red envelope
  Good B: $300 in a blue envelope
  Good C: $200 in a green envelope

  But then we add a twist: the participants are told that they have a strong preference for the color blue over red and green, and also they prefer more money. But then:

  A vs B: B has blue but less money. If they prefer blue so much that they are willing to take $300 in blue over $400 in red, then B > A.
  B vs C: B has blue and $300, C has green and $200, so clearly B > C.
  A vs C: A has $400 and red, C has $200 and green. They might prefer A because of the money difference. Then we have B > A and B > C, and A > C. Transitive.

  To get a cycle, we need:

  A > B, B > C, and C > A.

  So let's try:

  Assume the participant has the following:
  - They prefer blue to red and green.
  - They prefer green to red.
  - And they prefer more money.

  Now let:
  - A: $400 in red
  - B: $350 in blue
  - C: $300 in green

  Then:
  - A vs B: B is blue and A is red -> they prefer blue to red, but A has more money ($400 vs $350). If the money difference ($50) is not enough to overcome the color preference (blue over red), then B > A.
  - B vs C: B is blue and C is green. They prefer blue to green, and B has more money ($350 vs $300). So B > C.
  - A vs C: A has $400 in red, C has $300 in green. They prefer green to red, but the money difference is $100. If the money difference is more important than the color difference (green vs red), then A > C.

  But we have B > A and B > C, and A > C. Not a cycle.

  Let's try to make the money differences such that:

  - A vs B: the money difference is small enough that the color preference (for B) wins: B > A.
  - B vs C: the money difference is small enough that the color preference (blue over green) wins, but note they also have a preference for green over red. We haven't defined blue vs green. Let's assume they prefer blue to green.

  So B > C.

  - C vs A: Now, C is green and A is red. They prefer green to red. The money difference: A has $400, C has $300 -> $100 difference. If they are willing to give up $100 to have green instead of red, then C > A.

  Then we have: B > A, B > C, and C > A. Still not a cycle because there's no contradiction: B is best, then C, then A.

  We need C > A, and also A > something to close the cycle.

  How about four goods? But we want three.

  Let me try a different approach: use a known example from game theory with three lotteries.

   Lottery A: 10% chance to win $100, 90% chance to win $0
   Lottery B: 11% chance to win $90, 89% chance to win $0
   Lottery C: 12% chance to win $80, 88% chance to win $0

  Then expected value:
  A: 10
  B: 9.9
  C: 9.6

  So A>B>C. Transitive.

  But if the participant uses a probability weighting function from prospect theory, they might overweight the 10% and underweight the 11% and 12%. For example, if they have:

  w(0.10) = 0.15
  w(0.11) = 0.16
  w(0.12) = 0.17

  Then:
  A: 0.15 * 100 = 15
  B: 0.16 * 90 = 14.4
  C: 0.17 * 80 = 13.6

  Still A>B>C.

  To get a cycle, we need more complex lotteries. 

  I found an example in Loomes and Sugden (1982) using regret theory, but that's advanced.

  Given the time constraints, I propose we use the following simplified and artificial setup to force the cycle:

  Each participant is given a personal valuation card that says:
  - When comparing A and B, you prefer A if [condition], else B.
  - When comparing B and C, you prefer B if [condition], else C.
  - When comparing C and A, you prefer C if [condition], else A.

  But that's not induced by the goods.

  Alternatively, we can use a vote with three participants to create a cycle, but that's for groups.

  I think for the sake of the activity, we can use the following transparently artificial setup:

  "We are going to do an activity where you will have preferences that are intransitive. Here are three goods: A, B, and C. You will be given a card that tells you your utility for each good, but these utilities are not on a common scale. Instead, you will have: 
  - Good A: 4 utils
  - Good B: 3 utils
  - Good C: 2 utils

  But then it's transitive.

  Let's do:

  - Good A: 4 utils
  - Good B: 5 utils
  - Good C: 3 utils

  Then B>A, A>C, and B>C. Transitive.

  To have a cycle, we can't have a utility function.

   So we must rely on pairwise choices without numerical utilities.

   I propose we use the following story with three goods that have three attributes, and the participant uses a different attribute for each pairwise comparison.

   For example:

   Good A: attribute1=9, attribute2=5, attribute3=5
   Good B: attribute1=5, attribute2=9, attribute3=5
   Good C: attribute1=5, attribute2=5, attribute3=9

   The participant is told that they will choose between two goods by selecting the one that is better in the attribute that is most salient in that pair. For the pair (A,B) attribute1 is most salient, so A>B because 9>5.
   For the pair (B,C) attribute2 is most salient, so B>C.
   For the pair (C,A) attribute3 is most salient, so C>A.

   This creates a cycle.

   We can make it more natural by having the attributes be:
  - A pair (A vs B): compare on "taste"
  - B pair (B vs C): compare on "aroma"
  - C pair (C vs A): compare on "texture"

   And assign:
  - A: taste=9, aroma=5, texture=5
  - B: taste=5, aroma=9, texture=5
  - C: taste=5, aroma=5, texture=9

   Then in pairwise comparisons, they will have A>B, B>C, C>A.

   This is the only way I see to induce the cycle without a group.

   So we will do that.

  **Activity Setup:**

  1. Introduce three goods: three types of fruit (or three abstract goods) with three attributes. Present the attributes for each good in a table:

   Good | Attribute1 (e.g., Taste) | Attribute2 (e.g., Aroma) | Attribute3 (e.g., Texture)
  ------|--------------------------|--------------------------|---------------------------
   A    | 9                        | 5                        | 5
   B    | 5                        | 9                        | 5
   C    | 5                        | 5                        | 9

  2. Explain that when comparing two goods, one attribute will be the most important and they should choose the good with the higher value in that attribute.
     - For comparing A and B, the most important attribute is Taste.
     - For comparing B and C, the most important attribute is Aroma.
     - For comparing C and A, the most important attribute is Texture.

  3. Ask them to pairwise compare and write down their preferences:
     - A vs B: A has better taste (9>5) -> A>B.
     - B vs C: B has better aroma (9>5) -> B>C.
     - C vs A: C has better texture (9>5) -> C>A.

  Now they have the cycle: A>B, B>C, C>A.

  **Money Pump with Chips:**

  Each participant starts with good A and 10 chips (or some initial endowment).

  The experimenter will make a series of offers to trade, and they can accept or reject. But they are told in advance that there will be multiple offers.

  The offers are designed to pump money from them:

  1. Offer 1: Trade good A for good C, and you must pay 1 chip for this trade.
     - Why? Because they prefer C to A (from their preferences), so they are willing to pay a small amount to get C instead of A. So they will accept.

     Now they have C and 9 chips.

  2. Offer 2: Trade good C for good B, and you must pay 1 chip.
     - They prefer B to C, so they will accept.

     Now they have B and 8 chips.

  3. Offer 3: Trade good B for good A, and you must pay 1 chip.
     - They prefer A to B, so they will accept.

     Now they have A and 7 chips.

  They started with A and 10 chips, and now they have A and 7 chips. They have lost 3 chips.

  And they are back to A.

  The cycle can be repeated.

  **Why this order?**
  The order is C, then B, then A. It follows the cycle: from A to C (paying to get to C), then from C to B (paying to get to B), then from B to A (paying to get back to A). It exploits the cycle.

  **Precommitment Variant:**
  At the beginning, they are shown the entire sequence of offers that will be made (without the prices? or with the prices). They are told that they can precommit to a plan: for each offer, whether to accept or reject. They must decide the entire plan at once.

  What they should realize is that if they see the whole plan, they will not accept any trade because they start with A and after three trades and paying 3 chips, they are back to A. So they would choose to reject all.

  This shows that with precommitment, they avoid the pump. This contrasts with the sequential choice where they myopically accept each trade because at each step it seems beneficial.

  **Debate on Sophisticated vs Resolute Choice:**
  - In the sequential version, they are myopic (naive) if they do not look ahead. But we told them the whole menu, so they are not myopic. They are sophisticated if they realize that accepting the first trade will lead to a path that leaves them worse off, and so they refuse the first trade to avoid the pump. In our activity, even though they are told the whole menu, they might still do the trades because at each step it is locally improving.
  - Resolute choice: they would stick to a plan. In the precommitment variant, they make a resolute plan to reject all.

  In the sequential version, if they are sophisticated, they would refuse the first trade to avoid being pumped. But then they never get to experience the cycle.

  To show the pump, we need them to be myopic in the sequential version. But we want to show that even when they are not myopic (because they see the whole menu), they might still fall for it if they are not sophisticated enough to refuse the first trade.

  In the activity, we will see if they refuse the first trade. If they do, then they avoid the pump. If they don't, then they get pumped. We want to set up the preferences so that at each step, the trade is strictly improving, so they have a strong incentive to trade.

  **Debrief Mapping:**
  - Moment 1: When they are offered the first trade (A to C for 1 chip). At this point, a sophisticated agent would realize that if they trade, they will be vulnerable to the next trades and end up worse off. A resolute agent would have committed to a plan and might reject. A naive agent would accept.
  - Moment 2: After the first trade, when offered C to B for 1 chip. Now they are in the cycle and might feel committed.
  - Moment 3: After the second trade, when offered B to A for 1 chip. They complete the cycle and realize they are back to A with fewer chips.

  **Question to Check if it Landed:**
  After the activity, ask: "At which step, if any, could you have avoided the loss of chips, and how? Would avoiding that step have required you to forgo a trade that at the moment seemed strictly improving?"

  **What the Activity Can't Reproduce in the Real Money Pump:**
  In the real money pump argument, the victim is not necessarily aware of the entire sequence of trades in advance. In our activity, we told them the whole menu, which gives them the opportunity to be sophisticated and avoid the first trade. In the real world, the exploiter might not reveal the entire plan, so the victim might not see the pump coming. Thus, the activity might overstate the ability to foresee and refuse.

  **Predictable Problem the First Time:**
  Participants might refuse to trade at the first offer because they suspect a trap, even before understanding the cycle. To mitigate, we must ensure they really have the intransitive preferences and that each trade is locally attractive. We can do this by having them publicly commit to the pairwise preferences before the trading starts.

  **Revised Plan for the Activity:**

  1. **Inducing the Cycle:**
     - Present the three goods with three attributes.
     - Explain the salient attribute for each pairwise comparison.
     - Have them vote or state their preference for each pair (using the salient attribute). This should give A>B, B>C, C>A.

  2. **Assign Initial Endowment:**
     - Each participant starts with good A and 10 chips.

  3. **Announce the Trading Rules:**
     - There will be a series of trade offers. Each offer will be to exchange the good you currently hold for another good, but you must pay 1 chip for the trade.
     - The offers will be in the following order:
          Offer 1: Trade A for C (cost: 1 chip)
          Offer 2: Trade C for B (cost: 1 chip)
          Offer 3: Trade B for A (cost: 1 chip)
     - They are free to accept or reject each offer.

  4. **Conduct the Trades:**
     - Make the offers in sequence. Participants who accept hand over the chip and make the trade.

  5. **Outcome:**
     - Most will end up with A and 7 chips.

  6. **Precommitment Variant:**
     - In a separate round (or with a different group), they are shown the three offers in advance.
     - They must write down a plan: for each offer, what they will do (accept or reject) if they get to that offer.
     - They start with A and 10 chips.
     - Then the offers are made, and they must follow their plan.
     - They will (if rational) plan to reject all, ending with A and 10 chips.

  7. **Debrief:**
     - Map the moments: 
          Offer 1: Sophisticated chooser refuses, knowing the path ahead leads to loss. Resolute chooser has committed to a plan (reject all). Naive chooser accepts.
     - Discuss: The loss occurred not because of myopia (since they knew the menu) but because at each step the trade was strictly preferred. So is the preference irrational or just expensive to maintain?
     - Highlight that in the real world, the exploiter might not reveal the whole sequence, so even sophisticated choosers might get pumped.

  **Exact Payoff and Offers:**

  - Goods: A, B, C with attributes as above.
  - Initial endowment: A and 10 chips.
  - Offers in order:
    1. "I will give you C in exchange for your A, plus you give me 1 chip."
    2. "I will give you B in exchange for your C, plus you give me 1 chip."
    3. "I will give you A in exchange for your B, plus you give me 1 chip."

  **Why that order?** It follows the cycle: from A to C, then C to B, then B to A.

  **Precommitment variant:** They decide in advance for each offer whether to accept or reject. They will reject all.

  **Debrief mapping:**
  - Sophisticated choice: At offer 1, they refuse because they foresee the entire cycle and the net loss.
  - Resolute choice: They commit to a plan at the beginning and stick to it (rejecting all).
  - Naive choice: They accept each offer as it comes.

  **Question to check if landed:** "If you could go back, what would you change? Would you have been willing to forgo the first trade even though at the time it seemed to strictly improve your position?"

  **What the activity can't reproduce:** In the real world, the money pump exploiter might not reveal the entire sequence of trades in advance. The activity assumes full transparency, which might not be the case in reality.

  **Predictable problem:** Participants might not internalize the intransitive preferences and might not find the trades attractive. To counter, we must ensure that they genuinely prefer C to A at the first trade, etc. We can do this by having them vote on each pairwise choice before the trading starts and display the results (majority should show the cycle). Also, they might be suspicious and refuse the first trade. If that happens, use it as a teaching moment: why did you refuse? Because you foresaw the pump? Then discuss sophistication.

  This should meet your requirements.
answer: |-
  Below is a complete activity design for your seminar, structured to induce genuine intransitive preferences and demonstrate the money pump problem. The setup uses chips (not real money), is fully transparent, and forces participants to confront the tension between locally rational trades and global irrationality. The goal is to show that losses arise from the structure of preferences, not myopia or stupidity, and to spark debate on whether such preferences are "irrational" or simply "expensive."

  ---

  ### **Activity Design: The Fruit Basket Money Pump**
  **Goods & Payoff Scheme:**  
  Use three "fruit baskets" (A, B, C) defined by two attributes: **Sweetness** (taste) and **Size** (visual appeal). Participants' payoffs are determined by a simple rule:  
  - **Utility = Sweetness × Size** (e.g., a basket with Sweetness 4 and Size 3 has utility 12).  

  Assign attributes to create an intransitive cycle when comparing pairs:  
  - **Basket A**: Sweetness 2, Size 6 → **Utility 12**  
  - **Basket B**: Sweetness 3, Size 4 → **Utility 12**  
  - **Basket C**: Sweetness 6, Size 2 → **Utility 12**  

  **Why this works:**  
  - When comparing **A vs. B**, participants focus on **Size** (A=6 > B=4) and prefer A.  
  - When comparing **B vs. C**, they focus on **Sweetness** (B=3 > C=2) and prefer B.  
  - When comparing **C vs. A**, they focus on **Sweetness** (C=6 > A=2) and prefer C.  
  Result: **A > B > C > A** (intransitive cycle). The equal utility (12) ensures no dominant option, forcing reliance on the salient attribute in pairwise choices.  

  ---

  ### **Sequential Money Pump Procedure**
  **Setup:**  
  - Each participant starts with **Basket A** and **10 chips** (1 chip = 1 util, so total starting utility = 12 + 10 = 22).  
  - Announce: "We’ll make sequential trade offers. You see all three offers now: [Display order]. Each trade costs 1 chip. Accept/reject freely."  
  - **Offers in order**:  
    1. **Trade A for C** (cost: 1 chip)  
    2. **Trade C for B** (cost: 1 chip)  
    3. **Trade B for A** (cost: 1 chip)  

  **Why this order?**  
  - Starts with the most salient improvement (Size → Sweetness: A to C feels like "upgrading" to better taste).  
  - Exploits the cycle: A→C (preferred), C→B (preferred), B→A (preferred), but nets a loss.  
  - Transparency ensures participants know the full menu, eliminating myopia excuses.  

  **Predicted participant behavior:**  
  - Step 1: Most trade A for C +1 chip (prefer C to A; utility now: C=12 + 9 chips = 21).  
  - Step 2: Most trade C for B +1 chip (prefer B to C; utility now: B=12 + 8 chips = 20).  
  - Step 3: Most trade B for A +1 chip (prefer A to B; utility now: A=12 + 7 chips = 19).  
  - **Final outcome**: Back to A, but with 3 fewer chips (utility 19 vs. 22).  

  **Key moment**: Participants see each trade as strictly improving (e.g., moving to a preferred basket) yet end up worse off. The loss emerges from preference structure, not naivety.  

  ---

  ### **Precommitment Variant**
  **Procedure:**  
  - Same goods/chips, but before any trades, participants **precommit to a full plan** for all three offers (accept/reject each in advance).  
  - They know the sequence but must decide everything upfront.  

  **What it shows (that sequential version can’t):**  
  - Participants will reject all trades (net utility remains 22).  
  - **Why?** They see the whole cycle: trading would cost 3 chips to return to A, a net loss.  
  - **Contrast with sequential choice**: Sequential trades exploit local improvements (each trade feels rational), while precommitment reveals global irrationality. This forces debate: *"If you refuse trades when precommitting, why accept them sequentially? Are preferences changing, or is it a failure of rationality?"*  

  ---

  ### **Debrief: Mapping Sophisticated vs. Resolute Choice**
  Use moments from the activity to illustrate:  
  - **Sophisticated choice**: Foresees future choices and avoids harmful paths.  
    - *Moment*: Rejecting Offer 1 to prevent the pump.  
    - *In-room example*: Participants who refuse the first trade after seeing the menu.  
  - **Resolute choice**: Sticks to a precommitment plan, ignoring local temptations.  
    - *Moment*: Precommitment variant, where participants bind themselves to reject all trades.  
    - *In-room example*: Participants who precommit and end with higher utility.  

  **Debrief question**: *"In sequential trading, was your loss due to not foreseeing the outcome (myopia), or did you foresee it but still act? If the latter, what does that say about your preferences?"*  

  ---

  ### **Question to Check if the Activity Landed**
  **Ask post-activity**:  
  > *"Suppose you could replay the sequential trades. Would you still make the first trade (A for C + 1 chip) if you knew it would lead to the same outcome? Why or why not?"*  

  **Why it works**: If participants say "no," they acknowledge the pump is unavoidable without precommitment. If they say "yes," they admit preferences are expensive to satisfy. Either way, it sparks debate on rationality.  

  ---

  ### **What the Activity Can’t Reproduce (Flag This Up Front)**
  **Limitation**: In real money pumps, the exploiter **hides future offers**, making it harder to refuse trades.  
  - *Why it’s missing*: This activity is transparent (offers are announced upfront), so participants can use sophistication to avoid the pump. In reality, exploiters reveal trades one-by-one, so even sophisticated choosers might accept early "good deals" without knowing the full cycle.  
  - **Flag early**: Start the session with: *"In this activity, you see all offers—unlike real life, where exploiters hide the sequence. We’re simplifying to isolate the preference problem."*  

  ---

  ### **Predictable Problem on First Run & Mitigation**
  **Problem**: Participants may refuse the first trade out of skepticism ("I see the trap!") without engaging with the cycle.  
  - **Why**: They anticipate the pump and avoid it via sophistication, short-circuiting the lesson.  
  - **Mitigation**:  
    1. **Force preference revelation**: Before trading, have participants publicly vote on pairwise choices (A vs. B, B vs. C, C vs. A) using attribute focuses. Display results to show the cycle is real.  
    2. **Emphasize incentives**: Remind them that each trade is genuinely improving locally (e.g., "If you prefer C to A, why not trade and gain utility now?").  
    3. **Use chips as motivators**: Award a bonus chip for participation to incentivize trading (e.g., "You keep leftover chips for a prize").  

  ---

  ### **Summary Flow for 90-Minute Session**
  1. **Intro (10 min)**: Explain goods, attributes, and utility. Vote to confirm cycle (A>B>C>A).  
  2. **Sequential Pump (25 min)**: Run trades. End with participants back at A with fewer chips.  
  3. **Precommitment Round (15 min)**: Repeat with precommitment. Contrast outcomes.  
  4. **Debrief (30 min)**:  
     - Map sophisticated/resolute moments.  
     - Discuss: *"Is the loss irrationality or just expensive preferences?"*  
     - Pose checkpoint question to gauge understanding.  
     - Flag the transparency limitation.  

  **Outcome**: Participants experience intransitivity as a structural flaw, not a behavioral error, and debate whether rationality requires consistent preferences or just careful planning.
