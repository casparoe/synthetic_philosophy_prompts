answer: |-
  Here's my take: I'd put my credence at about 0.65 that more than half of phenomenally conscious subjects on Earth are invertebrates at any given moment. That headline number emerges from combining several rough probabilities, each reflecting a layer of uncertainty in your question. 

  Starting with whether *any* invertebrates are conscious at all, I’d say 0.85. Cephalopod cognition and pain responses in crustaceans are compelling enough that outright denial feels like special pleading for vertebrates, though Dev’s skepticism isn’t baseless—it’s anchored in the real puzzle of how distributed systems generate unified experience. Next, *if* some invertebrates are conscious, the chance this includes hyper-abundant groups like insects or copepods (not just rare cephalopods) is around 0.75. This is the crux: evidence for associative learning, opioid responses, or trade-offs between injury and reward in fruit flies or ants suggests conserved mechanisms, but Dev’s octopus-wedge argument bites here—their neural weirdness *does* make them poor direct proxies for arthropods, so this isn’t 0.90.  

  The unit of counting is thorny. I’d give 0.60 to individual organisms being the right metric over subject-moments. While a mayfly’s life is brief, its moment-to-moment processing bandwidth might rival a mammal’s in density during critical behaviors; weighting by time feels arbitrary without a clear "clock speed" for consciousness. For marginal cases (e.g., "20% as conscious as a mouse"), I’m only 0.40 confident we should count them as full subjects rather than ignoring partial consciousness—this blurriness is inherent, but for practicality, I’ll assume we binarize. Finally, the chance this question has a theory-independent truth value is 0.80. While theories like IIT or GWT impose different thresholds, I suspect underlying biological facts constrain the possibilities enough that radical indeterminacy is unlikely.  

  Combining these: 0.85 (existence) × 0.75 (inclusion of abundant groups) × 0.60 (counting individuals) × 0.40 (handling partial cases) × 0.80 (theory-independence) ≈ 0.12. But this undersells invertebrate abundance! Quadrillions of nematodes and insects exist versus billions of vertebrates—even if only 0.1% of insects are conscious, they dominate. Factoring in biomass and numbers, I multiply by ~5 (a rough abundance multiplier), landing at ~0.65.  

  The most fragile term is the **inclusion of hyper-abundant groups** (0.75). Shifting this to 0.65 would drop my headline to 0.55; raising it to 0.85 would push it to 0.75. To move me ten points, I’d need evidence like: (1) *against inclusion*: demonstrating that insect "pain" behaviors vanish when central complex (not just nociceptive) circuits are silenced, showing they’re decoupled from integrated experience; (2) *for inclusion*: finding that bees or copepods trade off acute "suffering" against long-term fitness in ecologically valid scenarios (e.g., enduring aversive stimuli to access nest sites or mates), mimicking vertebrate motivational conflicts beyond reflexes.  

  Dev’s octopus argument is strong but overextended. Yes, their distributed cognition proves little about flies—but it *weakens* the necessity for vertebrate-style brains. More damning for his view would be homologous molecular pathways (e.g., conserved serotonin or dopamine systems modulating threat responses in both flies and mammals), suggesting deep functional parallels. Your disagreement likely centers on **the inclusion probability and priors about evidence**. Dev sees absence of proof for arthropod consciousness as proof of absence (weighting cephalopods as outliers), while you see conserved biology as licensing inference to abundance. His 0.05 implies near-zero confidence in inclusion; your 0.75 suggests high confidence. Bridging this requires targeting whether neural complexity thresholds are arbitrary—e.g., if we found a jump in computational integration at ~100k neurons that flies lack but crayfish possess, it’d clarify the wedge. Until then, my 0.65 splits the difference, leaning toward the teeming masses.
