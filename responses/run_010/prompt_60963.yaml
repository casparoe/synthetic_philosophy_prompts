prompt: |-
  Please answer as a philosopher who works at the intersection of aesthetics and epistemology, and think the matter through properly — including a short private brainstorm of candidate labels — before committing to one. I am not after a survey or a reading list; I want the carving.

  I am a novelist, and across two decades of blurbs, advance copies and book-club correspondence I keep meeting a pattern I have no name for. Two instances. First: the same novel went out to two reading groups, one behind a cover line praising its cool restraint, the other behind a cover line praising its fevered urgency. Each group afterwards cited the same pages as evidence of the quality it had been promised, and did so in the register of perception — you can feel how withheld the sentences become here — rather than in the register of trust in the blurb's author. Second: after a rave review of a contemporary whose work had always bored me, I returned to a passage I had skimmed for years and was genuinely moved; I still cannot tell whether the verdict let me see something in the prose or installed something in me that I then reported as seeing.

  So a verdict received in advance does not merely change what people say. It seems to change what they find themselves attending to, and to furnish them with particular, citable grounds they could not otherwise have produced. Is there an established concept for this? I suspect no exact one: it is not plain deference, since the subject claims and appears to have first-hand perception, and it is not obviously mere confabulation, since the enriched experience may be real. Tell me the nearest established notions and precisely how my description differs from each; where the edges lie (does the effect survive when the advance verdict concerns a non-evaluative feature, such as the presence of a twist, rather than a value?); and, if nothing fits, coin a term with a definition and boundary cases. Then say what turns on the naming — whether appreciation manufactured this way can count as knowing the work, and whether the distinction matters for how much weight criticism deserves. Throughout, separate what is settled from what is genuinely disputed among people who work on this, and do not present a contested position as the consensus.
reasoning: |-
  Okay, let's tackle this step by step. The user is a novelist who's observed a fascinating pattern: advance verdicts seem to reshape readers' actual perception of literary qualities, not just their opinions. The core puzzle is whether there's an established philosophical concept for this phenomenon. 

  First, I need to map the terrain. The key elements are: (a) prior framing alters perceptual attention (b) generates citable evidence (c) feels like genuine discovery (d) blurs the line between finding and implanting meaning. 

  Now, brainstorming candidate labels from aesthetics/epistemology:
  - "Cognitive Penetration" comes to mind - how beliefs influence perception. But it's too broad and usually involuntary.
  - "Theory-Laden Observation" from philosophy of science fits, but lacks the affective dimension.
  - "Aesthetic Suggestion" feels close but too weak.
  - "Perceptual Scaffolding" captures the structuring of attention.
  - "Affective Conformation" emphasizes the emotional feedback loop.
  - "Hermeneutic Induction" highlights interpretation becoming self-fulfilling.

  Considering boundary cases: Would this work with non-evaluative cues like "this has a twist"? Probably yes - that's a test case showing it's not just value judgments. 

  The critical distinction from existing concepts:
  - Not confirmation bias (which is defensive)
  - Not mere suggestibility (which lacks the phenomenology of discovery)
  - Not bullshit artistry (since the experience can be authentic)

  Settling on "Hermeneutic Induction" as the coined term because:
  1) "Hermeneutic" centers interpretation
  2) "Induction" implies the verdict jumpstarts a self-reinforcing cycle
  3) It accounts for both cognitive and affective dimensions

  Now the implications:
  - Epistemologically, it challenges what "knowing" a work means - is manufactured appreciation less valid? 
  - Aesthetically, it questions criticism's authority to shape rather than describe.
  - The real tension: phenomenologically real vs. causally artificial experiences.

  The user's deeper concern seems to be about criticism's power to colonize perception. Unspoken question: Can we trust any aesthetic judgment? 

  This needs careful handling - must distinguish between (a) the phenomenon's existence (fairly settled) and (b) its epistemic implications (hotly debated). Frankfurt School vs. reception theorists would clash here. 

  Final framing: The coinage matters because it exposes criticism as catalytic rather than just descriptive. The value turns on whether we prize organic discovery over expanded appreciation - an irreducibly normative choice.
answer: |-
  As a philosopher working at the intersection of aesthetics and epistemology, I recognize your phenomenon as a profound entanglement of perception, expectation, and epistemic justification. Let me carve this at the joints.

  ### Candidate Labels (Private Brainstorm)
  1. **Apperceptive Conformation**  
  2. **Hermeneutic Induction**  
  3. **Affective Scaffolding**  
  4. **Perceptual Catalysis**  
  5. **Evaluative Anchoring**  
  6. **Phenomenal Confirmation**  
  7. **Aesthetic Priming**  

  ### Established Concepts & How Your Case Differs
  1. **Confirmation Bias** (Cognitive Science)  
     - *Difference*: Confirmation bias filters existing evidence; your readers *generate new phenomenal evidence*. They don’t ignore counter-evidence but experience textures (e.g., "withheld sentences") as *discoveries*.

  2. **Cognitive Penetration** (Epistemology)  
     - *Difference*: While prior beliefs influence perception (e.g., seeing a hue as "red" when labeled), your case involves *evaluative judgments* (restraint/urgency) creating *affective-textural properties* that feel objectively present. It’s value-laden perception.

  3. **Reception Theory** (Jauss/Iser)  
     - *Difference*: Focuses on how horizons of expectation shape interpretation. But your readers report *sensory immediacy* ("you can feel")—not just meaning-making but *phenomenal disclosure*.

  4. **Suggestibility** (Psychology)  
     - *Difference*: Suggestibility implies passive adoption. Here, readers actively *cite evidence* from the work, constructing justification that feels earned. The prose’s features become "revealed," not implanted.

  ### The Core Phenomenon: **Hermeneutic Induction**  
  **Definition**: *The process whereby an advance evaluative verdict (a) reconfigures perceptual attention toward valence-congruent features, (b) generates first-person reports of phenomenally vivid "discoveries," and (c) supplies citable grounds that retroactively justify the verdict, creating a self-reinforcing epistemic loop.*  

  **Boundary Cases**:  
  - **Non-Evaluative Prompt** (e.g., "This has a twist"):  
    The effect *weakens*. Attention may shift to plot mechanics, but without evaluative charge, the "aha!" moment lacks phenomenal depth. The loop remains cognitive, not affective.  
  - **Contradictory Evidence** (e.g., praising "restraint" in overtly emotional prose):  
    The induction *fails*. Readers report dissonance ("I see what they meant, but it doesn’t fit"), proving the effect requires plausible affordances in the object.  

  ### What Turns on the Naming  
  #### Epistemological Stakes: Can this count as "knowing" the work?  
  - **Settled**: Hermeneutic induction *enables aesthetic properties to emerge*. As Walton argues, categories (like "restrained prose") partly *constitute* perceived properties. If the induction activates a valid category, the appreciation is real.  
  - **Disputed**: Whether the *source* of the category (external verdict vs. organic engagement) invalidates the knowledge.  
    - *Consensus*: Phenomenal discovery isn’t "confabulation" if the features are objectively present (e.g., sparse syntax exists independently).  
    - *Contested*: Neo-Kantians (e.g., Ginsborg) argue that criticism must *train perception* to count as knowledge; external verdicts bypass this. Pragmatists (e.g., Shusterman) claim any pathway to enriched experience is valid.  

  #### Aesthetic Stakes: Criticism’s Authority  
  - **Settled**: Criticism *can* expand appreciation by directing attention. This is non-controversial.  
  - **Disputed**: Whether hermeneutic induction *corrupts autonomy*.  
    - *Adorno*: Manufactured appreciation is "administered experience"—criticism as cultural capital.  
    - *Rancière*: All perception is "distributed"; the divide between "pure" and "induced" engagement is illusory.  

  ### Why "Hermeneutic Induction" Fits  
  - **Hermeneutic**: It concerns interpretation’s role in *disclosing* textual affordances.  
  - **Induction**: The verdict "jump-starts" a self-validating cycle where perception confirms expectation, which deepens perception.  

  ### Conclusion  
  Your phenomenon exposes aesthetics’ dirty secret: *Evaluation often precedes perception*. Naming it **hermeneutic induction** matters because it forces us to confront criticism’s power not merely to describe but to *conjure* aesthetic evidence. Whether this manufactured appreciation counts as "knowledge" depends on whether we view art’s value as *discovered* (requiring uncoerced perception) or *co-created* (where criticism is collaborative meaning-making). The distinction isn’t settled—it cuts to whether autonomy is central to aesthetic truth. For your novelist’s concern: This mechanism explains why criticism can feel like revelation or trespass, but rarely indifference. Its weight depends on whether we prize the *purity* of encounter or the *fertility* of engagement.
