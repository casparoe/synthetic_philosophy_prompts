answer: |-
  ### Standard of Adequacy for Resolving the Two-Envelope Problem  
  A resolution must equip a competent reader to handle any concrete instance (with a specified filling procedure) by:  
  - **Determining what the agent should do** (positive normative account).  
  - **Identifying the precise step in the tempting argument that fails or rests on a false premise** (diagnostic account).  
  - **Explaining why that step remains compelling** (explanation of the illusion).  

  The requirements below are separated into **positive** (what the agent ought to do) and **diagnostic** (why the argument fails) categories. Each requirement includes:  
  - **The requirement**.  
  - **Motivating case or consideration** (explained, not labeled).  
  - **Status** (binding or contested). Contested requirements encode substantive methodological commitments and are flagged as such.  

  ---

  #### **I. Positive Normative Account Requirements**  

  1. **Requirement P1: Decision Rule Specification**  
     - **Requirement**: The resolution must provide a decision rule specifying, for any filling procedure and any observed amount (if applicable), whether the agent should switch, not switch, or be indifferent.  
     - **Motivation**: In the asymmetric case (Instance 5), switching is favorable due to known probabilities. In the symmetric case (Instance 1), indifference is required. Without a clear rule, the agent cannot act in novel instances (e.g., if the filling procedure is specified as a complex distribution).  
     - **Status**: Binding.  

  2. **Requirement P2: Compatibility with Expected-Value Calculus**  
     - **Requirement**: The resolution must either:  
       (a) Preserve the standard expected-value calculus for well-defined expectations, or  
       (b) Provide a justified alternative that avoids contradictions and handles infinite expectations.  
     - **Motivation**: In the dyadic ladder with \(p < 1/2\) (Instance 3), the standard calculus correctly yields zero unconditional expected gain from switching. In the asymmetric case (Instance 5), it correctly identifies a positive expected gain. Ruling out distributions with infinite expectations (e.g., Instance 4) by fiat ignores valid mathematical cases.  
     - **Status**: Contested. Some argue (a) is mandatory; others accept (b) for cases with undefined expectations.  

  3. **Requirement P3: Symmetry Preservation**  
     - **Requirement**: In symmetric filling procedures (where the envelopes are indistinguishable ex ante), the resolution must yield indifference to switching.  
     - **Motivation**: In the sealed symmetric case (Instance 1), any deviation from indifference violates probabilistic symmetry (e.g., swapping back should not be preferable). A resolution that permits switching in symmetric cases fails a basic coherence test.  
     - **Status**: Binding.  

  ---

  #### **II. Diagnostic Account Requirements**  

  4. **Requirement D1: Step Identification**  
     - **Requirement**: The resolution must identify the exact step in the switching argument that is invalid or relies on a false premise, and state why.  
     - **Motivation**: In the symmetric case (Instance 1), the argument concludes switching is beneficial, yet swapping back would reapply the same logic. Simply asserting "symmetry" (without pinpointing the flaw, e.g., in the conditional probability step) fails to resolve the paradox.  
     - **Status**: Binding.  

  5. **Requirement D2: No Arbitrary Exclusion of Distributions**  
     - **Requirement**: The resolution must not exclude distributions (e.g., those without finite expectation or improper priors) without a principled justification. If excluded, it must explain how the paradox arises in admissible cases.  
     - **Motivation**: The dyadic ladder with \(p > 1/2\) (Instance 4) has infinite expectation but is mathematically coherent; excluding it ignores a genuine instance of the paradox. A resolution must handle heavy-tailed or improper distributions or justify why they are inadmissible (e.g., because they preclude defined decisions).  
     - **Status**: Contested. Some camps stipulate finite expectations; others reject this as evasion.  

  6. **Requirement D3: Explanation of the Illusion**  
     - **Requirement**: The resolution must explain why the fallacious step appears compelling, even after its invalidity is exposed.  
     - **Motivation**: The switching argument remains intuitively seductive in symmetric cases (Instance 1) and conditional variants (Instance 3). A resolution that only blocks the argument (e.g., "the calculation is wrong") without explaining the psychological or mathematical lure (e.g., implicit priors) fails to fully equip the reader.  
     - **Status**: Contested. Some view this as optional; the purpose statement makes it mandatory here.  

  7. **Requirement D4: Generalization to Structurally Similar Puzzles**  
     - **Requirement**: The resolution must apply to variants of the puzzle (e.g., asymmetric filling, different ratios, or related paradoxes like the exchange paradox).  
     - **Motivation**: The asymmetric case (Instance 5) requires the same argument form to be valid, while it fails in symmetric cases. A resolution that only works for one variant (e.g., symmetric filling) cannot distinguish Instance 1 from Instance 5.  
     - **Status**: Contested. Some argue each variant is distinct; others demand a unified solution.  

  ---

  ### **Testing Requirements Against Instances**  
  For each instance, the requirements it generates and the verdict:  

  1. **Sealed symmetric case (Instance 1)**:  
     - **Requirements**: P1 (indifference), P3 (symmetry), D1 (step identification), D3 (illusion explanation).  
     - **Verdict**: Correct. A resolution asserting only "symmetry" fails D1 and D3.  

  2. **Bounded support (Instance 2)**:  
     - **Requirements**: P1 (decision rule conditional on observation), P2 (standard calculus applies).  
     - **Verdict**: Correct. Seeing an amount > half the maximum implies not switching.  

  3. **Dyadic ladder with \(p < 1/2\) (Instance 3)**:  
     - **Requirements**: P2 (standard calculus with finite expectation), D1 (fallacious step: assuming equal conditional probabilities), D3 (illusion: why equal probabilities seem plausible).  
     - **Verdict**: Correct. Step failure: conditional probabilities are unequal given the geometric prior.  

  4. **Dyadic ladder with \(p > 1/2\) (Instance 4)**:  
     - **Requirements**: P2 (handling infinite expectations), D2 (no arbitrary exclusion).  
     - **Verdict**: Correct. Unconditional expectation undefined, but conditional switching is favorable. Excluding this case violates D2.  

  5. **Asymmetric filling (Instance 5)**:  
     - **Requirements**: P1 (switch), D1 (why the same calculation is valid here), D4 (generalization to asymmetric cases).  
     - **Verdict**: Correct. Resolution must distinguish this from symmetric cases via structural features (e.g., known ex ante probabilities).  

  ---

  ### **Tension Between Requirements**  
  The requirements **are jointly satisfiable**, but apparent tensions exist. Specifically:  
  - **Tension**: P2 (use standard calculus) and D2 (no arbitrary exclusion of distributions) seem to conflict when expectations are infinite (Instance 4).  
  - **Why it is misleading**: The tension arises from misinterpreting P2. P2 does not require unconditional expectations to be finite; it requires the calculus to be applied correctly, which may involve:  
    - Using **conditional expectations** when unconditional ones are undefined (e.g., Instance 4).  
    - Acknowledging that no decision rule exists only if expectations are truly pathological (e.g., not definable even conditionally).  
  - **Resolution**:  
    - **Weaken P2** to: *"The resolution must use the standard expected-value calculus correctly, which may require conditioning on observed amounts when unconditional expectations are undefined."*  
    - **Retain D2** intact: Distributions without finite expectations are admissible if they permit conditional decisions.  
  - **Cost**: Weakens the expectation that unobserved swapping decisions are always well-defined, but aligns with standard probability theory (e.g., in finance or decision theory, conditioning resolves infinities).  

  The appearance of conflict in Instances 3 and 5 arises from conflating:  
  - **Instance 3** (symmetric, finite mean): Requires indifference unconditionally, but conditional dependence.  
  - **Instance 5** (asymmetric): Requires switching.  
  This is resolved by D4 (generalization): A good resolution handles both via structural features (e.g., exchangeability in symmetric cases).  

  ---

  ### **Which Requirement Eliminates the Most Resolutions?**  
  **Requirement D3 (explanation of the illusion)** eliminates the most proposed resolutions.  
  - **Why**: Most resolutions focus on blocking the argument (e.g., "the prior matters" or "symmetry implies indifference") but fail to explain why the flawed step feels intuitive. For example:  
    - Bayesian resolutions often identify the fallacious step (D1) but omit why agents assume uniform conditional priors (D3).  
    - "Symmetry" resolutions assert indifference (P3) but do not explain the lure of switching (D3).  
  - **Comparison**: D2 (no arbitrary exclusions) also eliminates resolutions that ban heavy-tailed distributions, but D3 is more frequently neglected in informal solutions.  

  ---

  ### **Leading Families of Resolutions Scored Against Requirements**  
  | **Family**               | **P1** | **P2** | **P3** | **D1** | **D2** | **D3** | **D4** | **Verdict** |  
  |---------------------------|--------|--------|--------|--------|--------|--------|--------|-------------|  
  | **Bayesian (proper prior)** | Pass   | Pass   | Pass*  | Pass   | Pass   | Fail   | Pass   | Fails D3: No explanation of why uniform priors feel intuitive. P3*: May fail conditional symmetry if prior is asymmetric. |  
  | **Symmetry/Exchangeability** | Pass   | Pass   | Pass   | Fail   | Pass   | Fail   | Fail   | Fails D1/D3/D4: Asserts indifference without identifying step; doesn't generalize to asymmetric cases. |  
  | **Conditional Expectation** | Pass   | Pass   | Pass*  | Pass   | Pass   | Fail   | Pass   | Fails D3: Identifies flawed step (e.g., equal probabilities) but doesn't explain illusion. P3*: May not ensure conditional indifference. |  
  | **Variant Ratio (e.g., 1:3)** | Fail   | Pass   | Pass   | Pass   | Pass   | Fail   | Fail   | Fails P1/D4: Adjusts the ratio but doesn't solve the original 1:2 paradox or generalize. |  

  **Key**:  
  - **Pass**: Satisfies requirement.  
  - **Fail**: Does not satisfy.  
  - **Pass***: Satisfies only under specific conditions (e.g., symmetric prior).  

  **Summary**: No family satisfies all requirements perfectly. The Bayesian family comes closest but typically fails D3. All families struggle with D3 (illusion explanation) and often P3 (conditional symmetry).  

  ---  
  This specification ensures a resolution is adequate if it meets all binding requirements and addresses contested ones transparently, enabling a reader to resolve any instance.
