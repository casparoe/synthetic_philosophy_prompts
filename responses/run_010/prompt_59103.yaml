  We are to lay out a set of requirements that a proposed resolution of the two-envelope problem must meet to be adequate. The purpose is to equip a competent reader to handle a concrete instance by:

  a) Determining what the agent should do.
  b) Identifying precisely which step of the tempting argument fails or rests on a false premise.
  c) Explaining why that step continues to look compelling.

  We also note that the resolution must work for a specified or specifiable procedure for filling the envelopes.

  We break down the requirements into two main parts: those concerning the positive normative account (what the agent should do) and those concerning the diagnosis of the fallacious argument. We also note that some requirements might be contested and we will flag them as such.

  Moreover, we must test the requirements against the provided instances and then address the question of whether the requirements are jointly satisfiable.

  ### Requirements

  We list each requirement, the motivating case, and its status (binding or contested). We separate the requirements for the positive account and the diagnostic account.

  #### I. Positive Normative Account

  1. **Requirement P1 (Correct Decision Rule):** The resolution must specify, for any given filling procedure, whether the agent should switch, not switch, or be indifferent (or if the decision depends on the observed amount, what the agent should do for each possible observation). 

     *Motivation:* In the asymmetric case (instance 5), switching is favorable. In the symmetric case (instance 1), the agent should be indifferent. In the bounded support case (instance 2), if the agent sees an amount above half the maximum possible, then switching is not favorable. The resolution must be able to guide the agent appropriately in each scenario.

     *Status:* Binding. Any resolution must tell the agent what to do.

  2. **Requirement P2 (Consistency with Expected Utility):** The resolution must either use the standard expected utility calculus (with appropriate probability measures) or provide a well-justified alternative that does not lead to contradictions or infinite expectations when they are avoidable.

     *Motivation:* In the dyadic ladder with p<1/2 (instance 3), the unconditional expected gain from switching is zero, and the standard expected utility calculus works. In the asymmetric case (instance 5), the standard calculation also works. However, when p>1/2 (instance 4), the unconditional expected gain is undefined (because the expectation of the amount in the envelope is infinite). The resolution must handle both finite and infinite expectation cases appropriately.

     *Status:* Contested. Some argue that the standard calculus must be preserved and that the problem arises only when we misuse it. Others might argue for a modification (e.g., using conditional expectations with care). But note: we cannot simply rule out distributions without finite mean (see D2 below).

  3. **Requirement P3 (Handling of Symmetry):** In symmetric cases (like instance 1), the resolution must yield the conclusion that switching is neither beneficial nor detrimental.

     *Motivation:* The sealed symmetric case (instance 1) is a paradigmatic example. The resolution must not break the symmetry arbitrarily.

     *Status:* Binding.

  #### II. Diagnostic Account (Identifying the Fallacy)

  4. **Requirement D1 (Identify the Fallacious Step):** The resolution must pinpoint the exact step in the switching argument that is invalid or rests on a false premise, and explain why it is invalid or false.

     *Motivation:* In the symmetric case (instance 1), the argument for switching is fallacious. The resolution must not just say "the situation is symmetric" but must explain which step of the argument is wrong. For example, the step that assumes that given an observed amount x, the other envelope is equally likely to contain 2x or x/2 might be false if the distribution of the smaller amount is improper or if the prior does not support that.

