  We are constructing a set of desiderata for a governance-by-prediction-market system in a small county context. The key concerns are: counterfactual unobservability, resolution variable computation by a potentially biased office, wealth-weighted voting, long time horizons, reflexivity, joint coherence across markets, and thin/manipulated markets.

  We'll structure the desiderata as follows:

  1. **Non-negotiable**: Must-haves for the system to be viable in the given context (small jurisdiction, low liquidity, high visibility, long-term effects).
  2. **Negotiable**: Important but could be addressed with compromises or alternative designs.
  3. **Camp-specific**: Views held by particular schools of thought (e.g., mechanism designers, calibrationists, welfare economists, legitimacy theorists) that are not universally accepted.

  We'll address each of the user's points and any additional ones that arise.

  Let's list the desiderata:

  D1: **Counterfactual Legitimacy** - The market must produce a valid conditional forecast even when the counterfactual outcome is never observed.  
  Motivating case: The road not taken (e.g., one of the road repair strategies) is never implemented, so we never observe the well-being index under that policy.  
  Status: Non-negotiable? But note: the conditional market design (called-off bets) doesn't require observing the counterfactual. However, the validity of the forecast is still at issue because there's no way to verify it. This is a core challenge. We'll mark as non-negotiable because if the market can't do this, the system fails.

  D2: **Resolution Independence** - The resolution variable (the well-being index) must be computed independently and without bias.  
  Motivating case: The county budget office, which has a stake in the decisions, computes the index. This creates a conflict of interest.  
  Status: Non-negotiable. Without independence, the market is subject to manipulation by the entity that defines the outcome.

  D3: **Belief Aggregation Without Wealth Distortion** - The market should aggregate beliefs without being unduly influenced by wealth disparities.  
  Motivating case: A local landowners' association plans to bet $250,000 against one development irrespective of their true belief, which could distort the price.  
  Status: Non-negotiable? But note: prediction markets naturally weight by wealth and risk tolerance. However, in governance, we might require that the market reflects the "wisdom of the crowd" and not just the wealth of a few. This is a tension. We'll mark as non-negotiable because if a group can manipulate the price by spending a lot, it undermines the epistemic purpose.

  D4: **Long Horizon Compatibility** - The market must be able to forecast outcomes that unfold over time horizons longer than typical trader holding periods.  
  Motivating case: A road repair strategy implies a 25-year sewer extension. Traders might not be willing to hold positions for that long.  
  Status: Non-negotiable? The effects of the policy are long-term, so if the market cannot handle that, it fails. However, we might design around it (e.g., using shorter-term proxies). We'll mark as non-negotiable.

  D5: **Reflexivity Handling** - The market must account for the possibility that the published price changes the outcome it forecasts.  
  Motivating case: The market price favoring a development might lead to secondary effects (e.g., speculators buying land) that alter the well-being outcome.  
  Status: Non-negotiable? Reflexivity can break the causal chain. We need a theory of how the market remains informative. But note: this is a general problem in forecasting. We'll mark as negotiable because it might be addressed by careful design (e.g., secrecy until decision, but that conflicts with transparency). Alternatively, the market might be designed to forecast under the assumption that the price is not public? But that's unrealistic.

  D6: **Joint Coherence** - The market must produce jointly coherent conditional forecasts when multiple correlated policies are being decided simultaneously.  
  Motivating case: The two mixed-use developments are mutually exclusive and their conditional forecasts must be consistent (e.g., the probability of the well-being index given A and not B must be consistent with the conditionals for A and for B).  
  Status: Non-negotiable? Without coherence, the decisions might be inconsistent. But note: in practice, we might run separate markets and accept some inconsistency. We'll mark as negotiable because it might be addressed by combinatorial markets or other mechanisms, but that's complex.

  D7: **Robustness to Thin Markets and Manipulation** - The system must have a fallback when the market is thin or being manipulated, and the fallback must not be easily gamed.  
  Motivating case: With only $40,000 of open interest, the market is susceptible to manipulation. What happens then?  
  Status: Non-negotiable. Without robustness, the system is fragile.

  D8: **Democratic Legitimacy** - The system must be perceived as legitimate by the public and comply with democratic principles.  
  Motivating case: The board is elected, but the market is not. The foundation of legitimacy is a concern raised by one member.  
  Status: Camp-specific? This might be non-negotiable in a democratic society. We'll mark as non-negotiable because without legitimacy, the system might be rejected.

  D9: **Calibration and Accuracy** - The market must produce well-calibrated forecasts (i.e., when it assigns a probability of X%, the event should occur about X% of the time).  
  Motivating case: Without accuracy, the system fails at its core purpose of making good decisions.  
  Status: Camp-specific (calibrationists). But note: we might consider it non-negotiable. However, in the conditional setting, we cannot observe the counterfactual, so we cannot verify calibration. This is a problem. We'll mark as camp-specific (calibrationists) because without counterfactual observability, we cannot demand calibration.

  D10: **Liquidity Sufficiency** - The market must have sufficient liquidity to be informative.  
  Motivating case: $40,000 in a small county is too thin to be reliable.  
  Status: Non-negotiable? But note: liquidity is a practical issue. We'll mark as non-negotiable because low liquidity undermines the entire mechanism.

  Now, additional desiderata:

  D11: **Transparency** - The market operations and resolution process must be transparent to the public.  
  Motivating case: High public visibility requires that the process is understandable and open to scrutiny.  
  Status: Non-negotiable? But note: transparency might conflict with preventing reflexivity. We'll mark as non-negotiable for legitimacy.

  D12: **Cost Efficiency** - The system must not incur excessive costs relative to the decisions at stake.  
  Motivating case: Running prediction markets, especially combinatorial ones, might be expensive.  
  Status: Negotiable.

  Now, we assign conflicts:

  - D1 (Counterfactual Legitimacy) conflicts with D9 (Calibration) because we cannot calibrate the counterfactual forecast without observing the counterfactual.
  - D2 (Resolution Independence) conflicts with practicality because the county might not have an independent body to compute the index.
  - D3 (Belief Aggregation Without Wealth Distortion) conflicts with the natural operation of prediction markets (which weight by wealth). Also, it might conflict with D10 (Liquidity) because the landowners' money adds liquidity but distorts.
  - D4 (Long Horizon Compatibility) conflicts with D10 (Liquidity) because long horizons might deter traders, leading to thin markets.
  - D5 (Reflexivity Handling) might conflict with D11 (Transparency) because if prices are public, they might influence behavior.
  - D6 (Joint Coherence) might conflict with D12 (Cost Efficiency) because combinatorial markets are more expensive.
  - D7 (Robustness) might conflict with D8 (Legitimacy) if the fallback is seen as arbitrary.
  - D10 (Liquidity) conflicts with D3 (Wealth Distortion) because attracting liquidity might require allowing large bets, which can distort.

  Largest unsatisfiable subset: We'll argue that D1, D9, and D3 cannot be jointly satisfied. D1 and D9 because we cannot calibrate without counterfactual observation. D3 is in tension because the market requires liquidity (D10) which might come from wealthy actors, but then we get distortion.

  Most exclusionary requirement: Likely D1 (Counterfactual Legitimacy) because it is fundamental and unsolvable in the conditional setting without observation.

  Now, three approaches:

  1. Pure Futarchy: The market decides. It must satisfy all non-negotiable desiderata. It fails on D1 (counterfactual), D3 (wealth distortion), D4 (long horizons), D10 (liquidity), and D8 (legitimacy).

  2. Hybrid: Market input with override. This can mitigate some issues (e.g., if the market is thin, the board can override). It might satisfy D7 (robustness) and D8 (legitimacy) better. But it doesn't solve D1, D2, D3, D4.

  3. Deflationary: Markets only for forecasting. Then the board uses the forecast as input. This avoids the counterfactual problem (because the board still decides) and legitimacy issues. It can also handle long horizons by not binding the decision to the market. But it doesn't use the market to make the decision.

  Let's build the table:

