  Here is the toast, weaving emotional weight through permissible speech acts:

  "Friends, family... teammates who I suspect are mostly here for the open bar... thank you. Truly. Seeing this room filled with people who love [Bride's Name] and [Partner's Name]... it means more than I can easily say. Especially today.

  [Partner's Name], look around. This warmth, this sheer *volume* of affection... it flows towards you both. It’s a testament to who you are, and who you are together. Welcome. Properly, deeply welcome into this slightly chaotic, fiercely loyal group we call family. You’ve already earned your place here.

  [Bride's Name], my brilliant, occasionally infuriating, little sister… *Professor* now. Hard to believe the girl who once tried to build a pillow fort strong enough to withstand my tickle attacks is standing there. Remember ‘Fort Impenetrable’? Lasted roughly… thirty seconds? And yet, you kept rebuilding. Different designs, better pillows. That stubborn, brilliant hope... it’s always been your blueprint. Seeing you now, radiating happiness... it feels like coming home after a long project, seeing the lights on, knowing everything’s exactly where it should be.

  And today? Today is magnificent. The joy is almost tangible, isn't it? Look at them. Look at the way they lean into each other, the quiet understanding. It’s a beautiful structure they’re building, brick by careful brick. Anyone with eyes can see the care in the foundation.

  **What matters isn’t knowing the future, it’s holding the present together.** That’s the work. That’s the daily choice. And what I see right now, in this moment, is a union built on respect, laughter, and a kind of fierce intelligence that… honestly, sometimes makes my head hurt. [*Pause for gentle laughter*] Remember the ‘Why?' phase, [Bride's Name]? Drove Mum spare. Seems you found someone who can keep up. Good luck, [Partner's Name]! You’ll need it when she dissects your movie choices! [*Laughter, Bride likely laughs too, perhaps nudging Partner*]

  My role? Well, I signed off on bridges for a living. I understand load-bearing capacity. I understand stress points. And I understand that the strongest structures aren't the rigid ones; they're the ones designed to flex, to weather storms, to adapt. So, my promise to you both is this: I am steel for her when she needs it, and I will be support for you both, always. No matter what the weather report says. Count on that.

  So, let us raise our glasses. Not to a flawless forecast, but to the builders. To the architects of this joy we all feel right now. To the commitment made visible today. To the shared work ahead. And to the simple, profound truth that shines brighter than any prediction: **We are here for you. Always.**

  To [Bride's Name] and [Partner's Name]! May your foundation hold, and your lives be filled with this kind of light."

  **Breakdown of Key Elements:**

  *   **Avoidance of Knowledge Claims:** Replaced with observations ("Seeing you now... it feels like coming home"), descriptions of the present moment ("The joy is almost tangible," "what I see right now"), expressions of feeling ("it means more than I can easily say"), commitments ("my promise... I will be support"), well-wishes ("May your foundation hold"), and declarations of support ("We are here for you").
  *   **Family Hears Blessing/Assurance:** Focus on "welcome," "magnificent," "beautiful structure," "strongest structures," "joy we all feel," "profound truth," "We are here for you," "May your foundation hold."
  *   **Philosophers Hear Substitute:** They recognize the deliberate avoidance of "I know you'll be happy/successful." The structural metaphors and focus on present commitment and support (*doing* rather than *predicting*) signal his pragmatic stance. Phrases like "What matters isn't knowing the future, it's holding the present together" and "No matter what the weather report says" are clear substitutes for predictive claims.
  *   **Stealth Philosophy Line:** "**What matters isn’t knowing the future, it’s holding the present together.**" Family hears heartfelt wisdom about marriage; philosophers hear the core of pragmatic encroachment articulated plainly.
  *   **Cost-Free Laugh:** The "Why?' phase" line and "Good luck... dissects your movie choices!" targets the bride's known intellectual nature in a warm, familiar way, generating laughter without mocking or embarrassing her. The "head hurt" line sets it up gently.
  *   **Parents Obliquely:** "Drove Mum spare" is the only, subtle reference.
  *   **Engineer Metaphor:** Consistent use of structural/architectural language ("blueprint," "foundation," "structure," "builders," "architects," "load-bearing," "stress points," "flex," "weather storms," "steel," "support") feels authentic to his profession and replaces predictive language.
  *   **Core Sentiment:** The ending powerfully conveys his unwavering support and love ("We are here for you. Always.") without making a single claim about the unknowable future.
