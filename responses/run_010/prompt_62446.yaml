prompt: |-
  I'm a third-year philosophy PhD student working on mental content. Half my week is spent in a computational lab, which is where the case below came from, and I've got a seminar paper due that I'm hoping to turn into a dissertation chapter. I want an essay I can argue with.

  The controversy: does teleosemantics commit you to saying that a reinforcement-learning agent has genuine, underived content? And if it does, is that a vindication of the view or a reductio of it?

  Here's the case. Call it Pelletbot. Small feedforward network with a recurrent layer, trained by gradient descent on a simple foraging environment for something like a billion episodes. It ends up with an internal unit that fires reliably when a pellet is on screen and in reach, and downstream policy states that use that unit to navigate. After training the weights are frozen and the thing is deployed. No biology, no lineage, no ancestors, nothing wet. Three features of the case are what I care about:

  (1) There was obviously a variation-and-differential-retention process during training. So the etiological story about where proper functions come from looks like it has all its ingredients on the table.

  (2) But nothing got reproduced in the sense the historical account wants. There's no lineage of tokenings being copied forward; there's one set of weights being continuously nudged. Whether a trait that survives only because modifying it would have lowered reward counts as a character that's been reproduced across a lineage — that feels like the whole ballgame to me.

  (3) The selection pressure was supplied by us, toward our ends, through a reward function. So even if Pelletbot's states have functions, it's tempting to say they're our functions, and any content that comes with them is derived. Same shape of worry as the homunculus objection and the Chinese Room.

  What I need, roughly 2000-2500 words:

  - Say what teleosemantics is actually committed to about function, and pull apart the producer-oriented and consumer-oriented versions, because I think (2) and (3) land very differently depending on which one you're running. On the consumer version there is a consumer inside Pelletbot — the policy — so a bunch of the standard complaints about there being nobody downstream to use the representation just don't fire.
  - Decide whether (2) and (3) are two objections or one. My hunch is that people run them together and only one of them is doing anything: (2) is a verbal dispute about how literally to read the copying requirement, while (3) is the real threat. I could easy be wrong and part of why I want this essay is to find out.
  - Bring in swampman as a contrast case: a randomly initialised network that happens to end up functionally isomorphic to trained Pelletbot. Any historical account should say the random one lacks content and the trained one has it. If your position can't buy that contrast cheaply, say so out loud rather than quietly dropping the case.
  - Then commit. I don't want a tour of the options that ends with more work needed. Give me a verdict — either agents like Pelletbot have underived content, or teleosemantics has a principled reason to deny it, or the case actually shows something wrong with teleosemantics itself, in which case say that and say what. Tell me which single consideration is carrying most of the weight.
  - Steelman whichever side you reject as hard as you can before you beat it, and name the one argument or piece of evidence most likely to flip your verdict.

  No citations, no bibliography, no titles or dates — I know the literature and I'll wire in the references myself, I'd rather you spent those words on argument. Paraphrase the positions in your own terms. And be definite about it: if you think my hunch on (2) versus (3) is wrong, tell me straight and argue it. I'm not after agreement, I'm after a position defended well enough that I can push on it in seminar.
