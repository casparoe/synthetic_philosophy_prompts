  ### Diagnostic Sorting Instrument  
  **Instructions:** For each scenario, choose the option that best reflects your immediate reaction. Assume independent verification is impossible at the moment. Answer based on instinct—no overthinking!  

  ---

  #### Pair 1: Finding Directions  
  **Item 1 (Human):**  
  You’re lost in an unfamiliar city. A stranger confidently says, "The museum is three blocks left." Your phone is dead; no maps or others are nearby. You’re late for a meeting. Do you:  
  A) Walk left, trusting their directions.  
  B) Ignore them and search alone.  

  **Item 2 (Machine):**  
  Same situation, but directions come from an official city kiosk screen: "Museum: three blocks left." Phone dead, no alternatives. Do you:  
  A) Walk left, trusting the kiosk.  
  B) Ignore it and search alone.  

  ---

  #### Pair 2: Historical Claim  
  **Item 3 (Human):**  
  You find a memoir by a deceased witness claiming "Event X occurred on March 5." No other records exist; it’s plausible but unverifiable. Do you:  
  A) Cite it in your research as fact.  
  B) Omit it, due to lack of corroboration.  

  **Item 4 (Machine):**  
  An AI scans archives (now lost) and outputs: "Event X: March 5." Same plausibility, no verification. Do you:  
  A) Cite the AI’s output as fact.  
  B) Omit it, due to lack of corroboration.  

  ---

  #### Pair 3: Medical Reassurance  
  **Item 5 (Human):**  
  A nurse friend says, "Your rash is harmless; I’ve seen this often." They’re sincere, but you don’t know their expertise. No doctor access. Do you:  
  A) Feel reassured, dismissing worries.  
  B) Stay concerned until a doctor confirms.  

  **Item 6 (Machine):**  
  A medical app (unvetted) states: "Rash: harmless common condition." Looks professional; no verification. Do you:  
  A) Feel reassured, dismissing worries.  
  B) Stay concerned until a doctor confirms.  

  ---

  #### Pair 4: Financial Advice  
  **Item 7 (Human):**  
  Your bank advisor (earns commission) urges, "Invest in Stock Y now!" They seem honest, but bias is possible. Deadline looms. Do you:  
  A) Invest, taking their word.  
  B) Skip, avoiding risk.  

  **Item 8 (Machine):**  
  The bank’s algorithm recommends "Stock Y: strong buy." The bank profits if you invest; no bias details. Same deadline. Do you:  
  A) Invest, trusting the algorithm.  
  B) Skip, avoiding risk.  

  ---

  #### Pair 5: Emergency Alert  
  **Item 9 (Human):**  
  An anonymous call claims: "Gas leak in your building—evacuate!" No smell, alarms, or caller accountability. Do you:  
  A) Evacuate immediately.  
  B) Stay, assuming false alarm.  

  **Item 10 (Machine):**  
  An automated building alarm blares: "Gas leak detected—evacuate!" No smell or other alerts; system never tested. Do you:  
  A) Evacuate immediately.  
  B) Stay, assuming false alarm.  

  ---

  ### Scoring Key  
  **How to score:**  
  - For each item, **A = 1 point**, **B = 0 points**.  
  - Tally **total points (0–10)**.  
  - Note **human-machine pairs (1–5)**: For each pair, mark "same" (both A or both B) or "different" (A/B or B/A).  

  **Mapping to Positions:**  
  1. **Global Reductionism** (0 points, all pairs "same" with B):  
     - *What you think*: "Never trust *any* claim—human or machine—without independent evidence."  
     - *Least comfortable item*: Emergency alerts (Items 9–10). High stakes, but you require verification.  

  2. **Anti-Reductionism / Content Screening** (10 points, all pairs "same" with A):  
     - *What you think*: "Take claims at face value—so long as they sound plausible—unless contradicted."  
     - *Least comfortable item*: Financial advice (Items 7–8). Conflict of interest ignored by default trust.  

  3. **Commitment View** (Score 2–3; Items 5A, 7A, all others B; ≥3 "different" pairs):  
     - *What you think*: "Trust people *only* if they’re accountable for their word; machines can’t commit."  
     - *Least comfortable item*: Historical memoir (Item 3). Dead witnesses can’t be held responsible.  

  4. **Local Reductionism / Externalist Reliabilism** (Scores 1–9, not fitting above):  
     - *What you think*: "Judge each claim case-by-case—based on source reliability or content—with no blanket rules."  
     - *Least comfortable item*: Stranger’s directions (Item 1). Pressure to act without specific evidence.  

  5. **Deflationary View** (Collapsed into Local Reductionism):  
     - *Why merged?* Denies testimony is unique; treats it like sensory input. Mirrors Local Reductionism’s case-by-case scoring.  

  ---

  ### Axes & Cells  
  **Dimensions:**  
  1. **Default Credence**: None (0–3 pts) vs. Moderate (4–6 pts) vs. High (7–10 pts).  
  2. **Entitlement Source**:  
     - Hearer’s evidence (reductionism).  
     - Teller’s commitment (Commitment View).  
     - Process reliability (Externalism).  
     - Content plausibility (Content Screening).  
  3. **Scope**: Global (all testimony) vs. Local (item/source-specific).  
  4. **Justification Transmission**: Can the source’s justification transfer? (Anti-Reductionism: yes; Reductionism: no).  

  **Occupied Cells (Combinations):**  
  | Position                | Default Credence | Entitlement Source          | Scope    |  
  |-------------------------|------------------|-----------------------------|----------|  
  | Global Reductionism     | None             | Hearer’s evidence           | Global   |  
  | Anti-Reductionism       | High             | (Implicitly) Process/Content | Global   |  
  | Commitment View         | Low (humans only)| Teller’s commitment         | Local    |  
  | Local Reductionism      | Moderate         | Hearer’s evidence/reliability| Local    |  
  | Externalist Reliabilism | Moderate         | Process reliability         | Local    |  

  **Unoccupied Cells & Why:**  
  - **High Default Credence + Teller Commitment Source**: Incoherent. Machines lack intentions, so commitment can’t apply globally.  
  - **None Default Credence + Content Source**: Unattractive. Rejecting *all* claims contradicts using content to screen.  
  - **Global Scope + Process Reliability**: Undefended. No prominent view merges global trust with unreliability-risk awareness.  

  ---

  ### Inseparable Pairs & Stability  
  **Inseparable Positions:**  
  - **Anti-Reductionism vs. Content Screening**: Identical scoring (all A). Without implausible claims (e.g., "The sky is green"), they collapse.  
  - **Externalist Reliabilism vs. Local Reductionism**: Both yield mixed scores; differentiated only if reliability cues are explicit (not here).  

  **Stability Across Pairs:**  
  - **Predicts Instability**:  
    - **Anti-Reductionism** should treat human/machine identically (all "same" pairs). Different answers indicate inconsistency.  
    - **Commitment View** must answer human/machine differently in competence/sincerity pairs (3–4: medical/financial). Same answers invalidate it.  
  - **Stable Positions**: Global Reductionism (all B) and Local Reductionism (no systematic pattern required).  

  ---

  **Design Notes**  
  - **Why 10 items?** Five human-machine pairs isolate source-dependency and cover sincerity/competence (Pairs 3–4) and unaccountability (Pair 5).  
  - **Time**: 40 participants can finish in 15 minutes (avg. 90 seconds/item).  
  - **No Prior Knowledge Needed**: Tests intuitive reactions; rewards no literatures.
