  We are designing a diagnostic sorting instrument with ten items (five matched pairs, human vs. machine) to sort participants into positions in the testimony epistemology debate, especially regarding non-intentional sources.
   The positions (leaves) we are mapping to:
   1. Global Reductionism: Testimony, in general, requires positive reasons for belief; no default entitlement. Must reduce to other sources.
   2. Local Reductionism: Each testimony source (or item) must be assessed individually for reliability; no general default entitlement.
   3. Anti-reductionism (Defeasible Default Entitlement): A bare assertion carries a defeasible entitlement to be believed; no positive reasons required initially.
   4. Commitment View: What matters is the teller's commitment (taking them at their word); belief is based on the teller's responsibility, not the hearer's evidence.
   5. Externalist Reliabilism: The belief is justified if the channel is in fact reliable, regardless of the hearer's ability to check.
   6. Content Screening: The plausibility of the content against background beliefs carries the weight; the source is secondary.
   7. Deflationary: There is no distinctive question about testimony; it's just like any other belief formation.

   We also note:
   - Some positions may collapse: e.g., the commitment view might not apply to non-intentional sources, so it might be distinct only in human cases.
   - We must design pairs that can reveal instability: if a participant treats human and machine differently, but their stated position (via pattern) requires sameness, or vice versa.

   Dimensions (axes) we are considering:
    A. Default credence in an uncorroborated assertion: none (must have positive reasons) vs. some (defeasible entitlement).
    B. Source of entitlement (if any): 
        - Hearer's experience (reductionism: the hearer must have evidence of reliability)
        - Teller's commitment (only for intentional agents)
        - Reliability of the process (externalist: regardless of the hearer's knowledge)
        - Plausibility of content (content screening)
    C. Scope: Global (all testimony) vs. Local (each case individually) vs. Not applicable (if no default entitlement, then it's always reductionist in some sense, but global vs local is about the level of generality of the reduction)
    D. Transmission of justification: Can the source's own justification pass to the recipient? (This might be tied to the commitment view or anti-reductionism)

   However, note: the instrument must not use terms of art. So we design concrete scenarios.

   We are building five pairs (ten items). Each pair has a human and a machine version, same content, same apparent confidence, same unavailability of independent checks.

   We need to cover:
    - Sincerity vs. competence: one scenario where the issue is whether the source is lying (sincerity) and one where the issue is whether the source is competent (even if sincere). But note: machines don't have intentions, so "sincerity" for machines might be about whether they are designed to be truthful or not, but that's reliability.

   Let's design the five pairs:

   Pair 1: Directions to a place in an unfamiliar city.
     Human: A stranger on the street gives you directions to a museum you're looking for. They seem confident and have no reason to mislead you, but you have no map and your phone is dead.
     Machine: A city kiosk (automated) gives you printed directions to the museum. It looks official, but you have no way to check until you start walking.

   Pair 2: Historical fact about a little-known event.
     Human: You read a memoir by a now-deceased person who claims to have witnessed a minor historical event. No other records exist.
     Machine: An AI generates a summary of historical records (the same event) and states the fact confidently. The original records are lost, so you only have the summary.

   Pair 3: Medical advice (competence focus).
     Human: A friend who is a nurse (but not a doctor) tells you that your symptom is nothing to worry about. They are sincere, but you don't know their level of expertise.
     Machine: A symptom-checker app (not FDA-approved) tells you that your symptom is nothing to worry about. It looks professional, but you don't know its accuracy.

   Pair 4: Financial advice (sincerity focus for human, but for machine it's about programming).
     Human: A financial advisor at your bank (who earns commission) recommends a particular investment. They seem trustworthy, but you don't know if they are biased.
     Machine: An algorithm on the bank's website recommends the same investment. The bank profits if you invest, but the algorithm is presented as objective.

   Pair 5: Urgent alert (source cannot be held to account).
     Human: A voice message from an anonymous caller claims there is a gas leak in your building and you must evacuate immediately. You don't know who they are or why they called.
     Machine: An automated alarm system in your building (which has never gone off before) announces a gas leak and orders evacuation. You have no way to verify.

   For each item, we ask: What do you do? We give two or three options that represent different epistemic stances.

   We must avoid "it depends" and "I would check first" because the scenario is set up so that independent checks are not available at the moment of decision.

   Example for Pair 1 (Human):
     You are lost in a foreign city. A stranger approaches and says, "The museum is three blocks that way," pointing. They seem confident and friendly. Your phone is dead and you have no map. Do you:
     A) Start walking that way, because they have no reason to lie and you have to trust someone.
     B) Ask someone else first, because you can't be sure they are right.
     C) (if needed) Wait until you can find a map.

   But note: we don't want the option to check. So we force the decision: either act on it or don't. So:

     A) Start walking in that direction, taking their word for it.
     B) Ignore them and try to find another way (e.g., look for a shop to ask or a map, but without specifying that you can immediately check).

