   FDT would consider the policy: what policy should she have chosen from the perspective before she knew the group? 

   The policy is a function that maps the information she has (which is that she is in one of the two groups but doesn't know which) to an action (pay or not pay).

   If she chooses a policy of paying, then:
     - If in group 1, she pays $1000 and avoids blindness (so she gains the value of sight, call it S, minus $1000).
     - If in group 2, she pays $1000 and gets $10,000 (so she gains $9,000).

