   5. Desert Driver: pays (FDT: the policy of paying after the ride is necessary to be the type that gets the ride).
   6. Burning House: pays (FDT: causal effect of saving the house, no prediction involved).
   7. Smoking Lesion: smokes (FDT: the decision to smoke doesn't cause the cancer, and the gene is fixed; so smoking is fine).

   So FDT is consistent with all.

   What about other theories?

   - CDT: would two-box in Newcomb (she one-boxes, so ruled out by 1).
   - EDT: would not smoke in the smoking lesion (she smokes, so ruled out by 7).

   So FDT (or UDT, which is similar) seems to be the only major theory that survives.

   However, we must note that there are variants. Also, note that in the counterfactual mugging in the heads case she doesn't pay. That is consistent with FDT.

   (b) What does FDT say about the letter case?

   The letter case:

   - She is in one of two groups, assigned by a fair coin flip (50% each) before she was born.
   - Group 1: paying $1000 prevents blindness (so she must pay to avoid blindness).
