   Alternatively, note that the predictor in Newcomb is a perfect predictor. In the smoking lesion, the gene is a common cause. The difference might be that in Newcomb, the predictor is simulating her decision in this very scenario. In the smoking lesion, the gene causes both, but there is no prediction about her current decision. So maybe she is using FDT? 

   FDT (Functional Decision Theory) treats the decision as the output of a function that is called in multiple situations. In Newcomb, by choosing to one-box, she causes the predictor to have predicted one-boxing and thus to have put the million in the box. In the smoking lesion, the gene causes the urge to smoke and the cancer. The decision to smoke is not being predicted by anyone in the same way. In fact, the lesion case is designed to show that EDT and CDT come apart. But FDT would say: the decision function that produces the urge to smoke is the same function that is correlated with the cancer. So if she could choose a policy in advance, she would choose to not have the urge to smoke? But in the moment, she has the urge. However, FDT would choose the policy that maximizes expected utility. The policy of not smoking would break the correlation? But note: the gene causes both the urge and the cancer. If she has the gene, she will have the urge and the cancer regardless. So the policy of smoking doesn't cause the cancer. Therefore, FDT would smoke? 

   Yes. FDT would smoke in the smoking lesion because the gene is fixed and there is no way to avoid the cancer by not smoking. Not smoking would only deprive her of the pleasure without changing the cancer. So FDT would smoke. And FDT would one-box in Newcomb. So FDT is consistent with 1 and 7.

   Now, what about the blackmail (4)? FDT would reason: 
     - Omega has already run a simulation of my decision function in this exact scenario. If my decision function is one that pays, then I was infected. If it is one that doesn't pay, then I wasn't.
     - Therefore, if I pay, I must be infected. If I don't pay, I must be uninfected.
     - But if I am infected, then paying is good (because it cures me). If I am uninfected, paying is bad (wastes money).
     - However, I don't know whether I'm infected. But note: if I decide to pay, then that means my decision function is the paying type, which implies I was infected. So if I pay, I get cured (and pay $1000). If I don't pay, then I wasn't infected and I don't pay. 

   But wait, that suggests paying is always associated with being infected and thus getting the cure. So why not pay? Because if I pay, I am infected and I pay $1000 and get cured. If I don't pay, I am uninfected and I don't pay. So in both cases, I end up without the disease? But that's not true. The infection has already happened. If I am infected and I don't pay, I have a 10% chance of survival. If I pay, I have a 90% chance. And if I am uninfected, I have 100% chance regardless.

   But the problem is that my decision doesn't change the infection status. It only changes the cure. However, the infection status is correlated with my decision. Specifically, if I have a decision function that pays, then I was infected. So the expected utility of paying is:

     EU(pay) = P(infected | pay) * [ (0.9 * value of life) - 1000 ] + P(uninfected | pay) * [ (value of life) - 1000 ]

   But because of the prediction, P(infected | pay) is 1 and P(uninfected | pay) is 0. So:

     EU(pay) = 1 * [0.9 * V - 1000] + 0 = 0.9V - 1000

   Similarly, EU(not pay) = P(infected | not pay) * [0.1 * V] + P(uninfected | not pay) * [V]
   = 0 * [0.1V] + 1 * V = V

   So EU(not pay) = V, which is greater than EU(pay) = 0.9V - 1000 (if V is large enough, which it is). So she should not pay.

   This reasoning is FDT. So FDT would not pay in the blackmail case.

   Now, the burning house (6): she pays. Why? In this case, Omega had nothing to do with the fire. Paying $1000 to put out the fire is a causal transaction: it causes the fire to be put out. There is no prediction by Omega about her behavior in this scenario? The problem doesn't say that Omega is making a prediction. It just offers to put out the fire for $1000. So she pays because it causally saves her house. This is consistent with CDT and FDT: both would pay because there is no correlation without causation.

   The desert driver (5): She pays even though she doesn't have to. Why? Because she had to form an intention to pay to get the ride. But once in town, nothing depends on it. But note: she might have made a commitment to herself? Or she might be following through to be consistent? But the problem says the driver has a flawless lie detector and only gives the ride if she genuinely intends to pay. So at the time of the ride, she must intend to pay. Once in town, if she doesn't pay, that doesn't change the ride. But she pays. This might be because she values honesty, or because she doesn't want to break her word. But the problem says "nothing she values depends on the payment". So why pay? 

   This might be an example of being committed to a policy. In FDT, the agent chooses a policy that, when applied in the pre-ride state, leads to getting the ride and then paying. If she were to choose a policy that says: intend to pay to get the ride, but then don't pay, then the lie detector would detect that she doesn't genuinely intend to pay? Because if she has the policy of not paying after, then at the time of the ride, she doesn't genuinely intend to pay. So to get the ride, she must have a policy of paying after. Therefore, she pays to be the kind of agent who can get the ride in the first place. This is FDT reasoning.

   So FDT seems to explain all:

   1. Newcomb: one-box (FDT one-boxes).
   2. Counterfactual Mugging (tails): pays (FDT: the policy of paying in the tails scenario leads to the charity being rewarded in the heads scenario).
   3. Counterfactual Mugging (heads): doesn't pay (FDT: the payment now doesn't affect the charity and the coin is heads so the charity was already rewarded if the simulation predicted she would pay, but she doesn't need to pay now because the simulation was about the counterfactual).
