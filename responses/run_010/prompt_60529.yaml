  So the ranking depends on how we describe the same prospect. The common-refinement requirement: we must use a partition that refines both descriptions. But for one agent, the natural partition might be two separate events (e.g., two independent risks) while for another it might be grouped. The common refinement would split into three branches: one for the first bad, one for the second bad, and one for the good. Then each bad branch has probability 0.15 and is dropped, so V(Y)=0.

  But if the two bad outcomes are from the same source and cannot be split? For example, if the bad outcome is triggered by either of two mutually exclusive events, each with probability 0.15, then the natural description might be two branches. But if they are from the same event (e.g., a continuous measure), then we might have one branch.

  The floor rule is sensitive to the granularity of the partition. The common-refinement requirement forces the agent to use the finest available partition. However, this may not be costless: sometimes the finest partition is not available (if the agent doesn't know the underlying states) or is computationally prohibitive.

  Moreover, two agents facing the same physical situation but using different (equally defensible) partitions might rank prospects differently. For example, one agent might group the two bad outcomes together (because they have the same utility) and thus have one branch with p=0.3, while another agent might keep them separate (because they are from different sources) and have two branches of p=0.15. The first agent values Y at -300, the second at 0. This violates description-invariance.

  ## 3. The Floor Does Not Cure the Disease
  For any fixed ε, consider a prospect that offers utility U (enormous) with probability p such that p is just above ε (say, p=ε+δ for a small δ>0) and 0 otherwise. Then the expected value is pU, which can be made arbitrarily large by increasing U. So the agent will accept any bounded cost to take this gamble. For example, she will pay a cost C to play the lottery if pU > C, which holds for sufficiently large U. This is a Pascalian verdict that the floor does not block.

  Therefore, to avoid fanaticism, the anti-fanatic must also bound utilities. Suppose we impose a bound M on utilities (so |u|≤M). Then the expected utility of any prospect is bounded by M. The floor becomes redundant because the contribution of any branch with probability p is at most pM, and the sum of all p_i=1, so the total is at most M. Moreover, the expected utility of a branch with p<ε is at most εM. By ignoring it, the floor makes an error of at most εM. But the expected utility theory without floor would also have bounded differences (by the bound M). So the floor is not needed: with bounded utilities, the expected utility is bounded and the Pascalian problem is avoided.

  If one keeps the floor, then we still have the defects (blindness, dynamic inconsistency, description-sensitivity) and the only benefit is computational (ignoring very small probabilities). But the cost is systematic violations of dominance and consistency.

  ## 4. Objections and Replies

  **Objection 1: Sophisticated choice.** A sophisticated agent, who anticipates her future choices, would avoid the dynamic inconsistency. In the two-stage example, she would at Stage 1 choose Action II because she knows that if she chooses I and reaches Stage 2, she will choose D, leading to a bad outcome overall.

  *Reply:* Sophistication does avoid the dynamic inconsistency in the sense that the agent chooses consistently with her future actions. However, it does not avoid the bad outcome. In the example, the agent chooses Action II (getting -3 in her evaluation) to avoid the worse outcome of Action I (which she values at 0 but which actually has a high probability of catastrophe). But then she still incurs the loss of -3 (in her evaluation) while Action I, if she could commit to choose C at Stage 2, would have been -0.3 (which is better). But she cannot commit. Moreover, without the floor, she might have chosen differently: the expected utility of Action I (without floor) is 0.6*0 + 0.3*(-1) + 0.1*(-1000) = -0.3 -100 = -100.3, and Action II: 0.6*0 + 0.3*(-10) + 0.1*0 = -3. So without floor, she would choose Action II. The floor misleads her into thinking Action I is better (0 vs -3) but in reality it is much worse. Sophistication makes her choose Action II, so she avoids the worst, but she still uses the flawed evaluation. Moreover, the blindness result and description-sensitivity remain.

  **Objection 2: Heuristic only.** The floor is not intended as a criterion of right choice but as a heuristic for cognitively limited agents. The dynamic inconsistency is then not a flaw because the agent is not expected to solve complex dynamic problems.

  *Reply:* If the agent uses the floor as a heuristic, then in static choices she is still vulnerable to the blindness result: she may accept a series of independent trades each of which seems beneficial (because the small-probability loss is ignored) but which together lead to a near-certain disaster. Moreover, the description-sensitivity means that the same choice framed differently might be decided differently. A good heuristic should be robust to such reframing. Also, the heuristic does not block the high-stakes gambles with probabilities just above the floor. Therefore, if we are to use a heuristic, a utility cap (or a transformation that discounts extreme utilities) might be safer.

  **Objection 3: Scale ε to stakes.** The threshold ε should not be constant but should depend on the stakes. For high stakes, we use a lower ε.

  *Reply:* This avoids some Pascalian offers: if the utility is very high, then the threshold is lowered. But it does not avoid all: for any scaling function, we can set the probability low enough to be below the threshold but the expected utility still very high by increasing the utility. Moreover, it introduces new problems: how to define the scaling? And the other defects (blindness, dynamic inconsistency, description-sensitivity) remain, because for a given branch, if its probability is below the threshold (even if the threshold is context-dependent) then it is ignored. The blindness result still holds: an agent would trade an arbitrarily large loss in a branch that is below the current threshold for a small gain in a kept branch.

  ## 5. Constructive Upshot
  The anti-fanatic should cap utilities rather than use a probability floor. Specifically, she can choose a bounded utility function (e.g., by applying a bounded function like arctan to the original utility). This avoids fanaticism: the expected utility is bounded.

  Costs of capping:
  - *Recklessness/Timidity trade-off*: Without a floor, the agent is still vulnerable to timid choices: she may reject a gamble with a small probability of a large loss even if the expected utility is positive, if the loss is near the cap. But this is less severe than the blindness of the floor. Alternatively, she can use a risk-averse transformation (like concave utility) which would make her more timid, but that is a separate issue.
  - *Biting the bullet*: She might accept that in some cases, very large utilities with small probabilities dominate, but by capping, she avoids the extreme cases.

  Compared to the floor, capping utilities:
  - Avoids the blindness result: every branch is considered, so dominance is respected.
  - Avoids dynamic inconsistency: since the valuation is consistent with expected utility, dynamic consistency holds.
  - Avoids description-sensitivity: expected utility is partition-invariant.

  The cost is that the agent may not be as sensitive to very small probabilities as we might like, but this can be addressed by a transformation that weights probabilities (like rank-dependent utility) without ignoring them entirely.

  ## 6. Scope Note
  - The blindness result requires only that utilities can be arbitrarily large (or negative) in the sub-threshold branches. However, if we fix a bound on utilities, then the loss in the sub-threshold branch is bounded, so the repeated trades lead to a bounded loss. But the result still holds for any fixed bound if we allow enough trades: the total loss can be made arbitrarily large by increasing the number of trades.
  - The dynamic inconsistency example relied on a negligible probability event (S3) and a sub-threshold event within Stage 2. The utilities in these events must be large enough to matter: we used -1000. If utilities are bounded, then the losses are bounded, but the inconsistency remains in form.
  - The description-sensitivity does not depend on the size of utilities at all: it only requires that the same prospect can be described in different partitions. This is not about fanaticism but about the representation of uncertainty.

  Therefore, the main defects of the floor are not solely about fanaticism; they arise from the neglect of low-probability events even when the stakes are modest.
