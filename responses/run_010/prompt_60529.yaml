  ### A Rigorous Argument Against Probability Floors in Decision Theory Under Extreme Uncertainty

  **Introduction**  
  This section critiques a common anti-fanatic maneuver in decision theory: imposing a *probability floor* ε ∈ (0,1), below which probabilities are treated as zero. We evaluate two variants:  
  - **Hard Floor (HF(ε))**: The value of prospect \(X\) is \(V(X) = \sum_{\{i \mid p_i \geq \varepsilon\}} p_i u_i\), ignoring sub-ε branches.  
  - **Renormalized Floor (RF(ε))**: \(V(X) = \left( \sum_{\{i \mid p_i \geq \varepsilon\}} p_i u_i \right) / \left( \sum_{\{i \mid p_i \geq \varepsilon\}} p_i \right)\) (if denominator >0).  

  We argue that both repairs introduce defects more systematic and intolerable than the Pascalian "fanaticism" they avoid. The anti-fanatic should instead constrain utilities.

  **§1. Standard of Comparison**  
  We assess rules by their *unacceptable verdicts*: violations of axiomatic or pragmatic principles a theory should uphold. Specifically:  
  - **Dominance**: If \(X\) weakly dominates \(Y\) in all states and strictly in some, \(X \succ Y\).  
  - **Dynamic Consistency**: Ex ante optimal plans remain optimal when executed.  
  - **Description-Invariance**: Rankings are invariant to equivalent redescriptions of prospects.  
  - **Pragmatic Soundness**: No guaranteed loss or exploitable vulnerability.  

  Fanaticism (standard expected utility with unbounded utility) violates *prudence* by accepting arbitrarily low probabilities of arbitrarily high losses for negligible gains. However, its violations are isolated and context-dependent. Probability floors, by contrast, generate *systematic* violations of dominance, consistency, and description-invariance, and permit *exploitable* blindness. This makes them worse: while fanaticism is recklessly bold, floors are recklessly timid, violating core decision-theoretic norms more pervasively.

  **§2. Constructed Defects**  
  *All examples assume ε = 0.1. Utilities are in units of well-being, and probabilities are known.*

  **2.1 Blindness Result**  
  *Defect*: Floors induce indifference to catastrophic losses on sub-ε branches.  
  - **Static Blindness**: Consider prospects \(X\) and \(Y\):  
    - \(X\): \((p_1 = 0.9, u_1 = 0), (p_2 = \varepsilon/2 = 0.05, u_2 = 0)\)  
    - \(Y\): \((p_1 = 0.9, u_1 = 1), (p_2 = 0.05, u_2 = -U)\) for \(U > 0\).  
  Under HF(ε), \(V(X) = 0.9 \times 0 = 0\), \(V(Y) = 0.9 \times 1 = 0.9\). Thus, \(Y \succ X\) for any \(U\), no matter how large (e.g., \(U = 10^{100}\)). The agent pays 0 for a gain of 1 on \(p_1\) but risks loss \(-U\) on \(p_2\). This violates dominance: \(Y\) is worse than \(X\) in state 2 and identical elsewhere.  
  For RF(ε), \(V(X) = 0\), \(V(Y) = (0.9 \times 1) / 0.9 = 1\), so \(Y \succ X\) persists.  

  - **Repeated Exploitation**: An adversary can offer sequential trades. At step \(k\), the agent faces:  
    - Accept: Gain \(1\) on branch \(p_k = 0.9\) (probability ≥ ε), lose \(-U_k\) on branch \(q_k = 0.05\) (probability < ε).  
    - Reject: Status quo (utility 0).  
  Under HF(ε) or RF(ε), \(V(\text{Accept}) > V(\text{Reject}) = 0\) if \(u_{\text{kept}} > 0\). After \(n\) trades, if all sub-ε branches realize (probability \(> 0\) for \(n\) large), loss is \(\sum_{k=1}^n -U_k\). Set \(U_k = 2^k\); total loss grows exponentially and is unbounded as \(n \to \infty\). The agent foresees this possibility but myopically accepts each trade.  

  **2.2 Dynamic Inconsistency**  
  *Defect*: Ex ante optimality is reversed ex post, harming the agent.  
  Consider a medical decision:  
  - **Stage 1**: Choose:  
    - **Drug A**: 90% chance of cure (utility 10), 10% chance of side effect leading to Stage 2.  
    - **Drug B**: Sure utility 8.  
  - **Stage 2** (if side effect occurs): Choose:  
    - **Therapy C**: Sure utility \(-10\).  
    - **Therapy D**: 95% chance of utility 0, 5% chance of disability (utility \(-U\), \(U > 0\)).

  *Ex ante evaluation with HF(ε=0.1)*:  
  - Drug B: \(V(B) = 8\).  
  - Drug A: Outcome 10 with p=0.9 (≥ε), outcome determined by Stage 2 with p=0.1 (≥ε). At Stage 2:  
    - \(V(C) = -10\) (single branch).  
    - \(V(D) = \text{ignore } 5\% \text{ branch} = 0.95 \times 0 = 0\) (since 0.05 < ε). Thus, agent chooses D.  
    Value of Stage 2 is 0, so \(V(A) = 0.9 \times 10 + 0.1 \times 0 = 9\).  
  Hence, \(A \succ B\) (9 > 8).  

  *Ex post (Stage 2)*: Agent faces choice between C (−10) and D. As above, \(V(D) = 0 \succ V(C) = -10\), so chooses D.  

  *Outcome*: With 10% probability (Stage 2 reached), agent receives D, which has 5% chance of −U. If \(U = 1000\), expected utility of A *realized* is \(0.9 \times 10 + 0.1 \times (0.95 \times 0 + 0.05 \times -1000) = 9 - 5 = 4\). This is worse than B’s 8. The loss (4 vs. 8) occurs in the 10% state where Stage 2 is reached, and was foreseeable: ex ante, the agent could compute the true expected utility of A as 4 but ignored the 5% sub-ε risk.  

  RF(ε) behaves similarly: \(V(D) = 0\) (as denominator sums kept probabilities: 0.95), leading to same inconsistency.  

  **2.3 Description-Sensitivity**  
  *Defect*: Rankings depend on outcome-grain, even under common refinement.  
  Consider a climate policy yielding utility −1000 if a critical threshold is breached (probability 0.15).  
  - **Description 1 (Coarse)**: Single branch: \(p = 0.15 \geq \varepsilon\), \(u = -1000\) → \(V_1 = 0.15 \times -1000 = -150\).  
  - **Description 2 (Fine)**: Two independent mechanisms, each with probability \(p = \sqrt{0.15} \approx 0.387 > \varepsilon\), but breach occurs only if both fail. Refined prospect:  
    - Mechanism 1 fails, Mechanism 2 works: \(p = 0.387 \times 0.613 \approx 0.237\), \(u = 0\)  
    - Mechanism 1 works, Mechanism 2 fails: \(p \approx 0.237\), \(u = 0\)  
    - Both fail: \(p \approx 0.387 \times 0.387 = 0.15\), \(u = -1000\)  
    - Both work: \(p \approx 0.613 \times 0.613 \approx 0.376\), \(u = 0\).  
  Under HF(ε=0.1), all branches have \(p \geq \varepsilon\) except the sub-ε branch? Wait: all probabilities are >0.1? 0.15>0.1, 0.237>0.1, 0.376>0.1. So no branch is ignored: \(V_2 = 0.15 \times -1000 = -150\). Same as \(V_1\).  

  *Adjusted example*: Suppose breach requires three independent events, each with failure probability \(q = 0.15^{1/3} \approx 0.53 > \varepsilon\). But the branch "all three fail" has \(p = q^3 = 0.15\). Now:  
  - **Description 1**: One branch: \(p=0.15\), \(u=-1000\) → \(V_1 = -150\).  
  - **Description 2**: Eight branches (fail/work for each event). The breach branch (all fail) has \(p=0.15\), utility \(-1000\). Other branches have utility 0. Under HF(ε), no branch is ignored (since \(p_{\text{all fail}} = 0.15 \geq \varepsilon\)), so \(V_2 = -150\).  

  *Critical case*: Let the breach probability be 0.15, but split into two sub-branches:  
  - **Description 3**: Two mutually exclusive sub-events, each causing breach:  
    - Sub-event A: \(p_A = 0.1\), \(u_A = -1000\)  
    - Sub-event B: \(p_B = 0.05\), \(u_B = -1000\)  
    - No breach: \(p = 0.85\), \(u = 0\).  
  Under HF(ε), \(p_A = 0.1 \geq \varepsilon\) is kept, \(p_B = 0.05 < \varepsilon\) is ignored: \(V_3 = 0.1 \times -1000 + 0.85 \times 0 = -100\).  
  Under common refinement with Description 1, we use three branches: A, B, No breach. Thus, \(V_3 = -100 \neq V_1 = -150\). Same physical prospect ranked differently.  
  RF(ε) worsens this: \(V_3 = (0.1 \times -1000) / (0.1 + 0.85) \approx -100 / 0.95 \approx -105.26 \neq -150\).  

  The common refinement *does not fix* this: it ensures branch alignment but not outcome-grain. If outcomes are individuated by causally distinct events (e.g., "A breaches" vs. "B breaches"), refinement forces separation, and floors treat branches differently. A finest partition may not exist (e.g., continuous densities), making floors arbitrarily sensitive to description.

  **§3. The Floor Fails to Cure Fanaticism**  
  For any ε, consider a prospect: utility \(U = 1/\varepsilon\) with probability \(p = \varepsilon + \delta\) (\(\delta > 0\) small), utility 0 otherwise.  
  - Expected value: \((\varepsilon + \delta) \cdot (1/\varepsilon) > 1\).  
  - Under HF(ε) or RF(ε), \(p \geq \varepsilon\), so \(V = (\varepsilon + \delta)/\varepsilon > 1\).  
  Thus, the agent pays cost \(C=1\) to play, accepting a gamble with expected value marginally >0 but unbounded risk if \(U\) scales. This is Pascalian: tiny probabilities of huge gains drive decisions.  

  To block *all* Pascalian gambles, the anti-fanatic must bound utilities. Suppose \(|u| \leq M\) for all outcomes. Then:  
  - Expected utility \(\leq M\), avoiding fanaticism.  
  - Sub-ε branches contribute \(\leq \varepsilon M\), so ignoring them (via floor) adds error \(\leq \varepsilon M\).  
  - Without a floor, standard expected utility with bounded \(u\) respects all §1 principles.  

  The floor thus does no independent work: utility bounding suffices. If retained, it adds defects (§2) while leaving just-above-ε Pascalian gambles untouched.

  **§4. Objections and Replies**  
  **Objection 1 (Sophistication)**: A sophisticated agent, anticipating future choices, avoids dynamic inconsistency by selecting time-consistent plans.  
  *Reply*: Sophistication prevents *inconsistent execution* but not *bad outcomes*. In §2.2, sophistication leads the agent to choose Drug B at Stage 1 (since it foresees Stage 2 choice of D and computes true \(V(A) = 4 < 8\)). However, this is a loss: without floors, \(V(A) = 4\) vs. \(V(B) = 8\), but under floors, the ex ante value of A is 9 > 8, misleading the agent into *believing* A is better. Sophistication mitigates harm but does not eliminate the floor’s misvaluation. Blindness and description-sensitivity remain unaffected.

  **Objection 2 (Heuristic)**: Floors are a cognitive heuristic, not a normative criterion, so dynamic inconsistency is irrelevant.  
  *Reply*: Even as a heuristic, floors are flawed. §2.1 shows myopic users are exploited via repeated trades. §2.3 shows heuristic performance depends on framing: two agents with identical knowledge but different outcome grains make different choices. A heuristic should be robust; floors are not. Utility bounding (e.g., capping at a large \(M\)) is safer and computationally comparable.

  **Objection 3 (Stakes-Scaling)**: ε should scale with stakes (e.g., lower ε for higher stakes).  
  *Reply*: Stakes-scaling mitigates but does not cure. For any scaling rule \(\varepsilon(u)\), set:  
  - Utility \(u = U_{\text{high}}\) in a branch with probability \(p < \varepsilon(U_{\text{high}})\) (so ignored),  
  - But let \(p \cdot U_{\text{high}}\) be large (e.g., \(p = \varepsilon(U_{\text{high}})/2\), \(U_{\text{high}} = 2M/p\) for bound \(M\)).  
  The agent ignores a branch with expected utility \(M\), violating dominance if traded for small gains. Defects in §2 persist, as branches below their context-dependent ε are still ignored.

  **§5. Constructive Upshot**  
  The anti-fanatic has options:  
  - **Cap utilities**: Transform \(u \mapsto f(u)\) with \(f\) bounded (e.g., \(f(u) = \arctan(u)\)). Respects dominance, consistency, and description-invariance. Cost: Timidity near bounds; may reject positive-EV gambles if losses approach cap.  
  - **Global risk-aversion**: Use concave \(u\), dampening extreme values. Cost: Over-timidity; rejects fair large gambles.  
  - **Accept timidity**: Reject all positive-EV gambles with tiny loss probabilities. Cost: Systematic forgone gains.  
  - **Become fanatic**: Accept Pascalian verdicts. Cost: Counterintuitive risk-taking.  

  Utility capping is preferable to floors: it blocks fanaticism without inducing blindness, inconsistency, or description-sensitivity. Floors cost more by violating core decision norms; capping only modulates risk attitudes. Even modest stakes (§2.3) expose floors’ flaws, while capping’s timidity is controllable (e.g., set cap high).

  **§6. Scope Note**  
  - **Unbounded utilities required**: Only for §3 (Pascalian gambles just above ε). §2 defects use large but bounded utilities (e.g., blindness requires \(U\) large; dynamic inconsistency requires \(|u|\) large enough to matter).  
  - **Modest stakes suffice**: Description-sensitivity (§2.3) requires no large utilities; it arises from partition dependence even with modest stakes (e.g., −1000 in examples).  
  - **Not solely about fanaticism**: Description-sensitivity and dynamic inconsistency are general flaws in floors, independent of extreme uncertainty. The repeated-trade exploitation (§2.1) requires only that utilities can be large relative to gains; it is not Pascalian.  

  Thus, probability floors are defective even absent fanaticism, and utility capping is a strictly superior repair.

