  We are to argue that introducing a probability floor to avoid fanaticism in expected value theory leads to systematic defects worse than the problem it was meant to solve. We consider two variants: hard floor (HF) and renormalized floor (RF). The comparison standard will be the set of unacceptable verdicts (violations of intuitive principles) and the vulnerability to exploitation (through dynamic inconsistency and description-sensitivity). We construct three defects: blindness, dynamic inconsistency, and description-sensitivity. We then show that the floor does not cure the Pascalian problem and argue for utility capping as a better alternative.

  ## 1. Standard of Comparison
  We compare the rules by the set of unacceptable verdicts they generate. Specifically, we consider violations of:
  - *Dominance*: If prospect A yields at least as good an outcome as B in every state and strictly better in some, then A should be preferred to B.
  - *Dynamic consistency*: The ex ante optimal plan should remain optimal when followed at each subsequent decision node.
  - *Description-invariance*: The ranking of prospects should not depend on how the same uncertainty is partitioned (given the outcomes are the same).
  - *Pragmatic vulnerability*: The agent should not be subject to a sure loss or a series of choices that lead to arbitrarily large losses.

  We argue that the probability floor leads to systematic violations of dominance (via blindness), dynamic consistency, and description-invariance, which are more severe than the occasional large-stakes gambles that fanaticism (unbounded expected utility) permits.

