  Moreover, the agent would trade an arbitrarily large loss on a sub-threshold branch for an arbitrarily small gain on a kept branch. For example:
  - Let X: (p=ε, u=0); (q=ε/2, v=-U) where U is large.
  - Let Y: (p=ε, u=δ); (q=ε/2, v=-U) for some small δ>0.

