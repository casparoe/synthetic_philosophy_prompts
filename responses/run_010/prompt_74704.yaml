prompt: |-
  ok so my school is named after this guy who was a pretty big deal in town like 100 years ago, and it turns out he also spent a lot of energy making sure the town's Black families couldn't vote or buy houses on the north side. Theres a committee now and my mom is on it and its basically two camps yelling at each other: one side says keeping his name up honors the racism, the other side says you can't judge people by today's standards and taking it down erases history.

  I'm applying for a summer program where you have to send in a two-page research proposal, and I want to write about this but from an angle that isn't either camp. My half formed idea: both sides assume a statue or a building name means one fixed thing, but I think what it means shifts depending who's looking at it and on what the community does next. So leaving it up could be an ongoing act of endorsement, or it could be pure inertia that doesn't express anything at all, and those two readings give you totally opposite verdicts about what the committee should do.

  Turn that into a proposal: the exact question I'd be answering, why the two standard positions don't settle it, what I'd actually do over six weeks and why that method beats just surveying people, what a result would look like that a real committee could use, and what would count as the project failing. Skip the citations, my advisor's helping with that. And honestly tell me if this is too big for a summer thing.
