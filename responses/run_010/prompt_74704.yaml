answer: |-
  Here’s a focused, actionable research proposal based on your insight, designed for a 6-week summer project. It avoids the binary debate and centers your core idea: **meaning isn’t fixed—it’s shaped by context and future action.**

  ---

  ### Research Proposal: *Monumental Ambiguity: How Post-Decision Community Action Shapes the Meaning of Contested Heritage*

  **1. Core Question:**  
  *How does community action (or inaction)* after *a decision about retaining a contested namesake (e.g., on a school) actively reshape the perceived meaning of that namesake for different stakeholder groups?*

  **2. Why Existing Debates Fall Short:**  
  The current deadlock ("remove = erasure" vs. "keep = endorsement") assumes the name’s meaning is static and inherent to the figure. Your insight is key: **meaning is dynamic**, influenced by:
  - **Interpretation:** Who observes it (e.g., descendants of excluded families vs. historical society members).
  - **Context:** What the community *does* afterward (e.g., adding context, ignoring it, counter-memorials).
  - **Time:** Meaning evolves (e.g., inertia today could become endorsement tomorrow if unchallenged).  
  *This project moves beyond judging the past to analyzing how present/future actions actively construct meaning.*

  **3. Methodology: Beyond Surveys (6-Week Plan):**  
  | **Phase** | **Activity** | **Why Better Than Surveys** |
  |-----------|--------------|----------------------------|
  | **Weeks 1-2: Comparative Case Studies** | Analyze 3-5 documented conflicts over school/statue renaming (e.g., Dixie State University, Yale’s Calhoun College). Focus on: <br> • Initial arguments pre-decision <br> • Actions taken *after* decision (e.g., plaques, curriculum changes, protests, silence) <br> • How meaning was *reported* 2+ years later (news, academic studies, community forums). | Surveys capture snapshots of opinion; case studies reveal *how actions over time* change perception. Avoids biasing local participants pre-decision. |
  | **Weeks 3-4: Local Contextual Interviews** | Conduct 8-10 targeted interviews with: <br> • 2-3 committee members (neutral/faction leaders) <br> • 2-3 alumni (different eras) <br> • 2-3 current students <br> • 1-2 local historians<br>*Focus: Not "Should we remove it?" but "What would keeping/removing it *come to mean* if we [added context/did nothing/renamed a park/etc.]?"* | Explores *anticipated* meaning-shifts based on future actions. Reveals nuances surveys miss (e.g., "Inertia feels like indifference to me"). |
  | **Week 5: Synthesis & Framework** | Map case study outcomes + interview themes onto a spectrum: <br> • **Meaning as Endorsement** (e.g., retention + no action) <br> • **Meaning as Accountability** (e.g., retention + education/context) <br> • **Meaning as Reclamation** (e.g., removal + new naming process) <br> • **Meaning as Neglect** (e.g., retention + silence → erosion of trust) | Creates a practical tool for committees: *Retention/removal alone don’t fix meaning; your FOLLOW-UP actions do.* |
  | **Week 6: Drafting & Visualization** | Produce: <br> • Short report with spectrum framework + case study examples <br> • Visual flowchart: "Intentions vs. Perceived Meanings" <br> • 2-page policy memo for committees | Makes findings actionable for real-world decision-makers. |

  **4. Deliverable: A Practical Tool for Committees**  
  Your result isn’t "keep or remove." It’s a **"Meaning Impact Assessment" framework** that helps committees:  
  - Predict how *their specific post-decision actions* (e.g., curriculum, plaque, ceremony, art installation) could shift interpretations.  
  - Identify high-risk actions (e.g., doing nothing after retention = likely seen as endorsement).  
  - Design intentional strategies aligned with community values (e.g., "If we keep the name, we *must* pair it with X to avoid endorsement").  

  **5. Measurable Success & Failure:**  
  - **SUCCESS:** The framework is adopted by the committee (or similar groups) to structure post-decision planning. Interviews reveal stakeholders feel the analysis captures complexity they hadn’t considered.  
  - **FAILURE:** The project merely describes the two existing camps without advancing a new analytical tool. Findings are too abstract for practical use ("interesting but not actionable").  

  **6. Is This Feasible in 6 Weeks?**  
  **Yes, with strict focus:**  
  - **Scope Control:** Limit cases to 3-5 pre-documented conflicts (no original archival work). Keep interviews lean (8-10 max).  
  - **Advisor Support:** Your advisor’s help with citations/case study selection is crucial.  
  - **Output:** Prioritize the practical framework over exhaustive history.  

  **Why This Approach Works:**  
  You’re not solving the ethical debate—you’re reframing it. Committees aren’t choosing between "history" and "progress"; they’re choosing *how their future actions will actively shape what the past means to their community*. That’s a breakthrough only your dynamic lens can offer.

  ---
  **Final Tip:** Title your proposal to reflect the *active construction of meaning* (e.g., "Shaping Legacy," "Negotiating Meaning," "Beyond Removal"). Good luck!
