  Layer (c), the practice—nativities and predictions—is purely astrological. Kepler himself was skeptical about it and didn't incorporate it into his scientific astronomy. So this should be 0—nothing survives.

  Now, ranking: (a) highest, then (b), then (c). The user suspects that layer (b) is what makes harmony theory astronomical, but my ranking shows (a) is fully transferable while (b) is not. That supports the supervisor's position that the harmonic machinery is detachable. However, in the verdict, I need to reconcile this: the supervisor is right about detachability, but the user has a point that in astrology, (b) adds a non-physical element, making the harmony more than musical in that context. Still, for astronomy, it's the geometry that matters.

