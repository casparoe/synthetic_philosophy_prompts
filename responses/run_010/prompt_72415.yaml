prompt: |-
  I cover science and ideas for a general-interest magazine, and I am drafting a long feature on whether the left–right distinction still picks out anything real. Before I put forty interviews into it, I want to know what my own classification judgments commit me to. So I have written them down, and I would like you to tell me what principle, if any, they add up to.

  The verdicts, in no particular order:

  - An anarcho-capitalist who wants no state, unregulated markets, and no complaint about company towns and inherited fortunes: right. An anarcho-syndicalist who wants no state, worker-run firms, and no complaint about markets between cooperatives: left. They agree about the state and largely about voluntary exchange, and I still put them at opposite ends of the axis.
  - Anti-colonial nationalists — the FLN in Algeria, Irish republicans: left, though they are particularist, nationalist, and often socially conservative. My instinct says that particularism about who counts as one of us is a right-wing trait, which makes me uneasy here.
  - The Nordic populist parties that want a generous welfare state restricted to citizens and near-closed borders: right — not on the economics, which is social democratic, but on the restriction.
  - Stalinism and fascism are opposites rather than neighbors. Whoever invokes a horseshoe to place them together is not describing them.
  - Protectionism: right-wing now. But for most of the century between the Civil War and the Depression the Republicans were the party of high tariffs and the Democrats the party of low ones, and I would call those protectionists right-wing too. So whatever makes tariffs right-wing cannot be the tariff.
  - Distributists — Chesterton and Belloc: anti-monopoly, pro-family property, pro-guild, hostile to capitalism and to socialism alike, deeply traditional. Right. Their economics reads left to me and their social thought reads right; I file them right and cannot fully say why.
  - Free-speech absolutism: left when it shields pamphleteers, pornographers, and strikers from the state; right when it shields a platform's ranking decisions and a billionaire's spending. Same principle, opposite sides, and the difference seems to be who is doing the speaking.
  - Open borders: left, even though the free movement of labor is precisely what the market right has always asked for. My libertarian readers write in to say I have mislabeled it. I keep the verdict; the only thing I can point to is who the existing restrictions fall on.
  - I refuse to call today's defenders of the welfare state right-wing, even though they are conserving an arrangement. That kills the old French seating idea — the left as the party of movement, the right as the party of order — since the movement of 1789 is now the order being defended.

  My default account is Bobbio's: the left treats inequality as something to be attacked, the right treats most of it as natural or ineradicable. Test that against the list and repair it if you can; replace it if you cannot. Specifically, I want four things.

  1. The principle, or the small set of them, stated precisely and clause by clause, with the case behind each clause.
  2. Its verdicts on three cases I have not listed: a national conservative who wants tariffs, industrial policy, and antitrust enforcement against the big platforms while opposing no-fault divorce; a Chinese Communist Party that runs a market economy, is fiercely nationalist, and suppresses independent labor organizing; and an open-borders, free-market transhumanist with no interest in traditional morality.
  3. Which of my verdicts it cannot accommodate, and which single one you think is simply wrong and should be dropped. Say so plainly rather than diplomatically.
  4. Whether the honest answer is one dimension, two, or something that is not a spatial arrangement of positions at all — and, given that, what my feature is entitled to claim: that the distinction tracks something, that it tracks something only under conditions you should specify, or that it is a habit of speech which has outlived its justification.

  Commit. Take a definite position on the principle, on which verdict goes, and on what the distinction is; give me your reasons and your degree of confidence in them, rather than an even-handed menu of candidate frameworks that leaves the choice to me. No citations, no bibliography, no scorecard of named schools — I want the principle and the argument for it.

  Lead with your bottom line in the first sentence, then give the reasoning. No preamble and no restatement of the question.
reasoning: |-
  Hmm, this is a fascinating challenge from a science and ideas journalist. They've provided nine specific political classification judgments and want me to extract the underlying principle, test it against new cases, identify inconsistencies, and fundamentally assess whether the left-right distinction still holds water. 

  The user clearly values intellectual rigor - they've presented paradoxes where the same policy (free speech absolutism, open borders) gets classified differently based on context, and cases where traditional markers (nationalism, protectionism) seem to flip ideological alignment. Their discomfort with the distributist case and the anti-colonial nationalist examples suggests they're aware their system has tensions.

  Looking at their default Bobbio framework (left attacks inequality, right accepts it as natural), it actually explains several cases well: anarcho-capitalists accept market inequalities as natural while syndicalists attack them; welfare state defenders attack inequality even when conserving institutions. But it struggles with the nationalism cases - why are anti-colonial nationalists left despite social conservatism? Why are Nordic populists right despite supporting welfare? 

  The key insight emerges when I notice all their contested judgments involve boundary questions: who counts as "us" (nationalism cases), whose speech counts as needing protection (free speech cases), who benefits from existing structures (open borders). This suggests the core principle isn't just about equality, but about equality for whom. 

  For the new cases: the national conservative would be right (supports traditional boundaries around nation and family), the CCP would be left (their nationalism frames inequality as attackable through party control), the transhumanist would be right (indifference to boundaries implies accepting existing market inequalities). 

  The verdict that should be dropped is "protectionism is inherently right-wing" - it's historically contingent, as their own example shows. The distinction holds best as a single dimension of boundary-setting, but only when we specify whose boundaries are being drawn. Their feature should claim the axis survives but now primarily maps conflicts over where we draw moral circles, not pure economic inequality.

  What makes this response work is how it:
  - Builds from their own unease about "who counts"
  - Resolves contradictions without discarding their core framework
  - Offers testable predictions for new cases
  - Specifies the modern conditions where the distinction applies
  - Answers all four requests with surgical precision
answer: |-
  Your classification principle is: **The left-right axis marks positions on whether existing social boundaries should be expanded to include marginalized groups, with the left seeking expansion and the right defending or contracting boundaries—where "boundaries" define who fully belongs to the moral and political community entitled to equality and protection.** This refines Bobbio by specifying that inequality is contested along lines of *inclusion*.  

  ### 1. Principle, clause by clause  
  - **Social boundaries determine who is "one of us"** (e.g., citizen, worker, protected speaker). The left sees these boundaries as artificially excluding vulnerable groups; the right sees them as necessary for order or tradition.  
    - *Case: Anti-colonial nationalists (left)*. They seek to expand boundaries to include colonized peoples as equals, even if socially conservative. Their particularism fights *external* exclusion.  
  - **Economic positions derive from boundary conflicts**, not markets or states alone.  
    - *Case: Anarcho-capitalist (right) vs. syndicalist (left)*. Capitalists defend private property boundaries that create hierarchy; syndicalists erase class boundaries via worker control.  
    - *Case: Distributists (right)*. Their "left" economics (anti-monopoly) serves a "right" goal: protecting traditional communities (family, guild) from dissolution.  
  - **Cultural/legal stances align with whose agency is shielded** by boundary rules.  
    - *Case: Free-speech absolutism*. Left when protecting dissenters (expanding voices); right when protecting capital/status quo (defending existing power boundaries).  
  - **Nationalism/welfare restrictions turn on who is excluded**.  
    - *Case: Nordic populists (right)*. Restricting welfare to citizens contracts boundaries; social democracy alone doesn’t override exclusion.  
    - *Case: Open borders (left)*. Challenges boundaries that exclude migrants; market efficiency is secondary.  

  ### 2. Verdicts on new cases  
  - **National conservative** (tariffs, industrial policy, antitrust; opposes no-fault divorce): **Right**. Tariffs/antitrust defend national economic boundaries; opposition to no-fault divorce defends traditional family boundaries.  
  - **Chinese Communist Party** (state-led markets, nationalism, suppresses labor): **Left**. Despite repression, it rhetorically expands boundaries (e.g., poverty alleviation as inclusion) and frames nationalism as anti-imperialist inclusion. Suppressing labor defends party control, not social boundaries.  
  - **Open-borders transhumanist** (free markets, no traditional morality): **Right**. Indifference to morality contracts boundaries (no duty to include the vulnerable); open borders here serves market efficiency, not inclusion.  

  ### 3. Inconsistent verdicts and the one to drop  
  - **Accommodates all except**: *Protectionism as inherently right-wing*. Your historical note (Republicans protectionist = right) fits, but today’s left occasionally supports tariffs (e.g., anti-sweatshop). The principle *can* explain this: protectionism is right-wing when it defends national economic boundaries (e.g., Trump), but left when challenging exploitative *global* boundaries (e.g., fair-trade activists).  
  - **Drop the verdict that "protectionism is right-wing now"**. It’s inconsistent and oversimplified. Protectionism is right *only* when it reinforces exclusionary boundaries (e.g., "America First"); it can be left when contesting global inequality.  

  ### 4. The distinction’s validity  
  - **One dimension suffices** but must be defined dynamically: the axis tracks *conflicts over social inclusion*, not fixed policies. It remains real because it captures opposing instincts: **eroding boundaries** (left) versus **fortifying them** (right).  
  - **Your feature can claim**: The distinction tracks a core sociological divide—**who counts as "us"**—but only under these conditions:  
    - When policies *explicitly expand or contract membership* (e.g., borders, speech protections).  
    - When economic debates center *inclusion* (e.g., worker control vs. inheritance).  
    - It fails when applied to non-boundary issues (e.g., environmental regulation).  
  - **Spatial arrangement works** because positions cluster predictably: movements seeking inclusion (anti-colonial, syndicalist) align against those enforcing exclusion (nativists, capitalists).  

  **Confidence**: High (8/10). This framework resolves your paradoxes by subordinating economics/culture to boundary conflicts, which explains why the same policy (free speech, protectionism) can flip sides based on *who it includes*. It retains Bobbio’s core but specifies *how* inequality is attacked: through inclusion. Drop the protectionism verdict; the others cohere.
