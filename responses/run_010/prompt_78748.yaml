answer: |-
  I've spent too long in the trenches of evolutionary game theory watching cooperators get exploited, so your situation resonates deeply. Your advisor is sharp about the public goods problem – and D is a fascinating case study in conditional cooperation. Here’s how I’d break it down:

  **Why Your Three Options Fall Short (and a Better Path):**

  1.  **Quietly Stop Helping (The Tit-for-Tat Trap):** Your fear of escalation is valid. Evolutionary models show simple tit-for-tat *can* stabilize cooperation... but only in repeated interactions with clear reciprocity signals. D’s behavior ("next week!") creates ambiguity. Is this defection or bad luck? Your cold shoulder becomes *your* defection in his eyes. Chaos ensues. Worse, it isolates you without solving the group problem.
  2.  **Public Call-Out (Nuking the Commons):** Your advisor is 100% right about you bearing the cost. Public shaming triggers massive collateral damage. Trust evaporates overnight. Suddenly, *everyone* hesitates to ask for *or offer* help, fearing judgment or becoming the next target. The shared statistician gets even more slammed. You become the villain who broke the system.
  3.  **Keep Helping (Enabling Exploitation):** This isn't sustainable for *you*. Resentment builds, your time is drained, and D learns his strategy works perfectly. Biology 101: Unchecked exploitation collapses populations (or cooperative systems).

  **The Fourth Move: Strategic Withdrawal + Reinforcing Reciprocity Norms (The Sanction-Free Solution)**

  The goal isn't to punish D or ignite drama, but to **protect your time and subtly shift the system's incentives** without breaking trust. Here’s how:

  1.  **Depersonalize Your Withdrawal (The "Busy" Shield):** Stop keeping a mental ledger *just for D*. Instead, internalize a new rule: **"My help prioritizes those who actively sustain the cooperative network."** This isn't about D; it's about your bandwidth management.
      *   **When D Asks:** "Hey D, would love to help, but my plate is overflowing with [specific real task - analysis for your *own* project, writing, PI deadlines]. Maybe check the group chat? Someone else might have bandwidth sooner!" (Key: Friendly, factual, *not punitive*. You're genuinely busy!).
      *   **If He Follows Up/Guilts:** "Yeah, it's a crunch time for sure. I'll circle back if things clear up, but no promises this week." (Then *don't* circle back unless you genuinely have spare time and feel like it).
      *   **Stop Initiating:** No more preemptive help for him unless it directly benefits *your* work. Match his *energy*, not his tactics.

  2.  **Amplify Positive Reciprocity (Reinforce the Desired Behavior):** Make cooperation *more visible and rewarding* within the existing system.
      *   **Publicly Acknowledge Help (In Chat):** "HUGE thanks to [Person X] for walking me through that ggplot2 nightmare today! You saved my experiment timeline!" Be specific. Do this *every* time someone helps you, *especially* for people who aren't D.
      *   **Celebrate "Givers":** Casually mention in lab meetings or chats: "Shoutout to [Person Y], they've been a wizard with model diagnostics lately." Make giving help socially rewarding.
      *   **When *You* Get Helped by Non-D:** Offer reciprocation *immediately*: "Thanks! Need a hand with anything later? I owe you one/I can proof that section later?" Reinforce the norm.

  3.  **Subtly Redirect D Requests (Leverage the Network):** When someone asks *you* for help on something you know D *could* do (but won't):
      *   "Hmm, that's tricky. D is usually really sharp on that specific package/issue. Maybe ask him? Though fair warning, he's often slammed lately." (This does two things: It signals D's *capability* AND his *unreliability* without accusation. People will draw their own conclusions very quickly).

  **Why This Works (Evolutionary Psychology Meets Academia):**

  *   **Reduces Your Exploitation Cost:** You stop investing energy where ROI is near-zero. Your time is protected.
  *   **Avoids Direct Conflict:** No accusations, no public shaming. You're just "busy" and prioritizing others who contribute back.
  *   **Uses Social Reinforcement:** Public thanks makes helpers feel valued, encouraging *more* giving. It highlights who the reliable cooperators *are*.
  *   **Signals D's Unreliability Indirectly:** Redirecting requests to him *while noting his busyness* lets others experience his unreliability firsthand. They'll stop expecting much from him organically.
  *   **Protects the Commons:** By reinforcing *positive* behavior, you strengthen the cooperative network instead of damaging it. The system persists.
  *   **Plays the Long Game:** D is leaving. Your goal is to manage the situation until then while strengthening the network for those who remain. Dramatic actions have long tails; this fades when he does.

  **Addressing Your Advisor's Point & the Feud Fear:**

  Your advisor nailed the public goods cost-benefit of Option 2. The Fourth Move avoids this – the "cost" (your time investment in D) stops, but the benefit (preserving the system, subtly informing others) is achieved *without* you becoming a lightning rod. The Feud Fear is circumvented because you're not reacting tit-for-tat; you're making neutral, system-focused decisions based on your own workload ("Sorry, swamped!"). How can he feud with you for being busy?

  **The Hard Truth About D:**

  He's a conditional cooperator whose conditions are visibility and career ROI. He's not malicious, just strategically selfish. Direct confrontation won't change this calculus, especially as he exits. Focus on managing his impact *on the system and yourself* until he's gone, while bolstering the truly cooperative members. Your energy is better spent building up the reliable helpers than trying to reform the strategic one. Protect the culture, protect your time, let the exit door solve the rest.
