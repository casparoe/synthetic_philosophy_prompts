  ### Brainstorming
  I considered four scenarios, rejecting three. **Candidate 1:** Agent plans salad for lunch but chooses pizza when tired. *Rejected*: Violates Vignette I condition 2 (likely akratic judgment). **Candidate 2:** Agent commits to saving but spends on an impulse buy, citing "emergency." *Rejected*: Fails Vignette I condition 4 (likely distress). **Candidate 3:** Agent prefers a distant larger reward but switches to an immediate smaller one, mispredicting future fatigue. *Rejected*: Satisfies Vignette I but lacks matched domain for Vignette II. **Candidate 4:** Agent skips a planned run for a massage, judging the run better. *Rejected*: Fails Vignette II condition 2 (discounting would favor massage).  
  **Selected:** Health data management for both vignettes—realistic, matched domain.

  ---

  ### Vignette I: Reversal without Incontinence (180 words)  
  Sam, a health-data analyst, logs dietary choices in an app. On Monday, she sets two tasks: log Tuesday’s dinner immediately after eating (earns 50 points) or log it Wednesday morning (earns 75 points). She prefers Wednesday—more points for similar effort. Tuesday night, after dinner, the app prompts her. She thinks: “Logging tomorrow is smarter—I’ll have fresh recall.” She closes the app, feeling assured. Wednesday morning, she forgets to log and loses the points. Later, she tells her partner: “I truly thought delaying was better. I’ve done it before without issue.” She felt no conflict Tuesday night. The loss stems from overconfidence in her memory, not poor willpower.

  ---

  ### Vignette II: Incontinence without Reversal (170 words)  
  Sam reviews her health app on Thursday. A notification offers: log a week’s exercise now (30 minutes, 100 points) or delay logging until Friday (same effort, 100 points). She judges logging now better—it aligns with her goal of timely data entry. But she spots a new feature: a one-click “estimate” that guesses exercise stats in 5 seconds (50 points). She chooses the estimate, muttering: “This is lazy.” She feels guilty immediately. She could have logged properly (her schedule was clear). The estimate’s points are lower, and its inaccuracy undermines her dataset. Her discount function, even with present bias, favors logging now: the same 100 points are available immediately in both options, but proper logging has higher utility.

  ---

  ### Audit  

  #### **Davidson’s Conditions**  
  *Vignette I (Tuesday choice):*  
  1. *All-things-considered judgment?* **Defeated.** She judges delaying is best (“smarter”). Detail: “She thinks: ‘Logging tomorrow is smarter...’”  
  2. *Intentional action?* **Satisfied.** She intentionally delays. Detail: “She closes the app.”  
  3. *Free to do otherwise?* **Satisfied.** She could log now. Detail: App prompt implies immediate option.  

  *Vignette II (Thursday choice):*  
  1. *All-things-considered judgment?* **Satisfied.** She judges proper logging better. Detail: “She judges logging now better.”  
  2. *Intentional action?* **Satisfied.** She chooses the estimate. Detail: “She chooses the estimate.”  
  3. *Free to do otherwise?* **Satisfied.** She could log properly. Detail: “Her schedule was clear.”  

  #### **Formal Work**  
  *Vignette I:*  
  - *Sunday choice:* Delay (log Wed, 75 points) vs. Immediate (log Tue, 50 points).  
    Quasi-hyperbolic (QH) utility at t=Sun:  
    - Immediate: \( U_{\text{Tue}} = 50 \)  
    - Delay: \( U_{\text{Wed}} = \beta \delta \times 75 \)  
    Set \( \delta = 1 \), \( \beta = 0.7 \): \( U_{\text{Wed}} = 0.7 \times 75 = 52.5 > 50 \) → Chooses delay.  
  - *Tuesday choice:* Same options, now framed as “now” (log Tue) vs. “tomorrow” (log Wed).  
    QH utility at t=Tue:  
    - Now: \( U_{\text{Tue}} = 50 \)  
    - Delay: \( U_{\text{Wed}} = \beta \delta \times 75 = 0.7 \times 75 = 52.5 \)  
    But she reverses: chooses immediate (50 < 52.5). *Reversal parameterized:* Set \( \beta = 0.6 \): \( U_{\text{Wed}} = 0.6 \times 75 = 45 < 50 \) → Chooses immediate.  

  *Vignette II:*  
  - Prospects at choice moment:  
    - A: Log properly now (effort: 30 min, reward: 100 points now).  
    - B: Estimate now (effort: 5 sec, reward: 50 points now).  
  - *Exponential discounting:* Rewards immediate, so \( U_A = 100 \), \( U_B = 50 \). Always \( U_A > U_B \).  
  - *QH discounting:* No delay, so \( U_A = 100 \), \( U_B = 50 \). Always \( U_A > U_B \) (even with \( \beta < 1 \)).  
    *Demonstration:* \( U_A = 100 \) (no discount), \( U_B = 50 \) (no discount). 100 > 50.  

  #### **Single Feature and Counterfactual**  
  - *Vignette I:* **Present bias** (β < 1) enables preference reversal. *Counterfactual:* If β = 1 (no bias), Sam chooses delay on Tuesday (52.5 > 50), so no reversal.  
  - *Vignette II:* **Salience shift**—estimate’s ease distracts from judgment. *Counterfactual:* If estimate required equal effort (e.g., 30 min), she would log properly (no salient distraction).  

  #### **Attacks**  
  1. *Discounting theorist against Vignette II:* “State-dependent utility rescues the model! At choice, the estimate’s utility spikes due to its salience.”  
     - *Response:* Rescuing via state-dependent utility empties the model. It relocates explanation to *why* salience shifts utility, making discounting parasitic on attention mechanisms. The work shifts to cognitive psychology, leaving discounting as mere notation.  

  2. *Philosopher against Vignette I:* “Her Monday policy (‘delay is best’) is a standing all-things-considered judgment. Acting against it is akrasia.”  
     - *Objection fails.* Davidson requires contemporaneous judgment. A prior policy isn’t a current evaluation; she *revised* her judgment Tuesday. Cost: If prior policies count, akrasia is overextended (e.g., all procrastination becomes weakness of will).  

  #### **Closing Note**  
  - *Stipulations:* Vignette I stipulates β < 1 without explaining why (realism trade-off). Vignette II stipulates salience shift without neural details.  
  - *Counterexample status:* Vignette II is a genuine counterexample to discounting *if* utility is fixed. If utility is state-varying, discounting’s domain expands but loses predictive content. It highlights discounting’s blindness to framing.
