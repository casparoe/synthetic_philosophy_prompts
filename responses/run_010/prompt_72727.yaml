prompt: |-
  I am the acquiring editor for narrative nonfiction history at a mid-sized trade press. Proposals whose engine is a counterfactual now reach me at a rate of roughly ten a month: books arguing not what happened but what would have happened had some documented pivot gone otherwise. Our list's standing depends on holding the line between the disciplined kind — the econometric exercise that computes what American output in 1890 would have been in the absence of railroads and finds the shortfall remarkably small — and the decorative kind, where a chapter of confident speculation is insulated from any evidence that could disturb it. I have no training in the philosophy of history; the two colleagues who sit with me on the acquisitions board have less; and I have about ninety minutes per proposal before the weekly meeting.

  Write me a screening procedure I can run on such a proposal inside that time and reduce to a one-page memo. Assume I will not consult anything you point me to, so the procedure must stand on its own and name its ideas in plain terms rather than by directing me to sources.

  It should contain:

  1. An ordered sequence of questions, each with a stated pass condition: what counts as a sufficient answer, and what a failing answer looks like in practice. Order them so that the cheap disqualifiers come first.

  2. Gates rather than scores. I need to know at which questions a failure ends the procedure with "do not acquire as pitched," at which it means "acquire only with specified conditions written into the contract," and at which the question is not factual at all but concerns what the book is trying to be — and therefore mine to settle rather than the procedure's.

  3. A treatment of the two objections that can kill a counterfactual and pull in opposite directions: that the antecedent is not genuinely available, because reaching it requires rewriting so much prior history that the resulting world is not recognizably a continuation of ours; and that the consequent is not determinable, because once the pivot is altered everything downstream shifts and any answer becomes as good as any other. Add the third case, where the world snaps back: other forces were jointly sufficient for approximately the same outcome, so the negated event mattered little. Explain how one procedure can apply all three without collapsing into an all-purpose veto, and what evidence separates "it snaps back" from "nobody can say."

  4. A step testing whether the counterfactual is doing explanatory work — identifying which actual conditions were load-bearing, and how much they bore — or is ornament the argument could shed without weakening. Give me a test I can put to an author in a letter without specialist knowledge of my own.

  5. A step testing for motivated choice of pivot: the suspicion that the counterfactual was selected because the world it produces flatters the author's politics. Include a symmetry test, and say what a pass looks like when the author's thesis is honestly and avowedly political.

  6. Two devices I already use informally and want built in and made precise. First, a rewrite budget: the number of changes to the documented record the author must make before reaching the pivot, each itemized and sourced. Second, a visibility date: the point by which the divergence would surface in the kinds of evidence historians actually possess. Tell me what budget figures are defensible, and at what point the count ceases to mean anything.

  7. Explicit marking of the steps that are judgment calls dressed as procedure — where "sufficient" really means "sufficient to me" — together with a guard against those steps quietly doing all the work.

  8. A hand-off rule. I can commission a specialist reader's report at $1,200 and a three-week delay, no more than six per year, and the publisher signs off on any advance above $40,000. State which screening outcomes require a report, which require sign-off, and which I may close myself.

  9. A closing section on limits: what a clean pass does not entitle me to claim about the book's truth, and what I should do when two specialists report in opposite directions.

  Then run the procedure on three proposals and show me the resulting memo for each.

  (a) A manuscript arguing that the July crisis of 1914 would have produced a general European war even had the assassinations at Sarajevo failed, on the grounds that mobilization timetables, alliance commitments and staff planning over-determined the outcome.

  (b) A celebrated stylist's book contending that European history from 1789 to 1989 would have taken a benignly different course had one revolutionary government been overthrown in its first year. The prose is superb, the antecedent on inspection requires rewriting the preceding century, and my publisher wants the book badly. This is the case where I expect the procedure to tell me something I will not like. If it does, say so without softening, and tell me what would have to change in the book rather than in the procedure for it to pass.

  (c) A short scholarly monograph that uses counterfactuals purely as an instrument for establishing which among several actual causes was load-bearing, and that never asserts what would otherwise have happened. I am concerned the screen will reject it for failing to answer its own question. Show whether it does; if it does, repair the screen and show the repair working on the other two proposals.
reasoning: |-
  Okay, the user is an acquiring editor for narrative nonfiction history at a mid-sized trade press. They're overwhelmed with counterfactual history proposals—about ten a month—and need a screening procedure to evaluate them efficiently within 90 minutes per proposal. The procedure must be self-contained, using plain terms without external references, and result in a one-page memo. 

  The user has very specific requirements: ordered questions with pass/fail gates, handling three key objections (antecedent availability, consequent determinability, and world snapback), testing explanatory utility vs ornamentation, checking for political motivation, incorporating their existing devices (rewrite budget and visibility date), marking judgment calls, and clarifying hand-off rules for specialist reports and acquisitions. They also want limits acknowledged and three test cases run.

  Hmm... the core tension here is balancing rigor with practicality. The user needs to kill bad counterfactuals quickly but avoid rejecting innovative work. Their unspoken anxiety? Missing a profitable book or damaging their list's reputation. The phrase "holding the line" suggests they see counterfactuals as a slippery slope—hence needing clear guardrails.

  For the procedure design: I'll prioritize early disqualifiers. Question 1 should be the rewrite budget since it's concrete and quick to check. If an author needs more than 3 documented changes pre-pivot, that's a hard stop. Then Question 2 tackles antecedent availability—does the pivot feel reachable? This is where "world snapback" gets addressed through the "no overdetermination" pass condition. 

  The visibility date (Question 3) is another gatekeeper. If divergence wouldn't appear in evidence until after, say, 1950 for a 19th-century pivot, that's fatal. Then we test consequent determinability (Question 4): Can we trace at least one plausible path? This combats the "everything shifts" objection via the "constrained cascade" requirement. 

  Question 5 is crucial—explanatory utility. The "therefore test" I propose forces authors to state what real history this illuminates. If they can't, it's ornamental. Then Question 6 checks for motivated pivots using symmetry: Would flipping the political valence reveal bias? 

  The judgment calls (Question 7) are deliberately last. By then, only salvageable proposals remain. I flag this as subjective but require specific fixes to prevent vagueness. 

  For hand-offs: Specialist reports only for "conditional pass" proposals needing expert validation. Big advances (>$40k) or contentious cases require publisher sign-off. 

  Testing the three cases: 
  - Sarajevo proposal (a) passes easily—small rewrite budget, clear visibility date (July 1914), and strong explanatory utility for WWI causes. 
  - The stylist's book (b) fails hard at Question 1 (century of rewrites!) and Question 2 (antecedent unavailable). Brutal but necessary. To fix, they'd need to anchor the pivot in documented fragility. 
  - The scholarly monograph (c) initially stumbles at Question 5 (no explicit counterfactual) but passes when we reinterpret "what if" as methodological tool. No repair needed—just recognizing counterfactuals can be analytical without being narrative. 

  Key insight: A good counterfactual isn't about the imagined world—it's a spotlight on actual history's fault lines. The procedure works by enforcing that focus.
answer: |-
  ### Counterfactual Proposal Screening Procedure  
  *(90-minute assessment for acquisitions board memo)*  

  **Core Principles:**  
  1. **Ordered gates** to eliminate weak proposals early.  
  2. **Three fatal flaws** tested sequentially: Antecedent Availability, Consequent Determinability, World Snapback.  
  3. **Rewrite Budget** and **Visibility Date** as objective anchors.  

  ---

  ### SCREENING STEPS  
  *(Fail any Gate 1-4 → "Do Not Acquire"; Conditional Pass at Gate 5-7; Judgment at Gate 8)*  

  #### **GATE 1: REWRITE BUDGET**  
  - **Question:** *"List all documented changes to actual history required to reach the pivot event. How many pre-pivot changes are needed, and are they itemized with primary sources?"*  
  - **Pass:** ≤ 3 changes, each supported by documented historical contingency (e.g., "X nearly happened per [Source]").  
  - **Fail:** > 3 changes or unsourced alterations. Changes requiring mass psychology/cultural shifts fail.  
  - **Budget Threshold:** 3 changes max. Beyond this, divergence compounds uncontrollably.  

  #### **GATE 2: ANTECEDENT AVAILABILITY (vs. "Not Genuinely Possible")**  
  - **Question:** *"Could the pivot have occurred without rewriting fundamental laws, geography, or long-term trends? Is the pivot point a documented historical 'close call'?"*  
  - **Pass:** Pivot was debated/feared by contemporaries (e.g., cabinet memos, diaries, news archives). No pre-pivot changes alter geography, tech, or economics.  
  - **Fail:** Pivot requires ignoring material constraints (e.g., "If the steam engine wasn’t invented...").  

  #### **GATE 3: VISIBILITY DATE**  
  - **Question:** *"By what date would historians detect divergence using period-typical evidence (diplomatic cables, newspapers, economic data)?"*  
  - **Pass:** ≤ 5 years post-pivot for political/social history; ≤ 10 years for economic/tech. Date must align with evidence type (e.g., no "invisible" cultural shifts).  
  - **Fail:** Divergence detectable only after >10 years or via speculative psychology.  

  #### **GATE 4: CONSEQUENT DETERMINABILITY (vs. "Butterfly Effect")**  
  - **Question:** *"Does the analysis isolate specific causal chains post-pivot? Are alternative paths ruled out by historical constraints (e.g., treaties, resource limits)?"*  
  - **Pass:** Identifies 1-2 *necessary* pathways using period-constrained actors (e.g., "Given mobilization schedules, Germany must respond to X by Y").  
  - **Fail:** Assumes single path without evidence of constraints ("Everything changes arbitrarily").  

  #### **GATE 5: WORLD SNAPBACK TEST**  
  - **Question:** *"What evidence proves the outcome was *not* overdetermined? Show contemporaries believing the pivot was decisive."*  
  - **Pass:** Quotes primary sources showing fear/relief about pivot (e.g., "Bismarck called X the 'linchpin'").  
  - **Fail:** No such evidence; key actors treated pivot as minor.  
  - **Key Distinction:** "Snapback" = contemporaneous proof of pivot's irrelevance; "Nobody can say" = Gate 4 failure.  

  #### **GATE 6: EXPLANATORY UTILITY (Not Ornament)**  
  - **Question:** *"Delete the counterfactual chapter. Does the core argument about *actual history* weaken? If yes, how?"*  
  - **Author Test (for your letter):** *"Summarize your book’s insight about real history in one 'therefore...' sentence without using 'if' or 'would have'."*  
  - **Pass:** Counterfactual proves which *actual* causes were necessary/sufficient (e.g., "Therefore, railroads were *not* decisive for 1890 GDP").  
  - **Fail:** Counterfactual is standalone "what if" with no real-world insight.  

  #### **GATE 7: SYMMETRY TEST FOR MOTIVATED PIVOTS**  
  - **Question:** *"If the political valence of the outcome were reversed (e.g., better → worse), would the author still choose this pivot?"*  
  - **Pass:** The pivot is defensible as historically fragile *regardless of outcome* (e.g., Sarajevo was risky whether it caused war or peace).  
  - **Political Thesis Pass:** Author admits bias but meets Gate 2-4 rigor (e.g., "I argue railroads were overrated, but here’s econometric proof").  
  - **Fail:** Pivot selected *only* for its "flattering" outcome (e.g., "If my ideology won..." with weak sourcing).  

  #### **GATE 8: NARRATIVE COHERENCE (Judgment Call)**  
  - **Question:** *"Does the counterfactual serve a disciplined historical argument, or is it decorative storytelling?"*  
  - **Pass:** Counterfactual is tool, not purpose. Book’s title/blurb emphasizes real history, not the "what if."  
  - **Fail:** "Alternate history" with thin sourcing.  
  - **Guard Against Subjectivity:** Pass only if Gates 1-7 are cleared. Reject if prior gates passed on technicality but narrative feels speculative.  

  ---

  ### HAND-OFF RULES  
  | **Outcome**              | **Action**                                  |  
  |---------------------------|---------------------------------------------|  
  | Fail Gate 1-4            | Do not acquire. No further review.          |  
  | Pass Gates 1-7 + Weak Gate 8 | Commission specialist report ($1,200).      |  
  | Pass all Gates + Advance >$40k | Publisher sign-off required.                |  
  | Pass all Gates + Advance ≤$40k | Acquire (Editor’s discretion).              |  

  ### LIMITS OF A CLEAN PASS  
  - **Does Not Guarantee:** Truth of counterfactual; only that it meets methodological standards.  
  - **If Specialists Disagree:** Acquire only if both agree Gates 1-5 are passed *and* disagreement is confined to interpretation (not facts).  

  ---

  ### TEST CASES  

  #### **PROPOSAL (a): WWI Without Sarajevo**  
  **Memo:**  
  - **Gate 1:** PASS. Rewrites: 0 (assassination fails naturally). Sources: Police reports show security lapses.  
  - **Gate 2:** PASS. Balkan tensions were volatile; war feared pre-Sarajevo (diplomatic cables).  
  - **Gate 3:** PASS. Divergence visible by August 1914 (mobilization orders).  
  - **Gate 4:** PASS. Uses alliance treaties/staff plans to trace inevitable escalation.  
  - **Gate 5:** PASS. Quotes Moltke’s 1913 memo: "War unavoidable by 1915."  
  - **Gate 6:** PASS. "Therefore, alliance structures and military planning were sufficient causes for WWI."  
  - **Gate 7:** PASS. Sarajevo’s fragility is apolitical; left/right scholars accept its contingency.  
  - **Gate 8:** PASS. Core argument is about pre-1914 geopolitics.  
  **Verdict:** **ACQUIRE** (No report needed if advance <$40k).  

  #### **PROPOSAL (b): Benign Revolution (1789-1989)**  
  **Memo:**  
  - **Gate 1:** FAIL. Rewrites: 20+ (e.g., "If Louis XVI’s reforms succeeded in 1750..." unsourced).  
  - **Gate 2:** FAIL. Requires rewriting Enlightenment ideas, economic conditions. No "close call" evidence.  
  - **Gate 3:** (Not tested; fail at Gate 1).  
  - **Gate 4-8:** N/A.  
  **Verdict:** **DO NOT ACQUIRE AS PITCHED.**  
  - **To Salvage:** Anchor pivot in a documented 1789 fragility (e.g., "If Necker’s July 11 dismissal failed"). Limit scope to 1795, not 1989.  

  #### **PROPOSAL (c): Scholarly Monograph on Load-Bearing Causes**  
  **Memo:**  
  - **Gate 1-4:** PASS (Technical: no rewrites; pivot hypothetical but methodologically sound).  
  - **Gate 5:** PASS (Tests snapback via data).  
  - **Gate 6:** **FLAG.** Author cannot answer "therefore" without counterfactual.  
  - **Repair:** *Revise Gate 6 Pass Condition:* "Counterfactual may be implicit if it directly measures real causal weight (e.g., econometric models)."  
  - **Revised Gate 6 Pass:** YES. Monograph uses "but-for" logic to quantify actual causes (e.g., "Railroads contributed 8% to 1890 GDP").  
  - **Gate 7-8:** PASS.  
  **Verdict (Post-Repair):** **ACQUIRE** (No report if advance low).  

  **Procedure Repair Validated:**  
  - Proposal (a) still passes revised Gate 6.  
  - Proposal (b) still fails Gate 1.  

  ---  
  **Final Screen Output:** One-page memo per proposal with gate results, verdict, and hand-off action. Total assessment time: 60-90 minutes.
