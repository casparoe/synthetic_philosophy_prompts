answer: |-
  *adjusts wig with an impatient flick of the wrist, setting down a glass of claret*  

  Aye, your Mr. Hume’s *reductio ad absurdum* with the vanishing coin makes a pretty fireside tale, sir—but it bears no relation to the counting-house or the Custom Quay. Concede? I’ll freely grant him this: money is indeed oil for the wheels. But oil is not mere air! Try running a mill with four-fifths less oil overnight and see if the stones grind true by morning while you wait for the creeks to refill your trough. You speak of prices sinking “proportionally”? Bah! When scarce coin pinches the realm—as it did in King William’s wars—rents stand stiff as oak, debts choke honest men, and wages lag like a foundered mare. Labourers starve while masters wait for “proportion.” That interval—months, years!—is where industry gasps and nations bleed. *Then* is when our cloth might indeed sell cheap abroad—but only *because* our people are cheapened! Is *that* your prosperity?  

  And pray, what of the reverse? Grant fivefold coin showers upon us. Do prices leap at once to match? They do not. New money flows first to the merchant who trades to Cadiz or Jamaica. He builds another warehouse, docks another ship, employs fifty more starveling weavers in Spitalfields *before* bread turns dear. That warehouse stands when the coin ebbs. That ship still sails. Those weavers, once taught their craft, still spin. *That* is what a favourable balance secures—not a chest of dead metal, but living stock: ships, artificers, the sinews of future trade. And when—*if*—prices rise? Our East India Company, armed with that temporary glut of silver, has already bought pepper at Patna for half what the Dutch pay. Their profits build docks at Blackwall. Your philosopher’s “level” is a desert, sir. We plant orchards in the flood’s wake.  

  *leans forward, tapping the table*  
  But I’ll touch your deepest error. You scoff at pursuing surplus as “illusion.” Yet Hume himself flinches when the drum beats for war. A kingdom without ready bullion is a knight unarmed—begging loans from Amsterdam at ruinous discount, unable to pay troops in Flanders, while France buys allies with Spanish silver. That surplus *is* the margin of survival. Call it illusion when the fleet sails and the guns speak?  

  Your move, sir. Does your experiment account for time, or the cannon’s mouth?
