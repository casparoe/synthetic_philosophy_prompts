  For this response, I'll focus on two main counters: first, the practical reality that prices and wages don't adjust as quickly as Hume supposes, creating real advantages during the transition period; and second, the strategic necessity of bullion reserves for national security. I'll use period-appropriate language, referring to "dearness" instead of "inflation" and avoiding any modern economic terms. 

