prompt: |-
  I have been trying to settle what I actually think about precautionary reasoning, and I have got to the point where I can list my verdicts on particular cases but cannot state the principle that generates them. I would like help stating it, or being told that it cannot be stated.

  The principle I keep reaching for is this. Call it P: where an activity threatens a harm that is (a) serious, (b) not credibly quantifiable in advance, and (c) not undoable by later action, the burden of proof shifts on to whoever proposes the activity, and unless they discharge it the activity should be restricted — whatever the restriction costs. I suspect P is too crude, because of what follows.

  My cases and verdicts:

  1. A water utility proposes replacing its disinfection regime with a cheaper one yielding a different set of by-products. The toxicology on the new profile is thin and would take a decade to firm up. Restrict until the evidence improves: yes.
  2. A hospital wants to deploy a triage tool that is measurably better than current clinical judgement on average, but whose errors are known to be unevenly distributed across patient groups in ways nobody has characterised. Deploy at scale: no. Run it in shadow mode for a year, making no decisions, purely to learn its error profile: yes — and I think refusing even that is imprudent.
  3. A novel systemic insecticide with plausible harm to pollinators that cannot be quantified for a decade, where the yield loss from refusing it is real and countable. Restrict: yes.
  4. New nuclear build. Long-lived waste is irreversible and the tail risks are, on any honest account, not credibly quantifiable — and yet I do not feel the burden shifting here in the way it does in 3. Permit: yes.
  5. Stratospheric aerosol injection. Refrain: yes. But I also do not think that staying on the current emissions path counts as taking the precaution, and I cannot find a way of saying both.
  6. A vaccine during an outbreak, with a plausible signal of a rare adverse event. Keep using it: yes. The deaths averted are countable and large, so here I insist that the harms of restraint be counted.
  7. A herbal preparation for which there is no evidence of harm whatever, and equally no quantified risk. I would not take it, and I would object to its being sold as though benign. Note that this is the same agent as in 6, the same exposure, and entirely self-regarding.
  8. An existing industrial solvent with weak evidence of harm stays on the market, while a chemically similar newcomer with equally weak evidence is refused. I endorse that asymmetry, and I know how much it resembles mere protection of incumbents.
  9. A ban on a novel drought-tolerant variety that pushes growers back into a more pesticide-intensive practice. The ban is imprudent and not itself precautionary, because the displaced risk exceeds the avoided one: yes, that is my view. Yet the same displacement argument is available in 3, and there it moves me not at all.
  10. A confined, self-limiting trial of a sterile-insect programme on one island: yes. An open-ended release across a continent using the same mechanism and by then a better evidence base: no.

  What I want back:

  - A principle, or a small set of competing candidates, stated precisely, with each clause tied to the case that forces it in. Please do not send me a reading list; I want the formulation and the argument for it.
  - An account of where P breaks. I expect at least 4, 5, 7, 8 and 9, but tell me which of those it can in fact absorb and at what cost.
  - The dilemma I cannot escape: a principle strong enough to deliver 1, 3 and 5 seems to forbid every novel activity and thereby to consecrate the status quo, while one weak enough to permit 4, 6 and 9 seems to collapse into "weigh all the evidence", which was never in dispute. Is there a formulation between those, or is one of my verdicts simply wrong?
  - Which concession is cheaper: abandoning 5, and so conceding that aerosol injection is the precautionary option; or abandoning 4, and so requiring of nuclear build the same evidential showing I demand of a novel insecticide. Recommend one and say why.
  - Whether the burden-shifting idea must be indexed to who is deciding — regulator, institution, individual. Cases 6 and 7 are what make me ask, since the only difference between them seems to be who bears the risk and who is counting. Is that one principle with a parameter, or two principles that I have been running together?
  - Verdicts on three cases I have not listed, so that I can see whether the principle is doing work or merely restating my prejudices: retail approval of a cultivated-meat product; a temporary moratorium on germline editing that keeps being renewed; and a school district adopting a contested new reading curriculum, where the harm is not physical but the years of a small cohort are not recoverable. That last one should tell me whether clause (c) is about the irreversibility of the harm or the irreversibility of the time.
  - Finally, a clause on information-gathering, if the principle needs one. Case 2 suggests that the option set is not simply act or restrain but includes learning-then-deciding, and that refusing to learn can itself be the imprudent choice. How do I give learning its weight without licensing indefinite delay on the grounds that more data would always be worth having?
reasoning: |-
  Okay, the user is grappling with the complexities of precautionary reasoning and needs help formulating a coherent principle that aligns with their specific case judgments. They've provided 10 detailed cases with their verdicts and highlighted key tensions, particularly between preventing harm and enabling progress. 

  First, I notice the user is clearly sophisticated in their understanding—they've identified precise pain points in existing frameworks (like burden-shifting rigidity) and even spot contradictions in their own stance (e.g., nuclear vs. insecticide). Their frustration with "status quo bias" versus "evidence-weighing collapse" suggests they want a Goldilocks principle: not too restrictive, not too permissive. 

  The core tension seems to be between irreversible systemic harm (cases 3,5) and reversible/quantifiable risks (cases 4,6). Their intuition treats "undone by later action" differently for nuclear waste (manageable containment) vs. pollinator collapse (irreversible ecosystem shift). This isn't captured by their initial Principle P, which is too binary. 

  For the herbal supplement case (7), their personal aversion despite low risk hints at an unstated "asymmetric default": absence of evidence isn't innocence when the harm is self-inflicted and avoidable. But for vaccines (6), societal stakes override that. So agency matters—who bears risk, who benefits. 

  Cases like 8 (incumbent chemicals) reveal they accept path dependence: legacy systems get grandfathered in because disruption itself causes harm. That's pragmatic but risks regulatory capture. Their principle needs to acknowledge this without endorsing it. 

  The shadow mode case (2) is key—they want learning embedded in the principle, not as delay but as active risk reduction. But how to avoid "analysis paralysis"? A clause linking information-gathering to decision-relevance and proportionality could work. 

  On nuclear (4) vs. aerosols (5): they intuitively distinguish containment (waste stays put) from uncontrollability (aerosols spread). So "irreversibility" might mean "uncontainable consequences," not just "lasting." That reframes clause (c). 

  For their unlisted cases: cultivated meat probably gets a "yes" (reversible, monitored), germline editing "no" (irreversible, uncertain), and the curriculum case... tricky. Lost time is irrecoverable, but is it "irreversible harm"? Only if outcomes are unmitigatable later. So clause (c) needs to specify irreversible deprivation of essential capacities. 

  Ultimately, their verdicts suggest two core filters: 
  1. Is the worst-case harm containable/scoped? (No for aerosols/insecticides, yes for nuclear) 
  2. Is restraint itself harmful? (Yes for vaccines/drought crops, no for herbal supplements) 

  The revised principle should make these explicit. I'll propose one that adds "containability" and "restraint cost," with learning as mandatory when uncertainty is reducible within the intervention window. 

  For concessions: abandoning nuclear precaution (4) is cheaper than embracing aerosols (5), because nuclear's risks are spatially bounded and have historical precedent, while aerosols are global and novel. But they might still dislike that tradeoff. 

  Agency indexing seems necessary—individuals can afford asymmetric caution (case 7) while societies can't (case 6). So the principle needs a "scale of impact" qualifier. 

  Final structure: 
  - Severity (systemic > localized) 
  - Uncertainty (unquantifiable tail risks) 
  - Irreversibility (uncontainable consequences) 
  - Restraint cost (including displaced risk) 
  - Scalability (test-learn-scale pathways) 
  - Agency (individual vs. collective stakes)
answer: |-
  Here's a synthesized principle derived from your verdicts, designed to resolve your tensions. I'll call it the **Asymmetric Containment Principle (ACP)**:

  > **ACP**: Restrict novel activities when *all* of the following apply:  
  > (i) **Severity**: Potential harm is *systemic* (threatening critical systems like health, ecosystems, or social stability);  
  > (ii) **Uncertainty**: The harm’s probability/distribution is *non-localizable* (cannot be bounded or confined to a specific population/area);  
  > (iii) **Irreversibility**: Harm is *functionally irreversible* (cannot be meaningfully contained, remediated, or compensated after manifestation);  
  > (iv) **Asymmetric Restraint Cost**: Restraint imposes *no net systemic harm* (or the harm of restraint is quantifiable and less severe than the worst-case unbounded harm).  
  >   
  > *Corollary for Learning*: If (i)-(iii) hold *partially*, mandate *targeted information-gathering* that reduces uncertainty without systemic risk. Refusing feasible learning violates precaution.

  ---

  ### **How ACP Explains Your Cases**
  | Case | ACP Verdict & Why |
  |------|-------------------|
  | **1. Water disinfection** | **Restrict**: Harm systemic (public health), uncertainty non-localizable (population-wide exposure), functionally irreversible (chronic disease). Restraint cost (financial) not systemic. |
  | **2. Triage tool** | **Shadow mode**: Potential harm systemic (group discrimination) but uncertainty is *localizable* via confined testing. Learning is feasible and low-risk → mandated. |
  | **3. Insecticide** | **Restrict**: Systemic (ecosystem collapse), non-localizable (pollinators mobile), irreversible (extinctions). Restraint cost (yield loss) is quantifiable and compensatable. |
  | **4. Nuclear power** | **Permit**: Harm *localizable* (containment structures, geographic isolation). Waste is *containable* (though long-lived). Uncertainty ≠ non-localizability. |
  | **5. Aerosol injection** | **Refrain**: Systemic (climate cascades), non-localizable (global dispersion), irreversible (ocean acidification, termination shock). Restraint cost (emissions path) is *not* a choice; ACP addresses *this intervention*. |
  | **6. Vaccine** | **Permit**: Harm is localizable (rare adverse events affect individuals, compensatable). Restraint causes *net systemic harm* (outbreak spread). |
  | **7. Herbal supplement** | **Restrict** (for self): *Individual* harm is avoidable (no restraint cost). Uncertainty isn’t systemic → but ACP allows *personal* precaution without imposing societal burden-shifting. |
  | **8. Incumbent solvent** | **Permit incumbent**: Restraint *causes* systemic harm (supply-chain disruption). Newcomer lacks offsetting benefit → restraint has lower cost. |
  | **9. Drought-tolerant crop** | **Permit**: Restraint causes *net systemic harm* (increased pesticide use). Harm avoided (GMO risk) is containable. |
  | **10. Insect trial** | **Island: Permit** (localized, reversible). **Continent: Restrict** (non-localizable, irreversible spread). |

  ---

  ### **Where Your Principle P Breaks**
  - **Case 4 (Nuclear)**: P fails because it ignores *containability*. Irreversible ≠ uncontainable.  
  - **Case 5 (Aerosols)**: P struggles because "restriction costs" are conflated with *inaction*. ACP decouples them.  
  - **Case 7 (Herbal)**: P’s burden-shifting is too broad; ACP indexes to *systemic* harm and *net restraint cost*.  
  - **Case 8 (Solvents)**: P can’t explain asymmetry; ACP uses *net systemic harm* of restraint.  
  - **Case 9 (Crops)**: P rejects displacement arguments; ACP weighs *net systemic harm*.

  ---

  ### **Resolving Your Dilemma**
  The dilemma (*"total restriction vs. evidence-weighing"*) is false. **ACP avoids both**:  
  - It *doesn’t* paralyze innovation: It permits when harms are localizable (nuclear), or restraint causes worse harm (vaccines, drought crops).  
  - It *isn’t* "weigh all evidence": It imposes asymmetric burdens *only* for systemic, non-localizable, irreversible threats (aerosols, novel insecticides).  
  - **Key**: "Non-localizable" prevents overreach. Nuclear waste is localizable; pollinator collapse is not.

  ---

  ### **Concession Recommendation: Abandon 5? No. Abandon 4? No. Reframe both.**
  - **Keep 5 (refrain from aerosols)**: ACP justifies it cleanly (global, uncontrollable, irreversible).  
  - **Keep 4 (permit nuclear)**: Containment makes it fundamentally different from Case 3.  
  - **Why**: Aerosols create *open-ended* global risk; nuclear’s risks are *bounded*. Sacrificing either verdict undermines coherence. ACP preserves both.

  ---

  ### **Burden-Shifting Indexing**
  It’s **one principle with two modes**:  
  - **Societal decisions** (Cases 1–6, 8–10): Burden shifts *only* for systemic/non-localizable/irreversible harms.  
  - **Individual decisions** (Case 7): Lower threshold. Individuals may shift burden for *any* irreversible/unquantifiable self-harm.  
  *Why?* Regulators must avoid systemic harm from restraint (e.g., vaccine delays); individuals need no such tradeoff.

  ---

  ### **Verdicts on New Cases (Testing ACP)**
  | Case | ACP Verdict | Reasoning |
  |------|-------------|-----------|
  | **Cultivated meat** | Approve with monitoring | Harm localizable (limited rollout), reversible (stop if issues). Restraint cost systemic (climate, food security). |
  | **Germline editing moratorium** | Renew if non-localizable risk | Functional irreversibility (inherited changes). If uncertainty is reducible *without* moratorium (e.g., embryos research), lift it. |
  | **Reading curriculum** | Permit, with pilot | Harm reversible (supplemental education later). Time lost is *recoverable* if core capacities aren’t permanently impaired → not "functionally irreversible." |

  **Clarifying irreversibility (c)**: It’s about *whether the harm itself* can be undone, not just time. Lost time matters only if it causes *irremediable deprivation* (e.g., critical brain development windows). Curriculum delays are compensatable.

  ---

  ### **Information-Gathering Clause**
  ACP’s **corollary** handles this:  
  - Learning is *mandatory* when:  
    (a) Uncertainty is reducible with confined action (Case 2: shadow mode);  
    (b) Delay doesn’t risk systemic harm;  
    (c) Learning directly informs the restriction decision.  
  - **Prevents indefinite delay**: If learning doesn’t meet (a)–(c), default to ACP’s core rule. Refusing feasible learning is imprudent precaution (Case 2).

  ---

  ### **Final Principle Refinement**
  The **Asymmetric Containment Principle (ACP)** with annotations:  
  > Restrict novel activities if:  
  > **(i) Systemic harm** (threatens critical systems);  
  > **(ii) Non-localizable uncertainty** (harm’s scope cannot be bounded);  
  > **(iii) Functional irreversibility** (harm cannot be contained/compensated);  
  > **(iv) Asymmetric restraint cost** (restraint imposes no net systemic harm).  
  >   
  > *Else, permit or mandate learning.*  
  >   
  > **Burden-shifting**: Triggered only if (i)–(iv) *all* apply → shifts to *proposer* to show harm is avoidable/localizable.  
  > **Scale sensitivity**: Stricter thresholds for individual vs. societal decisions.

  **Why it works**: It forbids only "uncontainable catastrophes," permits innovation with safeguards, and forces learning when prudent. It rejects both paralysis and recklessness.
