prompt: |-
  My brother-in-law keeps forwarding me links from this one magazine he's obsessed with, and last week's was a column arguing that the whole "have fewer kids to save the planet" mood is backwards, and it leaned pretty hard on population ethics to make its case. I copied the key bit into my notes so I'd have it word for word:

  "The philosopher Derek Parfit proved that a bigger population is better, and he called the result the repugnant conclusion: the best possible world is one with trillions upon trillions of people whose lives are only barely worth living. That's simply what the arithmetic of total wellbeing says, and Parfit accepted it. There's really only one way to dodge it, which is to say that the extra people don't count unless they're better off than the average — and Parfit demolished that too, in what's known as the non-identity problem, showing it's false that you can't harm somebody by bringing them into existence. So the pessimists about population growth have the ethics upside down, and the practical upshot is that we should all be having a lot more children."

  I'm not a philosopher, I do freight logistics for a living, but I've read around the edges of this stuff and my gut says at least three claims in there are bent out of shape — I just can't say which ones or why, and I'd loose that argument at Thanksgiving if I tried it. Can you go through the paragraph claim by claim and tell me what a population ethicist would happily sign off on, what's a fair compression of something genuinely complicated, and what's straight-up misreported? I especially want to know whether the repugnant conclusion is the kind of thing its own author endorsed, whether the "better off than the average" dodge is really the same thing as the non-identity problem or two different puzzles that got stapled together, and whether a claim about which outcomes are best can just be cashed out as advice about how many kids any given person should have. Then tell me if the punchline survives: once everything wrong in that paragraph is fixed, is there still a respectable argument sitting in that neighborhood for having more children, or does the whole column collapse with the distinctions corrected? I've also half-heard people mention impossibility theorems in this area and something called the sadistic conclusion — if either of those changes the verdict, fold it in. Please write the whole thing in American English.
