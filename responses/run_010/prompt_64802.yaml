answer: |-
  ## Four Sparks
  **(2460 words)**

  Marta knew the grain warehouses better than her father, and he was the nightwatchman. She knew the way damp river air seeped into the vast, echoing spaces where the smell of wheat and rye was a permanent fog. She knew the creak of the floorboards near the west loading doors where the rot had started, and the specific chill draft that snaked down from the improperly sealed ventilator shafts. She knew these things because she worked the ledger books in the harbour office by day, copying manifests and cargo weights, and because, since her mother died, she often brought her father his supper and stayed awhile, listening to the immense, waiting silence of the stored grain.

  That Tuesday, the silence felt different. Thicker. Charged, like the air before a summer storm, though it was early spring and the night outside the high warehouse windows was cool and clear. The new railway spur, a raw gash of cinder and iron ending abruptly by Warehouse Three, seemed to hum with a latent energy. Piles of creosote-soaked timber ties, destined for the extension that kept getting delayed, lay stacked too close to the older, drier wood of the warehouse siding. The scent of the tar was sharp, almost medicinal, cutting through the usual grain-dust pall.

  Marta found the first spark just after eight o'clock. Not a spark yet, but its kin. She was bringing her father his flask of weak tea and a meat pie wrapped in waxed paper. She cut through Warehouse Two, a shortcut she shouldn’t take, relying on the dim light filtering from the gas lamp on the wharf outside. Passing near the large ventilation shaft – a complex of pipes and shutters designed to draw off the explosive grain dust – she paused. A faint, sickly sweet smell, alien to the usual warehouse bouquet. Gas? Leaking from the lamp fittings? She traced it, not to the lamps, but to the base of the shaft itself. Kneeling, she felt a warmth radiating from the metal housing. Fumbling in her pocket, she found the small wrench her father insisted she carry "just in case". Peering into the gloom, her fingers traced the familiar wheel valve controlling the airflow to the dust trap. It was shut tight. Not just closed, but jammed. Seized by rust and neglect. *Omission.* Someone had forgotten to check it, week after week, month after month. The dust, thick as felt in the shaft’s throat, wasn’t being drawn away; it was baking, slowly, in the residual heat of the building and the friction of the unmoving mechanism. A tiny, glowing ember *could* catch there, any moment. Would catch, inevitably. She strained against the wheel. Nothing. She hammered the wrench against the frozen metal once, twice, a sharp clang echoing in the cavernous space. On the third strike, it gave with a shriek of rust. She cranked it open a quarter turn. Enough. Cool night air sighed down the shaft, dispersing the sweet, dangerous heat. The immediate threat dissolved, leaving only the greasy residue of fear on her palms. One spark snuffed.

  The second spark walked in on two legs, trailing resentment like cheap cologne. Marta heard the heavy, uneven footsteps on the wooden stairs leading to her father’s cramped watchman’s office perched high in Warehouse One. Jed Carter. She knew his gait, and she knew why he’d be here now, after hours. Jed had been passed over for foreman again, this time for a younger man, an immigrant from Bohemia who spoke broken English but understood machines. Jed blamed the harbour master, the owners, the whole choking system.

  "Ben!" Jed’s voice was too loud, slurred. Her father, Ben, sighed, setting down his own cold tea. Marta shrank back into the shadows by the ledger shelf.

  "Jed. You shouldn't be here. Not on the property."

  "Property?" Jed spat the word. "My sweat built this property! Twenty years! And for what? To watch some jumped-up foreigner take what’s mine?" He slammed a fist on the rickety table, rattling the lantern that was Ben’s only light. The flame inside guttered wildly. Marta’s eyes fixed on it. The glass was smudged, cracked near the base. A common enough hazard, but placed on unstable wood, shaken by a drunk man’s fury… *Event.* A direct act, born of a *grudge*.

  "Easy, Jed," Ben said, his voice weary but firm. He rose slowly. "You know the rules. No drink on the docks. Go home. Sleep it off."

  "Sleep?" Jed laughed, a harsh bark. "While they steal my future? While this whole damn place…" He gestured wildly, encompassing the warehouses, the unseen grain, the new railway that hadn’t hired him either. His elbow clipped the table again. The lantern wobbled precariously. Marta didn’t think. She lunged from the shadows, not at Jed, but at the table. Her hand shot out, grabbing the lantern base just as it tipped, her fingers wrapping around hot metal. She hissed, pulling it upright, away from the edge, away from Jed’s flailing arms. The flame settled.

  Jed blinked, startled by her sudden appearance. "Marta? What're you…?"

  "Get out, Mr. Carter," she said, her voice surprisingly steady, though her burned palm throbbed. She held the rescued lantern like a shield. "Now." The authority in her tone, borrowed from the clerks and harbour masters she transcribed for daily, cut through his drunken haze. He muttered, swayed, then turned and stumbled back down the stairs. The immediate violence of his anger, the *spark* of his action, was extinguished for tonight. Two sparks gone.

  The third spark waited by the railway spur, patient and chemical. Marta walked her father down the length of Warehouse Three towards the river door, needing the cool air on her face after the claustrophobic anger in the office. Her father patted her good shoulder. "You've got quick hands, girl. Like your mother." He sounded exhausted.

  The raw scent of creosote hit them as they neared the section closest to the new spur. The stacked timber ties formed a dark wall. Too close. Far too close to the sun-bleached, bone-dry wood of the warehouse wall. And piled *under* the long, sloping overhang of the warehouse roof. *Standing condition.* An invitation. Not an event, not an omission, just a fact as present as the river itself. A stray spark from a passing steamboat funnel, a carelessly tossed cigarillo, a fragment of hot slag from the railway works earlier in the day, landing unseen... any one of them could ignite the volatile creosote. And the fire would leap to the warehouse like a starving beast.

  "Father," she said, stopping. "That timber. It shouldn't be there. Against the rules."

  Ben squinted. "Aye. Supposed to be fifty feet back. Harbour master's orders. But the railway lads... they say it's only temporary. Easier to hand." He sighed again, the sound a worn-out bellows. "I'll mention it. Again."

  Mention it. Again. It wouldn't move tonight. Marta knew it. The *condition* remained. But she could mitigate it. "Help me," she said, walking towards the nearest pile. "Just this one. Push it back a few feet. Away from the wall."

  Ben looked doubtful, but he saw the resolve in her face, a reflection of her mother’s he hadn't seen in years. Together, grunting with effort, they managed to drag and shove the outermost stack of heavy timber ties back a clear five feet from the warehouse siding. It left the inner stacks still perilously close, but it created a buffer. A tiny moat against the inevitable *event* that would try to cross. Not eliminated. Reduced. Three sparks addressed. Temporarily.

  She left her father at the river door, the wide expanse of black water shimmering under a sliver of moon. The air felt cleaner out here. She walked home, the smell of river mud and creosote clinging to her clothes, the ache of her burned hand a dull counterpoint to the fading adrenaline. She had bought time. She had stopped three certainties. The warehouse felt quieter as she glanced back, just shapes against the star-pricked sky. She slept.

  The fourth spark she never saw. It happened near midnight, long after she’d left. It wasn't grand. It wasn't malice. Just *event*. A group of boys – dockworkers' sons, maybe, or lads from the new railway camp – seeking shelter from a sudden, chill drizzle in the deep shadowed alcove where Warehouse Three met the older brick structure of the customs shed. Hidden from the infrequent patrols of Ben Hawkins. They smoked cheap, hand-rolled cigarettes, the glowing tips bright in the darkness. One boy, laughing at a joke, flicked his stub carelessly. It arced, a tiny, dying ember, landing not on damp cobbles, but in a drift of dry chaff and dust swept into the corner by the wind. It smouldered. Unseen. It caught a wisp of frayed burlap sacking abandoned nearby. The flame, small and shy at first, found the bone-dry wood of the warehouse wall, just below where the creosote timber had been stacked. The moved stack was five feet back. The inner stacks were not. The flame, nourished by the draft whistling between the buildings, licked upwards, tasting the air. It found the edge of a creosote-soaked tie. The volatile oil ignited with a soft *whoomp*, invisible in the dark alcove but instantly hungry. The fire climbed the warehouse siding, quick and sure.

  Ben Hawkins, making his rounds, smelled the smoke – acrid, chemical-laced – just as the first flames breached the warehouse roof near the railway spur. He ran, clanging the alarm bell, his shouts hoarse in the suddenly roaring night. The moved timber stack bought the west side of Warehouse Three perhaps fifteen minutes. The open ventilator shaft in Warehouse Two ensured the fire, when it jumped via floating embers, burned incredibly hot and fast, but *upwards* initially, buying the eastern wall a little more time. The men who arrived, forming bucket chains from the river, fought a smaller, slightly delayed blaze than they would have faced without Marta’s interventions. But they fought a fire nonetheless. Warehouse Three was gutted. Warehouse Two, heavily damaged. The new railway ties burned like a pyre, fuelling the inferno.

  The inquest was held in the town hall, smelling faintly of damp wool and stale tobacco, not smoke. Marta sat beside her father, her burned hand wrapped in a clean cloth, hidden in her lap. The harbour master testified about procedures. Jed Carter, sober and sullen, confirmed Ben Hawkins had ordered him off the property. The railway foreman admitted the timber had been stored "temporarily" close to the warehouse, against regulations. A labourer mentioned boys seen near the customs shed that night. Ben Hawkins described smelling smoke, raising the alarm.

  The coroner, a dry man named Pryce, shuffled papers. "Miss Hawkins," he said, peering at her over spectacles. "You were present that evening? You assisted your father?"

  "Yes, sir."

  "You observed anything... untoward? Before the fire?"

  Marta saw the paths in her mind. The seized valve, baking dust. Jed’s drunken rage, the teetering lantern. The creosote timber piled like kindling. The unseen boys, the careless spark. Four chains. Each complete. Each fatal. She opened her mouth.

  "The ventilator shaft," she began. "In Warehouse Two. The dust valve was seized shut. I opened it."

  Pryce frowned. "Seized? Was this part of your father's duties? To check such mechanisms?"

  "It... it should have been checked regularly. By maintenance." She glanced towards the harbour master’s representative, who looked away. *Omission.*

  "And you rectified this?"

  "Yes. Around eight o'clock."

  Pryce made a note. "And did you observe anything else?"

  "The railway timber. Stored against the rules. Too close to Warehouse Three. My father and I moved one stack back. Five feet."

  Pryce consulted another paper. "Moved? By you and the nightwatchman? Was it moved *after* the fire started?" His tone suggested confusion, an irregularity.

  "Before. Around eight-thirty."

  He made another note, a long, slow scratch of the pen. "I see. And... anything else?"

  Marta thought of Jed, the lantern. That *event* she had physically stopped. Pointing it out now would only entangle her father further. "No, sir," she said quietly. "Nothing else."

  The testimony wound down. Pryce cleared his throat. The room leaned in. "The facts," he pronounced, "are somewhat scattered. A maintenance lapse regarding ventilation – addressed by the nightwatchman's daughter prior to the fire. Improper storage of flammable materials by the railway – partially mitigated by the nightwatchman and his daughter." He paused, steepling his fingers. "Testimony suggests unsupervised youths may have been present near the point of origin. However," his voice hardened slightly, "no direct evidence pinpoints the initial spark. The critical failure, gentlemen, lies in vigilance. The nightwatchman, Benjamin Hawkins, failed in his primary duty: constant patrol and immediate detection of hazards. He failed to observe the youths. He failed to ensure the *complete* removal of the improperly stored timber – moving one pile was insufficient action. He failed to detect the fire at its absolute inception, despite procedures demanding constant surveillance." He looked directly at Ben Hawkins, slumped beside Marta. "The fire, therefore, is attributed to negligence in watchkeeping."

  Ben flinched as if struck. A murmur, not of protest, but of *settlement*, ran through the room. Harbour officials nodded slightly. The railway foreman looked relieved. Jed Carter almost smirked. It was clean. Tidy. One cause. One face. A man who hadn't run *towards* the fire fast enough.

  Marta felt the verdict settle over the hall, thick as the grain dust had been. Not a lie, exactly. Her father *had* missed the boys. He *hadn't* moved all the timber. He *hadn't* been at the exact spot when the ember fell. These were fragments of truth, plucked from the complex web and woven into a single, damning thread. The seized valve, the bitter grudge, the volatile timber, the careless spark – the four chains that had *ensured* destruction – dissolved into the official record, leaving only the paper-thin failure of the watchman. This verdict would be the single source, the only version repeated in the newspaper, in insurance claims, in town gossip. *Hawkins nodded off. Hawkins wasn't vigilant enough.* The suffocating weight of simplification pressed down.

  She looked at her father. His face was grey, etched with a shame he didn't deserve, absorbing the blame like the dry wood had absorbed the spark. She looked at the coroner, the harbour master, the faces in the hall. They weren't cruel. They were weary. They needed the fire *contained*, not just physically, but narratively. A town couldn't function on four causes. It needed one story to file away, one scapegoat to bear the communal weight of random, converging disaster. Truth was too sprawling, too terrifying in its indifference. It needed a container. A single, frail human vessel.

  Marta didn't speak. She didn't forgive them. The understanding that washed over her was cold and clear, like river water. It wasn't justice. It was necessity. The paper had been written. Her work, buying two hours and a smaller blaze, had no column on their forms. It simply *wasn't*. She helped her father to his feet. His arm trembled under her hand. She led him out of the hall, away from the rustling papers and the satisfied sighs, into the afternoon light. The air smelled faintly of damp ash and the relentless, muddy river. She understood. That was the last beat. A silent, terrible knowledge settling deeper than blame.
