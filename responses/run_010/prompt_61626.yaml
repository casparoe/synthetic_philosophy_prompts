  We are given an applied microeconomist's vocabulary and asked to restate a debate in inverse reinforcement learning (IRL) in that vocabulary, then analyze the translation of three specific claims. We then answer three narrower questions and provide a residue report.

  The economist's framework:
  - Demand analysis and revealed preference: budget sets, observed price-quantity pairs.
  - Weak and Generalized Axioms of Revealed Preference (WARP, GARP).
  - Afriat's theorem: rationalization of finite data by utility functions, multiplicity of such functions.
  - Ordinal invariance: utility functions are equivalent up to monotone transformations.
  - Nonsatiation: more is better (monotonicity).
  - Money-pump arguments against cyclic choice (intransitivity).
  - Random utility models (RUM) and stochastic choice as a way to model noise.
  - Identification problem: choice data alone cannot separate preferences from beliefs from constraints; exclusion restrictions or functional form assumptions help.
  - Intertemporal choice: consistency conditions, dynamic inconsistency leading to exploitation by future selves.

  The IRL debate in practitioners' terms has three claims:

  1. **Underdetermination**: The recovered reward is only pinned down up to an equivalence class that is larger than affine rescaling (includes potential-based shaping). It depends on the prior over rewards, the discount factor, and the assumed optimality model (e.g., softmax with a temperature parameter).

  2. **Dynamic inconsistency**: If humans discount hyperbolically, the reward is not stable. Naive vs. sophisticated agents choose differently, and there's no purely behavioral way to choose which to fit.

  3. **Belief-reward confounding**: The same trajectory can be optimal under high reward with pessimistic beliefs or low reward with optimistic beliefs. Misspecified beliefs lead to biased reward estimates, and more data of the same kind doesn't fix it.

  We are to translate each claim into the economist's vocabulary, then note what carries over, what had to be bent, and what has no expression. Then we answer the three narrower questions and provide a residue report.

  ---

  ### Translation of Claim 1: Underdetermination

  **IRL claim**: The reward function is underdetermined by the data. The equivalence class is larger than affine rescaling (it includes shaping terms). The inferred reward depends on the prior, discount factor, and the noise model.

  **Translation to economist's vocabulary**: 
  In revealed preference, we observe choices (actions) from budget sets (constraints). The Afriat theorem tells us that for a finite set of observations, there are multiple utility functions that rationalize the data. These utility functions are equivalent up to monotonic transformations (ordinal invariance). However, in IRL, the equivalence class of rewards is not just affine (which would correspond to cardinal utility) but also includes shaping terms. In the economist's setting, the "shaping" would be analogous to adding a term that depends on the state (or context) but does not affect the ordinal ranking of the choices. 

  But note: in IRL, the shaping term is state-dependent and time-dependent (like a potential function) and does not change the optimal policy. In the static consumer choice setting, we don't have states and dynamics. However, in intertemporal choice, we might see a parallel: a transformation of the utility function that depends on the state (e.g., wealth) might leave the choice behavior unchanged. 

  Moreover, the dependence on the prior and the noise model in IRL is analogous to the assumptions in random utility models (RUM). In RUM, we assume a distribution of utility shocks, and the choice probabilities depend on the entire utility function and the distribution. Similarly, in IRL, the softmax model assumes a particular form of noise (logit) and a temperature parameter. The inferred utility (or reward) depends on these assumptions.

  **What carries over?** 
  - The idea of multiple rationalizing functions (Afriat) is directly analogous.
  - The dependence on the noise model (RUM) is similar: without strong functional form assumptions, we cannot pin down the utility function.

  **What had to be bent?**
  - The static vs. dynamic setting: IRL is inherently about sequential decision making (MDPs), while the basic revealed preference is static. We must extend to intertemporal choice. 
  - The shaping term equivalence has no direct static analog. In dynamic revealed preference, we might think of a transformation that depends on the state (like wealth) but leaves the choices unchanged. But the potential-based shaping is a very specific form that preserves the optimal policy in the MDP.

  **What has no expression?**
  - The concept of a discount factor (γ) is specific to dynamic settings and doesn't appear in static consumer theory.
  - The exact form of the equivalence class (affine plus shaping) is tied to the structure of MDPs and Bellman equations.

  ---

  ### Translation of Claim 2: Dynamic Inconsistency

  **IRL claim**: Hyperbolic discounting leads to a non-stable reward. The naive and sophisticated agents choose differently, and there is no purely behavioral fact to decide which to fit.

  **Translation**: 
  In intertemporal choice, hyperbolic discounting can lead to dynamic inconsistency: the agent's preferences change over time. The naive agent is unaware of her future self's changing preferences, while the sophisticated agent is aware and may take actions to precommit. This leads to different choices (policies). 

  In the economist's framework, we model this as a conflict between the current self and future selves. The naive agent would be one who at time t expects her future self at t+1 to follow the plan set at t, but then at t+1 she changes her mind. The sophisticated agent knows that she will change her mind and so chooses a policy that is time-consistent (e.g., by precommitting). 

  The point that the reward (or utility function) is not stable is exactly the dynamic inconsistency problem. The IRL practitioner must decide whether to fit the behavior of the momentary self (which is inconsistent over time) or some reflective standard (e.g., the long-run self). But from revealed preference alone, we cannot tell which one is the "true" preference because both are consistent with the choices in their respective contexts (with the sophisticated agent facing a different problem due to precommitment).

  **What carries over?**
  - The entire dynamic inconsistency argument and the money-pump exploitability carry over directly. The economist's framework already includes this.

  **What had to be bent?**
  - In IRL, the reward function is typically assumed to be stationary (the same at every time step). Hyperbolic discounting breaks stationarity. In the economist's framework, we model this as changing preferences. We had to map the IRL stationary reward to a non-stationary utility in the economist's model.

  **What has no expression?**
  - The IRL framework typically assumes a stationary reward. The economist's framework does not require stationarity. So the issue of having to choose between naive and sophisticated is already present in the economist's framework. Therefore, nothing is missing.

  ---

  ### Translation of Claim 3: Belief-Reward Confounding

  **IRL claim**: The same trajectory can be optimal under high reward with pessimistic beliefs or low reward with optimistic beliefs. Misspecified beliefs lead to biased reward estimates. More data of the same kind (i.e., without variation in beliefs) does not help.

  **Translation**: 
  This is a classic identification problem. In the economist's framework, choices (actions) are the result of preferences (utility) and beliefs (about future prices, income, states) and constraints. Without additional assumptions, we cannot separate the utility function from the beliefs. 

  In dynamic settings, the same choice sequence (trajectory) can be generated by a high utility function with pessimistic beliefs (e.g., expecting bad states) or a low utility function with optimistic beliefs. This is analogous to the identification problem in structural estimation: we need exclusion restrictions or functional form assumptions to break the confounding.

  Moreover, the claim that more data of the same kind doesn't help is also standard: if we don't have variation that shifts beliefs independently of the true state, we cannot identify the two separately.

  **What carries over?**
  - The entire identification problem is the same as in structural estimation. The confounding of preferences and beliefs is a core issue in the economist's framework.

  **What had to be bent?**
  - The IRL setting is in a Markov Decision Process (MDP) with states, actions, and transitions. The economist's framework for dynamic choice might not be as formally structured, but the idea of beliefs about future states (like income, prices) is present.

  **What has no expression?**
  - The MDP structure and the explicit transition probabilities are specific to IRL. In the economist's framework, beliefs are often about continuous variables (like future prices) and might not be modeled as a transition kernel over a discrete state space. But the core issue of confounding is the same.

  ---

  ### Answers to Narrower Questions:

  1. **Is the shaping-and-affine equivalence class the same phenomenon as ordinal invariance, a weaker one, or a stronger one?**

     In the static setting, ordinal invariance says that any monotone transformation of the utility function represents the same preferences. In IRL, the affine-plus-shaping equivalence class is a set of transformations that leave the optimal policy unchanged. This is a dynamic, policy-level invariance.

     However, note that in the static case, ordinal invariance is very permissive: it includes any monotone transformation. The affine-plus-shaping class is actually more restrictive because it is a specific set of transformations (affine plus a potential-based term). But in the dynamic setting, the affine-plus-shaping class is a consequence of the structure of the Bellman equation. 

     Importantly, the affine part (scaling and shifting) is analogous to cardinal transformations (which do not affect choices in the static setting) but the shaping term is new. So the equivalence class in IRL is different: it is neither weaker nor stronger than ordinal invariance. It is a different kind of invariance that arises in dynamic optimization.

     In the static setting, if we consider a choice problem with states (contexts), then a transformation that adds a state-dependent constant might leave the choices unchanged because it doesn't alter the relative utilities of the choices in each state. This is similar to shaping. But without dynamics, we don't have the same structure.

     Therefore, we can say that the shaping-and-affine equivalence class is a dynamic analog of a kind of invariance that is stronger than ordinal invariance in the sense that it is a smaller class (more restrictive) than the full ordinal class, but it is tailored to the MDP.

     However, note that in the static setting, the ordinal invariance is the only invariance we have. In IRL, the affine-plus-shaping class is the set of reward functions that yield the same optimal policy. But the same policy might be optimal for many reward functions that are not related by affine-plus-shaping? Actually, the affine-plus-shaping is the complete characterization for MDPs. But this is a technical result.

     So the phenomenon is not the same: it is a different kind of invariance that arises in the dynamic setting. It is weaker than ordinal invariance in the sense that it allows only affine and shaping (so it is a subset of the ordinal transformations that are affine per state plus a potential) but it is stronger in the sense that it preserves the optimal policy (which is the object of interest in IRL).

     However, note: affine-plus-shaping does not preserve the ordinal ranking of all trajectories? It preserves the optimality of the policy. So it is not about preserving the ordering of every pair of trajectories but about preserving the set of optimal policies.

     **Conclusion**: It is a different phenomenon. It is a policy-level invariance in dynamic optimization, whereas ordinal invariance is about the entire preference ordering. The two are not directly comparable, but the IRL equivalence class is more restrictive than the full ordinal class (because it is a subset of transformations) but also more permissive in the sense that it can change the relative rewards of non-optimal trajectories arbitrarily? Actually, the potential-based shaping does change the rewards of trajectories arbitrarily? Not exactly: it changes them by the difference in potential at the start and end. So it does impose a structure.

     Given the difficulty, we might say: the shaping-and-affine class is a specific form of invariance that is required for the dynamic programming structure. It is not the same as ordinal invariance, and it is not weaker or stronger in a general sense. It is a different beast.

  2. **Does anything in revealed preference theory play the role of a testable consistency condition — a generalized axiom whose violation would falsify the reward hypothesis — or is the absence of any such condition precisely the practitioners' point?**

     In revealed preference, we have consistency conditions (like GARP) that are testable. If the data satisfy GARP, then there exists a utility function that rationalizes the data. If not, then no such utility function exists.

     In IRL, the analogous condition would be: does there exist a reward function that makes the observed policy (or demonstrations) optimal? This is the problem of inverse optimal control. For deterministic MDPs, we can test whether the observed actions are optimal for some reward function by checking the Bellman equations. But with noise and partial observability, it becomes more complex.

     However, the practitioners' point in IRL is that without strong assumptions (like the noise model and the discount factor), the reward is underdetermined. Moreover, even if we assume a noise model, we can always find a reward that makes the data likely (if the noise model is flexible enough). So the consistency condition is not the same as in revealed preference.

     In fact, the absence of a testable condition for the existence of a reward function (without assuming the noise model and discount factor) is exactly the practitioners' point. But note: if we fix the discount factor and the noise model, then we can test whether the data are consistent with that model by checking if there exists a reward function that makes the data likely (or optimal). This is analogous to testing the random utility model: we can test if the choice probabilities are consistent with a RUM.

     However, the IRL practitioners often assume that the demonstrator is optimal (with some noise) and then try to recover the reward. They don't typically provide a test of the hypothesis that the demonstrator is optimal. So the revealed preference theory has a clear testable condition (GARP) for the existence of a utility function, while IRL typically assumes the existence and focuses on recovery.

     **Conclusion**: Revealed preference theory does provide a testable condition (GARP) for the existence of a utility function. In IRL, without assuming the discount factor and noise model, there isn't a universally agreed testable condition for the existence of a reward function. But if we fix these, then we can test for the existence of a reward that explains the data. The absence of a condition that doesn't require fixing these auxiliary parameters is the practitioners' point.

  3. **Is the belief-reward confound novel relative to the identification problem I already know, or is it that problem with the state space enlarged?**

     The identification problem in structural estimation is exactly about separating preferences (utility) from beliefs and constraints. The belief-reward confound in IRL is a special case of this problem. 

     However, the IRL setting typically has a well-defined state space and transition dynamics. The confound arises because the same trajectory can be explained by different combinations of reward and beliefs about the transition probabilities. This is analogous to the problem of identifying risk preferences and beliefs in decision under uncertainty. For example, in portfolio choice, we might confound risk aversion and beliefs about asset returns.

     So the belief-reward confound is not novel in concept. It is the same identification problem. The only novelty is the specific structure of the MDP (with states, actions, transitions) and the fact that the beliefs are about state transitions. In the economist's framework, the state space might be different (like the state of the economy) but the issue is the same.

     **Conclusion**: It is the same identification problem with the state space structured as an MDP. There is no novelty in the fundamental problem, only in the specific setting.

  ---

  ### Residue Report: What did not survive translation?

  We list what did not survive and judge whether the failure is a defect of the economist's framework or evidence that the original claim was less substantive (repackaging).

  1. **Discount factor (γ)**:
     - **What**: The discount factor is a parameter in the dynamic optimization. It is central to IRL because it affects the present value of future rewards. In the translation, we noted that it has no expression in static revealed preference, but in intertemporal choice we do have discounting. However, the economist's framework typically uses exponential discounting (or sometimes hyperbolic) but does not treat the discount factor as a parameter to be inferred in the same way as in IRL. In IRL, the discount factor is often assumed known or must be set by the practitioner.
     - **Judgment**: This is a defect of the economist's framework for static choice. But the economist does have intertemporal choice models. However, in revealed preference tests for intertemporal choice, the discount factor is not typically separated from the utility function. So the underdetermination of the reward function by the data in IRL due to uncertainty about γ does not have a direct analog. But this is not a repackaging: it is a genuine issue in dynamic settings.

  2. **Potential-based shaping equivalence**:
     - **What**: This is a specific transformation of the reward function that leaves the optimal policy unchanged. It is a consequence of the Bellman equation. There is no direct analog in static choice because there is no state dynamics. In dynamic revealed preference, we might see a similar issue if we consider state-dependent utility, but the exact form (based on the difference of a potential function) is tied to the MDP structure.
     - **Judgment**: This is a novel insight from the MDP structure. It is not a repackaging of an existing econometric point. So the failure to translate exactly is a defect of the economist's framework (if we are confined to static choice) but not if we extend to dynamic choice. However, even in dynamic choice, the specific form of the shaping term is not usually considered.

  3. **Softmax optimality model**:
     - **What**: The IRL practitioner often assumes that the demonstrator chooses actions with probability proportional to the exponential of the action's value (softmax). This is a specific functional form for the noise. In the economist's framework, we have random utility models (RUM) which also use specific distributions (like extreme value for logit). However, the practitioner's point is that the inferred reward depends on the temperature parameter (which controls the noise level) and the prior over rewards. This dependence is analogous to the dependence of the inferred utility on the assumed distribution in RUM. 
     - **Judgment**: This is a repackaging of an econometric point: the functional form assumptions (like logit) and the prior are needed for identification. The same issue exists in discrete choice models. So the failure to see this as a direct analog is not a defect; it is that the original claim is less substantive in the sense that it is a standard identification problem.

  4. **State space and transition dynamics**:
     - **What**: The IRL setting assumes an MDP with states, actions, and transition probabilities. The economist's framework for dynamic choice might not formalize the state space in the same way. For example, in consumption-saving models, the state might be wealth and the transition is given by the budget equation. But the MDP structure is more general.
     - **Judgment**: This is a difference in formalism, not substance. The core ideas (like the identification problem) carry over. So the residue is due to the control-theoretic notation, but the substance is the same.

  5. **Hyperbolic discounting and non-stationarity**:
     - **What**: In IRL, the reward function is typically assumed stationary. Hyperbolic discounting breaks the stationarity of the discounting, but the reward per state is still stationary. In the economist's framework, we model hyperbolic discounting as a non-stationarity in the discount factors. But the utility function for consumption at each time is still stationary. However, the IRL claim is that the reward function is not stable because the agent's preferences change over time. This is already captured in the economist's model by the changing discounting. 
     - **Judgment**: This is a repackaging: the dynamic inconsistency argument is standard in economics. The failure to translate is only in the language (stationary reward vs. non-stationary discounting). So the original claim is less novel than it sounds.

  6. **Trajectory-level optimality**:
     - **What**: In IRL, we often observe trajectories (sequences of state-action pairs). The same trajectory can be optimal under different reward-belief pairs. In the economist's framework, we might observe a sequence of choices (like consumption over time). The same sequence can be explained by different combinations of utility and beliefs. This is the standard identification problem in dynamic structural models.
     - **Judgment**: This is repackaging. The residue is minimal.

  **Summary of Residue**:

  | Item | Judgment |
  |------|----------|
  | Discount factor (γ) | Defect of the framework (if static) but not if dynamic; however, even in dynamic, the discount factor is not always separated. |
  | Potential-based shaping | Novel to MDPs, not repackaging. Defect of the economist's framework for not capturing the dynamic programming structure. |
  | Softmax optimality model | Repackaging of standard identification in discrete choice. |
  | State space and transition dynamics | Repackaging in control-theoretic notation. The substance is the same. |
  | Hyperbolic discounting and non-stationarity | Repackaging of dynamic inconsistency from economics. |
  | Trajectory-level optimality | Repackaging of the identification problem. |

  **Diagnosis**: The core claims in the IRL debate are mostly repackagings of standard issues in microeconomic theory and econometrics. The exceptions are the potential-based shaping (which is novel to the MDP structure) and the discount factor (which is more central in IRL than in typical revealed preference tests). The rest are familiar problems of identification, dynamic inconsistency, and the need for auxiliary assumptions.

  **Final Note**: The practitioner's point about underdetermination is valid and deep, but it is not new to economics. The novelty lies in the specific form of the equivalence class (shaping) and the explicit dependence on the discount factor and the MDP structure.
answer: |-
  ### Translation of IRL Debate into Applied Microeconomist's Vocabulary

  **Claim 1: Underdetermination**  
  *Translation*: When inferring preferences from choice data (observed state-action trajectories), the revealed utility function is indeterminate. Even with nonsatiation and optimal choice assumptions, the utility function is only recoverable up to an equivalence class broader than affine transformations. Specifically, adding *state-dependent utility shifts* (analogous to potential-based shaping) preserves the optimal policy, mirroring how monotonic transformations preserve choice rationalization in Afriat's theorem. The inferred utility depends critically on priors over utility functions, the discount rate (intertemporal trade-off parameter), and the assumed noise model (e.g., softmax as a specific random utility parameterization).  

  - **What carries over**:  
    - Indeterminacy of utility rationalizations (Afriat's multiplicity).  
    - Dependence on auxiliary assumptions (cf. exclusion restrictions in structural estimation).  
  - **What bent**:  
    - "State-dependent shifts" have no static analog; bent by mapping states to contextual budgets.  
    - Discount factor γ mapped to impatience in intertemporal choice, but γ is a free parameter in IRL, unlike time preferences in revealed preference tests.  
  - **No expression**:  
    - Potential-based shaping: No equivalent to state-dependent utility shifts in static choice.  
    - Discount factor as free parameter: In revealed preference, discounting is part of preferences, not a separate estimand.  

  **Claim 2: Dynamic Inconsistency**  
  *Translation*: If agents exhibit hyperbolic discounting, their "revealed preferences" are dynamically inconsistent. The momentary self (naive) and precommitting self (sophisticated) implement different policies under the same budget sets. There is no behavioral test to distinguish which self's choices reveal "true" preferences—both are consistent with their own constraints. Attempting to infer a single utility function forces arbitrary normalization, akin to assuming stationarity where none exists.  

  - **What carries over**:  
    - Dynamic inconsistency as exploitable by future selves (money-pump arguments).  
    - Non-identification of "true" preferences from choices alone.  
  - **What bent**:  
    - "Policies" mapped to intertemporal consumption plans.  
    - Naive/sophisticated distinction bent into myopic vs. precommitted strategies.  
  - **No expression**:  
    - Hyperbolic discounting as a *specific functional form*: Revealed preference tests consistency but does not assume functional forms.  
    - "Reflective standard": No analog to this normative concept in positive choice theory.  

  **Claim 3: Belief-Reward Confounding**  
  *Translation*: Observed trajectories (choice sequences) underdetermine whether the agent has high utility with pessimistic beliefs or low utility with optimistic beliefs. This is an identification problem: Constraints (transition probabilities/Bayesian beliefs) and preferences (utility) are confounded. Misspecifying beliefs (e.g., assuming correct transitions when the agent is biased) distorts utility estimates. More data without belief variation (e.g., fixed information sets) cannot resolve this.  

  - **What carries over**:  
    - Fundamental non-separation of preferences, beliefs, and constraints.  
    - Analogous to confounding risk aversion and probability beliefs in asset choice.  
  - **What bent**:  
    - "Beliefs" mapped to subjective expectations of state transitions (e.g., price forecasts).  
    - "Trajectories" bent into intertemporal consumption bundles.  
  - **No expression**:  
    - State-space structure: Beliefs in IRL are about MDP transitions, not market uncertainties.  

  ---

  ### Answers to Narrower Questions  

  1. **Shaping-and-affine equivalence vs. ordinal invariance**  
     Shaping-and-affine is *stronger* than ordinal invariance. Ordinal invariance allows *any* monotonic transformation, preserving choice rationalization but not policy optimality. Shaping-and-affine restricts transformations to affine shifts plus state-dependent potentials, preserving *only* the optimal policy (not the full preference ordering over suboptimal choices). It is a policy-specific invariance unique to dynamic programming.  

  2. **Testable consistency conditions**  
     No direct analog exists. Revealed preference has GARP as a *sufficient* condition for rationalizability. IRL lacks such a test: Its "consistency condition" is the existence of *any* reward function rationalizing the policy under given γ and noise. Violations are attributed to belief misspecification or noise, not falsification of utility maximization. The absence of a testable axiom is precisely the practitioners' point—IRL assumes optimality and tests nothing.  

  3. **Belief-reward confound vs. identification problem**  
     It is the *same* identification problem with an enlarged state space. The confound arises because states in IRL include hidden transitions (like future prices), and beliefs are about those transitions. Exclusion restrictions (e.g., exogenous belief shifters) or functional form assumptions (e.g., separable utility) are needed, paralleling IV or parametric assumptions in structural models. No novelty beyond the MDP formalism.  

  ---

  ### Residue Report: What Did Not Survive Translation  
  **Itemized list of untranslatable elements, with diagnosis**  

  1. **Potential-based shaping rewards**  
     - *What*: Transformation \( R'(s,a) = R(s,a) + \gamma \phi(s') - \phi(s) \) preserving optimal policies.  
     - *Failure*: No static or intertemporal analog. State-dependent utility shifts invalidate Afriat if states vary independently of budgets.  
     - *Diagnosis*: **Defect of your framework**. Revealed preference lacks dynamic programming’s structure, making shaping irreducible.  

  2. **Discount factor γ as free parameter**  
     - *What*: γ is disentangled from preferences and estimated separately.  
     - *Failure*: In revealed preference, time preference is inseparable from utility (e.g., \( U(c_t, c_{t+1}) \)).  
     - *Diagnosis*: **Repackaged econometrics**. γ is a technical nuisance parameter, akin to assuming CRRA utility in structural estimation. No substantive insight.  

  3. **Softmax temperature as optimality parameter**  
     - *What*: Temperature scales noise, affecting reward identification.  
     - *Failure*: Not equivalent to random utility. RUM assumes stochastic preferences; softmax assumes optimality with error.  
     - *Diagnosis*: **Confused claim**. Temperature arbitrates between noise and utility magnitude—identical to scaling parameter in heteroskedastic logit models. Repackaged functional-form restriction.  

  4. **Hyperbolic discounting as non-stationary rewards**  
     - *What*: Rewards are stationary, but discounting induces time inconsistency.  
     - *Failure*: In your terms, hyperbolic discounting *is* changing preferences, not unstable rewards.  
     - *Diagnosis*: **Repackaged dynamic inconsistency**. The "unstable reward" framing is control-theoretic jargon for well-known preference reversals.  

  5. **Beliefs as transition probabilities**  
     - *What*: Beliefs are Bayesian estimates of state transitions \( P(s'|s,a) \).  
     - *Failure*: Beliefs in your framework are about exogenous constraints (e.g., future prices), not endogenous state dynamics.  
     - *Diagnosis*: **Repackaged identification problem**. The MDP state space enlarges the belief space, but the confounding is identical to separating risk aversion from probability distortions.  

  **Overall Diagnosis**  
  The IRL debate is **largely a repackaging of standard microeconometric concepts** in control-theoretic notation. The sole substantive novelty—*potential-based shaping*—stems from MDP dynamics and exposes a limitation in static revealed preference. Other elements (identification, dynamic inconsistency, noise modeling) are familiar problems relabeled with "rewards," "policies," and "beliefs." The claims initially appear profound due to formalism but reduce to:  
  - Underdetermination ⇔ Afriat’s multiplicity + need for assumptions.  
  - Dynamic inconsistency ⇔ Money-pump arguments.  
  - Belief-reward confounding ⇔ Standard identification problem.  
  The residue is minimal; IRL’s contributions are technical, not conceptual.
