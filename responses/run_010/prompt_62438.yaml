     - *Yes* → Go to 2.  
     - *No* → Go to 4.  

  2. **Do the hole models \((M, g)\) and \((M, g')\) represent distinct physical possibilities?**  
     - *Yes* → Go to 3.  
     - *No* → Go to 8.  

  3. **Can a point \(p \in M\) retain its identity if the metric at \(p\) changes?**  
     - *Yes* → **Leaf A** (Manifold substantivalism + indeterminism).  
     - *No* → **Leaf E** (Metric essentialism).  

  4. **Is the metric field a real physical entity?**  
     - *Yes* → Go to 5.  
     - *No* → Go to 9.  

  5. **Can spacetime exist without matter (e.g., vacuum solutions)?**  
     - *Yes* → Go to 6.  
     - *No* → Go to 10.  

  6. **Do the hole models \((M, g)\) and \((M, g')\) represent the same physical situation?**  
     - *Yes* → Go to 7.  
     - *No* → **Leaf F** (Metric field substantivalism).  

  7. **Are spacetime points just "nodes" defined by metric relations?**  
     - *Yes* → **Leaf C** (Structuralism).  
     - *No* → **Leaf G** (Modal relationism).  

  8. **Do global swaps (e.g., \((M, g)\) vs. \((M, \phi^*g)\) for a non-trivial \(\phi\)) represent the same physical situation?**  
     - *Yes* → **Leaf B** (Sophisticated substantivalism).  
     - *No* → **Leaf H** (Haecceitist substantivalism).  

  9. **Can spacetime exist without matter?**  
     - *Yes* → **Leaf F** (Metric field substantivalism).  
     - *No* → Go to 11.  

  10. **Do the hole models represent the same physical situation?**  
      - *Yes* → **Leaf D** (Relationism).  
      - *No* → **Leaf G** (Modal relationism).  

  11. **Are spacetime relations reducible to matter?**  
      - *Yes* → **Leaf D** (Relationism).  
      - *No* → **Leaf I** (Brute relationism).  

  ### The Leaves
  - **Leaf A: Manifold Substantivalism (Indeterministic)**  
    Spacetime points exist independently, with primitive identities. The hole models represent distinct possibilities (e.g., different metric values at the same point), so GR is indeterministic.  
    *Awkward commitment:* Accepts radical indeterminism in vacuum—physics cannot predict metric values inside a hole.  

  - **Leaf B: Sophisticated Substantivalism (Anti-Haecceitist)**  
    The manifold is real, but points lack primitive identities—they are individuated by metric/geometric structure. Hole and global swap models represent the same physics (no "extra" facts about point identities).  
    *Awkward commitment:* Points cannot be referred to independently of fields; "same point" talk is structure-dependent.  

  - **Leaf C: Structuralism**  
    Spacetime is a structure defined by the metric field (real and matter-independent). Points are nodes in this structure with no independent identity. Hole models are physically identical.  
    *Awkward commitment:* Points are derivative of the structure—events lack intrinsic identities, making "localization" counterintuitive.  

  - **Leaf D: Plain Relationism**  
    Spacetime is not real—only matter and its relations exist. Metric properties are derivative of matter interactions. Vacuum solutions are invalid or reducible to matter.  
    *Awkward commitment:* Denies vacuum solutions (e.g., gravitational waves in empty space) as fundamental or possible.  

  - **Leaf E: Metric Essentialism**  
    Points exist but have metric properties essentially—a point cannot "hold" a different metric. Hole models describe distinct sets of points (not the same points with changed properties), avoiding indeterminism.  
    *Awkward commitment:* Points are individuated by their metric properties, making "same point" debates across models incoherent.  

  - **Leaf F: Metric Field Substantivalism**  
    The metric field is a substance (real and matter-independent), but the manifold is not real. Points derive from the metric. Hole models may be distinct if points have metric-dependent identities.  
    *Awkward commitment:* Metric is a "thing" with parts (points), but points don’t exist without it—risks incoherence.  

  - **Leaf G: Modal Relationism**  
    Spacetime relations are real and irreducible to matter, but only modal (about possible matter configurations). Vacuum is a limit case of material relations. Hole models may differ modally.  
    *Awkward commitment:* Vacuum requires counterfactuals about non-existent matter—ontologically vague.  

  - **Leaf H: Haecceitist Substantivalism**  
    Manifold points have primitive identities, but hole models are physically identical (avoiding indeterminism) via a "non-standard" view: diffeomorphisms alter which points exist.  
    *Awkward commitment:* Global swaps create/destroy points arbitrarily—unmotivated and unphysical.  

  - **Leaf I: Brute Relationism**  
    Spacetime relations are real, irreducible, and matter-independent (no metric field). Vacuum is possible via primitive relations. Hole models are identical.  
    *Awkward commitment:* Relations exist without relata (points or matter)—ontologically extravagant.  

  ### Empty Cells
  - **2→No→8→No (Leaf H):**  
    *Why empty?* Coherent but unattractive—rarely defended due to its ad-hoc handling of identity.  
  - **4→Yes→5→No→10→No (Leaf G):**  
    *Why empty?* Not strictly incoherent, but ambiguous—splits relationism needlessly. Collapsed into Leaf G.  
  - **6→No (Leaf F):**  
    *Why empty?* Incoherent—if metric is real and manifold unreal, hole models must be physically identical (no primitive identities to differ).  
  - **7→No (Leaf G):**  
    *Why empty?* Unattractive—if points aren’t structural nodes but manifold is unreal, "what are points?" is unresolved.  
  - **9→Yes (Leaf F):**  
    *Why empty?* Coherent but duplicates Leaf F—metric field must be real to support spacetime without matter.  
  - **11→No (Leaf I):**  
    *Why empty?* Unexplored—no clear examples in literature.  

  ### Pairs It Can't Separate
  - **Structuralism (C) vs. Sophisticated Substantivalism (B):**  
    Both say hole/global swaps are identical and deny primitive identities. *Tiebreaker:* "Is the manifold structure (topology/smoothness) real even without the metric?" If yes, B; if no, C.  
  - **Relationism (D) vs. Modal Relationism (G):**  
    Both deny manifold reality and may deny metric field. *Tiebreaker:* "Can spacetime relations exist without actual matter (only possible matter)?" If yes, G; if no, D.  

  ### Dry Run: "Working Relativist" Answers
  1. **Bare manifold real?** No (spacetime is inseparable from metric). → **Go to 4**.  
  2. **Metric field real?** Yes (gravity is a physical field). → **Go to 5**.  
  3. **Vacuum possible?** Yes (e.g., black holes). → **Go to 6**.  
  4. **Hole models identical?** Yes (diffeomorphism invariance implies physical equivalence). → **Go to 7**.  
  5. **Points just structural nodes?** Yes (points are defined by metric relations). → **Leaf C: Structuralism**.  

  *Result:* Lands on **Structuralism**, reflecting a common view: spacetime is a metric structure, points lack independent identity, and hole models are physically equivalent.
