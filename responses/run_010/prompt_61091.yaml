prompt: |-
  I'm teaching the handicap principle to twenty second-years on an interdisciplinary evolution-and-society module — roughly half biosciences, half social science — in a single ninety-minute whiteboard session. Their prior exposure is entirely the popular version: the peacock's tail is honest because it is expensive, wastefulness is the whole point, and the same logic explains why people buy Rolexes. What I want them to leave with is the thing that version gets backwards — a signal is reliable not because it costs a lot, but because it costs a poor-quality signaller more to produce than a good-quality one, so that a signal can be ruinously expensive and carry no information at all, or be nearly free and still be trustworthy.

  Plan the session rather than explaining the principle to me. I need the order in which the pieces have to be laid down and what each one depends on; a verdict on whether the peacock's train can be salvaged as the carrying example or has to be dropped, since I am drawn instead to the male fiddler crab that regrows a display claw of much the same length after losing the original — lighter, weaker, and cheaper to wave — and I want to know what that case lets them see and what it actively obscures; the misconceptions they will walk in with, plus the new ones they will build for themselves as the argument is assembled, each pinned to the moment in the sequence where it has to be headed off rather than patched afterwards; one question for the last five minutes that would tell me whether the differential-cost point landed or whether they have merely learned a slogan; and what I should refuse to take up at this level, and announce that I am refusing.
reasoning: |-
  Okay, let me tackle this evolution teaching challenge. The user wants to teach the handicap principle to interdisciplinary students, moving beyond the popular "expensive = honest" misconception. They need a session plan that builds understanding step-by-step while addressing predictable misconceptions.

  First, I need to consider the students' background - half biosciences, half social sciences, all familiar with the peacock/Rolex oversimplification. The core goal is flipping their understanding: reliability comes from differential costs, not absolute expense. 

  I'll start by establishing why signaling matters in nature and society. Using familiar examples like peacocks and luxury goods will hook them initially, but I must quickly problematize this view. The "straw peacock" approach seems effective - let them articulate the common view before dismantling it.

  For the core concept, I'm considering an anchoring contrast: 
  1) Fixed-cost signals (where everyone pays same price) versus 
  2) Differential-cost signals (cost varies by quality). 
  The soda calorie estimation example could work well here - it's relatable and shows how differential costs create reliability.

  Now for the key biological example... The fiddler crab claw regeneration seems superior to peacocks here. It demonstrates how a signal that appears identical (claw length) becomes cheaper to produce for low-quality individuals, making it unreliable. This directly illustrates differential costs. Peacocks would require too much nuance about condition-dependent costs that might confuse the central point.

  Throughout the session, I anticipate specific misconceptions:
  - Early on: "Expensive always means better"
  - Mid-session: "Fake signals should cost nothing" (missing the marginal cost concept)
  - Late session: "Differential cost means good signallers pay more" (they might miss that good signallers pay less per unit benefit)

  The assessment question needs to test conceptual transfer, not memorization. Maybe present a new scenario like deer antler regrowth after injury and ask why a predator might ignore it - forcing application of differential cost logic.

  I'll explicitly avoid discussing Zahavi's original formulation or genetic correlations at this level - those are refinements for later study. Stating these boundaries upfront prevents tangent discussions.

  For social science connections, I'll hint at education signals but not dive deep - the priority is establishing the biological mechanism first. The Rolex example can reappear at the end to show interdisciplinary relevance once the core concept is solid.

  The whiteboard progression should flow from problem setup to mechanism to implications, with each misconception addressed at its likely emergence point. Ending with that deer antler question will reveal if they truly grasp differential costs versus just memorizing the crab example.
answer: |-
  Here’s a structured 90-minute whiteboard session plan targeting conceptual inversion, with timing, misconception traps, and strategic choices:

  ---

  ### **Pre-Session Prep**
  - **Whiteboard Layout:** Divide into 3 columns: *Problem*, *Mechanism*, *Examples*.  
  - **Start with Poll:** *"Why is a peacock’s tail 'honest'?"* Record answers verbatim (e.g., "costly," "wasteful," "only strong can afford").

  ---

  ### **Session Sequence**  
  **Phase 1: Problem Setup (20 min)**  
  1.  **Signal Reliability Puzzle (5 min):**  
      - Q: *"Why can’t all animals (or humans) fake being high-quality? Why don’t weak peacocks grow huge tails?"*  
      - Anchor to student answers: Highlight *cost* as necessary but insufficient.  
      - **Pin misconception #1:** "Cost alone guarantees honesty." *(Counter: Scam emails are costly but unreliable.)*  

  2.  **Introduce Key Players (10 min):**  
      - **Signaller:** Peacock, job applicant, Rolex buyer.  
      - **Receiver:** Peahen, employer, social group.  
      - **Conflict:** Signaller benefits from bluffing; receiver benefits from truth.  
      - **Core Question:** *"When should a receiver trust the signal?"*  

  3.  **The Failure of Fixed Costs (5 min):**  
      - Example: *"Suppose growing a tail costs 5 energy units. All peacocks pay 5. Can weak ones cheat?"* → Yes.  
      - **Pin misconception #2:** "Higher absolute cost = more reliable." *(Counter: If all pay equally, fakers thrive.)*  

  **Phase 2: Mechanism - Differential Costs (40 min)**  
  4.  **Fiddler Crab Case (15 min):**  
      - **Story:** Original claw (heavy, sturdy) vs. regrown claw (light, fragile). Same length, *but*:  
        - Cost to wave: Low for strong crab, **high for weak crab** (fatigue/predation risk).  
      - **Crucial Flip:** *"It’s not about cost paid by the honest—it’s about **extra cost suffered by liars**."*  
      - **Whiteboard:** `Signal Cost(High-Quality) < Cost(Low-Quality)`  
      - **Obscured:** Genetic quality (use crab for behavioral cost only; drop peacock here).  

  5.  **Contrast with Peacock (10 min):**  
      - **Salvage? Briefly, but reframe:**  
        - *"Peacock tails are costly, but the key is that cost **scales with condition**. Sick peacock pays more (in survival) than healthy one."*  
      - **Why drop as primary example:** Condition-dependence is invisible; crabs show *marginal cost difference* via regrowth.  

  6.  **Social Science Hook (10 min):**  
      - Example: **Academic degrees.**  
        - Cost (time/$) is equal for all, but...  
        - *Differential cost:* High-ability student sacrifices less leisure/effort to earn degree.  
      - **Pin misconception #3:** "This justifies inequality." *(Clarify: It explains reliability, not fairness.)*  

  7.  **Formalize the Principle (5 min):**  
      - **Rule:** A signal is reliable if low-quality signallers pay **disproportionately higher costs** to fake it.  
      - **Slogan:** *"Handicaps screen liars, not heroes."*  

  **Phase 3: Implications & Traps (20 min)**  
  8.  **Cheap Signals Can Work! (10 min):**  
      - Example: **Bird begging calls.**  
        - Weak chicks pay higher cost (predation risk/energy) to beg loudly vs. strong chicks.  
        - Signal is "cheap" energetically but reliable due to differential risk.  

  9.  **Costly ≠ Reliable (5 min):**  
      - Counterexample: **$1M diamond collar on a sick show dog.**  
        - Costly? Yes. Honest? No—any dog can wear it.  
        - *"Cost without differential vulnerability = worthless signal."*  

  10. **Final Misconception Patrol (5 min):**  
      - **Pin misconception #4:** "Good signallers 'want' to pay high costs." *(No: They minimize costs; liars are forced out.)*  
      - **Pin misconception #5:** "This only applies to biology." *(Reiterate degree/Rolex: Rolex is reliable if forgery is harder for poor people, not if it’s just expensive.)*  

  **Phase 4: Assessment & Wrap-Up (10 min)**  
  11. **Diagnostic Question (5 min):**  
      - *"A species of bird has males that build elaborate nests. After a forest fire, injured males build nests of the same size as healthy rivals—but they use lighter sticks. Why might females ignore these nests?"*  
      - **Check for:**  
        ✓ Mention of *lowered cost* for injured males.  
        ✓ Recognition that *absolute size* is maintained, but *differential cost* is reduced.  

  12. **Refuse to Engage (Announced):**  
      - *"We won’t discuss Zahavi’s 'strategic choice' vs. 'condition-dependent' models, genetic correlations, or Fisherian runaway today. Those are refinements for advanced study."*  

  ---

  ### **Why Fiddler Crab > Peacock Here**  
  - **Crab reveals:**  
    ✅ Identical signal form (claw length) with hidden cost difference.  
    ✅ Marginal cost (waving) is higher for low-quality.  
    ✅ **Active obscuration:** Genetic quality (irrelevant for core mechanism).  
  - **Peacock conceals:**  
    ❌ Cost differences are inferred, not observable.  
    ❌ Popular narrative reinforces "cost=honesty" per se.  

  ### **Expected Misconception Timeline**  
  | Timing          | Misconception                          | Intervention                                                                 |  
  |-----------------|----------------------------------------|-----------------------------------------------------------------------------|  
  | Start (0 min)   | Cost alone ensures honesty.            | Scam email counterexample.                                                 |  
  | Phase 1 (15 min)| Higher absolute cost = more reliable.  | Fixed-cost thought experiment (all pay same = cheating).                   |  
  | Phase 2 (40 min)| Good signallers "pay more" willingly.  | Emphasize: They pay *less* per unit of signal.                             |  
  | Phase 3 (60 min)| Cheap signals are always unreliable.   | Begging call example (low energy cost, high differential risk).            |  

  ### **Key Outcome Metrics**  
  - Success: Students use "differential cost" unprompted in the diagnostic question.  
  - Partial: They cite crab example but miss transfer to new cases.  
  - Failure: They default to "signals are honest when costly."  

  This structure forces cognitive conflict with pre-held views, replaces peacocks with crabs for mechanistic clarity, and isolates the core innovation: **Reliability emerges from the liar’s disadvantage, not the hero’s sacrifice**.
