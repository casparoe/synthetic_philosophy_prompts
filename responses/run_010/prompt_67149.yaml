prompt: |-
  My dissertation adviser has handed down, over a decade of seminars and margin comments, a running series of verdicts on what a scientific realist is entitled to retain from theories that have been superseded. She has now been invited to a workshop at which the same question will be put to her about a live theory, and I would like to predict her answer before she gives it. Her verdicts to date, recorded as carefully as I can manage:

  1. Caloric theory: nothing is retained. Her stated reason is not the usual one. She does not deny that heat-exchange mathematics survived; she denies that what survived was distinctively caloric's. The bookkeeping was available as phenomenology about measured quantities before and after the fluid hypothesis, and no part of the fluid story is load-bearing for the successes caloric theory actually enjoyed.

  2. Phlogiston theory: partly retained, against her colleagues' habit of treating it as a total loss. What she thinks carried over is that combustion involves the transfer of a substance between the burning body and its surroundings rather than a rearrangement of the body's own parts alone. Lavoisier reversed the direction of the transfer.

  3. Ptolemaic astronomy: nothing retained, notwithstanding the accuracy. Her reason is a clause she applies nowhere else quite so bluntly: the eccentrics and epicycles were offered by their own practitioners as devices for reproducing appearances, and a component nobody was prepared to assert cannot be vindicated by a successor.

  4. Fresnel's wave theory: the wave equation and what follows from it are retained; the elastic medium that was supposed to be waving is not.

  5. Newtonian gravitation: retained as the limiting form of the field equations; not retained as to absolute space or instantaneous action at a distance.

  6. Daltonian atomism: retained as to discrete, element-specific units combining in fixed mass ratios; not retained as to indivisibility.

  7. Electrons: retained outright. This is her standing illustration of a difference she thinks the literature underweights — between a theory's being well confirmed and its objects' having become available for use. We stopped reasoning about electrons and started steering them.

  8. The luminiferous ether as the seat of electromagnetic stress: not retained, even though the equations were first written down inside that picture. Her gloss is that being written inside a framework is not being derived from it; nothing corresponding to stresses and strains in a material medium appears anywhere downstream.

  9. Continental drift, assessed as of the early 1930s: a realist at the time was entitled to the claim that the continents have shifted relative to one another and was entitled to no claim whatever about what shifted them. She stresses the second half of this verdict as much as the first: the existence of live and respectable rivals — contractionist accounts, land bridges — narrowed what could responsibly be claimed without making suspension of belief the only permissible posture.

  The case she will be asked about is the dark matter hypothesis in its present state, and the workshop organizers have deliberately split it into three levels:

  (a) the bulk claim, that most of the matter in the universe is not composed of standard-model particles and interacts with them appreciably only gravitationally;
  (b) the dynamical characterization, that this matter is stable over cosmological timescales, is already moving non-relativistically when structure begins to form, and does not dissipate or radiate the way baryonic gas does — in other words, exactly the properties that are programmed into the collisionless-fluid simulations that reproduce observed large-scale structure;
  (c) the particle claim, that the matter consists of one or more new elementary species produced thermally in the early universe, with the weak-scale cross sections and GeV-to-TeV masses that the WIMP hypothesis proposes and that supersymmetry's lightest stable particle would supply.

  Three features of the case seem to me to matter, though I cannot tell which way they cut. First, nothing at any level has been manipulated: the direct-detection programs have found nothing, and the entire evidential base is gravitational behavior of astrophysical systems observed from outside. Second, there is a live and technically sophisticated rival family — relativistic modifications of gravity — that reproduces galaxy rotation curves with no extra matter at all, while straining on the ratio of the acoustic peaks in the cosmic microwave background and on the observed offset between the lensing mass and the collisional gas in merging clusters. Third, practitioner avowal is split at level (a) in a way it is not for electrons or for Fresnel's waves: most cosmologists talk about dark matter as a stuff, but a substantial minority of phenomenologists treat the phrase as a label for a residual in the field equations, a parameterization of an anomaly rather than the naming of a constituent, and the simulations themselves are neutral between the two readings.

  What I would like from you is the following, in this order.

  First, reconstruct the candidate rules that are consistent with her nine verdicts. I expect there to be at least three, and I expect them to differ not merely in generosity but in kind. For each, say which verdicts it is doing the real work on, and identify the verdict it accommodates most awkwardly or has to bend. Note explicitly whether any of the rules is even defined for a theory that has no successor yet, and what each has to become in order to handle a present-day case rather than a historical one.

  Second, state what each candidate rule predicts at each of the three levels (a), (b), and (c). Where a rule yields different verdicts at different levels, explain what in the level triggers the difference.

  Third, give me your single best guess at what she will say, with the reasons for preferring that rule over the others given her track record — not given the plausibility of the rule in the abstract.

  Fourth, tell me honestly whether the nine verdicts genuinely underdetermine this case. If they do, say what commitment she would be adopting, whether or not she means to, by ruling one way rather than another, and identify which of her existing verdicts would come under strain from that adoption.

  Fifth, name a further case she has not ruled on — historical or contemporary — that would best discriminate among the candidate rules you have reconstructed, and say how each rule would resolve it.

  Please write the answer in American English. I am after the reasoning rather than the references, so do not include a bibliography, a reference list, or named attributions for the positions you identify; describe the rules in your own terms.
reasoning: |-
  Hmm, the user has presented a complex philosophical puzzle about scientific realism, drawing from their dissertation adviser's historical verdicts on superseded theories. They want me to predict how the adviser would judge the current dark matter hypothesis across three levels of specificity. This requires careful reconstruction of implicit rules from nine case studies, application to a live theory, and meta-analysis of the reasoning process.

  The nine verdicts show fascinating patterns. For caloric and Ptolemaic theories, nothing was retained because either the math wasn't uniquely tied to the ontology (caloric) or the models were openly instrumental (Ptolemy). Phlogiston and continental drift show partial retention where core structural claims survived despite ontological errors. Fresnel, Newton, and Dalton demonstrate how mathematical frameworks persist while ontological commitments get discarded. Electrons stand alone as fully retained because we manipulate them directly. The ether case rejects retention despite mathematical continuity because the ontology left no trace.

  I see at least three distinct candidate rules emerging:
  1) The Manipulation Criterion: Retention requires direct experimental manipulation (explaining electrons but straining on continental drift).
  2) The Structural Continuity Rule: Retention depends on mathematical/structural elements persisting in successors (explaining Fresnel/Newton but struggling with caloric).
  3) The Practitioner Intent Standard: Retention follows whether original theorists took their models realistically (saving Ptolemy but conflicting with ether).

  For dark matter's three levels:
  - Level (a) Bulk claim: All rules might reject retention since no manipulation exists and practitioner intent is split.
  - Level (b) Dynamical characterization: Structural continuity could retain this as successful parameterization.
  - Level (c) Particle claim: All rules likely reject due to lack of evidence and live rivals.

  The structural continuity rule seems strongest given her emphasis on mathematics in Fresnel/Newton and her allowance for partial claims in phlogiston/continental drift. This would predict retention only at level (b) - the phenomenological characterization. 

  The verdicts do underdetermine the case, particularly regarding how to weigh the MOND rivalry and split practitioner intent. Adopting structural continuity here might retrospectively strain her caloric verdict, where she dismissed mathematical continuity.

  A good discriminator case would be 19th-century atomic chemistry before direct evidence: Structural continuity would retain the combining ratios; manipulation would reject entirely; practitioner intent might split depending on whether chemists like Dalton believed atoms literally.

  The user's deep engagement with their adviser's philosophy suggests this prediction matters for their own scholarly positioning. I'll structure the response to mirror their rigorous approach while keeping the focus on reasoning over citations.
answer: |-
  Based on your adviser's nine verdicts, I reconstruct three distinct candidate rules governing what a scientific realist is entitled to retain from superseded theories. These rules differ in their core justifications and have varying applicability to a live theory like dark matter.

  **First: Candidate Rules & Their Fit to Verdicts**

  1.  **Rule 1: The Structural Success Rule**
      *   **Core Principle:** What is retained is the *mathematical structure or core dynamical relationships* that demonstrably generated the successful predictions of the theory, provided this structure is genuinely *required* for those successes and survives in the successor theory. Ontological claims are retained *only* if they are directly embedded in this persisting structure and vindicated by it.
      *   **Work Done On:** Fresnel (wave equation retained, medium not), Newton (gravitational field equation limit retained, absolute space/instantaneous action not), Dalton (mass ratios/combining rules retained, indivisibility not), possibly Phlogiston (transfer *relationship* retained, direction/substance not).
      *   **Awkward Fit:** Caloric (dismisses surviving math as phenomenological bookkeeping, not distinctively caloric), Ptolemaic (dismisses models despite accuracy because practitioners didn't assert them realistically), Ether (dismisses equations despite originating in the framework). It struggles most with **Ptolemaic** – the structure *was* successful and the math *did* survive (in Kepler/Copernicus), but the rule fails because practitioner intent overrides.
      *   **Live Theory Application:** The rule *can* be applied tentatively. It becomes: "What core mathematical structures/dynamics in the *current* theory are demonstrably load-bearing for its empirical successes *now*?" It focuses on identifying indispensable structure within the theory's *own* explanatory framework for its *current* achievements.

  2.  **Rule 2: The Manipulability/Interactionist Rule**
      *   **Core Principle:** What is retained is the posited *entity or process* only once it becomes an object of direct experimental manipulation or interaction (beyond just inference from its gravitational or large-scale effects). Abstract structural claims without this interactive component are less secure. The "steering" marks the threshold.
      *   **Work Done On:** Electrons (retained outright due to steering), Continental Drift (relative motion retained *only* because it was indirectly measurable via geology/paleontology – *not* manipulation of the cause), Dalton (retained mass ratios – a structural feature, not manipulable atoms). It explains the stark difference between Electrons and others.
      *   **Awkward Fit:** Fresnel (retains wave equation – structural, not manipulable ether), Newton (retains limiting equations – structural, not manipulable absolute space), Phlogiston (retains transfer relationship – structural). It struggles most with **Fresnel** – the wave equation is retained despite no manipulable medium.
      *   **Live Theory Application:** The rule *can* be applied. It becomes: "Can the entities/processes posited by the *current* theory be *directly manipulated or interacted with experimentally* (beyond gravitational inference)?" If not, ontological commitment is unwarranted, though structural features might still be pragmatically useful.

  3.  **Rule 3: The Practitioner Assertion & Rivalry Rule**
      *   **Core Principle:** What is retained depends crucially on what practitioners *genuinely asserted as real* about the world, not just calculational devices. Furthermore, the *existence of live, sophisticated rivals* constrains what can be responsibly asserted as real *at the time*, even for successful theories. Retention applies only to claims that were both asserted and not undermined by viable alternatives.
      *   **Work Done On:** Ptolemaic (nothing retained because eccentrics/epicycles were not asserted), Continental Drift (relative motion asserted & no rival *fully* explained it; mechanism *not* asserted & had rivals, so not retained), Caloric (fluid story not load-bearing, so not asserted in a way that survives), Ether (stresses/strains not asserted downstream). Phlogiston (transfer was asserted).
      *   **Awkward Fit:** Fresnel (wave equation retained even if practitioners asserted the ether – the *equation* isn't an "assertion" in the same way), Newton (limiting equations retained, though absolute space was asserted). It struggles most with **Fresnel** – the wave equation is retained despite being developed *within* an asserted ontological framework (ether) that was discarded.
      *   **Live Theory Application:** The rule *can* be applied. It becomes: "What core claims of the *current* theory are practitioners *genuinely asserting as real descriptions of the world* (not just convenient parameterizations)? And how do *current live, sophisticated rivals* constrain what can responsibly be asserted?" It focuses on sociological and dialectical context.

  **Second: Predictions for Dark Matter Levels**

  *(a) Bulk Claim (Non-SM matter, gravitationally interacting)*

  *   **Rule 1 (Structural Success):** **Likely Not Retained.** The claim is currently *inferred* to solve gravitational anomalies. While successful *so far*, it's not clear if this specific *structure* (extra mass) is uniquely load-bearing *within its own framework* compared to alternatives like modified gravity. Rivals exist. It's more like a parameter than an indispensable structural feature *yet*. (Awkwardly similar to Caloric's fluid).
  *   **Rule 2 (Manipulability):** **Not Retained.** Dark matter has not been directly manipulated or interacted with non-gravitationally. Detection efforts have failed. It remains inferred solely from gravitational effects.
  *   **Rule 3 (Assertion/Rivalry):** **Ambiguous, Leaning Not.** Practitioner avowal is split ("stuff" vs. "residual"). The existence of sophisticated MOND-like rivals *directly constrains* what can be responsibly asserted as real without evidence beyond gravity. "Most of the matter is non-SM stuff" is contested internally and externally.

  *(b) Dynamical Characterization (Collisionless, CDM-like fluid properties)*

  *   **Rule 1 (Structural Success):** **Likely Retained (as Phenomenology).** The specific *dynamical behavior* programmed into simulations (cold, collisionless, non-dissipative, non-relativistic at structure formation) *is* demonstrably load-bearing for the success of those simulations in reproducing large-scale structure. This phenomenological description *works* for its purpose, regardless of the underlying cause (DM particles or modified gravity). (Similar to surviving heat-exchange math, but *is* distinctively tied to the DM *framework's* solution).
  *   **Rule 2 (Manipulability):** **Not Retained (as Ontology).** The characterization describes inferred *behavior*, not a manipulable entity. However, the *parameterization itself* might be pragmatically retained as useful.
  *   **Rule 3 (Assertion/Rivalry):** **Likely Retained (as Phenomenology/Behavior).** Practitioners widely assert the *need* for matter/fields *behaving* this way to fit observations, even if some debate its fundamental nature. Rivals must also account for this *behavioral requirement*. The *description of the required dynamics* seems robustly asserted.

  *(c) Particle Claim (WIMPs, specific masses/cross-sections)*

  *   **Rule 1 (Structural Success):** **Not Retained.** The *specific particle hypothesis* (WIMPs, SUSY LSP) is not demonstrably load-bearing for the *current* successes. The successes (large-scale structure, CMB peaks, cluster dynamics) are achieved by the *dynamical characterization* (level b). Specific particle properties are speculative add-ons not yet confirmed by unique predictions derived *from them*. (Similar to Ether stresses - not downstream).
  *   **Rule 2 (Manipulability):** **Not Retained.** No direct detection or manipulation of such particles.
  *   **Rule 3 (Assertion/Rivalry):** **Not Retained.** While many practitioners *hope* for this, the specific particle claims are far less uniformly asserted than the bulk/dynamical need. They are highly speculative given null results and rivals. Sophisticated rivals (modified gravity) explicitly deny the need for *any* such particles.

  **Third: Best Guess for Her Answer**

  **Best Guess Rule:** **Rule 1 (Structural Success) is doing the heaviest lifting**, supplemented significantly by considerations from **Rule 3 (Assertion/Rivalry)** regarding responsible assertion in the face of rivals, especially for ontological claims.

  *   **Level (a):** **Not Entitled.** Analogous to Caloric. The "bulk matter" claim is the core postulate, but it's currently just a parameterization of anomalies (like caloric fluid), not demonstrably an indispensable structural feature *within its own framework* for the successes, especially given sophisticated rivals (like Lavoisier for Phlogiston). The split avowal weakens its status as a load-bearing assertion. (Phlogiston transfer survived because it *was* structurally load-bearing and asserted; Caloric fluid wasn't).
  *   **Level (b):** **Entitled to the Phenomenological Characterization.** Analogous to the wave equation or Newton's limit. The *specific dynamical behavior* (cold, collisionless fluid) *is* demonstrably load-bearing in simulations achieving key successes (large-scale structure). This is the robust, indispensable *structural core* of the current "dark matter framework" for those successes, regardless of the ultimate ontology. (Fresnel's math survived the ether; Newton's math survived absolute space; the CDM dynamics would survive even if the cause is modified gravity fields behaving *as if* CDM). Practitioner consensus on needing *something* behaving this way reinforces this.
  *   **Level (c):** **Not Entitled.** Analogous to the ether's material stresses or indivisible atoms. The specific particle hypothesis (WIMPs) is not required for the current successes explained by level (b). It's an auxiliary hypothesis lacking unique confirmatory evidence (direct detection null, rivals) and not uniformly asserted. (Ether stresses gone, Newton's instantaneous action gone).

  **Why Rule 1 (+ Rule 3 elements) over others:**
  *   **Fits Best:** Explains Fresnel (math retained, ontology not), Newton (math retained, ontology not), Dalton (structural rules retained, indivisibility not), Phlogiston (structural relationship retained, substance/direction not). The key is identifying the *indispensable structure generating success*.
  *   **Explains Awkward Cases:** Handles Ptolemaic (practitioners *didn't assert* the devices as real structure, only as tools) and Caloric (the fluid wasn't structurally load-bearing for the math that worked) by incorporating the Rule 3 insight about assertion/load-bearing. Explains Continental Drift (relative motion was the asserted, structurally load-bearing claim without rivals; mechanism wasn't) by combining structural success with rivalry context.
  *   **Handles Electrons:** While Rule 2 explains Electrons best, Rule 1 can accommodate it: direct manipulation *confirms* the entity posited by the structural/dynamical theory, vindicating the ontology embedded in the structure. "Steering" is the ultimate demonstration of the structure's reality.
  *   **Coherence:** It provides a consistent rationale across most cases, emphasizing what *worked* and *persisted mathematically/structurally*, moderated by whether the component was genuinely asserted/load-bearing (Rule 3 element). Rule 2 struggles with retaining non-manipulated structures (Fresnel, Newton math). Rule 3 alone struggles with retaining mathematical structures not "asserted" in the same way as entities (Fresnel wave equation).

  **Fourth: Underdetermination and Commitments**

  *   **Yes, the verdicts underdetermine the dark matter case.** Rules 1, 2, and 3 yield different predictions, especially at levels (a) and (b). The key tensions are:
      1.  **The Status of Gravitational Inference:** Is inferring "matter" solely from gravity sufficient for retention (like Continental Drift motion)? Or is it analogous to Caloric fluid, where the inference wasn't load-bearing? Rule 1 & 3 lean towards caution (like Caloric), while Rule 2 explicitly requires more than gravity.
      2.  **Weighing Rivals:** How much does the existence of MOND-like rivals constrain entitlement? Rule 3 explicitly incorporates this, strongly limiting level (a). Rule 1 implicitly incorporates it via "load-bearing within its own framework". Rule 2 ignores it.
      3.  **Phenomenology vs. Ontology:** How to treat the successful simulations (level b)? Rule 1 sees the *dynamics* as retainable structure. Rule 2 sees it as useful but non-ontological. Rule 3 sees it as an assertable behavioral requirement.

  *   **Commitment by Choosing a Rule:**
      *   Choosing **Rule 1** (especially retaining level b) implicitly strengthens the **Structural Realist** commitment seen in Fresnel and Newton. It suggests successful mathematical structure, even phenomenology, has robust realist import.
      *   Choosing **Rule 2** commits strongly to an **Entity Realism** tied to experimental interaction. This elevates the Electron case but downplays the significance of structural success without manipulation (straining Fresnel/Newton).
      *   Choosing **Rule 3** commits strongly to a **Dialectical/Sociological Realism**, where community consensus and the absence of rivals are crucial for warranted assertion (highlighting Continental Drift and Ptolemy).

  *   **Strained Verdict:**
      *   If she **retains level (a)** (bulk matter), it would significantly strain her **Caloric verdict**. Both posit an inferred substance to explain phenomena, but she rejected Caloric fluid as non-load-bearing. Retaining DM bulk matter would require distinguishing why gravitational inference of matter is fundamentally different from thermal inference of fluid, despite similar evidential bases (effects) and sophisticated rivals in both cases.
      *   If she **rejects level (b)** (the dynamical characterization), it would strain her **Fresnel and Newton verdicts**. Rejecting the successful CDM simulation dynamics as merely useful phenomenology, not something retainable, would be analogous to rejecting the wave equation or Newton's limit. Her verdicts strongly suggest she sees such successful, load-bearing mathematical structures as having lasting significance.

  **Fifth: Discriminator Case**

  *   **Best Discriminator Case:** **19th Century Atomic Chemistry (pre-1905)**
      *   **Context:** After Dalton, atomic theory was highly successful in explaining combining proportions, isomerism, etc. (structural success). Atoms were widely asserted by chemists as real entities. However, there were sophisticated rivals (e.g., energeticists like Ostwald) who denied atoms, arguing chemistry could be done purely energetically/phenomenologically. Crucially, atoms were *not* directly manipulated or individually observed; evidence was indirect (chemical behavior, kinetic theory, Brownian motion not yet decisive).
  *   **How Rules Resolve It:**
      *   **Rule 1 (Structural Success):** **Retains core structural claims.** The laws of definite/multiple proportions, valency, and the kinetic theory explanations of gas laws are demonstrably load-bearing structural features generating the theory's successes. The *existence* of atoms as discrete entities is retained as embedded in this structure (unlike indivisibility). Rivals exist but don't negate the structural success *within* the atomic framework.
      *   **Rule 2 (Manipulability):** **Not Entitled to Atoms as Entities.** No direct manipulation or interaction with individual atoms occurred pre-1905 (Brownian motion analysis by Einstein/Smoluchowski ~1905 is often seen as the key step towards manipulability). Chemistry is inferred from bulk behavior. Only structural/phenomenological claims (ratios, valency rules) might be pragmatically retained.
      *   **Rule 3 (Assertion/Rivalry):** **Ambiguous, Leaning Retained.** Atoms were widely and robustly asserted by leading chemists/physicists despite Ostwald's rival. The rival was sophisticated but arguably failing to match the explanatory scope of the atomic hypothesis (especially kinetic theory). The core claim of discrete, element-specific units is likely retained because it was asserted and the rival less successful/persuasive. However, the *intensity* of the rivalry might slightly temper the strength of the entitlement compared to undisputed cases.
