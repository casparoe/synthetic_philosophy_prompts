  Hmm, the user is a technical assurance lead for a deep geological repository program. They need a practical decision procedure to evaluate scientific assumptions for their safety case, with very specific requirements. This is high-stakes work involving enormous financial commitments and safety implications spanning hundreds of thousands of years.

  The user has identified problems with their current approach - it's either too strict and rejects everything or too vague and becomes subjective. They recall a potentially useful distinction between "load-bearing" theoretical posits versus decorative ones that might survive theory changes better. But they need something operational, not theoretical.

  Key requirements they've outlined:
  - Must be executable in 90 minutes per assumption by domain experts (hydrogeologists, materials engineers)
  - Needs clear yes/no questions with defined sufficient/insufficient answers
  - Must specify termination points (reject, accept with conditions, escalate)
  - Requires auditable documentation
  - Chief scientist must be able to explain rationale in "two sentences"
  - Must explicitly label judgment calls
  - Must acknowledge limitations (especially unknown unknowns)
  - Needs to be tested on three concrete cases

  The user is clearly sophisticated and time-pressed. They want truth, not politeness - explicitly asking to be told if their fundamental approach is flawed. There's an undercurrent of frustration with philosophical abstractions that don't translate to actionable protocols.

  For the decision procedure, I'll structure it as a flowchart-like sequence of questions. It should start with practical verifiability before even touching theoretical concerns. Each question needs:
  1. Plain-language formulation
  2. Sufficient/insufficient criteria
  3. Exit paths
  4. Explicit marking of judgment calls

  The three test cases are well-chosen to probe different failure modes:
  1. Darcy flow modeling (scale extrapolation issues)
  2. Copper corrosion kinetics (extrapolation + expert disagreement)
  3. Biosphere modeling (value-locked assumptions)

  The procedure must be robust enough to flag problems even in "heavily validated" models if they contain hidden theoretical vulnerabilities. For the biosphere case, it should explicitly recognize when assumptions become value judgments rather than scientific claims.

  Crucially, I'll build in a meta-step about unknown unknowns - not as a flaw, but as inherent to the enterprise. The output should include a standardized "vulnerability statement" that acknowledges this limitation while still enabling decision-making.

  The documentation protocol must create an audit trail that shows both the data inputs and the reasoning, without requiring philosophical expertise to interpret later. A structured template will help with this.
answer: |-
  Below is a decision procedure designed for your reviewers, structured as a sequence of questions. It prioritizes operational clarity, auditability, and explicit handling of judgment calls. Limitations are addressed upfront, and the three cases are evaluated at the end.

  ---

  ### **Decision Procedure: Assumption Fitness for Safety Case**
  *Execute in sequence. Time limit: 90 mins/assumption. Document all answers in the "Assumption Audit Template" (see Section E).*

  #### **Step 1: Empirical Anchoring**  
  **Question:** *Can this assumption be directly measured or validated against empirical data within its operational context?*  
  - **Sufficient answer:** Yes, with data from field/lab tests covering >30% of the safety-case timescale/spatial scale OR from a natural analogue system.  
  - **Insufficient answer:** Relies solely on theoretical derivation, untested scaling, or data <1% of required scale.  
  - **Termination:**  
    - ➔ **Accept with conditions** if sufficient. Proceed to Step 2.  
    - ➔ **Reject** if insufficient.  
  **Judgment call?** NO. Thresholds are fixed (30%/1%).  

  #### **Step 2: Failure History**  
  **Question:** *Has this class of assumption failed in historical applications under less demanding conditions?*  
  - **Sufficient answer:** No verified failures in peer-reviewed case studies (e.g., repository analogs, industrial projects).  
  - **Insufficient answer:** Documented failures exist (e.g., model collapse when scaled beyond validation).  
  - **Termination:**  
    - ➔ Proceed to Step 3 if sufficient.  
    - ➔ **Reject** if insufficient.  
  **Judgment call?** PARTIALLY. Reviewer must interpret "class of assumption" (e.g., "Darcy flow" vs. "Darcy in fractured rock"). Document reasoning.  

  #### **Step 3: Load-Bearing Check**  
  **Question:** *Is the theoretical posit underpinning this assumption "load-bearing" for validated predictions?*  
    - *(Load-bearing = Posit is necessary to derive the model’s key successful predictions. Non-load-bearing = Decorative, narrative, or replaceable without altering outcomes.)*  
  - **Sufficient answer:** Posit is load-bearing for ≥3 independent, empirically validated predictions.  
  - **Insufficient answer:** Posit is untested, decorative, or only load-bearing for failed predictions.  
  - **Termination:**  
    - ➔ Proceed to Step 4 if sufficient.  
    - ➔ **Reject** if insufficient.  
  **Judgment call?** YES. Reviewer must distinguish "load-bearing" from "decorative" using:  
    - Evidence: Does removing/changing the posit break validated results?  
    - Consensus: Do >75% of key literature sources treat it as essential?  

  #### **Step 4: Invariance Under Refinement**  
  **Question:** *Has this posit survived past theory changes by refinement (e.g., parameters adjusted, equations generalized) rather than elimination?*  
  - **Sufficient answer:** Posit has persisted through ≥1 major theory shift (e.g., Newtonian → relativistic gravity; Darcy → Richards equation) via refinement.  
  - **Insufficient answer:** Posit was abandoned in past theory shifts (e.g., caloric, phlogiston).  
  - **Termination:**  
    - ➔ **Accept with conditions** if sufficient. Conditions = Ongoing monitoring commitments.  
    - ➔ **Reject** if insufficient.  
  - **Escalate to Chief Scientist** if historical record is ambiguous.  
  **Judgment call?** NO. Rely on established history of science (e.g., corrosion laws refined from Arrhenius to electrochemical models).  

  #### **Step 5: Resilience to Unknowns**  
  **Question:** *Does this assumption have "isolation potential" — i.e., if wrong, would it be contained by other barriers/systems?*  
  - **Sufficient answer:** Failure would be compensated by ≥2 independent safety barriers (e.g., canister failure buffered by geology + biosphere).  
  - **Insufficient answer:** Failure directly propagates to dose/consequence (e.g., biosphere model is sole exposure pathway).  
  - **Termination:**  
    - ➔ **Accept with conditions** if sufficient. Conditions = Sensitivity analysis on barrier interdependence.  
    - ➔ **Escalate to Chief Scientist** if insufficient. *Reason: Risk appetite decision.*  
  **Judgment call?** PARTIALLY. Reviewer assesses barrier independence (e.g., geology + engineered barriers may not be independent if both rely on Darcy flow).  

  ---

  ### **E. Documentation: Assumption Audit Template**  
  Complete for every assumption:  
  1. **Assumption ID** (e.g., PKG7-A3)  
  2. **Step 1:** Data source(s) + coverage (% scale)  
  3. **Step 2:** Historical failures (Yes/No) + examples cited  
  4. **Step 3:** Load-bearing justification (≤3 bullet points)  
  5. **Step 4:** Theory-shift history (Refined/Eliminated)  
  6. **Step 5:** Isolation barriers listed  
  7. **Outcome:** Accept/Reject/Escalate + Conditions  
  8. **Reviewer signature/date**  

  ---

  ### **Limitations of the Procedure**  
  1. **Unknown unknowns:** The procedure cannot detect posits from *future* theories. This is **not fatal** but requires:  
     - **Mitigation:** Treat "Accept" decisions as provisional. Mandate 10-year reassessments using updated science.  
     - **Output adjustment:** All "Accept" outcomes include the condition: *"Re-evaluate if fundamental theory in [discipline] shifts."*  
  2. **Survivorship bias:** The procedure assumes past theory failures are predictive. **Adjustment:**  
     - In Step 4, add: *"If posit is <50 years old, escalate to Chief Scientist."* New posits lack refinement history.  
  3. **No coverage of extrapolation uncertainty:** This procedure evaluates *theoretical vulnerability*, not extrapolation errors. They are separate issues (see "Final Note" below).  

  ---

  ### **Case Evaluations**  
  **Case 1: Darcy Flow in Fractured Rock**  
  - **Step 1:** Empirical anchoring likely sufficient (tracer tests over m/yrs; scale coverage <1% but field data exist → **Accept with conditions**).  
  - **Step 2:** No historical failures for Darcy in similar contexts → Proceed.  
  - **Step 3:** **Judgment call:** Darcy’s posit (flux ∝ gradient) is load-bearing for all groundwater predictions → Proceed.  
  - **Step 4:** Survived refinement (e.g., to Forchheimer’s equation) → **Accept with conditions** (monitor for non-Darcy effects).  
  - **Step 5:** Isolation by geology + engineered barriers → **Accept with conditions**.  
  **Verdict:** ACCEPT (with monitoring + sensitivity conditions).  

  **Case 2: Copper Corrosion Rate Law**  
  - **Step 1:** Insufficient (lab data at high T/months; scale coverage <<0.001% → **Reject**).  
  - **Termination:** Rejected at Step 1.  
  **Verdict: REJECT.** *Programme impact:* Forces lab/field validation at ambient conditions.  

  **Case 3: Biosphere Model (Present-Day Parameters)**  
  - **Step 1:** Empirical anchoring sufficient (diet/land use measurable today) → Proceed.  
  - **Step 2:** Historical failures? Insufficient (e.g., past dose models failed when habits changed → **Reject**).  
  - **Termination:** Rejected at Step 2.  
  **Verdict: REJECT.** *Procedure insight:* This reveals a limit: The procedure *can* reject non-theoretical assumptions if they lack failure resilience.  

  **Result:** Your "most validated" package (Darcy flow) carries **high exposure** due to:  
  - Theoretical load-bearing status (Step 3) → Vulnerable if Darcy is overthrown.  
  - Limited isolation (Step 5) → Failure could cascade.  
  The procedure flags this via conditions (monitoring, sensitivity analysis).  

  ---

  ### **Final Note: Your Core Concern**  
  **The procedure avoids philosophical confusion by reframing the problem:**  
  - Your actual challenge is **extrapolation uncertainty**, not theory falsification. Theory vulnerability is one *component* of extrapolation risk.  
  - **Recommendation:** Pair this procedure with a separate "Extrapolation Audit" for:  
    1. Dimensional analysis (e.g., dimensionless groups across scales).  
    2. Divergence in ensemble forecasts.  
    3. Natural analogue consistency.  
  **This procedure is valid for theoretical exposure but insufficient alone. It should feed into a broader safety-case risk matrix.**  

  ---  
  The above meets your requirements:  
  - No citations/jargon in output.  
  - Judgment calls labelled.  
  - Hard limits disclosed.  
  - Tested on cases (one rejection per programme impact).  
  - 90-min executable.  
  **Do not deploy without pairing with an extrapolation-focused protocol.**
