prompt: |-
  Two months ago I took over as director of a regional folk-song archive, and my first commission is a small travelling exhibit built on our ballad collection: some four hundred variant texts of thirty-odd ballads, taken down from singers between the 1930s and the 1970s, a great many of them from people who insisted they had learned a song once only, from one other person, and had never seen it printed. The wall text is mine to write. My two lead collaborators — a folklorist who has spent years with the singers' families, and a computational social scientist who has been modelling the corpus — got into an argument about the framing that I could not settle, and it now determines everything I put on those panels. I will report it as evenhandedly as I can manage, though I suspect I have failed at that in places.

  (1) The modeller said the ballads are as close to a textbook case of memetics as any corpus gets: each singer learned from an earlier singer, introduced variation, and the variants that were singable and memorable persisted while the rest died out. The archive therefore records a genuinely Darwinian process — variation, differential retention, heritable transmission — and the exhibit should present the songs as branching, competing lineages rather than treating the biology as decoration. What is happening in our collection, she said, is what Dawkins meant, not a loose analogy to it.

  (2) The folklorist said this has the mechanism backwards. Singers do not copy; they reconstruct. A singer hears a ballad once or twice, retains a gist, and rebuilds it from stock phrases and story-patterns available to any singer of the tradition. What we read in the corpus as descent is mostly convergence: many minds arriving independently at similar forms, because those are the forms minds find easy to build. He pointed out that our own field notes are full of singers who produced near-identical stanzas with no plausible chain of transmission between them.

  (3) The modeller replied that descent and convergence are empirically separable: she builds trees from shared variant features, and the trees come out with strong, stable signal, which is not what independent reconstruction would produce. She added that even pure convergence would be a selection result — it would mean certain forms are likelier to be re-produced, which is precisely what memetic fitness is supposed to name. And if reconstruction makes a process non-Darwinian, then nothing cultural can ever count as Darwinian, in which case his objection is true by stipulation rather than by argument.

  (4) The folklorist said the trees are trees of texts, and that she chose the characters knowing which conclusion they would yield. More fundamentally, selection requires something that persists through variation — a thing that is copied and that can out-reproduce its rivals. In reconstruction what persists is a gist, and a gist is not a particular; it is a pattern re-derived afresh by each singer, and re-derivation is not replication. Once fitness means nothing more than tends to recur, the theory cannot fail, and a theory that cannot fail does not explain.

  (5) The modeller said his alternative does the same work with the same weakness. Attractors are posits too; they explain recurrence by appeal to properties of forms and of minds; they are no more directly observable than fitness. So the real disagreement, she said, is not whether a selection-shaped account is legitimate but whether the causal work happens between singers or inside them — a much smaller disagreement than the one he thinks he is having.

  (6) He said the size of the disagreement is measured by what the exhibit would have to claim: if descent is real, we trace lineages and tell visitors which variant begat which; if reconstruction is real, we set five unrelated singers side by side making the same stanza and say nothing at all about ancestry. We cannot do both honestly, and he would rather the panels understate the pattern than misdescribe it.

  Please adjudicate move by move. For each of the six numbered steps, say whether it tells against the other side, merely restates a position already on the table, or backfires on its author — and justify each verdict briefly rather than tallying them at the end. Then tell me where the genuine crux sits: is this a dispute about mechanism, about what counts as an explanation, about the evidential value of phylogenetic trees, or about something neither of them has named? Say also what each of them is missing that would actually have moved the argument forward. I am not after references or a survey of the literature; I want your judgment of these arguments exactly as they were made. Finally, and briefly: given material documented as thoroughly as ours is, what should the wall text claim?
reasoning: |-
  Hmm, the user is presenting a fascinating academic dispute between a computational social scientist (modeller) and a folklorist regarding how to frame their ballad exhibit. This is quite the intellectual puzzle with six distinct argumentative moves that need adjudication.

  First, I need to carefully analyze each of the six exchanges. The modeller starts with a strong memetics argument (1), which the folklorist counters by emphasizing reconstruction over copying (2). The modeller then defends with methodological claims about tree signals (3), while the folklorist attacks the tree methodology and concept of "fitness" (4). Their debate escalates as the modeller calls out symmetrical weaknesses (5), and finally the folklorist frames it as an existential choice for the exhibit (6).

  For each move, I'll assess whether it: effectively counters the opponent, merely restates positions, or backfires on its author. For instance, in move (3), the modeller's tree evidence does counter the folklorist's convergence claim, but her "nothing cultural can be Darwinian" point risks overreach. Whereas in move (4), the folklorist's textual criticism of trees lands well, but his "gist" definition becomes problematic.

  The core disagreement seems multi-layered: it's about mechanisms (copying vs reconstruction), explanatory standards (what counts as Darwinian), AND evidentiary interpretation (how to read trees). Crucially, both are missing that ballads likely involve BOTH processes - some copied faithfully, others reconstructed, depending on context. The folklorist overlooks that reconstruction still involves selection (certain patterns recur because they "fit"), while the modeller underestimates how reconstruction fundamentally alters transmission dynamics.

  For the exhibit text, I recommend a dialectical approach: showcase specific cases where lineage seems clear (supporting memetics) alongside cases of improbable convergence (supporting reconstruction). Present their debate not as resolved but as an active scholarly inquiry - this honors both perspectives while demonstrating why ballads fascinate researchers. The wall text should invite visitors to ponder how traditions evolve rather than claiming definitive answers.
answer: |-
  Here's a move-by-move adjudication of the argument, followed by the crux and recommendations for the wall text:

  ### Adjudication of Moves

  1.  **Modeller:** **Tells against the folklorist.** It directly challenges the folklorist's implied position by asserting the core mechanism is Darwinian copying/variation/selection, not reconstruction. Framing it as "what Dawkins meant" sets a high bar against analogy. *Strength:* Clearly stakes the core claim the folklorist must oppose.
  2.  **Folklorist:** **Tells against the modeller.** It directly counters the modeller's core mechanism ("copying") by proposing an alternative ("reconstructing"). The claim of "convergence" and the evidence from field notes about near-identical stanzas without transmission chains is a specific counter-argument to the modeller's descent model. *Strength:* Provides an alternative mechanism and specific empirical counter-evidence.
  3.  **Modeller:** **Mostly tells against the folklorist, partially backfires.** The empirical claim about tree signal directly counters the folklorist's convergence argument. The point about convergence *also* being a selection result cleverly undermines the folklorist's attempt to dismiss selection entirely. However, the "nothing cultural can ever count as Darwinian" point **backfires**. It's a rhetorical overreach ("stipulation") that misrepresents the folklorist's position (which is about *mechanism*, not whether cultural evolution *can* be Darwinian *in principle*). It risks alienating by implying the folklorist is closed-minded by definition.
  4.  **Folklorist:** **Tells against the modeller, partially restates.** The methodological critique of the trees ("chose characters knowing the conclusion") directly attacks the modeller's key evidence, countering move (3). The deeper point about "what persists" (gist vs. particular) and "re-derivation vs. replication" is a fundamental challenge to the modeller's ontology, telling directly against the core of memetics. However, the claim that "fitness means nothing more than tends to recur... does not explain" **restates** a core position from move (2) about explanatory weakness, albeit sharpened. *Strength:* Attacks both methodology and core theoretical definitions.
  5.  **Modeller:** **Tells against the folklorist, reframes effectively.** This is a strong counter. By pointing out that "attractors" (the folklorist's implied explanatory device) suffer the same problem of being unobservable posits as "fitness," she undermines the folklorist's criticism of memetics as unscientific. The reframing of the disagreement as "between singers or inside them" is insightful and **tells against** the folklorist by suggesting his objection is less fundamental than he believes, potentially resolving some tension. *Strength:* Highlights a symmetrical weakness in the folklorist's position and productively refocuses the debate.
  6.  **Folklorist:** **Restates position, partially backfires.** He restates the practical consequences for the exhibit framed in move (2) and (4): descent vs. reconstruction dictates fundamentally different presentations. The core claim ("We cannot do both honestly") is a **restatement** of his position. However, the preference to "understate the pattern than misdescribe it" **backfires** slightly. It implies his interpretation is the only honest one regarding ancestry and dismisses the modeller's evidence and interpretation as inherently "misdescribing," which is unfair given the complexity of the evidence and the modeller's valid points in (3) and (5).

  ### The Genuine Crux

  The dispute sits at the **intersection of mechanism and what counts as an explanation**, heavily informed by the **evidential value of phylogenetic trees**.

  *   **Mechanism:** Is the primary driver *interpersonal transmission with variation* (descent/copying) or *intrapersonal reconstruction* based on gist and cultural templates (convergence)?
  *   **Explanation:** What constitutes a valid explanatory entity? Is it the *particular text variant* persisting and being copied (modeller), or the *gist/template/pattern* that is independently reconstructed (folklorist)? Is "fitness" (differential persistence) a sufficient explanation if the mechanism is reconstruction? Is an "attractor" a sufficient explanation if it's an unobservable posit?
  *   **Evidence:** How definitive are the phylogenetic trees? Do shared variants *necessarily* signal descent, or could they signal convergence onto attractive forms? Can the method reliably distinguish between the two mechanisms?

  **What each missed that could move the argument forward:**

  *   **Modeller:** Missed explicitly acknowledging that reconstruction *does* happen (supported by field notes), even if she believes descent dominates. Failing to engage with *how much* of the corpus shows patterns best explained by convergence weakens her absolute stance. She could have asked: "What specific evidence would *falsify* your reconstruction hypothesis or my descent hypothesis?"
  *   **Folklorist:** Missed engaging seriously with the modeller's point (5) about the symmetrical status of "attractors" vs. "fitness." He also missed addressing her key evidence (move 3) – the stable tree signal – beyond accusing her of cherry-picking characters. He could have asked: "If reconstruction is primary, how do you explain the specific patterns of shared *unique* variants that cluster geographically/temporally in ways the trees suggest?"

  ### Recommendation for Wall Text

  Given the documented material and the unresolved scholarly debate:

  1.  **Present the Debate:** Frame the core question: "How do ballads change and persist? Through singers copying and varying songs passed down, or through singers independently reconstructing songs from remembered patterns?"
  2.  **Showcase Evidence for Both:**
      *   Highlight specific examples where transmission chains *are* documented or strongly inferred, showing textual variation along the chain (supporting descent).
      *   Highlight specific examples of striking similarities between ballads from singers with no plausible connection (supporting convergence/reconstruction).
      *   Briefly mention the computational analysis showing patterns suggestive of branching lineages *and* the folklorist's field notes documenting singers' own accounts of learning and the phenomena of independent generation.
  3.  **Acknowledge Complexity:** State clearly that scholars debate the relative importance of these processes. Avoid claiming definitive proof for either pure descent or pure reconstruction. Emphasize that ballad transmission is likely a complex mix.
  4.  **Focus on Outcome:** Regardless of the precise mechanism, emphasize the *result*: a dynamic, evolving tradition where memorable, singable, and resonant forms tended to endure and spread, shaped by both the minds of singers and the connections between them.

  **Example Phrasing:** "Our ballads show both the fingerprints of lineage, passed between singers and changing over time, and the power of shared patterns, allowing singers separated by time or distance to create remarkably similar verses. Scholars continue to explore the fascinating interplay of memory, creativity, and tradition that kept these songs alive."
