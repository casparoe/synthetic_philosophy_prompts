prompt: |-
  ok so I'm supposed to present something at my reading group on Freud's *The Future of an Illusion* and I ended up building an argument I can't get out of. It's meant to be a reconstruction of his case against religion, but somewhere along the way it turned into a case against the reconstruction, and I can't find the exact step where that happens.

  (1) On Freud's account, a belief is an illusion when its hold on you comes from wish-fulfilment rather than from evidence — and note this is supposed to be a diagnosis, not an insult: illusions can be false but they aren't false *because* they're illusions.
  (2) Religious belief arises from the infant's helplessness and the resulting wish for a protective father, so it's an illusion.
  (3) Therefore religion is an illusion, and since nothing evidential supports it anyway, we should give it up — that's the whole point of the book's title.
  (4) The same reasoning applies to any belief we can trace back to a wish, including theoretical ones, since Freud never restricts (1)-(2) to religious content.
  (5) But psychoanalysis itself has a pedigree of exactly that sort — it grows out of Freud's own ambivalence toward his father and toward authority figures generally, out of his need to be the discoverer, out of a wish for mastery over the mind.
  (6) So psychoanalysis is itself an illusion by (1).
  (7) And so is my reconstruction, since I built it because I wanted to win an argument at a reading group.
  (8) So this argument, if it works, works against itself: it says that no wish-shaped belief deserves assent, including the belief expressed by the argument.

  My supervisor says I've just committed the genetic fallacy — confusing where a belief came from with whether it's true — but that doesn't sit right either, because Freud is usually careful to say illusions aren't automatically false, and I wrote that into (1) myself. So if (1) already contains the caveat, where does the argument actually break? Is it a bad step, or is it valid and I just have to pick which premise hurts least to drop? I'd rather keep (2) and (3) than anything else, since they're the ones I actually need for the talk, but tell me what I'm paying for that and what a defender of Freud can say about (5) specifically.
