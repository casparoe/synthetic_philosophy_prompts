  For Rapa Nui, they effectively challenge Diamond's environmental determinism with recent scholarship about rats and European impacts. Their application of criterion (iii) to the birdman cult transition seems valid.

  For the Late Bronze Age, their network collapse argument is insightful, though the claim about language/religious continuity could be nuanced - some cults did disappear. Their use of Tainter is appropriate in linking complexity reduction to rational adaptation.

