answer: |-
  ## Inaugural Address: Risk, Foresight, and the Unquantifiable Landscape

  Good afternoon. It is a privilege to welcome the first cohort to this Master’s programme in Risk and Foresight. Its establishment, prompted by the profound shock of a flood deemed exceptionally rare by prevailing models, speaks to a fundamental challenge. We live in a world that increasingly demands we foresee the unforeseen, quantify the unquantifiable, and act decisively amidst profound ambiguity. This programme exists to equip you with powerful tools to navigate that challenge. The support making it possible, including generous bursaries from the reinsurance sector, underscores the vital importance society places on your future expertise. Today, however, I want to speak not as an expert in these tools, but as someone observing their foundations and their frontiers. My aim is to sketch the landscape you will explore, acknowledging both the power and the inherent limitations of the quantitative lens you will sharpen over the next two years.

  To grasp this landscape, consider a simple, everyday act of foresight. Imagine you are about to leave for a walk. You look at the sky, see dark clouds gathering, and recall the weather forecast mentioned a sixty percent chance of rain. You decide to take your umbrella. Here, the calculation feels grounded. We have experience with clouds like these, forecasts based on atmospheric data, and a clear outcome: rain or no rain. The sixty percent figure, while not a guarantee, represents a meaningful degree of belief derived from observable patterns and frequencies. This is one domain of foresight – the domain where events repeat often enough, or systems are stable enough, that numerical probabilities can be genuinely informative. We can calculate the odds of a fair coin landing heads, the failure rate of a well-understood component, or the likelihood of a traffic delay on a familiar route. This is the realm where quantification shines, where risk models built on historical data and statistical principles offer invaluable guidance. This is the bedrock upon which much sound planning and insurance rest.

  But now, imagine a different kind of decision on that same walk. Suppose a close friend has been acting strangely distant lately. You ponder whether to bring it up during the walk. What are the chances this conversation will mend the rift, or accidentally deepen it? Can you assign a number? Ten percent chance of reconciliation? Thirty percent chance of causing offence? Seventy percent chance nothing changes? The impulse to put a number on it might arise, perhaps to force clarity. Yet, unlike the weather, what basis do we have? Every friendship is unique. The causes of the distance are unknown, perhaps even to your friend. The outcome depends on complex, shifting emotions, hidden thoughts, unpredictable reactions – yours and theirs. There is no stable frequency here. No database of identical conversations with identical people under identical circumstances. The future state of this relationship feels genuinely novel, irreducible to past data points. Assigning a precise number here feels less like calculation and more like guesswork disguised as precision. It might even be misleading, lending a false sense of certainty to an inherently opaque situation.

  This distinction – between the calculable weather forecast and the unquantifiable dynamics of human interaction – lies at the heart of an enduring perspective on risk, articulated powerfully by the economist John Maynard Keynes. He argued that much of what truly matters in human affairs, especially concerning the long-term future, novel events, or complex systems, falls into this second domain. Here, he contended, we are not in the realm of calculable risk, but in a state of irreducible uncertainty. There is simply no objective basis for assigning numerical probabilities. Instead, we confront a fundamental lack of knowledge. Yet, we must act. We paper over this void, Keynes observed, through convention – assuming the future will broadly resemble the past unless we see specific evidence otherwise. We rely on instinct, narrative, or simply the overwhelming human impulse to *do something* rather than remain paralysed. He famously termed this impulse our ‘animal spirits’. Crucially, Keynes also highlighted in his early work that the *amount* of relevant information behind a judgement is distinct from the *precision* of the probability we might assign. A precise estimate based on very little solid evidence – say, confidently predicting a seventy percent chance your friend will react well based on one ambiguous text – is often epistemically weaker, less reliable, than a vaguer but more honest admission of uncertainty grounded in a deeper, albeit imperfect, understanding of the complexities at play.

  Now, some modern thinkers, particularly those championing a subjective approach to probability, might challenge this strict division. They argue that *all* uncertainty can be captured by probabilities. In their view, the conversation with your friend isn't beyond quantification; it just requires acknowledging that our initial estimates are very uncertain, represented by wide probability intervals or highly sensitive to our starting assumptions. They see Keynes's irreducible uncertainty as merely a reluctance to assign a number. This perspective has force, especially in demanding rigorous consideration of all available evidence, however scant. Furthermore, Keynes’s own early view of probability as a logical relation between propositions faced significant criticism from those who saw probability as fundamentally about degrees of personal belief, a view that gained considerable traction. He never fully resolved this philosophical challenge.

  However, dismissing Keynes’s core insight about the second domain risks missing something vital. The Bayesian machinery of updating beliefs is powerful, but it still requires *some* initial anchor, some prior probability. When facing the truly novel – events without historical precedent, decisions involving radical innovation, the long-term consequences of actions decades hence – what anchors do we have? What meaningful prior can we assign to the emergence of transformative AI, or the societal impacts of unprecedented climate shifts decades from now, or indeed, the specific outcome of a deeply personal conversation? Assigning a number here, however wide the interval, can become an act of mathematical formalism detached from genuine knowledge. It risks obscuring the profound difference between calculating the odds on a roulette wheel and judging the trajectory of a unique human life or the fate of a complex ecosystem over generations. What survives the philosophical critiques is the enduring, practical truth: treating every unknown as a calculable risk, just a very uncertain one, can blind us to the qualitatively different nature of deep uncertainty. It can tempt us into building elaborate models on foundations of sand, mistaking computational sophistication for genuine foresight.

  This is not a counsel of despair for your studies. Far from it. Recognising the limits is the first step towards navigating them wisely. Indeed, the most thoughtful modern approaches to risk management and foresight wrestle directly with this challenge. Some tools genuinely absorb Keynes’s point. Sensitivity analysis explicitly asks how outcomes change if our key assumptions are wrong. Scenario planning embraces multiple plausible futures without demanding precise odds for each, forcing us to consider radically different possibilities. Using deliberately coarse or imprecise estimates for highly uncertain factors – acknowledging ‘low’, ‘medium’, ‘high’ rather than spurious decimals – can be a mark of intellectual honesty. Stress testing explores how systems break under extreme conditions we struggle to probabilise. These are powerful responses to the reality of the second domain.

  Yet, we must be equally clear-eyed about the limitations of even these tools. Sensitivity analysis often still orbits a central, precise estimate. Scenarios can be neglected if the lure of a single ‘most likely’ future proves too strong. Too often, an interval around a forecast – say, predicting economic growth between 1.5% and 2.5% – becomes mere decoration, a ritualistic nod to uncertainty while the single point estimate drives all decisions, and the boundaries themselves are based on conventions just as vulnerable as Keynes feared. The map is not the territory, and no model, however sophisticated, can fully capture the contingent, emergent complexity of the real world, especially in that vast domain of the novel and the long term.

  So, what does this mean for you, embarking on this demanding programme? It means embracing the quantitative tools you will master with both enthusiasm and profound critical awareness. Learn to build the models, crunch the numbers, identify the statistical patterns. Become adept in the domain of calculable risk. But always, *always*, cultivate a parallel skill: the ability to step back and ask, "What domain am I actually in?" When faced with a problem, ask: Is this like forecasting the rain based on clouds and data? Or is it more like navigating the fragile, unpredictable dynamics of a strained friendship? Is the evidence deep and relevant, or thin and potentially misleading? Does the precision I’m achieving reflect genuine knowledge, or is it a veneer over ignorance?

  Therefore, here is one concrete practice to adopt from your very first term: **Interrogate the language of uncertainty.** When you produce an estimate, or read one, or build a model that generates one, don't stop at the number or the interval. Ask: What is the *nature* of the uncertainty here? What assumptions underpin this probability? How stable are the systems involved? How novel are the potential events? What crucial factors might be missing entirely? Practice articulating this explicitly. Instead of just presenting a figure, say: "Based on historical data for similar, stable systems, we estimate X, but note the model assumes Y, which may not hold." Or, "Given the novelty of factor Z, a numerical probability isn't meaningful; instead, we outline three plausible scenarios with qualitative drivers." Make distinguishing between calculable risk and deep uncertainty a reflexive part of your analytical toolkit.

  Your task is formidable. You are learning to build lighthouses for an often stormy and uncharted future. Respect the power of the light you wield. Understand its range, and recognise where its beam fades into the surrounding dark. Navigate not only by the instruments, but by a clear-eyed understanding of where they can guide you, and where you must acknowledge the fog. That critical awareness, that philosophical grounding alongside technical mastery, is the hallmark of true foresight. I wish you every success in developing it.

  ---

  **Note (Not for delivery):**

  *   **Load-bearing for Reinsurer:** "This programme exists to equip you with powerful tools... The support making it possible... underscores the vital importance society places on your future expertise." Acknowledges the flood impetus and their funding neutrally, framing the programme (and their support) as a necessary response to a known challenge. *Pause briefly after "expertise" to let the acknowledgement land.*
  *   **Aimed at Parents/Non-specialists:** The entire "friend conversation" example. It uses relatable human experience to make the abstract distinction tangible. The explanation of "animal spirits" is kept simple and contextual. Sentences like "Assigning a precise number here feels less like calculation and more like guesswork disguised as precision" are crafted for clarity without jargon.
  *   **Key Pacing Points:**
      *   Pause after introducing the friend example ("...bring it up during the walk.") to let the shift register.
      *   Pause after stating "He famously termed this impulse our ‘animal spirits’." Let the phrase resonate.
      *   Slow down slightly when introducing the Bayesian challenge ("Now, some modern thinkers...") to signal a serious counter-argument is being addressed.
      *   Emphasise and pause after the core rebuttal: "...what anchors do we have?" and "...detached from genuine knowledge."
      *   Clear pause before "Therefore, here is one concrete practice..." to mark the shift to actionable advice.
      *   Final sentence ("That critical awareness...") – deliver slowly and deliberately for weight.
