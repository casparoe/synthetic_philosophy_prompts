  We are designing a screening tool for grant proposals that use the term "emergence". The tool must sort proposals into three categories:

  (i) Ordinary reductionist work with emergence language as decoration.
  (ii) A real and reasonably tractable claim about explanatory autonomy (non-derivability, multiple realization, coarse-grained variables with predictive weight not cheaply reproduced at micro level).
  (iii) A strong claim of downward causation (higher level has causal powers of its own, even in a causally closed physical world).

  The tool must avoid two pitfalls:
  - If it only asks about non-derivability, it will let too much through because practical non-derivability is common.
  - If it asks about causal powers of the higher level, it will reject everything because of causal closure (Kim's exclusion argument).

  Therefore, we need a third way. The key is to focus on whether the proposal provides evidence for the *explanatory autonomy* of the higher level without requiring that the higher level violates causal closure. We can do this by requiring that the proposal shows that the higher-level description provides a *causal explanation* that is not just a summary of micro-level causes, but is necessary for understanding the system in a way that the micro-level cannot efficiently provide, and that this causal explanation is not reducible without loss of explanatory power.

  The tool will be a decision tree with ordered questions. We must be honest that some steps are judgment calls but we try to minimize that.

  Key distinctions to preserve:
  - Non-derivability (in principle or in practice) must be addressed.
  - The causal work of the higher level must be discussed without requiring a violation of causal closure.

  Distinctions we can throw overboard at this stage:
  - Deep metaphysical debates (e.g., whether downward causation is possible in a physical world) because the panel won't have time. We focus on explanatory practice.

  The tool:

  1. **Question 1: Does the proposal clearly define what they mean by "emergence" in the context of their project?**
     - If no: Flag as (i) [decorative] because without a clear definition, the term is likely being used loosely.
     - If yes: Proceed to Q2.

  2. **Question 2: Does the proposal explicitly state that the higher-level phenomenon is not derivable (either in principle or in practice) from the lower-level (micro) description?**
     - If no: Flag as (i) [decorative] because they are not making a claim of non-derivability, so emergence is just a buzzword.
     - If yes: Proceed to Q3.

  3. **Question 3: Does the proposal provide evidence or an argument for this non-derivability?**
     - The evidence could be: computational infeasibility, multiple realizability, or an in-principle argument (like the institutional case where micro-level data is unavailable).
     - If no: Flag as (i) [decorative] because the claim is unsupported.
     - If yes: Proceed to Q4.

  4. **Question 4: Does the proposal demonstrate that the higher-level description (variables, patterns, laws) has predictive or explanatory power that the lower-level description lacks?**
     - This means: Can they show that by using the higher-level description, they can make predictions or explain phenomena that are not easily (or at all) accessible from the lower-level? This is the key to explanatory autonomy.
     - If no: Flag as (i) [decorative] because even if non-derivable, the higher level isn't doing any work.
     - If yes: Then we have a candidate for (ii). But we must check if they are making a stronger claim. Proceed to Q5.

  5. **Question 5: Does the proposal claim that the higher-level phenomenon has causal powers that are not reducible to the causal powers of the micro-level (i.e., downward causation)?**
     - If no: Then it's (ii) [explanatory autonomy without strong downward causation].
     - If yes: Then we must scrutinize this claim. Proceed to Q6.

  6. **Question 6: Does the proposal acknowledge the causal closure of the physical level (i.e., that every physical event has a sufficient physical cause)?**
     - If no: Then they might be ignoring the exclusion problem. Flag as (iii) but with a note that the claim is problematic because it doesn't address causal closure. We might still fund it, but the panel should be aware of the issue.
     - If yes: Then proceed to Q7.

  7. **Question 7: Does the proposal provide a mechanism or account of how downward causation is possible without violating causal closure?**
     - This is the hard part. They might try to show that the higher-level cause is a real pattern that is not reducible, or that it is a structuring cause, or that it is a case of causal relevance without overdetermination.
     - If they provide a plausible account (even if controversial) that respects causal closure, then flag as (iii).
     - If they do not, then flag as (ii) with a note that the downward causation claim is not supported, but the explanatory autonomy part is.

  Note: We are allowing that a proposal might be (ii) even if it uses the language of downward causation, if that claim is not adequately supported. The core of (ii) is explanatory autonomy.

  Now, we must be honest about the tension: The tool might let through some proposals that are not really about emergence because non-derivability is common. But by requiring evidence for the explanatory power of the higher level (Q4), we filter out cases where the higher level doesn't add value. Also, the tool might be too strict on downward causation because of the exclusion argument, so we require an account (Q7) and if they don't have one, we downgrade to (ii).

