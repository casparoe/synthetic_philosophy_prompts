  7. **Account for downward causation without violation:** Does the proposal provide a plausible account (e.g., in terms of non-reductive realization, causal relevance via difference-making, or other) of how downward causation is possible without violating causal closure?
     - Yes → (iii) [Strong emergence with downward causation]
     - No → (ii) [Explanatory autonomy; downward causation claim not supported]

  **One-Page Version:**

  Screening Tool for Emergence Claims

  1. **Definition of emergence?** 
     - No → (i)  
     - Yes → 2.

  2. **Claim non-derivability?** 
     - No → (i)  
     - Yes → 3.

  3. **Evidence for non-derivability?** 
     - No → (i)  
     - Yes → 4.

  4. **Higher level has unique predictive/explanatory power?** 
     - No → (i)  
     - Yes → 5.

  5. **Claim downward causation?** 
     - No → (ii)  
     - Yes → 6.

  6. **Acknowledge causal closure?** 
     - No → (iii) [with caution: may violate physical closure]  
     - Yes → 7.

  7. **Account for downward causation without violation?** 
     - Yes → (iii)  
     - No → (ii) [downward causation not supported]

  **Note for the chair:**

  This tool is designed for quick triage. It reliably filters out decorative uses (i) by requiring clear definitions, claims, and evidence for non-derivability and unique higher-level explanatory power (Q1-4). It separates explanatory autonomy (ii) from strong emergence (iii) by requiring an explicit downward causation claim and then probing its compatibility with physical causal closure (Q5-7). However, the tool has limitations: 
  - It cannot perfectly handle cases where the micro level is in principle unobservable (like the institutional proposal). In such cases, Q4 may pass by necessity, but the panel should be aware that the explanatory autonomy is by default and not by comparison.
  - The boundary between (ii) and (iii) is philosophically contested. The tool flags caution when downward causation claims ignore causal closure (Q6) or lack an account (Q7), but these are judgment calls. 
  - The tool cannot resolve deep metaphysical disputes. Proposals that make strong downward causation claims with a plausible account (Q7) may still be controversial.

  In cases of uncertainty, the tool flags (iii) with caution or defaults to (ii). The tool is most effective at identifying (i) and (ii). For (iii), it highlights proposals that require careful scrutiny, possibly by the philosopher.

  **How to fake category (ii):**

  An applicant can fake (ii) by:
  - Defining emergence (Q1).
  - Claiming non-derivability (Q2) with a weak argument (e.g., "it's complex") for Q3.
  - Asserting that the higher level has predictive power (Q4) without demonstrating that it is not available from the micro level (e.g., by showing only that the higher level works, not that the micro level fails).
  - Avoiding any downward causation claim (Q5).

  The key question that might catch them is **Q4**: they must provide evidence that the higher-level description has predictive or explanatory power that the micro-level description *lacks* or *cannot feasibly provide*. If they only show that the higher level is useful but not that the micro level is deficient, then they fail Q4. However, if they are clever, they might fabricate a comparison. The tool relies on the reviewer's judgment at Q4.

  **Conclusion on tool's reliability:**

  No 15-minute screen can perfectly distinguish all cases. The tool is most effective at identifying decorative uses (i) and explanatory autonomy (ii). For downward causation (iii), it flags the need for careful review. We recommend using the tool to sort proposals into "review normally" (for (ii) and (iii) with caution) versus "send to the philosopher" (for (iii) with caution and any case that is borderline). What we give up is a definitive classification of strong emergence (iii) without a full review. The tool ensures that decorative uses are weeded out quickly and that the philosopher's time is focused on the contested cases.
answer: |-
  ### Screening Tool for Emergence Claims in Grant Proposals

  #### Core Design Principles
  - **Avoids jargon**: No philosophical terminology required.  
  - **Handles the tension**: Balances practical non-derivability and causal closure by focusing on **explanatory autonomy** (predictive utility of higher levels) and **causal relevance** (whether higher-level variables add unique causal information without violating physical closure).  
  - **Third Way**: The tool evaluates whether the higher level provides *irreducible explanatory or predictive utility* that the micro-level cannot feasibly replicate, *without* requiring downward causation to violate physical laws. It tests for **causal relevance via difference-making** (e.g., interventions showing higher-level variables improve predictions).  
  - **Judgment calls flagged**: Steps requiring interpretation are explicitly noted.  

  ---

  ### The Decision Procedure  
  **Ordered questions with branching logic. Answers must be explicit in the proposal.**  

  1. **Does the proposal define "emergence" in its specific context?**  
     - *No* → **Category (i)** (decorative).  
     - *Yes* → Proceed.  
     *[Judgment call: Is the definition coherent or hand-wavy?]*  

  2. **Does the proposal claim the higher-level phenomenon is *not derivable* (in practice *or* principle) from micro-level facts?**  
     - *No* → **Category (i)**.  
     - *Yes* → Proceed.  

  3. **Does the proposal provide evidence for non-derivability?**  
     - Acceptable: Computational infeasibility, multiple realizability, in-principle unavailability of micro-data, or diverging predictions.  
     - *No evidence* → **Category (i)**.  
     - *Evidence given* → Proceed.  

  4. **Does the proposal demonstrate that the higher-level description provides *predictive/explanatory power* that the micro-level cannot feasibly replicate?**  
     - Acceptable: Higher-level predictions are more accurate, efficient, or generalizable; micro-level predictions fail under constraints (e.g., computational limits); coarse-grained variables capture patterns micro variables miss.  
     - *No* → **Category (i)**.  
     - *Yes* → **Provisional Category (ii)**. Proceed.  
     *[Judgment call: Does the evidence show *added value*, or just convenience?]*  

  5. **Does the proposal claim the higher level has *causal powers* (e.g., "downward causation")?**  
     - *No* → **Final: Category (ii)** (explanatory autonomy).  
     - *Yes* → Proceed.  

  6. **Does the proposal acknowledge physical causal closure (micro-level causes suffice for micro-level effects)?**  
     - *No* → **Final: Category (iii) with caution** (risk of incoherence).  
     - *Yes* → Proceed.  

  7. **Does the proposal show the higher-level variables *add unique causal information* not captured by micro-variables?**  
     - Acceptable: Intervention-based tests (e.g., manipulating higher-level variables changes outcomes while micro-variables are held constant); causal modeling (e.g., higher-level variables improve predictive accuracy in machine learning models); or conserved quantities under coarse-graining.  
     - *No* → **Final: Category (ii)** (autonomy without downward causation).  
     - *Yes* → **Final: Category (iii)** (strong emergence).  
     *[Judgment call: Is the method robust or contrived?]*  

  ---

  ### One-Page Version for Panel Use  
  ```plaintext
  EMERGENCE CLAIM SCREENER  
  ──────────────────────────────────────────────────────  
  1. Defined "emergence"?  
     ❌ No → (i)  
     ✔️ Yes → 2.  

  2. Claims non-derivability from micro-level?  
     ❌ No → (i)  
     ✔️ Yes → 3.  

  3. Evidence for non-derivability?  
     ❌ No → (i)  
     ✔️ Yes → 4.  

  4. Higher level adds predictive power micro can't match?  
     ❌ No → (i)  
     ✔️ Yes → 5.  

  5. Claims downward causation?  
     ❌ No → (ii)  
     ✔️ Yes → 6.  

  6. Acknowledges physical causal closure?  
     ❌ No → (iii) [CAUTION: Unresolved tension]  
     ✔️ Yes → 7.  

  7. Shows higher-level causal relevance (e.g., interventions)?  
     ❌ No → (ii)  
     ✔️ Yes → (iii)  
  ──────────────────────────────────────────────────────  
  Key:  
  (i) Decorative reductionism  
  (ii) Explanatory autonomy (non-derivability + utility)  
  (iii) Strong emergence (downward causation)  
  * Flag steps 4,7 for judgment calls.  
  ```  

  ---

  ### Tool Limitations: Note to the Chair  
  This tool reliably filters decorative uses (i) but has trade-offs:  
  - **Misfires**: Fails proposals where higher-level causality is implied but not explicitly tested (e.g., social sciences).  
  - **Blurred lines**: Cannot cleanly separate (ii) and (iii) when causal closure is acknowledged but downward causation is ambiguously argued.  
  - **Unsettled cases**: Proposals that reject physical closure (e.g., dualism) or lack empirical tests for causal relevance default to (iii) with caution.  
  **Recommendation**: Use the tool to sort proposals into "review normally" (passing Q1–Q4) vs. "send to philosopher" (Q5–Q7). It optimizes for speed, not metaphysical resolution.  

  ---

  ### Application to Sample Proposals  

  #### Proposal 1: Soft Condensed Matter (Granular Media/Active Colloids)  
  - **Q1**: Yes. Defines emergence as collective modes predictable from hydrodynamics but not particle models.  
  - **Q2**: Yes. Claims practical non-derivability due to computational cost.  
  - **Q3**: Yes. Lists three predictions diverging from micro-models within feasible run times.  
  - **Q4**: Yes. Shows hydrodynamic variables predict collective behavior; particle models fail under constraints.  
  - **Q5**: No. No downward causation claimed.  
  - **Outcome**: **Category (ii)**.  

  #### Proposal 2: Computational Neuroscience (Network Oscillations)  
  - **Q1**: Yes. Defines emergence as downward causation (oscillations → neuron spiking).  
  - **Q2**: Implied (non-derivability from neural closure).  
  - **Q3**: Yes. Promises "rigorous demonstration" of independent causal power.  
  - **Q4**: Yes. Claims oscillations explain network stability.  
  - **Q5**: Yes. Explicit downward causation claim.  
  - **Q6**: Yes. States neural level is causally closed.  
  - **Q7**: ❌ **Fails**. Proposal only *promises* demonstration; lacks method (e.g., interventions on oscillations while controlling neuron states).  
  - **Tool Demands**: Require experimental/intervention design (e.g., perturbing oscillations and measuring neuron spiking with micro-variables fixed).  
  - **Can claims cohere?** Yes, *if* they show oscillations are causal difference-makers without violating closure (e.g., via supervenience-compatible models).  
  - **Outcome**: **Category (ii)**. Downgraded due to no causal relevance evidence.  

  #### Proposal 3: Institutional Analysis (Micro-Level Unavailable)  
  - **Q1**: Yes. Defines emergence as institutional autonomy/causality due to non-derivability.  
  - **Q2**: Yes. Claims in-principle non-derivability (no micro-level data).  
  - **Q3**: Yes. Argues bridge principles impossible.  
  - **Q4**: ✔️ **Contested yes**. Institutional variables predict outcomes; no micro-level alternative exists. *But* tool requires showing micro *could not* replicate predictions—proposal skips this.  
  - **Q5**: Yes. Claims institutional causal efficacy.  
  - **Q6**: ❌ **Fails**. No mention of causal closure; social science context ignores physicalism.  
  - **Outcome**: **Category (iii) with caution**. Tool flags the inference from non-derivability to causation as unsupported (no causal closure acknowledgment or tests). Philosopher should review.  

  ---

  ### Gaming the Tool: How to Fake Category (ii)  
  A determined applicant could:  
  1. Define emergence loosely (Q1).  
  2. Claim non-derivability with "complexity" as evidence (Q2–Q3).  
  3. Assert higher-level predictive utility without comparative tests (Q4).  
  4. Avoid downward causation language (Q5).  
  **Catch-All Question**: **Q4** (predictive power). Demand *comparative evidence*: Proposals must show higher-level predictions outperform or differ from micro-level predictions (e.g., via simulations, experiments, or modeling). Vague claims fail here.  

  ### Final Assessment  
  **What the tool sacrifices**:  
  - Metaphysical nuance (e.g., debates about supervenience).  
  - Proposals with valid but implicit causal claims.  
  **What it gains**:  
  - Fast triage (identifies 80% of decorative uses).  
  - Focuses philosopher effort on borderline (iii) cases.  
  **Recommendation**: Use for initial sort ("review" vs. "philosopher deep dive"), not final scoring.
