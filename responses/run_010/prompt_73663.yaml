  For the questions: Each needs a follow-up anticipating her deflection. Topics must include compulsion (exemptions/who actually serves), accountability replacements, descriptive representation under compulsion, executive formation without parties, gaps between advisory mini-publics and legislative bodies, minority protections, and rejecting moderate versions. The sequence should start with softer topics and escalate to force her off comparative arguments.

  I'll design questions that unpack mechanisms - like how agenda control works without elections, or how a statistically typical assembly protects minorities without constituency ties. Follow-ups will preempt "but elections are worse" by demanding specific sortition solutions. The closing question must be non-comparative: what real-world evidence would make her abandon the theory.

  For cuts: I'll prioritize removing questions on minority protections and the gap with mini-publics if time runs short, as they're slightly less central to her core thesis than accountability or compulsion. But all topics are important per the user's list.

  The challenge is balancing depth with brevity - each question must be one breath, no multi-parters. Wording will be tight and conversational while covering complex ideas. The goal is an interview that leaves listeners understanding both the radical proposal and its hardest challenges.
answer: |-
  Here are 10 substantive interview questions with tailored follow-ups, sequenced to progressively challenge the comparative deflection and end with a non-comparative test:

  1.  **Question:** Given compulsory service with hardship deferrals, won't the actual legislature exclude those with dependent care duties, demanding jobs, or chronic illness, creating a *de facto* chamber of the economically secure and healthy?  
      *(Follow-up anticipating deflection:)* Even if elections underrepresent these groups too, how does compulsion *specifically* solve this systemic skew without creating new ones?

  2.  **Question:** Without electoral accountability, what concrete mechanism removes a legislator caught taking bribes or who proves utterly incompetent mid-term?  
      *(Follow-up anticipating deflection:)* Saying elections fail to remove bad actors doesn't tell us what *replaces* that function under sortition – what's the actual removal trigger and who pulls it?

  3.  **Question:** You value descriptive representation intrinsically, but without constituents to answer *to*, what prevents members from ignoring the views of the demographic groups they statistically resemble?  
      *(Follow-up anticipating deflection:)* If elections don't guarantee fidelity either, how does a descriptive chamber *without electoral pressure* achieve this intrinsic value differently or better?

  4.  **Question:** Stratifying the lottery by category ensures statistical mirrors, but doesn't explicitly selecting members *by* identity categories inherently invite identity-based campaigning and lobbying *within* the sorted chamber?  
      *(Follow-up anticipating deflection:)* Granting identity politics exists in elections, how does the *selection mechanism itself* not exacerbate this under sortition by design?

  5.  **Question:** With no parties and no confidence votes, how does a sorted legislature coherently form or remove a functional executive government?  
      *(Follow-up anticipating deflection:)* While partisan executives have flaws, what specific *sortition-compatible process* aggregates preferences to choose and control ministers daily?

  6.  **Question:** The permanent secretariat setting agendas and briefing members wields immense power; without elected oversight, what constrains *their* biases or agenda-setting power over the citizen legislators?  
      *(Follow-up anticipating deflection:)* Even if civil servants influence policy now, how is an unelected secretariat *empowered over the entire legislature* not a far greater, unchecked concentration?

  7.  **Question:** Advisory mini-publics like Ireland's convention succeed partly *because* they are temporary, focused, expert-supported, and ultimately validated by vote – how does a permanent, general legislature lacking these features avoid gridlock or poor decisions?  
      *(Follow-up anticipating deflection:)* Aren't the scale, permanence, and finality of a sovereign legislature fundamentally different challenges that mini-publics haven't solved?

  8.  **Question:** In a statistically "typical" assembly, a small minority group might have only one or zero members – what protects their interests from being consistently overridden by the majority microcosm?  
      *(Follow-up anticipating deflection:)* Even if elections poorly protect small minorities, how does a chamber designed to reflect the *majority* distribution *better* protect those it statistically marginalizes?

  9.  **Question:** If sortition applied to a second chamber or specific decisions addresses self-selection and accountability concerns while proving feasible, why insist on the radical version abolishing elections entirely?  
      *(Follow-up anticipating deflection:)* Doesn't the success of *limited* sortition models actually demonstrate that full abolition is unnecessary to gain its benefits while avoiding its largest risks?

  10. **Question:** What specific, observable outcome from a *real* sorted national legislature operating under your model – not an advisory body – would genuinely convince you the radical version is unworkable and force retreat to a second chamber?  
      *(Follow-up anticipating deflection:)* This asks for evidence *against* your specific model, not a comparison – what failure unique to *full sortition* would be decisive?

  **Cuts if Time Runs Short (First Half):**

  *   **Question 8 (Minority Protection):** While important, the core objections of accountability, compulsion, and the leap from mini-publics are more fundamental to challenging the *viability* of the entire model. Minority protection is a critical issue but perhaps slightly more niche than the structural mechanics of power.
  *   **Question 7 (Mini-publics Gap):** The differences between advisory bodies and a sovereign legislature are crucial, but the follow-up on agenda control (Q6) and executive formation (Q5) directly challenge core functions of governance that might be prioritized first. The mini-public point is powerful but can be partially inferred by pressing on permanence/generality elsewhere.

  **Rationale for Sequence & Design:**

  1.  **Starts with Practical Implementation (Q1-2):** Grounds the discussion in the real-world mechanics of compulsion and immediate accountability gaps.
  2.  **Challenges Core Normative Claims (Q3-4):** Directly interrogates descriptive representation's weight and potential unintended consequences of stratification.
  3.  **Focuses on Core Governance Functions (Q5-6):** Addresses the most critical gaps – forming an executive and controlling the unelected bureaucracy wielding agenda power. These are structurally fundamental.
  4.  **Highlights the Feasibility Gap (Q7-8):** Contrasts the proposal with existing, successful *but fundamentally different* models of sortition and probes majoritarian risks.
  5.  **Undercuts Moderation (Q9):** Challenges the necessity of the radical leap before testing milder versions.
  6.  **Forces Non-Comparative Falsification (Q10):** The closer demands a concrete, observable failure condition specific to her model, making deflection impossible.
  7.  **Follow-Ups Preempt Deflection:** Each follow-up explicitly redirects from "elections are worse" to "solve this *for sortition*."
  8.  **Breathable:** Each question and follow-up is constructed for clear oral delivery in one breath, avoiding sub-stacking.
