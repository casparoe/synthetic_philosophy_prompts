  Okay, the user is producing a political theory podcast and needs interview questions for a guest advocating full sortition. The guest has specific commitments: mandatory summons to avoid self-selection, rejection of electoral accountability as a flaw, and intrinsic value in descriptive representation. She also uses a deflection tactic, arguing that any criticism applies more to electoral systems. The user wants 8-10 substantive questions with follow-ups, covering specific topics like compulsion, accountability, descriptive representation, executive control, differences from existing mini-publics, minority protections, and rejection of moderate alternatives. The sequence should make the deflection harder to use and end with a non-comparative question.

