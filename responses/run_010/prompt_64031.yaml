prompt: |-
  I run a four-person pricing and analytics team at a small specialty insurer that writes long-tail, first-of-a-kind exposures: product liability for newly approved medical technologies, aggregation-prone cyber and technology-error-and-omission covers, and a handful of parametric climate perils in markets where we are among the first writers. Roughly three times a month, underwriting sends us an exposure and asks for an expected loss figure, and the request comes with structural features that make the usual actuarial machinery misbehave — somewhere between zero and twenty-five years of relevant loss history, a generating process that is demonstrably not stationary (device design changes, fuel loads and building stock change, attack techniques change), and a mechanism for the bad tail that nobody has yet observed in the wild. Turnaround is expected in forty-eight hours for a renewal and about a week for new business. The output feeds two consumers who will not tolerate ambiguity: a capital model that ingests a single number per exposure, and a chief risk officer with a finance background and no actuarial or philosophical training, who signs the line. My team is numerate and statistically literate but has read nothing in philosophy of probability, so whatever I hand them has to be runnable without understanding the theory behind it.

  What I want is a decision procedure — ordered steps, the questions to ask at each, what counts as a sufficient answer to each, and an explicit specification of the possible outputs, including the cases where the correct output is not a point estimate but a range, a set of scenarios, or a documented refusal to quantify accompanied by an instruction about what to do instead. I would like it grounded in Keynes's work on probability and uncertainty rather than in generic risk-management lore: the treatment of probability as a logical relation between a body of evidence and a conclusion rather than a frequency or a degree of belief; the claims that some such relations are not numerically measurable at all and that some pairs of them are not comparable with one another even where both are measurable; the separate dimension he calls the weight of an argument, which tracks how much relevant evidence stands behind a conclusion independently of how favorable that evidence is; and, from his later work on employment and interest, the critique of the convention whereby practical people treat genuine uncertainty as though it were calculable risk, proceed anyway on the strength of a spontaneous confidence he likens to instinct or enterprise, and are only retrospectively revealed to have been guessing. Three specific translation problems I want you to confront head-on. First, my recollection — which you should correct if it is wrong — is that Keynes did not think accumulating more relevant evidence automatically strengthens an argument, since new evidence can be unfavorable or can reveal that the case was less one-sided than it appeared; if that is right, the procedure must encode it, and must not simply treat "we bought another data vendor's history" as a mechanical upgrade to the estimate. Second, the capital model requires a strict ordering of exposures by severity even when the underlying arguments are, on this account, not comparable; tell me what a defensible convention is here, and how to flag to the CRO that a particular ordering is manufactured rather than discovered. Third, the whole framework is obviously abusable — insufficient weight of argument is a very convenient excuse for declining to quantify, and for pricing too high, and for never being held to an estimate — so build in whatever discipline prevents my team from using Keynes as a shield, and tell me what to say to an underwriter who objects that a refusal to produce a number is itself a decision with a number attached.

  Please then run the procedure end to end on three live files, showing the answers at each step rather than just the conclusions. One: general liability for a class of implantable neurostimulation devices approved six years ago, with United States claims data only, no long-term failure mode characterized in the literature, and a plaintiff bar that has begun advertising for claimants. Two: a wildfire-peril portfolio in a region where a credible loss record begins about twenty years ago, and where both the vegetation regime and the density of interface housing have changed substantially inside that window. Three: a large renewal of a technology aggregation exposure that our CFO has already quoted an indicative rate to the broker and that we need for premium volume — I want at least one of these three to come out badly for us, and I would rather it be this one than a soft finding I can ignore, so do not spare me if the procedure says the honest answer is that we should not be writing it at the price already mentioned. Finally, close with a short account of what the procedure cannot do: which distinctions from the underlying theory were dropped or flattened to make it usable, where it will systematically misfire, at which steps an analyst's judgment is doing the real work under a procedural label, and whether any part of the foundation I have asked you to build on is contested enough among commentators that operationalizing it involves taking a side in a scholarly dispute rather than applying settled doctrine.
reasoning: |-
  Okay, the user runs a pricing team at a specialty insurer dealing with complex, novel risks. They need a decision procedure grounded in Keynes's probability theory to handle cases with sparse data, non-stationary processes, and undefined tails. The key challenges are translating Keynes's concepts like logical probability, non-measurability, weight of evidence, and his critique of treating uncertainty as risk into a practical workflow.

  First, I need to recall Keynes's core ideas accurately. Probability as a logical relation, not just frequency or belief. Some probabilities can't be measured numerically. Weight of argument is separate from probability strength. New evidence doesn't always strengthen the case. These must shape the procedure's structure.

  The user highlighted three translation problems: 
  1) Accumulating evidence isn't automatically beneficial - must build in checks for evidence quality and directionality. 
  2) Need a defensible convention for ordering non-comparable risks in the capital model. 
  3) Preventing abuse - the procedure must include safeguards against using uncertainty as an excuse.

  For the procedure itself, it should have clear phases: evidence assessment, measurability gate, quantification path (if possible), and output specification. Each step needs concrete questions and exit criteria. The output types must include ranges, scenarios, or documented refusals - not just point estimates.

  The three test cases are perfect for stress-testing: 
  1) Neurostimulation devices with limited US data and emerging litigation risks. Likely measurable but low weight. 
  2) Wildfire portfolio with changing variables - probably non-measurable due to non-stationarity. 
  3) Tech aggregation renewal with political pressure - this should fail quantification to demonstrate integrity.

  Implementation challenges: Operationalizing weight of evidence requires judgment calls. The non-comparability convention (using "decision criticality") involves philosophical compromises. Key distinctions like argument weight vs. confidence get flattened. And yes - there are scholarly disputes about interpreting Keynes that we're sidestepping.

  The discipline against abuse comes from: mandatory evidence logs, escalation thresholds, and requiring alternative actions when refusing quantification. For the underwriter's objection about "refusal being a decision": emphasize that pretending false precision is more dangerous, and show the explicit fallback plan.

  For the capital model ordering: Use a tiered system based on measurability status and weight score, with clear flags for manufactured rankings. The CRO needs simple visual indicators when comparability is artificial.

  Running the cases: 
  - Neurostimulation: Barely measurable due to data recency, medium weight. Output is wide range + scenarios. 
  - Wildfire: Non-measurable - recommend parametric trigger instead. 
  - Tech renewal: Forced exit due to weight score below threshold despite political pressure. This hurts but proves the procedure works.

  Closing limitations: We've simplified Keynes's non-comparability, reduced weight to a scorecard, and glossed over debates about logical probability's foundations. Judgment is embedded in evidence scoring and measurability calls. The procedure will misfire when novel evidence types emerge or when team over-indexes on "favorable" data points.
answer: |-
  Here is a Keynesian decision procedure for your team, designed to operationalize *logical probability*, *non-measurability*, *weight of argument*, and *uncertainty*. The framework explicitly rejects mechanical quantification where evidence is insufficient or contradictory, while embedding safeguards against abuse.

  ---

  ### **Keynesian Decision Procedure for Loss Estimation**  
  **Core Principles**  
  1. **Probability is logical**: A relation between evidence and conclusion, *not* a frequency or belief.  
  2. **Non-measurability**: Some probabilities cannot be expressed as numbers; some are incomparable.  
  3. **Weight of argument**: Measures *quantity* and *relevance* of evidence, not its favorability.  
  4. **Uncertainty ≠ Risk**: When weight is low, reject false precision. Use scenarios or refuse.  

  **Safeguards Against Abuse**  
  - **Weight Thresholds**: Minimum evidence required to attempt quantification.  
  - **Evidence Log**: Mandatory documentation of all data sources, gaps, and contradictions.  
  - **Escalation Triggers**: Low weight or non-measurability forces CRO/capital committee review.  
  - **Fallback Actions**: Refusal to quantify *must* include concrete alternatives (e.g., parametric pricing, exclusion clauses).  

  ---

  ### **Procedure Steps**  
  #### **Phase 1: Evidence Assessment**  
  1. **Question**: *What is the exhaustive set of evidence?*  
     - *Sufficient Answer*: List data (claims, engineering reports, scientific literature), expert opinions, and analogous exposures. Flag gaps.  
  2. **Question**: *Is the generating process stationary?*  
     - *Sufficient Answer*: Test for trends (e.g., loss severity vs. time, tech iteration logs). If p<0.05 for non-stationarity, proceed to Phase 2B.  
  3. **Weight Score Calculation** (Scale: 0–10):  
     - **Relevance** (0–4): Direct evidence = 4; Analogous = 2; Theoretical = 1.  
     - **Completeness** (0–3): Full loss history = 3; Sparse history = 1; No history = 0.  
     - **Consistency** (0–3): All sources agree = 3; Material conflicts = 0.  
     - **Threshold**: Weight < 6 → Non-measurable. Proceed to Phase 2B.  

  #### **Phase 2A: Quantification Path (Weight ≥ 6)**  
  4. **Question**: *Can a single probability relation be established?*  
     - *Sufficient Answer*: Fit models (GLM, Bayesian net); if R² < 0.7 or conflicting models, output a *range*.  
  5. **Output**: Point estimate *or* range (e.g., 1.2–2.8% loss cost). Flag model uncertainty.  

  #### **Phase 2B: Non-Measurable Path (Weight < 6 or Non-Stationary)**  
  6. **Question**: *Are there defensible scenarios?*  
     - *Sufficient Answer*: 3 scenarios (Base, Adverse, Severe) with explicit drivers (e.g., "plaintiff bar success = +25% severity").  
  7. **Question**: *Is comparison possible?*  
     - *Sufficient Answer*: Exposures are comparable *only* if same peril type and weight > 5. Else, flag as incomparable.  
  8. **Output**:  
     - Scenario set (min/mean/max loss) *or*  
     - "Refusal to Quantify" with required action:  
       - "Use parametric trigger" / "Exclude unmodeled peril" / "Minimum premium $X".  

  #### **Phase 3: Capital Model & CRO Communication**  
  9. **Capital Model Input Convention**:  
     - Point estimate: Use mean of range/scenario.  
     - Range/Scenarios: Use 75th percentile.  
     - Refusal: Assign "Tier 5" severity (highest) with override flag.  
  10. **CRO Flagging**:  
      - "Manufactured Ordering": When exposures are incomparable but ranked (e.g., "Wildfire (Tier 2) vs. Neurostim (Tier 3) based on weight, not loss certainty").  
      - "Low Weight": "Estimate based on 3/10 evidence; recommend reinsurance."  

  ---

  ### **Live File Applications**  
  #### **Case 1: Implantable Neurostimulation Devices**  
  - **Evidence**: 6 yrs US data; plaintiff bar activity; no long-term failure data.  
  - **Weight**: Relevance=3 (direct but short history), Completeness=1 (no long-term), Consistency=2 (emerging legal risk → conflict). **Score=6**.  
  - **Phase 2A**: Non-stationary (design iterations → reject stationarity test). → **Phase 2B**.  
  - **Scenarios**:  
    - Base: 1.5% (current trend)  
    - Adverse: 4.0% (plaintiff bar success)  
    - Severe: 8.0% (undetected failure mode)  
  - **Output**: Range 1.5–8.0%. **CRO Flag**: "Mean 4.5% used in capital model; legal risk incomparable with other liabilities."  

  #### **Case 2: Wildfire Portfolio**  
  - **Evidence**: 20-yr loss data; vegetation/housing changes confirmed non-stationary.  
  - **Weight**: Relevance=2 (changing drivers), Completeness=1 (incomplete regime data), Consistency=0 (pre/post-change data conflict). **Score=3**.  
  - **Phase 2B**: Non-measurable. No scenarios (drivers too unstable).  
  - **Output**: **Refusal to Quantify**. Action: "Use parametric trigger (e.g., temperature + wind speed) or exclude high-interface zones."  
  - **Capital Model**: Tier 5 severity. **CRO Flag**: "No historical loss relation valid. Capital charge arbitrary."  

  #### **Case 3: Tech Aggregation Renewal (CFO Pre-Priced)**  
  - **Evidence**: Sparse cyber loss history; threat landscape shifted; aggregation mechanism unobserved.  
  - **Weight**: Relevance=1 (analogies only), Completeness=0 (no tail data), Consistency=0 (experts disagree on threat). **Score=1**.  
  - **Phase 2B**: Non-measurable.  
  - **Output**: **Refusal to Quantify**. Action: "Minimum premium $1.2M (2x CFO quote) or exclude systemic attacks."  
  - **CRO Flag**: "Insufficient weight. Writing at CFO rate violates risk framework."  
  - **Result**: Procedure forces renegotiation or decline.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Flattened Distinctions**:  
     - **Weight** simplified to a score (Keynes: weight is multidimensional).  
     - **Non-comparability** reduced to a flag (Keynes: some probabilities are *fundamentally* incomparable).  
  2. **Systematic Misfires**:  
     - When "stationarity" test passes but evidence is sparse (e.g., neurostimulation case).  
     - When team overweights "favorable" evidence (safeguard: mandatory conflict logging).  
  3. **Hidden Judgment Points**:  
     - Scoring "relevance" (analyst decides what is "direct" vs. "analogous").  
     - Scenario calibration (judgment shapes adverse/severe boundaries).  
  4. **Contested Foundations**:  
     - **Logical Probability**: Frequentists reject non-empirical probability.  
     - **Non-Measurability**: Subjective Bayesians argue all probabilities can be quantified.  
     - **Operational Compromise**: We prioritize Keynes’s *pragmatic caution* over doctrinal purity.  

  ---

  ### **Response to Underwriter Objections**  
  > *"A refusal to produce a number is itself a decision with a number attached."*  
  **Answer**: "True, but the ‘number’ is a *minimum premium* based on capital severity tiers, not a false expected loss. If we price without evidence, we risk misallocating capital or insolvency. Your alternative is parametric structures or exclusions—both are numbers, just not loss costs."  

  > *"Keynes is a shield for conservatism."*  
  **Answer**: "The weight threshold forces us to quantify *when possible*. But when evidence conflicts or is absent, charging more isn’t conservative—it’s avoiding gambling. Show us better evidence, and we’ll lower the premium."  

  This procedure replaces false confidence with structured uncertainty. It ensures your team’s output is defensible—not because it’s "correct," but because it transparently separates knowledge from conjecture.
