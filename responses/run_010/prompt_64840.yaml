answer: |-
  **1**  
  I chip the verdigris away,  
  This stubborn, greenish grey.  
  The photo shows a laughing face,  
  A steady, forward gaze.  
  My brush adds fire to the cheek,  
  A jaw that holds the light.

  **2**  
  That holds the light? This vaulted room  
  Keeps different kinds of bright:  
  Old sums for polish, wax, and broom,  
  In stacks that never breathe right.  
  The damp wool smell clings close and deep.  
  Preserved for its own sake.

  **3**  
  Preserved for sake? My pen scrapes hard  
  Across the plea I make.  
  This bronze lie standing in the yard  
  Whose shadow makes hearts break.  
  *Founder: Mrs. Eleanor Vance, Chair* —  
  My own blood signed it there.

  **4**  
  My blood signed there? He sees the weight  
  On sculptor, clerk, and heir.  
  He knows why the chisel shakes,  
  Why ink outlasts the hand,  
  Why signatures chain like oaths.  
  He understands. He stands.

  **5**  
  He stands. The thaw lets deep roots shift,  
  Sap rise in the split bark.  
  The square accepts both gift and rift,  
  New green against the dark.  
  Wounds knit where old stones settle down.  
  I chip the verdigris away.

  ---

  **Key (for your reference only - not part of the poem):**  
  *Stanza 1: Monumental mode.* Action-focused (sculptor shaping an inspiring past). Rots when the jaw is "touched up" beyond truth, becoming fabrication ("adds fire to the cheek").  
  *Stanza 2: Antiquarian mode.* Preservation-focused (secretary valuing the past "for its own sake"). Rots in suffocation ("stacks that never breathe right," smell of decay).  
  *Stanza 3: Critical mode.* Liberation-focused (woman indicting the oppressive past). Rots into self-destruction when she realizes her indictment implicates her own inheritance ("My own blood signed it there").  
  *Stanza 4: The "Fair Judge."* Represents the illusion of objective historical judgment. Paralysis ("He understands. He stands") is the rot inherent in pretending to stand outside history.  
  *Stanza 5: Life.* Growth ("Sap rise"), healing ("Wounds knit"), and forward movement that incorporates, rather than escapes, the past ("The square accepts both gift and rift"). The unchanged opening line returns as the inescapable condition of life - always beginning by engaging the inherited corrosion ("verdigris").
