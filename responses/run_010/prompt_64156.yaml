prompt: |-
  Third year in economic history, comparative track, and I keep hitting the same dialectical move in the divergence literature and I can't find a name for it anywhere.

  It goes like this. Someone offers a factor for why industrialization got going in Britain and not in the Yangzi delta — coal, say, or wages high enough to make labor-saving machinery worth building, or European demographic restraint. Somebody else shows the same factor was present on the Chinese side too at roughly comparable levels around 1750: they had coal (and then the argument shifts to where the coal sat and how deep it was), they had commercialized agriculture and fairly integrated markets, and on the restraint case the revisionist population work made Chinese fertility control look pretty responsive to economic conditions as well. And the original claim is treated as dead. Fine so far. But the response is never to drop the factor — it's to demote it from "the cause" to "one condition among several that had to line up," and add a second factor that's claimed to be uniquely European. When the second one also turns up on both sides, same move again: demote and add. Three or four rounds in you have an account that is a conjunction of six or seven conditions, not one of which distinguishes the two cases, but whose joint presence supposedly does the work.

  That last part is what I want a handle on. The "they had it too" objection only bites if the explanans is supposed to be a difference-maker. Once the account is a conjunction assembled out of the failures of its own components, no single component has to be a difference-maker anymore, so the test that generated the account no longer applies to it. The account has become immune to the very standard it was built under, and its read as refinement rather than as a loss — nobody says out loud that the standard changed, they just keep publishing.

  I know the comparative-methods people have machinery for small-N inference and I know there's a philosophy literature on contrastive explanation, but I haven't found either one addressing this particular slide, and I suspect it isn't quite what either of them is about. So: is there an established term for it? If yes, what does that term actually pick out, and does my description match it or is it a cousin that gets conflated with it in practice? If no, coin one, define it properly, and give me boundary cases — especially how it differs from a legitimate conjunctural explanation that was specified up front and independently, and whether there's any principled way to tell "the conjunction was there all along and the debate finally uncovered it" from "the conjunction is just sediment built out of defeated factors." I don't want a bare label, I want the edges of the thing and what falls outside them.

  Tell me how confident you are in the carving you end up with, and single out the one claim in your answer you're least sure of. And lead with your bottom line in the first sentence, then the reasoning — no preamble, and don't restate my question back at me.
reasoning: |-
  Okay, let me tackle this user's query. They're a third-year economic history student focusing on comparative studies, and they've noticed a recurring pattern in the divergence literature. The issue is how scholars handle factors that initially seem unique to Britain but turn out present in China too. Instead of discarding these factors, they demote them to one of several necessary conditions and add another supposedly unique factor. This repeats until a conjunction of conditions, none individually distinctive, is presented as the explanation. The user wants to know if there's a term for this move or if it needs coining, along with clear boundaries.

  First, I recall that in philosophy of science, conjunctive explanations are common, but the problem here is the iterative, ad hoc nature. The user mentioned contrastive explanation and small-N methods, but those don't quite fit. I think about concepts like overdetermination or causal salad, but those aren't precise. Maybe "conjunctive subsumption"? That captures the absorption of failed factors into a conjunction. But I need to define it properly.

  The key elements are the iterative demotion and the shifting of explanatory burden. Each time a factor is challenged, it's relegated to being part of a set, and a new unique factor is added. The resulting conjunction isn't falsifiable by the same evidence that invalidated individual factors. This differs from a legitimate conjunctural explanation, which is specified a priori with independent evidence for the conjunction's uniqueness.

  Boundaries are important. A legitimate case might be when new evidence shows the conjunction itself is unique. But in the pattern described, the conjunction is constructed post-hoc from debunked factors. The user also wants to know how to distinguish between sedimented conjunctions and genuine discoveries. That's tricky. It involves checking if the conjunction was predicted beforehand or if it's an accumulation of retreated factors.

  Confidence-wise, the term "conjunctive subsumption" feels right, but I'm less sure about distinguishing sedimented from genuine cases. The user's description matches the pattern in divergence literature, so the examples like coal and fertility control illustrate it well. The least certain part is whether there's a principled way to tell the two apart—it might rely on historiographic evidence of the debate's progression rather than a methodological rule.
answer: |-
  **Bottom line:** The dialectical move you describe is most precisely termed **conjunctive subsumption**, defined as the iterative ad hoc transformation of a falsified *sufficient* or *unique* causal claim into a *necessary conjunct* within an increasingly complex and untestable conjunction, immunizing the explanation against the falsifying evidence while preserving the original factors.

  **Reasoning:**

  1.  **The Core Mechanism:**
      *   **Initial Claim (Falsifiable):** Factor X is proposed as *the* sufficient cause or the key *difference-maker* explaining divergence (e.g., "British coal access *caused* industrialization").
      *   **Falsification:** Evidence shows X was present comparably in the contrast case (China). This falsifies X as a sufficient or unique cause.
      *   **Ad Hoc Demotion & Addition:** Proponents *demote* X to a *necessary condition* ("X was essential, *but*...") and introduce a *new* factor Y, claimed to be uniquely present alongside X ("Britain had X *and* Y").
      *   **Iteration:** When Y is also shown present in China, the process repeats: (X AND Y) becomes "necessary but insufficient," and factor Z is added, creating (X AND Y AND Z). This continues.
      *   **Immunization:** The final conjunction (X AND Y AND Z AND ...) is presented as the *sufficient* explanation. Crucially, *no single component* is claimed to be unique or sufficient anymore. The falsifying evidence against each *individual* factor (its presence in China) is irrelevant to the *conjunction* claim. The standard of proof (difference-making for individual factors) that drove the debate is silently abandoned for the conjunction.

  2.  **Why "Conjunctive Subsumption"?**
      *   **Conjunctive:** The explanation becomes a logical AND statement of multiple conditions.
      *   **Subsumption:** Each falsified factor is *subsumed* (incorporated, absorbed) into the growing conjunction, losing its independent explanatory claim but remaining present. It's "saved" by becoming a necessary cog in a larger, more complex machine.
      *   It captures the *process* (iterative, ad hoc) and the *outcome* (complex, untestable conjunction built from defeated claims).

  3.  **Boundaries and Differentiation:**
      *   **Legitimate Conjunctural Explanation (The Gold Standard):**
          *   **A Priori Specification:** The conjunction (e.g., A AND B AND C) is proposed *from the outset* as the hypothesized sufficient cause. It's not built reactively from failed single factors.
          *   **Independent Justification:** There is theoretical or comparative evidence suggesting *the conjunction itself* is unique or causally potent *as a package*, distinct from justifying each factor individually. (E.g., "We argue it was the *interaction* of A, B, and C in a specific institutional context that was unique").
          *   **Testability:** The *unique presence of the conjunction* in the outcome case (vs. the contrast case) is the core testable claim. Finding A, B, or C individually in the contrast case doesn't falsify it; finding the *entire conjunction* present comparably in the contrast case *does*.
      *   **Conjunctive Subsumption (The Problematic Pattern):**
          *   **Reactive Construction:** The conjunction is built *ad hoc* and *iteratively* in response to falsification of individual factor claims. It's a defensive maneuver.
          *   **No Independent Justification for Conjunction:** The conjunction gains plausibility *only* because its components were once (falsely) thought to be unique. There's no independent argument for why *this specific combination* is uniquely potent beyond the fact that the individual factors failed the uniqueness test.
          *   **Immunization, Not Testability:** The primary function becomes immunizing the explanation against past falsifications. Testing the *conjunction's* uniqueness is often neglected or deemed impractical due to complexity, moving the goalposts.
      *   **Key Boundary Case - Genuine Discovery vs. Sediment:**
          *   **Genuine Discovery:** New evidence *directly* shows that while Factor X was present in both places, its *functional role* or *interaction* with other factors (Y, Z) within a *specific, identifiable system* was qualitatively different and causally decisive. The conjunction is argued *based on this systemic interaction*, not just the accumulation of factors. (E.g., "Chinese coal existed, but its exploitation was constrained by a *specific* property rights regime interacting with transport costs, unlike Britain" - where the property rights/transport interaction is the argued unique conjunction).
          *   **Sediment:** The conjunction is simply the list of all factors previously claimed as unique but falsified, now strung together with an "AND" and presented as sufficient without new evidence for the conjunction's uniqueness or systemic logic. The argument relies on the *absence* of the whole list in the contrast case, inferred solely from the (individually falsified) components.

  4.  **Distinguishing Sediment from Discovery (The Hard Part):**
      There is **no purely methodological or logical** silver bullet. Assessment requires **historiographic judgment**:
      *   **Process:** Was the conjunction built reactively through the dialectic you describe, or was it proposed independently?
      *   **Justification:** Does the proponent offer *positive evidence* or a *compelling theoretical mechanism* for the *conjunction itself* being unique and causally effective? Or is the argument primarily that the contrast case lacked *one* of the (individually falsified) conjuncts?
      *   **Testability:** Can the *presence/absence of the entire conjunction* be assessed empirically in both cases? Or is the conjunction defined so vaguely or complexly that it becomes effectively untestable ("only Britain had the *precise alignment*")?
      *   **Parsimony:** Does the conjunction offer significant explanatory power beyond simply listing factors known to be present? Does it illuminate *how* they worked together?
      *   **Burden of Proof:** The burden lies with the proponent of the conjunction to demonstrate its unique presence and causal efficacy, not just assert it after individual factors fail.

  **Confidence & Least Certain Claim:**

  *   **High Confidence:** The core description of the dialectical move ("demote and add") and its problematic immunization effect is accurately captured by the term "conjunctive subsumption" as defined. This pattern is prevalent in complex historical debates like the Great Divergence.
  *   **High Confidence:** The distinction between legitimate conjunctural explanation and conjunctive subsumption based on *a priori* specification, independent justification, and testability is sound.
  *   **Moderate Confidence:** The "Genuine Discovery vs. Sediment" boundary case description captures the key evaluative criteria (process, justification, testability).
  *   **Least Certain Claim:** The assertion that there is **no purely methodological or logical** way to definitively distinguish sediment from discovery in all cases. While true that historiographic judgment is essential, there might be more formal ways to assess the *degree* of ad-hocness or the strength of the independent justification for the conjunction within comparative methodology that I haven't emphasized enough. However, I remain confident that a bright-line logical rule is impossible; judgment based on the factors outlined is necessary.
