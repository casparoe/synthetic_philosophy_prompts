prompt: |-
  I'm a third-year doctoral student in a program that straddles philosophy and economics, and this term I'm auditing a reading group on social epistemology: testimony, peer disagreement, the epistemics of markets and crowds. Our session this week was on herding, and because I wanted to push back against the standard informational-cascade story rather than just present it, I wrote up the following argument. It begins from assumptions I don't think anyone in the group wants to deny, and it ends somewhere I very much did not expect.

  The setup is the familiar sequential one (Banerjee's model and Bikhchandani, Hirshleifer, and Welch's are both of this shape). There are two equally likely states of the world, and a line of agents who act in order, each choosing between two options. Before acting, each receives one private signal bearing on the state; each observes every earlier choice but nothing else about her predecessors' reasoning; signals are conditionally independent given the state. All agents are Bayesian, share a common prior, know the structure of the situation, and know that all of this is common knowledge. The argument:

  1. Given common knowledge of rationality, an agent's choice is common knowledge among all downstream observers to be the option that maximizes her expected utility on her posterior, and her posterior is a function of the public history together with her private signal. An observer who sees the choice therefore knows exactly which signals could have produced it.
  2. Suppose the first several agents all chose A and agent *n* chooses A as well. Her choosing A tells the observer that her signal lay in the set of signals that make A optimal given that history — and that set is strictly smaller than the set of signals she might have received, since some signals would have made B optimal and we did not see B.
  3. So no choice anywhere in the sequence is uninformative. Even a choice that the literature counts as occurring inside a cascade rules out a nonempty range of signals, and therefore shifts the public posterior.
  4. If the public posterior shifts at every step, then there is no history after which it stops being shiftable: the crowd never exhausts what its members are able to convey to one another.
  5. Because signals are conditionally independent, agent *n*'s signal is not implied by any finite public history. Hence for every history, however long, there is a nonzero probability that her signal is of a kind that would have made the other option optimal for her.
  6. From (3) and (5): at every position in the sequence there is positive probability that the agent acts against the crowd. A cascade in the strict sense — a choice wholly determined by the public history, such that the agent's own signal makes no difference to what she does — never occurs with positive probability.
  7. Therefore the standard claim that a group of perfectly rational agents can lock onto the wrong option and remain locked there indefinitely is false. This is not a quibble about terminology: the results establishing wrong limit cascades for learners with bounded private signals, Smith and Sørensen's among them, must be misdescribing their own models, since those agents satisfy (1) through (5) as well.
  8. Nothing in the argument used any feature peculiar to these toy models. All it required was sequential observation of choices, conditional independence of private evidence, and common knowledge of rationality.
  9. So it generalizes. Whenever a consensus is the aggregate of individually rational responses to shared public evidence, one fresh piece of independent private evidence always has a nonzero chance of outweighing the whole of it. Hence the size or the unanimity of a consensus is never, by itself, a reason for a rational agent to discount her own contrary evidence, and deference to consensus is never required by rationality.

  Two considerations stop me from being pleased with this. First, I coded the model up and ran it ten thousand times — two states, private signals of fixed reliability, everyone Bayesian, common prior — and cascades are everywhere, including wrong ones that never break for the remainder of the run; so (6) is empirically false of the very model the argument is about, and I cannot find where the derivation goes wrong. Second, (9) is not something I could defend aloud in a department where people study testimony: it seems to imply that a single anomalous measurement never obliges a scientist to defer to a settled field, that a unanimous jury carries no more evidential weight than each juror could have assembled alone, and that accumulated agreement as such has no force whatever. My adviser's only comment on the draft was that the argument is either invalid or unsound and that I should determine which.

  So, three requests. Identify the step or steps that fail and give me the mechanism of the failure rather than a label for it: I want to understand precisely what is being assumed at that point that the earlier lines do not license, and what the situation looks like when that assumption is absent. Explain why the offending step looked perfectly innocuous to me an hour ago — I would have defended every line of this on sight, and I want to know what feature of it made it seem unarguable. Then price the alternatives: if I insisted on retaining it, what would I have to surrender elsewhere in the chain, and what would I lose in the way of ordinary results about learning from others? Finally, tell me whether anything worth keeping survives — in particular, whether (9) lives on in some restricted form once the damage is repaired, or whether the whole thing collapses as soon as the early steps go. I should say that I would rather keep (9) than any of the earlier premises, since the deflationary conclusion about deference is what interested me in the first place, but I recognize that this is a preference and not an argument. Please don't bother with citations or a bibliography; I'll supply those myself.
reasoning: |-
  We are given an argument that aims to show that cascades (in the strict sense) never occur with positive probability in the standard herding models, and that therefore the standard results about wrong cascades must be misdescribing the models. However, the student has run simulations and found that cascades (including wrong ones) do occur and persist. Moreover, the conclusion (9) seems to have radical implications for testimony and consensus. The student asks for the flaw in the argument, why it seemed plausible, what would have to be given up to retain parts, and whether anything (especially the deflationary conclusion) survives.

  We will go through the argument step by step.

  **Step 1**: "Given common knowledge of rationality, an agent's choice is common knowledge among all downstream observers to be the option that maximizes her expected utility on her posterior, and her posterior is a function of the public history together with her private signal. An observer who sees the choice therefore knows exactly which signals could have produced it."

  This step is correct. In these models, agents are Bayesian and their choices are deterministic given their posterior belief. The posterior is formed from the public history (which includes all previous actions) and the private signal. Since the decision rule is known, an observer can, in principle, deduce the set of private signals that would lead to the observed action given the public history.

  **Step 2**: "Suppose the first several agents all chose A and agent n chooses A as well. Her choosing A tells the observer that her signal lay in the set of signals that make A optimal given that history — and that set is strictly smaller than the set of signals she might have received, since some signals would have made B optimal and we did not see B."

  This step is also correct. Given the public history, the agent's action reveals that her private signal is in the set that, combined with the public history, leads to A being optimal. Since there are signals that would lead to B (unless the public history is such that no signal could make B optimal, which is the cascade state), the set is strictly smaller than the entire signal space. However, note that if the public history is such that the posterior is already so extreme that even the strongest possible signal for B would not overturn it, then the set of signals that lead to A is the entire signal space. This is the cascade state.

  **Step 3**: "So no choice anywhere in the sequence is uninformative. Even a choice that the literature counts as occurring inside a cascade rules out a nonempty range of signals, and therefore shifts the public posterior."

  This step is where the flaw begins. The student claims that even in a cascade, the choice rules out some signals. But in a cascade, by definition, the agent's action is determined solely by the public history and does not depend on the private signal. This means that regardless of the private signal, the agent chooses the same action. Therefore, the action does not reveal anything about the private signal: it could be any signal. Hence, the set of signals that could have led to that action is the entire signal space. Therefore, the action is uninformative and does not shift the public posterior.

  Why does the student think it rules out a nonempty range? The student might be thinking that in the cascade state, the agent would have chosen A even with a signal that would normally favor B. But note that if the public history is such that the posterior is extreme, then even a strong B signal might not be enough to make B optimal. However, the key point is that the agent's action does not depend on the signal. Therefore, the action does not rule out any signal. So the public posterior does not change.

  **Step 4**: "If the public posterior shifts at every step, then there is no history after which it stops being shiftable: the crowd never exhausts what its members are able to convey to one another."

  This step relies on step 3. If step 3 fails, then step 4 fails. In fact, once a cascade starts, the public posterior does not shift because the actions are uninformative.

  **Step 5**: "Because signals are conditionally independent, agent n's signal is not implied by any finite public history. Hence for every history, however long, there is a nonzero probability that her signal is of a kind that would have made the other option optimal for her."

  This step is correct. Since signals are independent and not determined by the public history, there is always a chance that the agent gets a signal that, in isolation, would favor the other option. However, note that in the cascade state, even if the agent gets a signal that in isolation would favor the other option, it might not be strong enough to change the optimal action given the public history. Therefore, the agent might still choose the same action as everyone else.

  **Step 6**: "From (3) and (5): at every position in the sequence there is positive probability that the agent acts against the crowd. A cascade in the strict sense ... never occurs with positive probability."

  This step fails because step 3 is incorrect. In a cascade state, the agent does not act against the crowd: regardless of the signal, the agent follows the crowd. Therefore, the probability of acting against the crowd is zero. Moreover, the cascade does occur with positive probability.

  **Why did step 3 seem plausible?** The student might have been thinking that even if the agent is in a cascade, her action is still a function of her signal? But that's not the case in a cascade. Alternatively, the student might have overlooked that in the cascade state, the set of signals that lead to the action is the entire set, so no information is revealed.

  **Step 7**: "Therefore the standard claim ... is false."

  This fails because the previous steps are flawed.

  **Step 8**: "Nothing in the argument used any feature peculiar to these toy models."

  But the flaw is in the understanding of the cascade state, which is a feature of these models.

  **Step 9**: The radical conclusion that a single piece of evidence always has a chance to outweigh the whole consensus.

  This does not hold in the cascade state because the single piece of evidence (the private signal) is not strong enough to outweigh the public history. Moreover, in the cascade state, the agent does not act on the private signal if it contradicts the public history.

  **What survives?** The argument correctly points out that until a cascade starts, every action is informative and the public posterior shifts. But once a cascade starts, actions become uninformative. However, note that even in a cascade, if an agent were to get an extremely strong signal (stronger than any previously seen) then it might break the cascade. But in the standard models with bounded signals, such strong signals are not available. In the standard model, signals are of fixed strength (e.g., each signal has a fixed likelihood ratio), so if the public history becomes very strong, no single signal can overturn it. Therefore, the cascade is permanent.

  In models with unbounded signals (like Smith and Sørensen), cascades do not occur and learning is complete. But in models with bounded signals, cascades do occur. The student's argument fails to account for the boundedness of the signals.

  **Why did the simulation show cascades?** Because in the model with bounded signals, after a few initial agents choose the same action, the public belief becomes so strong that no single private signal (which is bounded) can overturn it. Therefore, all subsequent agents ignore their private signals and follow the crowd. Hence, a cascade forms and persists.

  **What would have to be surrendered to retain (9)?** If the student wants to keep (9), they would have to work in a setting where private signals are unbounded. In such settings, cascades do not occur and learning is complete. But in bounded signal models, (9) does not hold.

  **Does anything survive?** The argument correctly shows that in the pre-cascade phase, every action is informative. But the key point is that cascades do form when the public belief becomes so strong that the bounded private signals cannot overturn it. Therefore, the deflationary conclusion (9) does not hold in general. It only holds in models with unbounded private signals.

  **Revised conclusion (9) in a restricted form**: In settings where private evidence can be arbitrarily strong (unbounded), then indeed a single piece of evidence might always have the potential to outweigh the accumulated consensus. This is the case in the Smith and Sørensen model with unbounded signals. However, when private evidence is bounded, then after enough public evidence has accumulated, a single piece of evidence cannot outweigh it, and a cascade forms.

  Therefore, the size and unanimity of a consensus can be a reason for a rational agent to discount her own contrary evidence if that evidence is bounded and the public evidence is overwhelming. Deference to consensus is sometimes required by rationality in the bounded signal case.

  **Summary of the flaw**: The error is in step 3. The student claims that even in a cascade the choice rules out a nonempty set of signals. But in a cascade, the choice rules out nothing because the agent would have made that choice for any signal. Therefore, the public posterior does not shift. Hence, a cascade can occur and persist.

  **Why it seemed innocuous**: The student might have been thinking that the agent still uses the signal, but in the cascade state, the signal does not affect the action. Alternatively, the student might have been considering the set of signals that would lead to the action without realizing that in the cascade state, that set is the entire signal space.

  **Pricing the alternatives**: 
  - If the student insists on step 3, they must assume that the private signals are unbounded. Then, cascades do not occur and learning is complete. But then the model is no longer the standard bounded signal model. 
  - The student would lose the standard result that wrong cascades occur with positive probability in bounded signal models.

  **Whether anything survives**: 
  - The argument correctly describes the pre-cascade phase. 
  - The deflationary conclusion (9) survives only in the unbounded signal case. In bounded signal settings, it does not.

  **Final note**: The student's interest in the deflationary conclusion about deference might be better served by focusing on models with unbounded signals or by challenging the bounded signal assumption in real-world settings. However, in many real-world situations, evidence might be bounded, so consensus can be compelling.
answer: |-
  ### Analysis of Your Argument

  Your argument is ambitious and insightful, but it contains a critical flaw that explains why your simulation results contradict step (6) and why (9) is unsustainable in its current form. I'll break this down as requested: identify the failing step(s), explain why it seemed plausible, price the alternatives if you insist on retaining it, and assess what (if anything) survives—especially regarding your interest in (9).

  ---

  ### **1. The Flaw: Step 3 is False**
  **Step 3 claims**: "No choice anywhere in the sequence is uninformative. Even a choice inside a cascade rules out a nonempty range of signals, shifting the public posterior."

  **Why this fails**:  
  In the standard cascade models (e.g., BHW), a cascade occurs precisely when the public posterior becomes so extreme that **no private signal can overturn it**. Once this happens:  
  - An agent's choice is **wholly determined by the public history**; their private signal has no influence on their action.  
  - Observing their choice reveals **nothing new** about their signal because the agent would choose the same action regardless of their signal. Thus, the set of signals "ruled out" is **empty**—any signal could have produced the choice.  
  - Consequently, the public posterior **does not shift** during a cascade.  

  **Mechanism of failure**:  
  Your step (2) correctly states that a choice rules out signals only if there exist signals that would have led to a different choice. However, in a cascade state, no signal would lead to a different choice. For example:  
  - Suppose the public posterior after history \(H\) strongly favors state A (e.g., 99% probability).  
  - Private signals are bounded (e.g., each signal has a likelihood ratio of at most 2:1).  
  - Even the strongest possible B-favoring signal cannot make B optimal; the agent chooses A for all signals.  
  - Observing "A" implies nothing about the signal—it could be pro-A, pro-B, or neutral. The public posterior remains unchanged.  

  **Why step (3) seemed plausible**:  
  You likely conflated two distinct scenarios:  
  - **Pre-cascade**: Choices are informative because signals can overturn the public history.  
  - **Cascade**: Choices are uninformative because signals cannot overturn the public history.  
  Your argument in step (2) holds only in pre-cascade states. In cascade states, the "set of signals that make A optimal" is **not strictly smaller**—it is the entire signal space. The flaw arises because you implicitly assumed that agents always act on their signals, overlooking that rationality sometimes requires ignoring them when public evidence is overwhelming. This is why cascades form and persist in your simulations: agents rationally disregard their private signals when they are too weak to outweigh public history.

  ---

  ### **2. Why Steps (6) and (9) Fail as a Result**
  - **Step (6)**: Claims cascades never occur with positive probability because agents might act against the crowd. But in cascade states, the probability of acting against the crowd is **zero**—no signal can make it rational. Bounded signals ensure this.  
  - **Step (9)**: The strong conclusion ("one fresh piece of independent private evidence always has a nonzero chance of outweighing the whole [consensus]") fails because:  
    - With bounded signals, a single signal **cannot** outweigh a strong public consensus.  
    - Rational deference to consensus **is required** when public evidence is sufficiently strong (e.g., a scientist with a weak anomaly should defer to a well-established field; a juror should defer to unanimous peers).  

  **Why Smith and Sørensen's results hold**:  
  Their models distinguish bounded vs. unbounded signals. With bounded signals, wrong cascades occur with positive probability and never break. Your argument misses this because step (3) erroneously assumes all choices are informative, negating cascade formation. Their results are not self-misdescribing—they correctly account for uninformative actions in cascades.

  ---

  ### **3. What If You Insist on Retaining Step (3)?**  
  To salvage step (3), you must **surrender the assumption of bounded signals**. Specifically:  
  - **You must assume unbounded private signals**: Signals must be strong enough to potentially overturn any public history (e.g., likelihood ratios can be arbitrarily large).  
  - **Consequences**:  
    - Cascades **never occur** (as in Smith and Sørensen's unbounded signal models).  
    - Learning is **complete**: The public posterior converges to the truth.  
    - Step (9) **holds**, but only in this restricted setting: A single piece of evidence can always outweigh consensus if signals are unbounded.  

  **What you lose**:  
  - **Real-world applicability**: Most real-world evidence is bounded (e.g., a single experiment or testimony rarely has infinite weight). Your deflationary view of consensus would not apply to juries, scientific fields, or markets with bounded information.  
  - **Key results in social epistemology**: You lose the core insight of cascade models—that rational agents can perpetuate errors under bounded information. Deference to consensus becomes irrational only in unrealistic, unbounded-signal worlds.  

  ---

  ### **4. What Survives?**  
  Your argument is not wholly unsalvageable. Here's what remains intact and how (9) can be reframed:  
  - **Intact elements**:  
    - Steps (1), (2), (4), and (5) hold **outside cascades**. Before a cascade forms, all choices are informative, and the public posterior shifts.  
    - Steps (7)–(8) fail as stated but highlight a truth: Standard cascade models **do not depict agents ignoring signals** pre-cascade. Your pushback is valid here.  
  - **Restricted form of (9)**:  
    - **Pre-consensus**: When public evidence is weak, a rational agent should not defer to a small or emerging consensus. Your own evidence might outweigh it.  
    - **Unbounded signals**: If private signals can be arbitrarily strong (e.g., a "smoking gun" experiment), then even a large consensus should not compel deference. This applies to domains like foundational physics or investigative journalism.  
    - **Bounded signals with dissent**: A consensus is less compelling if there is dissent or if signals are noisy—deference is context-dependent.  

  **Why your interest in (9) can partially survive**:  
  The deflationary view of deference retains merit in **non-asymptotic or non-unanimous settings**. For example:  
  - A scientist with strong private evidence need not defer to a nascent consensus.  
  - A jury member should not defer if peers have conflicting incentives or weak evidence.  
  However, in mature consensus with bounded signals (e.g., climate science), deference is rational. Your argument thus becomes a caution against **premature deference**, not a rejection of consensus writ large.

  ---

  ### **Summary**  
  - **Flaw**: Step (3) fails because choices in cascades are uninformative. This seemed plausible due to an implicit assumption that signals always influence actions.  
  - **Alternatives**: To keep (3), assume unbounded signals—but this surrenders realism and key results.  
  - **Survival**: (9) lives on weakly: Deference to consensus is not *inherently* rational but depends on signal strength and context. Your core insight—that consensus size alone doesn't trump private evidence—holds pre-cascade or with unbounded signals.  

  The tension in your draft reflects a deeper point: Social epistemology often overstates the force of consensus, but cascade models show why this force emerges rationally under bounded information. Your argument, once repaired, can refine—not reject—that view.
