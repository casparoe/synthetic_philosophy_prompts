prompt: |-
  Third year, epistemology-ish but drifting formal, and I've been moonlighting on a thing where a policy shop wants written-down probability estimates for proposed reforms — with the reference class used for each estimate stated explicitly, so an auditor can check the number later. Everyone thought that was the easy part of the job. It isn't. Trying to state the class-picking rule has turned into the whole problem, and I'd rather work from my verdicts than from the theory, because my verdicts are a mess and at least they're mine.

  Here's what I actually say when I ask which class governs a probability:

  - **Restaurant.** A friend is opening a place. I refuse to use "new restaurants" (something like half are gone inside five years, depending which dataset you touch). I want "new restaurants, city this size, owner with 15 years in the industry, own capital at risk, no outside investors." Narrower wins, no contest.
  - **Surgery.** Someone asks me the odds of a procedure going well. Taken literally, "narrowest" bottoms out at *this surgeon, this patient, this Tuesday*, n = 1. So I climb back up to "this procedure at high-volume centers." Verdict: narrower is better until the sample gets thin, then you stop. I don't know where thin is, and I'm pretty sure my threshold slides depending on whether I like the resulting number.
  - **Rare disease.** n = 6, all six alive at two years, versus a broader class of clinically similar conditions with about 30% two-year survival. Here I want to go with the six. That flatly sits badly with the surgery verdict and I can't explain why.
  - **Sentencing.** Recidivism risk. The narrowest class with decent data is partly defined by neighborhood, and neighborhood is a proxy for race. Verdict: the statistics are exactly what my principle tells me to use, and using them is wrong. And I don't want to file that under "separate moral overlay, epistemic answer untouched" — I think the class choice is itself defective, not just its application. I can't make that precise.
  - **Manuscript.** An author asks the odds of a big advance. Narrowest class is "manuscripts by this author": one, and it didn't. So I pick "debut literary fiction submitted to large imprints in the last decade" — chosen not for narrowness but because it's the class least likely to be explained away by facts about her specifically.
  - **Reflexive.** Some classes only have the members they do because the estimate is out there. "Startups that raised a Series B in a sector where median Series B returns are public" — publish the number and the membership conditions shift under you. I want to say the estimate should be relative to the class as it would be if nobody knew the rate, but I can't say why that's not just me preferring a convenient fiction.
  - **One-off.** Probability that a particular constitutional convention gets called. The class of civilizational-scale transitions has one or two members. I still want a number, I want it to be non-arbitrary, and I suspect that's incoherent.

  My tentative principle, Reichenbach's narrowest-class line plus patches: use the narrowest class such that (a) n clears some threshold, (b) the property that puts the case in the class isn't itself downstream of the outcome, or of anyone knowing the outcome rate, and (c) there's at least a story — not a mechanism, just a story — about why being in that class bears on the outcome.

  So: does anything like that deliver all seven? If not, which verdict do I have to give up, and which clause does the sacrificing — because I'd rather lose the rare-disease intuition than the sentencing one, and I don't know whether any principle lets me have that preference. Then tell me what your best account says about a case I didn't list: the probability a patient does well given that she *chose* the aggressive treatment, where choice is correlated with both prognosis and with having read the outcome statistics. And flag, explicitly, which parts of this are settled among people who work on it and which are live fights. My reading so far leaves me with the sense that there's near-consensus that some constraint on class choice is needed and near-total disagreement about what it is, and I don't want you to flatten the second half into a confident recommendation just because the format asks you for one. Say where you're picking a side in an argument that isn't over, and how much of your answer would change if the other side is right.
reasoning: |-
  Okay, let me try to unpack this user's problem. They're dealing with reference class selection for probability estimates, and their real-world examples show contradictions in their own intuitions. 

  First, I notice they're in an epistemology/formalism crossover space - probably a grad student or policy analyst moonlighting. Their frustration is palpable: what seemed like clerical work ("just state your reference class!") exposed a foundational nightmare. They're intellectually honest - admitting their verdicts are messy but insisting on starting from there rather than clean theory. 

  The seven cases are brilliantly chosen to torture-test any principle. The restaurant example wants maximal narrowing; surgery shows narrowing has limits; rare disease contradicts surgery by accepting tiny n; sentencing introduces ethics directly into class choice; manuscript avoids personal history; reflexive deals with self-undermining classes; one-off demands probabilities for unicorn events. 

  Their draft principle (Reichenbach++ with n-threshold, no-downstream-properties, and "story" requirement) is thoughtful but clearly patched. The real test is whether it survives the seven cases. I should check each:

  - Restaurant: passes all clauses easily
  - Surgery: n-threshold saves it, but they admit threshold is subjective
  - Rare disease: tiny n fails (a) - contradicts their verdict. Uh-oh.
  - Sentencing: (b) might catch "neighborhood as proxy for race" if we interpret "downstream" broadly? But they think class itself is defective - maybe (c)'s "story" requirement could help if we demand causal stories?
  - Manuscript: (b) blocks "author's own history" since her past failure might be outcome-linked? But their chosen class passes
  - Reflexive: (b) explicitly blocks classes defined by known statistics - perfect
  - One-off: n=1 fails (a) - but they want a number anyway. Problem.

  The treatment choice example they added is nasty - the selection bias means any class including "chose treatment" may violate (b). I'd need to suggest covariate adjustment or potential outcomes framework.

  On meta-level: they're absolutely right about field consensus. Everyone agrees reference class problem is unsolved, but solutions range from frequentist (coarsening) to Bayesian (priors over classes) to causal (invariant predictors). Their (b) and (c) lean causal - that's where I'd steer them.

  Biggest tension: their rare disease verdict (accept tiny n) contradicts surgery (reject tiny n). If they keep the disease case, they need to relax n-threshold for life-or-death contexts? But that smells of motivated reasoning. Alternatively, admit that for n=6 they're really doing Bayesian updating with flat prior.

  For sentencing, I think they're onto something deeper: some classes are epistemically poisoned by injustice. We might borrow from ethics of algorithms literature - "fairness through awareness" requires avoiding proxies for protected attributes.

  In the end, I'll propose modifying their principle: keep (a) but make n-threshold context-dependent, strengthen (b) to causal irrelevance, and demand (c) be a causal story. Then show how it handles all cases with minimal bloodshed - though rare disease might still need special handling via confidence intervals.

  Most importantly, I'll map where each piece comes from: (a) is standard frequentism, (b) is Pearl-style causality, (c) is Woodward-esque mechanisms. And flag that (b) and (c) are controversial - Bayesians would say just model all features and regularize.
answer: |-
  Your struggle is both profound and familiar—the reference class problem is where epistemology bleeds into practical decision-making, and consensus dissolves. Your draft principle is thoughtful, but it needs refinement to handle your verdicts without sacrificing moral or epistemic integrity. Below, I apply your principle to your cases, flag tensions, propose adjustments, address the treatment-choice example, and demarcate settled vs. contested terrain.  

  **Your Principle, Tested Against the Cases:**  
  *(Using: narrowest class with (a) sufficient n, (b) no outcome/downstream-knowledge dependence, (c) plausible "story" of relevance)*  

  1. **✅ Restaurant**: Clears all. Narrow class (n≈100s in city size/owner experience strata) has solid n, ownership isn’t outcome-dependent, causal story (experience → better management) is strong.  
  2. **✅ Surgery**: (a) and (c) save it. "High-volume centers" has robust n, story (practice → skill) is plausible. Rejecting *this Tuesday* avoids n=1. *But*: Your sliding threshold for "thin data" isn’t resolved—more below.  
  3. **⚠️ Rare Disease**: **Fails (a)** (n=6 is below any reasonable n-threshold). *But you want it*. Contradicts surgery verdict. **Fix**: Allow *exceptionally strong causal stories* to override small n when broader classes are biologically incoherent (e.g., if the 6 patients share a novel biomarker absent in the broader class). Without this, you must abandon the verdict or redefine "sufficient n" contextually.  
  4. **✅ Sentencing**: **Fails (b) implicitly, and (c) weakly**. Neighborhood is downstream of systemic racism (outcome-linked social forces). Story (neighborhood → recidivism) is correlational, not causal. **Your moral intuition is correct**: The class is epistemically poisoned. *This is where your principle shines*—it rejects the class without needing "moral overlay."  
  5. **✅ Manuscript**: **Fails (b)** if "this author" is used (past failure may be outcome-dependent). Your chosen class avoids this: "debut novels" has no authorship dependence, n is decent, story (market trends) is plausible.  
  6. **✅ Reflexive**: **Fails (b)**. Publishing the rate *changes* the class (e.g., startups game the system). Your counterfactual fix ("class as if rate unknown") is defensible but requires justifying why this fictional class is *relevantly similar* to the real one.  
  7. **⚠️ One-off**: **Fails (a)** catastrophically (n=1–2). No class clears n-threshold. *But you want a number*. Only escape: Abandon frequentism. Use structured expert judgment (e.g., via prediction markets) or causal models.  

  **Your Principle’s Gaps:**  
  - **n-threshold is underspecified**: It’s context-dependent (e.g., 6 patients vs. 6 restaurants). You need a *sliding scale*: Lower n when stakes are high *and* mechanistic insight is strong (rare disease), raise n when variability is high (surgery).  
  - **"Story" is too weak**: Upgrade (c) to *causal relevance* (e.g., "owner experience causally affects restaurant success" via known mechanisms). This helps rare disease and blocks sentencing.  
  - **Ethics isn’t separable**: Sentencing shows that some reference classes are *epistemically corrupt* due to social injustice—they violate (b)/(c) by building in oppression.  

  **Revised Principle:**  
  > Use the narrowest class where:  
  > **(a)** Data are *sufficiently precise* for the decision context (n large enough that CI width is tolerable; stakes/mechanism inform tolerance),  
  > **(b)** Membership isn’t *causally downstream* of the outcome or knowledge of its probability,  
  > **(c)** Features defining the class have a *causal link* to the outcome (evidence-backed, not just "story").  
  > If no class satisfies (a)–(c), use expert-adjusted models or accept unquantifiable uncertainty.  

  **Treatment-Choice Case:**  
  *Probability patient does well given she chose aggressive treatment, where choice correlates with prognosis and exposure to outcome stats.*  
  - **Problem**: Violates (b). Choosing treatment is downstream of knowing prognosis/stats → selection bias.  
  - **Solution**:  
    1. *Ideal*: Use a class defined by *eligibility* (e.g., "patients with indications for this treatment"), not choice. Adjust for covariates (age, comorbidities) via causal model.  
    2. *Fallback*: If only observational data exist, use "patients who chose treatment *before* outcome stats were published" to partially satisfy (b).  

  **Field Consensus vs. Live Debates:**  
  | **Aspect**                          | **Settled**                                  | **Live Fights**                                                                 |  
  |-------------------------------------|----------------------------------------------|---------------------------------------------------------------------------------|  
  | **Reference class problem**         | Unavoidable; no unique solution (Reichenbach) | How to *constrain* classes: frequentist (coarsen to fixed n) vs. causal (Pearl, Bareinboim) vs. Bayesian (hierarchical models) |  
  | **Role of causality**               | Necessary to avoid bias (e.g., Simpson’s paradox) | *How formal*: Must causal graphs be specified? Is mechanstic evidence required? |  
  | **Ethics/epistemics divide**        | Most agree sentencing-style proxies *can* be invalid | Is invalidity *always* epistemic (due to bias) or sometimes moral (even if unbiased)? Your view (epistemic corruption) is minority but growing. |  
  | **Small-n probabilities**           | Frequentism fails here                       | Substitute: Imprecise probabilities? Bayesian priors? Model-based extrapolation? |  
  | **Self-undermining classes (reflexive)** | Acknowledged as fatal for frequentism      | Solutions: Game-theoretic models? Causal counterfactuals?                                      |  

  **Where I Side with You (and Why):**  
  - **Sentencing > Rare disease**: Keep sentencing verdict. Sacrificing rare disease (by requiring larger n) is better than legitimizing oppressive classes. Rare disease can be salvaged via causal mechanisms (upgrade (c)); sentencing cannot.  
  - **Reflexive class counterfactual**: Defendable as the only way to recover a *causal* rate (the "natural" probability before interference).  
  - **One-off incoherence**: Admit defeat. Assigning "non-arbitrary" probabilities to truly unique events *is* incoherent under frequentism—use decision rules (e.g., maxmin) instead.  

  **Final Word**: Your instinct to trust verdicts over theory is sound—this problem is too messy for tidy solutions. The revised principle above leans *causal* (Pearl-style) and *contextual* (n-thresholds adapt to stakes/mechanisms), which respects your sentencing intuition while offering rare disease a lifeline. But live debates rage: If causal constraints are rejected (e.g., by pure Bayesians), rare disease and treatment-choice become easier, but sentencing and reflexive cases lose their epistemic safeguards.  

  > "The reference class problem is not a problem to be solved; it is a dilemma to be managed."  
  > — Adapted from Joseph Y. Halpern
