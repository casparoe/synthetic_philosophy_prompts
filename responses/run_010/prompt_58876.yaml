  Let me expand that second point. The friend assumes p(sentience) scales proportionally with size/complexity, but this isn't necessarily true. Below a certain neural threshold, p(sentience) may drop precipitously—perhaps exponentially—rather than linearly. Our uncertainty about insect sentience (say p=0.01) rests on their having centralised ganglia, whereas nematodes' decentralised nets may warrant p<<0.0001 even if they're numerous. The argument treats probability as freely adjustable when it's constrained by biological reality.

