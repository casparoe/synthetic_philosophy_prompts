  The user wants to keep premise (1). That's salvageable if we: (a) reject premise (6) by noting biological discontinuities, or (b) refine premise (1) to incorporate diminishing moral weight per individual. The latter seems stronger—we can keep expected value but add that moral weight per being isn't constant. For example, we might weight by neural complexity as a proxy for welfare capacity.

  My uncertainty lies in whether the probability cliff (point about p(sentience) dropping nonlinearly) or the variable moral weight is more fundamental. Both feel plausible, but the probability argument might be cleaner. I'm about 85% confident overall, but only 70% on whether rejecting (6) alone suffices without modifying (1).

