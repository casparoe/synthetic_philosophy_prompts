answer: |-
  ### RFC: Modal Reference Layer for Strongly Typed Languages  
  **Author**: A. Nalyst  
  **Status**: Draft  
  **Version**: 0.7  

  ---

  #### 1. Motivation  
  Modern software increasingly interacts with physical environments (e.g., IoT, scientific simulations). Traditional type systems verify program-internal consistency but cannot model *reference stability* when external contexts shift. Consider a module identifying `Water` as `H₂O`. If deployed in a scenario where clear, drinkable lake liquid is `XYZ` (not `H₂O`), the term `Water` may dereference incorrectly. Two-dimensional semantics provides a framework for distinguishing:  
  - **Primary Intension**: What `Water` picks out when evaluated in a scenario *taken as actual* (e.g., "clear, drinkable liquid in lakes").  
  - **Secondary Intension**: What `Water` picks out in counterfactual worlds *after reference is fixed* in our actual world (e.g., `H₂O` in all worlds).  

  This RFC proposes integrating modal reference layers to ensure identifiers robustly track intended entities across environmental changes.  

  ---

  #### 2. Proposed Syntax  
  ##### 2.1 Type Annotations  
  - `@primary T`: Marks a term whose reference is fixed by an internal description (primary intension dominates).  
  - `@rigid T`: Marks a term whose reference depends on causal-historical links (secondary intension dominates).  

  ```rust  
  // Descriptive term: reference fixed by properties  
  @primary Chemical Water = { clear: true, drinkable: true };  

  // Rigid term: reference fixed by actual-world baptism  
  @rigid Chemical Water = get_actual_water_from_env(); // e.g., H₂O  
  ```  

  ##### 2.2 Environment Dependencies  
  Modules using `@rigid` terms must declare environment dependencies:  
  ```rust  
  @env_dependent(Water)  
  module Hydrology { ... }  
  ```  

  **Lint Rule**: `ENV_BIND_WARNING` fires if a `@rigid` term is rebound without `@env_dependent`.  

  ---

  #### 3. Type-Checking Rules  
  - **Primary Intension Check**: For `@primary T`, verify all possible scenarios satisfying the description yield `T`.  
  - **Rigidity Check**: For `@rigid T`, verify the term’s secondary intension matches across all counterfactual worlds.  
  ```ocaml  
  rule PRIMARY_INTENSION:  
    Γ ⊢ e: @primary T  
    ∀ scenarios S. [[e]]ₛ ∈ T  // Reference in S must satisfy T’s properties  

  rule RIGID_REFERENCE:  
    Γ ⊢ e: @rigid T  
    actual_world = get_actual_world()  
    ∀ worlds W. [[e]]_{actual_world, W} = [[e]]_{actual_world, actual_world} // Reference invariant  
  ```  

  ---

  #### 4. Integration Testing  
  Tests may execute in user-specified scenarios:  
  ```yaml  
  test_config:  
    scenario: "twin_earth" # Lakes contain XYZ, not H₂O  
  ```  
  **Example Test**:  
  ```python  
  def test_water_safety():  
      sample = get_lake_sample()  # In twin_earth, this is XYZ  
      assert is_safe(Water, sample)  # Passes locally (H₂O), fails in twin_earth (XYZ ∉ Water)  
  ```  
  **Reviewer Comment**:  
  > **Reviewer A**: The failing test is correct. `Water` is rigidly `H₂O`, so `XYZ` is unsafe. The failure confirms the rigid designator is working.  
  > **Author**: Confirmed. This is not a bug; it reflects necessity *a posteriori*.  

  ---

  #### 5. Alternatives Considered  
  ##### 5.1 Descriptive-Only Approach  
  Reject `@rigid` and use only `@primary` terms. *Rejected*: Fails to capture Kripkean necessities (e.g., "Water is H₂O").  

  ##### 5.2 Phenomenal Conformance Suite  
  A suite tests a build where all `@rigid` terms are stripped, leaving only behavioral-equivalent `@primary` terms. The system passes all functional tests but lacks access to rigidly designated entities (e.g., `Water` as `H₂O` is replaced by `Water` as "clear liquid").  
  ```  
  Test Result: All 847/847 behavioral tests pass.  
  ```  
  **Author’s Note**: While this scenario is coherent (per Chalmers' conceivability-possibility link), it does not imply metaphysical conclusions (e.g., physicalism vs. dualism). Such debates are out of scope.  
  **Reviewer Objection**:  
  > **Reviewer B**: If conceivability implies possibility for semantic design (justifying two-dimensional types), you cannot dismiss it for metaphysics when inconvenient. This conformance suite *does* challenge physicalist assumptions.  
  > **Author**: Noted, but compiler RFCs cannot resolve metaphysical disputes.  

  ---

  #### 6. Migration Notes  
  Code assuming reference is fixed by internal state (e.g., "water is whatever matches my description") will break.  

  **Before**:  
  ```python  
  def is_water(sample: Chemical) -> bool:  
      return sample.clear and sample.drinkable  # Descriptive only  
  ```  

  **After**:  
  ```python  
  @rigid Water = H₂O  // Fixed by external baptism  

  def is_water(sample: Chemical) -> bool:  
      return sample == Water  // Rigid designation  
  ```  
  Teams must audit environment dependencies when introducing `@rigid` terms.  

  ---

  #### 7. Open Questions  
  1. Can diagonalization (evaluating primary intensions at the actual world) recover *a priori* truths?  
     **Proposal**:  
     ```haskell  
     diagonalize :: @primary T -> @rigid T  
     ```  
     **Reviewer Objection**:  
     > **Reviewer C**: This makes the type checker’s world-assumptions part of the program’s meaning. Callers cannot know what the checker assumed when accepting `diagonalize(x)`, violating transparency.  
  2. Should CI systems ship with default scenarios (e.g., "earth_actual")?  

  ---

  #### Reviewer Comments Thread  
  > **Reviewer A**: Rigid terms require environment dependencies. What if the environment isn’t serializable (e.g., quantum vacuum state)?  
  > **Author**: We limit to computationally tractable environments. Non-serializable contexts are out of scope.  

  > **Reviewer B**: §5.2 sidesteps the hard problem of consciousness by dismissing phenomenal values. If the "zombie build" passes all tests, why insist on rigid designators?  
  > **Author**: The RFC addresses semantic stability, not ontology. Rigid designators ensure consistency in cross-world reasoning (e.g., counterfactual debugging).  

  > **Reviewer C**: Diagonalization’s opacity (§7) undermines modular reasoning.  
  > **Author**: We are exploring a `@assumes_actual` annotation to clarify preconditions.  

  ---  
  **Approved with Revisions**: 8/12 votes.  
  **Next Steps**: Address Reviewer C’s diagonalization concerns and update lint rules for non-serializable envs.
