prompt: |-
  I've been reading the rationalist blogs since the Overcoming Bias days, and for years my attitude to models was basically the Sequences one: the map isn't the territory, distrust the pretty number. Now I have a job where that suspicion has to become operational, and I'm finding that free-floating scepticism is worth nothing in a meeting.

  Setup: I review cost-effectiveness models for a small grantmaker. Four to six spreadsheets a month, each gating somewhere between £30k and £400k, and my verdict goes to a five-person committee that's mostly non-quantitative. I get about three hours per model. I can open the file, change an assumption, watch the output move — I can't generate any new evidence, and I have no formal economics training. The committee wants one of "use it", "use it with these caveats", "don't use it", plus a paragraph readable in two minutes.

  The reason I'm asking here rather than on an econ forum is that its the philosophy-of-modelling literature that seems to have the distinction I need, and nobody in my office has read any of it. Concretely: Friedman's F-twist — the claim that wildly false assumptions are no objection to a theory and may even mark it as significant, because only predictive accuracy matters. Model builders wave this at me constantly, and the rebuttals I can produce on my own are either too weak ("but the assumptions are obviously false!") or too strong (they'd condemn every useful model ever built). Two half-formed thoughts I want you to sharpen or kill:

  - Nearly every model I review makes a claim about a counterfactual that will never be tested. No holdout, nobody will ever run the experiment that checks the key output. So "judge it by its predictions" seems to lose all content exactly where I need it. Is that right, or is there a way the F-twist still bites?
  - The billiard-player / surviving-firms move depends on some selection process out there making agents behave *as if* the model were true. Charity programmes don't have one. So maybe the usable question isn't "is this assumption realistic?" but "is there anything in this setting that would make the as-if come out true?"

  There's also a failure mode I keep hitting and don't have a name for, so I've started calling it assumption laundering: the model itself contains no dodgy assumption, but a key parameter is imported from another study estimated under a completely different assumption set, so the dodginess arrives through the citation rather than through the model.

  What I want is a procedure my team can actually run in three hours: the questions in order, what counts as a sufficient answer to each, and where it terminates in each of the three verdicts. It has to (1) separate assumptions that are false but irrelevant to the output in the range that matters, from ones that are load-bearing, from ones that are fine inside the model's intended domain but are being applied outside it — because I suspect only the first is what the F-twist can defend, if anything; (2) contain a step for replying to a builder who invokes Friedman, and say when that reply genuinely succeeds, so we don't flag everything unrealistic by reflex; (3) say what to do when you can't run the numbers at all, e.g. the model arrives as a PDF; and (4) mark every point that is really a judgement call in a procedure costume — including where the question turns out to be about values (which outcome metric, what discount rate, how much weight on the tail) and so has to go to the committee rather than to me.

  Then run it on three invented cases. (A) A cash transfer model assuming 100% of the grant is spent on the target good and that an effect measured at 12 months continues linearly in perpetuity; a sensitivity run shows the perpetuity assumption moves the headline figure by a factor of three, the fungibility one by 4%. (B) A job training model where people enrol iff expected earnings gain exceeds cost — i.e. as-if expected utility maximisers — and observed take-up is 92%, which the builder says validates the assumption. (C) A model from an organisation I like and have donated to personally, assuming zero administrative leakage and constant input prices, assumptions I think are flatly false, but where a sensitivity run shows they move the result by 2%. I want at least one verdict I'm going to hate, and I want you to say plainly what the procedure can't do.

  British English, please. No reading list and no citations — I can't look anything up and it'd be decoration. If a distinction you use has a standard label, give me the label plus one sentence on what it means; that's plenty.
reasoning: |-
  Okay, this user is dealing with a high-stakes, time-pressured job reviewing cost-effectiveness models for grantmaking. They're clearly deeply familiar with rationalist concepts but need practical operational tools. The core tension is between philosophical skepticism ("maps aren't territories") and the need to make actionable decisions in bureaucratic settings.

  Hmm, their frustration with Friedman's F-twist is palpable - they've correctly identified that its predictive validation framework collapses when dealing with untestable counterfactuals. The "assumption laundering" observation is razor-sharp too. What they really need isn't more theory, but a defensible triage system.

  Let me structure this around their four concrete requirements:
  First, we need a way to classify assumption types (irrelevant vs load-bearing vs domain-violating). The "sensitivity-to-output" test seems promising, especially paired with domain boundary checks. 

  Second, for Friedman rebuttals, we should distinguish between selection mechanisms (which charities lack) and robustness. The "as-if" argument only works if there's evolutionary pressure - absent that, unrealistic assumptions need explicit justification.

  Third, the PDF problem requires a different approach - perhaps flagging where the model's opacity prevents sensitivity testing as a critical flaw.

  Fourth, we must explicitly mark value judgments (discount rates, outcome metrics) as committee decisions. The procedure should scream "HUMAN JUDGMENT NEEDED" at these points.

  Now for their test cases:
  Case A: Fungibility assumption is harmless (4% sensitivity), but perpetuity is catastrophic (300% swing). Verdict: "Don't use" unless they fix the projection method.

  Case B: The 92% take-up doesn't validate the EU maximization - it's post hoc fitting. Need to ask: would different behavioral assumptions change recruitment predictions? If yes, "caveats".

  Case C: Though assumptions are false, 2% sensitivity makes them irrelevant. "Use" verdict will feel dirty but correct. 

  The hard limit: This system can't magically create data. When sensitivity analysis is impossible or key parameters lack credible sources, we have to say "insufficient basis for decision" - which will frustrate everyone but is honest.
answer: |-
  Here's a pragmatic procedure tailored to your constraints, designed to cut through philosophical debates and deliver actionable verdicts. It centres on **output sensitivity** and **domain validity**, with explicit off-ramps for committee decisions.

  ---

  ### The 3-Hour Review Procedure  
  *(Run in order; stop if any step forces a verdict)*

  1. **Sanity-Check the Output Range**  
     *Question:* Is the headline cost-effectiveness ratio (CER) plausible? (e.g., £1/ life saved < CER < £100,000/life saved).  
     *Sufficient answer:* No → **Don't use** (flag implausibility). Yes → Proceed.  
     *Judgement call:* "Plausible" hinges on your institutional priors (e.g., AMF vs. speculative tech). Flag for committee if borderline.

  2. **Identify Load-Bearing Assumptions**  
     *Question:* Which inputs (≤3) drive >20% of output variance in sensitivity tests? If no sensitivity provided, **stop: caveats or don't use**.  
     *Sufficient answer:* List assumptions tied to high-sensitivity parameters. Ignore others (F-twist applies here: irrelevant falseness is harmless).  
     *Tool:* Tornado chart or one-way sensitivity table. If absent, run +/-20% changes on 3 suspect inputs.

  3. **Interrogate Source Legitimacy**  
     *Question:* For each load-bearing parameter: Is its source *empirical* and *context-matched*?  
     *Sufficient answer:*  
     - ✅ Direct RCT in comparable setting → Accept.  
     - ⚠️ Extrapolated (e.g., different country, time, population) → **Caveat: "Source mismatch"**.  
     - ❌ Assumption without evidence or laundered via citation → **Challenge builder. If no defence, caveat or don't use**.  
     *Assumption laundering trap:* Flag mismatched sources as "untethered".

  4. **Stress-Test "As-If" Mechanisms**  
     *Question:* For behavioural assumptions (e.g., rational agents), is there *any* adaptive pressure making the model "true enough"?  
     *Sufficient answer:*  
     - ✅ Market competition, evolutionary pressure, tight feedback loops → Accept (Friedman survives).  
     - ❌ Charities, policy, one-off interventions → Demand justification. If none → **Caveat: "Unmodelled behavioural risks"**.  
     *Rebuttal to Friedman:* "No selection mechanism exists here. Show why false assumptions don't distort output."

  5. **Boundary Check**  
     *Question:* Is the model applied *within* its intended domain? (e.g., no 100-year projections from 1-year data).  
     *Sufficient answer:* Violation → **Caveat: "Extrapolation risk"** or **Don't use** if extreme (e.g., Case A's perpetuity).

  6. **Values & Uncertainty Handoff**  
     *Mark for committee:*  
     - Outcome metric choices (e.g., DALYs vs. lives).  
     - Discount rates.  
     - Tail risks.  
     *Verdict implication:* If these dominate sensitivity → **"Use with caveats"** (committee must weigh).

  **Verdict Logic:**  
  - **Use it:** All steps clear; sensitivity <20% on key inputs.  
  - **Use with caveats:** >20% sensitivity on non-core inputs, source mismatches, or committee decisions needed.  
  - **Don't use:** Implausible output, no sensitivity analysis, load-bearing untethered assumptions, or domain violations >50% output shift.

  ---

  ### Applied to Your Cases  
  **Case A (Cash Transfers)**  
  - Step 1: CER plausible.  
  - Step 2: Perpetuity = load-bearing (300% swing); fungibility = harmless (4%).  
  - Step 4: No "as-if" mechanism for linear perpetuity.  
  - Step 5: Domain violation (12mo → perpetuity).  
  - **Verdict: Don't use** (load-bearing, untestable, domain-breaking).

  **Case B (Job Training)**  
  - Step 2: Take-up assumption likely load-bearing (drives enrolment).  
  - Step 3: 92% take-up is empirical, but...  
  - Step 4: No "as-if" mechanism: enrollees aren't selected by rationality. 92% validates *outcome*, not *assumption*.  
  - Step 6: Committee must judge if EU-max is critical.  
  - **Verdict: Use with caveats** ("Model assumes rational enrolment; real drivers unknown").

  **Case C (Your Favourite Org)**  
  - Step 2: False assumptions move output by 2% → irrelevant.  
  - **Verdict: Use it** (F-twist applies: falseness is harmless).

  ---

  ### What This Can't Do  
  1. **Prove a model "true"** – Only assesses fragility.  
  2. **Resolve untestable counterfactuals** – If no data exists (Step 3), caveat or reject.  
  3. **Fix PDF models** – If you can't test sensitivity, verdict defaults to **"use with caveats (untested)"** or **"don't use"** if inputs look volatile.  
  4. **Override values** – Your hated verdict in Case C is correct: harmless falseness isn't a flaw.  

  **Output paragraph template:**  
  > "Model [useable/caution advised/rejected] due to [robustness/load-bearing assumption X/domain violation]. Key uncertainty: [e.g., 30-year projection from 1yr data]. Committee must decide on [e.g., discount rate]."  

  This forces focus on *consequences* of false assumptions, not truth-status. When builders cite Friedman, ask: "Show me the selection pressure or prove low sensitivity." No philosophy – just pragmatism.
