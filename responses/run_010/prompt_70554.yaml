prompt: |-
  I run a small internal estimation group at a mid-sized logistics company — eleven analysts. Twice a quarter we produce numbers the exec team actually acts on: how much warehouse capacity to lease, when a competitor opens a lane, what to assume about fuel next year. The process right now is that I post the question in a shared sheet, people answer one at a time in an order I set, and everybody can see the answers already in the sheet before they type theirs. I do it that way on purpose, because our senior analyst's reasoning is genuinely useful to the juniors and I don't want to throw that away.

  The problem: when the sheet fills up with basically the same number eleven times, I can't tell whether I've got eleven people converging on the truth or one person's guess laundered ten times. I know the rough shape of the cascade argument — private signals, everyone watching what earlier people did, and it being perfectly rational from the fifth person onward to discount what you know. But I can't turn that into something I can run. My people are good in a spreadsheet, one has a stats minor, nobody's read the formal models, and my sponsor wants a single number by friday and won't accept "the range is wide" as an answer. I sign off personally.

  So: write me a triage procedure I can run in about twenty minutes on any consensus number before it goes upstairs. Questions to ask in order, what counts as a good enough answer to each one, the point where it stops and tells me not to send this up at all, and the points where it's really a judgment call wearing a procedure costume.

  Three things I want it to deal with explicitly:

  - I've been toying with a metric I call the cascade gap: after the sheet is full, ask everyone for a fresh private answer and use the size of the drift as a measure of how cascaded the number was. Does that measure anything? If yes, build it in. If not, say why and what to do instead.
  - We have a standing rule that the last three to submit have to come from different teams. I assumed that broke the chain.
  - A pilot where I hid the first six answers: the final numbers moved about 4% on average, but the spread tripled. Does a bigger spread mean less cascade, or just more noise? I've been reading a tight sheet as a good sign and I suspect that's backwards.

  Then run it on three cases. (1) A sheet where eleven people landed within a day of each other on a competitor's launch date, and the first two answers both trace back to the same trade-press article. (2) A sheet that's a mess — huge spread, two camps — leadership wants one number tomorrow and there's no time to rerun it. (3) A sheet that looks structurally clean by every rule I have: simultaneous private entry, teams mixed, no one saw anyone else's number — but all eleven started from the same third-party vendor model of regional freight volumes. I'm pretty sure (3) is fine and I'd like the procedure to tell me so; if it can't, tell me what it can't do and why no amount of process design fixes it.
reasoning: |-
  Okay, the user runs a small estimation team at a logistics company. They have eleven analysts who provide estimates for executive decisions. The current process involves a shared spreadsheet where analysts enter answers sequentially, seeing previous entries. This is intentional to leverage the senior analyst's insights for juniors. But the problem is when all answers are similar, it's hard to tell if it's true consensus or just cascading from the first answer.

  The user wants a triage procedure that can be done in 20 minutes. They mentioned three specific issues: the "cascade gap" metric, the rule about the last three being from different teams, and a pilot where hiding early answers increased spread. They also want the procedure applied to three test cases.

  First, I need to understand the core problem: information cascades. When people see others' answers, they might ignore their own info, leading to groupthink. The user's cascade gap idea—asking for private answers after—could reveal how much influence came from seeing others. But is it reliable? Research shows that people anchor to the first answers, so a big drift after private submission might indicate a cascade. However, if the initial consensus was correct, there might be little drift. So it's not perfect but still useful as a red flag.

  The rule about the last three from different teams might not break the cascade because early answers still set the trend. The pilot with hidden answers showed a bigger spread, which likely means less cascade but more noise. A tight sheet isn't necessarily good; it might hide uncertainty.

  For the triage procedure, it needs to be quick. So steps should be efficient. Start with the cascade gap: ask for private estimates. A drift over 10% is a red flag. Then check for anchor points—like if early answers are clustered and cited the same source. The third step is assessing team diversity and whether different perspectives were considered. Finally, source scrutiny to ensure multiple data points.

  Applying this to the test cases: Case 1 has a tight consensus but same source. Cascade gap here would be small, but the anchor point check fails because of the shared article. So it's a judgment call but probably shouldn't be sent up. Case 2 has a messy spread. Cascade gap isn't needed because there's no cascade. The issue is disagreement. The procedure might flag it as high variance, needing leadership to decide. Case 3 has private entry and mixed teams but same third-party source. Cascade gap would be small, but the source scrutiny fails. The procedure would note that the source is the bottleneck, and no process can fix that.

  The user's deeper needs: They need a reliable way to validate consensus without time-consuming methods. They want to catch hidden cascades and ensure diverse input. They might also need to educate leadership on why a range is sometimes necessary but can't due to exec preferences. The procedure should balance speed with thoroughness, using quantitative checks and qualitative insights. Also, addressing the limitations of the process, like vendor dependencies, is crucial so the user knows when it's out of their hands.
answer: |-
  Here's a triage procedure designed for speed, practicality, and addressing your specific concerns. It runs in **<20 minutes**, uses existing data/skills, and provides clear Go/No-Go flags. **Focus:** Detecting hidden consensus (cascades) and problematic anchoring.

  **Triage Procedure: The Cascade Check (15-20 min)**

  1.  **Calculate the Cascade Gap (5 min)**
      *   **Action:** Immediately after the "public" sheet is finalized, create a *new* private sheet. Instruct all 11 analysts: *"Based on your current knowledge and reasoning, give your best estimate for [Question] again. Do NOT look at the previous sheet or discuss with others. Submit within 5 minutes."*
      *   **Calculation:** Calculate the absolute difference between each analyst's *original public answer* and their *new private answer* (|Public_i - Private_i|). Average these 11 differences. This is the **Cascade Gap (CG)**.
      *   **Threshold:**
          *   **CG < 5% of Avg Public Answer:** GREEN FLAG (Weak evidence of cascade). Proceed to Step 2.
          *   **CG 5% - 15% of Avg Public Answer:** YELLOW FLAG (Moderate evidence of cascade). Proceed to Step 2 with high caution.
          *   **CG > 15% of Avg Public Answer:** **RED FLAG (STRONG evidence of cascade).** **STOP. Do NOT send up.** Explain to sponsor: "Process detected significant anchoring on early answers. Consensus unreliable. Need rapid re-estimate with modified process (e.g., simultaneous private entry)."
      *   **Why it works:** Measures the *suppressed disagreement* caused by seeing others' answers. A large CG means many analysts discounted their private info to conform. A small CG *suggests* genuine agreement *or* a cascade so strong no one dares deviate even privately (hence Step 2). **It measures the *pressure to conform*.**

  2.  **Identify the Anchor Point(s) (5 min)**
      *   **Action:** Quickly review the *first 3 answers* in the original public sheet and the reasoning documented (if any). Look for:
          *   Clustering: Are they very close?
          *   Source: Do they cite the *same* source/data point (e.g., same article, same vendor model)?
          *   Authority: Is a senior analyst/known expert in the first 3?
      *   **Threshold:**
          *   **First 3 answers > 10% spread AND cite different sources:** GREEN FLAG (Weak early anchor). Proceed to Step 3.
          *   **First 3 answers < 5% spread OR cite same source OR include key senior:** YELLOW FLAG (Strong early anchor). Proceed to Step 3 with high caution.
          *   **First 3 answers identical AND cite same source (esp. if weak):** **RED FLAG (Dangerous Anchor).** **Strongly consider STOPPING.** If proceeding (judgment call!), document the anchor source heavily.
      *   **Why it matters:** Cascades start here. A strong, narrow anchor from the beginning makes downstream convergence meaningless.

  3.  **Assess Team Diversity & Spread Evolution (3 min)**
      *   **Action:** Visually scan the *order* of answers and the *spread* over time.
          *   Check if the "last 3 different teams" rule was followed.
          *   Plot the answers sequentially (just sketch a line graph mentally or quickly on paper): Did answers rapidly converge after the first few? Or was there sustained spread?
          *   Note any obvious "camps" or outliers.
      *   **Threshold:**
          *   **Last 3 from different teams AND visible spread persists beyond position 5 AND no dominant camp:** GREEN FLAG (Diversity likely helped). Proceed to Step 4.
          *   **Last 3 rule followed BUT convergence happens by position 4-5:** YELLOW FLAG (Diversity rule may not have broken cascade). Proceed.
          *   **Last 3 rule NOT followed OR convergence by position 3 OR two distinct camps:** **YELLOW/RED FLAG (Diversity failed or high conflict).** **Judgment Call:** Can you rationalize the camps? Is the average still sensible? Document concerns heavily.
      *   **Why & the Pilot Insight:** Your pilot (hiding first answers → bigger spread) shows **a bigger spread *often* means less cascade (good!), but also more genuine uncertainty (needs explanation).** Your old "tight sheet = good" *was* backwards for detecting cascades. The diversity rule *delays* but doesn't *prevent* cascades if the early anchor is strong. Diversity helps most if spread persists.

  4.  **Source Scrutiny (2 min)**
      *   **Action:** Ask: "What is the *primary independent source* for most estimates?" (Look at reasoning notes, ask yourself). Is it:
          *   Multiple independent sources/data points? (GREEN)
          *   One strong, credible internal analysis/model? (GREEN/YELLOW)
          *   One external vendor/report/article? (YELLOW/RED)
          *   "Based on earlier answers" / No clear source? (RED)
      *   **Threshold:**
          *   **Multiple independent sources cited:** GREEN FLAG. **GO. Send it up.**
          *   **Single strong internal source:** YELLOW FLAG. **Judgment Call:** Is this source historically reliable? Document the source. Probably GO unless other flags are red.
          *   **Single external source (vendor, article, etc.):** **RED FLAG.** **Judgment Call Wearing Procedure Costume:** This is a *source bottleneck*, not necessarily a *process* cascade. **The procedure CAN'T fix this.** Document: "Consensus hinges critically on [Source X]. Accuracy is dependent on this source's validity." If the source is generally trusted (e.g., a core industry model), GO but DOCUMENT HEAVILY. If dubious, push back.
          *   **No clear source / circular reasoning:** **RED FLAG. STOP. Do NOT send up.** "Unable to verify foundational data sources."

  **Summary Flow:** CG Calc → Anchor Check → Diversity/Spread Check → Source Scrutiny → GO / NO-GO / GO with Caveats.

  **Applying the Procedure to Your Cases:**

  1.  **Competitor Launch Date (Tight consensus, same article source)**
      *   **CG:** Likely very small (<5%) - everyone read the article, cascade gap won't show drift. YELLOW if done, but probably GREEN threshold.
      *   **Anchor:** **RED FLAG.** First 2 cite same trade article. Strong, narrow anchor likely.
      *   **Diversity/Spread:** Convergence immediate. Last 3 rule irrelevant. **RED FLAG.**
      *   **Source:** **RED FLAG.** Single external article.
      *   **VERDICT: STOP / STRONG NO-GO.** This is classic cascade + single point of failure. Tell sponsor: "Consensus relies entirely on one unverified trade press article. High risk of being wrong. Need rapid sourcing of corroborating evidence or alternative estimates."

  2.  **The Messy Sheet (Huge spread, two camps)**
      *   **CG:** Not strictly necessary (obvious disagreement), but if run, likely HIGH (>15%) if there was social pressure to conform *within* camps. **YELLOW/RED FLAG.**
      *   **Anchor:** May be weak or multiple. Check first 3. Likely **GREEN/YELLOW** (unless first 3 clustered).
      *   **Diversity/Spread:** High spread, camps evident. **YELLOW/RED FLAG.**
      *   **Source:** Likely multiple sources causing camps. **GREEN FLAG.**
      *   **VERDICT: JUDGMENT CALL.** The issue isn't cascade, it's *genuine uncertainty/disagreement*. **The procedure flags it as high-risk/low-confidence.** You MUST:
          *   Quickly identify root of disagreement (different assumptions? different data?).
          *   Document the two camps/assumptions and the range.
          *   **Forced Choice:** Present the average *with massive caveats* ("Execs: This average bridges two distinct views based on X vs Y. Range is A to B. This is low confidence due to fundamental disagreement on [Issue]. Strongly recommend short-term decision avoids relying on this specific number."). *Or* pick one camp with justification ("Based on Z, Camp A's assumption is more likely, so we recommend their midpoint"). **Don't pretend high confidence exists.**

  3.  **Structurally Clean but Same Vendor Model**
      *   **CG:** Likely very small (<5%). **GREEN FLAG.** (Confirms no *process-induced* cascade).
      *   **Anchor:** N/A (Simultaneous entry). **GREEN FLAG.**
      *   **Diversity/Spread:** Teams mixed, spread likely moderate (if vendor model has nuance) or tight (if model is deterministic). **GREEN FLAG.**
      *   **Source:** **RED FLAG.** Single external vendor model.
      *   **VERDICT: JUDGMENT CALL / GO with HUGE CAVEAT.** **The procedure correctly identifies the critical weakness: the vendor model is a single point of failure.** It cannot confirm the model's accuracy. Document: "Consensus is technically sound *given shared reliance on Vendor X Model vY*. Accuracy is contingent on this model's validity for this specific scenario. Recommend noting this dependency to leadership and monitoring for model drift/corollary evidence." If the vendor model is the gold standard, GO. If it's new or untested, flag the risk. **This exposes the procedure's limit: it can't validate external inputs, only process integrity and source diversity.**

  **Key Takeaways for You:**

  *   **Cascade Gap:** **Yes, it measures the suppression of private signals.** It's your best *quantitative* red flag for hidden cascades. Build it in.
  *   **"Last 3 Different Teams" Rule:** **It helps, but doesn't break strong early anchors.** It mainly combats *late-stage* conformity pressure and ensures some perspective late in the chain. Your pilot proved its value in surfacing uncertainty (wider spread = less cascade).
  *   **Tight Sheet = Danger:** **Correct suspicion.** A tight sheet *after sequential viewing* is a cascade red flag, not a confidence indicator. Your pilot showed the truth: more spread (from less influence) often means more honest uncertainty.
  *   **The Unfixable Hole (Case 3):** No process can create independent information. If everyone uses the same flawed source *independently*, the process will look clean but the answer can be dead wrong. **The procedure can only detect this dependency and force you to document it.** Mitigation requires sourcing diversity *before* estimation begins.
  *   **Leadership Realpolitik:** When forced to give one number despite flags, **document the caveats relentlessly** in the email/cover sheet. Make the uncertainty visible even if you can't give a range. Use phrases like "best estimate contingent on X", "high sensitivity to Y", "consensus hinges on Z model".

  This procedure gives you actionable signals in 20 minutes, leveraging your team's existing workflow while specifically targeting the cascade risk you identified. It turns your intuition about cascade gaps and spread into a structured check.
