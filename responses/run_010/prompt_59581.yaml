     - Week 7: Build the equivalence relation for structures. We want that if two structured hypotheses are built from the same predicates in a way that is merely a trivial rephrasing (like changing the order of conjuncts), then they are the same structure. But if they use different predicates (even if logically linked, as in the raven case) then they are different. We might use a notion of predicate permutation or something else.
     - Week 8: Explore the implications for other paradoxes (e.g., the grue paradox) to show that the framework has broader application. This will help with the worry of ad hocness.
