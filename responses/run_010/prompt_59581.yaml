     However, note that there is a resolution that might escape: the one that rejects the equivalence condition on the grounds that the way the hypothesis is stated matters (e.g., because of projectibility of predicates). But even then, the typical projectibility approach (inspired by Goodman) doesn't necessarily invoke a structured hypothesis but rather the syntactic form. We can argue that our approach is different because we are proposing a structured hypothesis that is finer-grained than logical equivalence but coarser than syntactic form (so that two logically equivalent formulations that are equally projectible are still the same? Not exactly: we want to break even when predicates are projectible). Alternatively, if there is a resolution that already uses structured hypotheses, we must acknowledge it. I think the projectibility-based resolutions do not use structured hypotheses in the sense we mean (they are about the predicates being projectible, not about the structure of the hypothesis). So, we can say that no resolution escapes? Or that the ones that reject equivalence condition on syntactic grounds are close, but they don't develop a structured account of hypotheses that can also handle the other constraints.

     We'll say: The standard resolutions (including those that appeal to background information, probability, and even those that reject the equivalence condition on projectibility grounds) share the assumption that the hypothesis is the same under the two formulations because they are logically equivalent. Even when they reject the equivalence condition, they do so for reasons that are not based on a structured hypothesis but on pragmatic or projectibility considerations. Therefore, our approach is novel in introducing a structured hypothesis as the basis for breaking the equivalence.

