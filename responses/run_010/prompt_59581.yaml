  # Workshop Proposal: Structured Hypotheses and the Ravens Paradox

  ## 1. Research Question
  Can a structured account of hypotheses, which distinguishes logically equivalent statements formed with different predicates, resolve the ravens paradox while simultaneously satisfying two core principles of confirmation: (i) evidence for a conjunction is evidence for each of its conjuncts, and (ii) different formulations of the same scientific law that are trivially rephrased (using the same predicates) confirm alike?

  ## 2. The Shared Assumption in Standard Resolutions
  The standard resolutions of the ravens paradox — including those that appeal to background information, relative class sizes, negligible confirmation, and even those that reject the equivalence condition on grounds of projectibility or pragmatics — share the assumption that the hypothesis "All ravens are black" and its contrapositive "All non-black things are non-ravens" express the same proposition. This is because they take the two to be logically equivalent and thus identical in content. Even resolutions that reject the equivalence condition (for example, by appealing to the projectibility of predicates) do not ground this rejection in a structured account of hypotheses that can also account for the core principles (i) and (ii). Instead, they typically rely on the syntactic form of the hypothesis or on pragmatic factors. Therefore, no existing resolution escapes this assumption in the way the structured hypothesis approach aims to do.

  ## 3. Method and Timeline
  We propose to work within a probabilistic framework because it provides a well-developed, quantitative model of confirmation that can naturally accommodate structured hypotheses and allows for precise definitions of incremental confirmation (e.g., via positive relevance).

  ### Week-by-Week Plan:
  - **Week 1**: Literature review focusing on the ravens paradox and structured representations in confirmation theory.
  - **Week 2**: Formal definition of a structured hypothesis. We will represent a structured hypothesis as a tuple of predicates and logical operators, such that two logically equivalent statements can have different structures if they use different predicates.
  - **Week 3**: Definition of confirmation for structured hypotheses. We will adapt the standard probabilistic notion of incremental confirmation (P(H|E) > P(H)) by relativizing the hypothesis to a structure. This will require defining a probability measure over a space that respects the structure.
  - **Week 4**: Application to the ravens paradox. We will show that the observation of a white sneaker (a non-black non-raven) confirms the contrapositive structure (non-black → non-raven) but not the raven structure (raven → black).
  - **Week 5**: Test against the conjunction principle: evidence for a structured conjunction must be evidence for each structured conjunct. We will define structured conjunction and ensure the principle holds.
  - **Week 6**: Test against the rephrasing principle: trivially rephrased versions of the same law (e.g., "All ravens are black" and "Anything that is not black is not a raven" are not trivially rephrased in our sense because they use different predicates, but two formulations that are commutative in their predicates should be equivalent) must confirm alike. We will develop a notion of structural equivalence for trivial rephrasings.
  - **Week 7**: Formalize structural equivalence for trivial rephrasings (e.g., commutativity of conjunction, associativity) and prove that confirmation is invariant under such equivalences.
  - **Week 8**: Explore the broader applicability of the framework (e.g., to Goodman's grue paradox) to demonstrate generality.
  - **Week 9**: Draft the paper, focusing on the resolution of the ravens paradox and the satisfaction of the two core principles.
  - **Week 10**: Refine the framework in response to potential counterexamples and objections.
  - **Week 11**: Finalize the paper and prepare the presentation.

  ## 4. Deliverable and Failure Conditions
  **Deliverable**: A formal framework for structured hypotheses and a proof that within this framework: 
     (a) A non-black non-raven confirms the contrapositive-structured hypothesis but not the raven-structured hypothesis.
     (b) Evidence confirming a structured conjunction confirms each structured conjunct.
     (c) Confirmation is invariant under trivial structural rephrasings (defined by a specified equivalence relation on structures).

  **Failure Conditions**:
     - **Collapse**: The structured hypothesis framework collapses to logical equivalence, making it impossible to achieve (a).
     - **Ad hocness**: The framework resolves the ravens paradox but fails on the core principles (b) or (c) or cannot be extended to other cases.
     - **Inconsistency**: The principles (a), (b), and (c) are shown to be inconsistent in the framework.

  ## 5. Scope and Cuts for Length
  To fit within twelve pages, we will focus exclusively on the ravens paradox and the two core principles (conjunction and rephrasing), cutting the extended discussion of other paradoxes (e.g., grue) to a brief mention. The claim that must be defended during questions is: *The distinction between the raven-structured and contrapositive-structured hypotheses is essential for a correct account of confirmation and does not undermine the unity of scientific laws when trivially rephrased with the same predicates.*

