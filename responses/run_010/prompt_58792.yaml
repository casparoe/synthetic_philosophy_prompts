prompt: |-
  ok so I've been down a rabbit hole on societal collapse, and the thing that's bugging me isn't any one case — it's that I don't seem to apply the word consistently, and I want to know what I'm actually committed to. Here are my gut calls, and I've tried to say why each one feels the way it does:

  - Norse Greenland: collapse, obviously. Last record is a wedding at Hvalsey in 1408 and then nothing, and a century later nobody's living there. No continuity of anything, not even the lifeway.
  - Classic Maya: collapse — even though I know perfectly well that Maya people and Maya languages are alive today. The dated monuments just stop (last Long Count date I've seen cited is 909 CE, at Toniná), the kings-carved-in-stone business is finished, the southern lowland cities empty out.
  - Easter Island: not collapse, just an ugly change. The palm forest goes, moai carving stops, but the islanders stay and keep fishing and gardening, and the newer work — including the ancient DNA stuff — seems to say the population was more or less stable until Europeans arrived, and *then* it was a catastrophe. Pre-contact looks like adaptation to me.
  - Late Bronze Age eastern Mediterranean: collapse. Palaces burned, Linear B never comes back, the Hittite state is gone. But the Greeks are obviously still there and much of the Levant carries on, so maybe only a palatial system collapsed and no society did. I'm uneasy here.
  - Angkor: not collapse. The capital drains away in the 1400s, but the court relocates south, and the religion that takes over is the one still practiced there. That's a transformation with a very high body count for the old elite.
  - Cahokia: not collapse. It reads like people voting with their feet and dispersing into the countryside. Except I notice I'm not willing to say the same thing about some of the others, and I can't articulate why.
  - Roman Britain after 400: collapse. Villa economy gone, towns hollowed out, coinage stops, the Latin-speaking elite becomes archaeologically invisible within a couple of generations. And yet there's no mass die-off and the farms keep farming.

  My problem pair is Maya vs. Easter Island. On paper they're nearly the same event: a monument-building theocratic system stops building monuments, the environment is degraded, most of the population and thier language survive. One I call collapse and one I don't. Roman Britain vs. Cahokia is the same shape of problem.

  My tentative principle is something like: collapse is a society dropping a level of sociopolitical complexity it was previously maintaining — states, specialists, redistribution, monumentality — regardless of whether the people die or their descendants flourish. But that seems to make Easter Island a collapse too (no more moai, no more chiefly competitive display), which I don't want, and it also makes a peaceful voluntary downsizing a "collapse," which sounds wrong.

  So: is there a principle, or a couple of competing ones, that generates my verdicts or gets most of them at an honest cost? I want it stated precisely enough that it could come out wrong on a case — some threshold on complexity levels, or a distinction between elite institutions and subsistence systems, or losing a state versus losing a lifeway, or reversibility. Tell me which clause does the work for which case, then tell me straight up which of my calls it cannot save and which one I should drop. Then run it on three cases I haven't given verdicts on: the Indus cities being abandoned while the population drifts east toward the Ganges plain; Chaco Canyon's great houses being walked away from; and the Soviet Union. Two more things I want folded in: does it matter whether the word is being used by the people who lived through it or by us afterwards, and does my list show that I'm smuggling in a moral — they wrecked their environment and paid for it — even in the cases where I insist I'm only describing institutional change?
reasoning: |-
  Okay, let me unpack this user's query. They're clearly deep into societal collapse studies but struggling with inconsistent application of the term. Their examples show nuanced understanding—they recognize continuity in Easter Island and Cahokia versus discontinuity in Norse Greenland and Roman Britain. The core tension is between structural change (complexity loss) and human outcomes (survival/continuity).

  Hmm, their Maya vs. Easter Island dilemma is fascinating. Both cases involve halted monument-building and environmental stress, yet they label only Maya as collapse. Why? Probably because Maya's political/symbolic rupture feels more absolute—kings vanished, inscriptions stopped—while Rapa Nui adapted existing social structures. Their Roman Britain vs. Cahokia contrast reveals similar logic: Roman collapse erased Latin elite culture, while Cahokia's dispersal maintained Mississippian traditions elsewhere.

  The user's proposed "complexity loss" principle almost works but clashes with their intuition about voluntary downsizing not feeling like collapse. I notice they're subtly weighing two factors: how *binding* the complexity was (was it imposed? could it be shed without catastrophe?) and whether the change *destroyed core continuity* (language, rituals, identity). That explains why Angkor isn't collapse for them—the heart of Khmer society relocated intact.

  Wait, they're also hinting at unexamined moralizing. Their Greenland/Roman Britain calls emphasize "paying for" environmental or imperial overreach, while Easter Island gets framed as adaptation. Need to disentangle that. 

  For their unanswered cases: Indus abandonment fits their "drift not collapse" pattern (Harappan symbols fade but Ganges cultures emerge). Chaco is trickier—great houses abandoned but Pueblo traditions persist. Probably not collapse by their standards. USSR? Definitely collapse: state dismantled, ideology abandoned, though people survived. 

  Biggest insight: Their gut prioritizes *cultural fracture* over mere political failure. If the people lose their organizing narrative (Norse Greenlanders forgetting Christianity, Britons losing Romanness), it's collapse. If they reinvent within continuity (Rapa Nui birdman cult, Khmer Theravada shift), it's transformation. That's the unstated threshold.
answer: |-
  Your instinct to dissect this inconsistency is spot-on. Your cases reveal a coherent (but complex) internal logic that prioritizes **irreversible rupture in core organizing institutions and cultural identity**, *not* just complexity loss or population decline. Let's crack your code and refine a principle.

  **Your Core Principle (Refined & Expanded):**

  > **Societal collapse occurs when:**  
  > **1.  Core Organizing Institutions Fail:** The primary political, economic, and ideological systems that defined the society's structure and elite power cease to function *irreversibly within that context*.  
  > **2.  Cultural Identity Fractures:** The society loses its defining narrative, symbols, elite culture, or collective purpose *as understood by its people at the time*.  
  > **3.  The Change is Non-Volitional & Traumatic:** The transformation is perceived as catastrophic, forced, or systemic failure by those experiencing it or immediately after, not a planned, managed downsizing or adaptation.  
  > **4.  Continuity is Broken *in situ*:** While population and subsistence may continue, the *specific societal project* in that *specific place* ends without direct, recognizable succession.  

  **Why "Complexity Loss" Alone Fails for You:**  
  It's too blunt. You intuitively distinguish between *shedding* complexity adaptively (Easter Island, Cahokia) and complexity being *violently stripped away* or imploding (Maya, Roman Britain). Your principle adds the crucial layers of *cultural identity rupture* and *traumatic non-volition*.

  **Applying Your Principle to Your Cases (With the Salvage Operation):**

  1.  **Norse Greenland:** **Collapse.** (1) Church, chieftaincy, European-style farming fail utterly. (2) Christian Norse identity vanishes. (3) Change was catastrophic failure to adapt. (4) No continuity; society gone.
  2.  **Classic Maya:** **Collapse.** (1) Divine kingship, monumentality, palace economies cease *in the Southern Lowlands*. (2) The elite ideology and political structure defining the "Classic" era shattered. (3) Traumatic abandonment of cities. (4) The "Classic Maya project" in the lowlands ended; later Maya societies were different configurations.
  3.  **Easter Island:** **NOT Collapse.** (1) *Political/religious system transformed* (birdman cult replaces moai cult), but core societal structure (clans, specialists) adapted. (2) Rapa Nui identity persisted strongly. (3) Adaptation to environmental change, not systemic implosion *before Europeans*. (4) Continuity of society *in situ*.
  4.  **Late Bronze Age:** **Partial Collapse (Palatial System).** (1) Palatial centers, international trade, specific scripts (Linear B) fail irreversibly. (2) *Specific palatial elite culture* (Mycenaean wanax, Hittite imperial cult) shattered. (3) Traumatic (fires, migrations). (4) *Palatial states* didn't continue; but underlying societies (Greeks, Canaanites) reformed new identities/states later. (Fits your unease: *parts* collapsed, society reformed).
  5.  **Angkor:** **NOT Collapse.** (1) *Capital relocated*, political/economic focus shifted, but Khmer state & kingship continued. (2) Core Khmer identity persisted; religious shift (Mahayana -> Theravada) was significant but didn't erase identity. (3) Managed retreat/transformation, albeit costly. (4) Direct continuity of the Khmer societal project, just in a new phase/location.
  6.  **Cahokia:** **NOT Collapse.** (1) Centralized authority wanes, monumentality stops, but (2) Mississippian culture & identity continued elsewhere (e.g., Etowah, Moundville). (3) Likely managed dispersal/voting with feet. (4) The Cahokia *site* was abandoned, but the broader society/culture persisted and transformed.
  7.  **Roman Britain:** **Collapse.** (1) State apparatus (tax, coin, army, villa elite), urban life, Latin elite culture vanish. (2) "Roman" identity (as lived by the elite/urban dwellers) shattered within a generation. (3) Traumatic withdrawal/implosion. (4) The "Roman Britain" project ended; successor societies (Anglo-Saxon, Welsh) were fundamentally different in core organization/identity.

  **Salvaging Your Problem Pairs:**

  *   **Maya vs. Easter Island:** The key difference is **core identity rupture vs. transformation**. Classic Maya elite ideology *shattered*; their defining purpose (kings as gods maintaining cosmos via monuments/blood) *ended*. Easter Islanders *changed* their elite display system (moai -> birdman) but maintained core clan structure and Rapa Nui identity.
  *   **Roman Britain vs. Cahokia:** Difference is **irreversible identity loss vs. continuity elsewhere**. "Roman" identity in Britain *vanished*; the societal project *ended*. Cahokian dispersal saw *continuation* of Mississippian identity and practices in other centers. It's the difference between deletion and migration.

  **The Cost: Which Call Must Be Dropped?**

  *   **To be consistent, you must drop "Late Bronze Age Eastern Mediterranean" as a monolithic "collapse".** Your principle shows it was the **collapse of the palatial system and its specific elite cultures**, not all societies. Greece and the Levant reformed differently. Call it a "palatial collapse" or "system collapse," not blanket societal collapse.

  **Testing on New Cases:**

  1.  **Indus Valley Civilization:** **NOT Collapse (Drift/Transformation).** (1) Urban planning, writing, specific trade networks fade. (2) Core *symbols* (script, unicorn motif) vanish, suggesting identity shift. *But* (3) Gradual transition, no evidence of catastrophic failure. (4) Continuity of population and subsistence eastward; successor cultures (e.g., Cemetery H, Ochre Coloured Pottery) show transformation, not utter rupture. The *Harappan urban project* ended, but society transformed.
  2.  **Chaco Canyon:** **NOT Collapse (Dispersal/Reorganization).** (1) Great house system ceases at Chaco. (2) Specific Chacoan ritual/political focus ends *there*. *But* (3) Managed departure, likely environmental/political factors. (4) Strong continuity of Puebloan culture, identity, and societal complexity in other centers (Aztec, Mesa Verde, then modern Pueblos). The *Chacoan center* collapsed, not Puebloan society.
  3.  **Soviet Union:** **COLLAPSE.** (1) Core political (CPSU), economic (command economy), ideological (Marxism-Leninism) institutions dissolved irreversibly. (2) "Soviet" identity as the unifying state ideology shattered. (3) Perceived as traumatic systemic failure by many citizens. (4) The "Soviet project" ended; successor states defined new (or revived old) identities. Fits your criteria perfectly.

  **Addressing Your Final Points:**

  1.  **Contemporary vs. Retrospective Use:** It **matters critically** for point 3 (Non-Volitional & Traumatic). *We* define collapse retrospectively based on outcomes. But whether *they* experienced it as catastrophic (Roman Britain - likely yes; Cahokia - likely no; Easter Island - adaptation, not collapse *to them* pre-contact) informs our judgment of its nature. Our definition is retrospective, but we must consider contemporary experience to judge "trauma."
  2.  **Smuggling in Morality (Environment):** **Yes, subtly.** Your Greenland, Maya, and *especially* Easter Island/Roman Britain reasoning shows it. You absolve Easter Island partly *because* recent science shows adaptation, not pre-contact catastrophe. You see Roman Britain's environmental management (villas) failing *with* the state. Your principle focuses on institutional/cultural rupture, but the *trigger* (often environmental stress + institutional rigidity) likely influences your sense of "deserved" collapse. Acknowledge this bias. Focus strictly on the *outcome* (rupture vs. continuity) per your refined principle to minimize it.

  **Conclusion:** Your intuition is sound. You define collapse not by complexity loss alone, but by the **irreversible, traumatic shattering of a society's core institutional framework and its defining cultural identity in a specific place and time**. This explains your verdicts, saves most calls (drop LBA as monolithic collapse), and handles the new cases consistently. It acknowledges that societies can transform, adapt, move, or downsize without collapsing – collapse is when the *specific societal essence* breaks beyond repair.
