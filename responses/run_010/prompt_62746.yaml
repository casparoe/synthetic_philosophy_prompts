answer: |-
  Here is a specification of desiderata for a theory of historical progress capable of withstanding skeptical historical scrutiny, addressing your points and adding critical omissions. Non-negotiable requirements are marked **(NN)**; others reflect significant tensions in the field.

  ### Desiderata for a Theory of Historical Progress
  1.  **Non-Retrospectivity / Falsifiability by Reversal (NN):**
      *   **Requirement:** The theory must specify *in advance* what would constitute a reversal or regression, not merely recognize "progress" after the fact by comparing present norms to past practices.
      *   **Motivation:** Avoids Whiggish cherry-picking and confirmation bias. Without this, any outcome can be declared "progress" by selecting convenient endpoints. A robust theory must be vulnerable to empirical disconfirmation by future events or identifiable past regressions.
      *   **Status:** **Non-Negotiable** for serious historical engagement.

  2.  **Non-Endogeneity of Standards / Avoidance of Temporal Parochialism (NN):**
      *   **Requirement:** The standards by which progress is judged must not be *merely* the contingent products of the specific historical process being evaluated. The theory must justify its normative standards independently of the historical trajectory it seeks to assess.
      *   **Motivation:** Addresses the core skeptical challenge: if our "progressive" values are simply the outcome of the very history we're judging, the judgment is circular and self-justifying (e.g., "modern liberalism is progress because it won"). Avoids imposing presentist values anachronistically.
      *   **Status:** **Non-Negotiable** for avoiding circularity.

  3.  **Accountability for Costs and Victims:**
      *   **Requirement:** The theory must explicitly account for the costs borne by individuals or groups *during* a process that yields aggregate or long-term "progress." It must explain the relationship between aggregate improvement and distributive injustice/victimization, and not merely dismiss suffering as a necessary cost.
      *   **Motivation:** Moral progress cannot be built solely on the backs of the oppressed without a normative reckoning (e.g., industrial progress built on exploitation; democratic expansion excluding groups). Avoids utilitarian indifference to individual suffering in the name of a greater good.
      *   **Status:** **Highly Contentious.** Utilitarians might see costs as necessary; deontologists/justice-focused theorists see this as essential. Prejudice towards theories emphasizing justice/rights over pure aggregate welfare.

  4.  **Endpoint Agnosticism:**
      *   **Requirement:** The theory must *not* logically require or depend on a predetermined endpoint (telos, utopia, "end of history") for "progress" to be meaningful or identifiable. Progress should be conceivable as an ongoing, potentially open-ended process.
      *   **Motivation:** Telic theories are empirically dubious (history rarely cooperates) and philosophically suspect (imposing a specific future). They are prone to Whiggism by defining progress as movement towards *their* endpoint. Skeptical historians reject inevitability.
      *   **Status:** **Prejudice of anti-teleological/fallibilist camp.** Marxists, certain religious views, or strong optimists might insist progress implies directionality towards *something*.

  5.  **Justified Unit of Analysis:**
      *   **Requirement:** The theory must explicitly define and justify its unit of analysis (e.g., humanity, civilization, nation-state, institution, individual flourishing) for measuring progress. The justification must explain why this unit is the most appropriate locus of progress claims and address potential contradictions (e.g., progress for one nation vs. humanity; institutional efficiency vs. human welfare).
      *   **Motivation:** Arbitrary units lead to misleading conclusions (e.g., "Western progress" ignoring colonialism; GDP growth ignoring inequality). Different units often show conflicting trends. The choice carries normative weight.
      *   **Status:** **Essential Rigor.** Failure here makes comparisons meaningless. Often reflects deeper normative commitments (cosmopolitanism vs. communitarianism, etc.).

  6.  **Multi-Directionality & Scope (Added):**
      *   **Requirement:** The theory must acknowledge and account for the possibility of simultaneous progress in some domains alongside stagnation or *regress* in others during the same period. It must define the scope of its claims (moral, political, technological, welfare?).
      *   **Motivation:** History isn't uniformly forward-moving. Ignoring regress (e.g., environmental degradation alongside technological advance; rights expansions alongside new forms of oppression) is Whiggish. Clarity on scope prevents overreach.
      *   **Status:** **Essential for Realism.** Prejudice of complex systems thinkers vs. linear progressivists.

  7.  **Counterfactual Robustness (Added):**
      *   **Requirement:** The theory should ideally provide resources for evaluating whether a *change* constitutes "progress" relative to plausible alternative historical paths, not just relative to the immediate past.
      *   **Motivation:** Avoids the trap of "better than a terrible past" being sufficient for "progress." Was abolition *progress* only relative to chattel slavery, or would it still be progress relative to other feasible historical alternatives?
      *   **Status:** **High Bar / Aspirational.** Difficult to implement empirically but strengthens claims against "lesser evil" arguments.

  ### Which Requirement Eliminates the Most Contenders?
  **Non-Endogeneity of Standards (Requirement 2)** is the most devastating filter. It eliminates:
  *   **Simple Presentism:** "Progress is moving towards our current values." (Blatantly circular).
  *   **Hegelian/Marxist Dialectics:** Progress is defined by the logic/internal contradictions of the historical process itself. Standards are endogenous.
  *   **Many Liberal Narratives:** Relying uncritically on the "expansion of freedom/rights" as defined by the modern liberal tradition that is itself the product of that history.
  *   **Pure Social Evolutionism:** Defining progress as "what survived/was selected" within a contingent historical process. Might makes right.
  Only theories grounded in strong, independently justified normative foundations (e.g., rigorous moral realism, sophisticated contractualism that transcends specific epochs, certain capability approaches) or highly abstract, procedural definitions can potentially pass this hurdle, and even they face immense challenges justifying their universality.

  ### Assessing Your Conjecture: Endogeneity vs. Policy Guidance
  **Your conjecture is likely correct: satisfying both non-endogeneity *and* providing concrete policy guidance is extremely difficult, possibly impossible, for a robust theory.**

  *   **The Tension:** Non-endogeneity requires grounding normative standards *outside* the specific flow of history being judged. Policy guidance, however, requires applying those standards to *specific, contingent* historical circumstances, institutions, and choices deeply embedded within the ongoing process.
  *   **The Dilemma:**
      1.  **Abstract Standards:** A non-endogenous standard (e.g., a universal principle of human dignity, equal consideration of interests) is necessary to avoid circularity. But such standards are often highly abstract (e.g., Kant's Categorical Imperative, Rawls's original position principles). Translating these into specific, actionable policy prescriptions for complex modern societies requires interpretive leaps, contextual judgments, and empirical assumptions that *are* influenced by the historical context and potentially susceptible to endogenous bias. The gap between universal principle and concrete policy is vast.
      2.  **Contextual Standards:** To provide direct policy guidance, standards need to be specific to the context. But developing *specific* standards inevitably draws on the historical experiences, cultural understandings, and institutional realities of the society making the policy – precisely the endogenous factors the non-endogeneity requirement seeks to transcend. A policy derived purely from ahistorical principles risks being irrelevant, ineffective, or even harmful.
  *   **Result:** The most robust non-endogenous theories (e.g., certain forms of moral realism or highly abstract contractualism) often struggle to yield *unambiguous* policy guidance without relying on auxiliary, historically contingent theories or empirical claims. Conversely, theories offering clear policy prescriptions (e.g., specific theories of justice applied to modern states) often rely on normative frameworks (like liberal individualism) that are demonstrably products of the history they seek to assess, failing strict non-endogeneity. **This constitutes a significant joint unsatisfiability.**

  ### Assessment of Broad Families of Accounts
  *   **Progress as Accumulation of Solved Problems:**
      *   **Strengths:** Clear on reversals (problem recurs), potentially endpoint-agnostic, can handle multi-directionality (solved in A, worse in B).
      *   **Weaknesses:** **Fails Non-Endogeneity:** What counts as a "problem" is culturally/historically defined. **Fails Accountability:** Ignores *how* problems are "solved" and who bears the costs (e.g., "solving" poverty via exploitation). Unit of analysis (whose problems?) is problematic. Policy guidance is purely technical, lacking normative justification for *which* problems to prioritize.
  *   **Progress as Enlargement of the Circle of Moral Concern:**
      *   **Strengths:** Directly addresses key moral shifts (slavery, rights), intuitive, endpoint-agnostic (circle can keep expanding), provides *some* policy direction (expand inclusion).
      *   **Weaknesses:** **Struggles with Non-Endogeneity:** Why is expansion good? Justification often relies on modern intuitions (endogenous). **Poor on Reversals:** What *specific* contraction definitively signals regress? **Ignores Costs:** Doesn't address injustices *within* the circle or costs of expansion. **Unit of Analysis:** Focuses on scope of concern, but silent on other units/institutions. Can be vague on concrete policy beyond inclusion.
  *   **Progress as Unfolding of Immanent Direction (Teleological/Developmental):**
      *   **Strengths:** Can provide a clear narrative and potential policy direction (facilitate the unfolding).
      *   **Weaknesses:** **Fails Non-Endogeneity:** Direction is defined *by* the process. **Fails Endpoint Agnosticism:** Requires a direction, implying an endpoint/goal. **Falsifiability/Reversals:** Major reversals are theoretically problematic (was it *really* progress?). **Accountability/Costs:** Often justifies costs as necessary for the unfolding. **Unit:** Often assumes a specific unit (e.g., Spirit, Civilization). **Highly vulnerable to Whig critique.**

  **Conclusion:** No existing family of account satisfies all desiderata comfortably. The **Non-Endogeneity** requirement is the strictest filter, eliminating most popular narratives. The tension between **Non-Endogeneity** and **Policy Guidance** appears fundamental, pointing towards a core difficulty: applying truly universal, ahistorical standards to the messy, contingent realm of history and politics. A viable theory will likely need to be highly abstract in its core normative justification (to avoid endogeneity) while incorporating sophisticated, fallible, and historically sensitive methods for bridging the gap to concrete historical analysis and policy prescription, explicitly acknowledging the limitations at each step. The desiderata highlight the profound challenges inherent in making rigorous, non-Whiggish claims about moral and political progress.
