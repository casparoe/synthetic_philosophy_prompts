prompt: |-
  I sit on the capital committee for a small coastal town, about 11,000 people, and I'm the one who keeps dragging long-run stuff onto the agenda, so this has been bugging me for a while. I want to work out what we should vote on next month, and more than that I want to know whether our last six years of votes add up to a position at all. Here they are, roughly in order:

  - **Roofs.** We paid around 40% extra to put 40-year roofs on all three schools instead of 20-year ones. Unanimous, no real argument, nobody said the word "discount."
  - **Power lines.** The engineers' own numbers said burying the lines pays for itself in avoided outage costs over something like 55 years. We voted it down 4-1. The reason said out loud was that they weren't going to make people pay now for something their grandkids recieve.
  - **Seawall.** After the hurricane we approved $6 million for a seawall in about eleven minutes. It's rated for a hundred years of service, so it's a long-horizon project too, but it protects buildings that are standing now and voters who are standing now.
  - **Trees.** We approved planting 400 street trees, which was cheap, and we've let maybe half of them die. When I raised it, the answer was that maintenance isn't a capital item.
  - **Landfill closure.** We're legally required to close the old landfill in about 25 years. We put in exactly the required amount each year and no more, even though we're paying more interest on the bonds we issued than the closure fund earns, which as far as I can tell means front-loading it would definately cost us less in total. Nobody seemed to think that was worth discussing.
  - **The waste facility.** A company offered us $300k a year for 30 years to put a lined industrial waste site on the edge of town. Their consultants said the chance of contamination reaching the aquifer was small but not zero, and that if it happened it'd happen 60 to 90 years out. We said no. What stuck with me afterwards: not one person argued that aquifer damage counts for less because it's far away. They argued it might happen and it would be very bad, full stop.

  Now next month's item. A combined grant-and-town-money package to rebuild the stormwater system so it handles the rain we now get about once a decade, but sized for the conditions the models project for 2080. $4.2 million from us now. It prevents maybe $9 million in damage, and basically all of that lands after 2070 — on streets that haven't been built yet and people who are mostly not born yet. The committee is split in a way I find confusing, because both sides sound like they've actually thought about it. One member says our grandkids will be far richer than we are, so poorer people shouldn't be subsidizing richer people, and that means we shouldn't do it. Another says that's backwards: if the climate goes badly they'll be poorer than us and will need it more, plus we're the ones who made the problem, and anyway we can't know which way it goes so you should weight the bad scenario heavier.

  What I want from you:

  1. Which of the six old votes is the closest analog to this one, and what actually separates it from the others? I assumed it was the seawall, but the power lines keep feeling closer and I can't articulate why.
  2. Write out the candidate rules our record is consistent with. I'm pretty sure there's more than one, and I suspect at least one of them implies the aquifer vote was right and the tree vote was wrong for reasons nobody in the room gave. If any of the six are flat-out inconsistent with each other, say which, and which one I should stop defending.
  3. Tell me what to vote, and what we'd be committing ourselves to either way, in language I could use at a meeting without sounding like a textbook. If the choice turns on something we could go find out — how much richer or poorer the town is likely to be, how to handle not knowing — say what.
  4. If there are proper names for these rules, give me the names with one plain sentence each, but I care more about the rules than the labels.
  5. What should I put on a future agenda to find out which rule we're really running? Some proposal where the rules we might be using would split apart and we'd finally see which one we've been applying all along.
reasoning: |-
  Okay, let me approach this systematically. The user is on a capital committee for a small coastal town and needs help making sense of inconsistent long-term investment decisions. They've provided six past votes and one upcoming stormwater proposal, wanting analysis of patterns and voting guidance.

  First, I need to understand the core tension in their decision history. The seawall was approved immediately for current protection, while similar long-term investments like underground power lines were rejected for benefiting future generations. The landfill underfunding despite financial logic, and the aquifer protection vote based purely on risk severity rather than timing, suggest conflicting principles at play.

  For the stormwater analogy, I consider why it feels closer to power lines than seawall. Both involve infrastructure protecting future development against probabilistic future events, where the primary beneficiaries don't yet exist. The seawall protected existing assets - that distinction seems crucial. The trees case is also relevant as another maintenance failure, showing how "capital vs operational" boundaries can undermine long-term thinking.

  Looking for consistent rules, I spot three patterns: a "tangible-immediacy test" favoring projects with clear near-term benefits; a "risk-aversion principle" where irreversible harm gets vetoed regardless of timeframe; and a "generational equity" concern that surfaces in both power line and stormwater debates. The landfill exception puzzles me until I realize it's legally mandated - compliance trumps optimization.

  On inconsistencies, the tree neglect contradicts their seawall maintenance logic. And the stormwater debate reveals deeper philosophical splits: the "richer future" argument assumes constant growth while "poorer future" considers climate degradation - this needs explicit discussion.

  For the vote recommendation, I weigh that the stormwater project shares characteristics with both approved and rejected items. But since it prevents irreversible harm like the aquifer decision, and adapts to known climate trends, approval seems most consistent. However, they should demand sensitivity analysis on discount rates and wealth projections to address committee concerns.

  To force clarity on their operating principles, I'd propose two future test cases: a "sacrificial dunes" project with deferred benefits but no irreversible harm, and a climate-adjusted revision of that rejected power line proposal. Both would make implicit rules explicit through voting patterns.

  The names for these rules matter less than the concepts, but I'll connect them to economic terms like "hyperbolic discounting" and "precautionary principle" with simple explanations. The key is helping the committee recognize which mental model they're actually using when evaluating tradeoffs between present costs and future benefits.
answer: |-
  Based on your record and the stormwater dilemma, here's a breakdown:

  **1. Closest Analog & Key Distinction**
  *   **Closest Analog:** **The Power Lines.** While the Seawall *feels* similar (physical protection, climate-related, long lifespan), the Power Lines share the *critical characteristic*: **primary beneficiaries are future generations, not current voters/residents.** The avoided outage costs accrue far beyond the working lives of current taxpayers. The Seawall protects *existing* assets and people *immediately*.
  *   **What Separates Stormwater from Seawall:** The Seawall protects **existing, tangible assets and people** facing an **imminent, demonstrably recurring threat** (post-hurricane). Stormwater protects **future assets and residents** against a **projected, probabilistic future threat** based on models decades out. The immediacy and tangibility of the seawall threat made it an easy "yes" despite its lifespan.

  **2. Candidate Rules Consistent with Your Record (Inconsistencies Noted)**
  Your committee implicitly uses several rules, sometimes conflicting:

  *   **Rule 1: Tangible-Immediacy Test (Dominant Rule):** Approve long-term investments *only* if they provide **significant, immediate, and tangible benefits to current residents or protect existing, high-value assets.** (Consistent with: Roofs (immediate asset upgrade, cost debated upfront), Seawall (immediate protection), Trees (cheap upfront, immediate "feel-good"/aesthetic). Inconsistent with: Power Lines (future benefit), Landfill (future cost avoidance ignored), Stormwater (future benefit).
  *   **Rule 2: Catastrophic Risk Aversion Principle:** Reject projects carrying **any non-trivial risk of irreversible, catastrophic harm to the environment or public health, regardless of timeframe or probability.** (Consistent with: Aquifer Vote - "very bad, full stop"). This overrides Rule 1's reluctance on long timeframes for existential threats.
  *   **Rule 3: Generational Equity Constraint (Selectively Applied):** **Avoid imposing significant current costs primarily for benefits accruing to significantly wealthier future generations.** (Consistent with: Explicit reasoning in Power Lines vote ("grandkids receive"), implicit in Landfill underfunding (delay cost), and one side of Stormwater debate. *Inconsistent with:* Roofs (long-term benefit accepted without discount debate), Seawall (grandkids benefit too, but current benefit dominant)).
  *   **Rule 4: Regulatory & Legal Minimum Compliance:** Meet legally mandated future obligations **only at the minimum required pace/cost**, regardless of potential long-term savings. (Consistent with: Landfill closure funding).
  *   **Inconsistencies & What to Stop Defending:**
      *   **Trees vs. Seawall/Maintenance Ethic:** The Tree neglect is **flat-out inconsistent** with the implied long-term maintenance ethic of the *Roofs* and *Seawall* investments. You paid extra for durability but refuse the cheap upkeep needed to realize that value. **Stop defending:** The "maintenance isn't capital" excuse for the Trees. It's a false distinction that undermines your other capital decisions. A durable capital asset (Roof, Seawall, Tree) *requires* maintenance to deliver its intended lifespan value.
      *   **Aquifer Vote vs. Power Lines Logic:** The Aquifer vote (Rule 2) **overruled** the Generational Equity Constraint (Rule 3) implicitly used in the Power Lines vote. The *risk* dominated the *timing* argument. This is actually consistent *if* Rule 2 supersedes Rule 3 for catastrophic risks.

  **3. How to Vote & What to Say (Stormwater Project)**

  *   **Recommendation:** **Vote YES, but conditionally.** Argue it aligns best with your *principles* when viewed through the lens of catastrophic risk and responsibility.
  *   **Language for the Meeting:**
      > "Look, this feels like the power lines debate – paying now for folks decades out. But the stormwater is different in a key way: it's about managing a *known, growing risk* we're contributing to, not just convenience. Our record shows we act decisively against catastrophic risks, like protecting the aquifer, even if they're far off. Climate models tell us heavier rain *is* coming, and flooding can be catastrophic for a coastal town – wrecking homes, infrastructure, the environment. Waiting means higher costs later and less protection when it hits. Yes, it benefits future residents, but climate change means they might *not* be richer, and we helped create the problem. Building this *now*, sized for the future, is the responsible hedge against that bad outcome. It's protecting the town's future viability, much like the aquifer vote protected its water. Let's approve this, but ask staff for a quick sensitivity analysis: show us the cost/benefit if future damages hit 10 years earlier or later than 2070, and if future town wealth grows at half or double our past rate. That'll help us see how robust the case is."

  *   **What You Commit To Either Way:**
      *   **YES:** Commits current taxpayers to significant cost ($4.2M) for benefits accruing 50+ years out. Implicitly prioritizes precaution against catastrophic climate risk (Rule 2) and responsibility for future generations over strict Generational Equity (Rule 3). Signals willingness to invest in long-term climate resilience for *future* development.
      *   **NO:** Upholds the Generational Equity Constraint (Rule 3) and Tangible-Immediacy Test (Rule 1) strictly. Prioritizes current taxpayer burden. Risks much higher future costs and potential catastrophic damage if models are accurate. Implicitly bets future generations will be richer *and* better equipped to handle the problem.

  *   **What to Find Out:** The core uncertainty is the **relative wealth of future residents vs. the severity/timing of the climate impact.** Ask for:
      1.  Historical town wealth growth trends (property values, income) over the last 30-50 years.
      2.  Climate model sensitivity for precipitation projections in your specific area (best/worst case scenarios for 2080).
      3.  A revised cost/benefit analysis using a *range* of discount rates (including potentially 0% for catastrophic risk) and the wealth/climate sensitivity data.

  **4. Proper Names & Plain Sentences**

  *   **Rule 1 (Tangible-Immediacy Test):** **Hyperbolic Discounting / Present Bias.** People heavily discount future benefits/costs compared to immediate ones.
  *   **Rule 2 (Catastrophic Risk Aversion):** **Precautionary Principle.** If an action risks severe harm, lack of full scientific certainty shouldn't prevent protective measures.
  *   **Rule 3 (Generational Equity Constraint):** **Intergenerational Equity / Discounted Utilitarianism.** Future costs/benefits are valued less than present ones (discounted), and imposing costs on the poor (present) for the rich (future) is unfair.
  *   **Rule 4 (Min Compliance):** **Satisficing.** Meeting the minimum requirement rather than optimizing for the best possible outcome.

  **5. Future Agenda Item to Reveal the True Rule**

  Propose: **"Sacrificial Dunes & Beach Nourishment Plan: 50-Year Cost/Benefit Analysis"**

  *   **The Proposal:** Invest $X million now to build engineered dunes and establish a 50-year nourishment plan (adding sand periodically) to protect vulnerable oceanfront properties and infrastructure. Significant upfront cost + recurring future costs. Primary benefit is protecting *existing* high-value properties *now* from erosion/storms, but the protection extends far into the future, benefiting future owners/residents. The "sacrificial" aspect means the dunes take the hit, sparing buildings.
  *   **Why it Splits the Rules:**
      *   **Tangible-Immediacy (Rule 1):** Protects *existing* assets NOW. Strong argument for YES.
      *   **Catastrophic Risk (Rule 2):** Protects against storm surge/erosion (catastrophic). Strong argument for YES.
      *   **Generational Equity (Rule 3):** Significant *recurring* future costs paid by future taxpayers to protect property values that will likely be much higher (oceanfront). Argument for NO or scaled-back plan.
      *   **Min Compliance (Rule 4):** Is there a legal mandate? Likely minimal. Tends towards minimal action or NO.
  *   **What You Learn:** If they vote YES despite future costs because it protects existing assets *now* (Rules 1 & 2 dominate). If they vote NO or minimal due to the long-term recurring cost burden on future taxpayers (Rule 3 dominates). This pits the protection of *current* assets (Rules 1 & 2) directly against the burden on *future* taxpayers (Rule 3) in a way the previous votes didn't perfectly capture. The debate will reveal which force is stronger: protecting the tangible now or avoiding costs on the future.

  This proposal forces the conflict between protecting immediate tangible assets and imposing long-term recurring costs onto future residents into sharp focus, revealing the committee's dominant underlying principle.
