prompt: |-
  I'm the junior editor on a one-volume reference encyclopedia of political movements — think a beefed-up dictionary of modern ideologies, one entry per movement, and every entry gets a running-head tag: Left, Right, or Syncretic. The senior editor makes all the tagging calls and she's extremely protective of them, so before I propose a tag on the next entry I want to work out what rule she's actually applying.

  Her rulings so far, with the bit of each movement that matters:

  - Bolsheviks, and the 1945 Labour government in Britain — public ownership of the major industries, plus a program of radical levelling: Left.
  - Anarcho-syndicalists, e.g. the Spanish CNT — production run by workers' collectives, and they wanted the state abolished entirely: Left.
  - The Diggers of 1649 — dug up and farmed common land collectively, wanted the enclosures pulled down and the commons put back to common use: Left.
  - Marxist national-liberation movements, Vietnam and Algeria — the whole program framed as the liberation of one particular people, and openly impatient with universalist, cosmopolitan talk: Left.
  - The Manchester free traders — laissez-faire and low tariffs; their pitch was that free exchange lifted every nation on earth and would end wars, and they held that whatever inequality a free market threw up wasn't a wrong to be corrected: Right.
  - Anarcho-capitalists — private property, no state at all, and a theory written for any rational agent anywhere: Right.
  - Postwar Christian Democrats — built out quite generous welfare states, but defended the family, the churches, and an organic social order with natural differences of station: Right.
  - Thatcherism — privatization, plus a deliberate demolition of the postwar settlement she'd inherited: Right.
  - Peronism — the only Syncretic tag in the whole volume. Her note says it nationalized and redistributed like a left movement while organizing everything around one man and one nation.

  The next entry is the school choice movement: public money attached to the child rather than to the school, so a family can carry it to whichever school they pick, private and religious ones included. Supporters argue that a poor kid trapped in a failing school is being denied the one thing that sets the terms of their whole life, and that the current arrangement effectively sells an education bundled with a house price. Opponents argue it hollows out the common schools that everyone else has to keep working at, and hands public money to institutions that get to select on faith and ability. Both camps are sincere, and both claim the egalitarian high ground.

  So what tag will she put on it? Tell me which rule you think she's running, and also which other candidate rules fit everything above just as well — I can think of at least a couple that look live until you actually check them against the list, and I want to know which ones are dead on arrival and what killed them. Then say which of her precedents is my closest analog if I have to defend a proposed tag to her in the meeting, and be honest about what principle the volume commits itself to whichever way this one goes, since a reference work's tag scheme is basically an implicit theory of what the left/right distinction is.

  Also: name one further movement, real or invented, that would tell me whether her tag tracks what a movement wants to happen or how it wants to get there, because I suspect thats the actual fork in the road, and Peronism is the only place she's ever admitted the two coming apart. And then step back for a sec — does her record look like evidence that there's a single property all left-wing movements share, or a handful of properties that just happen to have travelled together since the French Revolution, or no real property at all, just a name for whichever coalition is currently facing off against the other one? Whichever you land on, tell me what in the list above is doing the work. And dont fob me off with "Syncretic, obviously" for the new entry unless you can say what makes Peronism genuinely different from it.
reasoning: |-
  Hmm, the user is a junior editor working on a political encyclopedia tagging system. They need to predict how their senior editor will tag the "school choice movement" entry as Left, Right, or Syncretic, based on previous tagging patterns. The user also wants to understand the underlying rule being applied, identify alternative rules that fail, find the closest precedent, and explore deeper implications about the nature of left-right distinctions.

  Looking at the senior editor's past tags:

  - Left-tagged movements (Bolsheviks, anarcho-syndicalists, Diggers, Marxist liberation movements) all involve challenging existing hierarchies through collective action or redistribution. Even nationalist movements got Left tags when they framed struggle as liberation of oppressed groups.

  - Right-tagged movements (Manchester free traders, anarcho-capitalists, Christian Democrats, Thatcherism) preserve or create hierarchies - whether through market outcomes (inequality as natural), traditional structures (family/church), or restoring pre-welfare state conditions.

  - Peronism is the sole Syncretic case because it combines left-style redistribution with right-style personalist authority and nationalism.

  For school choice: The movement uses market mechanisms (vouchers) to bypass state systems, which aligns with Right's preference for individual choice over collective solutions. Though framed as egalitarian, it structurally empowers private institutions and risks stratification - consistent with Christian Democrats' welfare-with-hierarchy approach.

  Alternative rules that fail:
  - "Anti-state = Left" fails because anarcho-capitalists (anti-state) are Right.
  - "Pro-redistribution = Left" fails because Christian Democrats redistributed but are Right.
  - "Universalist = Left, nationalist = Right" fails because Marxist nationalists are Left while Manchester free traders (universalist) are Right.

  Closest precedent is Christian Democrats: both use state resources to support individual choice while accepting resultant hierarchies. The key principle is hierarchy acceptance vs rejection.

  To test whether means or ends matter, imagine a movement wanting universal healthcare but through privatized vouchers - likely tagged Right, confirming means determine the tag.

  The consistent thread is hierarchy: Left rejects unjust hierarchies; Right sees hierarchies as natural or beneficial. Peronism is Syncretic because it attacks economic hierarchies while enforcing political/national ones. School choice's market mechanism naturally stratifies, so it should be Right.
answer: |-
  Based on the senior editor's rulings and the logic underlying them, here's the breakdown for the school choice movement entry:

  **1. Predicted Tag:** **Right**

  **2. The Senior Editor's Rule:**
     **"A movement is tagged Left if its *core mechanism* aims to dismantle or prevent entrenched social/economic hierarchies (especially class-based ones) by collective action or state intervention. It's tagged Right if its *core mechanism* accepts, reinforces, or creates hierarchies (economic, traditional, or national) through individualism, markets, tradition, or authority, even if it uses state power for these ends. Syncretic is reserved for movements where the core mechanism simultaneously attacks *one* major hierarchy while enforcing *another* equally fundamental one in a way that intrinsically defines the movement."**

  **3. Why School Choice is Right:**
     *   **Core Mechanism:** Relies on *market principles* (individual choice, competition between providers) to distribute a public good (education). This inherently accepts that outcomes will be stratified (better schools attract more "customers"/resources, worse schools decline).
     *   **Hierarchy Acceptance:** While framed as egalitarian (helping poor kids escape bad schools), its mechanism doesn't dismantle the underlying hierarchy (unequal access tied to wealth/location/ability). It allows, and arguably accelerates, stratification *among* schools and potentially *within* the system (via selective admissions in private/religious schools funded by vouchers). It shifts responsibility from the collective (state ensuring quality common schools) to the individual (family choosing).
     *   **Precedent Alignment:** Closest to **Postwar Christian Democrats**. Both use state resources (welfare/funding) but channel them in ways that reinforce existing or create new hierarchies (traditional family/social order for CD, educational stratification via market for school choice). Both are "Right" despite using state power because the *effect* is hierarchy-reinforcing. The "egalitarian high ground" claim by proponents mirrors CD's welfarism, but doesn't override the core hierarchical mechanism.

  **4. Alternative Rules That Fail (and Why):**
     *   **"Anti-State = Left, Pro-State = Right?":** Fails immediately. Bolsheviks (pro-state) and Anarcho-Syndicalists (anti-state) are *both* Left. Manchester Free Traders (anti-state intervention) and Christian Democrats (pro-state welfare) are *both* Right.
     *   **"Pro-Redistribution/Public Ownership = Left?":** Fails on Christian Democrats (generous welfare) and Thatcherism (demolished redistribution) both being Right. School choice *redistributes money*, but to enable market choice, not collective provision.
     *   **"For the Poor/Oppressed = Left?":** Fails on Marxist National-Liberation (Left) vs. School Choice proponents (also claim to help the poor, but Right-tagged). The *how* matters more than the claimed beneficiary.
     *   **"Universalist/Cosmopolitan = Left, Nationalist = Right?":** Fails on Marxist National-Liberation (nationalist, Left) vs. Manchester Free Traders/Anarcho-Capitalists (universalist, Right). Peronism is nationalist but Syncretic, not purely Right.
     *   **"Radical Change = Left, Status Quo/Conservatism = Right?":** Fails on Thatcherism (radical change, Right) vs. Postwar Labour (radical change, Left). The *direction* of change (hierarchy-dismantling vs. hierarchy-reinforcing) matters, not just the degree.

  **5. Closest Precedent for Defense:** **Postwar Christian Democrats** is the strongest analog. Both:
      *   Utilize state resources/funding.
      *   Are defended partly on social or egalitarian grounds (welfare for social stability/family; choice for poor kids).
      *   Have mechanisms that inherently accept and reinforce social stratification (traditional hierarchy; educational hierarchy via markets/choice).
      *   Opponents argue they undermine the common good/common institutions.

  **6. Implicit Principle Committed To:** **The volume commits to defining Left/Right primarily by the movement's *core mechanism* and its *inherent relationship to social hierarchy*, rather than its stated goals, beneficiaries, or its stance on the state/markets/tradition *in isolation*. Left = mechanism attacks hierarchy collectively. Right = mechanism relies on/creates hierarchy via individualism/markets/tradition/authority.**

  **7. Test Movement: Means vs. Ends**
     *   **Movement:** "Techno-Universal Basic Services (UBS)": A movement advocating for *universal* access to high-quality healthcare, education, and transportation funded by progressive taxation. However, its *core mechanism* is outsourcing all provision to competitively tendered, for-profit corporations (a hyper-privatized model), arguing this maximizes efficiency and "consumer choice."
     *   **Why it Tests Means/Ends:** The *end* (universal access, funded progressively) sounds Left. The *means* (privatized, for-profit delivery via markets) is fundamentally Right-aligned under the editor's rule (reinforces market hierarchy, prioritizes choice/competition over collective provision). **Prediction:** The editor would tag this **Right**, confirming she prioritizes the *means/mechanism* over the ends. Peronism was Syncretic because its means *simultaneously* attacked (economic hierarchy) and enforced (political/authoritarian/national hierarchy) different hierarchies intrinsically.

  **8. Nature of Left/Right Distinction in this Scheme:**
     *   **It's a single, coherent (though complex) property:** **The core mechanism's inherent relationship to social hierarchy.**
     *   **Evidence in the List:**
          *   **Left Examples:** All core mechanisms *directly attack class/economic hierarchy* through collective action or state power aimed at levelling (Bolsheviks: state ownership/levelling; Anarcho-Synds: worker collectives abolish class state; Diggers: collective common ownership; Marx NatLib: collective national struggle against imperialist/class oppression).
          *   **Right Examples:** All core mechanisms *rely on or create hierarchy*. Free Traders/AnCap: Market outcomes create justified economic hierarchy; Christian Democrats: Welfare supports, but reinforces, traditional/organic hierarchy; Thatcherism: Actively restores market hierarchy by dismantling collective structures.
          *   **Syncretic (Peronism):** The mechanism intrinsically combines hierarchy attack (economic redistribution) and hierarchy enforcement (authoritarian personalism/nationalism), making it neither purely Left nor Right.
     *   **Why not a coalition or traveling bundle?** The consistency of the hierarchy lens across vastly different movements (revolutionary anarchists, reformist socialists, free-market liberals, traditional conservatives, radical privatizers) suggests a deeper principle. The "bundle" (state/markets/universalism etc.) frequently comes apart within the tags (see failed rules), but the hierarchy relationship holds. It's not just "who opposes whom"; CNT anarchists and Bolsheviks were bitter enemies, but both tagged Left because both fundamentally attacked class hierarchy.

  **Why School Choice Isn't Syncretic (Unlike Peronism):**
  Peronism is Syncretic because its *very essence* combined two fundamentally contradictory hierarchical principles within a single, fused mechanism: attacking economic elites (Left impulse) while simultaneously concentrating power in a leader and elevating the nation above class (Right impulses). The hierarchy dismantling and hierarchy building were inseparable and co-constitutive.

  School choice, however:
  1.  Has a **single core mechanism:** Using market principles (vouchers/choice) to distribute education funding.
  2.  This mechanism has a **primary hierarchical relationship:** It inherently accepts and facilitates stratification (between schools, potentially among students). While proponents *claim* an egalitarian *goal*, the *mechanism itself* does not intrinsically combine hierarchy-attack and hierarchy-enforcement in the same fundamental way Peronism did. The egalitarian claim is an *argument for* the mechanism, not an intrinsic, contradictory element *of* the mechanism like Peron's worker mobilization *through* authoritarian nationalism.

  **Conclusion for the Meeting:**
  Propose **Right**. Cite the **Postwar Christian Democrats** as the closest precedent: both use state resources but channel them through mechanisms (traditional hierarchy support / market choice) that accept and reinforce social stratification, aligning with the editor's consistent focus on the core mechanism's relationship to hierarchy. Be prepared to articulate that while proponents claim egalitarian *ends*, the *means* (market choice) is inherently hierarchy-accepting in its operation, placing it firmly within the Right tag per her established framework. The volume's implicit theory is that Left/Right is defined by the fundamental logic of a movement's core mechanism concerning social hierarchy, not its rhetoric or isolated policy positions.
