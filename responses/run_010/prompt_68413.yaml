    - Output: \(55k/45k\), matching your judgment (equal gain from fallback).

  #### Impossibility Results
  - **Can any rule keep both (2) and (3) while satisfying efficiency, symmetry, and scale invariance?**  
    **Yes.** The rule above keeps both Verdict 2 and Verdict 3.  
    - Verdict 2 uses proportional allocation when \(\min(C_a, C_b) > P/2\).  
    - Verdict 3 uses full allocation to the smaller claimant when \(\min(C_a, C_b) \leq P/2\).  
    - Both are scale-invariant and symmetric, and money is fully distributed.

  - **Can any rule keep both (2) and (4) while satisfying efficiency, symmetry, and scale invariance?**  
    **No.** It is impossible to keep both Verdict 2 and Verdict 4 under these conditions.  
    - **Why:** Verdict 2 requires proportional allocation based on claims (\(C_a = 60k, C_b = 90k, P = 100k \rightarrow 40k/60k\)). Verdict 4 requires the same allocation (\(40k/60k\)) despite \(C_b\) increasing to \(500k\). Scale invariance implies that the allocation must depend only on the ratios of claims to the pot (e.g., doubling all values should preserve proportions). However, proportionality is sensitive to the absolute claim values: for fixed \(C_a\) and \(P\), increasing \(C_b\) decreases \(A\) and increases \(B\) proportionally (e.g., \(C_b = 500k\) gives \(A \approx 10.71k\), not \(40k\)). Thus, **proportionality** and **scale invariance** conflict with the requirement that the allocation remains unchanged when claims are inflated (as in Verdict 4). No rule can satisfy all conditions simultaneously for both verdicts.

