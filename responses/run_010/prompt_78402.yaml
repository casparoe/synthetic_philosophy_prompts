answer: |-
  Here’s Rita’s eulogy, threading the needle as requested. Concrete objects: **the shop radio, his knuckles, the brass bell over the shop door.** Philosophy rendered invisible, voice dry and tactile, unresolved tension maintained.

  ---

  **(Rita stands at the lectern. She doesn’t touch the microphone.)**

  Dad kept that old shop radio dialed to the same station for forty years. WGRQ. Static like frying bacon half the time. He’d bang the side with his wrench when the weather report cut out. Knew every song, every ad jingle. Sang along worse than a busted muffler. That radio played right up until the day he locked the doors for good. Loud. You could hear it out on 9. Then… silence. For eleven years. Just the sound of him asking where the music went, over and over. Like someone stole it.

  You all knew his hands. Knuckles like walnuts, grease worked so deep into the cracks it was part of the skin. Saw those hands pull Walt Jenner’s Chevy out of a snowdrift in ’78, blizzard howling like a banshee. Saw them cradle Mrs. Gable’s tabby with a broken leg, gentle as holding glass. Saw them refuse payment more times than I can count, waving you off like you’d insulted him. He built things. Fixed things. Held things together.

  Then those hands started shaking. Then the words... changed. Became stones. Aimed at me. Accusations. Ugly things about Mom. Things that don’t belong anywhere, least of all out loud. For eleven years, everybody said the same thing. "It’s the disease, Rita. It’s not him. Don’t take it personal." They meant well. Doctors, Mike, Father Donnelly. Even I said it, sometimes, to get through the night.

  But here’s the thing they didn’t see, standing outside it. When you say "It’s not him," who’s left in that room? Just the disease? Just a problem to manage? A thing to medicate and clean up after? You take the person out of the equation. You leave me alone in a room with a storm that has no name. Who do you yell at? Who do you forgive? You can’t forgive a hurricane. You just survive it. And that… that leaves you holding an awful lot of broken glass with nowhere useful to put it down.

  I needed him to have said those things. The awful things. Because he was the only one who *could* say them. They came out of his mouth. His eyes looked at me, even when they didn’t know me. A person is the only thing that *can* hurt you like that. And the only thing worth forgiving. If it wasn’t him… then who was I wiping mashed potatoes off the wall for? Who was I talking back to, quiet-like, when he slept? Who was I mad at? Just the empty space where my father used to be?

  He’s gone now. The good man, the hard man, the scared, cruel man. All of him. And I won’t pretend the last eleven years didn’t happen. I won’t pretend they weren’t him. He lived them. I lived them with him. That coffee can of mismatched bolts he kept by the shop door? The one he’d dig into whenever someone needed something odd, just hand it over? That was him. The words he threw at me like wrenches? That was him too. What he had left to give, sometimes. What he couldn’t hold back.

  We don’t get to pick which parts count. We don’t get to say "This was the real Ray" and "That was the impostor." Life doesn’t parcel itself out that clean. You get the whole man. The one who’d give you the shirt off his back and grumble about it for a week. The one who forgot your face and called you a thief. Same hands. Same voice. Same life.

  So. Today. We bury Ray Kessler. All of him. The man who fixed your car and the man who broke my heart. The one who sang off-key to the radio and the one who sat in the silence. I forgive him. Not the disease. *Him*. For the words. For the hurt. Because he was my father. And forgiveness… it’s the last thing I can give him that means anything. The last thing that puts us both back in the same room, as people. Before he goes.

  There’s a brass bell over the shop door. Haven’t rung it in years. But it’s still there. Still waiting for the next hand to pull the rope. Guess it’ll keep waiting.

  **(Rita steps away from the lectern. She doesn’t look at the Scranton relatives.)**

  ---

  **Analysis for Your Editor (99 words):**

  1.  **"A person is the only thing that *can* hurt you like that. And the only thing worth forgiving."**: This is the core philosophical argument (Strawson’s reactive stance) rendered plainly. It establishes *why* Rita needed Ray to be the agent, not just a victim of disease. Load-bearing.
  2.  **"That coffee can of mismatched bolts... That was him. The words he threw at me like wrenches? That was him too."**: Achieves the dual audience function. To locals, the bolts are pure Ray generosity. To Scranton, "words... like wrenches" directly links the bolts' kindness to the cruelty as equally *his*. The "What he had left to give" line is the quiet accusation.
  3.  **"There’s a brass bell over the shop door... Still waiting for the next hand to pull the rope."**: Leaves the problem standing. The good Ray (symbolized by the bell) is remembered and present, but unreachable. It ends on unresolved potential/hope/loss, avoiding tidy resolution or blaming the disease. Concrete object carrying the emotional weight of the unresolved past.
