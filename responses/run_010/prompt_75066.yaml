prompt: |-
  I'm on a working group for a city charter commission that's about to bolt a binding citizen-initiated measure process onto a local government of about 400,000 people — basically the California initiative transplanted somewhere it has no business being — and before we wade into the literature on whether referendums are a good idea at all, I want the spec. Write out the desiderata: what any adequate account of *when a referendum produces a legitimate, action-authorizing collective decision* has to deliver. Not arguments for or against direct democracy. The requirements list.

  For each item, give me the case that motivates it, one or two lines is plenty — I want to be able to point at something real in a meeting and say "any account that can't handle this is out." Cases I'd expect to see, though you should add ones I've missed: the UK's 2016 vote (52-48, one binary question, nothing on the ballot about what leaving actually meant, then four years of arguing about what had been authorized); California's Prop 13 and the way an initiative can install a fiscal straightjacket the legislature can't undo without going back to the voters; the Swiss setup — double majority of people and cantons, initiatives that can only amend the constitution, the parliamentary counter-proposal with its tie-breaker question, and the 2009 minaret vote which raised whether there's content a popular initiative is simply not allowed to have; the Irish habit of running a question through a citizens' assembly or convention first, as with 2015 and 2018; Australia 1999, where plenty of people who wanted a republic voted no because of how the model on the ballot got chosen, so the wording problem and the mandate problem turned out to be the same problem; the Italian turnout quorum, which turns staying home into a campaign strategy; the Scottish 2014 franchise fight over 16-year-olds and who was left off the roll.

  Some of these we allready have shorthand for, feel free to use it: **mandate specificity** (how much detail does a Yes vote license the winners to go implement), **reversal asymmetry** (whether undoing a measure is harder than passing one, and whether that's a bug or a feature), and what I've been calling **the twenty-six percent problem** — a measure that carries with 52% of a 50% turnout is the choice of 26% of the electorate, and I want to know whether that's a genuine defect in the account or just a cost we accept everywhere else in democracy too.

  Also tell me which distinctions a theory is not allowed to collapse: legitimacy of the process versus wisdom of the outcome, procedural versus epistemic legitimacy, authorization versus instruction, advisory versus binding, "the people" versus "those who showed up," a one-off decision versus a standing rule. If a view slides between two of these mid-argument, that's a failure of the desiderata, not a rhetorical quirk.

  Then the part I actually want: which of these are non-negotiable for anything that deserves the name, and which are the settled preferences of one camp dressed up as requirements. My suspicion is that a lot of the standard complaints — too emotional, question too vague to authorize anything, voters too ignorant of the details — are doing work for people who allready think legislatures should be sovereign, and I'd like that flagged rather than smuggled in as a requirement. And say plainly whether some subset is jointly unsatisfiable. I have a feeling that popular control, a deliberated and informed outcome, decisiveness/finality, protection of the losing minority, and revisability can't all be had at once, and if that's right then the list is itself the result and our commission should stop pretending we can write rules that satisfy everybody.

  Finally: which single desideratum does the most work knocking out existing positions — the one that, granted, collapses most of the field. And then briefly, five or six lines total, how three camps score: the plebiscitary view (a majority vote is self-validating, full stop), the epistemic view (legitimate insofar as it tracks the right answer, jury-theorem flavoured), and the constitutionalist view (referendums are at best advisory or a veto, never a way to make new law). Keep the scorecard short, the criteria are the deliverable.

  No reading list or citations please, we've got more of those than we can use. Numbered list or table, whatever makes the requirements easy to argue about.
reasoning: |-
  Okay, let me unpack this user's request. They're part of a city charter commission designing a citizen initiative process for a 400k-population city, and they need a rigorous framework to evaluate referendum legitimacy - not arguments for/against direct democracy, but the essential criteria any system must satisfy. 

  The user explicitly wants real-world cases as justification for each requirement, listing examples like Brexit (vague mandate), Prop 13 (reversal asymmetry), Swiss minaret ban (content limits), and others. They've already coined terms like "mandate specificity" and "twenty-six percent problem" - showing deep engagement with the practical dilemmas. 

  Key challenges they anticipate: distinguishing procedural legitimacy from outcome wisdom, avoiding conceptual slippage (e.g., between authorization vs instruction), and identifying which requirements are truly non-negotiable versus ideological preferences in disguise. Their suspicion that some common criticisms ("voters are ignorant") mask legislative supremacy biases is perceptive - I'll need to flag that clearly.

  The core tension they note feels unavoidable: popular control, informed deliberation, finality, minority protection, and revisability likely can't all be fully achieved simultaneously. This means the requirements list itself becomes the tool for transparent tradeoff discussions. 

  For the scoring section, I'll contrast three main camps: plebiscitary (majority=legitimacy), epistemic (correctness-focused), and constitutionalist (referendums as advisory only). The knockout criterion will probably be "mandate specificity" since it exposes how most real-world votes authorize implementation without clear instructions.

  Structurally, I'll use a numbered list for the 12 requirements with cases, then separate the non-negotiables vs contested items, followed by tradeoff notes and the knockout analysis. The tone should stay clinical - this is for bureaucratic debate fuel.
answer: |-
  Here's the requirements list for legitimate referendum authorization, derived from historical cases and conceptual distinctions. Non-negotiable items are marked (**★**).

  ### Core Desiderata (What Any Account Must Deliver)
  1.  **Clear Authorization Scope (Mandate Specificity)**: Must define what policy space a "Yes" vote licenses implementation within.  
      *Case:* Brexit 2016 (52% "Leave" authorized no specific withdrawal model, leading to years of contested interpretation).  
      *Distinction Not to Collapse:* Authorization (to act within bounds) vs. Instruction (precise roadmap).

  2.  **Threshold Robustness**: Must justify the vote threshold (simple majority, supermajority) and its implications for legitimacy.  
      *Case:* Brexit 52-48 vs. Scottish IndyRef 55-45 – same margin, different perceived legitimacy due to context/expectations.  
      *Distinction:* Legitimacy of the process vs. perceived wisdom of the outcome.

  3.  **Electorate Definition & Franchise Integrity**: Must define "the people" authorizing the decision and ensure a fair, accessible roll.  
      *Case:* Scottish 2014 (franchise extended to 16-yr-olds, excluded non-resident Scots – contested definitions of the demos).

  4.  **Question Clarity & Single-Subject Rule**: Must ensure the ballot question is unambiguous, avoids "logrolling," and presents a coherent choice.  
      *Case:* California initiatives bundling spending caps with tax cuts (Prop 13's complexity); vague Brexit question. Failure invites post-vote manipulation.

  5.  **Reversibility Parity**: Must address whether reversing a referendum decision requires materially greater effort than passing it and justify any asymmetry.  
      *Case:* California Prop 13 (super-supermajority required for legislative tax increases, creating a near-irreversible fiscal straitjacket).  
      *Distinction:* A one-off decision (e.g., Brexit) vs. a standing rule (e.g., Prop 13).

  6.  **Procedural Fairness & Equality**: Must ensure balanced access to information, funding, campaign opportunities, and protection from coercion.  
      *Case:* UK 2016 (misinformation, spending violations, differential media access). **★**

  7.  **Protection of Fundamental Rights/Minority Safeguards**: Must define limits on what can be decided via referendum, particularly regarding core rights of minorities.  
      *Case:* Swiss minaret ban 2009 (popular initiative restricting religious freedom; courts later partially invalidated). **★**  
      *Distinction:* Procedural legitimacy (was it a fair vote?) vs. Constitutional legitimacy (is the outcome permissible?).

  8.  **Informed Deliberation Requirement**: Must establish minimal conditions for reasoned public consideration, not just raw campaigning.  
      *Case:* Australia 1999 (republic model chosen by elites without broad deliberation, leading pro-republic voters to reject it).  
      *Caution:* Avoids collapsing into "voters must be experts" – focus on process enabling deliberation, not individual competence.

  9.  **Turnout Significance**: Must account for the meaning and legitimacy of low turnout or quorum rules.  
      *Case:* Italian turnout quorums (staying home becomes a winning "No" strategy, undermining representativeness).  
      *Problem:* The 26% Problem – is a bare majority of low turnout legitimate? Distinguish "the people" vs. "those who showed up".

  10. **Implementation Accountability**: Must link authorization to a defined implementation path with accountability mechanisms.  
      *Case:* Brexit (Vague mandate allowed government interpretation without clear voter recourse). **★**

  11. **Finality vs. Revisability Balance**: Must reconcile the need for decisive action with the possibility of future correction based on new circumstances or learning.  
      *Case:* Prop 13 (extreme finality) vs. frequent Swiss referendums (built-in revisability). *Inherent Tension* with Minority Safeguards and Reversibility Parity.

  12. **Distinction of Function**: Must clarify whether the referendum is *binding* (creates law/policy) or *advisory* (informs representatives) and justify the choice. **★**  
      *Case:* UK AV referendum 2011 (binding) vs. many local advisory votes. *Collapsing this distinction invalidates the process's claimed authority.*

  ### Non-Negotiables vs. Contested Preferences
  *   **Non-Negotiable (★★★)**:
      *   **7. Protection of Fundamental Rights/Minority Safeguards** (Cannot legitimize tyranny of the majority).
      *   **6. Procedural Fairness & Equality** (Unfair process cannot yield legitimate authority).
      *   **10. Implementation Accountability** (Authorization without a defined path is illusory).
      *   **12. Distinction of Function (Binding vs. Advisory)** (Fundamental to the claim of authority).
      *   **1. Clear Authorization Scope** (Vague mandates create governance crises).
  *   **Often Contested/Smuggled Preferences**:
      *   **High Voter Competence Requirement** ("Voters too ignorant" often masks legislative supremacy preference. Desideratum 8 focuses on *process for deliberation*, not individual competence).
      *   **Super-Supermajority Thresholds** (Often favored by status-quo defenders under guise of "stability" or "broad consensus," but can create severe reversal asymmetry).
      *   **Turnout Quorums** (Often intended to boost legitimacy but weaponized strategically - Italian case).
      *   **Epistemic Demands** (Requiring outcomes to be "correct" or "wise" conflates procedural legitimacy with outcome quality – see Brexit vs. Irish Citizens' Assembly referendums).

  ### Inherent Tensions & Tradeoffs
  *   **Popular Control + Decisiveness** conflict with **Minority Protection + Revisability** (e.g., Prop 13 maximizes popular control/decisiveness but destroys minority protection/revisability).
  *   **Informed Deliberation** (requiring time/process) conflicts with **Popular Responsiveness/Finality**.
  *   **Clear Authorization Scope** (specificity) can conflict with **Implementability/Adaptability** (needing flexibility).
  *   **The 26% Problem** highlights a core tension: Representativeness vs. Decisiveness. *There is no perfect solution; the threshold and process must be justified transparently.*

  ### The Knockout Desideratum: Mandate Specificity (1)
  *   **Why:** Most real-world failures stem from vague questions lacking clear authorization scope (Brexit, many CA initiatives). Views ignoring this collapse into plebiscitary legitimacy ("majority wins, interpret freely") or enable post-vote elite capture. Both procedural fairness (6) and implementation accountability (10) depend on it. It forces confrontation with the "authorization vs. instruction" distinction.

  ### Camp Scorecard (vs. Desiderata)
  1.  **Plebiscitary View ("Majority Wins"):**  
      *Fails:* 1 (Scope), 7 (Rights), 8 (Deliberation), 10 (Accountability). *Scores:* Low on safeguards, deliberation, accountability. High on decisiveness/simplicity.
  2.  **Epistemic View ("Tracks Truth"):**  
      *Fails:* 2 (Threshold justification often arbitrary), 3/9 (Ignores "who voted" if answer is "correct"), *Collapses:* Legitimacy into outcome wisdom (confounds procedural & epistemic). Scores high on 8 (if process ensures competence), low on defining the demos.
  3.  **Constitutionalist View ("Advisory Only/Strong Veto"):**  
      *Fails:* 12 (If binding referendums exist, this view rejects their legitimacy by definition), 10 (Sees no need for implementation path beyond legislative action). *Scores:* High on 7 (Rights), 11 (Revisability via legislature), low on popular control/authorization.
