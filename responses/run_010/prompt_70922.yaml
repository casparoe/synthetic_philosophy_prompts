prompt: |-
  For like fifteen years now I've been reading the rationalist blogs — LW, the sequences, SSC, the forecasting forums — and three years ago I finally built the thing I kept wishing existed: a public register of open questions and known unknowns. People submit entries, we list them, researchers and forecasters mine the list for projects. It's gone okay but the intake side is a mess and I think I've found out why.

  We get about forty submissions a month. Six volunteers screen them, none with any philosophy background (one's a nurse, two are undergrads, one does infosec). Ten minutes per submission is the budget, and I sign off on anything they escalate. Entries are public, permanent, and indexed by search engines — we dont quietly retract, because a register you can edit after the fact isn't a register.

  Here's the problem. Our intake form has a checkbox that says, roughly, that the submitter takes their entry to be in principle knowable by someone — the idea being that if it isn't knowable its not an open question, it's just noise. Then I went and reread about Fitch's paradox of knowability, the result that apparently came out of an anonymous referee report in the 40s (Church, they found out later) and got published by Fitch in the 60s: if every truth is knowable then every truth is already known, because the particular claim "p is true and nobody knows p" can't be known by anyone without thereby going false. Which means our checkbox is doing something much weirder than I thought, and the exact class of entries I find most interesting — the ones about what nobody knows — might be the unhostable class.

  So: write me a screening procedure my volunteers can actually run. Questions in order, what counts as a sufficient answer to each, the exits (reject / rewrite and resubmit / accept / escalate to me), and which steps are judgment calls wearing a procedure costume — say so out loud instead of dressing them up.

  It has to do these things:

  - Sort "nobody knows this" into the kinds that are genuinely different: ordinary unknowns; unknowns that are contingently out of reach (records burned, private states of people who are dead); unknowns that are Fitch-style, where knowing the entry would falsify it; and unknowns that get destroyed by being published (the dual-use security case). Plain-English tests for each, no modal logic — these people have never seen a diamond operator and shouldn't have to.
  - Tell me what to do with the checkbox: keep, kill, or rewrite into something actually true. And tell me whether every accepted entry has to be indexed to a date and to a named community of knowers, because I suspect "nobody" is doing a lot of unearned work.
  - Say which premises of the Fitch argument are load-bearing for whatever you land on, which distinctions absolutely have to survive the compression into a ten-minute checklist, and which ones I can throw away without the procedure quietly becoming something else.
  - Say where the analogy breaks. Fitch is about truth and knowability, not about publishing lists, and I don't want a procedure that smuggles in a philosophical result it hasn't earned.

  Then run it on three submissions:

  1. Infosec person: there's a memory-safety bug in a widely deployed open-source library, nobody outside the vendor knows, and no attacker has found it yet.
  2. Grad student: nobody currently knows whether the headline effect in a well-known failed replication was real or an artifact of the original analysis pipeline.
  3. Mine, which I've been sitting on for a year because I knew it was trouble: there is at least one true claim about the causes of the 2008 crisis that no living person knows and that no surviving record could ever support.

  On 3 be blunt. I expect the procedure to make me throw out my favorite entry, and if it does I want the reasoning, not a cushion.

  Finish with what the procedure can't do: the false positives it'll generate, the entries it'll wrongly wave through, and the cases where a volunteer genuinely can't tell and I have to be the one who decides.
reasoning: |-
  We are designing a screening procedure for a public register of open questions and known unknowns. The key challenge is to handle the implications of Fitch's paradox of knowability, which shows that if every truth is knowable, then every truth is known. This affects how we categorize entries that claim "nobody knows this."

  The procedure must:
  1. Categorize "nobody knows this" claims into four types: ordinary unknowns, contingently out of reach, Fitch-style (knowing it would falsify it), and dual-use (destroyed by publishing).
  2. Decide the fate of the checkbox that requires the entry to be knowable in principle.
  3. Identify the load-bearing premises of Fitch's argument that must be preserved and which can be discarded.
  4. Run the procedure on three example submissions.

  We note that the volunteers are not trained in philosophy and have limited time (10 minutes per submission). The procedure must be in plain English without modal logic.

  ---

  **Step 0: Understand the Checkbox and Fitch's Paradox**

  The current checkbox says: "the submitter takes their entry to be in principle knowable by someone."

  Fitch's paradox shows that if we assume that every truth is knowable (i.e., for every true proposition p, it is possible that someone knows p), then it follows that every truth is actually known. This is because the proposition "p is true and nobody knows p" (call this q) cannot be known without contradiction. If q were known, then p would be known (so "nobody knows p" would be false), making q false. Therefore, if q is true, it cannot be known. But if we assume that every truth is knowable, then q must be knowable, which leads to a contradiction unless there are no such q. Hence, every truth must be known.

  In our context, the checkbox is intended to filter out entries that are not knowable in principle. However, Fitch shows that the very notion of an unknown truth (like the ones we want to list) might be unknowable, which would make them ineligible by the checkbox. This is the tension.

  We must decide whether to keep the checkbox and, if so, how to interpret it in light of Fitch.

  ---

  **Proposed Solution for the Checkbox:**

  We can keep the checkbox but reinterpret it to mean that the entry is about a question that is, in principle, answerable (i.e., it is possible to come to know the answer) and that the answer is not ruled out by the very act of knowing it (i.e., non-Fitch-style). However, we also want to include Fitch-style unknowns as a category. Therefore, we split the intake:

  - We will have two parts for unknowns: one for ordinary unknowns (which are knowable without changing the truth value) and one for Fitch-style unknowns (which would be falsified by being known). But note: Fitch-style unknowns are, by definition, unknowable. So if we keep the checkbox, we cannot include Fitch-style entries because they are not knowable.

  Alternatively, we can kill the checkbox and replace it with a set of questions that classify the type of unknown. Then we can accept both knowable and unknowable unknowns, but with different categories.

  Given the goals, I propose:

  **Kill the checkbox.** Replace it with a set of questions that classify the unknown. We will then have categories that include both knowable and unknowable unknowns, but we will label them appropriately.

  Why? Because the checkbox as currently understood would exclude Fitch-style entries (which we want to include) and also because the notion of "knowable in principle" is too vague and philosophically loaded.

  Instead, we will ask:

  **New Intake Questions for Classification:**

  1. **Is the entry about something that is currently unknown?** (If not, reject as not an unknown.)

  2. **Could the answer to this entry be known without changing the truth of the entry?** 
     - If yes, then it's an ordinary unknown or contingently out of reach (we'll distinguish in the next question).
     - If no, then it is a Fitch-style unknown (because knowing it would change the truth).

  3. **If the answer is knowable without changing the truth (from question 2):**
     - **Is it possible, given the current state of the world and available evidence, to come to know the answer?** 
       - If yes, then it's an ordinary unknown (we can know it in principle, and we just don't know it yet).
       - If no, then it's contingently out of reach (e.g., records burned, dead people).

  4. **Could publishing this entry make it impossible to ever know the answer?** 
     - This is for dual-use cases. If publishing the entry might destroy the possibility of knowing (e.g., by tipping off attackers, causing destruction, or changing behavior so the answer becomes inaccessible), then it's dual-use.

  Additionally, we must address the issue of "nobody" being relative. Therefore:

  5. **Who is the community of knowers?** We require the submitter to specify the community (e.g., "nobody in the public", "no living person", "no one at all"). We then index the entry by the community and the date.

  ---

  **Load-bearing Premises of Fitch's Argument:**

  We must preserve:
  - The distinction between knowing a proposition and the proposition being true. (Knowing p entails p is true, but p can be true without being known.)
  - The idea that some propositions are about knowledge (like "p and no one knows p") and that knowing such a proposition requires knowing both conjuncts, which may lead to a contradiction.

  We can discard:
  - The universal quantifier over all truths (we are only concerned with specific unknowns).
  - The modal logic framework (we are dealing with practical knowability in the actual world, not in all possible worlds).

  However, note that our procedure is not trying to resolve Fitch's paradox but to classify entries in a way that is useful for researchers and forecasters. We are using the insight from Fitch to identify a category of unknowns that would be falsified by being known.

  ---

  **The Screening Procedure:**

  We design a flowchart of questions for the volunteers. Each question must have clear criteria for the answer and an exit path.

  **Step 1: Preliminary Check**
  - **Question:** Does the entry clearly state a specific question or unknown? (Not vague, not a statement of fact, not a known fact.)
    - If no: **Reject** (or **Rewrite and Resubmit** if the issue is clarity and the idea seems salvageable).
    - If yes: Proceed to Step 2.

  **Step 2: Check for Known Answers**
  - **Question:** Is there strong evidence that the answer is already known by someone in the specified community? (The submitter must specify the community: e.g., "nobody in the public" vs. "nobody at all".)
    - If yes: **Reject** (unless the submitter can adjust the community to one where it is unknown, then **Rewrite and Resubmit**).
    - If no: Proceed to Step 3.

  **Step 3: Knowability Without Changing Truth (Fitch-Style Check)**
  - **Question:** Consider the entry as a proposition. If someone were to come to know the proposition exactly as stated, would that act of knowing make the proposition false? 
    - *Explanation for volunteers:* For example, if the entry says "Nobody knows X", then if someone comes to know that "Nobody knows X", then now someone (that person) knows X? Not exactly. Let's break it down:
      - The proposition is: "X is true and nobody knows X". If someone knows that proposition, then they know X (because they know the first part) and they know that nobody knows X (the second part). But then, because they know X, the second part "nobody knows X" becomes false. So the proposition becomes false. Therefore, knowing the proposition makes it false.
    - **Criteria:** If the proposition is of the form "P is true and nobody knows P" (or similar self-referential knowledge claims), then knowing it would make it false. Also, if the proposition is about the current state of knowledge (like "this secret is unknown") and knowing it would change that state, then it would make it false.
    - If yes (knowing it would make it false): **Categorize as Fitch-style** and proceed to Step 5 (dual-use check) because Fitch-style entries are unknowable in principle, but they are still valid unknowns to list.
    - If no: Proceed to Step 4.

  **Step 4: Contingent Knowability**
  - **Question:** Given the current state of the world (and the specified community), is it possible to come to know the answer? (Consider evidence: are records destroyed? is it about a private state of a dead person? etc.)
    - If yes: **Categorize as ordinary unknown**.
    - If no: **Categorize as contingently out of reach**.
    - Then proceed to Step 5.

  **Step 5: Dual-Use Check**
  - **Question:** Could publishing this entry in the register make it impossible to ever know the answer? (e.g., by alerting attackers, causing destruction, changing behavior)
    - If yes: **Categorize as dual-use** and **Escalate to me** (because dual-use might have security implications and require a judgment call on whether to publish).
    - If no: Proceed to acceptance.

  **Step 6: Final Acceptance**
  - **Accept** the entry, and record:
    - The category (ordinary, contingent, Fitch-style, dual-use)
    - The community of knowers (as specified by the submitter)
    - The date

  **Judgment Calls:**
  - Step 3 (Fitch-style check) is a judgment call but we provide clear examples and a test: "If knowing the entry would make it false, then it's Fitch-style."
  - Step 4 (contingent knowability) is a judgment call: volunteers must assess if it's possible to know given current constraints. We give guidelines: if evidence is destroyed or the subject is dead and no records exist, then it's contingent. Otherwise, it's ordinary.
  - Step 5 (dual-use) is a judgment call and if there's any doubt, escalate.

  ---

  **Running the Examples:**

  **Example 1: Infosec person**
  - Entry: "There's a memory-safety bug in a widely deployed open-source library, nobody outside the vendor knows, and no attacker has found it yet."

  Step 1: Clear and specific? Yes.
  Step 2: Community: "nobody outside the vendor". Is it known? By the vendor, but the entry says "nobody outside the vendor knows", so the community is "outside the vendor". It's unknown in that community. Proceed.
  Step 3: Fitch-style check: The proposition is: "There is a bug and nobody outside the vendor knows about it". If someone outside the vendor were to know this, then they would know about the bug, so the second part "nobody outside the vendor knows" becomes false. Therefore, knowing the entry would falsify it. **Categorize as Fitch-style.**
  Step 5: Dual-use: Publishing this could alert attackers to the existence of the bug, which might lead to exploits. So yes, dual-use. **Escalate to me** (because publishing might be harmful).

