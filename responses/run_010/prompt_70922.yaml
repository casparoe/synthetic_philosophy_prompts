  Step 2: Community: probably the scientific community (or "currently" meaning now). We assume it's unknown. Proceed.
  Step 3: Fitch-style: The proposition is: "It is unknown (by the relevant community) whether the effect is real or an artifact." If someone were to know the answer (i.e., come to know whether it is real or an artifact), then the proposition "nobody knows" becomes false. However, note: the entry is about the state of knowledge, but the act of knowing the answer does not directly make the proposition false? Let me clarify:

