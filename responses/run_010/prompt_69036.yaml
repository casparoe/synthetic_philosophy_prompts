prompt: |-
  Here are my gut verdicts on big-value/tiny-probability cases, and I want to know what principle, if any, they add up to. I know there's a whole literature on whether tiny probabilities of enormous outcomes should dominate, but I want to work from my own verdicts rather than the labels.

  1. The St. Petersburg game, with the payout verified as genuinely unbounded: I'd pay about $20, no more. And I don't think the fix is "no casino has that much cash" — I'd pay the same $20 to an honest god.
  2. A machine that three independent labs certify will, on a button press, produce a 1-in-10^20 chance of 10^30 flourishing lives and otherwise cost you $1: push it. Obviously.
  3. The mirror machine: 1-in-10^20 chance of 10^30 people dying horribly, otherwise you get $1. Also push it — that risk is just noise.
  4. A government spends its entire public health budget on a 1-in-10^9 shot at a technology that would end all disease: wrong. And not just because I distrust the number — stipulate its exactly right.
  5. A lab that runs a dangerous pathogen project because the small chance of a vaccine breakthrough outweighs the small chance of an escaped pandemic: also wrong, even though the arithmetic has the same shape as 3.
  6. The person who gives away everything for a longshot utopia looks like a fool to me; the person who accepts some small risk of catastrophe in order to keep normal life going looks sane.
  7. Being clueless about the far-reaching effects of my actions doesn't license doing nothing.

  Is there one account of how probability and value interact that gets all of these, or nearly all? I most want you on 2/3 versus 4/5 — same shape, different verdicts, and I can't tell whether that's a real distinction or just me flinching. State the principle precisely enough that it makes a prediction for a case I didn't list: a lab arguing that continuing to train a model carries maybe a 1-in-1000 chance of transformative benefit and maybe a 1-in-1000 chance of catastrophic loss, which of those should drive the decision, and does your account say anything different from "compare them"? And be straight with me about which of my verdicts it forces me to drop. Please answer in American English.
reasoning: |-
  Okay, let me tackle this user's problem. They've listed several intuitions about decisions involving tiny probabilities and huge payoffs or losses. The core challenge is reconciling cases 2/3 (where they accept the tiny risks) with 4/5 (where they reject similar probabilistic trade-offs). 

  First, I need to identify the common thread. The user seems comfortable with negligible risks when the downside is personal (like losing $1) but objects when the downside involves systemic catastrophe or diverting essential resources. That suggests a distinction between personal stakes and collective/existential stakes.

  For cases 2 and 3, the cost of failure is trivial ($1) and the upside/downside affects hypothetical lives. But cases 4 and 5 involve real-world trade-offs: wasting public health funds or risking actual pandemics. The key difference appears to be the nature of the downside - abstract vs concrete, personal vs societal.

  The St. Petersburg paradox ($20 cap) hints at probability weighting - humans discount extremely remote chances. But that alone doesn't explain 4/5 rejection. Here, the disastrous outcomes aren't just improbable; they're existentially threatening or resource-draining in ways that violate precautionary principles.

  When testing this against their lab scenario (1/1000 transformative vs catastrophic risk), the answer should depend on asymmetry: catastrophic losses often have irreversible, unbounded damage (like extinction) while gains rarely compensate for that level of risk. So the catastrophic tail risk should dominate unless probabilities are orders of magnitude apart.

  The user might need to slightly adjust verdict 2 - if those "flourishing lives" came at the cost of diverting real resources from actual people, their principle would likely reject it too. But since it's framed as a free $1 gamble, the intuition holds.
answer: |-
  Based on your gut verdicts, I'd propose this principle: **Negligible probabilities only dominate when the downside risk is bounded, personal, and non-existential, while the upside must avoid opportunity costs that threaten essential systems.** Here's how it breaks down:

  ### The Core Principle
  1. **Downside Constraints:**  
     - Catastrophic/irreversible downsides (existential risk, systemic collapse, essential resource diversion) **cannot** be outweighed by tiny-probability upsides, no matter how large the theoretical gain.  
     - Small, bounded, or personal downsides (e.g., losing $1) **can** be ignored for tiny-probability gains.  

  2. **Upside Constraints:**  
     - Gains must be "pure upside" (no resource diversion). If achieving them requires sacrificing critical *certain* benefits (e.g., public health budgets), they're rejected.  
     - Gains involving abstract/hypothetical value (e.g., "flourishing lives" in a vacuum) get weighted less than preventing concrete, imminent catastrophe.  

  3. **Probability Floor:**  
     - Below some threshold (e.g., 1/10⁹ for real-world decisions), probabilities are treated as *effectively zero* unless the downside is trivial.  

  ---

  ### How It Explains Your Verdicts
  | Case | Verdict | Why It Fits |
  |------|---------|-------------|
  | **1. St. Petersburg** | Pay ~$20 | Unbounded upside, but **personal bounded loss** ($20). No systemic risk. |
  | **2. Flourishing Lives Machine** | Push | **Trivial downside** ($1), hypothetical upside. No real-world tradeoffs. |
  | **3. Death Machine** | Push | **Trivial downside** ($1). Probability too low to care; not diverting resources. |
  | **4. Public Health Bet** | Reject | **Sacrifices essential certain benefits** (current healthcare) for a lottery ticket. Systemic risk of defunding real needs. |
  | **5. Pathogen Lab** | Reject | **Irreversible, existential downside** (pandemic). Upside doesn't justify unbounded catastrophe risk. |
  | **6. Longshot Utopia** | Reject | **Sacrifices essential present needs**. Violates downside constraint. |
  | **7. Cluelessness** | Act | Avoiding action has **its own unbounded downside** (paralysis). |

  ### Why 2/3 vs. 4/5 Feels Different
  - **Cases 2/3:** Downsides are **personally bounded** ($1 loss) and **non-existential**. You're not *stealing* from a public good.  
  - **Cases 4/5:** Downsides are **systemic** (defunding healthcare, causing pandemics). The upside requires **diverting essential resources** or risking **irreversible harm**.  

  It’s not probability flinching—it’s about **downside quality**. A 0.0001% chance of killing 10³⁰ people *in a vacuum* is noise. That same chance *in a real system* (e.g., a lab) is reckless because the downside manifests in a concrete, catastrophic way.  

  ---

  ### Your Lab Scenario: Transformative AI Risk
  > *"1-in-1000 chance of transformative benefit vs. 1-in-1000 chance of catastrophic loss."*  

  **Your principle’s prediction:** **The catastrophic loss should dominate.**  
  - **Why?** The upside ("transformative benefit") likely requires massive resource investment and risks an unbounded, irreversible downside (e.g., human extinction).  
  - This isn’t "compare them" arithmetic. The catastrophic tail risk **trumps** symmetric odds because:  
    - Existential downsides can’t be compensated by any gain (you can’t "spend" utopia if you’re dead).  
    - Real-world decisions involve **opportunity costs** (e.g., diverting safety resources).  

  ---

  ### Verdicts You’d Need to Drop
  - **None**—if you accept two nuances:  
    1. **Case 2 isn’t free:** If pushing the "flourishing lives" button *diverted $1 billion from vaccines*, you’d reject it. Your verdict assumes no hidden cost.  
    2. **Probability floors are contextual:** 1/10²⁰ is "noise" for $1 losses, but 1/10⁹ isn’t negligible when betting a public health budget.  

  ---

  ### The Big Picture
  Your intuitions align with **pragmatic catastrophism**:  
  - Tiny probabilities matter *only* when downsides are containable.  
  - For existential risks or critical resources, **precaution dominates**—even if expected-value calculations "look" symmetric.  
  - This isn’t inconsistent—it’s a recognition that **some losses liquefy the foundation of value itself**.  

  If this clicks, your flinch in 4/5 isn’t irrational; it’s a deeper ethical constraint: **Never gamble systems essential for survival on a longshot.**
