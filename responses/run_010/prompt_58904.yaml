  | (✖️, ✖️, ✖️, ✖️)       | Empty                                | Incoherent: No selection mechanism implies inert system. |  
  | (✖️, ✔️, ✖️, ✖️)       | Empty                                | Unfilled: No known system learns without a fixed base.    |  
  | (✖️, ✖️, ✔️, ✖️)       | Empty                                | Unfilled: Internal selection requires prior knowledge.   |  
  | (✖️, ✔️, ✔️, ✖️)       | Empty                                | Unfilled: No examples without GP or CA.                   |  
  | (✖️, ✖️, ✖️, ✔️)       | Empty                                | Incoherent: Using artifacts requires some fixed capacity. |  
  | (✖️, ✔️, ✖️, ✔️)       | Empty                                | Unfilled: No examples.                                    |  
  | (✖️, ✖️, ✔️, ✔️)       | Empty                                | Incoherent: Planning + artifacts need learning or genes. |  
  | (✖️, ✔️, ✔️, ✔️)       | Empty                                | Unfilled: No examples without Gene Pool.                  |  
  | (✔️, ✔️, ✖️, ✔️)       | Empty                                | Unfilled: Culture use typically co-occurs with planning. |  

  ---

  ### Awkward Commitments in Nonempty Profiles  
  - **Darwinian (✔️, ✖️, ✖️, ✖️)**: Fixed repertoire may stem from past learning (e.g., dementia), not genes.  
  - **Skinnerian (✔️, ✔️, ✖️, ✖️)**: May obscure internal selection if history is rich (e.g., octopus).  
  - **Unnamed (✔️, ✖️, ✔️, ✖️)**: Brittle without learning (e.g., chess engine cannot adapt).  
  - **Popperian (✔️, ✔️, ✔️, ✖️)**: May undercredit cultural influence (e.g., Otto isolated).  
  - **Gregorian (any, any, any, ✔️)**: Scaffolding may mask internal capabilities (e.g., language model).  

  ---

  ### Design Notes  
  - **Order of Questions**: The boundary choice (Q0) *must* be first. If moved, systems like Otto or the language model change profile (see table), proving the taxonomy is not a strict hierarchy but context-dependent.  
  - **Indistinguishable Cases**: Internal selection (Q3) and rich individual history (Q2) resist separation; planning may reduce to trained associations (e.g., octopus).  
  - **Engineered Systems**: Fixed repertoires (Q1) are counted regardless of origin (e.g., evolution or human design), but the selecting "gene pool" is bracketed as a mechanistic analog.  
  - **Limitations**: Dominant layer assignment uses Dennett’s hierarchy by default; non-canonical profiles lack names.  

