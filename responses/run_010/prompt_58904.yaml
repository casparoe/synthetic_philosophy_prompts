  | Octopus (learns to open jar)                 | Isolated      | (✔️, ✔️, ✖️?, ✖️)              | Individual History | Skinnerian     | IS? Unclear if planning occurs.        |  
  | Ten-month-old infant                         | Isolated      | (✔️, ✔️, ✖️, ✖️)               | Individual History | Skinnerian     | Limited planning at this age.          |  
