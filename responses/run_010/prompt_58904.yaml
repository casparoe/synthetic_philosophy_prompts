answer: |-
  ### Decision Tree for Classifying Cognitive Systems  
  Based on independent dimensions of *where selection happens*:  
  1. **Gene Pool**: Historical, multi-generational selection (e.g., evolution, genetic algorithms).  
  2. **Individual History**: Selection via lifetime rewards/punishments (e.g., operant conditioning).  
  3. **Internal Selection**: Selection via pre-action simulation (e.g., planning).  
  4. **Cultural Artifacts**: Selection via external tools/symbols from a community (e.g., language, notebooks).  

  **Boundary Choice (Q0)**: *Must be answered first.*  
  - **Question**: Are we classifying the system as an isolated entity, or including its immediate external scaffolding (tools, notes, other agents) as part of it?  
    - **Yes (Scaffolded)**: Include external supports.  
    - **No (Isolated)**: Exclude external supports; focus on core entity.  

  **Core Questions (Q1–Q4)**:  
  1. **Q1**: If the system were permanently prevented from being shaped by the consequences of its own behavior over its operational lifetime, would its behavioral repertoire collapse to a fixed, unchanging set?  
     - **Yes**: Gene Pool = ✔️  
     - **No**: Gene Pool = ✖️  

  2. **Q2**: Can the system’s behavior be modified by the consequences of its own actions during its operational lifetime (e.g., learning from success/failure without internal simulation)?  
     - **Yes**: Individual History = ✔️  
     - **No**: Individual History = ✖️  

  3. **Q3**: Does the system internally generate and evaluate multiple candidate actions (or plans) before acting, such that a bad candidate is discarded without being executed?  
     - **Yes**: Internal Selection = ✔️  
     - **No**: Internal Selection = ✖️  

  4. **Q4**: Does the system rely on external artifacts (e.g., tools, symbols, instructions) created by a community of minds (or itself in a prior state)?  
     - **Yes**: Cultural Artifacts = ✔️  
     - **No**: Cultural Artifacts = ✖️  

  **Profile & Labeling**:  
  - **Profile**: Record (Gene Pool, Individual History, Internal Selection, Cultural Artifacts) with ✔️/✖️.  
  - **Dominant Layer**: Assign based on which active layer (✔️) contributes most to adaptability:  
    - Cultural Artifacts > Internal Selection > Individual History > Gene Pool.  
      *(Note: This ordering reflects Dennett’s hierarchy but is contingent, not definitional.)*  
  - **Canonical Mapping**:  
    - (✔️, ✖️, ✖️, ✖️) → **Darwinian** (if dominant = Gene Pool).  
    - (✔️, ✔️, ✖️, ✖️) → **Skinnerian** (if dominant = Individual History).  
    - (✔️, ✔️, ✔️, ✖️) → **Popperian** (if dominant = Internal Selection).  
    - (any, any, any, ✔️) → **Gregorian** (if dominant = Cultural Artifacts).  
  - **Non-Canonical**: Profiles not matching above are unnamed.  

  ---

  ### Classification of Example Systems  
  *(✔️ = confident, ? = shaky)*  

