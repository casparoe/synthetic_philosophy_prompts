  | Chess engine (hand-written, brute-force)     | Isolated      | (✔️, ✖️, ✔️, ✖️)               | Internal Selection | *Unnamed*      | No IH; not Popperian (requires IH).    |  
  | Language model (frozen, with tools)          | Isolated      | (✔️, ✖️, ✖️, ✖️)               | Gene Pool      | Darwinian      | Fixed after training.                  |  
