      - D vs U: Against Alice D, D (9) > U (0); against Alice U, D (1) < U (8).  
      - D vs S: Against Alice D, D (9) > S (2); against Alice S, D (3) < S (4).  
      - U vs S: Against Alice D, U (0) < S (2); against Alice U, U (8) > S (5).  
  - Check for strict dominance by mixed strategies (for completeness, though only Bob S is dominated by mixed):  
    - Alice: No strategy strictly dominated by any mixture of the other two.  
      - D not dominated by U/S mixture: Against Bob D, D (3) vs min mixture (≈2.5) not strict; inequalities conflict (q > 0.5 and q < 1/6 impossible).  
      - Similarly for U and S (no dominating mixture exists).  
    - Bob: S strictly dominated by a mixture of D and U.  
      - Mixture: p = 0.3 (probability on D), 1-p = 0.7 (probability on U).  
      - Against Alice D: Mixture = 0.3*9 + 0.7*0 = 2.7 > Bob S (2)  
      - Against Alice U: Mixture = 0.3*1 + 0.7*8 = 5.9 > Bob S (5)  
      - Against Alice S: Mixture = 0.3*3 + 0.7*7 = 5.8 > Bob S (4)  
      - Thus, Bob S is strictly dominated by the mixture (p=0.3 D, 0.7 U).  
      - S not dominated by pure D or U: Against Alice D, S (2) > U (0); against Alice S, S (4) > D (3).  
  - Eliminate Bob S. Reduced game: 3x2 (Alice D,U,S vs Bob D,U).

  **Round 1: After eliminating Bob S**  
  | Alice \ Bob | D       | U       |
  |-------------|---------|---------|
  | **D**       | (3, 9) | (1, 0) |
  | **U**       | (6, 1) | (7, 8) |
  | **S**       | (2, 3) | (4, 7) |
  - Alice S strictly dominated by Alice U (pure-beats-pure):  
    - Against Bob D: S (2) < U (6)  
    - Against Bob U: S (4) < U (7)  
  - Eliminate Alice S. Reduced game: 2x2 (Alice D,U vs Bob D,U).

  **Round 2: After eliminating Alice S**  
  | Alice \ Bob | D       | U       |
  |-------------|---------|---------|
  | **D**       | (3, 9) | (1, 0) |
  | **U**       | (6, 1) | (7, 8) |
  - Alice U strictly dominates Alice D (pure-beats-pure):  
    - Against Bob D: U (6) > D (3)  
    - Against Bob U: U (7) > D (1)  
  - Eliminate Alice D. Reduced game: 1x2 (Alice U vs Bob D,U).

  **Round 3: After eliminating Alice D**  
  | Alice \ Bob | D       | U       |
  |-------------|---------|---------|
  | **U**       | (6, 1) | (7, 8) |
  - Bob U strictly dominates Bob D (pure-beats-pure):  
    - Against Alice U: U (8) > D (1)  
  - Eliminate Bob D. Only cell surviving: (Alice U, Bob U) = (7, 8).

  **Final Survivor and Nash Equilibrium**  
  - Surviving cell: (U, U) = (7, 8)  
  - Strict Nash equilibrium:  
    - Alice cannot deviate profitably: To D (against Bob U) = 1 < 7; to S (against Bob U) = 4 < 7.  
    - Bob cannot deviate profitably: To D (against Alice U) = 1 < 8; to S (against Alice U) = 5 < 8.  
  - Unique Nash equilibrium (pure or mixed):  
    - No other pure Nash: e.g., (D,D) not (Alice deviates to U); (U,S) not (Bob deviates to U).  
    - No mixed Nash: (U,U) strict and survives iterated dominance, so unique.

  **Key Feature Enabling Mixture Domination**  
  The dominated strategy (Bob S) has payoffs that are never the worst but are consistently mediocre—it loses to the mixture because the mixture capitalizes on the high payoffs of D and U in different scenarios (e.g., D excels when Alice plays D, U excels when Alice plays U). No single pure strategy can match this because S sometimes outperforms one pure strategy (e.g., S>U when Alice D) but underperforms against others. The mixture's strength comes from exploiting the variability in opponent play, which S cannot do. General pattern: A strategy vulnerable to mixed dominance often has "middling" payoffs that are not extreme but are uniformly worse than a mix leveraging context-dependent strengths.

  **Objection to Mixed Dominance and Rationality**  
  Objection: If players don't actually randomize, calling S irrational based on a mixture is flawed—randomization might not occur, so pure-strategy comparisons should suffice.  
  Response: The objection does not hold. Even if Bob never randomizes, S is strictly dominated by the mixture, meaning for every action Alice takes, S gives a lower payoff than the mixture. Thus, S is never a best response (some other strategy or mixture is better), so rational players avoid it. Rejecting mixed dominance means:  
  - Some games remain unsolvable by iterated pure dominance when they could be solved.  
  - Players might play strategies that are provably suboptimal.  
  The cost is inefficiency: Failing to eliminate S prevents the game from reducing to a clear outcome, as seen here. Rationality requires avoiding strategies that are never best responses, and mixed dominance identifies these.
