answer: |-
  ### Thought Experiment: Hospital Shift Handover Rhythm  

  **Scenario (199 words):**  
  Consider an NHS hospital ward with rotating nursing shifts. Handovers between day and night teams occur daily at 07:00 and 19:00. Over years, a stable pattern emerges: regardless of staff turnover, handovers consistently take 8 minutes (±1 minute), despite no rules specifying duration. Nurses arrive punctually, exchange concise verbal summaries (patient status, pending tasks), and depart promptly. Each nurse acts on ordinary motives: the outgoing nurse wishes to leave on time after a tiring shift; the incoming nurse aims to start efficiently but avoids prolonging discussion to preserve break time; both prioritise patient safety by covering essentials. No one coordinates timing—it’s not discussed in training or meetings. Yet the 8-minute rhythm persists even as individual nurses rotate, retire, or relocate. Two distinct individual-level realisations sustain this: (1) a cohort motivated by punctuality and fatigue-minimisation, or (2) a cohort emphasising professional efficiency and personal routine. The macro regularity remains identical.  

  ---

  ### Demonstration  

  **1. Explanandum:**  
  The stable 8-minute mean duration of shift handovers, resilient across personnel changes, unexplained by formal rules or aggregate motives.  

  **2. Individual-Level Causal Account (Complete):**  
  - *Outgoing nurse*: Reports key updates swiftly to leave promptly (motive: fatigue relief).  
  - *Incoming nurse*: Listens attentively but avoids tangential queries (motive: break preservation).  
  - *Shared constraint*: Mutual awareness that prolonging delays both parties; unspoken respect for colleague’s time.  
  - *Turnover effect*: New nurses observe peers’ behaviour and conform via imitation or social cueing (motive: social acclimatisation).  
  *No causal gaps: Each action derives from personal goals, situational awareness, and learned behaviour.*  

  **3. What the Macro-Level Account Adds:**  
  The *structural explanation*: The 8-minute equilibrium emerges from **temporal scarcity in overlapping shifts**. Handovers occupy a "bottleneck period" where both teams intersect under time pressure. This institutional constraint:  
  - (a) *Filters* individual actions: Only behaviours fitting the 8-minute window persist;  
  - (b) *Stabilises independently* of motives: Whether nurses prioritise fatigue or efficiency, the duration converges identically;  
  - (c) *Explains resilience*: Turnover replaces individuals but not the shift structure, making the rhythm self-reproducing.  
  *Loss in reduction*: The individual account lists *why* nurses act, but cannot derive *why 8 minutes*—not 5 or 15—without referencing the emergent temporal structure.  

  **4. Reduction Types Targeted:**  
  - *Ontological reduction*: Granted—no group mind; social facts supervene on individuals.  
  - *Causal/mechanistic reduction*: Granted—individual actions fully cause outcomes.  
  - ***Explanatory reduction***: **Defeated**—the macro account provides unique explanatory power: identifying structural constraints that bind diverse individual realisations into one stable pattern.  
  *Concession significance*: Conceding explanatory irreducibility is substantive—it challenges whether individualist explanations can *fully replace* social explanations in practice, even if they suffice in principle.  

  **5. Critical Feature:**  
  **Temporal scarcity in institutional scheduling**. Remove this (e.g., allow flexible handover times)—the pattern dissolves. Weaken it (e.g., reduce shift overlap pressure)—variability increases, weakening macro stability.  

  **6. Individualist’s Best Reply:**  
  *"The ‘structural constraint’ is just individuals’ shared beliefs about time scarcity plus their responsive actions. ‘8 minutes’ is shorthand for the statistical mode of their choices. Nothing non-individual is added."*  
  This is a **refusal to engage** the core question: It ignores *why identical patterns emerge from different motives* and why the *constraint’s causal role* isn’t reducible to beliefs. The reply conflates *description* of parts with *explanation* of system behaviour.  

  **7. Empirical Distinction?**  
  No decisive test—both predict the 8-minute outcome. **Residual disagreement** is *explanatory pragmatics*:  
  - The individualist sees the macro as a convenient summary.  
  - The holist sees it as capturing a causal constraint (temporal structure) that actively governs individual actions.  
  *Empirical agreement*: Both accept nurse motives and pattern stability. *Disagreement*: Whether "temporal scarcity" is an irreducible *explanans* or merely an *explanandum*.  

  ---

  ### Summary for Seminar Use  
  This case isolates **structural emergence**: institutional features (here, rigid scheduling) create constraints that causally shape individual actions *as a system*, yielding patterns irreducible *explanatorily*—though ontologically and causally reducible. It forces confrontation with whether social science *needs* non-reductive explanations when structural effects persist across micro-realisation changes. The hospital’s temporal bottleneck makes the irreducibility vivid without metaphysics—a concrete middle ground between Schelling and Durkheim.
