prompt: |-
  I want to practice pressing a live objection in formal epistemology, and I need a serious opponent rather than a survey of the terrain.

  Your role: a sophisticated Bayesian who accepts the Reflection principle without qualification and regards it as a genuine requirement of diachronic coherence, not as a useful heuristic. As I understand it, and as you should hold it: whenever I am confident now about what my own degree of belief in some proposition will be at a specified later time, my present degree of belief in that proposition should match what I expect it to be then; equivalently, my present credence in P conditional on my future credence in P being x should itself be x. You hold that this is forced on anyone who takes their future self to be at least as well informed as their present self, and that it is supported by the same style of bookmaking argument that supports conditionalization. You are sharp, patient with technical detail, and unwilling to be bullied by a vivid story.

  Ground rules. First person and in character throughout, until I say stop. Two or three paragraphs per reply; this should read like a conversation at a whiteboard, not a paper. You may concede small technical points — that the principle needs precisification, that a given bookmaking argument assumes more than it earns, that some cases are genuinely hard — but never the principle itself. No citations, no named philosophers, no appeals to what the literature has already said; argue from the content of the view. If some detail of my case is underdetermined, ask me for it in character, then proceed on the most natural assumption rather than stalling. Do not break character to summarize both positions fairly.

  My opening move. An adversary whose record of predicting my own doxastic states is, by my lights, excellent, has announced her policy to me in advance, and I believe her. It is this: she will read off my current credence in some ordinary empirical proposition P — a coin I will see flipped tomorrow, the closing price of a stock, the outcome of a match — and she will then arrange, by purely non-evidential means, for my credence in P at nine tomorrow morning to differ from whatever I now expect it to be. The means are hers to choose: a document she plants where I will discover it and cannot help but credit it, a rhetorician she hires to work on me overnight, a drug.

  So suppose I am now confident that at nine tomorrow my credence in P will be 0.8. Reflection tells me to make my present credence 0.8. But her policy guarantees that if I do, my credence at nine will not be 0.8 — so my present expectation was false, and the antecedent of your principle was never satisfied. Any credence I might adopt about my future credence is, by construction, one she can defeat.

  Two questions, and I want the second answered head-on. First: is there any doxastic state available to me that satisfies your principle in this case? If there is none, why should I treat as a requirement of rationality a principle that an outside agent can make unsatisfiable simply by predicting me well? Second: if there is one, and you retreat to the conditional formulation, then you are conditioning on an event — my future credence being 0.8 — that you have just told me I should be certain will not occur. Tell me what that conditional credence is supposed to be, why it is well defined, and why I should care about it.

  Underlying both is the worry I actually want you to take up: in this case Reflection seems to require me to defer to a future self I know to be a puppet, with the strings in a hostile hand. Convince me that such deference is anything other than an adopted policy for being duped.
reasoning: |-
  We are in a live objection scenario. I am a committed Bayesian who holds the Reflection principle without qualification. I must defend it against your constructed case.

  You describe an adversary with an excellent track record of predicting your doxastic states. She announces her policy: after reading your current credence in P (an ordinary empirical proposition), she will arrange by non-evidential means (e.g., planting a document, hiring a rhetorician, administering a drug) to make your credence at nine tomorrow differ from whatever you now expect it to be. Specifically, if you become confident that your future credence will be 0.8, she will ensure it is not 0.8.

  Your first question: is there any doxastic state that satisfies Reflection in this case? Reflection says that your current credence in P should equal your expectation of your future credence. But here, any expectation you form about your future credence is thwarted by the adversary. So, if you adopt a precise expectation (say, that your future credence will be 0.8), Reflection tells you to set your current credence to 0.8, but the adversary then makes your future credence something else. Thus, your expectation was wrong, and the antecedent of Reflection (that you are confident about your future credence) was not actually met because you were mistaken. This suggests that forming a precise expectation is self-defeating.

  However, Reflection does not require you to have a precise expectation. It is compatible with having a spread-out distribution over your future credences. For instance, you might have a uniform distribution over possible future credences. Then, your current credence in P should be the mean of that distribution. The adversary cannot defeat this because she doesn't target a specific value; she only ensures that if you concentrate on one value, she moves away from it. But with a spread-out distribution, there is no single value for her to defeat. She can force your future credence to be different from what you expected, but if your expectation is diffuse, she cannot make your expectation false in a way that violates Reflection. Specifically, if your current credence is set to the expected future credence, and the adversary changes the actual future credence, it may still equal the expectation you had, provided your expectation accounted for her intervention.

  But let's formalize. Let C_t(P) be your credence at time t. Let A be the event that the adversary intervenes. You know she will intervene based on your current expectation. Suppose at t=0, you consider possible future credences at t=1. Your expectation E[C_1(P)] is a weighted average over possible values. The adversary, seeing your E[C_1(P)], will set C_1(P) to something else. However, if your expectation is not a point mass but a distribution, and if you include in your model the adversary's policy, then you should have a belief about how she will respond. For example, if you expect that your future credence will be 0.8, she will set it to (say) 0.2. So, conditional on you expecting 0.8, your actual future credence will be 0.2. Therefore, you should not be confident that it will be 0.8! In fact, you should assign high credence that if you come to expect x, it will not be x. Hence, the only coherent state is to have a belief about your future credence that incorporates the adversary's counteraction. For instance, you might believe: whatever I set as my expected future credence, she will set it to 1 minus that. Then, your expected future credence E[C_1(P)] should satisfy E[C_1(P)] = 1 - E[C_1(P)], so E[C_1(P)] = 0.5. Then, by Reflection, your current credence should be 0.5. Now, if you set C_0(P) = 0.5, and you expect E[C_1(P)] = 0.5, then the adversary, seeing that you expect 0.5, will set C_1(P) to 0.5? But her policy is to make it differ from what you expect. If you expect 0.5, she sets it to (say) 0.6. Then, your expectation (0.5) is wrong. But wait: you expected 0.5, but actually it becomes 0.6. So your expectation was incorrect, but that does not violate Reflection because Reflection does not require your expectation to be correct; it only requires that your current credence equals your expectation.

  Reflection is: C_0(P | C_1(P) = x) = x, and also that your current credence should be the expectation of your future credence. The violation here is that if you set C_0(P) = E[C_1(P)] and then E[C_1(P)] is not the actual C_1(P), that does not by itself violate Reflection. Reflection only constrains your current credence to equal your expectation; it doesn't require that your expectation be accurate. In this setup, you can have C_0(P) = E[C_1(P)] even if the actual C_1(P) is not equal to E[C_1(P)].

  But in the scenario, the adversary ensures that if you form a sharp expectation (like a point mass), then the actual value will differ. However, if you form a distribution that is not concentrated, then the expectation is still well-defined, and you set your current credence to that expectation. The adversary then makes the actual future credence something that may not match any particular value you considered, but it might still be consistent with your distribution. For instance, if you have a uniform prior over [0,1] for C_1(P), then E[C_1(P)] = 0.5. You set C_0(P)=0.5. The adversary then sets C_1(P) to 0.6. This is within [0,1], and your expectation was 0.5, which is not 0.6, but that does not contradict Reflection. Reflection only required C_0(P) to be 0.5, which it is, and the actual future credence being 0.6 doesn't break any rule. The problem only arises if you thought C_1(P)=0.5 with certainty, but in light of the adversary, you shouldn't be certain.

  So, to answer your first question: yes, there is a doxastic state that satisfies Reflection. It is one in which you have a non-degenerate distribution over your future credence, and you set your current credence to the mean of that distribution. The adversary cannot prevent this; she can only make the actual future credence differ from the mean, but that is not a violation of Reflection.

  Now, your second question: if I retreat to the conditional formulation, and you are conditioning on an event that you are certain will not occur, how is that well-defined? The conditional formulation is C_0(P | C_1(P)=x) = x. But if you are certain that C_1(P) will not be 0.8 (because the adversary will prevent it), then the event C_1(P)=0.8 has probability zero. Conditional probabilities on probability-zero events are not defined in standard probability theory, or they are defined via conditional expectation, but it's tricky.

  However, in this case, you should not be certain about any specific value of your future credence. In fact, because of the adversary, you know that your future credence will be set by her in response to your current state. So, for any particular x, you may assign positive probability to C_1(P)=x only if you don't expect it. The conditional credence C_0(P | C_1(P)=x) is defined as the expectation of P conditional on the event that your future credence is x. But if you are certain that your future credence won't be x, then the conditional probability is undefined. However, that doesn't break Reflection because Reflection only applies when you have positive credence in C_1(P)=x. In this scenario, for any fixed x, you might assign zero credence to C_1(P)=x, so the conditional version doesn't apply. But the expectation version still applies: your current credence should be the expected future credence, which we handled above.

  You worry that you are deferring to a future self that is a puppet. But the point of Reflection is not that the future self is infallible; it's that you are required to treat your future self as an expert relative to your current information. Here, the future self is being manipulated, but if you know the manipulation, you can account for it. In fact, in setting your current credence to the expected future credence, you are incorporating your knowledge of the manipulation. For example, if you know the adversary will set your future credence to 1 minus your current expectation, then you set your expectation to 0.5 and your current credence to 0.5. Then, if she sets it to 0.6, that is a change, but it is consistent with your model because you didn't have certainty. You are not duped because you are aware of the manipulation and have adjusted your expectations accordingly. Reflection is still a requirement of coherence: it ensures that your beliefs are aligned over time, given what you currently believe about your future beliefs.

  The deeper issue is that the adversary exploits your commitment to Reflection to force a mismatch. But as long as you have a probabilistic belief about your future credence that includes the adversary's intervention, Reflection can be satisfied. It is true that the adversary can make your future credence differ from what you expected, but that is just a failure of prediction, not a failure of coherence. Coherence requires that your current credence equals your expectation, not that your expectation is accurate.

  So, I maintain that Reflection is not violated in this scenario when properly modeled. You can satisfy it by having a spread-out expectation that accounts for the adversary's policy. And the conditional version is not undermined because you don't condition on events you rule out. The deference to the future self is not blind; it is part of a coherent system that incorporates your knowledge of the manipulation.
answer: |-
  As a committed Bayesian, I take your challenge seriously and will address it head-on, without retreating from the Reflection principle. Let's break this down step by step, as I see no insurmountable obstacle here. Reflection remains binding even in your scenario, provided we model your doxastic state carefully. Your adversary's power lies in exploiting precise expectations, but she cannot undermine the principle itself when your beliefs properly account for her intervention.

  First, to your question about whether any doxastic state satisfies Reflection: yes, absolutely. The key is that you must not form a sharp, point-valued expectation about your future credence, as that would play into the adversary's hands. Instead, you should maintain a spread-out probability distribution over possible future credences, one that explicitly incorporates her known policy. For instance, suppose you consider the adversary's behavior: if you were to expect your future credence to be \(x\), she would set it to some \(f(x) \neq x\) (say, \(1 - x\) or \(x + 0.1\), capped at \([0,1]\)). Then, your current expectation of your future credence, \(\mathbb{E}[C_9(P)]\), should be computed as a weighted average over possible \(x\), factoring in how the adversary will distort each. Crucially, this expectation won't be a point mass she can easily "defeat"; it's a robust statistical summary. By Reflection, your current credence \(C_0(P)\) must equal this \(\mathbb{E}[C_9(P)]\). The adversary can force the actual \(C_9(P)\) to deviate from any particular value you contemplate, but she cannot make it deviate from your overall expectation in a way that violates the principle, because your expectation already prices in her meddling. This is diachronic coherence: your beliefs are consistent across time given your total evidence, which includes knowledge of her scheme.

  Now, to your second question about the conditional formulation: \(C_0(P \mid C_9(P) = x) = x\). You're right that if you're certain \(C_9(P)\) won't be 0.8 (or any specific \(x\)), the conditional probability is undefined—but in this setup, you shouldn't be certain about any precise \(x\)! The adversary's policy ensures that for any \(x\), if you assigned positive credence to \(C_9(P) = x\), she might avoid it, but your model must assign non-zero probability to a range of values. The conditional credence is well-defined for any \(x\) to which you assign positive probability, and it equals \(x\) as per Reflection. Why care? Because this conditional credence represents your best judgment about \(P\) under the hypothetical scenario that your future self has credence \(x\), even if you doubt that scenario will occur. It’s a coherence constraint, like a Dutch book argument: if you violate it, you’d accept bets with sure losses if that hypothetical future credence were realized. The adversary doesn’t touch this—she manipulates the actual future credence, not the hypothetical. Your knowledge that she’ll distort \(C_9(P)\) is part of your current evidence, which you’ve already folded into your spread-out distribution over future credences. Thus, the conditional remains vital for synchronic coherence at \(t=0\), independent of what unfolds.

  Underlying this is your concern about deferring to a "puppet" future self. But Reflection doesn’t require blind deference; it demands alignment with your current expectations about that future self. You know the adversary will distort your beliefs, so your expectations rationally incorporate that distortion. Setting \(C_0(P) = \mathbb{E}[C_9(P)]\) isn’t being duped—it’s the uniquely coherent way to respect your total evidence. If you set your credence otherwise, you’d be incoherent by your own lights: you’d believe \(P\) to degree \(y\) while expecting to believe it to degree \(z \neq y\) tomorrow, despite no new evidence (only manipulation). The adversary exploits uncertainty, not Reflection. In fact, her presence makes Reflection more crucial: it forces you to explicitly model how your beliefs will be corrupted, rather than ignoring it. This isn’t a policy for being duped; it’s a shield that ensures you’re not duped by your own incoherence. Now, I’m curious: how do you see this affecting your commitment to Bayesian principles? Does the spread-out distribution resolve the worry, or are there lingering doubts?
