  - But we can simplify: we are in a hypothetical situation where an agent knows (p ∧ ~Kp).
  - Then we write:
    - Known: (p ∧ ~Kp)
  - By rule 1 (distribution):
    - Known: p
    - Known: ~Kp
  - By rule 2 (factivity): if ~Kp is known, then ~Kp is true. So we have:
    - True: ~Kp
  - But ~Kp means that p is not known. But in this hypothetical situation, the agent knows p. So we have:
    - Known: p   (so p is known by the agent)
    - True: ~Kp   (so p is not known by anyone? Or by the agent? We have to be careful.

  The issue: ~Kp is typically interpreted as "it is not known by the agent" in this context? Or by anyone? In the original, p is not known by anyone. But then when we say an agent comes to know (p and ~Kp), then ~Kp says that p is not known by anyone (including that agent)? But then if the agent knows p, then Kp is true for that agent, so ~Kp (which says no one knows p) is false. But the agent has come to know ~Kp, which is false? But factivity says you can't know a falsehood.

  So the derivation uses that if the agent knows ~Kp, then ~Kp must be true. But ~Kp means "it is not the case that someone knows p". But in the scenario, the agent knows p, so there is someone who knows p, so ~Kp is false. Contradiction with factivity.

  So the rules are:
  1. Distribution: K(P∧Q) implies KP and KQ.
  2. Factivity: Kφ implies φ.

  Then in the hypothetical:
  - K(p ∧ ~Kp)  [assumption for possibility]
  - Then by distribution: Kp and K(~Kp)
  - By factivity on K(~Kp): ~Kp
  - But ~Kp is the negation of Kp? But we have Kp from above. So we have Kp and ~Kp, which is a contradiction.

  So we don't need to specify the agent because we are using that ~Kp means that it is not known by anyone (including the agent).

  So for the ledger, we can have:

  - We are in a hypothetical situation where an agent, let's call them the Knower, comes to know the conjunction: p and ~Kp. (Here, ~Kp means that no one, including the Knower, currently knows p. But at the moment the Knower comes to know, they then know p? So then ~Kp becomes false? But they are knowing it at the same time? This is a bit tricky with time.

  To avoid time, we can interpret ~Kp as "p is not known by anyone at the time before the Knower comes to know it". But then when the Knower comes to know it, they know p, so Kp becomes true. But they also know ~Kp, which is about the past? Then there is no contradiction.

  The standard solution is to interpret the knowledge as tenseless or at a fixed time. We can say: at time t0, p is true and not known by anyone. Then it is possible that at some later time t1, someone knows that at t0, p was true and not known at t0. Then at t1, they know (p-at-t0 and ~Kp-at-t0). Then by distribution, they know p-at-t0 and they know ~Kp-at-t0. By factivity, ~Kp-at-t0 is true, so at t0, p was not known. And they know p-at-t0, which is about the past. No contradiction.

  But this is a way out. The original Fitch proof assumes that the knowledge is about the present. So to avoid that complication, we assume that the knowledge is about eternal truths or that we are considering a fixed time.

  For the game, we can assume that the time is fixed and that the knowledge is simultaneous.

  We can simply present the rules and see what happens.

  So for the game:

  - The team's proposed p is: let's say "The number of chairs in the room is even." We assume it is true and not known by anyone (so ~Kp).
  - Then consider the conjunction: p and ~Kp. Call this q.
  - By the founding stipulation (findability), since q is true, it is findable: it is possible to know q.
  - Now, suppose that an agent knows q. Then by ledger rule 1 (distribution): the agent knows p and knows ~Kp.
  - By ledger rule 2 (factivity): if the agent knows ~Kp, then ~Kp is true. So it is true that ~Kp, meaning that p is not known (by anyone, including this agent?).
  - But from distribution, the agent knows p. So the agent knows p. This means that Kp is true (for that agent). But ~Kp says that no one knows p, including this agent. So we have that the agent knows p and does not know p. Contradiction.

  The issue is: does ~Kp include the agent? We have to assume that ~Kp means that at the time of evaluation, no agent (including the knower) knows p. But then when the knower knows p, that makes Kp true for that agent, so ~Kp is false. But they know ~Kp, which is false, which violates factivity.

  So in the derivation:
  - Knower knows p and knows ~Kp.
  - From knowing ~Kp, by factivity, ~Kp is true.
  - ~Kp being true means that the knower does not know p? But they do know p. Contradiction.

  So it works.

  **Ledger rules wording:**
  1. **Distribution:** "If you know a conjunction, then you know each part. For example, if you know 'P and Q', then you know P and you know Q."
  2. **Factivity:** "If you know something, then it is true. Knowledge is factive: you can't know something that isn't true."

  **Board work:**
  - Write on the board: 
    - We have a true proposition: p. (e.g., "The number of chairs is even.")
    - And we have: ~Kp (nobody knows p).
    - So the conjunction q = p ∧ ~Kp is true.
    - By findability, it is possible to know q.
    - Now, suppose an agent (the Knower) knows q.
    - Then by distribution:
        - The Knower knows p.
        - The Knower knows ~Kp.
    - By factivity (applied to ~Kp): since the Knower knows ~Kp, then ~Kp must be true.
    - But ~Kp says that nobody knows p. In particular, the Knower does not know p.
    - But we also have that the Knower knows p.
    - Contradiction: the Knower both knows p and does not know p.

  Students will object to the step: "~Kp says that nobody knows p, including the Knower? But at the time the Knower knows p, then they know p, so ~Kp is false." We can say that the knowledge is about the same time. So at the time the Knower knows q, they know p and they know ~Kp. But ~Kp is about that very time. So ~Kp says that at that time, nobody (including the Knower) knows p. But they do know p at that time, so ~Kp is false. But they know it, which violates factivity.

  That is the core of the paradox.

  **Facilitation:**
  - If they stall, ask: "What does it mean for the Knower to know ~Kp? What does ~Kp say?"
  - If they say the whole thing is bogus, ask them to pinpoint which step they object to.

  **Sacrifice Auction (10 min):**
  - Teams bid on which rule to abandon: either the founding stipulation (findability) or one of the ledger rules (distribution or factivity).
  - Auction rules: Each team gets 10 auction points (not the same as tokens). They can bid these points to "sacrifice" a rule. The team with the highest bid for a rule gets to argue why we should abandon that rule and what the cost is.
  - Then the class discusses.

  ### 50-65 min: Rescue Round (15 min, if time)
  - Teams propose a restriction on the findability principle: e.g., only for decidable sentences, or only for sentences that are not about knowledge.
  - Other teams attack: they try to find a sentence that is in the restricted class and that can be used to generate the paradox again.
  - The TA can guide: for example, if they restrict to Cartesian sentences (ones that are possibly known), then note that the proposition q = p ∧ ~Kp might not be Cartesian? But if p is Cartesian, then q might not be. But there are versions of the paradox that work for some restrictions.

  ### 65-75 min: Debrief (10 min)
  - What did we learn? 
  - Map to Fitch's proof: 
    - The founding stipulation is the knowability principle.
    - The ledger rules are distribution and factivity.
    - The contradiction shows that there can be no true proposition that is unknown.
  - Moves in response:
    - Reject knowability (anti-realism fails?).
    - Reject distribution: knowledge of a conjunction does not imply knowledge of the conjuncts? (This is hard to accept.)
    - Reject factivity: but that is a core feature of knowledge.
    - Restrict knowability to a subclass of propositions (but then we have to defend that the proposition q is not in that class).
    - Accept that all truths are known (but that's absurd).

  ### What Might Go Wrong
  - Challenge to founding stipulation: "Findable doesn't mean by us, but by someone eventually." We build in the challenge rule: in the sorting task, they must put the token for true cards. We insist on the stipulation for the game.
  - If nobody accepts the founding stipulation: then the game cannot start. We can say: "For the sake of this activity, we are assuming that every truth is findable (possible to know). Let's see where that leads." We can frame it as a thought experiment.

  ### What the Game Can't Reproduce
  - The game uses a specific example, but the paradox is general. We might not see the full generality. Also, the modal operator (possible to know) is handled informally. We don't do modal logic.

  ### Printable Materials List
  - 4 sets of 14 sentence cards (each set has the same 14 sentences).
  - Tokens: poker chips or paper clips (40 tokens: 10 per team).
  - Auction points: 4 sets of 10 point cards (or just record on paper).
  - Sealed envelope (optional) for the main event? Not necessary if they propose p and we assume it's true.
  - Whiteboard and markers.

  ### Minute-by-Minute Timeline
  - 0-5 min: Introduction, form teams, hand out materials.
  - 5-20 min: Sorting task (15 min): teams sort cards, place tokens for true cards. Class discussion on traps.
  - 20-25 min: Main event - proposal: teams propose a true but unknown sentence. Pick one by lottery.
  - 25-40 min: Derivation: write on board, step by step, with students. Use the picked p.
  - 40-50 min: Sacrifice auction (10 min): teams bid to sacrifice a rule and argue the cost.
  - 50-65 min: Rescue round (15 min): teams propose and attack restrictions.
  - 65-75 min: Debrief: map to Fitch's proof, discuss responses.

  ### Facilitator Script for Board Work
  - "We have p: [write the sentence]. We are assuming p is true and not known by anyone (~Kp)."
  - "Then the conjunction q = p ∧ ~Kp is true, right?"
  - "By our founding stipulation (findability), it is possible to know q. So let's imagine that someone, the Knower, comes to know q."
  - "Now, by our first ledger rule (distribution), if the Knower knows a conjunction, they know each part. So what does the Knower know?"
    - They know p.
    - They know ~Kp.
  - "Now, by our second ledger rule (factivity): if you know something, it must be true. So if the Knower knows ~Kp, then ~Kp must be true. What does ~Kp say?"
    - That nobody knows p. In particular, the Knower does not know p.
  - "But we also have that the Knower knows p. So we have: the Knower knows p and the Knower does not know p. That's a contradiction."
  - "So what went wrong?"

  ### Debrief Questions
  - "In the derivation, what played the role of the knowability principle?" (The founding stipulation and the FINDABLE tray.)
  - "Which ledger rule corresponds to distribution over conjunction?" (Rule 1.)
  - "Which ledger rule corresponds to factivity?" (Rule 2.)
  - "What are the options to avoid the contradiction?"
    - "Abandon findability for some truths? Which ones?"
    - "Abandon distribution? What would that mean for knowledge?"
    - "Abandon factivity? Can we have knowledge of false things?"
    - "Accept that there are no unknown truths? That everything true is known?"

  ## Final Sentence Card List (14 cards)

  True cards (must put token):
  1. The moon is made of rock.
  2. There are more than 1000 students enrolled in this university. (Check if true for your university; if not, adjust)
  3. The 100th digit of π is 9. (True)
  4. The TA's middle name is [correct middle name]. (True; if you don't have a middle name, use first name initial or omit)
  5. The number of chairs in this room is [exact number]. (True; count before class)
  6. The capital of Canada is Ottawa.
  7. The square root of 2 is irrational.
  8. It is raining in London at this exact moment. (Check a weather website at the start of class and set accordingly)

  False cards (no token):
  9. The moon is made of cheese.
  10. The population of Canada in 2021 was 100,000. (False; it was about 38 million)
  11. The 100th digit of π is 0. (False; it's 9)
  12. The TA's middle name is 'Xylophone'. (False)

  Neither (or other):
  13. This sentence is false. (Liar sentence; neither true nor false? Or we can put it in neither)
  14. The current king of France is bald. (Presupposition failure; neither true nor false? Or false)

  If you want to avoid the neither category, you can replace 13 and 14 with true or false cards.

  But with 8 true, 4 false, and 2 neither, it should work.

  ## Conclusion

  This plan should generate the paradox from the students' own actions and discussions. The point of maximum pain is the derivation and the auction. The game can't fully capture the modal aspect (possible knowledge) but we handle it informally. If they reject the founding stipulation, we insist for the sake of the game.
answer: |-
  Here’s a complete, ready-to-run game plan for your active learning session on Fitch’s paradox. It’s designed for 16 students in 75 minutes, using index cards and a whiteboard. The goal is for students to generate the paradox through gameplay before formalizing it. 

  ---

  ### **Game Overview**
  - **Core idea**: Students discover that the principle "all truths are knowable" (findability) conflicts with basic rules of knowledge, leading to absurdity.
  - **Three rounds**: Sorting Task → Paradox Generation (Main Event) → Rescue Round (if time).
  - **Key twist**: Students propose the problematic truth themselves, and the "ledger rules" (bookkeeping) force a contradiction. No formal terms (e.g., "Fitch," "knowability principle") until debrief.
  - **Teams**: 4 teams of 4 students each. Roles:
    - **Sorter**: Manages sentence cards/tokens.
    - **Proposer**: Pitches a true-but-unknown sentence.
    - **Scribe**: Writes on the whiteboard.
    - **Debater**: Defends the team in auctions/attacks.

  ---

  ### **Materials List (Printable)**
  1. **14 Sentence Cards** (4 identical sets, one per team). **Trap cards** force tension:
     - **Easy truths** (no trap):  
       - "Water boils at 100°C at sea level."  
       - "Paris is the capital of France."  
       - "2 + 2 = 4."  
       - "The sun is a star."  
     - **Trap truths** (true but "unknowable" in practice; students won’t want to commit tokens):  
       - "The exact number of dust motes in this room right now is odd." (Trap: Verifiable in principle, but practically impossible now.)  
       - "Caesar sneezed the morning he crossed the Rubicon." (Trap: Historians lack data; truth exists but is lost.)  
       - "Some star that burned out before humans existed had exactly four planets." (Trap: No observational access; truth is isolated.)  
       - "The TA’s left sock has exactly 3,000 threads." (Trap: Empirically verifiable but absurdly tedious.)  
       - "A specific unobserved grain of sand on Bondi Beach is quartz." (Trap: Truth exists but is inaccessible.)  
     - **False/Neither** (distractors; no token cost):  
       - "The moon is made of green cheese." (False)  
       - "1 + 1 = 3." (False)  
       - "The current king of France is bald." (Neither; presupposition failure)  
       - "This sentence is false." (Neither; liar paradox)  
     - **Wildcard** (tests "findable" scope):  
       - "No one knows whether Caesar sneezed the morning he crossed the Rubicon." (Trap: True, but if "findable," it must be knowable—foreshadows the paradox.)  
  2. **Tokens**: Poker chips, buttons, or paper circles (40 total; 10 per team).  
  3. **FINDABLE Tray**: A box/bowl labeled "FINDABLE" in the center of the room.  
  4. **Ledger Board**: Whiteboard divided into "Known" and "True" columns.  
  5. **Auction Bidding Slips**: 4 sets of 10 slips (1 point per slip).  

  ---

  ### **Minute-by-Minute Timeline**  
  **Total: 75 minutes**  

  #### **Round 1: Sorting Task (15 min)**  
  - **0–5 min**: Intro and setup.  
    - *Script*: "Today, we’re playing a game about truth and knowledge. Rule 1: For any sentence you sort as TRUE, you MUST place a token in the FINDABLE tray. FINDABLE means it’s *possible* for someone, sometime, to know it—even if we can’t. Rule 2: If you’re unsure, sort it as NEITHER. Teams have 8 minutes to sort all 14 cards."  
    - *Hand out materials*.  
  - **5–13 min**: Teams sort cards (True/False/Neither) and place tokens for True cards.  
    - *Facilitator*: Circulate and provoke tension: "Why not put a token for the dust motes? Is it true? Then it must be findable!"  
    - *Challenge Rule*: If teams resist (e.g., "Findable doesn’t mean *we* can find it!"), respond: "Remember: FINDABLE means *possible* for someone, eventually. If it’s true, the token MUST be placed. Save challenges for the auction!"  
  - **13–15 min**: Quick share-out.  
    - *Script*: "Which traps made you squirm? Why? Note: We’re stuck with the FINDABLE rule for now."  

  #### **Round 2: Paradox Generation (30 min)**  
  - **15–18 min**: Teams propose a true-but-unknown sentence.  
    - *Script*: "Propose a sentence your team agrees is TRUE but NO ONE IN THE WORLD currently knows. Example: ‘The exact number of dust motes in this room is [specific number].’ Write it down."  
    - *Pick one proposal* (e.g., via team lottery). Example: "The number of dust motes is 1,234,567."  
  - **18–25 min**: Derive the contradiction on the whiteboard.  
    - *Setup*: Post the proposal: `p: [student’s sentence]` and `~Kp: No one knows p`.  
    - *Ledger Rules* (presented as "harmless bookkeeping"):  
      - **Conjunction Distribution**: "If you know a conjunction, you know each part. Simple bookkeeping!" (If `K(p ∧ q)`, then `Kp` and `Kq`.)  
      - **Factivity**: "If you know something, it must be true. Obviously!" (If `Kp`, then `p`.)  
      - **Founding Stipulation (Findability)**: "True things are findable. We’ve been using this all along!" (If `p` is true, then `◊Kp`.)  
    - *Facilitator Script*:  
      1. "Since `p` is true and unknown, `p ∧ ~Kp` is TRUE. Agreed?"  
      2. "By FINDABILITY, `p ∧ ~Kp` is knowable. So, imagine a Knower learns it: `K(p ∧ ~Kp)`."  
      3. "By CONJUNCTION DISTRIBUTION, the Knower knows `p` AND knows `~Kp`. So: `Kp` and `K(~Kp)`."  
      4. "By FACTIVITY, since the Knower knows `~Kp`, then `~Kp` must be TRUE."  
      5. "But `~Kp` says no one knows `p`—including the Knower! So: `Kp` (Knower knows `p`) and `~Kp` (Knower doesn’t know `p`). Contradiction!"  
    - *Stall Response*: If stuck, ask: "What does `K(~Kp)` imply? If you know you don’t know `p`, does that mean you *actually* don’t know it?" If denied, restate Factivity. If they reject the whole thing: "Let’s see what happens if we drop a rule—time for an auction!"  
  - **25–30 min**: Sacrifice Auction.  
    - *Rules*: Teams bid auction points (1–10) to "sacrifice" a rule: **Findability**, **Distribution**, or **Factivity**. Highest bidder argues:  
      - "Why drop it? What’s the cost?" (e.g., "Drop Distribution? Then knowing a conjunction doesn’t mean knowing its parts—that’s messy!").  
    - *Facilitator*: Push debate. End by noting: "Dropping a rule avoids contradiction, but at a price."  

  #### **Round 3: Rescue Round (15 min; if time)**  
  - **30–35 min**: Teams propose a restriction to "rescue" findability (e.g., "Only apply to VERIFIABLE sentences" or "Only to sentences not about knowledge").  
  - **35–43 min**: Other teams attack. Must find a sentence in the subclass that rebuilds the paradox (e.g., "Caesar sneezed" is verifiable? Then use `p = "Caesar sneezed"` and rebuild `p ∧ ~Kp`).  
  - **43–45 min**: Quick vote: "Did the restriction work?" (Usually fails—students see the "unknowable" proposition slips back in.)  

  #### **Debrief (15 min)**  
  - **45–55 min**: Map game to Fitch’s proof.  
    - *Script*: "What we did is called **Fitch’s paradox of knowability**. The FINDABLE tray was the **knowability principle**. The ledger rules were **Distribution** and **Factivity**. The contradiction proves that if all truths are knowable, then all truths are *known*—which is absurd."  
    - *Whiteboard Summary*:  
      | **Game Step** | **Fitch’s Proof** | **Real Philosophical Moves** |  
      |---------------|-------------------|------------------------------|  
      | FINDABLE tray | Knowability principle | Reject it (anti-realism fails) |  
      | Sacrificing Distribution | Reject K-distribution | Cost: Knowledge isn’t "closed" under deduction |  
      | Sacrificing Factivity | Reject K-factivity | Cost: Knowledge isn’t factive (radical!) |  
      | Rescue Round | Restricting knowability | Cost: Arbitrary? (e.g., to "Cartesian" truths) |  
      | No sacrifice | All truths are known | Cost: Absurd (we’re not omniscient!) |  
  - **55–60 min**: Open discussion.  
    - *Questions*:  
      - "Which sacrifice felt least painful? Why?"  
      - "Could we avoid the paradox without abandoning anything?" (Hint: Intuitionism avoids double negation, but that’s a lecture for later.)  
  - **60–75 min**: Reveal the formal knowability principle and Fitch’s proof. Discuss implications.  

  ---

  ### **What Will Go Wrong (and Fixes)**  
  1. **"Findable doesn’t mean findable by us!"**  
     - *Built-in fix*: Challenge Rule forces them to accept the stipulation. If they refuse, say: "For this game, we’re defining ‘findable’ as *possible* knowledge. If you reject this, you’ll break the game—so let’s see what happens if we keep it."  

  2. **Stalling in the derivation** (e.g., "`~Kp` doesn’t apply to the Knower!").  
     - *Fix*: Ask: "When the Knower learns `~Kp`, does that mean *they* don’t know `p`? If not, how does `K(~Kp)` work?" Steer them to Factivity.  

  3. **Teams declare the game "bogus."**  
     - *Fix*: Run the auction early. Force them to argue what abandoning a rule costs (e.g., "If we drop Factivity, can we ‘know’ false things?").  

  4. **No one accepts the founding stipulation**.  
     - *Fix*: Start with low-stakes truths (e.g., "The moon is made of rock") to build buy-in. If resistance persists, reframe: "Let’s *pretend* findability holds—what happens?"  

  5. **Rescue Round proposals are too narrow**.  
     - *Fix*: Have teams attack their own restrictions (e.g., "You say findability only applies to empirical sentences? Is `p ∧ ~Kp` empirical?").  

  ---

  ### **What the Game Can’t Reproduce**  
  The game *cannot* formally capture the **modal scope of "possible" knowledge** (e.g., that `◊Kp` is a possibility operator). Students will handle it intuitively ("someone could find out"), but you’ll need to clarify in the debrief that Fitch’s proof relies on modal logic (e.g., "possible knowledge" implies a world where `Kp` is true). Without this, the contradiction seems like a linguistic trick.  

  ---

  ### **Final Prep Checklist**  
  - Print 4 sets of sentence cards (highlight traps).  
  - Gather tokens (e.g., 40 buttons).  
  - Set up FINDABLE tray and whiteboard.  
  - Write auction points on slips of paper.  
  - Rehearse the ledger script (keep it "bookkeeping"-casual).  

  This plan ensures students generate the paradox through discovery. By the end, they’ll feel the bite of Fitch’s proof—and you’ll fulfill the active learning requirement with zero lecturing. Run it as-is, and you’ll have a roaring debate!
