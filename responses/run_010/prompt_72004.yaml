  For the crucial test cases: 
  - Opposite verdict: Asymptomatic pheochromocytoma. Naturalists see disease (statistical dysfunction), normativists don't (no lived distress). 
  - Same verdict/different reasons: Corrected myopia. Both call it "disease" but naturalists focus on uncorrected dysfunction, normativists on disability without accommodation. This matters for policy – naturalists might resist covering corrective lenses as "treatment" since function is restored.

  The stakes emerge in the cruxes. Take screening cutoffs: naturalists predict setting TSH thresholds purely biologically causes overdiagnosis (verifiable by studying treated asymptomatic patients). Normativists predict incorporating symptoms avoids this but misses preventive opportunities. Both agree real-world data on outcomes can test this.

