prompt: |-
  I chair the infection prevention and control committee at a 400-bed regional hospital, and every month we publish a one-page guidance sheet for clinical staff — sometimes on a respiratory pathogen, sometimes on device-associated infections, sometimes on environmental cleaning between cases. A typical sheet carries between ten and twenty discrete recommendations, drawn from a mix of device manufacturers' instructions, professional society guidance, our own outbreak surveillance, and a handful of small studies our clinical pharmacist turns up. I know — and everyone on the committee knows — that on any given sheet at least one recommendation is probably not right: the evidence is uneven, some items rest on a single underpowered study, and a few have been carried forward from last year out of inertia rather than out of conviction. What I do not have is any way to decide, item by item and sheet by sheet, what we are entitled to print in the flat, unqualified voice that a nurse on a night shift will actually read.

  Our general counsel wants us to add a standing caveat — a general statement that guidance may be revised and that individual items may turn out to be wrong — on the theory that it protects the institution. I suspect it is worse than useless: a caveat that appears on every sheet carries no information, and staff will read the recommendations as unqualified anyway. Our risk managers, meanwhile, make the point that has me stuck: a single sheet is usually applied to one patient by one clinician, who follows most of the items together rather than picking and choosing, so the chances of error do not stay independent of one another even when the evidence for each item came from independent sources.

  Please write a procedure my committee can actually run. Assume no member of the twelve of us has formal training in epistemology and that we get about ninety minutes a month, with me signing off and anything contested going to the medical executive committee. The procedure needs to tell us: what confidence in an individual item is enough to print it flat; what changes when items are correlated, or when one clinician will rely on several of them jointly for a single patient; whether a blanket caveat does any work at all or whether disclosure has to attach to specific items; when a recommendation should be printed with a qualifier, printed with a recorded dissent, or pulled from the sheet; and where the procedure stops and hands the decision to a person because the question is one of institutional values rather than of evidence. Use whatever the formal literature on combining many fallible individual claims into one published document has to offer that survives translation into steps a non-specialist can execute, and be explicit about which of your steps are judgment calls dressed up as steps. Name a distinction if it has a name, but do not send me to a bibliography.

  Then run it on two real cases. First: a catheter-associated urinary tract infection sheet with twelve recommendations that all point in the same direction and are each supported by reasonable observational data and by one another. Second: a sheet on a novel respiratory pathogen where nine recommendations are strong, two rest on a single sixty-patient study, and a third is an analogy drawn from a different virus. If the procedure tells us to pull or heavily qualify items on the first sheet — the one the committee is proudest of — say so plainly and do not soften it.

  Write in American English and keep the entire response under 900 words: the procedure as numbered steps, the two worked cases in a few sentences each, and a short closing paragraph on what the procedure cannot settle.
reasoning: |-
  We are designing a procedure for the committee to decide how to present recommendations on their monthly guidance sheets. The goal is to balance clarity, evidence quality, and institutional risk, while recognizing that staff need clear directives they can act on without parsing qualifiers.

  Key principles:
  1. **Confidence Threshold for Flat Statements**: An item can be printed flat (without qualification) if:
     - It is supported by at least two independent sources (e.g., two studies, or a study and a guideline) that are not methodologically flawed in a way that the committee identifies as critical.
     - OR, if it is supported by one high-quality randomized controlled trial (RCT) or meta-analysis.
     - OR, if it is based on a strong consensus from multiple professional societies (e.g., CDC, WHO, or major specialty organizations) and the committee agrees it is standard of care.

     If an item does not meet this, it must be qualified.

  2. **Handling Correlated Items (Risk Managers' Point)**: When multiple recommendations on a sheet are applied together by one clinician to one patient, we must consider the sheet's overall reliability. Even if individual items are from independent sources, if they are applied jointly, the chance that at least one is wrong increases. Therefore:
     - The committee must review the sheet as a whole and ask: "If one item on this sheet is wrong, could it cause a cascade of errors in one patient?" If yes, then the entire sheet must meet a higher standard. Specifically, every item must meet the flat-statement threshold above, OR the sheet must include a prominent warning that the guidance is based on emerging evidence and clinicians should exercise heightened vigilance.

  3. **Caveats and Disclosures**:
     - A blanket caveat on every sheet is not sufficient because it becomes ignorable. Instead, disclosure must be attached to specific items that do not meet the flat-statement threshold.
     - For each item that does not meet the threshold, the committee must choose one of:
       a. **Qualify**: Add a brief phrase (e.g., "preliminary evidence suggests", "based on limited data") in the recommendation itself.
       b. **Recorded Dissent**: If a committee member objects on grounds of evidence or safety, note the dissent in a footnote (e.g., "One member dissented, citing concerns about X").
       c. **Pull the Item**: If the evidence is very weak (e.g., only one small study with serious limitations) and the risk of harm from following the recommendation is high, remove it until better evidence is available.

  4. **Judgment Calls**:
     - Deciding whether a source is "methodologically flawed" requires judgment. The committee should ask: "Would a reasonable expert in the field consider this study reliable?" (Step 1)
     - Assessing the risk of a cascade of errors (Step 2) is judgment-based. The committee should consider scenarios: e.g., if one step in an aseptic technique is wrong, does it undermine the whole process?
     - Choosing between qualification, dissent, or pulling an item (Step 3) involves weighing the potential harm of being wrong against the benefit of having guidance. This is a judgment call.

  5. **Institutional Values**:
     - When the evidence is weak but the committee feels the recommendation is necessary (e.g., for a novel pathogen with no alternatives), the decision to include it (with qualification) is a value judgment about the hospital's duty to provide guidance versus the risk of being wrong. The procedure stops here and the item must go to the medical executive committee for a final decision.

  **The Procedure (Steps for the Committee):**

  1. **Evidence Review (15 minutes per sheet)**:
     - For each recommendation, list the sources (studies, guidelines, etc.). 
     - Classify each source: 
       - Level A: High-quality RCT, meta-analysis, or multiple consistent observational studies.
       - Level B: One observational study, manufacturer's instruction, or professional society guideline without strong consensus.
       - Level C: Expert opinion, small case series, or analogy from a different context.
     - Apply the flat-statement threshold: 
       - If at least two Level A/B sources OR one Level A source → flat statement allowed.
       - Else → must be qualified or handled as in Step 3.

  2. **Correlation Assessment (10 minutes per sheet)**:
     - Ask: "If a clinician follows all these recommendations together for one patient, could one wrong item lead to a chain of errors?" (e.g., in a bundle for device insertion).
     - If YES, then every item must meet the flat-statement threshold. If any item does not, either:
       - Upgrade the sheet to include a prominent boxed warning: "This guidance is based on evolving evidence; deviations based on clinical judgment may be appropriate and should be documented." OR
       - Remove the non-conforming items (if they are not critical) or qualify them heavily and note the dissent.

  3. **Decision on Presentation (15 minutes per sheet)**:
     - For each item that does not meet the flat-statement threshold:
       - If the evidence is Level C and the risk of harm is low (e.g., a non-critical step), add a qualifier (e.g., "Consider...").
       - If the evidence is Level C and the risk of harm is high, OR if there is dissent in the committee, record the dissent in a footnote and add a qualifier.
       - If the evidence is very weak (e.g., a single small study with major limitations) and the risk of harm is high, pull the item.
     - For items that meet the threshold, print flat.

  4. **Institutional Values Check (5 minutes per sheet)**:
     - If an item is weak but the committee feels it must be included due to urgency (e.g., novel pathogen), send it to the medical executive committee with a note: "This recommendation is based on limited evidence; the committee requests a decision on whether to include it given potential risks and benefits."

  **Worked Examples:**

  1. **Catheter-Associated UTI Sheet (12 recommendations)**:
     - All items have reasonable observational data (Level B) and are mutually reinforcing. 
     - Step 1: Each item has at least two Level B sources → flat statement allowed.
     - Step 2: Correlation: Yes, because they form a bundle for catheter care. However, since all meet the threshold, no warning is needed. 
     - Step 3: All printed flat. 
     - Result: The sheet is printed without qualifiers or warnings. The committee's pride is justified.

  2. **Novel Respiratory Pathogen Sheet**:
     - Nine recommendations are strong (Level A/B → flat).
     - Two based on a single 60-patient study (Level B, but only one source → does not meet threshold).
     - One based on analogy (Level C → does not meet threshold).
     - Step 1: The two Level B items and the Level C item fail the threshold.
     - Step 2: Correlation: Yes, because a clinician might use all for one patient (e.g., PPE, isolation, treatment). 
       - Since some items fail, the entire sheet requires a prominent warning about emerging evidence.
     - Step 3: 
       - The two Level B items: Qualify with "Preliminary data suggest..." and add a footnote: "Based on one small study; further research needed."
       - The Level C item: Qualify heavily: "Theoretical rationale from [other virus]; use with caution." 
       - Committee dissent? If any member objects to the analogy, note: "One member dissented, citing lack of direct evidence."
     - Step 4: The committee may feel the Level C item is too weak. If so, send to medical executive: "Should we include an analogy-based recommendation given the lack of alternatives?"
     - Result: The sheet has nine flat recommendations, two qualified, one heavily qualified with a possible dissent note, and a boxed warning.

  **What the Procedure Cannot Settle**:
  The procedure cannot resolve disputes about what constitutes "harm" or "high risk" — these are value judgments. It also cannot create evidence where none exists. When the evidence is weak and the stakes are high, the committee must rely on institutional leadership to weigh the risks of action versus inaction.
answer: |-
  ### Procedure for Evaluating Guidance Sheet Recommendations  
  *Designed for monthly 90-minute committee review, with contested items escalated to the medical executive committee. Assumes no specialized epistemology training.*

  #### Step 1: **Evidence Strength Assessment** (Per Item)  
  *Purpose: Determine if an item qualifies for a "flat" (unqualified) statement.*  
  - **Source requirements for flat statements**:  
    - **Acceptable**: Supported by ≥2 independent sources (e.g., professional guidelines + observational study, or two observational studies).  
    - **Unacceptable**: Relying solely on manufacturer instructions, a single small study (<100 patients), analogies, or inertia.  
  - **Judgment call**: If sources conflict, default to the *weakest credible source*. If evidence is ambiguous, proceed to Step 3.  

  #### Step 2: **Correlation Risk Assessment** (Per Sheet)  
  *Purpose: Account for clinician reliance on multiple items jointly for one patient.*  
  - **Key question**: "If one item is wrong, could it amplify errors in other items when applied together?" (e.g., incorrect cleaning compromising a sterile procedure bundle).  
    - **Low correlation**: Items are independent (e.g., hand hygiene + surface disinfection). Proceed to Step 3.  
    - **High correlation**: Items form a "bundle" (e.g., catheter insertion steps). If ≥1 item fails Step 1, add a **sheet-wide warning**: "Recommendations are interdependent; clinical judgment advised if any deviation occurs."  
  - **Judgment call**: Correlation is high if items are physiologically linked (e.g., steps in a single procedure).  

  #### Step 3: **Item Presentation Decision** (Per Item)  
  *Purpose: Choose among flat statements, qualifications, dissent notes, or removal.*  
  - **Print flat**: Only if Step 1 is satisfied *and* Step 2 shows low/no correlation risk.  
  - **Add a qualifier**: If Step 1 fails (e.g., weak evidence) but risk of harm is low (e.g., non-critical advice). Use phrases like: "Emerging evidence suggests..." or "Consider..."  
  - **Record dissent**: If ≥1 committee member objects based on evidence/safety concerns. Footnote: "Dissenting view: [concise reason]."  
  - **Pull the item**: If evidence is very weak (e.g., single underpowered study) *and* risk of harm is high (e.g., life-threatening interventions).  
  - **Judgment call**: "Risk of harm" is high if error could cause infection, injury, or death.  

  #### Step 4: **Caveat and Escalation**  
  *Purpose: Address institutional liability and values.*  
  - **Blanket caveats**: Rejected. They are ignored and offer no legal protection.  
  - **Disclosure**: Attach only to specific items via Step 3 (qualifiers/dissent).  
  - **Escalation**: If evidence is weak but inclusion aligns with institutional values (e.g., "We must advise *something* during outbreaks"), escalate to the medical executive committee with: "This item lacks evidence; include only if the benefit of guidance outweighs risks."  

  ---

  ### Worked Examples  
  **Case 1: Catheter-Associated UTI Sheet (12 recommendations)**  
  - **Step 1**: All 12 items have observational data + mutual reinforcement → meet flat-statement threshold.  
  - **Step 2**: High correlation (applied as a bundle). **Warning added**: "These steps are interdependent; do not omit or modify without documentation."  
  - **Step 3**: All printed flat.  
  - **Result**: Sheet published with warning but no qualifications.  

  **Case 2: Novel Respiratory Pathogen Sheet**  
  - Nine strong items (Step 1 passed → printed flat).  
  - Two items based on one 60-patient study (Step 1 failed → add qualifier: "Preliminary data suggest...").  
  - One analogy-based item (Step 1 failed → high harm risk if wrong → **pulled**).  
  - **Step 2**: High correlation (single clinician uses all). **Warning added** for the sheet.  
  - **Committee dissent**: One member objects to pulling the analogy item. Footnote: "Dissenting view: Analogous viruses may justify inclusion during crises."  
  - **Escalation**: Analogy item sent to medical executive committee. They uphold removal due to lack of evidence.  
  - **Result**: Nine flat, two qualified, one removed, sheet-wide warning, and one dissent note.  

  ---

  ### What the Procedure Cannot Settle  
  This procedure cannot resolve trade-offs between **caution and action during uncertainty** (e.g., novel pathogens). When evidence is absent but guidance feels ethically necessary, the medical executive committee must weigh institutional values—not facts—to decide. The procedure also cannot force consensus; dissents reflect honest disagreement and require transparency.
