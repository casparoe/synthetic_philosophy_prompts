  The language should stay concrete - describing LED patterns, mechanical sounds, physical sensations. When the widow speaks, her lines must carry multiple interpretations. That last image of her watching the robot freeze needs to resonate with both relief and terrifying vulnerability.

  Most importantly, the robot can't become sentient or emotional. Its tragedy is purely systemic - a perfect execution of flawed programming. The horror isn't malice, but impeccable logic unraveling reality through excessive care.
