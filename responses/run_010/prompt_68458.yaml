prompt: |-
  so I've gone down a rabbit hole on Kepler and the astrology thing and after two weeks of reading I'm honestly more confused then when I started. Everyone calls him the father of modern astronomy but he also kept doing horoscopes basically his whole life, including for some general whose name I keep forgetting. What I can't work out is how much slack a guy like that deserves — not judged against what we know now (that feels like cheating) but against what was available to him in his own time, given that he personally had the most accurate picture of the sky anyone had ever built.

  I've made my own list of the different astrological things he actually did or believed, as best I can reconstruct them:

  1. casting birth charts for patrons' babies, including his own kids
  2. using where the planets were to forecast the coming season's weather in his annual prognostications
  3. the illness-and-health sections that came with those birth charts, like when to bleed someone based on the moon
  4. the charts he did for Wallenstein years apart, where he flagged danger at a particular time
  5. his idea that the Earth is basically a big animal with a kind of sensing soul that "notices" the angles formed between planets, and that this is why those angles matter at all
  6. his position that astrology is garbage as practiced and should be rebuilt from the inside rather than tossed in the bin

  Sort those six into tiers — S, A, B, C, D — for how defensible each one was for a person with Kepler's own knowledge of the heavens, and give me one sentence per item on why it landed there. Hard limit: 250 words total, don't go over.
