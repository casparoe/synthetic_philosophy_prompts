prompt: |-
  So I got into a two-hour argument with my friend Nadia last night about Libya in 2011 and I genuinely can't tell which of us won, and I suspect we were argueing past each other about what the criteria even mean rather than about the facts. She used to do protection work for an NGO and her line is that the intervention was legitimate on the day Resolution 1973 went through — ten in favour, five abstentions from Brazil, Germany, India, China and Russia, nobody against — because what the Council actually authorized was all necessary measures to protect civilians and civilian populated areas under threat of attack, while "excluding a foreign occupation force of any form on any part of Libyan territory," so anything that went wrong afterwards is a complaint about how a valid mandate got executed, not about whether going in was right. My line is that the drift from saving Benghazi to hunting Gaddafi wasn't an execution glitch, it was latent in the mandate from the start, and that the abstainers said as much in the room: Brazil's ambassador explained the abstention partly on the grounds that using force might do "more harm than good to the very same civilians we are committed to protecting," which is a prediction, and a correct one.

  What I want from you is a disciplined case analysis of the whole 2011 arc through R2P, and I mean the actual machinery of the doctrine, not the op-ed version. So: the 2005 summit language with its three pillars and its threshold of a state "manifestly failing" to protect its population, plus the precautionary criteria the Canadian-sponsored commission had laid out in 2001 — just cause, right intention, last resort, proportional means, reasonable prospects. Walk me through which of those the intervention satisfied on March 17th and which it stopped satisfying later, and be specific about the pivots: the African Union ceasefire roadmap that got rejected in the spring, the recognition of the rebel council as the legitimate interlocutor, the air campaign shifting from halting columns to hitting command nodes and then the family compound in late April (I think a son and some grandchildren were killed, correct me if I've got that wrong), the ground advisers, the convoy strike outside Sirte in October. Then I want you to take Nadia's defence seriously as a double-effect move — regime change as foreseen but unintended, the only available means of making civilian protection stick — and tell me whether double effect can carry that weight here or whether it collapses into the usual problem of describing your intentions narrowly enough that anything inconvenient becomes a side effect.

  And then run it the other way, because this is the part we never got to before she had to leave. What does Libya do to R2P as a doctrine? Two things I want pressed on specifically. First, the reasonable prospects criterion looks like it can only ever be judged ex post, which means either it's a real constraint that nobody could have applied in March 2011, or it's an unfalsifiable rhetorical device you invoke afterwards to bless or damn whatever happened — is there a version of it that's actually action-guiding at the moment of decision, and if so what evidence would have satisfied it about a country with no institutions, no army that wasn't Gaddafi's, and a opposition made of defectors and volunteers? Second, the pillar problem: pillar one puts the protection duty on the sovereign state, and the intervention's whole point was to destroy the thing that was failing that duty, so after October 2011 who does the responsibility revert to, and does the doctrine have any resources at all for that handover or does it just go silent? Also tell me whether the Syria veto pattern that followed is best read as the system learning a lesson about reasonable prospects or as five states deciding that pillar three was a trap — because those two readings imply completely different verdicts on whether 2011 broke the norm or just revealed what it had always been. I don't want a reading list or a bunch of cites at the end, I want your actual adjudication of who was closer to right last night.
reasoning: |-
  Okay, the user had a heated two-hour debate with their friend Nadia about the 2011 Libya intervention. Nadia, who worked in NGO protection, argues that the UN Resolution 1973 was legitimate when passed because it authorized civilian protection without occupation. The user counters that the mission drift to regime change was inherent from the start, pointing to abstaining countries' warnings. They want a disciplined R2P analysis focusing on the doctrine's machinery: the 2005 pillars and 2001 precautionary criteria.

  First, I need to unpack R2P's framework. The 2005 World Summit outlines three pillars: state responsibility, international assistance, and timely response. The ICISS added precautionary principles: just cause, right intention, last resort, proportional means, and reasonable prospects. The user wants these applied to key events: the AU roadmap rejection, rebel council recognition, air campaign escalation, ground advisers, and the Sirte strike. 

  For March 17th, 2011, the intervention arguably met just cause (imminent Benghazi massacre), last resort (Gaddafi ignored warnings), and proportional means (initial no-fly zone). But right intention was shaky—abstainers like Brazil worried about hidden motives. The reasonable prospects criterion was the weakest point; no one knew if post-Gaddafi Libya would stabilize. 

  As the mission evolved, the criteria eroded. Rejecting the AU ceasefire violated last resort. Recognizing the rebels as legitimate signaled regime change intentions. Bombing command nodes and Gaddafi's compound (killing his family) exceeded proportionality. Ground advisers and the Sirte strike crossed into occupation-lite. By late April, the mission had clearly shifted to regime change, invalidating the original mandate.

  Nadia's double-effect argument—regime change as unintended but necessary for protection—doesn't hold. Double effect requires the bad outcome (regime collapse) to be truly unintended, but NATO's actions actively pursued it. The narrow framing of intentions as "civilian protection" ignores the foreseeable consequences of destroying state institutions. 

  On R2P’s future, the reasonable prospects criterion is indeed flawed—it’s only verifiable post-hoc. In Libya’s case, the lack of institutions and a cohesive opposition should have raised red flags, but the urgency in Benghazi overrode caution. Post-intervention, pillar one responsibility had no clear inheritor, exposing R2P’s gap on transitions. 

  The Syria vetoes reflect both lessons from Libya and distrust in Western intentions. It’s not just about reasonable prospects; it’s about pillar three being weaponized. This suggests 2011 didn’t break R2P but revealed its limitations when powerful states steer mandates toward regime change. 

  Verdict: The user is closer to correct. The drift was latent in the mandate, and NATO’s actions exceeded it. Nadia’s defense of the initial resolution is valid, but the execution invalidated the intervention’s legitimacy under R2P.
answer: |-
  Here's a disciplined analysis of the 2011 Libya intervention through the R2P framework, addressing your core questions and adjudicating between your positions:

  ---

  ### **I. R2P Framework Applied to March 17, 2011 (Resolution 1973)**  
  **Threshold & Pillars (2005 WSOD):**  
  - **Pillar I Failure:** Gaddafi’s "cockroaches" speech + assault on Benghazi = **"manifest failure" to protect** (met).  
  - **Pillar II Exhausted:** No meaningful regional/international assistance could halt violence.  
  - **Pillar III Triggered:** UNSC determined threat to international peace/security.  

  **ICISS Precautionary Principles (2001):**  
  1. **Just Cause:** Imminent massacre in Benghazi (credible evidence of Gaddafi’s intent) → **satisfied**.  
  2. **Right Intention:** Abstainers (Brazil, China, Russia, etc.) expressed skepticism about regime-change motives. *Ambiguous at adoption*: Mandate text excluded occupation but authorized "all necessary measures."  
  3. **Last Resort:** Gaddafi rejected ceasefires, AU diplomacy stalled, no alternatives to halt advance → **satisfied**.  
  4. **Proportional Means:** Initial mandate (no-fly zone, civilian protection) → **satisfied on day one**.  
  5. **Reasonable Prospects:**  
     - *Argument for:* Gaddafi’s forces were conventional; rebels held territory.  
     - *Argument against:* No plan for post-Gaddafi governance; opposition fragmented.  
     → **The critical weakness**: Unknowable ex-ante, but warnings from abstainers highlighted this risk.  

  **Verdict for March 17:** Nadia is correct that the resolution *as adopted* met core R2P criteria *procedurally*. However, the "reasonable prospects" criterion was already contested and inherently speculative.

  ---

  ### **II. When the Intervention Stopped Satisfying R2P Criteria**  
  **Key Pivots & Erosion of Legitimacy:**  
  - **Rejection of AU Roadmap (April 2011):**  
    AU proposed ceasefire, political transition, and Gaddafi’s exit. NATO/rebel rejection *without testing sincerity* violated **last resort** and signaled regime change.  
  - **Recognition of TNC (July 2011):**  
    Western recognition of the Transitional National Council as Libya’s "legitimate authority" explicitly reframed the mission toward political overthrow, undermining **right intention**.  
  - **Air Campaign Escalation (Late April Onward):**  
    Strikes on Bab al-Aziziya (Gaddafi’s compound, April 30) killed his son Saif al-Arab and three grandchildren. Shifting from "protecting civilians" to **decapitation strikes** violated **proportional means** and revealed regime-change intent.  
  - **Ground Advisers & Arms Supplies:**  
    Covert insertion of UK/French/Qatari operatives (confirmed by NATO in June) breached "no occupation force" clause and further eroded **proportionality/right intention**.  
  - **Sirte Convoy Strike (October 20, 2011):**  
    NATO’s targeting of Gaddafi’s fleeing convoy (leading to capture/execution) had no plausible civilian-protection rationale → **terminal violation of mandate/R2P**.  

  **Cumulative Drift:** By May 2011, the mission was **objectively pursuing regime change**, invalidating the original R2P justification. "Protection of civilians" became a fig leaf for overthrowing Gaddafi.

  ---

  ### **III. Nadia’s Double-Effect Argument: Does It Hold?**  
  **Her Claim:** Civilian protection *required* Gaddafi’s removal as an unintended but necessary consequence.  
  **Assessment:**  
  - **Double effect fails here** because:  
    - Regime change was **foreseeable and foreseen** (abstainers’ warnings; NATO’s rapid target expansion).  
    - NATO actively **chose escalation** (rejecting AU diplomacy, bombing command centers) when narrow options existed.  
    - Civilian protection became **subordinate to regime change** (e.g., no ceasefire enforcement once rebels gained momentum).  
  - **Core Problem:** Defining intentions as "civilian protection" while systematically dismantling the regime collapses into bad faith. The means (destroying state institutions) directly contradicted the mandate’s exclusion of occupation and made *future* civilian protection impossible.

  ---

  ### **IV. Libya’s Impact on R2P as a Doctrine**  
  **1. The "Reasonable Prospects" Dilemma:**  
     - **Ex-ante evidence in March 2011:** Libya had no independent army/judiciary, tribal fissures, weak opposition. Historical precedents (Iraq, Afghanistan) showed high state-collapse risk.  
     - **Actionable version:** Requires credible evidence that military action won’t worsen harm *and* that political/structural conditions exist for stability. In Libya, neither existed.  
     - **Verdict:** The criterion *could* have been applied if decision-makers prioritized post-conflict planning over urgency. Abstainers applied it correctly; proponents ignored it.  

  **2. The Pillar I Handoff Problem:**  
     - **Post-Gaddafi:** Responsibility reverted to the TNC, which had no capacity (proven by militia infighting post-2011).  
     - **R2P’s Gap:** The doctrine is silent on *how* to rebuild Pillar I capacity. "Responsibility to rebuild" (proposed by ICISS) was omitted from 2005 WSOD → **fatal flaw**.  

  **3. Syria Vetoes: Lesson or Trap?**  
     - **Evidence:** Russia/China explicitly cited Libya’s "regime change" drift to veto Syria resolutions.  
     - **Verdict:** Both readings are valid:  
       - *System learning:* States now demand stricter "reasonable prospects" guarantees.  
       - *Pillar III as trap:* Russia/China saw R2P as a Trojan horse for Western interventionism.  
     Libya didn’t "break" R2P; it **revealed its vulnerability to misuse** when powerful states exploit ambiguities.  

  ---

  ### **Adjudication: Who Was Closer to Right?**  
  - **Nadia is correct** that Resolution 1973 was procedurally legitimate under R2P *on March 17*. The threshold for intervention was met, and the text excluded occupation.  
  - **You are correct** that the drift to regime change was **latent in the mandate’s ambiguity** and inevitable given NATO’s operational choices. The abstainers’ warnings were validated.  
  - **Broader Verdict:** Your argument wins the substantive debate. The intervention’s *execution* wasn’t a "glitch" but a predictable outcome of authorizing force against a regime with no exit strategy. R2P’s failure in Libya stems from its inability to bind powerful states to its precautionary principles once force is authorized. This irrevocably damaged the norm, as proven by Syria and ongoing skepticism.  

  **Final Note:** Libya exposed R2P’s core flaw—it cannot prevent humanitarian language from being hijacked for geopolitical goals when the "reasonable prospects" test is ignored. The doctrine remains viable only if applied with intellectual rigor, which 2011 lacked after Benghazi was secured.
