  Here is the pantoum, engineered for your specifications:

  **The Archive of July**  

  He tried all summer to catch the air.  
  A boy’s dry lips pressed thin and flat.  
  No tune, no call, no signal there—  
  just spit and breath and stubborn heat.  

  A boy’s dry lips pressed thin and flat.  
  One note cracked through the dusty glare.  
  Just spit and breath and stubborn heat  
  became a fist against the wall.  

  One note cracked through the dusty glare—  
  a sound like slate scraped on a stone.  
  Became a fist against the wall  
  that summer’s length could not explain.  

  A sound like slate scraped on a stone:  
  no tune, no call, no signal there.  
  That summer’s length could not explain  
  the fury in that single gasp.  

  No tune, no call, no signal there—  
  he tried all summer to catch the air.  
  The fury in that single gasp  
  became a fist against the wall.  

  ---

  **Heaviest Lifting Line:**  
  "Became a fist against the wall."  

  **Why:**  
  Its first appearance (stanza 2, line 4) is literal—Bell recalling the boy’s physical frustration. Its repetition (stanza 3, line 3; stanza 5, line 4) shifts via proximity: adjacent lines frame it as metaphor ("a sound like slate" implying character, "fury in that single gasp" implying causation). Punctuation remains unchanged; only context converts action into symbol. It embodies the biographer’s pivot without altering a word.  

  **Structure Notes:**  
  - **Punctuation Shifts:** The final stanza’s em dash (line 1) and period (line 2) heighten closure vs. the opening’s open syntax.  
  - **Concrete Language:** "Dry lips," "slate scraped," "dusty glare" avoid abstraction.  
  - **Tension:** The circular form traps the memory within hindsight ("re-reading its own beginning"), yet the unchanged lines resist definitive interpretation.  
  - **No Victory:** Bell’s specificity ("spit and breath") persists alongside the biographer’s implied narrative ("fury... could not explain").  

  The machine runs clean: repetition *is* the mechanism of historical repurposing.
