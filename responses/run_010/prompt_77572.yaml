prompt: |-
  Novelist here, six months into a book about a paramilitary unit in occupied Eastern Europe. For research I've been reading the perpetrator history, including the two books from that famous nineties fight — the one about the reserve police battalion of ordinary middle-aged men, and the one that answered it argueing the killers were volunteers who'd been raised to want the killing. Not my question, though. My question is about a move I keep seeing in the writing AROUND those books — reviews, afterwords, festival panels, my own book club twice — and I can't find a name for it.

  The move. Someone says: the terrifying thing is how normal they were beforehand, bakers and drivers and clerks, which proves it was the situation doing the work and not anything inside them, because if it had been inside them you'd have seen it in the bakers. Then, sometimes in the same breath, the same person says: and look how keen they were once it started, volunteering, joking about it, staying late, which shows it had been inside them all along. Compressed version, heard at a dinner party: "the fact that they were ordinary is exactly what makes them monstrous." Nobody blinked. The ordinariness is load-bearing on both sides — as evidence that character didn't matter, and as evidence of how far character had rotted. Same with the keenness: one side calls it conformity, of course they were keen when everyone else was; the other side calls it character revealed. The facts never change, neither reading ever looses, and nothing anybody could go and look at would settle it.

  So: does this have a name, and if it doesn't, can you give it one? I want the carving more than the label.

  I know the near neighbours and I don't think any of them is it. The bias where people over-credit personality and under-credit circumstances isn't it, because neither of my two speakers is misjudging one particular person — they're each claiming the same datum as their own confirming evidence. Ad hoc rescue isn't it either, because nothing is being rescued; both accounts get asserted at once, cheerfully, and neither one is in trouble. Theory-underdetermined-by-evidence is closer but still off, I think, because that's about two accounts both fitting the data, whereas here it's one specific fact being advertised as decisive by both sides — and if you deleted the fact, both accounts would be standing exactly where they were.

  Which brings me to the term hunt, and please be concrete rather than gesturing: what are the closest established concepts in social psychology, in the perpetrator historiography itself, and in philosophy of science, and how does the thing I've described differ from each of them? I'd also like to know whether the actual historians in that nineties fight were doing this, or whether it's something piled on top of them afterwards — my impression from reading them is that they disagreed about which facts mattered, not about what one shared fact meant, which would make the move a distortion of the debate rather than the debate.

  Two edge questions, and these are the ones I actually care about. First: when is it legitimate? Sometimes a fact really is compatible with two readings and the honest position is that you don't know yet — keenness might be conformity or it might be appetite. What exactly turns the honest version into the rigged version, and can you hand me a test I could run on a single paragraph to tell which one I'm reading? Second: does the move need an attribution dispute to exist, or is it the same animal when one critic says a sentence is so flat it must be deliberate and another says it's so flat it's just bad?

  Reason I'm asking: I'm about 90% sure my own manuscript is doing it. My antagonist is an amiable man and I keep wanting his amiability to be both the proof that he's harmless and the proof that he isn't. Tell me what to look for when I go back through the draft.
reasoning: |-
  Okay, let me start by unpacking what this novelist is asking. They're working on a book about a paramilitary unit in Eastern Europe and have been researching perpetrator history, specifically referencing the Browning vs. Goldhagen debate from the 90s. But their real question is about a rhetorical move they've noticed in discussions around these books. 

  The move involves two contradictory interpretations of the same facts: the ordinariness of the perpetrators is used both to show that the situation caused their actions (because they were normal before) and to show that their evil was inherent (because their normalcy makes the atrocities more monstrous). Similarly, their enthusiasm during the killings is framed as either situational conformity or revealed character. The novelist wants to know if this has a name, how it differs from similar concepts, and how to identify it in their own manuscript.

  First, I recall the Browning-Goldhagen debate. Browning's "Ordinary Men" argues that situational pressures and group dynamics led reserve police battalion members to commit atrocities, while Goldhagen's "Hitler's Willing Executioners" claims they were already motivated by eliminationist antisemitism. The novelist isn't asking about the debate itself but about how people discuss it—using the same facts to support opposing views.

  The key here is the use of identical evidence for contradictory claims. The ordinariness and enthusiasm are load-bearing for both sides. I need to figure out if there's a term for this. The novelist mentions they've considered fundamental attribution error, ad hoc rescue, and underdetermination but found them insufficient. 

  Looking at social psychology, cognitive dissonance comes to mind, but that's about discomfort from conflicting beliefs, not a rhetorical tactic. Motivated reasoning fits better—interpreting evidence to support pre-existing views. But the novelist wants something more specific to using the same fact for opposite conclusions. 

  In historiography, I think about the intentionalist vs. functionalist debates in Holocaust studies. Intentionalists see the Holocaust as driven by Hitler's ideology, while functionalists emphasize bureaucratic structures. But again, that's about different emphases, not the same fact supporting both sides.

  Philosophy of science offers underdetermination—theories can be consistent with the same data. But the novelist already dismissed this because it's about overall theories fitting data, not a single fact being pivotal for both. 

  I recall the term "Janus-faced evidence" from philosophy—evidence that can be interpreted in two ways. That seems close. Another term is "equifinality" in systems theory—different paths leading to the same outcome. But here it's the same evidence supporting different causes. 

  The novelist also asks when this move is legitimate. In science, evidence often supports multiple hypotheses until further testing. The rigged version occurs when there's no attempt to resolve the ambiguity—using the fact as a universal solvent to defend a position regardless of evidence. 

  For the test on a single paragraph, I'd look for: 1) the same fact presented as conclusive for opposing claims, 2) no acknowledgment of alternative interpretations, 3) no criteria for falsifying either claim. If both interpretations are asserted without addressing why one might be stronger, it's likely the rigged move.

  Regarding their manuscript, the novelist suspects their antagonist's amiability is used both to show he's harmless and that he's dangerous. To avoid this, they should clarify the conditions under which each interpretation holds. For example, show moments where amiability disarms suspicion versus where it masks malice, providing context that distinguishes the two. 

  I should also check if the historians themselves used this move or if it's a later distortion. From what I remember, Browning and Goldhagen emphasized different facts—Browning focused on group dynamics, Goldhagen on ideological indoctrination. They didn't use the same fact in opposite ways; they prioritized different datasets. The move seems more common in secondary discussions.

  Finally, the novelist asks if the move exists outside attribution disputes. Absolutely—it can appear in literary criticism, where a flat sentence is seen as either deliberately bad or incompetently bad. The structure remains the same: the same feature supports contradictory interpretations without resolution.
answer: |-
  Here's the carving, with precision tools. This maneuver is **Janus-Faced Evidence Utilization** – a name that captures its two-directional, self-sealing nature. Below is the dissection across disciplines, edge cases, and your manuscript concerns.

  ### Core Concept & Name
  - **Janus-Faced Evidence Utilization (JFUE)**  
    **Definition:** *The deployment of a single, ambiguous empirical observation as conclusive proof for two mutually exclusive causal explanations, where the observation's valence flips to defend each position without resolving the contradiction.*  
    **Why it fits:**  
    - **Self-sealing:** Ordinariness "proves" both situational determinism ("no prior signs") and inherent evil ("normalcy *is* the horror"). Keenness "proves" conformity *or* revealed character.  
    - **Ambiguity exploitation:** Relies on traits/behaviors open to multiple interpretations (ordinariness, enthusiasm).  
    - **Rhetorical immunity:** Deleting the datum wouldn’t harm either theory; it’s decorative confirmation.  

  ### Distinguishing from Neighbors  
  | Concept              | How JFUE Differs                                      |  
  |----------------------|-------------------------------------------------------|  
  | **Fundamental Attribution Error** | FAE is cognitive bias favoring dispositional over situational attributions *in individuals*. JFUE is a **rhetorical tactic** applying *both* attributions to a *group datum* simultaneously. |  
  | **Ad Hoc Rescue**    | Rescues a theory *under threat* by adding auxiliary hypotheses. JFUE **preemptively uses** the same evidence to bolster *both* theories without either being challenged. |  
  | **Underdetermination** | Theories are underdetermined when *multiple* fit *all* data. JFUE is **evidence underdetermination**: a *single* fact ambiguously supports *two specific opposing claims* as "proof." |  
  | **Motivated Reasoning** | JFUE is a *subset*: it’s motivated reasoning that weaponizes ambiguity to serve dual, contradictory agendas without reconciliation. |  

  ### Historiography Check: Browning vs. Goldhagen  
  - **They did NOT do this.** Browning emphasized situational pressures (group cohesion, authority) and noted initial reluctance. Goldhagen stressed pre-existing "eliminationist antisemitism" in German society.  
  - **Their debate:** Conflict over *which facts mattered most* (e.g., Goldhagen ignored dissent within the battalion; Browning downplayed ideological fervor). Ordinariness/keenness weren’t "proof" for both—they were **starting points** for divergent investigations.  
  - **JFUE is a post-debate distortion:** Secondary commentators (reviews, panels) flattened their nuanced arguments into soundbites, weaponizing the same observations for rhetorical convenience.  

  ### Legitimacy Test: Honest Ambiguity vs. Rigged JFUE  
  A single-paragraph test:  
  **If legitimate:**  
  - The ambiguity is **explicitly acknowledged** ("Their eagerness could reflect conformity or sadism; we lack data to distinguish").  
  - **Falsifiability criteria** are implied ("If diaries showed revulsion, it suggests coercion; if pride, inherent brutality").  

  **If rigged JFUE:**  
  - The fact is presented as **decisive proof** for both sides ("Their ordinariness *proves* situation dominates" AND "Their ordinariness *proves* evil lurks in all").  
  - **No mechanism** is offered to resolve the tension; the contradiction is ignored or celebrated as profundity.  
  - **Deletion test:** Removing the fact leaves both theories intact and unchanged.  

  ### Beyond Attribution Disputes  
  JFUE thrives anywhere an ambiguous feature can be spun oppositely:  
  - **Literary criticism:** "This flat sentence is either genius minimalism or incompetent writing."  
  - **Psychology:** "A child's quietness proves trauma (withdrawal) or resilience (self-containment)."  
  - **Key requirement:** The feature must be **inherently polysemous** (open to multiple readings) and **central to the rhetoric** of both sides.  

  ### Manuscript Diagnosis: Antagonist’s Amiability  
  **You’re likely committing JFUE if:**  
  - His likability is used as **proof of innocence** ("No one suspected him – he seemed so harmless!") AND **proof of menace** ("His charm was the perfect camouflage!").  
  - There’s **no narrative tension** between these readings – they’re asserted flatly, without scenes forcing the reader to question which interpretation holds.  
  - His character lacks **behavioral specificity**: Amiability manifests identically in benign/vicious contexts, making it a mere switchable signifier.  

  **Fix it:**  
  1. **Contextualize the amiability:**  
     - Show him *using* charm to disarm a victim (menace) vs. genuinely connecting with his granddaughter (humanity).  
  2. **Introduce diagnostic scenes:**  
     - Place him in a low-stakes conflict (e.g., argument with a waiter). Does his amiability crack? *How*?  
     - Have another character voice suspicion: "He’s *too* nice..." then undercut/clarify this.  
  3. **Make the trait evolve:**  
     - Does his amiability curdle into sarcasm when stressed? Or harden into icy politeness during atrocities?  

  ### Why This Matters for Your Novel  
  JFUE in historiography avoids moral complexity by reducing perpetrators to abstractions ("ordinary men" OR "ideological monsters"). Your antagonist can defy this by being **concretely paradoxical**: his amiability is both weapon and vulnerability, neither proof of inherent good nor evil, but a tool whose meaning depends on his choices. That’s where the real terror lies.  

  **Final scalpel:** When revising, hunt for passages where the *same detail* is invoked to support opposing inferences without narrative work to resolve the tension. Replace assertion with embodied action that forces interpretation.
