prompt: |-
  My sister sits on the ethics committee at a fertility clinic and she's weirdly consistent about embryo selection, but I can't work out her rule. Votes so far: PGT to avoid Huntington's — yes, she called it close to obligatory. Avoiding a BRCA1 mutation — yes. Picking the embryo with the lowest polygenic schizophrenia score — yes. A Deaf couple asking to transfer the deaf embryo rather than the hearing one — no. A couple who both have achondroplasia asking for the non-affected embryo — no, she kept saying its a disability but not a harm. Picking the embryo with the highest polygenic educational-attainment score — hard no, she got genuinely angry about that one.

  Now they've got a new request: PGT-A on five embryos comes back with one trisomy 21, the parents aren't disabled and say they'd "love any of them but would rather not." How's she going to vote? I want the candidate rules that fit her whole record, which of them split on this case and why, your best guess at her verdict, and what the next case the committee sees should be to settle it. She quotes "procreative beneficence" approvingly sometimes but she's clearly not just maximizing, so I'm confused.
reasoning: |-
  Okay, let me tackle this puzzle about the user's sister's embryo selection ethics. The user has provided several voting examples and wants to understand her consistent underlying rule. 

  First, I need to analyze her pattern across all cases. Huntington's and BRCA1 got "yes" votes - both are severe, early-onset conditions with high penetrance. Polygenic schizophrenia also got approved, which is interesting because schizophrenia has variable expression but significant disability burden. 

  Then the Deaf couple case is revealing - she voted against selecting for deafness. The achondroplasia case is similar - she rejected selecting against dwarfism despite it being a disability. The educational attainment case made her angry, clearly crossing a line for her.

  Important clues: 
  - She references "procreative beneficence" but doesn't maximize all traits
  - She distinguishes between "disability" and "harm" in achondroplasia case
  - Emotional reaction to educational attainment selection suggests strong boundaries

  For the new Down syndrome case, the key factors seem to be:
  - Trisomy 21 causes intellectual disability and health issues
  - But many with Down syndrome have good quality of life
  - Parents would "rather not" but aren't rejecting

  I see three possible consistent rules emerging:
  1) The "Significant Harm Principle" - only select against conditions involving severe suffering or early death
  2) The "Medical Pathology Standard" - based on deviation from species-typical functioning
  3) The "Identity Preservation Rule" - avoiding selection that changes core aspects of human experience

  Testing these against the cases... The Huntington's/BRCA1/schizophrenia all meet significant harm criteria. Deafness and achondroplasia don't necessarily, hence her "no" votes. Educational attainment crosses into enhancement. 

  For Down syndrome - it's the toughest test case. Significant Harm view might approve selection against it, while Medical Pathology would certainly approve. But Identity Preservation might reject if she sees Down syndrome as part of human diversity rather than pathology.

  Given her pattern - particularly rejecting selection against achondroplasia while accepting schizophrenia - I suspect she uses Significant Harm with a high threshold. Down syndrome likely meets that threshold due to associated health complications and cognitive impairment, so she'd probably vote yes to select against it.

  To confirm her rule, the committee should present a case like selecting against genes for blindness or severe intellectual disability - conditions clearly meeting significant harm criteria - versus selecting for traits like height or musical ability that don't.
answer: |-
  Based on your sister's voting record and her reference to "procreative beneficence," her rule appears to be a **modified procreative beneficence principle focusing on avoiding significant harm or severe disadvantage**, rather than maximizing advantages. Here's the breakdown:

  ### Candidate Rules Consistent With Her Record
  1.  **The Significant Harm Threshold Principle:** Selection is only permissible to avoid conditions causing *severe suffering, profound functional impairment, significantly shortened lifespan, or extreme barriers to a minimally decent life*. It's not about minor disadvantages or non-harmful differences.
  2.  **The Medical Pathology Standard:** Selection is permissible to prevent conditions universally recognized as serious medical pathologies causing significant pain, dysfunction, or premature death, but not for variations within normal human diversity or traits primarily constituting social identities.
  3.  **The Identity Preservation Rule:** Selection is impermissible when it targets traits that form the basis of a recognized cultural or identity community (e.g., Deafness, Dwarfism), even if those traits involve disability, *unless* the condition also involves severe, unavoidable medical harm.

  ### Analysis of Cases
  *   **Huntington's (Yes):** Severe, incurable, progressive neurodegeneration causing profound suffering, loss of function, and early death. Clear **Significant Harm**.
  *   **BRCA1 (Yes):** High lifetime risk of severe, life-threatening cancers (breast, ovarian). Significant medical harm and shortened lifespan. **Significant Harm**.
  *   **Polygenic Schizophrenia (Yes):** Schizophrenia typically causes severe functional impairment, suffering, and reduced lifespan. Even a reduced risk score targets avoidance of a condition meeting the **Significant Harm** threshold.
  *   **Deaf Embryo Selection (No):** Deafness itself, while a disability, does not inherently cause significant pain, profound intellectual impairment, or early death. Deafness is also a core cultural identity. This violates **Identity Preservation** and falls below the **Significant Harm** threshold for her.
  *   **Achondroplasia Selection (No):** While a disability involving health challenges, many with achondroplasia lead full lives without profound suffering or significantly shortened lifespans. It's also a strong social identity (Dwarfism). Her "disability but not harm" comment aligns with it falling below her **Significant Harm** threshold and involving **Identity Preservation**.
  *   **Educational Attainment Score (Hard No):** This is pure enhancement/social advantage. No avoidance of inherent harm or severe disadvantage. Angry reaction likely stems from seeing this as unethical eugenics, commodification of children, and exacerbating social inequality. Violates all principles above as *not avoiding harm*.

  ### The Down Syndrome (Trisomy 21) Case: How the Rules Split
  *   **Significant Harm Threshold:** **Likely YES.** Down syndrome *does* involve significant health complications (heart defects, immune issues, higher risk of leukemia, early-onset Alzheimer's), cognitive impairment ranging from mild to severe, and a shortened average lifespan. This arguably meets the threshold of "significant harm" or "severe disadvantage" more clearly than Deafness or Achondroplasia.
  *   **Medical Pathology Standard:** **YES.** Trisomy 21 is universally classified as a genetic disorder causing developmental disability and significant associated health problems. It's a clear medical pathology.
  *   **Identity Preservation Rule:** **Likely NO.** While there's a strong Down syndrome community and identity, Down syndrome is generally not *primarily* chosen as a cultural identity in the same way Deafness or Dwarfism often are. The associated intellectual disability and health problems are more central to the condition. However, this rule creates the most ambiguity here.

  **Your Sister's Likely Vote: YES (to allow selecting against the Trisomy 21 embryo)**

  *   **Why:** Down syndrome carries a significant burden of inherent medical problems and cognitive impairment that likely surpasses her threshold for "harm" or "severe disadvantage" compared to Deafness or Achondroplasia. While there's a community aspect, the unavoidable health and cognitive impacts are more defining and align more closely with Huntington's, BRCA1, and Schizophrenia risk in terms of functional impact and health risks. Parents' "rather not" stance, while not rejection, indicates a desire to avoid these burdens. Her approval of PGT for schizophrenia risk (a condition with variable expressivity) suggests she accepts targeting conditions where significant impairment is a *likely* outcome, even if not guaranteed.

  ### The Crucial Next Case to Settle Her Rule
  To distinguish definitively between the **Significant Harm Threshold** and the **Medical Pathology Standard** vs. the **Identity Preservation Rule**, the committee needs a case involving:

  **A non-life-threatening congenital condition causing significant physical disability and chronic pain, but which has a strong associated cultural identity and community.**

  *   **Example:** A couple with Osteogenesis Imperfecta (OI - Brittle Bone Disease) requesting PGT to select an embryo *without* the OI-causing mutation. OI causes frequent, painful fractures, short stature, mobility issues, chronic pain, and hearing loss. However, there is a strong OI community and identity ("Little People of America" includes many with OI/Skeletal Dysplasias).
  *   **How it Splits:**
      *   **Significant Harm/Medical Pathology:** OI clearly causes significant harm (pain, fractures, functional limitations) and is a medical pathology. Vote should be **YES**.
      *   **Identity Preservation Rule:** OI is a significant part of identity for many, forming a community. Selecting against it could be seen as rejecting that identity. Vote would be **NO** (like Deafness/Achondroplasia).
  *   **Why it Works:** This case directly tests the conflict between avoiding inherent physical suffering/impairment and respecting disability identity/community. A "YES" vote solidifies **Significant Harm/Medical Pathology** as her core principle, overriding identity concerns when significant harm is present. A "NO" vote strengthens the **Identity Preservation Rule**, placing identity above significant physical suffering.

  **Conclusion:** Your sister uses a principle of "procreative beneficence" constrained by a high threshold focused on avoiding conditions causing significant inherent harm or severe disadvantage, explicitly rejecting enhancement and showing deference to traits forming core identities *unless* significant inherent harm is overriding. Her likely "YES" on Trisomy 21 reflects that its inherent health and cognitive burdens cross her harm threshold. The OI case would be the critical test to confirm whether inherent physical suffering trumps identity preservation in her framework.
