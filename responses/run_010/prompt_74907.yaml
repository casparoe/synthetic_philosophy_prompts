answer: |-
  Ah, a direct hit on the nomination process! You’re quite right that in many districts, the *general* election feels like a formality. I don’t deny the sclerosis in safe seats; it’s a genuine weakness. But let’s dissect where accountability *actually* resides in your proposed alternative.

  Under open-list PR, you imagine voters rewarding or punishing individual MPs. Yet the decisive election doesn't truly shift to the public square; it merely moves *further inside the party machine*. Think of the selectorate crafting the national list. Who are they? Party insiders, activists – a tiny, unrepresentative fraction. They decide who gets the winnable slots, who languishes at the bottom. The voter’s preference within the list? Often negligible unless a candidate can run a personal campaign of national celebrity scale – hardly local accountability! You trade a district party nomination contest, however flawed and limited, for a *national* party list ranking contest controlled by an opaque committee. The power to truly 'throw the rascal out' – meaning to deny them a seat entirely – moves indoors, to that closed-door ranking meeting where the average citizen has no voice at all. At least in my safe district, the rascal is *my* rascal, named and known; under your list, the rascal handed a safe slot by the central committee is utterly unaccountable to *me* and *my* community. Is that progress?
