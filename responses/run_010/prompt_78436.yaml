prompt: |-
  For the past term I have been sitting in on a colleague's graduate seminar on the ethics of killing in war. Her method is unusual: she declines to state principles at all, on the grounds that principles should be read off a sufficiently large set of cases rather than the other way round, so each week she puts a vignette to the room, takes a vote, and then announces her own verdict with a sentence or two of commentary that never quite amounts to a criterion. I am co-writing a review essay with her and want to characterise her position accurately rather than guess at it, so I have been tabulating the verdicts. All the cases are set in an invented war between an invading state and the neighbour it has invaded, and by liable I mean liable to be deliberately killed by the opposing side rather than merely liable to be killed as foreseeable collateral damage.

  Here are the eight rulings so far, in the order she gave them. (1) A young man who enlisted in the invading army for the pay, three weeks into a posting at a checkpoint in an occupied town where nothing has been fired for a month, whose unit searches houses and holds men for questioning: liable. (2) A career artillery officer of the invading army who directs strikes from a bunker forty kilometres behind the front line: liable. (3) A surgeon in the invading army's uniform who treats its wounded and returns them to their units within days: not liable. (4) A civilian employed by a private firm who writes and maintains payroll software for the invader's ministry of defence and has never been within a thousand kilometres of the fighting: not liable. (5) A civilian software engineer, also ununiformed and also far from the front, who maintains the guidance packages for the invader's cruise missiles, knows precisely which strikes they have been used in, and has twice turned down other work to keep the post: liable. (6) A partisan band fighting for the invaded state that has been mortaring residential blocks in a town the invaders hold, killing the civilians in them: liable. (7) A teenage soldier of the invading army who has dropped his rifle, raised his hands and is walking towards the defending lines: not liable. (8) A retired general of the invading army, now in his seventies, who writes a widely read column urging the war on and praising its worst atrocities: not liable.

  My two hunches are that she is running either something like the traditional symmetry picture, on which liability attaches to fighting, to being one of the people who make the war, and is indifferent to which side one fights for, or something like the revisionist picture, on which liability attaches to moral responsibility for an unjust threat and therefore falls on the invaders and on those defenders who are themselves doing something wrongful. All eight verdicts look to me compatible with both, and case 6 is the maddening one: it is her only ruling about anyone on the defending side, and she said liable, but the partisans were killing civilians, so I cannot tell whether she was reacting to their side or to their mortars. I also think cases 1 and 5 rule out any criterion keyed to what a person is doing at the moment of the attack, and case 8 rules out any criterion keyed to blameworthiness or influence, though I may be wrong about that as well. Another student in the room is confident she will go one way on Thursday, on the grounds that she has never yet called anyone on the defending side liable who was not himself killing civilians.

  The case she has circulated for Thursday is this. A woman flies armed reconnaissance drones for the defending state. She is not a member of its armed forces: she is employed by a private contractor, she works from a windowless operations centre four hundred kilometres inside her own country, and she drives home to her children each evening. In three months she has guided eleven strikes, all of them, so far as anyone can establish, against armoured columns and mortar crews of the invading army, with no civilian casualties to her name. As of this morning she is on a thirty-six-hour rest break; her next shift begins Thursday night. The question put to the seminar will be whether the invaders may put a missile through her windscreen in the operations centre car park tomorrow afternoon.

  What I want from you is four things. First, identify which of the eight verdicts is the closest analogue to the drone pilot, and say whether the features that separate her from it — her side, her lack of uniform, her distance from the front, her rest break — are differences that ought to make a difference on the rules she appears to be running. Second, set out the candidate rules that survive all eight verdicts, say what each implies about her, and give me your prediction of the verdict; if you think some rule I have not considered fits the eight at least as well as my two hunches, say so explicitly and work out what it says about her. Third, if you conclude that the precedents genuinely underdetermine the case, tell me what she would be committing herself to by ruling either way, and in particular what she would be conceding about whether the fighters on the two sides stand on the same moral footing. Fourth, propose one further vignette in the same style that would best separate the surviving rules, and explain why that one rather than another.

  Please commit rather than hedge. I want a definite prediction, a definite account of the rule you think she is running, and your reasons for preferring it to the alternatives, together with an explicit statement of what evidence would change your mind; a balanced survey of the options that leaves me to choose is exactly what I do not want. Write the answer in British English.
reasoning: |-
  Hmm, the user is asking me to analyze their colleague's approach to war ethics based on eight case verdicts, and predict how she'll rule on a new drone pilot case. This is quite a sophisticated philosophical puzzle with real academic stakes.

  First I need to understand the colleague's method - she refuses to state principles upfront, instead building them inductively from cases. The user suspects she's either following traditional symmetry (where liability depends on combat status regardless of side) or revisionist asymmetry (where liability stems from contribution to unjust threats). 

  Looking at the eight rulings:
  - Cases 1 and 2 (combatants for invader) are liable
  - Case 3 (medic) is not liable despite being uniformed
  - Case 4 (payroll software) not liable but case 5 (weapons software) is liable - so function matters more than location
  - Case 6 (defenders killing civilians) liable - this is crucial because it's the only defender case
  - Case 7 (surrendering soldier) not liable
  - Case 8 (propagandist) not liable despite influence

  The drone pilot case has several features: she's a contractor for defenders, remote-controlled, currently off-duty, and has only targeted military assets. The closest analogue is actually case 2 (artillery officer) - both direct attacks from safety. But key differences are her defensive role and civilian status.

  For candidate rules, traditional symmetry would make her liable as a combatant (like case 2). Revisionism would likely not make her liable since she's contributing to just defense. But case 6 complicates this - the colleague held defenders liable when they committed atrocities. 

  My prediction: she'll rule NOT liable. Because: 
  - The defensive context matters (contrast case 6)
  - Function is discriminatory targeting (like case 3 vs 5)
  - Off-duty status might matter (implied by case 7)

  But if she rules liable, that would strongly suggest symmetry. To test this, I'd propose a vignette where an invader's drone operator only hits military targets - under symmetry they'd be liable, under revisionism not if the war is unjust.

  The user wants commitment, not hedging - so I'll state clearly that I think revisionism fits best, and predict "not liable" for the drone pilot. The rest break may be decisive - attacking now would be like shooting a sleeping soldier.
answer: |-
  Based on a rigorous analysis of the eight precedents and the principles they imply, here is my committed assessment of your colleague's position and the Thursday case:

  **First: Closest Analogue and Relevant Differences**  
  The closest analogue is **Case 2 (artillery officer)**. Both involve:  
  - Direct, operational control of weapon systems causing lethal harm to enemy forces  
  - Physical safety and distance from immediate combat (bunker vs. operations centre)  
  - Repetitive, mission-critical contributions to kinetic operations  

  **Differences and their significance under her apparent rules:**  
  1. **Her side (defending):** *Likely decisive.* Case 6 shows liability can attach to defenders, but *only* when directly causing civilian harm. Her defensive role absent wrongdoing may shield her.  
  2. **Lack of uniform:** *Irrelevant.* Cases 5 (civilian engineer) and 6 (partisans) confirm liability without uniforms. Function trumps formal status.  
  3. **Distance:** *Irrelevant.* Cases 2 and 5 establish remoteness doesn’t exempt combat-function roles.  
  4. **Rest break:** *Potentially critical.* Case 7 (surrendering soldier) suggests temporal disengagement removes liability. An off-duty combatant may be analogous.  

  **Second: Candidate Rules, Prediction, and Novel Rule**  
  - **Surviving rules from precedents:**  
    - **Rule A (Function-Based Liability):** *Liability attaches to individuals directly enabling or executing* **hostile acts** *that sustain the war effort, irrespective of side, uniform, or location.*  
      - *Fit:* Explains all cases: Exempts surgeon (3), payroll (4), surrendering soldier (7); includes enlisted (1), artillery (2), missile engineer (5), wrongful partisans (6). Blameless propagandist (8) excluded as non-operational.  
      - *Implication for drone pilot:* **Liable** (direct combat function like artillery officer).  
    - **Rule B (Unjust-Threat Asymmetry):** *Liability requires contributing to* **unjust threats** *(materially or directly), making invaders liable for combat roles but defenders liable only for wrongful acts.*  
      - *Fit:* Explains why defenders are liable *only* when harming civilians (Case 6) and why propagandist (8) isn’t liable (non-material contribution). Missile engineer (5) liable for enabling unjust harm; surgeon (3) not liable as medical care isn’t inherently unjust.  
      - *Implication for drone pilot:* **Not liable** (defensive role causing no unjust harm).  

  - **Prediction:** She will rule **NOT LIABLE**.  
    - *Why Rule B prevails:*  
      - Case 6 is the lynchpin: Defenders were liable *only* for atrocities, not for fighting per se. This asymmetry aligns with revisionism.  
      - Case 8 (propagandist) shows blameworthiness alone doesn’t trigger liability—material contribution to harm is required. The drone pilot’s defensive actions lack the "unjust" element.  
      - Rest break echoes Case 7’s emphasis on cessation of hostile intent.  
    - *Why Rule A fails:* It cannot explain why the propagandist (8) is exempt despite influencing the war effort.  

  - **Novel Rule Considered (and Rejected):**  
    - *Rule C (Direct Causation):* Liability only for those whose actions are the *proximate cause* of imminent harm.  
      - *Why it fails:* Excludes the missile engineer (5), who maintains systems but doesn’t personally "cause" strikes. Your colleague ruled them liable.  

  **Third: Underdetermination and Commitments**  
  The precedents *do not* underdetermine the case—they support Rule B. But if she ruled **liable**, she would commit to:  
  - **Symmetry:** Conceding combatants on both sides are morally equivalent targets regardless of war’s justice (collapsing her distinction in Case 6).  
  - **Functional Absolutism:** Elevating role (drone operator = artillery officer) above defensive context, despite her exemption of the surgeon (3).  

  A **not liable** verdict commits to:  
  - **Revisionist Asymmetry:** Defenders gain immunity when fighting justly, affirming the war’s moral structure.  
  - **Temporal Vulnerability:** Liability activates *only* during active contribution (supporting Case 7).  

  **Fourth: Proposed Vignette to Separate Rules**  
  **Vignette:** *A farmer in the invaded state who, under duress from the invaders, repairs damaged tanks at gunpoint in a frontline workshop. He opposes the war but fears execution. One repaired tank later kills defending soldiers.*  

  - **Why this separates rules:**  
    - **Rule A (Function):** *Liable.* Directly enables combat operations (like missile engineer).  
    - **Rule B (Asymmetry):** *Not liable.* Contributes to unjust threat under coercion without moral responsibility.  
    - **Crucial distinction:** Tests whether *involuntary* contribution to unjust threats triggers liability—which Case 5 (engineer’s voluntary choice) doesn’t address. Her verdict here would clarify if liability requires agency or mere causal role.  

  **Evidence That Would Change My Mind:**  
  - If she ruled the drone pilot **liable**, I would abandon Rule B and adopt **Rule A** (Function-Based Liability), conceding symmetry.  
  - If she exempted the coerced farmer, Rule B would be confirmed; if she held him liable, Rule A would prevail.  

  **Final Prediction:**  
  **Verdict:** NOT LIABLE  
  **Reason:** Her revisionist asymmetry spares defenders engaged in discriminate, just combat. The rest break solidifies this by negating imminent threat. Expect commentary like: "She poses no threat while off-duty; her role serves defence, not atrocity."  

  ---  
  *This analysis commits to Rule B (Unjust-Threat Asymmetry) as the only consistent framework for all eight rulings. The drone pilot’s defensive function and rest period render her non-liable under this logic.*
