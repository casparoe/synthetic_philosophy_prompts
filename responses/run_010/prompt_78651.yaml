  We are constructing an essay question that forces students to engage with the Hofstadterian view of the self as a "strange loop" — an abstract, self-reinforcing pattern that can be instantiated in multiple substrates, allowing for partial survival after death in the minds of others.

  The case: A graduate student who never met her deceased supervisor, working only from his unpublished correspondence, comes to reason and write in his idiom so exactly that his former colleagues say he is back.

  The question must require:
  (a) An account of what the pattern view adds to the unremarkable claim that the dead influence the living. Specifically, what would have to be true for a fragment of his loop to be *present* in her brain (rather than merely *reproduced*) and how one would tell the difference.
  (b) Whether survival-in-degrees has any principled stopping point, given that the same description seems to fit the widow, the biographer, the stage impersonator, and a system trained on the corpus.

  We must avoid answers that simply recite Parfit or paraphrase the pattern view.

  Let's design the question:

  **Question Text:**

  "In her book *Surfaces and Essences*, Douglas Hofstadter, writing with Emmanuel Sander, argues that a self is an abstract, self-reinforcing pattern — a 'strange loop' — which admits of degree and can be instantiated in more than one substrate at once, including other living brains. On this view, when someone dies, a partial and diluted version of them persists across those who knew them, read them, or absorbed their idiom.

  Consider the following case: A graduate student, who never met her supervisor and who worked only from his unpublished correspondence after his death, comes to reason and write in his idiom so exactly that his former colleagues remark that he is back. 

  Using this case, critically evaluate the Hofstadterian view. In particular:

  1. Explain what the pattern view adds to the unremarkable claim that the dead influence the living. What would have to be true for a fragment of the supervisor's 'strange loop' to be *present* in the graduate student's brain, rather than merely *reproduced*? How might one tell the difference?

  2. Given that the pattern view admits of degrees, does survival in this sense have any principled stopping point? Discuss by considering how the same description might apply to: the supervisor's widow (who knew him intimately), a biographer (who studied his life and work), a stage impersonator (who mimics his mannerisms), and an AI system trained on his corpus.

  Do not merely paraphrase the pattern view or rehearse standard arguments from psychological continuity (e.g., Parfit). Focus on the distinctive features of the Hofstadterian account as described above."

  **Model Answer (approx. 700 words):**

  The Hofstadterian pattern view of the self offers a radical reimagining of personal identity and survival. By characterizing the self as an abstract, self-reinforcing pattern — a "strange loop" — that can be instantiated in multiple substrates, it challenges traditional notions of identity as being tied to a single biological organism. The case of the graduate student who internalizes her deceased supervisor's idiom so thoroughly that colleagues feel his return provides a vivid test for this view.

  First, the pattern view must transcend the commonplace idea of influence. Influence is causal: the dead affect the living through traces they leave, but the living remain distinct. The pattern view, however, posits that the self-pattern can be *instantiated* elsewhere. For a fragment of the supervisor's strange loop to be *present* in the student — not just reproduced — her brain must not merely mimic his outputs but must replicate the self-referential, self-sustaining dynamics of his pattern. A strange loop involves a system that, through levels of abstraction, refers back to itself, creating a stable yet dynamic structure (like a self-representing symbol system). Mere reproduction would produce similar behaviors without the recursive self-modeling. For the pattern to be present, the student's cognitive processes must not only produce supervisor-like thoughts but also do so via a loop that incorporates a representation of the supervisor as a thinker, thereby partially instantiating his identity. 

  How to tell the difference? We might look for evidence that the student's thought processes are not just imitative but self-reinforcing in the supervisor's specific way. For example, if she not only uses his idioms but also develops new ideas in a manner that reflects his characteristic style of problem-solving, including his typical errors and self-corrections, this might suggest the loop is active. If the pattern is present, we would expect a degree of autonomy in the pattern's operation: the student might generate thoughts that feel to her (and others) as if the supervisor is "thinking through her," rather than her consciously copying. This would be a phenomenological and functional marker of presence.

  Second, the view admits degrees: the widow, biographer, impersonator, and AI all host fragments of the pattern. But does survival have a stopping point? The pattern view avoids sharp boundaries: the self is a statistical pattern that fades with dilution. However, without a principled criterion, we risk collapsing identity into mere similarity. The key lies in the *strange loop* aspect. The widow might host a rich pattern due to intimate interaction, but if her representation lacks the self-referential structure (e.g., she doesn't internalize his self-model), it may be more reproductive than present. The biographer might have detailed knowledge but without the loop's self-reinforcement. The impersonator mimics surface features without the underlying cognitive dynamics. The AI, if it merely generates outputs without self-awareness, might be a simulacrum. 

  But Hofstadter's view allows that a sufficiently complex replica could host the loop. The challenge is that the same abstract pattern can be instantiated at varying levels of fidelity. The stopping point must be functional: does the instantiation sustain the self-referential dynamics to a degree that maintains the pattern’s coherence? In the graduate student, the pattern might be robust enough to be self-sustaining; in the AI, if it is a deep learning system without recursive self-representation, it might not. However, Hofstadter might argue that if the AI’s processes form a strange loop (e.g., via recurrent networks that model their own processing), then it too could host the pattern.

  Critically, without the loop, we have influence; with it, we have presence. But the boundary remains vague. The pattern view's strength — its flexibility — is also its weakness: it risks making identity too promiscuous. However, by tying survival to the persistence of the specific self-referential structure, it offers a more nuanced criterion than mere influence, even if it does not provide a bright line.

  **Marking Scheme (Total 20 marks):**

  We need criteria that separate A from B answers. The key is to reward the specific moves required and penalize common errors.

  Criteria array (each criterion is an object with: name, marks, a_move, b_move, typical_error, error_penalty):

  1. **Understanding the Pattern View vs. Influence:**
     - Name: "Distinction between presence and reproduction"
     - Marks: 6
     - A_move: Clearly articulates that for the pattern to be present, the graduate student's brain must instantiate the self-referential, self-reinforcing structure (the strange loop) of the supervisor's pattern, not just output similarity. Explains how this goes beyond causal influence.
     - B_move: Identifies that presence requires more than reproduction but does not fully articulate the role of the strange loop's recursive structure.
     - Typical_error: Equating presence with high-fidelity reproduction or confusing it with ordinary influence.
     - Error_penalty: -2 to -3 (depending on severity) from the 6 marks.

  2. **Criterion for Telling the Difference:**
     - Name: "Operationalizing presence"
