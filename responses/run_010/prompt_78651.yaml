  I'm setting the final for an upper-level seminar on personal identity and need one essay question, answerable in 45 minutes and roughly 900 words, worth 20 marks. The topic is the claim that a self is an abstract, self-reinforcing pattern — a "strange loop" — which admits of degree and can be instantiated in more than one substrate at once, including other living brains, so that when someone dies a partial and diluted version of them persists across those who knew them, read them, or absorbed their idiom. This is the Hofstadterian view; please work from the characterization I have just given rather than treating the item as a test of recall about his books.

  Anchor the question in a brief case of your own construction: a graduate student who never met her supervisor and who, years after his death and working only from his unpublished correspondence, reasons and writes in his idiom so exactly that his former colleagues say he is back. What the question must not permit is an answer that recites Parfit on psychological continuity or paraphrases the pattern view back. It has to force two things simultaneously: (a) an account of what the pattern view adds to the unremarkable claim that the dead influence the living — what would have to be true for a fragment of his loop to be *present* in her brain rather than merely *reproduced* in it, and how one would tell the difference; and (b) whether survival-in-degrees has any principled stopping point, given that the same description seems to fit the widow, the biographer, the stage impersonator, and a system trained on the corpus.

  Give me the question as students would see it, a model answer of about 700 words, and a marking scheme totalling 20 marks that separates an A from a B answer by naming the specific moves each must contain, together with the particular errors that should cost marks — for instance treating "degrees" as automatically answering the boundary objection, or dragging the case into the fission debate when nothing here is competing for survival.

