  ### Decision Tree for In Situ Life Detection

  **Tree Structure**  
  Each branch node is an operation (action and measurement). Leaves are philosophical positions on life, with outcomes: alive (A), not alive (N), or undecided (U).  

  ```
  START
  │
  Q1: Operation: Incubate sample in a nutrient-rich medium for 24 hours. Measure changes in energy/matter flux (e.g., heat, gas, or light emission). Is persistent, self-sustaining metabolic activity detected?
  │
  ├── Yes (Metabolism detected) → 
  │   │
  │   Q2: Operation: Observe sample via high-resolution microscopy for 48 hours. Is replication observed (e.g., division, budding, or new identical structures)?
  │   │
  │   ├── Yes (Replication observed) → 
  │   │   │
  │   │   Q3: Operation: Track characteristics (e.g., size, motility, fluorescence) across 3 generations. Is heritable variation detected (e.g., >5% trait divergence)?
  │   │   │
  │   │   ├── Yes (Variation detected) → 
  │   │   │     Outcome: A  
  │   │   │     Leaf: **Darwinian-evolution account**  
  │   │   │     *Handles worst: Self-sustaining reaction cycle (lacks replication/variation)*
  │   │   │
  │   │   └── No (No variation) → 
  │   │         Q4: Operation: Apply membrane-sensitive dyes and perturb environment (e.g., osmotic shock). Is a boundary maintaining homeostasis detected?
  │   │         │
  │   │         ├── Yes (Boundary/homeostasis) → 
  │   │         │     Outcome: A  
  │   │         │     Leaf: **Autopoietic account**  
  │   │         │     *Handles worst: Prion (lacks intrinsic boundary/homeostasis)*
  │   │         │
  │   │         └── No → 
  │   │               Outcome: N  
  │   │               Leaf: **Eliminativism**  
  │   │               *Handles worst: Flame (satisfies eliminativism’s "no life" verdict)*
  │   │
  │   └── No (No replication) → 
  │         Q5: Operation: Apply membrane-sensitive dyes and perturb environment (e.g., pH shift). Is a boundary maintaining homeostasis detected?
  │         │
  │         ├── Yes (Boundary/homeostasis) → 
  │         │     Outcome: A  
  │         │     Leaf: **Autopoietic account**  
  │         │     *Handles worst: Prion (lacks intrinsic boundary/homeostasis)*
  │         │
  │         └── No → 
  │               Q6: Operation: Disrupt energy input (e.g., block light/fuel). Upon restoration, does metabolic activity resume autonomously?
  │               │
  │               ├── Yes (Autonomous resumption) → 
  │               │     Outcome: A  
  │               │     Leaf: **Metabolism-first account**  
  │               │     *Handles worst: Flame (lacks autonomous complexity)*
  │               │
  │               └── No → 
  │                     Outcome: A  
  │                     Leaf: **Thermodynamic account**  
  │                     *Handles worst: Flame (non-living dissipative structure)*
  │
  └── No (No metabolism) → 
        Q7: Operation: Apply stimuli (e.g., heat, UV, nutrients) for 24 hours. Retest for metabolism. Is activity detected?
        │
        ├── Yes (Revived) → 
        │     Return to Q1 (now "Yes" branch)
        │
        └── No → 
              Outcome: U  
              Leaf: **Pluralism**  
              *Handles worst: Spore (dormant but "alive" in some frameworks)*
  ```

  ---

  ### Tree Evaluation on Cases
  1. **Self-sustaining reaction cycle (grows/fragments, no replication)**  
     - Q1: Yes (metabolism) → Q2: No (replication) → Q5: ? (Boundary?)  
       - *If boundary/homeostasis*: Autopoietic (A).  
       - *Else*: Q6: ? (Autonomous resumption?)  
         - *If yes*: Metabolism-first (A).  
         - *If no*: Thermodynamic (A).  
     - **Verdict**: Always "alive" (varies by account). *Worst for Darwinian*.

  2. **Spore (no activity for centuries)**  
     - Q1: No → Q7: No → **Pluralism (U)**.  
     - **Verdict**: Undecided. *Handled acceptably*.

  3. **Prion (in sample without host)**  
     - Q1: No (no independent metabolism) → Q7: No → **Pluralism (U)**.  
     - **Verdict**: Undecided. *Worst for Autopoietic* (assumes boundary).

  4. **Flame**  
     - Q1: Yes (metabolism-like) → Q2: No → Q5: No (no boundary) → Q6: No (doesn’t autonomously resume) → **Thermodynamic (A)**.  
     - **Verdict**: Alive (thermodynamic). *Handled poorly by Thermodynamic* (includes non-living).

  5. **Self-replicating program (in spacecraft computer)**  
     - *Not in sample* → Q1: No → Q7: No → **Pluralism (U)**.  
     - **Verdict**: Undecided. *Worst for Darwinian* (if detected, would be "not alive" via eliminativism).

  6. **Mule (tissue sample with replicating cells)**  
     - Q1: Yes → Q2: Yes → Q3: Yes (somatic mutations) → **Darwinian (A)**.  
     - **Verdict**: Alive. *Handled acceptably*.

  ---

  ### Flags
  1. **Indistinguishable Leaves** (same verdict for all measurements):  
     - **Autopoietic account** (both branches) cannot be separated from other "alive" leaves (Darwinian, Metabolism-first, Thermodynamic) if replication/variation is ambiguous.  
     - *Example*: A system with replication but no variation and no boundary (rare) routes to **Eliminativism (N)**, separating it.

  2. **Empty Cells** (no position for an answer combination):  
     - **Q3 (variation) → No → Q4 (boundary) → No** leads to **Eliminativism (N)**. This combination (replication without variation or boundary) is **untried** in practice (no known natural system fits).  
     - *All other paths map to a leaf*.

  ---

  ### Final Notes
  - **Confidence in first split (Q1)**: **Medium**. Metabolism is a common life criterion, but flames and non-biological cycles may yield false positives.  
  - **Branch I’d least defend**: **Eliminativism (Q3→No → Q4→No)**. Replication without variation/boundary is implausible; this leaf may never be used, risking incoherence.  

  This tree balances operational feasibility with philosophical rigor, though no protocol fully resolves "life's" ambiguity. The first split prioritizes metabolism as a practical starting point.
