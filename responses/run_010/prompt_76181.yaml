answer: |-
  Below is a systematic breakdown of possible readings of "a white horse is not a horse" (WH ≠ H), with verdicts on truth status, resilience to objections, and relevance to your seminar debate. Key variables: **copula function**, **term referents**, and **domain of discourse**. Classical Chinese grammar (no number/definiteness marking) expands interpretative scope.

  ---

  ### **I. Copula Functions & Term Referents: Readings & Verdicts**  
  *(Truth: T=true, F=false, TT=trivially true, TF=trivially false, S=substantive, I=indeterminate)*

  | **Copula "is" as...**               | **Terms Refer to...**          | **Reading**                                                                 | **Verdict**         | **Resists Objector?** |  
  |-------------------------------------|--------------------------------|-----------------------------------------------------------------------------|---------------------|-----------------------|
  | **1. Strict identity** (A = B)      | Individual animals             | "This particular white horse ≠ this particular horse" (but all white horses *are* horses) | F (if same object) | Yes (misses the point) |
  | **2. Class membership** (∈)         | Object & kind                  | "A white horse is not a member of the horse-kind"                            | F                   | No (objector refutes) |
  | **3. Kind identity** (≡)            | Universals/kinds               | "The kind *white horse* ≠ the kind *horse*"                                 | TT (kinds differ)   | **Yes**               |
  | **4. Subkind inclusion** (⊆)        | Kinds                          | "White horses are not a subset of horses"                                    | F                   | No (objector refutes) |
  | **5. Intensional identity**         | Concepts/senses                | "The concept WHITE HORSE ≠ the concept HORSE"                                | S/T (senses differ) | **Yes**               |
  | **6. Extensional identity**         | Sets (all horses, all white horses) | "The set {white horses} = the set {horses}"                                 | F                   | No (objector refutes) |
  | **7. Satisfaction identity**        | Request criteria               | "What satisfies 'give me a horse' ≠ what satisfies 'give me a white horse'" | TT                  | **Yes**               |
  | **8. Name identity**                | Words                          | "The word 'white horse' ≠ the word 'horse'"                                 | TT                  | **Yes**               |

  ---

  ### **II. Domain of Discourse: How Context Shapes Readings**  
  | **Domain**          | **Plausible Readings**         | **Verdict**                              |  
  |----------------------|--------------------------------|------------------------------------------|  
  | **Semantics**        | 5 (intensional), 8 (name)      | S/T or TT (non-trivial if about sense)   |  
  | **Metaphysics**      | 2, 3, 4, 6                     | Mix of F/TT (trivial if true)            |  
  | **Pragmatics**       | 7 (satisfaction)               | TT (pragmatic difference)                |  
  | **Linguistic practice** | 5, 8                          | S/T (if about conceptual/naming norms)   |  

  ---

  ### **III. Resilience to Objector's Reply**  
  *Objector: "If there’s a white horse, you cannot say there’s no horse."*  
  - **Refuted readings**: Class membership (2), subkind inclusion (4), extensional identity (6).  
    *Why?* They deny that white horses are horses/subset of horses.  
  - **Unaffected readings**: Kind identity (3), intensional (5), satisfaction (7), name identity (8).  
    *Why?* Objector conflates extension with intension/pragmatics.  

  ---

  ### **IV. Analysis of Seminar Arguments**  
  **A. Classmate's Fregean Claim**  
  - **Supporting readings**: **5 (intensional)** and **7 (satisfaction)**.  
    - Reading 5: WH and H have different *senses* (conceptual content), hence "is" cannot express identity.  
    - Reading 7: Requests differ pragmatically, implying divergent semantic criteria.  
  - **Verdict**: Partially valid. Reading 5 mirrors Frege (sense ≠ reference), but Chinese text lacks explicit semantics. Reading 7 shows pragmatic difference, not necessarily semantic sense.  

  **B. Tutor's Sophistry Claim**  
  - **Supporting readings**: **3 (kind identity)**, **8 (name identity)**, or **7 (satisfaction)** if exaggerated.  
    - Verdict: Plausible. Reading 3 is tautological (kinds ≠ subkinds). Reading 8 reduces to wordplay. Reinforced if historical context emphasizes rhetorical performance.  

  **C. Non-Trivial Truth Without Conflation**:  
  - **Reading 5 (intensional)** is substantive and true *if* terms denote concepts: "horse" = equine essence, "white horse" = essence + accident. Rejects conflation by distinguishing properties.  
  - **Reading 7 (satisfaction)**: Pragmatically non-trivial (different requests ≠ different ontology).  

  ---

  ### **V. Grammatical Nuance & Available Readings**  
  - **No number marking**: Enables:  
    - Generic readings: Readings 3–6 (kinds/concepts).  
    - Particular readings: Readings 1–2 (objects).  
    - Metalinguistic readings: Reading 8 (names).  
  - **Critical implication**: Ambiguity permits **sophistic interpretations** (e.g., shifting between "a white horse" as individual vs. kind) but also **intensional readings** (concepts lack number).  

  ---

  ### **Summary: Seminar Cheat Sheet**  
  | **Reading**                          | **1-Line Verdict**                                  |  
  |--------------------------------------|----------------------------------------------------|  
  | **Strict identity** (individuals)    | False (trivial if objects differ)                  |  
  | **Class membership**                 | False (objector destroys)                          |  
  | **Kind identity**                    | Trivially true (kinds ≠ subkinds) → Sophistry      |  
  | **Subkind inclusion**                | False (objector destroys)                          |  
  | **Intensional identity**             | Substantive/true (senses differ) → Fregean possible|  
  | **Extensional identity**             | False (objector destroys)                          |  
  | **Satisfaction identity**            | Trivially true (pragmatic difference) → Supports classmate |  
  | **Name identity**                    | Trivially true (words differ) → Sophistry          |  

  **Recommendation**:  
  - Challenge your classmate: Pragmatic (7) or intensional (5) readings support *difference*, but not necessarily that "is" *never* expresses identity.  
  - Support your tutor: Readings 3/8 make WH ≠ H tautological or playful, especially given Warring States rhetorical context.  
  - Most defensible non-trivial reading: **5 (intensional)**, though classical Chinese semantics may not distinguish sense/reference explicitly.  

  Bring this grid—it covers all bases without privileging one view.
