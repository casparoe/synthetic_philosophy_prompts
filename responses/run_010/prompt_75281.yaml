answer: |-
  ### **90-Minute Activity: "The House Challenge"**  
  **Goal:** Simulate tight vs. loose institutional trade-offs through a physical task, migration, and environmental shocks. Voting weight for the constitutional draft is determined by group scores.  

  ---

  ### **Setup**  
  - **Materials:** Index cards (100+), 4 whiteboards, markers, deck of cards, kitchen timer.  
  - **Group Split:** Assign students randomly via deck of cards.  
    - **Red cards (♥/♦) → Group A (TIGHT RULES)**  
    - **Black cards (♠/♣) → Group B (LOOSE RULES)**  
  - **Task:** Both groups design a "House Unity Festival" (to be hypothetically hosted after half-term). Outputs are blueprints on whiteboards.  

  ---

  ### **Rule Sheets (Read Aloud Verbatim)**  
  **Hand these sheets to each group without explanation.**  

  #### **GROUP A RULES (Tight)**  
  > "Your group must follow these rules:  
  > 1. **ROLES:** Elect 1 Leader, 1 Scribe, 1 Inspector, and 1 Timekeeper within 5 minutes.  
  >    - **Leader:** Final say on all decisions.  
  >    - **Scribe:** Records everything on the whiteboard.  
  >    - **Inspector:** Ensures no one deviates from rules/task.  
  >    - **Timekeeper:** Tracks time with the kitchen timer.  
  > 2. **PROCESS:**  
  >    - **Planning (15 mins):** Create a step-by-step plan for the festival. Scribe writes it on Whiteboard 1.  
  >    - **Execution (Remaining time):** Build a blueprint using index cards (e.g., stages, food stalls) on Whiteboard 2.  
  > 3. **RESTRICTIONS:**  
  >    - No changes to the plan after the 15-minute planning phase.  
  >    - Only the Leader may speak to the tutor or Group B.  
  >    - Inspector must call out any deviation (e.g., talking out of turn, changing plans).  
  > 4. **SCORING:** Points for precision, completeness, and rule-following."  

  #### **GROUP B RULES (Loose)**  
  > "Your group must follow these rules:  
  > 1. **ROLES:** None assigned. Anyone can do anything.  
  > 2. **PROCESS:**  
  >    - **Planning/Execution (All time):** Design the festival however you want. Use index cards freely.  
  >    - You may use BOTH whiteboards.  
  > 3. **FREEDOMS:**  
  >    - Anyone can change plans at any time.  
  >    - Anyone may speak to the tutor or Group A.  
  >    - No one may enforce rules on others.  
  > 4. **SCORING:** Points for creativity, uniqueness, and group enthusiasm."  

  ---

  ### **Timeline (90 Minutes Total)**  
  #### **Phase 1: Initial Task (40 Minutes)**  
  - **0–5 min:** Assign groups via card draw. Hand out rule sheets. Announce:  
    > *"Design a House Unity Festival. Use your rules. The winning group gets extra voting weight for our house constitution. I’ll score your final blueprints."*  
  - **5–40 min:** Groups work. **Tutor enforces rules strictly for Group A** (e.g., "Leader, your group must vote on that change!"). For Group B, only intervene if they’re inactive.  

  #### **The SHOCK (Minute 40)**  
  - **Trigger:** Set a loud kitchen timer. Announce neutrally:  
    > *"Heads up: The school just announced this festival must include a ‘Cultural Exchange Corner’ with activities from 3 countries. Also, half your index cards are now ‘damaged’—only 20% can be used for building. You have 2 minutes to absorb this."*  
    - **Why this works:** Tight Group A’s rigid plan is disrupted; Loose Group B adapts faster. Feels organic, not staged.  

  #### **Phase 2: Adaptation & Migration (30 Minutes)**  
  - **40–42 min:** Announce migration rules:  
    > *"Anyone may move to the other group now. You have 3 minutes to decide. If you move:  
    > - You lose your current group’s work.  
    > - The new group must vote (majority) to accept you.  
    > - Only 5 migrants total allowed."*  
  - **42–45 min:** Migration window. **Observe:** Does Group A reject migrants to protect their plan? Does Group B accept everyone?  
  - **45–70 min:** Groups revise plans with new constraints.  

  #### **Scoring & Wrap-up (20 Minutes)**  
  - **70–75 min:** Groups present blueprints. **Score publicly** (see rubric below).  
  - **75–90 min:** Debrief (structure below).  

  ---

  ### **Scoring Rubric**  
  | **Criteria**               | **Group A (Tight)**                           | **Group B (Loose)**                         |  
  |----------------------------|---------------------------------------------|-------------------------------------------|  
  | **Phase 1 (40%)**          | Precision, rule-following, clarity.         | Creativity, participation, energy.        |  
  | **Phase 2 (60%)**          | Adaptability to shock, quality of revisions. | Innovation, inclusion of migrants.        |  
  - **Voting Weight:** Winning group gets 60% weight in constitution draft; losers get 40%.  

  ---

  ### **Predictable Problems & Solutions**  
  1. **"Clever Boy" Detects Design:**  
     - If he speaks up: *"Interesting theory—prove it by playing it out. Your group needs you."* Redirect to task.  
  2. **Factional Hostility:**  
     - Random assignment prevents self-segregation. If arguing: *"Your rules require you to [vote/focus]—use your process."*  
  3. **Group A Rejects All Migrants:**  
     - **Use this!** Highlight in debrief: "What if someone *needs* to leave a tight system? Can they?"  
  4. **Group B Chaotic:**  
     - Let them fail. Ask later: *"Did too much freedom hurt your output?"*  
  5. **Time Crunch:**  
     - Cut Phase 2 by 5 mins if needed. Prioritize debrief.  

  ---

  ### **Debrief Framework**  
  **Goal:** Link activity to real-world tensions without jargon until the end.  

  #### **Questions to Ask:**  
  1. **"Group A: How did your rules help/hurt your work? What about after the shock?"**  
     - *Listen for:* Efficiency vs. frustration, fear of deviation.  
  2. **"Group B: What was liberating? What was chaotic?"**  
     - *Listen for:* Creativity vs. indecision, handling freeloaders.  
  3. **"Migrants: Why did you move? Was it fair that Group A could vote you out?"**  
     - *Key:* "Who gets to decide if exit is allowed?"  
  4. **"Did one group’s rules fit better pre-shock? Post-shock? Why?"**  
     - *Reveal:* "In psychology, this is ‘tight’ vs. ‘loose’ cultures. Tight groups coordinate well in stable times but resist change. Loose groups adapt fast but may lack focus."  

  #### **Connect to House Conflict:**  
  - "In March, our house faced a ‘threat’ (tight rules). Now, the threat is gone. **Who decides what the ‘threat’ is?**"  
  - "When Group A blocked migrants, was that fair? What if leaving weakens the group?"  
  - "Can a group be *too* loose? What did that look like today?"  
  - "Real tight systems feel legitimate—not arbitrary like my rules. How do we build rules that *you* believe in?"  

  #### **Close:**  
  > "Your constitution isn’t about choosing tight or loose. It’s about:  
  > - Who calls the ‘threat’?  
  > - How do we shift when threats change?  
  > - Can we allow exit without collapse?  
  > Bring these questions into your drafting."  

  ---

  ### **What the Activity Can’t Simulate**  
  - **Internalized Legitimacy:** Your imposed rules feel artificial; real tight systems rely on shared belief. **Say this explicitly in debrief:**  
    > *"Last year’s rules felt forced on you—that’s why they bred resentment. A constitution you draft yourselves can create buy-in, but only if it feels fair. That’s your challenge."*  

  **Final Tip:** Stay neutral during the activity. Label behaviors (*"Group A, your Inspector called a deviation"*), not judgments. Use the chaos—it’s data for the debrief. Run it tight on time, and they’ll feel the trade-offs in their bones.
