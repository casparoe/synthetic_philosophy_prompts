prompt: |-
  2L in a war-crimes seminar and today's discussion basically turned into a slogan fight. One guy kept repeating nullum crimen sine lege, nulla poena sine lege and using it to argue that charging the defendants at Nuremberg with crimes against peace was flat out illegitimate, because the London Charter criminalized aggression after the invasions had already happened. Another guy said that maxim isn't a binding rule at all, just a vague principle of justice, so it can't possibly get the first guy what he wants — which is more or less the line the tribunals themselves took when they brushed the objection off. Both of them walked out thinking they'd won, and I'm not sure either of them said anything determinate.

  Play the role of a philosopher of criminal law who also actually knows the history of these tribunals (including the Tokyo one, where at least one judge thought the whole proceeding was retroactive lawmaking). I want a menu, not a verdict: lay out the distict principles that one line of Latin could be standing for here. E.g. is it demanding a pre-existing written text, or only that the norm was ascertainable/foreseeable to the actor; does customary or treaty-based international law count as "lex" at all; is there a separate no-analogy or no-extension clause doing work; do the two halves (crime vs. punishment) actually pull apart when the penalty wasn't specified in advance; and is the real objection about the law or about the court that's applying it?

  For each reading, tell me whether it's plausible on its own terms and whether it would actually support my classmate's conclusion about crimes against peace. Brainstorm the possible readings first, think carefully about which ones collapse into each other, then sort them from trivial truism to substantive-but-defensible to false, and finish with which reading each of those two guys was probably invoking without realizing it. No bibliography or citations please — I just want the conceptual map.
reasoning: |-
  Okay, the user is in a war-crimes seminar where a debate broke out about the Nuremberg Trials and the principle of "nullum crimen sine lege, nulla poena sine lege." One classmate argued that charging defendants with crimes against peace was illegitimate because the London Charter criminalized aggression after the fact. Another countered that the maxim is just a vague principle, not a binding rule. Both left thinking they won, and the user is confused. They want me to play a philosopher of criminal law to break down the possible interpretations of that Latin maxim without giving a verdict, just a conceptual map.

  First, I need to unpack that Latin phrase. "Nullum crimen sine lege" means no crime without law, and "nulla poena sine lege" means no punishment without law. The core idea is to prevent arbitrary prosecution by requiring that laws exist before an act is deemed criminal. But as the user pointed out, it's not straightforward—there are nuances like what counts as "lex" (law), how foreseeable the law must be, and whether this applies to international tribunals.

  The user wants a menu of distinct principles. So, I should brainstorm all possible interpretations. Let me start by listing them. First, the strictest view: pre-existing written statute. That means a formal, codified law must be in place before the act. If applied to Nuremberg, crimes against peace wouldn't count since the London Charter came after WWII. But is this plausible? In domestic law, it might be, but international law often relies on customs and treaties, not just statutes. Plus, the Allies argued that aggression was already illegal under treaties like the Kellogg-Briand Pact. So this reading might be too rigid for international contexts, making it substantive but debatable.

  Next, a broader view: pre-existing legal norm, which could include customary international law or treaties. Here, "lex" isn't just written statutes but established norms. The Nuremberg prosecutors cited pre-war treaties and state practices to show that aggression was already criminal. If that's accepted, then the charge isn't retroactive. This seems defensible because international law evolves differently. It supports the tribunals' stance and undermines the first classmate's argument.

  Then there's the foreseeability requirement. The focus shifts to whether the defendant could reasonably know the act was criminal. For aggression, was it foreseeable? The Allies said yes, pointing to condemnations of wars like Japan's invasion of Manchuria. But defendants might argue it wasn't clear, especially since no one was prosecuted before. This is a softer, more equitable interpretation. It's defensible but fuzzy—how do we measure foreseeability? This might not fully support either side, as it depends on evidence.

  Another angle is the source of the norm: does it have to be treaty-based, or can customs suffice? International law recognizes both, so if customs count, Nuremberg's charges might hold. But if only treaties matter, then it's shakier because pre-1945 treaties didn't specify individual criminal responsibility. The Tokyo judge who dissented probably held this view, seeing customs as insufficient for new crimes. This reading is substantive but contested.

  I should also consider the no-analogy or no-extension clause. That means laws can't be stretched by analogy to cover new acts. At Nuremberg, they didn't analogize; they claimed aggression was directly prohibited. So this doesn't apply strongly here. It's more relevant to domestic systems like civil law.

  Additionally, the separation of crime and punishment halves. The user asked if they pull apart when penalties aren't specified. For crimes against peace, the law defined the crime but left punishment to the tribunal's discretion. If "nulla poena" requires pre-defined penalties, then the punishment aspect might be retroactive, even if the crime wasn't. This could partially support the first classmate but not fully invalidate the trial.

  Lastly, the objection might be about the court itself—whether an international tribunal can apply new laws fairly, especially victors judging the vanquished. This isn't directly about retroactivity but about legitimacy. The Tokyo dissenter likely focused here. It's a separate critique.

  Now, to sort these interpretations. The trivial truism: the maxim means laws shouldn't be retroactive in an arbitrary way—everyone agrees on that. The substantive but defensible ones include pre-existing legal norms (customs/treaties) and foreseeability, which align with Nuremberg's reasoning. The false or extreme views are strict written statutes and requiring pre-defined penalties, as they ignore international law's nature.

  For the classmates: the first guy probably invoked the strict written statute view, ignoring customs. The second guy saw it as a vague principle, emphasizing its flexibility and the role of justice, which matches the tribunals' approach.

  I need to ensure the response is structured as a menu, clear and conceptual, without citations. Highlighting the collapse of some readings, like how foreseeability ties into legal norms. Also, address the user's deeper need: they want clarity on a heated debate, to understand the principles without bias, and to see why both sides might feel right. They might be seeking intellectual tools for future discussions or exams.
answer: |-
  Here's a conceptual map of the "nullum crimen sine lege" (NCSL) principle, dissected into its potential meanings and applied to the Nuremberg/Tokyo "crimes against peace" debate. Think of these as overlapping lenses, not always mutually exclusive, but emphasizing distinct concerns:

  **The Core Concern:** Preventing arbitrary state power by requiring *some* form of prior legal authority for criminalization and punishment.

  **Distinct Principles NCSL Could Represent:**

  1.  **Pre-Existing Written Statute ("Black Letter Law"):**
      *   **Meaning:** Requires a specific, codified national or international statute explicitly defining the crime *and* its punishment, enacted *before* the act occurred.
      *   **Plausibility:** Strong in modern domestic criminal law (especially civil law systems), appealing to clarity and predictability. Rooted in Enlightenment ideals.
      *   **Supports Classmate #1?** **Strongly.** The London Charter (Aug 1945) explicitly created "crimes against peace" *after* WWII invasions. No specific pre-existing *statute* criminalized "aggression" for *individuals* with defined penalties. *Verdict:* **Substantive-but-Contestable**. Ignores sources of law beyond statutes, especially in the international realm pre-1945.

  2.  **Pre-Existing Legal Norm (Customary/Treaty as "Lex"):**
      *   **Meaning:** "Lex" encompasses binding international law norms existing *before* the act, derived from treaties or state practice/custom. The norm must prohibit the *conduct*, even if individual criminal responsibility wasn't explicitly codified.
      *   **Plausibility:** Highly defensible for international law. Treaties (e.g., Kellogg-Briand Pact 1928 renouncing war) and widespread state condemnation of aggression (e.g., League responses to Manchuria, Ethiopia) arguably created a *norm* against aggressive war.
      *   **Supports Classmate #1?** **No.** This was the core of the Nuremberg Tribunal's reasoning: Aggression was already illegal under international law pre-1939; the Charter merely codified existing norms for *adjudication*. *Verdict:* **Substantive-and-Defensible** (the mainstream international law view justifying Nuremberg).

  3.  **Foreseeability/Ascertainability:**
      *   **Meaning:** Focuses on the *actor's perspective*. Was the criminal nature of the conduct reasonably knowable or foreseeable to the defendant *at the time* based on available legal sources (statute, custom, general principles)? Less about the formal source, more about fair warning.
      *   **Plausibility:** A core element of the *principle of legality* in modern human rights law (e.g., ECHR). Addresses the fundamental fairness concern underlying NCSL.
      *   **Supports Classmate #1?** **Ambivalent.** Prosecutors argued leaders knew aggressive war was condemned and illegal; the leap to *individual criminal* responsibility might be less foreseeable. Justice Pal (Tokyo) heavily emphasized the lack of foreseeability. *Verdict:* **Substantive-and-Defensible**, but its application to 1930s/40s leaders is highly debatable.

  4.  **Prohibition of Analogy/Extension (Strict Construction):**
      *   **Meaning:** Laws must be interpreted strictly; crimes cannot be created or significantly extended by judicial analogy to cover conduct not clearly encompassed by the pre-existing norm's core meaning.
      *   **Plausibility:** Strong in civil law domestic systems. Protects against judicial overreach.
      *   **Supports Classmate #1?** **Weakly.** Nuremberg argued applying the existing *norm* against aggression to *individual leaders* wasn't analogy but a necessary consequence/development of the norm itself. The conduct (waging aggressive war) was clearly prohibited for *states*. *Verdict:* **Substantive-but-Weak Application Here.** The debate is more about the source/nature of the norm than its interpretation.

  5.  **Separation of "Crimen" and "Poena" Halves:**
      *   **Meaning:** The principle has two distinct parts: 1) No crime without law, 2) No punishment without law. The punishment must also be pre-defined or at least constrained (e.g., maximum penalty known).
      *   **Plausibility:** Logically sound. Fairness demands knowing not just *if* something is a crime, but *what* the potential consequences are.
      *   **Supports Classmate #1?** **Partially on "Poena".** The *crimes* were defined in the Charter (arguably based on pre-existing norms). However, the *penalties* (death or "other punishment") were broad and discretionary. Pre-existing IHL largely dealt with state responsibility, not individual penalties for aggression. *Verdict:* **Substantive.** The "poena" half is often the weaker link in retroactivity claims, especially for novel international crimes.

  6.  **Objection to the Applying Forum ("Victor's Justice"):**
      *   **Meaning:** The core objection isn't strictly temporal retroactivity, but the *illegitimacy of the tribunal itself* creating/applying the law *ex post facto*, especially where victors judge the vanquished. The Latin phrase becomes a shorthand for this broader procedural/jurisdictional unfairness.
      *   **Plausibility:** Captures a major historical criticism (Pal in Tokyo, later scholars). Questions the neutrality of the law-creation process.
      *   **Supports Classmate #1?** **Yes, Indirectly.** Charging the defendants only *after* defeat, under laws crafted by the victors, *feels* fundamentally unfair and retroactive, regardless of pre-existing norms. The Latin phrase expresses this grievance. *Verdict:* **Substantive Critique,** though conceptually distinct from pure retroactivity. This was likely Pal's core concern.

  7.  **Trivial Truism (Minimal Core):**
      *   **Meaning:** The absolute bare minimum: the state cannot punish someone for conduct that was *completely lawful* when done, purely based on whim. *Some* identifiable standard must have been violated.
      *   **Plausibility:** Universally accepted as the absolute core of the principle. Even Hobbes acknowledged this minimum.
      *   **Supports Classmate #1?** **No.** No one argued aggressive war was *lawful* pre-1945; the debate was about the *nature* and *enforceability* of the prohibition (state vs. individual responsibility). *Verdict:* **Trivial Truism.** Everyone agrees on this; it doesn't resolve the hard case.

  **Collapsing Points:**
  *   **1 into 2/3:** A strict "written statute" advocate (1) would reject 2 (custom/treaty) and likely find 3 (foreseeability based on custom) insufficient. However, 2 and 3 often work together – the existence of a customary norm *is* what makes the conduct foreseeable/ascertainable.
  *   **2/3 into 6:** The argument that pre-existing norms *weren't* sufficiently clear or binding for *individual criminal liability* feeds directly into the "victor's justice" critique (6) – the victors *decided* that the norms *did* support individual liability only after winning.
  *   **4 into 1/2:** Prohibiting analogy (4) is easiest to enforce with a clear written statute (1). Applying it to customary law (2) is much messier.

  **Sorting the Readings:**

  1.  **Trivial Truism:** #7 (Minimal Core).
  2.  **Substantive-but-Defensible:** #2 (Pre-Existing Legal Norm - Treaty/Custom), #3 (Foreseeability/Ascertainability), #5 (Separation of "Crimen" and "Poena" - especially the "poena" concern).
  3.  **Substantive-but-Contestable/Weak in this Context:** #1 (Pre-Existing Written Statute - too rigid for IL), #4 (Prohibition of Analogy - weak application here), #6 (Objection to Forum - powerful critique, but distinct from pure legality).
  4.  **False (in the sense of being universally rejected):** None reach "false," but #1 is arguably false *as a requirement for international law in 1945*. The claim that *no* pre-existing norm prohibited aggression (#7) *would* be false.

  **What Your Classmates Were Probably Invoking (Unconsciously):**

  *   **Classmate #1 (Illegitimate Charges):** Primarily invoking **#1 (Pre-Existing Written Statute)**. He likely implicitly rejected **#2 (Custom/Treaty as "Lex")** for creating *new individual crimes*. There's also a strong element of **#6 (Objection to Forum/Victor's Justice)** – the sense that this was *invented* by the winners after the fact. He might also lean on the unforeseeability aspect of **#3** regarding individual liability and the weakness of **#5 (Poena)**.
  *   **Classmate #2 (Vague Principle):** Primarily invoking the **#2 (Pre-Existing Legal Norm)** reading that the Tribunal itself used, emphasizing that "lex" includes custom/treaty. He's also invoking the **Trivial Truism (#7)** to downplay its force, and implicitly relying on the **#3 (Foreseeability)** argument that aggressive war leaders *should* have known it was profoundly wrong/illegal. His "vague principle" comment suggests he sees it as part of a broader notion of fairness (**#3, #6**) rather than a strict technical rule (**#1, #4**).

  **Conclusion:** NCSL is a chameleon. Your first classmate fixated on its most formal, restrictive interpretation (#1), viewing international law through a domestic statute lens. Your second classmate embraced its most flexible, normative interpretations (#2, #3), aligning with the tribunals' view that existing international norms provided sufficient "lex" and that the defendants had fair warning. The debate persists because both interpretations touch on genuine, unresolved tensions in international criminal law: the sources of law, the role of custom, foreseeability for leaders, the legitimacy of *ex post facto* tribunals, and the balance between justice and strict legality after cataclysmic events. Neither "won" absolutely; they were arguing past each other using different definitions of "lege."
