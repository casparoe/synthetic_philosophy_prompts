  On the hard bits:
  - One-off law is doctrinal anomaly. Creates precedent without institutionalizing power. Future emperors lose agency but gain political headache.
  - Voice bypasses ministerial brakes entirely. Doctrine has no countermeasure because it assumes sovereign acts through ministers. Dangerous gap.
  - Cross-country comparison kills doctrine's universality pretense. Dutch routinization vs UK's 1936 trauma shows local conventions trump abstract principles.

  User's clearly frustrated with doctrine's rigidity. Rightly so - it's ill-equipped for 21st C symbolic sovereignty. The "voice" vector needs theorizing.

