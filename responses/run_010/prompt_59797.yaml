prompt: |-
  I want a case analysis, not a history lesson. The episode: Emperor Akihito of Japan and the 2016–2019 abdication. I've got the timeline down already, so don't recap it — here's what I'm working from, correct me only if I've got something wrong:

  - The Imperial Household Law has no abdication provision. The emperor reigns until death; the last actual abdication in Japan was in 1817.
  - July 2016, NHK reports he wants to step down in a few years; the Imperial Household Agency pushes back hard and calls the report unrealistic.
  - 8 August 2016 he goes on television with a short address about his age, his health, and the difficulty of carrying out his duties. He never says the word abdicate, adn he never asks for anything, because the constitution bars him from politics — article 4 says he "shall not have powers related to government," and article 3 requires cabinet advice and approval for all his acts in matters of state.
  - Abe's government convenes panels, and in June 2017 the Diet passes a one-off law for him personally — a special exception to the Household Law, the title Emperor Emeritus, the date to be set later by cabinet order. One small party abstains on the grounds that this should have been a general amendment. The Diet attaches a non-binding resolution about the shrinking imperial family and the succession rules.
  - He abdicates 30 April 2019; Naruhito accedes the next day.

  The theory I want it run through is the standard doctrine of constitutional monarchy in a democracy: the sovereign has no personal political power, acts only on ministerial advice, stays neutral, and whatever influence he has is private, indirect and unaccountable-but-harmless. Call it Bagehot's split between the dignified and the efficient parts, plus the sovereign's three rights to be consulted, to encourage and to warn.

  Start by pinning the mapping down, because I think most commentary skips it: at each step, who is the player (Emperor, Household Agency, Cabinet, Diet), what were his real options, and what would each option have looked like judged by the doctrine.

  Then here's my own coinage and I want you to test it rather than flatter it. The doctrine seems to analyze only two things: what the monarch can *do* (powers) and who he must act *through* (channels). It has no vocabulary for the third: what the monarch can *say*, and to whom (voice). On that triad Akihito did nothing with powers, nothing outside channels, and everything with voice — he addressed the people directly and a law got written. Is the triad a real distinction doing explanatory work here, or am I just relabelling the old claim that the dignified part shapes public opinion? And does article 1's symbol clause — position derived from the will of the people — actually hand the Emperor a channel straight to that same people, one the framers assumed they'd closed off?

  Harder bits, don't dodge these:

  - Feature or bug, the one-off law? It stops any emperor acquiring a general right to exit at will, wich would be a genuine power; but it turns every future aging emperor's health into ad hoc political bargaining. Which reading survives contact with what the Diet actually did?
  - The doctrine's normal brake on an overstepping monarch is that ministers refuse the advice or resign. Here nobody refused anything, because nothing was asked for. Does that show the brake is useless against voice, or that no brake was needed?
  - Run the same sequence in the Netherlands, where stepping down at 75 is routine, and in the UK, where there's no abdication procedure at all and 1936 required its own Act. Does the analysis change, or does it suggest the doctrine does no work and local convention carries everything?

  Be explicit about where the doctrine is silent instead of making it speak. No bibliography, no reading list, no further resources — just the argument.

  End with one line in exactly this form:

  Verdict: <CONFIRMS | ANOMALY | UNANTICIPATED> — <ten words or fewer on what the episode does to the doctrine>
