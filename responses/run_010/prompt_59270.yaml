  *   **Structure:** 18 lines in 6 unrhymed tercets.
  *   **Meter:** Steady free verse, aiming for 10-12 syllables per line.
  *   **Core Constraint:** The third line of each tercet (starting with "The third position holds...") differs from the previous third line by exactly one word change.
  *   **Mutation Sequence:**
      1.  holds a looser sway.
      2.  bears a lighter touch. (holds -> bears; looser -> lighter; sway -> touch)
      3.  bears a muted touch. (lighter -> muted)
      4.  bears a hidden touch. (muted -> hidden)
      5.  bears a knowing touch. (hidden -> knowing)
      6.  The mitochondrial position holds its sway. (The third -> The mitochondrial; bears -> holds; knowing -> its; touch -> sway) *This is the disruptive sixth change.*
  *   **Title:** "Wobble Position" acts as a further alteration of the mutable line's concept.

  **Content Execution:**
  *   **Exactitude:** References helix grooves (DNA structure), codon binding, strict first two bases ("clamp their sense precise"), wobble position ("looser sway," "lighter touch"), redundancy ("Redundancy pools here"), silent substitutions ("seemingly unchanged," "selfsame charge").
  *   **Beyond Silent:** Implies downstream effects ("currents stir beneath," "ribosome’s pace," "nascent fold’s first bend," "transcript’s fate," "register the shift," "knowing touch") without naming mechanisms.
  *   **Disruptive Change (6th Tercet):** Shifts context to mitochondria ("ancient code"), states the same triplet means something different ("speaks a different name"), and alters the core line dramatically ("The mitochondrial position holds its sway"), implying context-dependence ("whoever is doing the reading").
  *   **Avoidance:** No explicit debate on DNA as code, no moralizing. Stops with the formal shift in meaning and context.
  *   **Accessibility:** Coherent as a poem about a flexible position in a code allowing variation with subtle consequences, culminating in a context-dependent meaning shift. Experts recognize wobble, redundancy, codon usage effects, and mitochondrial code deviations.
