answer: |-
  ## Wobble Position

  Three grooves carve the helix’s inner turn.
  Each codon locks its meaning, base by base.
  The third position holds a looser sway.

  The first two letters clamp their sense precise,
  demanding recognition, sharp and clear.
  The third position bears a lighter touch.

  Redundancy pools here, a quiet well
  where differing scripts still yield the selfsame charge.
  The third position bears a muted touch.

  The amino acid settles, seemingly unchanged,
  yet currents stir beneath the surface calm.
  The third position bears a hidden touch.

  The ribosome’s pace, the nascent fold’s first bend,
  the transcript’s fate – all register the shift.
  The third position bears a knowing touch.

  For mitochondria, in ancient code,
  the selfsame triplet speaks a different name.
  The mitochondrial position holds its sway.

  ---

