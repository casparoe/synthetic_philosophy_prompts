  ### Decision Tree for Commitment Strategies in Bargaining and Conflict  
  Based on the student societies case: Debate Union (DU) and Film Club (FC) compete for the main hall on Friday night. Binding requires a non-refundable £300 deposit, publicly posted. Outcomes:  
  - **Win**: You book alone (get hall, pay deposit).  
  - **Split**: Neither books (joint event, no cost).  
  - **Lose**: Opponent books alone (you run small event, no cost).  
  - **Wreck**: Both book (voided, both lose deposit).  
  Payoff order: Win (4) > Split (3) > Lose (2) > Wreck (1).  

  **Tree Structure**  
  Start at the top. Answer each node based on the case. Nodes are framed as yes/no questions about your situation.  

  #### Node 1: Has the other player already paid the deposit and publicly bound themselves to book?  
  - **Yes** → Go to Node 2.  
  - **No** → Go to Node 3.  

  *(Rationale: The race to commit first is critical. If the other is already bound, your options shrink dramatically. This split ensures we handle "too late" scenarios early.)*  

  #### Node 2 (If other is already bound): Do you care more about punishing them or cutting your losses?  
  - **Yes, I want to punish them (even if it costs me)** → Leaf A: **"Mutual Destruction"**  
    - Buys: You deny them a clean win and force shared pain.  
    - Backfires: Guarantees wreck when you bind (both lose deposits, no hall).  
  - **No, I want to minimize my loss** → Leaf B: **"Strategic Retreat"**  
    - Buys: You avoid wreck and run a smaller event (lose outcome).  
    - Backfires: You lose the hall and publicly concede defeat.  

  *(Rationale: Once the other is bound, binding yourself isn't a strategy—it's a choice between two bad outcomes. This separates emotional retaliation from pragmatic loss-cutting.)*  

  #### Node 3 (If other is NOT bound yet): Are you binding yourself mainly to control your own future actions or to influence the other player?  
  - **Control my own actions (e.g., I fear I'll chicken out later)** → Go to Node 4.  
  - **Influence the other player (e.g., I want them to back down)** → Go to Node 5.  

  *(Rationale: This is the key split between self-control (Ulysses) and strategic commitment. It must come after Node 1 because self-control only matters when you have time to act. Earlier would conflate motives with timing.)*  

  #### Node 4 (Self-control focus): How extreme is your fear of weakness?  
  - **High: I need total prevention of backtracking** → Leaf C: **"Hand it to an Agent"**  
    - Buys: An uncontrollable third party (e.g., rigid committee) binds for you, eliminating temptation.  
    - Backfires: If the other binds simultaneously, wreck occurs; or if the agent acts slowly, you lose.  
  - **Moderate: I can use public pressure to deter weakness** → Leaf D: **"Loud Promise"**  
    - Buys: Announcing binding intent (e.g., social media post) makes yielding socially costly.  
    - Backfires: If you quietly yield later, you lose credibility; if the other ignores it and binds, you face wreck or loss.  

  *(Rationale: Self-control strategies focus on internal discipline. "Hand it to an Agent" is the purest form, while "Loud Promise" relies on reputation.)*  

  #### Node 5 (Strategic focus): How much time is left before the deadline?  
  - **Plenty of time (e.g., days)** → Go to Node 6.  
  - **Little time (e.g., minutes)** → Go to Node 7.  

  *(Rationale: Timing affects feasibility of complex tactics. Abundant time enables conditioning or escalation; scarcity forces simplicity.)*  

  #### Node 6 (Plenty of time): Can you afford to start small and escalate?  
  - **Yes, I can make incremental threats** → Leaf E: **"Escalate Slowly"**  
    - Buys: Reversible steps (e.g., partial deposits, public warnings) test resolve without full commitment.  
    - Backfires: If the other calls your bluff early, you lose; or if they race to bind first, you face wreck.  
  - **No, I need one decisive move** → Leaf F: **"Burn Bridges"**  
    - Buys: Bind irreversibly now (e.g., pay deposit) so yielding costs more than holding firm.  
    - Backfires: If the other binds simultaneously, wreck occurs; or if they never intended to fight, you overpaid.  

  #### Node 7 (Little time): Are you willing to gamble?  
  - **Yes, I'll embrace randomness** → Leaf G: **"Public Coin Flip"**  
    - Buys: Randomly bind/not-bind in public (e.g., live stream a draw) to force shared uncertainty.  
    - Backfires: If you flip "bind" and the other binds too, wreck; if "not-bind," you risk loss.  
  - **No, I want certainty** → Leaf H: **"Fold Early"**  
    - Buys: Concede loudly (e.g., public withdrawal) to avoid risk and secure lose outcome.  
    - Backfires: You lose the hall and signal weakness, encouraging future bullying.  

  *(Rationale: With no time for conditioning, you default to high-risk (random) or low-reward (concede) options. "Fold Early" is strategic surrender.)*  

  #### Node 8 (From Node 6 or 7): Can you make your commitment conditional on their action?  
  - **Yes, I can set "if-then" rules** → Leaf I: **"Conditional Threat"**  
    - Buys: Commit to a rule (e.g., "I’ll only book if they haven’t by noon") via an agent or contract.  
    - Backfires: If they bind just before your deadline, you lose; or if your agent misreads, wreck occurs.  
  - **No, I must act unconditionally** → (Loop back to apply Leaf F or G, as conditional isn't feasible).  

  *(Rationale: Conditional strategies are often subsumed in earlier nodes (e.g., "Escalate Slowly" implies conditionality), but this node captures explicit rule-based commitments.)*  

  ---

  ### Key Features of the Tree  
  - **Nodes**: 8 (1 root, 7 internal).  
  - **Leaves**: 9 (A–I).  
  - **Covered Strategies**:  
    - Binding to make yielding costly: Leaf F ("Burn Bridges").  
    - Conditional rule: Leaf I ("Conditional Threat").  
    - Handing to an agent: Leaf C ("Hand it to an Agent").  
    - Making yourself unreachable: Not included (infeasible in this public-binding case).  
    - Announcing reversible commitment: Leaf D ("Loud Promise").  
    - Escalating steps: Leaf E ("Escalate Slowly").  
    - Committing randomly: Leaf G ("Public Coin Flip").  
    - Conceding early: Leaf H ("Fold Early").  

  **Indistinguishable Leaves**:  
  - Leaf F ("Burn Bridges" – real binding) and Leaf D ("Loud Promise" – announced bluff) appear identical to the other player *until the deadline*. If you announce binding but don’t pay, they might mistake it for Leaf F. This is a **real defect** because players can’t verify deposits instantly. The tree can’t fix it—it’s inherent to public announcements.  

  **Dead Ends/Empty Combinations**:  
  - **Node 2 "No" to punishment**: Only leads to Leaf B ("Strategic Retreat"). If you answer "Yes" to punishment but then choose not to bind, it’s incoherent—you can’t punish without binding. Marked as **incoherent** and excluded.  
  - **Node 8 "No" to conditional**: Loops back to earlier leaves. Not a dead end, but **unattractive** as it limits options.  
  - **No self-control for "influence"**: If you pick Node 5 (influence) but wish for self-control, it’s **unoccupied**—no strategy does both.  

  ---

  ### Stress Test: Labor Strike Negotiation  
  **Case**: Union vs. Management. Both can commit to strikes/lockouts publicly. Outcomes:  
  - **Win**: Opponent concedes to your demands.  
  - **Split**: Compromise deal.  
  - **Lose**: You concede.  
  - **Wreck**: Strike/lockout occurs (costly for both).  

  **Re-run**:  
  - Node 1: Management not bound → Node 3.  
  - Node 3: Union wants to influence management → Node 5.  
  - Node 5: Deadline approaching → Node 7.  
  - Node 7: Union gambles → Leaf G ("Public Coin Flip").  
    - *Result*: Same leaf as in the hall case. Randomisation forces mutual uncertainty.  
  - **Misfire?** No—it works. But if we force Node 6 ("Escalate Slowly"), it misfires at **Node 8** because unions often use conditional threats (e.g., "strike if no deal by Friday"), which is Leaf I. In the hall case, conditionality is rare.  

  ---

  ### Confidence and Critique  
  **Confidence**: 85%. The tree carves the space at the joints by:  
  - Prioritizing the **race to commit** (Node 1) and **motive split** (Node 3), which are fundamental.  
  - Using plain-English nodes anchored in the case, avoiding theory-laden terms.  
  - Covering core strategies without overloading.  

  **Least Sure About**: Node 3 (self-control vs. strategic). In practice, motives blur—e.g., "Burn Bridges" (Leaf F) could serve both goals. But separating them clarifies intent, which affects choice (e.g., self-control avoids "Loud Promise" if reputation is weak).  

  **Game Theorist Critique**: A theorist might argue the tree ignores **equilibrium effects**. For example:  
  - In Node 1 (other not bound), binding first (Leaf F) assumes the other won’t simultaneously bind. In reality, both might race to bind, increasing wreck risk. The tree treats this as a "backfire" but doesn’t model the probability.  
  - **Fix**: Add a node like "Do you expect them to bind if you delay?" but this requires predicting behavior, violating the "no smuggled concepts" rule.  

  **Final Note**: This tree is a practical tool, not a complete model. It helps students map options to outcomes in tangible cases like the hall booking. Use it to spark debate—not end it.
