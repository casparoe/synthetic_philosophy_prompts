  ### Derivation: Credences for Sub-Questions  
  Proposition G depends on six sub-questions. I assign credences based on philosophical, economic, and decision-theoretic considerations. Each credence represents the probability that the sub-claim *supports G* (e.g., \( P(\text{G true} | \text{sub-claim true}) \)).  

  1. **Norms of rationality can constrain ends, not just serve them**  
     *Credence: 0.45*  
     Instrumental rationality (e.g., Humean views) dominates economics: rationality serves preferences. But Kantian/objective views (e.g., Scanlon, Parfit) argue rationality can forbid self-destructive ends. G requires this, but it’s contested. Economics typically rejects it (hence low weight), while philosophy is split.  

  2. **Non-ergodicity (ensemble vs. time average) has normative weight for a single agent**  
     *Credence: 0.80*  
     For a single agent living one life, the time-average growth rate (wealth trajectory) matters more than the ensemble average (expected wealth). Peters (2019) shows ergodicity breaking implies different goals. Ruin probabilities for a single path are normatively salient (e.g., survival > expectation). High credence as this is G’s core argument.  

  3. **Real decisions fit the form: repeated, multiplicative, absorbing ruin**  
     *Credence: 0.30*  
     Many real decisions (e.g., financial investing, R&D) are multiplicative with no re-entry. But most life choices (careers, health) are additive, non-repeated, or allow recovery. Absorbing ruin is rare (e.g., bankruptcy isn’t always final). Low credence as this idealization often fails.  

  4. **Growth-rate max isn’t EU-max under log utility in disguise (or if so, it’s not reducible to tastes)**  
     *Credence: 0.55*  
     Mathematically, maximizing \( E[\log(1 + f \cdot X)] \) *is* EU-max under log utility. But G claims this is *rationally required*, not a "taste." If log utility is uniquely rational for repeated bets (e.g., because it avoids ruin), it constrains preferences. Split credence: equivalence is true, but normativity is debatable.  

  5. **Need to estimate odds/payoffs doesn’t destroy normative claim**  
     *Credence: 0.85*  
     Estimation error undermines *applicability* (e.g., misestimating \( f^* \) leads to ruin). But G is a normative claim for *known* odds. Ideal theory can still hold (e.g., Kant’s "ought implies can" doesn’t negate ideals). High credence as epistemology doesn’t invalidate norms.  

  6. **Dispute is substantive (not verbal) about a determinate rationality concept**  
     *Credence: 0.65*  
     EU theorists see growth-rate max as a special case (log utility). Growth-rate theorists (e.g., Kelly, Thorp) frame it as correcting EU’s error in repeated bets. Genuine disagreement exists on whether rationality demands avoiding almost-sure ruin. Moderate credence as definitions overlap but diverge in emphasis.  

