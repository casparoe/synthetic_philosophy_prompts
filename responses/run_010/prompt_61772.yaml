    - Sub-1 and Sub-4 are G’s linchpins: if both hold, G likely holds.  
    Use geometric mean of raw product and arithmetic mean to balance severity:  
    \[
    P(G) = \sqrt{\text{raw} \times \text{mean}} = \sqrt{0.017 \times 0.60} \approx 0.30 \quad \text{(final credence)}
    \]  
    *(Arithmetic mean of sub-credences = 0.60)*  

