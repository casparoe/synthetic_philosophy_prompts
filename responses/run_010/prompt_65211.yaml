  ### Decision Tree: Are Dreams Experiences?

  **Tree Structure**  
  The decision tree is built from concrete situations answerable by the group. Each node is a yes/no question (except where noted), leading to leaves representing philosophical positions. The tree progresses from the most fundamental question (experience during sleep) to specific features.  

  **Stage 1: Logical Space Axes and Values**  
  - **(a) Experience during sleep?** (Yes, No)  
    *Concrete Q: "When you wake mid-sentence from a dream, is your immediate sense that something was happening *while* you were asleep?"*  
  - **(b) Report construction?** (Yes, No)  
    *Concrete Q: "When catching yourself revising the dream journal minutes after waking, do you feel details were *added* that weren’t originally there?"*  
  - **(c) Immersive presence?** (Yes, No)  
    *Concrete Q: "In the dream, were you *located* behind your own eyes, in a scene that felt present (not like a story described to you)?"*  
  - **(d) Belief formation?** (Yes, No)  
    *Concrete Q: "While dreaming, did you *believe* (not just imagine) your husband was alive?"*  
  - **(e) Experience-free stretches?** (Yes, No)  
    *Concrete Q: "Are there nights with *no* remembered dreams that feel like they contained no experience at all?"*  
  - **(f) Unreported deep sleep?** (Yes: experiences possible; No: experience-free; Don’t know)  
    *Concrete Q: "For the unreported hours of deep sleep, could there be experiences happening anyway?"*  
  - **(g) Theorist’s stance?** (Assertion: position is true; Deployment: undermines confidence)  
    *Not a node (handled at leaves), as it requires theoretical distinction.*  

  **Additional Axes:**  
  - **Report causation?** (Separable from (a)/(b))  
    *Concrete Q: "Is your journal entry *caused* by the dream, or is it a story built at waking?"*  
  - **Lucid awareness?** (Yes, No)  
    *Concrete Q: "In the dream, did you *know* you were dreaming?"*  

  **Stage 2: Decision Tree**  
  1. **Start:** When waking mid-sentence from a vivid dream (e.g., kitchen morphing into an old flat), do you feel an experience was happening *during sleep*?  
     - **Yes** → Go to 2.  
     - **No** → Go to 3.  

  2. **For "Yes" to experience during sleep:** In the dream, were you *immersed* (e.g., behind your own eyes in a 3D scene)?  
     - **Yes** → Go to 4.  
     - **No** → Go to 5.  

  3. **For "No" to experience during sleep:** Could unreported deep sleep (e.g., 4 hours with no recall) contain experiences anyway?  
     - **Yes** → Leaf E (Unreported Experience)  
     - **No** → Leaf A (Malcolm-style Denial)  
     - **Don’t know** → Go to 6.  

  4. **For "Yes" to immersion:** While dreaming, did you *believe* events were real (e.g., "He is alive")?  
     - **Yes** → Go to 7.  
     - **No** → Leaf C (Dreaming as Imagining)  

  5. **For "No" to immersion:** When revising your journal, do you *add* details (e.g., changing dialogue)?  
     - **Yes** → Leaf D (Narrative-Only Construction)  
     - **No** → Leaf F (Neurobiological Account)  

  6. **For "Don’t know" in unreported sleep:** Are you *sure* no experience occurred during sleep?  
     - **Yes** → Leaf A (Malcolm-style Denial)  
     - **No** → Leaf B (Dennett-style Deployment)  

  7. **For "Yes" to belief:** Do you think sleep has *experience-free stretches*?  
     - **Yes** → Leaf F (Neurobiological Account)  
     - **No** → Leaf F (Neurobiological Account)  

  **Stage 3: Occupied/Empty Combinations**  
  - **Occupied Combinations (Leaves):**  
    - **Leaf A (Malcolm-style Denial)**: (a=No, b=N/A, c=N/A, d=N/A, e=N/A, f=No, g=Assertion)  
    - **Leaf B (Dennett-style Deployment)**: (a=No, b=N/A, c=N/A, d=N/A, e=N/A, f=Don’t know, g=Deployment)  
    - **Leaf C (Dreaming as Imagining)**: (a=Yes, b=Yes/No, c=Yes, d=No, e=Yes/No, f=Yes/No/Don’t know, g=Assertion)  
    - **Leaf D (Narrative-Only Construction)**: (a=Yes, b=Yes, c=No, d=Yes/No, e=Yes/No, f=Yes/No/Don’t know, g=Assertion)  
    - **Leaf E (Unreported Experience)**: (a=No, b=N/A, c=N/A, d=N/A, e=N/A, f=Yes, g=Assertion)  
    - **Leaf F (Neurobiological Account)**: (a=Yes, b=Yes/No, c=Yes, d=Yes, e=No, f=No, g=Assertion)  

  - **Empty Combinations (Reasons):**  
    - **(a=No, b=Yes, c=Yes, ...)**: Incoherent. If no experience (a=No), immersion (c=Yes) is impossible.  
    - **(a=Yes, b=No, c=No, d=No, e=No, f=Yes)**: Unattractive. Assumes robust experience with no immersion, no belief, no construction, yet experience in deep sleep—no theorists defend this.  
    - **(a=Yes, b=Yes, c=Yes, d=Yes, e=Yes, f=No)**: Occupied (Neurobiological accommodates via degrees).  
    - **(a=No, b=N/A, c=N/A, d=N/A, e=Yes, f=No)**: Empty (unoccupied). No theorist pairs "no experience" with "experience-free stretches" explicitly.  

  **Stage 4: Annotated Leaves**  
  - **Leaf A: Malcolm-style Denial**  
    - *Gloss*: Dreams aren’t experiences; reports are stories invented at waking.  
    - *Awkward commitment*: Denying first-person certainty about dreams.  
    - *Worst evidence*: Eye-movement correspondence in lucid dreams (implies real-time experience).  

  - **Leaf B: Dennett-style Deployment**  
    - *Gloss*: We can’t know if dreams are experiences; reports might be waking confabulations.  
    - *Awkward commitment*: Undermines dream journals as records without proving falsehood.  
    - *Worst evidence*: Dream recall under lab awakening (timed to REM sleep, suggesting causation).  

  - **Leaf C: Dreaming as Imagining**  
    - *Gloss*: Dreaming is immersive imagining—you don’t believe it’s real.  
    - *Awkward commitment*: Explaining visceral fear/joy without belief.  
    - *Worst evidence*: First-person reports of false awakening (feels real, not imagined).  

  - **Leaf D: Narrative-Only Construction**  
    - *Gloss*: Dreams are non-immersive narratives; presence is added at telling.  
    - *Awkward commitment*: Dismissing immersion as illusion.  
    - *Worst evidence*: Vestibular sensations in dreams (e.g., falling—requires embodiment).  

  - **Leaf E: Unreported Experience**  
    - *Gloss*: Deep sleep has unreportable experiences, not just dreams.  
    - *Awkward commitment*: Positing experiences that leave no trace.  
    - *Worst evidence*: Polysomnography (EEG shows low brain activity in deep sleep).  

  - **Leaf F: Neurobiological Account**  
    - *Gloss*: Dreams are real, immersive experiences driven by brain physiology.  
    - *Awkward commitment*: Treating dreams as identical to waking perception.  
    - *Worst evidence*: Dream amnesia (forgetting despite "robust" experience).  

  **Indistinguishable Leaves**  
  - **Leaf C vs. Unnamed Leaf (below)**: Cannot be separated by group answers alone. Use EEG: Leaf C predicts attenuated belief-related brain activity; Unnamed predicts typical perception patterns.  
  - **Leaf B vs. Skeptical Agnosticism**: Deployment vs. mere uncertainty. Separated by theorist’s intent (g), not evidence.  

  **Your Answers Mapped**  
  - (a) Yes (experience during sleep) → Branch to 2.  
  - (c) Yes (immersive) → Branch to 4.  
  - (d) No (no belief) → **Leaf C (Dreaming as Imagining)**.  
  - (b) Yes (construction in report) → Consistent with Leaf C.  
  - (e) Yes (experience-free stretches) → Consistent with Leaf C.  
  - (f) Don’t know → Consistent with Leaf C.  
  - *But*: You resist "merely imagining," so Leaf C is awkward. Your combination **(a=Yes, b=Yes, c=Yes, d=No, e=Yes, f=Don’t know)** is unoccupied.  

  **Unnamed Leaf**  
  - **Your Position**:  
    - *Gloss*: Dreams are real, immersive experiences during sleep with no belief, but not "just imagination"; reports are partly constructed.  
    - *Awkward commitment*: Insisting on experience without belief or pure imagination.  
    - *Worst evidence*: Neuroimaging of belief systems in REM sleep (if active, contradicts "no belief").  

  **Verdict:** Unnamed Leaf / Leaf C
