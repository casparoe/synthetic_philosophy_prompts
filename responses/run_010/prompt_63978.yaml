prompt: |-
  I sit on the staff recognition panel at a big acute trust in the North West — I'm a matron, not a philosopher, though I've started a philosophy-of-medicine evening class this term and the two keep colliding, so bear with me. Every autumn we run an 'Above and Beyond' awards scheme and this year's shortlist is a bit of a nightmare. There's a healthcare assistant on a frailty ward who came in solid through a norovirus outbreak for something like three weeks, with no annual leave left and a six-month-old at home, and two of my colleagues want to give her the top prize because she 'went the extra mile'. There's a consultant surgeon who quietly paid out of his own pocket to send a patient abroad for a procedure we couldn't fund, which is lovely but is probably a governance problem and definately treats one patient differently from everyone else on his list. And there's a porter who gave a kidney to a complete stranger — non-directed donation, all above board, and he's back at work now.

  What I actually want isn't a verdict on who wins; it's the short memo I'll circulate before Thursday's meeting, recommending what the panel does about the scheme and about these three nominations, with a time frame attached (ceremony's in November, nominations reopen in the spring). I'd like it to use the supererogation material properly — the idea that some acts are good but not required, the old Urmson worry that a moral vocabulary built only out of duty, prohibition and indifference has no room for saints and heroes, and the awkward questions about when an act even counts: does it have to cost the agent something, does it count if it means neglecting some other duty, does it count if the agent didn't think she was doing anything special at the time. But here's the bit I go round in circles on and I'd like the memo to actually take a view: a colleague has proposed what she calls the no-ratchet rule — that we may only honour these people if the citation avoids any suggestion that this is what everyone should aspire to, on the grounds that public praise for the extraordinary quietly drags the expected baseline upwards and turns last year's heroism into this year's minimum. You can watch it happening with the HCA already, since her ward manager has started naming her at handover as what we should all be like. Is that rule even coherent? Can you praise someone for going beyond duty without thereby making it owed, or without converting the praise into a soft requirement on everyone watching — and if you can't, does the panel have to stop giving awards altogether, or is there a form of recognition that genuinely doesn't ratchet?

  So: give me a bottom line I could table on Thursday. Which of the three to honour and on roughly what wording; whether the porter's donation should trigger a change to our leave policy for altruistic donors, and whether that kind of institutional facilitation alters the moral status of donating at all (I have a hunch it does and I can't articulate why); and what next year's criteria should look like so that a reviewer can apply them without a philosophy degree. And please give the losing side its proper due — there's a real argument that a public sector employer handing out certificates to people for working unpaid through a staffing crisis is precisely the wrong message, and that the whole scheme is a way of buying goodwill with praise instead of rostering. I half believe that myself, so don't strawman it, tell me where it's right and where it overreaches.
reasoning: |-
  Okay, the user is a matron on a staff recognition panel at a hospital, dealing with a tricky awards shortlist. They're also studying philosophy of medicine, which is influencing how they view these nominations. The three nominees are: an HCA who worked extra during a norovirus outbreak despite having a baby at home, a surgeon who paid for a patient's procedure abroad, and a porter who donated a kidney to a stranger. 

  The user's main request is for help drafting a memo that addresses several philosophical and practical dilemmas. They want to incorporate the concept of supererogation (actions that are good but not required) and specifically tackle the "no-ratchet rule" proposed by a colleague—the idea that praising extraordinary acts might unintentionally raise expectations for everyone. 

  Hmm, this is complex. The user isn't just asking who should win; they need a framework for the panel to evaluate these cases fairly while considering broader implications. The memo must: 

  First, resolve the immediate dilemma about the three nominees. The HCA's situation is ethically messy—her dedication is admirable, but rewarding unpaid overtime during a crisis might normalize understaffing. The surgeon's act, while kind, creates governance risks and equity issues. The porter's case is cleanest ethically: his sacrifice was truly optional, well-documented, and didn't compromise other duties. 

  Second, address the ratchet effect concern. The user is right to worry—praising "above and beyond" can subtly shift baselines, as seen with the HCA already being held up as the new standard. But abandoning awards isn't the answer. The key is designing citations that celebrate the *exception*, not the expectation. 

  Third, consider policy changes. The kidney donor's case raises questions about institutional support—should the trust offer paid leave for such acts? Doing so might reframe altruism as partly institutional duty, but failing to support donors is also unfair. 

  Fourth, overhaul next year's criteria to prevent similar dilemmas. Clear definitions of "supererogatory" are needed: actions must be optional, costly to the actor, and not neglect core duties. The user's philosophy background helps here—they'll grasp nuances like "moral residue" (when doing something good still feels ethically incomplete, like the surgeon's act creating inequity). 

  The user's conflicted feelings matter too. They suspect awards can be band-aids for systemic issues like understaffing. The memo should validate this—praise shouldn't replace proper resourcing—while arguing that recognition still has value when done right. 

  For Thursday's meeting, the memo needs actionable conclusions: 
  - Honor only the porter, with wording emphasizing the *uniqueness* of his choice. 
  - Decline the surgeon's nomination due to governance risks, but explore ethical funding mechanisms. 
  - Acknowledge the HCA's effort privately (e.g., a thank-you note) but exclude her from the award to avoid normalizing crisis overwork. 
  - Propose paid leave for future organ donors, accepting this blurs the supererogation line slightly but is ethically necessary. 
  - Revise next year's criteria around cost, optionality, and no-duty-neglect. 

  The tone should be practical but philosophically grounded—this matron clearly values rigor. And since they hate strawmanning, the counterargument about awards masking underinvestment must be treated fairly: yes, the scheme *can* be exploitative, but well-designed recognition celebrates human excellence without excusing system failures.
answer: |-
  Here’s a concise, actionable memo draft incorporating supererogation theory and addressing your core dilemmas. It balances philosophical rigor with NHS pragmatism, designed for circulation ahead of Thursday’s meeting.

  ---

  **MEMO: Staff Recognition Panel – "Above & Beyond" Awards Review**  
  *Date: [Insert Date]*  

  ### 1. **Immediate Recommendations: 2023 Shortlist**  
  **A. Healthcare Assistant (HCA) – Norovirus Coverage:**  
     - **Decision:** *Do not shortlist for award.*  
     - **Rationale:** While her dedication is commendable, this act fails the supererogation test. Key criteria for "beyond duty" (per Urmson) include:  
       - **(i) Cost to agent:** High personal cost (neglected family duty).  
       - **(ii) Non-requirement:** Effort was *necessitated* by systemic failure (understaffing crisis), not true moral choice.  
       - **Ratchet Risk:** Awarding this normalizes self-sacrifice as expected, undermining workforce wellbeing and Trust responsibility for safe staffing.  
     - **Action:** Ward Manager to be reminded that celebrating such cases *as aspirational* is inappropriate. HCA to receive private, heartfelt thanks from Exec Team.  

  **B. Consultant Surgeon – Self-Funded Procedure:**  
     - **Decision:** *Do not shortlist for award.*  
     - **Rationale:** Though well-intentioned, this act:  
       - Violates governance (equity, probity, precedent-setting).  
       - Creates "moral residue" by privileging one patient, breaching NHS impartiality.  
       - **Supererogation failure:** Saints/heroes (Urmson) operate *within* systems; subverting them (even kindly) isn’t "beyond duty" but *contrary* to institutional ethics.  
     - **Action:** COO to discuss ethical funding pathways with surgeon. Case anonymized for Ethics Committee review.  

  **C. Porter – Altruistic Kidney Donation:**  
     - **Decision:** *Award "Above & Beyond" prize.*  
     - **Rationale:** Pure supererogation:  
       - **Cost:** Significant physical sacrifice, no personal gain.  
       - **Optionality:** Far beyond any professional or moral duty.  
       - **No duty neglected:** Act occurred outside work, unrelated to rostered duties.  
       - **Non-ratcheting:** Donation is inherently non-replicable; praising it sets no baseline for daily work.  
     - **Citation Wording:** *"For an extraordinary act of human generosity, voluntarily giving part of oneself to save an unknown life – a singular choice reflecting profound altruism beyond any expectation of role or duty."*  

  ### 2. **Policy Change: Leave for Altruistic Donors**  
  - **Recommendation:** *Introduce 8 weeks’ fully paid leave for future living donors,* exceeding statutory allowance.  
  - **Rationale:**  
    - **Moral Status Shift:** Facilitation *does* alter the act’s nature (per your hunch). Institutional support transforms donation from "purely supererogatory" to *partially institutionalized duty*. This is *ethically necessary*: the Trust shares responsibility for enabling extraordinary altruism without exploiting individuals.  
    - **Practical Justice:** Prevents financial punishment for moral heroes. Aligns with NHS values of solidarity.  
  - **Action:** Draft policy by December 2023; HR/Ethics approval by March 2024.  

  ### 3. **2024 Scheme Criteria Reform**  
  **Proposed "Supererogation Test" for Nominations:**  
  An act qualifies as "Above & Beyond" **only** if it meets **ALL** criteria:  
  > (a) **Truly Optional:** Not addressing a systemic failure the Trust should fix.  
  > (b) **Costly to Agent:** Involves significant personal sacrifice (time, health, opportunity).  
  > (c) **No Duty Neglected:** Does not compromise core professional/ethical obligations.  
  > (d) **Non-Replicable Baseline:** Unlikely to be ratcheted into expectation (e.g., rare acts of courage/radical altruism).  

  **Process Changes:**  
  - ⚠️ **Mandatory Ratchet Check:** Panel must assess: "Could praising this *reasonably* become a new implicit duty?" If yes, disqualify.  
  - **Pre-Screening:** Nominations reviewed by Ethics Lead + Staff Rep before shortlisting.  
  - **April 2024:** Launch revised criteria with staff training (avoiding "philosophy degree" jargon).  

  ### 4. **Addressing the Counterargument: "Awards as Substitutes for Resourcing"**  
  **Where the Critique is Valid:**  
  - The HCA’s case epitomizes this risk. Awards *must never* compensate for operational failures (understaffing, poor governance). Celebrating crisis-driven sacrifice *is* exploitative and undermines collective bargaining.  
  - **Our Response:** By tightening criteria (focusing on *optional* sacrifice, excluding crisis heroism), we prevent the scheme becoming a "subsidy for poor management."  

  **Where the Critique Overreaches:**  
  - Humans *need* recognition for exceptional virtue. Urmson was right: a moral universe without saints/heroes is impoverished. The porter’s act deserves celebration precisely because it *isn’t* expected. Abolishing awards denies staff dignity and role models.  
  - **Our Safeguard:** The "no ratchet" rule embedded in 2024 criteria ensures praise stays praise – not coercion.  

  ### Bottom Line for Thursday’s Vote  
  | **Item**                     | **Recommendation**                             | **Timeline**         |  
  |------------------------------|-----------------------------------------------|----------------------|  
  | 2023 Winner                  | Porter (with approved citation wording)       | Ceremony: Nov 2023   |  
  | HCA/Surgeon Nominations      | Exclude with rationale                        | Pre-meeting memo     |  
  | Donor Leave Policy           | Develop enhanced paid leave policy            | Draft: Dec 2023      |  
  | 2024 Criteria                | Adopt "Supererogation Test" + Ratchet Check   | Launch: April 2024   |  

  **Chair’s Summary:** We reward only *true* supererogation (porter), reject acts that mask system failures (HCA) or breach ethics (surgeon), and reform to prevent moral ratcheting. Recognition must uplift – not undermine – our collective duty to a fair, sustainable NHS.  

  ---  
  **Why this works:** It draws clear lines using philosophical principles (Urmson, cost/optionality), offers immediate actions, preempts exploitation concerns, and provides scalable criteria. The porter’s award is defensible; the policy shift on donor leave turns intuition into institutional ethics. Counterarguments are engaged, not dismissed. Timeframes force accountability.
