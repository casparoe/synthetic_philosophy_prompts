  ## VERIDIAN AGROSCIENCES  
  CROP SOLUTIONS DIVISION  
  **ETHICAST™ SYSTEMIC INSECTICIDE**  
  **ACTIVE INGREDIENT:**  
  Flumetralinide [N-(4-fluorobenzyl)-3-methyl-1,2,4-triazolin-5-one] ......... 42.7%  
  **INERT INGREDIENTS:** .......................................................... 57.3%  
