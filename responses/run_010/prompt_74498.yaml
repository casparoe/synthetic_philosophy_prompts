  **WARNING** / AVISO  
  *Eye Irritant. Suspected of damaging fertility or the unborn child. Toxic to aquatic life with long-lasting effects. See booklet for additional Precautionary Statements, First Aid, and Physical/Chemical Hazards.*  

  ---

  **INSECT WELFARE CONSIDERATIONS**  
  *Developed in consultation with the Veridian Insect Welfare Advisory Panel (VIWAP). Applicators must consider these welfare factors alongside efficacy and regulatory requirements to minimize unjustified suffering.*  

  **1.0 MORAL WEIGHTING BY TAXON**  
  Potential suffering caused by this product must be adjusted using the following Moral Weight Factors (MWFs). MWFs represent the relative capacity for welfare impact per individual, based on current scientific understanding and VIWAP consensus.  

  | TAXON                      | MWF   | NOTES                                  |
  | :------------------------- | :---- | :------------------------------------- |
  | Aphids (Aphidoidea)        | 1.0   | Baseline reference unit                |
  | Leafhoppers (Cicadellidae) | 1.2   | Enhanced mobility noted                |
  | Thrips (Thysanoptera)      | 1.3   | Complex behaviors observed             |
  | Caterpillars (Lepidoptera) | 2.5   | Complex neural architecture implied** |
  | Honey Bees (Apis mellifera)| 8.0   | High sociality, learning capacity      |
  | Bumble Bees (Bombus spp.)  | 7.5   | Comparable learning, social structure  |

  \* *MWFs are subject to periodic review by VIWAP as new ethological data emerges.*  
  \*\* *Includes larvae of non-target Lepidoptera. Adult Lepidoptera MWF = 3.5.*

  **2.0 SENTIENCE DISCOUNTING**  
  Harms must be multiplied by a Probability of Sentience Coefficient (PSC) specific to the exposed life stage and taxon. PSC values are not presently quantifiable with sufficient precision for inclusion. Applicators should proceed with the understanding that sentience capacity is non-zero for all listed taxa and act accordingly to minimize exposure where feasible.  

  **3.0 NET HARM ANALYSIS**  
  3.1. **Baseline Welfare State:** Targeted pest populations (e.g., aphids, caterpillars) in agricultural settings experience high baseline mortality. Significant proportions succumb to starvation (resource limitation), fungal/bacterial pathogens, or predation/parasitism (e.g., consumed internally by parasitoid larvae). Application may constitute a welfare improvement for individuals facing these fates by providing a faster, potentially less aversive mortality mechanism compared to prolonged natural attrition.  
  3.2. **Carrying Capacity Considerations:** Successful population reduction in the current season frees resources (foliage), increasing the field's carrying capacity for subsequent generations. This may lead to numerically equivalent or larger populations experiencing similar baseline welfare challenges in future seasons. This long-term equilibrium effect must be acknowledged within the net harm calculus.  

  **4.0 APPLICATION PRACTICES FOR WELFARE OPTIMIZATION**  
  4.1. **Dosage Compliance:** APPLY AT FULL LABELED RATES ONLY. Sub-lethal exposure is PROHIBITED except where explicitly permitted for resistance management under supervised programs. Sub-lethal doses induce prolonged morbidity (impaired feeding, locomotion, reproduction) and delayed mortality, increasing suffering duration and magnitude relative to rapid knockdown at full dose. Applying below label rate is therefore detrimental to insect welfare.  
  4.2. **Timing for Pollinator Welfare:** DO NOT APPLY DURING BLOOM PERIODS OF CROP OR ADJACENT FLOWERING WEEDS. APPLY AT DUSK OR NIGHT. Minimizing exposure to high-MWF taxa (honey bees, bumble bees) is a primary welfare objective due to their elevated capacity for suffering. This timing restriction supersedes convenience or operational considerations.  
  4.3. **Spatial Targeting:** Use precision application equipment where available to minimize off-target deposition onto non-host plants potentially harboring high-MWF non-target insects.  

  **5.0 ETHICAL OFFSETS**  
  5.1. **Veridian Habitat Credit Program:** For every hectare treated with Ethicast™, Veridian Agrosciences purchases one (1) Habitat Conservation Credit (HCC) from certified providers within the Veridian Ethical Habitat Exchange (VEHE).  
  5.2. **Credit Mechanism:** HCCs fund the establishment or perpetual maintenance of protected natural predator habitat (e.g., hedgerows, beetle banks, parasitoid nesting sites) *in regions geographically distinct from the application site*.  
  5.3. **Welfare Impact:** This program increases populations of predatory/parasitic arthropods within the conserved habitat, thereby reducing pest insect populations (and associated suffering) in *adjacent agricultural zones* via natural biocontrol. *The net global reduction in insect suffering is subject to ecological verification.*  

  **6.0 STORAGE AND DISPOSAL WELFARE CONSIDERATIONS**  
  6.1. **Container Rinsate:** Triple-rinse or pressure-rinse empty container immediately after use. Add rinsate to spray tank for application to target site.  
  6.2. **Disposal of Rinsate:** DO NOT dispose of rinsate or unused product onto soil, into sewers, or any body of water. Disposal via land application or aquatic systems risks exposure to diverse soil-dwelling and aquatic invertebrate communities with MWFs potentially exceeding target pests. This constitutes unacceptable welfare harm to non-target taxa. Dispose of rinsate ONLY by incorporating into a spray mix applied per label directions to the target crop/pest system, or via licensed hazardous waste disposal.  
  6.3. **Container Disposal:** Offer for recycling or dispose of in a sanitary landfill. Crushed or punctured containers minimize residual liquid hazards and potential breeding sites for mosquito larvae (Diptera MWF = 1.1), thereby reducing localized suffering potential.  

  ---

  **IT IS A VIOLATION OF FEDERAL LAW TO USE THIS PRODUCT IN A MANNER INCONSISTENT WITH ITS LABELING.**  
