prompt: |-
  My institute's research office has circulated a call for twelve-month pilot projects. The application is a structured abstract of no more than 300 words, and it will be read by a mixed panel: several philosophers and one economist with no training in ethics. I would like you to draft that abstract.

  The half-formed idea behind it is this. Work on moral compromise is almost entirely about permission — when one may settle with people whose values one regards as wrong, what settlement costs the compromiser's integrity, whether the resulting action leaves a residue calling for acknowledgment or regret. What is missing is the positive question: can there be gains from trade? Two parties whose value systems are incommensurable, not merely differently weighted over the same considerations, might each rank a negotiated compromise above every outcome reachable without cooperation. If that is possible, compromise is not only tragic concession but mutual benefit, and something like the economics of exchange would apply to moral disagreement. My hunch, which the project should test rather than assume, is that it cannot be had for free: for each party's own ranking to register the other's satisfaction as a gain, something must make that ranking responsive to it, and there seem to be only three candidates — a shared second-order value such as fairness or the avoidance of conflict, the value of the ongoing relationship itself, or a first-order interest in not being obstructed. Each, if it does the work, appears to reintroduce a common measure and to dissolve the very incommensurability that made the case interesting.

  The anchor case should be of a particular kind: a negotiated settlement over a site that one party treats as sacred and non-substitutable while the other needs it for housing — not a case where the parties weigh familiar considerations differently.

  Please deliver the abstract as exactly five numbered items, one or two sentences each, with no introduction and no conclusion, in this order:

  1. The research question, stated so that it has a determinate answer, including what would count as having answered it.
  2. The two standard deflections of that question — the permission-focused literature, and the economist's default assumption of a common metric — and why neither engages it.
  3. The method, which must stay ordinal throughout and must not presuppose transferable utility, together with the reason for preferring it to the obvious alternatives.
  4. What a successful result would look like and what would count as failure; for calibration, one failure mode I want addressed is that an ordinal definition of a gain from trade may turn out to be vacuous, since any agreement can be described as a gain once the parties' rankings are freely posited.
  5. An honest assessment of what one researcher can do in twelve months, and the specific way the project would balloon if left unchecked.

  Do not supply a bibliography or a literature review by citation; refer to positions and arguments descriptively and I will add the references myself. Write so that the economist can follow the reasoning without knowing the philosophical terminology.
reasoning: |-
  Okay, let me approach this abstract request methodically. The user is a philosopher seeking to reframe moral compromise through an economic lens of gains from trade, targeting a mixed review panel. The core challenge is bridging philosophical rigor with economic accessibility while maintaining ordinal analysis. 

  First, I need to distill their complex idea into five precise items as specified. The sacred land vs housing development anchor case creates the necessary incommensurability - no shared metrics exist here. 

  For item 1, I'll define the research question as testable: whether purely ordinal gains can emerge without presupposing shared values. The "determinate answer" requirement means setting clear success/failure criteria upfront. 

  Item 2 must contrast existing literature without citations. The permission-focused ethics work misses the mutual benefit angle, while economists' default cardinality assumption bypasses the incommensurability problem entirely. 

  The methodology constraint (item 3) is crucial - no utility transfers allowed. I'll emphasize why revealed preference through negotiation sequences is superior to hypothetical bargaining models. 

  Item 4's calibration point about vacuity is smart. I'll define success as identifying specific ordinal conditions where mutual gains occur without post-hoc rationalization, with vacuity as explicit failure mode. 

  Finally, item 5 requires unusual honesty about scope. The 12-month limit means focusing on constructing the model and testing for vacuity - wider applications would require years. The balloon risk lies in endless case variations. 

  Throughout, I'll avoid philosophical jargon ("incommensurable" becomes "no common measure"), using "rankings" instead of "preference orderings." The economist panelist needs to grasp the ordinal mechanism without ethics training. 

  The structure sacrifices narrative flow for precision, but each numbered item builds logically: question → gap → method → stakes → feasibility. I'll keep sentences compact, averaging 20 words each to stay under 300 total.
answer: |-
  Here is the structured abstract drafted to your specifications:

  1. **Research Question**: Can two parties with fundamentally incompatible moral values (where neither shares the other’s core considerations) achieve a negotiated compromise that *both* rank higher than any outcome achievable without cooperation, purely through ordinal preferences? Success means constructing a formal ordinal model showing such mutual gains are possible without collapsing the incommensurability; failure means proving its impossibility or vacuity.

  2. **Standard Deflections**: Existing ethics work focuses only on when compromise is *permissible* despite moral costs, ignoring mutual benefit. Economics typically assumes preferences are comparable via a common metric (like money), which presupposes a shared measure and evades the core problem of deep incommensurability.

  3. **Method**: We model negotiation using *only* the parties’ revealed rankings over possible agreements and no-agreement outcomes, forbidding cardinal utility or interpersonal comparisons. This is preferred because it directly tests if mutual gain arises *from* the disagreement structure itself, unlike bargaining theory which often assumes transferable utility or shared norms.

  4. **Success/Failure**: Success requires identifying non-vacuous ordinal conditions where mutual gains exist *without* presupposing shared values (e.g., fairness). Key failure: The definition proves vacuous because *any* agreement could be trivially described as a gain after the fact by arbitrarily assigning rankings.

  5. **Realistic Scope & Balloon Risk**: In 12 months, one researcher can rigorously define the ordinal "gain from trade," build the model, and test it against the vacuity challenge using the anchor case (sacred site vs. housing). Unchecked, the project would balloon into analyzing myriad real-world cases, requiring extensive empirical validation beyond formal modeling.
