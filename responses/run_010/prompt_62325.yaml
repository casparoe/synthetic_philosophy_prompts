      Option 1: O5 = (10,10,0)
      Option 2: O1 = (20,0,0)   [which we know they previously preferred to O2, but how about compared to O5?]

      Expected utilities (for each person) are clear. The group must decide: is (10,10,0) better than (20,0,0)? 

      In the weighted sum:
          W(O5) = wA*10 + wB*10
          W(O1) = wA*20

          So they will prefer O5 if 10*wA + 10*wB > 20*wA  => 10*wB > 10*wA => wB > wA.

      But in Choice 2, they preferred O1 (20,0,0) to O2 (0,20,0), which implies wA*20 > wB*20 => wA > wB.

      Therefore, they must prefer O1 over O5? 

      We present this and see what they do. If they are consistent, they must choose O1. But they might be tempted by the total or equality. If they choose O5, then they are inconsistent with their previous choice (unless they change their minds).

      We can then show the inconsistency.

    Alternatively, we can avoid this and instead do:

      Choice 7:
        Lottery L5: 50% chance of O1, 50% chance of O2.  [expected utility (10,10,0)]
        Lottery L6: 50% chance of O1, 50% chance of O3.  [expected utility (10,0,10)]

        Now, if they have the same trade-off as before (wA vs wC) then they choose based on wA vs wC? But note: we don't have a direct comparison of wB and wC. 

        Alternatively, we can do:

        Choice 7:
          Option 1: (15, 0, 0)
          Option 2: (0, 15, 15)

