    We explain Harsanyi's theorem. We show that their choices (if they were consistent) can be represented by weights. We note:

        - The weights are not necessarily equal. For example, in Choice 2, if they chose O1 over O2, then wA > wB.
        - If they tried to rescale, that would change the weights.

    We address the philosophical issues:

        - The theorem assumes cardinal, interpersonally comparable utilities. But how do we get these? That's a separate problem.
        - The theorem does not say that the weights should be equal. That would require an additional assumption (like anonymity).
        - The theorem is about representing preferences under the axioms. It does not, by itself, tell us what is ethical.

    We also discuss the belief issue if time permits (as an extension).

  ### Materials to Print
  - Cards for the outcomes (each card has the utility triplet and a label, e.g., O1: (20,0,0)).
  - A handout with the lotteries (or write them on the whiteboard).
  - A large sheet of paper to record choices (or use the whiteboard). Format:

        Choice | Option A | Option B | Group Choice (and maybe vote tally)

  ### Minute-by-Minute Timeline

  - 0-5 min: Introduction. Explain the three people and the setup. State the two principles: unanimity and consistency (which we'll explain as: if you prefer A over B, then you should prefer a mix of A and Z over a mix of B and Z). 
