  - 20-40 min: Part 2 - Lottery Choices. Do Choices 5 and 6. Explain lotteries and expected utilities. Emphasize the consistency principle when introducing Choice 6.
  - 40-50 min: Part 3 - Challenging Choice. Do Choice 7 (like the (15,0,0) vs (0,15,15) or the one that might reveal inconsistency). 
  - 50-55 min: Start the debrief: "Let me show you what we've been doing..." and explain that their choices can be represented by weights. Calculate the weights from their choices (if consistent).
  - 55-70 min: Debrief the theorem, the philosophical issues, and the extension on beliefs (if time).
  - 70-75 min: Wrap-up and answer questions.

  ### The Trap
  The trap is in Choice 6: L3 vs L4. If they accept the consistency principle (independence axiom), then their choice here must be consistent with their choice between O1 and O2. If they are inconsistent, then they have violated the axiom. If they are consistent, then they are on the path to the weighted sum.

  ### Extension on Beliefs (if time)
  We do this in the debrief. Present the example with two individuals and different beliefs. Show the gamble that both prefer ex ante but leads to ex post inequality. Discuss the tension.

