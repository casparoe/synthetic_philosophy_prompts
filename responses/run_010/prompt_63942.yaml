prompt: |-
  I'm a second-year grad student and this year I got stuck being the student rep on my university's graduate admissions committee, which sounded like a small commitment and has turned out to be mostly sitting in a windowless room listening to other people fight about spreadsheets. Last Thursday we got the annual numbers and two of the members went at it for forty minutes and then continued on the walk to the parking lot while I stood there holding my coat. I'd genuinely like someone to tell me who was right, because I came away unsure and I've thought about it on and off for a week. The setup: the university tracks applicants who did their undergrad inside the state system seperately from everyone else, and this year's headline figure was 53.5% admitted for in-system applicants (738 of 1380) versus 46.8% for out-of-system applicants (664 of 1420). Nadia, who works in institutional research, had put that in the draft equity memo with the framing that out-of-system applicants face roughly a seven-point penalty. Ellis, a faculty member who does econometrics on the side, read the memo and objected, and it went like this.

  (1) Ellis: out-of-system applicants are admitted at a higher rate in every single program, so the memo's central claim is simply false. Program by program — Health Sciences, in-system 300/500 (60%) vs out-of-system 320/500 (64%); Education, 360/600 (60%) vs 128/200 (64%); Engineering, 60/200 (30%) vs 136/400 (34%); Physical Sciences, 8/40 (20%) vs 36/160 (22.5%); Humanities, 10/40 (25%) vs 44/160 (27.5%). He said this is the reversal everyone meets in a first stats course, that it isn't a paradox and it isn't evidence of anything, just arithmetic: in-system applicants pile into Health Sciences and Education, which admit at 60%, while out-of-system applicants pile into Engineering and the two small low-admit programs, and if you mix two populations with different base rates in different proportions you can get whatever sign you like. (2) Nadia: the aggregate is still the number the memo should report, because the question the memo asks is what it costs an applicant, all in, to be out-of-system, and the answer is seven points. She said the program split isnt innocent — the university runs recruiting fairs and advising pipelines at system campuses, in-system students get told by advisors which programs are realistic for them, and out-of-system students aim at the prestigious hyper-competitive ones partly because nobody steers them otherwise. So which program you apply to is in part a downstream effect of being in-system, and conditioning on it holds fixed a mediator and deletes a chunk of the very harm you were trying to measure. (3) Ellis: that changes the subject. The memo says the university discriminates, and what its committees actually control is a decision on a file, which happens after program choice; if out-of-system applicants do worse because they aimed at harder targets, that isn't committees treating them worse. He added that if you refuse to condition, you can convict any committee of bias by pointing at what happened before it ever met, which makes the charge unfalsifiable, and that the aggregate isn't really a fact about admissions at all — it's a fact about who applied where, and it would flip next year if the mix shifted and not one decision changed. (4) Nadia: call it a fact about who applied where, then, but who applies where is something the university shapes, and "the committee can't be blamed" doesn't get the institution off the hook because the institution is bigger than the committee. And your clean stratified number isn't a fact either: to turn five program-level rates into one adjusted figure you have to pick weights, and there's no neutral choice — standardize to the in-system distribution, to the out-of-system distribution, or to the pooled one and you get three different numbers. (5) Ellis: standardization is a choice but it's a visible one, and here it doesn't matter, because out-of-system applicants win in every program, so any average of those program gaps with non-negative weights has to favor out-of-system. Your aggregate isn't a weighting choice, it's a different quantity entirely. And notice the memo's word "penalty" is doing normative work — it implies somebody imposed it — while the number under it is a mixture. (6) Nadia: then say the thing you keep dodging. It is perfectly possible for no committee to be biased and for out-of-system applicants to end up worse off overall, and that isn't a contradiction, it's the whole phenomenon. Also: an actual out-of-system applicant really does face worse odds, and no average across programs describes her situation, whereas your number describes a hypothetical applicant who applies to all five programs at once. (7) Ellis conceded that was partly fair, then pointed out that Nadia had also cut the data by whether the applicant was invited to interview, and that within interviewees the gap mostly vanished and in two programs it ran the other way, which he said proved his point all over again. Nadia said no, interviews are decided by the same committees after they read the file, so that variable is downstream too and conditioning on it is worse than useless. Ellis said if literally every variable counts as downstream then the only honest number is the raw aggregate — the number he'd just spent twenty minutes arguing means nothing — and at that point they both gave up and went home.

  Can you go through 1 to 7 in order and tell me who's right at each one, and how decisively — which moves land cleanly, which are washes, which are just bad, and why, rather than only a final tally? Then tell me who was more right overall, whether there's a version of the memo's claim that survives Ellis's objection and a version that doesn't, and what number they should actually be reporting, if any. I also want to know what both of them missed; my suspicion is that each of them is assuming something about the data that neither one has checked, and that there's at least one thing in the exchange that looks like a strong point and isn't. No citations, no reading list, and you don't need to name the phenomenon or anybody who's written about it — I care about the argument itself, not the scholarship. One formatting thing: please write the whole answer as continuous prose, like an email or a letter. No headings, no bullet points, no bold, no tables, even though you're going move by move — just take them in order in sentences, and if it helps, write "on 3" or "as for 7" at the start of the relevant stretch so I can follow. Feel free to work with the numbers I gave you, just don't put them in a grid.
reasoning: |-
  Okay, let me tackle this step by step. The user is a grad student stuck in an admissions committee debate between Nadia and Ellis, and wants a clear breakdown of who's right at each point in their argument. 

  First, I need to parse the core conflict: Nadia focuses on the overall 7% "penalty" for out-of-system applicants, while Ellis insists program-level comparisons show no penalty. The numbers show a classic Simpson's paradox case - aggregate vs stratified results contradict each other. 

  For point 1, Ellis is mathematically correct but misses context. The program-level rates do show out-of-system applicants have higher admission rates in every program. But his dismissal of the aggregate as "just arithmetic" ignores how application patterns are shaped by systemic factors.

  Point 2 is where Nadia brings crucial nuance. When she argues that program choice isn't neutral - it's influenced by university recruiting practices - that reframes the aggregate as capturing systemic disadvantage. Ellis's "clean" stratified comparison actually erases part of the problem by holding program choice constant.

  On point 3, Ellis has a valid concern about causal interpretation. The memo's "discrimination" claim could mislead if committees aren't biased. But his "falsifiability" argument goes too far - institutions should be accountable for pre-committee barriers they create.

  For point 4, Nadia lands a strong blow about standardization weights. There's no neutral way to average program rates, and Ellis's claim that "any weights favor out-of-system" is only true if all program gaps are positive (which they are here). But her bigger point stands: the university shapes application patterns.

  Point 5 exposes Ellis's weak spot. His insistence that only committee decisions matter ignores institutional responsibility. Meanwhile Nadia's "penalty" framing may be provocative, but it captures a real disadvantage.

  In point 6, Nadia makes the most compelling argument: the actual experience of out-of-system applicants includes both program choice barriers and committee decisions. Ellis's hypothetical applicant (applying equally to all programs) doesn't exist.

  Point 7 shows both hitting limits. Ellis's interview data point is invalid if interviews are downstream, but Nadia's refusal to condition on anything makes analysis impossible. They need to define what "penalty" means before choosing methods.

  Overall, Nadia wins on recognizing systemic harm, but both oversimplify. The university should report both numbers with explanations: the aggregate shows real disadvantage; the stratified rates show no committee bias. What's missing? They never examined applicant qualifications - without that, neither number proves discrimination or fairness.
answer: |-
  Let's walk through this exchange point by point. On (1), Ellis is factually correct: the program-specific admission rates consistently favor out-of-system applicants. His explanation about different application distributions across programs accounting for the aggregate disparity is mathematically sound—it’s a textbook case of Simpson’s paradox. Where he slips is in dismissing it as "just arithmetic," implying the aggregate is meaningless. It’s not meaningless; it reflects a real outcome, even if the cause isn’t direct discrimination by committees. His point lands cleanly on the math but stumbles by oversimplifying the institutional context.

  As for (2), Nadia’s rebuttal is stronger. She correctly identifies program choice as a mediator influenced by the university’s own systems (recruiting, advising). If in-system applicants are steered toward higher-admit programs, that *is* part of the institutional mechanism affecting outcomes. Conditioning on program choice—as Ellis wants—would indeed mask this upstream effect. Her argument that the aggregate captures the "all-in" cost of being out-of-system is defensible, especially if the memo’s goal is to assess holistic institutional impact. This move lands solidly because it reframes the aggregate as a measure of systemic disadvantage, not just committee bias.

  On (3), Ellis has a partial win. He’s right that the memo’s implication of committee-level discrimination is unsupported by the program-specific rates. If committees treat out-of-system applicants fairly *once they apply*, labeling the aggregate gap a "penalty" imposed by committees is misleading. His "unfalsifiable" point is also valid: if every pre-committee factor is ignored, *any* disparity could be blamed on bias. But he overreaches by calling the aggregate "not a fact about admissions." It *is* a fact—it’s the actual admission rate applicants experience—and his claim that it could flip without committee decisions changing, while true, ignores Nadia’s point that the mix itself is institutionally shaped. A wash, leaning slightly to Ellis on semantic precision.

  For (4), Nadia scores decisively. Ellis’s proposed "clean" stratified comparison requires standardization, and she’s right that no weighting (in-system, out-system, pooled) is neutral—each answers a different hypothetical question. More importantly, her broader argument—that the institution, not just committees, is responsible for who applies where—undercuts Ellis’s narrow focus. His counter that "any non-negative weights favor out-of-system" is accurate given the data (all program gaps are positive) but dodges her institutional accountability point. This move lands cleanly for Nadia.

  On (5), Ellis pushes back effectively. He’s correct that the aggregate isn’t just a weighted average—it’s a fundamentally different metric mixing application behavior and committee decisions. His critique of the word "penalty" is sharp: it implies agency, yet the number conflates multiple processes. But he still avoids Nadia’s core argument: even if committees aren’t biased, the *institution* may create disadvantage via steering. A partial win for Ellis on terminology, but he’s sidestepping the bigger issue.

  As for (6), Nadia’s strongest moment. She articulates the crux: systemic disadvantage can exist without committee bias. An actual out-of-system applicant *does* face worse overall odds (53.5% vs. 46.8%), and Ellis’s program-adjusted rate describes a hypothetical person who doesn’t exist (applying uniformly across programs). Her distinction between individual reality and statistical abstraction is compelling. Ellis’s hypothetical is useful for isolating committee decisions but irrelevant for assessing real applicant experiences. Clean win for Nadia.

  On (7), both unravel slightly. Ellis’s interview data point is weak—if interviews are decided post-application, conditioning on them likely *does* hold a mediator fixed (as Nadia says), making it invalid for assessing bias. Nadia’s retort that "every variable is downstream" is hyperbolic and self-defeating; it implies no analysis is possible, undermining her own aggregate. Ellis is right that this reduces her position to arguing only the raw number matters—the very number he criticized. A messy draw, but both look worse here.

  **Overall Verdict:** Nadia is more right. Her systemic view—that the university influences outcomes via program steering, making the aggregate admission gap a legitimate measure of disadvantage—holds up better. Ellis correctly defends committees against charges of direct bias but ignores how institutional practices shape applicant pools. The memo’s claim that out-of-system applicants face a "penalty" survives *if* framed as systemic disadvantage stemming partly from pre-committee factors. It fails if presented as evidence of committee discrimination.

  **What to Report:** Report both numbers with explicit interpretation. Lead with: "Overall, out-of-system applicants were admitted at a lower rate (46.8% vs. 53.5%). However, within individual programs, their admission rates were slightly higher. This disparity arises because in-system applicants disproportionately applied to programs with higher admission rates, reflecting differences in recruitment and advising pipelines." This acknowledges the real disadvantage while preempting misinterpretation of bias.

  **What Both Missed:** 
  1. **Applicant qualifications:** Neither addressed whether in-system and out-of-system applicants had comparable credentials (GPA, test scores). If out-of-system applicants were stronger, their higher program-specific rates might not indicate fairness; if weaker, even those rates could mask bias. 
  2. **Program-level aggregation:** Ellis treats "program" as a neutral control variable, but programs aren’t monolithic. If out-of-system applicants cluster in *sub*-programs or labs with lower admission rates (e.g., AI within Engineering), his analysis could miss disparities.
  3. **The "interview" red herring:** Ellis’s interview data was poorly deployed. If interview invites are based on applications, comparing admitted rates *within interviewees* doesn’t prove fairness—it ignores who got filtered out earlier, potentially masking bias at the interview stage. 
  4. **The "flipping" argument:** Ellis noted the aggregate could flip if application mixes changed. True, but if the mix is stable (e.g., due to persistent recruiting practices), the aggregate gap *is* a stable feature of the system.

  The strongest-looking-but-weak point? Ellis’s claim that "any non-negative weights favor out-of-system." While true mathematically here, it distracts from Nadia’s argument that the weighting choice itself reflects a normative stance about whose application behavior should be the reference point—a deeper issue he glossed over.
