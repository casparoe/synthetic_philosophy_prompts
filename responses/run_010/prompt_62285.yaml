  Hmm... the user is clearly philosophically sophisticated. They're using Lakatosian terminology precisely ("degenerating", "positive heuristic", "excess empirical content"). This isn't casual bar talk - these are two academics wrestling with epistemology in their field. The frustration about "slippage" between two types of ad hoc moves rings true - that distinction matters.

  Let me map the analogy systematically as requested:
  - Uranus's orbital residuals = EP anomalies (failed replications, maladaptive behaviors)
  - Newtonian core = Natural selection as ultimate explanation
  - Le Verrier's calculation = EP's adaptive reasoning about module function
  - Telescope test = Cross-cultural studies or adaptive modeling
  - Neptune = A newly confirmed module

  But the disanalogies are crucial. That telescope moment is everything. In EP, the "test" often just redescribes the anomaly ("this maladaptive trait must be adaptive because..."). Whereas Neptune made a novel prediction about planetary positions. And when Vulcan failed, it couldn't be tweaked indefinitely like EP modules can (change the function, add plasticity, etc.).

  The user's two sticking points are sharp. That asymmetry question cuts deep: in 1859, Vulcan DID seem as reasonable as Neptune. So when does "perseverance" become "degeneration"? Lakatos would say it's about novel predictions. But EP struggles there - its "novel predictions" often feel like just-so stories. 

  And yes, that missing "telescope" equivalent in EP is the whole argument. Without it, modules risk being unfalsifiable. The user suspects this, and I agree. The friend's Neptune analogy fails precisely because EP lacks that decisive observational test.

  For better analogies... dark matter comes to mind? But it has better quantitative constraints. Or maybe immune system explanations - but those have clearer mechanisms. Honestly, EP's situation might be unique in its fuzziness. That probably favors the user's skepticism.

  The weightiest disanalogies are:
  1) Missing decisive test (telescope)
  2) Novel predictions vs. redescriptions
  3) Quantitative precision constraints

  The user's candidate disanalogies are all valid, but #1 is the killer. Without it, modules can always be adjusted post-hoc. That's the Vulcan spiral.

  On ad hoc slippage: when the friend says "it's not ad hoc", they mean "it's testable" (first sense). But Lakatos cares about whether it drives progress (second sense). EP's moves often fail the second while claiming the first. That distinction cost them the evening because they were talking past each other.

  Final thought: The user wins the analogy audit, but the deeper issue is whether EP can develop its "telescopes". Until then, calling it degenerating isn't premature - it's a fair challenge based on its output. Vulcan's failure didn't doom Newton; it just revealed limits. EP might need similar humility.
answer: |-
  Here's an explicit audit of the Neptune/Vulcan analogy applied to evolutionary psychology (EP), structured as requested. I'll address disanalogies by weight, separate the two senses of *ad hoc*, and evaluate your two sticking points.

  ### Correspondence Table: Neptune/Vulcan vs. Evolutionary Psychology
  | **Neptune/Vulcan Component**         | **Evolutionary Psychology Component**                                                                 | **Fits?** |
  |--------------------------------------|-------------------------------------------------------------------------------------------------------|-----------|
  | **Residuals in Uranus's orbit**      | Anomalies: e.g., **failed cross-cultural replications**, **maladaptive behaviors**, **ecological mismatches** between predicted sex differences and observed data. | ✓         |
  | **Shared core law (Newtonian gravity)** | **Natural selection** as the ultimate explanation for mental adaptations.                                | ✓         |
  | **Calculation fixing position**      | **Adaptive reasoning**: Deductive arguments about *why* a trait *should* be adaptive (e.g., "Module X evolved to solve problem Y"). | Partial   |
  | **Telescope sweep**                  | **Empirical tests**: Cross-cultural surveys, fMRI, behavioral experiments, or genetic studies.          | ✗ (Key gap) |
  | **The planet (Neptune/Vulcan)**      | **The proposed module**: A domain-specific cognitive mechanism (e.g., "cheater-detection module").       | ✓         |

  ### Critical Disanalogies (Sorted by Weight)
  1. **Missing "Telescope Test" (Highest Weight)**  
     - In Neptune's case, the telescope provided a **binary, theory-independent verdict**: Planet found or not.  
     - In EP, empirical tests (e.g., surveys, experiments) rarely offer decisive falsification. Modules can be:  
       - Redefined post-hoc (e.g., "The module is context-sensitive").  
       - Relocated developmentally (e.g., "It emerges only in specific environments").  
       - **No counterpart to "pointing a telescope at coordinates" exists.** This is the core asymmetry.  

  2. **Novel Prediction vs. Redescription**  
     - Neptune predicted **a new celestial body** at specific coordinates.  
     - EP typically **redescribes known behaviors** as "adaptations" (e.g., "Jealousy is a mate-guarding module").  
     - When EP *does* predict novel facts (e.g., "Men will overestimate women's sexual interest"), failures are often absorbed by auxiliary assumptions (e.g., "Modern environments disrupt the module").  

  3. **Quantitative Precision**  
     - Le Verrier's prediction was **numerically precise** (mass, position).  
     - EP modules are **qualitatively defined**. A module's function or triggers can be adjusted to fit data (e.g., "The module activates in conditions *resembling* ancestral environments").  

  4. **Individuation by Behavior**  
     - Neptune was inferred from orbital math, **independent of Uranus itself**.  
     - EP modules are often **defined by the behavior they explain** (e.g., a "fear-of-snakes module" to explain ophidiophobia). This risks circularity.  

  ---

  ### Two Senses of *Ad Hoc* (Applied to EP)
  1. **No independent testability** (Weak sense):  
     - EP moves *can* be testable (e.g., "Module X should activate in cross-cultural scenario Y").  
     - **Example:** Positing a "kinship detection module" and testing it across cultures.  

  2. **No corroborated excess content** (Lakatosian sense):  
     - Does the move generate **novel, confirmed predictions** beyond the anomaly it fixes?  
     - **EP's typical move:** Explaining a maladaptive behavior (e.g., overeating) as a "mismatch" between modern environments and ancestral modules. This **rescues the core** but rarely predicts *new* phenomena.  
     - **Verdict:** Most EP auxiliary hypotheses are *ad hoc* in the Lakatosian sense. They accommodate anomalies without driving discovery.  

  ---

  ### Your Sticking Points Examined
  #### 1. The Asymmetry (Neptune vs. Vulcan from Inside 1859)  
  - **Your point is valid:** In 1859, Vulcan *was* methodologically identical to Neptune. Lakatos would agree: degeneracy is only visible retrospectively.  
  - **However, Lakatos provides present-tense marks:**  
    - **Progressive programmes** predict **novel facts** (e.g., Neptune's position).  
    - **Degenerating programmes** add patches that only **explain known anomalies** (e.g., Vulcan → Mercury's perihelion; EP modules → maladaptive behaviors).  
  - **Present EP markers of degeneration:**  
    - Proliferation of modules for every anomaly (e.g., "modules" for smartphone use, political attitudes).  
    - Lack of **unified novel predictions** (e.g., no EP equivalent to general relativity predicting light bending).  

  #### 2. A Better Analogy  
  - **Dark Matter in Astrophysics:**  
    - **Anomaly:** Galaxy rotation curves don't match gravitational predictions.  
    - **Patch:** Posit unseen matter.  
    - **Test:** Gravitational lensing, cosmic microwave background.  
    - **Why it fits EP better:**  
      - Like modules, dark matter is inferred to protect a core theory (gravity).  
      - But unlike EP, it makes **quantitative, testable predictions** (e.g., bullet cluster collision).  
    - **Verdict:** Favors **you**. Dark matter's tests are far more constrained than EP's, exposing EP's lack of a "telescope moment."  

  - **Immunology's "Self/Non-Self" Model:**  
    - **Anomaly:** Autoimmune diseases, maternal tolerance of fetuses.  
    - **Patch:** "Danger model" (added signals beyond self/non-self).  
    - **Test:** Predicts immune responses to cellular stress.  
    - **Verdict:** Favors **your friend** (if EP emulates this). But immunology has **molecular mechanisms** (antibodies, cytokines) — EP lacks analogous "parts."  

  ---

  ### Conclusion  
  **Your friend's analogy fails** on Lakatosian grounds. Neptune worked because it generated **novel, precise, and decisive** predictions. EP's "modules" are typically:  
  - Individuated by the behaviors they explain (circular),  
  - Lacking quantitative precision,  
  - Without a "telescope" to decisively confirm/falsify them.  
  Vulcan is the better analogy for EP: anomalies persist despite auxiliary hypotheses (e.g., "mismatch theory"), and the core remains intact only by sacrificing empirical content. The absence of a binary test (the telescope) is the fatal disanalogy.
