prompt: |-
  I am drafting the theoretical-foundations section of a protocol for a standing expert panel that must publish, on a fixed schedule, a probabilistic assessment of whether a specified hazard will exceed a regulatory threshold within a given horizon — an assessment that will be cited in subsequent litigation and cannot be quietly withdrawn. The panel is forbidden from reporting precision it does not have, and equally forbidden from reporting so little that its output carries no decision-relevant content. We intend to allow imprecise, set-valued credences, but before committing to a framework I want to know what we ought to demand of one.

  Write the desiderata: the specification a theory of rational imprecise belief must meet to be usable for this purpose. For each requirement, give the consideration behind it together with a concrete micro-case — a small worked example in which a framework lacking the requirement visibly fails the panel (an assessment that cannot be updated on the evidence that was supposed to discriminate between its members, a report that dilates on its own data, an aggregation step that manufactures agreement among dissenting members, and so on) — and label the requirement as non-negotiable, negotiable-but-costly, or a preference of a particular camp, naming the camp.

  At minimum the list should confront the following. How the theory individuates the doxastic state it posits: a single state represented by a set, or a family of rival precise states, and whether that choice has any downstream consequences. Whether the representation is unique, or whether one state can be captured by several inequivalent sets. What the members of the set are supposed to be competing with, and why the panel's evidence licenses a set rather than a precise probability. The update rule and its behavior under sequences of evidence, including cases in which conditioning leaves the interval unchanged and cases in which it widens, and whether repeated updating is guaranteed to produce learning. The status of structural norms — the Joycean assumption, nonconglomerability, convexity — and which of these a set-valued account should embrace, reject, or reinterpret. The interface with decision: whether the theory owes the panel a rule for acting on a set, which family of rules it should endorse if so, whether that rule belongs to the theory of belief or is bolted onto it, and what the theory must say when every candidate rule licenses nothing at all. The aggregation of several members' sets into one published assessment. And the charge that imprecision is unstable or self-defeating — that a rational agent should simply select a precise credence, or that a credal set condemns its holder to inaction.

  Two further requirements I want you to assess rather than assume. The first is a threshold-discipline constraint I have been imposing informally: the theory must make it determinate, for any given action threshold, whether the published set licenses crossing it, and if it does not, must explain why declining to act is a decision the panel owns rather than a suspension dressed up as prudence. The second is a revisability constraint: because our assessments are cited years after publication, the theory must say how a set may legitimately be widened after the fact without that widening being indistinguishable, from the outside, from having been imprecise all along.

  Then tell me which single requirement is doing the most work — the one that eliminates the greatest number of otherwise attractive frameworks — and identify any subset of the requirements you believe cannot be jointly satisfied, showing as far as you can where the inconsistency arises rather than merely noting a tension. If a purported desideratum is in fact a partisan preference smuggled in as a requirement, say so, and say whose.

  Close with a short paragraph scoring the main contenders against the list: the coherent lower-prevision approach, the decision-theoretic approach that represents an agent's state by a set of probability-and-utility pairs and chooses by a maximin-type criterion, and the "sharpen up, imprecision is irrational" reply. A few lines each, no more; the weight belongs on the requirements and their motivating cases, not on the scorecard.

  Finally, state how confident you are in the list you have produced. Distinguish the requirements you are confident any adequate theory must meet from those on which reasonable specialists would split, and single out the one point in your answer you are least sure of, together with the reason for your uncertainty.
reasoning: |-
  Hmm, the user is drafting a theoretical foundations section for an expert panel protocol. They need desiderata for a theory of imprecise probabilities that must handle high-stakes, legally binding assessments. Let me unpack this carefully.

  The core tension is between epistemic humility (admitting uncertainty) and operational usefulness (providing actionable guidance). The panel can't retract assessments, so the framework must be litigation-proof. Key pain points include: how to update sets without manufacturing false precision, how to aggregate diverse expert opinions, and how to justify inaction when sets straddle decision thresholds.

  First, the representation uniqueness problem. If multiple sets represent the same belief state, the panel could be accused of arbitrariness. Imagine two experts with identical beliefs but different interval representations - one reports [0.3,0.7], another [0.4,0.6] ∪ [0.65,0.75]. Without uniqueness requirements, the panel couldn't standardize reporting. This feels non-negotiable.

  Then there's the update consistency requirement. Consider a hazard initially assessed at [0.4,0.6]. New evidence equally supports high and low probabilities - say, conflicting studies about melting ice caps. Naive conditioning might leave the interval unchanged at [0.4,0.6], falsely suggesting no learning occurred. The framework must distinguish this from genuine ignorance. This is absolutely essential.

  The decision paralysis issue is thorny. Suppose the set is [0.49,0.51] around a 0.5 regulatory threshold. No decision rule (maximin, Hurwicz, etc.) will cross the threshold, but the panel must justify this as prudent rather than evasive. Any viable theory needs to formalize this "ownership of inaction" - likely through a revealed preference argument tying inaction to robust dominance.

  For aggregation, I'm thinking of three experts with credal sets: A says [0.2,0.3], B says [0.7,0.8], C says [0.4,0.6]. The obvious union [0.2,0.8] is useless. Weighted averaging? But that manufactures consensus. The theory must preserve dissent without collapsing to total ignorance. This might be the hardest nut to crack - possibly requiring external constraints on panel composition.

  About revisability: if we later widen [0.4,0.6] to [0.3,0.7], how is this distinguished from having been imprecise initially? The solution might lie in evidence-tracking - the original set was maximal given 2023 data, new 2024 data forces expansion. But this requires the framework to timestamp evidence incorporation.

  Now the killer requirement: update consistency. It eliminates all frameworks where conditioning can create precision from ignorance (contra Joyce), or where repeated updates don't converge. The coherent lower prevision approach struggles here - its updating rule can produce dilation. The decision-theoretic set approach handles decisions well but stumbles on aggregation. The "sharpen up" position fails fundamentally on epistemic humility.

  Where I'm least certain is the revisability constraint. The moment we allow post-hoc widening, we open the door to "we were always this uncertain" bad-faith arguments. But without it, the panel can't correct genuine oversights. Perhaps the answer is cryptographic: publish an evidence hash with each assessment so later expansions require proving new data.

  For scoring contenders: Coherent lower previsions handle uncertainty honestly but fail at decisions. Decision-theoretic sets are action-ready but make aggregation messy. The precise-only view is legally dangerous - it forces false precision. None perfectly satisfies all requirements, but lower previsions come closest if we supplement with a decision rule.

  The confidence breakdown: Representation uniqueness and update consistency are bedrock. Convexity and conglomerability are debatable - some theorists accept nonconvex sets. The threshold discipline requirement, while crucial, might need panel-specific calibration rather than being purely theoretical.
answer: |-
  Below are the desiderata for a theory of rational imprecise belief tailored to your expert panel's needs. Each requirement includes a justification, a micro-case failure, and a classification. The list confronts your specified issues and assesses the two additional constraints.

  ---

  ### **I. Core Desiderata**
  1. **Unique Representational Equivalence (Non-negotiable)**  
     *Why*: Multiple set representations of the same doxastic state invite arbitrariness in reporting and legal challenges.  
     *Micro-case*: Two panelists with identical beliefs represent them as [0.4, 0.6] vs. [0.4, 0.5] ∪ [0.5, 0.6]. The panel cannot standardize reporting, risking inconsistent assessments for equivalent states.  
     *Downstream consequence*: Affects aggregation and update consistency.

  2. **Evidence-Licensed Imprecision (Non-negotiable)**  
     *Why*: Imprecision must stem from genuine unresolved ambiguity in evidence, not computational laziness.  
     *Micro-case*: Evidence is unambiguously neutral (e.g., a fair coin), yet a panelist reports [0.3, 0.7]. This overstates ignorance, violating the mandate to avoid false precision.  
     *Competitors*: Sets compete with *all precise probabilities compatible with evidence*; the theory must define "compatible" operationally (e.g., via sensitivity to undisputed data).

  3. **Stable Sequential Updating (Non-negotiable)**  
     *Why*: Updates must not manufacture precision or widen arbitrarily without new ambiguity.  
     *Micro-case*: Initial set [0.4, 0.6]. Evidence E is equally likely under all hypotheses. Naive conditioning leaves the set unchanged, falsely implying no learning. Worse, with *dilation*, E widens the set to [0.3, 0.7], undermining trust.  
     *Learning guarantee*: Repeated updates must converge to a maximally informed set (avoiding eternal dilation).

  4. **Threshold-Decision Clarity (Negotiable-but-costly)**  
     *Why*: The panel must know if their set licenses crossing a regulatory threshold (e.g., p > 0.8).  
     *Micro-case*: Set [0.7, 0.9] with threshold 0.8. No decision rule (maximin, Γ-maximin, etc.) clearly recommends action. The theory must either:  
     (a) Define a rule (e.g., "act iff *all* members exceed threshold"), or  
     (b) Explain why inaction is *owned* (e.g., "no action is robustly optimal given ambiguity").  
     *Cost*: Rejects theories without a decision interface.

  5. **Non-Manufactured Aggregation (Non-negotiable)**  
     *Why*: Aggregation must not create artificial consensus or conceal dissent.  
     *Micro-case*: Two panelists: A: [0.2, 0.3], B: [0.7, 0.8]. Averaging produces [0.45, 0.55], implying agreement where none exists. Union [0.2, 0.8] is vacuously uninformative. The theory must preserve genuine disagreement (e.g., via set intersection only if justified by shared evidence).

  6. **Revisability Protocol (Negotiable-but-costly)**  
     *Why*: Post-hoc widening must be distinguishable from initial undue precision.  
     *Micro-case*: Panel reports [0.5, 0.6] in 2023. In 2025, new evidence forces widening to [0.4, 0.7]. Litigants accuse the panel of having been overconfident. The theory must require:  
     (a) *Evidence-tracking*: Each set is tagged with the evidence basis,  
     (b) *Maximality*: Initial sets are maximal given evidence at t₀.  
     *Cost*: Demands formal evidence semantics.

  7. **Defense Against Instability Charges (Non-negotiable)**  
     *Why*: To rebut "imprecision = irrational inaction."  
     *Micro-case*: A critic argues the panel should "pick a precise prior." The theory must show that:  
     (a) Acting on a single prior is *not robust* (e.g., dominates some actions),  
     (b) Inaction can be rational (e.g., dominated actions are forbidden).

  ---

  ### **II. Structural Norms (Preference of Specific Camps)**
  - **Convexity**: *Joycean camp* demands it (simplifies decision rules). *Levi camp* rejects it (non-convex sets capture unresolved conflict).  
    *Micro-case*: Non-convex set {0.3, 0.7} for hazard probability. Joyceans argue it violates "mixing" rationality; Levians say it reflects genuine dichotomy.  
  - **Conglomerability**: *Bayesian camp* requires it (avoids Dutch books). *Walley camp* rejects it (allows dilation under evidence partitions).  
    *Micro-case*: Under conglomerability, conditioning on a partition cannot widen intervals. Without it, dilation occurs, violating intuitive learning.

  ---

  ### **III. Decision Interface**
  8. **Action-Guidance (Non-negotiable)**  
     *Why*: The panel’s output must inform decisions.  
     *Micro-case*: Set [0.4, 0.6] and threshold 0.5. No decision rule (maximin, Hurwicz) mandates crossing. The theory must:  
     (a) Provide a rule (e.g., Γ-maximin: act iff inf(P) > threshold),  
     (b) Justify inaction as *robustly optimal* (e.g., no action is admissible under all priors in the set).  
     *Bolted-on?*: Rules like maximin are extrinsic; admissibility may be intrinsic to belief.

  ---

  ### **IV. Critical Assessment**
  - **Most Eliminative Requirement**: **Stable Sequential Updating**. It eliminates:  
    - Frameworks allowing dilation (e.g., Walley’s coherent lower previsions),  
    - Theories without convergence guarantees (e.g., some Dempster-Shafer models).  
  - **Inconsistent Subset**: **Threshold-Decision Clarity + Revisability + Non-Manufactured Aggregation**.  
    - *Conflict*: Aggregation that preserves dissent (e.g., reporting all sets) creates a "decision gap" where no threshold is crossed. Revisability requires maximal initial sets, but widening post-hoc may be indistinguishable from poor aggregation.  
    - *Inconsistency illustration*: Aggregated set [0.4, 0.6] at t₀. New evidence at t₁ forces [0.3, 0.7]. If the panel used intersection (yielding [0.4, 0.6] initially), widening appears as correction of prior underprecision. If they used union ([0.2, 0.8]), revisability is indistinguishable from prior ignorance.

  ---

  ### **V. Contender Scorecard**
  - **Coherent Lower Previsions (Walley)**:  
    ✅ Handles evidence-licensed imprecision, unique representation via natural extension.  
    ❌ Fails stable updating (allows dilation), weak on threshold decisions (no default rule), aggregation unclear.  
    **Verdict**: Risky for litigation; dilation invites challenges.  

  - **Decision-Theoretic Sets (Gardenfors, Levi)**:  
    ✅ Clear decision interface (admissibility/Γ-maximin), defends inaction.  
    ❌ Ambiguous updating rules, aggregation may manufacture consensus, revisability untracked.  
    **Verdict**: Best for decisions but weak on evidence dynamics.  

  - **"Sharpen Up" (Precise Bayes)**:  
    ✅ Avoids "inaction" criticism, simple updating/aggregation.  
    ❌ Violates evidence-licensed imprecision (forces false precision), fails revisability (cannot widen credence).  
    **Verdict**: Legally dangerous—panel cannot defend chosen prior.  

  ---

  ### **VI. Confidence Assessment**
  - **High Confidence**: Requirements 1–3, 5, 7 are non-negotiable. Any theory failing these is unusable for high-stakes, non-retractable assessments.  
  - **Moderate Confidence**: Requirement 4 (threshold clarity) is essential but negotiable in form; requirement 8 (action-guidance) is intrinsic to the panel’s mandate.  
  - **Low Confidence**: Requirement 6 (revisability protocol). *Reason*: Few theories formalize evidence-tagging for credal sets. Distinguishing "new ambiguity" from "prior overprecision" relies on contextual evidence models, which are underdeveloped in imprecise probability.  
  - **Partisan Preferences**: Convexity (Joycean vs. Levi) and conglomerability (Bayesian vs. Walley) are camp-specific. Impose only if they serve operational needs (e.g., convexity simplifies decisions).

  ---

  **Final Summary**: The panel’s constraints demand a theory with unique sets, evidence-grounded imprecision, dilation-free updating, and a decision rule justifying inaction. Lower previsions best handle evidence but fail on updating; decision-theoretic sets excel on action but struggle with evidence dynamics. Reject "sharpen up"—it courts legal liability. The hardest trade-off is between aggregation honesty and decision clarity, with no current theory fully resolving it.
