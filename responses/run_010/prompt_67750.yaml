prompt: |-
  I'm in year three of an epistemology PhD and our reading group has ground to a halt on norms of assertion, mostly because my advisor keeps reaching for one analogy and half the room thinks it's doing all the work.

  Here's how he runs it. Asserting that p is like promising that p: in both cases you give your word, you make yourself answerable, and your audience is entitled to rely on you. And just as you shouldn't promise to do something unless you know you can do it, you shouldn't assert p unless you know p. He leans on it for a second claim too, which I think matters more: that the knowledge norm isnt a moral rule bolted on from outside to an activity that's already fully constituted, but is internal to what asserting even is. A classmate says the analogy is smuggling exactly that second claim in, and that if you run it honestly you land somewhere else.

  Can you put on your expert-on-the-epistemology-of-assertion hat and audit this thing properly? Brainstorm a bit first, out loud, before you commit to a verdict — I'd rather see you generating candidate disanalogies and then culling them than a tidy list off the top of your head.

  What I want:

  1. An explicit mapping. What plays the promisor, the promisee, the content of the undertaking, the reliance, the breach, and the release-from-the-obligation? Flag any slot where the target has nothing to put.

  2. Sort the disanalogies into the ones that actually threaten the inference and the ones that are cosmetic. I'm thinking of things like: promises concern your own future actions while assertions concern how things are independently of you; a promisee can release you from a promise but no audience member can release you from a norm of assertion. Tell me which of those bites and which doesn't, and why.

  3. The thing my classmate is most pleased with: if the ordinary condition on a proper promise is belief, or reasonable belief, about your own ability — since people properly promise to drive you to the airport without knowing they'll make it — doesn't the analogy, pushed consistently, deliver a belief or justification norm rather than a knowledge one? Is there a version of the promissory parallel that resists this, or is he right?

  4. Does the constitutivity claim survive? Note that an improper promise is still a promise and a knowingly false assertion is still an assertion, so whatever the analogy shows about the knowledge norm it should show equally about the truth norm and the belief norm. Tell me whether it can discriminate between those three at all, since that's the whole question for us.

  5. If the promise analogy cant carry the load, what would be a better source domain — rules of a game, a warranty or guarantee, placing a bet, something you'd suggest — and for each say briefly which of the three candidate norms it would support and what it would quietly import that the practice of assertion lacks.

  End with a straight verdict: does my advisor's conclusion survive once the disanalogies are on the table, or was the analogy carrying it the whole time?
reasoning: |-
  Okay, the user is a third-year PhD student in epistemology, dealing with a reading group stuck on norms of assertion. Their advisor uses a promise analogy to argue for the knowledge norm, but some classmates think it's flawed. The user wants a thorough audit of this analogy, addressing specific points.

  First, I need to map the analogy explicitly. Promising involves a promisor, promisee, future action, reliance, breach conditions, and release. For assertion, the asserter maps to promisor, audience to promisee, the proposition p to the action, reliance is similar, breach is when p is false or not known, but release is tricky—can an audience "release" someone from an assertion? Probably not, which might be a disanalogy.

  Next, sorting disanalogies. Cosmetic ones include promises being about future actions vs. assertions about current states. But the core reliance and commitment aspects still hold. More critical disanalogies involve release conditions and the fact that promises are explicitly performative while assertions aren't always. The advisor's point about constitutivity might be threatened here—improper promises are still promises, just like false assertions are still assertions, so the norm might be internal but not necessarily knowledge-based.

  The classmate's point is crucial: ordinary promises require belief or reasonable belief, not knowledge. For example, promising to drive someone without knowing for sure. If applied consistently, this suggests a belief norm, not knowledge. The advisor might counter that promises implicitly involve an assurance of knowledge, but that's debatable. This disanalogy seriously undermines the knowledge norm claim.

  On constitutivity, the analogy doesn't distinguish between truth, belief, or knowledge norms. All three could fit, so it doesn't resolve the central debate. The analogy shows that norms are internal but doesn't specify which one.

  Alternative analogies? Warranty or guarantee might support a knowledge norm better, as they involve explicit assurances of truth. Betting could support a justification norm, since bets are based on reasonable belief. Game rules might fit a truth norm, like scoring in a game. Each imports elements—warranties have legal consequences, betting has mutual risk—that assertion lacks, so they might not be perfect.

  Verdict: The promise analogy doesn't hold up under scrutiny. The classmate's objection about belief vs. knowledge is valid, and the analogy doesn't uniquely support the knowledge norm. It might show that norms are constitutive but not which one. The advisor's conclusion relies too heavily on the analogy, especially the constitutivity claim, without addressing these disanalogies. The analogy was carrying the argument, and once challenged, it doesn't sustain the knowledge norm over alternatives.
answer: |-
  Here's a granular audit of your advisor's promise/assertion analogy, conducted as requested – brainstorming disanalogies first, then culling, before delivering a verdict. I'll address each of your points sequentially.

  **Brainstorming Candidate Disanalogies (Raw Generation):**

  1.  **Temporality:** Promises concern *future* actions/events of the promisor; assertions concern *present/past/future* states *independent* of the asserter.
  2.  **Performative Structure:** Promising is a classic performative utterance (saying "I promise" *is* promising); asserting is not always explicitly performative ("It's raining" isn't prefaced).
  3.  **Content Control:** Promisor has significant control over the promised action's fulfillment; asserter has no control over the truth of the proposition (except self-reports).
  4.  **Reliance Specificity:** Promisee relies on the *promisor's future action*; audience relies on the *truth of the proposition*.
  5.  **Release Mechanism:** Promisee can explicitly release promisor from obligation ("Don't worry about it"); no clear mechanism for an audience to "release" an asserter from the norm.
  6.  **Condition for Appropriateness (Norms):** Promising seems appropriate with *intention/sincere belief* and *reasonable expectation* of ability; assertion allegedly requires *knowledge*.
  7.  **Wrong Kind of Reason:** Promising can be inappropriate for *moral* reasons unrelated to belief/ability (e.g., promising something immoral); assertion's primary "wrong" seems epistemic.
  8.  **Third-Party Effects:** A broken promise primarily wrongs the promisee; a false assertion can wrong the audience *and* third parties affected by its spread.
  9.  **Correction/Retraction:** Promises are fulfilled or broken; assertions can be corrected, retracted, or updated without necessarily constituting a "breach" in the same way.
  10. **Constitutivity Scope:** An insincere promise is still a promise (though defective); a known false assertion is still an assertion (though defective). But the *specific* defect differs.
  11. **Transferability:** Promises create obligations *to specific individuals*; assertions are often made to groups or publicly, creating diffuse obligations.
  12. **Sanctions:** Breach of promise often has social/legal sanctions; breach of assertion norm primarily has epistemic/social sanctions (loss of credibility).

  **1. Explicit Mapping & Flagging Gaps:**

  *   **Promisor:** **Asserter.** Clear mapping.
  *   **Promisee:** **Audience.** Clear mapping for the immediate hearer(s).
  *   **Content of the Undertaking:** **The proposition p.** The promisor undertakes to *do X*; the asserter undertakes for *p to be true*. Mapping holds, though the nature differs (action vs. state of affairs).
  *   **The Reliance:** **Audience's reliance on p's truth.** The promisee relies on the promisor *acting*; the audience relies on the asserter *having correctly represented the world*. Close parallel on reliance *as such*, but the *object* differs (action vs. truth). This is core to the analogy.
  *   **The Breach:** **Asserting p when p is false OR when the asserter lacks knowledge (depending on norm).** The breach condition maps: failing to fulfill the undertaking. Breach occurs if the promise isn't kept OR if the assertion isn't true (on a truth norm) OR isn't known (on a knowledge norm). **Gap:** The analogy *assumes* the knowledge norm defines breach. This needs independent argument.
  *   **The Release-from-Obligation:** **???** This is the **major gap**. A promisee can explicitly release the promisor ("You're off the hook"). There is no clear analogue in assertion. An audience cannot typically "release" an asserter from the obligation to have spoken truly or knowingly. They might forgive, or the context might dissolve (e.g., a game), but this isn't a structural feature of assertion like it is for promises. *The analogy lacks a target for this slot.*

  **2. Sorting Disanalogies: Cosmetic vs. Threatening**

  *   **Cosmetic (Don't Bite):**
      *   *Temporality (1):* While promises are future-directed and assertions aren't necessarily, the core of giving an assurance about a state of affairs holds. We make promises about present states ("I promise I didn't take it") and assertions about the future ("It will rain tomorrow"). The future-action focus of *many* promises isn't essential to the core act of undertaking commitment.
      *   *Performative Structure (2):* While promises have a paradigmatic performative form, assertions function similarly in context. "I assert that p" *is* performative, and ordinary assertions carry illocutionary force without the prefix. The core commitment is present.
      *   *Third-Party Effects (8):* While scope differs, the primary wrong in both cases is *to the immediate audience* who relied. Effects on others are secondary (though important).
  *   **Threatening (Bite):**
      *   *Release Mechanism (5):* **Bites significantly.** The ability for the promisee to dissolve the obligation is a *structural feature* of promising, reflecting its fundamentally *interpersonal contract* nature. Assertion lacks this. This disanalogy weakens the claim that the norms are *identical in structure* and suggests assertion might be more like a unilateral guarantee than a bilateral contract. It challenges the "entitled to rely *in that specific way*" part.
      *   *Content Control (3):* **Bites moderately.** The promisor's control over the action strengthens the link between *their* state (intention, belief, ability) and fulfillment. The asserter's lack of control over the world weakens the link between *their* state (knowledge) and fulfillment (truth). This makes the "knowledge" requirement for assertion seem potentially *stricter* than the "sincere belief/reasonable expectation" requirement for promising.
      *   *Wrong Kind of Reason (7):* **Bites moderately.** Promises can be *primarily* wrong for non-epistemic reasons (immorality). Assertion's primary "wrong" is epistemic (falsity, lack of warrant). This highlights that while both have norms, the *domain* of the core norm might differ (moral/contractual vs. epistemic).
      *   *Correction/Retraction (9):* **Bites mildly.** While both can be retracted, the *stakes* of a "breach" feel different. A broken promise often creates an irreparable deficit; a false assertion can often be corrected, mitigating the wrong (though credibility damage remains). This doesn't destroy the analogy but nuances the "breach" concept.

  **3. The Classmate's Challenge: Belief/Justification vs. Knowledge Norm**

  *   **Your classmate is fundamentally correct, and this is the most damaging disanalogy for the knowledge norm (Disanalogy 6).**
  *   **Analysis:** Ordinary practice suggests the norm for promising is **sincere intention + reasonable belief/expectation of ability to fulfill**. You properly promise to drive someone if you *intend* to and *reasonably believe* your car will start, you won't be ill, etc. You don't need *knowledge* (certainty) that you'll succeed. Accidents happen, unforeseen obstacles arise – a broken promise isn't automatically improper *if the promisor had reasonable belief*. The wrong arises from *lack of sincerity* or *culpable unreasonableness* in belief about ability, not lack of knowledge.
  *   **Consistency Push:** If asserting is *exactly* like promising, then the norm should be **sincere belief that p + reasonable justification for believing p**. The asserter gives their word that p *is true*, just as the promisor gives their word they *will act*. The requirement is sincerity and reasonableness, not infallible knowledge. If I reasonably believe p based on good evidence, but p is false (due to Gettier, luck, etc.), my assertion seems *proper* in a way analogous to a promise broken due to unforeseeable accident, not analogous to an insincere promise or one made recklessly.
  *   **Can the Advisor Resist?** He might try:
      *   *Stricter View of Promising:* Argue that proper promising *does* implicitly guarantee knowledge ("I *know* I'll be there"). But this seems descriptively false of ordinary practice. We say "I promise I'll try my best," acknowledging fallibility.
      *   *Different Kind of Assurance:* Argue that assertion provides an *epistemic* assurance about the world, while promising provides a *practical* assurance about action, justifying a stricter (knowledge) norm for assertion. But this *abandons the strict parallel* and weakens the analogy's force. The analogy was meant to show they are structurally identical. If they require different norms, the analogy doesn't *support* the knowledge norm; it highlights a *difference*.
  *   **Verdict on this Point:** The analogy, pushed consistently under a plausible interpretation of promissory norms, strongly suggests a **justified belief (or belief) norm** for assertion, not a knowledge norm. The advisor's use smuggles in the knowledge requirement.

  **4. Does the Constitutivity Claim Survive? Can it Discriminate?**

  *   **Constitutivity Claim Survival:** The analogy *does* support the idea that *some* norm is constitutive. An insincere promise is still a promise (though defective); a known false assertion is still an assertion (though defective). Both acts are defined by the commitment undertaken, and violating the core norm makes the act *defective* or *improper* while still being an instance of the act-type. This core "commitment/assurance" structure seems internal to both practices.
  *   **Can it Discriminate Between Truth, Belief, Knowledge?** **No, it cannot.**
      *   **Truth Norm:** Analogy: You shouldn't promise unless you *will* fulfill it. A broken promise is defective. Similarly, you shouldn't assert unless p *is true*. A false assertion is defective. The structure holds.
      *   **Belief Norm:** Analogy: You shouldn't promise unless you *intend/sincerely believe* you will fulfill it. An insincere promise is defective. Similarly, you shouldn't assert unless you *believe* p. A lying assertion is defective. The structure holds.
      *   **Knowledge Norm:** Analogy: You shouldn't promise unless you *know* you will fulfill it. A promise made without certainty is defective. Similarly, you shouldn't assert unless you *know* p. An assertion without knowledge is defective. (But as argued in point 3, this doesn't fit ordinary promising).
  *   **The Problem:** The analogy perfectly mirrors the structure of *any* of these candidate norms being constitutive. The constitutive element it identifies is the **undertaking of commitment/assurance**. *What specifically that commitment entails* (truth, belief in truth, knowledge of truth) is left open by the analogy itself. The analogy cannot adjudicate *which* norm is the constitutive one; it only shows that *a* norm related to the commitment is likely constitutive. The advisor's claim that it shows the *knowledge* norm specifically is constitutive relies on *stipulating* the knowledge norm into the analogy for promises, which point 3 challenges.

  **5. Alternative Analogies (Briefly):**

  *   **Warranty/Guarantee:**
      *   **Support:** Strongly supports a **Knowledge Norm** (or perhaps Truth). Warranties explicitly guarantee a state of affairs (product function, truth of statement) and imply the warrantor *knows* or takes responsibility for its truth/function. Breach has clear consequences.
      *   **Import:** Legal/financial liability framework; often explicit contractual terms; specific remedies. Assertion lacks this formal structure and explicit penalties.
  *   **Betting:**
      *   **Support:** Supports a **Justified Belief/Reasonableness Norm**. You bet based on what you reasonably believe is likely. Betting without justification is reckless/foolish. Winning/losing depends on truth.
      *   **Import:** Explicit mutual agreement on stakes/outcome; zero-sum element (your gain is my loss). Assertion lacks the mutual agreement and inherent competition/gain-loss structure.
  *   **Game Rule (e.g., Scoring in Chess):**
      *   **Support:** Supports a **Truth Norm**. Saying "Checkmate" constitutes checkmate *only if it's true* according to the rules. It's constitutive in a very direct way – the utterance only counts as the move if the state obtains. A false "Checkmate!" isn't checkmate, it's just an incorrect statement.
      *   **Import:** Highly conventional, rule-bound context; the utterance's meaning/effect is *defined* by the rules linking it to game state. Assertion in ordinary language is less rigidly conventional and not confined to specific rule-sets defining its success solely by truth *in that immediate performative way*. (E.g., saying "It's raining" doesn't *make* it rain, even if true).
  *   **Testimony (Under Oath):**
      *   **Support:** Supports a **Knowledge Norm**. Swearing an oath explicitly invokes a commitment to tell the truth *as you know it*. Lying under oath is perjury.
      *   **Import:** Formal, legal/religious setting; severe sanctions; explicit performative structure ("I swear"). Ordinary assertion lacks this formality and gravity.

  **Final Verdict:**

  **The advisor's conclusion does not survive intact once the disanalogies are on the table, particularly the critical disanalogy concerning the promissory norm itself (Point 3) and the inability of the analogy to discriminate between candidate norms (Point 4). The analogy *was* carrying the load for the specific knowledge norm and its claimed constitutivity.**

  *   **The Constitutivity Insight Stands (Weakened):** The analogy *does* plausibly suggest that *some* norm (truth, belief, or knowledge) is internal/constitutive to the practice of assertion, based on the core structure of undertaking commitment/assurance. This is valuable.
  *   **The Knowledge Norm Claim Falls:** The analogy fails to uniquely support the *knowledge* norm. The promissory practice it relies upon suggests a justified belief norm is more appropriate. Pushing the analogy consistently undermines, rather than supports, the knowledge norm.
  *   **The Specific Constitutivity Claim for Knowledge Fails:** The analogy cannot show the knowledge norm, as opposed to the truth or belief norm, is the constitutive one. It only shows that a norm governing the commitment is constitutive.
  *   **The Analogy's Role:** It provided an intuitive picture of commitment and reliance, which is helpful for understanding assertion's normative dimension *in general*. However, it smuggled in the specific knowledge requirement by misdescribing the promissory norm and by failing to acknowledge that the same structural parallel holds for competing norms of assertion. The analogy was doing the heavy lifting for conclusions it couldn't actually bear under scrutiny.

  **Recommendation:** The promise analogy is a useful starting point for discussing the *general* normativity and assurance-structure of assertion. However, it cannot resolve the core debate between truth, belief, and knowledge norms. Focusing on the disanalogies, especially the promissory norm itself and the constitutivity discrimination problem, is crucial. Exploring alternative analogies (like warranty or testimony for knowledge, betting for justification) might be more fruitful, but their limitations must also be acknowledged. The classmate's core objection is sound.
