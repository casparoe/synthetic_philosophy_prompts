answer: |-
  ## Path Dependence: The Crucial Divide

  ### The Distinction
  Path dependence describes how historical choices constrain future possibilities. Crucially, we must separate two phenomena often conflated. **Narrow lock-in** occurs when superior alternatives exist *and* are recognised, but switching is prohibitively costly or requires impossible coordination. Agents retain the *desire* and *imagination* for alternatives; the barrier is practical (e.g., collective action problems, sunk costs). **Broad lock-in** is far deeper: the path taken actively *erases* alternative possibilities from the cognitive and normative landscape. Agents cannot formulate, desire, or even conceive of viable alternatives; preferences themselves are shaped by the path, foreclosing options not just practically but imaginatively. The litmus test? Ask: *Could agents within the system articulate, evaluate, and genuinely desire the alternative, even hypothetically?* If yes, it's likely narrow lock-in. If the alternative seems nonsensical, undesirable, or literally unthinkable, suspect broad lock-in – true path dependence.

  ### The Argument
  The term "path dependence" carries profound weight, implying history *fundamentally* shapes possibility. Narrow lock-in fails this test; it’s merely a coordination problem in historical garb. Consider the QWERTY keyboard. Its persistence is often cited as path dependence. Yet, alternatives like Dvorak were demonstrably faster, known, and desired by some typists. The barrier was the immense cost of retraining and replacing infrastructure *if done individually*. Had every typist and typewriter manufacturer coordinated a switch simultaneously, they likely would have – the preference for efficiency remained. This is classic narrow lock-in: equilibrium maintained by switching costs and network effects, reducible to standard economic reasoning about coordination failures.

  True path dependence – broad lock-in – occurs when the path *annihilates the alternative as a comprehensible option*. Take the institutional example of the sovereign nation-state. In feudal Europe, political imagination was structured around overlapping loyalties (liege lord, Church, guild, locality), not exclusive territorial sovereignty. The modern nation-state wasn't merely hard to achieve; for centuries, it was *inconceivable* as the sole legitimate form of political organisation. Agents couldn't "want" it because the conceptual framework for understanding the world as divided into mutually exclusive, sovereign territorial units simply didn't exist. The path of feudal fragmentation and then the Treaty of Westphalia didn't just create costs for alternative arrangements; it *created the mental universe* where the nation-state became the only imaginable norm. Alternatives like complex suzerainty systems or universal empires ceased being viable options because the *capacity* to perceive and value them as such was eroded.

  Similarly, the internal combustion engine's dominance didn't just make electric vehicles costly; for decades, it fundamentally reshaped automotive engineering priorities, infrastructure planning, and consumer desires. Alternatives weren't just expensive; they became associated with niche limitations (golf carts!), not mainstream aspiration. The path *formed* the preferences and constrained the imagination of engineers, policymakers, and drivers.

  Narrow lock-in explains *persistence* within an existing preference framework. It's equilibrium analysis. Broad lock-in explains how that preference framework itself emerges and becomes hegemonic, making alternatives literally unthinkable. Much institutional history claiming path dependence – say, persistence of inefficient land tenure – often collapses into narrow lock-in upon inspection: elites resist change due to vested interests and transition costs, not because they've forgotten alternative tenure systems exist or find them normatively incomprehensible. True path dependence requires showing not just that switching is hard, but that the path has *reconfigured cognitive and normative horizons*, foreclosing the very possibility of the alternative being conceived or desired. Only broad lock-in captures the essence of history actively shaping the boundaries of possibility itself.

  ### The Three Best Objections

  1.  **"It's Just Ignorance or Lack of Imagination":** Broad lock-in sounds like simple ignorance. Agents don't know about alternatives, or they lack the creativity to conceive them. This isn't profound path dependence; it's a knowledge gap solvable by education or exposure.
      *   **Answer:** Broad lock-in is *structural*, not individual. It’s not that an isolated agent lacks curiosity; it’s that the entire institutional, technological, and discursive environment actively *produces* the conditions making alternatives invisible or nonsensical. Medieval theologians weren't "ignorant" of secular nation-states; their entire ontological and epistemological framework rendered the concept incoherent. Education alone couldn't bridge that chasm without a prior seismic shift in the underlying structures of thought.

  2.  **"Narrow Lock-in Explains Persistence Adequately":** Why complicate things? Switching costs and coordination problems robustly explain why inefficient practices endure. Invoking "unthinkability" is vague and adds little explanatory power beyond established economic models of equilibrium.
      *   **Answer:** Narrow lock-in explains *stasis* but cannot explain fundamental *shifts in possibility and desire*. It assumes stable preferences over known alternatives. Broad lock-in explains why certain alternatives cease *being* alternatives at all. The persistence of feudalism wasn't just costly to change; the very *goal* of a centralised, secular, territorial state only emerged as a conceivable and desirable end-point through a long, path-dependent process redefining political imagination. Narrow lock-in can't account for the historical emergence of entirely new categories of goals and values.

  3.  **"Broad Lock-in is Untestable/Unfalsifiable":** How can we prove something is "unthinkable"? It's inherently subjective and impossible to observe directly. Historians can always argue agents *could have* conceived an alternative but chose not to, collapsing back into narrow lock-in explanations (vested interests, etc.).
      *   **Answer:** While challenging, it is inferable. We examine the *discourse*: Do alternatives appear in debates, plans, or criticisms? Are they dismissed as impractical (narrow) or as absurd, immoral, or literally nonsensical (broad)? We look for abrupt shifts: When constraints *do* lift (e.g., a revolution), what alternatives suddenly become conceivable and desirable? The sudden emergence of social democracy after feudal collapse, or electric vehicles after fossil fuel crises, suggests prior constraints weren't just practical but cognitive/normative. The absence of serious conceptual engagement with alternatives across a society over long periods, despite evident dysfunctions, is evidence of broad lock-in.

  ### Bottom Line
  Path dependence earns its name not when history makes change costly, but when it makes alternatives unimaginable. Narrow lock-in is a tractable problem of coordination and costs within a stable universe of preferences. Broad lock-in is history's profound imprint, where the path taken irrevocably shapes the landscape of thought and desire, foreclosing whole realms of possibility. Recognising this distinction forces a more honest reckoning with history's true power: its ability not just to bind our hands, but to shape our very minds. **True path dependence lies not in the difficulty of escaping a path, but in the impossibility of seeing beyond it.**
