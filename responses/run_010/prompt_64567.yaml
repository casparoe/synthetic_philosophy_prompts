  ### Philosophy of Science Club: Evidence and Theory Choice  
  **Diagnostic Handout: Mapping Your View on Underdetermination**  

  #### Preamble (Core Axes)  
  When two theories agree on all possible observations, we call them "empirically equivalent." This handout sorts your view by three key questions:  
  1. **Temporality**: Can future evidence or ingenuity *always* break the tie (temporary), or could it persist permanently?  
  2. **Scope**: Does the tie involve entire world-pictures (global, like space/time geometry), or is it localized to one theory vs. background assumptions (local, like gravity vs. dark matter)?  
  3. **Tie-Breakers**: Can anything beyond observational fit (simplicity, explanatory power, community norms) break the tie? If so, are these tools permissive (allowing equally warranted rivals) or decisive?  

  Answer the questions below using cases like **Copernican vs. Tychonic astronomy** (pre-parallax), **curved space vs. universal force** in geometry, **quantum interpretations** (same predictions), or **dark matter vs. modified gravity** for galactic rotation.  

  ---

  #### Decision Tree  
  Start: *"Here are two accounts of the world that agree about every observation anyone could make."*  

  1. **In cases like the geometry example, are the two accounts just different descriptions of the same reality?**  
     - *Yes* → **Leaf: Quietism**  
       - Core: The tie isn’t factual; theories are equivalent "ways of speaking."  
       - Best for: Geometry (flat/curved space are notational variants).  
       - Worst for: Galactic rotation (dark matter vs. modified gravity feel physically distinct).  
     - *No* → Proceed to 2.  

  2. **Do ties *always* break eventually (e.g., parallax settled Copernican/Tychonic)?**  
     - *Yes* → **Leaf: Deflationary View**  
       - Core: Ties are temporary gaps in ingenuity/evidence; underdetermination does no serious work.  
       - Best for: Copernican/Tychonic (tie broke with new tech).  
       - Worst for: Quantum formulations (many persist for decades).  
     - *No* → Proceed to 3.  

  3. **Is the tie between whole world-pictures (e.g., quantum interpretations) or localized to one theory vs. its background (e.g., gravity vs. dark matter)?**  
     - *Global (whole world-pictures)* → Proceed to 4.  
     - *Local (one theory vs. background)* → Proceed to 5.  

  4. **For global ties (like quantum interpretations), can considerations like simplicity/explanatory power break them?**  
     - *Yes* → Proceed to 6.  
     - *No* → Proceed to 7.  

  5. **For local ties (like dark matter vs. modified gravity), can considerations like simplicity/explanatory power break them?**  
     - *Yes* → Proceed to 8.  
     - *No* → Proceed to 9.  

  6. **If global ties *can* be broken, are tie-breakers permissive (e.g., multiple interpretations could be "best")?**  
     - *Yes* → **Leaf: Pluralism**  
       - Core: Maintain rivals as a *duty* to explore alternatives.  
       - Best for: Quantum formulations (many coexist for productive debate).  
       - Worst for: Copernican/Tychonic (one was abandoned).  
     - *No* → Proceed to 10.  

  7. **If global ties *can’t* be broken, is there still a fact about which theory is true?**  
     - *Yes* → **Leaf: Radical Skepticism**  
       - Core: Permanent underdetermination means *no* empirical theory is justified.  
       - Best for: Quantum formulations (if seen as permanently tied).  
       - Worst for: Copernican/Tychonic (tie broke).  
     - *No* → **Leaf: Conventionalism**  
       - Core: Choose based on convenience (e.g., simplicity); no fact of the matter.  
       - Best for: Geometry (choose curved space for neatness).  
       - Worst for: Quantum formulations (treating them as arbitrary feels inadequate).  

  8. **If local ties *can* be broken, are tie-breakers permissive?**  
     - *Yes* → **Leaf: Constructive Empiricism**  
       - Core: Accept theories only as observationally adequate; don’t believe unobservables.  
       - Best for: Galactic rotation (use dark matter or modified gravity as "tools").  
       - Worst for: Quantum interpretations (hard to isolate "observables").  
     - *No* → Proceed to 10.  

  9. **If local ties *can’t* be broken, can we still trust robust parts (e.g., galactic rotation curves)?**  
     - *Yes* → **Leaf: Cautious Realism**  
       - Core: Commit only to parts that survive theory changes (e.g., electrons, not ether).  
       - Best for: Galactic rotation (believe the data, not dark matter/gravity yet).  
       - Worst for: Geometry (no "parts" to salvage).  
     - *No* → **Leaf: Radical Skepticism** (as above).  

  10. **When tie-breakers pick one winner, do you commit to its *entire* truth?**  
      - *Yes* → **Leaf: Explanatory Virtue Realism**  
        - Core: Explanatory power/simplicity indicates truth.  
        - Best for: Geometry (curved space explains simply).  
        - Worst for: Galactic rotation (both options have virtues).  
      - *No* → **Leaf: Cautious Realism** (as above).  

  ---

  #### Unoccupied Cells  
  Some logical combos have no common positions. Here’s why:  
  - **Permanent + Global + Only Observational Fit + Realism**: Empty. Why? Unstable—if you’re a realist, you *must* believe there’s a fact, but with no way to break the tie, you collapse into skepticism.  
  - **Temporary + Local + No Tie-Breakers**: Empty. Why? Incoherent—local ties *should* break with evidence (e.g., new galaxy data), making "no tie-breakers" untenable.  
  - **Permanent + Local + Permissive Tie-Breakers**: Unexplored. A defender would argue localized ties (e.g., gravity models) can have *many* empirically adequate fixes forever, with no need to choose.  

  ---

  #### Indistinguishable Pairs  
  The tree cannot separate:  
  - **Cautious Realism vs. Constructive Empiricism** in *local* cases. Why? Both downplay commitment to unobservables (e.g., dark matter).  
  - **Separating Question**: *"Should scientists *believe* well-supported unobservables (e.g., electrons) exist, or just *use* them?"*  
    - *Believe* → Cautious Realism (trusts "robust" unobservables).  
    - *Use* → Constructive Empiricism (only cares about predictions).  

  ---

  #### Club Member Diagnostics  
  - **Priya** (*Geometry: "No further fact... choose for simplicity"*):  
    → **Conventionalism** (Rejects truth in geometry; chooses pragmatically).  
  - **Daniel** (*"Ties always break"*):  
    → **Deflationary View** (Sees underdetermination as a temporary hiccup).  
  - **Wen** (*"Realist... commit only to parts that survive"*):  
    → **Cautious Realism** (Trusts persistent components like electrons).  
    *Note: Wen’s view is indistinguishable from other cautious realists, but his emphasis on "alternatives not yet thought of" isn’t captured by the tree.*  

  — End of Handout —  
  *(Fits two pages when printed.)*
