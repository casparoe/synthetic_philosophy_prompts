  We are creating a decision tree to help students clarify their position on the underdetermination of scientific theories. The tree will be built on three axes:

  1. **Temporality**: Is the tie between rival theories temporary (breakable by future evidence or ingenuity) or permanent (even in principle)?
  2. **Scope**: Does the tie arise between whole world-pictures (global) or locally (between a theory and the background assumptions required to test it)?
  3. **Tie-Breakers**: Can anything beyond observational fit break the tie? If so, what? (e.g., simplicity, explanatory scope, coherence, individual priors, community norms) And is that resource permissive enough to leave several rivals equally warranted?

  We will use four cases to draw the nodes of the tree:

  - **Copernican vs Tychonic**: Before stellar parallax was measured, both systems agreed on all available observations.
  - **Geometry**: The choice between curved space and flat space with a universal force that distorts measurements.
  - **Quantum Formulations**: Different interpretations of quantum mechanics that agree on all measurement outcomes.
  - **Galactic Rotation**: Dark matter vs modified gravity to explain galactic rotation curves.

  The tree will have questions based on these cases and the axes. We aim for 7-8 branch nodes and 10-12 leaves.

  Leaves (positions) we must include:

  1. Conventionalism
  2. Deflationary view (underdetermination is always temporary and breaks)
  3. Constructive empiricism
  4. Realism that uses explanatory virtues to break ties
  5. Cautious realism (commit only to parts that survive theory change)
  6. Pluralism (maintaining rivals as a methodological duty)
  7. Radical skepticism (underdetermination shows no empirical theory is justified)
  8. Quietism (the question is not factual)

  We also need:
  - Unoccupied cells: explain why they are empty (incoherent, unstable, or unexplored).
  - Pairs the tree cannot separate: explain and suggest a separating question.
  - Run the three club members (Priya, Daniel, Wen) through the tree.

