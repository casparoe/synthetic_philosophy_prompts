prompt: |-
  I chair the clinical ethics consultation service at a 420-bed community teaching hospital. Our committee of eight — two physicians, two nurses, a social worker, a chaplain, a risk-management attorney, one community lay member, and me — handles roughly fifteen to twenty consults a month, and nearly all of them run through the same machinery: identify the competent decision-maker, apply the standard principles, weigh autonomy against beneficence, check institutional policy and state law, write a note. The machinery is defensible, and my complaint about it is specific rather than general. It takes as its basic unit an autonomous individual who first exists, bears rights, and then optionally enters relationships; a large share of our consults are in fact about the opposite structure, where the live question is not what the patient qua rights-bearer would choose but who has been bearing which obligations toward whom, for how long, and how well. When we impose the rights framework on those families we do not resolve the conflict, we translate it into a language in which the person who has done the actual caring for nine years has no standing at the table.

  I have been working through Confucian role ethics as Ames and Rosemont develop it, and I want to rebuild our procedure on it: the claim that a person is not a self that exists first and acquires roles afterward but is constituted by the roles she bears — daughter, son, mother, teacher, physician, neighbor — so that human excellence is not an inner state but the quality of one's enactment of those roles; that family reverence is the root from which the rest of ethical life grows rather than one value competing with others; that ritual propriety is the medium in which roles are performed, acknowledged, and repaired after they have been performed badly; and that the individual rights-bearer is, as Rosemont argues, a poor candidate for the basic unit of moral and political reflection. I am not asking for exegesis or a defense of any of this. I am asking you to convert it into an instrument that eight busy clinicians can execute without having read a word of it, and without me in the room.

  Write the procedure as an ordered set of steps that fits a ninety-minute consult and produces a written record our attorney will sign off on. For each step give the question asked, in plain language; who is positioned to answer it (the patient, a named relative, the primary nurse, the chart); what counts as a sufficient answer rather than a hand-wave; and what the step hands forward to the next one. I need it to do specific work our current form does not do at all: map the role network around the patient, including roles that are contested, informal, never named aloud, or badly borne; say how a badly borne role affects the standing of the person who holds it, rather than silently treating title as authority; handle the case where one person bears two conflicting roles, as when the bedside nurse is the patient's daughter or the attending is his own brother's physician; and use something like the rectification of names to distinguish a person failing a role from a role having been misassigned in the first place.

  Then mark, step by step and without hedging, where the procedure must stop and hand the decision elsewhere: to the patient's own expressed wishes, to institutional policy, to state law, to a judge, or to a domain where role-based reasoning simply has no jurisdiction. Be blunt about that last category, because it is where I expect this procedure to embarrass us. A framework that licenses graded obligations toward those close to me is a framework from which nepotism is a short step, and the tradition's own hardest cases have exactly that shape — a son asked whether he should report his father's theft, a sage-king asked what he would have done had his father killed a man — cases it answers on the side of the family. So I want the line drawn explicitly: what a role-obligation may count as a reason for, and what it may never be admitted as a reason for, in a hospital that allocates beds, organs, and staff time. I also want your answer to the standing objection that role ethics has no resources for criticizing the roles themselves, so that a family structure assigning a daughter-in-law the work of a servant and a son the authority of a judge is reproduced by our consult rather than examined. If the theory cannot answer that objection, say so, and tell me what safeguard has to be imported from outside it. Finally, our population is Catholic, Muslim, evangelical, unaffiliated, and recently arrived from a dozen countries; the procedure must not profile families by ancestry or assume that anyone with an East Asian surname wants Confucian reasoning. Tell me how it remains neutral about where a family's roles come from while still being role-based rather than principle-based.

  Run it in full on three cases shaped like ones we actually get. (1) A 78-year-old man with metastatic pancreatic cancer, alert and never adjudicated incapacitated, whose adult children — both of them his daily caregivers — ask us to help keep the prognosis from him because they are certain it will destroy him; he has asked his nurse twice this week whether things are bad, and both state law and our consent policy point toward disclosure. (2) A 64-year-old woman with advanced dementia and no advance directive; the son who is the default surrogate under state law has been absent for two decades and lives three states away, the daughter who has been the caregiver for nine years holds a health care power of attorney that the son is contesting as signed after she had already begun to decline, the daughter wants hospice at home, and the son wants everything done and has mentioned a lawyer. (3) A 55-year-old man who needs a kidney; his sister is a compatible living donor but is also the sole caregiver for their mother, who has advanced Parkinson's disease, and the family presents this to our donor-evaluation committee as a conflict between her role as sister and her role as daughter, with the brother's wife insisting the second role is the more fundamental. For at least one of the three I expect the procedure to reach a recommendation I will not like: do not soften it, but tell me what our attorney will say and what I should say back.

  Close with a short section on the translation itself. Which distinctions from role ethics had to survive the simplification because the procedure collapses without them; which you dropped as unusable in a hospital at two in the morning; whether the account of persons as role-constituted is doing real work in the steps or is decoration laid over ordinary clinical judgment; and which steps are judgment calls wearing a procedural costume. End with three things this procedure cannot do, and the two situations in which you would predict it fails most badly in practice. No bibliography, reading list, or citations — I want the instrument, not the scholarship behind it.
reasoning: |-
  Hmm, this is an incredibly rich and complex request from a clinical ethics chair looking to fundamentally reshape their consultation framework. The user clearly has deep expertise in both clinical ethics and Confucian role ethics, but needs a practical operationalization that works for a diverse team without philosophical training. 

  The core tension they're articulating is fascinating: how to build an ethics procedure that centers relational obligations rather than atomized autonomy. They're rightly concerned about how their current "rights-first" approach silences the very family members doing the actual care work. The Confucian framework of persons-as-constituted-by-roles seems promising, but needs to avoid cultural essentialism while preventing abuses like nepotism.

  Three key challenges stand out:
  First, how to make role mapping concrete enough for busy clinicians - with clear indicators for when roles are "badly borne" or contested. The rectification of names distinction (role failure vs misassignment) must survive simplification.

  Second, where to draw bright lines against role ethics overreach. The user explicitly wants us to flag when obligations must yield to legal requirements or distributive justice (like organ allocation). The historical examples they mention about family loyalty trumping societal obligations are real landmines.

  Third, maintaining religious/cultural neutrality while using a Confucian-derived framework. The procedure must work equally for an evangelical family and a recently immigrated Somali family without assuming anything about their role structures.

  For the case demonstrations, I'll lean into the discomfort they requested. In the pancreatic cancer case, the procedure should surface how the children's caregiver roles don't override disclosure obligations - and explicitly state why. For the contested POA dementia case, we might arrive at the uncomfortable conclusion that the absent son's legal status as surrogate doesn't automatically grant moral standing. The kidney donation conflict is perfect for showing role tension without resolution.

  The attorney pushback will be fiercest around standing - our framework might elevate the caregiving daughter over the legal surrogate son. My response would emphasize that role-based standing supplements but doesn't replace legal hierarchy, and that the procedure actually surfaces risks like elder abuse more effectively.

  In the translation section, I'll be brutally honest about what got lost: the profound concept of ritual propriety (li) is reduced to "acknowledging role performance," and the family reverence root (xiao) becomes just "core relationships." What survives is the constitutive view of persons - without that, the whole mapping exercise collapses into tokenism.

  Major failure points I'd predict: when roles are violently oppressive (the daughter-in-law as servant scenario), or when families have no stable role structure. Also when time pressure prevents deep mapping - this isn't a 15-minute tool.
answer: |-
  Here is the operationalized procedure for role-based ethics consultation, designed for 90-minute execution and institutional compliance. Steps marked with ⚖️ indicate mandatory handoff points to legal/policy domains.

  ---

  **ROLE-BASED CLINICAL ETHICS CONSULT PROCEDURE**  
  *(Time: 90 minutes; Participants: Consulting Clinician + Relevant Stakeholders)*

  **STEP 1: MAP THE ROLE NETWORK**  
  *Question:* "Who are the people most involved in [Patient's Name]'s daily life and care, and what roles do they hold *to each other*?"  
  *Answered By:* Patient (if capable), family, close friends, primary nurse.  
  *Sufficient Answer:* List names with specific role labels (e.g., "Maria - daughter, primary caregiver since 2019"; "James - neighbor, drives to dialysis"). Note contested/informal roles (e.g., "Tom calls himself health proxy but Lisa says Mom didn’t trust him").  
  *Hands Forward:* Diagram of relationships with roles, noting conflicts, duration, and gaps.  
  *Critical Distinction:* Record observed **actions** fulfilling roles (e.g., "visited weekly," "managed meds") not just titles.

  **STEP 2: ASSESS ROLE PERFORMANCE**  
  *Question:* "How well has each role been carried out *in practice* for this patient, especially regarding care?"  
  *Answered By:* Family, care team, chart (e.g., visit logs, care notes).  
  *Sufficient Answer:* Evidence-based assessment (e.g., "Daughter attended 48/50 clinic visits"; "Son last visited 3 years ago per chart"). Flag "badly borne" roles (neglect, coercion) or "overburdened" roles.  
  *Hands Forward:* Annotated diagram rating role enactment (✓/△/✗). Note dual-role conflicts (e.g., "Nurse-Sarah is *also* daughter – documents meds but won’t approve hospice").  
  *Standing Impact:* Poorly borne roles lose decision-weight; well-borne roles gain moral standing even without legal title.

  **STEP 3: RECTIFY ROLE CONFLICTS**  
  *Question:* "Where are roles mismatched, contested, or causing harm? Is this a case of someone *failing* a rightful role, or was the role *wrongly assigned*?"  
  *Answered By:* Committee analysis of Steps 1-2 data.  
  *Sufficient Answer:* Distinguish:  
  - **Role Failure:** (e.g., "Son holds legal surrogate role but abandoned duties → standing reduced").  
  - **Misassignment:** (e.g., "Daughter-in-law forced into caregiver role without consent → role invalid").  
  *Hands Forward:* Resolution: Uphold, modify, or void disputed roles based on performance history.

  **STEP 4: IDENTIFY CORE OBLIGATIONS**  
  *Question:* "Based on these roles, what specific duties do key people owe the patient *right now*?"  
  *Answered By:* Committee analysis.  
  *Sufficient Answer:* List role-specific obligations (e.g., "Primary caregiver daughter: ensure comfort"; "Estranged son: avoid obstruction").  
  *Hands Forward:* Hierarchy of role-obligations for decision-making.  
  *Limits Drawn:*  
  ⚖️ **Role obligations CANNOT override:**  
  - Patient’s explicit, capacitated wishes  
  - Allocation of scarce resources (beds, organs)  
  - Mandatory reporting laws (abuse, neglect)  
  - Non-discrimination policy (e.g., cannot prioritize "family reverence" to deny care based on race/religion)  

  **STEP 5: MAKE RECOMMENDATION**  
  *Question:* "What decision best fulfills the patient’s relational well-being, honoring well-borne roles and repairing harm?"  
  *Answered By:* Committee consensus.  
  *Sufficient Answer:* Action-focused recommendation (e.g., "Support daughter as primary decision-maker due to 9-year care role; son may be informed but not veto").  
  *Hands Forward:* Draft note for attorney review.  
  *Critique Safeguard:* ⚖️ Explicitly **reject roles enforcing oppression** (e.g., "servant" daughter-in-law). State: "Roles imposing unjust harm lack moral force regardless of tradition." (Ground this in hospital policy on abuse/equity).

  **STEP 6: DOCUMENT & HANDOFF**  
  *Question:* "Does this align with legal requirements and institutional policy?"  
  *Answered By:* Risk-management attorney.  
  *Sufficient Answer:* Attorney signs note after verifying:  
  ⚖️ - Patient autonomy (if capacitated) respected  
  ⚖️ - State surrogacy laws followed  
  ⚖️ - No resource-allocation implications  
  ⚖️ - Mandatory reporting triggered if needed  
  *Final Output:* Signed consultation note with: Role map, obligation summary, recommendation, legal attestation.

  ---

  **NEUTRALITY MECHANISM:**  
  - Focuses on **observable actions** (not cultural labels).  
  - Asks "What roles do *you* recognize?" not "What is your culture?"  
  - Validates all role structures (e.g., chosen family, neighbors) if duties are actively borne.  
  - Rejects *any* role causing documented harm, regardless of origin.

  ---

  **CASE APPLICATIONS**  

  **Case 1: Pancreatic Cancer Prognosis Concealment**  
  - *Step 1:* Maps roles: Son/daughter (daily caregivers 5 yrs), Patient (father).  
  - *Step 2:* Children’s caregiver role well-borne; but father’s "self-determiner" role active (asked nurse directly).  
  - *Step 3:* Children’s request misassigns patient to "passive recipient" role – fails rectification.  
  - *Step 4:* Children’s duty: Honor father’s role as decision-maker.  
  - *Step 5:* **Recommendation:** Disclose prognosis to patient; children’s role shifts to *supporting* his choices.  
  - *Attorney Pushback:* "Law requires disclosure to capacitated patient."  
  - *Your Response:* "Procedure affirms this. Their caregiving role obligates them to support him post-disclosure."  

  **Case 2: Dementia Caregiver vs. Absent Son**  
  - *Step 1:* Maps roles: Daughter (caregiver 9 yrs, POA holder), Son (legal surrogate, absent 20 yrs), Patient (mother).  
  - *Step 2:* Daughter’s role well-borne; Son’s surrogate role ✗ badly borne (no contact). POA validity is legal question ⚖️.  
  - *Step 3:* Son’s claim to surrogate role is misassignment (no performance).  
  - *Step 4:* Daughter’s caregiver role creates obligation to honor patient’s likely wishes (home hospice). Son’s role: Do no harm.  
  - *Step 5:* **Recommendation:** Uphold daughter’s authority via POA; son may challenge ⚖️ legally but has no moral standing.  
  - *Uncomfortable Truth:* Procedure sidelines legally entitled son due to role abandonment. Attorney warns: "Court may still favor son." Respond: "We document role failure to strengthen medical futility argument for home hospice."  

  **Case 3: Kidney Donor Role Conflict**  
  - *Step 1:* Maps roles: Sister (donor candidate, mother’s caregiver), Brother (recipient), Wife (brother’s advocate), Mother (depends on sister).  
  - *Step 2:* Sister’s daughter role actively borne (sole caregiver); sister role conflicted.  
  - *Step 3:* No misassignment – both roles valid.  
  - *Step 4:* Sister’s duties: Sustain mother’s care (immediate), support brother (conditional on capacity).  
  - *Step 5:* **Recommendation:** Sister should not donate if recovery jeopardizes mother’s care. Brother’s wife cannot impose "fundamental" roles.  
  - *Attorney Note:* ⚖️ Living donation requires donor autonomy – final decision is sister’s alone.  

  ---

  **TRANSLATION AUDIT**  
  - **Survived Simplification:**  
    - Role-constituted personhood (Step 1-2 collapse without it).  
    - Rectification of names (Step 3 critical for contested authority).  
    - Graded obligations (Step 4 enables prioritization).  
  - **Dropped:**  
    - Ritual propriety (li) – too abstract for charting.  
    - Family reverence as "root" – reduced to "core relationships."  
  - **Real Work vs. Decoration:**  
    - Role-mapping drives standing (Steps 1-3) – not decoration.  
    - Obligation hierarchy (Step 4) alters outcomes vs. principlism.  
  - **Judgment Calls:**  
    - Rating role performance (Step 2) – requires clinician insight.  
    - Balancing conflicting obligations (Step 4) – no algorithm.  
  - **Cannot Do:**  
    1. Replace legal hierarchies (⚖️ always prevails).  
    2. Allocate scarce resources justly (requires utilitarian calculus).  
    3. Heal fractured relationships (only surfaces duties).  
  - **Predictive Failures:**  
    1. **No stable roles:** Homeless/isolated patients – defaults to autonomy/policy.  
    2. **Coercive families:** May manipulate role language – mitigated by Step 3 rectification and Step 5 oppression safeguard.  

  This procedure forces examination of *who acts* not just *who claims*, creating moral space for caregivers while constraining role ethics where it threatens justice. Expect resistance when well-borne roles trump legal formalism.
