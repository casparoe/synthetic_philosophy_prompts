prompt: |-
  I sit on a national party policy committee, and we must rule on two linked proposals. Our record over the past decade: we voted to repeal the offence of selling sex and to expunge past convictions; we voted to retain and strengthen the offence of purchasing sex; we voted against mandatory registration and compulsory health checks for permitted establishments; we voted to criminalize third-party involvement broadly — taking a share of earnings, brokering clients, letting premises knowingly for the purpose — even where the third party supplied only security, bookkeeping, or driving and there was no evidence of coercion; we voted against prosecuting the advertising platform that hosts independent workers' listings; we voted to fund exit services and an end-demand information campaign; and we voted to extend ordinary labour protections, including workplace inspection and workers' compensation, to people who sell sex.

  The new proposals would (a) permit worker-owned cooperatives to supply premises, client screening, reception, and security to their members and to advertise on the members' behalf, and (b) create an offence for a client who refuses to identify themselves when asked by a worker or a cooperative.

  Which principle is this committee actually running — buyer-side criminalization resting on the view that the purchase is itself the harm, full decriminalization treating the activity as ordinary labour, a licensing regime, or an unstable hybrid? Say what each reading yields for (a) and for (b), identify the closest analog in our own record, state the decision that best coheres with it, and be explicit about the principle we would be committing to whichever way we rule. Then tell me whether our record is consistent with any single principle at all, given the third-party vote sitting alongside the platform exemption and the labour-protections vote, and name one further proposal that would most cleanly discriminate among the competing readings.
reasoning: |-
  Okay, the user is on a national party policy committee and needs to rule on two linked proposals regarding sex work legislation. They've provided a detailed record of past votes and now need to analyze how new proposals (a) and (b) fit with their existing stance. 

  First, I need to unpack their complex voting history. They repealed selling sex offenses and expunged convictions (worker decrim), but kept purchasing sex illegal (buyer criminalization). They rejected mandatory registration/health checks (against licensing), yet broadly criminalized third parties even for non-coercive support roles. The advertising platform exemption is interesting - it shows they distinguish between direct exploitation and passive hosting. Funding exit services and labor protections further reveals a worker-protection focus that's inconsistent with full criminalization models.

  Hmm... the tension lies in that third-party vote. Criminalizing bookkeeping/security while exempting platforms and granting labor rights creates a paradox. It suggests they view third-party involvement as inherently exploitative regardless of function, which clashes with recognizing sex work as legitimate labor when done independently. 

  For the new proposals: (a) allowing worker co-ops to provide services would directly contradict their blanket third-party criminalization. But (b) requiring client ID aligns with buyer criminalization by empowering workers against anonymous purchasers. 

  The committee's position seems to be an unstable hybrid - buyer criminalization grafted onto partial worker decrim, with unresolved contradictions about third parties. If they approve (a), they'd implicitly accept organized collectives as legitimate, forcing them toward full decrim. Rejecting it maintains the status quo's inconsistency. 

  To resolve this, they could consider a proposal explicitly decriminalizing third-party services when provided non-exploitatively. That'd force them to choose between their worker-protection rhetoric and their current criminalization approach. The user needs clarity on whether they truly see sex work as work or as inherently harmful - their votes can't logically sustain both views forever.
answer: |-
  Based on your committee's record and the new proposals, your principle appears to be an **unstable hybrid** leaning heavily towards the **Nordic Model (buyer-side criminalization)**, but with significant contradictions arising from your broad third-party criminalization combined with the advertising platform exemption and labor protections. This creates internal tension.

  Here's the breakdown:

  1.  **Buyer-Side Criminalization (Nordic Model):**
      *   **Core Principle:** Views the purchase of sex as inherently harmful/exploitative, seeking to abolish the sex trade by targeting demand. Workers are seen as victims, hence decriminalization of selling.
      *   **(a) Cooperatives:** **Inconsistent.** Permitting worker-owned co-ops providing premises, security, etc., directly contradicts the logic of criminalizing *any* third-party involvement (as your record shows), even non-exploitative support roles. It legitimizes collective organization within the trade, which the Nordic Model generally opposes as facilitating exploitation.
      *   **(b) Client Refusal to ID:** **Strongly Consistent.** Empowers workers to identify potentially dangerous clients and directly targets/punishes buyers for non-cooperation, reinforcing the criminalization of demand and a worker-as-victim safety narrative.
      *   **Closest Analog:** Criminalizing purchasing sex broadly & funding exit services/end-demand campaigns.
      *   **Coherent Decision:** **Reject (a)**, Approve (b). Criminalizing all third parties but allowing worker co-ops is logically inconsistent under this model.
      *   **Principle Committed To:** A stricter interpretation of the Nordic Model, emphasizing the inherent harm of the transaction and the need to suppress the market entirely, including collective organization.

  2.  **Full Decriminalization (NZ Model):**
      *   **Core Principle:** Treats sex work as work. Decriminalizes selling, buying, and third-party involvement (brokers, managers, security) unless coercion/exploitation is present. Focuses on harm reduction and labor rights.
      *   **(a) Cooperatives:** **Strongly Consistent.** Worker co-ops are a hallmark of labor rights and safe organization within full decrim, allowing workers to pool resources for safety and efficiency.
      *   **(b) Client Refusal to ID:** **Consistent (Safety Focus).** Framed as a workplace safety/security measure for workers, not inherently criminalizing the purchase itself. Allows workers/safe workplaces to screen clients.
      *   **Closest Analog:** Decriminalizing selling, expunging convictions, extending labor protections, *possibly* the advertising platform exemption (viewed as a service provider).
      *   **Coherent Decision:** **Approve Both (a) and (b).** (a) is core to labor organization; (b) is a safety regulation analogous to other industries.
      *   **Principle Committed To:** Treating sex work as legitimate labor deserving of full workplace rights, safety measures, and collective bargaining/organization.

  3.  **Licensing/Regulation (German/Dutch Model):**
      *   **Core Principle:** Acknowledges sex work as work but seeks to control/regulate it through state licensing of establishments and workers, often with health checks and zoning.
      *   **(a) Cooperatives:** **Potentially Consistent, but Complex.** Could be permitted *if* the co-op and premises meet licensing requirements. Your record explicitly *rejected* mandatory registration/health checks, making licensing unlikely.
      *   **(b) Client Refusal to ID:** **Consistent (Regulation/Safety).** Could be part of regulated establishment rules for safety and traceability.
      *   **Closest Analog:** *None.* Your rejection of mandatory registration/health checks directly opposes the core of licensing regimes.
      *   **Coherent Decision:** *Not applicable* based on your record. Your past votes rule this out.
      *   **Principle Committed To:** Not relevant, as your record contradicts this model.

  4.  **Unstable Hybrid:**
      *   **Your Actual Principle:** A conflicted mix:
          *   **Nordic Core:** Criminalization of purchasing and *broad* third-party involvement.
          *   **Decrim/Worker-Rights Elements:** Decriminalization of selling, expungement, labor protections, exemption for advertising platforms (a specific third-party service).
          *   **Contradiction:** Criminalizing non-exploitative third-party support (security, bookkeeping) while granting labor rights *and* exempting platforms is logically unsustainable. Labor rights inherently require the ability to access services safely. The platform exemption shows a pragmatic distinction your third-party vote ignored.
      *   **(a) Cooperatives:** **Highlights the Contradiction.** Approving (a) directly challenges the breadth of your third-party criminalization vote by legitimizing essential support services within a worker-controlled framework. Rejecting it maintains the contradiction but avoids exposing it further.
      *   **(b) Client Refusal to ID:** **Consistent with Buyer Criminalization Core.** Fits the Nordic element of targeting buyers and enhancing worker (victim) safety.
      *   **Closest Analog:** *The combination itself is the analog.* The tension between your broad third-party criminalization vote and your votes for labor protections + platform exemption *is* the defining feature.
      *   **Coherent Decision?** **None exists.** Coherence would require resolving the fundamental contradiction. Approving (a) leans towards decrim, rejecting (a) leans towards a stricter (but still inconsistent) Nordic interpretation. Approving (b) is easy under either buyer-crim or decrim safety rationales.
      *   **Principle Committed To:**
          *   **Approve (a) & (b):** Shifts significantly towards Full Decriminalization, explicitly endorsing collective worker organization and support structures, forcing a reinterpretation (or future reversal) of the broad third-party criminalization.
          *   **Reject (a), Approve (b):** Doubles down on the unstable hybrid, maintaining the core buyer criminalization and the contradictory mix of criminalizing most third-party support while granting labor rights and exempting platforms. It avoids confronting the third-party contradiction head-on.
          *   **Reject Both:** Unlikely, as (b) is broadly consistent with your core Nordic stance and worker safety rhetoric.

  **Analysis of Record Consistency:**

  *   **No, your record is NOT consistent with a single principle.**
  *   **The Core Contradiction:** Your vote to **criminalize *all* third-party involvement** (even non-coercive security/bookkeeping/driving) fundamentally clashes with:
      1.  **The Advertising Platform Exemption:** This is a specific, crucial third-party service (brokering clients via ads) you *explicitly* chose *not* to criminalize. This shows a pragmatic recognition that some third-party services are simply part of the market infrastructure, undermining the "all third parties are inherently exploitative" logic of the broad vote.
      2.  **Extending Labor Protections:** Genuine labor rights (workplace inspection, workers' comp) require the ability for workers to access safe workplaces, potentially employ others for support (security, admin), or organize collectively. Criminalizing anyone who provides essential support services makes exercising these rights practically impossible and legally perilous. How can a worker claim workers' comp for an injury sustained in a workplace where the person providing security is deemed a criminal?

  **Discriminating Proposal:**

  The proposal that would most cleanly discriminate among the competing readings is:

  *   **Proposal:** **Decriminalize third-party involvement (premises, security, admin, management, advertising) where there is no evidence of coercion, exploitation, trafficking, or involvement of minors.** This focuses criminalization on *harmful* acts, not the role itself.

  *   **How it Discriminates:**
      *   **Nordic Model:** Would **reject** this. Views *all* third-party facilitation as inherently exploitative and maintaining the market.
      *   **Full Decriminalization:** Would **strongly approve** this. It's core to the model, removing criminal law from non-exploitative business relationships.
      *   **Licensing Model:** Would **reject** or **amend heavily** (to require licensing of the third parties). Your record already rejects licensing.
      *   **Your Unstable Hybrid:** Would **force a choice:** Adopt this (aligning with platform exemption and labor rights, moving towards decrim) or reject it (doubling down on the contradiction, leaning harder into a flawed Nordic interpretation). Passing this would resolve the central contradiction in your record.

  **Conclusion:**

  Your committee operates on an **unstable hybrid principle**, primarily rooted in buyer criminalization but fatally undermined by the inconsistency between your broad third-party criminalization vote and your votes for labor protections and the advertising platform exemption. The new proposal (a) directly challenges this contradiction. Approving it would signal a decisive shift towards full decriminalization. Rejecting it maintains the unstable status quo. Proposal (b) is largely compatible with either path. To achieve coherence, your committee must ultimately resolve the fundamental conflict regarding third-party roles in the sex trade. The "decriminalize non-exploitative third-party involvement" proposal is the clearest test of which direction you will take.
