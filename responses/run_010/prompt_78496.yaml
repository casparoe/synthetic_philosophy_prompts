  Build me a testimony case to spec — I'm trying to figure out whether unpossessed defeaters can actually wreck testimonial justification, or whether thats just reductionists sneaking a vigilance requirement in through the back door.

  The hearer needs genuinely strong positive reasons for trusting this speaker: a real track record she's built up herself, not just general faith in people. The belief has to come out true. And there has to be a defeater sitting right there in plain view that she never picks up. The twist: she is NOT being careless. No professional norm she's blowing off, and catching the defeater would have meant doing something nobody in her position ever does. Realistic setting only — hospital, newsroom, lab meeting — one paragraph for the scenario itself, no sci-fi, no deceivers, no fake-barn style props.

  Then show your work. What does a Fricker-style local reductionist say about whether she knows, and why? What does a Burge/Coady-style global anti-reductionist say, and why? Which single feature of the case is doing the work? What happens to both verdicts if you delete that feature, or if you make the belief come out false instead? And how would the reductionist attack the case rather than accept it — e.g. by denying she really had those positive reasons, or by insisting the defeater was in some sense possessed? Be honest if you end up stipulating the verdicts instead of getting them out of the theories.
