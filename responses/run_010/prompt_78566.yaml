prompt: |-
  I write a fortnightly ideas column for a science mag — mostly neuroscience and AI, with occasional detour's into philosophy, which is where I'm about to get myself in trouble. I'm working on a piece about how the people building value-aligned models keep rediscovering metaethics badly, and I wanted to build the middle of it around the Frege-Geach argument. Here's the paragraph I've got drafted:

  "Suppose Geach's point was that if 'murder is wrong' just expresses the speaker's disapproval, then in a conditional — if murder is wrong, it's wrong to pay your little brother to murder — that same sentence has to be expressing something different, since you aren't disapproving of anything when you're merely supposing. So the expressivist equivocates in every moral argument there is. The only repair is to admit the sentence has truth conditions after all, at which point expressivism stops being a rival to moral realism and becomes realism with an embarrassed face."

  My editor loves it. But a philosopher I've interviewed before read it over and texted back that I'd got it exactly backwards, that the equivocation charge is the last thing Geach was saying, and then went dark on me. So before I file: what precisely is backwards there, and what is the problem Geach was actually posing? Relatedly, I keep reading the whole argument as an empirical prediction about how speakers deploy moral language, which makes me want to say it could be settled in a afternoon with a corpus and four hundred subjects and that nobody's bothered — is that a stupid reaction or is there something to it? And if the expressivist doesn't have to concede truth conditions, what do they say instead: is there a live dispute left, or has the quasi-realist program quietly dissolved into the realism it was supposed to be an alternative to? Last one, and be blunt — does any of this actually bear on my real subject, whether a language model can be said to have moral attitudes, or am I about to commit a category error in print?

  Answer in ordinary continuous prose, please: no headings, no bullet points, no bold, no tables, just paragraphs the way you'd write an email. I'm going to be lifting sentences out of it, so write it so that any single paragraph can stand on its own.
reasoning: |-
  Okay, the user is a science columnist focusing on neuroscience and AI, now venturing into philosophy, specifically the Frege-Geach problem and its relevance to AI ethics. They've drafted a paragraph that their editor loves but a philosopher criticized as "backwards." The user needs clarification on three main things: what they got wrong about Frege-Geach, whether the argument can be empirically tested, and if this impacts AI alignment.  

  First, their misunderstanding: They framed Geach as accusing expressivists of equivocation in conditionals. Actually, Geach’s point was subtler—expressivism struggles because moral sentences in non-assertive contexts (like "if murder is wrong...") lose their expressive function. The user’s version reversed the critique: Geach wasn’t claiming expressivists *do* equivocate; he was showing their theory *forces* them to, unless they can explain how moral language works uniformly across contexts.  

  On empirical testing: The user’s instinct isn’t stupid. Corpus studies or surveys *could* examine how people use moral language in conditionals versus assertions. But Geach’s challenge is conceptual—it’s about whether expressivism *as a theory* can coherently account for these uses, not just whether speakers *feel* they’re expressing attitudes. Empirical data might inform but not resolve the philosophical problem.  

  Quasi-realism’s response: Blackburn’s projectivism offers a solution. Instead of conceding truth conditions, expressivists argue moral attitudes can embed in complex ways—e.g., asserting "if murder is wrong..." expresses a higher-order attitude about consistency. This avoids collapsing into realism and keeps expressivism viable. The dispute is alive, though technical.  

  AI relevance: Here’s where it gets juicy for the user’s column. For AI "moral attitudes," the Frege-Geach problem highlights a pitfall: if an LLM’s "murder is wrong" is just statistical output, how does it coherently handle conditionals or inferences? Without a unified account, AI alignment risks building systems that "parrot" ethics inconsistently. This directly bears on whether LLMs can *have* moral stances versus simulating them.  

  Bluntly: Yes, this matters for their subject. But they must avoid conflating human metaethics with AI architecture. The category error would be assuming LLMs "disapprove" like humans. Instead, frame it as: Can alignment protocols create *functional equivalents* of moral reasoning that satisfy philosophical coherence tests like Frege-Geach? That’s their column’s hook.
answer: |-
  You've got the core of Frege-Geach right, but the philosopher is correct that your characterization of Geach's specific charge is backwards. Geach wasn't accusing the expressivist of *actually* equivocating in everyday arguments. His point was more fundamental: expressivism, *as a theory*, *cannot account* for the consistent meaning of moral sentences across different linguistic contexts without collapsing or resorting to equivocation. Your draft makes it sound like Geach observed expressivists sneakily changing meanings, but his argument is a logical challenge to the theory itself.

  Geach's actual problem runs deeper. He observed that moral sentences function identically in terms of logic and grammar whether they are asserted outright ("Murder is wrong") or embedded unasserted within conditionals, questions, or disjunctions ("If murder is wrong...", "Is murder wrong?", "Either murder is wrong or..."). In the embedded contexts, the sentence isn't being used to express the speaker's disapproval; it's being *supposed*, *questioned*, or *denied*. The expressivist, defining meaning solely as the expression of an attitude in assertive contexts, struggles to explain what the *same* sentence means when embedded. If its meaning *is* just the expression of an attitude in assertion, then in non-assertive contexts, it must mean something different – that's the equivocation your paragraph mentions. But crucially, Geach presented this as an *inescapable consequence for the expressivist theory*, not as an observation of what speakers actually do. The problem is that speakers clearly treat the sentence as meaning the *same thing* in both contexts, allowing valid inferences like modus ponens. Expressivism, Geach argued, lacks the resources to explain this linguistic unity without abandoning its core tenet that moral statements fundamentally express non-cognitive attitudes.

  Your empirical instinct isn't stupid; it's a common reaction. Corpus studies or surveys *could* show that people *use* embedded moral sentences coherently and inferentially, treating "murder is wrong" as meaning the same in "If murder is wrong..." as in simple assertions. This data would powerfully illustrate the *phenomenon* Geach points to: the logical behavior of moral language. However, it wouldn't *settle* the philosophical dispute. Geach's argument is conceptual: *how can expressivism, given its core definition of meaning, explain this coherent usage without equivocation or abandoning expressivism?* The data confirms the linguistic behavior exists, but the burden is on the expressivist to provide a theoretical account consistent with their non-cognitivism. The dispute is about theoretical adequacy, not empirical observation of usage.

  The expressivist doesn't *have* to concede truth conditions in the robust realist sense. This is where Simon Blackburn's quasi-realism comes in. The quasi-realist argues that expressivism can explain the logical behavior Geach highlights by providing an account of moral *attitudes* embedding within complex states. For example, asserting "If murder is wrong, then paying your brother to murder is wrong" doesn't express simple disapproval of murder. Instead, it expresses a complex, higher-order attitude: perhaps a commitment *not* to disapprove of murder without also disapproving of paying for murder, or a plan to disapprove of paying for murder *if* one disapproves of murder itself. The goal is to show how the *logic* and apparent truth-aptness of moral discourse can be reconstructed entirely within an expressivist framework, mimicking realism without positing objective moral facts. The dispute is very much alive, though highly technical. Quasi-realism hasn't dissolved into realism; it's a sophisticated attempt to maintain a non-cognitivist core while capturing the surface features of moral discourse that realists emphasize. Success is hotly contested.

  Bluntly: Yes, this absolutely bears on your subject about language models and moral attitudes, but tread carefully to avoid the category error. The Frege-Geach problem highlights a crucial feature of moral language: its *logical structure* and the way moral terms function consistently across asserted and unasserted contexts, enabling reasoning and inference. If we want to say an AI model "has moral attitudes" or engages in "moral reasoning," its outputs need to exhibit this logical coherence. Can an LLM reliably use "murder is wrong" with the *same semantic contribution* in "Murder is wrong" and "If murder is wrong, then..." such that valid inferences follow? Or is it merely pattern-matching, potentially generating surface-level coherence without the underlying consistency that Geach identified as essential? The challenge for AI alignment isn't just instilling "values" as simple outputs or preferences, but creating systems whose "moral" outputs integrate into complex, logically structured reasoning patterns that mirror human normative discourse. If the system can't handle the embedding problem – if its "value" outputs behave inconsistently in different linguistic contexts – then claiming it "has moral attitudes" in any meaningful, reason-guiding sense becomes highly suspect. The Frege-Geach problem provides a powerful lens to scrutinize the depth and coherence of AI value alignment.
