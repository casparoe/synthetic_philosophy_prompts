  Here's an argument demonstrating that the deflationist's dilemma is structural, not merely presentational, and that escaping it requires sacrificing a core commitment of deflationism (specifically, the *explanatory inertness* or *non-substantiveness* of the truth predicate):

  **The Structural Dilemma:**

  1.  **The Core Deflationist Commitment:** Deflationism holds that the concept of truth is *insubstantial*. Its function is purely *logical* or *expressive* (e.g., enabling generalizations like "Everything the Pope says is true," or disquotation: "Snow is white" is true iff snow is white). Truth is not a robust property grounding correspondence, coherence, utility, etc. There is no substantive "nature of truth" to theorize about. Consequently, deflationists deny that sentences like "Truth is correspondence with reality" express deep metaphysical truths *about truth itself*.

  2.  **The Apparent Disagreement:** A substantive theorist (Barry) asserts: "Truth is correspondence with reality (CR)." The deflationist (Alice) asserts: "Truth is not correspondence with reality" or, more fundamentally, "There is no substantive property like correspondence that truth consists in." They seem to disagree.

  3.  **The Threat of Trivialization:** If this disagreement is substantive *about the nature of truth*, then Alice's own view (deflationism) *is* a substantive theory about the nature of truth (namely, that it has no substantive nature beyond its logical role). This contradicts the core deflationist commitment (#1). Deflationism trivializes itself if it becomes just another competitor in the substantive truth theory arena.

  4.  **The Natural Diagnosis:** To avoid trivialization, Alice *must* diagnose the apparent disagreement as *merely verbal* or based on a *misunderstanding*. She says: "Barry misunderstands the *concept* of truth. He thinks 'truth' names a substantive property, but it doesn't. He's attributing meaning to the word 'truth' that it doesn't actually possess." Alice claims Barry is conceptually confused about what "truth" means.

  5.  **The Dilemma's Crux:** This diagnosis (#4) is itself a *substantive claim about the concept of truth*.
      *   It asserts that the concept "truth" has a *specific nature* (logical/expressive) that Barry fails to grasp.
      *   It asserts that Barry's utterance "Truth is CR" is *mistaken* because it misapplies the concept – it attributes a property (substantiveness) that the concept inherently lacks.
      *   This diagnosis treats the *concept* of truth as having a substantive, determinate content that Barry gets wrong. Alice is making a claim *about what the concept of truth fundamentally is (or isn't)*.

  6.  **Reintroducing Substantiveness:** By making this diagnosis, Alice has implicitly committed herself to a substantive view *about the concept of truth itself*. She is saying the concept has inherent constraints (it *cannot* be substantive) that Barry violates. This reintroduces the very kind of substantive disagreement (#3) she was trying to dissolve: Alice now says "The concept of truth is inherently non-substantive," while Barry, in asserting "Truth is CR," arguably presupposes "The concept of truth *is* substantive." The disagreement hasn't been dissolved; it has shifted to a meta-level about the nature of the *concept* "truth."

  7.  **The Structural Nature:** This is not a flaw in *how* Alice presents her diagnosis. It arises from the *logical structure* of the positions:
      *   **Deflationism's Core:** Truth (the concept/property) has *no* substantive nature.
      *   **Diagnosis Requirement:** To explain disagreement without self-trivialization, Alice must make a substantive claim *about the concept* (its nature is non-substantive).
      *   **Contradiction:** Claiming the concept has the substantive nature of being non-substantive directly contradicts the core commitment that it has *no* substantive nature. The diagnosis *requires* attributing a substantive property to the concept ("non-substantive") that deflationism denies the concept *can* have.

  **The Costly Escape and the Sacrifice:**

  The deflationist *can* try to escape this dilemma, but only by sacrificing a key motivation for being a deflationist in the first place: the **explanatory inertness** or **purely expressive role** of the truth predicate.

  *   **Option 1: Semantic Ascent (Cost: Explanatory Ambition):** Alice could retreat to a purely meta-linguistic level: "Barry's *sentence* 'Truth is CR' is false or misguided because it fails to recognize the purely disquotational role of 'is true' in our language." This avoids directly attributing a substantive nature to the *concept*. However, this severely limits deflationism's explanatory power. It cannot genuinely *explain why* Barry is wrong *about truth itself*, only that his sentence doesn't fit the rules governing the word 'true'. It makes deflationism a claim about linguistic convention, not about the nature of truth. This sacrifices the deflationist's ability to offer a deep diagnosis of Barry's *conceptual* error. It feels like ducking the fundamental philosophical question Barry thinks he's addressing.
  *   **Option 2: Primitive Conceptual Competence (Cost: Simplicity/Neutrality):** Alice could claim her understanding of the concept is primitive and correct, while Barry's is defective, without analyzing *why* this is so in substantive terms. She simply asserts her conceptual competence. However, this is deeply unsatisfying philosophically. It offers no *explanation* for the disagreement beyond "I'm right, he's confused." It sacrifices deflationism's claim to offer a simple, non-mysterious account. Further, it implicitly treats conceptual competence regarding "truth" as a substantive fact about the speaker, reintroducing substance through the back door.
  *   **Option 3: Embrace Triviality (Cost: Deflationism Itself):** Alice could concede that her view *is* a minimal substantive theory: "Truth is merely the property captured by the disquotation schema." But this concedes the game to the substantivist. Deflationism becomes a very thin, but still substantive, theory of truth (e.g., a form of minimal realism or disquotationalism), abandoning its core claim of *in*substantiveness. This sacrifices the entire deflationary motivation.

  **Conclusion:**

  The deflationist's attempt to diagnose her disagreement with the substantivist without trivializing her own view inevitably forces her into making a substantive claim *about the concept of truth itself* (e.g., that it is inherently non-substantive). This reintroduces the substantive disagreement it was meant to dissolve, contradicting deflationism's core tenet that truth has *no* substantive nature. This contradiction arises from the *logical structure* of the positions and their interaction, not merely presentation.

  The deflationist *can* escape the contradiction by adopting strategies like semantic ascent or appealing to primitive competence. However, these escapes come at a significant cost: they either sacrifice deflationism's ambition to explain the *conceptual* error of substantivism (rendering it shallow or merely linguistic), rely on unexplained primitives (undermining its simplicity), or effectively abandon the core deflationary commitment to the complete insubstantiality of truth. Therefore, resolving the dilemma structurally requires the deflationist to give up something central to the appeal and motivation of her position, namely its claim to provide a non-substantive, purely expressive/logical account that dissolves substantive metaphysical debates about truth.
