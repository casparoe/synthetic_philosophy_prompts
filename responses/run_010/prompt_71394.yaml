  ### Diagnoses of Branches
  - **Empty/rare branches** (logically possible but likely unoccupied):  
    - **Q7C (Motive Skeptic) → Unattractive**: Few hold this because inaction feels irresponsible; scientists prefer testable models.  
    - **Q6A + Q7B combination → Incoherent**: Ignoring long shots (Q6A) conflicts with racing toward tech (Q7B), as the latter requires long-term stakes.  
    - **Simulation Expansionist (Q9A) → Merely unexplored**: Many haven’t considered that sims could *increase* obligations; ideal for your two curious members.  
  - **Underseparated pairs** (needs an extra question to split):  
