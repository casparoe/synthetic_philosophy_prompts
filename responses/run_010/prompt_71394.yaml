  ### Leaf Positions
  Each leaf includes:  
  - **Name**: Short, descriptive label (invented for clarity).  
  - **Uncomfortable commitment**: One-sentence ethical or practical burden.  
  - **Tuesday action**: Concrete, mundane behavior reflecting the position.  

  #### From Epistemic Branch (Q2, Q6–8): Focus on future existence/length
  - **Near-Term Pragmatist** (Q6A):  
    - Commitment: You must accept that investing in the far future is irrational if its likelihood is low, even if its potential value is astronomical.  
    - Tuesday action: Redirect donations from long-term charities (e.g., asteroid defense) to near-term causes (e.g., poverty relief).  
  - **Long-Shot Gambler** (Q6B):  
    - Commitment: You must prioritize vanishingly unlikely scenarios if they offer huge upside, potentially neglecting near-certain harms.  
    - Tuesday action: Advocate for spending billions on trillion-year threats (e.g., proton decay research) over immediate needs.  
  - **Probability Hedger** (Q6C):  
    - Commitment: You must split resources across all futures, even when some strategies conflict (e.g., preparing for both short and long runs).  
    - Tuesday action: Support "no-regrets" policies (e.g., AI safety that helps now and later).  
  - **Tech Restrictionist** (Q7A):  
    - Commitment: You must suppress certain technologies (e.g., AI) despite their benefits, to avoid simulator-triggers.  
    - Tuesday action: Campaign for bans on "risky" tech (e.g., advanced AI development).  
  - **Tech Accelerator** (Q7B):  
    - Commitment: You must embrace existential risks (e.g., rushing dangerous tech) to potentially "escape" the simulation.  
    - Tuesday action: Invest in high-risk, high-reward tech startups (e.g., brain-computer interfaces).  
  - **Motive Skeptic** (Q7C):  
    - Commitment: You must admit we can’t predict simulator behavior, making strategic planning guesswork.  
    - Tuesday action: Prioritize gathering data on "sim-like" anomalies (e.g., quantum mysteries) over action.  

  #### From Axiological Branch (Q3, Q9–10): Focus on value
  - **Consciousness Skeptic** (Q3C):  
    - Commitment: You must deny moral status to simulations unless consciousness is proven, even if they appear sentient.  
    - Tuesday action: Oppose AI rights activism until consciousness tests are established.  
  - **Simulation Expansionist** (Q9A): *[Makes you MORE ambitious]*  
    - Commitment: You must prioritize creating simulated minds over real-world welfare, as it scales value infinitely.  
    - Tuesday action: Lobby for laws that incentivize "ethical" simulation tech (e.g., tax breaks for virtual utopias).  
  - **Reality-First Universalist** (Q9B):  
    - Commitment: You must value simulated beings but subordinate them to base-reality interests, creating ethical trade-offs.  
    - Tuesday action: Donate to charities that aid real humans first, then support digital sentience research.  
  - **Anchored Presentist** (Q10A):  
    - Commitment: You must treat humanity’s survival as less urgent if simulations are possible, risking real suffering for epistemic reasons.  
    - Tuesday action: Scale back climate activism, focusing on personal/local community resilience.  
  - **Experience Purist** (Q10B):  
    - Commitment: You must ignore the simulation hypothesis entirely when weighing value, as experiences matter regardless of substrate.  
    - Tuesday action: Continue long-term activism (e.g., for nuclear disarmament) as if simulations don’t affect value.  

  #### From Causal Branch (Q4): Focus on influence
  - **Leverage Optimist** (Q4A):  
    - Commitment: You must act as if we can control simulation outcomes (e.g., via tech avoidance), despite no evidence of simulator responsiveness.  
    - Tuesday action: Join advocacy groups for "sim-safe" tech policies (e.g., delaying AI).  
  - **Fatalist** (Q4B):  
    - Commitment: You must concede that human agency is illusory in a simulation, undermining moral responsibility.  
    - Tuesday action: Focus on personal hobbies (e.g., gardening) over collective action.  
  - **Simulator Diplomat** (Q4C):  
    - Commitment: You must prioritize "signaling" to simulators (e.g., via art or crises) over direct problem-solving.  
    - Tuesday action: Create provocative content (e.g., philosophy blogs) aimed at "catching" simulator attention.  

  #### From No-Change Branch (Q5): Focus on steadfastness
  - **Steadfast Universalist** (Q5A):  
    - Commitment: You must weight all conscious experiences equally, even if simulations dominate value calculations.  
    - Tuesday action: Balance volunteering for near-term causes with long-term/AI ethics work.  
  - **Steadfast Humanist** (Q5B):  
    - Commitment: You must prioritize Earth-originating beings, even if simulations contain more potential value.  
    - Tuesday action: Focus exclusively on human-centric causes (e.g., education reform).  

