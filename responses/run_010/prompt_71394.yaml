    - **Case C (Q6/Q8/Q10) oversimplifies odds**; engineers might balk at "1-in-a-million" as arbitrary. I kept it to dramatize fanaticism debates.  

  ### Most Sorting at: Question 1
  In a room like yours (scientists/engineers), **Question 1** does the most sorting. It forces people to isolate *why* the simulation hypothesis matters: as a threat to future existence (epistemic), value (axiological), or control (causal). This split matters because it determines which arguments will sway them (e.g., Case A for causal/epistemic, Case B for axiological). The "no change" (D) option also isolates principled universalists/humanists, who are immune to simulation arguments.  

