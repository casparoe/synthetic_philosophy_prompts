prompt: |-
  I TA an intro ethics section and Thursday I've got fifty minutes on the Mencius/Xunzi disagreement about human nature. They'll be coming off two weeks of Aristotle, so half of them will walk in already saying Xunzi is just Aristotle with a different word for habituation and calling it a day. Don't explain the debate to me — plan how I should teach it.

  Give me the order the pieces have to go in and what depends on what. My guess is the four sprouts have to be on the table before Xunzi's claim that nature is bad can register as a denial of anything rather than as a nasty rumor, but I could be wrong, and if the order is different say why. Then which single example should carry the whole thing and what it has to have and what it has to lack — I've been defaulting to the kid about to fall into the well, but tell me if that's a trap given where they're coming from, since it invites them to hear a claim about feelings where Mencius is making a claim about what humans are.

  Then the misconception map: nature versus nurture, bad meaning actively evil, Mencius supposedly holding that we're born good so there's nothing to cultivate, the habituation mapping onto Xunzi, and whatever else they'll generate in the room — with the exact point in the sequence where I head each one off, not a list at the end.

  And there's the thing I can't resolve myself, so I don't want it buried. It looks to me like they aren't even using the word nature the same way — Mencius seems to mean the thing that separates humans from other animals, Xunzi seems to mean whatever you're born with that no teaching or effort could have produced. If that's right, is there a substantive disagreement underneath or is most of the fight definitional? Build an answer into the plan rather than steering around it, because if I punt on it theyll smell it, and if the answer is that there's real substance left over once you fix the definitions, I need to know which example exposes that residue.

  Finish with the one question I can ask around minute forty-five that tells me whether they got the dispute or just the two slogans, and tell me what I should openly leave out at this level and say out loud that I'm leaving it out.

  Bottom line first: the first sentence should be the call that decides whether this section works or not, then the plan. No preamble, don't restate my question back at me.
reasoning: |-
  Okay, the user is a TA preparing a 50-minute ethics section on the Mencius/Xunzi debate. They've just finished two weeks on Aristotle, so students might oversimplify Xunzi as "Aristotle with different terminology." The challenge is to structure the session to prevent that. 

  First, I need to identify the core pitfall: students mapping Xunzi's "habituation" onto Aristotle's concept. But Xunzi's ritual (li) isn't just habit—it's reshaping innate tendencies, while Aristotle's habituation builds on natural potential. This distinction must surface early.

  The sequence matters. Starting with Mencius' sprouts (siduan) is crucial because Xunzi's "nature is bad" only shocks if we first grasp what Mencius affirms. The well-child example must illustrate innate compassion as a universal human trait, not just feeling. But I worry students might reduce it to emotion—so I'll emphasize Mencius' point: this reaction reveals our inherent moral structure. 

  The definitional clash is pivotal. Mencius defines renxing (human nature) as what makes us distinctively human (the sprouts); Xunzi defines it as raw, untrained instincts. The disagreement is substantive: for Mencius, cultivation nurtures innate goodness; for Xunzi, it overrides innate disorder. The "ritual versus sprouts" contrast exposes this—ask why Xunzi rejects sprouts if they seem observable. 

  Misconceptions need preemptive strikes: 
  - "Nature vs nurture": Kill this at the start by clarifying both philosophers agree cultivation is essential—they disagree on *what* is being cultivated. 
  - "Bad means evil": Correct when introducing Xunzi—"bad" here means "unrefined," like warped wood. 
  - "Mencius denies need for effort": Debunk when contrasting their views of ritual—Mencius' sprouts *require* cultivation like seedlings need water. 

  The knockout question at minute 45: "Why couldn't Xunzi accept the well-child example as proof of innate goodness?" If they grasp that he'd dismiss it as a fleeting instinct (not a moral sprout), they get the core dispute. 

  Openly omit deeper metaphysical debates (e.g., Mencius' connection to cosmos) to focus on the human-nature clash. Say this explicitly—it builds trust. 

  The make-or-break? Rigorously separating "ritual as correction" (Xunzi) from "ritual as cultivation" (Mencius/Aristotle). If that lands, the section works.
answer: |-
  **Bottom line:** You must establish that Xunzi's "wei" (conscious activity/artifice) is **fundamentally corrective**, not merely additive like Aristotle's habituation, *before* comparing him to Aristotle, or the "just Aristotle" mapping will stick. Success hinges on making Xunzi's *hostility* to innate structure clear.

  **The Plan (50 Minutes):**

  1.  **(0-5 min) Framing the Stakes & Defining "Xing" (Nature):** Start *not* with Mencius or Xunzi, but with the core question: **"What, *fundamentally*, must we do to become ethical? Build on something innate, or fight against it?"** Immediately clarify the Chinese concept of **"xing" (性)**: It means *what is innate, inherent, spontaneous, given* (like water's tendency to flow down). Crucially, note it's *not* the Western "nature vs. nurture" binary – **both Mencius AND Xunzi agree cultivation ("nurture") is essential.** The fight is about the *starting material* ("xing").

  2.  **(5-15 min) Mencius: The Sprouts & The Well (The Positive Structure):**
      *   **The Sprouts:** Introduce the **4 Sprouts (siduan)** – compassion (ren), shame/dislike (yi), deference (li), approval/disapproval (zhi). **Crucial:** Frame them **not just as feelings, but as innate *capacities/orientations* that *define* being human** (what separates us from beasts). They are the *foundation*.
      *   **The Well Child Example:** Use it, **BUT crucially contextualize:** "Mencius isn't *just* saying you feel bad for the kid. He's saying **this spontaneous, unlearned reaction *reveals* the Sprout of Compassion – the *innate structure* of your humanity.** It's evidence of the *potential/blueprint* within." **Why not a trap?** Because Aristotle's virtues start from natural capacities *too*. The contrast with Xunzi comes next.

  3.  **(15-25 min) Xunzi: The Warped Wood & Nature as "Bad" (The Negative/Neutral Material):**
      *   **"Xing is Bad":** Introduce Xunzi's claim. **IMMEDIATELY DEFUSE "BAD"**: "Xunzi does *not* mean we are born evil monsters. He means our innate nature (**xing**) is **uncultivated, undisciplined, self-interested, chaotic** – like 'warped wood.' Left alone, it leads to conflict and disorder."
      *   **The Warped Wood Metaphor:** "Just as warped wood *must* be steamed and forced straight, human nature *must* be fundamentally reshaped."
      *   **HEAD OFF MISCONCEPTIONS HERE:**
          *   **"Bad = Evil?":** No, clarified above – uncultivated, unruly.
          *   **"Mencius = No Cultivation Needed?":** Emphasize Mencius *requires* cultivation (nurturing sprouts) – both agree effort is vital. The fight is over the *material* being cultivated.

  4.  **(25-35 min) Ritual (Li) as the Tool: The CRITICAL DIVERGENCE from Aristotle:**
      *   **Mencius's Li:** Ritual cultivates, waters, and guides the *innate sprouts* towards full virtue. It's growth based on internal potential. **Map: Some similarity to Aristotle's habituation *developing* natural capacities.**
      *   **Xunzi's Li:** Ritual is **artifice ("wei")**. It is **externally imposed to *correct, restrain, and reshape* the inherently problematic xing.** It suppresses innate tendencies and imposes order. **"Wei" is CONSCIOUS EFFORT *against* nature.**
      *   **THE KEY POINT:** "For Xunzi, ritual doesn't *cultivate* something good already nascent within (like Mencius or Aristotle); it *fights* and *replaces* what's naturally there. **Habituation isn't just practice; it's corrective discipline."** This is where "just Aristotle" dies.

  5.  **(35-45 min) The Substantive Disagreement Underneath the Definitions:**
      *   **Acknowledge the Definitional Difference:** "Yes, they define 'xing' differently! Mencius: *Distinctive human potential* (sprouts). Xunzi: *Raw, pre-social endowment* (instincts/desires)."
      *   **Expose the Residue:** "But there's a **real, substantive fight**: **Is there an inherent *moral structure/compass* within humans (Mencius) that cultivation works *with*, or is the moral order *entirely external*, imposed *upon* chaotic raw material (Xunzi)?**"
      *   **The Example That Exposes It:** **Revisit the Well Child.** Ask: "Xunzi would *dismiss* this! Why? He'd say it's just a fleeting impulse, perhaps self-interest disguised (e.g., fear of social censure), **not evidence of an innate moral sprout.** It doesn't prove a *reliable structure* to build on. True morality comes *only* from learned ritual, not nature." This highlights the irreconcilable core: the existence or non-existence of *innate moral potential*.

  6.  **(45-50 min) Knockout Question & Conscious Omission:**
      *   **The Question:** **"Why can't Xunzi just say the Well Child reaction is the 'sprout' that his rituals cultivate? What's fundamentally stopping him?"**
          *   **Correct Answer:** He denies that reaction *is* a reliable moral sprout or evidence of an inherent moral structure. It's merely a raw impulse, insufficient and potentially misleading. Ritual is needed to *create* morality, not cultivate something innate. He rejects the *existence* of Mencius's sprouts as the foundation.
      *   **Conscious Omission:** **"We're focusing on the core debate about human nature and cultivation. We're *not* diving deeply into their metaphysics (like Mencius's connection to Tian/Heaven) or the full scope of their political philosophies today. This is about the foundation of ethics within the person."** Say this explicitly.

  **Why this order?**
  1.  **"Xing" defined first** prevents later confusion about the object of dispute.
  2.  **Mencius first** sets the "innate structure" baseline Xunzi explicitly denies. Seeing the Sprouts makes Xunzi's "bad" a shocking *rejection*, not just a different starting point.
  3.  **Xunzi's "bad" clarified immediately** prevents the "evil" misconception.
  4.  **Ritual/Li comparison placed AFTER both views are established** allows you to highlight the *functional difference* based on their opposing views of **xing**. This is where the Aristotle confusion is actively dismantled by showing Xunzi's *corrective* purpose.
  5.  **Explicitly addressing the definitional issue AND the residue** prevents students thinking it's just semantics and reveals the deep philosophical chasm.
  6.  **The Well Child revisited** concretizes the unresolved conflict perfectly for the knockout question.

  **Stick with the Well Child:** It's iconic and perfect *if* you consistently frame it as **evidence of an innate structure/orientation (Mencius)** and then show how **Xunzi dismisses its significance as anything other than raw impulse**. The danger of reducing it to "just feelings" is mitigated by your initial framing in Step 2 and the revisiting in Step 5.
