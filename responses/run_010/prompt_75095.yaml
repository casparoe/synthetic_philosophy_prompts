  We are building a decision tree with about 8 questions that will lead the reader to one of several named endpoints (leaves) representing different positions on the nature of genetic information. The questions must be concrete scenarios or specific claims, avoiding labels and self-description.

  We start by identifying the logical axes (independent dimensions) that structure the debate. These will help us map out the possible positions and then design questions that probe along these axes.

  Key axes:

  1. **Literal vs. Metaphorical**: Is the language of "code", "message", or "instructions" literally true (i.e., the genome contains semantic information) or is it merely a useful metaphor?
  2. **Semantic Grounding**: If information is real, is it grounded in (a) evolved biological function (teleosemantics) or (b) the chemistry and physics of the system (causal structure) without requiring an evolutionary history? Or is it not semantic at all?
  3. **Location of Information**: Is information primarily located in the DNA sequence itself, or is it distributed across the entire developmental system (with DNA being one part among equals)?
  4. **Shannon Information vs. Biological Meaning**: Does the concept of information in biology reduce to Shannon information (quantifiable in terms of reduction of uncertainty) or is there an additional layer of biological meaning (semantic content) that cannot be captured by Shannon information?
  5. **Explanatory Role**: Does the concept of genetic information do explanatory work that cannot be reduced to a complete causal description of the physical processes?

  We then map the positions (leaves) we want to include:

  - **Literal Program View**: The genome is literally a coded program with fixed semantics provided by the cellular machinery.
  - **Functional Realism**: Genetic information is real but derivative, grounded in evolved function (teleosemantics).
  - **Deflationary View**: Reduces information to measurable difference-making (causal role) and treats the rest as metaphor.
  - **Quantitative View**: Information is a unit of Shannon information and nothing more (no semantics).
  - **Developmental System View**: Information belongs to the entire developmental system; no privileged role for DNA.
  - **Ill-Posed Question**: The question of whether the genome is a code is not well posed.

  We note that some combinations of axes may be unoccupied. For instance, a view that information is literal and semantic but not grounded in evolution might be unattractive because without evolution, how does the semantics arise? Also, a view that information is both literal and located in the DNA alone but without any explanatory role beyond causation might be incoherent.

  Now, we design the decision tree. We aim for about 8 questions. We start with concrete scenarios that probe the axes.

  Question 1: (Location and Literalness) Consider a scenario where a cell's cytoplasmic machinery (including all proteins, RNAs, etc.) is completely dismantled, but the DNA is left intact and undamaged. If we then provide a fresh set of cytoplasmic machinery from a different cell of the same species, what happens?
  - Option A: The cell will function normally; the DNA contains the complete instructions to rebuild the organism.
  - Option B: The cell will not function normally because the developmental information was distributed and the original cytoplasmic state was crucial.
  - Option C: The cell might function, but not because of "instructions" in the DNA; rather, the DNA is a passive template that the machinery uses.

  This question probes whether the DNA alone is sufficient and whether it carries active instructions.

  Question 2: (Semantic Grounding and Literalness) Suppose scientists create a synthetic genome by reassigning every instance of a particular codon (say, changing all TTT codons to TTC) to code for the same amino acid (both code for phenylalanine). They then insert this synthetic genome into a cell. Does the synthetic genome carry the same instructions as the natural one?
  - Option A: Yes, because the sequence change is synonymous and the amino acid sequence is the same.
  - Option B: No, because the change might affect other aspects (like folding speed) and the instructions are tied to the exact sequence.
  - Option C: The concept of "same instructions" is not applicable because the genome is not literally a set of instructions.

  Question 3: (Epigenetic Information) Consider a heritable epigenetic mark (e.g., DNA methylation) that alters the phenotype of an organism (e.g., makes it more resistant to cold). Is this epigenetic mark carrying information in the same sense as the DNA base sequence that it marks?
  - Option A: Yes, both are forms of biological information that can be inherited and influence traits.
  - Option B: No, the DNA sequence is the fundamental information; the epigenetic mark is just a modification of how that information is read.
  - Option C: Neither is information in a literal sense; both are just causal factors.

  Question 4: (Parental Contribution) In sexual reproduction, does the egg (with its cytoplasm, organelles, and epigenetic factors) contribute the same kind of causal contribution to the offspring as the sperm (which contributes mainly DNA)?
  - Option A: No, the sperm contributes the genetic blueprint, while the egg contributes the building materials and environment.
  - Option B: Yes, both contribute essential factors that are causally intertwined and neither is privileged.
  - Option C: The entire framing in terms of "causal contribution" is misleading; we should think in terms of a unified developmental system.

  Question 5: (Reconstruction from Sequence) If we had a perfect reader (a machine that can interpret the entire DNA sequence) and the complete DNA sequence of an organism, could we reconstruct the organism in full detail (including its development, behavior, etc.)?
  - Option A: Yes, the DNA sequence is sufficient because it contains the complete program.
  - Option B: No, because the DNA sequence alone does not specify the environment, the state of the cytoplasm, or other factors.
  - Option C: The question assumes a false premise: DNA is not a program to be read but one component in a system.

  Question 6: (Information in Database vs. Cell) Consider a DNA sequence sitting in a public database as text and the same sequence sitting in a living cell. Is the informational content identical in both places?
  - Option A: Yes, the information is in the sequence itself, regardless of context.
  - Option B: The information is present only in the cell because it requires the cellular machinery to be interpreted.
  - Option C: The information is duplicated: the database has the syntactic information, but only the cell has the semantic meaning.

  Question 7: (Explanatory Role) Once we have specified every causal interaction in the development of an organism, does the concept of "genetic information" still do any explanatory work?
  - Option A: Yes, because it explains why the organism is adapted and how variation can lead to evolution.
  - Option B: No, because the causal account is complete and the information talk adds nothing.
  - Option C: It might be useful for communication, but it doesn't add new explanatory power.

  Question 8: (Shannon Information) Can the amount of information in a genome be fully captured by Shannon information (which measures the reduction of uncertainty) without invoking any biological meaning?
  - Option A: Yes, because the information is just the sequence and its statistical properties.
  - Option B: No, because the meaning of the sequence (e.g., which parts are genes) is essential and not captured by Shannon.
  - Option C: Shannon information is a tool for communication theory and is not the same as biological information.

  Now, we map the answers to the positions. We must be cautious because the same answer might be given for different reasons, so we may need to adjust the order and content of questions to disentangle.

  We also note that the tree must be designed so that each path leads to a leaf. We have 6 leaves, so we need about 8 questions to get sufficient branching.

