prompt: |-
  Our group is building an evaluation harness that asks language models for numerical credences in indicative conditionals — items of the form "if the patient is switched to the second-line drug, the tumour shrinks," "if the flag is set at build time, the binary links statically" — and scores those numbers against outcomes. I have been treating the conditional probability of consequent on antecedent as the obvious target, but that assumption silently commits me to a semantics, and I want the commitments written down before the scoring rule is locked. So: what would an account of the indicative conditional have to deliver in order to serve as the normative target of an instrument like this?

  Write the desiderata. For each, give me (i) the requirement, stated precisely enough that I could tell whether a candidate account meets it; (ii) the case, linguistic datum, or theorem that motivates it; and (iii) a judgment on whether it is genuinely non-negotiable for my purpose or a partisan preference of some camp that I would be smuggling in as a criterion of adequacy. Mark clearly which items bear on the scoring of numbers, as opposed to mattering only for a semantic theory in the abstract.

  Include the standard candidates and add any I have overlooked: that a rational agent's degree of belief in a conditional should equal the corresponding conditional probability; that the conditional must not behave truth-functionally, and in particular must not collapse into the material conditional, whose verdicts come out wrong whenever the antecedent is improbable; that contraposition, transitivity, and strengthening of the antecedent should fail while modus ponens survives; that import-export should fail; that the account should explain why a conditional is assertible on partial evidence in a way its conjunctive counterpart is not; that it should extend coherently to compounds of conditionals; and that acceptance of a conditional should relate to belief revision in the Ramsey-test manner, given that this relation is known to conflict with standard postulates for revision.

  Then the two parts I care about most. First: which subsets of this list cannot be satisfied jointly. I know triviality results live in this neighbourhood, and I want them stated exactly — which desideratum each one puts in conflict with which other, what the proofs assume (in particular, whether the clash depends on demanding that the identity hold for every probability function in a family closed under conditioning), and whether what emerges is a genuine theorem about conditionals or an artifact of how the space of probability functions was set up. Second: given that, is there a requirement I must surrender to keep the harness coherent at all, and is there a weaker target short of assigning probabilities to conditionals — a conditional scoring rule evaluated only on trials in which the antecedent actually obtains, an imaging-style update of the reference distribution, something else you would propose — together with an accounting of how much of the list each fallback still buys.

  Close with your view on which single requirement does the most work in eliminating candidate accounts, and, in a paragraph each at most, how the suppositional line, a selection-semantics account of the Stalnaker type, Lewis's own proposed alternative, and a frankly truth-functional treatment fare against the list. Prose or table, as you prefer. No bibliography and no reading list — I want the arguments, not the references.
reasoning: |-
  We are building an evaluation harness for language models that outputs numerical credences for indicative conditionals. The goal is to score these numbers against outcomes. The main issue is that the natural target (conditional probability) is not uncontroversial, and we must be clear about what we require from a normative account of the indicative conditional.

  We list desiderata for an account of the indicative conditional to serve as the normative target. For each, we provide:
  (i) the precise requirement,
  (ii) the linguistic datum or theorem motivating it, and
  (iii) whether it is non-negotiable for our purpose (scoring) or a partisan commitment.

  We then address:
  - Which subsets of desiderata cannot be satisfied jointly (triviality results).
  - What requirement we might surrender to keep the harness coherent, and what weaker targets (e.g., conditional scoring only when antecedent is true, imaging, etc.) might be used, and how much of the list they satisfy.
  - Which requirement does the most work in eliminating candidate accounts.
  - Brief assessments of four accounts: suppositional, Stalnaker, Lewis, and truth-functional.

  **Desiderata for the Normative Target**

  1. **Conditional Probability (CP) Requirement**  
     (i) For any rational credence function P, and for any indicative conditional "If A, then C" (denoted A→C), it holds that P(A→C) = P(C|A), provided P(A)>0.  
     (ii) Motivated by the Ramsey test: to evaluate A→C, we hypothetically add A and adjust our beliefs accordingly, then evaluate C. Also, by linguistic data: e.g., the famous "probability of the conditional" experiments (e.g., by Adams and others) showing that people's degrees of belief in conditionals align with conditional probability.  
     (iii) **Non-negotiable?** This is the core of our initial approach, but we must note that it is precisely what leads to triviality. Without it, we might not have a clear target. However, for scoring, if we are to score the model's output against something, we need a target. But if we abandon CP, we need an alternative. So for the harness, we must have a target. However, the triviality results show that CP cannot hold in general for all propositions. Therefore, it might be that we must restrict the scope (e.g., only for simple conditionals, or only in certain contexts). **Bears on scoring?** Yes, directly.

  2. **Non-Truth-Functionality (Non-TF)**  
     (i) The conditional must not be truth-functional. In particular, it must not be the material conditional (which is A⊃C ≡ ¬A∨C).  
     (ii) Linguistic data: conditionals with false antecedents are not automatically true. For example, "If this match is wet, then it will light when struck" is false (or inappropriate) even if the match is dry (so antecedent false) but the conditional is not true because the connection is absent. Also, when the antecedent is improbable, the material conditional is easily true (since ¬A is probable) but we don't want to assign high probability to the conditional in such cases.  
     (iii) **Non-negotiable?** Widely accepted, but note that some (like Grice) try to rescue the material conditional with pragmatics. For scoring, if we were to use the material conditional, then the target would be P(¬A∨C), which is 1-P(A)+P(A∩C). But then we would be scoring against the truth value of the material conditional, which is not what we want because the material conditional is often true when the antecedent is false, but the indicative conditional is not necessarily assertible then. So for the harness, we want to avoid the material conditional as the target. **Bears on scoring?** Indirectly: if we adopt a truth-functional account, then the target would be different, and we would score accordingly. But we are assuming that we don't want that.

  3. **Failure of Certain Inferences (Failures)**  
     (i) The logic of the conditional must invalidate:  
          - Contraposition: A→C does not entail ¬C→¬A.  
          - Transitivity: A→C and C→B do not entail A→B.  
          - Strengthening of the Antecedent (SA): A→C does not entail (A∧B)→C.  
          But it must validate Modus Ponens (MP): A→C and A entail C.  
     (ii) Linguistic data:  
          - Contraposition: "If it rains, the party won't be canceled" does not entail "If the party is canceled, then it didn't rain" (maybe it was canceled for other reasons).  
          - Transitivity: "If I quit my job, I will get a new one" and "If I get a new job, I will be happy" do not entail "If I quit my job, I will be happy" (maybe I quit and then don't get a new job).  
          - SA: "If I strike this match, it will light" does not entail "If I strike this match and it is wet, it will light".  
          - MP is fundamental: if we accept A→C and A, we must accept C.  
     (iii) **Non-negotiable?** These are standard in the literature and supported by data. However, note that some systems (like Stalnaker's) validate some of these (like MP) but not others. For scoring, this does not directly bear on the numerical score, but if the conditional is to be embedded in complex statements, then the logic matters. However, our harness might only ask for simple conditionals. So if we are only scoring simple conditionals, then these might not be directly relevant. But if we want to extend to compounds, then they are. **Bears on scoring?** Only indirectly: if we are scoring the model's credence for a conditional, the logic of conditionals might affect how we interpret complex cases, but for simple conditionals, the scoring rule for the simple conditional does not depend on these.

  4. **Import-Export (IE)**  
     (i) The principle of import-export: A→(B→C) is equivalent to (A∧B)→C.  
     (ii) This principle is intuitive and seems to hold in many contexts. For example, "If the light is on, then if the switch is flipped, the bulb is broken" seems equivalent to "If the light is on and the switch is flipped, then the bulb is broken". However, it is known that IE together with CP leads to triviality (via Lewis's result).  
     (iii) **Non-negotiable?** This is controversial. Some accounts (like Stalnaker) reject IE. For scoring, if we are only dealing with simple conditionals, IE might not come up. But if we allow nested conditionals, then it becomes relevant. Since our harness might avoid nested conditionals, we might not need to require IE. However, note that the triviality results use IE and CP. So if we want CP, we must reject IE. **Bears on scoring?** Only if we have nested conditionals in the evaluation.

  5. **Assertibility on Partial Evidence (Assertibility)**  
     (i) The account must explain why we can assert a conditional A→C even when we are uncertain about A and/or C, but we cannot assert the conjunction A∧C (or the material conditional) in the same context. In particular, the conditional is assertible when P(C|A) is high, even if P(A) is not 1.  
     (ii) Linguistic datum: we say "If it rains, the match will be canceled" when we are not sure it will rain, and we are not sure the match will be canceled, but we are sure that if it rains, then the match will be canceled.  
     (iii) **Non-negotiable?** This is a key feature of conditionals. For scoring, we are asking for a number, so we are already allowing uncertainty. But we require that the target we score against must be defined even when the antecedent is uncertain. This is non-negotiable because we want to evaluate conditionals even when the antecedent might turn out false. **Bears on scoring?** Yes: we must have a target that is defined even when the antecedent is false (or when we are uncertain).

  6. **Coherent Embeddings (Embedding)**  
     (i) The account must assign probabilities to compounds of conditionals (like conjunctions, disjunctions, or conditionals with conditional consequents) in a coherent way.  
     (ii) Without this, we cannot extend the language. But many accounts (especially the suppositional one) struggle with embeddings.  
     (iii) **Non-negotiable?** For our harness, if we are only scoring simple conditionals, we might avoid embeddings. But if we want to extend the harness, then it becomes important. Since the problem states that we are only asking for numerical credences in indicative conditionals (which might be simple), we might not require this. However, note that the triviality results show that if we want conditionals to be propositions (so that they can embed) and also satisfy CP, then we get triviality. So if we require conditionals to be propositions (and hence embeddable) and also CP, we get a contradiction. Therefore, we might have to choose. **Bears on scoring?** Only if we include compound conditionals in the evaluation.

  7. **Ramsey Test Belief Revision (Ramsey)**  
     (i) Acceptance of a conditional A→C should relate to belief revision: one accepts A→C in a state of belief K if and only if C is accepted in the revision of K by A (using an appropriate belief revision operator).  
     (ii) This is the core of the Ramsey test and is widely accepted as a normative requirement.  
     (iii) **Non-negotiable?** This is central to the understanding of conditionals. However, it is known to conflict with standard AGM postulates (via Gardenfors' paradox) if we require that the belief set be closed under logical consequence and that the revision operator satisfy certain properties. But for our purpose, we are dealing with degrees of belief, not full belief. The Ramsey test for degrees of belief is precisely the CP requirement. So this is already covered by desideratum 1. **Bears on scoring?** Only in that it motivates CP.

  **Which subsets cannot be satisfied jointly? Triviality Results**

  The most famous triviality results are due to Lewis (1976) and others. We state the key conflicts:

  - **Lewis's Triviality (for CP and Embedding):**  
    Assume that the conditional A→C is a proposition (so it can be embedded in boolean combinations and we can assign probabilities to it) and that CP holds for every probability function in a family that is closed under conditioning (i.e., if P is in the family, so is P(·|E) for any E with P(E)>0). Then, for any A and C, either P(C|A) = P(C) for all P, or the only probability functions in the family are such that A and C are independent. This is absurd because we can have A and C dependent in many ways.  
    **Conflict:** CP + Embedding (which requires conditionals to be propositions) + Closure under conditioning.  
    **What it shows:** If we want conditionals to be propositions (so they can embed) and CP to hold for a rich set of probability functions (closed under conditioning), then we get triviality (no non-trivial dependencies).  
    **Is it an artifact?** The closure under conditioning is a strong requirement. But it is natural if we want the account to apply to agents who update by conditioning.

  - **Gardenfors's Triviality (for Ramsey and AGM):**  
    For full belief, if we require the Ramsey test and that the belief revision operator satisfies the AGM postulates (in particular, Preservation: if ¬A is not in K, then K+A is the closure of K∪{A}), then we get triviality: the belief set must be trivial (only contains tautologies).  
    **Conflict:** Ramsey (for full belief) + AGM postulates.  
    **Relevance to our case:** We are using degrees of belief, so this does not directly apply. But it shows that the Ramsey test is in tension with standard belief revision.

  - **Impossibility of Embedding under CP:**  
    Even without closure under conditioning, if we require that conditionals are propositions and that CP holds for a given probability function P, then we can show that the conditional must be the material conditional (which we don't want). Specifically, for any two conditionals, we can derive that P(A→C) must be P(C|A) and also that P((A→C)∧B) must be ... and then we get contradictions.  
    **Conflict:** CP + Embedding (conditionals as propositions).  
    **What it shows:** Conditionals cannot be propositions and satisfy CP.

  **What requirement must we surrender?**  
  Given the above, we must choose between:
  - Keeping CP and surrendering Embedding (i.e., conditionals are not propositions and cannot embed).
  - Keeping Embedding and surrendering CP.

  **Weaker Targets and Fallbacks**

  1. **Fallback 1: Suppositional Theory (Adams' Thesis)**  
     We surrender Embedding: conditionals are not propositions and do not have truth values. Therefore, we cannot assign probabilities to them in the usual sense. Instead, we interpret the model's output as the conditional probability. Then, when we score, we only score the conditional probability when the antecedent is true? But note: the conditional probability P(C|A) is not a random variable that we can observe. What we observe is whether A and C are true.  
     **Scoring Rule:** We can use a scoring rule that is defined for conditional probabilities. For example, the logarithmic scoring rule for conditional events: if we are to score a reported conditional probability q for A→C, then we wait until we see whether A is true. If A is true, then we score the probability q for C: so if C is true, we score -log(q), if false, -log(1-q). If A is false, we do nothing (or we skip the scoring).  
     This is the standard approach for evaluating conditional probabilities (e.g., in meteorology: "if it rains, then the chance of flooding is q"). We only score when it rains.  
     **What it buys:**
     - CP: by design.
     - Non-TF: satisfied because the conditional is not truth-functional.
     - Failures: the logic of the suppositional conditional (Adams' logic) invalidates contraposition, transitivity, SA, but validates MP.
     - IE: Adams' logic does not have embeddings, so IE is not an issue. But if we try to extend, it fails.
     - Assertibility: satisfied because we can have high P(C|A) even when P(A)<1.
     - Embedding: not satisfied (cannot embed).
     - Ramsey: satisfied (by CP).

     This is the Adams-Bennett approach.

  2. **Fallback 2: Stalnaker's Selection Semantics**  
     We keep conditionals as propositions (so they embed) but surrender CP. The target is then the probability of the conditional proposition.  
     **Scoring Rule:** We score the number against the truth value of the conditional (which is either 1 or 0). But note: in Stalnaker's semantics, the conditional has a truth value even when the antecedent is false.  
     **What it buys:**
     - CP: fails (by Lewis's triviality).
     - Non-TF: satisfied (it's not truth-functional).
     - Failures: Stalnaker's logic invalidates contraposition, transitivity, and SA, but validates MP.
     - IE: fails in Stalnaker's system? Actually, Stalnaker does not accept IE. He has a different account for nested conditionals.
     - Assertibility: Stalnaker uses the concept of conditional probability for assertibility: we assert A→C when P(C|A) is high. But the truth condition is different. So we can have a high P(C|A) but the conditional might be false (if in the closest A-world, C is false). However, this is controversial. But for scoring, if we use the truth value, then we are not scoring against conditional probability. So we might have to score against the truth value. But then when the antecedent is false, the truth value of the conditional is determined by the selection function (which we don't observe). This makes scoring problematic because we don't have access to the selection function.  
     - Embedding: satisfied.
     - Ramsey: fails? Because P(A→C) is not generally P(C|A). But Stalnaker does have a connection: in some cases (e.g., when the probability is uniform over worlds) they might coincide, but not in general.

     **Problem for scoring:** We cannot observe the truth value of the conditional when the antecedent is false because it depends on a non-actual world. Therefore, we cannot score the model's credence against the outcome because the outcome only gives us the actual world. So we must restrict scoring to cases where the antecedent is true? But then we are only using a subset of the data. And even then, when the antecedent is true, the conditional A→C is true if and only if C is true (by Stalnaker's truth conditions). So when A is true, A→C is equivalent to C. Therefore, we are effectively scoring the credence for the conditional as if it were the credence for C, but only when A is true. But that is not what we want because the model might assign a different number to A→C than to C. Also, when A is false, we cannot score. So this is problematic.

  3. **Fallback 3: Imaging (Lewis)**  
     Lewis proposed imaging as an alternative to conditioning for evaluating conditionals. Instead of P(C|A), we use the probability of C after imaging on A. Imaging shifts the probability from each world to the closest A-world.  
     **Scoring Rule:** We would score the imaging probability against the outcome. But note: we can only observe the actual world. In imaging, we are shifting probabilities to non-actual worlds. So we cannot observe the outcome in the imaged world. Therefore, we cannot score the model's imaging probability against any observable. This makes imaging unsuitable for scoring against outcomes in the actual world.

     Alternatively, we might score only when the antecedent is true? Then if A is true, the imaging on A leaves the probability on the actual world (if we are in an A-world, the closest A-world is itself). Then the imaging probability of C is just the probability that the actual world is a C-world? But that is just 1 if C is true and 0 if false? That doesn't work. Actually, imaging on A when we are in an A-world doesn't change anything. So then P_imaged(C) would be the same as P(C) in the original distribution? That doesn't seem right.  
     In fact, imaging is a way to update the entire probability distribution, but we cannot observe the outcome in the imaged world because we are in the actual world. So scoring against actual outcomes is not defined.

     Therefore, imaging is not suitable for our harness.

  4. **Fallback 4: Material Conditional**  
     We surrender Non-TF and use the material conditional. Then the target is P(¬A∨C).  
     **Scoring Rule:** We can score the credence for ¬A∨C against its truth value.  
     **What it buys:**
     - CP: fails (P(¬A∨C) = 1-P(A)+P(A∩C) ≠ P(C|A) in general).
     - Non-TF: fails.
     - Failures: the material conditional validates contraposition, transitivity, and SA? Actually, contraposition holds, transitivity holds, SA holds? But we wanted them to fail. So it fails the Failures requirement.
     - Assertibility: the material conditional is assertible when P(¬A∨C) is high, which can happen because P(¬A) is high even when P(C|A) is low. This is not acceptable.
     - Embedding: satisfied (it's a proposition).
     - Ramsey: fails.

     This is generally considered inadequate.

  **Conclusion on Fallbacks:**  
  The most coherent fallback is the suppositional theory (Fallback 1). We do not require embeddings (so we avoid triviality) and we use conditional probability as the target. We score only when the antecedent is true, using a proper scoring rule for the consequent.

  **Which requirement does the most work in eliminating candidate accounts?**  
  The requirement that conditionals be embeddable (Embedding) is the one that, when combined with CP, leads to triviality. Therefore, to avoid triviality, we must either give up CP or give up Embedding. Since we want CP for the scoring (it's the natural target), we must give up Embedding. This eliminates any account that treats conditionals as propositions (like Stalnaker, Lewis, and truth-functional) if we insist on CP. But if we give up CP, then we lose the natural connection to the Ramsey test and conditional probability.

  **Assessments of Four Accounts**

  1. **Suppositional (Adams, Edgington):**  
     - CP: Yes (by definition).
     - Non-TF: Yes (not truth-functional).
     - Failures: Invalidates contraposition, transitivity, SA; validates MP.
     - IE: Not applicable (no embeddings) but if forced, it fails.
     - Assertibility: Yes (explained by conditional probability).
     - Embedding: No (cannot embed).
     - Ramsey: Yes (via CP).

     **For our harness:** This is the leading candidate. We score the number as conditional probability and use a conditional scoring rule (only when antecedent true). We avoid embeddings.

  2. **Stalnaker's Selection Semantics:**  
     - CP: No (except in trivial cases).
     - Non-TF: Yes.
     - Failures: Invalidates contraposition, transitivity, SA; validates MP.
     - IE: No (Stalnaker rejects it).
     - Assertibility: Uses conditional probability for assertibility, but truth conditions are different.
     - Embedding: Yes.
     - Ramsey: Only in a limited sense.

     **For our harness:** Problematic because we cannot observe the truth value when the antecedent is false. We could score only when the antecedent is true, but then when A is true, A→C is equivalent to C. So we would be scoring the credence for A→C (which the model might have set to P(C|A)) against the truth value of C. But then if the model outputs P(C|A) and we score it as if it were P(C), that is not aligned. Example: if P(C|A) is 0.9 and P(C) is 0.5, and A is true, then we score the model's 0.9 against the truth of C. This is a proper scoring rule for C, but the model was trying to report P(C|A) not P(C). However, if the model is good, then when A is true, P(C|A) should be the probability for C. But note: the model's credence for A→C is not necessarily P(C|A) in Stalnaker's account. So it's messy.

  3. **Lewis's Imaging:**  
     - CP: No.
     - Non-TF: Yes.
     - Failures: Lewis's account is similar to Stalnaker's? He also has a possible worlds semantics. So the logic is similar.
     - Assertibility: Not clear.
     - Embedding: Yes.
     - Ramsey: Not by CP, but by imaging.

     **For our harness:** We cannot score imaging probabilities against actual outcomes because imaging involves non-actual worlds.

  4. **Truth-Functional (Material Conditional):**  
     - CP: No.
     - Non-TF: No.
     - Failures: Validates contraposition, transitivity, SA? Yes, which is bad.
     - Assertibility: Fails.
     - Embedding: Yes.
     - Ramsey: Fails.

     **For our harness:** Inadequate because it does not match the intuitive understanding of conditionals.

  **Final Recommendation:**  
  Use the suppositional theory. The target is the conditional probability. The scoring rule is a proper scoring rule for the consequent applied only when the antecedent is true. This satisfies all the non-negotiable desiderata except embedding, which we avoid by not using nested conditionals in the harness.

  **Non-negotiable for scoring:**  
  We must have a target that is well-defined and can be scored against outcomes. Conditional probability is well-defined and can be scored conditionally. The other accounts either lead to triviality or cannot be scored because they depend on unobservable (non-actual) worlds.
answer: |-
  ### Desiderata for the Normative Target of Indicative Conditionals
  Below are the desiderata an account of indicative conditionals must satisfy to serve as a normative target for scoring numerical credences. Each includes: (i) precise requirement, (ii) motivating case/theorem, and (iii) non-negotiable status for scoring. Items bearing on scoring are marked with **★**.

  1. **Conditional Probability (CP) Identity**  
     (i) For any rational credence function \(P\), \(P(\text{if } A, C) = P(C|A)\) when \(P(A) > 0\).  
     (ii) **Motivation**: Empirical studies (e.g., Adams' experiments) show people's credences in conditionals align with \(P(C|A)\). The Ramsey test (evaluating \(C\) under \(A\)-supposition) normatively justifies this.  
     (iii) **Non-negotiable?** **★ Yes** for scoring. Without a clear target (like \(P(C|A)\)), the harness lacks a basis for evaluation. Alternatives (e.g., truth conditions) are unobservable or conflict with data.  

  2. **Non-Truth-Functionality**  
     (i) The conditional must not be truth-functional; specifically, \(A \to C\) must not equal the material conditional \(\neg A \lor C\).  
     (ii) **Motivation**: Linguistic data (e.g., "If the match is wet, it will light" is false when the match is dry but \(\neg A \lor C\) is true). The material conditional yields counterintuitive high probabilities when \(A\) is improbable.  
     (iii) **Non-negotiable?** **★ Yes** for scoring. Truth-functional targets (e.g., \(P(\neg A \lor C)\)) misalign with intuitive credences and produce poor scores for low-\(P(A)\) cases.  

  3. **Failure of Certain Inferences**  
     (i) Logic must invalidate:  
       - Contraposition (\(A \to C \not\models \neg C \to \neg A\))  
       - Transitivity (\(A \to C, C \to B \not\models A \to B\))  
       - Strengthening the Antecedent (\(A \to C \not\models (A \land B) \to C\))  
       But must validate Modus Ponens (\(A \to C, A \models C\)).  
     (ii) **Motivation**: Linguistic counterexamples (e.g., "If it rains, the party is canceled" \(\not\models\) "If the party is not canceled, it didn't rain"; "If I strike this match, it lights" \(\not\models\) "If I strike this wet match, it lights").  
     (iii) **Non-negotiable?** Indirectly relevant. Not **★** for scoring simple conditionals, but essential for semantic coherence. Surrendering this invites collapse to material conditional.  

  4. **Rejection of Import-Export (IE)**  
     (i) \(A \to (B \to C)\) must not be equivalent to \((A \land B) \to C\).  
     (ii) **Motivation**: IE + CP implies triviality (Lewis' theorem). Linguistic data: Nested conditionals ("If Sue left, then if she was upset, she resigned") are not reducible to conjunctions.  
     (iii) **Non-negotiable?** **★ No** for scoring simple conditionals; partisan for embeddings. But retaining IE conflicts with CP under triviality, so must be rejected if CP is kept.  

  5. **Assertibility Under Partial Evidence**  
     (i) \(A \to C\) must be assertible when \(P(C|A)\) is high, even if \(P(A) < 1\) or \(P(C) < 1\), unlike \(A \land C\).  
     (ii) **Motivation**: Linguistic practice (e.g., "If it rains, the match is canceled" is asserted based on \(P(\text{canceled}|\text{rain})\), not certainty).  
     (iii) **Non-negotiable?** **★ Yes** for scoring. Ensures conditionals are evaluable even when \(A\) is unobserved.  

  6. **Coherent Embeddings**  
     (i) The account must assign consistent probabilities to compounds (e.g., \((A \to C) \land B\), \(A \to (B \to C)\)).  
     (ii) **Motivation**: Language permits embedded conditionals ("If the patient is switched, then if side effects occur, the tumor shrinks").  
     (iii) **Non-negotiable?** **★ No** for scoring. The harness can avoid embedded conditionals. However, triviality results show embeddings conflict with CP.  

  7. **Ramsey Test Compliance**  
     (i) Accepting \(A \to C\) must align with revising beliefs by \(A\) and accepting \(C\).  
     (ii) **Motivation**: Normative core of conditionals (Ramsey test). Conflicts with AGM belief revision postulates (Gärdenfors' paradox), but this is for full belief, not credences.  
     (iii) **Non-negotiable?** **★ Partly**. For credences, it reduces to CP, so is covered by Desideratum 1.  

  ### Conflicts Between Desiderata: Triviality Results  
  - **Lewis' Triviality (1976)**:  
    - **Conflict**: CP + Embeddings + Closure under conditioning.  
    - **Statement**: If conditionals are propositions (for embeddings) and \(P(A \to C) = P(C|A)\) for all \(P\) in a family closed under conditioning (i.e., \(P(\cdot|E)\) is in the family if \(P(E) > 0\)), then \(P(C|A) = P(C)\) for all \(P\), reducing conditionals to triviality.  
    - **Assumptions**: Closure under conditioning is strong but normatively natural (updating by conditioning).  
    - **Status**: Genuine theorem about conditionals, not an artifact. Forces a choice: abandon CP, embeddings, or closure.  

  - **Gärdenfors' Triviality (1986)**:  
    - **Conflict**: Ramsey test (for full belief) + AGM revision postulates.  
    - **Relevance to scoring**: Indirect; affects belief revision but not numerical credences directly.  

  **Key takeaway**: CP + Embeddings is impossible without triviality. CP + Closure under conditioning is also problematic, but closure is negotiable for scoring.  

  ### Required Surrender and Weaker Targets  
  - **Must surrender**: **Embeddings** (Desideratum 6). Keeping CP is essential for scoring; embeddings conflict via triviality.  
  - **Weaker target**: **Conditional scoring rule**.  
    - **Proposal**: Score credences only when \(A\) obtains. Use a proper scoring rule (e.g., Brier or log score) for \(C\) given \(A\).  
      - E.g., If the model reports \(q = P(\text{if } A, C)\), and \(A\) is true, score \(q\) against \(C\)'s outcome (1 if true, 0 if false). If \(A\) false, skip or ignore.  
    - **Accounting**:  
      - Buys CP (directly targets \(P(C|A)\)).  
      - Buys Non-Truth-Functionality (avoids material conditional).  
      - Buys Assertibility (works under partial evidence).  
      - Buys Ramsey compliance.  
      - Loses Embeddings (no compound conditionals).  
      - Loses strict logic (e.g., MP not enforced, but logic is secondary).  
  - **Alternative fallbacks**:  
    - **Imaging (Lewis-style)**: Updates \(P\) by shifting probability to closest \(A\)-worlds. Fails because "closeness" is unobservable, so cannot be scored against outcomes.  
    - **Material conditional**: Target \(P(\neg A \lor C)\). Rejected: violates Non-Truth-Functionality and Assertibility, yields poor scores.  

  ### Most Eliminative Requirement  
  **Conditional Probability (CP) Identity** eliminates all accounts that treat conditionals as propositions with standard embeddings (Stalnaker, Lewis) or truth-functional approaches. CP is non-negotiable for scoring but conflicts with embeddings via triviality, forcing a retreat to non-propositional accounts.  

  ### Candidate Accounts vs. Desiderata  
  | Desideratum                          | Suppositional (Adams, Edgington) | Stalnaker Selection | Lewis Imaging | Truth-Functional |  
  |---------------------------------------|----------------------------------|---------------------|---------------|-------------------|  
  | **1. CP Identity**                    | ✅ (core)                        | ❌ (fails generally)| ❌             | ❌                |  
  | **2. Non-Truth-Functional**           | ✅                               | ✅                  | ✅            | ❌                |  
  | **3. Inference Failures**             | ✅ (Adams' logic)                | ✅ (Stalnaker logic)| ✅            | ❌ (all hold)     |  
  | **4. Reject IE**                      | ✅ (no embeddings)               | ✅                  | ✅            | ❌ (IE holds)     |  
  | **5. Assertibility**                  | ✅                               | ⚠️ (uses CP for assertibility)| ⚠️          | ❌                |  
  | **6. Embeddings**                     | ❌ (not propositions)            | ✅                  | ✅            | ✅                |  
  | **7. Ramsey Test**                    | ✅ (via CP)                      | ⚠️ (partial)       | ⚠️ (via imaging)| ❌                |  
  | **★ Scoring viability**               | ✅ (best fit)                    | ❌ (truth unobservable)| ❌ (unscorable) | ❌ (poor target)  |  

  - **Suppositional (Adams)**: Best for scoring. Sacrifices embeddings but satisfies CP, non-truth-functionality, and assertibility. Scoring uses conditional rule (on \(A\)-true cases).  
  - **Stalnaker**: Treats conditionals as propositions with truth values (via selection functions). Fails CP (triviality), and truth values are unobservable when \(A\) is false, making scoring impossible.  
  - **Lewis Imaging**: Similar to Stalnaker but uses imaging for credences. Imaging probabilities are unscorable against outcomes (depend on non-actual worlds).  
  - **Truth-Functional**: Adopts material conditional. Fails CP, non-truth-functionality, and assertibility. Produces misaligned scores (e.g., high \(P(\neg A)\) inflates credence incorrectly).  

  **Recommendation**: Use the suppositional account with conditional scoring (on \(A\)-true cases). This maximizes desiderata relevant to scoring and avoids triviality by sacrificing embeddings.
