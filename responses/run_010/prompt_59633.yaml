     - *Fatal flaw*: Fails empirical adequacy—ignores patients’ sensory reports.  

  **Blind Spot Verdict**  
  **Profile C is the critical blind spot.** No account cleanly predicts delayed badness via prospection/attention *without* present suffering. Imperativism handles it best (commands gain weight over time), but this strains its core mechanics. Profile C exposes a gap in *temporal dynamics* of pain affect—suggesting badness isn't a static property but emerges from cognitive engagement. Your taxonomy isn't neurologically impossible; it reveals a genuine theoretical deficit in modeling pain's affective architecture.  

