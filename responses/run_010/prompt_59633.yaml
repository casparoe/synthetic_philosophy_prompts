  C Tier: Deflationism (0.2)  

  **Ranking & Damage Reports**  
  1. **Imperativism (S, 0.9)**  
     - *Survives all*: Profiles A/B/C fit "command content" decoupled from affect/endorsement.  
     - *Weakness*: Profile A’s "felt bother" without action strains "urgency" of imperatives.  

  2. **Evaluativism (A, 0.7)**  
     - *Profiles handled*: C (badness via prospection/attention fits "evaluation").  
     - *Fatal flaw*: Profile B (sincere non-evaluation + avoidance) breaks the representational link.  

  3. **Two-Component (A, 0.65)**  
     - *Profiles handled*: B/C (affective deficit explains absence of felt badness/avoidance).  
     - *Fatal flaw*: Profile A’s intact "felt unpleasantness" contradicts affective-component lesion.  

  4. **Intrinsic Hedonism (B, 0.4)**  
