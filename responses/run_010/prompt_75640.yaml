prompt: |-
  I chair a standing names-and-commemorations panel at a mid-sized public university: six volunteers (two faculty, two students, an alumnus, a retired secondary-school history teacher, and me, an administrator in the provost's office — no philosophers), eight to ten cases a year, one four-hour meeting and a two-page published statement of reasons per case, and a recommendation that goes to the president, who signs it and almost always follows it. Roughly half the cases have the same shape: someone proposes that a building, a professorship, or a lecture series be stripped of the name of a long-dead benefactor because of what he did, and a defender answers that we may not judge him by our standards — he was a man of his time. We have no way to assess that answer. Last year we accepted it wholesale in one case and dismissed it out of hand in another, and two members resigned in protest. What I want is a decision procedure my panel could actually run from the page: the questions in order, what counts as a sufficient answer to each, the point at which the standards-of-his-time reply may not even be raised, the points where the question is factual and must be referred to our consulting historian (with a specification of which facts to demand from him), and the points where the question is one of values and must be handed back to the panel to vote. It has to be written for a lay reader with no philosophical vocabulary, and it has to be honest about which steps are judgment calls wearing the costume of procedure.

  A philosopher friend sketched some distinctions she thinks the procedure must preserve, and I would like you to tell me which of them survive that kind of simplification and which should be dropped: that whether an act was wrong and whether its agent was blameworthy come apart; that "everyone believed it" and "everyone did it" are different claims and that only one of them can possibly exculpate; that the standards-of-his-time reply may concern what the person could have known or what he could have been expected to do given what he did know, and that these two fail in different cases; that ignorance a person cultivated, or had a material interest in preserving, is not a defence but an aggravation; that explaining conduct is not excusing it; and — the one she says we have been getting wrong for years — that our question is not whether the man deserves blame but whether we should go on honouring him, honour being something the living confer for reasons of their own. Tell me which of these does real work at a table of six non-specialists and which collapses into another once you have to write two pages of reasons. I also want the procedure to force us to name a comparison class before it asks whether anyone met the standards of it, since one and the same life looks different measured against his own profession, against the dissenters in his own city, or against the authors he quoted approvingly; tell us how to choose a class without simply picking the one that yields the answer we already want.

  Then run it on three cases. The first is ours, and the file is full: a teaching-hospital wing named for Amos Hollis (1831–1904), a merchant who, in a country that had abolished slavery decades earlier, built a fortune brokering cotton and sugar produced by enslaved and coerced labour abroad; the ledgers and correspondence we hold show him negotiating directly with suppliers who described their labour force in plain terms, and one letter of his calls a supplier's practice a traffic in human flesh that he will not defend, only price; in 1874 a boycott campaign run by Quakers in his own city named his firm publicly and cost him at least one contract, and a competitor switched suppliers and said so in the papers; he also endowed the wing in question, paid above-market wages at home, and built a school for his workers' children, and his descendants have offered a further gift conditioned on the name's retention. I expect this result to be one I will not like — Hollis endowed the department I work in — so give it to me straight. The second is a residence hall named for Jefferson, where our file assumes what his published and private writings make plain, that he described slavery as an evil and predicted retribution for it, that he freed very few of the people he enslaved, and that manumission in his jurisdiction carried legal conditions and financial costs; treat the Hemings finding as available to us but contested. The third is a lecture series named for Churchill, where the relevant material is the Bengal famine of 1943 and his long-standing views on India and empire, which were contested in his own time in Parliament, in the press, and inside his own party. For each, give the verdict the procedure actually produces, the questions our file cannot answer, and the step at which the reasoning passes from facts to values. Two last things. Tell us what the procedure should do when it cannot be run at all: our Columbus case (a plaza and a mural) turns on contemporaneous protest that our historian says the record genuinely disputes, and I need a stated default rather than a shrug. And decide whether repentance is a step in the procedure, a consideration bearing on honour rather than blame, or a confusion — one member argues that a man who later repudiated his own conduct, and he has in mind the Dominican friar who spent decades denouncing the treatment of the indigenous peoples of the Spanish Caribbean and who retracted his earlier acceptance of African slavery, is a different case from a man who never flinched. Close with the limitations: I suspect the procedure can tell us whether the standards-of-his-time reply has been earned, but not whether to keep a name, and I would rather state that to the panel now than have them discover it in year three.
reasoning: |-
  Hmm, the user chairs a names-and-commemorations panel at a university and needs a practical decision procedure for evaluating whether to remove names from buildings or programs due to historical figures' problematic actions. They want a step-by-step process that non-philosophers can use, with clear questions, thresholds for evidence, and separation of factual vs value judgments. 

  The user specifically wants me to evaluate which philosophical distinctions from their philosopher friend are actually useful in practice versus which collapse under simplification. They also want the procedure tested on three cases: Amos Hollis (cotton/sugar broker), Jefferson (slave owner), and Churchill (Bengal famine). Plus they need rules for inconclusive cases like Columbus, and guidance on whether repentance matters.

  First, I need to distill those philosophical distinctions. The key ones that survive simplification:
  - Separating "was the act wrong?" from "was the agent blameworthy?" - this is crucial because we might condemn slavery while debating if Hollis could have acted differently.
  - Distinguishing between "everyone believed it" (which rarely excuses) vs "everyone did it" (which might affect blame) - this helps counter lazy "man of his time" arguments.
  - Differentiating between what someone could have known vs what they could have been expected to do - Hollis clearly knew but chose profit; Jefferson knew but faced systemic barriers.
  - Not allowing cultivated ignorance as defense - this directly applies to colonial profiteers.

  The distinctions that collapse in practice:
  - Explaining vs excusing conduct - lay panels will hear this as semantic.
  - Honor vs blame separation - the panel's actual question is about present-day commemoration, not historical judgment.

  For the procedure, I'll build it around five key questions that force specificity:
  1) What exactly did they do? (Demand concrete acts)
  2) Was this wrong by today's standards? (Values call - panel votes)
  3) Could they have known it was wrong then? (Factual - historian evidence)
  4) Could they have acted differently? (Factual + values - examine constraints)
  5) Should we honor them now? (Core values vote)

  The comparison class problem is critical. The procedure must force naming a specific reference group before asking "was this normal?" - e.g., for Hollis, compare him to other merchants in his city, not all 19th-century people. The historian should provide evidence about that group's norms and dissenters.

  Testing on cases:
  - Hollis fails completely: knew about slavery, called it "traffic in human flesh," had alternatives (boycott proved it), yet chose profit. No "man of his time" defense.
  - Jefferson is harder: knew it was wrong (wrote about it), but manumission was legally/financially difficult. Still, comparison to contemporaries like Washington who freed slaves weakens his defense. Honor question is separate.
  - Churchill: knew about famine (evidence in Parliament debates), prioritized war over relief. Comparison to contemporaries like Amery who protested shows alternatives existed.

  For inconclusive cases like Columbus, the default should be retention - but with added context like plaques explaining disputes. Repentance matters only if it changed their actions significantly and publicly, like the Dominican friar example.

  The big limitation: this only evaluates whether the "man of his time" defense works. The final honor decision is separate and political - the panel must own that. I'll make this explicit in the procedure preamble.

  The user seems stressed about the Hollis case (it's their department's benefactor) but wants honesty - I'll be direct that he doesn't clear the bar. They're clearly a thoughtful administrator trying to balance ethics, politics, and practicality. The resignation of members shows how fraught this is - the procedure needs to build consensus through transparency.
answer: |-
  Here is a decision procedure designed for practical use, preserving key philosophical distinctions while acknowledging where judgment is unavoidable. It proceeds in six steps, with Steps 1–4 being **factual** (answered by evidence/historian) and Steps 5–6 being **value judgments** (voted on by the panel). Crucially, the "standards-of-his-time" defense can only be raised at **Step 4** if specific factual thresholds are met.

  ---

  ### **Decision Procedure: Evaluating Commemoration**  
  *(All answers require documented evidence. The panel historian resolves factual disputes.)*  

  1. **WHAT WAS DONE?**  
     - *Question:* Specify the act(s) triggering reconsideration. Demand dates, locations, and direct sources.  
     - *Sufficient Answer:* Concrete description (e.g., "Profited from slave labor," "Advocated colonial policies causing famine").  
     - *Historian’s Role:* Verify acts using primary sources. If acts are disputed/unknowable (e.g., Columbus), **stop here—retain the name with added context** (plaques, exhibits). *Default: When facts are irresolvable, retention + context.*  

  2. **WOULD THESE ACTS VIOLATE OUR UNIVERSITY’S CORE VALUES TODAY?**  
     - *Question:* Does the act contradict our stated principles (e.g., human dignity, equality)?  
     - *Sufficient Answer:* "Yes" or "No" via panel vote (no debate on historical context yet).  
     - *If "No": Retain the name. If "Yes": Proceed.*  

  3. **DID THE PERSON KNOW OR REASONABLY BELIEVE THESE ACTS WERE WRONG IN THEIR LIFETIME?**  
     - *Question:* Is there evidence they recognized the harm?  
     - *Sufficient Answer:*  
       - *Yes:* Diaries, speeches, or contemporary critiques they engaged with.  
       - *No:* No record of moral questioning.  
       - *Cultivated Ignorance:* Evidence they avoided knowledge (e.g., suppressing dissent). **This counts as "Yes."**  
     - *Historian’s Role:* Provide sources showing awareness (or lack thereof) of criticism.  

  4. **WERE ALTERNATIVE ACTIONS POSSIBLE AND KNOWN?**  
     - *Question:* Could they have acted differently without unreasonable cost?  
     - *Sufficient Answer:*  
       - Specify a **comparison class** (e.g., "their profession," "their city," "their political faction"). *Historian must provide 3 options; panel selects the narrowest plausible group.*  
       - Evidence of alternatives within that class (e.g., peers who refused similar acts).  
       - Evidence of costs (e.g., financial risk, social ostracism).  
     - *If no alternatives existed OR costs were prohibitive:* "Standards-of-his-time" defense **may apply**.  
     - *If alternatives existed at reasonable cost:* Defense **fails**.  

  5. **WAS THE PERSON BLAWORTHY?**  
     - *Value Judgment (Panel Vote):* Weigh Steps 1–4. Consider:  
       - Ignorance not culpable (Step 3).  
       - Constraints on action (Step 4).  
       - **Repentance:** Only if it led to material change (e.g., freeing slaves, policy reversal). *Mere regret is irrelevant; transformative action reduces blame.*  

  6. **SHOULD WE CONTINUE TO HONOR THEM?**  
     - *Value Judgment (Panel Vote):* Honor is a *present-day choice*. Considerations:  
       - Severity of acts (Step 1).  
       - Blameworthiness (Step 5).  
       - **Countervailing contributions** (e.g., philanthropy, intellectual legacy).  
       - **Impact of retention/removal** (e.g., harm to community, loss of gifts).  

  ---

  ### **Which Philosophical Distinctions Survive?**  
  | **Distinction** | **Useful?** | **Where Used** |  
  |-----------------|-------------|----------------|  
  | Wrongness vs. Blameworthiness | **Yes** | Separates Step 2 (wrongness) from Step 5 (blame). |  
  | "Everyone believed it" vs. "Everyone did it" | **Partial** | "Believed" irrelevant; "did it" informs comparison class (Step 4). |  
  | Could have known vs. Could have acted | **Yes** | Step 3 (knowledge) vs. Step 4 (action). |  
  | Cultivated ignorance | **Yes** | Step 3 (aggravates blame). |  
  | Explain vs. Excuse | **Collapses** | Facts explain; panel decides if they excuse (Step 5). |  
  | Blame vs. Honor | **Critical** | Step 6 is distinct and paramount. |  

  ---

  ### **Case Analyses**  
  #### **1. Amos Hollis (Hospital Wing)**  
  - **Step 1:** Profited from enslaved/coerced labor; knew suppliers’ practices. *Facts clear.*  
  - **Step 2:** Violates core values? **Yes** (panel vote).  
  - **Step 3:** **Knew it was wrong.** Called it "traffic in human flesh." *Cultivated ignorance fails.*  
  - **Step 4:** **Alternatives existed.** Quaker boycott, competitor’s switch. *Defense fails.*  
  - **Step 5:** **Blameworthy.** No barrier to ethical action.  
  - **Step 6:** **Remove name.** Harm of honoring outweighs philanthropic legacy. *Gift conditions irrelevant to blame but may inform Step 6—panel still votes removal.*  
  - **Fact→Value Shift:** Step 5 (blame) is judgment, but facts doom Hollis.  

  #### **2. Thomas Jefferson (Residence Hall)**  
  - **Step 1:** Enslaved people, freed few. *Facts clear.*  
  - **Step 2:** Violates core values? **Yes.**  
  - **Step 3:** **Knew it was wrong.** Wrote of slavery’s evil.  
  - **Step 4:** **Comparison class:** Virginia planters (narrower than "all Americans"). Alternatives? Some peers manumitted slaves (e.g., Washington). Costs? High (legal/financial). *Defense partially applies but weak.*  
  - **Step 5:** **Blameworthy.** Could have freed more despite costs.  
  - **Step 6:** **Judgment call.** Honor intellectual legacy? Yes. Severity of acts? Extreme. *Recommendation:* **Contextualize** (e.g., plaques on contradiction), but removal defensible.  
  - **Fact→Value Shift:** Step 4 (cost assessment) blends fact/value; Step 6 is fully value-driven.  

  #### **3. Winston Churchill (Lecture Series)**  
  - **Step 1:** Policies exacerbated Bengal famine; devalued Indian lives. *Facts clear.*  
  - **Step 2:** Violates core values? **Yes.**  
  - **Step 3:** **Knew criticism existed.** Parliamentary/media dissent.  
  - **Step 4:** **Comparison class:** UK wartime leadership. Alternatives? Famine relief was feasible (e.g., diverted grain). Costs? Prioritized war logistics. *Defense partially applies but narrow.*  
  - **Step 5:** **Blameworthy.** Chose empire over lives.  
  - **Step 6:** **Retain with context.** Wartime leadership complicates honor calculus; add explicit discussion of famine in series materials.  
  - **Fact→Value Shift:** Step 4 (feasibility of alternatives) is key factual dispute.  

  ---

  ### **Special Cases**  
  - **Columbus (Unresolvable Facts):** Default to **retention + context** (e.g., mural caption on contested legacy).  
  - **Repentance:** Only matters if it **changed behavior** (e.g., friar renouncing slavery). Include at **Step 5** (reduces blame) and **Step 6** (honors growth).  

  ---

  ### **Limitations**  
  This procedure **only evaluates the validity of "standards-of-his-time" defenses**. It does not dictate outcomes:  
  - Step 6 (**honor**) remains a value judgment.  
  - **Trade-offs** (e.g., donor relations, educational value) belong in Step 6.  
  - **Transparency is key:** Publish all answers to Steps 1–4 and the Step 6 rationale.  

  Adopt this to force disciplined analysis, but remind the panel: *"We decide whom to honor—not whom history condemns."*  

  ---  
  *Final Note: Hollis’s name likely falls. The procedure exposes his moral agency; your panel must then weigh honor.*
