answer: |-
  Below is a complete, ready-to-run seminar activity designed around your specifications. It uses an original institutional scenario (a post-disaster "Community Resilience Grant" allocation) to create tension between saving larger groups and acknowledging vivid individual losses. The activity avoids preset scoring currencies, instead using narrative consequences to sidestep comparability issues, and channels pre-med students' triage instincts into a structured "crisis coordinator" role. The design ensures students experience the indefensibility of their choices before encountering Taurek, with rounds that reverse group sizes and a lottery round exposing hidden aggregation.

  ### **Scenario: Community Resilience Grant Allocation**
  After a catastrophic flood, the city of Riverbend has limited funds for "Community Resilience Grants." Each grant fully restores one neighborhood’s infrastructure (all-or-nothing), preventing losses to residents. Neighborhoods vary in size, and residents suffer unique, incommensurable losses if their neighborhood isn’t chosen (e.g., losing a family heirloom, a small business, or access to medical equipment). The class acts as the grant allocation committee, hearing directly from each resident (no spokespersons). 

  **Why this scenario works:**  
  - **Institutional/unfamiliar**: Avoids trolleys/lifeboats by focusing on municipal resource allocation.  
  - **Individual voices**: Residents state personal losses, making aggregation feel unnatural.  
  - **Pre-med channel**: Two students act as "crisis coordinators" (details in rules), focusing their triage energy on facilitating the committee process without medicalizing the debate.  
  - **No scoring currency**: Losses are narrative/role-play-based (e.g., residents describe losses aloud). Consequence comes from public acknowledgment of "losses" and the emotional weight of hearing individuals, not points or tokens.  

  ---

  ### **Rules and Materials**  
  **Materials to Order/Prepare**:  
  - **Index cards**: 75 total (3 per student + extras). Pre-print 24 cards with group assignments for each round:  
    - Round 1: 5 × "Neighborhood A", 19 × "Neighborhood B"  
    - Round 2: 19 × "Neighborhood A", 5 × "Neighborhood B"  
    - Round 3: 8 × "Neighborhood A", 16 × "Neighborhood B"  
  - **Dice**: Two six-sided dice (for group lottery) and one hat/bowl (for person lottery).  
  - **Pens/markers**: 24+ for writing on cards.  
  - **Whiteboard**: For tracking decisions and lottery options.  
  - **Timer**: For enforcing strict time limits.  

  **Student Roles**:  
  - **Residents (all students)**: In each round, students are randomly assigned to a neighborhood (A or B) via pre-printed cards. They write and read aloud a personal loss if their neighborhood loses. Losses must be specific, non-monetary, and individually voiced (e.g., "I lose my wheelchair-accessible home and become housebound," not "Our neighborhood loses 5 homes").  
  - **Crisis coordinators (pre-med students)**: Facilitate rather than dominate. In rounds, they:  
    - **Round 1/2**: Keep time during readings and flag "urgent" losses (e.g., "This loss involves health—let’s note it").  
    - **Round 3**: Run the lottery (draw cards/flip dice) and calculate probabilities aloud.  
    This channels triage instincts into process management, not content arguments.  
  - **Committee (whole class)**: Discusses and votes/lotteries to allocate the grant.  

  **Activity Rules**:  
  1. **Grant allocation**: Committee must choose one neighborhood per round to "save" (grants are all-or-nothing).  
  2. **Loss readings**: Each resident reads their loss aloud in 10 seconds max (enforced by timer/crisis coordinator). Groups read sequentially (A then B).  
  3. **Voting/lottery**:  
     - **Rounds 1–2**: Open discussion followed by majority vote.  
     - **Round 3**: Committee chooses between two lotteries (group-equal or person-equal), then runs it.  
  4. **Consequence**: After each decision, the losing neighborhood’s residents stand silently while the facilitator acknowledges, "We recognize your losses."  

  **Key Mechanics for Your Design Commitments**:  
  - **Reversal of numbers (Rounds 1–2)**: Round 1 has small A (5) vs. large B (19); Round 2 reverses to large A (19) vs. small B (5). Principles like "save more lives" become inconsistent/indefensible.  
  - **Lottery round (Round 3)**: Group-equal lottery (50% chance per neighborhood) vs. person-equal lottery (each resident has equal chance; group chance proportional to size). Students see how person-equal smuggles in aggregation via weighting.  
  - **Individual voices**: All residents read losses aloud. Aggregation feels "strange" because losses are heterogeneous and unquantifiable (no scoring).  

  ---

  ### **Minute-by-Minute Timeline (75 Minutes Total)**  
  **Goal**: Create cognitive dissonance through lived experience. Taurek’s name/thesis is withheld until debrief.  

  - **0–5 min: Introduction**  
    - **Script**: "Riverbend is flooded. You’re the grant committee allocating one grant/round to save a neighborhood. Each resident will describe their unique loss if their neighborhood loses. We’ll do three rounds with different neighborhood sizes. Crisis coordinators [name pre-med students] will help manage time and process."  
    - **Rules**: Assign neighborhoods randomly via cards, write losses in 3 min, read in 10 sec each, committee discusses/votes. Emphasize: "Losses are personal—e.g., ‘I lose my grandmother’s letters,’ not ‘we lose property value.’"  
    - **What to avoid**: Do not mention ethics frameworks, aggregation, or Taurek.  

  - **5–20 min: Round 1 (Small A vs. Large B)**  
    - **5–8 min**: Distribute Round 1 group cards (5 A, 19 B) and blank index cards. Students write losses (3 min).  
    - **8–12 min**: Readings. Group A (5) reads first (50 sec), then Group B (19) (3 min 10 sec). Enforce 10 sec/student.  
    - **12–20 min**: Committee discussion/vote.  
      - **Expected dynamic**: Students default to "save B to help more people." Let them articulate this.  
      - **Crisis coordinator role**: Note "urgent" losses (e.g., health-related) without biasing debate.  
      - **End**: Vote, announce winner. Losing residents stand for acknowledgment.  

  - **20–30 min: Round 2 (Large A vs. Small B)**  
    - **20–23 min**: Redistribute Round 2 cards (19 A, 5 B). Students write new losses (3 min).  
    - **23–27 min**: Readings. Group A (19) reads first (3 min 10 sec), then Group B (5) (50 sec).  
    - **27–30 min**: Discussion/vote.  
      - **Reversal effect**: Students who saved the large group in Round 1 may now save large A—but the vivid small B losses cause discomfort. If they switch to save small B, inconsistency arises.  
      - **Key silence**: Do not resolve tension; let indefensibility build.  

  - **30–45 min: Round 3 (Lottery: Midsize A vs. Large B)**  
    - **30–33 min**: Distribute Round 3 cards (8 A, 16 B). Write losses (3 min).  
    - **33–37 min**: Readings. Group A (8) reads (1 min 20 sec), then Group B (16) (2 min 40 sec).  
    - **37–41 min**: Choose lottery type.  
      - **Options on whiteboard**:  
        - *Group-equal*: 50% chance per neighborhood (e.g., dice roll: even=A, odd=B).  
        - *Person-equal*: Each resident has equal chance; one name drawn from a hat, their neighborhood wins.  
      - **Discussion/vote (3 min)**: Students debate fairness. *Do not explain implications*—let them discover them.  
    - **41–42 min**: Run chosen lottery (crisis coordinators roll dice/draw names).  
    - **42–45 min**: Contrast lotteries. Ask: "If we’d used the other lottery, what would change? Why?"  
      - **Critical moment**: Students realize person-equal gives Group B (16) a 67% chance (weighted by size), while group-equal ignores size.  

  - **45–75 min: Debrief (30 min)**  
    **Goal**: Map activity experiences to Taurek’s argument. Start open-ended, then structure.  
    - **45–50 min: Open reflection**  
      - Ask: "What was hardest? Did any decision feel indefensible?"  
      - **Link to experience**: Students mention discomfort in Round 2 reversal or lottery weighting.  
    - **50–60 min: Reversal rounds (Rounds 1–2)**  
      - **Questions**:  
        - "Round 1: Why save the larger group? Did Round 2 challenge this?"  
        - "If you saved the large group both times, how do you justify losing 5 people twice? If you switched, why?"  
      - **Map to Taurek**:  
        - **What is denied**: Aggregation (adding losses across people). Activity showed losses are incommensurable—e.g., "I lost my business" + "I lost my home" ≠ "two losses."  
        - **Aggregating reply**: "Saving more is better" felt intuitive in Round 1 but became messy in Round 2 when small-group losses were equally vivid.  
    - **60–65 min: Lottery round (Round 3)**  
      - **Questions**: "Which lottery felt fairer? Why? Did person-equal feel like ‘saving more’ by stealth?"  
      - **Map to Taurek**:  
        - **Equal-chance intuition**: Group-equal gives each person 50% chance (Taurek’s view); person-equal weights by numbers (smuggles in aggregation).  
        - **Key insight**: Person-equal makes the larger group more likely to win—so "equal chance per person" ≠ "equal chance per group."  
    - **65–70 min: Introduce Taurek**  
      - **Script**: "This illustrates philosopher John Taurek’s argument: When saving lives, numbers shouldn’t count because losses aren’t additive. We should give groups equal chances (e.g., a coin flip). Today, you felt the tension he describes—aggregating unique losses felt strange, and reversal made principles indefensible."  
      - **Connect to activity**:  
        - Individual voices made aggregation feel forced (e.g., "Why was I trying to add? They’re all different").  
        - Lottery showed that "equal chance per person" (if defined naively) still favors larger groups.  
    - **70–75 min: Limit statement and close**  
      - **Honest limit**: "No game can replicate the *moral gravity* of real life-or-death choices. Role-play losses aren’t real, so the emotional weight is shallow. In real ethics, we must confront objections—e.g., ‘Why not minimize total harm?’ or ‘Doesn’t fairness require saving more?’—that need lecture-level depth. Next week, we’ll critique Taurek with these."  
      - **End**: "Today, you *felt* the problem. Next, we’ll debate it."  

  ---

  ### **What Will Go Wrong (and How to Handle It)**  
  **First-Time Failure Modes**:  
  1. **Time overruns in readings (Rounds 1–3)**:  
     - **Risk**: 24 students × 10 sec = 4 min, but delays add up.  
     - **In moment**: Use a visible timer. If a student exceeds 10 sec, say, "Thank you—next" immediately. Assign crisis coordinator to cut off gently.  
     - **Prevention**: Prep students: "Stick to 10 seconds—practice if needed."  

  2. **Lottery round confusion (Round 3)**:  
     - **Risk**: Students misread probabilities or rush the choice. Person-equal lottery’s weighting (67% for larger group) may be overlooked.  
     - **In moment**: Write probabilities on board: "Group-equal: 50% per group. Person-equal: Group A 33%, Group B 67%." If they miss the weighting, ask post-lottery: "What was Group B’s chance? Why?"  
     - **Failure mode**: Students choose person-equal but don’t see aggregation—use the contrast question ("What if we’d used group-equal?") to surface it.  

  3. **Pre-med hijacking**:  
     - **Risk**: Pre-med students derail discussion with triage analogies (e.g., "In hospitals, we prioritize by severity!").  
     - **In moment**: Redirect: "Crisis coordinators, how does this compare to your role? Let’s note health-related losses but stay focused on Riverbend." In debrief, validate: "How would triage handle this?" but tie it back to Taurek.  

  4. **Voting stalemates or apathy**:  
     - **Risk**: In reversal rounds, students avoid hard choices or disengage.  
     - **In moment**: Force a vote: "We must decide—all in favor of A?" If apathy, say: "Imagine real consequences. Residents, what do you lose?"  

  5. **Superficial debrief**:  
     - **Risk**: Students don’t connect experiences to ethics.  
     - **In moment**: Use direct quotes from the activity: "When [name] said ‘I lose my family photos,’ did that feel addable? Why did the lottery feel unfair?"  

  **Overall Mitigation**: Keep rounds fast-paced; use whiteboard to track decisions; enforce roles strictly.  

  ---

  ### **What You Can Say Before Starting**  
  Only this:  
  - "We’re simulating a post-flood grant committee. You’ll be residents of neighborhoods and decide who gets saved. Focus on your experiences—we’ll debrief after."  
  **Banned pre-activity**: Taurek’s name, "numbers count," or any ethics theory. Let the activity generate the dissonance.  

  ---

  ### **Why This Works**  
  - **Consequence without comparison**: Narrative losses (voiced aloud + acknowledgment) create weight without scores. Students "lose" something personal, making choices feel real.  
  - **Taurek revealed organically**: The activity mirrors his core argument—individual losses resist aggregation, and group-equal lotteries avoid weighting by numbers. By the debrief, students have already felt the "indefensibility" of aggregation.  
  - **Handoff-ready**: All materials and timings are explicit; a colleague could run this with the script above.  

  **Final note**: The limit—shallow role-play gravity—is unavoidable. Use the debrief to pivot to deeper critique next week. No reading suggestions, as requested.
