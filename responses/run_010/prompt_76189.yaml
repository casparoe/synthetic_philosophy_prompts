     - Focus on round 1 and 2: What principle did you use? Did you change between rounds? Why? (10 minutes)
     - Lottery round: Why did you choose the lottery you did? How does it relate to whether numbers should count? (5 minutes)
     - The moment of aggregation: When you thought about the large group, did you add the losses? What did that feel like? Why might it be problematic? (5 minutes)
     - Introduce Taurek: "This activity is designed to illustrate an argument by the philosopher John Taurek. He argued that when we have to choose between saving different groups of people, we should not necessarily save the larger group. Instead, we should give each group an equal chance, because the losses are not additive. Each person's loss is their own, and we cannot simply add them up. This is what we saw when we had to hear each person's loss individually." (5 minutes)
     - The limit: "However, an activity like this cannot capture the full moral force of the argument. For instance, it might feel like we are just playing roles, and the losses aren't real. Also, many philosophers have replied to Taurek, arguing that we can and should aggregate harms to save as many as possible. We will examine these replies in the next class." (No reading list, just a teaser for the next lecture.)

  What we are not allowed to say before the activity: We cannot mention Taurek or his thesis until the debrief.

  Failure modes:

  - In round 1, the readings take too long. Solution: Use a timer and enforce strictly. If a student goes over, say "Thank you, next."
  - In round 1, the committee discussion might be dominated by a few students. Solution: Encourage quiet students to speak. Use a talking stick? But we don't have time. We can say: "Let's hear from someone who hasn't spoken."
  - In round 2, students might not take it seriously because they see it's a reversal. We can say: "Remember, these are real people with real losses. We are making a life-or-death decision."
  - In the lottery round, the class might not understand the options. We can write them clearly on the board and give an example: "If we use Option 1, each group has 50% chance. If we use Option 2, Group A (8) has about 33% chance, Group B (16) has 67% chance."
  - The pre-med students might argue for medical triage. We can say: "That's an important perspective, but for now we are in a community grant setting. We'll discuss medical applications in the debrief."
  - Time might run over in the rounds. We must be strict with time and cut off discussions if needed.

  The limit of the activity: It cannot fully convey the moral weight of real life-and-death decisions. The losses are fictional and the students are role-playing, so they might not feel the same emotional impact. Also, the argument against aggregation is abstract and might not be fully grasped. The facilitator will have to lecture on why aggregation might be defended (e.g., each loss is a harm, and more harms are worse) and the replies to Taurek.

  Finally, materials list for ordering:

  - 100 index cards (or 3 per student, 72, plus extra)
  - Pens or markers for writing (if not provided by students)
  - A hat or bowl for the lottery draw
  - A coin (or a die for flipping: even/odd)
  - Whiteboard markers

  We'll assume the room has a whiteboard.

  Rules summary for the colleague:

  - Each round: Assign groups, write losses, read losses, discuss/vote (or lottery in round 3).
  - Rounds 1 and 2: Vote to save one group.
  - Round 3: Choose lottery type, then run it.
  - Enforce time limits strictly.
  - In the debrief, draw out the tension and then introduce Taurek.

