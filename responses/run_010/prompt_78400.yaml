prompt: |-
  I am in the second half of a seminar on social epistemology and judgment aggregation, and I have ended up writing my final paper on central banks. What I need help with is the conceptual reconstruction, not the economics: I want to know what theory of collective judgment these institutions are committed to by the way they are built. Please argue from the ideas rather than pointing me at references — I have the course readings and a reading list would not help me here.

  The practice, as I understand it. Three major central banks face the same problem — a committee of experts must produce one interest-rate decision out of many individual judgments — and they have solved it in visibly different ways. The Bank of England's Monetary Policy Committee publishes the vote member by member, names whoever dissented, and, unusually, also publishes each member's own projection for growth and inflation. The Federal Reserve's FOMC publishes the vote with the names of those for and against, but releases its economic projections as an anonymous scatter of dots that cannot be traced back to any individual. The ECB's Governing Council publishes neither: the decision emerges as a single unsigned announcement, individual votes and dissents are never disclosed, and the meeting accounts it now releases summarize the discussion without attributing any view to any person. On top of that, since the euro area grew past a certain size, voting rights on the Council rotate — the governors of the largest economies share a smaller bloc of votes among themselves, the remaining governors share a larger bloc, and the six Executive Board members vote every time. The result is that a given national governor casts a vote at some meetings and sits without one at others. Correct me if I have the rotation mechanics wrong; I am working from memory.

  The puzzle I cannot resolve is this. Everything else in the ECB's legal design insists that governors are not national delegates: they are to act for the euro area as a whole and to take instructions from nobody. Yet the rotation allocates votes by the relative size of member economies, which is weighting by stake — the logic of representation, not the logic of a body of individuals jointly tracking the truth about inflation. And unlike a court, whose single unsigned opinion at least expresses one collective judgment on one question by one fixed panel, the Council's electorate changes from meeting to meeting.

  So, specifically:

  1. Reconstruct the implicit theory. Does the ECB's arrangement presuppose that the Council forms beliefs of its own — a genuine group agent whose judgment is something over and above the members' — or is it equally consistent with the deflationary reading on which there is no collective judgment at all, only an output that has been strategically insulated from reconstruction? Which rival views does the design quietly rule out, and which does it merely happen to fit?

  2. Where does the doctrinal paradox bite? Committees of this kind decide the rate directly, which is outcome-based aggregation, but then publish a coherent collective analysis that looks exactly like a set of premises. Are those accounts a report of what the Council collectively judged about inflation and the output gap, or a consistent premise-set assembled after the fact — possibly one no member individually holds? If the latter, is the publication doing epistemic work or legitimation work, and does that distinction matter to the theory?

  3. Test a hunch of mine. Standard judgment-aggregation results assume a fixed electorate and a fixed agenda, and the premise-versus-outcome contrast is defined relative to a single profile of individual judgments. A rotating Council never presents a single profile, so strictly speaking the familiar results may not apply to it across time at all. Is that right? If the framework does have resources for a changing electorate, what does the extension cost, and does the epistemic case for deferring to a committee — the Condorcet-style argument that its decision is evidence about the state of the economy — survive the loss of anonymity plus the loss of a stable voter set?

  4. Finally, tell me what would have to change, both institutionally and philosophically, if the ECB adopted the MPC's transparency, and what the MPC gives up in exchange: does publishing named votes convert deliberation into bargaining over recorded positions, and does that undermine the claim that the committee is tracking anything?

  Please be disciplined about separating what the practice strictly presupposes from what it merely harmonizes with, and say plainly where the practice is underdetermined, so that several rival theories would license it equally.

  End your reply with a single line of the form "Verdict: <label>" where <label> is exactly one of GROUP AGENT, EPISTEMIC AGGREGATION, REPRESENTATIONAL BARGAIN, PURE PROCEDURE, or UNDERDETERMINED, naming the theory of collective judgment the ECB's design most nearly presupposes.
reasoning: |-
  We are reconstructing the implicit theory of collective judgment in central bank decision-making, with a focus on the ECB. We have four questions, but the core is to identify the underlying model of collective judgment that the ECB's institutional design commits to.

  First, let's summarize the practices:

  - Bank of England (MPC): Publishes individual votes, names dissenters, and each member's own projections. High individual transparency.
  - Federal Reserve (FOMC): Publishes votes with names (for/against) but economic projections as anonymous scatter. Moderate individual transparency (on vote but not projections).
  - European Central Bank (ECB): No publication of individual votes or dissents; single unsigned announcement; meeting accounts without attribution. Additionally, voting rights rotate among members (with a complex system: largest economies share a bloc, others share a larger bloc, and Executive Board always votes).

  The puzzle: The ECB insists that governors are not national delegates but act for the euro area as a whole. Yet, the rotation system allocates votes by the size of member economies (weighting by stake). This seems like a representational logic (stake-based) rather than an epistemic logic (truth-tracking by fixed group).

  Now, the questions:

  1. **Implicit theory: group agent or deflationary?**
     - The ECB's design: no disclosure of individual positions, rotating voters, and a single unsigned decision. This suggests that the institution wants to present a unified front and avoid the appearance of national interests. The rotation by economic size, however, introduces a stake-based element.
     - What does this imply for the theory of collective judgment?
       - Option: GROUP AGENT. The design might be trying to create a group agent that has its own beliefs and judgments, over and above the individuals. The suppression of individual views and the collective output (unsigned) could be seen as the group speaking as one. The rotation, however, complicates this because the group's composition changes. A group agent typically requires a stable identity. But the ECB might be trying to create a continuous group agent despite rotation by having a core (Executive Board) that always votes and by the collective output being presented as the same institution's view.
       - Option: DEFLATIONARY (or PURE PROCEDURE). The output is just the result of a procedure that aggregates individual inputs without any claim about a collective belief. The rotation and the lack of transparency might be designed to insulate the decision from reconstruction and to avoid creating a group agent. The unsigned decision is then just the output of a process, not a collective judgment.
       - What does the design rule out? It rules out the idea that the collective judgment is reducible to a fixed set of individual judgments (because the set of voters changes). It also rules out the transparency of individual reasoning (as in the MPC) that would allow for a premise-based aggregation to be reconstructed. The design is inconsistent with a view that the collective judgment is simply the sum of individual judgments (because it hides them) and with a view that the group is a fixed set of experts (because of rotation).
       - What does it fit? It fits a view that the collective output is the result of a procedure that is designed to be stable and legitimate, without committing to a group mind. The rotation by economic size might be a concession to political reality (representation of stakes) but without allowing the governors to act as delegates (by not publishing individual votes and by the requirement to act for the whole). So it might be a hybrid: the procedure is set up to balance representation and independence, but the output is presented as a collective decision of the institution.

     - Verdict for question 1: The design is most consistent with a PURE PROCEDURE view. The procedure (with rotation) is set up to produce a decision that is accepted as legitimate, without claiming that it reflects a group belief. The unsigned announcement and the lack of individual attribution suggest that the institution is not committed to the existence of a group agent that has beliefs over and above the members. However, the requirement that governors act for the whole and the collective output might also harmonize with a GROUP AGENT view, but the rotation undermines the stability of the group. Therefore, the design does not strictly presuppose a group agent because the rotating membership makes it hard to attribute persistent beliefs to the group.

  2. **Doctrinal paradox and the accounts:**
     - The doctrinal paradox arises when a committee votes on premises and then on a conclusion, and the majority on premises does not lead to the majority on the conclusion. In central banks, they typically vote directly on the outcome (the interest rate). However, they then publish a collective analysis (which looks like a set of premises) that is coherent.
     - Question: Is this collective analysis a report of what the Council collectively judged (premise-based) or a constructed narrative after the fact?
       - Given that the ECB does not attribute any views to individuals and does not reveal the vote, the collective analysis is likely constructed after the decision to be consistent with the outcome. It is not the result of aggregating individual judgments on premises. Therefore, it is not a report of the collective judgment on premises but a consistent story that justifies the outcome. This story might not be held by any individual member.
       - Why do they do this? It serves both epistemic and legitimation functions. Epistemically, it provides a coherent rationale that might help the public and markets understand the decision. But primarily, it serves legitimation: it makes the decision appear well-reasoned and not arbitrary. The distinction matters because if it were a true report of collective premises, it would be an epistemic achievement. But since it is constructed, it is more about legitimation. However, the process of constructing a coherent narrative might also have an epistemic benefit by forcing the committee to agree on a story that they can stand behind.

     - How does this relate to the ECB? The ECB's practice of publishing meeting accounts without attribution and a single analysis fits the constructed narrative model. This is consistent with the PURE PROCEDURE view: the procedure produces a decision, and then a story is built around it for legitimation. It does not require that the group formed collective beliefs on the premises.

  3. **Hunch about fixed electorate and agenda:**
     - Standard judgment aggregation (like the Condorcet Jury Theorem) assumes a fixed set of voters and a fixed agenda. The ECB's rotating council violates both: the set of voters changes (because of rotation) and the agenda (the economic situation) changes over time.
     - Therefore, the standard results (about the epistemic superiority of the majority, etc.) do not directly apply. The rotation means we cannot aggregate the same group's judgments over multiple decisions because the group changes.
     - Extending the framework to a changing electorate: We might consider the committee as an institution with a fixed set of potential members, but a random subset (or a rotating subset) votes at each meeting. However, the rotation is not random; it is by economic size, which is systematic. This might introduce biases (if the largest economies have different views) and breaks anonymity (because the same person does not vote every time, and we know who is voting when). The Condorcet argument relies on the voters being independent and having a common truth, but with changing composition, the competence of the group might vary. Moreover, without anonymity, strategic voting might occur (if a member knows they will not vote next time, they might vote differently).
     - Does the epistemic case survive? The Condorcet-style argument requires that the group's competence (probability of being correct) is above 0.5 and that the votes are independent. With a changing set of voters, we cannot assume a fixed competence. Moreover, the rotation by economic size might mean that the group's composition is biased toward the interests of larger economies, which might not align with the truth about inflation. Therefore, the epistemic case for deferring to the committee is weakened. Instead, the design might be justified on procedural grounds (legitimacy through representation) rather than epistemic grounds.

  4. **What if ECB adopted MPC's transparency?**
     - If the ECB published named votes and individual projections, it would:
       - Institutionally: Shift from a PURE PROCEDURE model to one that is more like EPISTEMIC AGGREGATION (where the collective decision is seen as the aggregation of individual expert judgments). The individual accountability might increase the quality of deliberation because members know their views are public.
       - Philosophically: It would commit the ECB to the view that the collective judgment is built from individual judgments and that the committee is a collection of experts rather than a unified group agent. It would also make the process more like the MPC, where the decision is seen as the outcome of a vote among experts.
     - What the MPC gives up: In the MPC, publishing individual votes might turn deliberation into bargaining over recorded positions. Members might be less willing to change their minds during deliberation because they have to justify their published views. This could undermine the claim that the committee is jointly tracking the truth, because it might encourage strategic behavior (e.g., sticking to a position to appear consistent). It might also lead to grandstanding or representing national interests (if the members are seen as representatives). Thus, the MPC model might sacrifice some of the benefits of deliberation (changing minds) for the benefits of transparency and individual accountability.

  **Overall verdict for the ECB:**
  The ECB's design with rotation, non-disclosure of individual votes, and a single unsigned decision is most consistent with a **PURE PROCEDURE** view of collective judgment. The procedure is set up to produce a legitimate decision without committing to the existence of a group agent or to the aggregation of individual judgments. The rotation by economic size introduces a representational element, but the non-disclosure of individual positions and the requirement to act for the whole suggest that the procedure is designed to create an output that is accepted as the decision of the institution, not as the sum of its parts. The group does not form a collective belief that exists independently of the procedure.

  Therefore, we end with:
  Verdict: PURE PROCEDURE
answer: |-
  ### Conceptual Reconstruction of the ECB's Collective Judgment Theory

  Your analysis correctly identifies the ECB's institutional puzzle: a tension between the formal independence of Governing Council members (who must act for the euro area) and the rotation system that weights votes by national economic size. I'll address your queries in sequence, strictly separating what the design *presupposes* from what it *harmonizes with*, and flagging underdetermination where it exists.

  #### 1. **Implicit Theory of Collective Judgment**  
  The ECB's design presupposes **no group agent** with emergent beliefs. Instead, it commits to a **pure procedural** theory of collective judgment, where the output is legitimized solely by the process, not by correspondence to individual judgments or a shared epistemic state. Key evidence:  
  - **Anonymity and rotation**: By hiding individual votes/dissents and rotating voters, the ECB actively prevents the aggregation or reconstruction of individual judgments into a collective "mind." This rules out theories requiring stable group agency (e.g., List and Pettit’s *Group Agent*).  
  - **Stake-based rotation**: Weighting votes by economic size imports a logic of **representational bargaining** (reflecting national stakes), but this is *instrumental*, not foundational. The design uses representation to secure buy-in from member states, while the suppression of individual attribution denies that governors are delegates. Thus, it harmonizes with representational bargaining but does not presuppose it.  
  - **Undermined alternatives**: The design rules out **epistemic aggregation** (e.g., Condorcet models) because fixed voter anonymity and a stable electorate are prerequisites for treating the committee as a truth-tracking body. It also rules out the **deflationary "no judgment" view** because the Council’s published accounts and unified announcement posit a coherent collective output, not just a strategic artifact.  

  **Underdetermination**: The practice is consistent with two readings:  
  - (Strong) Pure procedure: The judgment *is* the procedurally validated output.  
  - (Weak) Epistemic aggregation with constraints: Rotation and anonymity sacrifice truth-tracking for legitimacy, but members still aim at accuracy.  
  However, the design *presupposes* the strong view: the procedure itself (not aggregated beliefs) confers validity.

  #### 2. **Doctrinal Paradox and Published Accounts**  
  The paradox arises when premise-based voting (on inflation/growth) conflicts with outcome-based voting (on rates). The ECB sidesteps this by decoupling the decision from premise aggregation:  
  - **Outcome-based aggregation**: The Council votes directly on rates. The published "collective analysis" is **not a report of collectively held premises** but a *post hoc rationalization* constructed to be consistent with the outcome. No member need endorse the entire narrative, as evidenced by unattributed meeting accounts.  
  - **Function**: This is primarily **legitimation work**, not epistemic. The coherent story markets the decision to the public, enhancing credibility and stability. It does not reflect deliberation (which remains premise-driven but unaggregated). The distinction matters because it reveals the ECB’s priority: institutional authority over epistemic transparency.  

  **Underdetermination**: The accounts *could* be a low-fidelity report of shared premises, but the design’s suppression of individual views makes this unlikely. It strictly presupposes legitimation.

  #### 3. **Your Hunch: Rotating Electorate and Aggregation Theory**  
  Your hunch is correct. Standard judgment-aggregation results (e.g., Condorcet Jury Theorem) **do not apply** to the ECB across time, as they require:  
  - **Fixed electorate**: Condorcet assumes stable voter competence. Rotation violates this, as the group’s composition and "competence" shift with each meeting.  
  - **Fixed agenda**: Each meeting addresses a unique economic context, so decisions are not comparable.  
  - **Loss of anonymity**: Rotation breaks voter anonymity (we know who votes when), enabling strategic voting (e.g., governors deferring to future voters).  

  **Extending the framework**: To accommodate rotation, we must:  
  - (a) Treat the Council as a **sequence of ad hoc committees**, not a continuous body.  
  - (b) Accept that the epistemic case for deference **collapses**. The Condorcet argument fails because rotation severs the link between individual competence and collective accuracy. We cannot claim the decision "tracks truth" better than individual judgments.  
  - **Cost**: Justification shifts entirely to procedural legitimacy. The ECB’s design thus presupposes that legitimacy, not truth-tracking, grounds authority.  

  **Underdetermination**: The rotation *could* be modeled as random sampling, preserving anonymity. But weighting by economic size makes this implausible—it introduces systematic bias toward larger economies.

  #### 4. **If the ECB Adopted MPC-Style Transparency**  
  Adopting the MPC’s model would force a philosophical and institutional shift:  
  - **Institutional change**: Publishing named votes and projections would convert the Council into an **epistemic aggregation** body. Individual judgments become public inputs, making the output reconstructible (e.g., via premise-based or conclusion-based aggregation).  
  - **Philosophical shift**: The ECB would implicitly endorse a "summative" view: the collective judgment is the aggregate of expert opinions. This undermines pure procedure.  
  - **What the MPC sacrifices**:  
    - **Deliberation costs**: Public votes incentivize bargaining over recorded positions. Members may anchor to initial views to avoid appearing inconsistent, reducing open-minded deliberation.  
    - **Epistemic costs**: If members defend positions to signal expertise or national loyalty (despite formal independence), the committee’s claim to track objective economic truths weakens. The MPC accepts this trade-off for gains in accountability and credibility.  

  **Underdetermination**: Transparency *could* improve truth-tracking if members prioritize accuracy over reputation. But the ECB’s current design avoids this risk by suppressing individual exposure.

  ### Final Verdict  
  The ECB’s design most nearly presupposes **pure procedure**. The collective judgment is defined by the output of a rule-based process, not by aggregated beliefs or a group mind. Rotation and anonymity are not mere flaws but core features insulating the verdict from reconstruction and prioritizing institutional unity over epistemic transparency.  

  **Verdict: PURE PROCEDURE**
