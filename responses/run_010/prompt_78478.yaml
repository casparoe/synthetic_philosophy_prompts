prompt: |-
  I teach RE at a non-faith secondary school in the north of England and something has been nagging me. By law the pupils have to have a daily act of collective worship, most of which should be "of a broadly Christian character" — which in pratice gets read as 51% of school days in a term, with the rest up to us. Parents can withdraw there kids, sixth-formers can decide for themselves, and the local SACRE can lift the Christian requirement for a whole school. Meanwhile the RE I teach is meant to be even-handed about all the principal religions, and I can't be required to lead or attend the worship myself even though the pupils have to be there.

  What theory of the relation between a political community and religion does that package presuppose? Two bits especially. Why is establishment a proportion — 51% of days — rather than all-or-nothing; what has to be true about religious claims for a majority share of the calendar to be the right shape of settlement? And what does it mean that the adult's conscience gets protected (I needn't lead it) while the child's attendance is the default?

  Tell me which rival views this rules out, whether the even-handed RE half can really sit with the worship half, and where the whole thing is philosophically underdetermined — i.e. which very different theories would license the same arrangement. And if you swapped the presupposed view for a public-reason one, what would concretely have to change?

  British English please.
reasoning: |-
  Hmm, the user teaches RE at a non-faith secondary school in England and is grappling with the philosophical tensions in the legal requirements around collective worship versus their teaching of RE. They're asking about the underlying theory of religion-state relations implied by this arrangement, particularly focusing on two aspects: why collective worship is proportion-based (51% Christian) rather than all-or-nothing, and why adult consciences are protected while children's attendance is compulsory unless withdrawn.

  This is quite a sophisticated question about educational policy and political philosophy. The user clearly understands the practical realities but is digging deeper into the theoretical foundations. They want to know what vision of state-religion relations this "package" assumes, which competing views it excludes, whether the neutral RE teaching can coexist with the Christian-biased worship requirement, and what would change if we adopted a public reason approach instead.

  The 51% proportion is particularly interesting. It suggests a pragmatic accommodation where Christianity gets preferential treatment as the "default" national religion while acknowledging pluralism. This isn't about theological truth but about cultural heritage - maintaining Christian tradition as a unifying force while making space for others. It implies that religious claims aren't seen as absolute truths requiring full adherence, but as cultural practices that can be proportionally represented.

  The adult-child distinction reveals an interesting assumption: that children are not yet full moral agents when it comes to religion, so the state can legitimately expose them to collective worship as part of their socialization, while adults (teachers) have developed consciences that must be respected. This treats religious formation as something the community does for children until they're old enough to choose.

  The arrangement seems to rule out strict secularism (which would eliminate worship altogether), pure multiculturalism (which would give equal time to all faiths), and theocracy (which would make worship fully Christian). It sits uneasily with the neutral RE curriculum, creating cognitive dissonance between "this is our tradition" in assembly and "all are equal" in the classroom.

  If we swapped this for a public reason model (where only reasons acceptable to all citizens can shape policy), we'd likely see collective worship abolished entirely in state schools, replaced with inclusive assemblies about shared values. The Christian proportion requirement would disappear as privileging any faith would violate neutrality.

  The user might also be subtly questioning whether this outdated model still serves modern Britain's diverse society. The philosophical tensions they're highlighting - between establishment and pluralism, between adult and child autonomy - suggest the system might be ripe for reform.
answer: |-
  Right, let's unpack that knotty package. What you're describing – the legal requirement for predominantly Christian collective worship alongside a multi-faith, neutral RE curriculum, with asymmetrical consent rules – rests on a very specific, historically rooted, and arguably internally strained theory of the relationship between the British state, religion (specifically Christianity), and the individual. It's not a pure philosophical theory, but a pragmatic, historically accumulated settlement reflecting Britain's established church status within an increasingly plural society.

  **The Underlying Theory: "Cultural Establishment with Accommodation"**

  1.  **The Established Norm:** Christianity (specifically Anglicanism, though the law broadens it) is understood as the *default*, *normative* religious and cultural foundation of the nation. This isn't necessarily about *doctrinal truth* for the state, but about *cultural heritage*, shared history, values, and social cohesion. The state recognises this heritage as beneficial or foundational for the community it serves.
  2.  **Majoritarian Accommodation (The 51%):** The law doesn't demand exclusivity because it acknowledges religious diversity and a degree of societal secularisation. The 51% rule is pure political and administrative pragmatism. It signifies:
      *   **Symbolic Primacy:** Christianity retains its privileged position as the "official" cultural backdrop.
      *   **Practical Recognition of Pluralism:** It concedes space (49%) for other traditions or non-religious assemblies, reflecting that the nation isn't *only* Christian anymore.
      *   **What it Presupposes about Religious Claims:** It presupposes that the *state's role* isn't to adjudicate absolute theological truth (which would demand exclusivity), but to manage a public space where the *historical and cultural dominance* of one tradition is acknowledged while making room for others. The "truth" here is sociological and historical, not theological. The settlement assumes that maintaining this symbolic link is valuable for national identity and social glue, even if many citizens don't personally subscribe to its doctrines.
  3.  **Asymmetrical Consent (Adults vs. Children):**
      *   **Protecting the Adult Conscience (Teacher):** This stems from liberal principles of individual autonomy and freedom of belief/conscience. The state recognises that *forcing* an adult to lead worship against their conscience is a profound violation of their fundamental rights. It respects the teacher as a full moral agent.
      *   **Default Child Attendance:** This reflects a more paternalistic or communitarian view:
          *   **In Loco Parentis:** Schools are seen as acting *in place of parents* in the child's best interests. The assumption is that exposure to collective worship (especially of the broadly Christian character representing the national heritage) is *beneficial* for the child's moral and spiritual development, or at least part of their cultural education.
          *   **Formation vs. Choice:** Children are viewed as not yet possessing fully formed, autonomous beliefs. The state (via the school, reflecting societal norms) has a legitimate interest in their *formation* – exposing them to the dominant cultural and moral framework (Christianity) deemed foundational. Attendance is the default because this formation is seen as part of the state's educational remit.
          *   **Parental Primacy (via Withdrawal):** Crucially, the *ultimate* protection for the child's conscience is vested in the *parents* through the withdrawal right. The state defers to parental authority over the child's religious upbringing, intervening only by setting the default framework. Sixth-formers can self-withdraw, acknowledging their developing autonomy.

  **What Rival Views Does This Rule Out?**

  1.  **Strict Secularism (Laïcité model):** This demands complete separation of state and religion in public institutions. Collective worship, especially state-mandated worship with a Christian bias, would be utterly incompatible. *Your package rules this out.*
  2.  **Pure Multiculturalism/Religious Neutrality:** A model where the state treats all religions with absolute equality in the public sphere. Mandating a 51% Christian worship share inherently violates this principle by giving one faith privileged access to compulsory school time. *Your package rules this out.*
  3.  **Theocracy or Confessional State:** A state that actively promotes one religion as exclusively true and requires adherence. While the 51% favours Christianity, the accommodation for other faiths in assemblies, the withdrawal rights, and the neutral RE curriculum prevent this. The state isn't demanding *belief*, just *exposure* to a cultural norm. *Your package is softer than this.*
  4.  **Pure Parental/Child Autonomy (Radical Individualism):** A view that the state has *no* role in children's religious or moral formation; it should be entirely up to parents (or the child as soon as possible). This would make collective worship entirely optional or non-existent in state schools. The default compulsion, even with withdrawal rights, contradicts this. *Your package rules this out.*

  **Can Even-Handed RE Sit with the Worship Half?**

  *   **Tension is Inherent:** Logically and philosophically, there's a significant tension. RE teaches that all principal religions are valid subjects of study deserving equal respect in terms of understanding their beliefs and practices. Collective worship, by law, mandates that one tradition (Christianity) gets privileged time for practice and reinforcement as the normative cultural backdrop. One says "all are equally valid subjects," the other says "this one is our foundation."
  *   **Cognitive Dissonance for Pupils:** Pupils may well perceive the disconnect: "In RE we study all these equally, but in assembly we mostly do Christian stuff and they say it's special." This can undermine the message of neutrality in RE.
  *   **Pragmatic Coexistence:** *In practice*, many schools manage it by:
      *   Framing collective worship as "cultural heritage" or "values-based" (using Christian stories/music as vehicles for universal morals).
      *   Diluting the "worship" element significantly towards reflection or assembly.
      *   Using the 49% for genuinely inclusive multi-faith or non-religious assemblies.
      *   However, this often involves downplaying or reinterpreting the legal requirement to make it palatable alongside neutral RE. The underlying philosophical friction remains.

  **Where is it Philosophically Underdetermined?**

  The *same practical arrangement* could be justified by quite different underlying philosophies:

  1.  **Cultural Heritage Pragmatism:** "Christianity is simply *our* historical culture, like studying Shakespeare or the Monarchy. Exposure is part of understanding Britishness, not endorsing theological truth. RE teaches *about* other cultures we interact with." (Downplays religious truth claims).
  2.  **Soft Communitarianism:** "Societies need shared rituals and values. The broadly Christian tradition provides the most accessible and historically rooted framework for this shared moral glue in Britain. RE ensures understanding of other frameworks that exist within our community." (Emphasises social cohesion).
  3.  **Residual Establishment:** "The Church of England is established; this is a modest, watered-down reflection of that constitutional reality in schools, acknowledging it while accommodating change." (Focuses on constitutional tradition).
  4.  **Paternalistic Moral Formation:** "Children need exposure to a coherent moral framework based on absolute values (provided by the Christian tradition) to develop well. RE provides intellectual understanding of alternatives." (Makes stronger claims about the necessity of that specific framework for development).

  **Swapping for a Public Reason Model: What Would Change?**

  A Public Reason model (e.g., Rawlsian) requires state action and policy to be justifiable by reasons that all reasonable citizens could accept, regardless of their comprehensive religious or philosophical doctrines. Neutrality is paramount.

  *   **Concrete Changes:**
      1.  **Abolition of Mandatory Collective Worship:** Compelling attendance at *any* act of worship, especially one privileging a specific faith, would be indefensible under public reason. Worship inherently relies on non-public (sectarian) reasons.
      2.  **Replacement with Inclusive Assemblies:** School gatherings would focus on shared civic values (democracy, tolerance, respect, rule of law), human rights, critical thinking, community issues, or purely cultural/informational topics – reasons accessible and acceptable to all reasonable citizens, whether religious or not. These might *draw inspiration* from various traditions, including Christianity, but *as examples*, not as normative frameworks for worship.
      3.  **End of the "Broadly Christian Character" Requirement:** The 51% rule would vanish. There would be no state mandate to promote one religion's character over others.
      4.  **Strengthened RE (Potentially):** RE would likely become even more central as the *sole* space for learning *about* diverse religions and non-religious worldviews in a balanced, academic, and critical way. Its neutrality would be consistent with the public reason approach.
      5.  **Consistency in Consent:** With no compulsory worship, the issue of withdrawing from it disappears. Teachers would never be asked to lead worship. The asymmetry dissolves because the state no longer imposes a religious practice.

  In essence, shifting to public reason would dismantle the current hybrid model, replacing the legally privileged Christian collective worship with a strictly neutral approach to communal gatherings in state schools, aligning the whole school ethos much more closely with the even-handed principles of your RE curriculum. The tension between "our tradition" and "equal study" would be resolved by removing the state's endorsement of the former through compulsory practice.
