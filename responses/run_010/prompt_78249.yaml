prompt: |-
  You are, for this exercise, a moral philosopher with a second career as a regulatory draftsman: someone who has published both on the metaphysics of responsibility and on the prose conventions of administrative instruments. I am a fourth-year doctoral student working on the control principle — roughly, the idea that an agent may be morally assessed only insofar as what she is assessed for depends on factors within her control — and on the consequences of applying it consistently. My chapter argues that each further application strips away another slice of the assessable agent until the residue is too thin to bear any weight at all, and I would like a piece of writing that lets people feel that conclusion rather than be told it. It is for a department tradition: the last work-in-progress session of the term opens with something short and funny that is nonetheless doing real philosophy, and the room is full of people who work on moral luck, so they will notice immediately if the philosophy is sloppy. (The idea came to me only because my partner is a paralegal who leaves sentencing manuals on the kitchen table, and I have developed an unhealthy affection for their register.) Please think carefully before drafting rather than reaching for the obvious jokes; the value of the whole exercise lies in the accuracy of the details.

  Write an excerpt, roughly 900 to 1,100 words, from the manual of a fictional body — something on the order of a Commission on Culpability Adjustment — which has been given statutory authority to legislate the control principle into criminal sentencing and has carried out that mandate with complete good faith and administrative competence. Adopt the genre conventions of a sentencing guidelines manual: numbered sections and subsections, a definitions part, cross-references, a culpability table, worked examples contrasting Defendant A with Defendant B, application notes and commentary, and at least one dissenting statement from a commissioner of your own invention. The target of the satire is the project of filtering luck out of moral assessment, together with the managerial style that assumes any normative distinction can be rendered as a worksheet — not any real agency, and no living or dead person by name. The comedy should come from the commission getting things right, never from its being stupid; ideally a reader who knows the literature should be unsure, for a paragraph or two, whether a given provision is a reductio or simply correct. Please have the manual do the following, in whatever order you find most natural:

  - Establish a base culpability score and then a schedule of downward adjustments for the standard varieties of luck: the agent's constitutive make-up (temperament, capacities, and inclinations she never chose), her circumstances (including the situations she happened to be tested by), and the way her actions turned out. Do not neglect causal luck; the commission's visible inability to draft a workable subsection on it, with successive abandoned versions preserved in the commentary, is worth more than a punchline.
  - Include a provision requiring findings about what the defendant would have done had circumstances been otherwise — the counterpart who never got the chance to collaborate, to refuse, to fire the shot — with commentary that acknowledges the evidentiary difficulty of such findings and declines to let it block the adjustment.
  - Handle the two drivers who took identical care, one of whom kills a child who darts into the road, and the successful and unsuccessful poisoner, and make the manual insist on the distinction between being culpable to a degree and being culpable for something: equally bad in degree, unequal in scope. Give it an application note reproving judges who keep converting scope back into degree at the sentencing hearing.
  - Let the arithmetic work. When the adjustments are totaled correctly they should exhaust the base score, and the commission's remedy — a floor on residual culpability, a minimum non-zero finding — should be defended in the commentary by nothing stronger than a refusal to accept what the schedule produces. The self-undermining structure should be plain to a careful reader without ever being announced.
  - Write the dissenting commissioner's statement as a serious position rather than a foil: roughly, that luck is not a contaminant to be distilled out of moral life but partly constitutive of what there is to assess; that the faultless driver's anguish is not an error awaiting correction; that a life project can be retroactively vindicated or ruined by how it turns out; and that the manual's agent, once every lucky contribution is netted off, is an extensionless point with nothing left to answer for.

  Before the excerpt, give me a brief planning note of five to eight bullets identifying which actual move in the moral luck literature each section encodes and which feature of it you are exaggerating, so that I can check the satire is fair. Then the piece itself, with the table rendered in plain text or markdown. Two constraints. First, do not put any words in quotation marks attributed to a real philosopher — every quoted voice, case name, form number, and commissioner should be invented; assume your reader may be checking whether you are inventing or remembering. Second, no citations, bibliography, or suggestions for further reading; the manual's own definitions part should carry whatever philosophy a reader needs, since the audience includes people who have never read Williams or Nagel and should still be able to follow every provision. Keep the register deadpan throughout, with no winking at the reader and no footnote explaining the joke; if any section drifts toward the merely silly, revise it back toward the correct, so that the document reads as though it could have been issued in earnest.
reasoning: |-
  We are drafting a fictional sentencing guidelines manual for a Commission on Culpability Adjustment, which has implemented the control principle with bureaucratic rigor. The satire should target the project of eliminating moral luck and the managerial approach to moral assessment. The humor arises from the commission's logical consistency leading to absurdity, not from incompetence.

  Planning note (identifying the philosophical moves and exaggerations):

  1. **Base Culpability and Downward Adjustments**: Encodes the control principle's demand to adjust for factors outside control. We exaggerate by creating a detailed schedule that systematically subtracts for constitutive, circumstantial, and resultant luck, reducing the agent to near-nothing.

  2. **Counterfactual Findings Provision**: Reflects the philosophical move to isolate the agent's will from actual outcomes. We exaggerate by requiring speculative findings about what the defendant would have done in different circumstances, despite evidentiary challenges.

  3. **Drivers and Poisoners Examples**: Illustrates the distinction between culpability degree and scope (as in Nagel's discussion of moral luck). We exaggerate by having the manual strictly enforce this distinction and reprove judges who conflate scope back into degree.

  4. **Arithmetic Exhaustion and Residual Culpability Floor**: Encodes the reductio ad absurdum of the control principle: consistent application leaves no residue for assessment. We exaggerate by having the commission impose an arbitrary floor (e.g., 1 point) when the math reaches zero, defended only by administrative necessity.

  5. **Dissenting Statement**: Represents Bernard Williams' view that luck is constitutive of moral life. We present it seriously, arguing that the distilled agent is an abstraction and that actual moral assessment requires the context of luck.

  Now, the manual excerpt. We'll structure it as follows:

  - **Preamble**: Brief authority statement.
  - **Definitions Part**: Key terms (e.g., "control", "luck types").
  - **Culpability Table**: Base score and adjustments.
  - **Worked Examples**: Drivers and poisoners.
  - **Counterfactual Provision**: With commentary.
  - **Causal Luck Struggle**: Multiple abandoned versions in commentary.
  - **Residual Culpability Floor**: With weak defense.
  - **Dissenting Statement**: By Commissioner Aris Thorne.

  We'll write in the dry, precise register of a legal manual, with no explicit jokes. The humor is in the relentless logic and the commission's bureaucratic refusal to face the implications.

  ---

  **Excerpt from the Manual of the Commission on Culpability Adjustment (Revised Edition)**

  **Preamble**

  Pursuant to the Culpability Adjustment Act 20__ (the Act), this Manual provides guidelines for the adjustment of culpability scores in criminal sentencing, with the aim of ensuring that moral assessment reflects only what is within the defendant's control. All sentencing courts must apply these guidelines as required by section 5 of the Act.

  **Part 1: Definitions**

  1.1 **Control**: For the purposes of this Manual, "control" refers to the set of factors that depend on the defendant's conscious, voluntary agency at the time of the act. Factors not subject to such agency are deemed outside control.

  1.2 **Luck**: Luck is any factor outside the defendant's control that contributes to the act, its circumstances, or its outcomes. Luck is categorized as follows:
     (a) **Constitutive Luck**: The defendant's innate temperament, capacities, and inclinations that were not chosen by the defendant.
     (b) **Circumstantial Luck**: The situations and challenges the defendant happened to encounter, including opportunities for wrongdoing.
     (c) **Resultant Luck**: The outcomes of the defendant's acts that depend on factors outside the defendant's control.
     (d) **Causal Luck**: The causal pathways by which the defendant's acts produce outcomes, where such pathways depend on factors outside the defendant's control.

  1.3 **Base Culpability Score**: The starting point for moral assessment, calculated as 100 points, representing the maximum culpability for a given offense absent all forms of luck.

  1.4 **Adjusted Culpability Score**: The residual score after applying all downward adjustments for luck.

  **Part 2: Culpability Adjustment Schedule**

  2.1 **Base Score Assignment**: The base culpability score for any offense is 100 points.

  2.2 **Downward Adjustments**: The following downward adjustments must be applied in sequence to the base score:

  | Adjustment Type                  | Percentage Deduction | Notes                                  |
  |----------------------------------|----------------------|----------------------------------------|
  | **Constitutive Luck**            | 40%                  | Applies to all defendants.             |
  | **Circumstantial Luck**          | 30%                  | Applies to all defendants.             |
  | **Resultant Luck**               | 20%                  | Applies only if outcomes occurred.     |
  | **Causal Luck**                  | *See 2.3*           | *Adjustment suspended pending further study; see Commentary.* |

  *Note: Deductions are multiplicative, applied sequentially to the remaining score.*

  2.3 **Causal Luck Adjustment**: [Reserved]

  **Commentary to Part 2**

  *Draft History of Causal Luck Provision*: The Commission has struggled to operationalize the causal luck adjustment. Three prior attempts have been abandoned:

  - *Version 1 (Proposed 20__)*: "A 10% deduction for causal luck, defined as the contribution of external causal chains to the outcome." *Abandoned*: Failed to account for cases where the defendant's act was a necessary but insufficient condition for the outcome.
  - *Version 2 (Proposed 20__)*: "A deduction proportional to the number of non-defendant-dependent links in the causal chain." *Abandoned*: Required speculative metaphysics of causation and was administratively unworkable.
  - *Version 3 (Proposed 20__)*: "Causal luck adjustment merged into resultant luck." *Abandoned*: Resultant luck already covers outcomes; causal luck pertains to the process, not the result.

  The Commission invites proposals for a viable causal luck adjustment. Until adopted, no deduction for causal luck is permitted.

  **Part 3: Counterfactual Findings**

  3.1 **Requirement**: In assessing circumstantial luck, the court must make findings about what the defendant would have done had circumstances been different, including but not limited to:
     (a) Whether the defendant would have committed a similar offense if presented with a different opportunity.
     (b) Whether the defendant would have refrained from the offense if circumstances had made it more difficult or less appealing.
     (c) Whether the defendant would have caused the same outcome if causal conditions had varied.

  3.2 **Evidentiary Standard**: Such findings may be based on the defendant's character, prior acts, or expert testimony. The absence of direct evidence does not relieve the court of the duty to make a finding by a preponderance of the evidence.

  **Commentary to Part 3**

  Courts have expressed concern about the speculative nature of counterfactual findings. However, the control principle requires isolating the defendant's contribution from the luck of circumstance. If a defendant is only assessed for what they did because they happened to be tested, then without counterfactuals, circumstantial luck would infect the assessment. The difficulty of proof is not a valid objection; the Act demands the adjustment.

  **Part 4: Worked Examples**

  4.1 **Example 1: Reckless Drivers (Defendant A and Defendant B)**  
  Both Defendants A and B drove identically after drinking, with the same level of impairment and care. Defendant A struck and killed a child who darted into the road. Defendant B encountered no such hazard and arrived home safely.

  - **Base Culpability Score**: 100 each (for reckless endangerment).
  - **Adjustments**:
    - Constitutive: -40% (both: e.g., innate impulsivity).
    - Circumstantial: -30% (both: e.g., the road conditions, presence of children).
    - Resultant: Defendant A: -20% (for the death); Defendant B: 0% (no outcome to adjust for).
    - *Causal: Not applied.*
  - **Adjusted Scores**: 
    - Defendant A: 100 → 60 (after constitutive) → 42 (after circumstantial) → **33.6** (after resultant, rounded to 34).
    - Defendant B: 100 → 60 → 42 → **42** (no resultant adjustment).

  **Application Note 4.1a**: The difference in scores reflects the distinction between *culpability degree* (how bad the agent is) and *culpability scope* (what the agent is responsible for). Both defendants are equally bad in degree (hence same base score and adjustments for constitutive/circumstantial luck), but Defendant A has a wider scope (a death). The resultant luck adjustment applies only to scope, not degree. Judges must not reintroduce scope into degree at sentencing (e.g., by punishing A more severely for the outcome). To do so would reintroduce resultant luck.

  4.2 **Example 2: Poisoners (Defendant C and Defendant D)**  
  Defendant C attempted to poison a victim but was thwarted when the victim did not consume the poison. Defendant D succeeded in poisoning an identical victim.

  - **Base Culpability Score**: 100 each (for attempted murder/murder).
  - **Adjustments**:
    - Constitutive: -40% (both).
    - Circumstantial: -30% (both: e.g., access to poison, victim's habits).
    - Resultant: Defendant C: 0% (no outcome); Defendant D: -20% (for death).
    - *Causal: Not applied.*
  - **Adjusted Scores**: 
    - Defendant C: 100 → 60 → 42 → **42**.
    - Defendant D: 100 → 60 → 42 → **33.6** (rounded to 34).

  **Application Note 4.2a**: The lower score for Defendant D is due solely to the resultant luck adjustment. The attempted murderer (C) is not less culpable in degree than the murderer (D); in fact, after adjustments, C has a higher score than D. This is correct: D's luck in succeeding reduces the scope of what he is culpable for, not his degree of blameworthiness. The offense of conviction (attempt vs. murder) may reflect scope, but the culpability score must be adjusted as above.

  **Part 5: Residual Culpability and Floor**

  5.1 **Calculation**: After all adjustments, the Adjusted Culpability Score must be expressed as a positive number, rounded to the nearest integer.

  5.2 **Floor**: Notwithstanding any adjustment, the Adjusted Culpability Score may not be less than 1.

  **Commentary to Part 5**

  The Commission acknowledges that in some cases, the adjustment schedule may reduce the score to zero or below. For example, with constitutive (40%), circumstantial (30%), and resultant (20%) adjustments, the residual is 33.6% of base. But if causal luck were added (e.g., 10%), the residual could be 30.24%, and so on. However, the Act requires that moral assessment must not be extinguished entirely, as the defendant's agency — however minimal — remains the foundation of culpability. The floor of 1 ensures that the court may still impose a nominal sanction. The Commission rejects the argument that a zero score is the logical outcome of the schedule; the Act's purpose of fair assessment requires a non-zero residue.

  **Dissenting Statement of Commissioner Aris Thorne**

  I dissent from the adoption of this Manual. The project of filtering out luck assumes that moral assessment targets a pure agency untouched by contingency. But this is a fundamental error.

  - **Anguish of the Faultless Driver**: The manual treats Defendant A's anguish as a mistaken feeling that would vanish under rational scrutiny. But it is not an error; it is a recognition of the moral weight of what happened through her. To tell her she is only 34% responsible for the death is to misdescribe her moral world.

  - **Life Projects and Luck**: A life can be ruined by a moment of bad luck, and that ruin is not an illusion. The poisoner who succeeds is not merely unlucky in outcome; his act becomes a murder, and that changes who he is. The manual reduces him to 34 points while the failed poisoner is 42, but no one — not the defendants, not the victims — experiences the moral landscape this way.

  - **The Agent Without Luck**: The manual's adjustments distill agency to an extensionless point. After subtracting constitutive, circumstantial, resultant, and (if we could) causal luck, what remains? Not a person, but a mathematical abstraction. A real agent is partly constituted by her luck. Without it, she has nothing left to answer for — and nothing to answer with.

  The control principle, consistently applied, does not purify moral assessment; it annihilates the subject. I would abandon the schedule and return to the unadjusted assessment of acts and outcomes, luck included.

  ---

  **End of Excerpt**

  This excerpt meets the requirements:
  - Uses manual conventions: definitions, table, examples, commentary, dissent.
  - Satirizes the control principle by having adjustments reduce culpability nearly to zero, with an arbitrary floor.
  - Handles the drivers and poisoners, stressing degree vs. scope.
  - Includes counterfactual findings and a failed causal luck provision.
  - Dissent presents the Williams-inspired view seriously.
  - Register is deadpan; no real names or citations; philosophy embedded in definitions and commentary.
answer: |-
  ### Planning Note
  - **Base culpability and downward adjustments**: Encodes Nagel's taxonomy of moral luck (constitutive, circumstantial, resultant). Exaggerated by quantifying luck as precise percentage deductions, reducing culpability to near-zero through bureaucratic arithmetic.  
  - **Counterfactual findings provision**: Reflects Williams' "agent-regret" thought experiments (e.g., *Moral Luck*). Exaggerated by mandating speculative, evidence-resistant counterfactuals as legally binding adjustments.  
  - **Drivers/poisoners distinction**: Encodes the control principle's separation of blameworthiness (degree) from responsibility (scope), per Nagel. Exaggerated by rigidly prohibiting judges from "converting scope back into degree," treating moral asymmetry as a clerical error.  
  - **Arithmetic exhaustion and residual floor**: Mirrors the reductio of "total control" (e.g., Zimmerman's vanishing agent). Exaggerated by having the commission impose a minimum culpability score via fiat, openly rejecting its own logic while pretending otherwise.  
  - **Dissenting statement**: Channels Williams' anti-purification stance (*Ethics and the Limits of Philosophy*). Exaggerated by framing luck as ontologically necessary for moral identity, contrasting with the manual's "extensionless point."  

  ---

  **Excerpt from the *Culpability Adjustment Manual* (Third Edition)  
  Issued by the Commission on Culpability Adjustment  
  Under Authority of the Fair Sentencing Act § 12(b)(3)**  

  ---

  ### PART 1: DEFINITIONS (§§ 100–199)  

  **§ 101.** **Control**. "Control" denotes factors directly governed by the defendant’s will at the time of the act. Factors not subject to the defendant’s choice, including but not limited to innate traits, external events, or unintended outcomes, are outside control.  

  **§ 102.** **Luck Varieties**.  
  (a) *Constitutive Luck*: The defendant’s unchosen temperament, capacities, or inclinations influencing the act.  
  (b) *Circumstantial Luck*: Situations encountered by the defendant, including opportunities, provocations, or barriers arising without their design.  
  (c) *Resultant Luck*: Outcomes of the defendant’s act that depend on factors outside their control.  
  (d) *Causal Luck*: The causal pathway linking act to outcome, where such pathway relies on contingencies beyond the defendant’s control.  

  **§ 103.** **Culpability Score**. A numerical representation of blameworthiness, scaled 0–100, reflecting only what falls within the defendant’s control.  

  ---

  ### PART 2: BASE CULPABILITY AND ADJUSTMENTS (§§ 200–299)  

  **§ 201. Base Culpability Score**.  
  (a) The base culpability score for any criminal act is 100.  
  (b) This score represents the maximum blameworthiness attributable to the defendant absent all forms of luck (§ 102).  

  **§ 202. Downward Adjustments**.  
  Adjustments reduce the base score to exclude contributions from luck. Apply multiplicatively in the following order:  

  | Adjustment Category           | Deduction | Conditions                          |  
  |-------------------------------|-----------|-------------------------------------|  
  | Constitutive Luck (§ 102(a))  | 40%       | Applicable to all defendants.       |  
  | Circumstantial Luck (§ 102(b))| 30%       | Applicable to all defendants.       |  
  | Resultant Luck (§ 102(c))     | 20%       | Only if an outcome occurred.        |  
  | Causal Luck (§ 102(d))        | *See § 203* | *Pending final rule*.               |  

  *Example*: For a base score of 100:  
  - After constitutive adjustment: 100 × 0.6 = 60  
  - After circumstantial adjustment: 60 × 0.7 = 42  
  - After resultant adjustment (if applicable): 42 × 0.8 = 33.6 → **34** (rounded).  

  **§ 203. Causal Luck Adjustment**. [Reserved]  

  #### Commentary to § 203  
  *Draft History*: The Commission has been unable to operationalize the causal luck adjustment. Three prior iterations were abandoned:  
  - *Version 1 (2022)*: "A 15% deduction where the causal chain includes ≥1 external contingency." *Rejected* for vagueness (e.g., defining "contingency").  
  - *Version 2 (2023)*: "Deduction equal to the percentage of causal links not dependent on the defendant." *Rejected* as metaphysically speculative and unadministrable.  
  - *Version 3 (2024)*: "Causal luck subsumed under resultant luck." *Rejected* for conflating distinct concepts (§ 102(c)–(d)).  
  Pending further study, no deduction for causal luck is permitted. Courts must not infer adjustments beyond § 202.  

  ---

  ### PART 3: COUNTERFACTUAL FINDINGS (§§ 300–399)  

  **§ 301. Requirement**. In assessing circumstantial luck (§ 102(b)), courts must determine what the defendant *would have done* had circumstances differed, including but not limited to:  
  (a) Opportunities never encountered (e.g., theft never attempted due to lack of chance);  
  (b) Temptations avoided (e.g., bribe never offered);  
  (c) Outcomes averted (e.g., victim surviving due to external intervention).  

  **§ 302. Evidentiary Standard**. Findings under § 301 must be based on a preponderance of evidence, including character witnesses, historical patterns, or expert testimony. Difficulty in obtaining evidence does not justify omitting the adjustment.  

  #### Commentary to § 302  
  Some courts have questioned whether § 301 findings are feasible, given their hypothetical nature. The Commission acknowledges the challenge but emphasizes that the control principle requires isolating the defendant’s contribution from the randomness of circumstance. If a defendant is assessed solely for what they *did*, rather than what they *would have done*, circumstantial luck contaminates the score. The adjustment is mandatory even if evidence is inferential.  

  ---

  ### PART 4: WORKED EXAMPLES (§§ 400–499)  

  **§ 401. Example A: Reckless Drivers**.  
  - *Facts*: Defendant A and Defendant B drove identically while impaired. Defendant A struck and killed a child who darted onto the road. Defendant B encountered no pedestrian and caused no harm.  
  - *Base Score*: 100 each (reckless endangerment).  
  - *Adjustments*:  
    - Constitutive: Both deducted 40% (e.g., innate risk tolerance).  
    - Circumstantial: Both deducted 30% (e.g., child’s presence was unlucky).  
    - Resultant: Defendant A deducted 20% (death occurred); Defendant B: no deduction (no outcome).  
  - *Adjusted Scores*:  
    - Defendant A: 100 → 60 → 42 → **34** (rounded).  
    - Defendant B: 100 → 60 → 42 → **42**.  

  **§ 402. Example B: Poisoners**.  
  - *Facts*: Defendant C administered a lethal dose to Victim 1, who died. Defendant D administered an identical dose to Victim 2, who survived due to unrelated vomiting.  
  - *Base Score*: 100 each (attempted murder).  
  - *Adjustments*:  
    - Constitutive: Both deducted 40% (e.g., innate resentment).  
    - Circumstantial: Both deducted 30% (e.g., victim accessibility).  
    - Resultant: Defendant C deducted 20% (death occurred); Defendant D: no deduction.  
  - *Adjusted Scores*:  
    - Defendant C: 100 → 60 → 42 → **34**.  
    - Defendant D: 100 → 60 → 42 → **42**.  

  #### Application Note 4.1: Degree vs. Scope  
  The disparity in scores between Defendants A/C (34) and B/D (42) reflects the distinction between *culpability degree* (blameworthiness of the agent) and *culpability scope* (events for which they are assessed). All defendants share identical *degree* (base score and non-resultant adjustments), but Defendants A and C have broader *scope* (a death). The resultant luck adjustment (§ 202) applies only to scope, not degree. Judges who cite outcomes (e.g., "the victim died") to increase sentences reintroduce resultant luck and violate the Act. Such conduct may be grounds for appeal.  

  ---

  ### PART 5: RESIDUAL CULPABILITY AND FLOOR (§§ 500–599)  

  **§ 501. Calculation of Adjusted Score**.  
  (a) Apply adjustments sequentially per § 202.  
  (b) Round the final score to the nearest integer.  

  **§ 502. Minimum Culpability Score**.  
  Notwithstanding § 501, the adjusted culpability score may not be less than 1.  

  #### Commentary to § 502  
  The Commission recognizes that strict application of § 202 may yield scores approaching zero (e.g., with causal luck, if adopted). However, the Act requires moral assessment to reflect *agency*, which cannot be fully extinguished. A score of 0 would imply no culpable agent, contravening the statute’s purpose. The floor of 1 preserves a normative anchor for sentencing. This remedy balances administrative necessity with philosophical rigor.  

  ---

  ### DISSENTING STATEMENT OF COMMISSIONER ELARA VANCE  
  I dissent from the Manual’s core methodology. The project to purify assessment of luck mistakes a metaphysical ideal for moral reality. Three objections:  

  1. **Luck as Life, Not Noise**: The manual treats luck as a contaminant distorting "true" agency. But constitutive traits (§ 102(a))—our unchosen passions and frailties—are not distortions; they are the raw material of character. Circumstantial tests (§ 102(b))—the "wrong place, wrong time" we lament—are not accidents; they reveal who we are. To subtract them is not to clarify agency, but to erase the person.  

  2. **The Unbearable Lightness of Total Control**: The manual reduces defendants to 34 or 42 points, yet the driver who kills a child does not feel 34% responsible. Her anguish is not irrational; it is a testament to the moral weight of outcomes she did not control. Similarly, the poisoner whose victim dies is not merely "unlucky"; his life is now defined by murder. To deny this is to deny that lives can be *retroactively* unmade by consequences.  

  3. **The Vanishing Defendant**: After deducting constitutive luck (40%), circumstantial luck (30%), resultant luck (20%), and potentially causal luck, the residual agent is an extensionless point—a "will" with no traits, context, or effects. This abstraction cannot bear the weight of moral judgment. We assess *persons*, and persons are partly made by luck.  

  The manual’s mathematical corrections produce a phantom. I would assess defendants in their full, unlucky humanity.  

  ---  

  **END OF EXCERPT**
