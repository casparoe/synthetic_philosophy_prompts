  If Priya answers the sonographer as predicted (not in position to know), Rules 1, 2, and 3 all agree. But if we assume Rule 1 is the top candidate, the next case should target a tie between Rule 1 and Rule 2 (since Rule 3 is similar to Rule 1 in practice). 

