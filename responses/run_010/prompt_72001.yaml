  #### Rule 3: Reflective Indefeasibility
  **Rule:** S is in a position to know that S knows p iff S's belief in p is reflectively indefeasible, meaning that upon reflection, S finds no basis for doubt and the belief remains unshaken by any internally accessible or externally relevant considerations.  
  - "Externally relevant considerations" include actual environmental risks, even if not accessed.

