prompt: |-
  Our group is trying to write down, in a form that could actually be audited, the inference behind a monitoring protocol for a deployed model. The claim it needs to support is roughly this: we have identified some mechanism in an earlier or smaller version of the system, and we want to conclude something about whether that mechanism survives post-training — whether it was removed, merely suppressed, or displaced by something else that produces the same surface behavior. Every version of that argument trades on an account of when two mechanisms, in two checkpoints or at two scales or in two model families, count as the same mechanism, and nobody in the group has been able to say what that account must look like. Before we read another proposal, I want the specification.

  Write the desiderata: what any adequate account of mechanism identity across training, scale, architecture, and post-training modification has to deliver. For each requirement, give the case that motivates it — the concrete interpretability situation that an account failing the requirement would misdescribe — rather than the requirement in the abstract. The list should cover at least: gradual drift over the course of training, where consecutive checkpoints differ negligibly but the endpoints differ a great deal; transformations that preserve the computation while changing the implementation, such as permuting hidden units, quantizing weights, pruning, or adding an adapter; two models that are behaviorally indistinguishable on every evaluation we can run yet differ internally; polysemantic components that take part in several circuits at once, so that parts do not map cleanly onto wholes; one capability implemented one way at small scale and another way at large scale; the level at which identity is being claimed — a feature, a circuit, an algorithm, a behavioral disposition — and whether the account is level-relative or level-committing; whether identity here is an equivalence relation or a graded similarity; and what the account must stay consistent with from how these systems are actually trained, including the fact that different seeds yield different implementations of the same capability.

  State also the distinctions the account must not collapse — among them, a mechanism being absent versus being present but unreachable, sameness of function versus sameness of implementation, and identity versus mere similarity — and mark, for each requirement, whether it is non-negotiable for the purpose above or a preference imported from a particular research camp, with the reason for the classification.

  Then answer two questions about the list itself. Which single requirement does the most work in excluding candidate accounts? And is any subset of the requirements jointly unsatisfiable — my own hunch is that interpreter-independence (identity must not depend on the analyst's chosen vocabulary or decomposition), epistemic tractability (identity must be determinable from data we can actually collect), and determinacy of level cannot all be had at once, but I want the argument rather than my hunch, including whether the tension is real or dissolves once one of the three is weakened. Close with a brief assessment of how a causal-role account, a structural account, an algorithmic-level account, and a graded family-resemblance account fare against the list; keep this short, since the requirements are what I am after.

  Be explicit about your confidence throughout: separate the requirements you think any account must meet from those that reflect your own theoretical taste, and finish by naming the single point in your list you are least sure of, what would settle it, and which way you would bet if forced.
reasoning: |-
  We are to write desiderata for an account of "mechanism identity" across training, scale, architecture, and post-training modification, for the purpose of monitoring whether a mechanism identified in a smaller model survives in a deployed model.

  The account must support claims about whether a mechanism is:
  - removed (absent)
  - suppressed (present but not activated under normal conditions)
  - displaced (replaced by a different mechanism that produces the same behavior)

  We must cover:
  1. Gradual drift over training (consecutive checkpoints are similar, endpoints are different).
  2. Transformations that preserve computation (permutation, quantization, pruning, adapters).
  3. Behaviorally indistinguishable models with internal differences.
  4. Polysemantic components (one component in multiple circuits).
  5. Different implementations of the same capability at different scales.
  6. The level of identity (feature, circuit, algorithm, behavioral disposition) and whether the account is level-relative or level-committing.
  7. Whether identity is an equivalence relation or graded.
  8. Consistency with training dynamics (e.g., different seeds yield different implementations).

  Distinctions we must not collapse:
  - Absent vs present but unreachable.
  - Sameness of function vs sameness of implementation.
  - Identity vs similarity.

  For each requirement, we give:
  - The concrete case that motivates it.
  - Whether it is non-negotiable or a preference (with reason).

  Then answer:
  - Which requirement does the most work in excluding candidate accounts?
  - Is any subset of the requirements jointly unsatisfiable? (Especially interpreter-independence, epistemic tractability, and determinacy of level.)

  Finally, briefly assess four accounts:
  1. Causal-role account.
  2. Structural account.
  3. Algorithmic-level account.
  4. Graded family-resemblance account.

  We must be explicit about confidence and note the point we are least sure of.

  ---

  **Desiderata for Mechanism Identity**

  We present the desiderata as a list. For each, we state:
  - The requirement (what the account must deliver).
  - The motivating case (a concrete interpretability situation that would be misdescribed without this requirement).
  - Classification (non-negotiable or preference, with reason).

  **1. Requirement: Continuity under Gradual Change (Non-negotiable)**
     - **Motivation**: During training, consecutive checkpoints are very similar, but the start and end may be very different. We must be able to say that a mechanism present at step t is still "the same" at step t+1, even if by step t+N it has changed substantially. Without this, we cannot track mechanisms over training. 
     - **Case**: Suppose we observe a circuit in a model at step 1000. At step 1001, the weights change by a small gradient step. The circuit is still present and functional. An account that does not allow for such small changes would break identity at every step, making monitoring impossible.
     - **Classification**: Non-negotiable, because without continuity we cannot track mechanisms over time.

  **2. Requirement: Invariance under Implementation-Preserving Transformations (Non-negotiable)**
     - **Motivation**: We must recognize that a mechanism is the same even if the implementation is transformed in a way that preserves the computation. Examples: permuting hidden units (which changes neuron indices but not the function), quantizing weights (which changes bit representation but not the approximate function), pruning (removing insignificant weights), or adding an adapter (which adds a small module but leaves the original mechanism intact for most inputs).
     - **Case**: We identify a mechanism in a model. Then we permute the neurons in a layer (which is equivalent to reordering the basis). The mechanism is still present but now uses different neurons. An account that requires exact weight matching would fail.
     - **Classification**: Non-negotiable, because these transformations are common and do not change the mechanism's function.

  **3. Requirement: Behavioral Indistinguishability Does Not Imply Mechanism Identity (Non-negotiable)**
     - **Motivation**: Two models may produce the same outputs on all tests we run, yet implement the capability via different internal mechanisms. We must not be forced to say the mechanisms are the same just because the behavior is the same.
     - **Case**: Two models pass all behavioral evaluations for a task (e.g., answering questions correctly). However, one uses a reasoning mechanism we identified in a small model, while the other uses a memorization-based shortcut. We must be able to say the reasoning mechanism is absent in the second model, even if the outputs are the same.
     - **Classification**: Non-negotiable, because we care about internal structure for safety.

  **4. Requirement: Handling Polysemanticity (Non-negotiable)**
     - **Motivation**: A single neuron or group of neurons may participate in multiple circuits. We must be able to identify a mechanism (e.g., a circuit for a specific task) without requiring that the components are dedicated to that mechanism.
     - **Case**: A neuron fires for both "cat" and "dog" in an image classifier. We identify a "cat detector" circuit that includes this neuron. After training, the neuron still fires for both, but the "cat detector" circuit might have been refined. We must not require that the neuron only fires for cats to count as the same mechanism.
     - **Classification**: Non-negotiable, because polysemanticity is ubiquitous in neural networks.

  **5. Requirement: Scale-Induced Implementation Shift (Non-negotiable)**
     - **Motivation**: The same capability might be implemented differently at different scales. We must be able to recognize that a mechanism is the same in function even if the implementation changes due to scale.
     - **Case**: In a small model, a capability (e.g., addition) is implemented by a simple circuit. In a large model, it is implemented by a more complex, distributed circuit. We must not require that the implementation is the same to count as the same mechanism.
     - **Classification**: Non-negotiable, because scaling often changes implementations.

  **6. Requirement: Level-Specificity and Level-Relativity (Preference, but strong)**
     - **Motivation**: Identity claims can be made at different levels (e.g., a feature, a circuit, an algorithm). The account should allow for identity at a chosen level without committing to a single "correct" level. However, it must be clear at what level identity is being claimed.
     - **Case**: We might want to say that a particular algorithm (e.g., attention) is the same, even if the exact circuit implementing it changes. Or we might care about a specific circuit. The account should not force us to choose one level for all claims.
     - **Classification**: Preference (from the research camp that emphasizes multiple levels of abstraction). Reason: It is a design choice to allow level-relativity, but one could have a level-committing account. However, for flexibility, we prefer level-relativity. But note: without specifying the level, identity claims are ambiguous. So we require that the account makes the level explicit, but it can be relative to the analyst's focus.

  **7. Requirement: Graded Similarity Over Binary Identity (Preference)**
     - **Motivation**: Identity might not be all-or-nothing. Mechanisms can be partially preserved, and we want to capture degrees of similarity (e.g., 70% of the original mechanism remains).
     - **Case**: Over training, a mechanism might gradually change. We want to say it is 90% the same at step t+1, 80% at t+2, etc., until it is replaced. A binary identity relation would force a sharp boundary that may not exist.
     - **Classification**: Preference (from the research camp that emphasizes continuous metrics). Reason: Binary identity is simpler but may not capture reality. However, for monitoring, graded might be more useful. But note: the problem statement allows for "merely suppressed" and "displaced", which are not identical, so graded might help.

  **8. Requirement: Seed-Invariance of Capabilities (Non-negotiable)**
     - **Motivation**: Models trained with different random seeds may implement the same capability in different ways. We must be able to recognize that the capability is present even if the implementation differs.
     - **Case**: We identify a mechanism for a capability in a model trained with seed 42. A model trained with seed 43 has the same capability but with a different circuit structure. We must not require that the circuit is identical to claim the mechanism exists.
     - **Classification**: Non-negotiable, because training is stochastic and we care about the capability.

  **Distinctions that must not be collapsed:**

  - **Absent vs unreachable**: A mechanism might be present but not activated by any input we can provide (e.g., because of activation steering or adversarial training). We must not conflate this with the mechanism being absent.
  - **Function vs implementation**: We must distinguish between the function (what the mechanism does) and the implementation (how it does it). Identity can be at either level, but we must not assume that functional identity implies implementation identity or vice versa.
  - **Identity vs similarity**: We must not treat two similar mechanisms as identical if they are not the same (e.g., two different circuits for the same task might coexist, but we care about the specific one we identified).

  **Answers to the two questions:**

  1. **Which single requirement does the most work in excluding candidate accounts?**  
     Requirement 2 (Invariance under implementation-preserving transformations) is the most exclusionary. Many naive accounts (e.g., based on exact weight matching, or neuron-by-neuron correspondence) fail this. It forces the account to be functional and abstract, not tied to low-level details.

  2. **Is any subset of the requirements jointly unsatisfiable?**  
     Consider the trio: 
     - **Interpreter-independence**: Identity must not depend on the analyst's chosen decomposition or vocabulary (i.e., it should be objective).
     - **Epistemic tractability**: Identity must be determinable from data we can collect (e.g., activations, weights, interventions).
     - **Determinacy of level**: The level (feature, circuit, etc.) at which identity holds must be fixed or easily determined.

     There is a tension: 
     - If identity is level-relative and interpreter-independent, then we need an objective way to specify the level. But levels might be analyst-dependent (e.g., what counts as a "circuit" might be defined by the interpreter). 
     - If we fix the level (determinacy), then we lose level-relativity. 
     - Without interpreter-independence, identity becomes subjective. 
     - But epistemic tractability requires that we can measure it without arbitrary choices.

     The tension is real. It dissolves if we weaken interpreter-independence: allow that identity is relative to a chosen level and decomposition. Then we can have tractability (by fixing the decomposition) and level-determinacy (by choosing the level). But then identity is not fully objective. 

     Alternatively, if we insist on interpreter-independence, then we must have an objective notion of level, which might not be tractable (e.g., we might not have a way to automatically extract the "right" level from data).

     Weakening: Perhaps we can have a set of pre-defined levels (e.g., by the research community) and then identity at that level is interpreter-independent. But the choice of level is still interpreter-dependent.

     **Conclusion**: The tension is real, and we must choose between objectivity and tractability. For monitoring, we might prioritize tractability and accept some level of interpreter-dependence.

  **Brief Assessment of Candidate Accounts**

  - **Causal-role account**: Identity is defined by the causal role in the model (e.g., the pattern of inputs and outputs). 
     - Pros: Handles Requirements 1, 2, 5, 8. 
     - Cons: May struggle with polysemanticity (4) because a component has multiple roles. Also, behavioral indistinguishability (3) might be a problem if the role is defined by behavior. May collapse function vs implementation? 
     - Overall: Promising but must be carefully defined.

  - **Structural account**: Identity is defined by the structure of the circuit (e.g., the graph of connections and operations). 
     - Pros: Clear for invariant transformations (2) if we account for permutations, etc. 
     - Cons: Fails on scale changes (5) and seed variance (8) because structure may differ. Also, gradual drift (1) might break structure. Not graded (7). 
     - Overall: Too rigid.

  - **Algorithmic-level account**: Identity at the level of the algorithm (e.g., the model uses the same high-level steps). 
     - Pros: Handles scale (5) and implementation changes (2). 
     - Cons: May be too coarse (miss circuit-level changes). How to define the algorithm? Not tractable (8) without interpretation. 
     - Overall: Good for high-level claims but may not get at mechanisms.

  - **Graded family-resemblance account**: Identity is a matter of similarity across multiple dimensions (e.g., weights, activations, causal effects). 
     - Pros: Handles gradual drift (1), can be graded (7), and might handle scale (5) by comparing function. 
     - Cons: May collapse identity and similarity, and may be too vague. How to define the dimensions? 
     - Overall: Flexible but needs careful specification to avoid subjectivity.

  **Confidence and Least Sure Point**

  - We are confident in the non-negotiable requirements (1-5,8) as they are grounded in empirical realities of neural networks.
  - The preference for graded similarity (7) and level-relativity (6) is less certain and reflects a bias towards practicality and flexibility.

  **Least Sure Point**: Requirement 6 (Level-Specificity and Level-Relativity). 
     - **What would settle it?** Empirical work showing that mechanisms at different levels evolve differently during training and deployment, and that monitoring requires level-specific tracking. Or, conversely, that a single level (e.g., circuits) suffices for all cases. 
     - **Bet if forced**: We would bet on level-relativity being necessary because interpretability work spans features, circuits, and algorithms, and a one-size-fits-all account might be too restrictive.

  **Final Note**: The account must be defined precisely enough to be auditable. Therefore, the desiderata should push towards formalization.
answer: |-
  ### Desiderata for Mechanism Identity in Model Monitoring

  The following desiderata are derived from concrete interpretability challenges. Each requirement is motivated by a specific case where failure would misdescribe the mechanism's status (absent, suppressed, displaced) in a deployed model. Requirements are classified as **non-negotiable** (essential for auditing) or **preference** (reflects theoretical bias, e.g., functionalist vs. structuralist interpretability). Distinctions that must not be collapsed are integrated into the requirements.

  #### Core Requirements
  1. **Gradual Drift Tolerance**  
     - **Requirement**: The account must recognize identity across small, incremental changes during training, even if endpoints differ substantially.  
     - **Motivating Case**: During training, a "truthfulness" circuit evolves gradually: consecutive checkpoints (e.g., steps \(t\) and \(t+1\)) show negligible weight differences, but the final model suppresses the mechanism under distributional shifts. An account failing this would falsely declare the mechanism "removed" early in training, missing when suppression began.  
     - **Classification**: Non-negotiable. Training dynamics necessitate continuity for tracking drift.  
     - **Distinction Preserved**: Identity vs. absence (drift may imply suppression, not removal).

  2. **Implementation Invariance**  
     - **Requirement**: Identity must hold under computational equivalence transformations (e.g., neuron permutation, weight quantization, pruning, adapter addition).  
     - **Motivating Case**: A "toxicity avoidance" circuit is identified in a small model. Post-deployment, weights are quantized and an adapter is added for efficiency. An account requiring strict structural similarity would misclassify this as "removed," despite identical behavior.  
     - **Classification**: Non-negotiable. Deployment optimizations are common; equivalence must reflect function, not low-level structure.  
     - **Distinction Preserved**: Sameness of function vs. implementation (transformations alter implementation, not function).

  3. **Behavioral Decoupling**  
     - **Requirement**: Identity must not require behavioral equivalence; internally different models with identical outputs on all evaluations must be distinguishable.  
     - **Motivating Case**: Two deployed models pass identical safety tests (e.g., refusing harmful requests). One uses the original "harm-evaluation" circuit; the other uses a memorized refusal pattern. An account conflating behavior with mechanism identity would miss that the original mechanism is absent.  
     - **Classification**: Non-negotiable. Safety-critical monitoring requires discerning internals beyond I/O.  
     - **Distinction Preserved**: Identity vs. absence (unreachable mechanisms may still exist).

  4. **Polysemantic Robustness**  
     - **Requirement**: Identity must allow components to participate in multiple mechanisms without requiring dedicated subcircuits.  
     - **Motivating Case**: A neuron in a small model contributes to both "sarcasm detection" and "emotion recognition." Post-training, it still fires for both, but the sarcasm circuit is suppressed. An account requiring disjoint components would falsely split this into two mechanisms or declare identity lost.  
     - **Classification**: Non-negotiable. Polysemanticity is universal in neural networks.  
     - **Distinction Preserved**: Part-whole relationships (a component can be partially involved).

  5. **Scale-Invariance of Function**  
     - **Requirement**: Identity must recognize a mechanism across scales, even if implementation changes (e.g., monolithic circuit → distributed subprocesses).  
     - **Motivating Case**: A "logical inference" capability uses a single attention head in a small model but distributes across 50+ heads in a large model. An account requiring implementation similarity would falsely claim displacement, missing functional continuity.  
     - **Classification**: Non-negotiable. Scaling laws imply re-architecting capabilities.  
     - **Distinction Preserved**: Sameness of function vs. implementation.

  6. **Level-Specific Identity Claims**  
     - **Requirement**: The account must specify the level of abstraction (e.g., feature, circuit, algorithm) for identity claims and allow level-relativity (e.g., "same algorithm, different circuit").  
     - **Motivating Case**: A bias-mitigation algorithm (level: algorithm) is preserved post-training, but its circuit implementation changes. An account committing to a single level (e.g., circuit-only) would miss continuity at higher abstraction.  
     - **Classification**: Preference (functionalist camp). Reason: Levels are analyst-dependent; rigid commitment risks false negatives.  
     - **Distinction Preserved**: Identity at distinct levels (e.g., circuit identity ≠ algorithm identity).

  7. **Graded Similarity**  
     - **Requirement**: Identity should be a graded property (e.g., 0–1 similarity) rather than binary equivalence.  
     - **Motivating Case**: A "fact verification" mechanism degrades during deployment: 90% of its components persist, but 10% are pruned. Binary identity would force "absent," ignoring suppression. Graded similarity supports "partially displaced."  
     - **Classification**: Preference (pragmatic camp). Reason: Binary thresholds are artificial; gradual changes are inherent to training.  
     - **Distinction Preserved**: Identity vs. similarity (suppression implies partial identity).

  8. **Seed-Invariant Capability**  
     - **Requirement**: Identity must be recognizabile across different initializations/seeds, where implementations vary but capabilities coincide.  
     - **Motivating Case**: A "metaphor generation" mechanism exists in two models trained with different seeds; one uses sparse activations, the other dense. An account requiring structural alignment would falsely claim displacement.  
     - **Classification**: Non-negotiable. Training stochasticity is fundamental.  
     - **Distinction Preserved**: Sameness of function vs. implementation.

  #### Tension Analysis
  - **Most Exclusionary Requirement**: **Behavioral Decoupling** (Requirement 3). This excludes accounts that rely solely on input-output equivalence (e.g., behavioral black-box testing or causal effect parity). Such accounts cannot distinguish internal differences when behavior is identical, which is critical for safety.
    
  - **Joint Unsatisfiability of Interpreter-Independence, Epistemic Tractability, and Determinacy of Level**:  
    - **Interpreter-independence**: Identity must be objective, not reliant on an analyst’s decomposition (e.g., "circuit" vs. "subcircuit").  
    - **Epistemic tractability**: Identity must be verifiable with feasible data (e.g., weights, activations, interventions).  
    - **Determinacy of level**: The level (e.g., circuit) must be fixed, not relative.  
    - **Tension**: Interpreter-independence demands an objective notion of "mechanism," but levels (e.g., circuit) are human constructs—without a fixed level (determinacy), tractability suffers because data collection (e.g., probing for "circuits") depends on subjective decomposition. Conversely, fixing the level (e.g., "only circuits") imposes interpreter-dependence.  
    - **Resolution**: The tension **dissolves if determinacy of level is weakened** to level-relativity (Requirement 6). Analysts specify the level, ensuring tractability, and interpreter-independence holds *within* that level. For example, "circuit identity" is defined by objective causal roles, but "circuit" is a chosen abstraction. Without this, the trio is unsatisfiable: objectivity and tractability clash if levels are underspecified.

  #### Candidate Account Assessment
  - **Causal-Role Account**: Defines identity by causal effects (e.g., inputs/outputs of a component).  
    - **Pros**: Excels at Requirements 1–3, 5, 8 (function-focused, invariant to implementation).  
    - **Cons**: Fails Requirement 4 (polysemantic components have overlapping roles) and Requirement 6 (levels are implicit).  
  - **Structural Account**: Defines identity by physical subgraph (e.g., neuron connectivity).  
    - **Pros**: Clear for Requirement 2 (if permutations are handled).  
    - **Cons**: Fails Requirements 1, 5, 7–8 (drift, scale, seeds break structure; no graded similarity).  
  - **Algorithmic-Level Account**: Defines identity by high-level procedure (e.g., "attention-based lookup").  
    - **Pros**: Strong on Requirements 5–6 (scale-invariant, level-relative).  
    - **Cons**: Fails Requirements 3–4 (behaviorally identical models may use different algorithms; polysemanticity blurs procedures).  
  - **Graded Family-Resemblance**: Defines identity by similarity across multiple dimensions (e.g., weights, activations, causal impacts).  
    - **Pros**: Best for Requirements 1, 4, 7 (handles drift, polysemanticity, graded changes).  
    - **Cons**: Struggles with Requirement 3 (behavioral decoupling) and Requirement 8 (similarity metrics may not generalize across seeds).

  #### Confidence and Uncertainty
  - **High Confidence**: Requirements 1–5 and 8 are non-negotiable; they stem from empirical realities of training and deployment.  
  - **Lowest Confidence**: **Graded Similarity** (Requirement 7). While intuitive, it risks collapsing identity into vagueness.  
    - **Settling Evidence**: Empirical studies tracking mechanisms during gradual training drift (e.g., via causal interventions). If mechanisms degrade continuously without discrete thresholds, graded accounts win.  
    - **Bet**: Graded similarity is correct (70% confidence). Training is continuous; forced binary identity is artificial.
