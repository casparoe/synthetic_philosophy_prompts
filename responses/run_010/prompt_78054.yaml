answer: |-
  ## The Unfair Charge of 'Just-So Stories' Betrays a Fundamental Misunderstanding of Rigorous Evolutionary Science

  **An evolutionary psychologist responds to critics who dismiss empirical findings as mere speculation.**

  It is with weary disappointment that one encounters, yet again, the glib dismissal of careful evolutionary psychology research as the construction of "just-so stories." This charge, often levelled by those unfamiliar with the stringent demands of hypothesis testing in our field, or perhaps uncomfortable with its implications, fundamentally misrepresents the scientific process we rigorously uphold. My own work on Resource Display Theory (RDT) – investigating the crucial signalling role of conspicuous provisioning behaviours, particularly the costly display of surplus provisioning capacity in mate attraction contexts – stands as a prime example of precisely the *opposite*: empirically grounded, predictive science.

  Critics often allege our hypotheses are unfalsifiable, mere narratives that can twist any outcome into support. This is demonstrably false. Take RDT: it predicts that individuals capable of reliably demonstrating surplus resource control will garner higher mate value. Suppose, hypothetically, we found a society where those who *hoarded* resources privately, never displaying surplus, were the most desirable mates. Would this falsify RDT? Not necessarily. It might reveal a fascinating adaptation to specific ecological pressures! Perhaps in that environment, overt display attracted dangerous predation or social sanctions, making *concealed* surplus the truly optimal signal – a sophisticated calibration of the underlying display principle. The core adaptationist insight – that behaviour serves fitness-maximising signalling functions – remains robust, even as its specific expression adapts to local constraints. This flexibility is a strength, indicative of a powerful theoretical framework, not a weakness. As I noted in my 2018 review, "even apparent counterexamples within the framework of signalling theory often reveal deeper adaptive calibrations to niche-specific pressures."

  Another common, yet equally misguided, accusation is that we focus solely on ultimate function – the "why" – while ignoring proximate mechanisms, development, or evolutionary history. This is a caricature. While establishing adaptive function is our primary aim, it is hardly pursued in a vacuum. Consider RDT's prediction regarding male investment in elaborate, caloric-costly food gifts during courtship. We don't merely assert its function; we build models predicting *quantifiable* thresholds of costliness required for effective signalling relative to baseline resources. We collaborate with physiologists measuring the metabolic costs involved. We examine heritability estimates for provisioning behaviours (moderate h² values around 0.4 are consistently found, suggesting room for selection). The developmental pathways are complex, certainly, involving learning and cultural transmission, but these operate *upon* an evolved predisposition to attend to, and value, reliable resource signals. Demanding we solve every level simultaneously before proposing a functional hypothesis is to misunderstand the iterative nature of science.

  Furthermore, the suggestion that we uncritically conflate contemporary hunter-gatherer societies with Pleistocene environments, or use them to mutually bolster weak arguments, ignores the careful, convergent methodology employed. Our inferences about ancestral selection pressures rely on multiple, independent lines of evidence. For instance, RDT didn't emerge from thin air. Cross-cultural ethnography reveals conspicuous food sharing and display as courtship behaviours in over 90% of studied foraging societies, from the Hadza to the Ache – a remarkable regularity suggesting deep evolutionary roots. The comparative method shows precursors: male provisioning linked to mating effort in several primate species closely related to humans. Crucially, our optimality model, published *before* the large-scale cross-cultural survey by Peterson et al., quantitatively predicted the observed positive correlation between the caloric surplus males reliably displayed and their reproductive success across diverse societies. This convergence – ethnography, phylogeny, heritability, and successful *a priori* quantitative prediction – is the antithesis of storytelling. It's hypothesis testing at its most robust. As I argued in *Evolutionary Behavioral Sciences*, "The triangulation of evidence from contemporary analogues, comparative biology, and formal modelling provides a powerful, falsifiable framework for reconstructing adaptive functions."

  It is disheartening to see such rigorous work dismissed with a simplistic label. The charge of "just-so story" is too often a shield for those unwilling to engage with the demanding, multi-method empirical work evolutionary psychologists undertake. We build testable models, generate specific predictions, and subject them to data. Sometimes we are wrong, and the theory adjusts. That is science. To conflate this with unfounded speculation does a profound disservice to the field and the quest to understand the deep roots of human behaviour. The progress speaks for itself. The data, after all, never lie.
