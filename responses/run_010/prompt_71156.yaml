prompt: |-
  I finished my dissertation last spring on credal sets and lower previsions — the whole imprecise-probability apparatus — and spent four years happily arguing with philosophers about whether a rational agent's beliefs have to be a single real-valued function. Then in January I took a job as a methods analyst in a hospital's patient-safety unit, which is where it stopped being abstract. Three weeks in I got handed this: a single lot of a vascular catheter, 41 documented uses, zero confirmed bloodstream infections. Except the unit's own audit says event capture is lossy — some infections get coded as sepsis-of-unspecified-origin, some patients transfer out and we never see the follow-up — so the honest statement is that we observed zero *reports*, and the true reporting rate is somewhere between, very generously, one-in-four and one. My proposal to the safety committee was to not collapse that into a number: treat the reporting rate as ranging over a set, get a set of posteriors for the true event rate, and report the interval of upper bounds rather than a point. With zero events in 41 uses the usual crude upper bound is around 7%, but if only a quarter of events actually reach us the same calculation is more like 29%, and the committee's action threshold sits right in the middle of that range. So the entire decision hinges on a nuisance parameter the data cannot settle, and I'd rather say so than smuggle in a point estimate of it.

  Next Thursday I give the monthly methods forum talk — 25 minutes, then questions, and the room decides whether this becomes a real piece of work or gets shelved. It's about twenty people: a dozen clinical epidemiologists and trialists who think exclusively in operating characteristics, coverage, and whether a figure can survive being put in a letter to the manufacturer; the unit director who has to actually sign that letter; two senior Bayesians from the biostat group, one of whom builds hierarchical models for a living and considers anything short of putting a hyperprior on the reporting rate to be a cop-out dressed up in notation; and one philosopher-of-statistics person who does read the imprecise-probability literature and will be the most dangerous person present, because she'll know precisely where my argument is thinnest and she will not be rude about it. My argument, roughly: a single number here buys its precision with an unstated point estimate of reporting; representing reporting as a set yields a set of posteriors whose spread is a feature, since it isolates exactly the part of the question the evidence can't touch; you can still act, using something like maximality or gamma-maximin instead of pretending the spread evaporates; and the useful deliverable for a director is "keep versus pull is not rankable without a judgement about capture, and here is the judgement that would flip it," not a spurious 7%.

  So: build me the prep sheet. Give me the eight or so objections I'll actually field from *this* audience, ranked by how much damage each would do in the room — and please don't give me the philosophy-seminar hits, because nobody here has heard of a Dutch book and I do not want to spend my question period defending coherence theorems to people who care about coverage. For each objection I want who it comes from and how they'd phrase it, since the trialist version and the hierarchical-Bayes version can be aimed at the exact same soft spot and sound nothing alike; a two-minute answer I can say out loud without hedging every clause; and a blunt line about where that answer is weakest. Mark which ones I should concede inside the first five minutes to buy credibility, which ones I cannot concede without losing the whole proposal, and the single reply that has to land for this to survive the meeting. I already know the dilation question is coming — that more data can widen the interval — and I'm honestly scared of "why not just put a prior on the reporting rate and be done with it," since I don't have a crisp answer for why that isn't strictly better. Finish with the question I'm dreading, the one I'm praying nobody asks, phrased the way it would actually be asked, and what I say if it lands anyway.
reasoning: |-
  We are preparing for a presentation to a mixed audience on using imprecise probability (credal sets) for a hospital safety problem. The problem: observed 0 infections in 41 catheter uses, but the reporting rate (capture of infections) is uncertain, ranging from 1/4 to 1. The proposal is to avoid a point estimate and instead use a set of reporting rates to get a set of posteriors, then report an interval of upper bounds (which spans from about 7% to 29%). The decision threshold is in the middle of this interval, so the uncertainty in reporting rate is critical.

  The audience includes:
  - Clinical epidemiologists and trialists (care about operating characteristics, coverage, and practical communication)
  - Unit director (has to sign letters to manufacturers, cares about actionable results)
  - Two senior Bayesians (one hierarchical modeler who wants hyperpriors, one who might be sympathetic but critical)
  - One philosopher of statistics (knowledgeable about imprecise probability, will find the weakest points)

  We need to anticipate 8 objections, ranked by potential damage. For each:
  - Who says it and how they phrase it
  - A two-minute answer without hedging
  - A blunt note on where the answer is weak
  - Mark which to concede early (to build credibility), which are critical (cannot concede), and the one reply that must land.

  Also, the dreaded question and how to handle it.

  Ranked by damage (high damage first):

  1. **The Hierarchical Bayesian's Challenge: "Why not put a prior on the reporting rate and do a full Bayesian analysis? That would give you a posterior distribution for the true event rate and you can compute any decision rule you want. Why is your set-based approach better than that?"**
     - **Who:** The hierarchical Bayesian (the one who builds models for a living).
     - **Phrasing:** "This seems like an overcomplication. We have well-established Bayesian methods that can incorporate uncertainty in the reporting rate through a prior. We can even put a hyperprior on it if we want to be noncommittal. Then we get a full posterior and can make decisions using expected loss. Why not do that and avoid this set-based approach which feels like a step back?"
     - **Damage:** High because it directly challenges the core methodology and might sway the audience toward a more familiar approach.
     - **Answer:** "A full Bayesian analysis would require specifying a prior on the reporting rate. But what prior? We have no data to inform it, and it's a nuisance parameter that we are deeply uncertain about. The set-based approach avoids having to make an arbitrary choice of prior that would then be baked into the results. By using a set, we are being transparent about the uncertainty and showing that the conclusion (whether to pull the catheter) depends critically on what we assume about reporting. If we put a prior on it, we are effectively making an assumption without evidence and then hiding it in the prior. Our approach isolates the part of the problem that the data cannot resolve and forces us to confront it."
     - **Weakness:** The Bayesian might counter that non-informative priors or robust Bayesian methods exist, and that the set-based approach is just a special case of Bayesian analysis with a set of priors. Also, the set-based approach doesn't give a single decision but a set of possibilities, which might be seen as indecisive.
     - **Critical:** Cannot concede. If we concede that a Bayesian approach is better, our proposal is dead.
     - **Must Land:** The point about transparency and avoiding arbitrary assumptions. The audience must see that the set approach is more honest about the uncertainty.

  2. **The Epidemiologist's Practicality Challenge: "This interval is too wide to be useful. We need a clear 'go/no-go' for the committee. How can we make a decision if your method tells us it could be 7% or 29%? We can't write a letter to the manufacturer with that."**
     - **Who:** A clinical epidemiologist or trialist (practical, concerned about action).
     - **Phrasing:** "Your approach leaves us in a state of paralysis. We have to make a decision: either pull the catheter or keep using it. Your interval includes both below and above our threshold. How does this help? We need a single number or at least a clear recommendation."
     - **Damage:** High because it questions the utility of the approach for decision-making. The director might agree.
     - **Answer:** "The width of the interval is exactly the point: it shows that with the current data and the uncertainty in reporting, we cannot be sure. But we can still make a decision by using decision rules that account for imprecision. For example, we can use the gamma-maximin criterion: choose the action that maximizes the minimum expected utility. In this case, if we consider the worst-case scenario (low reporting rate) then the true rate could be as high as 29%, which is above the threshold. That might lead us to pull the catheter. Alternatively, if we are optimistic about reporting, we might keep it. The method doesn't tell us what to do, but it tells us what we need to know: that the decision hinges on the reporting rate. And that is crucial because it directs us to gather more data on reporting or to have an explicit discussion about what reporting rate we are willing to assume. Without this, we might make a decision based on an arbitrary point estimate (like 7%) and ignore the risk of underreporting."
     - **Weakness:** The answer does not provide a clear decision, which is what they want. It might be seen as passing the buck.
     - **Critical:** Must not concede that the interval is useless. We have to show that it provides valuable insight.
     - **Must Land:** The idea that the interval reveals the crux of the decision and that we can use robust decision rules. Also, that it prevents a false sense of security.

  3. **The Philosopher's Dilation Question: "With more data, your interval might get wider. That seems perverse and could lead to less certainty with more data. How do you justify that?"**
     - **Who:** The philosopher of statistics (knows about dilation in imprecise probability).
     - **Phrasing:** "I'm concerned about dilation. Suppose we collect more data and still see zero infections. Your set of posteriors might become more spread out, meaning we become less certain about the true rate. That seems counterintuitive and undesirable. How do you handle that?"
     - **Damage:** High because it exposes a known weakness in imprecise probability that might make the approach seem irrational.
     - **Answer:** "Dilation is a real phenomenon, but it is a feature, not a bug. It occurs when new data is ambiguous and doesn't resolve the uncertainty in the nuisance parameter (here, the reporting rate). In our case, if we get more zeros, it doesn't tell us whether the reporting rate is low or the true infection rate is low. So, the set of possibilities remains wide. That's an honest reflection of the state of knowledge. We shouldn't force the interval to narrow when the data doesn't bear on the key uncertainty. The alternative — using a point estimate for the reporting rate — would narrow, but that would be an illusion because it's based on an arbitrary choice. Our method forces us to acknowledge that without data on reporting, we remain uncertain."
     - **Weakness:** Dilation is hard to swallow for many because it violates the intuition that more data should reduce uncertainty.
     - **Critical:** We can concede that dilation is counterintuitive but argue that it is honest. We cannot concede that it invalidates the approach.
     - **Note:** This is a known issue and we should be prepared.

  4. **The Biostatistician's Coverage Question: "What are the frequentist properties of your interval? Does it have a coverage guarantee?"**
     - **Who:** A trialist or epidemiologist (frequentist-minded).
     - **Phrasing:** "We rely on confidence intervals because we know they cover the true value 95% of the time. What's the coverage of your interval? How do we know it's not too conservative or too liberal?"
     - **Damage:** Moderate to high because the audience cares about statistical properties and might dismiss the method if it lacks known coverage.
     - **Answer:** "Our interval is not a confidence interval in the frequentist sense. It's a set of upper bounds derived from a set of prior assumptions about the reporting rate. The coverage would depend on the true reporting rate and the true infection rate. However, we can say that by considering the worst-case reporting rate (1/4), we are being conservative. The interval is designed to capture the range of plausible upper bounds given the uncertainty in reporting. It's not intended to be a frequentist interval but a tool for sensitivity analysis. In fact, it's similar to a robust Bayes approach where we consider a set of priors. The key is that it transparently shows the effect of the uncertainty in reporting."
     - **Weakness:** The answer admits that we don't have a coverage guarantee, which might be unsatisfactory to frequentists.
     - **Concession:** We can concede that it doesn't have a fixed coverage, but argue that the problem is not amenable to a standard frequentist approach because of the unidentifiability (reporting rate and infection rate are confounded without additional data). This is a place to build credibility by acknowledging the limitation.

  5. **The Director's Actionability Challenge: "So what do I tell the manufacturer? And what do we do now?"**
     - **Who:** The unit director.
     - **Phrasing:** "This is interesting, but I have to write a letter and make a decision. Your analysis says it could be below or above the threshold. What do I do? And how do I explain this to the manufacturer?"
     - **Damage:** Moderate to high because if the director isn't convinced, the proposal dies.
     - **Answer:** "You tell the manufacturer that we have zero reported infections in 41 uses, but we know that our reporting system may miss up to three out of four infections. Therefore, the true infection rate could be as high as 29%, which is above our safety threshold. We are not able to conclude that the catheter is safe without making an assumption about the reporting rate. We recommend either gathering more data on the reporting rate (by improving our audit system) or, if we must decide now, we should err on the side of caution because the worst-case scenario is above the threshold. Alternatively, we could ask the manufacturer for evidence from other sites where reporting might be better. The key message is that our data is insufficient to clear the catheter because of the reporting gap."
     - **Weakness:** It forces a decision that might be conservative (pull the catheter) and the director might not want to do that without stronger evidence.
     - **Critical:** We must provide a clear path to action. We cannot leave it hanging.

  6. **The Bayesian's Second Challenge: "How do you choose the set for the reporting rate? Why [1/4, 1] and not something else?"**
     - **Who:** The other Bayesian (or the same one) or the philosopher.
     - **Phrasing:** "Your entire analysis hinges on the set you chose for the reporting rate. How did you pick [1/4, 1]? Why not [1/3, 1] or [1/10, 1]? This seems arbitrary. And if we change the set, we change the interval. So aren't you just replacing a point estimate with an arbitrary interval?"
     - **Damage:** Moderate because it challenges the input and might make the approach seem equally arbitrary.
     - **Answer:** "The set [1/4, 1] is based on the audit's best estimate of the reporting rate. It's a generous range reflecting our best knowledge. We could use a different set, and that's a strength: we can do sensitivity analysis. The point is to use a set that covers what we believe to be the plausible values. If we have more information, we can narrow the set. But until then, we use a range that we can justify. The advantage is that we are explicit about this assumption and can show how the conclusion changes if we change the set. In contrast, a point estimate would be even more arbitrary and we wouldn't see its effect."
     - **Weakness:** The choice of set is still subjective, and if the set is too wide, the interval may be too wide to be useful.
     - **Concession:** We can concede that the set is based on expert judgment and could be refined. We are not wedded to [1/4,1] and welcome input on it.

  7. **The Epidemiologist's Comparison to Standard Methods: "Why not just use the worst-case reporting rate and compute a conservative upper bound? That would be 29% and then we can act."**
     - **Who:** A trialist or epidemiologist.
     - **Phrasing:** "If the worst-case reporting rate is 25%, then we should just use that and compute a 95% upper bound for the true infection rate as if we had 0 events in 41/0.25 = 164 effective uses. That gives us about 1.8/164 ≈ 1.1%? Wait, no: if we assume that only 25% of infections are reported, then the observed zero corresponds to a true zero in 41 uses only if we are lucky. Actually, the true number of infections could be up to ... I'm confused. Anyway, why not just assume the worst-case and do a standard binomial upper bound?"
     - **Actual Calculation:** If the reporting rate is r, then the probability that an infection is reported is r. If we observe 0 reported infections, the likelihood is (1 - r * p)^41, where p is the true infection rate per use. The worst-case (highest p) would occur when r is the smallest (1/4). We can compute the upper bound for p by solving (1 - (1/4)*p)^41 = 0.05 (for a 95% upper bound). This gives p_upper ≈ 29% (as stated). So they are suggesting to just use that worst-case.
     - **Damage:** Moderate because it simplifies and provides a single number (29%) that is above the threshold, so they can act without the complexity.
     - **Answer:** "That is exactly what our set-based approach includes: the 29% is the upper bound when the reporting rate is 1/4. But the point is that we don't know that the reporting rate is 1/4. It might be higher. If the reporting rate is 1, then the upper bound is 7%. By only using the worst-case, you are making a very conservative decision that might lead you to pull a catheter that is actually safe. Our approach shows that the decision is on the knife-edge: if you believe the reporting rate is above about 50%, then the catheter is safe; if you believe it's below 50%, then it's not. That's a more nuanced and informative basis for decision than always assuming the worst. Moreover, it highlights the need to improve our reporting system to get a better estimate of r."
     - **Weakness:** The worst-case might be what they want for safety, and our approach might be seen as complicating a simple safety-first rule.
     - **Concession:** We can agree that the worst-case is one possible choice, but argue that we should be explicit about the assumption.

  8. **The Methodologist's Question: "How do you compute the set of posteriors in practice? Is this computationally feasible for our routine work?"**
     - **Who:** A methods-oriented epidemiologist or the biostatistician.
     - **Phrasing:** "This seems computationally intensive. We have to compute a set of posteriors for every possible reporting rate in [1/4,1]. How do you do that? And how do we integrate this into our existing workflow?"
     - **Damage:** Low to moderate because it's about practicality, which is solvable.
     - **Answer:** "For this problem, it's actually simple. The posterior upper bound for the true infection rate p, given a reporting rate r, is computed by noting that the likelihood of zero events is (1 - r*p)^41. We can solve for the upper bound of p at a given confidence level (e.g., 95%) by setting (1 - r*p)^41 = 0.05 and solving for p. This gives a function: p_upper(r) = (1 - (0.05)^(1/41)) / r. Then we evaluate this function at r=1/4 and r=1 to get the interval [7%, 29%]. We can plot p_upper as a function of r and show the interval. It's a one-line computation in R. So it's no more complex than the standard Clopper-Pearson interval."
     - **Weakness:** The simplicity is specific to this case (zero events). With non-zero events, it might be more complex, but still manageable.
     - **Concession:** None needed. This is a strength: it's easy.

  **The Dreaded Question:**
  We are scared of the Bayesian prior question (objection 1) and also the dilation question (objection 3). But there's one more:

  **The Philosopher's Epistemic Challenge: "Aren't you just replacing one unquantified uncertainty (the reporting rate) with another (the set of reporting rates)? How is that progress?"**
  - **Who:** The philosopher of statistics.
  - **Phrasing:** "You're objecting to a point estimate of the reporting rate because it's arbitrary. But then you choose an arbitrary set. How is that any better? You've just moved the arbitrariness from a point to an interval. And now your conclusion depends on that arbitrary interval. Isn't that the same problem?"
  - **Why dreaded?** It strikes at the heart of the justification for imprecise probability: that sets are more honest. But if the set is arbitrary, then the conclusion is arbitrary too.
  - **Answer:** "It is progress because the set is a more honest representation of our uncertainty. We know the reporting rate is between 1/4 and 1, but we don't know where. A point estimate would pretend we know. The set acknowledges the range of possibilities. Moreover, we can perform sensitivity analysis: if we change the set to [1/3,1], how does the conclusion change? That's something we cannot do with a point estimate. The key is that by using a set, we are forced to confront the arbitrariness and to communicate it. And that is crucial for decision-making because it shows that the decision hinges on this arbitrary choice. In contrast, a point estimate buries the arbitrariness and gives a false sense of precision."
  - **Blunt weakness:** The choice of set is still arbitrary and subjective, and the decision might depend critically on the bounds. We haven't eliminated arbitrariness, we've just made it more visible.

  **Concessions:**
  - **Concede early (to build credibility):** 
    - Objection 4 (Coverage): We can say, "You're right, our interval doesn't have a frequentist coverage guarantee. It's a different approach. But it does reflect our uncertainty honestly." This shows we understand the concern.
    - Objection 6 (Choice of set): "We chose [1/4,1] based on the audit, but we can adjust it if there's better information. The set is a way to encode what we know and don't know."
  - **Cannot concede:**
    - Objection 1 (Why not Bayesian?): We must defend the set approach as superior for transparency.
    - Objection 2 (Usefulness): We must show that the interval is useful for decision-making.
  - **The One Reply That Must Land:** The answer to the hierarchical Bayesian (Objection 1). We must convince them that the set approach is more transparent and avoids arbitrary prior choices. If we lose that, the proposal is dead.

  **Final Prep:**
  - Rehearse the answers for objections 1, 2, and the dreaded question.
  - Prepare a one-slide appendix with the R code for the computation to show it's easy.
  - Emphasize that the goal is not to avoid decisions but to make better-informed ones by highlighting the key uncertainty.
answer: |-
  Below is your prep sheet for the methods forum talk, structured around the eight most likely objections from this specific audience. I've ranked them by potential damage to your proposal, focusing on practical, methodological, and decision-making concerns. The objections are phrased as your audience would voice them (based on their roles), with concise answers designed for clarity and impact. I've noted where each answer is weakest, flagged concessions to build credibility, identified critical points you can't concede, and highlighted the one reply that must land. Finally, I'll address the dreaded question.

  ---

  ### **Ranked Objections (High to Low Damage)**

  1. **Objection: "Why not put a prior on the reporting rate and do full Bayesian inference? This set-based approach is just a half-baked approximation."**  
     - **Who:** The hierarchical Bayesian (e.g., "I build models like this daily—putting a hyperprior on the reporting rate gives a complete posterior and expected loss. Why reject that for an incomplete set?")  
     - **Damage Level:** High. Undermines your core methodology and appeals to the Bayesians and pragmatic epidemiologists. If unanswered, it frames your approach as inferior.  
     - **Two-Minute Answer:** "Because a prior on the reporting rate forces us to make an arbitrary choice the data can't inform. We have zero data on reporting rates—no historical studies, no validation—so any prior is a guess. Using a set avoids smuggling in that guess and shows exactly where the uncertainty lives: the 7% to 29% spread isolates the gap in our knowledge. If we used a prior, we'd get a precise-looking posterior that hides this. For a safety decision, that’s dangerous. We can act on the set with robust rules like gamma-maximin, without pretending the uncertainty vanishes."  
     - **Weakness:** Doesn't address that robust Bayes (e.g., with a prior class) can achieve similar goals. May feel evasive to those who see priors as flexible.  
     - **Critical:** Cannot concede—this is existential for your proposal.  
     - **Must-Land Reply:** This is the one that must land. Emphasize: **"Arbitrary priors hide uncertainty; sets expose it. For safety, we need transparency, not mathematical convenience."**

  2. **Objection: "Your interval is too wide to act on—it straddles the threshold. How is this practical for a decision?"**  
     - **Who:** Unit director or epidemiologist (e.g., "I need to write to the manufacturer. 'Maybe 7%, maybe 29%' is useless. Give me a clear 'pull' or 'keep'.")  
     - **Damage Level:** High. Questions real-world utility and risks losing the director's support.  
     - **Two-Minute Answer:** "The width isn't a flaw—it's the answer. It tells us the decision hinges entirely on reporting rate uncertainty, which we’d miss with a point estimate. We can still act: use gamma-maximin to minimize worst-case regret. Here, the worst case (29%) exceeds the threshold, so pulling the catheter avoids catastrophic risk. Crucially, this flags that improving reporting rates is urgent. If we collapse it to 7%, we risk ignoring underreporting and harming patients."  
     - **Weakness:** Gamma-maximin may seem overly conservative to some. Doesn't provide a "clean" decision.  
     - **Critical:** Cannot concede utility—defend the interval as actionable insight.  
     - **Concession Opportunity:** None—stand firm.

  3. **Objection: "Dilation—more data could widen your interval. How is that rational?"**  
     - **Who:** Philosopher of statistics (e.g., "In your framework, more zero-infection data might increase uncertainty. That violates basic rationality. How do you justify that?")  
     - **Damage Level:** High. Makes your method seem irrational to scientists and could derail discussion.  
     - **Two-Minute Answer:** "Dilation is a feature when uncertainty is structural. If we get more zeros, it doesn't resolve reporting gaps—so the interval honestly reflects that ambiguity. Hiding it with a point estimate would be irrational. For safety, we need methods that amplify uncertainty when data can't reduce it. Here, dilation signals we must fix reporting, not collect more infection data."  
     - **Weakness:** Dilation is counterintuitive and may alienate frequentists.  
     - **Critical:** Concede early to build credibility: **"It feels paradoxical, but it’s honest—I’ll share literature post-talk."** Then pivot to safety implications.  

  4. **Objection: "Why not use the worst-case reporting rate (1/4) and report 29%? That’s conservative and simple."**  
     - **Who:** Epidemiologist/trialist (e.g., "Regulators understand conservative bounds. Why overcomplicate with sets when we can assume worst-case capture?")  
     - **Damage Level:** Moderate. Resonates with pragmatists and could simplify you out of the conversation.  
     - **Two-Minute Answer:** "Because worst-case is arbitrary too—it might over-penalize a safe device. If reporting is actually 80%, the true rate is likely under 10%, and pulling it wastes resources. Sets show the tipping point: if reporting is above 50%, we keep it; below, we pull. That’s richer for decisions and pushes us to reduce uncertainty. Worst-case alone doesn’t tell us how close we are to the threshold."  
     - **Weakness:** Worst-case is entrenched in safety contexts. Your approach may seem nuanced but slower.  
     - **Concession Opportunity:** Concede early: **"Worst-case is one edge of our set—we include it, but the full interval shows why it’s not the whole story."**  

  5. **Objection: "Where’s the coverage? Your interval isn’t calibrated like a confidence interval."**  
     - **Who:** Epidemiologist/trialist (e.g., "I care about long-run error rates. Does your interval cover the truth 95% of the time? If not, it’s not reliable.")  
     - **Damage Level:** Moderate. Frequentists dominate the room—this could dismiss your method as unrigorous.  
     - **Two-Minute Answer:** "Coverage doesn’t apply here—this is about uncertainty decomposition, not repeated sampling. The reporting rate is a fixed, unknown nuisance parameter. Sets show how it affects inference. For calibration, we can simulate scenarios: if reporting is 25%, our 29% bound is conservative; if 100%, 7% is accurate. But a single confidence interval would falsely assume perfect reporting."  
     - **Weakness:** Admits your method isn’t frequentist, which may dissatisfy.  
     - **Concession Opportunity:** Concede early: **"You’re right—it’s not a confidence interval. But for this problem, coverage can’t address unidentifiable uncertainty."**  

  6. **Objection: "How do you choose the reporting set? Why [1/4, 1] and not [1/3, 1]? It’s still arbitrary."**  
     - **Who:** Philosopher or Bayesian (e.g., "Sets replace point-arbitrariness with interval-arbitrariness. How is that progress?")  
     - **Damage Level:** Moderate. Challenges the foundation of imprecise probability.  
     - **Two-Minute Answer:** "The set is based on audit data—it’s our best expert estimate. But you’re right: we should test sensitivity. If we use [1/3, 1], the upper bound range becomes 7%–22%. Still, the threshold is in that range, so the decision ambiguity holds. Sets make this sensitivity explicit; a point estimate buries it."  
     - **Weakness:** Still subjective, and sensitivity testing may not satisfy purists.  
     - **Critical:** Cannot concede—defend the set as auditable and improvable.  

  7. **Objection: "This is too complex for committees/manufacturers. How do you communicate it?"**  
     - **Who:** Unit director (e.g., "I need a number for the report. How do I explain 'sets' to admins or manufacturers?")  
     - **Damage Level:** Moderate. Risks rejection over practicality.  
     - **Two-Minute Answer:** "We don’t say 'credal sets'—we say: 'Data shows zero infections, but our reporting is fuzzy. If reporting is good, risk is low (7%); if bad, it’s high (29%). Since we don’t know, the cautious move is to pull. But here’s the key: if you believe reporting is better than 50%, keeping it is defensible.' That’s clearer than a fake-precise 7%."  
     - **Weakness:** Still more complex than a single number.  
     - **Concession Opportunity:** Concede early: **"We can simplify the message—focus on the bounds and the tipping point."**  

  8. **Objection: "Why not use a bias-adjusted frequentist method? We have tools for imperfect data."**  
     - **Who:** Epidemiologist (e.g., "We use capture-recapture for underreporting. Why reinvent the wheel?")  
     - **Damage Level:** Low. Familiar alternatives could sideline your approach.  
     - **Two-Minute Answer:** "Capture-recapture needs overlapping samples—we don’t have that here. Bias adjustments often assume known biases, which we don’t have. Sets are a natural fit: they quantify how ignorance propagates. Plus, they work for decisions without needing new data."  
     - **Weakness:** Ignores that some frequentist methods handle partial identifiability.  
     - **Concession Opportunity:** None—show sets as complementary.  

  ---

  ### **The Dreaded Question**
  **Question: "Isn't this just a fancy way to avoid decisions? At least Bayes gives an answer."**  
  - **Who:** Unit director or Bayesian (e.g., "We pay you to solve problems, not describe them. Hierarchical Bayes gives a posterior we can act on—even if it's wrong, it's actionable. Your sets feel like academic hand-waving.")  
  - **Why Dreaded:** It frames your method as indecisive and impractical, resonating with decision-makers.  
