prompt: |-
  Act as a senior political philosopher who works on the ethics of migration and on theories of political legitimacy, and who has sat through more faculty workshops than they can count. Think carefully before answering, and follow the structure I specify at the end.

  Next Thursday I present a paper to a joint session of my law school's immigration-law workshop and the university's political theory reading group. My thesis is an asymmetry claim about the right to exclude, which I will call the rate/composition asymmetry:

  1. If a political community has any entitlement with respect to borders at all, it is an entitlement over the terms and tempo of association, not over the relative standing of persons. Self-determination is exercised over arrangements; it is not a license to rank.
  2. A numerical cap regulates tempo. It is impersonal, it applies identically to everyone in the queue, and the cost it imposes takes the form of delay rather than of judgment.
  3. Composition selection — preferences by skill, education, wealth, religion, or national origin — is not a regulation of tempo but a public ranking of persons issued by the polity, and it is exactly what premise 1 removes from the state's competence.
  4. Hence a state may cap but may not select. Moreover, the cap is legitimate only where it is set transparently, is revisable, and is paired with a duty to mitigate the conditions that generate the demand to move; and it is defeated outright by claims of necessity.

  The audience is specific, and the objections will track the composition of the room. There are (a) two communitarians in the Walzerian tradition who hold that membership and the value of a shared political culture license selection just as much as numbers, and who think my premise 1 is question-begging; (b) a Kantian scholar of cosmopolitan right who maintains that turning a stranger away is permissible only where refusal does not bring about that stranger's ruin, and who will insist that a cap is mass refusal by another name; (c) an empirical migration scholar who studies actual admissions systems and will press feasibility and self-defeat, since points systems, family reunification rules, and asylum triage all look like selection, and since a flat ban on selection may simply push states to cap more harshly; and (d) a postcolonial and critical race theorist who doubts that the right to exclude is a coherent frame in the first place and will argue that a cap is a ranking in disguise.

  On point (d): I argued this with a friend for two hours last night, and he belongs squarely in that camp. His parting shot was that I have not located a principled line between regulating tempo and ranking persons, only a line between rankings I find distasteful and rankings that operate through a queue — because a first-come, first-served line sorts people by date of birth, by geographic proximity, and by who can afford a smuggler. Assume that objection lands somewhere in the room.

  What I want is a Q&A prep sheet, not a defense of the paper and not a rewritten argument:

  - Open with a short brainstorming section of six to eight lines: identify the load-bearing premises above, match each to the person in the room most likely to attack it, and note which premises I could revise without surrendering the asymmetry itself.
  - Then give me the seven or eight objections I will actually face, ordered by how much damage each would do if I answered it badly, with a rough likelihood attached. For each one: name who raises it; phrase it in one or two sentences the way that person would phrase it, in their idiom and with their priorities rather than mine; supply a reply I can deliver in about ninety seconds of speech; state plainly whether I should concede part of it or hold; and add one line flagging the softest point in that reply, meaning where a competent follow-up press will hurt me.
  - Include the question I am hoping nobody asks, and explain why it is worse than the others.
  - Close with the two or three sentences of pre-emptive concession I should build into the opening of the talk so that the most damaging objections lose their surprise value.

  Constraints: no bibliography, no reading list, no citations — I know the literature and will have nothing to check during the talk. No strawmen: every objection should be the strongest version its proponent would recognize as theirs. Keep the whole thing tight enough that I can reread it in the ten minutes before I walk in.
reasoning: |-
  Okay, the user is asking me to act as a senior political philosopher specializing in migration ethics and political legitimacy. They're preparing for a workshop presentation on their "rate/composition asymmetry" thesis about border control rights. They want a Q&A prep sheet structured very specifically.

  First, I need to understand their core argument: states can cap immigration numbers but not select based on characteristics because caps regulate tempo while selection involves ranking persons. This is presented as an asymmetry claim with four premises. The audience includes (a) Walzerian communitarians, (b) a Kantian cosmopolitan, (c) an empirical migration scholar, and (d) a postcolonial/CRT scholar.

  The user wants me to start with brainstorming: identify load-bearing premises, match critics, and note revisable elements. Premise 1 (self-determination as arrangement-not-ranking) seems absolutely crucial and will be attacked by the communitarians. Premise 2 (caps as impersonal tempo regulation) is vulnerable to the CRT scholar's queue-critique. Premise 4 (mitigation duty/necessity exception) might be adjustable without collapsing the asymmetry.

  For objections, I need to prioritize by potential damage and likelihood. The CRT scholar's queue-as-ranking objection seems most dangerous - it directly challenges the tempo/ranking distinction. The Kantian's "cap-as-mass-refusal" comes next, then communitarian objections. Each needs phrasing in the objector's idiom, plus a 90-second reply with concession advice and vulnerability flags.

  The "question nobody asks" should be about whether capped systems inherently privilege certain groups through procedural barriers - this could unravel the entire impersonal/tempo framing. For pre-emptive concessions, I should suggest acknowledging that first-come-first-served queues aren't perfectly neutral and that selection occurs in asylum systems.

  Throughout, I'll maintain tight structure: no citations, no strawmen, keeping it concise enough for pre-talk review. The tone should reflect senior workshop experience - anticipating where blood will be drawn in the argument.
answer: |-
  ### Q&A Prep Sheet: Rate/Composition Asymmetry

  **Brainstorming: Load-Bearing Premises & Critics**
  - **Premise 1 (Self-determination = arrangements, not ranking):** Core load-bearing beam. Attacked by **(a) Walzerians** (denies community’s right to shape identity) and **(d) CRT scholar** (rejects "arrangements" as neutral). *Revisable?* Could soften "not a license to rank" to exclude extreme threats, but asymmetry survives.
  - **Premise 2 (Cap = impersonal tempo regulation):** Attacked by **(d) CRT** (queues mask material rankings) and **(b) Kantian** (delay = refusal). *Revisable?* Clarify "impersonal" ≠ equitable; admit temporal injustice but defend *form* as distinct from explicit hierarchy.
  - **Premise 3 (Composition = public ranking):** Attacked by **(a) Walzerians** (selection *is* cultural self-definition) and **(c) Empiricist** (ignores functional necessities like skills). *Revisable?* No – this *is* the asymmetry.
  - **Premise 4 (Cap legitimacy conditions / necessity):** Attacked by **(b) Kantian** (delay *causes* ruin) and **(c) Empiricist** (mitigation unrealistic). *Revisable?* Yes – weaken "duty to mitigate" to "obligation to consider root causes" without collapsing asymmetry.

  ---

  **Objections Ranked by Damage Potential (High to Low)**
  *(Likelihood: High/Very High/Moderate)*

  1.  **Objector: (d) CRT / Postcolonial Scholar**  
      *Phrased:* "Your tempo/composition distinction collapses because *all* caps are rankings: first-come-first-served favors the physically proximate, the born-lucky, or those rich enough to hire smugglers. Calling it 'tempo' just launders racial and class hierarchy through time."  
      **Reply:** "You're right that queues aren't neutral; temporal priority *can* reflect prior injustice. But the *moral structure* differs: a cap sets a pace, however flawed its implementation. Selection issues a *judgment*: 'We prefer engineers to farmers.' The former regulates *when*; the latter dictates *who deserves* admission. The state lacks standing for the latter."  
      *Concede?* Partly – admit queues can entrench privilege. *Hold?* The formal distinction in state action.  
      **Soft Spot:** "If temporal queues encode bias, why isn't regulating 'when' still a substantive judgment about worth?"

  2.  **Objector: (b) Kantian Cosmopolitan**  
      *Phrased:* "A numerical cap isn't benign tempo regulation; it's the mass refusal of entry to strangers, many of whom face destitution or persecution. If turning away one person in peril is impermissible, how is turning away thousands via a cap any different? Your 'delay' *is* ruin."  
      **Reply:** "Your focus on harm is vital. But a cap isn't refusal *simpliciter*; it's conditional on capacity, coupled with a duty to mitigate push factors and overridden by necessity. Refusing *one* drowning migrant is active harm; a cap sets a process acknowledging scarcity while demanding systemic responsibility. The difference is between categorical exclusion and regulated flow under constraints."  
      *Concede?* Partly – caps *can* cause ruin if set inhumanely. *Hold?* Caps *can* be structured progressively; selection is inherently discriminatory.  
      **Soft Spot:** "Doesn't a harsh cap 'actively' cause ruin just like refusal? Where's the line?"

  3.  **Objector: (a) Walzerian Communitarian**  
      *Phrased:* "Premise 1 simply assumes what it needs to prove: that self-determination doesn't include defining who *we* are. But membership is constitutive! A community must be able to prioritize, say, co-linguists or those sharing its core values to sustain the very culture your 'arrangements' presuppose. Why is selecting for cohesion ranking but capping numbers isn't?"  
      **Reply:** "Sustaining a culture is about *how* we live together – the arrangements. Selecting based on origin or belief *attributes* worth to individuals based on group identity, turning the state into an arbiter of comparative value. Protecting a language can be done via residency rules or education funding, not by excluding Spanish speakers at the border. Self-determination governs practices, not pedigrees."  
      *Concede?* Hold.  
      **Soft Spot:** "If a community overwhelmingly wants to preserve ethnic homogeneity as core to its identity, isn't rejecting that a prior ranking *against* their self-understanding?"

  4.  **Objector: (c) Empirical Migration Scholar**  
      *Phrased:* "Banning *all* selection is naive. States *need* family reunification (is prioritizing granny over a stranger 'ranking'?), skills-based points (responding to labor shortages), and asylum triage (prioritizing urgency). Forbidding this won't end selection; it will just lower caps drastically or push criteria underground into corrupt visa processes – making things *worse*."  
      **Reply:** "Practical concerns are real, but we must distinguish. Family reunification responds to *existing associative ties* created by prior admission or citizenship – it’s relational, not ranking inherent worth. Asylum triage assesses *immediacy of harm*, not the person's value. Skills-based selection *is* impermissible ranking; states should address labor needs through training or temporary visas without permanent status hierarchy. Yes, imperfect implementation is a risk, but we shouldn't enshrine discrimination."  
      *Concede?* Partly – distinguish family/urgent protection from skills/wealth. *Hold?* Core prohibition on selection by ascribed or economic value.  
      **Soft Spot:** "Won't states just set caps so low that *any* admission system becomes de facto selection by desperation, defeating your goal?"

  5.  **Objector: (a) Second Walzerian / (c) Empiricist**  
      *Phrased:* "Isn't your 'duty to mitigate conditions' utopian? How can Norway be responsible for drought in Sudan? And doesn't this open an unlimited claim, negating any cap?"  
      **Reply:** "The duty isn't unlimited liability. It's a contributory obligation: states benefiting from global order must aid development, support climate adaptation, and avoid policies (like resource extraction or arms sales) that fuel displacement. It sets a framework for setting the cap *responsibly*, not an open-ended demand. Failure here undermines the legitimacy of *any* restriction."  
      *Concede?* Partly – scope is complex, "duty" may be too strong. *Hold?* Cap legitimacy requires engagement with root causes.  
      **Soft Spot:** "What specific, actionable obligations does this impose on Norway *today* regarding Sudan, and how is compliance measured?"

  6.  **Objector: (b) Kantian / (d) CRT**  
      *Phrased:* "You say necessity defeats the cap. But doesn't this just reintroduce selection at the back door? Who decides what 'necessity' means? Isn't this discretionary humanitarianism, the very ranking you decry?"  
      **Reply:** "Necessity here isn't discretionary selection; it's a categorical override when refusal means certain death or similar extreme harm, regardless of *who* the person is. It's based on the *severity of consequence*, not the *attributes* of the claimant. The threshold is high and universal."  
      *Concede?* Hold the principle.  
      **Soft Spot:** "In practice, doesn't assessing 'certain death' require judging the claimant's credibility and context, creating space for bias?"

  7.  **Objector: General (Likely Law Scholar)**  
      *Phrased:* "How does this asymmetry handle asylum? Prioritizing refugees over economic migrants seems like selection. Is your system first-come-first-served for *all*, collapsing vital protection distinctions?"  
      **Reply:** "Asylum is distinct. Non-refoulement is a negative duty (don't return to persecution) triggered by individual circumstance, not a positive selection. Admission for asylum-seekers responds to this duty based on *threat assessment*, not ranking inherent worth. A cap applies to general immigration channels; asylum claims are assessed separately based on protection needs, not counted against a general cap."  
      *Concede?* Clarify, not concede.  
      **Soft Spot:** "Doesn't 'threat assessment' inevitably involve judging the *value* (credibility, severity) of different claims?"

  ---

  **The Question I Hope Nobody Asks:**  
  "**If a capped, first-come-first-served system inevitably advantages those with resources and proximity due to historical injustice (colonialism, global inequality), isn't your 'impersonal tempo' framework just endorsing a system where the state *knowingly* replicates and benefits from that prior ranking? Doesn't this make the state complicit in the very hierarchies your asymmetry claims to avoid?**"  
  *Why Worse?* It directly attacks the *moral coherence* of the tempo/composition distinction by arguing that "regulating tempo" within an unjust global structure *is itself* an act of substantive ranking and complicity. It forces a confrontation with whether *any* border control can be legitimate under current global conditions, potentially collapsing the entire project. It blends the damning critiques of (d) and (b) into one.

  ---

  **Pre-emptive Concessions for Opening:**  
  "This asymmetry does *not* claim capped systems are perfectly just. Queues can entrench global inequities – proximity and wealth often determine place in line. Nor does it dismiss the profound challenges states face; managing flows *is* complex. The core claim is simpler: that *deliberately selecting individuals based on ascribed or economic worth* crosses a distinct moral line that regulating the *pace* of admission, however imperfectly, does not. We must confront the injustices in *how* tempo is regulated, but that doesn't license explicit ranking."
