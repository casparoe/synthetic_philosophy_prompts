  We are creating a triage sheet for editors to quickly classify papers regarding the psi-ontic/psi-epistemic distinction in quantum foundations. The sheet must be based on the abstract and introduction and take about 25 minutes. The goal is to route papers to the specialist when necessary and to avoid making incorrect classifications.

  The current sheet has several flaws, which we will diagnose and correct. We will design a new sheet with clear questions and routing instructions.

  Diagnosis of the current sheet:

  Step 1: This step uses the author's language (e.g., "knowledge", "real") to classify. However, the technical definitions of psi-ontic and psi-epistemic are about the structure of the ontological model (disjoint vs. overlapping distributions). Authors might use non-standard terminology or be imprecise in their language. For example, a psi-ontic model might still be described in epistemic terms if the author is focusing on the knowledge aspect of the quantum state in a different sense. This step is unreliable and should be avoided.

  Step 2: The PBR theorem does refute a broad class of psi-epistemic models under the preparation independence assumption. However, the step says that any psi-epistemic proposal without explicit rejection of preparation independence is internally inconsistent. This is too strong because:
     - The paper might be proposing a model that violates preparation independence without explicitly stating so (if they don't mention PBR at all, we cannot assume they are unaware of the issue).
     - There are other ways to avoid PBR (e.g., by having a non-separable ontic space or by violating the other assumptions of PBR). Also, the paper might be about a restricted setting (like a single qubit) where PBR does not apply.

  Step 3: This step confuses measurement contextuality with the Kochen-Specker theorem. The Kochen-Specker theorem rules out noncontextual models for outcomes (i.e., models where the outcome of a measurement is determined by the ontic state and the observable, regardless of how the observable is measured). But a psi-epistemic model can be contextual and hence avoid Kochen-Specker. However, the step correctly notes that a noncontextual psi-epistemic model is ruled out by Kochen-Specker (or more precisely, by the Bell-Kochen-Specker theorems). But note: the Kochen-Specker theorem is about noncontextuality for deterministic hidden variables, while in ontological models, response functions can be stochastic. The main issue here is that the step is too simplistic: it assumes that if the model is psi-epistemic and noncontextual, then it is ruled out, but the converse (if psi-epistemic and contextual, it survives) is not a guarantee because there might be other no-go theorems. Moreover, the step does not account for the fact that a model might be context-dependent in a way that is not captured by the Kochen-Specker theorem.

  Step 4: This step incorrectly links the ontic/epistemic classification to realism vs. anti-realism. A psi-ontic model does not necessarily commit to realism about all observables (e.g., in Bohmian mechanics, only position is real, and other observables are contextual). Similarly, a psi-epistemic model might be realist about the underlying ontic states. The ontic/epistemic distinction is about the nature of the quantum state, not about realism in general.

  Step 5: This step says that if a paper denies the ontic state space, then it is psi-epistemic by default. However, the ontological models framework is the basis for the distinction. If a paper rejects that framework, then the distinction does not apply. Such papers should be routed to the specialist because they are challenging the framework itself.

  New Triage Sheet:

  We design a set of questions that are to be asked in order. The goal is to classify the paper as clearly psi-ontic, clearly psi-epistemic, or to route to the specialist. We also want to flag cases that are outside the standard framework.

  The sheet:

  1. **Does the paper explicitly reject the ontological models framework (i.e., does it deny the existence of an ontic state space Lambda)?**
     - *Yes*: Route to specialist. (The paper is challenging the basis of the distinction.)
     - *No*: Proceed to step 2.
     - *Unclear*: Route to specialist.

  2. **Does the paper propose an ontological model (with Lambda, preparation distributions, response functions) for at least one quantum system?**
     - *No*: Route to specialist. (The paper might be purely conceptual or about a different framework. We need a model to classify.)
     - *Yes*: Proceed to step 3.

  3. **Does the model cover a system of at least two non-trivially interacting subsystems? (If the paper only considers a single system or non-interacting systems, then note that PBR might not apply.)**
     - *No*: Proceed to step 4 with the note that the model is for a restricted system (so PBR is not directly applicable).
     - *Yes*: Proceed to step 4.

  4. **Does the paper explicitly claim that the model is psi-ontic (i.e., for every pair of distinct pure states, their distributions have disjoint support) or psi-epistemic (i.e., at least one pair of distinct pure states has overlapping distributions)?**
     - *Yes, and the claim is well-defined*: Then take the author's classification unless step 5 or 6 overrides (but note: we are only using the abstract and intro, so we rely on what the author says). Then proceed to step 5 to check consistency with no-go theorems.
     - *No, or unclear*: Proceed to step 5 to try to infer.

  5. **Check for consistency with known no-go theorems:**
     a. **If the model is for a system of two or more subsystems:** Does the paper address the Pusey-Barrett-Rudolph (PBR) theorem? 
          - If the model is claimed to be psi-epistemic and the paper does not mention PBR or does not explicitly reject preparation independence (or any other assumption of PBR), then route to specialist. (Because without addressing PBR, the model might be inconsistent, but we are not experts to judge. Alternatively, the model might be for a restricted system that avoids PBR, but if the system has two or more subsystems, then PBR applies and must be addressed.)
          - If the model is psi-ontic, then PBR is not a threat, so no issue.
          - If the paper explicitly rejects an assumption of PBR (like preparation independence), then the model might be consistent. Proceed to step 6.

     b. **Does the model claim to be measurement noncontextual?** (i.e., the response functions depend only on the observable being measured, not on the context of how it is measured.) 
          - If the model is psi-epistemic and noncontextual, then it is ruled out by Bell-Kochen-Specker (for systems of dimension at least 3) or by other theorems (like Bell's theorem for nonlocality, but note noncontextuality is a local condition). Therefore, such a model would be inconsistent. If the paper does not address this, then route to specialist.
          - If the model is contextual or psi-ontic, then noncontextuality theorems are not an immediate threat.

     Note: If the model is for a single system (so step 3 was "no") and the model is psi-epistemic, then noncontextuality might still be an issue for systems of dimension>=3. But if the system is a qubit (dimension 2), then the Kochen-Specker theorem does not apply. So:

