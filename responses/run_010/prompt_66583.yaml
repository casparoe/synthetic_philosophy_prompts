answer: |-
  ### Corrected Triage Sheet  
  *(Usable by non-specialist editors; fits on one page)*  

  **Instructions:**  
  - Answer questions in order.  
  - If "route to specialist" is triggered, stop and route immediately.  
  - Draw conclusions only as specified. Do not extrapolate.  
  - Time limit: 25 minutes (abstract/intro only).  

  ---

  1. **Does the paper explicitly propose an ontological model?**  
     - *Sufficient answer:* Yes if it describes a space of ontic states (Λ), preparation distributions, and measurement response functions.  
     - **Route to specialist** if:  
       - It denies Λ exists (e.g., "no ontic state space").  
       - No model is proposed (e.g., conceptual arguments only).  
     - *Conclusion:* If yes → proceed to 2. If no/unclear → route to specialist.  

  2. **Does the model cover composite systems?**  
     - *Sufficient answer:* Yes if it involves ≥2 subsystems (e.g., multiple qubits).  
     - **Route to specialist** if: The scope is unclear (e.g., "systems" undefined).  
     - *Conclusion:*  
       - Composite? → Note for step 4.  
       - Single system only? → Skip PBR checks in step 4.  

  3. **What is claimed about the quantum state?**  
     - *Sufficient answer:* Ignore vague terms ("real," "knowledge"). Focus on structural claims:  
       - "Distributions for distinct pure states overlap" → psi-epistemic.  
       - "Distributions for distinct pure states have disjoint support" → psi-ontic.  
     - **Route to specialist** if:  
       - No explicit claim.  
       - Claims conflict (e.g., "overlap but disjoint").  
     - *Conclusion:*  
       - Psi-ontic? → proceed to 4 (no further checks).  
       - Psi-epistemic? → proceed to 4.  

  4. **For psi-epistemic claims: Are no-go theorems addressed?**  
     - *Check only if model is explicitly psi-epistemic.*  
     - **PBR check** (if composite systems):  
       - Does the paper reject *preparation independence*?  
         - Yes → no issue.  
