     Revised step 5:

     a. **PBR check (only if the system has two or more subsystems and the model is psi-epistemic):** 
          - If the paper does not mention PBR and does not explicitly reject one of its assumptions (like preparation independence), then route to specialist. (Because PBR is a major no-go theorem that applies to such systems and must be addressed.)
          - If the paper addresses PBR (by rejecting an assumption or by arguing why it doesn't apply), then no issue.

     b. **Noncontextuality check (only if the model is psi-epistemic and for a system of dimension>=3):**
          - If the paper explicitly claims the model is noncontextual and does not address the Kochen-Specker theorem (or other relevant no-go theorem), then route to specialist.
          - If the paper does not claim noncontextuality, or if it claims contextuality, or if it addresses the Kochen-Specker theorem, then no issue.

     If the model is psi-ontic, then these no-go theorems are not a threat (though note that for noncontextuality, a psi-ontic model can still be contextual or noncontextual, but noncontextual psi-ontic models are not ruled out by Kochen-Specker).

  6. **If the paper does not explicitly classify the model, can we infer the classification from the description?**
     - Look for statements about the support of the distributions for pure states. For example, if the paper says that two distinct pure states have overlapping distributions, then it is psi-epistemic. If it says that each pure state has a distribution with support disjoint from any other pure state, then it is psi-ontic.
     - If the paper only gives an example for a single qubit and claims that the distributions for two states overlap, then it is at least psi-epistemic for that qubit. But note: the paper might only be about a single qubit, so we cannot conclude about the full quantum theory.

     However, we are only reading the abstract and introduction. If the classification is not explicit and we cannot infer it from the given information, then we must route to the specialist.

     This step is a judgment call. The editor should look for clear statements about the structure of the distributions. If not found, route to specialist.

  7. **If we have a classification (psi-ontic or psi-epistemic) and no routing to specialist in step 5, then we can assign the paper to that camp. But note: the paper might be about a model that is only for a fragment of quantum theory (like a single qubit). We cannot conclude that the model is psi-epistemic for the whole of quantum theory. This is a limitation of the sheet.**

