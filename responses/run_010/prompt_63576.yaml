  9. The ending: She realizes her error (trusting Thorne and not verifying the termination) and that she has licensed an atrocity. The story ends with her reporting the violation, but the damage is done. The facility will be shut down, but the suffering that occurred under her approval cannot be undone.

  Now, writing the story.

