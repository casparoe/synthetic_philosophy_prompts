prompt: |-
  So I help run a tiny philosophy podcast out of my department — two of us, we record in a seminar room with a mic that is absolutly terrible, and we mostly invite people whose work we're already reading for seminars anyway. Next month's guest is a metaphysician working on laws of nature. She's a Humean, roughly in the Lewis best-system tradition, but her version is idiosyncratic enough that I can't just crib the standard set of objections off the internet, and my cohost's plan is to ask "but isn't that kind of deflationary?" and then nod for twenty minutes. I'd like to do better.

  Her view, as far as I can tell from the manuscript she sent over: instead of trading off simplicity against strength over systems that axiomatize the mosaic of local matters of fact, she ranks candidate systems by how much of the mosaic a fixed idealized reasoner can reconstruct from the axioms within a bounded number of inference steps. She calls the optimal trade-off curve the "reconstruction frontier," and the systems sitting on it are the ones that state the laws. Two commitments I especially want to press: (a) she thinks this makes lawhood relative to a reasoner's capacities without making it mind-dependent in any objectionable sense, because the frontier allegedly converges across all bounded reasoners above some competence threshold; and (b) she claims her version is immune to the undermining worry — the old complaint that Humean laws can assign high probability to histories whose own best system says something different — on the grounds that undermining worlds simply aren't reconstructible from the axioms in the relevant way.

  Write me eight to ten interview questions, each with a one-or-two-line follow-up keyed to the answer she's most likely to give. Things I want covered, roughly one question apiece: the convergence claim and what would count as its failing (what if a reasoner with much bigger working memory gets a visibly different frontier — does she bite the bullet that the laws differ, or posit a canonical reasoner, and if so on what non-arbitrary grounds?); whether specifying an "idealized reasoner with bounded inference steps" smuggles in nomic or lawlike notions, so that she's answered the circularity complaint against the best-system account only to reintroduce it one level up; what her view says about lawhood in a universe with no cognizers in it, including the first few hundred million years of ours; and a question that lets her take on the governing/explanation objection in her own terms and then presses whether "unification for a bounded reasoner" is a claim about the world or a claim about us. I'd also like one on whether the frontier can be flat enough that lawhood comes out vague, and whether she welcomes that or thinks it's a cost; one on whether her account says anything different from vanilla Lewisian best-system about actual cases — ideally forcing her to name one candidate law that one account admits and the other doesn't, including ceteris paribus laws in the special sciences; and a closing question she genuinely cannot answer by restating the view. For the follow-ups, tell me what reply you're anticipating so I can see why the follow-up bites. Keep each question to something she could actually answer in two or three minutes of speech rather than a five-part essay prompt, don't strawman her — I want questions she'd agree are fair — and skip the generic warmup stuff; if you give me an opener make it substantive but low-stakes, something that gets her stating the frontier idea without a lecture. Also nothing that depends on her having read some particular paper, since I'll be asking these on wether or not I've got the citations right.
reasoning: |-
  Okay, the user runs a small philosophy podcast and needs help preparing for an interview with a metaphysician who has a unique Humean view on laws of nature. Her approach modifies Lewis's best-system account by introducing a "reconstruction frontier" based on what an idealized reasoner with bounded inference steps can reconstruct from the axioms. 

  First, I need to understand her key commitments: (a) lawhood is relative but converges across competent reasoners, avoiding mind-dependence; (b) her view avoids the undermining problem because undermining worlds aren't reconstructible. The user wants pointed questions targeting these, plus circularity, laws in empty universes, governing/explanation, vagueness, actual case differences, and a genuinely unanswerable closer.

  Breaking down the requested coverage:
  - Convergence: What if high-memory reasoners get different frontiers? Forces a choice between relativism or arbitrary canonization.
  - Circularity: Does specifying "idealized reasoner" smuggle in nomic notions? Presses if the account is covertly circular.
  - Empty universe: How does lawhood work pre-cognizers? Tests if cognition is merely heuristic or constitutive.
  - Governing/explanation: Does "unification for bounded reasoners" describe the world or us? Challenges ontological commitment.
  - Vagueness: Could a flat frontier make lawhood vague? Probes tolerance for indeterminacy.
  - Actual cases: Demands a concrete example where her view diverges from Lewis's, especially on special-science laws.
  - Unanswerable closer: Something she can't resolve by restating, like why boundedness is fundamental.

  For follow-ups, I anticipate her likely defenses: Convergence might invoke asymptotic stability; circularity might distinguish procedural from nomic ideals; empty universe might claim laws are dispositional for possible reasoners; governing might dodge by redefining explanation. The follow-ups should expose tensions in these replies without strawmanning.

  Questions must be concise (2-3 min answers) and citation-free. Skip softballs—opener should be substantive but easy, like asking her to contrast her view with Lewis's in simple terms. Avoid multipart traps; each query should have a single thrust. 

  The closing question about why boundedness matters could stump her because it challenges a foundational assumption without an obvious Humean answer. She might retreat to pragmatism, but that risks conceding the view isn't about mind-independent structure.

  User's tone suggests they want rigorous but collegial engagement. No gotchas—questions should feel fair to the guest. I'll structure around 8-10 questions hitting all requested angles, with follow-ups that tighten the screws gently.
answer: |-
  Here are 8 substantive, citation-independent questions targeting her unique commitments, designed for clarity and follow-up. Each question is concise, avoids strawmanning, and anticipates her likely reply to sharpen the follow-up.

  1.  **Opener/Contrast:** "To help orient our listeners familiar with Lewis, could you briefly explain how your 'reconstruction frontier' differs from the standard Lewisian trade-off between simplicity and strength?"
      *   *Likely Reply:* She'll contrast her bounded-reasoner reconstruction limit with the unbounded simplicity/strength optimization.
      *   *Follow-Up:* "Does this shift mean the laws fundamentally depend on *epistemic constraints* (what we can compute) rather than purely on the mosaic itself?"

  2.  **Convergence Claim (What if it Fails?):** "You argue that the reconstruction frontier converges for any bounded reasoner above a competence threshold. What would falsify this convergence claim? Specifically, if we imagined a reasoner with vastly larger, but still bounded, working memory getting a *visibly different* frontier for the same mosaic, what would your view entail?"
      *   *Likely Reply:* She'll likely insist convergence holds asymptotically or posit a canonical reasoner capacity.
      *   *Follow-Up:* "If you posit a canonical reasoner capacity, isn't that choice arbitrary? What non-arbitrary, non-epistemic feature of the mosaic determines *which* bounded capacity sets the laws?"

  3.  **Circularity/Smuggling Nomic Notions:** "Specifying the 'idealized reasoner' involves choices about their inference rules or computational primitives. Couldn't this specification *itself* presuppose notions of lawlikeness or nomic possibility? For example, doesn't defining 'valid inference step' rely on logical laws, which might themselves be candidates for systematization?"
      *   *Likely Reply:* She might distinguish procedural/epistemic rules (logic, math) from substantive nomic laws, claiming the former are presupposed but not part of the system being ranked.
      *   *Follow-Up:* "But if the reasoner's 'bounded steps' are defined using rules (like modus ponens) that *look* lawlike, haven't you just pushed the circularity worry up a level, making the *framework* for defining laws depend on prior lawlike regularities?"

  4.  **Lawhood in an Empty Universe:** "Your account centers on what a bounded reasoner *can reconstruct*. In a universe with no cognizers (like ours for its first billion years), or a possible universe where cognitive agents are physically impossible, in what sense do laws exist? Are they merely *dispositional* facts about what *would be* reconstructible *if* a suitable reasoner existed?"
      *   *Likely Reply:* She'll likely endorse the dispositional account: laws are facts about what systems *would be* optimally reconstructible by any possible bounded reasoner meeting the threshold.
      *   *Follow-Up:* "Doesn't this dispositional fact itself seem like a *modal* or *nomic* fact about the universe? Is the account ultimately grounding laws in a counterfactual about ideal reasoners, rather than the mosaic alone?"

  5.  **Governing/Explanation - World or Us?:** "You position your view as avoiding problematic mind-dependence. But when you say the laws are the ones that provide maximal 'unification for a bounded reasoner,' is this unification a feature *of the world* itself, or is it fundamentally a feature *of our cognitive engagement* with the world?"
      *   *Likely Reply:* She'll argue it's a feature of the world's structure *as revealed* by this specific epistemic access point, not merely about us.
      *   *Follow-Up:* "If the unification is truly a feature of the world, why does its definition crucially involve the *cognitive limitation* of bounded steps? Doesn't that limitation anchor the unification property to the reasoner's perspective?"

  6.  **The Undermining Immunity Claim:** "You argue your view avoids the undermining worry because undermining futures simply aren't reconstructible from the actual axioms within the bounded steps. Could you elaborate on why such futures are unreconstructible? Is it fundamentally a computational complexity issue?"
      *   *Likely Reply:* She'll explain that reconstructing the undermining future requires inference chains that either exceed the step bound or require incorporating the very undermining data point that the axioms don't predict/allow for.
      *   *Follow-Up:* "Doesn't this solution rely on the *actual* world's mosaic *containing the evidence* that makes reconstructing the undermining future computationally hard? Couldn't there be a world where the mosaic *accidentally* makes reconstructing an undermining future computationally *easy*, even if it's statistically unlikely?"

  7.  **Vagueness from Flat Frontiers?:** "Could the reconstruction frontier be relatively 'flat' over a range of candidate systems, meaning small changes in system complexity yield negligible gains in reconstructibility? Would this make lawhood vague on your view? And is this vagueness a problem you embrace or a cost to be managed?"
      *   *Likely Reply:* She might acknowledge the possibility of approximate equality or embrace a degree of vagueness as acceptable/unavoidable.
      *   *Follow-Up:* "If lawhood can be vague, how does this impact the traditional role of laws in supporting sharp counterfactuals or explanations? Can vague laws support determinate claims about what *would* happen?"

  8.  **Divergence from Lewis on Actual Cases:** "For concrete difference: Can you name a candidate law statement that the vanilla Lewisian best-system might accept, but your reconstruction-frontier account would reject, or vice-versa? This could include laws in the special sciences, perhaps involving ceteris paribus clauses."
      *   *Likely Reply:* She might suggest a complex special science law that's simple to state but computationally hard to apply/reconstruct from, leading Lewis to accept it (due to simplicity) and her to reject it (due to poor reconstructibility). Or vice-versa for a computationally tractable but verbose law.
      *   *Follow-Up:* "Doesn't this divergence risk making your laws less *explanatory* for actual scientific practice, where concise but complex laws (like Schrodinger's equation) are prized, even if deriving specific predictions is computationally hard?"

  9.  **The Unanswerable Closer:** "Stepping back: Why *should* the fundamental metaphysical nature of laws of nature be defined in terms of the computational limitations of idealized reasoners? What is it about the *world* that makes bounded reconstructibility, rather than unbounded simplicity/strength or primitive governing powers, the right way to capture lawhood?" *(This forces her beyond restatement to justify the *metaphysical significance* of boundedness itself, which isn't derivable from her axioms and is hard to ground purely in the mosaic.)*

  **Key Follow-Up Strategy:** The follow-ups are designed to exploit potential tensions within her replies:
  *   Q2 Follow-Up targets arbitrariness if convergence fails.
  *   Q3 Follow-Up presses the circularity worry upwards.
  *   Q4 Follow-Up questions if the disposition smuggles modality.
  *   Q5 Follow-Up anchors "unification" to the reasoner's limitation.
  *   Q6 Follow-Up probes if computational hardness is contingent.
  *   Q7 Follow-Up challenges the functional role of vague laws.
  *   Q8 Follow-Up questions scientific utility/practice.
  *   Q9 Forces justification of the core metaphysical choice.

  These questions are fair, directly engage her manuscript's key ideas, require no external citations, and allow for substantive but concise answers. The opener is substantive but low-stakes, and the closer genuinely pushes beyond mere restatement. Good luck with the interview!
