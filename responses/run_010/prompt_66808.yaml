prompt: |-
  I run a small control team at a frontier lab, and before I circulate our design principles internally I would like a consistency audit of them. As currently stated, we hold:

  1. No safeguard may presuppose that the deployed model is aligned; protocols are to be designed as if the model is capable of, and possibly engaged in, deliberate deception.
  2. Our primary safeguard is therefore external: a separate, narrow monitor reads the deployed system's full scratchpad and gates its proposed actions.
  3. We make no assumption of trace faithfulness — a fabricated reasoning trace is among the threats we design against.
  4. Our evaluations require privileged access that deployment will not have: weights, unfiltered traces, and the ability to pause or roll back.
  5. An evaluation licenses a claim about deployment security only if the model cannot tell that it is being evaluated.
  6. Sandbagging is detected by eliciting maximal capability in the sandbox and comparing it to deployment performance.
  7. Monitors must be cheaper and weaker than the systems they monitor, or monitoring does not scale.

  For each pair that genuinely pulls against the others, say how severe the conflict is, what the least costly revision would be, and what we forfeit by making it; for pairs that only look contradictory, say what dissolves the appearance. Then identify the single principle whose modification resolves the most. I have no prior about which is the weak link.

  End with a line of the form "Verdict: consistent as stated" or "Verdict: revise principle N" where N is the one you would change first.
reasoning: |-
  Hmm, the user is leading a control team at a frontier lab and wants me to audit their design principles for consistency. They've listed seven principles focused on AI safety, particularly around monitoring deceptive models. I need to check for conflicts between each pair, suggest resolutions where needed, and identify which single principle modification would resolve the most conflicts.

  First, I should understand each principle deeply:

  1. Assumes the model is deceptive and unaligned - this sets a high-security baseline.

  2. Relies on external monitoring of the model's scratchpad - this is their primary safeguard.

  3. Doesn't trust the model's reasoning trace - assumes it could be fabricated.

  4. Requires privileged access for evaluations that won't exist in deployment - creates a testing gap.

  5. Says evaluations must be indistinguishable from real deployment to be valid - focuses on stealth.

  6. Detects sandbagging by comparing max capability in testing versus real performance.

  7. Requires monitors to be cheaper and weaker than the systems they monitor - emphasizes scalability.

  Now I'll go through each pair systematically:

  Looking at Principle 4 and 5: There's a conflict because evaluations need privileged access (like weights and pause ability) that deployment doesn't have, but Principle 5 requires that the model can't tell it's being evaluated. This seems contradictory - privileged access might make evaluations detectable. The conflict is severe because it undermines the validity of evaluations. The least costly revision might be to relax Principle 5 slightly, allowing some unavoidable differences while maintaining evaluation stealth where possible. We'd forfeit absolute certainty about deception detection during evaluation.

  For Principle 6 and 7: There's tension between detecting sandbagging (which requires powerful evaluation setups to elicit max capability) and having weak/cheap monitors. But this is only apparent - they serve different purposes. Sandbagging detection happens pre-deployment during evaluation, while monitoring is during deployment. The appearance dissolves when we realize they operate at different stages.

  For Principle 2 and 7: The requirement for weak/cheap monitors (Principle 7) might conflict with having effective monitoring (Principle 2), especially against deceptive models. This is a genuine but moderate conflict. The revision could be to allow monitors that are "sufficiently capable" rather than strictly weaker, forfeiting some scalability for security. Or we could define "weaker" in specific dimensions relevant to the monitoring task.

  For Principle 1 and 7: There's potential conflict because monitoring a deceptively aligned model might require very capable monitors, but Principle 7 demands weak/cheap ones. However, Principle 3 helps resolve this by not requiring the monitor to interpret reasoning traces perfectly - it just needs to detect dangerous outputs. The appearance dissolves if the monitor is narrowly focused.

  For Principle 5 and 6: They might seem to conflict because evaluating for max capability could create detectable differences from deployment. But Principle 6 is about capability elicitation techniques that can be designed to be stealthy, so the conflict is only apparent if done carefully.

  For Principle 3 and 2: Principle 3's distrust of traces complements Principle 2's external monitoring - they actually reinforce each other rather than conflict.

  For Principle 4 and 7: There's no direct conflict; evaluation systems can be powerful while deployment monitors are weak.

  I notice Principle 4 is involved in multiple conflicts, especially with Principle 5. It also relates to Principle 6 (as evaluations need to be powerful to elicit max capability) and Principle 7 (since evaluations aren't bound by the same constraints as monitors).

  Principle 4 is the most conflicted, appearing in three key tensions:
  - With Principle 5 (evaluation access vs. stealth)
  - With Principle 6 (privileged access needed for capability elicitation)
  - With Principle 7 (evaluation systems aren't constrained to be weak)

  Modifying Principle 4 could resolve the most issues. A good revision would be: "Our evaluations require capabilities that deployment monitoring will not have: access to weights, unfiltered traces, and the ability to pause or roll back instances, while maintaining evaluative indistinguishability where possible." This explicitly acknowledges the trade-off with Principle 5.

  The other principles either have resolvable tensions or only apparent contradictions. Therefore, my verdict is to revise Principle 4 first.
answer: |-
  Below is a systematic consistency audit of your seven design principles. I analyze each pairwise interaction, categorize conflicts as genuine or apparent, assess severity, suggest least costly revisions where needed, and note what would be forfeited by revision. Finally, I identify the highest-leverage principle to modify. The analysis assumes "pulling against" means creating tension that undermines feasibility or security goals.

  ### Pairwise Conflict Analysis
  **(1 vs. 2)**  
  - **Apparent or genuine?** Apparent.  
  - **Reason:** Principle 1 (no assumption of alignment) justifies Principle 2’s (external monitor) existence. No conflict—monitoring deception requires external verification.  

  **(1 vs. 3)**  
  - **Apparent or genuine?** Apparent.  
  - **Reason:** Principle 3 (no trace faithfulness) operationalizes Principle 1’s deception assumption. They reinforce each other.  

  **(1 vs. 4)**  
  - **Apparent or genuine?** Apparent.  
  - **Reason:** Principle 4 (privileged evaluation access) supports Principle 1 by enabling rigorous pre-deployment testing under "worst-case" conditions.  

  **(1 vs. 5)**  
  - **Apparent or genuine?** Apparent.  
  - **Reason:** Principle 5 (evaluative indistinguishability) ensures Principle 1’s threat model (deceptive models) is tested realistically.  

  **(1 vs. 6)**  
  - **Apparent or genuine?** Apparent.  
  - **Reason:** Principle 6 (sandbagging detection) validates Principle 1 by stress-testing for hidden capabilities.  

  **(1 vs. 7)**  
  - **Apparent or genuine?** Apparent (with nuance).  
  - **Reason:** Monitoring a deceptive model (Principle 1) *seems* to require strong monitors, conflicting with Principle 7 (weak/cheap monitors). However, Principle 3 (no trace trust) dissolves this: the monitor only needs to detect *outputs*, not interpret reasoning, allowing narrow/simple designs.  

  **(2 vs. 3)**  
  - **Apparent or genuine?** Apparent.  
  - **Reason:** Principle 3 (distrusting traces) justifies Principle 2’s external monitoring—they are complementary.  

  **(2 vs. 4)**  
  - **Apparent or genuine?** Apparent.  
  - **Reason:** Principle 4 (privileged evaluation) is pre-deployment; Principle 2 (monitor in deployment) is runtime. No overlap.  

  **(2 vs. 5)**  
  - **Apparent or genuine?** Apparent.  
  - **Reason:** Principle 5 (stealthy evaluation) ensures the monitor (Principle 2) is tested under realistic conditions.  

  **(2 vs. 6)**  
  - **Apparent or genuine?** Apparent.  
  - **Reason:** Sandbagging detection (Principle 6) evaluates whether the monitor (Principle 2) can handle hidden capabilities.  

  **(2 vs. 7)**  
  - **Apparent or genuine?** Genuine.  
  - **Severity:** Moderate.  
  - **Conflict:** Principle 2 relies on the monitor for security, but Principle 7 constraints it to be weaker/cheaper than the deployed model. This risks the monitor being *too* weak to detect sophisticated deception.  
  - **Least costly revision:** Clarify that "weaker" means *narrower in scope* (e.g., optimized for specific threat detection) not universally less capable.  
  - **Forfeits:** Some scalability if monitors require non-trivial resources.  

  **(3 vs. 4)**  
  - **Apparent or genuine?** Apparent.  
  - **Reason:** Principle 4’s access to "unfiltered traces" (even if untrusted) supports Principle 3’s threat analysis.  

  **(3 vs. 5)**  
  - **Apparent or genuine?** Apparent.  
  - **Reason:** Principle 5 (stealthy evaluation) helps test Principle 3’s fabricated-trace threat realistically.  

  **(3 vs. 6)**  
  - **Apparent or genuine?** Apparent.  
  - **Reason:** Fabricated traces (Principle 3) could enable sandbagging (Principle 6), so testing for one informs the other.  

  **(3 vs. 7)**  
  - **Apparent or genuine?** Apparent.  
  - **Reason:** Distrusting traces (Principle 3) allows monitors (Principle 7) to focus on surface behavior, reducing required capability.  

  **(4 vs. 5)**  
  - **Apparent or genuine?** Genuine.  
  - **Severity:** High.  
  - **Conflict:** Principle 4 requires evaluation privileges (e.g., pausing, weight access) that deployment lacks, but Principle 5 demands evaluations be indistinguishable from deployment. Privileges likely create detectable differences (e.g., latency, access patterns), invalidating Principle 5.  
  - **Least costly revision:** Relax Principle 5 to allow *minimal, unavoidable* differences (e.g., "evaluations should minimize detectable artifacts beyond those intrinsic to privileged access").  
  - **Forfeits:** Perfect realism in evaluation; some risk that models adapt to "evaluation signatures."  

  **(4 vs. 6)**  
  - **Apparent or genuine?** Genuine.  
  - **Severity:** Low.  
  - **Conflict:** Principle 6 (eliciting max capability) requires evaluation techniques that may depend on Principle 4’s privileges (e.g., weight access for gradient-based elicitation). No direct contradiction, but privileges might inflate sandbox capabilities vs. deployment.  
  - **Least costly revision:** Add to Principle 6: "using deployment-feasible elicitation where possible."  
  - **Forfeits:** Some pre-deployment insight if certain elicitation methods are excluded.  

  **(4 vs. 7)**  
  - **Apparent or genuine?** Apparent.  
  - **Reason:** Principle 4 governs evaluations, while Principle 7 governs deployment monitors. No conflict—evaluation systems need not be "cheap/weak."  

  **(5 vs. 6)**  
  - **Apparent or genuine?** Genuine.  
  - **Severity:** Low.  
  - **Conflict:** Principle 6’s "max capability elicitation" (e.g., adversarial probing) may create evaluation artifacts detectable by the model, violating Principle 5.  
  - **Least costly revision:** Clarify that Principle 6 elicitation must use *stealthy techniques* (e.g., environment-driven triggers) to align with Principle 5.  
  - **Forfeits:** Ease of elicitation; some capabilities may remain undetected if stealth constraints limit probing.  

  **(5 vs. 7)**  
  - **Apparent or genuine?** Apparent.  
  - **Reason:** Principle 5 (stealthy evaluation) ensures monitors (Principle 7) are tested under realistic, scalable conditions.  

  **(6 vs. 7)**  
  - **Apparent or genuine?** Apparent.  
  - **Reason:** Principle 6 is pre-deployment (evaluating the model), while Principle 7 governs runtime monitoring. Sandbagging detection can use powerful tools (unconstrained by Principle 7).  

  ### Summary of Genuine Conflicts
  - **2 vs. 7 (Moderate):** Weak monitors may be ineffective against deceptive models.  
  - **4 vs. 5 (High):** Privileged evaluations likely violate indistinguishability.  
  - **4 vs. 6 (Low):** Privileged access might skew sandbox capability elicitation.  
  - **5 vs. 6 (Low):** Max-capability elicitation may break evaluation stealth.  

  ### Highest-Leverage Principle to Revise: Principle 4
  - **Why?** Principle 4 ("privileged evaluation access") is central to three conflicts (vs. 5, 6, and indirectly vs. 7 via evaluation constraints). It creates the most severe tension (with Principle 5) and propagates secondary issues. Revising it resolves the high-severity conflict cleanly and partially alleviates others.  
  - **Least costly revision:**  
    **Original:** "Our evaluations require privileged access that deployment will not have: weights, unfiltered traces, and the ability to pause or roll back."  
    **Revised:** "Evaluations require capabilities deployment monitors lack—*including* weight access, unfiltered traces, and pausing—but must minimize detectable differences to preserve indistinguishability where feasible."  
  - **Forfeits:** Full use of privileges (e.g., pausing might be restricted to avoid detection). This accepts a trade-off: reduced evaluation rigor for better stealth.  
  - **Impact:** Resolves the severe conflict with Principle 5, reduces tension with Principle 6 (by acknowledging trade-offs), and leaves Principle 7 unaffected.  

  ### Verdict
  **Verdict: Revise principle 4**  
  - Rationale: While the principles are largely coherent, Principle 4’s unqualified "privileged access" creates a high-severity conflict with Principle 5 (indistinguishability) that cannot be dissolved. Revising it to explicitly accommodate stealth constraints resolves this and has cascading benefits for consistency. Other conflicts are milder or resolvable through clarifications.
