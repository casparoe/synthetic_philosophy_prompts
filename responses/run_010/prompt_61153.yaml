answer: |-
  ## The Night Clerk's Theorem

  The register is full, each numbered **room**
  Assigned. The ink is dry. There is no **list**
  For vacancies. My duty is to **shift**
  No one. The master holds the master **key**.
  A quiet night, no call for any **guest**,
  Each sleeper safe behind their bolted **door**.

  The bell rings. One. No name upon the **list**.
  No empty place. And yet, I make the **shift**:
  "Each sleeper moves one forward." Find the **key**
  To Room One. Tell the waking **guest**
  He must decamp. A vacant **door**
  Appears at last, far down the endless **room**.

  A sigh, perhaps. But each accepts the **shift**.
  They know the drill. I turn the master **key**,
  Prepare the bed for this, the single **guest**.
  He signs the book. I shut the **door**.
  The house is full again, each crowded **room**
  Accounted for, complete upon the **list**.

  Another bell. A coachload! Now the **key**
  To chaos? No. I rouse the nearest **guest**:
  "Move to twice your number." Shut that **door**,
  Proceed down hallways, endless as the **room**
  Itself implies. Now check the growing **list**:
  All odd numbers stand empty. Make the **shift**.

  He grumbles, moves. The next awakened **guest**
  Goes further on. I close each vacated **door**
  Behind them. Patterns bloom within the **room**:
  The endless hall, the ever-lengthening **list**,
  The perfect pairing, proof against the **shift**
  Of circumstance. This is the master **key**.

  All find their place, however late the **door**
  Is knocked. The register accepts each **guest**,
  Expands to hold them. Watch the vacant **room**
  Appear like magic, summoned by the **list**'s
  Demand. This endless, yielding **shift**
  Is how we lodge them. This the only **key**.

  But patterns close. The seventh turn's a **door**
  That stays shut fast. The circuit holds the **guest**
  In endless orbit through the numbered **room**.
  The weary **list** repeats, denies the **shift**
  That breaks the wheel. No master **key**
  Exists for *her*. She knocks. My master key

  Turns useless in the lock. No vacant **door**
  For this strange **guest**, this endless **room**'s true **shift**,
  Who breaks the **list**'s closed circle. Let the **key**
  Fall. Let the **door** stand fast. No **room**. No **list**. No **shift**.
