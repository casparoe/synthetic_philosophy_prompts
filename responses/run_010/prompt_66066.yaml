  This pattern has three key characteristics: (1) the boundary relocation always absorbs the threatening case, (2) it happens bidirectionally without apparent bad faith, and (3) each shift has locally plausible justification. The user provides two concrete examples from their seminar - one where expensive preferences get reclassified as circumstances to warrant compensation, and another where health conditions get reclassified as choices to deny compensation.

  The professor explicitly rejects superficial solutions - they don't want labels or literature references, but rigorous conceptual carving. Their five questions demand: identification of existing concepts (with precise differentiation), potential neologism creation, distinction from Rawlsian reflective equilibrium, operational tests for detection, and diagnosis of whether the flaw lies in theories or the distinction itself.

  What makes this challenging is the pattern's deceptive resemblance to legitimate theoretical refinement. The discriminating features appear to be: the asymmetric directionality of shifts (always toward absorbing objections), absence of independent boundary anchors, and the resulting vacuity masked as perfect coherence.

  For naming, "theoretic opportunism" captures the adaptive boundary behavior while differentiating from pejorative terms like ad hoc. The Rawlsian contrast is crucial - in reflective equilibrium, principles and judgments mutually adjust toward independent moral facts, whereas here adjustments serve only coherence preservation.

  The diagnostic insight may be that such distinctions fundamentally cannot bear the normative weight placed upon them when used as exhaustive allocative criteria. The pattern reveals not contingent theory flaws but categorical limitations of dichotomous frameworks in distributive justice.

  This calls for a meta-level analysis of how conceptual boundaries function in normative theories - perhaps exposing a necessary tension between systematic coherence and substantive accountability that dichotomies artificially resolve through elasticity.
answer: |-
  What you've delineated is a profound methodological pathology in normative theory construction—one that evades existing labels precisely because its vacuity masquerades as theoretical agility. Below is a systematic carving of **Theoretic Opportunism**, defined as:  

  > *The ad hoc bidirectional relocation of a constitutive theoretical boundary to absorb recalcitrant cases, where each relocation is locally justified but globally circular, rendering the theory empirically vacuous while maintaining an illusion of coherence.*  

  ### 1. **Nearest Concepts & Why They Fall Short**  
     - **Ad Hoc Hypothesis (Popper)**:  
       *Why it fails*: Ad hoc adjustments modify auxiliary assumptions to protect a core claim. Here, the *core distinction itself* (choice/circumstance, resources/capabilities) is relocated. The boundary *is* the theory’s operative mechanism.  
     - **Reflective Equilibrium (Rawls)**:  
       *Why it fails*: Reflective equilibrium seeks coherence through mutual adjustment of principles *and* intuitions, but requires independent constraints (e.g., considered judgments). Theoretic opportunism lacks any fixed point; intuitions dictate boundary shifts unidirectionally (to absorb objections), with no countervailing pressure.  
     - **Conceptual Stretching (Sartori)**:  
       *Why it fails*: Stretching extends a concept’s coverage ambiguously. Opportunism is *bidirectional* (expanding/contracting the boundary as needed) and preserves the *form* of a rigid dichotomy while hollowing it out.  
     - **Adaptive Preferences (Elster)**:  
       *Why it fails*: As you note, this describes agents adjusting desires to constraints. Opportunism operates at the meta-level: it’s the *theorist* adapting the *metric* to preempt counterarguments, not agents adapting to circumstances.  
     - **Immunizing Stratagem (Lakatos)**:  
       *Why it fails*: Immunization shields a "hard core" theory. Here, there *is* no hard core—only a malleable boundary that swallows objections whole.  

  ---

  ### 2. **Boundary Cases: Discriminating Theoretic Opportunism**  
     - **vs. Reflective Equilibrium**:  
       - *Discriminating Feature*: **Asymmetry of Adjustment**. In reflective equilibrium, principles can *override* intuitions (e.g., rejecting racist "judgments"). In opportunism, intuitions *always* override principles via boundary relocation. The line moves *only* to preserve the verdict, never to challenge the intuition.  
       - *Prospective Test*: Ask: *Does the theory ever sacrifice a locally intuitive verdict to preserve the integrity of its core distinction?* If not, it’s opportunistic.  
     - **Edge Case: Parfit’s Identity Problem**  
       - *Scenario*: A theory excludes "unchosen genetic traits" from compensation. Objection: *All* traits depend on conception timing, which no one "chose."  
       - *Opportunistic Move*: Relabel "genetic luck" as "circumstance" (to compensate) *or* "identity-constitutive" (to deny compensation), depending on the objection’s thrust.  
       - *Verdict*: Opportunism. The distinction collapses into "whatever preserves compensation/non-compensation."  

  ---

  ### 3. **Diagnosis: The Flaw in the Distinction or Its Use?**  
  The pattern exposes a **categorical failure of dichotomous justificatory frameworks**:  
     - **Non-Arbitrary Boundaries Are Impossible** for metrics like choice/circumstance because:  
       - Agency is temporally extended (e.g., "unchosen" preferences shaped by past choices).  
       - Social causation is non-local (e.g., "individual" risks embedded in structural injustice).  
     - **The Distinction Cannot Bear the Weight** because it is tasked with two incompatible roles:  
       1. *Descriptive*: Tracking empirical facts about responsibility.  
       2. *Normative*: Allocating burdens/benefits.  
       Under pressure, the descriptive aspect is silently subordinated to the normative outcome.  

  ---

  ### 4. **A Neologism: Theoretic Opportunism**  
  **Definition**:  
  > *A self-immolating theoretical maneuver wherein a constitutive binary distinction is bidirectionally relocated to absorb counterexamples, justified by local intuitions but devoid of invariant content, rendering the theory vacuously congruent with any outcome.*  

  **Excluded Neighbors**:  
  - *Not* **ad hoc**: Targets the theory’s *foundational* dichotomy, not auxiliary parts.  
  - *Not* **equivocation**: Relies on shifting definitions, but systematically and coherently.  
  - *Not* **false dichotomy**: The dichotomy is retained formally while being substantively erased.  

  ---

  ### 5. **Why Existing Frameworks Miss It**  
  This pathology thrives in theories that conflate **conceptual coherence** with **explanatory power**. By treating the boundary’s relocation as "refinement," theorists mistake the *dissolution* of the distinction for its *application*. The result is a theory that is "always right" because it has ceased to be a theory at all—it is a tautology disguised as a criterion.  

  **Implication**: The pattern suggests that dichotomous metrics in distributive justice are *inherently* unstable when tasked with exhaustive normative work. Salvaging them requires either abandoning exhaustiveness (e.g., allowing irreducible pluralism) or anchoring boundaries to non-moral facts (e.g., neuroscience of agency)—but even these may succumb to opportunism. What you’ve identified is not a bug in specific theories, but the death rattle of a paradigm.
