prompt: |-
  You are a moral philosopher who has spent years both working within and criticizing the effective altruism movement. I want a coherence audit, not an argument for or against any single claim. Begin by sketching, in a few sentences, what the most defensible unified version of this package would look like, and only then work through the claims.

  For a workshop on the critiques of effective altruism I have written down my settled views:

  1. Affluent people are morally required, not merely encouraged, to give a substantial share of their income to the most cost-effective charities; giving less is a moral failure rather than a shortfall in generosity.
  2. Program-level cost-effectiveness analysis — trial evidence, cost per outcome, comparison across interventions — is the best tool currently available for allocating charitable money.
  3. The institutional critique is right: because the movement privileges what can be measured and experimentally validated, it systematically under-ranks work whose benefits are diffuse, political, or slow — advocacy, institution-building, shifting norms — and it should discount its own priority rankings accordingly.
  4. Expected-value reasoning about long-run consequences is the correct method for choosing among causes.
  5. Longtermism overreaches: priority for the far future rests on speculative estimates that cannot be checked, and until they can be, programs with demonstrable near-term welfare gains come first.
  6. Earning to give is a legitimate strategy wherever the counterfactual donations exceed what the person would have accomplished in direct work.
  7. It is nonetheless inappropriate to reproach individuals who give little; a conclusion about what is right is not a conclusion about who may be blamed.
  8. The movement should also be assessed by what I call its displacement cost: the careers and organizing capacities diverted into high-earning or technocratic roles that would otherwise have gone into labor, public-interest law, or electoral politics.

  I think this hangs together better than most critics allow, but I cannot locate the pressure points myself. Identify which pairs genuinely conflict and which only appear to, and rank the conflicts by severity rather than reporting them as equally serious. For each real conflict, give the cheapest revision, say exactly which claim it damages and what the revision costs me elsewhere in the list, and note where a claim that seems to need a special exception can instead be absorbed by something I already accept. Finish by naming the single revision that would remove the most tension, and say whether the view that results is still recognizably a critic's position or has quietly become the orthodoxy it set out to question.
reasoning: |-
  Okay, the user is asking me to perform a coherence audit on their set of beliefs about effective altruism (EA). They've listed eight settled views that combine elements of support for EA with significant critiques. As a moral philosopher with experience in both working within and criticizing the EA movement, they want me to identify tensions between these claims without arguing for or against any single position.

  Let me start by understanding what a defensible unified version of EA would look like. The core would maintain that affluent individuals have a strong obligation to give effectively to save lives or prevent suffering. It would rely heavily on quantitative cost-effectiveness analysis as the best available tool, while acknowledging limitations through expected-value reasoning that accommodates uncertainty. This version would emphasize earning to give as a legitimate strategy and avoid personal blame while focusing on systemic change.

  Looking at the user's claims, I need to examine how they fit together. Claim 1 establishes a strong moral obligation to give substantially. Claim 2 endorses cost-effectiveness analysis as the primary tool. Claim 3 critiques EA's measurement bias against diffuse interventions. Claim 4 supports expected-value reasoning. Claim 5 critiques longtermism's speculative nature. Claim 6 supports earning to give. Claim 7 rejects personal blame despite the obligation. Claim 8 introduces displacement costs as an evaluation metric.

  The most severe tension appears between Claim 2 (prioritizing measurable interventions) and Claim 3 (critiquing this very approach). The user acknowledges EA undervalues diffuse work but still calls CEA the "best tool available." This creates a conflict because if CEA systematically undervalues certain interventions, it might not actually be the best allocation tool in practice. The cheapest revision would be to soften Claim 2 to position CEA as "essential but insufficient" rather than "best," which preserves the core of Claim 3 without abandoning quantification entirely.

  Another significant tension exists between Claim 4 (endorsing expected-value reasoning) and Claim 5 (critiquing longtermism's speculativeness). Expected-value reasoning applied to long time horizons naturally leads to longtermism, which Claim 5 rejects. The revision here would be to explicitly limit expected-value reasoning to "tractably modelable" consequences, which allows the user to maintain skepticism about far-future claims while keeping the method for near-term applications.

  I notice that Claim 8 (displacement costs) creates tension with Claim 6 (earning to give). When evaluating whether earning to give is justified, Claim 8 suggests we must consider what careers and capacities are diverted from other valuable work. This means the counterfactual analysis in Claim 6 needs expansion to include these displacement effects. The user can absorb this by interpreting "what the person would have accomplished" more broadly to include systemic and institutional contributions beyond direct outputs.

  Claim 7 (rejecting personal blame) initially seems in tension with Claim 1's framing of giving less as "moral failure," but this may be more semantic than substantive. The user can resolve this by clarifying that systemic factors or reasonable disagreement might make blame inappropriate even when obligations exist.

  After examining all these tensions, I determine that modifying Claim 2 to downgrade CEA from "best tool" to "essential but insufficient" would resolve the most severe conflict while staying true to the critical perspective. The resulting view remains recognizably critical of EA orthodoxy - it still demands substantial giving and uses quantification while firmly rejecting longtermism's speculations and insisting on adjustment for measurement bias and displacement costs. This maintains the user's identity as an informed critic rather than an orthodox EA adherent.
answer: |-
  Here is a coherence audit of your 8 claims, identifying genuine conflicts, ranking their severity, proposing the cheapest revisions, and evaluating the overall position:

  **Most Defensible Unified EA Core:**
  Affluent individuals have a profound moral duty to use significant resources to efficiently reduce suffering/save lives. This requires rigorous, evidence-based comparison of interventions (cost-effectiveness analysis - CEA) focused on maximizing expected welfare impact, often via direct health/poverty interventions. Expected value reasoning is fundamental. Systemic biases in measurement must be acknowledged and mitigated. Earning to give is valid when impact outweighs direct work. Moral obligation exists, but blame is inappropriate due to complexity and systemic factors.

  **Ranked Conflicts & Revisions:**

  1.  **Severe Conflict: Claim 2 vs. Claim 3**
      *   **Conflict:** Claim 2 asserts CEA is the *best tool* for allocation. Claim 3 argues CEA *systematically under-ranks* crucial categories of work (advocacy, institution-building) due to measurement limitations, requiring discounting its own rankings. If CEA systematically misses/discounts vital impact pathways, it cannot simultaneously be the "best tool" *and* require significant discounting due to fundamental flaws.
      *   **Cheapest Revision:** Modify **Claim 2** to: "Program-level cost-effectiveness analysis is an *essential but insufficient* tool...". Replace "best" with "essential but insufficient" or "foundational but incomplete".
      *   **Damage to:** Weakens the exclusivity/primacy of Claim 2.
      *   **Cost:** Slightly reduces the confidence in CEA as *the* primary decision procedure. Forces integration with other (qualitative/systematic) assessment methods implied by Claim 3.
      *   **Absorption:** This revision *embraces* Claim 3's core critique rather than treating it as an exception. Claim 3 *becomes* the justification for the revision.

  2.  **Significant Conflict: Claim 4 vs. Claim 5**
      *   **Conflict:** Claim 4 endorses Expected Value (EV) reasoning about long-run consequences as the *correct method*. Claim 5 argues Longtermism (a natural consequence of applying EV reasoning over very long time horizons) overreaches due to unchecked speculation, prioritizing near-term gains instead. Applying the "correct method" rigorously leads directly to the conclusion Claim 5 rejects.
      *   **Cheapest Revision:** Modify **Claim 4** to: "Expected-value reasoning about *tractably modelable* long-run consequences is a core method...". Add a qualifier like "tractably modelable," "within reasonable epistemic bounds," or "where confidence intervals are meaningfully constrainable".
      *   **Damage to:** Weakens the universality of Claim 4. Implicitly concedes Claim 5 identifies a genuine limit to the method's reliable application.
      *   **Cost:** Requires defining "tractable/modelable" (non-trivial), opening the door for dispute about where the line is drawn, potentially creating tension with the spirit of long-run EV.
      *   **Absorption:** Claim 5 *defines* the limit condition for Claim 4. The revision operationalizes Claim 5's critique within the EV framework itself.

  3.  **Moderate Conflict: Claim 6 vs. Claim 8**
      *   **Conflict:** Claim 6 justifies Earning to Give (EtG) based solely on counterfactual donations exceeding counterfactual direct impact. Claim 8 demands assessing the movement by "displacement cost" – diversion of talent from potentially high-impact but non-technocratic paths (labor, law, politics). EtG inherently encourages diversion into high-earning roles. Claim 8 suggests this systemic diversion has negative consequences *not* captured by Claim 6's individual counterfactual.
      *   **Cheapest Revision:** Broaden the interpretation within **Claim 6**. Explicitly state that "what the person would have accomplished in direct work" *includes* the potential systemic/organizing/political impact of those alternative career paths that Claim 8 highlights. The counterfactual analysis *must* encompass these broader societal contributions.
      *   **Damage to:** Makes the counterfactual assessment in Claim 6 vastly more complex and speculative.
      *   **Cost:** Significantly raises the burden of proof for justifying EtG. Makes individual calculations extremely difficult; likely pushes towards favoring direct work more often.
      *   **Absorption:** Claim 8 *expands the scope* of the counterfactual analysis already required by Claim 6. It doesn't add a new principle, just clarifies what the existing principle must include.

  4.  **Apparent Conflict (Resolvable): Claim 1 vs. Claim 7**
      *   **Conflict:** Claim 1 states giving less is a "moral failure." Claim 7 states it's "inappropriate to reproach" (blame) individuals who give little. Calling something a moral failure typically implies blameworthiness.
      *   **Resolution:** This is *prima facie* tension, not a deep conflict. It mirrors the distinction between objective wrongness and subjective blameworthiness common in moral philosophy (e.g., due to ignorance, duress, reasonable disagreement, or systemic barriers). Claim 7 explicitly invokes this distinction ("a conclusion about what is right is not a conclusion about who may be blamed").
      *   **Cheapest Revision:** None strictly needed. Clarify **Claim 1** that "moral failure" refers to the *act* falling short of an objective standard, not necessarily implying the *agent* is blameworthy given Claim 7's caveats (reasonable disagreement, systemic pressures, personal circumstances). Or soften "moral failure" to "morally suboptimal."
      *   **Cost:** Minor semantic adjustment if any. The core substance of both claims can coexist with the blame/objective wrongness distinction clearly stated in Claim 7.

  **The Single Revision Removing Most Tension:**
  Revise **Claim 2** from "best tool" to "essential but insufficient tool." This directly addresses the most severe conflict (with Claim 3) and has a cascading positive effect:
  1.  It formally integrates the Institutional Critique (Claim 3) into the core methodology, forcing a more holistic view of impact assessment.
  2.  It slightly weakens the rigidity that might exacerbate the tension between EV reasoning (Claim 4) and Longtermism (Claim 5) by allowing non-quantifiable factors more weight.
  3.  It marginally alleviates pressure on the EtG vs. Displacement (Claim 6 vs. Claim 8) conflict by potentially increasing the perceived value of non-CEA-friendly careers within the broader impact calculus.

  **The Resulting Position:**
  The view resulting from revising Claim 2 remains **recognizably a critic's position**, distinct from EA orthodoxy:

  *   **Orthodoxy Anchor:** Strong obligation to give (C1), core reliance on CEA/EV (revised C2, C4), acceptance of EtG (C6), rejection of blame (C7).
  *   **Critical Core Intact:** Explicit downgrade of CEA's status (revised C2), full embrace of Institutional Critique requiring discounting/diversification (C3), rejection of speculative Longtermism (C5), emphasis on Displacement Cost as a systemic critique (C8).
  *   **Key Distinction:** While orthodox EA might *acknowledge* the limitations in C3/C5/C8, your revised view elevates them to the level of *core structural critiques* requiring fundamental methodological adjustment (CEA as insufficient) and priority-setting consequences (rejecting longtermism, deeply questioning EtG via displacement). The blend of strong obligation *with* systemic skepticism about dominant tools and priorities defines the critical stance. It hasn't become orthodox; it has carved out a coherent critical alternative *within* the broader consequentialist framework.
