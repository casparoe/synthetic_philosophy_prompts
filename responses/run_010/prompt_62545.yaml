answer: |-
  ### Analysis and Proposed Concept

  Based on your description, this phenomenon isn't cleanly captured by any single established concept. It's a specific failure mode in discourse where a vivid historical or conceptual analogy (e.g., Munich 1938, Thucydides Trap) becomes the *default vocabulary* for debate. When critics point out disanalogies, they "win" the immediate point but "lose" the broader argument because the analogy's framework hijacks the discourse—reshaping the questions, sidelining inconvenient facts, and forcing opponents to engage on its terms. The core failure isn't the analogy itself, but how it **rewires the debate's grammar** so that counterarguments become unintelligible or off-topic unless they use the analogy's language. Below, I address your requests: first, evaluating existing concepts; second, coining a new term with boundaries; and finally, providing reusable output.

  ### 1. Established Concepts and Where They Fall Short
  I evaluated concepts you mentioned and added one more ("Discourse capture") since it partially fits. Focus is on precision in shortcomings:

  | candidate concept       | what it claims (one line)                                                                 | where it falls short of your description                                                                 | fit (1-5) | keep or discard |
  |-------------------------|-------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------|-----------|-----------------|
  | **Framing effect**      | How presentation of an issue shapes interpretation and emphasis.                          | Too broad: frames are general (e.g., "costs vs. benefits"), but your case involves analogies *becoming* the language itself. Ignores the disanalogy-absorption dynamic. | 2 | Discard |
  | **Conceptual metaphor** | Cognitive tool where one idea (e.g., "argument is war") structures thought unconsciously. | Explains *why* analogies stick but not the *debate dynamic*: your issue is about discourse being "trapped" in the analogy's questions after disanalogies are raised. | 3 | Discard |
  | **Thought-terminating cliché** | A phrase used to shut down complex thought or debate (e.g., "it is what it is").       | Opposite effect: your case multiplies debate (e.g., endless "Munich?" quibbling). Not specific to analogies or vocabulary hijacking. | 1 | Discard |
  | **Loaded question**     | A question embedding an assumption that forces a specific response (e.g., "Have you stopped lying?"). | Too narrow: your issue involves a *system* of questions/vocabulary (e.g., "appeasement" scripts), not one interrogative. Misses the relocation of debate. | 2 | Discard |
  | **Discourse capture**   | When a narrative or ideology dominates discussion, marginalizing alternatives.            | Close but vague: doesn't specify the *analogy mechanism* or why disanalogies fail to break the frame. Your case is a subtype where the capture is linguistic. | 4 | Discard (as standalone) |
  | **Kuhnian paradigm**    | Scientific communities operate under shared assumptions that resist falsification.         | Misaligned scope: tied to scientific revolutions, not public/intellectual debate. Your case lacks "community" aspects; facts are visible but irrelevant. | 1 | Discard |

  **Summary**: No existing concept fully fits. "Discourse capture" is the closest (hence fit=4), but it's underspecified and not analogy-focused. Framing and metaphor are components but miss the debate-relocation mechanism.

  ### 2. Coined Concept: **Analogy Capture**
  **Definition**: A rhetorical failure where a vivid analogy hijacks discourse by becoming its mandatory vocabulary and question-set, absorbing disanalogies as internal disputes rather than frame-breaking critiques.

  **Necessary Conditions** (all must be true):  
  - A resonant analogy (e.g., historical, literary) is introduced.  
  - Debate relocates to the analogy’s questions (e.g., "Is this appeasement?") and terms (e.g., "credibility," "aggressor").  
  - Disanalogies or external facts are treated as debatable within the frame (not frame-refuting), making them linguistically "off-topic" or weak.  

  **Diagnostic Test**:  
  *"Are the core questions in the debate the analogy’s questions (e.g., ‘Who is Chamberlain here?’) rather than the situation’s own questions (e.g., ‘What are this conflict’s economic drivers?’)?"*  
  If yes, analogy capture has occurred.  

  **Boundary Cases**:  
  - **Case**: The analogy is apt (e.g., a true Munich parallel).  
    **Verdict**: Still analogy capture.  
    **Reason**: The phenomenon is about *how the debate operates*, not the analogy’s validity. Even apt analogies can force discourse into restrictive scripts.  
  - **Case**: The user argues in good faith.  
    **Verdict**: Still analogy capture.  
    **Reason**: Good faith doesn’t prevent vocabulary hijacking; the frame can be reinforced unintentionally.  
  - **Case**: A counter-vocabulary exists but is "less fun" (e.g., complex economic terms vs. vivid war metaphors).  
    **Verdict**: Still analogy capture.  
    **Reason**: Capture is defined by dominance in *active debate*, not theoretical alternatives. If the analogy’s language is mandatory for participation, it has captured the discourse.  

  ### Reusable Output Table
  For your column, here's the distilled comparison of concepts (as requested):

  | candidate concept       | what it claims (one line)                                                                 | where it falls short of my description                                                                 | fit (1-5) | keep or discard |
  |-------------------------|-------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------|-----------|-----------------|
  | Framing effect          | How presentation shapes interpretation and emphasis.                                      | Too broad; ignores analogy-specific hijacking and disanalogy absorption.                               | 2         | discard         |
  | Conceptual metaphor     | Cognitive tool structuring thought via analogy (e.g., "argument is war").                 | Explains stickiness but not debate relocation after disanalogies are raised.                           | 3         | discard         |
  | Thought-terminating cliché | A phrase used to shut down complex thought or debate.                                   | Opposite effect: your case multiplies debate within the analogy's frame.                              | 1         | discard         |
  | Loaded question         | A question embedding an assumption that forces a specific response.                       | Too narrow: your issue involves a system of questions/vocabulary, not one interrogative.               | 2         | discard         |
  | Discourse capture       | When a narrative dominates discussion, marginalizing alternatives.                        | Close but vague; misses analogy-specific mechanisms and disanalogy failure.                            | 4         | discard         |

