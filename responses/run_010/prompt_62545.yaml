prompt: |-
  I cover science and ideas for a magazine, and a big chunk of my beat is foreign-policy-adjacent — historians, think tanks, the argument-of-the-week cycle. Over maybe a decade of reading and assigning peices I've kept hitting the same failure mode and I've never been able to find a name for it. Help me work out whether it's a real thing with a concept attached, or whether it needs one.

  Here's what happens. Someone writes that a current concession is Munich 1938 — appeasement, the aggressor learns that force pays, and so on. A historian replies with the disanalogies: there's no revanchist industrial power sitting in the same position, the domestic politics don't line up, the "credibility" being defended isn't the same kind of thing. And then the weird part: nobody refutes the historian, and the analogy doesn't get weaker. Instead the whole argument relocates. Now the question on the table is "is this appeasement?" and "who's playing Chamberlain?", and to object you have to answer those questions in those words. The historian wins the exchange and loses the argument, because the exchange is now happening inside a vocabulary the analogy supplied. Facts that don't fit the script don't get rebutted — they just don't register as the same sort of fact. A trade dispute becomes a test of resolve; economic interdependence is somehow off-topic.

  Same shape with the Thucydides trap stuff. Once a story is written as rising power versus ruling power, everything gets sorted into that grammar, and the only counter anyone has is a dull negative sentence — "this isn't 431 BC" — against a vivid one. The debate then continues at full volume for thousands of words. Nobody is shutting it down. It's that the analogy has decided what the questions are.

  So the thing I want a handle on isn't "an analogy misleads," and it isn't framing in the loose sense — every description frames something, that's not the failure. It's specifically that the analogy stops being a premise you can weigh and becomes the vocabulary in which the situation gets described, so that arguing against it first requires stepping outside the language it hands you, which almost nobody on a deadline does. The diagnostic I keep using informally: you can tell it's happened when the questions being argued are the analogy's questions rather than the situation's.

  Things I've considered and don't think fit. Thought-terminating cliché — kind of the opposite, the talk multiplies. Theory-ladenness of observation — that's about perception, and here both people can see the same facts fine. Kuhnian paradigm — too tied to scientific communities. Loaded question — right flavor, but it's one interrogative, not a whole vocabulary. Begging the question — nobody states the analogy as a premise, so there's nothing to catch.

  What I want back, in American English please:

  1. Does this have an established name? If it does, or if something comes close, give me the two or three nearest concepts and be precise about exactly where each stops short of what I described. I care way more about the carving than the label.
  2. If nothing fits, coin one and define it properly: the necessary conditions (what has to be true before you're allowed to say it happened), the test that separates a captured debate from an ordinary well-framed one, and two or three boundary cases with your verdict on each — does it still count when the analogy is actually apt? when the person using it is arguing in good faith? when a counter-vocabulary exists but is just less fun to write?
  3. No reading list, no citations, no author-date name-dropping — I can't chase sources for this and a guessed-at reference is worse than none. Just name the concepts and say what each claims.

  For the part I'll actually reuse in a column, end with a table using exactly these columns: candidate concept | what it claims (one line) | where it falls short of my description | fit (1-5) | keep or discard. Then, immediately after the table, one JSON object and nothing else, with these fields: "term" (the name you endorse or coin), "definition" (one sentence), "mechanism" (why the disanalogy argument fails to land even when it's correct), "necessary_conditions" (array of strings), "diagnostic_test" (string), "not_this" (array of objects with "concept" and "distinction"), "boundary_cases" (array of objects with "case", "verdict", "reason").
reasoning: |-
  We are dealing with a phenomenon where an analogy (like Munich 1938 or Thucydides trap) is introduced into a debate. Then, when a critic points out disanalogies, instead of the analogy being weakened, the entire debate shifts to the terms set by the analogy. The analogy becomes the vocabulary of the discussion, and facts that don't fit are ignored or become off-topic. The critic wins the immediate exchange (by pointing out disanalogies) but loses the larger argument because the frame of the analogy now dictates the questions and terms.

  The user has considered and rejected several concepts:

  - Thought-terminating cliché: This is when a cliché ends discussion. Here, discussion continues but within the analogy's frame.
  - Theory-ladenness of observation: This is about how theories shape perception. Here, both sides see the same facts, but the frame sets what is relevant.
  - Kuhnian paradigm: Tied to scientific communities and revolutions; too broad and specific.
  - Loaded question: A single question that presumes an answer. Here, it's a whole vocabulary.
  - Begging the question: Circular reasoning where the premise assumes the conclusion. Here, the analogy isn't stated as a premise but becomes the frame.

  We need to find or coin a term for this.

  Step 1: Check for existing concepts.

  Possible candidates:

  1. **Framing effect**: In communication theory, framing is the way information is presented to influence decision making. But framing is broad and doesn't capture the specific shift where an analogy becomes the only vocabulary and disanalogies don't weaken it but just shift the debate.

     Where it falls short: Framing is about how an issue is presented, but it doesn't necessarily involve the dynamic where a critic's valid points don't reframe the debate and instead the analogy becomes entrenched as the language.

  2. **Conceptual metaphor**: From cognitive linguistics (Lakoff and Johnson), where we understand one domain (e.g., politics) in terms of another (e.g., war). This might be close because the analogy is structuring thought. But the key here is the debate dynamic: the disanalogy argument doesn't break the metaphor; it just gets absorbed.

     Where it falls short: Conceptual metaphor is a general cognitive tool. The phenomenon described is about a specific debate dynamic where the metaphor becomes inescapable in the discourse.

  3. **Discourse capture**: Not a standard term, but sometimes used to describe when a particular narrative or frame dominates a discourse. This might be close.

     However, I'm not sure it's established. Also, it doesn't specify the role of analogy.

  4. **Rhetorical trap**: Not a standard term, but it conveys the idea that the analogy sets a trap that the opponent falls into by engaging on its terms.

  5. **Argumentative closure**: This might be related to the idea that once a frame is set, it closes off alternative perspectives. But I'm not sure of an established term.

  After reflection, I think the closest established concept might be:

  - **Narrative dominance** or **narrative entrenchment**: But these are not standard.

  Alternatively:

  - **Metaphorical entailment**: From cognitive linguistics, the way a metaphor brings with it a set of inferences. But again, the focus is on the debate dynamic.

  Given the lack of a perfect fit, we may need to coin a term.

  Step 2: Coin a term.

  The core issue: The analogy becomes the vocabulary and sets the questions, so that even when disanalogies are pointed out, the debate continues within the analogy's frame. The disanalogy argument fails because it doesn't break the frame; it just becomes a point within it.

  Let's call it: **Analogical Frame Capture** or **Analogy Capture**

  Definition: A phenomenon in discourse where an analogy, once introduced, structures the subsequent debate such that the terms and questions of the analogy become the only acceptable vocabulary for discussion, rendering disanalogies as mere points of contention within the frame rather than challenges to the frame itself.

  Mechanism: The disanalogy argument fails to land because it does not break the frame set by the analogy. Instead, it is interpreted within the frame (e.g., as a debate about whether the analogy is apt) and thus reinforces the frame by keeping the analogy central. The vividness of the analogy and the ease of reasoning within it make it resilient.

  Necessary conditions:

  1. An analogy is introduced that provides a structured narrative or set of categories for understanding the current situation.

  2. The analogy is vivid and resonant (e.g., historical analogies like Munich or Thucydides).

  3. The debate shifts to the analogy's terms, so that the central questions become about the analogy (e.g., "Is this appeasement?") rather than the situation per se.

  4. Even when disanalogies are raised, they do not dislodge the analogy but are absorbed as debates within the frame.

  Diagnostic test: When the questions being argued are the analogy's questions rather than the situation's, and when disanalogies are treated as disagreements about the applicability of the analogy rather than reasons to abandon the analogy.

  Boundary cases:

  - When the analogy is apt: Verdict: It still counts as analogical frame capture. Reason: Even if the analogy is apt, the phenomenon is about the frame taking over the discourse. However, in such a case, it might be justified, but the dynamic is the same.

  - When the user is arguing in good faith: Verdict: It still happens. Reason: Good faith doesn't prevent the frame from capturing the discourse.

  - When a counter-vocabulary exists but is less fun: Verdict: It still counts. Reason: The phenomenon is about the frame dominating the actual debate, even if alternatives are available.

  Step 3: Table of candidate concepts.

  We'll list:

  - Framing effect
  - Conceptual metaphor
  - Discourse capture (if we consider it, but it's not standard) 
  - Thought-terminating cliché
  - Loaded question

  But the user already considered some. Let's stick to the ones they mentioned and add one or two more.

  Table:

  | candidate concept       | what it claims (one line)                                                                 | where it falls short of my description                                                                 | fit (1-5) | keep or discard |
  |-------------------------|-------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------|-----------|-----------------|
  | Framing effect          | The way an issue is presented influences how it is interpreted.                           | Too broad; doesn't capture the specific dynamic of an analogy becoming the only vocabulary.            | 2         | discard         |
  | Conceptual metaphor     | We understand one conceptual domain in terms of another.                                  | Explains why analogies are powerful but doesn't address the debate dynamic where disanalogies fail.    | 3         | discard         |
  | Thought-terminating cliché | A cliché used to quell cognitive dissonance and end debate.                             | Here, debate continues and multiplies; it doesn't terminate.                                           | 1         | discard         |
  | Loaded question         | A question that contains an unjustified assumption.                                       | This is about a single question, not a whole vocabulary and frame.                                     | 2         | discard         |
  | Discourse capture       | When a particular narrative or frame dominates a discourse.                              | This is close but not a standard term. Focuses on dominance but not specifically via analogy.          | 4         | consider        |

  But note: The user said no citations, so we can mention "discourse capture" as a non-standard term and then coin our own.

  I think we should coin: **Analogy Capture**

