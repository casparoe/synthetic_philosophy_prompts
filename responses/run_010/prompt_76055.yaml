prompt: |-
  I run a small design studio and I'm about to hire my first full-time person. My instinct is to have her run everything by me — every client email, every draft — because I trust my own eye more than any rule I could write down, and I'd catch problems early. My business partner thinks that's a disaster: he says her objective should just be "get the client satisfaction survey score as high as possible," and otherwise leave her alone.

  Thing is, I did my version of this once with an assistant and it went badly in a way I still can't quite explain. After a couple months she was only showing me the stuff thats going well, and I found out later two clients had been quietly unhappy for weeks. She was never lying, exactly — she just stopped surfacing anything I wouldn't like.

  So: what actually went wrong there, structurally, and which of our two plans avoids it? I don't want a list of management tips. Also, honestly, I usually can't say what good work is until I see it — does that fact push me toward my partner's version or away from it?
reasoning: |-
  Okay, the user runs a small design studio and is hiring their first full-time employee. They're stuck between two management approaches: their instinct to have everything run by them versus their partner's hands-off method focusing on client satisfaction scores. 

  Hmm, the core tension here is about control versus autonomy, but with a twist - the user tried micromanaging before and it backfired in a subtle way. That failure pattern is fascinating: the assistant started hiding problems by only showing "safe" work. Classic information filtering! 

  The user's deeper struggle seems to be about quality control without explicit rules. They admit they can't define good work until they see it - that's very common in creative fields. But this actually undermines their preferred approach because...

  *lightbulb* The real structural failure last time was a double bind! The assistant was punished (implicitly) for showing work that needed improvement, so she learned to only show finished-looking work. But since the user needs to see in-progress work to catch issues... catch-22. 

  The partner's client-score approach avoids this by making feedback objective and delayed, but wait - what about the user's valid point that they need to see work to judge quality? That's the knot. 

  Actually, both plans have blind spots. Micromanaging breeds fear and hiding, while pure metric-focus might let quality slip until it's too late. The solution path might be... 

  *scribbles mentally* Need to separate the user's two valid concerns: 1) maintaining quality standards (which requires their eyes) and 2) preventing problem-hiding. The key is making it psychologically safe to show ugly drafts. 

  Ah! And that explains why the partner's version feels incomplete - client scores lag too much for creative work. By the time a survey comes back, the design is already approved and implemented. 

  *leans back* So the answer isn't either/or but... reframing. The user needs to shift from "approving everything" to "collaborating on the right things." Specific, non-judgmental feedback sessions on works-in-progress could replace blanket approvals. 

  And about that "I can't define good work" admission - that actually points toward needing more early collaboration, not less. Because if quality is intuitive, you have to see it emerge. So ironically, that fact pulls toward more interaction, but of a different kind. 

  *checks notes* The structural fix is about creating negative space: instead of controlling everything, control nothing... except dedicated safe spaces for critique. And measure what matters - not just end satisfaction, but process health too.
answer: |-
  You've identified the exact structural failure that occurs under micromanagement: **the "Filter-Up Effect."** Here's what happened with your assistant and why both your current plans have flaws:

  **The Structural Failure (Filter-Up Effect):**
  1.  **Initial State:** You require approval for *everything*, implicitly signaling that your standard/vision is paramount and any deviation is a potential failure.
  2.  **Employee Response:** The employee (trying to succeed/avoid disapproval) learns to only present work they believe *meets your expectations* or is already "polished." Problems, uncertainties, or early drafts they know might trigger your critique are hidden ("filtered out").
  3.  **Feedback Loop:** When *only* "good" or "safe" work is presented, you (the manager) receive less signal about potential issues. You interpret this lack of bad news as things going well, reinforcing the employee's behavior.
  4.  **Outcome:** Small problems fester unseen (like unhappy clients) because the employee fears bringing you anything less than perceived perfection. Trust erodes, learning stalls, and you become a bottleneck *without actually seeing the critical issues*.

  **Why Both Your Plans Are Flawed:**
  *   **Your Plan (Everything Run By You):** Directly creates the Filter-Up Effect. It guarantees you'll only see what the employee *thinks* you want to see, hiding the very problems you want to catch early. It stifles autonomy, growth, and creates unsustainable bottlenecks.
  *   **Your Partner's Plan (Pure Outcome Autonomy):** Ignores your core competency (your "eye"). Client satisfaction scores are lagging indicators. By the time a survey reflects dissatisfaction, the design work is *done*, the problem has occurred, and the relationship may be damaged. It risks inconsistent quality and misalignment with your studio's core creative vision because the employee lacks your intuitive guidance *during* the process.

  **The Crucial Insight & Path Forward:**
  Your admission – *"I usually can't say what good work is until I see it"* – is **central**. This fact **pushes you decisively *away* from your partner's pure autonomy model.** Pure autonomy relies on pre-defined rules or clear outcomes, which you admit don't capture your intuitive quality standard.

  **What You Need (The Hybrid Solution):**
  You need a model that **prevents the Filter-Up Effect** while **leveraging your intuitive judgment at critical, *non-final* stages**. This requires shifting from *approval* to *collaborative review* at specific, defined points:

  1.  **Establish Clear "Review Gates" (Not Approval Gates):**
      *   Define specific, non-negotiable points *during* projects where work *must* be shared with you: e.g., After initial concept sketches, after mood boards, after first draft layout, *before* final client presentation.
      *   Frame these as **"Let's look at this together to see where it's landing"** sessions, not "Show me so I can approve." The goal is *alignment and problem-solving*, not perfection.

  2.  **Focus Feedback on Vision & Fundamentals (Not Micromanagement):**
      *   In these reviews, use your "eye" intentionally: "Does this feel on-brand?", "Is the hierarchy working?", "Does this capture the mood we discussed?", "What's the core idea here, and is it strong enough?".
      *   **Avoid:** Nitpicking fonts/colors *unless* they fundamentally undermine the concept. Focus on the *why*, not just the *what*.

  3.  **Grant Autonomy *Between* Gates:**
      *   Explicitly state: "Between these check-ins, you own the execution. Make decisions, draft emails, iterate. Use your judgment. The goal is progress towards our next review point and client happiness." This builds ownership and prevents bottlenecking.

  4.  **Radically Shift the Communication Norm: Make "Problems" Safe**
      *   **Explicitly Ask for Problems:** "What part of this are you least confident about?", "Where are you stuck?", "What's the biggest risk here?". Make this a routine part of review meetings *and* casual check-ins.
      *   **Praise Surfacing Issues:** "Thanks for flagging that client concern early, that's exactly what I need to know," or "Great catch on that potential inconsistency, let's figure it out." Reward the *behavior* of bringing things up, not just perfect outcomes.
      *   **Model Vulnerability:** "I'm not sure about this element either, let's brainstorm," or "My gut says X, but tell me why you went with Y." Show that uncertainty is normal and collaborative.

  5.  **Use the Partner's Metric *Alongside* Process Checks:**
      *   Client satisfaction (CSAT/NPS) is a *vital* lagging indicator. Track it rigorously.
      *   **BUT:** Pair it with *leading indicators* tied to your review gates: "Are reviews happening on schedule?", "Is feedback being clearly understood/incorporated?", "Are problems being surfaced *before* the client complains?". This gives you early signals about process health.

  **Why This Avoids the Filter-Up Effect:**
  *   **Mandated Sharing:** Work is seen *early* and *often* at defined stages, regardless of how "polished" it feels to the employee.
  *   **Focus on "Why":** Feedback targets vision/fundamentals, not minutiae, making reviews more valuable and less punitive.
  *   **Problem-Solving Culture:** Actively soliciting concerns and rewarding their surfacing dismantles the fear of showing imperfect work.
  *   **Clear Autonomy Zones:** The employee knows exactly where they have freedom (between gates) and where collaboration is required (at gates), reducing ambiguity-induced anxiety.

  **Your "Eye" is an Asset, Not a Micromanagement Excuse.** This structure forces you to use it proactively at the *most impactful moments* (early concept, key decisions) rather than reactively on every email comma. It builds your employee's judgment *using* your expertise, rather than replacing it with rules or abandoning them to outcomes they might not yet understand how to achieve to *your* standard. It replaces fear-based filtering with structured collaboration.
