prompt: |-
  I am a fourth-year philosophy student, and as part of my department's peer-support scheme each of us has to run a thirty-minute "concept clinic" for a small group of first-years who are currently taking the introductory philosophy of mind course. Mine is scheduled for the last Friday of term, twelve students, a seminar room with a whiteboard whose markers are almost all dry and a projector that does not work, so the plan should assume I have my voice, the board, and nothing else. My assigned topic is whether a single self can be distributed across more than one brain — Hofstadter's strange-loop account from *I Am a Strange Loop*, on which a person is a self-reinforcing pattern of symbols that can be realised, partially and to varying degrees, in the brains of everyone who knows them well, and can therefore survive the destruction of the brain that first ran it. The group has just finished personal identity: Locke on memory, Parfit's teleporter and the fission cases, and one week on the extended mind thesis. They have not read any Hofstadter and will not have time to. Two of them are joint honours with psychology and tend to steer everything back to neurons.

  What I need from you is the plan for the explanation rather than the explanation: no script, no sample dialogue, and please do not suggest any readings for them or for me. First, the dependency structure — the order in which the components must go in, with a sentence on what each one makes possible. My own guess is that "a self is a pattern rather than a substance" has to be fully secured before "patterns admit of multiple realisations" can do any work, and that "multiple realisations in different media" has to precede "multiple realisations in different brains," but I cannot tell whether the strange-loop machinery — the self-referential symbol system, the level-crossing feedback — needs to be built at all in thirty minutes, or whether the session works without it and I should simply announce that I am leaving it out and why. Second, the carrying example: the one case that holds the whole thing together, and what it must have and must not have. It cannot be the teleporter or fission, since they will pattern-match to Parfit and stop listening; it cannot be a melody or a language, which they will dismiss as merely metaphorical; and it needs to be something I can later lean on to show that distribution is a matter of degree rather than a yes/no matter. Relatedly: I am tempted by Hofstadter's own case, the way he describes carrying on his late wife's pattern in himself and in the friends who knew her, but I worry that it converts the session into a grief seminar and inflames rather than defuses the reaction I expect below. Tell me whether to use it, and if so at what point.

  Third, a misconception map. I can already predict four: (a) they will hear the view as the extended mind thesis with a sentimental gloss, since that is what they read last week; (b) they will collapse it into the claim that identity is a matter of degree, which they already accept and will find unimpressive; (c) some will take it as the claim that the dead literally survive, and get either frightened or derisive; and (d) others will hear "a self is only a pattern in a brain" as straight eliminativism, and conclude that nothing about persons is real after all. For each, tell me where in the sequence it should be headed off and with what single move or sentence — ideally before it forms rather than after. Please also name any further misreading you expect that I have not listed, given that they have just come off Parfit and Clark and Chalmers. Finally, give me one question I can put to the room in the last three minutes whose answers would distinguish those who have grasped the actual claim from those who have merely accepted a comfortable paraphrase of it, and a short list of what I should cut, say I am cutting, and be able to defend cutting if my tutor sits in.
reasoning: |-
  Okay, the user is a fourth-year philosophy student preparing a 30-minute concept clinic on Hofstadter's distributed self theory for first-years. Let me unpack their needs carefully.

  First, the constraints: broken projector, only whiteboard (with dying markers), no readings possible. The students just finished personal identity (Locke, Parfit fission cases) and extended mind thesis. Two psych students keep reducing everything to neurons. User wants structural planning, not content delivery.

  Hmm... core challenge is how to scaffold Hofstadter's complex idea without the strange loop machinery. Must establish "self as pattern" before multiple realizability, but is the self-referential aspect essential for this intro? Probably not - the distributed aspect is the key takeaway for this context.

  For the carrying case... avoiding teleporters/melodies makes sense. The Carol example could work if handled clinically: focus on the cognitive mechanics of pattern-sustenance, not emotional resonance. Position it as "how we maintain representations of others" rather than "grief". 

  Biggest landmines in misconceptions:
  - Extended mind confusion: need to sharply distinguish between cognition using external tools vs selves existing across brains
  - Degree-of-identity reduction: must emphasize this isn't about fuzzy identity but multi-location
  - Literal survival fear: preempt by clarifying "survival" means pattern persistence, not consciousness
  - Eliminativism panic: stress emergent reality of patterns

  The diagnostic question should force them to distinguish between "I contain Carol's pattern" vs "Carol is partially here". Maybe: "If we perfectly replicated Hofstadter's brain patterns in silicone, would that be him? What if we distributed those patterns across 100 people?"

  Cutting the strange loop mechanics seems defensible - it's the distribution that links to their syllabus, and time is tight. Can note this simplification while emphasizing the core insight remains intact.

  For the psych students: acknowledge neural implementation matters but argue patterns are multiply realizable. "Yes neurons instantiate it, but the pattern level is what makes Carol recognizable across different brains."

  Timing breakdown:
  - Mins 0-5: Pattern ontology via whiteboard examples (ant colony, whirlpool)
  - Mins 5-15: Self-as-pattern via memory continuity (Locke critique setup)
  - Mins 15-20: Multi-realization across substrates (Carol case)
  - Mins 20-25: Distribution degrees & common misconceptions
  - Mins 25-30: Diagnostic question + wrap-up

  Should preempt the "it's just extended mind" by minute 7 with side-by-side comparison: "Extended mind: my notebook stores memories. Distributed self: your brain runs a simplified version of my self-pattern."
answer: |-
  Here's a structured plan focusing on dependency, misconception management, and critical components, optimized for 30 minutes with your constraints:

  ---

  ### **Dependency Structure**  
  *(Total: 25 mins content, 5 mins Q&A)*  
  1. **Patterns over substances (5 mins)**  
     *Use whiteboard: Sketch "whirlpool" (water) vs. "ant colony" (ants) as patterns.*  
     *Why first?* Establishes ontology: selves aren’t "things" but dynamic organizations. Enables escape from "brain = self" materialism psych students favor.  

  2. **Patterns are substrate-independent (5 mins)**  
     *Example: Chess game.* Sketch identical moves on physical board vs. app vs. mental simulation.  
     *Why here?* Proves patterns persist across media. Sets up multi-brain realizability without invoking brains yet.  

  3. **Self as a *symbolic* pattern (7 mins)**  
     *Core claim: "A self is a loop of self-referential symbols (e.g., memories, values) that reinforces itself."*  
     *Whiteboard: Draw "You" → "Your memory of childhood" → "Your belief formed from that memory" → looping back to "You".*  
     *Why minimal machinery?* Skip level-crossing; emphasize *symbolic self-reference* as the engine. Crucial to distinguish from Extended Mind (step 4) and prevent "metaphor" dismissals.  

  4. **Distribution across brains (6 mins)**  
     *Carrying case: Use **Hofstadter/Carol example, but clinically framed**.*  
     > "When Carol died, Hofstadter noticed he could 'hear' her voice judging his choices. Her symbols (opinions, humor) persisted *in him* via learned feedback loops. Not a ghost—a pattern running in a new substrate."  
     *Why here?* After steps 1-3, this is a natural extension. *Use it*, but:  
       - **Avoid grief**: Frame as "cognitive inheritance."  
       - **Emphasize degrees**: "The pattern degrades—friends carry fragments, her sister carries more."  
     *Crucial for* showing distribution isn’t all-or-nothing.  

  5. **Survival ≠ literal immortality (2 mins)**  
     *Explicitly state: "This is pattern-continuity without consciousness. Carol’s *self-pattern* persists, not her subjective experience."*  
     *Preempts "dead survive" fears/derision.*  

  ---

  ### **Misconception Map & Defusal**  
  *(Integrated into sequence)*  
  - **(a) "Extended Mind 2.0"**: Defuse at **step 4 transition**.  
    *Contrast on whiteboard:*  
    > Extended Mind: "My notebook *extends* my memory. **Tool use.**"  
    > Distributed Self: "Your brain *runs a copy* of my self-pattern. **Pattern replication.**"  

  - **(b) "Just degree-identity"**: Block at **step 4** with Carol example.  
    > "Parfit says identity fades in fission. Here, Carol’s *full* pattern persists *multiply*—it’s not fading, it’s *spread*."  

  - **(c) "Dead survive literally"**: Preempt at **step 5**.  
    > "Key: No new experiences. It’s like a song surviving on a damaged tape—played elsewhere, but not *alive*."  

  - **(d) "Eliminativism!"**: Neutralize at **step 1-3 transitions**.  
    > "Patterns are *real*: A whirlpool drowns you. A self-pattern decides moral choices."  

  - **Unlisted misreading**: "This is panpsychism!" (from Chalmers exposure).  
    *Defuse in **step 3***: "Symbols aren’t conscious—they’re *interpreted* by conscious brains."  

  ---

  ### **Diagnostic Question (Final 3 mins)**  
  **"If a perfect robot replica of Carol acted identically to her, would it *be* her? If not, how is this different from Hofstadter carrying her pattern?"**  
  - *Grasped claim*: Distinguishes pattern *replication* (robot) vs. *fragmented distribution* (multiple brains with partial, dynamic patterns).  
  - *Comfortable paraphrase*: Equates the two or can’t articulate difference.  

  ---

  ### **Strategic Cuts & Defense**  
  1. **Cut**: Strange loop’s level-crossing mechanics.  
     **State**: "I’m skipping Hofstadter’s feedback layers to focus on distribution—the core link to your course."  
     **Defense**: "Level-crossing clarifies *how* self-reference emerges but isn’t essential for showing multi-brain realizability. Time vs. depth tradeoff."  

  2. **Cut**: Neural implementation details.  
     **State**: "We’re discussing patterns at the symbolic level—the *what*, not the *how* of neurons."  
     **Defense**: "Psychology asks how brains realize patterns; philosophy asks if patterns *can* be distributed. We’re doing the latter today."  

  3. **Cut**: Comparisons to Parfit/teleporters.  
     **Defense**: "Parfit’s fission concerns *identity over time*. Hofstadter concerns *spatial distribution*. Conflating them obscures both."  

  ---

  ### **Summary Flow**  
  ```
  Pattern ontology (5m) → Substrate independence (5m) → Self as symbolic loop (7m) → Distributed case + Carol (6m) → Survival clarification (2m) → Diagnostic Q (3m) + buffer
  ```  
  *Whiteboard use*: Sketches at each stage (avoid text-heavy notes). Anchor Carol to "degrees of distribution" visually (e.g., fragmented circles in multiple heads).
