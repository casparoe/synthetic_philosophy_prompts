  First, let's unpack the scenario: this is an upper-level seminar, meaning students should grasp nuanced philosophical arguments. The question tests understanding of the moral equality of combatants doctrine and revisionist critiques. The student's answer shows strong conceptual grasp but has some notable gaps.

  For part (a): The student correctly identifies moral equality of combatants (MEC) and its role in traditional just war theory. Full credit here - they nail the key elements: symmetry thesis, Walzer vs McMahan, separation of jus ad bellum and in bello. No deductions.

  Part (b) is trickier: Spotting that premise (1) presupposes symmetry is excellent analysis - that's the core philosophical gap. But overlooking premise (2)'s flaw is significant. The student misses that (2) implies mere threat-posing creates liability, which revisionists explicitly reject. That's a major oversight worth deducting 2 points. Comments should clarify that while the premise (1) critique is valid, premise (2) also needs challenging.

  Part (c) has brilliant insights but two problems: First, the war criminal prosecution point misrepresents revisionism - McMahan explicitly rejects equating unjust combatants with murderers. Second, the conscript argument introduces an irrelevant distinction. These are substantive errors in an otherwise sharp analysis, so 3 points off. The strong parts (threat vs responsibility distinction, self-defense analogy) deserve praise though.

  About the calibration meeting: The user seems anxious about defending deductions. I should emphasize that the conscript argument deduction is particularly defensible - it's not just "incomplete" but actively wrong. The prosecution point deduction might draw pushback since the student's observation about legal practice is factually correct, but they're conflating legal and moral domains. That nuance matters in philosophy grading.

  The user's hidden need here is confidence in their judgment. They're new to TA-ing and want to avoid looking unsure in front of colleagues. So my feedback models how to articulate deductions crisply: "This claim misstates McMahan's position per [text reference], therefore..." even if they can't cite sources in comments.

  Noting that the student's overall performance is strong (A- range) might help the user contextualize - this isn't nitpicking a weak answer but fine-tuning a good one. The breakdown shows exactly where philosophical precision is lacking, which should satisfy calibration meeting rigor.
answer: |-
  Here's a granular breakdown of the student's answer with a grade out of 25 (+ detailed comments for the paper & justification for deductions), followed by what a full-credit answer would include:

  **Overall Grade: 21/25**  
  *(a: 6/7, b: 6/8, c: 9/10)*

  ---

  **Comments for the Paper & Justification for Deductions:**

  **(a) Name the doctrine... (6/7)**  
  *Comments:* "Correctly identifies the Moral Equality of Combatants (MEC)/symmetry thesis as the conclusion and accurately situates it within traditional just war theory (Walzer vs. McMahan, independence of *in bello* from *ad bellum*). Minor omission: fails to explicitly name the broader framework as the 'Traditional Jus in Bello' or 'Conventionalist' view."  
  *Justification:* -1 point. The answer captures all core elements (doctrine name, framework context, key theorists, core claim) but loses 1 point for not explicitly naming the overarching framework ("Traditional Jus in Bello" or "Conventionalism"). This is a standard expectation in upper-level seminars.

  **(b) Locate the gap... (6/8)**  
  *Comments:* "Correctly identifies premise (1) as the critical gap due to presupposing symmetry in the description of combatants' actions. Strong explanation linking this to the revisionist critique (unjust vs. just threats). However, misses a second gap: premise (2) erroneously assumes *any* lethal threat creates liability. Revisionists argue liability requires *unjust* threat-posing (which premise (2) ignores). Only focuses on premise (1)."  
  *Justification:* -2 points. Spotting the premise (1) gap is excellent analysis (+4 points). Missing the flaw in premise (2) is a significant oversight (-2). Premise (2) is not "granted" in part (b); the question asks to locate the gap *in the given argument*. Premise (2) is flawed because it states liability arises from threat-posing *simpliciter*, ignoring the revisionist claim that only *unjust* threats generate liability. A full analysis must note both gaps.

  **(c) Granting (2)... does revisionist objection bite? (9/10)**  
  *Comments:* "Excellent core argument: granting (2) sharpens the revisionist objection by highlighting the criterion clash (threat vs. responsibility for unjust threat). Strong use of the self-defense analogy and McMahan’s conclusions. However, two issues:  
  1.  The claim that unjust combatants 'ought to be prosecuted as war criminals' misstates the revisionist position. McMahan distinguishes liability to attack (moral permissibility) from criminal culpability. He does NOT argue all unjust combatants are war criminals.  
  2.  The conscript point is largely irrelevant. Revisionist liability hinges on *responsibility for an unjust threat*, not voluntariness. A conscript posing an unjust threat is still liable (though perhaps excused or less culpable). This doesn't 'narrow the disagreement'."  
  *Justification:* -1 point. The core argument (sharpened objection, criterion clash, self-defense analogy) is superb (+4 points). The misstep about war criminal prosecution (-0.5) and the irrelevant/distracting conscript point (-0.5) prevent full credit. These errors don't invalidate the main thrust but introduce confusion.

  ---

  **What a Full-Credit Answer Would Include:**
  *   **(a)** Explicitly naming the broader framework as "Traditional Jus in Bello" or "Conventionalism".
  *   **(b)** Identifying **both** gaps: 1) Premise (1) presupposes symmetry, and 2) Premise (2) incorrectly bases liability solely on posing a threat, ignoring the requirement for the threat to be *unjust*.
  *   **(c)** Avoiding the conflation of liability with criminal guilt (war criminal claim) and recognizing voluntariness/duress affects culpability/blameworthiness, **not liability**, for unjust threats under revisionism. Omitting the distracting conscript point.

  ---

  **Defensible Moves (Do NOT deduct points for these):**
  1.  **"(b) Premise (2) gives you liability... The only thing left... is proportionality":** While the gap in (2) is missed, this statement about (2) enabling the conclusion's first half *if granted* is logically sound and correctly identifies proportionality as a separate constraint. It's not an error, just incomplete analysis.
  2.  **"...the law has never gone that way... evidence that MEC survives...":** This is a valid observation about the disconnect between revisionist morality and international law/practice. While the "war criminal" label is wrong, noting the legal persistence of MEC is relevant context.
  3.  **"...McMahan ends up with a view on which hardly anyone may kill anyone":** This is a reasonable (if slightly hyperbolic) summary of the radical asymmetry and stringency in McMahan's early work (e.g., *Killing in War*).

  ---

  **Summary Justification for 21/25:**  
  This is a very strong answer demonstrating excellent grasp of core concepts (MEC, revisionist critique, liability, self-defense analogy). The deductions are for specific, identifiable omissions/errors in required components:  
  *   Minor framework omission in (a).  
  *   Missing a major gap in premise (2) in (b).  
  *   Two relatively minor but conceptually important errors in (c) (criminal guilt conflation, conscript irrelevance).  
  The analysis is sophisticated overall and deserves a high B+/A- grade.
