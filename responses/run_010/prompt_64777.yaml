  | Probability of a hypothesis ends up being \(2^{-K}\), \(K\) being the length of the shortest program that generates the data.       | **wrong**           | \(K\) is Kolmogorov complexity (shortest program).                                                          | **Major error**: The prior probability of a hypothesis is *not* \(2^{-K}\). It sums weights of *all* programs for that data. \(2^{-K}\) is a dominant term but ignores others.      | "The prior probability for data \(x\) is \(\sum_{p:U(p)=x*} 2^{-\ell(p)}\), not \(2^{-K(x)}\). \(2^{-K(x)}\) is only an upper bound."                                     |
  | Complex hypotheses get exponentially less weight than simple ones... because there are fewer short programs.                         | fine-with-caveats   | Correct intuition: fewer short programs → higher weight per simple hypothesis.                              | "Complex hypotheses" is ambiguous. It's program length that matters, not human-interpreted complexity. Some "simple" patterns have high \(K\) (e.g., randomness).                  | "Weight decreases exponentially with program length, but \(K\) is uncomputable and ‘complexity’ is machine-dependent."                                                     |
  | No fudging about which language... invariance theorem says the answer shifts by at most a fixed constant... prior is essentially unique. | misleading          | Invariance theorem: \(K_{\text{UTM1}}(x) \leq K_{\text{UTM2}}(x) + c\).                                    | The constant \(c\) can be arbitrarily large (e.g., embedding one UTM in another). For finite data, priors are *not* unique; choice of UTM matters.                                  | "Asymptotically, the constant doesn’t matter. For prediction, choice of UTM affects finite-data performance arbitrarily."                                                 |
