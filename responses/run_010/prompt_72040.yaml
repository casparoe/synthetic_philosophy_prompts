  First, I need to understand the core disagreement. The historian friend argues that narrative structure inherently creates hindsight bias by making outcomes seem inevitable, while the user distinguishes between retrospective description and modal claims of inevitability. The project aims to develop criteria separating these.

  For section (1), I must phrase the question neutrally: "Under what conditions..." keeps it open-ended without presupposing an answer. Section (2) requires showing how existing positions leave room for debate - narrative philosophy vs. empirical bias studies operate at different scales (whole narratives vs single judgments).

  Section (3) needs a concrete method. Textual analysis makes sense here - sampling narratives across contexts to identify linguistic markers. This avoids the problems of artificial experiments or theoretical restatements. Section (4) should describe a usable criterion - perhaps a checklist for historians - while acknowledging failure risks like modal implicature collapse.

  For section (5), I'll scope it honestly: one year allows framework development but not full validation. If precision fails, modal analysis gets cut. I'll address "no practical consequences" objections by noting how the criterion could influence peer review and textbook writing.

  Throughout, I'll avoid examples that commit to historiographical claims, per the user's instructions. The tone stays professional but accessible, focusing on conceptual clarity. Each point will be exactly one or two sentences as requested.
answer: |-
  Here is the application formatted as requested:

  1.  Under what conditions, if any, can historical narratives employ retrospective structures (characterizing earlier events by reference to later outcomes known to the reader) without thereby committing or inducing the modal fallacy that the outcome was necessary or highly probable given those earlier events?
  2.  Existing defences of narrative as essential for historical understanding fail to rigorously distinguish descriptive retrospection from modal inflation, while empirical hindsight bias research focuses on isolated judgements about single events, not the complex representational structure of extended narratives; this leaves unresolved whether narrative form inherently biases.
  3.  I will analyze a curated corpus of historical texts across diverse periods and styles, systematically coding instances of retrospective description to isolate linguistic markers and contextual factors that correlate with illegitimate modal inflation, avoiding the limitations of artificial experiments and purely theoretical restatements.
  4.  Success yields an operational criterion: a set of identifiable features (e.g., specific temporal modifiers, absence of concurrent alternatives, explanatory framing) enabling a historian or critic to assess a passage for illegitimate modal inflation; failure occurs if no stable distinction emerges, showing such descriptions intrinsically carry problematic modal claims.
  5.  The year develops the analytical framework and tests it on a significant sample, prioritizing descriptive taxonomy if precise criteria prove elusive; to objections about practical irrelevance, I argue the criterion directly impacts historical argument evaluation, peer review, and textbook writing by making modal overreach demonstrable.
