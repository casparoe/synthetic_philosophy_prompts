  ### Decision Tree for the Scientific Status of Natural Selection

  **Instructions:** Start at Question 1. Answer each question based on your beliefs about evidence and explanation (ignore labels or positions). Proceed to the next question based on your answer. At the end, you'll reach a named position. Focus on the core idea of natural selection: "Traits that enhance survival and reproduction tend to become more common in populations over time."

  ---

  #### Branch Questions  
  1. **Can the core idea of natural selection be tested by observing outcomes in real populations?**  
     - **Yes** → Go to 2  
     - **No** → Go to 3  

  2. **Can "fitness" (an organism's likelihood of survival/reproduction) be defined before seeing who survives?**  
     - **Yes** → Go to 4  
     - **No** → Go to 5  

  3. **Is the core idea still useful for guiding biological research despite not being testable?**  
     - **Yes** → Go to 6  
     - **No** → Go to 7  

  4. **Does the core idea make precise predictions without relying on other biological theories (e.g., genetics)?**  
     - **Yes** → Go to 8  
     - **No** → Go to 9  

  5. **Does the core idea explain past events better than it predicts future changes?**  
     - **Yes** → Go to 10  
     - **No** → Go to 11  

  6. **Is the core idea's value primarily in organizing observations, not describing reality?**  
     - **Yes** → Position H  
     - **No** → Position A  

  7. **Is the core idea flawed to the point of being scientifically vacuous?**  
     - **Yes** → Position B  
     - **No** → Position D  

  8. **Is the core idea a fundamental pattern found throughout nature?**  
     - **Yes** → Position I  
     - **No** → Position F  

  9. **Can the core idea only be tested when combined with other theories?**  
     - **Yes** → Position G  
     - **No** → Position E  

  10. **Does the core idea require historical evidence (e.g., fossils) to be evaluated?**  
      - **Yes** → Position C  
      - **No** → Position F (via indirect path)  

  11. **Is the core idea's lack of testability due to its generality, not a flaw?**  
      - **Yes** → Position A  
      - **No** → Position D  

  ---

  #### Leaf Positions (Named Views)  
  - **A. Popper's earlier verdict (metaphysical research programme):**  
    - **Awkward commitment**: It cannot be falsified by any observation, yet it's essential for science.  
    - **Test example**: None (feature: it inspires testable theories but isn't one itself).  

  - **B. Popper's post-retraction verdict (testable theory):**  
    - **Awkward commitment**: Fitness must be measurable independently of survival (e.g., via environmental pressures), which can be circular in practice.  
    - **Test example**: Industrial melanism in peppered moths (observed shift in moth coloration due to pollution).  

  - **C. Fitness as a disposition (rescues testability):**  
    - **Awkward commitment**: Fitness is an unobservable propensity (like "solubility"), inferred indirectly, risking circularity if survival data is used to measure it.  
    - **Test example**: Antibiotic resistance in bacteria (predicting resistance spread based on trait advantages).  

  - **D. Definitional view (scientific via utility):**  
    - **Awkward commitment**: It's not empirical—it defines terms but doesn't explain why some traits succeed.  
    - **Test example**: None for the core idea alone (feature: it structures testable models, e.g., in population genetics).  

  - **E. Historical science (explanation without laws):**  
    - **Awkward commitment**: It struggles with prediction, as past events are unique and not governed by universal laws.  
    - **Test example**: Fossil transitions in whale evolution (inferring selection from historical sequences).  

  - **F. Split view (population genetics testable, core idea lawless):**  
    - **Awkward commitment**: The core idea is untestable alone, yet treated as the foundation of evolutionary biology.  
    - **Test example**: Population genetics models in the long-term E. coli experiment (predicting adaptive mutations).  

  - **G. Instrumentalism (many models, no truth claim):**  
    - **Awkward commitment**: It avoids saying if selection is "real," focusing only on model utility.  
    - **Test example**: Pesticide resistance models in insects (testing model fit against field data).  

  - **H. Deflationary view (verbal dispute about "theory" scope):**  
    - **Awkward commitment**: It dissolves the problem by redefining terms, potentially ignoring deeper issues.  
    - **Test example**: Any example (e.g., finch beak shifts during drought), but disputes whether it tests "selection" or auxiliary assumptions.  

  - **I. Overshot retraction (Popper conceded too much):**  
    - **Awkward commitment**: Agrees with Popper's early view that testability claims ignore circularity in fitness definitions.  
    - **Test example**: None (bug: rejects standard tests like sickle cell trait in malaria zones as relying on circular fitness measures).  

  ---

  ### Honest Parts  
  **1. Indistinguishable Leaf Pairs (and separator question):**  
  - **C (Fitness as disposition) and B (Popper's retraction)** collapse under the tree. They differ only on whether fitness must be a "propensity" (a substantive difference), but the tree lacks a question to split them.  
    - **Separator**: "Does defining fitness as a propensity resolve circularity?" (Yes → C; No → B).  
  - **D (Definitional view) and A (Popper's earlier view)** partially collapse. D requires Q7→No, while A requires Q6→No or Q11→Yes. The tree separates them weakly via Q7.  
    - **Separator**: "Is the core idea's non-testability a strength?" (Yes → A; No → D).  

  **2. Interesting Empty Cells (3 examples):**  
  - **Path: Q1=No → Q3=Yes → Q6=Yes** (Untestable but instrumental)  
    - **Diagnosis**: Coherent but unattractive. Few hold this because instrumentalism typically requires testable models (e.g., Position G).  
  - **Path: Q1=Yes → Q2=No → Q5=No → Q11=Yes** (Testable via outcomes, fitness defined post-hoc, not historical, and generality excuses flaws)  
    - **Diagnosis**: Incoherent. If fitness is defined after survival (Q2=No), testability (Q1=Yes) becomes circular—no one defends this.  
  - **Path: Q1=No → Q3=No → Q7=No** (Untestable, useless without other theories, but not vacuous)  
    - **Diagnosis**: Unexplored. A niche for "selection as heuristic scaffold," but no major position occupies it.  

  **3. Load-Bearing Question:**  
  - **Q1 (testability by observation)**. If deleted, these leaves collapse:  
    - **B, C, E, G** (all testable) merge into a single "testable" cluster.  
    - **A, D, F, I** (all untestable) merge into an "untestable" cluster.  
    - Historical (E) and instrumental (G) distinctions blur without Q1.  

  **4. Popper's Change of Mind as a Path:**  
  - **Earlier view (A)**: Q1=No → Q3=Yes → Q6=No.  
  - **Retraction (B)**: Q1=Yes → Q2=Yes → Q4=Yes → Q8=Yes.  
  - **Difference**: Q1 marks a **substantive philosophical shift**—earlier, no observation can test the core idea; later, observations like industrial melanism can. The retraction hinges on reinterpreting fitness (Q2=Yes) as independent of survival (e.g., via environment), not just redefining "theory."  
  - **Overshot (I)** is a distinct leaf (rejecting Q1=Yes) to show Popper may have conceded too much.
