  - Information gathering where participants get statements from "sources"
  - Group discussion to form consensus
  - Reveal of actual truths
  - Debrief mapping experiences to Humean reductionism and Reidian credulity

  I'm confident this will work because the friction points naturally emerge when participants either waste time verifying everything or get burned by false testimony. The moment when groups realize some trusted sources were unreliable should be particularly impactful.

  The part I'm least sure about is whether the time pressure adequately forces the trust/distrust dilemma - some groups might avoid the conflict. I'll suggest backup questions for the debrief to draw this out.

