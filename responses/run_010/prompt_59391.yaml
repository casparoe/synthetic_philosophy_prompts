  In case (2), the domain is a corridor, which is not a habitat for ravens. If there is a non-black raven in the world, it is unlikely to be in the corridor, so not seeing one in the corridor is not surprising.

  This is similar to the "domain specificity" idea.

  We can formalize it as follows:

  Let D be the domain (e.g., the wood). We sample an object from D.

  Then, for H: all ravens are black.

  But H is about the whole world, not just D. So we should consider H restricted to D? Or use the domain to estimate the whole.

  Alternatively, we can think of the observation as bearing on the existence of a counterexample in D, and then we care about the whole world.

  Let H_D be the hypothesis that all ravens in D are black.

  Then, H implies H_D, but not conversely.

  Observation of a black raven in D confirms H_D, and since H_D is a consequence of H, it also confirms H.

  Observation of a non-black non-raven in D does not directly bear on H_D, but it does bear on the equivalence in D.

  Specifically, the evidence that there are no non-black ravens in D.

