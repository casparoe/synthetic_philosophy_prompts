   But if there might be more, then it's complicated.

   The key is that before we thought the valley had no ravens, so it couldn't have a non-black raven. Now we know it has at least one. So the possibility of a non-black raven in the valley is now open.

   Moreover, the report only says that the observed raven is black, not that all ravens in the valley are black. So there could be other ravens in the valley that are not observed and might be non-black.

   Therefore, the evidence A (there is at least one raven) increases the number of ravens in the world, which might increase the chance of a non-black raven existing somewhere. The evidence B (this particular one is black) only slightly reduces that chance.

