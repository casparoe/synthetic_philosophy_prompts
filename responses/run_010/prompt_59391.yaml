   For an observed object with properties, we can always compute the risk before the observation: the probability that it is a non-black raven given ¬H and the context.

   Then, for an observation E that the object is not a non-black raven (i.e., it is either not a raven or not non-black or both), we have:

     P(E|H) = 1

     P(E|¬H) = 1 - risk

     LR = 1 / (1 - risk)

