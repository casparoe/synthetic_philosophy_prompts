prompt: |-
  Since I hung up the lab coat — thirty-odd years in plant physiology, mostly drought responses in crop plants — I've been working through philosophy on my own, slowly and with no supervision, and lately I've got rather hooked on social choice theory. I also, to my occasional regret, sit on the management committee of a housing co-operative: 31 households, a shared roof, a shared garden, one meeting a month and an AGM in the autumn. Our constitution gives each household what it calls "reserved matters" — things the collective simply doesn't get a vote on, like what you plant in your own plot, whether you keep hens, what you do inside your own four walls, how you heat your own living room. The idea was to stop the tyranny of the majority over trivia. In practice we've had three years of situations where honouring everybody's reserved matters, plus adopting anything the whole membership would agree is an improvement on what we have, leaves us either deadlocked or landed with an outcome that everyone in the room says is worse than something else we could have had. Then I read Sen's little 1970 impossibility result about the Paretian liberal — the one with Prude, Lewd and a copy of Lady Chatterley's Lover — and I had the very uncomfortable feeling it was a description of our AGM. A member who did PPE in the eighties insists this is just Arrow's theorem with new paint; I don't think he's right, but I can't say why.

  So here's what I'd like: a decision procedure my committee can actually run at the table, not a lecture. Assume twenty minutes, a whiteboard, a show of hands, and an audience of a retired nurse, a heating engineer, two primary school teachers and me — nobody with maths beyond counting and nobody who's going to read anything beforehand. It should take a proposal and walk us through, in order: how to write the choice down as a small set of alternative states rather than as a motion; how to identify who is decisive over which pair of states and how to spot the pairs that differ only in someone's reserved matter; how to test whether honouring all those decisive pairs plus unanimity generates a cycle or a Pareto-dominated pick (and how to tell that apart from ordinary disagreement, which is most of our meetings); and then a diagnostic branch telling us which assumption to relax and what each relaxation costs us concretely — give up the unanimity requirement, shrink or re-draw a reserved zone, restrict the profiles we're willing to treat as admissible because they're meddlesome, stop demanding a single best state and instead settle on a procedure with a tie-breaker, or hand the whole thing back to the membership. That last option is expensive for us: amending a reserved zone needs two thirds at the AGM, so please treat it as costly rather than free, and say which branch to prefer when more than one is technically available. Where a step is really a value judgement dressed up as arithmetic, label it as such, and mark the points where the procedure should stop and refer the question to the membership rather than decide it.

  Please also run it on three of our actual cases, honestly and including where it comes out against me. First: a household wants to put a large solar array on its own south-facing roof section, which is currently a reserved matter, but the rest of us want a uniform look because the street is in a conservation area and it affects everyone's value. Second: two households want hens, several object on smell and fox grounds, and the hens are on one plot while the foxes and the smell are not — I want the procedure to cope with a reserved right whose exercise spills over, and to tell me whether that means the right was mis-drawn in the first place. Third, and the one I don't want to hear: I've been claiming that what I burn in my own living room is my reserved matter, and the membership would prefer I didn't, with a real health argument behind it. If the procedure says my claim doesn't survive, say so, and say which condition was the one that gave way. It would also help to have one short case where there's no unanimous improvement at all and two reserved rights simply collide — music in one unit against sleep in the next — so we can see what the procedure does when the Pareto branch is silent. Finally, be candid about the limits: what breaks with 31 households instead of two, what depends on people reporting their preferences honestly rather than strategically, whether it can handle reserved matters that come in degrees, and where it will misfire and produce a confidently wrong answer. And if the philosophers' quarrel over how to formulate a right in the first place — I gather some people think it ought to be something you can waive or trade rather than a fixed pair of states you're decisive over, and others think Sen's own example smuggles in an externality — actually changes what a committee should do, build the difference in as a branch; if it's just people arguing, tell me that so I can stop reading about it at two in the morning. No bibliography, no reading list, no citations please: I can't chase them and I'd rather you spent the words on the procedure. And write the whole thing in British English — organisation, behaviour, licence as a noun, that sort of thing.
reasoning: |-
  Hmm, this is a fascinating and very specific request from a retired plant physiologist now grappling with social choice theory in their housing co-op. The user clearly has deep practical experience with collective decision-making challenges and has done serious reading on Sen's liberal paradox. They're frustrated with abstract theory and want concrete, implementable solutions for their 31-household committee.

  Key things stand out: First, their constitution has "reserved matters" that echo Sen's protected spheres, but they're experiencing real-world clashes exactly like the Lewd/Prude paradox. Second, they need a whiteboard-friendly procedure usable by non-mathematicians in 20 minutes. Third, they're intellectually honest - even requesting cases where the outcome goes against their own interests.

  The core challenge is adapting high theory to a lay committee. Arrow's theorem and Sen's paradox are typically presented with mathematical formalism, but here we need physical actions: writing states on boards, drawing lines between them, testing for cycles. The user's cases are perfect illustrations - solar panels (aesthetics vs property rights), chickens (externalities), wood burning (health vs autonomy).

  I'll structure this as a literal walkthrough: how to map their motions to "states", identify decisive pairs for reserved matters, then systematically check for cycles or Pareto fails. The diagnostic branches must be brutally practical - e.g., "if cycle detected, either shrink reserved zone (costly) or drop unanimity (risky)".

  For their cases: The solar panel conflict will likely reveal a misdrawn reserved right - roof appearance isn't truly isolatable. The chicken case beautifully demonstrates externalities requiring redefinition. And yes, their wood-burning claim probably fails under health impacts - I'll show how the procedure surfaces that without theory jargon.

  Important caveats: With 31 households, preference revelation becomes unreliable. We'll need to flag where strategic voting could distort outcomes. Also, the procedure assumes dichotomous rights - if their reserved matters have degrees (e.g., "some noise allowed"), we'll need a fallback.

  The PPE graduate's confusion about Arrow vs Sen is understandable but wrong - Arrow is about aggregation of preferences, Sen is about rights vs efficiency. I'll clarify through the chicken case: when rights conflict, it's fundamentally different from Arrow's ranking paradox.

  British English is no issue - "tyre" not "tire", "plough" through complexity. And absolutely no citations - this must stand alone as field manual for frustrated committee members.
answer: |-
  Here's a practical decision procedure for your committee, designed for your constraints. It uses a whiteboard, show of hands, and clear steps. We'll walk through it, then apply it to your cases.

  **The "Reserved Matters Check" Procedure (20-Minute Version)**

  **Goal:** To test if a specific proposal (e.g., "Ban wood-burning stoves", "Require uniform solar panel appearance") is compatible with respecting all reserved matters *and* avoiding outcomes everyone agrees are worse than an alternative.

  **Materials:** Whiteboard, pens, voting hands.

  **Participants:** Committee members (retired nurse, heating engineer, teachers, you).

  **Step 0: Frame the Proposal as States (5 mins)**
  *   **Action:** Stop talking about the motion ("We should ban hens"). Instead, define **at least 3, but ideally only 3 or 4, distinct "states of the world"** relevant to this decision. Write them clearly on the whiteboard. Focus on outcomes, not the path to get there. Include the *Current State* and the *Proposed Change State*. Add *one or two key alternative states* people are likely comparing to.
  *   **Why:** Motions are yes/no. States let us see conflicts and preferences between multiple options.
  *   **Example States:**
      *   `State A (Current):` Hens allowed per reserved matters; no specific rules on coops/fencing.
      *   `State B (Proposal):` Ban keeping hens entirely.
      *   `State C (Alternative):` Hens allowed, but with mandatory secure, odour-controlled coops (defined standard).
      *   *(Or simpler if needed: A=Current Hens Allowed, B=Ban Hens, C=Status Quo but Hens Restricted)*
  *   **Whiteboard Look:**
      ```
      STATES:
      1. [Current State] - e.g., Hens Allowed (No Rules)
      2. [Proposed Change] - e.g., Ban Hens
      3. [Alternative 1] - e.g., Hens Allowed w/ Rules
      (4. [Alternative 2] - e.g., Only Small Birds Allowed - *if really needed*)
      ```

  **Step 1: Identify Reserved Matters & Decisive Pairs (5 mins)**
  *   **Action 1a (Identify Rights):** Ask: "Which of these states differ *only* because of something protected as a **reserved matter** for a specific household?" (e.g., "Hens in my garden", "My roof appearance", "What fuel I burn"). Draw a circle around the name of the relevant household(s) next to those pairs.
  *   **Action 1b (Decisive Pairs):** For each reserved matter identified: The household involved is **decisive** over any pair of states differing *only* in that matter. Draw a solid arrow (`===>`) on the whiteboard from the state they *don't* prefer to the state they *do* prefer for that specific difference.
      *   *Example:* If State A has `No Hens`, State B has `Hens for HH#5`, and hens are a reserved matter for HH#5, and HH#5 wants hens, then: `A ===> B (HH#5 Decisive)`. If HH#5 prefers no hens, then `B ===> A (HH#5 Decisive)`.
  *   **Why:** This visually maps where individuals have the constitutional right to dictate the outcome between specific options.
  *   **Whiteboard Addition:**
      ```
      STATES:
      1. [Current State] - Hens Allowed (No Rules)
      2. [Ban Hens]
      3. [Hens w/ Rules]

      ARROWS (Decisive):
      1 ===> 3?  *(If HH#5 prefers Rules over No Rules?)*
      2 ===> 1?  *(If HH#5 prefers Current over Ban?)*
      *(Label who is decisive - "HH#5 Decisive")*
      ```

  **Step 2: Test Unanimity (Pareto) & Spot Problems (5 mins)**
  *   **Action 2a (Unanimous Improvement):** Ask: "Is there any pair of states where **every single household prefers** one state over the other?" (Show of hands for each potential pair). If yes, draw a dashed arrow (`--->`) from the worse state to the better state. Label it "Pareto".
  *   **Action 2b (Spot Cycles):** Look at the whiteboard. Are there arrows forming a **loop**? (e.g., State1 -> State2 -> State3 -> State1). This means collective preferences are contradictory.
  *   **Action 2c (Spot Pareto-Dominated):** Look at the states. Is there a state that *everyone* agrees is worse than another specific state? (This should be caught by the dashed `--->` arrow). The "worse" state is Pareto-dominated. **Crucially:** Is the *proposed* state or the *current* state Pareto-dominated?
  *   **Action 2d (Spot Conflicts):** Are there arrows pointing in *opposite directions* between the same two states? (e.g., a solid `===>` from A to B for HH#5, but a dashed `--->` from B to A for Pareto). This is a direct clash between a right and unanimity.
  *   **Why:** This reveals the core problems: cycles (deadlock) or a state being worse for everyone than another option (inefficiency), especially if that state is being chosen.
  *   **Whiteboard Addition:**
      ```
      STATES: 1, 2, 3
      ARROWS (Decisive): [As before]
      ARROWS (Pareto): e.g., 1 ---> 3 (Pareto) *if everyone prefers Rules over No Rules?*
      PROBLEM? Cycle? Pareto-Dominated State? Conflict Arrow?
      ```

  **Step 3: Diagnose & Choose a Path (5 mins)**
  *   **Action 3a: Identify the Problem:**
      *   **Cycle Detected?** (Go to Branch A)
      *   **Pareto-Dominated State Detected?** (Especially if it's the Proposed or Current State). (Go to Branch B)
      *   **Direct Conflict Arrow?** (Solid Arrow vs. Dashed Arrow between same states). (Go to Branch B)
      *   **Neither? But Still Deadlocked?** (Go to Branch C - Ordinary Disagreement)
  *   **Action 3b: Choose a Branch:**
      *   **Branch A (Cycle):** The rights + unanimity requirements are incompatible for this proposal/profile. Your options:
          1.  **Relax Unanimity:** Drop the requirement for a *unanimous* improvement. Use majority vote *only on the states involved in the cycle*. **Cost:** Might impose a "bad" outcome on minorities. **Value Judgement:** Is this issue important enough to override minority preferences? *(Label: Value Judgement)*
          2.  **Shrink/Redraw Reserved Zone:** Amend the constitution to remove the conflicting element from being a reserved matter for future decisions. **Cost:** High! Requires 2/3 AGM vote, loses individual autonomy on that point. Prefer if the conflict reveals a fundamental flaw in the reserved zone definition (e.g., clear spillover).
          3.  **Restrict Profiles:** Declare the current preferences (leading to the cycle) "meddlesome" or inadmissible. **Cost:** Highly controversial! Hard to define fairly. **Avoid this branch unless extreme.**
          4.  **Accept Tie/Procedure:** Acknowledge no single "best" state. Use a fair tie-breaker (e.g., random draw between cycle states, rotating chair decides, default to status quo). **Cost:** Feels arbitrary, dissatisfying.
          5.  **Refer to Membership:** Put the *specific conflict revealed by the cycle* to the full membership vote at the AGM. **Cost:** Slow, but democratic. Prefer if the conflict is fundamental or high-stakes. *(Mark: Referral Point)*
          *   **Preference Order:** (1) or (5) are often most practical starting points. Prefer (2) only if the cycle clearly exposes a *misdefinition* of the reserved matter itself. Avoid (3).
      *   **Branch B (Pareto-Dominated / Direct Conflict):** A specific state is worse for everyone than another, OR a right directly blocks a unanimous improvement. Your options:
          1.  **Override Reserved Right (If Conflict):** If the conflict arrow is between a decisive pair and a Pareto pair, choose the Pareto-superior state, overriding the individual's right *in this specific instance*. **Cost:** Violates the constitution, sets precedent, erodes trust. **Highly Discouraged!** Only consider in extreme cases (e.g., immediate severe health risk). **Value Judgement:** How severe is the harm? *(Label: Value Judgement + Referral Point - Likely needs AGM)*
          2.  **Shrink/Redraw Reserved Zone:** (As in Branch A). **Cost:** High (2/3 AGM). **Prefer this over (1) if possible.** This is often the *correct* response if the Pareto conflict arises from a spillover effect - it means the right was likely misdrawn.
          3.  **Relax Unanimity:** Doesn't directly solve Pareto-domination.
          4.  **Refer to Membership:** Put the question of overriding the right *in this specific case* or amending the reserved matter to the AGM. **Cost:** Slow. **Prefer this over (1).** *(Mark: Referral Point)*
          *   **Preference Order:** (2) or (4) are the responsible paths. (1) is a last resort with high cost.
      *   **Branch C (Ordinary Disagreement):** No cycle, no Pareto-domination, no direct conflict arrow. Preferences are just diverse. **Decision Procedure:** Use your standard voting method (e.g., majority vote) on the *original motion* or between the key states. The problem isn't rights/unanimity, it's differing views on collective good. **No need to relax core assumptions.**

  **Step 4: Record & Refer (If Needed)**
  *   Clearly note the outcome: The decision made, or the specific question being referred to the AGM (e.g., "Proposal to amend constitution: Roof appearance no longer a reserved matter").

  ---

  **Applying the Procedure to Your Cases**

  **Case 1: Solar Array (Uniform Look vs. Reserved Roof)**
  *   **Step 0: States:**
      *   `State A (Current):` Mixed roof appearances (some solar, some not, various types).
      *   `State B (Proposal):` Require uniform solar array type/style for all south-facing roofs.
      *   `State C (Alternative):` HH#X installs their preferred large solar array; others remain as-is.
  *   **Step 1: Reserved Matters/Decisive Pairs:**
      *   Difference between A and C: *Only* HH#X's roof appearance (Reserved Matter). If HH#X prefers C over A: `A ===> C (HH#X Decisive)`.
      *   Difference between B and A: Involves *everyone's* roof appearance (all reserved matters). *No single household is decisive* over this pair. Collective decision needed.
  *   **Step 2: Unanimity & Problems:**
      *   Is there a Pareto improvement? Unlikely. Some want uniformity (prefer B), HH#X wants their array (prefer C), others might prefer A.
      *   **Conflict Arrow?** Possibly: HH#X's decisive arrow (`A ===> C`) might conflict with what others want (e.g., if many prefer B over C, but *not unanimously*). **No direct Pareto conflict with decisive arrow.**
      *   **Cycle?** Unlikely with 3 states. Possibly A->C (HHX), C->? (No clear decisive), B->A? (No decisive, maybe Pareto if *everyone* preferred old look, unlikely).
      *   **Main Problem:** Ordinary Disagreement (Branch C). No rights/unanimity clash identified. The desire for uniformity conflicts with HH#X's reserved right, but exercising that right doesn't create a Pareto-worse state *or* a cycle with unanimity. The "spillover" (aesthetics) is real but arguably not severe enough to trigger Branch B *unless* it demonstrably caused significant financial loss *and* unanimity existed on that point (very unlikely).
  *   **Step 3: Branch C (Ordinary Disagreement).** Committee should vote on the proposal (State B) using standard rules. If it fails (likely, as it restricts a right), Status Quo (State A) or HH#X installing (State C) prevails per their right. **Diagnostic:** The "spillover" exists but didn't create a Sen-type paradox here. The procedure suggests the right was *not* necessarily misdrawn; aesthetics are subjective and the claimed impact on "everyone's value" wasn't unanimous or severe enough to override the right *in this test*. The cost of uniformity is restricting individual choice on a reserved matter. **Referral?** Only if voting on the motion itself.

  **Case 2: Hens (Reserved Right with Spillover - Smell/Foxes)**
  *   **Step 0: States:**
      *   `State A (Current):` Hens allowed per reserved matters; no specific rules.
      *   `State B (Proposal):` Ban keeping hens entirely.
      *   `State C (Alternative):` Hens allowed, but with mandatory secure, odour-controlled coops (defined standard).
  *   **Step 1: Reserved Matters/Decisive Pairs:**
      *   Difference between A and C: *Only* the rules imposed on hen-keepers (arguably part of "keep hens" reserved matter?). If HH#5 (wanting hens) prefers A (no rules) over C (rules): `C ===> A (HH#5 Decisive?)`. *(Value Judgement: Is the* method *of keeping hens part of the reserved right, or can rules be imposed? Constitution likely unclear - mark as uncertain)*.
      *   Difference between A and B: Involves banning the activity itself (core reserved matter). If HH#5 wants hens: `B ===> A (HH#5 Decisive)`.
  *   **Step 2: Unanimity & Problems:**
      *   **Unanimous Improvement?** Very likely: *Everyone* prefers State C (Hens w/ Rules) over State A (Hens w/ No Rules & Problems). Smell/foxes reduced for objectors, hen-keepers still get hens. Draw `A ---> C (Pareto)`.
      *   **Conflict Arrow?** YES! We have `A ---> C (Pareto - Everyone better off)` BUT we *might* also have `C ===> A (HH#5 Decisive - If they prefer no rules)`. **Direct conflict between Pareto superiority and a potential individual right.**
      *   Pareto-Dominated? State A is Pareto-dominated by State C (everyone prefers C over A).
  *   **Step 3: Branch B (Pareto-Dominated / Direct Conflict).**
      *   **Diagnostic:** The exercise of the reserved right (keeping hens with no rules) results in a state (A) that is worse for *everyone* (including, presumably *eventually*, the hen-keepers if foxes get them or disputes escalate) than an alternative state (C). The spillover (smell, attracting foxes) is the mechanism causing the Pareto domination. **This strongly suggests the reserved right "keep hens" was misdrawn in the first place.** It didn't account for the necessary conditions (secure coop, odour control) to prevent significant negative externalities affecting others.
      *   **Options:**
          1.  **Shrink/Redraw Reserved Zone (Preferred):** Amend the constitution. "Keep hens" is no longer an absolute reserved right; it becomes "Keep hens *in compliance with community standards for security and odour control*". **Cost:** High (2/3 AGM), but addresses the root cause. The procedure exposes the misdefinition.
          2.  **Refer to Membership:** Put the specific rule proposal (State C) to the AGM vote, *effectively overriding the strict interpretation of the reserved right in this instance*. **Cost:** Slow, but democratic. Less good than (1) as it doesn't fix the underlying definition.
          3.  **Override Right (Avoid):** Committee imposes State C. High cost (constitutional violation).
      *   **Outcome:** The procedure clearly flags the problem stems from the initial definition of the reserved matter. Recommendation: Pursue Option 1 (Amend Constitution) at AGM. If immediate action needed, Option 2 (AGM Vote on Rules).

  **Case 3: Wood Burning (Your Reserved Right vs. Health)**
  *   **Step 0: States:**
      *   `State A (Current):` You burn wood (per reserved matter), some smoke impacts.
      *   `State B (Proposal):` Ban wood-burning stoves in all units.
      *   `State C (Alternative):` You switch to a different heating source (e.g., electric), no wood burning.
  *   **Step 1: Reserved Matters/Decisive Pairs:**
      *   Difference between A and C: *Only* your choice of heating fuel (Reserved Matter). If you prefer A (wood): `C ===> A (You Decisive)`.
      *   Difference between A and B: Involves banning the activity (core reserved matter). If you prefer A: `B ===> A (You Decisive)`.
  *   **Step 2: Unanimity & Problems:**
      *   **Unanimous Improvement?** Likely Claimed: *Everyone else* prefers State C (No Wood) or State B (Ban) over State A (You Burning). *If* the health impact is severe and demonstrable (e.g., nurse has asthma aggravated, engineer shows pollution monitors exceed limits affecting multiple households), and *if* switching is feasible, then **State A might be Pareto-dominated by State C** *for the collective*. BUT: You are part of "everyone". **Crucially: You prefer A (wood) over C (no wood).** Therefore, `A ---> C` is **NOT** Pareto, because *you* are worse off. There is *no* state that *everyone* (including you) prefers over A.
      *   **Conflict Arrow?** No direct conflict between a decisive pair and a Pareto pair, because no Pareto improvement *exists* that moves away from A. Others might prefer B or C over A, but not unanimously *including you*.
      *   **Pareto-Dominated?** State A is *not* Pareto-dominated because there is no other state *everyone* prefers. State B (Ban) might be worse for you than A, and maybe others dislike bans.
      *   **Cycle?** Unlikely.
  *   **Step 3: Branch C (Ordinary Disagreement).** **Diagnostic:** While there's a health argument and others dislike the smoke, the move away from the current state (A) is *not* a Pareto improvement because you lose your preferred heating method. Your reserved right is decisive in keeping A over C or B. **The procedure says your claim survives *unless* the health impact is so severe and widespread that *unanimously* everyone (including you rationally accepting the evidence) agrees State C is better than State A.** This is a very high bar. The cost of the ban is your loss of autonomy on a reserved matter. **Outcome:** The committee should likely vote against the ban (State B). If the health impact is severe, the path is Branch B Option 1 or 2: **Amend the constitution** (at AGM, 2/3 vote) to remove "heating fuel" as a reserved matter due to proven significant negative externalities (health), or **Refer the specific ban** to the AGM. The procedure shows overriding your right directly isn't justified by Sen/Arrow within the *current* rules, but the AGM can change those rules.

  **Short Case: Music vs. Sleep (Colliding Rights)**
  *   **States:** A: HH6 Loud Music late / HH7 Sleep disturbed; B: HH6 Quiet / HH7 Sleeps; C: HH6 Music w/ Headphones / HH7 Sleeps.
  *   **Decisive:** HH6 decisive for A over B (Music vs Quiet)? HH7 decisive for B over A (Sleep vs Disturbed)? *(Value Judgement: Are "playing music" and "undisturbed sleep" both absolute reserved matters? Likely conflict)*.
  *   **Pareto?** C (Headphones) might be Pareto-superior to A (Everyone better: HH6 gets music, HH7 sleeps). But is C better than B for HH6? If HH6 hates headphones, maybe not.
  *   **Problem:** If HH6 prefers A over C and HH7 prefers C over A, and there's `A ===> C? (HH6?)` vs `C ---> A? (Not Pareto, HH7 prefers C but HH6 prefers A)`. **No Pareto domination of A, no cycle.** Core issue: Two reserved rights ("play music", "quiet enjoyment") directly conflict between A and B. *Neither* HH6 nor HH7 is clearly decisive over the pair A vs B, as both rights are involved. **Branch C (Ordinary Disagreement) - BUT highlights ambiguous rights.** Committee must decide if one right trumps the other here (Value Judgement), or define limits (e.g., quiet hours) which might require **shrinking/redrawing reserved zones** (e.g., "music only until 11pm") via Branch A or B (if Pareto improvement like quiet hours exists) or AGM referral.

  **Candid Limits of the Procedure:**

  1.  **Scale (31 Households):** Identifying *all* decisive pairs exhaustively becomes messy. Focus only on households directly involved in the *specific* states being compared. Unanimity (Pareto) is harder to achieve but still testable ("Is there *any* pair where all 31 prefer X over Y?" - show of hands). Complexity increases, but core logic holds.
  2.  **Honest Preferences:** People might lie strategically. E.g., exaggerate dislike for a solar panel to block it. The procedure assumes honesty. Strategic voting can break the Pareto test and create false cycles. **Mitigation:** Frame questions carefully ("Which do you genuinely prefer?"), focus on concrete outcomes. There's no perfect solution; all voting systems suffer this.
  3.  **Degrees of Rights:** The procedure assumes binary states differing clearly on a reserved matter. If rights have degrees (e.g., "some noise allowed"), it struggles. **Workaround:** Define states capturing the key levels (e.g., "Quiet Hours 10pm", "Quiet Hours 11pm", "No Restrictions"). Treat the *level* as the choice. May require multiple tests or referral.
  4.  **Misfires (Confidently Wrong):** It can misfire if:
      *   States are poorly defined (miss key options).
      *   Decisive pairs are misidentified (misinterpret constitution).
      *   Pareto is misjudged (groupthink, not true unanimity).
      *   The "Value Judgement" points are handled poorly by the committee.
      *   **Biggest Risk:** Over-applying Branch B Option 1 (Override Right) based on weak claims of unanimity or harm. Stick rigidly to the tests.
  5.  **The Philosophers' Quarrel (Waivable Rights vs Fixed Pairs):** For your practical purpose, **it's just people arguing.** Your constitution defines rights as fixed spheres ("reserved matters") where the household is decisive. Sen formulated rights as decisive pairs. It's close enough for your operational needs. The "externality" argument in Sen's example is real (Prude is forced to know Lewd reads the book), just like your hen smell. The procedure already handles spillovers via the Pareto test and Branch B (Misdrawn Right). Don't lose sleep over the philosophical nuances; your procedure addresses their practical consequences.

  This gives your committee a structured way to move from messy arguments to diagnosing the *type* of problem (rights clash, inefficiency, ordinary disagreement) and choosing a responsible path forward, respecting your constitution while acknowledging its limitations. Good luck!
