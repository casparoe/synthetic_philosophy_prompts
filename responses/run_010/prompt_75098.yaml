answer: |-
  ### 1. Reconstruction of Moore's Position  
  Moore's account centers on *organic unities*: the value of a whole is not the sum of its parts' values. For **beauty**, the valuable whole is the *consciousness of a beautiful object*. Crucially, this requires:  
  - **Cognitive apprehension**: Correct perception of the object's intrinsic qualities (e.g., its form, color, harmony).  
  - **Appropriate emotion**: Affective response (admiration, pleasure) *to those apprehended qualities*.  

  Moore downgrades "mere emotion" (e.g., unfocused euphoria) because it lacks cognitive grounding. Value arises from the *relation* between the mind and the object's properties. Isolating emotion severs this unity, producing a lesser good.  

  For **personal affection**, the valuable whole is the *consciousness of loving a person for their mental qualities*. It requires:  
  - **Cognition**: Recognition of the friend's virtues (e.g., intelligence, kindness).  
  - **Emotion**: Affection *directed at those qualities*.  

  **Key distinctions from aesthetics**:  
  - Friendship's value hinges on *reciprocity*: mutual appreciation enhances the whole.  
  - The object is a *mind* (not an inert object), making the cognitive act more complex (assessing character).  

  **Role of organic wholes**:  
  - The whole (cognition + emotion + object) is intrinsically valuable. Its components (e.g., emotion alone) have negligible or no value separately.  
  - Consequences: Valuing the emotion *by itself* is a category error. Action/material goods derive instrumental value only by producing such wholes.  

  ### 2. Mapping Bloomsbury's Appropriation  
  **Retained elements**:  
  - The *ranking* of aesthetic appreciation and personal affection as supreme goods.  
  - Rejection of material pursuits as merely instrumental.  

  **Dropped elements**:  
  - **Cognitive requirements**: Bloomsbury downplayed Moore's insistence on veridical cognition of the object's properties.  
  - **Organic unity**: They treated emotion and personal relations as self-contained values, neglecting the structural role of the object.  
  - **Casuistry/rules**: Discarded Moore's consequentialist framework for right action (which demanded weighing outcomes to maximize goods).  

  **Specific questions**:  
  - **"Personal relations as supreme good"**: Moore *could not* endorse this slogan. His "friendship" whole requires cognition of virtues; Bloomsbury often prized affection *detached* from character appraisal (e.g., loyalty irrespective of merit). For Moore, this yields a lesser unity.  
  - **Bell's "aesthetic emotion"**: Moore’s cognitive condition directly opposes Bell. Bell’s “self-contained” emotion, divorced from object properties, is precisely the "mere emotion" Moore devalues. Bell’s project survives only if "significant form" implies objective properties—but Moore would reject the *self-containment*, as value requires the object’s presence.  

  **Distortion vs. license**:  
  Dropping cognition/organicity was a *distortion*: Moore argues these are constitutive. Dropping rules was *licensed* only if Bloomsbury rejected Moore’s consequentialism—but they offered no alternative framework, violating his coherence.  

  ### 3. Adjudicating Diagnoses  
  - **Diagnosis A (transmission failure)**: Better fits the record. Bloomsbury valued *truncated states*: affection without character appraisal (Forster) or aesthetic emotion without cognition (Bell). By Moore’s criteria, these *are* less valuable than his wholes. The episode shows his theory’s internal standards exposing Bloomsbury’s misappropriation.  
  - **Diagnosis B (abridgment failure)**: Partially valid—discarding rules *did* cause practical failure—but secondary. The core issue was misidentifying the *goods themselves*. Evidence for B would require Bloomsbury to have valued Moore’s exact wholes but misapplied his rules; Keynes implies they altered the goods.  
  - **Proposed Diagnosis C (ontological flattening)**: Bloomsbury psychologized Moore’s realist ontology. They treated "states of mind" as self-validating, whereas Moore embedded consciousness in a relation to objective properties. This enabled their intuitive particularism.  

  ### 4. Keynes’ Complaint and Moore’s Resources  
  **Where the complaint lands**:  
  - Primarily on *Bloomsbury’s interpretation*, not Moore’s theory of value. Moore’s goods require cognitive engagement with the world (objects, virtues), which *could* ground engagement with institutions.  
  - Secondarily on Moore’s **theory of right action**: His consequentialism *demands* weighing large-scale outcomes, but Bloomsbury discarded this.  

  **Moore’s resources for self-diagnosis**:  
  - His cognitive requirement directly indicts Bloomsbury: if affection disregards the friend’s *actual qualities* (e.g., moral reliability), the organic whole degrades.  

  **Silences in Moore’s theory**:  
  - **Agent-relativity**: Moore offers no basis for *duties to particular friends*. Value is agent-neutral: one should promote valuable states (friendships) universally. Loyalty to a specific person is unjustified unless it maximizes good overall.  
  - **Material preconditions**: Moore is silent on how societal structures (e.g., peace, wealth distribution) enable aesthetic/friendly states. His focus on intrinsic goods obscures their dependence on instrumental bases.  
  - **Unreliable objects**: If a friend’s "virtues" are misreported (e.g., self-deception), Moore’s whole loses value—but he doesn’t address how to detect such cases or manage resulting conflicts.  

  ### 5. Conclusion  
  - **Settled**: The episode confirms that Moore’s goods *cannot be reduced to subjective states*. His insistence on cognitive fidelity to objects—whether artworks or friends’ virtues—is validated by Bloomsbury’s failure: their truncated pursuits lacked the structure he deemed essential for supreme value.  
  - **Left open**: Whether Moore’s ideal states are *psychologically sustainable or socially functional* as life-organizing principles. The Bloomsbury experiment suggests they may encourage detachment from systemic demands (politics, consequences)—but Moore’s own rules might counter this if retained. The theory’s viability in a complex world remains untested.  

  ---

  **Note on reconstructions**: Moore’s emphasis on *correct cognition* of object properties (PE §§113-115) is pivotal. If misrecalled, Bloomsbury’s distortion appears less severe—but his critique of "mere emotion" (§121) anchors the analysis. The mutual cognition requirement in friendship (§125) is explicit; overlooking this obscures why their "personal relations" deviate.
