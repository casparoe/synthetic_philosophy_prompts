prompt: |-
  so I'm writing the codebook for a little cliometrics-ish project and I'm stuck on the concept before I even get to the coding. Four of us code events (coups, banking panics, coalition collapses, that sort of thing) and assign each one a "redundancy count" — my name for it — meaning the number of distinct minimally sufficient sets of antecedent conditions the sources actually attest to. Nobody's numbers agree, and I think that's because no one has said what the concept is supposed to do.

  Before I read another chapter on causation in history, write me the spec. What does any adequate account of causal overdetermination and multi-causal explanation in history have to deliver? For each requirement, give the case or consideration that forces it, and mark it either non-negotiable or just the local prejudice of one camp (the counterfactual-dependence people, the mechanism/process people, the sufficiency-condition crowd, the narrative historians who think this whole project is a category error). I'd want these somewhere in the mix: whether the count is allowed to shift when you redescribe the event at a finer or coarser grain; the difference between two genuinely seperate routes and one route counted twice (the coup succeeds because the armored column moves on the palace *and* because the president's own ministers had already scheduled his removal for that same night — is that two conspiracies or one conspiracy wearing two hats); routes that were sufficient but got preempted so they never fired; whether a route that's only sufficient given a big pile of standing background conditions counts as a route in its own right; and whether an account that says basically every event in a densely connected world is multiply caused is broken or just telling an uncomfortable truth. Also tell me which single requirement does the most work ruling candidates out, since that's the one I want to code around.

  Exactly six numbered items, a sentence or two each, no intro and no conclusion: items one through five are requirements with their motivating case and the non-negotiable/prejudice tag, and item six is the pair of requirements you think can't both be met, plus a word on which one people quietly give up.
reasoning: |-
  We are constructing six numbered items. Each of the first five is a requirement for an adequate account of causal overdetermination and multi-causal explanation in history. For each requirement, we provide:
   1. The requirement itself.
   2. A case or consideration that forces it.
   3. Tag as non-negotiable or the prejudice of a specific camp.

  The sixth item is a pair of requirements that cannot both be met, with a note on which one is usually given up.

  Here we go:

  1. **Requirement: The account must distinguish between genuinely distinct causal routes and the same causal route described in multiple ways.**  
     **Case/Consideration:** The example of the coup succeeding because of the armored column and the president's ministers planning removal on the same night. If these are two independent plans, they are two routes; if they are part of one coordinated plan, it is one route.  
     **Tag:** Non-negotiable (common to all camps that accept causal overdetermination).

  2. **Requirement: The account must be invariant under redescription of the event at different grains of analysis (finer or coarser).**  
     **Case/Consideration:** Redescribing a banking panic at the level of individual bank runs vs. systemic collapse. The redundancy count should not arbitrarily change with the level of description.  
     **Tag:** Non-negotiable (especially for the mechanism/process and sufficiency-condition camps).

  3. **Requirement: The account must exclude preempted causes (routes that were sufficient but did not actually operate because another cause preempted them).**  
     **Case/Consideration:** A preempted coup plot that would have succeeded but was preempted by the actual coup. It should not count as a redundant cause because it did not contribute.  
     **Tag:** Non-negotiable (counterfactual-dependence camp insists on this; mechanism camp might agree).

  4. **Requirement: The account must address whether a route that is only sufficient given background conditions counts as a distinct route.**  
     **Case/Consideration:** A banking panic that occurs only because of existing fractional reserve banking. Is the banking system a background condition or part of a distinct causal route?  
     **Tag:** Prejudice of the mechanism/process camp (who emphasize the need to specify mechanisms that work against a background) vs. the sufficiency-condition crowd (who may bundle background conditions into the cause).

  5. **Requirement: The account must not collapse into the trivial claim that every event in a densely connected world is multiply caused (i.e., it must avoid overcounting).**  
     **Case/Consideration:** In a complex historical event (like the outbreak of WWI), there are many contributing factors, but not all are minimally sufficient sets.  
     **Tag:** Non-negotiable (all camps except perhaps some narrative historians who reject the project).

  6. **Pair of requirements that cannot both be met: Requirement 2 (invariance under redescription) and Requirement 4 (handling background conditions as part of a distinct route).**  
     **Explanation:** If we require invariance under redescription (2), then a shift in grain (e.g., from "banking panic" to "bank run at Bank X") changes the background conditions and thus what counts as a distinct route. But requirement 4 demands a clear stance on whether background conditions are part of the cause.  
     **Which one is given up:** Requirement 4 is often compromised by the mechanism camp, who allow that background conditions are not part of the causal route but necessary for it to operate, thus avoiding overcounting. Alternatively, the sufficiency-condition camp may bundle background conditions, making the count grain-dependent (violating 2). In practice, people quietly give up strict invariance (requirement 2) by fixing a grain of analysis for the project.

  Note: The above is a concise representation. The sixth item is the conflict and the typical resolution.
answer: |-
  1. **Distinguish genuine causal multiplicities from descriptive duplicates.**  
     *Case:* The armored column and ministers' plot in the coup - if they are independent, count as two; if coordinated, one. Redundant descriptions of a single route inflate counts artificially.  
     *Tag:* Non-negotiable (all camps except narrative historians, who reject quantification).  

  2. **Be invariant under event redescription at different grains.**  
     *Case:* Describing a banking panic as "systemic collapse" (coarse) vs. "runs on Banks A, B, C" (fine) must not alter redundancy counts without explicit justification.  
     *Tag:* Prejudice of mechanism/process camp (demands grain-stable mechanisms).  

  3. **Exclude preempted sufficient routes.**  
     *Case:* A backup coup plot foiled by the primary plot - it was sufficient but never activated, so shouldn't count. Including it overstates actual redundancy.  
     *Tag:* Non-negotiable (counterfactual-dependence camp's core demand).  

  4. **Handle background conditions consistently as non-routes.**  
     *Case:* A coalition collapse that requires pre-existing ethnic tensions - the tensions are necessary but insufficient alone; counting them as a "route" conflates context with cause.  
     *Tag:* Prejudice of sufficiency-condition crowd (who may bundle backgrounds into causes).  

  5. **Avoid trivial universal overdetermination in dense systems.**  
     *Case:* WWI's outbreak had myriad contributing factors, but redundancy counts must capture only *minimally sufficient* sets, not all conditions.  
     *Tag:* Non-negotiable (prevents collapse into useless "everything causes everything").  

  6. **Irreconcilable pair: Requirement 2 (grain invariance) vs. Requirement 4 (backgrounds as non-routes).**  
     *Conflict:* Fixing grain for invariance (2) clashes with excluding backgrounds (4) - e.g., finer grains make background conditions appear as distinct routes.  
     *Quiet surrender:* Requirement 2 is jettisoned; projects fix an arbitrary grain (e.g., "national crisis") to sidestep the issue.
