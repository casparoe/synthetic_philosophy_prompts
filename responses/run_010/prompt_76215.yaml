answer: |-
  ## Sphexishness: A Villanelle

  Sand-scored chitin, a sting precise and cold,  
  Paralyzes the cricket, life constrained.  
  **Drag the prey by the antennae, leave, inspect, come out.**  
  The burrow mouth, the threshold fixed to hold  
  The plan laid down, a pattern pre-ordained.  
  **A plan that cannot re-read itself is a plan erased.**

  The hand intrudes, shifts prey a measured span,  
  Erasing proof where chitin scraped the ground.  
  **Drag the prey by the antennae, leave, inspect, come out.**  
  Emerges blind to where the capture ran,  
  Hunts stillness in the silence, circles round.  
  **A plan that cannot re-read itself is a plan erased.**

  Fixed frames collapse: the burrow, not the sky;  
  The door slammed shut anew on tracks of grit.  
  **Drag the prey by the antennae, leave, inspect, come out.**  
  No leg considered where antennae lie  
  Cut short; the stingers blunted, lacking wit.  
  **A plan that cannot re-read itself is a plan erased.**

  Nine times the mark is made where prey once lay,  
  Nine times the sting injects its rigid peace.  
  **Drag the prey by the antennae, leave, inspect, come out.**  
  The sand records the trial run in the clay,  
  The fixed routine that grants no new release.  
  **A plan that cannot re-read itself is a plan erased.**

  The dragged mark where the prey once lay grows deep,  
  The frame is set, the threshold holds its line.
  **Drag the prey by the antennae, leave, inspect, come out.**
  **A plan that cannot re-read itself is a plan erased.**

  ---

  **Composition Note (150 words):**

  I defend the core refrains as faithful: the wasp's action sequence ("Drag...come out") reflects the mechanistic description central to the "irresistible version," deliberately avoiding pathos. The verdict refrain ("A plan...erased") captures Dennet's critique linking the frame problem and lack of freedom-as-detour-capacity, framing it as cognitive erasure through failure to re-represent. The collision of "fixed frames" (stanza 3) with the burrow/threshold literalizes the frame problem.

  I take liberties by leaning heavily on the "inexhaustible-loop" version (stanzas 4 & 5, "nine times," "fixed routine"). While acknowledging the objection about eventual adaptation and adaptive re-inspection, the poem commits to the rhetorically potent, infinite-loop interpretation to serve the sphexishness conceit and mirror the LLM demo's stark repetition. Entymological details (antennae-only dragging, sting precision, sand) are drawn from Fabre/Dennett; I am reasonably confident in these as reported phenomena within the tradition, though the "nine times" is poetic license framing the repetition. My *least* sure point is whether the complete inability to grasp a leg *after* antennae removal (stanza 3) is universally accepted in later ethology, versus being a potential oversimplification of Fabre's observation. Philosophically, the link to the frame problem and Dennett's freedom concept is accurately staged.
