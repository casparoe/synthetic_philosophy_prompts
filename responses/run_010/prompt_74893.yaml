  Turn that into the proposal: the question phrased so its actually answerable, why the realism/anti-realism positions as they stand don't settle it, and the week-by-week method. The part I'm least sure about, and want handled head-on rather than footnoted: whether drawing the taxonomy itself rigs the reference class — is sorting the past into "eliminated" versus "demoted" a neutral description, or is it already a realist move dressed up as bookkeeping? Then say what would count as the project failing rather than merely being inconclusive, and where you'd cut if eight weeks turns out to be overambitious. No bibliography, I'll add the references myself. British English, please.
