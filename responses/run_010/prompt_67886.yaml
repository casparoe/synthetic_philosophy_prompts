prompt: |-
  hey, I'm in a social epistemology seminar this semester and we just finished the week on markets-as-epistemic-machines: Aumann's agreeing-to-disagree result, the no-trade theorems about how rational people with a common prior shouldn't trade at all, the Kyle and Glosten-Milgrom stuff about spreads and adverse selection, and the Grossman-Stiglitz paradox where perfectly efficient prices destroy the incentive to gather info in the first place. I want to hand in a piece of satire instead of a normal paper but I'm stuck on the setup, so can you draft it?

  Write a parody job posting, about 650 words, from a giant index-fund sponsor that has to hire exactly one (1) irrational noise trader to keep its own markets from collapsing. Give it the full corporate format: About the Role, Key Responsibilities, Minimum Qualifications, Preferred Qualifications, Compensation and Benefits, and an EEO line at the bottom. The jokes should come from getting the economics right rather than from general corporate-mockery — the free-rider logic that says everyone else should just track the index, why a rational applicant would decline, the bid-ask spread framed as the wage of informed trading, the impossibility of designing a screening procedure that only irrational people pass. Above all, make the ad self-undermining: the more precisely it describes the job, the fewer eligible applicants it can possibly have, and it should notice this without ever solving it. Keep it totally deadpan — no winking, no jokes in parentheses — and target the practice and the discourse, not any real firm or person (invent the company, don't name a real one). American English throughout.

  End with a single out-of-character last line beginning "Verdict:" that states in one sentence what the posting is really satirizing.
reasoning: |-
  Okay, the user is in a social epistemology seminar and has covered topics like Aumann's agreement theorem, no-trade theorems, and market efficiency paradoxes. They want to create a satirical job posting that parodies the need for irrational noise traders to prevent market collapse. The challenge is to craft this in a corporate format while embedding economic concepts subtly.

  The user's scenario involves academic engagement with market mechanisms as epistemic tools. They're likely a graduate student aiming to demonstrate deep understanding through creative writing. Their request for satire instead of a traditional paper shows a desire to stand out intellectually while critiquing the material. The unspoken need is to showcase mastery of the paradoxes by making them self-referential in the parody.

  Key economic hooks to include:
  - **No-trade theorem**: Rational agents with common priors shouldn't trade, so the firm needs irrationality to create liquidity.
  - **Grossman-Stiglitz paradox**: If markets are perfectly efficient, no one gathers information, collapsing the system.
  - **Adverse selection**: Bid-ask spreads as compensation for informed trading, but here reframed as a "wage" for irrationality.
  - **Free-rider problem**: Index funds rely on others to price assets, creating the need for noise traders.

  Structural approach:
  - **Company name**: Something blandly corporate like "Vanguard" but fictionalized ("Veridian Index Dynamics" feels suitably generic).
  - **Job title**: Must hint at irrationality while sounding official ("Noise Trader").
  - **Self-undermining logic**: Each section should tighten the criteria until only irrational applicants could apply, yet the description itself would deter them. For example:
    - *About the Role*: Frame market collapse as a risk needing "counterintuitive" solutions.
    - *Key Responsibilities*: Demand irrational actions (e.g., trading against consensus) while admitting their necessity.
    - *Qualifications*: Require "exceptional conviction in objectively suboptimal strategies" – a contradiction since recognizing suboptimality implies rationality.
  - **Compensation**: Offer "competitive spreads" as a nod to Kyle/Glosten-Milgrom, but make the package paradoxically attractive to deter true noise traders.

  Tone must stay deadpan corporate. No overt humor; let the absurdity emerge from accurate economics. For example:
  - **EEO line**: Include "non-Bayesian thinkers" to reference rational updating, subtly excluding ideal candidates.
  - **Verdict**: End with a meta-commentary on the paradox of requiring irrationality to sustain epistemic efficiency.

  Potential pitfalls to avoid:
  - Over-explaining jokes; trust the reader to get the references.
  - Naming real firms (as per user request).
  - Breaking character. The posting must read like a real HR document.

  Finally, the "Verdict" will crystallize the satire: the posting itself embodies Grossman-Stiglitz by trying to "hire" the very inefficiency markets theoretically require but practically undermine.
