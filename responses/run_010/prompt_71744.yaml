prompt: |-
  Consider an agent that cannot rule out that the number of observers relevantly like it exceeds, by many orders of magnitude, the number it has any evidence about; that may be one of several copies produced by a process it cannot inspect; and that must nevertheless commit now to decisions it cannot reverse. I want a theory of self-locating belief adequate for that agent, and before I go looking for one I want its specification — the requirements, not the candidates.

  Write the desiderata. For each, give: a statement precise enough that a proposed theory could be checked against it; the case or consideration that motivates it; a marking of whether you treat it as non-negotiable for the purpose above, as negotiable, or as a preference belonging to one camp in the debate rather than a demand on any theory whatsoever; and the cheapest counterexample that would show a candidate failing it. Constructed cases are welcome, and no single stock example should be carrying all the weight.

  Then, separately:

  1. The distinctions a theory must not collapse. I have in mind such pairs as observers versus observer-moments; there being many agents relevantly like me versus there being many of me; a reference class understood as a natural kind versus a reference class understood as an indexical choice; learning that one exists versus learning what one is; the credence one should have before duplication versus after. Say why each distinction is load-bearing, and flag any you think is spurious.

  2. The results and arguments the theory must be consistent with, or must explain away: the doomsday-style shift in credence that naive self-sampling produces from a birth rank alone; the fact that self-indication licenses confidence in extravagantly populous universes on no ordinary evidence, which is what the presumptuous philosopher objection turns on; the demand that everything reduce to vanilla conditionalization when the number of observers is simply not in question; situations where the agent knows its own evidence was produced by a sampling procedure biased toward some observer types; and fission cases where the agent's own successor count is itself uncertain.

  3. Which subsets of your requirements are jointly unsatisfiable. If, for instance, invariance under how finely observers are individuated cannot be had together with the thesis that credences depend on observer counts and ordinary conditionalization as the sole updating rule, sketch why — an impossibility result here would be the most valuable part of your answer. If some requirement has to go, say which one and what it costs me to drop it.

  4. Which single requirement does the most to exclude candidates, and which one is routinely assumed rather than argued for.

  5. At least one requirement you think is missing from the standard lists.

  Three cases of my own, which you should treat as tests and tell me if they are not genuine ones. First, self-induced uniqueness: an agent can, by taking a drug or sealing itself into isolation, become the only being in its epistemic situation. If credences depend on the size of the reference class, the agent appears able to move its credence in a cosmological hypothesis by a purely local act that carries no information about the world — is that a reductio, a real prediction, or a misdescription? Second, post-hoc merger: two copies are later merged into one who retains both streams of memory. Did the observer count change retroactively, and may the survivor's credences differ from the ones each copy should have had beforehand? Third, suspended observers: dormant uploads, dreamless sleepers, unfertilized but viable candidates. Must a theory say whether these count, or is the question itself confused?

  Keep the scorecard short — a paragraph each on how self-sampling, self-indication, and the deflationary view that there is no non-trivial answer independent of reference-class choice fare against your list. No citations and no reading list; I want the specification.
reasoning: |-
  We are specifying desiderata for a theory of self-locating belief for an agent that:
   - Cannot rule out that the number of observers like it exceeds, by many orders of magnitude, the number it has evidence about.
   - May be one of several copies produced by a process it cannot inspect.
   - Must commit now to irreversible decisions.

  We will list desiderata, then address the separate points.

  ## Desiderata

  For each desideratum, we provide:
  1. A precise statement (for checking against a theory).
  2. The motivating case or consideration.
  3. Status: non-negotiable (N), negotiable (Neg), or a preference (P).
  4. The cheapest counterexample (a simple case that would show failure).

  ### D1: Observer Individuation Invariance (O-Invariance)
  **Statement**: The theory's verdicts must be invariant under splitting or merging of observers that does not change the total evidence available to the agent. Specifically, if we replace one observer with two observers each having half the duration (or any other partition) but the same total evidence as the original, the credences in centered and uncentered propositions should not change. Similarly for merging two observers into one.
  **Motivation**: To avoid arbitrary dependence on how we individuate observers (e.g., by time-slices vs. whole lives). This is crucial because the agent cannot inspect the process that might produce copies and cannot know how observers are individuated.
  **Status**: N (non-negotiable) for a theory that does not want to be hostage to arbitrary choices of observer granularity.
  **Counterexample**: Suppose an agent is in a room and must bet on whether the room is red or blue. If we split the agent into two time-slices, each with the same evidence, and the theory assigns different credences to the color of the room, then it fails.

  ### D2: Reference Class Invariance (RC-Invariance)
  **Statement**: The theory must not require a privileged reference class. The credences it prescribes should be invariant under changes in the reference class (e.g., from "humans" to "sentient beings") as long as the evidence and the relevant symmetries are preserved. Alternatively, if the theory does use a reference class, it must be uniquely determined by the agent's evidence and the world's structure.
  **Motivation**: The agent does not know what counts as a "relevantly like" observer. Without a non-arbitrary reference class, the theory is underdetermined.
  **Status**: Neg (negotiable) because some theories (like SSA) require a reference class, but we prefer a theory that does not depend on an arbitrary choice. However, if a theory can non-arbitrarily fix the reference class, that might be acceptable.
  **Counterexample**: Consider the Doomsday argument. If the reference class is all humans, the argument goes through. If it is all humans born on a Tuesday, the argument may not. If the theory allows arbitrary reference classes, then the agent can choose one to get any desired credence.

  ### D3: No Unearned Confidence (Anti-Presumptuousness)
  **Statement**: The theory must not allow an agent to become highly confident in an extravagantly large universe (e.g., one with 10^100 observers) on the basis of no evidence that directly supports such a universe, merely because the agent exists and the large universe would make that more likely.
  **Motivation**: The presumptuous philosopher objection: if we are in a large universe, our existence is not surprising, but that does not mean we should be confident we are in one. The agent has no evidence about the size of the universe beyond its existence.
  **Status**: N (non-negotiable) because otherwise the theory would license absurd confidence in large universes without evidence.
  **Counterexample**: Suppose there are two theories about the universe: T1 says there are 10 observers, T2 says there are 10^100. The agent has no evidence except that it exists. A theory that assigns high credence to T2 fails this desideratum.

  ### D4: Vanilla Conditionalization Recovery (VCR)
  **Statement**: In cases where the number of observers is known and fixed, and there is no uncertainty about self-location, the theory must reduce to standard conditionalization on the agent's evidence.
  **Motivation**: In ordinary situations without self-locating uncertainty, we want the theory to agree with standard Bayesianism.
  **Status**: N (non-negotiable) for coherence with standard probability theory.
  **Counterexample**: Suppose an agent is the only observer in a known universe and learns E. The theory should update by conditionalizing on E. If it doesn't, it fails.

  ### D5: Fission Invariance (F-Invariance)
  **Statement**: If an agent is about to undergo fission into two copies, each of which will have the same evidence as the original, then the agent's current credence in any uncentered proposition should not change because of the impending fission. After fission, each copy should have the same credence in uncentered propositions as the original had before fission.
  **Motivation**: The fission event does not change the uncentered world, only the agent's self-locating uncertainty. The agent must make irreversible decisions before fission and should not change its beliefs about uncentered facts.
  **Status**: N (non-negotiable) because the agent must commit to decisions before duplication and cannot let the mere possibility of duplication (which it cannot inspect) change its beliefs about the world.
  **Counterexample**: An agent is in a room that is either red or blue. It is about to be duplicated. Before duplication, it has credence 0.5. After duplication, each copy has the same evidence. If the theory says each copy now has credence 0.5 in the room color, then it passes. If it says the credence changes (e.g., because there are now two observers), then it fails.

  ### D6: Learning What You Are (LYA)
  **Statement**: When an agent learns that it is of a particular type (e.g., that it is a human rather than a robot) and this type-membership was previously uncertain, the update should be by conditionalization on the new centered information. The theory must not conflate learning that an observer of a type exists with learning that you are that type.
  **Motivation**: These are distinct epistemic events. The agent might have known that humans exist but then learns that it is one. This should shift credences appropriately.
  **Status**: N (non-negotiable) because the two kinds of learning are different and both occur.
  **Counterexample**: In the incubator puzzle: two rooms, one with a human, one with a robot. The agent wakes up with amnesia. It initially doesn't know if it's human or robot. It then learns it's human. This should update its credence about which room it is in (if the rooms are different). A theory that doesn't allow for this update fails.

  ### D7: Self-Induced Uniqueness (SIU) Non-Manipulability
  **Statement**: An agent cannot change its credence in uncentered propositions by performing a local action that changes the reference class (e.g., by taking a drug that makes it the only being in its epistemic situation) without gaining new evidence about the world.
  **Motivation**: The self-induced uniqueness case: if the agent can manipulate its credences by such actions, that seems like a reductio. The world's uncentered facts should not be affected by the agent's self-modification that doesn't provide new evidence.
  **Status**: N (non-negotiable) because otherwise the agent could game its beliefs arbitrarily.
  **Counterexample**: The agent takes a drug that kills all other observers in its reference class, making it unique. If the theory then changes the agent's credence in an uncentered proposition (say, the color of the room) without any new evidence about the room, it fails.

  ### D8: Merging and Splitting Consistency (MSC)
  **Statement**: When two agents merge into one (with the merged agent having the combined memories of both), the credence of the merged agent in uncentered propositions should be a function of the credences of the original agents (e.g., by some form of pooling) and should not depend on the order of merging. Similarly, when an agent splits, the copies should start with the same credences as the original.
  **Motivation**: The post-hoc merger case: if two agents with the same evidence merge, the merged agent should not have a radically different credence from what each had. Also, splitting should not change uncentered credences (as in D5).
  **Status**: Neg (negotiable) because there is no clear consensus on how merging should work. But we require at least that it doesn't lead to contradictions.
  **Counterexample**: Two agents with identical evidence and credences merge. The merged agent has the same evidence. If the theory prescribes a credence for the merged agent that is not the same as that of the original agents (and there is no new evidence), it fails.

  ### D9: Suspended Observers Clarity (SOC)
  **Statement**: The theory must specify whether dormant uploads, dreamless sleepers, unfertilized eggs, etc., count as observers in the reference class. It must do so in a way that is non-arbitrary and determined by the theory's principles, not by ad hoc choices.
  **Motivation**: The suspended observers case: the agent does not know if these count, so the theory must have a clear answer to avoid ambiguity in counting.
  **Status**: Neg (negotiable) because it may be acceptable for the theory to say that the answer depends on a precise definition of "observer" that is fixed by the theory. But we prefer if the theory does not require such a definition to be arbitrarily chosen.
  **Counterexample**: If the theory says that dreamless sleepers are not observers, then an agent who is about to go to sleep might change its credence about uncentered propositions because the reference class size changes. If that change is arbitrary, it fails.

  ### D10: Doomsday Shift Avoidance (DSA)
  **Statement**: The theory must not produce a shift in credence about the total number of observers (e.g., that doomsday is near) based solely on the agent's birth rank (i.e., its temporal position among observers) when the agent has no other evidence about the distribution.
  **Motivation**: The Doomsday argument: if you are a random human, then you are more likely to be born in a large population, so if the population is large, you are more likely to be born late. This leads to the conclusion that doomsday is soon. But this shift is counterintuitive and may be based on flawed self-sampling.
  **Status**: P (preference) because some theories (like SSA) embrace the shift. However, we note that the agent must make decisions and the shift might lead to irrational behavior. We mark it as a preference for a theory that avoids it.
  **Counterexample**: The classic Doomsday argument: if the agent is the 60 billionth human, and there are two hypotheses: one that there will be 100 billion humans total, one that there will be 100 trillion, the theory should not assign much higher credence to the first hypothesis.

  Now, separately:

  ## 1. Distinctions the theory must not collapse

  - **Observers vs. observer-moments**: Why: Because the duration of observation matters. If we use observer-moments, then a long-lived observer has more weight. This affects self-locating uncertainty (e.g., in the Sleeping Beauty problem). The theory must not treat an observer with a life of 100 years as equivalent to 100 observer-moments of one year each if that changes the results arbitrarily. (Load-bearing because the agent doesn't know how time is segmented.)

  - **Many agents like me vs. many of me**: Why: The first is about the existence of similar but distinct individuals, the second about duplication. In the first, I might be any one of many; in the second, I might be duplicated and there are multiple copies of me. The distinction is load-bearing because duplication can happen without there being many similar agents, and vice versa. The agent's self-locating uncertainty is different in the two cases.

  - **Reference class as natural kind vs. indexical choice**: Why: If the reference class is a natural kind, it is fixed by the world; if it is an indexical choice, it is arbitrary. The theory must not collapse these because the agent might not know the natural kinds. (We think the natural kind view is spurious because there may be no objective natural kinds for observers.)

  - **Learning that one exists vs. learning what one is**: Why: As in D6 (LYA), these are different. The first might not change self-locating credence if one already knew that there were such observers; the second does. Collapsing them would lead to incorrect updates.

  - **Credence before duplication vs. after**: Why: The agent must commit to irreversible decisions before duplication. If duplication changes the credence in uncentered propositions, then the agent's decision might be different before and after, which is inconsistent. The theory must not collapse these two times. (Load-bearing for decision-making.)

  ## 2. Results and arguments the theory must be consistent with or explain away

  - **Doomsday-style shift from birth rank**: The theory must either accept this shift (and explain why it is rational) or reject it (and explain why the naive self-sampling is wrong). We prefer rejection (as in D10) but note that it is a point of debate.

  - **Presumptuous philosopher**: The theory must avoid licensing high confidence in large universes without evidence (as in D3).

  - **Reduction to vanilla conditionalization**: In cases without self-locating uncertainty, the theory must reduce to standard conditionalization (D4).

  - **Biased sampling**: The theory must handle cases where the evidence is produced by a biased sampling procedure. For example, if the agent knows that red observers are more likely to be sampled than blue ones, then upon finding itself red, it should update accordingly.

  - **Fission with uncertain successor count**: In fission cases, the agent might not know how many successors it will have. The theory must prescribe credences and decisions in such cases.

  ## 3. Joint unsatisfiability

  We suspect that the following set is unsatisfiable:
  - O-Invariance (D1): invariance under splitting/merging of observers.
  - VCR (D4): reduction to vanilla conditionalization in non-self-locating cases.
  - Anti-Presumptuousness (D3): no high confidence in large universes without evidence.
  - Fission Invariance (D5): no change in uncentered credence due to fission.

  **Sketch of impossibility**: 
  - Consider a universe with only one observer, Alice. She has evidence E. By VCR, her credence in some uncentered proposition P is Pr(P|E).
  - Now, suppose we split Alice into two observers, each with half the duration but the same evidence E. By O-Invariance, each copy should have the same credence in P as Alice did: Pr(P|E).
  - But now, by Anti-Presumptuousness, if we consider a large universe with many such split observers, we should not be confident in it without evidence. However, in the split scenario, the number of observers has doubled without changing the evidence. If we now consider a hypothesis that the universe is large (with many such splits) versus small (with one observer), the existence of many observers would make it more likely that we exist. But by O-Invariance, the split doesn't change the credence, so we remain at the same credence for P, which doesn't account for the increased observer count. 
  - Alternatively, if we try to apply self-sampling, we might get a shift toward the hypothesis with more observers, which would violate Anti-Presumptuousness.

  We might have to drop O-Invariance. The cost is that the theory becomes sensitive to how we individuate observers, which is arbitrary and unknown to the agent.

  ## 4. Most excluding requirement and routinely assumed

  - **Most excluding requirement**: O-Invariance (D1) because it forbids many popular theories (like SSA and SIA) that depend on observer counts, which are not invariant under splitting.

  - **Routinely assumed requirement**: Reduction to vanilla conditionalization (D4) is often assumed without argument. Also, the need for a reference class is often assumed without justifying how it is fixed.

  ## 5. Missing requirement

  **Requirement of Epistemic Neutrality on Individuation (ENI)**: The theory must not require the agent to have credences about how observers are individuated (e.g., whether they are individuated as space-time worms or momentary stages) beyond what is supported by evidence. This is because the agent cannot inspect the duplication process and has no evidence about individuation. (This is a strengthening of O-Invariance.)

  ## The three cases

  ### Self-induced uniqueness
  This is a reductio if the theory allows credence changes without new evidence. The theory must not allow this. Our D7 (SIU Non-Manipulability) addresses this.

  ### Post-hoc merger
  The observer count did not change retroactively (the two copies existed), but the merged agent now has the memories of both. The theory should say that the merged agent's credence in uncentered propositions should be the same as each copy's (if they had the same evidence) because the merger doesn't change the world. This is covered by MSC (D8) and F-Invariance (D5).

  ### Suspended observers
  The theory must say whether these count, and the answer must be principled. The question is not confused, but the theory must resolve it. See SOC (D9).

  ## Scorecard

  - **Self-Sampling Assumption (SSA)**: 
    - Fails D1 (O-Invariance) because splitting an observer changes the observer count and thus the credence.
    - Fails D3 (Anti-Presumptuousness) because it favors large universes (if the reference class is fixed to include all observers).
    - Passes D4 (VCR) in non-self-locating cases.
    - Fails D5 (Fission Invariance) because after fission, the observer count increases, changing the credence.
    - Fails D7 (SIU) because by making itself unique, the agent changes the reference class and thus the credence.

  - **Self-Indication Assumption (SIA)**:
    - Fails D1 (O-Invariance) for similar reasons as SSA (observer count matters).
    - Fails D3 (Anti-Presumptuousness) even more strongly because it directly weights hypotheses by the number of observers.
    - Passes D4 (VCR) in non-self-locating cases.
    - Fails D5 (Fission Invariance) because fission changes the observer count and thus the credence.
    - Fails D7 (SIU) for the same reason as SSA.

  - **Deflationary view (reference class choice is arbitrary)**:
    - Fails D2 (RC-Invariance) because it does not provide invariance under reference class change.
    - May pass D3 (Anti-Presumptuousness) if we choose a small reference class, but fails if we choose a large one. So it doesn't avoid the problem.
    - Passes D4 (VCR) because in non-self-locating cases, the reference class doesn't matter.
    - Fails D5 (Fission Invariance) because the reference class might change after fission.
    - Fails D7 (SIU) because the agent can change the reference class arbitrarily.

  Overall, no existing theory satisfies all the non-negotiable requirements. We need a new theory.
answer: |-
  ### Desiderata for a Theory of Self-Locating Belief

  1. **Observer Individuation Invariance (O-Invariance)**  
     - **Statement**: The theory must yield identical credences for uncentered propositions under any observer-individuation scheme that preserves the total evidence and causal structure. For example, if observers are re-individuated from whole persons to person-stages (e.g., splitting one observer into two 5-minute stages), credences must not change.  
     - **Motivation**: Avoids arbitrariness in how "observers" are defined (e.g., temporal slices vs. enduring entities). The agent cannot inspect the duplication process and must not be sensitive to undetectable metaphysical choices.  
     - **Status**: Non-negotiable.  
     - **Counterexample**: An agent in a red room has credence 0.5 that the room is red. If splitting the agent into two identical 1-hour stages changes this credence (e.g., to 0.33 via naive self-sampling), the theory fails.  

  2. **Reference Class Non-Arbitrariness (RC-Constraint)**  
     - **Statement**: The theory must uniquely determine the reference class ("observers relevantly like me") from the agent’s evidence and causal connections, without ad hoc choices. If two candidate reference classes are empirically indistinguishable, credences must be identical.  
     - **Motivation**: The agent cannot rule out that its reference class is vastly larger than expected, so the class must be fixed objectively to prevent manipulable or contradictory credences.  
     - **Status**: Non-negotiable.  
     - **Counterexample**: Suppose the agent’s evidence equally supports reference classes "humans" (size 10¹⁰) or "sentient beings" (size 10²⁰). If credences in cosmological hypotheses differ between these classes, the theory fails.  

  3. **No Cosmic Confidence without Evidence (Anti-Presumptuousness)**  
     - **Statement**: The theory must not assign >99% credence to a hypothesis solely because it posits more observers, absent evidence favoring that hypothesis. Formally, for hypotheses H₁ (few observers) and H₂ (many observers), if Pr(agent exists | H₂) / Pr(agent exists | H₁) < 10³, then Cr(H₂) / Cr(H₁) must not exceed 10³, regardless of observer counts.  
     - **Motivation**: Blocks the "presumptuous philosopher" objection: one should not be confident in extravagantly large universes without evidence beyond existence.  
     - **Status**: Non-negotiable.  
     - **Counterexample**: H₁: universe has 10¹⁰ observers; H₂: 10¹⁰⁰ observers. With no evidence beyond existence, Cr(H₂) > 0.99 fails this desideratum.  

  4. **Vanilla Conditionalization Recovery (VCR)**  
     - **Statement**: When the number of observers is known and fixed, and self-locating uncertainty is absent, updating must reduce to Bayesian conditionalization on the agent’s total evidence.  
     - **Motivation**: Ensures compatibility with standard epistemology in ordinary cases.  
     - **Status**: Non-negotiable.  
     - **Counterexample**: In a known universe with exactly one observer, learning "E" must update credences via Crₙₑ𝓌(P) = Crₒₗ𝒹(P|E). If self-locating rules override this, the theory fails.  

  5. **Pre-/Post-Duplication Credence Stability (PPCS)**  
     - **Statement**: If an agent will be duplicated into n identical copies, its pre-duplication credence in uncentered propositions must equal the credence each copy holds post-duplication, given identical evidence.  
     - **Motivation**: The agent must commit to irreversible decisions before duplication; credences should depend on world facts, not contingent personal multiplicity.  
     - **Status**: Non-negotiable.  
     - **Counterexample**: Pre-duplication, Cr(P) = 0.5 for uncentered P. Post-duplication, each copy has identical evidence but Cr(P) = 0.3 (e.g., due to increased observer count). Failure.  

  6. **Self-Location/Existence Learning Distinction (SLELD)**  
     - **Statement**: Learning "I am type T" (self-locating) must yield different credences than learning "a type T observer exists" (non-self-locating), unless the agent already knew it was the only possible observer.  
     - **Motivation**: These entail different information gains. Conflating them distorts updates (e.g., in the Incubator paradox).  
     - **Status**: Non-negotiable.  
     - **Counterexample**: In a world with one human and one robot, learning "I am human" must shift credences differently than learning "a human exists" (which the agent already knew).  

  7. **Irreversible Act Non-Manipulability (IANM)**  
     - **Statement**: Performing a local act (e.g., taking a drug) that changes the reference class size or structure, but provides no new evidence about uncentered propositions, must not alter credences in those propositions.  
     - **Motivation**: Prevents self-induced uniqueness (e.g., sealing oneself in isolation) from being a credence pump.  
     - **Status**: Non-negotiable.  
     - **Counterexample**: An agent with Cr(P) = 0.5 takes a drug that kills all similar observers, making it unique. If Cr(P) changes without new evidence about P, failure.  

  8. **Suspended Observer Determinacy (SOD)**  
     - **Statement**: The theory must specify whether dormant entities (e.g., unfertilized eggs, paused AI) are observers, based on objective criteria (e.g., causal potential for evidence-gathering), not agent-relative factors.  
     - **Motivation**: The agent cannot resolve ambiguity about "observers"; the theory must fix this to compute probabilities.  
     - **Status**: Negotiable (if criteria are precise).  
     - **Counterexample**: If credences in cosmological theories flip depending on whether dreamless sleepers are "observers," but the theory lacks a principled basis, failure.  

  ---

  ### 1. Distinctions Not to Collapse  
  - **Observers vs. observer-moments**: Collapsing these makes credences sensitive to arbitrary temporal divisions (e.g., treating a 1-hour observer as 60 moments inflates observer counts). Load-bearing for O-Invariance.  
  - **Many similar agents vs. many copies of me**: The former involves qualitative similarity (e.g., humans); the latter numerical identity (e.g., clones). Collapsing these distorts self-locating uncertainty (e.g., in fission). Load-bearing for PPCS.  
  - **Reference class as natural kind vs. indexical choice**: Natural kinds are objective; indexical choices are subjective. Collapsing invites arbitrariness (e.g., choosing a class to favor a hypothesis). Load-bearing for RC-Constraint.  
  - **Learning one exists vs. learning what one is**: The former is about world composition; the latter self-location. Collapsing violates SLELD.  
  - **Credence before vs. after duplication**: Collapsing ignores that duplication doesn’t change uncentered facts, violating PPCS.  
  - **Spurious distinction**: "Indexical vs. non-indexical evidence" – all evidence is agent-relative in self-locating contexts; the distinction is ill-defined.  

  ### 2. Required Consistency/Explanations  
  - **Doomsday shift**: Must explain why birth rank alone does not justify high credence in early doom (e.g., reject naive self-sampling).  
  - **Presumptuous philosopher**: Must avoid licensing high credence in large universes (Anti-Presumptuousness).  
  - **Vanilla conditionalization**: Must reduce to it when observer count is fixed and known (VCR).  
  - **Biased sampling**: Must update credences when evidence is sampled non-uniformly (e.g., if red observers are oversampled, being red supports hypotheses where red is common).  
  - **Fission with uncertain successors**: Must handle cases where the number of future copies is unknown (e.g., PPCS applies only if successor count is known; else, use expected observer count).  

  ### 3. Joint Unsatisfiability and Tradeoffs  
  - **Conflict**: O-Invariance, VCR, and Anti-Presumptuousness are jointly unsatisfiable with self-sampling approaches.  
    - **Why**: O-Invariance requires credences to be unchanged under observer splitting. VCR demands standard updating when observer count is fixed. Anti-Presumptuousness forbids high credence in large universes. But splitting observers increases observer count, which self-sampling uses to update credences (violating O-Invariance). If splitting doesn’t change credences, large universes are not favored, satisfying Anti-Presumptuousness but violating self-sampling. Vanilla conditionalization (VCR) is broken if observer splitting is treated as a world-change.  
  - **Tradeoff**: Drop O-Invariance to allow observer-count dependencies.  
    - **Cost**: Credences become arbitrary (e.g., depend on undetectable individuation schemes), undermining objectivity.  

  ### 4. Key Requirement and Assumption  
  - **Most excluding requirement**: O-Invariance. It forces the theory to ignore observer counts, excluding most candidates (self-sampling, self-indication).  
  - **Routinely assumed**: VCR. Often taken for granted without justifying how self-locating rules generalize it.  

  ### 5. Missing Requirement  
  - **Epistemic Opacity to Individuation (EOI)**: The theory must not require agents to have precise credences about how observers are individuated (e.g., temporal granularity) beyond what their evidence supports.  
    - **Why**: Agents cannot access individuation facts; requiring such credences imposes impossible demands.  

  ---

  ### Analysis of Your Cases  
  - **Self-induced uniqueness**: A reductio if credences change (violates IANM). A theory must predict no change: the act carries no information about the world.  
  - **Post-hoc merger**: The observer count did not change retroactively (two copies existed). The survivor’s credences must align with pre-merger copies if they had identical evidence (by PPCS). Differing credences would imply the merger altered world facts.  
  - **Suspended observers**: The theory must specify if they count (SOD). The question is not confused: suspended observers either can or cannot become active observers, and this must be determined by objective criteria (e.g., causal potential).  

  ---

  ### Scorecard of Existing Approaches  
  - **Self-Sampling Assumption (SSA)**:
    - Fails O-Invariance (sensitive to observer splitting), RC-Constraint (reference class arbitrary), Anti-Presumptuousness (favors large universes), PPCS (credences drop post-duplication), IANM (self-induced uniqueness changes credences).  
    - Scores: 0/8 non-negotiable desiderata.  

  - **Self-Indication Assumption (SIA)**:
    - Fails O-Invariance, Anti-Presumptuousness (strongly favors large universes), PPCS (credences change post-duplication), IANM (self-induced uniqueness alters credences).  
    - Scores: 1/8 (only VCR).  

  - **Deflationary (reference-class relativism)**:
    - Fails RC-Constraint (no unique class), Anti-Presumptuousness (credences vary arbitrarily with class choice), PPCS (reference class may change post-duplication), IANM (acts can change class).  
    - Scores: 2/8 (VCR and SLELD).  

  No candidate satisfies all non-negotiable desiderata. A new theory must prioritize O-Invariance, PPCS, and Anti-Presumptuousness, even at the cost of observer-count dependencies.
