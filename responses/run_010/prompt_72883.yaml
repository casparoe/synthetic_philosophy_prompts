  Okay, the user is preparing a graduate seminar case in philosophy of art, focusing on a national arts council's grant rubric. They've provided a detailed scoring system with five criteria and two notable features: exclusion of artist testimony about meaning and the coexistence of an achievement prize judged purely on the work itself. They want a paper that reconstructs the implied theory of art, contrasts it with Tolstoy, examines presuppositions vs administrative convenience, analyzes the dual-institution arrangement, and runs a Tolstoyan counterfactual.

  Hmm, this is a sophisticated request. The user clearly wants institutional documents to do philosophical work - to "bite on details" rather than slogans. They're suspicious of surface resemblances between the rubric and Tolstoy (especially the emotion criterion) and want that tested. The challenge is to avoid treating the rubric as a naive policy document while also resisting the temptation to over-interpret bureaucratic choices as deep philosophical commitments.

  First, reconstructing the implied theory: The 100-point distribution suggests a consequentialist view where art's value lies primarily in measurable social impact (55 points for reach and emotion) rather than intrinsic qualities. The emotion criterion is particularly telling - it treats artworks as causes of quantifiable psychological states, content-neutral and comparable across contexts. This assumes feelings are commensurable via self-reports. The innovation criterion's focus on formal novelty over mastery implies that "art" proper must push boundaries, separating it from craft. Banning artist testimony about meaning presupposes meaning resides entirely in audience reception - a hard reception theory.

  Now contrasting with Tolstoy: Superficially, both care about emotion transmission. But Tolstoy requires sincerity (artist's felt experience) which the rubric explicitly excludes. His "infection" depends on clarity and accessibility, while the rubric rewards formal novelty that likely reduces intelligibility. Most crucially, Tolstoy judges art by the moral quality of feelings transmitted, while the rubric is content-agnostic - any documented emotional change scores equally. The reach criterion might look Tolstoyan in wanting broad access, but for him universal accessibility serves moral union, while for the council it's about demographic representation.

  For presuppositions vs convenience: The council isn't strictly committed to causal psychology - they could defend the emotion metric as an auditable proxy. But when points directly determine funding, the proxy effectively becomes the value. The rubric is philosophically underdetermined at interesting points: A formalist could embrace the innovation criterion while rejecting emotion metrics; an institutional theorist might see the whole system as constituting "art" through bureaucratic recognition; a pragmatist could accept all criteria as contextually useful measures.

  The dual-institution analysis: Maintaining separate funding criteria and a peer-judged prize suggests either healthy pluralism or theoretical incoherence. It implies "art" isn't a unitary phenomenon - the prize honors aesthetic achievement while funding prioritizes social utility. This is unstable because the funding criteria will inevitably shape what gets made and thus what becomes eligible for the prize. Over time, the measurable-impact logic could corrode the prize's autonomy.

  Counterfactual: Adopting Tolstoy wholesale would require radical changes - evaluating artist sincerity, scoring feeling-content (only unifying emotions), prioritizing unaided intelligibility over novelty, potentially excluding professional artists who work in inaccessible forms. The hardest change for a contemporary council would be judging feeling-content - it's administratively messy and politically charged to privilege certain emotions as "unifying."

  Ultimately, the rubric best fits an instrumentalist view where art is a social technology for producing measurable outcomes. Tolstoy's partial presence in the emotion criterion is a confusion - his moral dimension is antithetical to the rubric's content-neutral quantification. The council should either eliminate the emotion metric or develop it coherently, but the current hybrid risks misapplying Tolstoyan language to very different ends.

  The user seems to want this analysis to provoke seminar debate, so I'll make the conclusions sharp - no hedging. The tone should be academic but vivid, showing how bureaucratic details encode philosophical choices. And since they know Tolstoy well, I can dive deep into contrasts without exposition.
answer: |-
  ## The Instrumentalized Affect: Unpacking the Implicit Aesthetics of an Arts Council Rubric

  This analysis reconstructs the implicit theory of art embedded within the national arts council’s grant application rubric, scrutinizes its relationship to Tolstoy’s expressivist model, assesses its philosophical commitments and underdeterminations, evaluates the significance of its coexistence with a separate achievement prize, and explores the counterfactual adoption of Tolstoy’s framework. The conclusion argues that the rubric embodies a consequentialist, instrumentalist, and administrative theory of art’s value, fundamentally opposed to Tolstoy’s core principles despite superficial resemblances, and that its structure inevitably shapes artistic production in ways potentially corrosive to the values enshrined in the parallel prize.

  **1. Reconstructing the Rubric’s Implicit Theory of Art**

  The council’s point allocation reveals a hierarchical valuation of art’s functions, presupposing specific ontological and axiological stances:

  *   **Art as Social Technology (Reach & Participation - 30 pts):** Art’s primary value derives from its capacity to mobilize and engage specific demographics. The scoring emphasizes scale ("number of participants") and depth of interaction ("co-making scores highest"), presupposing that art’s worth is proportional to its quantifiable social impact on designated groups. Art is implicitly a tool for social inclusion and participation, its value extrinsic and measurable by audience metrics. The focus on "under-represented communities" further implies art serves a corrective or redistributive social function.
  *   **Art as Causal Agent of Measurable Affect (Evidence of Emotional Effect - 25 pts):** This criterion makes the strongest ontological claim. It presupposes that an artwork *is* a causal mechanism producing discrete, quantifiable psychological states in recipients. The requirement for a "short self-report instrument" administered "before and after" implies a belief in:
      *   *Causal Isolation:* The artwork’s effect can be isolated from other influences and measured at a specific point in time.
      *   *Commensurability:* Feelings ("moved," "connected," "changed perspective") are comparable across individuals, contexts, and artworks via a standardized scale. "Moved" by a community mural is presumed quantitatively comparable to "moved" by an avant-garde string quartet.
      *   *Content-Neutrality/Formalism of Affect:* The *content* of the feeling ("what" one feels connected *to*, "what" perspective changes) is irrelevant. Only the *fact* and *magnitude* of change matter ("ambition of projected change"). The instrument measures affect intensity, not meaning. Value resides solely in the documented *effect*, irrespective of the feeling's object or moral valence.
      *   *Psychological Reductionism:* Complex aesthetic experience is reducible to self-reported states captured by a brief instrument. The "rigor" sought pertains to methodological reliability in detecting these states, not interpretive depth.
  *   **Art as Formal Innovation (Artistic Innovation - 20 pts):** This criterion presupposes a historical ontology for art. "Art" proper is defined by its departure from established conventions ("formal novelty"). Accomplishment within a "settled idiom" is relegated to the status of "craft" (implied by its low score). Value is linked to perceived progress or disruption within an art form’s internal history. This creates a tension: Why measure audience affect (55 combined points) if the core artistic value lies in pushing formal boundaries that may alienate the very audiences whose engagement is prioritized? The implicit answer is that formal innovation is valued *instrumentally* – not as an end in itself, but as a potential *means* to generating novel experiences measurable under Criterion 2 or engaging new audiences under Criterion 1. The artist’s mastery is secondary to novelty.
  *   **Art as Managed Project (Delivery & Legacy - 25 pts):** These criteria presuppose art is akin to a deliverable social service or research project. Value lies in feasibility ("risk management"), professional execution ("delivery capacity"), and tangible, persistent outputs ("archive," "dataset," "training method") that extend the project’s utility beyond the immediate event. Art is valued for its durable, documentable products and efficient administration.

  **The Exclusion of Artist Testimony:** This rule decisively locates meaning and value *outside* the artist. The artist’s stated intention or felt experience is deemed irrelevant evidence for what the artwork "does." This presupposes a **hard reception theory**: meaning and effect reside entirely in the audience's experience, objectively measurable through the prescribed instruments. The artist is reduced to an initiator of a causal chain terminating in audience states or social metrics. This relegates the creative act and its internal significance to a black box, relevant only for predicting successful delivery (Criterion 4).

  **In Sum:** The rubric presupposes art is a social and psychological *technology*. Its value is instrumental, residing in its capacity to produce measurable outcomes: demographic participation, quantifiable emotional shifts in audiences, formal novelty contributing to art's perceived progress, and durable, administratively neat deliverables. Meaning is a function of audience reception, captured by standardized metrics. The ontology is causal-psychological (artwork as affect-cause) and consequentialist (value determined by measurable impact). The artist’s internal world is philosophically and evidentiarily excluded.

  **2. Tolstoyan Resonance and Radical Opposition**

  Superficially, Criterion 2 ("Emotional Effect") echoes Tolstoy’s core tenet: art’s purpose is transmitting feeling. However, the resemblance is skin-deep, collapsing under scrutiny at every pressure point:

  *   **Sincerity vs. Exclusion:** Tolstoy’s *sine qua non* is the artist’s "sincerity" – the genuine re-experiencing of the feeling communicated. The rubric’s explicit *exclusion* of the artist’s testimony about their experience or intention is anathema to Tolstoy. For him, without access to the artist’s sincerity, we cannot judge the work’s authenticity or power of infection. The rubric renders the artist’s inner state irrelevant and unknowable.
  *   **Individuality of Feeling vs. Formal Novelty:** Tolstoy values the "individuality" of the feeling transmitted – its uniqueness and specificity to the artist’s experience. The rubric values "formal novelty" – a property of the work’s structure relative to convention. Tolstoy condemns obscurity, borrowing, and contrivance ("marks of bad art") precisely because they *hinder* infection. Formal novelty, especially the kind prioritized by the council (departure from convention), often *increases* obscurity and reduces immediate intelligibility, undermining the very clarity Tolstoy deems essential for infection. Innovation, for Tolstoy, would concern finding clearer, more universal forms for sincere feeling, not novelty for its own sake.
  *   **Content of Feeling vs. Content-Neutral Measurement:** Tolstoy’s judgment turns decisively on *what* is transmitted. Only feelings promoting universal Christian love and human unity possess true value. The rubric’s content-neutrality ("any documented change counts equally") is Tolstoy’s nightmare. Measuring the "ambition" of change irrespective of direction means funding art that could transmit feelings of division, cynicism, or despair as readily as unity, provided the self-report scores shift. Tolstoy would see this as valuing infection regardless of disease.
  *   **Universal Accessibility vs. Measured Reach:** Tolstoy’s ideal of "universal art" accessible to the untrained laborer prioritizes unaided *intelligibility* and *immediate emotional resonance*. The council’s "Reach" criterion prioritizes documented *participation* of designated groups. These are not synonymous. A project could achieve high "reach" (e.g., through community co-making workshops) without producing work accessible in the Tolstoyan sense (simple, direct, immediately moving to all). Conversely, a Tolstoyan artwork might be universally accessible but fail to document participation from specific designated groups using the council’s metrics. Reach is a bureaucratic category; universal accessibility is an aesthetic and moral ideal.

  **Conclusion:** While both systems acknowledge art’s connection to emotion, the rubric operationalizes this in a way fundamentally opposed to Tolstoy’s expressivism. It replaces sincerity with measurable affect, individuality of feeling with formal novelty, moral content with content-neutral intensity, and universal accessibility with demographic participation metrics. The rubric uses the *language* of feeling but evacuates it of Tolstoy’s core concerns: the artist’s authenticity, the moral quality of the feeling, and the clarity of sincere transmission. It is Tolstoy instrumentalized and stripped of his moral core.

  **3. Presuppositions, Convenience, and Underdetermination**

  Is the council committed to causal psychology, or merely to auditable proxies?
  *   **Strict Presupposition:** The rubric’s structure *strictly presupposes* that the *funding value* of art is determined by its measurable social and psychological impacts as defined by the criteria. Points are awarded *for* these measurable outcomes (projected reach numbers, evaluation instrument rigor, novelty level, documented legacy). The money follows the points. Therefore, for the purpose of allocating public funds, the council *is* committed to treating art as a technology producing these specific, measurable goods. The causal psychology underpinning Criterion 2 is not optional window dressing; it is the *evidentiary basis* for awarding nearly a quarter of the points.
  *   **The Proxy Defense Fails:** The common defense – that metrics are mere proxies for ineffable goods – collapses under the funding mechanism. Proxies are imperfect stand-ins. But here, the points *constitute* the competitive valuation. If "Reach" points are a proxy for "social value," but funding is allocated strictly by total points, then for funding purposes, "Reach" points *are* the social value. The underlying good becomes epiphenomenal to the allocation process. The rubric operationalizes value *as* the measurable indicators.
  *   **Areas of Underdetermination:** The practice is genuinely underdetermined regarding the *intrinsic nature* of art, allowing various theories to find partial footing:
      *   *Formalist:* Could embrace Criterion 3 (Innovation) as valuing art’s formal properties and progress, interpreting the audience criteria as unfortunate bureaucratic necessities. They might argue the *true* art happens in the innovation, the rest is social work.
      *   *Institutional Theorist (Dickie-esque):* Could see the entire funding apparatus as part of the "artworld" system conferring status. The rubric defines what counts as "fundable art" within this institution, regardless of intrinsic properties.
      *   *Pragmatist (Deweyan):* Could find resonance in the experiential focus (Criterion 2) and the emphasis on social interaction and legacy (Criterion 1 & 5), interpreting the metrics as flawed but pragmatic attempts to capture the quality of aesthetic *experience* and its social consequences.
      *   *Tolstoyan:* Could only partially recognize Criterion 2’s focus on emotion, but would vehemently reject its exclusion of artist sincerity, content-neutrality, and reduction to self-report metrics. The "Reach" criterion might be seen as a corrupted shadow of universality.

  The rubric’s core commitment is to *instrumental value* as defined by its specific measurable outcomes. Different theories can accept or reject *why* those outcomes matter or *what* art fundamentally is, but the funding logic binds the council to valuing those outcomes above others.

  **4. The Dual Institutions: Pluralism, Incommensurability, and Instability**

  The coexistence of the funding rubric and the peer-judged achievement prize, explicitly separated and sharing no members, is revealing.

  *   **Candid Acknowledgment or Theoretical Vacuum?** The arrangement is less a candid acknowledgment of incommensurable standards than a pragmatic refusal to impose a single, coherent theory of art’s value across all institutional functions. Funding prioritizes measurable social impact and innovation; the prize honors perceived aesthetic achievement judged on the work alone. It presupposes that "art" has *multiple kinds of value* that cannot be easily reconciled or ranked within a single framework, and perhaps *should not* be, given different institutional goals (resource allocation vs. symbolic recognition).
  *   **Presupposition about "Art":** It presupposes that "art" is not a monolithic entity with a single essence or value. It can be valued as a social intervention *or* as an aesthetic object. The prize focuses on the latter ("the submitted works alone"), implicitly rejecting the funding criteria (audience data, participation, reports) as irrelevant to *this specific kind* of judgment. This is a form of value pluralism.
  *   **Stability and Corrosion:** The arrangement is inherently unstable. The funding rubric, backed by significant resources, exerts immense pressure on artistic production. Artists seeking funding will tailor projects to maximize points: emphasizing measurable reach, designing for quantifiable emotional shifts via pre/post tests, prioritizing formal novelty over mastery, ensuring clear documentation plans. Over time, this shapes the *kind* of work being made – work optimized for the funding criteria. The pool of works eligible for the achievement prize will increasingly consist of works produced under this rubric. While the prize panel judges "the works alone," the works themselves are pre-selected and shaped by the values of the funding system. The funding logic, by virtue of its resource power, has a strong tendency to **corrode the independence** of the values celebrated by the prize. The prize becomes an island of aesthetic judgment surrounded by an ocean of instrumental production shaped by the rubric. The direction of corrosion flows from the resource-allocating mechanism (rubric) towards the symbolic recognition mechanism (prize).

  **5. The Tolstoyan Counterfactual: A Radical Overhaul**

  Adopting Tolstoy’s account wholesale would necessitate dismantling the current architecture:

  1.  **Evaluator:** Panels would need access to the artist’s character and testimony to assess *sincerity*. Peers or moral authorities might replace bureaucrats and social scientists.
  2.  **Testimony:** Artist testimony about their felt experience and intentions would be *central evidence*, not excluded.
  3.  **Scoring Content:** The *moral and religious content* of the feeling ("does it promote universal love and brotherhood?") would be paramount. Criterion 2 would shift from measuring affect intensity to judging feeling quality. Ambitious change towards division would score negatively.
  4.  **Formal Innovation:** Novelty would only be valued if it enhanced *clarity and universality of transmission*. Obscure or convention-breaking work for its own sake would score poorly. Mastery of clear, accessible forms would be prized.
  5.  **Reach vs. Intelligibility:** "Reach" would be replaced by a demand for *unaided intelligibility* to the broadest possible audience, particularly the simplest laborer. Participation metrics might persist, but only as evidence of accessibility, not as a separate good. Co-making would need to demonstrably produce sincere feeling, not just participation.
  6.  **Professional Artists:** Funding might shift away from professional artworld figures towards those deemed capable of transmitting the purest, most universal feelings, regardless of formal training or artworld recognition. Didactic or religious art promoting unity might be favored over autonomous aesthetic projects.

  **The Hardest Pill to Swallow:** The most difficult change for a contemporary council would be **scoring the content of the feeling** (Point 3 above). This requires:
  *   **Moral Judgment:** Making subjective, potentially contentious evaluations about which feelings are "good" and "unifying," opening the council to accusations of bias, censorship, or promoting a specific ideology (e.g., Tolstoy’s Christianity).
  *   **Administrative Intractability:** Developing reliable, auditable criteria for judging feeling content is vastly harder than counting participants or administering self-reports. It resists quantification and standardization.
  *   **Rejection of Pluralism:** It imposes a single, substantive moral framework on artistic value, contradicting liberal pluralism and the council’s likely desire for neutrality.

  This difficulty reveals the core of the current rubric’s actual values: **administrative rationality, quantifiable outcomes, and the avoidance of substantive moral/aesthetic judgment.** The council values what can be measured, audited, and defended bureaucratically, even if it means reducing art to its measurable social and psychological effects. Content-neutrality is not a philosophical stance but a bureaucratic shield. Tolstoy demands a leap into qualitative, moral evaluation that the current system is structurally designed to avoid.

  **Conclusion: Instrumentalism’s Triumph and Tolstoy’s Ghost**

  The grant rubric best fits a **consequentialist and instrumentalist theory** of art’s value. It treats art as a technology for generating measurable social participation, quantifiable psychological effects, formal novelty contributing to art’s perceived historical progress, and durable administrative deliverables. Its ontology is implicitly causal-psychological regarding affect, and its axiology is dominated by extrinsic, measurable outcomes. Meaning resides solely in audience reception, captured by standardized instruments, explicitly excluding the artist's voice. This is fundamentally opposed to Tolstoy’s expressivist, moral, and sincerity-based model. While the language of "emotional effect" creates a superficial echo, the rubric evacuates Tolstoy’s core concerns: the artist’s authentic experience, the moral content of transmitted feelings, and the necessity of clarity for universal infection.

  Tolstoy’s partial, spectral presence within the emotion criterion is **a confusion the council should eliminate**, not a resource to develop. The rubric uses the *rhetoric* of feeling while rejecting the philosophical and moral foundations that give that rhetoric meaning for Tolstoy. Developing it in a Tolstoyan direction would require dismantling the rubric’s core commitment to content-neutral quantification and administrative convenience, forcing the council into the very kinds of qualitative, moral judgments its structure is designed to avoid. The rubric’s true allegiance is not to art as profound human communication, but to art as a governable, auditable domain of social practice. Its coexistence with the achievement prize represents an unstable pluralism, where the instrumental logic of resource allocation inevitably shapes the artistic field, potentially undermining the autonomous aesthetic values the prize seeks to honor. The council operates not with Tolstoy’s vision, but with its measurable, bureaucratic shadow.
