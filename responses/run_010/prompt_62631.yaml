answer: |-
  ## Joint Statement on Units of Selection in System C  
  **Co-Signed by [Replicator Proponent] & [Multilevel Proponent]**  
  *(After Adversarial Collaboration)*  

  **Preamble:**  
  We agree that the system described for invertebrate *C* presents a rich case for analyzing evolutionary dynamics. Our disagreements stem from interpretation, emphasis, and definition, not mathematical inconsistency. Below, we outline points of consensus, clarify disputes, specify testable predictions, and identify unresolved questions.  

  ---

  ### 1. Points of Agreement  
  1.1 **Mathematical Predictability:**  
     The Price equation (or equivalent covariance partitioning) can describe frequency changes for:  
     - Bud-biased vs. disperser-biased **cell lineages** within colonies,  
     - Colony-level traits (e.g., "bud-bias dominance" or "mean larval output"),  
     - The **mobile policing element** (MPE).  
     Parameters include within-colony proliferation rates, colony fecundity, fusion rates, parasite prevalence, and MPE transmission costs.  

  1.2 **What Agreement Does *Not* Settle:**  
     - The ontological status of "units" (e.g., whether colonies *are* units or merely *appear* as such).  
     - Whether MPE spread is "for" colony benefit or its own.  
     - Whether multilevel frameworks are *necessary* or merely *convenient*.  

  ---

  ### 2. Disagreements Table  
  | Issue | Replicator View | Multilevel View | Substantive/Verbal | Crux |
  |-------|-----------------|-----------------|---------------------|------|
  | **Primary unit of selection** | Only replicators (cell-lineage alleles, MPE) are units. Colonies are temporary vehicles. | Selection acts *simultaneously* on replicators and interactors (e.g., cells, colonies). Colonies with heredity are units. | Substantive | Is selection *causally* operating on colony-level variation? |
  | **Group selection reality** | "Group selection" is reducible to individual replicator fitness differences. Colony-level effects are byproducts. | Group selection occurs when colony fitness differences cause evolution not predictable from within-colony selection alone. | Substantive | Does colony-level covariance *add explanatory power* beyond within-colony dynamics? |
  | **MPE classification** | MPE is a selfish replicator exploiting colony susceptibility to bud-bias. Alignment with colony fitness is incidental. | MPE spreads via group-beneficial policing. Its fitness depends on group structure, making it a group-selected trait. | Substantive | Is MPE spread driven *primarily* by within-group or between-group fitness effects? |
  | **Chimera status** | Fused chimeras lack coherent heredity; they are arenas for cell-lineage competition. | Chimeras are functional groups with heritable traits (e.g., mean bud-bias) affecting colony fitness. | Verbal (Definitional) | Does "heredity" require single-lineage descent? |

  ---

  ### 3. Testable Predictions & Cruxes  
  **Crux 1: Necessity of Group-Level Explanation**  
  - *Experiment:* Isolate colonies with identical within-colony bud-bias frequency but different *fusion histories* (high vs. low chimera formation). Measure larval output and survival under parasite pressure.  
    - **Replicator Prediction:** Fitness differences will correlate *only* with final within-colony genotype frequencies, not fusion history.  
    - **Multilevel Prediction:** Fusion history (affecting group trait heritability) will predict fitness independently of final genotype frequencies.  

  **Crux 2: MPE Spread Mechanism**  
  - *Experiment:* Introduce MPE into two metapopulations: one with high bud-bias/chimera fusion, one with low. Track MPE frequency in both bud-biased and non-bud-biased colonies.  
    - **Replicator Prediction:** MPE spreads faster where bud-bias *within colonies* is higher, regardless of colony-level outcomes.  
    - **Multilevel Prediction:** MPE spreads fastest where *between-colony variation* in bud-bias is highest, due to policing benefits.  

  **Crux 3: Chimera Heredity**  
  - *Observation:* Measure correlation between parent colony traits (e.g., larval output) and offspring colony traits *in fused vs. non-fused lineages* across generations.  
    - **Replicator Prediction:** Heredity correlation near zero for fused lineages; high for non-fused.  
    - **Multilevel Prediction:** Significant heredity in fused lineages if kin fusion is common.  

  ---

  ### 4. Key Classifications  
  - **Mobile Policing Element (MPE):**  
    - *Replicator view:* Selfish replicator. Spreads due to within-colony advantage when bud-bias is present, and neutral drift elsewhere. Costly in non-chimeric colonies.  
    - *Multilevel view:* Group-selected trait. Its spread is amplified by between-group selection against bud-bias-dominated colonies.  
    - **Agreement:** MPE dynamics *can* be modeled as either, but differ in emphasis. Neither view denies the math.  

  - **Fused Chimeras as a Level:**  
    - Heredity exists *if* fusion is non-random (e.g., kin-biased). Field data shows ~70% of fusions occur between relatives (r ≈ 0.25). Thus:  
      - **Agreement:** Chimera traits show measurable heritability under kin fusion, making them a *potential* unit.  

  ---

  ### 5. Unresolved Question & Data Needed  
  **Issue:** Does the parasite resistance in bud-biased cells *stabilize* group selection or *undermine* it by masking group costs?  
  - **Data Needed:**  
    - Quantify parasite density thresholds where resistance switches from net-beneficial to net-costly at colony level.  
    - Compare bud-bias frequency in high-parasite vs. parasite-free reefs with identical crowding.  
  - **Current Stance:** Neither model predicts this interaction robustly without precise parameters.  

  ---

  ### 6. Definitional Disputes: The "Unit" Debate  
  - **Replicator Definition:** A "unit of selection" must exhibit *heredity and differential replication* (e.g., genes, MPE).  
  - **Multilevel Definition:** A "unit of selection" is an entity with *heritable variation influencing fitness* at its level (e.g., cells, colonies).  
  - **Agreement:** ~40% of our dispute was verbal. "Unit" is context-dependent: replicators focus on *copying*, multilevel on *functional interaction*. The math remains identical.  

  ---

  **Conclusion:**  
  System C confirms that frequency changes are mathematically describable at multiple levels. Our divergence lies in whether "selection" *acts on* colonies or is *caused by* cell-lineage competition. We commit to testing the above predictions empirically. Future work must quantify parasite-resistance tradeoffs and kin selection in fusion. This collaboration clarifies that our positions are complementary frameworks, not mutually exclusive truths.  

  *Signed,*  
  **[Replicator Proponent]**  
  **[Multilevel Proponent]**  

  ---  
  **Note on Case Coherence:** Your system is internally consistent. The MPE’s ability to spread into non-bud-biased colonies imposes a cost without benefit, creating selection against the element itself in those contexts—a realistic "tragedy of the commons" for mobile elements. The fusion/kin dynamics align with known sessile invertebrate biology.
