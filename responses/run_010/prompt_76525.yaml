  Okay, I need to help this TA grade a student's essay on Aquinas and tyrannicide. The student's response is about 400 words, addressing whether Aquinas was the first to give a principled justification for tyrannicide. The TA wants a mark out of 25 and specific feedback that can survive an appeal, so I have to be precise and fair.

  First, I'll recall what I know about Aquinas. In *De Regno* and the *Summa Theologiae*, he discusses tyranny, sedition, and killing. The key points are: a tyrant rules for private gain, not common good; removing a tyrant can be justified if it's for the common good and no other remedies exist; but he heavily emphasizes caution due to risks like worse successors or civil strife. The doctrine of double effect is crucial here—intending the common good while accepting the tyrant's death as a side effect. Also, Aquinas builds on earlier thinkers like John of Salisbury, who wrote about tyrannicide in the *Policraticus* but more rhetorically.

  Now, evaluating the student's answer. The student claims Aquinas turned tyrannicide into an argument, not just a topos. That's strong—they reference *Summa* II-II q.42 on sedition and *De Regno*, showing Aquinas links tyranny to injustice and allows action if intolerable. But the student says Aquinas "attaches only a prudential caution," which might oversimplify; Aquinas is more hesitant, stressing that removal should be a last resort. 

  On the doctrine of double effect from II-II q.64 a.3, the student applies it correctly, noting the intent is deliverance, not death. However, Aquinas doesn't explicitly use this for tyrannicide; it's more about self-defense. The student infers it, which is reasonable but not directly stated, so I'll flag this as a point where specialists might disagree. 

  In *De Regno*, the student correctly says power can be revoked for abuse, but they add that Aquinas describes tyrants as "bestial" and implies it's not homicide. That's shaky—Aquinas doesn't equate tyrants to beasts in this context; he might call tyranny beastly, but the ruler is still human. Killing him would be homicide, just possibly justified. This is a clear error. 

  The comparison to John of Salisbury is good: the student notes Salisbury used exhortation and examples, while Aquinas provided theory. That's accurate and supports the "first principled justification" claim. 

  Overall, the answer is solid but has flaws. Strengths include correct citations of Aquinas's arguments and a strong grasp of the conditional nature of power. Weaknesses are the overstatement of Aquinas's permissiveness, the questionable extension of double effect, and the beast claim. Also, the student misses that Aquinas prefers non-lethal remedies first. 

  For the mark: out of 25, I'm thinking 21. It's above 20 because it shows understanding beyond a textbook—e.g., linking multiple texts and discussing intent—but loses points for inaccuracies. 

  Comments should be point-by-point: start with strengths, then clarify errors, note debatable inferences, and suggest fixes. For instance, tell the student to correct the beast analogy and emphasize Aquinas's caution more. This feedback will be fair and defensible in an appeal.
answer: |-
  ### Mark: 21/25  
  *(A strong answer showing good engagement with the texts, but with significant correctable errors that prevent a top-tier score.)*

  ---

  ### Feedback for the Student  
  *(Comments structured for clarity and appeal-proofing)*  

  **Strengths (Claims That Hold Up):**  
  1. **Core Thesis Supported:** You correctly identify that Aquinas reframes tyrannicide through a theory of office and the common good (*De Regno* I.6, *Summa* II-II q.42 a.2 ad 3). Your point that he transforms it from "exhortation" to a "principled argument" is well-taken and reflects scholarly consensus.  
  2. **Key Citations:** You accurately cite Aquinas’ distinction between king/tyrant (*Summa* II-II q.42 a.2 ad 3) and his prudential warnings about post-tyrannicide chaos (*De Regno* I.6).  
  3. **Conditional Authority:** Your reading of *De Regno* II.10 (re: power revocation for abuse) is sound. Aquinas *does* argue authority is conditional on serving the common good.  
  4. **Historical Context:** The contrast with John of Salisbury’s *Policraticus* is apt—Salisbury relies on rhetoric/examples, while Aquinas provides systematic theory.  

  **Shaky Claims (Specialists Might Reasonably Dispute):**  
  1. **"The deed remains permitted, only inexpedient":**  
     - Aquinas’ caution isn’t *merely* pragmatic; he insists tyrannicide is a **last resort** (*De Regno* I.6: "when no human recourse remains"). He prioritizes non-violent remedies (e.g., counsel, deposition). Your phrasing risks making him sound more permissive than he is.  
     - **Fix:** Clarify that Aquinas permits tyrannicide *only* when all else fails *and* the tyranny is intolerable—not that it’s "permitted but inexpedient" in all cases.  

  2. **Applying Double Effect (II-II q.64 a.7) to Tyrannicide:**  
     - Aquinas *never explicitly extends* the double-effect doctrine (intended good vs. unintended evil) to tyrannicide. He uses it for self-defense, not regicide. While scholars *debate* whether it can be inferred, this is interpretive.  
     - **Fix:** Avoid presenting this as Aquinas’ direct argument. Instead, note that later thinkers (e.g., Suárez) developed this connection, but Aquinas himself focuses on authority revocation, not the act’s moral mechanics.  

  **Flat Errors (Requiring Correction):**  
  1. **"One does not commit homicide against a beast":**  
     - Aquinas **never** dehumanizes tyrants or suggests killing them isn’t homicide. He calls tyranny "bestial" (*De Regno* I.3) as a metaphor for its irrationality, but the tyrant remains a human person. Killing him *is* homicide—potentially *justifiable*, but homicide nonetheless.  
     - **Fix:** Remove this claim entirely. Aquinas’ justification hinges on the *common good*, not dehumanization.  

  2. **"Aquinas attaches only a prudential caution":**  
     - His warnings go beyond prudence: they reflect his view that **sedition is a mortal sin** (*Summa* II-II q.42 a.2) *unless* the ruler is a tyrant. Even then, he stresses the *moral risk* of provoking greater evils (e.g., worse tyranny).  
     - **Fix:** Emphasize that Aquinas’ caution is both moral and pragmatic—he fears the sin of sedition *and* practical fallout.  

  **Areas for Improvement (Beyond Corrections):**  
  - **Address Omissions:** You overlook Aquinas’ preference for **institutional solutions** (e.g., checks on power in *De Regno* I.6). Tyrannicide isn’t his first option.  
  - **Sharpen "First" Claim:** While Aquinas systematizes the argument, earlier canonists (e.g., Manegold of Lautenbach) also linked tyranny to broken contracts. Briefly acknowledging this would strengthen your case.  

  ### Why 21/25?  
  - **Above Textbook Level:** You engage primary texts (*De Regno*, *Summa*) directly and grasp Aquinas’ core framework (office/common good).  
  - **Docked Points:** The "beast" error (-2) and overstatement of permissiveness (-1) are serious flaws. The double-effect inference (-1) is defensible but requires qualification.  
  - **No "Flat Wrong" on Core Thesis:** Your central argument (Aquinas as justifier via theory) stands, but precision matters for top marks.  

  This answer shows excellent potential—focus on textual precision and avoiding speculative extensions to hit 23+.
