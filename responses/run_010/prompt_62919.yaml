answer: |-
  ### Case: Municipal Energy Retrofit Program
  The city's Energy Office runs a retrofit program for buildings. At the outset, an architect assesses each building owner's disposition toward costly "deep retrofits" (e.g., insulation upgrades) if asked, with 80% accuracy. A lottery then determines the program's mode:  
  - **Arm A (50% probability)**: "Grant" mode. The owner receives a $10,000 grant if the assessment predicted they would do a deep retrofit if asked. No retrofit is required.  
  - **Arm B (50% probability)**: "Request" mode. The owner is asked to commission a deep retrofit, costing $1,000 if done. They may decline at no cost. The grant is unavailable.  

  The owner learns the mode after the lottery. The sealed assessment is revealed only after the decision (if in Request mode) or after the grant (if in Grant mode). The owner aims to maximize expected money.  

  #### Parameters
  - Probability of Arm A (Grant): \( p = 0.5 \)  
  - Probability of Arm B (Request): \( 1 - p = 0.5 \)  
  - Architect's accuracy: \( a = 0.8 \)  
  - Grant value: \( G = 10,000 \)  
  - Retrofit cost: \( C = 1,000 \)  

  #### Policy Comparison Table
  | Policy          | EU Calculation (Updateless)                                                                 | EU Value | Updateful EU (Time 0) |
  |-----------------|---------------------------------------------------------------------------------------------|----------|-----------------------|
  | Commit to retrofit | \( p \times a \times G + (1 - p) \times (-C) = 0.5 \times 0.8 \times 10,000 - 0.5 \times 1,000 \) | 4,000 - 500 = **3,500** | Not applicable       |
  | Commit to decline | \( p \times (1 - a) \times G + (1 - p) \times 0 = 0.5 \times 0.2 \times 10,000 \)           | **1,000** | **1,000**            |

  **Notes**:  
  - Updateless EU for "commit to retrofit" includes the cost in Arm B.  
  - Updateful EU at Time 0 reflects their stable expectation (consistent with declining in Request mode).  
  - No tuning: Outcomes hold for any \( G > \frac{(1-p)C}{p(2a-1)} \) (here, \( G > 2,500 \)) and \( a > 0.5 \).  

  ---

  ### Analysis  
  **1. Tracking Agent Recommendations Across Moments**  
  - **Time 0 (Before lottery)**:  
    - *Updateless*: Recommends committing to "retrofit" (EU 3,500 > 1,000). Ignores future news; optimizes from the prior.  
    - *Updateful (causal/evidential)*: Expects to decline in Request mode (dominant then). Thus, architect likely predicts "decline," so EU = \( p \times (1-a) \times G = 1,000 \).  
    - **Coincidence?** No: Updateless recommends action (commit to retrofit), updateful expects passive decline. Updateless refuses to condition on *the future irrelevance of the assessment in one arm* (e.g., in Arm B, the grant is gone, so assessment seems "wasted"). It is not a refusal to condition on news generally—only news that breaks beneficial correlations (here, between commitment and grant eligibility).  

  - **Time 1 (After learning arm, before assessment reveal)**:  
    - *Arm A (Grant)*:  
      - Updateless: Follows policy—no action.  
      - Updateful: No action.  
      - **Coincidence?** Yes: Both do nothing (assessment is sealed; no choice).  
    - *Arm B (Request)*:  
      - Updateless: Follows policy—plans to retrofit.  
      - Updateful: Chooses to decline (avoids cost).  

  - **Time 2 (After assessment reveal, only in Request mode)**:  
    - *Updateless*: Follows policy—retrofits regardless of assessment.  
    - *Updateful*: Declines regardless of assessment (grant is unavailable; cost dominates).  
    - **Coincidence?** No: Actions diverge.  

  **2. Choice at Time 0**  
  Nothing is chosen by an act of will; dispositions are fixed before assessment. The owner cannot revise their disposition to "commit to retrofit" because:  
  - Dispositions (e.g., willingness to retrofit) stem from ingrained traits (e.g., cooperativeness), not deliberate choice.  
  - The architect assesses these fixed dispositions; the owner cannot "fake" or alter them (accuracy < 100% allows for misprediction but not manipulation).  
  - **Updateless reasoning thus recommends a policy**, not an action. It is a theory of planning (selecting a rule for future states), not character. The students' objection conflates the *selection* of a policy (decision-relevant) with fixed dispositions (exogenous).  

  **3. Structural Feature and Its Deletion**  
  - **Feature**: The benefit (grant) is awarded in Arm A based on a *sealed assessment of Arm B behavior*, made before knowing the arm.  
  - **Deletion**: If the assessment occurs *after* lottery results (e.g., Arm A grant depends on a new assessment), then:  
    - Updateless and updateful both recommend declining in Request mode.  
    - Updateless EU for "retrofit" policy drops to \( p \times a \times G - (1-p) \times C = 3,500 \) → \( 0.5 \times 0.8 \times 10,000 - 0.5 \times 1,000 = 3,500 \) (same), but now no incentive to commit—updateful can "free-ride" by retrofitting only if Arm A occurs.  
    - **Verdict**: Updateless loses distinctness; divergence vanishes.  

  **4. Why "Bind Yourself Early" Fails**  
  Precommitment mechanisms (e.g., contracts) are absent; the owner cannot bind future actions. The benefit (grant) depends on an *assessment of dispositions*, not a binding agreement. "Binding" requires an audience or enforcement, but here:  
  - No one observes the owner’s Request-mode action (irrelevant to grant).  
  - The architect’s prediction is sealed; no reputational stake.  
  Thus, the updateful agent cannot "bind" to gain the grant—they are stuck with their fixed disposition (likely decline).  

  **5. Resemblance to Canonical Cases**  
  - **Most resembles**: Counterfactual mugging (paying in one state to satisfy a predictor’s counterfactual).  
  - **Realistic instantiation buys**:  
    - **Plausibility**: Replaces exotic predictors (e.g., Omega) with a fallible human assessor (80% accuracy) and institutional lottery.  
    - **No sci-fi**: Benefits/costs are mundane (grants/retrofits); no self-location or multiverse puzzles.  
    - **Highlight**: How institutions use pre-decision assessments (e.g., policy grants, loan approvals) to incentivize behavior the agent might later regret.  

  **6. Strongest Updateful Objection and Response**  
  - **Objection**: "In Request mode, the owner is asked to pay $1,000 for a grant that is already closed. This is a sunk-cost error—the benefit is lost regardless, so paying wastes money."  
  - **Response**: True locally (in Arm B), but updateless avoids global error. From Time 0, committing to retrofit yields +2,500 EU over updateful by securing the grant in Arm A. Conceding Arm B’s "sunk cost" loses the forest for the tree—updateless correctly preserves the ex ante optimal plan. **What survives**: Updatelessness handles cross-temporal correlations (here, between commitment and grant access) that updateful reasoning myopically severs.
