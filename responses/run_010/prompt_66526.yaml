     - C) The same proportion of applicants from each neighborhood should receive grants (equal approval rates).
     - D) The score should reflect the root causes of shutoff risk, not just predict the outcome.

  8. **Feasibility**: Do you believe it is possible to achieve all of the following at the same time: (1) the risk score is calibrated (means what it says) for every neighborhood, (2) the model has equal false positive rates and equal false negative rates for every neighborhood, and (3) the approval rates are equal across neighborhoods?
     - A) Yes, with a perfect model and enough data.
     - B) No, because these goals can conflict when base rates differ.
     - C) We can get close enough in practice that the conflicts are negligible.
     - D) The conflicts arise because we are using fixed neighborhood categories; we should define groups differently.

  **Scoring Key and Interpretation**

  First, check for impossible combinations:

  - If in Q6 you chose **B** (demand equal approval rates) and in Q7 you chose **A** (demand calibration), and in Q8 you chose **A** (believe it's possible), this combination is impossible when base rates differ. The reason: if the base rates are different, calibration implies that the risk distribution differs by group, and using a single cutoff will lead to different approval rates. To have equal approval rates, you would need to use group-specific cutoffs, which breaks calibration unless the risk distributions are identical.

  - If in Q7 you chose **A** (calibration) and **B** (equal error rates), but you can only choose one in Q7, so no issue.

  - Similarly, calibration (Q7A) and equal error rates (Q7B) together are also in tension with different base rates. In fact, calibration and equal false positive rates imply equal false negative rates only if base rates are equal. So if you value both, and base rates differ, it's impossible.

  We'll provide personalized feedback.

  To assign camps, we'll use a point system or a decision tree on the answers.

  Alternatively, we can map based on key answers.

  We'll define:

  - **Calibration Camp**: Q7=A and Q6=A and not (Q3=C or Q3=D) [if they adjust, they might not be pure calibration]
    But if they adjust for bias (Q3=B or D), they are not calibration purists. So: Q7=A and Q6=A and Q3=A

  - **Equal Error Rates Camp**: Q7=B and Q6=C

  - **Equal Outcomes Camp**: Q7=C and Q6=B

  - **Target Variable Problem Camp**: Q3=C or (Q3=B and Q7=D) or Q6=D

  - **Decision Rule Transparency Camp**: Q5=D and (Q8=B or Q8=D)

  - **Group-Blind Camp**: Q1=C and Q2=A or B (but specifically, they don't use group, so in Q2 they choose A or B based on score, and in Q1 they choose C to avoid group). Also, Q3=A (no adjustment by group), Q6=A

  - **Base Rate Gap as Injustice Camp**: Q6=D and Q7=D

  - **Deflationist Camp**: Q8=C

  But a person might not fit cleanly. We'll have to have a priority.

  We can also have mixed camps.

  Finally, we provide the feedback including the empty regions.

  This is a draft. In practice, we might need to test and refine.

