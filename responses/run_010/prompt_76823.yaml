  ### Black Box Activity Design: "The Representational Riddle"

  #### **Apparatus Setup**
  - **Inputs**: 24 index cards (inputs) with unique (Color, Shape) pairs:
    - Colors: Red, Blue (2)
    - Shapes: Circle, Square, Triangle, Star, Diamond, Heart (6)
    *Total: 2 × 6 = 12 pairs × 2 copies = 24 cards (for ample testing).*  
  - **Internal Slots**: 3 labeled envelopes (Slot A, Slot B, Slot C) behind a cardboard divider.  
  - **Outputs**: Two cards: "0" and "1".  
  - **Teams**: 
    - **Box Team (2-3 students)**: Manages envelopes and outputs using lookup tables.  
    - **Interpreter Teams (3 teams of 3-4 students)**: Investigate the box.  

  #### **Lookup Tables & Slot Rules**  
  *(Box Team uses these to set slots/output for each input)*  

  | Input (Color, Shape) | Slot A      | Slot B       | Slot C | Output |
  |----------------------|-------------|--------------|--------|--------|
  | (Red, Circle)        | Vertical    | 1            | East   | 1      |
  | (Red, Square)        | Vertical    | 1            | North  | 1      |
  | (Red, Triangle)      | Vertical    | 0            | West   | 0      |
  | (Red, Star)          | Vertical    | 0            | South  | 0      |
  | (Red, Diamond)       | Horizontal  | 1            | East   | 0      |
  | (Red, Heart)         | Horizontal  | 1            | North  | 0      |
  | (Blue, Circle)       | Horizontal  | 0            | West   | 1      |
  | (Blue, Square)       | Horizontal  | 0            | South  | 1      |
  | (Blue, Triangle)     | Horizontal  | 1            | East   | 0      |
  | (Blue, Star)         | Horizontal  | 1            | North  | 0      |
  | (Blue, Diamond)      | Vertical    | 0            | West   | 1      |
  | (Blue, Heart)        | Vertical    | 0            | South  | 1      |

  - **Output Rule**: Output = 1 if:  
    (Slot A = "Vertical" and Slot B = "1") OR (Slot A = "Horizontal" and Slot B = "0").  
    Otherwise, output = 0.  
  - **Slot C Rule**: Set to compass direction (N/S/E/W) based on Shape (e.g., Circle→East).  
    *Slot C is ignored for output.*  

  #### **Engineered Phenomena**  
  1. **Off-Path Slot (Slot C)**:  
     - Decodable (e.g., "Circle" always → "East"), but changing it manually *does not alter output*.  
  2. **Multi-Content Slot (Slot A)**:  
     - For Red inputs: "Vertical" = Color (all non-Diamond/Heart Reds are Vertical).  
     - For Blue inputs: "Horizontal" = Shape (all non-Diamond/Heart Blues are Horizontal).  
     - *No single gloss covers all inputs (e.g., "Slot A = Color" fails for Blue inputs)*.  
  3. **Genuine Tie (Slot B)**:  
     - Rival glosses:  
       - *Theory 1: "Slot B = 1 if Shape has pointy features (Triangle, Star, Diamond, Heart)"*  
       - *Theory 2: "Slot B = 1 if Shape has curved features (Circle, Square, Heart)"*  
     - Both theories predict Slot B perfectly for all inputs (Heart is both pointy/curved → always "1").  
     - Interventions on Slot B change output identically for both theories (e.g., setting Slot B=0 always forces output=0 if Slot A="Vertical").  
  4. **Behavioral Regularity (No Slot)**:  
     - Systematic regularity: Output = 1 for *all Circle inputs*.  
     - No single slot tracks this (Slot A/B change across Circles; Slot C is off-path).  
     - Teams may postulate a "Circle detector" slot (which doesn’t exist).  

  ---

  ### **Session Flow (100 Minutes)**  
  #### **Phase 1: Setup (10 min)**  
  - **0:00–0:05**: Explain rules. Interpreter teams get:  
    - **Budget**: 100 points.  
    - **Price List**:  
      - Input-output query: Free (first 10), then 2 pts/query.  
      - Read one slot: 10 pts/query (after input is given).  
      - Force-set one slot: 20 pts/intervention (after input, before output).  
  - **0:05–0:10**: Assign roles (Box Team + 3 Interpreter Teams). Distribute cards.  

  #### **Phase 2: Investigation (60 min)**  
  - **0:10–0:70**: Teams buy actions:  
    - Teams submit input cards to Box Team, request outputs/readouts/interventions.  
    - Box Team:  
      1. Resets envelopes to default (pre-loaded per lookup table).  
      2. If "force-set": changes specified slot per request.  
      3. Reveals output and/or slots (if paid).  
    - Teams document findings.  
    - *Budget forces trade-offs*: Teams can’t test all inputs → must theorize.  

  #### **Phase 3: Documentation & Scoring (20 min)**  
  - **0:70–0:80**: Teams submit:  
    - **Glosses**: Brief descriptions of each slot’s content.  
    - **Regularity Report**: Any systematic input-output patterns.  
  - **0:80–0:85**: Box Team runs **5 held-back test inputs** (e.g., (Blue, Circle), (Red, Diamond)):  
    - Teams stake 20 pts/gloss on correct predictions.  
  - **0:85–0:90**: Scoring:  
    - +50 pts for each slot gloss matching Box Team’s lookup rules.  
    - -30 pts for each incorrect gloss teams staked points on.  
    - +20 pts for identifying the Circle regularity.  
    - Candy/bragging rights for highest score.  

  #### **Phase 4: Debrief (10 min)**  
  - **0:90–1:40**: Guided discussion:  
    - **Off-Path Slot (Slot C)**:  
      - *Realist*: "It’s a representation (of direction), but unused!" → Demands causal role.  
      - *Instrumentalist*: "It’s predictive but not a ‘real’ representation—just an interpreter’s tool."  
    - **Multi-Content Slot (Slot A)**:  
      - *Polysemy debate*: Is it two context-dependent representations, one disjunctive mess, or not a representation at all?  
      - Illustrates underdetermination: Glosses are locally true but globally incomplete.  
    - **Genuine Tie (Slot B)**:  
      - *Realist*: "The tie is evidential—facts are fixed but hidden!" (assumes determinate content).  
      - *Instrumentalist*: "No fact breaks the tie—content is defined by use, not pre-existing."  
      - *Access limitation*: Interpreters lack training data (how Heart’s duality caused the tie). With training data, they’d see Heart shaped both theories—but *still* no fact breaks the tie.  
    - **Behavioral Regularity (Circle)**:  
      - Shows over-ascription: Behavior tempts "Circle detector" slot, but it’s emergent from Slot A/B interaction.  
  - **1:40–1:50**: Conclusion:  
    - Realism leans on causal/interventional validity (Phenomena 1, 4).  
    - Instrumentalism leverages underdetermination (Phenomena 2, 3).  

  ---

  ### **Predictable Issues & Fixes**  
  1. **Box Team Improv**:  
     - *Risk*: Forgetting to reset envelopes between queries.  
     - *Fix*: Provide checklist: "Reset slots → Apply input → Apply interventions → Compute output."  
  2. **Clever Interpreter Short-Cut**:  
     - *Risk*: Testing (Circle, all colors) to find regularity without slots.  
     - *Fix*: Allow it! They’ll still miss *why* it happens (Slot A/B interaction).  
  3. **Scoring Flaw**:  
     - *Risk*: Teams avoid staking points to dodge penalties.  
     - *Fix*: Mandate staking on at least 2 glosses; reward boldness.  
  4. **Tie Not Noticed**:  
     - *Risk*: Teams ignore Slot B due to cost.  
     - *Fix*: Hint: "Some slots are cheaper to decode but harder to gloss."  

  ---

  ### **Limitations vs. Real Neural Networks**  
  1. **No Learning/Weights**:  
     - The box is static; no weight changes or training dynamics.  
     - *Supply by talking*: Discuss how training data (e.g., Heart’s duality) fixes dispositions but not content.  
  2. **No Continuous/Probabilistic Outputs**:  
     - Binary outputs lack softmax probabilities or confidence scores.  
     - *Supply by talking*: Mention probes as "decoding lenses" vs. "causal structure."  

  ---

  ### **Materials & Assembly (For TA)**  
  - **Items**:  
    - 24 index cards (inputs: 2 colors × 6 shapes × 2 copies).  
    - 3 envelopes (labeled A, B, C), 2 output cards ("0", "1").  
    - Cardboard divider, pens, paper for teams.  
  - **Pre-Work (30 min)**:  
    1. Label input cards (e.g., "Red, Circle").  
    2. Pre-load Slot C rules (Shape → Direction) on a cheat sheet.  
    3. Print lookup tables for Box Team.  
  - **Budget/Scoring**: Use whiteboard for point tracking.  

  This design forces teams to confront the four representation claims operationally. The debrief maps their struggles to the realism-instrumentalism debate, highlighting how interpretability research faces these gaps even with real networks.
