believe either proposition simpliciter, only relative to a compartment. That is flatly at odds with (4) and (5), where I happily ascribed each conjunct. (8) A logician who accepts the premises of a thirty-step valid argument, is walked through it, and then says she already believed the conclusion. I think she is wrong: she came to believe it during the proof, and did not believe it before. (9) A system that stores p and p→q in a database and returns q only after running a search over its stored sentences. I am willing to say it believes q while the query is running, and unwilling to say it believed q the night before, which strikes me as an unstable position. (10) Belief seems to require conceptual capacity: someone without the concept of a prime cannot believe anything about primes, however much they could be told.

