      - Erasure of information must dissipate at least kT ln(2) per bit (Landauer's principle).
      - The resolution of Maxwell's demon via erasure is the standard one.
  - Disputed:
      - The foundational status of Landauer's principle (is it derived from the second law or fundamental?).
      - Whether there are other resolutions (but the information-theoretic one is widely accepted).

