  Scenario:

  Dr. Smith is evaluating a patient for a rare disease (H) which has a prior probability of 10%. The disease is serious, and a treatment is available but has significant side effects. The treatment is recommended only if the probability of H is at least 30%. There are two diagnostic tests available: a blood test (A) and a urine test (B). Each test is known to be somewhat unreliable due to confounding factors that cannot be controlled or measured at the time of testing. 

