  ### Handout: Updating Under Uncertain Evidence  
  **Thought Experiment: Diagnostic Sequencing in Clinical Decision-Making**  

  #### Scenario  
  Dr. Lee, an oncologist, assesses a patient for a rare aggressive cancer \(H\) (prior \(P(H) = 0.1\)). Treatment is life-saving if \(H\) is true but causes severe harm if \(H\) is false; it is only justified if \(P(H) \geq 0.3\). Two ambiguous tests are available:  
  - **Tissue test (\(A\)):** Checks for irregular cell patterns. Due to subjective interpretation and lab variability, it never yields certainty. Dr. Lee’s experience shows that upon taking it, she always sets \(P(A) = 0.6\).  
  - **Blood marker test (\(B\)):** Detects protein levels. Equipment limitations and noise prevent conclusive results. Experience shows it always leads her to set \(P(B) = 0.7\).  

  Medical data:  
  - **Among cancer patients (\(H\)):** 90% test positive on \(A\), 80% on \(B\).  
  - **Among cancer-free patients (\(\neg H\)):** 30% test positive on \(A\), 20% on \(B\).  

  Dr. Lee knows that test order affects her final \(P(H)\):  
  - If she takes \(A\) first, then \(B\), \(P(H) \approx 0.311\) (treat).  
  - If she takes \(B\) first, then \(A\), \(P(H) \approx 0.294\) (no treat).  
  To avoid unnecessary treatment, she chooses the order (\(B\) then \(A\)) that keeps \(P(H) < 0.3\).  

  #### Constraints Satisfied  
  1. **Inconclusiveness incurable:** Test ambiguity stems from inherent noise (lab variability/equipment limits); repeating tests doesn’t resolve it.  
  2. **No reinterpretation:** Dr. Lee’s conditional probabilities (based on medical data) remain fixed; only credences over \(A\) and \(B\) shift during updates.  
  3. **Foresight justified:** Dr. Lee predicts her responses (\(P(A) = 0.6\), \(P(B) = 0.7\)) from past identical tests. This doesn’t require "already having evidence"; it relies on known self-policies for ambiguous inputs.  
  4. **Rigidity condition:** Holds for each update. Conditionals for the *updated partition* are preserved (e.g., when updating \(A\), \(P(H|A)\) and \(P(H|\neg A)\) are fixed).  

  ---

  #### Calculations  
  **Prior probabilities:**  
  \[
  \begin{align*}
  P(H) &= 0.1, \\
  P(A|H) &= 0.9,  \quad P(A|\neg H) = 0.3  \quad \Rightarrow P_0(A) = P_0(A|H)P(H) + P_0(A|\neg H)P(\neg H) = 0.9 \cdot 0.1 + 0.3 \cdot 0.9 = 0.36, \\
  P(B|H) &= 0.8,  \quad P(B|\neg H) = 0.2  \quad \Rightarrow P_0(B) = P_0(B|H)P(H) + P_0(B|\neg H)P(\neg H) = 0.8 \cdot 0.1 + 0.2 \cdot 0.9 = 0.26, \\
  P_0(H|A) &= \frac{P_0(H,A)}{P_0(A)} = \frac{0.9 \cdot 0.1}{0.36} = 0.25,  \quad P_0(H|\neg A) = \frac{P_0(H,\neg A)}{P_0(\neg A)} = \frac{0.1 \cdot 0.1}{0.64} = 0.015625, \\
  P_0(H|B) &= \frac{P_0(H,B)}{P_0(B)} = \frac{0.8 \cdot 0.1}{0.26} \approx 0.3077,  \quad P_0(H|\neg B) = \frac{P_0(H,\neg B)}{P_0(\neg B)} = \frac{0.2 \cdot 0.1}{0.74} \approx 0.0270.
  \end{align*}
  \]

  **Order 1: Update on \(A\) (to \(P_1(A) = 0.6\)), then on \(B\) (to \(P_2(B) = 0.7\))**  
  - Step 1 (Update \(A\)):  
    \[
    P_1(H) = P_0(H|A) \cdot P_1(A) + P_0(H|\neg A) \cdot P_1(\neg A) = 0.25 \cdot 0.6 + 0.015625 \cdot 0.4 = 0.15 + 0.00625 = 0.15625.
    \]  
  - Step 2 (Update \(B\)):  
    - *Rigidity preserves \(P_1(H|B)\), \(P_1(H|\neg B)\) under \(P_1\)*:  
      \[
      \begin{align*}
      P_1(H|B) &\approx 0.4255, \quad P_1(H|\neg B) \approx 0.04425 \quad (\text{details: next page}), \\
      P_2(H) &= P_1(H|B) \cdot P_2(B) + P_1(H|\neg B) \cdot P_2(\neg B) = 0.4255 \cdot 0.7 + 0.04425 \cdot 0.3 \approx 0.29785 + 0.013275 = 0.311125.
      \end{align*}
      \]  
    **Final \(P_2(H) \approx 0.311\)** → Treat (\(> 0.3\)).  

  **Order 2: Update on \(B\) (to \(P_1(B) = 0.7\)), then on \(A\) (to \(P_2(A) = 0.6\))**  
  - Step 1 (Update \(B\)):  
    \[
    P_1(H) = P_0(H|B) \cdot P_1(B) + P_0(H|\neg B) \cdot P_1(\neg B) \approx 0.3077 \cdot 0.7 + 0.0270 \cdot 0.3 \approx 0.21539 + 0.0081 = 0.22349.
    \]  
  - Step 2 (Update \(A\)):  
    - *Rigidity preserves \(P_1(H|A)\), \(P_1(H|\neg A)\) under \(P_1\)*:  
      \[
      \begin{align*}
      P_1(H|A) &\approx 0.4633, \quad P_1(H|\neg A) \approx 0.03949 \quad (\text{details: next page}), \\
      P_2(H) &= P_1(H|A) \cdot P_2(A) + P_1(H|\neg A) \cdot P_2(\neg A) = 0.4633 \cdot 0.6 + 0.03949 \cdot 0.4 \approx 0.27798 + 0.015796 = 0.293776.
      \end{align*}
      \]  
    **Final \(P_2(H) \approx 0.294\)** → Do not treat (\(< 0.3\)).  

  ---

  #### Analysis  
  **(a) Results**  
  - **\(A\) then \(B\):** \(P(H) \approx 0.311\) → Treat.  
  - **\(B\) then \(A\):** \(P(H) \approx 0.294\) → Do not treat.  
  Decision flips based on order.  

  **(b) Structural Feature**  
  Non-commutativity arises because:  
  - The partitions \(\{A, \neg A\}\) and \(\{B, \neg B\}\) are **not independent**; each test is evidence about \(H\) and thus indirectly about the other.  
  - **Conditionals shift**: Updating on one test (e.g., \(A\)) changes \(P(H|B)\) and \(P(H|\neg B)\) (e.g., \(P_0(H|B) \approx 0.3077\) vs. \(P_1(H|B) \approx 0.4255\) after updating \(A\)).  
    - *Check*: If tests were uninformative about \(H\) (e.g., \(P(H|A) = P(H|\neg A) = P(H)\)), or if partitions were independent, order would not matter.  

  **(c) Normative Verdict**  
  This does not indict Jeffrey conditionalization (JC) as irrational. Instead, it shows JC is **incomplete** without:  
  - A **supplementary requirement** to update on the **joint partition** \(\{A \cap B, A \cap \neg B, \neg A \cap B, \neg A \cap \neg B\}\) in one step.  
  - For an agent who cannot handle the joint partition (e.g., due to cognitive limits), JC permits order-dependent "exploits," but this is a limitation of the agent, not the norm.  

  **(d) Reply and Assessment**  
  - **Defender’s reply:** The two tests are one body of evidence; updating should occur on the joint partition, not sequentially.  
  - **Assessment:** In this case, the reply **fails**. Dr. Lee *cannot* update jointly because:  
    - She receives evidence sequentially (she controls order).  
    - The joint partition (4 cells) is complex; she lacks resources to compute it in practice.  
    JC thus faces a dilemma: It allows order-sensitivity for bounded agents, but forbidding sequential updates is unrealistic.  

  ---  
