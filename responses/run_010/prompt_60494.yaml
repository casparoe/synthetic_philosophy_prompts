  (a) Both orders are worked through.

  (b) The structural feature: the two partitions are not independent, and the hypothesis H is differently correlated with the two tests. Specifically, the conditional probabilities of H given one test change when we update on the other test because the tests are evidence about H and thus about each other. If the partitions were independent or if H were independent of the tests, the order would not matter. To check: if we make the tests independent and also make them uninformative about H (say P(H|A)=P(H|¬A)=P(H)), then the update would not change P(H) and order wouldn't matter.

  (c) The case does not indict Jeffrey conditionalization as irrational. Instead, it shows that the norm is incomplete because it does not specify the order of updates when multiple pieces of evidence are obtained sequentially. The norm should be to update on the joint partition of the two experiences. However, if the agent cannot entertain the joint partition (which has 4 cells), then she must choose an order. The case shows that the choice of order can be exploitable.

