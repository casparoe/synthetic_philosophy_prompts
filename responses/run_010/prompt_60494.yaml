  **Appendix: Detailed Conditionals for Rigidity**  
  *For instructors (not on handout)*:  
  - **After updating \(A\) (Order 1), compute \(P_1(H|B)\):**  
    \[
    \small
    \begin{align*}
    &P_1(H,A) = P_0(H|A)P_1(A) = 0.25 \cdot 0.6 = 0.15, \quad P_1(\neg H,A) = P_1(A) - P_1(H,A) = 0.45, \\
    &P_1(H,\neg A) = P_0(H|\neg A)P_1(\neg A) = 0.015625 \cdot 0.4 = 0.00625, \quad P_1(\neg H,\neg A) = 0.39375. \\
    &\text{Rigidity: } P_1(B|H,A) = P_0(B|H) = 0.8, \quad P_1(B|\neg H,A) = P_0(B|\neg H) = 0.2 \quad (\text{conditionals preserved}). \\
    &P_1(H,B) = [P_1(H,A) \cdot P_1(B|H,A)] + [P_1(H,\neg A) \cdot P_1(B|H,\neg A)] = (0.15 \cdot 0.8) + (0.00625 \cdot 0.8) = 0.125, \\
    &P_1(B) = P_1(H,B) + [P_1(\neg H,A) \cdot P_1(B|\neg H,A)] + [P_1(\neg H,\neg A) \cdot P_1(B|\neg H,\neg A)] = 0.125 + (0.45 \cdot 0.2) + (0.39375 \cdot 0.2) = 0.29375, \\
    &P_1(H|B) = \frac{P_1(H,B)}{P_1(B)} = \frac{0.125}{0.29375} \approx 0.4255.
    \end{align*}
    \]  
  - **After updating \(B\) (Order 2), compute \(P_1(H|A)\):**  
    \[
    \small
    \begin{align*}
    &P_1(H,B) = P_0(H|B)P_1(B) \approx 0.3077 \cdot 0.7 \approx 0.21539, \quad P_1(\neg H,B) = 0.48461, \\
    &P_1(H,\neg B) \approx 0.0081, \quad P_1(\neg H,\neg B) = 0.2919. \\
    &\text{Rigidity: } P_1(A|H,B) = P_0(A|H) = 0.9, \quad P_1(A|\neg H,B) = P_0(A|\neg H) = 0.3. \\
    &P_1(H,A) = [P_1(H,B) \cdot P_1(A|H,B)] + [P_1(H,\neg B) \cdot P_1(A|H,\neg B)] \approx (0.21539 \cdot 0.9) + (0.0081 \cdot 0.9) = 0.201141, \\
    &P_1(A) = P_1(H,A) + [P_1(\neg H,B) \cdot P_1(A|\neg H,B)] + [P_1(\neg H,\neg B) \cdot P_1(A|\neg H,\neg B)] \approx 0.201141 + (0.48461 \cdot 0.3) + (0.2919 \cdot 0.3) = 0.434094, \\
    &P_1(H|A) = \frac{P_1(H,A)}{P_1(A)} = \frac{0.201141}{0.434094} \approx 0.4633.
    \end{align*}
    \]
