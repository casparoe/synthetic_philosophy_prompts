prompt: |-
  I teach a graduate seminar in moral psychology and metaethics, and our final session takes up a question I find genuinely unsettled: whether the descriptive psychology of political moralities — moral foundations research above all — tells us anything whatever about which side of a left–right dispute is right. My students assume the answer is an easy no, on grounds of the genetic fallacy and the is–ought gap. The colleague whose work we will be reading, a philosopher I will call H., has written a series of papers in which she rules, case by case, on whether a given empirical finding has normative upshot, and her rulings look inconsistent to my students. I suspect they are not, but I want the suspicion tested before I put it in front of a room. Here is the track record as I have compiled it.

  On the studies in which incidental disgust — a foul smell in the room, a filthy desk, a nauseating film clip — makes subjects' moral condemnations harsher, she holds that these do real normative work: not that the judgments so produced are false, but that the subjects lacked warrant for them, so that any political argument leaning on purity intuitions loses its evidential support. On the questionnaire finding that conservatives endorse all five foundations roughly evenly while liberals weight care and fairness most heavily, she holds that this is no evidence that conservatism is right, though it is evidence against any normative theory treating care and fairness as jointly exhaustive of the moral domain — descriptive breadth, she says, bears on theory choice rather than on particular verdicts. On the inequity-aversion experiments with capuchin monkeys, she holds that continuity with other primates buys nothing: a monkey's refusal of a cucumber while its neighbor receives a grape does not tell us whether inherited inequality is unjust, and naturalness is no mark of truth. On the several-fold cross-cultural variation in ultimatum-game offers, she holds that the variation counsels modesty about treating one population's fairness intuitions as data, but does not lower confidence in fairness-based claims, because the variation is explained by market integration and the scale of cooperation — an explanation, she insists, that is silent on whether such claims are true. And on a large multi-site comparison reporting that harm-based judgments show the least cross-population variance and the least movement under incidental manipulations, she holds that this makes harm-based claims better warranted than purity-based ones, an asymmetry she states outright.

  The new case is a preprint that arrived last week, and I want to know what she will say about it before I ask her. A team working with a small-scale pastoralist population reports, first, that their instruments detect robust loyalty and authority effects and robust harm effects but essentially nothing that looks like a fairness foundation: no inequity aversion in their distribution tasks, and no condemnation of cheater scenarios that involve neither harm nor betrayal. Second, and more interestingly, the team reports that when their own undergraduate subjects are run through a manipulation designed to reproduce features of that ecology — anonymous and non-repeating allocators, acute scarcity framing, no reputational audience — the subjects' fairness judgments move substantially and reversibly in the same direction, while their harm judgments do not move at all. The question I will put to H. is whether this finding bears on the credibility of our own convictions about distributive justice, say the conviction that a society permitting vast inherited inequality is unjust, and if so, how.

  Predict her verdict. Then do the harder work. Lay out the candidate rules that would generate all five of her earlier rulings; I claim there are at least three live ones — one keyed to the reliability of the belief-forming process, one keyed to whether non-moral causes are of a specifically incidental or arousal-based kind, and one keyed to whether the moral fact is doing any explanatory work in the first place — and they do not converge on this preprint. Then evaluate a fourth rule of my own devising, which I have not yet published and which I would like you to break if you can: what matters is not the reliability of the process but whether the non-moral cause is an irrelevant cue, external to the situation judged, or a morally relevant parameter of that situation, one to which the correct verdict might itself be responsive. On that rule the disgust cases debunk, the ultimatum-game variation does not, and the capuchin case is untouched; but I confess that her fifth ruling, crediting harm's stability with positive warrant, is the one that strains the proposal. Say whether the rule can absorb that ruling, and if not, which of the two must give. Close by telling me the single cheapest further case — one study, one manipulation — that would discriminate among the leading rules, and say what result would favor which.

  Please write to me as you would write a letter: continuous prose throughout, with no headings, no bullet points, no boldface, and no tables. Do not trouble yourself with citations or a bibliography; I know these studies and will supply the references myself. Twelve hundred words is ample.
reasoning: |-
  Hmm, the user has presented me with an intricate puzzle in moral psychology and metaethics. They're teaching a graduate seminar, and their final session focuses on whether empirical findings about political moralities can tell us which side in a left-right dispute is correct. Their students think it's an easy "no" due to the genetic fallacy and is-ought gap, but colleague "H" seems to have a more nuanced position that appears inconsistent to students.

  The user has compiled H's rulings on five cases: disgust studies (undermines warrant), moral foundations questionnaire (bears on theory scope but not particular verdicts), capuchin monkey inequity aversion (no normative relevance), ultimatum-game variation (counsels modesty but doesn't undermine fairness claims), and harm judgment stability (grants positive warrant). Now there's a new preprint about a pastoralist population showing no fairness foundation but robust loyalty/authority/harm responses, with a manipulation showing Western subjects' fairness judgments shift under certain conditions while harm judgments remain stable.

  The user wants me to: predict H's verdict on the new preprint, identify candidate rules explaining all five rulings, evaluate the user's own proposed rule about "irrelevant cues" versus "morally relevant parameters," and suggest a discriminating test case.

  This is fascinating but complex. I need to reconstruct H's implicit principles. From the cases, she seems to distinguish between incidental influences (like disgust smells) that seem to undermine warrant versus ecological variations that don't. Her distinction between descriptive breadth affecting theory choice versus particular judgments is crucial. And her granting positive warrant to stable harm judgments suggests she thinks cross-situational stability might indicate reliability.

  For the new preprint, I suspect H would say the fairness variation doesn't undermine specific fairness convictions because the ecological manipulation makes the variation "non-incidental" - it's tied to features of the situation. The pastoralists' lack of fairness responses might challenge comprehensive moral theories but not specific judgments about inequality.

  For candidate rules: 
  First, a reliability rule where incidental/disruptive influences reduce warrant while stable processes gain it. 
  Second, a causal specificity rule distinguishing arousal-based triggers from ecological variables. 
  Third, an explanatory role rule where if moral facts don't explain the judgment's formation, it's suspect.

  The user's proposed rule focuses on whether the cause is an "irrelevant cue" (external) versus a "morally relevant parameter" (to which correct verdicts should respond). This explains the disgust case (foul smell irrelevant) and ultimatum variation (market integration potentially relevant). But it strains on H's harm stability ruling - why would stability imply warrant unless we assume stable judgments track truth?

  To absorb that, we might say stability indicates the cause isn't an irrelevant cue but reflects durable features of moral cognition. The cheapest discriminating case would test incidental versus ecological manipulations of harm judgments. If incidental disgust reduces warrant but ecological scarcity doesn't, that supports the user's rule. If both undermine warrant equally, it favors a reliability rule.

  I should present this as continuous prose in letter format, respecting the user's academic context while making the reasoning transparent. The user clearly wants to test ideas rigorously before presenting to students and colleague, so precision is key. I'll avoid jargon where possible and focus on logical structure.
answer: |-
  My dear colleague,  

  Thank you for this wonderfully rich challenge. Let me first predict H.’s verdict on the new preprint, then reconstruct the candidate rules underlying her prior rulings, test your own proposal, and finally offer a discriminating case.  

  **Prediction for the Pastoralist Preprint**  
  H. will hold that the finding does *not* undermine the credibility of convictions like "vast inherited inequality is unjust." She’ll argue that the pastoralists’ lack of fairness responses, and the shift in Western subjects under ecological simulation, reveals context-sensitivity in fairness intuitions, but not a defect in their warrant. Her reasoning will mirror her treatment of the cross-cultural ultimatum variation: the ecological variables (scarcity, anonymity, non-repeating interactions) are *morally relevant parameters* shaping what fairness demands in that context. Fairness isn’t absent; it is calibrated to material conditions where strict equity could threaten survival. Meanwhile, the stability of harm judgments under the same manipulation reinforces harm’s status as a candidate moral universal. The study thus informs *when* and *how* fairness applies (bearing on normative theory scope), not whether specific fairness-based condemnations are true.  

  **Candidate Rules Underlying H.’s Prior Rulings**  
  I see three coherent rules reconciling her five cases:  

  1.  **Process Reliability Rule:** A psychological cause undermines warrant if it reveals the judgment-forming process to be *globally unreliable* across contexts where the moral fact purports to apply. Incidental disgust introduces a noise-like distortion operating independently of moral reasons, flagging unreliability. The stability of harm judgments across populations and manipulations signals robustness/reliability. The moral foundations questionnaire reveals descriptive breadth but doesn’t indict the reliability of liberal *or* conservative judgment-forming processes per se. Capuchin behavior and ultimatum variation show context-sensitivity, but not that the underlying processes (e.g., aversion to inequity) are unreliable guides to context-appropriate fairness in their respective domains.  

  2.  **Incidental Arousal vs. Ecological Variable Rule:** Warrant is undermined only when the non-moral cause is an *incidental arousal state* (like disgust, unrelated to the content judged), not when it is an *ecological variable* (like market integration or scarcity) that constitutes part of the morally relevant situation. Disgust is incidental arousal; it hijacks moral cognition arbitrarily. The ultimatum variation stems from ecological variables plausibly relevant to what fairness requires in different cooperation structures. Capuchin behavior is ecologically embedded primate sociality, not evidence about human normative truth. Harm’s stability shows it resists incidental arousal hijacking. The pastoralist fairness variation stems from ecology, not incidental arousal.  

  3.  **Explanatory Role Rule:** A psychological cause undermines warrant if it shows the moral fact *plays no role in explaining the judgment’s occurrence*. If we can fully explain why someone holds a judgment without referencing the purported moral fact (e.g., "they judged it wrong because of the foul smell"), warrant is defeated. Disgust fits this; the smell, not the act’s wrongness, explains condemnation. Capuchin cucumber-refusal is explained by frustration/inequity aversion, not an abstract concept of injustice. In contrast, the ultimatum variation is explained by ecological factors that *also* plausibly shape what fairness *is* in that context – fairness facts might still explain judgments *within* each context. Harm’s stability suggests harm facts *are* playing an explanatory role across contexts. The moral foundations survey describes content, not judgment causation.  

  These rules converge on most cases but *diverge* on the pastoralist preprint:  
  -   **Reliability Rule:** Might see fairness as less *universally* reliable than harm, but reliable within its proper (ecology-defined) domain. No debunking of specific convictions about *our* ecology.  
  -   **Incidental vs. Ecological Rule:** Clearly treats the pastoralist manipulation as ecological, not warrant-undermining.  
  -   **Explanatory Role Rule:** Unclear. Does the ecology explain the judgment *instead of* fairness facts, or does it define the fairness facts? H. would likely argue the latter, preserving warrant.  

  **Evaluating Your Proposed Rule**  
  Your rule – warrant is undermined if the non-moral cause is an *irrelevant cue external to the situation* (debunking), not if it is a *morally relevant parameter* (non-debunking) – is elegant and captures much:  

  -   **Disgust:** Foul smell is an irrelevant external cue → Debunks.  
  -   **Ultimatum Variation:** Market integration/cooperation scale are potential morally relevant parameters → Does not debunk.  
  -   **Capuchins:** Natural primate behavior isn’t a "cue" or "parameter" for human moral facts → Untouched (as per H.).  
  -   **Pastoralist Preprint:** Scarcity, anonymity are plausible morally relevant parameters for fairness → Predicts no debunking (aligning with my H. prediction).  

  The strain is indeed **Harm’s Stability**. Why does stability confer *positive warrant*? Your rule, as stated, primarily defines when warrant is *absent* (due to irrelevant cues); it doesn’t inherently explain why *lack* of influence by irrelevant cues translates to *stronger* warrant relative to other foundations. One could say stability *indicates* a lack of susceptibility to irrelevant cues, thus *preserving* warrant, but H. seems to grant harm something *more* – a positive boost.  

  **Can your rule absorb this?** It requires a slight augmentation: Stability under *manipulations targeting irrelevant cues* (like disgust) demonstrates *robustness against warrant-undermining influences*. Harm’s resistance to incidental manipulations shows it isn’t being swayed by irrelevant cues, thus its warrant remains intact and appears stronger *relative* to domains (like purity) shown to be vulnerable to such cues. This doesn’t prove harm judgments are *true*, but it shows they are not *undermined* by these specific irrelevant perturbations. This positions the "positive warrant" as *comparative resilience*, not absolute proof. H.'s fifth ruling ("better warranted *than purity-based ones*") fits this comparative framing under your rule. The key is interpreting "positive warrant" as *resilience to identified threats*, not intrinsic justification. On this reading, your rule *can* absorb H.’s fifth ruling. If H. meant something stronger – that stability *directly evidences truth-tracking* – then your rule and her ruling might conflict, requiring her ruling to soften to the comparative resilience claim.  

  **The Discriminating Case**  
  The cheapest discriminating case is a **study manipulating perceived harm judgments using an *ecologically valid, morally relevant parameter*.**  

  -   **Design:** Subjects judge scenarios involving ambiguous harms (e.g., causing mild distress for a greater good). One group is primed with an ecological variable plausibly relevant to harm’s permissibility (e.g., acute resource scarcity framing: "Your tribe faces starvation this winter"). Another group is a neutral control. Crucially, include a third group primed with *incidental disgust* (e.g., foul odor) during judgment.  
  -   **Manipulation:** Scarcity framing (morally relevant parameter) vs. Incidental disgust (irrelevant external cue) vs. Control.  
  -   **Measure:** Harshness of moral condemnation for causing the ambiguous harm.  

  **Results Favoring Which Rule?**  

  1.  **Reliability Rule:** If *both* scarcity and disgust manipulations significantly alter harm judgments, it suggests harm processing is *globally* less reliable than previously thought (undermining H.’s fifth ruling). If only disgust alters judgments, harm retains its reliability status.  
  2.  **Incidental vs. Ecological Rule:** Only the disgust manipulation should undermine warrant for harm judgments. Scarcity altering judgments would be seen as a context-appropriate calibration of harm’s weight, not warrant-undermining.  
  3.  **Explanatory Role Rule:** If *either* manipulation alters judgments, it suggests harm facts aren’t the sole explanatory factor, potentially undermining warrant. Stronger effect = stronger undermining.  
  4.  **Your Rule (Irrelevant vs. Relevant):** The disgust manipulation (irrelevant cue) should undermine warrant if it alters judgments. The scarcity manipulation (potentially relevant parameter) altering judgments should *not* undermine warrant; it reflects context-sensitivity. Harm judgments moving under scarcity would *not* challenge their warrant under your rule, while moving under disgust *would*. Stability in the control maintains warrant.  

  **The Crucial Discriminator:** If harm judgments shift under *scarcity framing* (ecologically relevant parameter) but *not* under disgust (irrelevant cue), it strongly supports **your rule** and the **Incidental vs. Ecological Rule**. It shows harm is sensitive to plausible morally relevant context but *resistant* to arbitrary irrelevant influences, explaining its observed stability and resilience. It challenges the **Reliability Rule** (if reliability means universal consistency) and the **Explanatory Role Rule** (if it demands context-independent explanation).  

  I hope this dissection proves useful for your seminar. H.’s approach is more consistent than your students suspect, grounded in distinguishing different *kinds* of empirical causes and their normative implications. Your own rule holds significant promise, particularly if "positive warrant" is understood as robust resistance to debunking threats. The discriminating case I propose is straightforward to implement and could resolve the tension elegantly. I look forward to hearing how the session unfolds.  

  Warmly,  
  A Fellow Traveler in Metaethical Thickets
