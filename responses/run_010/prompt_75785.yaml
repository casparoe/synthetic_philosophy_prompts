  The cases they provided are cleverly layered: (a) tests pure numbers vs. neglect risk; (b) risk tolerance; (c) severity aggregation; (d) temporal discounting; (e) trivial harms summation; (f) need-based allocation. I notice they specifically want post-decision accountability addressed - likely reflecting real guilt over saved/not-saved outcomes.

  For the axes, I'll need to map fundamental tensions without academic baggage: individual vs. collective welfare, comparability of harms, temporal scope, role obligations. Must emphasize where axes are independent (e.g., severity thresholds don't dictate time preferences) and where they correlate (pairwise matching often rejects aggregation). 

  The quiz design requires care: each node must be instinctive. I'll use their cases (a) through (f) and add three: one on sunk costs (common in rescue ops), one on special obligations (their crew role), and the demanded post-rescue reflection. Options must be equally plausible - no leading. 

  Leaf design is tricky. Avoiding "-ism" labels means coining descriptive names like "Scale Blind" (deontology) or "The Full Ledger" (utilitarianism). The "unoccupied positions" note is crucial - their group will spot evasion of hard trade-offs. 

  Weakest case? Probably (e) headaches vs paralysis - it's too stylized for real rescue contexts. Best sorting question? Their case (c) (hands vs life) cleanly separates threshold theorists from aggregators. 

  Final challenge: keeping it tool-like. Scoring key must be deterministic, no "it depends" escapes. The "hardest commitment to defend" notes will spark discussion - utilitarians squirming at sacrificing one for headaches, deontologists at letting five drown to avoid "using" one. 

  This feels like building a sextant for moral navigation - which is exactly what a lifeboat helm would want.
answer: |-
  Here is your diagnostic instrument, designed as requested. It uses your cases (a)-(f) and adds three new scenarios to cover the axes you identified. The tree has nine nodes, each with concrete options. Positions emerge from patterns of answers, not labels.

  ---

  ### **ONE: THE AXES (SUMMARY TABLE)**

  | Axis Description                                                                 | Independent? | Collapses/Notes                                                                 |
  | :------------------------------------------------------------------------------- | :----------- | :------------------------------------------------------------------------------ |
  | **1. What makes a choice bad?**<br>— Worse *numbers* (more people harmed)<br>— Worse *severity* (greater harm per person) | Yes          | These can conflict (e.g., harming one severely vs. many slightly).              |
  | **2. How are claims weighed?**<br>— Pairwise matching (A vs. B, then C vs. D...)<br>— Holistic summing (total "badness" calculated) | Yes          | Pairwise rejects summing; summing ignores individual matchups. "Leftover" claims after matching matter. |
  | **3. Handling ties**<br>— Break by chance<br>— Chance forbidden<br>— Ties impossible | Mostly       | Tied severity/numbers rare; view on chance often reveals stance on fairness.    |
  | **4. Scope of counting**<br>— Only this decision<br>— Across time/other decisions | Yes          | Affects future-focused cases (e.g., prevention vs. immediate rescue).           |
  | **5. Role of personal ties/promises**<br>— Changes duty<br>— Irrelevant to duty | Yes          | Tests if impartiality overrides special obligations (e.g., crew commitments). |
  | **Missing Axes?** None critical. Your list covers core tensions. "Thresholds" (when small harms "count") emerges in answers. |

  ---

  ### **TWO: THE QUESTIONS (NODES)**

  1.  **Case A: One lifeboat, two harbours.** Three people cling to a wreck north; one clings south. You have time to reach only one group.  
      a) Go north. Saving three is better than saving one.  
      b) Go south. Leaving one person completely alone feels worse.  

  2.  **Case B: Certain vs. risky rescue.** You can certainly save one person, OR attempt a winch rescue with a 50% chance to save all five (and 50% chance to save none).  
      a) Take the risk. The chance to save five is worth it.  
      b) Save the one certainly. Letting one die for a gamble is wrong.  

  3.  **Case C: Hands vs. life.** You can go to five people who will each lose a hand without you, OR go to one person who will die without you.  
      a) Save the life. Death is worse than five lost hands.  
      b) Save the hands. You prevent five serious harms, not just one.  

  4.  **Case D: Today vs. future.** You can pull five villagers from a flooded house today, OR spend the same effort on a scheme that will definitely keep fifty villagers alive ten years from now (but do nothing today).  
      a) Save the five today. People drowning now need help first.  
      b) Build the scheme. Saving fifty later does more good overall.  

  5.  **Case E: Paralysis vs. headaches.** You can cure one person's permanent paralysis, OR spare one million people a mild, one-week headache (but cure no paralysis).  
      a) Cure the paralysis. A terrible burden for one is worse than minor troubles for many.  
      b) Spare the headaches. Helping a huge number, even a little, adds up to more relief.  

  6.  **Case F: Antidote units.** You have five units of antidote. Five people each need one unit to live. A sixth person needs all five units to live.  
      a) Give one unit to each of the five. More lives saved.  
      b) Give all five to the sixth. No one is left with a partial, useless dose.  

  7.  **Sunk cost dilemma.** You've risked the lifeboat for hours trying to reach a sinking yacht with two people. It's now clear you likely won't reach them in time. You get a new call: a child is drifting alone nearby, easy to reach.  
      a) Keep trying for the yacht. You started this rescue; you owe it to them.  
      b) Rescue the child. You can definitely save them right now.  

  8.  **The coin toss (post-choice).** After a hard choice where lives were lost, you meet the relative of someone who wasn't saved. They ask why you didn't just toss a coin to decide fairly.  
      a) Tossing a coin would have been cowardly or unfair. The reasons mattered.  
      b) Tossing a coin might have been the fairest way. Everyone deserved an equal chance.  
      c) It wouldn't have changed the outcome, so it's pointless to discuss.  

  9.  **Promised help.** You promised your nephew you'd help him move house today. On the way, you see an unrelated car crash victim by the road needing immediate help.  
      a) Help the crash victim. It's an emergency; your promise can wait.  
      b) Help your nephew. You made a commitment to family.  

  ---

  ### **THREE: LEAVES AND KEY**

  **Leaves (Plain-English Names):**

  1.  **Scale Blind (Commonly: Deontologist/Rule-Based):** Sees individuals first, resists summing harms. Numbers often lose to severity or duties.  
  2.  **The Full Ledger (Commonly: Utilitarian/Aggregative):** Adds up all good and bad. Bigger numbers usually win.  
  3.  **Pair Scales First (Commonly: Moderate Deontology/Comparative Harm):** Compares harms pairwise. Numbers win only if harms are similar.  
  4.  **Threshold Counter (Commonly: Suffientarian/Prioritarian):** Small harms don't count until a threshold (like death/disability) is reached.  
  5.  **Fair Chance Demander (Commonly: Egalitarian/Lottery Advocate):** Believes even chances (e.g., coin tosses) are essential when claims clash.  
  6.  **The Local Ledger (Commonly: Presentist/Agent-Relative):** Focuses on the immediate situation and personal roles/promises. Future/abstract sums discounted.  
  7.  **The Unblinking Ledger (Commonly: Strict Utilitarian):** Always sums, even across time and trivial harms. Ignores personal ties.  
  8.  **The Duty-Bound (Commonly: Particularist):** Personal promises, roles, or sunk costs strongly shape duty, overriding impartial counting.  

  **Scoring Key:**  
  *(Pattern = Choices for Nodes 1-9)*

  1.  **Scale Blind:** Pattern like: 1b, 2b, 3a, 4a, 5a, 6a or 6b (depends on match), 7a or 7b (depends on promise/role), 8a, 9a or 9b (strong on duty).  
      *   Hardest Commitment: Defending why saving fewer people (or letting worse harm happen) isn't wrong when individual rules/duties say so (e.g., Node 3: choosing one life over five hands).
  2.  **The Full Ledger:** Pattern like: 1a, 2a, 3b, 4b, 5b, 6a, 7b, 8c or 8a, 9a.  
      *   Hardest Commitment: Defending summing trivial harms (like headaches) against severe ones (Node 5) or sacrificing a sure rescue for a gamble (Node 2b).
  3.  **Pair Scales First:** Pattern like: 1a (if harms equal), 1b (if neglect worse), 2b (risks unequal), 3a (death >> hands), 4a or 4b (if harms comparable), 5a, 6a, 7b, 8a, 9a. *Key: Requires similar harm for numbers to win.*  
      *   Hardest Commitment: Explaining *when* harms are "comparable enough" for numbers to break the tie (e.g., Node 4: Is drowning today = dying later?).
  4.  **Threshold Counter:** Pattern like: 1a, 2a or 2b (death risk), **3a**, 4a or 4b (if future death counts), **5a**, 6a, 7b, 8a, 9a. *Key: Death/loss > threshold; headaches/hands < threshold.*  
      *   Hardest Commitment: Defending *why* the threshold exists and where it is (e.g., Node 5: Why paralysis crosses, headaches don't? Node 3: Why hands don't?).
  5.  **Fair Chance Demander:** Pattern like: Mixed on 1/2/3/4/6, **but 8b consistently**. Often 2b (rejects risk as unequal chance), 6a (but uneasy), 7b. *Key: Prioritizes procedure (Node 8b).*  
      *   Hardest Commitment: Defending using a coin toss when it might lead to a worse outcome (e.g., fewer saved).
  6.  **The Local Ledger:** Pattern like: 1a or 1b (focuses on *this* scene), 2a or 2b (focuses on *this* risk), **4a**, 5a, 6a or 6b (focuses on *this* allocation), 7b, 8a, **9b**. *Key: Rejects future discounting (Node 4a) and prioritizes personal ties (Node 9b).*  
      *   Hardest Commitment: Defending not preventing much greater future harm to address immediate, smaller needs (Node 4).
  7.  **The Unblinking Ledger:** Pattern like: 1a, 2a, 3b, **4b**, **5b**, 6a, 7b, 8c, 9a. *Key: Strongest summing, even headaches (5b) and future lives (4b). Ignores personal ties (9a).*  
      *   Hardest Commitment: Defending spending effort on headaches over paralysis (Node 5) or breaking a promise for a stranger (Node 9).
  8.  **The Duty-Bound:** Pattern like: Mixed on rescue cases, **but 7a and 9b consistently**. Often 8a. *Key: Sunk cost (7a) and promises (9b) override impartial counting.*  
      *   Hardest Commitment: Defending sticking to a failing rescue or a promise when clearly more good could be done elsewhere (Nodes 7 & 9).

  **Unoccupied/Incoherent Combinations:**
  *   **"Scale Blind" + "Full Ledger" Answers:** Incoherent. Rejects summing (Scale Blind: e.g., 5a, 3a) but also requires it (Full Ledger: e.g., 4b, 5b). Cannot hold both.
  *   **"Pair Scales First" + "Unblinking Ledger" Answers:** Unattractive/Unexplored? Pair Scales rejects summing dissimilar harms (3a, 5a), while Unblinking demands it (3b, 5b). A hybrid (e.g., sum only similar harms *and* trivial harms) lacks principle.
  *   **"Threshold Counter" + Consistent "5b":** Incoherent. Threshold Counter says headaches < threshold (5a), while 5b requires summing them as significant.

  **Indistinguishable Pair (without unfair questioning):**
  *   **"Scale Blind" vs. "Threshold Counter"** on some paths. Both reject summing dissimilar harms (e.g., Node 3a, 5a). Distinguishing them cleanly requires probing *why* small harms don't count – individual rights (Scale Blind) vs. harm insignificance (Threshold). Asking directly would violate the "no theory" rule. Node 8 hints (Scale Blind might say reasons mattered, Threshold might agree) but isn't perfect. Flag this pair.

  ---

  ### **FOUR: TWO SHORT JUDGEMENTS**

  1.  **Most Sorting Power: Node 3 (Hands vs. Life).** This cleanly separates those who see harm as summable (3b) from those who see death as categorically worse than any number of lesser harms (3a), and also tests the "pairwise similar harms" view (which also picks 3a). It's visceral and avoids complex risk or time.
  2.  **Weakest Case to Cut: Case E (Paralysis vs. Headaches).** While it probes trivial harm summation starkly, it's the least realistic in an emergency rescue context. The scale is extreme (1 vs 1 million), and the "harms" (paralysis vs. headache) are so vastly different in kind and severity that it can feel artificial compared to lifeboat triage. It risks being a thought experiment outlier rather than illuminating common tensions. (I used it, but it's the one I'd drop if forced).

  ---

  **The Instrument is Ready.** Your book group can take the quiz (answer Nodes 1-9), then use the Key to find their leaf based on their pattern. The "Hardest Commitment" points will fuel discussion.
