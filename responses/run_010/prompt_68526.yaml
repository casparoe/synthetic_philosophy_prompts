  - Determining what exactly intuitions reveal (concepts? principles? mere dispositions?)

  The user specifically wants at least one position where thought experiments are evidentially respectable (with failures due to poor construction) and one where they only reveal dispositions. They also want empty cells in the conceptual space identified and explained.

  I'll structure the decision tree as follows:
