  The requirements are quite detailed: 8-9 branching questions using concrete cases without philosophical jargon, covering specific distinctions about thought experiment failures, stability of verdicts, familiar cases, what verdicts actually measure, reconstructability as arguments, and reliability of readers. The tree needs to map all possible positions while flagging gaps and indistinguishable paths, with critical "cost of living" assessments for each endpoint.

