prompt: |-
  So this started with an actual fight. My roommate did something pretty crappy, I told him so, and he said "you of all people don't get to say that" — because I'd done basically the same thing the year before and never got called on it. And I've been chewing on that for about a month now, not the fight, the general thing: when does somebody actually lose the right to call somebody else out, and what kind of thing would that even be? No philosophy training here, I've just been thinking and reading around, and I've talked myself into a pet theory I want stress tested. But before that I want the spec, because half of what I read assumes a standard nobody's bothered to argue for.

  So: write out the requirements an account of standing to blame has to meet before I'd call it adequate. Not a survey of the answers — the answer key first. For each requirement, give me the case or the consideration that makes it a requirement rather than just a name on a list.

  Here's the raw material I've got, definitely incomplete, so add what I'm missing.

  Cases it has to get right:
  - the honest hypocrite. Someone who does the exact thing they're calling out and says so out loud, no excuses, I do this too and it's still wrong. My gut says they keep standing, but any account built on inconsistency looks like it has to say they lose it.
  - the reformed one. Used to be guilty, genuinely isn't anymore, calls it out in someone else. Do they have more standing or less than somebody who was never guilty?
  - the worse offender. Same fault, ten times bigger. Does degree matter or is this binary?
  - private versus said out loud. Does the hypocrite lose standing to think it, or only to say it?
  - the self-blamer. Holds themselves to exactly what they're holding the other person to, visibly.
  - domain bleed. Cheats at cards, calls out a liar. Is standing per-fault or does it leak?
  - the stranger with no connection to you who calls you out anyway. I strongly suspect this is a different problem getting filed under the same heading as hypocrisy, and I want to know if I'm right.
  - the person the fault was actually done to, doing the calling out. Extra standing, or the same standing?
  - what restores it. Apology, getting caught, doing the time, just time passing?

  Distinctions it can't collapse: standing versus sincerity; standing versus whether the blame is true (a hypocrite's accusation can be correct and stay correct, and I think an account that loses that is dead on arrival); blame versus criticism versus just reporting a fact versus punishment; forfeiting standing versus never having had it; all-or-nothing versus coming in degrees.

  And one constraint that matters to me: I want an account a normal person can actually use in a live argument, where both people can see whether it's been met. So a requirement can't hinge on facts only a brain scanner or an all-knowing observer could check. Tell me whether that's a fair thing to demand of a theory here or whether it wrecks the project.

  Then mark which of the requirements are non-negotiable and which are really just one camp's taste smuggled in as a criterion. If some subset of them can't all be satisfied at once, say so explicitly and show me why — I'd take that over a tidy list, since then the list itself is the finding. And name the single requirement that eliminates the most candidates, because that's the one worth arguing about.

  My pet theory, for the short scoring round at the end: blame is a tool, and it only works on someone who can actually recieve it. So standing isn't a fact about your moral record at all, it's a fact about whether your blame can do its job — if the target will just read it as an attack and bounce it back, you have no standing no matter how clean your past is. Score that against the list along with the two or three obvious rivals (the inconsistency one, the complicity one, and the family of views where blame is a kind of protest you have to be positioned to make), but keep the scoring brief. The list is what I want.

  Two more things. Tell me how confident you are in each requirement — which ones you'd defend hard and which are your own hunch dressed up as a criterion, since I'd much rather know that going in. And don't be polite about my framing: if standing turns out to be a bogus notion, or if my tool theory rests on something confused, or if this whole task can't be done well because the requirements list will just end up being whatever the writer already believed, say that straight instead of handing me a nice list. American English please.
reasoning: |-
  Okay, the user is dealing with a complex philosophical question about moral standing after a personal conflict. They've clearly put a lot of thought into this - mapping out cases, distinctions, and constraints with impressive precision. This isn't some abstract academic exercise; it's rooted in real pain from that roommate fight. The "you of all people" remark really got under their skin.

  Hmm... they're asking for something very specific: not theories about standing to blame, but the criteria those theories must meet. That's meta-philosophy territory. And they want it practical - something usable in real arguments without brain scanners. Smart constraint. Their cases cover everything from honest hypocrites to strangers calling you out. The tool theory they're playing with is fascinating - making standing about effectiveness rather than moral purity. Very pragmatic.

  First I need to validate their framing. Standing isn't bogus - we do intuitively judge who "has the right" to criticize. But their suspicion about strangers being a different category feels spot-on; that might be about authority rather than standing. And yes, sincerity must be separable - a hypocrite can still be factually correct.

  The real challenge is their case list. Take the honest hypocrite: if someone admits their own fault while condemning others, does consistency really undermine them? Their gut says no, but most theories would disqualify them. Then there's degree - is being ten times worse meaningfully different from slightly hypocritical? And what restores standing? Time? Apology? That's messy.

  Biggest landmine: they want standing independent of blame's truth. Absolutely right - if hypocrisy automatically negates factual accuracy, the whole concept collapses. That non-negotiable requirement alone torpedoes many popular theories.

  Their tool theory has promise but needs stress-testing. If standing depends on the target's receptiveness, does that mean you gain standing only when they're willing to listen? That feels backward. Still, it handles the honest hypocrite well - if they're credible despite their flaws, their criticism might land.

  For the requirements list, I'll prioritize: 1) Truth-independence (non-negotiable), 2) Practical usability (their key constraint), 3) Handling the honest hypocrite without disqualification, and 4) Distinguishing forfeited vs. absent standing. The stranger case probably needs separate treatment - might be about social roles, not standing per se.

  Most eliminative requirement? Probably truth-independence. It wrecks any theory where hypocrisy voids standing. Degree sensitivity is another killer - if standing isn't binary, most clean philosophical models fail.

  Final note to self: Flag where my own biases show. I lean pragmatic, so usability feels obvious, but some philosophers might call that "smuggled in." And be blunt - if their tool theory confuses standing with persuasion, say so. They'll respect that more than false politeness.
answer: |-
  Here's the requirement set for an adequate account of standing to blame, built from your cases, distinctions, and constraints. I'll follow your structure: requirement, justification (case/consideration making it necessary), confidence level, and negotiability. After the list, I'll briefly score your tool theory.

  **Requirements for an Adequate Account of Standing to Blame:**

  1.  **Truth-Independence:** The standing to blame must be conceptually distinct from the *truth* or *correctness* of the blame. A hypocrite's accusation can be factually true and morally correct even if they lack standing to voice it.
      *   **Justification:** Your core intuition ("a hypocrite's accusation can be correct and stay correct... dead on arrival"). Without this, blame collapses into mere factual reporting, and hypocrisy arguments become automatic invalidators regardless of truth.
      *   **Confidence:** Very High (Defend Hard). This is foundational to the *concept* of standing as distinct from correctness.
      *   **Negotiability:** Non-Negotiable. Failure here destroys the whole project of defining "standing" separately.

  2.  **Hypocrisy Handling:** The account must explain why hypocrisy *often* undermines standing, *without* automatically disqualifying the "Honest Hypocrite" or the "Reformed Offender".
      *   **Justification:** The "Honest Hypocrite" case (admits fault, calls it wrong anyway) and the "Reformed Offender" case. Gut intuition says they retain *some* standing, yet purely inconsistency-based accounts struggle here. The account must distinguish *why* typical hypocrisy is problematic without making these cases impossible.
      *   **Confidence:** High. These cases are central to the puzzle. Ignoring them renders the account incomplete.
      *   **Negotiability:** Non-Negotiable for adequacy. *How* it handles them is negotiable (e.g., does reform restore full standing?).

  3.  **Sincerity Distinction:** Standing must be distinguishable from the blamer's *sincerity* or internal consistency ("Self-Blamer").
      *   **Justification:** The "Self-Blamer" case. Someone can be perfectly sincere and self-consistent in their standards *and* still lack standing due to hypocrisy or complicity. Sincerity doesn't automatically grant standing.
      *   **Confidence:** High. This is crucial to avoid conflating psychological states with the relational/authoritative nature of standing.
      *   **Negotiability:** Non-Negotiable.

  4.  **Domain Specificity / Bleed Handling:** The account must address whether standing is forfeited *only* for the *exact* fault, or whether it bleeds to related faults ("Domain Bleed").
      *   **Justification:** The "Domain Bleed" case (cheater calling out a liar). Is standing lost only for cheating, or also for criticizing dishonesty generally? Intuitions vary, but an account must take a position and explain it.
      *   **Confidence:** Medium-High. It's a common practical question. Ignoring it leaves a gap.
      *   **Negotiability:** Negotiable *how* it handles bleed (specific fault vs. character trait vs. moral domain), but it *must* address the issue.

  5.  **Forfeiture vs. Absence Distinction:** The account must distinguish between *forfeiting* standing one once had (e.g., by committing the fault) and *never having had* standing in the first place (e.g., "the Stranger").
      *   **Justification:** Your intuition that "the Stranger" might be a different problem. The "Person Wronged" case also highlights this – their standing seems inherent/stronger, not forfeited. An account collapsing forfeiture and absence struggles with these.
      *   **Confidence:** High. This distinction clarifies core dynamics.
      *   **Negotiability:** Non-Negotiable for clarity. *Where* the line is drawn is negotiable.

  6.  **Practical Verifiability:** The conditions for having/lacking standing must be reasonably verifiable by the participants in a live argument without requiring inaccessible knowledge (brain states, secret histories, ultimate moral truths).
      *   **Justification:** Your explicit constraint ("a normal person can actually use... where both people can see whether it's been met"). A theory relying on unfalsifiable internal states or hidden facts is useless for its intended purpose (live arguments).
      *   **Confidence:** High for *this specific request*. However, note: Some philosophers argue standing *does* depend on internal states (genuine repentance, intention) that *are* hard to verify. This requirement might rule out otherwise plausible theories.
      *   **Negotiability:** Negotiable *as a universal feature of standing*, but **Non-Negotiable** *given your explicit constraint for a usable account*.

  7.  **Degree Sensitivity:** The account must be able to explain if and how the *degree* of one's own fault impacts standing ("Worse Offender").
      *   **Justification:** The "Worse Offender" case. Is a serial killer calling out a shoplifter different from a shoplifter calling out another shoplifter? Intuitions lean towards degrees mattering, but binary accounts (have it/don't) are simpler.
      *   **Confidence:** Medium. Strong intuitions favor degrees, but a binary account *could* be defended. An adequate account must at least *address* the issue.
      *   **Negotiability:** Negotiable whether standing *is* scalar or binary, but the account must explain its position on this case.

  8.  **Addressing Restoration:** The account must provide a framework for understanding what, if anything, can *restore* forfeited standing ("what restores it?").
      *   **Justification:** The "Reformed Offender" case directly raises this. If hypocrisy forfeits standing, how does the reformed person get it back? Apology? Time? Proven change? An account needs an answer, even if it's "nothing restores it fully."
      *   **Confidence:** Medium-High. Essential for completeness, especially given the Reform case.
      *   **Negotiability:** Negotiable *what* restores it (or if it can be restored), but the issue must be addressed.

  9.  **Action/Expression Distinction:** The account must address whether hypocrisy negates standing to *think* the blame ("private"), or only to *express* it ("said out loud"), and why.
      *   **Justification:** Your explicit question ("Does the hypocrite lose standing to think it, or only to say it?"). Standing seems primarily relevant to the *act of blaming*, which involves communication and holding accountable.
      *   **Confidence:** Medium. While standing is most contested in expression, an account should clarify its scope. Does hypocrisy make the *judgment* itself illegitimate, or just its expression *as blame*?
      *   **Negotiability:** Negotiable *where* the line is drawn, but the scope (thought vs. speech) should be clarified.

  10. **Victim Standing:** The account must explain the standing of "the person the fault was actually done to". Is it enhanced, different, or simply a clear case of having standing?
      *   **Justification:** The "Person Wronged" case. Their standing seems paradigmatic and often strongest. Any account that undermines *their* standing is deeply suspect.
      *   **Confidence:** Very High. This is a bedrock intuition about moral accountability.
      *   **Negotiability:** Non-Negotiable. An account must affirm and explain the victim's strong standing.

  **Key Tensions & The Most Eliminative Requirement:**

  *   **Tension 1: Honest Hypocrite vs. Typical Hypocrisy:** Accounts emphasizing consistency/authority struggle with the Honest Hypocrite. Accounts emphasizing complicity might handle it better.
  *   **Tension 2: Practical Verifiability vs. Internal States:** Accounts grounding standing in genuine repentance or internal consistency (Self-Blamer) run afoul of Practical Verifiability (#6). Accounts relying only on public facts are simpler but might miss nuance.
  *   **Tension 3: Degree Sensitivity (#7) vs. Simplicity:** Binary accounts are simpler but struggle with Worse Offender. Scalar accounts are messier but more intuitive for that case.

  **The Most Eliminative Requirement: Truth-Independence (#1).** Many popular intuitions and some theories implicitly tie the validity/force of blame to the blamer's own record *in a way that contaminates the truth*. If hypocrisy makes the accusation *false* or *invalid*, then #1 is violated. Any theory that makes hypocrisy a *logical* defeater (rather than a *pragmatic* or *relational* defeater) fails immediately on this ground. This requirement eliminates a whole class of "inconsistency invalidates the claim" arguments.

  **Is Standing Bogus?** Not bogus, but complex and contested. It captures a real social/moral phenomenon: the perceived *authority* or *license* to hold someone accountable, distinct from whether the accusation is *correct* or the blamer is *sincere*. Your framing is valid.

  **Scoring Your Tool Theory & Key Rivals:**

  *   **Your Tool Theory (Standing = Effectiveness):**
      *   **Strengths:** Nails Practical Verifiability (#6 - "will they listen?" is observable). Handles Honest Hypocrite (#2 - if they're credible, blame might work). Explains why Stranger (#5) might lack it (no relationship = no leverage). Addresses Restoration (#8 - rebuild relationship/credibility). Can handle Degrees (#7 - worse hypocrisy might cause more resistance).
      *   **Weaknesses:** Struggles badly with Truth-Independence (#1 - effectiveness is irrelevant to truth). Undermines Victim Standing (#10 - a victim's blame might be ineffective against a callous wrongdoer, yet they clearly *have* standing). Risks making standing entirely subjective (target's whim). Struggles with Sincerity Distinction (#3 - a sincere but ineffective blamer might still *have* standing). Private Blame (#9) becomes nonsensical (can't be "effective").

  *   **Inconsistency/Complicity Theory (Standing requires not being guilty of the same/similar fault):**
      *   **Strengths:** Explains typical hypocrisy loss. Clear on Domain Bleed (depending on definition of "same/similar"). Handles Victim (#10 - victim isn't complicit).
      *   **Weaknesses:** Fails Honest Hypocrite (#2) and Reformed Offender (#2/8). Struggles with Truth-Independence (#1). Unclear on Degrees (#7). Poor on Verifiability (#6) if past guilt is hidden. Struggles with Stranger (#5 - why would a stranger *have* standing?).

  *   **Moral Protest Theory (Standing is about positioning to represent the moral order/protest):**
      *   **Strengths:** Can explain Victim standing (#10 - directly representing the violated value). Can potentially handle Honest Hypocrite (#2 - if they protest *including* themselves) or Reform (#2/8 - reformed person reclaims position). Grounds Stranger (#5 - representing community standards). Respects Truth-Independence (#1).
      *   **Weaknesses:** Very abstract. Poor Practical Verifiability (#6 - hard to see "positioning"). Unclear on Domain Bleed (#4). Can be elitist (who gets to "represent"?). Unclear on Private vs. Public (#9).

  **Conclusion on Your Theory:** It's pragmatic and highlights a crucial *practical* barrier to effective blame. However, by grounding standing *entirely* in effectiveness, it sacrifices the core idea that standing is about a kind of *moral authority* or *license* that exists *even if* the target ignores it (especially problematic for Victim Standing). It's less a theory of *standing* and more a theory of *effective blame delivery*. #1 (Truth-Independence) and #10 (Victim Standing) are its biggest hurdles. The Moral Protest theory likely handles the requirement set most coherently overall, though it struggles with your #6 (Verifiability). The tension remains.
