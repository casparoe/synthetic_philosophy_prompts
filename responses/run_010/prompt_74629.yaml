  Starting with social epistemologists, their main concern might be differentiating borrowed hinges from testimonial beliefs. They'd question if this is just another form of testimony. The user needs to emphasize the non-evidential, operational nature of hinges versus beliefs that are weighed as evidence. The soft spot here is explaining why institutional trust creates a different epistemic state.

