  ### Concrete Payoff Table for the Main Example

  Below is a 3x3 payoff matrix for the row player (Guard, Feint, Strike) and column player (Guard, Feint, Strike). Each cell shows (row's payoff, column's payoff). The matrix is **not** zero-sum.

  |          | Column: Guard | Column: Feint | Column: Strike |
  |----------|---------------|---------------|----------------|
  | **Row: Guard**  | (3, -3)       | (-3, 3)       | (3, -3)        |
  | **Row: Feint**  | (-1, 1)       | (-1, 1)       | (-1, 1)        |
  | **Row: Strike** | (-3, 3)       | (3, -3)       | (0, 0)         |

  **Claim**: Feint is strictly dominated by the mixed strategy of playing Guard and Strike each with 50% probability (i.e., 0.5 Guard + 0.5 Strike), but not by any pure strategy.

  #### Proof
  - **Mixed strategy (0.5 Guard, 0.5 Strike) expected payoffs** (for row player, column by column):
    - vs. **Guard**: (0.5 × 3) + (0.5 × (-3)) = 1.5 - 1.5 = 0
    - vs. **Feint**: (0.5 × (-3)) + (0.5 × 3) = -1.5 + 1.5 = 0
    - vs. **Strike**: (0.5 × 3) + (0.5 × 0) = 1.5 + 0 = 1.5
  - **Feint payoffs** (for row player):
    - vs. Guard: -1
    - vs. Feint: -1
    - vs. Strike: -1
  - **Comparison** (mixed vs. Feint):
    - vs. Guard: 0 > -1
    - vs. Feint: 0 > -1
    - vs. Strike: 1.5 > -1
    - Strictly better in all cases.
  - **No pure strategy dominates Feint**:
    - Guard vs. Feint: Better vs. Guard (3 > -1) but worse vs. Feint (-3 < -1). Not dominant.
    - Strike vs. Feint: Better vs. Strike (0 > -1) but worse vs. Guard (-3 < -1). Not dominant.

