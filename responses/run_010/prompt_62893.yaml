prompt: |-
  I produce a philosophy-of-medicine podcast whose listenership is split roughly evenly between practising clinicians and graduate students, and next month's guest is a philosopher who defends a view I have been calling reference-class indexicalism about disease. The episode is recorded in one sitting and edited to about forty minutes, so I cannot rely on retakes or on cutting around a stall.

  Her position, as I read it: the statistical machinery she inherits from Boorse survives intact — disease is a departure from typical functional efficiency, where typicality is measured against a reference class of individuals at a comparable stage of life and of the same sex — but she denies that any single reference class is the one nature privileges. On her account a bare attribution of disease is not true or false simpliciter; it acquires a truth value only once a class is supplied. What makes diagnosis look objective is that institutions stabilize a default: the assay manufacturer's reference population, the guideline committee's cut-point, the age- and sex-banded table printed on the laboratory report. She maintains that this leaves her a naturalist in the full sense — no valuation enters the concept, only a parameter that context supplies. Her critics reply that the naturalism is a shell game: the default class is precisely where the values were relocated, and calling it a parameter instead of a judgment changes nothing about that.

  She is articulate, generous, and exceptionally slippery. Her characteristic response to a counterexample is that the objector has mis-specified the reference class, and that once the class is identified correctly the verdict comes out exactly as her theory predicts. I want a question set that makes that response expensive for her without ever being unfair.

  **The position as you understand it** — roughly 120 words. Restate her view in your own terms and say plainly where my summary above is misleading or oversimplified. If you think my label commits her to something she would disown (semantic relativism about disease talk, as against the weaker claim that reference classes are underdetermined by the biology), flag it here rather than burying it in a question.

  **The questions** — eight to ten, numbered in the order I should ask them, about 1,000 to 1,300 words in total. For each: the question as I would read it aloud, in one or two sentences and with no preamble; a single line naming the pressure point it targets; and a follow-up keyed to the answer she is most likely to give. The set must include at least one question on each item below, and should escalate as it goes:

  - the mis-specification move itself — put her on record, before any case is presented, about what would settle which reference class is correct, by considerations independent of the diagnosis she wants;
  - the sex-banded haemoglobin threshold and the age-banding of function, as cases where the default class looks chosen to deliver a verdict rather than found;
  - a guideline committee lowering the blood-pressure cut-point, which converts a large share of the previously statistically normal into patients essentially overnight, and what her view says has changed: the disease, the class, or only our bookkeeping;
  - traits far outside the class on the favourable side, where her apparatus appears to treat exceptional health as abnormality;
  - whether two clinicians who disagree about a borderline patient are genuinely disagreeing on her view, or merely talking past one another, and what is left of diagnosis as a factual practice if the latter;
  - the charge that she is a normativist in naturalist dress, framed so she has to locate the value judgment somewhere other than in her protest that there isn't one;
  - psychiatry: a statistically typical reaction to an atypical environment, of which the dispute over whether ordinary grief should be diagnosable as depression is the obvious instance.

  **The two questions she will handle best** — roughly 120 words. Tell me which of the above she has a genuinely good answer to, what that answer is, and consequently which one I should concede quickly in order to buy airtime for the rest.

  **Do not ask** — roughly 80 words. Three questions that sound sharp and are not: softballs she can convert into a lecture, or traps that depend on a caricature of her view.

  **The closer** — one question plus one conditional follow-up, roughly 80 words. It should ask what would count as evidence that her view is wrong, and it should be framed so that no single counterexample can refute a theory of this kind is not an available answer.
reasoning: |-
  Okay, let me approach this systematically. The user hosts a philosophy-of-medicine podcast with a mixed clinician/academic audience and needs sharp questions for a guest defending "reference-class indexicalism." This position adapts Boorse's biostatistical theory but makes reference classes context-dependent rather than biologically privileged. The guest is described as articulate but slippery, often deflecting criticism by claiming mis-specified reference classes.

  First, I need to restate her position accurately. Her core argument is that disease attributions aren't absolute but require a reference class parameter filled by context (like lab ranges or guidelines). She maintains this preserves naturalism since values don't define disease, though critics argue values sneak in through the choice of defaults. I should note that my "reference-class indexicalism" label risks overcommitting her to semantic relativism - she likely sees this as underdetermination, not relativism.

  For the question set, I'll structure eight escalating questions covering all requested topics:
  1. Start with the mis-specification move - pin down what objectively determines reference class choice before cases arise
  2. Use hemoglobin thresholds to challenge how "default" classes avoid value judgments 
  3. Address guideline changes like blood pressure cutoffs to force clarity on whether disease itself changes
  4. Examine exceptional health as "abnormality" to test symmetry in her framework
  5. Consider diagnostic disagreements to probe whether her view permits genuine factual disputes
  6. Directly confront the "normativism in disguise" critique
  7. Apply to psychiatry/grief to stress-test environmental interactions

  I should identify which questions she'll handle strongest - likely the guideline change (where she can distinguish institutional from biological facts) and the high-function outlier (where she'll note asymmetry in harm considerations). These are good points to concede quickly.

  Need to avoid unproductive questions like:
  - Asking if disease is "just a social construct" (lets her reframe)
  - Demanding a single perfect reference class (strawman)
  - Quibbling over minor statistical choices (distracts)

  For the closer, I'll ask what evidence could falsify her theory, blocking the "no single counterexample" dodge by requiring observable consequences - like consistent misdiagnosis when classes shift or institutions needing constant value-driven adjustments.

  Throughout, questions must be airtight against her mis-specification tactic while remaining fair. The goal is to make her contextual moves cost rhetorical ground without appearing hostile to the audience.
answer: |-
  ### **The Position as I Understand It** (120 words)
  Your guest defends a biostatistical theory where "disease" is statistical subnormal function relative to a contextually supplied reference class (e.g., age/sex group). No biological facts privilege one class over another; truth-conditions require a class parameter. Institutions stabilize defaults (e.g., lab ranges), creating an illusion of objectivity. She insists this is *naturalist* because values don’t define disease—only the parameter choice involves values. Critics argue values determine the *salient* class, making naturalism hollow. Your label "indexicalism" risks overcommitting her: she likely rejects *semantic relativism* (where "disease" means different things in different contexts). Instead, she asserts *underdetermination*: the concept is fixed, but its application requires a contextual input biology doesn’t specify.

  ---

  ### **The Questions**  
  **Pressure Point**: Mis-specification evasion  
  1. **Question**: "What objective, non-diagnostic criteria determine the correct reference class for a given trait? If biology doesn’t pick one class, what stops us from gerrymandering classes to get any verdict we want?"  
     *Follow-up if she appeals to "typical" institutional classes*: "But if institutions choose classes for practical goals—say, cost-effectiveness—isn’t that precisely where values determine what counts as disease?"  

  **Pressure Point**: Default classes as value-laden choices  
  2. **Question**: "Why do lab hemoglobin thresholds use sex-based classes but not race-based ones, when both correlate with statistical differences? If biology doesn’t dictate classes, isn’t this choice driven by social valuations of which differences 'matter'?"  
     *Follow-up if she denies race is biologically salient*: "But if sex classes aren’t biologically privileged either, what makes one default 'correct' and the other not, besides our preferences?"  

  **Pressure Point**: Guideline changes altering disease status  
  3. **Question**: "When a committee lowers hypertension thresholds, converting healthy people into patients overnight, does your view say the *disease itself changed*, the *reference class changed*, or only *our label* changed?"  
     *Follow-up if she says "only the class/label"*: "If millions acquire a 'disease' label without biological change, doesn’t that reduce disease to a bureaucratic artifact?"  

  **Pressure Point**: Exceptional health as "abnormal"  
  4. **Question**: "Your apparatus defines 'abnormality' statistically. So couldn’t an Olympic athlete’s superior cardiac output fall outside the typical class—making them ‘abnormal’? Is exceptional health a disease?"  
     *Follow-up if she says "no, disease requires harm"*: "But your theory excludes harm as normative. If you now add it, haven’t you surrendered naturalism?"  

  **Pressure Point**: Diagnostic disagreement & factual practice  
  5. **Question**: "If two clinicians dispute whether a patient’s cholesterol is pathological—one using age 40+, one using 50+—are they disagreeing about facts or just using different parameters? If the latter, what makes either diagnosis ‘wrong’?"  
     *Follow-up if she says "context decides"*: "Doesn’t this make medical truth dependent on the clinician’s arbitrary choice, undermining diagnosis as objective inquiry?"  

  **Pressure Point**: Normativism in disguise  
  6. **Question**: "You say values only choose the reference class, not disease itself. But if the class determines what counts as disease, and values choose the class, how is this meaningfully different from valuing traits directly?"  
     *Follow-up if she distinguishes "constitutive" vs. "pragmatic" roles*: "If values pragmatically fix the very parameter that constitutes disease, can naturalism survive?"  

  **Pressure Point**: Psychiatry & environmental mismatch  
  7. **Question**: "Ordinary grief is a statistically typical response to loss. If we diagnose it as depression, is that a mis-specification? If not, how does your theory avoid pathologizing normal reactions to abnormal environments?"  
     *Follow-up if she adjusts the class (e.g., "loss-adjusted")*: "But if we must constantly tweak classes to avoid overdiagnosis, isn’t biology failing to guide us—and values doing all the work?"  

  **Pressure Point**: Institutional defaults as value-relocations  
  8. **Question**: "You say institutions stabilize reference classes. But when a committee picks a class to balance over/underdiagnosis risks, isn’t that *explicitly* valuing outcomes? How is this not values defining disease?"  
     *Follow-up if she calls it "application, not meaning"*: "If the meaning of ‘disease’ is inert without institutions injecting values, what’s left of naturalism beyond semantics?"  

  ---

  ### **Two Questions She’ll Handle Best** (120 words)  
  She’ll strongest tackle **Q3 (guideline changes)** and **Q4 (exceptional health)**. For Q3, she’ll argue: "Lowering thresholds reflects new evidence that *minor* dysfunction confers risk—it’s not just labels. Biology constrains plausible classes; institutions update based on advancing science, not whim." For Q4, she’ll note: "Statistical abnormality isn’t sufficient for disease—harm is necessary. But harm is biological dysfunction impairing survival/reproduction, not subjective suffering. Olympians aren’t harmed." Concede Q4 quickly (her harm qualification is consistent), but press Q3’s follow-up: if biology constrains classes, why do committees *debate* cost-benefit tradeoffs? This exposes tension.  

  ---

  ### **Do Not Ask** (80 words)  
  1. *"Is disease just a social construct?"* → Lets her reframe naturalism as "biology fills the frame, society picks its size."  
  2. *"Can you give a perfect reference class?"* → Invites her "underdetermination" lecture, wasting time.  
  3. *"Why not use the whole species as the class?"* → Strawman; she’d note age/sex bands are biologically justified for function (e.g., menopause).  

  ---

  ### **The Closer**  
  **Question**: "What observable evidence could falsify your theory? Not a counterexample you’d call ‘mis-specified,’ but a phenomenon that *systematically* resists explanation by reference-class indexicalism."  
  *Conditional Follow-up (if she deflects)*: "If no evidence could challenge your view—if every outcome is retrofitted to a class—doesn’t that make it unfalsifiable, and thus unscientific?"  

  ---  
  **Rationale**: Forces her to specify empirical stakes. Her theory *can* be tested: e.g., if class adjustments *always* track values, not biological discoveries, or if institutions converge on classes *despite* conflicting values. Rejecting "no single counterexample" blocks evasion.
