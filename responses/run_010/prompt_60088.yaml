answer: |-
  Here is a seminar assignment draft designed to force engagement with Aristotle's core principles through the lens of decaying money. It structures the questions to build from conceptual analysis to institutional tension, culminating in a critical Aristotelian evaluation.

  ---

  # Graduate Seminar: Aristotle on Wealth-Getting  
  **Assignment: The Life and Death of Money**

  **Background:** Consider three instances of "decaying" money:  
  1.  **Wörgl Scrip (1930s Austria):** Municipal labour currency requiring monthly stamps (a "demurrage" fee) to maintain face value.  
  2.  **Expiring Gift Cards:** Prepaid cards where unused balances revert to the issuer after a fixed period.  
  3.  **Negative Interest Rates (Central Banks):** Large reserve balances held at central banks shrinking in nominal value over time.  

  Simultaneously, consumer protection laws in many jurisdictions prohibit expiry dates on stored-value cards (like gift cards). We thus observe a tension: the law forbids money to "die" (retail balances) while requiring it to "die" (central bank reserves).  

  **Your Task:** Reconstruct the implicit philosophy of money revealed by decaying currencies and this legal tension, using Aristotle’s framework (from *Politics* I.8-10 & *Nicomachean Ethics* V.5) as your critical lens. Engage the following questions systematically:  

  ## Part 1: What Decaying Money Presupposes
  *   **A. Function:** What does a decaying currency *require* us to believe money is *for*? How does demurrage enforce or redefine its purpose?  
  *   **B. Ownership & Holding:** What conception of "owning" a monetary balance does decay imply? Is holding money akin to possessing property indefinitely, or something more conditional? Who ultimately "owns" the value if it decays?  
  *   **C. Nature vs. Convention:** Aristotle argues money exists by social agreement (*nomos*), not by nature (*physis*). Is decaying money *intelligible* without this conventionalist thesis? Explain why or why not. Does demurrage merely *fit well* with conventionalism, or *depend* on it?  

  ## Part 2: What Decaying Money Rules Out
  Which rival conceptions of money are rendered implausible or incompatible with the practice of engineered decay? Specifically consider:  
  *   Money as a *commodity* with inherent value/utility (e.g., gold's ornamental use).  
  *   Money as *absolute property*, where the holder has an unconditional right to retain its full value indefinitely.  
  *   Money as a pure *token of a credit/debt relation* between issuer and holder.  
  *(Argue why decay sits uneasily with each conception).*  

  ## Part 3: Resolving the Legal Tension (Retail vs. Central Bank)
  *   How can a single legal system coherently prohibit expiry for retail stored-value cards *while* central banks engineer decay on reserves? Does this represent an *incompatible* dual theory of money?  
  *   If not, what *distinctions* dissolve the tension? Consider:  
      *   The *holder* (consumer vs. financial institution)  
      *   The *capacity* in which the balance is held (private asset vs. reserve requirement/liquidity buffer)  
      *   The *purpose* of holding (final settlement/payment vs. systemic liquidity management/store of value)  
      *   The perceived *social impact* of idle holdings (private loss vs. systemic/public loss)  

  ## Part 4: Aristotle Applied & Critiqued
  *   **Vindication?** Aristotle claims: (1) Money’s natural end is facilitating exchange; (2) It is conventional; (3) Interest is unnatural/usurious because it treats money as self-generating. Does decaying money *vindicate* this framework? How so?  
  *   **Mirror Image?** Conversely, is decay-money the *inverse* of usury – another device treating money as having a "life" of its own (decaying rather than breeding), thus *violating* Aristotle’s functional view?  
  *   **Silence & Undecidability:** Aristotle’s functional account emphasizes exchange. But is it silent on *how long* money may legitimately be held idle? Consider crucial gaps in his framework:  
      *   No theory of the price level or inflation/deflation.  
      *   No concept of a monetary authority managing systemic stability.  
      *   No developed conception of money as a *store of value across time* in a complex credit economy.  
      Does this silence *undetermine* the case for/against decay? Or does the core functional principle *decide* the issue? Argue your position.  

  ## Conclusion: Implications of Consistent Instrumentalism
  *   If we adopted Aristotle’s strictly *instrumental* view of money (solely for exchange) *consistently* across all contexts:  
      *   What core features of our *current practices* involving decaying money would need to change?  
      *   How would our legal concept of "owning" a monetary balance have to be redefined?  

  **Format:** 10-12 page essay. Engage primarily with Aristotle’s concepts and the philosophical implications of the cases. Minimal economic technicality; maximum conceptual clarity.  

  **Goal:** Use these modern puzzles to make Aristotle’s ancient theory sweat. Show what work it can (and cannot) do.  

  ---

  ## Why this structure works
  1.  **Builds from Concept to Contradiction:** Starts with what decay *is*, moves to what it *excludes*, then tackles the legal tension as a concrete philosophical problem.
  2.  **Forces Aristotelian Engagement:** Explicitly links each part (Convention, Function, Usury) to the texts. The "Mirror Image" question is crucial for deep critique.
  3.  **Highlights Gaps Productively:** Framing Aristotle’s silence on price levels, authorities, and store-of-value forces students to grapple with the *limits* of applying ancient theory to modern institutions, without dismissing it.
  4.  **Makes the Tension Central:** Part 3 is the fulcrum – resolving it requires sophisticated distinctions aligning with different *purposes* of holding money, fitting Aristotle's functionalism.
  5.  **Ends with Application:** The conclusion pushes beyond analysis to imagine the practical consequences of radical Aristotelian instrumentalism, satisfying the "real work" requirement.
  6.  **Clarity on Scope:** Explicitly avoids monetary economics, focusing on philosophy and legal concepts of ownership/function.

  This assignment should generate rigorous debate on whether decaying money is the ultimate fulfillment or perversion of Aristotle’s vision, forcing students to confront the interplay between abstract theory, institutional design, and legal conceptions of value.
