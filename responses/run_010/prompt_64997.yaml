prompt: |-
  I teach on the civilian faculty of a national defense academy and sit on the committee that revises the ethics module in the staff course for career officers. The module is supposed to be continuous with the law the officers actually operate under, and it is precisely at the seam between the two that I have run into a difficulty I cannot resolve. I would like a careful reconstruction of what the surrounding practice assumes.

  Four features of that practice are, I take it, uncontroversial:

  1. Captured members of a regular armed force are detained rather than punished. A soldier on either side who kills enemy combatants within the rules may be held for the duration, but is not treated as a criminal for having done so, and is released on the same terms as his opponent.
  2. The international crime of aggression reaches only persons in a position to direct or effectively control the political or military action of a state. A private who fights in a war of conquest commits no crime merely by fighting, and nobody proposes to charge him with one.
  3. Atrocity liability, by contrast, is individual and perfectly symmetric: the same prohibitions and the same punishments apply to the aggressor's rifleman and the defender's.
  4. The states that accept (2) and (3) nevertheless award medals for valor to their own soldiers for conduct in wars later widely judged unjust, and present the recipients publicly as moral exemplars rather than as people who got away with something.

  Last year, at a colleague's insistence, we added a paragraph telling cadets that some enemy combatants they are legally entitled to kill are nonetheless wronged by being killed — that a conscript who has been told nothing, or who serves under severe duress, may be excused without being someone it is morally permissible to kill. This year a cadet asked the obvious follow-up: if killing such a person wrongs him, does that not generate at least a presumptive duty to avoid killing him? The module's answer, which I helped draft, is that in combat there is no way to sort the excused-and-not-liable from the responsible-and-liable; every uniformed opponent presents the same evidential situation, so the practical permission to treat them alike survives the underlying moral distinction. The cadet replied that this reduces the permission to a merely evidential one, with two consequences he took to be fatal: the practice never actually asserted the moral symmetry it is usually said to embody, and feature (4) becomes inexplicable, since we do not normally decorate people for conduct we regard as excused-but-wrong.

  Please work through this step by step.

  (a) Reconstruct the account of the combatant's moral position that the practice as a whole presupposes. Does it require that combatants on both sides be moral equals — equally permitted to fight, equally liable to be attacked — or is it fully compatible with an epistemic excuse story, with a reciprocity or rule-consequentialist rationale, or with a view on which liability attaches to a role rather than to individual responsibility? Say which of these the practice actually needs and which merely happen to fit it.

  (b) Separate strict presupposition from congenial fit. Identify the points at which the practice is philosophically underdetermined, such that several incompatible theories would license exactly the same institutional behavior, and say what further evidence would discriminate among them.

  (c) Judge the fog-of-war answer on its merits. Can an evidential permission bear the weight the module puts on it, or does it quietly reintroduce the equality view it was meant to replace? And is the cadet right that decoration practices are inconsistent with treating one's own soldiers as merely excused?

  (d) Note what the liability-based alternative would have to say about our own side: if liability tracks responsibility for an unjust threat, then soldiers fighting an unjust war are not liable to be killed by their opponents, while opponents defending themselves are. Trace that through rules of engagement, prisoner treatment, the leadership-only structure of aggression liability, and the awards system. Is the resulting view implementable at all, or does it collapse back into something indistinguishable from the practice we have?

  I am genuinely unsure whether the cadet has located a real contradiction or a confusion, and I would rather not have the question settled by which side of the contemporary debate one happens to find congenial.
reasoning: |-
  Hmm, this is a deep and complex ethical question from a defense academy faculty member. The user is grappling with how to reconcile the legal treatment of combatants with underlying moral principles, particularly around the "moral equality of combatants" doctrine.

  Let me break this down systematically. The user presents four established features of military practice: (1) POW detention rather than criminal punishment for combatants, (2) aggression charges limited to leadership, (3) symmetric liability for atrocities, and (4) valor decorations regardless of war's justice. The core tension arises from last year's curriculum addition stating that some enemy combatants are morally wronged when killed, countered by a cadet's objection that this undermines both the moral symmetry claim and decoration practices.

  The user wants me to reconstruct the practice's presuppositions, separate necessary from contingent elements, evaluate the "fog of war" justification, and explore liability-based alternatives. Importantly, they want this analyzed neutrally, not through partisan debate lenses.

  First, examining the practice's presuppositions: The POW system and aggression liability structure strongly suggest combatants aren't viewed as moral criminals merely for fighting. Yet decorations imply positive moral standing - we don't decorate people for excused wrongdoing. The epistemic excuse (fog of war) explains battlefield permissions but struggles with decorations. Role-based liability fits better - the uniform itself creates liability regardless of personal responsibility.

  On philosophical underdetermination: The practice is compatible with both rule-consequentialist reciprocity and role-based liability views. But decorations tilt toward role-based views since they affirm the positive value of role-fulfillment. The leadership-only aggression liability is consistent with all theories because direct responsibility is clearer at command levels.

  Evaluating the fog-of-war answer: It works for battlefield decisions but creates tension with decorations. If killing excused enemies wrongs them, why decorate our soldiers for similar acts? This does seem inconsistent unless we embrace role-based liability.

  Exploring liability-based alternatives: If liability tracks responsibility for unjust threats, then in unjust wars only aggressors would be liable. But this would require:
  - Different ROE for attackers/defenders (operationally unfeasible)
  - Asymmetric POW treatment (violates Geneva Conventions)
  - Decorations only for just warriors (contradicts current practice)
  The resulting system would differ fundamentally from what exists.

  The cadet has identified a genuine tension. The practice implicitly assumes role-based liability, while the curriculum's "wronged even if excused" language points toward responsibility-based liability. These are philosophically incompatible foundations.

  For curriculum purposes, the clearest path is to openly acknowledge this tension and present role-based liability as the system's actual foundation. The fog-of-war argument should be confined to explaining battlefield permissions without extending to moral evaluation of soldiers' conduct.
answer: |-
  Your query reveals a profound tension in the foundations of military ethics. Let's reconstruct the practice's presuppositions step by step, following your framework:

  ### (a) The Practice's Presupposed Moral Position
  The practice **requires** the *moral equality of combatants* (MEC) as a foundational principle. This is not merely compatible with the practice—it is necessary for coherence. Here's why:

  1. **POW Status (Feature 1)** presupposes that capturing rather than prosecuting combatants reflects their moral parity. Detention is administrative, not punitive, implying combatants are not blameworthy *for fighting per se*.
  2. **Limited Aggression Liability (Feature 2)** reinforces this: only leaders bear responsibility for the war's justice, while rank-and-file are exempt. This separation *requires* that soldiers' participation isn't intrinsically culpable.
  3. **Symmetric Atrocity Liability (Feature 3)** further confirms MEC: violations are judged identically because combatant status itself is neutral.
  4. **Decorations (Feature 4)** are fatal to alternatives: We don't decorate people for excused wrongdoing (e.g., a coerced thief isn't given a medal). Valor medals imply the act *itself* is morally admirable, not merely excused.

  **What fits vs. what's required**:  
  - **Epistemic excuse**: Compatible but *insufficient*. It explains battlefield permissions (fog of war) but cannot justify decorations or POW non-culpability.  
  - **Reciprocity/rule-consequentialism**: Congenial (promotes restraint) but contingent. These are *rationales* for MEC, not replacements.  
  - **Role-based liability**: **Necessary and central**. The uniform itself triggers liability to attack and grants permission to fight, irrespective of the war's justice. This is the only view that explains all four features without contradiction.  

  ### (b) Underdetermination and Discriminating Evidence
  **Philosophically underdetermined aspects**:  
  - *Why* role-based liability applies: Is it grounded in collectivist ethics (state monopoly on force), social contract (soldiers consent to roles), or functional necessity (war's collective nature)?  
  - *Why* leaders bear aggression liability: Is it due to control, intentionality, or social role?  

  **Discriminating evidence**:  
  1. **Historical treatment of conscripts vs. volunteers**: If conscripts were treated as less liable (e.g., lighter sentences for atrocities), it would suggest responsibility matters. But symmetry in tribunals (e.g., WWII) shows role trumps voluntariness.  
  2. **State rhetoric around decorations**: Medals cite "duty to country" not "just cause," implying role-fulfillment is intrinsically meritorious.  
  3. **Lack of reparations to ex-combatants**: No compensation for "wronged" enemy POWs suggests the practice denies moral injury from lawful killing.  

  ### (c) Evaluating the Fog-of-War Answer and Decorations  
  1. **Evidential permission's weaknesses**:  
     - It *collapses into MEC*: If every combatant *must* be treated as liable due to epistemic constraints, the distinction between "liable" and "excused-but-not-liable" evaporates in practice. This functionally reinstates moral equality.  
     - **Cadet's fatal point**: Decorations are irreconcilable with this view. If our soldier kills an "excused" enemy, they commit a wrong (even if excused). We don't decorate excused wrongdoers (e.g., a soldier who kills under duress isn't celebrated). Medals require *positive moral worth*, which an evidential excuse cannot provide.  

  2. **Decoration inconsistency**: The cadet is correct. Awarding valor medals *while* calling similar enemy combatants "wronged" is logically incoherent. Either both are wrongdoers (excused or not), or neither is. The practice assumes the latter.

  ### (d) Liability-Based Alternative: A Collapse into MEC  
  If liability tracks *responsibility for unjust threat* (à la McMahan):  
  1. **Rules of Engagement (ROE)**: Soldiers in an unjust war could only be killed in self-defense when *imminently threatening*. Defenders could not proactively target aggressors without individual threat assessment—operationally impossible.  
  2. **POW Treatment**: Captured unjust combatants could be prosecuted as criminals (since they lack immunity). This violates Feature 1.  
  3. **Aggression Liability**: Leadership-only liability remains intact, as commanders are responsible for the unjust threat.  
  4. **Decorations**: Only just warriors could receive valor medals; unjust warriors' actions would be, at best, excused. Contradicts Feature 4.  

  **Result**: This view is **unimplementable** without abandoning core features:  
  - ROE would require discriminating intent/justness per combatant → collapses under fog of war.  
  - Prisoner treatment would become asymmetric → undermines reciprocity.  
  - The military justice system would fracture along national lines.  

  **Collapse into current practice**: To avoid chaos, states would *in practice* default to role-based liability ("combatant's privilege"), reinstating MEC. The alternative is philosophically coherent but practically identical to the status quo or wholly unworkable.

  ### Conclusion: The Cadet's Insight and a Path Forward
  The cadet identified a **genuine contradiction**: The curriculum's "wronged even if excused" language (implying non-liability) is incompatible with the practice's foundations, especially decorations. The fog-of-war argument fails because it cannot resolve this moral asymmetry.

  **What the practice needs**: A consistent **role-based liability** framework. Combatants are:  
  - Morally permitted to fight (hence decorations for valor).  
  - Liable to attack due to their role (hence no culpability for lawful killing).  
  - Culpable only for violations *outside* their role (atrocities).  

  **Recommendation for the module**:  
  1. Jettison the "wronged" language—it introduces incoherence.  
  2. Ground the ethics in the **institutional role of soldiers**: Their duty is to fight competently and lawfully *as instruments of state policy*, not to adjudicate the war's justice.  
  3. Explain decorations as honoring *virtues within the role* (courage, loyalty) irrespective of the war's morality.  
  4. Acknowledge that this role-based view is a pragmatic moral settlement—not a perfect truth, but necessary for the practice.  

  This preserves coherence with all four features while avoiding philosophical contradictions. The cadet's challenge, while unsettling, ultimately strengthens the curriculum by exposing its implicit foundations.
