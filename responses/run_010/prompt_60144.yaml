  ## Memorandum: Resolution of Fellowship Tie

  **To:** Fellowship Jury Members  
  **From:** [Your Name], Jury Member  
  **Date:** 12 October 2023  
  **Subject:** Recommended Course of Action for Resolving the 2023 Fellowship Tie  

  ### I. Introduction
  This memo outlines my recommended approach to resolving the unprecedented tie between Candidates A and B for the fellowship. Having reviewed the facts, constraints, and divergent proposals, I propose that the jury conduct a lottery to select the recipient at our meeting on the 14th. This recommendation addresses the legal mandate, respects our published policies and procedures, operates within the critical deadline, and provides the most transparent and defensible grounds for our decision, while acknowledging the inherent difficulty of the situation.

  ### II. Recommended Course of Action & Operational Steps
  1.  **Meeting on 14th October:**
      *   **Motion:** Formally acknowledge the tie under the published rubric, confirmed by blind re-scoring, and resolve to select the recipient by lottery.
      *   **Procedure:** Agree on a simple, verifiable method (e.g., drawing a named slip from an opaque container witnessed by all jurors). The chair will conduct the draw.
      *   **Documentation:** Draft the core statement for the board explaining the tie, the rubric's inability to distinguish the candidates, the adherence to merit-based scoring excluding prohibited factors, and the necessity and legality of the lottery as the only means to satisfy the deed's requirement for a single recipient within the timeframe.
  2.  **15th October:**
      *   **Notification:** The chair contacts the successful candidate.
      *   **Formal Letter:** The chair sends the formal offer letter to the successful candidate, confirming the fellowship terms and September 1st start.
      *   **Regret Notification:** The chair contacts the unsuccessful candidate, informing them of the outcome, acknowledging the tie, explaining the lottery resolution mandated by the deed and deadline, and outlining the appeal process. Provide the board statement.
  3.  **By 18th October:**
      *   **Finalize Board Statement:** Circulate the draft board statement for minor edits and formal approval by all jurors via email.
      *   **Submit Statement:** Submit the final statement to the board secretary.
  4.  **25th October:**
      *   **Deadline Met:** The candidate holding the competing offer (if unsuccessful) has clarity before their deadline. If successful, they formally accept the fellowship.

  ### III. Addressing Core Questions
  *   **The Deed's "Single Most Deserving" Requirement:** The deed requires us to judge and select the *single* most deserving candidate. Our exhaustive process, including blind re-scoring, confirms we have identified two candidates whose merit, as measured by the published instrument we are bound to use, is indistinguishable. Judging them equally deserving *is* our judgment under the rubric. The deed does not specify *how* to select one when judgment yields a tie. Selecting one by lottery, after confirming the tie through our mandated process, satisfies the requirement to *award* the fellowship to a single individual who has been judged maximally deserving – an outcome equally true for either candidate based on our assessment. It does not declare one superior; it acknowledges our instrument's limit and selects legally.
  *   **Nature of the Tie & Evidence:** The tie is fundamentally evidence about the *instrument* (the rubric and its application by this jury), not conclusive evidence about an inherent, unmeasurable difference in the candidates' desert. Our instrument, calibrated with specific weights, produced the same aggregate score for two distinct profiles. The blind re-score, producing different leading candidates per criterion while maintaining the aggregate tie, strongly suggests the tie arises from the rubric's structure (its specific weights and criteria definitions) and the inherent limitations of numerical scoring on complex profiles, rather than a failure of juror attention. The material we have – two identical aggregate scores across two independent scorings – settles that *this jury, using this rubric*, cannot rank them. It does not prove an objective, absolute equivalence beyond the scope of the instrument.
  *   **Altering the Basis of Comparison:** Once applications are received and evaluated under a published rubric, altering the basis of comparison (e.g., reopening the weights) is procedurally unfair and potentially unlawful. Applicants justifiably relied on the stated criteria and weights when submitting their dossiers. Changing the rules *after* submissions and scoring, especially to break a tie, introduces arbitrariness and undermines the integrity of the competition. It risks the perception (or reality) of tailoring the outcome. If we cannot alter the instrument post-submission, then we are bound by its results. The consequence of the confirmed tie under the binding rubric is that we must select one recipient by a mechanism *other* than re-scoring or re-weighting, as those avenues are exhausted or prohibited. The only available, legal mechanisms within our constraints are continued deliberation (impractical due to time) or chance.
  *   **Using Excluded Factors for Tie-Breaking:** A tie-break **may not** legitimately draw on material explicitly excluded from scoring by foundation policy (financial need, career stage, institutional prestige, prior disappointment, or the mentioned circumstances – impending retirement, competing offer). The policy states scoring "must rest on merit alone" and lists these as "ineligible considerations." The principle is one of *consistency* and *fairness*. The prohibition exists because these factors are deemed irrelevant to the core judgment of merit for this award. Allowing them to determine the outcome as a tie-breaker, even if not formally "scored," violates the spirit and letter of the policy. It reintroduces precisely the kind of considerations the policy sought to eliminate, leveraging excluded information to override the merit-based judgment that resulted in a tie. The distinction between "scoring" and "tie-breaking" is formalistic and hollow in this context; the outcome is still determined by a factor deemed ineligible for determining the recipient.

  ### IV. The Strongest Case Against (For Continued Deliberation)
  The most compelling alternative argument is that a tie represents a failure of the jury's duty rather than a genuine equivalence. Proponents argue: "We are paid to *judge*, not to abdicate to chance. A tie indicates insufficient discernment, not a fact about the candidates. Our obligation is to deliberate further, rigorously re-examining the dossiers, debating the nuances of originality versus rigor, significance versus feasibility, and the true meaning of the weights – even if it means sacrificing the September 1st start date. Perseverance will reveal a distinction. Awarding based on a lottery betrays our responsibility to apply expert judgment and reduces a profound decision to mere luck. The deed demands discernment, and we must fulfill that duty regardless of time constraints."

  ### V. Why This Case Does Not Carry
  While principled, this argument underestimates the finality of our process and the nature of the evidence. We have *already* exercised rigorous judgment – twice. The blind re-scoring was specifically designed to eliminate potential bias or inattention and *still* yielded an identical tie. The shift in which candidate led on which criteria *between* scorings demonstrates active engagement and detailed consideration, not a lack of attention; it highlights how the rubric aggregates distinct strengths into an identical sum. Further deliberation, absent a change in the scoring rules (which we cannot do), risks either:
  1.  Introducing new, unstated, and potentially arbitrary criteria or interpretations of the existing weights/criteria to force a distinction, violating procedural fairness and the published rubric, or
  2.  Persisting indefinitely without guarantee of resolution, jeopardizing the fellowship's timely implementation and the candidate with the expiring offer, causing tangible harm based on our inability to conclude.

  The deed requires a decision. Given our confirmed inability to rank the candidates *under the binding rubric* through our best efforts, and the immutable deadline, the lottery becomes the only viable means to fulfill the deed's core requirement to *award* to a single, maximally deserving candidate (as both are) without resorting to procedurally unfair alterations or prohibited considerations. It is not an abdication but a necessary procedural step when judgment, fully exercised under the rules, reaches its limit. It acknowledges the reality our process revealed, rather than forcing an artificial distinction.

  ### VI. Conclusion
  The lottery, while imperfect, is the most defensible path forward. It respects the deed's requirement for a single recipient, adheres strictly to the merit-based scoring policy by refusing to introduce excluded factors, operates within the critical deadline, and is procedurally sound and lawful. It transparently reflects the outcome of our exhaustive judgment process: two candidates of equal merit under the binding rubric. I urge the jury to adopt this course at our meeting on the 14th.
