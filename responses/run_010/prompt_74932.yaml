prompt: |-
  I cover science and ideas for a general-interest magazine, and I'm finishing a profile of a behavioral ecologist who has spent her career on signal honesty — the Zahavi/Grafen apparatus, indices versus badges, honest signals versus cheap talk. She is unusually disciplined about which displays she will call handicaps, and I have careful notes from three weeks of interviews plus her graduate seminar, where she worked down a list of cases and ruled on each. Her verdicts:

  - The peacock's train: no. It records what he managed to be last season. The female reads a résumé, and nothing is being paid while she reads it.
  - The bowerbird's bower: no. Weeks of solitary labor, after which the female arrives to inspect a monument. Whatever was spent, she did not see it spent.
  - Thomson's gazelle stotting: yes. He pays in front of the animal he is paying to — energy and exposure, burned while the predator watches — and a gazelle in poor condition cannot keep it up.
  - Red deer roaring contests: yes. The rate is the message. By the twentieth roar a stag is spending something he cannot conceal, and his rival is counting.
  - The low pitch of a male toad's call: no. It is set by his size and a small male cannot fake it, but a measuring stick is not a price. Unfakeable is not the same as costly.
  - The house sparrow's black bib: no. Cheap felt. The honesty lives in the beating a bluffer takes from rivals, not in the badge. That is a police force, not a handicap.

  The case my editor wants me to put to her before we go to press is one she has not ruled on. Courtship feeding in a fish-eating seabird — say a tern, though the species doesn't matter. The male hunts for himself and brings the female fish through courtship and early laying; females consistently prefer the males who feed them most often; and the food is not symbolic, since better-fed females lay more and better eggs. Every delivery happens in front of her, and a male in poor condition cannot hold the rate up for long.

  Predict her verdict on the tern, and predict what she would call it if not a handicap, since she evidently keeps more than one name for a non-handicap. Then do the harder part: lay out every rule that is compatible with all six of her prior rulings — I suspect at least three survive, and one of them is not the textbook account her verdicts first appear to endorse — and state what each predicts for the new case. Tell me which rule you would bet on and why: which of her stated reasons carry the most weight, and which are consistent with several candidate rules at once. Finally, name the further cases I should ask her about to separate the survivors, what each rule commits her to saying about each of them, and whether any such answer would force her to reopen one of the six verdicts above.
reasoning: |-
  Hmm, the user is a science writer finishing a profile on a behavioral ecologist specializing in signal honesty. They need to predict this expert's verdict on courtship feeding in terns based on her strict criteria for "handicaps," and then reverse-engineer her underlying rules from six prior rulings.

  Let me first parse her existing verdicts. She clearly distinguishes between signals that demonstrate current condition through active expenditure (handicaps) versus those that merely reflect past state or fixed traits. The peacock's train and bowerbird's bower are rejected as handicaps because they're historical records without real-time cost display. Stotting and roaring qualify as they involve observable, unsustainable expenditure during the interaction. The toad's call and sparrow's bib fail because they're unfakeable indices or rely on external enforcement rather than inherent costs.

  For the tern case: courtship feeding involves real-time energy expenditure (hunting/delivery) directly observable by the female, with condition-dependent sustainability. This seems to align with stotting and roaring. But I recall her rejecting the bower despite "weeks of labor" because the cost wasn't witnessed - so observability matters. Here, every delivery is witnessed, tipping it toward handicap status. However, the "résumé" objection to the peacock might apply if she views the fish as stored effort rather than performance. But unlike the bower, the male must sustain the delivery *rate* - which echoes the roaring contest's cumulative toll.

  Now for rule extraction. At least three frameworks fit her verdicts:
  1. **The Performance Principle**: Only signals requiring real-time physical output that can't be faked due to current condition (stotting/roaring yes; train/bower no).
  2. **Cost Visibility Doctrine**: Costs must be incurred during signal reception (thus bower's pre-built costs excluded).
  3. **Test of Sustained Expenditure**: Signals must impose escalating costs that reveal reserves through persistence (roaring's 20th roar; train's one-off growth doesn't qualify).

  The tern case satisfies all three: hunting is performative, costs are visible per delivery, and rate maintenance tests endurance. But what if she nitpicks? If she argues fish represent transferred energy rather than pure expenditure (though he did hunt it), or that the female sees outcomes not effort (but she witnesses deliveries). Still, her gazelle example suggests observing the act itself is sufficient.

  To test these rules, I'd propose:
  - **Lekking grouse display**: Sustained performance with visible exhaustion? All rules say handicap.
  - **Mantis shrimp strikes**: Unfakeable due to physiology, but no active cost - Performance Principle rejects, others may accept.
  - **Baboon grooming time**: Is time expenditure inherently costly? Divergence points here.

  Her "résumé" critique carries most weight - it's her consistent differentiator. But the tern's ongoing effort feels distinct from the peacock's static feathers. I'd bet on Performance Principle as her core framework, given how she emphasized "paying in front" for stotting and roaring. Still, the editor should probe cases where signals involve time/energy without physical spectacle (e.g., continuous bird song) to clarify if observability requires visual drama or just demonstrable effort.
answer: |-
  Based on her prior rulings and reasoning, I predict her verdict on tern courtship feeding will be **"No, not a handicap"** – but she *would* classify it as an **"honest signal via sustained performance test"** (or similar phrasing). Here's the full analysis, rules extraction, prediction, and testing strategy:

  ### Prediction for Tern Courtship Feeding
  - **Verdict:** Not a handicap.  
  - **Her Likely Label:** "Sustained performance signal" or "Condition-dependent investment signal."  
  - **Why:**  
    While the tern's feeding meets *some* handicap criteria (costly, honest, condition-dependent), it fails her core requirement: **the signaler must pay a *demonstrative cost* *while being observed* by the receiver, in a way that directly *impairs* the signaler during the act.**  
    - The tern *invests* energy (hunting), but the cost is not *performed as a display* under duress. The female observes *outcomes* (fish deliveries), not the *act of expenditure itself* (the strenuous hunt). This parallels her "résumé" objection to the peacock's train (past effort) and bowerbird's bower (solitary labor).  
    - A male "in poor condition cannot hold the rate up" due to *sustained depletion*, not because each delivery is a *performance* that exposes him to immediate risk (like stotting) or cumulative strain (like roaring). It's a test of endurance, not a real-time handicap.

  ---

  ### Extracted Rules Compatible with All Six Verdicts
  Her rulings imply at least three distinct (and overlapping) frameworks for distinguishing handicaps from other honest signals. **All three rules survive** her cases:

  1. **The Performance Rule (PR):**  
     - **Definition:** A handicap requires the signaler to engage in a **physically demanding, observable performance** that *directly impairs* them (e.g., wasting energy/heightening risk) *while the receiver watches*. The cost must be *incurred during signaling*, not beforehand.  
     - **Supported by:**  
       - Gazelle stotting (yes): Burns energy + increases exposure *while predator watches*.  
       - Red deer roaring (yes): Each roar costs energy; cumulative strain *observed by rival*.  
       - Rejects peacock train (no), bowerbird bower (no), toad call (no), sparrow bib (no): No real-time performance cost.  
     - **Tern Prediction:** Not a handicap. Delivering fish is an *outcome* of effort, not the performance itself. The hunt is solitary.  

  2. **The Direct Cost Visibility Rule (DCVR):**  
     - **Definition:** A handicap requires the receiver to **witness the cost being paid** in real time. The signal and its *immediate detrimental consequence* must be co-observed (e.g., energy burn, vulnerability).  
     - **Supported by:**  
       - Stotting (yes): Predator sees cost (energy/risk).  
       - Roaring (yes): Rival sees/hears escalating strain.  
       - Rejects train (no), bower (no): Costs paid in private. Accepts toad call (no) and bib (no) as indices, not handicaps.  
     - **Tern Prediction:** Not a handicap. Female sees fish (signal outcome), not the cost of hunting (energy depletion, risk).  

  3. **The Sustained Expenditure Test Rule (SETR):**  
     - **Definition:** A handicap requires **cumulative, unsustainable expenditure** that *escalates* during the interaction, forcing the signaler to reveal reserves through *persistence*. "Cheap" initial signals don't count; the *marginal cost* must increase.  
     - **Supported by:**  
       - Roaring (yes): 20th roar costs more than the 1st; rivals "count" to force exhaustion.  
       - Stotting (yes): Poor-condition gazelles can’t sustain jumps.  
       - Rejects train (no: one-time cost), bower (no: pre-built), toad call (no: static), bib (no: static).  
     - **Tern Prediction:** **Potentially yes** – but she'd likely reject it on other grounds. Males *do* face a sustained test (holding delivery rate), but SETR alone doesn’t require real-time visibility (PR/DCVR do). Her stotting/roaring verdicts prioritize visibility over pure endurance.  

  ---

  ### Which Rule to Bet On & Why
  - **Bet on the Performance Rule (PR).**  
  - **Why:**  
    - Her most consistent emphasis is on **real-time, observable impairment** (e.g., "paid in front," "burned while the predator watches"). This is the *only* criterion that unambiguously supports *both* her "yes" cases (stotting, roaring) and rejects *all* "no" cases.  
    - **Strongest Evidence:** Her critique of the bowerbird ("she did not see it spent") and peacock ("nothing is being paid while she reads it") shows DCVR/PR dominate. Her dismissal of the toad call ("a measuring stick is not a price") further prioritizes *active payment* over intrinsic constraints.  
    - **Caveat:** SETR is implicit in roaring/stotting, but she *subordinates it* to performance/visibility. The tern’s endurance test might satisfy SETR, but PR/DCVR override it (costs not *performed* or *observed*).  

  ---

  ### Cases to Separate the Rules & Test Commitments
  Ask her about these; each rule predicts different verdicts. **None force reopening prior rulings** – they refine distinctions:  

  1. **Lekking Grouse Display:**  
     - Males perform exhausting, hours-long dances in front of females. Costs include energy depletion and predation risk *during the display*.  
     - **PR/DCVR:** Handicap (cost performed + observed).  
     - **SETR:** Handicap (sustained exertion).  
     - **Test Purpose:** If she calls this a handicap, PR/DCVR are primary. If not, SETR gains weight.  

  2. **Mantis Shrimp Strikes (Ritualized Fights):**  
     - Opponents exchange high-energy strikes that could injure both. Cost is paid *during* the interaction, but poor-condition shrimp can "bluff" a few strikes.  
     - **PR/DCVR:** Handicap (real-time cost/risk observed).  
     - **SETR:** Not a handicap (no *cumulative* test; resolved in few strikes).  
     - **Test Purpose:** Does she require *sustained* escalation (SETR) or just observed cost (PR/DCVR)?  

  3. **Baboon Grooming Time:**  
     - High-ranking males groom females for long periods, costing time/energy. Females observe grooming duration.  
     - **SETR:** Handicap (sustained depletion reveals reserves).  
     - **PR/DCVR:** Not a handicap (grooming itself isn’t "impairing"; cost is opportunity-based, not performative).  
     - **Test Purpose:** If she calls this a handicap, SETR dominates; if not, PR/DCVR are stricter.  

  4. **Cricket Chirping at Predators:**  
     - Some crickets chirp when attacked, costing energy *while the predator is present*, potentially deterring it.  
     - **PR/DCVR:** Handicap (performed under threat, observed).  
     - **SETR:** Not necessarily (short-term signal).  
     - **Test Purpose:** Confirms whether "payment under observation" alone suffices, even if brief.  

  **Key Insight:** Her framework is likely **PR + DCVR**, with SETR as a corollary for signals like roaring. The tern fails because its costs are *investments* (like the bower) rather than *performances* (like stotting). For your article, emphasize her view that handicaps are a *subset* of honest signals – reserved for real-time, demonstrative sacrifices.
