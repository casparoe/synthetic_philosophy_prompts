prompt: |-
  hey, so I'm a 4th-year PhD student in political philosophy and the prof has (bizarrely) let me set this years take-home for our grad seminar on group agency and social choice. I'd like you to act as a working philosopher who has taught judgment aggregation for years and has set and marked a bunch of these exams — someone with real social-choice chops, not a textbook summariser. Please think carefully and do some visible scratchwork before you hand me the deliverable.

  What I want: one take-home question on judgment aggregation, answerable in about 3 hours, worth 25 marks, plus a model answer and a marking scheme.

  The crux I want it to turn on: I'm sick of questions a student can ace by reciting the standard three-judge doctrinal paradox with P, Q and C = P&Q. So build the question around a profile where the premise-based procedure returns a conclusion that every single judge rejects — the collective verdict is nobody's verdict — and yet the collective judgment set still comes out consistent and deductively closed. Then have them build a second profile on the *same* agenda where issue-by-issue majority voting instead comes out flatly inconsistent. The comparison between those two is the heart of it: what's generating each pathology, and which of them is actually the engine of the impossibility result. I'm pretty sure both are buildable, so show me the tallies.

  Before you write the question, brainstorm three or four candidate agenda structures out loud (a conjunction of three premises? something disjunctive in there? a chain where a second conclusion C2 = C1 & P3?), pick one, say why, and then check your profiles row by row — tally every proposition, confirm each judge is individually complete and consistent, confirm the collective sets come out how you claim. If what I've asked for turns out to be impossible on the agenda you picked, say so plainly and tell me what to ask for instead. Don't quietly fudge it.

  The question itself should come in roughly three parts: (i) construct and verify both profiles; (ii) diagnose — what produces the "nobody's verdict" case, is it a Condorcet cycle in disguise, and which condition of the classic impossibility theorem does the premise-based rule give up in order to escape it (and does the theorem even bite on an agenda this small? be careful here, don't overclaim); (iii) the design question — is "the court's verdict is no individual judge's view" a decisive objection to voting on the reasons, given that we don't seem to treat the parallel fact about legislatures as decisive; and relatedly, should a judge who knows her court votes premise-by-premise vote her reasons or her bottom line.

  Model answer 800–900 words, with the profile tables included. Marking scheme out of 25: about six must-hit moves, the marks for each, and one line per move on how students typically screw it up. Also tell me what a C answer looks like — I want to be able to cap anyone who just narrates the doctrinal paradox back at me.

  No bibliography, no reading list, no citations anywhere. Refer to results by description only where its genuinely common knowledge, and if you're not sure who said what, just make the argument and drop the name. Please don't pad — I'd rather have a tight question and a sharp key than a lot of throat-clearing.
