  - Option 2: Disjunctive conclusion like C = P∨Q - premise-based voting might not isolate the "nobody's verdict" effect well
  - Option 3: Chained conclusions: C1 = P1∧P2, C2 = C1∧P3 - ah, this has promise

  The chained agenda (P1, P2, C1=P1∧P2, P3, C2=C1∧P3) seems most viable. It creates multiple layers where majorities can compound strangely. Now verifying if both pathologies are achievable:

  For the "nobody's verdict" in premise-based voting:
  - Need C2 true collectively while every judge rejects it
  - Design profile where majorities support P1, P2, P3 individually (forcing C2 true via premises)
  - But each judge has some premise false in their set
  - After testing tallies: yes, possible with 3 judges holding different premise combinations

  For inconsistent issue-by-issue majority:
  - Need direct majority voting to produce inconsistent set
  - With the chained agenda, this requires a cycle in the logical dependencies
  - Testing: if majorities support P1, P2, C1, P3 but reject C2? But C2=C1∧P3, so inconsistency
  - Achievable with different judge configuration

  Both work on the chained agenda. Now structuring the question:
