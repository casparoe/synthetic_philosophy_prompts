prompt: |-
  So I've got this little podcast — nothing fancy, recorded on a laptop in the spare room, maybe three hundred regulars — and I've never studied any philosophy, I'm a plumber by trade basicly, but there's one idea I've been chewing on for a couple of years now and its become my whole thing. Next month my guest is a philosopher who defends moral particularism: roughly, that there aren't any exceptionless moral principles, and that whether a feature of a situation counts as a reason to act depends entirely on the case you're in.

  Here's my own version of why the view grabs me, and I'd like one of the questions built out of it. My mate Dave pulls out of my birthday every single year because he's "not feeling great". The first couple of times, that's obviously a reason to go easy on him. By the sixth year running, the exact same sentence out of the exact same mouth stops being a reason for sympathy and starts being a reason to be cross with him. Nothing about the words changed. I get that — but I also worry I'm just dressing up "context matters", which everyone already believes.

  Can you write me about ten questions I could actually say out loud? Not "what got you interested in this" rubbish. I want ones that make him work:

  - At least one that presses on his go-to examples of reasons flipping sides, and then goes after the comeback I expect, which as I understand it is that he's quietly swapped the description of the consideration — it isn't the very same feature any more. I want the follow-up that stops him retreating into re-describing forever.
  - One on the extra machinery, the conditions that aren't reasons themselves but switch reasons on and off, or turn the volume up and down on them. My worry, in plain terms: if you can list those conditions, isn't that just principles with extra steps?
  - One on the objection that the moral stuff has to hang off the non-moral stuff in some systematic way, and his likely answer that the "principles" this hands you are so wide they don't say anything. Then the follow-up: so what's actually left of the idea that morality is principled?
  - One that asks him straight out whether his position is either empty or just false, depending on how thin or how thick you make the notion of a principle.
  - One about teaching my kid, or advising a mate in a mess — what does particularism tell a complete beginner to do, and how does anyone learn if there's nothing to learn?
  - One about disagreement: if two of us look at the same case and see different reasons in it, what could possibly settle it? Does his view leave blame and moral argument with nothing to grip?
  - One asking whether the same goes for reasons to believe things rather than do things, and whether he'll own that it does.
  - One on the stronger claim I've heard him flirt with — that in the right circumstances a temptation isn't outweighed but silenced, doesn't even show up as a reason. Does he need that, or is it a luxury he could drop?

  For each question, give me (a) the answer he's most likely to reach for, in a sentence or two of his own voice, and (b) one follow-up keyed to that exact answer that makes it harder to give a second time. Then put them in an order that builds, mark two I could cut if we're running over, and flag anywhere you think he could fairly accuse the question of assuming he's wrong before he's answered.

  British English please, and write them the way a person would really say them, because I'll be reading some off the page on air — not like an essay. And no reading list or references, I'd have no way of checking them and I'm not name-dropping anything on the show.
reasoning: |-
  Okay, the user runs a small podcast and is preparing for an interview with a philosopher who defends moral particularism. He's a plumber by trade, no formal philosophy background, but he's deeply engaged with this idea. His main example involves his mate Dave skipping his birthday repeatedly, where the same excuse shifts from being a reason for sympathy to a reason for annoyance. He wants sharp questions that challenge the philosopher without being academic or pretentious.

  First, I need to unpack his key concerns. He's worried his own view might just be "context matters," which everyone agrees with. He wants questions that push the philosopher on specific weaknesses of particularism. His list includes eight specific angles: reasons flipping sides without re-description, the problem of "enablers/disablers" becoming principles themselves, the systematicity objection, the emptiness/falsity dilemma, pedagogical implications, disagreement resolution, extension to epistemic reasons, and the stronger claim about silencing reasons.

  The user emphasizes practicality: questions must be spoken naturally in British English, avoid academic jargon, and feel authentic to his podcast's vibe. He also wants each question structured with (a) the predicted answer and (b) a sharp follow-up, plus sequencing that builds tension. Two questions should be marked as skippable for time.

  I notice his Dave example is crucial – it's relatable and anchors the abstract debate. The questions should leverage concrete scenarios like this to keep things grounded. His plumber background suggests avoiding theory-heavy framing; even the "enablers/disablers" point needs plain phrasing like "machinery that switches reasons on/off."

  For the "reasons flipping sides" question, the core challenge is resisting re-description. The philosopher might say Dave's sixth excuse isn't truly "the same feature" due to accumulated context. The follow-up must block this escape by asking when context accumulation *doesn't* change the feature's identity. 

  On "enablers/disablers," the user fears they're just principles in disguise. The philosopher may distinguish them as non-reason-givers. The follow-up should press whether listing such conditions creates de facto rules – maybe using the Dave example to ask what "disabler" made sympathy inappropriate.

  The systematicity objection questions need care. If the philosopher argues moral facts supervene on non-moral facts but resist codification, the follow-up could ask why we call this "principled" at all. This touches the emptiness/falsity dilemma later.

  For pedagogy ("teaching my kid"), the particularist might say we learn through practice and sensitivity. The follow-up could challenge how this differs from rule-learning if teachers highlight patterns anyway.

  Disagreement is thorny – if reasons are case-specific, what resolves clashes? The philosopher may appeal to better perception. The follow-up: does this make moral progress impossible without perfect observers?

  Extending to epistemic reasons tests consistency. If he denies it, we ask why morality is special; if he accepts, we note radical implications for logic/rules.

  Finally, on "silencing" (e.g., temptation not counting as reason), the follow-up should probe if this overcomplicates things versus outweighing.

  I'll sequence questions to start concrete (Dave), then unpack machinery, then hit big-picture issues (systematicity, emptiness), then practical consequences (learning, disagreement), with epistemic and silencing as optional deep cuts. The "emptiness/falsity" and "disagreement" questions are marked skippable.

  Red flags: The "systematicity" follow-up might assume particularism denies principles – I'll note that. The "silencing" question could be seen as loaded if phrased as "luxury he could drop." British phrasing like "mate," "rubbish," and "cheeky" will keep it authentic.
answer: |-
  Right, got it. You want proper, working questions that hit the nerve, sound like you, and make him sweat a bit – not academic waffle. Based on your Dave example and the points you want covered, here are ten questions designed to put the boot in, phrased how you'd say them on air, with the predicted dodge and the follow-up kicker.

  **Order of Attack (Builds from concrete to deep implications):**

  1.  **The Dave Dilemma (Flipping Reasons & Re-description)**
  2.  **The Hidden Machinery (Enablers/Disablers vs. Principles)**
  3.  **Teaching & Learning (The Beginner Problem)**
  4.  **Disagreement & Grip (Does Anything Settle It?)**
  5.  **System or Chaos? (The Systematicity Worry)**
  6.  **Thin or Thick? (The Emptiness/Falsity Dilemma)** **<-- Good Cut Option 1**
  7.  **Belief vs. Action (Does it Spread?)**
  8.  **Silencing Temptations (Luxury or Necessity?)** **<-- Good Cut Option 2**
  9.  **System or Chaos? FOLLOW-UP (After his answer to #5)**
  10. **The Dave Dilemma FOLLOW-UP (After his answer to #1)**

  ---

  **The Questions:**

  1.  **The Dave Dilemma:** "Right, so my mate Dave bails on my birthday every year saying he's 'not feeling great'. First couple of times? Obvious reason to be decent about it. Sixth year running? Exact same words, exact same bloke – now it feels like a solid reason to be properly narked with him. You'd say the 'feature' – him saying he's not feeling great – flipped from being a reason *for* sympathy to a reason *against* it, yeah? But I reckon your comeback here is that it's *not* really the same feature anymore, because of all the history. Yeah?"
      *   *(a) Likely Dodge:* "Precisely. The context – the repeated pattern, the potential insincerity, the disregard implied over time – fundamentally alters the *nature* of the utterance. It's not just 'unwell'; it's 'unwell *in this context of habitual let-down*'. The description needs to capture that richness to see the reason correctly."
      *   *(b) Follow-up Kick:* "Right, but where does that stop? If I can *always* say ‘Ah, but look at *this* extra bit of context’, haven’t I just made it impossible for anything to *ever* be *exactly* the same feature twice? Doesn’t that just mean ‘feature flipping’ is a bit of a trick with words? How do we actually pin down what the 'feature' is *before* we know how it behaves in the context?" ***(Potential Fair Accusation: Could argue the question assumes features *must* be isolatable pre-context, which he denies.)***

  2.  **The Hidden Machinery:** "Okay, so you talk about things that aren't reasons themselves but sort of switch other reasons on and off, or crank the volume up and down – like 'enablers' or 'disablers'. So in Dave's case, maybe the repetition is a 'disabler' for the sympathy reason. But my worry is dead simple: if I can *list* all these conditions – repetition disables sympathy, proximity intensifies obligation, whatever – isn't that list just... well, principles? Aren't you smuggling rules back in through the back door?"
      *   *(a) Likely Dodge:* "Not at all. These enabling or disabling conditions aren't themselves *reason-giving*. They don't tell you *what* to do; they just affect how *other* features function as reasons *in this specific instance*. They don't generate universal rules; they describe how reasons are sensitive to the holistic situation."
      *   *(b) Follow-up Kick:* "But if I *can* reliably say 'Repeated excuses disable the sympathy reason', or 'Pain is generally a reason to help *unless* it's self-inflicted malice' – doesn't that *function* exactly like a rule? What's the practical difference between saying that and having a principle with exceptions?"

  3.  **Teaching & Learning:** "Let's say I'm trying to teach my kid right from wrong, or advise a mate who's in a right mess and needs basics. What does particularism tell this complete beginner to *do*? If there's no rules, no starter principles, how do they even begin? And more importantly, how do they *learn* from experience if there's nothing general to latch onto?"
      *   *(a) Likely Dodge:* "They learn through perception, practice, and developing moral sensitivity – like learning to recognise faces or appreciate complex flavours. We point to paradigms: 'See *this* kindness? That's good.' 'See *that* cruelty? That's bad.' They build a repertoire of nuanced understanding, not a rulebook. Guidance comes from shared examples and developing judgement, not abstract codes."
      *   *(b) Follow-up Kick:* "So, when my kid asks *why* shoving his sister was wrong, do I just say 'Look harder at *this specific shove*'? Doesn't me pointing to 'cruelty' or 'unfairness' or 'causing hurt' – even tentatively – mean I *am* giving him thin principles to start with? How does he get from 'this shove bad' to understanding *any* new situation without at least *some* general hooks?"

  4.  **Disagreement & Grip:** "Alright, say me and another bloke look at the exact same situation – Dave bailing again, say – and I see a reason to be cross, but he sees a reason to give him yet another pass. If reasons are entirely down to the particular case and there's no underlying rules, what on earth could *settle* that disagreement? Does your view mean blame is just personal taste, and moral arguments have no real traction?"
      *   *(a) Likely Dodge:* "Disagreement isn't fatal. We argue by pointing to other salient features of the situation the other might have missed or misweighted, or by appealing to shared paradigms. 'Look at the pattern!' 'See how this undermines trust!' Moral argument is about refining perception and understanding the complex whole better, not checking against a rulebook."
      *   *(b) Follow-up Kick:* "But if we both agree on *all* the non-moral facts – Dave said X, he's done it Y times, he was seen down the pub last night – and we still fundamentally disagree on what *reason* is there, what's left? Does it just boil down to 'Well, *I* see it this way'? Doesn't that make moral progress impossible unless everyone becomes a moral genius?"

  5.  **System or Chaos?:** "One big worry people have is that moral judgements have to *hang off* the non-moral facts in *some* systematic way – same non-moral setup, same moral result. You'd probably say 'Yeah, but the system's so complex and context-sensitive that any "principles" you could write down would be either uselessly vague or full of holes'. That about right?"
      *   *(a) Likely Dodge:* "Exactly. Supervenience holds – the moral *is* determined by the non-moral – but the mapping is infinitely complex and context-dependent. Any purported principle you try to formulate will either be trivially true ('Be good!') or riddled with exceptions and ceteris paribus clauses that make them practically useless or misleading guides for actual judgement."
      *   *(b) Follow-up Kick:** (Hold this one - ask AFTER he answers #5, see below for #9)*

  6.  **Thin or Thick? (Cut if needed):** "Here's a cheeky one: isn't particularism either empty or just false? If we make the idea of a 'principle' really thin – like 'Pain is *generally* a reason to help' – then your view seems false, because we *do* use these rough guides. But if we make 'principle' really thick – meaning strict, exceptionless rules – then your view seems empty, because *nobody* seriously defends *those* kind of rules anymore, do they? So what's actually new or controversial here?"
      *   *(a) Likely Dodge:* "It's not about thin generalisations, which are often useful heuristics. It's about denying those heuristics have *fundamental* status or that morality *is constituted by* such rules. The controversial claim is that *no* finite set of principles, however complex, can *capture* or *ground* moral reasoning. The particular case is primary; generalisations are secondary summaries."
      *   *(b) Follow-up Kick:* "But if you accept thin, defeasible generalisations as useful summaries, and you agree morality supervenes on the non-moral, what's the *practical* difference for someone like me trying to navigate the world? Isn't the fight really just against a straw man of rigid rule-worship nobody holds?"

  7.  **Belief vs. Action:** "This flipping and context-dependence you talk about for moral reasons – does the same apply to reasons for *believing* stuff? Like, does the fact that something looks red stop being a reason to believe it's red in some weird context? And if it doesn't apply there, why is morality special?"
      *   *(a) Likely Dodge:* *(Likely one of two ways)* "1) 'Yes, absolutely. Epistemic reasons are similarly context-sensitive and holistic. A perceptual seeming might be a reason to believe, unless you know you've taken a drug that causes hallucinations.' OR 2) 'There might be important disanalogies. Epistemic reasons often aim at truth via reliable processes, which might allow for more stable, rule-like connections, unlike the open-ended nature of practical reason.'"
      *   *(b) Follow-up Kick:* *(If he says Yes)* "Blimey. So even logic and evidence aren't safe? Doesn't that make *all* reasoning feel a bit untethered?" *(If he says No)* "Why the carve-out? If context can radically reshape moral reasons but not epistemic ones, what's the fundamental difference that *explains* that? Doesn't that suggest morality *isn't* about tracking objective features in the same way?"

  8.  **Silencing Temptations (Cut if needed):** "I've heard you suggest something stronger sometimes – that in the right situation, a temptation isn't just outweighed by a stronger reason, it's completely *silenced*. Like, it doesn't even register as *any* kind of reason to do the bad thing. Is that a core part of your view, or just a fancy extra you could ditch? Do you *need* silencing?"
      *   *(a) Likely Dodge:* "Silencing is a real phenomenon in certain contexts, especially involving deep commitments or virtues. For the truly virtuous person facing a clear duty, the temptation to betray it might not even present itself *as a competing reason*. It's not essential to *all* particularism, but it highlights how radically the *presence* of reasons can be affected by context."
      *   *(b) Follow-up Kick:* "Isn't that just overcomplicating things? Why not just say the reason *not* to betray is infinitely stronger in that moment? What does saying the temptation 'isn't a reason' actually *add* that outweighing doesn't cover, besides sounding more dramatic?"

  9.  **System or Chaos? FOLLOW-UP (Ask after he answers #5):** "You said morality supervenes but the 'principles' are useless. But if the connection between non-moral facts and moral reasons is utterly resistant to any systematic summary we can articulate – if there's no *learnable, shareable structure* to how they link up – then what's left of the idea that morality is *principled* at all? Isn't it just chaos with a fancy name?"
      *   *(a) Likely Dodge:* "It's principled in the sense of being *intelligible* and *consistent* at the level of the particular case. We can *explain* why this feature matters here by appealing to the whole context. The 'principle' is the demand for sensitive, holistic perception, not a set of codified rules. It's complex order, not chaos."
      *   *(b) Follow-up Kick:* "But 'sensitive, holistic perception' sounds like 'winging it'. If two people with equally good perception come to opposite conclusions on a genuinely new case, and there's *no* codifiable structure to appeal to beyond 'look harder', how is that different in practice from chaos? Where's the 'intelligibility' for anyone *else*?"

  10. **The Dave Dilemma FOLLOW-UP (Ask after he answers #1):** "Earlier you said the repetition changes the feature's nature. But let's press that. Is there *any* feature you can name – *any* fact about a situation – that you're confident *always* counts as a reason (or against) in *exactly the same way*, no matter what other context you pile on? Just *one*?"
      *   *(a) Likely Dodge:* "Probably not in a way that's useful. Even something like 'causing intense pain for fun' might be different in some extreme hypothetical (e.g., necessary to prevent greater catastrophe, though even that's debatable). The point is, we shouldn't *assume* constancy; we should check the context."
      *   *(b) Follow-up Kick:* "So, if *no* feature has a guaranteed, fixed reason-giving force, and context can fundamentally alter *any* feature's moral import, how do we avoid just making it up as we go along? Doesn't this constant 'checking' just mean morality is infinitely malleable?"

  ---

  **Key for Delivery:**

  *   **Sound Natural:** Read them like you're having a slightly intense but good-natured argument down the pub. Emphasise "Dave", "my kid", "bloke", "narked", "rubbish", "cheeky".
  *   **Build:** Start with Dave (#1) to hook everyone, then hit the machinery (#2) and learning (#3) to show practical worries. Disagreement (#4) and System (#5) hit the big philosophical stakes. The FOLLOW-UPs (#9 & #10) come later to trap him after he's committed to his lines.
  *   **Cut Points:** #6 (Emptiness/Falsity) and #8 (Silencing) are good cuts if time bites. They're important but slightly more meta.
  *   **Potential Fair Accusations:** Flagged on #1 and implied in #5/#9. Be ready if he calls you out: "Fair point, maybe I *am* assuming we can isolate features. But show me how *you* avoid it..." or "Alright, maybe 'chaos' is strong. But convince me it's *not* just 'anything goes'."

  This should give him a proper run for his money. Good luck with the podcast – sounds like a cracking episode!
