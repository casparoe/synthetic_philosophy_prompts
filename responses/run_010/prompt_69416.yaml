  For the personal dilemma... *sighs* This is delicate. The user needs to hear that choosing string theory isn't irrational - but they must go in with eyes open. The mathematical depth alone justifies research time, but they should know confirmation is far from "in hand." Might mention how quantum gravity research often trains transferable skills too.

  *structures response*
