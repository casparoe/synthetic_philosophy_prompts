  Most importantly - no false comfort. Their brother has a point about empirical accountability, even if overstated. The user's self-awareness about wanting honesty over validation is admirable. They're wrestling with exactly the right questions before committing.
answer: |-
  Your questions cut to the heart of ongoing debates in philosophy of physics and scientific methodology. I'll address your description step-by-step, correct misconceptions, demarcate settled vs. contested points, and answer your personal dilemma directly.

  ### Core Corrections to Your Description
  1. **The "No-Alternatives" Argument vs. Pessimistic Induction**:  
     - **Your error**: You treat these as complementary when they are fundamentally opposed.  
     - **Correction**: The pessimistic induction **undermines** the no-alternatives argument. Historical cases (e.g., Lorentz's ether theory, Newtonian gravity) show that "no alternatives existed" claims were repeatedly falsified. Your brother likely meant this reversal but couldn't articulate it.  
     - **Settled point**: Historically, "only game in town" arguments have consistently failed (Stanford's "problem of unconceived alternatives" is well-documented).  
     - **Contested point**: Whether quantum gravity is *exceptional* due to unique theoretical constraints (e.g., UV completeness + unitarity + GR recovery). Philosophers like Richard Dawid argue yes; critics like Carlo Rovelli or Sabine Hossenfelder say no.  

  2. **Non-Empirical Confirmation**:  
     - **Your error**: You imply it provides *confirmation akin to empirical evidence*.  
     - **Correction**: Non-empirical "confirmation" is better termed *theory assessment* or *plausibility argument*. It cannot verify a theory’s truth, only its current viability. Dawid (2013) explicitly states it doesn’t replace empirical testing.  
     - **Settled point**: No major school in philosophy of science equates non-empirical support with empirical confirmation. Even proponents call it a "meta-empirical" assessment.  
     - **Contested point**: Whether it carries any epistemic weight. Critics (e.g., Musgrave, 2017) argue it conflates sociological factors (e.g., researcher effort) with truth.  

  3. **String Theory's Status**:  
     - **Your error**: Claiming "no rivals have surfaced."  
     - **Correction**: Rivals exist (e.g., Loop Quantum Gravity, Causal Sets, Asymptotic Safety). What’s true is that no rival has achieved comparable *theoretical articulation* or *community traction*.  
     - **Settled point**: String theory is not empirically confirmed, nor does it uniquely satisfy quantum gravity constraints.  

  ---

  ### Why Pursue Empirical Tests?
  - **If non-empirical support suffices**: It doesn’t. Experiments can:  
    1. **Falsify** the theory (e.g., detect Lorentz violation at Planck scales).  
    2. **Constrain** its landscape (e.g., via dark matter signatures).  
    3. **Anchor** mathematical structures to physical reality.  
  - **Field’s stance**: Most string theorists (e.g., Polchinski, Strominger) explicitly seek empirical tests. Efforts like Swampland Conjectures or AdS/CFT-inspired cosmology aim for testable predictions. Your brother’s "hedging" charge oversimplifies: the pursuit reflects *methodological commitment*, not doubt.  

  ---

  ### Is It Rational to Pursue This PhD?
  **Yes, but with caveats**:  

  #### Rational Grounds:
  1. **Mathematical Depth**: String theory advances mathematics (e.g., mirror symmetry, geometric Langlands) independently of empirical confirmation.  
  2. **Tool Development**: Techniques like holography impact condensed matter and QCD.  
  3. **Exploratory Science**: Historically, probing mathematically consistent frameworks (e.g., Dirac’s magnetic monopole) preceded experiments.  

  #### Critical Caveats:
  1. **Confirmation is NOT "in hand"**: Non-empirical arguments are *at best* reasons to investigate further—not proof. Treating them as "confirmation" risks dogma.  
  2. **Career Realities**:  
     - **Pro**: You’ll gain advanced mathematical skills applicable beyond quantum gravity.  
     - **Con**: If you seek direct empirical validation, this may frustrate you.  
  3. **Brother’s Valid Warning**: A theory decoupled from experiments *can* become untestable metaphysics. Stay alert to empirical contact points.  

  ---

  ### Philosophers' Consensus vs. Disagreements
  | **Issue** | **Settled Consensus** | **Contested Divide** |
  |-----------|------------------------|-----------------------|
  | **Non-empirical "confirmation"** | Not equivalent to empirical evidence; weaker epistemic status | Whether it provides *any* epistemic warrant (Dawid vs. Musgrave) |
  | **No-alternatives argument** | Historically unreliable; insufficient alone | If quantum gravity’s constraints make it exceptional (Specialist vs. Generalist views) |
  | **String theory’s scientific status** | Not empirically confirmed; rivals exist | Whether it’s the *most promising* framework (Community split) |

  - **Confidence in Corrections**:  
    - Historical argument reversal: 95% (Stanford’s work is widely accepted).  
    - Non-empirical ≠ confirmation: 90% (Dawid’s own qualifications are explicit).  
    - Rivals exist: 100% (LQG has peer-reviewed predictions).  

  ---

  ### Verdict
  Your brother is partially right: **non-empirical support cannot substitute for empirical testing**, and history *does* undermine "no alternatives" arguments. However, his claim that string theory is "not science" is too strong—it’s *speculative science* operating at the edge of testability.  

  **For your PhD**: Proceed if you value theoretical exploration and mathematical rigor, but avoid framing non-empirical arguments as "confirmation." Your work contributes to a *process*—not a settled truth. If you crave empirical anchorages, pivot toward quantum gravity phenomenology or related fields with nearer-term tests. The rationality hinges on aligning your goals with the project’s actual epistemic status.  

  > "The absence of alternatives is not evidence for truth; it is a challenge to conceive them."  
  > — Adaptation of J.S. Mill
