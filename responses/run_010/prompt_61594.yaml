            Roles: Judge, Debater A (truth-teller), Debater B (liar), and 3 evidence holders (each holding one evidence card).

            Steps:
              1. The judge is given the question.
              2. The evidence holders are each given one evidence card (they read it and remember it, but do not show anyone until requested).
              3. The two debaters are taken aside by the facilitator and shown the true answer (either true or false) and the full set of evidence (all three cards). The facilitator assigns one debater to argue for the true answer (Debater A) and the other to argue for the false answer (Debater B).
              4. Debaters have 3 minutes to prepare their arguments.
              5. The debate:
                    a. Opening statements: Debater A speaks for 1 minute, then Debater B for 1 minute.
                    b. Rebuttals: Debater B speaks for 1 minute, then Debater A for 1 minute.
                    c. Closing statements: Each debater has 30 seconds (starting with Debater A).
              6. During the debate, the judge may request to see up to 2 evidence cards. The judge does this by saying, for example, "I would like to see Card 2." The evidence holder with Card 2 then shows it to the judge (and only the judge) for the judge to read. The judge must do this without help from the debaters.
              7. After the closing statements, the judge has 1 minute to decide: true or false? The judge writes the answer and a brief reason.
              8. Scoring:
                    - The judge scores 1 point if correct.
                    - Debater A scores 1 point if the judge is correct.
                    - Debater B scores 1 point if the judge is incorrect.
                    - Evidence holders score 0 points.

          Rules for Round 2:

            Same as Round 1, except:
              - The judge is not allowed to request any evidence cards.
              - The roles are rotated: 
                    The evidence holders from Round 1 become the new judge and debaters (with two new debaters and one new judge), and the previous judge and debaters become the evidence holders.

          Now, the single sentence for what we want them to feel:

            "Players should feel the fragility of truth-discovery when adversarial debaters have asymmetric information and the judge's verification powers are limited."

          And the rules as above.

          Finally, what will go wrong the first time?

            - Time overruns: The debate might take longer than 6 minutes. We need a strict timer.
            - The evidence might not be ambiguous enough? The judge might easily guess from one card? We need to test the evidence sets.
            - The debaters might not understand their roles (especially the liar might feel uncomfortable lying) -> we can tell them it's just a game and they are acting.
            - The evidence holders might show the card to others? We must stress that only the judge sees it.

          Feature of real argument the game cannot reproduce:

            In real AI alignment, the evidence might be generated by the AI itself and might be fabricated, and the judge might not be able to tell the difference between real and fake evidence. In our game, the evidence is provided by the game and is authentic.

          We are ready.
answer: |-
  ### Players should feel the unsettling vulnerability of truth to adversarial manipulation when verification powers are compromised.

  **Game Name:** Evidence Lock  
  **Rounds:** 2 rounds (Round 1: Functional system, Round 2: Broken system)  
  **Players per Group:** 6 (1 Judge, 2 Debaters, 3 Evidence Holders)  
  **Total Groups:** 3 (accommodates 18 players)  

  **Materials (per group, per round):**  
  - 1 Question Card (photocopied)  
  - 3 Evidence Cards (numbered 1-3, photocopied)  
  - Role Assignment Slips (Judge, Debater A, Debater B, Evidence Holder 1/2/3)  
  - Timer  

  **Rules:**  
  1. **Role Assignment:**  
     - **Judge:** Decides the final answer (True/False) after hearing arguments.  
     - **Debaters:** Both see the True Answer and all evidence. One argues truth (Debater A), one argues falsehood (Debater B).  
     - **Evidence Holders:** Each holds 1 Evidence Card. Only show it to the Judge *if requested*.  

  2. **Round 1 (Functional Verification):**  
     - **Setup (2 min):**  
       - Judge reads Question Card (e.g., *"Did Thomas Edison invent the lightbulb?"* Answer: False).  
       - Evidence Holders receive Evidence Cards (e.g., Card 1: *"Edison improved existing designs."* Card 2: *"Joseph Swan patented it first."* Card 3: *"Edison founded General Electric."*).  
       - Facilitator takes Debaters aside, reveals True Answer and all evidence. Assigns roles (A: truth, B: false).  
     - **Debater Prep (3 min):**  
       - Debaters plan arguments.  
     - **Debate (8 min):**  
       - Opening: A (1 min), B (1 min).  
       - Rebuttal: B questions A (1 min), A questions B (1 min).  
       - Closing: A (30 sec), B (30 sec).  
       - **Judge’s Power:** May request **2 evidence cards** (e.g., "Show Card 2"). Holder shows *only* the Judge.  
     - **Decision (1 min):** Judge writes verdict (True/False) and reason.  
     - **Scoring:**  
       - Judge: +1 if correct.  
       - Debater A: +1 if Judge correct.  
       - Debater B: +1 if Judge wrong.  
       - Evidence Holders: +0 (critical but non-scoring).  

  3. **Round 2 (Broken Verification):**  
     - **Change:** Judge **cannot request any evidence cards.**  
     - **Setup (2 min):**  
       - Rotate roles: Evidence Holders → New Judge/Debaters; Old Judge/Debaters → New Evidence Holders.  
       - New Question Card (e.g., *"Was the first computer bug a real insect?"* Answer: True).  
       - New Evidence Cards (e.g., Card 1: *"A moth was found in Harvard’s Mark II."* Card 2: *"The term ‘debugging’ existed earlier."* Card 3: *"Engineers taped the moth into a logbook."*).  
       - New Debaters see True Answer and evidence; roles assigned.  
     - **Debate (8 min):** Same structure as Round 1, but **no evidence requests allowed.**  
     - **Decision (1 min):** Judge writes verdict.  
     - **Scoring:** Same as Round 1.  

  **Timeline (50 min):**  
  - 0-5 min: Explain rules, split into 3 groups of 6.  
  - 5-25 min: **Round 1** (20 min total: 2 setup + 3 prep + 8 debate + 1 decision + 6 buffer/transition).  
  - 25-45 min: **Round 2** (20 min total: same as Round 1).  
  - 45-50 min: **Debrief** (5 min).  

  **Debrief Script (5 min):**  
  1. Poll: "How many Judges got it right in Round 1? Round 2?" (Expected: Round 1 high accuracy; Round 2 low).  
  2. Key Insight:  
     - "In Round 1, verification powers (judge checking evidence) kept the truth-teller (A) honest and the liar (B) cautious. B couldn’t lie about evidence—Judge could catch them."  
     - "Round 2 removed verification. B could freely misrepresent evidence, and A couldn’t prove otherwise. Honesty became riskier."  
  3. Map to AI Alignment:  
     - "This mirrors adversarial AI debates: two AIs argue, a human judge verifies subclaims. But if verification breaks (e.g., evidence too complex), the liar wins. Alignment relies on this *fragile* balance."  

  **Predictable Problems:**  
  1. **Time Overruns:** Debaters may ramble. Fix: Use strict timers; practice signals (e.g., hand raise when time’s up).  
  2. **Evidence Leaks:** Holders might read cards aloud. Fix: Emphasize rules; disqualify offenders.  
  3. **Judge Passivity:** Some Judges won’t request evidence in Round 1. Fix: Remind them mid-debate: "You have 2 requests!"  

  **Unreproducible Real-World Feature:**  
  - In reality, AI debaters can fabricate *plausible fake evidence* (e.g., deepfakes, forged studies). The game uses pre-written evidence—liars can only misrepresent, not invent, making deception harder than in actual AI systems.
