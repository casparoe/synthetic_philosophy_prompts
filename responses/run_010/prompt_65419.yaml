prompt: |-
  I run an evening rationality group — about a dozen software engineers, all happy with Bayes' rule in the abstract, none of them philosophers. Next week I've got forty minutes and a whiteboard for van Fraassen's Reflection principle, and what I want from you is a plan for how to explain it, not the explanation itself.

  So: what has to be in place before Reflection even sounds like a claim rather than a truism, and which single running example should carry it? I was going to use someone who expects to be told that a card drawn tomorrow will be red, but I suspect that's too easy — tell me what the carrying example has to have and what it mustnt have. Two misreadings I'm already braced for: half the group thinks it just says "defer to your future self", and one guy has a standing argument that it's obviously false because of course you expect to change your mind as evidence arrives. Where exactly in the sequence do I kill each of those, and what else will people who know conditionalisation but have never met a Dutch book get wrong? Also — do I mention the cases where you expect your future self to be compromised, sleep-deprived or drunk, or does that sink the whole thing at this level? If I should leave something out, say what and say so out loud to them.

  Finish with one question I can ask at the end to check it actually landed. British English please.
reasoning: |-
  Okay, the user is running an evening rationality group for software engineers. They need a plan to explain van Fraassen's Reflection Principle in 40 minutes. The group knows Bayes' rule but isn't familiar with philosophy. The main goal is to structure the explanation so Reflection doesn't seem obvious or false at first glance.

  First, I need to identify the prerequisites. The group might think Reflection is just "defer to your future self" or argue it's obviously false because evidence changes beliefs. The user mentioned two specific misinterpretations to address. So the plan must preempt these. 

  The core challenge is making the principle non-truistic. I should start by establishing that it's about current beliefs regarding future beliefs, not just updating with evidence. Using an example where no new evidence is involved might help. The card example the user considered might be too simple because drawing a card provides evidence. Instead, an example where the future belief change isn't due to evidence but other factors like forgetting would highlight the principle's significance. 

  The running example needs specific elements: no new evidence, a future time where beliefs could change irrationally, and a scenario that separates evidence-based updates from other changes. The example of forgetting a digit of pi fits. It's a fixed fact, so any change in future belief isn't due to new info but memory lapse. This makes Reflection non-trivial because current you knows future you might be wrong, but still must align beliefs now with expected future beliefs.

  Timing is crucial. The sequence should first clarify that Reflection isn't about updating on evidence. Then introduce the principle with the pi example to show it's about anticipated irrationality. Contrasting with conditional probability will help. Using a Dutch book argument might be too advanced, so maybe skip that. Instead, focus on the inconsistency in current beliefs if they don't align with future expectations.

  Addressing the objection about compromised future selves is tricky. The user asked whether to include cases like being drunk or sleep-deprived. It's important to mention that Reflection assumes rationality. Explicitly stating that it applies only when you expect your future self to be rational prevents the "obviously false" objection. Save compromised cases for later discussion but note the caveat.

  Structure the session: start with conditional probability to set the baseline, then present a scenario where future belief isn't evidence-based. Use the pi example to demonstrate Reflection's requirement. Highlight the key point: you can't rationally believe future you will be rational yet hold different beliefs now. Preempt the "defer to future self" by showing it's not about deference but current belief constraints. Preempt the evidence objection by separating irrational changes.

  End with a check question: "If I expect that tomorrow I'll assign 70% to the digit being 3, but today I assign 30%, what's inconsistent?" This tests if they grasp the doxastic contradiction.

  Make sure to avoid jargon, keep it concrete, and use British English terms like "maths" instead of "math". Mentioning the caveats about rational future selves is necessary but brief. The plan should fit in 40 minutes, so stay focused on the essentials.
answer: |-
  Here’s a structured 40-minute plan targeting your audience, preempting key misunderstandings and using a calibrated example. British English throughout.

  ### **Core Structure & Timing**  
  1.  **Set-up (5 min):**  
      - *Establish the puzzle:* "We’re great at updating beliefs *with evidence* (Bayes). But what if I tell you your beliefs today must align with what you *expect* your beliefs to be tomorrow *without* new evidence? Sounds mad? Let’s break it down."  
      - **Pre-requisites:**  
        - Revise conditional probability notation: `P(A|B)` = "Probability of A given B".  
        - Clarify "expected future belief": `E[P_tomorrow(A)]` = "What I *now* think my credence in A will be tomorrow".  

  2.  **The Truism Trap & Running Example (8 min):**  
      - *Bad example (reject explicitly):* "Tomorrow I’ll see a card; I expect to believe it’s red with P=0.75." → "But that’s just Bayes! You’ll see *evidence*. Reflection isn’t about *that*."  
      - **Introduce Running Example: "Pi Digit"**  
        - *Setup:* "You *know* π’s 1000th digit is fixed (it’s 9, but pretend ignorance). Today you assign P=0.3 to it being 3. Tomorrow, you’ll recompute it *from scratch* — same knowledge, no new data. But you’re tired and might misremember."  
        - *Crucial elements:*  
          ✅ **No new evidence** (same prior information tomorrow).  
          ✅ **Belief change possible via cognitive drift/error** (fatigue).  
          ❌ **No Bayesian update trigger** (this kills the "evidence" objection later).  

  3.  **State Reflection & Sound Non-Trivial (5 min):**  
      - Write: **Reflection Principle**: `P_today(A | P_tomorrow(A) = x) = x`  
      - *Emphasise:* "This says: *Given that tomorrow I’ll believe A with probability x*, my belief *today* must be x. Even if I think tomorrow’s me is wrong!"  
      - *Pi Example:* "Suppose I’m 80% sure tomorrow I’ll think P(digit=3)=0.7. Then *today*, if I condition on that future belief, I must assign P(digit=3) = 0.7."  
      - **Kill "defer to future self" here:** "It’s NOT saying future you is *right*—it’s saying your *current* belief must *match* what you expect your future belief to be, even if irrational!"  

  4.  **Preempting "Obviously False" (7 min):**  
      - *Objection:* "But I *expect* to change my mind when irrational!"  
      - *Rebuttal:*  
        - "Reflection constrains your *current* belief *given* a prediction. If you think future you is *likely incompetent* (e.g., drunk), **don’t condition on it**."  
        - **Explicit Caveat:** "Reflection assumes you expect your future self to be *rational and informed as you are now*. Compromised (drunk/coerced)? Principle doesn’t apply. Mention it, then table it."  
        - *Pi example twist:* "If you expect tomorrow’s fatigue to *distort* your calculation, then `P_tomorrow(digit=3)=0.7` isn’t a ‘rational’ belief—so Reflection isn’t binding. But if you expect no distortion, it *is* binding."  

  5.  **Why Believe This? Dutch Book Lite (10 min):**  
      - *No formal Dutch Book:* Use "doxastic inconsistency" argument.  
      - *Scenario:* Today you set `P(digit=3) = 0.3` but are `80%` sure tomorrow you’ll set `P_tomorrow(digit=3)=0.7`.  
      - *Incoherence:* "You’d *now* accept a bet paying £1 if digit=3 at £0.30. But you’d *also* accept a bet *today* paying £1 if tomorrow’s probability is 0.7 at £0.80. Tomorrow, if P=0.7, you’d sell a £1-if-digit=3 bet for £0.70. Net loss guaranteed. Your beliefs *today* exploit your expected future self."  

  6.  **Recap & Common Pitfalls (5 min):**  
      - **Reflection ≠ Deference:** It’s a constraint on *current* credences given expectations.  
      - **Reflection ≠ Bayesian Updating:** No evidence—pure self-prediction.  
      - **Not for compromised selves:** Caveated to rational future states.  

  ---

  ### **Final Check Question**  
  > *"Today, I assign 20% to the digit being 3. But I’m 90% sure that tomorrow I’ll assign it 60%. Assuming I expect tomorrow’s me to be rational and non-compromised, why is this incoherent?"*  

  **Expected Answer:**  
  - "Your current beliefs imply you’d accept losing bets: buy a ‘digit=3’ bet at £0.20 today, and bet £0.90 at 9:1 that tomorrow you’ll value it at £0.60. If you’re right about tomorrow, you’ll sell it for £0.60 then—losing £0.10 net. Also, your 20% today clashes with your 90% confidence in a future 60%."  

  This tests grasp of the doxastic inconsistency and the principle’s conditional nature. Adjust pace if needed—40 mins is tight!
