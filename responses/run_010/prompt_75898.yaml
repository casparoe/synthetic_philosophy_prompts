prompt: |-
  I run a tiny evaluation team at a grant-making foundation — four of us, no economists, and I did one welfare economics module about fifteen years ago, which is roughly as much theory as is in the building. We get round about twelve to fifteen funding proposals a quarter that come with some rule for adding up welfare effects across the people they'd affect, and the rules are all over the shop: straight sums of expected wellbeing, sums with prioritarian weights that discount gains to the already-better-off, a maximin-flavoured "only count the worst-off group" rule, one that treats a household as a single unit, one that does the calculation before a lottery is resolved and another that does it after. Trustees have started asking whether we have any principled way of saying one of these is defensible and another isn't, rather than just going with whichever produces the biggest number, and I've been told Harsanyi's aggregation theorem is definately the thing that settles it. So far my colleague's summary to the board has been "the theorem proves you must add utilities, therefore equal-weight sums are the only legitimate rule and everything else is arbitrary" — which I suspect is wrong, or at least right only under assumptions none of our proposals actually check, and I don't want that going out again.

  What I want is a reusable screening procedure I can hand to a grants officer with no maths beyond arithmetic and have them run on a proposal in under an hour, before the quarterly meeting. For each step: the question to ask, what in the document counts as a sufficient answer, and what the step does when the answer is missing or unclear (pass, fail, escalate). It should start from what the theorem actually requires — the conditions on the individual and on the social evaluation, the part about uncertainty and expected utility, and whatever symmetry or anonymity-type condition you need to get equal weights rather than merely some weights — and turn each of those into a question a non-specialist can put to a piece of paper: where did these utilities come from, are they comparable across people or only within a person, does the proposal's own method actually meet the conditions, or is it using a different rule and calling it Harsanyi. I want the procedure to be explicit about which conditions our proposals most often break, and about what survives when one breaks, because "the theorem doesn't apply" shouldn't automatically mean "the proposal is nonsense" — there should be a step that separates a rule that's merely unsupported by the theorem from one that's positively at odds with something the theorem does deliver. Mark clearly where the procedure stops being about facts and hands the decision back to a human because it's a values question (how much weight to what, whether to make interpersonal comparisons at all), and be candid about which steps are judgment calls wearing a procedural costume.

  Then run it on three cases that would be entirely normal for us. (a) A health proposal summing expected QALYs across beneficiaries at equal weight, using a standard instrument, where the numbers are elicited within each person and then just compared as though they were on one scale. (b) An education proposal applying concave prioritarian weights, so a unit of gain to a worse-off child counts for more, justified by saying this follows from the same theorem. (c) A proposal for an intervention allocated by lottery over scarce places, where the applicants have computed the sum of expected utilities both before the draw and after the outcome is known, the two rankings disagree, and their note says to pick whichever reading you prefer. One of these should come out badly for a proposal the trustees are keen on, so don't soften it — I'd rather have the awkward verdict now than in the boardroom. Finish with a short list of what the procedure can't do: the aggregation questions it can't reach at all, the failure modes where it'll hand back a confident but wrong verdict, and the cases where you'd want an actual welfare economist in the room instead of a checklist.
reasoning: |-
  We are designing a screening procedure based on Harsanyi's aggregation theorem. The theorem states that if individual preferences satisfy the axioms of expected utility theory and the social welfare function satisfies the same axioms plus a Pareto condition, then social welfare must be a weighted sum of individual utilities. Under an anonymity condition, the weights are equal. However, note that the theorem requires that utilities are comparable and that the social evaluation is linear in probabilities (expected utility form).

  The conditions of Harsanyi's theorem are:
  1. **Individual rationality**: Each individual's preferences satisfy the axioms of expected utility theory (completeness, transitivity, continuity, independence).
  2. **Social rationality**: The social welfare function satisfies the same expected utility axioms.
  3. **Pareto condition**: If every individual is indifferent between two prospects, then society is indifferent; if at least one individual strictly prefers one prospect and no one prefers the opposite, then society strictly prefers that prospect.

  Additionally, for equal weights we require:
  4. **Anonymity/Symmetry**: The social welfare function treats individuals symmetrically.

  The screening procedure will check these conditions. We break it down into steps.

  ---

  **Screening Procedure for Welfare Aggregation Methods**

  **Goal**: To determine if a proposal's welfare aggregation method is defensible by Harsanyi's aggregation theorem and to flag common breaks.

  **Instructions for Grants Officer**:
  - For each step, look for evidence in the proposal. If the step is not clearly addressed, use the default action (pass, fail, escalate) as indicated.
  - If a step fails, note the reason and proceed to the next step unless the procedure says to stop.
  - The procedure does not judge the moral values (e.g., how much weight to give to whom) but checks the internal consistency and the conditions of the theorem.

  **Steps**:

  1. **Individual Utility Construction**:
     - **Question**: Does the proposal clearly state that the individual welfare measures (utilities) are constructed using an expected utility framework? Specifically, are the individual utilities derived from preferences that satisfy the expected utility axioms (completeness, transitivity, continuity, independence) in the face of uncertainty?
     - **Look for**: Reference to a standard utility elicitation method (e.g., standard gamble, time trade-off, or a stated preference method that accounts for uncertainty) or an assumption that the individual welfare numbers are von Neumann-Morgenstern utilities.
     - **If missing/unclear**: Escalate to the evaluation team. (Without this, we cannot be sure the individual utilities are suitable for aggregation under the theorem.)
     - **Why**: Harsanyi's theorem requires that individual utilities are von Neumann-Morgenstern utilities (i.e., they represent preferences under uncertainty and are unique up to affine transformations). If the proposal uses a different scale (e.g., a rating scale without uncertainty), the theorem does not directly apply.

  2. **Interpersonal Comparability**:
     - **Question**: Does the proposal assume that the individual utilities are comparable across individuals? Specifically, does the aggregation rule treat a unit of utility for one individual as equivalent to a unit for another (at least up to a common scale)?
     - **Look for**: Explicit statement that utilities are cardinally measurable and interpersonally comparable, or that they are measured on a common scale (e.g., using a method that enforces comparability). Note: Without comparability, the weights in the aggregation are arbitrary.
     - **If missing/unclear**: If the aggregation uses equal weights, note that without comparability, equal weights are arbitrary. Escalate. If the proposal uses non-equal weights, then without comparability, the weights are arbitrary and the aggregation is not justified by Harsanyi (which requires comparable utilities). This step fails, but proceed to step 3 to check the other conditions.
     - **Why**: Harsanyi's aggregation requires that utilities are comparable so that we can form a weighted sum. Without comparability, the weights are not determined by the theory.

  3. **Social Welfare Functional Form**:
     - **Question**: Does the proposal use a linear aggregation rule? That is, does it compute social welfare as a weighted sum of individual utilities? (Note: The weights may be equal or not, but the form must be linear.)
     - **Look for**: The aggregation formula. It should be of the form: W = w1*u1 + w2*u2 + ... + wn*un. If there are weights that are not equal, note that Harsanyi allows weights but they must be constant (not depend on the state or the level of utility) and the theorem does not require equal weights without symmetry.
     - **If not linear**: Then the aggregation rule is not consistent with Harsanyi's theorem. Fail and stop (but note: step 4 will check for symmetry if linear). If linear, proceed.
     - **Why**: Harsanyi's theorem implies linearity (weighted sum) of the individual utilities.

  4. **Symmetry/Anonymity (for equal weights)**:
     - **Question**: If the proposal uses equal weights, is there a reason to treat individuals symmetrically? And if not, is there a justification for differential weights?
     - **Look for**: If the weights are equal, check that the proposal does not contain information that breaks anonymity (e.g., giving more weight to a particular group without a prioritarian reason). If the weights are not equal, the proposal must justify why (e.g., prioritarianism). Note: Harsanyi does not require equal weights without an additional symmetry condition. The theorem allows weights, but without symmetry, weights can differ arbitrarily.
     - **If missing justification for non-equal weights and the proposal claims to follow Harsanyi**: Then note that the theorem does not require equal weights without symmetry, but it does not justify non-equal weights either. Escalate because the weights are arbitrary without further justification.
     - **Why**: The theorem says that the aggregation must be a weighted sum, but the weights are not necessarily equal. However, if the proposal claims that the theorem requires equal weights, that is only true under symmetry.

  5. **Pareto Condition**:
     - **Question**: Does the aggregation rule satisfy the Pareto principle? That is, if every individual is better off in situation A than in situation B, does the rule rank A above B? And if at least one is strictly better off and no one is worse off, is A strictly better?
     - **Look for**: The proposal should not have any feature that violates this (e.g., a rule that sometimes prefers a distribution where everyone is worse off). Check if the aggregation rule is increasing in each individual's utility.
     - **If missing or unclear**: It is a fundamental condition. If the proposal's rule does not satisfy Pareto, then it is inconsistent with Harsanyi. Fail.
     - **Why**: The Pareto condition is one of the key assumptions of the theorem.

  6. **Uncertainty Handling**:
     - **Question**: Does the proposal handle uncertainty in a way consistent with expected utility? Specifically, does it compute expected utility for each individual and then aggregate, or aggregate first and then take expectations? (Harsanyi requires aggregating first and then taking expectations? Actually, the theorem shows that the two are equivalent under the conditions. So the key is that the social welfare is linear in probabilities.)
     - **Look for**: The proposal should compute social welfare for each state of the world (or for each lottery) by first computing individual expected utilities (or state-dependent utilities) and then aggregating, OR aggregate state-dependent utilities and then take expectations. Harsanyi's theorem says that under the conditions, these two methods are equivalent. If the proposal does not do either, or if it uses a different rule (like maximin under uncertainty), then it breaks the independence axiom.
     - **If missing/unclear**: If the proposal does not mention uncertainty, then this step passes. If it does, and the method is not consistent with expected utility (e.g., it uses a rank-dependent model or minimax), then fail. Escalate if the proposal uses a different model and claims it is justified by Harsanyi.
     - **Why**: Harsanyi's theorem requires that both individuals and society obey the expected utility axioms, which include the independence axiom. This implies linearity in probabilities.

  **Decision Tree**:
  - If all steps pass and the aggregation is linear with comparable utilities and satisfies Pareto, then the method is consistent with Harsanyi's theorem. The weights may be equal (if symmetry is satisfied) or not (if symmetry is not required, but then the weights are arbitrary without further justification).
  - If a step fails, note the reason. The proposal may still be defensible on other grounds (e.g., prioritarianism) but not by Harsanyi's theorem.

  **Handling Values Questions**:
  - The procedure stops being about facts and hands back to a human when:
    - The choice of weights (if not equal) is a values question.
    - The decision to use interpersonal comparisons is a values question (though without it, Harsanyi doesn't work).
    - The choice of prioritarian weighting (if used) is a values question and not justified by Harsanyi.

  **Common Breaks**:
  - Proposals often break at step 1 (individual utility construction) by using non-vNM utilities (e.g., QALYs without uncertainty, or happiness scores).
  - Step 2 (interpersonal comparability) is often assumed without justification.
  - Step 4 (symmetry) is often assumed without justification when using equal weights, but non-equal weights require additional ethical justification.

  ---

  **Apply the procedure to the three cases**:

  **(a) Health proposal: summing expected QALYs across beneficiaries at equal weight**

  1. **Individual Utility Construction**:
     - QALYs are often measured without using an expected utility framework (e.g., via rating scales). The proposal says they use a "standard instrument". If that instrument is the standard gamble (which is vNM) then it passes. But often QALYs are from time trade-off or visual analog scales, which do not satisfy the independence axiom. 
     - **Verdict**: Unless specified as vNM utilities, escalate. Likely break.

  2. **Interpersonal Comparability**:
     - The proposal assumes QALYs are comparable across individuals. This is standard in health economics, but note that without step 1 being vNM, the comparability might be on a different scale. If step 1 fails, this step is also in question.
     - **Verdict**: If step 1 passes, then this step passes. Otherwise, escalate.

  3. **Social Welfare Functional Form**:
     - Linear with equal weights: passes.

  4. **Symmetry**:
     - They use equal weights. Is there symmetry? In health, often we assume symmetry. But without justification, it's an ethical choice. The procedure doesn't require justification for symmetry, but if they claim Harsanyi requires it, note that Harsanyi requires symmetry for equal weights. If they don't claim that, then it's a values choice.
     - **Verdict**: Pass (but note: the equal weights are a values choice).

  5. **Pareto**:
     - Summing QALYs satisfies Pareto: if everyone has more QALYs, the sum increases. Pass.

  6. **Uncertainty**:
     - They are summing expected QALYs. This is consistent with expected utility if the QALYs are vNM. If not, then it's not. 
     - **Verdict**: If step 1 passes, then this passes. Otherwise, fail.

  Overall for (a): If the QALYs are vNM, then it passes. But typically they are not, so likely escalate (for step 1). The proposal may not be justifiable by Harsanyi.

  **(b) Education proposal: applying concave prioritarian weights**

  1. **Individual Utility Construction**:
     - We need to know how the individual utilities are measured. The proposal doesn't specify. Without knowing, we must escalate. Assume they are using some measure of educational attainment converted to a utility? If it's not vNM, then step 1 fails.

  2. **Interpersonal Comparability**:
     - They are applying weights based on the level of utility (prioritarian). This requires comparability. They must assume comparability. Pass if they do, but without step 1, the comparability is on an arbitrary scale.

  3. **Social Welfare Functional Form**:
     - The aggregation is not linear because the weights are a function of the level of utility (concave transformation). Harsanyi requires linearity (constant weights). Therefore, this step fails. 
     - **Verdict**: Fail. Stop. The method is not linear, so Harsanyi does not apply.

  4. **But note**: The proposal claims this follows from the same theorem. That is incorrect. Harsanyi's theorem does not justify prioritarian weights. It requires linear aggregation. So the proposal misuses the theorem.

  Overall for (b): Step 3 fails. The aggregation rule is not linear, so it is inconsistent with Harsanyi. The proposal's claim is wrong.

  **(c) Proposal with lottery: two rankings (before and after the lottery)**

  1. **Individual Utility Construction**:
     - We need to see how utilities are measured. The proposal doesn't specify. Escalate.

  2. **Interpersonal Comparability**:
     - They are summing utilities, so they must assume comparability. Pass (if step 1 passes).

  3. **Social Welfare Functional Form**:
     - They are using a linear aggregation (sum) at both stages. Pass.

  4. **Symmetry**:
     - They use equal weights. Pass (as a form, but without justification, it's a values choice).

  5. **Pareto**:
     - The sum satisfies Pareto. Pass.

  6. **Uncertainty Handling**:
     - The key issue: they compute two rankings: 
          - Ranking 1 (ex ante): Compute expected utility for each individual, then sum.
          - Ranking 2 (ex post): For each possible outcome of the lottery, sum the utilities in that state, then average the sums (or take the expectation of the social sum).
     - Harsanyi's theorem says that under the conditions, these two are equivalent. But note: the proposal says the two rankings disagree. This is a problem because if the conditions of Harsanyi are satisfied, they should be the same. Therefore, one of the conditions must be broken. This could be because:
          - The individual utilities are not vNM (step 1).
          - The social welfare function is not linear in probabilities (but they are using the same linear aggregation in both, so that should be linear).
          - Or, the Pareto condition might be violated? Not necessarily.
     - **Verdict**: Since the two rankings disagree, the conditions of Harsanyi are not met. Therefore, the proposal's method is inconsistent. They say "pick whichever you prefer", which is arbitrary. This step fails.

  Overall for (c): Step 6 fails because the two rankings disagree, indicating a violation of the expected utility axioms. The proposal is inconsistent.

  ---

  **What the procedure can't do**:

  1. **Non-expected utility models**: If individuals or the social evaluation use non-expected utility (e.g., rank-dependent utility, prospect theory), the theorem does not apply. The procedure will fail but cannot suggest an alternative.

  2. **Non-linear aggregation**: It cannot evaluate prioritarian, egalitarian, or other non-linear aggregation rules. These are ethical choices and require separate justification.

  3. **When utilities are not vNM**: The procedure escalates, but we don't have a backup method. We need an economist to decide if the aggregation is still meaningful.

  4. **When interpersonal comparability is not established**: The procedure notes the break but cannot resolve how to aggregate without it.

  5. **Weight determination**: The procedure does not determine the weights (except that under symmetry they must be equal). Choosing non-equal weights is a values question.

  6. **Cases with multiple attributes or non-welfare goods**: If the proposal aggregates non-utility outcomes (like income, health, etc.) without converting to a utility scale, the theorem does not apply.

  7. **Dynamic settings**: The theorem is for one-shot decisions under uncertainty. Dynamic decisions (like over time) require additional considerations.

  **When to call an economist**:
  - When the procedure escalates (e.g., step 1 unclear, step 2 unclear).
  - When the proposal uses a non-standard model of utility or aggregation.
  - When the proposal breaks one of the conditions but claims an alternative justification.

  **Conclusion**: This procedure helps screen for consistency with Harsanyi's theorem. It flags common breaks and separates claims that misuse the theorem. However, it does not cover all possible welfare aggregation methods and requires human judgment for values questions.
answer: |-
  Below is a reusable screening procedure based on Harsanyi's aggregation theorem, designed for grants officers with minimal math. It translates the theorem's technical conditions into concrete questions, flags common pitfalls in proposals, and explicitly separates factual checks from value judgments. **The procedure focuses on three core requirements of Harsanyi's theorem**:  
  1. **Individual rationality**: Utilities must be vNM (von Neumann-Morgenstern) expected utilities.  
  2. **Social rationality**: The aggregation rule must satisfy expected utility axioms.  
  3. **Pareto condition**: If everyone prefers A over B, society must prefer A over B.  
  4. **Equal weights addendum**: *Only* if anonymity/symmetry is assumed (i.e., no justifiable reason to weight people differently).  

  **When to use this**: For proposals claiming Harsanyi justifies their aggregation rule, or using weighted sums of welfare.  
  **Outputs for each proposal**: Pass (meets Harsanyi's conditions), Fail (contradicts Harsanyi), Escalate (gaps/ambiguities), or Values (hand back to trustees).  
  **Time estimate**: 30–50 minutes per proposal.  

  ---

  ### **Screening Procedure: Step-by-Step**  
  *Instructions for grants officer: Ask these questions in order. Stop and tag if a step fails/escalates. "Utilities" = welfare/wellbeing numbers.*  

  1. **Are individual utilities vNM expected utilities?**  
     - **Question**: "Do the utilities account for uncertainty? Are they derived from choices involving risk (e.g., lotteries) or just from risk-free surveys/scales?"  
     - **Sufficient answer**: Explicit mention of "expected utility," "vNM," "standard gamble," or choices under risk. Methods like time trade-off or rating scales are insufficient.  
     - **If missing/unclear**: Escalate. *Common break: Most proposals use non-vNM utilities (e.g., QALYs from surveys, happiness scales). Harsanyi does not apply.*  
     - **What this checks**: Harsanyi requires utilities to be vNM (unique up to affine transformations). Without this, aggregation lacks theoretical grounding.  

  2. **Are utilities interpersonally comparable?**  
     - **Question**: "Does the proposal treat a 1-unit utility gain for Alice as equal to a 1-unit gain for Bob? Or are utilities only comparable within a person?"  
     - **Sufficient answer**: Clear statement that utilities are comparable across people (e.g., "using a common scale"). If weights are used, they must be justified separately (see Step 4).  
     - **If missing/unclear**: Escalate. *Common break: Proposals assume comparability without evidence (e.g., summing QALYs as if 1 QALY = same welfare for all).*  
     - **What this checks**: Harsanyi requires comparability for meaningful summation. If utilities are only ordinal, aggregation is arbitrary.  

  3. **Is the aggregation rule linear?**  
     - **Question**: "Is the social welfare function a weighted sum of individual utilities? (e.g., W = w₁U₁ + w₂U₂ + ...)"  
     - **Sufficient answer**: Formula is a linear sum. Nonlinear rules (e.g., multiplying utilities, concave transformations) fail.  
     - **If not linear**: Fail. *Harsanyi only supports linear aggregation.*  
     - **If linear**: Proceed.  
     - **What this checks**: Harsanyi's theorem proves social welfare *must* be a linear sum of individual utilities under rationality and Pareto.  

  4. **Does the aggregation satisfy Pareto?**  
     - **Question**: "If every person is better off in scenario A than B, does the rule always rank A above B?"  
     - **Sufficient answer**: Formula is strictly increasing in individual utilities (e.g., weights are positive).  
     - **If not**: Fail. *Example: Maximin rules fail if they ignore gains above the worst-off.*  
     - **What this checks**: Core ethical condition of the theorem. Violations imply logical inconsistency.  

  5. **Does the rule handle uncertainty correctly?**  
     - **Question**: "Does the rule compute expected utility *before* aggregating? (e.g., individual EU → sum) OR aggregate *before* taking expectations? (e.g., sum of utilities → expected social welfare)"  
     - **Sufficient answer**: Either method is valid under Harsanyi *if and only if* utilities are vNM (Step 1) and the aggregation is linear (Step 3). They should produce identical rankings.  
     - **If methods conflict or uncertainty is ignored**: Fail. *Harsanyi requires consistency.*  
     - **What this checks**: Social rationality requires linearity in probabilities.  

  6. **Are weights equal? If not, is there symmetry?**  
     - **Question**: "If weights are equal, is there reason to treat all individuals identically? If weights differ, what justifies this?"  
     - **Sufficient answer**: For equal weights: Symmetry/anonymity is assumed (no relevant differences between people). For unequal weights: Evidence that individuals are asymmetric (e.g., "children deserve higher weight" – but this is values-based).  
     - **If equal weights without symmetry justification**: Pass (but note: symmetry is often assumed by default).  
     - **If unequal weights**: Tag as **Values**. *Harsanyi permits unequal weights only if symmetry is broken, but weights are arbitrary without moral justification.*  
     - **What this checks**: Equal weights require symmetry; unequal weights are outside Harsanyi’s scope (they become ethical choices).  

  ---

  ### **Interpreting Results**  
  - **Pass**: Consistent with Harsanyi. Trustees can use it.  
  - **Fail**: Contradicts Harsanyi (e.g., nonlinear, violates Pareto). Not defensible by the theorem.  
  - **Escalate**: Gaps in theory (e.g., missing vNM, unclear comparability). Needs expert review.  
  - **Values**: Moral weighting, symmetry, or comparability assumptions. Trustees must decide.  

  **Key distinctions**:  
  - "**Not supported by Harsanyi**" (e.g., non-vNM utilities) vs. "**Contradicts Harsanyi**" (e.g., violates Pareto).  
  - The theorem is **not the only way** to aggregate welfare—but proposals misusing it should be flagged.  

  ---

  ### **Application to Your Cases**  
  *(Assumes proposals claim Harsanyi justifies their method)*  

  **(a) Health proposal: Summing expected QALYs, equal weights**  
  1. **vNM?** Likely no. QALYs are typically from time trade-off/surveys, not risky choices. → **Escalate** (common break).  
  2. **Comparable?** Assumed, but without vNM, comparability is dubious. → **Escalate**.  
  3. **Linear?** Yes (sum). → Pass.  
  4. **Pareto?** Yes. → Pass.  
  5. **Uncertainty?** Expected QALYs handled correctly. → Pass.  
  6. **Weights?** Equal, symmetry assumed. → Pass.  
  **Verdict**: **Escalate** due to Steps 1–2. *Not Harsanyi-justified, but not nonsense—trustees might accept QALYs pragmatically (Values).*  

  **(b) Education proposal: Prioritarian weights (concave transformation)**  
  1. **vNM?** Unspecified. → **Escalate**.  
  2. **Comparable?** Assumed. → Pass.  
  3. **Linear?** No (concave weights ≠ linear sum). → **Fail**.  
  4. **Pareto?** Likely yes, but irrelevant after Fail.  
  **Verdict**: **Fail** at Step 3. *Prioritarianism contradicts Harsanyi’s linearity. Proposal misuses the theorem.*  

  **(c) Lottery proposal: Two rankings (pre-lottery vs. post-outcome)**  
  1. **vNM?** Unclear. → **Escalate**.  
  2. **Comparable?** Assumed. → Pass.  
  3. **Linear?** Yes (sum). → Pass.  
  4. **Pareto?** Yes. → Pass.  
  5. **Uncertainty?** Rankings disagree → violates Harsanyi (should be identical). → **Fail**.  
  6. **Weights?** Equal. → Pass.  
  **Verdict**: **Fail** at Step 5. *Inconsistent handling of uncertainty breaks the theorem.*  

  **Awkward truth**: Case (a) (trustees’ likely favorite) fails Harsanyi due to non-vNM utilities. Case (b) misrepresents the theorem. Case (c) is internally inconsistent.  

  ---

  ### **What This Procedure Can’t Do**  
  1. **Non-welfarist proposals**: Ignores rules based on rights, equality, or capabilities without utility aggregation.  
  2. **Non-vNM utilities**: Can’t verify if non-expected utility models (e.g., prospect theory) are valid alternatives.  
  3. **Partial comparability**: If utilities are "roughly comparable," Harsanyi doesn’t apply—judgment call needed.  
  4. **Dynamic/chronicity effects**: e.g., Discounting future utility, lifetime sums. Harsanyi is static.  
  5. **Multidimensional welfare**: e.g., Aggregating health + income without a unified utility.  
  6. **Weight justification**: Can’t assess if unequal weights are "fair" (Values).  

  **When to involve a welfare economist**:  
  - Escalated cases (e.g., ambiguous utility construction).  
  - Proposals with non-standard uncertainty (e.g., ambiguity, climate risk).  
  - Any claim that "Harsanyi supports prioritarianism/egalitarianism" (it doesn’t).  

  **Failure modes of this procedure**:  
  - **False positives**: Might pass proposals that "look linear" but misuse vNM utilities (e.g., QALYs with ad-hoc adjustments).  
  - **False negatives**: Could fail ethically defensible rules that reject Harsanyi’s assumptions (e.g., explicit prioritarianism).  
  - **Oversimplification**: Misses nuances like heterogeneity in risk preferences.  

  **Final note**: Harsanyi’s theorem is a *specific* tool—not a universal arbiter of welfare aggregation. It guarantees coherent, Pareto-optimal aggregation under uncertainty *if* you accept its axioms. Proposals breaking it may still be valid on other grounds (e.g., equity concerns), but should not invoke the theorem.  

  ---  
  This procedure equips your team to filter out theoretical misuses quickly, while clarifying where trustees’ value judgments are needed. For escalated cases, recommend a 1-hour consult with an economist pre-meeting.
