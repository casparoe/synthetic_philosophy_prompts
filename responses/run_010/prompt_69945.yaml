prompt: |-
  I've been reading the rationalist blogs since the Sequences were still being posted in real time, and the thread that never let go of me wasn't decision theory or AI risk — it was the recurring, never-resolved argument about whether pleasure is one thing. Classical utilitarianism treats it as a single quantity that admits of a calculus; almost anyone who has looked closely at phenomenology says the pleasure of cold water on a hot day, of finally landing a proof, of a filthy joke at a funeral, of a hand on your shoulder, and of the first long exhale after a hard run have nothing in common that isn't also shared by plenty of non-pleasures. I'm now a program officer at a small private foundation whose trustees have approved a modest allocation — roughly $180,000 over two years, enough for one postdoc and a nine-person residential workshop, plus an option on a second, methods-trained postdoc slot if the case is strong — for work on precisely this: the heterogeneity problem for hedonism, and what would have to be true for hedonism about well-being to survive it. The deliverable we care about is not a settled theory. It is a shared vocabulary and a defensible answer to a narrow question: when two experiences are both pleasant, what, if anything, is the same in them, and is that "anything" the sort of thing that can be put on a single scale and traded off?

  Here is the candidate list our advisors have generated, with the labels I'll use. **Q1 (shared-feel vs. shared-job):** is pleasure unified by a common phenomenal tone, or only by a common functional role — being such as to dispose its subject to want its continuation — and is the second option a theory of pleasure or a change of subject? **Q2 (felt location):** pains are conspicuously localizable and pleasures conspicuously are not; is that an introspective artifact, or does it mean the puzzles in the pain literature don't transfer to pleasure? **Q3 (the attitudinal escape):** if pleasure is best analyzed as a propositional attitude — being pleased that p — with no distinctive feel at all, does heterogeneity dissolve, and at the cost of rendering hedonism about well-being vacuous or unfalsifiable? **Q4 (painful pleasures):** chili burn, the hurt after sustained effort, grief and nostalgia, horror, masochism; do these show that valence is at least two-dimensional, and if so, which dimension should a hedonist be tracking? **Q5 (the metric):** even granting some shared feature, can pleasures be cardinally ranked and interpersonally compared tightly enough to support aggregation, or does hedonism shade into a plurality of incommensurable goods? **Q6 (the background problem):** most of a life's hedonic character is diffuse baseline affect rather than discrete episodes; do theories that begin from salient episodes systematically misdescribe the thing that actually matters? **Q7 (the neuroscience anchor):** how much evidential weight should philosophers give the wanting/liking dissociation and the valence–arousal models out of affective science, and at what point does deference to animal models become over-reading?

  What I want is a defended agenda, not a survey and not a reading list. Rank the seven by how much of the rest depends on their answer, and tell me flatly which one or two I should fund and which I should quietly cut from the workshop program. For each placement, give me your criteria and the trade-offs among them: upstream-ness; tractability within a two-year window by a philosopher paired with a methods-trained psychologist rather than by a lab with imaging access; neglectedness relative to the airtime the item already gets; and whether settling it would change what anyone downstream does. Say which of the seven you take to be a pseudo-problem resting on a false presupposition, and name the presupposition. Note where the ranking is sensitive to the composition of the room, and specify what concrete result — or failed attempt — over the next eighteen months would move each item up or down. Our trustees like machine-readable summaries, so please close with a single final line beginning "Verdict:" giving the complete ordering from first to last, using only the Q-labels separated by ">" and nothing else on that line.
reasoning: |-
  Okay, I need to figure out how to approach this user's query. They're a program officer at a foundation with funding for a workshop on the "heterogeneity problem for hedonism." The core question is whether pleasure is a single thing that can be measured on a scale, or if it's too diverse. They've listed seven questions (Q1-Q7) and want me to rank them based on importance, then recommend which to fund and cut.

  First, I should understand the user's background. They mention being a long-time reader of rationalist blogs, so they're familiar with philosophical debates. Their trustees approved $180,000 for a two-year project with a postdoc and a workshop. The deliverable isn't a final theory but a shared vocabulary and an answer to what makes two pleasant experiences the same and if that can be scaled. That's key—they want something practical and foundational.

  The user provided seven questions. I need to rank them by how much the others depend on their answers. Criteria include upstream-ness (how foundational), tractability in two years with a philosopher and psychologist, neglectedness, and impact on downstream work. Also, I have to identify any pseudo-problems and note if the ranking depends on workshop composition.

  Starting with Q1: Shared-feel vs. shared-job. This asks if pleasure has a common feeling or just a functional role. If pleasure isn't unified phenomenally, it undermines classical utilitarianism. This seems super upstream because it affects everything else. If pleasure is just a functional role, Q5 about metrics might be easier, but Q4 on painful pleasures could be more complex. It's tractable with philosophical analysis and some psychology, and it's been debated but not resolved. Settling this would change how people approach the whole field. No false presupposition here—it's central.

  Next, Q4: Painful pleasures. This deals with mixed experiences like chili burn or grief. Valence might be two-dimensional. If that's true, it directly challenges the idea of a single scale for hedonism. It's highly impactful because it could force a rethink of aggregation (Q5). Tractability is good with phenomenological studies and existing psychology on valence dimensions. It's somewhat neglected compared to other issues. I don't think it's a pseudo-problem; these experiences are real and puzzling.

  Q5: The metric question. Even if pleasure has a common feature, can we rank and compare it cardinally? This is crucial for utilitarianism, as aggregation depends on it. However, it might depend on answers to Q1 and Q4. If pleasure isn't unified (Q1), or if valence is multi-dimensional (Q4), metrics become harder. Tractability is moderate—it needs empirical work on scaling, which could be done with surveys or behavioral experiments. It's not neglected but very practical. If solved, it would directly affect policy and ethics.

  Q7: Neuroscience anchor. This asks how much philosophers should rely on findings like wanting vs. liking. If neuroscience shows dissociation, it could support functional views (Q1) or multi-dimensional valence (Q4). But it might over-reach with animal models. Tractability is tricky without imaging access, so relying on existing literature is better. It's not a pseudo-problem, but the presupposition is that neuroscience can settle philosophical questions—which it can't alone. Impact is medium; it informs but doesn't dictate answers.

  Q3: Attitudinal escape. If pleasure is just a propositional attitude, heterogeneity might dissolve, but hedonism could become vacuous. This could be a game-changer if true, making other questions obsolete. However, it might be a pseudo-problem if we presuppose that pleasure must have a phenomenal component. Many argue that reducing it to attitudes changes the subject. Tractability is high with philosophical analysis, and it's under-discussed. If proven, it would simplify everything, but it's risky and possibly wrong.

  Q6: Background problem. This is about diffuse baseline affect versus discrete episodes. If most pleasure isn't episodic, theories focusing on episodes are flawed. It's important for real-world applications but might not affect the core heterogeneity debate as much. Tractability is good with experience sampling methods. Neglectedness is high—people don't talk about it enough. However, solving it might not change downstream work radically; it's more about measurement focus.

  Q2: Felt location. Why pains are localizable but pleasures aren't. This might be an introspective artifact. It seems less critical because pain literature might not transfer, and it doesn't deeply impact the main issues. Could be a pseudo-problem if it presupposes that location matters for valence unity—which it probably doesn't. Tractability is easy with introspective reports, but it's likely low impact. Probably safe to cut.

  Now, for ranking by dependency: Q1 is most upstream. If there's no common feel, it cascades. Then Q4, because painful pleasures challenge the scale. Q5 depends on both. Q7 informs Q1 and Q4. Q3 could overturn everything but might be niche. Q6 and Q2 are downstream.

  For funding: Prioritize Q1 and Q4. They're high-impact and tractable. Q5 is important but might need inputs from the first two. Cut Q2 entirely—it's a distraction. Q3 could be included but de-prioritized; it's a wildcard.

  Workshop composition: If there are more psychologists, Q7 and Q6 gain importance. Philosophers would focus on Q1, Q3, Q4.

  Tractability: Q1, Q3, Q4, Q6 are doable without a lab. Q5 and Q7 need more empirical work, which might not fit the budget.

  Final verdict: Rank from most to least critical: Q1 > Q4 > Q5 > Q7 > Q3 > Q6 > Q2
answer: |-
  ### Defended Agenda and Prioritization  
  Your mandate demands prioritizing questions where answers scaffold downstream progress, while meeting constraints of tractability, neglectedness, and impact. I rank the seven by **dependency centrality** (how many other questions presuppose or pivot on their resolution), then apply your criteria. The goal is to force clarity on whether pleasure *can* be a scalable common currency—or whether hedonism must fragment.  

  #### **Ranking by Dependency and Impact**  
  1. **Q1 (shared-feel vs. shared-job)**  
     - **Why #1?** Utterly upstream. If pleasure lacks a phenomenal unity (only functional), Q3–Q6 become secondary: hedonism becomes a theory of desire-satisfaction, not felt experience. If functionalism "changes the subject," Q5 (metric) collapses. Settling this anchors the entire project.  
     - **Trade-offs**: High tractability—philosopher/psychologist pairs can design phenomenological interviews, desire-tracking tasks, and conceptual analysis without imaging. Neglected? Debated but unresolved; functionalism dominates neuroscience, phenomenology resists it.  
     - **Downstream impact**: Resolving Q1 dictates whether to pursue Q3 (attitudinal escape) as central or dead-end.  
     - **Workshop sensitivity**: Dominance of functionalist psychologists vs. phenomenal realists shifts debate focus.  
     - **18-month trigger**: A failed replication of "liking" vs. "wanting" dissociations in humans (not rodents) elevates phenomenal unity; robust evidence for functional diversity sinks it.  

  2. **Q4 (painful pleasures)**  
     - **Why #2?** Directly tests scalability. If valence is multidimensional (e.g., intensity + "safety-signal"), Q5 (metric) requires multidimensional scaling, not aggregation. Affects Q1: if "mixed" cases share functional roles but not phenomenology, functionalism gains.  
     - **Trade-offs**: High tractability—ethnographic interviews on masochism/nostalgia, affect scales testing valence dimensions. Neglected in philosophy; empirical work exists but not integrated.  
     - **Downstream impact**: Forces Q5 to confront incommensurability. If resolved, hedonists track "net" valence or abandon cardinality.  
     - **Workshop sensitivity**: Needs clinicians (pain specialists) and cultural anthropologists; lacking them, prioritize Q5.  
     - **18-month trigger**: A dimensional model of valence explaining >90% of variance in self-reports lifts it; persistent irreducible complexity drops it.  

  3. **Q5 (the metric)**  
     - **Why #3?** Practical hinge for utilitarianism. But depends on Q1/Q4: no scalable metric exists if pleasure isn’t unidimensional or lacks a common core.  
     - **Trade-offs**: Moderate tractability—requires psychometrics (e.g., magnitude estimation tasks) but no imaging. Over-attended in economics, neglected in philosophy-psychology synergy.  
     - **Downstream impact**: If intractable, hedonism fragments; if solved, enables policy applications.  
     - **Workshop sensitivity**: Economists amplify relevance; pure philosophers may undervalue empirics.  
     - **18-month trigger**: A cross-cultural study showing consistent cardinal rankings lifts it; high variance in trade-off choices sinks it.  

  4. **Q7 (the neuroscience anchor)**  
     - **Why #4?** Informs Q1/Q4 but doesn’t dictate them. Animal models may mislead human phenomenology (Q2’s localization issue).  
     - **Trade-offs**: Low tractability without imaging—rely on meta-reviews of existing data. Deference to rodents is over-reading; human fMRI is sparse.  
     - **Downstream impact**: Resolves debates about whether "liking" circuits = pleasure, but philosophers often ignore mechanistic reductionism.  
     - **Pseudo-problem risk**: Presupposes neuroscience can answer philosophical questions—it can’t.  
     - **18-month trigger**: New human evidence linking OFC activity to subjective pleasure (not just reward) elevates it; persistent dissociation drops it.  

  5. **Q3 (the attitudinal escape)**  
     - **Why #5?** Radical but narrow. If pleasure = "being pleased that p," heterogeneity dissolves (no feels to compare). But this may render hedonism vacuous (Q5 irrelevant).  
     - **Trade-offs**: High tractability—conceptual analysis + propositional attitude surveys. Highly neglected; most assume phenomenology matters.  
     - **Downstream impact**: If true, eliminates the project; if false, clarifies stakes for Q1.  
     - **Pseudo-problem risk**: Presupposes attitudes lack phenomenology—but many argue "being pleased" has a feel.  
     - **18-month trigger**: A study showing attitude reports correlate perfectly with affect lifts it; mismatches sink it.  

  6. **Q6 (the background problem)**  
     - **Why #6?** Important but derivative. If baseline affect dominates, episodic theories (Q1–Q5) may mislead—but doesn’t resolve what unifies that baseline.  
     - **Trade-offs**: High tractability—experience sampling methods (ESM) track diffuse affect. Criminally neglected.  
     - **Downstream impact**: Shifts measurement focus but doesn’t answer scalability.  
     - **Workshop sensitivity**: Requires ESM experts; without them, cut.  
     - **18-month trigger**: ESM data showing baseline explains well-being variance >50% lifts it; weak effects drop it.  

  7. **Q2 (felt location)**  
     - **Why #7?** Least central. Pain localization doesn’t transfer to pleasure; introspective artifacts explain asymmetry. Affects no other questions.  
     - **Trade-offs**: Easy to study (body mapping tasks) but trivial impact.  
     - **Pseudo-problem**: Presupposes spatial phenomenology matters for valence—it doesn’t. Grief is "located" vaguely; chili heat is local but pleasant.  
     - **Verdict**: Cut.  

  #### **Funding Recommendations**  
  - **Fund Q1 and Q4**: They are the twin pillars. Q1 defines the target; Q4 tests its scalability. Both are tractable, high-impact, and under-synthesized. Allocate the psychologist postdoc to Q4 (empirical valence dimensions) and the philosopher to Q1 (phenomenology-function links).  
  - **Conditionally fund Q5**: Use the methods-trained postdoc slot *only* if Q1/Q4 suggest unidimensionality is plausible.  
  - **Cut Q2 and Q7**: Q2 is a distraction; Q7 requires neuroscience tools you lack.  
  - **De-prioritize Q3 and Q6**: Include in workshop discussions but don’t dedicate resources. Q3 risks implosion; Q6 refines but doesn’t resolve heterogeneity.  

  #### **Why This Ranking?**  
  - **Upstream-ness**: Q1 and Q4 are roots; others are branches.  
  - **Tractability**: Avoided Q7 (needs imaging) and prioritized tasks feasible with interviews/surveys.  
  - **Neglectedness**: Q4 (mixed valence) and Q1 (function vs. feel) lack cross-disciplinary rigor; Q5 is saturated in economics.  
  - **Downstream shift**: Resolving Q1/Q4 tells utilitarians whether to seek a pleasure metric (Q5) or switch frameworks.  

  **Verdict:**  
  Q1>Q4>Q5>Q7>Q3>Q6>Q2
