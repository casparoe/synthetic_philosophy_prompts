  Third addresses agency. Distinguishing active harm ("we kill") versus passive ("we don't save") matters ethically, but WAS might downplay that if outcomes trump intentions. Solar sale becomes active reduction of future suffering. 

  Fourth zooms out: solar energy might offset fossil-fuel suffering elsewhere. But caution—this is speculative. Only relevant if the board considers indirect effects. 

