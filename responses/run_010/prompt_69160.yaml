prompt: |-
  I'm on the board of a little land trust outside Tucson — 1400 acres of scrub and a dry wash — and next month we vote on whether to sell 90 acres of it to a solar company or fight them. Half the board assumes saving habitat is automatically the good outcome, and honestly that's how I felt too until I went down a rabbit hole about wild animal suffering: the idea that most wild animals die as babies in awful ways and the survivors don't have it great either, so fewer of them existing might not be a loss, which would kind of flip the whole thing. I dont know whether I buy it, but I want to know what it would commit me to. Can you give me the five most important implications of that question for our actual vote — the stuff that follows if you take the idea seriously, including what would have to be true empirically for the solar company's side to be the morally right one, what changes if nobody can really measure any of it, and whether it matters that we'd be causing the loss versus just letting it happen. Exactly five numbered points, a sentence or two each, no intro and no conclusion.
