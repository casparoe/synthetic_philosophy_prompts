prompt: |-
  I run continuous-improvement programs at a medical-device plant: check sheets, control charts, capability studies, corrective-action cycles, and the usual Deming-flavored skepticism about inspection-based quality. Restate Franklin's project of arriving at moral perfection in that vocabulary as faithfully as you can — the short list of named virtues, the one-per-week rotation with a mark entered for each fault caught on review, the small ruled book he carried and cycled through several times a year, the virtue he could never bring under control, the one he added late after a friend accused him of pride, the axe-grinding parable in which he decides a speckled axe is best, and his claim that the attempt left him better and happier even though the target was never reached.

  Then give me the residue report. Which elements map cleanly onto specification limits, defect counting, and audit cadence? Which did you have to distort to make fit? Which have no expression in my vocabulary at all?

  Finish with a committed verdict rather than a menu of readings: does the residue show that quality engineering is missing a concept, or that Franklin's target was never a specifiable one? And does a Deming-style objection — tampering with common-cause variation, plus the futility of inspecting quality into the product — apply to his self-audit, or does that objection misfire when inspector and inspected are the same person? Take a definite position and defend it.
