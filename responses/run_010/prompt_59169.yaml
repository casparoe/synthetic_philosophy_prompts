prompt: |-
  I've got 60 minutes next Thursday to teach Austin on performatives to an internal group at my company — we're about to ship a voice agent that can cancel subscriptions, issue refunds and rebook flights, so the room is ~11 backend/ML engineers plus three people from legal. Whiteboard only, no slides, nobody has read any philosophy. Legal has been going around in circles for a month over whether the bot's line telling a customer their order is cancelled actually commits the company or its just a status readout, and the engineers design every bot utterance as pure information transfer, so their instinct is that the fix is to grep for verbs like promise and flag those.

  I want to teach them the real arc of Austin's argument, not the pop version whose takeaway is just that some sentences are also actions. Plan the session for me — don't explain Austin to me, tell me how to sequence it. What I need:

  - the order the pieces have to go in and what genuinely depends on what. I'm assuming I can't get to felicity conditions until they've stopped asking whether the bot's utterance was true, but maybe that's backwards, tell me.
  - the one running case that carries the whole hour. My instinct is the bot's cancellation line, but I worry it's too tangled up in the fight they walked in with, so I can't tell whether that's the reason to use it or the reason to avoid it. Also what the case has to have and what it must not have — I assume the ship-christening and the will examples are out, too ceremonial, too far from a chatbot, but I could be wrong.
  - the misconceptions each half of the room brings, seperately. The engineers will want to collapse illocutionary force into the intent label in our NLU stack, and I actually want to use that as a bridge, but I know it'll turn into a trap at some point. Legal wants a bright lexical line. Where exactly in the sequence do I head each one off — before it forms or right after?
  - the moment where Austin himself drops the performative/constative split and goes general. How do I land that without making the first twenty minutes feel like a con I set them up for?
  - one check at the end that isn't a recap question — something where they have to actually rule on a new bot utterance I hand them, and where a wrong answer would show me which specific piece didn't land.
  - what to park, and say out loud that I'm parking it. Searle's taxonomy? Grice? perlocutionary effects? the whole uptake business?

  Also flag anything about how I've framed this that's going to blow up in the room — esp. whether teaching it to people who are hunting for a liability rule means they'll walk out with exactly the wrong lesson and I should pre-empt that somewhere.
reasoning: |-
  Okay, the user is preparing a 60-minute session on J.L. Austin's speech act theory for a mixed group of engineers and legal professionals at their company. They're about to launch a voice agent that handles sensitive actions like cancellations and refunds, and there's clear tension between how engineers view utterances (as pure information) versus legal's concerns about commitment. 

  First, I need to map Austin's core arguments onto their practical dilemma. The user's instinct about starting with truth conditions vs. felicity conditions is spot on—engineers will default to "is this utterance true?" so we must dismantle that first. The cancellation example is perfect because it's their actual pain point, but I should frame it neutrally ("Imagine a human agent says...") to avoid defensive reactions. 

  For misconceptions: Engineers will try to reduce illocutionary force to NLU intent labels—I can use that as an entry point ("Yes, intent is like illocutionary force! But...") then expand to how context changes everything. Legal wants bright-line lexical rules ("just flag 'promise'!"), so I'll need to kill that early with examples like "I'll be there" (is that a promise or prediction?). 

  The pivotal move is Austin's abandonment of the performative/constative split. I'll foreshadow this by showing borderline cases (e.g., "I warn you, the floor is slippery" – is it a warning if the floor isn't slippery?) so the collapse feels inevitable, not like a bait-and-switch. 

  For the assessment: A new utterance like "Your refund is processing" will reveal if they grasp that institutional context determines force—if they debate truth rather than validity, the felicity conditions didn't land. 

  Danger zones: Never imply legal liability flows directly from Austin's framework (it doesn't). Explicitly say: "This helps diagnose why certain utterances feel binding; legal rules are separate." Park perlocution, Grice, and Searle—no time, and Searle's taxonomy might oversimplify. 

  Structure-wise: Start with the cancellation example (human version), break down why "true/false" fails, introduce felicity conditions via a bot failure (e.g., agent cancels without auth), then generalize. Total time crunch—must ruthlessly prune tangents.
answer: |-
  Here's a battle-tested sequence designed for impact with your specific audience and constraints (60 min, whiteboard, mixed eng/legal, no prep, high stakes):

  **Core Running Case:** A human customer service rep saying: **"Okay, I've cancelled your subscription."** *Then later, the exact same words spoken by the voice agent.* This is close enough to resonate but lets you start neutral.

  **The Sequence (55 min + 5 buffer):**

  1.  **Hook: The Legal Puzzle & Engineer's Instinct (5 min)**
      *   State the problem: "Legal is stuck: When our bot says *'Your order is cancelled,'* does that sentence *do* the cancelling or just *report* it? Engineers think: 'It's just data transfer! Flag risky verbs!'"
      *   **Whiteboard:** Write the bot's utterance: `"Your order is cancelled."`
      *   Ask: "If a *human* rep says this to a customer, what happens? Is it just information?" (Get them talking – consensus: it *does* something).
      *   **Pivot:** "So why the confusion for the bot? Austin helps us understand why *any* utterance can be more than just true/false."

  2.  **Smash Truth-Value: Performatives Exist (10 min)**
      *   **Case Focus:** HUMAN rep: "Okay, I've cancelled your subscription."
      *   Ask: "Is this sentence *true* or *false*?" Push them: *Before* it's said, it's neither true nor false. *After* it's said... it's not describing reality, it *creates* the reality (cancellation). Truth/false is the wrong axis.
      *   **Whiteboard:** Draw a line. Label one end "TRUE/FALSE (Constatives)" and the other "ACTIONS (Performatives)". Place the human utterance solidly on the "ACTIONS" end. Label it "Performative Utterance".
      *   **Key Point:** "Some sentences *are* actions. 'I promise,' 'I bet,' 'I name this ship...' *Doing* something is primary, not describing. Our bot's cancellation line *looks* like this human performative."

  3.  **Introduce Felicity Conditions: Why Performatives Can "Misfire" (15 min)**
      *   **Case Focus:** Still HUMAN rep. Ask: "What could go WRONG? When would saying this *not* actually cancel the subscription?"
      *   Brainstorm: Rep isn't authorized? Customer didn't request it? System is down? Rep is joking/sarcastic? Rep says it to the wrong person?
      *   **Whiteboard:** List these around the HUMAN utterance. Label them "**Felicity Conditions**". Explain: For the action (cancellation) to actually happen *via the words*, conditions must be met. Otherwise, the utterance "misfires" – the action isn't accomplished, even if the words are spoken.
      *   **Bridge to Bot:** "THIS is where the bot confusion starts. The *words* are the same as the human performative. But do the felicity conditions hold? Who is the 'I'? Is the bot *authorized*? Does it have the *power*? Is the *context* correct (e.g., confirmed customer request)?" **Head off Legal's Lexical Fix:** "Notice: 'Cancel' isn't inherently magical. The *context* and *conditions* make it performative or not. Grepping for 'promise' or 'cancel' won't solve this." **Head off Eng's Intent Fix:** "The NLU 'cancel_subscription' intent label gets you close to the *force* the designers want, but doesn't guarantee the felicity conditions are met in the real world."

  4.  **The Trap & Collapse: It's ALL Actions! (Austin's Pivot) (15 min)**
      *   **Case Focus:** Shift to a "Constative": HUMAN rep says: "Your subscription renews on the 15th." Ask: "True or False? Just information?" (Yes... initially).
      *   **Challenge:** "What if the rep *knows* it renews on the 10th? What if they have no access to renewal dates? What if the customer *asks* 'When does it renew?' vs. the rep just blurting it out unprompted?"
      *   **Whiteboard:** Draw arrows from the "TRUE/FALSE" end towards the "ACTIONS" end. Label the arrows "Asserting", "Informing", "Warning", "Misleading".
      *   **Austin's Bomb:** "Austin realized *every* utterance is doing something! Even 'pure' statements: *asserting, informing, reminding, conceding, predicting*. The performative/constative split collapses. **Every Utterance has *Force* (Illocutionary Act).**"
      *   **Land It:** "The first 20 minutes weren't a con! We *needed* performatives to break the 'truth-only' mindset. Now we see the bigger picture: **Every time the bot speaks, it's performing an action.** The question isn't 'Is it true?', but 'What action is it *doing* (informing? confirming? committing? warning?) and *under what conditions does that action succeed/fail?*'"

  5.  **Apply: Back to the Bot & Legal's Core Question (7 min)**
      *   **Case Focus:** BOT: "Your order is cancelled."
      *   **Whiteboard:** Draw 3 columns: **Utterance** | **Intended Force (Illocution)** | **Felicity Conditions (Key for Legal!)**
      *   Fill for Bot:
          *   **Utterance:** "Your order is cancelled."
          *   **Intended Force:** *Confirming cancellation* OR *Executing cancellation*? (This is the crux!) Engineers designed it as confirmation (informative). Legal fears it's execution (performative). Customers might *hear* it as execution.
          *   **Felicity Conditions for EXECUTION:** (1) Bot has institutional power/authority to cancel. (2) Valid cancellation request was received/confirmed. (3) System executes cancellation backend *before or simultaneously*. (4) Correct customer/context. Etc.
          *   **Felicity Conditions for CONFIRMATION:** (1) Cancellation has actually occurred (per backend). (2) Bot has access to true state. (3) Correct customer/context.
      *   **The Liability Lesson:** "Austin doesn't give legal rules. He gives the *structure* to analyze why an utterance feels binding. The risk arises when the *force* perceived or intended (execution) requires felicity conditions that may *not* be reliably met by the system/context (e.g., bot's authority, state certainty). Legal needs to decide: What force *can* the bot legitimately have? What conditions *must* be verified before uttering words carrying that force?"

  6.  **Check: The Assessment (3 min)**
      *   Hand them a *new* bot utterance: **"Great! Your refund has been issued to your original card."**
      *   Ask: "**What *action* (illocutionary act) is the bot performing here? What are 1-2 critical *felicity conditions* for that action to succeed?**"
      *   **Wrong Answers Signal:**
          *   Focuses *only* on truth/false (e.g., "Is the refund *really* issued?"): Missed the shift to action/force.
          *   Only identifies verb ("issue"): Missed context/force complexity (it's likely *confirming*, not *doing* the issuing).
          *   Can't list plausible felicity conditions (e.g., Refund *was* processed; System reflects true state; Correct card info; Bot authorized to disclose): Didn't internalize how conditions enable the act.
          *   Says "It's just informing": May underestimate the perceived commitment force.

  **What to Park (Explicitly):**

  *   "We're parking Searle's taxonomy (assertives, directives etc.) – Austin's core force/felicity is our focus today."
  *   "We're parking perlocutionary effects (how the utterance affects the listener emotionally/practically) – vital, but distinct from the *act* being *done*."
  *   "We're parking Grice (implicature) – that's about *meaning beyond the words*, not the core act being performed."
  *   "We're parking deep debates about 'uptake' – we're assuming successful communication for now."

  **Critical Pre-emption (Liability Takeaway):**

  *   **Explicitly State Midway (During Felicity):** "Crucially: Austin helps us *diagnose* why an utterance *feels* like a commitment or action. **Legal liability depends on institutional rules, consumer protection law, and reasonable interpretations – not directly on Austin's philosophy.** Our job is to ensure the bot's utterances are designed with clear, permissible force and that the system reliably meets the *conditions* necessary for that force to be valid. This framework helps us ask the *right questions* for you (Legal) and build the *right safeguards* (Engineering)."

  **Why this works:**

  1.  **Starts with their pain point** but uses the *human* case to depersonalize initially.
  2.  **Smashes truth-value early** (essential for engineers).
  3.  **Uses Felicity Conditions** to directly tackle the authorization/power issue (legal's core fear).
  4.  **Engineers' Intent Bridge:** Uses NLU intent as a *proxy* for *intended* force, then shows why context/conditions matter more.
  5.  **Legal's Lexical Fix:** Destroyed with the context-dependence of force.
  6.  **Austin's Pivot:** Framed as a *deepening* of understanding, not a con. The initial performative is the necessary stepping stone.
  7.  **Check:** Forces application to a *new* case, revealing specific misunderstandings.
  8.  **Liability Pre-empted:** Explicitly separates Austin's analysis from legal rules while showing its diagnostic value.

  **Go in confident. You're giving them the conceptual tools to finally cut through their deadlock.** Good luck!
