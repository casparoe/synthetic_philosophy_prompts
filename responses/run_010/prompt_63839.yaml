prompt: |-
  I've been going around in circles on when you're allowed to trust your own read of your situation versus the stats on people like you, and I think my answers contradict each other. Here's what I actually think, case by case:

  My friend is redoing his kitchen and swears it'll be six weeks. Everyone I know who's done a renovation says three months at minimum, and he knows that. I think he's just wrong to plan around six — knowing your own kitchen in detail doesn't get you out of the base rate.

  My sister says she'll finish her PhD in two years. She's got two papers out and most of a chapter drafted. I think she's entitled to expect two years even though the average is like five, and that doesn't feel like wishful thinking to me the way the kitchen one does.

  When I started my landscaping business I read that most of them fail within five years, and I basically decided that number wasn't about me. I dont feel bad about that. But when my cousin pulled the same move with a sports betting system he'd worked out, I told him he was kidding himself.

  My nephew wants to audition for a music program that takes maybe 4% of applicants. Half of me says the honest reference class is everyone who auditions; the other half says it's kids who've practiced four hours a day since they were nine, which he is. And I've noticed I can almost always find some narrower group that makes the odds look good, which seems like a bad sign — except sometimes the narrow group really is the right one, like with my sister.

  Then the one I keep flip flopping on: my daughter wants to try out for a pro soccer team. I want to tell her to be realistic, but if she asked me straight out what her chances are, I don't know whether to give her the base rate or my read on her.

  Is there a single principle that says when private knowledge of your own case legitimately overrides the statistics and when it's just you flattering yourself? Please state it as exactly as you can, say what it comes out to for the daughter case and for a project where there's no real precedent to draw a class from at all, and tell me which of the verdicts above it can't save — I'd rather give one up than end up with a rule that's just a pile of exceptions.
reasoning: |-
  Hmm, the user is grappling with a fundamental cognitive bias question: when can personal insight legitimately override statistical base rates? They've provided several concrete examples where their intuition conflicts with aggregate data, and they're frustrated by inconsistent reasoning. 

  The core tension here is between two valid epistemological approaches: frequentist probability (what generally happens to people in this category) versus Bayesian updating (how should I adjust general probabilities based on this specific evidence). The user's examples reveal they intuitively understand this but lack a formal framework.

  Key observations from their cases:
  - Kitchen reno: correctly identifies friend is ignoring base rate without countervailing specific evidence
  - PhD: sister has demonstrable progress markers that plausibly reset expectations
  - Business: user's self-assessment was validated by success (survivorship bias?), but cousin's sports betting system likely suffers from illusion of control
  - Nephew: exposes the "reference class tennis" problem where arbitrary subgroup selection can manipulate odds
  - Daughter: most emotionally loaded case - reveals parental protective instincts conflicting with supportiveness

  For the framework, I'm considering emphasizing two filters: 
  First the "evidence quality" test - is the personal knowledge verifiable, concrete, and truly distinctive? (e.g., sister's published papers vs. friend's vague optimism). 
  Second the "causal pathway" test - can the unique factors actually influence the outcome? (nephew's practice hours directly impact auditions; cousin's betting "system" likely doesn't beat house edge).

  The daughter case is thorny because parental assessment combines genuine observation with love-blindness. The framework should force explicit listing of distinct advantages: has she made regional teams? Received scout interest? Outperformed peers at higher levels? If not, the base rate stands.

  For novel projects with no precedent, the answer becomes: without reference class, you have no statistical anchor - personal assessment is all there is, but should be grounded in analogous experiences and explicit assumptions.

  The framework won't save the landscaping business case - that was likely motivated reasoning that happened to succeed. Better to acknowledge that as the exception that proves the rule.
answer: |-
  Your struggle reveals a deep tension between base rates and personal insight—one resolved by this principle:

  **"Private knowledge justifies overriding base rates only when it constitutes specific, verifiable evidence that materially alters the causal pathways to the outcome, and this evidence is *not* already baked into the reference class statistics."**

  ### Breaking Down the Principle
  1. **Specific & Verifiable**: Concrete facts (e.g., "I have two published papers"), not feelings or vague self-assessments ("I'm disciplined").  
  2. **Materially Alters Causal Pathways**: The evidence must directly impact success/failure (e.g., a rare skill, unique resource, or atypical progress).  
  3. **Not Baked In**: If the reference class *already accounts* for your traits (e.g., "all PhD candidates" includes hard workers), your knowledge isn't special.  

  ### Applied to Your Cases:
  | Case                      | Verdict Under Principle                                                                                             | Contradiction Resolved?                     |
  |---------------------------|---------------------------------------------------------------------------------------------------------------------|---------------------------------------------|
  | **Friend's Kitchen Reno** | ❌ Override invalid. "Knowing my kitchen" isn't verifiable evidence *missing* from contractor stats.               | Your original stance holds.                 |
  | **Sister's PhD**          | ✅ Override valid. Published papers + drafted chapter are *specific, uncooked* evidence of atypical progress.      | Justified exception.                        |
  | **Your Landscaping Biz**  | ⚠️ **Contradicts principle.** "Not about me" lacks evidence. Stats *include* motivated founders. (Survivorship bias saved you.) | **Verdict sacrificed** (per your request). |
  | **Cousin's Betting System**| ❌ Override invalid. "Worked out system" isn't verifiable; stats already include self-taught gamblers.              | Your skepticism justified.                  |
  | **Nephew's Music Audition**| ✅ Narrow class valid *only if* "4 hrs/day since age 9" is a *proven* causal factor (e.g., program data shows 50% admit rate for this subgroup). Else, ❌. | Depends on evidence quality.               |

  ### Your Daughter's Soccer Tryout
  - **Base rate (e.g., 1% make pro teams)** is the default.  
  - **Override only if you have evidence like**:  
    - She's already scouted by pro teams.  
    - She outperforms 99% of players in measurable drills at elite camps.  
    - Medical data shows rare physical traits giving objective advantage.  
  - **Not sufficient**: "She’s talented," "works harder than others," "coach says she’s good"—these are likely *included* in the reference class.  
  **Your answer to her**: "The odds are low for anyone, but here’s where you stand *specifically*: [concrete evidence if any]. Without that, we plan for the base rate."

  ### Novel Projects (No Precedent)
  - **Principle**: Without a reference class, you *must* rely on personal insight—but it must be grounded in **analogous causal evidence**.  
    *Example*: Building Mars colony tech. No "Mars colony" stats, but:  
    ✅ Valid: "We've cracked radiation shielding in 3 tests."  
    ❌ Invalid: "We're smarter than others who tried."  

  ### Why This Works
  - **Avoids "reference class tennis"**: No cherry-picking subgroups unless they're *causally distinct and evidenced*.  
  - **Exposes self-flattery**: Motivation/dedication are usually *included* in base rates; unique evidence is rare.  
  - **Explains PhD vs. Kitchen**: Renovation stats absorb "I know my kitchen"; PhD completion stats *don’t* reflect "two papers already published."  

  **Sacrificed Verdict**: Your landscaping business confidence was unjustified by this principle—you got lucky. This is consistent: base rates exist *because* most people overestimate private knowledge. The rule holds even when intuition fails.  

  **Final Word**: Base rates anchor reality; personal evidence is the sail. But the sail only moves the boat if it catches a *new* wind.
