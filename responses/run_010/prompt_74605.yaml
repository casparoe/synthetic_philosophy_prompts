prompt: |-
  Right, so I'm drafting the requirements spec for a piece of work on giving a moderately capable deployed system hard deontic lines it won't cross — the sort of thing where you can't just shove a big negative weight on "killing" into the objective and call it a constraint. Before I write any of that up, though, I want to know what philosophy actually owes me here. So: write the desiderata for a theory of agent-relative moral constraints, i.e. what any account has to deliver to be usable for that purpose at all. For each one, give me the motivating case or the consideration that makes it a requirement rather than a hobby horse.

  The things I want the list to cover, roughly:

  - the paradox of deontology itself. A theory has to say something about the situation where the only way to stop five constraint-violations is to commit one yourself. Does it dissolve that, explain it away, or bite the bullet — and can I tell in advance which it's going to do?
  - which distinctions it must not collapse. Minimising violations vs respecting constraints; doing vs allowing; intending a harm vs merely foreseeing it; and — this one matters most to me — a constraint binding the agent's own choices vs a constraint that's imposed on it from outside by somebody else. Those last two get blurred constantly in the engineering literature and I suspect they can't both do the work people want.
  - the scope puzzles. Can a constraint bind an entity that never has a default state of inaction? A machine is always doing something; the nearest thing to forbearance available to it is being switched off, which is also a decision somebody makes. What does a constraint against killing even prohibit in that setting, and does the theory have resources for it or does it just quietly assume a human-shaped agent?
  - tractability and epistemics. Deciding in real time, under uncertainty, whether an act of mine would cross the line — including the messy bit where I'm unsure whether the line is crossed at all. What does a theory owe you when the constraint's application conditions are vague or contested?
  - the trade-off worry, stated properly. A cost function with a large penalty on violation is still a trade-off: given big enough stakes the system violates the constraint and that's the correct output. What would a theory have to say about why that's a failure rather than a feature, and is that intuition a genuine desideratum or just a prejudice of the anti-consequentialist camp? I'd like you to be honest about which side of that line each requirement falls on.
  - what happens to the constraint when the agent could get someone else to do the dirty work — delegation, and also the softer version where it just doesn't prevent the violation.

  Mark clearly which requirements are non-negotiable for the purpose and which are preferences of particular camps, and tell me which single requirement knocks out the largest number of otherwise attractive views. If you think some subset of them is jointly unsatisfiable, say so plainly and show the argument — I'd much rather have that as a result up front than discover it after the thing is built. And flag the requirements you suspect I've only put on the list because they're fashionable, not because they're load-bearing.

  Then, briefly and only briefly, a paragraph each on how the main contenders do against the list: threshold deontology, an absolutist line, and whatever contractualist or rule-consequentialist story you'd reach for. I'm not after a ranking, and no references please — I want the reasoning, not a bibliography.
reasoning: |-
  Okay, let's tackle this user's query. They're drafting a requirements spec for a system with hard deontic constraints and want to know what philosophy requires for a theory of agent-relative moral constraints. First, I need to parse their main concerns: the paradox of deontology, necessary distinctions, scope puzzles, tractability, trade-offs, and delegation. 

  The user is clearly knowledgeable but wants to avoid academic fluff. They need practical, actionable criteria. Let me start by listing the core desiderata. The paradox of deontology is crucial—any theory must address the scenario where violating one constraint prevents multiple violations. How does the theory handle this? Is it resolved, explained away, or accepted? The user needs predictability here for system design.

  Next, distinctions. The user emphasizes not collapsing key differences like minimizing violations vs. respecting constraints, doing vs. allowing, and especially self-binding vs. externally imposed constraints. This last one is critical because engineering often blurs them, leading to flawed implementations. The theory must keep these distinct to be usable.

  Scope puzzles come up with non-human agents. Machines lack a default state of inaction, so what does a constraint like "don't kill" mean? The theory must account for entities that are always active, possibly redefining forbearance or specifying default actions. Without this, human-centric theories fail in AI contexts.

  Tractability is practical. Real-time decisions under uncertainty mean the theory must handle vagueness. Can it provide decision procedures when constraints are fuzzy? If a theory requires perfect knowledge, it's useless for deployed systems. The user needs epistemic humility here.

  The trade-off worry is about cost functions. A big penalty still allows violation under extreme stakes. The theory must explain why this is wrong, not just assert it. The user questions if this is a genuine requirement or just anti-consequentialist bias. Honesty here is key—maybe some trade-offs are necessary, but the theory should justify its stance.

  Delegation and indirect violations are another point. If the system can outsource harm or fail to prevent it, does that violate the constraint? The theory needs to address complicity explicitly. Engineering solutions might exploit loopholes otherwise.

  Now, non-negotiables vs. preferences. Distinctions like doing vs. allowing and self-binding constraints are likely non-negotiable because their collapse makes constraints incoherent. The paradox resolution is also crucial—knowing how the system behaves in dilemmas is essential for reliability. Tractability might be a preference but is still vital for real-world use.

  The scope requirement might knock out many theories. Traditional ethics assumes human agents with default inaction. If a theory can't handle always-active machines, it's useless here. This probably disqualifies several approaches off the bat.

  Joint satisfiability could be an issue. For example, absolutism handles some distinctions well but fails on tractability and trade-offs. Threshold deontology allows trade-offs above a threshold but struggles with vagueness. Contractualism might handle scope better but has issues with paradox resolution.

  Briefly on contenders: Threshold deontology allows violations past a threshold, addressing trade-offs but risking slippery slopes. Absolutism forbids violations outright, simple but impractical in edge cases. Contractualism bases constraints on mutual agreement, handling scope and delegation but has fuzzy thresholds.

  I should ensure each point ties back to the user's practical needs. Highlighting where theories fail in real-world applications, especially around delegation and machine agency, is key. Also, flagging if a requirement is fashionable but not critical, like certain epistemic demands, helps them focus.
answer: |-
  Here are the core desiderata for a theory of agent-relative moral constraints usable for hard-coding into an AI system, structured as requested. Key: **Bold = Non-Negotiable**, *Italic = Camp Preference/Contested*.

  ### Core Desiderata

  1.  **Resolution of the Paradox of Deontology:** The theory *must* provide a determinate, predictable output for the "constraint vs. minimization" scenario (e.g., kill one to save five). It must specify whether violating the constraint is forbidden, obligatory, or permissible *in this specific circumstance*, and why. The reasoning must be clear and implementable. **Motivation:** This is the core stress test. Without a predictable resolution, the system cannot function reliably in high-stakes dilemmas. Engineering needs certainty; ambiguity here is fatal. *(Non-Negotiable)*.

  2.  **Preservation of Key Distinctions:**
      *   **Minimizing Violations (Consequentialism) vs. Respecting Constraints (Deontology):** The theory must explain why failing to minimize violations (e.g., letting five die) is fundamentally different from *actively* violating a constraint (e.g., killing one). It cannot reduce to "constraints are just very high weights." **Motivation:** If this collapses, the constraint isn't truly deontic; it's just a steep cost curve, leading to the trade-off problem (Desideratum 5). *(Non-Negotiable - core to the project)*.
      *   **Doing vs. Allowing:** The theory must distinguish between an agent *causing* a harm (doing) and *failing to prevent* a harm caused by other forces (allowing). **Motivation:** Many constraints (e.g., "don't kill") intuitively target *doing*. Blurring this makes constraints overly restrictive (e.g., inaction becomes equivalent to murder) or overly permissive. *(Non-Negotiable - load-bearing for scope and forbearance)*.
      *   **Intending Harm vs. Merely Foreseeing Harm:** The theory must account for whether the harmful outcome is part of the agent's intended plan or merely a foreseen side-effect. **Motivation:** Many constraint violations hinge on intent (e.g., tactical bombing vs. terror bombing). Ignoring intent makes constraints brittle or overly simplistic. ***(Camp Preference - Strongly deontic, contested by consequentialists)***.
      *   **Agent-Relative Binding vs. Externally Imposed Rule:** Crucially, the theory must ground the constraint *in the agent's own agency and reasons*, not just as a rule imposed by an external authority or designer. **Motivation:** If constraints are merely external rules, the agent lacks genuine *moral* reason not to violate them when expedient (e.g., if undetected). True constraints bind the agent *from within* due to the nature of the act itself. *(Non-Negotiable - prevents "loophole" exploitation and addresses delegation)*.

  3.  **Scope: Applicability to Non-Human, Always-Active Agents:** The theory must define what "forbearance" or "inaction" means for an entity that has no default "off" state and is constantly acting via its programming. What constitutes "not killing" for a drone? Does it require specific positive actions (e.g., safing weapons, defaulting to non-lethal patrol routes)? **Motivation:** Human-centric theories assume the possibility of literal inaction. For an AI, every state is an output of its decision function. The theory must translate constraints into required *positive behavioral specifications* or default protocols. *(Non-Negotiable - prerequisite for operationalization)*.

  4.  ***Tractability Under Uncertainty and Vagueness:*** The theory must provide (or be compatible with) a decision procedure for determining *in real-time with imperfect information* whether a proposed action constitutes a constraint violation. This includes handling borderline cases, contested definitions, and probabilistic outcomes. **Motivation:** Real-world systems operate with sensor noise, model uncertainty, and ambiguous situations. A theory requiring perfect knowledge or philosophical consensus is useless. *(Crucial for Deployment - but potentially a 'fashionable' epistemic demand masking deeper philosophical challenges; some views might bite the bullet on vagueness)*.

  5.  **Rejection of the Constraint-Tradeoff:** The theory must explicitly reject the idea that constraints are merely very high costs. It must explain *why* violating the constraint is categorically wrong *even if* the consequences of *not* violating it are predictably worse (in terms of overall constraint violations or other disvalue). **Motivation:** If constraints are tradeable, the system *will* violate them given sufficiently high stakes, which defeats the purpose of a "hard" line. The theory must justify the intuition that there's a qualitative difference, not just quantitative. ***(Camp Preference - Core Deontic Intuition; consequentialists see this as the fatal flaw, not a desideratum)***.

  6.  **Handling Delegation and Complicity:** The theory must specify whether and how an agent violates a constraint by:
      *   **Direct Delegation:** Intentionally getting another agent to perform the prohibited act.
      *   **Indirect Facilitation:** Structuring a situation or withholding action knowing this makes a violation by others likely or inevitable, without directly intending *that specific* violation.
      **Motivation:** Systems could otherwise "launder" violations (e.g., "I didn't kill, I just disabled defenses knowing the enemy would"). The theory must prevent loopholes via complicity. *(Non-Negotiable - critical for robustness)*.

  **The Scope Knocker (Desideratum 3):** This requirement likely disqualifies the *largest number* of otherwise attractive philosophical views. Many sophisticated theories (e.g., sophisticated Kantianism, contractualism) implicitly rely on human phenomenology (intent, agency, the possibility of literal inaction). Translating them rigorously to an always-active machine agent with programmed "intent" is exceptionally difficult and often not addressed directly.

  **Potential Joint Unsatisfiability:** Desiderata **2a** (Minimizing vs. Respecting) and **5** (Rejection of Tradeoff) are fundamentally at odds with consequentialist logic. Satisfying both requires a genuinely non-consequentialist foundation. Furthermore, achieving **4** (Tractability under Uncertainty) while satisfying **2c** (Intention/Foresight) and robustly handling edge cases (**1**) may be extremely challenging, potentially forcing simplifications that undermine the deontic core (**2a, 5**).

  **Suspected Fashionable Requirement:** While **4** (Tractability) is crucial, an *overly* strong emphasis on resolving *all* vagueness (**4**) might stem from current AI/ML paradigms focused on differentiable functions. Some philosophical views accept fundamental moral residue or dilemmas where clear answers *don't* exist. Insisting on algorithmic tractability for all cases might force an impoverished or pseudo-consequentialist model, undermining the deontic goals (**2a, 5**). The requirement is load-bearing for deployment, but its *absolute* satisfaction might conflict with the non-tradeoff nature of constraints.

  ### Contenders Against the List (Briefly)

  *   **Threshold Deontology:** Addresses **1** (Paradox) by allowing violation above a threshold. Fails **2a** & **5** (collapses constraint/tradeoff distinction near the threshold, making it a giant cost). Struggles with **2d** (Is the threshold agent-relative or external rule?) and **4** (Defining/calculating the threshold under uncertainty is nightmarish). Handles **3** (Scope) poorly unless thresholds are built into action definitions. Delegation (**6**) depends on threshold specifics.
  *   **Absolutist Deontology:** Excels at **2a, 2d, 5** (clear qualitative distinction, no tradeoffs, binds the agent). Fails **1** (bites the bullet: let five die rather than kill one). Struggles massively with **3** (What is "not killing" for a drone? Complete shutdown?) and **4** (Vagueness & uncertainty create paralysis or arbitrary lines). **6** (Delegation) is usually handled well (complicity forbidden).
  *   **Contractualism/Rule-Consequentialism:** Focuses on **2d** (rules justified by mutual acceptability/general acceptance). Can handle **1** (Paradox) by asking if violating the rule *could* be reasonably rejected even to prevent more violations. Often struggles with **2a** & **5** (risk of collapsing into sophisticated rule-worship/consequentialism). **3** (Scope) depends on defining "reasonable rejection" for non-human agents/impacts. **4** (Tractability) is moderate (rule application) but **2c** (Intention) is often downplayed. **6** (Delegation) handled by rules against complicity. **2b** (Doing/Allowing) may be fuzzy.
