  Building the marking key, I'll outline four essential components: 1) identifying the case's challenge, 2) accurate theory applications, 3) coherent obligation analysis, 4) recognition of alternative interpretations. Common failures will include misrepresenting Searle's primitivism or missing Bratman's scalability. Crucially, I'll flag Gilbert's express condition as contested ground where either interpretation is acceptable.

