prompt: |-
  I am in the second term of a graduate formal epistemology sequence, and we have just moved from the standard precise-Bayesian material into imprecise probabilities — credal sets, lower and upper previsions, the whole apparatus. The difficulty I have is that the seminar readings pull in opposite directions: some insist that unspecific evidence rationally demands an unsharp credal state, others argue that unsharp credences are a kind of practical irrationality, and a third group treats the machinery as a statistical modelling tool with no philosophical upshot at all. Before I commit to a view for my seminar paper, I want the specification rather than the contenders. So: write the list of desiderata that a theory of rational belief under imprecision must satisfy to count as adequate. I want the requirement, the case or consideration that motivates it, and an explicit marking of whether it is non-negotiable or merely the local prejudice of one camp — in particular, I suspect several of the demands currently being pressed on imprecise probabilists are just precise-Bayesian norms smuggled in as neutral criteria, and I would like to know which. Please work through at least the following candidates, adding any I have missed and dropping any you think are not genuine requirements: that the theory vindicate imprecision where evidence is genuinely unspecific, rather than licensing it anywhere; that it explain or explain away dilation, i.e. the possibility that conditioning on an event widens your interval for a hypothesis whichever way that event turns out; that it preserve conglomerability, or else say what is lost without it; that it distinguish the weaker requirement of avoiding sure loss from full coherence and explain why the gap matters; that it supply a decision rule — Γ-maximin, E-admissibility, maximality, or something else — that yields determinate choices in ordinary cases without becoming dynamically incoherent; that it resist Elga's argument that a variant of the diachronic Dutch book shows perfectly rational agents always to have perfectly sharp probabilities; that it handle the reflection principle and the intuition that costless information should never be declined; that it allow complete ignorance to be represented without an arbitrary choice of parameterisation, as in the cube-factory style problems for the principle of indifference; that it recover precise probability as a special case; that it accommodate ambiguity aversion of the Ellsberg sort; and that it remain usable by a single non-omniscient agent, not only by a panel of experts. For each, note the distinctions the theory must not collapse — for instance between an unsharp credal state and mere indecision, between epistemic and strong independence, and between convexity as a substantive constraint and convexity as a representational convenience.

  The part I most want is the impossibility work. If some subset of these desiderata is jointly unsatisfiable — and I have an inkling that something like "imprecision is rationally required under unspecific evidence", "no dilation", "dynamic coherence in choice", and "determinate comparative verdicts about single bets" cannot all be held together — then say precisely which subset fails, which requirement should be given up first, and why. Rank the requirements by how much work each does in excluding candidate theories, and identify the single one that knocks out the most views currently on offer.

  Please write in British English, and begin with your bottom line in the very first sentence — naming the requirement you take to be most exclusionary and stating whether you think any subset of the list is jointly unsatisfiable — and only then give the reasoning; no preamble, no restatement of my question, and no bibliography, since I have the reading list already. A table is acceptable for the requirement/motivation/status columns, provided the impossibility discussion is written out in prose. Finally, I would like some epistemic honesty about the exercise itself: tell me what would change your mind — which argument or result would lead you to withdraw one of the requirements you have marked non-negotiable, or to concede that a subset I have listed as jointly unsatisfiable is in fact consistent — and flag the points where your own reasoning is most likely to fail, whether because the requirement depends on a contested reading of what a credal set represents or because you are unsure of the technical results you are leaning on.
reasoning: |-
  Hmm, the user is a graduate student in formal epistemology, grappling with imprecise probabilities. Their core struggle is navigating conflicting seminar readings that pull in different directions—some advocating imprecision as rational under unspecific evidence, others condemning it as irrational, and a third treating it as a mere statistical tool. They need a structured analysis of desiderata for any adequate theory of rational belief under imprecision, with explicit attention to tensions and impossibilities.  

  The user's explicit request is for a list of requirements, each dissected into motivation and status (non-negotiable vs. negotiable), plus an impossibility analysis. But their deeper need seems to be clarity on where the field's fault lines lie—especially which desiderata are incompatible and which are "smuggled" precise-Bayesian norms. They're wary of false consensus and want epistemic honesty about uncertainties.  

  Starting with the bottom line: the most exclusionary requirement is the **demand for determinate comparative verdicts on single bets** (e.g., "bet on A over B is rationally required/permitted/forbidden"). This clashes severely with **dynamic coherence** (no avoidable sure losses over time) and **non-arbitrary ignorance representation**. Why? Imprecise models often lack a unique "best" action, forcing decision rules like Γ-maximin or E-admissibility. These either violate dynamic coherence (e.g., Γ-maximin leads to Dutch books) or fail to deliver determinacy (E-admissibility permits multiple choices). Simultaneously, avoiding dilation—a key user concern—often requires sacrificing conglomerability, which itself undermines dynamic coherence.  

  For the table: each requirement gets a motivation and status marker. Non-negotiables include avoiding sure loss (basic rationality), recovery of precise probabilities (boundary condition), and single-agent usability (scope). Negotiable are dilation tolerance (some argue it's benign) and ambiguity aversion accommodation (context-dependent). The convexity distinction is crucial: treating it as representational (non-negotiable) avoids conflating indecision with imprecision.  

  The impossibility cluster: **imprecision under unspecific evidence + no dilation + dynamic coherence + determinate single-bet verdicts** is unsustainable. Proof sketch: unspecific evidence (e.g., complete ignorance) forces credal sets. To avoid dilation, you need conglomerability, which requires disintegrability (credal sets factorizing per event). But disintegrability narrows sets dramatically, often to near-sharpness, contradicting the demand for non-arbitrary ignorance representation. Meanwhile, determinate single-bet verdicts require a total ordering of acts, but dynamic coherence (via no Dutch books) forces decision rules that either violate this (Γ-maximin) or admit indeterminacy (E-admissibility).  

  Epistemic honesty corner: I'd withdraw "no dilation" as non-negotiable if new work shows dilation only arises in pathological cases. Or concede the impossibility cluster is consistent if a theory uses non-convex sets (but that breaks representation). My reasoning leans on technical results (e.g., dilation via Walley-Schervish, Dutch books for Γ-maximin) but remains shaky on whether "complete ignorance" can be coherently formalized at all—perhaps it's a misguided idealisation.
answer: |-
  **Bottom line:** The most exclusionary requirement is **supplying a decision rule yielding determinate choices without dynamic incoherence**; no theory satisfies this alongside **vindicating imprecision for unspecific evidence**, **avoiding dilation**, and **delivering determinate comparative verdicts on single bets**—this subset is jointly unsatisfiable.  

  ### Desiderata Table  
  | Requirement | Motivation | Status |  
  |-------------|------------|--------|  
  | **Vindicate imprecision only where evidence is genuinely unspecific** | Avoids trivialising imprecision (e.g., total ignorance ≠ mere computational laziness). Distinguishes *epistemic* gaps from indecision. | **Non-negotiable** (core to imprecise frameworks). |  
  | **Explain or explain away dilation** | Dilation (e.g., [Walley’s coin](https://www.jstor.org/stable/2251587)) violates intuition that learning should not universally increase uncertainty. Must not conflate with reasonable belief updating. | **Negotiable** (some argue dilation is rational under ambiguity). |  
  | **Preserve conglomerability or state its cost** | Prevents contradictions in infinite partitions (e.g., uniform prior on [0,1] disintegrates only if conglomerable). Distinguishes *epistemic* from *mathematical* necessity. | **Non-negotiable** (avoids inconsistency). |  
  | **Distinguish avoiding sure loss vs. full coherence** | Avoiding sure loss (no Dutch book) is minimal rationality; coherence (linear previsions) ensures consistency. Gap exposes whether imprecision is conservative or incoherent. | **Non-negotiable** (foundational to the architecture). |  
  | **Supply a dynamically coherent decision rule** | Rules like Γ-maximin violate dynamic coherence (e.g., Dutch books under sequential bets); E-admissibility/maximality avoid this but permit indeterminacy. Must not collapse *practical* and *epistemic* rationality. | **Non-negotiable** (dynamic coherence is basic agency). |  
  | **Resist Elga’s diachronic Dutch book** | Elga argues only sharp credences avoid bookies. Must rebut conflating *model-relative* coherence with agent failure. | **Non-negotiable** (defends imprecision’s viability). |  
  | **Handle reflection & costless information** | Rejects self-undermining beliefs (e.g., "I’ll doubt H tomorrow, so I doubt H now"). Must distinguish *updating* from *forecasting*. | **Non-negotiable** (prevents auto-refutation). |  
  | **Represent ignorance non-arbitrarily** | Principle of indifference fails (e.g., cube factory paradox). Imprecision should resolve this without ad hoc parameters. | **Non-negotiable** (key advantage over precise Bayes). |  
  | **Recover precise probability as special case** | Ensures generality; avoids treating imprecision as disjoint from standard rationality. | **Non-negotiable** (boundary condition). |  
  | **Accommodate Ellsberg-style ambiguity aversion** | Empirical data show agents prefer known risks. Must not reduce this to "irrationality". | **Negotiable** (if deemed descriptive, not normative). |  
  | **Single non-omniscient agent usability** | Imprecision isn’t just for expert pooling. Distinguishes *individual* epistemology from *group* statistics. | **Non-negotiable** (scope condition). |  
  **Distinctions to uphold**:  
  - Unsharp credence vs. indecision: The former is doxastic commitment; the latter is deliberation failure.  
  - Epistemic vs. strong independence: The former is irrelevance given evidence; the latter is factorizability.  
  - Convexity: Not a substantive constraint (not all credal sets are convex hulls) but a representational convenience.  

  ### Impossibility Discussion  
  The unsatisfiable subset is:  
  1. **Vindicate imprecision under unspecific evidence** (e.g., complete ignorance requires non-singleton credal set).  
  2. **Avoid dilation** (e.g., no widening intervals after conditioning).  
  3. **Dynamic coherence** (no Dutch books across time).  
  4. **Determinate comparative verdicts on single bets** (e.g., "bet on H is permissible/forbidden").  

  **Why unsatisfiable**:  
  - Imprecision under ignorance (e.g., vacuous prior [0,1] for coin bias) *causes* dilation (conditioning on any sequence of flips leaves your interval for the next flip as [0,1]). Avoiding this requires abandoning conglomerability (e.g., using non-conglomerable credal sets), violating dynamic coherence via sure-loss contracts.  
  - To deliver determinate single-bet verdicts, you need a decision rule like Γ-*maximin* (always pick the max worst-case payoff). But this rule is dynamically incoherent: it leads to turning down sequences of bets that guarantee a profit. Alternatives (E-admissibility, maximality) avoid incoherence but yield indeterminacy (multiple permissible choices), failing determinacy.  
  - **Trade-off**: Relax determinacy (accept E-admissibility’s permissiveness) to keep dynamic coherence and dilation tolerance. Or allow dilation to preserve ignorance representation and coherence.  

  ### Ranking by Exclusionary Power  
  1. **Dynamically coherent decision rule** (excludes Γ-maximin, some Levi-style rules).  
  2. **Determinate single-bet verdicts** (excludes E-admissibility/maximality).  
  3. **Non-arbitrary ignorance representation** (excludes "precise-by-default" models).  
  4. **Avoiding sure loss vs. coherence distinction** (excludes conflating minimal/maximal rationality).  

  ### Epistemic Honesty  
  - **What would change my mind on non-negotiables**:  
    - If a proof shows conglomerability *must* hold for *any* consistent belief system (not just countable additivity), I’d demote dilation avoidance.  
    - If a decision rule (e.g., *uniformly maximal* choices) delivers determinacy *and* coherence, I’d revise the impossibility claim.  
  - **Vulnerable reasoning points**:  
    - **Dilation’s benignity**: I assume dilation is problematic, but if new evidence shows it aligns with learning (e.g., "ignorance preservation"), this weakens its exclusionary role.  
    - **Credal sets as mental states**: If credal sets are merely statistical tools (not doxastic), requirements like "vindicate imprecision" collapse. I assume they represent belief.  
    - **Technical reliance**: The impossibility leans on Walley-Schervish dilation results and Seidenfeld’s dynamic coherence work. If these are misapplied, the argument fails.
