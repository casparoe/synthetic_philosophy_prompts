prompt: |-
  Quick context: I'm a software engineer by trade, no philosophy background at all, but I'm picking up some marking as a TA for a second-year course on global poverty this term (the department was short handed and it pays the mortgage). I've got one take-home answer in front of me and I honestly cant tell how good it is, so I'd rather not just guess at a number.

  The question was:

  "Amartya Sen argues that famines are not natural disasters. To what extent, then, is a famine a political crime? Use Sen's analysis and at least two historical cases."

  500-word limit, open book, submitted last Friday. Here's what the student wrote:

  ---

  Famines look like natural disasters but Sen's argument is that they almost never are, because what kills people is not a shortage of food in the country but a breakdown in who can get hold of it.

  In his book on poverty and famines he develops the idea of entitlements. An entitlement is the food you have a legal right to, which for most people comes from working for a wage and then buying food with it. It is not really about the total harvest, it is about whether your claim on food still holds. When that claim collapses, people starve even if the warehouses are full. So famine is a question of distribution and of law, not of nature.

  Bengal in 1943 is his central case. Wartime inflation drove food prices up much faster than rural wages, so agricultural labourers who had always been one bad season away from starvation simply could no longer afford to eat, even though the harvest had not fallen by anything like enough to explain the deaths. On top of that there was hoarding and speculation once price controls came off, and the colonial administration never declared a famine or organised relief in time. Nothing about the weather made that happen.

  The same pattern shows up in Ireland in the 1840s. The potato blight hit in 1845, but Ireland carried on exporting grain to Britain throughout the worst years, which proves there was plenty of food in the country and that the famine was therefore a political choice made in London. And the Great Leap Forward famine of 1959-61, the largest in history, was caused by state policy and by the suppression of any criticism of it, not by drought.

  Sen's general point is that famine never happens in a functioning democracy with a reasonably free press, because rulers who let people starve get voted out and the newspapers force them to respond. That gives us the answer to the question. Famine is a political crime in the strict sense: the authorities always know it is happening, they always have the means to stop it, and choosing not to is the same thing as deciding to let people die. What we call a natural disaster is usually just a government's decision about who gets to eat.

  ---

  Can you give me a mark out of 10 and then the specific comments that justify it, point by point, in the order the student makes them? I need to be able to paste the comments straight into the feedback box, so please say which bits are solid and should be credited, which bits are wrong or don't follow and roughly how much each of those costs them, and what they'd have to add or change to get the higher mark. If a claim is defensible but overstated, tell me that separately from a claim that's just mistaken — that distinction is the part I'm least able to judge. British English please, since it goes back to the student. And no reading list or bibliography, I wouldn't be able to check it and it isn't what I'm after here.
reasoning: |-
  Okay, I need to help this software engineer who's TAing a global poverty course. They're not familiar with philosophy and need help grading an essay on Sen's famine theory. Let me break this down carefully.

  First, the question is about whether famines are political crimes based on Sen's analysis. The student's answer uses three cases: Bengal 1943, Irish Potato Famine, and China's Great Leap Forward. 

  The core of Sen's argument is that famines aren't about food shortage but entitlement failures. The student got this right - they explained entitlements as legal access to food through wages or other means. That's solid. 

  Looking at the Bengal case: The student correctly notes wartime inflation outpacing wages, plus hoarding and colonial inaction. Good. For Ireland: They mention continued grain exports during famine. Accurate. The Great Leap Forward part correctly blames state policy.

  But there are issues. The democracy claim is overstated - Sen argues democracies prevent famines through accountability, but it's not absolute. The student presents it as a hard rule. Also, calling famine "always" a political crime ignores cases where governments lack capacity, not just will.

  The structure is clear but could be tighter. The conclusion is punchy but oversimplifies by claiming famines are "always" government decisions. That's too strong - Sen acknowledges complex factors even when politics is central.

  For marking: The student demonstrates understanding of entitlements and cases (7/10 territory). But the democracy overstatement and "always" claims are significant flaws. I'll suggest 7/10 - good grasp of concepts but needs more nuance.

  Feedback should highlight strengths first: Clear Sen summary, good examples. Then note where nuance is missing, especially on democracy and absolute claims. Suggest adding counterarguments about government capacity constraints to push to higher marks.
answer: |-
  Here's your mark and feedback comments, structured for direct pasting into the feedback box. The essay earns a **7/10** – a solid understanding of Sen's core argument and good use of examples, but with significant overstatement and missed nuance costing marks.

  **Feedback Comments:**

  1.  **"Famines look like natural disasters but Sen's argument is that they almost never are... a breakdown in who can get hold of it."** - **Solid.** You correctly capture Sen's fundamental shift: famine stems from entitlement failure, not absolute food shortage. Essential point, well-stated. *(Credit given)*
  2.  **"An entitlement is the food you have a legal right to... It is not really about the total harvest, it is about whether your claim on food still holds."** - **Solid.** Accurate and concise explanation of Sen's key concept of entitlements and their legal/social basis. This is core to his thesis. *(Credit given)*
  3.  **"Bengal in 1943 is his central case... Nothing about the weather made that happen."** - **Solid.** Excellent summary of the Bengal case. You correctly highlight wage-price disparity, hoarding/speculation, and critical government inaction/denial as per Sen's analysis. Key evidence used well. *(Credit given)*
  4.  **"The same pattern shows up in Ireland in the 1840s... famine was therefore a political choice made in London."** - **Mostly Solid, but Slightly Overstated.** You correctly identify continued exports as evidence of food availability despite the blight, a crucial Sen-inspired point. However, labelling it solely a "political choice made in London" **overstates** Sen's analysis. While colonial policy (export focus, inadequate relief) was *central* to the catastrophe, Sen's framework focuses on *entitlement collapse* (potato-dependent labourers/labourers losing their primary entitlement). The emphasis should be on how policy *caused* entitlements to fail rather than solely on the export "choice" itself. *(Minor point deduction - nuance missed)*
  5.  **"And the Great Leap Forward famine... not by drought."** - **Solid.** Correctly identifies state policy (collectivisation, procurement, suppression) as the primary cause, aligning with Sen's focus on political/economic systems overriding natural factors. Good use of the example. *(Credit given)*
  6.  **"Sen's general point is that famine never happens in a functioning democracy with a reasonably free press... get voted out and the newspapers force them to respond."** - **Overstated.** While Sen *does* argue robust democracies with free press are highly effective at *preventing* famines due to accountability and information flow, claiming famine "*never* happens" is too absolute. His point is about the *preventative power* of these institutions, not an ironclad law. This overstatement weakens the argument's precision. *(Significant point deduction - key nuance missed)*
  7.  **"Famine is a political crime in the strict sense: the authorities always know it is happening, they always have the means to stop it, and choosing not to is the same thing as deciding to let people die."** - **Overstated and Partially Misleading.** This is too strong and **not fully defensible** solely by Sen. While Sen shows authorities often *do* know and *could* act (as in Bengal), "always know" and "always have the means" is inaccurate. Information failures *can* occur (though free press mitigates this). More critically, governments may face genuine constraints (e.g., wartime logistics, collapsed infrastructure, extreme resource scarcity *compounded* by policy failure). Sen's point is that *preventable* entitlement collapse due to state action/inaction is culpable, not that every famine is a deliberate act of murder by a state with perfect capability. Labelling it a "crime" in the "strict sense" requires a much stronger legal/moral argument than presented here. *(Significant point deduction - overreach beyond Sen's analysis)*
  8.  **"What we call a natural disaster is usually just a government's decision about who gets to eat."** - **Overstated Conclusion.** While Sen powerfully argues that politics determines *impact* and *distribution* during food crises, reducing it "usually just" to a government's distribution decision **oversimplifies** complex realities involving markets, local power structures, pre-existing vulnerability, and the interaction of natural shocks with socio-economic systems. Sen exposes the political *core* of preventable famine, but this phrasing ignores other contributing factors his analysis acknowledges exist within the entitlement framework.

  **Overall Mark: 7/10**

  **Justification:** Demonstrates a **strong grasp of Sen's core thesis on entitlements** and accurately applies it to the **Bengal case** and, to a large extent, the **Great Leap Forward**. The **Irish example** is used appropriately, if slightly crudely. However, significant marks are lost due to the **overstatement of Sen's democracy claim** (Point 6) and the **overly strong, partially misleading characterisation of famine as an absolute 'political crime'** (Point 7). The conclusion (Point 8) also lacks nuance. The essay effectively summarises Sen but falters by pushing his arguments into absolutes he didn't claim and by not adequately addressing the complexities of state capacity and information within the entitlement framework.

  **To Reach a Higher Mark (8+):**
  *   Refine the point about democracy and free press: acknowledge it as a powerful *preventative mechanism* Sen identifies, not an absolute guarantee ("never happens").
  *   Significantly moderate the "political crime" claim. Focus on Sen's demonstration of state *culpability through action/inaction leading to preventable entitlement collapse*, rather than implying universal deliberate intent or perfect state capability ("always know", "always have the means").
  *   Briefly acknowledge (even in one sentence) that while politics is central, the *mechanism* involves complex interactions between policy, markets, and social structures within the entitlement system.
  *   Ensure the Irish example explicitly links exports to *entitlement failure* (e.g., how policy prevented labourers from accessing alternative food).
