answer: |-
  Here are six questions, ordered by estimated difficulty, with follow-ups targeting likely replies:

  1.  **Hardest: Necessity of Identity**  
      If counterpart theory avoids cross-world identity, how can it validate "∀x∀y(x=y → □x=y)" without either (a) reintroducing identity across worlds or (b) making the necessity trivial (e.g., true only because counterparts share the *name* 'x' within a world)?  
      *Likely Reply & Follow-up:* If she argues it holds because counterparts of x and y within any world must be identical *in that world*... Doesn't this simply *presuppose* the necessity of identity within a single world, failing to genuinely ground the *cross-world* necessity claim using only counterpart relations?

  2.  **Accidental Intrinsics**  
      If your formalism dissolves the problem of accidental intrinsics merely by stipulating that an individual’s intrinsic properties vary only across worlds (via counterparts), doesn’t this neutrality *itself* constitute a substantive claim about how properties are world-bound, rather than a purely neutral translation?  
      *Likely Reply & Follow-up:* If she insists the formalism itself imposes no metaphysical binding, only representing the data... Doesn't this leave the *modal profile* of the actual object (e.g., *its* potential for having different intrinsics) unexplained by the formalism, merely represented?

  3.  **Rivalry Dissolved?**  
      If counterpart theory is just a neutral formalism for translating modal claims and transworld identity is a distinct substantive metaphysical thesis, in what meaningful sense are they still rival *views* rather than just different tools or descriptions?  
      *Likely Reply & Follow-up:* If she argues they offer incompatible *analyses* of de re modality... Without a metaphysical commitment, isn't this just a disagreement about semantic bookkeeping, not a substantive metaphysical disagreement about what makes modal claims true?

  4.  **Context-Sensitivity Limits**  
      Given your context-sensitive similarity standards for counterpart relations, are there any de re modal claims that your theory can definitively rule out as *false* (not merely indeterminate), or does the potential for a context where *some* counterpart satisfies any given description render all de re possibilities true under some interpretation?  
      *Likely Reply & Follow-up:* If she argues constraints come from stable context or meaning... Without metaphysical anchors for similarity, what prevents a sufficiently eccentric context from making *any* claim about what I could have done come out true (e.g., I could have been a tuna)?

  5.  **Multiple Counterparts & Indeterminacy**  
      When multiple equally close counterparts exist within a single world for an individual *a*, your theory entails indeterminacy for de re claims about *a* concerning properties not shared by all counterparts. Doesn't this indeterminacy conflict with the apparent determinacy of many ordinary modal judgments (e.g., "I could have been a doctor" seems determinately true/false for me)?  
      *Likely Reply & Follow-up:* If she embraces this indeterminacy as reflecting reality or semantic vagueness... Doesn't this force us to abandon the pre-theoretic intuition that many de re modal claims *are* straightforwardly true or false, suggesting the theory fails to capture a core aspect of our modal discourse?

  6.  **"The Wrong Question" (Humphrey Objection)**  
      If your theory translates "Humphrey might have won" as "A counterpart of Humphrey wins," how does this avoid the charge that it answers the wrong question – telling us something true about a *different* individual, not about what *Humphrey himself* might have done?  
      *Likely Reply & Follow-up:* If she argues that *de re* modality just *is* about counterparts by definition in this framework... Doesn't this semantic ascent merely stipulate away the very intuition driving the objection – that we care about *this* individual's potential – rather than genuinely addressing it?

