prompt: |-
  So — I'm the faculty member on our university's AI systems review panel. Six of us: three philosophers, two from IT governance, one lawyer. We do exactly one thing. Every system the administration wants to deploy gets stamped either TOOL or AGENT. The AGENT stamp means it has to have a named human principal who's accountable for it, a tested off-switch, and a hard cap on how much money or energy it can commit between reviews. TOOL means none of that. It sounds trivial right up until you notice that nobody on the panel agrees about what the word means and we've mostly been deciding cases by vibes and then rationalizing afterwards.

  Track record so far, all six unanimous, for what that's worth:

  1. Room scheduler. Constraint solver, runs once a term, produces a draft timetable; the registrar reads it and clicks approve before anything is published. → TOOL
  2. Endowment execution algo. Adaptive — it revises its own order-slicing strategy during the day based on realized market impact. Places binding orders, no per-order approval, just aggregate risk limits. → AGENT
  3. Student advising chatbot. Frozen weights, generates text, can't touch a single university system, a human reads everything it produces. → TOOL
  4. Microgrid controller. RL, keeps updating in deployment from realized prices, bids into the wholesale power market and dispatches batteries. The developers admit it sometimes does things they didn't anticipate. Interrupting it mid-cycle can damage equipment, so there's no clean pause. → AGENT
  5. Payroll. Fully deterministic and auditable, stages every transfer, but nothing leaves the building until a human controller signs off on the cycle. → TOOL
  6. Admissions screener. Statistical model, frozen for the cycle, scores applicants; a human commitee makes every actual decision, and we noted on the record that you could swap in a different scorer without changing who decides. → TOOL

  Now the new one. It comes up for a vote Thursday and it's a mess.

  A deterministic bid advisor for the same power desk. Hand-written optimization, no learning whatsoever — the developers actually supplied an argument that it does exactly what the spec says and nothing more. It emits a recommended bid every five minutes into a queue. It never touches the market itself. But sitting on the other end of that queue is a relay, a dumb forwarder with no discretion at all, itself classified TOOL years ago under something like the payroll precedent, which submits whatever lands in the queue to the wholesale market automatically. Nobody reads the recommendation before it goes out; a human reads the log the next morning. And obviously bids that clear are binding, and the other side of that market is full of people who adapt to us.

  So neither component is an AGENT by anything we have ever said, and yet the pair does, causally, exactly what the microgrid controller does, minus the unpredictability. I've started calling this the composite problem and I want your read before Thursday.

  What I want from you:

  (a) Which criteria actually survive the six precedents? Panel members have variously muttered "does it act in the world without a human approving each act," "is it still changing after deployment," "does it transact against other agents who adapt to it," and "does it have ends of its own that could come apart from ours." I'm fairly confident at least one of those four is already dead on the existing record — tell me which, and which precedent killed it, and whether any of them can be patched into something that survives.

  (b) For each criterion that does survive, what does it say about Thursday's case? My suspicion is they split down the middle.

  (c) What should we vote if we care about being consistent with ourselves rather than with our intuitions about this particular machine? Name the closest analog among the six and be honest about where the analogy breaks.

  (d) What principle are we adopting with each possible vote? My worry: TOOL commits us to scoring components one at a time, which means anyone who wants to dodge the AGENT label just splits their system into an advisor and a relay. But AGENT invites the reductio that the thermostat down the hall is an agent too, since it also closes a circuit nobody approves each time. I'd like that reductio actually answered, not waved at — including whether "the panel labels systems, not architectures" is a real principle or just a way of not answering.

  (e) If the record genuinely underdetermines it, say so plainly, and then tell me the two cheapest further cases we should queue up next: one that would seperate the surviving criteria on the AGENT side from each other, and one that would seperate the surviving criteria on the TOOL side from each other.

  Please be explicit about how confident you are in the prediction you land on, and single out the one step in your reasoning you're least sure of — I would much rather know where you're guessing than get a smooth writeup. And whatever else you do, make the very last line exactly one of these two, so I can drop it straight into the minutes:

  Verdict: TOOL

  Verdict: AGENT
reasoning: |-
  Okay, let me try to unpack this user's problem. They're part of a university panel classifying AI systems as either TOOL or AGENT, and they've hit a tricky case with a bid advisor-relay combo. The user wants a structured analysis based on their six precedents, plus answers to five specific questions. 

  First, I need to extract the core principles from their unanimous decisions. Looking at the cases: 

  Room scheduler is TOOL because humans approve the output. Endowment algo is AGENT because it acts autonomously with real-world impact. Chatbot is TOOL due to frozen weights and human review. Microgrid controller is AGENT despite no clean pause because it learns and acts. Payroll is TOOL with human sign-off. Admissions screener is TOOL because humans make final decisions. 

  The key pattern seems to be: if a human approves each action → TOOL. If it acts autonomously with binding consequences → AGENT. "Adapts after deployment" isn't consistent (endowment algo adapts but payroll doesn't - yet both decisions make sense under the approval framework). 

  Now for the new case: the bid advisor itself is deterministic and reviewed next-day, but paired with a dumb relay that executes bids automatically. Neither component alone qualifies as AGENT per precedents, but together they function like the microgrid controller (which was AGENT). 

  For (a), criteria that survive: 
  - "Human approves each act" holds (killed by endowment algo where no per-order approval exists). 
  - "Transacts against adapting agents" is secondary but present in endowment/microgrid cases. 
  Others die: "Changes after deployment" killed by endowment algo (adaptive but still AGENT) vs payroll (deterministic TOOL); "Own ends" is too vague. 

  For (b) on Thursday's case: 
  - No per-action approval → leans AGENT 
  - But next-day review exists → weak TOOL argument 
  Closest analog is microgrid controller (AGENT) but without learning. 

  For (c) consistency vote: Microgrid controller is the closest match. Difference: no unpredictability here, but that wasn't the deciding factor (payroll is predictable but TOOL due to approvals). The lack of per-action human intervention is the critical similarity. 

  For (d) principles: 
  Voting TOOL commits to component-level assessment, creating a loophole (split systems). Voting AGENT avoids that but risks overextension (thermostats). The distinction is scale/consequence - thermostats don't transact with adapting agents in consequential ways like financial systems do. 

  For (e) if undetermined: 
  - Test case for AGENT side: A frozen chatbot with auto-execute (no human review) 
  - Test case for TOOL side: Room scheduler with immediate auto-publish (no draft approval) 

  Least confident point: Whether next-day review is sufficient to count as "approval" given binding bids execute immediately. Precedents suggest it's not (endowment algo had no per-action review either). 

  Final verdict should be AGENT for consistency, with the relay being part of the operational system despite separate classification history.
answer: |-
  Here's a systematic breakdown of your query, grounded in your precedents and designed for panel deliberation. Confidence levels are noted throughout, with the least certain step highlighted.

  ### (a) Criteria Surviving Precedents
  **Surviving Criteria:**  
  1. **"Does it act in the world without human approval per act?"**  
     - **Status:** Alive and dominant.  
     - **Killed Criteria:**  
       - *"Is it still changing after deployment?"* → Killed by **#2 (Endowment Algo)**. It adapts but is AGENT, while **#3 (Chatbot)** is frozen but TOOL.  
       - *"Does it have ends of its own?"* → Killed by **#4 (Microgrid)**. Its unpredictability didn’t define agency; lack of per-act approval did.  
       - *"Does it transact against adapting agents?"* → Weakens under **#1 (Room Scheduler)**. Humans adapt to timetables, but per-act approval made it TOOL.  
     - **Patch Potential:** "Transacts against adapting agents" *could* survive as a secondary factor if paired with *lack of per-act approval* (e.g., **#2** and **#4** both involve adaptive counterparts).  

  2. **Minimal Secondary Criterion:**  
     - **"Does it autonomously commit resources/obligations?"**  
     - Seen in **#2** (binds $), **#4** (binds energy/money), **#6** (explicitly *doesn’t* commit).  

  ### (b) Thursday’s Case: Bid Advisor + Relay  
  - **"Acts without per-act approval?"** → **YES**. No human sees bids before execution (unlike **#1, #3, #5, #6**). The relay’s automation is integral.  
  - **"Commits resources?"** → **YES**. Binding bids clear markets, like **#2**/**#4** (unlike payroll’s staged transfers).  
  - **"Transacts against adapting agents?"** → **YES** (market participants adapt, as in **#4**).  
  - **"Changes after deployment?"** → **NO** (deterministic; unlike **#2**/**#4**).  
  - **Surviving Criteria Split:**  
    - Pro-AGENT: Lack of per-act approval + resource commitment.  
    - Pro-TOOL: Deterministic, no learning, componentized design.  
    **→ Leans AGENT (70% confidence)**.  

  ### (c) Consistent Vote & Closest Analog  
  - **Vote for Consistency:** **AGENT** (aligns with **#4 Microgrid Controller**).  
  - **Analog:** **#4 (Microgrid Controller)**. Both:  
    - Autonomously commit $/energy in adaptive markets.  
    - Lack per-act human approval (next-day review ≠ approval).  
  - **Analogy Breaks:**  
    - Microgrid learns; bid advisor is deterministic.  
    - Microgrid is monolithic; bid advisor is composite.  
    **→ Key similarity (autonomy in binding acts) outweighs differences.**  

  ### (d) Principles Adopted per Vote  
  - **Vote TOOL:**  
    - *Principle:* "Systems are assessed as isolated components."  
    - *Risk:* Incentivizes "composite problem" loopholes (e.g., splitting any agent into advisor + dumb relay).  
    - *Reductio (Thermostat):* TOOL vote *would* classify thermostats as AGENT if assessed as a system (thermostat + HVAC relay). **Solution:** Adopt a consequence scale threshold (e.g., "binding commitments above $X or systemic risk"). Thermostats lack market-scale impact.  

  - **Vote AGENT:**  
    - *Principle:* "Systems are assessed holistically based on net causal effects."  
    - *Risk:* Over-inclusion (thermostats). **Answer:** Reject reductio via:  
      - (i) **Consequence threshold** (trivial impacts ≠ agency),  
      - (ii) **Intentionality**: Thermostats lack goal-directedness (*survives precedents; see #3/#5*).  
    - *Reductio Fix:* "Panel labels *systems* (not architectures) for consequential, adaptive, goal-directed acts."  

  ### (e) Undetermination & Next Test Cases  
  - **Current Record:** **Underdetermines composite systems** (50% confidence — precedents ignore component interactions).  
  - **Next Cases to Queue:**  
    1. **AGENT-Side Separator:** *"Frozen chatbot + auto-execute relay."*  
       - Identical to **#3 (Chatbot)** but with immediate execution (no human read-before). Tests if lack of per-act approval alone suffices for AGENT.  
    2. **TOOL-Side Separator:** *"Room scheduler with auto-publish."*  
       - Identical to **#1** but no registrar click. Tests if predictability/permanence overrides autonomy.  

  ---  
  **Least Confident Step:** Assessing whether "next-day log review" constitutes retroactive approval. Precedents (**#2, #4**) imply post-hoc review ≠ approval, but **#5 (Payroll)** shows staged approval matters. *This is the hinge for Thursday.*  

  **Final Verdict:** Based on autonomy in binding acts (per **#2, #4**) outweighing componentization, and rejecting the loophole:  
  Verdict: AGENT
