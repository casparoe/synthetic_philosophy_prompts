answer: |-
  ### (1) What kind of problem this is
  Your situation is a classic case of **institutionalization vs. radical purpose**. It belongs to debates about how organizations created to challenge power inevitably develop hierarchies, suppress dissent, and prioritize self-preservation over their original goals—a tension observed in revolutionary parties, social movements, and utopian communities throughout history. At its core, this is a problem of **means corrupting ends**: the structures you built to gain political effectiveness (formal membership, leadership, discipline) now systematically distort your purpose. Your observations—campaigns chosen for recruitment over impact, expulsion of dissenters, your own fading intellectual independence—signal that the organization’s survival has become an end in itself. This dynamic transcends individual failures; it is a structural conflict between **efficacy** and **integrity**.

  ---

  ### (2) The ordinary-cost view
  Your colleague articulates the **realist position**: organizations require stability to function, and this necessitates trade-offs. As groups grow beyond small, informal circles (like your journal phase), they face coordination problems. Robert Michels observed that complex goals demand division of labor, leading to professional staff and leaders who develop expertise—and a vested interest in the organization’s survival. Mancur Olson’s logic of collective action shows that without selective incentives (like membership discipline or shared identity), large groups struggle to mobilize resources. What you describe—prioritizing recruitment campaigns or suppressing public dissent—reflects the need to maintain cohesion and resources against competitors. Evidence from party studies (e.g., Kirchheimer’s "catch-all" parties) confirms that mature parties often prioritize growth and electoral viability over ideological purity. Your colleague would argue that your ordinance success was a low-stakes fluke of small-group dynamics, unsustainable for systemic change. The ordinary-cost view absorbs nearly all your observations: discipline clauses prevent fragmentation; "winnable" campaigns may be resource-sinks if they don’t build capacity; your conformity is adaptive leadership in a collective endeavor. The cost? Accepting that organizations, like tools, wear down with use—but remain indispensable for impact.

  ---

  ### (3) The defect-in-the-form view
  Your departed friend invokes a **critical tradition arguing that formal party structures inherently reproduce the pathologies they oppose**. This view draws from Michels’ "iron law of oligarchy": any large organization concentrates power in a leadership class whose interests diverge from the base, prioritizing control and growth. For Rosa Luxemburg, this bureaucratization stifles the spontaneous, critical engagement essential for true emancipation. Hannah Arendt warned that revolutionary institutions often mirror the rigid hierarchies they overthrow because they inherit the same instrumental logic of power.  
  **Why the resemblance is systematic**: The party form—with its platforms, membership rolls, and electoral aims—demands discipline to project unity to voters and donors. This necessitates suppressing internal dissent (the expelled columnist), manufacturing consent (your self-censorship), and chasing symbolic victories that boost visibility but avoid risky, transformative action (the recruitment-focused campaigns). The bylaw clause you helped draft is a *structural necessity* for this model, not an aberration; it enforces the unity the party requires to compete.  
  **The journal phase’s success**: Your friend would argue the ordinance emerged *because* your early group was a **prefigurative space**—it embodied the open, non-hierarchical, idea-driven politics you aspired to. Without the pressures of electoral competition or institutional maintenance, creativity and principle could flourish. The moment you adopted the party form, you activated its inherent logic: self-preservation displaces purpose, tactics corrupt principles, and leaders (even reluctant ones) become gatekeepers. Your changed mindset—anticipating consensus rather than forming independent judgments—is not burnout but **adaptive alienation**, where the structure rewards conformity over conviction.

  ---

  ### (4) Where the two come apart
  The theories diverge on **predictions and explanations for irreversible shifts**:  
  - **The ordinance**: The ordinary-cost view sees it as beginner’s luck in a low-capacity phase. The defect-in-form view sees it as proof that *structure enables certain actions while disabling others*; the journal form facilitated organic collaboration, the party form stifles it.  
  - **Expulsion and self-censorship**: Realists see these as regrettable but necessary for cohesion. Critics see them as *systematic outcomes* of the party structure—evidence that the form *requires* silencing dissent to function.  
  - **Critical test**: If the party *voluntarily* abandoned a high-recruitment opportunity to pursue a risky, high-impact action aligned with its principles (e.g., backing an unpopular strike despite electoral costs), the ordinary-cost view would be challenged. If it consistently chooses growth over principle—especially when leaders *personally* dissent—the defect-in-form view gains strength. The ordinary-cost view *can* explain all your observations, but only by normalizing them as inevitable, rendering it unfalsifiable. The defect-in-form view predicts these outcomes as *necessary consequences of the structure itself*, not contingent failures.

  ---

  ### (5) The three options  
  **(a) Reform from within**: If the defect is truly in the form, this is palliative at best. Abolishing the support clause might slow disciplinary excesses but won’t halt the drift toward oligarchy. Recording "recruitment-first" decisions risks becoming performative—leaders will justify them as "strategic necessity." Reforms may succeed temporarily if backed by a mobilized base (as in some grassroots unions), but your conformity suggests internal resistance is neutered.  
  **(b) Work as an independent**: This escapes structural corruption but risks irrelevance. Policy work without organizational leverage often influences discourse but rarely implementation. Yet for thinkers like Albert Hirschman, "exit" can preserve integrity when "voice" is futile, and independent actors *can* shift debates (e.g., influential critics like Chomsky). It’s a real alternative if you value intellectual freedom over direct efficacy.  
  **(c) Propose dissolution**: This confronts the root issue: rejecting the party form as inherently corrosive. While likely to fail, it’s not merely a gesture. It forces the organization to confront its contradictions publicly—echoing Debord’s argument that radical critique must sometimes "be lived" to be credible. If even a minority agrees, it could seed a new prefigurative space. Historically, such proposals (e.g., the dissolution of vanguardist groups) rarely succeed but often catalyze reflection.

  ---

  ### (6) My recommendation  
  Pursue **(c)**, then **(b)**. Propose dissolution: frame it as reclaiming your founding ethos, citing the ordinance as proof that impact need not require bureaucracy. Expect resistance—accusations of naivety, disloyalty, or purism. If rejected (as likely), exit publicly, writing a manifesto explaining why the party form betrays its goals. Shift to independent policy work, leveraging your platform committee experience. Within two years, evidence that you were wrong would include: your party scaling principled wins (e.g., passing impactful housing laws *without* sacrificing internal democracy), or your independent work failing to gain traction while the party thrives. Evidence you were right: further centralization (e.g., expulsions over policy critiques), more campaigns prioritizing recruitment over justice, or your former colleagues privately conceding the organization is "beyond salvage." The cost is lost influence and community—but it honors the clarity your friend provoked.
