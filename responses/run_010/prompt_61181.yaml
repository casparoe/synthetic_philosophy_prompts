answer: |-
  ## The Memory Keepers

  The alarm didn’t wake Imogen Finch. The ping from the Chamber Seating Allocation feed did. Bleary-eyed in her Clapham flat, she scanned the list scrolling on her tablet. Five hundred names, whittled down to four hundred after the usual refusals and medical exemptions. The new House of Commons, drawn by lot. Her stomach, already churning from last night’s cheap Chianti, tightened further.

  *Not good.* Not for her client, the National Infrastructure Body (NIB). Not for her.

  The office in a converted warehouse near Peckham Rye was already buzzing with a low-grade panic when she arrived, clutching a scalding Pret filter coffee. Screens glowed, displaying heat maps of the new Chamber demographics – age clusters, borough distributions, former occupations. Phones chirruped incessantly.

  “Finch! My office. Now.” Gareth Croft’s voice, gravelly and perpetually strained, cut through the hum. He was Senior Partner, a relic from the pre-Sortition days when lobbying meant cultivating relationships over decades. Now it was all rapid-response firefighting.

  She dumped her bag and hurried in. Croft looked like he hadn’t slept. “The NIB portfolio,” he barked, jabbing a finger at his own screen. “Initial sentiment analysis. Running hostile. *Deeply* hostile.”

  Imogen leaned in. The algorithm had parsed publicly available social media snippets, forum posts, local news comments – anything the new chamber members had left online before their summons. Colour-coded bars pulsed red beside key NIB projects: the Severn Barrage expansion, the Northern Power Grid upgrade, the London orbital waste processing facility. Opposition wasn’t just present; it looked coordinated. Pre-loaded, as they said.

  “But… why?” Imogen frowned. “The Barrage provides clean energy, the Grid upgrade prevents brownouts, the orbital facility solves the landfill crisis. These are objectively *good* things. We had decent traction last year.”

  “Last year’s lot liked concrete and progress,” Croft grumbled, rubbing his temples. “This year? Looks like they’ve drawn every eco-warrior, nimby, and techno-sceptic south of Carlisle. Sentiment’s shifted. Massively. Against large-scale infrastructure *entirely*. Your job, Finch: find the pressure points, identify the swing voices, and get the NIB’s core projects onto the legislative agenda before this mob buries them. Starting with the Environment & Infrastructure Committee hearings this afternoon. They’re reviewing the Barrage.”

  “This afternoon? That’s insane! We haven’t even got proper profiles!” Imogen protested. The sheer speed of the Sortition cycle was brutal. Twelve months to understand, persuade, and pass legislation before the entire chamber dissolved, its institutional memory vanishing like smoke. Only places like Croft & Sterling kept the records, the only continuity in the system.

  “Insane is our baseline,” Croft sighed. “Get down to the Archive. Dig. Find me something I can brief the NIB CEO with before he has a coronary. And Finch? Try not to look like a sacrificial lamb in committee.”

  ***

  The Archive wasn’t dusty. It was clinically cold and hummed with server stacks. Banks of terminals faced wallscreens displaying swirling visualisations of past chambers – shifting constellations of dots representing members, colour-coded by voting patterns, committee memberships, inferred priorities. Miles, the taciturn Archivist, nodded her towards a terminal.

  “Chamber 2043,” Imogen requested. “Environment & Infrastructure Committee composition. Cross-reference with sentiment on major infrastructure projects, specifically the Severn Barrage predecessors.”

  Data flowed. Names, faces, boroughs, former jobs (carpenter, teacher, NHS administrator, retired banker), snippets of public commentary. The hostile sentiment was stark. She pulled back, comparing to Chamber 2042. Different names, different faces, but significantly more open to large projects. Chamber 2041? Even more favourable. A trend emerged, subtle but undeniable: a gradual hardening against centralised, state-driven infrastructure over the past five or six chambers.

  “Miles,” Imogen called out, “Can you overlay demographic shifts? Say, borough weighting over the last decade?”

  Miles tapped at his console. The borough distribution map shimmered. Inner London boroughs seemed… brighter? More densely packed with dots representing members. Outer boroughs and commuter towns paled slightly. Rural areas flickered inconsistently.

  “Sampling frame tweaks,” Miles murmured, not looking up from his own screen. “Boundary Commission adjustments. Happens.”

  Imogen frowned. The sampling frame – the master list from which the 500 were randomly selected – was sacred. Or supposed to be. Adjusted periodically for population shifts by an independent commission, ensuring everyone had an equal statistical chance. *Equal*. But the data felt… skewed. The hostility felt concentrated, specific.

  She drilled down into the committee list for this afternoon. Mrs. Anya Sharma, former community gardener, Peckham. Vocal opponent of ‘concreting over green spaces’. Mr. David Chen, ex-IT security, Walthamstow. Forum posts lamenting ‘techno-utopian nonsense’. Dr. Evelyn Booth, retired GP, Richmond. Letters to local papers decrying ‘health risks of massive engineering’. It read like a hit list.

  Frantically, she searched the Archive for any precedent, any similar cluster of opposition they’d navigated before. The records were exhaustive – voting histories (where public), committee transcripts, media mentions, even inferred alliances based on co-sponsorship of minor motions. Croft & Sterling’s edge was this depth. But the patterns she sought were buried beneath layers of individual data points. The *why* of this chamber’s pre-loaded hostility remained opaque. It felt systemic, ingrained in the selection itself, not just the individuals.

  ***

  The Portcullis House committee room felt alien. The wood panelling was the same, the microphones, the raised dais for the members. But the faces were new. Not politicians. People. A woman nervously adjusting a headscarf, a man in a slightly-too-tight suit, another doodling intently. And their eyes, as the NIB CEO droned on about tidal energy yields and flood defence co-benefits, held not curiosity, but suspicion, impatience, even disdain.

  Imogen sat behind the CEO, feeding him prompt cards, her heart hammering. She’d identified three potential ‘soft’ members based on flimsy archive profiles. She nudged him towards them.

  “Mr. Chairman,” the CEO tried, shifting focus to a quiet man from Bromley, a former librarian. “Perhaps Mr. Achebe could comment on the local consultation aspects? We’ve learned much from past projects…”

  Mr. Achebe blinked owlishly. “Consultation? You mean after the big machines have already been decided?” His voice was mild, but the implication hung heavy. Mrs. Sharma snorted softly.

  Dr. Booth leaned forward. “CEO, these ‘co-benefits’. Flood defences sound admirable. But the sheer scale of this concrete monolith… the disruption to marine ecosystems… the *visual blight*. Have your environmental impact assessments adequately quantified the loss of natural beauty? The *soul* cost?”

  It wasn’t a debate. It was an inquisition. The hostility wasn’t just online sentiment; it was visceral, sitting across the table. The CEO floundered. Imogen’s carefully prepared arguments about energy security and jobs evaporated in the face of fundamental opposition to the project’s very nature. The chamber wasn’t just sceptical; it felt ideologically primed against them.

  After the car crash adjournment, Imogen fled to the echoing atrium. Leaning against cool stone, she lit a cigarette (a filthy habit Gareth despised), her hand trembling. Across the space, she saw Aris Thorne, sleek and unruffled in a Savile Row suit. Thorne lobbied for GreenScape UK, a consortium favouring hyper-local, micro-generation solutions – solar panels on every shed, mini-turbines in every beck. The *antithesis* of the NIB’s centralised vision. And he was smiling, exchanging pleasantries with Dr. Booth.

  Catching Imogen’s eye, Thorne sauntered over, the scent of expensive cologne cutting through her smoke. “Rough session, Finch. Tough draw this year.”

  “What do you know, Aris?” Imogen asked flatly.

  “Know? Just that the public mood is shifting. People want control, localism. Not vast schemes imposed from Whitehall.” He gestured vaguely upwards. “The *Zeitgeist*.”

  “This feels… targeted,” Imogen pressed, watching him closely.

  Thorne’s smile widened, just a fraction. “Random selection, Finch. Beautiful, isn’t it? Truly representative. Captures the evolving public consciousness.” He paused, flicking invisible lint from his sleeve. “Of course, ensuring the sampling frame *accurately reflects* that evolving consciousness… that’s where the real rigour lies. Keeping the strata weights properly tuned. Takes deep… *institutional memory*.” He met her gaze, his eyes devoid of warmth. “Something my firm takes very seriously. Good luck with the Barrage. Or rather, what’s left of it.” He gave a mock salute and walked away.

  *Strata weights.* The words echoed in the vast space. The sampling frame was divided into strata – geographic, demographic – to ensure representation. The *weights* determined how many were drawn from each stratum. Tuned. *Tuned for a decade?*

  Imogen’s cigarette tip glowed fiercely as the pieces crashed into place. The gradual demographic shift in the chamber Miles had shown her – the tilt towards inner-city boroughs, often denser, younger, potentially more sceptical of large-scale industrial projects. The hardening opposition trend perfectly dovetailing with GreenScape’s rise. It wasn’t just capturing the *Zeitgeist*. Firms like Thorne’s – like *Croft & Sterling* – with their vast archives, were the only entities tracking the long-term consequences of each chamber’s decisions, the subtle shifts in public sentiment revealed by twelve-month snapshots. They could see the levers.

  And the levers included the supposedly independent Boundary Commission. Not overt corruption, perhaps. Just… expert submissions. Detailed analyses of population density shifts, ‘community cohesion’ metrics, ‘engagement potential’. Analyses informed by, and subtly shaping, the weightings in the sampling frame. A nudge here, a tweak there, year after year, favouring certain postcodes, certain demographics statistically more likely to hold specific views. Views that just happened to align with clients who paid for deep archival insight and ‘strategic guidance’.

  Croft & Sterling held the memories. They tracked the outcomes. They advised clients based on projected chamber compositions. And somewhere, in quiet submissions and complex statistical models, they – she – helped *design* the randomness. The hostility Imogen faced today wasn’t bad luck. It was a product she’d helped manufacture, brick by invisible brick, in the Archive’s cold light. Her job wasn’t persuasion. It was damage limitation on a disaster her own firm had architected.

  The cigarette tasted like ash. She stubbed it out, the brief flare dying quickly. Across the Thames, the city sprawled, a complex organism now governed by a jury changed annually, its very composition a silent battleground where unelected archivists, armed with decades of data, gently warped the dice. She pulled out her phone, the weight of it suddenly immense. Gareth would be waiting for her briefing on the committee disaster. The NIB CEO would be apoplectic. She needed another coffee, stronger this time. The river below flowed on, grey and indifferent, carrying the effluent of a system running smoothly, precisely, into a future designed by the only people who remembered yesterday. Imogen Finch walked back towards the committee rooms, the polished floors reflecting only the harsh, fluorescent present.
