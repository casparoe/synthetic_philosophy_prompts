prompt: |-
  You are a professional metaphysician specializing in the semantics and ontology of de re modality — in particular the rivalry between counterpart-theoretic and transworld-identity treatments of modal discourse. Reason carefully. Before writing the finished analysis, spend a short brainstorming pass of five to eight bullets generating candidate correspondences and disanalogies, most of which you will discard; include it so I can see what you considered and rejected. Do not cite: no page numbers, no bibliography, no quotations, no invented quotations. If you are unsure how some philosopher's view should be characterized, flag the uncertainty rather than smoothing it over. Assume I already know the standard definitions of counterpart theory, transworld identity, and the Humphrey complaint — do not spend space restating them.

  Context. I am auditing the handout from a graduate seminar on possible-worlds semantics. To introduce counterpart theory, the instructor offered the analogy of a fictional character across screen adaptations: Holmes is played by a different actor in each adaptation; each portrayal is a distinct particular, yet we say without hesitation that Holmes lives in London, that Holmes might have been more sympathetic, that in one adaptation Holmes solves the case and in another he fails. The instructor used the analogy to license two conclusions. First, that the counterpart apparatus is not an exotic revision of our modal thought but a regimentation of something we already do comfortably. Second, that the familiar complaint against counterpart theory — that what comes out true is not about Humphrey himself but about a numerically distinct individual who merely resembles him, so Humphrey gets no comfort from his counterpart's victory — misses its mark, since the parallel complaint in the Holmes case (that was not Holmes, that was an actor) is cheerfully granted by everyone, who then goes on talking about Holmes without embarrassment. A classmate objected that the analogy is worse than useless: if fictional characters are abstract artifacts created by an author and realized in each work that features them, then Holmes is literally the same character across adaptations, so the analogy presupposes transworld identity and begs the question against the very view it is meant to defeat.

  Deliverables, in this order:

  1. A correspondence table mapping source onto target: the canonical original work, the individual adaptation, the particular portrayal within it, the derivation-from-a-source relation, the character as commonly spoken of, and the audience's loose talk — against the actual world, other possible worlds, the individuals in them, the counterpart relation, the subject of de re modal ascriptions, and ordinary modal discourse. Mark every row where the mapping is one-many, many-one, many-many, or simply absent.

  2. The disanalogies, sorted into three bins with a one-line justification each: those that are fatal for the instructor's second conclusion, those that are genuine but do no damage to it, and those that are cosmetic. Do not let the bins be padded; if a bin is nearly empty, say so.

  3. What the source quietly imports that the target lacks. Address at minimum: the existence of a privileged canonical original and an authorial source that fixes the facts; the fact that the relation between portrayals is genealogical and intentional rather than grounded in overall qualitative similarity; the determinacy of who counts as playing the role (settled by authorial, legal, and casting facts) versus the context-sensitivity and vagueness of the counterpart relation; the ontological hierarchy between the real audience and the fictional character; and the fact that an adaptation is deliberately authored, so that "Holmes might have been otherwise" concerns a choice someone made.

  4. An assessment of the classmate's objection. Work through both readings of what a character is — abstract artifact realized in many works versus a role or type whose tokens are the portrayals — and say which reading the analogy requires in order to do the instructor's work. Then say, for each reading, whether the analogy still supports the second conclusion, collapses into a mere illustration, or actively supplies the opponent with a model of transworld identity.

  5. A stress case. Consider a world containing two individuals, each a close counterpart of Humphrey in the respects salient to the context, one of whom wins the election and one of whom loses it badly. Explain what counterpart theory says about the resulting de re claims and why that combination generates the worry that one individual both has and lacks the same modal property in the same sense and context. Then ask the analogy: can a single adaptation contain two portrayals of Holmes such that one succeeds and one fails, and still deliver the intended readings? If the mapping between adaptation and world structurally excludes the case, say what that costs the analogy — specifically, whether it excludes precisely the territory where counterpart theory is most distinctive and most contested.

  6. Your verdict. State explicitly whether the instructor's second conclusion survives once the disanalogies are on the table, and whether the first conclusion can be preserved independently of it. Say whether the analogy was carrying the argument or merely dressing a conclusion reached by other means. Do not resolve the matter by declaring that analogies are pedagogical and cannot bear argumentative weight; that is an admissible last resort, but only after the audit.

  7. A better source, if there is one. Evaluate in particular the perdurantist picture of identity over time — a person as a sum of stages, with claims about the person's past and future made true by other stages — as a substitute analogy, and say what the parallel complaint (that was not him, that was an earlier stage) costs there compared with what the Humphrey complaint costs here. If you conclude that no analogy is adequate, explain what feature of de re modal talk resists analogical transfer.

  Length: roughly 1,200 to 1,600 words. Prefer precision over coverage; cut anything that a competent reader would already know.
