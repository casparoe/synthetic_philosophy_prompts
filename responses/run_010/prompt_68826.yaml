prompt: |-
  I lead a weekly reading group in a philosophy department — mostly people whose physics stopped in high school, plus two who have read popular accounts and will arrive already convinced that the wavefunction is a physical wave. I have fifty minutes, a whiteboard, and no mathematics beyond drawing a two-state system, to teach the distinction between psi-ontic and psi-epistemic views of the quantum state. Plan the session rather than explaining the material to me. I want the order the pieces have to go in and what each depends on; the single running example that should carry the whole thing (I am inclined toward a classical analogue of incomplete knowledge, something like a shuffled deck, before touching a qubit — tell me what such an example must have, what it must lack, and at which point it begins to mislead); the misconceptions the group will form, above all the slide from "epistemic" to "in the mind, therefore subjective," and the exact place in the sequence where each should be headed off; whether the indistinguishability of non-orthogonal states and the no-cloning result belong before or after I state the distinction, since I suspect they are what make the epistemic view attractive rather than merely possible; and where, if anywhere, the Pusey–Barrett–Rudolph theorem belongs, or whether naming it is better than explaining it at this level. Impose one constraint on the design: no double-slit experiment and no Schrödinger's cat, since both make the state look like a thing spread out in space and quietly settle the question I am trying to leave open. Close with one question I can pose at the end that would show the group has grasped the distinction rather than the slogan, and a short list of what I should openly decline to explain at this level. Please write in American English.
reasoning: |-
  Okay, the user is leading a philosophy reading group and needs a 50-minute session plan to explain psi-ontic vs. psi-epistemic views of quantum states without advanced math. They want a clear structure, a central example, and ways to prevent common misconceptions. 

  Hmm, the key challenges are: avoiding physical wave intuitions (since two attendees already believe that), finding a non-misleading classical analogy, and deciding when to introduce key quantum features like indistinguishability. The user specifically banned double-slit and Schrödinger's cat examples because they visually suggest a physical wave—smart constraint.

  First, I need a classical analogy that's epistemic but won't map perfectly to quantum. A coin under a cup is simple: the hidden state (heads/tails) is real, while the "state of knowledge" (50/50 uncertainty) is in the mind. This sets up epistemic=knowledge, not mind-dependence. But I must emphasize this breaks down later—quantum probabilities aren't about hidden variables in the same way.

  The biggest pitfall is the group equating "epistemic" with subjective. I'll tackle that head-on by stressing shared knowledge and intersubjectivity. Also, the coin example must be retired before introducing quantum superposition to avoid false equivalence.

  For quantum, a polarized photon or electron spin works best. Drawing |↑> and |→> on a board shows orthogonal states, while 45° diagonal states reveal non-orthogonality. Here's where indistinguishability matters: if |→> is epistemic, why can't I just peek to distinguish it from diagonal? But quantum won't allow that—leading to the no-cloning theorem as a knockout argument against naive epistemic views. 

  Pusey-Barrett-Rudolph is too technical for 50 minutes. Naming it suffices to show the debate isn't trivial, but details would derail the session. 

  Closing question: "If I measure a qubit prepared diagonally and get |↑>, was it 'secretly' |↑> all along?" Perfect—tests if they grasp ontic states vs. epistemic knowledge. 

  Declarations upfront: no math, no interpretations (Copenhagen etc.), no realism debates. Stay focused! 

  *adjusts mental model* The two physics-pop-savvy attendees need careful handling—their wavefunction literalism could sway others. I'll explicitly contrast "wave in space" with abstract state vectors early on. 

  Timing is tight: 10 min setup, 15 min quantum basics, 15 min epistemic argument and collapse, 10 min implications. Must keep Q&A buffer! 

  *scribbles outline* Start classical, shatter with quantum weirdness, use no-cloning as the epistemic dealbreaker, end with the PBR mic drop. Solid.
answer: |-
  Here’s a focused 50-minute session plan optimized for clarity and avoiding common pitfalls:

  **Session Structure & Timing**  
  1. **Ground Rules (3 min)**  
     - Declare upfront: "Today, we’re not asking *how* quantum mechanics works, but *what the wavefunction represents*. No math beyond arrows on a board. I’ll avoid interpretations (Copenhagen, etc.) and focus solely on the ontology/epistemology split."

  2. **Classical Analogue: The Coin Under a Cup (10 min)**  
     - **Setup:** Draw a cup hiding a coin (Heads/Tails).  
     - **Key points:**  
       - *State of reality:* Actual coin face (H or T).  
       - *State of knowledge:* "50% H, 50% T" describes *ignorance*, not physical indeterminacy.  
     - **What it MUST have:** Probabilities arise from missing information; measuring reveals pre-existing state.  
     - **What it LACKS:** Quantum superposition (the coin isn’t "both H and T").  
     - **When to retire it:** After establishing epistemic = "knowledge-based." Warn: *"Quantum uncertainty isn’t just like this—we’ll see why next."*  

  3. **Quantum Example: The Qubit (15 min)**  
     - **Setup:** Draw a Bloch sphere (simplify to 2D circle). Label orthogonal states |↑⟩ and |→⟩ (e.g., electron spin up/right).  
     - **Key moves:**  
       - Show superposition: |↗⟩ = (|↑⟩ + |→⟩)/√2.  
       - **Indistinguishability demo:**  
         *"If I give you |→⟩ or |↗⟩, can you tell which? No—measurements are probabilistic. This is why some think the wavefunction is like the coin: incomplete knowledge."*  
       - **Contrast with classical coin:**  
         *"With the coin, your uncertainty came from not knowing a definite state. But is |↗⟩ ‘secretly’ |↑⟩ or |→⟩? Or something else?"*  

  4. **The Distinction Introduced (5 min)**  
     - **Psi-ontic:** ψ is physical (like a field). |↗⟩ is a unique state.  
     - **Psi-epistemic:** ψ is knowledge (like the coin probabilities). |↗⟩ = "might be |↑⟩ or |→⟩."  
     - **CRUCIAL INTERVENTION:** Preempt "subjective" slide:  
       *"Epistemic doesn’t mean ‘in your mind.’ It means *any agent* with the same knowledge would assign the same ψ. It’s intersubjective, like saying ‘this coin has 50% H probability’ isn’t opinion—it’s rational given the constraints."*  

  5. **Why Epistemic is Tempting but Problematic (12 min)**  
     - **No-cloning (simple version):**  
       *"Suppose ψ is just knowledge. Can I copy a state to measure it repeatedly?*  
       *In classical physics, yes (e.g., scan the coin). In QM, no—copying would let you distinguish |→⟩ and |↗⟩ by comparing copies. But we can’t, and no-cloning proves it."*  
     - **Punchline:** *"If ψ were knowledge, copying should be possible. Since it’s impossible, ψ can’t just represent ignorance."*  
     - **Pusey-Barrett-Rudolph (Name only!):**  
       *"There’s a theorem (PBR) claiming even a single quantum state can’t be epistemic without contradictions. We won’t dive in, but it shows this isn’t just philosophy—it’s constrained by experiment."*  

  6. **Wrap-up & Closing Question (5 min)**  
     - **Recap:** Ontic ψ = physical entity. Epistemic ψ = best-possible knowledge (but faces no-cloning/PBR issues).  
     - **Closing Question:** *"If I prepare a qubit in |↗⟩ and measure it as |↑⟩, does that mean it was ‘really’ |↑⟩ all along? Why or why not?"*  
       *(Tests grasp: Ontic says no—measurement changed state. Epistemic says yes—it was secretly |↑⟩. But no-cloning challenges this.)*  

  **What to Openly Decline**  
  - *"We’re skipping:*  
    - How measurement works (collapse, decoherence).  
    - Specific interpretations (Many Worlds, Bohmian mechanics).  
    - Realism debates (does quantum reality exist independently?).  
    - Technical proofs (e.g., full PBR theorem).  
    This keeps us focused on ψ’s *status*, not mechanics."  

  **Design Notes**  
  - **Why coin first?** Creates intuition for epistemic views *before* quantum weirdness undermines it. Retire it once superposition is introduced.  
  - **No-cloning after distinction:** It’s the critical argument *against* epistemic views—place it where skepticism is highest.  
  - **Avoiding misconceptions:** Preemptive strike on "subjective" during the epistemic definition. Emphasize intersubjectivity.  
  - **Why no wave-in-space examples:** Superposition in spin avoids spatial spread. Stick to abstract states.  
  - **PBR mention:** Shows epistemic views aren’t "obviously wrong," but don’t get bogged down.  

  **Running Example Flow**  
  Coin (classical epistemic) → Qubit orthogonal states (|↑⟩/|→⟩) → Superposition (|↗⟩) → Indistinguishability → No-cloning knockout → Ontic/epistemic framed around measurement outcome.  

  This sequence forces confrontation with quantum-specific constraints while leveraging familiar probability, then subverting it. The closing question reveals if they see the ontological stakes in measurement.
