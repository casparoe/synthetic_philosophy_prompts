  I'm setting the final for a first-year PhD metaphysics sequence and want one closed-book essay question, answerable in ninety minutes, on whether full grounding can be overdetermined. Please build it around a stipulated case rather than a survey of the debate: let p and q be metaphysically independent atomic facts and D the fact that p ∨ q; assume that full grounding is closed under disjunction introduction, and that it is irreflexive, asymmetric, and transitive. Then {p} and {q} each fully ground D while neither grounds the other. The question must require students to say which of those formal constraints, if any, the case actually violates; what would have to be surrendered in order to rule it out — the closure principle, the uniqueness of a fact's full ground, or the idea that grounding delivers non-redundant metaphysical explanation; and what the case shows about relevance-sensitive treatments of ground.

