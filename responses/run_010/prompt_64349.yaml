answer: |-
  The air in the Maritime Guild’s East Wing Archives tasted of dust and defeat. Silas Thorne traced a line of spidery script with a graphite pencil, its tip worn blunt. *"Adjust bearing for the aetheric current, estimated at 1/3 knot relative South-South-East..."* He hesitated, then drew a firm vertical line in the margin, marking it **S/W** – *Structure/World*. The formula beneath it, complex and trigonometric, was **M/A** – *Math/Apparatus*. It worked. It had guided ships through fog and gale for a century. But the *aetheric current*? Like Fresnel’s ether, a ghost. A load-bearing ghost.

  His desk was an island in a sea of vellum ledgers, brittle charts, and the brass instruments of a dead celestial navigation school. Outside, the rain lashed the grimy windows of the old Guildhall. His assignment: audit the Guild’s entire *Procedural Codex*, line by bloody line, before the new directors pulled funding. Mark which parts reflected **S/W** – enduring structural truths about position, light, refraction, the cosmos itself – and which were **S/C** – *Scaffolding/Convenience*, the obsolete crutches and mistaken ontologies that somehow, bafflingly, produced correct fixes.

  His boss, Master Fenwick, cared only for the bottom line. "Thorne, just give me a ledger that tells the investors which bits of this expensive antique are still *useful*. Like that Fresnel business – ditch the ether, keep the coefficient! Clean." Fenwick didn’t grasp the vertigo. Finding the **S/W** felt like archaeology in quicksand. You only knew the foundation stone *was* a foundation stone when the successor building didn't sink.

  "Thorne. Still drowning?"

  Pell stood in the doorway, impeccably dressed, a faint smile playing on his lips. Rival auditor. Contractor for the ‘Modernisation Committee’.

  "Just… navigating," Silas muttered, pushing his cold coffee aside. The gritty sludge at the bottom mirrored his mood.

  Pell glided in, picking up a sextant with disdainful elegance. "Heard you’ve been busy. Drawing your little lines. **S/W**, **S/C**. Such… certainty."

  "It’s the job, Pell."

  "Is it?" Pell perched on the edge of a teetering stack of tide tables. "Say you mark this…" He plucked a random page from Silas’s ‘reviewed’ pile. *"...compensate for the lunar effluvium distorting the chronometer’s harmonic resonance..."* He chuckled. "**S/C**, obviously. Utter ghost. But the *compensation value* recorded here? It worked. Ships arrived."

  "It worked *then*. Based on a falsehood."

  "Did it?" Pell leaned forward, his voice dropping conspiratorially. "Or did they simply observe, over centuries, that certain adjustments *correlated* with accurate landfall? They called it ‘lunar effluvium’. You’d mark it **S/C**. But what if it was just a placeholder for… an undiagnosed temperature fluctuation in the chronometer springs? Or a subtle tidal effect on the local magnetic field they couldn't measure? The observable result – the correction factor – survives. The *story* behind it is just… furniture. Rearrangeable furniture."

  Silas felt a familiar chill. "The math points. Fresnel’s coefficient pointed *to* something, even if he got the ‘why’ wrong."

  "Pointed?" Pell’s smile widened. "Thorne, think. You have a batch of surviving predictions. Reliable fixes. The **M/A** in your ledger. For *any* such batch, I can *always* invent a new set of relations purely among the observables – positions, times, star sightings, instrument readings – that reproduce those exact predictions. Maybe simpler, maybe more complex. But I don’t *need* your **S/W**. I don’t need deep structure. I just need consistency *among the furniture*."

  It was the argument Silas wrestled with in the grey hours before dawn. Fresnel’s ether was scaffolding. But was his coefficient **S/W**, or just another piece of incredibly well-fitting furniture that happened to survive the demolition? How could he ever know until the next theory arrived… which might simply rearrange the furniture again? The ledger felt suddenly heavy, absurd. A catalogue of ghosts and lucky guesses, pretending to discern bedrock.

  "The investors want to know what’s load-bearing," Silas said weakly.

  Pell shrugged. "Tell them it all is. Or none of it is. Because until the next wave hits, who can say? Your **S/W** today might be tomorrow’s embarrassing **S/C**. Your ledger certifies nothing except the past success of the *entire* apparatus, scaffolding and all." He stood, brushing non-existent dust from his sleeve. "Good luck with the ghosts, Thorne. Try not to let them haunt you too much. Deadline’s Friday, Fenwick says." He glided out as silently as he arrived.

  Silas stared at the page Pell had touched. *Lunar effluvium*. He’d marked it **S/C**. Confidently. Now the word shimmered, mocking him. He picked up his pencil. His hand trembled slightly. Did he change it? To what? **S/W**? Based on what? Pell’s words echoed: *"...always invent a new set of relations..."*

  He looked out at the rain-blurred city. Ships still sailed. Positions were still fixed. Using instruments descended from these, guided by math refined from these scribbles. It *worked*. The predictions survived. But the ground beneath his pencil felt like glass over an abyss.

  He forced himself back to the current entry. Fizeau’s experiment. Water flowing in a tube, light dragged fractionally. Fresnel’s ether-derived coefficient predicted it perfectly. Relativity later swallowed the coefficient whole, jettisoning the ether. **S/C** for the ether, **S/W** for the coefficient? Or was the coefficient just a miraculously durable piece of mathematical furniture, fitting both the demolished ether-house and the new spacetime structure? How could his pencil, here, now, possibly know?

  He drew the vertical line. **M/A** beside the complex formula. Then, beside *‘partial entrainment of the luminiferous medium’*, he started **S/C**. His pencil hovered. The graphite point, worn soft, smudged the vellum slightly. The **C** blurred. He pressed harder, trying to make it sharp, definitive. The thin paper dimpled. He imagined future auditors finding this page. Would they see his mark as insight or arrogance? A claim to discern the ghost from the load-bearing beam, when perhaps they were the same thing, seen from different shores?

  He finished the **C**. It looked dark, accusatory. He slammed the ledger shut. The sound echoed in the cavernous archive. His coffee was stone cold. The rain hissed against the windows. Friday. Fenwick wanted a ledger, a verdict. He’d give him marks on paper. **S/W**. **S/C**. **M/A**. He’d do his job.

  He opened the next ledger, heavier, bound in salt-stained leather. *Dead Reckoning Corrections, Vol. VII*. The first entry: *"Account for the drag of the celestial spheres upon the ship's vital spirit..."*

  Silas picked up his pencil. His hand still trembled. He took a breath that tasted of dust and the ghosts of dead certainties. He touched the point to the paper. Somewhere, a ship was trusting a position calculated by descendants of this math. It had to be saved. Didn’t it? He began to draw his line. The air conditioner hummed, a low, constant thrum in the silence, like the sound of the void beneath the fragile floor of the world. The graphite whispered against the page, marking ghosts, marking math, marking the unbearable weight of not knowing what, in the end, was truly holding everything up. He drew the line.
