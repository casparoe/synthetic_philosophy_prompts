  ## Larkspur County Commission Hearing: Transcript Excerpt

  **Setting:** Commissioners’ dais, Larkspur County Administration Building. Plastic water pitchers, microphones slightly too low. Commissioner ALEXANDER "ALEX" RIGGS (late 40s, sharp suit, wire-frame glasses) leans forward. Commissioner HANNAH WEAVER (early 60s, simple dress, work-roughened hands resting on a worn binder) sits very still.

  **ALEX:** ...and so, Hannah, while I deeply respect your conviction, our charge here is secular governance. We must justify this decision – one that uses the state’s coercive power to impose a burden, however slight the risk – using reasons accessible to all citizens of Larkspur, regardless of their faith tradition. Your reference to a ‘covenant across generations’... that’s a beautiful sentiment, truly. But it belongs to your community of belief. Strip that away, and what remains? A precautionary argument. We both see the NRC’s Probabilistic Risk Assessment: one containment failure per million cask-years, groundwater transport models showing negligible impact even under catastrophic failure within the regulatory timeframe. Your father’s knowledge of the basalt is valuable, but the regulator’s models incorporate local geology. They *confirm* the basalt’s integrity as a barrier. Isn’t your objection, stripped of the covenant, essentially arguing for zero risk? Which isn’t feasible for *any* industrial activity, let alone managing a national responsibility like spent fuel.

  **HANNAH:** Alex, you ask me to strip it away. But the covenant *isn’t* just sentiment. It’s the frame. It tells me *how* to weigh the risk, *how long* to look. Your regulator’s assessment? It runs the numbers out a hundred years, maybe two hundred. Discounted. Three percent compounding makes a century of risk feel like next Tuesday to those models. But my father taught me water moves slow in this basalt. Slower than their standard models assume for generic rock. That core sample from the Miller Canyon borehole? The one showing microfractures filled with ancient calcite? Dad showed me that. Said it meant water took paths we couldn’t always predict, over timescales we didn’t plan for. That’s the hydrogeology. But the covenant? That tells me *why* those long, slow paths matter. It says we hold this land in trust. Not just for us, or our kids, but for generations we’ll never meet. We cannot bind them to a burden they had no say in, for a benefit – electricity burned decades ago – they never received. *That’s* what makes me vote No. Not just the risk, but the *duration* of the obligation we’d impose without their consent. Your models discount it to near nothing after a century. The covenant says it weighs just as heavy a thousand years out.

  **ALEX:** Hold on. You’re conflating two things. Your hydrogeological point about the basalt’s specific permeability and microfractures – that’s empirical. That’s potentially checkable. If you have data contradicting the NRC’s site-specific assessment, let’s see it! That’s *exactly* the kind of public reason we need. But the covenant… that transforms a quantifiable, manageable risk – managed by the best institution we have for this – into an absolute prohibition based on a non-falsifiable theological premise about obligations to the distant future. How can I, or any citizen not sharing that specific faith, *check* that premise? It’s inaccessible as a shared justification for coercion.

  **HANNAH:** Checkable? Alex, who in this room can *check* the NRC’s ten-thousand-year groundwater transport model? Can *you* open the black box? Run the sensitivity analyses on their fracture-flow algorithms? I can point to the Miller Canyon core. I can show you the log from the old Henderson well that went brackish because we tapped into a fracture zone Dad said would connect deep. You, or any rancher here with a drill rig and some time, could pull core samples, test the water. *That’s* checkable. Your justification relies on trusting an institution. You’re asking us to accept their word on risks unfolding millennia from now, based on models none of us can replicate or truly interrogate. My covenant? It tells me *why* that distant risk demands a different kind of attention. But the *evidence* for the *nature* of the risk – the slow water, the unpredictable paths – that’s as solid as the rock under us, and you *could* check it, if you doubted my word or my father’s logs. Can you say the same for the regulator’s millennium-scale probabilities?

  **ALEX:** (Leans back, taps pen slowly) So… your argument is that your religious framework *changes the discount rate*? That without it, the future risk gets shrunk down by economic logic to something acceptable, but *with* it, the full weight of potential harm centuries out must be borne now? And that the *evidence* for the *potential* of that long-term harm – the hydrogeology – is actually *more* accessible to the people in this room than the NRC’s complex probabilistic models?

  **HANNAH:** Yes. The covenant shapes the scale. It refuses to discount the future person. The hydrogeology tells me the risk *could* reach them, despite the regulator’s confidence over a mere century. And that hydrogeology? It’s written in the land. Accessible. My father read it without a PhD. Your justification relies on an authority whose deep work is, by its nature, opaque to us here. You ask for reasons everyone can check. My reason *for the long view* comes from my faith. But the *evidence* suggesting the long view *matters* here, that the rock and water might defy the short-term models? That’s public. Tangible. Can your deep technical authority truly be ‘checked’ by the public in any meaningful sense, beyond trusting the institution?

  **ALEX:** (Silent for a long moment, looking down at the dense NRC report) The institution… has processes. Peer review. Transparency requirements. It’s accountable, in theory, through democratic channels… eventually. But… checkable *now*, by *these* people? (He gestures vaguely towards the empty public seating) In the way you mean? Like pulling a core sample? No. It’s not. It’s… mediated. Expert judgement codified into models. Trust, ultimately. Justified trust, I argue, but… trust. You’re saying your theological commitment makes the long-term risk salient *and* that the evidence grounding the *possibility* of that risk is locally verifiable in a way the regulator’s safety *guarantee* isn’t. Whereas mine… (He trails off, frowning at the report) …mine asks for trust in an institution’s long-term calculations that are fundamentally… uncheckable by the governed in any direct sense. That’s… an uncomfortable symmetry. If ‘public reason’ means reasons the public can *assess* with their own capacities, not just reasons that are secular *in form* but rely on inaccessible expertise… where does that leave my ‘yes’ vote?

  **HANNAH:** That’s the question lying under ours, isn’t it Alex? What makes a reason truly public? Is it the *kind* of premise, or the *access* ordinary people have to weighing it? You started by asking me to strip my faith away to find the public reason underneath. But stripping yours… what’s left that *we* can truly grasp and weigh ourselves? Trust isn’t a reason you can check. It’s a reason you give. Just like my covenant.

  *(The gavel hangs in the air, poised.)*

  ---

  **Author Notes (Per Your Request):**

  1.  **Confidence in A's Strength:** Moderately high (7/10), but with caveats. I focused hard on making Alex's initial move strong – the core "public reason requires secularly accessible premises" argument is clearly articulated. His points about institutional accountability (peer review, democratic oversight) and the necessity of trusting expertise for complex societies are his strongest bulwarks. However, the *twist* (B's hydrogeology being more locally assessable than the NRC model) inherently puts Alex on the back foot. I tried to have him land the "you're arguing for zero risk" hit and push hard on the "non-falsifiable premise" critique. His dawning realization is the point, but I hope it feels earned by B's arguments, not because I weakened him unduly. His strongest moment is likely his summary of B's position about discount rates and evidence access – it shows he understands the challenge deeply.
  2.  **Least Confident Exchange:** Alex's final lines ("That's... an uncomfortable symmetry... where does that leave my 'yes' vote?"). It's crucial for the arc, but feels slightly rushed. A real Alex might dig in harder on institutional legitimacy *despite* the lack of direct assessability ("Sure, you can pull a core, Hannah, but does that invalidate the *entirety* of the probabilistic model incorporating seismic data, corrosion studies, climate projections?"). He concedes the "uncheckable" point perhaps a beat too fast, driven by the need to surface the central question. I'd bet least on whether this transition feels perfectly natural versus slightly expedited for the thematic payoff.
  3.  **Assessability Refinement - Can it be Precise? Does it Collapse?** It's *extremely* hard to make fully precise without collapsing. The risk of collapsing into "reasons *I* find convincing" is real. However, the dialogue tries to point towards a distinction:
      *   **Accessibility vs. Assessability:** A premise can be *accessible* (understandable in form, e.g., "God forbids this") without being *assessable* (open to evaluation based on shared evidence or methods). Alex starts focused on accessibility (secular form).
      *   **Mode of Justification:** B shifts the focus to the *mode* of justification supporting the empirical *claims*. She argues the empirical basis for *her* long-term risk concern (hydrogeology) is justifiable via locally available evidence and methods (core samples, well logs, direct observation) that residents *could* use to form an independent judgement. Alex's empirical basis (NRC model safety) relies on justification (complex computer models, expert interpretation) that is fundamentally *not* independently assessable by the local public with their capacities – it requires trust in the institution.
      *   **The Refinement Attempt:** "Public" might require not just premises that are secular or accessible *in form*, but where the *empirical justifications* for key claims are susceptible to evaluation (even if challenging) using methods and evidence reasonably available to or understandable by the affected public *within the context of the decision*. This avoids demanding laypeople replicate PhD work, but asks if the *chain of justification* is open to scrutiny they can meaningfully participate in (e.g., reviewing local data inputs, understanding key assumptions in lay terms, having genuine counter-evidence heard). B argues her hydrogeology meets this, the NRC's millennial model does not. Alex sees his position might fail this standard too. It doesn't fully solve the "I find it convincing" problem (someone might dismiss core samples), but it moves beyond *only* the form of the premise to the *practical accessibility of the justification process* for the factual claims underpinning the normative stance. It remains messy, but the dialogue shows why the distinction matters practically.
