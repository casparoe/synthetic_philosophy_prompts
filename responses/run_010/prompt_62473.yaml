prompt: |-
  I teach secondary-school history, and the same argumentative shape turns up every year when we reach figures like Columbus or Jefferson. A student concedes the fact — that people were held in bondage, that some contemporaries protested at the time — and then says that we cannot judge a man of the sixteenth or eighteenth century by our standards. Three features of this exchange puzzle me, and I do not know whether any of them is a recognised thing.

  The first is that the plea is confined to morals. Nobody excuses an ancient thinker's account of the physical world on the grounds that the evidence had not yet been gathered; we simply say he was mistaken, and we go on teaching him. The same man's treatment of other human beings is insulated by his century.

  The second is that the plea is elastic in a way that tracks how much the audience likes the figure: an admired man is measured against the loosest norms available in his own period, a disliked man of that same period against ours.

  The third is the one I most want a word for. When I produce dissenting contemporaries — clerics in the 1500s denouncing the treatment of indigenous peoples, abolitionists among Jefferson's own acquaintances — the reply is never a retreat from the defence but a relocation of its criterion: those critics were a handful, they had no power, nothing the man could have learned from them would have altered what he did. Concede that, and the criterion moves again, to whether acting on it would have cost him too much. Each new criterion is individually sensible, and the defence as a whole is never at risk.

  Is there an established concept or literature covering this, as a whole or the third feature in particular? I would want the nearest existing notions identified and then distinguished from what I have described: I know there is a general debate about judging the past by present standards, and separate work on whether ignorance of morality excuses, but neither seems to capture a defence that survives every counterexample by changing what it demands. And if nothing covers the third feature, what would you call it, how would you define it, and what would count as a case that is *not* it — for instance, a legitimate revision of the criterion rather than a retreat? A bare label will not help me; I need the boundaries.
reasoning: |-
  Okay, the user is a secondary-school history teacher dealing with a recurring student argument when discussing figures like Columbus or Jefferson. Students concede historical facts like slavery or contemporary protests but argue we can't judge past figures by modern standards. The teacher has three puzzles about this argument.

  First puzzle: Why is this moral relativism only applied to ethics, not to factual errors? Students don't excuse Aristotle's physics mistakes because evidence was lacking - they accept he was simply wrong. But for moral issues, suddenly the historical context becomes an absolute shield.

  Second puzzle: The standard seems inconsistently applied based on how much students like the figure. Admired historical figures get measured against the most lenient contemporary norms, while disliked ones get held to modern standards.

  Third puzzle (the core issue): When presented with contemporary dissenters (like 1500s clerics criticizing colonization or Jefferson's abolitionist peers), students don't retreat. Instead, they shift the defense criteria: First "no moral consensus existed" → then "but dissenters were powerless" → then "acting morally would have been too costly." Each criterion seems reasonable alone, but together they form an unfalsifiable defense that evolves to block every counterexample.

  The teacher wants terminology for this third pattern especially - the moving goalposts defense. They know about general debates on presentism and moral ignorance, but those don't capture this shape-shifting quality. They need:
  - Existing concepts that come closest
  - Clear boundaries to distinguish it
  - What a legitimate criterion revision would look like
  - A precise label/definition if none exists

  Key aspects of the third pattern:
  - It's a defense cascade - each retreat establishes a new defensive position
  - Criteria shift from moral epistemology (could he know?) to practicality (could he act?) when contradicted
  - Remains unfalsifiable because the goal keeps moving
  - Different from admitting a figure was morally exceptional for their time (which would be progress)

  Possible connections:
  - Epistemic shifting (in argumentation theory)
  - Moral licensing in psychology (but usually about individuals, not historical judgment)
  - "Moral capital" concept in historiography
  - Goalpost moving fallacy (though usually more blatant)

  What would break the pattern? If students acknowledged: "Yes, with extraordinary moral courage he could have acted differently - so he bears some blame." That would mean accepting the validity of contemporary dissent while recognizing practical constraints - a nuanced position rather than blanket exoneration.

  The core issue is the refusal to allow any counterevidence to challenge the exoneration premise. It's not presentism they're avoiding - it's moral condemnation itself, using historical context as the vehicle.
answer: |-
  Your analysis of this recurring classroom dynamic is exceptionally sharp, particularly regarding the third feature—a sophisticated defense mechanism that evolves to neutralize counterevidence. Below, I synthesize established concepts that partially align with your observations, then define the core phenomenon (especially your third point) with boundaries, distinctions, and non-examples. This draws from historiography, moral philosophy, rhetoric, and cognitive bias studies.

  ### 1. **Closest Existing Concepts & Why They Fall Short**
     - **Presentism Debate** (Historiography):  
       The general argument that we shouldn't judge the past by modern standards. **Why it doesn't fit your third feature:** It’s a static claim, not a dynamic defense that *morphs* when challenged. Your students aren’t just invoking presentism; they’re refining it into new, unfalsifiable criteria.
       
     - **Moral Luck** (Philosophy, e.g., Bernard Williams):  
       The idea that moral judgment depends on factors outside an agent’s control (e.g., historical context). **Shortfall:** Moral luck typically examines how circumstances *diminish* blame, but your students use it as an *absolute shield* that adapts to evidence.

     - **Motte-and-Bailey Fallacy** (Rhetoric/Nigel Warburton):  
       Retreating to a defensible claim ("motte") when challenged, after advancing a bolder one ("bailey"). **Shortfall:** This describes tactical retreat, not the *serial substitution* of criteria you observe. Your students aren’t retreating to a core claim; they’re replacing the core itself.

     - **Shifting Baseline Syndrome** (Environmental History):  
       Each generation accepts degraded conditions as "normal." **Partial parallel:** Like your second feature (elastic standards), but it doesn’t capture the *argumentative evasion* in the third.

     - **Cognitive Dissonance Reduction** (Psychology, e.g., Festinger):  
       Defending beliefs to avoid discomfort. **Shortfall:** Explains motivation but not the *structure* of the evolving defense.

  ### 2. **Defining the Third Feature: Adaptive Exoneration Cascade**  
     This is the core phenomenon you describe—a defense that "survives every counterexample by changing what it demands." I propose this term and definition:  

     **Adaptive Exoneration Cascade (AEC)**  
     *A rhetorical strategy in historical moral judgment where, when faced with counterevidence (e.g., dissenting contemporaries), the defender sequentially shifts the criterion for absolution—always preserving the conclusion (e.g., "he was not blameworthy") while rendering the defense increasingly unfalsifiable. Each new criterion is superficially plausible but contextually displaced to avoid concession.*  

     **Key Mechanisms:**  
     - **Epistemic Relocation:** Moving from "He couldn’t have known" (moral ignorance) to "He couldn’t have acted" (practical impossibility).  
     - **Infinite Requisites:** Demanding ever-higher thresholds for blame (e.g., dissenters must be numerous → influential → capable of altering outcomes → cost-free to obey).  
     - **Conclusory Immunity:** The exoneration is preserved not by evidence but by redefining the conditions for blame.  

     **Boundaries & Non-Examples:**  
     - **NOT AEC:** A student concedes, "Jefferson knew slavery was wrong but feared economic ruin; that’s a moral failing, though I understand his constraints." *Why?* The core criterion ("knowing it was wrong") holds, and blame is partially assigned.  
     - **NOT AEC:** After learning of abolitionist contemporaries, a student revises their view: "I overestimated how isolated Jefferson was—he had more moral agency than I thought." *Why?* Counterevidence alters the conclusion.  
     - **AEC EXAMPLE:**  
       - Initial claim: "No one in Jefferson’s time knew slavery was wrong."  
       - Counter: "Abolitionists like Benjamin Rush were his correspondents."  
       - Shift 1: "But they were a fringe minority!" (criterion: *consensus*).  
       - Counter: "Many elites freed their slaves, like Washington."  
       - Shift 2: "Jefferson couldn’t act without losing political power!" (criterion: *cost-free action*).  
       - Counter: "He freed slaves in his will when it cost nothing."  
       - Shift 3: "But it was too late to undo his legacy!" (criterion: *timely redemption*).  

     **Distinguishing Legitimate Revision vs. AEC:**  
     A revision is legitimate if:  
     - It *narrows* the scope of blame (e.g., "He had less moral insight than I claimed, but still some"), or  
     - It *integrates* counterevidence (e.g., "Dissenters existed, so his ignorance was willful").  
     AEC, by contrast, *preserves total absolution* by displacing the goalpost.

  ### 3. **Addressing Your First Two Features**  
     - **Feature 1 (Morals vs. Facts):** Reflects **Asymmetric Historicism**—applying contextual leniency only to ethics. Rooted in conflating *descriptive* errors (factual) with *prescriptive* ones (moral). Students intuitively treat morality as socially constructed (thus context-bound) but facts as objective.  
     - **Feature 2 (Elastic Standards):** A mix of **Confirmation Bias** (favoring evidence that aligns with priors) and **Hero Worship Dynamics** (protecting admired figures via the "laxest contemporary norm" while judging disfavored ones by strict anachronism).  

  ### 4. **Why AEC Persists & How to Disrupt It**  
     - **Why:** It’s cognitively efficient—students protect simplified narratives (e.g., "Founding Fathers were heroic") while feeling nuanced ("I considered context!").  
     - **Disruption Strategies:**  
       1. **Pre-empt Shifts:** Ask, "What evidence *would* make you hold this figure blameworthy?" before introducing dissenters.  
       2. **Fix Criteria Early:** "By which standard—his contemporaries' or ours—are we judging him today?"  
       3. **Reframe Agency:** Contrast Jefferson with contemporaries who *did* act morally (e.g., John Adams never owned slaves). Ask, "What made Adams able to resist?"  
       4. **Highlight the Pattern:** Name "Adaptive Exoneration Cascade" for students. Show how each shift *avoids* the question: "Are we excusing him because he’s important?"  

  ### Supporting Literature  
     - For **AEC’s structure**: Walton’s *Argumentation Schemes* (on "shifting criteria" fallacies).  
     - For **asymmetric historicism**: Gadamer’s hermeneutics (on moral vs. factual interpretation).  
     - For **elastic hero-worship**: Loewen’s *Lies My Teacher Told Me* (on textbook defenses of figures like Columbus).  

  This framework treats your third feature not as a fallacy but as a *rhetorical system*—one that reveals how moral capital insulates historical figures from blame. By defining its mechanisms, you equip students to recognize when they’re defending a conclusion rather than engaging evidence.
