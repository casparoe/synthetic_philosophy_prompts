prompt: |-
  I am writing the methods section of a comparative economic history course in which students will assess answers to questions of the form: why did sustained growth in output per head begin in Britain rather than in the lower Yangzi Delta? Before assigning any answers, I want the standard they will be judged against, stated once and neutrally, so that a referee who held it could apply it while remaining agnostic between the familiar candidates — coal, colonies, high wages, institutions, culture.

  Set out the conditions a satisfactory answer must meet, in three groups. First, what has to be settled before the question is well posed at all: how the foil is chosen, whether the two sides are units of the same kind, which indicator fixes the divergence and when the two series actually cross. Second, what the proposed cause must do beyond being present in the site that grew: that it be independently identifiable rather than a redescription of growth itself, that it come with a mechanism and a chronology, and that it be shown absent or inoperative on the other side. Third, what the evidence permits on that last point, given that the records of the two sites are not of comparable depth, so that absence of evidence in one is doing real work.

  For each condition, give the consideration or example that motivates it, and say which are non-negotiable and which are in truth the commitments of one school. Then tell me whether any subset is jointly unsatisfiable — I suspect that demanding a cause which is a genuine difference between the two sites, which pins down the timing of the takeoff, and which is general enough to travel beyond this pair may be too much — and finish with the single condition that disqualifies the most of the familiar answers.
reasoning: |-
  Okay, the user is developing a methods section for a comparative economic history course. They want a clear, neutral standard to evaluate student answers on why sustained growth began in Britain rather than the lower Yangzi Delta. The standard should be applicable by referees who remain agnostic about theories like coal, colonies, wages, institutions, or culture.

  The user wants the conditions grouped into three categories: prerequisites for the question itself, requirements for the proposed cause, and handling evidentiary limitations. They also want motivations for each condition, identification of non-negotiable vs. school-specific requirements, analysis of potential conflicts between conditions, and identification of the most disqualifying condition.

  Hmm, this is a sophisticated request that shows deep understanding of historiographical challenges. The user is clearly trying to avoid theory-laden standards while ensuring rigorous comparison. The mention of evidentiary asymmetry suggests they're particularly concerned about Eurocentric biases in sources.

  Let me break this down. First group: making the question meaningful. The choice of Yangzi as foil needs justification - it shouldn't be arbitrary. The units must be comparable (region vs region, not nation vs region). We need a clear indicator (output/head) and precise timing of divergence. These are non-negotiable foundations.

  Second group: causal requirements. The cause must be independent - not just growth relabeled. Needs a mechanism showing how it sparks growth, chronological alignment, and crucially, absence/inoperability in Yangzi. The independence part is non-negotiable; mechanism and chronology show researcher commitment.

  Third group: evidence challenges. Given asymmetrical records, absence of evidence in Yangzi can't automatically mean evidence of absence. This requires careful handling - non-negotiable for fair comparison.

  Now conflicts... Yes! The trio of strict difference, precise timing, and generalizability creates tension. A factor sharply different at takeoff moment (like local coal deposits) may not travel well. Whereas general factors (property rights) often show up in both places at different times. This is where scholarly disagreements live.

  The knockout condition? Definitely the absence/inoperability requirement. Most popular theories stumble here - high wages existed in Yangzi too, coal wasn't uniquely British, colonial models existed elsewhere. This filter exposes lazy comparisons.

  For examples: Pomeranz motivates the Yangzi choice; Clark shows why output/head matters; the "industrious revolution" debate illustrates independence issues. The evidentiary asymmetry problem comes straight from critiques of Sinocentric historiography.

  This framework should force students to engage deeply with comparative methodology rather than recite canned theories. The conflicts section is particularly valuable - it shows why this remains contested terrain. The knockout condition will prevent superficial "Britain had X, China didn't" arguments.
answer: |-
  Here is a structured framework for evaluating answers to "Why Britain first?" in your comparative course, designed to be neutrally applicable by referees:

  **I. Preconditions: Is the Question Well-Posed? (Non-Negotiable Foundations)**
     1.  **Justified Foil Selection:** *Why* the Lower Yangzi Delta (LYD)? The answer must explicitly justify this specific comparison (e.g., Pomeranz's argument for comparable commercialization, proto-industrialization, living standards, and ecological pressure pre-1800). *Motivation:* Avoids arbitrary or anachronistic comparisons (e.g., comparing Britain to sub-Saharan Africa tells us little about *why* one advanced region diverged). *Status:* Non-negotiable. Without a plausible foil, the question lacks meaning.
     2.  **Commensurable Units:** Both sides must be analyzed as comparable units (e.g., regions, economic cores). *Motivation:* Comparing "Britain" (a nation-state) to "LYD" (a sub-national region) creates analytical asymmetry; institutions, policies, and resources operate at different scales. *Status:* Non-negotiable. Requires defining functional economic units.
     3.  **Defined Divergence Indicator & Crossing Point:** Specify the metric (e.g., real GDP per capita, energy consumption per capita, industrial output share) and pinpoint *when* the sustained divergence began (e.g., post-1780s, post-1820s). *Motivation:* "Growth" can be ambiguous (short boom vs. sustained rise); pinpointing the crossing avoids conflating causes of earlier development with causes of the *takeoff*. *Example:* Britain's *sustained* acceleration in per capita output growth likely post-1820. *Status:* Non-negotiable. Fixes the phenomenon to be explained.
     4.  **Confirmed Crossing:** Demonstrate that the chosen indicator *did* show sustained, significant divergence favoring Britain starting at the claimed time. *Motivation:* Avoids explaining a divergence that didn't happen as claimed (e.g., arguing for a cause in 1700 if divergence only became clear in 1830). *Status:* Non-negotiable. Fact-checking the premise.

  **II. Causal Requirements: What the Proposed Cause Must Achieve**
     5.  **Independent Identifiability:** The cause must be definable and identifiable independently of the outcome (growth itself). *Motivation:* Avoids tautology (e.g., "Britain grew because it had a growth-promoting culture/institution" is circular). *Example:* "High wages" must be measurable via labor scarcity or wage baskets *before* its effects on labor-saving innovation kick in. *Status:* **Non-negotiable.** This disqualifies purely outcome-defined factors.
     6.  **Specified Mechanism:** Articulate a clear, plausible *causal chain* linking the proposed cause to sustained increases in output per head. *Motivation:* "Coal was there" isn't enough; how did access to coal *cause* a self-sustaining increase in productivity and per capita output? *Status:* **Reflects commitment to causal depth (broadly expected, but rigor varies).** Schools differ on required mechanism detail.
     7.  **Chronological Alignment:** The cause must be demonstrably present and operative *before or concurrent with* the identified divergence onset. *Motivation:* Causes must precede or coincide with effects. A factor arising *after* takeoff (e.g., mature factory system) cannot explain its start. *Status:* **Reflects commitment to historical sequence (broadly expected, but strictness varies).**
     8.  **Demonstrated Absence/Inoperability in Foil:** Show the proposed cause was either:
          *   *Absent* in the LYD, OR
          *   *Present but inoperative* (e.g., blocked by other factors, insufficient scale, different context). *Motivation:* A factor present and operating similarly in both places cannot explain divergence. This is the core of *comparative* explanation. *Status:* **Non-negotiable for establishing causal *difference*.** This is the **MAIN DISQUALIFIER** for familiar answers (see below).

  **III. Evidentiary Constraints: Handling Asymmetry**
     9.  **Burden of Proof on Absence:** Recognize that *absence of evidence* for a factor in the LYD (due to sparser records) is not automatically *evidence of absence*. The proponent must actively make the case for absence/inoperability using available evidence, acknowledging limitations. *Motivation:* Prevents unfairly dismissing factors in the LYD simply because records are poorer (e.g., local institutional nuances, specific resource constraints). *Status:* **Non-negotiable for fair comparison.** Mandates critical source evaluation and humility.

  **Analysis of Tensions & Disqualifiers:**

  1.  **Potential Conflict (The Trilemma You Suspect):** Demanding a cause that is a **genuine difference** (Condition 8), **pins down timing** precisely (Condition 3/4/7), and is **generalizable** beyond the pair *is* potentially problematic.
      *   *Why?* Factors that perfectly explain the *timing* and *specificity* of British takeoff (e.g., unique combination of shallow coal seams + proximity to ports + specific patent law evolution 1760-1800) might be highly particular and less generalizable. Conversely, highly generalizable factors (e.g., "secure property rights") often fail Conditions 7 & 8 – they existed earlier or were present in the LYD in comparable forms. *Resolution:* The framework prioritizes explaining *this specific divergence* (Conditions 3,4,7,8) over generalizability. Generalizability becomes a secondary virtue, tested by applying the *same* comparative method to other pairs (e.g., Britain vs. Netherlands).

  2.  **The Major Disqualifier: Condition 8 (Absence/Inoperability in Foil).**
      *   This is the condition that trips up the *most* familiar answers:
          *   **"Coal":** Was present and mined in China. Proponent must show *why* its location, accessibility, cost, or *use* differed critically *at the takeoff moment* (linking to Conditions 6 & 7).
          *   **"Colonies":** Other regions (Spain, Portugal, Netherlands) had significant colonies earlier or contemporaneously. Proponent must show why the *nature* (e.g., settler vs. extractive, integration with home economy) or *timing* of British colonial exploitation was uniquely causal for *domestic* per capita growth takeoff.
          *   **"High Wages":** Evidence suggests skilled wages in core LYD areas were comparable to Britain pre-1800. Proponent must show *why* British wages triggered a *unique* labor-saving response *when* they did (linking to Conditions 6 & 7).
          *   **"Institutions" (Vague):** Many institutional features (property rights, markets) existed in sophisticated forms in the LYD. Proponent must identify *specific, critical, differing* institutional mechanisms active *at the right time*.
          *   **"Culture" (Vague):** Extremely hard to show a *unique*, growth-inducing cultural factor *absent* in the highly commercialized, literate LYD elite culture *and* causally linked via a mechanism *at the takeoff moment*. Often fails Condition 5 too.

  This framework forces students to move beyond simply listing factors present in Britain and absent (or assumed absent) in China. It demands precision in defining the puzzle, rigor in causal logic, chronological awareness, and, crucially, a genuine *comparative* test of the proposed cause against the specific, justified foil, while honestly grappling with the uneven historical record. The **Absence/Inoperability (Condition 8)** requirement, combined with **Independent Identifiability (Condition 5)**, provides the sharpest filter for evaluating proposed explanations.
