prompt: |-
  I have no training in philosophy or in the history of mathematics. For several years now I have been reading Hobbes on my own — Leviathan twice through — and I have recently been working through a popular book about his long feud with John Wallis and the Oxford mathematicians, whose central chapter is given over to his philosophy of geometry. I want to know whether that chapter can be trusted. I have no way of distinguishing careful exposition from confident error, and I have been filling pages of notes on the assumption that it is careful.

  Here is the passage, as I wrote it out:

  "Hobbes held that the only real knowledge is causal knowledge: to know a thing is to know how it comes to be. This is why he made geometry the model of the whole of science. On his account we are certain of geometry because its starting points are definitions that we ourselves impose — a definition cannot be false, only more or less useful — and once the meanings of circle, line, and angle have been settled, the rest of the science follows by reckoning alone, by adding and subtracting names, with nothing left to check against the world. Hobbes accordingly thought that the truths of geometry are known quite independently of any drawing, and he treated diagrams as a convenience for the slow: the geometer's reasoning would lose nothing if no one had ever set compass to paper. Natural philosophy is a poorer enterprise on this view, because we do not make bodies and so can never command the demonstration a geometer has; at best we reason backwards from what we see to what might have caused it. The same conviction explains the wreck of Hobbes's final decades. He could not tolerate the new infinitesimal methods, in which a curved figure is treated as made up of infinitely thin straight slices; and because he had already decided that certainty is a product of definitions rather than of constructions, he spent the remainder of his life publishing false squarings of the circle and attacking men who were simply better mathematicians than he. His hostility to algebra was of a piece with this: he mistrusted symbols because he could not handle them. What survives of all this is a startlingly modern idea — mathematics as a game played with signs of our own invention, owing its truths entirely to our stipulations and nothing at all to reality — which is why Hobbes deserves to be counted among the ancestors of the formalist picture of mathematics that most working mathematicians still hold by instinct."

  I would like an accuracy audit I can act on. Please go through these claims in order and tell me which a scholar of early modern philosophy and mathematics would accept as they stand, which are defensible simplifications that a general reader can safely keep, and which are simply mistaken. Be explicit wherever the passage seems to be sliding rather than asserting something outright false. I am especially unsure whether the author is making one claim about definitions and certainty or two distinct ones, and whether Hobbes's nominalism about definitions really does the work the passage assigns to it. I also want to know whether the passage's explanation of the circle-squaring fiasco runs in the right direction, or whether it has the relationship between Hobbes's theory of definitions and his insistence on constructing figures exactly backwards.

  The sentence about diagrams is the one that made me uneasy, because the same chapter goes on to describe Hobbes arguing at length about how a line comes into being through the motion of a point. I cannot reconcile those two things, and I would rather be told which of them to distrust. The closing claim, by contrast, appealed to me: I have long been inclined to think mathematics is something we make rather than something we find, and the suggestion that Hobbes anticipated this is part of why I enjoyed the book. So please tell me frankly whether that conclusion follows from anything true in the summary, or whether it leans on the parts that do not hold up — and whether the final sentence's remark about working mathematicians is even a claim about Hobbes anymore.

  Finally, if correcting the summary changes how one ought to read the rest of his project — the materialism, the treatment of reasoning as computation — please say so, since I would sooner rebuild my notes than go on polishing a misreading. I do not want references or suggestions for further reading; I want your judgment of the passage itself.
reasoning: |-
  Okay, the user has shared a passage about Hobbes's philosophy of geometry from a popular book they're reading. They want an "accuracy audit" of this passage since they're not trained in philosophy or math history. I need to evaluate each claim systematically.

  First, I should note that Hobbes did emphasize causal knowledge - knowing how things come to be - which aligns with his materialist view. The passage correctly identifies this as central to his philosophy. However, the claim that geometry is the model for all science because we impose definitions needs careful examination. While Hobbes did see definitions as crucial starting points, he also believed they needed to correspond to possible constructions in the physical world. This is where the passage oversimplifies.

  The part about diagrams being mere conveniences seems directly contradicted by Hobbes's own writings. He actually emphasized the importance of constructive generation - the physical act of drawing lines with instruments. This misunderstanding might stem from confusing his nominalism (about names) with his realism about geometric constructions. 

  Regarding the circle-squaring controversy, the passage reverses causality. It wasn't that Hobbes rejected infinitesimals because of his theory of definitions; rather, his inability to grasp new methods led him to double down on constructability. His hostility toward algebra was indeed partly due to his own limitations with symbolic manipulation.

  The final claim about formalism is an anachronism. While Hobbes emphasized stipulative definitions, he still saw mathematics as grounded in physical reality through constructions. Modern formalism is more radical in its detachment from reality. The remark about working mathematicians isn't about Hobbes at all - it's the author's modern commentary.

  Throughout, the passage slides between accurate points and oversimplifications by downplaying Hobbes's constructivism. This matters because his entire materialist project requires that reasoning (as computation) corresponds to physical operations. Correcting this changes how we understand his nominalism - it's not that definitions create truth arbitrarily, but that they name possible physical constructions.

  For the user, who seems invested in the "mathematics as invention" perspective, I should clarify that while Hobbes anticipated some formalist ideas, his system remained grounded in materialism. Their notes might need reorientation around this constructivist core rather than taking the passage's nominalist emphasis at face value.
answer: |-
  Here's a detailed accuracy audit of the passage, point by point, reflecting scholarly consensus on Hobbes:

  1.  **"Hobbes held that the only real knowledge is causal knowledge: to know a thing is to know how it comes to be."**
      *   **Accuracy:** **Defensible Simplification.** Hobbes *did* prioritize causal, generative knowledge ("scientia propter quid") over mere descriptive knowledge ("scientia quia"). True knowledge involves knowing the causes that generated a thing. This is central to his materialism and rejection of scholastic essences.

  2.  **"This is why he made geometry the model of the whole of science."**
      *   **Accuracy:** **Defensible Simplification.** Geometry (specifically synthetic Euclidean geometry) *was* Hobbes's prime exemplar of true science because it perfectly embodied his criteria: starting from clear definitions and proceeding deductively to demonstrate properties *by showing how figures are generated* (constructed) from motions. However, he aspired to extend this model to natural philosophy and politics, recognizing the greater difficulties.

  3.  **"On his account we are certain of geometry because its starting points are definitions that we ourselves impose — a definition cannot be false, only more or less useful..."**
      *   **Accuracy:** **Partially Correct, Partially Misleading / Sliding.**
          *   *Definitions are imposed/stipulated:* **True.** Hobbes was a radical nominalist. Definitions are arbitrary impositions of names marking conceptions in our minds. They are not discovered truths about Platonic forms.
          *   *Definitions cannot be false:* **True, with crucial qualification.** Definitions themselves aren't true/false propositions. However, Hobbes *insisted* definitions must be *adequate*: they must signify conceptions caused by real things or possible generations (constructions). A useless definition (like "round quadrangle") signifies nothing possible, hence is *not* an adequate starting point for science. "Useful" here means "signifying a possible conception generated from sense experience/imagination."
          *   *Certainty stems solely from definitions:* **Misleading/Oversimplified.** While definitions are the starting point, certainty for Hobbes arises crucially from the *deductive process* applied to conceptions grounded in possible *constructions*. Definitions alone don't yield certainty; it's the combination of adequate definitions (signifying possible generations) and correct deduction from them that does. The passage slides from nominalism about definitions to implying they are the *sole* source of certainty, downplaying the essential role of construction/generation.

  4.  **"...and once the meanings of circle, line, and angle have been settled, the rest of the science follows by reckoning alone, by adding and subtracting names, with nothing left to check against the world."**
      *   **Accuracy:** **Partially Correct, Partially False / Sliding.**
          *   *Follows by reckoning (computational reasoning):* **True.** Hobbes famously described reasoning as "Reckoning (that is, Adding and Subtracting) of the Consequences of generall names agreed upon, for the *marking* and *signifying* of our thoughts" (Leviathan). Geometry is a prime example.
          *   *With nothing left to check against the world:* **False / Misrepresents Hobbes.** This is a crucial error. For Hobbes, the certainty of geometry *depends* on the fact that its definitions signify conceptions grounded in the *possible physical generation* of figures (e.g., a circle generated by rotating a point around a fixed center). The "reckoning" works *because* the names ultimately refer back to these conceivable constructions in the physical world (or imagination derived from it). The definitions aren't *arbitrary* in the sense of being disconnected from possible physical reality; they are stipulations *of names* for conceptions *of possible physical generations*. Geometry's truth *is* checked against the possibility of construction. The passage slides from nominalism (names are imposed) to a formalism/idealism (no connection to world) that Hobbes explicitly rejected.

  5.  **"Hobbes accordingly thought that the truths of geometry are known quite independently of any drawing, and he treated diagrams as a convenience for the slow: the geometer's reasoning would lose nothing if no one had ever set compass to paper."**
      *   **Accuracy:** **Simply Mistaken.** This directly contradicts Hobbes. His entire philosophy of geometry rests on the concept of **generation by motion**. A point is conceived as having motion, generating a line; a line moving generates a surface; a straight line rotating generates a circle, etc. Diagrams aren't *just* conveniences; they *demonstrate* or *represent* the very constructive motions that define the figures and ground the reasoning. While the *ideal* generation in the mind is paramount, the possibility of physical construction (setting compass to paper) is essential for validating that the conception is of a *possible* thing. Reasoning *depends* on conceiving the constructive motions; diagrams are aids to this conception, not mere illustrations for the slow. Your unease about this point is well-founded.

  6.  **"Natural philosophy is a poorer enterprise on this view, because we do not make bodies and so can never command the demonstration a geometer has; at best we reason backwards from what we see to what might have caused it."**
      *   **Accuracy:** **Defensible Simplification.** This captures Hobbes's view well. We cannot generate stars or animals from first principles like we can geometric figures. Therefore, natural philosophy relies on "supposition" – hypothesizing possible causes for observed effects – and lacks the absolute certainty of geometry. It yields "conditional" knowledge (if this cause, then this effect) rather than the unconditional certainty of geometry.

  7.  **"The same conviction explains the wreck of Hobbes's final decades. He could not tolerate the new infinitesimal methods, in which a curved figure is treated as made up of infinitely thin straight slices..."**
      *   **Accuracy:** **Partially Correct Direction, But Oversimplified.** His core conviction about geometry requiring conceivable generation *did* fuel his opposition. He saw infinitesimals (indivisibles, nascent/evanescent quantities) as *logical absurdities* ("ghosts of departed quantities") because they described entities that were neither something nor nothing, and crucially, *could not be generated by any conceivable motion*. His constructivism clashed with the new methods. However, personal factors (pride, polemical style) and mathematical limitations also played significant roles.

  8.  **"...and because he had already decided that certainty is a product of definitions rather than of constructions..."**
      *   **Accuracy:** **Runs Backwards / Mistaken.** This gets the relationship precisely wrong. As established in points 4 and 5, Hobbes's certainty stemmed fundamentally from **constructions** (generations by motion), *as validated by his nominalist definitions*. Definitions were the linguistic starting point *for* reasoning about constructions. He rejected infinitesimals *because* he saw them as violating the requirement for conceivable construction/generation, *not* because he prioritized abstract definitions over construction. He prioritized construction *via* adequate definitions. This is a major misstep in the passage.

  9.  **"He spent the remainder of his life publishing false squarings of the circle and attacking men who were simply better mathematicians than he. His hostility to algebra was of a piece with this: he mistrusted symbols because he could not handle them."**
      *   **Accuracy:** **Defensible Simplifications.**
          *   *False squarings & attacks:* **True.**
          *   *Better mathematicians:* **True.** Wallis was vastly superior.
          *   *Hostility to algebra:* **True.**
          *   *Mistrusted symbols / couldn't handle them:* **Largely True.** His nominalism made him suspicious of complex symbol manipulation divorced from clear conceptions of generation. He preferred geometric constructions and was indeed less adept at algebraic formalism than Wallis or Descartes.

  10. **"What survives of all this is a startlingly modern idea — mathematics as a game played with signs of our own invention, owing its truths entirely to our stipulations and nothing at all to reality..."**
      *   **Accuracy:** **Anachronistic Projection / Misrepresents Hobbes.** While Hobbes emphasized stipulative definitions and reasoning with names (reckoning), **this is not his view of mathematics' relation to reality.** As repeatedly stressed, for Hobbes, the certainty and truth of mathematics *derive* from the fact that the stipulated definitions signify conceptions of *possible physical constructions* (generations by motion). The truths *do* "owe" to reality – specifically, to the possibilities of corporeal motion. He is *not* a formalist in the modern sense. Mathematics is *about* the properties of bodies in motion, discovered through reasoning about their conceivable generation.

  11. **"...which is why Hobbes deserves to be counted among the ancestors of the formalist picture of mathematics that most working mathematicians still hold by instinct."**
      *   **Accuracy:** **Problematic Conclusion.**
          *   *Ancestor of Formalism:* **Debatable, but Overstated/Limited.** One can trace a *nominalist strand* in the history of formalism back to Hobbes (emphasizing language, stipulation, computation). However, his *insistence on grounding mathematics in conceivable physical construction/generation* places him far from modern formalism (Hilbert) which explicitly divorces mathematical symbols from physical meaning. He's perhaps a precursor to *certain aspects* of formalism, but not a clear ancestor of the mainstream view. His constructivism aligns more with intuitionism or embodied cognition views.
          *   *Most working mathematicians:* **Not a claim about Hobbes.** This is the author's observation about modern practice, independent of Hobbes's actual views. Its accuracy is a separate debate.
          *   *Follows from the summary?* **No.** This conclusion leans heavily on the passages that misrepresent Hobbes (points 4, 5, 8, 10), particularly the slide from nominalism to formalism/disconnection from reality. It does not accurately follow from Hobbes's actual philosophy as described in the *correct* parts of the summary.

  **Summary of Impact on Reading Hobbes's Project:**

  *   **Materialism:** Correcting the summary *strengthens* the connection to Hobbes's materialism. Geometry is certain *because* it deals with the fundamental properties of body and motion – concepts derived from and applicable to the physical world. Its truths are *not* arbitrary stipulations disconnected from reality; they are discoveries about the necessary consequences of possible corporeal motions.
  *   **Reasoning as Computation:** This aspect remains valid. Hobbes did view reasoning (including geometric deduction) as a kind of mental computation with names ("reckoning"). However, this computation is only meaningful and certain *because* the names signify conceptions grounded in possible physical constructions derived from sense experience. The computation isn't purely syntactic; it's semantic, tied to physical possibility.
  *   **Nominalism:** Your instinct about the passage over-relying on nominalism is correct. While nominalism (definitions as imposed names) is crucial for Hobbes, it **does not do the work** of grounding certainty *by itself*. That work is done by the **constructivism** – the requirement that definitions signify conceivable generations by physical motion. Nominalism provides the *linguistic framework*; constructivism provides the *ontological grounding* in materialism. The passage conflates these and gives nominalism undue weight.
  *   **Geometry as Model:** Understanding the role of construction clarifies *why* geometry was the model. Its objects are not abstract Platonic forms, but concepts of bodies generated by definable motions, allowing perfect causal/deductive knowledge from first principles – something impossible for complex natural bodies we don't generate.

  **Recommendation:** Rebuild your notes. The passage contains significant distortions, particularly the downplaying of construction/generation and the slide towards formalism. Focus on Hobbes's core: **True knowledge is causal; geometry achieves this through reasoning (reckoning) from definitions that signify conceivable generations by physical motion; this grounding in possible corporeal construction is the source of its certainty.** This correct understanding is essential for seeing how his geometry relates to his materialism and his vision for science/politics. While his nominalism is important, it's the *servant* of his constructivism and materialism, not the master.
