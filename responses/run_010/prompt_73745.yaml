prompt: |-
  Setting: I got roped into a working group writing the eligibility rules for a public long-term care benefit. Fixed pot, claims decided case by case by caseworkers who only ever have what's on the form, and the enabling statute actually bars us from asking claimants certain questions about their past conduct. Half the group keeps reaching for the idea that you shouldn't be compensated for bad luck you brought on yourself, and nobody can say what would have to be true for that to become a workable rule. So before I read another paper on luck egalitarianism I want the spec.

  Write the desiderata: what any view that wants distributions to track responsibility but not luck has to deliver. For each one give me the case that motivates it, whether it's non-negotiable or just a camp preference, and whether it constrains the criterion of justice or the decision procedure an agency actually runs — and flag where you think those two come apart, because my hunch is that a lot of the standard objections (the motorcyclist who rides without a helmet, the person with a taste they never chose, the two identical lottery tickets) are really attacks on a procedure dressed up as attacks on a criterion.

  Cover at minimum: where the brute-luck/option-luck line can be drawn non-arbitrarily when the choices themselves are shaped by circumstances, and whether that regress is fatal or just needs a stopping point somewhere; ex ante versus ex post versions; equality of what (resources, welfare, access to advantage) and why that choice isn't seperate from the luck/choice question; and what the theory owes to the person it turns down — some publicity constraint on how the verdict can be stated to them without it being an insult.

  Then: which single requirement knocks out the most candidates, and is some subset jointly unsatisfiable once you add the information constraint? My suspicion is that genuinely tracking choice, not interrogating people about their tastes and risk beliefs, and never leaving anyone under a floor can't all be had at once — if that's right, say which one gives. Also tell me which things people in this literature demand that you think are bogus requirements, prejudices of one camp wearing a constraint costume, and whether scope questions (non-residents, future claimants, animals) belong on the list at all or are some other theory's business.

  End with two or three lines each on how Dworkin-style resource accounts, Cohen/Arneson-style access-to-advantage accounts, and the wholesale rejection of the project do against the list. Briefly tho — the criteria are the point.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're part of a working group designing eligibility rules for a long-term care benefit. The constraints are a fixed pot, case-by-case decisions based solely on forms, and legal restrictions on asking about past conduct. The core issue is half the group's insistence on not compensating "self-inflicted" bad luck without a clear rule.

  First, I need to identify the key philosophical challenges here. The user mentions brute luck vs. option luck, the regress problem when choices are shaped by circumstances, ex ante vs ex post approaches, the equality metric (resources, welfare, etc.), and the publicity requirement. They also want to know which requirements conflict and which theories might fail.

  The user's deeper need seems to be cutting through academic debates to practical criteria. They suspect tracking choice without intrusive questions while ensuring a basic floor might be impossible. They also hint that some objections confuse procedural feasibility with theoretical validity.

  Breaking down the desiderata: Each needs a motivating case, negotiability, and whether it's a criterion or procedural constraint. For instance, the non-arbitrary line-drawing requirement is crucial but tricky—how to distinguish choices influenced by circumstance without infinite regress? Cases like preventive care refusals show the difficulty.

  Publicity is non-negotiable; denying care based on vague "responsibility" would insult claimants. The information constraint (no deep probes into beliefs/tastes) is procedural but critical given the statute. The basic floor requirement is likely non-negotiable in social policy.

  The major conflict: Truly tracking choice requires knowing individual preferences and risk assessments, but the information constraint prohibits that. You can't have both without intrusive questions. The floor requirement compounds this—if someone's "choices" lead to severe need, denying aid violates the floor. So, the choice-tracking must yield.

  On bogus requirements: Insisting on perfect neutrality in the "equality of what" debate ignores context—resources fit insurance schemes better. Future claimants/animals are likely out of scope here.

  Theories: Dworkin's hypothetical insurance handles known risks but struggles with adaptive preferences. Cohen/Arneson demands unrealizable access equality. Rejectionists avoid these issues but may default to arbitrary cutoffs.

  The user needs clarity on feasible compromises. Highlighting the choice vs. information conflict shows why their suspicion is correct—procedural limits make pure responsibility-tracking unworkable. Publicity and the floor are untouchable, so the group must soften choice-tracking, perhaps through broad risk categories rather than individual judgments.
answer: |-
  Here are the desiderata for any responsibility-tracking distribution scheme, tailored to your long-term care (LTC) context. I focus on **operational viability** given your constraints (fixed pot, limited info, caseworkers, legal bars).

  ### Core Desiderata (Non-Negotiables for a Workable Rule)

  1.  **Non-Arbitrary Stopping Point for the Luck/Choice Regress:**
      *   **Motivating Case:** Claimant A (grew up in poverty, poor health education, works manual labor) neglects preventive care. Claimant B (affluent, health-literate office worker) neglects identical care. Is neglect "choice" equally for both?
      *   **Requirement:** The rule must define a *practically identifiable point* where "circumstance" ends and "responsible choice" begins. It *must* stop the infinite regress ("but why did they choose that? Was *that* influenced by luck?"). This stopping point cannot be *morally arbitrary* (e.g., "age 18") without justification relevant to LTC need.
      *   **Constraint:** Primarily **criterion**, but the chosen point *must* be **procedurally implementable** (identifiable from the allowed form data).
      *   **Regress Handling:** Fatal *only* if no stopping point allows fair/feasible implementation. A justifiable stopping point (e.g., "choices made after access to basic health info is reasonably available") is essential.

  2.  **Ex Post Focus (With Ex Ante Consistency):**
      *   **Motivating Case:** Two people smoke. One gets lung cancer requiring LTC, the other doesn't. Should the unlucky one be denied based on the *ex ante* risky choice, even if the *ex post* burden is catastrophic?
      *   **Requirement:** The rule must adjudicate based on the *actual outcome* (need for LTC) and the choices leading *to that specific need*. However, the *criteria* used must be consistent with what we would have held people responsible for *ex ante* (e.g., we can't deem smoking risky only *after* someone gets cancer).
      *   **Constraint:** **Criterion** (defines what justice demands for the actual claimant), but **procedurally** requires rules defined *ex ante*.
      *   **Ex Ante/Ex Post:** Ex post need is the trigger; ex ante defines the relevant responsibility criteria. Pure ex ante (hypothetical insurance) is often procedurally impossible here.

  3.  **Operational Metric ("Equality of What?" Tied to Luck/Choice):**
      *   **Motivating Case:** Claimant C needs LTC due to congenital disability (brute luck). Claimant D needs identical LTC due to a skiing accident (option luck?).
      *   **Requirement:** The rule must specify *what* aspect we aim to equalize *against luck* (resources for care, welfare level, access to advantage). Crucially, **this choice directly shapes the luck/choice distinction.** Defining "disadvantage" as *resource deficit* makes congenital disability pure brute luck. Defining it as *welfare deficit* risks penalizing expensive tastes (even unchosen ones) or adaptive preferences. *The choice of metric determines what counts as compensable bad luck.*
      *   **Constraint:** **Criterion.** The choice *is* fundamental to defining luck/choice. *But* the chosen metric **must be procedurally measurable** (e.g., "resources" is often easier than "welfare" or "access" with limited forms).

  4.  **Public Justification Requirement (Non-Insult Principle):**
      *   **Motivating Case:** Denying care to a paraplegic motorcyclist who rode without a helmet. Telling them: "You chose the risk, you bear the cost."
      *   **Requirement:** The reason for denial **must be stateable to the claimant**, based *only* on information they could reasonably have known/controlled *and* that the agency is allowed to collect/use, **without being demeaning or implying their need itself is undeserving of compassion.** It cannot rely on inaccessible philosophical constructs or hidden moralism.
      *   **Constraint:** **Both.** A just **criterion** must *be capable* of such justification. The **procedure** *must* generate denials that meet this standard. *This is where many thought experiments (motorcyclist, lottery tickets) expose procedural impossibilities inherent in simplistic criteria.*

  5.  **Basic Floor Constraint:**
      *   **Motivating Case:** Claimant E needs LTC due to genuinely reckless past behavior. They have no resources and no family. Denial means homelessness, suffering, death.
      *   **Requirement:** The rule **cannot** allow outcomes below a minimum threshold of humane treatment, regardless of responsibility. Society cannot let people starve/rot in the street based on choice.
      *   **Constraint:** **Criterion** (a limit on what justice/decency allows). **Procedurally**, it means the rule must have a safety net built-in, potentially overriding strict responsibility-tracking for catastrophic need.

  6.  **Information Constraint (Procedural Core):**
      *   **Motivating Case:** Claimant F needs LTC. Was it due to an unknown genetic predisposition (brute luck) or their diet (choice)? The statute bars asking about detailed dietary history or genetic testing.
      *   **Requirement:** The rule **must function using only the information legally and practically available to the caseworker via the approved form.** It cannot require knowledge of internal states (true beliefs, unchosen tastes, risk assessments), inaccessible medical history, or deep biographical detail barred by statute.
      *   **Constraint:** Primarily **Procedural**, but it **severely constrains viable criteria.** *This is crucial - many theoretical criteria fail here.*

  ### The Major Conflict & Which Requirement Knocks Out Candidates

  *   **The Core Tension:** **Genuinely tracking choice (Desideratum 1 & 2) + Information Constraint (6) + Basic Floor (5) + Public Justification (4) are jointly unsatisfiable under typical LTC constraints.**
  *   **Which Gives?** **Genuinely tracking individual choice** is the casualty. Why?
      1.  **Information Constraint (6):** Truly assessing responsibility requires knowing *intent, beliefs, alternatives, influences* – precisely the information barred or unavailable on a form. You can't accurately discern "choice vs. circumstance" deep in the regress with limited data.
      2.  **Public Justification (4):** Explaining a denial *based on responsibility* without the rich information needed to make that determination fairly often *will* sound like an insult or arbitrary judgment ("We deem your pre-disability lifestyle choices irresponsible").
      3.  **Basic Floor (5):** If tracking choice leads to denying catastrophic care, it violates the floor, forcing an override that abandons strict responsibility-tracking anyway.
  *   **The Knock-Out Requirement:** **The Information Constraint (6)** eliminates *most* nuanced luck egalitarian candidates. Theories requiring fine-grained assessment of individual responsibility (especially regarding beliefs, preferences, or specific causal chains) are dead on arrival. **Public Justification (4)** then eliminates many of the remaining simplistic rules (like "all self-inflicted harm is uncompensated") because they fail the non-insult test when applied to complex lives.

  ### Bogus Requirements & Scope

  *   **Bogus Requirements ("Constraint Costumes"):**
      *   **Perfect Neutrality/Metric Purity:** Insisting that *only* resources, *or only* welfare, *or only* access can be the "correct" metric, irrespective of the policy context. For LTC, a *resource* focus (care needed) is often more practical and less intrusive than welfare. Dogma here ignores operational reality.
      *   **Complete Elimination of Luck:** The demand that a theory must *perfectly* neutralize all effects of luck. This is impossible and distracts from the practical goal of *mitigating* significant brute luck disadvantage within feasible constraints.
      *   **Ignoring Administrative Costs/Burden:** Treating the decision procedure as a trivial implementation detail separate from the criterion. In reality, the procedure's cost, error rate, and intrusiveness *are* central justice concerns for a public agency.
  *   **Scope (Other Theory's Business):**
      *   Non-residents, future claimants, and animals raise fundamentally different questions (borders, intergenerational justice, moral status) that go beyond the core luck/choice distinction *within* a defined political community making rules for its current members. Adding them here overcomplicates an already intractable problem. Focus on the defined claimant pool.

  ### Brief Theory Scores Against the List

  1.  **Dworkin (Resources + Hypothetical Insurance):**
      *   **Strengths:** Clear(ish) metric (resources), addresses brute luck via insurance, defines option luck via market choices, offers ex ante consistency.
      *   **Failures:** **Information Constraint:** Requires knowing "ordinary" vs. "expensive" tastes/risks to set premiums – impossible without intrusive questioning. **Stopping Point:** Defining the "auction" baseline is arbitrary in practice. **Public Justification:** Telling someone "the hypothetical market wouldn't have insured you" fails the non-insult test hard. **Procedurally** infeasible for caseworkers.

  2.  **Cohen/Arneson (Access to Advantage/Equal Opportunity for Welfare):**
      *   **Strengths:** More nuanced view of advantage, focuses on opportunity sets, potentially addresses unchosen circumstances better.
      *   **Failures:** **Metric Choice:** Defining "advantage" or "access" is incredibly vague. **Information Constraint:** Requires assessing *opportunity sets* and *unchosen preferences* – utterly impossible with limited forms. **Public Justification:** Even harder than Dworkin ("You lacked sufficient access to advantage"?). **Operationalization Nightmare.**

  3.  **Rejection of Luck Egalitarianism (e.g., Sufficientarian, Basic Capabilities, Strict Equality):**
      *   **Strengths:** Avoids the impossible choice-tracking problem. Focuses on need or capability thresholds (meets **Floor Constraint**). **Public Justification** is often easier ("We ensure everyone has basic care"). **Information Constraint** less binding (focus on current need/function). Simpler rules.
      *   **Failures:** Explicitly **abandons Desiderata 1 & 2.** Doesn't try to distinguish luck/choice. Can feel intuitively unfair for clear-cut cases of reckless self-harm (if above the floor). May be seen as not using the "fixed pot" optimally by funding "avoidable" need. Doesn't satisfy the "half the group's" moral intuition.

  ### Conclusion for Your Working Group

  The desire to "not compensate for self-inflicted bad luck" is understandable but **operationally doomed** under your constraints. The **Information Constraint** and **Public Justification Requirement** make nuanced responsibility-tracking impossible. The **Basic Floor Constraint** means you *have* to help some people deemed irresponsible anyway. **Trying to build strict responsibility-tracking into the eligibility rule will likely create arbitrary, unworkable, or insulting outcomes.**

  **Recommendation:** Focus on **need and current resources** as primary criteria. If "responsibility" must be incorporated, consider *very broad, administrable proxies* tied to *specific, definable, documentable choices* (e.g., denial *only* for fraud, or *very* clear refusal of available preventative care *with documented offer and understanding*), but be prepared for arbitrariness at the margins and ensure the **Floor Constraint** always applies. Prioritize **Public Justification** – can you honestly tell someone denied why, based on the form, without insult? If not, the rule is unjust. The literature's elegance rarely survives contact with the form.
