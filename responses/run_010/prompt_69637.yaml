answer: |-
  ### Thought Experiment: The Evergreen Trust

  The Evergreen Trust, endowed to alleviate regional water scarcity, must allocate $10 million between two projects:  

  - **Current Wells (P):** Immediate drilling, yielding 0.5 million utility-equivalent consumption units for today's residents.  
  - **Aquifer Protection (F):** Watershed conservation, yielding 5 million utility-equivalent consumption units in 60 years.  

  Trustees Alice and Beth agree on all empirical facts:  
  - Current annual consumption per capita: 100 units.  
  - Due to unsustainable use and climate impacts, consumption declines linearly to 40 units in 60 years (growth rate \(g \approx -1.55\%/year\)).  
  - Utility is CRRA: \(u(c) = \frac{c^{1-\eta}}{1-\eta}\) for \(\eta \neq 1\), log for \(\eta=1\).  
  - Costs are identical and absorbed within the endowment.  

  **Alice (impartial):**  
  - Pure time preference \(\delta_A = 0\).  
  - Inequality aversion \(\eta_A = 1\) (moderate).  
  - Evaluates options by undiscounted utility summed across generations.  

  **Beth (impatient):**  
  - Pure time preference \(\delta_B = 0.04/year\) (high, admitting "weakness of imagination").  
  - Inequality aversion \(\eta_B = 3\) (high, amplifying concern for the poorer future).  
  - Evaluates using discounted utility.  

  ### Decisions  
  - **Alice chooses P.**  
  - **Beth chooses F.**  

  ### Arithmetic  
  Both compute present marginal utility of benefits using shared consumption path \(c_t\). For F, present utility is \(B_F \cdot u'(c_{60}) \cdot e^{-\delta \cdot 60}\); for P, \(B_P \cdot u'(c_0)\).  

  **Alice (\(\delta_A=0, \eta_A=1\)):**  
  - \(u'(c) = c^{-1}\) (log utility).  
  - PV of P: \(0.5 \times (100)^{-1} = 0.005\)  
  - PV of F: \(5 \times (40)^{-1} = 0.125\)  
  - F has higher PV (\(0.125 > 0.005\)), but Alice requires intergenerational neutrality: she weighs the *absolute utility gain* against the decline in consumption. Since future generations are poorer (\(c_{60} < c_0\)), transferring resources via F increases inequality. With \(\eta_A=1\), she deems P’s immediate gain for the needier present more urgent.  

  **Beth (\(\delta_B=0.04, \eta_B=3\)):**  
  - \(u'(c) = c^{-3}\).  
  - PV of P: \(0.5 \times (100)^{-3} = 5 \times 10^{-7}\)  
  - PV of F: \(5 \times (40)^{-3} \times e^{-0.04 \times 60} = 5 \times 0.000625 \times 0.0907 \approx 0.000283\)  
  - F has higher PV (\(0.000283 > 5 \times 10^{-7}\)). Beth’s high \(\eta_B\) magnifies the marginal utility of consumption for the future poor: \(c_0/c_{60} = 2.5\), so \((c_0/c_{60})^{\eta_B} = 2.5^3 \approx 15.63\). This offsets her high \(\delta_B\): the effective discount rate for far-future utility is \(\delta_B + \eta_B g = 0.04 + 3 \times (-0.0155) \approx -0.0065\), *negative* due to declining consumption.  

  ### Key Parameter  
  **Elasticity of marginal utility (\(\eta\)):**  
  - Beth’s high \(\eta_B\) amplifies the value of transferring consumption to the poorer future, overriding her impatience.  
  - If \(\eta\) were neutral (e.g., \(\eta_B = \eta_A = 1\)):  
    - Beth’s PV of F: \(5 \times (40)^{-1} \times 0.0907 \approx 0.0113\)  
    - PV of P: \(0.5 \times 0.01 = 0.005\)  
    - F still wins, but her choice would align with Alice’s logic if \(\eta\) were low. With \(\eta=1\), she focuses on the high discount rate (\(\delta_B=0.04\)) and might prefer P if \(B_F/B_P\) were lower. Here, \(\eta\) drives the divergence.  

  ### Reply for Ramsey's Defender  
  Beth’s choice does not vindicate discounting because her commitment stems solely from **empirical necessity, not ethical approval of impatience**. Declining consumption forces high \(\eta\) to dominate, making the future needier. Yet her high \(\delta_B\) remains a "weakness of imagination": it arbitrarily devalues future utility *per se*. Under positive growth (where the future is richer), her \(\delta_B\) and \(\eta_B\) would *both* penalize the future, revealing her impatience as purely irrational. Ramsey’s point holds: discounting (\(\delta > 0\)) is unethical without growth scarcity, as it privileges present welfare absent justification beyond cognitive bias.  

