prompt: |-
  I'm a novelist. Third book, about half drafted, due to my editor in the spring, and I've hit a problem I keep papering over instead of solving.

  The book follows one object — a cello, made somewhere around 1790 — through a dozen-odd owners across 230 years, and it also follows three human characters across roughly forty years each. Nearly every chapter involves something that's been repaired, replaced, restored, revarnished, renamed, or just quietly worn into a different thing, and I have to decide sentence by sentence how to talk about it. Do I write as though the whole instrument is sitting right there on the page at every moment it appears? Or do I write it as a chain of versions, each of which was the cello-*then*? I'm told there's an actual philosophical fight about exactly this, something about objects being wholly present at each moment versus being stretched out through time in parts — one camp apparently thinks a thing is a four-dimensional worm, which sounds like an insult but I gather isn't. I haven't read any of it and I'm not going to before March. What I need is a working procedure I can run on a passage in five minutes with a coffee going cold next to me, not a seminar.

  So build me that procedure. Specifically:

  - The questions to ask about a thing in a scene, in the order I should ask them, with what counts as a sufficient answer to each and where a given question just terminates with "stop, you're done."
  - Which of the distinctions in the debate actually change what I put on the page, and which ones I can drop without loss. Say plainly which ones you're dropping and what I'd be giving up. If there are two flavors of the stretched-out view and only one of them is any use to a fiction writer, tell me which and why.
  - Where the procedure can't settle anything and it's my call. Mark those spots instead of hiding them behind a test that looks like it decides something.
  - What it says about people, not just objects. Two of my three characters change a great deal; one does something at 55 that the 25-year-old version of her would have found unforgivable, and a third barely changes at all, which is its own problem. Does the procedure give me a way to write that, or does it just make me pick a side and stick to it?

  Then run it on three things from the actual draft. There's alot of these, but these are the ones that hurt:

  1. Chapter 6: the cello's top cracks in 1848 and a luthier replaces it. Chapter 19, set in 1962, has a character swear an oath on the same top that heard the war. I love that line. I suspect it's a problem.
  2. A house in the second section that's been added onto so many times the original two rooms are now interior walls nobody goes into. A character keeps saying this is the house she grew up in, and I want her to be right and also to be a little wrong, in the same breath.
  3. The one I'm afraid of: my frame device is a closing scene where the 1790 cello and the 2020 cello get described in a single sentence as one thing that has been waiting this whole time. If the procedure says that sentence is a lie, or that it only works on a reading I've been too sloppy to sustain for 300 pages, tell me straight. I'd rather find out now than in copyedit.

  And tell me what the procedure can't do. I'll be using it as a drafting tool and then handing the results to a copyeditor who has never heard of any of this, so whatever it outputs has to be checkable against the text on the page without a theory in your head. Don't give me anything that requires me to know a term I haven't already used in this message, or if you must, define it in one line.

  Long is fine. Vague is not.
reasoning: |-
  Okay, the user is a novelist struggling with how to represent objects and characters that change over time in their book. They need a practical procedure, not philosophical theory. Let me break down their requirements.

  First, they want a step-by-step process to apply quickly while drafting. The key is to make it actionable, with clear questions and stopping points. They mentioned three specific examples: the cello's replaced top, a renovated house, and the frame device. Each of these involves identity through change.

  For the philosophical debate, I should focus on what affects the narrative. The 4D worm theory might be useful for showing continuity, while presentism helps with immediate scenes. The user doesn't care about the academic fight, just what works on the page. I'll distill the useful parts and drop the rest, like mereological essentialism, since it's too rigid for fiction.

  The procedure must handle both objects and characters. The user has characters who change significantly or stay the same. The method should allow flexibility without forcing consistency where it isn't needed. Moments of decision should be highlighted so the writer knows when to choose based on narrative impact.

  Applying the procedure to their examples:
  1. The cello's top replacement: The oath on the "same top" is problematic because the physical top was replaced. The solution might involve shifting the focus to the cello as a continuous entity or the legacy it carries.
  2. The house: The character calling it the same house despite renovations. The tension here is between physical change and emotional continuity. The procedure should validate both, maybe through narrative voice.
  3. The frame device: Describing the 1790 and 2020 cello as one thing. This needs a continuity approach, emphasizing the cello's enduring essence despite parts changing.

  I need to ensure the output is copyeditor-friendly. Avoid jargon. Use terms like "continuant" only if clearly defined. The steps should reference textual elements like character perspective, narrative voice, and temporal context. 

  Also, the user's deeper needs: They want confidence in their choices, avoiding late-stage rewrites. They need efficiency and clarity, minimizing existential doubts during drafting. Emphasizing narrative purpose over philosophical correctness will address that. Highlighting decision points where their authorial intent matters most gives them control.

  Finally, the procedure's limitations: It can't resolve all identity questions, especially when thematic ambiguity is intentional. It also depends on consistent narrative voice, which requires separate attention. Making these boundaries clear prevents misuse.
answer: |-
  Here’s your **Temporal Object Protocol (TOP)** — a step-by-step procedure for drafting scenes with transforming objects/characters. Designed for speed, coffee-in-hand. No theory required, just actionable checks.

  ---

  ### **The Temporal Object Protocol (TOP)**
  **Goal:** Decide *how* to describe a thing (object or person) in a given scene, balancing its "now" state with its history.  
  **Input:** A passage where a thing appears.  
  **Output:** A clear choice: write it as **PRESENT** (wholly here/now), **CONTINUANT** (a strand of its timeline), or **MOMENT** (a specific past/future version).  

  #### **Questions to Ask (In Order)**
  1. **WHOSE PERSPECTIVE?**  
     *Who’s observing/interacting with the thing?*  
     - **Sufficient Answer:** Character name + their relationship to the thing (e.g., "Elara, current cello owner"; "Thomas, historian seeing it in a museum").  
     - **Terminate If:** The narrative voice is omniscient/objective. → Proceed to Q3.  
     - **Otherwise:** Proceed to Q2.  

  2. **WHAT DO THEY BELIEVE?**  
     *Does this character treat the thing as continuous or as its current state?*  
     - **Sufficient Answer:**  
       - "They see it as the same enduring thing" → **CONTINUANT**.  
       - "They see only its current form/function" → **PRESENT**.  
       - "They’re fixated on a past/future version" → **MOMENT**.  
     - **Terminate Here.** Their belief dictates your description.  

  3. **WHAT’S THE NARRATIVE VOICE DOING?**  
     *Is the voice:*  
     - **Objective/Clinical?** (e.g., describing a repair) → **PRESENT**.  
     - **Lyrical/Thematic?** (e.g., musing on time) → **CONTINUANT**.  
     - **Framed as Memory/Prophecy?** → **MOMENT**.  
     - **Terminate Here.** Voice dictates choice.  

  4. **IS THE THING’S CONTINUITY CRITICAL?**  
     *Does the scene rely on it being the "same" thing despite changes?*  
     - **Yes** (e.g., oath-swearing, legacy moment) → **CONTINUANT**.  
     - **No** (e.g., routine use, minor detail) → **PRESENT**.  
     - **Terminate Here.**  

  5. **YOUR CALL:**  
     Flagged for authorial intent. Choose based on:  
     - **Thematic Weight:** Heavy themes (time, identity) → Lean **CONTINUANT**.  
     - **Pacing/Clarity:** Action scene? → **PRESENT**.  

  ---

  ### **What Matters (and What to Ignore)**
  - **USE:**  
    - **CONTINUANT ("4D Worm")**: When history *defines* the thing’s meaning (e.g., "the cello that survived wars"). *Essential for emotional resonance*.  
    - **PRESENT ("Wholly Present")**: When function/physicality dominates (e.g., "she tightened the C-string"). *Essential for immersion*.  
    - **MOMENT**: When contrasting past/future states (e.g., "the house before the north wing burned").  
  - **DROP:**  
    - **Mereological Essentialism** (the idea that losing any part destroys identity). *Useless for fiction* — your cello would "die" with every restringing.  
    - **Endurantism vs. Perdurantism debates**. Only **CONTINUANT** (perdurantism-lite) is usable; it allows things to persist through change *without* atomizing them.  
  - **WHAT YOU GIVE UP:**  
    Philosophical precision. TOP prioritizes *narrative effect* over metaphysical consistency.  

  ---

  ### **For Characters**
  Apply TOP identically:  
  - Elara at 55 vs. 25: If she *feels* continuous despite change → **CONTINUANT** ("She, who once burned draft cards, now signed the cease-and-desist").  
  - The static character: Use **PRESENT** to highlight rigidity ("He was the same man who’d refused a top hat in 1891 and a beanie in 1969").  
  - **Key:** Characters *are* "things" here. Q1 (perspective) is crucial: *Who’s judging their continuity?*  

  ---

  ### **Run the Protocol on Your Draft Passages**

  #### **1. Chapter 19: The Oath on the Replaced Top (1848/1962)**  
  - Q1: **Whose perspective?** Character swearing oath (1962 owner).  
  - Q2: **What do they believe?** They believe the *entire cello* heard the war — its history is sacred. → **CONTINUANT**.  
  - **Decision:** The line stays. *But*:  
    - **Problem:** The top is physically replaced. TOP forces a tweak:  
      *"He swore on the cello that heard the war"* (not "on the top").  
      → **Why:** Shifts focus to the cello’s **enduring identity**, not the replaced part.  
    - **TOP Output:** "CONTINUANT" description validated. The oath works because the *cello* is continuous, even if parts change.  

  #### **2. The Renovated House ("The house I grew up in")**  
  - Q1: **Whose perspective?** Character claiming it’s the same house.  
  - Q2: **What do they believe?** She believes it’s continuous ("same house"), but feels unease → **CONTINUANT** with dissonance.  
  - **Decision:**  
    - *"She called it the house she grew up in, though its walls had swallowed rooms like a whale swallowing ships."*  
    - → **Why:** TOP’s CONTINUANT allows dual truth: *her* continuity vs. physical fragmentation.  
  - **TOP Output:** "CONTINUANT" with character perspective overriding physical change.  

  #### **3. The Frame Device (1790/2020 Cello as "One Thing")**  
  - Q1: **Whose perspective?** Omniscient narrator (framing device).  
  - Q3: **What’s the narrative voice doing?** Lyrical/thematic summation → **CONTINUANT**.  
  - Q4: **Continuity critical?** Yes — the entire book’s meaning hinges on this.  
  - **Decision:** The line *works* **if** you’ve consistently treated the cello as a CONTINUANT in narratorial passages.  
    - **If** you used **PRESENT** in omniscient descriptions elsewhere, it feels inconsistent.  
    - **Fix:** Audit omniscient passages. Where the cello appears, change PHYSICAL-ONLY descriptions to CONTINUANT (e.g., "the cello, its belly now scarred" vs. "the cello rested").  
  - **TOP Output:** The sentence is **valid** under CONTINUANT — *if* sustained. TOP flags it as a **high-risk line** requiring consistency checks.  

  ---

  ### **What TOP Can’t Do**  
  1. **Resolve True Ambiguity:** If a thing’s identity *must* be ambiguous (e.g., "Is this the same knife after the blade/handle were replaced separately?"), TOP identifies it as **YOUR CALL** — then you write the ambiguity deliberately.  
  2. **Override Voice:** A gritty, materialist narrator won’t sustain CONTINUANT. TOP flags the clash but can’t fix it.  
  3. **Replace Copyediting:** Copyeditors will check tense, clarity, and continuity errors — not metaphysical coherence. TOP’s output *is* checkable: "Is the cello called 'the war-hearer' in Ch6 and Ch19?" Yes/No.  
  4. **Handle Radical Transformation:** A cello reforged into a chair? TOP defaults to **MOMENT** ("the cello that became a chair") but can’t make it feel unified. That’s theme work.  

  ---

  ### **Final Output for Your Draft**  
  - **Chapter 19 Oath:** Keep with tweak ("cello that heard," not "top that heard").  
  - **Renovated House:** Use CONTINUANT + character dissonance. She’s "right" emotionally, "wrong" physically.  
  - **Frame Device:** High-risk but achievable. Audit all *omniscient* cello descriptions for CONTINUANT language. If >90% pass, keep the line.  

  **TOP’s Mantra:** *"Does the story need this thing to persist? Then persist it. Else, let it be what it is now."* Time to refill that coffee.
