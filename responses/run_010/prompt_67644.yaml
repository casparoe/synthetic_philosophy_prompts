prompt: |-
  Before I read another proposed solution to the boundary problem, I want the specification such a solution has to meet. The context is not ideal theory: I want a principle good enough that a court or an electoral commission could apply it in advance of a decision to fix the electorate for that decision — say, a city deciding whether to site a waste facility just inside its border, where who is affected depends on which site is chosen, and includes people who do not yet live in the area and will move there only if a particular option is adopted.

  Write the desiderata for such a principle, giving the case or consideration behind each. Among the things I expect the list to engage: the principle must not presuppose the very unit it is meant to determine; it must return a determinate electorate rather than absorbing the whole world into every local question; it must say what happens to people subject to a decision who are not members, and to members whom the decision leaves untouched; it must cope with a constituency that is itself a function of the decision, including future and merely possible members; and it must be applicable by fallible officials under the uncertainty and time pressure that real decision-making involves.

  For each requirement, mark whether it is non-negotiable for any adequate principle or a commitment of one camp that others may reasonably reject — and identify any subset of the desiderata that cannot be jointly satisfied, since if the list is partially incoherent, that is the finding I most want to see argued rather than papered over. End with the single requirement that eliminates the most candidates, and a compact scorecard of the familiar contenders — interest-based, subjection-based, and membership-based principles — against the list.
reasoning: |-
  Okay, the user is asking for a set of specifications that a proposed solution to the boundary problem must meet. The context is non-ideal theory, meaning it has to work in real-world scenarios where courts or electoral commissions need to apply it. The specific example given is a city deciding on a waste facility site, where who is affected depends on which site is chosen, and includes future residents who might move there only if a certain option is adopted.

  First, the user mentioned several key points that the desiderata must engage with: the principle shouldn't presuppose the unit it's trying to determine, it needs a determinate electorate (not the whole world), address people affected but not members and members not affected, handle future/possible members, and be applicable by fallible officials under uncertainty and time pressure.

  I need to break down each requirement clearly. Start with the non-negotiables. The determinacy requirement seems crucial because without a clear electorate, the decision-making process falls apart. The epistemic tractability is also non-negotiable since real officials need to apply it without perfect information.

  Next, the "no presupposition" requirement. If the principle assumes the boundary it's supposed to define, that's circular. So that's non-negotiable. The affected interest principle comes to mind here, but it often leads to over-inclusion, like including the whole world, which violates determinacy. That's a conflict right there.

  Future and possible members are tricky. If the decision affects who moves in, like the waste site example, future residents' interests are impacted by the choice. But how do we represent them? Proxy through current residents? But that might not capture their actual interests. So this is a hard problem, leading to a dilemma between epistemic tractability and robust inclusion.

  The exclusion problem: what about affected non-members? Let's say the waste site affects a neighboring town. If they're not part of the electorate, they have no say, which seems unfair. But including them might blur boundaries. Subjection-based principles might handle this by including all subjected to the rule, but in this case, the decision's impact isn't uniform. This seems like a non-negotiable issue because excluding affected parties is unjust, but solving it might conflict with determinacy.

  Conflict identification is key here. The user wants to see where desiderata clash. The biggest conflict is between robust inclusion (including all affected interests) and determinacy. If you include everyone affected, the electorate becomes too large. Also, inclusion of future members clashes with epistemic tractability—how can officials know future residents' interests?

  The single requirement that eliminates most candidates is robust inclusion. Interest-based principles fail determinacy; subjection-based might include too many; membership-based excludes non-members. So robust inclusion is the toughest to satisfy.

  For the scorecard: Interest-based fails determinacy and epistemic tractability. Subjection-based struggles with determinacy and future members. Membership-based is tractable but fails robust inclusion and non-presupposition. Each has trade-offs.

  The user's deeper needs might be understanding the inherent conflicts in boundary problems, especially in real-world applications. They might be looking for a principled way to handle these dilemmas, acknowledging that no solution is perfect but some might be more feasible. Highlighting the conflicts shows why boundary problems are so challenging and why a one-size-fits-all solution doesn't exist.
answer: |-
  Here are the desiderata for a boundary-setting principle in non-ideal institutional contexts, analyzed for negotiability, coherence, and implications for existing approaches. The core tension lies in reconciling democratic legitimacy with practical feasibility.

  **Desiderata & Underlying Cases/Considerations:**

  1.  **Non-Presupposition:** The principle must **not assume the existence or legitimacy of the pre-decision jurisdictional boundary** it is meant to justify or determine.
      *   **Case:** The city waste facility decision *itself* might alter who lives within the city (e.g., if Site A attracts new residents, Site B repels them). Using the city boundary to define the electorate for this decision presupposes the very unit whose legitimacy for *this specific decision* is in question, especially as the decision alters who *will be* a city resident.
      *   **Negotiability:** **Non-negotiable.** A circular justification is no justification. Any principle relying on pre-existing boundaries fails for decisions that fundamentally alter the constituency.

  2.  **Determinacy:** The principle must yield a **practically identifiable and bounded electorate** for the specific decision, avoiding boundless inclusion.
      *   **Case:** The waste facility will have localized effects (noise, traffic, pollution) concentrated near the chosen site. Including everyone potentially affected by *some* consequence (e.g., global waste management impacts, minor economic ripple effects) would make the electorate effectively global, rendering local democratic decision-making impossible.
      *   **Negotiability:** **Non-negotiable.** For the principle to be usable by real institutions (courts, commissions), it must produce a workable, finite electorate. Boundlessness is operationally fatal.

  3.  **Robust Inclusion:** The principle must **specify the status of individuals significantly affected by the decision but excluded from the electorate ("affected outsiders") and individuals included in the electorate but unaffected by the decision ("unaffected insiders")**.
      *   **Case:** *Affected Outsiders:* Residents just outside the city border near Site A will suffer significant pollution if Site A is chosen but have no vote if only city residents decide. *Unaffected Insiders:* City residents living far from Site B are included in the electorate but experience negligible impacts if Site B is chosen. The principle needs to explain why exclusion/ inclusion is justified or specify compensatory/procedural remedies for affected outsiders.
      *   **Negotiability:** **Non-negotiable (for justification).** A legitimate principle *must* address the moral status of these groups, even if the answer is "exclusion is justified under condition X" or "remedy Y applies". Ignoring them undermines legitimacy. The *specific remedy* (e.g., veto rights, compensation, weighted votes) may be negotiable.

  4.  **Dynamic Constituency Handling:** The principle must **accommodate constituencies that are not fixed but are causally dependent on the decision itself, including future residents and counterfactual residents (those who would reside there only under a specific outcome)**.
      *   **Case:** Families deciding whether to move near Site A *depend* on the decision outcome (e.g., they move only if Site A is *not* chosen). They are "merely possible" residents under one option but actual residents under another. Their interests are profoundly shaped by the decision, yet they don't exist (at that location) at the decision point. The principle must account for how these interests are represented or considered.
      *   **Negotiability:** **Non-negotiable (Problem must be addressed).** This is inherent in the waste facility case and similar spatial/siting decisions. How it's handled (e.g., proxy representation, discounting future interests, predictive modeling) may vary, but the principle cannot ignore these causally-dependent interests.

  5.  **Epistemic Tractability:** The principle must be **applicable by fallible officials with limited information, under time constraints, and reasonable resource limitations.**
      *   **Case:** An electoral commission has weeks, not years, to define the electorate for a referendum on the waste site. They lack perfect data on future migration patterns, precise impact zones, or the subjective interests of every potential affected party. The principle must guide them using reasonably ascertainable facts.
      *   **Negotiability:** **Non-negotiable.** A principle requiring omniscience or infinite resources is useless in the non-ideal context specified.

  **Identified Incoherence/Conflict:**

  *   **The Core Trilemma:** **Robust Inclusion, Determinacy, and Dynamic Constituency Handling form a partially incoherent set under conditions of uncertainty and causal dependence.**
      *   **Conflict 1 (Robust Inclusion vs. Determinacy):** Truly robust inclusion of *all* significantly affected interests (including spatially diffuse or temporally distant ones) inherently threatens determinacy, pulling towards boundless electorates. Defining a "significant" threshold is contestable and often requires presupposing some boundary or scale.
      *   **Conflict 2 (Robust Inclusion & Dynamic Handling vs. Epistemic Tractability):** Identifying *all* significantly affected parties, especially future/counterfactual residents whose existence and interests depend on the decision itself, is often empirically intractable within real-world constraints. Predicting who would move where under which scenario is highly uncertain. Robust inclusion demands it; tractability forbids reliably achieving it.
      *   **Conflict 3 (Dynamic Handling vs. Determinacy/Membership):** If the electorate includes future/counterfactual residents who don't yet exist at the decision point, how are they represented? Proxies (e.g., current residents) are imperfect and may not align with actual future interests. Defining "membership" becomes blurred and potentially indeterminate.

  **The Single Requirement Eliminating the Most Candidates: Robust Inclusion.**

  This requirement eliminates principles that simply ignore affected outsiders (most membership-based approaches) or offer no coherent account of them. It also severely challenges interest-based principles that cannot practically satisfy it without sacrificing Determinacy or Epistemic Tractability. Subjection-based principles struggle to define "subjection" clearly enough in dynamic cases to satisfy Robust Inclusion tractably.

  **Compact Scorecard of Contending Principles:**

  | Desideratum            | Interest-Based ("All Affected Interests") | Subjection-Based ("All Subject to Rule") | Membership-Based ("Pre-defined Group") |
  | :--------------------- | :---------------------------------------- | :--------------------------------------- | :------------------------------------- |
  | **1. Non-Presupposition** | **Passes** (Focuses on effects, not borders) | **Passes** (Focuses on power relation, not borders) | **Fails** (Relies on pre-existing membership) |
  | **2. Determinacy**     | **Fails** (Leads to boundless inclusion)  | **Fails** (Boundary of "subjection" is fuzzy; can be very wide) | **Passes** (Clear, pre-defined group) |
  | **3. Robust Inclusion** | **Passes (in theory)** (Aims to include all affected) | **Passes (in theory)** (Aims to include all subjected) | **Fails** (Ignores affected outsiders) |
  | **4. Dynamic Handling** | **Struggles** (Can *theorize* inclusion but identification is intractable) | **Struggles** ("Subjection" hard to define for future/counterfactuals) | **Fails** (Future members usually excluded; counterfactuals ignored) |
  | **5. Epistemic Tractability** | **Fails** (Identifying *all* affected interests intractable) | **Fails** (Defining/identifying precise scope of "subjection" intractable) | **Passes** (Membership list usually exists) |

  **Summary of Trade-offs:**

  *   **Interest-Based:** Strong on Non-Presupposition and Robust Inclusion *in theory*, but catastrophically weak on Determinacy and Epistemic Tractability. Fails dynamic handling practically.
  *   **Subjection-Based:** Strong on Non-Presupposition and aims for Robust Inclusion, but weak on Determinacy (defining "subjection") and Epistemic Tractability. Dynamic handling is conceptually possible but empirically fraught.
  *   **Membership-Based:** Strong on Determinacy and Epistemic Tractability, but fails Non-Presupposition (relies on existing boundary) and Robust Inclusion (excludes affected outsiders). Fails Dynamic Handling.

  **Conclusion:** No principle perfectly satisfies all non-negotiable desiderata simultaneously due to the identified incoherence (the Core Trilemma). **Robust Inclusion** is the most challenging requirement, eliminating simplistic membership rules and exposing the fatal practical weaknesses of pure interest/subjection principles. Any viable solution in the non-ideal context will likely involve a **hybrid or constrained principle** (e.g., "all *proximately* affected *current* residents within a *reasonable predefined jurisdiction*, plus specific procedural safeguards/representation for identified high-impact outsiders/future generations"), explicitly acknowledging the necessary trade-offs between legitimacy (Robust Inclusion) and feasibility (Determinacy, Epistemic Tractability), particularly concerning dynamic constituencies. The specification demands that any proposed solution confronts this trilemma head-on.
