prompt: |-
  I write a column about cognition and design and I've been poking at the old Letter Spirit / gridfont material — the question of what makes every 'a' an 'a' — and I've ended up with a pile of judgements about particular marks that I can't get into any kind of order. I'd like someone to tell me what principle, if any, is sitting underneath them.

  The cases, roughly in the order I hit them:

  1. The two g's. The loopy-tailed g and the open-tailed one you get in handwriting fonts share maybe one stroke. Obviously the same letter, no hesitation.
  2. A blackletter a and a geometric sans a. Same letter again — and I'd say that even though if you asked me to describe their shapes I'd have almost nothing in common to report.
  3. A shop window with vinyl letters seen from the inside, so the s is mirrored. Still an s, just backwards. A defective s, not some other letter.
  4. My niece's fridge drawing: a b drawn mirrored. I want to say she wrote a b wrongly. I do not want to say she wrote a d. But the mark on the paper is exactly, to the pixel, a d.
  5. Turn a b upside down and I have no hesitation at all: that's a q. Upside-down n is a u. So a 180-degree rotation changes which letter it is and a mirror flip doesn't, even though both are rigid transformations of the same shape. 4 and 5 sitting next to each other is the thing I can't resolve.
  6. A Moscow bus with р on the side. Not a p. Identical shape, different letter, because it's doing a different job in a different alphabet.
  7. A coffee ring on a page that happens to be a perfect capital O. Not a letter, not even a bad letter. Just a ring.
  8. A logo where the negative space between two shapes makes an A that the designer intended and maybe half the people looking at it catch. Here I go mushy: I want to say it's an A for the people who see it and not an A for the people who don't.
  9. My own handwritten a is a circle with a stick. Everyone reads it as an a.
  10. A bare vertical stick. In a font where the l has a tail and a curved foot, the bare stick is ambiguous junk — a 1, an I, whatever. In a font where the l IS a bare stick, that exact same mark is defintely an l. Same ink, different verdict, and the only thing that changed is what else is in the alphabet.
  11. rn set so tight in a cheap font that it reads as m: still an r and an n, badly set, not an m. Which feels like it cuts against 10, where the surrounding inventory decided everything.
  12. The fi ligature is one glyph and two letters, obviously. But æ — in an old English printing of encyclopædia I'd call it a ligature standing in for two letters, whereas in Danish it's a letter in its own right with its own slot at the end of the alphabet. Same shape, different arithmetic.

  My rough first-pass principle, which I'm sure is broken: a mark is an instance of L if a competent reader of that script, given the word around it, would recover L. That handles 9, 10 and 11 decently and it handles 7 by default (no word, nothing to recover from). On 6 the competent reader given a Moscow bus recovers the Cyrillic er rather than p, so it looks like it works — except then the shape isn't doing any of the work at all, and I don't see how it earns 2. And 8 makes letterhood come apart viewer by viewer, which I don't think I actually believe, because 6 shows me treating the letter as a fact about the system rather than about whoever's looking.

  So: is there a principle that gets all or most of these? State it precisely, clause by clause, and tell me which case motivated each clause, since I want to be able to check it rather than take it on faith. Then tell me what it says about cases I haven't listed — a generated glyph halfway between c and e, an e whose crossbar has drifted up so the counter opens; a braille cell, where there's no visible shape to speak of; and a letter in a constructed script that nobody has ever read or set in a word. And be straight with me about which of my verdicts your principle has to throw out. If the cheapest coherent account costs me either 4 or 5, tell me which one goes and why — I'd rather lose a judgement than end up with a twelve-clause theory. No reading list, please, I just want the principle argued out.
reasoning: |-
  Okay, the user is writing a column about cognition and design, specifically focusing on what makes a letter recognizable as itself across various transformations and contexts. They've listed 12 different cases where letter identification gets tricky, and they're struggling to find a unifying principle. Their initial idea—that a mark is an instance of a letter if a competent reader would recover it in context—has some gaps, especially with cases like mirrored letters or identical shapes in different alphabets. 

  Hmm, the core tension seems to be between shape and system. Cases 4 and 5 are particularly thorny: a mirrored "b" is still a "b" (just defective), but an upside-down "b" becomes a "q"—even though both are rigid transformations. The user needs a principle that explains why rotation changes letter identity but mirroring doesn’t, without resorting to arbitrary rules. 

  Then there’s the script dependency (Cyrillic "р" vs. Latin "p") and the role of intention or perception (the coffee ring vs. the negative-space "A"). The user also wants the principle to handle edge cases like ambiguous glyphs or constructed scripts. They’re clearly frustrated with fragmented theories and want something lean, even if it means sacrificing one of their judgments. 

  The key insight might be decoupling the mark’s physical properties from its *functional role in a script*. A letter isn’t defined by strokes but by its slot in a system. For example:  
  - Mirroring (cases 3, 4) doesn’t break the script’s relational rules, so it’s still the "same" letter, just flawed.  
  - Rotation (case 5) repurposes the shape into a different slot (Latin "b" rotated becomes "q" because "q" occupies the "bottom loop" slot).  
  - The Cyrillic "р" (case 6) is identical to Latin "p" but belongs to a different system, so it’s a different letter—like homophones across languages.  

  This system-first view also resolves:  
  - The fridge "b"/"d" (case 4): The mark is physically a "d" but context (child’s intent, surrounding letters) ties it to the "b" slot.  
  - The ambiguous bare stick (case 10): Identical marks become "l" or junk based on the font’s design system.  
  - Ligatures (case 12): "æ" is one glyph but its linguistic function (single letter vs. ligature) depends on the script’s rules, not the shape.  

  Where this gets messy is case 8 (negative-space "A"). If letterhood is systemic, the designer’s intent embeds it in the Latin script, so it *is* an "A"—but viewers might miss it because decoding depends on their script literacy. The coffee ring (case 7) lacks any systemic embedding, so it’s not a letter.  

  Sacrifices? Case 11 ("rn" vs. "m"): The principle would say it’s still "r" and "n" because the typesetting error doesn’t reassign them to the "m" slot in the font system. But if the user feels it "cuts against" case 10, they might dislike this—though it’s consistent (system trumps shape).  

  For unread scripts: A glyph’s potential letterhood hinges on its *intended* role in a system, even if unused. A halfway "c"/"e" glyph? It’s ambiguous because it doesn’t cleanly slot into either category.  

  The user’s initial reader-recovery principle isn’t wrong—it’s just downstream of the system. Competent readers decode based on script conventions. So the refined principle is:  
  **A mark is an instance of letter L iff:  
  (a) It occupies L’s functional slot in a script system, and  
  (b) It’s perceptibly anchored to L’s distinguishing features (within system tolerance).**  

  Case 4 (fridge "b") is saved by intent anchoring it to "b" despite the shape. Case 5 works because rotation moves the shape to "q’s" slot. Case 8’s "A" is valid (designed slot), case 7 isn’t (no slot).  

  The cost? If the user insists case 11 ("rn"→"m") *should* sometimes be misread as "m", this principle overrules that—but that’s a feature, not a bug. It keeps letterhood objective (system-grounded) rather than perceptual.  

  Final note: The user’s frustration with "twelve-clause theories" is valid. This boils down to two clauses: system slot + perceptual anchor. Clean, testable, and it only "loses" inconsistent intuitions.
answer: |-
  Here's a unified principle that handles your cases systematically, grounded in **script-system functional role** and **perceptual anchoring**. It sacrifices none of your verdicts but explains the tensions:

  **The Principle:**
  A mark is an instance of letter *L* **if and only if**:
  1. **System Assignment:** It is intended or conventionally interpreted as occupying *L*'s functional slot within a specific writing system's alphabet;  
     AND  
  2. **Perceptual Anchor:** It preserves a critical subset of *L*'s distinctive features **as defined by that system**, within tolerance thresholds for that script.

  **Clause-by-Clause Motivation & Application:**

  | Clause          | Why Included? (Case Motivating It)                                  | How It Solves Your Cases                                                                                                                                 |
  |-----------------|---------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------|
  | **1. System Assignment** | Cases 6 (Cyrillic р≠Latin p), 12 (æ as letter/ligature): Letterhood is system-relative. Identical shapes can be different letters if they belong to different systems. | **6:** р is assigned to Cyrillic, not Latin. **12:** æ is a Danish letter but a Latin ligature. **7:** Coffee ring has no system assignment → not a letter. **9:** Your 'a' belongs to the Latin system. |
  | **2. Perceptual Anchor** | Cases 1 (g variants), 2 (blackletter/sans a), 10 (bare stick): Shapes vary wildly, but each system defines minimal distinguishing features ("invariants"). | **1-2:** All 'g's share a "descender + enclosed/partially enclosed lower area"; all 'a's share a "closed lower counter + right stem". **10:** In a font where 'l' is a stick, the stick *is* the invariant feature. |

  **Resolving the Mirror/Rotation Paradox (Cases 3,4,5):**
  - **Mirroring (Cases 3,4):** Preserves the *system's defining features* (e.g., Latin 'b' has a vertical stem + rightward bulge; mirrored still has these). Thus, it's still assigned to 'b' (even if defective).  
  - **Rotation (Case 5):** Alters feature orientation relative to system norms:  
    - Upside-down 'b' loses the "rightward bulge" feature of 'b' but gains the "bottom bulge" feature of 'q'.  
    - **Result:** System assignment flips because the *feature configuration* matches a different slot (q) in the same system.  
  - **Case 4 (fridge 'b'):** The mark is perceptually identical to 'd', but *context* (child's intent, surrounding letters) assigns it to 'b' in the Latin system → It's a defective 'b', not a 'd'.

  **Other Cases Explained:**
  - **8 (Negative-space A):**  
    - **If perceived:** Viewer anchors the negative shape to Latin 'A' features (apex, crossbar) → It *is* an 'A' *for them* at that moment.  
    - **If not perceived:** No perceptual anchor → Not an 'A' *for them*.  
    - *Crucially:* The designer's intent assigns it to 'A' in the system, but letterhood requires *both* system assignment **and** successful perceptual anchoring by the viewer.  
  - **11 (rn → m):**  
    - System assignment: Typeset as 'r'+'n' in Latin script.  
    - Perceptual anchor: Fails due to poor spacing → misread as 'm', but the *system assignment doesn't change*. It's still 'r' and 'n' (badly executed).  
    - *Contrast with 10:* In 10, the system *redefines* features to make the stick an 'l'; here, the system hasn't redefined 'm' to include adjacent 'r'+'n'.  
  - **3 (Mirrored s):** Still anchored to 's' features (curve asymmetry) within its system → Defective 's', not a new letter.

  **Edge Cases Addressed:**
  - **Generated glyph between c/e:**  
    - If intended for a system where 'c' and 'e' share a feature slot? (Unlikely in Latin) → Ambiguous.  
    - If intended as a new letter? → Requires system assignment + defined features.  
  - **e with drifted crossbar:**  
    - If the "closed upper counter" anchor is lost? → May become 'c' if fully open, or defective 'e' if partially anchored.  
  - **Braille cell:**  
    - System assignment: Dot positions are functional slots in Braille.  
    - Perceptual anchor: Tactile dot patterns replace visual features.  
  - **Unread constructed script:**  
    - Requires *intended* system assignment + *intended* features. Without readers, it's a *potential* letter, not an instantiated one.

  **What You Sacrifice:**  
  - **Consistency in "letterhood" across viewers for Case 8.** Your instinct was that letterhood shouldn't be subjective. This principle agrees *when system assignment is clear* (e.g., Cyrillic р is objectively not Latin p). But for ambiguous cases like the negative-space A, letterhood *is* viewer-dependent because perceptual anchoring is part of the definition.  
  - **The idea that physical shape is primary.** Shape matters only as a vehicle for system-defined features. This is why rotated 'b' becomes 'q' (feature re-anchoring) while mirrored 'b' is still 'b' (features intact).

  **Why It Works:**  
  It treats letters as **functional units in a system**, not visual shapes. This handles:  
  - Cross-script identity (Cyrillic р ≠ Latin p).  
  - Wild stylistic variation (g, a).  
  - Transformations (mirror vs. rotation).  
  - Context-dependence (bare stick, rn/m).  
  - Intention/perception tension (negative A).

  Your initial reader-recovery principle is *almost* the observable effect of this deeper system. But it fails when shape and system clash (as in your fridge 'b') or when intention precedes perception (unread script). This grounds everything in the **script system’s architecture** + **human perceptual thresholds**.
