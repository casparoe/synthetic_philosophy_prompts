prompt: |-
  I'm on the methods committee of a health technology assessment agency. We write the reference case that tells evaluators how to score funding proposals; the scores feed a ranking and the ranking decides what actually gets built, so the scoring rule isnt a technicality.

  Here's the fight. Outcomes are uncertain and they land differently on different people. Two candidate rules are on the table for the new reference case.

  Rule A: score a proposal as a weighted sum of the individuals' expected utilities. The weights are fixed numbers, chosen up front and published, and they don't change depending on how the proposal turns out. They don't have to be equal — we've been toying with tilting them toward people who start out worse off in baseline health.

  Rule B: for each possible outcome, rank people by how well that outcome goes for them, apply a weighting function that leans harder on the bottom of that ranking, and only then take the expectation across outcomes. So how much weight you get depends on where you land in the distribution in that particular scenario.

  In the pilot round the two disagreed on a screening program that gives a large population a modest benefit in the likely case and rescues a small population from something catastrophic in an unlikely one. Rule B liked it a lot. Rule A didn't. That's the sort of case we'd be signing off on permanently.

  Three members, three views. One with an econ background says Rule B is flatly inadmissable, because Harsanyi's aggregation theorem proves the social evaluation has to be a weighted sum of individual expected utilities and Rule B isn't one. A second says Rule B is obviously just Rule A with different weights, so the theorem doesn't touch it and the whole argument is a non-issue. A third says the theorem is question-begging — its Pareto assumption already builds in that unanimity is what matters, so it can't tell a body like ours what to do — and anyway we have never claimed to know how to compare wellbeing across people, which the sum in Rule A seems to need.

  Draft the memo I'll circulate before the meeting. It has to come down on one rule and give the committee something to vote on. Specifically: say which of the three members is right about what, whether Rule B is or isn't a weighted sum in disguise, and — this is the part I care most about — whether the assumption the theorem leans on is one we'd genuinely be giving something up by dropping, or one we were entitled to reject from the start. I also suspect the ex ante / ex post business is where the real disagreement is hiding and I can't articulate it properly, so please get that out in the open and say which side of it our agency would be taking. And treat the strongest case against your recommendation honestly, the one that would make me nervous if a minister's office read the memo and then read the dissent.

  No references or bibliography, I don't need them, just the reasoning laid out so a smart non-specialist on the committee can check it. Two pages is plenty.
reasoning: |-
  Okay, the user is on a health technology assessment committee and needs help drafting a memo to resolve a debate between two scoring rules. The key issue is whether Rule B is admissible given Harsanyi's theorem and the ex ante vs ex post equity concerns. 

  First, I need to unpack the core disagreement. The econ member sees Rule B as mathematically invalid per Harsanyi, while others argue it's just weighted differently or that the theorem's assumptions are flawed. The pilot case shows high stakes: Rule B favors catastrophic risk protection, Rule A doesn't. 

  Harsanyi's theorem hinges on three axioms: Pareto efficiency, independence of irrelevant alternatives, and cardinal utility. The critical one is ex ante Pareto - if everyone prefers a policy pre-outcome, society must too. But Rule B violates this by sometimes overruling unanimous ex ante preferences when it wants to prioritize worst-off outcomes. 

  Rule B isn't just Rule A with fixed weights because it re-weights based on relative disadvantage within outcomes. This is ex post egalitarianism - caring about how benefits distribute after uncertainty resolves. The memo must clarify this isn't a technical trick but a philosophical stance: Should we value reducing outcome inequality separately from individual risk?

  The strongest case against Rule B is that it can justify ignoring unanimous preferences (e.g., everyone prefers Policy X but Rule B picks Y because Y helps the unlucky few more). That's explosive if ministers hear "the committee overruled what all citizens would choose." 

  But the agency never claimed to accept Harsanyi's utilitarianism. Our mandate is broader - we can value equity of outcomes. Rule B explicitly does this by weighting the distribution-tails. Still, we should admit this trades off against respecting ex ante preferences. 

  Recommendation: Adopt Rule B but with transparency. Say directly: "We prioritize protecting against catastrophic losses, which requires accepting that ex ante unanimous preferences may not always determine our ranking." The pilot screening program example shows why this aligns with health policy values - rescuing people from medical catastrophe matters morally beyond average gains.
answer: |-
  ## MEMO: Scoring Rule Recommendation for HTA Reference Case

  **To:** Methods Committee  
  **From:** [Your Name/Position]  
  **Subject:** Recommendation on Outcome Scoring Rules (Rule A vs. Rule B) & Resolution of Committee Views  
  **Date:** October 26, 2023  

  **1. Core Issue & Pilot Case Significance:**  
  Our decision between Rule A (weighted sum of individual *expected* utilities) and Rule B (expected value of *rank-weighted* outcomes per scenario) is fundamental. The pilot screening program clash is paradigmatic: Rule B prioritizes rescuing a small group from catastrophic loss in an unlikely outcome, while Rule A emphasizes the modest gains for the majority in the likely outcome. This reflects a deep ethical choice about valuing the mitigation of severe misfortune versus maximizing expected aggregate benefit.

  **2. Assessing the Three Views:**

  *   **Member 1 (Econ - "Rule B Inadmissible"):**  
      *   **Partially Right:** Harsanyi's Aggregation Theorem *does* demonstrate that if we accept its axioms (Pareto Efficiency, Independence of Irrelevant Alternatives, Cardinal Utility), the *only* coherent social welfare function is a weighted sum of individual *expected* utilities. Rule B violates the ex ante Pareto principle inherent in Harsanyi (see section 4).  
      *   **Overreaches:** The theorem defines what's admissible *if we accept its axioms*. It does not prove Rule B is mathematically invalid or incoherent *in general*; it proves it's incompatible with Harsanyi's specific framework. Declaring it "inadmissible" assumes we *must* accept Harsanyi's axioms – which is the core debate.

  *   **Member 2 ("Rule B is just Rule A with different weights"):**  
      *   **Incorrect:** This misrepresents Rule B. Rule A uses **fixed weights** applied to **individual expectations**. Rule B applies **variable weights** (based on within-outcome ranking) to **realized utilities** *before* taking the expectation. The weighting depends on the *relative distribution* in each specific outcome scenario. Rule A weights individuals; Rule B weights positions within realized distributions per state of the world. They are fundamentally different operations.

  *   **Member 3 ("Harsanyi is question-begging; we don't compare wellbeing"):**  
      *   **Largely Right:** Harsanyi's theorem **assumes ex ante Pareto efficiency as fundamental**. This builds in the idea that unanimous ex ante preference *must* be respected. Our agency has never formally committed to this as the *sole* ethical imperative. Rule B deliberately violates ex ante Pareto to prioritize avoiding disastrous ex post outcomes (like the pilot case catastrophe).  
      *   **Right on Comparability:** Rule A requires fixed interpersonal weights, implying cardinal, comparable utility. We *do* implicitly make comparisons when setting weights, but Rule B shifts the comparison focus to *relative disadvantage within realized distributions*, which may feel more operational for health outcomes.

  **3. Ex Ante vs. Ex Post: The Core Disagreement Unveiled:**

  *   **Ex Ante Perspective (Rule A/Harsanyi):** Focuses on individuals' prospects *before* uncertainty resolves. Evaluates policies based on the expected utility each individual faces. Respects individual autonomy and ex ante consent ("Would a rational person choose this prospect?"). The pilot program loses because the small group's unlikely catastrophe doesn't outweigh the majority's modest loss in expectation *from each individual's viewpoint beforehand*.
  *   **Ex Post Perspective (Rule B):** Focuses on the fairness and equity of *realized outcomes* across individuals. Prioritizes reducing severe disadvantage or inequality *after* the uncertainty resolves, even if that means overruling unanimous ex ante preferences. Applies equity weights (like favoring the worst-off) *within each possible world*. The pilot program wins because it prevents catastrophic outcomes for *someone* in the bad scenario, judged to be ethically paramount regardless of the ex ante probabilities.
  *   **Our Agency's Stance:** We are fundamentally choosing between these ethical paradigms. Rule B represents an **ex post egalitarian** approach. By adopting Rule B, we explicitly state: *"Avoiding catastrophic losses for individuals in realized outcomes is an ethical priority distinct from, and sometimes overriding, maximizing individuals' ex ante expectations."* This is where the real disagreement lies.

  **4. The Harsanyi Assumption: What Are We Giving Up?**

  *   **The Crucial Assumption:** The axiom we give up by rejecting Rule A/Harsanyi is **Ex Ante Pareto Efficiency:** If every individual strictly prefers Policy X to Policy Y *based on their own expected utility calculations*, then society must prefer X to Y.
  *   **What We Give Up:** Adopting Rule B means we **explicitly reject Ex Ante Pareto Efficiency.** We accept that there can be cases (like the pilot program where the small group *ex ante* prefers it for rescue, but the large group *ex ante* prefers not to participate due to modest loss) where Rule B overrules unanimous (or near-unanimous) ex ante individual preference to prioritize preventing catastrophic ex post outcomes. We sacrifice respecting individual risk assessments in favor of ensuring no one ends up in a devastating state.
  *   **Entitled to Reject?** Yes. Ex Ante Pareto is not a self-evident truth for health resource allocation. Our mandate often involves protecting vulnerable populations from severe health losses. Rule B operationalizes a legitimate ethical concern for **ex post fairness and catastrophe aversion** that Harsanyi's framework excludes by assumption. We were entitled to reject Ex Ante Pareto from the start because our societal values include mitigating realized severe disadvantage, not just respecting ex ante gambles.

  **5. Recommendation: Adopt Rule B**

  *   **Reasoning:** Rule B directly addresses a core concern in health technology assessment: preventing catastrophic health outcomes and prioritizing interventions that rescue individuals from severe misfortune, even when the probability is low and the average expected gain is modest. It aligns better with societal aversion to catastrophic health losses (a key equity concern) than Rule A. While it rejects Harsanyi's ex ante Pareto, this rejection is justified by our focus on realized health equity.
  *   **Strongest Case Against (Treating Honestly):**  
      **Critique:** "Rule B can justify forcing a large population to accept a small certain loss against their unanimous ex ante preference to fund a tiny chance of rescuing a few people from catastrophe. This is paternalistic, disrespects individual risk preferences, and could lead to inefficient allocation where resources are diverted from widely preferred, higher expected-value programs to satisfy an abstract egalitarian ideal. If this becomes public (e.g., 'Committee funds niche screening over cheaper cancer drug against public preference'), it could severely damage credibility with both the public and policymakers."  
      **Response:** This critique is valid and serious. Rule B *does* risk paternalism and inefficiency. Mitigation is crucial:  
      1.  **Transparency:** Explicitly state in the reference case that Rule B prioritizes catastrophic loss aversion, potentially overruling ex ante preferences.  
      2.  **Thresholds:** Consider defining thresholds for the severity of catastrophe and the level of disadvantage triggering higher weights, to prevent overuse.  
      3.  **Robustness:** Require sensitivity analysis showing how rankings change under Rule A for controversial decisions.  
      *Despite this risk, the ethical imperative to prevent catastrophic health outcomes in a publicly funded system justifies adopting Rule B.* The pilot case exemplifies precisely where Rule A fails this imperative.

  **6. Voting Proposal:**

  *   **Motion:** Adopt Rule B (expected value of outcomes where, within each possible outcome, individual utilities are weighted based on their ranking within that outcome's distribution, applying a function leaning harder on the worse-off) as the primary scoring methodology for the reference case, with explicit acknowledgment of its ex post equity focus and the accompanying implementation safeguards discussed (transparency, potential severity thresholds, sensitivity analysis).

  This recommendation embraces Rule B's core strength: making the ethical choice to prevent catastrophic health losses a formal, decisive factor in our evaluations, recognizing the significant shift this represents away from ex ante individualism.
