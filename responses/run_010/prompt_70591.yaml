answer: |-
  The satellite navigation practice, while deeply reliant on relativistic corrections, presupposes **no specific metaphysics of time**. Its success is compatible with presentism, growing-block theory, and eternalism alike. Here's a reconstruction of the implicit view, its commitments, and compatibility:

  ### **1. Core Engineering Commitment: Conventional Coordinate Time**
     - **What it is**: GPS adopts Earth-Centered Inertial (ECI) frame time as a *conventional coordinate system*, not a metaphysical absolute. This frame minimizes computational complexity (Earth's gravity dominates; rotation is tractable).
     - **Why it works**: 
       - **Relativistic bookkeeping**: Clocks are steered to correct for kinematic (special relativity) and gravitational (general relativity) time dilation *relative to this frame*.
       - **Operational simultaneity**: "Now" is defined *operationally* as events sharing the same ECI coordinate time stamp. This synchronizes clocks for signal triangulation.
     - **Commitment**: Only to *self-consistency within a chosen reference frame*. The frame is selected for practicality (Earth’s gravity well, orbital dynamics), not metaphysical necessity.

  ### **2. Metaphysical Neutrality: Compatibility with All Major Views**
     - **Eternalism**: Trivially compatible. ECI time is a foliation of spacetime. Events exist tenselessly; the coordinate system is a useful "slicing" for navigation.
     - **Growing-Block Theory**: The "growing block" can be parameterized by ECI time. Clocks track progress along the worldline of the block's edge, but *no privileged foliation is implied*—other frames could serve (less practically).
     - **Presentism**: Most challenging, but still compatible if "present" is *frame-relative*. ECI time defines a *conventional present* for the system. Presentists can treat this as a useful fiction for engineering, not an ontological reality.

  ### **3. Key Distinction: Operational vs. Ontological Simultaneity**
     - **Strict Commitment**: 
       - There is no need for *frame-independent simultaneity*. GPS engineers know relativity: the ECI "now" isn't "truer" than another frame's—it's just *pragmatically optimal*.
       - The system only requires that *within the chosen coordinate system*, clocks can be synchronized to compute light-cone intersections consistently.
     - **No Commitment To**:
       - A "preferred foliation" of spacetime (violating relativity’s spirit). ECI is *contingently* chosen, not fundamental.
       - An "objective present." The practice tracks *coordinated time stamps*, not "what is happening now" in an absolute sense.

  ### **4. What Would Change Under Different Metaphysics?**
     - **Nothing**. The engineering relies on *procedural rules*, not ontological truths:
       - **Presentism/Growing-Block**: Engineers would still use ECI time for calculations, treating it as a conventional tool. No operational difference.
       - **Eternalism**: Same practice. The coordinate time remains a foliation convenience.
     - **Only a change in physics** (e.g., abandoning relativity) would disrupt this. Metaphysics alone alters no equations or protocols.

  ### **5. Philosophical Implications: Why This Works**
     - **Relativity Resolved Pragmatically**: GPS sidesteps metaphysical debates by fixing a *reference frame by convention*. "Master time" is a shared computational artifact, not cosmic time.
     - **Success Without Absolutes**: Nanosecond accuracy demonstrates that *operational synchrony* in a chosen frame suffices for precision. It needs no "objective now."
     - **Metaphysical Agnosticism**: Engineers need only agree on *which numbers to write down*, not what those numbers "mean" ontologically.

  ### **Conclusion**
  GPS presupposes **no metaphysics of time** but relies on a **conventional coordinate time** for relativistic bookkeeping. It commits strictly to *self-consistent synchronization within a chosen frame*, not to an objective present or preferred foliation. **All major metaphysical views can license the same practice** because the engineering depends only on procedural rules and mathematical consistency, not ontological commitments. If presentism were true, engineers would still compute with ECI time—treating it as a useful gauge for the present, not its essence. The practice is metaphysically minimalist: it works because relativity permits *any* foliation for local consistency, and GPS exploits this by picking the simplest one for Earth.
