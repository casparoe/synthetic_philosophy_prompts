answer: |-
  Your interview's through-line: **How Nyāya’s defence of exactly four irreducible *pramāṇas* (sources of knowledge) avoids both the Mīmāṃsaka’s expansion and the Buddhist’s contraction while maintaining internal coherence regarding the nature and operation of knowledge itself.**

  1.  **Postulation:** You reduce *arthāpatti* (postulation) to inference (*anumāna*), resolving the tension in the stout man case by inferring nocturnal eating. Where does the required pervasion ("If someone is stout and doesn’t eat by day, they eat at night") originate, given it cannot be established by perception alone without already assuming the postulated nocturnal eating?
      *   *Follow-up:* If she answers that this pervasion is established by ordinary perception of correlations or testimony, then press whether this reduction smuggles in the very postulate (*arthāpatti*) as a necessary premise for establishing the pervasion needed to eliminate it, rendering the reduction question-begging.

  2.  **Testimony:** You argue *śabda* (testimony) cannot be reduced to inference based on the speaker’s reliability. What then grounds the warrant for accepting a speaker *as* reliable, if not ultimately circularly reliant on further testimony? Does this grounding commit you to either an infinite regress of justifications or a foundationalist stance?
      *   *Follow-up:* If she answers that warrant for speaker reliability arises from direct perception of trustworthiness or successful past inferences independent of testimony, then press whether this commits Nyāya to a foundationalist epistemology where certain perceptual or inferential cognitions bear intrinsic, non-testimonial warrant – and how this fits the theory’s overall structure.

  3.  **Memory:** You deny memory (*smṛti*) is a *pramāṇa* because it yields nothing new. Yet the cause of an inference (*anumāna*) is the subject’s awareness of the *vyāpti* (pervasion link), which is invariably remembered. What is the epistemic status of this remembered *vyāpti* awareness?
      *   *Follow-up:* If she answers that the remembered *vyāpti* awareness is not itself a *pramā* (knowledge-episode) but a causally necessary condition for the inferential *pramā*, then press whether the causal chain generating new knowledge (*pramā*) can legitimately run through a cognition (the remembered *vyāpti*) that lacks the status of knowledge itself.

  4.  **Absence:** You analyse perception (*pratyakṣa*) of absence (*abhāva*) via its counterpositive (*pratiyogin*). How does invoking the counterpositive allow an absence, which lacks causal efficacy, to become an object of the causal perceptual relation?
      *   *Follow-up:* If she answers that we perceive the absence *through* the non-perception of the counterpositive where it is expected, then press what prevents *every* perception of a positive entity (say, a pot) from simultaneously being a perception of the absence of all other possible counterpositives (e.g., cloth, absence-of-cloth, etc.), leading to cognitive overload.

  5.  **Extraordinary perception:** To secure universal *vyāpti* from finite particulars, you invoke *sāmānyalakṣaṇa* (perception of the universal). Does positing this mode genuinely explain our grasp of universals governing *vyāpti*, or does it merely relabel the problem – asserting we perceive universals without explaining the mechanism?
      *   *Follow-up:* If she answers that *sāmānyalakṣaṇa* is a distinct, irreducible perceptual capacity, then press what substantive content remains for the notion of "perception" (*pratyakṣa*) once it is stretched to include direct cognitive contact with abstract universals beyond any particular sensory encounter.

  6.  **The stopping rule:** What principled criterion determines that only these four capacities – perception, inference, comparison (*upamāna*), testimony – are irreducible *pramāṇas*, excluding others like postulation or including more? Why precisely four?
      *   *Follow-up:* If she answers that irreducible *pramāṇas* are defined by producing new knowledge not analysable into the operations of the others, then press what specific analytic work shows *upamāna* (comparison – e.g., recognising a gavaya based on similarity to a cow) resists reduction to testimony and perception, while *arthāpatti* succumbs to reduction into inference.

  7.  **Knowledge definition:** You define *pramā* (knowledge) as a true cognition generated by a *pramāṇa*. Does this imply that a cognition which is true but produced by a defective or non-standard process – say, a true belief formed by a guess – still counts as knowledge, simply by virtue of being true and caused by *some* mental process?
      *   *Follow-up:* If she answers that no, only cognitions produced by the specific, non-defective functioning of one of the four *pramāṇas* count as *pramā*, then press whether this makes the *pramāṇa* condition analytically true but vacuous, or whether there is an independent criterion for the "proper functioning" of a *pramāṇa* beyond simply yielding a true cognition.

  8.  **Causal vs. justificatory role:** You emphasise the *pramāṇa* as the unique causal instrument (*karaṇa*) for each type of *pramā*. How does this causal-instrumental role relate to the *pramāṇa*'s role in providing justification? Could perception and inference alone, as the most fundamental causal instruments, theoretically cause all knowledge, even if testimony and comparison involve distinct causal routes?
      *   *Follow-up:* If she answers that the distinct causal routes *constitute* distinct types of justification irreducible to perception/inference, then press whether the fundamental Nyāya commitment is thus to distinct *causal origins* for knowledge-states, rather than distinct *logical structures* of justification, as the reason for maintaining four *pramāṇas*.
