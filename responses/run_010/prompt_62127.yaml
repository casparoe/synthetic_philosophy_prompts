prompt: |-
  I am drafting the theoretical section of a paper on when market data counts as evidence, and I want to know whether the verdicts I keep arriving at add up to a single principle. I will state them as concretely as I can, together with the setting several of them presuppose.

  Setting: the Tessera exchange is a single-unit sealed-bid double auction on a claim that pays either 0 or 100 at a fixed future date. Participants bid anonymously. Every executed trade is eventually published, together with the identities of both sides, but with a random lag of one to nine days drawn independently of everything else.

  1. A block purchase by a firm widely known to hold proprietary models of the underlying outcome: strong evidence about value. I move my own estimate substantially.
  2. A sale by an investor publicly known to be liquidating to meet a margin call: no evidence about value. I do not move, and I think it would be a mistake to move.
  3. The same liquidating investor turns out also to have received a bad signal, and the sale cleared at a price well below what their own model would have supported: now I treat the trade as evidence, and as *stronger* evidence than in case 1, because two independent motives had to coincide.
  4. A purchase by an algorithmic market-making program whose rulebook is fully published and whose trigger conditions I can compute from public data: no evidence, since I could have predicted the trade without knowing anything the market did not already know.
  5. A purchase by a trader who has publicly committed to buying whenever a private signal crosses a threshold, where the threshold is known to me but the signal is not: evidence, and I can state exactly how much — my posterior jumps to the probability conditional on the signal having crossed.
  6. A trade published after the nine-day lag: weaker evidence than the identical trade published immediately, even though the information it carries is the same. My reason is that a trader sitting on fresh, strong information would have found a faster venue, so the delay itself makes an informational motive less likely.
  7. Two analysts, both of whom I regard as competent and honest, who have exchanged every piece of evidence they possess and still assign different probabilities: I think at least one of them must be going wrong somewhere — about the evidence, about their own inference, or about what the other believes.
  8. A physician and a patient's spouse, both competent and honest, who have pooled everything they know and still assign different probabilities to survival: I think both can be entirely reasonable, and that nothing has gone wrong.
  9. A market in which I am certain that all participants share my prior, are fully rational, and began from an efficient allocation: I think no voluntary trade should occur at all, and that if one did occur I should read it as evidence against my model of the participants rather than as evidence about the asset.
  10. The same market, except that I hold my model of the participants with high confidence instead of certainty: I now think a trade *is* evidence about the asset, though its weight depends on how easily the model could be false.

  My tentative principle is that an observed trade is evidence about value just in case it was caused by private information about value. I am fairly sure this is wrong, though I cannot say precisely how. Cases 2 and 4 come out right, but perhaps for the wrong reason; case 6 is caused by information yet its weight is diminished by something other than its informational content; case 3 is caused by two things at once and the principle gives me no handle on why the conjunction should strengthen rather than dilute; and case 9 is the one I find hardest, since a no-trade result of the kind I have in mind implies that under those assumptions no trade should occur, so an observed trade ought to be maximally surprising — yet I insist it is not evidence about the asset.

  What I would like from you:

  (a) State the principle, or the small set of principles, that generates these verdicts as precisely as you can, making explicit what the evidential weight of a trade is a function of — I want something I could in principle use to compute a weight, not a slogan.

  (b) For each clause of the principle, name the case above that forces it in, so I can see which of my verdicts is doing the real work.

  (c) Say which of my verdicts the principle cannot deliver, and which of them I should therefore abandon rather than accommodate by adding further clauses.

  (d) Give the principle's verdicts on two cases I have not listed: a purchase by a firm known to be buying because a competitor's public filing implies good news about the outcome, and a purchase on Tessera by a trader whose identity is published but whose motive is unknown to me.

  (e) Explain whether the principle can live alongside the standard result that agents with a common prior and common knowledge of one another's rationality and evidence cannot rationally persist in disagreement — and if it can, say what distinguishes case 7 from case 8, since the two look to me structurally identical.

  I do not want a survey of the literature or a list of sources; I want the principle and its consequences.
reasoning: |-
  Hmm, the user is working on a paper about when market data counts as evidence and wants to see if their various case judgments can be unified under a single principle. They've listed 10 specific scenarios involving trades on this "Tessera exchange" along with their intuitive judgments about whether each trade provides evidence about the asset's value. 

  The user has proposed a tentative principle that "an observed trade is evidence about value just in case it was caused by private information about value" but correctly suspects this is inadequate. They're particularly troubled by cases where:
  - Multiple causes strengthen evidence (case 3)
  - Delay weakens evidence despite same information (case 6)
  - Identical structures yield different disagreement verdicts (cases 7 vs 8)
  - No-trade theorems create paradoxes (cases 9-10)

  The core challenge seems to be disentangling three layers:
  1. The informational content of the trade itself
  2. The reliability of the actor's motives
  3. The market conditions enabling inference

  For case 7 (analysts) vs case 8 (physician-spouse), the difference likely lies in the nature of evidence integration. Medical prognoses involve irreducible subjective synthesis of complex clinical factors, whereas financial analysis is expected to be computationally reducible to shared algorithms. This speaks to the "common framework" requirement in the principle.

  For the new cases:
  - Competitor trigger: Should be strong evidence since it reveals new public information processing
  - Unknown motive: Weak evidence since reliability is uncalibrated

  The no-trade theorem cases (9-10) expose how evidence weight depends entirely on the observer's confidence in their model of market participants. This suggests evidence isn't binary but probabilistic based on model uncertainty.

  The user's instinct that case 3 (conjoined motives) strengthens evidence is particularly insightful - it shows that evidence weight compounds when multiple independent pathways point to the same conclusion. Their hesitation about case 9 is also justified; the trade there is evidence against the model, not the asset, which the principle captures through the model-dependence clause.

  What they might still be missing is how the principle handles counterfactuals - e.g., in case 6 (delayed trade), the key isn't just the delay itself but what the delay implies about alternative trading options the actor didn't take. This is why the principle includes "feasible alternatives."
answer: |-
  Here is a unified principle derived from your judgments, expressed computationally, followed by a systematic breakdown addressing your queries. The core insight is that **evidential weight depends on the *reliability* of the trader as a signaler of value, which is determined by the *informativeness* of their action *conditional on their motives and constraints*, and the *observer's confidence in the model* assigning these motives.**

  ### The Principle
  **Defined:** The evidential weight of trade \( T \) (buy/sell at price \( P \)) on claim value \( V \) for observer \( O \) is:  
  \[ \text{Weight}(T) = \Delta_I \cdot \text{Rel}(A) \cdot \text{Conf}(M) \]  
  Where:  
  - **\(\Delta_I\) (Information Surprise):** The Kullback-Leibler divergence \( D_{\text{KL}}(P(V|\text{Action}, \text{Motive}) \parallel P(V)) \).  
  - **\(\text{Rel}(A)\) (Action Reliability):** \( 1 - \Pr(\text{Action} | \neg \text{Informative Motive}, \text{Constraints}) \).  
  - **\(\text{Conf}(M)\) (Model Confidence):** \( O \)’s credence that their model of trader motives/constraints is correct.  

  ### Clause Breakdown & Supporting Cases
  1. **\(\Delta_I\) (Information Surprise)**  
     - *Function:* Measures how much the action updates \( V \) given the *specific motive*. Requires modeling the counterfactual: "What would they do if uninformed?"  
     - *Forced by:* **Case 5** (committed threshold trader). \(\Delta_I\) is high because \( P(V|\text{signal} > \text{threshold}) \) is computable and differs sharply from the prior.  
     - *Also explains:* **Case 3** (liquidation + bad signal): Conjunction of motives *reduces* \(\Pr(\text{Sale} | \neg \text{Informative Motive})\) → increases \(\text{Rel}(A)\), making \(\Delta_I\) more salient.  

  2. **\(\text{Rel}(A)\) (Action Reliability)**  
     - *Function:* Discounts actions explainable by non-informative motives (liquidation, algos) or constraints (delay). Key is *feasible alternatives*: Could they act this way *without* information?  
     - *Forced by:*  
       - **Case 2** (margin call): \(\text{Rel}(A) \approx 0\) since sale is likely even if \( V \) is high.  
       - **Case 4** (published algo): \(\text{Rel}(A) = 0\) because action is predictable sans information.  
       - **Case 6** (delay): \(\text{Rel}(A) < 1\) because delay makes non-informative motives (e.g., liquidity rebalancing) more plausible → lowers \(\Pr(\text{Trade} | \text{Info})\) due to feasible faster venues.  

  3. **\(\text{Conf}(M)\) (Model Confidence)**  
     - *Function:* Scales weight by \( O \)’s trust in their own model of trader motives/rationality.  
     - *Forced by:* **Cases 9 & 10**.  
       - Case 9: \(\text{Conf}(M) = 1\) → Trade contradicts model → evidence *against model* (Weight ≈ 0 for \( V \)).  
       - Case 10: \(\text{Conf}(M) < 1\) → Trade may reflect model error → evidence *for V* (Weight > 0).  

  ### Verdicts the Principle Cannot Deliver (and Should Be Abandoned)
  - **Case 7 vs. Case 8 Discrepancy:** Your verdict for **Case 7** (analysts *must* have an error) conflicts with **Case 8** (both reasonable). The principle treats disagreements symmetrically; both cases have \(\text{Conf}(M) < 1\) for \( O \)’s model of the analysts/physician.  
     - *Resolution:* Abandon the **Case 7** verdict. Disagreement with pooled evidence *can* persist without irrationality if agents:  
       (i) Process complex evidence differently (e.g., clinical intuition vs. actuarial tables),  
       (ii) Have differing risk attitudes affecting probability weighting.  
     - *Principle’s Verdict:* Both cases have \(\text{Weight}(\text{disagreement}) > 0\) for \( O \)’s belief, but does not force an "error" conclusion.  

  ### Verdicts on New Cases
  1. **Purchase driven by competitor’s public filing:**  
     - \(\Delta_I\): High (filing implies good news → updates \( V \)).  
     - \(\text{Rel}(A)\): High (trade is *caused* by new public info; unlikely without info).  
     - \(\text{Conf}(M)\): High (if motive is transparent).  
     - **Verdict:** Strong evidence (**similar to Case 1**).  

  2. **Purchase by trader with published identity but unknown motive:**  
     - \(\Delta_I\): Ambiguous (unknown if action depends on \( V \)).  
     - \(\text{Rel}(A)\): Low (many non-informative motives feasible; identity alone ≠ known intent).  
     - \(\text{Conf}(M)\): Low (no model of motive).  
     - **Verdict:** Weak evidence (**similar to Case 6 without delay**).  

  ### Compatibility with No-Disagreement Theorems
  - **Yes, with a caveat.** The principle treats "common prior + common knowledge of rationality" as a *model* (\( M \)) with \(\text{Conf}(M) \leq 1\).  
  - **Case 7 vs. Case 8 Distinction:**  
    - **Case 7** (analysts): Assumed to share identical rational processing rules → disagreement violates \( M \) → \(\text{Conf}(M)\) declines.  
    - **Case 8** (physician/spouse): No assumption of identical processing → \( M \) allows divergent priors on evidence interpretation → \(\text{Conf}(M)\) remains high.  
  - **Key Difference:** The principle permits \(\text{Conf}(M) < 1\) for rational-agent models when agents have:  
    - Heterogeneous computational methods (e.g., heuristic vs. Bayesian),  
    - Non-overlapping expertise (e.g., emotional insight vs. medical training).  

  ### Summary of Adjustments
  - **Keep:** Cases 1–6, 8–10.  
  - **Abandon:** Case 7 verdict (disagreement need not imply error).  
  - **Refined Principle:** Evidence weight is multiplicative in:  
    (i) *Information gain* given motive (\(\Delta_I\)),  
    (ii) *Action specificity* to information (\(\text{Rel}(A)\)),  
    (iii) *Observer’s model confidence* (\(\text{Conf}(M)\)).  

  This framework generates all your verdicts except Case 7, which overreaches on rational consensus. It explicitly quantifies weight via counterfactual action probabilities and model uncertainty—enabling computation if motive/constraint distributions can be specified.
