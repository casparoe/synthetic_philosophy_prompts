answer: |-
  Here’s a ruthlessly prioritized agenda, argued from first principles. I attack your hunch only to refine it: the **input problem is central**, but it *must* be coupled with **testimony** (#7) and **partition dependence** (#2). Everything else is either downstream, tractable only with advanced math, or a pseudo-problem for your goals. I cut 6 of your 10 items. Below: the ranking, crux, cuts, and evidentiary triggers.

  ---

  ### **The Core Agenda (Ranked)**
  1. **The Input Problem (#1) + Testimony (#7)**  
     **Why inseparable:** When evidence is another agent’s report (e.g., a forecast, model output, or sensor reading), the "input" probabilities are *inferences* about the source’s reliability and semantics. Jeffrey’s rule assumes you magically have P_new(E_i); in practice, you get a *message* (e.g., "the gauge reads 5" or "P(H)=0.8"). You must jointly solve:  
     - What partition {E_i} is relevant? (E.g., is E_i="true state is x" or "gauge is malfunctioning"?).  
     - What does the message imply about P_new(E_i)? (E.g., if a model says "P(H)=0.8", is this calibrated? Corrupted by noise?).  
     **Why open:** No formal guidance exists for mapping messages to partitions/probabilities without ad hoc assumptions.  
     **Dependencies:** #2 (partition choice) is upstream; #5/8/9 downstream.  
     **Tractability:** High. Use case studies: e.g., "A weather model outputs P(rain)=0.7. What is P_new(rain) if I trust it 80%? What if I suspect bugs?" Formal member derives constraints (e.g., under what conditions P_new must equal the report). Others build intuition via decision trees.  
     **Satisfying outcome:** A decision procedure for common testimony types (numbers, sentences, images) that outputs {E_i} and P_new(E_i). Example: "For numerical reports, partition by reliability scenarios; set P_new(E_i) via Bayes against your prior reliability estimate."  

  2. **Partition Dependence (#2)**  
     **Why critical:** Different partitions *can* yield different posteriors for the same evidence. Example: Observing "gauge reads 5" could partition as {faulty, not faulty} or {true value=5, true value≠5}. If you set P_new(not faulty)=0.9 in first partition, but P_new(true value=5)=0.9 in the second, posteriors for H="system is safe" may differ.  
     **Why open:** No general principle forces a "correct" partition. Coherence arguments fail without certainty.  
     **Dependencies:** Input problem (#1) dictates partition choice; #5/9 depend on resolving this.  
     **Tractability:** Moderate. Formal member proves partition dependence *must* arise when evidence isn’t a proposition (pen-and-paper: show two partitions for same message yielding different P(H)). Group explores heuristics: e.g., "Choose the coarsest partition capturing all semantically distinct outcomes of the message."  
     **Satisfying outcome:** Heuristics for minimizing arbitrariness + proof that no universal solution exists.  

  3. **Old Evidence (#5)**  
     **Why valuable:** Kinematics *may* handle old evidence better than classical Bayesianism. If E is already known (P_old(E)=1), classical conditioning cannot boost P(H|E). But Jeffrey can: shift probability *within* E. Example: E="Mercury’s orbit is anomalous", known pre-relativity. Jeffrey lets you reassess P_new(H|E) upon hearing Einstein’s explanation, even though E is old.  
     **Why open:** Does this solve the problem, or just relabel it? Depends on #1 (input).  
     **Dependencies:** Input problem (#1) is key (how do you set P_new for subpartitions of E?).  
     **Tractability:** High. Case-based: Apply to historical examples (e.g., Mercury’s orbit). Formal member shows classical updating fails here; others model shifts in P(H|E).  
     **Satisfying outcome:** A template for updating on reinterpretations of old data.  

  ---

  ### **What to Cut (With Prejudice)**
  - **Order Dependence (#3):** Pseudo-problem. Non-commutativity vanishes if partitions are sufficiently fine-grained (e.g., include all relevant details). If not, it’s a symptom of poor partition choice (#2). **Cut.**  
  - **Failure of Rigidity (#4):** Artifact of misapplied kinematics. If conditionals aren’t rigid, you’re updating on more than the partition—expand the partition or use a different rule. Not kinematics’ job. **Cut.**  
  - **Indexical Evidence (#6):** Disguised problem of partition selection (#2). Sleeping Beauty reduces to whether you partition on "current day" or "total awakenings." **Cut.**  
  - **Competition Among Rules (#8):** Premature. Until kinematics is usable (#1/#2/#7), comparing rules is theory golf. Max-entropy is a separate (and messier) paradigm. **Cut.**  
  - **Justification (#9):** Requires measure theory. Dynamic Dutch books for kinematics exist but need advanced math. Your group lacks tools; permissive justification suffices for now. **Cut.**  
  - **Descriptive Question (#10):** Irrelevant to your goal of normative positions. **Cut.**  

  ---

  ### **The Crux: Diachronic Coherence Sans Certainty**
  Your suspicion is correct: **Everything hinges on whether diachronic coherence has normative force when no proposition becomes certain.**  
  - If "coherence" is merely *avoiding sure loss* (the Dutch book stance), kinematics is sufficient but not necessary. Partition choice (#2) becomes a pragmatic exercise.  
  - If coherence requires *systematic justification of belief shifts* (e.g., "your update should be explainable as rational learning"), the input problem (#1) demands principled constraints.  
  **Why this is the crux:** Resolving it tells you whether to seek *unique* solutions to #1/#2 (if coherence is strong) or settle for *adequate* heuristics (if coherence is weak).  

  ---

  ### **Evidentiary Triggers for Re-Ranking**
  - **If** exploring testimony (#7) reveals that inputs *must* incorporate reliability estimates (e.g., via Bayesian hierarchical models), **then** #1/#7 rise in priority.  
  - **If** old evidence (#5) cases *require* partition refinement (#2) to work, **then** #2 jumps above #5.  
  - **If** the formal member proves that *no* input procedure avoids arbitrariness without stronger coherence norms, **then** the crux debate dominates everything.  

  ---

  ### **Execution Strategy for 18 Months**
  1. **Months 1–6:** Attack testimony (#7) as a concrete instance of the input problem (#1). Build case studies (e.g., updating on climate models, medical tests).  
  2. **Months 7–12:** Generalize to partition dependence (#2). Test heuristics on cases from #7.  
  3. **Months 13–18:** Apply insights to old evidence (#5). Draft positions.  
  **Why this works:** #7 makes #1 tangible. #2 emerges naturally from #7’s complexities. #5 validates the framework. Total effort: ≈1,800 person-hours. Formal work focuses on proofs of impossibility/constraints; others build cases and intuition.  

  Aim for **two outputs**:  
  - A short paper on testimony as a bridge between kinematics and input design.  
  - A position paper arguing that partition choice is where epistemology meets pragmatics.  

  This agenda burns the dead wood and forges a practical path through the forest. Ignore the echoes of academia; your goal is ground truth, not footnotes.
