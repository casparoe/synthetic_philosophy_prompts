prompt: |-
  I'm on the editorial review board for a big intro-biology textbook, and Thursday we vote on a bundle of flaged passages that turn out to be the same problem wearing different clothes: the manuscript uses "function" in two different senses and nobody caught it until an outside reviewer blew up.

  Three of the flagged items:

  - The digestive chapter calls the appendix vestigial, then a sidebar two pages later says its function is to shelter good bacteria so the colon can be repopulated after a bad bout of diarrhea. The reviewer says we can't have it both ways inside one chapter.
  - Chapter 12 leans on the panda's "thumb" — an enlarged wrist bone, a jury-rigged bit of anatomy — and the sentence reads "the function of the panda's thumb is to strip leaves off bamboo," which is a job the bone does now but not obviously what it was originally shaped for.
  - The genetics chapter says that in cystic fibrosis the CFTR protein's function is "disrupted." Read literally that's odd, because the mutant protein simply doesn't do the thing, so it isn't failing at anything it's currently doing.

  Our one board member who actually reads philosophy of biology says there's a whole literature here, and that "function" can mean either what selection shaped a trait to do or whatever it currently causally contributes to, and that the two come apart precisely in these cases. That hasn't settled anything. Half the board wants to standardize on the historical sense everywhere and rewrite to match; one member wants to ban "the function of X is to Y" outright as design talk in disguise and substitute "X contributes to Y"; and the physiology authors say strip function language out of thier chapters and the text stops being readable for a nineteen-year-old.

  Draft the memo I'll circulate before the vote. It has to land somewhere a copyeditor could apply it without asking me follow-up questions: a rule for telling which sense a given sentence is using and what to do about it, a short glossary entry we could print as-is, and your verdict on each of the three flagged items — what should the sentence say instead? Second-pass edits go to the printer in about six weeks, so nothing that amounts to a rewrite of the book. Be straight about which of the two senses your rule privileges, and what a student loses if we privilege it. And give the ban-it member a real hearing rather than a strawman: the strongest version of the worry is that function talk, even the historical kind, trains students to read purposes into nature, so say why the policy you're recommending survives that, or mark where it doesn't.
reasoning: |-
  Alright, the user is on an editorial review board for an intro biology textbook, and they're dealing with a significant issue: inconsistent use of the term "function" across different chapters. This has led to flagged passages where the term is used in two distinct senses—historical (selected effect) and current causal role. The challenge is to draft a memo that provides clear guidelines without requiring extensive rewrites, especially since the second-pass edits are due soon.

  First, I need to recall the two main senses of "function" in biology. The historical sense refers to what a trait was shaped by natural selection to do, while the current causal role is about what the trait actually does now, regardless of its evolutionary history. The three examples highlight the conflict: the appendix being called vestigial (historical) but later credited with a current role in gut flora; the panda's thumb described in terms of its current use; and the CFTR protein's function being "disrupted," which implies it has a purpose it's failing at, which isn't accurate for a non-functional mutant protein.

  The user's memo needs to address several stakeholders: board members who prefer standardizing on the historical sense, others wanting to ban function language altogether, and physiology authors concerned about readability for 19-year-olds. The key is to find a balance that maintains scientific accuracy while ensuring the text remains accessible. 

  For the memo structure, the user requested a rule for identifying which sense is being used, a glossary entry, and specific fixes for the flagged items. The rule should be actionable for copyeditors, perhaps by checking if the sentence implies evolutionary history or just current utility. The glossary needs to succinctly differentiate the two senses without overwhelming students.

  Considering the "ban-it" member's argument: they worry that function language implies design or purpose, which could mislead students. This is a valid concern in biology education, as teleological thinking is a common misconception. However, completely removing function language might make the text clunky and less engaging. The memo should acknowledge this but argue that consistent use of the historical sense, supplemented with causal role language where appropriate, can mitigate the risk. Emphasizing that natural selection is a non-teleological process might help.

  For the specific fixes:
  - Appendix example: Clarify that while historically vestigial, it currently serves a role. Reword the sidebar to avoid calling it a "function," instead stating it "may contribute" or "serves a role."
  - Panda's thumb: Change "function" to "current role" to separate its evolutionary origin from its present use.
  - CFTR protein: Avoid "disrupted" as it implies the mutant protein is attempting to function. Instead, note that mutations "prevent" the protein from performing its normal function.

  The memo should privilege the historical sense as the primary meaning of "function" in biology, as it aligns with evolutionary theory. However, it should allow for current causal language when explicitly framed, ensuring students understand the distinction. This approach maintains readability while reducing ambiguity. The trade-off is that students might still conflate the two senses, but the glossary and careful language can help.

  Finally, the memo needs to be concise, directive, and ready for implementation by copyeditors. Including a clear glossary entry and examples of edits will streamline the process. Acknowledging the philosophy behind the ban-it position but showing how the recommended policy addresses it is crucial for board buy-in.
answer: |-
  **MEMORANDUM**  
  **TO:** Editorial Review Board  
  **FROM:** [Your Name/Position]  
  **DATE:** [Current Date]  
  **SUBJECT:** Policy on "Function" Terminology & Handling Flagged Passages  

  ---

  ### **I. Core Problem & Resolution**  
  The manuscript inconsistently uses "function" in two distinct senses:  
  1. **Historical/Selected-Effect (SE) Function**: What a trait *was shaped by natural selection to do*.  
  2. **Current Causal Role (CR) Function**: What a trait *currently does or contributes* (regardless of evolutionary origin).  

  **Policy: Standardize on SE Function as the primary meaning of "the function of X is to Y."**  
  - **Why?** SE function is foundational to evolutionary biology, avoids teleological pitfalls when rigorously defined, and aligns with how biologists describe adaptations. CR language is permissible *if explicitly framed as "current role," "contribution," or "effect"* (not "function").  
  - **Student Trade-off:** Privileging SE function may initially feel abstract (it requires thinking historically), but it prevents deeper misconceptions. CR-only descriptions risk implying purpose is inherent, not evolved.  

  **Rule for Copyeditors:**  
  > **If the sentence implies "why this trait exists" or "what it was optimized for," use SE function.**  
  > **If describing "what it does now" (especially without evolutionary context), replace "function" with "role," "contribution," or "effect."**  
  > *Exception: In molecular/cellular contexts (e.g., "protein function"), SE is implied via conserved structure. Use "function" but avoid passive phrasing like "disrupted" for null mutants.*

  ---

  ### **II. Glossary Entry (For Text Insertion)**  
  > **Function (Biological):** The activity a trait was *shaped by natural selection* to perform, contributing to survival or reproduction in ancestral populations. Contrast with **Current Role**: a trait’s present-day effect, which may or may not align with its evolutionary function.  
  > *Example: Vertebrate eyes historically function for vision; in some species, they may currently play a role in thermal regulation.*  

  ---

  ### **III. Flagged Passages: Verdict & Edits**  
  1. **Digestive Chapter (Appendix):**  
     - **Problem:** "Vestigial" (SE) clashes with "function" (CR) in the sidebar.  
     - **Fix:**  
       - *Vestigial claim:* Keep as-is (SE: lost ancestral function).  
       - *Sidebar:* Rewrite: **"The appendix currently serves as a reservoir for beneficial gut bacteria, aiding in repopulating the colon after diarrheal illness."**  
     - *Rationale:* "Serves as" clarifies CR language without invoking SE function.  

  2. **Chapter 12 (Panda’s Thumb):**  
     - **Problem:** "Function" implies SE, but the thumb is an exaptation (CR role ≠ SE origin).  
     - **Fix:**  
       - Rewrite: **"The panda’s enlarged wrist bone currently acts to strip leaves from bamboo stalks."**  
       - *Add a footnote:* "This structure is an exaptation: its current role differs from its original selective function."  
     - *Rationale:* "Acts" denotes CR; the footnote explains evolutionary nuance without redesigning the section.  

  3. **Genetics Chapter (CFTR Protein):**  
     - **Problem:** "Disrupted function" inaccurately suggests the mutant protein attempts but fails.  
     - **Fix:**  
       - Rewrite: **"In cystic fibrosis, mutations prevent the CFTR protein from performing its chloride-transport function."**  
     - *Rationale:* "Prevent from performing" maintains SE function (what the protein *should* do) while acknowledging the mutant is inert.  

  ---

  ### **IV. Addressing the "Ban Function" Position**  
  **Strongest Counterargument:** *"Function" language (even SE) risks reinforcing design teleology, implying traits exist "for" a purpose rather than via selection.*  
  **Why This Policy Survives (Mostly):**  
  - SE function explicitly anchors purpose *in historical selection*, not agency. It trains students to ask: "What past advantage caused this trait to persist?"  
  - Banning "function" entirely would cripple pedagogy. Describing adaptations without it is needlessly verbose (e.g., "the heart contributes to circulation" lacks explanatory power).  
  - **Where It Doesn’t Fully Solve the Problem:** Students may still anthropomorphize "selection as a designer." This requires contextual teaching (e.g., "natural selection is not a conscious planner")—**beyond copyediting scope.**  

  ---

  ### **V. Implementation & Timeline**  
  - **Copyeditor Directive:** Apply the **Rule** (Section I) to all instances of "function." Use glossary and fixes above as templates.  
  - **Author Guidance:** Physiology chapters may use CR language freely *if* "function" is replaced with "role," "contribution," or "effect." SE "function" is mandatory for adaptation claims.  
  - **Deadline:** Edits compatible with 6-week revision window. No rewrite needed—changes are 1:1 phrasing swaps or brief inserts.  

  **Vote Recommendation:** Adopt this policy to resolve contradictions while preserving accessibility. Competing approaches (pure SE or CR standardization) create new problems; banning "function" ignores pedagogical reality.  

  ---  
  **APPROVED:** [ ]  
  **REVISIONS REQUESTED:** [ ]  
  **COMMENTS:** _________________________________________
