answer: |-
  Below is a decision tree designed to guide your workshop participants through structural features of their decision system to a fairness criterion or resolution, based solely on objective system properties. The tree uses the public housing authority example throughout, with all nodes phrased as operational questions answerable without fairness jargon. Jargon appears only at the leaves, along with trade-off information. The tree has **12 nodes** and **10 leaves**, including all requested criteria and resolutions.  

  ### Decision Tree  
  **Nodes** (Questions):  
  1. **N1:** Does the system output a continuous risk score (e.g., probability of arrears) or a final binary decision (e.g., "high-risk"/"low-risk")?  
  2. **N2:** Can the authority freely adjust the threshold for converting the risk score to a decision?  
  3. **N3:** Was the decision threshold set by an external requirement (e.g., law, contract) the authority cannot change?  
  4. **N4:** Is the outcome label (e.g., arrears) partly generated by the authority’s own prior decisions (e.g., reduced support for high-risk applicants)?  
  5. **N5:** Can the authority account for its influence on the outcome (e.g., via causal models or randomized trials)?  
  6. **N6:** Are group-specific base rates (e.g., arrears rates by race) estimated from the same population under identical measurement?  
  7. **N7:** Can the authority improve base rate estimation (e.g., by fixing data collection)?  
  8. **N8:** Are the outcome’s group-specific base rates approximately equal?  
  9. **N9:** Is the model’s prediction almost always correct (e.g., >95% accuracy)?  
  10. **N10:** Who primarily bears the cost of a false positive (e.g., wrongful high-risk label)?  
  11. **N11:** Is the group attribute (e.g., race) available when auditing decisions, even if forbidden at decision time?  
  12. **N12:** Can the authority act on the entire population (e.g., provide universal support) rather than just the classifier’s output?  

  **Leaves** (Resolutions):  
  - **L1: Calibration (Sufficiency)**  
    *Forced to give up:* Error-rate balance (if base rates differ).  
    *Licensed by:* Kleinberg et al. trade-offs.  
  - **L2: Error-Rate Balance (Separation) at Common Threshold**  
    *Forced to give up:* Calibration (if base rates differ).  
    *Licensed by:* Kleinberg et al. trade-offs.  
  - **L3: Separation at Group-Specific Thresholds**  
    *Forced to give up:* Independence (demographic parity).  
    *Licensed by:* None (design choice avoiding common threshold trade-offs).  
  - **L4: Predictive Parity**  
    *Forced to give up:* Error-rate balance at a common threshold.  
    *Licensed by:* Chouldechova incompatibility.  
  - **L5: Independence (Demographic Parity)**  
    *Forced to give up:* Calibration and predictive parity (if base rates differ).  
    *Licensed by:* None (legal/policy choice).  
  - **L6: Escape Hatch**  
    *Forced to give up:* Nothing (trade-offs vanish).  
    *Licensed by:* None (equal base rates or near-perfect prediction).  
  - **L7: Measurement-Skeptic**  
    *Forced to give up:* All criteria relying on the endogenous label.  
    *Licensed by:* None (endogeneity invalidates validation).  
  - **L8: Withdraw Automated Decision**  
    *Forced to give up:* Efficiency gains from automation.  
    *Licensed by:* None (precautionary principle).  
  - **L9: Change the World**  
    *Forced to give up:* Short-term resource efficiency.  
    *Licensed by:* None (intervention on root causes).  
  - **L10: Predictive Parity (Alternate Path)**  
    *Forced to give up:* Error-rate balance at a common threshold.  
    *Licensed by:* Chouldechova incompatibility.  

  ---

  ### Answer Key (Paths to Leaves)  
  Paths are written as sequences of node outcomes (e.g., `N1 → continuous → N2 → yes → ...`). The housing authority example follows **Path 7** (highlighted below).  

  1. **L1: Calibration**  
     `N1 → continuous → N2 → yes → N4 → no → N6 → yes → N8 → no → N9 → no → N10 → public → N11 → no → L1`  
     *Context:* Public bears FP cost (e.g., wasted support resources), group attribute unavailable at audit. Favors accuracy over equality.  

  2. **L2: Error-Rate Balance at Common Threshold**  
     `N1 → continuous → N2 → yes → N4 → no → N6 → yes → N8 → no → N9 → no → N10 → individual → N11 → no → L2`  
     *Context:* Individual bears FP cost (e.g., stigmatization), group attribute unavailable. Favors equal FPR/FNR across groups.  

  3. **L3: Separation at Group-Specific Thresholds**  
     `N1 → continuous → N2 → yes → N4 → no → N6 → yes → N8 → no → N9 → no → N10 → individual → N11 → yes → L3`  
     *Context:* Group attribute available for audit; authority can set group-specific thresholds to equalize error rates.  

  4. **L4: Predictive Parity**  
     `N1 → binary → N3 → yes → N4 → no → N6 → yes → N8 → no → N9 → no → N10 → public → N11 → yes → L4`  
     *Context:* Fixed binary decision; group attribute available for audit. Ensures equal PPV across groups.  

  5. **L5: Independence**  
     `N1 → continuous → N2 → no → N4 → no → N6 → yes → N8 → no → N9 → no → N12 → yes → L5`  
     *Context:* Authority can act on population (e.g., universal support) to force equal selection rates.  

  6. **L6: Escape Hatch**  
     `N1 → [any] → ... → N8 → yes → L6`  
     `N1 → [any] → ... → N9 → yes → L6`  
     *Context:* Equal base rates or near-perfect prediction nullifies trade-offs.  

  7. **L7: Measurement-Skeptic**  
     `N1 → continuous → N2 → yes → N4 → yes → N5 → no → L7`  
     **Housing Authority Path:** Endogenous arrears label (due to reduced support for high-risk applicants) and no correction method.  

  8. **L8: Withdraw Automated Decision**  
     `N1 → [any] → ... → N6 → no → N7 → no → L8`  
     *Context:* Base rates are flawed and unfixable (e.g., data from non-comparable populations).  

  9. **L9: Change the World**  
     `N1 → [any] → ... → N6 → no → N7 → yes → L9`  
     `N1 → [any] → ... → N12 → yes → L9`  
     *Context:* Authority can improve data collection (e.g., standardize support) or act upstream (e.g., universal rent assistance).  

  10. **L10: Predictive Parity (Alternate)**  
      `N1 → binary → N3 → no → N4 → no → N6 → yes → N8 → no → N9 → no → N10 → individual → N11 → yes → L10`  
      *Context:* Fixed binary decision; group attribute available for audit; individual bears FP cost.  

  ---

  ### Critical Notes  
  **1. Indistinguishable Leaves:**  
     - **Predictive Parity (L4/L10) vs. Calibration (L1):** With a well-calibrated continuous score, predictive parity and calibration converge (calibration implies PPV equality). The tree artificially separates them via node paths (N1: binary vs. continuous), but they overlap in practice.  
     - **Separation at Group-Specific Thresholds (L3) vs. Independence (L5):** If group-specific thresholds achieve identical selection rates, L3 and L5 coincide. The tree distinguishes them via N12 (authority’s capacity to act on the population), but this is often ambiguous.  

  **2. Unoccupied Paths (Coherent but No Leaf):**  
     - **Path A:** `N1 → binary → N3 → yes → N4 → yes → N5 → yes → N6 → no → N7 → yes → L9`  
       - *Diagnosis:* Endogenous outcome corrected; base rates flawed but fixable → "Change the world." This is coherent but rarely staked out. Most teams either assume base rates are reliable (proceeding to N8) or withdraw (L8) if unfixable.  
     - **Path B:** `N1 → continuous → N2 → no → N4 → no → N6 → yes → N8 → no → N9 → no → N10 → individual → N11 → yes → [No leaf]`  
       - *Diagnosis:* Fixed threshold, group attribute available for audit, individual bears FP cost. Logically, this could map to separation (L3) or predictive parity (L4), but the tree forces a choice via N1 (continuous vs. binary). This position is stable but unattractive: it demands error-rate equality without threshold control, which is often infeasible.  

  **3. Housing Authority Position:**  
     The example follows **Path 7 (L7: Measurement-Skeptic)**. This reveals the core problem: **arrears labels are corrupted by the authority’s prior screening decisions**. No fairness criterion evaluated against this label is meaningful. The only coherent resolutions are L7 (reject the label), L8 (withdraw the tool), or L9 (change support policies to de-bias labels). This path is the tree’s most valuable insight for your workshop—it forces participants to confront *outcome endogeneity* before debating fairness.  

  ---  
  This tree prioritizes structural inputs over values, uses a consistent example, and exposes trade-offs via impossibility results. It also flags where the tree oversimplifies (indistinguishable leaves) and where logical but unclaimed positions exist (unoccupied paths). For the housing authority, L7 (measurement-skeptic) is the unavoidable conclusion.
