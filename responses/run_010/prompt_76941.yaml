  ### Predictable Problems & Recovery  
  - **Problem:** Players struggle with the abstract "phantom board" in the oracle phase.  
    **Recovery:** Demo a 3x3 grid on the whiteboard. Show how Blue ignores Red’s first move and copies Red’s strategy step-by-step.  

  - **Problem:** Pre-marked stone feels "unfair," derailing focus.  
    **Recovery:** Clarify: "This isn’t cheating—it’s testing if an extra stone can *ever* be a weakness."  

  - **Honest Limitation:** The room can’t reproduce the proof’s **non-constructiveness** organically.  
    **Why:** Players experience a *simulated* strategy steal (via oracle cards), but the proof’s core contradiction—"if Blue wins, Red must win too"—requires abstract negation they won’t vocalize. **Mitigate:** Explicitly contrast the oracle’s "win with no plan" with their initial frustration in the debrief.
