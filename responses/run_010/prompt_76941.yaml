answer: |-
  ### Philosophy of Math Reading Group Session: Discovering Strategy-Stealing

  **Materials List**  
  - Graph paper (5x5 grids pre-drawn)  
  - Red and blue pens (one set per pair)  
  - "Oracle" cards (printed instructions for the secret partner)  
  - Timer (for phases)  
  - Whiteboard (to sketch a sample grid during intro)  

  **Oracle Card Text** (print as-is):  
  ```  
  SECRET INSTRUCTIONS FOR PLAYER 2 (BLUE)  
  You have a winning strategy for Player 1 (Red). Use it to win as Blue:  
  1. Ignore your first turn. Let Red place their first stone anywhere.  
  2. After Red’s first move, pretend you are Red. Use Red’s winning strategy for your moves.  
  3. When the strategy says "play in cell X":  
     - If X is empty, play a BLUE stone there.  
     - If X is taken, play a blue stone ANYWHERE else.  
  4. Win as Blue.  
  ```  

  ---

  ### Run Sheet  

  | Phase                | Minutes | What they do                                                                 | What they should hit                                                                 | What I say or do                                                                 |
  |----------------------|---------|------------------------------------------------------------------------------|-------------------------------------------------------------------------------------|---------------------------------------------------------------------------------|
  | **Intro & Gameplay** | 0-5     | Listen to rules.                                                            | Understand the connection game.                                                     | "Today, we’re playing a game. Goal: Connect your sides (Red: top-bottom, Blue: left-right). 5x5 grid, no diagonals. Alternate turns." Sketch a grid. |
  |                      | 5-20    | Play 3 rounds in pairs (switch roles).                                      | Frustration: Red seems to win, but no consistent opening. Blue can’t force a win.   | "Play best of three. Red starts. Find a winning first move for Red." Circulate, ask: "Can Blue *always* counter this?" |
  | **Oracle Twist**     | 20-25   | New pairs: One gets an oracle card (Player 2). Others play normally.        | Confusion: Player 2 (Blue) skips first turn, then dominates with "stolen" strategy. | "Some pairs get a secret advantage. Player 2: follow your card. Player 1: play as usual." Hand cards to Blue players secretly. |
  |                      | 25-40   | Play 2 rounds (oracle pairs only).                                          | Shock: Blue wins easily. "Borrowing" clicks.                                        | Observe. If stuck: "Player 2, remember: pretend their first move didn’t happen." |
  | **Premise Stress Test** | 40-50   | Play on a pre-marked board: Center stone is RED (placed before start).      | Alarm: Blue wins more often. Extra stone can hurt Red.                              | "New rule: A red stone is locked in the center. Red, your extra stone might block your path!" Distribute pre-marked grids. |
  |                      | 50-60   | Reuse oracle method on pre-marked board.                                    | Breakdown: "Stolen" strategy fails if center is problematic.                        | "Player 2 (Blue), try your oracle again. Does it still work?" |
  | **Silent Reflection** | 60-70   | Discuss in pairs: "Why did the oracle work, then break?"                   | Hypotheses: "Extra stone helps unless it backfires," "Strategy needs symmetry."     | "Jot down why Blue dominated at first, but struggled with the center stone." |
  | **Debrief**          | 70-75   | Group discussion.                                                           | Connect mechanics to proof structure.                                               | See debrief script below. |

  ---

  ### Debrief Script  
  *(Draw two columns on board: "Standard Game" / "Pre-marked Game")*  

  1. **Recap moments:**  
     - *Standard Game:* "When Blue used the oracle, they ignored Red’s first move and played 'as if' they were Red. What did that feel like?" → They stole Red’s strategy.  
     - *Pre-marked Game:* "Why did it fail?" → The fixed red stone sometimes blocked Red’s path.  

  2. **Map to proof assumptions:**  
     - **Premise 1 (Monotonicity):** "An extra stone never hurts you."  
       - *Activity exposure:* Oracle worked in the standard game because Blue copying Red’s strategy couldn’t backfire.  
       - *Breaks in:* Pre-marked board—extra stone *did* hurt Red by occupying a critical cell.  
     - **Premise 2 (Symmetry):** "A winning strategy for your opponent can be used as your own."  
       - *Activity exposure:* Oracle let Blue treat Red’s strategy as a blueprint, ignoring turn order.  
       - *Breaks in:* If the game isn’t symmetric (e.g., pre-marked stone breaks board symmetry), stealing fails.  

  3. **Non-constructive insight:**  
     - "The oracle proved Blue could win... but did it tell us *how*? No! We saw a winning strategy exists without knowing what it is—just like the proof."  

