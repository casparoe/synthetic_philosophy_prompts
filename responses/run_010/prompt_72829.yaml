prompt: |-
  I'm 17 and I'm the editor of my high school paper — about 1,800 students, six issues a year. Our district cut the budget so now ads have to cover like 40% of the printing bill, which means I've accidentally become the person who decides what we sell space to. Requests come in constantly and right now we settle them by vibes in a 20 minute meeting, and I don't think thats defensible.

  The part I keep getting stuck on: some offers feel gross and I can't articulate why, and some feel totally normal but I'm starting to think those might be the actually bad ones. I've read a bit about repugnant markets and noxious markets and about how selling a thing can change what the thing is, and I want to turn that into something my board can run without me.

  So: write us a decision procedure for whether to take an ad, and on what terms. I want the questions in the order we ask them, what counts as a real answer to each one, which questions end it right there with a no, and which ones the procedure can't actually settle becuase they're about what kind of paper we want to be rather than about facts — those should get handed to our advisor or to a board vote, and say which goes where. Assume none of us have had an ethics class, we meet once a week, the faculty advisor signs off, and the principal can veto anything she wants.

  Run it on three requests sitting in front of me right now:

  - a payday lender two towns over wants a half page in every issue
  - a plasma donation center that just opened wants to advertise to our seniors, a bunch of whom are 18
  - a college admissions consulting company that's been our biggest advertiser for six years and charges families around $4,000

  And tell me straight what it comes out to on each, including the one where I already know I'm going to hate the answer — that company is roughly a third of our ad revenue and I'm not going to pretend otherwise.

  Then deal with two places I think a basic checklist breaks:

  - a company offering to pay for a written piece that reads like our own reporting with a small "sponsored" tag at the bottom. Is that just a fancier ad, or is it a different kind of transaction entirely? Should disclosure fix it, and if not, why not?
  - we ran an energy drink ad last year that everyone now agrees was a mistake. Does having taken it last year commit us to it this year? How should the procedure treat precedent, in either direction?

  Finally be honest about where it fails: which steps are secretly just my judgment wearing a lab coat, whether an advertiser who knows the list could write copy specifically to pass it, and the fact that we're rating ads one at a time so we could accept twenty individually fine ads and end up with a paper that mostly targets broke people. If there's a way to check the whole year's lineup at once instead of issue by issue, say what that check actually looks like and who runs it.
reasoning: |-
  Hmm, the user is a 17-year-old high school newspaper editor facing ethical dilemmas with advertising. They need a structured decision procedure for evaluating ads, since their current "vibes-based" approach isn't defensible. They're grappling with complex cases like payday lenders, plasma centers, and expensive college consultants, and need help with recurring problems like sponsored content and precedent.

  I notice several layers here: practical need for a workflow, ethical education gaps (they've read about repugnant markets but lack formal ethics training), and institutional constraints (advisor sign-off, principal veto). The college consultant case is particularly tense—they know rejecting it risks a revenue crisis but feel it might be "actually bad." This cognitive dissonance ("feels normal but might be harmful") suggests they're developing moral reasoning beyond initial instincts.

  The procedural request is smart—they want to institutionalize ethics before graduating. Key unspoken needs: protecting younger students (especially regarding plasma ads targeting newly-legal seniors), maintaining journalistic integrity against sponsored content, and avoiding cumulative harm even when individual ads seem okay.

  For the framework, I'll adapt professional media ethics guidelines to high-school context. Core pillars: harm prevention (especially to minors), editorial independence, transparency, and consistency. Must include off-ramps for subjective calls (board votes) since not everything is rule-based. The "grossness" they feel often signals conflicts with educational purpose—that’s why payday loans fail immediately while sponsored content triggers deeper debate.

  Precedent needs special handling. Past mistakes shouldn't bind future decisions—that's the "sunk cost fallacy." But consistency matters, so I'll build in an annual review of ad portfolios to catch patterns (e.g., multiple ads exploiting student poverty). The energy drink example shows why: one ad seemed harmless until consequences emerged.

  Honesty about limitations is crucial. I'll flag where judgment is unavoidable (e.g., "educational appropriateness") and how advertisers might game the system (e.g., rebranding loans as "financial aid"). The annual lineup check can't be automated—it requires asking "What message does this collection send about our values?"

  Finally, the college consultant verdict will sting. I'll validate their discomfort: $4k services absolutely undermine equity, making the paper complicit. But I'll offer mitigation strategies (term limits for advertisers) so rejecting them isn't catastrophic.
answer: |-
  Here's a decision procedure designed for speed, defensibility, and ethical clarity, built for a high school context. It prioritizes student well-being, educational integrity, and transparency.

  **The High School Paper Ad Acceptance Procedure (v1.0)**

  **Step 0: Pre-Screening (Editor/Ad Manager)**
  *   **Question:** Is this ad *illegal* (e.g., promoting underage drinking, illegal substances, fraud) or an *immediate safety threat*?
  *   **Answer:** Must be factual ("Yes, it promotes vaping to minors" / "No, it's legal").
  *   **Outcome:**
      *   **YES:** **IMMEDIATE NO.** Log reason, notify advisor/principal.
      *   **NO:** Proceed to Step 1.

  **Step 1: Core Values Check**
  *   **Question 1A:** Does this ad directly **harm or exploit** our student readers (e.g., predatory financial practices, dangerous activities, unrealistic body/image pressure, discrimination)?
  *   **Question 1B:** Does this ad **severely undermine** the educational purpose or journalistic integrity of the paper (e.g., attacks on the school/students/staff, blatant misinformation, conflicts with coverage)?
  *   **Answer:** Requires reasoned judgment based on ad content, target audience (students!), and known practices of the advertiser. Cite specific reasons.
  *   **Outcome:**
      *   **YES to 1A OR 1B:** **IMMEDIATE NO.** Log specific reason(s). Proceed only if the reason is highly debatable (then go to Step 4).
      *   **NO to both:** Proceed to Step 2.

  **Step 2: Transparency & Disclosure**
  *   **Question:** Is the ad **clearly identifiable** as an advertisement? Are any claims presented as fact verifiable? Does it require special disclosure (e.g., "Results not typical," "Consultation required," "Sponsored Content")?
  *   **Answer:** Must be verifiable by looking at the ad mock-up or copy. "Yes" means the ad *as submitted* meets standards. "No" means it needs modification.
  *   **Outcome:**
      *   **NO:** **Conditional NO.** Can only proceed if advertiser agrees to necessary modifications *in writing* (email/text okay). If they refuse, it's a NO.
      *   **YES:** Proceed to Step 3.

  **Step 3: Audience & Relevance**
  *   **Question 3A:** Is the product/service **primarily targeted at or relevant to** high school students, their families, or the immediate school community?
  *   **Question 3B:** Is the ad's **tone/style appropriate** for a high school publication (e.g., not overly aggressive, demeaning, or wildly inappropriate)?
  *   **Answer:** Requires judgment based on ad content and common sense. Cite specific observations.
  *   **Outcome:**
      *   **NO to 3A AND NO to 3B:** **Recommend NO.** Log reasons. Proceed to Step 4 (Vote/Review) due to irrelevance/inappropriateness.
      *   **NO to 3A BUT YES to 3B:** *Proceed cautiously.* Log irrelevance. Strength in Step 4 matters more.
      *   **YES to 3A:** Strong point in favor. Proceed to Step 4.
      *   *(YES to 3B is generally expected to pass Step 1).*

  **Step 4: Final Review & Decision Point**
  *   **Question:** After Steps 0-3, is there **significant remaining concern, ambiguity, or disagreement** about accepting this ad? (e.g., ethical gray area, major revenue impact, precedent-setting, board split).
  *   **Answer:** Board discussion. Focus on *specific* concerns identified in previous steps or new valid points.
  *   **Outcome:**
      *   **NO significant concerns:** **Recommend YES.** Log decision. Send to Advisor for sign-off.
      *   **YES, significant concerns:** **Requires Higher Review.**
          *   **Ethical Concerns / Values Conflict:** **Board Vote (Simple Majority).** Log vote tally and key arguments.
          *   **Major Revenue Impact / Precedent / Ambiguous Harm:** **Advisor Decision (with Board Input).** Advisor must consult Principal if unsure.
      *   **Final Step:** Advisor signs off (or rejects) *all* ads, regardless of path. Principal retains veto power.

  **Key Principles Embedded:**
  *   **Student Well-being First:** Step 1 is the strongest filter.
  *   **Transparency Non-Negotiable:** Step 2 must be met.
  *   **Judgment Required:** Steps 1, 3, and 4 explicitly involve judgment. The procedure structures it, doesn't eliminate it.
  *   **Defensibility:** Every "NO" or "Conditional" requires a logged, specific reason tied to the steps.
  *   **Efficiency:** Starts with strongest filters. Most ads should be clear YES/NO by Step 2 or 3.
  *   **Authority Flow:** Board handles routine approvals and votes on ethical dilemmas. Advisor handles ambiguity, precedent, revenue impacts, and is the final gatekeeper before Principal.

  ---

  **Application to Your Current Requests:**

  1.  **Payday Lender (Half page, every issue):**
      *   **Step 0:** Legal? Probably (depends on state, but assume yes). Safe? Not an immediate threat. **Proceed.**
      *   **Step 1A: Harm/Exploit?** **YES.** Payday loans are widely recognized as predatory, trapping vulnerable people (including young adults just starting out) in cycles of debt with exorbitant fees. This directly exploits potential financial naivety. **IMMEDIATE NO.** (Log: Predatory financial product targeting potentially vulnerable young adults.)
      *   **Outcome: NO.**

  2.  **Plasma Donation Center (Targeting 18yo Seniors):**
      *   **Step 0:** Legal? Yes (if licensed). Safe? Generally, for healthy adults, but carries risks. Not immediate threat. **Proceed.**
      *   **Step 1A: Harm/Exploit?** **GRAY AREA / POTENTIAL YES.** While legal and a source of income, it commodifies the body for essential income, often targeting lower-income populations. Encouraging *students* (even 18yo) to engage primarily for cash raises ethical concerns about exploiting financial need versus altruistic donation. **Proceed to Step 4 due to ambiguity.** (Log: Concerns re: commodification of body/health targeting students for income; potential exploitation of financial vulnerability.)
      *   **Step 2:** Needs clear disclosure about payment, time commitment, potential side effects, and eligibility. **Conditional YES** only if modified. (Assume they agree).
      *   **Step 3A:** Relevant? Somewhat (18yo need money). Tone? Assume appropriate.
      *   **Step 4:** Significant concern flagged in Step 1A. **Requires Higher Review.**
          *   **Decision:** Advisor Decision (with Board Input). This is a values call about the appropriateness of encouraging this activity for income among students. Advisor should weigh the specific messaging, compensation level, and potential pressure. Likely outcome depends heavily on the ad's specifics and advisor's stance, but leans towards **NO** due to the exploitation concern unless framed *very* carefully as a civic service with compensation as a secondary benefit. High risk of feeling "gross." **Recommend NO.**

  3.  **College Admissions Consultant ($4,000 service, Major Advertiser):**
      *   **Step 0:** Legal? Yes. Safe? Yes. **Proceed.**
      *   **Step 1A: Harm/Exploit?** **YES, but subtle.** This is the "feels normal but might be bad" case. Charging $4,000 inherently advantages wealthy families and exacerbates educational inequality. Your paper, by accepting the ad, implicitly endorses this pay-to-play approach to college admissions, undermining the ideal of meritocracy and potentially making lower-income students feel inadequate or excluded. It commodifies access to opportunity in a way that conflicts with the school's educational mission. **Proceed to Step 4 due to severity/impact.** (Log: High-cost service exacerbates educational inequality; commodifies college access; potential conflict with school's equity values.)
      *   **Step 1B:** Undermine Integrity? **POTENTIAL.** If the paper covers college admissions fairly, accepting ads from high-priced consultants *could* create a conflict or perception of bias, especially if critical articles appear. Need vigilance, but not automatic NO.
      *   **Step 2:** Must be clear it's a paid service, not a guarantee of admission. **Conditional YES** only if modified (assume it is).
      *   **Step 3A:** Highly relevant. Tone? Assume professional.
      *   **Step 4:** **Significant concern flagged in Step 1A (Harm/Exploit & Values Conflict).** **Requires Higher Review.**
          *   **Decision:** Advisor Decision (with Board Input & Principal Consultation STRONGLY Recommended). This involves core values (equity, merit), major revenue dependency, and potential school-wide implications.
          *   **The Straight Answer:** Ethically, this is highly problematic. It likely fails the spirit of Step 1A. **The procedure points strongly towards NO.** However, the revenue dependency is real.
          *   **Possible Paths:**
              *   **Ethical Stance:** Reject it. Find other revenue. Use this as a catalyst for discussion about equity in college access. (Hard, but cleanest).
              *   **Mitigation (If Advisor/Principal Approves):** Strict term limits (e.g., "We accept your ads for this year only while seeking replacement revenue"), prominent disclosure ("Paid Service - Financial Aid Options May Be Available"), potentially a lower ad rate acknowledging the ethical compromise, AND a commitment from the paper to run explicit coverage on equitable college access pathways. **This is a band-aid, not a cure.**

  ---

  **Addressing the Complex Cases:**

  1.  **Sponsored Content ("Looks like reporting"):**
      *   **Step 1B: Undermine Integrity?** **YES.** This is fundamentally different from a standard ad. It mimics editorial content, blurring the line between independent journalism and paid promotion. This erodes reader trust in *everything* the paper publishes. The "sponsored" tag is necessary but **insufficient** to mitigate the core deception of mimicking reporting. It changes the nature of your paper.
      *   **Step 2:** The "sponsored" tag makes it identifiable, but the *format* itself is the problem. Verification of claims is impossible if it's pure promotion disguised as fact.
      *   **Outcome:** This should trigger a **IMMEDIATE NO** at **Step 1B**. (Log: Severely undermines journalistic integrity by mimicking editorial content; erodes reader trust; blurs fundamental line between advertising and news). **Disclosure does NOT fix the inherent deception of the format.** It's a different, more dangerous transaction.

  2.  **Precedent (The Energy Drink Mistake):**
      *   **The Procedure's Stance:** **Past acceptance creates NO obligation for future acceptance.** Each ad is evaluated *anew* based on the current procedure and current context.
      *   **Why?** Learning and changing your mind based on experience (like realizing the energy drink ad was inappropriate for your audience) is ethical and responsible. Being bound by past mistakes is illogical ("sunk cost fallacy").
      *   **How the Procedure Handles It:**
          *   **Step 1A:** Re-evaluate the energy drink ad. Did it promote unhealthy habits? Exploit youth marketing? Cause issues last year? If the answer is now YES, it gets an **IMMEDIATE NO** this year, regardless of past acceptance. Log: "Re-evaluated per Step 1A: Promotes unhealthy consumption habits targeting minors; negative feedback received previously."
          *   **Consistency:** If a *new* energy drink ad is submitted, it gets evaluated strictly on the current criteria. Rejecting it *because* you rejected a similar one last year is fine, but the reason must be based on the criteria (Step 1A - Harm/Exploit).
          *   **Step 4:** If rejecting a previously accepted *type* of ad (like energy drinks), flag it in Step 4. The Advisor/Board should be aware it's a change, but the change itself is justified by the procedure.

  ---

  **Honest Limitations & Failure Points:**

  1.  **Judgment in a Lab Coat:** Steps 1 (Harm/Exploit, Undermine Integrity) and 3 (Relevance, Appropriateness) **are** your board's collective judgment, guided by the procedure and core values. The procedure forces you to articulate *why* something feels gross ("predatory," "undermines trust," "inappropriate tone") rather than just vibes, making it more defensible. It doesn't remove subjectivity, it structures and documents it.
  2.  **Gaming the System:** Yes, a savvy advertiser could write copy to *try* to pass. They might:
      *   Soften predatory language (e.g., "Cash Advance Solutions" instead of "Payday Loans").
      *   Add disclosures to meet Step 2.
      *   Frame exploitative services as "opportunities" (e.g., Plasma: "Earn while helping save lives!").
      *   **Mitigation:** The core judgment in Step 1 is key. Look beyond the words to the *substance* and *known practices*. Ask: "Who truly benefits here, and at what potential cost to our readers?" If it walks like a duck... call it a duck (NO).
  3.  **Death by a Thousand Cuts (Cumulative Impact):** This is the biggest flaw in a per-ad system. Accepting 20 ads for budget colleges, part-time jobs targeting low-income students, discount retailers, etc., could collectively paint a picture of targeting "broke kids" even if each ad passes individually.
      *   **The Solution: The Annual Portfolio Review.**
          *   **When:** Before finalizing the budget for the *next* school year (or at least once per year).
          *   **Who:** Editor-in-Chief, Ad Manager, Faculty Advisor (Board input welcome).
          *   **Check:** Look at **ALL** ads accepted over the past year (or planned for the next).
          *   **Questions:**
              *   What is the overall **message** this collection sends about our readers? (e.g., "You are primarily consumers with limited means" vs. "You are diverse learners exploring futures")
              *   Do the ads collectively represent a **diversity** of interests and services relevant to our student body (academic, artistic, recreational, financial, future-oriented)?
              *   Is there a **concentration** in categories that raise ethical concerns (e.g., high-cost services, gig economy, debt products)? Does this concentration conflict with our values?
              *   Does the **tone** of the overall ad landscape align with our publication's values?
          *   **Outcome:** This review might lead to:
              *   Setting **category limits** for next year (e.g., max 2 ads for paid college consultants, max 1 loan-related ad per issue).
              *   Actively seeking ads in **underrepresented categories** (local arts, nonprofits, skill-building, affordable services).
              *   **Rejecting** an otherwise acceptable ad *because* it exacerbates an existing imbalance.
              *   Formalizing **diversity/balance** as an explicit, *annual* criterion alongside the per-ad procedure.

  **Final Note:** This procedure makes your reasoning transparent and defensible. It forces discussion beyond "vibes." It won't make hard calls easy (like the $4k consultant), but it gives you a framework to make them *responsibly* and share the burden. Use the annual review to catch the cumulative problems. Good luck – you're thinking deeply about this, which is exactly what your paper needs.
