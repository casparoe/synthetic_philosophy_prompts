  ### Checking Work  

  **(a) Verification against constraints**  
  1. **Common prior**: Explicit joint distribution over states (auth, types, signals). Probability calculated as product. *Suspicion*: Ensure types are independent of auth and signals—yes, by construction.  
  2. **Strictly rational at trade state**: In state 3, both are Bayesian-rational. Alice computes \( P(\text{A} \mid L_A) = 0.4 \), value $400; Bob computes \( P(\text{A} \mid H_B) = 0.6 \), value $600. Correct and no mistakes. *Suspicion*: Check if irrationality affects rationality—no, in this state, both are rational.  
  3. **Strictly preferred trade**: At $500, Alice gains $100 (500 - 400), Bob gains $100 (600 - 500). After updating (see below), gains are smaller ($2.10 for Alice, $4.55 for Bob) but still strict. *Suspicion*: Gains might vanish with updating—but they persist due to doubt (verified in narrative).  
  4. **Purely speculative**: No risk aversion, endowments, liquidity, etc. Only risk-neutral valuation differences from private signals. *Suspicion*: Irrationality as "taste"—no, it’s about beliefs/knowledge, not preferences.  
  5. **Failure in knowledge hypotheses**: Not common knowledge that both are rational. Break at level 2:  
     - Level 1 holds: Each knows they are rational.  
     - Level 2 fails: Alice does not know that Bob knows Alice is rational (Bob might think Alice is irrational, and vice versa).  
     *Suspicion*: Is break precise? Yes, level 2 fails; no vagueness.  
  6. **Low probability of failure**: Irrationality probability (0.01 each) < 0.5. Prior mass on irrationality is small. *Suspicion*: State 3 has high probability? No, irrationality is rare (1%), and trade state has 11.8% mass.  
  7. **Setting and length**: Plausible dealers with appraisers; three paragraphs plus table.  

  **(b) Control: Upgrade to common knowledge of rationality**  
  Set \( P(I_A) = 0 \), \( P(I_B) = 0 \). Now rationality is common knowledge. In state 3 (auth = A, Alice sig = L_A, Bob sig = H_B, both rational):  
  - Alice willing to sell implies she has low signal (only rational reason).  
  - Bob infers Alice has low signal. His valuation updates:  
    \( P(\text{A} \mid H_B, \text{Alice has } L_A) = \frac{P(\text{A}) P(H_B \mid \text{A}) P(L_A \mid \text{A})}{P(\text{A}) P(H_B \mid \text{A}) P(L_A \mid \text{A}) + P(\text{F}) P(H_B \mid \text{F}) P(L_A \mid \text{F})} = \frac{0.5 \times 0.6 \times 0.4}{0.5 \times 0.6 \times 0.4 + 0.5 \times 0.4 \times 0.6} = \frac{0.12}{0.24} = 0.5 \), value $500.  
  - Bob is indifferent at $500; requires strict gain, so declines.  
  - Similarly, Alice infers Bob has high signal from his willingness, updates to value $500, declines to sell.  
  **Unraveling chain**:  
  1. Alice offers: infers Bob will infer her signal is low.  
  2. Bob, knowing Alice is rational, infers her signal is low and updates to $500.  
  3. Bob declines (indifference; requires strict gain).  
  4. Alice, knowing Bob is rational, infers he will decline and does not offer.  
  **First decline**: Step 3 (Bob declines due to indifference).  

  **(c) Answer to critic**  
  Critic objects: "You assumed irrationality, breaking a substantive economic assumption."  
  - **Answer**: The critic is partly correct—irrationality is assumed. However, in models where *every* agent is rational in *every* state (so rationality is trivially common knowledge), the no-trade theorem holds strictly: no trade with strict gains is possible. The theorem’s structure (common prior, common knowledge of rationality) implies that any willingness to trade reveals information that eliminates strict gains. Here, trade requires *some* states with irrationality to break common knowledge. Without irrationality, common knowledge of rationality holds, and trade unravels (as in control). The theorem forecloses trade when rationality is common knowledge globally (in all states).  

  **(d) Fragility or named failure?**  
  The case shows the theorem is not fragile; it holds when its hypotheses are met. Real markets fail a specific hypothesis: **common knowledge of rationality**. The failure mode is **higher-order uncertainty about rationality** (doubt that others know I am rational).  

  **(e) Assessment of inference**  
  The inference that "high trading volume implies irrationality" is **complicated** by this case. Trade can occur with mostly rational traders if there is small doubt about others’ rationality (breaking common knowledge). Volume is not evidence of widespread irrationality but may reflect inevitable gaps in mutual knowledge.
