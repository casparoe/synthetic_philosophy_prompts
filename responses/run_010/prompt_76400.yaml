  ### Constructed Case: "The Antique Vase Trade"

  Alice and Bob are antique dealers. Alice is considering selling a vase to Bob. The vase is either genuine (worth $1,000) or fake (worth $0), determined by a hidden mark. A mutual friend, Charlie, offers to mediate a trade at a fixed price of $500. Each dealer has an expert appraiser who provides a private signal about the vase's authenticity. For a genuine vase, the signal is "high" with 60% probability and "low" with 40%; for a fake vase, it is "high" with 40% and "low" with 60%. The signals are conditionally independent given the vase's state. 

  However, dealers sometimes have "bad days" where they act irrationally: an irrational Alice sells at any price above $0, and an irrational Bob buys at any price below $1,000. Alice is irrational with probability 0.01, Bob with 0.01, and these are independent of the vase and each other. Both are rational in all other respects: they are Bayesian, know the model, and maximize expected value.

  At the state where the vase is genuine, Alice is rational and received a "low" signal, and Bob is rational and received a "high" signal, both agree to trade. Alice values the vase at $400 (below $500), and Bob at $600 (above $500), so both strictly gain by trading. Even after learning the other is willing, they still trade due to the small doubt about irrationality.

  #### Common Prior and State Space
  The state space is defined by:
  - Vase authenticity: \( \text{authentic} \) (A) or \( \text{fake} \) (F)
  - Alice's type: rational (R_A) or irrational (I_A)
  - Bob's type: rational (R_B) or irrational (I_B)
  - Alice's signal: high (H_A) or low (L_A)
  - Bob's signal: high (H_B) or low (L_B)

  The common prior is a joint distribution. Let \( P(\text{A}) = P(\text{F}) = 0.5 \), \( P(I_A) = 0.01 \), \( P(R_A) = 0.99 \), \( P(I_B) = 0.01 \), \( P(R_B) = 0.99 \). Signals depend only on authenticity:  
  - \( P(H_A \mid \text{A}) = 0.6 \), \( P(L_A \mid \text{A}) = 0.4 \)  
  - \( P(H_A \mid \text{F}) = 0.4 \), \( P(L_A \mid \text{F}) = 0.6 \)  
  - Similarly for Bob, with conditional independence.  

  The prior for a state is:  
  \( P(\text{state}) = P(\text{auth}) \times P(\text{Alice type}) \times P(\text{Bob type}) \times P(\text{Alice sig} \mid \text{auth}) \times P(\text{Bob sig} \mid \text{auth}) \)  

  Valuations:  
  - Rational Alice: \( \text{value} = 1000 \times P(\text{A} \mid \text{her signal}) \).  
  - Rational Bob: \( \text{value} = 1000 \times P(\text{A} \mid \text{his signal}) \).  
  - Irrational Alice: values vase at $0 (willing to sell at any price > $0).  
  - Irrational Bob: values vase at $1000 (willing to buy at any price < $1000).  

  Information partitions:  
  - Alice knows her type and signal (but irrationals ignore signals).  
  - Bob knows his type and signal (but irrationals ignore signals).  

  Trade occurs at price $500 if both are willing: Alice if price ≥ her value, Bob if price ≤ his value.  

  **Table of Key States (full space has 32 states; illustrative states for asset = authentic shown)**  

  | State | Auth | Alice Type | Bob Type | Alice Sig | Bob Sig | Probability (×0.5) | Alice Value | Bob Value | Alice Willing? | Bob Willing? |  
  |-------|------|------------|----------|-----------|----------|--------------------|-------------|-----------|---------------|--------------|  
  | 1     | A    | R_A        | R_B      | H_A      | H_B     | 0.99×0.99×0.6×0.6=0.352836 | $600     | $600    | No (600>500) | No (600>500) |  
  | 2     | A    | R_A        | R_B      | H_A      | L_B     | 0.99×0.99×0.6×0.4=0.235224 | $600     | $400    | No           | No (400<500) |  
  | **3** | **A**| **R_A**    | **R_B**  | **L_A**  | **H_B** | **0.99×0.99×0.4×0.6=0.235224** | **$400** | **$600**| **Yes**      | **Yes**     |  
  | 4     | A    | R_A        | R_B      | L_A      | L_B     | 0.99×0.99×0.4×0.4=0.156816 | $400     | $400    | Yes          | No (400<500) |  
  | 5     | A    | I_A        | R_B      | *        | H_B     | 0.01×0.99×0.6=0.00594   | $0       | $600    | Yes          | Yes          |  
  | ...   | ...  | ...        | ...      | ...      | ...     | ...                | ...       | ...      | ...          | ...          |  

  State 3 is the trade state. Probability = \( 0.5 \times 0.235224 = 0.117612 \).  

  #### Formalization
  - **Agents**: Alice (seller), Bob (buyer).  
  - **Asset**: Vase, value \( V = 1000 \) if authentic, \( 0 \) if fake.  
  - **Signals**: Private, conditionally independent given \( V \).  
  - **Types**: Rational (Bayesian) or irrational (fixed behavior), independent of \( V \).  
  - **Information**: Each knows their type and signal.  
  - **Trade**: At exogenously fixed price $500; trade occurs if both willing.  

