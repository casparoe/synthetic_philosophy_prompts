  The user wants a step-by-step procedure that identifies which "need" a proposal serves (admiration, preservation, or release), detects corruptions at the artifact level, determines when to sequence modes versus blend them, marks when decisions shift to higher authorities, and respects their 120-word "horizon test." The procedure must avoid Nietzsche's name entirely since one colleague objects to him.

  They've provided three test cases: reinstalling the mill interpretation, replacing the founder's portrait, and publishing payroll ledgers. They expect the procedure might challenge their own preferences (like their critical framing for school modules). They also want acknowledgment of the procedure's limits—it can diagnose but can't prescribe what to remember, and sometimes the right answer is no interpretation at all.

  The challenge here is translating Nietzsche's complex philosophy into an accessible toolkit while maintaining its diagnostic power. The key elements to operationalize are:
  - The three needs: action/admiration (monumental), preservation/reverence (antiquarian), suffering/release (critical)
  - The three corruptions: costume (fabricated inspiration), reliquary (mindless preservation), root-cutting (destructive condemnation)
  - Nietzsche's concepts of horizon (selective focus) and plastic power (transformative use of history)

  For the procedure, I'll create a logical flow that starts with identifying the core subject, then analyzes the proposed approach against the three modes and their corruptions, applies the horizon test, checks for sequencing needs, and finally assesses standing. Each step needs clear questions, success criteria, failure signs, and exit points. The most delicate part will be distinguishing when a "judgment call" is disguised as procedure—I'll make that explicit as requested.

  For the test cases:
  1. The mill proposal currently favors monumental framing but ignores the tragedy. The procedure should reveal this as "costume" corruption and recommend sequencing critical history.
  2. The portrait removal request likely stems from critical impulses but risks "root-cutting." The procedure should flag standing issues for the Trust.
  3. The payroll ledgers publication seems antiquarian but could tip into "reliquary" without context. The horizon test may force hard choices about what details to include.

  The user's self-awareness about their own biases is impressive—they're clearly seeking rigor over validation. My response should honor that by not softening conclusions, especially when the procedure challenges their default critical stance. The limit statement will emphasize that this framework navigates *how* to present history, not *what* history deserves presentation—and that sometimes silence is the most ethical choice.
answer: |-
  Here is a procedural framework derived from your Nietzschean diagnostic, designed for practical application in 20 minutes by heritage professionals, stripped of philosophical terminology. It follows a logical sequence, identifies judgment calls, and flags the transition to standing-based decisions.

  **Procedure: Heritage Proposal Assessment Framework**

  **Purpose:** To evaluate proposals for historical presentation by identifying their core function, potential distortions, and practical constraints, leading to a clear recommendation.

  **Time:** Designed for ~20 minutes per proposal.

  **Core Concepts (Internal Guide - Not for Shared Procedure):**
  *   **Need 1 (Action/Admiration):** Focuses on inspiring present action through exemplary figures/events. *Corruption Risk (Costume):* Fabrication, oversimplification, creating paralyzing ideals.
  *   **Need 2 (Preservation/Reverence):** Focuses on preserving the past for its own sake, valuing continuity. *Corruption Risk (Reliquary):* Uncritical accumulation, inability to select or judge, flattening meaning.
  *   **Need 3 (Suffering/Release):** Focuses on confronting past injustice to achieve understanding or liberation. *Corruption Risk (Root-Cutting):* Destructive condemnation, denying historical connection/context, creating alienation.
  *   **Horizon Test:** The 120-word limit forces selection. What is *excluded* is as significant as what is included.
  *   **Plastic Power:** Implicit goal - Does the proposal help the community *use* the past constructively, or does it trap them in uncritical worship or paralyzing guilt/anger?
  *   **Sequencing vs. Blending:** Distinct modes presented consecutively (e.g., Panel A: Achievement; Panel B: Cost) is often clearer and more honest than a single, conflicted narrative claiming neutrality.

  **Assessment Steps:**

  1.  **Identify Core Subject & Proposed Action:**
      *   *Question:* What specific person, event, object, or theme is the focus, and what change is proposed (new text, display, removal, etc.)?
      *   *Adequate Answer:* Clear, concise description of the subject and the proposed intervention.
      *   *Failure Sign:* Vagueness, shifting focus, unclear what is being changed.
      *   *Exit:* If unclear, return to proposer for clarification before proceeding.
      *   *Judgment Call?* No. Factual extraction.

  2.  **Determine the Primary Need Being Served:**
      *   *Question:* What primary purpose does the proposal claim to serve? (e.g., "Inspire civic pride," "Preserve local memory," "Highlight historical injustice," "Provide factual record").
      *   *Question:* Looking at the specific *changes* proposed (wording choices, object selection/placement, framing), what need does the proposal *actually* seem designed to serve? (Admiration? Preservation? Confrontation/Release?)
      *   *Adequate Answer:* Identification of the dominant implied need based on concrete elements of the proposal (language, selection, framing), even if it contradicts the stated purpose.
      *   *Failure Sign:* Inability to discern a dominant focus; proposal seems internally conflicted on this fundamental level.
      *   *Exit:* If deeply conflicted here, flag for major revision - the proposal lacks a clear core function. Proceed cautiously.
      *   *Judgment Call?* **YES.** Requires interpreting the proposal's intent and effect beyond its stated claims.

  3.  **Check for Characteristic Distortion (Corruption):**
      *   *Question (Admiration Focus):* Does the presentation risk oversimplifying or inventing to create an unattainably perfect or purely heroic image? Does it avoid uncomfortable facts relevant to the subject? (Risk: **Costume**)
      *   *Question (Preservation Focus):* Does the presentation avoid making necessary choices, treating everything as equally important simply because it's old? Does it lack critical context? (Risk: **Reliquary**)
      *   *Question (Confrontation Focus):* Does the presentation condemn without acknowledging historical context, complexity, or the presenter's own connection to that past? Does it feel destructively angry rather than seeking understanding? (Risk: **Root-Cutting**)
      *   *Adequate Answer:* Specific identification of potential distortion *within the proposed elements* (e.g., "The draft text omits X fact, risking oversimplification [Costume]", "Proposing to display all attic items without selection risks clutter/lack of focus [Reliquary]", "The tone condemns Y without explaining Z context, risking alienation [Root-Cutting]").
      *   *Failure Sign:* Ignoring clear signs of potential distortion; applying the wrong distortion check to the identified need.
      *   *Exit:* If a significant distortion is detected and seems deliberate or unaddressed, recommend rejection or major revision.
      *   *Judgment Call?* **YES.** Requires assessing the *manner* of presentation against the identified need.

  4.  **Apply the Horizon Test (120-Word Limit Check - For Text Proposals):**
      *   *Question:* Does the proposed text (or core message for other formats) fit within the 120-word constraint? If not, what core elements *must* stay, and what *must* be cut to fit?
      *   *Question:* What significant aspects of the subject or context are inevitably *excluded* by this limit? Does this exclusion fundamentally distort the chosen mode (e.g., trying to do Critical mode but no space for context)?
      *   *Adequate Answer:* Acknowledgment of the forced exclusion and an assessment of whether the core message of the identified need can still be conveyed honestly within the limit. Determination of which modes are *practically possible* within the limit (e.g., Monumental often requires more space for context than Antiquarian listing; Critical needs space for complexity).
      *   *Failure Sign:* Ignoring the word limit's impact; claiming everything important can be included; failing to recognize that the limit itself shapes the viable mode.
      *   *Exit:* If the core message cannot be conveyed honestly within the limit using the proposed mode, recommend revising the mode, sequencing, or the scope of the installation.
      *   *Judgment Call?* **YES.** Requires prioritizing information and assessing the impact of omission.

  5.  **Assess Need for Sequencing:**
      *   *Question:* Does the subject inherently contain strong elements fitting *different* core needs (e.g., great achievement AND significant suffering)? Does trying to serve both needs within a single narrative (one panel, one voice) risk creating confusion, dishonesty, or a bland "non-mode"?
      *   *Question:* Would presenting distinct needs consecutively (e.g., one panel/adapter for Admiration/Preservation, followed immediately by one for Confrontation) provide a clearer, more honest, and potentially more powerful experience?
      *   *Adequate Answer:* Recommendation for either a single, coherent mode *or* a clear sequencing plan (stating which need/mode comes first and why, and how the transition is signaled).
      *   *Failure Sign:* Recommending an impossible blend that waters down all modes; ignoring inherent tension in the subject.
      *   *Exit:* If sequencing is needed but not proposed, recommend it as a condition of approval.
      *   *Judgment Call?* **YES.** Requires evaluating the complexity of the subject and the feasibility of narrative coherence.

  6.  **Check Standing & Plastic Power:**
      *   *Question:* Does this decision primarily hinge on *who has the right* to make a judgment about honour, shame, or removal (e.g., descendants, specific communities), rather than purely historical evidence or interpretation?
      *   *Question:* Does the proposal, as assessed so far, seem likely to help the community *engage constructively* with this past (nourishment), or does it risk trapping them in uncritical worship, paralyzing guilt/anger, or numb preservation (embalming/crushing)?
      *   *Adequate Answer:* Clear statement on whether the core issue is now one of standing (requiring Trust/Descendants' Society input) or if it remains an interpretation decision. Brief assessment of the proposal's likely constructive/destructive impact *based on steps 1-5*.
      *   *Failure Sign:* Failing to recognize when the issue moves beyond interpretation; making assumptions about community impact without grounding in the analysis.
      *   *Exit:* If standing is the core issue, recommend deferral to the Trust/Descendants' Society with our analysis attached. If Plastic Power assessment is strongly negative (embalming/crushing), recommend rejection or significant revision even if other steps pass.
      *   *Judgment Call?* **YES** (especially Plastic Power). Standing is often a factual/contractual determination.

  **Output:** A memo structured around the findings at each step, culminating in a clear recommendation (Approve, Approve with Conditions [specify], Reject, Defer to Trust/Descendants).

  ---

  **Application to Test Cases:**

  **Case 1: Reinstall Interpretation at the Mill (Prosperity & 1911 Fire)**

  1.  **Core Subject/Action:** Mill building's history (prosperity & fatal 1911 fire). Action: Complete reinstallation. Current: 40 yrs old, fire mentioned in one exit sentence.
  2.  **Primary Need:** Stated: Update, provide fuller history. Actual: Likely driven by unserved **Need 3 (Confrontation/Release)** regarding the fire/injustice, reacting against the old installation's minimization (which leaned towards **Need 1/Admiration** with **Costume** corruption by omission).
  3.  **Distortion Check (Need 3):** Risk of **Root-Cutting:** Focusing solely on condemnation of the owners/conditions, ignoring historical industrial context, or the complex legacy (prosperity *and* cost). Proposal must avoid this.
  4.  **Horizon Test (Panels):** 120 words *per panel* is manageable. Cannot tell *both* the prosperity story *and* the fire story in depth in one panel. Requires sequencing or dedicated panels.
  5.  **Sequencing Assessment:** **Essential.** Subject inherently demands both **Need 1 (Admiration? - complex, not pure heroes)** for the achievement/innovation/prosperity *and* **Need 3 (Confrontation/Release)** for the fire/worker conditions. Blending risks dishonesty or dilution. Sequence: Early panels establish context, innovation, prosperity (**Need 2 Preservation/Reverence** for facts & **Need 1** carefully framed). Dedicated panel(s) near the site of the fire for **Need 3**, detailing the event, victims (names/ages if possible), context of safety, aftermath. Avoids **Costume** (by including the cost) and **Root-Cutting** (by providing context first).
  6.  **Standing/Plastic Power:** Primarily interpretation. Good potential for constructive **Plastic Power:** Acknowledges complexity, fosters understanding of industrial legacy (achievement & human cost), avoids paralysis or simple blame. Empowers community with fuller knowledge.

  **Recommendation Memo:**
  *   **Subject:** Mill Reinstallation.
  *   **Analysis:** Proposal reacts against prior neglect of the 1911 fire (Need 3). Subject requires balancing prosperity narrative and tragedy. Current install suffers Costume distortion (omission). Risk of Root-Cutting if fire presented without context.
  *   **Horizon:** Viable within per-panel limits using sequencing.
  *   **Key Requirement:** **Sequencing Mandatory.** Initial panels (entrance/context) focus on factual establishment of the mill's role, innovation, and prosperity (Need 1 & 2, carefully avoiding pure heroism). Subsequent panel(s) near the fire location must explicitly address the 1911 disaster, victims, working conditions context, and consequences (Need 3), avoiding simplistic condemnation. Fire cannot be relegated to the exit.
  *   **Distortion Avoidance:** Sequencing prevents blending distortion and mitigates Root-Cutting risk for Need 3 panel by building on prior context.
  *   **Plastic Power:** High potential for constructive engagement if sequenced well.
  *   **Recommendation:** **APPROVE IN PRINCIPLE, CONDITIONAL** on submission of detailed panel scripts demonstrating clear Need-based sequencing as outlined. Final scripts require review against distortion checks.

  **Case 2: Remove Founder's Portrait & Commission Replacement (Descendants' Society Request)**

  1.  **Core Subject/Action:** Founder's portrait in entrance hall. Action: Remove and replace.
  2.  **Primary Need:** Stated: Likely implies discomfort with honouring placement (Need 1 distortion). Actual: Driven by **Need 3 (Confrontation/Release)** regarding the founder's legacy (potentially negative aspects: labor practices, social views etc.). It's a critique of the *current* monumental framing.
  3.  **Distortion Check (Need 3):** High risk of **Root-Cutting:** Removal is a destructive act potentially denying any positive contribution or historical connection. Replacement proposal absent - unknown if it offers constructive engagement (Need 3 healthily) or just removal (pure Root-Cutting).
  4.  **Horizon Test:** N/A (Physical object removal/replacement).
  5.  **Sequencing Assessment:** Not applicable to a single object's placement. However, the *act* of removal/replacement could be seen as a form of sequencing (changing the narrative over time).
  6.  **Standing/Plastic Power:** **Core issue is STANDING.** The request comes *from* the Descendants' Society regarding the honouring of an ancestor in a prominent space. While historical interpretation informs the *debate*, the decision about removal from this symbolic location fundamentally belongs to the Trust, heavily weighting the descendants' perspective. **Plastic Power Impact:** Removal alone could feel destructive (Root-Cutting). Replacement *could* be constructive (e.g., contextualizing the founder, or shifting focus). Unknown without proposal.

  **Recommendation Memo:**
  *   **Subject:** Removal/Replacement of Founder's Portrait.
  *   **Analysis:** Request stems from Need 3 (Confrontation) regarding founder's legacy, reacting against current Need 1 framing. Removal action carries high Root-Cutting distortion risk. No replacement proposal provided.
  *   **Key Finding:** **STANDING ISSUE.** Decision about presence/absence of an ancestor's portrait in a place of honour in the entrance hall rests primarily with the Trust, considering the descendants' views. Our role is interpretive context *for* that decision.
  *   **Recommendation:** **DEFER TO TRUST.** Provide Trust with: 1) Historical dossier on founder (achievements & controversies) for context. 2) Analysis that removal alone risks Root-Cutting distortion without offering constructive engagement. 3) Strongly recommend Trust seek a specific *replacement proposal* from the Descendants' Society (e.g., contextual display, different artwork, explanation panel) to assess potential for constructive Plastic Power before voting on removal. Do not support removal without a plan for replacement/context.

  **Case 3: Publish Company Payroll Ledgers Online (Your Team - Names, Ages, Injuries/Fines)**

  1.  **Core Subject/Action:** Historic payroll ledgers. Action: Digitize and publish online.
  2.  **Primary Need:** Stated: Access, preservation, research. Actual: Primarily **Need 2 (Preservation/Reverence)** - making the raw record available. Strong undercurrent of **Need 3 (Confrontation/Release)** - exposing labor conditions (injuries/fines), especially child labor (ages).
  3.  **Distortion Check (Need 2):** High risk of **Reliquary:** Dumping raw data online without context is uncritical preservation. The "ruled column" for injuries/fines is potent but raw data can be misinterpreted or lack impact.
  4.  **Horizon Test:** N/A (Online publication, no strict word limit, but context is still the "horizon").
  5.  **Sequencing Assessment:** The *data itself* is pure Need 2 (Antiquarian). The *significance* (labor conditions) points to Need 3. **Sequencing is vital.** The digitization (Need 2) is foundational. However, publishing *only* the raw scans risks Reliquary. Need 3 must be addressed *alongside* the data through contextualization (introductory text, essays, thematic guides) to unlock its potential meaning/impact and avoid distortion.
  6.  **Standing/Plastic Power:** Interpretation decision. **Plastic Power:** Raw data alone risks embalming (Reliquary) or being misused. Contextualization transforms it into potential nourishment for understanding social history, labor struggles, etc. (Constructive Need 3 via Need 2 foundation).

  **Recommendation Memo:**
  *   **Subject:** Online Publication of Payroll Ledgers.
  *   **Analysis:** Proposal serves core Need 2 (Preservation/Access) but contains significant Need 3 potential (exposing labor practices). High Risk of **Reliquary** distortion if published as raw scans only. The injury/fine data is historically valuable but requires interpretation.
  *   **Key Requirement:** **Sequencing Mandatory.** Digitization (Need 2) is approved. However, online publication **MUST** be accompanied by significant contextualization. Minimum: Robust introductory essay explaining the ledgers' purpose, limitations, historical context of workplace safety, child labor, and wage/fine systems. Ideally: Thematic guides or annotations highlighting patterns (e.g., common injuries, fine reasons, child workers). Context transforms raw data (Need 2) into meaningful confrontation/understanding (Need 3), avoiding Reliquary.
  *   **Plastic Power:** High potential *only* with contextualization. Raw data alone is inert or misleading.
  *   **Recommendation:** **APPROVE, CONDITIONAL** on development and inclusion of comprehensive contextual materials as outlined. Budget/resources must be allocated for this interpretive layer. Publication of raw scans alone is **not recommended** due to Reliquary risk.

  ---

  **Honest Statement of Limits:**

  1.  **Not Prescriptive:** This procedure diagnoses *how* history is being framed and checks for internal consistency and common pitfalls. It **cannot** dictate *what* history a community *should* prioritize or remember. That is a deeper cultural/political question.
  2.  **Cannot Resolve Value Conflicts:** It helps clarify the nature of disagreements (e.g., "We prioritize Need 1, you prioritize Need 3") but cannot resolve the underlying value conflict. That requires dialogue and institutional policy.
  3.  **Horizon is Constraining:** The 120-word limit (or any resource constraint) inherently limits depth and nuance. The procedure identifies this constraint but cannot remove it.
  4.  **No Mode is Correct:** There are subjects or proposals where *none* of the three modes feels appropriate, ethical, or possible given constraints. **The procedure *can* reach this conclusion** (e.g., Step 2 Failure - no clear/coherent need served; Step 3 Failure - proposal inherently corrupts its mode; Step 4 Failure - subject too complex for limit; Step 6 - Plastic Power assessment strongly negative). In such cases, the recommendation may be **Reject**, or crucially, **Recommend leaving the site/object uninterpreted for now**. Sometimes silence, or simple preservation without public presentation (Need 2 without public Reliquary), is the most honest and least harmful option when no constructive frame is viable.
  5.  **Relies on Practitioner Judgment:** The procedure flags judgment calls but relies on the user's historical sensitivity, ethical awareness, and understanding of their community. It is a tool, not an oracle.
