prompt: |-
  For several years I have been cataloguing the records of a mid-sized manufacturing city whose public self-image rests on two stories. The first holds that the founding families sheltered a column of refugees during a border war; the parish registers I transcribed show that those same families billed the crown for every night's lodging and turned away roughly a third of the people who arrived. The second holds that a great strike in the early twentieth century ended when the mill owner magnanimously conceded; the company ledgers show that the settlement was imposed by a state arbitration the owner had lobbied for, and that wages were cut again the following spring.

  What interests me is not that the stories are false. Flattering founder myths are unremarkable. It is what happened after the evidence became public. In both cases the correction was accepted without argument: it was printed in the local paper, written into the school curriculum, and mounted on the museum panels. And in both cases the commemoration grew more elaborate rather than less. The city now celebrates itself as the place that took in the refugees and had the honesty to admit how badly it treated them; the strike is commemorated as the moment when ordinary workers forced the state to intervene, with the owner's lobbying cited as proof of how entrenched his power was. Nobody denies the record. The record has been folded into the story, and the story has emerged stronger, more textured, and much harder to argue with, because any further objection can be met with the observation that the city has already confessed to more than the objector knows.

  I have since watched the same sequence twice more — in a university's handling of documents about the source of its founding endowment, and in a religious community's treatment of a prediction that failed on a specified date — and in each case the pattern held: unwelcome evidence surfaces, is conceded promptly and in full, and is then absorbed into a richer version of the founding narrative, which the concession itself now seems to warrant.

  I want to know whether this has a name. I am fairly confident it is not denial, since denial rejects the evidence and here the evidence is embraced; and it is not quite the much-discussed tendency of a correction to strengthen the mistaken belief it was aimed at, since in my cases nothing is disbelieved and nothing is corrected away — the group updates on the facts and the narrative survives by changing what the facts are taken to mean. Nor is it invention, in the ordinary sense of myth-making, because no new falsehoods are introduced; if anything the community's story becomes more factually accurate while growing less answerable.

  Begin with your bottom line in the first sentence — either the name of the established concept or a plain statement that there isn't one — and then give your reasoning. No preamble and no restating of my question. A bare label will not satisfy me; I want the carving. So: take the nearest established concepts from the study of social and cultural memory and from the study of belief revision under disconfirmation, and say precisely how the pattern I have described differs from each of them, and which, if any, actually covers it. If none does, coin a term and define it tightly enough that someone else could apply it to a case I have not described without consulting you. Mark its edges — in particular, tell me how to distinguish it from a community's genuinely correcting itself historiographically, where the unwelcome evidence does reduce the narrative's grip rather than deepening it. And say what turns on drawing that line correctly, insofar as it bears on which of the two should give way when a community's memory and the archival record collide.
reasoning: |-
  Hmm, the user is asking about a specific phenomenon they've observed in their historical research. They've noticed that when inconvenient historical evidence surfaces challenging a community's foundational myths, instead of denying it, they fully accept it and incorporate it into an even more elaborate version of their story that actually strengthens the narrative. They've seen this pattern multiple times - with a city's refugee story, a strike narrative, a university's endowment, and a religious prediction failure.

  The user wants to know if this phenomenon has a name. They've already ruled out several possibilities: it's not denial (since evidence is embraced), not the backfire effect (since beliefs aren't reinforced against correction), and not pure invention (since no new falsehoods are added). They want me to analyze this through established concepts from social/cultural memory studies and belief revision theory.

  Looking at potential concepts:
  - Cognitive dissonance reduction usually involves rejecting evidence, not incorporating it
  - Backfire effect reinforces original false beliefs, which isn't happening here
  - Adaptive preference shifts are individual, not collective
  - Cultural memory studies have "mnemonic capacity" but that's about preserving memory, not transforming it
  - "Discursive immunization" comes close but focuses on defense rather than absorption

  The key elements seem to be: full acceptance of disconfirming evidence, narrative transformation (not rejection), increased commemorative activity, and the resulting narrative becoming more resilient. The narrative evolves to frame the newly accepted facts as proof of the community's special virtues (honesty, resilience).

  For differentiation from true historiographical correction: in genuine correction, the narrative's dominance weakens; here it strengthens. Also important is how the community positions itself as morally superior for having "confessed."

  I think "mnemonic incorporation" is a suitable term - emphasizing how memory systems absorb challenging material. Other options could be "narrative metabolization" or "commemorative digestion."

  The stakes are high: if misidentified as genuine correction, it prevents necessary challenges to self-serving narratives. When community memory clashes with archives, we shouldn't mistake absorption for accountability.

  The term needs precise definition: "A collective memory process where disconfirming evidence is fully acknowledged but incorporated into an expanded narrative that increases the myth's commemorative presence and rhetorical invulnerability, typically by framing the concession as evidence of the community's distinctive virtue."
answer: |-
  There is no established name for this precise phenomenon, but it can be tightly defined as **mnemonic incorporation**.  

  ### Distinction from Nearest Concepts  
  1. **Cognitive Dissonance Reduction** (belief revision):  
     - *Difference*: Dissonance theory expects rejection/avoidance of contradicting evidence. Here, evidence is *accepted* but reinterpreted to *enhance* the original narrative’s moral complexity. Belief isn’t adjusted to fit facts; facts are subsumed into a more resilient myth.  

  2. **Backfire Effect** (belief reinforcement via correction):  
     - *Difference*: The backfire effect reinforces *false* beliefs against correction. Here, the *facts* are accepted, and the *narrative’s meaning* (not its factual basis) is amplified. The myth evolves, undiminished, by assimilating disconfirmation as proof of the community’s virtue.  

  3. **Mnemonic Negation** (cultural memory):  
     - *Difference*: Negation (e.g., "working through trauma") dissolves mythic narratives by confronting uncomfortable truths. Here, confrontation *intensifies* commemorative energy—the narrative grows *more* elaborate, embedding the "confession" as a plot point.  

  4. **Discursive Immunization** (rhetoric):  
     - *Difference*: Immunization deflects criticism via ad-hoc explanations (e.g., "the founder was pressured"). Here, no defensive excuses are made; the evidence becomes *celebrated* as evidence of the community’s honesty or resilience.  

  ### Edges: Distinguishing from Genuine Historiographical Correction  
  - **Mnemonic incorporation** vs. **correction**:  
    - In genuine correction, unwelcome evidence *simplifies* or *replaces* the narrative, reducing its dominance (e.g., museums retire myths). Here, evidence *complicates* and *expands* the narrative, increasing commemorative investment (e.g., new plaques, curriculum updates). The narrative’s grip *deepens* because the "confession" becomes proof of the community’s exceptional reflexivity.  
    - *Test*: If commemorative activity *increases* post-revelation and the narrative frames the community as *virtuous for admitting fault*, it is incorporation. If commemoration *declines* or the narrative *recedes* from identity, it is correction.  

  ### What Turns on the Distinction  
  When community memory collides with archives:  
  - **If incorporation**: The narrative becomes *more* resistant to challenge. Objections are neutralized by the prior "confession," creating rhetorical closure ("We already admitted this!"). The community’s identity avoids destabilization by weaponizing accountability.  
  - **If correction**: The narrative cedes ground to evidence, creating space for reevaluation of identity.  
  - **Stakes**: Misidentifying incorporation as correction risks legitimizing historical whitewashing. It allows communities to perform "accountability" while entrenching self-aggrandizing myths. Archivists/historians must push beyond performative concessions to demand narrative *downsizing*, not enrichment.  

  ### Definition of Mnemonic Incorporation  
  *A collective memory process in which disconfirming evidence is fully acknowledged but absorbed into an expanded narrative that increases the myth’s commemorative presence and rhetorical invulnerability. The act of concession is framed as proof of the community’s distinctive virtue (e.g., honesty, resilience), transforming contradiction into a *deepening* of the myth rather than its correction.*  

  **Application guide**: Identify (1) prompt acceptance of evidence, (2) escalation in commemorative elaboration (monuments, ceremonies), (3) narrative recalibration where the "confession" becomes a new *pillar* of the myth, and (4) rhetorical deflection of further criticism via the community’s claimed virtue. Absence of any element suggests a different process.
