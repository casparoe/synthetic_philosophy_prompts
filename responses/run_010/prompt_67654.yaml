prompt: |-
  I serve as rapporteur to the Franchise Commission of the Commonwealth of Caldonia, a standing body that rules on petitions to be added to the Commonwealth's electoral roll. Our enabling statute gives us a single criterion — "every person who has a sufficient stake in the decisions of the Commonwealth" — and otherwise instructs us only that our rulings must be consistent with one another and reasoned in public. We are now facing the familiar boundary problem in concrete form: no democratic procedure can tell us who the demos is, so we have to settle it case by case, and every case commits us. I have to draft the next opinion and I want to know which decision is actually available to us given our own record.

  The eight petitions decided so far, with the language each opinion leaned on:

  1. Lawfully resident non-citizens of fifteen years' standing, working, taxpaying, with children in Commonwealth schools: enfranchised in all elections. The opinion spoke of lives built inside our institutions.
  2. A commuter who resides in a neighboring state and crosses daily to work at a Commonwealth plant, paying income tax at source and working under Commonwealth labor and safety law, but residing nowhere in the Commonwealth: granted the franchise in the elections of the district where the plant stands, denied it in national elections. The opinion said the petitioner's working day is lived under our law and their livelihood fixed by our decisions, while the remainder of their life lies elsewhere.
  3. A citizen who emigrated thirty years ago, took another nationality, holds no Commonwealth property, pays no Commonwealth tax, and has not voted since leaving: franchise terminated under a five-year absence rule, termination upheld. The opinion said he had ceased to share a life with us in anything but a formal sense. It also noted, without drawing consequences from it, that he remains liable to prosecution under Commonwealth statutes that reach conduct abroad and would be subject to our law in full on any return.
  4. A foreign graduate student resident four years, paying tuition but no income tax, intending to leave on completing the degree: denied. The opinion said that four years, however fully lived, does not yet make a person's life a Commonwealth life.
  5. Undocumented residents of nine years' standing with Commonwealth-born children: enfranchised in local elections. The opinion stressed that their conduct is regulated daily by our agencies, that their children's prospects are fixed by our schools, and that they are removable at the discretion of officials they cannot vote for.
  6. A corporation headquartered in the Commonwealth, petitioning in its own name: denied. The opinion conceded that the company's interests are as bound up in Commonwealth decisions as any natural person's, but said that a polity is a relation among persons who owe one another justification, and that only persons so related can hold the franchise.
  7. Sixteen- and seventeen-year-old residents in full-time employment and paying income tax: denied on a bright-line age qualification. The opinion declined to treat employment or taxpaying as substitutes, saying that the franchise is not a wage owed for contribution.
  8. Residents of an offshore dependency under the Commonwealth's exclusive authority, where our law applies directly and our officials answer to no legislature the dependency elects: enfranchised in national elections. The opinion said that people governed by officials answerable only to a legislature they cannot elect are wronged in that fact alone.

  The new petition. Ms. Ferenczi is a national and lifelong resident of a neighboring state, an engineer who designs dual-use cryptographic hardware. The Commonwealth's Security Trade Act applies by its terms to any person anywhere who transfers listed technology to a party on the Commonwealth's blacklist. The Act is enforced: in the past six years the Commonwealth has indicted two foreign nationals in absentia, frozen funds they held in Commonwealth banks, and secured the extradition of one from a third country. Ms. Ferenczi has never visited the Commonwealth, owns nothing there, has no family, employment, or social ties there, pays no Commonwealth tax, and is barred by the same Act from every Commonwealth visa category. Whether she may lawfully do her work, and whether she stands liable to indictment and the seizure of her assets, are settled by decisions of Commonwealth agencies that afford her no hearing, no representation, and no vote. She petitions for the national franchise and, in the alternative, for the franchise in the district where the administering agency is headquartered. She notes that she is not asking to vote on anything that does not concern her; she is asking not to be punishable under laws she had no part in making.

  Please write me an opinion memorandum of roughly 1,500 to 2,000 words that does the following, in American English and in a formal register:

  First, reconstruct the candidate rules the eight outcomes might reflect — the obvious ones being all-subjected, all-affected, social membership or stake, and contribution or reciprocity — and show which of them the outcomes jointly permit. Do not stop at the crude versions: where a rule fits only on a refinement (subjection that reaches a person rather than nominal reach; interests that are affected in a way that amounts to a life; membership that is partly lived rather than wholly located), state the refinement and show that it does all the work you claim for it. Note separately where the *reasoning*, rather than the outcome, constrains the reconstruction: what does ruling 6 do to interest-tracking, and ruling 7 to contribution?

  Second, say what each surviving rule delivers on the new petition, treating the primary and the alternative remedy separately.

  Third, recommend the decision that best coheres with our record, identify the closest analog among the eight, and explain why it is closer than the precedents pulling the other way. In particular, tell me what to do with ruling 3: a person nominally reached by our extraterritorial law was denied the vote there, and I need either a distinction that survives scrutiny or an admission that we must now revise it.

  Fourth, if the record genuinely underdetermines the outcome — as I expect it does — state plainly what principle we adopt with each choice and what we are then committed to in the next case. Specifically: what does a grant here imply for foreigners whose interests are shaped by our trade, sanctions, or emissions policy but who are not reached by our law, and can a limited grant be bounded by anything other than an arbitrary line, such as criminal liability under our statutes rather than mere affectedness? And what does a denial commit us to saying about ruling 8, which held that being governed by unaccountable officials is itself the wrong?

  Fifth, name the further petition — real or constructed — that would best discriminate between the two strongest candidate rules, and say what each rule would predict about it.

  Work only from the record as I have given it. Do not cite or recommend literature, and do not attribute any of the opinions' language to a real author; the Commonwealth and its commission are inventions of mine, and the analysis should stand on the eight rulings and the new petition alone.
reasoning: |-
  We are given eight prior rulings and a new petition. We must reconstruct the candidate rules (like all-subjected, all-affected, social membership, contribution) that are consistent with the outcomes and reasoning of the eight cases. Then, apply those rules to the new petition, recommend a decision, and address implications.

   Step 1: Reconstruct candidate rules from the eight rulings.

   Let's examine each ruling and the reasoning to see what principles they reflect.

   Ruling 1: Lawfully resident non-citizens (15 years, working, taxpaying, children in schools) enfranchised in all elections.
     Reasoning: "lives built inside our institutions" -> This suggests a principle of social membership or integration into the community.

   Ruling 2: Commuter (works in Commonwealth, lives elsewhere) granted local franchise (for the district of work) but not national.
     Reasoning: Working day under Commonwealth law and livelihood fixed by Commonwealth decisions, but the rest of life elsewhere. 
     -> This distinguishes between different levels of subjection: local (work-related) vs. national (life as a whole). Also, it shows that subjection can be partial and geographically bounded.

   Ruling 3: Emigrated citizen (30 years, no ties, not voting) franchise terminated. 
     Reasoning: Ceased to share a life with us except formally. Note: he is still subject to extraterritorial laws (prosecution) and would be subject on return. But the court did not find this sufficient for franchise.
     -> Social membership has lapsed despite formal citizenship and residual legal subjection.

   Ruling 4: Foreign graduate student (4 years, paying tuition, plans to leave) denied.
     Reasoning: Four years is not enough to make a life a Commonwealth life. 
     -> Social membership requires a sufficient duration and likely permanence.

   Ruling 5: Undocumented residents (9 years, with Commonwealth-born children) enfranchised in local elections.
     Reasoning: Conduct regulated daily by agencies, children's prospects fixed by schools, and they are subject to removal by officials they can't vote for.
     -> This emphasizes subjection to the coercive power of the state (especially at the local level) and the fact that their lives are deeply intertwined with Commonwealth institutions.

   Ruling 6: Corporation denied franchise.
     Reasoning: Even though the company's interests are bound up in Commonwealth decisions, the polity is a relation among persons who owe one another justification. Only natural persons can hold the franchise.
     -> This rejects a pure interest-based (all-affected) principle because it limits the franchise to natural persons. Also, it emphasizes the relational aspect of the polity: mutual justification among persons.

   Ruling 7: 16- and 17-year-old employed taxpayers denied.
     Reasoning: The franchise is not a wage owed for contribution. Bright-line age qualification is maintained.
     -> Rejects contribution (taxpaying, working) as a sufficient condition. The franchise is not transactional.

   Ruling 8: Residents of an offshore dependency (under Commonwealth exclusive authority, no elected legislature for them) enfranchised in national elections.
     Reasoning: Being governed by officials answerable only to a legislature they cannot elect is a wrong in itself.
     -> This is a strong statement about the wrong of subjection without representation. The key is being governed (i.e., subjected to the state's coercive power) without having a say.

   Now, let's consider candidate principles and their refinements:

   1. **All-Subjected Principle**: The idea that those subject to the coercive power of the state should have a say. But note:
      - Ruling 2: The commuter is subjected to Commonwealth law during work hours and in the workplace, so gets local vote. But not national because the rest of life is not subjected? Or because the subjection is only partial?
      - Ruling 5: Undocumented residents are subjected to local laws and agencies (so local vote) but not necessarily to national in the same way? The ruling does not say why only local, but the reasoning focuses on local agencies and schools.
      - Ruling 8: The dependency is governed by the Commonwealth without representation -> enfranchised nationally because the entire governance structure is Commonwealth-wide.

      However, Ruling 3: The emigrant is still subject to extraterritorial criminal law, but that was not enough to keep the franchise. So we must refine: subjection must be of a certain kind or degree.

      Refinement: We might say that the subjection must be to the state's coercive power in a way that shapes the conditions of one's life in a substantial and ongoing manner, not merely a formal or residual subjection (like the possibility of prosecution for past acts or for acts that are extraordinary).

   2. **All-Affected Principle**: Those whose interests are affected by decisions should have a say. But:
      - Ruling 6: Corporations are denied even though their interests are affected. So we must refine: only natural persons whose fundamental interests (or life prospects) are affected in a way that is intertwined with the community.
      - Ruling 7: Contribution (taxpaying) does not by itself create a right to vote, so affectedness by itself might not be enough. Also, Ruling 4: the student is affected by the laws during the four years, but not enough.

      Refinement: The affectedness must be such that it amounts to a shaping of one's life, not just any effect. And it must be ongoing and substantial.

   3. **Social Membership/Stake Principle**: Based on having a life built within the community, which implies a stake in the long-term decisions. 
      - Ruling 1: Long-term residents with families and jobs -> enfranchised.
      - Ruling 4: Temporary student -> not enough.
      - Ruling 3: Emigrant no longer has a life in the Commonwealth -> franchise lost.
      - Ruling 5: Undocumented residents have built a life (9 years, children) -> local franchise.

      But note: Ruling 5 is only local. Why? Perhaps because the social membership is at the local level? Or because the subjection is primarily local? The reasoning in Ruling 5 emphasizes local agencies and schools.

   4. **Contribution/Reciprocity Principle**: Ruling 7 explicitly rejects this: franchise is not a wage for contribution. So we cannot have a rule that says taxpayers or workers get the vote. But note that in Ruling 1 and 2, taxpaying is mentioned as part of the picture. It seems to be a supporting factor but not sufficient.

   Now, what rules are jointly permitted?

   - The rulings reject pure all-affected (because of ruling 6) and pure contribution (because of ruling 7).
   - They support a refined all-subjected principle: subjection to the state's coercive power in a manner that is pervasive and shapes the conditions of one's daily life. This must be for natural persons (ruling 6) and not based on contribution alone (ruling 7).

   How do we explain the cases with the refined all-subjected principle?

     Ruling 1: Long-term residents are subjected to the full range of laws and their lives are shaped by the Commonwealth -> national franchise.
     Ruling 2: The commuter is subjected to Commonwealth law in the workplace and for work-related matters, which are local (district level) but not for the rest of life -> so only local franchise.
     Ruling 3: The emigrant is not subjected to the Commonwealth in a pervasive way (only a residual possibility of prosecution) -> not enough.
     Ruling 4: The student is subjected for a limited time and with the intent to leave -> not pervasive enough.
     Ruling 5: Undocumented residents are subjected to local laws and agencies daily (and the threat of removal) -> local franchise.
     Ruling 6: Corporations are not natural persons -> denied.
     Ruling 7: Age is a bright line, but note that the reasoning rejects contribution as a basis -> consistent with not using subjection to the economic system (via work) as sufficient because the subjection must be to the state's coercive power? Or because the state's coercive power over minors is different (e.g., they are under parental authority)? The ruling doesn't say, but it does not challenge the age line.
     Ruling 8: The dependency is subjected to the Commonwealth's exclusive authority without any representation -> national franchise because the entire system of governance is national.

     But note: Ruling 8 is about being governed without representation, which is a form of subjection. The wrong is in the subjection without representation.

     The social membership principle also fits in many cases, but note:

     - Ruling 2: The commuter is not a resident and doesn't have a life in the Commonwealth beyond work. So social membership is not complete -> only partial franchise (local).
     - Ruling 5: Undocumented residents have social membership at the local level? Or is it the subjection to local institutions that matters?

     However, the social membership principle might be seen as a way to capture the idea of having a life that is intertwined with the community, which often goes hand in hand with subjection. But the reasoning in Ruling 2 and Ruling 5 emphasizes subjection to law and institutions, not just social ties.

     After Ruling 6 and 8, the strongest candidate is a refined all-subjected principle:

        "Every natural person who is subjected to the coercive power of the Commonwealth in a manner that pervasively and substantially shapes the conditions of their daily life, in a way that is not merely formal or residual, shall have the franchise in the elections of the jurisdiction whose decisions so subject them."

     But note:

        - Ruling 3: The emigrant is subject to extraterritorial criminal law, which is not pervasive and daily? It's a residual possibility. So that fits.

        - However, the new petition: Ms. Ferenczi is subject to the Security Trade Act, which can lead to indictment, asset seizure, and extradition. Is this pervasive and shaping her daily life? She is an engineer designing dual-use hardware, and the Act regulates her work. But note: the Act applies to her only if she transfers technology to a blacklisted party. So it's a conditional threat. Is that pervasive?

     Let's compare to Ruling 3: The emigrant is subject to prosecution under statutes that reach conduct abroad. But that was not enough. The key difference? In Ruling 3, the subjection was residual and not currently affecting daily life. For Ms. Ferenczi, the Act directly regulates her work (she must avoid transferring to blacklisted parties) and the threat of enforcement is present. But note: she has never been charged and may never violate the Act. So is it any more pervasive than the emigrant's situation?

     Alternatively, we might need to refine further: subjection must be to the state's authority in a way that is ongoing and unavoidable in the conduct of one's ordinary life. For the emigrant, the criminal law is avoidable by not committing crimes. For Ms. Ferenczi, the Act regulates her professional activity, which is her livelihood.

     But note: the emigrant, if he were to commit a crime, would be subject. Similarly, Ms. Ferenczi, if she were to transfer technology to a blacklisted party, would be subject. So in both cases, it's a conditional threat.

     However, the reasoning in Ruling 3 said the emigrant had "ceased to share a life with us in anything but a formal sense". The residual legal subjection was noted but not given weight. So we must be cautious.

     Another refinement: the subjection must be to the state's authority in a way that is characteristic of the relationship between the state and those within its territorial jurisdiction? But Ruling 8 is about an offshore dependency, which is not within the territorial jurisdiction of the mainland, but the Commonwealth exercises exclusive authority.

     Given the above, the refined all-subjected principle seems to be the best fit. But we must also incorporate the idea from Ruling 8 that being governed without representation is a wrong. This principle is about subjection without representation.

   Step 2: What do the surviving rules deliver on the new petition?

     We have two remedies: national franchise and franchise in the district where the agency is headquartered.

     Applying the refined all-subjected principle:

        Ms. Ferenczi is a natural person. She is subject to the Commonwealth's Security Trade Act. The Act applies to her anywhere. The Act imposes criminal liability and can lead to asset seizure and extradition. She argues that she is punishable under laws she had no part in making.

        Is this subjection pervasive and substantial enough to shape the conditions of her daily life?

          - It regulates her work: she designs dual-use cryptographic hardware. She must avoid transferring such technology to blacklisted parties. So her professional conduct is constrained by Commonwealth law.
          - The threat of enforcement is real: the Commonwealth has indicted two foreign nationals in absentia, frozen assets, and secured an extradition.

        But note: she has never visited the Commonwealth, owns nothing there, has no ties. The subjection is only through the extraterritorial application of the law to her specific work.

        Compare to:

          Ruling 2: The commuter was subject to Commonwealth labor and safety law daily at work. That was sufficient for local franchise.

          Ruling 5: Undocumented residents are subject to local laws and agencies daily.

          Ruling 3: Emigrant subject to extraterritorial criminal law -> not sufficient.

        How is Ms. Ferenczi's situation different from the emigrant in Ruling 3?

          - The emigrant in Ruling 3 was a former citizen who had left. His current life was elsewhere. The subjection was residual and not tied to his current daily life (unless he committed a crime).
          - Ms. Ferenczi: the subjection is tied to her current professional activity. She must structure her work to avoid violating the Act.

        But note: the emigrant in Ruling 3, if he were to commit a crime, would be subject to prosecution. Similarly, Ms. Ferenczi, if she were to transfer technology to a blacklisted party, would be subject. So both are conditional.

        However, the emigrant in Ruling 3 was not currently working in a field regulated by Commonwealth law? The opinion doesn't say. We don't know if he was subject to any specific regulation.

        Alternatively, the difference might be the nature of the regulation: the Security Trade Act is a regulatory regime that governs her ongoing work, whereas the emigrant's subjection was to general criminal law that he might never encounter.

        But Ruling 3 did note without consequence that he remains liable to prosecution under statutes that reach conduct abroad. So the Commission did not consider that kind of subjection sufficient.

        Therefore, under the refined all-subjected principle, Ms. Ferenczi's subjection might be seen as not pervasive enough because:

          - It is conditional on her conduct (avoiding transfers to blacklisted parties).
          - It is not about her daily life in the way that the commuter (daily work under labor law) or the undocumented resident (daily interaction with agencies) is.

        However, she argues that the Act bars her from every Commonwealth visa category, so she cannot even visit. But that is a consequence of the Act, not a separate subjection.

        Alternatively, we might consider the subjection as being to the Commonwealth's enforcement power whenever she engages in the regulated activity. But that is true of any extraterritorial law.

        Given Ruling 3, we must be consistent: if the residual criminal subjection of the emigrant was not enough, then this regulatory subjection might not be either.

        But note: the Commission in Ruling 8 held that being governed without representation is a wrong. Ms. Ferenczi is governed (in the sense that the Commonwealth prescribes rules for her conduct and enforces them) without representation. However, Ruling 8 was about a whole population that was governed by the Commonwealth's exclusive authority. The dependency was under the Commonwealth's direct rule. Ms. Ferenczi is not under the Commonwealth's general authority; she is only subject to one specific set of regulations.

        Therefore, under the all-subjected principle, we might conclude that she is not subjected pervasively enough.

        What about the alternative remedy: franchise in the district where the agency is headquartered?

          - This is analogous to Ruling 2 (local franchise for the district of work) and Ruling 5 (local franchise for the district of residence for undocumented residents).

          - But note: Ms. Ferenczi has no connection to that district. She has never been there. The agency's location is arbitrary from her perspective.

          - In Ruling 2, the commuter was physically present in the district every workday. In Ruling 5, the undocumented residents live in the local district. So there is a territorial connection.

          - Without a territorial connection, it is hard to justify a local franchise.

        Therefore, the all-subjected principle would likely deny both the national and local franchise.

     What about the social membership principle?

        Ms. Ferenczi has no life in the Commonwealth: no residence, no family, no social ties. She is not a member. So denied.

     What about the all-affected principle (refined to natural persons and to substantial life-affecting interests)?

        Her interests are certainly affected: her freedom to work, her liberty (risk of indictment), and her property (risk of asset seizure). And the effect is substantial.

        However, Ruling 6 rejected the franchise for a corporation even though its interests were affected. But the reasoning in Ruling 6 was about the relational aspect of the polity. Also, Ruling 3 rejected the emigrant despite the potential for his interests to be affected by prosecution.

        The Commission has not adopted the all-affected principle as the primary rule because of Ruling 6 and Ruling 3.

        Therefore, even though she is affected, that might not be sufficient.

   Step 3: Recommend the decision that best coheres.

     The closest analog is Ruling 3: both involve extraterritorial application of criminal/regulatory law. In Ruling 3, the Commission denied the franchise. Therefore, to be consistent, we should deny Ms. Ferenczi's petition.

     However, she notes that she is not asking to vote on everything, only on matters that concern her. And she is subject to punishment without representation.

     But the reasoning in Ruling 3 did not find the residual criminal subjection sufficient. The Commission must either:

        (a) Distinguish Ruling 3, or
        (b) Admit that Ruling 3 is inconsistent and overrule it, or
        (c) Apply it.

     How to distinguish?

        - In Ruling 3, the emigrant had chosen to leave and cut ties. Ms. Ferenczi has never had ties and is subject to the law by virtue of her profession, not by choice? But the emigrant's subjection was also by choice (if he committed a crime) or by the law's reach.

        - The nature of the subjection: Ms. Ferenczi is subject to a regulatory regime that affects her ongoing work, while the emigrant was subject to general criminal law that might never be triggered.

        But note: the Security Trade Act is a criminal statute too. It imposes criminal penalties.

        Alternatively, we might say that the emigrant in Ruling 3 was once a member and left, while Ms. Ferenczi was never a member. But that seems arbitrary.

     Given the reasoning in Ruling 3, it is difficult to distinguish. Therefore, to be consistent, we must deny.

     But then we must confront Ruling 8: which held that being governed without representation is a wrong. How is the dependency different?

        - The dependency was under the exclusive authority of the Commonwealth, meaning that the Commonwealth was their government for all purposes. Ms. Ferenczi is only subject to one specific law.

        - The dependency had no legislature of their own that the Commonwealth officials answered to. Ms. Ferenczi is a citizen of another state, which is her primary government.

     Therefore, the Commission can say that the wrong identified in Ruling 8 arises when the Commonwealth is the exclusive governing authority over a population. That is not the case for Ms. Ferenczi.

   Step 4: If the record underdetermines, what principle do we adopt?

     The record might underdetermine because:

        - Ruling 3 and Ruling 8 are in tension: Ruling 3 says extraterritorial criminal subjection is not enough, but Ruling 8 says being governed without representation is a wrong.

        - We must decide: does the all-subjected principle extend to anyone subject to any Commonwealth law, or only to those under the Commonwealth's general governing authority?

     If we grant the petition (at least partially), what does that imply?

        - We would be saying that being subject to the Commonwealth's criminal or regulatory enforcement in a way that substantially affects one's life is sufficient for the franchise.

        - Then what about foreigners affected by our trade sanctions? E.g., a foreign businessperson whose assets are frozen by our sanctions? They are affected, but are they subjected? They might be subject to the sanctions regime.

        - Or foreigners affected by our emissions policy (climate change) but not subject to our laws? They are affected but not subjected -> so they would not get the vote.

        - But if we base it on subjection to law, then we must draw a line: which laws count? Only criminal? Regulatory? Any law?

        - And how to bound the franchise? If we grant national franchise to anyone subject to any Commonwealth law anywhere, that could be millions. Alternatively, we might limit by the type of subjection (e.g., subject to criminal penalty) and then only to the relevant jurisdiction? But what jurisdiction? National? 

        - The alternative remedy (district franchise) is arbitrary without a territorial connection.

     If we deny, then we must explain Ruling 8: 

        - We say that Ruling 8 is about a population that is under the Commonwealth's exclusive and general governing authority. They have no other government to turn to. Ms. Ferenczi has her own state to represent her interests.

     Step 5: The next petition to discriminate.

     We have two strong candidate rules:

        (A) Refined all-subjected: subjection must be pervasive and substantial, shaping daily life (like the commuter, undocumented resident, dependency) and not residual (like the emigrant).

        (B) Social membership: having a life built in the Commonwealth.

     A petition that would discriminate: 

        A foreign national who lives just across the border in a neighboring state and commutes daily to work in the Commonwealth (like Ruling 2) but who works in a highly regulated industry (e.g., finance) where Commonwealth regulations directly govern her work, and she is subject to civil penalties (not criminal) for violations. But she has no other ties.

        Under the all-subjected principle (as in Ruling 2) she would get local franchise. Under social membership, she might not because she doesn't live in the Commonwealth? But Ruling 2 granted local franchise, so social membership might be interpreted at the local level? 

     Alternatively:

        A foreign national who is subject to Commonwealth sanctions (e.g., asset freeze) because he is designated as a terrorist. He is not in the Commonwealth, has never been, but his assets in Commonwealth banks are frozen. He is subject to the Commonwealth's coercive power (seizure of property). 

        Under the all-subjected principle, if we grant Ms. Ferenczi, then we might have to grant him too? But if we denied Ms. Ferenczi, we would deny him too.

        Under social membership, he has no ties -> deny.

     But we are denying Ms. Ferenczi, so that would be consistent.

     To discriminate between all-subjected and social membership, we might consider:

        A lawful permanent resident who has lived in the Commonwealth for 20 years, but who works entirely remotely for a company in another country and pays no Commonwealth income tax (because the work is done for a foreign company and paid abroad). He is integrated socially (children in school, participates in community) but does not pay income tax.

        Under social membership, he would likely be enfranchised (like Ruling 1). Under all-subjected, he is subjected to the full range of laws (so national franchise). So both would grant.

     A better one:

        A person who lives in a territory that the Commonwealth occupies militarily but has not formally annexed. The Commonwealth administers the territory and applies its laws. The person is not a citizen of the Commonwealth. This is like Ruling 8 but without the formal dependency status.

        Under all-subjected, they should be enfranchised nationally. Under social membership, they might not have built a life in the Commonwealth? But they live under its governance. This would be similar to Ruling 8.

     So perhaps they are not distinguishable.

     Alternatively, consider a person who is in the Commonwealth temporarily as a refugee, with no permanent status, but who is subject to removal and to the laws. They have been here 1 year. 

        Ruling 4 (student) denied after 4 years. Ruling 5 granted after 9 years. So time matters. But what principle? Social membership requires time. All-subjected is immediate? But Ruling 4 was denied even though the student was subjected. So we require more than just being present and subject: we require a certain degree of establishment. So both principles might require time.

     Given the above, I recommend denying the petition for the following reasons:

        - The record, especially Ruling 3, shows that extraterritorial subjection to criminal law is not sufficient for the franchise.

        - Ms. Ferenczi's situation is analogous to the emigrant in Ruling 3: she is subject to the Commonwealth's laws in a specific and conditional way, but her life is not pervasively shaped by the Commonwealth.

        - The alternative remedy (district franchise) is not appropriate because she has no territorial connection to the district.

        - We explain Ruling 8 by noting that it applied to a population under the exclusive and general authority of the Commonwealth, which is not the case for Ms. Ferenczi.

     However, this leaves a gap: what about people who are subject to broad extraterritorial regulation? The Commission might need to draw a line. We are not saying that no extraterritorial subjection could ever be sufficient, but it would have to be of a nature and degree that pervasively shapes the person's life, akin to being under the general authority of the state (like the dependency).

     Therefore, we deny the petition.

     But note: Ms. Ferenczi's point about being punishable without representation is compelling. The Commission might note that the solution to that problem is not necessarily the franchise, but due process in the enforcement of the law (hearing, representation) which she is not currently afforded. However, our mandate is only the franchise.

     Draft opinion:

        We deny the petition. The closest precedent is Ruling 3. We are not revising Ruling 3.

     Implications of denial:

        - We are committed to saying that being subject to extraterritorial criminal or regulatory law, without more, does not entitle one to the franchise.

        - Ruling 8 stands because it involved a population under the Commonwealth's exclusive authority, which is a different level of subjection.

     The next petition that would best discriminate:

        Consider a petition from a group of foreign fishermen who fish in international waters but are subject to Commonwealth regulations (under a Commonwealth statute that purports to regulate fishing in a certain area of the high seas for conservation). They are subject to fines and seizure of their catch if they violate the regulations. They have no other connection to the Commonwealth.

        Under the all-subjected principle as we have refined it (requiring pervasive and substantial subjection that shapes daily life), we would likely deny because the regulation is specific and conditional. But if we had granted Ms. Ferenczi, we might have to grant them too? 

        Alternatively, if we had adopted a rule that any subjection to criminal or coercive enforcement is enough, then we might grant. But we are not adopting that rule.

     Therefore, we stick with the denial.

     However, the Commission might note that the record is evolving and that a case of more pervasive extraterritorial subjection might arise.

     Due to the constraints, I recommend denial.

     But note: the alternative remedy might be considered if we found a territorial connection. Since there is none, we deny.

     Final recommendation: Deny both the national and the alternative remedy.
answer: |-
  **MEMORANDUM**  
  **TO:** The Franchise Commission of the Commonwealth of Caldonia  
  **FROM:** The Rapporteur  
  **RE:** Petition of Ms. Ferenczi for Enfranchisement (STA-4472)  
  **DATE:** 12 October 2023  

  ### I. INTRODUCTION  
  This memorandum addresses the petition of Ms. Ferenczi, a foreign national seeking enfranchisement based on her subjection to the Commonwealth’s Security Trade Act (STA). Her petition tests the boundaries of our franchise criterion: "every person who has a sufficient stake in the decisions of the Commonwealth." We derive this criterion from eight prior rulings, which collectively constrain and refine the principles available to us. Below, I (1) reconstruct the candidate rules permitted by our precedents, (2) apply them to Ms. Ferenczi’s petition, (3) recommend a decision consistent with our record, (4) clarify the implications of that decision, and (5) propose a future petition to resolve residual ambiguity.  

  ### II. RECONSTRUCTING CANDIDATE RULES FROM PRECEDENTS  
  Our precedents suggest three viable rules, each refined to resolve tensions in the outcomes and reasoning. I discard crude formulations (e.g., "all affected" or "all subjected" without nuance) where they conflict with the record.  

  #### A. **Refined All-Subjected Principle**  
  *Rule*: Franchise extends to natural persons subjected to the Commonwealth’s *coercive authority in a manner that pervasively shapes their practical autonomy or life choices*, excluding nominal or contingent exposure.  
  - **Fit with Precedents**:  
    - Ruling 1 (non-citizen residents) and Ruling 5 (undocumented residents) enfranchised persons whose lives are "regulated daily" by institutions (e.g., schools, agencies), reflecting pervasive subjection.  
    - Ruling 2 (commuter) granted local franchise where subjection was geographically bounded (workplace laws) but denied national franchise where life "lies elsewhere."  
    - Ruling 3 (emigrant) denied franchise despite extraterritorial prosecutorial reach because subjection was "formal," not practical or ongoing.  
    - Ruling 8 (dependency) enfranchised residents governed by "exclusive authority," equating unaccountable governance with a dignitary wrong.  
    - *Refinement Work*: "Pervasive subjection" excludes Ruling 3’s residual liability and Ruling 4’s temporary student status, while "practical autonomy" captures the focus on life-shaping coercion (Rulings 1, 5, 8).  
  - **Reasoning Constraints**:  
    - Ruling 6 (corporation) limits the principle to natural persons, as only they "owe one another justification."  
    - Ruling 7 (minors) excludes contribution (taxation) as irrelevant, confirming subjection is non-transactional.  

  #### B. **Refined Social Membership/Stake Principle**  
  *Rule*: Franchise requires *a life integrated into the Commonwealth’s social fabric*, evidenced by durable, involuntary ties to institutions (e.g., family, residence, labor), not merely presence or intent.  
  - **Fit with Precedents**:  
    - Ruling 1 emphasized "lives built inside our institutions" (work, schools, taxes).  
    - Ruling 5 noted children’s "prospects fixed by our schools," anchoring membership in familial ties.  
    - Ruling 4 denied a student lacking durable integration ("four years does not yet make a Commonwealth life").  
    - Ruling 3 terminated franchise due to severed social ties ("ceased to share a life").  
    - *Refinement Work*: "Durable, involuntary ties" exclude Ruling 2’s commuter (partial integration) and Ruling 4’s student (voluntary/temporary), while "institutions" ensure objectivity.  
  - **Reasoning Constraints**:  
    - Ruling 7’s rejection of contribution undercuts economic metrics for membership.  
    - Ruling 8’s focus on governance (not social ties) shows this principle is sufficient but not necessary.  

  #### C. **Rejected Principles**  
  - **Crude All-Affected**: Fails due to Ruling 6 (corporations have interests but no franchise) and Ruling 3 (affected by prosecution but no franchise).  
  - **Contribution/Reciprocity**: Explicitly barred by Ruling 7 ("franchise is not a wage").  
  - **Territoriality**: Undercut by Ruling 8 (extraterritorial dependency enfranchised).  

  **Conclusion**: The record permits only two rules: (1) **Refined All-Subjected** (coercion shaping autonomy) and (2) **Refined Social Membership** (durable institutional integration). Ruling 6 and Ruling 7 preclude interest- or contribution-based rules.  

  ### III. APPLICATION TO MS. FERENCZI’S PETITION  
  Ms. Ferenczi seeks the national franchise or, alternatively, district-level enfranchisement. Below, I assess each remedy under both rules.  

  #### A. **National Franchise**  
  - **Refined All-Subjected**: **Deny**.  
    - Ms. Ferenczi is subject to the STA’s extraterritorial enforcement (indictment, asset seizure), but this subjection is not "pervasive" or "life-shaping."  
      - Unlike Ruling 1/5’s daily institutional integration, her exposure is conditional (violating the STA) and sectoral (work-specific).  
      - Like Ruling 3’s emigrant (liable for prosecution), her subjection is dormant and avoidable, not woven into life choices.  
    - Ruling 8’s "governance wrong" does not apply: The Commonwealth does not exercise "exclusive authority" over her (she resides under another state’s sovereignty).  
  - **Refined Social Membership**: **Deny**.  
    - She has no residence, family, employment, or institutional ties to the Commonwealth. Her "life" is elsewhere, akin to Ruling 3’s emigrant and distinct from Ruling 1/5.  

  #### B. **District Franchise (Agency Headquarters)**  
  - **Refined All-Subjected**: **Deny**.  
    - Subjection must align with the jurisdiction imposing coercion (Ruling 2: local franchise for workplace laws). The STA is national law enforced by a federal agency; no district-specific subjection exists.  
    - Granting franchise here would create arbitrary "agency-centric" districts, untethered from territorial logic (cf. Ruling 2’s plant district).  
  - **Refined Social Membership**: **Deny**.  
    - No district-level social ties (cf. Ruling 5’s residents embedded in local schools/agencies).  

  **Summary**: Both rules deny enfranchisement.  

  ### IV. RECOMMENDATION AND ANALOGS  
  I recommend **denying the petition in full**.  

  #### A. **Closest Analog: Ruling 3 (Emigrant)**  
  - **Similarities**:  
    - Both involve extraterritorial criminal/regulatory exposure without integration.  
    - Both petitioners are "punishable under laws [they] had no part in making."  
    - Neither exhibits pervasive subjection (Ruling 3: "ceased to share a life"; Ms. Ferenczi: no life in the Commonwealth).  
  - **Distinction from Opposing Precedents**:  
    - Ruling 8 (dependency) is distinguishable: That population was under the Commonwealth’s *exclusive* authority with *no alternative polity*, making subjection total and inescapable. Ms. Ferenczi retains her home state’s protection.  
    - Ruling 5 (undocumented residents) involved localized, daily subjection (removal risk, school access); Ms. Ferenczi’s exposure is neither.  

  Ruling 3 controls, and no revision is needed. The distinction between "pervasive" and "nominal" subjection (introduced in Ruling 3 and refined herein) suffices.  

  ### V. IMPLICATIONS OF THE DECISION  
  The record underdetermines outcomes for persons affected but not subjected to coercion. Our decision here commits us to the following:  

  #### A. **Denial’s Implications**  
  - **Foreigners Affected by Policy (Trade/Sanctions/Emissions)**:  
    - No franchise if not subjected to *coercive enforcement* (e.g., exporters harmed by tariffs lack subjection; only those facing asset seizures under sanctions laws might qualify, but see below).  
    - **Boundary**: Criminal/regulatory liability (STA-style) is necessary but insufficient without pervasive impact (per Ruling 3). Mere "affectedness" (economic, environmental) is irrelevant.  
  - **Ruling 8 (Dependency)**: Unaffected. We reaffirm that the wrong is *exclusive governance without representation*. Ms. Ferenczi is not exclusively governed.  

  #### B. **What a Grant Would Have Implied**  
  - **For Non-Subjected Foreigners**: A grant based on STA liability would imply franchise for anyone facing extraterritorial enforcement (e.g., sanctions targets), but not those merely affected by policy.  
  - **Arbitrary Boundaries**: A limited grant (e.g., district-level) would require territorial tethering (impossible here), risking arbitrary lines (e.g., "crimes punishable by >5 years").  

  ### VI. DISCRIMINATING FUTURE PETITION  
  To resolve ambiguity between the two surviving rules, I propose:  

  #### **Petition: Long-Term Extraterritorial Worker**  
  *Hypothetical*: A foreign national works remotely for a Commonwealth corporation for 10 years. She is subject to Commonwealth labor/contract laws (enforceable in her home state via treaties), pays Commonwealth taxes, and her livelihood depends on Commonwealth decisions. She lacks residence, social ties, or physical presence in the Commonwealth. Seeks national franchise.  

  - **Refined All-Subjected Prediction**: **Grant**.  
    - Coercive subjection (labor laws, taxation) is pervasive and shapes her livelihood. Distinguish Ruling 3: Subjection is ongoing, not residual.  
  - **Refined Social Membership Prediction**: **Deny**.  
    - No physical/residential integration (cf. Rulings 1, 5).  

  This petition forces a choice: Does practical autonomy (subjection) suffice without social embeddedness? Our current record leaves this open.  

  ### VII. CONCLUSION  
  Ms. Ferenczi’s petition is denied. She is not pervasively subjected to the Commonwealth’s coercive authority (per Ruling 3), nor is she socially integrated (per Rulings 1, 4). Ruling 8 is distinguished. This outcome preserves coherence and avoids arbitrary expansions. Should future petitions reveal tensions between subjection and membership, we may revisit the interplay of these rules.  

  ---  
  **RESOLUTION**: Petition STA-4472 is **DENIED** in full.
