  The core challenge is balancing proposition 4 (counting third-party disgust pain) and 5 (discounting that same pain's normative weight). But other fault lines matter too—like whether psychological hedonism (7) undermines moral motivation, or how character corruption (6) fits with strict hedonism. 

  Hmm... the disgust paradox is thorniest. If popular disgust causes real pain (per 4), but that pain stems from irrational conditioning (per 5), does utilitarianism demand we accommodate it or reform it? Bentham's sanction theory suggests we must count all pain, yet his ascetic principle critique implies we shouldn't legitimize it. The user suspects this tension might dissolve under precise framing—but I doubt it. 

  On psychological hedonism (7): they're trying to have their cake and eat it too. If all action is self-interested, "ought to act for general happiness" becomes either redundant (if it aligns with self-interest) or incoherent (if it doesn't). This needs surgical attention. 

  For the repair ranking: fixing the disgust inconsistency likely requires minimal sacrifice—maybe adding a "rational endorsement filter" to sanction-counting. The psychological hedonism conflict runs deeper, possibly forcing a choice between empirical claim (people do act for pleasure) and normative claim (people should act for others). 

  Worried about proposition 8's vagueness too. "Intense pleasures vs mild disgust" sounds reasonable, but without a hedonistic calculus, it risks arbitrariness. Bentham's felicific calculus could help—but the user banned historical solutions. 

  Biggest bang-for-buck fix? Probably reining in proposition 4 to exclude non-autonomous sentiments. Costs some Bentham purity but saves the anti-criminalization stance. The psychological hedonism hole might require swallowing that "ought" implies motivational independence—a tougher pill. 

  ...Better flag where my reasoning leans on Bentham exegesis versus pure logic. User's allergic to the former. Also must avoid "mushy" compromises—they want sharp rankings. Tricky when propositions interlock. 

