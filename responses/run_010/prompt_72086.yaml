  First, I need to pinpoint the core maneuver: It's not just analyzing pleasure via desire, but specifically using attitude-relocation as a dissolution tool for heterogeneity problems. Key features are: abandoning intrinsic commonality, treating objections as category errors, and iterative refinement of the attitude criterion. 

  The closest established concept is "Dispositionalism about pleasure" (e.g., Sidgwick, Brandt), but the user notes this differs from their focus—they're interested in the argumentative pattern, not just the theory itself. "Attitudinal Relocation" as a term captures the shift from object to stance. But the user needs boundaries: When does this maneuver apply? 

  Boundary cases: 
  - Moving to a bystander's attitude (still counts, since commonality remains psychological and extrinsic). 
  - Relocating to causal roles (doesn't count—now it's functionalist, not attitudinal). 
  The key is whether the "common element" is a psychological stance held by someone toward the experience.

  Regarding costs: The user is right that this risks circularity (defining pleasure via wanting-for-its-sake presupposes agreeableness). Defenders might bite the bullet, arguing that "good" just is what we'd desire to desire. But the empty formalism worry persists—hedonism becomes "desire-satisfaction is good" in disguise.

  For differentiation: 
  - Response-dependent theories (e.g., fitting-attitude analyses) are broader—they define value via merited responses, not dissolve heterogeneity. 
  - Family-resemblance approaches deny any commonality; here, theorists assert it exists in the attitude. 

  The user's need is precise taxonomy for note-taking—they'll likely use this to analyze philosophical texts. Coining "Attitudinal Dissolution" seems justified, with clear criteria: (1) targets heterogeneity objections, (2) relocates commonality to subject's concurrent attitude, (3) treats objections as dissolved via iterative refinement. The bystander case fits; causal relocation doesn't. The cost is genuine but not necessarily fatal—it depends on whether one accepts desire-based accounts of value.
answer: |-
  Based on your meticulous description, the core manoeuvre you're isolating doesn't have a single, universally agreed-upon name, but it fits within a recognizable philosophical pattern. The closest established concept is **Dispositionalism about Pleasure**, but your focus is on the *argumentative move* within dispositionalism, particularly its use to *dissolve* heterogeneity problems. Let's define the manoeuvre, differentiate it, set boundaries, and assess the cost.

  ### 1. The Manoeuvre: Definition & Proposed Term
  *   **Name:** **Attitudinal Dissolution of Heterogeneity** (or **Attitudinal Relocation**)
  *   **Core Definition:** The strategy of resolving a "what-do-these-things-have-in-common?" problem (e.g., diverse pleasures) by abandoning the search for an intrinsic common property *within the things themselves* (phenomenal quality, essential structure) and instead locating the relevant commonality *entirely in a specific psychological stance or attitude* adopted by a subject *towards* those things (e.g., wanting to continue, welcoming, intrinsic desire for). Crucially, counterexamples are absorbed not by finding a new intrinsic property but by *iteratively refining the description of the required attitude* (e.g., adding "for its own sake," "concurrent," "independent of consequences").
  *   **Why this term?**
      *   **Attitudinal:** Pinpoints the relocation to the subject's stance.
      *   **Dissolution:** Emphasizes treating the objection as misguided/moot rather than directly refuted by finding an intrinsic property. The problem is dissolved by redefining the category.
      *   **Heterogeneity:** Specifies the *type* of problem it addresses – the apparent lack of shared intrinsic essence across diverse instances.

  ### 2. Differentiation from Neighbouring Concepts
  *   **Dispositionalism about Pleasure:** (Sidgwick, Brandt, Heathwood) This is the *broader theory* that pleasure *is* (or is constituted by) a certain disposition or attitude (e.g., being desired, being liked). **Your manoeuvre is the specific *argumentative tactic* used *within* dispositionalism to handle heterogeneity objections.** All instances of your manoeuvre concerning pleasure are dispositionalist, but dispositionalism might be defended on other grounds too (e.g., conceptual analysis, empirical psychology). Your manoeuvre is defined by its *function* in dissolving heterogeneity.
  *   **Response-Dependent Theories of Value / Fitting-Attitude Analyses:** (E.g., values defined as what merits a certain response). These theories share the *relocation* aspect (value isn't intrinsic, it's tied to responses). **Key Difference:** Your manoeuvre focuses on *dissolving a heterogeneity problem within a pre-existing category* (pleasure) by relocation. Response-dependence often defines the category *itself* via the response. While the relocation is similar, the *purpose* (dissolving heterogeneity vs. defining value) and *target* (pleasure vs. goodness/value) differ. Your manoeuvre could be *used within* a response-dependent framework.
  *   **Family Resemblance / Cluster Concepts:** (Wittgensteinian) This strategy denies there *is* any single common element unifying a concept, instead pointing to overlapping similarities. **Key Difference:** Your manoeuvre *asserts* a common element exists – it's just not intrinsic to the objects, it's the attitude. It doesn't embrace essential heterogeneity; it relocates the essence. The family resemblance approach dissolves the *need* for a common element, while your manoeuvre relocates *where* that common element is found.
  *   **Functionalist Accounts:** (E.g., pleasure defined by a causal role like reinforcement). This also relocates the essence, but to a *causal/functional* role within a system, not necessarily to a *concurrent psychological attitude* of the subject. **Key Difference:** The core of your manoeuvre is the relocation to the *subject's conscious or intentional stance* during the experience. Functional roles are non-psychological (or sub-personal). (See Boundary Case 2 below).

  ### 3. Boundaries of the Manoeuvre: What Counts?
  *   **Boundary Case 1: Bystander's Attitude (Yes, it counts).**
      *   **Why?** The commonality is still relocated from the intrinsic quality of the *experiences themselves* to a *psychological attitude held by someone* (even if not the experiencer) *towards* that experience. The structure is identical: diverse experiences are unified by a single type of favorable stance taken towards them, dissolving the need for intrinsic commonality. The experiencer's own attitude was just the initial, intuitive locus; moving it to a bystander is a variation within the same strategy.
  *   **Boundary Case 2: Relocation to Causal/Functional Role (No, it doesn't count).**
      *   **Why?** The defining characteristic of your manoeuvre is relocation to a *psychological stance or attitude* (wanting, welcoming, desiring). Relocating the commonality to a non-psychological feature like "causes approach behavior," "reinforces learning," or "contributes to homeostasis" is a fundamentally different strategy. It's a *functionalist* or *causal-role* reduction/definition, not an *attitudinal* one. The commonality is now located in the *effect* the state has or the *role* it plays in a system, not in a subject's concurrent intentional stance towards it. This doesn't dissolve the heterogeneity problem via attitude-relocation; it dissolves it by claiming the essence lies in the state's external relations or systemic function.

  ### 4. The Cost: Genuine Objection or Absorbable?
  *   **The Cost Articulated:** The claim "Pleasure is the Good" (Hedonism) risks becoming tautological or vacuous. If pleasure is *defined* as "what is intrinsically desired/welcomed," then "pleasure is the good" reduces to "what is intrinsically desired/welcomed is what is intrinsically desired/welcomed" (or "is good"). It loses substantive content about *why* we *should* desire it, seeming to merely equate "good" with "desired."
  *   **Is this a Genuine Objection?**
      *   **Yes, it's a serious and genuine objection.** It highlights a potential weakness in the entire dispositionalist project regarding value theory. The manoeuvre successfully dissolves the heterogeneity problem *for identifying pleasures*, but it potentially undermines the normative force of hedonism by making the identification of the *good* (pleasure) dependent on pre-existing desires/stances. It risks conflating the *good* with the *desired*.
  *   **Can Defenders Absorb It Without Revision?**
      *   **They try, but it requires significant auxiliary commitments, not mere absorption:** Defenders (e.g., sophisticated desire-satisfaction theorists or certain forms of internalism) typically *don't* revise the account of pleasure itself but add layers:
          1.  **Idealization:** Argue that pleasure is what one *would* desire intrinsically under conditions of full information, rationality, or reflection (e.g., Brandt, Railton). This moves away from the *concurrent* attitude but retains the attitudinal core.
          2.  **Constitution, not Identity:** Argue that being desired intrinsically *constitutes* something being good/pleasant, but this constitution isn't merely definitional; it reflects a deep connection. This is hard to distinguish from the tautology charge without metaphysical weight.
          3.  **Biting the Bullet:** Accept that "good" just *means* (or is fundamentally tied to) what we (ideally, rationally) desire. Hedonism then becomes the claim that *only* pleasure (defined as the proper object of intrinsic desire) has this property. This makes hedonism a substantive claim about what actually fulfills rational desires, but the normative force now resides entirely within the idealization/rationality conditions.
      *   **The Cost Isn't Fully Absorbed Without Revision:** The defender *must* address the normativity question head-on, usually by invoking idealization or a substantive theory of rational desire. They cannot simply point to the dissolution of heterogeneity and declare the problem solved for the value claim. The manoeuvre solves the *identification* problem for pleasure at the potential cost of creating a *normative* problem for hedonism. The objection highlights a tension inherent in using desire-attitudes both to *define* the target of value (pleasure) and to *ground* its value.

  **In Summary:**

  *   The manoeuvre is **Attitudinal Dissolution of Heterogeneity**: dissolving a "common essence" objection by relocating the essence from intrinsic properties of objects to a specific type of favorable psychological attitude held by a subject (often the experiencer) towards those objects, with iterative refinement to handle counterexamples.
  *   **Closest Established Concept:** The argumentative move *within* **Dispositionalism about Pleasure**.
  *   **Boundaries:** It **counts** if relocated to a bystander's attitude. It **does not count** if relocated to a non-psychological (e.g., causal/functional) property.
  *   **The Cost:** The potential vacuity of "Pleasure is the Good" is a **genuine and significant objection**. Defenders can respond, but it requires substantial additional argument (typically involving idealization) and doesn't simply "absorb" the cost without addressing the normative dimension; it shifts the battleground. The manoeuvre succeeds for *identifying* pleasure but creates a challenge for *justifying* its status as the sole intrinsic good.
