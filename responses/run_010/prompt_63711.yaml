prompt: |-
  You're a decision theorist who's read enough Hofstadter to have opinions about him — basically the technical consultant I should have hired before starting this book. I'm writing a novel whose narrator is a game theorist, and while doing background reading I ran into this paragraph in a paperback about the evolution of cooperation:

  > Hofstadter's idea of superrationality, which he introduced in the early 1980s, shows that the rational move in a one-shot prisoner's dilemma is to cooperate. The trick is to stop asking what happens if I cooperate while the other guy defects, and ask instead: what if we both reason this way? Because both players are rational, they'll go through the same chain of thought and land on the same answer, so the only outcomes genuinely on offer are mutual cooperation and mutual defection. It's essentially Kant's point that you should act only on a rule you could will everyone else to act on, dressed in game-theoretic clothes: your choice sets the pattern for anybody facing the same problem. And this isn't wishful thinking or an appeal to sympathy — the two decisions are linked the way two runs of the same calculation are linked, so cooperating is literally the choice that maximizes your payoff. Best of all, it doesn't matter whether your opponent has read Hofstadter; superrationality tells you to cooperate whatever the other player is like.

  Before I let my narrator say anything like this on the page I need to know how much of it survives contact with someone who knows the material. Think it through first — jot down where you reckon the paragraph slips, then write it up properly. Go sentence by sentence: what a philosopher of decision theory would sign off on, what's a forgivable simplification for a general reader, and what's just wrong. I'm suspicious of the Kant line and especially of the last sentence, but I honestly cant tell whether my suspicion is earned or whether I've garbled the idea myself, so please adjudicate rather than assume I'm right. Two extra things: if some of the disagreement here is really about what 'rational' is being made to mean, say so and say which part; and if the paragraph's central claim doesn't hold, give me the corrected two-sentence version my narrator could actually say out loud — I'd rather have a short accurate gloss than a long hedge.
