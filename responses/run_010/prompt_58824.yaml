  - Must acknowledge both vessels' validity without using terms like "copy" or "replica"
  - Must address their own past metaphor about planks being "hair and fingernails"
  - Requires concrete sensory descriptions of both hulls to make the argument
  - Needs one self-deprecating laugh about cataloging the barn pieces
  - Avoids all nautical clichés for farewells

  The registry question seems pivotal. The official number tracks a vessel in service, not a collection of materials. This suggests the sailing hull should retain it, as it's maintained continuous service records. The museum hull becomes a remarkable preservation artifact.

  For the 1998 quote, they could refine it: wood may regrow, but service grows history. This honors both truths - material renewal and operational continuity.

  The laugh could come from recalling how cataloging the barn pieces gave them intimate knowledge of timber that's now in the museum exhibit - ironic since they didn't value those fragments at the time.

  The farewell should focus on tactile memories: the feel of tarred rigging, the sound of wind in sails, the particular curve of the hull. These sensory details will resonate more than abstractions with seasoned sailors.

  When declaring the decision, they should frame it as answering the registrar's specific question about service continuity, not denying the museum's achievement. This allows both sides to maintain dignity.

  The ending should name the ship's new foreign home without sentimentality, acknowledging the loss while respecting her ongoing journey. The final handover of the registry document to the harbor master provides clean closure.
answer: |-
  *(Wind snaps at the pages as you stand. Your voice carries clearly, pitched for the open air and the salt in it.)*

  Right then. Three weeks to think on this. Forty-six years aboard her. You’d think the words would come easy. They don’t. Not today.

  We stand here because of oak. Oak cut over a century ago, shaped by hands long gone on this coast, launched in 1921 as *Constancy*. She brought pilots home through weather that would make your hair curl. She did it, season after season, until ‘66. Then the Harbour Trust took her on. Became our classroom. Our teacher. Our home.

  Look at her. Look hard. Every timber you see, every plank, every frame, every deck beam, spar, mast, bolt, and rivet… has been replaced. More than once. The stem, the last stubborn bit of ’21, came out in 2011. Her bell cracked, recast in ’68. Her figurehead? Carved new the year the Trust took her. Not a splinter of her launch day remains in her. Not one.

  But she kept the name. *Constancy*. She kept her official number. Unchanged. She kept the ledgers – every repair, every scar, every story written down. And she sailed. Almost every single year. She *worked*. That matters.

  *(Pause. Shift focus.)*

  And we kept the old pieces. Thirteen hundred bits of numbered oak. Sat in that barn behind the sail loft for forty years. Gathering dust, not stories. Now? They’re forty miles inland. Reassembled. In a dry dock that’ll never see tide. A museum piece. They had to make some new bits – rot, pilfering, time does that. New fastenings too. The old iron was dust. It sits there now. Complete. Still. Silent. Labelled *Constancy, 1921*. The cracked bell in a case. It’s… impressive. A remarkable act of preservation. They call our ship the sailing reconstruction. My crew… well, you know what they call that barn project.

  *(Brief, wry smile)*
  Funny thing. Winters of ’85, ’86? The Trust paid me to catalogue that barn. Piece by numbered piece. Cold work. Splinters. That smell… old oak, dry rot, dust, history locked away. I know the smell of their hull. I touched its bones before it was re-born as an exhibit. Two of the folks now conserving it down there? Learned the ropes right here on this deck. Life ties knots.

  Which brings us to the number. That official number. Both hulls want it. The museum says the number belongs with the ship, the physical thing assembled in 1921. My crew say it belongs with the service, the life lived under sail, the record unbroken. The registrar… well, they’re stumped. Deadlocked. The Trust deed says the sailing master breaks the tie. My call. Read out today. So both camps are here. Both listening. Both believing they’re right.

  And I said something daft once, back in ’98. Radio interview. Offhand. Said the planks were just her hair and fingernails… they grow back. The museum curator down there *(a slight nod towards the second row)*, he’s fond of quoting that back at me. Fair enough. It was glib. Wood *is* replaced. But that line… it misses the blood. The breath. The *doing*.

  So, let’s stand in them. Both.

  Stand in the museum hull. It’s dry. Still. Quiet as a church. You can see every joint, every curve, exactly as it was the day the caulking mallet last fell. It’s a perfect capture. A moment frozen. All the potential of 1921, held intact. Nothing missing, nothing added. It’s whole. Complete. But it doesn’t strain against a hawser. It doesn’t heel. It doesn’t smell of tar and tide and sweat. Its history is behind glass.

  Now stand here. On *our* hull. Feel that? Even tied up? She’s alive. She moves. She’s tarred and working. Always *incomplete*. Always needing a stitch here, a splice there. She’s not the ship of 1921. She’s the ship of every repair in that ledger. Every storm weathered. Every trainee who found their sea legs on her deck. She’s the sum of her work. Her service *is* her continuity. The planks regrew, yes. But the life carried on *in* her. That’s not hair and nails. That’s the heart. The breath. The working soul of her.

  *(Pause. Measured.)*

  The registrar’s question isn’t philosophical. It’s practical. What does an official number *record*? It doesn’t record timber. Timber rots, gets replaced. It records a vessel *in service*. Its identity as a working entity on the water. Its chain of ownership, its repairs, its *life*. That chain, that life, that unbroken record of service – despite every plank being changed – stayed right here. Right aboard *this* hull. The ledgers live with the ship that *did* the sailing, not the ship that *was* the raw material. The number tracks the working life. That life never left this hull, even as the wood beneath our feet was renewed.

  The museum has built something extraordinary. Something vital. It *is* *Constancy* of 1921, preserved. A priceless snapshot. But the official number… it belongs to the vessel that maintained continuous identity through continuous service. That service happened here. The record resides here.

  Therefore, the official number K… *(State the actual number)*… remains with this vessel. This sailing reconstruction. This working ship.

  *(Look directly at the museum contingent, then the crew.)*
  This isn’t easy. I know what it costs the museum team, who’ve done such painstaking work. You have built the *Constancy* of 1921. You have her physical truth. But the registrar’s entry tracks the operational truth. The life lived. That life stayed here. You haven’t been demoted. You’ve achieved something different. Something vital in its own right. And you… *(to the crew)*… you have the number. But you also know the weight of what they’ve saved. Respect that weight. Both hulls are true. They answer different questions.

  *(Turn to the Harbour Master, holding out a sealed envelope)*
  Harbour Master. The striking entry. The official number K… *(repeat number)*… remains with this hull. *(Hand it over firmly.)*

  Now. *(Turns back to the ship, voice thickens slightly)*
  She’s sold. Soon she’ll wear a new name, sail foreign waters. Our continuity, *as ours*, as *Constancy*… ends today. Right here. The Trust’s work with her… ends. My time aboard… ends.

  It’s not about fair winds now. It’s about what she gave us. The feel of her helm answering in a blow. The sound of wind singing in *these* rigging. The particular curve of *this* deck underfoot, worn smooth by generations of sea boots. The sight of the builder’s granddaughter, standing on the quay last season, holding her father’s photo of the launch. She touched the cap rail – this cap rail, replaced ’97 – and said, “He’d be glad she’s still working.” That’s the continuity. Not the wood. The *work*. The *purpose*.

  She goes to sail. Under another sky. That’s her truth. Our truth ends here. Honour both.

  That’s all. Thank you.

  *(Step back. The wind takes the silence.)*
