     - The analogy to the multiple-realizability debate: We argue that this analogy is useful to a point because it highlights the tension between abstraction and concrete implementation. However, it is a trap if it leads us to ignore the specifics of neural networks. In neural networks, the "physical" level is the activation and weight space, which is still an abstract mathematical space. Moreover, the network's internals are learned and may not have the same kind of multiple realizability as in biological systems. Therefore, the analogy should be used with caution but not struck from the joint statement because it helps frame the conceptual divide. However, we note that the analogy does not fully capture the technical details of the problem at hand, so it should not be overextended.

     - Verdict: The argument was partly about words (the meaning of "mechanism") and partly about the world (how misalignment actually manifests and how best to detect it). The analogy to the multiple-realizability debate is useful for understanding the two perspectives but does not resolve the empirical questions specific to neural networks.

