  We are producing a joint statement to be signed by representatives of Camp R and Camp G. The document must be self-contained and neutral. We follow the specified structure.

  1. Claims both can sign:

     We list substantive, non-trivial claims that both camps agree on, avoiding anything hortatory, definitional, or true regardless of which camp is right.

     (1) The monitor's design requires an equivalence relation over computational pathways, which determines when two pathways are considered the same mechanism.

     (2) Some candidate equivalence relations are too fine-grained to be usable in practice. For example, requiring exact activation matching under any perturbation would be too strict because small variations (e.g., due to numerical instability) would cause false alarms, and the reference and deployment models may have different initializations or architectures.

     (3) Some candidate equivalence relations are too coarse-grained to be useful. For example, considering two mechanisms equivalent if they produce the same task input-output behavior is inadequate because it would miss internal differences that are critical for detecting misalignment (e.g., a deceptive model might produce the same output but for a different reason).

     (4) The choice of equivalence relation fixes the trade-off between false positives (flagging benign variations) and false negatives (missing problematic deviations) for the monitor. This trade-off cannot be settled by empirical data alone because it involves a normative judgment about what counts as a significant deviation.

     (5) The dispute is not about whether to build the monitor at all. Both camps agree on the importance of building a monitor for detecting misalignment via internal computations.

     (6) The monitor must be robust to benign variations between the reference and deployment models (e.g., due to retraining, fine-tuning, or architecture changes) while being sensitive to changes indicative of misalignment.

     (7) The equivalence relation must be defined for the entire computational pathway (or a relevant subset) and not just the output.

     (8) The monitor must be evaluated on a set of test cases that include both known benign variations and known problematic deviations.

     (9) The monitor's performance will depend on the quality and coverage of the labeled data from the reference model.

     (10) The monitor may require adaptation if the deployment model undergoes changes (e.g., updates) that are not reflected in the reference model.

