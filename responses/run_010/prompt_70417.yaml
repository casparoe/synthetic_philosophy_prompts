  1.2. **Unusable Granularity Extremes**:  
     - Some equivalence relations are too fine-grained (e.g., requiring identical activations under all perturbations), making the detector non-robust to benign noise or implementation details.  
     - Some are too coarse-grained (e.g., requiring only identical inputs and outputs), rendering the detector blind to internal deviations indicative of misalignment.  

  1.3. **Tradeoff Determinism**: The choice of equivalence relation fixes the detector’s false-positive/false-negative tradeoff. Empirical data alone cannot resolve this tradeoff, as it depends on prior assumptions about what deviations constitute risk.  

  1.4. **Non-Negotiable Core Premise**: The dispute does not concern whether to build the detector. Both camps agree that misalignment may manifest through computational differences even when outputs match.  

  1.5. **Scope of Comparison**: The monitor must characterize computations beyond final outputs (e.g., intermediate activations, causal pathways).  

  1.6. **Robustness Requirement**: The detector must tolerate expected benign variations between reference and deployment models (e.g., from reinitialization or non-algorithmic changes).  

  1.7. **Data Limitations**: The detector’s reliability is bounded by the coverage and quality of the reference model’s labeled computations.  

