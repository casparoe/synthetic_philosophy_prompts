     We define:
     - "Substantive": The disagreement is about a matter of fact or principle that affects the design of the monitor and cannot be resolved by clarifying terms.
     - "Partly substantive": The disagreement has both substantive and terminological aspects.
     - "Artifact": The disagreement is primarily due to using the same word for two different concepts.

     We list the key issues:

     Issue 1: What is the primary criterion for individuating mechanisms?

     | Issue | Camp R's position | Camp G's position | Judgment and reasons |
     |-------|-------------------|-------------------|----------------------|
     | Primary criterion for individuating mechanisms | A mechanism is individuated by its functional role: the pattern of causal dependencies it exhibits under interventions, defined in terms of the model's internal activation space. Two mechanisms are the same if they exhibit the same input-output behavior under the same set of interventions, regardless of the specific activations or weights. | A mechanism is individuated by its realization: the specific pattern of activations, weights, and components that implement the computation. Two mechanisms are the same only if they use the same representational primitives (e.g., same directions in activation space) in the same way. | Substantive. The disagreement is about what level of abstraction is appropriate for detecting misalignment. It affects the design because Camp R would allow different realizations that are functionally equivalent, while Camp G would flag them. |

     Issue 2: How should we handle functional equivalence with different internal realizations?

     | Issue | Camp R's position | Camp G's position | Judgment and reasons |
     |-------|-------------------|-------------------|----------------------|
     | Functional equivalence with different internal realizations | If the deployment model's computation is functionally equivalent to the reference model's (i.e., it responds the same way to the same interventions in the internal activation space), then it is the same mechanism and should not be flagged. This is because the model is still using the same causal structure. | If the deployment model's computation uses a different internal realization (e.g., different activation patterns or weights) even if it is functionally equivalent, then it is a different mechanism and must be flagged. This is because misalignment might be implemented by repurposing the same function with a different underlying representation. | Substantive. The disagreement is about the nature of misalignment: Camp G believes that misalignment can hide behind functional equivalence by using the same input-output behavior but with different (potentially deceptive) representations. Camp R believes that if the function is the same, then the model is still aligned. |

     Issue 3: What is the appropriate grain size for typing mechanisms?

     | Issue | Camp R's position | Camp G's position | Judgment and reasons |
     |-------|-------------------|-------------------|----------------------|
