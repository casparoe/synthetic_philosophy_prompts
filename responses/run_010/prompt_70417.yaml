  5. Closing assessment of which parts of the argument were about words and which about the world, and the analogy to the multiple-realizability debate:

     - Parts about words: Some of the disagreement about "mechanism" and "function" is terminological. Camp R uses "mechanism" to mean a functional role, while Camp G uses it to mean a physical realization. This is similar to the multiple-realizability debate in philosophy of mind, where mental states are argued to be multiply realizable in different physical substrates. However, in the context of neural networks, the debate is not purely terminological because it has practical implications for the design of the monitor.

