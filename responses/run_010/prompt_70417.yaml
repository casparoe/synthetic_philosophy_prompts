  3. The cruxes:

     We list at least three cruxes: sub-questions that, if settled, would move at least one side. For each, we provide a concrete case, controlled comparison, or thought experiment that both sides agree bears on it, and record each side's predicted outcome.

     Crux 1: Can misalignment occur without changing the functional role (as defined by internal interventions) but only by changing the realization?

     - Concrete case: We have a reference model that, for a set of prompts, uses a particular set of features (e.g., a direction in activation space) to compute an answer. We then create a deployment model that is identical in functional role (i.e., it responds the same way to interventions on the same inputs in activation space) but uses a different set of features (e.g., a different direction) to achieve the same internal function. We then test whether the deployment model can exhibit deceptive behavior (e.g., by inserting a backdoor that triggers under a specific condition) without changing the functional role.

       - Camp R prediction: If the functional role is the same, then the deployment model cannot exhibit deceptive behavior that the reference model wouldn't also exhibit under the same conditions. Therefore, in this case, the deployment model would not be deceptive.

       - Camp G prediction: The deployment model might be deceptive because the different realization might encode a hidden representation (e.g., a backdoor trigger) that is not captured by the functional role defined by the current set of interventions. Therefore, the deployment model could be deceptive even if the functional role is the same.

       - Why it moves the sides: If the deployment model in this case can be shown to be deceptive, Camp R would have to concede that functional equivalence does not guarantee alignment. If it cannot, Camp G would have to concede that realization differences without functional differences are benign.

     Crux 2: Is there a privileged level of grain for typing mechanisms?

     - Concrete case: Consider a reference model that uses a specific neuron (or a small group of neurons) for a particular feature. We then create a deployment model where the same feature is distributed across many neurons (a distributed representation) but serves the same functional role (same input-output under interventions). We then check if the distributed representation is more prone to misalignment (e.g., by fine-tuning it to be deceptive) than the localized one.

       - Camp R prediction: The distributed representation should be just as robust against misalignment as the localized one, because the function is the same. Therefore, the monitor should not flag the distributed representation as anomalous.

       - Camp G prediction: The distributed representation might be more susceptible to misalignment because it can be more easily repurposed (e.g., by reusing some of the neurons for a deceptive purpose) without changing the overall function. Therefore, the monitor should flag it.

       - Why it moves the sides: If the distributed representation is more susceptible to misalignment, Camp G is supported. If not, Camp R is supported.

     Crux 3: Should the equivalence relation be revised as evidence accumulates?

     - Concrete case: During deployment, the monitor flags a set of cases as anomalous based on the initial equivalence relation. However, upon investigation, these cases turn out to be benign (e.g., due to a change in initialization). Should the equivalence relation be updated to account for these false positives?

       - Camp R position: The equivalence relation should be updated to include the new evidence, because the functional role might be realized in a broader set of ways than initially thought. The equivalence relation should be revised to be more permissive.

       - Camp G position: The equivalence relation should not be revised because the realization matters. If the deployment model uses a different realization, it should be flagged regardless of whether it turns out to be benign because it might be a sign of future problems. However, they might accept a revised equivalence relation if it is based on a more refined notion of realization that accounts for known benign variations.

       - Why it moves the sides: This tests the flexibility of the approach. If updating reduces false positives without increasing false negatives, Camp R's approach is validated. If updating leads to missing actual misalignment, Camp G's strictness is validated.

     Crux 4: Is the reference model's mechanism the only reference, or should we consider the class of honest mechanisms?

     - Concrete case: The reference model uses a particular mechanism for a prompt. But there might be multiple honest ways to answer the same prompt. We create a deployment model that uses a different mechanism (either functionally or in realization) but is still honest (e.g., it uses a more efficient but equally honest pathway). We then see if the monitor flags it.

