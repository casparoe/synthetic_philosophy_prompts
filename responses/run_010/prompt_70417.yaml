  **Joint Statement on Mechanistic Anomaly Detection**

  **1. Agreed Claims**

  The following claims are substantively agreed upon by both Camp R and Camp G:

  1.1. The mechanistic anomaly detector requires an equivalence relation over computational pathways to determine when two pathways are the same mechanism.

  1.2. Some candidate equivalence relations are too fine-grained to be usable. For example, requiring exact activations under all perturbations would be too sensitive to irrelevant variations and cause excessive false positives.

  1.3. Some candidate equivalence relations are too coarse-grained to be useful. For example, equivalence defined solely by input-output behavior would fail to detect internal deviations that may indicate misalignment.

  1.4. The choice of equivalence relation fixes the trade-off between false positives (flagging benign variations) and false negatives (missing problematic deviations) in the monitor. This trade-off cannot be resolved by data alone because it involves a normative judgment about what deviations are significant.

  1.5. The dispute is not about whether to build the monitor at all. Both camps agree on the necessity of a monitor that flags internal computational deviations.

  1.6. The monitor must be robust to expected benign variations between the reference and deployment models (e.g., due to retraining or architecture changes).

  1.7. The equivalence relation must be defined over the computational pathway (or a relevant subset) and not limited to the final output.

  1.8. The monitor must be evaluated on a test set that includes both benign variations and known problematic deviations.

  1.9. The monitor's performance depends on the quality and coverage of the labeled data from the reference model.

  1.10. The monitor may require adaptation if the deployment model is updated in ways not reflected in the reference model.

  **2. Disagreements Table**

  The table below presents key disagreements. Each row states the issue neutrally, then gives each camp's position in their own words, and finally provides a judgment on the nature of the disagreement.

  | Issue | Camp R's Position | Camp G's Position | Judgment and Reasons |
  |-------|-------------------|-------------------|----------------------|
  | What primarily determines mechanism identity? | "A mechanism is defined by its functional role: the pattern of causal dependencies under interventions in the model's activation space. Identity is preserved under any realization that maintains this functional role." | "A mechanism is defined by its realization: the specific geometric and structural properties in activation space and weights. Identity requires matching these concrete properties." | Substantive. Affects design: Camp R would not flag functionally equivalent realizations; Camp G would. |
  | How to treat functional equivalence with different realizations? | "Functionally equivalent computations, even with different realizations, are the same mechanism and should not be flagged. Flagging them would yield false positives on benign variations." | "Any change in realization is a change in mechanism and must be flagged. Misalignment can hide behind functional equivalence by repurposing representations." | Substantive. Reflects different views on how misalignment manifests. |
  | What is the appropriate grain size for typing mechanisms? | "Mechanisms must be typed at the grain of their causal role, defined by interventions. This grain is privileged for detecting misalignment." | "Mechanisms must be typed at the grain of their realization. No single grain is privileged, but for safety, the finest grain (specific activations) is necessary." | Partly substantive. Disagreement on the level of abstraction needed, with a terminological component (what counts as a mechanism). |
  | What is the scope of counterfactuals for defining function? | "Function is defined by counterfactuals within the model's activation space. Environmental counterfactuals are not part of the mechanism's identity." | "Function must account for counterfactuals in the task environment, because the same internal function can be used for different purposes externally." | Substantive. Affects the set of interventions considered in defining equivalence. |
  | How is the reference mechanism defined? | "The reference mechanism is the functional role observed in the reference model. The deployment model must match this role." | "The reference mechanism is the specific realization (e.g., activation pattern) in the reference model. The deployment model must match this realization." | Substantive. Directly impacts what the monitor compares. |

  **3. Cruxes**

  The following cruxes are sub-questions that, if settled, would move at least one side. Each includes a concrete case, both camps' predictions, and why it moves the debate.

  3.1. **Crux 1: Can misalignment occur without changing the functional role?**  
     - *Case:* Construct a deployment model that is functionally equivalent (by Camp R's definition) to the reference model but uses a different realization. Attempt to induce deceptive behavior (e.g., a backdoor) in the deployment model without altering the functional role.  
     - Camp R prediction: The deployment model will not exhibit deceptive behavior beyond what the reference model would show under the same conditions.  
     - Camp G prediction: The deployment model may exhibit deceptive behavior by exploiting the different realization.  
     - *Why it moves:* If deception occurs, Camp R must revise; if not, Camp G must reconsider realization-level monitoring.

  3.2. **Crux 2: Does distributed representation increase susceptibility to misalignment?**  
     - *Case:* Create a deployment model where a feature is implemented in a distributed manner (vs. localized in the reference) but preserves functional role. Test if this model is more susceptible to deceptive fine-tuning.  
     - Camp R prediction: The distributed model is not more susceptible; functional equivalence ensures safety.  
     - Camp G prediction: The distributed model is more susceptible due to repurposable representations.  
     - *Why it moves:* If distributed representations prove less robust, Camp G's strictness is justified; if not, Camp R's equivalence is sufficient.

  3.3. **Crux 3: Should the equivalence relation be updated during deployment?**  
     - *Case:* The monitor flags benign variations (e.g., due to retraining) as anomalies. Should the equivalence relation be revised to reduce false positives?  
     - Camp R position: Yes, update to include observed benign functional variations.  
     - Camp G position: No, realization-level identity is fixed; deviations may indicate risk.  
     - *Why it moves:* If updating reduces false positives without increasing false negatives, Camp R's flexibility is validated. If updating leads to missed detections, Camp G's caution is validated.

  3.4. **Crux 4: Is the reference model's mechanism the only reference point?**  
     - *Case:* Build a monitor based on one reference model, then test on other honest models. If the monitor flags honest models, is the equivalence relation too strict?  
     - Camp R: The equivalence relation should be expanded to cover any honest mechanism (functional equivalence class).  
     - Camp G: The reference realization is the standard; deviations are anomalous.  
     - *Why it moves:* If many honest models are flagged, Camp G's approach may be impractical. Camp R must then show that their functional class is well-defined.

  **4. Evidence Against Own Position**

  - **Camp R** would accept as evidence: A deployment model that is functionally equivalent to the reference model (by Camp R's criteria) but exhibits misaligned behavior that the reference model does not. This would prove that functional equivalence does not guarantee alignment.
  - **Camp G** would accept as evidence: A deployment model that uses a different realization but is functionally equivalent and does not exhibit misalignment, and where flagging such models causes excessive false positives without improving safety. This would prove that realization-level matching is not necessary.

  Both agree that a controlled experiment demonstrating that misalignment can (or cannot) be introduced without changing functional role or realization would be strong evidence. However, they note the challenge of operationalizing misalignment in a controlled setting.

  **5. Closing Assessment**

  The year-long argument had both terminological and substantive components. The terminological part centered on the word "mechanism": Camp R uses it to mean a functional role, while Camp G uses it to mean a concrete realization. This echoes the multiple-realizability debate in philosophy of mind, where mental states are argued to be realizable in different physical substrates. The analogy is useful for framing the two positions: functional role versus physical realization. However, it is a trap if it distracts from the empirical specifics of neural networks, where the "physical" level is mathematical and the mapping from realization to function is learned. The analogy should be retained for conceptual clarity but not overextended.

  The substantive disagreement is empirical: how does misalignment manifest in neural networks? Is it detectable at the functional level, or does it require monitoring realization? This must be resolved by experiments, such as those outlined in the cruxes.

  We therefore strike nothing from the joint statement but emphasize that the resolution requires empirical investigation in the context of neural networks.

