     |-------|-------------------|-------------------|----------------------|
     | Scope of counterfactuals for defining function | The function of a mechanism is defined by its responses to interventions in the model's activation space, independent of the task environment. | The function of a mechanism must also consider counterfactuals in the task environment, because the same internal function might be used for different purposes in the environment. | Substantive. The disagreement is about whether the internal counterfactuals are sufficient or if the environmental context must be included. This affects the set of interventions considered. |

