  | **Treatment of functional equivalence** | "If the deployment model’s computation preserves the reference model’s input-output counterfactuals under interventions, it is the *same mechanism* and should not be flagged, even with internal reorganization." | "If the deployment model’s computation uses different representational primitives (e.g., activations, weights), it is a *different mechanism* and must be flagged, even if functionally equivalent. Misalignment may exploit realization differences." | **Substantive**. Directly impacts false positives (Camp R warns against flagging benign reorganization) and false negatives (Camp G warns against missing realization-specific deception). |  
  | **Granularity of mechanism typing** | "Mechanisms admit *no privileged grain size* but must be typed at the *coarsest grain* capturing causal role. Finer grains (e.g., neuron-level) risk false positives; coarser grains (e.g., layer-level) risk false negatives." | "Mechanisms must be typed at the *finest grain* of realization (e.g., subspace directions). No single grain is universally privileged, but safety demands sensitivity to realization changes." | **Partly substantive**. Disagreement on optimal grain size for safety, but conflated by differing definitions of "mechanism." |  
  | **Scope of "function" for equivalence** | "Function is defined solely by counterfactuals *inside the model’s activation space* (e.g., perturbing intermediate activations). Task-environment counterfactuals are irrelevant for mechanism identity." | "Function must incorporate counterfactuals in the *task environment* (e.g., how inputs represent real-world entities). Internal equivalence may mask environmental misuse." | **Substantive**. Affects which interventions define equivalence: Camp R uses internal perturbations; Camp G includes semantic interpretations. |  

