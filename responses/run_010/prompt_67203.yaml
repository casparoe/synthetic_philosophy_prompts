answer: |-
  ### The Threshold of Control: Game Activity Document  
  **Setting**  
  Two nations, **Aurelia** and **Borealis**, dispute control of the **Strait of Meridian**. Aurelia values control at **100 points** (vital for trade), Borealis at **150 points** (critical for security). Both start with **50 points**. The strait is currently held by Aurelia, but Borealis claims it. If the dispute escalates to a predefined threshold, catastrophic war may occur.  

  ---

  ### Materials  
  1. **Two rooms** (for Aurelia and Borealis).  
  2. **Central display** (whiteboard/projected):  
     - Round tracker (Rounds 1–6).  
     - Escalation ladder (Levels 0–5).  
     - Catastrophe probability table (see below).  
     - Current points for Aurelia and Borealis.  
  3. **Action slips** (30 slips; 3 per round × 2 teams).  
  4. **Message pads** (2 pads; 1 per team).  
  5. **Sealed envelope** for Aurelia (labeled "Confidential: Cabinet Briefing").  
  6. **Six-sided die** (for catastrophe rolls).  
  7. **Timer** (for rounds).  
  8. **Scorekeeper sheet** (track points, actions, messages).  

  ---

  ### Roles for 24 Participants  
  - **Aurelia (Team A):** 11 students (negotiate, choose actions).  
  - **Borealis (Team B):** 11 students (negotiate, choose actions).  
  - **Message Center (2 students):**  
    - Collect messages, paraphrase, and deliver with a one-round lag.  
    - *Example:* Aurelia sends "We will escalate if provoked" → Paraphrased to Borealis as "Aurelia hints at forceful response."  
  - **Dice Master (1 student):** Publicly roll die per rules, announce outcomes.  
  - **Scorekeeper (1 student):** Update points, escalation level, and display.  

  ---

  ### Rules  
  #### 1. **Game Flow (6 Rounds, 5 Minutes Each)**  
  - **Start:** Teams begin at **Escalation Level 0**.  
  - **Per Round:**  
    - **Step 1: Message Delivery (1 min)**  
      - Message Center delivers *last round’s* paraphrased messages to both teams.  
      - Teams *may* send new messages to Message Center (written, max 2 sentences).  
    - **Step 2: Action Selection (2 min)**  
      - Teams choose one action via secret slip:  
        - **Concede:** Surrender strait. Game ends. *Winning team gains strait value + current points. Loser keeps points only.*  
        - **Escalate:** Raise escalation level by 1. Pay **10-point cost**. Triggers catastrophe roll.  
        - **Probe:** Cheap show of force (e.g., sanctions, patrols). Pay **5-point cost**. *No escalation or catastrophe roll.*  
      - Slips submitted to Scorekeeper.  
    - **Step 3: Action Resolution (2 min)**  
      - Actions revealed. Outcomes:  
        - **Concede:** If one concedes, game ends. If both concede, strait destroyed (no one gains value).  
        - **Escalate/Probe:**  
          - If either escalates, level increases. Roll die *if level ≥1*.  
          - Probe costs paid but no other effect.  
      - **Catastrophe Roll (if triggered):**  
        - Dice Master rolls publicly. War occurs if roll ≤ current level (see table).  
        - **War outcome:** All points forfeited (both teams end at 0).  
      - Scorekeeper updates points, level, and display.  

  #### 2. **Escalation and Catastrophe**  
  | Level | Catastrophe Probability | Die Roll (d6) |  
  |-------|--------------------------|---------------|  
  | 0     | 0%                       | None          |  
  | 1     | 16.7%                    | 1             |  
  | 2     | 33.3%                    | 1–2           |  
  | 3     | 50%                      | 1–3           |  
  | 4     | 66.7%                    | 1–4           |  
  | 5     | 100%                     | Automatic     |  
  - **War forfeits all points:** Design choice to reflect irreversibility. Rationale: Catastrophic war destroys accumulated gains, incentivizing caution while allowing threats to "leave something to chance."  

  #### 3. **Aurelia’s Sealed Envelope**  
  - **Given pre-game to Aurelia.** Text: *"Cabinet Briefing: Hardliners demand escalation by Round 3. If you do NOT escalate in Rounds 1–2, you MUST escalate in Round 3. This is automatic and cannot be vetoed."*  
  - Borealis suspects but cannot verify this.  

  #### 4. **Endgame**  
  - Concession, war, or Round 6 ends the game.  
  - If unresolved at Round 6: Strait lost (no value gained). Teams keep current points.  

  ---

  ### Facilitator’s Appendix: Mechanics Analysis  
  **Point Values & Probabilities**  
  - Aurelia’s strait value: 100  
  - Borealis’s strait value: 150  
  - Probe cost: 5  
  - Escalate cost: 10  
  - Starting points: 50  

  **Why No Dominant Strategy?**  
  - **Borealis (high value):** Prefers to force concession but risks catastrophe if Aurelia escalates. Expected value (EV) of escalating at Level 1: 83.3% chance of continuing (EV ≈ 140 if they win later) vs. 16.7% chance of 0. But costs add up if Aurelia resists.  
  - **Aurelia (low value + faction):** Faction forces escalation if passive. EV of escalating early: Low chance of catastrophe (Level 1–2) but may coerce Borealis. EV of probing: Cheap but risks faction override.  
  - **Neither can guarantee victory:** Borealis’s value advantage is offset by Aurelia’s ability to threaten involuntary escalation. Probing is safe but may prolong conflict.  

  **Why Catastrophe Forfeits Points?**  
  Deliberate design: Makes catastrophe existentially costly, simulating "unthinkable" outcomes. Forces players to rely on probabilistic threats rather than controlled brinkmanship.  

  ---

  ### Timeline (75 Minutes Total)  
  - **0:00–0:05**  
    - Assign roles (11 Aurelia, 11 Borealis, 2 Message Center, 1 Dice Master, 1 Scorekeeper).  
    - Distribute materials. Move teams to rooms. Give Aurelia the sealed envelope.  
  - **0:05–0:10**  
    - Read opening briefing (below). Rules Q&A.  
  - **0:10–0:50**  
    - **Rounds 1–6 (5 min each):**  
      - 0:00–1:00: Deliver messages (from prior round) + send new messages.  
      - 1:00–3:00: Teams discuss, choose action.  
      - 3:00–5:00: Resolve actions, update display.  
  - **0:50–1:15**  
    - Debrief (structure below).  

  ---

  ### Opening Briefing Script  
  *Read aloud to all:*  
  "Aurelia and Borealis, you dispute the Strait of Meridian. Aurelia holds it now and values it at 100 points. Borealis claims it and values it at 150 points. Both start with 50 points. Your goal is to maximize your points.  

  Each round, you can:  
  - **Concede** to end the game.  
  - **Escalate** to pressure your rival but risk catastrophic war.  
  - **Probe** to show resolve cheaply, with no immediate risk.  

  Messages can be sent but will be paraphrased and arrive next round. The Dice Master will roll publicly if escalation risks catastrophe.  

  Aurelia, you have a confidential cabinet briefing—open it now. Borealis, you may suspect internal pressures but have no proof.  

  We play 6 rounds. Begin Round 1."  

  ---

  ### Debrief Script  
  **Map Game Events to Concepts**  
  1. **Threats and Surrendered Control (First Discovery):**  
     - "In Round 3, Aurelia escalated—not because they chose to, but because their hardliners forced it. *Even if they wanted to back down, they couldn’t.* The threat to escalate was credible precisely because control was surrendered. But note: Borealis saw only the escalation, not the reason. This is the *threat that leaves something to chance*: Aurelia deliberately let catastrophe depend on probability (the die roll) rather than choosing it outright."  

  2. **Aggression Below Threshold (Second Discovery):**  
     - "Many of you probed repeatedly—imposing costs without triggering catastrophe. *Because major escalation was unthinkable (due to catastrophe risk), probing felt safe.* But this led to constant low-level conflict. This is the *stability-instability paradox*: A deterrent that prevents total war may make smaller aggressions more likely, creating a violent peace. **Note:** This is a contested hypothesis—the game illustrates it, but real-world evidence varies."  

  **Name the Concepts**  
  - First discovery: **"Rationality of Irrationality"** (threats gain credibility when control is surrendered).  
  - Second discovery: **"Stability-Instability Paradox"** (deterrence at the top enables violence at the bottom).  

  **Connect to Deterrence**  
  - "Aurelia’s faction made their threat credible even if irrational—Borealis couldn’t risk calling their bluff. This mirrors nuclear deterrence: A state may threaten retaliation it would never rationally choose, but the threat holds because opponents can’t be sure. Yet, as you saw, this ‘success’ often means more violence at lower levels, not less."  

  ---

  ### Predictable Problems & Solutions  
  1. **Problem:** "Borealis escalates early, causing catastrophe in Round 2."  
     - **Solution:** In debrief, highlight how this reflects real-world miscalculation. Ask: "Did Aurelia’s probes make Borealis overconfident?"  

  2. **Problem:** "Teams avoid escalating, ignoring the sealed envelope."  
     - **Solution:** Remind Aurelia of the envelope rules. If they disobey, enforce: "Hardliners override you—you escalate in Round 3."  

  3. **Problem:** "Message Center paraphrases inaccurately, causing confusion."  
     - **Solution:** Instruct paraphrasers to focus on intent, not words (e.g., "threat" → "warning"). Use it to teach signaling friction.  

  4. **Problem:** "One team concedes immediately, ending the game early."  
     - **Solution:** In debrief, ask: "Did asymmetric values make Borealis/Aurelia feel they couldn’t win?" Discuss how this mirrors power imbalances.  

  ---

  ### Limitations & Notes  
  **Features the Game Cannot Replicate** (Must explain verbally):  
  - **Complex Factions:** Real factions are fluid, not binary (as in the envelope).  
  - **Multiple Thresholds:** Real escalation has many rungs (not 5 linear levels).  
  - **Dynamic Values:** Real stakes shift with context (unlike fixed 100/150 points).  
  - **Communication:** Real states use backchannels, intelligence, and real-time signals (not paraphrased messages).  

  **Explicit Note on Second Discovery:**  
  "The stability-instability paradox is a contested empirical hypothesis. The game illustrates one mechanism for it, but it does not prove it occurs in reality. Scholars debate whether nuclear deterrence actually increases low-level conflicts—historical cases show mixed results."  

  ---  
