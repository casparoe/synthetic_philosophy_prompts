  **Activity Document: The Threshold of Control**

  **Setting:**
  Two neighboring countries, Atlantica and Borealia, are in a dispute over a valuable resource (a mineral-rich territory). Atlantica values the resource at 100 points, and Borealia values it at 150 points. Both countries start with 50 points. The dispute has been ongoing, and both countries are considering actions that could lead to escalation. 

  **Materials:**
  - Two separate rooms for Atlantica (Team A) and Borealia (Team B).
  - Central area for game officials: Message Center (2 people), Dice Master (1), Scorekeeper (1).
  - Whiteboard or poster showing: 
     - Current round (1 to 5)
     - Current escalation level (0 to 5)
     - Points for Atlantica and Borealia
  - Action selection slips (one per team per round)
  - Message slips (for teams to write messages)
  - One ten-sided die (d10) or six-sided die (d6) for catastrophe rolls.
  - Timer.
  - Sealed envelope for Team A (Atlantica) labeled "Classified: Internal Faction Briefing".

  **Rules:**

  1. **Objective**: Each team aims to maximize their points. Points come from:
     - Starting points: 50 each.
     - Gaining the resource: Atlantica gets 100 points, Borealia gets 150 points, if they obtain it.
     - Paying costs for actions (see below).
     - Catastrophe results in both teams losing everything (0 points).

  2. **Game Rounds**: The game runs for 5 rounds. In each round:
     a. **Message Delivery**: At the beginning of the round, the Message Center delivers any incoming messages from the previous round (if teams sent messages). These messages are paraphrased by the Message Center (to simulate communication delays and interpretation).
     b. **Message Sending**: Each team may send one message to the other team. The message is written and given to the Message Center. The Message Center will paraphrase and deliver it at the beginning of the next round.
     c. **Action Selection**: Teams discuss and choose one action by writing it on a slip and handing it to the Scorekeeper. Actions are:
        - **Concede**: Your team surrenders the resource to the other team. If chosen, the other team gets the resource points added to their current points. Your team keeps its current points (but does not get the resource). If both teams concede, the resource is destroyed (neither gets it) and both teams keep their current points.
        - **Escalate**: Your team takes an escalatory step. This increases the escalation level by one (if only one team escalates) or by two (if both escalate). Your team pays 10 points. Then, the Dice Master rolls the die to check for catastrophe at the new escalation level (see table). If catastrophe occurs, the game ends with both teams at 0 points. If not, the game continues.
        - **Probe**: Your team takes a low-cost, non-escalatory action (e.g., a small incursion or diplomatic protest). Your team pays 5 points. This does not change the escalation level. The game continues.
     d. **Action Resolution**: 
        - If at least one team chooses Concede: 
           - If only one concedes, the other gets the resource (points added to their score) and the game ends.
           - If both concede, the resource is lost (neither gets points for it) and the game ends.
        - If no team concedes, then:
           - If both choose Probe: escalation level remains the same. Both pay 5 points.
           - If one chooses Probe and the other Escalate: escalation level increases by one. The escalating team pays 10 points, the probing team pays 5 points. Then roll for catastrophe at the new level.
           - If both choose Escalate: escalation level increases by two. Both pay 10 points. Then roll for catastrophe at the new level.
        - After any escalation, if the escalation level reaches 5 or beyond, any escalation (whether one or both) triggers catastrophe (100% chance).
        - If catastrophe occurs, both teams get 0 points and the game ends.
     e. **End of Round**: If the game has not ended, the Scorekeeper updates the points and escalation level. The round ends, and the next round begins.

  3. **Catastrophe Roll Table (using d10)**:

     | Escalation Level | Catastrophe Probability | Roll (d10) |
     |------------------|-------------------------|------------|
     | 0                | 0%                      | None       |
     | 1                | 10%                     | 1          |
     | 2                | 30%                     | 1-3        |
     | 3                | 50%                     | 1-5        |
     | 4                | 70%                     | 1-7        |
     | 5                | 100%                    | Any        |

     (If using d6, use: Level 1: 1, Level 2: 1-2, Level 3: 1-3, Level 4: 1-4, Level 5: any)

  4. **Special Rule for Atlantica (Team A)**: 
     - Before the game starts, the facilitator gives Team A a sealed envelope. Inside is a card that reads: 
          *"Internal Faction Briefing: There is a faction within your government that will force escalation in Round 3 if you have not escalated by then. Specifically, if in Rounds 1 and 2 you did not choose the Escalate action at least once, then in Round 3 you must choose Escalate. You cannot avoid this."*
     - Team A must follow this rule but should keep it secret. Team B may suspect internal pressures but has no way of knowing for sure.

  5. **End of Game**: 
     - The game ends if: 
          - One team concedes.
          - Both teams concede.
          - Catastrophe occurs.
          - The end of Round 5 is reached without resolution.
     - If the game reaches the end of Round 5 without concession or catastrophe, then there is one final catastrophe roll at the current escalation level. If catastrophe occurs, both teams get 0. If not, the resource is lost (no one gets points for it) and both teams keep their current points.

  **Facilitator's Appendix: Point Values and Probabilities**

  - Starting points: 50
  - Resource values: Atlantica: 100, Borealia: 150
  - Probe cost: 5
  - Escalate cost: 10

  *Why catastrophe forfeits all points?* 
  This design choice reflects the irreversible and total nature of catastrophe. In nuclear deterrence, for example, a full exchange would be devastating. By losing everything, teams are incentivized to avoid catastrophe, but the threat of it might still be used to deter. However, the internal faction in Team A introduces an element of involuntary escalation, which may force the issue and make the threat credible even if it is against rational choice at the moment.

  *Why no dominant strategy?*
  Consider a simple scenario without the internal faction:

  - If both teams always probe, they each pay 5 per round. After 5 rounds, they each lose 25 points, so have 25 left. Then at the end, they keep 25 and lose the resource. Total: 25 each. But if one team escalates early, they risk catastrophe but might force the other to concede.

  - The expected value of escalating depends on the current escalation level and the probability the other team will concede. For example, at level 0, escalating to level 1 has a 10% chance of catastrophe (which gives 0) and 90% chance of continuing. But if the other team then concedes, you get the resource value minus costs. But if the other team escalates too, you might jump to level 2 and face 30% chance.

  - With the internal faction, Team A is forced to escalate by round 3 if they haven't already. This commitment can make their threat to escalate credible, which might deter Borealia from escalating. However, Borealia doesn't know about the faction, so they might test Atlantica.

  - The asymmetric values also matter: Borealia values the resource more (150 vs 100) so they might be willing to take more risks.

  - There is no one best strategy; it depends on the other team's actions and risk tolerance.

  **Minute-by-Minute Timeline**

  - 0-5 min: Introduction and Setup. Assign roles: 10 to Atlantica, 10 to Borealia, 2 to Message Center, 1 to Dice Master, 1 to Scorekeeper. Move to separate rooms. Give Team A the sealed envelope. Set up the central whiteboard.

  - 5-15 min: Rules Explanation. Read the setting and rules clearly. Allow clarifying questions.

  - 15-55 min: Game Play (5 rounds, approximately 8 minutes per round). 
     - Round 1: 
          - No message delivery (since no messages were sent in round 0).
          - Teams may send a message (1 min).
          - Teams discuss and choose action (3 min).
          - Actions revealed and resolved (1 min).
          - Update board (1 min).
          - (Total: 6 min, but allow buffer)
     - Rounds 2-5: 
          - Deliver messages (1 min).
          - Send new messages (1 min).
          - Discuss and choose action (3 min).
          - Reveal and resolve (1 min).
          - Update board (1 min).
          - (Total: 7 min per round, but we'll keep moving)

    Note: Keep to strict timing. Use a timer.

  - 55-75 min: Debrief and Discussion (20 min). See below.

  **Opening Briefing Script (for Facilitator at 5-minute mark):**

  "Welcome to 'The Threshold of Control'. You are divided into two teams: Atlantica and Borealia. You are in a dispute over a valuable resource. Atlantica values this resource at 100 points, and Borealia at 150 points. Both teams start with 50 points. Your goal is to maximize your team's points.

  The game will proceed in 5 rounds. In each round, you will have the opportunity to send a message to the other team, which will be delivered at the beginning of the next round. Then, you will choose an action: Concede, Escalate, or Probe. 

  Concede means you give up the resource to the other team. Escalate means you take an escalatory step, which increases the escalation level and may trigger a catastrophic outcome. Probe is a low-cost action that does not escalate the situation.

  After you choose your action, we will reveal the actions simultaneously and resolve the round. The escalation level starts at 0. As the escalation level increases, the risk of catastrophe increases. If catastrophe occurs, both teams lose everything and end with 0 points.

  Atlantica, you have a sealed envelope with confidential information. Open it now and follow its instructions. Do not share this information with Borealia.

  You have 40 minutes for the game. Let's begin with Round 1."

  **Debrief Script (after the game):**

  1. **Map particular moments to the first concept**: 
     - "During the game, you encountered a situation where making a threat credible required surrendering some control. For example, when Atlantica had the internal faction forcing escalation in Round 3, they could not back down even if they wanted to. This made their threat to escalate more credible, but it also meant they surrendered control over the decision to escalate in that round. They deliberately left the probability of catastrophe to chance rather than choosing it outright. This is known as the 'threat that leaves something to chance'."

  2. **Map particular moments to the second concept**:
     - "From inside the play, you may have discovered that the very mechanism that makes major escalation unthinkable (because it leads to catastrophe) can make lower-level aggression feel safer. For example, teams might have engaged in multiple probes because they knew that the other side wouldn't escalate to catastrophe over a small provocation. This can lead to a peace that is more violent at lower levels rather than calmer. This is the idea of 'stability-instability paradox'."

     Note: Explicitly state that this second discovery is a contested empirical hypothesis, not proven by the game.

  3. **Name the concepts**:
     - "The first concept is called the 'rationality of irrationality' or 'threat that leaves something to chance'. The second is the 'stability-instability paradox'."

  4. **Connect to deterrence**:
     - "The game illustrates why a deterrent that its holder would never rationally carry out can nonetheless hold: by surrendering control (e.g., to an internal faction or to chance), the threat becomes credible. And its success may buy a more violent peace at lower levels."

  **Predictable Problems and Solutions:**

  1. **Problem**: Teams may not understand the rules, especially the action resolution.
     - **Solution**: Do a thorough rules explanation and have a quick practice example. Have the Scorekeeper and facilitator available for questions.

  2. **Problem**: The game might end early (e.g., concession in round 1 or early catastrophe).
     - **Solution**: If this happens, use it as a teaching moment. Discuss why they chose that action. If time allows, restart with a new parameter (but time may not allow). Alternatively, have a backup plan to continue with a discussion.

  3. **Problem**: Message Center may be slow in paraphrasing or delivering.
     - **Solution**: Have the two Message Center members practice paraphrasing quickly. Provide them with a list of synonyms. Limit message length.

  4. **Problem**: One team may dominate due to more experienced members.
     - **Solution**: Encourage teams to assign roles (e.g., leader, scribe, strategist) to involve everyone.

  **Limitations of the Game:**

  - The game simplifies the escalation ladder into a linear progression, while in reality there are multiple dimensions and thresholds.
  - Communication in the game is limited to paraphrased messages with a lag, but in reality, there are multiple channels and real-time communication.
  - The internal faction is a fixed rule, but in reality, such factions are dynamic and their influence may vary.
  - The values of the resource are fixed and known, while in reality they might be uncertain or change over time.
  - The game assumes that catastrophe is total and irreversible, but in some real scenarios, there might be limited conflicts.

  **Note on the Second Discovery:**
  The stability-instability paradox is a contested hypothesis. The game illustrates how it might arise, but it does not prove it. Empirical evidence in international relations is mixed, and the paradox depends on specific conditions.

