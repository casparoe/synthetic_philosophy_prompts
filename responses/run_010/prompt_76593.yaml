  ### Confidently Stated Positions That Should Cost Marks  
  1. **"Material implication explains conditionals: (I1) and (I2) must be equally assertable since they are contrapositives."**  
     *Why it fails:* Ignores the assertability difference shown by conditional probabilities, which material implication cannot capture.  
  2. **"The 15% legacy miss rate proves (C) is probably false for *r*."**  
     *Why it fails:* Overlooks that counterfactuals depend on *r*’s specific features (payload), not aggregate data.  
  3. **"The replay harness objectively tests (C) by showing what ‘would happen’ in reality."**  
     *Why it fails:* The replay arbitrarily fixes background conditions, while counterfactual truth depends on contextually variable similarity metrics.  
  4. **"Conditional probability defines truth for all conditionals, including counterfactuals like (C)."**  
     *Why it fails:* Counterfactuals (unlike indicatives) require similarity-based worlds, not just probabilities (e.g., (C) is true for *r* despite low aggregate probability).  

