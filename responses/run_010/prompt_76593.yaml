  We are constructing an exam question for an upper-level undergraduate philosophy of language course. The goal is to create an applied essay question that uses a concrete case with numbers to test reasoning rather than recognition. The case is about routing requests to storage shards and analyzing statements based on the data.

  The case data:
  - 10,000 requests in one month.
  - Legacy shard: 1,000 requests, of which 850 met the latency target and 150 missed.
  - Modern shard: 9,000 requests, of which 8,650 met the target and 350 missed.
  - Overall: 9,500 met the target, 500 missed.

  Two indicative conditionals:
  (I1) "If the request did not go to the legacy shard, it met the latency target."
  (I2) "If the request missed the latency target, it went to the legacy shard."

  Note: These are contrapositives and truth-functionally equivalent. However, they feel different: (I1) has a high probability (96%) while (I2) has a low probability (30%).

  Subjunctive conditional for a specific request r:
  (C) "If r had gone to the legacy shard, it would have missed the latency target."
  - Request r: went to modern shard, 4.2 MB payload (larger than 99.5% of traffic), completed in 180 ms. Legacy shard would take about 900 ms on such a payload, so (C) seems true.
