answer: |-
  ### Exam Question

  **Storage Shard Routing: Conditionals and Counterfactuals**  
  *Answer all parts. Total time: 45 minutes. Suggested length: 800 words.*

  Our service routes incoming requests to one of two storage shards: a legacy shard (slower, outdated) or a modern shard (faster, optimized). Over a one-month period, we recorded data for 10,000 requests:

  - **Legacy shard**: 1,000 requests.  
    - 850 met the latency target (completed within 200 ms).  
    - 150 missed the latency target (exceeded 200 ms).  
  - **Modern shard**: 9,000 requests.  
    - 8,650 met the latency target.  
    - 350 missed the latency target.  
  - **Overall**: 9,500 met the target; 500 missed it.

  Consider two indicative conditionals an engineer might write:  
  - **(I1)**: "If the request did not go to the legacy shard, it met the latency target."  
  - **(I2)**: "If the request missed the latency target, it went to the legacy shard."  

  These are contrapositives (logically equivalent in classical logic), yet (I1) seems highly assertable given the data, while (I2) does not.  

  Now consider a specific request, *r*:  
  - Routed to the modern shard.  
  - Payload size: 4.2 MB (larger than 99.5% of all requests).  
  - Latency: 180 ms (met the 200 ms target).  
  Internal benchmarks confirm the legacy shard takes ~900 ms for payloads this large due to lacking a columnar cache. Thus, this subjunctive conditional seems true:  
  - **(C)**: "If *r* had gone to the legacy shard, it would have missed the latency target."  
  However, the overall conditional probability of missing the target given legacy routing is only 15% (150/1,000).  

  A colleague is building a replay harness to test claims like (C). It takes recorded traffic, flips the routing decision for a chosen request (e.g., sends *r* to legacy instead of modern), and re-executes the request while holding other logged data (e.g., payload, system state) fixed. The colleague claims this replay "settles" whether (C) is true: if *r* misses the target in the replay, (C) is true; otherwise, false.  

  **(a)** Using the data, explain why (I1) is assertable but (I2) is not, despite their logical equivalence. What does this reveal about the semantics of indicative conditionals? (8 marks)  
  **(b)** Why does (C) seem true for *r* despite the low (15%) conditional probability of missing given legacy routing? How does *r*’s specific payload affect this assessment? Discuss the implications for counterfactual conditionals. (7 marks)  
  **(c)** Critically evaluate the colleague’s claim that the replay harness settles the truth of (C). Why might the replay not resolve the philosophical challenges of counterfactuals? Focus on what the replay holds fixed and what it varies. (5 marks)  

  ---

  ### Model Answer  
  *(Approx. 800 words; American English)*  

  **(a)** Indicative conditionals (I1) and (I2) are contrapositives: (I1) is "If ~Legacy, then Met," and (I2) is "If ~Met, then Legacy." Classical logic treats them as logically equivalent, meaning they should have identical truth conditions. Yet (I1) is assertable here, while (I2) is not. This discrepancy stems from how assertability depends on *conditional probability* rather than truth-functional logic.  

  For (I1), the conditional probability of meeting the target given modern routing is 8,650/9,000 ≈ 96.1%. With 9,000 modern requests and only 350 misses, asserting (I1) is reasonable, as exceptions are rare. For (I2), the conditional probability of legacy routing given a miss is 150/500 = 30%. With 500 total misses, only 150 occurred on legacy, while 350 (70%) occurred on modern—making (I2) unassertable because misses are *more likely* on modern shards.  

  This shows that indicative conditionals are not adequately captured by material implication (where "If P, then Q" equals "~P ∨ Q"). Under material implication, both (I1) and (I2) are true in 9,650/10,000 cases (96.5%), as both are false only when a request is modern and misses (350 cases). Yet assertability differs because humans evaluate conditionals via the *Ramsey test*: we hypothetically assume the antecedent and assess the consequent’s likelihood. (I1) has a high conditional probability (~96%), making it assertable; (I2) has a low conditional probability (30%), making it unassertable. This aligns with the *Adams Thesis*: the probability of an indicative conditional is the conditional probability of its consequent given its antecedent. The data reveal that assertability hinges on conditional probability, not truth-functional equivalence, challenging material implication and supporting probabilistic semantics.  

  **(b)** Subjunctive conditional (C)—"If *r* had gone to legacy, it would have missed"—seems true despite the 15% overall miss rate for legacy requests. This is because (C) is evaluated using *similarity-based semantics* (e.g., David Lewis’s theory), where we consider the "closest possible world" where the antecedent is true, holding fixed relevant background facts. For *r*, the key background fact is its 4.2 MB payload. Internal benchmarks show legacy shards take ~900 ms for large payloads (exceeding 200 ms), so in the closest world where *r* is routed to legacy, it would likely miss the target. The 15% aggregate probability is irrelevant because it includes many small-payload requests irrelevant to *r*’s case.  

  This illustrates that counterfactuals depend on *specific context*, not aggregate statistics. (C) focuses on *r*’s payload, which is abnormal (99.5th percentile) and causally linked to latency via the legacy shard’s limitations. Holding payload fixed makes a miss highly probable—nearly certain—for *r*. By contrast, the 15% probability averages over diverse requests (mostly small payloads), masking *r*’s unique risk. This supports a *non-probabilistic* view of counterfactuals: they require considering worlds where antecedent-specific features (like payload) are preserved, and similarity (e.g., minimal changes to actual history) determines truth. Thus, (C) seems true because *r*’s payload ensures a miss under legacy routing, highlighting how counterfactuals prioritize contextual similarity over frequency-based probabilities.  

  **(c)** The replay harness flips *r*’s routing and re-executes it, holding logged data (e.g., payload, system state, other requests) fixed. The colleague claims this "settles" (C)’s truth by showing what "actually happens." However, this ignores a core problem in counterfactual semantics: *cotenability* (which facts to hold fixed when altering the antecedent).  

  The replay assumes that payload and system state *should* be held fixed. But this is not philosophically neutral. In counterfactual reasoning, we hold fixed facts that are causally independent of the antecedent change. If routing decisions *depend* on payload (e.g., a smart router avoids sending large payloads to legacy), then in a world where *r* is routed to legacy, the payload itself might differ (e.g., the router altered it). The replay forcibly holds payload fixed, but this may create an inconsistent scenario: if payload influenced the original routing, changing routing while fixing payload violates causal dependencies. Conversely, if payload is independent, fixing it is valid—but the replay cannot "settle" which is correct.  

  Further, the replay’s choice to re-execute *r* in isolation ignores system-wide effects. If *r*’s legacy routing affects other requests (e.g., via resource contention), the replay’s "fixed" log becomes unrealistic. Thus, different choices of what to hold fixed (payload, router logic, or system state) yield different outcomes for (C). For example:  
  - Hold payload fixed: *r* misses (supports (C)).  
  - Hold router logic fixed: payload might change (could undermine (C)).  

  This shows the replay is just *one interpretation* of similarity, not a philosophical resolution. Counterfactuals are *vague* and *context-dependent*; the replay imposes arbitrary fixity choices, failing to address how we determine relevant similarities. It illustrates, but does not settle, the challenge.  

