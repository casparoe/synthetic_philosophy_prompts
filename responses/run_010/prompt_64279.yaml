prompt: |-
  I am assembling a set of conceptual tools for a project on the historiography of scientific discovery, and I have run into a recurring pattern that I have been unable to locate a term for. I would like to know whether one exists.

  The pattern runs as follows. Two or more investigators are counted as having independently arrived at the same discovery within a short window, and the case is then cited as evidence that the result was in the air — that it was waiting on the state of the field rather than on the particular person who happened to reach it. But when one examines what each of them actually produced, the two products turn out not to be the same result at all. The identity between them is manufactured afterwards, by the tradition that absorbs both, reconciles them, and reports the unified outcome as what each of the discoverers had found. On this reading the famous simultaneous discoveries are partly artifacts of retrospective homogenization rather than facts about the moment of discovery, which makes them considerably weaker evidence for the inevitability of the result than they are usually taken to be.

  Three cases that seem to me to work this way:

  - The calculus. Newton's fluxions and infinite series and Leibniz's differentials and his algorithmic notation are recognizably different mathematical enterprises, and the single subject taught today under that name is a product of the eighteenth- and nineteenth-century consolidation that came after both. The pair is nonetheless the standard exhibit for simultaneous invention.
  - Darwin and Wallace. What Wallace argued in the essay read jointly with Darwin's material at the Linnean Society is the core mechanism in a few pages, without the evidential architecture the Origin supplies a year later — the argument from artificial selection, the biogeographical and palaeontological material, the treatment of variation and hybridization. They are now described as having arrived at the same theory in the same year.
  - Oxygen. Scheele, Priestley, and Lavoisier are grouped as co-discoverers, although Priestley characterized what he had isolated in phlogiston terms for the rest of his life, and Lavoisier's substance becomes the substance we mean only once the chemical revolution provides the framework. Kuhn's observation that this discovery is not a datable event but a process spread over years seems to me to be pointing at exactly the problem I have in mind, though he draws a conclusion about paradigms rather than about how multiples get counted.

  What I would like from you:

  1. Does this pattern have an established name in the history, sociology, or philosophy of science? I know the neighborhood and I suspect none of it is quite the thing. Merton's multiples and multiplexes name the class being miscounted, not the miscounting. Priority disputes are about the allocation of credit, not about whether the competing results were identical. Merton's obliteration by incorporation describes a contribution ceasing to be separately attributed once it has been absorbed into the canon, which is a story about forgetting provenance rather than about absorbed contributions being reported as having always been the same contribution. Presentism and Whig historiography are broad methodological vices rather than this specific mechanism. Correct me if any of those is in fact the term I am reaching for, and tell me which comes closest and exactly where the fit breaks down.

  2. If no established term exists, coin one. I want a definition sharp enough to do work: what would have to be true of a case for it to qualify, what would disqualify it, and — the hard part — how one is supposed to distinguish a genuine multiple from a manufactured one when the record is contested, since the move of insisting that a rival's result was not really the same result is transparently available to partisans in a priority dispute.

  3. More substantively: what individuates a discovery, such that two results count as the same one? Is it content, the problem addressed, the method, the conceptual framework, subsequent uptake by the community, or some combination — and if different criteria can come apart, which one governs the question of whether a multiple is real? Whatever criterion you settle on, say what it implies for the inference from multiples to inevitability: does the pattern above undermine that inference, or merely oblige us to be more careful about which cases we count as multiples?

  A bare label will not serve my purposes. What I am after is the carving — what this phenomenon is, what it is not, and where its boundaries lie.
reasoning: |-
  Okay, the user is working on the historiography of scientific discovery and has identified a pattern where simultaneous discoveries are often presented as identical when, upon closer examination, they weren't actually the same at the time. They want to know if there's an established term for this phenomenon, and if not, they'd like a new term coined. They also need criteria to distinguish genuine multiples from manufactured ones and insights into what individuates a discovery.

  First, I recall the cases they mentioned: calculus (Newton vs. Leibniz), evolution (Darwin vs. Wallace), and oxygen (Scheele, Priestley, Lavoisier). They point out that in each case, the discoveries were later homogenized by the scientific community, making them appear identical when they weren't. The user has already considered terms like Merton's multiples, priority disputes, obliteration by incorporation, presentism, and Whig history but found them insufficient.

  Merton's multiples refer to independent discoveries but don't address the retroactive homogenization. Priority disputes focus on credit allocation, not the content's identity. Obliteration by incorporation is about forgetting origins, not retroactive unification. Presentism and Whig history are broader biases. So none of these terms fit perfectly. 

  The user needs a term that specifically describes the process where different contributions are retroactively unified into a single discovery. The closest concept might be from Kuhn or Galison, but nothing directly matches. Kuhn's incommensurability touches on conceptual differences but not the retroactive aspect. Galison's image of science as trading zones might help, but again, not quite. 

  Coining a new term makes sense here. The key elements are: retrospective harmonization, erasure of original differences, and the creation of a unified narrative. Terms like "retrospective harmonization" or "consensual homogenization" could work. "Retrospective Harmonization of Scientific Multiples" (RHSM) emphasizes the process and the outcome. 

  For criteria to distinguish genuine multiples from manufactured ones, the user needs clear boundaries. A genuine multiple would have independent, near-simultaneous, identical results. For manufactured ones, differences in content, methods, or frameworks exist at the time but are later smoothed over. Testing includes checking contemporaneous accounts, resistance to unification, and whether the differences were resolved through subsequent work.

  Individuating discoveries is tricky. The user questions whether it's the content, problem, method, framework, or uptake. A functional-pragmatic approach seems best: the minimal unit that advances the field. For inevitability, genuine multiples support it, but manufactured ones don't. The inference holds only if the discovery was mature enough that differences were minor, not fundamental. 

  The user's deeper need might be to challenge the narrative of inevitability in scientific progress. They want tools to analyze historical cases critically. Ensuring the term is precise and actionable for their project is crucial. They might also need methodologies to apply this concept to other cases beyond the three mentioned.
answer: |-
  Your pattern is astute and under-discussed in science studies. While no single established term perfectly captures this phenomenon, I can provide a conceptual toolkit:

  ### 1. Existing Terms & Why They Don't Quite Fit
  - **Merton's Multiples**: Names the phenomenon of simultaneous discovery but assumes the *identity* of the discoveries. Your critique targets the *construction* of that identity.
  - **Priority Disputes**: Focus on credit allocation, not epistemic equivalence. The dispute *presumes* identity; your pattern questions whether identity existed *to* dispute.
  - **Obliteration by Incorporation (OBI)**: Describes the *disappearance* of credit, not the *retroactive homogenization* of distinct contributions into a unified "discovery." OBI erases the contributor; your pattern erases the *differences* between contributions.
  - **Whig/Presentist Historiography**: Broad tendencies your pattern exemplifies, but they lack specificity. Your pattern is a distinct *mechanism* operating *within* these frameworks.
  - **Kuhnian Incommensurability**: Highlights conceptual divergence (as in oxygen), but doesn't address the *retrospective harmonization* process itself.

  **Closest Existing Concept:** Steven Shapin's "**interpretive flexibility**" (from SSK) applied to discovery claims, but it lacks the *temporal* dimension of retrospective unification. Galison's "**trading zones**" describes coordination across paradigms but not the erasure of difference in historical narratives.

  ### 2. Proposed Term: **Retrospective Harmonization of Scientific Multiples (RHSM)**

  **Definition:** The historiographical process whereby distinct, contemporaneous contributions to a scientific problem are later reconstructed as identical "discoveries" through the suppression of original conceptual, methodological, or empirical differences, creating the illusion of a simultaneous, inevitable breakthrough.

  **Boundaries & Criteria for RHSM:**
  - **Essential Features:**
    - **Contemporaneous Proximity:** Claims arise within a short timeframe (typically <5 years).
    - **Post-Hoc Homogenization:** The *later* scientific tradition/canon presents them as identical.
    - **Original Divergence:** Significant differences existed at the time in:
      - *Conceptualization* (e.g., phlogiston vs. oxygen; algorithmic calculus vs. geometric fluxions)
      - *Scope/Evidence* (e.g., mechanism-only vs. full evidential architecture in evolution)
      - *Methodology* or *Representation* (e.g., Leibniz's notation vs. Newton's geometric reasoning).
    - **Functional Equivalence for Narrative:** The harmonized version serves a purpose (e.g., demonstrating inevitability, simplifying pedagogy, resolving priority disputes).

  - **Disqualifiers:**
    - **Genuine Identity:** If thorough analysis of original texts shows core conceptual/empirical identity at the time of announcement.
    - **Independent Consolidation:** If the contributors *themselves* later converge on identical views *before* canonization (e.g., through correspondence).
    - **Ambiguity Resolution:** If differences stem from preliminary/partial announcements later clarified by the authors to match.
    - **Trivial Differences:** If variations are solely presentational (e.g., different notation for identical concepts).

  **Distinguishing Genuine Multiples from RHSM in Contested Cases:**
  This is inherently difficult, but robust criteria exist:
  1.  **Contemporaneous Reception:** Did *contemporaries* recognize the claims as identical? (If not, RHSM is likely at play). E.g., Priestley never accepted Lavoisier's framework.
  2.  **Authorial Self-Understanding:** Did the investigators *themselves* believe they had found the same thing? (Newton/Leibniz emphatically did not; Darwin saw Wallace's mechanism as identical to his own unpublished core, but knew his full argument was broader).
  3.  **Resistance to Harmonization:** Does unifying the contributions require resolving significant conceptual conflicts *external* to the original works? (e.g., reconciling fluxions/differentials required new mathematics; reconciling Priestley/Lavoisier required abandoning phlogiston).
  4.  **Granularity of Analysis:** Does treating them as identical obscure important historical dynamics (e.g., different research trajectories, alternative possibilities)? If yes, RHSM is likely masking complexity.
  5.  **Function of the "Multiple":** Is the claim of simultaneity primarily used to support narratives of inevitability or progress? This signals potential RHSM motivation.

  ### 3. Individuating Discoveries & Implications for Inevitability

  *   **What Individuates a Discovery?** There is no single answer; it's a **cluster concept**:
      *   **Core Problem:** Addressing the same fundamental scientific question (e.g., "What explains species adaptation?").
      *   **Core Mechanism/Entity:** Identifying the same causal process or ontological entity (e.g., natural selection, oxygen gas).
      *   **Functional Equivalence:** Providing a solution that *functions* similarly within the scientific community, regardless of internal conceptual differences (e.g., both Leibniz's and Newton's systems could solve similar problems).
      *   **Uptake & Canonization:** The consensus view of the scientific community over time about what constitutes "the discovery."

  *   **RHSM's Impact on the Inevitability Inference:**
      *   **Undermines Simple Inevitability:** RHSM cases are *not* evidence that a *specific, unified* discovery was inevitable at that precise moment. They show that elements contributing to a *later* synthesis were emerging.
      *   **Supports Maturation:** They *do* suggest the *problem space* was ripe, and that the fundamental *problem* was likely to be addressed soon. However, the *specific form* the "discovery" took (e.g., Lavoisier's oxygen theory vs. a reformed phlogiston theory) was *not* inevitable.
      *   **Reframes Inevitability:** RHSM shifts the focus: inevitability applies less to a specific conceptual package and more to the convergence on a problem demanding solution and the emergence of key *components* or *insights*. The synthesis itself is an active achievement, not an automatic outcome.
      *   **Requires Nuance:** The inference from *genuine* multiples to inevitability for *that specific conceptualization* holds. RHSM cases show that many "multiples" cited as evidence are *not* genuine in this sense. True inevitability requires identifying cases where the *specific, identical discovery* (concept, evidence, framework) arises independently multiple times.

  **Conclusion:** Your pattern, **Retrospective Harmonization of Scientific Multiples (RHSM)**, is a critical historiographical mechanism that exposes how narratives of scientific inevitability are often constructed through the erasure of original conceptual diversity. It forces a distinction between the inevitability of a *problem being addressed* and the inevitability of a *specific, unified solution* emerging at a precise time. Recognizing RHSM requires careful analysis of original texts, contemporaneous reception, and the functional role of the "multiple" claim within scientific narratives. It complicates, but doesn't invalidate, discussions of inevitability; it simply demands greater precision about *what* is claimed to be inevitable.
