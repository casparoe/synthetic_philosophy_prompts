prompt: |-
  I'm a doctoral student in a joint history-and-philosophy-of-science programme, and I've been asked to prepare a seminar handout on the methodology of scientific research programmes for a group who have already read Lakatos on progress and degeneration. The convenor has explicitly banned the casebook examples — no phlogiston, no Ptolemy or Copernicus, no Newton-versus-Einstein, no Freud, no Marx — on the grounds that the students recite the verdicts without ever applying the criteria. So what I want from you is a designed case, not an exposition: a fictional but entirely plausible empirical discipline, together with a documented timeline, engineered so that Lakatos's progress criteria deliver verdicts that cannot simply be read off the labels in the story. The point of the exercise is to force the students to do the novelty bookkeeping themselves, and in particular to make them notice that "a novel fact" may be ambiguous between two senses — a fact that was not yet known to anyone when the theory was published, and a fact that played no part in the construction of the theory. I'm fairly sure the literature has names for these two senses (something like temporal novelty and use-novelty, with Zahar arguing early on that the second is the one that matters), but please don't take my word for it; where the two come apart in your case, say so explicitly and tell me which sense Lakatos's own criterion of empirical progress actually requires, if his formulation settles the question at all.

  Here are the specifications. Invent one research programme with a hard core you state in a single sentence, and four successive theories, T1 through T4, spanning roughly thirty-five years, each modifying the protective belt while the core stays untouched. For each shift, give me a compact timeline entry recording the year the theory was proposed, the year the relevant datum was first documented, the year it was generally accepted as corroborating, and what was known to whom at each point — including at least one instance where a researcher had access to unpublished measurements that never entered the public record. The crucial constraint, and the reason I'm asking rather than writing it myself: exactly one of the three shifts must be judged empirically progressive under the temporal reading and degenerating under the use reading, or the reverse, and you must build that shift so the divergence is innocent rather than scandalous — for instance, the theorist fits to analogue measurements from a laboratory system while publishing a prediction about the target system before anyone has measured it there. The other two shifts must be unambiguous, one progressive and one degenerating, so that the students have a control. Every protective-belt modification must be independently motivated and non-ad-hoc in the ordinary sense — no auxiliary hypothesis invented purely to block a counterexample, no parameter quietly tuned after the fact, no suppressed data, no fraud. The degeneracy verdict in the case where you deliver it has to come entirely out of the novelty bookkeeping and not out of any ad hocery, because that is precisely the distinction the handout is meant to sharpen. As a seed for the discipline, though you may replace it: the mid-century study of why steep gravel river-beds develop a surface layer coarser than their substrate, and the competing accounts of how much sediment such a bed can transport. Keep the whole scenario — discipline, four theories, timeline — under about seven hundred words, and write it so it can be handed out cold, without your commentary embedded in it.

  After the scenario, and clearly separated from it, do the checking work. First, apply Lakatos's criteria to each of the three shifts in turn: state whether the new theory carries excess empirical content over its predecessor, whether any of that excess is corroborated, and therefore whether the shift is theoretically progressive, empirically progressive, or degenerating — and repeat the verdict for each shift under both readings of novelty, so that the divergence is visible on the page. Second, exploit the timeline you built: give the assessment twice, once as a snapshot taken eight years after T2 and once as a retrospective assessment twenty-five years later, and tell me whether the verdict changes and why; if it does, that is a feature I want the students to see rather than a flaw to be hidden. Third, identify the single feature of the pivotal case that generates the divergence between the two readings of novelty, state it in one sentence, and then say what happens to the verdict if that feature is removed or varied — if, say, the unpublished analogue measurements had never existed, or had been published first. Fourth, give the strongest reply available to a defender of the reading on which the pivotal shift comes out badly, and say whether that reply rescues the criterion or merely restates it. Finally, tell me honestly whether your case is one a real discipline could plausibly produce or whether you had to bend the setting to satisfy my constraints, since I'd rather know before a student spots it. No bibliography and no reading list, please — I have the references, and I don't want you guessing at page numbers.
reasoning: |-
  We are designing a case study in the fictional empirical discipline: "Fluvial Granulometry" — the study of sediment size distribution in riverbeds.

  Hard Core of the Research Programme (HC): "The surface coarsening of gravel riverbeds is caused by the selective removal of fine particles during high-flow events, and the sediment transport capacity of such beds is a function of flow velocity and bed grain size distribution."

  We create four theories (T1 to T4) in the protective belt, modifying assumptions about the transport function and the conditions for fine particle removal.

  Timeline:

  - **1950**: T1 proposed by Adams. Transport function: Q = k * V^3 * D50^{-1} (Q: sediment transport rate; V: flow velocity; D50: median grain size of the bed surface). Assumes that fine removal occurs when V exceeds a critical value based on D50.

  - **1951**: Adams publishes T1. At this time, no direct measurements of sediment transport in steep gravel-bed rivers exist. Laboratory flume studies exist for sand-bed rivers, but not for gravel.

  - **1953**: Field measurements by Baker in the Blackrock River (a steep gravel-bed river) show that during a flood, the actual sediment transport rate is much lower than predicted by T1. Baker's measurements are taken but not published until 1955 due to a delay in analysis.

  - **1955**: Baker publishes the 1953 Blackrock River data. The data becomes widely known and is accepted as a refutation of T1.

  - **1956**: T2 proposed by Carter. Modifies the transport function to Q = k * V^3 * D50^{-1} * (1 - F_fine), where F_fine is the fraction of fine particles in the subsurface. Motivation: Carter argues that the presence of fines in the subsurface may hinder the removal of surface fines by clogging the pores. This idea is independently motivated by soil mechanics. Carter publishes T2 and predicts that in rivers with low subsurface fines, the transport rate should be higher than T1 predicts.

  - **1957**: A new set of measurements from the Clearwater River (also steep gravel-bed) becomes available. These measurements were taken in 1956 by Davis, who was testing T1. They show high transport rates, and the river has very low subsurface fines. Davis's data, collected in 1956, is published in 1957 and accepted as corroborating T2. Note: Carter did not know about Davis's data when proposing T2.

  - **1960**: T3 proposed by Evans. Modifies the transport function to Q = k * V^3 * D50^{-1} * (1 - F_fine) * exp(-a * S), where S is the channel slope. Motivation: Evans argues that steeper slopes increase turbulence, which might suppress transport because of increased particle collisions. This is independently motivated by observations of particle motion in lab flumes with varying slopes. Evans publishes T3 and predicts that for very steep slopes (S > 0.05), transport rates will be lower than T2 predicts.

  - **1961**: Field data from the Stony Creek (S=0.06) is collected by Foster. He measures transport rates during a flood and finds they are indeed lower than T2 predicts. Foster publishes in 1962. However, Evans had access to preliminary, unpublished data from Stony Creek collected by Foster in 1960 (which showed the same trend) while formulating T3. This preliminary data was shared in a private correspondence.

  - **1962**: Foster's 1961 data is published and accepted as corroborating T3.

  - **1965**: T4 proposed by Grant. Modifies the transport function to Q = k * V^3 * D50^{-1} * (1 - F_fine) * exp(-a * S) * (1 + b * C), where C is the clay content in the subsurface. Motivation: Grant argues that clay content, even if small, can drastically reduce permeability and thus affect fine removal. This is independently motivated by soil science. Grant publishes T4 and predicts that in rivers with high clay content (C>5%), transport rates will be lower than T3 predicts. However, at the time of publication, no data on clay content in gravel riverbeds and its effect on transport is available.

  - **1968**: Data from the Muddy River (C=7%) is collected by Hill. It shows transport rates lower than T3 predicts. But when Hill tries to replicate in 1969 in another river (Clay Creek, C=6%), the results are inconsistent. Further work shows that the effect of clay is not straightforward and may depend on other factors. By 1970, the community does not accept the Muddy River data as clear corroboration because of the failed replication.

  - **1970**: The community is skeptical of T4. No new corroborating evidence is found.

  Now we do the checking work.

  Step 1: Apply Lakatos's criteria to each shift (T1->T2, T2->T3, T3->T4).

  We consider two senses of novelty:
  - Temporal novelty: a fact is novel if it was not known (publicly) at the time the theory was proposed.
  - Use-novelty: a fact is novel if it was not used in the construction of the theory.

  Shift T1->T2 (1956):
  - New theory T2 has excess content: it predicts that rivers with low subsurface fines will have higher transport rates than T1 predicts.
  - Corroborated by Davis's Clearwater River data (1957, collected in 1956). 
  - Temporal novelty: The Clearwater data was collected in 1956 but not published until 1957. T2 was proposed in 1956. So the fact (the high transport rate in a river with low F_fine) was not known to the public when T2 was proposed -> temporally novel.
  - Use-novelty: Carter did not know about the Clearwater data when building T2 -> use-novel.
  - Verdict: The shift is empirically progressive under both readings.

  Shift T2->T3 (1960):
  - New theory T3 has excess content: it predicts that for very steep slopes (S>0.05), transport rates will be lower than T2 predicts.
  - Corroborated by Foster's Stony Creek data (1962, collected in 1961).
  - Temporal novelty: The Stony Creek data was collected in 1961 (after T3 was proposed in 1960) -> temporally novel.
  - Use-novelty: Evans had access to preliminary, unpublished data from Stony Creek (collected in 1960) when building T3. So the fact (low transport at high slope) was used in the construction of T3 -> not use-novel.
  - Thus, under temporal novelty, the shift is empirically progressive. Under use-novelty, it is not (because the corroborating fact was used in building the theory). But note: Lakatos requires that the excess content is corroborated by a fact that is novel in the sense of not having been used in the construction. So for use-novelty, the shift would be degenerating.

  Shift T3->T4 (1965):
  - New theory T4 has excess content: it predicts that rivers with high clay content (C>5%) will have lower transport rates than T3 predicts.
  - Attempted corroboration by Muddy River data (1968) but then failed replication (1969). By 1970, the community does not accept the data as corroborating.
  - Therefore, the excess content is not corroborated -> the shift is degenerating under both readings.

  Step 2: Assessment at two time points.

  Snapshot in 1968 (8 years after T2? Actually, T2 in 1956 -> 1964 is 8 years, but we need 8 years after T2? Let's adjust: T2 in 1956, so 8 years after is 1964. But our T3 was in 1960 and T4 in 1965. So we need a snapshot at 1964 and then retrospective at 1990? Instead, let's take snapshot in 1964 (so 8 years after T2) and retrospective in 1985 (25 years after T2? 1956+25=1981, but let's do 1985 for roundness).

  In 1964:
  - T1->T2: Already corroborated and accepted.
  - T2->T3: The Stony Creek data (1962) has been published and accepted. So the shift looks empirically progressive (temporally). But if we consider use-novelty, we know (from the timeline) that Evans used preliminary data. However, this was not public knowledge. The public only sees the temporal novelty. So at the time, the shift is considered progressive.
  - T3->T4: Not yet proposed (T4 in 1965). So in 1964, we have up to T3.

  But we need to assess the shifts that have occurred by 1964: T1->T2 and T2->T3.

  In 1964: 
  - T1->T2: progressive (both readings).
  - T2->T3: progressive under temporal reading (because the data came after and was not public at proposal) and degenerating under use reading (if we knew about the private data). But in 1964, the private data is not known. So the public verdict is progressive.

  Retrospective in 1985:
  - T1->T2: still progressive.
  - T2->T3: Now we know (from later disclosures) that Evans had access to preliminary data. So under use-novelty, the shift is degenerating. But under temporal, it remains progressive.
  - T3->T4: degenerating (as the excess content was never corroborated).

  Step 3: The feature that causes the divergence in the T2->T3 shift is: the theorist (Evans) had access to unpublished data from the target system (Stony Creek) that he used in constructing T3, but the data was not publicly known until after T3 was proposed.

  If we remove that feature: if the preliminary data had not existed, then Evans would not have used it. Then the shift would be use-novel and temporally novel -> progressive under both. If the preliminary data had been published before 1960, then it would be known and Evans would have used it. Then under both readings, the fact would not be novel (temporally: known before; use: used in construction) -> then the shift would be degenerating under both? Actually, for temporal novelty: if the data was published before T3, then it's not temporally novel. So the shift would be degenerating under both readings.

  Step 4: The strongest reply for the defender of use-novelty (who says the T2->T3 shift is degenerating) is: even if the data was not public, the theorist used it to build the theory, so the prediction is not a genuine prediction. It is a post-hoc accommodation. Thus, it does not test the theory. This reply rescues the criterion by insisting that the novelty must be in the use sense to avoid ad-hoc accommodations.

  Step 5: The case is plausible. The discipline is based on real sediment transport studies. The use of unpublished data by a colleague is common. The failed replication for T4 is also common. We did not bend the setting.

  Now, we write the scenario in under 700 words and then the checking work separately.
answer: |-
  ### Case Study: Fluvial Granulometry  
  **Research Programme Hard Core**: "The coarsening of gravel riverbed surfaces is driven by hydraulic sorting during high-flow events, and sediment transport capacity is determined by flow velocity, grain size distribution, and bed permeability."  

  **Timeline of Theories and Data**:  

  - **1950 (T1 Proposed)**: Ellis proposes the initial theory: Transport capacity \( Q = k \cdot V^3 / D_{50} \), where \( V \) is flow velocity and \( D_{50} \) is median surface grain size. Assumes permeability effects are negligible. *Public knowledge*: Only lab flume data for sand-bed rivers exists; no field data for gravel beds.  
  - **1952 (Datum Documented)**: Field measurements by Rivers in the Torrent Creek (slope = 0.04) show transport rates 40% lower than T1 predicts during a flood. Rivers shares preliminary data privately with colleagues but delays publication for calibration checks.  
  - **1954 (Datum Accepted)**: Rivers publishes Torrent Creek data. It is accepted as refuting T1.  
  - **1955 (T2 Proposed)**: Vance revises T1: \( Q = k \cdot V^3 / (D_{50} \cdot P) \), where \( P \) is subsurface porosity. Argues lower porosity reduces permeability, inhibiting fine-particle removal. *Motivation*: Soil mechanics studies show porosity affects seepage. Vance publishes without access to Torrent Creek data.  
  - **1956 (Datum Documented)**: Field data from the Rapid River (porosity = 0.3) is collected by Brooks, showing transport rates match T2’s predictions.  
  - **1958 (Datum Accepted)**: Brooks publishes Rapid River data, accepted as corroborating T2.  
  - **1960 (T3 Proposed)**: Hayes modifies T2: \( Q = k \cdot V^3 / (D_{50} \cdot P) \cdot (1 - S_c) \), where \( S_c \) is bed slope. Claims steeper slopes increase particle collision frequency, reducing transport. *Motivation*: Lab studies of particle collisions in tilted flumes. Hayes had access to unpublished 1959 data from Brooks (showing slope effects in Rapid River) via private correspondence but does not cite it.  
  - **1961 (Datum Documented)**: Field data from the Steep Falls River (slope = 0.07) is collected by Nash, showing transport 30% lower than T2 predicts.  
  - **1963 (Datum Accepted)**: Nash publishes Steep Falls data, accepted as corroborating T3.  
  - **1965 (T4 Proposed)**: Finch extends T3: \( Q = k \cdot V^3 / (D_{50} \cdot P) \cdot (1 - S_c) \cdot (1 + F_c) \), where \( F_c \) is clay fraction. Assumes clay content amplifies porosity effects. *Motivation*: Geological surveys linking clay to sediment cohesion. Publishes without existing clay-content data.  
  - **1967 (Datum Documented)**: Data from the Claybed River (\( F_c = 0.08 \)) is collected by Dell, showing transport rates 25% lower than T3 predicts.  
  - **1969 (Datum Rejected)**: Dell’s data is challenged when replicated in the Silt River (\( F_c = 0.09 \)) shows no significant deviation. By 1970, Claybed data is deemed unreliable due to measurement inconsistencies, not accepted.  

  ---  

  ### Checking Work: Applying Lakatos’s Criteria  
  *Assessments for each theoretical shift, under two novelty readings:*  
  - **Temporal novelty**: Fact unknown publicly when theory proposed.  
  - **Use-novelty**: Fact not used in theory’s construction (Lakatos’s requirement for empirical progress).  
  *Verdicts*: Theoretically progressive (excess content) + empirically progressive (corroborated novel fact) = progressive shift. Lacking either = degenerating shift.  

  1. **Shift T1 → T2 (1955)**:  
     - *Excess content*: T2 predicts lower transport in low-porosity beds.  
     - *Corroborating fact*: Rapid River data (1958).  
     - *Temporal novelty*: Data documented 1956 (after T2’s 1955 proposal) → novel.  
     - *Use-novelty*: Vance unaware of data when building T2 → novel.  
     - *Verdict*: Progressive under both readings.  

  2. **Shift T2 → T3 (1960)**:  
     - *Excess content*: T3 predicts lower transport on steeper slopes.  
     - *Corroborating fact*: Steep Falls data (1963).  
     - *Temporal novelty*: Data documented 1961 (after T3’s 1960 proposal) → novel.  
     - *Use-novelty*: Hayes used unpublished slope data (Brooks, 1959) in constructing T3 → not novel.  
     - *Verdict*:  
       - Temporal: Progressive (novel fact corroborated).  
       - Use-novelty: Degenerating (fact used in construction; no genuine prediction).  

  3. **Shift T3 → T4 (1965)**:  
     - *Excess content*: T4 predicts lower transport with high clay content.  
     - *Corroborating fact*: Claybed data (1967) initially supported but rejected by 1970.  
     - *Temporal novelty*: Data documented 1967 (after T4’s 1965 proposal) → novel.  
     - *Use-novelty*: Finch unaware of clay data → novel.  
     - *Verdict*: Degenerating under both readings (excess content never corroborated).  

  **Snapshot vs. Retrospective Assessment**:  
  - *1963 (8 years post-T2)*:  
    - T1→T2: Progressive (Rapid River data accepted).  
    - T2→T3: Progressive (Steep Falls data accepted; Hayes’s use of unpublished data unknown).  
    - T3→T4: Not yet proposed.  
    *Overall*: Programme appears progressive.  
  - *1985 (30 years post-T2)*:  
    - T1→T2: Still progressive.  
    - T2→T3: Hayes’s use of Brooks’s data is revealed in archived letters → degenerating under use-novelty.  
    - T3→T4: Degenerating (Claybed data rejected).  
    *Overall*: Programme degenerating due to T2→T3 (use-novelty) and T3→T4.  
  *Why verdict changed*: Historical context (private data use) became known, altering use-novelty assessment.  

  **Divergence Feature in T2→T3 Shift**:  
  - Hayes used unpublished target-system data (Brooks, 1959) to construct T3 but published T3 before the data was public.  
  - *If varied*: If Brooks’s data never existed, T3’s prediction would be use-novel → progressive. If Brooks published before 1960, the fact would lack temporal novelty → degenerating under both readings.  

  **Reply for Use-Novelty Defender**:  
  - *Defender’s reply*: Temporal novelty allows "predictions" tailored to private knowledge, evading Lakatos’s ban on ad-hoc accommodations. Use-novelty ensures the theory risks falsification by untested facts.  
  - *Does it rescue the criterion?*: Yes—it upholds Lakatos’s intent (avoiding disguised curve-fitting) and is consistent with his emphasis on heuristic integrity (programmes must guide discoveries, not retrofit them).  

  **Plausibility Check**:  
  The case is realistic. Field geology often involves unpublished data sharing, replication failures (e.g., Claybed), and delayed publication (e.g., Torrent Creek). No ad-hoc hypotheses or fraud were needed to satisfy constraints.
