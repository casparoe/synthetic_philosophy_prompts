  We are building a decision procedure based on Grice's theory of conversational implicature for a panel that adjudicates misleading advertising. The key elements from Grice that we will use are the Cooperative Principle and the Maxims of Conversation (Quantity, Quality, Relation, and Manner). However, we must adapt this to the non-cooperative context of advertising, where the consumer knows the advertiser is trying to sell something.

  Gricean implicature arises when a speaker flouts a maxim, leading the hearer to infer a meaning that is not explicitly stated. In advertising, the advertiser (speaker) and the consumer (hearer) are not engaged in a fully cooperative conversation in the Gricean sense because the advertiser has a persuasive intent. Nevertheless, we can still use the framework by recognizing that consumers rely on expectations of truthful and relevant communication, even in advertising, and that advertisers often exploit these expectations.

  The procedure must address:
  1. Fixing the content of the implied claim when several are available, including the strength of the implication.
  2. Testing whether the implication is genuinely worked out from the ad plus ordinary expectations (not imported by the complainant).
  3. The role of cancellability: whether it is a diagnostic, a remedy, or neither, especially given that small print usually doesn't cure a false overall impression.

  We'll structure the procedure as a series of questions. The procedure stops and hands over to evidence of consumer takeaway at specific points where the Gricean reasoning alone cannot resolve the issue.

  **Decision Procedure:**

  1. **Identify the Literal Content:** 
     - What are the explicit claims in the advertisement? (This is usually already done by staff.)
     - If any explicit claim is false, then the ad is misleading on that basis (not our focus here). We proceed only if all explicit claims are true.

  2. **Identify the Candidate Implied Claim(s):**
     - What claim(s) does the complainant allege are implied by the ad? (We start with the complainant's allegation to have a candidate to test.)
     - What other implied claims might a reasonable consumer derive? (The panel should consider alternatives.)

     *How to fix the content when several are available?*
     - We must consider the context and the ordinary consumer's expectations. The candidate implied claims should be those that are most strongly suggested by the ad in the context of typical advertising for such products/services.
     - The strength of the implication (how strongly it is suggested) matters. We look for the most salient and direct implication that would be drawn by an ordinary consumer. This may require considering the structure of the ad (e.g., headline vs. small print, visuals).

     *Procedure at this step:*
     - List all candidate implied claims (from the complaint and any others the panel identifies).
     - For each candidate, we will test it in the following steps.

  3. **Determine if the Candidate Implied Claim is an Implicature (Gricean Test):**
     - We apply a modified Gricean framework. The key question: Would the ordinary consumer, relying on the expectation that the advertiser is following the conversational maxims (as adapted to advertising), derive the implied claim to make the ad consistent with those maxims?

     *Steps for each candidate:*
     a. **Flouting:** Is there a maxim that the advertiser appears to flout by making the explicit statement? (This flouting would trigger the implicature.)
        - Maxims (adapted for advertising):
          - **Quantity:** Give as much information as is required for the current purposes of the exchange; do not give more information than is required.
            - In advertising: The advertiser should not withhold important information that the consumer needs to make an informed decision. But note: advertising is persuasive, so some withholding is expected, but not to the point of deception.
          - **Quality:** Try to make your contribution one that is true; do not say that for which you lack adequate evidence.
            - In advertising: The consumer expects that the advertiser will not lie, but may exaggerate within the bounds of puffery. However, false implications are not allowed.
          - **Relation:** Be relevant.
            - In advertising: The ad should be relevant to the consumer's decision to purchase.
          - **Manner:** Be perspicuous; avoid obscurity, ambiguity, and be orderly.
            - In advertising: The ad should be clear and not misleading.

     b. **Inference:** Can the implied claim be inferred by the ordinary consumer to resolve the apparent flouting? That is, by assuming the advertiser is adhering to the Cooperative Principle (in the adapted sense), the consumer would derive the implied claim to make sense of the explicit claim.

     c. **Cancellability Test (as a diagnostic):**
        - Grice held that implicatures are cancellable without contradiction. That is, the advertiser could add a disclaimer that negates the implied claim without contradicting the explicit content.
        - However, in advertising, the timing and prominence of any disclaimer matter. If the disclaimer is in small print or buried, it may not effectively cancel the implicature because the ordinary consumer might not see it. Therefore, we use cancellability as a diagnostic tool to check the nature of the implication, but not as a remedy if the cancellation is not effectively communicated.
        - **Procedure:**
            - Consider: If the advertiser had added a clear and prominent disclaimer that directly negates the implied claim, would the ad then be non-misleading? If yes, then the implication is cancellable and is a genuine implicature. But note: if the disclaimer is not present or is not sufficiently prominent, then the implication stands.
            - However, in our context, if the ad already has a disclaimer, we must assess whether it is sufficiently clear and prominent to cancel the implicature for the ordinary consumer. This is where we may need evidence of consumer takeaway (see step 4).

     d. **Non-Importation Test (to ensure the implication is not imported by the complainant):**
        - The implication must be one that is generated from the ad and the ordinary context of advertising, not from the complainant's unique perspective. We ask:
            - Is the implication one that a typical consumer in the target audience would draw, without any special knowledge or bias?
            - Would the implication be drawn even if the complainant had not suggested it?

     *Stopping point for Gricean reasoning and handover to evidence:*
     - If the panel cannot agree on whether the implication is generated by the Gricean mechanism (because the context of advertising makes the application of maxims ambiguous) or if there is a dispute about the strength of the implication, then we must turn to evidence of what consumers actually took away (e.g., consumer surveys, expert testimony on consumer behavior). However, we try to use the Gricean reasoning as far as possible.

  4. **Assess the Truth of the Implied Claim:**
     - If we have identified a genuine implied claim (via step 3) and it is false, then the ad is misleading.

  **Addressing the Non-Cooperative Nature of Advertising:**
  - In advertising, the consumer knows the advertiser is not purely cooperative but has a persuasive intent. Therefore, the maxims are not followed in the same way as in a cooperative exchange. However, consumers still expect that the advertiser will not deceive them. We adapt the maxims:
    - **Quality:** The consumer expects that the advertiser will not make false statements (explicit or implied) about the product, even if they engage in puffery (exaggerations that no one would take literally).
    - **Quantity:** The consumer expects that the advertiser will not omit crucial information that would significantly affect the decision to purchase, especially if the explicit claim would be misleading without it.
    - **Relation:** The consumer expects that the ad will be relevant to the product's attributes and the decision to buy.
    - **Manner:** The consumer expects that the ad will be clear and not obscure important information.

  In essence, the maxims survive as expectations of truthful and non-misleading communication, even in advertising. The persuasive intent does not remove the obligation not to deceive.

  **Running the Procedure on Examples:**

  *Example 1: Fruit drink labelled "made with real fruit juice" (juice is 3% of the volume).*

  - Literal content: True, it is made with real fruit juice (even if only 3%).
  - Candidate implied claim (from complainant): The drink is primarily made of fruit juice or contains a significant amount of fruit juice.
  - Gricean analysis:
    - Flouting of maxim of Quantity: The statement is true but under-informative. The consumer would expect that if the drink contained only a tiny amount of juice, the advertiser would say so to avoid misleading. Since they didn't, the consumer infers that the amount is significant.
    - Flouting of maxim of Quality? Not directly, because it is true. But the implication might be false.
    - Inference: To resolve the under-informativeness, the consumer infers that the drink contains a substantial proportion of fruit juice.
    - Cancellability: The implication could be cancelled by adding "only 3% fruit juice". If this is done prominently, then the ad might not be misleading. However, if it is in small print, it may not be effective. In our case, there is no such disclaimer, so the implication stands.
    - Non-importation: This implication is not specific to the complainant; it is a common inference in such cases (as evidenced by many regulatory cases).
  - Verdict: The ad is misleading because the implied claim (significant amount of juice) is false.

  *Example 2: Store window "up to 40% off" (only one item at 40%).*

  - Literal content: True, there is at least one item that is 40% off (even if most items are discounted less or not at all).
  - Candidate implied claim: A significant number of items are discounted at or near 40%.
  - Gricean analysis:
    - Flouting of maxim of Quantity: The statement is under-informative. The consumer would expect that if only one item is at 40% off, the advertiser would provide that information to avoid misleading. Without it, the consumer infers that a meaningful range of products are discounted at up to 40%.
    - Inference: To resolve the under-informativeness, the consumer infers that the sale includes a reasonable selection of items at discounts close to 40%.
    - Cancellability: The implication could be cancelled by adding "on selected items only" or "on one item only". If this is done clearly, it might avoid being misleading. But if the ad does not have such a qualification, or it is in small print, the implication stands. In this case, the store window has no such qualification.
    - Non-importation: This is a common inference in sales advertising.
  - Verdict: The ad is misleading because the implied claim (that a reasonable selection of items are at discounts near 40%) is false.

  *Example 3: Mortgage advertisement "our customers pay an average rate of 3.1%" (median 4.8%).*

  - Literal content: True, the average is 3.1% (because of a few legacy loans with very low rates).
  - Candidate implied claim: The typical customer (or a majority) pays around 3.1%, or that the rate available to new customers is around 3.1%.
  - Gricean analysis:
    - Flouting of maxim of Quantity: The statement is under-informative. The consumer would expect that if the average is not representative (because of a skewed distribution), the advertiser would clarify. Without clarification, the consumer infers that the average is representative of what most customers pay.
    - Flouting of maxim of Manner? The use of "average" without specifying that it is not the median (which is more typical) might be ambiguous and obscure the fact that most pay more.
    - Inference: To resolve the under-informativeness, the consumer infers that the average is a good indicator of the typical rate. But note: the ordinary consumer might not know the difference between mean and median. They might take "average" to mean typical. However, we must consider the ordinary consumer's understanding.
    - Cancellability: The implication could be cancelled by stating that the average is skewed by legacy loans and that current rates are higher. But without such a disclaimer, the implication stands.
    - Non-importation: The complainant's allegation is that the ad implies the typical rate is 3.1%. This is a reasonable inference for an ordinary consumer who does not know about skewed distributions.

    However, let's challenge this: 
    - In many contexts, consumers are aware that "average" can be skewed. But in the context of mortgage rates, the ordinary consumer might not. Also, the ad does not specify that the average includes loans no longer available. 
    - But note: the ad says "our customers" (which includes past and present). The candidate implied claim that the typical customer pays 3.1% is false (since the median is 4.8%). 
    - Alternatively, the implied claim might be that the average rate is 3.1% and that this is a good indicator of the rate you might get. But the ordinary consumer might not know the difference. 

    *This might come out against the panel's expectations:*
    - We must consider if an ordinary consumer would know that an average can be skewed. This is where evidence of consumer understanding might be needed. Without such evidence, we rely on the panel's judgment of the ordinary consumer.

    - However, in financial advertising, there is a higher duty of clarity. Regulatory guidance often requires that if an average is used and it is not representative, it should be accompanied by a disclaimer.

    - Verdict: The ad is misleading because it implies that the typical customer pays around 3.1% (which is false) and that the rate is representative of what a new customer might pay.

  **But wait, one of these should come out against your expectations. Let me reconsider Example 3.**

  Alternative view for Example 3:
  - It is common knowledge that an average can be affected by extremes. Therefore, the ordinary consumer might not take "average" to mean the typical rate. They might think it is the mean and that some pay less and some pay more. Therefore, the implied claim that the typical rate is 3.1% might not arise. The candidate implied claim might be weaker: the average rate paid by customers is 3.1%. But that is true. 
  - However, the context is an advertisement for new mortgages. The consumer would be interested in the rate they might get. The ad does not say "current rates" or "rates for new customers". Therefore, the implication might be that the average includes current rates and that 3.1% is a rate that is achievable. But if the current rates are around the median (4.8%) and the 3.1% is from old loans, then the implication that new customers can get around 3.1% is false.

  - We must then reformulate the candidate implied claim: "The rate that new customers can expect is around 3.1%." 
  - This is a stronger claim and might be the one that matters.

  - Gricean analysis for this candidate:
    - Flouting of Quantity: The ad does not specify that the average includes old loans. The consumer would expect that if the advertised rate is not available to new customers, the advertiser would say so. Without that, the consumer infers that the rate is relevant to new customers.
    - Inference: The consumer infers that the average rate includes current loans and that a new customer has a chance of getting a rate around 3.1%. 
    - This is false because the current rates are around 4.8% and the 3.1% is from old loans.

  - Therefore, the ad is misleading.

  But note: the panel might have expected that the use of the word "average" by itself is not misleading. However, in the context, it creates a false impression about current rates. So the procedure finds it misleading.

  **What the Procedure Cannot Settle:**
  - The procedure relies on the panel's judgment about what the ordinary consumer would infer. This is inherently subjective. We use the Gricean framework to structure the reasoning, but the application of the maxims in the context of advertising requires judgment.
  - When there is genuine ambiguity about the strength of the implication or the ordinary consumer's understanding (as in the mortgage example about the word "average"), the procedure must hand over to evidence (e.g., consumer surveys). Without such evidence, the panel must use their collective judgment.
  - Also, the determination of whether a disclaimer is sufficiently prominent to cancel an implicature often requires evidence of consumer takeaway.

  **Distinctions Dropped and Why Safe:**
  - We dropped the distinction between generalized and particularized conversational implicatures. Grice distinguished between implicatures that require specific context (particularized) and those that arise without special context (generalized). In advertising, we treat all as context-driven (the context being the product and typical advertising) and focus on the ordinary consumer's perspective. This is safe because the regulatory context is about typical consumer reactions.
  - We dropped the strict requirement of the Cooperative Principle. Grice assumed cooperation, but we adapted the maxims for advertising. This is safe because the consumer's expectations of truthfulness and non-deception are still present, even in a persuasive context.
  - We used cancellability as a diagnostic but not as a remedy if the cancellation is not effectively communicated. This aligns with the settled practice that small print usually doesn't cure a false impression.

  **Conclusion:**
  The procedure provides a structured way to analyze implied claims using Gricean pragmatics. It helps to identify when an ad is misleading by implication and to defend the decision with reproducible reasoning. However, it cannot eliminate the need for judgment about the ordinary consumer's perspective, and in some cases, evidence must be called upon.
answer: |-
  ### Decision Procedure Based on Grice's Conversational Implicature  
  Adapted for advertising complaints, this procedure uses Grice’s Cooperative Principle and maxims (Quantity, Quality, Relation, Manner) as a framework, while accounting for advertising’s non-cooperative context. The advertiser is not a neutral informant but a persuader; consumers expect truthfulness within that role. The maxims survive as **norms of non-deceptive communication**: advertisers must not exploit consumer expectations to mislead.  

  #### Questions in Order, with Sufficient Answers and Stopping Points  
  **Question 1: What is the literal claim, and is it true?**  
  - **Sufficient answer**: Staff confirmation that every explicit statement is factually accurate.  
  - **Stopping point**: If false, the ad is misleading; stop. If true, proceed.  

  **Question 2: What candidate implied claims arise?**  
  - **Sufficient answer**: List claims a reasonable consumer *could* infer (e.g., from the complaint, ad context, or panel brainstorming). Include variations in strength (e.g., "some" vs. "most").  
  - **Fixation method**: Prioritize claims that are:  
    - **Most salient**: Based on prominence (e.g., headlines, visuals).  
    - **Most specific**: Over vague alternatives (e.g., "contains significant fruit juice" beats "contains fruit").  
    - **Contextually reinforced**: Aligns with product category norms (e.g., "sale" implies meaningful discounts).  
  - **Stopping point**: If no plausible candidate, dismiss; else proceed.  

  **Question 3: Is the implication *generated* by the ad and ordinary expectations?**  
  - **Test for non-importation**: The implication must be derivable from:  
    - The ad’s content (words, images, formatting).  
    - **Ordinary consumer expectations**: What a typical audience member (not experts or cynics) would infer, given:  
      - Category conventions (e.g., "sale" implies non-trivial discounts).  
      - Grice’s maxims (adapted below).  
    - **Sufficient answer**: Show the inference resolves a *flouted maxim* (see table). If not, the implication is likely imported by the complainant; reject it.  
  - **Stopping point**: If no flouting, the implication is unlikely; stop. If flouting exists, proceed.  

  **Table: Adapted Maxims for Advertising**  
  | **Maxim** | **Consumer Expectation in Advertising** | **Flouting Triggers Implication** |  
  |-----------|------------------------------------------|-----------------------------------|  
  | **Quantity** | "Give enough information; don’t hide key limitations." | Omission of a material fact makes the stated claim misleading. |  
  | **Quality** | "Don’t lie or mislead, even indirectly." | Literal truth implies falsity or invites false inference. |  
  | **Relation** | "Be relevant to purchase decisions." | Irrelevant details distract from material omissions. |  
  | **Manner** | "Be clear; avoid ambiguity or obscurity." | Ambiguity disguises material facts. |  

  **Question 4: Is the implication *cancellable*?**  
  - **Diagnostic, not remedy**: Cancellability tests if the implication is *pragmatic* (Gricean) vs. semantic.  
    - **Sufficient answer**: If adding a clear, prominent disclaimer (*not* small print) negates the implication without contradiction, it was likely implicature.  
    - **BUT**: In practice, small print rarely cancels because:  
      - It violates **Manner** (obscurity) and **Quantity** (burying key facts).  
      - Consumers ignore it → no actual cancellation.  
  - **Role in procedure**:  
    - If *non-cancellable*, the implication may be semantic (not implicature) → still actionable.  
    - If *cancellable but not effectively cancelled*, the ad is misleading.  
  - **Stopping point**: If cancellability is ambiguous, use evidence (e.g., consumer surveys).  

  **Question 5: Is the implied claim false or unsubstantiated?**  
  - **Sufficient answer**: Evidence disproves the claim (e.g., "significant fruit juice" is false if only 3%).  
  - **Stopping point**: If true, the ad is not misleading; stop. If false, the ad is misleading.  

  ---  
  ### Application to Invented Advertisements  
  **Fruit Drink: "Made with real fruit juice" (3% juice)**  
  - **Literal claim**: True (contains juice).  
  - **Candidate implications**: "Contains a significant amount of juice" (strong); "contains some juice" (weak).  
  - **Fixation**: "Significant amount" is more salient (juice is a selling point; weak claim is non-material).  
  - **Non-importation test**:  
    - **Flouts Quantity**: Fails to disclose juice is minimal. Consumer expects: If juice were trivial, the ad would clarify to avoid misleading.  
    - **Implication generated**: Yes—resolves flouting by inferring material quantity.  
  - **Cancellability**: Implication cancellable by ("only 3% juice"), but small print ineffective → misleading.  
  - **Verdict**: **Misleading**.  

  **Store Window: "Up to 40% off" (one item at 40%)**  
  - **Literal claim**: True (one item discounted).  
  - **Candidate implications**: "Many items discounted near 40%" (strong); "Some discounts exist" (weak).  
  - **Fixation**: "Many items" is most specific/salient (sales imply meaningful opportunity).  
  - **Non-importation test**:  
    - **Flouts Quantity**: Omits scope (e.g., "on one item"). Consumer expects: If discounts are trivial/rare, the ad would say so.  
    - **Implication generated**: Yes—resolves flouting by inferring non-trivial availability.  
  - **Cancellability**: Cancellable by ("on select items only"), but store window lacks this → misleading.  
  - **Verdict**: **Misleading**.  

  **Mortgage Ad: "Our customers pay an average rate of 3.1%" (median 4.8%)**  
  - **Literal claim**: True (mean = 3.1%).  
  - **Candidate implications**: "Typical customers pay ~3.1%" (strong); "The average is 3.1%" (literal, but misleading).  
  - **Fixation**: "Typical customers pay ~3.1%" is most salient (consumers equate "average" with "typical").  
  - **Non-importation test**:  
    - **Flouts Manner**: "Average" is ambiguous; median is standard for "typical" rates. Consumer expects: If average is skewed, the ad would clarify or use median.  
    - **Implication generated**: Yes—resolves ambiguity by inferring representativeness.  
  - **Cancellability**: Cancellable by ("median rate 4.8%"), but absent → misleading.  
  - **Verdict**: **Misleading** (against your expectations? You may have expected "average" to protect the advertiser, but the implication of "typical" is false).  

  ---  
  ### Limitations and Trade-offs  
  **What the procedure cannot settle (judgment in disguise)**:  
  - **Ordinary consumer expectations**: When category norms are unclear (e.g., emerging products), the panel must *judge* what’s reasonable.  
  - **Implication strength**: Distinguishing "some" from "most" relies on panel interpretation of context.  
  - **Flouting vs. mere puffery**: E.g., "best coffee in town" is hyperbolic but not implicature; this requires line-drawing.  

  **Distinctions dropped for usability**:  
  - **Generalized vs. particularized implicature**: Grice distinguishes implications needing special context (particularized) from universal ones (generalized). Dropped because advertising is public; implications derive from broad norms, not private context.  
  - **Calculability rigor**: Grice requires step-by-step inference. Simplified to "flouting + resolution" for speed; safe because ad implications are rarely esoteric.  
  - **Speaker intention**: Irrelevant; consumer takeaway governs.  

  **Why safe?**  
  - Focus on consumer expectations aligns with advertising law’s "reasonable consumer" standard.  
  - Flouting maxims captures core deception patterns (omission, ambiguity, irrelevance).  
  - Cancellability as a diagnostic (not remedy) reflects real-world consumer behavior.  

  ---  
  **Final Note**: The procedure systematizes implicature analysis but cannot eliminate judgment. It ensures decisions are reproducible by tethering implications to flouted maxims and consumer norms. In borderline cases (e.g., the mortgage ad), evidence like surveys may be needed—but Gricean pragmatics covers 90% of complaints efficiently.
