prompt: |-
  ok so — I'm TAing a third-year epistemology seminar whose whole back half is on testimony, and the prof has asked me to set one of the questions for the two-hour final. I'd like you to help me design it. For this, act as a professional epistemologist who sets and marks a lot of exam papers, i.e. someone who knows how to write a question that can't be answered by reciting the standard story about Hume and Reid and then picking a side.

  The topic is reductionism vs anti-reductionism about testimonial justification. My problem is that every version I draft turns into "explain the two views and say which you find more plausible," and about half the cohort will do exactly that from memory, write it up fluently, and coast to a B. I want the difficulty to come from a crux, not from breadth.

  Here's the seed I want you to build the question around. Sharpen the wording of the cases if you like, but keep the structure and keep the confound in place — the confound is the point.

  Case A. Nadia is a hospital pharmacist. Tomas has worked as her assistant for eight months and has repeatedly checked her calculations against lab results that he can see for himself; she has been right essentially every time. One evening he passes the staff room and hears her, alone, dictating into a phone app that the dose in a batch destined for ward six is wrong, together with a figure. She isn't addressing him or anyone else, doesn't know he's there, and would have no idea he'd acted on it. He forms the belief on the basis of what he overheard. It's correct.

  Case B. Priya reads statements aloud at government briefings. She means what she reads, would be mortified to have said something false, and would correct the record if she found out. Dev, a journalist, has attended dozens of her briefings. He was able to independently verify three of her claims and all three held up; the rest he has no way of checking at all. His reason for thinking the office she reads for has a rigorous checking routine is entirely that people who work in the office say it does. He forms a belief on the basis of what she says at today's briefing.

  The question should force students to (i) work out what each view predicts about each case, (ii) notice that the two cases differ along two dimensions at once — whether there's an addressee who could be held to account, and how much independent reliability evidence the hearer has — so a naive side-by-side comparison doesn't isolate anything, (iii) redo the comparison with one dimension held fixed, and (iv) reach a verdict on whether a genuinely diagnostic case between the two views is available at all, or whether the debate is at least partly verbal because the two sides individuate the belief-forming process differently.

  Deliverables, in this order:

  1. About ten lines of brainstorming before you write anything. Think carefully here about whether these two views actually make different predictions in these cases or whether they mostly talk past each other. If you conclude they don't really differ, don't hide that — build the question so that recognising it is what the top marks reward.
  2. The exam question: 250–320 words, self-contained, cases stated compactly, task broken into lettered parts, and an explicit note that this is one of three compulsory questions so students should spend roughly 40 minutes and write about 700 words.
  3. A model answer of about 700 words.
  4. A marking scheme out of 25 built around five must-hit moves, with the marks for each, plus a one-line note per move on how students typically botch it.
  5. A short paragraph on what seperates an A from a B answer here, in terms of specific moves a candidate does or doesn't make, not vibes.

  Constraints: no bibliography, no reading list, no quotations, and no name-dropping in either the question or the model answer — nobody has sources in the room, and I want this answerable from understanding rather than recall. "Reductionism" and "anti-reductionism" are fine since we've defined them in class, but don't award marks for attaching the right label to the right contemporary author. Also, please don't let the model answer fizzle out into "both views have something to offer" — it needs to commit on point (iv), even if the commitment is that no diagnostic case exists.
reasoning: |-
  Okay, the user is a TA designing a final exam question for an epistemology seminar focused on testimony. They want a question that moves beyond rote memorization of Hume vs. Reid debates and forces deeper analysis. The core challenge is avoiding questions where students can just explain reductionism vs. anti-reductionism and pick a side for a B grade. 

  Hmm... the user's seed cases are cleverly designed with a confound: both cases vary simultaneously along two dimensions (addressee accountability and independent evidence). This makes direct comparison messy. The real pedagogical goal seems to be getting students to recognize that the theories might actually be talking past each other due to different granularity in defining "testimonial belief formation."

  *Scratching head*... I need to check if the theories genuinely conflict here. Reductionists require positive reasons for trusting testimony, while anti-reductionists see testimony as prima facie justified. But in Case A (overheard), is it even testimony? Reductionists might classify it as ordinary inference, anti-reductionists as testimony-but-with-extra-evidence. Case B's institutional trust complicates things further. 

  *Lightbulb moment* The key insight isn't about who wins but whether the cases can test the theories at all. Top answers should notice the theories carve up the epistemic terrain differently - reductionists focus on the hearer's validation process, anti-reductionists on the speaker's testimony act. That meta-realization is the A-grade move.

  For the question structure: I'll force isolation of variables (part b), then demand reflection on testability (part c). The model answer must commit - probably concluding no clean diagnostic case exists due to differing individuation criteria. Marking scheme will heavily weight that final meta-move.

  *Double-checking constraints*: No citations, names, or bibliography. Cases must stay structurally intact. Model answer can't waffle - has to take a stand on testability. Word counts strict: 700 for answer, 40 min time allocation.

  *Worries*: Might some students brute-force the "theories differ" analysis without seeing the verbal dispute angle? Need part c to be sharply worded: "genuinely diagnostic" and "partly verbal" are red flags for that. Also ensuring Cases A/B are symmetrical enough to expose the confound but different enough to provoke thought. Pharmacist/journalist contexts seem suitably parallel.

  *Final polish*: Adding "rigorous checking routine" in Case B to stress institutional mediation - that'll trip up students who oversimplify anti-reductionism as blanket trust. And in the model answer, explicitly discussing how each theory would redescribe the other's "core" case to show the conceptual slippage.
answer: |-
  ### Brainstorming (10 lines)
  Reductionism demands positive reasons to trust testimony; anti-reductionism treats testimony as prima facie justified. Case A (overheard) challenges anti-reductionism: if testimony requires an *act of telling*, Nadia isn't testifying to Tomas. Reductionists might classify this as ordinary inductive inference. Case B (official briefing) challenges reductionism: Dev’s "independent verification" relies on circular institutional testimony. Anti-reductionists might see the institutional context as reinforcing default justification, while reductionists protest the lack of non-testimonial evidence. Crucially, **prediction conflicts are obscured**: both views can claim victory in both cases by re-describing the belief-forming process. The core issue is whether testimony is a *sui generis* epistemic kind or reducible. If they individuate processes differently (e.g., "addressed testimony" vs. "overheard utterance"), the debate becomes verbal. The question must force this meta-epistemic realization.

  ---

  ### Exam Question (275 words)
  **Question 3: Testimonial Justification in Ambiguous Contexts**  
  *(Spend approx. 40 minutes. Write ~700 words.)*  

  Consider two scenarios:  
  > **Case A.** Nadia, a hospital pharmacist, is overheard by her assistant Tomas correcting a drug dose via phone dictation. Tomas has verified her past accuracy independently. Nadia is unaware he’s listening.  
  > **Case B.** Dev, a journalist, believes a claim from Priya’s official briefing. Dev verified three past claims but relies *only* on testimony from insiders to trust Priya’s office.  

  Address the following:  
  **(a)** Briefly state what *reductionism* and *anti-reductionism* imply about when testimony provides justification.  
  **(b)** For *each case*, explain whether reductionism and anti-reductionism would deem the belief justified. Highlight where predictions might *overlap or conflict*.  
  **(c)** Both cases differ in: (i) whether the speaker *addresses* the hearer, and (ii) how much *non-testimonial evidence* supports reliability. Suppose we want a *diagnostic case* isolating one factor. Explain why this is difficult using examples from (b).  
  **(d)** Conclude: does this show the reductionism/anti-reductionism debate is partly verbal? Defend your view by analysing how *each theory individuates testimonial belief-formation*.  

  ---

  ### Model Answer (690 words)  
  **(a)** Reductionism holds that testimony provides justification only if the hearer has non-testimonial evidence for the speaker’s reliability. Anti-reductionism holds that testimony is inherently defeasibly justified without such evidence, akin to perception.  

  **(b)**  
  **Case A (Nadia/Tomas):**  
  - *Reductionism*: Likely justified. Tomas has extensive non-testimonial evidence (verified lab checks). Nadia’s utterance functions as data in his inductive inference.  
  - *Anti-reductionism*: Unclear. If testimony requires an *act of telling*, Nadia isn’t testifying *to Tomas*; this might not count as testimonial belief. If it does, anti-reductionism would deem it justified, but the lack of addressing weakens this.  
  *Conflict?* Reductionism clearly endorses justification. Anti-reductionism may deny this is testimony at all.  

  **Case B (Priya/Dev):**  
  - *Reductionism*: Unjustified. Dev’s evidence for Priya’s reliability relies *solely* on insider testimony—no non-testimonial support.  
  - *Anti-reductionism*: Justified. Priya’s institutional role provides default credibility. Dev’s limited checks add support but aren’t required.  
  *Conflict?* Anti-reductionism affirms justification; reductionism denies it.  

  **(c)** Creating a diagnostic case is problematic because the two factors (addressing/non-testimonial evidence) are entangled, and theories interpret "testimony" differently.  
  - *Holding (i) fixed (addressing)*: Suppose Tomas is addressed directly. Reductionism still demands non-testimonial evidence; anti-reductionism doesn’t. But anti-reductionism might treat institutional addressing (Case B) differently from personal addressing.  
  - *Holding (ii) fixed (non-testimonial evidence)*: Suppose Dev has non-testimonial evidence like Tomas. Both views deem Case B justified—no conflict. Yet reductionists see this as reducing testimony to induction; anti-reductionists see it as reinforcing default justification.  
  The theories disagree most in *low-evidence* scenarios (e.g., Case B), but anti-reductionism’s scope depends on how "testimony" is defined (e.g., does Case A qualify?). This definitional variance obstructs isolation.  

  **(d)** The debate is partly verbal because the theories individuate testimonial belief-formation at different granularities.  
  - Reductionists treat testimony as a *belief-dependent process*: any reliance on others’ words requires non-testimonial validation. Case A is "testimonial" only nominally; it’s really inductive inference.  
  - Anti-reductionists treat testimony as a *distinct epistemic source*: social acts of asserting generate justification. Case A may not qualify, but Case B’s institutional context exemplifies "paradigm" testimony.  
  Thus, apparent disagreements stem from categorising cases differently. Reductionists view anti-reductionism as ignoring validation; anti-reductionists view reductionism as overlooking testimony’s unique social structure. A truly diagnostic case would require both theories to agree on what constitutes "pure testimony"—but they don’t. The conflict isn’t resolvable by cases alone; it requires clarifying the *concept* of testimony.  

  ---

  ### Marking Scheme (25 points)
  1. **Accurate theory summaries (4 pts)**:  
     - Reductionism: Justification requires non-testimonial reliability evidence.  
     - Anti-reductionism: Testimony is prima facie justified.  
     *Common botch: Conflating justification with knowledge or ignoring defeasibility.*  

  2. **Case predictions with overlap/conflict analysis (7 pts)**:  
     - Case A: Reductionism = justified; anti-reductionism = ambiguous (addressing issue).  
     - Case B: Reductionism = unjustified; anti-reductionism = justified.  
     - Conflict noted in B; overlap/ambiguity in A.  
     *Common botch: Missing that anti-reductionism may exclude Case A as non-testimony.*  

  3. **Diagnostic difficulty due to factor entanglement (6 pts)**:  
     - Explains failure to isolate (i) or (ii) using Case A/B adjustments.  
     - Notes theory-dependent definitions (e.g., "addressing" matters more for anti-reductionism).  
     *Common botch: Treating factors as independent or not using case specifics.*  

  4. **Verdict on verbal debate (5 pts)**:  
     - Reductionism individuates by *hearer’s validation process*; anti-reductionism by *speaker’s act*.  
     - Concludes no neutral diagnostic case possible due to conceptual divergence.  
     *Common botch: Asserting theories are compatible without analysing individuation.*  

  5. **Clarity & structure (3 pts)**:  
     - Logical flow, concision, no irrelevance.  
     *Common botch: Meandering or ignoring part (d).*  

  ---

  ### A vs. B Answer Differentiation  
  An **A answer** identifies that anti-reductionism may *exclude* Case A as non-testimony (b), demonstrates why factor isolation fails *because* theories define testimony divergently (c), and argues in (d) that this definitional rift makes the debate partly verbal—not merely "both have points." It ties individuation differences to the impossibility of a neutral test case. A **B answer** accurately analyses cases (b) and factors (c) but misses the meta-epistemic move in (d): it may call the debate "unresolved" without diagnosing *why*, or conflate verbal disagreement with stalemate. Crucially, B answers often force conflict in Case A by ignoring addressing, treating theories as disagreeing everywhere.
