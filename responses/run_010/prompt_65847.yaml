  We are given Lewis Carroll's dialogue, where the Tortoise refuses to draw the conclusion from premises and a conditional, demanding that each new conditional be added as a premise. Achilles adds each conditional as a premise, but the Tortoise still demands another conditional for the new set.

  In proof-theoretic terms:

  - The context (Γ) holds the premises and the conditionals that have been added.
  - The system (the Tortoise) is expected to derive a conclusion (q) from the context.
  - The inference rule in question is modus ponens: from A and A → B, derive B.

  But the Tortoise does not apply the rule. Instead, he demands that the rule itself (or a version of it) be added as a premise.

  Let us formalize the initial state:

  - Premise 1: p
  - Premise 2: p → q

  The Tortoise does not derive q. Achilles then adds:

  - Premise 3: (p ∧ (p → q)) → q

  But the Tortoise still does not derive q. He now demands:

  - Premise 4: (p ∧ (p → q) ∧ ((p ∧ (p → q)) → q)) → q

  and so on.

  In proof theory:

  - The context Γ0 = { p, p → q }.
  - We wish to derive Γ0 ⊢ q.

  The Tortoise does not have the rule modus ponens (MP) as a primitive rule. Instead, he treats the rule as a proposition that can be added to the context.

  But note: even if we add the proposition (p ∧ (p → q)) → q, which is the propositional form of the rule for this specific case, we still cannot derive q without applying modus ponens again.

  So at step n, the context Γn = { p, p → q, (p ∧ (p → q)) → q, ... } (with n conditionals). But without the rule modus ponens, the system cannot use these conditionals to derive q.

  Achilles keeps adding a new proposition at each step: the n-th conditional is a proposition that states that if all the previous premises (including the conditionals added so far) hold, then q. But without the rule modus ponens, which is a rule of inference, the system cannot move from having A and A→B to having B.

  In proof theory, we distinguish:

  - Derivability: We say that a judgment is derivable in a system if there is a proof tree built from the inference rules that ends with that judgment.
  - Admissibility: A rule is admissible in a system if, whenever the premises of the rule are derivable, then the conclusion is also derivable.

  In the standard system, modus ponens is a primitive rule (so it's not just admissible but actually part of the definition of derivability). The Tortoise is not using that rule.

  The problem is that the Tortoise is treating the rule as a proposition (a member of the context) rather than as a rule. So the system does not have the rule modus ponens. Therefore, even though the context contains all the necessary propositions, the system does not have the rule that would allow it to combine them.

