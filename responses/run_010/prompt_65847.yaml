        "fidelity": "clean",
        "loss": "",
        "residue_locus": "confusion_in_source_debate"
      },
      {
        "claim": "The regress shows inference cannot be reduced to premises alone.",
        "translation": "The regress demonstrates that adding infinitely many premises (φ₁, φ₂, ...) to Γ cannot compensate for the absence of MP in the inference system. Rules are irreducible to context extensions.",
        "fidelity": "clean",
        "loss": "",
        "residue_locus": "confusion_in_source_debate"
      },
      {
        "claim": "The Tortoise 'accepts' the rule but fails to apply it.",
        "translation": "The Tortoise stores the propositional encoding of MP in Γ but lacks MP as an inference rule, so the operational semantics never apply it.",
        "fidelity": "distorted",
        "loss": "Philosophers' 'acceptance' ambiguously merges adding a premise (static) with internalizing a rule (dynamic). Proof theory forces separation: storing p → q in Γ ≠ having MP as a rule.",
        "residue_locus": "confusion_in_source_debate"
      },
      {
        "claim": "The problem is the 'necessity' of rule-following: why must one apply the rule?",
        "translation": "No counterpart. Proof systems define rule application as automatic: if premises are derivable and a rule is primitive/admissible, the conclusion is emitted by operational semantics.",
        "fidelity": "no_counterpart",
        "loss": "Proof theory describes rule application mechanistically (e.g., 'when Γ ⊢ A and Γ ⊢ A → B, emit Γ ⊢ B'). It cannot express normative 'ought' or psychological 'compulsion'.",
        "residue_locus": "gap_in_target_vocabulary"
      }
    ],
    "overall_verdict": "The residue belongs to a gap in the proof-theoretic vocabulary, which operationalizes rule application but cannot interrogate why a system 'should' follow its rules. However, the Tortoise's core demand—about deriving q from {p, p → q}—is fully addressable within proof theory. The unanswerable 'ought' questions arise from importing external normative concerns, not from inference itself."
  }
  ```

  ### Explanation of Residue Locus Assignments
  - **Clean translations (items 1–2)**: Directly map to the derivability/admissibility distinction and rule-vs-premise separation. The "confusion_in_source_debate" locus indicates these claims are resolved by proof theory.
  - **Distorted translation (item 3)**: Philosophers' "acceptance" conflates context membership with rule availability, causing ambiguity. The distortion reveals confusion in the source debate.
  - **No counterpart (item 4)**: The normative "must" has no analogue. Proof theory describes rule application as automatic; "obligation" is a foreign concept, exposing a vocabulary gap.

  ### Overall Verdict Defense
  Proof theory cleanly resolves the Tortoise's *inferential* failure: the system lacks MP as a primitive or admissible rule, and adding premises cannot substitute for this. The residue—questions about why a system "must" apply rules—stems from a gap in proof theory's vocabulary, which mechanizes rule-following but cannot justify it normatively. This gap, however, reflects a philosophical addendum; the dialogue's core puzzle is about inference, and here, proof theory suffices. The Tortoise's regress is thus a technical error (confusing rules with premises), not a deep mystery about rule-following.
