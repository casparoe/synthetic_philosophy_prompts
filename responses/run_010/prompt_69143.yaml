prompt: |-
  I've been keeping a list of when I think a belief counts as good and when it doesn't, and I've noticed I can't actually state the rule I'm using. Maybe you can find it for me. Here's the list, no particular order.

  1. My uncle said a stock was going up because of a dream he had, put money on it, and it went up. Even though he was right, I don't think his belief was any good. Being true doesn't seem to be enough.

  2. But then: two people both think it'll rain tomorrow. One is like 60% sure, one is 95% sure. It rains. I definitely think the 95% one did better. And if it hadn't rained, the 95% one did way worse, and that feels right too — confidently wrong is worse than sort of wrong, confidently right is better than sort of right. So there I'm grading beliefs purely on how they turn out, which is exactly what I refused to do in #1. I don't know how to hold both.

  3. My cousin gets her politics from sketchy internet stuff and she called the last election right. Same as the uncle, I want to say her belief is bad. But alot of my own beliefs are things I soaked up from my parents and my town and never once checked, and plenty of them are true. I want to say mine are fine and hers aren't, and I honestly can't see the difference. If your rule puts us in the same boat, tell me.

  4. It's true that 2+2=4 and it's true that my sister's second marriage is going to fail. Both are true beliefs of mine. The second one feels worth more — not because it matters to my life more exactly, more like there was less going for it beforehand. It was harder to land.

  5. If someone has no opinion at all about something, never heard of it, I don't think they've done anything wrong, but I also don't think they've scored anything. Blank isn't good or bad.

  6. Someone who suspends judgement on literally everything can never be wrong. I'm sure that's not the best you can do. But I can't say what my pile of mostly-true-beliefs-and-some-false-ones has that theirs is missing, besides "more true stuff" — and if avoiding error is the point, theirs wins outright. I refuse to accept that and I don't know why.

  7. My neighbor believes his diet works and also believes it doesn't work. One of those has to be false, fine. But holding a contradiction feels worse to me than just holding two seperate ordinary false beliefs — worse than thinking it's Tuesday when it's Wednesday and also thinking your car's a Toyota when it's a Honda. Can't explain why.

  8. A guy has four thousand true beliefs about baseball box scores and basically nothing else. I have maybe two hundred true beliefs spread over everything. I don't think he's better off than me. But I also think if you handed me one extra true belief for free I'd be better off. Those two are fighting each other.

  9. My doctor was 90% sure a treatment would work and it didn't. I don't think she did anything wrong. So maybe in some of these I'm not grading the belief at all, I'm grading the person, and then #2 is about something completely different than #1 and #9. That might be the confusion underneath everything but I can't get it into focus.

  My own guess at the rule, for what it's worth, is something like: a belief is good if it's true and you'd still have gotten it right if things had gone a bit differently. But I think that trips on #5 and #8 and I'm not sure it does anything for #7.

  So — is there one principle behind all this, or a couple of competing ones that I'm switching between without noticing? State it as precisely as you can, precise enough that I could apply it to a new case myself without asking you. Then pick a case or two I didn't think of that would stress it and tell me what your principle says about them. And be straight about which of my verdicts it can't keep: if some have to go, say which ones and why, instead of bending the rule until everything fits. Plain language please. If these ideas have proper names, drop the names at the very end, but I don't want a list of stuff to go read.
reasoning: |-
  Okay, let me try to unpack what the user is struggling with here. They’ve listed nine scenarios where they judge beliefs as "good" or "bad," but they can’t pinpoint the underlying rule. The examples are messy and sometimes contradictory—like valuing accuracy in weather beliefs (#2) but dismissing true beliefs from dreams or sketchy sources (#1, #3). 

  First, I notice the user’s frustration: they’re self-aware enough to spot inconsistencies but can’t resolve them. For instance, they admit their own unchallenged beliefs (#3) seem identical to their cousin’s sketchy ones—yet they instinctively judge theirs as "fine." That’s guilt or cognitive dissonance peeking through. They want validation that their beliefs *are* better, but they also crave intellectual honesty. 

  Then there’s the tension between truth and methodology. #1 and #9 show beliefs can be true/false independently of how they’re formed. The doctor’s failed diagnosis (#9) isn’t blamed, but the uncle’s lucky stock dream (#1) is dismissed—even though both outcomes were wrong. So the user clearly cares about *how* beliefs are formed, not just results. 

  #5 and #6 hint at a deeper anxiety: is avoiding error enough? Suspending judgment entirely avoids falsehoods but feels "cowardly." The user values *engagement*—holding beliefs boldly enough to risk being wrong. That’s almost existential: beliefs as active participation in truth-seeking. 

  #7 is fascinating. Contradictions feel "worse" than isolated false beliefs. Why? Probably because contradictions sabotage the *entire system*—you can’t reason reliably if your foundations clash. It’s a structural flaw. 

  #8 reveals that beliefs aren’t just about quantity. Four thousand baseball stats feel "less valuable" than diverse beliefs. The user implicitly prizes *understanding*—beliefs that interconnect meaningfully. 

  Putting it all together, the user isn’t evaluating beliefs in isolation. They’re grading:  
  - **Responsiveness to evidence** (#1, #2, #9)  
  - **Coherence** (#7)  
  - **Epistemic agency**—effort to vet sources (#3 vs. their upbringing)  
  - **Cognitive utility**—beliefs that enrich understanding (#8)  

  The core conflict? They toggle between "truth matters" and "process matters." My solution: separate belief *quality* (epistemic diligence) from *outcomes* (truth/falsity). That resolves #1 (lucky guess) vs. #2 (calibrated confidence). For #3, their upbringing gets a pass if they’d adjust given counterevidence; the cousin’s sources likely wouldn’t.  

  #4’s "harder to land" belief? That’s about *discriminative power*—beliefs that could’ve easily been false but weren’t. #5 and #6: blank slates aren’t "good," they’re neutral. Avoiding all error is barren if it means no truth-seeking courage.  

  Cases where my rule might clash:  
  - **#3’s cousin**: If her sketchy sources coincidentally align with reality, her belief *is* poorly formed—even if true. The rule calls it "bad," matching the user’s instinct.  
  - **#9’s doctor**: Her 90% confidence was reasonable given evidence. Outcome doesn’t retroactively poison the belief’s quality.  

  The user might protest: "But shouldn’t true beliefs *always* be valued?" Not if they’re accidental. Beliefs are tools—a broken clock is right twice a day, but you wouldn’t rely on it.
answer: |-
  Based on your judgments, there's a consistent principle at work—but it's not about truth alone. You're evaluating **how well the belief-forming process tracks reality**, not just the outcome. Here's the unified rule, stated precisely:

  **A belief is "good" if it's formed by a process that reliably adjusts to evidence and reasons, such that it would be true in similar circumstances where reality differed slightly. A belief is "bad" if it's formed arbitrarily, ignores counterevidence, resists updating, or makes further understanding harder.**

  This separates *process* from *outcome*. Truth matters, but only as a sign the process worked. Confidence matters as part of the process (e.g., matching evidence strength). Let's test it against your cases:

  ---

  ### **Your Cases Revisited**  
  1. **Uncle's stock dream**: **Bad belief**. Process (dreams) doesn't reliably track stock markets. It worked once by luck.  
  2. **60% vs. 95% confidence on rain**: **95% is "better"** if confidence matches evidence (e.g., weather models). You're rewarding calibration to reality, not just truth.  
  3. **Cousin’s politics vs. your upbringing**: **Both are suspect**, but your rule exposes bias. If you'd update your beliefs with counterevidence but your cousin wouldn't, yours are *less bad*. If neither would update, both are equally bad—even if true.  
  4. **2+2=4 vs. sister’s marriage**: **Marriage belief "worth more"** because it required evidence-sensitive reasoning (process was harder). Math is trivial for anyone who learned arithmetic.  
  5. **No opinion**: **Neutral**. No process exists to evaluate. Blank isn't "good."  
  6. **Suspending judgment on everything**: **Bad epistemic strategy**. Avoids error but gains zero understanding. A "good" belief process seeks truth *despite* error risk.  
  7. **Believing a contradiction**: **Worse than separate false beliefs**. Contradictions sabotage the entire belief-forming process—you can't reason coherently. It’s self-defeating.  
  8. **4,000 baseball stats vs. 200 diverse beliefs**: **Yours are better**. Baseball stats are narrow; they don't build understanding beyond their domain. Diverse beliefs (if properly formed) create a richer model of reality.  
  9. **Doctor’s failed treatment**: **Good belief**. Process (medical training + tests) was sound. Outcome doesn’t retroactively poison the process.

  ---

  ### **Where Your Verdicts Stand**  
  - **All fit** under this rule except #3. Your instinct to protect your upbringing is bias. The rule says: if your beliefs *wouldn’t update* with counterevidence, they’re as bad as your cousin’s. If they would, they’re better.  

  ---

  ### **Stress-Testing the Rule**  
  **New Case 1:** *Someone believes smoking causes cancer because they read it in a meme (no sources). It’s true. Is the belief good?*  
  - **Rule says**: Bad. Process is arbitrary. They’d believe false memes just as easily.  

  **New Case 2:** *A scientist believes Theory X after rigorous experiments. Later, better data proves her wrong.*  
  - **Rule says**: Belief was good when formed. Process was reliable—it just met new evidence. She should now update.  

  ---

  ### **Why This Works**  
  - **#1 vs. #2**: You refused to reward luck (#1) but rewarded calibration (#2). The rule distinguishes: luck ≠ reliability.  
  - **#6**: Avoiding all error isn’t the goal—*understanding* is. Suspending judgment fails at understanding.  
  - **#7**: Contradictions break the process itself. You can’t "track reality" if your beliefs cancel each other.  
  - **#8**: True beliefs are only valuable if they *fit into a system* that maps onto reality. Isolated facts don’t build that.  

  ---

  ### **Plain-Language Summary**  
  > **Beliefs are good when they come from a "truth-tracking machine" in your head—one built with careful thinking, open to new evidence, and designed to model how the world actually works. They’re bad when the machine is broken: lazy, rigid, or self-contradicting. True beliefs can still be bad (if the machine got lucky), and false beliefs can still be good (if the machine did its best).**

  *(Key ideas behind this: "epistemic justification" and "reliabilism.")*
