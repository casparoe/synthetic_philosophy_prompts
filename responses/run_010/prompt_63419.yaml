answer: |-
  ## Sestina for the Sophisticated (Who Know Too Much)

  The work waits, stacked like grey stone. I'll do it **later**,
  When focus sharpens, when the will feels **less**
  Like water. Surely then I'll make the **choice**
  That future-me approves. But present-**self**
  Prefers this flickering screen, the cheap win **now**.
  This scroll costs nothing sharp, no grinding **cost**.

  But knowing future-me will bear the **cost**
  Of this avoidance – pay the bill much **later** –
  Makes this cheap win feel tarnished, even **now**.
  The knowing eye sees value shrink to **less**
  Than ash. The so-called unified **self**
  Is just a chain of badgers. What's the **choice**

  For one who sees the trap? Make the grim **choice**
  Immediately. Taste the bitter **cost**
  Before the dread sets in. The future **self**
  Is just as weak, more tired. Why wait for **later**
  When the work only grows? Why settle for **less**
  Than swift completion? Do it brutal, **now**.

  The chair turns. Facing papers feels like **now**
  Is chewing glass. But wisdom knows the **choice**
  Is suffer small or suffer vastly **less**
  By starting. Knowledge cures delay. The **cost**
  Of *not* starting today? Regret comes **later**,
  A weight for some poor bastard, future-**self**.

  But wait – is that frail creature really **self**?
  Or just a hostage I abandon **now**
  To future struggle? If I act for **later**,
  Is this true strength, or just another **choice**
  Informed by panic? Calculating **cost**
  Makes prudence feel like theft, yielding me **less**

  True joy. This knowing hurry buys me **less**
  Than peace. The work done frantic lacks the **self**-
  Assuredness of patience. Paid the **cost**
  Too soon, the bitter draught gulped down **now**
  Leaves future-me deprived of any **choice**
  But hollow speed. The value shifts to **later**.

  Why **less** resolve each hour? Why must the **cost**
  Of knowing fracture **self**? This frantic **now**
  Denies all **choice**. True strength? It hides **later**.

  ---

  **Pre-Writing Notes (As Requested):**

  1.  **End-Words & Shifts:**
      *   **Later:** Initially temporal distance → Becomes the locus of burden/regret → Morphs into a deceptive promise/escape.
      *   **Less:** Begins as comparative weakness → Becomes active reduction/minimization → Shifts to deprivation/lack (of joy, quality).
      *   **Choice:** Starts as abstract capacity/future decision → Concrete, often grim, immediate action → Ultimately feels like an illusion/denial.
      *   **Self:** Unified entity at first → Fragments into temporal slices (present, future) → Becomes a contested concept, possibly illusory or multiple.
      *   **Now:** Neutral present moment → Urgent, demanding presence → Site of frantic, joyless action → The only tangible reality.
      *   **Cost:** Future consequence → Immediate, tangible sacrifice/pain → The price of *both* action and inaction, paid in different currencies.

  2.  **Speaker & Context:** A self-aware academic (implied), late at night (3 AM), trapped in the "sophisticated" loop. The immediate-cost task is **grading tedious papers** (delayed professional reward, immediate pain). The immediate-reward thing he's done too early is **scrolling news/doomscrolling** (instant, low-value stimulation, enacted precisely *because* he knows he won't want to grade later).

  3.  **Form & Argument:** The permutation forces valuations to shift: "Later" gains oppressive weight; "Choice" becomes a grim imperative; "Now" transforms from neutral to demanding to the site of joyless action. The sixth stanza's order (2-4-6-5-3-1: Less/Self/Cost/Choice/Later/Now) feels jarringly wrong compared to the start (Later/Less/Choice/Self/Now/Cost), embodying the relapse/non-arrival. The envoi pairs them tensely: (Cost/Later) – consequence deferred; (Self/Now) – identity anchored painfully in the present; (Choice/Less) – agency diminished. The final line ("True strength? It hides Later.") leaves the core question unresolved and bleakly cyclical. The "sophisticated" rush (doing the awful grading *now*) is rendered as equally flawed as naive delay.
