  The no-intro/no-conclusion constraint means jumping straight into the list. I'll make sure the VR requirement (#1) is flagged as eliminating most candidates, and show the conflict between #3 and #5 explicitly. This should give the user sharp tools to gut-check theories against their sweat-soaked VR headset data.
answer: |-
  Here are six desiderata for an adequate theory of emotional response to fiction:

  1.  **Requirement:** Must explain robust physiological arousal (e.g., skin conductance, startle reflex) occurring despite full, concurrent cognitive awareness of the fictional nature and safety of the stimulus.  
      **Case:** VR horror experiences where subjects duck, scream, or exhibit autonomic stress responses despite perfect knowledge of physical safety.  
      **Tag:** Non-negotiable. ***(Eliminates most candidates)***

  2.  **Requirement:** Must account for the dissociation between reported subjective experience ("I feel no fear") and measurable physiological/behavioral residue (sweating, sleep disturbance, checking behavior) when stimulus familiarity is high.  
      **Case:** The "twice-through reader" who knows the plot yet shows autonomic stress and behavioral aftereffects despite denying conscious emotional experience during consumption.  
      **Tag:** Non-negotiable. *(Creates tension with Requirement 3)*

  3.  **Requirement:** Must characterize the *phenomenological quality* of the emotional response, distinguishing it from an identical emotion triggered by belief in real danger (e.g., why fictional fear often feels "safe" or "enjoyable" in a way real fear isn't).  
      **Case:** The contrast between the visceral dread felt during a horror game and the paralyzing terror of a real-life threat, even when physiology overlaps.  
      **Tag:** Non-negotiable. *(Tension: Must explain this distinct phenomenology while Requirement 2 demands accepting autonomic responses as part of the emotion)*

  4.  **Requirement:** Must explain the *behavioral asymmetry*: why responses like screaming or ducking occur in VR/film but calling the police typically does not, even when belief-like immersion is high, without relying solely on an absolute "no belief" criterion.  
      **Case:** VR subjects exhibit immediate defensive motor responses but do not attempt to flee the building or seek real-world help.  
      **Tag:** Non-negotiable.

  5.  **Requirement:** Must be consistent with core findings from the psychology of emotion regarding the automaticity of affective appraisals, the role of physiological feedback, and the potential independence of affective/physiological systems from declarative belief systems.  
      **Case:** Evidence that physiological responses can be triggered rapidly by stimuli perceived as threatening *before* full cognitive appraisal is complete, even with countervailing knowledge.  
      **Tag:** Non-negotiable.

  6.  **Requirement:** (Smuggled Demand) Must explain *why we seek out* emotionally negative fictions (paradox of tragedy/horror).  
      **Why it shouldn't be here:** This is a distinct question about motivation and reward systems, not the mechanism or nature of the emotional response itself. Smuggling it in conflates "how is this emotion generated?" with "why is this experience valued?", often leading theories to distort the description of the emotion (e.g., positing "quasi-fear" or "make-believe fear") to fit presumed motivational needs.  
      **Tag:** Should be excluded as a core requirement for explaining the response mechanism.
