  For the desiderata, I'm considering these core issues: The belief/response disconnect (VR case), conscious vs autonomic responses (rereader case), phenomenological distinctiveness of fiction emotions, behavioral asymmetry explanations, emotional residue effects, and consistency with psychological evidence about emotion. The VR case will probably be the theory-killer since it empirically disproves belief-based accounts.

