prompt: |-
  I am an associate editor at a general philosophy journal, and roughly one submission a month argues that evolutionary explanations of our moral intuitions undercut those intuitions — some concluding that realism about one particular domain fails, others that morality as a whole is unjustified. Desk decisions are mine alone, referee goodwill is scarce, and I have about forty minutes per submission, working only from the abstract and the introduction. Write a triage procedure I can actually run in that time: an ordered set of gates, each with the question it puts to the paper, what counts as a pass, and whether a failure licenses a desk reject, a note back to the author, or a send-to-referees. It should convert whatever the epistemology of genealogical arguments really licenses into questions answerable on a first pass — how the target of the debunking is specified and how far the conclusion is permitted to travel beyond it; whether the argument needs a claim about why the belief was selected, or only that selection would have produced it whether or not it was true; what the author owes by way of an account of how a moral belief could have tracked the truth; and whether the premise doing the work is one the author's opponents can accept without abandoning their own view. Mark each gate where judgment cannot be eliminated, and say who or what settles the case if the procedure cannot.

  Then run it on three abstracts. (1) A paper arguing that intuitions about the unfairness of free-riding are explained by reputation management in small-scale groups, and that realism about fairness therefore fails. (2) A paper arguing that because selection would have installed incest-avoidance intuitions whether or not incest were wrong, no moral belief is justified, and moral skepticism follows globally. (3) A paper arguing that nothing in our fitness history explains concern for the welfare of farmed animals, so intuitions in that domain are untouched by the debunking and stand vindicated by the absence of an adaptive story. I have defended something like the third line in print; tell me plainly if your procedure rejects it, and say where it is being unfair if it is. Close with what the procedure cannot decide, and the failure mode you expect it to have most often in practice.
reasoning: |-
  Okay, the user is an associate editor at a philosophy journal dealing with a specific type of submission - papers arguing that evolutionary explanations undermine moral intuitions. They need a triage procedure they can run in 40 minutes using just abstracts and introductions. 

  First, I need to understand their constraints: limited time (40 min per paper), scarce referee resources, and sole decision-making authority. The key is creating efficient gates that filter papers based on common flaws in this genre while being epistemologically sound.

  The core issues in these genealogical debunking arguments seem to be:
  - How precisely the target is defined (is it one intuition or all morality?)
  - The strength of the evolutionary claim (did selection require false beliefs or just produce them?)
  - What truth-tracking account is required (if any)
  - Whether premises are dialectically acceptable to opponents

  I'll design gates that progressively test these aspects. Gate 1 should be a quick check for scope overreach - papers that jump from debunking one intuition to rejecting all moral realism often have fatal flaws. Gate 2 tests the evolutionary mechanism - arguments relying on "would have evolved anyway" are stronger than those needing specific false belief selection. Gate 3 examines whether the paper engages with possible truth-tracking accounts, even minimally. Gate 4 checks dialectical fairness - can opponents accept premises without abandoning their position?

  For the test cases: 
  Paper 1 (free-riding) likely fails at Gate 1 by overreaching from fairness intuitions to all realism. 
  Paper 2 (incest) might pass Gate 1 if carefully scoped but fails at Gate 2 by using the weaker "would have evolved" premise for global skepticism. 
  Paper 3 (farmed animals) should pass all gates as it doesn't overgeneralize and uses absence of explanation constructively.

  I should acknowledge that Gate 3 might unfairly burden papers making negative claims (like Paper 3), but since they're arguing for positive vindication, some minimal truth-tracking suggestion seems reasonable. The most common failure mode will likely be Gate 1 overgeneralizations - which is good because those are often desk-rejectable.

  The procedure can't judge substantive philosophical merit - only screen for obvious flaws. That's intentional given time constraints. When in doubt, I'll recommend sending to referees rather than risking premature rejection.
answer: |-
  Here's a triage procedure tailored to your constraints, focusing on common failure points in evolutionary debunking arguments. It prioritizes *dialectical fairness*, *scope control*, and *minimal premise plausibility*.

  **Triage Procedure: 5 Gates for Evolutionary Debunking Submissions**

  1.  **Gate 1: Scope & Overreach Check**
      *   **Question:** Does the conclusion demonstrably overreach the explanatory target? Specifically, does it claim to debunk significantly *more* than the intuition(s) the proposed evolutionary mechanism directly explains?
      *   **Pass:** The conclusion is tightly scoped to the specific intuition(s) addressed (e.g., "intuitions about fairness in reciprocal cooperation"), *or* it argues carefully for extending the debunking (e.g., to structurally similar intuitions, or via a clear meta-ethical principle linking the mechanism to justification failure). No leap from "this intuition" to "all morality" or "realism simpliciter" without explicit, plausible bridging.
      *   **Failure Consequence:** **Desk Reject (DR)**. Failure indicates a likely fatal flaw in argument structure. (Judgment Needed: If the overreach is subtle or ambiguously phrased, proceed to Gate 2 but flag severity).
      *   *Who Settles Ambiguity:* Editor's judgment (based on clarity of target/conclusion in intro/abstract).

  2.  **Gate 2: Mechanism Plausibility & Truth-Sensitivity Check**
      *   **Question:** Does the evolutionary explanation rely on a *strong* claim (selection *for* the specific *false* belief) or a *weak* claim (selection *would have* produced this belief *regardless* of its truth)? Does the author confuse these?
      *   **Pass:** The argument primarily relies on the *weak* claim ("would have evolved anyway") OR provides a plausible argument why the specific mechanism *required* the *falsity* of the belief (e.g., belief X directly enhanced fitness *because* it was false). Avoids conflating weak/strong claims.
      *   **Failure Consequence:** **DR** if relies *only* on conflated claims or an implausible strong claim without justification. **Send to Referees (SR)** if the argument *requires* the strong claim and attempts justification (even if weak - let referees assess). **Note to Author (NA) Possible** if ambiguity prevents clear judgment (request clarification on mechanism).
      *   *Who Settles Ambiguity:* Editor's judgment (assess mechanism description clarity). Referees needed if strong claim is central and minimally defended.

  3.  **Gate 3: Truth-Tracking Burden Check**
      *   **Question:** Does the author acknowledge the *dialectical burden* regarding truth-tracking? For *debunking* arguments, do they engage with the *possibility* of alternative explanations? For *vindicating* arguments, do they offer a *minimal sketch* of how truth-tracking *could* have occurred?
      *   **Pass (Debunking):** Acknowledges that the opponent (e.g., realist) might propose a truth-tracking story, and either argues why the evolutionary explanation *precludes* it or shows why the specific mechanism makes truth-tracking implausible. More than just asserting "no need for truth".
      *   **Pass (Vindicating):** Offers a *plausible* (even if sketchy) account of how true beliefs *could* have been selected for or tracked truth *despite* fitness pressures (e.g., reliable heuristics, byproducts of reliable faculties, cultural transmission).
      *   **Failure Consequence:** **DR** if completely ignores the burden (e.g., debunker claims victory simply by presenting *any* adaptive story). **SR** if acknowledges burden but defense is weak/unclear (needs referee assessment). **NA Unlikely** (core argumentative duty).
      *   *Who Settles Ambiguity:* Editor's judgment (is there *any* engagement? Is the sketch *minimally* plausible?).

  4.  **Gate 4: Dialectical Premise Check**
      *   **Question:** Is the *core evolutionary premise* (the mechanism description/claim) something that the target opponent (e.g., moral realist) could reasonably accept *without* already abandoning their core position?
      *   **Pass:** The proposed evolutionary mechanism is either (a) well-established/non-controversial in relevant fields (e.g., basic reciprocity mechanisms, kin selection) or (b) argued for persuasively *using premises the opponent likely accepts* (e.g., general evolutionary theory, uncontroversial anthropology).
      *   **Failure Consequence:** **DR** if premise is highly speculative, contested, or relies on assumptions directly antithetical to the opponent's view without independent argument. **SR** if premise is moderately controversial but author provides some argument/support. **NA Possible** only if premise reliance is unclear.
      *   *Who Settles Ambiguity:* Editor's judgment (assess plausibility of premise *independently* of the debunking conclusion; use general knowledge/common consensus in evolutionary psych/anthro).

  5.  **Gate 5: Novelty/Engagement Check (Tie-Breaker)**
      *   **Question:** Does the intro/abstract suggest engagement with key literature (e.g., Joyce, Street, Kahane, Wielenberg, Brosnan, Vavova) or offer a distinct novel angle? (Use only if previous gates are passed or borderline).
      *   **Pass:** Clearly identifies the debate, positions itself relative to major players, or proposes a novel mechanism/target/consequence.
      *   **Failure Consequence:** **SR** if passed Gates 1-4 but seems derivative. **DR** only if *egregiously* ignorant of core literature *and* Gates 1-4 passage is borderline. **NA Unlikely**.
      *   *Who Settles Ambiguity:* Editor's judgment (standard lit review assessment).

  **Procedure Summary:** Start at Gate 1. **DR** at any Gate failure unless specified otherwise (SR/NA). Proceed only if Pass or Ambiguous. Aim for Gate 1 & 2 to catch most fatal flaws quickly. Gate 3 & 4 assess dialectical responsibility. Gate 5 is a quality filter.

  ---

  **Running the Procedure on the Abstracts**

  **(1) Free-Riding Fairness:**
  *   **Gate 1 (Scope): FAIL.** Targets "intuitions about unfairness of free-riding" but concludes "realism about fairness therefore fails." This jumps from a specific intuition (free-riding in reciprocity) to the entire domain of fairness (which could include distributive justice, equality of opportunity, etc.). No bridging argument evident. **Consequence: DR.**

  **(2) Incest-Avoidance Global Skepticism:**
  *   **Gate 1 (Scope): FAIL (Severe).** Targets "incest-avoidance intuitions" but concludes "no moral belief is justified, moral skepticism follows globally." Massive overreach without argument for why debunking *this* intuition (with a specific mechanism) debunks *all* moral beliefs (e.g., harm to others, promise-keeping). **Consequence: DR.**

  **(3) Farmed Animal Welfare Vindication:**
  *   **Gate 1 (Scope): PASS.** Target is specific: "concern for the welfare of farmed animals." Conclusion is specific: intuitions in *that domain* are "untouched" and "vindicated."
  *   **Gate 2 (Mechanism): PASS.** Uses the *absence* of a plausible adaptive story as vindicating. Relies on the negative claim (no fitness explanation), not conflating weak/strong claims about truth. (Note: This is a *vindicating* argument using the *absence* of debunking).
  *   **Gate 3 (Truth-Tracking): PASS (Minimally).** As a vindicating argument, it offers a sketch: the absence of an adaptive story implies the intuition *could* be tracking truth (implicitly: perhaps via empathy/sentience recognition not directly shaped by fitness *in this context*). This is a minimal but core part of the argument.
  *   **Gate 4 (Dialectical Premise): PASS.** The core premise (no plausible fitness explanation exists for concern about farmed animals) is something a realist opponent *could* accept (they might argue it *does* exist, but the premise itself isn't inherently anti-realist). The burden is on the author to defend the "no plausible explanation" claim.
  *   **Gate 5 (Novelty): PASS (Likely).** Applying the "absence of explanation" argument to a novel domain (farmed animals) suggests engagement/novelty.
  *   **Overall: Send to Referees (SR).** Passes all gates. Referees will assess the strength of the "no plausible adaptive story" claim and the details of the vindication sketch.

  **Your Paper (Abstract 3):** The procedure **PASSES** it. It doesn't reject it. Gate 3 is the closest call, but it passes minimally because:
      *   It *is* a vindicating argument, so it *must* offer something positive.
      *   The "absence of adaptive story implies possible truth-tracking" *is* the core sketch offered (even if not elaborated in detail). It directly links the lack of a debunking explanation to the positive justificatory status. This meets the minimal burden for passing this gate in a triage context. Referees will assess if this sketch is sufficient or needs more detail.

  **Where the Procedure Cannot Decide:**
  1.  **Substantive Philosophical Merit:** Does the argument *actually work*? Does the author successfully defend the *strength* of their evolutionary claims (Gate 2/4) or their truth-tracking sketch (Gate 3)? Does the bridging argument for scope (if needed in Gate 1) hold water? **Settled by:** Referees.
  2.  **Depth of Literature Engagement:** Beyond mere name-dropping (Gate 5), is the engagement rigorous? **Settled by:** Referees.
  3.  **Ambiguous Phrasing in Intro/Abstract:** When it's unclear *exactly* what the target or conclusion is (Gates 1/2/3) or what mechanism is claimed (Gate 2/4). **Settled by:** Editor's best judgment (leaning towards SR if otherwise plausible) or **Note to Author** only if a *minor, resolvable* ambiguity blocks triage (e.g., "Do you mean *all* fairness or just reciprocity?").

  **Most Common Expected Failure Mode in Practice:** **Gate 1 (Scope Overreach).** The jump from "this specific intuition is debunked" to "therefore realism about this domain fails" or "therefore morality is bunk" is extremely common and often made without sufficient argument. This gate is fast to check and catches a high percentage of fatally flawed submissions early. **Gate 3 (Truth-Tracking Burden)** failures (ignoring the burden entirely) are also common, especially in debunking papers.

  This procedure prioritizes efficiency and catching clear, common flaws. It conservatively sends papers with plausible structure (even if the editor doubts the substantive claims) to referees, reserving desk rejects for papers with identifiable fatal structural or dialectical errors evident in the intro/abstract.
