prompt: |-
  So my intro-to-philosophy-of-India prof handed out a half-page gloss on Nyāya epistemology right before our seminar on the pramāṇas, and I've volunteered to turn it into a study sheet for the class wiki. I've done the readings but I don't trust my own recall of the school-vs-school details, and I really don't want to copy something wrong into a thing that forty people will study from. Here's the gloss, close to word for word:

  > "Indian philosophy doesn't frame knowledge the way we do; the nearest equivalent is the theory of the pramanas, the instruments of knowledge. Nyāya is the generous school here. It accepts four — perception, inference, comparison, and the word of a reliable speaker — where the Buddhists accept only the first two and the materialists only perception. Perception is the load-bearing one: a cognition produced by contact between a sense faculty and its object, non-erroneous and not yet put into words. Because the whole system is built on that contact, Nyāya is at bottom an empiricism — even testimony only counts as knowledge because you can eventually check the speaker against what you perceive. Comparison is the odd one on the list: it's what happens when someone tells you a gavaya is like a cow and you then spot one in the forest and think 'that's the thing I was told about.' Nyāya commentators mostly treat it as a variety of inference in any case, and they keep it on the list chiefly to pad their count against the Mīmāṃsakas. Inference is a five-step argument — thesis, reason, example, application, conclusion — which is Aristotle's syllogism with two extra steps bolted on for the slow students. The upshot is that Nyāya invented reliabilism two thousand years early: a cognition is knowledge just in case it comes out of a reliable process."

  Can you audit this for me? Specifically:

  1. Go through it claim by claim and tell me which parts a Nyāya defender — ideally someone from the later "new logic" tradition rather than the founding sūtras — would nod at, which are simplifications that don't do any harm, and which are just wrong.
  2. Where something is wrong, I'd like to know who actually holds the view the gloss is describing, if it's a real position someone has. A couple of these feel like they're attributing an opponent's line to Nyāya itself, and I can't tell which.
  3. Is the five-step argument really Aristotle-plus-filler, or is there a structural reason Nyāya wanted those members? I care because the gloss's dismissiveness is the bit I'd most regret copying.
  4. The reliabilism line is the one I actually want to reuse in my own writeup. Is it safe? Where does the analogy hold and where does it break, especially given that Nyāya is happy to infer things nobody could ever perceive?
  5. My own addition, tell me if it's dumb: I was going to add a row mapping the four onto contemporary sources of justification — perception to perceptual experience, inference to a priori reasoning, comparison to reasoning by analogy, and the reliable-speaker one to testimony. Does that mapping survive, or is one of the four a bad fit?

  Please give me the audit as a table with exactly these columns: `id` (just 1, 2, 3...), `claim` (the professor's claim compressed to ten words or less), `verdict` (one of: accurate / harmless-simplification / misleading / false), `what_nyaya_actually_says` (a sentence or two), `who_says_it_instead` (the school or tradition that does hold the glossed view, or "n/a" if the claim is fine). One row per distinct claim, and split the gloss finely — I'd rather have fourteen rows than six mushy ones.

  Then underneath the table, a JSON object with exactly these fields: `overall_trust` (a number 0-1 for how much of the gloss is safe to copy into the wiki as-is), `worst_error` (the id of the single row that would mislead a student most), `reliabilism_verdict` (one of "reuse-as-is" / "reuse-with-caveat" / "drop-it"), `mapping_fit` (a list of the four pramāṇas that the contemporary mapping works for, empty if none), and `one_line_fix` (the single sentence I should replace the gloss's last two sentences with).
reasoning: |-
  We are given a gloss on Nyāya epistemology and asked to audit it claim by claim. The gloss contains several distinct claims. Let's break it down into distinct claims and analyze each.

  1. **Claim**: "Indian philosophy doesn't frame knowledge the way we do; the nearest equivalent is the theory of the pramanas, the instruments of knowledge."
     - Verdict: This is a harmless simplification. It is generally true that Indian philosophy uses the concept of pramāṇa (instruments of knowledge) as central to epistemology, and this is different from some Western approaches. However, it's a broad statement and might not capture all nuances.

  2. **Claim**: "Nyāya is the generous school here. It accepts four — perception, inference, comparison, and the word of a reliable speaker"
     - Verdict: Accurate. Nyāya does accept four pramāṇas: pratyakṣa (perception), anumāna (inference), upamāna (comparison), and śabda (verbal testimony).

  3. **Claim**: "where the Buddhists accept only the first two and the materialists only perception."
     - Verdict: Accurate. Buddhists typically accept perception and inference, but not comparison and testimony as independent pramāṇas. The materialists (Cārvāka) accept only perception.

  4. **Claim**: "Perception is the load-bearing one: a cognition produced by contact between a sense faculty and its object, non-erroneous and not yet put into words."
     - Verdict: Accurate. This is a standard Nyāya definition of perception (pratyakṣa) as found in the Nyāya-sūtra (1.1.4): "indriyārthasannikarṣotpannaṃ jñānam avyapadeśyam avyabhicāri vyavasāyātmakaṃ pratyakṣam" (Perception is a cognition which arises from the contact of a sense organ with an object, which is non-verbal, non-erroneous, and well-defined).

  5. **Claim**: "Because the whole system is built on that contact, Nyāya is at bottom an empiricism"
     - Verdict: Harmless-simplification. Nyāya does emphasize perception as foundational, but it also accepts other pramāṇas. However, it is often characterized as empiricist because even testimony and inference are grounded in perception.

  6. **Claim**: "even testimony only counts as knowledge because you can eventually check the speaker against what you perceive."
     - Verdict: Misleading. While Nyāya does hold that testimony is reliable because the speaker is reliable and the knowledge can be verified (at least in principle) by perception, it is not that every instance of testimony must be immediately verified. Testimony is a distinct pramāṇa and can give knowledge without direct verification if the speaker is reliable. However, the ultimate foundation of all knowledge is perception.

  7. **Claim**: "Comparison is the odd one on the list: it's what happens when someone tells you a gavaya is like a cow and you then spot one in the forest and think 'that's the thing I was told about.'"
     - Verdict: Accurate. This is the classic example of upamāna (comparison) in Nyāya. It is the process of knowing the relation between a word and its referent by comparing with a known object.

  8. **Claim**: "Nyāya commentators mostly treat it as a variety of inference in any case"
     - Verdict: Misleading. While some other schools (like Advaita Vedanta) might reduce upamāna to inference, Nyāya maintains it as a separate pramāṇa. However, there might be discussions within Nyāya about its independence, but the school officially accepts it as distinct.

  9. **Claim**: "and they keep it on the list chiefly to pad their count against the Mīmāṃsakas."
     - Verdict: False. Nyāya does not keep upamāna just to have a higher count. They have philosophical reasons for its independence. Mīmāṃsā also accepts upamāna as a separate pramāṇa, so there is no rivalry in count with Mīmāṃsā on this point (both accept six pramāṇas: Mīmāṃsā adds arthāpatti and anupalabdhi). The rivalry in pramāṇa count is more with Buddhists and others who accept fewer.

  10. **Claim**: "Inference is a five-step argument — thesis, reason, example, application, conclusion"
      - Verdict: Accurate. This is the classical Nyāya five-step syllogism (pañcāvayava): pratijñā (thesis), hetu (reason), udāharaṇa (example), upanaya (application), nigamana (conclusion).

  11. **Claim**: "which is Aristotle's syllogism with two extra steps bolted on for the slow students."
      - Verdict: False and dismissive. The five-step format is designed for pedagogical clarity and to make the reasoning explicit, especially in a debate context. It is not merely for slow students. The steps serve to establish the universal relation and apply it to the specific case. Aristotle's syllogism is a three-step form (major premise, minor premise, conclusion) which is more abstract and does not explicitly include the example and application steps.

  12. **Claim**: "The upshot is that Nyāya invented reliabilism two thousand years early: a cognition is knowledge just in case it comes out of a reliable process."
      - Verdict: Harmless-simplification? But we need to be cautious. Reliabilism in contemporary epistemology holds that a belief is justified if it is produced by a reliable process. Nyāya defines knowledge (pramā) as a true cognition (yathārtha) that is produced by a valid pramāṇa. This is similar to reliabilism in that the pramāṇas are reliable processes. However, Nyāya also has an account of error and conditions for the pramāṇas to be valid. The analogy holds in that the pramāṇas are reliable sources, but it breaks in that Nyāya is more of a causal theory of knowledge and has a realist ontology.

  Now, for the additional questions:

  - **Overall Trust**: How much of the gloss is safe? We have 12 claims. Let's count:
    - Accurate: 5 (claims 2,3,4,7,10)
    - Harmless-simplification: 3 (claims 1,5,12) [if we accept the reliabilism as a simplification]
    - Misleading: 2 (claims 6,8)
    - False: 2 (claims 9,11)

    But note: the reliabilism claim (12) might be more than a harmless simplification? Let me reconsider: 
    The gloss says: "a cognition is knowledge just in case it comes out of a reliable process." In Nyāya, a cognition is knowledge if it is produced by a pramāṇa and is true. The pramāṇas are defined as the reliable means. So it is a form of reliabilism. But note that Nyāya also requires that the cognition must be true (yathārtha) and not just produced by a reliable process. The process must be non-deviant. So it is a form of reliabilism that also requires truth. This is similar to some versions of reliabilism (e.g., process reliabilism) that require the process to be truth-conducive. So I think it's a fair analogy.

    However, the claim that Nyāya "invented reliabilism two thousand years early" is a bit of an overstatement and anachronistic, but as a heuristic, it's acceptable.

    So overall, 5 accurate, 3 harmless, 4 problematic (2 misleading, 2 false). We can compute a trust score: (5+3)/12 = 8/12 ≈ 0.67. But note, even the harmless ones are acceptable. So let's say 8/12 (accurate and harmless) are safe. But the misleading and false ones are not. So overall trust: 8/12 ≈ 0.67.

    Alternatively, we might be more strict and not count the reliabilism as harmless? But I think it's acceptable. So I'll go with 0.67.

  - **Worst Error**: The claim that is most misleading? Claim 9 is false and misrepresents Nyāya's motivation for upamāna. Claim 11 is false and dismissive of the five-step argument. But claim 9 is particularly bad because it attributes an uncharitable motive to Nyāya. So I'll pick claim 9.

  - **Reliabilism Verdict**: The analogy is fair, but it should be noted that Nyāya's reliabilism is embedded in a causal theory and requires truth. Also, it is not exactly the same as contemporary reliabilism, which is often about justification without requiring truth. But in Nyāya, knowledge is factive. So it is more like a reliabilist theory of knowledge (rather than justification). So I'd say "reuse-with-caveat".

  - **Mapping Fit**: The student's proposed mapping:
    - Perception to perceptual experience: fits.
    - Inference to a priori reasoning: does not fit. Inference in Nyāya is based on perception and is not a priori. It is empirical and based on the observation of invariable concomitance (vyāpti). So it is more like empirical reasoning.
    - Comparison to reasoning by analogy: fits, but note that upamāna is about learning the meaning of a word by comparing with a known object, not general analogical reasoning.
    - Testimony to testimony: fits.

    So the mapping for inference does not fit. The others are acceptable. Therefore, the list of pramāṇas that the mapping works for: perception, comparison, testimony. Inference does not.

  - **One Line Fix**: Replace the last two sentences (about the five-step argument and reliabilism) with a more accurate and less dismissive statement.

    Proposed: "Inference is a five-step argument (thesis, reason, example, application, conclusion) designed to establish universal relations and their application, distinct from Aristotle's syllogism. Nyāya's epistemology is reliabilist: knowledge arises only from reliable sources (pramāṇas)."

  Now, let's build the table with the claims split finely. We have 12 claims.

