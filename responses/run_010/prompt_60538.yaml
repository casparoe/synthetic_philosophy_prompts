  ## MINUTES OF THE GENERAL MEETING OF THE GABLES RESIDENTIAL ASSOCIATION
  **Date:** Thursday, 17th October 2023  
  **Time:** 7:00 PM  
  **Venue:** Little Gaddesden Village Hall (Committee Room)  
  **Refreshments:** Tea and Digestive Biscuits (supplied by Mrs. Thistlethwaite)

  **PRESENT:**  
  Ms. E. Prendergast (Chair), Mr. A. Finch (Secretary), Mr. B. Croft (Treasurer), Mrs. P. Thistlethwaite, Mr. D. Vance, Mr. T. Reese, Ms. G. Harlow, Dr. L. Khan.

  **APOLOGIES:**  
  Mr. R. Ellis (visiting sister in Skegness)

  **1. MINUTES OF LAST MEETING (12th September 2023)**  
  The minutes were approved as an accurate record. (Proposed: Mrs. Thistlethwaite, Seconded: Mr. Croft. Carried unanimously).

  **2. MATTERS ARISING**  
  *2.1 Repainting of Clubhouse Exterior:*  
  Mrs. Thistlethwaite stated she was "entirely committed to us undertaking the repainting project together." Mr. Vance immediately echoed, "Absolutely, entirely on board, fully committed to us getting this done." The Secretary noted apparent unanimity. However, Mrs. Thistlethwaite clarified she had already procured twelve gallons of "Restful Sage" paint, suitable for the task. Mr. Vance then declared he would "withdraw entirely" if the colour was not "Cream Linen," citing its superior light-reflective properties.  
  *Chair’s Ruling:* The Chair observed the issue was not disagreement over paint per se, but a failure of "preparatory actions undertaken unilaterally" to align. The remedy was not a vote, but "immediate reconciliation of preparatory actions" between Mrs. Thistlethwaite and Mr. Vance before the project could proceed. The matter was referred back to them for "mutual adjustment." (Standing Order 7(c): Reconciliation of Preparatory Actions invoked).

  *2.2 Point of Order (Mr. Reese):* Mr. Reese stated that as he was "fully committed in his own mind" to the repainting project, it didn't matter if others were aware of his commitment or even if they participated differently; his personal resolution sufficed for him to be "party to the association's plan."  
  *Chair’s Response:* The Chair noted Standing Order 3(a) requires "open declaration and mutual awareness" for any association undertaking. Private resolutions were insufficient.  
  *Secretary’s Clarification:* The Secretary added that without common awareness, any plan Mr. Reese believed he was part of might not correspond to the *actual* plan of the association, rendering his actions potentially disruptive. Mr. Reese's point was overruled. (Standing Order 3(a) upheld).

  **3. TREASURER’S REPORT**  
  Mr. Croft presented the accounts (circulated). Balance: £1,247.18. Expenditure primarily on hedge-trimming and biscuits. No questions. Report noted.

  **4. NEW BUSINESS**  
  *4.1 Harvest Barn Dance Proposal:* Ms. Harlow proposed the Association host a Harvest Barn Dance in the Village Hall on Saturday 11th November.  
  *Discussion:* Minimal. Mr. Vance asked if it was mandatory.  
  *Vote:* Motion proposed by Ms. Harlow, seconded by Dr. Khan. Carried unanimously (7 for, 0 against, 1 abstention - Mr. Reese, citing "philosophical reservations").  
  *Minute:* It was noted for the record that subsequent informal polling indicated no individual member personally desired to attend the Barn Dance. The Secretary (Mr. Finch) formally questioned the minute, stating the Association could not sensibly intend an event that no member intended to participate in.  
  *Chair’s Ruling:* The Chair overruled the Secretary’s objection, citing Standing Order 5: "The Association's intentions, once formed by proper procedure, exist independently of the fluctuating personal desires of its members." The Association fully intends to host the Barn Dance. The minute stands as recorded.

  *4.2 Rescission of Personal Commitment (Mr. Vance):* Mr. Vance, having voted for the Barn Dance, moved that he be permitted to withdraw his personal commitment to it, stating he had "changed his mind entirely" and "never really wanted it in the first place."  
  *Chair’s Ruling:* The Chair ruled Mr. Vance out of order immediately. She stated: "The commitment generated by the vote is not a private matter for unilateral dissolution. It binds you *to the other members*. Only the body to whom the commitment is owed – namely, the Association acting through its members – can release you from it. Should you fail to appear at the Barn Dance to fulfil your duties as assigned, you will be liable for a £15 fine for breach of commitment and will owe the Association a formal apology." (Standing Order 8: Dissolution of Mutual Commitment invoked).  
  *Mr. Vance's Query:* "How is this different from a promise? I can be let out of a promise if the person I promised to agrees."  
  *Treasurer’s Reply (Mr. Croft):* "It's entirely different. A promise is between two people. This is a *collective* commitment. You committed to *us as a body*. It’s… bigger. More binding. Like a contract with multiple signatories, only… less paperwork. Standing Order 8 is quite clear." Mr. Vance looked unconvinced but sat down.

  **5. ANY OTHER BUSINESS**  
  *5.1 Fallen Oak on Shared Drive:* Dr. Khan reported a large oak branch blocking the shared access drive at Elm Corner. Two viable clearance methods were identified: Method A (Chainsaw & Haul) or Method B (Winch & Drag). Both require the coordinated effort of at least four members simultaneously. Each method only works if *all* participants use the *same* method. Every member present declared willingness to participate in either method, *provided* all others also participated in the *same* method. No member was willing to commit to a method first or independently. The Secretary proposed the standard procedure: poll members for individual preference (A or B), then hold a vote.
  *Dr. Khan's Suggestion:* Dr. Khan proposed abandoning individual preference polling. "Perhaps," she suggested, "instead of asking what *each of us* wants to do, we should ask what *we, as the Association*, *should* do to clear the drive? What would be best for the group?"  
  *Response:* Mrs. Thistlethwaite: "We have Standing Orders for polling and voting, Doctor. We can't just invent new procedures mid-minutes!" Mr. Reese: "The group 'should' is just a fiction! It’s entirely in our heads!" Mr. Croft: "Standing Orders exist for a reason!"  
  *Chair’s Ruling:* The Chair noted the impasse. The standard procedure of polling individual preferences followed by a vote was acknowledged as potentially unable to resolve the situation, given the interdependence condition. Dr. Khan's suggestion was noted as received, but not adopted. The matter was deferred to the next meeting, pending further investigation into the oak branch's stubbornness. Members were urged to "consider their preparatory actions" regarding suitable footwear. (Standing Order 7(c) implicitly referenced).

  **6. DATE OF NEXT MEETING**  
  Thursday, 16th November 2023, 7:00 PM, Village Hall Committee Room.

  **Meeting closed at 9:07 PM**

  **Signed:**_________________________  
  **Ms. E. Prendergast (Chair)**

  **Copied to:** All Members, Parish Noticeboard, File GRA/2023/MIN/10
