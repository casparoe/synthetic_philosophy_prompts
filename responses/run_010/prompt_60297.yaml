  ### Triage Procedure for Manuscripts Invoking the Hole Argument

  #### Analysis (510 words)
  The hole argument, as reconstructed by Earman and Norton, demonstrates that in a generally covariant theory (e.g., general relativity), given a model \((M, g, \phi)\) satisfying the field equations (where \(M\) is a manifold, \(g\) the metric, and \(\phi\) matter fields), and a diffeomorphism \(\psi: M \to M\) that is the identity outside a compact region (the "hole") but non-trivial inside, the dragged model \((M, \psi^*g, \psi^*\phi)\) is also a solution. Mathematically, this establishes a *non-uniqueness* of solutions: two mathematically distinct models agree outside the hole but differ inside. 

  The core interpretive issue is whether these models represent physically distinct scenarios. Leibniz equivalence resolves this by stipulating that diffeomorphic models represent the same physical situation, as physical observables are diffeomorphism-invariant quantities (e.g., scalar curvature or matter coincidences). The argument becomes philosophically contentious when tied to manifold substantivalism (the view that spacetime points exist independently and have haecceities—primitive identities). The substantivalist who insists on haecceities faces indeterminism: identical initial data outside the hole fail to determine physics inside. Relationalists avoid this by rejecting haecceities and endorsing Leibniz equivalence.

  Live interpretive options include:  
  1. **Haecceitist substantivalism**: Points have identities independent of fields; diffeomorphic models represent distinct physical possibilities.  
  2. **Sophisticated substantivalism**: Points are individuated by the metric field (e.g., via metric relations); diffeomorphic models represent the same physical state.  
  3. **Relationalism**: Only relational observables (e.g., distances between events) are physical; the manifold is derivative.  
  4. **Algebraic structuralism**: Dispense with \(M\); represent spacetime via algebraic invariants of the fields.  

  Common failure modes in submissions:  
  - **F1**: Failing to drag all dynamical fields, breaking solutionhood in the hole.  
  - **F2**: Using non-dynamical background structures (e.g., fixed fields) but applying unrestricted diffeomorphisms, invalidating the symmetry argument.  
  - **F3**: Claiming physical differences via non-invariant quantities (e.g., metric components at manifold points) rather than invariants.  
  - **F4**: Misidentifying indeterminism—confusing gauge redundancy (diffeomorphisms) with genuine indeterminism in the initial value problem.  
  - **F5**: Overlooking boundary conditions (e.g., in asymptotically flat spacetimes), where non-trivial diffeomorphisms at infinity alter conserved charges (e.g., ADM mass), voiding Leibniz equivalence.

  The hole argument does *not* inherently resolve substantivalism vs. relationalism; it highlights that haecceitism implies indeterminism. Journals cannot adjudicate philosophical stances (e.g., whether Leibniz equivalence is semantic or formal) but can police mathematical misapplications.

  ---

  #### Triage Procedure: 8 Ordered Checks  
  *Mechanical checks (M) require only text inspection; interpretive checks (I) require conceptual judgment. Failure at any check halts the process.*

  **Check 1: Solutionhood of Dragged Model**  
  (a) *Question*: Does the author explicitly verify that the dragged model satisfies the field equations *everywhere*, including the hole?  
  (b) *Satisfactory*: Clear statement that \(\psi^*g, \psi^*\phi\) (as applicable) solve the equations, or appeal to general covariance.  
  (c) *Failure*: No verification; or equations are unchecked in the hole.  
  (d) *Consequence*: Desk rejection (DR). **Mechanical (M)**.  
  *Rationale for DR*: Non-solution models invalidate the argument.

  **Check 2: Dynamical Fields Dragged**  
  (a) *Question*: Are *all* dynamical fields (metric and matter) dragged by \(\psi\)? Are non-dynamical/background fields explicitly identified and *not* dragged?  
  (b) *Satisfactory*: Explicit drag of all dynamical fields; background fields noted and unchanged.  
  (c) *Failure*: Dynamical fields partially dragged; background fields dragged; or ambiguity.  
  (d) *Consequence*: DR. **Mechanical (M)**.  
  *Rationale for DR*: Incomplete drag breaks solutionhood or symmetry.

  **Check 3: Background Structure Handling**  
  (a) *Question*: Does the theory have non-dynamical background structures (e.g., fixed metric, preferred coordinates)? If so, does \(\psi\) preserve them?  
  (b) *Satisfactory*: Background structures identified; \(\psi\) preserves them (or is restricted to do so).  
  (c) *Failure*: Background structures unacknowledged; or \(\psi\) violates them without justification.  
  (d) *Consequence*: DR. **Partly mechanical (M)**.  
  *Rationale for DR*: Unpreserved background breaks symmetry; models are not gauge-equivalent.  
  *Gaming risk*: Author may mislabel background as dynamic; giveaway is non-variation in field equations.

  **Check 4: Model Isomorphism**  
  (a) *Question*: Does the author recognize that \((M, g, \phi)\) and \((M, \psi^*g, \psi^*\phi)\) are isomorphic via \(\psi\)?  
  (b) *Satisfactory*: Explicit statement that \(\psi\) is an isomorphism between models.  
  (c) *Failure*: Denial of isomorphism without cause (e.g., ignoring background structures).  
  (d) *Consequence*: DR. **Mechanical (M)**.  
  *Rationale for DR*: Denying isomorphism misrepresents mathematical equivalence.

  **Check 5: Invariant Physical Differences**  
  (a) *Question*: If physical distinctness is claimed, is it based *only* on diffeomorphism-invariant quantities (e.g., scalars, coincidences)?  
  (b) *Satisfactory*: Distinctness argued via invariants; or no distinctness claimed.  
  (c) *Failure*: Distinctness claimed via non-invariant quantities (e.g., \(g_{\mu\nu}(p)\) at manifold point \(p\)).  
  (d) *Consequence*: DR. **Mechanical (M)**.  
  *Rationale for DR*: Non-invariant differences are unobservable and non-physical.

  **Check 6: Boundary Conditions**  
  (a) *Question*: In spacetimes with boundaries (e.g., asymptotically flat), is \(\psi\) the identity at infinity/boundary? If not, are conserved charges (e.g., ADM mass) checked?  
  (b) *Satisfactory*: \(\psi\) is identity at boundary; or non-trivial \(\psi\)’s charge differences acknowledged.  
  (c) *Failure*: Boundary context present, \(\psi\) non-trivial there, and charges unaddressed.  
  (d) *Consequence*: DR. **Mechanical (M)**.  
  *Rationale for DR*: Non-trivial \(\psi\) at boundary alters physics, voiding hole argument setup.  
  *Gaming risk*: Author may omit boundary context; giveaway is topology or asymptotic notation.

  **Check 7: Indeterminism Claim**  
  (a) *Question*: Does the paper claim the hole argument shows indeterminism in the initial value formulation?  
  (b) *Satisfactory*: Acknowledges that initial data determine solutions only up to diffeomorphism.  
  (c) *Failure*: Asserts indeterminism without noting gauge equivalence.  
  (d) *Consequence*: DR. **Mechanical (M)**.  
  *Rationale for DR*: Hole argument concerns representation non-uniqueness, not physical indeterminism.

  **Check 8: Metaphysical Conclusion**  
  (a) *Question*: Does the paper draw metaphysical conclusions (e.g., refuting substantivalism) without engaging with standard responses (e.g., sophisticated substantivalism)?  
  (b) *Satisfactory*: Notes interpretive options; or no metaphysical claims.  
  (c) *Failure*: Concludes substantivalism/relationalism refuted, ignoring extant resolutions.  
  (d) *Consequence*: Escalate to specialist referee (philosophy of physics). **Interpretive (I)**.  
  *Rationale*: Philosophical claims require expert evaluation; journal cannot adjudicate.  
  *Procedure limit*: Cannot settle if Leibniz equivalence is stipulative or formal.

  ---

  #### Worked Cases  
  **Case 1: Vacuum Solution with Indeterminism Claim**  
  - *Check 1*: Pass (vacuum, no matter; solutionhood by general covariance).  
  - *Check 2*: Pass (only metric dragged).  
  - *Check 3*: Pass (no background structures).  
  - *Check 4*: Pass (author notes diffeomorphism relation).  
  - *Check 5*: **Failure** (claims physical difference via metric components at points; no invariants).  
  - *Disposition*: DR.  
  - *Desk Rejection Text*: "Your manuscript correctly constructs diffeomorphic metrics in vacuum general relativity but erroneously infers physical indeterminism and refutes substantivalism. The models are isomorphic and represent the same physical state; differences at manifold points are gauge artifacts. Substantivalism is not refuted, as points may be metric-individuated. Thus, we desk-reject."

  **Case 2: Non-Dynamical Scalar Field with "Failed Relationalism"**  
  - *Check 1*: Pass (field equations handled).  
  - *Check 2*: Pass (scalar field non-dynamical; not dragged).  
  - *Check 3*: **Failure** (scalar field is background; \(\psi\) does not preserve it).  
  - *Disposition*: DR.  
  - *Desk Rejection Text*: "Your manuscript uses a non-dynamical scalar field as background structure. The diffeomorphism alters the metric relative to this background, so the models are not gauge-equivalent and may be physically distinct. This does not engage the hole argument, which requires symmetry preservation. Relationalism is not tested. Desk-rejected."

  **Case 3: Asymptotically Flat Spacetimes with "Failed Dissolution"**  
  - *Check 1*: Pass (assume solutionhood verified).  
  - *Check 2*: Pass (all dynamical fields dragged).  
  - *Check 3*: Pass (asymptotic structure acknowledged).  
  - *Check 6*: **Failure** (diffeomorphism not identity at infinity; charges differ but dissolution misapplied).  
  - *Disposition*: DR.  
  - *Desk Rejection Text*: "Your manuscript considers diffeomorphisms non-trivial at infinity in asymptotically flat spacetimes. While these alter conserved charges, the hole argument requires diffeomorphisms trivial at infinity. The standard dissolution applies only to the latter, so your claim of its failure is misplaced. Desk-rejected due to misapplication of the argument."  
  - *Verdict I Would Rather Not Deliver*: Case 3, as the paper addresses a nuanced topic (asymptotic symmetries) but fails procedurally due to poor prose and misalignment with the hole argument’s premises.

  **Procedure Limits**:  
  - Cannot resolve philosophical stances (e.g., Leibniz equivalence as stipulative vs. derived).  
  - Specialist referees needed for metaphysics (Check 8) or complex boundary cases.  
