  We are constructing a triage procedure for manuscripts invoking the hole argument. The hole argument, as reconstructed by Earman and Norton (1987), is a mathematical argument that shows that in a generally covariant theory (like general relativity) there are distinct mathematical models (solutions) that represent the same physical situation. The argument involves a diffeomorphism that is the identity outside a region (the "hole") but non-trivial inside. The standard resolution (Leibniz equivalence) is that such diffeomorphic models represent the same physical reality.

  However, submissions often misinterpret this argument. Common issues include:
  - Misidentifying the symmetry group of the theory (e.g., when background structures are present).
  - Failing to recognize that the two models are isomorphic and hence represent the same physical state.
  - Applying the argument in contexts where there is background structure that breaks the diffeomorphism symmetry.
  - Claiming physical differences that cannot be expressed in terms of invariant quantities.

  The procedure must help editors check for these issues without redoing calculations.

  **Analysis (400-600 words):**

  The hole argument, mathematically, is straightforward. Given a model (M, g, ...) of a generally covariant theory (where M is a manifold, g the metric, and ... other fields), and a diffeomorphism φ that is the identity outside a compact region (the hole) but not inside, we can create a new model (M, φ*g, ...) by pulling back the fields. The two models (M, g, ...) and (M, φ*g, ...) are mathematically distinct (if φ is not the identity) but are related by an active diffeomorphism. The theory being generally covariant means that if (M, g, ...) satisfies the field equations, then so does (M, φ*g, ...).

  The physical interpretation is the crux. The standard resolution (Leibniz equivalence) asserts that these two models represent the same physical situation. This is because physical observables in general relativity are generally taken to be diffeomorphism-invariant quantities. Thus, if two models are related by a diffeomorphism, they are physically equivalent.

  However, some philosophers have argued that if one is a manifold substantivalist (i.e., believes that spacetime points exist and have their identities independently of the fields on them), then the two models represent distinct physical situations (because the same point has different metric properties in the two models). This leads to an apparent indeterminism: the same initial conditions (outside the hole) can lead to multiple futures (inside the hole). The relationalist response is to deny that spacetime points have such independent identity and to embrace Leibniz equivalence.

  Important nuances:
  1. **Background structures:** If the theory has non-dynamical background structures (e.g., a fixed metric in Newtonian physics or special relativity), then the symmetry group is not the full diffeomorphism group but a subgroup preserving that background. In such cases, two models related by a diffeomorphism that does not preserve the background are not equivalent and may represent distinct physical states.
  2. **Matter fields:** Often, authors drag the metric but not the matter fields (or vice versa). This breaks the symmetry and the resulting models may not both be solutions. The drag must be applied to all dynamical fields.
  3. **Individuation:** Some argue that points can be individuated by the fields (e.g., by the metric). Then the two models are not about the same points. Alternatively, in the "algebraic" approach, one dispenses with the manifold and uses only algebraic structures built from the fields.
  4. **Boundary conditions:** In asymptotically flat spacetimes, diffeomorphisms that do not go to the identity at infinity can change conserved charges (like ADM mass). Therefore, such models are physically distinct. The symmetry group is restricted to the diffeomorphisms that preserve the asymptotic conditions.

  Common failure modes in submissions:
  - **F1:** Not applying the diffeomorphism to all dynamical fields, so the dragged model isn't a solution.
  - **F2:** Applying the argument in a theory with background structure and not recognizing that the symmetry is broken.
  - **F3:** Claiming a physical difference that relies on bare manifold points (which are not observable) rather than invariants.
  - **F4:** Confusing the hole argument with a failure of determinism in the initial value formulation (which is well-understood and does not rely on the hole argument).
  - **F5:** Asserting that Leibniz equivalence is unavailable in a context without showing that the models are not related by a symmetry of the theory.

  **Triage Procedure:**

  The procedure consists of 8 checks. Each check is designed to be applied in order. If a manuscript fails a check, we stop and take the indicated action. If it passes all, it goes to a referee.

  **Check 1: Is the second model a solution?**
     - (a) Question: Does the author verify that the dragged model (obtained by applying the diffeomorphism) satisfies the field equations everywhere, including the hole?
     - (b) Satisfactory: Explicit statement that the dragged model satisfies the field equations, or a clear argument that the theory is generally covariant and the drag is by a diffeomorphism.
     - (c) Failure: No such verification; or the drag is applied only to some fields and not to others (especially matter fields).
     - (d) Consequence: Desk reject (DR). Reason: The dragged model is not a solution, so the argument collapses.
     - **Mechanical?** Yes, if the author states it. If not, it's a gap. But we can't redo calculations, so if the author doesn't state it, we assume it's not done.

  **Check 2: Are all dynamical fields dragged?**
     - (a) Question: Does the author apply the same diffeomorphism to all dynamical fields? (Non-dynamical/background fields are not dragged.)
     - (b) Satisfactory: The text explicitly states that the diffeomorphism is applied to the metric and all matter fields (if present) and that any non-dynamical fields are identified as such and not dragged.
     - (c) Failure: The author drags the metric but holds matter fields fixed (or vice versa), or drags non-dynamical fields.
     - (d) Consequence: DR. Reason: The resulting model is not a solution because the field equations (which couple all dynamical fields) are violated.
     - **Mechanical?** Yes.

  **Check 3: Is there non-dynamical background structure?**
     - (a) Question: Does the theory have non-dynamical background structures (e.g., a fixed metric, a preferred coordinate system, etc.)?
     - (b) Satisfactory: The author identifies any background structures and either (i) shows that the diffeomorphism preserves them (so the symmetry is respected) or (ii) restricts the diffeomorphism to preserve them. If there are none, that is stated.
     - (c) Failure: The author uses a diffeomorphism that does not preserve a background structure and does not account for it, or fails to recognize a background structure that is present.
     - (d) Consequence: If the author fails to account for a background structure, then DR. Reason: The symmetry group is broken, so the models may be physically distinct, and the hole argument as applied is invalid. If the author correctly handles background structures, pass.
