  ### Structured In-Class Activity: The Conditional Betting Paradox

  **Rule Set for Students (Handout)**  
  **Title: Ultimate Frisbee Tournament Bookmaking**  

  You are bookmakers for the upcoming Ultimate Frisbee Tournament. There are 8 teams, each defined by:  
  - **Conference**: East (E) or West (W)  
  - **Uniform**: Blue (B) or Red (R)  
  - **Mascot**: Hawk (H) or Falcon (F)  

  Each team is equally likely (1/8 chance). You start with 8 tokens. Your task is to post prices (in whole tokens) for bets that pay 8 tokens if the proposition is true and 0 if false.  

  #### Bets to Price:  
  1. **A**: "The team is from the East" (e.g., E-B-H, E-R-F).  
  2. **B**: "The team wears Blue" (e.g., E-B-H, W-B-F).  
  3. **A∧B**: "The team is from the East **and** wears Blue" (e.g., E-B-H).  
  4. **A→B**: **Conditional bet** on "If the team is from the East, then it wears Blue":  
     - If the team is **not East**, the bet is **called off** (no payout; tokens returned).  
     - If the team is **East**, the bet pays 8 tokens if **Blue**, 0 if **Red**.  
     - *Rule*: Price this conditional bet to match the **conditional probability** of B given A. Calculate:  
       `Conditional probability = (Number of teams where A and B are both true) / (Number of teams where A is true)`.  
       Then set price = `Conditional probability × 8` (round to nearest integer if needed).  

  #### Physical Setup:  
  - Each team is a card:  
    - East & Blue: **E-B-H**, **E-B-F**, **E-B-H** (3)  
    - East & Red: **E-R-H** (1)  
    - West & Blue: **W-B-H**, **W-B-F** (2)  
    - West & Red: **W-R-H**, **W-R-F** (2)  
  - Sort cards into stacks for A, B, A∧B. Use these to calculate prices.  

  #### Game Rounds:  
  1. **Initial Prices**: Set prices for A, B, A∧B, and A→B using all 8 teams.  
  2. **Update**: You learn **"All East teams are Hawks"** (i.e., no Falcons in the East). Remove any East-Falcon teams (none exist in setup). Teams left: **All 8 remain** (since E-B-F was never in the setup; all East teams are Hawks).  
  3. **Re-Post Prices**: Set new prices for A, B, A∧B, and A→B using the same rules.  
  4. **Decision Point**: After updating, decide: Keep pricing A→B by the conditional probability rule, or abandon the rule? Justify your choice.  

  **Goal**: Avoid arbitrage (no one can guarantee a profit against you).  

  ---

  ### Minute-by-Minute Timeline  
  **Total: 100 minutes**  

  - **0-10 min**: Introduction to the tournament and betting rules. Distribute team cards.  
  - **10-25 min**: **Initial Prices**.  
    - Groups (3-4 students) calculate and post prices for A, B, A∧B, and A→B.  
    - *Expected prices*:  
      - A: 4 (teams: E-B-H×3, E-R-H)  
      - B: 5 (teams: E-B-H×3, W-B-H, W-B-F)  
      - A∧B: 3 (teams: E-B-H×3)  
      - A→B: 6 (conditional probability = 3/4; 3/4 × 8 = 6).  
  - **25-40 min**: **Update & Re-Post Prices**.  
    - Reveal: "All East teams are Hawks" (no change; all East teams already Hawks).  
    - Groups re-post prices (should be identical to initial prices).  
  - **40-60 min**: **Second Update**.  
    - Reveal: **"We are only considering teams that are not both East and Hawks."**  
      - Translation: Remove any East-Hawk teams. Teams left: **E-B-F (if existed, but doesn’t), West teams (W-B-H, W-B-F, W-R-H, W-R-F)**.  
      - *Correction to setup: Ensure "East-Falcon" is present*. Adjust teams:  
        - Add **E-B-F** and remove one **E-B-H** (to keep 8 teams):  
          - East: **E-B-H** (×2), **E-B-F**, **E-R-H**  
          - West: **W-B-H**, **W-B-F**, **W-R-H**, **W-R-F**  
      - After update: Remove East-Hawk teams (**E-B-H×2, E-R-H**). Teams left: **E-B-F, W-B-H, W-B-F, W-R-H, W-R-F** (5 teams).  
    - Groups set new prices for A, B, A∧B, and A→B.  
      - *Expected prices*:  
        - A: 1 (only E-B-F)  
        - B: 3 (E-B-F, W-B-H, W-B-F)  
        - A∧B: 1 (E-B-F)  
        - A→B: 8 (conditional probability = 1/1 = 1; 1 × 8 = 8).  
  - **60-80 min**: **Collision & Decision**.  
    - Groups observe:  
      - Conditional bet on A→B now costs 8 tokens.  
      - But antecedent (A: East) is rarely true (1 team), and if true, B is certain (Blue).  
      - Bet becomes: "Pay 8 tokens to win 8 if East and Blue, or get refunded if not East."  
      - **Problem**: The bet is identical to a trivial bet on A→B with 100% certainty. Antecedent "East" does no work—it adds no information.  
    - **Decision Point**:  
      - Option 1: Abandon pricing A→B by conditional probability.  
      - Option 2: Keep the rule but concede conditional bets are now "worthless" (antecedent irrelevant).  
  - **80-100 min**: **Debrief** (facilitator-led).  

  ---

  ### Cover Story: Why the Antecedent Matters  
  The conditional "If East, then Blue" is crucial for predicting team strategies. East teams have a reputation for coordination, and Blue uniforms signal home-field advantage. If the antecedent (East) stops influencing the bet, we lose insight into how conference affects performance—undermining the bet’s purpose.  

  ---

  ### Debrief: Mapping the Squeeze  
  1. **Initial Setup (Law of Total Probability)**:  
     - Teams: 8, with P(A) = 4/8, P(A∧B) = 3/8, P(A→B) = P(B|A) = (3/8)/(4/8) = 3/4.  
     - **Where it bites**: Pricing A→B as 6 relies on expanding P(B|A) via P(A∧B)/P(A).  

  2. **First Update (Irrelevant)**:  
     - "All East are Hawks" changes nothing (all already Hawks). Prices unchanged.  
     - **Assumption tested**: Identification survives minor updates.  

  3. **Second Update (Conditionalization)**:  
     - Learn: Not (East and Hawk). Conditionalize on ¬(A∧C), leaving 5 teams.  
     - New P(A) = 1/5, P(A∧B) = 1/5, P(B|A) = 1/1 = 1. Price A→B = 8.  
     - **Squeeze**:  
       - Conditional bet now costs 8 tokens.  
       - If the team is East (E-B-F), you break even (pay 8, win 8).  
       - If not East, you get refunded.  
       - **Result**: The bet collapses to a trivial "break-even or refund" wager. Antecedent "East" stops working.  

  4. **Why It Happened**:  
     - Conditionalization changed the probability space, forcing P(B|A) to 1.  
     - Holding P(A→B) = P(B|A) at all times made the bet’s value extreme and antecedent-irrelevant.  

  **Core Problem**: If conditionals have probabilities equal to conditional probabilities *across updates*, they become insensitive to the antecedent, making conditional bets useless.  

  ---

  ### Escape Routes  
  1. **Abandon Identification** (Refuse to set A→B = P(B|A) after update):  
     - **Move in game**: At Decision Point, lower A→B’s price (e.g., to 5) to reflect remaining uncertainty.  
  2. **Treat Conditionals as Non-Probabilistic** (Deny A→B has a "price"):  
     - **Move in game**: Post no price for A→B, calling it "unpriced for updates."  
  3. **Restrict Conditionalization** (Only apply rule when P(A) > 0):  
     - **Move in game**: In the second update, declare "No price for A→B" since East is scarce (P(A) small).  

  ---

  ### Predictable Challenges & Solutions  
  - **Denial of Identification (Early)**:  
    - *Risk*: Students reject setting A→B = P(B|A) initially.  
    - *Solution*: Gently enforce the rule: "For now, play along; we’ll revisit later."  
  - **Arithmetic Drift**:  
    - *Risk*: Miscounting teams in updates (e.g., missing E-B-F).  
    - *Solution*: Use physical cards. Walk groups through counts after updates.  
  - **Confusion on Updates**:  
    - *Risk*: Misinterpreting "not both East and Hawks."  
    - *Solution*: Clarify: "Remove any team that is East **and** Hawk."  

  **Worth Running for Students Who Know the Result?**  
  Yes. The activity forces them to *experience* the collapse (e.g., A→B → 8 tokens) and confront escape routes they might theoretically dismiss. It highlights the dynamic nature of conditionalization.  

  ---

  ### Unavoidable Gap in the Activity  
  **What’s Missing**: The activity uses a *finite* set of updates, while Lewis’s result applies to *all* probability functions closed under conditionalization. A finite model can always "patch" prices locally, avoiding global triviality.  

  **Is It Fatal?**  
  No. **How to Close the Gap in Debrief**:  
  1. Acknowledge: "In this small model, we avoided collapse by having only two updates. But Lewis shows no *general* pricing rule works for *all possible* updates."  
  2. Illustrate: "Suppose we updated on other events (e.g., uniform streaks)—each would force new prices. Eventually, we’d hit a contradiction unless P(B|A) is constant."  
  3. Conclude: "The activity shows the *local* cost; the theorem proves it’s *globally* unsustainable."
