  For the "existing options" section, I should acknowledge that global updatelessness (no updating ever) has internal consistency but fails on self-locating cases, while instrumental updatelessness (only for predictors) lacks criteria for when to trigger it. Both positions have merit - the former captures something fundamental about agency, the latter reflects actual practice.

  The methodology section needs concrete milestones. Month 1 could formalize the partition problem across frameworks like CDT/EDT/UDT. Month 2 might develop the criterion - perhaps something like "information is non-updatable iff it correlates with predictors in a way that could induce correlated errors across similar agents". Month 3 would stress-test it against their cataloged problems.

  Failure conditions are crucial. If the criterion just replicates global updatelessness, that's a dead end. If it requires problem-specific causal modeling, it fails generality. Success might look like a formalizable principle that handles all their cases without ad hoc adjustments.

  Risks: Logical uncertainty might rear its head when dealing with "similar agents". The self-locating cases could require contentious assumptions about identity. Fallback option: deliver a taxonomy of problem types with explicit partition rules, even without unifying principle.

  This is ambitious but doable in three months if scope stays focused. The user's instinct to derive the partition from decision-theoretic purpose (optimality guarantees) rather than reverse-engineering feels like the right path.
answer: |-
  ## Project Proposal: Partitioning Information for Updateless Agency in Decision Problems

  **The Question**
  Given an agent’s total information state at a choice point, what criterion determines which subsets of this information the agent *must* treat as "non-updatable" (i.e., excluded from conditionalization when computing expected utility), and which subsets it *may* treat as "updatable" (i.e., incorporated via standard Bayesian updating), in order to achieve robustly optimal performance against predictor-like entities? The answer must be a general, formal principle applicable across problem types (predictors, self-locating uncertainty, decision-procedure information), not a case-specific heuristic, and must specify the partition solely based on the decision-theoretic role of avoiding predictable exploitation.

  **Why Existing Options Leave It Open**
  Current approaches lack a general, principled criterion for this partition. *Global Updatelessness* mandates treating *all* information as non-updatable, computing expected utility solely from the prior conditional on the act. This correctly handles predictor problems by ensuring the agent doesn’t update away the correlation between predictor and action, preventing self-sabotage (e.g., in Newcomb’s Problem). However, it demonstrably fails in problems involving self-locating uncertainty (e.g., Sleeping Beauty or duplication amnesia). Here, refusing to update on indexical evidence (e.g., "which copy am I?") leads to incorrect betting behavior, as the agent ignores relevant information about its actual situation. Global updatelessness conflates avoiding predictor-exploitation with an untenable rejection of legitimate self-locating updating.

  Conversely, the *Instrumental Updatelessness* position holds that updatelessness is merely a tool for predictor problems and should *never* apply to ordinary empirical or self-locating evidence. This correctly identifies that some information *must* be updated upon for rational decisions in non-predictor contexts. However, it lacks a criterion for *when* updatelessness is instrumentally required. It implicitly relies on recognizing "predictor problems" by their causal structure or pre-theoretic intuition, leaving the core question unanswered: *what property of the information itself* triggers the requirement for updateless treatment? Both positions capture essential insights: Global Updatelessness identifies the *need* for a constraint to handle predictors, while Instrumental Updatelessness recognizes that the constraint *cannot* be universally applied. Neither provides the necessary partition rule.

  **The Method**
  The project will define and formalize the partition criterion by analyzing the decision-theoretic function of non-updatability: preventing the agent from being predictably manipulated by entities that model its decision process.

  *   **Month 1: Formal Framing & Case Catalog:** Define the agent’s information state formally (e.g., as a set of propositions or a sigma-algebra). Catalog a structured set of decision problems serving as test cases, explicitly representing the agent’s total information in each:
      *   *Predictor Simulation:* Newcomb, Parfit’s Hitchhiker, Toxin Puzzle (information includes predictor’s output).
      *   *Self-Locating:* Sleeping Beauty, Duplication/Amnesia (e.g., agent wakes with amnesia, unsure if original/copy; information includes current sensory state).
      *   *Causal Evidence:* Agent’s current evidence causally influenced by its past choice (e.g., choosing to look in a box provides evidence about its past decision to look; information includes observation result).
      *   *Decision-Information:* Agent receives information *about* its own decision procedure or algorithm (e.g., a note stating "You are a one-boxer"; information includes the note). For each case, identify the intuitively correct partition (updatable vs. non-updatable) and the desired optimal policy.
  *   **Month 2: Criterion Development & Formalization:** Develop a candidate criterion based on the core purpose: avoiding predictable exploitation via correlation. Key idea: Information is *non-updatable* iff updating on it could lead the agent to systematically select dominated actions *specifically because* the information correlates with the predictions/actions of a predictor or sufficiently similar agents whose behavior correlates with its own. Formalize this:
      1. Define "sufficiently similar agent" relative to the predictor/model (operationalized as agents sharing the same decision algorithm or relevant aspects of it).
      2. Define "systematically dominated" in terms of expected utility loss *conditional on the predictor's model/simulation or the existence of correlated agents*.
      3. Formalize the condition: Subset `I_nu` of information is non-updatable if conditionalizing on it, *prior* to act selection, creates a dependency where the EU-maximizing act given `I_nu` is predictably suboptimal *from the perspective of the prior* when considering the predictor/correlated-agents structure.
      4. Use decision matrices and simple Bayesian networks within a functional/UDT-like framework to model the correlations. No fundamentally new decision theory is proposed; the focus is on augmenting existing frameworks with the partition rule.
  *   **Month 3: Testing, Refinement & Generalization:** Apply the formal criterion to the cataloged cases. Does it mandate non-updatability for predictor outputs? Does it allow updating on self-locating sensory evidence? Does it handle causal evidence and decision-information cases correctly? Identify discrepancies. Refine the criterion to handle edge cases (e.g., degrees of similarity, partial predictors). Explore if the criterion can be stated without explicit reference to "predictors" by relying solely on the structure of agent-similarity and potential for correlated errors across possible decision instances. Assess robustness against variations within problem types.

  **What Would Count as a Result, and What Would Count as Failure**
  *   **Success:** A formally statable criterion that:
      1.  Prescribes non-updatability *only* for information like predictor outputs in Newcomb-like problems and decision-information notes.
      2.  Prescribes updatability for self-locating sensory evidence and ordinary causal evidence not generated by a predictor modeling the agent.
      3.  Yields demonstrably optimal policies across the test cases without ad hoc adjustments.
      4.  Is definable without presupposing the causal structure *of the specific problem* (though it may reference general agent-similarity concepts).
  *   **Failure Conditions:**
      1.  **Collapse:** The criterion reduces to Global Updatelessness (mandating non-updatability for *all* information, failing self-locating cases) or becomes vacuous (mandating updatability for everything, failing predictor cases). This shows the intended distinction cannot be captured.
      2.  **Problem-Specificity:** The criterion cannot be stated without explicitly incorporating details of the causal structure unique to each problem type (e.g., needing to label "predictor node" or "copy mechanism"). This fails the goal of a general principle.
      3.  **Intractability:** The criterion is formally definable but computationally infeasible to apply even in simple cases (e.g., requires solving fixed points involving impossible counterfactuals about agent-similarity under updating).
      4.  **Inconsistency:** The criterion yields contradictory prescriptions for structurally similar problems or conflicts with core rationality requirements like Dutch book avoidance in self-locating scenarios.

  **Scope and Risks**
  *   **Scope:** Focuses on partitioning *given* information within a single agent's decision at a single point in time. It presumes a standard Bayesian framework for belief representation and updating. It assumes decision problems are well-posed with defined outcomes and utilities. It does not aim to resolve the metaphysical status of copies or the semantics of self-location.
  *   **Key Risks & Mitigations:**
      1.  **Logical Uncertainty & Agent Similarity:** Defining "sufficiently similar agents" precisely, especially regarding logical uncertainty about one's own algorithm or the existence of copies, is challenging. The criterion might become ambiguous. *Mitigation:* Initially define similarity strictly syntactically (same decision algorithm code) or via explicit problem specification. Acknowledge this limitation. *Risk Level: High.*
      2.  **Counterfactuals about Decision Procedure:** Reasoning about how updating on `I_nu` would change the agent's decision, especially if `I_nu` describes the decision procedure itself (e.g., "you are a one-boxer"), involves delicate counterfactuals. *Mitigation:* Leverage existing UDT/functional frameworks that treat the agent's decision as a function; consider information about the function's output as potentially non-updatable. *Risk Level: Medium.*
      3.  **Causal Structure Dependence:** Avoiding any reliance on problem-specific causal modeling might prove impossible. *Mitigation:* Accept a *minimal* causal ontology focused on agent-predictor correlations and information sources, aiming for generality. *Risk Level: Medium.*
  *   **Scaled-Down Fallback:** If a general, formal criterion proves elusive, the fallback result is a detailed **taxonomy of decision problem types** based on the information-partition requirements revealed by the analysis, with explicit (though case-specific) rules for each type, demonstrating that a single global rule is inadequate and clarifying *why* different types demand different treatments (e.g., "predictor-output info: non-updatable; sensory self-location info: updatable; because..."). This would still advance understanding by systematizing the currently ad hoc practice.
