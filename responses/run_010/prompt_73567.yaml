  Now, the joint statement.

  **Joint Statement**

  1. **Agreed Claims**  
     We must have non-vacuous claims that rule something out and cost each camp something.

     A1. *Claim:* In a domain with a fixed set of fluents and actions, the use of successor-state axioms reduces the number of axioms required to represent change from scaling with the product of the number of fluents and the number of actions to scaling with the number of fluents.  
     *What it rules out:* The claim rules out that the combinatorial explosion in the number of frame axioms is unavoidable in any formal representation of change.  
     *Cost to each signer:* Camp A gives up nothing by this, but Camp B concedes the technical result. However, Camp B gives up the claim that the bookkeeping problem is inherently unsolvable.

     A2. *Claim:* The Counter Perturbation Battery shows that, for a system with a hand-written fluent interface, the number of fluent values consulted during re-planning after a perturbation (e.g., in condition 1, 2, or 3) is lower than if the system had to check every fluent.  
     *What it rules out:* It rules out that the system must check every fluent to detect and respond to the perturbations.  
     *Cost:* Camp A sees this as evidence for their approach; Camp B concedes that within a fixed ontology, efficient bookkeeping is possible.

     A3. *Claim:* The ablation arm of the Counter Perturbation Battery, which removes the hand-written fluent interface and uses raw perception plus a world model, performs worse on the perturbation conditions (in terms of re-planning time or success rate) than the system with the hand-written interface.  
