     *Camp A wording:* The frame problem is a technical problem of efficiently representing and updating the state of the world in a formal system, and it has been solved by the use of successor-state axioms.  
     *Camp B wording:* The frame problem is the problem of how an agent, situated in an open and dynamic world, can determine what is relevant to represent and attend to, and this problem remains unsolved.  
     *Each side would accept own wording:* Yes.  
     *Verbal or substantive:* Substantive.

     D2. *Neutral Statement:* Does the solution to the frame problem provided by successor-state axioms address the core issue for which the term was coined, or does it address a derivative issue?  
     *Camp A wording:* The frame problem, as originally defined in the context of deductive planning, was the problem of combinatorial explosion in frame axioms, and it has been solved by successor-state axioms.  
     *Camp B wording:* The frame problem, as originally defined, was a symptom of a deeper issue: the difficulty of specifying what is relevant in a changing world, and the successor-state axioms only address a surface-level issue.  
     *Each side would accept own wording:* Yes.  
     *Verbal or substantive:* Substantive.

     D3. *Neutral Statement:* Is the problem of selecting the set of fluents (the ontology) part of the frame problem or a separate problem?  
     *Camp A wording:* The frame problem is distinct from the problem of ontology selection; the former is a technical problem of representation and update, while the latter is an engineering or abstraction problem.  
     *Camp B wording:* The frame problem inherently includes the problem of ontology selection because without an appropriate ontology, the update problem cannot even be framed.  
     *Each side would accept own wording:* Yes.  
     *Verbal or substantive:* Substantive.

  3. **Cruxes**  
     We need at least three. One about the system vs theorist's description, one about the ablation arm, and one about whether it's one problem or two. We'll adjust if needed.

     C1. *Question:* Does the fluent vocabulary belong to the system or to the theorist's description of it?  
     *Settlement would move:* Both. If the fluents are part of the system, then A's solution is more complete; if they are just the theorist's description, then B's point about the system's own role is stronger.  
     *Shared test:* In the ablation arm, the system without hand-written fluents uses a learned world model. We can test whether the system, during the perturbation conditions, exhibits behavior that suggests it has formed its own "fluent-like" representations. Specifically, in condition 1 (mug moved behind occluder), we record the number of raw percepts the system attends to before re-planning.  
     *Prediction Camp A:* The ablation system will attend to a large number of raw percepts (or pixels) because it lacks predefined fluents, showing that without the theorist's fluents, the system is inefficient.  
     *Prediction Camp B:* The ablation system will attend to a focused set of raw percepts (e.g., in the region of the mug and occluder) because it has learned to form task-relevant representations, showing that the system can form its own fluents.  
     *Predictions genuinely differ:* Yes.  
     *If not why not decidable yet:* N/A.

     C2. *Question:* Does the ablation arm count as solving relevance determination (by learning from data) or as amortizing it over a training distribution?  
     *Settlement would move:* Both. If the ablation system performs well, it might support B's view that relevance can be learned; if not, A's view that hand-crafting is needed.  
     *Shared test:* Compare the performance (success rate and time to re-plan) in the three perturbation conditions between the hand-written system and the ablation system. Also, note the variance in performance across multiple trials with different initial conditions.  
     *Prediction Camp A:* The ablation system will have higher variance in performance and lower success rate, especially in condition 3 (person in counter region), because it hasn't been trained on all possible perturbations, showing that relevance determination is not solved but amortized.  
     *Prediction Camp B:* The ablation system will achieve comparable success rates and re-planning times to the hand-written system, especially after sufficient training, showing that relevance determination can be learned.  
     *Predictions genuinely differ:* Yes.  
     *If not why not decidable yet:* N/A.

     C3. *Question:* Does the term "frame problem" pick out a single problem or two problems of different kinds?  
     *Settlement would move:* Neither yet, because it is partly terminological. But we can design a test.  
     *Shared test:* In the scale arm (4,000 fluents), introduce a new perturbation that requires a new fluent not in the original set (e.g., the kettle's temperature sensor fails, but temperature was not modeled). Record whether the system can handle it without human intervention.  
     *Prediction Camp A:* The system will fail to handle the new perturbation because the new fluent is not in the vocabulary, showing that the problem is separate (abstraction/engineering).  
     *Prediction Camp B:* The system will also fail, but this failure is of the same kind as the original frame problem, because it shows the limitation of fixed representations.  
     *Predictions genuinely differ:* No. Both predict failure, but interpret it differently. So we need a different crux.  
     *If not why not decidable yet:* The predictions do not differ; the interpretation does.

