  **Bottom Line**  
  The single question on which these two camps actually turn is: *Is the frame problem fundamentally a technical problem of efficient representation and update within a fixed ontology (which has been solved), or is it the problem of how an agent in an open world selects what to represent and attend to (which remains unsolved)?*

