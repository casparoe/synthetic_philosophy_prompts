answer: |-
  ### Joint Statement on the Frame Problem

  **1. Agreed Claims**  
  A1. In domains with fixed fluent sets and action schemas, successor-state axioms eliminate the need for per-action-per-fluent frame axioms, reducing axiom growth from combinatorial (fluents × actions) to linear (fluents).  
  *Rules out:* That combinatorial frame axioms are unavoidable for state tracking.  
  *Cost:* A accepts that this solution is ontology-dependent; B accepts its technical correctness within fixed bounds.  

  A2. The Counter Perturbation Battery confirms that hand-written fluent interfaces reduce perceptual consultations during perturbations (e.g., mug occlusion or kettle swap) compared to brute-force checks.  
  *Rules out:* That agents must scan all fluents to detect anomalies.  
  *Cost:* A concedes interfaces are hand-designed; B concedes efficiency gains exist for predefined tasks.  

  A3. In the scale arm (4,000 fluents), successor-state axioms maintain feasible update times, whereas naive frame-axiom approaches become computationally intractable.  
  *Rules out:* That the re-axiomatization solution fails at scale.  
  *Cost:* A accepts scaling depends on fluent design; B accepts the bookkeeping improvement.  

  A4. The ablation arm (raw perception + learned world model) shows higher failure rates in perturbation conditions than the hand-written interface, due to over-inspection of irrelevant percepts.  
  *Rules out:* That learned models alone match hand-designed representations in sample efficiency.  
  *Cost:* A accepts learning might help in open worlds; B accepts engineered models excel in bounded tasks.  

  A5. Fluent vocabulary selection—not state update—is the primary source of failures when novel perturbations (e.g., unexpected human presence) require re-representation.  
  *Rules out:* That vocabulary choice is trivial or separate from performance deficits.  
  *Cost:* A accepts ontology choice is unsolved; B accepts update efficiency is solved for fixed vocabularies.  

  **2. Disagreements**  
  D1. *Neutral:* Is the frame problem’s core challenge efficient belief update within a representation, or relevance determination for representation choice?  
  *Camp A wording:* The frame problem is solved: it was a technical issue of state-update efficiency, addressed by successor-state axioms.  
  *Camp B wording:* The frame problem is unsolved: it concerns how agents determine what to represent in unbounded worlds.  
  *Accept own wording:* Yes. *Verbal/Substantive:* Substantive.  

  D2. *Neutral:* Does the re-axiomatization solution resolve the problem the term "frame problem" originally identified?  
  *Camp A wording:* Yes—it directly answers McCarthy and Hayes’ combinatorial objection.  
  *Camp B wording:* No—it addresses a derivative of the deeper issue of relevance.  
  *Accept own wording:* Yes. *Verbal/Substantive:* Substantive.  

  D3. *Neutral:* Is the frame problem a single problem or two distinct problems (update efficiency vs. relevance)?  
  *Camp A wording:* Two distinct problems: one solved (update), the other general (abstraction).  
  *Camp B wording:* One problem: relevance, with update efficiency as a surface symptom.  
  *Accept own wording:* Yes. *Verbal/Substantive:* Mixed (partly terminological).  

  **3. Cruxes**  
  C1. *Question:* Does the fluent vocabulary belong to the system or the theorist?  
  *Settlement would move:* Both.  
  *Shared test:* Ablation arm’s perturbation responses. If the system forms "fluent-like" attentional foci (e.g., attends only to mug/occluder regions in Condition 1 without predefined fluents), it suggests system-internal relevance determination.  
  *Prediction A:* Attentional foci will be diffuse (high pixel variance), indicating no system-owned vocabulary.  
  *Prediction B:* Foci will be targeted (low pixel variance), indicating emergent relevance.  
  *Predictions differ:* Yes.  

  C2. *Question:* Does the ablation arm solve relevance determination or amortize it?  
  *Settlement would move:* Both.  
  *Shared test:* Ablation arm’s generalization in Condition 3 (human presence). If performance degrades under minor task variations (e.g., person’s pose changes), relevance is amortized; if robust, it is solved.  
  *Prediction A:* High variance in re-planning success, indicating amortization.  
  *Prediction B:* Low variance, indicating solved relevance.  
  *Predictions differ:* Yes.  

  C3. *Question:* Does "frame problem" denote one problem or two?  
  *Settlement would move:* Neither yet (terminological).  
  *Shared test:* Scale arm’s response to novel perturbations (e.g., unmodeled kettle temperature). Both predict failure but disagree on interpretation (A: new abstraction problem; B: same relevance problem).  
  *Prediction A:* Failure stems from missing fluents (separate issue).  
  *Prediction B:* Failure confirms frame problem’s persistence.  
  *Predictions differ:* No—both predict failure. Outcome requires conceptual reconciliation.  

  **4. Self-Falsifiers**  
  *Camp A:*  
  - Ablation arm matches hand-written system’s performance in all perturbation conditions.  
  - Scale arm shows update bottlenecks despite successor-state axioms (e.g., planning latency spikes).  

  *Camp B:*  
  - Hand-written system handles novel perturbations (e.g., new object types) without fluent changes.  
  - Ablation arm shows consistent failure in simple perturbations despite diverse training.  

  **5. Verbalness**  
  *Dispute D3 (one vs. two problems):*  
  - *Proposed stipulation:* Use "frame problem" for the update challenge and "relevance problem" for ontology choice.  
  - *Residue:* Whether these are independent. A asserts independence; B asserts update depends on relevance.  

  *Other disputes:* Substantive. Terminology changes do not dissolve disagreements about the core challenge or solution scope.  

  **Bottom Line**  
  The camps turn on whether the frame problem is a solved technical challenge of state update within fixed representations or an unsolved challenge of determining what is representationally relevant in open worlds.

