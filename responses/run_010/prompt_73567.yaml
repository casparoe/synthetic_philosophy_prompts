     *Cost:* Camp A gives up the claim that the hand-written approach is the only way (they might accept that the ablation is worse). Camp B gives up the claim that the hand-written approach is always worse (they might accept that for this battery, the hand-written is better).

     A4. *Claim:* In the scale arm of the battery (with 4,000 fluents), the system using successor-state axioms maintains a manageable update time for fluents during plan execution, while a system without such axioms would be computationally infeasible.  
     *What it rules out:* It rules out that the successor-state solution does not scale with the number of fluents.  
     *Cost:* Camp A: none (this is their point). Camp B: concedes scalability for fixed ontology.

     A5. *Claim:* The problem of selecting an appropriate set of fluents for a given domain is an open and difficult problem.  
     *What it rules out:* It rules out that the choice of fluents is trivial or that any fixed set of fluents is sufficient for all situations.  
     *Cost:* Camp A: concedes that the choice of fluents is a problem (though not the frame problem). Camp B: gives up the claim that the frame problem is only about the choice of fluents (they accept that once chosen, the bookkeeping is solved).

  2. **Disagreements**  
