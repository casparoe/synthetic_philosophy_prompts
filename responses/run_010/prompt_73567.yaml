  6. *Candidate:* The frame problem is the problem of avoiding the need to explicitly state what does not change, and it was solved by successor-state axioms.  
     *Label:* Slanted toward A.  
     *Why:* It states A's position as fact, ignoring B's objection.

  7. *Candidate:* The frame problem is the problem of how an agent, embedded in a dynamic world, can attend to what is relevant without having to consider everything.  
     *Label:* Slanted toward B.  
     *Why:* It focuses on the situated aspect and relevance, which is B's emphasis.

  8. *Candidate:* The frame problem, as originally defined, was a technical problem of combinatorial explosion in representing change, which has been solved; what remains are problems of perception and abstraction.  
     *Label:* Slanted toward A.  
     *Why:* It separates the technical problem (solved) from others, which is A's view.

  9. *Candidate:* The frame problem, as originally defined, was about the difficulty of specifying what changes and what stays the same in a changing world, and this difficulty reappears at the level of ontology selection.  
     *Label:* Usable.  
     *Why:* It connects the original problem to ontology selection, which is a point of contact between the camps.

  10. *Candidate:* The frame problem is the problem of how to represent the world so that the system can efficiently update its beliefs and actions, and this requires both efficient axioms and a process for selecting the right representations.  
      *Label:* Vacuous.  
      *Why:* It blandly combines both without addressing the disagreement about whether the representation selection is part of the frame problem.

