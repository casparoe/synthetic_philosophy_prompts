     C3. *Question:* Does the performance in the perturbation conditions depend primarily on the efficiency of the update mechanism (successor-state axioms) or on the choice of fluents?  
     *Settlement would move:* Both.  
     *Shared test:* In the hand-written system, vary the set of fluents (e.g., add redundant fluents or remove important ones) and measure the effect on the number of fluents consulted and the re-planning time in the perturbation conditions.  
     *Prediction Camp A:* The number of fluents consulted and re-planning time will scale with the number of fluents, but the update mechanism (successor-state axioms) will keep the update time manageable even with more fluents.  
     *Prediction Camp B:* The choice of fluents (e.g., including fluents that capture the right aspects) will have a greater impact on performance than the update mechanism; for instance, with a poorly chosen set of fluents, the system may fail to detect the perturbation even with efficient update.  
