  Device output for zoning proposal "Riverbend Commercial" (ID: Z-445) is flagged as "STRICTLY PREFERRED" (Aggregate Utility: +112.3 utils). This proposal grants Developer A $1.2M profit (+150 utils via device calibration) while imposing minor noise/light pollution on nine households (-4.2 utils each, net -37.8 utils). Net positive, yes, but households are worse off. We require a "worst-off protection" mode or fairness threshold setting. Current output is politically unsustainable.  

  **Agent: Martin T. (Tier 1 Support) (10/23 14:45):**  
  Thank you for your query. Social Observer operates under core module SO-AGG-001 ("Cardinal Aggregation"). Output reflects aggregate utility per licensed functionality. "Worst-off protection" would violate SO-AGG-001's foundational axioms (ref: Known Issue KI-774). For distribution-sensitive metrics, please explore our *Impartial Observer Suite* (add-on module SO-IOS-005, requires separate licensing). This module incorporates an equiprobable self-location assumption during onboarding, yielding equal weighting. Base license SO-AGG-001 does not include weighting presets.  

  ---

  **Ticket Update #SO-774-9DX3-2**  
  **Cedar Glen Planning Commission (10/24 09:15):**  
  We never agreed to unequal weights! Why wasn’t equal weighting default? IOS module costs $8k/year. Explain why "fair mode" is an *add-on*.  

  **Agent: Martin T. (10/24 10:01):**  
  SO-AGG-001 is weighting-agnostic by design. Weights derive solely from your group’s state-dependent utility calibrations during onboarding (ref: User Guide §4.3). The IOS module’s equiprobable assumption is an *optional onboarding stance*, not a core aggregation feature. It cannot be retrofitted. Tier 2 can confirm SO-AGG-001’s compliance with vNM social rationality requirements.  

  ---

  **Ticket Escalated to Tier 2: Ref #SO-774-9DX3-T2**  
  **Agent: Lena R. (Tier 2 Support) (10/24 11:30):**  
  Per your request: Enabling distributional metrics (e.g., min/max, variance) would violate the Independence Axiom (ref: SO-AGG-001 Design White Paper §2.1). Example: If Proposal X is socially preferred to Y, but adding a third option Z (e.g., a trivial public event) flips the ranking between X/Y based on distribution, the device would generate time-inconsistent outputs. SO-AGG-001 maintains temporal coherence by design. IOS module avoids this by fixing weights *before* state definition.  

  ---

  **Ticket Update #SO-774-9DX3-4**  
  **Cedar Glen Planning Commission (10/25 15:22):**  
