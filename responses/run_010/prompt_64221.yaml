  Final Answer:

  **Verdict for the new case: Inauthentic.**

  **Rule:** The professor requires that the material survived against the interest of at least one community that preserved it. Multiple attestation by independent sources is only weighty when the sources have divergent interests (so that the saying must have been present before the divergence and survived despite the divergence). Embarrassment in a single stream is the same requirement from a single source: the saying survived even though it was against the community's interest.

