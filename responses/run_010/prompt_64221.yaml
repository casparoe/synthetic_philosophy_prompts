  Therefore, the verdict for the new case should be **inauthentic**.

  Now, what rule is she running? She is demanding that the material survived against someone's interest. Convergent witnesses count only when their interests diverged (as in case 1). Embarrassment in a single stream counts because it is the same demand seen from inside a single stream (as in case 2). The new case lacks both: no embarrassment and the multiple witnesses share the same interest (they all want the saying).

