prompt: |-
  I have been asked to submit a one-page statement of my methodological commitments for a departmental workshop on evolutionary explanation, and I would like a critical audit of the set before I circulate it. What I hold is this:

  (1) The Gould–Lewontin critique is correct in substance: the default hypothesis for any phenotypic trait should be that it is a byproduct of architecture, development, or phylogenetic history, and the burden of proof falls on anyone who calls it an adaptation.

  (2) Nothing in (1) requires me to posit a rival creative force. A spandrel is a necessary consequence of the way the rest of the organism was built by selection, so byproducts owe their existence to adaptations elsewhere without themselves being adapted.

  (3) "Exaptation" is worth keeping only as a disciplined label. The current usefulness of a trait entitles me to call it an exaptation only once I have independently established the prior adaptive function from which it was co-opted; absent that, the term is doing no explanatory work at all.

  (4) In my own work I treat the male mammalian nipple as a spandrel, and I treat the precursors of bird feathers as non-adaptive byproducts of the developmental program that produces reptilian scales, co-opted only later for flight and for display.

  (5) Where I do posit adaptation, I regard close fit between an optimality model and the observed phenotype as strong evidence for it: selection is a powerful enough optimizer that any trait it has had long enough to shape sits near its fitness peak.

  (6) Appeals to developmental constraint, allometry, or phylogenetic inertia seem to me to be placeholders rather than explanations unless they are cashed out in terms of what the trait in question does for the organism.

  (7) I am entirely willing to use adaptationist reasoning as a heuristic for generating hypotheses in the lab, so long as the resulting claims are then tested against non-adaptive alternatives.

  Please audit the package. Which of these genuinely pull against one another, and which merely look as though they do? Order the real tensions by severity rather than treating them as equally bad, and for each say what has to give, what the cheapest revision would be, and what that revision costs me elsewhere in the set. Then tell me which single change would repair the most damage. Argue from the logic of the positions themselves rather than from the literature: I want the reasoning, not a reading list.
reasoning: |-
  Okay, the user is asking for a critical audit of their methodological commitments regarding evolutionary explanation. They've listed seven points and want to know which ones conflict, how severe the conflicts are, and how to resolve them. 

  First, I need to understand each point clearly. Point (1) emphasizes the Gould-Lewontin critique, saying the default should be that a trait is a byproduct unless proven adaptive. Point (2) clarifies that spandrels aren't from a rival force but are byproducts of adaptations elsewhere. Point (3) is strict about exaptation, requiring proof of prior adaptive function. Point (4) gives examples like male nipples as spandrels. Point (5) says close fit to optimality models is strong evidence for adaptation. Point (6) argues that constraints need to be explained in functional terms. Point (7) allows adaptationist reasoning as a heuristic for hypothesis generation.

  Now, looking for tensions. The biggest clash seems between (5) and (1)/(2). (5) relies heavily on optimality as evidence for adaptation, but (1) says the burden of proof is on adaptation claims. Optimality models alone might not meet that burden if they don't rule out non-adaptive explanations. (5) also assumes traits are near fitness peaks, which contradicts (4)'s examples where traits are co-opted later. 

  Another tension is between (6) and (1). (6) says explanations like developmental constraints must be "cashed out" functionally, but (1) treats non-adaptive explanations as valid defaults. Demanding functional explanations for constraints might undermine the critique in (1). 

  (3) and (4) could conflict. (3) requires proof of prior function for exaptation, but in (4), bird feather precursors are called non-adaptive. If we don't know their prior function, calling them exaptations later might violate (3)'s strictness. 

  (7) is actually consistent with the rest if used carefully as a heuristic. The key is ensuring tests against non-adaptive alternatives, which aligns with (1).

  Prioritizing, the (5)-(1)/(2) conflict is most severe because it challenges the core burden of proof. Fixing this might mean softening (5) to say optimality is evidence but not sufficient without excluding alternatives. This preserves (1)'s default but costs some confidence in optimality models. 

  The (6)-(1) tension is next. Relaxing (6) to allow non-functional explanations for constraints would help, but it might seem like giving ground on rigor. 

  The cheapest fix overall is revising (5), as it resolves the biggest conflict while keeping the framework intact. The user seems to value methodological rigor, so emphasizing thorough testing over model fit alone should align with their goals.
answer: |-
  Here's a critical audit of your methodological commitments, ordered by severity of internal tensions, with revisions prioritized for coherence:

  **1.  Severe Tension: (5) vs. (1), (2), & (4)**
      *   **Conflict:** (5) treats close fit to an optimality model as *strong evidence* for adaptation. However, (1) establishes the non-adaptive explanation as the default, placing a high burden of proof on adaptation claims. (2) & (4) explicitly endorse non-adaptive origins (spandrels, non-adaptive precursors). Optimality models alone cannot distinguish:
          *   A trait shaped *to* an optimum *by* selection.
          *   A non-adaptive byproduct that *happens* to be near an optimum due to architecture, development, or history.
          *   A trait co-opted *from* a non-adaptive state *to* a new function (as in your feather example, (4)) where the "fit" is to the *new* function, not the origin.
      *   **What Has to Give:** The evidential weight assigned *solely* to optimality fit in (5). It cannot be "strong evidence" *on its own* under your framework.
      *   **Cheapest Revision:** Qualify (5): "Where I do posit adaptation, a close fit between an optimality model and the observed phenotype *can be consistent with adaptation*, but **it is not sufficient evidence**. Strong evidence requires additionally demonstrating that the trait is unlikely to be a byproduct or co-opted from a non-adaptive precursor (per (1)), and that alternative non-adaptive explanations (architectural constraint, developmental pathway, phylogenetic inertia) are less plausible." (Emphasis added).
      *   **Cost:** Reduces the power/confidence you can place in optimality models alone. Increases the burden of proof for adaptation claims using modeling, aligning it with (1).

  **2.  Significant Tension: (6) vs. (1) & (2)**
      *   **Conflict:** (6) demands that explanations invoking constraint/inertia must be "cashed out" in functional terms ("what the trait does *for* the organism"). This directly contradicts the core of (1) and (2). (1)/(2) assert that traits can exist *because* of non-functional reasons (architecture, development, history) – their existence *doesn't* need a current or past functional explanation *for that specific trait*. Requiring a functional "cashing out" undermines the autonomy of non-adaptive explanations you endorse.
      *   **What Has to Give:** The requirement that constraint/inertia explanations *must* be cashed out functionally. This imposes an adaptationist logic onto the very alternatives meant to challenge it.
      *   **Cheapest Revision:** Revise (6): "Appeals to developmental constraint, allometry, or phylogenetic inertia are **genuine explanations when they identify specific, causally sufficient non-adaptive factors** (e.g., physical laws, conserved developmental pathways, historical contingency) that adequately account for the trait's origin and/or form. While these factors may have functional consequences, positing the constraint itself does not inherently require justification via current or past function *of the trait in question*." (Emphasis added).
      *   **Cost:** Weakens the demand for functional "cash value," potentially allowing weaker constraint arguments. However, it strengthens the demand for *specific causal mechanisms* behind the constraint, making them more than just placeholders without imposing adaptationist logic.

  **3.  Potential Tension: (3) vs. (4) (Conceptual, not necessarily operational)**
      *   **Conflict:** Your strict definition of exaptation (3) requires *independent establishment* of a prior *adaptive* function. In your feather example (4), you describe the precursors as *non-adaptive byproducts*. Calling feathers an "exaptation" for flight/display under (3) would therefore be invalid until you can prove the scale precursors *had* an adaptive function (which you explicitly deny).
      *   **Nature:** This is less a direct contradiction in your current examples and more a conceptual boundary issue. Your (4) example highlights the *precursors* as non-adaptive; the *co-opted structure* (feathers) gains a new function. Calling the *feathers* an exaptation for flight is technically consistent with (3) *if* you can show the scale precursors had *some* prior adaptive function. But you explicitly state they were *non-adaptive*. So, under (3), you couldn't call feathers an "exaptation" at all – you'd simply say a non-adaptive precursor was co-opted.
      *   **Resolution Needed?** Your stance is logically consistent *if* you avoid the term "exaptation" for traits co-opted from non-adaptive origins and only use it for shifts from one *adaptive* function to another. (3) forces this precision.
      *   **Cheapest Revision:** None strictly necessary for coherence *if* you are scrupulous in language. In (4), simply avoid calling feathers an "exaptation" (stick to "co-opted non-adaptive precursor"). Alternatively, clarify (3) to explicitly state that "exaptation" applies *only* to shifts from prior *adaptations*, and use a different term (like "co-option") for shifts from non-adaptive traits.
      *   **Cost:** If revising (3), it costs terminological precision. If not revising, it costs the convenience of using "exaptation" broadly for any functional shift.

  **Other Points:**
  *   **(1) & (2):** Coherent and mutually reinforcing.
  *   **(7):** Entirely consistent with (1) and the overall framework. It explicitly subordinates the adaptationist heuristic to empirical testing against alternatives.

  **The Single Most Impactful Change:** **Revising (5) as proposed.** This directly addresses the most severe conflict by aligning your standard of evidence for adaptation claims with your foundational commitment (1) to the non-adaptive default and high burden of proof. It preserves the *usefulness* of optimality modeling (as a source of hypotheses, for exploring functional consequences, as *consistent* with adaptation) while preventing it from short-circuiting the critical evaluation demanded by the Gould-Lewontin critique. This revision strengthens the logical core of your package without abandoning modeling or adaptationist reasoning, merely demanding it meets the high bar you set in (1). The cost (reduced confidence in optimality fit alone) is necessary for internal consistency and is a price explicitly paid by the framework you endorse.
