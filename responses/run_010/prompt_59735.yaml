  My dad turns 70 in the spring and he's kind of spiraling about retirement. A coworker swore Cicero wrote a whole essay showing that fear is just confused — that old age doesn't actually take away anything that mattered, since the body was never the point and your finally free of the appetites that were making you miserable anyway. So I figured I'd just send him the thing and be done with it. Does it actually establish that? I skimmed it and like a quarter of it is about farming — vines, grafting, the whole bit — which he'd find insulting, and I can't tell what that's doing in an argument about aging.
