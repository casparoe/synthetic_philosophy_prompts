prompt: |-
  I've been on our faculty conduct panel for a couple of years now and there's a move I keep running into that I don't have a word for. Someone gets deplatformed, or dropped by their publisher, or loses their column, and the people doing it insist this isn't punishment at all — no rule has been broken, we're simply exercising our own freedom not to associate, nobody owes you an audience. That framing does real work, because it dissolves every question we'd have to answer if it *were* punishment: was the sanction proportionate, was there a hearing, does the person even know what they're being held to have done. And yet the effect on them is, for all practical purposes, exactly what a penalty looks like — income gone, colleagues who used to write now crossing the road, a public marker attached to thier name that they have no way of answering.

  Then there's the second half, which may or may not be the same thing. Each individual act in the pile is a private choice that's trivially defensible on its own: a bookshop decides not to stock you, a festival decides not to invite you, a journal declines to referee. Nobody is doing anything wrong, and yet the accumulation is harsher than anything a court could have ordered, there's no one to appeal to, and no single agent whose change of behaviour would make a difference.

  So — does this have a name? I can see the neighbours: something about responsibility diffusing across many agents, something about whether private conduct should ever count as state action, "informal sanctions" generally. But none of them seems to cover the two-part thing I'm after, where the denial that it's punishment is precisely what lifts the constraints on it, and where that denial is licensed by the fact that no individual contribution is objectionable. If there's an established concept, tell me which and how much of my description it actually gets; if there isn't, coin one, define it, and tell me where the edges are — what would have to change about a case for it to stop being an instance? I'm after the carving, not just the label.
reasoning: |-
  Okay, the user is describing a specific phenomenon they've observed on their faculty conduct panel. They’re frustrated by how individuals face severe consequences—like losing income, reputation, and professional connections—without any formal process. The key twist is that those imposing the consequences deny it’s punishment, framing it as mere exercise of freedom not to associate. This allows them to bypass accountability measures like hearings or proportionality checks.  

  The user also highlights how the cumulative effect of many private decisions (e.g., bookshops dropping someone, journals refusing submissions) creates an outcome harsher than formal penalties, yet no single actor feels responsible. They’re asking for a term that captures this two-part dynamic: the denial-as-enabler and the diffusion-of-responsibility.  

  First, I need to map existing concepts they’ve considered:  
  - *Diffusion of responsibility*: Fits the second half (many small actions), but misses the denial-of-punishment angle.  
  - *Informal sanctions*: Too broad; doesn’t specify the structural avoidance of accountability.  
  - *State action doctrine*: Irrelevant here since it’s private actors.  

  **Gap**: No term fully captures both the *rhetorical framing* ("not punishment") enabling unconstrained consequences *and* the *structural fragmentation* of responsibility.  

  **Proposing a new term**:  
  - *Structural disenfranchisement*: Too vague.  
  - *Accountability laundering*: Better—evokes "money laundering" but for moral/legal responsibility. It hints at obscuring punitive intent behind neutral language.  
  - *Diffused punishment*: Descriptive but lacks the framing aspect.  

  **Refining "accountability laundering"**:  
  - **Core mechanics**:  
    1. **Rhetorical distancing**: Using "freedom of association" to deny punitive intent.  
    2. **Structural diffusion**: Many actors independently opting out, creating collective severity.  
  - **Edges**: It wouldn’t apply if:  
    - A single entity orchestrates the exclusion (no diffusion).  
    - The excluders admit it’s punitive (no laundering).  
    - Proportionality checks exist (e.g., platform appeals process).  

  **User’s deeper needs**:  
  - They likely want to articulate this phenomenon in academic/policy discussions.  
  - May seek leverage to challenge such practices by naming them.  
  - Values precision ("the carving, not just the label").  

  **Final pitch**: "Accountability laundering" fits best. It’s vivid, covers both parts, and implies moral criticism—which aligns with their frustration about unfairness. I’ll clarify its boundaries and why adjacent terms fall short.
answer: |-
  This phenomenon you're describing is acutely observed and deeply problematic—it **lacks a single established term**, but its mechanics are recognizable. The closest existing concepts are partial fits at best. I'll synthesize your description, propose a new term, define it, and carve its boundaries.

  ---

  ### The Core Mechanism: A Two-Part Dynamic
  1. **Rhetorical Disavowal**:  
     Actors frame exclusion as "neutral choice" (freedom of association, editorial discretion) rather than punishment. This avoids procedural constraints (due process, proportionality, transparency).  
  2. **Structural Diffusion**:  
     Consequences arise from many independent private decisions. No single actor causes the harm, yet the aggregate effect is catastrophic (career loss, social exile).  

  This creates an **accountability vacuum**: the denial of punishment removes safeguards, while diffusion prevents attribution of responsibility. The outcome is *de facto* punishment without *de jure* recognition.

  ---

  ### Proposed Term: **Accountability Laundering**  
  *(By analogy to money laundering: obscuring the source/character of something consequential)*  

  **Definition**:  
  > A social or institutional process whereby punitive consequences (professional, reputational, or material) are inflicted on an individual through coordinated or emergent private actions, while rhetorically disavowing punitive intent. This exploits liberal norms (free association, private choice) to circumvent accountability structures that would constrain formal punishment.  

  ### Key Features:
  - **Disavowal as Enabler**:  
    Claims like "no one owes you a platform" or "this is just business" neutralize demands for justification. The *rejection* of the punishment label is what permits unconstrained severity.  
  - **Aggregate Harm**:  
    Individually defensible acts (e.g., one bookstore dropping a book) combine into systemic exclusion. The whole exceeds the sum of its parts.  
  - **No Recourse**:  
    With no central actor or stated rule, appeals are impossible. The target confronts a "fog of neutrality."  
  - **Plausible Deniability**:  
    Each participant can claim innocence ("I just chose not to collaborate"), obscuring collective outcome.  

  ---

  ### Boundaries: When Does This *Not* Apply?  
  1. **Single-Actor Exclusion**:  
     If one entity (e.g., a university) revokes tenure *while calling it punishment*, it’s formal sanction—not accountability laundering. The key is the disavowal + diffusion.  
  2. **Transparent Coordination**:  
     If groups openly conspire to destroy someone (e.g., a blacklist), it becomes a boycott or conspiracy—not laundering, as intent is overt.  
  3. **Proportional Consequences**:  
     If the outcome is minor (e.g., one rejected article), it lacks the catastrophic aggregate effect. Laundering requires life-altering harm.  
  4. **State Action**:  
     If government pressure drives the exclusion (e.g., threatening publishers), it veers into state punishment or censorship. Laundering is *private-sector orchestrated*.  
  5. **Justified Exclusion**:  
     If clear, articulated norms were violated (e.g., plagiarism) and actors cite this, it edges toward formal accountability—even if decentralized.  

  ---

  ### Why Existing Terms Fall Short  
  - **"Diffusion of Responsibility"**:  
    Captures the multi-actor problem but misses the *rhetorical disavowal* that enables unchecked severity.  
  - **"Informal Sanction"**:  
    Too broad. Includes gossip or shunning without systemic professional destruction.  
  - **"Cancel Culture"**:  
    Politicized and vague. Focuses on public backlash, not institutional avoidance of due process.  
  - **"Chilling Effect"**:  
    Describes self-censorship *preceding* punishment, not the punishment mechanism itself.  
  - **"State Action Doctrine"**:  
    Addresses when private acts resemble state punishment, but your cases lack state involvement.  

  ---

  ### Where This Concept Bites  
  Accountability laundering thrives in liberal societies prioritizing individual choice over collective impact. It’s potent because:  
  - **Ethically**, it weaponizes autonomy against justice.  
  - **Legally**, it dodges scrutiny by masquerading as "private preference."  
  - **Socially**, it creates irreversible stigma with no path to redemption.  

  Your faculty’s challenge: recognizing that "freedom not to associate" can, in aggregate, become a tool of unaccountable power. Naming this—**accountability laundering**—exposes the laundering mechanism itself, forcing a reckoning with outcomes over intent. The concept carves reality at the joint where procedural safeguards dissolve into diffuse harm.
