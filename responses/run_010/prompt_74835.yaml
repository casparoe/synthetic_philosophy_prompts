prompt: |-
  Spent basically all of yesterday arguing with a friend about the Allais paradox and we came out more annoyed than informed. He's a hardliner on the independence axiom: thinks the common-consequence switch is a performance error or a confused preference, and he leans hard on the dynamic stuff — money pumps, sequential choice, the line about how if you'd pay to be pumped you dont really have preferences worth theorizing about. I'm on the other side. I think the switch is one of the most robust patterns in the whole literature, that probability weighting is just what people do, and that declaring it irrational is mostly a way of protecting an axiom from having to earn its keep.

  Write the joint statement the two of us should have produced instead. I want numbered claims we'd both actually sign — including about the classic sure-thing pair itself, and about what the money-pump argument does and doesn't establish (I know there's something about sophisticated choice and about being forced to pick sequentially, get that exactly right). Then a table of the residual disagreements, each worded so the side holding it would say yes, that's what I mean. Then the cruxes: the sub-questions where settling one would actually move somebody. For each, give the test or argument both of us would accept as bearing on it, and write each side's prediction down in advance.

  Build this in: suppose a new preregistered study lands where the switch survives every rewording, incentive level and repeat measure they can think of, but vanishes completely when the "certain" option is a signed contract for a fixed salary rather than a lump sum. Both camps are going to claim that result. Put it where it belongs in the document and show what each of us does with it.

  And if you think some chunk of our fight is just about the word rational, or about what a preference is supposed to be, say which chunk and mark it as settled by stipulation rather than pretending we still disagree.
reasoning: |-
  We are two friends who have debated the Allais paradox extensively. We agree on some points and disagree on others. Below is a joint statement we both endorse, followed by a table of residual disagreements, and then a set of cruxes with testable predictions. We also address a hypothetical new study.

  ## Joint Statement: Points of Agreement

  1. **The Allais Paradox Pattern**: The Allais paradox (common-consequence effect) is a robust empirical pattern in which many people prefer:
     - Option A: $1 million for sure (over Option B: $5 million with 10% chance, $1 million with 89%, nothing with 1%)
     - But then prefer:
     - Option D: $5 million with 10% chance (and nothing otherwise) over Option C: $1 million with 11% chance (and nothing otherwise)
     This pattern violates the independence axiom of expected utility theory (EUT).

  2. **The Independence Axiom**: The independence axiom states that if you prefer lottery A over lottery B, then you should prefer a mixture of A with any other lottery (with probability p) over the same mixture of B with that lottery. The common-consequence switch (as in Allais) is a direct violation of this axiom.

  3. **Money Pump Argument**: 
     - The money pump argument claims that if an agent has intransitive preferences (or violates axioms like independence in a way that leads to dynamic inconsistency), they can be exploited by a sequence of trades that leaves them worse off. 
     - However, we agree that the money pump argument in the context of the Allais paradox relies on specific dynamic choice scenarios. 
     - We further agree that if an agent uses **sophisticated choice** (i.e., they anticipate their future choices and plan accordingly to avoid being pumped) or if the choice is made in a **single shot** (without sequential opportunities for exploitation), then the money pump may not occur. 
     - Therefore, the money pump argument does not universally establish that violating the independence axiom is irrational in all contexts; it only highlights a potential vulnerability in sequential choice settings without sophisticated planning.

  4. **Interpretation of the Hypothetical Study**: 
     - Suppose a new preregistered study shows that the Allais pattern (common-consequence switch) persists across various rewordings, incentive levels, and repeated measures, but disappears when the "certain" option is replaced by a signed contract for a fixed salary (instead of a lump sum). 
     - We agree that this result would be important and would require explanation. 
     - We both acknowledge that this finding would challenge a simple story that the switch is solely due to probability weighting (as in prospect theory) because the certainty effect is context-dependent. However, we have different interpretations (see Residual Disagreements).

  ## Table of Residual Disagreements

  | Disagreement | Friend 1 (Hardliner on Independence) | Friend 2 (Pro-probability weighting) |
  |--------------|--------------------------------------|--------------------------------------|
  | **1. Rationality of the common-consequence switch** | The switch is irrational because it violates a fundamental axiom of rational choice (independence) and can lead to dynamic inconsistency (money pumps). It is a performance error or a confused preference. | The switch is a rational expression of how humans value certainty. Probability weighting (as in prospect theory) is a valid component of preference and not an error. The independence axiom is not a necessary requirement for rationality. |
  | **2. Interpretation of the money pump** | The money pump argument shows that violating independence is pragmatically self-defeating in sequential choice. Even if sophisticated choice avoids pumping, the need for such defensive strategies reveals a flaw in the underlying preferences. | The money pump argument is overblown because it relies on artificial sequential setups. In real life, people don't face such pumps, and sophisticated choice is a rational response. The argument doesn't apply to one-shot choices. |
  | **3. Response to the hypothetical study** | The study shows that the certainty effect is not about probability weighting per se but about the framing of certainty. When certainty is reframed as a contract (removing the emotional weight), the effect vanishes, proving that the switch was a cognitive illusion. | The study shows that the certainty effect is context-dependent. The contract frame might reduce the psychological weight of certainty, but probability weighting still holds in other frames. The switch is a valid preference that depends on presentation. |

  ## Cruxes: Testable Sub-questions

  For each crux, we state the test or argument both accept as bearing on it, and each side's prediction.

  ### Crux 1: Does the common-consequence switch persist in high-stakes, repeated, incentivized settings?

  - **Test**: Run a well-powered, preregistered experiment with real monetary incentives (scaled to be significant, e.g., several months of income) and repeated trials (to allow learning). Use the classic Allais pairs and variations. Measure choice proportions.
  - **Friend 1 Prediction**: The switch rate (violation rate) will decrease substantially with high stakes and repetition, approaching zero. (Performance errors should reduce with incentives and learning.)
  - **Friend 2 Prediction**: The switch rate will remain robust, though possibly reduced, but still significantly above zero. (Probability weighting is a stable feature of preference.)

  ### Crux 2: Is the money pump a practical concern?

  - **Test**: Design a sequential money pump scenario based on the Allais preferences. Recruit participants who exhibit the Allais switch in a prior screening. Offer them a series of choices that could lead to a money pump. Use real money. Measure the frequency of actual pumping (i.e., ending up with a dominated outcome).
  - **Friend 1 Prediction**: A significant fraction of participants (e.g., >30%) will be pumped at least once, demonstrating the practical vulnerability.
  - **Friend 2 Prediction**: Few participants (e.g., <10%) will be pumped, because they will use sophisticated choice (e.g., pre-commitment) or the artificial setup will be transparent.

  ### Crux 3: Is the certainty effect driven by the "lump sum" framing?

  - **Test**: Using the hypothetical study described (where the switch vanishes when the certain option is a contract), we both accept this as a valid test. Now, we design a follow-up to isolate the mechanism. We compare:
     - Frame 1: Classic lump-sum certainty.
     - Frame 2: Contractual certainty (as in the study).
     - Frame 3: Certainty described as a guaranteed outcome without monetary details (to test if it's about the tangibility of money).
     - Frame 4: A non-monetary certainty (e.g., a guaranteed vacation).
  - **Friend 1 Prediction**: The switch will only occur in Frame 1 (and maybe Frame 3/4 if they evoke the same emotional response). The effect is tied to the framing of "winning a prize" and is not a general property of certainty.
  - **Friend 2 Prediction**: The switch will occur in Frames 1, 3, and 4, but not in Frame 2. The contract frame is a special case that reduces the emotional weight, but probability weighting is still present in other certainty frames.

  ## Semantic Disagreement: The Meaning of "Rational"

  We acknowledge that part of our disagreement is about the definition of "rational" and "preference". 

  - Friend 1 uses a **normative** definition: Rationality requires conformity to axioms (like independence) that avoid dynamic inconsistency and ensure consistent choice.
  - Friend 2 uses a **descriptive-ecological** definition: Rationality is about making choices that are adaptive in real-world environments, even if they violate axioms in artificial lab settings.

  We agree to stipulate that:
  - We are using different definitions of rationality. 
  - Friend 1 is using "rational" in the sense of **adherence to the axioms of EUT**.
  - Friend 2 is using "rational" in the sense of **psychologically plausible and ecologically valid heuristics**.
  - Therefore, we can avoid circular debates by specifying which sense we mean. However, we still disagree on whether EUT axioms are the only valid standard for rationality (see Residual Disagreement 1).

  ## Conclusion

  This document captures our agreements, residual disagreements, and cruxes. We commit to updating our beliefs based on the outcomes of the tests above.
answer: |-
  ### Joint Statement on the Allais Paradox  
  *(Signed by both parties)*  

  1. **Empirical Robustness of the Common-Consequence Switch**:  
     The Allais paradox demonstrates a consistent pattern: individuals typically prefer:  
     - **Option A**: $1M with certainty  
       over  
       **Option B**: {$5M, 0.10; $1M, 0.89; $0, 0.01}  
     but reverse their preference to:  
     - **Option D**: {$5M, 0.10; $0, 0.90}  
       over  
       **Option C**: {$1M, 0.11; $0, 0.89}.  
     This switch violates the independence axiom of Expected Utility Theory (EUT) and replicates across diverse samples, incentives, and framings.  

  2. **Status of the Independence Axiom**:  
     The independence axiom is foundational to EUT. Violations imply that preferences cannot be represented by linear probability weighting. We agree the axiom is *normatively compelling* for deterministic, consistent choice but *empirically violated* in Allais-type tasks.  

  3. **Money Pumps: What They Do (and Don’t) Establish**:  
     - Money pumps *only* demonstrate vulnerability when three conditions hold:  
       (i) Choices are sequential and myopic (no advanced planning),  
       (ii) The agent cannot commit to future actions,  
       (iii) The violator is naive (not sophisticated about their own inconsistency).  
     - They *do not* prove that violating independence is inherently irrational in:  
       - **Sophisticated choice**: Where agents pre-commit to a strategy avoiding exploitation.  
       - **Static (one-shot) decisions**: Where no sequential exploitation is possible.  
     - Thus, money pumps highlight a *practical risk* in specific dynamic contexts, not a universal flaw in preferences.  

  4. **Interpretation of the New Study (Contract vs. Lump Sum)**:  
     A preregistered study shows the Allais switch vanishes when the "certain" option is a binding salary contract but persists for probabilistic lump sums. We agree this:  
     - **Refutes** accounts attributing the switch *solely* to linear probability weighting.  
     - **Supports context-dependence**: The switch is modulated by framing (contractual certainty vs. "windfall" certainty).  
     - **Does not resolve** whether the framing effect is rational or erroneous.  

  ---

  ### Table of Residual Disagreements  
  *(Each row states a position as its holder would articulate it)*  

  | Disagreement                                                                 | Friend 1 (Independence Axiom Hardliner)                                                                 | Friend 2 (Probability-Weighting Advocate)                                                                 |  
  |------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------|  
  | **1. Rationality of the common-consequence switch**                          | “The switch is a cognitive error: people misweight probabilities under certainty, leading to incoherent preferences that should be corrected.” | “The switch reflects valid context-sensitive preferences. Probability weighting is ecologically rational and need not satisfy EUT axioms.” |  
  | **2. Money pumps’ normative force**                                          | “Money pumps prove the switch is pragmatically self-defeating. If you’d pay to avoid a pump, your preferences are defective.”             | “Money pumps are artifacts of forced sequentiality. Real-world choices rarely present such traps, and sophisticated agents avoid them.” |  
  | **3. What drives the contract-vs-lump-sum result?**                          | “The contract frame eliminates an illusion: certainty is ‘debiased’ by removing emotional/resolute weighting, revealing true linear preferences.” | “The contract frame alters the psychological stakes (e.g., loss aversion), but probability weighting remains valid in windfall contexts.” |  

  ---

  ### Cruxes: Testable Predictions  
  *For each crux, we specify:  
  - **The test/evidence** both accept as decisive.  
  - **Predictions** from each side.*  

  #### Crux 1: *Is the switch eliminable through cognitive debiasing?*  
  - **Test**: Subjects exhibiting the switch undergo training: explicit EUT tutoring + feedback on consistency in 50 sequential Allais-type trials. Measure switch rate post-training vs. control.  
  - **Friend 1 Prediction**: Switch rate drops to near-zero. The switch stems from correctable miscomputation.  
  - **Friend 2 Prediction**: Switch rate persists (>30%). Weighting is a deep preference, not a miscalibration.  

  #### Crux 2: *Do money pumps occur with real stakes among naive agents?*  
  - **Test**: Recruit subjects who exhibit the switch. In a dynamic task, offer sequential choices constructing a money pump (e.g., exploit Allais preferences to extract payments). Use high stakes (1 month’s income).  
  - **Friend 1 Prediction**: >70% of subjects accept dominated sequences, losing significant value.  
  - **Friend 2 Prediction**: <20% are pumped; most re-evaluate or avoid exploitation spontaneously.  

  #### Crux 3: *Does the contract frame eliminate weighting, or merely shift reference points?*  
  - **Test**: In the contract-frame study, add conditions measuring loss aversion (e.g., Kőszegi-Rabin reference points) and probability weighting (e.g., certainty equivalents for lotteries). Test correlation: if vanishing switches coincide with loss aversion shifts but stable weighting.  
  - **Friend 1 Prediction**: Contract frame *reduces* probability weighting (α in Prelec’s function → 1) but leaves loss aversion unchanged.  
  - **Friend 2 Prediction**: Contract frame *increases* loss aversion (λ in Prospect Theory ↑) but preserves probability weighting (α < 1).  

  ---

  ### Semantic Settlement by Stipulation  
  We agree to **set aside debates over the word "rational"** in §1 of the Residual Disagreements.  
  - **Friend 1**: Uses "rational" as *axiomatic consistency* (EUT-compliance).  
  - **Friend 2**: Uses "rational" as *ecological validity* (fitness to real-world contexts).  
  - **Resolution**: We stipulate these definitions and focus on empirical cruxes (above). Disagreements now concern only:  
    - Whether the switch is *correctable* (Crux 1),  
    - Whether it causes *real-world harm* (Crux 2),  
    - Its *mechanism* (Crux 3).  

  ---  
  This document exhausts our dispute. Further progress requires data from the proposed tests. We drink beer regardless. 🍻
