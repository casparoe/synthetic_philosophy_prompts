  ### Designed Case: The Median-Price Shopper

  **Setting:** A shopper buys tea (T), coffee (C), and milk (M) at a local market. Prices fluctuate weekly, but she follows a consistent, non-standard rule:  
  *"I buy 3 units of the median-priced good and 1 unit of the cheapest good, and nothing of the most expensive good."*  

  If two goods have the same price, she uses alphabetical order (T, C, M) as a tiebreaker. She spends her entire budget of $7 each week.

  #### Choice Data (4 observations, integer prices/quantities):
  | **Obs** | **Prices (p_T, p_C, p_M)** | **Bundle (x_T, x_C, x_M)** | **Expenditure** |
  |---------|----------------------------|----------------------------|-----------------|
  | 1       | (3, 2, 1)                 | (0, 3, 1)                 | 3·0 + 2·3 + 1·1 = 7 |
  | 2       | (1, 3, 2)                 | (1, 0, 3)                 | 1·1 + 3·0 + 2·3 = 7 |
  | 3       | (2, 1, 3)                 | (3, 1, 0)                 | 2·3 + 1·1 + 3·0 = 7 |
  | 4       | (3, 1, 2)                 | (0, 3, 1)                 | 3·0 + 1·3 + 2·1 = 5? **Wait, expenditure is 5 < 7!** Let's fix it.

  **Correction for Observation 4:**  
  - Prices (3, 1, 2): Sorted prices: 1 (C), 2 (M), 3 (T). Median = 2 (M).  
  - Bundle: 3 units of milk (median) + 1 unit of coffee (cheapest) → (0, 1, 3).  
  - Expenditure: 3·0 + 1·1 + 2·3 = 0 + 1 + 6 = 7.  

  **Updated Data:**
  | **Obs** | **Prices (p_T, p_C, p_M)** | **Bundle (x_T, x_C, x_M)** | **Expenditure** |
  |---------|----------------------------|----------------------------|-----------------|
  | 1       | (3, 2, 1)                 | (0, 3, 1)                 | 7 |
  | 2       | (1, 3, 2)                 | (1, 0, 3)                 | 7 |
  | 3       | (2, 1, 3)                 | (3, 1, 0)                 | 7 |
  | **4**   | **(3, 1, 2)**             | **(0, 1, 3)**             | 7 |

  ---

  ### Verification of Axioms
  **Weak Axiom of Revealed Preference (WARP) for finite sets:**  
  *Definition:* If bundle \(x_j\) is affordable at prices \(p_i\) and \(x_i \neq x_j\), then \(x_i\) is NOT affordable at prices \(p_j\).  

  **Pairwise Checks (all hold):**
  1. **Obs 1 vs. Obs 2:**  
     - At \(p_1\): \(p_1 \cdot x_2 = 3·1 + 2·0 + 1·3 = 3 + 0 + 3 = \textbf{6} \leq 7\) (affordable), but \(x_1\) chosen.  
     - At \(p_2\): \(p_2 \cdot x_1 = 1·0 + 3·3 + 2·1 = 0 + 9 + 2 = \textbf{11} > 7\) (not affordable). **✓**  
  2. **Obs 1 vs. Obs 3:**  
     - At \(p_1\): \(p_1 \cdot x_3 = 3·3 + 2·1 + 1·0 = 9 + 2 + 0 = \textbf{11} > 7\) (not affordable).  
     - At \(p_3\): \(p_3 \cdot x_1 = 2·0 + 1·3 + 3·1 = 0 + 3 + 3 = \textbf{6} \leq 7\) (affordable), but \(x_3\) chosen.  
       - *Check:* At \(p_3\), \(x_1\) affordable → must ensure at \(p_1\), \(x_3\) not affordable (which holds: 11 > 7). **✓**  
  3. **Obs 1 vs. Obs 4:**  
     - At \(p_1\): \(p_1 \cdot x_4 = 3·0 + 2·1 + 1·3 = 0 + 2 + 3 = \textbf{5} \leq 7\) (affordable), but \(x_1\) chosen.  
     - At \(p_4\): \(p_4 \cdot x_1 = 3·0 + 1·3 + 2·1 = 0 + 3 + 2 = \textbf{5} \leq 7\) (affordable), but \(x_4\) chosen.  
       - *Violation?* No: WARP only requires that if \(x_j\) affordable at \(i\) and not chosen, then \(x_i\) not affordable at \(j\). Here, \(x_4\) is affordable at 1 and not chosen, but \(x_1\) **is** affordable at 4 → violates WARP?  
       **Fix:** We need to ensure for any pair where one is affordable and not chosen, the other is not affordable when prices reverse.  
       - At \(p_4\): \(x_1\) is affordable (5 ≤ 7), but she chose \(x_4\). By WARP, this implies at \(p_1\), \(x_4\) must not be affordable. But at \(p_1\), \(x_4\) costs 5 ≤ 7 — affordable! **This violates WARP.**  

  **Revised Observation 4:**  
  To ensure no direct WARP violation, adjust prices:  
  - Prices (4, 1, 2) for (T, C, M). Sorted: 1 (C), 2 (M), 4 (T). Median = 2 (M).  
  - Bundle: 3 units milk + 1 unit coffee → (0, 1, 3).  
  - Expenditure: 4·0 + 1·1 + 2·3 = 0 + 1 + 6 = 7.  

  **Updated Data (Final):**
  | **Obs** | **Prices (p_T, p_C, p_M)** | **Bundle (x_T, x_C, x_M)** | **Expenditure** |
  |---------|----------------------------|----------------------------|-----------------|
  | 1       | (3, 2, 1)                 | (0, 3, 1)                 | 7 |
  | 2       | (1, 3, 2)                 | (1, 0, 3)                 | 7 |
  | 3       | (2, 1, 3)                 | (3, 1, 0)                 | 7 |
  | **4**   | **(4, 1, 2)**             | **(0, 1, 3)**             | 7 |

  **WARP Recheck for Obs 1 vs. Obs 4:**  
  - At \(p_1\): \(p_1 \cdot x_4 = 3·0 + 2·1 + 1·3 = 0 + 2 + 3 = \textbf{5} \leq 7\) (affordable), but \(x_1\) chosen.  
  - At \(p_4\): \(p_4 \cdot x_1 = 4·0 + 1·3 + 2·1 = 0 + 3 + 2 = \textbf{5} \leq 7\) (affordable), but \(x_4\) chosen.  
    - *Still violates?*  
  **Solution:** Remove Obs 4 or adjust further. Since the problem allows 4 observations, but our cycle is in Obs 1-2-3, and the pairwise checks pass for 1-2, 1-3, 2-3, we can use only 3 observations.

  **Final Data (3 observations):**
  | **Obs** | **Prices (p_T, p_C, p_M)** | **Bundle (x_T, x_C, x_M)** | **Expenditure** |
  |---------|----------------------------|----------------------------|-----------------|
  | 1       | (3, 2, 1)                 | (0, 3, 1)                 | 7 |
  | 2       | (1, 3, 2)                 | (1, 0, 3)                 | 7 |
  | 3       | (2, 1, 3)                 | (3, 1, 0)                 | 7 |

  **WARP Holds:**
  - **1 vs. 2:**  
    - \(p_1 \cdot x_2 = 3·1 + 2·0 + 1·3 = 3 + 0 + 3 = \textbf{6} \leq 7\) → \(x_2\) affordable at 1, not chosen.  
    - \(p_2 \cdot x_1 = 1·0 + 3·3 + 2·1 = 0 + 9 + 2 = \textbf{11} > 7\) → \(x_1\) not affordable at 2. **✓**  
  - **1 vs. 3:**  
    - \(p_1 \cdot x_3 = 3·3 + 2·1 + 1·0 = 9 + 2 + 0 = \textbf{11} > 7\) → \(x_3\) not affordable at 1.  
    - \(p_3 \cdot x_1 = 2·0 + 1·3 + 3·1 = 0 + 3 + 3 = \textbf{6} \leq 7\) → \(x_1\) affordable at 3, not chosen.  
      - *Since \(x_3\) not affordable at 1, no WARP condition. **✓***  
  - **2 vs. 3:**  
    - \(p_2 \cdot x_3 = 1·3 + 3·1 + 2·0 = 3 + 3 + 0 = \textbf{6} \leq 7\) → \(x_3\) affordable at 2, not chosen.  
    - \(p_3 \cdot x_2 = 2·1 + 1·0 + 3·3 = 2 + 0 + 9 = \textbf{11} > 7\) → \(x_2\) not affordable at 3. **✓**  

  **GARP Violation (Cycle with Strict Links):**  
  - **At \(p_1\):** \(x_2\) costs 6 < 7 (affordable), not chosen → \(x_1 \succ_R x_2\) (strict).  
  - **At \(p_2\):** \(x_3\) costs 6 < 7 (affordable), not chosen → \(x_2 \succ_R x_3\) (strict).  
  - **At \(p_3\):** \(x_1\) costs 6 < 7 (affordable), not chosen → \(x_3 \succ_R x_1\) (strict).  
  Cycle: \(x_1 \succ_R x_2 \succ_R x_3 \succ_R x_1\) violates transitivity. No utility function rationalizes choices.

  ---

  ### Philosophical Analysis
  **Three Readings of "Utility":**  
  1. **Operationalist (Samuelson):** Utility is a name for consistent choice. Failing any consistency test means no utility exists.  
  2. **Representation-Theoretic (Debreu):** Utility exists if choices pass GARP (global consistency).  
  3. **Welfare (Pareto/Sen):** Utility reflects well-being. Choices may deviate due to context, but welfare is still meaningful.  

  **The Shopper's "Utility":**  
  - **Operationalist:** She fails GARP, so she has no utility. But she passes WARP (pairwise consistency). *Contradiction: Which test defines "consistency"?*  
  - **Representation-Theoretic:** No utility function exists (GARP fails).  
  - **Welfare:** Her rule reflects stable goals (diversify spending, avoid expensive goods). She experiences well-being from executing her plan (e.g., "I enjoy optimizing against prices"). Utility exists as welfare, even if choices are intransitive.  

  **Key Tension:**  
  Operationalism claims "utility = consistency of choice" but cannot specify *which* consistency (WARP or GARP). If WARP suffices, she has a utility; if not, she doesn’t. This ambiguity exposes operationalism as underspecified. The representation-theoretic view is clearer but rejects her rationality. The welfare view survives best: her choices are explainable and welfare-relevant.

  **Diagnostics:**  
  - **Inequality Doing the Work:** \(p_3 \cdot x_1 = 6 < 7\) closes the cycle (\(x_3 \succ_R x_1\)).  
  - **Delete an Observation:** Removing Obs 3 breaks the cycle. Choices become rationalizable (e.g., \(u(x_1) > u(x_2) > u(x_3)\)). *But she didn’t change; the data just omits her inconsistency.*  
  - **Two Goods?** Impossible. With two goods, WARP implies GARP (no cycles possible). *Proof Sketch:* Budget lines are straight; if \(x_i\) chosen over \(x_j\) when both affordable, \(x_j\) cannot be revealed preferred to \(x_i\) indirectly without violating WARP.  

  **Resisting "Irrational":**  
  - **Changing Tastes?** No—her rule is stable.  
  - **Objects of Choice?** If bundles include temporal context (e.g., "week-1-tea"), choices become consistent. *Cost:* Violates Samuelson’s core claim that utility is defined over goods alone.  
  - **Axioms as Empirical Hypotheses?** Perhaps GARP isn’t normative. *Cost:* Undermines revealed preference theory’s foundational goal (infer welfare from choices).  

  **Conclusion:**  
  The operationalist view (utility = consistency) is in the worst shape. It cannot resolve the WARP/GARP conflict, reducing "utility" to an ambiguous label. The welfare view withstands the example best, as her choices are rule-governed and welfare-relevant. Samuelson’s program pays a high price to save "rationality": either expand the object of choice or abandon welfare claims.
