  1. The gradually-cooled room — the one everybody uses, temperature dropping a degree a minute for two hours. At the hundred-minute mark she's unmistakably cold. Tomás says she knows she's cold. But he flatly denies that she knows *that she knows*. I pushed back: she's miles from any boundary, so the usual sorites/margin worry shouldn't bite here. He said 'in a continuum you never get a foothold' and changed the subject.

  2. Same room, different setup: the temperature drops in one jump from 22° to 4°, and she's asked about it ten minutes later. He says she knows she's cold, she knows that she knows, and he'll even grant the third iteration. Asked about the fourth he says 'each level costs you something and she's running out of currency.'

  3. A mathematician who has just gone through a short proof line by line and found no gap: knows the theorem, knows that she knows, and here Tomás will grant as many iterations as you like.

  4. A radiologist, twenty years' experience, known-to-her hit rate around 97%, looking at an image where the fracture is clear. K, yes; KK, yes; KKK, yes.

  5. Same radiologist, but the head technician tells her — wrongly, he's thinking of a different unit — that the machine has been producing degraded images all week. The fracture on her image is plain as day and she believes it's there. Tomás says she still knows there's a fracture. But he says she does not know that she knows.

  6. Ambiguous image, hairline fracture, she goes with a hunch and the hunch happens to be right. No knowledge, so obviously no iterated knowledge either — he isn't going to hand you KK without K.

  Now here's the new case, which comes up in our reading group next week and I want to walk in with an answer. Bea screens passports in customs. She's excellent at spotting good fakes: across thousands of documents she's right about 99% of the time, and she knows that's her record. But she genuinely can't say what tips her off, and if you ask her afterwards she'll tell you that a real passport and a really good fake look exactly the same to her — she just finds herself saying 'fake.' Today's document is a fake. Her belief that it's a fake is safe and sensitive (there's no nearby situation in which she forms that belief and it's wrong), there's no continuum or borderline structure to the case at all, nobody has given her any reason to doubt herself, and she isn't inferring anything from how she feels.

  So: will Tomás say Bea knows that she knows?

