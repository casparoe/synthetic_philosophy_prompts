  Okay, let me tackle this student's problem step by step. They're clearly struggling with Gongsun Long's "white horse is not horse" paradox and need precise philosophical analysis. The student has already done impressive work by formalizing parts and identifying key issues, but remains stuck on coherence.

  First, I need to handle their five sub-questions systematically. For (a), the core tension is how to reconcile the apparent logical truth "∀x(WHx→Hx)" with Gongsun Long's denial. The student's extension-based approach hits a wall because the thesis can't be about extensions if it's deniable. The solution must lie in distinguishing naming functions - "horse" names the shape-concept while "white horse" names a compound concept. This explains why Gongsun Long concedes extensional inclusion in (2) while denying conceptual identity.

  Moving to (b), the intensional context of "seeking" is indeed crucial but not for referential opacity as commonly misunderstood. The text shows substitutivity fails because "horse" and "white horse" have different satisfaction conditions from the start - it's about distinct concepts rather than opacity in singular terms. The popular "referential opacity" reading mislocates the issue.

  For (c), the copula equivocation diagnosis has merit but oversimplifies. In (1) "is" signifies naming-function identity, in (2) request-satisfaction conditions, and in (3) conceptual composition. Crucially, Gongsun Long consistently uses "is not" to mean conceptual non-identity throughout, though expressed through different contexts. There's no single uniform reading that preserves validity across all steps.

  Step (d)'s third argument is the most metaphysically loaded. When Gongsun Long says "white is not horse" and "horse together with white", he's treating color and shape as distinct naming functions that combine. This does rely on a separation thesis where qualities are conceptually separable from things, though not necessarily ontologically separate. The dependency bites in the move from "inherently colored" to the need for compound naming.

  Finally for (e), the seeking argument does identify a semantic restriction: the inference from "there is a horse" to "this satisfies any horse-request" fails because requests specify which concept is invoked. This is fundamentally about how names function in practical contexts, blending semantic and pragmatic dimensions.

  Throughout, I attribute to Gongsun Long a consistent view that names correspond to distinct conceptual functions. The best reading sees this as a thesis about the non-identity of naming functions, with the cost being that it makes the conclusion appear trivial unless we appreciate the context of naming practices in ancient Chinese philosophy. What seems like wordplay reveals deep insights about how language maps to reality.
answer: |-
  Here is a precise, text-grounded analysis addressing your questions sequentially, strictly adhering to Gongsun Long's arguments as presented in your rendering. I attribute premises based solely on the text you provided, prioritizing internal coherence.

  **(a) Thesis Content for Deniability and Consistency**  
  *Premises attributed to Gongsun Long*:  
  1. "Horse" names shape (形 *xíng*); "white" names color (色 *sè*) (Step 1).  
  2. What names color ≠ what names shape (Step 1).  
  3. From "there is a white horse," one *can* infer "there is a horse" (conceded in Step 2).  

  *Exact Content of Thesis*:  
  **"The *name* 'white horse' does not denote the same *concept* as the name 'horse'."**  

  *Why this is deniable and consistent*:  
  - The extensional inclusion (white horse ∈ horse) is *not* denied. Gongsun Long concedes that a white horse is extensionally a horse (Step 2: "where there is a white horse, one cannot say there is no horse").  
  - The denial is *intensional*: The naming functions "horse" (shape-concept) and "white horse" (compound shape-color-concept) are distinct. Step 1’s "what names the color is not what names the shape" establishes that "horse" and "white" denote different semantic functions. "White horse" combines these functions, so it cannot be identical to "horse" alone. This preserves deniability (the concepts/naming functions differ) while accommodating extensional inclusion (white horses are horses).  

  **(b) Referential Opacity: Supported or Misplaced?**  
  *Verdict*: **Misplaced**. The text does *not* support referential opacity (failure of substitutivity of co-referential terms in intensional contexts).  

  *Reasons*:  
  - Gongsun Long’s argument in Step 2 hinges on **satisfaction conditions for requests**, not opacity:  
    - "Seeking a horse" accepts yellow/black horses (satisfied by H).  
    - "Seeking a white horse" rejects them (satisfied only by H∩W).  
  - Since "horse" and "white horse" have *different extensions* (H vs. H∩W), substitutivity fails trivially (no co-reference to begin with). The issue is **not** that "horse" and "white horse" corefer but fail to substitute in "seeks" contexts; it’s that they *never* corefer extensionally in the request scenario. The popular claim mislocates the puzzle by implying a substitution failure where none is licensed.  

  **(c) Copula Equivocation Diagnosis**  
  *Diagnosis*:  
  - **Step 1**: "Is" = **conceptual identity** (名 *míng*, naming-function). Valid iff naming-functions for "horse" (shape) and "white horse" (shape+color) are non-identical.  
  - **Step 2**: "Is" = **satisfaction equivalence for requests**. Valid iff the set satisfying "horse" (H) ≠ the set satisfying "white horse" (H∩W).  
  - **Step 3**: "Is" = **conceptual composition** (白馬 = 馬 + 白). Valid iff "white horse" is metaphysically/compositionally distinct from "horse" alone.  

  *Uniform Reading?* **No**. The argument breaks at **Step 1** under any uniform reading:  
  - If "is" = class inclusion: Step 1’s denial is false (contradicted by Step 2).  
  - If "is" = identity: Step 2’s request argument fails (extensional ≠ identity).  
  - If "is" = naming-function identity: Step 3’s composition claim is redundant.  

  *First Break*: Step 1’s conclusion ("a white horse is not a horse") is invalid under the reading required for Step 2 (extensional inclusion). Gongsun Long relies on shifting "is" from *conceptual* (Step 1) to *extensional/satisfaction* (Step 2) to *compositional* (Step 3).  

  **(d) Step 3: Meaning and Metaphysical Commitments**  
  *Premises attributed*:  
  1. Horses are inherently colored (馬固有色).  
  2. "White" is not "horse" (白非馬).  
  3. "White horse" = "horse" + "white" (白馬者，馬與白也).  

  *Interpretation*:  
  - The conclusion is about **the compound name/concept**: "White horse" names a composite (shape + color), while "horse" names only shape. Hence, the *name* "white horse" ≠ the *name* "horse" (consistent with Step 1).  
  - It implies **separable qualities**: "White" is treated as a distinct naming function ("white is not horse") that combines with "horse" to form a new concept. This *does* rely on a "hard-and-white" style separation thesis.  

  *Where Dependency Bites*:  
  - If color were not separable from shape (e.g., if "horse" inherently included color), then "white horse" could not be analyzed as "horse + white" (Step 3). Gongsun Long’s move from "horses are inherently colored" to "white horse is horse *with* white" requires color to be a distinct, attachable attribute.  

  **(e) Seeking-Inference Restriction: Semantic or Pragmatic?**  
  *Characterization*: Gongsun Long identifies a **semantic restriction** concerning names and their satisfaction conditions.  

  *Reason*:  
  - His reply focuses on **what the names denote** in the context of a request:  
    - "Horse" denotes the shape-concept (H).  
    - "White horse" denotes the compound concept (H∩W).  
  - The restriction is that the inference from "X is a horse" to "X satisfies *any request for a horse*" fails when the request specifies a *sub-concept* (e.g., color). This is semantic because it concerns how names pick out extensions (H vs. H∩W), not pragmatic factors (e.g., speaker intent). The Mohist restriction on parallel inference would likely align here: not all "horse"-contexts license the same substitutions.  

  ---

  ### Best Reading Surviving Scrutiny  
  **Reading**: *The dialogue argues for the non-identity of naming functions (名 míng). "Horse" names shape; "white horse" names a composite of shape and color. Since the naming functions differ, "white horse" is not (identical to) "horse," even though white horses are extensionally horses.*  

  *Why Best*:  
  1. **Textually Grounded**: Fits all premises:  
     - Step 1: Names for shape vs. color are distinct.  
     - Step 2: Different names imply different satisfaction conditions.  
     - Step 3: Composite names ≠ simple names.  
  2. **Preserves Deniability**: The thesis is about conceptual/naming-function non-identity, not extensional exclusion.  
  3. **Minimal Metaphysics**: Requires only that naming functions for shape and color are distinguishable (implied by Step 1).  

  *Cost*:  
  - **Triviality Risk**: If "naming-function non-identity" just means "different words have different meanings," the argument seems pedantic. But in context (Warring States debates on naming), it highlights key issues: compound terms create new concepts, and names fix satisfaction conditions (e.g., for requests).  
  - **Inconsistency with Concession**: The conclusion *sounds* like it denies extensional inclusion, but Gongsun Long explicitly concedes this. The cost is accepting that the provocative thesis relies on deliberate ambiguity between conceptual and extensional "is."  

  This reading foregrounds Gongsun Long’s core insight: **Language constructs concepts that cannot be reduced to their components or superordinates**. "White horse" is a distinct *name* with distinct semantic behavior, despite extensional overlap with "horse."
