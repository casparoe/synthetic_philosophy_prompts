  ### Scenario
  Dana lives near a pristine forest. She can take a short walk to plant a rare seed on a sunny hill, ensuring it grows into a tree supporting a new bird species. The species will thrive for centuries, its members living good lives. Dana chooses not to plant because she dislikes walking in heat. Without her action, the species never exists. Her life is equally good either way. Centuries later, the forest remains intact, but no birds exist. Humans and existing wildlife are unaffected.

  ---

  ### (a) Outcomes and Worse-Off Check  
  - **Outcome A (Plants seed)**:  
    - *Dana*: Life quality 7 (unchanged).  
    - *Bird species*: 1,000 birds per generation exist; each has life quality 6 (clearly worth living).  
  - **Outcome B (Does not plant)**:  
    - *Dana*: Life quality 7 (unchanged).  
    - *Bird species*: Does not exist.  
  **Person-by-person check**:  
  - Dana: Same quality (7) in both outcomes → not worse off.  
  - Birds: Exist only in A. In B, no birds exist to be deprived or harmed → not worse off.  
  - Humans/wildlife: Unaffected in both → not worse off.  

  ---

  ### (b) Why Same-Number Comparison Is Silent  
  The impersonal same-number principle compares outcomes with *identical* populations based on total/average welfare. Here, the populations differ: Outcome A includes Dana + birds, Outcome B only Dana. No fixed group exists across both outcomes to compare "same-number" welfare. The principle cannot be applied, as it requires matching sets of individuals.  

  ---

  ### (c) Structural Feature Generating Wrongness  
  **The squandered capacity to generate impartial value**.  
  Dana’s choice extinguishes a vast, self-sustaining chain of positive welfare (the birds’ lives) for negligible convenience. Though no one is harmed, the *disproportion between cost and moral gain* is severe: minimal effort could have created immense cumulative good across generations. The wrongness stems from wasting an opportunity to amplify impartial value, not from harming individuals.  

  ---

  ### (d) Verdict Without the Feature  
  If Dana’s effort were substantial (e.g., risking her life), the cost would outweigh the moral gain. The choice might then be permissible, as the burden would justify inaction. Holding all else fixed, deleting the *trivial cost/disproportionate gain* feature removes the wrongness.  

  ---

  ### (e) Counterattack and Response  
  **Counterattack**: "You’ve smuggled in person-affecting thinking by implying the birds ‘should’ exist. The impersonal principle *does* apply here via total welfare: Outcome A has more total good, so B is impersonally worse."  
  **Does it land? No.**  
  - Total welfare comparisons across different-number cases are contested (e.g., repugnant conclusion objections) and not universally accepted by person-affecting critics.  
  - The case’s load-bearing intuition ("trivial cost → immense moral loss") persists *without* aggregating welfare. A first-year student feels the wrongness from wasted potential, not arithmetic. Rejecting aggregation leaves the verdict intact.  

  ---

  ### Verdict:  
  Trivial cost extinguishes vast impartial good.
