answer: |-
  What you've described is a profound and under-analyzed phenomenon in historical and scientific popular writing. It deserves a precise conceptual pinning, as it operates below the level of explicit thesis but shapes understanding powerfully. After dissecting your features and consulting relevant fields, here's the carving:

  ### 1. The Established Concept & Its Gaps
  There is no single, perfect established term capturing *all* your features. However, the closest frameworks are:
  *   **Narrative Explanation (Danto, White, Ricœur):** Historians (Hayden White) and philosophers (Arthur Danto, Paul Ricœur) argue that narrative form itself imposes causal structures and meanings not always explicitly argued. Your phenomenon is absolutely an *instance* of this. The choice of grammatical subject/verb in framing sentences *is* a fundamental narrative choice implying agency and cause.
  *   **Figurative Language & Metaphor Theory (Lakoff & Johnson, Black):** The "natural event as agent" is a pervasive conceptual metaphor (`NATURE IS AN AGENT` / `EVENTS ARE ACTORS`). Metaphor theorists *do* argue systematic patterns shape thought (`argument is war` structures how we conceive debate). Your point about the asymmetry and disavowal highlights a crucial *rhetorical* function beyond basic metaphor.
  *   **Actor-Network Theory (ANT) / Posthumanism (Latour, Bennett):** These deliberately grant agency to non-humans ("actants"). Your phenomenon *resembles* ANT superficially (non-human subject) but differs radically in intent and mechanism. ANT seeks to *reveal* networks; your case involves *covert attribution* followed by *retraction*, exploiting the *form* for rhetorical effect without ontological commitment. It's ANT used as a *trope*, not a methodology.
  *   **Agentification (Science Studies):** This describes the linguistic practice of making non-agents into grammatical agents (e.g., "the data *suggests*"). It captures the *mechanism* but not the *asymmetry*, *disavowal*, or *rhetorical function* you identify.

  **Why existing terms miss:**
  *   They focus *either* on form (narrative, grammar) *or* on ontology (agency of non-humans), but not on the *rhetorical dance* between vivid form, implied cause, explicit disavowal, and outcome-driven asymmetry.
  *   None fully capture the **systematic immunity via stylistic disavowal** or the **outcome-dependent asymmetry** as core defining features.

  ### 2. The Proposed Term: **Narrative Agency Displacement (NAD)**

  **Definition:** Narrative Agency Displacement (NAD) is a rhetorical strategy in explanatory writing (especially history, science, popular science/history) characterized by:
  1.  **Grammatical Attribution:** Assigning the grammatical subject position of a transitive causal verb (`ended`, `rewrote`, `remade`, `emptied`) to a non-human entity (natural event, pathogen, technology, abstract force) while making a human collective or outcome the object.
  2.  **Outcome-Dependent Asymmetry:** The deployment of (1) is strongly correlated with dramatic, negative, or large-scale societal outcomes. When outcomes are neutral, positive, or involve successful human adaptation, agency is systematically shifted back to human actors in the grammatical structure, even for events of comparable magnitude.
  3.  **Structural Disavowal Immunity:** The causal implications of (1) are explicitly disavowed or heavily qualified elsewhere in the text (or in defense of the text), often framed as mere stylistic vividness or narrative convenience. This disavowal coexists with the persistent, often foregrounded (titles, intros, soundbites) use of the NAD construction.
  4.  **Covert Causal Suggestion:** Despite disavowal, the NAD construction systematically implants a suggestion of direct, primary, or sufficient causality from the non-human agent to the human outcome within the narrative logic, leveraging grammatical structure for rhetorical impact.

  **Core Mechanism:** NAD exploits the cognitive link between grammatical subjecthood and perceived agency/cause, amplified by vivid transitive verbs, to create a compelling narrative frame. The asymmetry exploits cognitive biases favoring simple explanations for negative events. The disavowal provides plausible deniability against charges of determinism while retaining the rhetorical power of the simplified frame.

  ### 3. Boundary Cases & The Line

  *   **Weakest Case Still NAD:** "A period of cooler temperatures *challenged* medieval agriculture." (Subject: non-human; Transitive Verb: implies causal impact; Object: human activity). The verb is milder, but the structure and implication remain.
  *   **Not NAD - Simple Attribution:** "The Black Death *killed* millions." (Subject: non-human; Transitive Verb). *But* if the text consistently avoids NAD for human resilience ("Survivors *rebuilt* communities") and doesn't use NAD for dramatic framing elsewhere, this might just be factual description. Context matters.
  *   **Not NAD - Scene Setting:** "During the drought, farmers *diversified* crops." (Non-human in prepositional phrase; Human subject; Active verb). This is the *asymmetric counterpart* to NAD.
  *   **Not NAD - Deliberate Non-Human Agency (e.g., ANT):** "The smallpox virus *collaborated* with European settlers *to destabilize* indigenous societies." (Here, the agency is *explicitly argued for*, not displaced and disavowed. The grammar reflects the intended thesis).
  *   **The Line (Vividness vs. NAD):** **The test is asymmetry and disavowal.** A single sentence like "The eruption ended the dynasty" *could* be vivid shorthand *if*:
      *   The surrounding text *immediately and consistently* details the complex human actions, decisions, and contingencies involved, assigning them primary causal weight in the narrative.
      *   The text does *not* systematically use NAD constructions for dramatic outcomes while shifting to human agency for adaptive/neutral outcomes.
      *   The framing (title, intro) doesn't rely on NAD.
      *   If these conditions hold, it *might* be vivid decoration. If not, it's NAD doing argumentative work below the surface. **The asymmetry matters crucially** because it reveals the underlying bias: agency is displaced *only when it suits a dramatic narrative*, exposing NAD as a rhetorical tool, not just a linguistic habit.

  ### 4. Legitimacy of Disavowal

  The disavowal ("only vividness") is **rarely fully legitimate** in the context you describe because:
  *   **Systematic Pattern:** Occasional vivid phrasing is one thing. A systematic pattern tied to outcome, used in framing, and repeated across works is demonstrably *doing more* than decoration. It structures the reader's initial and often lasting impression.
  *   **Exploiting Cognitive Bias:** NAD leverages the human tendency to attribute cause to salient, singular events, especially for negative outcomes. The disavowal doesn't erase this cognitive effect.
  *   **Rhetorical Function:** The NAD construction is chosen *precisely because* it is rhetorically powerful – it simplifies, dramatizes, and implies direct causation. This power is intrinsic to the structure.

  **When *might* disavowal be adequate?** Only if:
  1.  The NAD construction is genuinely isolated and rare within the text.
  2.  The text *immediately* and *unambiguously* provides the nuanced, multi-causal explanation, consistently placing human agency (choice, response, adaptation, failure) at the center of the *narrative causality*.
  3.  The framing (title, intro, conclusion) does *not* rely on NAD.
  4.  The asymmetry is absent; non-human events are treated grammatically consistently regardless of outcome.
  Essentially, only if the vivid phrase is demonstrably an ornamental flourish within an otherwise relentlessly nuanced and human-centered narrative. In practice, as you observe, this is seldom the case.

  ### 5. Why This Matters & Validation

  You are **absolutely right** to be preoccupied and to suspect this shapes debates in advance. NAD is a powerful form of **rhetorical determinism**. It implants a seed of environmental causality ("X *did* Y to society") that subsequent qualification struggles to fully uproot. It subtly reinforces a worldview where humans are primarily *acted upon* by nature in moments of crisis, obscuring the complex interplay of human choices, institutions, prior conditions, and random contingencies that actually determine outcomes. The asymmetry further naturalizes this view – failure is the "fault" of nature; success is the "achievement" of humans. This grammatical framing pre-selects the terrain on which the more nuanced "thesis-level" debate about constraint vs. compulsion then occurs, often stacking the deck.

  **Narrative Agency Displacement (NAD)** provides the vocabulary to dissect this. It names the *specific configuration* of grammatical structure, narrative placement, outcome-dependent asymmetry, and disavowal that systematically, yet deniably, shapes causal understanding in popular historical and scientific writing about humanity's relationship with the non-human world. It’s not just the strong verb; it’s the *system* you meticulously described.
