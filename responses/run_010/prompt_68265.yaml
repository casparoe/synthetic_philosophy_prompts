  ### Engineered Counterexample to the Condorcet Jury Theorem in an SRE Context

  #### Scenario  
  During a postmortem for an outage, three engineers must decide if a specific config change caused the incident. All three consult the same central monitoring dashboard (which is 60% accurate) and also perform independent log analysis (each engineer's analysis is 80% accurate). However, the dashboard is considered authoritative, so each engineer follows its verdict 95% of the time, overriding their own log analysis only 5% of the time. They vote independently (no discussion) based on this process.

  ---

  #### Analysis  
  **Key Parameters**  
  - Shared input (dashboard) accuracy: 60%  
  - Independent log analysis accuracy (per engineer): 80%  
  - Probability an engineer defers to the dashboard: 95%  
  - Probability an engineer overrides the dashboard with their own analysis: 5%  
  - Prior probability that the config change caused the outage: 50% (simplifies math; no bias assumed).

  ---

  **Step 1: Individual Accuracy Calculation**  
  Each engineer combines the dashboard and their independent analysis. We calculate their overall accuracy:  
  - If the **dashboard is correct (60% chance)**:  
    - Engineer votes correctly if they defer to the dashboard (95%) OR override but their own analysis is correct (5% × 80% = 4%).  
    - Accuracy in this case: `95% + 4% = 99%`.  
  - If the **dashboard is wrong (40% chance)**:  
    - Engineer votes correctly only if they override AND their own analysis is correct: `5% × 80% = 4%`.  

  Overall individual accuracy:  
  `(60% × 99%) + (40% × 4%) = 59.4% + 1.6% = 61%`.  
  **Each engineer is 61% accurate**—better than 50/50.

  ---

  **Step 2: Three-Person Majority Accuracy**  
  Votes are correlated due to the shared dashboard. We calculate the probability the majority (≥2 engineers) is correct.  
  - **Dashboard is correct (60% chance)**:  
    - Probability an engineer votes correctly: 99% (as above).  
    - Majority correct probability: Nearly certain (≥2 of 3 correct).  
    - Exact: `(0.99)^3 + 3×(0.99)^2×(0.01) = 0.9997 ≈ 99.97%`.  
  - **Dashboard is wrong (40% chance)**:  
    - Probability an engineer votes correctly: 4% (as above).  
    - Majority correct probability: Very low (≥2 of 3 correct).  
    - Exact: `(0.04)^3 + 3×(0.04)^2×(0.96) = 0.004672 ≈ 0.47%`.  

  Overall majority accuracy:  
  `(60% × 99.97%) + (40% × 0.47%) ≈ 60.17%`.  
  **Three-person majority is 60.17% accurate—worse than an individual (61%)**.

  ---

  **Step 3: Effect of Adding More Engineers**  
  As the group grows, majority accuracy **worsens**:  
  - **5 engineers**:  
    - Dashboard correct (60%): Majority accuracy ≈ 100%.  
    - Dashboard wrong (40%): Majority accuracy ≈ 0.06% (calculation: sum of P(3/5), P(4/5), P(5/5) correct).  
    - Overall: `(60% × 100%) + (40% × 0.06%) ≈ 60.02%`.  
  - **Larger groups**: Accuracy approaches 60%—the dashboard’s accuracy.  
  **Why?** The shared dashboard dominates decisions. When it is wrong (40% of the time), the entire group is likely wrong, and more engineers amplify this error. Independence is violated, so the group “herds” toward the dashboard’s verdict.

  ---

  **Step 4: Flip One Parameter to Restore the Theorem**  
  **Flip: Engineers *never* defer to the dashboard (defer probability = 0%, override = 100%).**  
  - Now each engineer uses *only* their independent analysis (80% accurate).  
  - Votes are fully independent (no shared input influence).  
  - Individual accuracy: 80%.  
  - Three-person majority accuracy:  
    `(0.8)^3 + 3×(0.8)^2×(0.2) = 89.6%` (better than 80%).  
  - Adding more engineers improves accuracy (converges to 100%).  
  **Key dial**: Deferring to the shared input. Removing this restores independence and the theorem’s prediction.

  ---

  #### What a Jury Theorem Defender Would Say  
  > "You violated the independence assumption, so the theorem doesn’t apply. Nothing interesting here."  

  **But there’s more nuance**:  
  1. **Weak independence versions exist**: Some extensions allow *limited* correlation if the **average pairwise correlation** is low.  
     - In your case, pairwise correlation is **0.91** (calculated from joint probabilities; see footnote). This is too high—it guarantees the theorem fails.  
     - These extensions require correlations to be below a threshold (e.g., <0.5 for large groups). Your scenario exceeds this, breaking even weak versions.  
  2. **Why it matters**: Your counterexample isn’t just “independence broken”—it shows how a **single point of failure** (the dashboard) creates *systematic* correlation. This is realistic (e.g., everyone trusting StackOverflow). The theorem’s error-reduction power vanishes when correlation exceeds a critical level.  

  **Practical takeaway**: The jury theorem works only if correlations are weak *and* no dominant shared input exists. In SRE postmortems, true independence requires **separate data sources** (e.g., different log queries, metrics, or hypotheses) without a single-point influence.

  ---

  **Footnote: Correlation Calculation**  
  For two engineers:  
  - Probability both correct: `(60% × 99%²) + (40% × 4%²) = 58.87%`.  
  - Expected if independent: `61% × 61% = 37.21%`.  
  - Covariance: `58.87% - 37.21% = 21.66%`.  
  - Variance per engineer: `61% × 39% = 23.79%`.  
  - Correlation: `21.66% / 23.79% ≈ 0.91`.  

  ---  
  This counterexample is self-contained, uses realistic engineering parameters, and meets all your specs. Use it to argue for diversified data in incident reviews!
