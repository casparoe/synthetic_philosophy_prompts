  The user highlights two features: the belief is open to confirmation but closed to disconfirmation because it's presuppositional, not evidence-based. And Sidgwick is fully aware and transparent about this, making it distinct from wishful thinking or self-deception. They mention unfalsifiability, but note it's inadequate because Sidgwick's audits are genuine and results are published.

  Now, considering existing concepts. Unfalsifiability? Too broad and negative. Pragmatic belief? Doesn't capture the auditing aspect. James' "will to believe"? Sidgwick isn't choosing belief without evidence; he's presupposing it. Foundational belief? Close, but Sidgwick's active testing adds a unique layer. 

  The term "regulative presupposition" comes to mind. Kant used "regulative ideas" for concepts that guide inquiry but aren't provable. Sidgwick's belief functions similarly: it's a necessary assumption for his ethics, regulating his actions and investigations. He tests it rigorously precisely because it's foundational, but its presuppositional nature shields it from disproof. The audits are part of maintaining intellectual integrity while holding the presupposition.

  Why this over others? It captures both the necessity of the belief for his system and the active, scrupulous testing. Unlike a double standard, he's consistent in applying skepticism elsewhere. Unlike confirmation bias, he publishes failures. It's a structured, conscious stance. 

  The user wants no hedging, so I'll commit to "regulative presupposition." Define it clearly, distinguishing from similar concepts. Ensure the response is concise, under 400 words, starting with the term.
answer: |-
  **Regulative Presupposition**

  Sidgwick treats the belief in survival (and thus moral order) as a *regulative presupposition* – a necessary axiom for his ethical system, held not evidentially but *pragmatically*, driving rigorous testing precisely *because* it's indispensable yet unproven. This differs from:

  1.  **Double Standard:** The stricter scrutiny *is* the standard *for this specific, foundational belief*; his transparency reveals consistency in its unique status, not hypocrisy.
  2.  **Confirmation Bias/Manufactured Evidence:** He actively seeks *disconfirmation* (exposing frauds, publishing failures), not just confirmation. The presupposition motivates the *audit*, not the *interpretation* of data.
  3.  **Cherished View/Unwillingness:** His "belief/hope" state persists due to its *functional necessity* for conduct, recognized intellectually, not mere emotional attachment. The negative results *don't* disconfirm the core need, only empirical claims about *how* it might manifest.

  Kant’s "regulative ideas" (guiding inquiry without constitutive proof) and James's "will to believe" (acting on faith where evidence is insufficient) are neighbors, but Sidgwick's stance is distinct: it’s a consciously held, practically *required* postulate subjected to relentless, fruitless empirical investigation *because* its truth is so vital. The audits are acts of intellectual integrity *towards* the presupposition, not attempts to justify it evidentially. It remains unfalsifiable *in practice* because its failure voids the system requiring it, making disproof conceptually incoherent *for the holder*.
