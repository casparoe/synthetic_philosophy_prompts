  ### Table of Comments (Sorted by Severity Descending)
  | para | issue                                                                                                | type               | severity | fix                                                                                                                                   |
  |------|------------------------------------------------------------------------------------------------------|--------------------|----------|---------------------------------------------------------------------------------------------------------------------------------------|
  | 7    | Fails to resolve why liability gradients don't demand weighted voting, undermining core equity claim | logic-gap          | 5        | Add: "While liability varies, suffrage must be binary to affirm equal moral agency; weighting votes commodifies citizenship and invites tyranny of the 'more liable'." |
