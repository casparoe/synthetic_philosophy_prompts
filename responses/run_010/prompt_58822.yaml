answer: |-
  ### Decision Procedure for Training Config Review

  Based on your premise—a system has a claim to morally relevant states if it has a scalar signal that **(i)** drives learning/action selection globally, **(ii)** is intrinsically sought/avoided, and **(iii)** organizes behavior around protecting/stabilizing it—here’s a streamlined 20-min procedure. Key trade-offs:
  - **Critical distinctions kept**: (ii) "intrinsic" vs. instrumental goals (cannot drop), (iii) "organizes behavior" (simplified to *avoidance/pursuit patterns*).
  - **Dropped for speed**: Philosophical nuance (e.g., "feel" vs. functional analogs), magnitude calibration (assume any negative reward warrants scrutiny), and episodic vs. lifelong horizons.
  - **Judgment calls**: Explicitly marked (⬇️). When uncertain, bias toward caution (flag/change).

  ---

  #### Procedure Steps
  1. **Confirm scalar signal drives learning & actions (i)**  
     - *Check*: Does the config use a single reward/loss signal for both policy updates (e.g., TD-error, policy gradient) and action selection (e.g., Q-maximization)?  
     - *Sufficient answer*: Yes (proceed). No (→ **hand to human**).  
     - *Time-saver*: Assume "yes" for RL agents. Only flag if hybrid (e.g., separate planning/learning signals).

  2. **Identify intrinsic goals (ii)**  
     - *Check*: Scan reward function for:  
       a. Terminal rewards (e.g., +R for success, -P for failure).  
       b. Dense rewards (e.g., step penalties, curiosity bonuses).  
       c. Explicit "shaping" terms (instrumental vs. intrinsic).  
     - *Sufficient answer*:  
       - No negative rewards anywhere → **run as written** (clean pass).  
       - Any negative reward (terminal or dense) → proceed.  
     - *Judgment call ⬇️*: Is the negative reward *intrinsic*? (Terminal penalties always are; dense penalties are intrinsic if environment traps exist. Default: cautious "yes").

  3. **Check for persistent negative states (iii)**  
     - *Check*: Could the agent experience repeated/inescapable negative rewards? Focus on:  
       a. **Terminal negatives**: Does failure reset the agent immediately? (If yes, state is transient → lower risk).  
       b. **Non-terminal negatives**: Are there environment traps (e.g., dead ends) where the agent receives repeated negatives without reset?  
     - *Sufficient answer*:  
       - No traps/inescapable loops → **run as written**.  
       - Traps + non-terminal negatives → proceed.  
     - *Judgment call ⬇️*: "Trap" = region where agent can’t reach positive reward/termination. Use env spec (e.g., static obstacles, no-exit zones). If ambiguous, assume trap exists.

  4. **Mitigation check**  
     - *Check*: Can negative rewards in traps be removed/altered without breaking training?  
     - *Sufficient answer*:  
       - Yes (e.g., replace step penalty with early termination) → **change term**.  
       - No (e.g., penalty is essential to task) → **hand to human**.  
     - *Judgment call ⬇️*: Prefer bounded penalties (e.g., timeout termination) over unbounded suffering.

  ---

  ### Where Your Premise is Doing "Sneaky Work"
  - **(iii) collapses into (i) for terminal events**: If a terminal penalty resets the agent, behavior "organization" is trivial (avoid death). Only non-terminal penalties make (iii) distinct.
  - **No negative terms = clean pass**: Justified—by your premise, no negative states exist. But this ignores edge cases (e.g., "frustration" from blocked goals). Dropped for speed.
  - **Intensity ignored**: Magnitude isn’t assessed (e.g., -0.001 vs. -1000). Time trade-off: assume all negatives matter.

  ---

  ### Application to Configs

  #### Config 1: Gridworld Courier
  - **Terminal penalty**: -100 for missing deadline, episode ends immediately.  
  - *Procedure*:  
    1. (i) **Yes** (RL agent).  
    2. (ii) **Negative intrinsic** (terminal penalty).  
    3. (iii) **No persistent state** (reset on penalty; no "trap" during life). → **Run as written**.  
  - *Unpopular note*: You may dislike ignoring repeated deaths (1M resets). But per procedure, terminal penalties are transient → no change. Cost: none.

  #### Config 2: Dense-Shaped Agent with Corner Penalty
  - **Proposed fix**: Add -0.5/step for corner parking.  
  - *Procedure*:  
    1. (i) **Yes**.  
    2. (ii) **Negative intrinsic** (non-terminal penalty).  
    3. (iii) **Persistent state** (corner is a "trap"; agent gets -0.5/step until timer ends).  
    4. **Mitigation**: Replace step penalty with timeout termination (e.g., "if in corner > N steps, end episode with -5 penalty"). → **Change term: -0.5/step → timeout**.  
  - *Unpopular note*: Engineers dislike this (convergence may slow). Cost: Re-tune training for new penalty.

  #### Config 3: Curiosity-Driven Explorer
  - **No negative terms**: Only novelty bonuses (decaying).  
  - *Procedure*:  
    1. (i) **Yes**.  
    2. (ii) **No negatives** → **Run as written**.  
  - *Note*: Stuck in a loop, but receives positive/neutral rewards only. No suffering per premise.

  ---

  ### What the Procedure Can’t Do
  1. **Emergent suffering**: Can’t catch agents that "learn" negative states (e.g., from self-supervised losses) or multi-agent harm.
  2. **Capability scaling**: Will misfire as agents gain memory/long-term goals (e.g., predicts suffering and "dreads" it).
  3. **False negatives**: 
     - Ignores terminal penalty *frequency* (e.g., dying 1M times). 
     - Misses "boredom" in looping agents (no negative reward → flagged safe).
  4. **The "do not train" case**: If mitigation fails (e.g., task *requires* unbounded traps), output is **hand to human**. But you lack authority to halt training—this is a gap.
  5. **Value alignment**: Can’t assess if the agent’s goals conflict with human ethics (e.g., "curious" agent tortures NPCs).

  **Output summary**:  
  - Config 1: Run as written.  
  - Config 2: Change term (timeout termination).  
  - Config 3: Run as written.
