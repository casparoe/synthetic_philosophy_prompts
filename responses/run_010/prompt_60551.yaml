answer: |-
  Right, this isn't just an odd one—it's a beautifully messy case of game theory colliding with flatmate politics. Your rules aren't rubbish, and this isn't a dead end, but the situation feels stuck because your preferences create a cycle when viewed naively. Let's break it down step by step, using your rules as the framework. I'll be blunt (but constructive) because that's what you need.

  ### Step 1: Map out everyone's preferences clearly
  You've got three options:
  - **A: Mo reads it**  
  - **B: Dez reads it**  
  - **C: No one reads it** (goes back in the drawer)  

  Based on your description:
  - **Mo's preferences**: C > A > B  
    (She'd rather no one reads, but if someone must, it should be her to control the fallout. She actively dislikes Dez reading it.)
  - **Dez's preferences**: A > B > C  
    (He'd most enjoy the spectacle of Mo reading it—implied by "watching Mo read it"—then reading it himself for fun, and least prefers no one reading it. His "if she won't, he certainly will" means B > C if A is off the table.)
  - **Your preferences**: A > C > B (inferred from your words)  
    You explicitly prefer A (Mo reads) over B (Dez reads). You don't state your view on C vs. B, but since you're the author and want this handled discreetly, it's reasonable to assume you prefer C (no one reads) over B (Dez reads for fun). So: A > C > B.

  ### Step 2: Apply Rule 2 to eliminate dominated options
  Rule 2 says: If all three prefer one outcome over another, that's binding. Let's compare the options pairwise:
  - **A vs. B (Mo reads vs. Dez reads)**:  
    - Mo prefers A to B.  
    - Dez prefers A to B.  
    - You prefer A to B.  
    → **All three prefer A over B**. By Rule 2, B must be off the table—Dez reading it is forbidden.  
  - **A vs. C (Mo reads vs. no one reads)**:  
    - Mo prefers C to A.  
    - Dez prefers A to C.  
    - You prefer A to C (since you want feedback, and Mo is your trusted editor).  
    → No unanimous preference. Rule 2 doesn't apply.  
  - **B vs. C (Dez reads vs. no one reads)**:  
    - Mo prefers C to B.  
    - Dez prefers B to C.  
    - You prefer C to B.  
    → No unanimous preference. Rule 2 doesn't apply.  

  **Result**: B is eliminated by Rule 2. Only A and C are viable options now.

  ### Step 3: Apply Rule 1 to resolve between A and C
  Rule 1 gives each person absolute veto over reading. Since B is gone, the choice is between A and C:
  - If Mo agrees to read, A happens.  
  - If Mo refuses to read, C happens (no one reads).  

  Mo's preferences: She prefers C to A, but she *also* knows that if she refuses to read (leading to C), Dez might still push for B. But Rule 2 already forbade B, so Dez can't read it—everyone must respect that. With B off the table, Mo's choice is simple:  
  - If she reads, A happens.  
  - If she doesn't, C happens.  

  Since Mo prefers C to A, she will refuse to read, forcing C (no one reads).  

  **Outcome**: C wins—no one reads it, and it goes back in your drawer.

  ### Why it feels like a dead end (but isn't)
  You said whichever option you land on "loses to another" by your rules. Let's test that with the actual outcome (C):
  - **Does C lose to A?** Only if all three prefer A to C. But Mo prefers C to A, so no.  
  - **Does C lose to B?** B is already forbidden by Rule 2, and no one prefers B to C unanimously.  

  The cycle you're sensing comes from Dez's bluff-like statement ("if she won't, he certainly will"), which threatens B. But Rule 2 binds everyone: once all three agree A > B, Dez can't force B. The rules break the cycle by eliminating B first. Mo's refusal then leads cleanly to C. No rule is violated.

  ### Why the rules are fair (and you're not dense)
  - **Rule 1** protects autonomy: No one is forced to read or blocked from reading.  
  - **Rule 2** ensures unanimity trumps when possible—it just needed to be applied rigorously.  
  - **The apparent deadlock** arose because you all focused on "which option" without first using Rule 2 to prune options. It’s a classic Condorcet paradox (like in voting theory), but your rules resolve it. You're not dense—this is counterintuitive until mapped out.

  ### What to do about the copy on the kitchen table tonight
  1. **Call a quick flat meeting** (or group chat if tensions are high). Say: "We all agreed to these rules, so let's apply them step by step to avoid a row. Rule 2 kills Dez reading it because we all prefer Mo reading over Dez reading. That leaves Mo reading or no one reading. Rule 1 means Mo decides whether she reads. We respect her choice."  
  2. **Mo will likely refuse to read it** (since she prefers no one reading). Result: **Put the copy back in your drawer immediately**. Do this tonight—leaving it out invites chaos.  
  3. **If Dez protests**, remind him:  
     - Rule 2 forbade him reading it (all three agreed A > B).  
     - He can't "watch Mo read it" because she controls her choice (Rule 1).  
     - His preferences are satisfied as much as possible—A was his top choice, but Mo's veto is absolute.  

  **Long-term fix for future chapters**: Clarify Rule 2 with examples so preferences are discussed pairwise upfront. Maybe add: "When options conflict, Rule 2 is applied first to eliminate any option all three agree is worse than another."

  This resolves your stalemate without bending the rules. The copy goes untouched, Mo gets her preferred outcome, and you avoid Dez's fun-at-others'-expense. Now, go write your fourth book—and maybe fictionalize this mess. It's gold.
