prompt: |-
  I spent most of last night arguing with a friend who works on formal ethics about what to do when you don't know which moral theory is true, and I came away genuinely unsure whether my own position holds together. Here it is, as plainly as I can state it:

  (1) Exactly one first-order moral theory is true, and which one it is does not depend in any way on my credences.
  (2) Since I don't know which theory that is, the right procedure is to maximize expected choice-worthiness: assign each option a choice-worthiness under each candidate theory, weight by my credence in that theory, and take the option with the highest total.
  (3) Comparisons of choice-worthiness across theories are possible, but only roughly — I don't believe there is a precise cardinal exchange rate between, say, a utilitarian and a deontological verdict, and I won't pretend there is one.
  (4) Where comparison genuinely fails, I switch to something like a parliamentary model: the theories send delegates in proportion to my credences, and the delegates bargain.
  (5) I don't think the fanaticism objection defeats expected-value reasoning in general, but I do impose a ceiling: no two percent credence in an astronomically large good may override what I am near-certain is a serious wrong here and now.
  (6) An agent who follows (2) and thereby does what is objectively wrong has done wrong, full stop — though she is not criticizable for it, since she reasoned as well as she could.
  (7) Moral uncertainty should not generate requirements for an agent who has no grasp of the theory in question; credence in something she could not articulate shouldn't move her.

  Please audit this set rather than lecture me: which of these commitments pull against one another, which pairs only look like they do, and what the least costly revision would be in each real case. Rank the genuine tensions by severity instead of treating them as equally bad, and close by naming the single revision that would clean up the most.
reasoning: |-
  Okay, the user has presented a complex set of propositions about moral uncertainty and wants me to audit them for internal consistency. They've clearly spent considerable time refining this position after debating with a formal ethics specialist. 

  First, I need to understand their core framework: they're committed to moral realism (exactly one true moral theory) but acknowledge epistemic limitations. Their solution blends expected choice-worthiness maximization with parliamentary fallbacks and anti-fanaticism safeguards. The parliamentary model particularly stands out as an innovative response to incommensurability.

  Hmm, the most severe tension seems to be between proposition (1) and (3). If moral truth exists independently of our beliefs, how can we justify cross-theory comparisons without any objective grounding? The user dismisses precise cardinal exchange rates but still relies on rough comparability. This feels like trying to have epistemological cake while eating it too. The parliamentary model in (4) attempts to address this, but then clashes with (2)'s expected value approach - you can't simultaneously calculate expected value and resort to bargaining when comparisons fail.

  The fanaticism ceiling in (5) is pragmatic but introduces arbitrariness. Why cap at "two percent credence" specifically? And "serious wrong here and now" is dangerously subjective. This feels like an ad hoc patch rather than principled solution. 

  Propositions (6) and (7) seem relatively stable internally, though (7)'s requirement exclusion might create perverse incentives against moral education. If I couldn't articulate utilitarianism, does that mean I'm free to ignore suffering? That seems... problematic.

  For the cleanup suggestion: reconciling (1) and (3) by softening moral realism would resolve the deepest fracture. If we allow that cross-theory comparisons gain legitimacy through our epistemic limitations rather than ontological grounding, the parliamentary model could become the primary tool rather than fallback. This would cascade positively by making (2) and (4) compatible.

  The user's frustration with academic ethics is palpable between lines - they want practical decision procedures, not metaphysical debates. I should resist lecturing and focus strictly on structural integrity as requested. Their hybrid model shows impressive nuance despite tensions; the parliamentary approach especially deserves recognition for addressing real-world moral paralysis.
answer: |-
  Here's an audit of your position, ranking tensions by severity and identifying the least costly revisions:

  **Severe Tensions (Potentially Fatal Flaws):**

  1.  **(1) vs. (3):** This is the most fundamental conflict.
      *   **Conflict:** (1) asserts a single, mind-independent moral truth. (3) claims cross-theory choice-worthiness comparisons are possible, even if "roughly." But if theories are truly distinct and incompatible at the fundamental level (e.g., Kantian duties vs. utilitarian welfare), *what grounds these comparisons?* How can a "rough exchange rate" exist between incommensurable values if only one theory is objectively true? The truth of one theory implies the *falsity* and *irrelevance* of the others' value metrics. Comparisons seem ontologically unjustified.
      *   **Least Costly Revision:** Soften (1) to allow for *epistemic access* justifying rough comparisons despite ontological realism (e.g., overlapping values, shared intuitions, or a meta-norm for uncertainty). Alternatively, abandon strong realism in (1) for a more constructivist/pragmatic view where cross-theory comparisons gain legitimacy *because* of our uncertainty.

  **Significant Tensions (Requiring Substantial Adjustment):**

  2.  **(2) vs. (4):** The core procedural conflict.
      *   **Conflict:** (2) mandates maximizing *expected choice-worthiness*, requiring cardinal intertheoretic comparisons. (4) explicitly kicks in when such comparisons "genuinely fail," switching to a bargaining model. These procedures are fundamentally different and mutually exclusive for a given decision. You cannot simultaneously maximize expected value *and* have delegates bargain. (4) functions as an escape hatch, undermining the universality of (2).
      *   **Least Costly Revision:** Elevate (4) to the primary procedure. Frame (2) as a special case that applies *only when* sufficiently precise cardinal comparisons *are* possible. (This links directly to resolving the (1) vs. (3) tension). Alternatively, make the "ceiling" in (5) a core part of the expected value calculation (though this is complex).

  3.  **(2)/(3) vs. (5):** The Fanaticism Ceiling vs. Expected Value.
      *   **Conflict:** (2) & (3) endorse expected value maximization, which is vulnerable to fanaticism (tiny credences in huge payoffs dominating). (5) imposes an *external cap* blocking this. This cap isn't derived from the expected value calculation itself; it overrides it. Why is this cap justified within the framework? It seems like an ad hoc constraint contradicting the logic of (2) when comparisons *are* deemed possible.
      *   **Least Costly Revision:** Integrate the concern into the comparison framework (3). Argue that genuinely "failing" comparisons include cases where theories demand astronomically divergent payoffs based on tiny credences. Let (4) handle these. Alternatively, adopt a risk-averse or variance-sensitive decision rule under uncertainty instead of pure expected value maximization.

  **Moderate Tensions (Conceptual Friction):**

  4.  **(3) vs. (4):** Vagueness of "Comparison Genuinely Fails".
      *   **Conflict:** The switch from (2) to (4) hinges on comparison "genuinely" failing. Given (3) admits only "rough" comparisons, the line between "roughly comparable" and "genuinely failing" is inherently vague and subjective. This creates significant procedural ambiguity.
      *   **Least Costly Revision:** Explicitly define thresholds for when comparisons are deemed "imprecise enough" to trigger (4). Acknowledge the vagueness and make the parliamentary model more central, perhaps weighting delegate influence by both credence *and* the perceived comparability/clarity of the theory's verdicts.

  5.  **(6) vs. Overall Framework:** Blameworthiness despite Best Efforts.
      *   **Conflict:** While logically consistent with (1), declaring an agent "has done wrong, full stop" *solely* because they followed the best possible procedure under uncertainty (2, 3, 4, 5) feels harsh and potentially undermines the motivation for the elaborate procedure. It creates a disconnect between "subjective rightness" (procedural) and "objective rightness" (outcome).
      *   **Least Costly Revision:** Reframe (6) to emphasize the *regret* or *tragedy* of the situation ("unfortunately did wrong" or "caused the wrong outcome") rather than implying direct agential blameworthiness ("has done wrong"). Maintain the non-criticizability clause strongly.

  **Minor Tension / Clarification Needed:**

  6.  **(7):** The Articulation Requirement.
      *   **Potential Conflict:** While intuitively plausible, this needs refinement to avoid perverse incentives. Does "grasp" mean ability to state axioms? Apply consistently? What level of misunderstanding nullifies credence? Could this encourage willful ignorance?
      *   **Least Costly Revision:** Clarify "grasp" as a minimal understanding sufficient to recognize the theory's *practical implications* for the choice at hand. Credence requires believing one *understands enough to see why the theory might be compelling and relevant*. Avoid overly stringent intellectualism. "Could not articulate" should mean *fundamentally incomprehensible to the agent*, not just difficult to explain.

  **Pairs That Only *Look* Like They Conflict (But Don't):**

  *   **(1) vs. (2):** Independence of truth from credences is compatible with using credences epistemically to guide action under uncertainty. (2) is an epistemic procedure, not a claim about ontology.
  *   **(1) vs. (6):** The objective wrongness of the act is perfectly consistent with the truth of (1), even if the agent used the best subjective procedure.
  *   **(2) vs. (7):** It's coherent to say uncertainty guides action *only* for theories the agent has some minimal grasp of. Excluding theories one cannot comprehend is reasonable within the expected value framework.

  **Ranked Genuine Tensions by Severity:**

  1.  **(1) vs. (3):** Ontological realism vs. Intertheoretic comparisons. (Most Severe)
  2.  **(2) vs. (4):** Expected Value vs. Parliamentary Bargaining (Core Procedural Conflict).
  3.  **(2)/(3) vs. (5):** Expected Value Logic vs. Fanaticism Override.
  4.  **(3) vs. (4):** Vagueness of the Comparison Failure Trigger.
  5.  **(6) vs. Framework:** Harshness of "Done Wrong" verdict.
  6.  **(7):** Need for clarification on "grasp/articulate". (Least Severe)

  **The Single Revision Cleaning Up the Most:**

  **Reconciling (1) and (3) by softening the strong realism in (1).**

  *   **Why:** This is the foundational tension. Resolving it (e.g., by grounding comparisons in pragmatic necessity for decision-making under uncertainty, overlapping values, or shared meta-norms) makes the cross-theoretic comparisons in (2) and (3) ontologically coherent. This, in turn, significantly clarifies the relationship between (2) and (4) – expected value becomes the default *when comparisons are deemed sufficiently meaningful*, with the parliamentary model reserved for true impasses. It also indirectly supports the fanaticism ceiling (5) as a guardrail against relying on comparisons deemed *too* speculative or stretched. Addressing this core allows the rest of the structure to hold together much more robustly.
