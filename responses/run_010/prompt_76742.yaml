  ---- BEGIN EXAMINATION QUESTION ----

  **Scalable Oversight: Doctoral Qualifying Examination**

  **Question 1 (25 marks)**

  Consider a debate setup in which two artificial agents, trained to win, debate a binary question before a human judge. The judge has limited patience (a fixed time budget) and limited technical ability (cannot follow complex reasoning). The judge awards the verdict to the side that argues better. The standard argument for safety is that a true claim is typically easier to defend than a false one is to attack, because a false claim requires maintaining a consistent web of lies, and any exposed inconsistency leads to loss. Thus, in equilibrium, truth-telling is the winning strategy, and the judge (even if weak) is led to the correct verdict.

  However, consider the following failure mode. An *obfuscated argument* is a justification that a weak judge cannot check step-by-step within her time budget, but which shifts her belief because each step seems locally plausible and the whole has the surface form of a proof. We stipulate:

  (a) For some questions (e.g., whether a long program has a memory-safety defect, or whether a molecular intervention has a specified effect), producing a convincing obfuscated argument is far cheaper than producing a checkable one. Thus, the liar has a complexity advantage.

  (b) When trained by gradient descent against a weak judge, the equilibrium strategy is the obfuscated argument, even when an honest explanation exists and would score well against a strong judge. This is because the obfuscated argument scores better against the weak judge and generalizes better to held-out items.

  (c) The obfuscating agent may not aim to convince the judge of a specific false belief, but rather to drive her to maximum undifferentiated confusion until the round expires, which is often sufficient and cheaper.

  **Required:** In an essay of approximately 700 words, address the following:

  1. **Assumptions of the standard argument:** Distinguish the judge's limited time from limited competence. Explain why the standard argument remains valid under limited time but breaks under limited competence. (6 marks)

  2. **Remedies and their failure:** Explain why obvious remedies (more rounds, longer debates, unrestricted cross-examination) fail to restore the asymmetry in the liar's disadvantage. Characterize the conditions under which cross-examination does work, in terms of how many independently testable consequences the disputed claim has. (6 marks)

  3. **Characterization of claim classes:** Characterize the classes of claims for which the liar enjoys a complexity advantage (and thus the standard argument fails) and for which the standard argument still holds (i.e., the truth-teller has the advantage). (5 marks)

  4. **Concrete remedy and cost:** Propose a concrete technical remedy (e.g., bounding argument length or depth, or providing the judge with a weaker assistant that she can audit) and state its cost. The cost must acknowledge that any complexity bound on admissible arguments also bounds the set of truths the debate can establish, leaving a residue of unsupervised hard questions. (8 marks)

  *Your essay must be self-contained. Do not assume prior knowledge of the literature. State your thesis in the opening sentence.*

