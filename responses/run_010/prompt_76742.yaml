  **Model Answer (approx. 700 words):**

  The failure of the standard debate setup under judge incompetence arises because the liar can exploit the judge's cognitive limitations with obfuscated arguments that are cheaper to produce than checkable ones, thereby inverting the expected asymmetry and making deception the equilibrium strategy.

  The standard argument assumes that the judge's limitation is only in time, not in competence. Limited time implies that the judge cannot exhaustively check every step, but the argument relies on the fact that an inconsistency, if present, is likely to be found by one agent pointing it out. This works because the truth-teller can focus on a single inconsistency to win, which is efficient in time. However, limited competence means the judge cannot follow the steps even if given time, so she cannot recognize an inconsistency in a complex argument. Thus, the standard argument survives limited time (because a single inconsistency can be highlighted quickly) but breaks under limited competence (because the judge may not understand the inconsistency).

  Obvious remedies such as more rounds, longer debates, or cross-examination fail because they do not address the core problem: the judge cannot understand the arguments. More time does not help if the judge lacks the competence to follow. Cross-examination, where agents question each other, might seem to force clarity, but it fails when the claim under debate has few independently testable consequences. For cross-examination to work, the disputed claim must entail many such consequences that the judge can test without deep expertise. For example, if the claim is about a program's memory safety, a single test case that crashes the program is an independently testable consequence. But for claims with few consequences (e.g., a complex mathematical conjecture with no obvious corollaries), cross-examination cannot force exposure because the liar can obfuscate without fear of immediate contradiction.

  The liar's complexity advantage holds for claims that are "monolithic": they have few independently verifiable sub-claims and require a long chain of reasoning to verify. Examples include verifying the safety of a large program or the effect of a molecular intervention. For such claims, the truth-teller must build a long, checkable argument, which is expensive, while the liar can cheaply generate a plausible but uncheckable obfuscation. Conversely, the standard argument holds for claims that are "decomposable": they break into many independently testable sub-claims. For example, a claim about the properties of a dataset can be checked by sampling, and each sample is a testable consequence. Here, the liar must maintain consistency across many points, which is hard, and the truth-teller can win by exposing one false sub-claim.

  A concrete remedy is to bound the inferential depth of admissible arguments, forcing each step to be auditable by the judge. For instance, we could require that no argument may exceed a fixed number of logical steps, each within the judge's competence. The cost is that this bounds the complexity of truths the debate can establish. If the true answer requires a long chain of reasoning, it cannot be presented. Thus, the remedy converts a hard question into a set of simpler questions the judge can handle, but leaves the hardest questions unsupervised. Alternatively, we might provide the judge with a weaker assistant (e.g., an AI that answers sub-questions) that the judge can audit by spot-checking. This extends the judge's competence, but the audit cost grows with the complexity of the assistant, and there remains a residue of questions too hard for the assistant.

  In both cases, the remedy trades off the scope of supervision for safety. The debate setup then becomes a method for extending oversight to questions just beyond the judge's unaided ability, but not arbitrarily far. The residue of unsupervisable questions must be handled by other means, such as empirical testing or structural safeguards.

