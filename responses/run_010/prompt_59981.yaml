  ### In-Class Activity Design: Unmasking the Heritability Trap

  **Objective:** Students will calculate a heritability estimate from simulated data, then confront a group gap scenario where environmental factors cause the difference—revealing common misconceptions about heritability.

  ---

  #### **Activity Setup (25-30 minutes)**
  **Materials:** 
  - 50 six-sided dice (2 per student)
  - Pre-printed recording sheets (1 per student)
  - Calculator for variance (students know the formula: \(\text{Var} = \frac{\sum (X_i - \bar{X})^2}{n-1}\))

  **Population A: High Heritability (Homogeneous Environment)**  
  1. **Explain the Model:**  
     - "Each person has a *genetic potential* (G) and an *environmental influence* (E). Their observed trait score (P) is \(P = G + E\)."  
     - Assign each student 2 dice for G (genotype): Roll both, sum = G (range 2–12).  
     - Assign 1 die for E (environment): Roll once.  
       - Map: 1–3 → E = 0; 4–6 → E = 1.  
     - Calculate P: \(P = G + E\).  

  2. **Data Collection:**  
     - Students record G, E, P for themselves.  
     - Instructor compiles class data on the board:  
       - 25 G values, 25 P values.  

  3. **Variance Calculation (Student-Led):**  
     - Students compute:  
       - \(\text{Var}(G)\) = Variance of genetic scores.  
       - \(\text{Var}(P)\) = Variance of phenotypic scores.  
     - **Heritability** (unnamed): \(h^2 = \frac{\text{Var}(G)}{\text{Var}(P)}\).  
     - *Expected Result*:  
       - \(\text{Var}(G) \approx 5.83\) (theoretical variance of 2d6).  
       - \(\text{Var}(E) \approx 0.25\) (theoretical: Bernoulli trial with p=0.5).  
       - \(\text{Var}(P) = \text{Var}(G) + \text{Var}(E) \approx 6.08\) (since G and E independent).  
       - \(h^2 \approx 5.83 / 6.08 \approx 0.96\) (high—environmental variance is minimal).  

  **Trap Spring:**  
  - Instructor: "In this population, genetic differences explain almost all variability in the trait. Now, let’s examine a *different* population."

  ---

  #### **Population B: Group Gap (Purely Environmental)**  
  **Materials:** Same dice, new recording sheets.  
  1. **Split Class:** Group 1 (13 students), Group 2 (12 students).  
  2. **New Rules (Hidden from Students):**  
     - **Group 1 (Privileged Environment):** Same as Population A:  
       - \(P = G + E\) (E: 1–3→0, 4–6→1).  
     - **Group 2 (Deprived Environment):**  
       - \(P = G + E - 5\) (E: same roll as Group 1).  
       - *Instructor secretly subtracts 5* during data compilation.  
  3. **Data Collection:**  
     - Groups roll G and E separately.  
     - Instructor compiles **group averages only** on the board:  
       - Group 1 average P ≈ 7.5 (expected: G=7, E=0.5).  
       - Group 2 average P ≈ 2.5 (G=7, E=0.5, then −5).  
     - **Reveal gap:** "Group 1 avg: 7.5, Group 2 avg: 2.5. Difference = 5.0."  

  4. **Trap Question:**  
     - "What explains this gap? Discuss with a partner for 2 minutes."  
     - *Prediction*: >80% of students will say "genetics," citing Population A’s high \(h^2\).  

  ---

  #### **Debrief (45 minutes)**  
  **Step 1: Reveal the Trap**  
  - Show Group 1 and Group 2 had identical G distributions (avg G ≈7 for both).  
  - Expose the environmental manipulation: "Group 2’s scores were reduced by 5 points—*no genetic difference existed*."  

  **Step 2: Map Activity to Heritability Concepts**  
  | **Activity Moment**       | **What \(h^2\) Measures**                          | **What \(h^2\) Does NOT Measure**                  |  
  |---------------------------|---------------------------------------------------|---------------------------------------------------|  
  | Population A’s high \(h^2\) | Proportion of **within-group** variance from genetics in **that specific environment**. | Cause of **between-group** differences. |  
  | Group gap in Population B | (Not calculated!)                                | Genetic superiority of Group 1 (gap was purely environmental). |  
  | Variance components       | \(\text{Var}(G)\) and \(\text{Var}(P)\) are population-specific. | Fixed "genetic potential" (G interacts with E). |  

  **Step 3: Predictable Student Errors**  
  1. **The Trap Fallacy:**  
     - "Population A had high \(h^2\), so genetics *must* explain Group 2’s lower scores."  
     - **Corrective:** \(h^2\) is local. Population B had a new environmental factor (the −5 shift), altering the variance structure.  

  2. **The Resistors (2–3 Students):**  
     - "We didn’t measure genetics in Population B!" or "Couldn’t environment cause the gap?"  
     - **Use Their Insight:** Validate their caution—real science requires direct evidence. Most students overlook this.  

  3. **Other Common Mistakes:**  
     - Equating high \(h^2\) with "immutable."  
     - Assuming \(h^2\) applies to individuals ("My G is 70% of my P").  

  **Step 4: Simulation Limitations (Be Frank!)**  
  - **Unmodeled Realities:**  
    1. **G×E Interaction:** In reality, genetics and environment interact (e.g., same E affects G differently). Our model: \(P = G + E\) (additive only).  
    2. **Assortative Mating:** Choosy pairing changes \(\text{Var}(G)\) across generations. Our model: random mating.  
    3. **Variance Estimation:** Real \(h^2\) uses kinship correlations (e.g., twin studies), not direct \(\text{Var}(G)\). Our shortcut bypasses this complexity.  
  - **Key Takeaway:**  
    > "\(h^2\) is a population statistic, **not** a destiny decoder. It explains variation in a specific context and licenses **zero** inferences about group gaps."  

  **Step 5: Connection to Real World**  
  - **Example:** 1970s IQ debates (Jensen’s fallacy). High within-group \(h^2\) for IQ ≠ genetic cause of between-group gaps.  
  - **Critical Question:** "If a trait has high \(h^2\) in both Groups 1 and 2 separately, does the gap *must_ be genetic?" (No! Environmental shifts can dominate between-group differences.)  

  ---

  #### **Instructor Prep Checklist**  
  1. **Test Variance:**  
     - Simulate 25 rolls of 2d6 for G: \(\text{Var}(G) \approx 5.83\).  
     - Simulate E: 25 trials of d6→{0,0,0,1,1,1}, \(\text{Var}(E) \approx 0.25\).  
     - \(\text{Var}(P) = \text{Var}(G) + \text{Var}(E) \approx 6.08\) → \(h^2 \approx 0.96\).  
  2. **Group Gap:**  
     - Group 1 avg P = (avg G) + (avg E) ≈ 7 + 0.5 = 7.5.  
     - Group 2 avg P = (avg G) + (avg E) − 5 ≈ 7 + 0.5 − 5 = 2.5.  
  3. **Logistics:**  
     - Assign dice/mapping clearly.  
     - Pre-load "E" interpretation: "1–3 = 0, 4–6 = 1" to avoid confusion.  
     - Subtract 5 from Group 2 *during* data entry to maintain the blind.  

  This activity forces students to confront their biases, using hands-on data to reveal the heritability trap. The debrief links each step to conceptual pitfalls, preparing students to critically evaluate real-world claims.
