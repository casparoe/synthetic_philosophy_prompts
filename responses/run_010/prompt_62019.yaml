  We are creating a procedure based on Grice's theory of conversational implicature to determine whether a message conveys an implied meaning. The core of Grice's theory is that communication is governed by the Cooperative Principle and maxims (Quality, Quantity, Relation, Manner). Implicatures arise when a speaker flouts a maxim and the listener infers the intended meaning.

  However, the constraints are:
  - Analysts have only the written message and one page of agreed background facts.
  - No tone of voice, no interviews, no access to intentions.
  - About 45 minutes per case.
  - Must be a step-by-step procedure that can be run consistently.

  We'll break down the procedure into steps, each with a test and a decision point.

  The procedure must not rely on the availability of an unproblematic denial as evidence against an implied meaning because that would let deliberate offenders off the hook. Instead, we focus on what a reasonable recipient would infer in the context, given the Cooperative Principle and the maxims.

  Procedure Outline:

  1. **Literal Meaning**: Establish the literal meaning of the message (what is said).
  2. **Relevance and Obviousness**: Check if the literal meaning is relevant and complete in the context. If not, an implicature might be present.
  3. **Maxim Violation**: Check if the utterance, taken literally, violates any Gricean maxim. If it does, then an implicature might be triggered to preserve the Cooperative Principle.
  4. **Plausible Deniability**: This is the tricky part. We note that the possibility of denial does not by itself rule out an implicature. We focus on whether the implicature is the most reasonable inference in the context.
  5. **Institutional Values**: If the test leads to ambiguity or multiple reasonable interpretations, then we hand the case to the panel because the decision requires weighing institutional values.

  Steps of the Procedure:

  ### Step 1: Literal Meaning
  - **Test**: What does the message literally say? Ignore any implications for now.
  - **Analyst Action**: Write down the literal meaning using only the words in the message and the agreed background facts. Do not add, remove, or change any words.
  - **Sufficient Answer**: A clear statement of the literal content without interpretation.
  - **Outcome**: If the literal meaning, in the given context, is sufficient to explain the complaint (i.e., the complaint is about what was said, not implied), then the case ends with "no implied meaning found" and the complaint is about the literal meaning. Otherwise, proceed to Step 2.

  ### Step 2: Contextual Relevance
  - **Test**: Is the literal meaning of the message relevant to the context (as given by the background facts)? 
  - **Analyst Action**: Check the background facts to see what the situation was. If the message is not relevant to that situation, then it might be flouting the maxim of Relation, suggesting an implicature.
  - **Sufficient Answer**: If the message is irrelevant to the context, then an implicature is likely. If it is relevant, then we proceed to Step 3.
  - **Outcome**: 
    - If irrelevant, then an implicature is present. The analyst must then articulate what the implicature is (Step 4).
    - If relevant, go to Step 3.

  ### Step 3: Maxim Violation
  - **Test**: Does the message, taken literally, violate any of the Gricean maxims? We focus on:
    - **Quantity**: Is it too little or too much information?
    - **Quality**: Can we assume the speaker is truthful? (But note: we cannot assess truth, so we focus on whether the literal meaning is consistent with known facts and if it would be uninformative or misleading without an implicature.)
    - **Relation**: Already checked in Step 2, but if Step 2 found relevance, then Relation is not violated.
    - **Manner**: Is the message obscure, ambiguous, or disorderly?
  - **Analyst Action**: Check each maxim in turn. The most common in written messages without tone are Quantity and Relation. Also, note that a violation of a maxim (especially if flouted) triggers an implicature.
  - **Sufficient Answer**: If any maxim is violated, then an implicature is present. The analyst must articulate it (Step 4). If no maxim is violated, then proceed to Step 5.
  - **Outcome**: 
    - Violation found: Go to Step 4 to state the implicature.
    - No violation: Go to Step 5.

  ### Step 4: Articulate the Implicature
  - **Test**: What must the speaker have meant in order to be cooperative? This is the implicature.
  - **Analyst Action**: Using the maxim that was violated and the context, state the implicature. The implicature should be the minimal inference that would resolve the violation and make the utterance cooperative.
  - **Sufficient Answer**: A clear statement of the implied meaning that is not part of the literal content.
