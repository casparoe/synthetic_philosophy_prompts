  Supervisor's email: "For your information, I've been asked to compile a record of the interactions connected to this matter, and the ones involving you are included in it."
  Alleged: a threat of surveillance and retaliation.

  Background: The employee has just filed a complaint.

  Step 1: Literal meaning: The supervisor is informing the employee that they are compiling a record of interactions related to the matter (the complaint) and that the employee's interactions are part of that record.

