  Procedure Summary:

  1. **Literal Meaning**: Write down exactly what the words say. If the complaint is about that, end: implied meaning not at issue. Else, proceed.
  2. **Relevance (Relation Maxim)**: Is the literal meaning relevant to the context? 
     - If not, then an implicature is present. Go to Step 4.
     - If relevant, go to Step 3.
  3. **Check Other Maxims**:
