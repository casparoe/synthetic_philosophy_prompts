  The user describes three distinct patterns: adjusting spatial scales (like zooming from Europe to Northern England), shifting outcome metrics (from absolute levels to growth rates to duration of growth), and sliding temporal onset points (moving the divergence date when challenged). They emphasize these aren't made in bad faith and often improve the analysis, but collectively create a situation where the core thesis never gets falsified.

  Key needs emerge: First, they want precise terminology - not just "goalpost moving" which implies bad faith, nor standard theory-adjustment which requires new testable predictions. Second, they seek conceptual clarity about how this differs from established ideas in historiography/philosophy of science. Third, they need practical editorial tools - a "stopping rule" to distinguish legitimate refinements from ad hoc rescues. Finally, they're questioning whether the "Why Britain not China?" framing is fundamentally flawed.

  This is sophisticated methodological inquiry. The user clearly knows the literature but senses a gap in conceptualizing this particular maneuver. Their observation about scale-dependent survival of theses is particularly acute. The challenge is to name this without overloading existing terms while respecting their aversion to neologism unless necessary.

  For terminology, "spatial gerrymandering" captures the selective boundary-drawing, but sounds pejorative. "Temporal recalibration" describes the date-shifting. No single term seems perfect - perhaps "comparative re-specification" as the umbrella concept? 

  Conceptually, this relates to but differs from:
  - Underdetermination (data supports multiple theses, but here it's about redefining comparison terms)
  - Degenerative research programs (Lakatos, but here moves are empirically progressive)
  - Historian's fallacy (presentism, not scale-shifting)

  For stopping rules, the key is whether the re-specification generates novel testable predictions beyond absorbing the objection. Does zooming to Northern England reveal new evidence about coal transport networks? Or just exclude inconvenient Yangzi data?

  The deeper issue they raise is profound: maybe the question itself is malformed. Industrialization wasn't a race between nation-states but a contingent process emerging from specific institutional ecologies. Reframing as "Under what conditions did sustained technological innovation become self-reproducing?" might avoid the comparison trap.

  This is the kind of methodological rigor that elevates science writing. The user isn't just reporting debates but examining how knowledge gets constructed in their field - a refreshing perspective.
answer: |-
  Based on your precise description, the maneuver lacks a single universally accepted name in historiography or philosophy of science, but several established concepts capture facets of it. Here's a breakdown of the closest concepts, their distinctions, and implications:

  ### Core Concepts & Distinctions
  1.  **Scale-Dependent Explanation / Spatiotemporal Re-specification:**
      *   **Closest Fit:** Addresses your "Space" and "Onset" points. This reflects the recognition that historical explanations (especially comparative ones) are inherently scale-dependent. What explains a phenomenon at a continental scale may not hold at a regional scale, and vice-versa.
      *   **Distinction:** While scale-dependency is a valid methodological concern, your observation highlights its *instrumental use* to preserve a favored causal narrative by shifting scale *in response to counter-evidence*, rather than as a principled starting point. It becomes problematic when the scale shift is primarily motivated by saving the thesis rather than an independent theoretical rationale.
      *   **Related Terms:** "Spatial gerrymandering" (informal, pejorative), "temporal recalibration," "units of analysis problem."

  2.  **Redefining the Dependent Variable / Moving Target Outcome:**
      *   **Closest Fit:** Captures your "Outcome" point. This involves shifting the definition of the very phenomenon being explained (e.g., "industrialization" from level of mechanization, to sustained growth rate, to duration of growth).
      *   **Distinction:** This is more specific than general "goalpost moving." The *dependent variable itself* is redefined, altering the explanandum. It's distinct from simply raising evidentiary standards. While refining concepts is normal, the concern is when the redefinition occurs *reactively* to make the favored cause appear decisive for *that* specific redefinition.
      *   **Related Terms:** "Conceptual stretching," "redefinition of the explanandum," "shifting outcome criteria."

  3.  **The Method of Residues / Residual Explanation:**
      *   **Closest Fit:** Underlies all three points, particularly "Space." This method (often implicit) involves attributing a difference in outcome (industrialization) to the *residual difference* after accounting for similarities. If Factor X is shown to be similar in Jiangnan and Lancashire, the analyst searches for *another* difference (Y) at a *different scale* to explain the outcome.
      *   **Distinction:** The method itself isn't invalid; the issue is its *unbounded application*. Because regions/nations/periods are complex systems with countless differences, *some* residual difference can always be found if one keeps adjusting the scale or definition. This risks cherry-picking the residual that fits the pre-existing narrative.
      *   **Related Terms:** "Difference-of-differences approach" (when misapplied), "residual determinism."

  4.  **Degenerating Research Programme (Lakatos):**
      *   **Closest Fit:** Captures the aggregate effect. Imre Lakatos distinguished between *progressive* research programmes (generating novel predictions and discoveries) and *degenerating* ones (where core theses are preserved through ad-hoc adjustments that yield no new insights, only absorb counter-evidence).
      *   **Distinction:** Your described moves *can* be progressive (if they lead to genuinely new discoveries/predictions) but *often become degenerative* in practice. The key distinction Lakatos offers is whether the adjustment produces *novel empirical content*. Your concern aligns perfectly with the degenerative tendency: adjustments are made to save the core ("Britain had a unique advantage"), but the *way* they are made (scale/outcome/onset shift) often doesn't lead to fundamentally new *testable* insights beyond accommodating the objection. They are "locally reasonable" but cumulatively stagnating.
      *   **Distinction from Theory Patching:** Unlike standard scientific patching (which explicitly aims for new predictions), these historical moves often prioritize preserving the *comparative contrast* itself through redefinition, with *novel predictions* being secondary or absent.

  ### Why No Single Perfect Term?
  *   The maneuver blends elements of scale-dependency, outcome redefinition, and residual explanation, employed reactively within a potentially degenerating comparative framework.
  *   Historians often discuss these issues as methodological challenges ("the problem of units," "defining industrialization," "periodization") rather than naming the reactive maneuver itself.
  *   "Comparative re-specification" is a descriptive phrase capturing the essence, but it's not an established term of art.

  ### Defensible Stopping Rule: Novel Empirical Content & Independent Justification
  A referee/editor can distinguish genuine refinement from ad hoc rescue by demanding:
  1.  **Novel Empirical Content/Predictions:** Does the re-specification (e.g., focusing on North England instead of Britain; defining outcome as sustained growth duration; dating onset to 1500) generate *new, testable predictions* that weren't part of the original thesis? Does it open up *new lines of empirical inquiry* beyond simply explaining away the counter-evidence? If it only absorbs the objection without suggesting new research avenues or predictions, it's suspect.
  2.  **Independent Justification for the Re-specification:** Is there a *positive, theoretically or empirically grounded reason* for choosing the new scale/outcome/onset *independent* of the specific objection it addresses? For example:
      *   *Legitimate:* "Shifting focus to Northern England isn't just to exclude the agrarian South; we posit that *localized* institutional structures specific to northern coal/waterway geographies were causally decisive, and here's comparative evidence on *those specific institutions* from other regions." (Novel prediction: Similar localized institutional-geographic clusters elsewhere might show similar dynamism, even if the national level doesn't).
      *   *Rescue:* "China didn't industrialize because it was an empire; Jiangnan was different but still part of the empire, so we exclude it." (No new predictions, scale shift justified solely to exclude counter-evidence).
      *   *Legitimate:* "Defining the outcome as sustained growth duration highlights the role of credit markets in enabling long-term risky investment. This predicts that regions with deep, stable credit markets, regardless of absolute wealth in 1800, should show longer growth spurts." (Novel prediction).
      *   *Rescue:* "Growth rates were similar until 1830, but *we* meant *really* sustained growth lasting 100 years." (Definition shift solely to preserve the British lead).

  ### Is the Question "Why Britain and Not China?" Ill-Posed?
  Yes, the recurrence of this maneuver strongly suggests the question is **fundamentally problematic**, though perhaps salvageable with extreme care.

  *   **Why Ill-Posed?**
      *   **Essentialism:** It implies "Britain" and "China" (or Jiangnan) were monolithic, comparable units destined for industrialization or not, obscuring vast internal heterogeneity and complex interactions.
      *   **Counterfactual Trap:** It demands explaining a non-event (Jiangnan *not* industrializing first) which is inherently speculative and sensitive to definitional boundaries.
      *   **Teleology:** It frames history as a race towards a predefined outcome (modern industrialization), rather than understanding unique, contingent trajectories.
      *   **Scale Fallacy:** It presupposes the nation-state is the natural unit of analysis, ignoring that processes operate at multiple, interacting scales (local, regional, global).
      *   **The Re-specification Symptom:** The constant need to adjust units, outcomes, and timing to preserve *some* version of British uniqueness demonstrates the fragility of the comparison itself.

  *   **Can it be Repaired?**
      *   **Not Easily by Pre-Fixing:** Rigidly defining units/outcomes/onset *before* evidence risks Procrustean analysis, forcing evidence into an ill-fitting framework.
      *   **Better Approaches:**
          1.  **Shift Focus:** Ask "What were the specific, mutually reinforcing conditions (institutional, technological, ecological, global) that enabled a *self-sustaining process* of technological innovation and productivity growth to emerge and persist *in specific regions of Britain* during this period?" This avoids the counterfactual and direct comparison trap.
          2.  **Symmetrical Analysis:** Analyze the dynamics of technological change, factor markets, institutions, and resource constraints *within* both the Yangzi Delta and specific British regions *on their own terms*, identifying constraints and opportunities in each system without assuming one "should have" won. Look for processes, not just outcomes.
          3.  **Global/Connective History:** Embed both regions within global flows of knowledge, trade, resources, and institutions, examining how interactions shaped divergent paths.
          4.  **Specify the Mechanism:** Focus less on "why not China?" and more on "through what specific causal mechanisms did *this particular combination* of factors in *this specific context* lead to the British trajectory?"

  ### Conclusion
  The maneuver is best understood as **Reactive Comparative Re-specification** within a potentially **Degenerating Research Programme** (Lakatos). Key concepts involved are **Scale-Dependency**, **Redefinition of the Explanandum**, and the **Method of Residues**. It differs from simple goalpost moving by being empirically progressive in individual cases but potentially degenerative in aggregate, and from standard theory patching by its focus on redefining the terms of comparison rather than adding auxiliary hypotheses generating novel predictions.

  The **stopping rule** is **Novel Empirical Content/Predictions + Independent Justification for Re-specification**. If the adjustment only absorbs the counter-evidence without opening new research avenues or testable claims, and lacks justification beyond saving the thesis, it's likely a rescue.

  The recurrence of this maneuver strongly indicates the core question "Why Britain and not China?" is **ill-posed** due to inherent essentialism, counterfactual problems, teleology, and scale fallacies. It would be more productive to reframe the inquiry around understanding the emergence of self-sustaining innovation systems in specific contexts, employing symmetrical analysis and global connections, rather than forcing a binary comparative contest.
