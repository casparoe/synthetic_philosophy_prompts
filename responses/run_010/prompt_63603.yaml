prompt: |-
  Six weeks ago I got talked into chairing the accreditation panel for a small UK charity that awards a quality mark to youth mentoring providers — about thirty of them, reassessed every two years. Six of us on the panel, all practitioners, no philosophers, two hours a month, and I have to minute and sign off every decision. We've already had one appeal and I can see another coming.

  The row we keep having is a version of the old Euthyphro problem, though nobody in the room would put it that way: is a practice good because we give it the kitemark, or do we give it the kitemark because it's good? Providers manage to say both things at once in an appeal — that our criterion isn't actually justified, and that we're perfectly entitled to set our own standards.

  Acting as a metaethicist who's thought hard about divine command theory and the Euthyphro, including the modified versions that try to escape the arbitrariness horn, build me a procedure the panel can run on a draft criterion in about fifteen minutes before we vote: the questions in order, what counts as a sufficient answer to each, where it stops with "this can't be adopted as worded", and where it hands the call back to the panel as a question of our remit rather than of fact. It has to cope with: whether member consensus can be cited as support; whether we can just lean on a statutory requirement or a regulator's list instead of arguing; what happens to awards already made when we revise a criterion; and what an appellant can and can't claim we got wrong. Flag which steps are judgment dressed up as procedure.

  Brainstorm the possible shapes of it first, then commit to one. Then run it on three live criteria: enhanced DBS checks for every mentor; a minimum twelve-month relationship; and that at least 40% of a provider's trustees have lived experience of the service. I'm attached to that last one, so tell me straight if the procedure says it can't stand as worded. Finish with what the procedure can't do.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're chairing an accreditation panel for a youth mentoring charity, and they're facing recurring disputes rooted in the Euthyphro dilemma. The panel has practitioners but no philosophers, meeting only two hours a month. They need a practical, 15-minute procedure to evaluate draft criteria that addresses issues like appeals, consensus, reliance on regulations, and retroactive application of changes.

  First, I need to recall the Euthyphro dilemma: is something good because the gods command it, or do the gods command it because it's good? In this context, it translates to whether the kitemark makes a practice good or if they're just recognizing inherent goodness. The user mentioned providers appealing by claiming criteria aren't justified while also saying the panel can set standards. That's the core tension.

  The user outlined specific requirements: handling member consensus, statutory requirements, revising criteria affecting past awards, and what appellants can challenge. Also, they want the procedure to test three live criteria: enhanced DBS checks, 12-month minimum relationships, and 40% trustees with lived experience.

  I should brainstorm procedure structures. The Socratic method might work but could be too time-consuming. Reverse engineering from desired outcomes might be practical but risks circularity. A two-track approach separating justification from authority could address both horns of the dilemma. Hybrid models combining elements might be best, starting with justification then moving to authority.

  Considering the panel's constraints—limited time, no philosophers—the procedure needs clear, sequential questions. Starting with the criterion's purpose (Step 1) grounds it in their mission. Step 2 checks for justification beyond the panel's authority, using evidence like research or regulations. Step 3 assesses if the criterion is within their remit. Step 4 considers practical implications like retroactivity.

  For the lived experience criterion (40% trustees), Step 1's purpose is clear: incorporating beneficiary perspectives. Step 2's justification might lack direct evidence; consensus or analogy to other sectors could be weak. If the panel cites member consensus, that's insufficient without external validation. The procedure might flag this as relying on authority rather than justification. The user is attached to this criterion, so honesty is needed—it might not stand as worded without stronger rationale.

  Enhanced DBS checks easily pass Step 2 due to statutory requirements. The 12-month relationship could have research support but might need flexibility considerations. The procedure can't resolve deep value conflicts or substitute for expertise but provides a structured debate framework. Highlighting steps involving judgment (like Step 2b) is crucial so the panel knows where their input is essential.

  Finally, the user needs to know the procedure's limits: it won't solve all disputes but offers clarity on where disagreements lie, helping focus discussions and reduce appeals by ensuring criteria are vetted robustly.
answer: |-
  Here's a procedure designed for your panel, built on Euthyphro insights and practical constraints. It focuses on separating *justification* (why the thing is good) from *authority* (why *we* require it), forcing clarity to prevent appeals based on this confusion.

  **Brainstormed Procedure Shapes:**

  1.  **The Socratic Interrogation:** Directly mimic Euthyphro. Question: "Is this practice good *before* we require it? How do we know? If not, why is our requirement *making* it good?" (Risk: Too abstract/philosophical, time-consuming).
  2.  **The Reverse Engineer:** Start with the desired outcome (safe/effective mentoring), then ask: "Is this criterion demonstrably necessary *and sufficient* (or at least strongly contributory) to achieve that outcome?" (Risk: Can be circular, hard on "sufficiency").
  3.  **The Two-Track Test:** Explicitly separate the "Goodness Track" (justification) from the "Authority Track" (remit/pragmatics). Requires answering key questions on each track. (Advantage: Directly addresses the Euthyphro horns).
  4.  **The Burden-Shifting Hybrid:** Start with a presumption against the criterion. Proposer must provide justification *beyond* "we say so." If justification is weak/non-existent, it falls unless a strong "Authority Track" argument overrides. (Advantage: Raises the bar, forces proponents to think).
  5.  **The Consequence Tester:** Focus on "What happens if we *don't* require this? What happens if we *do*? Who benefits/harms?" Weigh consequences against mission. (Risk: Can be subjective, misses deontological aspects).

  **Chosen Procedure: The Two-Track Test (Modified Burden-Shifting Hybrid)**

  This directly confronts the Euthyphro horns, separates justification from authority, and incorporates a burden of proof on the proposer. Steps 2b and 3b are key judgment points flagged as such.

  **The Procedure: "Two Tracks, Ten Minutes"**

  1.  **State the Criterion Clearly:** (1 min)
      *   Read the exact wording proposed.
      *   **Sufficient:** Clear, unambiguous language understood by all.
      *   **Stop:** If wording is ambiguous or impossible to interpret consistently. *Hand back for redrafting.*

  2.  **Track 1: The Goodness/Justification Track** (Core: Why is this *inherently* good/necessary?)
      *   **Q2a: What is the *primary justification* for this criterion being good practice?** (e.g., Safety? Efficacy? Equity? Fidelity to model? Regulatory compliance?) (2 mins)
          *   **Sufficient:** A clear link to the charity's mission, core values, or an uncontested fundamental good (like safety). Must go beyond "it seems right."
          *   **Stop/Hand Back:** If the *only* justification is "Because we (the panel) require it" or "Because providers agreed." This fails Track 1.
      *   **Q2b: What *evidence or reasoning* supports this justification?** (Critical Judgment Step!) (4 mins)
          *   **Sufficient Options (Pick strongest available):**
              *   **Robust Evidence:** Peer-reviewed research, major sector reports, established best practice guidelines *from recognized bodies*.
              *   **Strong Analogy:** Clear, defensible analogy to a well-justified standard in a closely related field (e.g., safeguarding in education/social care).
              *   **Direct Statutory/Regulatory Requirement:** *If* the criterion *is* the legal requirement itself (e.g., "Must perform enhanced DBS checks" because the law says so). *Not sufficient if it's our* interpretation *beyond the legal minimum.*
              *   **Overwhelming Consensus *with* Underpinning Rationale:** Widespread, documented agreement *among practitioners AND beneficiaries* **combined with** a clear, logical rationale explaining *why* it's good (e.g., "80% of members & 90% of young people consulted agree criterion X is vital because of reason Y, which aligns with value Z").
          *   **Insufficient Justifiers:**
              *   "Member consensus" alone (without rationale/evidence).
              *   "Regulator's list" alone (unless the criterion *is* that list - see above).
              *   "We've always done it this way."
              *   Anecdotes without pattern.
              *   "It feels right."
          *   **Stop/Hand Back:** If no sufficient evidence/reasoning is presented *and* no strong Track 2 argument overrides (see below). Criterion lacks justification.
      *   **Q2c: Is there significant counter-evidence or strong alternative viewpoints?** (Briefly acknowledge) (1 min)
          *   **Sufficient:** Brief airing of known objections or limitations. Doesn't need full refutation yet.
          *   **Hand Back?** Only if counter-evidence is *overwhelming* and fundamentally undermines the justification. Otherwise, proceed.

  3.  **Track 2: The Authority/Remit/Pragmatics Track** (Core: Why is it *our* job to require this *in this way*?)
      *   **Q3a: Is requiring this criterion *within our documented remit and scope*?** (1 min)
          *   **Sufficient:** Clearly links to the quality mark's defined purpose and the charity's objects.
          *   **Stop:** If clearly outside remit (e.g., requiring financial ratios if we only assess service quality).
      *   **Q3b: Does this criterion represent a *necessary and proportionate* use of our authority, *especially if Track 1 justification is weak*?** (Critical Judgment Step!) (3 mins)
          *   **Sufficient:** Argued that:
              *   It addresses a specific, significant risk or quality gap relevant to the kitemark's purpose.
              *   The burden on providers is reasonable relative to the benefit.
              *   There's no less intrusive way to achieve the core objective.
              *   *Crucially:* Even if Track 1 evidence is *indirect* (e.g., strong analogy, consensus+rationale), the panel judges it *necessary and proportionate* to uphold the *integrity* or *specific purpose* of *this* kitemark. **This is where "Because it's *our* standard" becomes valid, *after* justification is attempted.**
          *   **Stop/Hand Back:** If the requirement is deemed arbitrary ("We just want it"), disproportionate, or duplicative of other bodies without added value.
      *   **Q3c: What is the plan for *retroactive application* if this criterion is new/revised?** (2 mins)
          *   **Sufficient:** Explicit decision:
              *   **Grandfathering:** Existing awards unaffected until next reassessment.
              *   **Grace Period:** Providers have X months to comply.
              *   **Immediate:** All holders must comply within Y timeframe or lose mark. *(Rare, needs strong Track 1 justification like critical safety fix)*.
          *   **Stop:** If no plan discussed. Must be stated alongside adoption.
      *   **Q3d: What *specific error* could an appellant claim we made *in applying this procedure*?** (1 min - Focus on *process*)
          *   **Sufficient:** Panel identifies potential appeal grounds based on steps above (e.g., "They might claim insufficient evidence for Step 2b" or "They might argue it's disproportionate in Step 3b").
          *   **Hand Back?** If the panel realizes the wording opens a clear, avoidable process error (e.g., extreme ambiguity, no retroactivity plan).

  **Output:** After 10-12 mins (allowing 3 mins buffer), the Panel votes on: **ADOPT**, **REJECT**, or **REVISE & RECIRCULATE** (with specific reasons from the procedure).

  **Key Judgment Flags (Dressed as Procedure):**
  *   **Step 2b:** Assessing the *sufficiency* of evidence/reasoning.
  *   **Step 3b:** Judging *necessity and proportionality* of the requirement under the panel's authority.
  *   **Step 3c:** Deciding the *fairness* of the retroactivity plan.

  **Running the Live Criteria:**

  1.  **Criterion: Enhanced DBS checks for every mentor.**
      *   **Step 1:** Clear.
      *   **Track 1:**
          *   Q2a: Justification = Safeguarding, preventing harm to young people. (Strong link to mission/value).
          *   Q2b: Evidence = **Statutory Requirement.** This is *highly sufficient*. The law mandates it for roles involving regulated activity with children. Overwhelming evidence base for safeguarding necessity. (Meets Sufficient Option: Direct Statutory).
          *   Q2c: Minimal counter (cost/admin burden) outweighed.
      *   **Track 2:**
          *   Q3a: Within remit (safeguarding is core quality).
          *   Q3b: Necessary & proportionate: Mandated by law, directly mitigates critical risk. Burden is inherent to the sector.
          *   Q3c: Retroactivity: Likely Immediate or very short grace period (as it's law). Must specify.
          *   Q3d: Appeal claim? Hard. Could argue *process* if applied incorrectly, but not the *standard itself*.
      *   **Verdict:** **ADOPT** (assuming correct statutory basis). Strong Track 1 justification dominates.

  2.  **Criterion: Minimum twelve-month relationship.**
      *   **Step 1:** Clear.
      *   **Track 1:**
          *   Q2a: Justification = Efficacy, relationship depth, achieving outcomes. (Good link).
          *   Q2b: Evidence = Mixed. *Some* research shows benefits of longer relationships, *but* evidence isn't universal. Effectiveness depends heavily on context, goals, and model. Strong evidence for *consistency* and *planned duration*, less for a rigid 12-month *minimum* across all programs. Not statutory. **Sufficiency?** Likely **Weak/Disputed**. (Might qualify as "Strong Analogy" to specific proven models, or "Consensus+Rationale" if well-argued).
          *   Q2c: Significant counter: Rigidity excludes effective short-term/transitional/crisis models; young person choice; natural endings.
      *   **Track 2:**
          *   Q3a: Within remit (links to quality/outcomes).
          *   Q3b: **Crucial Judgment:** Is it *necessary & proportionate* for *this* kitemark to set a *universal* 12-month minimum? Risk: Arbitrariness horn. Could it be reframed as "planned duration appropriate to goals, with minimum expectations for relationship stability"? Burden on providers with different models might be high without clear universal benefit.
          *   Q3c: Retroactivity: Needs plan (Grandfathering/Grace Period likely).
          *   Q3d: Appeal claim? Likely "Insufficient evidence for universal 12m min (Step 2b)" or "Disproportionate burden/arbitrary (Step 3b)".
      *   **Verdict:** **REVISE & RECIRCULATE.** Strong risk of appearing arbitrary without much stronger, specific Track 1 justification for the *universal minimum*. Needs flexibility clause or stronger evidence tying *this specific duration* universally to core outcomes.

  3.  **Criterion: At least 40% of a provider's trustees have lived experience of the service.**
      *   **Step 1:** Clear.
      *   **Track 1:**
          *   Q2a: Justification = Equity, beneficiary voice, governance quality, relevance, avoiding tokenism. (Strong link to values: participation, empowerment).
          *   Q2b: Evidence = **Weak/Mixed on the *specific 40% threshold*.** Strong rationale for beneficiary involvement in governance (Co-production principles, "Nothing About Us Without Us"). Evidence for *impact* of beneficiary trustees is growing (e.g., in health/social care) but not definitive. Rarely mandated or quantified (e.g., Charity Commission encourages diversity/inclusion but no specific quotas). **Sufficiency?** Strong rationale, but **weak on the *quantified threshold*.** Relies heavily on **"Consensus+Rationale"**.
          *   Q2c: Significant counter: Tokenism risk if forced; finding skilled trustees with LE; defining "lived experience"; potential conflicts; alternative ways to ensure voice (e.g., advisory panels).
      *   **Track 2:**
          *   Q3a: Within remit? (Governance quality, beneficiary focus). *Probably*, but edge case. Check remit wording.
          *   Q3b: **Crucial Judgment:** Is a *40% minimum* necessary & proportionate? This is where your attachment hits reality. You *must* argue that:
              *   The *quantified minimum* is essential to ensure meaningful voice, not just tokenism.
              *   Lower percentages demonstrably fail to achieve the governance benefit.
              *   The burden on providers (recruitment, potential board restructuring) is justified by the *specific* benefit of *this level* of representation.
              *   Alternative mechanisms (advisory panels) are insufficient for *governance-level* impact.
          *   Q3c: Retroactivity: Definitely Grandfathering or long Grace Period (major governance change).
          *   Q3d: Appeal claim? Very likely: "Arbitrary threshold (Step 2b/3b)", "Disproportionate burden (Step 3b)", "Outside remit (Step 3a)".
      *   **Straight Talk:** The procedure **says this likely CANNOT stand as worded** for a defensible *accreditation standard* without significant risk of successful appeal based on the Euthyphro arbitrariness horn. The *principle* (beneficiary voice in governance) is strong. The *specific, quantified mandate (40%)* lacks strong Track 1 evidence and relies heavily on Track 2 authority judgment. **Options:** 1) **Revise:** Weaken to "demonstrable meaningful beneficiary involvement at trustee level" (specifying *how* they ensure it's meaningful, not just a number) + encourage 40% as aspirational best practice. 2) **Double Down in Track 2:** If panel strongly believes the *quantified minimum* is *vital* for this kitemark's integrity despite evidence gaps, be prepared for appeals and ensure the Track 3b argument (necessity/proportionality) is meticulously documented – but know it's the weakest of the three criteria presented here under this test.

  **What the Procedure CAN'T Do:**

  1.  **Resolve Deep Value Conflicts:** If panel members fundamentally disagree on core values (e.g., safety vs. autonomy), the procedure exposes it but doesn't solve it.
  2.  **Generate Missing Evidence:** It flags weak justification but can't create research where none exists.
  3.  **Eliminate All Subjectivity:** Judgment is inherent in Steps 2b & 3b. The procedure makes it explicit and structured but not objective.
  4.  **Prevent "Bad Faith" Appeals:** Determined appellants will appeal regardless. This aims to make appeals *less likely to succeed* by showing due process.
  5.  **Define "Lived Experience":** Specific definitions remain crucial and contentious.
  6.  **Substitute for Sector Expertise:** Relies on panel's knowledge to evaluate evidence/suitability.
  7.  **Guarantee "Correct" Outcomes:** Ensures robust *process*, not philosophical or empirical perfection.
  8.  **Handle Highly Complex Criteria:** 15 mins is tight. Very complex criteria might need pre-reading or sub-groups.

  **In essence:** This procedure forces the panel to confront the Euthyphro dilemma head-on within practical constraints. It separates "why good" from "why us," demands more than mere authority for justification, explicitly handles pragmatics/retroactivity, and flags key judgment calls. It won't prevent all disputes, but it will ground them in clearer reasoning and reduce appeals based on the core confusion you identified. Use it ruthlessly, especially on criteria you're attached to!
