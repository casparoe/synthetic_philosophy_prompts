  ## NORMFORM™ CONVENTION INSTALLATION KIT
  **OWNER'S MANUAL & OPERATIONAL GUIDE**
  **Model NF-200-C (Community Scale)**
  **Revision 1.2**

  **Congratulations on your purchase of the NormForm™ Convention Installation Kit!** This engineered solution addresses recurring coordination failures in nascent communities (200-500 households). The NormForm™ Kit efficiently establishes stable behavioral regularities ("Conventions") for scenarios where individual outcomes depend predictably on the actions of others, eliminating the inefficiency of prolonged negotiation or unstable voting cycles.

  **1.0 Kit Contents**
  *   1 x Herald Module (Acoustic/Visual Signal Unit, Pre-charged)
  *   1 x Salience Beacon (Magnetic Mount)
  *   50 x Diagnostic Survey Forms (NF-DS1)
  *   1 x Installation Protocol Manual (This Document)
  *   1 x Warranty Registration Card

  **2.0 Pre-Installation Diagnostic: Identifying a Coordination Problem**

  **WARNING:** The NormForm™ Kit is ONLY effective for genuine coordination problems. Use Diagnostic Survey Form NF-DS1 to verify suitability *before* installation. A behavioral regularity qualifies for NormForm™ installation IF AND ONLY IF all three conditions are met:

  1.  **Recurring Interaction:** The scenario (e.g., path passing, laundry queue formation, generator curfew timing) occurs frequently and involves multiple agents.
  2.  **Strict Interdependence:** Each resident strictly prefers conforming to a *single, specific regularity* ONLY IF they expect *most others* to conform to the *same regularity*. (Check: "Would Resident A prefer left-side path passage IF most used the right side? Expected answer: No.")
  3.  **Indifference Among Equilibria:** Multiple specific regularities (e.g., left-side passage OR right-side passage; sign-up sheet OR first-come queue; 22:00 generator shutdown OR 22:30 shutdown) would satisfy Condition 2 equally well if consistently adopted. No single solution is inherently superior *prior to establishment*; superiority arises *from* establishment. (Check: "Is there a compelling, universally acknowledged reason *independent of expected conformity* why Option X *must* be chosen over Option Y? Expected answer: No.")

  **Example NF-DS1 Result:** Path Passing: PASS. Laundry Queue: PASS. Generator Curfew: PASS. Allotting Larger Garden Plots: FAIL (See Section 7.0).

  **3.0 Installation Procedure**

  **CAUTION:** Installation is irreversible. Ensure diagnostic (Section 2.0) is complete and positive. Decreeing a rule via announcement or vote *cannot* by itself generate a convention. The Kit provides the necessary common knowledge infrastructure.

  1.  **Select Equilibrium:** Identify 2-3 viable regularities meeting Diagnostic criteria. Using Salience Beacon, mark the chosen regularity. **Note:** Selection MUST be based on **salience** (obviousness, historical accident, focal point) or trivial **precedent** (e.g., "The first resident yesterday passed on the left"), NOT reasoned debate. *Arbitrariness is a design feature, ensuring flexibility.*
  2.  **Position Herald Module:** Place the Herald Module in a central, unavoidable location where *all* residents *will* be present simultaneously and can clearly perceive each other's presence (e.g., communal dining hall during mandatory meal, central square during scheduled water distribution). **CRITICAL:** Private communication (leaflets, individual emails) is insufficient and voids warranty. Common knowledge requires mutual recognition of mutual awareness.
  3.  **Activate Herald Module:** At the predetermined gathering, activate the Herald Module. It will emit a distinct, attention-commanding sequence (audible tone + synchronized visual pulse). **DO NOT** accompany activation with justification, debate, or reference to authority. State *only* the selected regularity clearly and concisely (e.g., "Path Passage: Left Side"; "Laundry: First-Come Queue"; "Generator Off: 22:00 Hours"). The Herald's function is solely to establish: *This is the rule, and everyone here knows everyone else is hearing this same rule now.*
  4.  **Monitor Initial Conformity:** Observe behavior for 72 hours. Minor initial deviation (<5% of instances) is normal and self-correcting as expectations align. Sustained deviation indicates faulty diagnostic or installation (see Troubleshooting).

  **4.0 Operation & Expected Outcome**

  Once successfully installed, the Convention functions automatically:

  *   Residents conform because they expect others to conform.
  *   Residents expect others to conform because they observe general conformity (or recall the Herald event establishing common knowledge).
  *   Each resident's preference for conformity is *conditional*: they prefer left-side passage *only because* they expect others to use the left side. A lone individual using the right side is a *coordination failure*, not a moral transgression.
  *   The Convention provides a *defeasible reason for action*: a resident has a reason to conform *so long as they reasonably expect general conformity to continue*. This reason may be overridden by other considerations (e.g., medical emergency requiring right-side passage). The Kit does not define these overriding considerations.

  **5.0 Troubleshooting (FAQ)**

  *   **Q: Residents demand to see the "original agreement" authorizing the Convention.**
      *   A: Refer to Warranty Section 8.0. No agreement exists or is required. The Convention is established by convergent expectations and common knowledge, not contract. Displaying the Herald Module activation log may satisfy procedural inquiries.
  *   **Q: A resident proposes a vote to change/ratify the installed Convention.**
      *   A: Voting cannot establish a coordination convention; it lacks the necessary common knowledge infrastructure and misapplies majoritarian principles to a coordination equilibrium. Explain the conditional preference structure (Section 2.0, Condition 2). If dissatisfaction persists, re-run Diagnostic NF-DS1. Genuine coordination problems rarely require change once established; perceived problems often indicate misdiagnosis (e.g., moving to a distributive conflict - see Section 7.0).
  *   **Q: General conformity has collapsed after initial success.**
      *   A: This indicates a failure of the *conditional expectation* (Section 2.0, Condition 2). Likely causes: (1) The regularity ceased to solve a genuine coordination problem (e.g., path widened, removing conflict). (2) A salient event disrupted common knowledge of the expectation (e.g., prolonged generator failure resetting curfew expectations). Re-run Diagnostic. If problem persists, re-installation *using a different salient equilibrium* may be required. **DO NOT** send follow-up letters; they cannot restore common knowledge.
  *   **Q: A resident consistently deviates but claims a "better reason" for their action.**
      *   A: The Kit installs coordination solutions, not moral rules. The deviant's action is a coordination failure, not necessarily "wrong." Their "better reason" may override their defeasible reason to conform (Section 4.0). However, if deviation becomes widespread due to perceived superiority of the alternative, the Convention has failed; re-run Diagnostic to confirm it was a pure coordination problem.

  **6.0 Features & Benefits**

  *   Eliminates costly deliberation cycles for arbitrary coordination points.
  *   Creates stable, self-policing behavioral regularities.
  *   Leverages game-theoretic principles for efficient social scaffolding.
  *   Arbitrariness ensures adaptability to diverse community contexts.
  *   Defeasible obligation allows for necessary flexibility without undermining the core regularity.

  **7.0 Known Limitations**

  The NormForm™ Kit is engineered exclusively for coordination conventions. It is **INEFFECTIVE** and **MUST NOT BE USED** for:

  *   **Distributive Conflicts:** Scenarios involving the division of scarce goods/benefits where one resident's gain inherently implies another's loss (e.g., allocating larger garden plots, assigning desirable housing locations, distributing limited communal resources). Preferences here are NOT conditional on others' conformity in the same way; there is no mutually preferable equilibrium.
  *   **Moral Norms:** Norms involving intrinsic right/wrong independent of expectations (e.g., prohibitions on theft or violence).
  *   **Deeply Entrenched Pre-Existing Regularities:** The Kit requires a "state of nature" regarding the targeted behavior. It cannot easily overwrite strong pre-community habits.

  **For Distributive Conflicts:** Please utilize the **Conflict Resolution Module (CRM-200-D)**. **NOTE:** The CRM-200-D is currently **indefinitely back-ordered** pending resolution of fundamental theoretical constraints in mixed-motive game analysis. The NormForm™ engineering framework does not extend to distributive scenarios.

  **8.0 Warranty Terms & Conditions**

  NormForm™ warrants the Herald Module against manufacturing defects for one (1) year from date of purchase. The *process* of convention installation is warranted to generate a stable coordination equilibrium *if and only if*:

  1.  The Pre-Installation Diagnostic (Section 2.0) was correctly administered and yielded a positive result for a genuine coordination problem.
  2.  Installation Procedure (Section 3.0) was followed precisely, particularly regarding the common-knowledge-generating Herald Module activation in a fully mutual setting.

  **THIS WARRANTY IS EXPRESSLY VOID IF:**

  *   The customer attempts to install a norm for a non-coordination problem (Section 7.0).
  *   The customer substitutes private communication (letters, emails, individual notices) for the Herald Module activation.
  *   The customer claims the established convention is based upon, derives authority from, or constitutes evidence of, an "original agreement," "social contract," "founding compact," or any similar consensual instrument. **NO SUCH AGREEMENT EXISTS OR IS REQUIRED FOR THE NORMFORM™ PROCESS.** Convention, as installed by this Kit, is an emergent property of interdependent expectations and common knowledge, not an artifact of consent. Claims submitted with references to or copies of signed compacts will be rejected on the grounds that the customer has fundamentally mistaken the nature of the product and the phenomenon it engineers.

  **NormForm™: Engineering Social Equilibrium.™**
