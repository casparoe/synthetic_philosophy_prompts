  Key requirements for the manual:
  - Must be in deadpan appliance documentation style (numbered sections, imperative instructions, FAQ, etc.)
  - Humor should come from accurate theory application, not generic corporate satire
  - Needs to include diagnostic criteria for genuine conventions vs mere regularities
  - Must explain why decrees alone can't create conventions (common knowledge problem)
  - Should treat equilibrium selection as based on salience/precedent, emphasizing arbitrariness
  - Must explicitly exclude distributive conflicts from scope (Conflict Module back-ordered)
  - Warranty section should disavow any founding agreement
  - Should describe obligations as defeasible (conditional on expectations)

  The theoretical core involves David Lewis's definition: conventions as solutions to coordination problems where everyone prefers conformity conditional on others conforming, where no single deviant is blameworthy, and where alternatives could have worked equally well. The common knowledge aspect is crucial - everyone must know that everyone knows the rule.

  For structure, I'll organize it like a real appliance manual:
  1. Introduction defining the problem space
  2. Diagnostic checklist for coordination problems
  3. Installation steps emphasizing the herald module
  4. Troubleshooting FAQ addressing common confusions
  5. Known limitations section excluding non-coordination issues
  6. Warranty disclaiming any agreement

  The humor will emerge from applying high theory to mundane problems ("laundry house queue formation") while maintaining technical precision. The warranty section will be particularly pointed in denying any "original agreement" exists.

  I need to avoid naming real people or companies. The tone should stay clinically helpful throughout - the irony comes from the contrast between the vendor's earnest engineering language and the philosophical implications. For residents unfamiliar with Lewis, it should read as oddly specific tech documentation; for those who know the theory, it should land as brilliant deadpan satire.

  The manual will subtly undermine consent-based governance models by showing conventions emerge from repeated interaction and common knowledge, not votes or contracts. The "indefinitely back-ordered Conflict Module" gag will highlight how this approach fails for zero-sum issues like resource distribution.

  Word count target is around 900 words. I'll aim for precision in the theory while keeping the examples concrete and settlement-relevant (paths, generators, laundry). The defeasibility point will appear in troubleshooting: obligations dissolve when conformity collapses, without specifying what overrides them - maintaining the deadpan facade.
