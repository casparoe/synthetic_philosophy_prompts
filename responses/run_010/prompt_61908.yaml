prompt: |-
  I cover science and ideas for a general-interest magazine, and for the better part of a year I have been reporting on the small machinery of ordinary life: the unwritten rules that govern tipping, queuing, and crossing the street, and what becomes of those rules when people travel between places that run on different ones. The assignment that started it was a state legislature voting to decriminalize jaywalking, and what struck me in the hearing room was how little of the argument was about safety. Almost all of it was about who the rule belongs to, what a violation expresses, and who gets to be excused from it. Since then I have been keeping a private list of my own judgments about when a visitor is bound by a local convention. I would like help finding out whether they hang together.

  Here they are, roughly in the order I arrived at them.

  1. An American visitor in a Midwestern diner who thinks tipping is odious on principle should still tip. The server has organized their expectations and their household budget around the practice, and the visitor has accepted a meal on terms that included it.
  2. That same American leaving a tip at a restaurant in Tokyo has done nothing wrong. It is a blunder, an irritation, possibly a small embarrassment to the staff, but I would resist anyone who called it a moral failing.
  3. A visitor at a red light on an empty street in a northern European city at two in the morning, alone and with nothing coming in either direction, may cross. I feel no obligation to the absent.
  4. That same visitor at the same empty crossing, holding the hand of a seven-year-old, may not. This verdict is far firmer than the one before it, and I cannot ground the difference in harm, since nobody is endangered in either case.
  5. Crossing against the light in Manhattan when a crowd is already crossing is unremarkable and permissible. Standing alone at that curb waiting for the green when everyone else walks feels like a small defection, though I would not go so far as to call it wrong.
  6. Joining a loose cluster of people at a street-food stall where nobody could say who arrived next is not queue-jumping. There is no order to violate.
  7. Leaving a bag to hold a place in a genuinely ordered queue while I use the restroom, and returning within a few minutes, is fine.
  8. Leaving a bag to hold a place in that same queue so that a friend can join twenty minutes later is not fine. I want to stress how alike these two look to me on every dimension I can articulate: same queue, same bag, no complaint from anyone, the same small cost to the people behind, and in both cases the people behind understand exactly what is happening and accept it without protest. My verdicts nonetheless differ, and they differ firmly.
  9. Removing one's shoes at a host's door in Japan is obligatory, and the obligation feels weightier to me than the tipping one, even though the cost of refusing is trivial and falls on a single person who has invited me in rather than on a class of strangers who depend on the rule for their income.
  10. A visitor driving in a country that keeps to the left is obviously bound by the local rule, but I suspect this case belongs somewhere else entirely: law and safety, not convention in the sense I mean.

  Out of these I have been nursing a principle for the column, and I want it attacked rather than flattered. Call it the reliance test: a local convention binds a visitor only when the visitor can reasonably be expected to know the rule or to be told it, and when identifiable people have shaped their plans around general compliance, so that the visitor's departure costs those people something they were counting on. The first clause is there to let the uninformed tourist off the hook. The second is there to explain why tipping in Tokyo is a faux pas while withholding a tip in Ohio is a wrong, and why an empty crossing at two in the morning carries no obligation at all.

  The difficulty is that the reliance test looks to fail on at least three of my judgments: the child at the crossing, the shoes at the door, and the friend joining the queue. In none of them has anyone been cost anything they were counting on, and yet I will not surrender the verdict. My own suspicion is that I am running two ideas together. One is reliance. The other is something I have started calling underwriting: the thought that breaking a rule publicly does not merely fail to help sustain it but lends my weight to its erosion, which can be a wrong to the people who need the rule even when my single act changes nothing measurable for any of them. Underwriting as I have stated it, however, threatens to prove far too much. It would seem to make the lone two-in-the-morning crossing wrong as well, and I am confident it is not.

  Three requests, then. First, tell me what principle or principles actually generate these ten verdicts. I would rather have two or three precisely formulated candidates, each clause tied to the case that forced it, than one elegant formula that quietly ignores a judgment or two. Second, state plainly which of my verdicts each candidate cannot accommodate, and where a candidate overturns one of them, say whether the principle should be revised or the verdict simply abandoned; I expect judgment 8 to be the casualty, and I want to know whether I ought to mourn it. Third, run the surviving candidates on cases I have not listed and on which I have no settled view: a visitor who speaks none of the language and is told nothing; a woman returning to her hometown after twenty years abroad to find that the local conventions have changed in her absence; a visitor who complies outwardly while making plain to his companions that he considers the practice absurd; a long-haul driver who lives by the conventions of his trade and passes through a dozen jurisdictions in a week; and a community whose convention is itself regarded by outsiders as unjust, for instance a queuing norm that assigns a subordinate position to one group as a matter of settled practice. Finally, tell me whether reliance and underwriting are genuinely two distinct grounds of obligation or whether the second collapses into the first at one remove, and, if they are distinct, which of my verdicts each one is doing the work on.
reasoning: |-
  Okay, let me approach this thoughtfully. The user presents a sophisticated ethical puzzle about cultural conventions and visitor obligations, grounded in ten specific judgments. They're clearly an experienced journalist working on nuanced social norms, likely aiming to develop a robust framework for their column.

  First, I need to unpack their core question: why do their intuitive verdicts on cultural rule-breaking sometimes contradict their proposed "reliance test"? Their examples reveal fascinating tensions - like how leaving a bag for a bathroom break feels acceptable but for a late friend doesn't, despite similar surface circumstances. The child-crossing case is particularly telling because the harm element is identical to the solo crossing, yet the obligation feels stronger.

  Hmm... their suspicion about two distinct principles (reliance vs underwriting) seems astute. But as they note, pure underwriting would condemn the 2am crossing too, which feels counterintuitive. So what's really happening? I think the key might be in distinguishing between:
  - Rules that function as social coordination mechanisms (where reliance matters most)
  - Rules that serve symbolic or pedagogical functions (like modeling behavior for children)
  - Rules tied to personal hospitality expectations

  For instance, the shoe-removal case feels weightier than tipping precisely because it's a direct host-guest interaction rather than an impersonal economic convention. Similarly, the child-crossing verdict isn't about immediate harm but about reinforcing rule-respect as a social habit.

  The queue cases fascinate me most - why does judgment 7 (bathroom) feel acceptable while 8 (late friend) doesn't? It's not about time elapsed, but about the bag's representation: in 7 it's a placeholder for continuous presence, while in 8 it becomes a tool for queue-jumping. This suggests an unspoken "good faith" principle in convention adherence.

  For their unlisted cases, I'll need to consider:
  - The uninformed tourist (reliance test should protect them)
  - The returning local (now effectively a visitor to changed norms)
  - The outwardly compliant skeptic (does visible contempt damage conventions?)
  - The long-haul driver (professional subcultures vs local norms)
  - Unjust conventions (when should visitors resist rather than comply?)

  Ultimately, I suspect we're dealing with three irreducible principles: reliance for economic coordination, pedagogical obligation for social reproduction, and hospitality norms for personal interactions. Their judgment 8 might indeed need revising - but not because it's wrong, rather because it reveals how queue conventions balance fairness with reasonable accommodation.

  The underwriting concept remains valuable but needs narrowing: it's not about individual acts eroding norms, but about our role in maintaining systems we benefit from. That explains why the 2am crossing feels permissible - at that moment, you're not part of the social coordination system.
answer: |-
  Your cases reveal a rich tapestry of obligations rooted in **social coordination, relational expectations, and symbolic meaning**—not just measurable harm. Your "reliance test" is elegant but incomplete; it explains *some* verdicts but clashes with others because it overlooks the role of **social reproduction** (maintaining systems for future stability) and **relational signaling** (what actions communicate about respect or membership). Below, I distill three principles from your judgments, test them against your cases and new ones, and resolve the reliance/underwriting tension.

  ---

  ### **Three Principles Generating Your Verdicts**
  *(Each addresses gaps in pure reliance)*

  1. **The Reliance Principle (RP)**  
     *A visitor must comply when:*  
     (a) The convention is knowable (or they’ve been informed), *and*  
     (b) Specific people have materially relied on compliance (e.g., budgeting income, queue position).  
     *Source:* Cases 1 (tipping in Ohio), 2 (Tokyo tip as harmless without reliance).  
     *Limits:* Fails on cases with no material reliance (e.g., crossing alone at 2am).

  2. **The Pedagogical Principle (PP)**  
     *A visitor must comply when:*  
     Breaking the rule *publicly undermines social training or communal self-perception*, especially where the rule symbolizes collective order (e.g., modeling for children, reinforcing norms).  
     *Source:* Case 4 (child at crossing), Case 5 (defection by waiting alone in NYC).  
     *Limits:* Does not apply to private acts (e.g., solo crossing) or conventions without symbolic weight.

  3. **The Relational Signaling Principle (RSP)**  
     *A visitor must comply when:*  
     The convention is a *direct signal of respect* in a bounded relationship (e.g., host/guest, service provider/client), and violation insults the counterpart’s autonomy or hospitality.  
     *Source:* Case 9 (shoes in Japan), Case 1 (tipping as relational, not just economic).  
     *Limits:* Does not bind impersonal/public acts (e.g., jaywalking alone).

  ---

  ### **How Principles Resolve Your 10 Judgments**
  | Case | Your Verdict | RP | PP | RSP | Conflict? | Resolution |
  |------|--------------|----|----|-----|-----------|------------|
  | 1    | Tip in Ohio | ✔️ | —  | ✔️  | None | RP + RSP apply (server relies; tip signals respect). |
  | 2    | Tokyo tip OK | ✔️ | —  | —   | None | RP *absolves* (no reliance). |
  | 3    | Cross alone | ✔️ | —  | —   | None | RP *absolves* (no reliance; no one present). |
  | 4    | Can’t cross w/child | ✖️ | ✔️ | —   | RP fails | PP applies (modeling rule-following matters). |
  | 5    | Waiting alone = defection | ✖️ | ✔️ | —   | RP fails | PP applies (publicly eroding shared practice). |
  | 6    | Cluster not queue-jumping | —  | —  | —   | None | *No principle violated* (no convention exists). |
  | 7    | Bag for bathroom OK | —  | —  | —   | None | *Implied consent* (queues allow reasonable holds). |
  | 8    | Bag for late friend not OK | ✖️ | ✔️ | —   | RP fails | PP applies: "holding" shifts from pause to cheating, damaging queue’s perceived fairness. |
  | 9    | Shoes obligatory | ✖️ | —  | ✔️  | RP fails | RSP applies (direct insult to host’s home). |
  | 10   | Driving rule binds | —  | —  | —   | None | *Separate category* (safety/law, not convention). |

  - **Judgment 8 is a casualty of RP but preserved by PP**: Your instinct to condemn the late friend is sound. Queues rely on perceived fairness; abusing "placeholding" to skip ranks teaches disrespect for the system, even if no one complains. **Don’t mourn the verdict—revise the principle.**  
  - **RP’s limits exposed**: It fails on cases 4, 5, 8, and 9 because they involve *symbolic harm* (eroding norms, disrespect) not material reliance.

  ---

  ### **Testing Principles on New Cases**
  1. **Uninformed visitor, no guidance**  
     - *RP:* Not bound (clause a unsatisfied).  
     - *PP/RSP:* Not bound unless act has extreme symbolic weight (e.g., desecrating a sacred site).  
     - *Verdict:* No obligation (e.g., eating with shoes on in Japan if clueless).

  2. **Returning after 20 years to changed norms**  
     - *RP:* Bound if aware of new reliance (e.g., new tipping expectations).  
     - *PP/RSP:* Partially bound; seen as "visitor" until reintegrated.  
     - *Verdict:* Must comply once informed (locals now rely on new norms).

  3. **Complies outwardly but scoffs privately**  
     - *RP:* Complies (no reliance breach).  
     - *PP:* Violates if mockery is public (undermines norm’s legitimacy).  
     - *RSP:* Violates if companions feel disrespected.  
     - *Verdict:* Wrong if mockery is observable (harms social fabric).

  4. **Long-haul driver with trade conventions**  
     - *RP:* Bound by local rules if knowable (e.g., parking norms).  
     - *PP/RSP:* Professional subculture may override minor local customs (e.g., greeting rituals).  
     - *Verdict:* Must comply with safety/laws; conventions bind only if material (RP) or deeply symbolic (PP/RSP).

  5. **Unjust convention (e.g., discriminatory queue)**  
     - *RP:* Locals rely, but moral priority overrides.  
     - *PP:* Compliance reinforces harm; obligation to resist.  
     - *RSP:* Signaling respect to oppressed group may require defiance.  
     - *Verdict:* **Not bound** (e.g., a visitor should *not* comply with racial queue hierarchy).

  ---

  ### **Reliability vs. Underwriting: Distinct but Linked**
  - **Reliance (RP)** is *transactional*: Focused on direct, measurable costs to specific individuals (e.g., server’s rent).  
  - **Underwriting (PP/RSP)** is *systemic*: Concerned with how acts sustain or erode social systems, regardless of immediate harm.  

  They collapse only if you define "cost" broadly (e.g., "cost of norm erosion"). But your cases show they’re distinct:  
  - **Solo 2am crossing (permissible)** has no *reliance cost* (RP satisfied) and negligible *underwriting cost* (no audience, no system weakened).  
  - **Crossing with child (forbidden)** has no reliance cost but high *underwriting cost* (PP: child learns to ignore rules).  
  - **Shoes in Japan (obligatory)** has minimal reliance cost but high *relational cost* (RSP: insult to host).  

  **Underwriting is not "reliance at one remove"**—it’s about *social reproduction*, not deferred harm. Your verdicts split cleanly:  
  - **RP** does the work in Cases 1, 2, 3, 7.  
  - **PP** drives Cases 4, 5, 8.  
  - **RSP** drives Case 9.  

  ---

  ### **Conclusion**
  Your judgments hang together under a **three-pronged framework**:  
  1. **Reliance** for economic/coordinated conventions.  
  2. **Pedagogy** for public, norm-sustaining acts.  
  3. **Relational signaling** for intimate/hospitality contexts.  

  **For your column**: Argue that visitor obligations arise not just from harm, but from our role in maintaining social ecosystems. The child at the crossing isn’t about safety—it’s about inducting the next generation into shared order. The bag in the queue isn’t about minutes lost—it’s about the integrity of fairness rituals. And the shoes? They’re the physical grammar of "guest." Sometimes, we tip to feed a server; sometimes, we wait for the light to feed a city’s self-respect. 

  **Revise, don’t abandon**: Judgment 8 (the late friend) is defensible under PP—it’s a small but real betrayal of the queue’s social contract. Keep it.
