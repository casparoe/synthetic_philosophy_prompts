prompt: |-
  Something keeps coming up in my life that I have no word for, and I want to know if it's a real thing or just me pattern-matching on three anecdotes.

  My friend plays piano, improvised stuff, no sheet music, and she's genuinely good. Ask her afterwards what she did over some weird chord change and she'll shrug and say she doesnt know — fine, normal, everybody's heard that one. But the odd part: ask her to play something while narrating her choices as she makes them, and she doesn't just fail to narrate. She plays worse. Audibly worse. Same room, same three people, no audience, no stakes, she isn't nervous. It's the request for an account that does it, and she's back to normal two minutes later once you shut up about it.

  Second case is me, unfortunately. I can tell pretty reliably which of two translations of a poem is better, and afterwards I can usually defend the call. But if someone asks me to state my criterion first and then judge by it, I invent a criterion on the spot and my picks go to hell — sometimes flatly reversed, where the criterion I just announced points at A and I still choose B, and I can hear myself choosing B.

  Third, from work. A colleague who is uncanny in tense meetings: knows exactly when to go quiet and when to push, reads people instantly. We got him to run a session on how he does it. The session was okay, but everyone afterward said he'd seemed like a different and much duller person, and he told me privately he'd spent an hour making up rules he didn't believe.

  Now, I've read enough popular philosophy of mind to know the standard line about machines doing clever things without understanding them — the chess program point, and the argument people build from it that understanding is overrated, that the cleverness lives in the doing and not in any grasping of reasons. Everything I'm describing points the other direction, and I can't tell whether that opposite has ever been taken seriously or whether I've stumbled onto something that's been sitting in plain sight.

  So: is there an established concept for this — not for the plain fact that skilled people can't articulate their skill, which I know has been discussed for a century, but specifically for the articulation *degrading* the skill, so that comprehension isn't merely missing but actively corrosive? I want the nearest candidates and exactly where each one runs out. I can vaguely guess at things from sports science and from memory research, but I'm fairly confident none of them is this, because in my cases nobody is under pressure and nobody is trying to remember anything — they're just being asked for a report of what they're doing.

  And if it isn't a thing, then name it and define it, but properly. Where are the edges? Because sometimes asking someone to explain clearly *helps* — writing it down, teaching it, talking it through — so what's the difference between the helping version and the wrecking version? Does the phenomenon survive if the person eventually absorbs the explanation and gets better at the skill, or does that mean it was never really the same thing? Are my three cases even one case, or is the piano one about performance while the translation one is about making up reasons after the fact? And does any of this bear on whether the original skill counted as knowing something at all, or is that a separate quarrel?

  A bare label is useless to me. I want the carving: what it is, what it isn't, and where it stops.
reasoning: |-
  Okay, the user is describing a fascinating phenomenon where articulating a skill actually degrades its execution. Let me start by unpacking their three examples. First, the pianist friend plays worse when asked to narrate her choices. Second, the user themselves can't judge translations well if they have to state a criterion first. Third, the colleague's intuitive meeting skills vanish when he tries to explain them. 

  The user knows that skills can be tacit, like Polanyi's concept, but they're specifically interested in why articulation sometimes harms performance. They want to know if there's a named concept for this and how it works. They also mention popular philosophy of mind, like the chess program analogy, which argues understanding isn't necessary for performance. But their examples suggest the opposite—that forced articulation disrupts the skill.

  I recall research on explicit monitoring theory in sports, where overthinking movements causes choking. But the user’s cases aren't high-pressure situations. The piano example involves no audience, just a request to narrate. So pressure isn't the trigger here. That points more towards cognitive load or disruption of automatic processes. 

  Then there's System 1 vs System 2 from dual-process theory. Automatic skills (System 1) get interrupted when conscious reasoning (System 2) is engaged. Forcing articulation shifts focus to explicit rules, which might not capture the intuitive expertise. The colleague making up rules he doesn’t believe is a clear example—he's creating post-hoc rationalizations that don't align with his actual skill.

  The user also asks about cases where articulation helps, like teaching or writing. The difference might lie in whether the explanation is generated during the task or after. Explaining afterwards doesn't disrupt performance, but concurrent narration does. Also, if the skill has a strong explicit component, articulation might integrate better. 

  I should check if the phenomena in their examples are the same. The piano and meeting cases involve real-time performance degradation, while the translation judgment is about decision-making with pre-articulated criteria. The common thread is the interference of explicit processes with implicit ones. 

  The user wants clear boundaries: when does articulation help or harm? They need a precise definition. Maybe "Articulatory Interference Effect" or "Explicit Process Disruption." But they want the edges defined. For instance, if someone internalizes the explanation and improves, does that mean the original interference was temporary? Or does it suggest the skill wasn't purely implicit?

  Also, connecting to epistemology: does this affect whether the skill counts as knowledge? Tacit knowledge is still knowledge, but forcing it into explicit terms can misrepresent it. The colleague's made-up rules show that explicit explanations might not capture the real skill, leading to degradation when applied.

  They might be hinting at a deeper concern about how we value explicit vs. implicit knowledge in society, or personal frustration with skill articulation. Naming the phenomenon could validate their experience and provide a framework for discussion. Ensuring the definition covers all three cases without overgeneralizing is key. Highlighting the conditions—concurrent articulation, implicit skills, no pressure—will set the boundaries they need.
answer: |-
  This is a profound and sharply observed pattern. You're absolutely right that while "tacit knowledge" (Polanyi's classic concept) explains the *inability* to articulate skills, it doesn't capture the **active degradation** you've witnessed. Your examples point to a distinct phenomenon, often discussed but rarely labeled with the precision you seek.

  The core concept you're grappling with is **"Explicit Process Disruption"** or **"Articulatory Interference"**, but it manifests under several established frameworks. Crucially, it's **not** about pressure, memory failure, or lack of understanding *per se*. It's about the *act of concurrent explicit monitoring or rule-generation interfering with the smooth execution of implicit, procedural knowledge*.

  Here's the carving you requested:

  1.  **The Established Concepts & Where They Fit (and Run Out):**
      *   **Explicit Monitoring Theory (EMT - Sports Psychology/Choking):**
          *   **What it is:** Focusing conscious attention on the step-by-step execution of a well-learned skill disrupts its automaticity, leading to worse performance ("choking").
          *   **Where it fits your Piano case:** Asking her to narrate *forces* explicit monitoring of her improvisation process. Instead of flowing, she's now consciously trying to dissect and report what was previously automatic, disrupting the fluid motor and harmonic intuition.
          *   **Where it runs out:** EMT usually focuses on *anxiety* or *high stakes* amplifying the monitoring effect. Your pianist wasn't nervous. The trigger was purely the *demand for articulation*. Your Translation case isn't about *executing* a motor skill but about *making a judgment*. Your Meeting case involves *generating rules*, not just monitoring execution.
      *   **Dual-Process Theory (Cognitive Psychology):**
          *   **What it is:** Cognition involves two systems: **System 1 (Intuitive, Fast, Automatic, Implicit)** and **System 2 (Analytic, Slow, Effortful, Explicit)**.
          *   **Where it fits ALL your cases:** The skills (piano improv, nuanced translation judgment, social intuition) reside primarily in System 1. Forcing articulation (your request) activates System 2 *concurrently* with the System 1 task.
          *   **The Interference:** System 2 tries to take control, generating rules or reasons (often post-hoc rationalizations in the Translation and Meeting cases) or demanding step-by-step monitoring (Piano). This disrupts the seamless operation of System 1. The two systems compete for cognitive resources, and System 2's clunky, rule-based approach is a poor substitute for the optimized intuition of System 1 for *this specific task*.
          *   **Where it runs out:** Dual-process theory is a broad framework. It *explains* the mechanism but doesn't specifically name the *degradation effect caused by forced articulation*.
      *   **Cognitive Load Theory:**
          *   **What it is:** Working memory has limited capacity. Adding extra tasks (like generating an explanation *while* performing) can overload it, impairing performance.
          *   **Where it fits:** Articulating *while* doing (Piano) or generating a complex rule *to apply while* judging (Translation) adds significant cognitive load, competing for resources needed for the primary skill.
          *   **Where it runs out:** This explains *why* performance degrades (resource depletion) but doesn't capture the specific *nature* of the interference – the clash between implicit intuition and explicit rule-making/monitoring. It also applies broadly to any concurrent task, not specifically to articulation about the skill itself.
      *   **The "Centipede's Dilemma" (Psychological Folklore):**
          *   **What it is:** The fable of the centipede who was asked how it coordinated its legs and then couldn't walk. A popular metaphor for paralysis by analysis.
          *   **Where it fits:** Captures the *idea* perfectly – asking "how" disrupts the "doing."
          *   **Where it runs out:** It's an anecdote/metaphor, not a rigorous psychological concept. It doesn't address the nuances of judgment (Translation) or rule-generation (Meeting).

  2.  **Defining the Phenomenon: Articulatory Interference Effect**
      *   **What it is:** *A specific degradation in the execution or quality of a skilled performance (physical, cognitive, or social) caused by the concurrent demand to explicitly articulate, monitor, or generate rules governing that performance.*
      *   **Core Mechanism:** The forced activation of explicit, analytical processing (System 2) disrupts the smooth functioning of implicit, intuitive, procedural knowledge (System 1) upon which the skill relies. This creates cognitive load and introduces ill-fitting or post-hoc rationalizations that misrepresent the actual intuitive process.
      *   **Key Features:**
          *   Degradation is *caused by* the demand for articulation/reporting/rules *during* the task.
          *   Degradation occurs even in the *absence* of performance anxiety or high stakes.
          *   Performance typically recovers quickly once the demand for articulation ceases.
          *   The articulated rules/reasons are often inaccurate, incomplete, or fabricated rationalizations of the underlying intuitive process.

  3.  **Where the Edges Are (What It Isn't):**
      *   **Not Mere Tacit Knowledge:** Tacit knowledge is the *inability* to articulate. This is the *active disruption* caused *by trying* to articulate concurrently.
      *   **Not Choking Under Pressure:** While EMT is related, your cases lack the key element of *evaluation apprehension* or *high stakes*. The degradation is triggered purely by the cognitive demand of self-monitoring/rule-generation.
      *   **Not Retrieval Failure/Forgetting:** The skill isn't forgotten; it's actively disrupted *during* the concurrent task. It returns immediately afterward.
      *   **Not Lack of Understanding:** The skill demonstrates competence. The *inability to generate a concurrent accurate explanation* doesn't negate the competence; it highlights that the competence operates via different (implicit) mechanisms. The chess program analogy holds: the program plays well *without* human-like understanding. Forcing *it* to generate human-like explanations would likely break it too!
      *   **Not Always Harmful:** Articulation *can* help, but crucially **when and how it happens matters**.

  4.  **Articulation that Helps vs. Articulation that Wrecks:**
      *   **Helps (Usually Post-Hoc or Deliberate Practice):**
          *   **Reflecting Afterwards:** Analyzing a performance *after* it's completed (e.g., "What worked well in that meeting?" or "Why did that harmonic choice feel right?"). This uses System 2 to *understand* System 1 without disrupting it *during* execution.
          *   **Teaching/Explaining Conceptually:** Breaking down principles for a learner *outside* the context of high-stakes performance. This builds explicit knowledge that can, with practice, become integrated and implicit.
          *   **Developing Deliberate Strategies:** Consciously constructing rules or methods *as part of skill acquisition* (e.g., a beginner pianist learning scales, a negotiator learning active listening techniques). This explicit stage is necessary scaffolding.
          *   **Codifying Explicit Components:** If a skill *has* inherently explicit elements (e.g., applying a legal rule, following a recipe step), articulating those is essential.
      *   **Wrecks (Concurrent Explicit Processing):**
          *   **Forced Concurrent Narration:** "Tell me what you're thinking *while* you do it."
          *   **Applying Self-Generated Rules On-The-Fly:** "State your criterion *first*, *then* apply it immediately."
          *   **Performing While Explicitly Self-Monitoring:** Shifting focus *during* the skill from the outcome/goal to the mechanics ("Am I bending my knees enough?" during a golf swing *instead of* focusing on the ball flight).
      *   **The Difference:** Helpful articulation occurs *outside* the flow of the skilled performance itself or focuses on explicit components *without* disrupting implicit ones. Wrecking articulation *intrudes* into the implicit process *during* its execution, forcing System 2 to do System 1's job poorly.

  5.  **Are Your Three Cases the Same?**
      *   **Common Core:** Yes. All involve a highly developed intuitive/implicit skill being disrupted by the concurrent demand for explicit processing (monitoring, rule-generation, rule-application).
      *   **Nuances:**
          *   **Piano:** Primarily disruption of *motor and harmonic intuition* by explicit monitoring/narration.
          *   **Translation:** Disruption of *aesthetic/intuitive judgment* by forcing an explicit rule *before* the judgment, creating conflict and post-hoc rationalization.
          *   **Meeting:** Disruption of *social intuition* by forcing the generation of explicit rules *meant to represent* the intuition (which they fail to do accurately), likely also causing some self-monitoring during the teaching.
      *   **Unified Mechanism:** In each case, forcing System 2 online *during* the System 1 task causes the degradation.

  6.  **Does Absorbing the Explanation Change Things?**
      *   **Yes, potentially.** If explicit rules are learned *and practiced to the point of automaticity* (becoming "compiled" into System 1), they can become part of the skilled performance *without* concurrent disruption. Think of a master musician who *also* knows deep music theory – they don't *think* about the theory while improvising fluently; it's internalized. The explicit knowledge informed and refined the implicit skill over time.
      *   **What this means:** It doesn't negate the original phenomenon. The *original* skill *was* implicit and *was* disrupted by concurrent articulation. The *developed* skill might now integrate explicit knowledge, but the fluent execution still relies on it being automatized (back in System 1). Concurrent articulation *could still disrupt it again* if it forced conscious focus on the now-internalized rules.

  7.  **The "Knowing" Question:**
      *   This *is* fundamental. Your phenomenon strongly supports the idea that **procedural knowledge** (knowing *how*) is distinct from **declarative knowledge** (knowing *that*).
      *   **Your colleague *knew how* to navigate meetings brilliantly.** His inability to generate accurate declarative rules *during* or *after* the fact doesn't negate this "knowing how." His skill resided in his implicit social cognition.
      *   **The chess program analogy cuts both ways:** Yes, it plays without understanding. *But forcing it to generate human-like explanations would break it.* Similarly, forcing humans to generate explicit, declarative accounts of their implicit procedural knowledge *during its execution* breaks the performance. The procedural knowledge is real and effective; it's just not readily translatable into accurate declarative statements *on demand* without disrupting the process.
      *   **Conclusion:** The skill absolutely counts as knowledge ("knowing how"). The phenomenon shows that *accessing* that knowledge *in declarative form, concurrently*, is not only difficult but actively detrimental to its expression. The knowledge is in the *doing*, validated by the success of the doing, not in the ability to explain the doing.

  **In Summary:**

  You've identified **Articulatory Interference** or **Explicit Process Disruption**: the degradation of skilled performance caused by the concurrent demand for explicit articulation, monitoring, or rule-generation. This occurs because it forces analytical System 2 processing to interfere with the intuitive System 1 processes that underpin the skill. It is distinct from mere tacit knowledge, choking under pressure, or forgetting. It highlights the reality and power of procedural knowledge ("knowing how") and the sometimes adversarial relationship between fluent execution and concurrent self-explanation. The phenomenon survives even if explicit knowledge is later integrated and automatized, as the disruption is caused by *concurrent* forced articulation, not by the *existence* of explicit knowledge per se. Your three cases share this core mechanism, differing only in the domain of the skill disrupted. This isn't just pattern-matching; it's a robust, observable cognitive glitch revealing the architecture of expertise.
