answer: |-
  ### **Activity Design: "The Trash Heap of History"**

  #### **Object List (Total: 15 items, easily scavenged)**
  - **Set A (Groups 1, 2, 3): Identical items**  
    1. Coffee mug (clean, no logo)  
    2. Single blue sock (slightly worn)  
    3. Paperback novel (dystopian fiction, dog-eared page 45)  
    4. USB drive (unlabeled)  
    5. Broken pencil (no eraser)  
    6. Empty Tylenol bottle (label removed)  

  - **Swap Items (added/removed mid-activity):**  
    - **Remove:** USB drive (plausible "status" item)  
    - **Add:** Wristwatch (cheap, non-functional)  

  - **Set B (Group 4): Contrast set**  
    1. Pizza box (1 slice left, generic brand)  
    2. Phone charger (Android)  
    3. Hair tie (with glitter)  
    4. Half-used candle (scented)  
    5. Stuffed animal keychain (small bear)  
    6. Mismatched dice (one red, one blue)  

  #### **Group Task Sheet (1 sheet per group)**  
  *(Print 4 sheets total)*  
  ---  
  **PROVENANCE:** [*Varies by group*]  
  **TASK: You are archaeologists analyzing an assemblage. Reconstruct the people who left these objects. Answer in writing:**  
  1. **Single or multi-occupancy?** (e.g., "Single: only one mug suggests one user")  
  2. **Evidence of hierarchy or rules?** (e.g., "No hierarchy: all items are mundane")  
  3. **Ritual or non-utilitarian behavior?** (e.g., "Novel suggests leisure, but no ritual")  

  **PHASE 1 (15 MIN):**  
  - **List each object’s possible function.**  
  - **Write initial answers to Q1–3. Be specific—no erasing!**  
    - *Example: "Q1: Single occupancy. Evidence: Only one mug."*  

  **PHASE 2 (10 MIN):**  
  - **Refine your reconstruction. What story do these objects tell?**  
  ---  
  *Provenance by group:*  
  - Group 1: "Bagged off a desk the morning its owner moved out."  
  - Group 2: "Swept from a shared lounge bin at the end of term."  
  - Group 3: *[No provenance]*  
  - Group 4: "Found under a dorm room bed after eviction."  

  ---

  ### **Timeline (75 Minutes Total)**

  #### **0–5 min: Setup**  
  - Divide students into 4 groups (5 per table).  
  - Distribute object sets and task sheets. Emphasize: **“Write your initial claims in Phase 1—they’re your baseline!”**  

  #### **5–20 min: Phase 1 (Initial Claims)**  
  - Groups catalog objects and **write specific answers to Q1–3** on their sheets.  
  - *TA circulates:*  
    - If a group avoids speculation: *“Imagine this is all you have—what’s your boldest guess?”*  
    - If they fixate on labels/writing: *“Assume no text survives. What can objects alone tell you?”*  
  - **Critical:** Ensure claims are committed in writing (e.g., “Multi-occupancy because multiple item types imply shared use”).  

  #### **20–25 min: Item Swap**  
  - *Quietly remove the USB drive from each table and replace it with the wristwatch.*  
  - **Method:** Distract groups (e.g., “Check if you need more paper?”) while swapping. If noticed: *“Strange! Maybe it was misplaced? Work with what you have.”*  

  #### **25–35 min: Phase 2 (Refinement)**  
  - Groups incorporate the watch into their reconstruction. Few will notice the missing USB drive.  
  - *Predictable issue:* Groups may overlook the swap if hyper-focused. If so, note who *did* notice for later.  

  #### **35–50 min: Cross-Group Comparison**  
  - **Step 1:** Groups 1 and 2 stand. Ask both: *“Was the space single or multi-occupancy?”*  
    - Group 1 (desk provenance) often claims “single occupancy” (personal items).  
    - Group 2 (lounge bin) often claims “multi-occupancy” (shared trash).  
  - **Friction moment:** Point to the whiteboard. Write:  
    ```  
    Group 1 (Desk): "Single occupancy"  
    Group 2 (Lounge): "Multi-occupancy"  
    ```  
  - Ask: *“How can identical objects support opposite claims?”* Let students debate. **DO NOT mention “interpretation” yet.**  
  - **Step 2:** Ask Group 3 (no provenance): *“How did missing context affect you?”* Contrast their uncertainty with Groups 1–2’s confidence.  

  #### **50–60 min: Reveal the Swap**  
  - Ask: *“Did any group’s items change during the activity?”*  
    - If unnoticed: *“Check your initial notes. Is everything still there?”*  
  - Groups realize the USB drive is gone; a watch replaced it.  
  - **Key question:** *“How many of you used the watch in your final story? Did it change your claims?”*  
    - Example: A group might claim the watch “proves status” (not knowing it was added late).  

  #### **60–75 min: Structured Debrief**  
  - **Avoid jargon first!** Use student experiences to scaffold concepts:  
    - *Contradictions (Groups 1 vs. 2)* → **“Equifinality”**: Same objects, multiple valid stories.  
    - *Item swap* → **“Pompeii Premise”**: Assumptions about “sealed” contexts are risky.  
    - *Wristwatch used as “status symbol”* → **Analogy limits**: Modern bias (“watches = valuable”) misleads.  
    - *USB drive’s function (storage) vs. meaning (status?)* → **Function vs. social meaning**.  
  - **Address pitfalls:**  
    - *Unfazed students*: Ask *“What if this assemblage defined a culture? Would contradictions matter?”*  
    - *“Just a game”*: Contrast with real cases (e.g., biased interpretations of Mayan artifacts).  
    - *Group 4’s pizza box*: Use to discuss how food traces imply rituals (e.g., “shared meals”).  
  - **Last 10 mins:** Introduce terms explicitly. Connect to archaeology:  
    > “You faced **equifinality**—archaeologists see it in tool fragments (ritual vs. trash). The **Pompeii Premise** ignores disturbance; your swap shows why stratigraphy matters. Analogy (e.g., ‘mugs = individual use’) is useful but dangerous without evidence.”  

  ---

  ### **What Could Go Wrong (and Fixes)**  
  1. **Group refuses to speculate:**  
     - *Fix:* Ask *“What’s the safest claim? Even that’s an inference!”* Reward risk-taking.  

  2. **Swap unnoticed:**  
     - *Fix:* Have groups list objects in Phase 1. Later, say *“Audit your items against your list.”*  

  3. **Students demand writing/labels:**  
     - *Fix:* Remind them: *“Most prehistoric sites lack writing. How would you proceed?”*  

  4. **Contradictions don’t land:**  
     - *Fix:* Have Groups 1 and 2 read claims aloud. Ask others: *“Who do you believe? Why?”*  

  ---

  ### **What the Activity CANNOT Simulate (Must Explain Verbally)**  
  - **Time depth and excavation:** Students didn’t *excavate* layers or date objects. Real archaeology revises interpretations as new layers/artifacts emerge (e.g., Troy’s multiple cities).  
  - **Scale and context:** A real site has thousands of objects, architecture, and environmental data (e.g., pollen). Here, isolated objects force over-interpretation.  
  - **Scientific tools:** No access to lab analysis (e.g., residue on the mug) or comparative databases.  

  **Final Tip:** Start the debrief by asking *“What frustrated you?”*—then map frustrations to archaeological challenges. This makes the concepts feel earned, not lectured.
