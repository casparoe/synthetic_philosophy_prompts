  Hmm, the user is a novelist working on a complex book about two mirror-image communities and their social codes around success. They've drafted eleven "instruments" for managing successful individuals and want me to analyze them through a specific lens of "self-execution." 

  First I need to fully grasp their core hypothesis: that the Jante-like town (which cuts down success) and the American Dream town (which celebrates it) are actually running the same social machinery with inverted requirements. That's a fascinating premise. The key test is whether the self-execution scores will reveal this symmetry.

  Looking at their eleven instruments, they're remarkably nuanced - each captures a specific social mechanism. The self-execution metric is brilliantly chosen because it measures how much the target must actively participate in their own sanctioning. This directly probes whether both towns rely on the victim's complicity.

  For scoring, I'll be strict with endpoints as requested. The Pre-emptive Discount (1) is clearly high self-execution - it collapses if the person refuses to downplay their achievement. Whereas something like The Standing Suspicion (11) operates regardless of what the target does. The Roll Call (2) is interesting - it requires the achiever to verbally participate, making it highly self-executing.

  The transplant column is crucial for testing the hypothesis. If an instrument simply inverts when moved between towns (e.g., discounting becomes boasting), that supports their theory. But some like The Unnamed Gift (9) seem to dissolve when transplanted - it can't function if made public in either town.

  For taxonomy, I notice The Ledger of Small Debts (3) and The Earnedness Audit (7) are inverse twins - one weaponizes help received while the other erases it. They're the same mechanism with signs flipped. Meanwhile The Borrowed Mouth (10) might need splitting - the third-party delivery feels distinct from the emotional blackmail aspect.

  The "on the page" warning is vital. The Standing Suspicion (11) would be destroyed if named aloud - its power lies in the unspoken threat. Having a character articulate it would turn atmospheric dread into mere accusation.

  Throughout this, I'm mindful the user is five years into this novel. They don't want flattery - they want rigorous testing. The hypothesis mostly holds, but the exceptions (like The Unnamed Gift) are actually more interesting than total symmetry would be. The tiers reveal that both communities rely heavily on the target's cooperation - Tier I and II cover most instruments. That's the real insight: social control works best when the controlled enforce it themselves.
answer: |-
  ## Analysis of Community Sanctions in Mirror Towns

  **Bottom Line:** The highest self-execution score (1.00) belongs to **1. The Pre-emptive Discount**. The lowest score (0.00) belongs to **11. The Standing Suspicion**. The scoring strongly **supports your hypothesis**. The core mechanism across both towns is indeed the requirement for the rising individual to actively *perform* a specific narrative about their success – either minimizing/justifying it (Jante) or maximizing/proving its earnedness (Metropolis). The *content* of the required performance flips, but the dependence on the target's active complicity in enacting their own sanction or validation remains the fundamental machinery. The "sign" flips, the performance demand persists.

  **Instrument Ranking by Self-Execution:**

  | instrument              | self_execution | tier | placement                                                                 | transplant | transplant_reason                  |
  | :---------------------- | :------------- | :--- | :------------------------------------------------------------------------ | :-------- | :--------------------------------- |
  | 1. Pre-emptive Discount | 1.00           | I    | Entirely dependent on the achiever's own utterance; silence voids it.     | inverts   | Discount flips to mandatory boast. |
  | 6. Register Boundary    | 0.95           | I    | Sanction only occurs if the achiever speaks outside approved registers.   | inverts   | Approved registers invert content. |
  | 2. Roll Call            | 0.90           | I    | Sanction requires achiever's vocal participation in naming.               | holds     | Mechanism identical, content adapts. |
  | 7. Earnedness Audit     | 0.85           | II   | Sanction triggered *only* by achiever's failure to narrate earnedness.    | inverts   | Earnedness flips to discount demand. |
  | 4. Misattributed Compliment | 0.75      | II   | Sanction requires achiever's gracious reception (endorsement).            | holds     | Mechanism relies on forced acceptance. |
  | 10. Borrowed Mouth      | 0.65           | II   | Sanction requires achiever's response; striking loved one *is* the work.  | holds     | Third-party delivery & emotional trap persist. |
  | 8. Return Weekend       | 0.60           | II   | Sanction manifests *through* compliance (ordinariness) or refusal (record). | holds     | Demand for performance/record persists. |
  | 9. Unnamed Gift         | 0.30           | III  | Attribution by *others*, not the giver, triggers the machinery restart.   | dissolves | Attribution destroys secrecy in both contexts. |
  | 3. Ledger of Small Debts | 0.25          | III  | Community produces the record; achiever's reaction is secondary.         | inverts   | Implied debt flips to implied undeserved help. |
  | 5. Honourific Captivity | 0.15           | III  | Community bestows; achiever's acceptance is passive formality.           | holds     | Monumentalization functions similarly. |
  | 11. Standing Suspicion  | 0.00           | IV   | Operates purely through community atmosphere, regardless of achiever.     | holds     | Atmospheric threat needs no cooperation. |

  **TAXONOMY Notes:**

  *   **Same Instrument, Different Clothes:** `3. Ledger of Small Debts` (Jante) and `7. Earnedness Audit` (Metropolis) are inverses of the same core mechanism. The Ledger weaponizes the *receipt* of help as an unpayable debt implying the rise wasn't wholly "theirs." The Audit weaponizes the *omission* of luck/help to imply the rise wasn't truly "earned." Both enforce a narrative denying sole, inherent merit. They should likely be presented as mirrored aspects.
  *   **Fused Instruments Needing Split:** `10. Borrowed Mouth` combines two distinct elements: 1) The *delivery mechanism* (beloved third party as messenger), and 2) The *emotional trap* (any response harms a loved one). While linked, the core sanctioning power lies more in the trap than the specific messenger. Consider if the "beloved" aspect is crucial to the mechanism or just the most potent flavor.

  **ON THE PAGE Note:**

  *   **Instrument Ruined by Explicitness:** `11. The Standing Suspicion` is the most vulnerable to being ruined by a character stating it aloud. Its power relies entirely on the *pervasive, unspoken, and undefined* nature of the threat – a background radiation of potential accusation. Having a character articulate "We all know something about you..." instantly collapses the atmospheric dread into a specific, deniable, and manageable accusation, destroying the chilling ambiguity and permanent, unresolvable tension that defines it. The rule *must* remain inferred, never stated.
