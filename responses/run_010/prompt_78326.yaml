prompt: |-
  I'm three weeks into co-supervising a slightly bizarre project — an adaptive-systems lab at our place builds controllers for greenhouse climate regulation and for a couple of soft-robotics rigs, and they've decided they want to write things like "the system misrepresents the load" in their fault logs, and they've asked me to tell them when they're entitled to. So before I hand them anything I want the spec. Not a survey of positions, and definitely not a bibliography — my grad students are doing that lit review separately, and I don't trust them to know what to look for until we've fixed the target. What I want is the list of requirements a theory of mental content has to meet to be good enough for *this* job: a theory that would license content ascription across a range of systems where nobody is prepared to grant beliefs or desires, running from an insect's optomotor response, to a policy trained by reinforcement learning over a few hundred thousand episodes, to a lab-grown controller with no evolutionary ancestry and no engineer's intention behind it (the scaffold was designed, the thing that emerged in it wasnt). For each requirement, give me the case or consideration that motivates it. A bare requirement is useless to me — I want to be able to point at something concrete and say, if you can't handle this, you're out.

  Here's the stuff I already know I'll get pushed on, so work these into the list rather than treating them as an appendix. (1) Error: a controller's internal state tracks ambient temperature pretty reliably, but it also tracks a heat gun pointed at its thermistor, and a miscalibrated thermistor. Any theory that can't say which of these it represents, and can't make misrepresentation a real possibility rather than a notational convenience, is dead on arrival — but I want to know whether that's an independent requirement or just the determinacy requirement wearing a hat. (2) Swampman, with a twist: the standard case is a duplicate of a person, where most people's intuition is that the duplicate's states are about nothing because there's no history behind them. But suppose what gets spontaneously assembled is a duplicate of one of the *engineered* controllers, down to the firmware. If your theory says the duplicate has no content, does it also have to say the original's content comes from the design team's intentions? And if so, has it stopped being a naturalistic theory of content and become a theory about what my colleagues are thinking? That's a live worry for me, because the lab's whole framing is "the function is whatever the designer intended," and I suspect that's a trap. (3) Distal vs. proximal: does the controller's state represent the room, or the voltage across the sensor? Some theories are forced to one answer by their machinery, others let our explanatory interests decide. Tell me whether the requirement to *pick one* is itself genuine or a prejudice. (4) Lineage and time-scale: does function-making require reproduction across generations, or can selection inside a single lifetime (or inside a training run) do the work? If it can, say what does the work that reproduction was supposed to do. (5) The over-generation worry, which I think is the one most likely to sink the teleological options: if content rides on having a proper function, then a thermostat has representations, and so does a liver, and so does a smoke detector — and at that point the theory hasn't explained anything, it's just spread the word "about" thinner. A good spec needs to say whether the theory owes us a line here, and if it does, what could draw it that isn't question-begging.

  Then do the two things that actually make this a spec and not a list. First, sort the requirements into non-negotiable ones versus ones that are really the tastes of a particular camp — I already suspect that "must be reductive," "must be externalist," and "must ground a robust normativity that isn't just reliability-talk with a fancy word attached" don't all belong in the same column. Second, and this is the part I most want: tell me which subsets are jointly unsatisfiable. My own guess is that determinacy of content, full naturalism with no appeal to anybody's intentions or interests, and applicability to systems that have neither a selective lineage nor a designer, can't all be had at once — but I want you to say whether that trilemma is real, which horn you'd cut, and which single requirement, if you insist on it, knocks out the most candidates. Finish with a short paragraph, no more, on how a causal-covariance or indicator account, an etiological selected-effects account, and a design-or-artifact-friendly variant of teleosemantics each do against the list. Keep that part brief; the criteria are where the thinking is, and I'd rather have six well-motivated requirements than ten contenders ranked.
reasoning: |-
  Okay, let me approach this systematically. The user is a researcher co-supervising an adaptive-systems project needing clear criteria for when to ascribe mental content to non-biological controllers. They want requirements grounded in concrete cases, not philosophical surveys.

  First, I'll unpack the core demand: a spec for content ascription in systems ranging from insects to AI controllers, excluding human-like beliefs/desires. The user specifically flagged five sticking points - error cases, swampman variants, distal/proximal ambiguity, lineage questions, and over-generation risks. These must be integrated as motivators for requirements, not add-ons.

  Considering the key challenges:
  For error cases (like misrepresenting heat guns as ambient temp), the core issue is determinacy - can the theory distinguish between what the state reliably correlates with and what it *should* represent. This feels like an independent requirement because even deterministic correlations need normative criteria to define "misrepresentation".

  The swampman twist (spontaneously assembled controller) tests naturalism - if original content comes from designers' intentions, is the theory still naturalistic? The lab's "function=designer intent" framing seems problematic here since it might collapse content into human psychology.

  Distal vs proximal representation (room temp vs sensor voltage) raises questions about explanatory utility - when should we prefer one over the other? The requirement should focus on whether the theory forces an answer or allows context-dependent choices.

  Lineage/timescale issues challenge etiological accounts - can selection during training substitute for evolutionary history? The requirement should address what stabilizes function when there's no multi-generational selection.

  Over-generation (thermostats having "content") highlights the need for restrictive criteria - we must avoid trivializing representation while covering target cases like RL controllers.

  Now structuring the requirements:
  Non-negotiable: Determinacy (motivated by error cases), Naturalism (swampman concerns), Restrictiveness (over-generation problem), Functional Robustness (handling both evolved and engineered systems). 

  Negotiable: Normative Force (whether misrepresentation implies "should"), Representational Depth (gradations of content), Causal Specificity (distal vs proximal). 

  The trilemma emerges clearly: Determinacy + Naturalism + No Lineage Requirement likely conflicts. Sacrificing No Lineage Requirement preserves the other two but excludes lab-grown controllers. Alternatively, weakening Naturalism allows designer intentions but risks collapsing into psychology.

  For candidate theories:
  Causal-covariance struggles with determinacy and restrictiveness. Selected-effects handles determinacy but fails lineage-free cases. Teleosemantics with design proxies balances well but compromises naturalism.

  The spec prioritizes applicability to the lab's diverse controllers while blocking trivial content ascriptions. The swampman variant and over-generation cases are particularly effective stress tests.
answer: |-
  Here's the spec, structured as requested: six core requirements with concrete motivators, categorized by negotiability, followed by trilemma analysis and candidate assessment.

  ---

  ### **Core Requirements & Motivators**  
  *(Motivating cases in italics)*  

  1.  **Determinacy of Content (Non-negotiable):**  
      The theory must distinguish what a state *represents* from what it merely correlates with, even when reliable correlation exists with multiple candidates.  
      *Motivator: Your heat gun example.* A controller's state reliably covaries with ambient temperature, heat gun proximity, *and* thermistor miscalibration. The theory must non-arbitrarily specify which is represented (e.g., ambient temp) and explain why the state *mis*represents when the heat gun is on or the thermistor fails. "Covariance plus X" isn't enough; X must resolve ambiguity.

  2.  **Naturalism (Non-negotiable):**  
      Content must supervene on non-intentional, non-semantic physical/functional properties of the system and its environment/context. Appeals to *ascriber's* intentions or interests as constitutive of content are excluded.  
      *Motivator: Swamp-Controller.* If a molecular duplicate of your engineered controller assembles spontaneously in a vat, the theory's verdict on its content must depend *only* on its duplicate physical structure, dynamics, and environmental interactions – *not* on the absence of designers. If original content requires designer intentions, naturalism fails.

  3.  **Restrictiveness (Non-negotiable):**  
      The theory must avoid over-generating content ascriptions to systems where such talk is explanatorily inert or trivial (e.g., thermostats, livers, smoke detectors). It must provide criteria that distinguish systems warranting content ascription from those where purely physical/functional description suffices.  
      *Motivator: Over-Generation Worry.* If your theory implies a basic thermostat "represents" temperature, it fails. Content must earn its explanatory keep by enabling distinct predictions/explanations (e.g., misrepresentation, generalization failures, specific error types) unavailable via non-semantic descriptions.

  4.  **Functional Robustness (Negotiable):**  
      The theory must license content ascription to systems lacking biological evolution *or* explicit designer intent (beyond initial scaffolding). Functions relevant to content must be stabilizable by processes other than natural selection across generations.  
      *Motivator: Lab-Grown Controller & RL Policy.* Your controller emerged in a scaffold without being designed; the RL policy was "selected" during training. The theory must define "function" via intra-lifetime learning, environmental persistence, or goal-directed robustness – *not* require Darwinian lineage or human intentions.

  5.  **Explanatory Utility (Negotiable):**  
      Content ascriptions must provide distinctive leverage for explaining/predicting system behavior or failures compared to non-semantic descriptions (e.g., state transitions, input-output mappings).  
      *Motivator: RL Policy Failure.* Explaining why an RL agent fails catastrophically in a novel environment requires appeal to what its policy "took" the situation to be (misrepresentation) and what it "aimed" to do (goal), beyond just reward function math. If content adds nothing, it's superfluous.

  6.  **Contextual Specificity (Negotiable):**  
      The theory need not *force* a unique distal/proximal object (room vs. thermistor voltage), but must provide principled criteria for when one ascription is *explanatorily preferable* over the other in a given context.  
      *Motivator: Distal/Proximal Trade-off.* Diagnosing a controller failure: representing "voltage" better explains thermistor faults, representing "room temp" better explains faulty heater control. The theory shouldn't dictate one universally; it must allow context-driven choice *with justification* (e.g., which correlation is functionally critical for system goals).

  ---

  ### **Negotiability & Conflicts**  
  -   **Non-negotiable:** Determinacy, Naturalism, Restrictiveness. Failure on any disqualifies the theory for your use case.  
  -   **Negotiable:** Functional Robustness, Explanatory Utility, Contextual Specificity. Sacrificing these weakens the theory but may be necessary; they reflect desired explanatory power, not minimal viability.  

  **The Trilemma is REAL:**  
  You **cannot simultaneously satisfy Determinacy, Naturalism, and Functional Robustness (no lineage/design requirement)** in a non-trivial way. Something must give:  
  1.  **Sacrifice Functional Robustness:** Require etiological function (selection history or design). Solves determinacy naturally (selected function fixes content), keeps naturalism (history is physical). *Cost:* Excludes lab-grown/RL controllers.  
  2.  **Sacrifice Strict Naturalism:** Allow designer/user intentions or interests *constitutively* (e.g., "artifact functions"). Solves determinacy and includes artifacts. *Cost:* Fails Swamp-Controller; content depends on external minds.  
  3.  **Sacrifice Determinacy:** Accept indeterminacy or instrumentalism (content as a useful fiction). Solves Functional Robustness & Naturalism. *Cost:* Makes "misrepresentation" notional, violating your core need.  

  **The Single Most Damaging Requirement:**  
  **Determinacy.** It sinks pure causal-covariance accounts (no error norm), challenges instrumentalism, and forces etiological or normative commitments that threaten Naturalism or Functional Robustness.

  ---

  ### **Candidate Theory Assessment vs. Spec**  

  1.  **Causal-Covariance/Indicator Semantics:**  
      *Fails Determinacy* (no non-arbitrary way to pick "ambient temp" over "heat gun presence" in covariation cluster). *Fails Restrictiveness* (thermostats represent). *Passes Naturalism & Functional Robustness* easily.  

  2.  **Etiological (Selected-Effects) Teleosemantics:**  
      *Passes Determinacy & Restrictiveness* (function fixes content; only systems with selection history represent). *Fails Functional Robustness* (excludes lab-grown/RL controllers without lineage). Naturalism holds *if* selection is naturalized.  

  3.  **Teleosemantics with Design/Artifact Proxy:**  
      *Passes Determinacy & Functional Robustness* (designer intent or training goals proxy for "function"). *Fails Naturalism* (Swamp-Controller has no content; content constitutively depends on external intentions). *May pass Restrictiveness* if "proper function" criteria are strict.  

  **Conclusion:** No candidate cleanly satisfies all non-negotiables. Etiological teleosemantics + a *naturalized* account of intra-lifetime "selection" (e.g., reinforcement processes as function-makers) offers a path, but requires resolving whether training dynamics can genuinely substitute for evolution. Sacrificing strict etiological history is likely necessary for your project scope, pushing towards a hybrid approach that risks Naturalism unless "goal-directedness" can be fully naturalized sans history/intentions. Prioritize Determinacy and Restrictiveness; tolerate some Naturalism compromise if Functional Robustness is achieved without designer intentions.
