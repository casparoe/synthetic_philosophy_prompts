answer: |-
  ### Dialectical Pressure-Testing of the Participatory Account

  #### (a) Ranked List of Defeaters (Fatal to Awkward)
  1. **The Moral Contamination Defeater**  
     *Case*: You participate in a society where a convention requires complicit silence when authorities harass a marginalized group (e.g., ignoring police intimidation of ethnic minorities in public spaces). The practice coordinates social expectations to "avoid trouble." Violating it by speaking up disrupts coordination, but upholding it perpetuates injustice.  
     *Why it bites*: Commitment 5 admits only "comparable moral weight" as a defeater, but here the pro tanto obligation to comply conflicts with a *fundamental moral duty* (e.g., opposing oppression). The account cannot explain why participation in a *deeply immoral* practice generates even a residual obligation, nor why violating it isn’t merely permissible but *required*. It risks morally contaminating agents.  
     *Originality*: Unlike stock cases (e.g., segregated queues), this involves active participation in *enabling* harm through coordinated inaction.

  2. **The Unavoidable Participation Defeater**  
     *Case*: In a city with competing conventions for sidewalk navigation—some districts practice "keep-right," others "yield-to-larger-groups"—a pedestrian unavoidably participates in both spaces daily. When paths cross, compliance with one convention (e.g., keeping right) violates the other (e.g., yielding to a group approaching from the left).  
     *Why it bites*: Commitments 1 (participation) and 3 (local determination) impose obligations, but no priority rule resolves conflicts when practices are mutually exclusive. Accessibility (Commitment 2) doesn’t help, as both conventions are visible. The account forces incoherence: one cannot simultaneously satisfy both obligations.  
     *Originality*: Draws from unmapped urban mobility norms, not tipping or queues.

  3. **The Epistemic Bystander Defeater**  
     *Case*: A convention requires reporting minor property damage (e.g., a scratched car) to community authorities, but newcomers observe it only sporadically. You witness a scratch but aren’t sure if the convention applies in this subdistrict. You stay silent; later, the owner is harmed by unmet repair expectations.  
     *Why it bites*: Accessibility (Commitment 2) excuses only "genuine opacity," but here the practice is semi-visible yet ambiguously scoped. The account cannot distinguish between reasonable uncertainty (which should excuse) and negligent ignorance (which shouldn’t). It overextends obligation to cases where local determination is fuzzy.

  4. **The Costless Transgression Defeater**  
     *Case*: At 3 a.m., you cross against a pedestrian signal on an empty street in a city where waiting is customary. Unbeknownst to you, a reclusive insomniac observes this from their window and feels a fleeting sense of social dissolution.  
     *Why it bites*: Commitment 4 insists this is wrong despite no harm or frustration, but if the observer’s distress is too trivial to count as "harm," the wrongness seems vanishingly slight. Rivals (e.g., expressive accounts) would deny any wrong absent a meaningful "message"; this case tests whether the account’s wrongness threshold is implausibly low.

  #### (b) Defender Response & Cost  
  - **Moral Contamination**: Defender *explains away* by arguing that immoral practices fail to coordinate legitimate expectations, thus voiding Commitment 1. *Cost*: Retreat from Commitment 4 (detachment), as it now requires assessing a practice’s moral permissibility to determine if it "generally coordinates." Risks ad hoc content-filtering.  
  - **Unavoidable Participation**: Defender *explains away* by narrowing "local" to hyper-contextual spheres (e.g., "this block"). *Cost*: Amends Commitment 3 with a proximity clause, weakening local determination’s simplicity.  
  - **Epistemic Bystander**: Defender *concedes* this counts against the view, requiring a refinement to Accessibility: obligations bind only when the practice is *reliably inferable* from context. *Cost*: Adds complexity but preserves core commitments.  
  - **Costless Transgression**: Defender *explains away* by emphasizing the pro tanto obligation’s slightness (Commitment 5). *Cost*: None; consistent with the account’s framework.  

  #### (c) Unique Predictions & Empirical Vulnerability  
  - **Prediction 1**: People will judge *unobserved* violations (e.g., abandoning a queue at night) as morally wrong, even when rivals see only imprudence.  
  - **Prediction 2**: Children will treat convention-based rules (e.g., "wait for green lights") as binding without authorities, unlike sanction-backed norms (e.g., "don’t swear in church").  
  - **Empirical Disconfirmation**: If experiments show people *don’t* distinguish unobserved convention violations from mere impoliteness, or if children conflate conventions with authority-dependent rules, the account’s detachment (Commitment 4) is undermined. This would be a **genuine defeater**: the account hinges on conventions generating freestanding moral obligations, not just pragmatic or social pressure.  

  #### (d) Assessment of Your Anxieties & New Worries  
  - **Odious Conventions (e.g., segregated queues)**: **Not fatal but corrosive**. Commitment 5 indeed leaves a pro tanto obligation, but defenders can invoke higher-order moral duties (e.g., anti-discrimination) as defeaters. *Cost*: This concedes the obligation exists, which is counterintuitive and morally strained.  
  - **Conflicting Practices (e.g., ambiguous tipping)**: **Fatal if unaddressed**. Without a default rule, the account imposes incoherent obligations. *Solution*: Add a "dominant practice" clause to Commitment 3, but this risks arbitrariness.  
  - **New Anxiety: The Erosion of Moral Autonomy**  
    *Case*: In a community with burdensome conventions (e.g., daily ritual greetings), lifelong participation generates obligations that crowd out personal projects. Commitment 5 dismisses "inconvenience" as a defeater, but cumulatively, this may alienate agents from their values.  
    *Why it bites*: Overrides individual moral reasoning in favor of communal coordination, potentially infantilizing agents.  

  #### (e) Insulation Assessment  
  The view **is insulated but not vacuous**. Accessibility and pro tanto defeasibility absorb many counterexamples (e.g., tourists, extreme inconvenience), but they operate within principled limits:  
  - **Non-absorption**: Moral contamination and unavoidable participation cannot be resolved without substantive revisions (e.g., content filters or priority rules), which alter the view’s core.  
  - **Permissiveness vs. Emptiness**: The account remains non-vacuous because it still binds agents in clear, non-conflicting, morally neutral conventions (e.g., queueing order). The line falls at **systematic conflicts or profound immorality**—here, insulation fails.  

  **The single most damaging consideration**: If participation in a social space *always* generates a pro tanto obligation to comply with local conventions, **immoral practices (e.g., enabling oppression) create moral residue**. This obligates agents to cooperate with evil, however minimally. If true, it forces defenders to either embrace repugnant conclusions or abandon Commitment 1’s strict participation trigger.  

  ---

  Verdict: AT RISK | Participation obligates cooperation with immorality.
