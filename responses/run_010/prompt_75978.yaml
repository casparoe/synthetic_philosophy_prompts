  For defeaters, I consider:
  1. The "moral contamination" problem: Participation in unjust social spaces might create obligations to cooperate with injustice. Example: A segregated bus system where sitting in assigned sections coordinates expectations. This challenges the detachment from content.

  2. The "dissident's dilemma": When resisting a convention is itself the moral act. Example: A tradition of deferential silence toward authorities that enables abuse. The participatory account might condemn resistance as a violation.

  3. The "epistemic bystander" problem: When conventions rely on false beliefs. Example: Queueing based on a superstition about lucky numbers. Why should participation bind one to irrational norms?

  4. The "vanishing convention" problem: Their own anxiety about tipping where no clear practice exists. This exposes a flaw in local determination when practices are fragmented.

