  Regarding insulation: The accessibility clause and pro tanto structure do make the view flexible, but not vacuous. There are limits - some defeaters require substantive concessions.

  The single most damaging consideration is the moral contamination problem because it forces either admitting repugnant obligations or adding content filters that undermine the core participation premise.

