prompt: |-
  I am a PhD student working on the ethics of assertion. In a reading group I argued that a speaker can be fully blameworthy for misleading an audience while remaining less blameworthy than she would be for outright lying, and a senior colleague stopped me with the proverb "a half-truth is a whole lie." I want to know what he would have had to be claiming for that to function as a refutation rather than as a restatement of his disagreement.

  Please disambiguate the proverb into the distinct precise theses it might express, attending in particular to what "half" is doing — a statement that is literally partly false, one that is literally true but conveys something false, or one that is true yet omits what the hearer needed — since I suspect those three carry quite different normative freight. Then test each reading against my target case: under oath, a witness asked whether he has ever held a Swiss bank account describes a six-month company account in Zurich; every word is true, the examiner draws a false inference the witness anticipated and did nothing to correct, and no follow-up is asked. That is roughly the fact pattern of Bronston v. United States (1973), where a unanimous Supreme Court held that literally truthful but misleading answers are not perjury and that the remedy lies in the examiner's further questions. For each reading, say whether it delivers moral parity between lying and misleading, and whether it can explain why the legal asymmetry there is not tracking a moral one.

  Deliverable: a table with columns Reading (one sentence, precisely stated); Kind (definitional/semantic, culpability, duty, allocation of epistemic responsibility, or other); Verdict (platitude / substantive and defensible / false / unresolved); Supports the dismissal? (yes, partly, or no, with one clause of reasoning); Cost (what must be given up to accept it). After the table, three or four sentences naming the reading he most plausibly meant, which of your verdicts you hold least confidently, and what consideration would flip it.
reasoning: |-
  Okay, I need to help a PhD student with the ethics of assertion. They presented a case where misleading is less blameworthy than lying, and a colleague countered with "a half-truth is a whole lie." The student wants to know if that proverb refutes their point or just restates disagreement. 

  First, I'll break down the proverb. The word "half-truth" is ambiguous—it could mean a statement that's literally part false, or literally true but implies something false, or true but omits key info. Each carries different moral weight. The target case is Bronston v. US: under oath, a witness gives a truthful answer about a Swiss bank account that's misleading because he omits context, leading to a false inference. Legally, it's not perjury, but is there moral asymmetry?

  I'll create a table with readings of the proverb. Columns needed: Reading (precise thesis), Kind (e.g., definitional, culpability), Verdict (is it true?), Supports dismissal? (does it back the colleague?), Cost (what's sacrificed to accept it). 

  For the first reading: if "half" means a statement with false parts, then it's definitionally a lie—that aligns with the colleague, but Bronston shows it's not perjury, so morally it might not match. Verdict: false because it conflates misleading with lying. Cost: ignoring legal distinctions.

  Second reading: "half" as literally true but conveying falsity. This makes misleading as culpable as lying. But in Bronston, the witness is less blameworthy legally; morally, intent matters—did he exploit the questioner? Verdict: substantive but defensible only if we ignore context. Supports dismissal partly. Cost: undermines nuance in ethics.

  Third reading: "half" as omission of needed truth. This could imply a duty to correct false inferences. In Bronston, the witness didn't, so morally he might be fully blameworthy, like a liar. Verdict: substantive and defensible. Supports dismissal yes. Cost: sets a high bar for speakers, which may not always be fair.

  After the table, I'll say which reading is most plausible for the colleague. Probably the second or third, as they emphasize moral parity. My least confident verdict is the third—omission as equally bad—because intent and context vary. A flip point: if the omission was intentional deception, it might be as bad as lying; if not, less so. Also, legal asymmetry doesn't always track morality—courts focus on literal truth to protect witnesses, but ethics might demand more.

  I need to ensure clarity. The student wants to show that misleading can be less blameworthy, so I'll highlight where the proverb holds and where it doesn't. Finally, advise on engaging the colleague: question what "whole lie" means to expose assumptions.
answer: |-
  Below is a disambiguation of the proverb "a half-truth is a whole lie" applied to your Bronston case, with evaluations of its potential to refute your claim (that misleading can be less blameworthy than lying). The table analyzes distinct readings of "half-truth," assessing their normative implications and compatibility with legal/moral asymmetry.

  ### Table: Disambiguating "A Half-Truth Is a Whole Lie"
  | **Reading (Precise Thesis)** | **Kind** | **Verdict** | **Supports the Dismissal?** | **Cost** |
  |------------------------------|----------|-------------|-----------------------------|----------|
  | A statement containing at least one false conjunct or proposition is morally equivalent to a lie. | Definitional/Semantic | False | No (Bronston’s answer had no false elements) | Must reject the legal distinction in Bronston and oversimplifies deceptive speech by ignoring literal truth. |
  | A statement that is literally true but communicates a false proposition via implicature or context is as blameworthy as lying. | Culpability | Substantive but defensible only under strict deontological views | Partly (aligns with moral parity claim) | Must ignore the role of hearer vigilance and intent distinctions; fails to explain legal asymmetry (prosecutorial duty to clarify). |
  | A statement that omits critical information the hearer needs to avoid foreseeable false inferences incurs the same blame as lying. | Duty/Allocation of Epistemic Responsibility | Substantive and defensible | Yes (witness foresaw and exploited inference) | Imposes a strong duty of corrective disclosure, potentially overburdening speakers in asymmetric contexts (e.g., adversarial testimony). |
  | Any assertion causing a false belief, regardless of literal truth or speaker intent, is morally identical to lying. | Culpability | False | No (absolves hearer of all responsibility) | Collapses assertion ethics into consequentialism, ignoring speaker control and hearer epistemic duties. |
  | A technically true statement made with deceptive intent warrants maximal blame, equal to lying. | Culpability (Intent-Based) | Substantive and defensible | Yes (witness anticipated the inference) | Requires proof of deceptive intent, which may be inferential; Bronston’s legal holding avoids this subjectivity. |

  ---

  ### Analysis
  1. **Most Plausible Reading for Your Colleague**: The third reading (omission of needed truth) is likeliest, as it emphasizes the speaker’s moral duty to prevent foreseeable harm from inferences, aligning with the proverb’s intuitive force. The fifth reading (deceptive intent) is also plausible but less directly tied to "half-truth."  
  2. **Least Confident Verdict**: The verdict for the third reading ("substantive and defensible") is held least confidently. While it captures strong moral intuitions about omissions, its defensibility hinges on context: e.g., adversarial legal settings may reduce the speaker’s duty to volunteer corrections versus cooperative exchanges.  
  3. **Consideration to Flip the Verdict**: If the hearer (examiner) is a trained professional with clear responsibility to detect evasion (as in *Bronston*’s legal reasoning), the duty to correct dissipates, flipping the verdict to "overdemanding" and weakening parity. Conversely, if the speaker exploits a vulnerable hearer, parity strengthens.  

  **Key Insight**: The proverb functions as a refutation only under readings 3 or 5, which treat omissions/intent as morally fatal. However, *Bronston*’s legal asymmetry persists precisely because it rejects these readings in favor of literal truth and examiner diligence—suggesting that while the proverb *might* reflect ideal moral norms, it does not universally track blameworthiness in non-ideal contexts. Your case stands if the colleague cannot defend the strong duties/intentions required by readings 3/5.
