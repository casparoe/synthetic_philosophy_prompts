  ### **Leaf Positions: Named Views and Their Commitments**
  Each leaf corresponds to a philosophical position, derived from the answer combinations above. Positions are defined by their core principles, with their "most awkward commitment" and "hardest case to swallow" based on the tree's cases.

  1. **Naturalist Statistical-Function Account** (e.g., Boorse)  
     - **Path**: Q1=Y, Q2=N, Q4=N, Q9=N.  
     - **Core**: Disease is *statistically subnormal biological function* relative to age/sex reference classes, independent of goals or values.  
     - **Awkward Commitment**: Deafness/achondroplasia (Q6) is a disease even if the person experiences no limitation or harm.  
     - **Hardest Case to Swallow**: Presbyopia (Q4=N) – it is statistically normal for age, so not a disease, despite functional impairment.  

  2. **Harmful Dysfunction Hybrid** (e.g., Wakefield)  
     - **Paths**: Q1=Y, Q2=N, Q5=N or Q8=Y.  
     - **Core**: Disease requires *evolutionary dysfunction* (failure of naturally selected function) *and* harm.  
     - **Awkward Commitment**: Prolonged grief (Q10=Y) is a disease only if it reflects a dysfunction in psychological mechanisms.  
     - **Hardest Case to Swallow**: Asymptomatic BRCA1 carrier (Q5=N) – no *current* dysfunction, only risk, so not a disease.  

  3. **Ability-to-Reach-Vital-Goals Account** (e.g., Nordenfelt)  
     - **Path**: Q1=N, Q3=N, Q6=N.  
     - **Core**: Disease is *inability to achieve vital goals* (e.g., survival, happiness) due to biological/cognitive limitations, with goals set by the individual.  
     - **Awkward Commitment**: Hypertension (Q1=N) is not a disease if the patient is unaware and has no goals threatened *yet*.  
     - **Hardest Case to Swallow**: Sickle-cell trait in malarial areas (Q7=N) – it aids survival, so it enables goal achievement.  

  4. **Evaluativist Account** (e.g., Reznek, Sedgwick)  
     - **Paths**: Q1=Y, Q2=Y or Q7=Y or Q9=Y.  
     - **Core**: Disease is inherently *value-laden*; it exists only if labeled "bad" by societal or individual norms. Biological dysfunction alone is insufficient.  
     - **Awkward Commitment**: A harmless anatomical variant (Q9=Y) could be a disease if society deems it undesirable.  
     - **Hardest Case to Swallow**: Sickle-cell trait in malarial areas (Q7=Y) – it must be called a disease if society judges it negatively, despite its benefits.  

  5. **Norm-Relative Capability Account** (e.g., Nussbaum/Sen-inspired)  
     - **Paths**: Q1=N, Q3=N, Q7=N, Q8=N, Q10=N.  
     - **Core**: Disease is *impairment of core capabilities* (e.g., sensory, mobility) relative to a species-typical norm, with harm arising from social context.  
     - **Awkward Commitment**: Prolonged grief (Q10=N) is not a disease unless it impairs capabilities beyond social norms.  
     - **Hardest Case to Swallow**: Hypertension (Q1=N) – not a disease if capabilities are uncompromised *now*, despite future risk.  

