  ### **How to Use This Tree**
  1. **In the Seminar**: Have participants work through the tree individually, then group them by leaf positions for discussion.  
  2. **Key Insights**: The tree isolates:  
     - Whether disease requires *harm* (Q1–Q3) or is purely biological (Q6–Q9).  
     - Whether "normality" is *statistical* (Q4, Q9) or *normative* (Q7–Q8).  
     - Whether *patient values* affect disease status (Q2–Q3).  
     - Whether disease/illness/sickness are distinct (e.g., Q6 separates biological dysfunction from lived experience).  
  3. **Clinical Reflection**: Clinicians often conflate positions; this tree exposes inconsistencies (e.g., calling hypertension a disease but not presbyopia).  

  This tree prioritizes case-based intuition, forcing implicit assumptions into the open. Named positions emerge organically from answer patterns, avoiding theoretical jargon until debriefing.
