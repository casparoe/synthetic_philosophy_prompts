  Below is a decision tree designed to sort clinicians by their implicit concept of disease, based on judgments about concrete cases rather than theoretical labels. The tree uses nine binary-choice nodes (with one node having a follow-up, totaling 10 questions) to isolate core philosophical distinctions. Cases are presented as clinically grounded scenarios, and answer combinations map to named philosophical positions. Nodes are ordered to maximize discriminatory power, starting with high-stakes, common cases (hypertension) and progressing to edge cases that reveal underlying principles.

  ---

  ### **Decision Tree: What Counts as a Disease?**
  *Answer each question based on clinical intuition, not theory. Proceed down the tree based on "yes" (Y) or "no" (N) answers.*

  1. **Hypertension Case**: A patient has asymptomatic hypertension that, if untreated, will shorten her life by 10 years. She has no symptoms. Is this condition a *disease*?  
     - **Y** → Go to Q2.  
     - **N** → Go to Q3.  

  2. **Hypertension + Preference**: The same patient prefers not to know about her hypertension. Does this preference mean she *does not have a disease*?  
     - **Y** → Go to Q4.  
     - **N** → Go to Q5.  

  3. **Hypertension + Preference (No-branch)**: The same patient prefers not to know about her hypertension. Does this preference mean she *does have a disease*?  
     - **Y** → Go to Q6.  
     - **N** → Go to Q7.  

  4. **Presbyopia Case**: A 50-year-old has presbyopia (age-related farsightedness), which is statistically universal in her age group. Is this a *disease*?  
     - **Y** → Go to Q8.  
     - **N** → Go to Q9.  

  5. **BRCA1 Carrier Case**: An asymptomatic patient carries the BRCA1 gene (high risk of breast cancer) but has no current pathology. Is this a *disease*?  
     - **Y** → Go to Q10.  
     - **N** → Position: **Harmful Dysfunction Hybrid** (see leaves).  

  6. **Deafness/Achondroplasia Case**: A patient has congenital deafness or achondroplasia, disavows any functional limitation, and identifies strongly with a community (e.g., Deaf or little-person community). Is this a *disease*?  
     - **Y** → Position: **Naturalist Statistical-Function Account** (see leaves).  
     - **N** → Position: **Ability-to-Reach-Vital-Goals Account** (see leaves).  

  7. **Sickle-Cell Environment Case (Malaria)**: A patient has sickle-cell trait in a malaria-endemic region (where it confers resistance). Is this trait a *disease*?  
     - **Y** → Position: **Evaluativist Account** (see leaves).  
     - **N** → Go to Q10.  

  8. **Sickle-Cell Environment Case (Urban)**: The same sickle-cell trait in an urban, non-malarial environment (where it may cause complications). Is this trait a *disease*?  
     - **Y** → Position: **Harmful Dysfunction Hybrid** (see leaves).  
     - **N** → Position: **Norm-Relative Capability Account** (see leaves).  

  9. **Harmless Variant Case**: A patient has a statistically rare anatomical variant (e.g., an extra rib) that causes no harm or dysfunction. Is this a *disease*?  
     - **Y** → Position: **Evaluativist Account** (see leaves).  
     - **N** → Position: **Naturalist Statistical-Function Account** (see leaves).  

  10. **Prolonged Grief Case**: A patient’s grief persists for 12 months (meeting diagnostic criteria for prolonged grief disorder). Is this a *disease*?  
      - **Y** → Position: **Harmful Dysfunction Hybrid** or **Evaluativist Account** (see leaves for disambiguation).  
      - **N** → Position: **Norm-Relative Capability Account** (see leaves).  

