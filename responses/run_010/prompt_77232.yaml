prompt: |-
  I'm helping run a two-week workshop for a mixed group — roughly half economists who work on mechanism design, half political philosophers — whose stated job is to produce a short position paper on whether there is a defensible epistemic case for majority rule: one strong enough to be used in actual institutional-design arguments rather than merely invoked at conferences. The concrete design questions on the table are the familiar ones: how large a citizen assembly should be, whether juries should decide by unanimity, by supermajority, or by simple majority, and whether structured deliberation should be permitted before the vote is taken. My own contribution is the framing section, and what I want to write is not a defense of any particular account but a specification — the list of requirements that a formal account of the epistemic value of majority rule has to meet before designers should take it seriously. Please write that list for me.

  For each requirement, give the consideration or the case that motivates it, and mark whether you regard it as genuinely non-negotiable or as a prejudice of one camp. The candidates I keep hearing bandied about include: that an account not simply assume the thing that does all the work, since everyone grants that if each voter is right more than half the time the majority converges on the truth, so what actually has to be explained is where above-half competence comes from, how it could ever be estimated from the outside without begging the question against the voters themselves, and competence with respect to which set of questions — a body that is competent on local planning matters may be quite incompetent on macroprudential policy; that it say what is to replace Condorcet's independence assumption, given that shared evidence sources, common media environments, and common priors make votes correlated, and correlated error is precisely what defeats aggregation; that it be internally coherent about its own agents, since if voters share a prior and update on private signals, casting a vote for one's sincere posterior is not generally an equilibrium strategy, so an account that purports to describe real strategic agents cannot have it both ways; that it make claims at the group sizes institutions actually use rather than only in the limit, including the case where admitting more members lowers average competence; that it take an explicit stand on deliberation, because the very feature that pools dispersed information can also generate cascades and destroy whatever independence the account needed; that it say what happens when a group must decide a set of logically connected propositions rather than a single one, since majority voting on such a set can yield collectively inconsistent outcomes, and an account that ignores this is at best an account of single-issue votes; and that it state its domain — which questions have answers of the right sort for correctness to be meaningful at all, and what it falls back on for questions of value.

  Two things matter to me more than the completeness of the list. First, identify any subset of these requirements that cannot be jointly satisfied, and say which one has to give: my suspicion is that coherence about strategic agents, the demand that deliberation be allowed, and the demand for independence pull against one another, so that an account keeping all three is describing a body that could not exist — but I want the argument rather than my intuition. Second, tell me which single requirement does the most work in excluding otherwise attractive accounts, since that is where I want the framing section to place its weight. Only once that is settled should you score archetypes against the list, in a sentence or two each: a classical Condorcet-style defense resting on independent and roughly uniform competence; a game-theoretic account on which the vote is a device for eliciting dispersed private information; a judgment-aggregation account that gives up tracking an antecedent truth in favour of keeping collective outcomes consistent; and, if you like, a pragmatist or experimentalist account that treats accuracy as something discovered through repeated low-stakes trials rather than assumed at the outset. No references and no reading list, please — I need the specification itself and your view of where it bites hardest. One last thing worth flagging: my economist colleagues and my philosopher colleagues will disagree about which items on this list are assumptions and which are conclusions, so it would help a great deal if you noted anywhere you think the line between the two is being drawn question-beggingly.
reasoning: |-
  Okay, let me tackle this intricate request step by step. The user needs a rigorous framework for evaluating epistemic defenses of majority rule, specifically for institutional design contexts. 

  First, I need to parse the core challenge: they want requirements that separate theoretically elegant but practically useless accounts from those that can genuinely inform real-world design. The economists will likely prioritize formal coherence and strategic behavior, while the philosophers may emphasize normative foundations and domain limitations. 

  The tension points stand out immediately: independence vs deliberation, strategic sincerity vs correlated errors, and the competence paradox (estimating voter accuracy without circularity). I recall that the user suspects irreconcilable conflicts here - particularly between independence requirements and deliberation's benefits. Game theory suggests deliberation can align beliefs enough to break vote independence, yet that same alignment enables information pooling. That's the first knot to untangle.

  Next, the competence question feels like the true gatekeeper. Any account that handwaves voter accuracy above 50% is useless for design. But verifying competence externally is viciously circular - if we could objectively measure truth, we wouldn't need voting! This probably excludes naive Condorcet defenses entirely. 

  For the strategic behavior requirement, I'm considering how voting models often assume sincere behavior while real voters game the system. An epistemic account must either justify sincerity (unlikely) or model strategic equilibria where voting remains informative - much harder but necessary for credibility.

  The size matters requirement seems crucial too. Many theorems work asymptotically but fail at practical group sizes like 12 jurors or 500 assemblies. If adding members lowers average competence (e.g., in specialized domains), the account must address that degradation.

  Deliberation's double-edged sword needs careful handling. While it combats fragmentation by sharing information, it creates correlation risks. Any serious account must specify safeguards against cascades - perhaps via structured dissent or sequential disclosure.

  The domain restriction might be underappreciated. Truth-tracking makes sense for factual questions but not pure value judgments. An account must declare its boundaries or risk overclaiming.

  Now for conflicts: the independence-deliberation-strategy triangle seems genuinely problematic. Allowing deliberation correlates votes; correlated errors break independence; and strategic agents may manipulate deliberation to worsen outcomes. Satisfying all three likely describes an imaginary institution. The independence assumption might be the weakest link here - real groups always have correlated information sources.

  For archetype scoring:
  - Classical Condorcet fails competence justification and independence
  - Game-theoretic approaches handle strategy well but struggle with deliberation-induced correlation
  - Judgment aggregation sidesteps truth-tracking entirely, which may disappoint both camps
  - Experimentalism avoids upfront competence claims but needs many iterations - impractical for high-stakes one-off votes

  The competence requirement stands out as the most exclusionary. It's where elegant models crash into the reality that we can't objectively calibrate voter accuracy without the very procedure we're evaluating. This deserves center stage in the framing.
answer: |-
  Here is a specification of requirements for a defensible epistemic account of majority rule, designed for institutional design. Each requirement is motivated, marked for negotiability, and assessed for conflicts. The list prioritizes operational viability over theoretical elegance.

  ### Core Requirements:
  1.  **Non-Circular Competence Justification**  
      *Motivation*: Accounts assuming P(individual correct) > 0.5 (without explaining *why* or *how to verify this*) beg the question. Competence must be grounded in features of institutional design (e.g., training, selection, deliberation) or task properties (e.g., tractability, feedback mechanisms), not assumed. Crucially, it must specify how competence could be estimated *externally* without presupposing the voting outcome is correct.  
      *Non-negotiable?* **Yes**. Without this, the account is useless for design.  
      *Conflict Note*: Philosophers may see this as a conclusion (competence emerges from just institutions), economists as an assumption (competence is exogenously given). Both beg the question if competence isn’t linked to observable design levers.

  2.  **Explicit Error Correlation Model**  
      *Motivation*: Real voters share evidence, priors, and social influences, violating Condorcet’s independence. Correlated errors destroy the "wisdom of crowds." An account must specify how it handles correlation (e.g., bounded correlation, diversification mechanisms) and its impact on convergence rates.  
      *Non-negotiable?* **Yes**. Ignoring correlation invalidates asymptotic results for real groups.  
      *Conflict Note*: Economists treat correlation as a nuisance; philosophers may see it as inherent to communal reasoning. Both camps must confront it.

  3.  **Strategic Agent Coherence**  
      *Motivation*: If voters share information (formally or via deliberation) and vote strategically, sincere voting is rarely equilibrium. An account cannot assume voters truthfully report private signals while also assuming they update beliefs communally. It must either justify sincere voting (e.g., via low stakes or institutional constraints) or model strategic equilibria where voting remains informative.  
      *Non-negotiable?* **Yes**. Incoherent agent models yield unreliable predictions.  
      *Conflict Note*: Economists insist on strategic rationality; philosophers may prefer "deliberative sincerity." An account must reconcile or choose.

  4.  **Finite-Group Robustness**  
      *Motivation*: Asymptotic results (n→∞) are irrelevant for juries (n=12) or assemblies (n=500). The account must work at practical sizes, including cases where larger groups reduce *average* competence (e.g., adding laypersons to expert panels). Optimal group size and voting thresholds should be derivable.  
      *Non-negotiable?* **Yes**. Designers need numbers, not limits.  
      *Conflict Note*: Economists often default to asymptotics; philosophers neglect group scaling. Neither suffices.

  5.  **Deliberation Stance**  
      *Motivation*: Deliberation can pool information (good) but cause herding/cascades (bad). The account must state if deliberation is required or prohibited, how it affects independence/competence, and how to structure it to avoid cascades (e.g., anonymous voting, devil’s advocates).  
      *Non-negotiable?* **Conditionally**. The account must engage deliberation’s role, not ignore it.  
      *Conflict Note*: Philosophers often champion deliberation; economists fear its correlation effects. The tension is irreducible but must be addressed.

  6.  **Multi-Proposition Consistency**  
      *Motivation*: Real decisions involve interconnected propositions (e.g., "A & B imply C"). Majority rule on each separately can yield inconsistent collective judgments (e.g., A=yes, B=yes, C=no). The account must either restrict scope to single issues or incorporate aggregation methods preserving rationality (e.g., premise-based voting).  
      *Non-negotiable?* **For multi-issue bodies**. Ignoring inconsistency limits applicability.  
      *Conflict Note*: Philosophers care about collective rationality; economists may dismiss it as "merely logical." Designers cannot.

  7.  **Domain Specification**  
      *Motivation*: Epistemic value presupposes "truth" is meaningful. The account must define which questions admit truth-tracking (e.g., factual, interpersonally verifiable) and how it handles evaluative questions (e.g., fall back to procedural fairness). Competence must be question-type-specific.  
      *Non-negotiable?* **Yes**. An undefended domain invites overextension.  
      *Conflict Note*: Philosophers debate truth-aptness; economists often assume it. Both must specify boundaries.

  ---

  ### Key Conflict: The Independence-Deliberation-Strategy Trilemma
  The requirements for **uncorrelated errors (2)**, **meaningful deliberation (5)**, and **strategic coherence (3) cannot be jointly satisfied** in a simple model.  
  - Deliberation (5) inherently correlates beliefs by sharing evidence.  
  - Correlated beliefs violate independence (2) and enable strategic manipulation (3).  
  *Resolution*: **Independence (2) must be relaxed**. A defensible account should embrace *bounded* correlation (e.g., from common evidence) but show robustness to it, or structure deliberation to *diversify* information sources (e.g., multiple experts, secret ballots). Sacrificing independence is necessary; sacrificing all deliberation or strategic rationality is too restrictive for real bodies.

  ---

  ### Most Exclusionary Requirement: Non-Circular Competence (1)
  This requirement excludes more otherwise-attractive accounts than any other. It demands:  
  - Explaining *why* voters are competent (>0.5) for a *specific* task.  
  - Providing a non-question-begging method to *estimate* competence externally.  
  Accounts that handwave competence, or define it retroactively (e.g., "the winners were competent because they won"), fail here. This is where elegant formalisms crash into design practicality.

  ---

  ### Archetype Scoring Against Requirements
  1.  **Classical Condorcet**  
      *Fails*: Circular competence (1), ignores correlation (2), assumes sincere voting (3), ignores deliberation (5), silent on multi-proposition consistency (6). Only satisfies finite-group (4) if competence is high.  
  2.  **Game-Theoretic (Information Aggregation)**  
      *Fails*: Often assumes competent types (1), struggles with deliberation-induced correlation (2,5). *Strengths*: Strategic coherence (3), finite-group analysis (4). Silent on domain (7) and multi-proposition (6).  
  3.  **Judgment Aggregation**  
      *Fails*: Abandons truth-tracking for consistency (violating 1,7). *Strengths*: Multi-proposition consistency (6), can model deliberation (5). Silent on competence/correlation (1,2).  
  4.  **Experimentalist/Pragmatist**  
      *Fails*: Requires repeated trials (impractical for one-off votes), avoids defining competence upfront (1). *Strengths*: Handles deliberation (5), domain-sensitive (7). Weak on correlation (2) and strategy (3).  

  ---

  ### Where the Framing Should Place Weight
  **Hammer Requirement #1 (Non-Circular Competence)**. Without it, accounts are self-justifying rituals. Designers need to know: *Under what observable conditions* will members be competent? How can we *measure* this without the vote itself? This exposes the central fragility of epistemic arguments and forces engagement with institutional details (selection, training, task structure) rather than abstract axioms. The trilemma (Independence vs. Deliberation vs. Strategy) is secondary but vital for realism—acknowledge that correlation is inevitable and show how to mitigate it.
