  ### Pramāṇa Quiz: What's Your Intuition?  
  **Purpose:** This quiz sorts your intuitions about "ways of knowing" by analyzing concrete cases. No prior knowledge of Sanskrit terms needed—just pick the answers that feel right. At the end, you’ll see which classical Indian philosophical school your intuitions align with (e.g., "Nyāya" or "Mīmāṃsā") and how many distinct "ways of knowing" (*pramāṇas*) your answers imply.  

  #### Core Idea: What Makes a "Way of Knowing" Distinct?  
  When is a way of gaining knowledge fundamentally *different* from others? People disagree on this, so your answers will sort you based on three criteria:  
  1. **Distinct Object**: Does it reveal something *unique* (e.g., absences, similarities)?  
  2. **Distinct Process**: Is the *mental act* different (e.g., comparing, trusting, postulating)?  
  3. **Irreducibility**: Could you get the same knowledge *another way*?  

  ---  
  ### The Quiz  
  **Instructions:** For each scenario, pick **one** answer. Answer quickly—go with your gut!  

  1. **The Quokka**  
     You’ve never seen a quokka, but a friend says, "It’s like a squirrel mixed with a kangaroo." Later, you see a small, hopping creature with a squirrel-like face and think, "That’s a quokka!" How did you know?  
     - A. I connected the description to what I saw—it’s just reasoning.  
     - B. I recognized the *similarity*—it’s a different kind of mental jump.  

  2. **Language Model**  
     You ask ChatGPT, "What’s the capital of Bhutan?" It says "Thimphu," and you believe it. How did you gain this knowledge?  
     - A. The model *told* me—it’s like learning from a source.  
     - B. I inferred from patterns—it’s advanced pattern-matching, not a "speaker."  
     - C. It’s a hybrid: part tool, part information, but not like a person.  

  3. **Devadatta’s Dinner**  
     Devadatta is overweight but never eats during the day. You think, "He must eat at night." How did you know?  
     - A. Basic reasoning: his traits imply night eating.  
     - B. I *had* to assume it—no other way to explain the facts.  

  4. **Empty Fridge**  
     You remember finishing the milk this morning. Without checking the fridge, you know there’s no milk left. How?  
     - A. Memory + logic: I finished it, so it’s gone.  
     - B. Direct awareness of absence: I don’t see it, and it *feels* missing.  

  5. **Red Apple**  
     You see a red apple and think, "It’s red." Do you *also* know your eyes aren’t tricking you?  
     - A. Yes—the seeing itself tells me it’s reliable.  
     - B. No—I might need to verify later (e.g., touch it).  

  6. **Island Wildlife**  
     You’re told, "Dodos are flightless birds." On an island, you see bones of a large bird with small wings and think, "This was a dodo." How?  
     - A. Inference: bones + description = dodo.  
     - B. It clicked from *fit*—like matching a puzzle piece.  

  7. **Light On, Nobody Home?**  
     You know your neighbor only leaves their light on if home. You see the light on and think, "They’re home." Later, you learn they forgot to turn it off. Did you *know* they were home when you saw the light?  
     - A. Yes—the light being on *meant* they were home.  
     - B. No—it was a good guess, but I needed confirmation.  

  8. **Stolen Wallet**  
     Your wallet was on the table. Now it’s gone. No one else was here. You think, "It was stolen." How?  
     - A. Inference: the evidence points to theft.  
     - B. Postulation: I *must* assume theft to explain the absence.  

  9. **Software Bug**  
     A program crashes only when you print. You think, "Printing causes the crash." How did you know?  
     - A. Repeated testing—I saw the pattern.  
     - B. Elimination: nothing else fits, so it *has* to be printing.  

  ---  
  ### Scoring Key  
  Tally your answers (e.g., 1A, 2B, 3A...) and use the table below. Your pattern maps to a classical school and its "ways of knowing" (*pramāṇas*).  

  | **Answer Pattern**                               | **Ways of Knowing** | **School**                | **Key Beliefs**                                                                 |  
  |--------------------------------------------------|---------------------|---------------------------|---------------------------------------------------------------------------------|  
  | **≥5 A’s** in Q1,3,4,6,8; **Q2=A or C**; **Q5=B** | 2: Perception, Inference | Buddhism / Vaiśeṣika      | Reduces everything to perception or inference. "Similarity" (Q1B) is inference; absence (Q4B) is perception. |  
  | **Q1=A**, **Q2=A or C**, **Q3=A**, **Q4=A**, **Q6=A**, **Q8=A** | 3: Perception, Inference, Testimony | Sāṃkhya / Yoga            | Testimony (Q2A/C) is distinct. "Must assume" cases (Q3B/Q8B) are inference. |  
  | **Q1=B**, **Q2=A or C**, **Q3=A**, **Q4=A**, **Q6=A/B**, **Q8=A** | 4: Perception, Inference, Testimony, Comparison | Nyāya                     | Similarity (Q1B) is a distinct "comparison" process. Language models (Q2) are testimony. |  
  | **Q1=B**, **Q2=A or C**, **≥2 B’s** in Q3/6/8, **Q4=A**, **Q7=A** | 5: Perception, Inference, Testimony, Comparison, Postulation | Prābhākara Mīmāṃsā       | "Must assume" (Q3B/Q6B/Q8B) is distinct postulation. Knowledge is self-validating (Q5A). |  
  | **Q1=B**, **Q2=A or C**, **≥2 B’s** in Q3/6/8, **Q4=B**, **Q5=A** | 6: Perception, Inference, Testimony, Comparison, Postulation, Non-Apprehension | Bhāṭṭa Mīmāṃsā           | Absence (Q4B) is distinct. Self-validation (Q5A) and postulation (Q3B/Q6B/Q8B) are key. |  

  #### Notes on Unattested or Ambiguous Positions  
  - **"Hybrid" Views (e.g., Q2=C + Q4=B + Q5=B)**: No classical school matches. Modern intuitions about AI as "non-person testimony" or extrinsic validation (Q5B) weren’t explored.  
  - **"Reductionist" Views (e.g., Q1=A + Q4=B)**: Unattested. Schools that reject "similarity" as distinct (Q1A) also reduce absence (Q4A). Believing in absence (Q4B) but not similarity (Q1A) may be incoherent—both deal with non-empirical objects.  
  - **Q7 (Light On)**: Doesn’t split schools cleanly. All agree knowledge requires reliability, but if you chose B, you lean toward extrinsic validation (like Nyāya).  
  - **Q5 (Red Apple)**: If you chose A, you believe knowledge self-validates; B means you require external checks. This splits Nyāya (B) from Mīmāṃsā (A) but doesn’t change the *number* of *pramāṇas*.  

  #### How Your Answers Map to the Criteria  
  - **Distinct Object** (e.g., absences): Strong if you chose Q4B or Q8B.  
  - **Distinct Process** (e.g., similarity): Strong if you chose Q1B or Q6B.  
  - **Irreducibility**: Strong if you chose B in Q3/Q4/Q6/Q8.  
  - Early splits (Q1, Q2, Q4) target these criteria.  

