prompt: |-
  I'm assembling a seminar on the ethics of the future and I keep getting stuck on one page of a national appraisal manual — the sort of document a treasury issues telling departments how to cost out a proposal. Not an eccentric one, a bog-standard one. Here's what it does. Costs and consumption benefits are discounted in real terms at something like 3.5% a year, with the rate stepping down the further out you go. But health effects — lives saved, years of life, QALYs — are supposed to be discounted at roughly 1.5%. And then, in another section of the same manual, you're told to attach a money value to a statistical life, some figure in the millions, and drop it into the benefit stream, where it takes the money rate like everything else.

  So: what has to be true about value for that split to be more than a bookkeeping fudge? If you can monetise a life in one chapter, you're treating health as fungible with consumption; if health then gets a gentler rate in the next chapter, you're treating it as not fungible, or at least as not governed by whatever logic drives the 3.5. Which commitment is actually doing the work? My hunch is the low health rate only makes sense if the whole justification for discounting is that the future will be richer than us, so a unit of good delivered then buys its recipient less — and if that's the justification, the practice is commited to health not rising the way consumption does. Is that an empirical bet about future medicine, or a normative claim that a QALY isn't the kind of thing anyone can end up having more of?

  Does the split also quietly kill the impatience story? Impatience doesn't care what the good is, so a rate built on impatience would hit health and money alike. Which suggests the manual has rejected pure time preference in all but name while still printing a rate that looks like prudence. And note the rate is calibrated to a growth forecast for a world the policy being appraised may itself change — is that separability something the practice needs, or just something it assumes for convenience?

  I'd like a clean map of what's strictly presupposed versus what merely fits: the declining schedule, for instance, seems licensable by several rival views at once. Then tell me what would have to change — in the manual, and in the projects it greenlights — if you swapped the presupposed view for (a) a single rate for everything, (b) no discounting at all, or (c) a person-affecting view on which benefits accruing to people who wouldn't otherwise exist don't count, since a lot of those health gains in year 150 land on people whose existence is downstream of the very policy being scored.
reasoning: |-
  Okay, let me unpack this user's query. They're assembling a seminar on future ethics and are stuck on a national appraisal manual's discounting approach. The manual uses different discount rates for costs/consumption (3.5%) versus health benefits (1.5%), then monetizes lives in another section. The user wants to know what philosophical commitments make this split coherent beyond being a "bookkeeping fudge."

  Hmm, the core tension lies in simultaneously treating health as monetarily fungible (via statistical life values) while giving it preferential discounting. If health were truly fungible with consumption, they should share the same discount rate. The different rates suggest health isn't governed by the same "future richness" logic driving the 3.5% rate. 

  Interesting hypothesis by the user: the low health discount rate might imply health benefits don't scale with wealth like consumption does. But is that an empirical claim about medical progress stagnation, or a normative stance that QALYs can't be "abundant"? I should explore both angles. 

  Ah! The impatience point is sharp. If discounting reflected pure time preference, it should apply uniformly. The split quietly rejects time preference as the primary justification while maintaining the facade of prudence. That's philosophically significant - it means the manual implicitly endorses a growth-based discounting model.

  The user also raises structural questions: Can we truly separate policy impacts from growth forecasts when policies alter that very growth? And how does this interact with person-affecting views where future beneficiaries only exist because of the policy? 

  For alternatives: A single rate would overvalue distant health or undervalue consumption; no discounting ignores opportunity costs; person-affecting views collapse long-term health benefits. The user needs concrete implications - like how climate policies would be mispriced under current rules. 

  This isn't just technical - it's about what we value intergenerationally. The manual's fudge reveals our unspoken assumptions: that health has intrinsic worth beyond GDP, yet we still force it into cost-benefit boxes. The seminar should make these tensions visceral.
answer: |-
  You've hit on a profound tension in appraisal methodology – one exposing core philosophical and economic commitments often left unexamined. Let's dissect the presuppositions, implications, and alternatives.

  **Core Commitments Required for Consistency (Beyond Fudge):**

  1.  **Non-Fungibility of Health vs. Consumption (Despite Monetization):** The *act* of monetizing a life (e.g., $X million per VSL) implies *fungibility for aggregation*. The *different discount rate* implies *non-fungibility over time*. This split requires:
      *   **A Commitment to Intrinsic Value:** Health (QALYs) possesses an intrinsic value distinct from its monetary representation. The monetary value is a *proxy for aggregation convenience*, not the fundamental measure of welfare. The discount rate applies to the *underlying welfare* (health), not just its monetary tag.
      *   **Differential Income Elasticity:** The logic driving the 3.5% rate relies heavily on the assumption that the marginal utility of *consumption* declines as society gets richer (η > 0, where η is the elasticity of marginal utility w.r.t. consumption). The 1.5% rate for health implies **η_health ≈ 0 or even η_health < η_consumption**. This means:
          *   **Empirical Claim:** Future generations will *not* become satiated with health/life extension in the same way they (might) become satiated with material goods. A QALY gained in 2200 delivers roughly the same welfare gain as a QALY today, even if future people are vastly richer materially. This is a bet on medical progress *not* fundamentally changing the *value* of an additional year of healthy life relative to basic needs.
          *   **Normative Claim (Implied):** Health/life is a fundamentally different category of good, less subject to diminishing marginal utility from overall economic growth. A QALY is *not* a good you can "have enough of" in the same way as consumption goods.

  2.  **Rejection of Pure Time Preference (PTP) as the Dominant Justification:** Your hunch is correct.
      *   **PTP (Impatience)** is indifferent to the *type* of good. A uniform discount rate applied to *all* goods would be consistent with PTP.
      *   **The Split** signals that the primary justification for discounting *both* streams is the **growth discounting/growth elasticity argument** (future generations will be richer). The differential rates arise *because* η_health < η_consumption. PTP is likely incorporated as a small component within the overall rate (e.g., the Ramsey Rule: r = δ + ηg), but the *difference* between health and consumption rates is driven almost entirely by the difference in assumed η.

  3.  **Separability of Policy Impact & Growth Forecast:**
      *   **Assumption:** The baseline growth forecast (`g`) used to calibrate η and thus `r` is *exogenous* to the policy being appraised. The policy's impact on future growth is assumed negligible for the purpose of discount rate selection. This is **overwhelmingly a convenience assumption**, simplifying calculation dramatically. It's rarely strictly true, especially for large-scale, long-term policies (climate, infrastructure), but models need tractable baselines.

  4.  **Declining Schedule:**
      *   **Licensed By:** Uncertainty about *future* growth rates (`g`), uncertainty about *future* discount rates (r_t), precautionary principle for very long horizons, or arguments about catastrophic risk. It's less directly tied to the core η distinction than the health/consumption split itself.

  **What Changes Under Alternative Presuppositions?**

  | **Alternative View**          | **Changes to Manual**                                                                 | **Impact on Projects**                                                                                                                               | **Philosophical Shift**                                                                                                 |
  | :---------------------------- | :------------------------------------------------------------------------------------ | :--------------------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------- |
  | **(a) Single Rate (e.g., 3.5%)** | 1.  Eliminate separate health discount rate. <br>2.  Apply consumption rate (e.g., 3.5%) to *monetized* health benefits. | 1.  **Devalues Distant Health:** Long-term health benefits (e.g., cancer prevention, climate health) become less competitive.<br>2. Favors projects with immediate consumption benefits & shorter-term health gains. | **Strong Fungibility:** Health is treated *exactly* like consumption goods over time. η_health = η_consumption. PTP may play a larger explicit role. |
  | **(b) No Discounting (r=0%)** | 1.  Eliminate all discounting of future costs/benefits. <br>2.  Future flows valued equally to present.          | 1.  **Massively Favors Long-Term Projects:** Climate mitigation, nuclear waste management, genetic disease eradication become dominant.<br>2.  Ignores opportunity cost of capital.<br>3.  Raises severe intergenerational equity questions (sacrificing immense present consumption). | **Radical Intergenerational Egalitarianism:** Rejects arguments based on future wealth or pure time preference. Focuses solely on aggregate sum. |
  | **(c) Person-Affecting View** | 1.  Define the "affected population" (e.g., those alive today + next ~80 years?). <br>2.  Benefits accruing to individuals whose *existence* depends on the policy (e.g., descendants born >100 years hence) are **excluded** or **heavily discounted**. | 1.  **Devastates Very Long-Term Benefits:** Climate adaptation benefits beyond ~100 years, existential risk reduction, most health gains beyond 2-3 generations **vanish** from appraisal.<br>2.  Favors projects benefiting identifiable near-term populations.<br>3.  Creates perverse incentives for policies altering future population size/composition. | **Parochialism:** Prioritizes welfare of existing/near-future identifiable persons over potential future persons. Severs the chain of obligation to the distant future. |

  **Conclusion & Implications for Your Seminar:**

  The manual's split isn't *just* a fudge; it's a window into **unspoken normative and empirical commitments**:

  1.  **Health is Special:** Despite monetization for aggregation, health is granted a quasi-deontological status over time. Its value is assumed less susceptible to diminishing returns from economic growth.
  2.  **Growth Elasticity Rules:** The core justification for discounting is the expectation of future wealth, *not* pure impatience. The split *requires* the rejection of PTP as the primary driver.
  3.  **Convenience Trumps Complexity:** The separability of policy impact from growth forecasts is a necessary evil for practical appraisal, not a deeply held belief.

  **To expose the ethics:** Challenge these presuppositions. Ask:

  *   **Is η_health really ~0?** Will future generations truly value an extra QALY *exactly* as much as we do, even with potential radical life extension or cognitive enhancement? Is this an empirical question we can answer, or a value judgment?
  *   **Does rejecting PTP hold water?** Is it ethically coherent to care *less* about future people *solely* because they might be richer? Does this adequately capture our intuitions about intergenerational justice?
  *   **Does separability hold?** For transformative policies (e.g., net-zero transition), doesn't the policy *define* the future growth path? Doesn't this circularity undermine the discount rate's foundation?
  *   **What does monetization *do*?** Does attaching a dollar figure to life, only to then discount that dollar figure differently, obscure more than it reveals? Does it inadvertently smuggle in the very fungibility the split tries to deny?

  The manual's structure reflects a precarious balancing act between economic pragmatism (monetization, discounting), a recognition of health's unique moral weight (differential discounting), and unresolved tensions about our obligations to a future shaped by our own choices. Your seminar can illuminate this precariousness as central to the ethics of the future.
