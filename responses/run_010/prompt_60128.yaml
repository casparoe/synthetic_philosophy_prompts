  But if we allow arbitrarily fast speeds and many relays, then we can make the shift arbitrarily large. Then we could say that an event on Earth tomorrow is already real for a sufficiently fast and distant chain of observers. However, the event would still be inside the future light cone of the starting event on Earth? Yes, if it's tomorrow and on Earth, then it is timelike separated from (t0,0). But the chain's present event is spacelike separated from both. The fatalist still argues that because it is real for the chain, it must be real in an absolute sense.

  But the open future advocate can still make the same response: simultaneity is frame-dependent and does not determine ontology.

  Conclusion:
  In the setup with one hop to Andromeda at 30 km/s, we get a shift of 250 years. So any event on Earth within the next 250 years is already real for that Andromeda observer. We choose an event E on Earth in 100 years. That event is spacelike separated from the Andromeda observer's present, and it is inside the future light cone of the starting event on Earth.

  If we drop the constraint and use high speeds and many relays, we can make the shift arbitrarily large, such that even an event tomorrow on Earth is real for the chain. However, the core of the debate remains: does the relativity of simultaneity force a block universe and fatalism? The open future advocate denies this by rejecting the ontological significance of distant simultaneity.
