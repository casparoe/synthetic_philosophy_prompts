  Fatalist conclusion: The Rietdijk-Putnam argument, in this instance, shows that an event on Earth that occurs 100 years in the future (according to Earth's frame) is just as real at the present moment (t0) as any other event because it lies on the plane of simultaneity of the Andromeda observer. Since special relativity treats all inertial frames equally, the block universe view holds that the future event is fixed and real.

  Response from an open future advocate without denying special relativity: The open future advocate can say that the relativity of simultaneity does not imply ontological fatalism. They may hold that the block universe is a useful geometric representation for calculations but does not reflect the open nature of the future. They might argue that the planes of simultaneity are merely conventions for synchronization and do not define what is real. What is real is the set of events that are causally accessible, and the future is still open. Additionally, they might point out that the event E is inside the future light cone of the starting event on Earth, so it is not yet determined at (t0,0) and can be influenced by decisions made after t0.

  The feature doing the work: The vast distance to Andromeda combined with the relative motion. The large distance amplifies the small (v/c) factor to a significant time shift.

