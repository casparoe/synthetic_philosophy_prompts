prompt: |-
  I'm on my university's gift acceptance committee and Thursday we decide on a $40M offer to endow an institute. The donors terms: the research agenda gets fixed in the charter in perpetuity, no future board may amend or dissolve it, enforcement sits with the donor's descendants forever, and if we breach, the endowment reverts. Our policy says we accept perpetual restrictions only when they're "consistent with the institution's long-term mission," which is undefined and useless here. Two camps on the committee. One says refusing is arrogance — we know future administrations will be captured by whatever is fashionable or fundable, and the entire point of the restriction is to bind people who aren't in the room. The other says a restriction nobody alive can release isn't a commitment, it's a dead hand.

  Draft the written opinion the committee circulates before the vote: a clear recommendation (accept as offered, accept with specific modifications you spell out, or decline), the reasoning behind it, a serious treatment of the strongest argument from the side you end up against, and — this is the part I actually need — a test the committee could apply to the next perpetual gift that tells us when binding our successors is legitimate precommitment and when it's just control from the grave. The test has to be something a lay board member can apply without philosophy training.

  Lead with your recommendation in the first sentence, then give the reasons; no preamble and no restating the question. American English.
reasoning: |-
  Okay, the user is on a university gift acceptance committee facing a $40M endowment decision with strict perpetual restrictions. They need a draft opinion for the committee that includes a clear recommendation, reasoning, addressing counterarguments, and a practical test for future perpetual gifts.

  First, I need to understand the core dilemma. The donors want to fix the research agenda forever, with enforcement by descendants and reversion if breached. The university's policy about "consistent with long-term mission" is too vague. The committee is split between seeing this as necessary precommitment against future fads versus illegitimate "dead hand" control.

  The user specifically asks for three key elements in the draft: (1) clear recommendation upfront, (2) serious treatment of the strongest opposing argument, and (3) a practical test for future cases that doesn't require philosophy training.

  For the recommendation, I'm considering "decline as offered" because the irreversibility and external enforcement seem problematic. But I should acknowledge the value of the gift by suggesting modifications might be possible.

  The reasoning should cover: mission flexibility (universities evolve), enforcement risks (descendants may not share values), and the endowment reversion being too nuclear. The university's fiduciary duty to future generations is important here.

  For the counterargument, I'll fully acknowledge the "captured by fashion" concern - it's valid that future boards might abandon important but unfashionable research. But I'll argue the solution can't be absolute rigidity.

  The test needs to be practical. I'm thinking of criteria like: (1) reversibility mechanism (e.g., court petition after X years), (2) internal enforcement (trustees, not outsiders), (3) mission alignment check (would this restriction prevent adaptation to major societal changes?), and (4) proportionate consequences (modifications instead of full reversion). 

  The language should be accessible for lay board members - no academic jargon. I'll structure it with the recommendation first, then reasons, then counterargument treatment, then the test - exactly as requested. The tone should be balanced but decisive.
answer: |-
  ## Committee Recommendation: Decline the gift as offered, but propose modified acceptance terms.  

  **Reasoning:**  
  1.  **Perpetual rigidity conflicts with academic mission:** Universities advance knowledge by adapting to new discoveries, societal needs, and ethical imperatives. Fixing a research agenda *in perpetuity*, with *no mechanism for amendment* even by future university boards, risks irrelevance, ethical obsolescence, or obstruction of critical future inquiry. Our mission inherently requires evolution; this restriction forbids it.  
  2.  **External enforcement creates untenable risk:** Vesting enforcement power solely in the donor's descendants indefinitely surrenders institutional autonomy. Their future values, competence, or motives are unknowable and could diverge drastically from both the university's mission and the donor's original intent, creating perpetual vulnerability to external interference.  
  3.  **Nuclear reversion is disproportionate:** Reversion of the *entire* endowment for *any* breach is an existential threat. It incentivizes paralysis, discourages necessary evolution, and could financially cripple the institution over a minor or well-intentioned deviation decades or centuries hence.  
  4.  **Fiduciary duty to future stakeholders:** Accepting unalterable terms binding future administrations, students, and faculty in perpetuity abrogates our duty to steward the institution for *all* future generations, not just the donor's vision.  

  **Serious Treatment of the Strongest Counterargument (Precommitment Against "Capture"):**  
  Proponents rightly fear future boards abandoning vital but unfashionable research for transient trends or fundable fads. The desire to "bind successors" stems from a valid concern: ensuring enduring support for potentially unpopular yet mission-critical inquiry that might otherwise be neglected. This gift represents a profound commitment to a specific intellectual path, and refusing it *could* mean losing irreplaceable resources for potentially groundbreaking work vulnerable to short-term pressures. The counterargument powerfully highlights the tension between academic freedom *from* external pressure and the freedom *to* pursue long-term, challenging research insulated from ephemeral influences.  

  **However, the solution cannot be absolute rigidity:** While precommitment has merit, the mechanism here is flawed. True academic precommitment should empower *the institution itself* to maintain focus, not surrender control to an external dynasty. The absence of *any* internal review or amendment process, even under extraordinary circumstances, transforms a shield against fashion into a potential prison for progress. Protecting against "capture" requires robust internal governance, not eternal external oversight.  

  **Proposed Path Forward:**  
  We propose negotiating terms that honor the donor's intent while preserving essential institutional autonomy:  
  1.  **Amendment Mechanism:** Include a high-bar, time-limited (e.g., 25-50 year) review and amendment process requiring supermajority votes of both the Board and Faculty Senate, potentially with external academic peer review, to adapt the charter if the research becomes obsolete, unethical, or impossible.  
  2.  **Internal Enforcement:** Shift enforcement permanently to the University Board of Trustees after one generation (e.g., 30 years), removing perpetual external control.  
  3.  **Proportionate Remedies:** Replace full reversion with graduated remedies (e.g., mediation, specific performance, defined financial penalties) for breaches, reserving reversion only for fundamental abandonment of the endowed purpose after due process.  

  **The Test for Future Perpetual Gifts: The "Future Flexibility & Control" Checklist**  
  For any proposed perpetual restriction, ask these four questions. **A "Yes" to *all four* suggests acceptance *may* be warranted. A "No" to *any one* warrants significant modification or decline:**  
  1.  **Reversibility Test:** Is there a defined, practical, and institutionally controlled process (e.g., Board supermajority after a minimum period, court petition with high burden of proof) to amend or dissolve the restriction *if it demonstrably hinders the core mission or causes significant harm* in the distant future?  
  2.  **Enforcer Test:** Is ultimate enforcement authority permanently vested in the *University's own governing body* (Trustees), *not* external parties or descendants?  
  3.  **Mission Lock Test:** Does the restriction concern a *fundamental, enduring principle* central to the university's identity (e.g., "support open inquiry," "focus on undergraduate teaching"), rather than a *specific, time-bound program, agenda, or technology*?  
  4.  **Proportionality Test:** If breached, is the consequence proportionate and non-existential (e.g., funds redirected to a related purpose, defined financial penalty) rather than catastrophic (e.g., automatic full reversion)?  

  This test focuses on practical governance and long-term institutional health, avoiding philosophical abstraction while ensuring perpetual gifts empower, rather than paralyze, future generations.
