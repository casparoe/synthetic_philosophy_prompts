  **The Toast**

  [Raise glass, make eye contact around the room, lingering on your father]
  Right then. Lunch is nearly here, and before we tuck in, it’s only right we raise a glass to the man of the hour. Happy eighty-fourth, Dad. Eighty-four years. That’s no mean feat, is it? And look around you – family, dear friends, faces that mean the world. A proper gathering. Good food, good company. And I know you’re enjoying that, Dad. That bit of cake earlier, the cup of tea just right… simple pleasures, but important ones. Seeing you relish them means a lot.

  We’re here because of you. Because of the life you’ve built, the connections you’ve made that last. Seeing Aunt Joan here, ninety-one and sharp as ever – that speaks volumes. And colleagues, mates from the firm. Forty years, wasn’t it? Designing for the long haul. You lot knew him when he was wrestling with load paths and deflection limits, worrying about forces most of us wouldn’t see coming. He had to think about the structure’s whole life, didn’t he? Not just the sunshine and calm days, but the storms it might face decades later, long after the designer’s packed up his slide rule. Provision for the unforeseen. Making sure it could stand, whatever came. That was the job. Thorough. Careful. Looking ahead, even when the specifics were foggy. That clear-sighted care… that sticks with people. It’s why they’re here today. It’s why *we’re* here.

  And family. You built this too, Dad. This lot. [Gesture to brother, families, aunt] The foundations you laid. The love, the occasional stubbornness – [smile] – the quiet support. You showed up. You were there. Even when things got complicated, even when the path wasn’t straight. You found ways to be present. And you still are. Right here. Enjoying the buzz, the chat, maybe losing the thread now and then – who doesn’t? – but *here*. With us. The affection you show, the smile when someone walks in… that’s real. That’s you. Now. Today.

  So much of what matters is right here in this room. The warmth of connection. The comfort of familiar faces. The taste of a decent lunch! These things endure. They’re the constants. And seeing you find pleasure in them now, Dad, is a gift. It reminds us what matters. The everyday kindness. The shared moment. The feeling of being amongst your own.

  We carry forward what you gave us – that instinct for care, for looking out, for building something meant to last. For thinking beyond the immediate horizon. Your signature endures, Dad, in the lives you shaped and the respect you earned. In the structures, physical and otherwise, that bear your mark. You’re part of the fabric of this family, this gathering, right now. Not a memory, not a blueprint, but the man sitting here, enjoying his party.

  So let’s raise our glasses. To Dad. To eighty-four years of being Alan [Use his name]. To his presence here with us today. To the connections he forged that bring us together. To the simple joys he finds, and to the profound legacy of care he built into everything. Happy birthday, Dad. Cheers!

