prompt: |-
  I'm drafting a blog post about why pushback over just-so stories keeps getting aimed at evolutionary psychology, and a friend of mine (very confident, gets alot of this from podcasts) sent me his summary of the Gould and Lewontin spandrels paper so I could quote it in the piece. Here it is:

  "Gould and Lewontin's 1979 spandrels paper argued that a lot of what looks like an adaptation is really just a byproduct of building an organism at all, and they named these byproducts spandrels after the triangular spaces between the arches of St Mark's in Venice, which the builders were pretty much forced to fill in with mosaics. Their bigger claim was that most traits in any organism are spandrels rather than adaptations, because giving a body any particular shape automatically throws off a bunch of incidental features alongside the useful ones. They were also trying to rescue Darwin from his own followers: adaptationists had turned natural selection into something like a theology where every feature gets a purpose assigned to it after the fact, Voltaire's Dr. Pangloss and his noses-made-for-spectacles. That paper is also where the term exaptation comes from, meaning a spandrel that later gets recruited for a job, like feathers that started out doing something else entirely and ended up powering flight. So the upshot is that adaptationism is basically untestable, and if you're wondering whether something like the human chin or our taste for music is an adaptation, the default answer should be no, it's a spandrel until somebody proves otherwise."

  Half of me suspects he's overreaching, mainly because a paper criticizing a research program doesnt sound like a paper that established most traits are byproducts, but I couldn't tell you where he's actually off. Give me exactly five numbered items, one for each sentence of his paragraph in order, each a sentence or two long, saying whether that sentence is accurate, a fair simplification, or a straight-up misreading, and where it fails, what the accurate version is instead. For the exaptation sentence, also tell me which term I should be using in my own post. No introduction and no wrap-up, just the five items. American English please.
reasoning: |-
  Hmm, the user is drafting a blog post about criticism against evolutionary psychology, specifically focusing on pushback related to just-so stories. Their friend sent a summary of Gould and Lewontin's spandrels paper to quote, but the user suspects it might have inaccuracies. They want me to evaluate each sentence of this summary with exactly five numbered items, one per sentence, indicating whether it's accurate, a fair simplification, or a misreading. I need to provide corrections where necessary and clarify the exaptation term.

  Looking at the first sentence: "Gould and Lewontin's 1979 spandrels paper argued that a lot of what looks like an adaptation is really just a byproduct of building an organism at all, and they named these byproducts spandrels after the triangular spaces between the arches of St Mark's in Venice..." This is fair. The paper did use architectural spandrels as a metaphor for biological byproducts, and the core idea about non-adaptive traits is correct. I'll note it as accurate with a slight nuance about the metaphor.

  The second sentence claims: "Their bigger claim was that most traits in any organism are spandrels rather than adaptations..." This is a misreading. Gould and Lewontin criticized the overemphasis on adaptationism but didn't assert that most traits are spandrels. They argued against assuming everything is adaptive without evidence. I'll correct this by emphasizing their critique of methodology rather than making quantitative claims.

  For the third sentence: "They were also trying to rescue Darwin from his own followers: adaptationists had turned natural selection into something like a theology..." This is a fair simplification. The paper did criticize the "Panglossian" adaptationist program and linked it to Voltaire's satire. While they weren't literally "rescuing Darwin," the theological comparison is valid for the extreme adaptationist views they opposed.

  The fourth sentence says: "That paper is also where the term exaptation comes from, meaning a spandrel that later gets recruited for a job..." This is inaccurate. Exaptation was introduced later by Gould and Vrba in 1982, not in the spandrels paper. The spandrels paper discusses co-optation of features, but exaptation is a distinct term. I'll clarify this and recommend using "exaptation" only for its actual origin, noting that feathers are a classic example but weren't in the original paper.

  The final sentence claims: "So the upshot is that adaptationism is basically untestable, and if you're wondering whether something... is an adaptation, the default answer should be no, it's a spandrel..." This is a misreading. Gould and Lewontin argued that adaptationist hypotheses can be untestable if not rigorous, not that the entire approach is invalid. They advocated for considering alternatives like spandrels, but didn't propose a default "no" to adaptation. I'll correct this to reflect their call for pluralism in evolutionary explanations.

  I'll structure my response as five numbered items corresponding to each sentence, keeping each concise with a verdict and correction where needed. For the exaptation part, I'll specify the accurate term usage for the user's blog post. No introduction or wrap-up needed—just straight to the points in American English.
answer: |-
  Here are five numbered items evaluating each sentence of your friend's summary:

  1.  **Accurate simplification:** The core claim about spandrels as necessary byproducts (using the architectural metaphor correctly) and contrasting them with direct adaptations is correctly captured. The phrasing "a lot of what looks like an adaptation" reflects their central argument against assuming adaptation first.
  2.  **Misreading:** Gould and Lewontin **did not claim most traits are spandrels.** Their argument was against the *assumption* that most traits *are* adaptations, not the assertion that most *are* spandrels. They advocated considering spandrels (and other alternatives like developmental constraints) as plausible explanations, challenging the adaptationist default, but did not make a quantitative claim about prevalence.
  3.  **Fair simplification:** The comparison to Panglossian adaptationism and the critique of the adaptationist program as overly teleological ("theology") is faithful to the paper's central criticism. While "rescue Darwin" is slightly hyperbolic, their intent to contrast their view with extreme adaptationism claiming Darwin's mantle is correct.
  4.  **Inaccurate:** The term **exaptation was *not* introduced in the 1979 spandrels paper.** Gould and Vrba coined "exaptation" in a separate 1982 paper. The spandrels paper uses the concept of "co-optation" (features originally built for one reason or as spandrels being used for a different purpose later) and discusses the *feather example* as an illustration of this concept, but does not use the word "exaptation". **Use "exaptation"** for your post, but attribute it correctly to Gould & Vrba (1982). The feather example accurately illustrates exaptation, even if cited early.
  5.  **Misreading:** Gould and Lewontin argued that *uncritical* adaptationism often leads to **untestable "just-so stories"**, not that adaptationism *as a whole* is untestable. They argued for methodological rigor and consideration of alternatives, but did not declare the *default* answer for any trait should be "spandrel". Their point was the *burden of proof* lies on adaptationists to demonstrate adaptation, not that traits are spandrels until proven otherwise; they simply argued spandrels are a viable alternative hypothesis that needs consideration.
