answer: |-
  ## Dialogue: Consent Form Consultation

  **Characters:**  
  - **Dr. Aris Thorne** (Continuity Advocate)  
  - **Dr. Lin Voss** (Realizer Theorist)  

  **Setting:** A conference room at the neuroscience institute.  

  **Thorne:** Lin, let’s address the consent form directly. The endpoint is Nadia. Not a successor, not an imitator. Her identity persists because the *informational-causal thread* is unbroken. Every synthetic unit is calibrated in real-time against her own neural activity during the shadow window, integrating seamlessly. The rollback provision merely underscores that there’s no functional discontinuity—each step preserves her cognitive trajectory. Pseudorandom order prevents localized disruptions, but the key is the *global continuity* of the process.  

  **Voss:** Aris, continuity of function isn’t continuity of being. Each handover silences a biological neuron—a concrete physical realizer of Nadia’s current state—and activates a synthetic proxy. The shadow window’s calibration is impressive engineering, but it doesn’t change the ontological fact: the biological neuron *was* realizing part of Nadia’s conscious field. Switching it off extinguishes that particular contributor to her identity. Do this billions of times, and you’ve replaced the subject, however smoothly.  

  **Thorne:** "Extinguish" is doing heavy work here. What does it mean? The neuron’s output is silenced, yes, but its functional role—its precise contribution to Nadia’s cognition—is *instantaneously maintained* by the synthetic unit. If causal role persistence is what matters, as your functionalism should grant, identity survives. Otherwise, you make ordinary metabolic turnover fatal—cells die and are replaced constantly without killing us!  

  **Voss:** Molecular turnover doesn’t extinguish the realizing *locus*. A liver cell isn’t a bearer of subjective experience; a neuron plausibly is. When you permanently silence it, you terminate its specific realization of phenomenal properties. The synthetic unit is a *different* realizer, albeit functionally isomorphic. Rollback proves this: reinstating the biological neuron within six hours restores the *original* realizer. The shadow window lets you match functions, not preserve token identity.  

  **Thorne:** But rollback is a red herring. In the *actual* timeline where it’s not invoked, the information seamlessly transitions. The neuron’s state is functionally mirrored *before* handover—it's not destroyed; its causal influence is inherited. Pseudorandom order ensures no subsystem loses its character before the whole network adapts. This is gradual *preservation*, not replacement-by-parts.  

  **Voss:** Gradualness is psychologically compelling, but metaphysically inert. Consider: if I slowly swapped every plank of the Ship of Theseus while you sailed, you’d feel aboard the same ship. But if I stored the discarded planks and reassembled *them* later, you’d face two claimants. Rollback is like storing the planks—it highlights that the original realizers persist and could, in principle, resume their role. Each silenced neuron is a discarded plank.  

  **Thorne:** Conceded: if rollback were used late in the process, restoring a critical mass of biological neurons, we *might* face ambiguity—two continuers. But in the protocol’s *actual* linear path, with rollback unused, there’s no branching. Only one thread carries forward. Your "plank" analogy fails because neurons aren’t discrete identity-bearers; the mind is an emergent pattern. Disrupting one element doesn’t kill the pattern if its structure is dynamically sustained.  

  **Voss:** Then we disagree on the locus of realization. You see the pattern as primary; I see the realizing substrate as essential. The shadow window’s calibration ensures functional fidelity but doesn’t transfer the *token* realization of Nadia’s current mental state to the new unit. Each handover is a micro-death. The consent form should say "a person who will remember being Nadia" because literal survival isn’t guaranteed—only causal inheritance is.  

  **Thorne:** And I maintain that causal inheritance *is* survival when uncontested and unbranched. The consent form should say "Nadia" because it *is* her—just as you’re still you after breakfast metabolizes yesterday’s neurons. The disagreement hinges on whether identity requires continuous physical realization or continuous informational flow.  

  **Voss:** Precisely. And since the form must be literal, we must err where realization is disputed. "Remembers being" captures the certainty without the ontological commitment.  

  *(Word count: 792)*  

  ---

  **Epistemic Note (118 words):**  

  **Broad Agreement:**  
  - Gradual replacement scenarios are the hardest test for non-continuity theories.  
  - Functional continuity is necessary (but not universally agreed sufficient) for personal identity.  

  **Genuinely Contested:**  
  - Whether functional continuity alone suffices for identity absent physical continuity (Thorne’s view).  
  - Whether neurons are "realizers" of identity in a way inert cells aren’t (Voss’s core claim).  

  **Idiosyncratic:**  
  - Voss’s "micro-death per neuron" is niche; most realizationists worry about bulk replacement, not unit-by-unit. Thorne’s dismissal of rollback’s significance is also uncommon—many see it as revealing indeterminacy.  
  - **Your Protocol:** Correctly described. Shadowing/calibration is novel; most thought experiments assume pre-matched units. Rollback is your unique contribution, making branching salient. Pseudorandom order avoids regional thresholds, but few philosophers see regionalism as decisive.
