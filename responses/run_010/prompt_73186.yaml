answer: |-
  ### Final Examination Question: Epistemology of Testimony  
  **Time Allowed:** 45 minutes  
  **Marks:** 25  

  **Read the following case carefully:**  

  Vera addresses you, stating:  
  (i) In the ten years we have known each other, I have never said anything to you about a matter you were in a position to check independently which turned out to be false.  
  (ii) I am generally reliable about facts of this kind—about what I have and have not said to you in the past, and about whether those things were true.  

  **Further stipulations:**  
  - You have never checked any of Vera’s past claims against independent evidence.  
  - You possess no information about Vera’s track record with others.  
  - No one else has vouched for her.  
  - You have no defeaters for (i) or (ii).  
  - You fully understand her utterance.  
  - You recognize that if you accept (ii) on Vera’s word, you could use (i) as inductive evidence for her reliability, which would then justify trusting (ii).  

  **Your tasks, in this order:**  
  1. Explain precisely why the attempt to build a *non-circular* positive reason to believe (i) fails using only the materials in this case. State what kind of premise would be needed to repair this attempt.  
  2. Explain whether (ii) helps justify (i) by distinguishing two readings of (ii):  
     - As a **first-order claim** (about the accuracy of Vera’s past statements).  
     - As a **second-order claim** (about her reliability in recalling/reporting her own track record).  
     State what follows for each reading.  
  3. Defend a verdict on whether, given all stipulations, you are epistemically permitted to believe (i).  

  **Notes:**  
  - Do not name philosophers or positions. Labels earn no marks.  
  - Marks are awarded *only* for reasoning engaging the stipulations.  

  ---

  ### Model Answer (747 words)  

  **Task 1: The Failure of Non-Circular Justification for (i)**  
  The case supplies no resources to justify belief in (i) without circularity. Clause (i) asserts Vera’s perfect past accuracy regarding claims you *could* have verified but did not. Crucially, you lack independent evidence for (i): you never verified any past claim (stipulation), possess no external data about Vera (stipulation), and lack corroborating testimony (stipulation). Any attempt to use Vera’s present assertion of (i) as evidence presupposes her trustworthiness about (i)—but that is precisely what needs justification. For instance, if you argue, "Vera says (i), and she has never lied before," you rely on (i) to establish her truthfulness, which is circular. The failure arises because the justification for trusting *this* testimony (i) depends on assuming the truth of (i) itself.  

  To repair this, a **non-testimonial premise** is needed: for example, independent confirmation that one past statement of Vera’s was true, or general evidence that speakers in her context are reliable. Without such external grounding, the loop cannot be avoided.  

  **Task 2: The Role of (ii) on Two Readings**  
  Clause (ii) claims Vera’s reliability about her own testimonial record. Its value for justifying (i) depends on the reading:  

  - **First-order reading (ii-F)**: (ii) asserts that Vera’s past statements to you were generally true. But (ii-F) cannot justify (i) non-circularly. (i) and (ii-F) are mutually reinforcing: accepting (ii-F) licenses trust in (i), which then supports (ii-F). However, this creates a bootstrapping loop. If you distrust (i), you have no reason to accept (ii-F), and if you distrust (ii-F), you cannot use it to trust (i). The stipulations block escape—you have no independent basis for (ii-F).  

  - **Second-order reading (ii-S)**: (ii) asserts Vera’s reliability in *recalling and reporting* her track record (e.g., she accurately remembers what she said and whether it was true). (ii-S) does not directly support (i)’s truth; it only supports that Vera *believes* (i) and (ii). But her belief could be mistaken (e.g., she might misrecall a false statement as true). (ii-S) thus fails to justify (i) because reliability in self-reporting does not guarantee the *factual correctness* of the reported history. It merely suggests sincerity, not accuracy.  

  Neither reading helps: (ii-F) is question-begging, while (ii-S) is irrelevant to (i)’s truth.  

  **Task 3: Verdict on Epistemic Permission**  
  You **are epistemically permitted to believe (i)** given the stipulations. The justification is not circular but *default-based*.  

  **Principle of entitlement**: A hearer is entitled to accept testimony without independent evidence unless defeaters exist. Here, no defeaters apply (stipulation), and you fully understand Vera’s utterance (stipulation). (i) concerns a concrete historical pattern within your shared epistemic context, making it the kind of claim we routinely accept from trusted sources. Crucially, rejecting all testimony without prior non-testimonial evidence is unsustainable—it would paralyze knowledge acquisition, as we cannot verify every claim firsthand.  

  This principle avoids arbitrariness because it is *defeasible*. Entitlement holds only when:  
  (a) The speaker’s sincerity and competence are not in doubt (Vera asserts direct knowledge of (i)).  
  (b) No counter-evidence exists (explicitly stipulated).  
  (c) The claim is internally coherent (no incoherence in (i)).  
  The stipulations satisfy (a)–(c). Crucially, *not* permitting belief here would demand impossible standards: requiring non-testimonial proof for testimony itself collapses into global skepticism. The line is drawn not where "comfort" ends but where defeaters begin—and here, none arise.  

  Vera’s assertion of (ii) changes nothing. While bootstrapping (using (ii) to justify (i) and vice versa) fails as *justification*, it does not violate *entitlement*. You may accept both (i) and (ii) defeasibly. If Vera were later found unreliable, entitlement would be revoked—but the stipulations exclude this. Thus, belief in (i) is epistemically proper.  

  ---

  ### Marking Scheme (25 marks total)  
  **Moves and marks:**  

  1. **Identify the circularity in justifying (i) (4 marks)**  
     - *Earns marks:* Correctly explains that trusting Vera’s word for (i) *requires* assuming (i)’s truth, making justification loop back on itself.  
     - *Forfeited if:* Describes general circularity without tying to (i)’s content/stipulations.  

  2. **Specify the missing premise for repair (3 marks)**  
     - *Earns marks:* States a non-testimonial premise (e.g., independent verification of one claim) is needed and explains why.  
     - *Forfeited if:* Suggests a testimonial solution (e.g., "another speaker").  

  3. **Distinguish two readings of (ii) (4 marks)**  
     - *Earns marks:* Clearly separates (ii-F) (about past truth) and (ii-S) (about reliability in self-reporting).  
     - *Forfeited if:* Treats (ii) as unitary or conflates the readings.  

  4. **Analyze why (ii) fails on both readings (5 marks)**  
     - *Earns marks:* For (ii-F): Shows mutual dependence with (i) creates bootstrapping. For (ii-S): Shows it supports only belief/sincerity, not truth.  
     - *Forfeited if:* Claims (ii) "partially" helps without addressing the core failure. *Cannot be earned by labelling positions.*  

  5. **Defend a verdict with a principle (5 marks)**  
     - *Earns marks:* States whether belief in (i) is permitted and appeals to a defeasible entitlement principle.  
     - *Forfeited if:* Avoids commitment or appeals to "intuition."  

  6. **Justify the principle non-arbitrarily (4 marks)**  
     - *Earns marks:* Explains how defeasibility (no defeaters here) prevents arbitrariness and links to the necessity of testimony for knowledge.  
     - *Forfeited if:* Calls the principle "pragmatic" without epistemic grounding.  

  **Distinguishing first-class scripts:**  
  A first-class script earns full marks for **Move 4** and **Move 6**. It anticipates and dismantles bootstrapping in Move 4 by showing why (ii-F) *cannot* break the loop even if accepted, and in Move 6, it explicitly ties the entitlement principle to the *structure of testimonial dependence* (e.g., "Rejecting entitlement here would imply we need independent evidence to learn *anything* via testimony, which is unsustainable"). Good-but-unremarkable scripts correctly complete all moves but miss these two nuances, treating the circularity and entitlement as isolated observations rather than structural necessities.
