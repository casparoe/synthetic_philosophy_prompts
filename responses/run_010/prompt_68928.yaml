prompt: |-
  writing group made up of historians and amateur forecasters, and i want something to read aloud at the end of the session. can you write a deadpan "rating methodology" document — say 600 words, numbered sections like a real criteria PDF — from an invented rating agency whose flagship product scores how much longer a political order will last? letter grades, outlook stable/negative, that whole register.

  the hook: the agency markets itself as nothing but the outside view — no expert judgement, just a base rate drawn from a reference class of comparable polities — but this particular note was commissioned by one paying client, a regime now entering it's fourth century that wants an upgrade, and every technical choice bends quietly toward them without ever admitting it. invent the reference class (a dozen or so polities with founding and end dates, no real history needed) and let the comedy be entirely methodological: how you individuate a polity (does a partition make two? does a restored regime count as continuing or new? is the class being padded or pruned to move the number), what a base rate from eleven comparables is actually worth, survivorship bias since only the dead ones can be scored end to end, selection on the dependent variable, and a "qualitative adjustment framework" that turns out to do all the work while the base rate gets demoted to a mere starting point. i'd also like the drafter to visibly fall for the client's own story of exceptionalism and describe that seduction in perfectly neutral technical language.

  include a short list of comparables that were excluded, with reasons that are visibly arbitrary, and a closing Limitations paragraph whose fee disclosure is so bland you have to read it twice. by the end the upgrade should have been granted, and the document should read as though that were the natural output of the numbers.

  no citations, no named authors, no real agencies or empires, and don't wink or explain the joke — someone who's read up on reference-class forecasting should spot every move, and someone who hasn't should still laugh at it as corporate boilerplate.
