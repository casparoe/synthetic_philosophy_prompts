prompt: |-
  I was arguing with a friend last night about superrationality — the Hofstadter version, where two players in a one-shot prisoner's dilemma who are both fully rational have to reason their way to the same move, so the only outcomes actually on the table are mutual cooperation and mutual defection, and between those two cooperation obviously wins. My friend says the whole thing is a parlour trick that no serious decision theorist buys, and that economics still teaches defection as the unique rational play because superrationality was never a proof to begin with. But I dont see what's non-provable about it: if the two of you are running the same correct reasoning procedure on the same problem, your outputs have to match. That's just logic, isn't it? There was also some bit in the original about extending the idea to strangers you'll never meet — he was thinking about deterrence and the Cold War, if I remember right — and honestly that part seemed even less convincing to me, but the two-person case feels airtight.

  So help me settle who's right. What I want to know, concretely: which steps in the argument are assumptions being smuggled in and which are actually derived, and whether my friend is right that game theorists are just ignoring a valid proof or whether there's an objection they have that I'm missing entirely. And the case I actually care about — I'm thinking of running a batch of anonymous one-shot prisoner's dilemmas on a platform, randomly matched strangers, no repeat play, no reputation — does the argument survive there, or does it quietly require that the players be identical reasoners with identical information, which random strangers obviously aren't? If it fails in that setting, is there anything left of it worth keeping, or should I just treat it as a curiosity? And if cooperation really can be the rational play for two ordinary non-identical people in a one-shot game, are there other routes to that conclusion that don't need this machinery, because I've heard people gesture at team reasoning and something Kantian but never gotten a straight answer.

  Act as a decision theorist who knows this literature cold and is perfectly willing to tell me I've got it wrong — don't soften it to be polite. Think the argument through carefully step by step before you respond, but only show me the finished answer, no scratch work. Start with a one-sentence bottom line on whether my premise holds, then the correction, then what survives of it. Hard cap: 450 words.
reasoning: |-
  Hmm, the user is asking about superrationality in the Prisoner's Dilemma, particularly Hofstadter's version. They had an argument with a friend who dismissed it as unserious, while they find the two-person case compelling. They want to know where assumptions are smuggled in, why economists reject it, and if it applies to anonymous one-shot games with random strangers.

  The core of Hofstadter's argument is that identical rational agents must reach the same decision. While logically coherent for identical reasoners, this smuggles in a massive assumption: that both players are running the exact same reasoning process with identical priors. Game theory typically assumes common knowledge of rationality but allows for different reasoning approaches. Hofstadter effectively redefines rationality to include symmetry, which traditional game theory doesn't accept.

  For anonymous one-shot games with random strangers, the superrationality argument collapses completely. Without knowing the other player is your identical cognitive twin, there's no basis to assume coordinated cooperation. The user seems skeptical about this extension themselves, rightly so.

  Alternative approaches like team reasoning or Kantian imperatives exist but require fundamentally different frameworks. Team reasoning asks players to optimize group payoff, while Kantian thinking considers universalizable actions. These don't rely on identical reasoning processes but involve shifting the objective function.

  The user should understand that superrationality remains a niche concept because its core assumption isn't standard in game theory. For their experiment, they should expect near-universal defection unless they prime cooperation through other means. The valuable insight that remains is how symmetry assumptions can change outcomes - useful for modeling identical AI systems but not human strangers.
answer: |-
  **Bottom line:** Your premise holds only under the specific, non-standard assumption that both players *know* they are identical reasoners using the same deterministic algorithm.

  **Correction:** The smuggled assumption is precisely that: **the players must *know* they are identical reasoners facing the same problem, guaranteeing identical outputs.** Standard game theory rejects this as unrealistic. Rationality doesn't imply identical reasoning *processes* or outputs absent this explicit, common knowledge of identity. Your "same correct reasoning procedure" *is* the assumption, not a derivation. Economists teach defection because without coordination mechanisms (repeated play, contracts, communication), a rational player, knowing the other *might* defect regardless of reasoning, *must* defect to avoid the sucker's payoff. Mutual defection is the unique Nash equilibrium.

  **What survives:**
  1.  **Identical Twins:** For *known* identical deterministic agents (e.g., cloned AIs), mutual cooperation *is* the logical outcome. Hofstadter highlighted this fascinating counterpoint to standard theory.
  2.  **Conceptual Insight:** It challenges the boundaries of individual rationality and shows how assumptions about opponent similarity affect outcomes.
  3.  **Alternatives:** For anonymous strangers, superrationality fails. However:
      *   **Team Reasoning:** Players adopt a "group perspective," choosing for mutual benefit. Requires a shift in agency.
      *   **Kantian Imperative:** "Cooperate only if you will that everyone in your situation cooperates." This is normative, not descriptive rational choice.
      *   **Evolutionary/Stochastic:** Cooperation can emerge in populations over time, but not rationally in a strict one-shot between strangers.

  **Your Experiment:** Expect near-total defection. Superrationality offers no basis for cooperation here. Any cooperation observed will stem from factors like altruism, confusion, or non-standard reasoning, not Hofstadter's logic. The machinery fundamentally requires known identical reasoning, absent in your setup. Treat the core idea as a curiosity about logical symmetry, not a practical guide for anonymous human interaction.
