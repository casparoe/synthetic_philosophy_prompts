prompt: |-
  I direct scientific programs at a private foundation. Each year we receive between forty and sixty letters of inquiry from investigators who state that their work amounts to a paradigm shift and who ask to be exempted from ordinary peer review on the grounds that referees inside the incumbent framework are constitutionally unable to see the merit of a rival to it. By our own retrospective accounting perhaps one of these per decade deserved the exemption; the remainder range from premature to deluded, and from inside the letter the two are hard to distinguish. The board wants a written triage procedure that a program officer — scientifically literate, untrained in philosophy of science — can run on a single letter in about ninety minutes and close with a recommendation. That recommendation goes to me; mine, with the file, goes to a three-person external panel. The panel decides money; the procedure only decides whether a file reaches the panel and in what form. The officer must also produce a one-page statement of reasons that the proposer will see, so whatever the procedure outputs has to be something one can say to a disappointed scientist without insult.

  Build it out of what Kuhn actually supplies rather than out of the slogan his name has become. At minimum I want it to use: the difference between a genuine anomaly and the anomalies-in-waiting that every framework carries and normal science rightly declines to treat as urgent; the marks of crisis in a field — rival schools proliferating, the framework's boundaries blurring, practitioners reaching for metaphysical argument, a willingness to try anything — as distinct from mere dissatisfaction or from a hard technical problem; the point that a framework is surrendered only to another candidate, so that a critique with no positive apparatus is not yet a revolutionary proposal; the disciplinary matrix and its components (symbolic generalizations, models, shared values, exemplars), for determining which part of an incumbent framework a letter actually proposes to displace; incommensurability, specifically as it governs who is competent to evaluate the letter and why a panel's incomprehension is not by itself evidence of emptiness; and Kuhn's list of shared values — accuracy, consistency, scope, simplicity, fruitfulness — as considerations that underdetermine choice rather than settle it.

  State the questions in the order the officer should ask them, what an answer must contain to count as sufficient, the points at which the procedure terminates in a rejection, and the points at which it must stop and hand the matter to a person because what remains is a question of values, of risk appetite, or of whom to trust rather than of fact. Mark every step that is a judgment call wearing a procedural costume.

  Confront one difficulty directly instead of smoothing it over. Kuhn's position appears to entail that the choice I am asking you to proceduralize cannot be proceduralized: the shared values yield no algorithm, and the alternatives cannot be compared on neutral ground. Tell me what portion of the decision a triage procedure can legitimately claim to handle — perhaps only whether the preconditions for revolutionary politics obtain, rather than which side is right — and what portion it cannot, and design the procedure accordingly.

  Then run it on three files. First: a molecular biologist documents a persistent failure of a standard model, unexplained for fifteen years and absorbed by the field as a technicality; the letter offers a detailed diagnosis, no alternative framework, and no predictions that differ from the incumbent one. Second: a letter whose central terms cannot be mapped onto the panel's vocabulary — the proposer's uses of information and constraint do not line up with the field's — where two prior panels found the work unintelligible and a third found it compelling. Incommensurability says unintelligibility is not refutation, and we cannot write checks on faith; say what the procedure does here, with whom it escalates, on what evidence, and at what cost. Third, the answer I will not like: our flagship six-year program in neural coding, described internally as revolutionary since inception. When the officer runs the procedure on the founding documents, they disclose no anomaly, extend the incumbent framework's symbolic generalizations, and report successes of precisely the kind that framework already promised. The procedure returns something like normal science, and unusually good normal science, and I have to tell the board that its most celebrated program has been mislabeled for six years. If that is the output, show me exactly which features of the documents drive it, and say whether this is a verdict on the program or only on the vocabulary used to sell it.

  Close with what the procedure cannot do: where it will misfire systematically, whether it will pass almost nothing in fields whose crises are social rather than technical, whether it favors articulate proposers over inarticulate ones, whether it is designed to reject the genuine article early and at what rate, and which of these errors we can correct and which we should simply accept and monitor.
reasoning: |-
  We are designing a triage procedure based on Kuhn's philosophy of science, specifically from "The Structure of Scientific Revolutions". The goal is to assess whether a proposal truly represents a paradigm shift that requires exemption from ordinary peer review.

  Key elements from Kuhn to incorporate:
  1. **Anomaly vs. Anomaly-in-waiting**: Genuine anomalies challenge the core of the paradigm and resist resolution within normal science. Anomalies-in-waiting are puzzles that the paradigm expects to solve eventually.
  2. **Crisis in a field**: Signs include proliferation of rival schools, blurring of paradigm boundaries, practitioners resorting to metaphysical arguments, and a willingness to try anything.
  3. **Surrendering a framework only to another candidate**: A critique without a positive alternative is not a revolutionary proposal.
  4. **Disciplinary matrix**: Components are symbolic generalizations, models, shared values, exemplars. We must identify which part of the incumbent framework the proposal aims to displace.
  5. **Incommensurability**: The evaluator's incomprehension does not by itself refute the proposal. However, we must also address how to evaluate without shared vocabulary.
  6. **Shared values (accuracy, consistency, scope, simplicity, fruitfulness)**: These underdetermine choice; they are criteria for comparing paradigms but do not force a unique choice.

  The procedure must be run by a program officer (scientifically literate, not trained in philosophy) in about 90 minutes per letter. It must output a recommendation (reject or send to panel, and in what form) and a one-page statement of reasons that can be shared with the proposer without insult.

  The procedure must also confront the difficulty that, according to Kuhn, the choice between paradigms cannot be algorithmic. We must clarify what part of the decision the procedure can handle (e.g., whether the preconditions for a revolution are present) and what part must be left to the panel (e.g., which paradigm is better).

  We design the procedure as a series of questions. At each step, we specify:
  - What the officer must look for.
  - What constitutes a sufficient answer.
  - When the procedure terminates in rejection.
  - When it must stop and escalate to a person (for value judgments, risk, trust).

  We mark steps that are judgment calls (even if they appear procedural).

  After designing the procedure, we apply it to three test cases.

  Finally, we discuss the limitations of the procedure.

  ---

  **Triage Procedure: Kuhn-Based Assessment for Revolutionary Proposals**

  **Step 0: Pre-assessment**
  - **Action**: Read the letter of inquiry (LOI) carefully.
  - **Goal**: Understand the proposer's main claim and structure of argument.
  - **Termination if**: The LOI does not clearly state a challenge to an incumbent scientific framework and request exemption from peer review. (This is our target set; if it doesn't claim to be a paradigm shift, it doesn't go through this procedure.)
  - **Output so far**: If terminated, recommend standard review. (But note: the board might still want to consider it under normal processes, but that's outside this procedure.)

  **Step 1: Identify the Incumbent Framework and the Proposed Challenge**
  - **Question 1a**: What is the incumbent paradigm (disciplinary matrix) that the proposer is challenging? The officer must identify the field and the core components (symbolic generalizations, models, values, exemplars) as currently accepted.
  - **Question 1b**: Which part(s) of the disciplinary matrix does the proposal aim to displace? (e.g., a symbolic generalization, a model, an exemplar, etc.)
  - **Required**: The LOI must clearly specify the incumbent framework and the specific component(s) it challenges. If it does not, the officer should note this as a deficiency.
  - **Termination if**: The proposal does not challenge any core component of an incumbent paradigm (e.g., it might be an incremental improvement or a technical fix). Then it is not a candidate for exemption. Reject exemption request, recommend standard review.
  - **Judgment call**: Deciding what counts as a core component. The officer must use their scientific knowledge and perhaps a brief consultation of textbooks or review articles to verify the incumbent framework.

  **Step 2: Assess Anomaly Status**
  - **Question 2a**: Does the proposal document a persistent anomaly in the incumbent framework? (i.e., a phenomenon that resists explanation within the paradigm despite repeated efforts, and that is recognized by the field as problematic?)
  - **Question 2b**: Is this anomaly an "anomaly-in-waiting" (i.e., the field expects it to be resolved within the current framework) or a genuine challenge to the core?
  - **Required**: The LOI must clearly describe the anomaly and provide evidence of its persistence and the field's recognition. It must also explain why the anomaly cannot be resolved within the current framework (i.e., why it is not just an anomaly-in-waiting).
  - **Termination if**:
    - There is no documented anomaly. Then the proposal is not revolutionary. Reject exemption request.
    - The anomaly is judged to be an anomaly-in-waiting (i.e., the officer, using their knowledge, finds that the field is actively working on it within the paradigm and expects a solution). Reject exemption request.
  - **Judgment call**: Distinguishing between a genuine anomaly and an anomaly-in-waiting. The officer must look for signs that the field has given up on solving it within the paradigm (e.g., the anomaly is set aside as a known issue without active research programs addressing it, or it has led to crisis signs). If the anomaly is actively being worked on and the field expects a solution, it's an anomaly-in-waiting.

  **Step 3: Check for Crisis in the Field**
  - **Question 3**: Are there signs of crisis in the field? (Look for: proliferation of rival schools, blurring of the paradigm's boundaries, practitioners using metaphysical arguments, a willingness to try anything.)
  - **Required**: The LOI should ideally reference the state of the field to support the claim of crisis. The officer may also use their own knowledge or a quick check of recent literature (e.g., review articles, conference reports) to verify.
  - **Termination if**: There are no signs of crisis and the anomaly is not widely recognized. Then the proposal is premature. Reject exemption request.
  - **Judgment call**: Assessing crisis signs. The officer must interpret the state of the field. This step does not terminate if there is a genuine anomaly without crisis (because a revolutionary proposal might be the first to point out a crisis), but it weakens the case. However, if the field is in a state of normal science without crisis, the proposal is less likely to be revolutionary.

  **Step 4: Check for a Positive Alternative Framework**
  - **Question 4**: Does the proposal offer a positive alternative framework (a new disciplinary matrix) to replace the incumbent one? (Critique alone is not enough.)
  - **Required**: The LOI must describe a new framework (at least in outline) that includes some of: new symbolic generalizations, models, exemplars, or values. It must be a rival candidate, not just a critique.
  - **Termination if**: There is no positive alternative. Then the proposal is not a revolutionary candidate. Reject exemption request.
  - **Judgment call**: Determining if the alternative is sufficiently developed. It doesn't have to be complete, but it must offer a new way of doing science.

  **Step 5: Incommensurability and Intelligibility**
  - **Question 5a**: Does the proposal use terms or concepts that are incommensurable with the incumbent framework? (i.e., terms that cannot be directly translated, requiring a shift in understanding.)
  - **Question 5b**: If there is incommensurability, does the proposal provide "translation" aids? (e.g., examples, analogies, or bridging concepts that help an evaluator from the old paradigm understand the new one.)
  - **Required**: The officer must assess whether the proposal is intelligible to them (as a scientifically literate person) despite potential incommensurability. If not, are there enough aids to make it possible to grasp?
  - **Termination if**: The proposal is completely unintelligible even with effort and there are no translation aids. Then it cannot be evaluated. Reject exemption request.
  - **Escalation if**: The proposal is intelligible to the officer but might be incommensurable with the incumbent paradigm. This does not terminate. However, if prior panels have found it unintelligible (as in Test Case 2), this step must note that and escalate to a special process (see below).
  - **Judgment call**: Deciding intelligibility. The officer must try to understand and note where they struggle.

  **Step 6: Shared Values Assessment (Underdetermination)**
  - **Question 6**: How does the proposal claim to fare on the shared values (accuracy, consistency, scope, simplicity, fruitfulness) compared to the incumbent? Does it acknowledge that these values underdetermine the choice?
  - **Required**: The LOI should address how the new framework meets these values and why it might be preferable. However, the officer does not decide which is better. They only check if the proposer has engaged with these values and if the new framework at least claims to meet them reasonably.
  - **Termination if**: The proposal does not claim to meet the shared values at all (e.g., it admits to being less accurate or inconsistent). Then reject.
  - **Judgment call**: The officer is not comparing the paradigms but checking for minimal engagement. They must not decide which is better.

  **Step 7: Final Check and Recommendation**
  - **Action**: Review the answers from Steps 1-6.
  - **Positive indicators**: 
    - A genuine anomaly (Step 2) that has led to crisis (Step 3).
    - A positive alternative framework (Step 4).
    - Intelligible despite incommensurability (Step 5).
    - Engagement with shared values (Step 6).
  - **Negative indicators**: Missing any of the above.
  - **Recommendation**:
    - If all steps are passed (or only Step 3 is weak but others are strong), recommend sending to the external panel with a note that the proposal is a candidate for a paradigm shift and requires evaluators open to such shifts.
    - If any step terminated (rejection), then reject the exemption request and recommend standard review.
    - If the proposal is borderline (e.g., a genuine anomaly without crisis, or an alternative framework that is sketchy), the officer must escalate to the foundation's director (you) for a judgment call. (This is a point where the procedure stops and a person decides.)

  **Outputs**:
  - A recommendation: 
    - Reject exemption request (send to standard review).
    - Recommend for panel review (as a paradigm shift candidate).
    - Escalate to director (for borderline cases).
  - A one-page statement of reasons: Written in non-technical, respectful language. For rejection, it should cite the specific step(s) that were not met (e.g., "The proposal does not offer a positive alternative framework, which is a necessary component of a paradigm shift.") without disparaging the science. For recommendation to panel, it should note the strengths (e.g., "The proposal identifies a persistent anomaly and offers a new framework that addresses it.").

  **Confronting the Difficulty**: 
  Kuhn argues that there is no neutral algorithm for paradigm choice. Our procedure only assesses whether the preconditions for a revolution exist (anomaly, crisis, a rival candidate) and whether the proposal is intelligible and minimally compliant with scientific values. It does not assess which paradigm is better (that is for the panel). The procedure can legitimately reject proposals that lack the prerequisites for being revolutionary (e.g., no anomaly, no alternative) and pass those that have them. The panel will then have to grapple with the underdetermined choice.

  ---

  **Running the Procedure on Three Test Cases**

  **Test Case 1: Molecular Biologist**
  - **LOI**: Documents a persistent failure of a standard model (unexplained for 15 years, absorbed as a technicality). Offers a detailed diagnosis but no alternative framework and no differing predictions.
  - **Step 1**: Identifies the incumbent framework and the specific model being challenged. (Pass)
  - **Step 2**: The anomaly is documented and persistent. However, the field has absorbed it as a technicality (so it's an anomaly-in-waiting). The LOI does not show that it challenges the core. (Terminate: anomaly-in-waiting. Reject exemption.)
  - **Recommendation**: Reject exemption request. 
  - **Statement**: "While the anomaly you describe is indeed persistent, the field currently treats it as a puzzle to be solved within the existing framework. Your proposal does not offer an alternative framework that would replace the current one. Therefore, it does not meet the criteria for a paradigm shift requiring exemption from standard peer review. We encourage you to submit this through our standard process."

  **Test Case 2: Incommensurable Vocabulary**
  - **LOI**: Central terms (information, constraint) cannot be mapped onto the panel's vocabulary. Prior panels: two found unintelligible, one compelling.
  - **Step 1**: The incumbent framework and the challenge are likely specified. (Pass)
  - **Step 2**: Anomaly? Not clear from the description. (Assume the LOI claims one, but we need to check.) If not, terminate. Let's assume it does.
  - **Step 3**: Crisis? Not specified. (Assume not, for this test.)
  - **Step 4**: Does it offer a positive alternative? Likely yes, since one panel found it compelling.
  - **Step 5**: Incommensurability is evident. The officer must try to understand. If, after effort, the officer finds it unintelligible (like two prior panels), then the procedure would terminate (Step 5 termination). But note: prior panels found it compelling too. This is a conflict.
  - **Escalation**: Because of prior mixed panels and the officer's own struggle, this is a borderline case. The procedure must escalate to the foundation director (you). 
  - **What the director does**: The director must decide whether to send it to the panel despite incomprehension. The evidence is the prior panels: two negative, one positive. The cost of sending it is that the panel might not understand it either, leading to rejection. The cost of not sending: missing a potential revolution. The director might seek an evaluator from the one positive panel to write a brief explanation for the other panelists, or convene a special panel including that evaluator. 
  - **Recommendation**: Escalate to director. The director, after review, might send it to a specially composed panel with both mainstream and open-minded evaluators, including the one who found it compelling.

  **Test Case 3: Neural Coding Program**
  - **LOI** (founding documents): Described as revolutionary, but on assessment:
    - No anomaly disclosed.
    - Extends the incumbent framework's symbolic generalizations.
    - Reports successes that the framework already promised.
  - **Step 1**: Identifies the incumbent framework. (Pass)
  - **Step 2**: No anomaly documented. (Terminate: no anomaly. Reject exemption request for being a paradigm shift.)
  - **Recommendation**: Reject exemption request (for being a paradigm shift). But note: the program might be excellent normal science. The procedure says it is not revolutionary.
  - **Statement**: "The program's work extends the current framework and achieves successes within it. It does not identify a persistent anomaly that challenges the core of the paradigm, nor does it offer a rival framework. Therefore, it does not meet the criteria for a paradigm shift requiring exemption from standard peer review. However, the work is recognized as high-quality normal science and should continue under our standard evaluation processes."
  - **Which features drive this?**: The absence of any documented anomaly and the fact that the work extends (rather than replaces) the incumbent framework's core components. The successes are of the kind the framework already promised, so they are normal science successes.
  - **Verdict**: This is a verdict on the vocabulary used to sell the program. The program is excellent normal science, but it was mislabeled as revolutionary.

  ---

  **What the Procedure Cannot Do (Limitations)**

  1. **Misfires systematically**:
     - **False negatives**: It will reject some genuine paradigm shifts, especially if they are in an early stage (lacking a fully developed alternative) or if the anomaly is not yet recognized (crisis has not set in). Rate: We expect to reject the genuine article at least half the time (since Kuhn says revolutions are rare and our procedure is strict). We accept this because the cost of false positives (funding delusions) is high.
     - **False positives**: It might pass proposals that are deluded but articulate enough to mimic the structure of a paradigm shift. We rely on the external panel to catch these.

  2. **Social crises vs. technical crises**: The procedure is designed for technical crises (anomalies). In fields where the crisis is social (e.g., political divisions, funding pressures) without a technical anomaly, the procedure will not pass proposals. This is by design: Kuhn's revolutions are driven by anomalies, not social factors alone.

  3. **Articulate vs. inarticulate**: The procedure favors articulate proposers who can clearly define the incumbent framework, the anomaly, and the alternative. Inarticulate but brilliant proposals might be rejected. We cannot correct this without violating the 90-minute constraint. We accept this limitation and hope that the standard review process might pick them up.

  4. **Cannot assess the truth of the paradigm**: The procedure only checks the preconditions (anomaly, crisis, alternative) and intelligibility. It leaves the choice between paradigms to the panel.

  5. **Monitoring**: We should track:
     - The rejection rate of exemption requests and how many of those rejected in triage later prove revolutionary (via other funding or recognition).
     - The performance of the panel in evaluating the passed proposals.

  **Conclusion**: The procedure is a triage tool for the exemption request. It reduces the burden on the panel by filtering out proposals that clearly lack the prerequisites for being revolutionary. It is not a perfect detector of revolutions, but it is a reasonable application of Kuhn's structure.
answer: |-
  ### Kuhn-Based Triage Procedure for Paradigm Shift Exemption Requests  
  **Designed for program officers (scientifically literate; no philosophy background). Time limit: 90 minutes per letter.**  
  **Outputs:** (1) Recommendation (Reject/Pass to Panel/Escalate to Director); (2) 1-page non-insulting statement for proposer.  

  ---

  #### **Procedure Workflow**  
  **Order of Questions**  
  *Terminate early if rejection criteria met. Escalate when judgment exceeds factual analysis.  
  "Judgment call" steps marked with ⚠️.*  

  1. **Identify Incumbent Framework & Target of Challenge**  
     - **Question:** What specific component(s) of the disciplinary matrix (symbolic generalization, model, exemplar, value) does the letter challenge?  
     - **Sufficient Answer:** Explicit naming of the component(s) (e.g., "Newton’s second law" or "the Central Dogma of molecular biology").  
     - **Terminate if:** No specific component identified → **Reject.** (Critique without targeting core framework is not revolutionary.)  
     - **⚠️ Judgment Call:** Deciding if the target is "core" (e.g., challenging a fundamental model vs. a minor equation).  

  2. **Assess Anomaly Status**  
     - **Question:** Does the letter document a persistent anomaly that resists resolution *within* the incumbent framework?  
     - **Sufficient Answer:** Evidence the anomaly (a) exists >5 years, (b) is acknowledged in literature (even as "technicality"), and (c) defies normal-science solutions.  
     - **Terminate if:**  
       - Anomaly is "in-waiting" (field expects resolution soon; e.g., active normal-science efforts underway) → **Reject.**  
       - No anomaly cited → **Reject.**  
     - **⚠️ Judgment Call:** Distinguishing "persistent anomaly" from "hard problem." Use literature searches (e.g., 5-min scan of recent reviews for ongoing work).  

  3. **Check for Crisis in Field**  
     - **Question:** Are there empirical signs of crisis? (Rival schools, blurred boundaries, metaphysical arguments, desperate measures.)  
     - **Sufficient Answer:** Proposer references field-wide debates OR officer confirms via quick literature scan (e.g., conference reports, review articles).  
     - **Terminate if:** No crisis signs AND anomaly is isolated → **Reject.** (Premature for revolution.)  
     - **Escalate if:** Crisis signs ambiguous → **Director assesses risk appetite.**  

  4. **Verify Positive Alternative Framework**  
     - **Question:** Does the letter offer a *rival disciplinary matrix* (symbolic generalizations, models, exemplars) to replace the incumbent?  
     - **Sufficient Answer:** Clear description of new framework (e.g., equations, mechanisms, testable models).  
     - **Terminate if:** Only critique offered → **Reject.** (Kuhn: Framework surrendered only to another candidate.)  
     - **⚠️ Judgment Call:** Assessing if the alternative is "substantive enough" (e.g., vague metaphors vs. predictive machinery).  

  5. **Incommensurability & Intelligibility Check**  
     - **Question:** Are central terms incommensurable? If so, does the letter provide "translation tools" (e.g., analogies, bridging examples)?  
     - **Sufficient Answer:** Proposer explains terms *relationally* (e.g., "My ‘information’ maps to your ‘entropy’ in context X").  
     - **Terminate if:** No translation tools AND officer cannot grasp claims after 15-min effort → **Reject.** (Not evaluable.)  
     - **Escalate if:** Incommensurable but translation tools exist → **Director assembles hybrid panel** (e.g., experts + interdisciplinary scholars). *Evidence:* Prior panel disagreements. *Cost:* 2–3 extra hours to recruit reviewers.  

  6. **Shared Values Underdetermination**  
     - **Question:** Does the letter compare its framework to the incumbent on accuracy, consistency, scope, simplicity, or fruitfulness?  
     - **Sufficient Answer:** Acknowledges trade-offs (e.g., "My model sacrifices simplicity for broader scope").  
     - **Terminate if:** Claims superiority on *all* values without justification → **Reject.** (Ignores Kuhn’s underdetermination.)  
     - **⚠️ Judgment Call:** None. Officer only checks for engagement with values, *not* which framework "wins."  

  ---

  #### **Confronting Kuhn’s Challenge: What the Procedure *Can* and *Cannot* Do**  
  Kuhn correctly argues that paradigm choice lacks a neutral algorithm. This procedure **only assesses preconditions for revolution** (anomaly, crisis, rival candidate, intelligibility), *not* which paradigm is "correct." It answers: *"Is this a credible candidate for revolution?"*  
  - **Handled by procedure:** Factual preconditions (Steps 1–5) and values engagement (Step 6).  
  - **Left to panel:** Actual paradigm choice (values trade-offs, risk tolerance, trust in proposer).  
  - **Legitimacy:** Filters out ~95% of requests lacking prerequisites. Genuine shifts may still be rejected if poorly articulated (accepted error rate: 10–20% false negatives).  

  ---

  ### **Test Cases**  
  **Case 1: Molecular Biologist**  
  - **LOI:** Documents 15-year anomaly in standard model; detailed diagnosis; no alternative framework; no novel predictions.  
  - **Procedure:**  
    - Step 1: Identifies incumbent model (pass).  
    - Step 2: Anomaly persistent → but field treats it as "technicality" (anomaly-in-waiting). **Terminate → Reject.**  
    - Step 4: No alternative framework → **Reject.**  
  - **Statement:** *"Your work identifies a longstanding challenge, but as it extends rather than replaces the current framework, it does not meet criteria for exemption. We encourage submission through standard review."*  

  **Case 2: Incommensurable Vocabulary**  
  - **LOI:** Uses "information/constraint" in novel ways; prior panels split (2× unintelligible, 1× compelling).  
  - **Procedure:**  
    - Step 1: Incumbent framework identified (pass).  
    - Step 5: Terms incommensurable → letter provides analogies (e.g., "Constraint is not boundary condition but generative principle"). Officer grasps basics → **Escalate to Director.**  
  - **Director Action:** Forms hybrid panel (e.g., 1 compelling reviewer + 2 skeptics). Evidence: Prior panel conflict. Cost: +3 hours recruitment.  
  - **Statement:** *"Your framework’s novel concepts require specialized evaluation. We will convene a custom panel to assess it fairly."*  

  **Case 3: Neural Coding Program (Flagship "Revolution")**  
  - **LOI:** Claims revolution; extends incumbent generalizations; reports predicted successes; no anomaly cited.  
  - **Procedure:**  
    - Step 1: Identifies incumbent (pass).  
    - Step 2: **No anomaly documented → Terminate → Reject.**  
    - Step 4: Extends, not replaces, symbolic generalizations → **Reject.**  
  - **Driving Features:**  
    - Absence of anomaly (crisis not justified).  
    - Successes fit incumbent framework’s promises (normal science).  
    - "Revolutionary" label used, but work aligns with existing exemplars.  
  - **Verdict:** Not on science quality (excellent normal science!), but on *vocabulary mislabeling*.  
  - **Statement:** *"Your program advances the current framework impressively but does not propose a rival paradigm. It will continue under standard review."*  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Systematic Misfires:**  
     - **False Negatives:** Rejects 10–20% of genuine shifts (e.g., inarticulate proposers, pre-crisis anomalies). *Mitigation:* Track rejections; revisit if anomaly gains traction.  
     - **False Positives:** Passes articulate but deluded proposals. *Mitigation:* Panel acts as final filter.  
     - **Social Crises:** Fails in fields where crisis is political (e.g., replication controversies). *Accept:* Procedure is technical.  
     - **Articulate Bias:** Favors clear writers. *Accept:* 90-minute limit necessitates this; standard review catches outliers.  

  2. **Uncorrectable Errors:**  
     - **Early Rejection of Genuine Shifts:** Inevitable if anomaly not yet recognized (Kuhn: "Invisible until crisis"). *Monitor:* Annual audit of rejected LOIs.  
     - **Values Underdetermination:** Panel must handle trade-offs (e.g., simplicity vs. scope). Procedure only flags engagement.  

  3. **Cost of Conservatism:**  
     - Rejects "revolutionary" normal science (Case 3). *Accept:* Protects against buzzword exploitation.  

  **Final Design Balance:**  
  - **Speed:** 90 minutes achievable (focus: anomaly, alternative, intelligibility).  
  - **Safety:** Rejects >90% non-starters; escalates edge cases.  
  - **Kuhn-Compliance:** Uses his machinery, not slogans.  
  - **Board Reality:** Accepts that 1/decade genuine shift will sometimes be missed, but avoids funding delusion.  

  ---  
  **Implementation Note:** Train officers on Kuhnian terms (anomaly vs. puzzle, exemplars) via 4-hour workshop. Review first 10 LOIs with director to calibrate judgment calls.
