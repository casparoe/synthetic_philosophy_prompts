  So: User wants window shut (always). Neighbors control fire. If they light fire, room gets dry but window stays shut (user won't open). Neighbors might not light fire at all to avoid dryness. But both prefer fire on + window shut over fire off + window shut. So neighbors might reluctantly light fire sometimes? But when it gets dry, they can't open window, so they might put fire out. Then house gets cold, both prefer fire on... but neighbors control fire, so cycle might still happen? Not sure.

