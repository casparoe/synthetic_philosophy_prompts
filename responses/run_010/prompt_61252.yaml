  Okay, the user presents a deeply philosophical debate about advance directives that they had with a friend. They've clearly thought about this extensively, given the detailed scenario and the structured request for analysis. 

  First, I need to unpack their core disagreement: the friend sees advance directives as privileging the "idealized" earlier self, while the user argues it's purely about decision-making capacity. The user wants this examined through specific parameters of idealization (information, vividness, reflection, coherence, standpoint). 

  Hmm, the user's frustration is palpable - they've clearly wrestled with this for some time. Their request is unusually precise, almost academic, yet rooted in a personal debate. I should avoid generic explanations and honor their sophisticated framing. 

  When analyzing the practice through their idealization parameters, it's striking how unevenly they apply: 
  - Information matters formally (consent requirements) but vividness is ignored - we never require people to experience dementia before refusing it
  - Reflection time is irrelevant legally - a quick competent decision trumps years of prior deliberation
  - Coherence checks are absent in revocation (a distressed "revoke it!" overrides a coherent directive)
  - Standpoint is fundamentally first-person in revocation but drifts toward third-person interpretation by surrogates later

  The institutional incoherence becomes obvious: we let terrified but competent selves instantly override calm prior directives, yet won't let contented demented selves override anything. Capacity is indeed the operational switch, not idealization. 

  For rival theoretical accounts:
  - Evidentialism fits revocation (current wishes trump documents) but clashes with binding directives
  - Persistence-of-self explains why we bind future selves but fails to explain easy revocation
  - Best-interests makes the prior self irrelevant except as evidence - which contradicts how we treat directives as binding

  No single theory explains all three features (easy revocation, binding directives, bedside reluctance). The practice is a Frankenstein's monster of compromises.

  If rebuilt consistently on idealization:
  - Revocation would require proving impaired reflection (monstrous - holding people to past choices)
  - Binding force would increase (no bedside overrides)
  - Surrogates would idealize more aggressively
  Result: dangerously paternalistic, denying present autonomy

  Verdict: The user is closer. The practice is capacity-based with idealization as occasional rhetoric. But the real argument is about whether legal institutions need theoretical purity - and the answer is no. This apparatus works precisely because it's theoretically messy, balancing autonomy at different temporal points. The friend's "idealized self" reading is elegant but doesn't survive contact with how the system actually functions.

  The emotional core here seems to be about respecting current selves versus past selves - but the law wisely avoids choosing sides absolutely. That tension is the point.
answer: |-
  Your analysis exposes a profound tension in the logic of advance directives. Using your framework, here's the reconstruction:

  **1. Parameters of Idealization in Practice:**  
  - **Information:** Formally required for valid directives (informed consent), but depth is assumed, not verified. Irrelevant for revocation (a terrified "stop" overrides prior informed choices).  
  - **Vividness:** Never required. No jurisdiction mandates experiencing dementia to refuse it.  
  - **Reflection:** Legally irrelevant. A directive drafted over years is voided by one unreflective sentence.  
  - **Coherence:** Only superficially considered. Surrogates *might* note contradictions, but revocation requires no coherence check.  
  - **Standpoint:** **Critical divergence:** Revocation is purely first-person ("I revoke now"). Surrogate decisions shift to third-person reconstruction ("what *she* would want").  

  The practice **cannot key on a single parameter** without strain. Revocation privileges present autonomy (ignoring all idealization). Directive enforcement and surrogacy *aspire* to idealization but lack consistent parameters. Bedside reluctance rejects *both* in favor of observed well-being. The strain *is* the point—the system prioritizes different values at different times.

  **2. What the Practice Presupposes vs. Fits With:**  
  - **Strict Presupposition:** Only that *capacity* creates binding authority. Revocation proves this: capacity trumps all else.  
  - **Comfortable Fits:**  
    - Evidentialism (directive as best proxy): Fits surrogate hierarchy but clashes with easy revocation (if the directive is just evidence, why let one sentence destroy it?).  
    - Persistence-of-self (earlier self binds later self): Fits binding directives but *contradicts* revocation (if the earlier self is "truly" the person, revocation while impaired shouldn't count).  
    - Best-interests (earlier self as data source): Fits bedside reluctance but invalidates directives as binding (they become mere welfare clues).  

  **No rival account licenses all three behaviors:**  
  - Evidentialism allows revocation and surrogate reconstruction but *undermines* binding force.  
  - Persistence-of-self allows binding directives but *forbids* revocation and bedside overrides.  
  - Best-interests allows bedside overrides but *rejects* the authority of prior wishes.  
  The practice **cannot distinguish** between these theories—it eclectically borrows elements, revealing its core is procedural (capacity) not substantive.

  **3. A Consistent Idealization-Based Scheme:**  
  - **Abolish:** Easy revocation. Revocation would require proving the *current* choice is *more* idealized (e.g., better informed, more vivid, coherent).  
  - **Extend:** Binding force. Directives could only be overridden if surrogates prove the prior self was *non*-idealized (e.g., misinformed, incoherent). Bedside reluctance would be illegitimate unless "contentment" proves prior wishes were *erroneous* about welfare.  
  - **Result:** **Monstrous in practice.** Competent individuals could be trapped by past choices ("You signed this at 30; you can't revoke while depressed at 70!"). Surrogates would adjudicate whose "self" is more "authentic," inviting paternalism. Autonomy would be proceduralized into oblivion.

  **Verdict:**  
  - **Your diagnosis is closer.** The operational engine *is* capacity. The friend's "idealized self" theory is a *post hoc* rationale for binding directives but collapses when confronted with revocation rules and bedside practice. The apparatus is incoherent because it elevates *present capacity* above all else while *simultaneously* trying to honor past autonomy—an unstable compromise.  
  - **The argument was really about:** **The necessity of theoretical coherence in law.** Your friend sees a philosophical foundation (idealized selves) justifying the system. You see a pragmatic institution that works *despite* theoretical contradictions because it prioritizes clear, bright-line rules (capacity assessments) over metaphysical consistency. The practice survives because it resolves real-world conflicts (e.g., respecting a terrified "no" now) at the cost of philosophical purity. Your disagreement reveals law's struggle to mediate between autonomy, welfare, and the fragmented self across time—without demanding answers to unresolvable questions about personal identity.
