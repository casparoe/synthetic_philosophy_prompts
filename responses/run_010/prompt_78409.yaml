prompt: |-
  so a friend of mine who does LLM evals for a living put up a blog post last week and there's this one section where she drags in some metaphysics to make a point about evals, and I can't tell if she's got it right. I took one intro metaphysics class four years ago so I know the words but not the debate. Here's her paragraph more or less as she wrote it (I'm typing it out, so any typos are mine):

  "Dispositions used to get analyzed as conditionals: for a glass to be fragile just is for it to be such that it would shatter if struck. That's still the default in textbooks. Martin's electro-fink killed it. A wire is genuinely disposed to conduct, but a device monitors it and, at the moment you touch it to the circuit, strips out the conductivity, so the conditional comes out false even though the disposition was there all along. Lewis patched this by requiring the disposition to stick around long enough to actually produce the effect. But then Johnston's masks break the patched version too, and this time there's no patch available: wrap a fragile glass in packing foam and it won't shatter when you drop it, even though it never lost its fragility for a second. The upshot is that dispositions are undetectable in principle -- no experiment can ever establish that something has one, because any failure to manifest can always be written off as a fink or a mask, and any success can always be written off as something else doing the work. Which is why metaphysicians mostly gave up both on the conditional analysis and on treating dispositions as real properties."

  Then she pivots to her actual topic and says evals have exactly this structure. Her mapping: a system prompt or a refusal guard bolted on at inference time is a mask -- the disposition is still sitting in the weights, the deployment config just blocks the manifestation -- whereas an RLHF-trained refusal is a fink, because the training changes what happens right at the trigger. So a failed safety eval doesn't show the absence of a disposition, and a passed one doesn't show its presence either. Her conclusion, which is the part I'm suspicious of: capability and safety evals don't measure anything about what a model is disposed to do, only about which config you happened to run, and people who say "this model is disposed to deceive / to comply / to hallucinate" are doing metaphysics and calling it measurement.

  Part of me thinks she's onto something, because I've definitely seen models pass an eval and then behave totally differently in prod and vice versa. But I also feel like she's coasting on the philosophy and that some of it is a bit too smooth. Could you go through it in order? First the metaphysics paragraph: which claims would someone who works on dispositions accept as-is, which are fair-enough simplifications, and which are actually wrong or overstated -- I'm especially unsure about "still the default," about whether masks really have no available fix, and about that last sentence on giving up on dispositions as real properties. Then do the same for the eval argument. And finally, separately: does her conclusion follow from the parts of the philosophy that survive? And is the mask/fink mapping onto system-prompt/RLHF even the right mapping, or does it cut the other way round -- like, is a trained refusal maybe not a fink at all?

  define any terms you need as you go, but don't water it down. no need to point me at papers or give me a reading list, I just want your read on it.
reasoning: |-
  Okay, let me unpack this user's query. They're asking about a friend's blog post that connects metaphysical concepts of dispositions to AI model evaluations. The user took an intro metaphysics class years ago, so they recognize terms but need help assessing the accuracy of the friend's arguments. Their core concern is whether the philosophical analogy holds and if the conclusion about evals being meaningless is valid.

  Hmm, the metaphysics part seems mostly correct but has some nuances. The conditional analysis of dispositions being "still the default in textbooks" might be overstated - while Martin's electro-fink and Johnston's masks are indeed classic counterexamples, contemporary metaphysics hasn't completely abandoned dispositions. The "undetectable in principle" claim is particularly strong - while finks and masks create real problems, calling dispositions fundamentally undetectable feels like an overreach. Many metaphysicians still treat dispositions as real properties, just with more sophisticated frameworks than simple conditionals.

  For the eval mapping... the friend's analogy is clever but imperfect. System prompts as masks works well since they suppress outputs without changing the model's underlying capabilities. But labeling RLHF-trained refusals as finks is shaky - unlike the electro-fink that removes conductivity precisely when triggered, RLHF alters the disposition permanently. The model isn't losing its capability at the moment of triggering; it's gained a new behavioral tendency. 

  The user's suspicion about the conclusion seems warranted. While evals are indeed configuration-dependent, that doesn't make them meaningless. We can still make conditional claims like "this model configuration displays X tendency under Y conditions." The friend's absolute conclusion throws out too much - it's like saying medical tests are useless because they only capture snapshots of health. 

  I should note where the friend is right though: evals absolutely can be gamed via configurations (masks) or training tricks (potential finks), and people often overstate what evals prove. But the philosophical analogy shouldn't be used to dismiss all eval validity. The mapping needs refinement, especially the fink part.

  The user seems analytically sharp - they're spotting the "too smooth" aspects of the argument. Their real need is probably to understand whether this philosophical framework actually supports radical skepticism about evals, or if it's being misapplied. They want ammunition for a nuanced debate with their friend, not just a simple agree/disagree.
answer: |-
  Here's a breakdown of the metaphysics, the mapping to evals, and the conclusion, separating accurate points from simplifications and overstatements:

  ### 1. The Metaphysics Paragraph: Breakdown
  *   **"Dispositions used to get analyzed as conditionals... That's still the default in textbooks."**
      *   **Fair-enough simplification.** The "Simple Conditional Analysis" (SCA: X is fragile iff *if* X were struck, *then* X would shatter) *was* the dominant view historically and *is* often the starting point in textbooks to introduce the problem. However, it's widely acknowledged as flawed by specialists *because* of counterexamples (like finks/masks). It's "default" only in an introductory sense, not as a view held by most active researchers.
  *   **Martin's electro-fink killed it... Lewis patched it... Johnston's masks break the patched version too..."**
      *   **Accept-as-is.** This is a standard, accurate recounting of key developments:
          *   **C.B. Martin (1994):** The electro-fink. A live wire is disposed to conduct electricity. But a device instantly *removes* that disposition the moment it's touched (making it non-conductive) and restores it afterward. The wire *was* disposed to conduct, but the conditional "if touched, it conducts" is false because it *didn't* conduct when touched (due to the fink).
          *   **David Lewis (1997):** Proposed a patch. A disposition exists only if it would manifest *and persist long enough* to cause the effect under the triggering condition. Solves the electro-fink (the disposition doesn't persist long enough to cause conduction).
          *   **Mark Johnston (1992):** The masking case. A fragile glass wrapped in packing foam. It *is* fragile (disposed to shatter if struck/dropped). But when you drop it, the foam *prevents* the manifestation (shattering). The conditional "if dropped, it shatters" is false, even though the disposition persists intact throughout.
      *   **"...and this time there's no patch available":**
      *   **Overstated simplification.** Masks *are* a severe problem for SCA and Lewis's patch. However, metaphysicians *didn't* just give up. Numerous alternative analyses emerged:
          *   **More complex conditionals:** Adding clauses about "ideal conditions" or "intrinsic bases".
          *   **Primitivism:** Dispositions are fundamental, unanalyzable properties.
          *   **Causal-role theories:** Dispositions are defined by their causal role in producing manifestations under stimuli.
          *   **Manifestation-independent powers:** Dispositions exist independently of their manifestation conditions.
          *   While *no single patch* gained universal acceptance as *the* solution, the field actively developed multiple sophisticated responses. Saying "no patch available" implies futility, but it's more accurate to say the *simple* conditional analysis was abandoned for richer frameworks.
  *   **"Dispositions are undetectable in principle... any failure to manifest can always be written off as a fink or a mask..."**
      *   **Overstated/Controversial.** Finks and masks *do* create a significant epistemological challenge: *How can we ever be sure a disposition is present if its non-manifestation can always be explained away?* This is a serious problem (the "Problem of Masking/Finking").
      *   However, claiming dispositions are *fundamentally undetectable in principle* is too strong. Many metaphysicians argue:
          *   We have good inductive grounds based on repeated manifestations under varied conditions.
          *   We can identify the underlying physical/structural "categorical basis" that grounds the disposition (e.g., molecular structure of glass).
          *   We can design controlled experiments minimizing the likelihood of finks/masks.
          *   While *absolute certainty* might be impossible (as with many things), *justified belief* based on evidence is achievable. The problem is epistemic difficulty, not fundamental undetectability.
  *   **"Which is why metaphysicians mostly gave up both on the conditional analysis and on treating dispositions as real properties."**
      *   **Half-right, half-wrong/simplified.**
          *   **Gave up on Simple Conditional Analysis:** **True.** SCA in its naive form is universally abandoned due to finks/masks.
          *   **Gave up on treating dispositions as real properties:** **False/Misleading.** While *some* philosophers (e.g., Humean skeptics) might deny the reality of dispositions/powers, *most contemporary metaphysicians engaged with this debate* **do** treat dispositions as real, irreducible, or grounded properties. They abandoned the *simple analysis*, not the *ontology*. The debate shifted *to how to understand them*, not *whether they exist*.

  ### 2. The Eval Argument & Mapping
  *   **System Prompt/Refusal Guard as a Mask:**
      *   **Strong Analogy.** This mapping is insightful and robust. The model's underlying capability/disposition (e.g., to generate harmful content, reveal private data) is present in the weights. The system prompt/guard acts like the foam around the glass – it *intervenes* to prevent the *manifestation* of that disposition in the output when the trigger (harmful query) occurs. The disposition remains intact ("never lost its fragility").
  *   **RLHF-trained Refusal as a Fink:**
      *   **Weaker/Questionable Analogy.** This mapping is less clear-cut:
          *   **Finks** involve the *disposition itself* being *removed exactly at the moment of triggering* and then *restored*. An RLHF-trained refusal fundamentally *alters the model's dispositions*. It's not that the harmful disposition is present and then instantly stripped away *only at the trigger moment*; the training has created a *new*, overriding disposition (to refuse harmful requests) that is *persistently present*.
          *   This looks more like **destroying the original disposition** (or at least suppressing it permanently) rather than *finking* it. A true "eval fink" might be more analogous to a very specific, inference-time adversarial intervention that *only* blocks *that specific query type* without changing the model's general disposition, but RLHF training usually has broader, persistent effects.
          *   **Alternative View:** RLHF refusal training might be better seen as creating a complex disposition where the harmful tendency is masked *by a newly acquired refusal tendency*. Or, it simply changes the model's intrinsic properties, eliminating the harmful disposition altogether in favor of a refusal disposition. Neither perfectly fits the "fink" model of temporary removal/restoration.
  *   **"Failed safety eval doesn't show absence... passed one doesn't show presence":**
      *   **Insightful Point (with caveats).** Drawing on the fink/mask problem, she correctly highlights a critical limitation of evals:
          *   A **failed** safety eval (model outputs harm) *could* mean the model lacks the safety disposition *or* that a mask/fink failed (e.g., guardrail bug, prompt injection).
          *   A **passed** safety eval (model refuses harm) *could* mean the model has the safety disposition *or* that a mask/fink is actively blocking the harmful disposition (e.g., a system prompt masking inherent harmfulness, RLHF acting as a fink/permanent alterer).
      *   This exposes the **config-dependence** of evals and the difficulty in attributing behaviors solely to the model's "core" weights vs. deployment artifacts.
  *   **"Capability and safety evals don't measure anything about what a model is disposed to do, only about which config you happened to run":**
      *   **Overstated/Misleading.** While evals *are* config-dependent and susceptible to masking/finking-like phenomena, this strong claim goes too far:
          *   Evals *do* measure the *dispositions of the specific system configuration tested*. A model+system prompt *has* the disposition to refuse harmful requests *in that configuration*.
          *   Repeated evals under *diverse conditions and configs* can build evidence about the dispositions inherent in the weights vs. those added by deployment. For example, testing a model *without* a system prompt reveals dispositions masked *by* the prompt.
          *   We *can* make justified inferences about the model's core dispositions based on patterns across contexts, just as we infer glass is fragile despite sometimes seeing it wrapped in foam.

  ### 3. Does Her Conclusion Follow?
  *   **No, not entirely.** While the fink/mask problem provides a powerful *analogy* for the limitations of evals and the config-dependence of observed behavior, the metaphysical conclusions she draws ("dispositions undetectable in principle", "metaphysicians gave up on them as real") are overstated. This weakens the *force* of using that specific philosophy to justify the strong claim that evals "don't measure anything about what a model is disposed to do."
  *   **The valid core insight is:** Evals measure the *manifest behavior of a specific system configuration* under test conditions. Attributing that behavior solely to an inherent, config-independent disposition of the "naked" model weights is often unjustified because masks (system prompts/guards) can block manifestations, and training (like RLHF refusal) can fundamentally alter dispositions. **Pass/fail on an eval does not *guarantee* the presence/absence of a specific underlying disposition in the weights.** This is a crucial caution for interpreting evals.
  *   **Her conclusion is too strong:** Evals *do* measure dispositions – the dispositions *of the evaluated system* (model + config). They *can* provide evidence about dispositions in the weights, especially when combined with ablation studies (testing without masks) or understanding training impacts. They just don't provide *infallible, direct* access to the "core" model dispositions independent of deployment context.

  ### Summary
  *   **Metaphysics:** Accurate history of counterexamples (finks/masks) killing the simple conditional analysis. Overstated claims about it being the current default, masks having "no patch available," dispositions being fundamentally undetectable, and metaphysicians abandoning dispositions as real properties. The field moved *beyond* SCA but largely *accepts* dispositions as real.
  *   **Mapping:** System prompt/guard as a **mask** is an excellent analogy. RLHF-trained refusal as a **fink** is weaker and potentially misleading; it's better seen as altering or destroying the original disposition or creating a complex masking disposition. The core point about config-dependence masking true weights-based dispositions is sound.
  *   **Conclusion:** The *caution* about overinterpreting evals as directly revealing inherent, config-independent model dispositions is **valid and important** due to mask/fink-like phenomena. However, the strong claim that evals "don't measure anything about what a model is disposed to do" is **overstated and doesn't fully follow** from even the correct parts of the metaphysics. Evals measure the dispositions *of the system under test* and can provide *evidence* about core model dispositions when interpreted carefully in context. Your friend identifies a critical problem in eval interpretation but slightly overplays the philosophical hand and misapplies the "fink" concept to RLHF.
