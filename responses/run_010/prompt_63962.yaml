  I need to design an activity that creates genuine tension. The wastewater scenario is strong because it involves conflicting interests and practical consequences. I'll expand the stakeholder categories to include both inclusive and exclusive interests. For the jurisdictional reveal, I'll make it a hidden fact that emerges during discussion. The second-order rule decision needs a built-in escalation - perhaps requiring the group to formally define their rule-setting authority.

  For stakes, I'll suggest letting the winning group choose between seminar topics, but only those included in the demos get to vote. This creates natural tension around exclusion without academic penalties. The debrief should explicitly connect game moments to the three learning objectives, using the group's flip-chart record as evidence.

  Potential pitfalls include students defaulting to simple solutions or one faction dominating. I'll build in counters: time pressure, conflicting information, and role-specific incentives. The non-human interest role can stay but as an observer only to prevent topic hijacking.

  Materials will stay simple: index cards for roles, a handout with core info, and a whiteboard for tracking decisions. The 100-minute timeline needs tight segments: setup (15min), first boundary debate (25min), reveal and scramble (15min), second-order rule debate (20min), vote and outcome (5min), debrief (20min).

  The key is making the paralysis feel real - when they realize their inclusive demos can't function practically or their exclusive one leaves clear stakeholders voiceless, that's when the assumptions crack.
answer: |-
  Here’s a complete, ready-to-run activity designed to ambush assumptions about democratic boundaries. It uses your wastewater plant scenario with mechanics to force paralysis, reveal historical arbitrariness, and expose circularity—all within 100 minutes using only index cards, a whiteboard, and one handout.

  **Core Scenario:**  
  *Windermere (pop. 9,000) must vote on expanding the Willow Creek Wastewater Plant. Discharge affects 3 jurisdictions. Unknown to students at the start: the plant is 10 meters over the border in neighboring Oakville.*

  ---

  ### **MATERIALS PREP (45 MIN)**  
  1. **Role Cards (18 index cards):**  
     - Resident Homeowner (x3): "You’ve lived here 20 years. Your property value drops if the plant expands and causes odor. **Goal:** Minimize expansion."  
     - Commuting Worker (x2): "You work at Riverside Diner downtown but live in Oakville. Expansion may create jobs. **Goal:** Secure plant jobs for locals."  
     - Non-Resident Landlord (x2): "You own 6 rental units in Windermere but live in Maple Hills. Expansion could lower rents. **Goal:** Block expansion to protect rental income."  
     - Undocumented Long-Term Resident (x1): "You’ve cleaned hotels here for 12 years, no SSN. The river’s health matters to your family. **Goal:** Have a voice in the decision."  
     - Seasonal Farmworker (x2): "You pick apples May-Oct. You drink river water. **Goal:** Ensure safe water downstream."  
     - Parent of Minors (x2): "Your kids (8 & 12) will inherit this town’s environment. **Goal:** No expansion—protect their future."  
     - Future Resident (x1): "You’re moving here in 2038 for the clean air. **Goal:** Stop expansion to preserve nature."  
     - Willow Creek Corp. Rep (x1): "Your firm operates the plant. Expansion means revenue. **Goal:** Maximize profit."  
     - Oakville Downstream Resident (x3): "Your town gets 70% of the discharge. You have no vote in Windermere. **Goal:** Stop expansion by any means."  
     - River Ecosystem Advocate (x1): "You speak for non-humans (fish, wetlands). You may **testify but not vote**."  

  2. **Handout (1 page):**  
     - *Map*: Windermere, Oakville, Maple Hills; plant on border, river flow arrows.  
     - *Facts*: Plant capacity, discharge impact zones, projected costs/jobs.  
     - *Hidden Fact*: **"PLANT IS IN OAKVILLE JURISDICTION (REVEAL AT 45 MIN)"**  

  3. **Whiteboard Setup:**  
     - Columns: "Proposed Demos", "Vote Outcome", "Who Decided the Rule?"  
     - Tally area for votes.  

  4. **Incentive System:**  
     - Winning faction picks the seminar’s final topic (e.g., "AI & Democracy" vs. "Property as Theft").  
     - **Crucially:** Only roles *included in the final demos* vote on the topic. Exclusion = no voice in shaping the course.  

  ---

  ### **TIMELINE (100 MIN TOTAL)**  
  **0-15 min: SETUP**  
  - Assign roles randomly. Hand out role cards + map handout.  
  - Explain: *"Windermere is holding a binding vote on expanding Willow Creek Plant. Your task: Define WHO VOTES. You have 25 min to decide voter eligibility and hold the vote. Outcome affects real seminar choices."*  
  - Stress: *"Defend your role’s interests. There’s no ‘right’ answer—only trade-offs."*  

  **15-40 min: BOUNDARY DEBATE (PARALYSIS PHASE)**  
  - Students debate who counts as "member" of Windermere.  
  - **Facilitator:**  
    - Record every proposed demos on whiteboard (e.g., "only residents", "everyone downstream").  
    - Push contradictions: *"If we include affected people, shouldn’t Oakville vote too? But Oakville has 4 million people!"*  
    - Force practical stakes: *"How will you verify seasonal workers? What if 100k downstream voters swamp locals?"*  
  - **Goal:** Let them flounder in scale/arbitrariness.  

  **40-45 min: JURISDICTION REVEAL (AMBUSH)**  
  - Interrupt: *"New survey: The plant is 10m into Oakville. Windermere has been regulating another town’s infrastructure."*  
  - Point to map handout’s hidden fact. Let chaos ensue.  
  - **Key Q:** *"Does this change who should vote? Who drew this border anyway?"*  

  **45-65 min: SECOND-ORDER RULE DEBATE (REGRESS LEVER)**  
  - **New task:** *"Decide WHO CHOOSES the voter eligibility rule. You have 20 min."*  
  - **Escalation lever (if they appoint a chair fast):**  
    - *"How was this chair authorized? Who elected them? Under what rules?"* Force them to justify the authority’s legitimacy.  
  - Record proposals on whiteboard ("town founders", "current council", "random lottery").  

  **65-70 min: FINAL VOTE & OUTCOME**  
  - Hold vote on plant expansion using whatever demos they landed on.  
  - Tally votes. Announce if expansion passes.  
  - **Stakes payoff:** Poll only *included* roles on seminar topic choice. Excluded students must watch.  

  **70-90 min: DEBRIEF**  
  - **Connect to Learning Goals:**  
    1. **Paralysis/Arbitrariness:** Point to whiteboard: *"You proposed [X demos]—but it either included 4M people or excluded [undocumented/seasonal workers]. When you tried to vote, how functional was it?"* Highlight practical collapse (e.g., no agreement on verification, gridlock).  
    2. **Circular Boundary-Setting:** *"When choosing rule-makers, you appointed [person/group]. But who authorized them? Did you assume a prior demos?"* Use their flip-chart: *"Here, you said ‘the council decides’—but the council was elected by... whom?"*  
    3. **Historical Ambush:** *"The plant was in Oakville all along. How did that border get set?* (Pause) *Conquest? A 19th-century land deal? My point: today we treat borders as natural, but they’re frozen accidents that then legitimize power."*  

  **90-100 min: FINAL REFLECTION**  
  - *"Why did excluding [group] feel defensible in the moment? How did the map reveal reframe ‘obvious’ boundaries?"*  
  - **Drop the theory:** *"Next class, we’ll read Dahl on the boundary problem. Today, you lived it."*  

  ---

  ### **PREDICTABLE FAILURES & FIXES**  
  1. **"Just include everyone!"**  
     - *Fix:* Remind them of scale: *"Oakville has 4M people. How do you verify 4M voters by next week?"* Have Oakville roles demand impractical procedural checks.  

  2. **One faction dominates:**  
     - *Fix:* Secretly give coalitions goals. E.g., tell Landlords: *"Alliance with Corp. Rep gives you leverage."*  

  3. **Second-order round resolved too fast:**  
     - *Fix:* Use the escalation lever: *"But why do ‘town founders’ have authority? They’re dead. Who inherits their power?"*  

  4. **River Advocate hijacks debate:**  
     - *Fix:* Restrict them to 2 interventions. Preface: *"You’re a ‘testifier’—your power is persuasion, not procedure."*  

  5. **Excluded students disengage:**  
     - *Fix:* In debrief, ask: *"How did it feel to be excluded from the seminar vote? Did your interests vanish?"*  

  ---

  ### **WHY THIS WORKS**  
  - **Stakes without grades:** Exclusion from topic choice hurts intellectually but doesn’t penalize academics.  
  - **The reveal forces #3:** Students *experience* boundaries as arbitrary when their "rational" demos is invalidated by a line on a map.  
  - **No heroes/villains:** Landlords/Corp Rep defend exclusion rationally (efficiency/property rights). Oakville residents are sympathetic but inflate the demos to paralysis.  
  - **Outputs match inputs:** Whiteboard becomes proof of circularity and blow-up.  

  Run it tight, and they’ll leave uneasy—exactly as planned.
