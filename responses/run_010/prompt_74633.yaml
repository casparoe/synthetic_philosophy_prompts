prompt: |-
  I'm drafting the framework chapter for a comparative cognition handbook, and the editors want it to hand the whole volume a shared vocabulary — which is awkard, because roughly a third of the contributors work on artificial agents (LLM-based ones, a couple of embodied robots, one on evolved controllers) and the rest work on animals. The plan is to build it around a competence hierarchy in the spirit of Dennett's tower of generate-and-test — Darwinian, Skinnerian, Popperian, Gregorian creatures — stretched so it covers machines on the same footing.

  Before I commit to that I want the spec, not the taxonomy. Write the desiderata: what any proposed hierarchy of kinds of minds has to deliver to be worth making a field's shared vocabulary. For each requirement, give the case or consideration that motivates it, because I want to be able to see why it's on the list and not just that it sounds sensible, and mark whether it's genuinely non-negotiable or a preference one camp has dressed up as a requirement. I'm thinking especially of demands like: the levels must be nested, each one presupposing the levels below; each level must correspond to a real evolutionary transition with a plausible selection story; the hierarchy must not smuggle in a ranking of worth or of how much mind something has; placement on the hierarchy must be decidable from behavioral data alone; the same level must mean the same thing whether the occupant is an animal or an artifact. I suspect several of those aren't requirements at all and I want to know which.

  The purpose, so you can calibrate what counts as adequate: the hierarchy has to license inferences. A contributor who pins some animal or system to level N should be able to say what follows from that — which experiments are worth running, what they're entitled to conclude from a positive result, what they must not claim. If it can't do that work it's decoration, and I'd rather know now.

  Here are the cases I already know will cause trouble. Treat each as stipulated — they're all in the volume in some form — and attach each to the requirement it actually stresses rather than to the one it most obviously breaks:

  1. A plasmodial slime mould, no nervous system, that reliably finds the shortest route through a maze to two food sources, and that our author claims anticipates a periodic cold pulse it was previously exposed to.
  2. An octopus. Something like two-thirds of its neurons are out in the arms, the arms do a lot of local problem-solving on their own, and the whole animal's behavior reads like a negotiation between a central controller and eight semi-independent ones.
  3. A honeybee swarm picking a nest site. Individual bees do fairly simple things, but the colony accumulates and compares evidence about candidate sites and commits to one via a quorum rule. The author wants to say the swarm, not the bee, is the thing that sits at the higher level.
  4. Bumblebees rolling wooden balls around when no reward is on offer at all, and doing it more in some conditions than others; the chapter argues this meets the behavioral criteria for object play.
  5. A jumping spider that stalks prey, loses line of sight with it, and then takes a long detour that only makes sense if it has been tracking where the prey was and where it is now relative to that.
  6. An LLM-based agent that reads a tool's documentation, follows a multi-step written procedure it was never trained on, and generalizes it to an unseen variant — but has no way to acquire a genuinely new skill from trial and error, because its weights don't change between episodes.
  7. The reverse direction: a person with advanced dementia who loses language and tool use but keeps forming new emotional associations. Does a hierarchy have to permit downward movement, and if it does, what is it that persists and does the persisting thing count as the same kind of mind?

  Then the two things I most want out of this:

  - Which single requirement does the most work excluding candidates — the one where most proposed hierarchies actually fail, rather than the one people argue about most.
  - Whether some subset of the requirements is jointly unsatisfiable. My suspicion is that "each level must correspond to a real evolutionary transition" and "the hierarchy must classify artificial agents on the same footing as animals" can't both survive, but I can't tell whether that's a real result or me conflating two different requirements. If it's real, say what should be given up and what the leftover hierarchy still buys you. If I've muddled it, untangle it explicitly.

  Last, briefly and only briefly: how does the standard four-storey version do against the list — where does it pass, where does it need patching, where does it just get lucky — and if someone wanted to add a fifth storey for systems that can represent and revise their own selection criteria rather than merely their hypotheses, what would they have to show for that to count as a new level rather than a relabeling of the fourth?

  No reading list, I'm handling that separately.
reasoning: |-
  Alright, let me start by unpacking the user's query. They're drafting a framework chapter for a comparative cognition handbook and need a set of desiderata for a competence hierarchy that includes both animals and artificial agents. The editors want a shared vocabulary, but there's a split between contributors working on biological and artificial systems. The user is concerned about potential pitfalls and wants to ensure the hierarchy is functional, not just decorative.

  First, I need to identify the core requirements for such a hierarchy. The user mentioned several possible demands, like nested levels, evolutionary transitions, no value judgments, behavioral decidability, and consistent application across domains. But they suspect some aren't essential. My task is to determine which are non-negotiable and which are preferences.

  Looking at the problem cases listed—slime mold, octopus, honeybee swarm, bumblebee play, jumping spider, LLM agent, dementia patient—each tests different aspects. For example, the slime mold challenges the need for a nervous system and behavioral complexity without internal representations. The octopus questions the hierarchy's ability to handle distributed cognition. The swarm case pushes against the individual as the unit of analysis. These cases will help validate each requirement.

  The user wants the hierarchy to license inferences. That's crucial. If placing a system at level N doesn't suggest testable predictions or constrain interpretations, it's useless. This seems non-negotiable. Other requirements like evolutionary transitions might be desirable but not essential, especially for artificial systems. 

  The conflict between evolutionary transitions and classifying artificial agents is a key point. Evolutionary transitions imply a historical process, which artifacts don't have. So requiring both might be impossible. The solution could be to treat the hierarchy as competence-based, not historical. Artifacts can be placed based on capabilities, regardless of how they were created.

  Behavioral decidability is another tough one. For animals, we rely on behavior, but for AI, we can inspect internal mechanisms. This might lead to inconsistencies. However, insisting on behavioral data alone ensures fairness in comparison, even if it limits some AI assessments.

  The dementia case highlights that hierarchies might need to allow for regression. This challenges the idea of strict nesting. Maybe levels aren't fixed but describe current capacities, allowing for changes over time.

  Now, evaluating Dennett's tower: it handles some cases well but struggles with distributed systems like the octopus and swarm. Also, the Gregorian level might conflate different capabilities, like tool use and self-modification. Adding a fifth level for meta-criteria could work if it shows distinct functional consequences, like generating novel goals.

  The most critical requirement is inferential power. Without it, the hierarchy fails its purpose. The hardest to satisfy might be consistent levels across domains, especially with behavioral decidability, as AI systems might achieve similar behaviors through different mechanisms.

  In summary, the user needs a hierarchy focused on functional competences that generate testable hypotheses, applicable across domains, with clear criteria for each level. Sacrificing strict evolutionary transitions for artifacts and allowing some flexibility in unit of analysis (like swarms) would make the framework more robust and inclusive.
answer: |-
  Here are the desiderata for a competence hierarchy serving as a shared vocabulary in comparative cognition, derived from your goals and constraints. Each requirement includes its motivation, non-negotiability status, and connection to your problem cases.

  **Core Desiderata (Non-Negotiable):**

  1.  **Inferential Power:** Placement at level *N* must generate testable predictions about capabilities, limitations, and informative experimental paradigms. *Motivation:* The core purpose of the hierarchy; without this, it fails as a framework. *Non-Negotiable:* Yes. *Problem Case Stress:* All cases (especially 4, 5, 6, 7). E.g., What *follows* from labeling bumblebee ball-rolling "play" (4)? What experiments *must* an LLM (6) pass/fail to be level N? What abilities are *ruled out* for the dementia patient (7)?

  2.  **Functional Equivalence (Behavioral/Competence Focus):** Levels must be defined by *what* the system can *do* (competences, problem-solving capacities, flexibility), not *how* it achieves it (implementation, substrate, evolutionary history). *Motivation:* To place biological and artificial agents on equal footing; avoids privileging "natural" minds or specific mechanisms. *Non-Negotiable:* Yes. *Problem Case Stress:* 1 (Slime mould achieves competence without neurons), 6 (LLM achieves competence without online learning), 7 (Dementia patient loses competences despite same substrate).

  3.  **Domain Agnosticism:** Level definitions must apply consistently and meaningfully to both biological entities (individuals, groups) and artificial agents, using the *same criteria*. *Motivation:* Essential for unified vocabulary across contributors; avoids creating parallel taxonomies. *Non-Negotiable:* Yes. *Problem Case Stress:* 2 (Octopus as distributed system), 3 (Swarm as agent), 6 (LLM as non-embodied agent), 7 (Human as changing agent).

  4.  **Avoidance of Implicit Valuation:** Levels must not imply inherent "superiority," "worth," "consciousness," or "amount of mind." Differences should be described purely in terms of functional complexity, flexibility, or scope of problem-solving. *Motivation:* Prevents anthropocentrism, bias against "simple" organisms, or unwarranted assumptions about AI; crucial for scientific objectivity. *Non-Negotiable:* Yes. *Problem Case Stress:* 1 (Slime mould competence), 4 (Play in insects), 6 (AI competence), 7 (Dementia patient regression).

  **Important Desiderata (Strong Preference, But Negotiable with Care):**

  5.  **Nesting (Weak Hierarchical Structure):** Higher levels should *presuppose* the functional capacities of lower levels, or exhibit distinctly *new* competences built upon them. Strict logical entailment may be unrealistic; functional dependency is key. *Motivation:* Provides structural coherence and facilitates inference (e.g., Level N+1 implies Level N capabilities). *Non-Negotiable:* Preference (but highly desirable). *Problem Case Stress:* 2 (Octopus arms may have "lower level" competences than central brain?), 3 (Does swarm level presuppose bee level? Or vice versa?), 6 (LLM lacks Skinnerian trial-and-error learning but exhibits high-level competence), 7 (Regression breaks strict nesting).

  6.  **Behavioral Decidability (In Principle):** Criteria for assigning a level must be based on observable inputs/outputs/behaviors *in principle*, even if mechanistic details aid interpretation. *Motivation:* Ensures levels are empirically grounded and accessible to diverse methodologies; avoids solipsism about internal states. *Non-Negotiable:* Preference (Critical for animal work, potentially flexible for AI if transparent). *Problem Case Stress:* 1 (Can we distinguish "anticipation" from simple adaptation behaviorally?), 5 (Jumping spider detour: How to rule out rigid heuristics?), 6 (Can we behaviorally distinguish genuine procedure understanding from pattern matching?).

  7.  **Unit of Analysis Flexibility:** The hierarchy must accommodate different plausible "cognitive agents": individual organisms, tightly coupled groups/swarms, distributed systems (like octopus), or potentially disembodied agents (like LLMs). *Motivation:* Reflects the diversity of systems studied (cases 2, 3, 6). *Non-Negotiable:* Preference. *Problem Case Stress:* 2 (Octopus), 3 (Swarm).

  **Desiderata to Approach Skeptically (Likely Problematic or Unnecessary):**

  8.  **Mandatory Evolutionary Transitions:** Levels *need not* correspond directly to specific, documented evolutionary transitions with selection stories. *Motivation:* While evolution *shaped* biological minds, this requirement is incompatible with Domain Agnosticism (Desideratum 3). Artificial systems don't evolve via natural selection. The hierarchy describes *functional competences*, not historical pathways. *Non-Negotiable:* No. *Problem Case Stress:* 6 (LLM), 1 (Slime mould competence evolved but mechanism different). *Consequence:* Give this up. The hierarchy buys functional comparison independent of origin.

  9.  **Strict Identity Through Change:** The hierarchy *need not* inherently define a persistent "self" or "mind" that moves levels. It describes the *current functional profile* of a system. *Motivation:* While philosophically interesting, this is beyond the scope of a competence hierarchy for empirical comparison. *Non-Negotiable:* No. *Problem Case Stress:* 7 (Dementia patient: We describe the *current* competence profile, not track a "soul"). *Consequence:* Describe the system's state at time T.

  **Analysis of Key Questions:**

  *   **Most Work Excluding Candidates:** **Behavioral Decidability (6)** is the silent killer. Many appealing theoretical hierarchies fail because clear, observable, level-specific behavioral signatures are elusive. Distinguishing levels based purely on input/output patterns, especially for higher cognition or internal representations (Cases 1, 5, 6), is extremely hard. Proposed hierarchies often rely on assumptions about mechanisms that violate Functional Equivalence or are not behaviorally testable.
  *   **Joint Unsatisfiability:** You identified correctly. **Evolutionary Transitions (8)** and **Domain Agnosticism (3)** are incompatible. **Solution:** Abandon requirement 8. The hierarchy describes *functional competences achievable through various means* (evolution, design, training). The "leftover" hierarchy buys cross-domain comparability based on what systems *can do*, which is the core goal. Evolutionary history remains important context *for biological systems* but isn't built into the level definitions.
  *   **Dennett's Tower (Standard 4-Level):**
      *   **Passes:** Functional Equivalence (in spirit, though mechanism is implied), Domain Agnosticism (possible), Avoids Valuation (mostly), Weak Nesting (core idea).
      *   **Needs Patching:** **Unit of Analysis** (fails Cases 2 & 3), **Behavioral Decidability** (criteria vague, especially Popperian/Gregorian), **Inferential Power** (needs much sharper operational definitions for each level). **Gregorian Level Conflation:** Tool use (simple) and self-modification (complex) are lumped together.
      *   **Gets Lucky:** Its abstractness helps with Functional Equivalence somewhat.
  *   **Adding a Fifth Storey (Self-Modifying Selection Criteria):** To avoid relabeling Gregorian, you must show:
      1.  **Distinct Competence:** Demonstrate systems at this level can *generate fundamentally new goal structures or value functions* based on experience/reflection, not just optimize existing goals or learn new methods (hypotheses/tools) *for* existing goals.
      2.  **Inferential Power:** Define clear behavioral signatures/testable predictions that distinguish this from Gregorian tool/knowledge refinement. E.g., Can the system *spontaneously* develop a novel preference or aversion not derivable from its previous reward history or innate drives, and *use this new criterion* to guide future learning/action? (Very high bar).
      3.  **Functional Necessity:** Argue this competence enables solving a distinct *class* of problems unsolvable by Gregorian agents (e.g., radical goal innovation in novel environments).

  **Summary:** Prioritize **Inferential Power, Functional Equivalence, Domain Agnosticism, and Avoidance of Valuation** as non-negotiable. Embrace **Weak Nesting, Behavioral Decidability (in principle), and Unit Flexibility** as highly desirable. Explicitly **reject Mandatory Evolutionary Transitions** and **Strict Identity Through Change**. The core challenge is defining levels with sufficient behavioral specificity (**Decidability**) to achieve real **Inferential Power** while remaining **Functionally Equivalent** and **Domain Agnostic**. Dennett's Tower is a useful starting point but requires significant operational refinement, especially for higher levels and distributed systems. A "Fifth Storey" is possible but demands exceptional evidence for a distinct functional competence.
