  2) Host intentionality breaks the virulence analogy completely. A pathogen's success depends on bypassing host cognition; a meme's often requires engaging it. This isn't fixable by adding choice terms - it inverts the model's logic.

  Must watch for smuggling: I nearly equated meme mutation with viral mutation, but the former is cognitive and deliberate. Also resisted the temptation to map "immune escape" too literally to belief updating.

