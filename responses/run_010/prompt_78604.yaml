  - Susceptible host ≈ Cognitively compatible individual
  - Transmission events ≈ Exposure + internalization

  The fidelity question is tricky - in epidemiology we have clear mutation rates, but meme mutation happens during both transmission and internal reconstruction. That might be the first distortion point. 

  On virulence, I'm noting the conflict: in pathogens virulence is a byproduct of replication, but for memes "harm" is often orthogonal to spread (e.g., beneficial vs parasitic ideas). The virulence-transmission tradeoff may not hold. 

  For the residue report:
