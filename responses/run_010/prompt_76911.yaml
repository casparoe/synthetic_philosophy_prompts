  Below is a self-administered paper instrument designed to sort participants into population ethics positions based on their intuitive responses to concrete outcome comparisons. The instrument consists of 10 items, each presenting two outcomes with neutral, matched descriptions (under 60 words each). Participants select which outcome is better, if they are equally good, or (in one item) if they are incomparable. The items are sequenced to minimize contamination (e.g., the "repugnant" trade in Item 6 appears mid-sequence to avoid priming, and sensitive topics like suffering are distributed). The quiz takes 15–20 minutes to complete.

  ---

  ### **Population Ethics Sorting Instrument**  
  *Instructions: For each pair of outcomes, circle your answer. Do not overthink; go with your initial judgment. Outcomes are described neutrally; assume all else is equal.*  

  1. **Item 1 (Fixed-population improvement):**  
     - Outcome A: 100 people exist. Each lives 70 years with moderate well-being.  
     - Outcome B: The same 100 people exist. Each lives 75 years with slightly higher well-being than in A.  
     → Which is better? **A** / **B** / **Exactly equally good**  

  2. **Item 2 (Fixed-population equality):**  
     - Outcome A: 100 people exist. Half have very high well-being; half have very low well-being.  
     - Outcome B: The same 100 people exist. All have moderate well-being, and total well-being equals A.  
     → Which is better? **A** / **B** / **Exactly equally good**  

  3. **Item 3 (Adding lives worth living):**  
     - Outcome A: 100 people exist, each with high well-being.  
     - Outcome B: 100 people exist with the same high well-being as A, plus 10 more people with moderate well-being. No one in A is affected.  
     → Which is better? **A** / **B** / **Exactly equally good**  

  4. **Item 4 (Adding a miserable life):**  
     - Outcome A: 100 people exist, each with high well-being.  
     - Outcome B: 100 people exist with the same high well-being as A, plus one more person with extreme suffering (e.g., constant agony). No one in A is affected.  
     → Which is better? **A** / **B** / **Exactly equally good**  

  5. **Item 5 (Suffering vs. faint pleasure):**  
     - Outcome A: 1,000 people exist. Each has a life with no suffering and only faint positive experiences (e.g., mild contentment). All are barely glad to exist.  
     - Outcome B: 1,000 people exist. Each has a life with mild suffering (e.g., brief discomfort) but stronger positive experiences. All are clearly glad to exist, with higher well-being than in A.  
     → Which is better? **A** / **B** / **Exactly equally good**  

  6. **Item 6 (Large-scale trade):**  
     - Outcome A: 1 billion people exist. Each has very high well-being (e.g., profound joy, fulfillment).  
     - Outcome B: 1 trillion people exist. Each has minimal positive experiences, no suffering, and a life barely worth living. All are glad to exist.  
     → Which is better? **A** / **B** / **Exactly equally good**  

  7. **Item 7 (Subject neutrality):**  
     - Outcome A: 1 billion humans exist. Each has very high well-being, as in Item 6A.  
     - Outcome B: 1 trillion sentient animals (e.g., birds) exist. Each has a life barely worth living, as in Item 6B. All would continue living if able.  
     → Which is better? **A** / **B** / **Exactly equally good** / **Not comparable**  

  8. **Item 8 (Lifetime aggregation):**  
     - Outcome A: 10 billion people exist. Each lives 20 years with positive experiences and no suffering.  
     - Outcome B: 100 million people exist. Each lives 200 years. Each year matches A's quality, and total well-being equals A.  
     → Which is better? **A** / **B** / **Exactly equally good**  

  9. **Item 9 (Neutral life):**  
     - Outcome A: 100 people exist, each with high well-being.  
     - Outcome B: 100 people exist with the same high well-being as A, plus one more person. This person has no suffering, no positive experiences, and is indifferent about existing.  
     → Which is better? **A** / **B** / **Exactly equally good**  

  10. **Item 10 (Low-quality life with desire):**  
      - Outcome A: 100 people exist, each with high well-being.  
      - Outcome B: 100 people exist with the same high well-being as A, plus one more person. This person has very low well-being (e.g., frequent suffering) but desperately wants to live.  
      → Which is better? **A** / **B** / **Exactly equally good**  

  ---

  ### **Scoring Key**  
  *Apply rules in order; stop at the first match. Answers are denoted as (Item: choice), e.g., (3: B) = "B better" for Item 3.*

  #### **Compact Assignment Rules**  
  1. **If (7: Not comparable)**, assign → **Species-relativist view** (rejects cross-species comparisons).  
  2. **If (6: A) and (7: A or B or equally good) and (3: A) and (4: A)**, assign → **Average view** (values per-capita well-being).  
  3. **If (6: B) and (8: equally good) and (9: equally good) and (2: equally good)**, assign → **Total view** (values sum-total well-being; c=0).  
  4. **If (4: A) and (3: equally good)**, assign → **Asymmetry-based view** (adding happy lives ≠ not adding miserable lives).  
  5. **If (10: B)**, assign → **Desire-based view** (respects preferences over experiential quality).  
  6. **If (5: A) and (2: B) and (4: A)**, assign → **Negative utilitarianism** (minimizes suffering only).  
  7. **If (6: A) and (3: B) and (9: A)**, assign → **Critical-level view** (life adds value only if above threshold; c>0).  
  8. **If (6: A) and (3: B) and (9: equally good)**, assign → **Variable-value view** (weight of added life decreases with population size).  
  9. **If (2: B)**, assign → **Egalitarian total view** (values equality-adjusted total well-being).  
  10. **If (6: A) and (3: A) and (1: B)**, assign → **Maximin** (prioritizes worst-off; here, A’s high well-being vs. B’s bare minimum).  
  11. **If (8: A or B)**, assign → **Lifetime prioritarianism** (values duration per life over total moments).  
  12. **If multiple conflicts (see inconsistencies below) or ≥4 "equally good" for non-trivial items**, assign → **Explicit scepticism** (no adequate theory).  
  13. **Default**: Assign → **Narrow person-affecting view** (only existing people matter; neutral on adding lives).  

  #### **Inconsistent Answer Pairs and Repairs**  
  - **Conflict 1**: (3: B) and (6: A) → *Incoherent for total/average views*.  
    - Repair: Change (3: B) to (3: A) → Critical-level or variable-value view.  
    - Or change (6: A) to (6: B) → Total view.  
  - **Conflict 2**: (4: equally good) and (5: A) → *Coherent but unattractive* (ignores extreme suffering).  
    - Repair: Change (4: equally good) to (4: A) → Negative utilitarianism.  
  - **Conflict 3**: (1: equally good) and (2: B) → *Incoherent* (if improvements matter, equality should too).  
    - Repair: Change (1: equally good) to (1: B) → Egalitarian total view.  
  - **Conflict 4**: (9: B) → *Incoherent* (no major view values adding neutral lives).  
    - Repair: Change (9: B) to (9: equally good) → Total view.  
  - **"Not comparable" diagnostic**: Only for Item 7, it indicates **species-relativist view**. In other items, it is invalid (not offered).  

  #### **Indistinguishable Leaf Pairs and Resolution**  
  - **Total view vs. Egalitarian total view**: Differ only on Item 2 (equality).  
    - *Resolution item*: Add a fixed-population inequality item with same total but different equality.  
  - **Critical-level vs. Variable-value views**: Differ only on Item 9 (neutral life).  
    - *Resolution item*: Add an item adding a life slightly below critical level to a large population.  
  - **Maximin vs. Narrow person-affecting**: Both reject Item 3 (adding lives).  
    - *Resolution item*: Add a trade-off helping the worst-off vs. adding happy lives.  

  #### **Order Rationale**  
  - **Item 6 position**: Placed mid-sequence (after Items 1–5) to avoid priming "repugnance"; earlier items establish intuitions about improvement, equality, and adding lives.  
  - **Contamination risks**:  
    - Item 4 (misery) before Item 5 (suffering trade-off) to isolate negative utilitarianism.  
    - Item 7 (species) after Item 6 to test generalization of the trade.  
    - Item 10 (desire) last to prevent preference-based reasoning from affecting hedonistic items.  
  - **Final sequence**: Builds from simple (fixed populations) to complex (cross-species/lifetime), with "trap" items (e.g., Item 9) late to avoid triggering scepticism early.  

  ---

  ### **Logical Space and Named Positions**  
  *From answer patterns, mapped to views (standard names only):*  
  - **Total view**: (6: B), (8: equally good), (9: equally good), (2: equally good).  
  - **Average view**: (6: A), (3: A), (4: A), (2: equally good).  
  - **Critical-level view**: (6: A), (3: B), (9: A), (4: A).  
  - **Variable-value view**: (6: A), (3: B), (9: equally good), (4: A).  
  - **Negative utilitarianism**: (5: A), (2: B), (4: A), (6: equally good).  
  - **Narrow person-affecting view**: (3: equally good), (4: A), (9: equally good), (6: A or B).  
  - **Asymmetry-based view**: (3: equally good), (4: A), (6: A or B).  
  - **Egalitarian total view**: (2: B), (6: B), (8: equally good).  
  - **Maximin**: (6: A), (3: A), (1: B).  
  - **Species-relativist view**: (7: Not comparable).  
  - **Lifetime prioritarianism**: (8: A or B).  
  - **Desire-based view**: (10: B).  
  - **Explicit scepticism**: Inconsistent or ≥4 "equally good" (e.g., Items 1, 3, 6, 8).  

  #### **Unoccupied Combinations**  
  - **(3: B) + (6: A) + (9: B)**: *Incoherent* (values adding lives but endorses neutral-life addition, which no theory accepts).  
  - **(5: B) + (4: equally good)**: *Coherent but unattractive* (ignores extreme suffering while accepting mild-suffering trade-offs).  
  - **(1: equally good) + (5: A)**: *Unexplored* (denies improvement matters but prioritizes suffering; rare hybrid).  

  This instrument isolates core commitments (e.g., the "repugnant" trade in Item 6 fractures totalists vs. others) while embedding it neutrally. The scoring key resolves inconsistencies via minimal edits, and leaves like "desire-based view" emerge from responses. Participants discover their position without theory-laden labels, enabling focused debate.
