  ### Marking Scheme  
  **Total: 25 marks. Six must-hit moves:**  
  1. **Compute grid (PPV, TPR, FPR) for all \(k\) and groups (4 marks).**  
     *Botch: Arithmetic errors in held counts or rates.*  
  2. **Identify equal PPV at \(k=3\) and equal TPR/FPR at \(k=1,4\) (3 marks).**  
     *Botch: Missing \(k=4\) or including invalid cut points.*  
  3. **Derive PPV = \(\frac{\text{TPR} \cdot \pi}{\text{TPR} \cdot \pi + \text{FPR} \cdot (1 - \pi)}\) step by step (5 marks).**  
     *Botch: Incomplete Bayes’ application.*  
  4. **Derive \(\pi_A = \pi_B\) condition for joint satisfaction (4 marks).**  
     *Botch: Fails to reach or justify \(\pi_A = \pi_B\).*  
  5. **Explain degeneracy of \(k=1,4\) and why non-degenerate joint satisfaction is impossible here (4 marks).**  
     *Botch: Calls instrument miscalibrated or ignores base rates.*  
  6. **Analyze label bias impact on all criteria in (c)(ii) (5 marks).**  
     *Botch: Treats rearrest as unproblematic or omits criteria.*  

  **Deduct marks for:**  
  - Suggesting instrument miscalibration needs fixing (-1; it *is* calibrated).  
  - Assuming group-blind cut points inherit calibration (-1; PPV differs by group).  
  - Proposing \(k=1/4\) as non-degenerate (-1).  
  - Advocating group-specific cut points without checking PPV/error rates (-1).  
  - Concluding fairness is arbitrary/impossible from conflict (-1; normative leap).  
  - Ignoring rearrest-offending distinction in (c)(ii) (-2).  

  **Boundary description:**  
  A **passing answer** (≥13 marks) computes the grid, identifies equality cut points, derives the PPV function, and notes label bias affects all criteria. A **full-mark answer** (≥22) adds: correct degeneracy explanation, justifies the \(\pi_A=\pi_B\) condition step by step, correctly analyzes randomization/group-specific rules, and articulates non-statistical premises for injustice.
