  Problem 2 (25 marks, 70 minutes)

  Larkspur County uses a score S (taking values 1, 2, or 3, with 3 being the highest) to decide whether to hold a defendant in custody before trial. Defendants belong to one of two groups, A or B. Let Y=1 if the defendant is rearrested within twelve months of release, and Y=0 otherwise. The data from one year are as follows:

