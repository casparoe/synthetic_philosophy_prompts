  ### Examination Problem

  **Problem 2 (25 marks; 70 minutes)**  
  Larkspur County uses a score \(S\) (taking values 1, 2, or 3, with 3 being the highest) to decide whether to hold a defendant in custody before trial. Defendants belong to one of two groups, A or B, distinguished by a legally protected attribute. Let \(Y = 1\) if the defendant is rearrested within twelve months of release, and \(Y = 0\) otherwise. The data from one year are as follows:  

  - **Group A**:  
    - \(S = 1\): 400 defendants, 40 rearrested.  
    - \(S = 2\): 400 defendants, 200 rearrested.  
    - \(S = 3\): 200 defendants, 180 rearrested.  
  - **Group B**:  
    - \(S = 1\): 600 defendants, 60 rearrested.  
    - \(S = 2\): 300 defendants, 150 rearrested.  
    - \(S = 3\): 100 defendants, 90 rearrested.  

  The county chooses a cut point \(k \in \{1, 2, 3, 4\}\): it holds a defendant if and only if \(S \geq k\), where \(k = 4\) means hold no one, and \(k = 1\) means hold everyone. The same \(k\) is applied to both groups.  

  **Part (a) (8 marks)**  
  (i) For each group, compute the **overall rearrest rate** (proportion with \(Y = 1\)) and the **rearrest rate within each score band** (proportion with \(Y = 1\) for each \(S\)).  
  (ii) State what it means about the instrument that the within-band rearrest rates are the same for groups A and B.  
  (iii) For each group and each \(k \in \{1, 2, 3, 4\}\), compute:  
  - **Positive predictive value (PPV)**: Proportion of held defendants who are rearrested (\(P(Y=1 \mid \text{held})\)).  
  - **True positive rate (TPR)**: Proportion of rearrested defendants who are held (\(P(\text{held} \mid Y=1)\)).  
  - **False positive rate (FPR)**: Proportion of non-rearrested defendants who are held (\(P(\text{held} \mid Y=0)\)).  
  Report all values in a clear grid.  
  (iv) Using your grid, identify which cut point(s) make PPV equal across groups, and which make both TPR and FPR equal across groups.  

  **Part (b) (10 marks)**  
  (i) Express PPV as a function of TPR, FPR, and the group’s overall rearrest rate (denoted \(\pi = P(Y=1)\)). Derive this step by step.  
  (ii) Using your expression, derive the condition under which a decision rule that equalizes TPR and FPR across two groups with different \(\pi\) also equalizes PPV. Then, state what must be true of the instrument or groups for a **non-degenerate rule** (not \(k=1\) or \(k=4\)) to satisfy both equalized TPR/FPR and equal PPV simultaneously. Explain why the rules achieving equal TPR/FPR in (a)(iv) are degenerate.  
  (iii) Suppose the county can:  
  - Use **group-specific cut points** (\(k_A\) for A, \(k_B\) for B),  
  - Or **randomize** the hold decision within a score band (e.g., hold \(S=2\) defendants with probability \(p\)).  
  Does either option enlarge the set of rules available? Give definite answers with reasons.  

  **Part (c) (7 marks)**  
  (i) To conclude that an admissible rule (one in your grid) is unjust to one group, what **non-statistical premises** are needed? List them briefly.  
  (ii) Suppose rearrest (\(Y\)) systematically overstates or understates actual offending for one group (e.g., due to biased enforcement). For each criterion in (a)–(b)—within-band rearrest rates, PPV, TPR, FPR—explain whether it retains its claim to measure what it purports to measure. Distinguish carefully.  

  ---

  ### Model Answer  
  **Part (a)**  
  (i) Overall rearrest rates:  
  - Group A: \(\frac{40 + 200 + 180}{1000} = \frac{420}{1000} = 0.420\)  
  - Group B: \(\frac{60 + 150 + 90}{1000} = \frac{300}{1000} = 0.300\)  

  Within-band rearrest rates:  
  - \(S=1\): A: \(\frac{40}{400} = 0.100\), B: \(\frac{60}{600} = 0.100\)  
  - \(S=2\): A: \(\frac{200}{400} = 0.500\), B: \(\frac{150}{300} = 0.500\)  
  - \(S=3\): A: \(\frac{180}{200} = 0.900\), B: \(\frac{90}{100} = 0.900\)  

  (ii) The within-band rates being identical means the instrument is **calibrated** across groups: the score \(S\) has the same predictive validity for rearrest in both groups.  

  (iii) Grid of values:  
  | Group | \(k\) | Held | Rearrested (Held) | PPV      | TPR      | FPR      |  
  |-------|-------|------|-------------------|----------|----------|----------|  
  | A     | 1     | 1000 | 420               | 0.420    | 1.000    | 1.000    |  
  | A     | 2     | 600  | 380               | 0.633    | 0.905    | 0.379    |  
  | A     | 3     | 200  | 180               | 0.900    | 0.429    | 0.034    |  
  | A     | 4     | 0    | 0                 | Undefined| 0.000    | 0.000    |  
  | B     | 1     | 1000 | 300               | 0.300    | 1.000    | 1.000    |  
  | B     | 2     | 400  | 240               | 0.600    | 0.800    | 0.229    |  
  | B     | 3     | 100  | 90                | 0.900    | 0.300    | 0.014    |  
  | B     | 4     | 0    | 0                 | Undefined| 0.000    | 0.000    |  

  *Note: Held = defendants with \(S \geq k\). Rearrested (Held) = held defendants with \(Y=1\). PPV = Rearrested (Held) / Held. TPR = Rearrested (Held) / Total rearrested. FPR = (Held - Rearrested (Held)) / Total non-rearrested. Totals: A: rearrested = 420, non-rearrested = 580. B: rearrested = 300, non-rearrested = 700.*  

  (iv)  
  - **Equal PPV**: At \(k=3\) (PPV = 0.900 for both). At \(k=4\), PPV is undefined for both; this is degenerate.  
  - **Equal TPR and FPR**: At \(k=1\) (TPR = 1.000, FPR = 1.000 for both). At \(k=4\) (TPR = 0.000, FPR = 0.000 for both); both degenerate.  

  **Part (b)**  
  (i) Let:  
  - \(\pi = P(Y=1)\) (overall rearrest rate),  
  - TPR = \(P(\text{held} \mid Y=1)\),  
  - FPR = \(P(\text{held} \mid Y=0)\).  
  By Bayes’ theorem:  
  \[
  \text{PPV} = P(Y=1 \mid \text{held}) = \frac{P(\text{held} \mid Y=1) P(Y=1)}{P(\text{held})}
  \]  
  \[
  P(\text{held}) = P(\text{held} \mid Y=1)P(Y=1) + P(\text{held} \mid Y=0)P(Y=0) = \text{TPR} \cdot \pi + \text{FPR} \cdot (1 - \pi)
  \]  
  \[
  \boxed{\text{PPV} = \frac{\text{TPR} \cdot \pi}{\text{TPR} \cdot \pi + \text{FPR} \cdot (1 - \pi)}}
  \]  

  (ii) If TPR and FPR are equal across groups (denoted \(\text{TPR}_A = \text{TPR}_B = \text{TPR}\), \(\text{FPR}_A = \text{FPR}_B = \text{FPR}\)):  
  \[
  \text{PPV}_A = \frac{\text{TPR} \cdot \pi_A}{\text{TPR} \cdot \pi_A + \text{FPR} \cdot (1 - \pi_A)}, \quad \text{PPV}_B = \frac{\text{TPR} \cdot \pi_B}{\text{TPR} \cdot \pi_B + \text{FPR} \cdot (1 - \pi_B)}
  \]  
  For \(\text{PPV}_A = \text{PPV}_B\):  
  \[
  \frac{\text{TPR} \cdot \pi_A}{\text{TPR} \cdot \pi_A + \text{FPR} \cdot (1 - \pi_A)} = \frac{\text{TPR} \cdot \pi_B}{\text{TPR} \cdot \pi_B + \text{FPR} \cdot (1 - \pi_B)}
  \]  
  Assuming \(\text{TPR} \neq 0\), divide numerators by TPR:  
  \[
  \frac{\pi_A}{\pi_A + r \cdot (1 - \pi_A)} = \frac{\pi_B}{\pi_B + r \cdot (1 - \pi_B)} \quad \text{where} \quad r = \frac{\text{FPR}}{\text{TPR}}
  \]  
  Cross-multiplying:  
  \[
  \pi_A [\pi_B + r(1 - \pi_B)] = \pi_B [\pi_A + r(1 - \pi_A)]
  \]  
  \[
  \pi_A \pi_B + r \pi_A (1 - \pi_B) = \pi_A \pi_B + r \pi_B (1 - \pi_A)
  \]  
  \[
  r \pi_A (1 - \pi_B) = r \pi_B (1 - \pi_A)
  \]  
  If \(r \neq 0\), then \(\pi_A (1 - \pi_B) = \pi_B (1 - \pi_A)\), simplifying to \(\pi_A = \pi_B\).  
  - **Conclusion**: Equal PPV requires \(\pi_A = \pi_B\) when TPR/FPR are equal and non-degenerate (\(r \neq 0\), TPR \(\neq 0\)). Here, \(\pi_A = 0.42 \neq 0.30 = \pi_B\), so no non-degenerate rule can satisfy both.  
  - **Degenerate rules**: \(k=1\) (hold all) and \(k=4\) (hold none) are degenerate because they ignore the score (all decisions are identical).  

  (iii)  
  - **Group-specific cut points**: Enlarges the set of rules. For example, \(k_A=2\), \(k_B=3\) is new. However, non-degenerate equal TPR/FPR remains impossible (discrete TPR/FPR values differ; no \((k_A, k_B)\) yields identical TPR and FPR).  
  - **Randomization within bands**: Enlarges the set of rules. For example, holding \(S=2\) with probability \(p\) allows intermediate TPR/FPR values. Still, non-degenerate equal TPR/FPR is impossible: the TPR/FPR ranges (e.g., A: TPR \(\in [0.429, 1]\), B: TPR \(\in [0.300, 1]\)) overlap only at extremes (0 or 1).  

  **Part (c)**  
  (i) Non-statistical premises needed:  
  - A normative definition of fairness (e.g., "equal harm requires equal PPV" or "equal liberty requires equal FPR").  
  - That pretrial detention is harmful and should minimize errors.  
  - That group fairness overrides other goals (e.g., efficiency).  

  (ii) If rearrest (\(Y\)) misstates actual offending:  
  - **Within-band rearrest rates**: Lose validity. If policing biases \(Y\), bands are not calibrated to true offending.  
  - **PPV**: Does not measure "offense if held" (biased by enforcement).  
  - **TPR/FPR**: TPR does not capture "holding true offenders"; FPR does not capture "holding innocents." All criteria become unreliable for true offending.  
  - **Survival**: Only if the county’s goal is to *prevent rearrest* (not offending) do the criteria retain meaning.  

