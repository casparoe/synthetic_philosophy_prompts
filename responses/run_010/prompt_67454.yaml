prompt: |-
  I am preparing a session for a graduate seminar on well-being that is cross-listed with our health policy program, and I want to put a real institutional practice under philosophical pressure rather than re-running the usual thought experiments. Last week a colleague from health economics walked the students through how his field decides which treatments a public payer will fund. As he described it, the appraisal works in quality-adjusted life years: every health state gets a weight between zero, assigned to being dead, and one, assigned to full health, so that a year lived in a state weighted at one half counts the same as half a year in full health. The weights are elicited by trade-off exercises — ask someone whether they would rather live ten years in a given state of ill health or a shorter period in full health; ask whether they would take a treatment with some probability of curing them and some probability of killing them — and those exercises are administered to representative samples of the general public rather than to people actually living in the states being valued. The states themselves are described by a standard instrument built on five dimensions: mobility, self-care, usual activities, pain and discomfort, and anxiety and depression. The resulting table of weights is then treated as the social value of those states, and cost per unit of benefit, measured against a threshold, decides what gets funded. My colleague was candid that this is a deliberate choice of perspective: the payer is society, so society's values should set the weights, and he noted the robust empirical finding that people living with a serious disability rate their own quality of life considerably higher than members of the public rate that same life for them — a divergence the practice resolves in favor of the public.

  What puzzles me is that the very same institution behaves as though it holds the opposite view at the bedside. Consent doctrine requires that a patient be told what a reasonable person in *this* patient's position would attach significance to, and a competent refusal must be honored even when everyone else regards the refused state as unbearable; a directive written by an earlier self binds a later self who, by all reports, is contented and does not want it enforced. So the system says, in allocation, that the value of a life in a given health state is fixed by what outsiders would trade to avoid it, and, in clinical ethics, that the value of that same life is fixed by the person living it. I would like you to write, in the voice of a philosopher who has genuinely worked through the health-economics literature rather than a generalist summarizing it, an account of what the allocation practice presupposes. Specifically: which theory of well-being does a system of population-elicited health-state weights require — a hedonist one, a desire-satisfaction one, an objective-list one, or something else? Please keep two questions apart, because I suspect the practice blurs them: what well-being *consists in*, and *whose* judgment about it is authoritative. Say what the practice strictly entails as opposed to what merely sits comfortably with it, and identify the points at which it is underdetermined, so that rival theories would license the same table of weights. Then test it against the classic objection that a life of pleasant illusion is worse than a life in contact with reality: does that objection get any purchase on a health-state weight whose descriptive dimensions are all states of the subject's own functioning and feeling, or does the practice already concede everything the objection wants? Finally, tell me which of the two practices — the population-weighted appraisal or the bedside deference — would have to be revised or abandoned if the appraisal body adopted a hedonist theory of well-being, and which if it adopted an objective-list theory instead, and say whether the inconsistency I have described is a genuine contradiction or two practices answering different questions.

  Before you write, work privately through the candidate theories and the two axes I have separated, and check your reconstruction against the details of the practice I have given — but do not show me that working. Think carefully rather than quickly. Lead with your bottom line in three or four sentences, then give the reconstruction. Cite nothing and list nothing to read; argue entirely from the description above. Keep the whole response to no more than 700 words.
reasoning: |-
  Hmm, the user is preparing a graduate seminar on well-being that combines philosophy and health policy. They want to critically examine institutional practices rather than just thought experiments. Specifically, they're concerned with an inconsistency between how health economics values health states for resource allocation versus how clinical ethics handles patient autonomy at the bedside.

  For resource allocation, health economists use quality-adjusted life years (QALYs) based on population surveys where the general public assigns weights to different health states. This approach prioritizes societal perspective over the lived experience of patients. At the bedside, however, medical ethics centers on patient autonomy - honoring individual refusals of treatment and advance directives even when others might disagree with their choices.

  The user wants me to analyze what theory of well-being underpins this QALY approach. I need to distinguish between what well-being consists of (hedonism, desire satisfaction, objective lists) versus whose judgment about it is authoritative. The practice strictly requires that well-being is measurable through observable functional dimensions and that societal judgment overrides individual experience. 

  The classic objection about pleasant illusions doesn't really challenge this framework since QALYs focus on self-reported functioning and feeling rather than truthfulness. The dimensions used (mobility, self-care, pain etc.) are all subjectively experienced states, so the illusion objection doesn't apply.

  Regarding the inconsistency between allocation and bedside practices: it's not a strict contradiction but reflects different institutional purposes. Allocation addresses social resource distribution using societal preferences, while clinical ethics protects individual sovereignty in treatment decisions. Adopting hedonism would intensify the allocation-bedside tension by making societal judgments even more authoritative about what constitutes well-being. Adopting an objective-list theory might bring allocation closer to bedside ethics if the list included autonomy as a fundamental good.

  The user seems deeply familiar with both philosophical theories and health policy mechanics. They're likely frustrated by how these fields talk past each other in practice. By examining this institutional tension, they're probably trying to help students bridge theory and real-world policy dilemmas. The core insight is recognizing that these practices answer different questions - distributive justice versus individual rights - rather than presenting a unified theory of wellbeing.
answer: |-
  ### Bottom Line
  The allocation practice presupposes a *societally authorized objective-list theory* of well-being. Well-being consists in objectively describable states of functioning and affect (mobility, pain, mood), measured through population trade-offs that *authoritatively* define social value. This clashes with bedside deference not logically but institutionally: allocation answers "What should society fund?" using collective preferences, while clinical ethics answers "What may we do to this person?" respecting individual authority. The pleasant illusion objection fails because the practice’s descriptive dimensions already capture subjective experience, conceding no ground to reality-contact as a separate good.

  ### Reconstruction
  **Theory of Well-Being Presupposed**  
  The practice strictly entails that well-being *consists in* objectively measurable functional and affective states. The five EQ-5D dimensions (mobility, self-care, etc.) are treated as exhaustive constituents of health-related well-being. This aligns with an *objective-list theory* where the list is defined by these descriptors. Crucially, it rejects desire-satisfaction: weights derive from observed trade-offs, not fulfillment of patients’ actual desires. Hedonism is insufficient, as pain/discomfort is only one dimension; anxiety/depression captures affective states but alongside functioning. The practice is *underdetermined* regarding non-health goods (e.g., relationships), but for health, it equates well-being with these specific function-affect states.

  **Authority Over Well-Being Judgments**  
  The practice strictly entails that *society’s aggregated preferences*, elicited from the public via trade-offs, authoritatively set the value of health states. This resolves the "disability paradox" (where patients rate their QoL higher than the public does) by privileging outsider perspectives. Well-being’s *composition* is objective (the dimensions exist independently), but its *valuation* is subject to social aggregation. No single theory of well-being dictates this; hedonism, desire-satisfaction, or objective lists could all license societal authority in resource allocation. However, the practice is incompatible with theories granting *individuals* final authority over their well-being’s value.

  **The Pleasant Illusion Objection**  
  This objection loses traction. If a patient with delusional happiness reports low pain and high mobility on the EQ-5D, their QALY weight reflects this self-assessment. The dimensions are explicitly "feeling" and "functioning" states *as experienced by the subject*. The practice thus operationalizes well-being as *felt function/affect*, not reality-adjusted flourishing. An objectivist might protest, but the framework has no lever to value "contact with reality" beyond its inclusion in anxiety/depression.

  **Reconciling Allocation and Bedside Practices**  
  - **Under Hedonism**: Allocation would tighten its focus on pain/pleasure, potentially excluding functional dimensions. Bedside deference might weaken if pleasure-maximization overrides refusals (e.g., forcing antidepressants on a "happy" but disabled patient). The inconsistency *increases* as allocation emphasizes societal hedonistic calculus, clashing with individual hedonic authority at the bedside.  
  - **Under Objective-List Theory**: If autonomy is on the list (e.g., as "usual activities" or a new dimension), allocation might weight states restricting autonomy lower. Bedside deference could be *strengthened* if autonomy is objective. The inconsistency *decreases* if both practices recognize objective autonomy.  

  **Is This a Contradiction?**  
  No. Allocation answers a distributive question ("What maximizes social value per resource?"), requiring comparable, aggregate measures. Bedside ethics answers an interpersonal question ("What constitutes violation of this person?"), requiring respect for individual standpoint. The tension arises because both use "well-being" language for distinct institutional tasks—not from incompatible theories of the good. Society can consistently say: "We fund interventions based on collective valuations of health states (allocation), but we coerce no one into receiving them against their will (bedside)." The moral inconsistency is political, not logical.
