answer: |-
  ### Exam Question (25 marks, 90 minutes, closed book)

  **Question:** A student presents the following argument to derive the Born Rule probabilities within the Everett interpretation:

  > *Suppose an electron is prepared in the state* \(\sqrt{\frac{1}{3}}|\text{up}\rangle + \sqrt{\frac{2}{3}}|\text{down}\rangle\) *and is measured along the z-axis. After the measurement, both outcomes occur in separate branches. Since the only uncertainty is which branch I am in, and I have no information distinguishing them, the Principle of Indifference suggests equal credence for each branch. However, the amplitudes are unequal. To resolve this, I refine the measurement apparatus so the "down" outcome branch splits into two new branches, each with amplitude* \(\sqrt{\frac{1}{3}}\)*. Now there are three branches of equal amplitude: one "up" and two "down". Applying indifference again, my credence in "up" should be 1/3 and in "down" 2/3—matching the Born Rule.*

  1.  **Critically evaluate** whether step (iii) (refinement into three equal branches) genuinely *derives* the Born Rule weights or merely *repackages* them. (15 marks)
  2.  How does this strategy fail when the squared amplitudes \(|\alpha|^2\) and \(|\beta|^2\) of the initial superposition \(\alpha|\text{up}\rangle + \beta|\text{down}\rangle\) are **not** in a rational ratio (e.g., \(\sqrt{\frac{1}{\pi}}|\text{up}\rangle + \sqrt{1 - \frac{1}{\pi}}|\text{down}\rangle\))? Does attempting an *approximate* refinement solve the problem? Explain why or why not. (10 marks)

  ---

  ### Model Answer (~700 words)

  The student's argument attempts to derive the Born Rule from branch counting plus indifference by exploiting branch refinement. While clever, it fails to provide a genuine derivation and instead presupposes the Born Rule, especially when amplitudes lack rational squared ratios.

  #### 1. Repackaging, Not Derivation (Step iii)
  Step (iii) does not *derive* the Born Rule weights; it *repackages* them while creating the illusion of derivation through indifference over symmetrized branches. The critical flaw lies in **what justifies the specific refinement procedure** and its **physical significance**.

  *   **Presupposing the Weight:** The refinement splits the "down" branch into two branches *each with amplitude* \(\sqrt{1/3}\). Why split it into precisely *two* branches? Because \(2/3 \div 1/3 = 2\). The number of sub-branches created is chosen *explicitly* to make the new branch amplitudes equal *and* proportional to the original Born Rule probability (2/3 becomes two branches of 1/3). The Born Rule probability (here, \(|\beta|^2 = 2/3\)) dictates the refinement structure. The student uses the Born Rule to *set up* the scenario where indifference *appears* to yield it.
  *   **Basis Dependence & Physical Meaning:** Branching arises from decoherence, which defines the preferred basis. Arbitrary refinement (e.g., splitting one branch but not another) is physically unmotivated unless it corresponds to a real interaction inducing further decoherence. Crucially, decoherence preserves the total amplitude weight of a macro-branch. The original "down" branch had weight \(|\sqrt{2/3}|^2 = 2/3\). After refinement into two equal sub-branches, *each* sub-branch has weight \(|\sqrt{1/3}|^2 = 1/3\), so the *total weight* for the "down" outcome remains \(1/3 + 1/3 = 2/3\). The refinement changes the *granularity* of the branching structure *within* the "down" macrostate, but it does not alter the fundamental weight \(2/3\) assigned to the *macrostate* itself by the underlying quantum state. Indifference applied post-refinement yields 2/3 for "down" *only because* the refinement was engineered to distribute the pre-existing weight \(2/3\) across two branches. The weights are conserved and drive the counting; indifference merely counts what the weights have already distributed.

  The argument conflates branches defined by the quantum state (with intrinsic weights) with the *countable outcomes* indifference requires. It uses refinement to *manufacture* a set of branches that are *numerically* symmetric *because* they reflect the pre-existing weights. The Born Rule is assumed in the construction of the countable set, not derived from it. Step (iii) is a formal trick, not a justification.

  #### 2. The Irrational Ratio Problem and Approximations
  The strategy fails catastrophically when the squared amplitudes \(|\alpha|^2\) and \(|\beta|^2\) are not rational numbers (e.g., \(\sqrt{1/\pi}|\text{up}\rangle + \sqrt{1 - 1/\pi}|\text{down}\rangle\)).

  *   **Exact Refinement Impossibility:** The core of the student's argument relies on splitting a branch (say, "down" with weight \(w = |\beta|^2\)) into \(k\) sub-branches, each with *identical* amplitude \(\sqrt{w/k}\). For the sub-branches to have equal amplitude and for \(k\) to be an integer, \(w/k\) must be a rational number. If \(w = 1/\pi\) (irrational), there exists *no integer* \(k\) such that \(w/k\) is rational (since \(\pi\) is transcendental), and thus no way to split the branch into an integer number of sub-branches with *equal* amplitude. The equalization move is impossible to run exactly.
  *   **Approximate Refinement Fails:** One might try splitting into \(k\) sub-branches with *approximately* equal amplitude \(\approx \sqrt{w/k}\), making the weights *close* to rational fractions. However, this fails to solve the problem:
      *   **Justification of Approximation:** What metric defines "close"? The natural metric is the difference in the Born Rule probabilities themselves (\(\sum |\text{approx weight}_i - w/k|\)). Using this metric presupposes the Born Rule as the standard for correctness. Approximating *assumes* what needs to be derived.
      *   **Indifference Application:** Applying indifference to the \(k\) approximately equal sub-branches would yield a credence for "down" of approximately \(k \times (w/k) = w\) – again, just giving back the input Born Rule weight \(w\). It doesn't derive \(w\); it outputs an approximation of \(w\) *because* the setup was designed to approximate \(w\).
      *   **Residual Uncertainty:** More fundamentally, the sub-branches are *not* truly identical due to the approximation. There is now *empirical* information distinguishing them (their slightly different weights/amplitudes). Applying indifference to non-identical branches is unjustified. The student's original indifference premise relied on "no information distinguishing the branches," which is violated by the imperfect refinement.

  The irrational case exposes the circularity starkly. Without the Born Rule, there is no physically motivated way to define a "good enough" approximation for refinement, nor a justification for applying indifference to branches made intentionally similar *only* by presupposing the Born Rule as the target. The strategy is entirely dependent on the initial weights and cannot derive them when they lack the convenient property of rational squared magnitudes. The Born Rule weights remain primitive within this approach.

  ---

  ### Marking Scheme (25 marks total)

  **General Principles:**
  *   **A (21-25 marks):** Demonstrates deep understanding of the circularity in step (iii) *and* the fatal flaw with irrationals. Explicitly connects refinement to basis-dependence *and* weight conservation. Clearly explains why approximation fails by presupposing the Born Rule metric. Structured, precise, no significant errors.
  *   **B (16-20 marks):** Identifies key issues (presupposition in refinement, problem with irrationals) but lacks depth or misses crucial nuances. May state refinement repackages weights but not clearly explain *how* (e.g., omits weight conservation). Discusses irrationals but offers a weak or incomplete critique of approximation. Generally correct but less incisive.
  *   **C (11-15 marks):** Superficial. Mentions "basis dependence" or "indifference inapplicable" without explaining *why* refinement is problematic or how irrationals break it. May assert step (iii) works/derives BR without critical analysis. Fails to engage with the core challenges posed.
  *   **D (6-10 marks):** Significant misunderstandings (e.g., confuses amplitudes/probabilities, misstates Born Rule, thinks indifference works pre-refinement). Little grasp of the argument's structure or flaws.
  *   **E (0-5 marks):** Irrelevant, minimal attempt, or completely incorrect.

  **Part 1: Step (iii) - Derivation or Repackaging? (15 marks)**
  *   **A-grade Moves (Must be present for top marks here):**
      *   Explicitly states refinement **presupposes the Born Rule weight** to determine *how many* sub-branches to create (e.g., "splits into 2 *because* 2/3 ÷ 1/3 = 2"). (3 marks)
      *   Explains that refinement **conserves the total weight** of the macro-branch (\(2/3\) remains \(2/3\) total for down sub-branches). (3 marks)
      *   Argues indifference applied *post-refinement* yields the Born Rule **only because** the setup was engineered using the Born Rule, making it circular/repackaging. (3 marks)
      *   Connects this to the **physical basis** (decoherence defines macrobranches with weights; refinement alters microstructure within a macro-branch). (3 marks)
      *   Concludes step (iii) does not derive but repackages. (1 mark)
      *   *(Mere "basis dependence" mention without weight conservation/engineering: ≤ 2 marks)*
  *   **Common Errors (Marks deducted):**
      *   Claims step (iii) successfully derives the Born Rule (-5 to -7 marks).
      *   Only states "branches aren't countable/indistinguishable" without linking to *how refinement exploits this* (-3 marks).
      *   Focuses only on pre-refinement indifference being wrong (neglecting the engineered post-refinement scenario) (-3 marks).
      *   Confuses amplitude with probability (e.g., "splitting changes the probability") (-2 marks).

  **Part 2: Irrational Ratios & Approximations (10 marks)**
  *   **A-grade Moves (Must be present for top marks here):**
      *   Correctly states **exact refinement is impossible** for irrational squared amplitudes (no integer k makes w/k rational). (2 marks)
      *   Explains that **approximate refinement requires defining "closeness"** using the Born Rule metric (e.g., sum of |actual sub-branch weight - target weight|), thus **presupposing the Born Rule**. (3 marks)
      *   Argues that applying indifference to **approximately equal branches is unjustified** because they are distinguishable by their slight differences (violating the indifference premise). (2 marks)
      *   Notes that the output credence (~w) is only correct *because* the input target was w, again showing circularity. (2 marks)
      *   Concisely summarizes that the strategy fails fundamentally for irrationals, exposing its dependence on the pre-existing weights. (1 mark)
  *   **Common Errors (Marks deducted):**
      *   Claims approximate refinement solves the problem (-5 marks).
      *   Only states "you can't split into fractional branches" without addressing approximation (-2 marks).
      *   Suggests using a large k for good approximation but fails to critique *why* closeness is defined by Born Rule or distinguishability (-3 marks).
      *   Argues indifference still applies to approximate branches (-2 marks).
      *   Confuses irrational amplitudes with irrational probabilities (-1 mark).
