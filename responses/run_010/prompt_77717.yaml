  This is quite sophisticated. I need to recall that no-free-lunch theorems require very specific conditions: finite search spaces, deterministic non-revisiting algorithms, and crucially - averaging over all possible permutations of fitness values. The uniform average over all possible problems is mathematically correct but practically irrelevant since we don't face all possible problems.

  For the correspondence table:
  - Search space = genotype space in biology, policy space in AI
  - Fitness function = actual fitness landscape in biology, reward function in AI
