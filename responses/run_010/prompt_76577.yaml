prompt: |-
  I referee manuscripts for a journal that publishes work on the metaphysics of biology, and a large share of what crosses my desk proposes a new definition of life. My reports have turned out to be inconsistent: I have praised one proposal for refusing to build in features of terrestrial organisms and then faulted a different proposal for exactly that refusal. So I want the rubric written down before I read anything further.

  Your task is to specify what a definition or criterion of life must do in order to be adequate — the phenomena it must account for, the cases it must classify correctly, the distinctions it may not collapse, and the results from biology and thermodynamics it may not contradict. For each requirement, give the consideration or case that motivates it, and say concretely what violating it looks like.

  Fix the purpose as follows, and index the requirements to it, because I expect several of them to derive from only one of the two. The criterion must serve (a) as an inclusion standard for a synthetic-biology program that assembles cell-like systems from non-living components and needs to know when, if ever, it has crossed the line, and (b) as a discovery standard for an instrument aboard a sample-return mission, which will have a single aliquot of a single sample and can return only bulk chemical and physical measurements of it — no observation across generations, no lineage, no ecological context.

  The rubric must be tested against a specific set of cases. I have grouped them because the groups fail in structurally different ways, and I want to know which group does the most damage:

  1. Parts and dependents: a mitochondrion; an obligate intracellular bacterial endosymbiont whose genome has been reduced to a small fraction of its free-living relatives' and which cannot be cultured outside its insect host; a giant DNA virus carrying genes for several components of the translational apparatus, itself parasitized by a much smaller virus that replicates inside its replication factory and cripples the production of normal progeny; a prion; a plasmid.

  2. Living things not currently doing anything recognizably alive: a bacterial endospore, or a tardigrade in its dehydrated state, with metabolism below detection for decades; a seed held in frozen storage; a sterile mule; a sterile worker that will never reproduce although its colony persists.

  3. Living things whose individuality is unclear: a siphonous green alga consisting of one cell containing thousands of nuclei and no internal cross-walls, which nonetheless differentiates frond-like and holdfast-like structures and regenerates a whole thallus from a fragment; a clonal aspen stand of tens of thousands of stems sharing one root system and one genome; a mycelial network spanning hectares; a multinucleate plasmodium that streams, solves mazes, and can be cut into pieces each of which reorganizes into a complete organism.

  4. Non-living things that satisfy most process-based criteria: a candle flame; a crystal growing in solution; a hurricane; a self-replicating program; a city or a market.

  5. Transitional and merely possible systems: a membraneless autocatalytic network of polymers that persists, varies, and is selected; a fatty-acid vesicle that grows and divides but carries no heredity; a hypothetical biosphere in which genetic material moves promiscuously among organisms, so that reproductive lineages do not exist and the only individual is the biosphere as a whole.

  Beyond the cases, address the structural questions that I suspect decide most of these disputes: whether a criterion may appeal to a system's history and lineage or must be intrinsic to a time-slice; whether life is a property of individuals or of populations; whether the term is being treated as picking out a natural kind with an underlying explanation, or as a family-resemblance term for which any definition can only restate a cluster of correlates; how much extensional accuracy may be bought at the cost of informativeness; and whether requiring agnosticism about biochemistry is a genuine requirement or a constraint that makes sense only for one of my two purposes.

  Then answer three questions explicitly. Which requirements I would be tempted to include are not neutral desiderata but the commitments of particular camps, and which camp each belongs to. Whether any subset of the genuine requirements is jointly unsatisfiable — and if so, demonstrate it, because I expect the impossibility result to be more informative than any list. And which single requirement eliminates the most candidates. In this connection, consider the pair formed by groups 1 and 4: my conjecture is that no single list keeps the flame out and the virus in, and I want to be told whether that is a real impossibility or an artifact of how I have described the two cases.

  Close with a brief scoring — a paragraph at most for each — of the four families I actually encounter: cluster accounts built on metabolism, homeostasis, and organization; autopoietic or individuality-based accounts; evolutionary accounts that make the capacity for Darwinian evolution constitutive; and thermodynamic accounts that treat living systems as one class of far-from-equilibrium dissipative organization. Keep this short. The thinking I want is in the rubric, not the verdicts.

  Two constraints. Give me no references, no bibliography, no reading list, and do not attribute claims to named authors; I want the reasoning, not the sourcing. And do not dispose of the question by concluding that life is a cluster concept or that the term is stipulative — if you believe that is the correct conclusion, say what the rubric looks like for a concept of that kind, and identify which of my cases it leaves unsettled. A table is acceptable for the rubric itself if you prefer.
reasoning: |-
  Hmm, the user is asking for a detailed rubric to evaluate definitions of life, specifically tailored for their work as a referee in metaphysics of biology. They want clear criteria that must be satisfied, motivated by specific cases, with explicit violations. The purposes are dual: (a) synthetic biology assembly line-crossing and (b) astrobiological sample-return instrumentation. The cases are grouped into five categories that fail definitions in different ways, and I need to analyze which group causes the most problems.

  First, I need to derive requirements from the two purposes. For purpose (a), synthetic biology needs intrinsic observability in a single system/time-slice, as they're assembling from non-living parts and need to detect when life emerges without historical context. This means the definition must avoid historical properties. For purpose (b), the instrument can only take bulk measurements of a single sample, so it can't track populations, lineages, or changes over time. So requirements must focus on compositional and state-based features observable in one aliquot.

  Key requirements emerge:
  - Intrinsicality: No dependence on history or lineage, only current state.
  - Individual-level applicability: Must apply to the sample/system itself, not populations.
  - Observability in static bulk measurement: Detectable through chemistry/physics without needing temporal or ecological data.
  - Independence from specific biochemistry: Agnostic to Earth-like molecules.
  - Boundary maintenance: Something to distinguish the system from its environment, crucial for both purposes.

  For the cases, I need to see how they violate these. Group 1 (parts like mitochondria) fails because they lack autonomy - they're dependent on hosts. Group 4 (flames, crystals) often gets misclassified by process-based definitions but should be excluded. The big challenge is indeed balancing viruses (which might be included) with flames (which must be excluded), and I suspect the autonomy requirement is key - viruses don't maintain their own boundaries or metabolism.

  Structural questions are critical. History vs. time-slice: Must be time-slice for purpose (b). Individuals vs. populations: Individuals for both purposes. Natural kind vs. cluster: Should aim for natural kind with underlying thermodynamics, but extensional accuracy can't be perfect. Agnosticism about biochemistry is necessary for astrobiology but less so for synthetic biology where context is known.

  For the questions:
  - Temptations that are camp-specific: Requiring reproduction is evolutionary camp, homeostasis is organizational camp, etc.
  - Unsatisfiable requirements: Thermodynamic openness + intrinsic individuation + information control is impossible to satisfy simultaneously without trade-offs.
  - Most eliminative requirement: Autonomous individuation knocks out most of Group 1 and Group 4.

  Finally, scoring standard families briefly:
  - Cluster accounts: Too Earth-centric, fail agnosticism.
  - Autopoietic: Good boundaries but miss dormant cases.
  - Evolutionary: Require lineage, impossible for purpose (b).
  - Thermodynamic: Good foundation but overinclude hurricanes.

  I'll structure this with a rubric table first, then case analysis, then structural answers, then camp questions, ending with family scores. The conclusion will validate that the virus/flame tension is real - autonomy requirement keeps viruses out but might be necessary, showing the impossibility in current definitions.
answer: |-
  Below is a rubric for evaluating definitions of life, indexed to your dual purposes (synthetic biology assembly line-crossing and astrobiological sample-return). Requirements are derived from these purposes, with violations illustrated via your cases. A table summarizes the rubric, followed by analysis of cases, structural questions, and explicit answers to your queries.

  ---

  ### **Rubric for Definitions of Life**  
  *(Table: Requirements, Purpose Link, Motivation, Violation Example)*  

  | Requirement                                  | Purpose | Motivation                                                                 | Violation Example                                  |
  |----------------------------------------------|---------|----------------------------------------------------------------------------|----------------------------------------------------|
  | **1. Intrinsicality**: Must be decidable from current state properties alone, without historical/lineage data. | (b)     | Sample-return mission lacks lineage/ecological context; must judge from single aliquot. | Faulting a bacterial spore for not *currently* reproducing. |
  | **2. Individual-level applicability**: Must apply to the discrete sample/system itself, not requiring population-level dynamics. | (a),(b) | Synthetic biology assembles single systems; instrument analyzes one aliquot. | Claiming a sterile mule isn't alive because it can't contribute to evolution. |
  | **3. Observable in static bulk measurement**: Must be detectable via chemical/physical properties (e.g., composition, gradients, structure) without requiring observation of processes over time. | (b)     | Instrument returns only bulk data; no temporal monitoring. | Requiring observed metabolism for a dormant tardigrade. |
  | **4. Biochemical agnosticism**: Must not presuppose Earth-like biochemistry (e.g., DNA, proteins). | (b)     | Astrobiology seeks unknown life; Earth-centricity risks false negatives. | Excluding a silicon-based autocatalytic network for lacking carbon. |
  | **5. Autonomous individuation**: System must maintain a persistent, distinct boundary *and* internal organization decoupled from immediate environment. | (a)     | Synthetic biology needs to identify when a system becomes self-sustaining; avoids "parts" like mitochondria. | Calling a mitochondrion alive (fails autonomy) or a hurricane alive (fails decoupling). |
  | **6. Thermodynamic openness**: Must require continuous energy dissipation maintaining internal order. | (a),(b) | Life is thermodynamically distinct; avoids misclassifying static crystals. | Including a crystal (no dissipation) or excluding a dormant seed (metabolism paused). |
  | **7. Information-constrained metabolism**: Must include regulated energy-driven processes (metabolism) *directed* by inheritable information. | (a),(b) | Avoids overinclusion (e.g., flames); explains heredity in synthetic/astro contexts. | Including a candle flame (no information) or excluding a plasmid (no metabolism). |

  ---

  ### **Analysis of Case Groups**  
  *Group most damaging to requirements: **Group 1 (Parts and dependents)**.*  
  - **Why**: Violates **Autonomous individuation** (mitochondrion, plasmid) and **Individual-level applicability** (endosymbiont). A definition excluding these but including free-living cells requires strict autonomy, yet this risks excluding viruses—which are critical for astrobiology (purpose b). Group 1 exposes irreconcilable tension between autonomy and information-based requirements.  
  - *Other groups*: Group 2 challenges **Observability** (dormancy); Group 3 challenges **Individual-level applicability** (fuzzy boundaries); Group 4 violates **Information-constrained metabolism** (flames) or **Thermodynamic openness** (crystals); Group 5 tests **Biochemical agnosticism** and **Intrinsicality**.  

  ---

  ### **Structural Questions**  
  1. **History vs. time-slice**: Must be time-slice (**Intrinsicality**). Purpose (b) cannot access history.  
  2. **Individuals vs. populations**: Must apply to individuals (**Individual-level applicability**). Both purposes focus on single systems.  
  3. **Natural kind vs. cluster**: Should target a natural kind (thermodynamic-informational) to avoid extensional vagueness. Cluster approaches fail purpose (a): they can’t pinpoint when the "line" is crossed in synthesis.  
  4. **Extensional accuracy vs. informativeness**: Prioritize extensional accuracy *for astrobiology* (purpose b) to avoid false negatives. Synthetic biology (purpose a) tolerates more stipulation.  
  5. **Biochemical agnosticism**: Genuine requirement for astrobiology (purpose b), but synthetic biology (purpose a) can assume Earth-like context.  

  ---

  ### **Explicit Answers**  
  1. **Tempting but camp-specific requirements**:  
     - *Reproduction*: Evolutionary camp. Violates **Observability** (dormant cases) and **Individual-level applicability** (sterile workers).  
     - *Homeostasis*: Organizational/cluster camp. Violates **Biochemical agnosticism** if tied to specific mechanisms (e.g., lipid membranes).  
     - *Lineage-based evolution*: Strict Darwinian camp. Violates **Intrinsicality** and **Individual-level applicability**.  

  2. **Jointly unsatisfiable requirements**: **Autonomous individuation** + **Information-constrained metabolism** + **Intrinsicality** is unsatisfiable for Group 1.  
     - *Demonstration*: A virus satisfies information (genes) and intrinsicality (time-slice virion structure) but fails autonomy (no self-sustaining metabolism). An endosymbiont satisfies information and metabolism but fails autonomy (host-dependent). No candidate in Group 1 satisfies all three, yet excluding them risks false negatives in astrobiology (e.g., viruses).  

  3. **Most eliminative requirement**: **Autonomous individuation**.  
     - *Eliminates*: Most of Group 1 (mitochondria, plasmids, endosymbionts), Group 4 (flames, hurricanes lack decoupled organization), and Group 5 (vesicles without heredity).  
     - *Virus-flame tension*: Your conjecture holds: **Autonomous individuation** excludes flames (no persistent boundary/internal control) *and* viruses (no self-sustaining metabolism). Including viruses requires relaxing autonomy (e.g., to information-carrying systems), which risks including self-replicating programs (Group 4). This is a real impossibility—no requirement set fully reconciles them without trade-offs in purposes.  

  ---

  ### **Scoring Definition Families**  
  1. **Cluster (metabolism/homeostasis/organization)**: Fails **Biochemical agnosticism** (often Earth-centric) and **Observability** (dormancy). Overincludes Group 4 (flames satisfy metabolism/organization). Poor for (b).  
  2. **Autopoietic/individuality-based**: Strong on **Autonomous individuation** and **Boundary** requirements. Excludes Group 1 cleanly but fails **Observability** (dormant seeds) and **Individual-level applicability** for Group 3 (fuzzy individuals). Best for (a).  
  3. **Evolutionary (Darwinian capacity)**: Fails **Intrinsicality** and **Observability** (needs lineages/time). Useless for (b); excludes Group 2 (dormant/sterile cases).  
  4. **Thermodynamic dissipative structures**: Strong **Thermodynamic openness** foundation. Fails **Information-constrained metabolism** (overincludes Group 4 hurricanes) and **Autonomous individuation** (misses informational control). Needs supplementation for (a)/(b).  

  ---  
  **Conclusion**: The rubric prioritizes astrobiology (purpose b) due to stricter constraints, forcing trade-offs for synthetic biology (purpose a). Group 1 is maximally damaging as it forces a choice between autonomy (excluding viruses) and flexibility (risking flames). A definition satisfying all requirements must center on *intrinsic, observable, information-guided dissipation in an individuated system*—but Group 5 (transitional systems) remains contentious under this.
