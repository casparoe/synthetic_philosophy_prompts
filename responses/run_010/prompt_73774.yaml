  ### Sorting Instrument: Lying vs. Misleading  
  *Fill this out before our seminar. For each scenario, choose the reaction that best captures your judgment. Base your answers solely on the case details.*

  ---

  #### **Question 1: Unwitting Falsehood**  
  **Scenario**: Sam accidentally gives Alex incorrect flight details. Alex asks, "Is my flight at 9 AM?" Sam checks a *reliable* app (which glitched) and says, "Yes, it’s at 9 AM." The flight is actually at 10 AM.  
  ☐ **A. Sam lied to Alex.**  
  ☐ **B. Sam misled Alex but did not lie.**  
  ☐ **C. Sam was truthful—they had no reason to doubt the app.**  

  #### **Question 2: Evasive Answer**  
  **Scenario**: Taylor sells a car with hidden engine issues. When asked, "Is the engine reliable?" Taylor says, "It’s never broken down on me," (true) but omits the known defects.  
  ☐ **A. Taylor lied—they dodged the truth about the engine.**  
  ☐ **B. Taylor misled without lying—the statement was true.**  
  ☐ **C. Taylor was truthful—the buyer should’ve asked directly.**  

  #### **Question 3: Mental Reservation**  
  **Scenario**: Jamie hides from a pushy salesperson. When asked, "Is Jamie home?" they say, "Jamie isn’t here," mentally adding *"to you"* (Jamie is home).  
  ☐ **A. Jamie lied—they intended to deceive.**  
  ☐ **B. Jamie misled without lying—the words were true.**  
  ☐ **C. Jamie was truthful—the salesperson misunderstood.**  

  #### **Question 4: Future Implications**  
  **Scenario**: Casey knows a "quiet" neighborhood will have construction next month. They tell a buyer, "It’s very quiet here," (true today). The buyer assumes long-term quiet.  
  ☐ **A. Casey lied—they intended to deceive about the future.**  
  ☐ **B. Casey misled without lying—the statement was factually true.**  
  ☐ **C. Casey was truthful—the buyer’s assumption isn’t their fault.**  

  #### **Question 5: Entitlement to Clarity**  
  **Scenario**: Morgan sells a painting "from the studio of Renoir" (true—painted by a student). Riley buys it, thinking it’s by Renoir. Morgan doesn’t correct them.  
  ☐ **A. Morgan lied—Riley deserved to know it wasn’t by Renoir.**  
  ☐ **B. Morgan misled without lying—the statement was accurate.**  
  ☐ **C. Morgan was truthful—Riley jumped to conclusions.**  

  #### **Question 6: Ambiguous Affection**  
  **Scenario**: Avery doesn’t love Blake but says, "I care about you deeply" (true). Blake believes this means love.  
  ☐ **A. Avery lied—they implied love they don’t feel.**  
  ☐ **B. Avery misled without lying—the words were true.**  
  ☐ **C. Avery was truthful—Blake’s interpretation is their own.**  

  #### **Question 7: Moral Weight of Identical Beliefs**  
  **Scenario**: A politician accepts oil donations. When asked, they say, "I follow campaign laws" (true), deflecting guilt. Voters falsely believe they refuse oil money. **Compared to lying (saying "I refuse oil money"), this is...**  
  ☐ **A. Just as bad—it creates the same false belief.**  
  ☐ **B. Less bad—no false statement was made.**  
  ☐ **C. Worse—it’s sneakier than lying.**  

  ---

  ### Scoring Key & Your Position  
  *Tally your answers and find your leaf below. Combinations with no known philosophical defender are marked.*

  | **Leaf** | **Description** | **Answer Pattern** |
  |----------|----------------|---------------------|
  | **A** | Lying and misleading differ in kind; the difference is **morally significant** (lying is worse). | Q1–Q6: Mostly **B**; Q7: **B**. |
  | **B** | Lying and misleading differ in kind; the difference is **morally idle** (equally wrong). | Q1–Q6: Mostly **B**; Q7: **A**. |
  | **C** | Misleading **collapses into lying** by expanding "asserted content" (true statements can lie via implication). | Q1: **A**; ≥4 **A** in Q2–Q6. |
  | **D** | Misleading **collapses into lying** by prioritizing the speaker’s **intent to deceive**. | Q1: **B**; ≥3 **A** in Q2–Q6. |
  | **E** | **Sceptical**: The line is too context-dependent to bear philosophical/moral weight. | ≥3 **C** answers in Q1–Q6. |
  | **F** | **Hearer’s entitlement**: Lying occurs when the hearer’s reasonable expectations are violated (even if the statement is true). | **A** in Q5 + **B** in Q1, Q2, Q3, Q4, Q6. |

  #### Notes on Unsupported/Ambiguous Combinations  
  - **Q1=A + <4 A’s in Q2–Q6**: No major defender. Arguably *incoherent*—accepts unwitting lies (Q1) but rejects intentional ones (Q2–Q6).  
  - **Q7=C + mostly B in Q1–Q6**: No clear defender. *Unattractive*—deems misleading sneakier than lying without principled distinction.  
  - **Indeterminate Cases**: Leaves **A** and **B** rely on consistent "B" answers in Q1–Q6; if mixed, default to **E**.  
  - **Unseparable Leaves**: **C** and **D** may overlap if all Q2–Q6 are **A** (both collapse misleading into lying). **A** and **F** are separated only if Q5 is pivotal.  

