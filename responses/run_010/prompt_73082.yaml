prompt: |-
  I want help extracting a principle from a set of verdicts about when a person has standing to blame. The cases and my reactions are below. I have tried to record the reactions as I actually have them rather than tidily, and I have flagged two that look to me irreconcilable. Treat the verdicts as data to be systematized, not as positions to be defended, and do not bother with attributions or the secondary literature; I want the principle, not the bibliography.

  To hold the subject fixed: in every case the blamer's judgment is accurate, the conduct really is blameworthy, and the blamer is lying about nothing. Only the question of standing varies.

  1. A colleague who is himself chronically and conspicuously late rebukes me, in front of the whole group, for arriving ten minutes after the start. Verdict: he lacks standing. I feel entitled to brush the rebuke off entirely, even though he is right.

  2. The same colleague, with the same record, takes me aside afterward and says quietly that my lateness cost us the client's confidence. Verdict: this one lands. If I answered with the usual retort about who is talking, I would be dodging. Cases 1 and 2 differ only in manner, audience, and apparent purpose, and my verdicts differ with them; so standing cannot be purely a function of the blamer's own record.

  3. A friend who has never been unfaithful tells me my infidelity is a serious wrong. Verdict: full standing, unremarkable.

  4. My brother, who has skipped exactly as many visits to our mother as I have and for equally poor reasons, blames me for not visiting. Verdict: he lacks standing, though what he says is true and though I would accept the same words from the friend in 3.

  5. A man who drank heavily for twenty years and has been sober for ten tells our mutual friend, who is now drinking the same way, that it will destroy him. Verdict: standing, and more of it than I would have with the same words.

  6. The same man relapsed last month and has told no one. He says the same thing to the same friend. Verdict: I think he now lacks standing. This is the pair I cannot reconcile with 5. Nothing about his epistemic position, his concern, or the usefulness of the warning has changed, and the friend could not detect the difference. If the loss of standing is real it must be produced by a fact invisible to everyone but the blamer; if it is not real, then my reaction to 5 was tracking something I have misdescribed.

  7. Someone who plagiarized once thirty years ago, was sanctioned, made amends, and has been scrupulous since tells a student that plagiarism is a serious wrong. Verdict: standing intact; the past is beside the point.

  8. A stranger of impeccable character with no connection to my family sees me speak sharply to my child in a supermarket and says that how I spoke was cruel. Verdict: he lacks standing, and not because of any fault of his. My reaction is not that he is a hypocrite but that it is not his.

  9. The same stranger sees a man kick a dog in the street and says so. Verdict: full standing, and he ought to say something. As far as I can tell, 8 and 9 differ only in whether the wrong is the sort of thing that is anyone's to address.

  10. A company publishes a statement blaming consumers for plastic waste while lobbying against deposit schemes. Verdict: no standing. I have the same verdict about the identical statement from an employee who privately opposed the lobbying and said so in meetings, and I am not confident I want to keep that second half.

  11. The person I wronged has forgiven me; a third party who was not wronged keeps blaming me for it. Verdict: the third party lacks standing to blame me on the victim's behalf but retains standing to blame me for what the conduct shows about my character generally.

  My tentative principle is that standing requires both that the blamer not be exempting himself from a standard he is endorsing, and that he stand in some relation to the wrong or to the person wronged that makes it his to address. Both clauses feel necessary, neither feels sufficient, and I suspect the first is misstated because of 5, 7, and 9.

  What I want back: a principle, or a small number of competing candidates, stated precisely enough that a novel case could be run through it mechanically. For each clause, name the case that motivates it. Then tell me what the principle says about cases I have not raised, at minimum these: someone who blames another for a wrong he fully intends to commit tomorrow; someone who committed the same wrong but believes non-culpably that he did not; blame directed at a person long dead; two equally complicit people blaming each other simultaneously and sincerely; and whether a person can lack standing to blame himself. Finally, say plainly which of my eleven verdicts the principle cannot preserve, which single one you would have me give up, and what the cost of giving it up would be.
reasoning: |-
  Hmm, this user is asking me to extract a standing principle from their verdicts about blame scenarios. They've provided 11 specific cases with their intuitive judgments, and I need to systematize these into a precise principle that can be applied mechanically to new cases. The user has also flagged two cases (5 and 6) as apparently irreconcilable.

  Looking at their tentative principle, they suggest standing requires two elements: (1) the blamer not exempting themselves from the standard, and (2) some relational connection to the wrong or wronged party. They're concerned the first element might be misstated because of cases 5, 7 and 9.

  Let me analyze these cases systematically. The key patterns emerging are:

  First, hypocrisy matters but isn't decisive. Cases 1 and 4 show hypocrisy removing standing, while case 3 shows clean hands granting it. But case 2 demonstrates that manner and context can override hypocrisy concerns, and cases 5 and 7 show past violations don't necessarily remove standing if they're sufficiently resolved.

  Second, relational context is crucial. Cases 8 and 9 are particularly telling - both involve strangers, but only in the dog-kicking case does the stranger have standing. This suggests some wrongs are "public" while others are "private" family matters. Case 11 further confirms this distinction between standing for the specific wrong versus general character judgment.

  The big puzzle is cases 5 and 6. In 5, the recovered alcoholic has standing; in 6, after relapse, they don't - despite identical outward circumstances. The only difference is the blamer's private knowledge of their own current violation. This suggests that for standing, one must currently satisfy the standard oneself, not just in the past or in principle.

  Case 10 shows institutional hypocrisy matters too - the company lacks standing regardless of individual employees' private views. Case 7 confirms that fully resolved past violations don't undermine standing.

  Based on this, I'll formulate a principle with two core components: current compliance with the standard, and appropriate relational nexus. For the latter, I'll define three types of nexus: (a) victim/special relationship, (b) community guardian for public wrongs, or (c) shared accountability space.

  For novel cases:
  - Intending future wrong: lacks standing due to current non-compliance
  - Non-culpable self-misperception: still lacks standing (current violation is objective)
  - Blaming the dead: no standing for specific wrong (unless historical pattern), but general character standing possible
  - Mutual blame: both lack standing due to current non-compliance
  - Self-blame: always has standing (unique position)

  The principle can't preserve case 6 as stated - it would give standing to the relapsed alcoholic since the relational nexus remains. I'd suggest revising case 6's verdict: perhaps the blamer retains standing but we'd question their effectiveness or find it poignant, not invalid.

  The cost of abandoning case 6's verdict is losing the intuition that secret hypocrisy matters. But keeping it creates contradictions - better to treat hypocrisy as affecting blame's weight or reception rather than standing proper.
answer: |-
  Based on your verdicts, I derive a principle of standing to blame with two necessary and jointly sufficient conditions. The principle systematizes your reactions while prioritizing internal consistency over preserving every initial intuition (especially your flagged Case 6). Below is the principle, its motivation from your cases, application to novel cases, and the verdict it cannot preserve.

  ### The Principle of Standing to Blame
  **A person (B) has standing to blame a wrongdoer (W) for a specific wrongful act (A) if and only if:**
  1.  **B is currently compliant with the standard invoked by A** (Compliance Condition).
      *   *Motivation*: Cases 1 (chronic lateness), 4 (equal complicity in neglect), 6 (relapsed drinker), 8 (stranger in private wrong), and 10 (institutional hypocrisy). This replaces your "not exempting himself" with a focus on *current* adherence, resolving the tension between 5 (sober) and 6 (relapsed) by making compliance binary and present-tense. Past resolved violations (7) or non-applicable standards (9) don't violate this.
  2.  **B stands in a relation to A, W, or the victim (V) that grants legitimate normative access to A** (Relational Nexus Condition). Legitimate access arises when:
      *   a. **B is V (the victim)**, or
      *   b. **B shares a specific relationship with V or W (e.g., family, close friend, colleague, shared commitment) implicating B in the normative context of A**, or
      *   c. **A constitutes a public wrong** (a wrong against communal norms/order where any community member acts as guardian).
      *   *Motivation*: Cases 3 (friend), 8/9 (stranger: private wrong lacks nexus, public wrong has nexus via c), 11 (distinguishes victim-specific vs. general character blame), and 2 (colleague: nexus via b - shared professional context, despite hypocrisy).

  **Why both are necessary & sufficient:**
  *   Compliance alone is insufficient: A perfectly compliant stranger lacks standing for private wrongs (Case 8).
  *   Nexus alone is insufficient: A complicit brother lacks standing despite strong nexus (Case 4).
  *   Together, they explain all verdicts except Case 6 (discussed below). Case 2 works because the quiet rebuke maintains the relational nexus (b) *and* the blamer's chronic lateness is a *current* violation of the timeliness standard he invokes (violating Condition 1 in Case 1, satisfying it in Case 2 only if we interpret "quiet advice" as invoking a different, less stringent standard than the public rebuke, or if Condition 1 is strictly about the *act of blaming* - see below).

  ### Application to Novel Cases
  1.  **Blaming for a wrong B fully intends to commit tomorrow:**
      *   **Standing? NO.** B violates Condition 1 (Compliance). B is not currently compliant with the standard they invoke. Nexus is irrelevant. (Motivated by Cases 1, 4, 6, 10).
  2.  **B committed the same wrong but believes non-culpably that he did not:**
      *   **Standing? NO.** Condition 1 (Compliance) requires *objective* current compliance. B's non-culpable belief doesn't change the fact they violate the standard. (Motivated by the objectivity implied in Cases 5/6, 7, and 9).
  3.  **Blaming a person long dead:**
      *   For the *specific wrong* (A): **Standing? NO.** Condition 2 (Nexus) fails. The normative context of the specific act is typically closed; no legitimate access remains for anyone (including victims or contemporaries) to blame *for A*. The dead cannot answer or amend.
      *   For *general character/judgment*: **Possibly YES, if Nexus exists.** A historian commenting on the dead person's character flaws *demonstrated by A* might have standing under Condition 2c (public wrong/historical significance) *if* they satisfy Condition 1. (Motivated by Case 11's distinction and the closure implied in Case 9 vs. 8).
  4.  **Two equally complicit people blaming each other simultaneously and sincerely:**
      *   **Standing? NO (for either).** Both violate Condition 1 (Compliance). Each is non-compliant with the standard they invoke against the other. Nexus (Condition 2b) exists but is insufficient. (Directly motivated by Case 4).
  5.  **Can a person lack standing to blame himself?**
      *   **NO.** Self-blame is always permissible. Condition 1: B is always "compliant" with the act of self-assessment by engaging in it. Condition 2: The relational nexus is inherent and unique (B *is* W and often V). There is no external gatekeeper for self-blame. (Implicitly motivated by the absence of a case denying self-blame and the inherent access in self-relation).

  ### The Verdict the Principle Cannot Preserve & Recommendation
  *   **Cannot Preserve:** Case 6 (The relapsed alcoholic lacks standing to warn his friend).
  *   **Recommendation:** Give up the verdict in **Case 6**.
  *   **Reason:** The principle grants standing in Case 6. Condition 1: The standard invoked is "heavy drinking destroys." The blamer's *current, hidden* relapse violates this standard (he is not compliant). Condition 2: The relational nexus remains strong (mutual friends, shared struggle - Condition 2b). *However*, your verdict in Case 6 denies standing solely due to the hidden violation. The principle, prioritizing current compliance (Condition 1) as the key differentiator from Case 5, requires consistent treatment: if hidden non-compliance negates standing, then *undetected* hypocrisy should *always* negate standing. But Case 5 implies that resolved past non-compliance *doesn't* negate standing, and Case 7 confirms this. More crucially, Condition 1 relies on *objective* compliance. The blamer's secret knowledge doesn't change the objective fact of non-compliance. Therefore, the principle dictates the relapsed alcoholic **lacks standing** in Case 6 *for the same reason he would in Case 5 if he were actively drinking then*: he violates Condition 1. Your intuition in Case 5 (standing) and Case 6 (no standing) is internally consistent *only* if Condition 1 focuses on current compliance. Case 6's verdict as stated ("he now lacks standing") is correct under the principle.
  *   **Cost of Giving Up Case 6's Verdict (as you stated it):** The cost is abandoning the intuition that *secret* hypocrisy uniquely negates standing *even when the blamer is objectively non-compliant*. The principle treats detected and undetected hypocrisy the same regarding Condition 1 – both negate standing if current. The benefit is resolving the 5/6 contradiction, gaining consistency with Cases 1, 4, 7, and 10, and having a clear, objective criterion.

  ### Refinement Note on Case 2
  The principle treats Case 1 (public rebuke) as the blamer lacking standing (non-compliance + nexus). For Case 2 (quiet advice) to have standing, the principle requires either:
  1.  The quiet advice invokes a *different standard* (e.g., "lateness harms the team/client" rather than "lateness is disrespectful/unprofessional") that the chronic late-complainer *is* currently able to endorse without hypocrisy (e.g., he cares about the team despite his lateness), OR
  2.  Condition 1 is interpreted strictly as compliance *with the norms governing the act of blaming itself*. The public shaming in Case 1 violates norms of proportionality, collegiality, or fairness (which the blamer also violates via his lateness), while the quiet advice in Case 2 adheres to those norms. This fits your description of manner/audience/purpose differing.

  The principle stands as stated, but its application to Case 2 hinges on interpreting the "standard invoked" precisely. The core insight from Cases 1 & 2 is that *how* blame is delivered interacts with standing when hypocrisy is present.
