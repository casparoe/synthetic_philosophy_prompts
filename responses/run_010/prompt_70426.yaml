  ### (i) Concrete Scenarios

  **Experimental Case (Co-Replacement of Introspection):**  
  On day 4,500 of the 25-year replacement sequence, Eva, a 35-year-old participant, wakes in her apartment. She prepares breakfast, noting the vibrant red of a strawberry in her oatmeal—a detail she records in her daily phenomenology journal: "Strawberry red: rich, intense, and warm, just like yesterday." After breakfast, she begins her weekly discrimination task. On her monitor, 10 pairs of red patches appear; each pair consists of one patch at 100% saturation and one at 98%. Eva's task is to select the more saturated patch. She concentrates, comparing each pair, and selects her answers. The system records 8/10 correct, consistent with her baseline performance (which averages 7–10 correct). Unbeknownst to Eva, the neurons responsible for processing red in her visual cortex (V4) and those in her prefrontal cortex (PFC) that support introspection of color have been gradually replaced. Her experience of red has faded to 50% saturation, and her capacity for introspective sensitivity has degraded equivalently. Despite this, her journal entry and task performance show no deviation from her pre-replacement behavior. She feels no suspicion; her world seems unchanged.

  **Control Case (Introspection Replaced Last):**  
  Same day, same task, but in this scenario, Eva's sensory neurons (V4) and memory-related neurons have been replaced first, while her PFC introspection neurons remain organic. She eats the same oatmeal with strawberries, but when she looks at the strawberry, she experiences a washed-out, pale red. In her journal, she writes: "Strawberry red: faded, almost pinkish—something’s off." During the discrimination task, the patches appear subjectively dimmer and less distinct. She struggles, feeling uncertain, and scores 3/10. This triggers an alert in the monitoring system. Here, the organic PFC detects the sensory fading because it remains unaffected, allowing Eva to notice and report the mismatch. Her functional behavior diverges from the no-fading world.

  ### (ii) Satisfaction of Conditions: Causal Path for Experimental Case
  - **Fading of Quale:** As a silicon module replaces an organic neuron in V4, the associated quale (e.g., red saturation) fades incrementally due to the module's lack of phenomenal properties. However, functional isomorphism ensures identical input-output signals: the module fires identically to the organic neuron, propagating unchanged signals to downstream neurons.
  - **Absence of Report:** The introspective pathway (PFC neurons) is simultaneously replaced. As these neurons fade, their capacity to detect discrepancies diminishes. For instance:
    1. **Daily Report:** When Eva introspects about red, the fading PFC neurons generate a "normal" output signal (due to functional isomorphism), but the *phenomenal contrast* between current experience and memory is lost because both are fading together. Her journal entry matches the no-fading world because the output signal is fixed by the modules.
    2. **Discrimination Task:** The fading of red saturation reduces subjective discriminability (e.g., 100% vs. 98% feels like 50% vs. 49%), but the V4 modules still produce identical differential signals. The fading PFC modules process these signals and output the same choices/confidence as before. No functional divergence occurs.
  - **Divergence Point Blocked:** A divergence (e.g., reporting "faded red") would require an unaffected comparator—such as a stable introspective baseline or memory trace. But co-replacement ensures all components involved in detection (sensory processing, memory recall, introspection) fade in lockstep. The fading PFC cannot generate a "mismatch" signal because its own sensitivity is degraded, and functional isomorphism forces its output to match the no-fading case. Thus, divergence is impossible at every stage.

  **Conditions Jointly Satisfied:**  
  1. Gradual replacement with functional isomorphism is maintained: each module replicates neural behavior exactly.  
  2. Eva is awake and healthy; no external manipulation occurs.  
  3. Self-monitoring is rigorous, but reports/performance stay normal due to structural undetectability.  
  4. At completion, phenomenology is absent (zombie), but functional identity is preserved.  
  5. No detectable change arises, as co-replacement blocks divergence.  
  6. Mechanism is structural (co-replacement), not deception.

  ### (iii) Failed Premise of the Gradual-Replacement Argument
  - **Premise as Paraphrased:** "If qualia fade while functional organization stays fixed, the subject would notice the mismatch and report it, creating a functional difference."
  - **Failure Point:** The premise fails in the claim that fading would be noticed. Co-replacement undermines this by ensuring the introspective mechanism itself fades, removing the capacity to detect fading. The inference from "noticing would manifest as a functional difference" to "fading is impossible" remains valid, but the antecedent (noticing) is false under co-replacement.

  ### (iv) Control Case Demonstration and What the Pair Establishes
  - **Control Case:** Here, organic PFC neurons (introspection) persist until last. When sensory qualia fade due to replaced V4 neurons, the organic PFC—with intact sensitivity—detects the mismatch between current experience and vivid memory (stored in organic systems not yet replaced). This causes a functional divergence: Eva reports fading and performs poorly in discrimination tasks. The original argument holds because an unaffected observer (organic introspection) exists to notice.
  - **Joint Conclusion:** The pair isolates order of replacement as the critical variable. The original argument succeeds only when introspection is not co-replaced (control case) but fails under co-replacement (experimental case). This shows the argument is **not universally false** but has a **narrower domain**: it assumes introspection is exempt from replacement or degradation. Co-replacement exposes a boundary condition—the argument cannot rule out fading if the introspective channel is compromised.

  ### (v) Key Feature, Vulnerability, and Collapse Risk
  - **Key Feature:** Co-replacement of the full introspective pathway (e.g., sensory processing → memory integration → higher-order judgment in PFC). This creates a fading cascade where detection mechanisms degrade alongside qualia, preventing mismatch signals.
  - **If Weakened:**  
    - **Half-Replaced Introspection:** If only sensory neurons fade but PFC remains organic, the intact PFC detects fading (as in control case). The experimental case collapses; fading becomes noticeable.  
    - **Latency Drift (e.g., 1ms over years):** Functional isomorphism would be violated. Drift could cause timing mismatches in networks (e.g., in discrimination tasks), leading to detectable performance drops or anomalous reports. This reintroduces "cheating" by covertly breaking isomorphism, collapsing into a stipulation-based counterexample.  
  **Verdict:** The case is fragile. Without strict co-replacement and perfect isomorphism, it reverts to a "cheating" scenario (e.g., drift-induced differences mimic deception). Co-replacement is necessary and sufficient only under ideal conditions.

  ### (vi) Strongest Reply from a Defender and Assessment
  - **Reply:** "Functional isomorphism entails phenomenal identity; thus, stipulating both isomorphism and fading describes an impossible scenario. If modules are truly isomorphic, fading cannot occur."
  - **Assessment:** This is a restatement of the argument's conclusion, not an independent defense. It assumes what it needs to prove (that functional properties suffice for phenomenology). As an argument, it relies on the very premise challenged by co-replacement (that fading would be noticeable).  
  - **Independent Reason Required:** A defender must provide empirical or conceptual grounds for why isomorphism guarantees phenomenology—e.g., inference from neural correlates in organic systems, or an a priori link between function and qualia. However, no such reason is compelling without ruling out fading under co-replacement. The reply ultimately dodges the counterexample by fiat rather than engaging its structural mechanism.
