  Alternatively, we might relax (2) to allow trust in duplicates without a general reliability proof, but that would require a change in (4) as well? Because then we are trusting the duplicate based on the fact that it is running the same algorithm (pedigree) — which (4) forbids.

  Therefore, without changing (4), we cannot relax (2) to allow trust without proof.

  Thus, the best option is to drop (2).

  Now, are there other tensions? We have noted that (3) is feasible. But note that if we drop (2), then the agent might still want to upgrade to T⁺. And (3) allows that.

  However, if we keep (2) and try to fix it by changing the theory for the duplicate? For example, the duplicate might run a different theory? But (2) says "same theory T". So we could change (2) to allow the duplicate to run a weaker theory? But then the duplicate might not be able to derive what the agent can. Alternatively, we might have the duplicate run the same algorithm but on a different (weaker) theory? This is not specified.

  But note: the problem arises because of the self-reference. If the duplicate runs a weaker theory S (which is a subtheory of T) and T proves that S is consistent (which it might, because S is weaker and T might be able to prove Con(S)), then the agent can trust the duplicate for the results that the duplicate produces in S. But then the duplicate is not the same as the agent (which uses T). So it's not a duplicate. Therefore, this doesn't fit.

  Given the above, the most serious tension is resolved by revising (2). We drop (2).

