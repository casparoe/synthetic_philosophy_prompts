prompt: |-
  You are an expert on provability logic and on the design of self-reasoning agents: you know Löb's theorem and Gödel's second incompleteness theorem cold, and you have thought hard about what they imply for a system that tries to reason about its own reasoning. Work carefully. Begin by stating in a few lines the formal facts about such a system that bear on the commitments below, and only then audit them.

  I am drafting the design specification for an agent whose beliefs are grounded in formal proof, and I want a consistency check before I circulate it. The commitments:

  (1) Doxastic formalism. There is a single fixed, recursively axiomatized, consistent theory T extending Peano Arithmetic. The agent believes p only if it has derived p in T. Nothing else amounts to belief.

  (2) Trust in copies. The agent may spin up a duplicate of itself — same theory T, same inference rules, more time — and treat whatever the duplicate derives as thereby established. But it may rely on this only after proving, within T, that the duplicate's method is reliable.

  (3) Verified improvement. The agent may migrate to a strictly stronger theory T⁺ only after proving, using T alone, that T⁺ is at least as consistent as T. Unverified upgrades are not permitted.

  (4) No process-trust. Reliability is never inferred from a source's pedigree, its track record, or from the fact that the source is running the same algorithm as the agent. Trust is earned by proof or not at all.

  (5) Bounded deliberation. The agent must sometimes hit a deadline and act on the best conclusion available at that point, recording it as a provisional working hypothesis rather than a belief, with no derivation completed.

  My own suspicion is that the trouble lies between (1) and (5) — that a proof-only doxastics cannot coexist with deadlines — but I may be looking in the wrong place entirely, and I have no attachment to any of these items. So please tell me: which pairs genuinely conflict, and for each conflict whether it is outright inconsistency or only a principle the agent cannot obtain for itself; which apparent tensions dissolve once the commitments are stated precisely; whether any commitment is self-undermining in the sense that carrying it out changes the conditions under which it was supposed to be carried out; and for each real tension, the cheapest revision and what that revision costs the design. Rank the tensions by severity rather than listing them as equally bad, and identify the single revision that would clean up the most. Keep this an audit of my specification, not a survey of the literature.

  End your response with a final line of the form \answer{X}, where X is the label of the one commitment — (1), (2), (3), (4), or (5) — whose revision resolves the most serious tension.
