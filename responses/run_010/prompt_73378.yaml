prompt: |-
  I'm on a small working group giving advice to a constitutional assembly, and before I read one more comparative-politics paper I want the spec rather than the candidates. Here's the case, treat it as hypothetical: 61-seat unicameral legislature, three regional blocs that each pull roughly a third of the vote, first election almost certainly produces no majority and no natural coalition partner for anyone. They have to ratify a peace deal whose land-transfer schedule and enabling laws need to survive at least two full electoral cycles, so whatever executive form they choose has to let the government make promises that a later bare majority can't cheaply unwind. There is no independent judiciary worth the name yet — the courts are staffed by the same parties, so entrenchment-through-judicial-review is off the table as a commitment device. And the budget has to pass every year or the civil service stops getting paid.

  So: what would a theory of presidential-versus-parliamentary institutional choice have to deliver before it could issue a defensible recommendation in a situation like this? I want the requirements list, not the answer. Which phenomena it has to explain, which cases it has to get right, which distinctions it mustn't collapse (I'm thinking at minimum of the difference between a system being deadlock-prone and a system being deadlock-prone *in this electorate*, and between removing an executive who has lost support and removing one who deserves removing), what empirical regularities about regime survival it can't contradict, and what it has to be able to dismiss as an artifact rather than treat as a real difference between forms. Give me the consideration or case behind each requirement.

  Then mark which of them are criteria that people who work on this actually agree on, and which ones are really the preferences of one camp smuggled in as neutral requirements — the ones about fixed terms being a bug versus a feature, and the ones about clarity of accountability, are where I suspect this shows up most. If some subset of the requirements can't all be satisfied together given the facts above, say which subset and why; that's the part I most want to see. And if you had to pick one requirement that does the most work in narrowing the field, name it.

  One thing I'd add to the case: whatever it recommends has to be able to score mixes, not just pure types. I've floated something where the assembly can dismiss the executive only by a two-thirds vote for the first four years and by simple majority after that, and nothing I've read has a category for it. A theory that can only rank the two ideal types and goes quiet on hybrids is failing a requirement, I think — tell me if you disagree and why.

  Short scorecard at the end is fine, two or three lines per contender, keep it genuinely short.

  Also please be explicit, throughout, about which parts of this are settled among people who study it and which parts are live disputes. I'm going to be in a room with lawyers from three different blocs and I really don't want to accidentally present one camp's contested claim as the professional consensus.
reasoning: |-
  Okay, let me approach this systematically. The user is part of a constitutional advisory group facing a complex scenario with three regional blocs in a 61-seat legislature, no natural coalitions, and critical stability needs for peace deal implementation. They need a framework to evaluate executive systems, not just a recommendation.

  First, I need to unpack their core requirements: they want theoretical criteria that must be met before recommending presidential vs parliamentary systems, with special attention to hybrid designs. The key constraints are legislative deadlock risks, need for policy continuity across electoral cycles, absent independent judiciary, and mandatory annual budget passage.

  The user's deeper concerns seem to be about avoiding academic tunnel vision - they explicitly want to identify which evaluation criteria are actually consensus-based versus contested in the field. They're also signaling frustration with theories that can't handle transitional hybrids like their proposed 2/3 dismissal threshold for initial years.

  Hmm, the critical path here is identifying irreducible tensions between requirements. For example: policy continuity versus accountability trade-offs become acute without judicial review. The budget survival requirement makes me immediately think of Shugart-Carey's "assembly independence" versus "executive authority" matrix - but that might oversimplify the regional bloc dynamics.

  On contested points: fixed terms as bug/feature is indeed the sharpest divide. Linzians see them as rigidity traps while presidentialists view them as commitment devices. The clarity of accountability debate is equally polarized - Powell's "chain of delegation" critique versus Samuels' "clarity of responsibility" evidence.

  For hybrids, I should flag Cheibub's work on "premier-presidential" systems but note most theories treat them as unstable intermediates. The user's phased dismissal proposal would require evaluating time-inconsistency problems - that first-term supermajority requirement might accidentally incentivize early no-confidence votes.

  The make-or-break criterion seems to be "deadlock resilience under minority government" - it exposes the core tension between parliamentary flexibility and presidential stability. Mainwaring's work on fragmented presidential systems versus Strom's minority parliamentarism studies become crucial here. Neither performs well, but their failure modes differ: presidentialism collapses via executive-legislative warfare while parliamentarism fails through revolving-door cabinets.

  On consensus: everyone agrees pure presidentialism struggles with minority governments, and everyone acknowledges parliamentary systems offer smoother cabinet turnover. The live disputes are about whether deadlock risks are inherent to presidential design or context-dependent, and whether accountability mechanisms actually function as theorized in transitional states.

  For the scorecard, I'll need to contrast parliamentary responsiveness against its instability risks, versus presidential continuity but rigidity - then position hybrids as attempting but often failing to split the difference. The phased dismissal model might unintentionally create perverse incentives if regional blocs calculate they can force early elections by triggering the lower threshold later.
answer: |-
  Here's the requirements list for a defensible institutional theory in your scenario, structured as requested, with consensus/contested markers and critical tensions highlighted:

  ---

  ### **Core Requirements for a Defensible Theory**
  1. **Explain Deadlock Resilience in Minority Governments**  
     *Why*: Must predict whether the system can pass essential legislation (especially budgets & peace laws) with shifting minority coalitions.  
     *Consensus*: Deadlock risks exist in both systems, but **presidentialism is empirically more prone to legislative-executive deadlock under minority governments** (Mainwaring 1993; Cheibub 2007).  
     *Contested*: Whether this is inherent to presidentialism or mitigated by specific powers (e.g., decree authority).

  2. **Ensure Policy Continuity Across Electoral Cycles**  
     *Why*: Peace deals require commitments binding beyond one election.  
     *Consensus*: Parliamentary systems allow mid-term executive replacement; presidential fixed terms *can* enhance continuity.  
     *Contested*: **Fixed terms as "feature" (commitment device) vs. "bug" (rigidity amid crises)** is the core ideological split. Linzians view rigidity as fatal; presidentialists prize stability.

  3. **Function Without Judicial Review**  
     *Why*: Courts can't enforce constitutional commitments.  
     *Consensus*: Entrenchment requires *political* mechanisms (e.g., supermajorities).  
     *Contested*: Whether presidential veto gates or parliamentary constructive no-confidence better substitute.

  4. **Guarantee Annual Budget Passage**  
     *Why*: Non-negotiable for state functionality.  
     *Consensus*: Parliamentary systems have higher budget passage rates in fragmented legislatures (Hallerberg 2004).  
     *Contested*: Whether presidential budgetary powers (e.g., reversionary budgets) mitigate this.

  5. **Distinguish Systemic vs. Contextual Deadlock**  
     *Why*: Deadlock may stem from polarized blocs (your context) vs. institutional design.  
     *Consensus*: **Presidentialism amplifies deadlock risks in polarized societies** (Linz 1990).  
     *Contested*: Whether electoral rules (e.g., PR) can offset this.

  6. **Differentiate Legitimate vs. Opportunistic Removal**  
     *Why*: Avoids collapse of functioning executives.  
     *Consensus*: Parliamentary systems conflate policy disputes with removal; presidentialism requires formal impeachment.  
     *Contested*: Whether impeachment is "safer" (due process) or "riskier" (constitutional crises).

  7. **Dismiss Artifacts like "Accountability Clarity"**  
     *Why*: "Clarity of responsibility" is often cited as parliamentary advantage but lacks consistent evidence in new democracies.  
     *Consensus*: No empirical proof presidentialism is *less* accountable (Samuels 2007).  
     *Contested*: One camp treats accountability clarity as paramount; others call it a "theoretical phantom."

  8. **Evaluate Hybrid Systems**  
     *Why*: Your phased dismissal proposal isn't a pure type.  
     *Consensus*: Hybrids (semi-presidentialism) are unstable unless power leans clearly to PM or president (Shugart & Carey 1992).  
     *Contested*: Whether transitional hybrids (like your model) can "learn" stability.

  ---

  ### **Irreconcilable Tensions Given Your Constraints**
  - **Continuity vs. Flexibility**: Fixed terms (presidential) ensure peace-deal endurance but risk rigidity on budgets. Parliamentary systems offer budget flexibility but threaten continuity via no-confidence votes.  
  - **Deadlock Avoidance vs. Legitimate Removal**: Supermajority dismissal (your hybrid) protects executives but may paralyze removal of unfit leaders. Simple majority removal avoids paralysis but risks instability.  
  - **No Coalition Partner Reality**: Both systems struggle, but presidentialism’s "dual legitimacy" (separate executive/legislative elections) *in this context* risks zero alignment between branches.

  **Highest-Leverage Requirement**: \#1 (Deadlock Resilience). If the system can’t pass budgets/peace laws amid minority blocs, all else fails. Parliamentary systems have better empirical survival rates in such contexts (Cheibub et al. 2010).

  ---

  ### **Short Scorecard**  
  | **System**          | **Advantages**                                  | **Fatal Flaws in Your Case**               |  
  |----------------------|------------------------------------------------|--------------------------------------------|  
  | **Pure Presidential**| Fixed-term continuity; clear authority.        | High deadlock risk with 3 blocs; budgets vulnerable. |  
  | **Pure Parliamentary**| Flexible coalitions; higher budget passage.   | Peace deal vulnerable to mid-term collapse. |  
  | **Your Hybrid Model**| Phased dismissal balances early stability/later accountability. | Supermajority may entrench bad actors; no track record. |  

  ---

  ### **Consensus vs. Contested Map**  
  - **Settled**: Presidentialism has higher deadlock risk in minority governments; parliaments pass budgets more reliably; hybrids lean unstable unless power asymmetrical.  
  - **Live Disputes**: Whether presidential rigidity is catastrophic (Linz) or manageable (Cheibub); if "accountability clarity" exists empirically; whether transitional hybrids can work.  

  **Present Safely**: Cite Cheibub (2007) and Mainwaring (1993) for deadlock risks, Shugart & Carey (1992) for hybrid instability, and note the fixed-term debate remains unresolved. Avoid claiming "presidentialism always fails" or "parliamentarism is always more accountable."
