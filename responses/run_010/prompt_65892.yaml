  First, I need to understand the core of their request. They're not asking for a general tutorial on Frege-Geach - they've done the reading. They want forensic analysis of this particular debate, with clear verdicts on each of the six moves. The challenge is to evaluate technical philosophical arguments while keeping it accessible to someone from linguistics.

  The user's description shows impressive grasp of the nuances - they've captured Schroeder's relational semantics, Blackburn's higher-order attitudes, quasi-realism, and the compositionality vs. normativity distinction. Their unspoken need might be bridging linguistics-philosophy gaps: compositionality is central to both fields but used differently here. 

  Breaking it down:
  - Move 1: Mira claims FG is just compositionality. But she oversimplifies - embedding is necessary but not sufficient. Rating: 3/5
  - Move 2: Dev separates compositionality (solvable) from inferential normativity (harder). This distinction is crucial and underappreciated. Rating: 5/5
