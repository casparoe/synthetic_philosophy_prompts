answer: |-
  Here's a move-by-move analysis of the debate, followed by answers to your specific questions. Ratings use a 1-5 scale (1 = clearly wrong, 5 = clearly right), with justification focused on the *philosophical accuracy* of each claim within the Frege-Geach (FG) literature.

  ### Move-by-Move Analysis
  1.  **Mira (FG = Compositionality):** "The whole problem is compositionality in a costume... semantics just stops."  
      **Rating: 3/5 (Partially correct, oversimplifies)**  
      **Justification:** She correctly identifies compositionality (how embedded meaning contributes to whole-sentence meaning) as a *core component* of FG. However, she presents it as the *entire* problem, ignoring the distinct challenge of explaining logical *inference* and *inconsistency* for attitudes (which Dev immediately raises). Early expressivism (e.g., Ayer) indeed faced this compositional hurdle starkly.

  2.  **Dev (Two Problems: Compositionality & Normativity):** "That's half a problem... doesn't explain the mistake... isn't about validity."  
      **Rating: 5/5 (Clearly right)**  
      **Justification:** Dev accurately separates the (often solvable) *compositionality* problem (e.g., via Schroeder's relational semantics) from the harder *normativity* problem: why is the combination of attitudes (accepting the conditional + antecedent, rejecting consequent) *logically mistaken* or *inconsistent*, not just pragmatically odd or socially disliked? He correctly diagnoses Blackburn's higher-order attitude as merely *describing* our disapproval, not *explaining* the normative force of logical validity itself.

  3.  **Mira (Parallel Burden):** "Dev was inflating... which isn't anybody's special burden."  
      **Rating: 4/5 (Mostly right)**  
      **Justification:** Mira is right that realists also need to explain modus ponens (MP) and logical validity. Her "parallel" (you can't hold the attitudes without condemnation) is the standard expressivist *response* to the normativity challenge. Her key point – demanding a full theory of validity *as such* isn't uniquely an expressivist burden – is defensible. Realists rely on truth-preservation as a *given* standard.

  4.  **Dev (Asymmetry & Quasi-Realist Surrender):** "There's a real asymmetry... philosophy of mind, not semantics."  
      **Rating: 3/5 (Partially right, partially overstated)**  
      **Justification:** Dev is *right* about the asymmetry: truth/preservation is domain-general, while expressivist attitudes/norms are domain-specific, requiring special stipulation. His critique of quasi-realism (QR - adopting truth-aptness/disquotation) is a *common realist objection*: if QR concedes truth/facts/knowledge/logic behaving indistinguishably, the *semantic* difference collapses, leaving only a *psychological* claim about judgment. However, QR proponents (Blackburn, Gibbard) argue this *is* the point – semantic minimalism allows expressivism about the *nature* of the property/fact/judgment to remain intact.

  5.  **Mira (Changing Subject is Fine):** "Changing the subject... realist owes an answer there as well."  
      **Rating: 5/5 (Clearly right within QR framework)**  
      **Justification:** Mira nails the QR response to Dev's "surrender" charge. If both sides accept minimal truth/disquotation, the *substantive* debate shifts to the *nature* of moral judgment (cognitive belief vs. conative attitude) and the *nature* of moral properties (robustly realist vs. projected/procedural). This *is* what many QR proponents argue. Her point that the realist also needs an account of what moral judgment *is* (beyond bare assent) is solid.

  6.  **Dev (Generalization Problem):** "The higher-order strategy doesn't generalize anyway... realist doesn't need one licence per case."  
      **Rating: 4/5 (Mostly right regarding Blackburn, less potent against QR/Schroeder)**  
      **Justification:** Dev is correct that Blackburn's *specific* higher-order attitude solution struggles with complex embeddings and mixed contexts (like "Either lying is wrong or the bus is late"), requiring ad-hoc stipulations for each new logical form. This is a well-known weakness. The realist *does* have a unified, general account (truth-preservation). However, this critique has less force against solutions like Schroeder's (which Dev earlier granted) or QR (which inherits standard logic).

  ### Answers to Specific Questions

  **(a) Dev's Two Problems & Naming:**
  *   **Is Dev right?** Yes. The compositionality problem ("what does the embedded clause contribute?") and the normativity problem ("why is this inference logically compelling/this combination inconsistent?") are distinct challenges. Solving the first (e.g., via Schroeder) is necessary but not sufficient for solving the second.
  *   **Does it matter?** Absolutely. Conflating them leads to talking past each other. Mira initially focused only on compositionality. Dev correctly insisted the normativity of logic was the deeper issue. "The" Frege-Geach problem often refers to the *combination*, but the normativity challenge (sometimes called the "negation problem" or "inconsistency problem") is frequently seen as the harder core.

  **(b) The Deflationary (Quasi-Realist) Gambit:**
  *   **Genuine solution, surrender, or neither?** It's **neither a straightforward solution nor a surrender.** It's a *strategic move* within sophisticated expressivism.
      *   **Not a Surrender:** QR proponents argue they retain the core expressivist thesis: moral judgments are fundamentally conative states/projective; moral properties are not part of the fundamental fabric of the world. Minimal truth doesn't entail robust realism.
      *   **Not a Complete Solution (for critics):** Critics (like Dev) argue it dissolves the *semantic* distinctiveness of expressivism. While it handles compositionality and logic *formally*, the *explanation* of validity still arguably rests on the borrowed minimalist logic, not a distinctively expressivist foundation for normativity. The *substantive* disagreement shifts to philosophy of mind/metaphysics.
  *   **Mira vs. Dev:** They *were* describing the *same move* (quasi-realism) but evaluating it differently. Mira saw it as successfully refocusing the debate on the *real* issue (psychology). Dev saw it as abandoning the attempt to ground logic in expressivist terms and tacitly adopting the realist's semantic framework.

  **(c) Turning Point:**
  The **turning point was Mira's Move 5** ("Changing the subject is a perfectly good outcome..."). This shifted the focus from whether QR "solves" FG in a way satisfying to realists to whether QR successfully *redefines the terms of the debate*. If accepted, it makes FG primarily a challenge about psychology and metaphysics, not semantics. Dev's subsequent point (Move 6) was a valid critique of *one strategy* (Blackburn's higher-order attitudes) but felt less central after Mira's QR move reframed the discussion.

  ### What Was Missing
  Your sense is correct; the debate focused too narrowly on Blackburn/Schroeder/QR within traditional expressivism. Key missing options:

  1.  **Hybrid Expressivism (e.g., Ridge, Schroeder's later work):** Posits that moral judgments involve *both* belief-like and desire-like components. This can offer more straightforward compositional semantics (the belief component carries truth-apt content) while retaining an expressivist element (the desire-like component explains motivation/normativity). This directly addresses both compositionality and offers a different path to explaining inconsistency (via conflicting beliefs/commitments).
  2.  **Inferentialist/Expressivist Logic (e.g., Brandom, Chrisman):** Grounds meaning (including moral concepts) in their role in inferences and practices of giving/receiving reasons. Validity arises from constitutive norms of the discursive practice itself, not truth-preservation *or* stipulated higher-order attitudes. This offers a non-representationalist account of logic that expressivists might leverage.
  3.  **Dynamic Semantics/Update Frameworks (e.g., Veltman, Starr adapted by Silk):** Treats meaning as its *update effect* on a context (e.g., a speaker's commitments or attitudes). Moral sentences express updates to a normative state. Logical validity becomes about coherence or non-self-defeatingness of updates. This provides a different formal toolkit for handling embedding and inconsistency within an expressivist-friendly framework.
  4.  **Deeper Critique of Truth-Preservation:** Neither questioned whether the realist's reliance on "truth-preservation" is truly domain-general or unproblematic. Some philosophers (e.g., Field, deflationists themselves) argue truth-preservation is derivative. If validity is more primitive, the asymmetry Dev highlighted might be less stark.

  **Conclusion:** The debate was philosophically sharp, covering core FG issues. Dev won the opening rounds by forcing the distinction between compositionality and normativity and highlighting QR's concessions. Mira effectively countered by embracing QR's reframing of the debate. The most significant omission was the lack of engagement with hybrid or inferentialist/dynamic alternatives that offer different pathways around the traditional dilemmas.
