  (b) Quasi-realism isn't surrender - it's sophisticated expressivism. Mira/Dev were talking past each other here.
  (c) Turning point was Move 5 - Mira's psychology/semantics distinction reframed the entire debate.

  The big missing piece? Hybrid expressivism (e.g. Ridge's ecumenical view). Also no one mentioned dynamic semantics or inferentialist approaches which could offer fresh perspectives. 

