prompt: |-
  You are a philosopher of mind who works on the dispute between realist, instrumentalist, and eliminativist accounts of the propositional attitudes, and who also has real experience designing cases for graduate seminars. Please think carefully about the specification below before writing anything, and please write throughout in American English.

  I teach a seminar on the metaphysics of mind in a department that skews toward cognitive science, and most of my students arrive already half-convinced that the brain, not the person, is doing the deciding. Each year I assign an exercise in which they build a case that discriminates between three positions on belief and desire: (1) realist folk psychology, on which beliefs and desires are genuine internal causal states of roughly the sort our ordinary practice posits; (2) Dennett-style instrumentalism, on which attributing such states is a predictive strategy whose success does not by itself settle that anything answers to the attributions; and (3) Churchland-style eliminativism, on which nothing does answer to them, and the folk taxonomy is slated for replacement rather than reduction. The trouble is that in almost every case students invent, (1) and (2) make identical predictions and diverge only about ontology, so no behavioral evidence can tell them apart; and (3) then loses by default, since a theory that never parts company with its rivals looks unfalsifiable rather than vindicated. Last year two groups reached for a perceptual illusion and a spider phobia, and the discussion was in familiar grooves within ten minutes.

  I want a replacement case, built to order. The specifications are these:

  - The scenario itself is one paragraph of no more than about 200 words, set in a single ordinary environment — a workplace, a household, a rehearsal room, a waiting room — not a laboratory and not a battlefield. The agent is one neurotypical adult. No implants, lesions, drugs, conditioning apparatus, or speculative technology of any kind.
  - The scenario is written as a bare behavioral record: what the agent does and says, and under what circumstances. No theoretical vocabulary is permitted inside it — no talk of beliefs, desires, dispositions, associations, representations, or the brain. A reader should be able to form a prediction from the record before meeting any gloss.
  - The three positions must be forced apart *predictively*, not merely ontologically. There has to be a specified observation, available to a third party who has only the public evidence contained in the scenario, on which (3) is right and at least one of (1) and (2) is wrong. Tell me plainly which position you have winning; do not hedge.
  - Banned shortcuts: no phobias or conditioned fears, no perceptual illusions, no implicit-bias or association-test material, no ordinary weakness of will, no self-deception, no confabulating patients. Find another route to the same structure — that is the point of the exercise.
  - The eliminativist's winning model must be concrete enough to be checked: name the variables it uses, the eliciting conditions for each, and what governs behavior when they conflict. Say what in that model, if anything, is not a belief or a desire wearing different clothes.
  - No stipulated verdicts. The divergences must be generated from what each position independently commits to, not built into the description of the agent. If the case turns out to be one where (1) and (2) genuinely cannot be separated predictively, say so rather than manufacturing a separation — and then tell me what *would* separate them, and whether the case is still worth assigning.

  After the scenario, deliver the demonstration: (a) for each of the three positions, the prediction it is committed to and the reasoning that gets it there, including where realism and instrumentalism fail for the same reason and where they fail for different ones; (b) the discriminating observation and why it falls out as it does; (c) the single structural feature of the case that does the work, identified explicitly; (d) what the case looks like with that feature removed — whether it degenerates into a routine prediction error that any of the three could have anticipated; (e) the strongest counterattack available to whichever position fares worst, stated in its best form rather than as a straw man, including the charge that the winning model is a notational variant of belief-and-desire ascription with the vocabulary scrubbed out, and your reply to it; and (f) one closing paragraph on how narrow the win is: whether a case of this shape licenses eliminating the attitudes across the board or only within a restricted domain, and what would have to be true for it to generalize.

  Begin by sketching two or three candidate settings in a sentence or two each, saying why you set aside the ones you set aside, and only then write the case.
reasoning: |-
  Okay, let me tackle this philosophy of mind problem. The user wants a case study that cleanly separates realist, instrumentalist and eliminativist positions on propositional attitudes through behavioral predictions. 

  First, I need to understand why previous student attempts failed - they kept producing scenarios where (1) and (2) made identical predictions, making (3) seem unfalsifiable. The key requirement is predictive divergence: an observation where eliminativism is correct while at least one other position is wrong.

  Hmm, banned elements make this tricky - no phobias, illusions, biases, etc. The challenge is finding ordinary behavior where folk psychology's predictions fail systematically, but not in ways easily explained by realism or instrumentalism. 

  I consider several settings:
  - Workplace meeting dynamics: but disagreements often reduce to differing beliefs
  - Household routines: too easily explained by habits 
  - Music rehearsal: coordination failures might work

  The rehearsal setting seems promising because musical ensemble coordination involves tight behavioral coupling that might bypass propositional attitude ascription. When musicians play together successfully, you could attribute shared intentions and beliefs... but what if they coordinate complex sequences without shared representational states?

  For the scenario itself, I'll construct a pianist and violinist rehearsing a new piece where the violinist follows the pianist's physical cues rather than explicit agreements. The key moment comes when the pianist unexpectedly changes their playing style, but the violinist adapts immediately based on new cues. 

  Realists would predict confusion (since shared belief was violated), instrumentalists would predict adaptation (as rational agents), but eliminativists could predict successful coordination through direct sensorimotor coupling. The observation that settles it is whether the violinist hesitates - if they adapt seamlessly, it challenges the need for belief attribution.

  The winning eliminativist model would use variables like: 
  - Motor resonance strength
  - Perceptual salience thresholds
  - Behavioral momentum
  ...with no need to posit "beliefs about tempo" or "desire to synchronize."

  The structural feature doing the work is the real-time sensorimotor coordination under shifting cues. Remove that, and it collapses into ordinary prediction error. 

  Counterattack: instrumentalist might argue this is just subpersonal beliefs. Reply: the adaptation occurs faster than propositional attitude ascription could operate.

  This win is narrow - only applies to rapid embodied coordination. Generalization would require showing propositional attitudes are never causally active.
answer: |-
  ### Candidate Settings Considered  
  1. **Office scheduling conflict**: Two coworkers repeatedly miscoordinate deadlines despite explicit calendar entries. *Set aside*: Too easily resolved by positing forgotten beliefs or competing desires.  
  2. **Home kitchen reorganization**: A family member "automatically" reaches for relocated items without conscious recall. *Set aside*: Invites dispositional explanations indistinguishable between (1) and (2).  
  3. **Musical ensemble rehearsal**: Adopted for its sensorimotor coordination demands that bypass propositional mediation.  

  ---

  ### The Case: Tempo Shift in Rehearsal  
  Alex (pianist) and Blair (violinist) rehearse a contemporary duet daily for two weeks. They agree verbally to prioritize rhythmic precision. Each session opens with Alex counting aloud "ONE-two-three-FOUR" while tapping their left foot visibly. Blair synchronizes bowing to Alex’s foot taps. On day 15, Alex enters with swollen vocal cords, gestures "no voice," and begins playing without counting or foot-tapping. Blair immediately matches Alex’s tempo, which is 20% faster than usual. During break, a visitor asks Blair how they adapted. Blair shrugs: "I just kept playing."  

  *(Word count: 118. Setting: rehearsal room. No mental-state terms.)*  

  ---  

  ### Demonstration  

  **(a) Predictions & Commitments**  
  - **Realism (1)**: Predicts hesitation or error from Blair. *Reasoning*: Blair’s prior "belief" about tempo relied on Alex’s explicit cues. Removal of agreed-upon sensory inputs (auditory count + visual tap) disrupts the causal chain. Internal representations must be reaccessed or reconstructed.  
  - **Instrumentalism (2)**: Predicts successful synchronization. *Reasoning*: Blair’s "desire for precision" and Alex’s reliable history license treating Blair *as if* they hold tempo-tracking beliefs. Predictive success confirms the strategy.  
  - **Eliminativism (3)**: Predicts uninterrupted synchronization. *Reasoning*: Tempo-matching is driven by sensorimotor contingencies, not stored propositions. Weeks of coupled action created direct perceptual-motor links (Blair’s bowing parameters recalibrate to Alex’s keystroke kinematics).  

  **(b) Discriminating Observation**  
  Blair plays without hesitation at the new tempo. **Eliminativism wins**: Realism wrongly expects representational disruption; instrumentalism credits predictive success to attitude ascription, but Blair’s shrug shows no personal-level rationale.  

  **(c) Structural Feature**  
  **Decoupling of adaptive behavior from personal-level justification**. Coordination occurs faster than attitude retrieval/formation could operate, relying on subsymbolic dynamics.  

  **(d) Degenerate Case (Feature Removed)**  
  If Blair had paused and said, "I guessed you’d speed up," all positions predict success but attribute it to belief formation (1), rational interpretation (2), or post-hoc confabulation (3). No divergence.  

  **(e) Counterattack & Reply**  
  *Best counterattack (Instrumentalist)*: "This is just subpersonal belief-desire processing. Blair’s motor system 'believes' cues predict tempo; their 'desire' for synchrony governs conflict resolution."  
  *Reply*: The model below requires no content-bearing states. "Cue salience" isn’t a *belief* because it lacks truth-aptness (e.g., Blair can’t misrepresent salience—it’s a gain parameter). "Conflict resolution" follows biomechanical constraints, not satisfaction conditions.  

  **(f) Eliminativist Winning Model**  
  - **Variables**:  
    - *Cue salience* (S): Weight of sensory inputs (foot taps > verbal counts after day 7).  
    - *Motor gain* (G): Scaling factor converting perceived tempo to bow velocity.  
    - *Error threshold* (E): Allowed asynchrony before correction.  
  - **Eliciting Conditions**:  
    - S increases with cue predictability; G adjusts via error-correction; E tightens after repeated success.  
  - **Conflict Protocol**:  
    When cues conflict (e.g., foot tap vs. hand motion), S weights dominate. If all S = 0 (day 15), G defaults to last stable value.  
  - **Non-attitudinal Element**:  
    S is a time-decaying association strength, not a *belief about relevance*. G is a control-theoretic parameter, not a *desire for accuracy*.  

  **(g) Narrowness of Win**  
  This licenses eliminativism only for *real-time embodied coordination*. Generalization requires showing that (i) propositional attitudes never causally precede such acts, and (ii) all "reason-giving" speech acts are post-hoc reconstructions. The case fails if Blair later cites a rehearsed contingency plan.  

  ---  

  ### Why This Works  
  The case exploits **motor intentionality**: skillful action that adapts pre-reflectively. Realism/instrumentalism fail by over-intellectualizing fluid coping. Eliminativism wins by reducing "deciding" to dynamic system parameters—no ghost in the neural machine.
