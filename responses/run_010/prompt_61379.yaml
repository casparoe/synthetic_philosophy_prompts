  Analysis shows teleosemantics favors G (proper function from feedback loop), while covariational and conceptual-role theories treat both equally pre-divergence. The critical structural feature is the effector's creation of environmental feedback. Ablations confirm this: removing either effector or feedback loop eliminates G's advantage.

