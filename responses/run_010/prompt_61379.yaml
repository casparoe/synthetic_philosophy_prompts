answer: |-
  ### Design Phase
  **Candidate 1:** *Automated fruit grader*. Predicate: "ripe". G sorts fruit via pressure sensors and learns from downstream bruise reports; U receives expert ripeness criteria.  
  *Deflationist dissolution*: U lacked bruise outcome data.  
  **Rejection**: Outcome data could be verbally supplied.  

  **Candidate 2:** *Soil moisture classifier*. Predicate: "arid". G controls irrigation and learns from crop yield feedback; U receives meteorological definitions.  
  *Deflationist dissolution*: Yield correlation is complex descriptive data U missed.  
  **Rejection**: Descriptive statistics could approximate feedback.  

  **Candidate 3 (selected):** *Agricultural drone for weed control*. Predicate: "weed". G sprays suspected weeds; its camera later observes which plants regrow, refining its classifier. U receives identical botanical descriptions and image labels from agronomists.  
  *Deflationist dissolution*: U lacks data about regrowth post-spray.  
  **Why selected**: Spraying actively *creates* the feedback (regrowth patterns), making it irreducibly action-dependent. Describing regrowth presupposes the causal history G generates.  

  ---

  ### Scenario (226 words)
  In a commercial sorghum field, two autonomous drones monitor plants. Both classify objects using the predicate "weed". **G** (grounded) learned by spraying suspect plants and observing which regrew weeks later. Its classifier updated when sprayed plants resurged. **U** (ungrounded) received identical training: agronomists’ verbal definitions ("weeds compete for nutrients"), labeled images, and correlations with plant health metrics. For years, both drones match perfectly: they tag the same plants as "weed", give identical answers to queries about weed properties, and predict crop yield impacts identically. During a drought, a stress-mutated sorghum variant emerges, displaying weed-like features but crop-compatible genetics. **G** flags it as "non-weed" and doesn’t spray; it thrives as a crop. **U** flags it as "weed" and recommends spraying. Agronomists confirm it is beneficial sorghum. The drones diverge solely here.  

  ---

  ### Demonstration  
  **(a) Predicate & causal chains**  
  - **Predicate**: "weed" (agronomist-consensus: plants harming sorghum via resource competition).  
  - **G**: Tokens produced when visual input matches *spray-then-regrowth* patterns. Tokens cause herbicide spraying. Inferential role: linked to "crop-threat", "spray-target".  
  - **U**: Tokens produced when input matches verbal/image labels. Tokens cause spray recommendations. Inferential role: identical to G’s pre-divergence.  

  **(b) Content theories & divergence**  
  - **Covariational (Dretske-Fodor)**: Both systems initially covary with weed presence reliably. Post-divergence, both fail covariation (novel case), but theory doesn’t predict *which* fails.  
  - **Teleosemantics (Millikan)**: G’s tokens mean *weed* (function: eliminate weeds via feedback loop). U’s tokens mean *agronomist-designated weed* (function: match labels). Predicts G succeeds (proper function upheld), U fails (misapplies derived function).  
  - **Conceptual-Role (Block-Harman)**: Identical inferential roles → identical content. Predicts no divergence; both should behave identically (falsified by case).  

  *Coincidence*: Teleosemantics uniquely predicts G’s success.  

  **(c) Structural feature & ablations**  
  - **Key feature**: Effector (sprayer) alters environment (creates regrowth data), closing the loop.  
  - **Ablation 1 (passive observer, no effector)**: G cannot generate regrowth data. Teleosemantics assigns same content to G/U. No divergence.  
  - **Ablation 2 (no feedback, loop open)**: G sprays but gets no regrowth input. Teleosemantics treats G like U (derived function). U’s error recurs.  

  **(d) Strongest attack & reply**  
  - **Attack (deflationist)**: Divergence stems from G having extra *information* about regrowth resilience, which U lacked. Content is identical; reliability differs due to data gap.  
  - **Reply**: U *had* all descriptive regrowth data. G’s "extra" information is *indexical*: not "plants *like this* regrow", but "*these* plants *I acted on* regrew". The feedback is token-reflexive, inseparable from G’s actions.  

  **(e) Verdict**  
  The case **breaks the deflationary line**. Grounding carries unique weight: G’s content is fixed by its *intervention history*, enabling correct application in novel scenarios where descriptive information fails. Settling fact: Only G’s token of "weed" is *causally sensitive* to its own prior effector-dependent states.  

  ---

  ### Specification Conflict Resolution  
  **Conflict**: "Matched performance" (Spec 4) vs. "inferential relations" (Spec 7a) requiring divergence.  
  **Resolution**: Pre-divergence, inferential roles match *operationally* (same inputs → same outputs). Post-divergence, the novel input reveals a structural difference in content fixation, not pre-existing inferential disparity.
