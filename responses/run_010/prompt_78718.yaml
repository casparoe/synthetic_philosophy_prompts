prompt: |-
  prepping for a quals oral on origin essentialism and I don't want to walk in able to recite Kripke's table case. Before the candidates, give me the spec: what a theory about where you come from has to deliver to count as adequate — which claims it must explain or dissolve, which distinctions it can't collapse, which results it can't contradict — with the case behind each requirement, and mark which ones are non-negotiable and which are just the house style of a camp (essentialist, contingent-origin, counterpart-theoretic).

  It has to handle these, which I don't think show up in the standard writeups:
  - a lab makes exact physical duplicates of the sperm and egg I came from — same matter, same arrangement — and the copies fuse. Am I the result? If not, what does my origin have that the copy's lacks, given nothing observable differs?
  - the real gametes fuse a day late in a dish and the zygote is otherwise just like the one I came from.
  - the zygote splits at day four and there are two of us — we share an origin, but origins were supposed to individuate.
  - the same gametes fuse and the zygote dies at day three. If origin is necessary and roughly sufficent, is there a world with me in it and no body? What has to get added to the origin claim?
  - mitochondrial donation, and gametes grown from skin cells: which egg counts as "the" egg, and does the thesis quietly assume a natural reproductive system?

  plus: organism or person, vagueness (swap one molecule of the sperm), no fixing transworld identity by origin and then deriving origin from transworld identity, and how any of it could be known given misattributed paternity.

  Then tell me which single requirement knocks out the most candidates, and whether any pair can't both be met — if the list is impossible, that's the result I want. One sentence each on how the main positions do against it. And be explicit about what's settled here vs. genuinely contested among people who work on it; don't hand me a live debate as consensus.
reasoning: |-
  Okay, let me tackle this qual prep request. The user is clearly deep into metaphysics prep and wants a structured framework for evaluating origin essentialism theories. They've listed very specific edge cases that go beyond standard literature - gamete duplication, zygote timing, twinning scenarios, etc. 

  Hmm, their core need seems to be a taxonomy of adequacy conditions where each requirement is anchored to concrete cases. They're explicitly asking to separate non-negotiable constraints from school-specific commitments. That's smart - saves them from getting blindsided by examiners who might conflate the two.

  The mitochondrial donation and lab-grown gamete points suggest they're anticipating modern reproductive tech challenges. Good catch - most seminar discussions still treat gametes as biologically given. And the knowledge problem about paternity shifts is crucial - if origin is essential but epistemically inaccessible, what does that do to modal claims?

  Right, I'll organize this as a spec sheet with tiers of requirements. Must-haves first: individuation failure from the twinning case, non-vacuity constraint from the dead zygote, and causal grounding for the gamete copy problem. The sperm molecule swap exposes vagueness pressure points. 

  For contested zones: the duplicate gametes case will murder Kripkean views but leave counterpart theory standing. Meanwhile, the "same gametes fuse late" scenario breaks contingent-origin theories that don't build in temporal sensitivity. 

  Biggest takeaway: the dead zygote case and twinning problem together make trouble for anyone claiming origin is both necessary and sufficient. That's the killer combo. I'll flag where each major position bleeds - essentialists on twinning, contingent-origin on timing, counterpart theorists on transworld identity.

  Should emphasize that the knowledge problem isn't settled - some bite the bullet on inaccessibility, others invoke counterpart relations pragmatically. And the tech-mediated reproduction cases? Pure philosophical wilderness - no consensus exists. Examiner will likely probe exactly there to test conceptual flexibility.
answer: |-
  Here's the spec for an adequate theory of origin essentialism, built from your edge cases and core challenges, with non-negotiables vs. contingent commitments marked. The most demanding requirements cluster around **individuation** and **causal grounding**.

  ---

  ### **The Adequacy Spec: What a Theory Must Handle**

  1.  **Non-Vacuity Constraint (Non-Negotiable):** Must avoid entailing that an entity exists in worlds where its origin process *fails to produce it*.
      *   *Case:* The actual zygote (from your gametes) dies at day 3. If origin is necessary and sufficient, is there a world with "you" arising from *just* those gametes fusing, but no body forms? A theory can't allow "you" to exist in a world where *that specific zygote* (your causal origin) dies immediately. It must explain what minimal causal process (e.g., successful cell division, implantation, development past a threshold) is required *beyond* mere gamete fusion. (Implies origin is necessary but *not* strictly sufficient alone).

  2.  **Individuation Failure Problem (Non-Negotiable):** Must explain how entities sharing an identical origin point can be distinct individuals.
      *   *Case:* The zygote splits at day 4, producing twins (you and your sibling). Both share the *exact same gametic origin*. If origin is the core individuator, this should be impossible. The theory must either reject origin as the *sole* individuator, incorporate temporal/path-dependence (the split *is* part of the origin process), or provide another account of post-origin individuation without collapsing the twins into one entity.

  3.  **Causal Grounding Requirement (Non-Negotiable):** Must specify what makes *this specific causal history* constitutive of origin, beyond mere physical similarity.
      *   *Case:* A lab creates perfect physical duplicates of the sperm and egg you came from; they fuse. Is that you? Intuitively, no. The theory must explain why the *actual causal chain* (e.g., your parents producing *those specific gametes* at that time, leading to *that specific fusion event*) is essential, while a physically identical but causally disconnected duplicate process is not. It cannot rely solely on observable properties at the origin moment.

  4.  **Temporal Sensitivity (Often Contested / Camp-Specific):** Must account for whether slight temporal shifts in the origin process matter.
      *   *Case:* The actual gametes fuse a day late in a dish, producing a zygote physically identical to yours. Is that you? Essentialists (Kripkean) often say no – the *actual time* is crucial. Contingent-origin theorists might be more flexible. Counterpart theorists can handle it either way. The theory must explicitly state its stance on temporal essentiality and justify it.

  5.  **Vagueness Tolerance (Camp-Specific / Contested):** Must address whether origin is a vague property.
      *   *Case:* Swap one molecule in the sperm cell that fused to produce you. Still your origin? Swap 10%? 50%? 99%? Essentialists typically deny vagueness (the origin is precise). Contingent-origin/counterpart theories can incorporate degrees. The theory must clarify if origin boundaries are sharp and if not, how vagueness impacts necessity claims.

  6.  **Compositional Flexibility (Contested):** Must handle cases where the "gametes" or "origin materials" are non-standard.
      *   *Cases:*
          *   *Mitochondrial Donation:* "Your" egg has nuclear DNA from Mother A and mitochondrial DNA from Mother B. Which maternal contribution defines the essential egg? The nuclear DNA source? The mitochondrial source? The resulting embryo cell *as a whole*?
          *   *Gametes from Skin Cells:* Gametes are derived from a skin cell of Parent X. Is the essential origin the skin cell donor? The artificially created gametes? The theory must avoid presupposing "natural" reproduction and define origin in terms of causal history or information transfer, not biological typicality.

  7.  **Epistemic Accessibility Problem (Non-Negotiable Challenge):** Must be compatible with how we *could* know origin essentialism is true.
      *   *Case:* Misattributed paternity – you believe Gamete Set A is your origin, but Gamete Set B actually is. Does this mean you couldn't have originated from A? How do modal claims ("I couldn't have come from *those* gametes") connect to empirical knowledge? The theory must avoid making essential origin properties fundamentally unknowable in principle or contradictory to how identity is tracked empirically.

  8.  **Organism vs. Person Distinction (Camp-Specific):** Must clarify what entity the origin is essential *to* (the biological organism or the person/persisting self).
      *   *Implication:* If essential to the organism, is personal identity derivative? If essential to the person, how does it relate to the organism's origin? This choice impacts responses to twinning (organisms split, persons may not?), zygote death, and potentially late fusion.

  9.  **Non-Circularity Constraint (Non-Negotiable):** Must not define transworld identity solely by origin and then define essential origin solely by transworld identity.
      *   *Requirement:* The account of *why* origin is essential must be grounded independently (e.g., in causality, kind membership, information) to avoid vicious circularity.

  ---

  ### **The Killer Requirement: Individuation Failure**

  *   **#2 (Individuation Failure - Twinning)** knocks out the *most* naive candidates. Any theory claiming origin (especially understood as simply the gamete fusion event) is the *sole sufficient condition* for individuating a *single* persisting entity is immediately falsified by monozygotic twinning. It forces theories to either:
      *   Reject origin as the sole individuator (add persistence conditions).
      *   Expand "origin" to include the *entire initial developmental path* up to the point of individuation (making origin a process, not a point).
      *   Deny that both twins share *all* essential origin properties (e.g., by making the split event itself origin-constituting for the twins).

  ---

  ### **Impossible Pair?**

  *   **#1 (Non-Vacuity) + Strong Sufficiency Claim:** If a theory insists the specific gamete fusion is *strictly sufficient* for *your* existence (in any world where it happens), it contradicts #1. The dead zygote case shows that fusion alone isn't sufficient for *you* to exist; further development is needed. **Therefore, no theory can successfully claim the *specific gamete fusion event alone* is both necessary and strictly sufficient for your existence.** Sufficiency always requires *some* minimal causal development beyond fusion itself.

  ---

  ### **How Main Positions Handle the Spec (1 Sentence Each)**

  1.  **Kripkean Origin Essentialism (Organism Focused):** Handles #3 & #5 (causal grounding, sharp boundaries) well, struggles severely with #2 (twinning), #6 (non-standard origins), #7 (epistemic access), and requires careful qualification on #1 & #4 (sufficiency, timing).
  2.  **Contingent-Origin Essentialism (Salmon, others):** More flexible on #4 (timing) and potentially #5 (vagueness), still faces #2 (twinning), #7 (epistemology), and needs careful formulation to avoid circularity (#9) and handle #1 (non-vacuity).
  3.  **Counterpart Theory (Lewis-influenced):** Excels at #2 (twinning - different counterparts), #4 (timing - context-dependent similarity), #5 (vagueness - similarity degrees), and #7 (epistemology - pragmatic similarity); struggles most with #3 (causal grounding - similarity can replace actual causation) and providing intuitive necessity (#1, #4 can feel too contingent).
  4.  **Constitution/Stage Views:** Can address #2 (twinning - different constituted persons/organisms post-split) and #8 (organism/person distinction), but face significant challenges explaining the essentiality of the *very first* stage/origin (#1, #3, #4) and avoiding circularity (#9).

  ---

  ### **Settled vs. Contested**

  *   **Settled (Near Consensus):**
      *   Origin (properly understood) is *necessary* for an entity like us (#1, #3 are widely accepted constraints, though details of "origin" differ).
      *   Naive sufficiency (gamete fusion alone = existence) is false (#1).
      *   Circularity (#9) must be avoided.
      *   Twinning (#2) demonstrates origin (as a point event) cannot be the *sole* individuator for persisting entities.
      *   The epistemic challenge (#7) is serious and unresolved; theories must engage with it.
  *   **Genuinely Contested:**
      *   **Temporal Essentiality:** Is the *exact time* of fusion essential? (#4 - Essentialists: Yes, Contingent/Counterpart: Maybe/No).
      *   **Vagueness:** Can origins be vague? (#5 - Essentialists: No, Others: Possibly).
      *   **Sufficiency Conditions:** What *minimal development* beyond fusion is required? (#1 - Highly contested).
      *   **Response to Non-Standard Origins:** What defines "the" gamete/origin in mitochondrial donation or artificial gametes? (#6 - No consensus, active area).
      *   **Organism vs. Person:** Is the essential origin tied to the biological organism or the person? (#8 - Deep philosophical divide).
      *   **Best Response to Twinning:** How exactly to modify or supplement origin to handle individuation? (#2 - Multiple competing proposals).
      *   **Grounding of Necessity:** *Why* is origin necessary? Causation? Kind Membership? Sourcehood? (Fundamental disagreement underlying #3, #9).

  **Crucially:** There is *no consensus* on a single theory that satisfactorily resolves *all* these constraints, especially the combination of #2 (Twinning), #3 (Causal Grounding vs. Duplicates), and #7 (Epistemology). The debate is very much alive. Your edge cases effectively map the battleground. Good luck!
