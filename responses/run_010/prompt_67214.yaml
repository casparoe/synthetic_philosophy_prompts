  For characterization, Nadia must defend orthodox Bayesian deference without compromising her Humeanism. Her challenge is maintaining that 1/2 credence isn't undermined by possible falsification. Callum's position is trickier - he needs coherent reasons for discounting probability that don't collapse into skepticism. His "missing mass" must go somewhere specific, like persistent skew propositions.

  The locked safe element is crucial. Both must address whether fixed-but-unknown outcomes alter deference obligations. I'll have Nadia argue that admissibility treats past/future symmetrically under the chance hypothesis, while Callum counters that the actual pattern's existence changes the epistemic stance.

  On structural flow: I'll open mid-debate with the bet offer to avoid exposition. Point 6 (practical concessions) could naturally lead into their final "crux" statements. The anti-Humean aside must be brief but substantive - perhaps Nadia admitting it would abandon naturalism, Callum rejecting "mysterious modalities".

  For argument integrity: both reformulations should occur organically - maybe Nadia refining admissibility after Callum's persistence argument, Callum adjusting his "skew" threshold when pressed. Their mutual concessions shouldn't resolve tensions; Nadia might acknowledge negligible practical difference while insisting on principle, Callum admitting his stance makes some inferences messier.

  The ending requires particular finesse - two starkly opposed fundamental commitments without synthesis. Nadia's crux might be that credences must align with best-system chances regardless of metaphysical fragility; Callum's that deference requires knowing which system is actual. This preserves the required aporia.

