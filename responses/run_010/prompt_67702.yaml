answer: |-
  ## The Case for Thirdism: Reflection as Arbiter in Sleeping Beauty

  **Fixing the Case**  
  Sleeping Beauty (SB) undergoes an experiment: A fair coin is tossed Sunday night. *Heads*: She is awakened and interviewed only on Monday. *Tails*: She is awakened and interviewed on both Monday and Tuesday. After each awakening, she is given an amnesia drug ensuring that each awakening feels subjectively identical; she knows only that it is either Monday or Tuesday but cannot tell which, nor whether it’s her first or second awakening. Before the experiment begins on Sunday, SB knows the entire protocol. The dispute concerns her rational credence (*Cr*) in *Heads* upon awakening during the experiment, before being told the day. *Halfers* (e.g., Lewis) hold that *Cr(Heads) = 1/2* on Sunday, *Cr(Heads) = 2/3* upon awakening, and *Cr(Heads | Monday) = 1*. *Thirders* (e.g., Elga) hold that *Cr(Heads) = 1/3* upon awakening and *Cr(Heads | Monday) = 1/2*.

  **I. The Halfer Violation of Reflection**  
  Van Fraassen’s Reflection principle mandates rationality: Your current credence in proposition *P*, conditional on the proposition that your future credence in *P* will be *r*, should itself be *r*: *Cr\_now(P | Cr\_future(P) = r) = r*. Crucially, if you are *certain* that your future credence in *P* will be *r* – that is, if *Cr\_now(Cr\_future(P) = r) = 1* – then the conditional collapses, and Reflection requires *Cr\_now(P) = r*. For Reflection to be non-trivial, *Cr\_future(P) = r* must be a genuine proposition about a future doxastic state whose truth-value is uncertain *in principle*, even if not for the agent in a specific case. If the antecedent is certain, the principle demands that present and future credences simply match.

  On Sunday, SB knows the halfer position. She knows that if she adopts the halfer view, upon awakening she will be certain that her credence in *Heads* is *2/3*. Formally, Sunday SB is certain: *Cr\_Sunday(Cr\_Monday(Heads) = 2/3) = 1*. Reflection therefore insists *Cr\_Sunday(Heads) = 2/3*. Yet the halfer assigns *Cr\_Sunday(Heads) = 1/2*. This is not a marginal discrepancy or a case of borderline applicability. It is a direct, unambiguous contradiction: *1/2 ≠ 2/3*. The halfer view intrinsically violates Reflection. For Reflection to avoid triviality, it must be possible for the agent to be *uncertain* about their future credence. Here, Sunday Beauty *is* certain about her Monday credence (if she’s a halfer), and the principle demands alignment, which the halfer numbers explicitly reject.

  **II. Defending the Relevant Reflection Principle**  
  The obvious retort is that Reflection is notoriously fragile. We don’t defer to future selves who are drunk, misinformed, or have forgotten crucial evidence. Sunday Beauty knows Monday Beauty suffers amnesia regarding Sunday night and potentially prior awakenings. Doesn’t this impairment nullify any requirement of deference?

  This concession is valid but insufficient to save the halfer. Reflection misfires when future impairment involves *loss* of evidence or *irrational* processing. However, a restricted principle remains compelling: **Deference is required to a future self formed by conditionalizing your present total evidence on strictly *additional* evidence, with no evidence lost or irrationality introduced.** This *Conditionalization-Based Reflection* (CBR) is not an *ad hoc* restriction; it falls out directly from Bayesian conditionalization itself. If your future self *Sf* possesses your current evidence *Ec* plus new evidence *En*, and rationally updates via conditionalization, then *Cr\_f(P) = Cr\_now(P | En)*. Crucially, your current expectation of *Sf*'s credence in *P* is *just* your current conditional credence *Cr\_now(P | En)*. Therefore, *conditional* on knowing exactly what *En* will be (and thus knowing *Cr\_f(P)*), your current *Cr\_now(P)* must equal that value. CBR formalizes the idea that rational belief change via conditionalization preserves a thread of epistemic continuity worthy of deference.

  The halfer’s shift from *Cr\_Sunday(Heads) = 1/2* to *Cr\_Monday(Heads) = 2/3* falls outside CBR’s scope. Crucially, the halfer *denies* that Monday Beauty acquires any new *relevant* evidence about the coin toss. Lewis explicitly argues that the only new evidence upon awakening is the *self-locating* information "I am awake now" or "this awakening is occurring." This evidence, he contends, provides no information about whether the coin landed heads or tails; it simply tells her the experiment is in progress, which she already knew on Sunday would be true on Monday. If no new *relevant* evidence is acquired (especially none pertaining to the coin), then the shift from 1/2 to 2/3 cannot be justified as conditionalization on new evidence. CBR requires conditionalization to explain deference; the halfer shift lacks this justification, making the Reflection violation genuine and problematic.

  **III. The Halfer’s Dilemma: Identity of Content vs. Stability of Credence**  
  The halfer’s strongest defence attacks the very applicability of Reflection. Lewis argues that the propositions evaluated differ crucially. Sunday Beauty considers the *tenseless* proposition "The coin lands heads." Monday Beauty, upon awakening, considers a subtly different proposition: "The coin lands heads *and this awakening is occurring now*," or perhaps "The coin lands heads *on the toss associated with this awakening*." Because the Monday proposition incorporates an essential indexical element ("this awakening," "now") absent from Sunday’s proposition, they are distinct contents. Therefore, the argument runs, Reflection doesn’t apply – there is no single proposition *P* about which both Sunday and Monday Beauty hold credences that Reflection could demand be equal conditional on certainty about the future value.

  This objection forces a critical dilemma upon the halfer:

  1.  **Same Proposition:** If "Heads" denotes the *same tenseless, non-indexical proposition* for both Sunday and Monday Beauty – "The fair coin landed heads on Sunday night" – then the halfer shift from 1/2 to 2/3 is manifestly irrational. Sunday Beauty possesses all evidence relevant to the coin toss. Monday Beauty gains only the self-locating evidence that *an* awakening is occurring, which the halfer concedes provides no new information about the *coin*. Without new evidence bearing on *P*, conditionalization mandates *no change* in credence for *P*. The halfer’s increase to 2/3 is therefore unmotivated by their own core tenet ("no new coin evidence") and violates conditionalization.
  2.  **Different Propositions:** If Sunday’s "Heads" and Monday’s "Heads" denote *different propositions* – the latter incorporating an indexical component – then the halfer’s central motivation for assigning 1/2 *upon awakening* evaporates. That motivation was precisely that the coin is fair, nothing has been learned about it, and therefore *Cr(Heads)* must still be 1/2. But if the proposition Monday Beauty is evaluating is *not* simply "the fair coin landed heads," but rather a complex proposition like "Heads *and this is the relevant awakening*," then the fairness of the coin *alone* does not dictate that this complex proposition has a probability of 1/2. The halfer’s appeal to "no new coin information" justifying 1/2 *on Monday* directly relies on Monday’s "Heads" being the *same coin proposition* as Sunday’s. If they are different, the halfer needs a new justification for assigning 1/2 to the *indexical* proposition on Monday, which they notably fail to provide (and which indifference or centered evidence might suggest is 1/3).

  The halfer cannot have it both ways. Either the proposition is the same, making the shift irrational, or it’s different, undermining the rationale for assigning 1/2 upon awakening. The indexicality defence, intended to shield the halfer from Reflection, instead isolates the fundamental instability in their position. To salvage 1/2 on Monday, they need the proposition to be the simple coin toss. To explain the shift from Sunday, they need it to be indexical. They cannot consistently maintain both.

  **IV. Why Thirdism Satisfies Conditionalization-Based Reflection**  
  The thirder view navigates this dilemma cleanly and satisfies CBR at every stage. On Sunday, SB’s *Cr(Heads) = 1/2*. She is also certain that upon awakening, her credence in *Heads* (understood as the tenseless coin outcome) will be 1/3. Crucially, *this shift is justified by conditionalization*. Sunday SB possesses a rich self-locating belief: she knows it is Sunday before the experiment. Upon awakening, she learns new evidence: "*This* awakening is occurring." Crucially, this evidence *is* relevant to *Heads* under the protocol. Given that *Tails* leads to twice as many awakenings, the evidence "I am experiencing an awakening now" is twice as likely to occur under *Tails* than under *Heads*. Therefore, *Cr\_Monday(Heads) = Cr\_Sunday(Heads | Awakening) = (1/2) / (1/2 + 1/2 * 2) = (1/2) / (3/2) = 1/3*. The shift from 1/2 to 1/3 upon awakening is rational conditionalization on new relevant evidence *En* = "An awakening is occurring now." Sunday SB, knowing she will conditionalize on *En*, expects *Cr\_Monday(Heads) = 1/3*. Reflection is satisfied: *Cr\_Sunday(Heads | Cr\_Monday(Heads) = 1/3) = Cr\_Sunday(Heads | En) = 1/3*.

  Furthermore, when Beauty learns "*Today* is Monday" (*M*), she conditionalizes again. Her Monday credence updates: *Cr\_Monday(Heads | M) = Cr(Heads and M) / Cr(M) = (1/3) / (1/3 + 1/3) = (1/3) / (2/3) = 1/2*. This shift is rationalized by acquiring new evidence *M*.

  CBR also holds between the Monday and Tuesday awakenings under *Tails*. Suppose it is Tuesday. Beauty awakens with credence *Cr(Heads) = 1/3*, just like Monday. Monday Beauty (under tails) knows that if it is Tuesday, her future Tuesday self will also have *Cr(Heads) = 1/3*. Crucially, Tuesday Beauty gains *no new relevant evidence* compared to Monday Beauty in this scenario; both awakenings are subjectively indistinguishable, possessing only the evidence "An awakening is occurring now." Therefore, Tuesday Beauty *conditionalizes on the exact same total evidence* as Monday Beauty (under tails). CBR mandates that their credences agree, which they do: both assign 1/3 to *Heads*. Monday Beauty expects this agreement with certainty: *Cr\_Monday(Cr\_Tuesday(Heads) = 1/3) = 1* (conditional on *Tails*), and *Cr\_Monday(Heads) = 1/3*, satisfying Reflection. The thirder view exhibits stable, rational credence dynamics justified by conditionalization at every step where CBR applies.

  **Strongest Unanswered Objection**  
  *The Irreducible Indexicality Objection:* The most robust challenge contends that the tenseless proposition "The coin landed heads" (H) is genuinely *not* the object of credence for awakened Beauty. Instead, her doxastic state concerns essentially indexical propositions like "The coin landed heads *and this is the awakening it is associated with*" (H\*). Reflection requires a single proposition P. If H\* is fundamentally different from H, then Sunday Beauty credences H, Monday Beauty credences H\*, and Reflection cannot bridge the gap. The halfer’s violation of Reflection is therefore illusory; the principle simply doesn’t get a grip. For this to succeed, it must be true that self-locating beliefs fundamentally alter the *semantic content* of belief itself, such that "H" and "H\*" are not merely the same proposition under different modes of presentation, but distinct objects of thought. This requires a strongly contextualist or centered-world semantics where the *proposition believed* is inherently tied to the agent’s spatio-temporal context in a way that makes the Sunday and Monday beliefs genuinely *about* different things, rendering direct credence comparisons across time invalid. If this metaphysics of content holds, then Reflection cannot be applied cross-contextually, shielding the halfer from the argument.
