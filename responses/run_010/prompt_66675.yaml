  The user suspects part of this debate is verbal—depending on whether "computation" is defined narrowly (symbol manipulation) or broadly (any formalizable process). They also mention two complications: the role of semantic content in computation, and the objection that comparing a specific system like the Watt governor to an abstract Turing machine is flawed. They want the statement to clarify what's real disagreement versus terminological issues.

  For the joint statement, I need to start with agreed-upon claims: shared formal machinery (like translatability between discrete/continuous models), triviality worries (how they don't resolve everything), and mutual obligations (e.g., dynamical side explaining productivity, computationalists defining implementation criteria). Then, I'll outline disagreements in a table format, covering the core disputes, whether they're substantive or verbal, the crux questions, test cases, and predictions. Finally, each side should state what evidence would falsify their view, and I'll conclude by analyzing which parts are verbal.

  The core disagreements include:
  - Whether cognition requires content-bearing states: Computationalists say yes, it's essential; dynamicalists say no, it's unnecessary. This is substantive—the crux is if there's empirical evidence of non-derived content. Test case: perceptual illusions like the waterfall effect could be examined for representational vs. direct coupling explanations.
  - The scope of "computation": Computationalists use a broad definition (any formalizable process), while dynamicalists prefer narrow (symbol manipulation). This is largely verbal—the crux is about the term's usefulness. Agreeing on terminology could resolve this.
  - The Watt governor as a foil: Dynamicalists see it as proof of non-computational cognition; computationalists argue it's computable and not a fair comparison. This is substantive—the crux is whether cognition can be reduced to coupled systems without internal representations. Test case: modeling insect navigation might show if coupled dynamics suffice or if representations are needed.
  - Implementation criteria: Computationalists need a non-vacuous account to avoid triviality; dynamicalists argue it's unsolvable. The crux is if a principled distinction exists. Experiment: lesion studies on neural circuits could test if specific computations are disrupted.

  For falsifiability:
  - Computationalists: Evidence that cognition lacks systematicity or that neural states don't bear content.
  - Dynamicalists: Evidence that cognition requires discrete states or that dynamics alone can't explain high-level reasoning.

  I'll conclude that the content and scope debates are substantive, while the broad vs. narrow computation definition is verbal. The rest involves empirical and conceptual issues.

  I'll write this clearly and neutrally, avoiding citations as requested, and aim for about three pages. The result should help the group move forward by pinpointing where real disagreements lie.
answer: |-
  ## Joint Statement on Computation and Cognition: A Collaborative Framework  
  **Produced by the Adversarial Collaboration Working Group**  
  *Classical Computationalist (CC) and Dynamical/Embodied Cognitivist (DEC) Signatories*

  ### Section 1: Points of Agreement  
  We jointly affirm the following, which provide a shared foundation for constructive disagreement:

  1.  **Formal Descriptiveness:** Both discrete-symbolic algorithms (e.g., Turing machines, finite-state automata) and continuous dynamical systems (e.g., systems of differential equations) are rigorous formal frameworks capable of describing cognitive processes. These frameworks are often mathematically inter-translatable under specific constraints (e.g., via discretization of continuous systems or analog interpretations of discrete computations).
  2.  **Multiple Realizability & Underdetermination:** Any finite physical process (including neural activity) admits of indefinitely many formal descriptions. No single "correct" description is dictated solely by the physics; the choice of framework involves pragmatic considerations of explanatory power, predictive accuracy, and conceptual coherence for the target phenomenon.
  3.  **Triviality Worries: What They Do and Don’t Show:**
      *   The observation that virtually any open physical system can be mapped *onto* *some* finite-state automaton (the "triviality" result) demonstrates that mere *describability* in computational terms is insufficient to establish that a system is *genuinely* computing in a theoretically interesting sense.
      *   This does **not** establish that cognition *isn’t* computational (CC view), nor does it prove that the computational description is *always* vacuous or metaphorical (DEC view). It highlights the need for substantive criteria beyond mere formal describability.
  4.  **Mutual Explanatory Obligations:**
      *   The DEC camp acknowledges the need to provide compelling dynamical models that explicitly account for hallmarks of cognition like **systematicity** (the ability to produce/understand novel combinations of familiar elements) and **productivity** (the ability to generate/comprehend a potential infinity of expressions/behaviors) without covertly relying on representational/computational assumptions.
      *   The CC camp acknowledges the need to provide a **non-vacuous, empirically grounded criterion** for when a specific neural system implements one particular computation (e.g., addition, rule application) rather than another, or rather than merely instantiating a complex dynamical system. This criterion must avoid both the triviality result and excessive neurobiological implausibility.

  ### Section 2: Core Disagreements
  The following table outlines the key unresolved disputes. Each row presents the disagreement as stated by one side (acknowledged as fair by the other), its nature, the crucial sub-question, a mutually acceptable test case/argument, and each side's prediction.

  | Disagreement (Stated from Perspective)                                                               | Substantive (S) / Verbal (V) / Mixed (M) | Crux Sub-Question                                                                 | Concrete Case/Experiment/Argument                                                                                              | CC Prediction                                                                 | DEC Prediction                                                                 |
  | :---------------------------------------------------------------------------------------------------- | :---------------------------------------- | :-------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------- | :----------------------------------------------------------------------------- |
  | **CC Stated:** Cognition fundamentally involves the manipulation of internal states that bear non-derived semantic *content* (representations). Explaining cognition requires identifying these vehicles and the algorithms operating over them. | **S**                                     | Is there empirical evidence that neural states function as *bearers of semantic content* (e.g., reference, truth-conditions) in a non-trivial, non-derived way? | Examine neural activity during ambiguous perception (e.g., bistable figures, the "waterfall illusion"). Does the observed activity pattern *function* as a representation of a specific state of affairs, or can the behavior be fully explained by the dynamics of sensory-motor coupling? | Neural patterns will show context-independent encoding of features/objects that causally mediate behavior in a way satisfying representational criteria (e.g., error-correction, compositionality). | Neural patterns will reflect continuous sensorimotor parameters and context-dependence, lacking stable, detachable content-bearing properties. Explanations relying solely on coupled dynamics will suffice. |
  | **DEC Stated:** Cognition is best understood as continuous, non-symbolic, embodied coupling between agent and environment, formally modeled as dynamical systems. Attributing internal representational content is often explanatorily superfluous or misleading ("merely redescription"). | **S**                                     | Can core cognitive phenomena (e.g., goal-directed action, learning, perceptual categorization) be modeled *more effectively* without positing internal content-bearing states? | Develop competing models of insect navigation (e.g., path integration): one using explicit vector representations and algorithmic updating (CC), one using continuous attractor dynamics in neural populations coupled with optic flow (DEC). Compare predictive power, parsimony, and biological plausibility. | Models requiring explicit representational states and operations will show superior generalization, flexibility in novel tasks, and clearer mapping to neural data revealing discrete state changes. | Dynamical models will provide more parsimonious, neurally realistic accounts capturing the seamless real-time adaptation, avoiding the need to locate and define the "content" of transient neural states. |
  | **CC Stated:** "Computation" is legitimately applied broadly to any medium-independent, formally describable causal process that reliably instantiates a function. Dynamical models *are* computational models under this broad view. | **V/M** (Primarily V)                     | Is defining "computation" so broadly that it includes all dynamical systems *useful* for understanding cognition, or does it obscure crucial distinctions? | Analyze Van Gelder's Watt Governor: Is describing it as "computing" its equilibrium state (broad view) illuminating, or does it conflate fundamentally different explanatory strategies (continuous regulation vs. discrete symbol manipulation)? | The broad view is essential and illuminating: it highlights the functional equivalence and formal underpinnings shared by diverse systems. Denying the Watt Governor computes is arbitrary. | The broad view is vacuously inclusive. Calling the Watt Governor a "computer" obscures the key insight that cognition can be explained *without* the symbolic-representational machinery central to the narrow sense. |
  | **DEC Stated:** The Watt Governor is a valid *foil* demonstrating a powerful cognitive-like process (regulation) that is clearly *not* computational in the narrow, symbol-manipulating sense. | **S**                                     | Does the Watt Governor analogy successfully challenge the *necessity* of the narrow computational (symbolic) framework for explaining cognition? | Can the core argument for the *generality* of symbolic computation (e.g., Turing universality, systematicity/productivity arguments) be applied to, or refuted by, considering systems like the Watt Governor? | Yes, the Governor is a poor foil: it's a single, simple, non-universal system. Symbolic computation is an *abstraction* capable of modeling *classes* of systems (including dynamical ones) exhibiting systematicity/productivity the Governor lacks. | Yes: The Governor directly demonstrates a complex, adaptive, goal-directed process achievable without representational states or algorithms, challenging the *necessity* of the CC framework for core cognitive functions, even if not for all. |
  | **CC Stated:** A principled, non-vacuous criterion for neural implementation of a *specific computation* (beyond mere formal describability) is achievable (e.g., via causal structure, functional isomorphism). | **S**                                     | Can a criterion be formulated that distinguishes a neural system *implementing* computation P from one merely being *described* by P, that avoids triviality *and* is empirically applicable? | Propose specific implementation criteria (e.g., based on counterfactual causal structure, Kim's model-to-mechanism mapping). Apply them to a debated case (e.g., does the cerebellum "compute" sensorimotor predictions or merely exhibit predictive dynamics?). | Yes, criteria focusing on the causal topology of neural circuits and their counterfactual-supporting structure will robustly pick out specific computations without triviality. | No satisfactory non-trivially-stipulative criterion exists. Any proposed criterion will either be too weak (admitting non-computational systems) or too strong/arbitrary (failing to apply to plausible neural implementations). The "implementation" problem is intractable for the CC view. |

  ### Section 3: Falsifiability and the Verbal Core

  *   **CC Stated Falsifiability:** Evidence that would seriously challenge the CC view includes: (1) The consistent failure to identify neural states satisfying plausible criteria for bearing non-derived content across core cognitive domains. (2) The demonstration that key cognitive phenomena (like systematic linguistic reasoning or complex planning) *cannot* be effectively modeled algorithmically over symbolic representations, even in principle, while being successfully modeled purely dynamically *without* adding representational interpretations. (3) A conclusive argument showing that the implementation problem for specific computations in neural tissue is fundamentally unsolvable on principled grounds.
  *   **DEC Stated Falsifiability:** Evidence that would seriously challenge the DEC view includes: (1) The successful derivation of discrete, content-bearing representational states and algorithmic operations *directly* and *non-trivially* from the mathematics of coupled dynamical systems *without* adding exogenous representational assumptions. (2) Strong empirical evidence that high-level cognition (e.g., abstract reasoning, language comprehension) *requires* discrete, context-independent state transitions that cannot be smoothly realized by continuous dynamics alone. (3) The demonstration that dynamical models fundamentally *cannot* account for productivity and systematicity without effectively smuggling in computational/representational structure.

  **Conclusion on the Verbal Element:** We conclude that a **significant portion of the "is the brain a computer?" dispute is verbal**, stemming primarily from **differing default scopes for the term "computation."**

  *   **The Verbal Core:** When the CC camp uses "computation" in the *broad* sense (any formally describable, medium-independent process instantiating a function), and the DEC camp uses it in the *narrow* sense (discrete, rule-governed manipulation of syntactically structured, semantically evaluable symbols), their claims often bypass each other. Under the broad definition, the DEC models *are* computational, making the CC claim "the brain computes" trivially true. Under the narrow definition, the DEC advocate *rightly* denies that their models involve computation in that specific sense, and the claim "the brain computes" is a substantive empirical hypothesis they reject. Much heat is generated by this definitional mismatch.
  *   **What Remains Substantive:** Even if terminology is clarified, **significant substantive disagreements persist**:
      *   Whether cognition *necessarily* involves internal states bearing non-derived semantic **content** (DEC: no, CC: yes).
      *   Whether the **explanatory primacy** lies with discrete algorithmic processes over symbolic vehicles (CC) or with continuous, non-representational, embodied/environment-coupled dynamics (DEC).
      *   Whether the **implementation problem** for specific computations in neural systems has a non-vacuous solution (CC: yes, DEC: no).
      *   The validity and force of the **Watt Governor as a challenge** to the necessity of the symbolic paradigm.
      *   The ability of **dynamical models** to fully account for **systematicity and productivity** without representational resources.

  This statement clarifies the terminological trap and isolates the genuine empirical and conceptual issues requiring further investigation. Progress depends on addressing these substantive questions directly, using the agreed-upon formal tools and mutual obligations outlined in Section 1.
