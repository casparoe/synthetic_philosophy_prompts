answer: |-
  ### Critical Flaw in the CWL Spec
  The expiry convention ("positions expire worthless in the non-adopted branch") creates a fatal circularity:  
  - Contract prices depend on traders' beliefs about which policy *will be adopted* (since non-adopted contracts pay zero).  
  - But the adoption decision *itself* depends on those prices.  

  This circularity distorts prices away from estimating welfare. Specifically:  
  - **Price ≠ Expected welfare under the policy.**  
  - **Price = (Expected welfare | policy adopted) × (Probability of adoption)**.  

  A policy with low expected welfare can have a high price if traders believe it's likely to be adopted. The adoption rule then selects based on this confounded price, not pure welfare.  

  **Consequence:** The mechanism fails its purpose. Prices don't estimate the required quantity, and manipulation is trivial (see model answer).  
  **Fix needed before proceeding:** Change the payoff structure to break the circularity. Example solution in Part 4 of the model answer.  

  ---

  ### Exam Question  
  **Conditional Welfare Ledger (CWL) Specification**  
  *A public body faces a binary choice between policy A and policy B, adopting one by time T. Two contracts are issued:*  
  - *Contract A pays one unit of currency per point of a pre-registered welfare index W, measured post-T, but* only *if policy A is adopted.*  
  - *Contract B pays W, but* only *if policy B is adopted.*  
  *Trading runs until T. Positions in the contract for the non-adopted policy expire worthless. At T, the body adopts whichever contract has the higher volume-weighted average price (VWAP) over the final trading week.*  
  *To address thin liquidity, a treasury-funded market-maker quotes both sides of both contracts at a fixed spread, fills any order up to a stated size, and is prohibited from trading on information about which policy will be adopted.*  

  **Answer All Parts**  
  1. **Price Interpretation** (5 marks)  
     The price of contract A at a given time estimates a specific mathematical quantity derived from W and the adoption outcome. What is this quantity? Separately, what quantity *should* the price estimate for the adoption rule to correctly maximize expected welfare? Precisely explain why these quantities differ.  

  2. **Manipulation Cost** (10 marks)  
     Identify an actor who could profitably manipulate the adoption decision. Calculate their minimum cost to ensure policy A is adopted, assuming:  
     - The market-maker’s current ask price for contract A is $p_A$ per unit.  
     - The actor’s trades dominate final-week trading volume in contract A.  
     Express the cost in units of the treasury’s exposure (i.e., per unit of W). Show your work.  

  3. **Market-Maker Evaluation** (5 marks)  
     Does the market-maker mitigate either the quantity mismatch (Part 1) or the manipulability (Part 2)? Justify your answer.  

  4. **Payoff Redesign** (5 marks)  
     Propose a change to *what the contracts pay* (not transparency or disclosure) that ensures the price estimates the quantity required in Part 1. Explain how it resolves the issue.  

  ---

  ### Model Answer (900 words)  
  #### Part 1: Price Interpretation  
  The price of contract A estimates the expected value of \(W \times \mathbb{I}_A\), where \(\mathbb{I}_A = 1\) if policy A is adopted and 0 otherwise. This is because the contract pays \(W\) if A is adopted, and 0 otherwise. Traders exchange the contract at prices reflecting the expected payment:  
  \[
  \text{Price}_A = E[W \times \mathbb{I}_A].
  \]  

  For the adoption rule (choose policy with higher price) to maximize expected welfare, the price should estimate \(E[W \mid \text{A adopted}]\). This is the expected welfare *conditional on policy A being implemented*.  

  These quantities differ because:  
  \[
  E[W \times \mathbb{I}_A] = E[W \mid \text{A adopted}] \times P(\text{A adopted}).
  \]  
  The price confounds two factors: (1) the expected welfare under A, and (2) the probability that A is adopted. A policy with low expected welfare (\(E[W \mid \text{A adopted}]\) near 0) can have a high price if \(P(\text{A adopted})\) is high. Conversely, a policy with high expected welfare may have a low price if adoption is deemed unlikely.  

  **Why this undermines the rule:** The adoption decision uses prices as proxies for \(E[W \mid \text{policy}]\), but prices also embed adoption probabilities. If traders believe policy A will likely win, this inflates \(\text{Price}_A\) regardless of its true welfare effect, potentially leading to adoption of inferior policies.  

  #### Part 2: Manipulation Cost  
  **Actor:** A well-resourced entity (e.g., a corporation) that benefits from policy A’s adoption and can absorb trading losses. They profit if the value of A’s adoption exceeds their trading cost.  

  **Manipulation method:** Buy contract A at the market-maker’s ask price during the final week. Since:  
  - Their trades dominate volume, the VWAP of A becomes approximately the price they pay.  
  - By buying enough, they ensure \(\text{VWAP}_A > \text{VWAP}_B\), forcing A’s adoption.  

  **Cost calculation:**  
  - The actor buys \(Q\) units at ask price \(p_A\) set by the market-maker. Total cost = \(Q \times p_A\).  
  - If A is adopted (which their trade ensures), each contract pays \(W\). The actor receives \(Q \times W\).  
  - Their net cost is \(Q \times (p_A - W)\).  

  Since \(W\) is uncertain, the actor bears risk. However, they can choose \(Q\) arbitrarily large to ensure adoption. For a fixed \(Q\), the net cost per unit of welfare exposure is \(p_A - W\). The *minimum certain cost* to guarantee adoption (ignoring \(W\) risk) is achieved as \(Q \to \infty\):  
  \[
  \text{Cost per unit welfare} = p_A.
  \]  
  **Explanation:**  
  - The treasury’s exposure per contract is \(W\) (units: welfare).  
  - The actor spends \(p_A\) per contract to manipulate.  
  - Even if \(W\) is high, the actor pays \(p_A\) upfront. For example, if \(p_A = \$10\), the cost is \(\$10\) per unit of \(W\), regardless of \(W\)’s value.  

  #### Part 3: Market-Maker Evaluation  
  **Quantity mismatch (Part 1):** No mitigation. The market-maker does not alter the payoff structure. Prices still reflect \(E[W \times \mathbb{I}_A]\), not \(E[W \mid \text{A adopted}]\), because the contract payout remains contingent on adoption. The market-maker’s presence may even *worsen* the distortion by amplifying speculative adoption beliefs via liquid trading.  

  **Manipulation (Part 2):** No mitigation. The market-maker *enables* cheap manipulation:  
  - It offers unlimited liquidity at a fixed spread, allowing the actor to buy large volumes at known cost \(p_A\).  
  - The prohibition on using adoption information prevents the market-maker from adjusting prices to counteract manipulation.  
  - Without the market-maker, low liquidity might raise manipulation costs (e.g., needing to bid up prices). Here, the actor exploits predictable pricing.  

  #### Part 4: Payoff Redesign  
  **Proposal:** Make both contracts pay \(W\) *regardless of which policy is adopted*. To retain the adoption incentive:  
  - Add a "policy selector" contract that pays $1 if policy A is adopted and $0 otherwise.  
  - The body adopts policy A if the price of the policy-A selector contract exceeds 0.5.  

  **How it resolves Part 1:**  
  - The welfare contract for A now pays \(W\) unconditionally. Its price estimates \(E[W]\), which is policy-independent and useless for decisions.  
  - Instead, use the *policy selector contract* price for adoption. Its price, \(P_{\text{sel}}\), estimates \(P(\text{A adopted})\).  
  - To estimate \(E[W \mid \text{A adopted}]\), introduce a *conditional welfare contract* that pays \(W\) only if A is adopted. Its price is:  
    \[
    \text{Price}_{\text{cond}} = E[W \times \mathbb{I}_A] = E[W \mid \text{A adopted}] \times P(\text{A adopted}).
    \]  
  - Compute the required quantity:  
    \[
    E[W \mid \text{A adopted}] = \frac{\text{Price}_{\text{cond}}}{P_{\text{sel}}}.
    \]  
  - The body adopts A if \(\frac{\text{Price}_{\text{cond,A}}}{P_{\text{sel,A}}} > \frac{\text{Price}_{\text{cond,B}}}{P_{\text{sel,B}}}\).  

  **Why it works:** Prices for conditional welfare contracts (\(E[W \times \mathbb{I}_A]\)) and selector contracts (\(P(\text{A adopted})\)) are disentangled. The adoption rule uses their ratio, which directly estimates \(E[W \mid \text{A adopted}]\) without circularity.  

  ---

  ### Marking Scheme (25 marks)  
  | Part | Must-hit points                                                                                                | Marks | Common errors                                                                 |
  |------|----------------------------------------------------------------------------------------------------------------|-------|-------------------------------------------------------------------------------|
  | 1    | Price estimates \(E[W \times \mathbb{I}_A]\)                                                                   | 1     | Confuses payout; says "expected welfare" vaguely.                             |
  |      | Required estimate: \(E[W \mid \text{A adopted}]\)                                                              | 2     | Omits conditioning or confounds with unconditional expectation.               |
  |      | Correct difference: \(E[W \times \mathbb{I}_A] = E[W \mid \text{A}] \times P(\text{A})\)                       | 2     | Fails to derive mathematically; handwaves "influence of probability".         |
  | 2    | Identifies actor with non-financial motive (e.g., policy beneficiary)                                          | 2     | Assumes profit-seeking trader; misses that manipulation may be loss-making.   |
  |      | Net cost = \(Q \times (p_A - W)\), or cost per unit welfare = \(p_A\) (with justification)                     | 5     | Forgets contract payout after adoption; omits units; misses dominance of VWAP.|
  |      | Explicitly ties cost to treasury exposure (units of W)                                                         | 3     | Cost not quantified or in dollars only.                                       |
  | 3    | Rejects market-maker for quantity mismatch (payoff unchanged)                                                  | 2     | Claims prices "become efficient" with liquidity.                              |
  |      | Rejects for manipulation (market-maker enables predictable cost)                                               | 3     | Argues spread increases cost; misses fixed pricing enabling large trades.     |
  | 4    | New payoff: Contracts pay W unconditionally OR decouple adoption/welfare (e.g., selector + conditional)        | 3     | Focuses on transparency (e.g., "audit trades") not payoffs.                   |
  |      | Explains how new structure estimates \(E[W \mid \text{A}]\) without \(P(\text{A})\)                            | 2     | No mathematical basis; vague "now prices reflect true welfare".               |

  ---

  ### What Separates a First-Class Answer  
  A **merely competent** answer correctly identifies the price as \(E[W \times \mathbb{I}_A]\) and the manipulation cost as \(p_A\), but treats these in isolation. A **first-class** answer:  
  1. **Synthesizes flaws**: Explains *why* circularity makes price ≠ welfare estimate (Part 1) and *how* this enables cheap manipulation (Part 2).  
  2. **Quantifies rigorously**: Derives \(E[W \times \mathbb{I}_A] = E[W \mid \text{A}] \times P(\text{A})\) mathematically; computes exact cost per unit welfare under market-maker constraints.  
  3. **Anticipates dynamics**: Notes that the market-maker’s fixed pricing *reduces* manipulation cost versus illiquid markets.  
  4. **Redesigns holistically**: Part 4 proposal eliminates circularity by redesigning payoffs (not adding bandaids) and shows algebraically why the new price ratio works.  

  ---  
  **Time guideline:** 2 hours total. Allocate ~25 mins per part.
