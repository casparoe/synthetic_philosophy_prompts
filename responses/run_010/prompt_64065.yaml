prompt: |-
  I'm a staff software engineer at a payments company. I have no formal training in philosophy or economics; what I know I've picked up by reading on my own. For three years I've run an optional ten-week evening seminar for engineers here on mechanisms for collective decision-making, and week eight is always futarchy — the proposal to let a democratic vote settle the ends and let prediction markets settle the means. The seminar ends with a written assessment. I want to replace this year's question, because it can now be answered competently by anyone who has read a summary of the proposal online.

  Here is the design I want the question built around. I sketched it myself; treat it as the spec the students are handed.

  The Conditional Welfare Ledger (CWL). A public body faces a binary choice between policy A and policy B and must adopt one by a fixed date T. Two contracts are issued, each paying one unit of currency per point of a welfare index W that is pre-registered before trading opens and measured over a fixed window after T. Contract A pays only in the world where A is adopted; contract B pays only in the world where B is adopted. Trading runs continuously until T. Positions in the contract for the branch that is not adopted expire worthless; they are neither unwound nor refunded. At T the body is obliged to adopt whichever contract has the higher volume-weighted average price over the final trading week. To address thin liquidity, the treasury funds a standing market-maker that quotes both sides of both contracts at a fixed spread, must fill any order up to a stated size, and is prohibited from trading on any information bearing on which policy will be adopted.

  It is a 48-hour take-home on which I expect roughly two hours of work. The question should force students to work out from the spec alone what the CWL price is actually an estimate of, what the adoption rule requires it to be an estimate of, and precisely why those come apart. It should require them to identify at least one actor for whom moving the adoption decision is cheap given the expiry convention I've specified, and to express that cost in the same units as the treasury's exposure — a candidate who says manipulation is possible but never works out what it costs should not pass. It should then require them to judge whether the market-maker patch addresses either of those two problems, and to say what a real patch would have to change about the payoff structure rather than about transparency, auditability, or disclosure.

  Deliverables: the question exactly as students would see it, including the spec; a model answer of roughly 900 words; a marking scheme out of 25 built around must-hit points, each with its mark value and one line on how candidates typically botch it; and a short closing paragraph saying what separates a first-class answer from a merely competent one.

  Two constraints. First, no citations, bibliography, or named literature anywhere in the question or the model answer. The students have no reading list, and I don't want to imply that a good answer depends on having read someone; everything must be arguable from the spec. Second, the model answer should build up any concept it needs rather than naming it. If it requires a distinction from decision theory or social choice theory, state the distinction and say what turns on it — don't deploy a term of art and assume the reader already has it. I will be reading the model answer myself to check it, and I won't be able to tell whether an unexplained technical term is doing work or just decorating.

  One more thing, and please do it first: if any part of the CWL spec as I've written it is incoherent, unimplementable, or accidentally settles the very issue the question is meant to leave open, say so separately before writing anything else. I would much rather hear that now than have thirty engineers writing careful answers about a broken mechanism.
reasoning: |-
  We are given a spec for the Conditional Welfare Ledger (CWL) and asked to design an exam question and model answer. However, the first step is to check the spec for coherence and potential issues.

   Let's break down the CWL spec:

   1. Two contracts: Contract A and Contract B.
      - Contract A pays per point of welfare index W only if policy A is adopted.
      - Contract B pays per point of welfare index W only if policy B is adopted.

   2. Trading runs until time T.

   3. At time T, the body must adopt the policy (A or B) whose contract has the higher volume-weighted average price (VWAP) over the final trading week.

   4. Positions in the contract for the branch not adopted expire worthless.

   5. To address thin liquidity: 
      - The treasury funds a standing market-maker that:
          a) Quotes both sides of both contracts at a fixed spread.
          b) Must fill any order up to a stated size.
          c) Is prohibited from trading on any information bearing on which policy will be adopted.

   Now, let's look for problems:

   **Problem 1: What does the price represent?**

   The contract for policy X (where X is A or B) pays W if X is adopted, and 0 otherwise. Therefore, the price of contract X at time t is:

      P_X(t) = E[ W * I_{X adopted} | Information at time t ]

   But note: the adoption decision depends on the VWAP of the contracts in the final week. Therefore, the event {X adopted} is endogenous to the market. This creates a circularity.

   Specifically, the market price is trying to predict W conditional on the policy being adopted, but the policy adoption depends on the market price.

   **Problem 2: The adoption rule and what the price should estimate**

   The adoption rule is: choose the policy with the higher VWAP in the final week. The intention of futarchy is that the market should estimate the expected welfare under each policy, and then we choose the policy with the higher expected welfare.

   However, in this setup, the price of contract A is:

      P_A = E[ W | A is adopted ] * P(A is adopted) + 0 * P(B is adopted)

   But note: if the market believes that A will be adopted, then the price of A becomes E[W | A is adopted] (because then P(A is adopted)=1 and P(B adopted)=0). Similarly, if the market believes B will be adopted, then the price of A becomes 0 (because then contract A pays nothing). However, the market price is set by traders who have information about both W and the likelihood of adoption.

   Actually, the price of contract A is:

      P_A = E[ W * I_{A adopted} | F_t ]

   which can be written as:

      P_A = E[ W | A adopted, F_t ] * P(A adopted | F_t)

   Similarly:

      P_B = E[ W | B adopted, F_t ] * P(B adopted | F_t)

   The adoption rule is: adopt A if VWAP_A > VWAP_B, else B.

   Therefore, in the final week, the market prices are influenced by the probability of adoption. This creates a feedback loop.

   **Problem 3: Manipulation**

   Consider an actor who wants policy A to be adopted. They can buy contract A in the final week. This increases the VWAP of A and may cause A to be adopted. But note: if A is adopted, then contract A pays W and contract B expires worthless. Therefore, if the actor buys contract A and then A is adopted, they get W per contract. The cost of buying the contract is the price they pay. However, if they are able to push the VWAP of A above B and cause A to be adopted, then they get a payoff of W. But note that the price they pay for contract A is at least E[W | A adopted] if the market is efficient, so they would not make a profit. However, the market is not necessarily efficient because of the circularity.

   But wait: the actor might be able to manipulate the adoption without having to pay the true expected value? Also, note that if the actor buys contract A and then A is adopted, they get W. But if they fail and B is adopted, they lose their entire investment because contract A expires worthless.

   The cost of manipulation: Suppose the actor wants to ensure that A is adopted. They must push the VWAP of A above that of B. The cost to the actor is the amount they spend buying contract A. However, if they succeed, they get W per contract. So their net profit per contract is W - (price paid for contract A). But note that the price of contract A during the manipulation may be driven up by their own buying. Also, the expected value of W conditional on A being adopted might be less than the price they pay? 

   However, there's a catch: the actor might not care about the financial outcome but only about the policy being adopted. In that case, they are willing to lose money to get the policy they want. They can buy enough of contract A to push the VWAP above that of B. The cost is the amount they spend, which is the price per contract times the quantity. But note that the market-maker is standing by to sell at a fixed spread. The market-maker will sell contract A at the ask price (which is the mid price plus half the spread). The actor can buy a large quantity from the market-maker until the VWAP (which is averaged over the week) is above the VWAP of B.

   The cost to the actor is the amount they pay for the contracts. However, if the market-maker is forced to fill orders at a fixed spread, then the actor can buy an arbitrarily large quantity at a fixed price (until the stated size limit per order? but note the market-maker must fill "any order up to a stated size", meaning each order is limited, but the actor can place many orders). The market-maker, being prohibited from trading on information about which policy will be adopted, will quote a price that is based on the current information (but note the circularity: the market-maker must form an estimate of E[W * I_{A adopted}] without knowing the adoption outcome?).

   **Problem 4: The market-maker's challenge**

   The market-maker is supposed to quote both sides without using information about which policy will be adopted. However, the value of the contract depends on the adoption outcome. The market-maker must set a price that reflects the expected value of the contract given the information available, but without using information that would help predict the adoption? That seems impossible because the adoption outcome is the key driver.

   The market-maker is prohibited from trading on any information bearing on which policy will be adopted. But the market-maker must set a price that depends on the adoption outcome. How can they avoid using information about adoption? They are forced to use some model. This prohibition might be unimplementable.

   **Problem 5: The circularity and the price being an estimate of what?**

   The question requires students to see that the CWL price is an estimate of:

      E[ W * I_{X adopted} ]

   but the adoption rule requires it to be an estimate of:

      E[ W | X adopted ]

   because if we are to choose the policy that maximizes welfare, we want the one with the highest E[W | X adopted]. However, the price of contract X is:

      P_X = E[ W * I_{X adopted} ] = E[W | X adopted] * P(X adopted)

   Therefore, the price is the product of the conditional expectation and the probability of adoption. This product might be high either because the conditional expectation is high or because the probability of adoption is high. This creates a distortion.

   For example, a policy that has a high probability of being adopted (for whatever reason, even if its expected welfare is low) will have a high price. This might lead to that policy being chosen even if its expected welfare is lower than the alternative.

   Therefore, the two come apart because the price confounds the expected welfare under the policy with the probability that the policy is adopted.

   **Problem 6: The market-maker and thin liquidity**

   The market-maker is intended to address thin liquidity. However, the market-maker is forced to trade at a fixed spread without using information about which policy will be adopted. This might make the market-maker vulnerable to exploitation by informed traders who do have information about W. But that is not the main issue for the exam question.

   The question asks: does the market-maker patch address the two problems (the price not being the right estimate and manipulation)? 

   For the first problem (the price being a product of two terms), the market-maker does not change the fundamental structure of the contract. The price still reflects the product. So it doesn't fix that.

   For manipulation: the market-maker provides liquidity at a fixed spread. This actually makes manipulation cheaper because the manipulator can buy large quantities from the market-maker without moving the price beyond the fixed spread (until the market-maker's size limit per order is reached). However, note that the VWAP is calculated over the entire week. The manipulator would have to trade enough to move the volume-weighted average. But because the market-maker is providing liquidity at a fixed spread, the manipulator can buy a large amount at a known price. The cost is then the total amount spent, but note that the market-maker is selling at a price that is based on the current market information (which might be distorted by the manipulation itself). This is complex, but the key point is that the market-maker does not prevent manipulation; it might even facilitate it by providing a deep pocket to trade against.

   **Proposed Exam Question**

   We are now ready to design the exam question. The question should force the students to:

   a) Work out what the CWL price is estimating (E[W * I_{X adopted}]).
   b) Work out what the adoption rule requires the price to be (E[W | X adopted]).
   c) Explain why these are different (because of the multiplication by P(X adopted)).
   d) Identify an actor for whom moving the adoption decision is cheap (a manipulator who doesn't care about the financial loss) and express the cost of manipulation (the amount they must spend to buy enough contracts to shift the VWAP, which can be calculated given the market-maker's fixed spread and the current prices).
   e) Judge whether the market-maker patch addresses these two problems (no for the first, and no for the second because it makes manipulation cheaper by providing liquidity at a fixed price).
   f) Propose a change to the payoff structure (for example, instead of having the contracts expire worthless in the non-adopted branch, we could have a contract that pays W regardless of which policy is adopted, but then we need a different mechanism to choose the policy? Or use a different setup for the contracts that separates the probability of adoption from the conditional expectation? One classic solution is to have two contracts: one that pays 1 if A is adopted and 0 otherwise, and another that pays W regardless of adoption, and then use the ratio of the price of the W-paying contract for A to the price of the adoption contract for A to get E[W|A]. But that is beyond the scope of the spec. Alternatively, we might have contracts that pay W in both branches, but then how do we choose? The problem is that we need the market to reveal E[W|A] and E[W|B] without the adoption probability.)

   Let's design the question:

  ---
  Question (100 marks, 48-hour take-home, expected effort 2 hours):

  You are given the specification for the Conditional Welfare Ledger (CWL) as follows:

  [Insert the CWL spec exactly as provided]

  Answer the following:

  1. (20 marks) The price of a CWL contract for a policy (say, policy A) at a given time during trading is an estimate of what specific quantity? What quantity would the adoption rule (choosing the policy with the higher volume-weighted average price) ideally require the price to estimate? Explain precisely why these two quantities are not the same.

  2. (30 marks) Consider an actor who has a strong preference for policy A being adopted. They are considering trading in the CWL market to influence the adoption decision. 

     a) Explain why, under the given expiry convention (positions in the contract for the branch not adopted expire worthless), the actor might be able to move the adoption decision by trading. 

     b) Calculate the cost to the actor of ensuring that policy A is adopted. Express this cost in the same units as the treasury's exposure (i.e., in terms of the welfare index W). Assume that the market-maker is active and provides a fixed spread. Your calculation should take into account the actions the actor must take and the resulting financial outcome for the actor.

  3. (30 marks) Does the inclusion of the standing market-maker (with the stated features) address either of the two problems identified in part 1 (the price estimating the wrong quantity) or part 2 (the possibility of manipulation at a cost)? Explain why or why not.

  4. (20 marks) Propose a change to the payoff structure of the contracts (i.e., what the contracts pay and under what conditions) that would directly address the problem identified in part 1. Your change should not rely on additional transparency, auditability, or disclosure requirements. Explain how your change resolves the issue.
  ---

   **Model Answer (approx 900 words):**

  1. The price of a CWL contract for policy A at a given time is an estimate of the expected value of the welfare index W multiplied by an indicator that policy A is adopted. Specifically, it is:

          Price_A = E[ W * I_{A adopted} ]

     This is because the contract pays W if A is adopted and 0 otherwise. The price reflects the expected payment.

     The adoption rule requires comparing the volume-weighted average prices (VWAP) of contracts A and B and choosing the policy with the higher VWAP. For this rule to select the policy that maximizes expected welfare, we would want the price of contract A to estimate:

          E[ W | A adopted ]

     which is the expected welfare conditional on policy A being adopted.

     These two quantities are not the same because:

          E[ W * I_{A adopted} ] = E[ W | A adopted ] * P(A adopted)

     The price of contract A is the product of the conditional expectation of W given A is adopted and the probability that A is adopted. This differs from the conditional expectation by the factor P(A adopted). Therefore, even if policy A has a low expected welfare (E[W|A adopted]), if the market believes it is very likely to be adopted (high P(A adopted)), then the price of contract A could be high. Similarly, a policy with high expected welfare might have a low price if the market believes it is unlikely to be adopted.

     This discrepancy could lead to the adoption of a policy that does not maximize expected welfare.

  2. a) The actor can buy contract A during the final trading week. By buying contract A, the actor increases the demand for contract A, which pushes up its price (and specifically the volume-weighted average price over the week). If the actor buys enough to make the VWAP of A exceed that of B, then the adoption rule will choose policy A. 

     The expiry convention is critical: if policy A is adopted, then the actor's contracts pay W per contract. If policy B is adopted, the contracts expire worthless. Therefore, the actor's trades have a binary outcome: either they get W per contract (if they succeed in getting A adopted) or they lose their entire investment (if B is adopted). However, note that the actor is trying to ensure A is adopted, so they are counting on success.

     b) To ensure policy A is adopted, the actor must trade enough to push the VWAP of A above that of B. We assume the market-maker is providing liquidity at a fixed spread. Let the current mid price for contract A be p (which is the average of the bid and ask). The market-maker is quoting an ask price of p_ask = p + s/2, where s is the fixed spread. The actor can buy any quantity up to the stated size per order at p_ask.

     However, the VWAP is calculated over the entire week. The actor must trade enough so that the volume-weighted average of the prices at which contract A trades during the week is above the VWAP of contract B. We can consider a scenario where without the actor's intervention, the VWAP of A would be below that of B. The actor must not only cover the gap but also overcome the natural trading that might be occurring.

     For simplicity, suppose the actor trades at the very beginning of the final week and in large quantity, so that the VWAP for the week is dominated by their trade. Let the VWAP of contract B be v_B (which we assume remains constant, as the actor is only trading A). The actor must make the VWAP of A, call it v_A, satisfy v_A > v_B.

     Suppose the actor buys a quantity Q of contract A at price p_ask. Then, if there is no other trading in contract A during the week, the VWAP for A would be p_ask. So the actor must ensure p_ask > v_B. If the natural VWAP of A without the actor is below v_B, then the actor must push it above v_B. But note: the actor can only buy at p_ask, so they must hope that p_ask is already above v_B? Or they might try to buy so much that even if there are other trades at lower prices, the average is pulled up. However, to be safe, we assume the actor wants to set the VWAP to at least v_B + epsilon.

     Alternatively, we can assume that the market-maker is continuously quoting, and the actor can break up the trade. But the worst-case cost is that the actor pays p_ask per contract. The total cost is Q * p_ask.

     If the actor succeeds and A is adopted, they receive Q * W. Their net profit is Q*(W - p_ask). But note: the actor may not care about profit; they only care about getting A adopted. They are willing to accept a financial loss. The cost to them is the expenditure Q * p_ask, which they lose if they fail, but if they succeed, they get Q*W and so their net financial outcome is Q*(W - p_ask). However, the cost to achieve the adoption is the amount they spend: Q * p_ask, which is at risk (they lose it if they fail). But if they are certain they can push the VWAP above B, then they will spend Q * p_ask and then receive Q*W if they succeed. The net cost (if they succeed) is Q*(p_ask - W) but note that this could be negative (a profit) if W > p_ask. However, we are asked for the cost of ensuring adoption, not the net cost.

     Actually, the cost to the treasury (which is the exposure) is the payment of W per contract to the actor. But the cost to the actor is the money they put up: Q * p_ask. However, they get back Q*W if they succeed. So the net cost to the actor (if they succeed) is Q*(p_ask - W). But note that p_ask is the price they paid per unit of W conditional on A being adopted? Actually, p_ask is the price per contract, and each contract pays W (so the price per unit of W would be p_ask per contract divided by the units of W? But the contract pays one unit of currency per point of W. So if W is measured in dollars, then the contract pays W dollars. So the actor is paying p_ask dollars for a contract that will pay W dollars if A is adopted.

     The treasury's exposure is the payment of W per contract. The actor's expenditure is p_ask per contract. Therefore, the cost to the actor per contract is p_ask (dollars) and the treasury pays W (dollars) per contract. They are in the same units.

     However, note that the cost to the actor to ensure adoption is the total amount they spend: Q * p_ask. This cost is incurred regardless of whether they succeed? Actually, they spend it at the time of trade. If they fail, they lose it. If they succeed, they get it back as part of the payment (but then they have an asset worth W per contract). But the initial outlay is Q * p_ask.

     The question asks for the cost of ensuring adoption. We can interpret this as the amount of money the actor must be willing to put at risk. It is Q * p_ask. The actor must choose Q large enough to move the VWAP. How large? That depends on the existing trading volume. In the worst case, if there is no other trading, then even a small Q would set the VWAP to p_ask. So the cost could be as low as one contract at p_ask. But if there is already a high volume of trading at a low price, then the actor would have to trade a lot to move the average. Therefore, the cost is variable. However, the market-maker provides a fixed price at which the actor can buy any amount (up to the stated size per order). So if the stated size per order is large enough to dominate the week's volume, then the actor can move the VWAP by trading just one large order. The cost would be (order size) * p_ask.

     But note: the market-maker might adjust the mid price p over time? The spec says the market-maker quotes at a fixed spread, but doesn't say the mid price is fixed. However, the market-maker is prohibited from trading on information about which policy will be adopted. So they might base their mid price on the current market price or some external information about W. But they are not allowed to adjust for the probability of adoption? This is unclear. We assume that the market-maker does not change the mid price in response to the actor's trades (because that would be using information about the adoption, which is prohibited). Therefore, the market-maker keeps the mid price fixed. Then the actor can buy a large quantity at a fixed p_ask.

     The minimal cost to ensure adoption is the cost of buying a quantity Q that is sufficient to make the VWAP of A exceed the VWAP of B. In the absence of any other trading, Q=1 would suffice. Therefore, the cost can be as low as p_ask.

     However, if there is other trading, the actor might need to buy more. The worst-case cost is unbounded if the market-maker is continuously replenishing the stated size (so the actor can keep buying). But the VWAP is an average over the entire week. The actor must buy enough so that the total dollar volume of their trades (at p_ask) pulls the average above the VWAP of B. Let V be the total volume of contract A in the week without the actor, and let the average price of that volume be p_old. Then the VWAP without the actor would be p_old. With the actor's trade of Q at p_ask, the new VWAP is:

          (V * p_old + Q * p_ask) / (V + Q)

     The actor wants:

          (V * p_old + Q * p_ask) / (V + Q) > v_B

     Solving for Q:

          V * p_old + Q * p_ask > v_B * (V + Q)
          V * p_old + Q * p_ask > v_B * V + v_B * Q
          V * (p_old - v_B) > Q * (v_B - p_ask)

     If p_ask > v_B, then the right-hand side is negative (if v_B - p_ask is negative) and the inequality is automatically satisfied because the left-hand side might be positive or negative. But if p_old < v_B and p_ask < v_B, then the actor cannot achieve the goal because they would be pulling the average down? Actually, if p_ask < v_B, then the actor would be lowering the VWAP. So they must wait until the market-maker's ask price is above v_B? Or they must trade so much that they pull up the average even if p_ask is below v_B? That is not possible because every trade they do at p_ask < v_B would lower the average. Therefore, the actor must trade only when the market-maker's ask price is above v_B.

     This is getting complex. In the model answer, we can simplify by assuming that the actor can trade when the market-maker's ask price is above v_B and that one trade at that price will set the VWAP to p_ask (if there is no other volume). Therefore, the minimal cost is the cost of one contract at an ask price above v_B. Since the market-maker's ask price is fixed (until they update their mid price, which they don't do based on adoption probability), then if the current ask is above v_B, the actor can buy one contract at p_ask (cost = p_ask). If the current ask is below v_B, then the actor must wait until the market-maker raises the mid price (which might happen if there is news about W) or they might not be able to do it.

     Alternatively, the actor might trade multiple times to push the mid price up? But the market-maker sets the mid price independently? The spec doesn't say. We assume the market-maker's mid price is fixed unless they get new information about W (not about adoption). Therefore, the actor's trades do not influence the market-maker's quote. So the actor can only trade at the current ask.

     Given the complexity, the model answer should focus on the case where the actor trades when the market-maker's ask is above v_B and in sufficient quantity to dominate the week's volume. The cost is then the amount spent: Q * p_ask. The minimal Q is 1, so the minimal cost is p_ask. But to be safe, the actor might want to trade a large Q to ensure they dominate. Therefore, the cost is at least p_ask and can be arbitrarily large (if the market-maker allows large orders).

     However, the question asks to express the cost in the same units as the treasury's exposure. The treasury's exposure is the payment of W per contract. The cost to the actor is in dollars, and so is W. Therefore, the cost is p_ask per contract that the actor buys (and they must buy at least one). But note: if the actor buys multiple contracts, they get paid for each. However, the cost to ensure adoption might be just one contract? Not necessarily: if there is a lot of volume, they might need to buy many. We leave it as: the cost is the amount spent, which is at least the market-maker's ask price for one contract, and possibly more.

     However, a candidate can argue that the cost is the total expenditure, and that expenditure can be as low as the ask price for one contract.

  3. The market-maker does not address the problem identified in part 1. The market-maker provides liquidity but does not change the fundamental payoff structure. The price of the contract still reflects E[W * I_{X adopted}], not E[W | X adopted]. Therefore, the discrepancy remains.

     The market-maker also does not address the manipulation problem. In fact, it makes manipulation cheaper because the market-maker stands ready to sell any amount (up to the stated size per order) at a fixed price. This means the actor can purchase a large quantity of contracts without immediately driving up the price (beyond the fixed spread). Without the market-maker, the manipulator would have to buy from other traders, which might require offering higher and higher prices, increasing the cost. The market-maker, by providing a fixed ask price, caps the cost per contract and makes it predictable. Moreover, the market-maker does not adjust the price based on the manipulator's trades (because they are prohibited from using information about adoption), so the manipulator can buy repeatedly at the same price. Therefore, the market-maker facilitates manipulation.

  4. To resolve the issue in part 1, we need the price to reflect E[W | X adopted] rather than E[W * I_{X adopted}]. One way to achieve this is to separate the event of adoption from the payment of W. We can introduce two types of contracts for each policy:

     - An "adoption contract" for policy A: pays 1 unit of currency if policy A is adopted, 0 otherwise.
     - A "welfare contract" for policy A: pays W units of currency regardless of which policy is adopted.

     Then, the price of the welfare contract for A is:

          Price_{welfare,A} = E[ W ]

     and the price of the adoption contract for A is:

          Price_{adopt,A} = P(A adopted)

     But we want E[W | A adopted]. Note that:

          E[ W * I_{A adopted} ] = E[W | A adopted] * P(A adopted)

     We can also write:

          E[W | A adopted] = E[ W * I_{A adopted} ] / P(A adopted)

     However, we don't have a contract that pays W * I_{A adopted}. But if we had a contract that pays W only if A is adopted, that is exactly the contract we had in the original CWL. Alternatively, we can use the ratio of two contracts:

          E[W | A adopted] = Price_{welfare,A} / Price_{adopt,A}   ??? 

     But note: the welfare contract pays W regardless of adoption. So:

          Price_{welfare,A} = E[W] = E[W | A adopted] * P(A adopted) + E[W | B adopted] * P(B adopted)

     which is not directly helpful.

     Alternatively, we can have:

     - A contract that pays W if A is adopted, and 0 if B is adopted.
     - A contract that pays 1 if A is adopted, and 0 if B is adopted.

     Then the ratio of the first contract's price to the second contract's price is:

          [ E[W * I_{A adopted}] ] / [ P(A adopted) ] = E[W | A adopted]

     So if we have these two contracts, we can compute the conditional expectation.

     Therefore, a change to the payoff structure is:

     Issue two contracts per policy:

          Contract A1: pays 1 if policy A is adopted, 0 if policy B is adopted.
          Contract A2: pays W if policy A is adopted, 0 if policy B is adopted.

     Similarly for B:

          Contract B1: pays 1 if policy B is adopted, 0 if policy A is adopted.
          Contract B2: pays W if policy B is adopted, 0 if policy A is adopted.

     Then, the quantity we want for policy A is:

          E[W | A adopted] = Price_{A2} / Price_{A1}

     provided that Price_{A1} > 0.

     We can then have the adoption rule be: adopt the policy with the higher value of (Price_{X2} / Price_{X1}).

     However, note: the expiry convention is no longer needed in the same way. The contracts are tied to the adoption event. But we now have four contracts. The adoption rule can be based on the ratio.

     This change resolves the issue because the ratio directly estimates E[W | X adopted].

     But note: this requires two markets per policy. It is more complex, but it addresses the core problem.

     In the exam, the candidate might propose a simpler idea. Another possibility is to have the contract pay W no matter which policy is adopted, but then we cannot tell which policy is better. So that doesn't work.

     Therefore, we propose the two-contract-per-policy solution.

   **Marking Scheme (out of 25):**

   We have to convert the 100-mark question to a 25-mark marking scheme. We'll divide the marks by 4 (but 100/4=25, so it works).

   Part 1 (5 marks):
     - 1 mark for correctly stating the estimated quantity as E[W * I_{A adopted}] or equivalent.
