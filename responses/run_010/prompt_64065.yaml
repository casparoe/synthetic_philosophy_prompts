     - 3 marks for stating that the market-maker does not address the manipulation problem and may make it cheaper (by providing liquidity at a fixed price).

   Part 4 (5 marks):
     - 3 marks for proposing a change that separates the estimation of the adoption probability from the conditional welfare (e.g., two contracts per policy: one for adoption and one for welfare conditional on adoption).
     - 2 marks for explaining how the change resolves the issue (by allowing the computation of the conditional expectation as a ratio).

   **Closing Paragraph:**

   A first-class answer not only correctly identifies the quantities and the possibility of manipulation but also provides a precise and insightful analysis of the cost of manipulation, taking into account the role of the market-maker and the VWAP calculation. It would recognize that the minimal cost might be low (one contract at the ask price) but also note the dependency on existing volume. In part 4, a first-class answer would propose a change that directly decouples the conditional welfare expectation from the adoption probability and clearly articulate why the change works. It would also anticipate potential issues in the proposed change (like the need for two markets per policy) but focus on the core improvement.

