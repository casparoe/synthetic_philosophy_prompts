answer: |-
  ## The Case for Group-Level Selection in Transient Patches

  The standard verdict that this case involves no genuine group-level selection rests on a conflation of selection with its consequences. To see why, we must start with a principled account of what selection *is* at any level, independent of heritability. **Selection occurs at a level X when (1) entities exist at level X, (2) these entities exhibit variation in a character, and (3) this variation causes differences in the fitness (persistence/reproduction) of the X-entities themselves.** This definition captures the core causal structure of selection: variation *at the focal level* directly impacts the differential survival or reproduction *of entities at that level*.

  In this beetle system, patches are genuine biological entities: they are spatially bounded, functionally integrated units where interactions determine collective outcomes (patch persistence/collapse). Crucially, patches vary in a character – their founding composition (fast/slow ratio). This variation *directly causes* differential patch fitness: fast-dominated patches collapse (fitness = 0), while slow-dominated/mixed patches persist and contribute offspring (fitness > 0). This causal link – composition → patch extinction/survival – satisfies the definition of selection *at the patch level*. The effect is not merely bookkeeping for individual fitness differences because individual fitness *within* a patch (fast > slow) actually opposes the patch-level outcome (slow-dominated survive, fast-dominated perish). The patch-level selection event (collapse of fast patches) overrides the within-patch individual advantage of fast types in those very patches, demonstrating its causal autonomy.

  **Confronting the Sorting Objection:** It might be argued this is mere "sorting" or an ecological backdrop for individual selection. Sorting implies passive differential elimination, but here patch collapse is an active, frequency-dependent consequence of the *collective action* of the constituent beetles – specifically, the resource depletion driven by high densities of fast types. Calling it merely an "ecological condition" obscures the causal chain: it is the *group character* (composition) that triggers the collapse condition. What is lost by this redescription is the recognition of a distinct causal mechanism operating at the group level. Ignoring this masks how the group context creates a selective pressure that reverses the apparent individual-level advantage within fast-dominated groups. The group-level event (collapse) is the primary driver excluding the offspring of entire fast-dominated patches from the global pool, a consequence not reducible to summing within-patch individual deaths.

  **Addressing Cheapness and Persistence:** Does this make group selection implausibly cheap? Consider a variant where patches persist across generations with heritable composition. In this case, group-level selection *would* be cumulative, leading to group-level adaptation (e.g., evolution towards more sustainable group compositions). Conceding this difference in consequences is essential – but it does not oblige conceding a difference in whether group-level selection *occurs* in the original case. The core process – variation in group character causing differential group survival – is identical in both cases. Heritability determines whether this process *builds adaptations* over time (i.e., whether it is evolutionarily *effective*), not whether the selective process itself exists. Just as strong individual selection acting on a trait with zero heritability is still selection (even if it produces no evolutionary change), so too is group selection acting on non-heritable group variation. The difference lies in the *response*, not the *presence* of selection.

  **The Partitioning Question:** This argument does rely on a specific partitioning of evolutionary change, best captured by the Price equation. The total change in a trait (e.g., frequency of "slow" allele) can be decomposed as:
  `Δz = Cov(ω_i, z_i) + E[ω_j Δz_j]`
  where `ω_i` is individual fitness, `z_i` is individual trait value, `ω_j` is group fitness, and `Δz_j` is the change in group mean trait value within the group. The key term for group selection is the *between-group covariance*: `Cov(ω_j, Z_j)`, where `Z_j` is the group mean trait value. In our case, this covariance is significantly negative: groups with high `Z_j` (fast mean) have low `ω_j` (collapse). This term is non-zero because group fitness (survival) covaries with group composition. Crucially, the *response* term `E[ω_j Δz_j]` (the expected within-group change) is zero in the long run precisely *because* group composition is not heritable – within groups, the fast type always increases. The non-zero between-group covariance term directly quantifies the *group-level selection* acting *against* the fast type due to patch extinction, even though the lack of heritability means this selection produces no net group-level adaptation across generations. This partition isn't question-begging because it doesn't presuppose group selection; it mathematically isolates the component of evolutionary change attributable to differential group survival based on group character.

  **The Strongest Objection and Reply:**

  **Objection:** If groups lack heritability and persistence, they aren't genuine "units of selection." They are merely transient environmental contexts where individual selection plays out. The differential extinction of patches is just a consequence of the *individual traits* within them (many fast individuals deplete resources). Selection acts *only* on individuals – their traits determine both their within-patch success and, aggregatively, the patch's fate. Calling it "group selection" adds nothing causal; it's epiphenomenal.

  **Reply:** This objection mistakes causal reducibility for causal exclusivity. While the patch fate *is* caused by the traits of its constituent individuals, the *selective consequence* operates at the patch level. The death of *every individual* in a collapsing patch is caused *en masse* by the *collective property* (high frequency of fast types), not by the individual fitness differences operating within the patch at that moment. This is a distinct causal pathway: the group character triggers a group-level event (collapse) that eliminates all individuals regardless of their individual fitness or type. This group-level event exerts a selective force *counter* to the within-group individual selection. Calling it *only* individual selection ignores this emergent causal structure: the fitness of an individual in a fast-dominated patch is not simply a function of its *own* trait, but catastrophically depends on the *group's* trait in a way that cannot be predicted from individual traits alone (a fast individual in a slow group survives and reproduces; the same individual in a fast group dies without reproducing). The Price decomposition formally captures this distinct between-group component precisely because group fitness (`ω_j`) is not derivable solely from individual fitnesses (`ω_i`) within the group – it depends on the group context itself. Therefore, recognizing group-level selection is necessary to fully account for the causal forces shaping evolution in this system. What is lost by ignoring it is the understanding of how a higher-level interaction (frequency-dependent resource depletion) creates a selective filter acting on entire groups.
