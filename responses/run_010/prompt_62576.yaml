answer: |-
  The case that comes immediately to mind, documented with excruciating detail in correspondence and publications, is the near-simultaneous conception of the theory of evolution by natural selection by Charles Darwin and Alfred Russel Wallace in 1858. The concrete sequence is crucial:

  1.  **Darwin's Long Gestation:** After returning from the Beagle voyage (1836), Darwin began developing his theory. By **1842**, he wrote a 35-page sketch. By **1844**, he expanded this into a 230-page essay. He instructed his wife to publish it if he died. Crucially, he shared his ideas *selectively* – with geologist Charles Lyell, botanist Joseph Hooker, and a few others, confiding his fear of priority loss but feeling compelled to amass overwhelming evidence. He did *not* publish.
  2.  **Wallace's Independent Journey:** Working as a specimen collector in the Malay Archipelago, Wallace, influenced by similar readings (Malthus on population) and his own extensive field observations, independently hit upon the mechanism of natural selection. In **February 1858**, during a malarial fever, the idea crystallized. He wrote a concise essay outlining the theory.
  3.  **The Fateful Packet:** Wallace sent his essay from Ternate in March 1858, addressed to **Darwin** himself (whom he admired), asking him to forward it to Lyell if he thought it worthwhile. The letter arrived at Darwin's home, Down House, on **June 18, 1858**. Darwin opened it, expecting perhaps notes on species distribution, and was stunned to find his own cherished, unpublished theory laid out clearly.
  4.  **Darwin's Anguish and Action:** Darwin was devastated, writing to Lyell: "I never saw a more striking coincidence... so all my originality, whatever it may amount to, will be smashed." He felt honor-bound to help Wallace publish but agonized over his own decades of work being eclipsed. Lyell and Hooker, aware of Darwin's long-standing work (Hooker had read the 1844 essay), proposed a solution: present *both* men's work jointly to the Linnean Society. They gathered Darwin's 1844 essay, a letter he’d written to American botanist Asa Gray in 1857 (outlining the theory), and Wallace’s essay.
  5.  **The Linnean Society Presentation:** On **July 1, 1858**, papers by both Darwin and Wallace were read aloud at the Linnean Society of London. Darwin was absent (his infant son had died of scarlet fever days before). Wallace, still in the Malay Archipelago, knew nothing of this until months later. The joint presentation established priority for *both* for the core idea *at that moment*. Darwin then raced to write an "abstract" of his larger work, publishing *On the Origin of Species* in **November 1859**, which elaborated the theory comprehensively, cementing his primary association with it historically.

  **The Conceptual Issue Exposed:**

  This case forces a sharp confrontation with the **relationship between epistemic credit and causal necessity**. The documented history shows:

  *   **Inevitability Looms Large:** Merton's "multiples" theory is embodied here. Two highly capable naturalists, immersed in similar data (global biogeography, fossil records, domestication), influenced by Malthus, arrived independently at the same revolutionary mechanism. The intellectual context was ripe; the discovery *was* "in the air." Had both perished in 1857, someone else (perhaps Huxley, perhaps an unknown) likely *would* have formulated it soon after. The backup assassin (Wallace, or another) was very real.
  *   **The Actual Difference-Maker:** Darwin's actions *did* make a specific, crucial difference to the *actual historical sequence as it unfolded*: Upon receiving Wallace's essay, he acted (with Lyell and Hooker) to secure *joint* recognition *at that specific time* (July 1858). Had Darwin suppressed Wallace's essay, his own eventual publication (whenever it came) would have appeared as the sole origin point. Had Wallace sent his essay directly to a journal, it might have been published months earlier, potentially establishing *his* sole priority before Darwin acted. Darwin's decades of work, while not *causally necessary* for the *idea* to exist (Wallace proved that), were *causally necessary* for the *specific form, timing, and initial reception* of the theory's introduction to the scientific world in 1858/59. His network (Lyell, Hooker) was instrumental in the joint presentation solution.
  *   **The Credit Dilemma:** Who "deserves" credit for the discovery of natural selection?
      *   **Desert as Actual Causation (Making it Real):** Darwin deserves primary credit. He *actually* developed the extensive evidence, wrote the foundational book (*Origin*), and orchestrated (through allies) the mechanism for its introduction and defence, making the theory a concrete, influential scientific reality. Wallace's essay was a catalyst, but Darwin built the engine and drove the car. On this view, Wallace's contribution, while genuine, was preempted in its *impact* by Darwin's decisive action and subsequent work.
      *   **Desert as Difference-Making (First to the Post):** Wallace deserves equal credit. He *independently* conceived the core mechanism and was the one whose action (sending the essay) *actually triggered* the public announcement of the theory in 1858. Darwin's prior work, while extensive, remained private and inert until Wallace forced his hand. Wallace made the difference to *that* moment of recognition. Furthermore, he demonstrably *had it in him* to make the discovery, proving the idea was achievable independently.
      *   **The Luck Factor:** The case highlights profound moral/epistemic luck. Darwin was *lucky* Wallace sent the essay *to him* (giving him time to act). Wallace was *unlucky* that Darwin had been working on it for 20 years and had powerful friends. Darwin was *unlucky* to be scooped after such long effort; Wallace was *unlucky* his geographical isolation prevented him from publishing faster or controlling the reception of his essay. Desert seems heavily contingent on circumstance, not just intellectual merit.

  **The Conceptual Issue Sharpened:**

  **Does an individual’s claim to epistemic credit for a discovery survive the demonstration that the discovery was causally inevitable (a "multiple")? More precisely: When a discovery is recognized as inevitable given the intellectual context, is epistemic credit solely a function of who *actually* caused its entry into the public sphere and shaped its development (Actual Causation), or does credit also inherently attach to the independent intellectual achievement itself, irrespective of who first *made it public*, especially when that achievement demonstrably *could have* caused its entry (Difference-Making Potential)? And how does the luck inherent in timing and circumstance affect the assignment of desert?**

  The Darwin-Wallace case shows that credit *can* be meaningfully, albeit messily, shared. The Linnean Society solution was a practical (and ethical) acknowledgment of both the Actual Causation (Darwin's prior work and network enabling the presentation) *and* the Difference-Making Potential/Trigger (Wallace's independent conception and essay). History, however, tends to emphasize Darwin, reflecting the overwhelming impact of his *subsequent* Actual Causation via *Origin of Species*.

  **For Your Novel:**

  Neither picture alone is sufficient. To avoid the sagging middle and capture the genuine philosophical tension and historical reality, your novel should *embrace the conflict between them*. This *is* the engine. The characters *themselves* should embody and wrestle with these competing conceptions of credit.

  *   Let your **Professor** champion **Actual Causation**: He published, he engaged the institutions (patent office, journals, society meetings), he made it real for the world. He believes credit *is* the name on the patent, the recognition by peers, the tangible impact. Without his action, *her* work was nothing but dust. He sees himself as the Darwin who delivered *Origin*, dismissing notebooks as unrealized potential. His potential flaw: downplaying the intellectual achievement itself if unpublished, perhaps tinged with guilt that his connections gave him an advantage.
  *   Let your **Heroine** embody **Difference-Making Potential/Intrinsic Achievement**: She solved it first, alone, against greater odds. Her notebooks *are* the discovery, made real *for her* and demonstrably achievable independently. The patent, the name – these are accidents of bureaucracy and speed, not reflections of true intellectual priority or desert. She sees herself as the Wallace, the independent mind proving the idea's inevitability and her own capability, robbed by circumstance. Her potential flaw: underestimating the necessity of making the idea public and functional within the social system, perhaps leading to isolation or bitterness.

  The reader's sympathy will be shaped by *how* you render their struggles and convictions within this framework. Does the Professor acknowledge, even privately, the injustice? Does the Heroine recognize the necessity of engagement, even as she rails against it? The dramatic tension lies precisely in the collision of these two valid yet incompatible pictures of desert, heightened by the undeniable truth of the backup assassin – the discovery *was* coming regardless. The "winner" gets the name, but both know (and the reader knows) the deeper, more unsettling truth about individual contribution in the face of historical inevitability. The quarrel doesn't collapse; it becomes a profound tragedy about knowledge, recognition, and the fragile nature of merit in systems that cannot fully capture the messy reality of simultaneous discovery. Build the middle by deepening this confrontation, letter by letter, legal maneuver by legal maneuver, showing each character fighting for their vision of what *truly* constitutes deserving the name on the thing. The philosophy *is* the plot.
