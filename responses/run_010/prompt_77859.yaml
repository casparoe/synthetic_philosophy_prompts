prompt: |-
  So my reading group just finished Scheffler's Death and the Afterlife and we split down the middle: half of us think it's the most interesting thing written on death in years, half think it's armchair psychology wearing a lab coat. I'm trying to figure out where I actually stand and I've realised I can't, because I don't have a number, just a mood. So give me one.

  Here's the proposition I want a credence on. I've tried to make it operational enough to be true or false rather than vibe-y: **P**: if an ordinary, non-nihilistic, reasonably reflective adult became firmly convinced — not vaguely worried, actually convinced past serious doubt — that all of humanity will be wiped out about twenty-five years after their own death, in a way that is instant and painless for everyone involved and kills nobody they will ever have met, then one year later that person would report, sincerely and on reflection, that at least three of their five most important ongoing projects now seem substantially less worth carrying on with than they did before. I want your number, but mostly I want it taken apart: a rough probability for each piece P depends on, one line of justification each, and then how they combine. Pieces I suspect belong in there (add or cut as you like):

  - whether P is even the right way to read the conjecture — I've forced the descriptive reading on purpose, but tell me how much of the uncertainty is really about that fork and what the normative version's number would be.
  - how afterlife-dependent different projects actually are. Give me a rough ordering and a spread for: raising kids, writing a novel, planting an orchard, working on a proof, running a small shop, tending a garden, looking after a spouse, local activism, playing music with friends. I suspect P lives or dies on whether real people's top-five projects are usually drawn from the long-horizon pile or the short one.
  - whether the predicted effect is about meaning or just about hope and expectation, and whether it survives once you strip out the horror. I made the extinction benign and post-mortem deliberately, but I bet a lot of the intuition that the scenario is devastating is revulsion and fear in disguise — probability that a big chunk of the collapse evaporates once it's defused that way?
  - what the real-world analogues suggest: terminal prognoses, groups who genuinely expected an imminent apocalypse and then it didn't come, societies in felt decline. Does that evidence point toward projects loosing their point, or toward people carrying on almost unchanged and building a rationale afterwards?
  - something I'll call conservation of meaning — my term, not his — the idea that investment isn't destroyed, just reallocated to nearer recipients, so P comes out false about the total even though it's true of every long-horizon project separately. Credence for that?
  - how fast people renormalise, i.e. the chance that a year is plenty for the shock to wash out and the reports to snap back.

  Then tell me which single term the bottom line is most sensitive to — the one where a twenty-point shift in it moves the final number most — and what would actually change your mind, an argument or a finding, not a reading list. And do this dose-response thing for me: holding everything else fixed, how does your credence in P move if the gap between my death and the end of everything is five years, twenty-five, one hundred and fifty, and a thousand? I want to know whether you think that curve is flat, cliff-like or gently declining, and why — because if it's gently declining that seems like a problem for the story Scheffler is telling. Last bit: my friend Dana is at 0.85 and I'm around 0.3, and we've both read the thing twice and still can't budge each other, so give me your best guess about which of the terms above the two of us are really disagreeing about, and what we'd have to argue about to find out whether it's a substantive split or just wether we're reading the same sentence as two different claims.
