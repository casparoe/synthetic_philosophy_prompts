  The must-land reply is for the microhistorian's "denominator dehumanises" charge (Objection 6). Surviving means showing this method *enables* richer stories—the colonial staffing example proves it. If this fails, the qual/quant rift widens and the room polarises. 

  The nightmare question (Objection 8) exposes the colonial context's ethical tension. If asked, they must pivot from methodology to responsibility—"counting absences forces accountability." But it's shaky because methodology can't resolve reparative justice. 

  Other objections need tactical finesse: 
