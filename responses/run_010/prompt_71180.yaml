  - Objection 5 (demographer's "noise vs signal"): reframe noise as structured omission 
  - Objection 7 (microhistorian's "obvious" jibe): concede cheerfully—it *should* be obvious, yet isn't standard practice 

  The tone must stay British: "whilst", "amongst", "premised on". No jargon like "residual" without immediate plain English ("expected-but-absent entries"). 

