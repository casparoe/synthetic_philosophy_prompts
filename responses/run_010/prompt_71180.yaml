prompt: |-
  I'm a final-year history PhD student and in about three weeks I'm giving a paper at a historical-data working group — the kind of room that's mostly quantitative social historians and historical demographers (parish registers, census microdata, record linkage, family reconstitution), plus two people who actually work in archives, one of whom does appraisal and digital preservation at a national archive, and one cultural historian who does microhistory and is pretty openly sceptical about counting people at all. No philosophers, no literary theorists, nobody who's read much archival theory — which matters, because my argument leans on some and I can already feel it landing badly. My supervisor thinks I'm walking into a fight and told me to prepare properly rather than wing it, so this is me preparing properly.

  What I'm going to claim: most work on archival silence — the idea that archives systematically fail to record certain lives, and that the gaps are produced by administrative power rather than by accident — treats silence as an interpretive theme, something you notice, name, and then gesture at in the conclusion. I think that's a category mistake, and that silence is better handled as a measurement problem. The concrete proposal: for a given series, reconstruct from the administrative rules governing it what entries the bureaucracy was *required* to generate (a fee schedule that implies a transaction, a burial ordinance that implies a register line, a return cycle that implies a household), and then treat the expected-but-absent entries as a residual that has structure — patterned by who was subject to which rule, when the rule changed, and which office was enforcing it. I've been calling it docketing the gaps. My pilot is a district-level land and tax registry from a British colonial administration in the 1880s–1900s (I'd rather not get into the specifics here, they're not what I need help with), where I think I can show the gaps aren't random noise: they cluster by tenure type and around the years a particular district office was short-staffed. I want to say out loud that historians who treat silence as purely discursive are missing that the same archive supports a denominator.

  So: give me the Q&A prep sheet for that room. I want the eight or so objections I'll actually get from these people, ordered by how much damage each would do if I fumble it, and phrased the way each of them would actually phrase it — the demographer's version, the appraiser's version, the microhistorian's version, in their vocabulary, not mine. For each one, a reply I could deliver in about two minutes standing up, plus an honest note on where that reply is soft. Then tell me what I should concede in the first ten minutes so the harshest version of the objection never gets asked, which single reply has to land for the paper to survive the session at all, and what the question I'm dreading is — the one I'm hoping nobody thinks of, and what I'd say if they do. No reading list, and no lecturing me about the general debate; I want lines I can say out loud.

  Lead with your bottom line in the very first sentence — which objection is the one most likely to sink the talk — and then give the rest of the sheet, with no preamble and no repeating my question back to me. And please write the whole thing in British English, I keep typing Americanisms and it'll annoy me if the prep sheet does too.
