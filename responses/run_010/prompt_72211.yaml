  *Procedure*:
  - Tests:
     - Grid-refinement: as we double the grid, ENB increases without bound (e.g., 40: about sum_{i=1}^{40} 1/i ≈ 4.5, 80: ≈4.9, 160: ≈5.5, 320: ≈6.0 — growing logarithmically).
     - Reordering: if we reorder by descending probability, then the first terms are the highest probability and the payoff is increasing? But the probabilities are assigned by index? We must be consistent: if the scenarios are indexed by increasing severity (so that i increases, p_i decreases and x_i increases) then the natural ordering is by index. If we reorder by descending probability, we get the scenarios with high probability (low i) first, and the payoff is low. So the partial sum will be small and then increase as we add the low-probability, high-payoff scenarios. But the total is still divergent? It will grow without bound as we add more terms. So the reordering doesn't change the divergence, but the rate of growth might differ.

     - Absolute convergence: T = sum p_i |x_i| = sum p_i x_i (since positive) → ∞, so not absolutely convergent? Actually, the series is positive, so absolute convergence is the same as convergence. But it diverges, so T diverges.

     - Truncation curve: grows without bound.

     - Divergence: yes.

  *Classification*: **Divergent (to +∞)**.

  *Alternative reporting*:
  - The committee might want to report +∞. But the ex-post regret objection: if we approve the program and then in the real world the payoff turns out to be very low (because the tail didn't occur) then we might regret having approved it based on an infinite expectation that didn't materialize.

  - The procedure should note that reporting +∞ is not informative and might lead to regret. 

  - Alternatives:
     a. Truncate at a fixed cumulative probability (say 99.9%). Then report the truncated expectation. But the tail (0.1%) is what makes it divergent. So the truncated expectation is finite. However, the choice of truncation is arbitrary and the tail might be important (if the program is designed for the tail events). The analyst must check stability: if truncating at 99% vs 99.9% changes the result by more than 10%, then it's unstable. But in this case, the tail is 0.1% of the probability but has unbounded contribution? Actually, the tail beyond 99.9% might be huge. So the truncated expectation might be very sensitive to the cutoff? Yes.

     b. Use a concave transform to bound the utility. Then the expectation becomes finite. For example, u(x)=x/(1+x). Then u(x_i) ≈ 1 for large x_i. Then the transformed expectation is finite. But again, it's not the net benefit.

  *Escalation*: Since the program has divergent positive expectation, the committee might want to approve it. But the procedure cannot report a single figure of net benefit. The analyst must escalate. The escalation note should highlight the risk of regret and the arbitrariness of truncation or transform.

  *Result*: The procedure flags the program as divergent and escalates. The head of the unit must decide whether to report a truncated figure (with disclosure) or use a bounded utility.

  ---

  ### Marking Judgment Calls and Limitations

  **Judgment Calls**:
  1. Choice of tolerance (10% for stability and reordering) — this is arbitrary and could be set by the unit.
  2. Choice of grid refinement factor (doubling) and maximum grid size (320) — limited by computational feasibility.
  3. Choice of reorderings — the procedure specifies a set, but one might argue for other orderings.
  4. Choice of concave transform — the procedure suggests standard ones, but which one? And the parameters (e.g., risk aversion coefficient) are not specified.
  5. Truncation point for truncated expectation — the cumulative probability (e.g., 99.9%) is arbitrary.
  6. In comparative assessment, the choice of the pair (A vs B) might be arbitrary. The procedure must ensure that the comparison is meaningful (e.g., two variants of the same program).

  **Limitations**:
  - The procedure assumes that the scenario probabilities and payoffs are provided and fixed. If the probabilities are uncertain, it does not handle that.
  - It may not detect conditional convergence if the reorderings chosen do not reveal the sensitivity (e.g., if the series is sensitive to a particular reordering not in the set).
  - The absolute convergence test on a grid up to 320 might not reveal slow divergence (e.g., logarithmic) if the grid is not large enough.
  - The fixes that work for the classic St. Petersburg game (e.g., bounded utility) might not work here because the tail payoffs are not just large but also of both signs and the probabilities decay slower or faster. The procedure's transform check must be run on each program.
  - The procedure does not handle correlations between programs in a portfolio.

  **Why St. Petersburg fixes might not work here**:
  - The St. Petersburg game has positive payoffs and a particular probability structure. The concave transform (bounded utility) works because it tames the large payoffs. But in our cases, we have both positive and negative payoffs. A concave transform might not render the series absolutely convergent if the negative payoffs are large in absolute value and the transform does not bound them sufficiently. Also, the decay rate of probabilities might be different (power law vs geometric in St. Petersburg).

  This procedure provides a practical, albeit not foolproof, method for the analysts.
answer: |-
  Below is a complete, step-by-step procedure for your analysts to determine the admissibility of expected net benefit figures, handle inadmissible cases, and document results. The procedure is designed for analysts with statistics/economics backgrounds, using only spreadsheets or short scripts (e.g., Python/R) within a two-day workflow. It prioritizes diagnostic tests that are computationally feasible and avoids installing new software. 

  ---

  ### **Procedure: Admissibility Assessment for Expected Net Benefit**

  #### **Step 1: Run Diagnostic Tests (Performed on Finest Grid Available, e.g., 320 Scenarios)**
  **Tests to execute (in order):**
  1. **Grid-refinement stability**:  
     - Compute expected net benefit (ENB) for grids of size 40, 80, 160, and 320 scenarios (if computationally feasible; else use 40, 80, 160).  
     - **Tolerance**: If the absolute difference between consecutive ENB values (e.g., |ENB₈₀ - ENB₄₀|) exceeds 10% of |ENB₄₀|, flag as unstable.  
     - *Output*: Stability status (stable/unstable) and maximum % change.

  2. **Reordering sensitivity**:  
     - Reorder scenarios by: (a) descending probability, (b) ascending payoff, (c) descending payoff, (d) random permutation (2x).  
     - Compute ENB for each ordering.  
     - **Tolerance**: If the range (max ENB - min ENB) exceeds 10% of |ENB| from the original ordering, flag as sensitive.  
     - *Output*: Sensitivity status (sensitive/insensitive) and range of ENB values.

  3. **Absolute convergence check**:  
     - Compute the sum of absolute probability-weighted payoffs: \( S_{\text{abs}} = \sum_{i=1}^N p_i |x_i| \) for the finest grid (N=320).  
     - Refine the grid (40 → 80 → 160 → 320) and track \( S_{\text{abs}} \).  
     - **Tolerance**: If \( S_{\text{abs}} \) increases by >10% when doubling the grid size, flag as not absolutely convergent.  
     - *Output*: Absolute convergence status (convergent/divergent).

  4. **Truncation-sensitivity curve**:  
     - For the finest grid, compute partial sums \( S_k = \sum_{i=1}^k p_i x_i \) for \( k = 10, 20, 40, 80, 160, 320 \).  
     - Plot \( S_k \) vs. \( k \).  
     - **Diagnostic**: If \( S_k \) oscillates or trends without bound (e.g., |S₃₂₀ - S₁₆₀| > 50% of |S₃₂₀|), flag as unstable.  
     - *Output*: Truncation plot and stability status.

  5. **Tail decay assessment** (if probabilities/payoffs are user-defined):  
     - Fit a power-law decay to tail probabilities: \( p_i \propto i^{-\alpha} \).  
     - Fit geometric growth to payoffs: \( |x_i| \propto \beta^i \).  
     - *Output*: Estimated \( \alpha \) and \( \beta \).

  ---

  #### **Step 2: Classify Expectation Based on Tests**
  - **Well-defined finite expectation**:  
    - Grid-refinement stable AND reordering insensitive AND \( S_{\text{abs}} \) convergent.  
    - *Action*: Report ENB from finest grid. No further steps.  

  - **Divergent expectation**:  
    - \( S_{\text{abs}} \) divergent AND truncation curve grows without bound.  
    - *Subtypes*:  
      - Divergent to \( +\infty \) (positive tail dominates).  
      - Divergent to \( -\infty \) (negative tail dominates).  
      - Oscillatory divergence (no limit).  

  - **Conditionally convergent**:  
    - Grid-refinement unstable OR reordering sensitive, BUT \( S_{\text{abs}} \) divergent AND truncation curve bounded.  

  - **Poorly estimated (finite but unstable)**:  
    - \( S_{\text{abs}} \) convergent, BUT grid-refinement unstable at working grid (40–80 cells).  

  - **Indeterminacy in probabilities**:  
    - Tail probabilities decay slower than \( i^{-1} \) (\(\alpha \leq 1\)) AND payoffs grow geometrically (\(\beta > 1\)).  

  ---

  #### **Step 3: Reporting Alternatives for Inadmissible Cases**
  - **Conditionally convergent expectation**:  
    - *Alternative*: Report an **interval** [min(ENB), max(ENB)] from reordering test (Step 1.2).  
    - *Legitimacy condition*: Interval width < 200% of |median ENB|. Otherwise, escalate.  
    - *Defect inheritance*: If tail decay indeterminacy exists, interval may still be unreliable.  

  - **Divergent expectation**:  
    - *Alternative 1*: Apply a **concave transform** \( u(x) = \text{sign}(x) \log(1 + |x|) \) (bounded utility).  
      - *Legitimacy*: Only if transformed \( S_{\text{abs}} \) (using \( |u(x)| \)) converges.  
      - *Disclosure*: Must state transform and risk-aversion assumption.  
    - *Alternative 2*: **Truncated expectation** with cutoff at cumulative probability \( \rho = 99.9\% \).  
      - *Legitimacy*: Truncated ENB stable under \(\rho \pm 0.5\%\).  
      - *Disclosure*: State cutoff and discarded tail mass.  
    - *Defect inheritance*: Transform may not resolve divergence if tail payoffs grow too fast.  

  - **Poorly estimated expectation**:  
    - *Alternative*: Report ENB from finest grid (N=320) with uncertainty interval (e.g., ±20%).  
    - *Legitimacy*: Only if \( S_{\text{abs}} \) convergent.  

  - **Comparative assessment (for programs A and B)**:  
    - *Alternative*: Report expected difference \( \mathbb{E}[A - B] \).  
    - *Legitimacy*: If difference series \( (p_i (x_i^A - x_i^B)) \) is absolutely convergent (test via Step 1.3).  
    - *Artefact risk*: If absolute convergence fails for the difference, the comparison is invalid.  

  ---

  #### **Step 4: Escalation to Human Judgment**
  Escalate to the **Unit Risk Officer** (named role) if:  
  - No alternative reporting method meets legitimacy conditions.  
  - Choice of concave transform/truncation cutoff is contentious (e.g., head of analysis disputes).  
  - Interval width > 200% of |median ENB|.  
  - Indeterminacy in probabilities requires institutional risk appetite (e.g., accept power-law tails).  
  - **Procedure stops here**; analyst documents escalation rationale.  

  ---

  #### **Step 5: Documentation for Refusal to Report a Figure**
  **Template for committee report:**  
  > "Program [Name] does not admit a single expected net benefit figure. Diagnostics indicate [divergence/conditional convergence/indeterminacy]. Alternatives considered: [list attempted fixes]. All violate Rule 4 (reproducibility) or fail stability tests. This program cannot be ranked quantitatively without further methodological guidance or risk-appetite directives from the committee."  

  **Analyst response to concave transform objections**:  
  - *Response*: "The transform \( u(x) \) renders the series [absolutely convergent/divergent] (per Step 1.3). However, it reports risk-adjusted utility, not net benefit. Rule 4 requires reproducibility of net benefit; if \( u(x) \) is used, it must be disclosed as a proxy. For Program X, the transform [succeeded/failed] because [reason]."  

  ---

  ### **Worked Examples**

  #### **Case 1: Solar Geoengineering Field Test**  
  - **Model**: Power-law decay (\(\alpha = 1.2\)), payoffs double geometrically (\(\beta = 2\)), both signs.  
  - **Diagnostics**:  
    - Grid-refinement: ENB flips sign (40-cell: +2.1B, 80-cell: -3.4B; change > 100%).  
    - Reordering: ENB ranges from -4.5B to +5.2B (range > 9.7B).  
    - Absolute convergence: \( S_{\text{abs}} \) diverges (40-cell: 15B, 80-cell: 32B, 160-cell: 71B).  
    - Truncation curve: \( S_k \) oscillates wildly (S₃₂₀ = -1.7B, but S₁₆₀ = +4.3B).  
  - **Classification**: Conditionally convergent.  
  - **Reporting**:  
    - Interval: [-4.5B, +5.2B] from reordering test.  
    - Legitimacy: Interval width (9.7B) is 186% of |median ENB| = 5.2B → **escalate**.  
  - **Escalation Outcome**: Risk Officer rejects interval (too wide). Transform \( u(x) = \text{sign}(x)\log(1+|x|) \) tested, but \( S_{\text{abs}} \) still divergent → **refusal to report**.  
  - **Result**: **Blocked**. Report states: "No admissible figure; committee risk appetite needed for interval use."  

  ---

  #### **Case 2: Gene-Drive Program (Self-Limiting vs. Self-Propagating)**  
  - **Model**: Both variants have power-law tails (\(\alpha = 1.3\)), payoffs grow with \(\beta = 1.8\).  
  - **Diagnostics (Individual)**:  
    - Grid-refinement unstable; \( S_{\text{abs}} \) divergent → **divergent expectation for both**.  
  - **Diagnostics (Difference)**:  
    - Let \( d_i = x_i^{\text{self-lim}} - x_i^{\text{self-prop}} \).  
    - \( d_i \) decays as \( i^{-1.5} \) (faster than probability decay).  
    - \( S_{\text{abs}} \) for \( |d_i| \) convergent (40-cell: 0.8B, 80-cell: 0.9B, change < 10%).  
    - Reordering insensitive (range: 0.2B).  
  - **Classification**: Difference series absolutely convergent.  
  - **Reporting**:  
    - Comparative assessment: \( \mathbb{E}[A - B] = +0.75B \) (stable under refinement).  
    - **Not an artefact**: Valid because difference converges absolutely.  
  - **Result**: Report expected difference +0.75B. "Self-limiting variant dominates by +0.75B net benefit."  

  ---

  #### **Case 3: Ocean-Remediation Fleet**  
  - **Model**: Power-law decay (\(\alpha = 0.9\)), payoffs positive and grow with \(\beta = 1.5\).  
  - **Diagnostics**:  
    - Grid-refinement: ENB grows unbounded (40-cell: 12B, 80-cell: 18B, 160-cell: 28B).  
    - \( S_{\text{abs}} \) divergent (40-cell: 12B, 80-cell: 18B, ...).  
    - Truncation curve: \( S_k \to +\infty \).  
  - **Classification**: Divergent to \( +\infty \).  
  - **Reporting Attempts**:  
    - Transform \( u(x) = \frac{x}{1 + x} \): \( S_{\text{abs}} \) converges → E[u(x)] = 0.85.  
    - Truncated expectation (\(\rho = 99.9\%\)): ENB = 15B, but sensitive to \(\rho\) (\(\rho = 99.8\%\) → ENB = 8B).  
  - **Ex-post regret objection**:  
    - *Procedure response*: "Reporting \( +\infty \) ignores regret risk; truncation or transform required. Transform E[u(x)] = 0.85 is robust but not net benefit."  
  - **Escalation**: Risk Officer must choose between transform (risk-averse proxy) or truncation (arbitrary cutoff).  
  - **Result**: Escalated. If Risk Officer insists on net benefit, **refusal to report** (divergent).  

  ---

  ### **Judgment Calls and Limitations**  
  **Judgment calls masked as procedure**:  
  1. **Tolerance thresholds** (10% for stability, 200% for interval width).  
     - *Rationale*: Balances reproducibility (Rule 4) and practicality; adjust via unit consensus.  
  2. **Concave transform choice** (default \( u(x) = \text{sign}(x) \log(1 + |x|) \)).  
     - *Rationale*: Standard in bounded utility literature; alternatives require escalation.  
  3. **Truncation cutoff** (default \(\rho = 99.9\%\)).  
     - *Rationale*: Matches "1-in-1000" tail-risk conventions in policy.  
  4. **"Natural" ordering for intervals** (default: descending probability).  
     - *Rationale*: Prioritizes high-likelihood scenarios; committee may override.  

  **What the procedure cannot do**:  
  - **Handle correlated scenarios**: Assumes independent discretization.  
  - **Resolve slow divergence**: Grid refinement to 320 cells may miss logarithmic divergence.  
  - **Fix probability indeterminacy**: If \(\alpha \leq 1\), expects Risk Officer input.  
  - **Why St. Petersburg fixes fail here**:  
    - St. Petersburg has geometric probability decay, ensuring absolute convergence with moderate transforms.  
    - Here, power-law decay (\(\alpha \leq 2\)) + geometric payoffs breaks absolute convergence, so transforms must be bounded (not just concave).  

  **Failure modes passed as admissible**:  
  - Thin-tailed programs with unstable ENB due to coarse grids (misclassified as "well-defined" if \( S_{\text{abs}} \) convergent).  
  - Intervals for conditionally convergent series may hide order-dependency if reorderings are too similar.  

  --- 

  This procedure delivers unambiguous answers, prioritizes transparency, and enforces Rule 4. It blocks inadmissible figures (as with Case 1) while offering alternatives where defensible (Case 2). For politically charged cases, escalation and documentation protect analysts.
