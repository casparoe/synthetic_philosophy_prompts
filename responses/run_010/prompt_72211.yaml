  Therefore, we have a **divergent expectation**.

  *Procedure*:
  - Grid-refinement: as we increase N, the partial sums will oscillate with increasing amplitude. For example, at N=40, the last term is huge and positive (if N even) or negative (if N odd). So the sign flips when we add one more term? Actually, the last term dominates and the sum will alternate in sign and grow in magnitude as N increases? Not exactly: the last term is huge, but the partial sum is the accumulation of terms that are growing in absolute value. So when we refine the grid (by adding more terms) the sum will jump wildly.

