prompt: |-
  I am a third-year doctoral student in philosophy working on the foundations of decision theory, and for the past year I have been seconded two days a week to the modelling unit of a national research-funding body. The unit produces the ranked shortlist of large-scale intervention programmes that goes to our scientific advisory committee, and its standard template reduces each programme to a single signed figure: probability-weighted net benefit, computed by summing over a discretised scenario grid of forty cells. The programmes in question — stratospheric aerosol field trials, autonomous ocean remediation fleets, gene-drive vector control — all have impact models in which scenario probabilities decay slowly (roughly like a power law) while payoff magnitudes grow geometrically, and in which the payoffs take both signs. For most programmes the template behaves; for a minority it does not. Refining the grid from forty cells to eighty flips the sign of the bottom line, and so does sorting the scenarios by descending probability instead of by index. In other cases the figure simply grows without bound as the grid is refined. I believe I recognise the pathology: the first is the Pasadena-game situation, where the series of probability-weighted payoffs converges only conditionally, so that its sum is hostage to an arbitrary ordering of terms and there is no expectation to report at all; the second is the St. Petersburg or Altadena situation, where the series diverges outright. Our unit has tried applying a concave transform to payoffs, which repaired some programmes and not others, and I suspect the relevant question is whether the transform renders the series absolutely convergent or merely smaller. There is also an internal convention — call it Rule 4 — requiring that any figure quoted to the committee be reproducible to within ten per cent by two analysts working from the same model with different software defaults, a condition an order-dependent sum can never meet.

  What I need is a procedure the unit's analysts can actually run, not an exposition of the literature. They are trained in statistics and economics, not real analysis, they cannot install new software, and each programme assessment gets two working days before it goes into the shortlist paper. The committee's standing instruction is that every programme carries one expected net benefit figure, so the procedure has to tell an analyst, in order: what diagnostic tests to run on a model to establish whether its expectation is admissible (I would want the tests phrased as things one can do to a spreadsheet or a short script — grid-refinement stability, reordering or permutation sensitivity, a check on the sum of the absolute values of the probability-weighted payoffs, truncation-sensitivity curves, and whatever else you think is decisive); what verdict each test outcome licenses, distinguishing sharply between a well-defined finite expectation, a divergent one, a conditionally convergent and hence order-dependent one, an expectation that is finite but so poorly estimated that the point value is meaningless, and cases where the indeterminacy sits in the probabilities rather than in the payoffs; what to publish instead in each inadmissible branch — a bounded-utility figure with the transform disclosed, a truncated expectation with the cutoff stated, an interval spanning the range of permissible orderings, an appeal to stochastic dominance over some class of transforms, an optimism–pessimism weighting, a relative-expected-utility style comparison — together with the conditions under which each substitute is legitimate and the conditions under which it inherits the original defect; and where the procedure stops and hands the case to a named human because the remaining question is one of values or of institutional risk appetite rather than of arithmetic. Please also give the documentation format for a refusal, since telling the committee that a programme has no admissible figure is politically the hardest move the unit makes, and say explicitly how an analyst should respond to the objection that a concave transform makes the problem disappear.

  Then run the procedure on three cases, with the numbers worked through rather than described. First, a solar geoengineering field-test programme whose model pairs modest, near-certain regional cooling benefits against small-probability outcomes of both signs — monsoon failure, terminated-shock warming, avoided heat mortality — with payoff magnitudes doubling across successive scenario bands. I should warn you that this is the head of analysis's own favourite programme and that I expect your procedure to block it; give me that result plainly, because a procedure that cannot deliver an unwelcome answer to a powerful person will not survive its first use. Second, two variants of a gene-drive programme for malaria vectors, one self-limiting and one self-propagating, where I suspect that neither variant has an admissible expectation on its own but that the difference between them is well defined; if that is so, the procedure needs a branch for comparative assessment that does not require absolute admissibility, and it needs to say when the comparison is licensed and when it is an artefact of the pairing chosen. Third, an ocean-remediation fleet whose tail is positive and divergent, so that the temptation will be to report an infinite benefit; explain what the procedure does with the ex-post regret objection, since a rule that approves such a programme can be guaranteed to look foolish in retrospect whatever it decided. Finally, mark every step that is a judgment call dressed up as procedure — the choice of transform, the choice of truncation point, the tolerance in the stability test, the decision about which reordering is "natural" — and state what the procedure cannot do: which questions it does not answer, which failure modes it will pass as admissible, and why the fixes that work for the St. Petersburg game do not automatically work here.
reasoning: |-
  We are facing a problem in decision theory where the standard method of computing expected net benefits via a discretized scenario grid leads to pathological behaviors for certain programs. The pathologies include sign-flips upon grid refinement or reordering, and divergence. The goal is to create a practical procedure that analysts (with stats/economics background) can run in 2 days per program to determine if the expectation is admissible and, if not, what to report instead.

  The procedure must:
  1. Run diagnostic tests to check admissibility of the expectation.
  2. Interpret test outcomes to classify the expectation (well-defined, divergent, conditionally convergent, etc.).
  3. Provide alternative reporting methods when inadmissible, with conditions for legitimacy.
  4. Specify when to escalate to a human for value judgments or risk appetite.
  5. Document a refusal to report a single figure.
  6. Handle objections about concave transforms.

  We will design the procedure step by step, then apply it to three cases.

  ### Diagnostic Tests for Admissibility

  We are concerned with the series S = sum_{i=1}^∞ p_i * x_i, where p_i are probabilities and x_i are payoffs. In practice, we have a finite grid of N scenarios (initially N=40 or 80) but the model implies an infinite series that may converge conditionally or diverge.

  The tests:

  1. **Grid-refinement stability**: 
     - Refine the grid (e.g., from 40 to 80, then 160, ...) and compute the expected value at each level. 
     - If the change in expected value (relative or absolute) exceeds a tolerance (say 10%) when doubling the grid points, flag instability.

  2. **Reordering (permutation) sensitivity**:
     - Reorder the scenarios by descending probability, ascending payoff, descending payoff, and randomly (a few permutations). 
     - Compute the expected value for each ordering. 
     - If the range (max - min) of these values exceeds 10% of the absolute value of the original estimate (or a fixed tolerance if near zero), flag sensitivity.

  3. **Absolute convergence check**:
     - Compute T = sum_{i=1}^N p_i * |x_i| for the same grid. 
     - If T diverges (or increases without bound as the grid is refined), then the original series is not absolutely convergent.

  4. **Truncation-sensitivity curve**:
     - For a sequence of truncation points M (e.g., M = 10, 20, 40, 80, ... up to the grid size), compute the partial sum S_M = sum_{i=1}^M p_i * x_i (with the original ordering) and plot S_M vs M.
     - If S_M does not settle to a limit (or oscillates with amplitude beyond tolerance) as M increases, flag truncation sensitivity.

  5. **Divergence check**:
     - If the partial sums S_M (from the truncation test) grow without bound (in absolute value) as M increases, then the series diverges.

  ### Interpretation of Test Outcomes

  Based on the tests, we classify:

  - **Well-defined finite expectation**: 
     - Grid-refinement stable (changes < 10% when doubling grid points), 
     - Reordering insensitive (range of values under reordering < 10% of the absolute value of the estimate), 
     - Absolute convergence (T = sum p_i |x_i| converges as grid refines), 
     - Truncation curve shows clear convergence.

  - **Divergent expectation**:
     - The truncation curve shows unbounded growth (in either positive or negative direction) and the absolute convergence check fails (T diverges).

  - **Conditionally convergent**:
     - Grid-refinement unstable and/or reordering sensitive, 
     - But the truncation curve does not diverge (it oscillates or converges to different values under different orderings) and the absolute convergence check fails (T diverges).

  - **Poorly estimated (finite but unstable)**:
     - The expectation is finite and absolutely convergent (T converges) but the grid-refinement or truncation test shows instability beyond tolerance (e.g., >10%) at the working grid size. This suggests that the grid is too coarse to estimate the expectation reliably.

  - **Indeterminacy in probabilities**:
     - If the issue is not with the payoff series but with the probability assignments (e.g., the tail probabilities are not sufficiently specified), then we may have a different problem. This might be detected by varying the probability decay (within plausible bounds) and seeing if the expectation changes drastically.

  ### Alternative Reporting Methods

  When the expectation is inadmissible:

  1. **Bounded utility with transform disclosed**:
     - Apply a concave transform (e.g., logarithmic, square root, or a standard utility function) to the payoffs to ensure absolute convergence. Then report the expected transformed payoff, disclosing the transform.
     - Conditions: The transform must render the series absolutely convergent (i.e., the transformed absolute series converges). Also, the transform should be justified (e.g., risk aversion).

  2. **Truncated expectation**:
     - Truncate the series at a fixed cutoff (e.g., by probability: cumulative probability 99.9%) and report the expectation of the truncated distribution, stating the cutoff.
     - Conditions: The truncation point must be chosen independently of the payoff sign (e.g., by probability or by scenario index). The truncated expectation should be stable with respect to small changes in the cutoff.

  3. **Interval for conditionally convergent series**:
     - For conditionally convergent series, compute the range of the expectation over a set of "reasonable" orderings (e.g., descending probability, ascending payoff, descending payoff, and a few random ones). Report an interval (min, max) and note that the true expectation is order-dependent.
     - Conditions: The series is conditionally convergent (so the interval is finite). The orderings chosen should be justifiable (e.g., by natural ordering of the scenarios).

  4. **Stochastic dominance**:
     - Instead of a point estimate, report that the program stochastically dominates (first or second order) a reference alternative over a specified class of utility functions. This avoids the expectation.
     - Conditions: The program must dominate the alternative in the required sense.

  5. **Optimism-pessimism weighting**:
     - Report a weighted average of the best-case and worst-case scenario, or use a criterion like Hurwicz.
     - Conditions: This is more ad hoc and might require justification.

  6. **Comparative assessment**:
     - For comparing two programs, if the difference in payoffs has an absolutely convergent series (even if individually they do not), then report the expected difference. This is useful when the common tail cancels out.
     - Conditions: The difference series must be absolutely convergent.

  ### Escalation to Human

  The procedure should escalate when:
  - The choice of transform (for bounded utility) is not standard and requires risk aversion parameters that are not agreed upon.
  - The choice of truncation point is arbitrary and the result is sensitive to that choice.
  - The interval for conditionally convergent series is too wide, and a decision must be made based on risk appetite.
  - The program involves high stakes and the alternative reporting methods are not satisfactory.

  ### Documentation for Refusal

  If the program has no admissible figure and none of the alternative reporting methods are deemed acceptable (or the escalation leads to a refusal), then the report should state:

  "After analysis, the expectation of net benefit for this program is not well-defined (or too unstable) to report as a single figure. The reasons are [divergence, conditional convergence, etc.]. We are unable to provide a ranked assessment for this program at this time."

  ### Response to Concave Transform Objection

  If someone objects that a concave transform fixes the problem, the analyst should check:
  - Does the transform make the series absolutely convergent? (Run the absolute convergence check on the transformed payoffs.)
  - Is the transform justified? (It imposes risk aversion, which might not be agreed upon by the committee.)
  - Even if it converges, the transformed expectation is not the same as the original net benefit. It is a risk-adjusted measure and must be clearly labeled as such.

  Now, the procedure:

  ---

  **Procedure for Assessing Admissibility of Expected Net Benefit**

  *Step 0: Setup*
  - Input: A model that provides a set of scenarios (with probabilities and payoffs) and allows grid refinement (by splitting scenarios or increasing resolution). The model must be able to generate at least 320 scenarios (if feasible) for testing.

  *Step 1: Initial Computation*
  - Compute the expected net benefit (ENB) with the standard grid (40 scenarios) and record.

  *Step 2: Diagnostic Tests*
  1. **Grid-refinement stability**:
     - Double the grid to 80 scenarios, compute ENB_80.
     - Double again to 160, compute ENB_160.
     - Double again to 320, compute ENB_320.
     - Calculate the relative differences: |ENB_80 - ENB_40|/|ENB_40|, |ENB_160 - ENB_80|/|ENB_80|, |ENB_320 - ENB_160|/|ENB_160|.
     - If any relative difference > 0.1 (10%), flag as unstable.

  2. **Reordering sensitivity**:
     - With the 320-scenario grid (or the finest available), compute ENB under:
          a. Original ordering (by index)
          b. Descending probability
          c. Ascending payoff
          d. Descending payoff
          e. Two random permutations
     - Let the set of ENB values be V. Let the range R = max(V) - min(V).
     - Let reference value = |ENB_320| (or if near zero, use the maximum absolute value in V).
     - If R > 0.1 * max(1, reference value), flag as reordering sensitive.

  3. **Absolute convergence check**:
     - For the same grid sizes (40,80,160,320), compute T_N = sum_{i=1}^N p_i * |x_i|.
     - Check the relative change in T when doubling the grid: |T_80 - T_40|/T_40, etc.
     - If the relative change is > 0.1 and T is growing without bound (or if T_320 is more than twice T_40), flag as not absolutely convergent.

  4. **Truncation-sensitivity curve**:
     - Using the 320-scenario grid (with original ordering), compute partial sums S_M for M=10,20,40,80,160,320.
     - Plot S_M vs M. If the curve does not approach a horizontal asymptote (with fluctuations within 10% of the final value) and instead oscillates or trends without bound, note the behavior.

  5. **Divergence check**:
     - From the truncation curve, if S_M increases (or decreases) monotonically without bound (or beyond any reasonable bound) as M increases, then the series diverges.

  *Step 3: Classification*
  Based on the flags:
  - If no flags from tests 1 and 2 (stable and reordering insensitive) and absolute convergence (no flag from test 3) and truncation curve converges: **Well-defined finite expectation**.
  - If divergence check (test 5) is positive: **Divergent expectation**.
  - If not divergent, but grid-refinement unstable and/or reordering sensitive, and not absolutely convergent: **Conditionally convergent**.
  - If absolutely convergent but grid-refinement unstable (only) at the working grid size (e.g., 40) and stable at 320: **Poorly estimated** (but finite) — note: this might be fixed by using a finer grid.
  - If the absolute convergence check fails and the truncation curve is bounded but not convergent (oscillating) and the grid-refinement is unstable: **Conditionally convergent**.
  - If the probabilities in the tail are not well-specified (e.g., the model does not provide a clear decay rate), then the issue might be **indeterminacy in probabilities**.

  *Step 4: Reporting Alternatives*
  - **Well-defined**: Report the ENB from the finest grid (320) and note that it passed the tests.
  - **Divergent**: 
     - Do not report a finite ENB. 
     - Alternatives: 
          a. Truncated expectation (if truncation at a reasonable point is justifiable and stable) — but note that for divergent series, truncation may be arbitrary and the result may depend heavily on the cutoff.
          b. Report that the series diverges to +∞ (if positive) and note that the program has unbounded upside, but also note the ex-post regret: if we truncate, we might miss a huge benefit, but if we don't, we have no finite value. This is a judgment call and should be escalated.
  - **Conditionally convergent**:
     - Report an interval [min(V), max(V)] from the reordering test (step 2.2). Also note that the expectation is order-dependent.
     - Alternatively, if comparing two programs (A and B) and the difference A-B is absolutely convergent, then report the expected difference (see below).
  - **Poorly estimated**: Use a finer grid (if available) and report that grid size. If the 320-grid is stable, use that. If not, note that the expectation is too sensitive to the grid and consider truncation or alternative reporting.

  Specific alternatives:
  - Apply a concave transform only if:
     a. The transformed series is absolutely convergent (run absolute convergence check on transformed |u(x_i)|).
     b. The transform is standard (e.g., log, sqrt) or agreed upon (by the committee or the unit).
     Then report the expected transformed value and the transform used.
  - Truncated expectation: Choose a truncation by cumulative probability (e.g., 99.9%) and report the ENB of the truncated distribution. Check stability by varying the truncation point (e.g., 99.5% and 99.9%) and ensure the change is <10%. If unstable, do not use.
  - Comparative assessment: For two programs A and B, compute the difference in payoffs for each scenario. Then run the entire admissibility procedure on the difference series. If the difference is well-defined (or absolutely convergent), then report the expected difference E[A-B]. Note: This requires that both programs are defined on the same scenarios (or that the scenarios can be matched).

  *Step 5: Escalation*
  - If the alternative reporting method requires a judgment call (e.g., choice of transform, truncation point, or if the interval is too wide) and there is no clear institutional standard, escalate to the head of the unit and the scientific advisory committee chair, with a clear description of the issue and the alternatives.

  *Step 6: Refusal Documentation*
  - If no alternative is admissible and the escalation does not resolve, document:
     "Program [Name]: The expected net benefit is not well-defined as a single figure due to [reason]. After considering alternatives [list tried], we are unable to provide a ranked assessment. This program requires further methodological development or risk-appetite guidance from the committee."

  *Step 7: Response to Concave Transform Objection*
  - If it is argued that a concave transform fixes the problem, the analyst must:
     a. Check if the transform renders the series absolutely convergent (run absolute convergence on transformed |u(x)|).
     b. If not, then the transform does not solve the problem.
     c. If yes, note that the result is a risk-adjusted measure and not the original net benefit. The transform must be disclosed and justified. If there is no consensus on the degree of risk aversion, this might require escalation.

  ---

  ### Case 1: Solar Geoengineering Field Test

  *Model*:
  - Benefits: modest, near-certain regional cooling (positive payoffs)
  - Risks: small-probability outcomes of both signs (monsoon failure: negative, terminated-shock warming: negative? or positive? avoided heat mortality: positive) with payoffs doubling in magnitude across successive scenario bands.
  - Scenario probabilities decay as a power law, say p_i ∝ i^{-α} for α>0, and payoffs |x_i| ∝ 2^i.

  *Test*:
  - We suspect conditional convergence or divergence.

  *Simulation*:
  Assume:
  - Scenarios i=1,2,...,N.
  - p_i = c * i^{-α} with α=1.5 (for example) and c normalizing constant for the grid.
  - Payoff x_i: for i even, positive (benefit); i odd, negative (risk). And |x_i| = 2^i.

  But note: the doubling of magnitude and power-law decay might lead to divergence or conditional convergence.

  For absolute convergence: T = sum p_i |x_i| = c sum i^{-1.5} * 2^i. This grows geometrically and diverges for any grid size? Actually, the terms i^{-1.5} * 2^i grow exponentially, so the series T diverges very quickly. Thus, the absolute series diverges.

  Now, the original series: S = sum p_i x_i = c [ -2^1/1^{1.5} + 2^2/2^{1.5} - 2^3/3^{1.5} + ... ] 

  This is an alternating series with terms growing in magnitude? But note: the magnitudes are increasing: |a_i| = 2^i / i^{1.5}. Since 2^i grows faster than any power, |a_i| → ∞. Hence, the alternating series test does not apply because the terms do not decrease. In fact, the series diverges because the terms do not go to zero? Actually, the terms a_i = (-1)^i * 2^i / i^{1.5} do not go to zero (they go to infinity). So the series diverges? 

