prompt: |-
  I evaluate behavioural interventions for a regional government, and over several years I have kept encountering a configuration that I can describe precisely but cannot name. In each case the intervention is defended as preserving freedom of choice because the exit is trivially easy, and in each case the exit really is trivially easy at the point where it is offered. What has changed is that the costs of taking it have been moved elsewhere in the process, to a place where no user sees them and no evaluation counts them.

  Three instances, all real in structure if not in detail.

  A utility auto-enrols households into a new tariff. Declining is one click on the enrolment page, and the click registers immediately. That decline option, however, exists only within that page and that session; afterwards the portal presents the tariff as an active service, and the only route out is a paper form. No subsequent bill or letter mentions that the one-click route ever existed. The evaluation report records the opt-out as frictionless, and by the letter it is.

  A welfare-to-work programme lets claimants decline a default appointment slot with a single tap in an app. The tap works. What the app does not say is that declining routes the file to a different processing queue, so that those who tap out wait eleven weeks for the next substantive contact rather than two. Formally free exit; in substance a queue penalty that is nowhere disclosed.

  A hospital cafeteria moves confectionery to a low shelf and keeps it fully available. The shelf label shows the shelf price. At the till, a bundled levy is added to certain items, so the price a patient sees at the point of choosing is not the price that determines the choice. Nothing has been removed; the cost has been relocated from the shelf to the receipt.

  What I am after is the concept, if one exists. I know the neighbouring vocabulary well enough to know it does not cover this. There is a term for friction deliberately piled onto people trying to claim something they are entitled to, and there is interface-design language for subscriptions that are easy to start and hard to stop — but in my cases the visible decision point is genuinely frictionless and, so far as I can tell, nothing is being concealed there. The designers have not added an obstacle; they have relocated an existing one to a different stage, a different medium, a different agency, or a different moment in time. What worries me is that any compliance test inspecting only the moment of choice scores all three as clean. The criterion appears satisfied at the point it examines while being defeated by everything that happens elsewhere in the process.

  So: does this configuration have an established name, and in which literature? If it does, where does the description above strain against it? If it does not, what are the nearest concepts, and for each, what exactly distinguishes my pattern from it — I want the discriminations spelled out, not a list. And if you conclude that nothing fits, coin a term and define it properly, with edges rather than just a label. In particular: does the concept require the relocation to be deliberate, or does it apply to the structure alone? Is it still the same phenomenon when the relocated cost is smaller than the visible one? Where does it shade into ordinary poor service design, and where into outright deception? Does the familiar requirement that opting out be easy need restating so that it survives this, and if so, how? Finally, what would an audit capable of detecting it have to examine, given that any inspection confined to the decision point will miss it by construction?
reasoning: |-
  Okay, the user is evaluating behavioral interventions and has encountered a recurring pattern where the exit option is technically frictionless at the point of choice, but the actual costs are shifted elsewhere in the system. They want to know if there's a term for this, or if not, how to define it. Let me start by understanding the examples they provided.

  First, the utility auto-enrolment: one-click opt-out during enrollment, but later, exiting requires a paper form. The evaluation only sees the initial frictionless step. The cost is moved to after the decision point. Second, the welfare program: tapping out of an appointment routes the user to a slower queue, which isn't disclosed. Again, the friction is delayed. Third, the cafeteria: candy prices are shown on the shelf, but a levy is added at checkout. The cost is relocated to the payment stage.

  The user mentions they're familiar with terms like dark patterns or sludge, but those don't fit because the exit isn't made intentionally hard at the point of choice. Instead, the friction is displaced. So maybe there isn't a specific term for this. I recall concepts like hidden costs or deferred friction, but those might not capture the systemic relocation aspect. 

  Looking into behavioral economics, choice architecture often focuses on the immediate context, not downstream effects. The user’s cases involve temporal displacement—costs moved to a different time or process stage. Also, the relocation might be deliberate, but the user asks if intent matters. The structure itself could be the issue regardless of intent. 

  Possible terms: "Friction Displacement" comes to mind, emphasizing moved barriers. Or "Temporal Cost Shifting," highlighting the time aspect. Another angle is "Decoupling of Choice and Consequence," pointing to the separation between decision and impact. 

  The user also needs to distinguish this from poor design or deception. If the relocation is unintentional, it's poor design. If intentional but undisclosed, it veers toward deception. The cafeteria example with the hidden levy feels deceptive, while the utility's paper form might be oversight. 

  For audits, the user needs to examine the entire process flow, not just the decision point. Mapping the user journey, tracking time delays, and comparing disclosed vs. actual costs would help. Audits must look beyond the immediate interface to downstream consequences. 

  The key insight is that the choice architecture isolates the decision moment, making evaluations incomplete. A restated principle for opt-out ease should include downstream costs. So the term should encapsulate the relocation of costs, whether temporal or procedural, and its systemic nature.
answer: |-
  This configuration is a sophisticated form of **choice architecture manipulation** that lacks a single established term but aligns with concepts across behavioral economics, public administration, and human-computer interaction. I'll break this down systematically:

  ### Core Concept: **Friction Displacement**  
  *Definition:* The strategic relocation of decision costs (time, effort, monetary) from the immediate point of choice to an obscured or deferred stage in a user journey, creating an illusion of frictionless exit while imposing hidden downstream burdens.  

  ### Key Distinctions from Neighboring Concepts:
  1. **"Sludge" (Behavioral Public Policy):**  
     - *Contrast:* Sludge directly increases friction *at* the decision point (e.g., complex opt-out forms). Friction displacement *removes* visible friction but relocates it elsewhere.  
     - *Discrimination:* Sludge is about immediate barriers; displacement is about temporal/spatial decoupling of costs.

  2. **"Dark Patterns" (HCI/UX):**  
     - *Contrast:* Dark patterns deceive users *during* interaction (e.g., disguised opt-out buttons). Here, the interface is transparent *at the choice point*; the deception lies in omitting consequences beyond it.  
     - *Discrimination:* Dark patterns manipulate perception *at decision time*; displacement manipulates *post-decision consequences*.

  3. **"Hidden Costs" (Economics):**  
     - *Contrast:* Traditional hidden costs (e.g., fees in small print) are concurrent with the choice. Displaced costs occur in a separate process phase (e.g., post-decision paperwork).  
     - *Discrimination:* Hidden costs are spatially adjacent; displaced costs are procedurally or temporally detached.

  4. **"Choice Architecture" (Thaler & Sunstein):**  
     - *Contrast:* Standard choice architecture focuses on *how* options are presented. Displacement exploits *when* and *where* costs are incurred, bypassing architecture critiques.  
     - *Discrimination:* It’s not about **nudging** toward a choice but **delaying** the costs of rejecting it.

  ---

  ### Critical Boundaries of the Concept
  - **Deliberateness:** The phenomenon exists structurally but is ethically amplified by intent. Accidental displacement is **systemic negligence**; deliberate relocation is **institutional deception**.  
  - **Cost Magnitude:** The effect persists even if relocated costs are smaller than visible ones, as the *asymmetry of awareness* distorts decision-making.  
  - **Deception Threshold:** Crosses into deception when:  
    a) The existence of relocated costs is actively concealed (e.g., welfare queue delays undisclosed in the app), OR  
    b) The system falsely implies costlessness (e.g., "one-click opt-out" implying no future penalties).  
  - **Poor Design vs. Exploitation:** Distinguish via **foreseeability** and **replicability**. Poor design is isolated; displacement becomes exploitative when replicable patterns show costs consistently moved to "invisible" phases.

  ---

  ### Revised Principle for "Easy Exit"
  **"Frictionless Continuity" Principle:**  
  *An exit option is genuinely easy only if:*  
  1. Costs (time, effort, financial) are *minimized at all stages* of the user journey, AND  
  2. All material consequences of opting out are *explicitly disclosed prior to the decision*.

  ---

  ### Audit Protocol for Detecting Friction Displacement
  1. **Journey Mapping:**  
     - Trace the *entire* user lifecycle before/after the decision point.  
     - Document all touchpoints (digital, physical, temporal) for opting out.  
  2. **Cost Accounting:**  
     - Quantify effort/time/money at each stage (e.g., "post-opt-out paper form: 15 min + postage").  
     - Compare costs at the decision point vs. downstream stages.  
  3. **Disclosure Audit:**  
     - Verify if *all material consequences* are revealed before choice (e.g., "Tapping 'decline' delays next contact by 9 weeks").  
  4. **Agency Shift Analysis:**  
     - Identify where responsibility shifts (e.g., from digital portal to postal system).  
     - Measure friction differences between agency domains.  
  5. **Longitudinal Sampling:**  
     - Track users who opt out to measure *real-world* costs (e.g., time to restore original tariff).  

  ---

  ### Why This Matters
  Friction displacement weaponizes **evaluation blind spots**. It satisfies point-in-time compliance checks while subverting the intent of choice preservation. Recognizing this forces a shift from *interface design* scrutiny to *systemic consequence* mapping—a crucial evolution for ethical behavioral governance.  

  *Recommended literature:* Lunn (2014) on *regulatory partitioning*, Yeung (2017) on *hypernudging*, and the *process transparency* work in CSCW (Computer-Supported Cooperative Work) journals.
