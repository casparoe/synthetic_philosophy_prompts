prompt: |-
  A friend and I argued until two in the morning about whether the result of a referendum can properly be described as expressing what the majority wants, and we have reached an impasse that I believe turns on a conceptual distinction neither of us could state cleanly. I would like you to supply it.

  His view, roughly: a bundled measure is an instrument for smuggling provisions past the electorate. A single yes-or-no question covering a package lets a provision that would lose on its own ride in behind one that would win. Hence the reform proposal he favors — split measures up and vote provision by provision — on the theory that disaggregated voting recovers the genuine popular verdict that the drafting process distorted. Underneath this he holds something stronger, which I want to isolate: that a referendum is legitimate insofar as its outcome *tracks* an antecedent fact about what most voters want, with the ballot functioning as a measuring instrument rather than as the thing that settles the question.

  My view: unbundling does not recover anything, and the tracking picture is itself the confusion. But when I tried to make that concrete I could only gesture, and he reasonably accused me of obscurantism. So I built the following example, and I want to know whether it does the work I think it does.

  A ballot measure contains two provisions: T, a regional sales tax funding a rail line, and H, upzoning of land near the new stations. Voters accept or reject the pair together. The electorate divides into three blocs. Bloc A (40 percent) prefers T without H, then neither, then both, then H without T. Bloc B (40 percent) prefers H without T, then neither, then both, then T without H. Bloc C (20 percent) prefers both, then neither, then the two half-measures, equally last.

  Under his scheme, T passes 60–40 (A plus C) and H passes 60–40 (B plus C), so both provisions are enacted. Under the package vote, "neither" beats both 80–20 and beats each half-measure 60–40. Separate provision-by-provision voting enacts precisely the bundle that four-fifths of the electorate ranks below doing nothing.

  I would like the following explained, with attention to the assumptions rather than the arithmetic:

  1. Why do the two procedures diverge? State the property that preferences over bundles must have in order for item-by-item majority rule to be a faithful decomposition of the question what does the majority want taken as a whole, and say why my three blocs violate it. I believe this property has a standard name; I care about the property, not the label.

  2. There is a wrinkle I noticed but cannot evaluate. Bloc C's votes are expectation-dependent: if C expects H to pass, its ranking tells it to vote yes on T, and if C expects H to fail, the same ranking tells it to vote no. Working through the possibilities, I count exactly two self-consistent profiles — one in which both provisions pass 60–40, and one in which both fail 60–40 and the Condorcet-winning bundle is enacted. Check that. Does the existence of two such profiles help my side or his? Is it evidence that unbundling reintroduces indeterminacy rather than removing it, or an artifact of my assuming C voters reason about the other question at all?

  3. What, precisely, is the difference between "60 percent voted yes" and "60 percent want this"? If the first is supposed to be evidence for the second, what inference connects them, and what would have to be true of the electorate for that inference to be sound?

  4. Is any of this specific to referendums? Logrolling in a legislature is the deliberate manufacture of bundles; division-of-the-question rules and amendment procedures are deliberate unbundling. If the pathology travels intact, what survives of the claim that direct democracy has a distinctive difficulty in expressing a popular will, as against the claim that majority rule over multi-dimensional questions has a difficulty that direct democracy merely displays without the filters a representative assembly supplies?

  5. Two design choices to read against your answer. Switzerland appears to require that a popular initiative preserve a single subject matter, on pain of being declared invalid — a constraint on what citizens may propose, not on how votes are counted. California measures routinely combine a bond, a tax and a regulatory change in one question. Is the first rule best understood as an attempt to enforce the property identified in (1), and if so, why would enforcing it by limiting the initiative power be thought preferable to enforcing it by changing the counting rule?

  I want an explanation, not a survey. Use my example, and tell me where the construction is doing more work than I realized — including whether it is rigged in some way that makes the divergence a curiosity rather than a general feature of bundled ballots.
reasoning: |-
  Okay, let me try to unpack this user's query. They had a late-night argument with a friend about whether referendum results truly express what the majority wants. The friend thinks bundling provisions distorts the popular will, while the user disagrees. The user created an example with three blocs of voters and two provisions, T and H, showing that separate vs. bundled voting leads to different outcomes. 

  First, I need to understand why the two methods diverge. The key seems to be the preferences of the voters. Bloc A and B each prefer one provision alone but dislike the other. Bloc C only wants both together. When voting separately, T and H both pass because A and C support T, B and C support H. But bundled, "neither" wins because A and B both prefer nothing over both together. 

  Hmm, the divergence happens because preferences aren't separable. That means voters' views on one provision depend on the other. The standard term is non-separable preferences. That's crucial here. In the user's example, A's support for T changes if H passes, same for B with H and T. Only Bloc C has separable preferences, but even they care about the combination. So item-by-item voting fails because it forces voters to ignore interdependencies between provisions.

  Now, the user mentioned Bloc C's votes being expectation-dependent. If C expects H to pass, they vote yes on T; if not, they vote no. That creates two possible equilibria: both pass or both fail. This introduces indeterminacy. The friend's unbundling approach doesn't resolve this; it adds uncertainty. Voters have to guess outcomes, which undermines the idea that unbundling reveals a clear popular will. This helps the user's argument by showing unbundling doesn't necessarily recover a stable preference.

  The user asks about the difference between "60% voted yes" and "60% want this." The inference assumes that a yes vote means genuine support. But in bundled votes, voters might support a provision they dislike because they prefer the bundle. The user's example shows that votes in isolation don't reflect true preferences due to strategic voting or non-separable preferences. So the inference is only valid if preferences are separable, which they aren't here.

  Is this specific to referendums? Probably not. Legislative logrolling is similar—bundling to pass unpopular provisions. The issue is with majority rule in multi-dimensional issues. Representative assemblies might have procedures to handle this, like division rules, but the core problem exists there too. So direct democracy highlights the issue but doesn't uniquely cause it.

  The Swiss and California examples are interesting. Switzerland's single-subject rule tries to enforce separability by limiting initiatives. This is a pre-vote constraint to avoid non-separable bundles. California's approach allows bundling, accepting possible preference distortions. The Swiss method is preventive, while changing counting rules (like requiring mutual majority) is complex and might not be practical. The single-subject rule is a simpler, though imperfect, solution.

  The user's example isn't rigged. It's a classic case of a Condorcet paradox in multi-issue voting. The bundled vote enacts the Condorcet winner (neither), while separate voting leads to a worse outcome. This shows that disaggregation can produce suboptimal results when preferences are interdependent. So the example effectively illustrates the general problem.
answer: |-
  Your example is a precise demonstration of a fundamental problem in social choice theory, and it isolates the conceptual crux of your disagreement. Let's break it down:

  **1. Why the Procedures Diverge & The Required Property:**
  The divergence occurs because your voters' preferences violate **Separability (Independence)**. Preferences are separable if a voter's preference ranking over one provision is *independent* of the state of the other provision. In your example, preferences are **non-separable**:

  *   **Bloc A:** Prefers T *only* if H is absent. If H is present, they prefer "neither". Their vote on T *depends* on whether H passes.
  *   **Bloc B:** Prefers H *only* if T is absent. If T is present, they prefer "neither". Their vote on H *depends* on whether T passes.
  *   **Bloc C:** Only wants *both*. Their vote on T *depends* on whether H passes (and vice-versa).

  **Why Separability is Crucial for Faithful Decomposition:**
  Item-by-item majority rule accurately aggregates preferences *only if* voters' preferences over each individual item are separable. If separability holds, a voter's "Yes" vote on an item genuinely means "I want this item *regardless* of what happens with the others." The sum of these votes then reflects the majority's desire for each item independently. Your example violates separability catastrophically:

  *   Blocs A & B *only* want their preferred provision *if the other fails*. In the separate vote, they vote "Yes" on their preferred item hoping the other fails. However, since both pass, they get their *least preferred outcome* (both enacted). Their "Yes" votes for T or H *do not* mean "I want T (or H) under all circumstances" – they mean "I want T (or H) *only if* the other fails."
  *   The bundled vote accurately reflects that for 80% of voters (A & B), the bundle (T&H) is *worse* than "neither". The separate votes create an outcome (T&H) that is the *Condorcet loser* – it loses to "neither" in a head-to-head vote 80-20.

  **2. The Wrinkle: Indeterminacy & Expectations (Bloc C):**
  You've identified a critical complication: **Strategic Voting under Incomplete Information**. Bloc C's optimal vote on T depends on whether H passes, and vice-versa. This creates two possible **Nash Equilibria** in the separate vote game:

  1.  **Both Pass (60-40):** If C expects H to pass, they vote Yes on T (to get their top choice). If C expects T to pass, they vote Yes on H. Bloc A votes Yes on T (expecting H to fail). Bloc B votes Yes on H (expecting T to fail). Expectations are *consistent*, but the outcome (T&H) is the worst for A & B.
  2.  **Both Fail (60-40):** If C expects H to fail, they vote No on T (to avoid T alone, their bottom choice). If C expects T to fail, they vote No on H. Bloc A votes No on H (to block it). Bloc B votes No on T (to block it). Expectations are consistent, and the Condorcet-winning bundle ("neither") is enacted.

  **How This Helps Your Side:**
  This indeterminacy significantly weakens your friend's position:
  *   **Undermines "Recovery":** Unbundling doesn't recover a single "genuine popular verdict." There are *two* possible "verdicts" (both pass or both fail), both self-consistent but radically different. Which one occurs depends on voters' *expectations* about how others will vote – not just their underlying preferences.
  *   **Highlights Instability:** The outcome is fragile and sensitive to coordination, information, or even random fluctuations in expectations. This is the opposite of "tracking" a stable antecedent fact.
  *   **Reintroduces a Filter (Unintentionally):** The representative assembly "filter" your friend might disdain is partly replaced by an *informational/coordination filter* among voters. Voters need to solve a coordination problem to reach an equilibrium, which may not reflect their "true" aggregate preferences effectively. This indeterminacy is *inherent* to the unbundled vote structure with non-separable preferences, not an artifact of your assumption. Rational voters *must* consider the likely outcome of the other vote.

  **3. "60% Voted Yes" vs. "60% Want This":**
  The inference connecting them is: **A "Yes" vote is a sincere expression of preference for the item (or bundle) being considered.**

  *   **Why it Fails in Bundled Votes (Your Friend's Concern):** In a bundle, a "Yes" vote might mean "I prefer *this specific bundle* over the status quo," but it doesn't reveal *why*. Voters might strongly support one part and detest another, feeling coerced. The vote count hides internal conflicts within the bundle. Your friend argues this obscures what voters "want" regarding the *components*.
  *   **Why it Fails *More Severely* in Unbundled Votes (Your Example):** In the separate vote on T, a "Yes" vote from Bloc A does *not* mean "I want T" simpliciter. It means "I want T *only if H fails*." If H passes (as it does), Bloc A *does not want T*. Similarly, Bloc B's "Yes" on H doesn't mean they "want H" if T passes. The vote count (60% Yes on T) *actively misrepresents* the true state of desire under the enacted outcome. Only Bloc C's "Yes" votes mean what they seem ("We want T *and* want H").
  *   **What Must Be True for Sound Inference:**
      *   **For Bundled Votes:** Preferences over the *entire bundle* vs. the status quo must be well-defined and sincerely expressed. The inference "60% want *this bundle*" is valid, but it says nothing about components.
      *   **For Unbundled Votes:** **Separability must hold.** A voter's "Yes" on an item must genuinely mean "I want this item implemented *regardless* of the outcome on other items being voted on simultaneously." If separability fails, the vote on one item becomes contingent on others, making the simple count meaningless as an indicator of desire under the actual multi-item outcome.

  **4. Generality Beyond Referendums:**
  The pathology is **not specific to referendums**; it is inherent to **majority rule over multiple interdependent policy dimensions**. It travels intact:

  *   **Legislative Logrolling & Bundling:** This *is* the deliberate creation of a package vote to pass items that couldn't pass alone (exactly what your friend fears in referendums). A coalition trades votes on their low-priority items to secure their high-priority ones.
  *   **Division of Question/Amendment Procedures:** These are attempts at "unbundling" within the legislature. Their purpose is often *precisely* to expose or kill unpopular provisions that were being carried by a popular bundle, or to find a stable compromise – mirroring the motivations in your referendum debate.
  *   **Survival of the Claim:** What survives is the recognition that **direct democracy lacks institutional mechanisms to manage interdependence and enforce separability.** A representative assembly *can* (though doesn't always) employ filters:
      *   **Agenda Control:** Leadership structures can sequence votes or bundle strategically.
      *   **Amendment & Debate:** Allows exploration of preferences and crafting of compromises *before* a final vote.
      *   **Repeated Interaction:** Legislators build reputations and enforce logrolling deals over time.
      *   **Division Rules:** Explicit procedures to force separate votes on contentious parts.
      Direct democracy, especially via initiative, often presents voters with a stark, pre-defined, take-it-or-leave-it bundle *designed* by proponents precisely to exploit non-separabilities (like Bloc C bundling T&H). The "distinctive difficulty" is the **inability to negotiate or amend the proposal in response to revealed preferences** during the voting process itself. The core problem (majority rule over dimensions) is the same; direct democracy often presents it in its most unfiltered and strategically manipulable form.

  **5. Design Choices: Switzerland vs. California**

  *   **Switzerland's Single-Subject Rule:** This is **absolutely an attempt to enforce separability (or at least reduce non-separability)**. The assumption is that provisions within a single "subject matter" are more likely to have preferences that are interdependent in a coherent way (e.g., funding and regulation for the *same* project) or at least less likely to involve blatant logrolling across entirely unrelated domains (e.g., "Save the Puppies Act" bundled with "Tax Break for MegaCorp"). It tries to ensure the bundle voters face has some inherent logical connection, making "sincere" voting on the bundle as a whole more meaningful. It's enforced on the initiative power because:
      *   **Practicality:** It's far simpler to police *what gets on the ballot* ("Is this one subject?") than to design a new counting rule *after* a multi-subject vote occurs. What would the counting rule even be? (See below).
      *   **Clarity & Legitimacy:** Voters and courts can more easily understand and apply a "single subject" test than a complex post-hoc analysis of preference interdependencies.
      *   **Preventing Manipulation:** It directly targets the "smuggling" your friend fears by making blatant, unrelated logrolling bundles invalid from the start.
  *   **California's Practice:** Allows strategic bundling. Proponents can combine popular elements (e.g., a bond for schools) with less popular ones (e.g., a regulatory change or tax) to increase the chance the *whole package* passes, relying on the non-separability of voter preferences (some voters wanting schools enough to accept the tax, others wanting the tax change enough to accept the bond). This maximizes flexibility for proponents but creates the pathologies your example illustrates.
  *   **Why Not Change the Counting Rule?** Enforcing separability via a counting rule is conceptually difficult and practically fraught:
      *   **Mutual Majority?** You could require an item to pass *only* if it gets majority support *even when* assuming the *other* items in a potential bundle pass. But how do you define the potential bundle? How many items? This gets computationally complex and opaque to voters.
      *   **Condorcet Methods?** Finding the Condorcet winner among all possible bundles (neither, T only, H only, both) is theoretically ideal but practically impossible for voters (ranking 4+ options is burdensome) and complex to tally/explain.
      *   **Simultaneous Vote Equilibrium?** As your indeterminacy point shows, finding a stable outcome with separate votes on interdependent items is non-trivial and expectation-dependent.
      The Swiss single-subject rule is a blunt but **administrable pre-commitment device** aimed at reducing the *severity* of non-separability problems by keeping bundles conceptually coherent. It accepts that some interdependence remains within a subject but tries to eliminate the most egregious logrolling across unrelated domains.

  **Evaluation of Your Example:**

  *   **Not Rigged:** Your example is **not a curious artifact**; it's a canonical illustration of the **paradox of multiple elections** or **logrolling failure**. It perfectly demonstrates the core issue: **When preferences are non-separable, sequential or separate majority voting on individual items can lead to outcomes that are Pareto-inferior (worse for everyone) or Condorcet losers compared to the bundled vote outcome.** The result (T&H enacted) is actively disliked by 80% of voters *under the enacted state*, while the bundled vote produces the Condorcet winner ("neither").
  *   **Doing More Work:** Your example brilliantly highlights two key points:
      1.  **The Primacy of the Bundle:** The "popular will" is inherently about *outcomes* (which bundle is enacted), not about abstract approval of components. The outcome (T&H) is rejected by 80% *as an outcome*. The separate votes generate approval signals that are *contingent* and *misleading* under the actual outcome.
      2.  **The Myth of the Antecedent Fact:** There is no single, stable "what the majority wants" regarding T and H independently *because* preferences are interdependent. The "fact" changes based on the context (what else passes). Unbundling doesn't recover it; it either creates indeterminacy or generates an outcome that contradicts the majority's revealed preference over the *actual results*.

  **Conclusion:**
  The fundamental conceptual distinction is **Separability vs. Non-Separability of Preferences**. Your friend's "tracking" view implicitly assumes separability holds: that a vote on T reveals a stable desire for T independent of H. Your example shows this assumption fails dramatically. When preferences are non-separable (common in politics), the meaning of a vote on one item depends critically on the status of others. Unbundling doesn't recover a "true" will; it either creates indeterminacy reliant on expectations (as with Bloc C) or can produce an outcome that is majority-dominated by the bundled status quo alternative. The bundled vote, while potentially coercive, can produce a stabler and more consensual outcome *over the actual result*. The pathology stems from multi-dimensional majority rule itself; direct democracy often manifests it acutely due to the lack of negotiation and amendment inherent in the initiative process. Rules like single-subject requirements are attempts to mitigate non-separability by limiting bundle composition.
